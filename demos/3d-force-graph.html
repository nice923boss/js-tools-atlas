<script type="module">
// 3d-force-graph showcase: eight scenes from the npm dependency galaxy to a node-count stress ramp.
import ForceGraph3D from "https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.1/+esm";
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.186.1/+esm";
import { forceX, forceY, forceZ, forceCollide } from "https://cdn.jsdelivr.net/npm/d3-force-3d@3.0.6/+esm";

const POST = "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/postprocessing/";
const COLORS = ["#4cc9f0", "#7bd389", "#f7df1e", "#f72585", "#9d8cff", "#ff8c42"];
const FONT = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif';
const MONO = 'Consolas, "Cascadia Code", ui-monospace, monospace';
const BG = "#0b0d10";
const ORIGIN = { x: 0, y: 0, z: 0 };

// Seeded LCG so every visit shows the same fictional data.
function rng(seed) {
  return () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
}

// One WebGL graph inside a box that follows its own size. Teardown also drops the GL context,
// because _destructor() disposes the renderer but leaves the context alive.
const killers = new WeakMap();
function makeGraph(ctx, box, opts = {}) {
  const g = new ForceGraph3D(box, opts).backgroundColor(BG).showNavInfo(false);
  const fit = () => g.width(box.clientWidth).height(box.clientHeight);
  fit();
  const ro = new ResizeObserver(() => ctx.active && fit());
  ro.observe(box);
  let dead = false;
  const kill = () => {
    if (dead) return;
    dead = true;
    ro.disconnect();
    const gl = g.renderer().getContext();
    g._destructor();
    gl.getExtension("WEBGL_lose_context")?.loseContext();
    box.replaceChildren();
  };
  killers.set(g, kill);
  ctx.onCleanup(kill);
  return g;
}
const killGraph = (g) => killers.get(g)?.();

// zoomToFit() fits the eight corners of the bounding box, which leaves a round 3D cloud looking small
// when viewed at an angle. This measures the node objects themselves along the current view direction.
function frame(g, ms = 600, pad = 1.12) {
  const ps = g.graphData().nodes.map((n) => n.__threeObj?.position).filter(Boolean);
  if (!ps.length) return;
  const cam = g.camera();
  const c = new THREE.Box3().setFromPoints(ps).getCenter(new THREE.Vector3());
  const fwd = cam.getWorldDirection(new THREE.Vector3());
  const right = new THREE.Vector3().crossVectors(fwd, cam.up).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  const tv = Math.tan((cam.fov * Math.PI) / 360), th = tv * cam.aspect, v = new THREE.Vector3();
  let d = 0;
  for (const p of ps) {
    v.subVectors(p, c);
    d = Math.max(d, Math.max(Math.abs(v.dot(up)) / tv, Math.abs(v.dot(right)) / th) - v.dot(fwd));
  }
  d = d * pad + 20;
  g.cameraPosition({ x: c.x - fwd.x * d, y: c.y - fwd.y * d, z: c.z - fwd.z * d }, c, ms);
}

// Keep the camera framed while the layout spreads out, once more when it settles,
// and stop as soon as the user drags or zooms.
function autoFit(ctx, g, box) {
  let done = false;
  ctx.on(box, "pointerdown", () => { done = true; });
  ctx.on(box, "wheel", () => { done = true; }, { passive: true });
  g.onEngineStop(() => { if (!done) { done = true; frame(g, 800); } });
  ctx.timeout(() => done || frame(g, 0), 200);
  ctx.interval(() => done || frame(g, 500), 700);
}

// Split each frame into simulation time and update+render time. The graph runs its own
// requestAnimationFrame loop; one ctx.raf registered before it and one after bracket it.
function timed(ctx, make) {
  const t = { a: 0, at: 0, ticked: false, sim: 0, draw: 0, tickMs: 0, ticks: 0 };
  ctx.raf(() => { t.a = performance.now(); t.ticked = false; });
  const g = make().onEngineTick(() => {
    t.at = performance.now(); t.ticked = true; t.ticks++;
    t.tickMs += (t.at - t.a - t.tickMs) * 0.15;
  });
  ctx.raf(() => {
    const b = performance.now();
    t.sim += ((t.ticked ? t.at - t.a : 0) - t.sim) * 0.1;
    t.draw += (b - (t.ticked ? t.at : t.a) - t.draw) * 0.1;
  });
  return { g, t };
}

// Text drawn on a canvas texture with a dark outline, shown as a camera-facing sprite.
function textSprite(text, color, { height = 6, font = FONT, weight = 600 } = {}) {
  const fs = 48, pad = 10;
  const c = document.createElement("canvas");
  const x = c.getContext("2d");
  const f = `${weight} ${fs}px ${font}`;
  x.font = f;
  c.width = Math.ceil(x.measureText(text).width) + pad * 2;
  c.height = fs + pad * 2;
  x.font = f;
  x.textBaseline = "middle";
  x.lineJoin = "round"; x.lineWidth = 9; x.strokeStyle = "rgba(11, 13, 16, .85)";
  x.strokeText(text, pad, c.height / 2);
  x.fillStyle = color;
  x.fillText(text, pad, c.height / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  s.scale.set((height * c.width) / c.height, height, 1);
  return s;
}

// Groups of nodes: a random tree inside each group, extra inner links and a few bridges.
function clusters(r, groups, per, { extra = 0.35, bridges = 0.05 } = {}) {
  const nodes = [], links = [];
  for (let gi = 0; gi < groups; gi++) {
    const base = nodes.length;
    for (let i = 0; i < per; i++) {
      nodes.push({ id: nodes.length, g: gi, v: 1 + Math.floor(r() * r() * 6), hub: i === 0 });
      if (i) links.push({ source: base + i, target: base + Math.floor(r() * i) });
      if (i > 2 && r() < extra) links.push({ source: base + i, target: base + Math.floor(r() * i) });
    }
  }
  for (let k = 0; k < nodes.length * bridges; k++) {
    const a = nodes[Math.floor(r() * nodes.length)], b = nodes[Math.floor(r() * nodes.length)];
    if (a.g !== b.g) links.push({ source: a.id, target: b.id });
  }
  return { nodes, links };
}

  ["chart.js", "viz", "@kurkle/color"], ["@kurkle/color", "viz"],
  ["3d-force-graph", "viz", "three", "three-forcegraph"], ["three-forcegraph", "viz", "three", "d3-force-3d"], ["d3-force-3d", "viz", "d3-quadtree", "d3-timer"],
];
function npmData() {
  const nodes = PKGS.map(([id, cat]) => ({ id, cat, deps: [], users: [] }));
  const byId = new Map(nodes.map((n) => [n.id, n]));
  const links = [];
  for (const [id, , ...deps] of PKGS) {
    for (const d of deps) {
      links.push({ source: id, target: d });
      byId.get(id).deps.push(d);
      byId.get(d).users.push(id);
    }
  }
  return { nodes, links };
}

function fileKind(name) {
  if (TREE[name]) return 0;
  const ext = name.split(".").pop();
  return { vue: 1, ts: 2, css: 3, html: 4, svg: 4, png: 4, jpg: 4 }[ext] ?? 5;
}
function treeData() {
  const nodes = [], links = [];
  const walk = (name, path, parent) => {
    nodes.push({ id: path, name, kind: fileKind(name) });
    if (parent) links.push({ source: parent, target: path });
    (TREE[name] || []).forEach((c) => walk(c, `${path}/${c}`, path));
  };
  walk("atlas-app", "atlas-app", null);
  return { nodes, links };
}

const legendHtml = (items) => items.map(([label, color]) => `<i style="background:${color}"></i>${label}`).join("");

Showcase.run({ scenes: [
  {

    api: "new ForceGraph3D(el).nodeThreeObject(fn).nodeThreeObjectExtend(true).cameraPosition(pos, lookAt, ms)",

    mount(ctx) {
      ctx.html(`<div class="f3-box"></div>

      const $legend = card.querySelector(".legend"), $deps = card.querySelector(".deps");
      $legend.innerHTML = Object.values(CATS).map((c) => `<span><i style="background:${c.color}"></i>${c.label}</span>`).join("");
      let selected = null;
      const spin = ctx.toggle("自動旋轉", true, (v) => { g.controls().autoRotate = v; });
      ctx.button("回到全景", () => { select(null); frame(g, 1000); });

      const g = makeGraph(ctx, ctx.$(".f3-box"), { controlType: "orbit" })
        .cooldownTicks(150)
        .graphData(npmData())
        .nodeVal((n) => 1 + n.users.length * 2.2)
        .nodeRelSize(3.5)
        .nodeOpacity(0.95)
        .nodeResolution(16)
        .nodeColor((n) => {
          if (!selected) return CATS[n.cat].color;
          if (n === selected) return "#ffffff";
          return selected.deps.includes(n.id) || selected.users.includes(n.id) ? CATS[n.cat].color : "#2a2e35";
        })
        .nodeLabel((n) => `${n.id}（${CATS[n.cat].label}）`)
        .nodeThreeObjectExtend(true)
        .nodeThreeObject((n) => {
          const s = textSprite(n.id, "#ecebe6", { font: MONO });

        })
        .linkColor((l) => (selected && (l.source === selected || l.target === selected) ? "#f7df1e" : "rgba(180,190,210,0.35)"))
        .linkWidth((l) => (selected && (l.source === selected || l.target === selected) ? 1.2 : 0))
        .linkOpacity(0.5)
        .linkDirectionalArrowLength(3)
        .linkDirectionalArrowRelPos(1)

        .linkDirectionalParticleWidth(1.2)

        .onNodeClick(focus)

        .cooldownTicks(200)
        .graphData({ nodes, links })
        .nodeColor("color")
        .nodeVal((n) => (n.depth ? 1 : 6))
        .nodeRelSize(3)
        .nodeOpacity(1)
        .nodeLabel((n) => `第 ${n.depth} 層・節點 ${n.id}`)
        .linkColor((l) => nodes[l.to].color)
        .linkOpacity(0.35)
        .linkDirectionalParticles(2)
        .linkDirectionalParticleWidth(1.6)
        .linkDirectionalParticleSpeed(0.008)
        .linkDirectionalParticleColor((l) => nodes[l.from].color);
      g.controls().autoRotate = true;
      g.controls().autoRotateSpeed = 1.2;
      autoFit(ctx, g, box);
      ctx.fps({ position: "right bottom" });

      const [{ UnrealBloomPass }, { OutputPass }] = await Promise.all([
        import(`${POST}UnrealBloomPass.js/+esm`), import(`${POST}OutputPass.js/+esm`),
      ]);
      if (!ctx.active) return;
      bloom = new UnrealBloomPass(new THREE.Vector2(box.clientWidth, box.clientHeight), P.strength, P.radius, P.threshold);
      bloom.enabled = P.on;
      // OutputPass does the final sRGB conversion, so colours stay the same with bloom on or off.
      const output = new OutputPass();
      g.postProcessingComposer().addPass(bloom);
      g.postProcessingComposer().addPass(output);
      ctx.onCleanup(() => { bloom.dispose(); output.dispose(); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "g.graphData(n 個節點).d3AlphaMin(0).cooldownTicks(Infinity)",
    desc: "隨機樹狀網絡逐級加到一萬六千個節點，三維力模擬不停止。分開計時 d3-force-3d 模擬與「更新位置＋WebGL 繪圖」，並顯示每格的 GPU 繪圖呼叫數，可關掉連線或加上粒子比較。",
    hint: "按「自動加壓」開始・切換粒子、連線或模擬後再測一次",
    mount(ctx) {
      ctx.html(`<div class="f3-stress"><div class="f3-box"></div></div>`);
      ctx.controls.classList.add("bottom");
      let particles = false, showLinks = true, sim = true, linkCount = 0;
      ctx.toggle("粒子", false, (v) => { particles = v; g.linkDirectionalParticles(v ? 1 : 0); });
      ctx.toggle("連線", true, (v) => { showLinks = v; g.linkVisibility(v); });
      ctx.toggle("模擬", true, (v) => { sim = v; g.cooldownTicks(v ? Infinity : 0); if (v) g.d3ReheatSimulation(); });
      const { g, t } = timed(ctx, () => makeGraph(ctx, ctx.$(".f3-stress .f3-box"))
        .enablePointerInteraction(false)
        .d3AlphaMin(0).cooldownTicks(Infinity).cooldownTime(Infinity)
        .nodeRelSize(3)
        .nodeResolution(6)
        .nodeOpacity(1)
        .nodeColor((n) => COLORS[n.g])
        .linkColor(() => "#8a94a8")
        .linkOpacity(0.25)
        .linkDirectionalParticleWidth(1.5)
        .linkDirectionalParticleSpeed(0.01)
        .linkDirectionalParticleColor("c"));
      const info = g.renderer().info.render;
      // Random tree (each node joins an earlier one, inheriting its colour) plus 20% shortcut links.
      function build(n) {
        const r = rng(n), nodes = [], links = [];
        for (let i = 0; i < n; i++) {
          const p = i ? Math.floor(r() * i) : -1;
          nodes.push({ id: i, g: i < 6 ? i : nodes[p].g });
          if (i) links.push({ source: i, target: p, c: COLORS[nodes[i].g] });
        }
        for (let k = 0; k < n * 0.2; k++) {
          const a = Math.floor(r() * n), b = Math.floor(r() * n);
          if (a !== b) links.push({ source: a, target: b, c: COLORS[nodes[a].g] });
        }
        linkCount = links.length;
        return { nodes, links };
      }
      ctx.interval(() => frame(g, 400, 1.05), 1500);
      ctx.ramp({
        label: "節點", unit: "個", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000], initial: 1, minFps: 30,
        apply(n) {
          g.graphData(build(n));
          if (!sim) g.cooldownTicks(0);
          ctx.timeout(() => frame(g, 300, 1.05), 300);
        },
        metrics: () => ({
          連結: linkCount,
          模擬: `${t.sim.toFixed(1)} ms`,
          繪圖: `${t.draw.toFixed(1)} ms`,
          繪圖呼叫: info.calls,
          三角形: info.triangles,
          模式: [sim ? "模擬" : "靜止", showLinks ? "連線" : "無連線", particles && "粒子"].filter(Boolean).join("＋"),
        }),
        note: "每個節點是一個 three.js Mesh、每條連線是一條 Line，物件數與 GPU 繪圖呼叫幾乎跟著節點數線性成長，這是 3D 版最先碰到的瓶頸。每格先跑一次 d3-force-3d 三維模擬，再更新所有物件位置並用 WebGL 繪圖，兩段分開計時。關「模擬」只量繪圖；關「連線」物件少一半；開「粒子」每條連線多一顆球體 Mesh。已關閉滑鼠射線偵測（enablePointerInteraction(false)）。",
      });
    },
  },
] });
</script>
</body>
</html>
