<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// 3Dmol.js showcase: viewer, style grid, colour schemes, surfaces, picking, vibrations, sequence, stress.
const DARK = "#0e1013";
const SDF = document.getElementById("caffeine").textContent.replace(/^\n/, "");
const ELEM = {
  C: ["碳", 12.011], H: ["氫", 1.008], N: ["氮", 14.007], O: ["氧", 15.999], S: ["硫", 32.06],
};
const hex = (n) => "#" + (n >>> 0).toString(16).padStart(6, "0");
const elemHex = (e) => hex($3Dmol.elementColors.Jmol[e] ?? 0xcccccc);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const f2 = (v) => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2);
const ONE = { ALA: "A", ARG: "R", ASN: "N", ASP: "D", CYS: "C", GLN: "Q", GLU: "E", GLY: "G", HIS: "H", ILE: "I",
  LEU: "L", LYS: "K", MET: "M", PHE: "F", PRO: "P", SER: "S", THR: "T", TRP: "W", TYR: "Y", VAL: "V" };
// Kyte-Doolittle hydropathy index
const KD = { ALA: 1.8, ARG: -4.5, ASN: -3.5, ASP: -3.5, CYS: 2.5, GLN: -3.5, GLU: -3.5, GLY: -0.4, HIS: -3.2, ILE: 4.5,
  LEU: 3.8, LYS: -3.9, MET: 1.9, PHE: 2.8, PRO: -1.6, SER: -0.8, THR: -0.7, TRP: -0.9, TYR: -1.3, VAL: 4.2 };
const lerpHex = (a, b, t) => {
  const ch = (s) => [(s >> 16) & 255, (s >> 8) & 255, s & 255];
  const A = ch(a), B = ch(b), r = A.map((x, i) => Math.round(x + (B[i] - x) * t));
  return (r[0] << 16) | (r[1] << 8) | r[2];
};
const kdColor = (v) => (v < 0 ? lerpHex(0xeeeeee, 0x2f6fd6, Math.min(1, -v / 4.5)) : lerpHex(0xeeeeee, 0xff7a1a, Math.min(1, v / 4.5)));
const kdAtom = (a) => kdColor(KD[a.resn] ?? 0);
const resnMap = (fn) => ({ prop: "resn", map: Object.fromEntries(Object.keys(ONE).map((r) => [r, fn(r)])) });
const chargeOf = (r) => (r === "ARG" || r === "LYS" ? 0x3a6df0 : r === "ASP" || r === "GLU" ? 0xf03a4a : 0xe8e8e8);

// 1CRN ships with the page (demos/assets/3dmoljs); cache the text across scenes.
let crnP = null;
const getCrambin = () => (crnP ||= fetch("assets/3dmoljs/1crn.pdb")
  .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
  .catch((e) => { crnP = null; throw e; }));

function layout(ctx, side = true) {
  ctx.html(`<div class="dm-wrap${side ? "" : " full"}"><div class="dm-view"></div>${side ? '<aside class="dm-side"></aside>' : ""}</div>`);
  return { view: ctx.$(".dm-view"), side: ctx.$(".dm-side") };
}

// Release every viewer and its WebGL context when the scene unmounts.
function track(ctx, host, viewers) {
  const ro = new ResizeObserver(() => viewers.forEach((v) => { v.resize(); v.render(); }));
  ro.observe(host);
  ctx.onCleanup(() => {
    ro.disconnect();
    for (const v of viewers) {
      try { v.spin(false); v.stopAnimate(); v.clear(); } catch (e) { console.warn("[3dmol] clear failed", e); }
      const gl = v.renderer && v.renderer.context;
      if (gl && !gl.isContextLost()) gl.getExtension("WEBGL_lose_context")?.loseContext();
    }
    host.querySelectorAll("canvas").forEach((c) => c.remove());
  });
}
function viewerIn(ctx, host, cfg = {}) {
  const v = $3Dmol.createViewer(host, { antialias: true, ...cfg });
  v.setBackgroundColor(DARK, 0);
  v.setHoverDuration(60);
  track(ctx, host, [v]);
  return v;
}

async function withCrambin(ctx, host) {
  const box = document.createElement("div");
  box.className = "dm-load";
  box.textContent = "載入 1CRN 蛋白質座標…";
  host.append(box);
  try {
    const txt = await getCrambin();
    box.remove();
    return ctx.active ? txt : null;
  } catch (e) {
    box.textContent = `蛋白質座標載入失敗（${e.message}）。此檔放在 assets/3dmoljs/1crn.pdb，請用本機伺服器開啟頁面。`;
    return null;
  }
}

// Yellow hover tag above an atom; name(atom) builds the text.
function hoverTag(v, name, onAtom) {
  let lab = null;
  v.setHoverable({}, true, (a) => {
    if (lab) v.removeLabel(lab);
    lab = v.addLabel(name(a), { position: a, fontSize: 12, fontColor: DARK, backgroundColor: "#f7df1e", backgroundOpacity: 0.95, inFront: true, alignment: "bottomCenter" });
    onAtom?.(a);
    v.render();
  }, () => { if (lab) { v.removeLabel(lab); lab = null; v.render(); } });
  return { drop() { lab = null; } };
}

function formula(atoms) {
  const n = {};
  for (const a of atoms) n[a.elem] = (n[a.elem] || 0) + 1;
  const order = Object.keys(n).sort((a, b) => (a === "C" ? -1 : b === "C" ? 1 : a === "H" ? -1 : b === "H" ? 1 : a.localeCompare(b)));
  return order.map((e) => e + (n[e] === 1 ? "" : `<sub>${n[e]}</sub>`)).join("");
}
const ssSegments = (atoms, ss) => atoms.filter((a) => a.atom === "CA")
  .reduce((n, a, i, arr) => n + (a.ss === ss && (i === 0 || arr[i - 1].ss !== ss) ? 1 : 0), 0);

const gradCss = (fn, lo, hi, n = 12) =>
  `linear-gradient(90deg, ${Array.from({ length: n }, (_, i) => hex(fn(lo + ((hi - lo) * i) / (n - 1)))).join(", ")})`;
const gradOf = (Kind, lo, hi) => { const g = new Kind(lo, hi); return (v) => g.valueToHex(v); };

const BALLSTICK = { stick: { radius: 0.14, colorscheme: "Jmol" }, sphere: { scale: 0.26, colorscheme: "Jmol" } };

Showcase.run({ scenes: [
  // 1. Signature viewer: caffeine SDF / crambin PDB, style switch, hover info, labels, spin
  {
    id: "viewer", title: "分子檢視器", api: "createViewer・addModel・setStyle・setHoverable",
    desc: "同一個檢視器載入頁內 SDF 的咖啡因與 PDB 格式的蛋白質 Crambin，切換六種呈現樣式，滑鼠停在原子上即時顯示元素與座標。",
    hint: "拖曳旋轉・滾輪縮放・右鍵拖曳平移・滑鼠停在原子上看資訊",
    async mount(ctx) {
      const { view, side } = layout(ctx);
      side.innerHTML = `<h2></h2><p class="dm-desc"></p><h3>分子資訊</h3><dl class="dm-rd"></dl><div class="dm-card">把滑鼠移到原子上，這裡會顯示元素、編號與座標。</div>`;
      const v = viewerIn(ctx, view);
      const STY = {
        ballstick: ["球棍", () => BALLSTICK],
        sphere: ["空間填充", () => ({ sphere: { colorscheme: "Jmol" } })],
        stick: ["棒狀", () => ({ stick: { radius: 0.2, colorscheme: "Jmol" } })],
        line: ["線條", () => ({ line: { colorscheme: "Jmol" } })],
        surface: ["表面", () => ({ stick: { radius: 0.14, colorscheme: "Jmol" } })],
        cartoon: ["卡通", () => ({ cartoon: { color: "spectrum" } })],
      };
      const MOL = [
        { key: "caffeine", name: "咖啡因 Caffeine", fmt: "sdf", style: "ballstick",
          desc: "咖啡與茶裡的興奮劑分子。座標取自 PubChem 3D 構形（CID 2519），以 SDF 文字內嵌在頁面中。" },
        { key: "crambin", name: "結晶蛋白 Crambin", fmt: "pdb", style: "cartoon",
          desc: "十字花科種子裡的小型蛋白質，46 個胺基酸、3 組雙硫鍵（PDB 1CRN）。卡通模式依序號由藍到紅上色。" },
      ];
      let cur = MOL[0], style = "ballstick", model = null, labels = false, token = 0;
      const no = (a) => (cur.key === "caffeine" ? a.index + 1 : a.serial);
      const card = side.querySelector(".dm-card");
      const hov = hoverTag(v, (a) => (cur.key === "crambin" ? `${a.resn} ${a.resi}・${a.atom}` : `${a.elem}${no(a)}`), (a) => {
        const e = ELEM[a.elem] || [a.elem, 0];
        card.innerHTML = `<span class="dm-dot" style="background:${elemHex(a.elem)}"></span><b>${a.elem}</b>（${e[0]}）原子 #${no(a)}`
          + (cur.key === "crambin" ? `<br>胺基酸 <b>${a.resn} ${a.resi}</b>，原子名 ${esc(a.atom)}` : `<br>鍵結數 ${a.bonds.length}`)
          + `<br>座標 (${[a.x, a.y, a.z].map(f2).join(", ")}) Å`;
      });

      function applyStyle() {
        v.removeAllSurfaces();
        // Translucent surfaces composite too dark over a transparent canvas, so go opaque.
        v.setBackgroundColor(DARK, style === "surface" ? 1 : 0);
        v.setStyle({}, STY[style][1]());
        if (style === "cartoon") v.setStyle({ resn: "CYS", atom: ["CA", "CB", "SG"] }, { cartoon: { color: "spectrum" }, stick: { radius: 0.22, colorscheme: "Jmol" } });
        if (style === "surface") v.addSurface($3Dmol.SurfaceType.VDW, { opacity: 0.72, colorscheme: "Jmol" }, {});
        v.render();
      }
      function drawLabels() {
        v.removeAllLabels();
        hov.drop();
        if (labels && model) {
          const o = { fontSize: 11, fontColor: "white", backgroundColor: DARK, backgroundOpacity: 0.72, borderThickness: 0, inFront: true, alignment: "center" };
          if (cur.key === "caffeine") for (const a of model.selectedAtoms({ elem: ["C", "N", "O"] })) v.addLabel(`${a.elem}${no(a)}`, { ...o, position: a });
          else {
            for (const a of model.selectedAtoms({ resn: "CYS", atom: "SG" })) v.addLabel(`Cys${a.resi}`, { ...o, fontColor: "#ffff60", position: a });
            for (const a of model.selectedAtoms({ atom: "CA", resi: [1, 46] })) v.addLabel(a.resi === 1 ? "N 端" : "C 端", { ...o, position: a });
          }
        }
        v.render();
      }
      function resetView() {
        v.zoomTo();
        if (cur.key === "caffeine") v.rotate(-35, "x");
        v.zoom(cur.key === "caffeine" ? 0.82 : 1.05);
        v.render();
      }
      function showInfo() {
        const atoms = model.selectedAtoms({});
        const bonds = atoms.reduce((s, a) => s + a.bonds.length, 0) / 2;
        const rows = [[cur.key === "caffeine" ? "分子式" : "重原子組成", formula(atoms)], ["原子數", atoms.length], ["化學鍵", bonds]];
        if (cur.key === "caffeine") rows.push(["分子量", `${atoms.reduce((s, a) => s + (ELEM[a.elem] || [0, 0])[1], 0).toFixed(2)} g/mol`]);
        else rows.push(["胺基酸", new Set(atoms.map((a) => a.resi)).size], ["二級結構", `螺旋 ${ssSegments(atoms, "h")}・β 股 ${ssSegments(atoms, "s")}`]);
        side.querySelector("dl").innerHTML = rows.map(([k, val]) => `<dt>${k}</dt><dd>${val}</dd>`).join("");
      }
      async function load(m) {
        const my = ++token;
        cur = m;
        side.querySelector("h2").textContent = m.name;
        side.querySelector(".dm-desc").textContent = m.desc;
        cartoonOpt.disabled = m.key === "caffeine";
        style = m.style;
        sel.value = style;
        const data = m.key === "caffeine" ? SDF : await withCrambin(ctx, view);
        if (!data || my !== token) return;
        v.clear();
        hov.drop();
        model = v.addModel(data, m.fmt);
        applyStyle();
        resetView();
        showInfo();
        drawLabels();
      }

  // 5. Picking: setClickable, distance / angle / dihedral with shapes and labels
  {
    id: "measure", title: "點選量測", api: "setClickable・addCylinder・addSphere・addLabel",
    desc: "點選咖啡因的原子：兩個量鍵長、三個量鍵角、四個量二面角。量測值由原子座標即時計算，並用虛線圓柱與標籤畫在 3D 場景裡。",
    hint: "依序點選 2 到 4 個原子；第 5 次點選重新開始",
    mount(ctx) {
      const { view, side } = layout(ctx);
      side.innerHTML = `<h2>已選原子</h2><table class="dm-tbl dm-picked"></table><h3>量測結果</h3><table class="dm-tbl dm-meas"></table><div class="dm-card"></div>`;
      const v = viewerIn(ctx, view);
      const m = v.addModel(SDF, "sdf");
      v.setStyle({}, BALLSTICK);
      const atoms = m.selectedAtoms({});
      const no = (a) => `${a.elem}${a.index + 1}`;
      let picked = [];
      const sub = (a, b) => [a.x - b.x, a.y - b.y, a.z - b.z];
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
      const len = (a) => Math.hypot(...a);
      const deg = (r) => (r * 180) / Math.PI;
      const mid = (...ps) => ({ x: ps.reduce((s, p) => s + p.x, 0) / ps.length, y: ps.reduce((s, p) => s + p.y, 0) / ps.length, z: ps.reduce((s, p) => s + p.z, 0) / ps.length });
      const angle = (a, b, c) => deg(Math.acos(Math.max(-1, Math.min(1, dot(sub(a, b), sub(c, b)) / (len(sub(a, b)) * len(sub(c, b)))))));
      function dihedral(a, b, c, d) {
        const b1 = sub(b, a), b2 = sub(c, b), b3 = sub(d, c);
        const n1 = cross(b1, b2), n2 = cross(b2, b3);
        const m1 = cross(n1, b2.map((x) => x / len(b2)));
        return deg(Math.atan2(dot(m1, n2), dot(n1, n2)));
      }
      const tag = { fontSize: 11, fontColor: DARK, backgroundColor: "#4cc9f0", backgroundOpacity: 0.95, inFront: true, alignment: "center" };
      function redraw() {
        v.removeAllShapes();
        v.removeAllLabels();
        const rows = [];
        picked.forEach((a, i) => {
          v.addSphere({ center: { x: a.x, y: a.y, z: a.z }, radius: 0.5, color: "#f7df1e", alpha: 0.45 });
          v.addLabel(String(i + 1), { position: a, fontSize: 11, fontColor: DARK, backgroundColor: "#f7df1e", backgroundOpacity: 1, inFront: true, alignment: "bottomCenter" });
        });
        for (let i = 0; i + 1 < picked.length; i++) {
          const [a, b] = [picked[i], picked[i + 1]];
          v.addCylinder({ start: { x: a.x, y: a.y, z: a.z }, end: { x: b.x, y: b.y, z: b.z }, radius: 0.045, dashed: true, color: "#4cc9f0" });
          const d = len(sub(a, b));
          rows.push([`距離 ${no(a)}・${no(b)}`, `${d.toFixed(3)} Å`]);
          v.addLabel(`${d.toFixed(2)} Å`, { ...tag, position: mid(a, b) });
        }
        if (picked.length >= 3) {
          const [a, b, c] = picked;
          const t = angle(a, b, c);
          rows.push([`鍵角 ∠${no(a)}・${no(b)}・${no(c)}`, `${t.toFixed(1)}°`]);
          const ac = mid(a, c), out = sub(b, ac), L = len(out) || 1;
          v.addLabel(`∠ ${t.toFixed(1)}°`, { ...tag, backgroundColor: "#7bd389", position: { x: b.x + (out[0] / L) * 0.9, y: b.y + (out[1] / L) * 0.9, z: b.z + (out[2] / L) * 0.9 } });
        }
        if (picked.length === 4) {
          const t = dihedral(...picked);
          rows.push(["二面角 1・2・3・4", `${t.toFixed(1)}°`]);
        }
        v.render();
        side.querySelector(".dm-picked").innerHTML = picked.length
          ? picked.map((a, i) => `<tr><td>${i + 1}. <span class="dm-dot" style="background:${elemHex(a.elem)}"></span>${ELEM[a.elem][0]} ${no(a)}</td><td>${a.bonds.map((j) => no(atoms[j])).join(" ")}</td></tr>`).join("")
          : `<tr><td>尚未選取</td><td></td></tr>`;
        side.querySelector(".dm-meas").innerHTML = rows.length ? rows.map(([k, val]) => `<tr><td>${k}</td><td>${val}</td></tr>`).join("") : `<tr><td>至少選兩個原子</td><td></td></tr>`;
        const last = picked[picked.length - 1];
        side.querySelector(".dm-card").innerHTML = last
          ? `最後點選 <b>${no(last)}</b>，座標 (${[last.x, last.y, last.z].map(f2).join(", ")}) Å，與 ${last.bonds.length} 個原子相連。`
          : "點選畫面中的原子開始量測。";
      }
      v.setClickable({}, true, (a) => {
        if (picked.length >= 4 || picked.includes(a)) picked = [];
        picked.push(a);
        redraw();
      });
      ctx.button("清除", () => { picked = []; redraw(); });
      ctx.button("甲基二面角", () => { picked = [15, 11, 2, 7].map((i) => atoms[i]); redraw(); });
      // Start with a full four-atom example: O1, C9, N5, C14
      picked = [0, 8, 4, 13].map((i) => atoms[i]);
      v.zoomTo();
      v.zoom(1.25);
      redraw();
    },
  },

  // 6. Normal-mode vibrations as multi-frame XYZ + animate
  {
    id: "vib", title: "分子振動", api: "addModelsAsFrames(xyz)・animate・addArrow",
    desc: "以程式產生水與二氧化碳各個簡正振動模式的多幀 XYZ，交給 addModelsAsFrames 逐幀播放，箭頭標出位移方向。速度依真實頻率比例換算。",
    hint: "切換分子與振動模式；振幅放大是為了看得見，真實位移只有約 0.01 Å",
    mount(ctx) {
      const { view, side } = layout(ctx);
      side.innerHTML = `<h2></h2><p></p><h3>模式數據</h3><dl class="dm-rd"></dl><h3>全部模式</h3><table class="dm-tbl"></table>`;
      const v = viewerIn(ctx, view);
      const M = { H: 1.008, O: 15.999, C: 12.011 };
      const h = (52.26 * Math.PI) / 180, r = 0.9572, s = Math.sin(h), c = Math.cos(h);
      const MOLS = {
        h2o: { name: "水 H₂O", atoms: [["O", 0, 0], ["H", r * s, -r * c], ["H", -r * s, -r * c]], modes: [
          { k: "ν1", zh: "對稱伸縮", cm: 3657, ir: "紅外、拉曼皆活性", d: [[0, 0], [s, -c], [-s, -c]] },
          { k: "ν2", zh: "彎曲（剪式）", cm: 1595, ir: "紅外、拉曼皆活性", d: [[0, 0], [c, s], [-c, s]] },
          { k: "ν3", zh: "反對稱伸縮", cm: 3756, ir: "紅外、拉曼皆活性", d: [[0, 0], [s, -c], [s, c]] },
        ] },
        co2: { name: "二氧化碳 CO₂", atoms: [["C", 0, 0], ["O", 1.16, 0], ["O", -1.16, 0]], modes: [
          { k: "ν1", zh: "對稱伸縮", cm: 1333, ir: "只有拉曼活性（偶極不變）", d: [[0, 0], [1, 0], [-1, 0]] },
          { k: "ν2", zh: "彎曲（二重簡併）", cm: 667, ir: "紅外活性", d: [[0, 0], [0, 1], [0, 1]] },
          { k: "ν3", zh: "反對稱伸縮", cm: 2349, ir: "紅外活性，溫室效應主因之一", d: [[0, 0], [1, 0], [1, 0]] },
        ] },
      };
      let mol = "h2o", mode = 0, amp = 0.2, speed = 1, arrows = true;
      const FR = 24;
      // Shift the central atom so the centre of mass stays fixed.
      function disp(mo, md) {
        const d = md.d.map((p) => [...p]);
        const mass = mo.atoms.map(([e]) => M[e]);
        for (const ax of [0, 1]) d[0][ax] = -d.slice(1).reduce((t, p, i) => t + p[ax] * mass[i + 1], 0) / mass[0];
        const peak = Math.max(...d.map((p) => Math.hypot(p[0], p[1])));
        return d.map((p) => p.map((x) => x / peak));
      }
      function build() {
        const mo = MOLS[mol], md = mo.modes[mode], d = disp(mo, md);
        let xyz = "";
        for (let f = 0; f < FR; f++) {
          const k = amp * Math.sin((2 * Math.PI * f) / FR);
          xyz += `${mo.atoms.length}\nframe ${f}\n` + mo.atoms.map(([e, x, y], i) => `${e} ${(x + d[i][0] * k).toFixed(4)} ${(y + d[i][1] * k).toFixed(4)} 0`).join("\n") + "\n";
        }
        v.stopAnimate();
        v.clear();
        v.addModelsAsFrames(xyz, "xyz");
        v.setStyle({}, { stick: { radius: 0.12, colorscheme: "Jmol" }, sphere: { scale: 0.3, colorscheme: "Jmol" } });
        if (arrows) mo.atoms.forEach(([, x, y], i) => {
          const L = Math.hypot(...d[i]);
          // Start just outside the sphere so the arrow is not hidden by the atom.
          const ux = d[i][0] / L, uy = d[i][1] / L, r0 = 0.6, r1 = r0 + 0.3 + L * amp * 3;
          if (L > 0.05) v.addArrow({ start: { x: x + ux * r0, y: y + uy * r0, z: 0 }, end: { x: x + ux * r1, y: y + uy * r1, z: 0 }, radius: 0.06, color: "#f7df1e", mid: 0.6 });
        });
        v.zoomTo();
        v.zoom(mol === "co2" ? 1.5 : 1.9);
        const interval = Math.round(Math.max(12, Math.min(200, (40 * 3000) / md.cm / speed)));
        v.animate({ loop: "forward", interval, reps: 0 });
        const realFs = 1e15 / (md.cm * 2.998e10);
        const shownMs = interval * FR;
        const slow = (shownMs * 1e12) / realFs;
        const e = Math.floor(Math.log10(slow));
        side.querySelector("h2").textContent = `${mo.name}・${md.k} ${md.zh}`;
        side.querySelector("p").textContent = md.ir;
        side.querySelector("dl").innerHTML = `<dt>波數</dt><dd>${md.cm} cm⁻¹</dd><dt>真實週期</dt><dd>${realFs.toFixed(1)} fs</dd>`
          + `<dt>畫面週期</dt><dd>${shownMs} ms</dd><dt>放慢倍數</dt><dd>${(slow / 10 ** e).toFixed(1)}×10<sup>${e}</sup></dd><dt>幀數</dt><dd>${FR}</dd>`;
        side.querySelector("table").innerHTML = mo.modes.map((x, i) => `<tr${i === mode ? ' style="color:var(--c1)"' : ""}><td>${x.k} ${x.zh}</td><td>${x.cm} cm⁻¹</td></tr>`).join("");
      }
      ctx.group(["H₂O", "CO₂"], 0, (i) => { mol = i ? "co2" : "h2o"; build(); });
      ctx.group(["ν1", "ν2", "ν3"], 0, (i) => { mode = i; build(); });
      ctx.slider("振幅", { min: 0.05, max: 0.3, step: 0.05, value: amp, format: (x) => `${x.toFixed(2)} Å` }, (x) => { amp = x; build(); });
      ctx.slider("速度", { min: 0.25, max: 2, step: 0.25, value: speed, format: (x) => `${x}×` }, (x) => { speed = x; build(); });
      ctx.toggle("位移箭頭", true, (on) => { arrows = on; build(); });
      build();
    },
  },

  // 7. Sequence navigator: selection language (resi, within, byres) + animated zoomTo
  {
    id: "seq", title: "序列導覽", api: "selectedAtoms({within, byres})・zoomTo(sel, ms)",
    desc: "右側是 Crambin 的 46 個胺基酸序列。點一個殘基，3D 畫面飛到它的位置，並用 within 選取語法找出 5 Å 內的鄰近殘基；也能一鍵標出三組雙硫鍵。",
    hint: "點序列中的殘基；底線洋紅是螺旋、金黃是 β 摺板",
    async mount(ctx) {
      const { view, side } = layout(ctx);
      side.innerHTML = `<h2></h2><dl class="dm-rd"></dl><h3>序列（點選跳轉）</h3><div class="dm-seq"></div>`;
      const v = viewerIn(ctx, view);
      let m = null, cas = [], cur = 16, near = true;
      const seqEl = side.querySelector(".dm-seq");
      const base = () => { v.setStyle({}, { cartoon: { colorscheme: "ssJmol", opacity: 0.9 } }); v.removeAllLabels(); v.removeAllShapes(); };
      const lab = { fontSize: 11, fontColor: "white", backgroundColor: DARK, backgroundOpacity: 0.75, inFront: true, alignment: "center" };
      function focus(resi) {
        cur = resi;
        base();
        const self = { resi };
        const nbSel = { within: { distance: 5, sel: self }, byres: true };
        const nb = near ? [...new Set(m.selectedAtoms(nbSel).map((a) => a.resi))].filter((x) => x !== resi) : [];
        if (near) v.addStyle(nbSel, { stick: { radius: 0.12, colorscheme: "whiteCarbon" } });
        v.addStyle(self, { stick: { radius: 0.24, colorscheme: "yellowCarbon" } });
        for (const a of cas.filter((a) => nb.includes(a.resi))) v.addLabel(`${a.resn}${a.resi}`, { ...lab, position: a, fontSize: 10, backgroundOpacity: 0.55 });
        const ca = cas.find((a) => a.resi === resi);
        v.addLabel(`${ca.resn} ${resi}`, { ...lab, position: ca, fontColor: DARK, backgroundColor: "#f7df1e", backgroundOpacity: 1, fontSize: 13 });
        v.zoomTo(near ? nbSel : self, 600);
        seqEl.querySelectorAll("button").forEach((b) => {
          b.setAttribute("aria-pressed", String(+b.dataset.r === resi));
          b.classList.toggle("nb", nb.includes(+b.dataset.r));
        });
        const ssZh = { h: "α 螺旋", s: "β 摺板" }[ca.ss] || "迴圈";
        side.querySelector("h2").textContent = `${ca.resn} ${resi}（${ONE[ca.resn] || "?"}）`;
        side.querySelector("dl").innerHTML = `<dt>二級結構</dt><dd>${ssZh}</dd><dt>疏水指數</dt><dd>${(KD[ca.resn] ?? 0).toFixed(1)}</dd>`
          + `<dt>原子數</dt><dd>${m.selectedAtoms(self).length}</dd><dt>5 Å 內鄰居</dt><dd>${near ? nb.length + " 個殘基" : "未顯示"}</dd>`;
      }
      function disulfide() {
        base();
        const sg = m.selectedAtoms({ resn: "CYS", atom: "SG" });
        const pairs = [];
        sg.forEach((a, i) => sg.slice(i + 1).forEach((b) => { if (Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z) < 2.5) pairs.push([a, b]); }));
        v.addStyle({ resn: "CYS" }, { stick: { radius: 0.2, colorscheme: "Jmol" } });
        for (const [a, b] of pairs) {
          v.addCylinder({ start: { x: a.x, y: a.y, z: a.z }, end: { x: b.x, y: b.y, z: b.z }, radius: 0.16, color: "#ffff30" });
          v.addLabel(`Cys${a.resi} ↔ Cys${b.resi}`, { ...lab, fontColor: "#ffff60", position: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 + 0.8, z: (a.z + b.z) / 2 } });
        }
        v.zoomTo({ resn: "CYS" }, 600);
        seqEl.querySelectorAll("button").forEach((b) => { b.setAttribute("aria-pressed", "false"); b.classList.toggle("nb", b.dataset.n === "CYS"); });
        side.querySelector("h2").textContent = "雙硫鍵";
        side.querySelector("dl").innerHTML = pairs.map(([a, b]) => `<dt>Cys${a.resi} ↔ Cys${b.resi}</dt><dd>${Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z).toFixed(2)} Å</dd>`).join("")
          + "<dt>判定方式</dt><dd>SG 距離 &lt; 2.5 Å</dd>";
      }
      ctx.toggle("顯示 5 Å 鄰居", true, (on) => { near = on; if (m) focus(cur); });
      ctx.button("雙硫鍵", () => m && disulfide());
      ctx.button("全覽", () => { if (m) { v.zoomTo({}, 600); } });
      const data = await withCrambin(ctx, view);
      if (!data) return;
      m = v.addModel(data, "pdb");
      cas = m.selectedAtoms({ atom: "CA" });
      seqEl.innerHTML = cas.map((a) => `<button type="button" class="${a.ss === "h" || a.ss === "s" ? a.ss : ""}" data-r="${a.resi}" data-n="${a.resn}" title="${a.resn} ${a.resi}">${ONE[a.resn] || "?"}<small>${a.resi}</small></button>`).join("");
      ctx.on(seqEl, "click", (e) => { const b = e.target.closest("button"); if (b) focus(+b.dataset.r); });
      hoverTag(v, (a) => `${a.resn} ${a.resi}・${a.atom}`);
      v.zoomTo();
      focus(cur);
    },
  },

  // 8. Stress: generated nanodiamond cluster, ramp atom count, measure addModel time and render FPS
  {
    id: "stress", title: "極限測試", kind: "stress", api: "addModel(xyz) 原子數加壓・rotate 連續重繪",
    desc: "以程式產生鑽石晶格的奈米顆粒（C-C 1.545 Å），逐級增加原子數，量 addModel 解析加自動判鍵的耗時，以及畫面持續旋轉時的 FPS。",
    hint: "按「自動加壓」逐級加原子，掉到 30 FPS 以下即停；底部可切換呈現樣式",
    mount(ctx) {
      ctx.html(`<div class="dm-stress"><div class="dm-view"></div></div>`);
      const view = ctx.$(".dm-view");
      const v = viewerIn(ctx, view);
      const STY = [
        ["線條", () => ({ line: { colorscheme: grad } })],
        ["棒狀", () => ({ stick: { radius: 0.18, colorscheme: grad } })],
        ["球棍", () => ({ stick: { radius: 0.12, colorscheme: grad }, sphere: { scale: 0.25, colorscheme: grad } })],
      ];
      let sty = 2, grad = null, last = { n: 0, bonds: 0, add: 0, draw: 0, gen: 0 };
      // Diamond cubic: FCC lattice plus a (1/4,1/4,1/4) shifted copy; keep the n atoms closest to the centre.
      const A = 3.567, BASIS = [[0, 0, 0], [0, 0.5, 0.5], [0.5, 0, 0.5], [0.5, 0.5, 0]].flatMap((p) => [p, p.map((x) => x + 0.25)]);
      function cluster(n) {
        const k = Math.ceil(Math.cbrt(n / 8 / 0.5)) + 1, c = (k * A) / 2, pts = [];
        for (let i = 0; i < k; i++) for (let j = 0; j < k; j++) for (let l = 0; l < k; l++)
          for (const [bx, by, bz] of BASIS) {
            const x = (i + bx) * A - c, y = (j + by) * A - c, z = (l + bz) * A - c;
            pts.push([x, y, z, x * x + y * y + z * z]);
          }
        pts.sort((p, q) => p[3] - q[3]);
        return pts.slice(0, n);
      }
      async function apply(n) {
        const t0 = performance.now();
        const pts = cluster(n);
        const xyz = `${pts.length}\nnanodiamond\n` + pts.map((p) => `C ${p[0].toFixed(3)} ${p[1].toFixed(3)} ${p[2].toFixed(3)}`).join("\n");
        const t1 = performance.now();
        v.clear();
        const model = v.addModel(xyz, "xyz");
        const t2 = performance.now();
        const R = Math.sqrt(pts[pts.length - 1][3]);
        grad = { prop: "z", gradient: "roygb", min: -R, max: R };
        v.setStyle({}, STY[sty][1]());
        v.zoomTo();
        v.render();
        const t3 = performance.now();
        const bonds = model.selectedAtoms({}).reduce((s, a) => s + a.bonds.length, 0) / 2;
        last = { n, bonds, gen: t1 - t0, add: t2 - t1, draw: t3 - t2 };
        await ctx.frame(2);
      }
      ctx.raf(() => v.rotate(0.6, "y"));
      const r = ctx.ramp({
        label: "原子數", unit: "個", steps: [250, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000], apply, minFps: 30,
        metrics: () => ({ "化學鍵": last.bonds, "addModel": Showcase.fmtMs(last.add), "樣式＋首幀": Showcase.fmtMs(last.draw) }),
        note: "addModel 時間含 XYZ 解析與依距離自動判定化學鍵；樣式＋首幀含幾何生成與第一次 WebGL 繪製。顏色依 z 座標套 ROYGB 漸層。",
      });
      ctx.controls.classList.add("bottom");
      ctx.group(STY.map((s) => s[0]), sty, (i) => { sty = i; r.set(r.value); });
    },
  },
] });
</script>
</body>
</html>
