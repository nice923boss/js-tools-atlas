<html lang="zh-Hant">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3Dmol.js 示範：咖啡因與蛋白質的 3D 分子檢視器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app {
    position: fixed; inset: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 268px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top" "view side";
  }
  .top { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bg-2); border-bottom: 1px solid var(--line); min-width: 0; }
  .top b { font-size: 15px; white-space: nowrap; }
  .seg { display: flex; gap: 4px; min-width: 0; }
  .seg .btn { flex: none; padding: 7px 12px; font-size: 12.5px; white-space: nowrap; }
  .seg .btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); box-shadow: none; }
  #view { grid-area: view; position: relative; min-width: 0; min-height: 0; background: radial-gradient(120% 90% at 50% 45%, #1a1e25 0%, #0e1013 70%); }
  #view canvas { outline: none; }
  .side { grid-area: side; min-height: 0; overflow-y: auto; padding: 14px 16px 52px; background: var(--bg-2); border-left: 1px solid var(--line); scrollbar-width: thin; }
  .side h2 { margin: 0 0 4px; font-size: 15px; }
  .side .lead { margin: 0 0 12px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .cap { margin: 12px 0 6px; font-size: 11.5px; letter-spacing: .06em; color: var(--muted); }
  .styles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .styles button, .tog button { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 9px; padding: 7px 4px; font: 12.5px var(--font); cursor: pointer; white-space: nowrap; }
  .styles button:hover:not(:disabled), .tog button:hover { border-color: var(--c2); }
  .styles button[aria-pressed="true"] { background: var(--c2); border-color: var(--c2); color: #0e1013; font-weight: 600; }
  .styles button:disabled { opacity: .35; cursor: not-allowed; }
  .tog { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .tog button[aria-pressed="true"] { border-color: var(--c4); color: var(--c4); }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; margin: 0; font-size: 12.5px; }
  .info dt { color: var(--muted); white-space: nowrap; }
  .info dd { margin: 0; text-align: right; font: 12.5px var(--mono); }
  .info sub { font-size: .78em; line-height: 0; }
  .hov { margin-top: 12px; padding: 9px 10px; border-radius: 9px; border: 1px dashed var(--line); font-size: 12px; line-height: 1.6; color: var(--muted); min-height: 62px; }
  .hov b { color: var(--fg); font: 600 13px var(--mono); }
  .hov .el { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
  .load { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
  .load[hidden] { display: none; }
  @media (max-width: 700px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "top" "view" "side";
      padding-bottom: 40px; background: var(--bg-2);
    }
    .top { padding: 8px 10px; }
    .top b { display: none; }
    .side { border-left: 0; border-top: 1px solid var(--line); padding: 8px 10px 4px; overflow: hidden; }
    .side h2, .side .lead, .cap, .hov { display: none; }
    .styles { grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .styles button, .tog button { padding: 6px 2px; font-size: 11.5px; }
    .tog { margin-top: 5px; gap: 4px; }
    .info { grid-template-columns: auto 1fr auto 1fr; gap: 3px 8px; margin-top: 7px; font-size: 11.5px; }
    .info dd { font-size: 11.5px; }
    .info dt:nth-of-type(n+5), .info dd:nth-of-type(n+5) { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <b>3Dmol.js 分子檢視器</b>
    <div class="seg" id="mols"></div>
  </div>
  <div id="view"><div class="load" id="load">載入分子中…</div></div>
  <aside class="side">
    <h2 id="mName"></h2>
    <p class="lead" id="mDesc"></p>
    <div class="cap">顯示樣式</div>
    <div class="styles" id="styles"></div>
    <div class="cap">檢視</div>
    <div class="tog">
      <button id="spin" type="button" aria-pressed="true">自動旋轉</button>
      <button id="lab" type="button" aria-pressed="false">標籤</button>
      <button id="reset" type="button">重設視角</button>
    </div>
    <div class="cap">分子資訊</div>
    <dl class="info" id="info"></dl>
    <div class="hov" id="hov">把滑鼠移到原子上，這裡會顯示元素、編號與座標。</div>
  </aside>
</div>
<div class="hint">拖曳旋轉・滾輪縮放・右鍵拖曳平移</div>

<!-- Caffeine, PubChem CID 2519, 3D conformer (public domain) -->

<script src="https://cdn.jsdelivr.net/npm/3dmol@2.5.5/build/3Dmol-min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const viewEl = $("view");
const viewer = $3Dmol.createViewer(viewEl, { antialias: true });
viewer.setBackgroundColor("#0e1013", 0);
viewer.setHoverDuration(60);

const ELEM = {
  C: ["碳", 12.011, "#909090"], H: ["氫", 1.008, "#ffffff"], N: ["氮", 14.007, "#3050f8"],
  O: ["氧", 15.999, "#ff0d0d"], S: ["硫", 32.06, "#ffff30"],
};
const sub = (n) => (n === 1 ? "" : `<sub>${n}</sub>`);

const MOLS = {
  caffeine: {
    label: "咖啡因",
    name: "咖啡因 Caffeine",
    desc: "咖啡與茶裡的興奮劑分子。座標取自 PubChem 3D 構形（CID 2519），直接內嵌在頁面中的 SDF 文字。",
    format: "sdf",
    load: async () => $("caffeine").textContent.replace(/^\n/, ""),
    styles: ["ballstick", "sphere", "stick", "line", "surface"],
    defaultStyle: "ballstick",
  },
  crambin: {
    label: "蛋白質 Crambin",
    name: "結晶蛋白 Crambin",
    desc: "取自十字花科植物種子的小型蛋白質，46 個胺基酸、3 組雙硫鍵，PDB 編號 1CRN。卡通模式依胺基酸序號由藍到紅上色。",
    format: "pdb",
    load: async () => {
      const r = await fetch("assets/3dmoljs/1crn.pdb");
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.text();
    },
    styles: ["ballstick", "sphere", "stick", "line", "surface", "cartoon"],
    defaultStyle: "cartoon",
  },
};

const STYLES = {
  ballstick: ["球棍", () => ({ stick: { radius: 0.14, colorscheme: "Jmol" }, sphere: { scale: 0.26, colorscheme: "Jmol" } })],
  sphere: ["空間填充", () => ({ sphere: { colorscheme: "Jmol" } })],
  stick: ["棒狀", () => ({ stick: { radius: 0.2, colorscheme: "Jmol" } })],
  line: ["線條", () => ({ line: { colorscheme: "Jmol" } })],
  surface: ["表面", () => ({ stick: { radius: 0.14, colorscheme: "Jmol" } })],
  cartoon: ["卡通", () => ({ cartoon: { color: "spectrum" } })],
};

let cur = null, curStyle = null, model = null, labelsOn = false, hoverLabel = null, spinning = true;

// ---------- styles ----------
const stylesEl = $("styles");
for (const [k, [label]] of Object.entries(STYLES)) {
  const b = document.createElement("button");
  b.type = "button";
  b.dataset.k = k;
  b.textContent = label;
  b.addEventListener("click", () => applyStyle(k));
  stylesEl.appendChild(b);
}

function applyStyle(k) {
  curStyle = k;
  stylesEl.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === k));
  viewer.removeAllSurfaces();
  viewer.setStyle({}, STYLES[k][1]());
  if (k === "cartoon") {
    // show the three disulfide bridges on top of the ribbon
    viewer.setStyle({ resn: "CYS", atom: ["CA", "CB", "SG"] }, { cartoon: { color: "spectrum" }, stick: { radius: 0.22, colorscheme: "Jmol" } });
  }
  if (k === "surface") {
    viewer.addSurface($3Dmol.SurfaceType.VDW, { opacity: 0.72, colorscheme: "Jmol" }, {});
  }
  viewer.render();
}

// ---------- labels ----------
function drawLabels() {
  viewer.removeAllLabels();
  hoverLabel = null;
  if (!labelsOn || !model) return;
  const opts = { fontSize: 12, fontColor: "white", backgroundColor: "#0e1013", backgroundOpacity: 0.72, borderThickness: 0, inFront: true, alignment: "center" };
  if (cur === "caffeine") {
    for (const a of model.selectedAtoms({ elem: ["C", "N", "O"] })) viewer.addLabel(`${a.elem}${atomNo(a)}`, { ...opts, position: a });
  } else {
    for (const a of model.selectedAtoms({ resn: "CYS", atom: "SG" })) viewer.addLabel(`Cys${a.resi}`, { ...opts, fontColor: "#ffff60", position: a });
    for (const a of model.selectedAtoms({ atom: "CA", resi: [1, 46] })) viewer.addLabel(a.resi === 1 ? "N 端" : "C 端", { ...opts, position: a });
  }
  viewer.render();
}

// ---------- info computed from the parsed model ----------
function showInfo() {
  const atoms = model.selectedAtoms({});
  const counts = {};
  let bonds = 0, mass = 0;
  for (const a of atoms) {
    counts[a.elem] = (counts[a.elem] || 0) + 1;
    bonds += a.bonds.length;
    mass += (ELEM[a.elem] || [0, 0])[1];
  }
  // Hill order: C, H, then alphabetical
  const order = Object.keys(counts).sort((a, b) => (a === "C" ? -1 : b === "C" ? 1 : a === "H" ? -1 : b === "H" ? 1 : a.localeCompare(b)));
  const formula = order.map((e) => e + sub(counts[e])).join("");
  const rows = [["原子數", atoms.length], ["化學鍵", bonds / 2]];
  if (cur === "caffeine") {
    rows.unshift(["分子式", formula]);
    rows.push(["分子量", `${mass.toFixed(2)} g/mol`]);
  } else {
    const res = new Set(atoms.map((a) => a.resi)).size;
    const segs = (ss) => atoms.filter((a) => a.atom === "CA").reduce((n, a, i, arr) => n + (a.ss === ss && (i === 0 || arr[i - 1].ss !== ss) ? 1 : 0), 0);
    rows.unshift(["重原子組成", formula]);
    rows.push(["胺基酸", res], ["二級結構", `螺旋 ${segs("h")} 段・β 股 ${segs("s")} 段`]);
  }
  $("info").innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
}

// SDF atoms are indexed from 0; show the 1-based molfile number. PDB atoms keep their serial.
const atomNo = (a) => (cur === "caffeine" ? a.index + 1 : a.serial);

// ---------- hover ----------
function hoverOn(atom) {
  if (hoverLabel) viewer.removeLabel(hoverLabel);
  const name = cur === "crambin" ? `${atom.resn} ${atom.resi}・${atom.atom}` : `${atom.elem}${atomNo(atom)}`;
  hoverLabel = viewer.addLabel(name, { position: atom, fontSize: 13, fontColor: "#0e1013", backgroundColor: "#f7df1e", backgroundOpacity: 0.95, inFront: true, alignment: "bottomCenter" });
  const e = ELEM[atom.elem] || [atom.elem, 0, "#ccc"];
  $("hov").innerHTML = `<span class="el" style="background:${e[2]}"></span><b>${atom.elem}</b>（${e[0]}）原子 #${atomNo(atom)}`
    + (cur === "crambin" ? `<br>胺基酸 <b>${atom.resn} ${atom.resi}</b>，原子名 ${atom.atom}` : `<br>鍵結數 ${atom.bonds.length}`)
    + `<br>座標 (${[atom.x, atom.y, atom.z].map((v) => (Math.abs(v) < 0.005 ? 0 : v).toFixed(2)).join(", ")}) Å`;
  viewer.render();
}
function hoverOff() {
  if (hoverLabel) { viewer.removeLabel(hoverLabel); hoverLabel = null; viewer.render(); }
}

// ---------- molecules ----------
async function loadMol(key) {
  cur = key;
  const m = MOLS[key];
  document.querySelectorAll("#mols .btn").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === key));
  $("mName").textContent = m.name;
  $("mDesc").textContent = m.desc;
  $("hov").textContent = "把滑鼠移到原子上，這裡會顯示元素、編號與座標。";
  stylesEl.querySelectorAll("button").forEach((b) => {
    b.disabled = !m.styles.includes(b.dataset.k);
    b.title = b.disabled ? "小分子沒有蛋白質二級結構，無法顯示卡通模式" : "";
  });
  $("load").hidden = false;
  let data;
  try {
    data = await m.load();
  } catch (err) {
    $("load").textContent = `分子資料載入失敗：${err.message}`;
    return;
  }
  if (cur !== key) return;
  $("load").hidden = true;
  viewer.clear();
  hoverLabel = null;
  model = viewer.addModel(data, m.format);
  viewer.setHoverable({}, true, hoverOn, hoverOff);
  applyStyle(m.defaultStyle);
  viewer.zoomTo();
  if (key === "caffeine") viewer.rotate(-35, "x");
  viewer.zoom(key === "caffeine" ? 0.82 : 1.05);
  showInfo();
  drawLabels();
  viewer.render();
}

for (const [k, m] of Object.entries(MOLS)) {
  const b = document.createElement("button");
  b.className = "btn";
  b.dataset.k = k;
  b.textContent = m.label;
  b.addEventListener("click", () => { if (cur !== k) loadMol(k); });
  $("mols").appendChild(b);
}

// ---------- view controls ----------
function setSpin(on) {
  spinning = on;
  $("spin").setAttribute("aria-pressed", on);
  if (on) viewer.spin("y", 0.6); else viewer.spin(false);
}
$("spin").addEventListener("click", () => setSpin(!spinning));
$("lab").addEventListener("click", () => {
  labelsOn = !labelsOn;
  $("lab").setAttribute("aria-pressed", labelsOn);
  drawLabels();
});
$("reset").addEventListener("click", () => {
  viewer.zoomTo();
  if (cur === "caffeine") viewer.rotate(-35, "x");
  viewer.zoom(cur === "caffeine" ? 0.82 : 1.05);
  viewer.render();
});

new ResizeObserver(() => { viewer.resize(); viewer.render(); }).observe(viewEl);
loadMol("caffeine").then(() => setSpin(true));
</script>
</body>
</html>
