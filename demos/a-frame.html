<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-Frame 示範：用 HTML 標籤搭出 360 度展場</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"有 VR 頭盔時可按「進入 VR」，桌機則切換全螢幕"}</script>
<style>
  .controls { flex-direction: column; align-items: flex-end; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .row .label { font-size: 12px; color: var(--fg); align-self: center; padding: 6px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
  .btn { padding: 7px 10px; font-size: 12px; }
  /* Restyle the built-in loader title so it matches the site instead of a black bar */
  .a-loader-title {
    top: 50% !important; left: 50% !important; right: auto !important; transform: translate(-50%, 36px);
    height: auto !important; line-height: 1.4 !important; padding: 6px 12px; border-radius: 999px;
    background: var(--panel) !important; border: 1px solid var(--line);
    font: 13px/1.4 var(--font) !important; color: var(--muted) !important; white-space: nowrap;
  }
  #vrBtn.a-hidden { display: none; }
</style>
</head>
<body>
<a-scene
  renderer="antialias: true; toneMapping: ACESFilmic; exposure: 1.1"
  shadow="type: pcf"
  loading-screen="dotsColor: #f7df1e; backgroundColor: #0e1013"
  xr-mode-ui="enterVRButton: #vrBtn; enterAREnabled: false"
  cursor="rayOrigin: mouse" raycaster="objects: .clickable; far: 40">

  <a-assets timeout="8000">
    <img id="pano" src="_shared/img/panorama.jpg" crossorigin="anonymous">
    <a-asset-item id="robot" src="_shared/models/robot.glb"></a-asset-item>
  </a-assets>

  <!-- 360 equirectangular sky -->
  <a-sky id="sky" src="#pano" radius="60" rotation="0 -90 0"></a-sky>

  <!-- Lights: warm sun with soft shadow, cool hemisphere fill -->
  <a-entity id="sun" light="type: directional; color: #ffe2b8; intensity: 2.6; castShadow: true;
            shadowMapWidth: 1024; shadowMapHeight: 1024; shadowRadius: 3; shadowBias: -0.0005;
            shadowCameraLeft: -3; shadowCameraRight: 3; shadowCameraTop: 3; shadowCameraBottom: -3"
            position="2.5 5 3"></a-entity>
  <a-entity id="fill" light="type: hemisphere; color: #bfd8ff; groundColor: #3a2a1a; intensity: 1.1"></a-entity>

  <!-- Stage: glossy disc + glowing ring -->
  <a-cylinder radius="1.7" height="0.16" position="0 -0.08 0" segments-radial="96"
              material="color: #4a5262; metalness: 0.15; roughness: 0.6" shadow="cast: false; receive: true"></a-cylinder>
  <a-torus radius="1.72" radius-tubular="0.018" segments-tubular="160" rotation="90 0 0" position="0 0.005 0"
           material="color: #f7df1e; emissive: #f7df1e; emissiveIntensity: 0.9"></a-torus>

  <!-- Animated robot (glTF) -->
  <a-entity id="bot" gltf-model="#robot" scale="0.36 0.36 0.36" rotation="0 20 0"
            shadow="cast: true; receive: false" robot-clip="clip: Dance" class="clickable"></a-entity>

  <!-- Floating gems: declarative animation components, clickable -->
  <a-entity id="gems">
    <a-octahedron class="clickable gem" radius="0.22" position="-1.35 1.25 0.2"
      material="color: #4cc9f0; metalness: 0.35; roughness: 0.15; emissive: #4cc9f0; emissiveIntensity: 0.25"
      shadow="cast: true; receive: false"
      animation__float="property: position; to: -1.35 1.55 0.2; dir: alternate; loop: true; dur: 1800; easing: easeInOutSine"
      animation__spin="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"
      animation__pop="property: scale; from: 1.6 1.6 1.6; to: 1 1 1; dur: 600; easing: easeOutElastic; startEvents: click"></a-octahedron>
    <a-dodecahedron class="clickable gem" radius="0.2" position="1.3 1.45 -0.3"
      material="color: #f72585; metalness: 0.35; roughness: 0.2; emissive: #f72585; emissiveIntensity: 0.25"
      shadow="cast: true; receive: false"
      animation__float="property: position; to: 1.3 1.15 -0.3; dir: alternate; loop: true; dur: 2200; easing: easeInOutSine"
      animation__spin="property: rotation; to: 360 360 0; loop: true; dur: 8000; easing: linear"
      animation__pop="property: scale; from: 1.6 1.6 1.6; to: 1 1 1; dur: 600; easing: easeOutElastic; startEvents: click"></a-dodecahedron>
    <a-torus-knot class="clickable gem" radius="0.14" radius-tubular="0.04" position="0.95 0.55 1.05"
      material="color: #f7df1e; metalness: 0.8; roughness: 0.25; emissive: #a08800; emissiveIntensity: 0.2"
      shadow="cast: true; receive: false"
      animation__float="property: position; to: 0.95 0.8 1.05; dir: alternate; loop: true; dur: 1600; easing: easeInOutSine"
      animation__spin="property: rotation; to: 360 0 360; loop: true; dur: 7000; easing: linear"
      animation__pop="property: scale; from: 1.6 1.6 1.6; to: 1 1 1; dur: 600; easing: easeOutElastic; startEvents: click"></a-torus-knot>
    <a-icosahedron class="clickable gem" radius="0.17" position="-0.95 0.5 0.95"
      material="color: #7bd389; metalness: 0.35; roughness: 0.2; emissive: #7bd389; emissiveIntensity: 0.25"
      shadow="cast: true; receive: false"
      animation__float="property: position; to: -0.95 0.75 0.95; dir: alternate; loop: true; dur: 2000; easing: easeInOutSine"
      animation__spin="property: rotation; to: 0 360 360; loop: true; dur: 5000; easing: linear"
      animation__pop="property: scale; from: 1.6 1.6 1.6; to: 1 1 1; dur: 600; easing: easeOutElastic; startEvents: click"></a-icosahedron>
  </a-entity>

  <!-- Camera rig: drag to orbit around the stage -->
  <a-entity id="rig" orbit-drag="autoSpeed: 6">
    <a-entity id="cam" camera="fov: 45" position="0 1.45 4.6" rotation="-8 0 0"
              look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>
  </a-entity>
</a-scene>

<div class="controls">
  <div class="row" id="anims"><span class="label">動作</span></div>
  <div class="row" id="moods"><span class="label">場景</span></div>
  <div class="row"><button class="btn primary" id="vrBtn" type="button">進入 VR／全螢幕</button></div>
</div>
<div class="hint">拖曳環繞場景・點寶石或機器人互動</div>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.8.0/dist/aframe-v1.8.0.min.js"></script>
<script>
// Plays glTF animation clips with cross-fades (A-Frame core has no animation-mixer)
AFRAME.registerComponent("robot-clip", {
  schema: { clip: { default: "Idle" } },
  init() {
    this.actions = {};
    this.current = null;
    this.el.addEventListener("model-loaded", (e) => {
      const THREE = AFRAME.THREE;
      const model = e.detail.model;
      this.mixer = new THREE.AnimationMixer(model);
      for (const clip of model.animations) this.actions[clip.name] = this.mixer.clipAction(clip);
      for (const name of ["Jump", "Wave", "Yes"]) {
        const a = this.actions[name];
        if (a) { a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; }
      }
      this.mixer.addEventListener("finished", () => this.fadeTo(this.data.clip));
      this.fadeTo(this.data.clip);
    });
  },
  update() { if (this.mixer) this.fadeTo(this.data.clip); },
  fadeTo(name) {
    const next = this.actions[name];
    if (!next || next === this.current) return;
    next.reset().setEffectiveWeight(1).fadeIn(0.3).play();
    if (this.current) this.current.fadeOut(0.3);
    this.current = next;
  },
  oneShot(name) { this.current = null; this.fadeTo(name); },
  tick(t, dt) { if (this.mixer) this.mixer.update(Math.min(dt, 100) / 1000); },
});

// Drag to orbit the rig around the Y axis, slow auto-rotate when idle
AFRAME.registerComponent("orbit-drag", {
  schema: { autoSpeed: { default: 6 } },
  init() {
    this.yaw = 0; this.pitch = 0; this.vel = 0; this.dragging = false; this.idle = 0;
    const canvas = () => this.el.sceneEl.canvas;
    const down = (e) => { this.dragging = true; this.lastX = e.clientX; this.lastY = e.clientY; this.idle = 0; };
    const move = (e) => {
      if (!this.dragging) return;
      const dx = e.clientX - this.lastX, dy = e.clientY - this.lastY;
      this.lastX = e.clientX; this.lastY = e.clientY;
      this.vel = -dx * 0.35;
      this.yaw += this.vel;
      this.pitch = Math.max(-12, Math.min(18, this.pitch - dy * 0.2));
    };
    const up = () => { this.dragging = false; };
    this.el.sceneEl.addEventListener("loaded", () => {
      canvas().addEventListener("pointerdown", down);
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", up);
    });
  },
  tick(t, dt) {
    const s = Math.min(dt, 100) / 1000;
    if (!this.dragging) {
      this.idle += s;
      this.vel *= 0.92;
      this.yaw += this.vel + (this.idle > 1.5 ? this.data.autoSpeed * s : 0);
    }
    const toRad = AFRAME.THREE.MathUtils.degToRad;
    this.el.object3D.rotation.set(toRad(this.pitch), toRad(this.yaw), 0, "YXZ");
  },
});

const scene = document.querySelector("a-scene");
const bot = document.getElementById("bot");
const sky = document.getElementById("sky");
const sun = document.getElementById("sun");
const fill = document.getElementById("fill");
const cam = document.getElementById("cam");

const ANIMS = [["Dance", "跳舞"], ["Walking", "走路"], ["Idle", "待機"], ["Wave", "揮手"]];
const MOODS = [["day", "夕陽"], ["night", "夜景"]];

function setPressed(rowId, key) {
  document.querySelectorAll(`#${rowId} .btn`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
}

function playClip(name) {
  if (name === "Wave") {
    bot.components["robot-clip"].oneShot("Wave");
  } else {
    bot.setAttribute("robot-clip", "clip", name);
  }
  setPressed("anims", name === "Wave" ? bot.getAttribute("robot-clip").clip : name);
}

function setMood(mood) {
  const night = mood === "night";
  sky.setAttribute("material", "color", night ? "#2b3a6e" : "#ffffff");
  sun.setAttribute("light", { intensity: night ? 0.6 : 2.6, color: night ? "#9db4ff" : "#ffe2b8" });
  fill.setAttribute("light", "intensity", night ? 0.35 : 1.1);
  document.querySelectorAll(".gem").forEach((g) => g.setAttribute("material", "emissiveIntensity", night ? 1.4 : 0.25));
  setPressed("moods", mood);
}

function addButtons(rowId, list, onClick, first) {
  const row = document.getElementById(rowId);
  for (const [k, label] of list) {
    const b = document.createElement("button");
    b.className = "btn"; b.type = "button"; b.dataset.k = k; b.textContent = label;
    b.setAttribute("aria-pressed", String(k === first));
    b.addEventListener("click", () => onClick(k));
    row.append(b);
  }
}
addButtons("anims", ANIMS, playClip, "Dance");
addButtons("moods", MOODS, setMood, "day");

// Clicking a gem pops it; clicking the robot makes it jump
document.querySelectorAll(".gem").forEach((g) => g.addEventListener("click", () => {
  bot.components["robot-clip"].oneShot("Yes");
}));
bot.addEventListener("click", () => bot.components["robot-clip"].oneShot("Jump"));

// Wider lens on portrait screens so the whole stage stays in frame
function fitLens() {
  cam.setAttribute("camera", "fov", innerWidth < innerHeight ? 68 : 45);
}
addEventListener("resize", fitLens);
fitLens();
</script>
</body>
</html>
