<style>
  .sc-scene a-scene.af { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .sc-scene a-scene.af canvas { touch-action: none; }
  .chip { position: absolute; left: 10px; top: calc(var(--sc-ctl-h, 0px) + 10px); z-index: 105; max-width: min(460px, calc(100% - 20px));

  .chip b { color: var(--accent); font: 600 12px/1.5 var(--mono); }

<script src="_shared/showcase.js"></script>
<script type="module">
// A-Frame showcase: eight scenes, each mounts its own embedded <a-scene> and removes it on unmount
// (A-Frame disposes the renderer on disconnect; we additionally force the GL context loss).
const { h, fmt } = Showcase;
const THREE = AFRAME.THREE;
const PANO = "_shared/img/panorama.jpg";
const ROBOT = "_shared/models/robot.glb";
const ENV_URL = "https://cdn.jsdelivr.net/npm/aframe-environment-component@1.5.0/dist/aframe-environment-component.min.js";
const PALETTE = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Serialize a component the way markup would show it: only values that differ from the schema default (plus `keep`).
function brief(el, name, keep = []) {
  const c = el.components[name];
  if (!c) return "";
  const out = {};
  for (const [k, v] of Object.entries(c.data)) {
    const p = c.schema[k], def = p ? p.default : undefined;
    // Compare through the property's own stringify (selector values are elements, not JSON-safe).
    const same = v === def || (p && v != null && def != null && p.stringify(v) === p.stringify(def));
    if (keep.includes(k) || !same) out[k] = v;
  }
  return c.stringify(out);
}

function chip(ctx, html) {
  const el = h("div", { class: "chip" });
  el.innerHTML = html;
  ctx.el.append(el);
  let last = html;
  return (next) => { if (next !== last) { last = next; el.innerHTML = next; } };
}

function flash(ctx, text) {
  const s = ctx.status(text);
  ctx.timeout(() => s.done(), 2600);
}

// Keep the scene centred in the area left free by the control bars and guarantee a minimum
// vertical (fov) and horizontal (hfov) field of view on any aspect ratio. With `chip`, the info chip
// under the top controls is kept clear as well.
AFRAME.registerComponent("view-fit", {
  schema: { fov: { default: 45 }, hfov: { default: 60 }, chip: { default: false } },
  // Bottom edge of the info chip, measured once per layout so later chip text changes do not shift the view.
  chipBottom(key) {
    if (this.chipKey !== key) {
      const c = this.host && this.host.querySelector(":scope > .chip");
      if (!c || !c.textContent.trim()) return 0;
      this.chipKey = key;
      this.chipB = c.offsetTop + c.offsetHeight + 8;
    }
    return this.chipB;
  },
  tick() {
    const sc = this.el, cam = sc.camera, cv = sc.canvas;
    if (!cam || !cv || sc.is("vr-mode")) return;
    const w = cv.clientWidth, hh = cv.clientHeight;
    if (!w || !hh) return;
    const host = this.host || (this.host = sc.closest(".sc-scene"));
    let top = host ? parseFloat(host.style.getPropertyValue("--sc-ctl-h")) || 0 : 0;
    let bot = host ? parseFloat(host.style.getPropertyValue("--sc-ctl-b")) || 0 : 0;
    if (this.data.chip) top = Math.max(top, this.chipBottom(`${w}x${hh}x${top}`));
    if (top + bot > hh * 0.5) { const k = (hh * 0.5) / (top + bot); top *= k; bot *= k; }
    const a = hh - top - bot, d = (top - bot) / 2, rad = Math.PI / 180;
    const t = Math.max(Math.tan((this.data.fov * rad) / 2), (Math.tan((this.data.hfov * rad) / 2) * a) / w);
    const fullH = hh + 2 * Math.abs(d), offY = d < 0 ? -2 * d : 0;
    const fov = (2 * Math.atan((t * fullH) / a)) / rad;
    const v = cam.view;
    if (Math.abs(cam.fov - fov) > 1e-4 || Math.abs(cam.aspect - w / fullH) > 1e-6 || !v || !v.enabled
      || v.fullHeight !== fullH || v.offsetY !== offY || v.width !== w || v.height !== hh) {
      cam.fov = fov;
      cam.setViewOffset(w, fullH, 0, offY, w, hh);
    }
  },
});

// glTF clip player with cross-fades (A-Frame core has no animation mixer component).
AFRAME.registerComponent("robot-clip", {
  schema: { clip: { default: "Idle" } },
  init() {
    this.actions = {};
    this.current = null;
    this.mixer = null;
    this.onLoaded = (e) => {
      const model = e.detail.model;
      this.mixer = new THREE.AnimationMixer(model);
      for (const clip of model.animations) this.actions[clip.name] = this.mixer.clipAction(clip);
      for (const name of ["Jump", "Wave", "Yes"]) {
        const a = this.actions[name];
        if (a) { a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; }
      }
      this.mixer.addEventListener("finished", () => this.fadeTo(this.data.clip));
      this.fadeTo(this.data.clip);
    };
    this.el.addEventListener("model-loaded", this.onLoaded);
  },
  update() { if (this.mixer) this.fadeTo(this.data.clip); },
  fadeTo(name, force = false) {
    const next = this.actions[name];
    if (!next || (next === this.current && !force)) return;
    next.reset().setEffectiveWeight(1).fadeIn(0.3).play();
    if (this.current && this.current !== next) this.current.fadeOut(0.3);
    this.current = next;
  },
  oneShot(name) { if (this.mixer) this.fadeTo(name, true); },
  tick(t, dt) { if (this.mixer) this.mixer.update(Math.min(dt, 100) / 1000); },
  remove() {
    this.el.removeEventListener("model-loaded", this.onLoaded);
    if (this.mixer) this.mixer.stopAllAction();
  },
});

// Drag to orbit the rig around Y (and tilt a little), slow auto-rotate when idle.
AFRAME.registerComponent("orbit-drag", {
  schema: { autoSpeed: { default: 6 }, pitchMin: { default: -12 }, pitchMax: { default: 18 } },
  init() {
    this.yaw = 0; this.pitch = 0; this.vel = 0; this.idle = 0; this.moved = 0; this.dragging = false;
    this.down = (e) => { this.dragging = true; this.moved = 0; this.idle = 0; this.lastX = e.clientX; this.lastY = e.clientY; };
    this.move = (e) => {
      if (!this.dragging) return;
      const dx = e.clientX - this.lastX, dy = e.clientY - this.lastY;
      this.lastX = e.clientX; this.lastY = e.clientY;
      this.moved += Math.abs(dx) + Math.abs(dy);
      this.vel = -dx * 0.35;
      this.yaw += this.vel;
      this.pitch = Math.max(this.data.pitchMin, Math.min(this.data.pitchMax, this.pitch - dy * 0.2));
    };
    this.up = () => { this.dragging = false; };
    this.attach = () => {
      this.canvas = this.el.sceneEl.canvas;
      this.canvas.addEventListener("pointerdown", this.down);
      window.addEventListener("pointermove", this.move);
      window.addEventListener("pointerup", this.up);
      window.addEventListener("pointercancel", this.up);
    };
    if (this.el.sceneEl.hasLoaded) this.attach();
    else this.el.sceneEl.addEventListener("loaded", this.attach, { once: true });
  },
  tick(t, dt) {
    const s = Math.min(dt, 100) / 1000;
    if (!this.dragging) {
      this.idle += s;
      this.vel *= 0.92;
      this.yaw += this.vel + (this.idle > 1.5 ? this.data.autoSpeed * s : 0);
    }
    const toRad = THREE.MathUtils.degToRad;
    this.el.object3D.rotation.set(toRad(this.pitch), toRad(this.yaw), 0, "YXZ");
  },
  remove() {
    this.el.sceneEl.removeEventListener("loaded", this.attach);
    if (this.canvas) this.canvas.removeEventListener("pointerdown", this.down);
    window.removeEventListener("pointermove", this.move);
    window.removeEventListener("pointerup", this.up);
    window.removeEventListener("pointercancel", this.up);
  },
});

// A custom component with its own system: a ring of glowing spheres orbiting the entity.
AFRAME.registerSystem("orbit-swarm", {
  init() {
    this.hooks = { init: 0, update: 0, play: 0, pause: 0, remove: 0 };
    this.list = new Set();
  },
  total() { let n = 0; for (const c of this.list) n += c.data.count; return n; },
});
AFRAME.registerComponent("orbit-swarm", {
  multiple: true,
  schema: {
    count: { type: "int", default: 24 },
    radius: { default: 1.6 },
    speed: { default: 1 },
    color: { type: "color", default: "#4cc9f0" },
    tilt: { default: 0 },
  },
  init() {
    this.system.hooks.init++;
    this.system.list.add(this);
    this.geo = new THREE.SphereGeometry(0.075, 14, 10);
    this.mat = new THREE.MeshStandardMaterial({ roughness: 0.35, emissiveIntensity: 0.7 });
    this.group = new THREE.Group();
    this.group.rotation.order = "ZYX";
    this.el.setObject3D(this.attrName, this.group);
  },
  update(old) {
    this.system.hooks.update++;
    const d = this.data;
    if (d.count !== old.count || d.radius !== old.radius) {
      this.group.clear();
      for (let i = 0; i < d.count; i++) {
        const m = new THREE.Mesh(this.geo, this.mat);
        const a = (i / d.count) * Math.PI * 2;
        m.position.set(Math.cos(a) * d.radius, 0, Math.sin(a) * d.radius);
        this.group.add(m);
      }
    }
    this.mat.color.set(d.color);
    this.mat.emissive.set(d.color);
    this.group.rotation.z = THREE.MathUtils.degToRad(d.tilt);
  },
  tick(t, dt) {
    this.group.rotation.y += (this.data.speed * Math.min(dt, 100)) / 1000;
    const kids = this.group.children;
    for (let i = 0; i < kids.length; i++) kids[i].position.y = Math.sin(t * 0.003 + i * 0.7) * 0.12;
  },
  play() { this.system.hooks.play++; },
  pause() { this.system.hooks.pause++; },
  remove() {
    this.system.hooks.remove++;
    this.system.list.delete(this);
    this.el.removeObject3D(this.attrName);
    this.geo.dispose();
    this.mat.dispose();
  },
});

// Per-entity orbit driven by its own tick (used by the stress test).
AFRAME.registerComponent("spinner", {
  schema: { r: { default: 1 }, a: { default: 0 }, w: { default: 0.3 }, y: { default: 0 } },
  tick(t) {
    const d = this.data, ang = d.a + t * 0.001 * d.w, o = this.el.object3D;
    o.position.set(Math.cos(ang) * d.r, d.y, Math.sin(ang) * d.r);
    o.rotation.y = -ang * 3;
  },
});

// Insert an embedded <a-scene> and tie its lifetime to the showcase scene.
function mountScene(ctx, inner, { host = ctx.el, attrs = "", fov = 45, hfov = 60, chip = false, exposure = 1 } = {}) {
  host.insertAdjacentHTML("afterbegin", `<a-scene class="af" embedded view-fit="fov: ${fov}; hfov: ${hfov}; chip: ${chip}"
    renderer="antialias: true; toneMapping: ACESFilmic; exposure: ${exposure}" xr-mode-ui="enabled: false"
    loading-screen="enabled: false" device-orientation-permission-ui="enabled: false" keyboard-shortcuts="enterVR: false"
    ${attrs}>${inner}</a-scene>`);
  const sc = host.firstElementChild;
  ctx.onResize(() => { if (sc.camera) sc.resize(); });
  ctx.onCleanup(() => {
    const r = sc.renderer;
    sc.remove();
    if (r) r.forceContextLoss();
  });
  return sc;
}
const whenLoaded = (sc, fn) => { if (sc.hasLoaded) fn(); else sc.addEventListener("loaded", fn, { once: true }); };
const fixedCam = (attrs) => `<a-entity camera ${attrs} look-controls="enabled: false" wasd-controls="enabled: false"></a-entity>`;

const gem = (tag, size, pos, upTo, floatDur, spinTo, spinDur, material) => `
  <${tag} class="clickable gem" ${size} position="${pos}" material="${material}" shadow="cast: true; receive: false"
    animation__float="property: position; to: ${upTo}; dir: alternate; loop: true; dur: ${floatDur}; easing: easeInOutSine"
    animation__spin="property: rotation; to: ${spinTo}; loop: true; dur: ${spinDur}; easing: linear"
    animation__pop="property: scale; from: 1.6 1.6 1.6; to: 1 1 1; dur: 600; easing: easeOutElastic; startEvents: pop"></${tag}>`;

const PRIMS = [
  ["a-box", 'width="0.9" height="0.9" depth="0.9"'],
  ["a-sphere", 'radius="0.55"'],
  ["a-cylinder", 'radius="0.42" height="0.9"'],
  ["a-cone", 'radius-bottom="0.5" radius-top="0" height="0.95"'],
  ["a-torus", 'radius="0.38" radius-tubular="0.1"'],
  ["a-torus-knot", 'radius="0.3" radius-tubular="0.08"'],
  ["a-dodecahedron", 'radius="0.52"'],
  ["a-octahedron", 'radius="0.55"'],
  ["a-icosahedron", 'radius="0.52"'],
  ["a-tetrahedron", 'radius="0.6"'],
  ["a-ring", 'radius-inner="0.25" radius-outer="0.5"'],
  ["a-plane", 'width="0.85" height="0.85"'],
];
const EASES = ["linear", "easeInQuad", "easeOutCubic", "easeInOutSine", "easeOutExpo", "easeInOutBack", "easeOutElastic"];
const ENV_PRESETS = [
  ["default", "預設"], ["contact", "接觸"], ["egypt", "埃及"], ["checkerboard", "棋盤"], ["forest", "森林"], ["goaland", "草原"],
  ["yavapai", "峽谷"], ["goldmine", "金礦"], ["arches", "拱門"], ["threetowers", "三塔"], ["poison", "毒霧"], ["tron", "電網"],
  ["japan", "日式"], ["dream", "夢境"], ["volcano", "火山"], ["starry", "星空"], ["osiris", "歐西里斯"], ["moon", "月面"],
];

Showcase.run({ scenes: [
  {
    id: "showroom", title: "機器人展間",
    api: "<a-assets>・gltf-model=\"#robot\"・animation__pop=\"startEvents: pop\"",
    desc: "原本的 360 度展場：a-assets 預載全景圖與 glTF 機器人，自訂 robot-clip 元件交叉淡入切換動作；寶石的漂浮、自轉、彈跳全是宣告式 animation 元件，點擊由 cursor 元件轉成 DOM 事件。",
    hint: "拖曳環繞場景・點寶石或機器人互動",
    mount(ctx) {
      const sc = mountScene(ctx, `
        <a-assets timeout="10000">
          <img id="s1-pano" src="${PANO}" crossorigin="anonymous">
          <a-asset-item id="s1-robot" src="${ROBOT}"></a-asset-item>
        </a-assets>
        <a-sky class="sky" src="#s1-pano" radius="60" rotation="0 -90 0"></a-sky>
        <a-entity class="sun" light="type: directional; color: #ffe2b8; intensity: 2.6; castShadow: true; shadowMapWidth: 1024; shadowMapHeight: 1024;
          shadowRadius: 3; shadowBias: -0.0005; shadowCameraLeft: -3; shadowCameraRight: 3; shadowCameraTop: 3; shadowCameraBottom: -3" position="2.5 5 3"></a-entity>
        <a-entity class="fill" light="type: hemisphere; color: #bfd8ff; groundColor: #3a2a1a; intensity: 1.1"></a-entity>
        <a-cylinder radius="1.7" height="0.16" position="0 -0.08 0" segments-radial="96"
          material="color: #4a5262; metalness: 0.15; roughness: 0.6" shadow="cast: false; receive: true"></a-cylinder>
        <a-torus radius="1.72" radius-tubular="0.018" segments-tubular="160" rotation="90 0 0" position="0 0.005 0"
          material="color: #f7df1e; emissive: #f7df1e; emissiveIntensity: 0.9"></a-torus>
        <a-entity class="bot clickable" gltf-model="#s1-robot" scale="0.36 0.36 0.36" rotation="0 20 0"
          shadow="cast: true; receive: false" robot-clip="clip: Dance"></a-entity>
        ${gem("a-octahedron", 'radius="0.22"', "-1.35 1.25 0.2", "-1.35 1.55 0.2", 1800, "0 360 0", 6000,
          "color: #4cc9f0; metalness: 0.35; roughness: 0.15; emissive: #4cc9f0; emissiveIntensity: 0.25")}
        ${gem("a-dodecahedron", 'radius="0.2"', "1.3 1.45 -0.3", "1.3 1.15 -0.3", 2200, "360 360 0", 8000,
          "color: #f72585; metalness: 0.35; roughness: 0.2; emissive: #f72585; emissiveIntensity: 0.25")}
        ${gem("a-torus-knot", 'radius="0.14" radius-tubular="0.04"', "0.95 0.55 1.05", "0.95 0.8 1.05", 1600, "360 0 360", 7000,
          "color: #f7df1e; metalness: 0.8; roughness: 0.25; emissive: #a08800; emissiveIntensity: 0.25")}
        ${gem("a-icosahedron", 'radius="0.17"', "-0.95 0.5 0.95", "-0.95 0.75 0.95", 2000, "0 360 360", 5000,
          "color: #7bd389; metalness: 0.35; roughness: 0.2; emissive: #7bd389; emissiveIntensity: 0.25")}
        <a-entity cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable; far: 40"></a-entity>
        <a-entity class="rig" orbit-drag="autoSpeed: 6">${fixedCam('position="0 1.45 4.6" rotation="-8 0 0"')}</a-entity>`,
      { attrs: 'shadow="type: pcf"', exposure: 1.1, fov: 45, hfov: 52 });
      const $ = (s) => sc.querySelector(s);
      const bot = $(".bot"), rig = $(".rig");
      const st = ctx.status("載入 glTF 機器人…");
      bot.addEventListener("model-loaded", () => st.done(), { once: true });
      bot.addEventListener("model-error", () => st.error("機器人模型載入失敗"), { once: true });
      const rc = () => bot.components["robot-clip"];
      const CLIPS = [["Idle", "待機"], ["Walking", "走路"], ["Running", "跑步"], ["Dance", "跳舞"], ["Wave", "揮手"]];
      let clip = "Dance", lastEvent = "尚未點擊";
      const setChip = chip(ctx, "");
      const show = () => setChip(`<code>&lt;a-entity gltf-model="#robot" robot-clip="clip: ${clip}"&gt;</code><br>最後事件：${lastEvent}`);
      show();
      const clipGroup = ctx.group(CLIPS.map((c) => c[1]), 3, (i) => {
        const name = CLIPS[i][0];
        if (name === "Wave") {
          if (rc()) rc().oneShot("Wave");
          clipGroup.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", String(CLIPS[k][0] === clip)));
          lastEvent = "揮手一次後回到原動作";
        } else {
          clip = name;
          bot.setAttribute("robot-clip", "clip", name);
        }
        show();
      });
      ctx.group(["夕陽", "夜景"], 0, (i) => {
        const night = i === 1;
        $(".sky").setAttribute("material", "color", night ? "#2b3a6e" : "#ffffff");
        $(".sun").setAttribute("light", { intensity: night ? 0.6 : 2.6, color: night ? "#9db4ff" : "#ffe2b8" });
        $(".fill").setAttribute("light", "intensity", night ? 0.35 : 1.1);
        sc.querySelectorAll(".gem").forEach((g) => g.setAttribute("material", "emissiveIntensity", night ? 1.4 : 0.25));
      });
      ctx.button("VR／全螢幕", async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else if (sc.checkHeadsetConnected()) await sc.enterVR();
          else await ctx.el.requestFullscreen();
        } catch (err) {
          flash(ctx, `無法切換：${err.message || err}`);
        }
      }, { primary: true });
      ctx.onCleanup(() => { if (document.fullscreenElement === ctx.el) document.exitFullscreen(); });
      ctx.on(sc, "click", (e) => {
        const t = e.target;
        if (!t.classList || !t.classList.contains("clickable")) return;
        if (rig.components["orbit-drag"] && rig.components["orbit-drag"].moved > 6) return;
        if (t.classList.contains("gem")) {
          t.emit("pop", null, false);
          if (rc()) rc().oneShot("Yes");
          lastEvent = `<b>click</b> → ${t.tagName.toLowerCase()} 觸發 animation__pop，機器人點頭`;
        } else {
          if (rc()) rc().oneShot("Jump");
          lastEvent = "<b>click</b> → 機器人跳一下";
        }
        show();
      });
    },
  },
  {
    id: "primitives", title: "實體與元件",
    api: "<a-box color> = <a-entity geometry material>・<a-mixin>・<a-text>",
    desc: "12 種 primitive 標籤都是 a-entity 加上 geometry 與 material 元件的簡寫；同一個 a-mixin 幫它們套上自轉與滑過放大的動畫元件，標籤則是 a-text 以 SDF 字型繪製的 3D 文字。",
    hint: "滑鼠移到物件上會放大・點一下看它展開成哪些元件",
    mount(ctx) {
      const slots = PRIMS.map(([tag, attrs], i) => `
        <a-entity class="slot">
          <${tag} class="prim" mixin="s2-look" ${attrs} color="${PALETTE[i % PALETTE.length]}"></${tag}>
          <a-text value="${tag}" font="sourcecodepro" align="center" width="4.4" color="#cfd6e4" position="0 -0.85 0"></a-text>
        </a-entity>`).join("");
      const sc = mountScene(ctx, `
        <a-assets>
          <a-mixin id="s2-look" material="side: double"
            animation__spin="property: rotation; from: 20 0 0; to: 20 360 0; loop: true; dur: 9000; easing: linear"
            animation__hover="property: scale; to: 1.25 1.25 1.25; dur: 220; easing: easeOutQuad; startEvents: mouseenter"
            animation__unhover="property: scale; to: 1 1 1; dur: 220; easing: easeOutQuad; startEvents: mouseleave"></a-mixin>

      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const ensure = (n) => {
        for (let i = P.r.length; i < n; i++) {
          const arm = i % 5, r = 0.6 + 11 * Math.pow(rnd(), 0.7);
          P.arm.push(arm); P.r.push(r);
          P.a.push(arm * ((Math.PI * 2) / 5) + r * 0.45 + (rnd() - 0.5) * 0.7);
          P.w.push(0.55 / (0.6 + r * 0.35));
          P.y.push((rnd() - 0.5) * (1.6 - r * 0.08));
        }
      };
      let mode = 0, target = 0, buildMs = 0, rebuild = false, chain = Promise.resolve();
      const markup = (i) => {
        const r = P.r[i], a = P.a[i], y = P.y[i].toFixed(2);
        const extra = mode === 1 ? ` spinner="r: ${r.toFixed(2)}; a: ${a.toFixed(3)}; w: ${P.w[i].toFixed(3)}; y: ${y}"`
          : mode === 2 ? ` animation="property: rotation; to: 0 360 0; loop: true; dur: ${2000 + (i % 7) * 400}; easing: linear"` : "";
        return `<a-entity geometry="primitive: box; width: 0.2; height: 0.2; depth: 0.2" material="color: ${PALETTE[P.arm[i]]}; roughness: 0.5"
          position="${(Math.cos(a) * r).toFixed(2)} ${y} ${(Math.sin(a) * r).toFixed(2)}"${extra}></a-entity>`;
      };
      const sync = async () => {
        if (rebuild) { rebuild = false; field.replaceChildren(); }
        let spent = 0, built = 0;
        while (ctx.active && field.childElementCount < target) {
          const from = field.childElementCount, to = Math.min(target, from + 2000);
          ensure(to);
          let html = "";
          for (let i = from; i < to; i++) html += markup(i);
          const t0 = performance.now();
          field.insertAdjacentHTML("beforeend", html);
          await null; // entity components initialise in queued microtasks; include them in the timing
          spent += performance.now() - t0;
          built += to - from;
          await ctx.frame();
        }
        while (field.childElementCount > target) field.lastElementChild.remove();
        if (built) buildMs = spent;
      };
      const queue = () => (chain = chain.then(sync));
      ctx.group(["靜態", "tick 元件", "animation 元件"], 0, (i) => { mode = i; rebuild = true; queue(); });
      ctx.ramp({
        label: "實體數", unit: "個",
        steps: [100, 250, 500, 1000, 2000, 4000, 6000, 10000],
        minFps: 30,
        apply(n) { target = n; return queue(); },
        metrics: () => ({
          建立耗時: `${fmt(buildMs, 0)} ms`,
          "Draw calls": sc.renderer ? sc.renderer.info.render.calls : 0,
          "DOM 節點": field.childElementCount,
        }),
        note: "每個 <a-entity> 都是獨立的 DOM 節點，掛著自己的元件與 three.js Mesh，A-Frame 不會自動合併或 instancing，所以 draw call 隨實體數線性成長。「tick 元件」讓每個實體每格各跑一次 JS；「animation 元件」為每個實體各建一個補間動畫。建立耗時包含 HTML 解析、自訂元素升級與元件初始化。要畫上萬個物件，應改在單一元件裡用 InstancedMesh。",
      });
    },
  },
] });
</script>
</body>
</html>
