<style>

  .ab-sheet { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 4px; background: #fdfcf8; color: #1e1d1a; border-radius: 10px; border: 1px solid var(--line); padding: 8px 10px; overflow: hidden; }
  .ab-sheet.ab-scroll { overflow-y: auto; scrollbar-width: thin; }
  .ab-paper { position: relative; flex: 1; min-height: 0; min-width: 0; }
  .ab-paper svg { display: block; width: 100%; height: 100%; }
  .ab-scroll .ab-paper { flex: none; }
  .ab-scroll .ab-paper svg { height: auto; }
  .ab-sheet .abcjs-title, .ab-sheet .abcjs-composer, .ab-sheet .abcjs-lyric, .ab-sheet .abcjs-tempo, .ab-sheet .abcjs-tab-label { font-family: var(--font); }
  .ab-sheet .abcjs-lyric { fill: #7d7869; }
  .ab-click .abcjs-note, .ab-click .abcjs-rest { cursor: pointer; }
  .ab-sheet .ab-hl { fill: #f72585; color: #f72585; }
  .ab-sheet .ab-pick { fill: #0b84c9; color: #0b84c9; }
  .ab-cur { stroke: #f72585; stroke-width: 2; opacity: 0.45; }
  .ab-cap { flex: none; display: flex; align-items: baseline; gap: 8px; min-width: 0; font-size: 12px; color: #6f6a5c; white-space: nowrap; overflow: hidden; }
  .ab-cap b { color: #1e1d1a; font-weight: 600; }
  .ab-cap code { font: 11px var(--mono); color: #9a5a00; overflow: hidden; text-overflow: ellipsis; }
  .ab-cap .ab-r { margin-left: auto; font-family: var(--mono); font-size: 11px; }
  .ab-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .ab-lbl { flex: none; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .ab-lbl b { color: var(--fg); font-weight: 600; }
  .ab-m { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ab-ta { flex: 1; min-height: 0; width: 100%; resize: none; border-radius: 10px; border: 1px solid var(--line); background: #0b0d11; color: var(--fg); padding: 9px 11px; font: 12px/1.55 var(--mono); outline: none; scrollbar-width: thin; }
  .ab-ta:focus { border-color: var(--accent); }
  .ab-warn { flex: none; min-height: 18px; font-size: 12px; color: var(--c4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ab-warn.bad { color: var(--c5); }
  .ab-cvh { position: relative; min-width: 0; min-height: 0; }
  .ab-cvh > canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .ab-meter { flex: none; height: 30px; border-radius: 6px; background: #f1eee5; overflow: hidden; }

  /* 1. live */
  .ab-live { grid-template-columns: 270px minmax(0, 1fr); }
  @media (max-width: 640px) {
    .ab-live { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 104px; gap: 8px; }
    .ab-live .ab-ed { order: 2; }
    .ab-live .ab-meter { height: 22px; }
  }

  /* 2. syntax cards */
  .ab-cards { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .ab-cards .ab-sheet { padding: 6px 8px; cursor: pointer; transition: box-shadow .2s; }
  .ab-cards .ab-sheet.on { box-shadow: 0 0 0 2px #f72585; }
  @media (max-width: 700px) {
    .ab-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .ab-cards .ab-cap code { display: none; }
  }

  /* 3. editor */
  .ab-edit { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); }
  @media (max-width: 640px) { .ab-edit { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; } }
  .ab-edit .ab-ta::selection { background: rgba(76, 201, 240, 0.4); }

  /* 4. synth */
  .ab-synth { grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); }
  .ab-scope { display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr); gap: 6px; min-height: 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: #0b0d11; }

  /* 5. transpose */
  .ab-tr { grid-template-columns: minmax(0, 1fr) minmax(0, 250px); }
  .ab-tr .ab-col > .ab-sheet { flex: 1; }
  .ab-pre { flex: 1; min-height: 0; margin: 0; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--line); background: #0b0d11; color: var(--fg); font: 11.5px/1.55 var(--mono); white-space: pre; overflow: auto; scrollbar-width: thin; }
  .ab-pre mark { background: rgba(247, 223, 30, 0.22); color: var(--accent); border-radius: 3px; }
  @media (max-width: 640px) {
    .ab-tr { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 96px; gap: 8px; }
    .ab-tr .ab-col:first-child { gap: 4px; }
  }

  /* 6. tablature / 7. layout */
  .ab-solo { grid-template-columns: minmax(0, 1fr); }

  /* small viewports: fit scores to width and scroll vertically instead of shrinking them to fit the height */
  @media (max-width: 640px), (max-height: 520px) {
    .ab-board:not(.ab-cards) .ab-sheet { overflow-y: auto; scrollbar-width: thin; }
    .ab-board:not(.ab-cards) .ab-paper { flex: none; }
    .ab-board:not(.ab-cards) .ab-paper svg { height: auto; }
    .ab-live .ab-meter { position: sticky; bottom: 0; }
  }

  /* 8. stress */
  .ab-stress { position: absolute; inset: 8px 8px 8px 350px; }
  @media (max-width: 760px) { .ab-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); opacity: .9; } }

<body>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.7.1/dist/abcjs-basic-min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// abcjs showcase: ABC text -> engraved SVG, editor, soundfont synth, transposition, tablature, layout and a render benchmark.
const { h } = Showcase;
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font") || "sans-serif";

const TUNES = {
  "小步舞曲": `X:1
T:小步舞曲 G 大調
C:佩措爾德（舊傳巴赫）
M:3/4
L:1/8
Q:1/4=126
K:G
"G"d2 GABc|d2 G2 G2|"C"e2 cdef|"G"g2 G2 G2|
"C"c2 dcBA|"G"B2 cBAG|"D"F2 GABG|"D7"A6|
"G"d2 GABc|d2 G2 G2|"C"e2 cdef|"G"g2 G2 G2|
"C"c2 dcBA|"G"B2 cBAG|"D7"A2 BAGF|"G"G6|]`,
  "小星星": `X:2
T:小星星
C:法國民謠
M:4/4
L:1/4
Q:1/4=100
K:C
"C"C C G G|"F"A A "C"G2|"F"F F "C"E E|"G"D D "C"C2|
w:do do sol sol la la sol fa fa mi mi re re do
"C"G G "F"F F|"C"E E "G"D2|"C"G G "F"F F|"C"E E "G"D2|
w:sol sol fa fa mi mi re sol sol fa fa mi mi re
"C"C C G G|"F"A A "C"G2|"F"F F "C"E E|"G"D D "C"C2|]
w:do do sol sol la la sol fa fa mi mi re re do`,
};
const GRACE = `X:3
T:奇異恩典
C:美國傳統聖詩
M:3/4
L:1/4
Q:1/4=88
K:G
D|"G"G2 B/G/|B2 A|"C"G2 E|"G"D2 D|"G"G2 B/G/|B2 A/B/|"D"d3|d2 B/d/|
"G"d2 B/G/|"G7"B2 A|"C"G2 E|"G"D2 D|"G"G2 B/G/|"D7"B2 A|"G"G3|G2|]`;
const ETUDE = `X:4
T:練習曲 D 大調
C:示範用自製旋律
M:4/4
L:1/8
Q:1/4=96
K:D
"D"D2 FA d2 AF|"G"G2 Bd "A"c2 e2|"Bm"B2 dB "F#m"A2 FA|"G"G2 E2 "A"E4|
"D"F2 Ad f2 ed|"G"B2 dB "A"c2 A2|"G"B2 G2 "A7"E2 c2|"D"d6 z2|]`;
const NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
const sgn = (v) => (v > 0 ? `+${v}` : `${v}`);
const strip = (s) => String(s).replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();

// ---------- engraving helpers ----------
// abcjs writes width/height attributes; swap them for a viewBox so the SVG scales with its box.
function fitSvg(host) {
  host.querySelectorAll("svg").forEach((svg) => {
    const w = parseFloat(svg.getAttribute("width")), hh = parseFloat(svg.getAttribute("height"));
    if (!svg.getAttribute("viewBox") && w && hh) svg.setAttribute("viewBox", `0 0 ${w} ${hh}`);
    svg.removeAttribute("width"); svg.removeAttribute("height");
    svg.setAttribute("preserveAspectRatio", "xMidYMin meet");
  });
  host.style.height = "";
}
const SMALL = matchMedia("(max-width: 640px), (max-height: 520px)");
function engrave(host, abc, opts = {}) {
  // on small viewports scores fit the width, so shrink the header text to keep notes visible
  if (SMALL.matches) abc = abc.replace(/^C:.*\n/m, "").replace(/^(X:.*)$/m, "$1\n%%titlefont * 13\n%%tempofont * 11");
  const tune = ABCJS.renderAbc(host, abc, { add_classes: true, paddingtop: 2, paddingbottom: 2, paddingleft: 4, paddingright: 4, ...opts })[0];
  fitSvg(host);
  return tune;
}
// Re-run fn when the element's width (or size) really changes.
function watch(ctx, el, fn, both = false) {
  let w = el.clientWidth, hh = el.clientHeight;
  const ro = new ResizeObserver(() => {
    const nw = el.clientWidth, nh = el.clientHeight;
    if (Math.abs(nw - w) > 3 || (both && Math.abs(nh - hh) > 3)) { w = nw; hh = nh; if (ctx.active) fn(); }
  });
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
}
function canvasIn(ctx, host) {
  const cv = document.createElement("canvas");
  host.append(cv);
  const v = { g: cv.getContext("2d"), w: 1, h: 1 };
  const fit = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    v.w = Math.max(1, host.clientWidth); v.h = Math.max(1, host.clientHeight);
    cv.width = Math.round(v.w * dpr); cv.height = Math.round(v.h * dpr);
    v.g.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit(); watch(ctx, host, fit, true);
  return v;
}

// ---------- audio ----------
// One AudioContext, created on the first gesture and handed to abcjs with registerAudioContext.
// Everything we play goes out -> analyser -> destination so the meters read the real signal.
let AC = null;
function audio() {
  if (!AC) {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain();
    const an = ac.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0.7;
    out.connect(an); an.connect(ac.destination);
    ABCJS.synth.registerAudioContext(ac);
    AC = { ac, out, an, fq: new Uint8Array(1024), td: new Float32Array(2048) };
  }
  if (AC.ac.state === "suspended") AC.ac.resume();
  return AC;
}
function levelDb() {
  if (!AC) return -Infinity;
  AC.an.getFloatTimeDomainData(AC.td);
  let s = 0;
  for (let i = 0; i < AC.td.length; i++) s += AC.td[i] * AC.td[i];
  return 20 * Math.log10(Math.sqrt(s / AC.td.length) || 1e-9);
}
// CreateSynth loads the soundfont notes it needs, then prime() renders the whole tune to an AudioBuffer.
async function renderAudio(init) {
  const synth = new ABCJS.synth.CreateSynth();
  await synth.init({ audioContext: audio().ac, ...init });
  await synth.prime();
  return synth.getAudioBuffer();
}
// Plays a tune through the analyser; TimingCallbacks drives note highlighting and a cursor line.
function player(ctx, { onState } = {}) {
  let src = null, timer = null, host = null, t0 = 0, dur = 1, token = 0;
  const unmark = () => host && host.querySelectorAll(".ab-hl").forEach((e) => e.classList.remove("ab-hl"));
  function stop() {
    token++;
    if (timer) { timer.stop(); timer = null; }
    if (src) { src.onended = null; try { src.stop(); } catch (e) { /* already stopped */ } src.disconnect(); src = null; }
    unmark();
    if (host) host.querySelectorAll(".ab-cur").forEach((e) => e.remove());
    if (onState) onState(false);
  }
  function mark(ev) {
    if (!ev || (ev.measureStart && ev.left === null)) return;
    unmark();
    ev.elements.forEach((g) => g.forEach((e) => e.classList.add("ab-hl")));
    const svg = ev.elements[0] && ev.elements[0][0] && ev.elements[0][0].closest("svg");
    if (!svg) return;
    let line = svg.querySelector(".ab-cur");
    if (!line) { line = document.createElementNS("http://www.w3.org/2000/svg", "line"); line.setAttribute("class", "ab-cur"); svg.append(line); }
    line.setAttribute("x1", ev.left - 2); line.setAttribute("x2", ev.left - 2);
    line.setAttribute("y1", ev.top); line.setAttribute("y2", ev.top + ev.height);
  }
  async function play(tune, el, { qpm, options = {} } = {}) {
    stop();
    host = el;
    const my = ++token;
    const bpm = qpm || tune.getBpm() || 100;
    const a = audio();
    const t = performance.now();
    const buf = await renderAudio({ visualObj: tune, millisecondsPerMeasure: tune.millisecondsPerMeasure(bpm), options: { ...options, qpm: bpm } });
    const ms = performance.now() - t;
    if (!ctx.active || my !== token || !buf) return null;
    src = a.ac.createBufferSource();
    src.buffer = buf;
    src.connect(a.out);
    src.onended = stop;
    timer = new ABCJS.TimingCallbacks(tune, { qpm: bpm, eventCallback: mark });
    src.start(); timer.start();
    t0 = a.ac.currentTime; dur = buf.duration;
    if (onState) onState(true);
    return { buf, ms };
  }
  ctx.onCleanup(stop);
  return { play, stop, get playing() { return !!src; }, progress: () => (src ? (AC.ac.currentTime - t0) / dur : 0) };
}
// Log-spaced spectrum bars from the shared analyser.
function drawSpectrum(v, { idle = "按播放後顯示 AnalyserNode 即時頻譜", light = true } = {}) {
  const { g, w, h: hh } = v;
  g.clearRect(0, 0, w, hh);
  if (!AC) {
    g.fillStyle = light ? "#8a8577" : "#7d8490"; g.font = `11px ${FONT}`; g.textBaseline = "middle";
    g.fillText(idle, 8, hh / 2);
    return;
  }
  AC.an.getByteFrequencyData(AC.fq);
  const n = Math.min(96, Math.floor(w / 5)), bw = w / n;
  for (let i = 0; i < n; i++) {
    const a = Math.floor(2 * Math.pow(220, i / n)), b = Math.max(a + 1, Math.floor(2 * Math.pow(220, (i + 1) / n)));
    let m = 0;
    for (let j = a; j < b; j++) m = Math.max(m, AC.fq[j]);
    const bh = (m / 255) * hh;
    if (bh < 0.5) continue;
    g.fillStyle = `hsl(${330 - (i / n) * 140} 80% ${light ? 52 : 60}%)`;
    g.fillRect(i * bw + 0.5, hh - bh, Math.max(1, bw - 1), bh);
  }
}
const fail = (ctx, what) => (e) => {
  console.error(`[abcjs] ${what}`, e);
  if (ctx.active) ctx.status("").error(`${what}失敗：${e && e.message ? e.message : e}`);
};

Showcase.run({
  scenes: [
    {
      id: "live", title: "即時記譜",
      api: "ABCJS.renderAbc(el, abc, { clickListener, wrap })・ABCJS.strTranspose()・synth.playEvent()・TimingCallbacks",
      desc: "左邊是純文字的 ABC 記譜，renderAbc 即時排成五線譜，含和弦標記、歌詞與速度。播放時 TimingCallbacks 逐音高亮並畫出游標，點任一音符會用 playEvent 試聽。",
      hint: "改左邊文字會即時重排；拖「移調」用 strTranspose 改寫文字本身；點音符試聽。",
      mount(ctx) {
        ctx.html(`<div class="ab-board ab-live">
          <div class="ab-col ab-ed"><textarea class="ab-ta" spellcheck="false" aria-label="ABC 記譜文字"></textarea><div class="ab-warn"></div></div>
          <div class="ab-sheet ab-click"><div class="ab-paper"></div><div class="ab-meter ab-cvh"></div></div>
        </div>`);
        const ta = ctx.$(".ab-ta"), paper = ctx.$(".ab-paper"), warn = ctx.$(".ab-warn");
        const meter = canvasIn(ctx, ctx.$(".ab-meter"));
        let tune = null, semis = 0, name = "小步舞曲";
        const pl = player(ctx, { onState: (on) => (playBtn.textContent = on ? "■ 停止" : "▶ 播放") });
        function onClick(el) {
          paper.querySelectorAll(".ab-pick").forEach((n) => n.classList.remove("ab-pick"));
          (el.abselem && el.abselem.elemset || []).forEach((n) => n.classList.add("ab-pick"));
          if (!el.midiPitches) tune.setUpAudio();
          if (!el.midiPitches || !el.midiPitches.length) return;
          audio();
          ABCJS.synth.playEvent(el.midiPitches, el.midiGraceNotes, tune.millisecondsPerMeasure()).catch(fail(ctx, "試聽"));
          const p = el.midiPitches[0].pitch;
          warn.className = "ab-warn";
          warn.textContent = `點到的音：${NAMES[p % 12]}${Math.floor(p / 12) - 1}（MIDI ${p}）`;
        }
        function render() {
          pl.stop();
          const w = paper.clientWidth;
          tune = engrave(paper, ta.value, { clickListener: onClick, staffwidth: Math.max(240, w - 24), wrap: { minSpacing: 1.7, maxSpacing: 2.7, preferredMeasuresPerLine: w < 480 ? 3 : 4 } });
          const ws = tune.warnings || [];
          warn.className = ws.length ? "ab-warn bad" : "ab-warn";
          warn.textContent = ws.length ? `語法提示：${strip(ws[0])}` : `解析成功：${tune.lines.length} 行，每小節 ${tune.getBeatsPerMeasure()} 拍`;
        }
        function load(n) { name = n; semis = 0; tr.value = 0; tr.dispatchEvent(new Event("input")); ta.value = TUNES[n]; render(); }
        ctx.group(Object.keys(TUNES), 0, (i, l) => load(l));
        const tr = ctx.slider("移調", { min: -6, max: 6, step: 1, value: 0, format: sgn }, (v) => {
          if (v === semis || !tune) return;
          ta.value = ABCJS.strTranspose(ta.value, ABCJS.parseOnly(ta.value), v - semis);
          semis = v; render();
        });
        const playBtn = ctx.button("▶ 播放", () => {
          if (pl.playing) return pl.stop();
          playBtn.textContent = "載入音色中…";
          pl.play(tune, paper).catch(fail(ctx, "播放"));
        }, { primary: true });
        let timer = 0;
        ctx.on(ta, "input", () => { clearTimeout(timer); timer = setTimeout(() => ctx.active && render(), 250); });
        ctx.onCleanup(() => clearTimeout(timer));
        ta.value = TUNES[name];
        render();
        watch(ctx, paper, render);
        ctx.raf(() => drawSpectrum(meter));
      },
    },
    {
      id: "syntax", title: "記譜語法",
      api: "ABCJS.renderAbc(el, abc)：\"和弦\"・w: 歌詞・(3 三連音・{倚音}・!裝飾!・( ) 圓滑線・- 連結線・[和弦]・V: 多聲部・|: :| 反覆",
      desc: "八張卡片各用幾行 ABC 文字寫出一種記譜元素，全部由同一個 renderAbc 排版。卡片標題列是關鍵語法。",
      hint: "點任一張卡片用合成器播放該段，播放中逐音高亮；再點一次停止。",
      mount(ctx) {
        const head = "X:1\nL:1/8\n";
        const CARDS = [
          ["和弦標記與歌詞", "\"G\" w:", "M:4/4\nL:1/4\nQ:1/4=100\nK:G\n\"G\"G A B G|\"C\"c B \"D7\"A2|\nw:一 閃 一 閃 亮 晶 晶"],
          ["三連音與附點", "(3CDE B>c", "M:2/4\nQ:1/4=80\nK:C\n(3CDE (3FGA|B>c d<e|c/d/e/f/ g2|]"],
          ["倚音與裝飾音", "{g}A !trill!", "M:3/4\nL:1/4\nQ:1/4=80\nK:D\n{g}A !trill!B !mordent!c|{AB}d !turn!e !fermata!f|]"],
          ["圓滑線與連結線", "(FGAB) c2-c", "M:4/4\nQ:1/4=96\nK:F\n(FGAB c2) c2-|c4 (3fed c2|(AB c)(d e2) f2|]"],
          ["力度與奏法", "!p! .C !accent!", "M:4/4\nL:1/4\nQ:1/4=96\nK:C\n!p!.C .E !<(!G !<)!c|!f!!accent!e !tenuto!d !sfz!c2|]"],
          ["和弦（音堆）", "[CEG]", "M:4/4\nL:1/4\nQ:1/4=80\nK:Bb\n[B,DF] [CEG] [DFA] [EGB]|[FAc]2 [B,DFB]2|]"],
          ["多聲部大譜表", "V:1 V:2 %%staves", "M:4/4\nL:1/4\nQ:1/4=96\n%%staves {1 2}\nK:C\nV:1\ne d c d|e e e2|]\nV:2 clef=bass\nC, G,, C, G,,|C, G,, C,2|]"],
          ["反覆與分歧結尾", "|: :| |1 |2", "M:3/4\nL:1/4\nQ:1/4=120\nK:G\n|:G A B|c2 B|1 A G F:|2 A2 G|]"],
        ];
        ctx.html(`<div class="ab-board ab-cards">${CARDS.map(([t, c]) => `<div class="ab-sheet"><div class="ab-cap"><b>${t}</b><code></code></div><div class="ab-paper"></div></div>`).join("")}</div>`);
        const cards = ctx.$$(".ab-cards .ab-sheet");
        cards.forEach((c, i) => (c.querySelector("code").textContent = CARDS[i][1]));
        const tunes = [];
        let active = -1;
        const pl = player(ctx, { onState: (on) => { if (!on) { cards.forEach((c) => c.classList.remove("on")); active = -1; } } });
        function render() {
          cards.forEach((c, i) => {
            const p = c.querySelector(".ab-paper");
            tunes[i] = engrave(p, head + CARDS[i][2], { staffwidth: Math.max(160, Math.min(420, p.clientWidth * 1.15)), scale: 1 });
          });
        }
        cards.forEach((c, i) => ctx.on(c, "click", () => {
          if (active === i) return pl.stop();
          pl.stop();
          active = i; c.classList.add("on");
          pl.play(tunes[i], c.querySelector(".ab-paper")).then((r) => { if (!r && active === i) c.classList.remove("on"); }).catch(fail(ctx, "播放"));
        }));
        render();
        watch(ctx, cards[0], render);
      },
    },
    {
      id: "editor", title: "互動編輯器",
      api: "new ABCJS.Editor(textarea, { paper_id, redrawCallback, selectionChangeCallback, abcjsParams: { dragging } })・fireChanged()・isDirty()",
      desc: "Editor 把 textarea 和樂譜綁在一起：打字自動重排、游標所在的音符在譜上反白、點譜上的音符會選取對應文字；開啟拖曳後可直接上下拖音符改音高，文字同步改寫。",
      hint: "在文字中移動游標或點音符看雙向選取；開「拖曳改音高」後拖動音符；「插入錯誤」看解析器警告。",
      mount(ctx) {
        ctx.html(`<div class="ab-board ab-edit">
          <div class="ab-col"><div class="ab-lbl"><span>ABC 原始文字</span><span class="ab-m ab-sel">選取 0 到 0</span></div><textarea class="ab-ta" spellcheck="false" aria-label="ABC 記譜文字"></textarea><div class="ab-warn"></div></div>
          <div class="ab-sheet"><div class="ab-cap"><b>Editor 輸出</b><span class="ab-r ab-dirty"></span></div><div class="ab-paper"></div></div>
        </div>`);
        const ta = ctx.$(".ab-ta"), paper = ctx.$(".ab-paper"), warn = ctx.$(".ab-warn"), selEl = ctx.$(".ab-sel"), dirty = ctx.$(".ab-dirty");
        const ORIGINAL = TUNES["小星星"];
        ta.value = ORIGINAL;
        let editor = null, redraws = 0;
        function after(ed) {
          fitSvg(paper);
          redraws++;
          const ws = (ed.tunes[0] && ed.tunes[0].warnings) || [];
          warn.className = ws.length ? "ab-warn bad" : "ab-warn";
          warn.textContent = ws.length ? `解析器警告 ${ws.length} 則：${strip(ws[0])}` : `解析成功，第 ${redraws} 次重排`;
          if (editor) dirty.textContent = editor.isDirty() ? "isDirty() = true" : "isDirty() = false";
        }
        editor = new ABCJS.Editor(ta, {
          paper_id: paper,
          indicate_changed: true,
          redrawCallback(starting) { if (!starting) after(this); },
          selectionChangeCallback(start, end) { selEl.textContent = `選取 ${start} 到 ${end}`; },
          abcjsParams: { add_classes: true, staffwidth: Math.max(260, paper.clientWidth - 20), wrap: { minSpacing: 1.6, maxSpacing: 2.6, preferredMeasuresPerLine: 4 }, selectionColor: "#0b84c9", dragColor: "#f72585", dragging: false },
        });
        after(editor);
        const ERRORS = [" !foo! ", " [CEG ", " #"];
        let k = 0;
        ctx.button("插入錯誤", () => {
          const at = ta.value.indexOf("|", 40);
          ta.value = ta.value.slice(0, at) + ERRORS[k++ % ERRORS.length] + ta.value.slice(at);
          editor.fireChanged();
        });
        ctx.button("還原", () => { ta.value = ORIGINAL; editor.fireChanged(); editor.setNotDirty(); after(editor); });
        ctx.toggle("拖曳改音高", false, (v) => editor.paramChanged({ dragging: v }));
        watch(ctx, paper, () => editor.paramChanged({ staffwidth: Math.max(260, paper.clientWidth - 20) }));
      },
    },
    {
      id: "synth", title: "合成器音色",
      api: "new ABCJS.synth.CreateSynth().init({ visualObj, millisecondsPerMeasure, options: { program, chordsOff, qpm } })・prime()・getAudioBuffer()",
      desc: "CreateSynth 依曲譜下載需要的 MIDI.js 音色取樣，prime() 在離線把整首曲子渲染成 AudioBuffer。下方是那段 AudioBuffer 的真實波形與播放頭，再下面是 AnalyserNode 的即時頻譜。",
      hint: "換樂器、關掉和弦伴奏或改速度後按「▶ 播放」，比較渲染耗時與音訊長度。",
      mount(ctx) {
        ctx.html(`<div class="ab-board ab-synth">
          <div class="ab-sheet"><div class="ab-paper"></div></div>
          <div class="ab-scope"><div class="ab-lbl"><span class="ab-info">尚未渲染：按「▶ 播放」</span><span class="ab-m ab-db"></span></div><div class="ab-cvh ab-wave"></div><div class="ab-cvh ab-spec"></div></div>
        </div>`);
        const paper = ctx.$(".ab-paper"), info = ctx.$(".ab-info"), db = ctx.$(".ab-db");
        const wave = canvasIn(ctx, ctx.$(".ab-wave")), spec = canvasIn(ctx, ctx.$(".ab-spec"));
        const INST = [[0, "鋼琴"], [24, "尼龍吉他"], [40, "小提琴"], [73, "長笛"], [12, "馬林巴"], [19, "管風琴"], [56, "小號"], [105, "斑鳩琴"]];
        let program = 0, chords = true, bpm = 88, tune = null, env = null, envFor = null;
        const pl = player(ctx, { onState: (on) => (btn.textContent = on ? "■ 停止" : "▶ 播放") });
        // wide: keep the two source lines (pickup + 8 bars, then 8 bars); narrow: let wrap split them
        const render = () => { const w = paper.clientWidth; tune = engrave(paper, GRACE, { staffwidth: Math.max(260, w - 20), wrap: w < 640 ? { minSpacing: 1.6, maxSpacing: 2.6, preferredMeasuresPerLine: 3 } : undefined }); };
        ctx.select("樂器", INST.map(([v, l]) => ({ value: v, label: l })), 0, (v) => { program = +v; pl.stop(); });
        ctx.toggle("和弦伴奏", true, (v) => { chords = v; pl.stop(); });
        ctx.slider("速度", { min: 50, max: 160, step: 2, value: bpm, format: (v) => `♩=${v}` }, (v) => { bpm = v; pl.stop(); });
        const btn = ctx.button("▶ 播放", async () => {
          if (pl.playing) return pl.stop();
          btn.textContent = "渲染中…";
          const r = await pl.play(tune, paper, { qpm: bpm, options: { program, chordsOff: !chords } }).catch(fail(ctx, "合成"));
          if (!r) return;
          const d = r.buf.getChannelData(0), cols = 600, step = Math.max(1, Math.floor(d.length / cols));
          env = new Float32Array(cols);
          for (let i = 0; i < cols; i++) { let m = 0; for (let j = i * step, e = Math.min(d.length, j + step); j < e; j += 4) m = Math.max(m, Math.abs(d[j])); env[i] = m; }
          envFor = `program ${program}（${ABCJS.synth.instrumentIndexToName[program]}）`;
          info.textContent = `${envFor}・prime() ${Math.round(r.ms)} ms・${r.buf.duration.toFixed(1)} 秒・${r.buf.sampleRate} Hz`;
        }, { primary: true });
        render();
        watch(ctx, paper, render);
        ctx.raf(() => {
          const { g, w, h: hh } = wave;
          g.clearRect(0, 0, w, hh);
          g.strokeStyle = "rgba(255,255,255,.12)"; g.beginPath(); g.moveTo(0, hh / 2); g.lineTo(w, hh / 2); g.stroke();
          if (env) {
            const p = pl.progress(), max = env.reduce((a, b) => Math.max(a, b), 1e-6);
            for (let x = 0; x < w; x++) {
              const v = env[Math.floor((x / w) * env.length)] / max, y = v * (hh / 2 - 2);
              g.fillStyle = x / w < p ? "#f72585" : "#4cc9f0";
              g.fillRect(x, hh / 2 - y, 1, Math.max(1, y * 2));
            }
          } else {
            g.fillStyle = "#7d8490"; g.font = `11px ${FONT}`; g.textBaseline = "middle";
            g.fillText("prime() 渲染出的 AudioBuffer 波形會畫在這裡", 8, hh / 2);
          }
          drawSpectrum(spec, { light: false });
          const L = levelDb();
          db.textContent = pl.playing && isFinite(L) ? `${L.toFixed(1)} dBFS` : "";
        });
      },
    },
    {
      id: "transpose", title: "移調對照",
      api: "renderAbc(el, abc, { visualTranspose })・ABCJS.strTranspose(abc, tunes, steps)・synth options.midiTranspose",
      desc: "同一份 ABC 用兩種方式移調：visualTranspose 只改畫出來的譜（文字不變），strTranspose 直接改寫 ABC 文字，右側列出改寫結果，調號、音符與和弦標記都跟著變。",
      hint: "拖「半音」滑桿；「▶ 播放」用 midiTranspose 讓聲音也跟著移調。",
      mount(ctx) {
        const SRC = TUNES["小步舞曲"].split("\n").slice(0, 9).join("\n").replace(/^[TC]:.*\n/gm, "").replace(/A6\|$/, "A6|]");
        ctx.html(`<div class="ab-board ab-tr">
          <div class="ab-col">
            <div class="ab-sheet"><div class="ab-cap"><b>原譜：小步舞曲前 8 小節</b><span class="ab-r">K:G</span></div><div class="ab-paper ab-a"></div></div>
            <div class="ab-sheet"><div class="ab-cap"><b>visualTranspose</b><span class="ab-r ab-k"></span></div><div class="ab-paper ab-b"></div></div>
          </div>
          <div class="ab-col"><div class="ab-lbl"><span>strTranspose 改寫後的文字</span></div><pre class="ab-pre"></pre></div>
        </div>`);
        const A = ctx.$(".ab-a"), B = ctx.$(".ab-b"), pre = ctx.$(".ab-pre"), kEl = ctx.$(".ab-k");
        let n = 2, shown = null;
        const pl = player(ctx, { onState: (on) => (btn.textContent = on ? "■ 停止" : "▶ 播放") });
        function render() {
          pl.stop();
          const sw = Math.max(240, A.clientWidth - 16);
          const wrap = { minSpacing: 1.6, maxSpacing: 2.6, preferredMeasuresPerLine: A.clientWidth < 420 ? 4 : 8 };
          engrave(A, SRC, { staffwidth: sw, wrap });
          shown = engrave(B, SRC, { staffwidth: sw, wrap, visualTranspose: n });
          const out = ABCJS.strTranspose(SRC, ABCJS.parseOnly(SRC), n);
          const key = (out.match(/^K:\s*(\S+)/m) || [])[1] || "?";
          kEl.textContent = `${sgn(n)} 半音・K:${key}`;
          const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
          pre.innerHTML = esc(out).split("\n").map((l) => (/^K:|^[^A-Za-z]*"/.test(l) || /^"/.test(l) ? `<mark>${l}</mark>` : l)).join("\n");
        }
        ctx.slider("半音", { min: -6, max: 6, step: 1, value: n, format: sgn }, (v) => { n = v; render(); });
        const btn = ctx.button("▶ 播放", () => {
          if (pl.playing) return pl.stop();
          btn.textContent = "載入音色中…";
          pl.play(shown, B, { options: { midiTranspose: n } }).catch(fail(ctx, "播放"));
        }, { primary: true });
        render();
        watch(ctx, A, render);
      },
    },
    {
      id: "tab", title: "指法譜",
      api: "renderAbc(el, abc, { tablature: [{ instrument, tuning, capo, label }] })",
      desc: "同一段旋律，tablature 外掛自動算出每個音在哪一弦哪一格，畫在五線譜下方。可切換吉他、移調夾、DADGAD 調弦、小提琴與曼陀林，弦數與格數都會跟著變。",
      hint: "切換上方的樂器與調弦；Capo 2 時格數整體少 2 格。",
      mount(ctx) {
        ctx.html(`<div class="ab-board ab-solo"><div class="ab-sheet"><div class="ab-cap"><b class="ab-t"></b><span class="ab-r ab-tun"></span></div><div class="ab-paper"></div></div></div>`);
        const paper = ctx.$(".ab-paper"), tEl = ctx.$(".ab-t"), tun = ctx.$(".ab-tun");
        const OPTS = [
          ["吉他", { instrument: "guitar", label: "吉他（%T）" }, "標準調弦 E A D G B E"],
          ["Capo 2", { instrument: "guitar", capo: 2, label: "吉他 Capo 2" }, "移調夾夾第 2 格"],
          ["DADGAD", { instrument: "guitar", tuning: ["D,", "A,", "D", "G", "A", "d"], label: "吉他 DADGAD" }, "開放調弦 D A D G A D"],
          ["小提琴", { instrument: "violin", label: "小提琴（%T）" }, "四弦 G D A E"],
          ["曼陀林", { instrument: "mandolin", label: "曼陀林" }, "四組弦 G D A E"],
        ];
        let k = 0;
        function render() {
          const [name, tab, note] = OPTS[k];
          tEl.textContent = `tablature：${name}`;
          tun.textContent = note;
          // abcjs 6.7.1 drops the tab staff when `wrap` is combined with `tablature`, so line breaks come from the ABC text
          const abc = paper.clientWidth < 520 ? ETUDE.replace(/^(".*?\|.*?\|)(.*)$/gm, "$1\n$2") : ETUDE;
          engrave(paper, abc, { tablature: [tab], staffwidth: Math.max(260, paper.clientWidth - 20) });
        }
        ctx.group(OPTS.map((o) => o[0]), 0, (i) => { k = i; render(); });
        render();
        watch(ctx, paper, render);
      },
    },
    {
      id: "layout", title: "排版與換行",
      api: "renderAbc(el, abc, { staffwidth, scale, wrap: { preferredMeasuresPerLine, minSpacing, maxSpacing }, showDebug: [\"box\"] })",
      desc: "wrap 會依版面寬度自動決定每行放幾小節並平均分配間距；關掉 wrap 則照原文換行。scale 放大縮小整份譜，showDebug 畫出每個元素的排版框線。",
      hint: "拖「每行小節」與「縮放」；切到「照原文換行」比較；開「排版框線」看內部量測。",
      mount(ctx) {
        ctx.html(`<div class="ab-board ab-solo"><div class="ab-sheet ab-scroll"><div class="ab-cap"><b>小步舞曲 G 大調（16 小節）</b><span class="ab-r ab-st"></span></div><div class="ab-paper"></div></div></div>`);
        const paper = ctx.$(".ab-paper"), st = ctx.$(".ab-st");
        let per = 4, scale = 1, wrapOn = true, dbg = false;
        function render() {
          const sw = Math.max(200, (paper.clientWidth - 20) / scale);
          const t0 = performance.now();
          const tune = engrave(paper, TUNES["小步舞曲"], {
            staffwidth: sw, scale,
            wrap: wrapOn ? { minSpacing: 1.5, maxSpacing: 2.8, preferredMeasuresPerLine: per } : undefined,
            showDebug: dbg ? ["box"] : undefined,
          });
          st.textContent = `${tune.lines.length} 行・staffwidth ${Math.round(sw)}・${(performance.now() - t0).toFixed(1)} ms`;
        }
        ctx.group(["wrap 自動換行", "照原文換行"], 0, (i) => { wrapOn = i === 0; render(); });
        ctx.slider("每行小節", { min: 2, max: 8, step: 1, value: per }, (v) => { per = v; render(); });
        ctx.slider("縮放", { min: 0.6, max: 1.6, step: 0.1, value: scale, format: (v) => `${v.toFixed(1)}×` }, (v) => { scale = v; render(); });
        ctx.toggle("排版框線", false, (v) => { dbg = v; render(); });
        render();
        watch(ctx, paper, render);
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "ABCJS.renderAbc(el, N 小節的 ABC, { wrap, tablature })",
      desc: "程式產生 N 小節、帶和弦標記的隨機旋律，計時 renderAbc 從解析、排版、自動換行到寫出 SVG 的完整耗時。右側顯示最後一次的排版結果。",
      hint: "按「開始測試」逐級加大小節數；右下可切換是否加上吉他指法譜（每個音多算一次把位，SVG 元素約加倍）。",
      mount(ctx) {
        ctx.html(`<div class="ab-stress ab-sheet ab-scroll"><div class="ab-cap"><b class="ab-t">尚未測試</b></div><div class="ab-paper"></div></div>`);
        ctx.controls.classList.add("bottom");
        const paper = ctx.$(".ab-paper"), tEl = ctx.$(".ab-t");
        let withTab = false;
        ctx.group(["只有五線譜", "加吉他指法譜"], 0, (i) => (withTab = i === 1));
        function gen(n) {
          let s = 20240611;
          const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
          const P = "DEFGABcdefgab", CH = ["C", "F", "G", "Am", "Dm", "Em", "G7"];
          const out = [`X:1\nT:隨機旋律 ${n} 小節\nM:4/4\nL:1/8\nQ:1/4=120\nK:C`];
          let p = 6, line = "";
          for (let m = 0; m < n; m++) {
            let bar = `"${CH[Math.floor(rnd() * CH.length)]}"`, pos = 0;
            while (pos < 8) {
              const d = pos < 7 && rnd() < 0.3 ? 2 : 1;
              p = Math.max(0, Math.min(P.length - 1, p + Math.floor(rnd() * 5) - 2));
              bar += P[p] + (d === 2 ? "2" : "");
              pos += d;
              if (pos === 4 || (pos === 5 && d === 2)) bar += " ";
            }
            line += `${bar}${m === n - 1 ? "|]" : "|"}`;
            if (m % 4 === 3 || m === n - 1) { out.push(line); line = ""; }
          }
          return out.join("\n");
        }
        ctx.bench({
          label: "小節數", unit: "小節", sizes: [16, 64, 128, 256, 512, 1024, 2048],
          prepare: (n) => gen(n),
          run(n, abc) {
            const tune = engrave(paper, abc, {
              staffwidth: Math.max(300, paper.clientWidth - 20),
              // wrap and tablature cannot be combined in abcjs 6.7.1; gen() already breaks every 4 bars
              wrap: withTab ? undefined : { minSpacing: 1.6, maxSpacing: 2.6, preferredMeasuresPerLine: 4 },
              tablature: withTab ? [{ instrument: "guitar" }] : undefined,
            });
            const nodes = paper.querySelectorAll("svg *").length;
            tEl.textContent = `${n} 小節・${tune.lines.length} 行・${Showcase.fmtCompact(nodes)} 個 SVG 元素${withTab ? "・含指法譜" : ""}`;
            return `${tune.lines.length} 行`;
          },
          note: "耗時包含 ABC 解析、音符間距計算、自動換行與建立 SVG 節點，大致隨小節數線性成長；指法譜會讓每個音多一次把位計算與一組 SVG 文字（abcjs 6.7.1 的 wrap 與指法譜不能併用，加指法譜時改照原文每 4 小節換行）。超過 2 秒的級距之後略過。",
        });
      },
    },
  ],
});
</script>
