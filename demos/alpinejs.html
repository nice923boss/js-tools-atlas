  .al-stress { position: absolute; height: auto; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; display: flex; flex-direction: column; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); overflow: hidden; }

<script>
// Alpine.js showcase. Alpine has already started (plugins registered on alpine:init), so each scene
// inserts its markup, calls Alpine.initTree() synchronously and Alpine.destroyTree() on cleanup.
function alpine(ctx, markup, cls = "") {
  ctx.html(`<div class="al-root ${cls}">${markup}</div>`);
  const root = ctx.$(".al-root");
  Alpine.initTree(root);
  ctx.onCleanup(() => Alpine.destroyTree(root));
  return root;
}
const stamp = () => { const d = new Date(); return `${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}.${String(d.getMilliseconds()).padStart(3, "0").slice(0, 2)}`; };
let logSeq = 0;
const logEntry = (text) => ({ id: ++logSeq, t: stamp(), text });
const LOG_LI = `<template x-for="it in log" :key="it.id"><li><i x-text="it.t"></i><span x-html="it.text"></span></li></template>`;
const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

// ---------- scene 1: FAQ (ported from the original demo, now with x-collapse) ----------
const FAQ = [
  { cat: "訂位", q: "如何訂位？多久前可以預約？", a: "每月 1 日中午 12 點開放次月訂位，線上支付 30% 訂金即完成預約，訂位成功會寄確認信。", votes: 128 },
  { cat: "訂位", q: "訂好的日期可以更改嗎？", a: "入住 7 天前可免費改期一次；7 天內改期需收 NT$200 手續費，且視營位空檔而定。", votes: 64 },
  { cat: "設施", q: "營位有提供電源嗎？", a: "A 區、B 區雨棚營位附 110V 電源，單一營位上限 1000W；草地區不提供電源，請自備行動電源。", votes: 97 },
  { cat: "設施", q: "衛浴有熱水嗎？", a: "24 小時供應熱水。晚上 9 點到 11 點是洗澡尖峰，建議錯開時段，水溫比較穩定。", votes: 81 },
  { cat: "設施", q: "沒有裝備也能露營嗎？", a: "可以選「懶人露營」方案：帳篷、睡墊、桌椅、照明一次備齊，每帳每晚 NT$1,500，抵達即可入住。", votes: 152 },
  { cat: "寵物", q: "可以帶狗狗一起來嗎？", a: "可以，請預訂 C 區寵物友善營位。寵物需全程牽繩，並自備排泄物袋與飲水碗。", votes: 73 },
  { cat: "寵物", q: "帶寵物有額外收費嗎？", a: "每隻每晚收清潔費 NT$150，每個營位最多 2 隻，入住時於服務台繳交。", votes: 38 },
  { cat: "天候退費", q: "遇到颱風或豪雨怎麼辦？", a: "氣象署發布陸上颱風警報或豪雨特報時，可選擇全額退費，或將訂金保留一年內使用。", votes: 116 },
  { cat: "天候退費", q: "下雨天還能露營嗎？", a: "小雨照常營業，建議改訂雨棚區；營區另有室內交誼廳可避雨、用餐。", votes: 45 },
  { cat: "天候退費", q: "一般退訂規則是什麼？", a: "入住 14 天前退訂退款 90%；7 到 13 天前退款 50%；7 天內恕不退費，可改期一次。", votes: 59 },
].map((f, id) => ({ ...f, id }));

Alpine.data("alpFaq", () => ({
  items: FAQ, q: "", cat: "全部", open: [0], liked: {},
  get cats() { return ["全部", ...new Set(FAQ.map((f) => f.cat))]; },
  matches(f) { const q = this.q.trim(); return !q || f.q.includes(q) || f.a.includes(q); },
  countIn(c) { return FAQ.filter((f) => (c === "全部" || f.cat === c) && this.matches(f)).length; },
  get shown() { return FAQ.filter((f) => (this.cat === "全部" || f.cat === this.cat) && this.matches(f)); },
  get allOpen() { return this.shown.length > 0 && this.shown.every((f) => this.open.includes(f.id)); },
  init() {
    // Auto-expand the answers when a search narrows the list down to a few questions.

  name, total: seconds, left: seconds, running: true, handle: 0,

    timerBus.live++;

}));

      const PRESETS = [["🍜 泡麵", 180], ["🍅 番茄鐘", 1500], ["👕 洗衣機", 2700], ["🥚 水煮蛋", 420], ["🫖 泡茶", 240], ["🍞 烤吐司", 150]];
      const root = alpine(ctx, `
<div class="al-tm" x-data="{ seq: 3, bus: timerBus, timers: [{ id: 1, name: '🍜 泡麵', s: 180 }, { id: 2, name: '🍅 番茄鐘', s: 1500 }, { id: 3, name: '🫖 泡茶', s: 240 }],
    add() { const p = ${escapeHtml(JSON.stringify(PRESETS))}[this.seq % 6]; this.timers.push({ id: ++this.seq, name: p[0], s: p[1] }); },
    remove(id) { this.timers = this.timers.filter((t) => t.id !== id); } }">
  <div class="al-pane"><h3>計時器 <small>x-data="alpTimer(name, 秒數)"・6 倍速</small></h3>
    <div class="al-live"><span>畫面卡片 <b x-text="timers.length"></b></span><span>存活計時器 <b x-text="bus.live"></b></span></div>
    <div class="al-timers"><template x-for="t in timers" :key="t.id">
      <div class="al-timer" x-data="alpTimer(t.name, t.s)" :class="{ done: !left }">
        <b x-text="name"></b><button class="x" @click="remove(t.id)" aria-label="移除">✕</button>
        <div class="t" x-text="mmss"></div><div class="bar"><i :style="{ width: pct + '%' }"></i></div>
        <div class="acts"><button x-bind="alpToggle"></button><button class="al-b" @click="left = total">重設</button></div>
      </div>
    </template></div>
  </div>
  <div class="al-pane"><h3>生命週期 <small>init() / destroy()</small></h3><ul class="al-log"><template x-for="it in bus.log" :key="it.id"><li><i x-text="it.t"></i><span x-html="it.text"></span></li></template></ul></div>
</div>`);
      const d = Alpine.$data(root.querySelector("[x-data]"));
      ctx.button("新增計時器", () => d.add(), { primary: true });
      ctx.button("移除第一個", () => d.timers.length && d.remove(d.timers[0].id));
      ctx.timeout(() => d.add(), 600);
    },
  },
  {
    id: "plugins", title: "官方外掛",
    api: "$persist().as() / x-intersect / x-trap（focus）/ x-teleport",
    desc: "裝備清單用 $persist 存進 localStorage（鍵名加 atlas-alpine 前綴），按「重新掛載」會 destroyTree 再 initTree，狀態仍在。中間步道卡片用 x-intersect 在捲入可視區時淡入；右邊對話框用 x-trap 把 Tab 焦點鎖在框內，Esc 關閉。",
    hint: "勾選裝備後重新掛載・捲動步道清單・開對話框按 Tab 試試",
    mount(ctx) {
      const GEAR = ["帳篷", "睡袋", "頭燈", "防蚊液", "卡式爐", "折疊椅"];
      const TRAILS = ["合歡北峰", "七星山主峰", "抹茶山", "加里山", "大霸尖山", "嘉明湖", "雪山東峰", "奇萊南峰", "玉山前峰", "郡大山", "向陽山", "北大武山"];
      const markup = `
<div class="al-plug">
  <div class="al-pane al-gear" x-data="{ packed: $persist(['帳篷']).as('atlas-alpine-gear'), mounts: $persist(0).as('atlas-alpine-mounts') }" x-init="mounts++">
    <h3>$persist <small x-text="'已掛載 ' + mounts + ' 次'"></small></h3>
    ${GEAR.map((g) => `<label><input type="checkbox" value="${g}" x-model="packed">${g}</label>`).join("")}
    <div class="al-store" x-text="'localStorage[atlas-alpine-gear] = ' + JSON.stringify(packed)"></div>
  </div>
  <div class="al-pane" x-data="{ seen: 0 }"><h3>x-intersect <small x-text="'進入過 ' + seen + ' / ${TRAILS.length}'"></small></h3>
    <div class="al-trail">${TRAILS.map((t, i) => `<div x-data="{ vis: false, was: false }" :class="{ in: vis }" x-intersect.half="vis = true; if (!was) { was = true; seen++ }" x-intersect:leave="vis = false">⛰️ ${t}<br><small>步道 #${i + 1}</small></div>`).join("")}</div>
  </div>
  <div class="al-pane" x-data="{ open: false, who: '', count: '2' }"><h3>x-trap <small>焦點鎖定</small></h3>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">開啟後 Tab 只會在對話框內循環，Esc 或取消可關閉。</p>
    <button class="al-b pri" @click="open = true">報名登山隊</button>
    <p style="font-size:12.5px" x-show="who" x-text="'已報名：' + who + '（' + count + ' 人）'"></p>
    <template x-teleport=".al-plug"><div class="al-modal" x-show="open" x-transition.opacity @keydown.escape="open = false">
      <div class="box" x-trap="open"><h4>報名登山隊</h4>
        <input x-model="who" placeholder="姓名"><input x-model="count" type="number" min="1" placeholder="人數">
        <div style="display:flex;gap:6px;justify-content:flex-end;margin-top:8px"><button class="al-b" @click="open = false">取消</button><button class="al-b pri" @click="open = false">送出</button></div>
      </div></div></template>
  </div>
</div>`;
      let root = alpine(ctx, markup, "al-scroll");
      const remount = (wipe) => {
        Alpine.destroyTree(root);
        if (wipe) ["atlas-alpine-gear", "atlas-alpine-mounts"].forEach((k) => localStorage.removeItem(k));
        root.innerHTML = markup;
        Alpine.initTree(root);
      };
      ctx.button("重新掛載", () => remount(false), { primary: true });
      ctx.button("清除儲存", () => remount(true));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "x-for :key + Alpine.nextTick()",
    desc: "仿 js-framework-benchmark：一次計時 x-for 建立 N 列、每第 10 列更新、交換兩列、整批取代，四個動作都等 Alpine.nextTick 完成 DOM 修補並強制排版。列數逐級加大，直到單次超過 2 秒。",
    hint: "按「開始測試」・每列結果滑過可看各步驟耗時",
    mount(ctx) {
      const root = alpine(ctx, `
<div class="al-stress" x-data="{ rows: [], note: '尚未測試' }"><div class="hd" x-html="note"></div>
  <div class="tbl"><table><tbody><template x-for="r in rows" :key="r.id"><tr><td class="id" x-text="r.id"></td><td x-text="r.label"></td><td class="n" x-text="r.n"></td></tr></template></tbody></table></div>
</div>`);
      const table = root.querySelector("[x-data]");
      const d = Alpine.$data(table);
      const settle = async () => { await Alpine.nextTick(); void table.offsetHeight; };
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "x-for 列數", unit: "列", sizes: [100, 500, 1000, 2000, 5000, 10000, 20000, 50000], target: 1000, budget: 2000,
        async prepare(n) { d.rows = []; await settle(); return [buildRows(n), buildRows(n)]; },
        async run(n, [first, second]) {
          const t = [performance.now()];
          d.rows = first; await settle(); t.push(performance.now());
          for (let i = 0; i < d.rows.length; i += 10) d.rows[i].n++;
          await settle(); t.push(performance.now());
          const r = d.rows; const a = r[1]; r[1] = r[n - 2]; r[n - 2] = a;
          await settle(); t.push(performance.now());
          d.rows = second; await settle(); t.push(performance.now());
          const [c, u, s, rp] = t.slice(1).map((x, i) => Showcase.fmtMs(x - t[i]));
          d.note = `${Showcase.fmt(n)} 列・建立 <b>${c}</b>・更新 <b>${u}</b>・交換 <b>${s}</b>・取代 <b>${rp}</b>`;
          return `建 ${c}`;
        },
        note: "x-for 以 key 比對新舊陣列，新增節點時要為每列複製 template、建立響應式作用域並解析 x-text；更新與交換只動到變了的節點。瓶頸是逐列初始化與 DOM 插入，數量大時 Alpine 沒有虛擬 DOM 批次比對可依靠。",
      });
    },
  },
] });
</script>
</body>
</html>
