<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpine.js 示範：可搜尋的常見問題手風琴</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  [x-cloak] { display: none !important; }
  body { background: radial-gradient(60% 50% at 100% 0%, rgba(119,193,210,.16), transparent 60%), radial-gradient(60% 60% at 0% 100%, rgba(123,211,137,.10), transparent 60%), var(--bg); --alp: #77c1d2; }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 46px; max-width: 800px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head h1 { margin: 0; font-size: 18px; white-space: nowrap; }
  .head h1 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
  .search:focus-within { border-color: var(--alp); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 14px; }
  .search button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  .row { display: flex; align-items: center; gap: 6px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .chip { flex: none; padding: 4px 11px; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--fg); font: 12px var(--font); cursor: pointer; }
  .chip.on { background: var(--alp); color: #0c2a31; border-color: transparent; font-weight: 700; }
  .chip i { font-style: normal; opacity: .65; margin-left: 3px; }
  .tools { flex: none; display: flex; gap: 6px; font-size: 12px; color: var(--muted); align-items: center; }
  .tools .btn { padding: 5px 9px; font-size: 12px; }
  .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; padding-right: 2px; }
  .qa { border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); flex: none; transition: border-color .2s; }
  .qa.open { border-color: rgba(119,193,210,.55); }
  .qa > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 14px; border: 0; background: none; color: var(--fg); font: 600 14px var(--font); text-align: left; cursor: pointer; }
  .tag { flex: none; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: rgba(255,255,255,.07); color: var(--muted); }
  .qa .q { flex: 1; min-width: 0; }
  .qa .arrow { flex: none; transition: transform .25s; color: var(--alp); }
  .qa.open .arrow { transform: rotate(180deg); }
  .ans { padding: 0 14px 12px 14px; color: #c9d3d6; font-size: 13px; line-height: 1.75; }
  .ans .vote { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .ans .vote button { border: 1px solid var(--line); background: none; color: var(--fg); border-radius: 99px; padding: 2px 10px; cursor: pointer; font: 12px var(--font); }
  .ans .vote button.on { border-color: var(--c4); color: var(--c4); }
  mark { background: rgba(247,223,30,.85); color: #1a1a14; border-radius: 3px; padding: 0 2px; }
  .none { color: var(--muted); text-align: center; padding: 30px 0; }
  @media (max-width: 640px) {
    .app { padding: 8px 8px 46px; gap: 8px; }
    .head { flex-direction: column; align-items: stretch; gap: 6px; }
    .head h1 small { display: inline; margin-left: 6px; }
    .tools .count { display: none; }
    .qa > button { padding: 10px 11px; font-size: 13px; }
    .qa .tag { display: none; }
  }
</style>
</head>
<body>
<div class="app" x-data="faq" x-cloak>
  <div class="head">
    <h1>⛺ 山嵐露營區<small>常見問題</small></h1>
    <label class="search">🔍<input x-model.debounce.150ms="q" placeholder="搜尋關鍵字，例如 寵物、退費、熱水" autocomplete="off"><button x-show="q" @click="q = ''" aria-label="清除">✕</button></label>
  </div>
  <div class="row">
    <div class="chips">
      <template x-for="c in cats" :key="c">
        <button class="chip" :class="{ on: cat === c }" @click="cat = c"><span x-text="c"></span><i x-text="countIn(c)"></i></button>
      </template>
    </div>
    <div class="tools">
      <span class="count" x-text="`${shown.length} / ${items.length} 題`"></span>
      <button class="btn" @click="openAll()" x-text="allOpen ? '全部收合' : '全部展開'"></button>
    </div>
  </div>
  <div class="list">
    <template x-for="f in shown" :key="f.id">
      <div class="qa" :class="{ open: isOpen(f.id) }">
        <button @click="toggle(f.id)" :aria-expanded="isOpen(f.id)">
          <span class="tag" x-text="f.cat"></span>
          <span class="q" x-html="mark(f.q)"></span>
          <span class="arrow">▾</span>
        </button>
        <div class="ans" x-show="isOpen(f.id)" x-transition.opacity.duration.250ms>
          <div x-html="mark(f.a)"></div>
          <div class="vote">這個回答有幫助嗎？
            <button :class="{ on: liked[f.id] }" @click="liked[f.id] = !liked[f.id]" x-text="`👍 ${f.votes + (liked[f.id] ? 1 : 0)}`"></button>
          </div>
        </div>
      </div>
    </template>
    <div class="none" x-show="!shown.length">找不到「<span x-text="q"></span>」相關問題，試試「電源」或「颱風」</div>
  </div>
</div>
<div class="hint">輸入關鍵字即時篩選・點分類或問題展開</div>

<script>
// Alpine.js FAQ: one x-data component; getters re-run whenever q, cat or open change.
const FAQ = [
  { cat: "訂位", q: "如何訂位？多久前可以預約？", a: "每月 1 日中午 12 點開放次月訂位，線上支付 30% 訂金即完成預約，訂位成功會寄確認信。", votes: 128 },
  { cat: "訂位", q: "訂好的日期可以更改嗎？", a: "入住 7 天前可免費改期一次；7 天內改期需收 NT$200 手續費，且視營位空檔而定。", votes: 64 },
  { cat: "設施", q: "營位有提供電源嗎？", a: "A 區、B 區雨棚營位附 110V 電源，單一營位上限 1000W；草地區不提供電源，請自備行動電源。", votes: 97 },
  { cat: "設施", q: "衛浴有熱水嗎？", a: "24 小時供應熱水。晚上 9 點到 11 點是洗澡尖峰，建議錯開時段，水溫比較穩定。", votes: 81 },
  { cat: "設施", q: "沒有裝備也能露營嗎？", a: "可以選「懶人露營」方案：帳篷、睡墊、桌椅、照明一次備齊，每帳每晚 NT$1,500，抵達即可入住。", votes: 152 },
  { cat: "寵物", q: "可以帶狗狗一起來嗎？", a: "可以，請預訂 C 區寵物友善營位。寵物需全程牽繩，並自備排泄物袋與飲水碗。", votes: 73 },
  { cat: "寵物", q: "帶寵物有額外收費嗎？", a: "每隻每晚收清潔費 NT$150，每個營位最多 2 隻，入住時於服務台繳交。", votes: 38 },
  { cat: "天候退費", q: "遇到颱風或豪雨怎麼辦？", a: "氣象署發布陸上颱風警報或豪雨特報時，可選擇全額退費，或將訂金保留一年內使用。", votes: 116 },
  { cat: "天候退費", q: "下雨天還能露營嗎？", a: "小雨照常營業，建議改訂雨棚區；營區另有室內交誼廳可避雨、用餐。", votes: 45 },
  { cat: "天候退費", q: "一般退訂規則是什麼？", a: "入住 14 天前退訂退款 90%；7 到 13 天前退款 50%；7 天內恕不退費，可改期一次。", votes: 59 },
].map((f, id) => ({ ...f, id }));

const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

document.addEventListener("alpine:init", () => {
  Alpine.data("faq", () => ({
    items: FAQ,
    q: "",
    cat: "全部",
    open: [0],
    liked: {},
    get cats() { return ["全部", ...new Set(FAQ.map((f) => f.cat))]; },
    matches(f) {
      const q = this.q.trim();
      return !q || f.q.includes(q) || f.a.includes(q);
    },
    countIn(c) { return FAQ.filter((f) => (c === "全部" || f.cat === c) && this.matches(f)).length; },
    get shown() { return FAQ.filter((f) => (this.cat === "全部" || f.cat === this.cat) && this.matches(f)); },
    get allOpen() { return this.shown.length > 0 && this.shown.every((f) => this.open.includes(f.id)); },
    init() {
      // Auto-expand the answers when a search narrows the list down to a few questions.
      this.$watch("q", () => { if (this.q.trim() && this.shown.length <= 3) this.open = this.shown.map((f) => f.id); });
    },
    isOpen(id) { return this.open.includes(id); },
    toggle(id) { this.open = this.open.includes(id) ? this.open.filter((x) => x !== id) : [...this.open, id]; },
    openAll() { this.open = this.allOpen ? [] : this.shown.map((f) => f.id); },
    mark(text) {
      const safe = escapeHtml(text);
      const q = this.q.trim();
      return q ? safe.split(escapeHtml(q)).join(`<mark>${escapeHtml(q)}</mark>`) : safe;
    },
  }));
});
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.4/dist/cdn.min.js"></script>
</body>
</html>
