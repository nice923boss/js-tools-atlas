// Every scene builds its own physics world and frees it with Ammo.destroy on unmount;
// every renderer is released with dispose() + forceContextLoss().

// Static triangle mesh collider from a three.js geometry (degenerate triangles skipped).

const SIZE = 5, SEG = 22, BED_Y = 1.7, MAX_JELLY = 7, MAX_STEEL = 6;
const JELLY_COLORS = [0xf72585, 0x7bd389, 0x4cc9f0, 0xff8c42, 0x9d8cff, 0xf7df1e];
function jellyGeometry(kind) {
  let geo;
  if (kind === 0) geo = new THREE.SphereGeometry(0.55, 18, 12);
  else if (kind === 1) geo = new THREE.BoxGeometry(0.85, 0.85, 0.85, 4, 4, 4);
  else geo = new THREE.CapsuleGeometry(0.32, 0.6, 5, 12);

// ---------- scene 5 terrain ----------
const TA = 30, TB = 19;   // elliptical road semi-axes
const hills = (x, z) => 1.5 * Math.sin(x * 0.11 + 1.3) * Math.cos(z * 0.13) + 0.8 * Math.sin(x * 0.23 + z * 0.19 + 0.7);
function roadDist(x, z) { const n = Math.hypot(x / TA, z / TB); return (Math.abs(n - 1) * Math.hypot(x, z)) / Math.max(n, 1e-3); }
function heightAt(x, z) {
  const d = roadDist(x, z), r = Math.hypot(x, z);
  return hills(x, z) * (0.45 + 0.55 * smoothstep(2, 5, d)) + Math.max(0, r / 44 - 0.85) ** 2 * 70;
}
function terrainTexture(span) {
  const N = 1024, [c, g] = canvas2d(N, N), img = g.createImageData(N, N), D = img.data, rnd = rng(11);
  for (let py = 0; py < N; py++) for (let px = 0; px < N; px++) {
    const x = -span / 2 + ((px + 0.5) / N) * span, z = -span / 2 + ((py + 0.5) / N) * span;
    const d = roadDist(x, z), n = (rnd() - 0.5) * 16, i = (py * N + px) * 4;
    let R, G, B;
    if (d < 2.75) {
      R = G = 60 + n; B = 66 + n;
      if (d > 2.3 && d < 2.55) R = G = B = 228;
      else if (d < 0.15 && Math.floor(((Math.atan2(z / TB, x / TA) + Math.PI) * 24) / Math.PI) % 2 === 0) { R = 247; G = 223; B = 30; }
    } else {
      const k = smoothstep(2.5, 9, heightAt(x, z));
      R = 76 + 64 * k + n; G = 120 + 8 * k + n; B = 56 + 56 * k + n;
    }
    D[i] = R; D[i + 1] = G; D[i + 2] = B; D[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return canvasTex(c, 8);
}

    api: "body.setCcdMotionThreshold(t)・setCcdSweptSphereRadius(r)",
    desc: "兩排子彈以相同速度射向 10 公分厚的牆，物理步長固定 1/60 秒。速度一高，單步位移就超過牆厚，未開 CCD 的子彈直接穿牆；開啟連續碰撞偵測的那排沿掃掠球體檢查，被牆擋下。小點是每一步的位置，為了只看穿透現象，這個場景關閉重力。",
    hint: "調高速度看穿透，開慢動作看每一步的跳躍",
    async mount(ctx) {
      await boot(ctx);
      const S = stage(ctx, { labels: true, fov: 42, portraitFov: 60, bg: 0x0c0e13, pos: [7.5, 5.5, -10], target: [0, 1.6, -1],
        orbit: { minDistance: 4, maxDistance: 30 } });
      env(S, 0.4);
      sunLight(S, { intensity: 1.6, pos: [3, 8, -4], shadow: false, hemi: [0xdfe8ff, 0x15171d, 0.9] });
      const P = physics(ctx, { gravity: 0 });
      const grid = new THREE.GridHelper(20, 20, 0x2a3140, 0x1b2029); S.scene.add(grid);
      // the near wall gets its label under its foot so the two labels never overlap in projection
      const LANES = [{ x: -1.6, ly: 2.9, ccd: true, color: 0x7bd389, name: "開啟 CCD" }, { x: 1.6, ly: -0.4, ccd: false, color: 0xff8c42, name: "未開 CCD" }];
      const wallShape = P.shape(new A.btBoxShape(P.v3(1.2, 1.2, 0.05)));
      const bulletShape = P.shape(new A.btSphereShape(0.08)), bulletGeo = S.own(new THREE.SphereGeometry(0.08, 16, 12));
      for (const L of LANES) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.4, 0.1), new THREE.MeshStandardMaterial({ color: 0x8fa3bf, transparent: true, opacity: 0.35, roughness: 0.3 }));
        S.scene.add(m);
        const ed = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.4, 2.4, 0.1)), new THREE.LineBasicMaterial({ color: L.color }));
        ed.position.set(L.x, 1.2, 3); S.scene.add(ed);
        P.body(wallShape, 0, [L.x, 1.2, 3], { restitution: 1, mesh: m });
        const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.6, 16).rotateX(Math.PI / 2), std(L.color, { metalness: 0.6, roughness: 0.3 }));
        gun.position.set(L.x, 1.2, -7.4); S.scene.add(gun);
        L.mat = S.own(std(L.color, { emissive: L.color, emissiveIntensity: 0.6 }));
        L.lab = label(L.name, "穿透 0／0", true); L.lab.position.set(L.x, L.ly, 3); S.scene.add(L.lab);
        L.results = [];
      }
      const TRAIL = 1200, trail = new THREE.InstancedMesh(new THREE.SphereGeometry(0.035, 8, 6), new THREE.MeshBasicMaterial(), TRAIL);
      trail.frustumCulled = false; trail.count = 0; S.scene.add(trail);
      const tr = Array.from({ length: TRAIL }, () => ({ x: 0, y: 0, z: 0, t: -99, lane: 0 })); let ti = 0;
      const laneColors = LANES.map((L) => new THREE.Color(L.color));

      let speed = 90, slow = false, acc = 0, simT = 0, nextFire = 0.3;
      const bullets = [];
      function fire() {
        const jy = (Math.random() - 0.5) * 0.9;
        LANES.forEach((L, li) => {
          const m = new THREE.Mesh(bulletGeo, L.mat); S.scene.add(m);
          const r = P.body(bulletShape, 0.05, [L.x, 1.2 + jy, -7], { restitution: 0.4, group: 4, mask: 2, awake: true, mesh: m });
          if (L.ccd) { r.b.setCcdMotionThreshold(0.08); r.b.setCcdSweptSphereRadius(0.06); }
          r.b.setLinearVelocity(P.v3(0, 0, speed));
          bullets.push({ r, li, born: simT, v: speed, done: false });
        });
      }
      function afterStep() {
        const F = A.HEAPF32;
        for (const b of [...bullets]) {
          const p = b.r.gp, z = F[p + 14];
          const e = tr[ti]; ti = (ti + 1) % TRAIL; e.x = F[p + 12]; e.y = F[p + 13]; e.z = z; e.t = simT; e.lane = b.li;
          if (!b.done) {
            const vz = b.r.b.getLinearVelocity().z();
            if (z > 3.2) { b.done = true; record(b.li, true); }
            else if (z > 1 && vz < b.v * 0.5) { b.done = true; record(b.li, false); }
          }
          if (simT - b.born > 10.5 / b.v + 1.2 || Math.abs(z) > 12) { bullets.splice(bullets.indexOf(b), 1); P.remove(b.r); }
        }
      }
      function record(li, tunneled) {
        const L = LANES[li];
        L.results.push(tunneled); if (L.results.length > 5) L.results.shift();
        L.lab.sub.textContent = `穿透 ${L.results.filter(Boolean).length}／${L.results.length}（最近 5 發）`;
      }
      ctx.slider("速度", { min: 5, max: 250, step: 5, value: 90, format: (v) => `${v} m/s` }, (v) => { speed = v; for (const L of LANES) { L.results = []; L.lab.sub.textContent = "穿透 0／0"; } });
      ctx.toggle("慢動作", false, (v) => { slow = v; });

      const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), V = new THREE.Vector3(), SC = new THREE.Vector3();
      S.onFrame((dt) => {
        acc = Math.min(acc + dt * (slow ? 0.2 : 1), 6 / 60);
        P.time(() => {
          while (acc >= 1 / 60) {
            acc -= 1 / 60; simT += 1 / 60;
            if (simT >= nextFire) { fire(); nextFire += 0.8; }
            P.world.stepSimulation(1 / 60, 0);
            afterStep();
          }
        });
        P.syncAll();
        let k = 0;
        for (const e of tr) {
          const age = simT - e.t;
          if (age > 2.4) continue;
          trail.setMatrixAt(k, M.compose(V.set(e.x, e.y, e.z), Q, SC.setScalar(1 - age / 2.4)));
          trail.setColorAt(k++, laneColors[e.lane]);
        }
        trail.count = k; trail.instanceMatrix.needsUpdate = true;
        if (trail.instanceColor) trail.instanceColor.needsUpdate = true;
      });
      autoFit(S, 5.2, 3.8, 1.05);
      legend(ctx, [["#7bd389", "開啟 CCD", true], ["#ff8c42", "未開 CCD", true]]);
      hud(ctx, () => `每步位移 <b>${(speed / 60).toFixed(2)}</b> m・牆厚 <b>0.10</b> m・步長 <b>1/60</b> s・物理 <b>${P.ms.toFixed(2)}</b> ms`);
    },
  },

  // 8. Stress: rigid body count ramp.
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "stepSimulation(dt, 2, 1/60)・InstancedMesh 直讀 m_graphicsWorldTrans",
    desc: "剛體逐級加量倒進攪拌箱，量測 Bullet 每步耗時、同步到 InstancedMesh 的時間與 WASM 堆積用量，畫面掉到 30 FPS 以下就停止加壓。",
    hint: "按「自動加壓」逐級增加剛體數",
    async mount(ctx) {
      ctx.html('<div class="am-view"></div>');
      const host = ctx.$(".am-view");
      ctx.controls.classList.add("bottom");
      await boot(ctx);
      const S = stage(ctx, { host, shadows: false, fov: 50, bg: 0x07080b, pos: [0, 13, 18], target: [0, 1, 0],
        orbit: { autoRotate: true, autoRotateSpeed: 0.4, maxPolarAngle: Math.PI * 0.47, minDistance: 8, maxDistance: 60 } });
      env(S, 0.5);
      sunLight(S, { intensity: 1.8, pos: [6, 14, 8], shadow: false, hemi: [0xe8f0ff, 0x15171d, 0.9] });
      const P = physics(ctx);
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(15, 15).rotateX(-Math.PI / 2), std(0x141821, { roughness: 0.95 })); S.scene.add(fl);
      P.body(P.shape(new A.btBoxShape(P.v3(7.5, 0.5, 7.5))), 0, [0, -0.5, 0]);
      const glass = S.own(new THREE.MeshStandardMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.08, depthWrite: false }));
      const wx = P.shape(new A.btBoxShape(P.v3(7.5, 3, 0.25))), wz = P.shape(new A.btBoxShape(P.v3(0.25, 3, 7.5)));
      for (const s of [-1, 1]) {
        P.body(wx, 0, [0, 3, s * 7.25], { mesh: S.scene.add(new THREE.Mesh(new THREE.BoxGeometry(15, 6, 0.5), glass)).children.at(-1) });
        P.body(wz, 0, [s * 7.25, 3, 0], { mesh: S.scene.add(new THREE.Mesh(new THREE.BoxGeometry(0.5, 6, 15), glass)).children.at(-1) });
      }
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(15, 6, 15)), new THREE.LineBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.4 }));
      edges.position.y = 3; S.scene.add(edges);
      const padM = new THREE.Mesh(new THREE.BoxGeometry(13.6, 0.6, 0.3), std(0xff8c42, { roughness: 0.4 })); S.scene.add(padM);
      const paddle = P.body(P.shape(new A.btBoxShape(P.v3(6.8, 0.3, 0.15))), 0, [0, 0.45, 0], { kinematic: true, mesh: padM });

      const CAP = 1500;
      const boxShape = P.shape(new A.btBoxShape(P.v3(0.22, 0.22, 0.22))), sphShape = P.shape(new A.btSphereShape(0.25));
      const boxMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(0.44, 0.44, 0.44), std(0xffffff, { roughness: 0.45 }), CAP);
      const sphMesh = new THREE.InstancedMesh(new THREE.SphereGeometry(0.25, 12, 8), std(0xffffff, { roughness: 0.35 }), CAP);
      for (const m of [boxMesh, sphMesh]) { m.frustumCulled = false; m.count = 0; S.scene.add(m); }
      const col = new THREE.Color();
      for (let i = 0; i < CAP; i++) { boxMesh.setColorAt(i, col.setHex(PALETTE[i % 6])); sphMesh.setColorAt(i, col.setHex(PALETTE[(i + 3) % 6])); }
      const all = [], boxes = [], sphs = [];
      const spawnPos = (k) => { const g = k % 196; return [((g % 14) - 6.5) * 0.9 + (Math.random() - 0.5) * 0.2, 7 + Math.floor(k / 196) * 0.8, (Math.floor(g / 14) - 6.5) * 0.9 + (Math.random() - 0.5) * 0.2]; };
      function apply(n) {
        while (all.length < n) {
          const k = all.length, isBox = k % 2 === 0;
          const r = P.body(isBox ? boxShape : sphShape, 1, spawnPos(k), { restitution: 0.1, rolling: 0.01 });
          r.isBox = isBox; all.push(r); (isBox ? boxes : sphs).push(r);
        }
        while (all.length > n) { const r = all.pop(); (r.isBox ? boxes : sphs).pop(); P.remove(r); }
      }
      let stir = true, ang = 0, syncMs = 0;
      const aq = new THREE.Quaternion();
      ctx.toggle("攪拌槳", true, (v) => { stir = v; });
      ctx.button("重新灑落", () => {
        all.forEach((r, k) => {
          const [x, y, z] = spawnPos(k), t = P.T(x, y, z);
          r.b.setWorldTransform(t); r.ms.setWorldTransform(t);
          r.b.setLinearVelocity(P.v3()); r.b.setAngularVelocity(P.v3()); r.b.activate();
        });
      });
      S.onFrame((dt) => {
        if (stir) ang += 0.6 * dt;
        paddle.ms.setWorldTransform(P.T(0, 0.45, 0, aq.setFromAxisAngle(UP, ang)));
        P.step(dt, 2, 1 / 60);
        P.syncAll();
        const t0 = performance.now(), F = A.HEAPF32;
        for (const [list, mesh] of [[boxes, boxMesh], [sphs, sphMesh]]) {
          const e = mesh.instanceMatrix.array;
          for (let i = 0; i < list.length; i++) heapToMatrix(e, F, list[i].gp, i * 16);
          mesh.count = list.length; mesh.instanceMatrix.needsUpdate = true;
        }
        syncMs = ema(syncMs, performance.now() - t0);
      });
      autoFit(S, 8, 4, 1.05);
      ctx.ramp({
        label: "剛體", unit: "個",
        steps: [100, 250, 500, 1000, 1500, 2000, 3000],
        minFps: 30,
        apply,
        metrics: () => ({
          物理步進: `${P.ms.toFixed(1)} ms`,
          同步繪圖: `${syncMs.toFixed(2)} ms`,
          活動剛體: all.reduce((s, r) => s + (r.b.isActive() ? 1 : 0), 0),
          接觸流形: P.disp.getNumManifolds(),
          "WASM 堆積": heapText(),
        }),
        note: "ammo.js 在單一執行緒的 WebAssembly 裡跑完整 Bullet 管線：DBVT 寬相、窄相碰撞與循序脈衝求解器。剛體堆疊越密，接觸流形越多，求解器負擔隨之上升；關閉攪拌槳後靜止的剛體會進入休眠、幾乎不耗時。這個建置的 WASM 堆積大小固定，只能讀到曾經用到的最高點；畫面用 InstancedMesh 直接讀 WASM 記憶體裡的變換矩陣。",
      });
    },
  },
] });
</script>
</body>
</html>
