<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animate.css 示範：加一個 class 就有動畫</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  h1 { position: fixed; left: 16px; top: 14px; margin: 0; font-size: 16px; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .layout { position: fixed; inset: 56px 16px 48px; display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
  .stage { position: relative; inset: auto; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; }
  .stage::before { content: ""; position: absolute; inset: 0; background: radial-gradient(50% 50% at 50% 45%, rgba(247, 223, 30, .10), transparent 70%); pointer-events: none; }
  .badge {
    width: min(150px, 36vh); aspect-ratio: 1; border-radius: 28px; display: grid; place-items: center; position: relative;
    background: linear-gradient(145deg, #ffe95a, #f7b51e); color: #1a1a14; box-shadow: 0 18px 40px rgba(247, 181, 30, .25);
    font: 900 clamp(34px, 9vh, 54px)/1 var(--font); letter-spacing: -1px;
  }
  .badge i { position: absolute; left: 18%; right: 18%; bottom: 16%; height: 6px; border-radius: 6px; background: rgba(26, 26, 20, .25); }
  .badge.gone { visibility: hidden; }
  .code { font-size: 12px; padding: 6px 10px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .code b { color: var(--accent); font-weight: 600; }
  .speed { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
  .speed .btn { padding: 5px 10px; font-size: 12px; }
  .gallery { display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: 12px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--k); margin-right: 5px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; align-content: start; }
  .tile {
    appearance: none; cursor: pointer; height: 34px; border-radius: 7px; overflow: hidden; padding: 0 6px;
    background: var(--bg-2); color: var(--fg); border: 1px solid var(--line); border-left: 3px solid var(--k);
    font: 11px/1 var(--mono); text-align: left; white-space: nowrap;
  }
  .tile span { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: middle; }
  .tile[aria-pressed="true"] { border-color: var(--k); box-shadow: inset 0 0 0 1px var(--k); background: color-mix(in srgb, var(--k) 14%, var(--bg-2)); }
  .k-attn { --k: var(--c2); } .k-in { --k: var(--c4); } .k-out { --k: var(--c3); }
  @media (max-width: 620px) {
    h1 { display: none; }
    .layout { inset: 52px 10px 52px; grid-template-columns: 1fr; grid-template-rows: 1fr auto; gap: 8px; }
    .stage { gap: 10px; padding: 10px; }
    .badge { width: min(110px, 22vh); border-radius: 22px; font-size: 36px; }
    .code { font-size: 11px; }
    .gallery { padding: 8px; gap: 6px; }
    .tiles { gap: 4px; }
    .tile { height: 27px; font-size: 10.5px; padding: 0 4px; }
  }
</style>
</head>
<body>
<h1>Animate.css 動畫目錄<small>純 CSS class，JS 只負責加上與移除</small></h1>
<div class="controls">
  <button class="btn" id="auto" aria-pressed="true">自動播放</button>
  <button class="btn primary" id="replay">重播</button>
</div>
<main class="layout">
  <section class="panel stage">
    <div class="badge" id="badge">CSS<i></i></div>
    <div class="code mono" id="code">class="animate__animated <b>animate__tada</b>"</div>
    <div class="speed">速度
      <button class="btn" data-speed="animate__slow" aria-pressed="false">slow</button>
      <button class="btn" data-speed="" aria-pressed="true">預設</button>
      <button class="btn" data-speed="animate__faster" aria-pressed="false">faster</button>
    </div>
  </section>
  <section class="panel gallery">
    <div class="legend"><span class="k-attn">注意</span><span class="k-in">進場</span><span class="k-out">退場</span></div>
    <div class="tiles" id="tiles"></div>
  </section>
</main>
<div class="hint">點任一個 class 名稱，在左邊舞台播放</div>

<script>
// Animate.css is CSS only: playing an effect means adding two classes and removing them on animationend.
const ATTN = ["tada", "rubberBand", "heartBeat", "bounce", "swing", "jello", "headShake"];
const INS = ["backInDown", "bounceIn", "flipInX", "jackInTheBox", "rotateIn", "fadeInUp"];
const OUTS = ["backOutUp", "bounceOut", "flipOutY", "hinge", "zoomOut"];
const KIND = Object.fromEntries([...ATTN.map((n) => [n, "attn"]), ...INS.map((n) => [n, "in"]), ...OUTS.map((n) => [n, "out"])]);
const badge = document.getElementById("badge");
const code = document.getElementById("code");
const tilesEl = document.getElementById("tiles");
const autoBtn = document.getElementById("auto");
let speed = "", current = null, auto = true, timer = null, step = 0, idx = { attn: 0, in: 0, out: 0 };

// Run one Animate.css effect on an element, then clean the classes up.
function animateOnce(el, name, done) {
  const cls = ["animate__animated", `animate__${name}`, speed].filter(Boolean);
  el.className = el.className.split(" ").filter((c) => !c.startsWith("animate__")).join(" ");
  void el.offsetWidth; // restart even when the same class is applied twice
  el.classList.add(...cls);
  el.addEventListener("animationend", function end(e) {
    if (e.target !== el) return;
    el.removeEventListener("animationend", end);
    el.classList.remove(...cls);
    if (done) done();
  });
}

function play(name) {
  current = name;
  code.innerHTML = `class="animate__animated <b>animate__${name}</b>${speed ? ` ${speed}` : ""}"`;
  tilesEl.querySelectorAll(".tile").forEach((t) => t.setAttribute("aria-pressed", t.dataset.name === name));
  const tile = tilesEl.querySelector(`[data-name="${name}"] span`);
  if (tile) animateOnce(tile, name);
  clearTimeout(timer);
  badge.classList.remove("gone");
  animateOnce(badge, name, () => {
    if (current !== name) return;
    // An exit leaves the badge hidden; bring it back with an entrance.
    if (KIND[name] === "out") {
      badge.classList.add("gone");
      timer = setTimeout(() => play(auto ? nextOf("in") : "zoomIn"), 350);
    } else if (auto) {
      timer = setTimeout(nextStep, 650);
    }
  });
}

function nextOf(kind) {
  const list = { attn: ATTN, in: INS, out: OUTS }[kind];
  return list[idx[kind]++ % list.length];
}
// Auto order: attention, attention, exit (followed by an entrance).
function nextStep() { play(nextOf(step++ % 3 === 2 ? "out" : "attn")); }

function setAuto(on) {
  auto = on;
  autoBtn.setAttribute("aria-pressed", on);
  if (on) nextStep();
}

for (const name of [...ATTN, ...INS, ...OUTS]) {
  const b = document.createElement("button");
  b.className = `tile k-${KIND[name]}`;
  b.dataset.name = name;
  b.setAttribute("aria-pressed", "false");
  b.innerHTML = `<span>${name}</span>`;
  b.addEventListener("click", () => { auto = false; autoBtn.setAttribute("aria-pressed", "false"); play(name); });
  tilesEl.append(b);
}
document.querySelectorAll("[data-speed]").forEach((b) => b.addEventListener("click", () => {
  speed = b.dataset.speed;
  document.querySelectorAll("[data-speed]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  play(current && KIND[current] !== "out" ? current : "tada");
}));
autoBtn.addEventListener("click", () => setAuto(!auto));
document.getElementById("replay").addEventListener("click", () => {
  step = 0; idx = { attn: 0, in: 0, out: 0 };
  setAuto(true);
});

nextStep();
</script>
</body>
</html>
