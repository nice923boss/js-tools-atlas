<script>
const { h } = Showcase;
const P = "animate__";

const ATTN = ["bounce", "flash", "pulse", "rubberBand", "shakeX", "shakeY", "headShake", "swing", "tada", "wobble", "jello", "heartBeat"];
// Category names follow the section comments in animate.css 4.1.1 (97 animations in total).
const CATS = [
  ["Attention seekers", "注意力", "attn", ATTN],
  ["Back entrances", "Back 進場", "in", ["backInDown", "backInLeft", "backInRight", "backInUp"]],
  ["Back exits", "Back 退場", "out", ["backOutDown", "backOutLeft", "backOutRight", "backOutUp"]],
  ["Bouncing entrances", "彈跳進場", "in", ["bounceIn", "bounceInDown", "bounceInLeft", "bounceInRight", "bounceInUp"]],
  ["Bouncing exits", "彈跳退場", "out", ["bounceOut", "bounceOutDown", "bounceOutLeft", "bounceOutRight", "bounceOutUp"]],
  ["Fading entrances", "淡入", "in", ["fadeIn", "fadeInDown", "fadeInDownBig", "fadeInLeft", "fadeInLeftBig", "fadeInRight", "fadeInRightBig", "fadeInUp", "fadeInUpBig", "fadeInTopLeft", "fadeInTopRight", "fadeInBottomLeft", "fadeInBottomRight"]],
  ["Fading exits", "淡出", "out", ["fadeOut", "fadeOutDown", "fadeOutDownBig", "fadeOutLeft", "fadeOutLeftBig", "fadeOutRight", "fadeOutRightBig", "fadeOutUp", "fadeOutUpBig", "fadeOutTopLeft", "fadeOutTopRight", "fadeOutBottomRight", "fadeOutBottomLeft"]],
  ["Flippers", "翻轉", "mix", ["flip", "flipInX", "flipInY", "flipOutX", "flipOutY"]],
  ["Lightspeed", "光速", "mix", ["lightSpeedInRight", "lightSpeedInLeft", "lightSpeedOutRight", "lightSpeedOutLeft"]],
  ["Rotating entrances", "旋轉進場", "in", ["rotateIn", "rotateInDownLeft", "rotateInDownRight", "rotateInUpLeft", "rotateInUpRight"]],
  ["Rotating exits", "旋轉退場", "out", ["rotateOut", "rotateOutDownLeft", "rotateOutDownRight", "rotateOutUpLeft", "rotateOutUpRight"]],
  ["Specials", "特殊", "mix", ["hinge", "jackInTheBox", "rollIn", "rollOut"]],
  ["Zooming entrances", "縮放進場", "in", ["zoomIn", "zoomInDown", "zoomInLeft", "zoomInRight", "zoomInUp"]],
  ["Zooming exits", "縮放退場", "out", ["zoomOut", "zoomOutDown", "zoomOutLeft", "zoomOutRight", "zoomOutUp"]],
  ["Sliding entrances", "滑入", "in", ["slideInDown", "slideInLeft", "slideInRight", "slideInUp"]],
  ["Sliding exits", "滑出", "out", ["slideOutDown", "slideOutLeft", "slideOutRight", "slideOutUp"]],
];
const TOTAL = CATS.reduce((s, c) => s + c[3].length, 0);
const isExit = (n) => n.includes("Out") || n === "hinge";
const kindOf = (n) => (ATTN.includes(n) || n === "flip" ? "attn" : isExit(n) ? "out" : "in");
const KIND_C = { attn: "--c2", in: "--c4", out: "--c3" };
const KIND_ZH = { attn: "注意力", in: "進場", out: "退場" };
const KIND_NOTE = {
  attn: "原地動作，結束回到原狀，可搭配 repeat／infinite",
  in: "從透明或畫面外進入，停在原位",
  out: "結束停在隱藏（fill-mode: both），移除 class 才回來",
  mix: "同一類同時有進場與退場",
};

// Remove every animate__* class from an element.
function strip(el) {
  for (const c of [...el.classList]) if (c.startsWith(P)) el.classList.remove(c);
}
// Start (or restart) an animation: drop the old classes, force a reflow so the same name can
// replay, then add the new ones.
function start(el, name, extra = []) {
  strip(el);
  void el.offsetWidth;
  el.classList.add(`${P}animated`, P + name, ...extra.map((x) => P + x));
}
// Promise wrapper in the spirit of the official animateCSS() helper. Classes stay on after the
// end so exits remain hidden; the next start() clears them.
function play(el, name, extra = []) {
  start(el, name, extra);
  return new Promise((resolve) => {
    const end = (e) => {
      if (e.target !== el || e.animationName !== name) return;
      el.removeEventListener("animationend", end);
      resolve(e);
    };
    el.addEventListener("animationend", end);
  });
}
const ignoreAbort = (e) => { if (e?.name !== "AbortError") console.error(e); };
const secs = (v) => `${(+parseFloat(v).toFixed(3))}s`;

const S1_ATTN = ["tada", "rubberBand", "heartBeat", "bounce", "swing", "jello", "headShake"];
const S1_INS = ["backInDown", "bounceIn", "flipInX", "jackInTheBox", "rotateIn", "fadeInUp"];
const S1_OUTS = ["backOutUp", "bounceOut", "flipOutY", "hinge", "zoomOut"];

const SEQS = [
  { label: "新訊息", icon: "✉", c: "--c2", title: "新訊息", text: "王小明：明天的課改到 2 樓教室", steps: ["backInDown", "headShake", "pulse", "backOutUp"] },
  { label: "密碼錯誤", icon: "!", c: "--c3", title: "登入失敗", text: "密碼錯誤，請再試一次", steps: ["fadeInDown", "shakeX", "shakeX", "fadeOutUp"] },
  { label: "上傳完成", icon: "✓", c: "--c4", title: "上傳完成", text: "3 個檔案已上傳到雲端硬碟", steps: ["zoomIn", "tada", "heartBeat", "zoomOutDown"] },
];

Showcase.run({ scenes: [
  {
    id: "badge", title: "徽章輪播",
    api: 'el.classList.add("animate__animated", "animate__tada")',
    desc: "原版示範移植：同一顆 CSS 徽章依序播放注意力、退場、進場動畫。animate.css 只提供 class 與 @keyframes，加上 animate__animated 與動畫名稱兩個 class 就會播放。",
    hint: "點任一動畫名稱立即播放；右上切換 slow／faster 速度 class",
    mount(ctx) {
      ctx.html(`<div class="pad s1"><div class="split">
        <div class="panel box stage"><span class="kind"></span><div class="badge">CSS<i></i></div><div class="code"></div></div>
        <div class="panel box gal"><div class="legend"><span class="k-attn">注意</span><span class="k-in">進場</span><span class="k-out">退場</span></div><div class="tiles"></div></div>
      </div></div>`);
      const badge = ctx.$(".badge"), kindEl = ctx.$(".kind"), code = ctx.$(".code"), tiles = ctx.$(".tiles");
      let speed = "", auto = true, token = 0, running = false, idleAt = performance.now() - 300;
      let ai = 0, ii = 0, oi = 0, phase = 0;
      const nextIn = () => S1_INS[ii++ % S1_INS.length];
      const chips = new Map();
      for (const [kind, names] of [["attn", S1_ATTN], ["in", S1_INS], ["out", S1_OUTS]]) {
        for (const n of names) {
          const b = h("button", { class: `tile k-${kind}`, type: "button", title: `animate__${n}`, onclick: () => go(kind === "out" ? [n, nextIn()] : [n]) }, n);
          chips.set(n, b);
          tiles.append(b);
        }
      }
      async function go(names) {
        const my = ++token;
        running = true;
        try {
          for (const n of names) {
            const kind = kindOf(n);
            kindEl.textContent = `${KIND_ZH[kind]}・${n}`;
            kindEl.style.setProperty("--c", `var(${KIND_C[kind]})`);
            code.innerHTML = `class="animate__animated <b>animate__${n}</b>${speed ? ` animate__${speed}` : ""}"`;
            chips.forEach((b, k) => b.classList.toggle("on", k === n));
            await play(badge, n, speed ? [speed] : []);
            if (my !== token) return;
            await ctx.sleep(isExit(n) ? 350 : 650);
            if (my !== token) return;
          }
        } finally {
          if (my === token) { running = false; idleAt = performance.now(); }
        }
      }
      // Tour order from the original page: attention, attention, then an exit followed by an entrance.
      const tour = () => {
        phase = (phase + 1) % 3;
        return phase === 0 ? [S1_OUTS[oi++ % S1_OUTS.length], nextIn()] : [S1_ATTN[ai++ % S1_ATTN.length]];
      };
      ctx.group(["slow", "預設", "faster"], 1, (i) => { speed = ["slow", "", "faster"][i]; });
      ctx.toggle("自動", true, (v) => { auto = v; idleAt = performance.now(); });
      ctx.interval(() => {
        if (auto && !running && performance.now() - idleAt > 500) go(tour()).catch(ignoreAbort);
      }, 100);
    },
  },

  {
    id: "catalog", title: "分類瀏覽",
    api: "animate__bounceInLeft、animate__fadeOutUpBig…（16 類 97 種）",
    desc: "依 animate.css 原始碼的 16 個分類列出全部動畫，每格就是該 class 的實際效果；退場類結束後停在隱藏，移除 class 才回到原位。",
    hint: "切換分類或點任一格播放；開著「自動」會逐類輪播",
    mount(ctx) {
      ctx.html(`<div class="pad s2"><div class="info"></div><div class="cells"></div></div>`);
      const info = ctx.$(".info"), cells = ctx.$(".cells");
      let cat = 0, playedCat = -1, auto = true, idleSince = performance.now() - 800;
      const busy = new Set(), restoreAt = new Map();
      const sel = ctx.select("分類", CATS.map((c, i) => ({ value: i, label: `${c[1]}（${c[3].length}）` })), 0, (v) => { show(+v); playAll(); });
      ctx.button("全部播放", () => playAll(), { primary: true });
      ctx.toggle("自動", true, (v) => { auto = v; });
      function show(i) {
        cat = i;
        sel.value = String(i);
        const [en, zh, kind, names] = CATS[i];
        info.innerHTML = `<b>${zh}</b><span>${en}・${names.length} 種（全部 ${CATS.length} 類 ${TOTAL} 種）</span><span class="k">${KIND_NOTE[kind]}</span>`;
        busy.clear();
        restoreAt.clear();
        cells.replaceChildren(...names.map((n) => {
          const btn = h("button", { class: "cell", type: "button", title: `animate__${n}`, style: `--c: var(${KIND_C[kindOf(n)]})` },
            h("span", { class: "spec", text: "Aa" }), h("span", { class: "nm", text: n }));
          btn.addEventListener("click", () => playOne(btn, n, 0));
          return btn;
        }));
      }
      function playOne(btn, n, delayMs) {
        const spec = btn.firstChild;
        restoreAt.delete(spec);
        spec.style.animationDelay = delayMs ? `${delayMs}ms` : "";
        busy.add(spec);
        btn.classList.add("on");
        play(spec, n).then(() => {
          busy.delete(spec);
          btn.classList.remove("on");
          if (isExit(n)) restoreAt.set(spec, performance.now() + 900);
        });
      }
      function playAll() {
        playedCat = cat;
        [...cells.children].forEach((b, i) => playOne(b, b.lastChild.textContent, i * 90));
      }
      ctx.interval(() => {
        const now = performance.now();
        for (const [spec, t] of restoreAt) if (now >= t) { strip(spec); restoreAt.delete(spec); }
        if (busy.size || restoreAt.size) { idleSince = now; return; }
        if (!auto || now - idleSince < 1200) return;
        if (playedCat === cat) show((cat + 1) % CATS.length);
        playAll();
      }, 100);
      show(0);
    },
  },

  {
    id: "vars", title: "CSS 變數",
    api: "--animate-duration、--animate-delay；animate__delay-1s～5s",
    desc: "4.x 把時間抽成 CSS 變數，可設在 :root 或任一容器上只影響局部。delay 變數只透過 animate__delay-Ns 生效，實際延遲是 calc(var(--animate-delay) * N)。下方長條：亮段是播放區間，白線是 getAnimations() 讀到的目前時間。",
    hint: "拖動「時長」與「延遲」，看每欄的 computed 值與起跑時間一起改變",
    mount(ctx) {
      ctx.html(`<div class="pad s3"><div class="panel box vars code"></div><div class="lab"></div></div>`);
      const vars = ctx.$(".vars"), lab = ctx.$(".lab");
      let dur = 1, del = 0.3, run = 0, ended = 0, replayAt = Infinity;
      const cols = [0, 1, 2, 3, 4].map((n, i) => {
        const ball = h("div", { class: "ball" });
        const seg = h("i"), head = h("b");
        const calc = h("div", { class: "calc" }), comp = h("div", { class: "comp" });
        const col = h("div", { class: "panel box col", style: `--hue: ${195 + i * 34}` },
          h("div", { class: "well" }, ball), h("div", { class: "bar" }, seg, head),
          h("div", { class: "cls" }, n ? h("span", { class: "lbl", text: "delay-" }) : h("span", { class: "lbl", text: "無 delay class" }), n ? `${n}s` : h("span", { class: "nr", text: "無" })), calc, comp);
        lab.append(col);
        return { n, ball, seg, head, calc, comp };
      });
      function restart() {
        lab.style.setProperty("--animate-duration", `${dur}s`);
        lab.style.setProperty("--animate-delay", `${del}s`);
        vars.innerHTML = `.lab { --animate-duration: <b>${dur.toFixed(1)}s</b>; --animate-delay: <b>${del.toFixed(2)}s</b>; }`;
        const my = ++run;
        ended = 0;
        replayAt = Infinity;
        const total = 4 * del + dur;
        for (const c of cols) {
          play(c.ball, "bounceInUp", c.n ? [`delay-${c.n}s`] : []).then(() => {
            if (my === run && ++ended === cols.length) replayAt = performance.now() + 1000;
          });
          const cs = getComputedStyle(c.ball);
          c.calc.textContent = c.n ? `= ${c.n} × ${del.toFixed(2)}s` : "= 0s";
          c.comp.innerHTML = `<span class="lbl">delay </span><b>${secs(cs.animationDelay)}</b><span class="lbl">・dur <b>${secs(cs.animationDuration)}</b></span>`;
          c.seg.style.left = `${(c.n * del / total) * 100}%`;
          c.seg.style.width = `${(dur / total) * 100}%`;
        }
        cols.total = total * 1000;
      }
      ctx.slider("時長", { min: 0.2, max: 3, step: 0.1, value: dur, format: (v) => `${v.toFixed(1)}s` }, (v) => { dur = v; restart(); });
      ctx.slider("延遲", { min: 0, max: 1.5, step: 0.05, value: del, format: (v) => `${v.toFixed(2)}s` }, (v) => { del = v; restart(); });
      ctx.button("重播", restart);
      ctx.raf(() => {
        for (const c of cols) {
          const a = c.ball.getAnimations()[0];
          const t = a ? Math.min(+a.currentTime || 0, cols.total) : cols.total;
          c.head.style.left = `${(t / cols.total) * 100}%`;
        }
        if (performance.now() > replayAt) restart();
      });
      restart();
    },
  },

    api: "animate__slower／slow／fast／faster",
    desc: "速度 class 只是把 --animate-duration 乘上倍數：slower ×3、slow ×2、fast ×0.8、faster ×0.5。五條跑道同時起跑，右側是從加上 class 到 animationend 實測的毫秒數。",

      const lanes = [["slower", "×3"], ["slow", "×2"], [null, "×1"], ["fast", "×0.8"], ["faster", "×0.5"]].map(([cls, mul]) => {
        const runner = h("div", { class: "runner", text: cls ? `animate__${cls}` : "預設" });

  {
    id: "repeat", title: "重複次數",
    api: "animate__repeat-1／2／3、animate__infinite、--animate-repeat",
    desc: "repeat-N 的次數是 calc(var(--animate-repeat) * N)，infinite 則無限循環。每圈結束觸發 animationiteration，最後一圈觸發 animationend；infinite 永遠不會有 animationend。",
    hint: "拖動 repeat 變數，看各列 computed 次數與事件紀錄",
    mount(ctx) {
      ctx.html(`<div class="pad s5"><div class="panel box vars code"></div><div class="split"><div class="lanes"></div>
        <div class="panel box log"><div class="lh">事件紀錄（新的在上）</div><ol></ol></div></div></div>`);
      const vars = ctx.$(".vars"), lanesEl = ctx.$(".lanes"), log = ctx.$(".log ol");
      let rep = 1, ended = 0, replayAt = Infinity;
      const lanes = [["repeat-1", 1], ["repeat-2", 2], ["repeat-3", 3], ["infinite", Infinity]].map(([cls, n]) => {
        const spec = h("div", { class: "spec", text: "!" });
        const sub = h("small"), dots = h("div", { class: "dots" });
        const el = h("div", { class: "panel box lane" }, h("div", { class: "who" }, h("b", {}, h("span", { class: "pfx", text: "animate__" }), cls), sub), h("div", { class: "well" }, spec), dots);
        lanesEl.append(el);
        spec.lane = { cls, n, spec, sub, dots, count: 0 };
        return spec.lane;
      });
      lanesEl.style.setProperty("--animate-duration", "0.7s");
      const addLog = (lane, type, e) => {
        const cl = type === "animationstart" ? "st" : type === "animationiteration" ? "it" : "en";
        log.prepend(h("li", {}, h("b", { text: lane.cls }), " ", h("span", { class: cl, text: type }), ` ${e.elapsedTime.toFixed(2)}s`));
        while (log.children.length > 14) log.lastChild.remove();
      };
      const paint = (l) => {
        if (l.n === Infinity) { l.dots.firstChild.textContent = `第 ${l.count} 圈`; return; }
        [...l.dots.children].forEach((d, i) => d.classList.toggle("on", i < l.count));
      };
      for (const type of ["animationstart", "animationiteration", "animationend"]) {
        ctx.on(lanesEl, type, (e) => {
          const l = e.target.lane;
          if (!l) return;
          addLog(l, type, e);
          if (type === "animationstart") return;
          l.count++;
          paint(l);
          if (type === "animationend" && ++ended === 3) replayAt = performance.now() + 1500;
        });
      }
      function restart() {
        lanesEl.style.setProperty("--animate-repeat", rep);
        vars.innerHTML = `.lanes { --animate-duration: 0.7s; --animate-repeat: <b>${rep}</b>; }`;
        ended = 0;
        replayAt = Infinity;
        for (const l of lanes) {
          l.count = 0;
          start(l.spec, "tada", [l.cls]);
          const it = getComputedStyle(l.spec).animationIterationCount;
          l.sub.replaceChildren(h("span", { class: "pfx", text: "iteration-" }), `count: ${it}`);
          if (l.n === Infinity) l.dots.replaceChildren(h("span", {}));
          else l.dots.replaceChildren(...Array.from({ length: +it }, () => h("i", {})));
          paint(l);
        }
      }
      ctx.slider("repeat 變數", { min: 1, max: 4, step: 1, value: rep }, (v) => { rep = v; restart(); });
      ctx.button("重播", restart);
      ctx.interval(() => { if (performance.now() > replayAt) restart(); }, 100);
      restart();
    },
  },

  {
    id: "chain", title: "JS 串接",
    api: 'await animateCSS(card, "headShake")  // Promise + animationend',
    desc: "官方文件建議把「加 class、等 animationend」包成回傳 Promise 的 animateCSS()，就能用 await 依序串接。右側時間取自 animationend 事件的 elapsedTime；同名動畫要連播兩次，得先移除 class 並強制 reflow。",
    hint: "切換三組通知序列，或按「播放」重跑目前這組",
    mount(ctx) {
      ctx.html(`<div class="pad s6"><div class="split">
        <div class="panel box stage"><div class="toast"><div class="ic"></div><div><b></b><span></span></div></div></div>
        <div class="panel box src"><div class="helper"></div><ul class="lines"></ul></div>
      </div></div>`);
      const stage = ctx.$(".stage"), toast = ctx.$(".toast"), lines = ctx.$(".lines");
      ctx.$(".helper").innerHTML = [
        "const animateCSS = (el, name) => new Promise((resolve) => {",
        '  el.classList.remove(...舊的 animate__*);  <em>// 先清掉</em>',
        '  void el.offsetWidth;                  <em>// 強制 reflow，同名才會重播</em>',
        '  el.classList.add("animate__animated", "animate__" + name);',
        '  el.addEventListener("animationend", resolve, { once: true });',
        "});",
      ].join("\n");
      let cur = 0, auto = true, token = 0, running = false, idleAt = performance.now() - 600;
      async function runSeq(i) {
        const my = ++token, s = SEQS[i];
        running = true;
        cur = i;
        [...seg.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
        stage.style.setProperty("--c", `var(${s.c})`);
        toast.style.setProperty("--c", `var(${s.c})`);
        toast.querySelector(".ic").textContent = s.icon;
        toast.querySelector("b").textContent = s.title;
        toast.querySelector("span").textContent = s.text;
        const rows = s.steps.map((n, k) => h("li", { class: k && s.steps[k - 1] === n ? "again" : "" },
          h("code", {}, "await animateCSS(card, ", h("b", { text: `"${n}"` }), ");"), h("span", { class: "t", text: "等待" })));
        lines.replaceChildren(h("li", {}, h("code", { text: `async function ${["notify", "loginError", "uploaded"][i]}() {` })), ...rows, h("li", {}, h("code", { text: "}" })));
        try {
          for (let k = 0; k < s.steps.length; k++) {
            rows[k].classList.add("run");
            rows[k].lastChild.textContent = "播放中";
            const e = await play(toast, s.steps[k]);

            rows[k].classList.replace("run", "ok");
            rows[k].lastChild.textContent = `elapsedTime ${e.elapsedTime.toFixed(2)}s`;

      const seg = ctx.group(SEQS.map((s) => s.label), 0, (i) => runSeq(i).catch(ignoreAbort));
      ctx.button("播放", () => runSeq(cur).catch(ignoreAbort), { primary: true });
      ctx.toggle("自動", true, (v) => { auto = v; idleAt = performance.now(); });
      ctx.interval(() => {
        if (!auto || running || performance.now() - idleAt < 1200) return;
        runSeq(token ? (cur + 1) % SEQS.length : 0).catch(ignoreAbort);
      }, 100);

  {
    id: "reduce", title: "減少動態效果",
    api: "@media (prefers-reduced-motion: reduce)；matchMedia()",
    desc: "使用者在系統開啟「減少動態效果」時，animate.css 內建規則把所有動畫縮成 1ms、只跑一圈，退場類直接透明。animationend 仍會觸發，所以 JS 串接不會卡住。網頁無法切換系統設定，右欄以 class 套用同一段規則模擬。",
    hint: "比較兩欄 animationend 的 elapsedTime；頂部顯示這台裝置目前的設定",
    mount(ctx) {
      const ROWS = [["tada", "注意力", "--c2", []], ["backInLeft", "進場", "--c4", []], ["backOutRight", "退場", "--c3", []], ["pulse", "infinite", "--c5", ["infinite"]]];
      const side = (cls, title, sub) => `<div class="panel box side ${cls}"><header><b>${title}</b><small>${sub}</small></header><div class="rows"></div></div>`;

      ctx.$(".rule").innerHTML = [
        "<b>@media print, (prefers-reduced-motion: reduce)</b> {",
        "  .animate__animated { animation-duration: 1ms !important; transition-duration: 1ms !important;",
        "                       animation-iteration-count: 1 !important; }",
        "  .animate__animated[class*='Out'] { opacity: 0; }",
        "}",
      ].join("\n");
      const mqEl = ctx.$(".mq");
      const mq = matchMedia("(prefers-reduced-motion: reduce)");
      const showMq = () => {
        mqEl.innerHTML = `這台裝置 <code>matchMedia("(prefers-reduced-motion: reduce)").matches</code> = <b>${mq.matches}</b>${mq.matches ? "，左欄也會被縮成 1ms" : "，左欄照常播放"}`;
      };
      ctx.on(mq, "change", showMq);
      showMq();
      const specs = [];
      for (const panel of ctx.$$(".side")) {
        const rows = panel.querySelector(".rows");
        for (const [name, zh, c, extra] of ROWS) {
          const spec = h("div", { class: "spec", style: `--c: var(${c})` });
          const res = h("div", { class: "res" });
          rows.append(h("div", { class: "row" }, h("div", { class: "well" }, spec), h("div", { class: "nm" }, h("b", { text: name }), h("small", { text: zh })), res));
          spec.info = { name, extra, res, loops: 0 };
          specs.push(spec);
        }
        ctx.on(rows, "animationiteration", (e) => {
          const i = e.target.info;
          if (i) i.res.textContent = `第 ${++i.loops} 圈`;
        });
        ctx.on(rows, "animationend", (e) => {
          const i = e.target.info;
          if (!i) return;
          i.res.textContent = `${i.extra.length ? "只跑 1 圈，" : ""}elapsedTime ${e.elapsedTime.toFixed(3)}s`;
          i.res.classList.add("ok");
        });
      }
      function restart() {
        for (const s of specs) {
          s.info.loops = 0;
          s.info.res.textContent = "播放中";
          s.info.res.classList.remove("ok");
          start(s, s.info.name, s.info.extra);
        }
      }
      ctx.button("重播", restart);
      ctx.interval(restart, 3200);
      restart();
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: 'tile.className = "animate__animated animate__infinite animate__tada"',
    desc: "N 個方塊同時跑 12 種注意力動畫，逐級加量直到低於 30 FPS。「infinite」完全交給瀏覽器；兩種 JS 重播都在 animationend 後移除 class、讀 offsetWidth 強制 reflow 再加回，差在「逐一」每個元素各 reflow 一次，「批次」把同一格結束的元素合併成一次。",
    hint: "按「自動加壓」逐級加量；下方切換 infinite、逐一重播、批次重播",
    mount(ctx) {
      ctx.html(`<div class="stress-x"><div class="sgrid"></div></div>`);
      const box = ctx.$(".stress-x"), grid = ctx.$(".sgrid");
      const MODES = ["infinite（CSS）", "逐一重播", "批次重播"];
      const queue = new Set();
      let tiles = [], mode = 0, n = 0, restarts = 0, reflows = 0, jsMs = 0, stats = { rate: 0, rf: 0, cost: 0 }, winAt = performance.now();
      const layout = () => {
        if (!tiles.length) return;
        const W = box.clientWidth - 16, H = box.clientHeight - 16;
        const cols = Math.max(1, Math.round(Math.sqrt((tiles.length * W) / H)));
        const rows = Math.ceil(tiles.length / cols);
        const cell = Math.min(W / cols, H / rows);
        const gap = cell >= 10 ? 2 : 1;
        grid.style.setProperty("--cols", cols);
        grid.style.setProperty("--gap", `${gap}px`);
        grid.style.setProperty("--sz", `${Math.max(1, Math.floor(cell) - gap)}px`);
      };
      const build = () => {
        tiles = Array.from({ length: n }, (_, i) => {
          const name = ATTN[i % ATTN.length];
          const t = document.createElement("i");
          t.className = `${P}animated ${P}${name}${mode === 0 ? ` ${P}infinite` : ""}`;
          t.dataset.a = name;
          t.style.background = `hsl(${(20 + (i / n) * 300).toFixed(1)} 72% 60%)`;
          // A negative delay spreads the start phases so the tiles do not pulse in lockstep.
          t.style.animationDelay = `-${(Math.random() * 0.9).toFixed(2)}s`;
          return t;
        });
        grid.replaceChildren(...tiles);
        queue.clear();
        restarts = reflows = jsMs = 0;
        winAt = performance.now();
        layout();
      };
      ctx.on(grid, "animationend", (e) => {
        const t = e.target;
        if (mode === 0 || t.parentNode !== grid) return;
        t.style.animationDelay = "";
        if (mode === 2) { queue.add(t); return; }
        // Naive restart: one forced reflow per finished element.
        const t0 = performance.now();
        t.classList.remove(P + t.dataset.a);
        void t.offsetWidth;
        t.classList.add(P + t.dataset.a);
        jsMs += performance.now() - t0;
        restarts++;
        reflows++;
      });
      // Batched restart: everything that ended since the last frame shares one reflow.
      ctx.raf(() => {
        if (!queue.size) return;
        const t0 = performance.now();
        for (const t of queue) t.classList.remove(P + t.dataset.a);
        void grid.offsetWidth;
        for (const t of queue) t.classList.add(P + t.dataset.a);
        jsMs += performance.now() - t0;
        restarts += queue.size;
        reflows++;
        queue.clear();
      });
      ctx.interval(() => {
        const now = performance.now(), dt = (now - winAt) / 1000;
        stats = { rate: restarts / dt, rf: reflows / dt, cost: jsMs / dt };
        restarts = reflows = jsMs = 0;
        winAt = now;
      }, 1000);
      ctx.onResize(layout);
      ctx.group(MODES, 0, (i) => { mode = i; build(); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "同時動畫的元素", unit: "個", steps: [250, 500, 1000, 2000, 4000, 8000, 16000, 32000],
        initial: 2, minFps: 30, warmup: 1000, sample: 2000,
        apply(v) { n = v; build(); },
        metrics: () => ({
          "執行中動畫": grid.getAnimations({ subtree: true }).length,
          "重播／秒": mode ? Math.round(stats.rate) : "－",
          "reflow／秒": mode ? Math.round(stats.rf) : "－",
          "重播 JS": mode ? `${stats.cost.toFixed(1)} ms/s` : "－",
        }),
        note: "animate.css 的關鍵影格只動 transform 與 opacity，可交給合成器，主執行緒負擔主要是樣式計算與圖層數量。「逐一重播」每個 animationend 都讀一次 offsetWidth，每秒強制排版約 N 次、每次又要排 N 個元素，成本接近 N²；「批次重播」每格最多一次 reflow，成本只隨 N 線性增加。",
      });
    },
  },
] });
</script>
</body>
</html>
