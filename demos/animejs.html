<style>

<body>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Anime.js v4 showcase: grid staggers, labelled timelines, SVG drawing / motion path / morphing,
// springs, draggables, three keyframe syntaxes, layout animation and an animation-count stress ramp.
const { animate, createTimeline, createDraggable, createLayout, createScope, stagger, spring, svg, scrambleText, waapi, random, shuffle, steps, utils } = anime;

const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const MUTED = css.getPropertyValue("--muted").trim(), ACCENT = css.getPropertyValue("--accent").trim(), MONO = css.getPropertyValue("--mono").trim();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Animations, timelines and layouts created inside run() register in one anime Scope,
// so unmounting the scene reverts all of them with scope.revert().
// A Scope keeps every revertible it ever registered, so things recreated on a timer
// (morph steps, spring replays, drag scatter, stress fills) are tracked by hand instead.
function scope(ctx) {
  const s = createScope({ root: ctx.el });
  ctx.onCleanup(() => s.revert());
  return (fn) => s.execute(fn);
}

// Re-run fn when a measured element changes size. ctx.onResize only watches the scene itself,
// and the control bar height is published asynchronously after mount, which shrinks inner boxes.
function fit(ctx, el, fn) {
  let lw = el.clientWidth, lh = el.clientHeight, pending = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      if (el.clientWidth === lw && el.clientHeight === lh) return;
      lw = el.clientWidth;
      lh = el.clientHeight;
      fn();
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); });
}

const starPath = () => {
  const pts = Array.from({ length: 10 }, (_, i) => {
    const a = -Math.PI / 2 + (i * Math.PI) / 5, r = i % 2 ? 38 : 88;
    return `${(100 + r * Math.cos(a)).toFixed(1)},${(106 + r * Math.sin(a)).toFixed(1)}`;
  });
  return `M${pts.join(" L")} Z`;
};
const HEART = "M100,48 C106,36 116,26 132,26 C156,26 178,44 178,72 C178,112 142,140 100,172 C58,140 22,112 22,72 C22,44 44,26 68,26 C84,26 94,36 100,48 Z";
// Every outline starts near the top and runs clockwise, so morphTo() pairs matching points.
const MORPHS = [
  ["圓形", "M100,20 C144.2,20 180,55.8 180,100 C180,144.2 144.2,180 100,180 C55.8,180 20,144.2 20,100 C20,55.8 55.8,20 100,20 Z", C[5]],
  ["星形", starPath(), C[0]],
  ["月亮", "M154.6,36.2 A64,64 0 0 0 154.6,163.8 A74,74 0 1 1 154.6,36.2 Z", C[1]],
  ["閃電", "M116,14 L140,14 L104,82 L146,82 L82,186 L98,112 L56,112 Z", C[4]],
  ["愛心", HEART, C[2]],
];
const RIDGES = [
  ["M0,170 L40,140 L80,155 L130,110 L170,135 L210,95 L260,125 L300,100 L350,130 L400,115", C[5]],
  ["M10,250 L120,140 L170,160 L240,60 L300,130 L340,115 L400,180", C[1]],
  ["M0,230 C60,200 100,215 150,205 S260,190 300,215 S370,225 400,210", C[3]],
];
const TRAIL = "M70,238 L150,215 L110,195 L185,180 L168,168 L225,140 L205,118 L245,100 L232,82 L240,62";
const PEAKS = [["玉山", 3952, "百岳"], ["雪山", 3886, "百岳"], ["秀姑巒山", 3825, "百岳"], ["南湖大山", 3742, "百岳"], ["中央尖山", 3705, "百岳"], ["關山", 3668, "百岳"],
  ["奇萊主山", 3560, "百岳"], ["大霸尖山", 3492, "百岳"], ["合歡山", 3417, "百岳"], ["北大武山", 3092, "百岳"], ["七星山", 1120, "郊山"], ["觀音山", 616, "郊山"]];

Showcase.run({ scenes: [
  {
    id: "grid", title: "交錯網格",
    api: "animate(dots, { scale, delay: stagger(80, { grid: [cols, rows], from }) })",
    desc: "同一個 animate() 套用到整片圓點，stagger() 的 grid 依二維距離算出每顆的延遲，from 決定波從哪一格出發；位移波再用 axis 拆出 x、y 方向的偏移量，打開隨機抖動會加上 jitter，讓延遲隨距離帶一點不規則。",
    hint: "點任一顆圓點，從那裡擴散",
    mount(ctx) {
      ctx.html(`<div class="board g1"><code class="tag"></code><div class="dots"></div></div>`);
      const run = scope(ctx);
      const box = ctx.$(".dots"), chip = ctx.$(".tag");
      let cols = 0, rows = 0, from = 0, mode = 0, jitter = false, anim = null, dots = [];
      function play() {
        if (anim) anim.revert();
        const grid = [cols, rows];
        const delay = stagger(80, { grid, from, ...(jitter && { jitter: [0, 160], seed: 7 }) });
        const loop = { delay, loop: true, loopDelay: 200 };
        run(() => {
          if (mode === 0) {
            anim = animate(dots, {
              scale: [{ to: 2.2, duration: 450, ease: "outSine" }, { to: 1, duration: 650, ease: "inOutSine" }],
              opacity: [{ to: 1, duration: 450 }, { to: 0.5, duration: 650 }], ...loop,
            });
          } else if (mode === 1) {
            anim = animate(dots, {
              translateX: [{ to: stagger(-7, { grid, from, axis: "x" }), duration: 500, ease: "inOutQuad" }, { to: 0, duration: 700, ease: "outBack(2)" }],
              translateY: [{ to: stagger(-7, { grid, from, axis: "y" }), duration: 500, ease: "inOutQuad" }, { to: 0, duration: 700, ease: "outBack(2)" }],
              scale: [{ to: 0.45, duration: 500 }, { to: 1, duration: 700 }],
              opacity: [{ to: 1, duration: 500 }, { to: 0.5, duration: 700 }], ...loop,
            });
          } else {
            anim = animate(dots, {
              rotateY: [{ to: 180, duration: 500, ease: "inOutSine" }, { to: 0, duration: 500, ease: "inOutSine" }],
              borderRadius: [{ to: "18%", duration: 500 }, { to: "50%", duration: 500 }],
              opacity: [{ to: 1, duration: 500 }, { to: 0.5, duration: 500 }], ...loop,
            });
          }
        });
        chip.textContent = `delay: stagger(80, { grid: [${cols}, ${rows}], from: ${from}${mode === 1 ? ", axis" : ""}${jitter ? ", jitter: [0, 160]" : ""} })`;
      }
      function build() {
        const { width: w, height: h } = box.getBoundingClientRect();
        const cell0 = clamp(Math.floor(Math.sqrt((w * h) / 380)), 18, 34);
        cols = Math.max(6, Math.floor(w / cell0));
        rows = Math.max(4, Math.floor(h / cell0));
        const cell = Math.max(8, Math.min(cell0, Math.floor(w / cols), Math.floor(h / rows)));
        box.style.gridTemplateColumns = `repeat(${cols}, ${cell}px)`;
        box.style.gridAutoRows = `${cell}px`;
        box.innerHTML = Array.from({ length: cols * rows }, (_, i) => {
          const t = ((i % cols) / cols + Math.floor(i / cols) / rows) / 2;
          return `<b data-i="${i}"><i style="--col:oklch(76% 0.16 ${Math.round(200 + t * 250) % 360})"></i></b>`;
        }).join("");
        dots = ctx.$$(".dots i");
        from = Math.floor(rows / 2) * cols + Math.floor(cols / 2);
        play();
      }
      ctx.group(["漣漪", "位移波", "翻轉"], 0, (i) => { mode = i; play(); });
      ctx.toggle("隨機抖動", false, (v) => { jitter = v; play(); });
      ctx.button("重播", play, { primary: true });
      ctx.on(box, "click", (e) => {
        const b = e.target.closest("b");
        if (!b) return;
        from = +b.dataset.i;
        play();
      });
      fit(ctx, box, build);
      build();
    },
  },
  {
    id: "timeline", title: "時間軸",
    api: "createTimeline().label('開門', '+=150').add(pax, { … }, stagger(110, { start: '上車', from: 'center' }))",
    desc: "一條 createTimeline() 編排整段進站流程：label() 標出進站、開門、上車、出站，add() 的位置參數用標籤加位移（'開門+=500'、'+=150'）決定每段何時開始；乘客上車用 stagger() 當位置參數，從中間往兩側錯開，看板文字用 scrambleText() 亂碼轉場。",
    hint: "點標籤跳到該段，拖曳進度條逐格檢視",
    mount(ctx) {
      const MSG = ["列車進站中，請勿越過黃線", "請先下後上，注意月台間隙", "下一班列車約 4 分鐘後進站"];
      ctx.html(`<div class="board st2">
        <div class="sign"><span class="msg">${MSG[2]}</span></div>
        <div class="track"><div class="rail"></div><div class="platform"></div>
          <div class="train"><span class="wins"></span><span class="stripe"></span>${'<span class="door"><s></s><s></s></span>'.repeat(3)}</div>
          ${Array.from({ length: 9 }, (_, i) => `<i class="pax" style="background:${C[i % 6]}"></i>`).join("")}
        </div>
        <div class="panel tlbar"><header><span class="labels">${["進站", "開門", "上車", "出站"].map((n) => `<button class="lbl" type="button">${n}</button>`).join("")}</span><span class="t">0.00 s</span></header><div class="scrub"><i class="fill"></i></div></div>
      </div>`);
      const run = scope(ctx);
      const track = ctx.$(".track"), train = ctx.$(".train"), rail = ctx.$(".rail"), msg = ctx.$(".msg");
      const doors = ctx.$$(".door"), leaves = ctx.$$(".door s"), pax = ctx.$$(".pax");
      const scrub = ctx.$(".scrub"), timeEl = ctx.$(".tlbar .t"), labelsEl = ctx.$(".labels");
      const P = 30, DOORS = [0.2, 0.5, 0.8];
      // Label chips are in the markup from the start so the track is measured at its final height.
      let tl = null;
      const chips = ctx.$$(".lbl");
      const paint = () => {
        if (!tl) return;
        const d = tl.iterationDuration, t = tl.iterationCurrentTime;
        scrub.style.setProperty("--p", (t / d).toFixed(4));
        timeEl.textContent = `${(t / 1000).toFixed(2)} / ${(d / 1000).toFixed(2)} s`;
        let on = 0;
        Object.values(tl.labels).forEach((v, i) => { if (t >= v) on = i; });
        chips.forEach((c, i) => c.classList.toggle("on", i === on));
      };
      function build() {
        const prev = tl && { t: tl.iterationCurrentTime, paused: tl.paused, speed: tl.speed, rev: tl.reversed };
        if (tl) tl.revert();
        const TW = track.clientWidth, TH = track.clientHeight;

            animate(heart, {

              duration: 1100, ease: "inOutSine", loop: true, playbackEase,
            }),
            animate(box, {
              keyframes: [
                { x: bw, rotate: 90, backgroundColor: C[1] }, { y: bh, rotate: 180, backgroundColor: C[2] },
                { x: 0, rotate: 270, backgroundColor: C[3] }, { y: 0, rotate: 360, backgroundColor: C[0] },
              ],
              duration: 2400, ease: "inOutQuad", loop: true, playbackEase,
            }),
          ];
          anims.forEach((a) => { a.speed = speed; });
        });
      }
      ctx.group(["線性播放", "inOut(3)", "steps(8)"], 0, (i) => { pe = i; build(); });
      ctx.slider("速度", { min: 0.25, max: 2, step: 0.25, value: 1, format: (v) => `${v}×` }, (v) => {
        speed = v;
        anims.forEach((a) => { a.speed = v; });
        showBpm();
      });
      fit(ctx, ctx.$(".trio"), build);
      showBpm();
      build();
    },
  },
  {
    id: "layout", title: "版面動畫",
    api: "const layout = createLayout(root, { enterFrom, leaveTo }); layout.update(() => change())",
    desc: "createLayout() 先記錄容器內每個元素的位置與尺寸，update() 裡改 class、DOM 順序或 display 之後，自動從舊版面補間到新版面；設成 display: none 的卡片走 leaveTo 退場，重新顯示的走 enterFrom 進場。",
    hint: "切換卡片與清單、篩選分類，或打亂順序",
    mount(ctx) {
      const COL = { 百岳: C[1], 郊山: C[3] };
      ctx.html(`<div class="board"><div class="peaks">${PEAKS.map(([n, hgt, cat]) => `<div class="peak" data-cat="${cat}" data-h="${hgt}" style="--c:${COL[cat]}">
        <b>${n}</b><small>${hgt.toLocaleString()} m・${cat}</small><span class="bar"><i style="width:${((hgt / 3952) * 100).toFixed(1)}%"></i></span></div>`).join("")}</div></div>`);
      const run = scope(ctx);
      const root = ctx.$(".peaks"), cards = ctx.$$(".peak");
      let layout = null, asc = false;
      run(() => {
        layout = createLayout(root, { duration: 500, enterFrom: { opacity: 0, transform: "scale(.6)" }, leaveTo: { opacity: 0, transform: "scale(.6)" } });
      });
      const change = (fn) => layout.update(fn);
      const mix = () => change(() => root.append(...shuffle([...root.children])));
      ctx.group(["卡片", "清單"], 0, (i) => change(() => root.classList.toggle("list", i === 1)));
      ctx.group(["全部", "百岳", "郊山"], 0, (i) => change(() => {
        const cat = ["", "百岳", "郊山"][i];
        cards.forEach((el) => { el.style.display = !cat || el.dataset.cat === cat ? "" : "none"; });
      }));
      ctx.button("打亂順序", mix, { primary: true });
      ctx.button("依高度排序", () => {
        asc = !asc;
        change(() => root.append(...[...root.children].sort((a, b) => (asc ? 1 : -1) * (a.dataset.h - b.dataset.h))));
      });
      ctx.timeout(mix, 500);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "animate(els, { x, y, loop: true, alternate: true }) | waapi.animate(els, { transform }) × N",
    desc: "一次 animate() 讓 N 個方塊各自無限往返，逐級加量直到掉到 30 FPS 以下；切換成 waapi.animate()（交給瀏覽器原生動畫）或 left／top（版面屬性）再測一次，比較三種寫法的成本。",
    hint: "按「自動加壓」開始；切換模式後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="stress-box"></div>`);
      const box = ctx.$(".stress-box");
      const MODES = ["JS 變形", "WAAPI", "JS 版面"];
      let mode = 0, count = 0, cur = null;
      const clear = () => { if (cur) cur.revert(); cur = null; box.textContent = ""; };
      function fill(n) {
        clear();
        count = n;
        const W = box.clientWidth, H = box.clientHeight, frag = document.createDocumentFragment(), els = [];
        for (let i = 0; i < n; i++) {
          const el = document.createElement("i");
          el.style.cssText = `background:${C[i % 6]};left:${(Math.random() * (W - 8)).toFixed(1)}px;top:${(Math.random() * (H - 8)).toFixed(1)}px`;
          frag.append(el);
          els.push(el);
        }
        box.append(frag);
        if (!n) return;
        // Stress animations stay outside any Scope; clear() reverts the previous batch before the next one.
        const common = { duration: () => random(800, 2000), ease: "inOutSine", loop: true, alternate: true };
        if (mode === 0) cur = animate(els, { x: () => random(-50, 50), y: () => random(-50, 50), ...common });
        else if (mode === 1) cur = waapi.animate(els, { transform: ["translate(0px, 0px)", () => `translate(${random(-50, 50)}px, ${random(-50, 50)}px)`], ...common });
        else cur = animate(els, { left: () => `+=${random(-50, 50)}`, top: () => `+=${random(-50, 50)}`, ...common });
      }
      ctx.onCleanup(clear);
      ctx.group(["animate() transform", "waapi.animate()", "animate() left／top"], 0, (i) => { mode = i; fill(count); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "動畫元素", steps: [250, 500, 1000, 2000, 4000, 8000, 16000], minFps: 30,
        apply: fill,
        metrics: () => ({
          "模式": MODES[mode],
          "計算者": mode === 1 ? "瀏覽器" : "JS",
          "補間數": mode === 1 ? count : count * 2,
        }),
        note: "animate() 每一格都在 JS 主執行緒算完所有補間再寫回樣式；waapi.animate() 把關鍵影格交給瀏覽器，transform 可以在合成器執行，這裡量的 FPS 是主執行緒的 rAF，所以會偏高，不代表畫面一定同樣順。left／top 是版面屬性，每一格都要重新計算版面，元素越多越慢。",
      });
      fill(250);
    },
  },
] });
</script>
</body>
