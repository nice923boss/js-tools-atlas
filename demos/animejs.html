<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime.js 示範：交錯網格漣漪</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .stage { padding: 60px 16px 60px; }
  .grid { display: grid; gap: 0; }
  .dot {
    width: var(--cell); height: var(--cell); display: grid; place-items: center; cursor: pointer;
  }
  .dot i {
    display: block; width: 46%; height: 46%; border-radius: 50%;
    background: var(--col); opacity: .5;
  }
  .code {
    position: fixed; left: 12px; top: 12px; z-index: 50; padding: 6px 10px; font-size: 12px;
    color: var(--muted); max-width: calc(100% - 24px);
  }
  .code b { color: var(--accent); font-weight: 600; }
  .controls { top: auto; bottom: 12px; }
  @media (max-width: 560px) { .stage { padding: 16px 12px 96px; } .controls { bottom: 46px; } .code { display: none; } }
</style>
</head>
<body>
<div class="panel code mono" id="code">stagger(<b>80</b>, { grid: [<b id="gc">0</b>, <b id="gr">0</b>], from: <b id="gf">0</b> })</div>
<div class="stage"><div class="grid" id="grid"></div></div>
<div class="controls">
  <button class="btn" data-mode="ripple" aria-pressed="true">漣漪</button>
  <button class="btn" data-mode="wave" aria-pressed="false">位移波</button>
  <button class="btn" data-mode="spin" aria-pressed="false">翻轉</button>
  <button class="btn primary" id="replay">重播</button>
</div>
<div class="hint">點任一顆圓點，從那裡擴散交錯動畫</div>

<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
<script>
// Grid stagger: every animation's delay is computed by stagger({ grid, from }).
const { animate, stagger } = anime;
const gridEl = document.getElementById("grid");
let cols = 0, rows = 0, mode = "ripple", lastFrom = 0, current = null;

function build() {
  const narrow = innerWidth <= 560;
  const w = innerWidth - (narrow ? 24 : 32), h = innerHeight - (narrow ? 112 : 120);
  const cell = Math.max(18, Math.min(34, Math.floor(Math.sqrt((w * h) / 380))));
  cols = Math.max(6, Math.floor(w / cell));
  rows = Math.max(6, Math.floor(h / cell));
  gridEl.style.setProperty("--cell", `${cell}px`);
  gridEl.style.gridTemplateColumns = `repeat(${cols}, ${cell}px)`;
  gridEl.innerHTML = "";
  for (let i = 0; i < cols * rows; i++) {
    const x = i % cols, y = Math.floor(i / cols);
    const t = (x / cols + y / rows) / 2;
    const d = document.createElement("div");
    d.className = "dot";
    d.innerHTML = `<i style="--col:oklch(76% 0.16 ${Math.round(200 + t * 250) % 360})"></i>`;
    d.addEventListener("click", () => play(i));
    gridEl.append(d);
  }
  document.getElementById("gc").textContent = cols;
  document.getElementById("gr").textContent = rows;
}

// Each animation loops forever; per-target stagger delays replay every loop, so a wave
// is always travelling across the grid.
function play(from) {
  lastFrom = from;
  document.getElementById("gf").textContent = from;
  if (current) current.revert();
  const grid = [cols, rows];
  const loop = { loop: true, loopDelay: 200 };
  const dots = gridEl.querySelectorAll(".dot i");
  if (mode === "ripple") {
    current = animate(dots, {
      scale: [{ to: 2.2, duration: 450, ease: "outSine" }, { to: 1, duration: 650, ease: "inOutSine" }],
      opacity: [{ to: 1, duration: 450 }, { to: 0.5, duration: 650 }],
      delay: stagger(80, { grid, from }),
      ...loop,
    });
  } else if (mode === "wave") {
    current = animate(dots, {
      translateX: [{ to: stagger(-7, { grid, from, axis: "x" }), duration: 500, ease: "inOutQuad" }, { to: 0, duration: 700, ease: "outBack(2)" }],
      translateY: [{ to: stagger(-7, { grid, from, axis: "y" }), duration: 500, ease: "inOutQuad" }, { to: 0, duration: 700, ease: "outBack(2)" }],
      scale: [{ to: 0.45, duration: 500 }, { to: 1, duration: 700 }],
      opacity: [{ to: 1, duration: 500 }, { to: 0.5, duration: 700 }],
      delay: stagger(80, { grid, from }),
      ...loop,
    });
  } else {
    current = animate(dots, {
      rotateY: [{ to: 180, duration: 500, ease: "inOutSine" }, { to: 0, duration: 500, ease: "inOutSine" }],
      borderRadius: [{ to: "18%", duration: 500 }, { to: "50%", duration: 500 }],
      opacity: [{ to: 1, duration: 500 }, { to: 0.5, duration: 500 }],
      delay: stagger(70, { grid, from }),
      ...loop,
    });
  }
}

document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  play(lastFrom);
}));
document.getElementById("replay").addEventListener("click", () => play(lastFrom));

let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { current = null; build(); play(Math.min(lastFrom, cols * rows - 1)); }, 150); });

build();
play(Math.floor(rows / 2) * cols + Math.floor(cols / 2));
</script>
</body>
</html>
