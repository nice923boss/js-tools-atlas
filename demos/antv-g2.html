<script>
// AntV G2 5 showcase: one grammar of graphics (mark + transform + coordinate + composition) across eight scenes.
const THEME = { type: "classicDark", view: { viewFill: "transparent" } };
const th = (spec) => ({ theme: THEME, ...spec }); // composite children (spaceFlex, timingKeyframe) do not inherit the theme
const nf = new Intl.NumberFormat("zh-TW");
const compact = (v) => Showcase.fmtCompact(v).replace(" ", "");
function rng(seed) { let s = seed % 2147483647 || 1; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }
const gauss = (r) => r() + r() + r() - 1.5;

// Create a G2 chart that fits its container and is destroyed exactly once.
function g2(ctx, el, spec, onResize) {
  const chart = new G2.Chart({ container: el, autoFit: true });
  chart.options({ theme: THEME, ...spec });
  let alive = true, w = el.clientWidth, h = el.clientHeight;
  // autoFit only listens to window resize; the control bar and stage changes resize the host without one.
  const ro = new ResizeObserver(() => {
    if (!alive || (el.clientWidth === w && el.clientHeight === h)) return;
    w = el.clientWidth; h = el.clientHeight;
    if (onResize) onResize(); else chart.forceFit();
  });
  ro.observe(el);
  chart.kill = () => { if (alive) { alive = false; ro.disconnect(); chart.destroy(); } };
  ctx.onCleanup(chart.kill);
  chart.ready = chart.render();
  chart.ready.catch((e) => { if (alive) console.error("G2 render failed", e); });
  return chart;
}
// A host that swaps its chart whenever the spec changes.
function slot(ctx, el, onResize) {
  let chart = null;
  return (spec) => { if (chart) chart.kill(); chart = g2(ctx, el, spec, onResize); return chart; };
}
const wrapHTML = (title, sub, extra = "") => `<div class="g2-wrap"><div class="g2-head"><h2>${title}</h2><p>${sub}</p></div>${extra}<div class="g2-host"><div></div></div><div class="g2-read"></div></div>`;
const cardHTML = (mark, sub) => `<div class="panel g2-card"><div class="g2-tag"><code>${mark}</code><small>${sub}</small></div><div class="g2-host"><div></div></div></div>`;

// ---------- scene 1: MRT ridership x rainfall (ported from the original demo) ----------
const LINES = ["板南線", "淡水信義線", "松山新店線", "中和新蘆線", "文湖線"];
const LINE_COLORS = ["#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#c9a66b"];
const BASE = [4300, 3900, 2300, 2400, 1500]; // illustrative monthly ridership (10k trips)
const SEASON = [0.93, 0.82, 1.0, 0.98, 1.02, 0.99, 0.95, 0.94, 1.0, 1.04, 1.03, 1.06];
const RAIN = [95, 170, 180, 180, 250, 320, 240, 320, 360, 150, 90, 75];
const MONTHS = SEASON.map((_, i) => `${i + 1}月`);
const RIDES = LINES.flatMap((line, li) => MONTHS.map((month, mi) => ({
  month, line, value: Math.round(BASE[li] * SEASON[mi] * (1 + Math.sin(li * 3 + mi) * 0.03)),
})));
const MONTH_TOTAL = Object.fromEntries(MONTHS.map((m) => [m, RIDES.filter((d) => d.month === m).reduce((a, d) => a + d.value, 0)]));
const RAIN_ROWS = MONTHS.map((month, i) => ({ month, rain: RAIN[i] }));
const RIDE_MODES = [
  { label: "堆疊", grammar: "interval + stackY + line", transform: "stackY" },
  { label: "並排", grammar: "interval + dodgeX + line", transform: "dodgeX" },
  { label: "極座標", grammar: "interval + stackY + polar", transform: "stackY", polar: true },
  { label: "轉置", grammar: "interval + stackY + transpose", transform: "stackY", transposed: true },
];
function rideSpec(mode, withRain, narrow) {
  const { polar, transposed } = mode;
  const bars = {
    type: "interval", data: RIDES,
    encode: { x: "month", y: "value", color: "line" },
    transform: [{ type: mode.transform }],
    scale: { color: { domain: LINES, range: LINE_COLORS }, y: { nice: true } },
    style: polar ? { stroke: "#0e1013", lineWidth: 1 } : { radiusTopLeft: 3, radiusTopRight: 3, columnWidthRatio: 0.72 },
    axis: polar ? { x: { title: false, grid: true }, y: { title: false, label: false, grid: true } }
      : { x: { title: false, labelAutoRotate: false, labelFormatter: (d) => (narrow ? d.replace("月", "") : d) },
          y: { title: "運量（萬人次）", grid: true, labelFormatter: (v) => nf.format(v) } },
    legend: { color: { position: "top", layout: { justifyContent: "center" }, itemMarker: "circle", itemLabelFill: "#ecebe6" } },
    tooltip: { items: [{ channel: "y", name: "運量", valueFormatter: (v) => `${nf.format(v)} 萬` }] },
    animate: { enter: { type: polar ? "waveIn" : "growInY", duration: 800 } },
    state: { inactive: { opacity: 0.35 } },
    interaction: { elementHighlightByColor: true },
  };
  const children = [bars];
  if (withRain && !polar && !transposed) {
    const rainY = { y: { key: "rain", independent: true, domain: [0, 400] } };
    children.push({
      type: "line", data: RAIN_ROWS,
      encode: { x: "month", y: "rain", shape: "smooth" },
      scale: rainY,
      axis: { y: { position: "right", title: narrow ? false : "雨量（mm）", grid: false } },
      style: { stroke: "#f7df1e", lineWidth: 2.5 },
      tooltip: { items: [{ channel: "y", name: "雨量", valueFormatter: (v) => `${v} mm` }] },
    }, {
      type: "point", data: RAIN_ROWS,
      encode: { x: "month", y: "rain", shape: "circle", size: 4 },
      scale: rainY,
      axis: { y: false },
      style: { fill: "#0e1013", stroke: "#f7df1e", lineWidth: 2 },
      labels: narrow ? [] : [{ text: "rain", dy: -12, fill: "#f7df1e", fontSize: 10 }],
      tooltip: false,
    });
  }
  return {
    type: "view",
    paddingRight: polar ? 10 : undefined,
    coordinate: polar ? { type: "polar", innerRadius: 0.18 } : transposed ? { transform: [{ type: "transpose" }] } : { type: "cartesian" },
    children,
  };
}

// ---------- shared data: rentals (scenes 2, 4, 5, 7) ----------
const CITIES = ["台北", "台中", "高雄", "台南"];
const CITY_COLORS = ["#4cc9f0", "#7bd389", "#ff8c42", "#f72585"];
const CITY_SCALE = { domain: CITIES, range: CITY_COLORS };
const PER_PING = { 台北: 1150, 台中: 620, 高雄: 560, 台南: 520 };
function makeFlats(r, n) {
  return Array.from({ length: n }, () => {
    const 城市 = CITIES[Math.floor(r() * 4)];
    const 坪數 = +(6 + r() ** 1.4 * 34).toFixed(1);
    const 屋齡 = Math.round(r() * 45);
    const 月租 = Math.round((坪數 * PER_PING[城市] * (1.12 - 屋齡 / 150) * (0.85 + r() * 0.3)) / 100) * 100;
    return { 城市, 坪數, 月租, 屋齡, 樓層: 1 + Math.floor(r() * 20) };
  });
}
const FLATS = makeFlats(rng(11), 200);

// ---------- scene 2: one card per advanced mark ----------
const WEEK = ["一", "二", "三", "四", "五", "六", "日"];
const FOODS = ["珍珠奶茶", "滷肉飯", "雞排", "臭豆腐", "牛肉麵", "小籠包", "鹽酥雞", "蚵仔煎", "豆花", "芒果冰", "胡椒餅", "大腸包小腸", "肉圓", "割包"];
const GALLERY = [
  { mark: "cell", sub: "捷運日運量月曆",
    data: (r) => Array.from({ length: 15 * 7 }, (_, i) => {
      const w = Math.floor(i / 7), d = i % 7;
      return { 週: w + 1, 星期: WEEK[d], 運量: Math.round((d >= 5 ? 125 : 205) * (0.88 + r() * 0.24) * (w === 6 && d < 5 ? 0.62 : 1)) };
    }),
    spec: (data, small) => ({ type: "cell", data, encode: { x: "週", y: "星期", color: "運量" }, scale: { color: { palette: "magma" } },
      style: { inset: 1, radius: 2 }, axis: small ? false : { x: false, y: { title: false, tick: false } }, legend: false }) },
  { mark: "boxplot", sub: "四城套房月租",
    data: (r) => makeFlats(r, 160),
    spec: (data, small) => ({ type: "boxplot", data, encode: { x: "城市", y: "月租", color: "城市" }, scale: { color: CITY_SCALE },
      style: { boxFillOpacity: 0.35, pointR: 2 }, axis: { x: { title: false, labelAutoRotate: false, labelFontSize: small ? 9 : 11 }, y: small ? false : { title: false, labelFormatter: (v) => `${v / 1000}k` } }, legend: false }) },
  { mark: "link", sub: "通車前後通勤分鐘",
    data: (r) => ["淡海", "安坑", "三鶯", "萬大"].map((a) => ({ 地區: a, 通車前: Math.round(58 + r() * 22), 通車後: Math.round(30 + r() * 14) })),
    spec: (data, small) => ({ type: "link", data, encode: { x: ["通車前", "通車後"], y: "地區", color: "地區" }, scale: { x: { domain: [20, 85] }, color: { range: CITY_COLORS } },
      style: { arrow: true, arrowSize: small ? 5 : 8, lineWidth: 2.5 }, axis: { x: small ? false : { title: false, labelAutoRotate: false, tickCount: 4, labelFormatter: (v) => `${v}分` }, y: { title: false } }, legend: false }) },
  { mark: "wordCloud", sub: "夜市小吃聲量",
    data: (r) => FOODS.map((text) => ({ text, value: Math.round(15 + r() ** 2 * 85) })),
    spec: (data, small) => ({ type: "wordCloud", data, layout: { spiral: "rectangular", fontSize: small ? [9, 20] : [12, 32], rotate: 0, padding: 2 },
      encode: { color: "text" }, legend: false }) },
  { mark: "sankey", sub: "電源到用電部門",
    data: (r) => ({ value: { links: [
      ["燃氣", "工業", 28], ["燃氣", "住宅", 12], ["燃氣", "服務業", 10], ["燃煤", "工業", 30], ["燃煤", "住宅", 8],
      ["再生能源", "工業", 6], ["再生能源", "服務業", 6], ["核能", "住宅", 5], ["核能", "服務業", 3],
    ].map(([source, target, v]) => ({ source, target, value: Math.round(v * (0.6 + r() * 0.8)) })) } }),
    spec: (data, small) => ({ type: "sankey", data, layout: { nodeAlign: "justify", nodePadding: 0.05 },
      style: { labelFill: "#ecebe6", labelFontSize: small ? 9 : 11, linkFillOpacity: 0.35, nodeLineWidth: 0 }, legend: false }) },
  { mark: "treemap", sub: "家庭月支出",
    data: (r) => ({ value: { name: "支出", children: [["食", ["外食", "食材"]], ["住", ["房租", "水電"]], ["行", ["交通", "油錢"]], ["樂", ["旅遊", "訂閱"]]]
      .map(([name, kids]) => ({ name, children: kids.map((k) => ({ name: k, value: Math.round(2000 + r() * 12000) })) })) } }),
    spec: (data, small) => ({ type: "treemap", data, layout: { tile: "treemapBinary", paddingInner: 2 }, encode: { value: "value" },
      style: { labelFill: "#0e1013", labelFontSize: small ? 9 : 11 }, legend: false }) },
  { mark: "liquid", sub: "水庫蓄水率",
    data: (r) => +(0.25 + r() * 0.6).toFixed(2),
    spec: (data, small) => ({ type: "liquid", data, style: { outlineBorder: small ? 2 : 3, outlineDistance: small ? 2 : 4, waveLength: small ? 50 : 90,
      fill: "#4cc9f0", outlineStroke: "#4cc9f0", contentFill: "#ecebe6", contentStroke: "#0e1013", contentLineWidth: 3, contentFontSize: small ? 14 : 22 } }) },
  { mark: "gauge", sub: "尖峰用電負載",
    data: (r) => ({ value: { target: Math.round(45 + r() * 50), total: 100, name: "負載", thresholds: [60, 85, 100] } }),
    spec: (data, small) => ({ type: "gauge", data, scale: { color: { range: ["#7bd389", "#f7df1e", "#f72585"] } },
      style: { textContent: (t) => `${t}%`, textFontSize: small ? 14 : 22 }, legend: false }) },
];

// ---------- scene 3: raw delivery orders, aggregated by transforms ----------
const CATS = ["早餐", "便當", "飲料", "宵夜"];
const CAT_SCALE = { domain: CATS, range: ["#f7df1e", "#4cc9f0", "#7bd389", "#9d8cff"] };
const PAYS = ["現金", "信用卡", "行動支付"];
const PAY_SCALE = { domain: PAYS, range: ["#c9a66b", "#f72585", "#4cc9f0"] };
const DISTRICTS = { 大安: 1.25, 信義: 1.3, 中山: 1.15, 松山: 1.1, 中正: 1.1, 內湖: 1.05, 南港: 1.0, 士林: 0.95, 北投: 0.9, 文山: 0.9, 大同: 0.88, 萬華: 0.85 };
const PEAK = {
  早餐: (h) => 9 * Math.exp(-((h - 7.5) ** 2) / 1.5),
  便當: (h) => 12 * Math.exp(-((h - 12) ** 2) / 1.2) + 10 * Math.exp(-((h - 18.5) ** 2) / 1.5),
  飲料: (h) => 3 + 6 * Math.exp(-((h - 15) ** 2) / 5),
  宵夜: (h) => 9 * Math.exp(-((h - 22.5) ** 2) / 2),
};
const PRICE = { 早餐: [70, 25], 便當: [140, 40], 飲料: [95, 30], 宵夜: [210, 70] };
const ORDERS = (() => {
  const r = rng(21), names = Object.keys(DISTRICTS), out = [];
  for (let h = 6; h <= 23; h++) { // ordered by hour with every (hour, category) bucket present, as the stream graph needs
    for (const cat of CATS) {
      const n = 1 + Math.round(PEAK[cat](h) * (0.8 + r() * 0.4) * 6);
      for (let i = 0; i < n; i++) {
        const d = names[Math.floor(r() * names.length)];
        const [mu, sd] = PRICE[cat];
        const p = r();
        out.push({ 時段: h, 行政區: d, 品類: cat, 客單價: Math.max(35, Math.round((mu + sd * gauss(r) * 2) * DISTRICTS[d])), 付款: p < 0.25 ? "現金" : p < 0.55 ? "信用卡" : "行動支付" });
      }
    }
  }
  return out;
})();
const TRANSFORMS = [
  { label: "直方圖", code: '{ type: "binX", y: "count", thresholds: 24 }, { type: "stackY" }',
    spec: { type: "rect", encode: { x: "客單價", color: "品類" }, transform: [{ type: "binX", y: "count", thresholds: 24 }, { type: "stackY" }],
      scale: { color: CAT_SCALE }, style: { inset: 0.5 }, axis: { x: { title: "客單價（元）" }, y: { title: "訂單數" } } } },
  { label: "排序", code: '{ type: "groupX", y: "mean" }, { type: "sortX", by: "y", reverse: true }',
    spec: { type: "interval", encode: { x: "行政區", y: "客單價" }, transform: [{ type: "groupX", y: "mean" }, { type: "sortX", by: "y", reverse: true }],
      style: { fill: "#4cc9f0", radiusTopLeft: 3, radiusTopRight: 3 }, axis: { x: { title: false, labelAutoRotate: false }, y: { title: "平均客單價（元）" } },
      tooltip: { items: [{ channel: "y", name: "平均客單價", valueFormatter: (v) => `${Math.round(v)} 元` }] } } },
  { label: "占比", code: '{ type: "groupX", y: "count" }, { type: "stackY" }, { type: "normalizeY" }',
    spec: { type: "interval", encode: { x: "時段", color: "品類" }, transform: [{ type: "groupX", y: "count" }, { type: "stackY" }, { type: "normalizeY" }],
      scale: { color: CAT_SCALE }, axis: { x: { title: "時段（時）" }, y: { title: "占比", labelFormatter: ".0%" } } } },
  { label: "並排", code: '{ type: "groupX", y: "count" }, { type: "dodgeX" }',
    spec: { type: "interval", encode: { x: "品類", color: "付款" }, transform: [{ type: "groupX", y: "count" }, { type: "dodgeX" }],
      scale: { color: PAY_SCALE }, style: { radiusTopLeft: 2, radiusTopRight: 2 }, axis: { x: { title: false }, y: { title: "訂單數" } } } },
  { label: "抖動", code: '{ type: "jitterX" }',
    spec: { type: "point", encode: { x: "品類", y: "客單價", color: "品類", shape: "point", size: 2.2 }, transform: [{ type: "jitterX" }],
      scale: { color: CAT_SCALE }, style: { fillOpacity: 0.6 }, axis: { x: { title: false }, y: { title: "客單價（元）" } } } },
  { label: "河流", code: '{ type: "groupX", y: "count" }, { type: "stackY" }, { type: "symmetryY" }',
    spec: { type: "area", encode: { x: "時段", color: "品類", shape: "smooth" }, transform: [{ type: "groupX", y: "count" }, { type: "stackY" }, { type: "symmetryY" }],
      scale: { color: CAT_SCALE }, style: { fillOpacity: 0.85 }, axis: { x: { title: "時段（時）" }, y: { title: false, label: false } } } },
];

// ---------- scene 4: coordinates ----------
const SEASON_OF = ["冬", "冬", "春", "春", "春", "夏", "夏", "夏", "秋", "秋", "秋", "冬"];
const SEASON_SCALE = { domain: ["春", "夏", "秋", "冬"], range: ["#7bd389", "#f72585", "#ff8c42", "#4cc9f0"] };
const RAIN_M = MONTHS.map((月份, i) => ({ 月份, 雨量: RAIN[i], 季節: SEASON_OF[i] }));
const DAILY = (() => {
  const r = rng(31);
  let w = 0;
  return Array.from({ length: 365 }, (_, i) => {
    w = w * 0.8 + (r() - 0.5) * 1.6;
    const d = new Date(2024, 0, 1 + i);
    return { 日: i, 日期: `${d.getMonth() + 1}/${d.getDate()}`, 均溫: +(23.4 - 7.4 * Math.cos((2 * Math.PI * (i - 18)) / 365) + w).toFixed(1) };
  });
})();
const pAxis = (title) => ({ zIndex: 1, title, titlePosition: "right", titleTransform: "translate(-50%, 0) rotate(-90)", titleFill: "#f7df1e", titleFontSize: 11,
  line: true, lineStroke: "#9b998f", tickStroke: "#9b998f", labelFill: "#ecebe6", labelFontSize: 10, labelStroke: "#0e1013", labelLineWidth: 3 });
const rainBase = { type: "interval", data: RAIN_M, encode: { x: "月份", y: "雨量", color: "季節" }, scale: { color: SEASON_SCALE }, style: { stroke: "#0e1013", lineWidth: 1 },
  tooltip: { items: [{ channel: "y", name: "雨量", valueFormatter: (v) => `${v} mm` }] } };
const COORDS = [
  { label: "直角", title: "台北月雨量（mm）", sub: "示意資料・直角座標的長條圖", code: 'coordinate: { type: "cartesian" }',
    spec: () => ({ ...rainBase, style: { radiusTopLeft: 3, radiusTopRight: 3 }, axis: { x: { title: false }, y: { title: "雨量（mm）" } } }) },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new G2.Chart() + chart.options({ data }) + await chart.render() 計時",
    desc: "資料點逐級加量，計時從建立圖表、chart.options() 到 chart.render() 完成再加一個畫格（關閉動畫與 tooltip）。散佈圖每一點都是一個 G 圖形物件，折線不論多少點都只有一條路徑，可切換比較。",
    hint: "按「開始測試」；切換折線後再測一次",
    mount(ctx) {
      ctx.html(`<div class="g2-stress">${cardHTML("chart.render()", "")}</div>`);
      const el = ctx.$(".g2-host > div"), tag = ctx.$(".g2-tag small");
      const MARKS = [
        { name: "散佈", sizes: [1000, 2000, 5000, 10000, 20000, 30000], preview: 5000,
          note: "散佈圖只測到 3 萬點：G2 5.4.8 在約 4 萬點時，render 完成後的事件處理會丟出 Maximum call stack size exceeded、圖面空白，所以不列入級距。" },
        { name: "折線", sizes: [10000, 50000, 100000, 200000, 500000, 1000000], preview: 100000,
          note: "折線全部資料只畫成一條路徑，成本主要在尺度推導與路徑產生。" },
      ];
      let mi = 0, chart = null, gen = 0;
      const make = (n) => {
        const out = new Array(n);
        if (mi === 0) {
          const g = () => Math.random() + Math.random() + Math.random() - 1.5;
          for (let i = 0; i < n; i++) { const k = i % 3; out[i] = { x: [30, 60, 75][k] + g() * [28, 20, 12][k], y: [40, 70, 25][k] + g() * [24, 18, 14][k] }; }
        } else {
          let v = 0;
          for (let i = 0; i < n; i++) { v += Math.random() - 0.5; out[i] = { x: i, y: v + Math.sin(i / (n / 9)) * Math.sqrt(n) * 0.2 }; }
        }
        return out;
      };
      const render = async (data) => {
        if (chart) chart.kill();
        chart = g2(ctx, el, {
          ...(mi === 0
            ? { type: "point", data, encode: { x: "x", y: "y" }, style: { r: 1.2, lineWidth: 0, fill: "#4cc9f0", fillOpacity: 0.7 } }
            : { type: "line", data, encode: { x: "x", y: "y" }, style: { lineWidth: 1, stroke: "#f7df1e" } }),
          animate: false, tooltip: false,
          axis: { x: { title: false, labelFormatter: compact }, y: { title: false, labelFormatter: compact } },
        });
        await chart.ready;
      };
      const label = (n) => { tag.textContent = `${MARKS[mi].name}・${compact(n)} 點・Canvas 繪製`; };
      const preview = () => { const n = MARKS[mi].preview; render(make(n)).then(() => label(n), () => {}); };
      const makeBench = () => {
        const lab = ctx.el.querySelector(".sc-lab");
        if (lab) lab.remove();
        const my = ++gen, m = MARKS[mi];
        ctx.bench({
          label: `${m.name}資料點`, unit: "點", sizes: m.sizes, target: 1000, budget: 2000,
          prepare: (n) => make(n),
          async run(n, data) {
            if (my !== gen) throw new DOMException("Bench replaced", "AbortError"); // the mark was switched mid-run
            await render(data);
            await ctx.frame(1);
            label(n);
          },
          note: `計時含建立 Chart、尺度推導、版面與 Canvas 繪製，資料產生不計入。${m.note}`,
        });
      };
      ctx.group(MARKS.map((m) => m.name), 0, (i) => { mi = i; makeBench(); preview(); });
      ctx.controls.classList.add("bottom");
      makeBench();
      preview();
    },
  },
] });
</script>
</body>
</html>
