<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AntV G6 示範：公司組織架構圖</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"虛構公司與人名，僅為示意"}</script>
<style>
  #graph { position: fixed; inset: 0; }
  header { position: fixed; left: 16px; top: 12px; z-index: 40; pointer-events: none; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  #graph .tooltip { font-family: var(--font) !important; background: #171a1f !important; color: #ecebe6 !important;
    border: 1px solid rgba(255,255,255,.15) !important; border-radius: 8px !important; box-shadow: 0 6px 20px rgba(0,0,0,.4) !important; padding: 6px 10px !important; font-size: 13px !important; }
  @media (max-width: 520px) {
    header p { display: none; }
    .controls { top: auto; bottom: 46px; }
  }
</style>
</head>
<body>
<div id="graph"></div>
<header>
  <h1>星河科技 組織架構</h1>
  <p>點部門展開或收合團隊・拖曳卡片調整位置</p>
</header>
<div class="controls">
  <button class="btn" data-layout="LR" aria-pressed="true">由左至右</button>
  <button class="btn" data-layout="TB" aria-pressed="false">由上而下</button>
  <button class="btn" data-layout="radial" aria-pressed="false">放射狀</button>
</div>
<div class="hint">點部門收合・拖曳卡片・滾輪縮放</div>

<script src="https://cdn.jsdelivr.net/npm/@antv/g6@5.1.1/dist/g6.min.js"></script>
<script>
// Fictional org tree: [name, title, dept, children?]
const DEPT_COLOR = { exec: "#f7df1e", tech: "#4cc9f0", ops: "#7bd389", fin: "#ff8c42", hr: "#f72585" };
const ORG = ["林志明", "執行長", "exec", [
  ["陳怡君", "技術長", "tech", [
    ["王冠宇", "前端部經理", "tech", [["張雅婷", "設計系統組長", "tech"], ["李宗翰", "行動 App 組長", "tech"]]],
    ["黃柏翰", "後端部經理", "tech", [["吳承恩", "API 平台組長", "tech"], ["劉品妍", "資料庫組長", "tech"]]],
    ["蔡思妤", "AI 研究室主任", "tech", [["楊宥廷", "模型訓練組長", "tech"]]],
  ]],
  ["許家豪", "營運長", "ops", [
    ["鄭佳穎", "業務部經理", "ops", [["謝建宏", "北區業務組長", "ops"], ["洪美玲", "南區業務組長", "ops"]]],
    ["郭俊傑", "客服部經理", "ops", [["邱詩涵", "客服中心組長", "ops"]]],
  ]],
  ["曾彥廷", "財務長", "fin", [
    ["廖郁婷", "會計部經理", "fin"],
    ["賴昱安", "法務部經理", "fin"],
  ]],
  ["徐語彤", "人資長", "hr", [
    ["周冠廷", "招募部經理", "hr"],
    ["葉芷瑜", "教育訓練經理", "hr"],
  ]],
]];

let seq = 0;
function toTree([name, title, dept, kids = []], depth = 0) {
  const node = { id: `n${seq++}`, data: { name, title, dept, depth, size: kids.length } };
  if (kids.length) node.children = kids.map((k) => toTree(k, depth + 1));
  // Department managers start collapsed so the first view stays readable.
  if (depth === 2 && kids.length) node.style = { collapsed: true };
  return node;
}
const tree = toTree(ORG);

const EDGE_BY_LAYOUT = { LR: "cubic-horizontal", TB: "cubic-vertical", radial: "line" };
function layoutFor(mode) {
  return {
    type: "compact-box",
    direction: mode === "radial" ? "RL" : mode,
    radial: mode === "radial",
    getWidth: () => 128,
    getHeight: () => 44,
    getVGap: () => (mode === "TB" ? 26 : 8),
    getHGap: () => (mode === "radial" ? 12 : mode === "TB" ? 6 : 34),
  };
}

const graph = new G6.Graph({
  container: "graph",
  theme: "dark",
  background: "#0e1013",
  autoFit: "view",
  padding: [70, 30, 50, 30],
  animation: true,
  data: G6.treeToGraphData(tree),
  node: {
    type: "rect",
    style: {
      size: [128, 44],
      radius: 9,
      fill: "#171a1f",
      stroke: (d) => DEPT_COLOR[d.data.dept],
      lineWidth: (d) => (d.data.depth === 0 ? 3 : 1.5),
      shadowColor: (d) => DEPT_COLOR[d.data.dept],
      shadowBlur: (d) => (d.data.depth === 0 ? 18 : 6),
      labelText: (d) => `${d.data.name}\n${d.data.title}`,
      labelPlacement: "center",
      labelFill: "#ecebe6",
      labelFontSize: 12,
      labelLineHeight: 16,
      labelFontFamily: "Noto Sans TC, Microsoft JhengHei, sans-serif",
      labelTextAlign: "center",
      badge: (d) => d.data.size > 0,
      badges: (d) => (d.data.size ? [{ text: String(d.data.size), placement: "right-top" }] : []),
      badgeFill: "#0e1013",
      badgeBackgroundFill: (d) => DEPT_COLOR[d.data.dept],
      badgeFontSize: 10,
      cursor: "pointer",
    },
    state: {
      active: { lineWidth: 3, halo: true, haloStroke: "#ffffff", haloLineWidth: 6, haloStrokeOpacity: 0.15 },
    },
  },
  edge: {
    type: EDGE_BY_LAYOUT.LR,
    style: {
      stroke: (d) => DEPT_COLOR[graph ? graph.getNodeData(d.target).data.dept : "exec"],
      strokeOpacity: 0.55,
      lineWidth: 1.6,
    },
  },
  layout: layoutFor("LR"),
  behaviors: [
    "drag-canvas",
    "zoom-canvas",
    "drag-element",
    { type: "collapse-expand", trigger: "click", animation: true },
    { type: "hover-activate", degree: 0 },
  ],
  plugins: [{
    type: "tooltip",
    trigger: "hover",
    enable: (e) => e.targetType === "node",
    getContent: (e, items) => {
      const d = items[0].data;
      return `<b style="color:${DEPT_COLOR[d.dept]}">${d.name}</b>　${d.title}${d.size ? `<br>直屬 ${d.size} 位` : ""}`;
    },
  }],
});

graph.render();

document.querySelectorAll("[data-layout]").forEach((btn) => {
  btn.addEventListener("click", async () => {
    const mode = btn.dataset.layout;
    document.querySelectorAll("[data-layout]").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
    graph.setLayout(layoutFor(mode));
    graph.setEdge({ ...graph.getOptions().edge, type: EDGE_BY_LAYOUT[mode] });
    await graph.render();
    await graph.fitView();
  });
});

addEventListener("resize", () => {
  graph.resize(innerWidth, innerHeight);
  graph.fitView();
});
</script>
</body>
</html>
