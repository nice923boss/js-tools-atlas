function pickNames(r, n) {

// Observe the box (its height also changes when the control bar wraps) and keep the canvas in sync.
function watchSize(ctx, box, fn) {
  let lw = box.clientWidth, lh = box.clientHeight;
  const ro = new ResizeObserver(() => {
    const w = box.clientWidth, h = box.clientHeight;
    if (!w || !h || (w === lw && h === lh)) return;
    lw = w; lh = h; fn(w, h);
  });
  ro.observe(box);
  ctx.onCleanup(() => ro.disconnect());
}

// Every async graph call goes through g.act() so calls never overlap and destroy() waits for the last one;
// destroying a graph while render() is still preparing makes G6 log an error.
function makeGraph(ctx, box, opts) {
  const g = new G6.Graph({ container: box, theme: "dark", background: BG, animation: true, autoFit: "view", padding: 20, ...opts });
  let chain = Promise.resolve();
  g.act = (fn) => (chain = chain.then(() => (g.destroyed ? null : fn())).catch((e) => { if (!g.destroyed) console.error(e); }));
  g.act(() => g.render());
  watchSize(ctx, box, (w, h) => g.act(async () => { if (!g.rendered) return; g.resize(w, h); await g.fitView(); }));
  // Stop any running force simulation and let debounced plugin redraws (minimap waits 128 ms) finish first,
  // otherwise they fire after destroy() and read a model that no longer exists.
  ctx.onCleanup(() => {
    chain.then(() => { if (!g.destroyed) g.stopLayout(); return new Promise((r) => setTimeout(r, 200)); })
      .finally(() => g.destroyed || g.destroy());
  });
  return g;
}

function orgTree() {
  let seq = 0;
  const managers = [];
  const walk = ([name, title, dept, kids = []], depth = 0) => {
    const node = { id: `n${seq++}`, data: { name, title, dept, depth, size: kids.length } };
    if (kids.length) node.children = kids.map((k) => walk(k, depth + 1));
    // Department managers start collapsed so the first view stays readable.

    return node;
  };
  return { tree: walk(ORG), managers };
}

const TEAMS = ["台北隊", "新竹隊", "台中隊", "高雄隊"];
function teamData() {
  const r = rng(7), ids = pickNames(r, 48), edges = [];
  const nodes = ids.map((id, i) => ({ id, data: { team: i % 4 } }));
  const link = (a, b) => edges.push({ id: `t${edges.length}`, source: ids[a], target: ids[b] });

// ---------- 5. store network grouped by region and city ----------
const REGIONS = [
  ["north", "北區", "#4cc9f0", { 台北市: "信義 西門 士林", 新北市: "板橋 新莊", 桃園市: "中壢 桃園" }],

  ["east", "東區", "#f72585", { 花蓮縣: "花蓮", 台東縣: "台東" }],
];
const ROUTES = "信義>板橋 板橋>中壢 中壢>逢甲 逢甲>員林 員林>安平 安平>左營 左營>台東 信義>花蓮 花蓮>台東";
function storeData() {
  const nodes = [], edges = [], combos = [];
  const link = (a, b) => edges.push({ id: `s${edges.length}`, source: `${a}店`, target: `${b}店` });
  for (const [rid, label, color, cities] of REGIONS) {
    combos.push({ id: rid, data: { label, color } });
    for (const [city, list] of Object.entries(cities)) {
      combos.push({ id: city, combo: rid, data: { label: city, color } });
      list.split(" ").forEach((s, i, arr) => { nodes.push({ id: `${s}店`, combo: city, data: { color } }); if (i) link(arr[i - 1], s); });
    }
  }
  ROUTES.split(" ").forEach((p) => link(...p.split(">")));
  return { nodes, edges, combos };
}

// ---------- 6. club network ----------
const CLUBS = ["攝影社", "登山社", "程式社", "熱舞社", "吉他社"];
function clubData() {
  const r = rng(11), ids = pickNames(r, 50), nodes = [], edges = [], members = CLUBS.map(() => []), deg = {};
  ids.forEach((id, i) => { nodes.push({ id, data: { club: CLUBS[i % 5], lead: i < 5 } }); members[i % 5].push(id); deg[id] = 0; });
  const link = (a, b) => { if (a === b) return; edges.push({ id: `c${edges.length}`, source: a, target: b }); deg[a]++; deg[b]++; };
  members.forEach((list) => list.forEach((id, k) => {
    if (k) link(id, r() < 0.55 ? list[0] : list[Math.floor(r() * k)]);
    if (k > 2 && r() < 0.35) link(id, list[1 + Math.floor(r() * (k - 1))]);
  }));
  for (let k = 0; k < 9; k++) {
    const a = Math.floor(r() * 5), b = (a + 1 + Math.floor(r() * 4)) % 5;
    link(members[a][1 + Math.floor(r() * 9)], members[b][1 + Math.floor(r() * 9)]);
  }
  return { nodes, edges, members, deg };
}

// ---------- 7. simplified Taipei MRT map ----------
const LINES = {
  red: ["#e3002c", "淡水信義線", "北投 士林 圓山 中山 台北車站 中正紀念堂 大安森林公園 大安 台北101 象山"],

  new: ["#f7df1e", "新增路段"],
};
const PLACE = { r: "right", l: "left", b: "bottom", t: "top", rt: "right-top", rb: "right-bottom" };
const STATIONS = "北投 0 -3 r,士林 0 -2 r,圓山 0 -1 r,中山 0 0 rt,台北車站 0 1 l,中正紀念堂 0 2 rb,大安森林公園 1.5 2 b,大安 3 2 b," +
  "台北101 4.5 2 b,象山 6 2 b,西門 -1.5 1 l,忠孝新生 1.5 1 b,忠孝復興 3 1 rb,市政府 4.5 1 b,南港 6 1 b,公館 -1.2 3.6 l,古亭 -0.6 2.8 l," +
  "北門 -1.5 0 l,松江南京 1.5 0 b,南京復興 3 0 rb,小巨蛋 4.5 0 b,松山 6 0 b,中山國中 3 -1 r,松山機場 3 -2 l,大直 4.5 -2.5 t,內湖 6 -2.5 t";
function mrtData() {
  const U = 72, lineOf = {}, count = {}, edges = [];
  for (const [key, [, , list]] of Object.entries(LINES)) {
    if (!list) continue;
    list.split(" ").forEach((s, i, arr) => {
      lineOf[s] ||= key; count[s] = (count[s] || 0) + 1;
      if (i) edges.push({ id: `${key}${i}`, source: arr[i - 1], target: s, data: { line: key } });
    });
  }
  const nodes = STATIONS.split(",").map((row) => {
    const [id, x, y, p] = row.split(" ");
    return { id, data: { line: lineOf[id], transfer: count[id] > 1 }, style: { x: x * U, y: y * U, labelPlacement: PLACE[p] } };
  });
  return { nodes, edges };
}

// ---------- 8. stress data: sunflower spiral with precomputed positions ----------
function galaxy(n, withEdges) {
  const nodes = new Array(n), edges = [];
  for (let i = 0; i < n; i++) {
    const r = 9 * Math.sqrt(i + 0.5), a = i * 2.399963;
    nodes[i] = { id: `n${i}`, style: { x: r * Math.cos(a), y: r * Math.sin(a), fill: C[(i % 21) % 6] } };
    if (!withEdges) continue;
    if (i >= 21) edges.push({ id: `a${i}`, source: `n${i}`, target: `n${i - 21}` });
    if (i >= 13 && i % 5 === 0) edges.push({ id: `b${i}`, source: `n${i}`, target: `n${i - 13}` });
  }
  return { nodes, edges };
}

    hint: "按「自動加壓」開始・切換連線或標籤後再測一次",
    mount(ctx) {
      ctx.html(`<div class="g6-stress"><div class="g6-box"></div></div>`);
      ctx.controls.classList.add("bottom");
      const box = ctx.$(".g6-stress .g6-box");
      let g = null, n = 0, links = true, labels = false, edgeCount = 0, buildMs = 0, chain = Promise.resolve();
      const rebuild = (m) => (chain = chain.then(() => ctx.active && build(m)).catch((e) => console.error(e)));
      ctx.toggle("連線", true, (v) => { links = v; if (n) rebuild(n); });
      ctx.toggle("標籤", false, (v) => { labels = v; if (n) rebuild(n); });
      async function build(m) {
        n = m;
        if (g) g.destroy();
        const data = galaxy(m, links);
        edgeCount = data.edges.length;
        g = new G6.Graph({
          container: box, theme: "dark", background: BG, animation: false, autoFit: "view", padding: 12, data,
          node: { type: "circle", style: { size: 5, lineWidth: 0, label: labels, labelText: (d) => d.id, labelFontSize: 5, labelFill: "#9aa0a6", labelPlacement: "right" } },
          edge: { type: "line", style: { stroke: "#ffffff", strokeOpacity: 0.14, lineWidth: 0.6 } },
        });
        const t0 = performance.now();
        await g.render();
        buildMs = performance.now() - t0;
      }
      ctx.raf((t, dt) => { if (g && g.rendered && !g.destroyed) g.rotateBy(dt * 0.006, false); });
      watchSize(ctx, box, (w, h) => { chain = chain.then(async () => { if (g && g.rendered && !g.destroyed) { g.resize(w, h); await g.fitView(); } }); });
      ctx.onCleanup(() => { chain.finally(() => g && !g.destroyed && g.destroy()); });
      ctx.ramp({
        label: "節點", unit: "個", steps: [200, 500, 1000, 2000, 4000, 8000, 16000], initial: 1, minFps: 30,
        apply: (m) => rebuild(m),
        metrics: () => ({
          連線: edgeCount,
          建立耗時: `${buildMs.toFixed(0)} ms`,
          模式: ["節點", links && "連線", labels && "標籤"].filter(Boolean).join("＋"),
        }),
        note: "每一級重新建立一張 G6 圖：座標預先算好、不跑佈局、關閉動畫，「建立耗時」是 render() 把資料轉成 @antv/g 圖形物件的時間；之後視角每格旋轉，Canvas 2D 必須重畫全部節點與連線，FPS 反映繪圖成本。G6 每個節點、每條連線都是獨立的圖形物件，建立時間與記憶體隨數量線性成長；開「標籤」每個節點多一個文字物件，關「連線」只剩節點。",
      });
    },
  },
] });
</script>
</body>
</html>
