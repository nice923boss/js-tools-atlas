<body>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@antv/l7@2.29.1/dist/l7.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// AntV L7 showcase: heatmaps, point / line / polygon / raster / image layers, camera control,
// clustering and a point-count stress test, all on WebGL over a key-free MapLibre basemap.
const { Scene, MapLibre, PointLayer, LineLayer, PolygonLayer, HeatmapLayer, RasterLayer, ImageLayer, Popup, LayerPopup, Zoom, Scale, Marker } = L7;
const L7Map = L7.Map;
const { fmt } = Showcase;
const STYLE = "https://tiles.openfreemap.org/styles/dark";
const COL = { c1: "#f7df1e", c2: "#4cc9f0", c3: "#f72585", c4: "#7bd389", c5: "#ff8c42", c6: "#9d8cff", ink: "#0b0d10" };
const HEAT = { colors: ["#1b2a4a", "#4cc9f0", "#9d8cff", "#f72585", "#ff8c42", "#f7df1e"], positions: [0, 0.2, 0.4, 0.6, 0.8, 1] };
const SEQ = ["#1f5f8b", "#2a93c0", "#4cc9f0", "#9d8cff", "#f72585", "#ff8c42", "#f7df1e"];
const FONT = () => getComputedStyle(document.body).getPropertyValue("--font").trim() || "sans-serif";
const TW_BOX = [119.95, 21.9, 122.05, 25.32];

// County seats with approximate 2024 population in units of 10,000 people
const CITIES = [
  ["新北", 121.4628, 25.012, 405], ["台中", 120.6736, 24.1477, 285], ["高雄", 120.3014, 22.6273, 273], ["台北", 121.5654, 25.033, 249],
  ["桃園", 121.301, 24.9936, 232], ["台南", 120.227, 22.9997, 185], ["彰化", 120.5161, 24.0518, 124], ["屏東", 120.488, 22.6727, 79],
  ["雲林", 120.527, 23.699, 66], ["新竹縣", 121.0177, 24.8387, 59], ["苗栗", 120.8214, 24.5602, 54], ["嘉義縣", 120.2955, 23.4518, 49],
  ["南投", 120.6848, 23.9096, 48], ["宜蘭", 121.7537, 24.7021, 45], ["新竹市", 120.9675, 24.8138, 45], ["基隆", 121.7419, 25.1276, 36],
  ["花蓮", 121.6014, 23.9872, 32], ["嘉義市", 120.4491, 23.4801, 26], ["台東", 121.1442, 22.7583, 21],
].map(([name, lng, lat, pop]) => ({ name, lng, lat, pop, w: Math.min(1, Math.sqrt(pop / 250)) }));
const PARSER = { parser: { type: "json", x: "lng", y: "lat" } };

function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const gauss = (r) => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());

// Illustrative activity points scattered around each county seat, weighted by population
function cityPoints(seed, scale = 1) {
  const r = rng(seed), out = [];
  for (const c of CITIES) {
    const n = Math.round((60 + c.pop * 2.2) * scale), sigma = 0.02 + c.w * 0.035;
    for (let i = 0; i < n; i++) out.push({ lng: c.lng + gauss(r) * sigma, lat: c.lat + gauss(r) * sigma * 0.9, w: 0.3 + r() * 0.7, city: c.name });
  }
  return out;
}

const row = (label, value, cls = "") => `<div class="av-row"><span>${label}</span><b class="${cls}">${value}</b></div>`;
const rampBar = (colors, labels) =>
  `<div class="av-ramp" style="background:linear-gradient(90deg,${colors.join(",")})"></div>` +
  `<div class="av-ramp-n">${labels.map((l) => `<span>${l}</span>`).join("")}</div>`;
const classes = (colors, labels) => `<div class="av-classes">${colors.map((c, i) => `<i style="background:${c}"></i><span>${labels[i]}</span>`).join("")}</div>`;

// Center and zoom that fit a [w, s, e, n] box inside the area left free by the controls and the info panel.
// Computed before the map exists so MapLibre never requests tiles for a provisional view.
function viewFor(ctx, box, { left: forceLeft, top: forceTop, maxZoom = 15 } = {}) {
  const { width: W, height: H } = ctx.$(".av-map").getBoundingClientRect();
  const info = ctx.$(".av-info");
  const wide = W > 560;
  const top = forceTop != null ? forceTop : (ctx.controls.offsetHeight || 0) + 22;
  const left = forceLeft != null ? forceLeft : wide && info ? info.offsetWidth + 24 : 14;
  const bottom = !wide && info ? info.offsetHeight + 34 : 24;
  const right = 52;
  const mx = (lng) => (lng + 180) / 360;
  const my = (lat) => { const s = Math.sin(lat * Math.PI / 180); return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI); };
  const x0 = mx(box[0]), x1 = mx(box[2]), y0 = my(box[3]), y1 = my(box[1]);
  const aw = Math.max(60, W - left - right), ah = Math.max(60, H - top - bottom);
  const zoom = Math.min(maxZoom, Math.log2(Math.min(aw / ((x1 - x0) * 512), ah / ((y1 - y0) * 512))));
  const ws = 512 * 2 ** zoom;
  const cx = (x0 + x1) / 2 - (left - right) / 2 / ws, cy = (y0 + y1) / 2 - (top - bottom) / 2 / ws;
  return { center: [cx * 360 - 180, Math.atan(Math.sinh(Math.PI * (1 - 2 * cy))) * 180 / Math.PI], zoom };
}

// Creates an L7 Scene in .av-map and tears it down (plus its WebGL contexts) when the scene unmounts.
async function makeScene(ctx, { basemap = true, center, zoom, pitch = 0, rotation = 0 }) {
  const el = ctx.$(".av-map");
  const opts = { center, zoom, pitch, rotation, minZoom: 1, maxZoom: 18 };
  const scene = new Scene({ id: el, logoVisible: false, map: basemap ? new MapLibre({ style: STYLE, ...opts }) : new L7Map(opts) });
  ctx.onCleanup(() => {
    const canvases = [...el.querySelectorAll("canvas")];
    const finish = () => {
      scene.destroy();
      for (const c of canvases) {
        const gl = c.getContext("webgl2") || c.getContext("webgl");
        const ext = gl && gl.getExtension("WEBGL_lose_context");
        if (ext && !gl.isContextLost()) ext.loseContext();
      }
    };
    // Let in-flight basemap tiles finish (the element is already detached) instead of aborting them
    const map = basemap ? scene.getMapService().map : null;
    if (!map || map.areTilesLoaded()) return finish();
    map.resize = () => map; // a detached container would otherwise resize to 0x0 and cancel every tile
    // Poll instead of waiting for "idle": animated L7 layers can keep the map from ever going idle
    const t0 = performance.now();
    const poll = setInterval(() => {
      if (map.areTilesLoaded() || performance.now() - t0 > 30000) { clearInterval(poll); finish(); }
    }, 250);
  });
  const status = basemap ? ctx.status("載入底圖…") : null;
  const late = basemap ? ctx.timeout(() => status.error("底圖載入逾時：OpenFreeMap 可能無法連線，圖層會在底圖就緒後出現"), 9000) : null;
  await new Promise((resolve) => scene.on("loaded", resolve));
  if (late) clearTimeout(late);
  if (status) status.done();
  return scene;
}

// One shared hover popup per scene; bind() attaches it to any layer.
function hoverTip(scene) {
  const pop = new Popup({ closeButton: false, closeOnClick: false, autoClose: false, offsets: [0, -12], lngLat: { lng: 0, lat: 0 }, html: "" });
  let added = false;
  return {
    bind(layer, html) {
      layer.on("mousemove", (e) => {
        pop.setLngLat(e.lngLat).setHTML(html(e.feature));
        if (!added) { scene.addPopup(pop); added = true; } else pop.show();
      });
      layer.on("mouseout", () => added && pop.hide());
    },
    hide() { if (added) pop.hide(); },
  };
}

function haversine(a, b) {
  const R = 6371, toR = Math.PI / 180;
  const dLat = (b[1] - a[1]) * toR, dLng = (b[0] - a[0]) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * toR) * Math.cos(b[1] * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

Showcase.run({ scenes: [
  // 1 ----------------------------------------------------------------------------------------
  {
    id: "heat", title: "熱力圖三模式",
    api: "HeatmapLayer · heatmap / heatmap3D / hexagon · PointLayer.animate",
    desc: "同一批夜間人流點換三種畫法：2D 熱力圖、把熱度拉成地形的 3D 熱力圖、以 6 公里六角格加總後立起來的六角柱；縣市光點用 animate 做漣漪，滑過可看熱度指數。",
    hint: "切換三種熱力模式；滑過黃色光點看城市熱度；右鍵拖曳可旋轉傾斜",
    async mount(ctx) {
      ctx.html(`<div class="av-map"></div><div class="av-info panel"></div>`);
      const info = ctx.$(".av-info");
      const POINTS = cityPoints(11);
      const MODES = [
        { key: "heat2d", name: "2D 熱力圖", sub: "夜間人流熱度（示意）", pitch: 0 },
        { key: "heat3d", name: "3D 熱力圖", sub: "熱度轉成地形高度（示意）", pitch: 48 },
        { key: "hex", name: "六角柱聚合", sub: "以 6 公里六角格加總權重（示意）", pitch: 55 },
      ];
      let mode = 1, wavesOn = true, heat = null, waves = null, scene = null, tip = null;
      const paint = (ms) => {
        const m = MODES[mode];
        info.innerHTML = `<h3>${m.name}</h3><div class="av-sub">${m.sub}</div>` + row("資料點", `${fmt(POINTS.length)} 點`) +
          row("圖層", m.key === "hex" ? "HeatmapLayer + hexagon" : `shape: ${m.key === "heat3d" ? "heatmap3D" : "heatmap"}`, "av-txt") +
          (ms != null ? row("建立圖層", `${ms.toFixed(1)} ms`) : "") + rampBar(HEAT.colors, ["低", "熱度", "高"]);
      };
      paint();
      ctx.group(MODES.map((m) => m.name.replace("熱力圖", "熱力").replace("聚合", "")), mode, (i) => { mode = i; setMode(); });
      ctx.toggle("城市光點", wavesOn, (v) => { wavesOn = v; if (waves) (v ? waves.show() : (waves.hide(), tip.hide())); });
      const v = viewFor(ctx, TW_BOX);
      scene = await makeScene(ctx, { ...v, pitch: 48, rotation: -12 });
      tip = hoverTip(scene);

      function makeHeat(m) {
        if (m.key === "hex") {
          return new HeatmapLayer({ zIndex: 2 })
            .source(POINTS, { ...PARSER, transforms: [{ type: "hexagon", size: 6000, field: "w", method: "sum" }] })
            .size("sum", (s) => s * 700).shape("hexagonColumn").color("sum", HEAT.colors)
            .style({ coverage: 0.85, angle: 0, opacity: 0.95 });
        }
        return new HeatmapLayer({ zIndex: 2 })
          .source(POINTS, PARSER).size("w", [0, 0.12]).shape(m.key === "heat3d" ? "heatmap3D" : "heatmap")
          .style({ intensity: m.key === "heat3d" ? 0.45 : 0.5, radius: m.key === "heat3d" ? 14 : 16, opacity: 1, rampColors: HEAT });
      }
      function makeWaves() {
        const layer = new PointLayer({ zIndex: 3 })
          .source(CITIES, PARSER).shape("circle").size("w", (w) => 30 + w * 50).color(COL.c1)
          .animate(true).active(true).style({ opacity: 0.9 });
        tip.bind(layer, (f) => `${f.name}・熱度指數 <b>${Math.round(f.w * 100)}</b>`);
        return layer;
      }
      function setMode() {
        tip.hide();
        if (heat) scene.removeLayer(heat);
        if (waves) scene.removeLayer(waves);
        const t0 = performance.now();
        heat = makeHeat(MODES[mode]);
        scene.addLayer(heat);
        const ms = performance.now() - t0;
        waves = makeWaves();
        scene.addLayer(waves);
        if (!wavesOn) waves.hide();
        paint(ms);
        scene.getMapService().map.easeTo({ pitch: MODES[mode].pitch, duration: 1200 });
      }
      setMode();
    },
  },

  // 2 ----------------------------------------------------------------------------------------
  {
    id: "points", title: "城市氣泡與柱體",
    api: "PointLayer · circle / cylinder / text · scale quantile · LayerPopup · active",
    desc: "19 個縣市人口用同一個 PointLayer 換三種 shape：依人口縮放的氣泡、立體圓柱、文字標註；顏色用 quantile 分位數比例尺分五級，滑過時 active 高亮並由 LayerPopup 顯示欄位。",
    hint: "切換氣泡、3D 柱體、文字標註；滑過圖形看縣市人口",
    async mount(ctx) {
      ctx.html(`<div class="av-map"></div><div class="av-info panel"></div>`);
      const info = ctx.$(".av-info");
      const COLORS = ["#1f5f8b", "#4cc9f0", "#9d8cff", "#f72585", "#f7df1e"];
      // d3-style (R-7) quantile thresholds, matching how L7's quantile scale splits the domain
      const sorted = CITIES.map((c) => c.pop).sort((a, b) => a - b);
      const q = (p) => { const h = (sorted.length - 1) * p, i = Math.floor(h); return sorted[i] + (h - i) * ((sorted[i + 1] ?? sorted[i]) - sorted[i]); };
      const cuts = [0.2, 0.4, 0.6, 0.8].map(q);
      const labels = COLORS.map((_, i) => i === 0 ? `< ${fmt(cuts[0])} 萬` : i === 4 ? `≥ ${fmt(cuts[3])} 萬` : `${fmt(cuts[i - 1])}～${fmt(cuts[i])} 萬`);
      const total = CITIES.reduce((s, c) => s + c.pop, 0);
      const MODES = ["氣泡", "3D 柱體", "文字標註"];
      let mode = 0, layers = [], popup = null, scene = null;
      const paint = () => {
        info.innerHTML = `<h3>縣市人口・${MODES[mode]}</h3><div class="av-sub">人口為約略值（萬人）</div>` +
          row("縣市", `${CITIES.length} 個`) + row("合計", `${fmt(total)} 萬`) + row("最多", `${CITIES[0].name} ${CITIES[0].pop} 萬`, "av-txt") +
          classes(COLORS, labels);
      };
      paint();
      ctx.group(MODES, mode, (i) => { mode = i; build(); });
      const v = viewFor(ctx, [119.95, 22.4, 122.05, 25.3]);
      scene = await makeScene(ctx, { ...v, pitch: 0 });

      function build() {
        layers.forEach((l) => scene.removeLayer(l));
        if (popup) { scene.removePopup(popup); popup = null; }
        const base = new PointLayer({ zIndex: 2 }).source(CITIES, PARSER).color("pop", COLORS).scale("pop", { type: "quantile" }).active({ color: "#ffffff" });
        let main = base;
        layers = [base];
        if (mode === 0) {
          base.shape("circle").size("pop", [4, 14]).style({ opacity: 0.85, stroke: COL.ink, strokeWidth: 1.5 });
        } else if (mode === 1) {
          base.shape("cylinder").size("pop", (p) => [6, 6, p * 0.35]).style({ opacity: 0.95 });
        } else {
          base.shape("simple").size(7).style({ opacity: 1, stroke: COL.ink, strokeWidth: 1 });
          main = new PointLayer({ zIndex: 3 }).source(CITIES, PARSER).shape("name", "text").size(13).color("pop", COLORS).scale("pop", { type: "quantile" })
            .style({ textAnchor: "bottom", textOffset: [0, -10], stroke: COL.ink, strokeWidth: 3, fontFamily: FONT(), fontWeight: "700", textAllowOverlap: true });
          layers.push(main);
        }
        layers.forEach((l) => scene.addLayer(l));
        popup = new LayerPopup({
          items: [{ layer: base, fields: [{ field: "name", formatField: () => "縣市" }, { field: "pop", formatField: () => "人口", formatValue: (p) => `${p} 萬` }] }],
          trigger: "hover",
        });
        scene.addPopup(popup);
        scene.getMapService().map.easeTo({ pitch: mode === 1 ? 55 : 0, bearing: mode === 1 ? -15 : 0, duration: 900 });
        paint();
      }
      build();
    },
  },

  // 3 ----------------------------------------------------------------------------------------
  {
    id: "arcs", title: "航線弧線動畫",
    api: "LineLayer · arc / arc3d / greatcircle · animate · sourceColor → targetColor",
    desc: "從桃園與小港機場飛往 16 個亞太城市的航線：arc 平面弧線、arc3d 立體拋物線、greatcircle 大圓航線三種 shape 切換，線寬依每週班次映射，顏色從起點漸層到終點，animate 讓光點沿線流動。",
    hint: "切換三種弧線；關掉流動動畫比較靜態樣式；滑過航線看班次",
    async mount(ctx) {
      ctx.html(`<div class="av-map"></div><div class="av-info panel"></div>`);
      const info = ctx.$(".av-info");
      const AIRPORTS = { 桃園: [121.2332, 25.0777], 小港: [120.35, 22.5771] };
      const DEST = [
        ["東京", 139.78, 35.55, 70, 28], ["大阪", 135.24, 34.43, 52, 18], ["首爾", 126.45, 37.46, 48, 14], ["香港", 113.92, 22.31, 66, 21],
        ["上海", 121.81, 31.14, 40, 0], ["新加坡", 103.99, 1.36, 34, 9], ["曼谷", 100.75, 13.69, 38, 12], ["馬尼拉", 121.02, 14.51, 30, 10],
        ["吉隆坡", 101.71, 2.75, 22, 0], ["胡志明市", 106.65, 10.82, 28, 11], ["河內", 105.81, 21.22, 20, 0], ["沖繩", 127.65, 26.2, 26, 8],

        info.innerHTML = `<h3>門市點聚合（示意）</h3><div class="av-sub">cluster ${clustered ? `開，clusterOptions.radius = ${radius}` : "關"}</div>` +
          row("原始點", `${fmt(SHOPS.length)} 點`) + row("縮放／聚合層級", `${z.toFixed(2)}／${clustered ? level : "無"}`) +
          (clustered ? row("畫面上的聚合半徑", `約 ${fmt(radius * 2 ** (z - level))} px`) : "") +
          row(clustered ? "畫面圖形數" : "繪製點數", shown) +
          (clustered ? rampBar(COLORS, ["1", "point_count（log）", "多"]) : "");
      };
      paint();
      ctx.toggle("聚合", clustered, (v) => { clustered = v; build(); });
      ctx.slider("聚合半徑", { min: 4, max: 60, step: 2, value: radius, format: (n) => `${n}` }, (n) => { radius = n; if (clustered) build(); });
      const v = viewFor(ctx, [120.0, 22.45, 122.0, 25.25]);
      scene = await makeScene(ctx, { ...v });
      ctx.interval(paint, 400);

      function build() {
        layers.forEach((l) => scene.removeLayer(l));
        const src = clustered ? { ...PARSER, cluster: true, clusterOptions: { radius, maxZoom: 15 } } : PARSER;
        if (clustered) {
          const bubbles = new PointLayer({ zIndex: 2 }).source(SHOPS, src).shape("circle")
            .size("point_count", [6, 26]).color("point_count", COLORS).scale("point_count", { type: "log" }).active({ color: "#ffffff" })
            .style({ opacity: 0.88, stroke: COL.ink, strokeWidth: 1.5 });
          const labels = new PointLayer({ zIndex: 3 }).source(SHOPS, src).shape("point_count", "text").size(11).color(COL.ink)
            .filter("point_count", (n) => n > 1).style({ fontFamily: FONT(), fontWeight: "700", textAllowOverlap: true });
          layers = [bubbles, labels];
        } else {
          layers = [new PointLayer({ zIndex: 2 }).source(SHOPS, PARSER).shape("simple").size(3).color(COL.c2).style({ opacity: 0.7 })];
        }
        layers.forEach((l) => scene.addLayer(l));
        paint();
      }
      build();
    },
  },

  // 8 ----------------------------------------------------------------------------------------
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "PointLayer shape: simple · L7 Map（無底圖）· setRotation 每幀重繪",
    desc: "改用 L7 內建、不需底圖的 Map，逐級增加 PointLayer 點數，同時每一幀旋轉地圖強迫整層重繪，量測維持的 FPS；低於 30 FPS 就停止，並記錄每一級建立圖層的時間。",
    hint: "按「自動加壓」逐級增加點數；也可拖手動滑桿",
    async mount(ctx) {
      ctx.html(`<div class="av-map av-stress"></div>`);
      // Square box around the island so it stays in frame while the map spins about its center
      const v = viewFor(ctx, [118.9, 21.6, 123.1, 25.7], { left: 14, top: 14 });
      const scene = await makeScene(ctx, { basemap: false, ...v, pitch: 35 });
      if (!ctx.active) return;
      scene.setBgColor("#0b0d10");
      const r = rng(3);
      const HUBS = CITIES.map((c) => [c.lng, c.lat, c.w]);
      let layer = null, count = 0, buildMs = 0, rot = 0;
      function makeData(n) {
        const out = new Array(n);
        for (let i = 0; i < n; i++) {
          const h = HUBS[(r() * HUBS.length) | 0], s = 0.04 + h[2] * 0.12;
          out[i] = { lng: h[0] + gauss(r) * s, lat: h[1] + gauss(r) * s * 0.9, v: r() };
        }
        return out;
      }
      ctx.raf((t, dt) => { rot = (rot + dt * 0.012) % 360; scene.setRotation(rot); });
      ctx.ramp({
        label: "點數", unit: "點",
        steps: [10000, 30000, 100000, 300000, 600000, 1000000],
        minFps: 30,
        async apply(n) {
          const data = makeData(n);
          const t0 = performance.now();
          const next = new PointLayer({ zIndex: 2 }).source(data, PARSER).shape("simple").size(2.5)
            .color("v", ["#2a93c0", "#4cc9f0", "#9d8cff", "#f72585", "#f7df1e"]).style({ opacity: 0.85 });
          await new Promise((resolve) => { next.on("inited", resolve); scene.addLayer(next); });
          buildMs = performance.now() - t0;
          if (layer) scene.removeLayer(layer);
          layer = next;
          count = n;
        },
        metrics: () => ({ 目前點數: count, 建立圖層: `${buildMs.toFixed(0)} ms` }),
        note: "每幀呼叫 setRotation 讓整層點重繪，FPS 反映 GPU 繪製與 L7 每幀開銷；無頭或軟體繪圖環境的數字會遠低於實機。建立圖層時間含資料解析與頂點編碼。",
      });
    },
  },
] });
</script>
