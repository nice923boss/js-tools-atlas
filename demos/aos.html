<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOS 示範：捲動進場動畫圖鑑</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { height: auto; min-height: 100%; }
  .hero { position: relative; min-height: 62vh; display: grid; place-items: center; text-align: center; padding: 60px 20px 30px;
    background: radial-gradient(60% 70% at 50% 0%, rgba(123,211,137,.18), transparent 70%); }
  .hero .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--accent); }
  .hero h1 { margin: 10px 0 8px; font-size: clamp(32px, 7.5vw, 68px); line-height: 1.1; font-weight: 900; }
  .hero p { margin: 0 auto; max-width: 28em; color: var(--muted); }
  .hero code { font-family: var(--mono); color: var(--c2); }
  .down { margin-top: 18px; font-size: 13px; }
  .down b { display: block; width: 16px; height: 16px; margin: 6px auto 0; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 6px; } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; padding: 10px 20px 40px; }
  .card { border-radius: 16px; padding: 18px; background: var(--bg-2); border: 1px solid var(--line); min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
  .card .ico { width: 46px; height: 46px; border-radius: 12px; }
  .card b { display: block; margin-top: 14px; font-size: 16px; }
  .card code { font: 12px/1.4 var(--mono); color: var(--muted); }
  h2.sec { text-align: center; margin: 40px 0 6px; font-size: clamp(22px, 4.4vw, 32px); }
  p.sec { text-align: center; color: var(--muted); margin: 0 0 20px; padding: 0 20px; }
  .ease { max-width: 760px; margin: 0 auto; padding: 0 20px 40px; display: grid; gap: 12px; }
  .lane { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
  .lane span { width: 120px; flex: none; font: 12px var(--mono); color: var(--muted); }
  .lane .dot { width: 34px; height: 34px; border-radius: 50%; }
  .outro { padding: 50px 20px 140px; text-align: center; }
</style>
</head>
<body class="scroll">
<div class="controls"><button class="btn" id="replay">回到頂端重播</button></div>

<header class="hero">
  <div>
    <div class="kicker" data-aos="fade-down">AOS · ANIMATE ON SCROLL</div>
    <h1 data-aos="zoom-in" data-aos-delay="100">捲到哪，<br>動到哪</h1>
    <p data-aos="fade-up" data-aos-delay="250">只要在 HTML 加上 <code>data-aos</code> 屬性，元素捲進畫面就會播放進場動畫，往回捲再反向收起。</p>
    <div class="down" data-aos="fade-up" data-aos-delay="400">往下捲，看 15 種動畫<b></b></div>
  </div>
</header>

<div class="grid" id="grid"></div>

<h2 class="sec" data-aos="fade-up">同一個動畫，不同緩動</h2>
<p class="sec" data-aos="fade-up">data-aos-easing 控制速度曲線</p>
<div class="ease" id="ease"></div>

<div class="outro">
  <h2 data-aos="flip-up">全部看完了</h2>
  <p class="muted" data-aos="fade-up" data-aos-delay="150">往上捲，元素會依序退場；再往下捲又會進場。</p>
</div>

<div class="hint">往下捲動，觀察每張卡片的進場方式</div>

<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const ANIMS = [
  ["淡入上移", "fade-up"], ["淡入下移", "fade-down"], ["從右淡入", "fade-left"], ["從左淡入", "fade-right"],
  ["斜角淡入", "fade-up-right"], ["左右翻轉", "flip-left"], ["向上翻轉", "flip-up"], ["向下翻轉", "flip-down"],
  ["放大進場", "zoom-in"], ["放大上移", "zoom-in-up"], ["縮小進場", "zoom-out"], ["縮小下移", "zoom-out-down"],
  ["向上滑入", "slide-up"], ["從左滑入", "slide-right"], ["從右滑入", "slide-left"],
];
const grid = document.getElementById("grid");
ANIMS.forEach(([name, anim], i) => {
  const c = document.createElement("div");
  c.className = "card";
  c.dataset.aos = anim;
  c.dataset.aosDelay = String((i % 3) * 80);
  c.innerHTML = `<div class="ico" style="background:${COLORS[i % COLORS.length]}"></div><div><b>${name}</b><code>data-aos="${anim}"</code></div>`;
  grid.append(c);
});

const EASES = ["linear", "ease-in-out-sine", "ease-out-cubic", "ease-in-back", "ease-out-back"];
const ease = document.getElementById("ease");
EASES.forEach((e, i) => {
  const lane = document.createElement("div");
  lane.className = "lane";
  lane.innerHTML = `<span>${e}</span><div class="dot" style="background:${COLORS[i]}" data-aos="fade-right" data-aos-duration="1400" data-aos-easing="${e}" data-aos-offset="80"></div>`;
  ease.append(lane);
});

AOS.init({ duration: 800, easing: "ease-out-cubic", offset: 60, once: false });

document.getElementById("replay").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
</script>
</body>
</html>
