<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOS 示範：八個場景看懂捲動進場動畫與上限</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="_shared/showcase.css">
<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["動畫目錄","時長與延遲","easing 曲線","觸發位置","once 與重播","mirror 與事件","固定元素錨點","極限測試"]}</script>
<style>
  .frame-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .frame-wrap iframe, .stress-frame iframe { display: block; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .stress-frame { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; }
  @media (max-width: 760px) { .stress-frame { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); } }
</style>
</head>
<body>
<!-- AOS listens to window scroll only and has no destroy(), so every scene loads it inside its own iframe (see aosFrame). -->
<script src="_shared/showcase.js"></script>
<script>
// AOS showcase: eight scenes from the animation catalog to a 30k-element stress ramp.
const AOS_V2 = "https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/";
const AOS_V3 = "https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/";
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim();
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim();

const FRAME_CSS = `
:root { --bg:#0e1013; --bg-2:#171a1f; --fg:#ecebe6; --muted:#9b998f; --line:rgba(255,255,255,.12);
  --accent:#f7df1e; --c1:#f7df1e; --c2:#4cc9f0; --c3:#f72585; --c4:#7bd389; --c5:#ff8c42; --c6:#9d8cff; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 ${FONT}; -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }
h1, h2, h3, p { margin: 0; }
code, .mono { font: 500 12px/1.4 ${MONO}; }
.muted { color: var(--muted); }
.kicker { font: 600 11px/1 ${MONO}; letter-spacing: .14em; color: var(--accent); }
.wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
.hline { position: fixed; left: 0; right: 0; height: 0; border-top: 1px dashed var(--lc, var(--accent)); z-index: 30; pointer-events: none; }
.hline span { position: absolute; right: 8px; transform: translateY(-50%); padding: 1px 7px; border-radius: 6px; background: var(--bg-2);
  border: 1px solid var(--lc, var(--accent)); color: var(--lc, var(--accent)); font: 600 11px/1.5 ${MONO}; white-space: nowrap; }
/* custom AOS animation: a bar that grows from the left edge */
[data-aos="grow"] { transform: scaleX(0); transform-origin: 0 50%; transition-property: transform; }
[data-aos="grow"].aos-animate { transform: scaleX(1); }
`;

// One scene = one same-origin srcdoc iframe with its own window scroll. AOS binds to that
// window, and removing the iframe on unmount drops every listener and observer it added.
function aosFrame(ctx, host, { body, css = "", init = {}, v3 = false, before }) {
  const base = v3 ? AOS_V3 : AOS_V2;
  const f = document.createElement("iframe");
  f.title = "AOS 捲動區";
  f.srcdoc = `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="${base}aos.css"><style>${FRAME_CSS}${css}</style></head>
<body>${body}<script src="${base}aos.js"><\/script></body></html>`;
  host.append(f);
  ctx.onCleanup(() => f.remove());
  return new Promise((resolve, reject) => {
    f.addEventListener("load", () => {
      const win = f.contentWindow;
      if (!win || !win.AOS) return reject(new Error("AOS 無法從 CDN 載入"));
      if (before) before(win, win.document);
      win.AOS.init(init);
      resolve({ win, doc: win.document, AOS: win.AOS });
    }, { once: true });
  });
}

// Slow ping-pong auto-scroll of the frame window so the page animates without input.
// Wheel, touch, keyboard, mouse or any scroll it did not cause switches it off.
function autoScroll(ctx, win, { speed = 80, rest = [900, 900], range } = {}) {
  let on = true, dir = 1, wait = 500, pos = win.scrollY, last = pos;
  const btn = ctx.toggle("自動捲動", true, (v) => { on = v; pos = last = win.scrollY; });
  const off = () => { if (on) { on = false; btn.setAttribute("aria-pressed", "false"); } };
  for (const t of ["wheel", "touchstart", "keydown", "mousedown"]) win.addEventListener(t, off, { passive: true });
  const api = {
    speed,
    sync() { pos = last = win.scrollY; },
    restart() { pos = last = 0; dir = 1; wait = rest[0]; win.scrollTo(0, 0); on = true; btn.setAttribute("aria-pressed", "true"); },
  };
  ctx.raf((t, dt) => {
    if (!on) return;
    if (Math.abs(win.scrollY - last) > 3) return off();
    if (wait > 0) { wait -= dt; return; }
    const el = win.document.documentElement;
    const [lo, hi] = range ? range(win) : [0, Math.max(0, el.scrollHeight - win.innerHeight)];
    pos += (dir * api.speed * dt) / 1000;
    if (pos >= hi) { pos = hi; dir = -1; wait = rest[1]; } else if (pos <= lo) { pos = lo; dir = 1; wait = rest[0]; }
    win.scrollTo(0, pos);
    last = win.scrollY;
  });
  return api;
}

const frameHost = (ctx) => (ctx.html(`<div class="frame-wrap"></div>`), ctx.$(".frame-wrap"));

const FAMILIES = [
  { id: "fade", color: "--c2", names: ["fade", "fade-up", "fade-down", "fade-left", "fade-right", "fade-up-right", "fade-up-left", "fade-down-right", "fade-down-left"] },
  { id: "flip", color: "--c3", names: ["flip-up", "flip-down", "flip-left", "flip-right"] },
  { id: "slide", color: "--c4", names: ["slide-up", "slide-down", "slide-left", "slide-right"] },
  { id: "zoom", color: "--c5", names: ["zoom-in", "zoom-in-up", "zoom-in-down", "zoom-in-left", "zoom-in-right", "zoom-out", "zoom-out-up", "zoom-out-down", "zoom-out-left", "zoom-out-right"] },
];
const ARROWS = { "up-right": "↗", "up-left": "↖", "down-right": "↘", "down-left": "↙", up: "↑", down: "↓", left: "←", right: "→" };
const glyph = (name) => {
  const dir = Object.keys(ARROWS).find((k) => name.endsWith(k));
  return dir ? ARROWS[dir] : name.startsWith("zoom-out") ? "⊖" : name.startsWith("zoom") ? "⊕" : "●";
};

const EASINGS = ["linear", "ease", "ease-in", "ease-out", "ease-in-out", "ease-in-back", "ease-out-back", "ease-in-out-back",
  "ease-in-sine", "ease-out-sine", "ease-in-out-sine", "ease-in-quad", "ease-out-quad", "ease-in-out-quad",
  "ease-in-cubic", "ease-out-cubic", "ease-in-out-cubic", "ease-in-quart", "ease-out-quart", "ease-in-out-quart"];

// Lanes with a growing bar, all anchored to one element so they trigger on the same frame.
const LANE_CSS = `
.intro { height: 56vh; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding-bottom: 18px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 28px; padding-bottom: 100vh; }
.cols h3 { font-size: 13px; margin: 0 0 4px; }
.lane { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); align-items: center; gap: 10px; height: 24px; }
.lane code { color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track { position: relative; height: 12px; border-radius: 6px; background: rgba(255,255,255,.06); }
.track i { position: absolute; inset: 0; border-radius: 6px; background: var(--bc, var(--c2)); }
@media (max-width: 560px) { .cols { grid-template-columns: minmax(0, 1fr); } .lane { grid-template-columns: 8.2em minmax(0, 1fr); } }
`;
const lane = (label, attrs, color) =>
  `<div class="lane"><code>${label}</code><div class="track"><i data-aos="grow" data-aos-anchor="#go" data-aos-anchor-placement="top-center" ${attrs} style="--bc:var(${color})"></i></div></div>`;
// Ping-pong just across the trigger: the anchor sits at 56vh, the trigger line is the 50vh centre.
const nearTrigger = (win) => [0, Math.round(win.innerHeight * 0.32)];

Showcase.run({ scenes: [
  {
    id: "catalog", title: "動畫目錄",
    api: 'AOS.init({ duration, easing, offset }) + data-aos="fade-up"',
    desc: "AOS 2.3.4 內建的 27 種動畫（fade 9、flip 4、slide 4、zoom 10）一次排開，只靠 data-aos 屬性與 CSS transition，捲進觸發點加上 aos-animate class。",
    hint: "在框內捲動或交給自動捲動；上方切換動畫家族",
    async mount(ctx) {
      const host = frameHost(ctx);
      const body = `<div class="wrap">
        <header class="hero"><div class="kicker">AOS · ANIMATE ON SCROLL</div><h1>捲到哪，動到哪</h1>
        <p class="muted">每張卡片只有一個 <code>data-aos</code> 屬性。捲進視窗觸發進場，往回捲到觸發點以下會倒退回原狀。</p></header>
        ${FAMILIES.map((fam) => `<section class="fam" data-fam="${fam.id}" style="--c:var(${fam.color})">
          <h2>${fam.id} <small>${fam.names.length} 種</small></h2>
          <div class="grid">${fam.names.map((n, i) => `<div class="card" data-aos="${n}" data-aos-delay="${(i % 3) * 100}"><b>${glyph(n)}</b><code>${n}</code></div>`).join("")}</div>
        </section>`).join("")}
        <p class="end muted">到底了，自動捲動會往回捲；往回捲時，掉到觸發點以下的卡片會倒退。</p></div>`;
      const css = `
        .hero { padding: 22px 0 8px; display: grid; gap: 6px; } .hero h1 { font-size: clamp(24px, 6vw, 38px); line-height: 1.15; }
        .fam { padding: 16px 0 6px; } .fam h2 { font-size: 15px; color: var(--c); margin-bottom: 10px; } .fam h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; perspective: 900px; }
        .card { height: 86px; border-radius: 12px; display: grid; place-items: center; align-content: center; gap: 4px;
          border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--c) 26%, var(--bg-2)), var(--bg-2)); }
        .card b { font-size: 24px; line-height: 1; color: var(--c); } .card code { color: var(--fg); }
        .end { padding: 30px 0 60px; text-align: center; }`;
      const { win, doc, AOS } = await aosFrame(ctx, host, { body, css, init: { duration: 700, easing: "ease-out-cubic", offset: 40 } });
      const auto = autoScroll(ctx, win, { speed: 90, rest: [1200, 1200] });
      ctx.group(["全部", "fade", "flip", "slide", "zoom"], 0, (i, label) => {
        doc.querySelectorAll(".fam").forEach((s) => { s.hidden = i > 0 && s.dataset.fam !== label; });
        AOS.refresh();
        auto.restart();
      });
      ctx.button("重播", () => auto.restart());
    },
  },
  {
    id: "timing", title: "時長與延遲",
    api: 'data-aos-duration="1200" ・ data-aos-delay="300"',
    desc: "所有色條共用同一個錨點（data-aos-anchor），捲過中線的同一格同時觸發；左欄只改 duration，右欄固定 600ms 只改 delay。色條是自訂的 grow 動畫，示範 AOS 可以搭配自己寫的 CSS。",
    hint: "自動捲動在觸發線上下來回，色條會反覆進場與退場",
    async mount(ctx) {
      const host = frameHost(ctx);
      const durs = [100, 300, 600, 1000, 1500, 2000, 3000];
      const delays = [0, 150, 300, 600, 900, 1200, 1500];
      const body = `<div class="hline" style="top:50%;--lc:var(--c1)"><span>觸發線 top-center</span></div><div class="wrap">
        <div class="intro"><div class="kicker">DURATION ・ DELAY</div><p class="muted">錨點頂端碰到視窗中線時，兩組色條同時開始。</p></div>
        <section class="cols" id="go">
          <div><h3>duration（delay 0）</h3>${durs.map((d) => lane(`${d}ms`, `data-aos-duration="${d}"`, "--c2")).join("")}</div>
          <div><h3>delay（duration 600ms）</h3>${delays.map((d) => lane(`+${d}ms`, `data-aos-duration="600" data-aos-delay="${d}"`, "--c3")).join("")}</div>
        </section></div>`;
      const { win } = await aosFrame(ctx, host, { body, css: LANE_CSS, init: { easing: "ease-out-cubic" } });
      const auto = autoScroll(ctx, win, { speed: 120, rest: [1400, 3600], range: nearTrigger });
      ctx.button("重播", () => auto.restart());
    },
  },
  {
    id: "easing", title: "easing 曲線",
    api: 'data-aos-easing="ease-in-out-back"',
    desc: "AOS 2.3.4 內建 20 種 easing，同一錨點同時觸發、同樣時長，只差緩動曲線；back 系列會先倒退或衝過頭。",
    hint: "拖動 duration 放慢比較；自動捲動會反覆觸發",
    async mount(ctx) {
      const host = frameHost(ctx);
      const half = EASINGS.length / 2;
      const col = (list) => list.map((e, i) => lane(e, `data-aos-easing="${e}" data-aos-duration="1600"`, ["--c2", "--c4", "--c6", "--c5"][Math.floor(i / 3) % 4])).join("");
      const body = `<div class="hline" style="top:50%;--lc:var(--c1)"><span>觸發線 top-center</span></div><div class="wrap">
        <div class="intro"><div class="kicker">EASING</div><p class="muted">20 條色條同一格開始，看誰先到、誰衝過頭。</p></div>
        <section class="cols" id="go"><div>${col(EASINGS.slice(0, half))}</div><div>${col(EASINGS.slice(half))}</div></section></div>`;
      const { win, doc } = await aosFrame(ctx, host, { body, css: LANE_CSS, init: {} });
      const auto = autoScroll(ctx, win, { speed: 120, rest: [1400, 2600], range: nearTrigger });
      ctx.slider("duration", { min: 400, max: 3000, step: 100, value: 1600, format: (v) => `${v}ms` }, (v) => {
        doc.querySelectorAll("[data-aos]").forEach((el) => el.setAttribute("data-aos-duration", v));
        auto.restart();
      });
    },
  },
  {
    id: "placement", title: "觸發位置",
    api: 'data-aos-anchor-placement="center-top" ・ data-aos-offset="120"',
    desc: "九種 anchor-placement 是「元素的哪一邊」碰到「視窗的哪一條線」才觸發；卡片左側色標對應右側同色的視窗線。最後兩張比較 offset 把觸發線往上推多少。",
    hint: "看卡片的色標碰到同色虛線那一刻才淡入",
    async mount(ctx) {
      const host = frameHost(ctx);
      const LINE = { top: "--c3", center: "--c1", bottom: "--c2" };
      const POS = { top: "0%", center: "50%", bottom: "100%" };
      const rows = [
        ["top-bottom", 0], ["center-bottom", 0], ["bottom-bottom", 0], ["top-center", 0], ["center-center", 0],
        ["bottom-center", 0], ["top-top", 0], ["center-top", 0], ["bottom-top", 0], ["top-bottom", 120], ["top-bottom", 240],
      ];
      const card = ([p, off]) => {
        const [el, win] = p.split("-");
        return `<div class="row"><div class="ghost"><i class="mark" style="top:${POS[el]};--lc:var(${LINE[win]})"></i>
          <div class="fill" data-aos="fade" data-aos-anchor-placement="${p}" data-aos-offset="${off}" style="--lc:var(${LINE[win]})"></div>
          <code>${p}${off ? ` ・ offset ${off}` : ""}</code><small>元素 ${el} 碰到視窗 ${win}${off ? ` 上方 ${off}px` : ""}</small></div></div>`;
      };
      const body = `
        <div class="hline" style="top:1px;--lc:var(--c3)"><span style="transform:translateY(20%)">視窗 top</span></div>
        <div class="hline" style="top:50%;--lc:var(--c1)"><span>視窗 center</span></div>
        <div class="hline" style="bottom:1px;--lc:var(--c2)"><span style="transform:translateY(-120%)">視窗 bottom</span></div>
        <div class="hline" style="bottom:120px;--lc:rgba(76,201,240,.55)"><span>bottom − 120</span></div>
        <div class="hline" style="bottom:240px;--lc:rgba(76,201,240,.4)"><span>bottom − 240</span></div>
        <div class="wrap"><div class="intro"><div class="kicker">ANCHOR PLACEMENT ・ OFFSET</div>
        <p class="muted">虛線框是元素的實際位置，色塊淡入代表 AOS 判定觸發。</p></div>${rows.map(card).join("")}<div class="tail"></div></div>`;
      const css = `
        .intro { padding: 22px 0 30vh; display: grid; gap: 6px; } .tail { height: 100vh; }
        .row { padding: 0 0 22vh; } .ghost { position: relative; height: 76px; max-width: 420px; border: 1px dashed rgba(255,255,255,.28); border-radius: 10px;
          display: flex; flex-direction: column; justify-content: center; padding: 0 16px 0 24px; }
        .ghost code, .ghost small { position: relative; z-index: 1; } .ghost small { color: var(--muted); font-size: 12px; }
        .fill { position: absolute; inset: 0; border-radius: 10px; background: color-mix(in srgb, var(--lc) 26%, var(--bg-2)); border: 1px solid var(--lc); }
        .mark { position: absolute; left: -1px; width: 14px; height: 4px; margin-top: -2px; border-radius: 2px; background: var(--lc); z-index: 2; }`;
      const { win } = await aosFrame(ctx, host, { body, css, init: { duration: 300, easing: "ease-out" } });
      const auto = autoScroll(ctx, win, { speed: 110, rest: [1000, 1000] });
      ctx.button("重播", () => auto.restart());
    },
  },
  {
    id: "once", title: "once 與重播",
    api: 'data-aos-once="true"',
    desc: "左欄 once: true 只進場一次；右欄是預設值，往回捲到觸發點以下會退場，再捲下來又重播。每張卡片的計數直接數 AOS 加上 aos-animate 的次數。",
    hint: "自動捲動會上下來回，比較兩欄的進場次數",
    async mount(ctx) {
      const host = frameHost(ctx);
      const names = ["zoom-in-up", "flip-left", "fade-up-right", "zoom-out", "slide-up", "flip-down", "fade-left", "zoom-in"];
      const item = (n, i, once) => `<div class="card" data-aos="${n}" ${once ? 'data-aos-once="true"' : ""} style="--c:var(${once ? "--c4" : "--c6"})">
        <code>${n}</code><b data-count>0</b><small>次進場</small></div>`;
      const body = `<div class="wrap"><div class="intro"><div class="kicker">ONCE</div><p class="muted">同樣的卡片，只差 data-aos-once。</p></div>
        <div class="cols"><h3 style="--c:var(--c4)">once: true</h3><h3 style="--c:var(--c6)">預設 once: false</h3>
        ${names.map((n, i) => item(n, i, true) + item(n, i, false)).join("")}</div><div class="tail"></div></div>`;
      const css = `
        .intro { padding: 22px 0 14px; display: grid; gap: 6px; } .tail { height: 40vh; }
        .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 18px; perspective: 900px; }
        .cols h3 { font-size: 14px; color: var(--c); position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 6px 0; margin: 0; }
        .card { height: 120px; border-radius: 12px; display: grid; place-items: center; align-content: center; gap: 2px;
          border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 18%, var(--bg-2)); }
        .card b { font: 700 30px/1 ${MONO}; color: var(--c); } .card small { color: var(--muted); font-size: 12px; }`;
      const { win, doc } = await aosFrame(ctx, host, { body, css, init: { duration: 600, easing: "ease-out-back", offset: 60 } });
      const seen = new WeakSet();
      const mo = new win.MutationObserver((list) => {
        for (const m of list) {
          const el = m.target, on = el.classList.contains("aos-animate");
          if (on && !seen.has(el)) { seen.add(el); const c = el.querySelector("[data-count]"); c.textContent = +c.textContent + 1; }
          if (!on) seen.delete(el);
        }
      });
      doc.querySelectorAll("[data-aos]").forEach((el) => {
        if (el.classList.contains("aos-animate")) { seen.add(el); el.querySelector("[data-count]").textContent = "1"; }
        mo.observe(el, { attributes: true, attributeFilter: ["class"] });
      });
      ctx.onCleanup(() => mo.disconnect());
      const auto = autoScroll(ctx, win, { speed: 160, rest: [900, 900] });
      ctx.button("重播", () => auto.restart());
    },
  },
  {
    id: "mirror", title: "mirror 與事件",
    api: "AOS.init({ mirror }) + document.addEventListener('aos:in', …)",
    desc: "mirror 與 aos:in／aos:out 事件只在 AOS 3 測試版提供，這個場景改載 aos@3.0.0-beta.6。mirror: true 的卡片捲過頂端也會退場，下方紀錄來自 document 上的 aos:in／aos:out 事件。",
    hint: "看第三欄卡片離開頂端時退場，事件紀錄即時更新",
    async mount(ctx) {
      const host = frameHost(ctx);
      const modes = [["once", 'data-aos-once="true"', "--c4"], ["預設", "", "--c2"], ["mirror", 'data-aos-mirror="true"', "--c3"]];
      const body = `<div class="wrap"><div class="intro"><div class="kicker">AOS 3.0.0-beta.6</div><p class="muted">三欄只差 once 與 mirror；數字是收到的 aos:in／aos:out 事件次數。</p></div>
        <div class="cols">${modes.map(([m, , c]) => `<h3 style="--c:var(${c})">${m}</h3>`).join("")}
        ${Array.from({ length: 9 }, (_, i) => modes.map(([m, attr, c]) =>
          `<div class="card" data-aos="fade-up" ${attr} data-name="${m} #${i + 1}" style="--c:var(${c})"><code>#${i + 1}</code><span>in <b data-in>0</b>・out <b data-out>0</b></span></div>`).join("")).join("")}
        </div><div class="tail"></div></div><div class="log" aria-live="polite"></div>`;
      const css = `
        .intro { padding: 22px 0 14px; display: grid; gap: 6px; } .tail { height: 140px; }
        .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 30px 12px; }
        .cols h3 { font-size: 14px; color: var(--c); position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 6px 0; }
        .card { height: 110px; border-radius: 12px; display: grid; place-items: center; align-content: center; gap: 4px; text-align: center;
          border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 18%, var(--bg-2)); }
        .card span { font: 500 12px/1.3 ${MONO}; color: var(--muted); } .card b { color: var(--c); }
        .log { position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 20; height: 104px; overflow: hidden; padding: 6px 10px; border-radius: 10px;
          background: rgba(18,20,24,.9); border: 1px solid var(--line); font: 500 11.5px/1.5 ${MONO}; }
        .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .log .in { color: var(--c4); } .log .out { color: var(--c3); }`;
      // Listeners go on before AOS.init so the cards already in view at load are counted too.
      const before = (win, doc) => {
        const log = doc.querySelector(".log");
        let lastY = win.scrollY;
        const onEvent = (type) => (e) => {
          const el = e.detail;
          if (!el || !el.dataset || !el.dataset.name) return;
          const b = el.querySelector(type === "in" ? "[data-in]" : "[data-out]");
          b.textContent = +b.textContent + 1;
          const dir = win.scrollY > lastY ? "↓" : win.scrollY < lastY ? "↑" : "・";
          lastY = win.scrollY;
          log.prepend(Showcase.h("div", { class: type, text: `aos:${type.padEnd(3)} ${dir} ${el.dataset.name}` }));
          while (log.children.length > 6) log.lastChild.remove();
        };
        doc.addEventListener("aos:in", onEvent("in"));
        doc.addEventListener("aos:out", onEvent("out"));
      };
      const { win } = await aosFrame(ctx, host, { body, css, v3: true, before, init: { duration: 500, offset: 60 } });
      const auto = autoScroll(ctx, win, { speed: 140, rest: [900, 900] });
      ctx.button("重播", () => auto.restart());
    },
  },
  {
    id: "anchor", title: "固定元素錨點",
    api: 'data-aos-anchor="#ch-3" data-aos-anchor-placement="top-center"',
    desc: "右側章節標籤與「回到頂端」按鈕都是 position: fixed，自己不會移動，所以用 data-aos-anchor 改看各章節的位置來觸發，這是 README 建議的固定元素用法。",
    hint: "章節標題碰到中線時，右側對應標籤滑入",
    async mount(ctx) {
      const host = frameHost(ctx);
      const stops = [
        ["基隆", "雨港與廟口夜市，北部海岸線的起點。", "--c2"],
        ["臺北", "盆地裡的首都，捷運把城市串成一張網。", "--c1"],
        ["臺中", "四季溫和，國家歌劇院與綠園道。", "--c4"],
        ["臺南", "府城老街與小吃，台灣最早開發的城市之一。", "--c5"],
        ["高雄", "港灣城市，輕軌沿著水岸繞一圈。", "--c3"],
      ];
      const body = `<div class="hline" style="top:50%;--lc:var(--c1)"><span style="left:8px;right:auto">top-center</span></div>
        <nav class="rail">${stops.map(([n, , c], i) => `<a data-aos="fade-left" data-aos-anchor="#ch-${i + 1}" data-aos-anchor-placement="top-center" style="--c:var(${c})">${i + 1}・${n}</a>`).join("")}</nav>
        <button class="top" type="button" data-aos="zoom-in" data-aos-anchor="#ch-2" data-aos-anchor-placement="top-center">↑ 回到頂端</button>
        <div class="wrap"><div class="intro"><div class="kicker">DATA-AOS-ANCHOR</div><h2>沿西部走廊南下</h2><p class="muted">五個章節，右側標籤是固定定位，跟著章節觸發。</p></div>
        ${stops.map(([n, t, c], i) => `<section class="ch" id="ch-${i + 1}" style="--c:var(${c})"><span class="mono">第 ${i + 1} 站</span><h2>${n}</h2><p class="muted">${t}</p></section>`).join("")}
        <div class="tail"></div></div>`;
      const css = `
        .intro { padding: 26px 0 0; height: 62vh; display: grid; align-content: start; gap: 6px; } .intro h2 { font-size: 24px; }
        .ch { min-height: 80vh; padding-right: 128px; border-top: 2px solid var(--c); padding-top: 12px; } .ch .mono { color: var(--c); } .ch h2 { font-size: 30px; }
        .tail { height: 50vh; }
        .rail { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); display: grid; gap: 6px; z-index: 25; }
        .rail a { display: block; padding: 6px 12px; border-radius: 999px; font-size: 13px; color: var(--bg); background: var(--c); font-weight: 700; white-space: nowrap; }
        .top { position: fixed; right: 10px; bottom: 12px; z-index: 25; appearance: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px;
          background: var(--bg-2); color: var(--fg); font: 600 13px/1 ${FONT}; cursor: pointer; }
        @media (max-width: 480px) { .ch { padding-right: 96px; } .rail a { padding: 5px 9px; font-size: 12px; } }`;
      const { win, doc } = await aosFrame(ctx, host, { body, css, init: { duration: 500, easing: "ease-out-cubic" } });
      const auto = autoScroll(ctx, win, { speed: 120, rest: [1000, 1200] });
      doc.querySelector(".top").addEventListener("click", () => auto.restart());
      ctx.button("重播", () => auto.restart());
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "AOS.refreshHard() + window scroll（throttle 99ms）",
    desc: "框內持續快速來回捲動，逐級增加 data-aos 元素數量。每次捲動事件 AOS 都會走訪全部元素比對位置並切換 class，進出場的元素再各自跑 CSS transition。",
    hint: "按「自動加壓」開始；調整捲動速度可改變每秒進出場的元素量",
    async mount(ctx) {
      ctx.html(`<div class="stress-frame"></div>`);
      // Spacers above and below keep part of the grid below the trigger line at every count.
      const css = `.grid { display: grid; grid-template-columns: repeat(auto-fill, 22px); gap: 4px; padding: 55vh 8px 45vh; justify-content: center; }
        .grid i { width: 22px; height: 22px; border-radius: 5px; background: var(--c); }`;
      const { win, doc, AOS } = await aosFrame(ctx, ctx.$(".stress-frame"), {
        body: `<div class="grid"></div>`, css, init: { duration: 400, offset: 0, disableMutationObserver: true },
      });
      const grid = doc.querySelector(".grid");
      const anims = ["fade-up", "zoom-in", "flip-left", "fade-right", "zoom-out", "flip-up"];
      const cols = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];
      let refreshMs = 0, count = 0;
      ctx.controls.classList.add("bottom");
      const auto = autoScroll(ctx, win, { speed: 900, rest: [150, 150] });
      ctx.slider("捲動速度", { min: 200, max: 3000, step: 100, value: 900, format: (v) => `${v}px/s` }, (v) => { auto.speed = v; });
      ctx.ramp({
        label: "AOS 元素", steps: [250, 500, 1000, 2000, 4000, 8000, 16000, 32000],
        minFps: 30,
        apply(n) {
          count = n;
          let html = "";
          for (let i = 0; i < n; i++) html += `<i data-aos="${anims[i % 6]}" style="--c:var(${cols[(i * 7) % 6]})"></i>`;
          grid.innerHTML = html;
          const t0 = performance.now();
          AOS.refreshHard();
          refreshMs = performance.now() - t0;
          auto.sync();
        },
        metrics: () => ({ "refreshHard": Showcase.fmtMs(refreshMs), "已進場": count ? doc.querySelectorAll(".aos-animate").length : 0 }),
        note: "瓶頸有兩段：refreshHard 要逐一讀取元素的 offsetTop（強制版面計算）；捲動時每 99ms 走訪全部元素，進出場的元素越多，CSS transition 與重繪越重。動畫種類（flip 有 3D）與捲動速度都會影響結果。",
      });
    },
  },
] });
</script>
</body>
</html>
