<script>
// Apache ECharts showcase: map dashboard, series gallery, dataset transforms, zoom/marks, universal transition,
// geo lines, renderers/themes and a per-frame setOption stress ramp.
const css = getComputedStyle(document.documentElement);
const PAL = ["--c2", "--c1", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim();
const MONO = css.getPropertyValue("--mono").trim();
const FG = "#ecebe6", MUTED = "#9b998f", ACC = "#f7df1e";
const nf = new Intl.NumberFormat("zh-TW");
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Call fn({ width, height }) now and whenever el changes size.
function fit(ctx, el, fn) {
  let w = -1, h = -1, queued = 0;
  const run = () => {
    queued = 0;
    const r = el.getBoundingClientRect(), width = Math.round(r.width), height = Math.round(r.height);
    if (width < 20 || height < 20 || (width === w && height === h)) return;
    w = width; h = height;
    fn({ width, height });
  };
  const ro = new ResizeObserver(() => { if (!queued) queued = requestAnimationFrame(run); });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(queued); });
  run();
}
// echarts.init bound to the scene lifecycle: disposed on cleanup, resized with its box.
// The first onFit is deferred to a microtask so callers can reference the returned chart inside it.
function mk(ctx, el, onFit, { theme = "dark", renderer = "canvas" } = {}) {
  const chart = echarts.init(el, theme, { renderer });
  ctx.onCleanup(() => chart.dispose());
  let sync = true;
  fit(ctx, el, (s) => {
    chart.resize();
    if (!onFit) return;
    if (sync) queueMicrotask(() => ctx.active && onFit(s));
    else onFit(s);
  });
  sync = false;
  return chart;
}
const TIP = { backgroundColor: "rgba(18,20,24,.94)", borderColor: "rgba(255,255,255,.15)", confine: true, textStyle: { color: FG, fontFamily: FONT, fontSize: 12 } };
const AX = { axisLine: { lineStyle: { color: "rgba(255,255,255,.22)" } }, axisTick: { show: false },
  axisLabel: { color: MUTED, fontSize: 10 }, splitLine: { lineStyle: { color: "rgba(255,255,255,.07)" } }, nameTextStyle: { color: MUTED, fontSize: 10 } };
const ax = (o = {}) => ({ ...AX, ...o, axisLabel: { ...AX.axisLabel, ...o.axisLabel } });
const base = (o) => ({ backgroundColor: "transparent", color: PAL, textStyle: { fontFamily: FONT }, ...o });
const MONTHS = Array.from({ length: 12 }, (_, i) => `${i + 1}月`);

// ---------- shared Taiwan data (illustrative, rounded) ----------

  I: "嘉義市", J: "新竹縣", K: "苗栗縣", M: "南投縣", N: "彰化縣", O: "新竹市", P: "雲林縣", Q: "嘉義縣", T: "屏東縣",
  U: "花蓮縣", V: "臺東縣", W: "金門縣", X: "澎湖縣", Z: "連江縣" };
const ID_OF = Object.fromEntries(Object.entries(NAMES).map(([k, v]) => [v, k]));
const VALUES = {
  rain: { A: 2400, B: 1700, C: 3700, D: 1750, E: 1900, F: 2700, G: 2800, H: 1800, I: 1850, J: 1750, K: 1700, M: 2300, N: 1300,
    O: 1700, P: 1250, Q: 1950, T: 2500, U: 2150, V: 1850, W: 1050, X: 1000, Z: 1150 },

    O: 22.8, P: 23.2, Q: 23.4, T: 25.3, U: 23.7, V: 24.8, W: 21.4, X: 23.5, Z: 19.4 },
  dens: { A: 9400, B: 1300, C: 2700, D: 850, E: 930, F: 1950, G: 210, H: 1890, I: 4500, J: 410, K: 300, M: 120, N: 1180,
    O: 4400, P: 520, Q: 255, T: 290, U: 70, V: 60, W: 940, X: 840, Z: 470 },
};
const META = {
  rain: { title: "年雨量", unit: "mm", colors: ["#0b2a3c", "#126e8f", "#4cc9f0", "#bdf2ff"] },
  temp: { title: "年均溫", unit: "°C", colors: ["#2b1d5c", "#9d8cff", "#ff8c42", "#f7df1e"] },
  dens: { title: "人口密度", unit: "人/km²", colors: ["#1d2a1f", "#2f7d4f", "#7bd389", "#f7df1e"],
    pieces: [{ lt: 200 }, { gte: 200, lt: 500 }, { gte: 500, lt: 1000 }, { gte: 1000, lt: 2000 }, { gte: 2000, lt: 5000 }, { gte: 5000 }] },
};
const REGIONS = ["北部", "中部", "南部", "東部", "離島"];
// Population in 10k people and area in km2 (approximate).
const POP = { 北部: { 新北市: 405, 臺北市: 249, 桃園市: 232, 新竹縣: 59, 新竹市: 46, 宜蘭縣: 45, 基隆市: 36 },
  中部: { 臺中市: 286, 彰化縣: 123, 雲林縣: 66, 苗栗縣: 53, 南投縣: 47 },
  南部: { 高雄市: 273, 臺南市: 186, 屏東縣: 79, 嘉義縣: 48, 嘉義市: 26 },
  東部: { 花蓮縣: 32, 臺東縣: 21 }, 離島: { 金門縣: 14, 澎湖縣: 11, 連江縣: 1.4 } };
const AREA = { 臺北市: 272, 新北市: 2053, 桃園市: 1221, 新竹縣: 1428, 新竹市: 104, 宜蘭縣: 2144, 基隆市: 133, 臺中市: 2215, 彰化縣: 1074,
  雲林縣: 1291, 苗栗縣: 1820, 南投縣: 4106, 高雄市: 2952, 臺南市: 2192, 屏東縣: 2776, 嘉義縣: 1904, 嘉義市: 60, 花蓮縣: 4629,
  臺東縣: 3515, 金門縣: 152, 澎湖縣: 127, 連江縣: 29 };
const REG_COLOR = { 北部: PAL[0], 中部: PAL[3], 南部: PAL[4], 東部: PAL[5], 離島: PAL[2] };
const REGION_OF = {}, POP_OF = {};
for (const r of REGIONS) for (const [n, v] of Object.entries(POP[r])) { REGION_OF[n] = r; POP_OF[n] = v; }
const COUNTY_LIST = Object.keys(REGION_OF);
const TOTALS = REGIONS.map((r) => Math.round(sum(POP[r])));
const TPE_T = [16.1, 16.5, 18.5, 21.9, 25.2, 27.7, 29.6, 29.2, 27.4, 24.5, 21.5, 17.9];
const KHH_T = [19.3, 20.3, 22.6, 25.3, 27.6, 28.6, 29.2, 28.7, 28.1, 26.8, 24.2, 20.8];

// Kinmen and Matsu are moved closer as insets so the main island stays large.
const SHIFT = { W: [0.95, 0.5], Z: [-0.2, -0.6] };
const shiftCoords = (c, [dx, dy]) => (typeof c[0] === "number" ? [c[0] + dx, c[1] + dy] : c.map((x) => shiftCoords(x, [dx, dy])));
let TW = null;
async function loadTaiwan(ctx) {
  if (TW) return TW;
  await ctx.load("https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js");
  const res = await fetch("https://cdn.jsdelivr.net/npm/taiwan-atlas@2021.9.20/counties-10t.json", { signal: ctx.signal });
  if (!res.ok) throw new Error(`地圖資料載入失敗（HTTP ${res.status}）`);
  const topo = await res.json();
  const geo = topojson.feature(topo, topo.objects.counties);
  geo.features.forEach((f) => {
    const id = f.properties.COUNTYID;
    f.properties = { name: NAMES[id] || f.properties.COUNTYNAME };
    if (SHIFT[id]) f.geometry.coordinates = shiftCoords(f.geometry.coordinates, SHIFT[id]);
  });
  echarts.registerMap("taiwan", geo);
  TW = geo;
  return TW;
}

// ---------- gallery data ----------
const COMMUTE = (() => {
  const r = rng(21), g = () => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r());
  return [["臺北", 38, 11], ["新北", 47, 15], ["桃園", 36, 13], ["臺中", 31, 10], ["高雄", 33, 11]].map(([name, m, sd]) => ({
    name, samples: Array.from({ length: 70 }, () => Math.max(5, Math.round(m + g() * sd + (r() < 0.04 ? 35 : 0)))),
  }));
})();
const HEAT = (() => {
  const pk = (h, c, w) => Math.exp(-(((h - c) / w) ** 2) / 2), out = [];
  for (let d = 0; d < 7; d++) for (let h = 0; h < 24; h++) {
    const v = h < 6 ? 0 : d < 5 ? 12 + 100 * pk(h, 8, 1.1) + 85 * pk(h, 18, 1.4) + 15 * pk(h, 12.5, 2)
      : 10 + 45 * pk(h, 15, 3.2) + (d === 5 ? 18 * pk(h, 21, 1.5) : 0);
    out.push([h, d, Math.round(v)]);
  }
  return out;
})();
const KLINE = (() => {
  const r = rng(5), dates = [], ohlc = [], day = new Date(2025, 8, 1);
  let p = 22000;
  while (ohlc.length < 30) {
    if (day.getDay() % 6) {
      const o = p, c = o * (1 + (r() - 0.47) * 0.026);
      ohlc.push([o, c, Math.min(o, c) * (1 - r() * 0.008), Math.max(o, c) * (1 + r() * 0.008)].map(Math.round));
      dates.push(`${day.getMonth() + 1}/${day.getDate()}`);
      p = c;
    }
    day.setDate(day.getDate() + 1);
  }
  const ma5 = ohlc.map((_, i) => (i < 4 ? "-" : Math.round(ohlc.slice(i - 4, i + 1).reduce((a, k) => a + k[1], 0) / 5)));
  return { dates, ohlc, ma5 };
})();
const EC_GRAPH = (() => {
  const groups = [["座標系", ["grid", "polar", "geo", "calendar", "parallel", "singleAxis"]], ["元件", ["tooltip", "legend", "dataZoom", "visualMap", "toolbox", "timeline"]],
    ["系列", ["line", "bar", "pie", "scatter", "map", "graph", "sankey"]]];
  const nodes = [{ name: "ECharts", category: 0, symbolSize: 26 }], links = [];
  groups.forEach(([g, kids], i) => {
    nodes.push({ name: g, category: i + 1, symbolSize: 17 });
    links.push({ source: "ECharts", target: g });
    kids.forEach((k) => { nodes.push({ name: k, category: i + 1, symbolSize: 8 }); links.push({ source: g, target: k }); });
  });
  links.push({ source: "dataZoom", target: "grid" }, { source: "map", target: "geo" }, { source: "visualMap", target: "map" }, { source: "bar", target: "polar" });
  return { nodes, links, categories: [{ name: "核心" }, ...groups.map(([g]) => ({ name: g }))] };
})();
const STEPS = (() => {
  const r = rng(3), out = [];
  for (let d = new Date(2025, 0, 1); d.getMonth() < 6; d.setDate(d.getDate() + 1)) {
    const iso = `2025-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    out.push([iso, Math.round((d.getDay() % 6 ? 6500 : 9500) + (r() - 0.4) * 6000)]);
  }
  return out;
})();
const RIVER = (() => {
  const r = rng(8), topics = { 颱風: [6, 9, 70], 棒球: [19, 4, 45], 半導體: [10, 8, 25], 美食: [0, 40, 0], 演唱會: [14, 3, 35] }, out = [];
  for (let w = 0; w < 22; w++) {
    const d = new Date(2025, 5, 2 + w * 7), iso = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
    for (const [name, [c, wd, amp]] of Object.entries(topics)) {
      const v = 12 + (name === "美食" ? 8 : 0) + amp * Math.exp(-(((w - c) / (name === "美食" ? 99 : wd)) ** 2)) + r() * 6;
      out.push([iso, Math.round(v), name]);
    }
  }
  return out;
})();
const POP_TREE = REGIONS.map((r) => ({ name: r, itemStyle: { color: REG_COLOR[r] },
  children: Object.entries(POP[r]).map(([name, value]) => ({ name, value })) }));
const REGION_SERIES = (row) => REGIONS.map((r) => ({ name: r, color: REG_COLOR[r], data: COUNTY_LIST.filter((n) => REGION_OF[n] === r).map(row) }));

// Four charts per page; opt(small) returns the page-specific part of the option.
// In small cells the legend drops below the caption so the two never overlap.
const LG = (s) => ({ right: 8, top: s ? 22 : 5, itemWidth: 10, itemHeight: 8, itemGap: s ? 6 : 10, textStyle: { color: MUTED, fontSize: s ? 9 : 10 } });
const GT = (s) => (s ? 46 : 34);
const GALLERY = [
  { page: "基本", items: [

      series: [["門市", [320, 280, 300, 410]], ["電商", [180, 220, 260, 390]], ["批發", [120, 130, 110, 150]]].map(([name, data], i) => ({

        label: { color: FG, fontSize: s ? 9 : 11 }, labelLine: { length: 4, length2: 6 },

        { fromDatasetIndex: 1, fromTransformResult: 1 }],

      xAxis: ax({ type: "category", axisLabel: { color: FG } }), yAxis: ax({ type: "value" }),

      grid: { left: 34, right: 10, top: 30, bottom: 22 },
      xAxis: ax({ type: "category", data: Array.from({ length: 24 }, (_, i) => String(i)), splitArea: { show: false }, axisLabel: { interval: s ? 5 : 2 } }),

// ---------- scene 4 data: daily mean temperature for Taipei, 2025 (illustrative) ----------
const TEMP = (() => {
  const r = rng(11), out = [];
  let noise = 0;
  for (let d = 0; d < 365; d++) {
    const seasonal = 23.3 - 7.4 * Math.cos((2 * Math.PI * (d - 25)) / 365);
    noise = noise * 0.72 + (r() - 0.5) * 2.6;
    const cold = d >= 20 && d <= 28 ? -6.5 * Math.sin((Math.PI * (d - 19)) / 10) : 0;
    out.push([new Date(2025, 0, 1 + d).getTime(), +(seasonal + noise + cold).toFixed(1)]);
  }
  return out;
})();

      const RINGS = 24;
      let mode = 0, chart = null, n = 0, aspect = 1, cost = 0;
      let bx = new Float32Array(0), by = new Float32Array(0), ring = new Uint8Array(0), buf = new Float32Array(0);
      ctx.group(MODES.map((m) => m.label), 0, (i) => { mode = i; create(); });
      ctx.onCleanup(() => chart && chart.dispose());
      fit(ctx, box, ({ width, height }) => {
        aspect = width / height;
        if (chart) { chart.resize(); chart.setOption({ xAxis: { min: -1.08 * aspect, max: 1.08 * aspect } }); }
      });
      create();

      function create() {
        if (chart) chart.dispose();
        const m = MODES[mode];
        chart = echarts.init(box, "dark", { renderer: m.renderer });
        chart.setOption({
          backgroundColor: "transparent", animation: false, grid: { left: 0, right: 0, top: 0, bottom: 0 },
          xAxis: { type: "value", min: -1.08 * aspect, max: 1.08 * aspect, show: false }, yAxis: { type: "value", min: -1.08, max: 1.08, show: false },
          series: [{ id: "pts", type: "scatter", large: m.large, largeThreshold: 1, progressive: 0, silent: true, dimensions: ["x", "y"], symbolSize: 2.4,
            itemStyle: { color: PAL[0], opacity: 0.55 }, data: buf.subarray(0, n * 2) }],
        });
      }
      // Spiral galaxy: base positions plus a ring index that sets each point's angular speed.
      function setCount(count) {
        const r = rng(count);
        bx = new Float32Array(count); by = new Float32Array(count); ring = new Uint8Array(count); buf = new Float32Array(count * 2);
        for (let i = 0; i < count; i++) {
          const rad = Math.pow(r(), 0.7), arm = (i % 3) * ((2 * Math.PI) / 3), a = arm + rad * 5 + (r() - 0.5) * (0.9 - rad * 0.5);
          bx[i] = Math.cos(a) * rad; by[i] = Math.sin(a) * rad; ring[i] = Math.min(RINGS - 1, Math.floor(rad * RINGS));
        }
        n = count;
      }
      const cs = new Float32Array(RINGS), sn = new Float32Array(RINGS);
      ctx.raf((t) => {
        if (!n || !chart) return;
        for (let k = 0; k < RINGS; k++) { const a = (t / 1000) * (0.9 / (0.25 + k / RINGS)); cs[k] = Math.cos(a); sn[k] = Math.sin(a); }
        for (let i = 0, j = 0; i < n; i++, j += 2) { const k = ring[i]; buf[j] = bx[i] * cs[k] - by[i] * sn[k]; buf[j + 1] = bx[i] * sn[k] + by[i] * cs[k]; }
        const t0 = performance.now();
        chart.setOption({ series: [{ id: "pts", data: buf }] });
        cost = cost * 0.8 + (performance.now() - t0) * 0.2;
      });
      ctx.ramp({
        label: "資料點", steps: [1000, 5000, 20000, 50000, 100000, 200000, 500000, 1000000, 2000000],
        apply: setCount,
        metrics: () => ({ 模式: MODES[mode].label, "setOption 耗時": `${cost.toFixed(1)} ms`, ...(MODES[mode].renderer === "svg" ? { "DOM 節點": box.getElementsByTagName("*").length } : {}) }),
        note: "每一格先在 JS 端旋轉所有點，再把整個 Float32Array 交給 setOption（animation 關閉、progressive: 0 讓整批在同一格畫完），所以量到的是資料處理加繪製的總成本。large 模式把所有點合成一條路徑批次繪製；逐點圖形為每個點建立一個 zrender 圖元；SVG 每個點是一個 DOM 節點。靜態大量資料在實務上可改用 progressive 分批或 appendData。",
      });
    },
  },
] });
</script>
</body>
</html>
