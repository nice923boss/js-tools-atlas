<style>
  .ap-card { position: relative; min-height: 0; min-width: 0; padding: 8px 10px 4px; display: flex; flex-direction: column; overflow: hidden; }
  .ap-card h2 { margin: 0 0 2px; font-size: 12.5px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; overflow: hidden; }
  .ap-card h2 .ap-ttl { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ap-card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .ap-card h2 code { font: 500 10.5px/1 var(--mono); color: var(--muted); margin-left: 6px; }
  .ap-card h2 .ap-read { margin-left: auto; max-width: 100%; font-size: 11.5px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ap-read b { color: var(--accent); font-weight: 600; }
  .ap-read code { margin: 0; }
  .ap-box { position: relative; flex: 1; min-height: 0; }
  .ap-fill { position: absolute; inset: 0; }
  .ap-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px; }
  .ap-tag { position: absolute; z-index: 5; pointer-events: none; padding: 4px 9px; border-radius: 7px; font-size: 11.5px; color: var(--muted);
    background: rgba(14,16,19,.82); border: 1px solid var(--line); }
  .ap-tag b { color: var(--accent); font-weight: 600; }
  .ap-tag code, .ap-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* 1. dashboard */
  .ap-board { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "kpi kpi" "live gauge" "live top"; }
  .ap-board .ap-live { grid-area: live; } .ap-board .ap-gauge { grid-area: gauge; } .ap-board .ap-top { grid-area: top; }
  .ap-kpis { grid-area: kpi; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .ap-kpi { padding: 7px 12px; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .ap-kpi .ap-txt { min-width: 92px; }
  .ap-kpi b { display: block; font: 700 20px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
  .ap-kpi span { font-size: 11px; color: var(--muted); }
  .ap-kpi .ap-spark { flex: 1; min-width: 0; height: 36px; }
  .ap-top .apexcharts-datalabels { opacity: 1 !important; }
  @media (max-width: 760px) {
    .ap-board { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "kpi kpi" "live gauge"; }
    .ap-board .ap-top { display: none; }
    .ap-kpi { padding: 5px 8px; } .ap-kpi .ap-txt { min-width: 0; } .ap-kpi b { font-size: 15px; } .ap-kpi .ap-spark { display: none; }
  }
  @media (max-width: 520px) {
    .ap-board { gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1.25fr) minmax(0, 1fr); grid-template-areas: "kpi" "live" "gauge"; }
    .ap-kpis { gap: 6px; }
  }

  /* 2. gallery */
  .ap-gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; }
  @media (max-width: 760px) {
    .ap-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: 180px; overflow-y: auto; }
  }

  /* shared single / split layouts */
  .ap-solo { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  .ap-brush { grid-template-rows: minmax(0, 1fr) minmax(130px, 0.42fr); }
  @media (max-height: 520px) { .ap-brush .ap-nav h2 { display: none; } }
  .ap-split { grid-template-columns: minmax(0, 1fr) minmax(0, 250px); }
  @media (max-width: 760px) { .ap-split { grid-template-columns: minmax(0, 1fr) minmax(0, 190px); } }
  @media (max-width: 560px) {
    .ap-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr); }
  }

  /* 7. theme + export */
  .ap-card.ap-light { background: #f6f5f1; border-color: rgba(0,0,0,.1); color: #1c1c1a; }
  .ap-card.ap-light h2 small { color: #6d6b64; }
  .ap-export { display: flex; flex-direction: column; gap: 6px; }
  .ap-export .ap-shot { flex: 1; min-height: 0; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; overflow: hidden;
    background: repeating-conic-gradient(#20242b 0 25%, #191c22 0 50%) 0 0 / 16px 16px; color: var(--muted); font-size: 12px; text-align: center; padding: 6px; }
  .ap-export .ap-shot.ap-on-light { background: repeating-conic-gradient(#ecebe6 0 25%, #f6f5f1 0 50%) 0 0 / 16px 16px; }
  .ap-export img { max-width: 100%; max-height: 100%; display: block; }
  .ap-export dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 11.5px; }
  .ap-export dt { color: var(--muted); }
  .ap-export dd { margin: 0; text-align: right; }
  @media (max-width: 560px) {
    .ap-export { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); gap: 4px 12px; }
    .ap-export h2 { grid-column: 1 / -1; }
    .ap-export dl { align-self: center; }
  }

  /* 8. stress */
  .ap-stress { position: absolute; inset: 8px 8px 8px 350px; padding: 8px 10px 4px; }
  .ap-stress .ap-tag { left: 14px; top: 10px; }
  @media (max-width: 760px) { .ap-stress { inset: 8px; opacity: .9; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@7.8.0/dist/apexcharts.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// ApexCharts showcase: eight scenes from a live dashboard to an SVG vs Canvas renderer benchmark.
const { fmt, fmtCompact, fmtMs } = Showcase;
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim();
const MUTED = "#9b998f";
const GRID = "rgba(255,255,255,0.07)";
const CANVAS_FEATURE = "https://cdn.jsdelivr.net/npm/apexcharts@7.8.0/dist/features/renderer-canvas.js";

// Traditional Chinese locale (same strings as dist/locales/zh-tw.json), inlined to avoid a fetch.
const ZH = { name: "zh-tw", options: {
  months: ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"],
  shortMonths: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"],
  days: ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"],
  shortDays: ["週日", "週一", "週二", "週三", "週四", "週五", "週六"],
  toolbar: { exportToSVG: "下載 SVG", exportToPNG: "下載 PNG", exportToCSV: "下載 CSV", menu: "選單", selection: "選擇",
    selectionZoom: "選取縮放", zoomIn: "放大", zoomOut: "縮小", pan: "平移", reset: "重置縮放" },
} };

// Global defaults merged into every chart (window.Apex is ApexCharts' documented global config).
window.Apex = {
  chart: { locales: [ZH], defaultLocale: "zh-tw", fontFamily: FONT, foreColor: MUTED, background: "transparent",
    toolbar: { show: false }, parentHeightOffset: 0 },
  theme: { mode: "dark" },
  grid: { borderColor: GRID, padding: { left: 6, right: 8 } },
  xaxis: { labels: { datetimeFormatter: { year: "yyyy", month: "yyyy/M", day: "M/d", hour: "HH:mm" } } },
  tooltip: { theme: "dark" },
  dataLabels: { enabled: false },
  legend: { fontSize: "11px", labels: { colors: MUTED }, markers: { size: 5 } },
};

// Seeded random so the static scenes look the same on every visit.
function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }
const DAY = 864e5;
const md = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
const ymd = (t) => { const d = new Date(t); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const MONTHS = Array.from({ length: 12 }, (_, i) => `${i + 1}月`);

// A titled chart card; `read` adds a right-aligned live readout to the title row.
const card = (cls, title, sub = "", read = "") =>
  `<div class="panel ap-card ${cls}"><h2><span class="ap-ttl">${title}${sub}</span>${read ? `<span class="ap-read">${read}</span>` : ""}</h2>` +
  `<div class="ap-box"><div class="ap-fill"></div></div></div>`;
const small = (t) => `<small>${t}</small>`;
const code = (t) => `<code>${t}</code>`;

// The control bar publishes --sc-ctl-h from a ResizeObserver after the first layout; waiting two frames
// lets the card reach its final height first. Animated charts otherwise draw at the taller pre-controls
// size and only snap to fit once their intro animation ends.
const afterLayout = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

// Create + render a chart that is destroyed with the scene; `defer` waits for afterLayout() first.
function make(ctx, el, opts, { defer = false } = {}) {
  const chart = new ApexCharts(el, opts);
  let alive = true, rendered = false;
  const render = () => { if (!alive) return; rendered = true; return chart.render(); };
  chart.ready = defer ? afterLayout().then(render) : render();
  chart.dispose = () => { if (alive) { alive = false; if (rendered) chart.destroy(); } };
  ctx.onCleanup(chart.dispose);
  return chart;
}

// Daily metro ridership (10k trips): weekday/weekend rhythm, Lunar New Year dip, slow seasonal drift.
function ridership(days, seed = 7) {
  const r = rng(seed), t0 = Date.UTC(2024, 0, 1);
  return Array.from({ length: days }, (_, i) => {
    const t = t0 + i * DAY, dow = new Date(t).getUTCDay();
    let v = dow === 0 ? 150 : dow === 6 ? 175 : 215;
    v += Math.sin((i / 365) * Math.PI * 2 - 1.2) * 10 + (r() - 0.5) * 14;
    if (i >= 38 && i <= 45) v -= 70;          // Lunar New Year 2024
    if (i >= 365 + 26 && i <= 365 + 34) v -= 70; // Lunar New Year 2025
    return [t, Math.round(v * 10) / 10];
  });
}

Showcase.run({ scenes: [
  {
    id: "dashboard", title: "捷運監控儀表板",
    api: "chart.appendData([{ data }])・chart: { streaming: { enabled, maxPoints } }・updateSeries(series)・addXaxisAnnotation()",
    desc: "招牌儀表板：面積圖用 appendData 逐秒串流，streaming 模式自動丟掉視窗外的舊點；放射條、排行長條與迷你走勢圖用 updateSeries 帶動畫更新。",
    hint: "按「模擬尖峰」看各圖反應，時間軸會插入一條尖峰標註；滑過圖表看數值",
    mount(ctx) {
      const kpi = (label) => `<div class="panel ap-kpi"><div class="ap-txt"><b>0</b><span>${label}</span></div><div class="ap-spark"></div></div>`;
      ctx.html(`<div class="ap-wrap ap-board">
        <div class="ap-kpis">${kpi("本分鐘進站人次")}${kpi("平均班距（秒）")}${kpi("準點率")}</div>
        ${card("ap-live", "全線進站人次", small("示意資料・每秒更新"))}
        ${card("ap-gauge", "各線擁擠度")}
        ${card("ap-top", "熱門車站 Top 5")}
      </div>`);
      const WINDOW = 60;
      let level = 820, surge = 0, paused = false, n = 0;
      const nextFlow = () => {
        level += (Math.random() - 0.5) * 60 + (900 - level) * 0.05 + surge * 40;
        return Math.max(200, Math.round(level + Math.sin(Date.now() / 4000) * 80));
      };
      const now = Date.now();
      const seed = Array.from({ length: WINDOW }, (_, i) => ({ x: now - (WINDOW - i) * 1000, y: nextFlow() }));
      const live = make(ctx, ctx.$(".ap-live .ap-fill"), {
        chart: { type: "area", height: "100%", zoom: { enabled: false },
          streaming: { enabled: true, maxPoints: WINDOW + 10 },
          animations: { enabled: true, dynamicAnimation: { speed: 950 } } },
        series: [{ name: "進站人次", data: seed }],
        colors: [C[1]],
        stroke: { curve: "smooth", width: 2.5 },
        fill: { type: "gradient", gradient: { shadeIntensity: 1, opacityFrom: 0.55, opacityTo: 0.02, stops: [0, 95] } },
        markers: { size: 0 },
        xaxis: { type: "datetime", range: WINDOW * 1000, labels: { datetimeUTC: false, format: "HH:mm:ss" } },
        yaxis: { min: 0, max: 2200, tickAmount: 4, labels: { formatter: (v) => Math.round(v) } },
        annotations: { yaxis: [{ y: 1500, borderColor: C[2], strokeDashArray: 4,
          label: { text: "擁擠警戒", style: { background: C[2], color: "#fff" }, borderColor: C[2] } }] },
      });

      const LINES = ["文湖線", "淡水信義線", "板南線", "松山新店線"];
      const crowd = [62, 78, 85, 54];
      const gauge = make(ctx, ctx.$(".ap-gauge .ap-fill"), {
        chart: { type: "radialBar", height: "100%" },
        series: crowd.slice(), labels: LINES,
        colors: ["#c48c3c", "#e3002c", "#0070bd", "#008659"],
        plotOptions: { radialBar: {
          hollow: { size: "28%" }, track: { background: "rgba(255,255,255,0.06)", margin: 3 },
          dataLabels: { name: { fontSize: "12px" }, value: { fontSize: "16px", color: "#ecebe6", formatter: (v) => `${Math.round(v)}%` },
            total: { show: true, label: "平均", color: MUTED, formatter: (w) => `${Math.round(w.globals.series.reduce((a, b) => a + b, 0) / 4)}%` } },
        } },
        stroke: { lineCap: "round" },
        legend: { show: true, position: "left", offsetY: 0, itemMargin: { vertical: 0 } },
        // Small viewports: give the rings the whole card, line names stay in the tooltip / center label.
        responsive: [{ breakpoint: 761, options: { legend: { show: false } } }],
      });

      const STATIONS = ["台北車站", "西門", "市政府", "忠孝復興", "中山", "南京復興", "板橋"];
      const stationVal = STATIONS.map(() => 300 + Math.random() * 400);
      const topFive = () => STATIONS.map((x, i) => ({ x, y: Math.round(stationVal[i]) })).sort((a, b) => b.y - a.y).slice(0, 5);
      const top = make(ctx, ctx.$(".ap-top .ap-fill"), {
        chart: { type: "bar", height: "100%", animations: { enabled: true, speed: 500, dynamicAnimation: { enabled: false } } },
        series: [{ name: "每分鐘進站", data: topFive() }],
        plotOptions: { bar: { horizontal: true, borderRadius: 4, barHeight: "62%", distributed: true } },
        colors: C, legend: { show: false },
        dataLabels: { enabled: true, style: { fontSize: "10px", colors: ["#0e1013"] } },
        xaxis: { labels: { show: false }, axisBorder: { show: false } },
        yaxis: { labels: { style: { colors: "#ecebe6", fontSize: "11px" } } },
        grid: { xaxis: { lines: { show: false } } },
      });

      const hist = [
        Array.from({ length: 20 }, () => 800 + Math.random() * 200),
        Array.from({ length: 20 }, () => 150 + Math.random() * 40),
        Array.from({ length: 20 }, () => 96 + Math.random() * 3),
      ];
      const sparks = ctx.$$(".ap-spark").map((el, i) => make(ctx, el, {
        chart: { type: "line", height: 36, sparkline: { enabled: true }, animations: { enabled: false } },
        series: [{ data: hist[i] }], colors: [[C[1], C[4], C[3]][i]], stroke: { width: 2, curve: "smooth" }, tooltip: { enabled: false },
      }));
      const kpis = ctx.$$(".ap-kpi b");

      const tick = () => {
        if (paused) return;
        n++;
        const y = nextFlow();
        live.appendData([{ data: [{ x: Date.now(), y }] }]);
        const headway = Math.round(150 + Math.random() * 30 - surge * 15);
        const onTime = Math.min(99.9, 97 + Math.random() * 2.5 - surge * 1.2);
        kpis[0].textContent = fmt(y);
        kpis[1].textContent = headway;
        kpis[2].textContent = `${onTime.toFixed(1)}%`;
        if (n % 2 === 0) {
          crowd.forEach((v, i) => (crowd[i] = Math.max(20, Math.min(99, v + (Math.random() - 0.5) * 14 + surge * 3))));
          gauge.updateSeries(crowd.map(Math.round));
          stationVal.forEach((v, i) => (stationVal[i] = Math.max(120, v + (Math.random() - 0.48) * 120 + surge * 25)));
          top.updateSeries([{ data: topFive() }]);
          [y, headway, onTime].forEach((v, i) => { hist[i].push(v); hist[i].shift(); sparks[i].updateSeries([{ data: hist[i].slice() }]); });
        }
        surge = Math.max(0, surge - 0.25);
      };

      ctx.toggle("暫停", false, (v) => (paused = v));
      ctx.button("模擬尖峰", () => {
        surge = 6; level += 400;
        const id = `surge-${Date.now()}`;
        live.addXaxisAnnotation({ id, x: Date.now(), borderColor: C[0], strokeDashArray: 0,
          label: { text: "尖峰", orientation: "horizontal", borderColor: C[0], style: { background: C[0], color: "#0e1013" } } });
        ctx.timeout(() => live.removeAnnotation(id), (WINDOW + 5) * 1000);
      }, { primary: true });

      Promise.all([live.ready, gauge.ready, top.ready, ...sparks.map((s) => s.ready)]).then(() => {
        if (!ctx.active) return;
        tick();
        ctx.interval(tick, 1000);
      });
    },
  },

  {
    id: "types", title: "八種圖型",
    api: "chart.type: 'candlestick' | 'heatmap' | 'treemap' | 'rangeBar' | 'boxPlot' | 'radar' | 'donut' | 'bar'（isFunnel）",
    desc: "同一個 new ApexCharts(el, options) 介面換 chart.type 就是另一種圖：蠟燭、熱力、矩形樹、時間軸、箱形、雷達、環圈、漏斗。",
    hint: "滑過每張圖看 tooltip；蠟燭圖依台灣習慣紅漲綠跌",
    mount(ctx) {
      ctx.html(`<div class="ap-wrap ap-gallery">
        ${card("g1", "蠟燭圖", code("candlestick"))}${card("g2", "熱力圖", code("heatmap"))}
        ${card("g3", "矩形樹圖", code("treemap"))}${card("g4", "時間軸", code("rangeBar"))}
        ${card("g5", "箱形圖", code("boxPlot"))}${card("g6", "雷達圖", code("radar"))}
        ${card("g7", "環圈圖", code("donut"))}${card("g8", "報名漏斗", code("isFunnel"))}
      </div>`);
      const box = (k) => ctx.$(`.${k} .ap-fill`);
      const r = rng(11);
      // OHLC random walk, 30 trading days
      let p = 580, t = Date.UTC(2024, 8, 2);
      const ohlc = [];
      while (ohlc.length < 30) {
        const dow = new Date(t).getUTCDay();
        if (dow !== 0 && dow !== 6) {
          const o = p, c = o + (r() - 0.48) * 22;
          ohlc.push({ x: t, y: [o, Math.max(o, c) + r() * 8, Math.min(o, c) - r() * 8, c].map((v) => Math.round(v * 10) / 10) });
          p = c;
        }
        t += DAY;
      }
      make(ctx, box("g1"), {
        chart: { type: "candlestick", height: "100%" },
        series: [{ name: "示意股價", data: ohlc }],
        plotOptions: { candlestick: { colors: { upward: "#f2545b", downward: "#3ecf8e" }, wick: { useFillColor: true } } },
        xaxis: { type: "datetime", labels: { datetimeUTC: false, format: "M/d" } },
        yaxis: { tickAmount: 4, labels: { formatter: (v) => Math.round(v) } },
      });
      const DAYS = ["週一", "週二", "週三", "週四", "週五", "週六", "週日"];
      const HOURS = [6, 8, 10, 12, 14, 16, 18, 20, 22];
      make(ctx, box("g2"), {
        chart: { type: "heatmap", height: "100%" },
        series: DAYS.map((d, di) => ({ name: d, data: HOURS.map((hr) => {
          const wk = di < 5, peak = Math.exp(-((hr - 8) ** 2) / 3) + Math.exp(-((hr - 18) ** 2) / 4);
          return { x: `${hr}時`, y: Math.round((wk ? 20 + peak * 80 : 25 + Math.exp(-((hr - 15) ** 2) / 18) * 35) + r() * 8) };
        }) })).reverse(),
        colors: [C[1]],
        plotOptions: { heatmap: { radius: 2, shadeIntensity: 0.7 } },
        stroke: { width: 1, colors: ["#171a1f"] },
        xaxis: { labels: { rotate: 0, hideOverlappingLabels: true } },
        tooltip: { y: { formatter: (v) => `擁擠指數 ${v}` } },
      });
      const CITY = [["新北市", 403], ["臺中市", 285], ["高雄市", 273], ["臺北市", 248], ["桃園市", 233], ["臺南市", 185], ["彰化縣", 124], ["屏東縣", 80], ["雲林縣", 66], ["新竹縣", 59]];
      make(ctx, box("g3"), {
        chart: { type: "treemap", height: "100%" },
        series: [{ name: "人口（萬）", data: CITY.map(([x, y]) => ({ x, y })) }],

        img.onload = () => { ctx.$(".ap-px").textContent = `${img.naturalWidth}×${img.naturalHeight}`; };
        img.src = imgURI;
        shot.replaceChildren(img);
        shot.classList.toggle("ap-on-light", mode === "light");
        ctx.$(".ap-kb").textContent = `${fmt(Math.round((imgURI.length - 22) * 0.75 / 1024))} KB`;
        ctx.$(".ap-svg").textContent = `${fmt(svg.length)} 字元`;
        ctx.$(".ap-ms").textContent = fmtMs(ms);
      };
      ctx.button("匯出 PNG", doExport, { primary: true });
      chart.ready.then(() => ctx.timeout(doExport, 1200));
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new ApexCharts(el, { chart: { type: 'scatter', renderer } }).render()・features/renderer-canvas.js",
    desc: "散點數量逐級加倍，量測建立並繪製整張圖的時間；可切換 SVG、Canvas 渲染器或依點數自動切換。",
    hint: "先選渲染器再按「開始測試」；滑過結果列看每秒點數與記憶體變化",
    async mount(ctx) {
      ctx.html(`<div class="panel ap-stress"><div class="ap-fill"></div><div class="ap-tag ap-st">準備中…</div></div>`);
      await ctx.load(CANVAS_FEATURE);
      const box = ctx.$(".ap-fill"), tag = ctx.$(".ap-st");
      const MODES = [["SVG", "svg"], ["Canvas", "canvas"], ["自動", "auto"]];
      let mode = "svg", chart = null;
      // Three gaussian clusters so the plot reads as data, not noise.
      const points = (n) => {
        const out = new Array(n);
        const centers = [[30, 40, 9], [62, 70, 7], [75, 28, 11]];
        for (let i = 0; i < n; i++) {
          const [cx, cy, s] = centers[i % 3];
          const a = Math.random() * Math.PI * 2, rr = Math.sqrt(-2 * Math.log(Math.random() + 1e-9)) * s;
          out[i] = [Math.round((cx + Math.cos(a) * rr) * 100) / 100, Math.round((cy + Math.sin(a) * rr) * 100) / 100];
        }
        return out;
      };
      const draw = async (data) => {
        if (chart) chart.dispose();
        chart = make(ctx, box, {
          chart: { type: "scatter", height: "100%", renderer: mode, animations: { enabled: false }, zoom: { enabled: false } },
          series: [{ name: "散點", data }],
          colors: [C[1]], markers: { size: 2.5, strokeWidth: 0, fillOpacity: 0.55 },
          xaxis: { type: "numeric", min: 0, max: 100, tickAmount: 5 }, yaxis: { min: 0, max: 100, tickAmount: 4 },
          tooltip: { enabled: false }, states: { hover: { filter: { type: "none" } } }, legend: { show: false },
        });
        await chart.ready;
        await ctx.frame(1);
        const nodes = box.querySelectorAll("*").length;
        const active = chart.getActiveRenderer();
        tag.innerHTML = `<b>${active === "canvas" ? "Canvas" : "SVG"}</b>・<span class="ap-num">${fmt(data.length)}</span> 點・DOM <span class="ap-num">${fmt(nodes)}</span> 節點`;
        return `${active === "canvas" ? "Canvas" : "SVG"}・${fmtCompact(nodes)} 節點`;
      };
      ctx.controls.classList.add("bottom");
      ctx.group(MODES.map((m) => m[0]), 0, (i) => { mode = MODES[i][1]; draw(points(2000)); });
      ctx.bench({
        label: "散點", unit: "點",
        sizes: [1000, 2000, 4000, 8000, 16000, 32000, 64000, 128000, 256000],
        prepare: (n) => points(n),
        run: (n, data) => draw(data),
        target: 1000, budget: 2000,
        note: "每級重建一張散點圖並等繪製完成（new ApexCharts + render），動畫與 tooltip 已關閉。SVG 模式每個點都是獨立的 DOM 元素，節點數隨點數線性成長；Canvas 渲染器（features/renderer-canvas.js）把整個序列畫進一張 canvas；「自動」在點數超過 rendererThreshold（預設 8000）時改用 Canvas。",
      });
      await draw(points(2000));
    },
  },
] });
</script>
</body>
</html>
