<script type="module">
// AR.js 3.4.8 three.js builds import "three" through the import map above
const AR_URL = "https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/three.js/build/ar-threex.mjs";
const LOC_URL = "https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/three.js/build/ar-threex-location-only.mjs";
const AFRAME_URL = "https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js";
const AFRAME_AR_URL = "https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.8/aframe/build/aframe-ar.js";
const DATA = "assets/arjs/";
const HIRO_PATT = DATA + "patt.hiro";
const FW = 640, FH = 480;
const SRC = [{ value: "sim", label: "模擬畫面" }, { value: "cam", label: "鏡頭" }];
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const { fmt, fmtMs } = Showcase;
const abs = (u) => new URL(u, location.href).href;
const fontOf = () => getComputedStyle(document.body).getPropertyValue("--font");

/* ---------- library loading (one gate for the whole page) ---------- */
const lib = { THREE: null, AR: null, LOC: null };
let gated = false;
async function libs(ctx, need = []) {
  if (!gated) {
    await ctx.gate({
      icon: "🎯", title: "AR.js 標記與位置型擴增實境", button: "開始",
      desc: "載入 three.js 與 AR.js 3.4.8（ARToolKit WebAssembly）。沒有鏡頭也能看：標記場景用 three.js 即時算繪的「模擬畫面」當輸入，偵測與姿態都由 ARToolKit 實際計算；位置型 AR 用 fakeGps 模擬定位。只有選擇「鏡頭」或「真實 GPS」時才會要求權限。",
      tags: ["約 4 MB", "AR.js 3.4.8", "鏡頭可選"],
    });
    gated = true;
  }
  const todo = [];
  if (!lib.THREE) todo.push(async () => { lib.THREE = await import("three"); });
  if (need.includes("ar") && !lib.AR) todo.push(async () => { lib.AR = await import(AR_URL); });
  if (need.includes("loc") && !lib.LOC) todo.push(async () => { lib.LOC = await import(LOC_URL); });
  if (!todo.length) return lib;
  const st = ctx.status("下載 AR.js 與 three.js…");
  try {
    for (let i = 0; i < todo.length; i++) { st.progress(i / todo.length); await todo[i](); }
  } catch (e) {
    st.error("AR.js 載入失敗，請確認網路連線後重新整理");
    throw e;
  }
  st.done();
  return lib;
}

/* ---------- small helpers ---------- */
const abortError = () => new DOMException("scene switched", "AbortError");
const imgCache = new Map();
function loadImage(url) {
  if (!imgCache.has(url)) {
    imgCache.set(url, new Promise((ok, fail) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => ok(img);
      img.onerror = () => { imgCache.delete(url); fail(new Error(`圖片載入失敗：${url}`)); };
      img.src = url;
    }));
  }
  return imgCache.get(url);
}
const makeCanvas = (w, h = w) => Object.assign(document.createElement("canvas"), { width: w, height: h });
function download(href, name) {
  const a = Showcase.h("a", { href, download: name });
  document.body.append(a);
  a.click();
  a.remove();
}
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 0.5;
// Sub-lifecycle inside a scene: each restart disposes the previous source first
function runner(ctx) {
  let cur = null;
  const stop = () => { const old = cur; cur = null; if (old) while (old.fns.length) { try { old.fns.pop()(); } catch (e) { console.warn(e); } } };
  ctx.onCleanup(stop);
  return async (fn) => {
    stop();
    const life = { fns: [], get active() { return ctx.active && cur === life; }, onCleanup(f) { if (life.active) life.fns.push(f); else f(); } };
    cur = life;
    try { await fn(life); } catch (e) { if (life.active && e?.name !== "AbortError") throw e; }
  };
}
function fitCanvas(ctx, canvas, paint) {
  const g = canvas.getContext("2d");
  const resize = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint(g, r.width, r.height);
  };
  const ro = new ResizeObserver(() => { if (ctx.active) resize(); });
  ro.observe(canvas);
  ctx.onCleanup(() => ro.disconnect());
  resize();
  return { g, size: () => canvas.getBoundingClientRect(), repaint: resize };
}

/* ---------- stage: 4:3 processed frame plus overlays ---------- */
const SCAN = `<div class="aj-scan"><div></div><span>把鏡頭對準標記</span></div>`;
function stageBox(extra = "") {
  return `<div class="aj-stage"><div class="aj-view"><canvas class="aj-frame" width="${FW}" height="${FH}"></canvas>${extra}</div>
    <span class="aj-tag"></span><span class="aj-state"></span><div class="aj-msg" hidden></div></div>`;
}
function stageUI(ctx, root = ctx.el) {
  const q = (s) => root.querySelector(s);
  const frame = q(".aj-frame"), tag = q(".aj-tag"), state = q(".aj-state"), msg = q(".aj-msg");
  const g = frame.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "#000"; g.fillRect(0, 0, FW, FH);
  return {
    view: q(".aj-view"), frame, g,
    tag(text, sim) { tag.textContent = text; tag.classList.toggle("sim", !!sim); },
    state(text, on) { state.textContent = text; state.classList.toggle("on", !!on); },
    msg(text, err) { msg.textContent = text || ""; msg.hidden = !text; msg.classList.toggle("err", !!err); },
  };
}

/* ---------- AR.js context and three.js overlay ---------- */
async function arContext(life, opts = {}) {
  const ac = new lib.AR.ArToolkitContext({
    cameraParametersUrl: DATA + "camera_para.dat", detectionMode: "mono", canvasWidth: FW, canvasHeight: FH, maxDetectionRate: 60, ...opts,
  });
  let dead = false, ready = false;
  life.onCleanup(() => { dead = true; if (ready && ac.arController) ac.dispose(); });
  await new Promise((ok, fail) => {
    const timer = setTimeout(() => fail(new Error("ARToolKit 初始化逾時")), 30000);
    ac.init(() => { clearTimeout(timer); ok(); });
  });
  ready = true;
  if (dead) { ac.dispose(); throw abortError(); }
  return ac;
}
// Wrap loadMarker so each pattern source can be mapped to the id ARToolKit assigned to it
function patternIds(ar) {
  const ids = new Map();
  const orig = ar.loadMarker.bind(ar);
  ar.loadMarker = async (src) => { const id = await orig(src); ids.set(src, id); return id; };
  return ids;
}
const fovOf = (ac) => 2 * Math.atan(1 / ac.getProjectionMatrix().elements[5]) * 180 / Math.PI;
function overlay(life, view, ac) {
  const T = lib.THREE;
  const r = new T.WebGLRenderer({ antialias: true, alpha: true });
  r.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  r.setClearColor(0x000000, 0);
  view.append(r.domElement);
  const scene = new T.Scene();
  const cam = new T.Camera();  // AR.js supplies the projection matrix
  cam.projectionMatrix.copy(ac.getProjectionMatrix());
  cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
  scene.add(new T.HemisphereLight(0xffffff, 0x445566, 2));
  const sun = new T.DirectionalLight(0xffffff, 2.4);
  sun.position.set(1, 3, 2);
  scene.add(sun);
  const fit = () => { const w = view.clientWidth, h = view.clientHeight; if (w && h) r.setSize(w, h, false); };
  const ro = new ResizeObserver(fit);
  ro.observe(view);
  fit();
  life.onCleanup(() => { ro.disconnect(); r.dispose(); r.forceContextLoss(); r.domElement.remove(); });
  return { scene, cam, render: () => r.render(scene, cam) };
}

/* ---------- simulated feed: printed markers on a desk, rendered with a moving camera ---------- */
function radialTexture(T, inner) {
  const c = makeCanvas(128);
  const g = c.getContext("2d"), grad = g.createRadialGradient(64, 64, 4, 64, 64, 62);
  grad.addColorStop(0, inner);
  grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new T.CanvasTexture(c);
}
function woodTexture(T) {
  const c = makeCanvas(512);
  const g = c.getContext("2d");
  g.fillStyle = "#a8774a";
  g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 90; i++) {
    const y = Math.random() * 512, a = 0.04 + Math.random() * 0.1;
    g.strokeStyle = Math.random() < 0.5 ? `rgba(70,40,15,${a})` : `rgba(255,220,170,${a})`;
    g.lineWidth = 1 + Math.random() * 5;
    g.beginPath();
    g.moveTo(0, y);
    for (let x = 0; x <= 512; x += 32) g.lineTo(x, y + Math.sin(x / 70 + i) * 6);
    g.stroke();
  }
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.repeat.set(4, 4);
  return tex;
}
// cards: [{ img, size = 1 (black square width), fill = share of the image the black square spans, x, z, rot }]
function simDesk(life, fovY, cards) {
  const T = lib.THREE;
  const r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  r.setPixelRatio(1);
  r.setSize(FW, FH, false);
  life.onCleanup(() => { r.dispose(); r.forceContextLoss(); });
  const s = new T.Scene();
  s.background = new T.Color(0x3a2a1c);
  const flat = (w, mat, y) => { const m = new T.Mesh(new T.PlaneGeometry(w, w).rotateX(-Math.PI / 2), mat); m.position.y = y; return m; };
  s.add(flat(18, new T.MeshBasicMaterial({ map: woodTexture(T) }), 0));
  const shadowMap = radialTexture(T, "rgba(0,0,0,.5)");
  const out = cards.map((c) => {
    const k = c.size ?? 1;
    const grp = new T.Group();
    const shadow = flat(k * 2.1, new T.MeshBasicMaterial({ map: shadowMap, transparent: true, depthWrite: false }), 0.002);
    shadow.position.set(0.06 * k, 0.002, 0.08 * k);
    const tex = c.img instanceof HTMLCanvasElement ? new T.CanvasTexture(c.img) : new T.Texture(c.img);
    tex.needsUpdate = true;
    tex.colorSpace = T.SRGBColorSpace;
    tex.anisotropy = r.capabilities.getMaxAnisotropy();
    grp.add(shadow, flat(k * 1.7, new T.MeshBasicMaterial({ color: 0xf4f4f0 }), 0.004), flat(k / (c.fill ?? 1), new T.MeshBasicMaterial({ map: tex }), 0.006));
    grp.position.set(c.x ?? 0, 0, c.z ?? 0);
    grp.rotation.y = c.rot ?? 0;
    s.add(grp);
    return { group: grp, tex };
  });
  const cam = new T.PerspectiveCamera(fovY, FW / FH, 0.05, 60);
  return { cam, cards: out, draw(g) { r.render(s, cam); g.drawImage(r.domElement, 0, 0); } };
}
const look = { x: 0, z: 0 };
function orbit(cam, t, { d = 3.3, amp = 1, cx = 0, cz = 0 } = {}) {
  const az = Math.sin(t * 0.33) * 0.62 * amp, el = 0.98 + Math.sin(t * 0.47) * 0.24 * amp, dd = d * (1 + Math.sin(t * 0.26) * 0.17 * amp);
  cam.position.set(cx + Math.sin(az) * Math.cos(el) * dd, Math.sin(el) * dd, cz + Math.cos(az) * Math.cos(el) * dd);
  look.x = cx + Math.sin(t * 0.58) * 0.1 * d * amp;
  look.z = cz + Math.cos(t * 0.43) * 0.07 * d * amp;
  cam.lookAt(look.x, 0, look.z);
}

/* ---------- camera feed ---------- */
async function openStream(life) {
  if (!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error("這個瀏覽器不支援 getUserMedia"), { name: "NotSupportedError" });
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 960 } } });
  life.onCleanup(() => stream.getTracks().forEach((t) => t.stop()));
  if (!life.active) throw abortError();
  return stream;
}
async function openVideo(life) {
  const stream = await openStream(life);
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.srcObject = stream;
  life.onCleanup(() => { v.pause(); v.srcObject = null; });
  await v.play();
  return v;
}
function camError(e) {
  if (e?.name === "NotAllowedError" || e?.name === "SecurityError") return "未取得鏡頭權限";
  if (e?.name === "NotFoundError" || e?.name === "OverconstrainedError") return "這台裝置找不到可用的鏡頭";
  if (e?.name === "NotSupportedError") return "這個瀏覽器不支援鏡頭存取";
  return `無法開啟鏡頭（${e?.name || e?.message || e}）`;
}
// Center-crop into the 4:3 frame, never mirrored so the marker pattern stays readable
function drawCover(g, v) {
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw) return;
  const k = Math.max(FW / vw, FH / vh);
  g.drawImage(v, (FW - vw * k) / 2, (FH - vh * k) / 2, vw * k, vh * k);
}
// Returns a draw function for the real camera, or null to keep the simulated desk
async function pickFeed(life, ui, sel) {
  ui.msg("");
  if (sel.value === "cam") {
    try {
      const v = await openVideo(life);
      ui.tag("📷 鏡頭");
      return (g) => drawCover(g, v);
    } catch (e) {
      if (!life.active) throw abortError();
      ui.msg(`${camError(e)}，改用模擬畫面`);
      sel.value = "sim";
    }
  }
  ui.tag("模擬畫面", true);
  return null;
}

/* ---------- printable markers ---------- */
// 3x3 barcode (patternRatio 0.5): cell 0 white, cells 2 and 8 black, data bits 0..5 live in cells 1,3,4,5,6,7 (1 = black)
const BAR_BITS = [1, 3, 4, 5, 6, 7];
function barcodeCanvas(id, size = 256, margin = 0) {
  const c = makeCanvas(size + margin * 2);
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#000"; g.fillRect(margin, margin, size, size);
  const cs = size / 6, o = margin + size / 4;
  g.fillStyle = "#fff";
  for (let cell = 0; cell < 9; cell++) {
    const bit = BAR_BITS.indexOf(cell);
    const black = cell === 2 || cell === 8 || (bit >= 0 && (id >> bit) & 1);
    if (!black) g.fillRect(o + (cell % 3) * cs, o + Math.floor(cell / 3) * cs, cs, cs);
  }
  return c;
}
// Black border with a white inner square (patternRatio 0.5) holding a glyph or an uploaded picture
function glyphMarker(src, size = 512) {
  const c = makeCanvas(size);
  const g = c.getContext("2d");
  const o = size / 4, inner = size / 2;
  g.fillStyle = "#000"; g.fillRect(0, 0, size, size);
  g.fillStyle = "#fff"; g.fillRect(o, o, inner, inner);
  if (typeof src === "string") {
    g.fillStyle = "#000"; g.textAlign = "center"; g.textBaseline = "middle";
    let px = inner * 0.78;
    g.font = `900 ${px}px ${fontOf()}`;
    const w = g.measureText(src).width;
    if (w > inner * 0.86) { px *= inner * 0.86 / w; g.font = `900 ${px}px ${fontOf()}`; }
    g.fillText(src, size / 2, size / 2 + px * 0.04);
  } else {
    const iw = src.naturalWidth || src.width, ih = src.naturalHeight || src.height;
    const k = Math.min(inner * 0.92 / iw, inner * 0.92 / ih);
    g.drawImage(src, size / 2 - iw * k / 2, size / 2 - ih * k / 2, iw * k, ih * k);
  }
  return c;
}
// Same layout as the AR.js marker training tool: 4 orientations, each as B, G, R planes of 16x16 values
function encodePatt(marker) {
  const size = marker.width, o = size / 4, inner = size / 2;
  const k = makeCanvas(16);
  const q = k.getContext("2d", { willReadFrequently: true });
  const lines = [];
  const views = [];
  for (let r = 0; r < 4; r++) {
    q.save();
    q.clearRect(0, 0, 16, 16);
    q.translate(8, 8);
    q.rotate(-r * Math.PI / 2);
    q.drawImage(marker, o, o, inner, inner, -8, -8, 16, 16);
    q.restore();
    const d = q.getImageData(0, 0, 16, 16);
    views.push(d);
    if (r) lines.push("");
    for (let ch = 2; ch >= 0; ch--) {
      for (let y = 0; y < 16; y++) {
        const row = [];
        for (let x = 0; x < 16; x++) row.push(String(d.data[(y * 16 + x) * 4 + ch]).padStart(3));
        lines.push(row.join(" "));
      }
    }
  }
  return { text: lines.join("\n") + "\n", views };
}

/* ---------- overlay content (marker space: 1 unit = marker width, +y out of the marker) ---------- */
function markerBase(T, color) {
  const g = new T.Group();
  const edge = [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]].map(([x, z]) => new T.Vector3(x, 0.004, z));
  g.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(edge), new T.LineBasicMaterial({ color })));
  g.add(new T.Mesh(new T.PlaneGeometry(1, 1).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.16, depthWrite: false })));
  return g;
}
function shadowDisc(T) {
  const m = new T.Mesh(new T.PlaneGeometry(0.9, 0.9).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ map: radialTexture(T, "rgba(0,0,0,.55)"), transparent: true, depthWrite: false }));
  m.position.y = 0.006;
  return m;
}
function labelSprite(T, text, color, h = 0.26) {
  const c = makeCanvas(320, 112);
  const g = c.getContext("2d");
  g.font = `700 54px ${fontOf()}`;
  const w = Math.min(304, g.measureText(text).width + 44);
  g.fillStyle = "rgba(10, 12, 15, .85)";
  g.beginPath(); g.roundRect(160 - w / 2, 8, w, 96, 26); g.fill();
  g.lineWidth = 6; g.strokeStyle = color; g.stroke();
  g.fillStyle = color; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, 160, 58, 280);
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  const s = new T.Sprite(new T.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  s.scale.set(h * 320 / 112, h, 1);
  return s;
}
function buildKnot(T) {
  const knot = new T.Mesh(new T.TorusKnotGeometry(0.27, 0.085, 180, 24), new T.MeshStandardMaterial({ color: 0xf7df1e, metalness: 0.35, roughness: 0.3 }));
  const group = new T.Group();
  group.add(knot);
  group.userData.tick = (t, dt) => { knot.rotation.y += dt * 0.9; knot.rotation.x = Math.sin(t * 0.7) * 0.4; group.position.y = 0.72 + Math.sin(t * 2) * 0.05; };
  return group;
}
function buildCube(T) {
  // The classic AR.js "hello world": a normal-shaded cube standing on the marker
  const geo = new T.BoxGeometry(0.72, 0.72, 0.72);
  const cube = new T.Mesh(geo, new T.MeshNormalMaterial({ transparent: true, opacity: 0.88 }));
  cube.add(new T.LineSegments(new T.EdgesGeometry(geo), new T.LineBasicMaterial({ color: 0xffffff })));
  const group = new T.Group();
  group.add(cube);
  group.userData.tick = (t) => { cube.rotation.y = t * 0.6; cube.position.y = 0.36 + Math.abs(Math.sin(t * 2.4)) * 0.18; };
  return group;
}
// Fetch the model bytes once per page; each visit parses its own copy so disposal never touches a shared scene
let robotBytes = null;
async function loadRobot(T) {
  robotBytes ||= fetch("_shared/models/robot.glb").then((r) => {
    if (!r.ok) throw new Error(`robot.glb HTTP ${r.status}`);
    return r.arrayBuffer();
  });
  robotBytes.catch(() => { robotBytes = null; });
  const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
  const gltf = await new GLTFLoader().parseAsync(await robotBytes, "");
  const model = gltf.scene;
  // Skinned hand meshes report bind-pose bounds hundreds of units wide, so size the robot from rigid meshes only
  const box = new T.Box3();
  model.updateMatrixWorld(true);
  model.traverse((o) => { if (o.isMesh && !o.isSkinnedMesh) box.expandByObject(o); });
  const k = 1.05 / (box.max.y - box.min.y);
  model.scale.setScalar(k);
  model.position.y = -box.min.y * k;
  const mixer = new T.AnimationMixer(model);
  const clip = gltf.animations.find((a) => a.name === "Wave") || gltf.animations[0];
  if (clip) mixer.clipAction(clip).play();
  const group = new T.Group();
  group.add(model);
  group.userData.mixer = mixer;
  return group;
}
function logLine(box, text, cls = "", max = 40) {
  const now = new Date();
  const ts = [now.getHours(), now.getMinutes(), now.getSeconds()].map((n) => String(n).padStart(2, "0")).join(":");
  box.append(Showcase.h("div", { class: cls, text: `${ts} ${text}` }));
  while (box.children.length > max) box.firstChild.remove();
}

/* ---------- location-based helpers (short distances, so a local flat-earth approximation is enough) ---------- */
const R_EARTH = 6371e3;
const rad = (d) => d * Math.PI / 180;
function geo(a, b) {
  const e = rad(b.lon - a.lon) * Math.cos(rad((a.lat + b.lat) / 2)) * R_EARTH, n = rad(b.lat - a.lat) * R_EARTH;
  return { e, n, d: Math.hypot(e, n), brg: (Math.atan2(e, n) * 180 / Math.PI + 360) % 360 };
}
function stepFrom(p, brg, m) {

}

          lastUi = t;
          const b = ((-yawNow() * 180 / Math.PI) % 360 + 360) % 360;
          kv.dir.textContent = `${dirName(b)} ${Math.round(b)}°`;
          if (lastFix) {
            const near = POIS.map((p) => ({ p, d: geo(lastFix, p).d })).sort((a, z) => a.d - z.d)[0];
            kv.near.textContent = `${near.p.name} ${fmtDist(near.d)}`;
          }
          if (!orient) stateEl.textContent = `門檻 ${minDist} m／±${minAcc} m`;
          drawMap();
        }
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "arController.detectMarker(canvas)・arController.process(canvas)・getMarkerNum()",
    desc: "在 640×480 的畫面上排出 1 到 64 張不同 ID 的 3x3 條碼，每一級各跑 20 次 detectMarker（只找方框與解碼）和 process（再加上每張標記的姿態計算與事件），量每格耗時與實際偵測到的數量。",
    hint: "按「開始測試」・寬螢幕右側畫出偵測到的方框與每一級的數據",
    async mount(ctx) {
      await libs(ctx, ["ar"]);
      ctx.html(`<div class="aj-stress"><div class="aj-pane"><canvas></canvas></div>
        <table class="aj-tbl"><thead><tr><th>張數</th><th>偵測到</th><th>detectMarker</th><th>process</th><th>等效 FPS</th></tr></thead><tbody></tbody></table></div>`);
      const tbody = ctx.$(".aj-tbl tbody");
      const st = ctx.status("載入 ARToolKit 與相機參數…");
      const ac = await arContext(ctx, { detectionMode: "mono_and_matrix", matrixCodeType: "3x3" });
      st.done();
      const ar = ac.arController;
      const src = makeCanvas(FW, FH), sg = src.getContext("2d", { willReadFrequently: true });
      const codes = Array.from({ length: 64 }, (_, i) => barcodeCanvas(i, 120));
      let last = null;
      const view = fitCanvas(ctx, ctx.$(".aj-stress canvas"), (g, w, h) => {
        g.clearRect(0, 0, w, h);
        if (!last) {
          g.fillStyle = "#8b949e"; g.font = `13px ${fontOf()}`; g.textAlign = "center";
          g.fillText("按「開始測試」，每一級跑完會在這裡畫出偵測到的方框", w / 2, h / 2);
          g.textAlign = "left";
          return;
        }
        const k = Math.min((w - 16) / FW, (h - 16) / FH), ox = (w - FW * k) / 2, oy = (h - FH * k) / 2;
        g.drawImage(src, ox, oy, FW * k, FH * k);
        g.strokeStyle = "#7bd389"; g.lineWidth = 2;
        for (const v of last.quads) {
          g.beginPath();
          v.forEach(([x, y], i) => (i ? g.lineTo(ox + x * k, oy + y * k) : g.moveTo(ox + x * k, oy + y * k)));
          g.closePath(); g.stroke();
        }
      });
      const grid = (n) => {
        sg.fillStyle = "#fff"; sg.fillRect(0, 0, FW, FH);
        const cols = Math.ceil(Math.sqrt(n * FW / FH)), rows = Math.ceil(n / cols);
        const cell = Math.min(FW / cols, FH / rows), s = cell * 0.78;
        for (let i = 0; i < n; i++) {
          const x = (FW - cols * cell) / 2 + (i % cols) * cell + (cell - s) / 2, y = (FH - rows * cell) / 2 + Math.floor(i / cols) * cell + (cell - s) / 2;
          sg.drawImage(codes[i], x, y, s, s);
        }
      };
      const REPS = 20;
      ctx.bench({
        label: "標記數", unit: "張", sizes: [1, 4, 9, 16, 25, 36, 49, 64], target: 800, budget: 3000, format: (n) => String(n),
        note: "每一級把 n 張 3x3 條碼（ID 0 到 n-1）排成格狀畫在 640×480 白底上，先跑 20 次 detectMarker（二值化、找四邊形、解碼），再跑 20 次 process（同樣偵測，加上每張標記的姿態矩陣與 getMarker 事件）。級距時間是兩者合計 40 次。標記越多、每張越小，解碼與姿態計算越多；64 張時格子小到有些會漏抓。",
        prepare: (n) => {
          if (n === 1) tbody.replaceChildren();
          grid(n);
          ar.detectMarker(src);  // warm-up so the first timed pass is not paying for buffer setup
          return src;
        },
        run: (n, c) => {
          let t0 = performance.now(), num = 0;
          for (let k = 0; k < REPS; k++) { ar.detectMarker(c); num = ar.getMarkerNum(); }
          const tDet = (performance.now() - t0) / REPS;
          t0 = performance.now();
          for (let k = 0; k < REPS; k++) ar.process(c);
          const tProc = (performance.now() - t0) / REPS;
          const quads = [];
          let ok = 0;
          for (let i = 0; i < ar.getMarkerNum(); i++) {
            const m = ar.getMarker(i);
            if (m.idMatrix >= 0 && m.cfMatrix >= 0.5) ok++;
            quads.push(m.vertex.map((p) => [p[0], p[1]]));
          }
          last = { quads };
          view.repaint();
          tbody.append(Showcase.h("tr", {}, ...[String(n), `${ok} / ${num}`, fmtMs(tDet), fmtMs(tProc), fmt(1000 / tProc, 0)].map((t) => Showcase.h("td", { text: t }))));
          return `${ok} 張・${tProc.toFixed(1)} ms/格`;
        },
      });
    },
  },
] });
</script>
</body>
</html>
