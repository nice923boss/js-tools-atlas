    </g>
    <circle cx="100" cy="88" r="7" fill="#f7df1e"/>
    <g class="cabin"><circle class="pin" cx="166" cy="88" r="2.4" fill="#fff"/><path d="M166,88 V95" stroke="#fff" stroke-width="1.4"/><rect x="157" y="95" width="18" height="13" rx="4" fill="#f7df1e"/><rect x="160" y="98" width="12" height="4" rx="1.5" fill="#fff" opacity="0.55"/></g>
    <g class="cabin"><circle class="pin" cx="146.67" cy="134.67" r="2.4" fill="#fff"/><path d="M146.67,134.67 V141.67" stroke="#fff" stroke-width="1.4"/><rect x="137.67" y="141.67" width="18" height="13" rx="4" fill="#4cc9f0"/><rect x="140.67" y="144.67" width="12" height="4" rx="1.5" fill="#fff" opacity="0.55"/></g>
