<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Ferris wheel for the Snap.svg demo. Self-made, MIT. #wheel spins; each .cabin counter-rotates around its .pin. -->
