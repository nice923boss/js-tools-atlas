  <g fill="#fff" opacity="0.7">
    <circle cx="22" cy="24" r="1.2"/><circle cx="176" cy="16" r="1"/><circle cx="186" cy="64" r="1.3"/>
    <circle cx="12" cy="122" r="1"/><circle cx="190" cy="128" r="0.9"/><circle cx="60" cy="10" r="0.8"/>
  </g>
  <rect y="182" width="200" height="18" fill="#0e1729"/>
