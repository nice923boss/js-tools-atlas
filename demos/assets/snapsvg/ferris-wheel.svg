    <g class="cabin"><circle class="pin" cx="146.67" cy="41.33" r="2.4" fill="#fff"/><path d="M146.67,41.33 V48.33" stroke="#fff" stroke-width="1.4"/><rect x="137.67" y="48.33" width="18" height="13" rx="4" fill="#2ec4b6"/><rect x="140.67" y="51.33" width="12" height="4" rx="1.5" fill="#fff" opacity="0.55"/></g>
