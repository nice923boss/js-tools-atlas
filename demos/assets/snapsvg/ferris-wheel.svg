    <g class="cabin"><circle class="pin" cx="53.33" cy="134.67" r="2.4" fill="#fff"/><path d="M53.33,134.67 V141.67" stroke="#fff" stroke-width="1.4"/><rect x="44.33" y="141.67" width="18" height="13" rx="4" fill="#7bd389"/><rect x="47.33" y="144.67" width="12" height="4" rx="1.5" fill="#fff" opacity="0.55"/></g>
    <g class="cabin"><circle class="pin" cx="34" cy="88" r="2.4" fill="#fff"/><path d="M34,88 V95" stroke="#fff" stroke-width="1.4"/><rect x="25" y="95" width="18" height="13" rx="4" fill="#ff8c42"/><rect x="28" y="98" width="12" height="4" rx="1.5" fill="#fff" opacity="0.55"/></g>
