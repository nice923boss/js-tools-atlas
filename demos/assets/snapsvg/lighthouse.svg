<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Lighthouse for the Snap.svg demo. Self-made, MIT. #beam sweeps around the lamp at 100,58; each .wave tiles every 50 units. -->
  <rect width="200" height="200" fill="#0f2238"/>
  <g fill="#fff" opacity="0.65">
    <circle cx="30" cy="30" r="1.1"/><circle cx="128" cy="14" r="1"/><circle cx="184" cy="96" r="1.2"/>
    <circle cx="18" cy="92" r="0.9"/><circle cx="70" cy="18" r="0.8"/>
  </g>
  <circle cx="162" cy="40" r="12" fill="#f3efe0"/>
  <circle cx="157" cy="36" r="3" fill="#ddd5bd"/>
  <g id="beam" fill="#fff3b0" opacity="0.32">
    <polygon points="100,55 240,20 240,96 100,61"/>
    <polygon points="100,55 -40,20 -40,96 100,61"/>
  </g>
  <path id="rock" d="M26,178 C40,156 66,148 86,150 L116,150 C140,148 160,158 174,178 Z" fill="#2b3446"/>
  <g id="tower">
    <path d="M84,152 L90,70 H110 L116,152 Z" fill="#eef1f6"/>
    <polygon class="stripe" points="88.5,90 111.5,90 112.5,104 87.5,104" fill="#e04848"/>
    <polygon class="stripe" points="86.3,120 113.7,120 114.7,134 85.3,134" fill="#e04848"/>
    <rect x="96" y="138" width="8" height="14" rx="4" fill="#3a4256"/>
    <rect x="85" y="66" width="30" height="5" rx="1.5" fill="#3a4256"/>
    <rect x="91" y="48" width="18" height="18" rx="2" fill="#2d3a55"/>
    <polygon points="87,48 100,35 113,48" fill="#e04848"/>
  </g>
  <circle id="lamp" cx="100" cy="58" r="6" fill="#ffe27a"/>
  <path class="wave" fill="#1f4f7a" opacity="0.9" d="M-50,166 q12.5,-6 25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 V200 H-50 Z"/>
  <path class="wave" fill="#2a6a9e" d="M-50,180 q12.5,-5 25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 t25,0 V200 H-50 Z"/>
</svg>
