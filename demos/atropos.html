<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atropos 示範：多層景深旅遊卡</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 110%, #2a1f3d, var(--bg) 70%); }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 50px 16px 44px; }
  header { text-align: center; }
  header h1 { margin: 0; font-size: clamp(20px, 4vw, 32px); font-weight: 900; }
  header .read { font: 12px var(--mono); color: var(--muted); }
  header .read b { color: var(--accent); }
  .cards { display: flex; gap: clamp(16px, 4vw, 48px); justify-content: center; width: 100%; }
  .atropos { width: min(40vw, 290px); aspect-ratio: 3 / 4; }
  .atropos-inner { border-radius: 18px; }
  .atropos-shadow { border-radius: 18px; }
  .bg { position: absolute; left: -6%; top: -6%; width: 112%; height: 112%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 30%, rgba(0,0,0,.75)); }
  .t { position: absolute; left: 8%; right: 8%; bottom: 7%; }
  .t small { font: 700 11px var(--mono); letter-spacing: .12em; color: var(--accent); }
  .t h2 { margin: 2px 0 2px; font-size: clamp(20px, 3.6vw, 34px); line-height: 1.1; font-weight: 900; text-shadow: 0 6px 20px rgba(0,0,0,.6); }
  .t p { margin: 0; font-size: clamp(11px, 1.4vw, 13px); color: rgba(255,255,255,.85); }
  .badge { position: absolute; top: 6%; left: 8%; padding: 5px 11px; border-radius: 999px; font: 800 12px var(--mono); color: #111; background: var(--accent);
    box-shadow: 0 10px 24px rgba(0,0,0,.4); }
  .polaroid { position: absolute; right: 7%; top: 9%; width: 38%; padding: 5px 5px 16px; background: #fff; border-radius: 4px; transform: rotate(7deg);
    box-shadow: 0 14px 30px rgba(0,0,0,.45); }
  .polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .stamp { position: absolute; right: 8%; top: 8%; width: 30%; aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(255,255,255,.85);
    display: grid; place-items: center; font: 800 clamp(10px, 1.5vw, 14px)/1.2 var(--font); text-align: center; color: #fff; transform: rotate(-12deg); }
  .legend { font-size: 12px; color: var(--muted); text-align: center; max-width: 34em; }
  .legend code { font-family: var(--mono); color: var(--c2); }
  @media (max-width: 520px) { .atropos { width: 44vw; } .polaroid { padding: 3px 3px 9px; } .legend { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>每一層都有自己的深度</h1>
    <div class="read">旋轉 X <b id="rx">0.0°</b>　Y <b id="ry">0.0°</b></div>
  </header>
  <div class="cards">
    <div class="atropos" id="a1">
      <div class="atropos-scale"><div class="atropos-rotate"><div class="atropos-inner">
        <img class="bg" src="_shared/img/photo-1.jpg" alt="峽灣" data-atropos-offset="-5">
        <div class="shade"></div>
        <div class="polaroid" data-atropos-offset="6"><img src="_shared/img/photo-3.jpg" alt="山谷公路"></div>
        <div class="badge" data-atropos-offset="10">3D</div>
        <div class="t" data-atropos-offset="8"><small>NORWAY</small><h2>峽灣之旅</h2><p>背景往後退，照片與標題往前浮</p></div>
      </div></div></div>
    </div>
    <div class="atropos" id="a2">
      <div class="atropos-scale"><div class="atropos-rotate"><div class="atropos-inner">
        <img class="bg" src="_shared/img/photo-7.jpg" alt="母獅" data-atropos-offset="-4">
        <div class="shade"></div>
        <div class="stamp" data-atropos-offset="9">草原<br>認證</div>
        <div class="badge" data-atropos-offset="12" style="background:var(--c5)">野生</div>
        <div class="t" data-atropos-offset="7"><small>SAVANNA</small><h2>草原之王</h2><p>手機上用手指拖曳也能轉動</p></div>
      </div></div></div>
    </div>
  </div>
  <div class="legend">每層用 <code>data-atropos-offset</code> 設定位移，負值往後、正值往前，加上光暈與陰影就有實體卡片的手感。</div>
</div>
<div class="hint">游標移到卡片上，或用手指拖曳</div>

<script src="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.js"></script>
<script>
const rx = document.getElementById("rx"), ry = document.getElementById("ry");
const show = (x, y) => { rx.textContent = x.toFixed(1) + "°"; ry.textContent = y.toFixed(1) + "°"; };
const cards = ["#a1", "#a2"].map((sel) => Atropos({
  el: document.querySelector(sel), activeOffset: 40, shadowScale: 1.05, rotateXMax: 16, rotateYMax: 16, onRotate: show,
}));

// Idle tour: feed synthetic pointer moves until a real pointer touches a card
let touring = false, idle = null, t0 = 0;
function tour(now) {
  if (!touring) return;
  const t = (now - t0) / 1000;
  cards.forEach((c, i) => {
    const r = c.el.getBoundingClientRect();
    const x = r.left + r.width * (0.5 + 0.42 * Math.sin(t * 0.9 + i * 2));
    const y = r.top + r.height * (0.5 + 0.38 * Math.cos(t * 0.7 + i));
    c.el.dispatchEvent(new PointerEvent("pointermove", { pointerType: "mouse", clientX: x, clientY: y, bubbles: true }));
  });
  requestAnimationFrame(tour);
}
function startTour() {
  touring = true;
  t0 = performance.now();
  cards.forEach((c) => {
    const r = c.el.getBoundingClientRect();
    c.el.dispatchEvent(new PointerEvent("pointerenter", { pointerType: "mouse", clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }));
  });
  requestAnimationFrame(tour);
}
function stopTour(e) {
  if (touring) {
    touring = false;
    // Release cards the real pointer is not over; the hovered one keeps following the pointer
    cards.forEach((c) => { if (!c.el.contains(e.target)) c.el.dispatchEvent(new PointerEvent("pointerleave", { pointerType: "mouse" })); });
  }
  clearTimeout(idle);
  idle = setTimeout(startTour, 5000);
}
document.addEventListener("pointermove", (e) => { if (e.isTrusted) stopTour(e); });
document.addEventListener("pointerdown", (e) => { if (e.isTrusted) stopTour(e); });
setTimeout(startTour, 500);
</script>
</body>
</html>
