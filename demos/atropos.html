<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["多層景深卡","陰影與高光","旋轉角度","浮起與常駐","群組連動","事件回呼","巢狀卡片","極限測試"]}</script>
<style>
  .sc-scene { background: radial-gradient(70% 60% at 50% 110%, #2a1f3d, var(--bg) 70%); }
  body.paper .sc-scene { background: radial-gradient(80% 70% at 50% 0%, #ffffff, var(--bg) 75%); }

  /* generic layout: .board pads around the controls, .fit is a size container for the card row */
  .board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 12px) 12px calc(var(--sc-ctl-b, 0px) + 34px); display: grid; gap: 12px; }
  .rows { grid-template-rows: auto minmax(0, 1fr); gap: 6px; }
  .fit { container-type: size; display: grid; place-items: center; min-width: 0; min-height: 0; width: 100%; height: 100%; }
  .cards { --cols: 3; --rows: 1; --gap: clamp(10px, 3.4cqw, 40px); --capH: 50px; --maxw: 260px;
    --w: min(var(--maxw), calc((100cqw - (var(--cols) - 1) * var(--gap)) / var(--cols)), calc(((100cqh - (var(--rows) - 1) * 12px) / var(--rows) - var(--capH)) * 0.75));
    display: grid; grid-template-columns: repeat(var(--cols), var(--w)); gap: 12px var(--gap); justify-content: center; align-content: center; }
  .cards.one { --cols: 1; --maxw: 300px; } .cards.four { --cols: 4; --maxw: 215px; } .cards.bare { --capH: 0px; }
  @container (max-width: 520px) { .cards.four { --cols: 2; --rows: 2; } }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  .cap { width: var(--w); text-align: center; font: 500 10.5px/1.4 var(--mono); color: var(--muted); min-height: 2.8em; overflow-wrap: anywhere; }
  .cap code { display: block; color: var(--fg); font: inherit; }
  .cap .live { display: block; color: var(--accent); font-variant-numeric: tabular-nums; }
  .state { font: 500 11.5px/1.4 var(--mono); color: var(--muted); text-align: center; }
  .state b { color: var(--accent); font-family: var(--font); }

  /* atropos card and its layers, all sized from --w */
  .ac { width: var(--w); aspect-ratio: 3 / 4; }
  .ac .atropos-inner, .ac .atropos-shadow { border-radius: calc(var(--w) * 0.07); }
  .atropos-inner { background: var(--bg-2); }
  .bg { position: absolute; left: -7%; top: -7%; width: 114%; height: 114%; max-width: none; object-fit: cover; display: block; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0.05) 35%, rgba(0, 0, 0, 0.78)); pointer-events: none; }
  .t { position: absolute; left: 8%; right: 8%; bottom: 7%; color: #fff; pointer-events: none; }
  .t small { display: block; font: 700 clamp(8px, calc(var(--w) * 0.042), 11px)/1.3 var(--mono); letter-spacing: .12em; color: #f7df1e; }
  .t h2 { margin: 1px 0; font-size: clamp(13px, calc(var(--w) * 0.11), 32px); line-height: 1.12; font-weight: 900; text-shadow: 0 6px 20px rgba(0, 0, 0, 0.6); }
  .t p { margin: 0; font-size: clamp(9.5px, calc(var(--w) * 0.048), 13px); line-height: 1.35; color: rgba(255, 255, 255, 0.86); }
  .badge { position: absolute; top: 6%; left: 7%; padding: .3em .85em; border-radius: 999px; pointer-events: none;
    font: 800 clamp(8.5px, calc(var(--w) * 0.048), 12px)/1.3 var(--mono); color: #111; background: #f7df1e; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4); }
  .polaroid { position: absolute; right: 7%; top: 9%; width: 38%; pointer-events: none; }
  .polaroid > div { padding: 6% 6% 18%; background: #fff; border-radius: 4px; transform: rotate(7deg); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45); }
  .polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .stamp { position: absolute; right: 8%; top: 8%; width: 32%; aspect-ratio: 1; pointer-events: none; }
  .stamp > div { width: 100%; height: 100%; border-radius: 50%; border: 2px dashed rgba(255, 255, 255, 0.9); display: grid; place-items: center; text-align: center;
    font: 800 clamp(8px, calc(var(--w) * 0.05), 14px)/1.2 var(--font); color: #fff; transform: rotate(-12deg); background: rgba(0, 0, 0, 0.18); }
  .flare { position: absolute; inset: -20%; pointer-events: none; mix-blend-mode: screen; opacity: 0;
    background: radial-gradient(circle at 32% 26%, rgba(255, 240, 190, 0.9), rgba(255, 196, 120, 0.3) 16%, transparent 42%); }
  .bub { position: absolute; border-radius: 50%; pointer-events: none; border: 1.5px solid rgba(255, 255, 255, 0.7);
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.6), rgba(255, 255, 255, 0.04) 62%); }

  /* virtual pointer + autopilot chip */
  .ghost { position: absolute; left: 0; top: 0; z-index: 30; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none;
    border: 2px solid var(--accent); background: rgba(247, 223, 30, 0.16); box-shadow: 0 0 0 4px rgba(247, 223, 30, 0.1); opacity: 0; transition: opacity .25s; }
  .ghost::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--accent); }
  .ghost.on { opacity: 1; }
  .pilot { position: absolute; right: 10px; bottom: 8px; z-index: 30; padding: 2px 10px; border-radius: 999px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; transition: opacity .3s; white-space: nowrap; }
  .pilot.off { opacity: 0; }

  /* 5. group zone */
  .zone { position: relative; min-width: 0; min-height: 0; border: 1.5px dashed rgba(247, 223, 30, 0.45); border-radius: 14px; background: rgba(247, 223, 30, 0.03); padding: 26px 10px 10px; }
  .zone .cards { --maxw: 220px; }
  .ztag { position: absolute; left: 10px; top: 5px; font: 500 11px/1.4 var(--mono); color: var(--accent); }

  /* 6. events */
  .evt { grid-template-columns: minmax(0, 1fr) minmax(0, 290px); }
  .data { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; align-content: start; min-height: 0; overflow: hidden; padding: 12px 14px; }
  .vals { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font: 500 12px/1.55 var(--mono); }
  .vals small { color: var(--muted); font-size: 11.5px; }
  .vals b { color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
  .vals b.off { color: var(--muted); }
  .pad { position: relative; width: 62px; height: 62px; border-radius: 8px; border: 1px solid var(--line); background: rgba(127, 127, 127, 0.08); }
  .pad::before, .pad::after { content: ""; position: absolute; background: var(--line); }
  .pad::before { left: 50%; top: 4px; bottom: 4px; width: 1px; } .pad::after { top: 50%; left: 4px; right: 4px; height: 1px; }
  .pad i { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--c2); box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.25); }
  .counts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .counts div { padding: 5px 8px; border-radius: 8px; background: rgba(127, 127, 127, 0.1); min-width: 0; }
  .counts small { display: block; color: var(--muted); font-size: 11px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .counts b { font: 700 15px/1.3 var(--mono); color: var(--c4); }
  .log { grid-column: 1 / -1; font-size: 12px; }
  .log small { color: var(--muted); }
  .log ol { margin: 4px 0 0; padding: 0; list-style: none; font: 11px/1.6 var(--mono); }
  .log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px dashed var(--line); }
  .log li b { color: var(--c2); font-weight: 600; }
  .log li b.leave { color: var(--c3); }
  @media (max-width: 520px) {
    .evt { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .data { padding: 8px 10px; gap: 6px 10px; }
    .vals { font-size: 11px; line-height: 1.4; }
    .pad { width: 50px; height: 50px; }
    .log li:nth-child(n+3) { display: none; }
  }

  /* 7. nested */
  .outer { --ow: min(640px, 100cqw, calc((100cqh - 4px) * 4 / 3)); width: var(--ow); aspect-ratio: 4 / 3; }
  .outer .atropos-inner, .outer .atropos-shadow { border-radius: calc(var(--ow) * 0.035); }
  .outer .bg { left: -5%; top: -5%; width: 110%; height: 110%; }
  .outer .shade { background: linear-gradient(160deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.1) 55%, rgba(0, 0, 0, 0.55)); }
  .outer .t { --w: var(--ow); top: 6%; bottom: auto; left: 5%; right: 40%; }
  .outer .t h2 { font-size: clamp(14px, calc(var(--ow) * 0.06), 34px); }
  .outer .t p { font-size: clamp(9.5px, calc(var(--ow) * 0.024), 13px); }
  .outer .stamp { --w: calc(var(--ow) * 0.5); right: 5%; top: 7%; width: 17%; }
  .nslot { position: absolute; width: 27%; }
  .nslot.a { left: 6%; bottom: 7%; } .nslot.b { left: 38%; bottom: 11%; }
  .nslot .ac { --w: calc(var(--ow) * 0.27); }
  .nslot .t { left: 7%; right: 7%; bottom: 6%; }

  /* 8. stress */
  .st-box { position: absolute; inset: 8px 8px 8px 350px; }
  @media (max-width: 760px) { .st-box { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 16px) 8px; } }
  .wall { position: absolute; inset: 0; }
  .tile { position: absolute; }
  .tile .atropos-inner, .tile .atropos-shadow { border-radius: 8%; }
  .tbg { position: absolute; left: -8%; top: -8%; width: 116%; height: 116%; background: center / cover no-repeat; }
  .tdot { position: absolute; right: 10%; top: 8%; width: 22%; aspect-ratio: 1; border-radius: 50%; background: #f7df1e; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45); }
  .tnum { position: absolute; left: 10%; bottom: 7%; color: #fff; font: 800 var(--fs, 12px)/1 var(--mono); text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/atropos@2.0.2/atropos.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Atropos showcase: eight scenes from the layered travel cards to a many-cards stress ramp.
const h = Showcase.h;
const IMG = (n) => `_shared/img/photo-${n}.jpg`;

// Atropos needs .atropos > .atropos-scale > .atropos-rotate > .atropos-inner; layers go inside the inner box.
const shell = (layers, cls = "ac") => `<div class="atropos ${cls}"><div class="atropos-scale"><div class="atropos-rotate"><div class="atropos-inner">${layers}</div></div></div></div>`;
// A simple three-layer artwork: background pushed back, badge and title pulled forward.
const art = ({ img, title, sub = "", badge = "", tone = "#f7df1e", ink = "#111", kicker = "" }) => `
  <img class="bg" src="${IMG(img)}" alt="" data-atropos-offset="-5"><div class="shade"></div>
  ${badge ? `<div class="badge" data-atropos-offset="10" style="background:${tone};color:${ink}">${badge}</div>` : ""}
  <div class="t" data-atropos-offset="6">${kicker ? `<small>${kicker}</small>` : ""}<h2>${title}</h2>${sub ? `<p>${sub}</p>` : ""}</div>`;
const item = (layers, cap = "", note = "") => `<div class="item">${shell(layers)}${cap ? `<div class="cap"><code>${cap}</code>${note ? `<span class="note">${note}</span>` : `<span class="live">X 0.0°　Y 0.0°</span>`}</div>` : ""}</div>`;
const deck = (items, cls = "") => `<div class="fit"><div class="cards ${cls}">${items.join("")}</div></div>`;

// Create an instance that is destroyed with the scene.
function atropos(ctx, opts) {
  const a = Atropos(opts);
  ctx.onCleanup(() => a.destroy());
  return a;
}
// destroy() only removes listeners and the write loop; clear what it leaves behind so new options start clean.
function teardown(a) {
  a.destroy();
  a.el.classList.remove("atropos-active");
  a.el.querySelectorAll(".atropos-shadow, .atropos-highlight").forEach((n) => n.remove());
  a.el.querySelectorAll(".atropos-scale, .atropos-rotate, [data-atropos-offset]").forEach((n) => { n.style.transform = ""; n.style.transformOrigin = ""; });
}
// onRotate handler that writes into the caption under the card.
const live = (el) => {
  const out = el.closest(".item") && el.closest(".item").querySelector(".live");
  return (x, y) => { if (out) out.textContent = `X ${x.toFixed(1)}°　Y ${y.toFixed(1)}°`; };
};
const over = (el, u, v) => { const r = el.getBoundingClientRect(); return [r.left + u * r.width, r.top + v * r.height]; };

// Virtual mouse: Atropos only hovers for PointerEvents whose pointerType is "mouse", so that is what we send.
// Each pointer: { at(ms) -> [x, y] | null, targets: [outer ... inner] }. pointerenter / pointerleave follow the
// target boxes; pointermove goes to the innermost target and bubbles to the outer ones (nested cards rely on it).
// Real pointer input hands control back; the autopilot resumes after 5 s of stillness.
function pilot(ctx, pointers) {
  const ghosts = pointers.map(() => ctx.el.appendChild(h("i", { class: "ghost" })));
  const chip = ctx.el.appendChild(h("div", { class: "pilot", text: "自動示範中，移動滑鼠即可接手" }));
  const inside = pointers.map(() => new Set());
  let auto = true, t0 = 0, resume = 0;
  const fire = (el, type, x, y) => el.dispatchEvent(new PointerEvent(type, { pointerType: "mouse", isPrimary: true, clientX: x, clientY: y, bubbles: type === "pointermove" }));
  const lift = (i, keep) => {
    inside[i].forEach((el) => { if (!keep || !el.contains(keep)) fire(el, "pointerleave", 0, 0); });
    inside[i].clear();
    ghosts[i].classList.remove("on");
  };
  ctx.raf((t) => {
    if (!auto) return;
    t0 = t0 || t;
    const base = ctx.el.getBoundingClientRect();
    pointers.forEach((p, i) => {
      const pos = p.at(t - t0);
      if (!pos) return lift(i);
      const [x, y] = pos;
      let deepest = null;
      for (const el of p.targets) {
        const r = el.getBoundingClientRect();
        const isOver = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        if (isOver && !inside[i].has(el)) { inside[i].add(el); fire(el, "pointerenter", x, y); }
        if (!isOver && inside[i].has(el)) { inside[i].delete(el); fire(el, "pointerleave", x, y); }
        if (isOver) deepest = el;
      }
      if (deepest) fire(deepest, "pointermove", x, y);
      ghosts[i].classList.add("on");
      ghosts[i].style.transform = `translate(${x - base.left}px, ${y - base.top}px)`;
    });
  });
  const handBack = (e) => {
    if (!e.isTrusted) return;
    // keep the card under the real pointer active, release the rest
    if (auto) { auto = false; pointers.forEach((_, i) => lift(i, e.target)); chip.classList.add("off"); }
    clearTimeout(resume);
    resume = setTimeout(() => { if (ctx.active) { auto = true; t0 = 0; chip.classList.remove("off"); } }, 5000);
  };
  ctx.onCleanup(() => clearTimeout(resume));
  ctx.on(ctx.el, "pointermove", handBack);
  ctx.on(ctx.el, "pointerdown", handBack);
  // after re-creating instances, forget hover state so the next frame sends pointerenter again
  return { reset: () => inside.forEach((s) => s.clear()) };
}
// One pointer per card, all on the same relative path, for side-by-side comparisons.
const twins = (els, path) => els.map((el) => ({ targets: [el], at: (ms) => { const p = path(ms); return p && over(el, p[0], p[1]); } }));
// Path through fixed stops: circle around each stop for `hold` ms, then glide to the next one in `move` ms.
const tour = (stops, hold, move, wob) => (ms) => {
  const seg = hold + move, i = Math.floor(ms / seg) % stops.length, k = ms % seg;
  const [ax, ay] = stops[i], [bx, by] = stops[(i + 1) % stops.length];
  const e = k < hold ? 0 : (1 - Math.cos(Math.PI * (k - hold) / move)) / 2;
  const w = k < hold ? wob * Math.sin(Math.PI * k / hold) : 0;
  return [ax + (bx - ax) * e + w * Math.cos(ms * 0.005), ay + (by - ay) * e + w * Math.sin(ms * 0.005)];
};
// Pointer that is on the card for `inMs`, then away for `outMs`.
const visits = (inMs, outMs, onState) => (ms) => {
  const on = ms % (inMs + outMs) < inMs;
  onState(on);
  return on ? [0.5 + 0.38 * Math.sin(ms * 0.0028), 0.5 + 0.38 * Math.cos(ms * 0.0021)] : null;
};

Showcase.run({ scenes: [
  {
    id: "layers", title: "多層景深卡",
    api: '<img data-atropos-offset="-5"> ・ <div data-atropos-opacity="0;1"> ・ Atropos({ el, activeOffset: 40 })',
    desc: "每一層用 data-atropos-offset 決定位移量，負值往後退、正值往前浮；data-atropos-opacity 讓左卡的陽光隨傾斜淡入。滑桿同時放大或歸零所有圖層的位移。",
    hint: "滑鼠移到卡片上・把視差倍率拉到 0 會變回平面卡",
    mount(ctx) {
      ctx.html(`<div class="board">${deck([
        item(`<img class="bg" src="${IMG(1)}" alt="峽灣" data-atropos-offset="-5"><div class="shade"></div>
          <div class="flare" data-atropos-offset="14" data-atropos-opacity="0;1"></div>
          <div class="polaroid" data-atropos-offset="6"><div><img src="${IMG(3)}" alt="山谷公路"></div></div>
          <div class="badge" data-atropos-offset="10">3D</div>
          <div class="t" data-atropos-offset="8"><small>NORWAY</small><h2>峽灣之旅</h2><p>背景後退，照片與標題前浮</p></div>`, "offset -5 ～ 14・opacity 0;1"),
        item(`<img class="bg" src="${IMG(7)}" alt="母獅" data-atropos-offset="-4"><div class="shade"></div>
          <div class="stamp" data-atropos-offset="9"><div>草原<br>認證</div></div>
          <div class="badge" data-atropos-offset="12" style="background:#ff8c42">野生</div>
          <div class="t" data-atropos-offset="7"><small>SAVANNA</small><h2>草原之王</h2><p>印章與標籤各在不同深度</p></div>`, "offset -4 ～ 12"),
        item(`<img class="bg" src="${IMG(6)}" alt="水母" data-atropos-offset="-6"><div class="shade"></div>
          <i class="bub" data-atropos-offset="3" style="left:14%;top:30%;width:9%;aspect-ratio:1"></i>
          <i class="bub" data-atropos-offset="9" style="left:66%;top:20%;width:14%;aspect-ratio:1"></i>
          <i class="bub" data-atropos-offset="16" style="left:58%;top:52%;width:22%;aspect-ratio:1"></i>
          <div class="t" data-atropos-offset="8"><small>DEEP SEA</small><h2>深海水母</h2><p>氣泡越大越靠前，位移越多</p></div>`, "offset -6 ～ 16"),
      ])}</div>`);
      const layers = ctx.$$("[data-atropos-offset]");
      layers.forEach((n) => { n.dataset.base = n.dataset.atroposOffset; });
      const els = ctx.$$(".atropos");
      els.forEach((el) => atropos(ctx, { el, activeOffset: 40, shadowScale: 1.05, rotateXMax: 16, rotateYMax: 16, onRotate: live(el) }));
      // Atropos reads data-atropos-offset on every move, so rewriting the attribute takes effect immediately.
      ctx.slider("視差倍率", { min: 0, max: 2.5, step: 0.1, value: 1, format: (v) => `×${v.toFixed(1)}` },
        (k) => layers.forEach((n) => { n.dataset.atroposOffset = (n.dataset.base * k).toFixed(2); }));
      const row = ctx.$(".cards");
      pilot(ctx, [{ targets: els, at: (ms) => over(row, 0.5 + 0.48 * Math.sin(ms * 0.0005 - 1.6), 0.42 + 0.34 * Math.sin(ms * 0.0019)) }]);
    },
  },
  {
    id: "light", title: "陰影與高光", paper: true,
    api: "Atropos({ el, shadow, highlight, shadowOffset, shadowScale })",
    desc: "shadow 在卡片背後加一層模糊黑影，只在作用中顯示，shadowOffset 是它往後退的距離，shadowScale 是大小；highlight 是一層跟著傾斜方向移動的白色光暈。",
    hint: "比較三張卡的影子與光暈・調整陰影距離與大小",
    mount(ctx) {
      ctx.html(`<div class="board">${deck([
        item(art({ img: 6, title: "深海水母", kicker: "DEFAULT", badge: "影＋光" }), "shadow＋highlight"),
        item(art({ img: 6, title: "深海水母", kicker: "NO SHADOW", badge: "只有光", tone: "#4cc9f0" }), "shadow: false"),
        item(art({ img: 6, title: "深海水母", kicker: "NO HIGHLIGHT", badge: "只有影", tone: "#f72585", ink: "#fff" }), "highlight: false"),
      ])}</div>`);
      const els = ctx.$$(".atropos");
      const KIND = [{}, { shadow: false }, { highlight: false }];
      let list = [], offset = 50, scale = 1, pc = null;
      const setup = () => {
        list.forEach(teardown);
        list = els.map((el, i) => Atropos({ el, rotateXMax: 18, rotateYMax: 18, shadowOffset: offset, shadowScale: scale, onRotate: live(el), ...KIND[i] }));
        if (pc) pc.reset();
      };
      ctx.onCleanup(() => list.forEach((a) => a.destroy()));
      setup();
      ctx.slider("shadowOffset", { min: 0, max: 150, step: 5, value: 50 }, (v) => { offset = v; setup(); });
      ctx.slider("shadowScale", { min: 0.5, max: 1.4, step: 0.05, value: 1 }, (v) => { scale = v; setup(); });
      pc = pilot(ctx, twins(els, (ms) => [0.5 + 0.44 * Math.cos(ms * 0.0012), 0.5 + 0.44 * Math.sin(ms * 0.0017)]));
    },
  },
  {
    id: "rotate", title: "旋轉角度",
    api: "Atropos({ el, rotateXMax, rotateYMax, rotateXInvert, rotateYInvert })",
    desc: "四張卡收到同一條圓形路徑：rotateXMax／rotateYMax 分別限制上下與左右的最大角度，可以設成不對稱；Invert 把方向反過來，變成指標那一側翹起。",
    hint: "對照黃圈位置與卡片傾斜方向・讀卡片下方的實際角度",
    mount(ctx) {
      ctx.html(`<div class="board">${deck([
        item(art({ img: 5, title: "預設", kicker: "15° / 15°", badge: "DEFAULT" }), "rotateX/YMax: 15"),
        item(art({ img: 8, title: "大角度", kicker: "35° / 35°", badge: "35°", tone: "#ff8c42" }), "rotateX/YMax: 35"),
        item(art({ img: 3, title: "左右擺", kicker: "4° / 30°", badge: "WIDE", tone: "#4cc9f0" }), "rotateXMax: 4・rotateYMax: 30"),
        item(art({ img: 4, title: "反轉", kicker: "INVERT", badge: "INV", tone: "#f72585", ink: "#fff" }), "rotateXInvert・rotateYInvert"),
      ], "four")}</div>`);
      const els = ctx.$$(".atropos");
      const OPTS = [{}, { rotateXMax: 35, rotateYMax: 35 }, { rotateXMax: 4, rotateYMax: 30 }, { rotateXInvert: true, rotateYInvert: true }];
      els.forEach((el, i) => atropos(ctx, { el, activeOffset: 30, onRotate: live(el), ...OPTS[i] }));
      pilot(ctx, twins(els, (ms) => [0.5 + 0.42 * Math.cos(ms * 0.0014), 0.5 + 0.42 * Math.sin(ms * 0.0014)]));
    },
  },
  {
    id: "lift", title: "浮起與常駐",
    api: "Atropos({ el, activeOffset, alwaysActive, duration })",
    desc: "指標移入時卡片沿 Z 軸往前浮 activeOffset 像素，移出再落回；alwaysActive 讓卡片一直保持浮起和陰影，指標離開只回到正中央。duration 是進出與回正的過渡時間。",
    hint: "等指標離開卡片時比較四張卡・拖曳 duration 看過渡快慢",
    mount(ctx) {
      ctx.html(`<div class="board rows"><div class="state">指標：<b>…</b></div>${deck([
        item(art({ img: 1, title: "不浮起", kicker: "0 px", badge: "0" }), "activeOffset: 0"),
        item(art({ img: 6, title: "預設", kicker: "50 px", badge: "50", tone: "#4cc9f0" }), "activeOffset: 50"),
        item(art({ img: 7, title: "浮很高", kicker: "140 px", badge: "140", tone: "#ff8c42" }), "activeOffset: 140"),
        item(art({ img: 2, title: "常駐", kicker: "ALWAYS", badge: "ON", tone: "#7bd389" }), "alwaysActive: true"),
      ], "four")}</div>`);
      const els = ctx.$$(".atropos"), state = ctx.$(".state b");
      const OPTS = [{ activeOffset: 0 }, { activeOffset: 50 }, { activeOffset: 140 }, { alwaysActive: true }];
      let list = [], duration = 300, pc = null, last = null;
      const setup = () => {
        list.forEach(teardown);
        list = els.map((el, i) => Atropos({ el, duration, onRotate: live(el), ...OPTS[i] }));
        if (pc) pc.reset();
      };
      ctx.onCleanup(() => list.forEach((a) => a.destroy()));
      setup();
      ctx.slider("duration", { min: 100, max: 1500, step: 50, value: 300, format: (v) => `${v} ms` }, (v) => { duration = v; setup(); });
      pc = pilot(ctx, twins(els, visits(2200, 1800, (on) => { if (on !== last) state.textContent = (last = on) ? "在卡片上" : "已離開卡片"; })));
    },
  },
  {
    id: "group", title: "群組連動",
    api: "Atropos({ el, eventsEl: zone, stretchX, stretchY, stretchZ, commonOrigin })",
    desc: "三張卡共用同一個 eventsEl，指標進入虛線區就一起作用；角度依卡片與指標的相對位置計算，stretch 讓卡片朝指標方向平移與後退，commonOrigin 以指標為共同的旋轉中心。",
    hint: "在虛線區任意位置移動滑鼠・調整 stretch 與 commonOrigin",
    mount(ctx) {
      ctx.html(`<div class="board"><div class="zone"><span class="ztag">eventsEl：整個虛線區</span>${deck([
        item(art({ img: 5, title: "瀑布", kicker: "A" })),
        item(art({ img: 1, title: "峽灣", kicker: "B", badge: "GROUP", tone: "#9d8cff", ink: "#fff" })),
        item(art({ img: 8, title: "海象", kicker: "C" })),
      ], "bare")}</div></div>`);
      const els = ctx.$$(".atropos"), zone = ctx.$(".zone");
      let list = [], sxy = 25, sz = 80, origin = true, pc = null;
      const setup = () => {
        list.forEach(teardown);
        list = els.map((el) => Atropos({ el, eventsEl: zone, rotateXMax: 12, rotateYMax: 14, stretchX: sxy, stretchY: sxy, stretchZ: sz, commonOrigin: origin }));
        if (pc) pc.reset();
      };
      ctx.onCleanup(() => list.forEach((a) => a.destroy()));
      setup();
      ctx.slider("stretchX／Y", { min: 0, max: 60, step: 5, value: 25, format: (v) => `${v}%` }, (v) => { sxy = v; setup(); });
      ctx.slider("stretchZ", { min: 0, max: 240, step: 10, value: 80, format: (v) => `${v}px` }, (v) => { sz = v; setup(); });
      ctx.toggle("commonOrigin", true, (v) => { origin = v; setup(); });
      pc = pilot(ctx, [{ targets: [zone], at: (ms) => over(zone, 0.5 + 0.46 * Math.sin(ms * 0.0008), 0.5 + 0.4 * Math.sin(ms * 0.0013 + 0.7)) }]);
    },
  },
  {
    id: "events", title: "事件回呼",
    api: "Atropos({ el, onEnter, onLeave, onRotate(x, y) }) ・ instance.isActive ・ instance.destroy()",
    desc: "onEnter 與 onLeave 在指標進出時各觸發一次，onRotate 每次重算角度都帶入 rotateX、rotateY；實例上的 isActive 表示目前是否作用中，destroy() 之後卡片不再回應。",
    hint: "看右側計數與紀錄・按 destroy() 再重新建立",
    mount(ctx) {
      ctx.html(`<div class="board evt">
        ${deck([item(`<img class="bg" src="${IMG(3)}" alt="山谷公路" data-atropos-offset="-5"><div class="shade"></div>
          <div class="polaroid" data-atropos-offset="7"><div><img src="${IMG(5)}" alt="瀑布"></div></div>
          <div class="badge" data-atropos-offset="11" style="background:#7bd389">EVENTS</div>
          <div class="t" data-atropos-offset="7"><small>CALLBACKS</small><h2>綠色山谷公路</h2><p>每次進出與轉動都會回報</p></div>`)], "one bare")}
        <div class="panel data">
          <div class="vals">
            <small>rotateX</small><b data-k="x">0.0°</b><small>rotateY</small><b data-k="y">0.0°</b>
            <small>isActive</small><b data-k="active">false</b><small>destroyed</small><b data-k="dead">false</b>
          </div>
          <div class="pad" title="rotateY／rotateX"><i></i></div>
          <div class="counts"><div><small>onEnter</small><b data-c="enter">0</b></div><div><small>onLeave</small><b data-c="leave">0</b></div><div><small>onRotate／秒</small><b data-c="rate">0</b></div></div>
          <div class="log"><small>事件紀錄（最新在上）</small><ol></ol></div>
        </div></div>`);
      const el = ctx.$(".atropos"), list = ctx.$(".log ol"), dot = ctx.$(".pad i");
      const v = (k) => ctx.$(`[data-k="${k}"]`), c = (k) => ctx.$(`[data-c="${k}"]`);
      const out = { x: v("x"), y: v("y"), active: v("active"), dead: v("dead"), enter: c("enter"), leave: c("leave"), rate: c("rate") };
      const n = { enter: 0, leave: 0, rot: 0 };
      const log = (name, cls = "") => {
        const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
        const li = h("li", {}, `${time}　`, h("b", { class: cls, text: name }));
        list.prepend(li);
        while (list.children.length > 4) list.lastChild.remove();
      };
      let inst = null, pc = null;
      const create = () => {
        if (pc) pc.reset();
        inst = atropos(ctx, {
          el, activeOffset: 45, rotateXMax: 18, rotateYMax: 18,
          onEnter: () => { out.enter.textContent = ++n.enter; log("onEnter()"); },
          onLeave: () => { out.leave.textContent = ++n.leave; log("onLeave()", "leave"); },
          onRotate: (x, y) => {
            n.rot++;
            out.x.textContent = `${x.toFixed(1)}°`;
            out.y.textContent = `${y.toFixed(1)}°`;
            dot.style.left = `${50 + (y / 18) * 42}%`;
            dot.style.top = `${50 - (x / 18) * 42}%`;
          },
        });
      };
      create();
      ctx.interval(() => { out.rate.textContent = n.rot; n.rot = 0; }, 1000);
      ctx.raf(() => {
        out.active.textContent = String(inst.isActive);
        out.active.classList.toggle("off", !inst.isActive);
        out.dead.textContent = String(inst.destroyed);
        out.dead.classList.toggle("off", !inst.destroyed);
      });
      const btn = ctx.button("destroy()", () => {
        if (inst.destroyed) { create(); btn.textContent = "destroy()"; log("Atropos() 重新建立"); }
        else { teardown(inst); btn.textContent = "重新建立 Atropos()"; log("destroy()", "leave"); }
      }, { primary: true });
      pc = pilot(ctx, twins([el], visits(2600, 1400, () => {})));
    },
  },
  {
    id: "nested", title: "巢狀卡片",
    api: "Atropos({ el: outer }) ＋ Atropos({ el: inner })，inner 放在 outer 的圖層裡",
    desc: "大卡片裡的兩張小卡本身也是 Atropos 實例，外層把它們當成往前浮的圖層移動；指標停在小卡上時，pointermove 冒泡到外層，兩層同時轉動。",
    hint: "把指標停在小卡上，比較大卡與小卡的轉動",
    mount(ctx) {
      const mini = (img, title, kicker, tone) => shell(`<img class="bg" src="${IMG(img)}" alt="" data-atropos-offset="-6"><div class="shade"></div>
        <div class="badge" data-atropos-offset="12" style="background:${tone}">${kicker}</div>
        <div class="t" data-atropos-offset="8"><h2>${title}</h2></div>`);
      ctx.html(`<div class="board rows"><div class="state">外層 <b data-s="o">X 0.0°　Y 0.0°</b>　小卡 A <b data-s="a">待命</b>　小卡 B <b data-s="b">待命</b></div>
        <div class="fit">${shell(`<img class="bg" src="${IMG(3)}" alt="山谷公路" data-atropos-offset="-4"><div class="shade"></div>
          <div class="t" data-atropos-offset="5"><small>TRAVEL LOG</small><h2>旅行手帳</h2><p>外層一張卡，裡面再放兩張可以各自轉動的小卡</p></div>
          <div class="stamp" data-atropos-offset="9"><div>2026<br>夏季</div></div>
          <div class="nslot a" data-atropos-offset="8">${mini(5, "瀑布", "A", "#f7df1e")}</div>
          <div class="nslot b" data-atropos-offset="12">${mini(8, "海象", "B", "#4cc9f0")}</div>`, "outer")}</div></div>`);
      const outerEl = ctx.$(".outer"), [aEl, bEl] = ctx.$$(".nslot .atropos");
      const so = ctx.$('[data-s="o"]'), sa = ctx.$('[data-s="a"]'), sb = ctx.$('[data-s="b"]');
      // The outer card must be created first so it claims its own .atropos-rotate / shadow before the inner ones exist.
      atropos(ctx, { el: outerEl, activeOffset: 30, rotateXMax: 10, rotateYMax: 12, shadowScale: 0.96,
        onRotate: (x, y) => { so.textContent = `X ${x.toFixed(1)}°　Y ${y.toFixed(1)}°`; } });
      const ia = atropos(ctx, { el: aEl, activeOffset: 40, rotateXMax: 22, rotateYMax: 22 });
      const ib = atropos(ctx, { el: bEl, activeOffset: 40, rotateXMax: 22, rotateYMax: 22 });
      ctx.raf(() => {
        sa.textContent = ia.isActive ? "作用中" : "待命";
        sb.textContent = ib.isActive ? "作用中" : "待命";
      });
      // stops: small card B, free area of the big card, small card A, title area
      const path = tour([[0.515, 0.64], [0.8, 0.34], [0.195, 0.68], [0.32, 0.26]], 3400, 800, 0.08);
      pilot(ctx, [{ targets: [outerEl, aEl, bEl], at: (ms) => { const [u, v] = path(ms); return over(outerEl, u, v); } }]);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "Atropos(N 張 alwaysActive 卡片) ＋ 每張每幀一次 pointermove",
    desc: "N 張三層卡片同時轉動：每張每幀收到一次 pointermove，重算角度並更新三個圖層、陰影與高光，逐級加量直到掉到 30 FPS 以下。",
    hint: "按「自動加壓」開始・關掉陰影與高光再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="st-box"><div class="wall"></div></div>`);
      const wall = ctx.$(".wall");
      let list = [], geo = [], n = 0, fx = true, rot = 0, rate = 0;
      ctx.interval(() => { rate = rot; rot = 0; }, 1000);
      const clear = () => { list.forEach((a) => a.destroy()); list = []; };
      ctx.onCleanup(clear);
      // Choose the column count that gives the largest 3:4 tiles, write all markup at once, then create instances.
      const build = () => {
        clear();
        const W = wall.clientWidth, H = wall.clientHeight, o = wall.getBoundingClientRect();
        let best = null;
        for (let c = 1; c <= n; c++) {
          const r = Math.ceil(n / c), cw = Math.min(W / c, (H / r) * 0.75);
          if (!best || cw > best.cw) best = { c, r, cw };
        }
        const { c, r, cw } = best, ch = cw / 0.75, pad = Math.max(1, cw * 0.12);
        const x0 = (W - c * cw) / 2, y0 = (H - r * ch) / 2, w = cw - pad, hh = ch - pad;
        let html = "";
        geo = [];
        for (let i = 0; i < n; i++) {
          const col = i % c, row = (i / c) | 0, x = x0 + col * cw + pad / 2, y = y0 + row * ch + pad / 2;
          geo.push({ x: o.left + x, y: o.top + y, col, row });
          html += `<div class="atropos tile" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px;--fs:${Math.max(7, w * 0.16).toFixed(1)}px">`
            + `<div class="atropos-scale"><div class="atropos-rotate"><div class="atropos-inner">`
            + `<div class="tbg" data-atropos-offset="-6" style="background-image:url(${IMG((i % 8) + 1)})"></div>`
            + `<i class="tdot" data-atropos-offset="14"></i><b class="tnum" data-atropos-offset="8">${i + 1}</b></div></div></div></div>`;
        }
        wall.innerHTML = html;
        geo.forEach((g) => { g.w = w; g.h = hh; });
        list = [...wall.children].map((el) => Atropos({ el, alwaysActive: true, activeOffset: 16, rotateXMax: 18, rotateYMax: 18, shadow: fx, highlight: fx, onRotate: () => rot++ }));
      };
      ctx.onResize(() => n && build());
      // Each tile gets its own pointer position every frame; phases ripple across the grid.
      ctx.raf((t) => {
        for (let i = 0; i < list.length; i++) {
          const g = geo[i];
          const u = 0.5 + 0.5 * Math.sin(t * 0.0021 + g.col * 0.45 + g.row * 0.2);
          const v = 0.5 + 0.5 * Math.cos(t * 0.0017 + g.row * 0.45);
          list[i].el.dispatchEvent(new PointerEvent("pointermove", { pointerType: "mouse", clientX: g.x + u * g.w, clientY: g.y + v * g.h }));
        }
      });
      ctx.toggle("陰影與高光", true, (on) => { fx = on; if (n) build(); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "卡片", unit: "張", steps: [4, 8, 16, 32, 64, 128, 256, 512, 1024],
        minFps: 30,
        apply(count) { n = count; build(); },
        metrics: () => ({ "onRotate／秒": rate, "位移圖層": n * 3, "陰影與高光": fx ? "開" : "關" }),
        note: "每張卡片是一個獨立的 Atropos 實例，各自跑一條常駐的 requestAnimationFrame 寫入佇列；每幀每張卡收到一次 pointermove，重算角度並寫入外框、三個圖層、陰影與高光的樣式。陰影是 blur(30px) 的濾鏡層，關掉陰影與高光再測一次就能看出它佔多少成本。一般頁面同時作用的通常只有指標下那一張。",
      });
    },
  },
] });
</script>
</body>
</html>
