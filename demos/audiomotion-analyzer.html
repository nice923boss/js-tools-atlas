<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>audioMotion-analyzer 示範：即時音樂頻譜</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":["audio"]}</script>
<style>
  body {
    background:
      radial-gradient(45% 55% at 50% 52%, rgba(157, 140, 255, 0.16), transparent 70%),
      radial-gradient(80% 60% at 50% 110%, rgba(247, 37, 133, 0.12), transparent 70%),
      var(--bg);
  }
  #viz { position: fixed; inset: 0; }
  .center {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 40;
    display: grid; place-items: center; gap: 8px; text-align: center; pointer-events: none;
  }
  .center button {
    pointer-events: auto; width: 86px; height: 86px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-size: 30px; font-weight: 700;
    box-shadow: 0 0 0 10px rgba(247, 223, 30, 0.12), 0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .center div { font-size: 13px; color: var(--fg); text-shadow: 0 1px 6px #000; }
  .center.hide { display: none; }
  .colors {
    position: fixed; right: 12px; bottom: 12px; z-index: 50; display: flex; gap: 6px; align-items: center;
  }
  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { border-color: #fff; }
  @media (max-width: 560px) {
    .controls .btn { padding: 6px 9px; font-size: 12px; }
    .center button { width: 64px; height: 64px; font-size: 22px; }
    .hint { max-width: 170px; }
  }
</style>
</head>
<body>
<div id="viz"></div>
<div class="controls" id="modes">
  <button class="btn primary" id="pause" hidden>❚❚ 暫停</button>
</div>
<div class="center" id="center">
  <button id="play" aria-label="播放">▶</button>
  <div>按下播放，頻譜即時展開</div>
</div>
<div class="colors" id="colors"></div>
<div class="hint">切換右上角樣式與右下角配色</div>
<audio id="audio" src="_shared/audio/loop.mp3" loop preload="auto"></audio>

<script type="module">
// audioMotion-analyzer: real-time spectrum of the shared loop, with switchable visual presets.
import AudioMotionAnalyzer from "https://cdn.jsdelivr.net/npm/audiomotion-analyzer@4.5.4/src/audioMotion-analyzer.js";

const audio = document.getElementById("audio");
const am = new AudioMotionAnalyzer(document.getElementById("viz"), {
  source: audio,
  overlay: true,
  showBgColor: false,
  bgAlpha: 0,
  smoothing: 0.7,
  maxFreq: 16000,
  onCanvasDraw: (inst) => { if (audio.paused) drawIdle(inst); },
});

// Idle preview drawn on the analyzer's own canvas until playback starts.
function drawIdle(inst) {
  const g = inst.canvasCtx, W = inst.canvas.width, H = inst.canvas.height, t = performance.now() / 1000;
  const N = 72;
  g.save();
  if (inst.radial) {
    const cx = W / 2, cy = H / 2, r0 = Math.min(W, H) * 0.2, span = Math.min(W, H) * 0.24;
    g.lineCap = "round";
    g.lineWidth = Math.max(2, Math.min(W, H) / 140);
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 + t * 0.15;
      const v = 0.25 + 0.2 * Math.sin(i * 0.5 + t * 1.6) + 0.15 * Math.sin(i * 1.3 - t);
      g.strokeStyle = `hsla(${(i / N) * 300 + 300}, 85%, 62%, 0.55)`;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      g.lineTo(cx + Math.cos(a) * (r0 + v * span), cy + Math.sin(a) * (r0 + v * span));
      g.stroke();
    }
  } else {
    const bw = W / N;
    for (let i = 0; i < N; i++) {
      const v = 0.18 + 0.12 * Math.sin(i * 0.35 + t * 1.4) + 0.1 * Math.sin(i * 0.9 - t * 0.8);
      const h = v * H * (1 - i / N * 0.5);
      g.fillStyle = `hsla(${(i / N) * 200 + 320}, 85%, 60%, 0.45)`;
      g.fillRect(i * bw + bw * 0.15, H * 0.82 - h, bw * 0.7, h);
    }
  }
  g.restore();
}

am.registerGradient("atlas", {
  bgColor: "#0e1013",
  colorStops: ["#f72585", "#9d8cff", "#4cc9f0", "#7bd389", "#f7df1e"],
});
am.registerGradient("sunset", {
  bgColor: "#0e1013",
  colorStops: [{ color: "#f7df1e", pos: 0 }, { color: "#ff8c42", pos: 0.45 }, { color: "#f72585", pos: 1 }],
});

// Visual presets: every key that any preset touches is reset so switching is clean.
const BASE = {
  mode: 3, radial: false, ledBars: false, trueLeds: false, reflexRatio: 0, mirror: 0, roundBars: false,
  lumiBars: false, alphaBars: false, outlineBars: false, fillAlpha: 1, lineWidth: 0, noteLabels: false,
  showPeaks: true, spinSpeed: 0, channelLayout: "single", frequencyScale: "log", barSpace: 0.25, radius: 0.32,
  showScaleX: true, colorMode: "gradient",
};
const PRESETS = [
  { name: "放射旋轉", opts: { mode: 2, radial: true, spinSpeed: 1.5, barSpace: 0.1, radius: 0.36 } },
  { name: "LED 柱", opts: { mode: 4, ledBars: true, trueLeds: true, barSpace: 0.4, reflexRatio: 0.2, reflexAlpha: 0.2 } },
  { name: "鏡像倒影", opts: { mode: 3, roundBars: true, alphaBars: true, reflexRatio: 0.45, reflexAlpha: 0.35, mirror: 0, barSpace: 0.3 } },
  { name: "曲線面積", opts: { mode: 10, fillAlpha: 0.35, lineWidth: 2, reflexRatio: 0.3, reflexAlpha: 0.25, showPeaks: false } },
  { name: "音名刻度", opts: { mode: 1, noteLabels: true, colorMode: "bar-level", barSpace: 0.15, ansiBands: false } },
];
const GRADS = [
  ["atlas", "linear-gradient(135deg,#f72585,#4cc9f0,#f7df1e)"],
  ["prism", "linear-gradient(135deg,#a35cff,#2bd4ff,#ffd84d)"],
  ["sunset", "linear-gradient(135deg,#f7df1e,#ff8c42,#f72585)"],
  ["steelblue", "linear-gradient(135deg,#2c4e7a,#7fb1e3)"],
];

const modes = document.getElementById("modes");
const modeBtns = PRESETS.map((p, i) => {
  const b = document.createElement("button");
  b.className = "btn";
  b.textContent = p.name;
  b.addEventListener("click", () => applyPreset(i));
  modes.append(b);
  return b;
});
function applyPreset(i) {
  am.setOptions({ ...BASE, ...PRESETS[i].opts });
  modeBtns.forEach((b, k) => b.setAttribute("aria-pressed", k === i));
}

const colors = document.getElementById("colors");
const swBtns = GRADS.map(([name, css]) => {
  const b = document.createElement("button");
  b.className = "sw";
  b.style.background = css;
  b.title = name;
  b.addEventListener("click", () => setGrad(name));
  colors.append(b);
  return b;
});
function setGrad(name) {
  am.gradient = name;
  swBtns.forEach((b, k) => b.setAttribute("aria-pressed", GRADS[k][0] === name));
}

applyPreset(0);
setGrad("atlas");

// Playback (browsers require a user gesture before audio can start)
const center = document.getElementById("center");
const pauseBtn = document.getElementById("pause");
document.getElementById("play").addEventListener("click", async () => {
  await am.audioCtx.resume();
  await audio.play();
});
pauseBtn.addEventListener("click", () => audio.pause());
audio.addEventListener("play", () => { center.classList.add("hide"); pauseBtn.hidden = false; });
audio.addEventListener("pause", () => { center.classList.remove("hide"); pauseBtn.hidden = true; });
</script>
</body>
</html>
