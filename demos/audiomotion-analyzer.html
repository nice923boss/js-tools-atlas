<script type="module">
// audioMotion-analyzer showcase: eight scenes from the original preset demo to an instance-count stress ramp.
import AudioMotionAnalyzer from "https://cdn.jsdelivr.net/npm/audiomotion-analyzer@4.5.4/src/audioMotion-analyzer.js";

const { fmtCompact } = Showcase;
const ROOT = getComputedStyle(document.documentElement);
const FONT = ROOT.getPropertyValue("--font").trim() || "sans-serif";
const MONO = ROOT.getPropertyValue("--mono").trim() || "monospace";
// audioMotion sizes its canvas with the full devicePixelRatio; loRes halves it on DPR 3 phones.
const LORES = (window.devicePixelRatio || 1) > 2;
const fmtHz = (f) => (f >= 1000 ? `${(f / 1000).toFixed(f >= 10000 ? 1 : 2)} kHz` : `${Math.round(f)} Hz`);
const pct = (v) => `${Math.round((v || 0) * 100)}%`;

// ---------- gradients (registered on every instance; names are case sensitive) ----------
const GRADIENTS = {
  atlas: { label: "霓虹（自訂）", bgColor: "#0e1013", colorStops: ["#f72585", "#9d8cff", "#4cc9f0", "#7bd389", "#f7df1e"] },
  sunset: { label: "夕陽（自訂 pos）", bgColor: "#0e1013", colorStops: [{ color: "#f7df1e", pos: 0 }, { color: "#ff8c42", pos: 0.45 }, { color: "#f72585", pos: 1 }] },
  meter: { label: "音量表（自訂 level）", bgColor: "#0e1013", colorStops: [{ color: "#ff4d4d", level: 1 }, { color: "#f7df1e", level: 0.85 }, { color: "#7bd389", level: 0.6 }] },
  jade: { label: "玉石（自訂）", bgColor: "#0e1013", colorStops: ["#e8f5c8", "#7bd389", "#1f9e74", "#0b4f3c"] },
  harbor: { label: "港灣橫向（自訂 dir:h）", bgColor: "#0e1013", dir: "h", colorStops: ["#4cc9f0", "#9d8cff", "#f72585", "#ff8c42", "#f7df1e"] },
  left: { label: "左聲道青", bgColor: "#0e1013", colorStops: ["#d6f6ff", "#4cc9f0", "#1d6fa3"] },
  right: { label: "右聲道粉", bgColor: "#0e1013", colorStops: ["#ffd6ea", "#f72585", "#8a1550"] },
};
const BUILTIN = [["classic", "classic（內建）"], ["prism", "prism（內建）"], ["rainbow", "rainbow（內建）"], ["orangered", "orangered（內建）"], ["steelblue", "steelblue（內建）"]];
function addGradients(am) {
  for (const [name, { label, ...opt }] of Object.entries(GRADIENTS)) am.registerGradient(name, opt);
}

// ---------- shared audio: one AudioContext, sources rendered once into AudioBuffers ----------
let AC = null;
const audioCtx = () => AC || (AC = new AudioContext());
const SWEEP = { f0: 30, f1: 16000, T: 6 };
const sweepFreq = (t) => SWEEP.f0 * (SWEEP.f1 / SWEEP.f0) ** ((((t % SWEEP.T) + SWEEP.T) % SWEEP.T) / SWEEP.T);
function makeBuffer(sec, chans, fill) {
  const ac = audioCtx(), sr = ac.sampleRate, buf = ac.createBuffer(chans, Math.round(sec * sr), sr);
  for (let c = 0; c < chans; c++) fill(buf.getChannelData(c), sr, c);
  return buf;
}
// Adds fn(t) into d starting at `at` seconds for `len` seconds.
function hit(d, sr, at, len, fn) {
  const s0 = Math.round(at * sr), n = Math.min(Math.round(len * sr), d.length - s0);
  for (let i = 0; i < n; i++) d[s0 + i] += fn(i / sr);
}
const BUFFERS = {
  loop: async () => audioCtx().decodeAudioData(await (await fetch("_shared/audio/loop.mp3")).arrayBuffer()),
  // Logarithmic chirp, so it spends equal time in every octave.
  sweep: () => makeBuffer(SWEEP.T, 1, (d, sr) => {
    const { f0, f1, T } = SWEEP, L = Math.log(f1 / f0), fade = 0.01 * sr;
    for (let i = 0; i < d.length; i++) {
      const t = i / sr, env = Math.min(1, i / fade, (d.length - i) / fade);
      d[i] = 0.5 * env * Math.sin(((2 * Math.PI * f0 * T) / L) * (Math.exp((t / T) * L) - 1));
    }
  }),
  white: () => makeBuffer(4, 1, (d) => { for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.35; }),
  // Paul Kellet's pink-noise filter: equal energy per octave.
  pink: () => makeBuffer(4, 1, (d) => {
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < d.length; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
      b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.09;
      b6 = w * 0.115926;
    }
  }),
  // Two bars of a 120 BPM beat: kick, snare, closed and open hi-hats.
  drums: () => makeBuffer(4, 1, (d, sr) => {
    const S = 0.125, KICK = [0, 6, 8, 11, 16, 22, 24, 27, 30], SNARE = [4, 12, 20, 28, 31];
    const kick = (t) => 0.85 * Math.exp(-t * 7) * Math.sin(2 * Math.PI * (45 * t + (110 / 18) * (1 - Math.exp(-t * 18))));
    const snare = (t) => (Math.random() * 2 - 1) * 0.42 * Math.exp(-t * 16) + 0.3 * Math.sin(2 * Math.PI * 185 * t) * Math.exp(-t * 14);
    const hat = (decay, amp) => { let prev = 0; return (t) => { const r = Math.random() * 2 - 1, v = r - prev; prev = r; return amp * v * Math.exp(-t * decay); }; };
    KICK.forEach((s) => hit(d, sr, s * S, 0.5, kick));
    SNARE.forEach((s) => hit(d, sr, s * S, 0.3, snare));
    for (let s = 0; s < 32; s += 2) hit(d, sr, s * S, 0.3, s % 16 === 14 ? hat(9, 0.16) : hat(55, 0.2));
    for (let i = 0; i < d.length; i++) d[i] *= 0.8;
  }),
  // Stereo test: bass line only on the left, bell arpeggio only on the right.
  split: () => makeBuffer(4, 2, (d, sr, ch) => {
    if (ch === 0) [55, 65.41, 73.42, 82.41].forEach((f, k) => hit(d, sr, k, 1, (t) => {
      let v = 0;
      for (let h = 1; h <= 8; h++) v += Math.sin(2 * Math.PI * f * h * t) / h;
      return 0.3 * v * Math.min(1, t / 0.01) * Math.exp(-t * 1.5);
    }));
    else [1318.5, 1568, 1760, 2093, 2637, 2093, 1760, 1568].forEach((f, k) => {
      for (let rep = 0; rep < 2; rep++) hit(d, sr, (rep * 8 + k) * 0.25, 0.25, (t) => (Math.sin(2 * Math.PI * f * t) + 0.4 * Math.sin(2 * Math.PI * 2.76 * f * t)) * 0.3 * Math.exp(-t * 9));
    });
  }),
};
const bufJobs = {};
const getBuffer = (k) => bufJobs[k] || (bufJobs[k] = Promise.resolve().then(BUFFERS[k]).catch((e) => { delete bufJobs[k]; throw e; }));
// `level` is the speaker gain once sound is switched on (noise is kept quiet).
const SOURCES = {
  loop: { label: "音樂", level: 0.8 },
  sweep: { label: "掃頻", level: 0.2 },
  white: { label: "白噪音", level: 0.15 },
  pink: { label: "粉紅噪音", level: 0.25 },
  drums: { label: "鼓組", level: 0.7 },
  split: { label: "左右分頻", level: 0.6 },
  pan: { label: "音樂左右平移", level: 0.8 },
};
async function startSource(key, ac, bus) {
  const buf = await getBuffer(key === "pan" ? "loop" : key);
  const src = ac.createBufferSource();
  src.buffer = buf; src.loop = true;
  const nodes = [src];
  if (key === "pan") {
    const pan = ac.createStereoPanner(), lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 0.15; depth.gain.value = 0.95;
    lfo.connect(depth).connect(pan.pan);
    src.connect(pan).connect(bus);
    lfo.start();
    nodes.push(pan, lfo, depth);
  } else src.connect(bus);
  src.start();
  return { t0: ac.currentTime, stop() { for (const n of nodes) { if (n.stop) try { n.stop(); } catch (e) { /* already stopped */ } n.disconnect(); } } };
}

// Per-scene audio rig: source -> bus (analysers listen here) -> monitor gain (0 until the user asks) -> speakers.
function rig(ctx, initial) {
  const ac = audioCtx();
  const bus = ac.createGain(), out = ac.createGain();
  out.gain.value = 0;
  bus.connect(out);
  out.connect(ac.destination);
  let cur = null, key = initial, heard = false, token = 0;
  const fade = () => out.gain.setTargetAtTime(heard ? SOURCES[key].level : 0, ac.currentTime, 0.04);
  async function use(k) {
    const my = ++token;
    key = k;
    const next = await startSource(k, ac, bus);
    if (my !== token || !ctx.active) return next.stop();
    if (cur) cur.stop();
    cur = next;
    fade();
  }
  const btn = ctx.button("🔊 播放聲音", async () => {
    heard = !heard;
    btn.textContent = heard ? "🔇 靜音" : "🔊 播放聲音";
    if (heard && ac.state !== "running") await ac.resume();
    fade();
  }, { primary: true });
  // Only succeeds once the page has had a user gesture; until then the analysers show the idle screen.
  if (ac.state !== "running") ac.resume().catch(() => {});
  ctx.onCleanup(() => { token++; if (cur) cur.stop(); cur = null; out.gain.value = 0; bus.disconnect(); out.disconnect(); });
  use(initial).catch((e) => { if (ctx.active) { console.error(e); ctx.hint(`音源載入失敗：${e.message}`); } });
  return {
    ac, bus, use,
    get key() { return key; },
    get t0() { return cur ? cur.t0 : 0; },
    sources(keys) { return ctx.group(keys.map((k) => SOURCES[k].label), keys.indexOf(initial), (i) => use(keys[i]).catch((e) => console.error(e))); },
  };
}

// Placeholder drawn on the analyser canvas while the AudioContext is still suspended.
function idle(inst) {
  const g = inst.canvasCtx, W = inst.canvas.width, H = inst.canvas.height, pr = inst.pixelRatio, t = performance.now() / 1000, N = 60;
  g.save();
  if (inst.radial) {
    const cx = W / 2, cy = H / 2, r0 = Math.min(W, H) * 0.2, span = Math.min(W, H) * 0.22;
    g.lineCap = "round";
    g.lineWidth = Math.max(2, Math.min(W, H) / 140);
    for (let i = 0; i < N; i++) {
      const a = (i / N) * Math.PI * 2 + t * 0.15, v = 0.25 + 0.2 * Math.sin(i * 0.5 + t * 1.6) + 0.15 * Math.sin(i * 1.3 - t);
      g.strokeStyle = `hsla(${(i / N) * 300 + 300}, 85%, 62%, 0.4)`;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      g.lineTo(cx + Math.cos(a) * (r0 + v * span), cy + Math.sin(a) * (r0 + v * span));
      g.stroke();
    }
  } else {
    const bw = W / N;
    for (let i = 0; i < N; i++) {
      const v = 0.18 + 0.12 * Math.sin(i * 0.35 + t * 1.4) + 0.1 * Math.sin(i * 0.9 - t * 0.8);
      g.fillStyle = `hsla(${(i / N) * 200 + 320}, 85%, 60%, 0.3)`;
      g.fillRect(i * bw + bw * 0.15, H * 0.85 - v * H, bw * 0.7, v * H);
    }
  }
  const size = Math.max(11, Math.min(15, W / pr / 26)) * pr;
  g.font = `600 ${size}px ${FONT}`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillStyle = "rgba(15,17,21,0.7)";
  const msg = "待機畫面：點一下頁面即開始分析（不出聲）";
  const w = g.measureText(msg).width + size * 1.4;
  g.fillRect(W / 2 - w / 2, H / 2 - size, w, size * 2);
  g.fillStyle = "#ecebe6";
  g.fillText(msg, W / 2, H / 2);
  g.restore();
}

// Creates an analyser fed by `bus` and never connected to the speakers.
function analyzer(ctx, host, bus, opts = {}, { cleanup = true, showIdle = true } = {}) {
  const { onCanvasDraw: draw, gradient, gradientLeft, gradientRight, ...rest } = opts;
  const am = new AudioMotionAnalyzer(host, {
    audioCtx: AC, connectSpeakers: false, overlay: true, showBgColor: false, bgAlpha: 0, loRes: LORES,
    smoothing: 0.7, minFreq: 20, maxFreq: 16000, ...rest,
    onCanvasDraw: (inst, info) => {
      if (showIdle && AC.state !== "running") idle(inst);
      if (draw) draw(inst, info);
    },
  });
  addGradients(am);
  // Custom gradient names only exist after registerGradient(), so they are applied last.
  const g = {};
  if (gradient) g.gradient = gradient;
  if (gradientLeft) g.gradientLeft = gradientLeft;
  if (gradientRight) g.gradientRight = gradientRight;
  am.setOptions(g);
  am.connectInput(bus);
  if (cleanup) ctx.onCleanup(() => am.destroy());
  return am;
}

// Canvas text helper in analyser pixel units.
function label(inst, text, x, y, { color = "#ecebe6", align = "left", size = 12 } = {}) {
  const g = inst.canvasCtx, pr = inst.pixelRatio, s = size * pr;
  g.save();
  g.font = `600 ${s}px ${FONT}`;
  g.textAlign = align;
  g.textBaseline = "top";
  const w = g.measureText(text).width, x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  g.fillStyle = "rgba(15,17,21,0.7)";
  g.fillRect(x0 - 4 * pr, y - 2 * pr, w + 8 * pr, s + 5 * pr);
  g.fillStyle = color;
  g.fillText(text, x, y);
  g.restore();
}

// x position (canvas px) of a frequency, interpolated between bar centres on a log axis.
function freqToX(inst, f) {
  const bars = inst.getBars();
  if (bars.length < 2) return null;
  const centre = (i) => bars[i].posX + (bars[Math.min(i + 1, bars.length - 1)].posX - bars[Math.max(i - 1, 0)].posX) / 4;
  if (f <= bars[0].freq || f >= bars[bars.length - 1].freq) return null;
  let i = 0;
  while (i < bars.length - 2 && bars[i + 1].freq < f) i++;
  const a = Math.log(bars[i].freq), b = Math.log(bars[i + 1].freq), k = (Math.log(f) - a) / (b - a || 1);
  return centre(i) + (centre(i + 1) - centre(i)) * k;
}

const VIEW = `<div class="am-board"><div class="am-view"><div class="am-host"></div><div class="am-chip"></div></div></div>`;

// ---------- scene 1: the original preset demo ----------
const BASE = {
  mode: 3, radial: false, ledBars: false, trueLeds: false, reflexRatio: 0, mirror: 0, roundBars: false,
  lumiBars: false, alphaBars: false, outlineBars: false, fillAlpha: 1, lineWidth: 0, noteLabels: false,
  showPeaks: true, spinSpeed: 0, channelLayout: "single", frequencyScale: "log", barSpace: 0.25, radius: 0.32,
  showScaleX: true, colorMode: "gradient",
};
const PRESETS = [
  { name: "放射", full: "放射旋轉", opts: { mode: 2, radial: true, spinSpeed: 1.5, barSpace: 0.1, radius: 0.36 } },
  { name: "LED", full: "LED 柱", opts: { mode: 4, ledBars: true, trueLeds: true, barSpace: 0.4, reflexRatio: 0.2, reflexAlpha: 0.2 } },
  { name: "倒影", full: "鏡像倒影", opts: { mode: 3, roundBars: true, alphaBars: true, reflexRatio: 0.45, reflexAlpha: 0.35, barSpace: 0.3 } },
  { name: "曲線", full: "曲線面積", opts: { mode: 10, fillAlpha: 0.35, lineWidth: 2, reflexRatio: 0.3, reflexAlpha: 0.25, showPeaks: false } },
  { name: "音名", full: "音名刻度", opts: { mode: 1, noteLabels: true, colorMode: "bar-level", barSpace: 0.15, ansiBands: false } },
];

const MODES = [[0, "FFT 離散頻率"], [1, "1/24 八度"], [2, "1/12 八度"], [3, "1/8 八度"], [4, "1/6 八度"], [5, "1/4 八度"], [6, "1/3 八度"], [7, "1/2 八度"], [8, "全八度"], [10, "曲線 Graph"]];

const LAYOUTS = [["single", "單聲道合併"], ["dual-combined", "雙聲道疊合"], ["dual-horizontal", "左右並排"], ["dual-vertical", "上下分割"]];

    }

        },
      }, { showIdle: false });
      ctx.hint(`4 個分析器・1 個 AudioContext・同一個輸入節點，${dots.getBars().length} 條 1/3 八度頻帶`);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N 個 AudioMotionAnalyzer 同時繪圖",
    desc: "一次放 1 到 64 個分析器，每個都有自己的 AnalyserNode 與 requestAnimationFrame 迴圈，全部接在同一個音源上。逐步加量，量到畫面掉到 30 FPS 以下為止；fftSize 與繪圖樣式可以切換，看哪一項比較吃效能。",
    hint: "按「自動加壓」逐步增加分析器數量",
    mount(ctx) {
      ctx.html(`<div class="am-stress"><div class="am-grid"></div></div>`);
      ctx.controls.classList.add("bottom");
      const r = rig(ctx, "loop");
      const grid = ctx.$(".am-grid"), list = [];
      const STYLES = [
        { mode: 3, ledBars: false, radial: false, fillAlpha: 1, lineWidth: 0, reflexRatio: 0 },
        { mode: 4, ledBars: true, radial: false, fillAlpha: 1, lineWidth: 0, reflexRatio: 0.25, reflexAlpha: 0.2 },
        { mode: 6, ledBars: false, radial: true, fillAlpha: 1, lineWidth: 0, reflexRatio: 0, spinSpeed: 1 },
        { mode: 10, ledBars: false, radial: false, fillAlpha: 0.3, lineWidth: 1.5, reflexRatio: 0 },
      ];
      let fft = 8192, style = 0;
      ctx.select("fftSize", [1024, 8192, 32768].map((v) => ({ value: v, label: String(v) })), "8192", (v) => { fft = +v; list.forEach((a) => { a.am.fftSize = fft; }); });
      ctx.group(["柱狀", "LED", "放射", "曲線"], 0, (i) => { style = i; list.forEach((a) => a.am.setOptions(STYLES[i])); });
      const layout = () => {
        const W = grid.clientWidth || 1, H = grid.clientHeight || 1, n = Math.max(1, list.length);
        const cols = Math.max(1, Math.min(n, Math.round(Math.sqrt((n * W) / H)))), rows = Math.ceil(n / cols);
        grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
      };
      ctx.onResize(layout);
      ctx.onCleanup(() => { while (list.length) list.pop().am.destroy(); });
      ctx.ramp({
        label: "分析器", unit: "個", steps: [1, 2, 4, 8, 16, 32, 64],
        apply(n) {
          while (list.length > n) { const a = list.pop(); a.am.destroy(); a.cell.remove(); }
          while (list.length < n) {
            const cell = document.createElement("div"), host = document.createElement("div");
            cell.className = "am-cell"; host.className = "am-host";
            cell.append(host); grid.append(cell);
            const am = analyzer(ctx, host, r.bus, { ...STYLES[style], fftSize: fft, gradient: ["prism", "atlas", "sunset", "jade"][list.length % 4], barSpace: 0.2, showScaleX: false, showPeaks: true, smoothing: 0.6 }, { cleanup: false, showIdle: false });
            list.push({ am, cell });
          }
          layout();
        },
        metrics: () => {
          let px = 0;
          for (const a of list) px += a.am.canvas.width * a.am.canvas.height;
          return { fftSize: String(fft), "畫布總像素": fmtCompact(px), 音訊: AC.state === "running" ? "分析中" : "待機（未點擊）" };
        },
        note: "每個實例每格都要讀一次 FFT、計算頻帶並重畫整張畫布，所以成本隨數量線性增加；放射與 LED 的繪圖步驟較多。音訊還沒啟動時分析器照樣繪圖，但頻譜是空的，數字會偏樂觀。無頭或軟體繪圖環境的數字會明顯偏低。",
      });
    },
  },
] });
</script>
</body>
</html>
