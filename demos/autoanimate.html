<script src="_shared/showcase.js"></script>
<script type="module">
import autoAnimate, { getTransitionSizes } from "https://cdn.jsdelivr.net/npm/@formkit/auto-animate@0.10.0/index.mjs";

const { h } = Showcase;
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const randInt = (n) => (Math.random() * n) | 0;
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) { const j = randInt(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
// Shuffle a copy until the order actually changes.
function reshuffle(arr) {
  const out = arr.slice();
  if (out.length < 2) return out;
  do shuffle(out); while (out.every((x, i) => x === arr[i]));
  return out;
}
const insertAt = (arr, at, v) => [...arr.slice(0, at), v, ...arr.slice(at)];

// Attach AutoAnimate and tear it down with the scene.
function animated(ctx, el, config) {
  const ctl = autoAnimate(el, config);
  ctx.onCleanup(() => ctl.destroy());
  return ctl;
}

// Keyed reconcile. Tracks its own node list because AutoAnimate parks removal ghosts in
// parent.children, and only removes nodes still owned by this parent (a node may have moved).
function sync(parent, prev, next) {
  for (const el of prev) if (!next.includes(el) && el.parentNode === parent) el.remove();
  const kept = prev.filter((el) => next.includes(el));
  if (kept.length !== next.length || kept.some((el, i) => el !== next[i])) parent.append(...next);
  return next;
}
// One DOM node per id, reconciled with sync().
function keyed(parent, make) {
  const nodes = new Map();
  let shown = [];
  return {
    nodes,
    render(ids) {
      for (const id of [...nodes.keys()]) if (!ids.includes(id)) nodes.delete(id);
      const next = ids.map((id) => nodes.get(id) || nodes.set(id, make(id)).get(id));
      shown = sync(parent, shown, next);
    },
    // disable() and destroy() cancel a running removal animation, so AutoAnimate never gets its
    // "finish" event and leaves the ghost in place. Drop any child we did not render.
    purge() { for (const el of [...parent.children]) if (!shown.includes(el)) el.remove(); },
  };
}

// Auto-play: runs step() every gap ms while the toggle is pressed. bump() postpones the next step.
function autoLoop(ctx, gap, step, first = 900) {
  const wait = () => (typeof gap === "function" ? gap() : gap);
  let on = true, nextAt = performance.now() + first;
  const btn = ctx.toggle("自動", true, (v) => { on = v; nextAt = performance.now() + first; });
  ctx.interval(() => {
    if (!on || performance.now() < nextAt) return;
    step();
    nextAt = performance.now() + wait();
  }, 100);
  return {
    stop() { on = false; btn.setAttribute("aria-pressed", "false"); },
    bump() { nextAt = performance.now() + wait(); },
  };
}

const LIBS = [["GSAP", "動畫", "--c1"], ["Anime.js", "動畫", "--c1"], ["Three.js", "3D", "--c2"], ["Babylon.js", "3D", "--c2"], ["D3.js", "圖表", "--c3"], ["Chart.js", "圖表", "--c3"], ["p5.js", "創意", "--c4"], ["PixiJS", "創意", "--c4"], ["Tone.js", "音訊", "--c5"], ["Howler.js", "音訊", "--c5"], ["Leaflet", "地圖", "--c6"], ["Matter.js", "物理", "--c6"]];

const CITIES = [["台北", "北部"], ["新北", "北部"], ["基隆", "北部"], ["桃園", "北部"], ["新竹", "北部"], ["台中", "中部"], ["彰化", "中部"], ["嘉義", "南部"], ["台南", "南部"], ["高雄", "南部"], ["花蓮", "東部"], ["台東", "東部"]];
const REGION_C = { 北部: "--c2", 中部: "--c4", 南部: "--c5", 東部: "--c6" };

const FAQ = [
  ["AutoAnimate 一定要搭配框架嗎？", "不用。核心是零相依的原生函式 <code>autoAnimate(el)</code>；React、Vue、Svelte、Angular、Solid 等框架另有對應的 hook、指令或 action 寫法。"],
  ["為什麼只改 class 沒有動畫？", "它用 MutationObserver 監看 <code>childList</code>，也就是子節點的新增、刪除與移動。單純改樣式不會觸發，要搭配一次 append 或其他子節點變動。"],
  ["動畫是怎麼算出來的？", "變動前記下每個子元素的位置與大小，變動後量新位置，再用 Web Animations API 從舊位置補間到新位置，也就是 FLIP 手法。"],
  ["父元素的高度也會動嗎？", "會。父元素本身也被量測，寬高改變時一起補間；這個問答展開時，下方項目就是這樣被平順推開。"],
  ["使用者開啟「減少動態效果」時呢？", "預設尊重 <code>prefers-reduced-motion: reduce</code>，不啟動動畫；傳入 <code>disrespectUserMotionPreference: true</code> 可覆寫，外掛函式則不受此限。"],
  ["畫面外的元素也會跑動畫嗎？", "不會。目前位置在視窗外的元素直接跳到定位，不建立動畫，省下不必要的成本。"],
];

const SNACKS = ["珍奶", "雞排", "蚵仔煎", "臭豆腐", "刈包", "地瓜球", "肉圓", "蔥油餅", "胡椒餅", "豆花", "鹽酥雞", "甜不辣", "車輪餅", "大腸麵線"];

const TASKS = ["擬定課綱", "錄製第 1 章", "剪輯片頭", "設計講義", "準備測驗題", "上架課程頁", "回覆學員提問", "更新範例程式", "製作宣傳圖"];
const LANES = [["待辦", "--c2"], ["進行中", "--c1"], ["完成", "--c4"]];

Showcase.run({ scenes: [
  {
    id: "list", title: "清單增刪排序",
    api: "autoAnimate(ul)",
    desc: "左欄只多呼叫一次 autoAnimate(ul)：子元素新增、刪除、換位都自動補上動畫；右欄是同一份資料的一般 DOM，變動瞬間跳到位。",
    hint: "按新增、刪除、洗牌、排序，或點項目右側 × 刪除",
    mount(ctx) {
      ctx.html(`<div class="pad s1">
        <div class="two">
          <section class="panel box"><header class="head"><b>有 AutoAnimate</b><code>autoAnimate(ul)</code></header><ul></ul></section>
          <section class="panel box"><header class="head"><b>一般 DOM</b><code>沒有動畫</code></header><ul></ul></section>
        </div>
        <div class="note">上一步：<b class="last">等待第一個動作</b></div>
      </div>`);
      const make = (id) => {
        const [name, cat, c] = LIBS[id];
        return h("li", { style: `--c: var(${c})` },
          h("span", { class: "name", text: name }), h("span", { class: "tag", text: cat }),
          h("button", { class: "x", type: "button", "data-id": id, title: `刪除 ${name}`, "aria-label": `刪除 ${name}` }, "×"));
      };
      const sides = ctx.$$(".s1 ul").map((ul) => keyed(ul, make));
      const last = ctx.$(".last");
      const MIN = 3, MAX = 8;
      let items = [0, 2, 4, 6, 8, 10];
      const render = () => sides.forEach((s) => s.render(items));
      render();
      animated(ctx, ctx.$(".s1 ul"));

      const OPS = {
        add() {
          const free = LIBS.map((_, i) => i).filter((i) => !items.includes(i));
          if (items.length >= MAX || !free.length) return `已達 ${MAX} 項上限`;
          const id = pick(free), at = randInt(items.length + 1);
          items = insertAt(items, at, id);
          return `新增 ${LIBS[id][0]}（第 ${at + 1} 項）`;
        },
        remove(id = pick(items)) {
          if (items.length <= MIN) return `至少保留 ${MIN} 項`;
          items = items.filter((x) => x !== id);
          return `刪除 ${LIBS[id][0]}`;
        },
        shuffle() { items = reshuffle(items); return "洗牌"; },
        sort() {
          const next = items.slice().sort((a, b) => LIBS[a][0].localeCompare(LIBS[b][0], "en", { sensitivity: "base" }));
          const same = next.every((x, i) => x === items[i]);
          items = next;
          return same ? "排序（已經是 A 到 Z）" : "依名稱 A 到 Z 排序";
        },
      };
      const run = (op, arg) => { last.textContent = OPS[op](arg); render(); };
      const CYCLE = ["add", "shuffle", "remove", "sort", "add", "add", "shuffle", "remove", "sort", "remove"];
      let k = 0;
      const manual = (op) => () => { auto.stop(); run(op); };
      ctx.button("新增", manual("add"));
      ctx.button("刪除", manual("remove"));
      ctx.button("洗牌", manual("shuffle"));
      ctx.button("排序", manual("sort"));
      const auto = autoLoop(ctx, 1300, () => {
        let op = CYCLE[k++ % CYCLE.length];

          "模式": MODES[mode],
        }),
        note: "「洗牌＋回呼」量 grid.append() 到 MutationObserver 回呼結束：逐一 getBoundingClientRect、建立 N 個 Web Animation，彙整變動紀錄時的陣列展開隨 N 平方成長。動畫結束後每個元素還會重建一個 IntersectionObserver，並各有一個約 2 秒的位置輪詢。disable() 仍會量測位置但不建動畫；「不掛 autoAnimate」是純 DOM 搬移的對照，版面計算延到下一格。",
      });
    },
  },
] });
</script>
