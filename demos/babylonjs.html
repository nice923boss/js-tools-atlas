<body>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.29.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-gui@9.29.0/babylon.gui.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.29.0/babylon.glTF2FileLoader.min.js"></script>
<script src="_shared/showcase.js"></script>
<script type="module">
// Babylon.js showcase: eight scenes from the original Havok tower to a thin-instance physics stress ramp.
// Every scene owns its Engine; unmount calls engine.dispose() and releases the WebGL context.
const B = BABYLON, GUI = BABYLON.GUI;
const { h, fmt } = Showcase;
const HAVOK = "https://cdn.jsdelivr.net/npm/@babylonjs/havok@1.3.14/lib/umd/";
const ENV = "https://assets.babylonjs.com/core/environments/environmentSpecular.env";
const ROBOT = "_shared/models/robot.glb";
const PALETTE = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const ACCENT = "#f7df1e", FG = "#ecebe6", MUTED = "#9b998f", PANEL = "rgba(18,20,24,0.86)", LINE = "rgba(255,255,255,0.16)";
const FONT = getComputedStyle(document.body).fontFamily;
const LEFT = GUI.Control.HORIZONTAL_ALIGNMENT_LEFT, TOP = GUI.Control.VERTICAL_ALIGNMENT_TOP, BOTTOM = GUI.Control.VERTICAL_ALIGNMENT_BOTTOM;
const hex = (s) => B.Color3.FromHexString(s);
const lin = (s) => B.Color3.FromHexString(s).toLinearSpace();

// Havok wasm is shared by scene 1 and the stress scene; a failed load clears the cache so a retry works.
let havokPromise = null;
function getHavok() {
  if (!havokPromise) {
    havokPromise = Showcase.load(HAVOK + "HavokPhysics_umd.js").then(() => HavokPhysics({ locateFile: () => HAVOK + "HavokPhysics.wasm" }));
    havokPromise.catch(() => { havokPromise = null; });
  }
  return havokPromise;
}

function loadEnv(scene) {
  return new Promise((ok, fail) => {
    let tex = null, ready = false;
    tex = new B.CubeTexture(ENV, scene, null, false, null, () => { ready = true; if (tex) ok(tex); },
      (msg) => fail(new Error(msg || "環境貼圖載入失敗")), undefined, true);
    if (ready) ok(tex);
  });
}

// One Engine + Scene + ArcRotateCamera per showcase scene. The projection is shifted vertically
// (matrix element 9) so the subject stays centred in the area not covered by the control cluster;
// picking and GUI use the same matrix, so they stay consistent.
function stage(ctx, o = {}) {
  const host = o.host || ctx.el;
  const canvas = h("canvas", { class: "bjs" });
  host.append(canvas);
  const engine = new B.Engine(canvas, true, { stencil: true, powerPreference: "high-performance" }, false);
  engine.setHardwareScalingLevel(1 / Math.min(devicePixelRatio || 1, 2));
  const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
  const scene = new B.Scene(engine);
  scene.clearColor = B.Color4.FromHexString(o.bg || "#0e1013ff");
  const fov = o.fov ?? 0.8;
  const cam = new B.ArcRotateCamera("cam", o.alpha ?? -Math.PI / 2, o.beta ?? 1.25, o.radius ?? 10, new B.Vector3(...(o.target || [0, 0, 0])), scene);
  Object.assign(cam, { fov, minZ: 0.1, maxZ: o.far ?? 1000, wheelDeltaPercentage: 0.01, pinchDeltaPercentage: 0.004, panningSensibility: 0,
    lowerBetaLimit: 0.15, upperBetaLimit: o.maxBeta ?? 1.5 });
  cam.attachControl();
  let shift = 0, shiftX = 0, lastKey = "";
  cam.onProjectionMatrixChangedObservable.add(() => {
    const pm = cam.getProjectionMatrix();
    if (shift) pm.addAtIndex(9, shift);
    if (shiftX) pm.addAtIndex(8, shiftX);
  });
  const sizeFns = [];
  const S = {
    engine, scene, cam, canvas, width: 1, height: 1, avail: 1, availW: 1, padBottom: 0, padLeft: 0, ctlTop: 0,
    onSize(fn) { sizeFns.push(fn); fn(S.width, S.height); },
    onFrame(fn) { scene.onBeforeRenderObservable.add(() => fn(Math.min(engine.getDeltaTime() / 1000 || 1 / 60, 0.1))); },
    refit() { lastKey = ""; },
  };
  const fit = () => {
    const w = Math.max(1, canvas.clientWidth), hh = Math.max(1, canvas.clientHeight);
    let top = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-h")) || 0;
    S.ctlTop = top;
    // A chip that spans most of the width (narrow screens) also covers the top of the view.
    const chipEl = host === ctx.el ? ctx.el.querySelector(":scope > .chip") : null;
    if (chipEl && chipEl.offsetWidth > w * 0.55) top += chipEl.offsetHeight + 10;
    const bot = (parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-b")) || 0) + S.padBottom;
    const key = `${w}x${hh}:${top}:${bot}:${S.padLeft}`;
    if (key === lastKey) return;
    lastKey = key;
    const d = Math.max(-hh * 0.4, Math.min(hh * 0.4, top - bot));
    S.width = w; S.height = hh; S.avail = hh - Math.abs(d); S.availW = w - S.padLeft;
    engine.resize();
    cam.fov = o.pfov && w < hh ? o.pfov : fov;
    shift = -d / hh;
    shiftX = S.padLeft / w;
    cam.getProjectionMatrix(true);
    for (const fn of sizeFns) fn(w, hh);
  };
  fit();
  ctx.raf(() => { fit(); engine.beginFrame(); scene.render(); engine.endFrame(); });
  ctx.onCleanup(() => {
    engine.dispose();
    const lose = gl && gl.getExtension("WEBGL_lose_context");
    if (lose) lose.loseContext();
    canvas.remove();
  });
  return S;
}

// Camera distance that fits a halfW x halfH box into the uncovered part of the view.
function fitRadius(S, halfW, halfH, margin = 1.1) {
  const t = Math.tan(S.cam.fov / 2);
  return Math.max((halfH * S.height) / (S.avail * t), (halfW * S.height) / (S.availW * t)) * margin;
}
function makeUI(S) {
  const ui = GUI.AdvancedDynamicTexture.CreateFullscreenUI("ui", true, S.scene);
  S.onSize((w) => { ui.idealWidth = w; });
  return ui;
}
function guiText(str, o = {}) {
  const t = new GUI.TextBlock();
  Object.assign(t, { text: str, fontFamily: FONT, fontSize: o.size || 13, color: o.color || FG });
  if (o.h) t.height = `${o.h}px`;
  if (o.bold) t.fontWeight = "600";
  if (o.left) t.textHorizontalAlignment = LEFT;
  return t;
}
// Pill-shaped GUI label that follows a mesh or TransformNode in 3D.
function guiTag(ui, node, str, o = {}) {
  const rect = new GUI.Rectangle();
  Object.assign(rect, { adaptWidthToChildren: true, height: "24px", cornerRadius: 12, thickness: o.border === false ? 0 : 1, color: LINE,
    background: o.bg || PANEL, isHitTestVisible: false, linkOffsetY: o.offsetY || 0 });
  const text = guiText(str, { size: 12, color: o.color || FG, h: 24 });
  Object.assign(text, { resizeToFit: true, paddingLeft: "10px", paddingRight: "10px" });
  rect.addControl(text);
  ui.addControl(rect);
  if (node) rect.linkWithMesh(node);
  return { rect, text };
}
function chip(ctx, html) {
  const el = h("div", { class: "chip" });
  el.innerHTML = html;
  ctx.el.append(el);
  let last = html;
  return (next) => { if (next !== last) { last = next; el.innerHTML = next; } };
}
function checkerMat(scene, repeat, a = "#1d2129", b = "#252a34") {
  const tex = new B.DynamicTexture("checker", 512, scene, true);
  const g = tex.getContext();
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) % 2 ? a : b; g.fillRect(x * 64, y * 64, 64, 64); }
  tex.update();
  tex.uScale = tex.vScale = repeat;
  const m = new B.StandardMaterial("ground", scene);
  m.diffuseTexture = tex;
  m.specularColor = new B.Color3(0.08, 0.08, 0.08);
  return m;
}
// URL-backed texture (not DynamicTexture): sub-emitter clones call texture.clone(),
// which for a DynamicTexture yields an empty, never-ready copy.
function dotTexture(scene) {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 64;
  const g = cv.getContext("2d");
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, "rgba(255,255,255,1)");
  grd.addColorStop(0.3, "rgba(255,255,255,0.65)");
  grd.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  const tex = new B.Texture(cv.toDataURL(), scene, true);
  tex.hasAlpha = true;
  return tex;
}
function tone(scene, exposure = 1) {
  const ip = scene.imageProcessingConfiguration;
  ip.toneMappingEnabled = true;
  ip.toneMappingType = B.ImageProcessingConfiguration.TONEMAPPING_ACES;
  ip.exposure = exposure;
}
function pbr(scene, name, albedo, metallic, roughness) {
  const m = new B.PBRMaterial(name, scene);
  m.albedoColor = lin(albedo);
  m.metallic = metallic;
  m.roughness = roughness;
  return m;
}
async function withEnv(ctx, scene) {
  const st = ctx.status("載入環境貼圖（.env 預先濾波立方體貼圖）…");
  try { const env = await loadEnv(scene); st.done(); return env; } catch (e) { st.error("環境貼圖載入失敗，請檢查網路後重試"); throw e; }
}

Showcase.run({ scenes: [
  {
    id: "havok", title: "Havok 積木塔",
    api: "new HavokPlugin(false, havok)・new PhysicsAggregate(mesh, PhysicsShapeType.BOX, { mass })",
    desc: "原版示範強化：Havok（WebAssembly）物理推倒 50 塊積木。陰影、光暈，以及跟著最新一顆球移動的 GUI 標籤（linkWithMesh）都是 Babylon 內建模組。",
    hint: "點畫面朝該處發射・拖曳旋轉・滾輪縮放",
    async mount(ctx) {
      const st = ctx.status("載入 Havok 物理引擎（WebAssembly）…");
      const havok = await getHavok().catch((e) => { st.error("Havok 載入失敗，請檢查網路後重試"); throw e; });
      st.done();
      if (!ctx.active) return;
      const S = stage(ctx, { alpha: -Math.PI / 2 - 0.4, beta: 1.22, target: [0, 3.4, 0], maxBeta: 1.48, pfov: 1.1 });
      const { scene, cam, engine } = S;
      Object.assign(scene, { fogMode: B.Scene.FOGMODE_EXP2, fogDensity: 0.012, fogColor: hex("#0e1013") });
      const hemi = new B.HemisphericLight("hemi", new B.Vector3(0.2, 1, -0.3), scene);
      hemi.intensity = 0.55;
      hemi.groundColor = hex("#1c2030");
      const sun = new B.DirectionalLight("sun", new B.Vector3(-0.6, -1, 0.5), scene);
      sun.position = new B.Vector3(18, 30, -14);
      sun.intensity = 1.6;
      const shadows = new B.ShadowGenerator(1024, sun);
      shadows.usePercentageCloserFiltering = true;
      shadows.bias = 0.002;
      new B.GlowLayer("glow", scene, { mainTextureSamples: 1, blurKernelSize: 32 }).intensity = 0.7;
      const plugin = new B.HavokPlugin(false, havok);
      scene.enablePhysics(new B.Vector3(0, -9.81, 0), plugin);
      let timeScale = 1, speed = 30, fired = 0, blocks = [], balls = [];
      scene.onBeforePhysicsObservable.add(() => plugin.setTimeStep(Math.min(engine.getDeltaTime() / 1000 || 1 / 60, 1 / 30) * timeScale));

      const ground = B.MeshBuilder.CreateBox("ground", { width: 60, height: 1, depth: 60 }, scene);
      ground.position.y = -0.5;
      ground.material = checkerMat(scene, 7);
      ground.receiveShadows = true;
      new B.PhysicsAggregate(ground, B.PhysicsShapeType.BOX, { mass: 0, friction: 0.8 }, scene);
      const mats = PALETTE.map((c, i) => {
        const m = new B.StandardMaterial("p" + i, scene);
        m.diffuseColor = hex(c);
        m.specularColor = new B.Color3(0.25, 0.25, 0.25);
        m.specularPower = 48;
        return m;
      });
      const addBlock = (w, hgt, d, pos, mi, rotY = 0) => {
        const mesh = B.MeshBuilder.CreateBox("blk", { width: w, height: hgt, depth: d }, scene);
        mesh.position.copyFrom(pos);
        mesh.rotation.y = rotY;
        mesh.material = mats[mi % mats.length];
        mesh.receiveShadows = true;
        shadows.addShadowCaster(mesh);
        const agg = new B.PhysicsAggregate(mesh, B.PhysicsShapeType.BOX, { mass: 0.6, friction: 0.7, restitution: 0.05 }, scene);
        blocks.push({ mesh, agg, start: pos.clone() });
      };
      const build = () => {
        for (const b of blocks) { b.agg.dispose(); b.mesh.dispose(); }
        for (const b of balls) { b.agg.dispose(); b.s.dispose(); }
        blocks = []; balls = []; fired = 0;
        tag.rect.isVisible = false;
        for (let layer = 0; layer < 14; layer++) {
          const y = 0.3 + layer * 0.6, along = layer % 2 === 0;
          for (let i = -1; i <= 1; i++) addBlock(3, 0.6, 1, along ? new B.Vector3(0, y, i * 1.02) : new B.Vector3(i * 1.02, y, 0), layer, along ? 0 : Math.PI / 2);
        }
        for (const side of [-1, 1]) for (let row = 0; row < 4; row++) for (let k = 0; k < 4 - row; k++) {
          addBlock(1, 1, 1, new B.Vector3(side * 6.5 + (k - (3 - row) / 2) * 1.05, 0.5 + row, 0), side > 0 ? 1 : 2);
        }
      };
      const ballMat = new B.StandardMaterial("ball", scene);
      ballMat.emissiveColor = hex(ACCENT).scale(0.8);
      const ui = makeUI(S);
      const tag = guiTag(ui, null, "", { bg: ACCENT, color: "#1a1a14", border: false, offsetY: -34 });
      const fireBall = (dir) => {
        const s = B.MeshBuilder.CreateSphere("ball", { diameter: 0.7, segments: 16 }, scene);
        s.position = cam.position.add(dir.scale(1.5));
        s.material = ballMat;
        shadows.addShadowCaster(s);
        const agg = new B.PhysicsAggregate(s, B.PhysicsShapeType.SPHERE, { mass: 4.1, restitution: 0.35, friction: 0.4 }, scene);
        agg.body.setLinearVelocity(dir.scale(speed));
        balls.push({ s, agg });
        if (balls.length > 30) { const old = balls.shift(); old.agg.dispose(); old.s.dispose(); }
        fired++;
        tag.rect.linkWithMesh(s);
        tag.rect.isVisible = true;
        tag.text.text = `第 ${fired} 球`;
      };
      scene.onPointerObservable.add((pi) => {
        if (pi.type !== B.PointerEventTypes.POINTERTAP) return;
        fireBall(scene.createPickingRay(scene.pointerX, scene.pointerY, B.Matrix.Identity(), cam).direction);
      });
      ctx.button("連發 8 球", () => {
        const base = cam.target.subtract(cam.position).normalize();
        for (let i = 0; i < 8; i++) {
          ctx.timeout(() => fireBall(base.add(new B.Vector3((Math.random() - 0.5) * 0.2, (Math.random() - 0.3) * 0.12, (Math.random() - 0.5) * 0.2)).normalize()), i * 90);
        }
      }, { primary: true });
      ctx.button("重建積木", () => build());
      ctx.toggle("慢動作", false, (v) => { timeScale = v ? 0.2 : 1; });
      ctx.slider("重力", { min: -25, max: 0, step: 0.1, value: -9.81, format: (v) => `${v.toFixed(1)} m/s²` }, (v) => scene.getPhysicsEngine().setGravity(new B.Vector3(0, v, 0)));
      ctx.slider("球速", { min: 10, max: 60, step: 1, value: speed, format: (v) => `${v} m/s` }, (v) => { speed = v; });
      const setChip = chip(ctx, "");
      S.onFrame(() => {
        let moved = 0;
        for (const b of blocks) if (B.Vector3.DistanceSquared(b.mesh.position, b.start) > 0.25) moved++;
        setChip(`已移位 <b>${moved}</b> / ${blocks.length} 塊・已發射 <b>${fired}</b> 球`);
      });
      S.onSize(() => {
        cam.radius = Math.max(22, fitRadius(S, 8.5, 5, 1.1));
        cam.lowerRadiusLimit = 10;
        cam.upperRadiusLimit = Math.max(50, cam.radius * 1.5);
      });
      build();
      ctx.timeout(() => fireBall(new B.Vector3(0, 3.4, 0).subtract(cam.position).normalize()), 900);
    },
  },
  {
    id: "pbr", title: "PBR 材質",
    api: "new PBRMaterial()・clearCoat / sheen / anisotropy / iridescence / subSurface",
    desc: "PBRMaterial 以金屬度與粗糙度描述表面，反射與環境光全來自一張預先濾波的 .env 立方體貼圖；第二組展示清漆、絨面、異向性、虹彩與折射等進階材質層。",
    hint: "拖曳旋轉視角・切換材質組・調整環境光強度",
    async mount(ctx) {
      const S = stage(ctx, { alpha: -Math.PI / 2, beta: 1.45, fov: 0.7 });
      const { scene, cam } = S;
      tone(scene, 1.1);
      const env = await withEnv(ctx, scene);
      if (!ctx.active) return;
      scene.environmentTexture = env;
      const sky = scene.createDefaultSkybox(env, true, 1000, 0.35, false);
      const ui = makeUI(S);
      const allMats = [];
      const grid = [], colLabels = [], rowLabels = [];
      for (let r = 0; r < 2; r++) for (let i = 0; i < 5; i++) {
        const s = B.MeshBuilder.CreateSphere(`s${r}${i}`, { diameter: 1.5, segments: 48 }, scene);
        s.material = pbr(scene, `g${r}${i}`, r ? "#3a8fd6" : "#f0c75e", r ? 0 : 1, i / 4);
        allMats.push(s.material);
        grid.push({ s, r, i });
      }
      for (let i = 0; i < 5; i++) { const a = new B.TransformNode("cl" + i, scene); colLabels.push({ a, i, tag: guiTag(ui, a, "") }); }
      for (let r = 0; r < 2; r++) { const a = new B.TransformNode("rl" + r, scene); rowLabels.push({ a, r, tag: guiTag(ui, a, r ? "非金屬" : "金屬", { color: ACCENT }) }); }
      const ADV = [
        ["清漆 clearCoat", () => B.MeshBuilder.CreateCapsule("cc", { radius: 0.6, height: 1.9, tessellation: 48, subdivisions: 6 }, scene),
          (m) => { m.clearCoat.isEnabled = true; m.clearCoat.intensity = 1; m.clearCoat.roughness = 0.03; }, "#b0121b", 0.1, 0.6],
        ["絨面 sheen", () => B.MeshBuilder.CreateTorus("sh", { diameter: 1.4, thickness: 0.55, tessellation: 64 }, scene),
          (m) => { m.sheen.isEnabled = true; m.sheen.color = hex("#ffb3e6"); m.sheen.intensity = 1; m.sheen.roughness = 0.3; }, "#3b1f5c", 0, 0.85],
        ["異向性 anisotropy", () => B.MeshBuilder.CreateCylinder("an", { diameter: 1.3, height: 1.7, tessellation: 96 }, scene),
          (m) => { m.anisotropy.isEnabled = true; m.anisotropy.intensity = 1; m.anisotropy.direction = new B.Vector2(0, 1); }, "#d4d7dc", 1, 0.32],
        ["虹彩 iridescence", () => B.MeshBuilder.CreateSphere("ir", { diameter: 1.6, segments: 48 }, scene),
          (m) => { m.iridescence.isEnabled = true; m.iridescence.intensity = 1; m.iridescence.indexOfRefraction = 1.3; m.iridescence.maximumThickness = 420; }, "#202020", 1, 0.12],
        ["折射 subSurface", () => B.MeshBuilder.CreateTorusKnot("rf", { radius: 0.55, tube: 0.2, radialSegments: 160, tubularSegments: 24 }, scene),
          (m) => { m.subSurface.isRefractionEnabled = true; m.subSurface.refractionIntensity = 1; m.subSurface.indexOfRefraction = 1.5; m.subSurface.tintColor = hex("#8fdcff"); }, "#ffffff", 0, 0.03],
      ].map(([name, make, setup, albedo, metal, rough], i) => {
        const mesh = make();
        mesh.material = pbr(scene, name, albedo, metal, rough);
        setup(mesh.material);
        allMats.push(mesh.material);
        const a = new B.TransformNode("al" + i, scene);
        return { mesh, a, i, tag: guiTag(ui, a, name) };
      });
      let mode = 0;
      const setChip = chip(ctx, "");
      const layout = () => {
        const p = S.width < S.height;
        for (const { s, r, i } of grid) { s.setEnabled(mode === 0); s.position.set(p ? (r ? 1.2 : -1.2) : (i - 2) * 1.9, p ? (2 - i) * 1.75 : (r ? -1.05 : 1.05), 0); }
        for (const { a, i, tag } of colLabels) {
          a.position.set(p ? 0 : (i - 2) * 1.9, p ? (2 - i) * 1.75 : -2.15, 0);
          tag.text.text = `${p ? "" : "粗糙 "}${(i / 4).toFixed(2)}`;
          tag.rect.isVisible = mode === 0;
        }
        for (const { a, r, tag } of rowLabels) { a.position.set(p ? (r ? 1.2 : -1.2) : -5.25, p ? 4.75 : (r ? -1.05 : 1.05), 0); tag.rect.isVisible = mode === 0; }
        const advPos = p ? [[-1.2, 2.7], [1.2, 2.7], [-1.2, 0], [1.2, 0], [0, -2.7]] : [[-4.6, 0.2], [-2.3, 0.2], [0, 0.2], [2.3, 0.2], [4.6, 0.2]];
        for (const { mesh, a, i, tag } of ADV) {
          mesh.setEnabled(mode === 1);
          mesh.position.set(advPos[i][0], advPos[i][1], 0);
          a.position.set(advPos[i][0], advPos[i][1] - 1.35, 0);
          tag.rect.isVisible = mode === 1;
        }

          if (!g.isPlaying || (a && (g.to - a.masterFrame) / (60 * speed) < 0.3)) play(lastLoop);
        }
        for (const { t, name } of morphs) t.influence += ((name === face ? 1 : 0) - t.influence) * Math.min(1, dt * 8);
        ringMat.emissiveColor = hex(ACCENT).scale(0.85 + Math.sin(performance.now() / 500) * 0.15);
        const live = Object.values(G).filter((g) => g.isPlaying && g.weight > 0.005).map((g) => `${g.name} <b>${g.weight.toFixed(2)}</b>`);
        setChip(`動畫群組權重：${live.join("・") || "無"}`);
      });
      play("Idle", true);
      const LOOPS = [["Idle", "待機"], ["Walking", "走路"], ["Running", "跑步"], ["Dance", "跳舞"]];
      ctx.group(LOOPS.map((l) => l[1]), 0, (i) => play(LOOPS[i][0]));
      ctx.button("揮手", () => play("Wave"));
      ctx.select("表情", [{ value: "", label: "無" }, { value: "Angry", label: "生氣" }, { value: "Surprised", label: "驚訝" }, { value: "Sad", label: "難過" }], "", (v) => { face = v; });
      ctx.slider("速度", { min: 0.25, max: 2, step: 0.05, value: 1, format: (v) => `${v.toFixed(2)}×` }, (v) => { speed = v; for (const g of Object.values(G)) g.speedRatio = v; });
      let viewer = null;
      const skinned = box.meshes.find((m) => m.skeleton);
      ctx.toggle("骨架", false, (on) => {
        if (viewer) { viewer.dispose(); viewer = null; }
        for (const m of robotMeshes) m.visibility = on ? 0.3 : 1;
        if (!on || !skinned) return;
        viewer = new B.Debug.SkeletonViewer(skinned.skeleton, skinned, scene, true, 3, { displayMode: B.Debug.SkeletonViewer.DISPLAY_SPHERE_AND_SPURS });
        viewer.isEnabled = true;
      });
      ctx.onCleanup(() => { if (viewer) viewer.dispose(); });
      scene.onPointerObservable.add((pi) => {
        if (pi.type !== B.PointerEventTypes.POINTERTAP) return;
        if (scene.pick(scene.pointerX, scene.pointerY, (m) => robotMeshes.has(m)).hit) play("Jump");
      });
      S.onSize(() => { cam.radius = fitRadius(S, 3.5, 3.0, 1.1); cam.lowerRadiusLimit = 5; cam.upperRadiusLimit = cam.radius * 2; });
    },
  },
  {
    id: "post", title: "後製管線",
    api: "new DefaultRenderingPipeline(name, hdr, scene, [camera])",
    desc: "一條 DefaultRenderingPipeline 就提供泛光、景深、色差、底片顆粒、暗角、FXAA 與 ACES 色調映射；逐項開關比較，並用滑桿移動景深的對焦距離。",
    hint: "逐項開關效果・拖曳對焦距離看前後景模糊",
    mount(ctx) {
      const S = stage(ctx, { alpha: -Math.PI / 2 + 0.3, beta: 1.42, radius: 9, target: [0, 1.7, 7], fov: 0.75, pfov: 1.05 });
      const { scene, cam } = S;
      Object.assign(scene, { fogMode: B.Scene.FOGMODE_EXP2, fogDensity: 0.025, fogColor: hex("#07080b"), clearColor: B.Color4.FromHexString("#07080bff") });
      const hemi = new B.HemisphericLight("hemi", new B.Vector3(0, 1, -0.2), scene);
      hemi.intensity = 0.45;
      const sun = new B.DirectionalLight("sun", new B.Vector3(0.3, -1, 0.6), scene);
      sun.intensity = 0.9;
      const floor = B.MeshBuilder.CreateGround("floor", { width: 16, height: 80 }, scene);
      floor.position.z = 30;
      floor.material = checkerMat(scene, 10, "#15181f", "#1c2029");
      floor.material.diffuseTexture.vScale = 50;
      for (let k = 0; k < 12; k++) {
        const arch = B.MeshBuilder.CreateTorus("arch", { diameter: 5.4, thickness: 0.16, tessellation: 72 }, scene);
        arch.rotation.x = Math.PI / 2;
        arch.position.set(0, 2.7, k * 4.5 - 2);
        const m = new B.StandardMaterial("arch" + k, scene);
        m.emissiveColor = hex(PALETTE[k % PALETTE.length]);
        m.disableLighting = true;
        arch.material = m;
      }
      for (let k = 0; k < 18; k++) {
        const s = 0.5 + ((k * 37) % 9) / 10;
        const b = B.MeshBuilder.CreateBox("crate", { size: s }, scene);
        b.position.set((k % 2 ? 1 : -1) * (3.4 + ((k * 13) % 5) * 0.25), s / 2, k * 2.4 - 1);
        b.rotation.y = k * 0.7;
        const m = new B.StandardMaterial("crate" + k, scene);
        m.diffuseColor = hex(PALETTE[(k + 2) % PALETTE.length]).scale(0.55);
        m.specularColor = new B.Color3(0.4, 0.4, 0.4);
        b.material = m;
      }
      const knot = B.MeshBuilder.CreateTorusKnot("knot", { radius: 0.7, tube: 0.24, radialSegments: 160, tubularSegments: 24 }, scene);
      knot.position.set(0, 1.7, 7);
      const km = new B.StandardMaterial("knot", scene);
      km.diffuseColor = hex("#e9e6dc");
      km.specularColor = new B.Color3(0.9, 0.9, 0.9);
      km.specularPower = 64;
      km.emissiveColor = hex("#4cc9f0").scale(0.25);
      knot.material = km;
      S.onFrame((dt) => { knot.rotation.y += dt * 0.6; knot.rotation.x += dt * 0.25; });
      const pp = new B.DefaultRenderingPipeline("pp", true, scene, [cam]);
      Object.assign(pp, { bloomEnabled: true, bloomThreshold: 0.6, bloomWeight: 0.7, bloomKernel: 64, bloomScale: 0.5,
        depthOfFieldBlurLevel: B.DepthOfFieldEffectBlurLevel.Medium, depthOfFieldEnabled: true, chromaticAberrationEnabled: true,
        grainEnabled: true, fxaaEnabled: true, imageProcessingEnabled: true });
      Object.assign(pp.depthOfField, { fStop: 1.4, focalLength: 50, focusDistance: 9000 });
      Object.assign(pp.chromaticAberration, { aberrationAmount: 40, radialIntensity: 1.2 });
      Object.assign(pp.grain, { intensity: 14, animated: true });
      Object.assign(pp.imageProcessing, { toneMappingEnabled: true, toneMappingType: B.ImageProcessingConfiguration.TONEMAPPING_ACES, exposure: 1.1,
        vignetteEnabled: true, vignetteWeight: 3, vignetteColor: new B.Color4(0, 0, 0, 0) });
      ctx.toggle("光暈", true, (v) => { pp.bloomEnabled = v; });
      ctx.toggle("景深", true, (v) => { pp.depthOfFieldEnabled = v; });
      ctx.toggle("色差", true, (v) => { pp.chromaticAberrationEnabled = v; });
      ctx.toggle("顆粒", true, (v) => { pp.grainEnabled = v; });
      ctx.toggle("暗角", true, (v) => { pp.imageProcessing.vignetteEnabled = v; });
      ctx.toggle("FXAA", true, (v) => { pp.fxaaEnabled = v; });
      ctx.slider("對焦距離", { min: 2, max: 40, step: 0.5, value: 9, format: (v) => `${v.toFixed(1)} m` }, (v) => { pp.depthOfField.focusDistance = v * 1000; });
      S.onSize(() => { cam.radius = Math.max(9, fitRadius(S, 2.8, 2.2, 1.1)); cam.lowerRadiusLimit = 4; cam.upperRadiusLimit = 30; });
    },
  },
  {
    id: "mesh", title: "網格建構",
    api: "MeshBuilder.CreateLathe / CreateTube / CreateRibbon / ExtrudeShapeCustom / CreateGoldberg・new GizmoManager()",
    desc: "MeshBuilder 從輪廓、路徑與函式即時生成幾何：車削、變徑管線、緞帶曲面、旋轉縮放擠出、戈德堡多面體。點選任一網格用 GizmoManager 拖曳移動、旋轉或縮放。",
    hint: "點網格選取・拖曳控制把手・切換 Gizmo 類型",
    mount(ctx) {
      const S = stage(ctx, { alpha: -Math.PI / 2 + 0.25, beta: 1.2, pfov: 1.0 });
      const { scene, cam } = S;
      const hemi = new B.HemisphericLight("hemi", new B.Vector3(0.2, 1, -0.4), scene);
      hemi.intensity = 0.7;
      hemi.groundColor = hex("#202634");
      const sun = new B.DirectionalLight("sun", new B.Vector3(-0.4, -0.8, 0.6), scene);
      sun.intensity = 0.8;
      const ui = makeUI(S);
      const DS = B.Mesh.DOUBLESIDE;
      const helix = [], ribbon = [], star = [], spine = [];
      for (let i = 0; i <= 140; i++) { const a = (i / 140) * Math.PI * 6; helix.push(new B.Vector3(Math.cos(a) * 0.7, -1 + (i / 140) * 2, Math.sin(a) * 0.7)); }
      for (let r = 0; r <= 24; r++) {
        const row = [], y = -1 + (r / 24) * 2;
        for (let i = 0; i <= 40; i++) { const x = -1.1 + (i / 40) * 2.2; row.push(new B.Vector3(x, y, Math.sin(x * 3 + y * 2.2) * 0.32)); }
        ribbon.push(row);
      }
      for (let i = 0; i < 10; i++) { const a = (i / 10) * Math.PI * 2, r = i % 2 ? 0.3 : 0.68; star.push(new B.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0)); }
      for (let i = 0; i <= 30; i++) spine.push(new B.Vector3(0, -1 + (i / 30) * 2, 0));
      const vase = [[0, -1.1], [0.55, -1.1], [0.78, -0.65], [0.62, -0.05], [0.36, 0.45], [0.4, 0.85], [0.58, 1.1]].map(([x, y]) => new B.Vector3(x, y, 0));
      const SPECS = [
        ["車削", "CreateLathe", () => B.MeshBuilder.CreateLathe("lathe", { shape: vase, tessellation: 64, sideOrientation: DS }, scene)],
        ["變徑管線", "CreateTube", () => B.MeshBuilder.CreateTube("tube", { path: helix, tessellation: 20, cap: B.Mesh.CAP_ALL,
          radiusFunction: (i) => 0.07 + 0.09 * (0.5 + 0.5 * Math.sin(i * 0.22)) }, scene)],
        ["緞帶曲面", "CreateRibbon", () => B.MeshBuilder.CreateRibbon("ribbon", { pathArray: ribbon, sideOrientation: DS }, scene)],
        ["扭轉擠出", "ExtrudeShapeCustom", () => B.MeshBuilder.ExtrudeShapeCustom("extrude", { shape: star, path: spine, closeShape: true, cap: B.Mesh.CAP_ALL,
          scaleFunction: (i) => 1 - i * 0.014, rotationFunction: () => 0.05, sideOrientation: DS }, scene)],
        ["戈德堡多面體", "CreateGoldberg", () => {
          const g = B.MeshBuilder.CreateGoldberg("goldberg", { m: 3, n: 1, size: 1.1 }, scene);
          const n = g.goldbergData.nbFaces, ranges = [];
          for (let f = 0; f < n; f++) { const c = hex(PALETTE[f < 12 ? 0 : 1 + (f % 5)]); ranges.push([f, f, new B.Color4(c.r, c.g, c.b, 1)]); }
          g.setGoldbergFaceColors(ranges);
          return g;
        }],
        ["多面體", "CreatePolyhedron", () => B.MeshBuilder.CreatePolyhedron("poly", { type: 4, size: 0.85,
          faceColors: Array.from({ length: 26 }, (_, i) => { const c = hex(PALETTE[i % PALETTE.length]); return new B.Color4(c.r, c.g, c.b, 1); }) }, scene)],
      ];
      const meshes = SPECS.map(([zh, api, make], i) => {
        const mesh = make();
        const m = new B.StandardMaterial("m" + i, scene);
        m.diffuseColor = i >= 4 ? new B.Color3(1, 1, 1) : hex(PALETTE[(i + 1) % PALETTE.length]);
        m.specularColor = new B.Color3(0.35, 0.35, 0.35);
        m.backFaceCulling = false;
        mesh.material = m;
        mesh.metadata = { zh, api };
        const a = new B.TransformNode("lab" + i, scene);
        const tag = guiTag(ui, a, "");
        return { mesh, a, tag };
      });
      const hl = new B.HighlightLayer("hl", scene);
      const util = new B.UtilityLayerRenderer(scene), utilDepth = new B.UtilityLayerRenderer(scene);
      utilDepth.utilityLayerScene.autoClearDepthAndStencil = false;
      const gm = new B.GizmoManager(scene, 1, util, utilDepth);
      gm.usePointerToAttachGizmos = true;
      gm.attachableMeshes = meshes.map((x) => x.mesh);
      gm.positionGizmoEnabled = true;
      ctx.onCleanup(() => { gm.dispose(); util.dispose(); utilDepth.dispose(); });
      const setChip = chip(ctx, "");
      const describe = (m) => setChip(m
        ? `${m.metadata.zh} ${m.metadata.api}：<b>${fmt(m.getTotalVertices())}</b> 個頂點・<b>${fmt(m.getTotalIndices() / 3)}</b> 個三角形`
        : "點任一網格選取，查看頂點與三角形數");
      gm.onAttachedToMeshObservable.add(describe);
      let hovered = null;
      scene.onPointerObservable.add((pi) => {
        if (pi.type !== B.PointerEventTypes.POINTERMOVE) return;
        const pick = scene.pick(scene.pointerX, scene.pointerY, (m) => gm.attachableMeshes.includes(m));
        const m = pick.hit ? pick.pickedMesh : null;
        if (m === hovered) return;
        if (hovered) hl.removeMesh(hovered);
        hovered = m;
        if (m) hl.addMesh(m, hex(ACCENT));
      });
      const KINDS = ["positionGizmoEnabled", "rotationGizmoEnabled", "scaleGizmoEnabled", "boundingBoxGizmoEnabled"];
      ctx.group(["移動", "旋轉", "縮放", "邊界框"], 0, (i) => { KINDS.forEach((k, j) => { gm[k] = i === j; }); });
      ctx.toggle("線框", false, (v) => { for (const { mesh } of meshes) mesh.material.wireframe = v; });
      ctx.button("重設位置", () => { layout(true); });
      // Positions are only re-laid out on orientation change or reset, so gizmo edits survive chip-height refits.
      let lastP = null;
      const layout = (force) => {
        const p = S.width < S.height, cols = p ? 2 : 3, sx = p ? 2.9 : 3.5, sy = p ? 3.3 : 3.4;
        const short = p || S.width < 760;
        for (const { mesh, tag } of meshes) tag.text.text = short ? mesh.metadata.zh : `${mesh.metadata.zh} ${mesh.metadata.api}`;
        if (force !== true && p === lastP) return;
        lastP = p;
        meshes.forEach(({ mesh }, i) => {
          const c = i % cols, r = Math.floor(i / cols), rows = Math.ceil(meshes.length / cols);
          mesh.position.set((c - (cols - 1) / 2) * sx, ((rows - 1) / 2 - r) * sy + 0.25, 0);
          mesh.rotationQuaternion = null;
          mesh.rotation.set(0, 0, 0);
          mesh.scaling.setAll(1);
        });
      };
      S.onFrame(() => { for (const { mesh, a } of meshes) a.position.set(mesh.position.x, mesh.position.y - 1.45 * mesh.scaling.y, mesh.position.z); });
      S.onSize(() => {
        layout();
        const p = S.width < S.height;
        cam.radius = p ? fitRadius(S, 2.9, 5.2, 1.06) : fitRadius(S, 5.2, 3.5, 1.06);
        cam.lowerRadiusLimit = cam.radius * 0.4;
        cam.upperRadiusLimit = cam.radius * 2;
      });
      gm.attachToMesh(meshes[0].mesh);
      describe(meshes[0].mesh);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "mesh.thinInstanceSetBuffer(\"matrix\", m, 16)・new PhysicsAggregate(thinInstancedMesh, ...)",
    desc: "一個 thin instance 網格掛上 PhysicsAggregate，每個實例都是一個 Havok 剛體，由旋轉的攪拌槳持續擾動；逐級加量，量測物理步進耗時與幀率。",
    hint: "按「自動加壓」開始，可切換方塊或球體、開關攪拌槳",
    async mount(ctx) {
      ctx.html(`<div class="stress-view"></div>`);
      const host = ctx.$(".stress-view");
      ctx.controls.classList.add("bottom");
      const st = ctx.status("載入 Havok 物理引擎（WebAssembly）…");
      const havok = await getHavok().catch((e) => { st.error("Havok 載入失敗，請檢查網路後重試"); throw e; });
      st.done();
      if (!ctx.active) return;
      const S = stage(ctx, { host, alpha: -Math.PI / 2 + 0.6, beta: 0.95, target: [0, 0.5, 0], bg: "#07080bff", maxBeta: 1.45 });
      const { scene, cam } = S;
      const hemi = new B.HemisphericLight("hemi", new B.Vector3(0.2, 1, -0.3), scene);
      hemi.intensity = 0.75;
      hemi.groundColor = hex("#1a1e28");
      const sun = new B.DirectionalLight("sun", new B.Vector3(-0.5, -1, 0.4), scene);
      sun.intensity = 0.9;
      scene.enablePhysics(new B.Vector3(0, -9.81, 0), new B.HavokPlugin(false, havok));
      const inst = new B.SceneInstrumentation(scene);
      inst.capturePhysicsTime = true;
      const wallMat = new B.StandardMaterial("wall", scene);
      wallMat.diffuseColor = hex("#4cc9f0");
      wallMat.alpha = 0.12;
      const staticBox = (w, hgt, d, x, y, z, mat) => {
        const b = B.MeshBuilder.CreateBox("static", { width: w, height: hgt, depth: d }, scene);
        b.position.set(x, y, z);
        b.material = mat;
        new B.PhysicsAggregate(b, B.PhysicsShapeType.BOX, { mass: 0, friction: 0.6 }, scene);
      };
      staticBox(26, 1, 26, 0, -0.5, 0, checkerMat(scene, 6));
      for (const [w, d, x, z] of [[26, 0.5, 0, 13.25], [26, 0.5, 0, -13.25], [0.5, 26, 13.25, 0], [0.5, 26, -13.25, 0]]) staticBox(w, 4, d, x, 2, z, wallMat);
      const paddle = B.MeshBuilder.CreateBox("paddle", { width: 24, height: 1.2, depth: 0.6 }, scene);
      paddle.position.y = 0.6;
      paddle.material = new B.StandardMaterial("paddle", scene);
      paddle.material.diffuseColor = hex(ACCENT);
      const paddleAgg = new B.PhysicsAggregate(paddle, B.PhysicsShapeType.BOX, { mass: 1 }, scene);
      paddleAgg.body.setMotionType(B.PhysicsMotionType.ANIMATED);
      paddleAgg.body.disablePreStep = false;
      let spin = true, yaw = 0, shape = 0, count = 0, mesh = null, agg = null;
      S.onFrame((dt) => {
        if (!spin) return;
        yaw += dt * 0.7;
        B.Quaternion.RotationYawPitchRollToRef(yaw, 0, 0, paddle.rotationQuaternion);
      });
      const mat = new B.StandardMaterial("bodies", scene);
      mat.specularColor = new B.Color3(0.3, 0.3, 0.3);
      const PAL = PALETTE.map(hex);
      const rebuild = (n) => {
        if (agg) agg.dispose();
        if (mesh) mesh.dispose();
        mesh = shape ? B.MeshBuilder.CreateSphere("body", { diameter: 0.55, segments: 8 }, scene) : B.MeshBuilder.CreateBox("body", { size: 0.5 }, scene);
        mesh.material = mat;
        const mats = new Float32Array(n * 16), cols = new Float32Array(n * 4);
        const m = new B.Matrix(), q = new B.Quaternion(), one = new B.Vector3(1, 1, 1), p = new B.Vector3();
        for (let i = 0; i < n; i++) {
          const layer = Math.floor(i / 784), k = i % 784;
          p.set(((k % 28) - 13.5) * 0.75 + (Math.random() - 0.5) * 0.1, 1.6 + layer * 0.75, (Math.floor(k / 28) - 13.5) * 0.75 + (Math.random() - 0.5) * 0.1);
          B.Quaternion.RotationYawPitchRollToRef(Math.random() * Math.PI, 0, 0, q);
          B.Matrix.ComposeToRef(one, q, p, m);
          m.copyToArray(mats, i * 16);
          const c = PAL[i % PAL.length];
          cols.set([c.r, c.g, c.b, 1], i * 4);
        }
        mesh.thinInstanceSetBuffer("matrix", mats, 16, false);
        mesh.thinInstanceSetBuffer("color", cols, 4);
        mesh.alwaysSelectAsActiveMesh = true;
        agg = new B.PhysicsAggregate(mesh, shape ? B.PhysicsShapeType.SPHERE : B.PhysicsShapeType.BOX,
          { mass: 1, friction: 0.6, restitution: 0.1, center: B.Vector3.Zero(), extents: new B.Vector3(0.5, 0.5, 0.5), radius: 0.275 }, scene);
      };
      ctx.toggle("攪拌槳", true, (v) => { spin = v; });
      ctx.group(["方塊", "球體"], 0, (i) => { shape = i; if (count) rebuild(count); });
      S.onSize(() => { cam.radius = fitRadius(S, 14, 7, 1.05); cam.lowerRadiusLimit = 8; cam.upperRadiusLimit = 70; });
      ctx.ramp({
        label: "剛體數", unit: "個",
        steps: [250, 500, 1000, 2000, 3000, 4500, 6000, 8000],
        minFps: 30,
        apply(n) { count = n; rebuild(n); },
        metrics: () => ({ 物理步進: `${inst.physicsTimeCounter.lastSecAverage.toFixed(1)} ms`, "Draw calls": inst.drawCallsCounter.current }),
        note: "所有剛體共用一個 thin instance 網格，繪製只需一次 draw call，瓶頸幾乎全在 Havok：WebAssembly 單執行緒求解器每步要處理大量接觸對，攪拌槳讓剛體無法進入休眠。關掉攪拌槳後堆疊靜止、剛體休眠，物理耗時會明顯下降。",
      });
    },
  },
] });
</script>
