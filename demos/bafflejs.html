<script src="https://cdn.jsdelivr.net/npm/baffle@0.3.6/dist/baffle.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// baffle.js showcase: case-file decode, character sets, speed vs reveal timing, method/state
// inspector, multi-element departure board, hover trigger, async result reveal, and an
// element-count stress ramp.
const nf = new Intl.NumberFormat("zh-TW");
const put = (el, v) => { if (el.textContent !== v) el.textContent = v; };
// The library default, read from a throwaway instance instead of copied by hand.
const DEF_CHARS = baffle(document.createElement("i")).options.characters;
const SETS = {
  han: "密碼解譯資料檔案代號機要保護隱藏訊號頻率加鎖封存情報行動目標座標",
  block: "█▓▒░▚▞▙▟▛▜■□",
  sym: "!<>-_\\/[]{}=+*^?#%&@",
};
const lone = (u) => /^[\uD800-\uDFFF]$/.test(u);

// Scene 1
const KEYS1 = ["han", "block", "sym"];
// Punctuation stays put so each line keeps its shape while scrambled.
const EXCLUDE1 = [" ", "，", "。", "-", "#"];

// Scene 2
const MOONS = ["🌑", "🌒", "🌓", "🌔", "🌕", "🌖", "🌗", "🌘"];
const CH2 = [
  { label: "預設（英數符號）", v: DEF_CHARS, code: "baffle(els)  // 不給 characters 就用預設",
    note: "沒給 characters 時用內建的英數與符號。中文被換成半形字，打亂時那一行的寬度會跳動。" },
  { label: "二進位 01", v: "01", code: 'b.set({ characters: "01" })', note: "只有兩個字可挑，打亂時像一串跳動的位元。" },
  { label: "方塊", v: "█▓▒░", code: 'b.set({ characters: "█▓▒░" })', note: "四種濃淡的方塊，打亂時像收訊不良的雜訊。" },
  { label: "注音", v: "ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦㄧㄨㄩ", code: 'b.set({ characters: "ㄅㄆㄇㄈ…" })',
    note: "注音和中文一樣是全形，打亂時中文那一行寬度不變。" },
  { label: "點字", v: "⠁⠃⠉⠙⠑⠋⠛⠓⠊⠚⠅⠇⠍⠝⠕⠏⠟⠗⠎⠞⠥⠧⠺⠭⠽⠵", code: 'b.set({ characters: "⠁⠃⠉⠙…" })', note: "只要每個符號都是單一 UTF-16 單位，字串就能直接當字元集。" },
  { label: "月相（陣列）", v: MOONS, code: 'b.set({ characters: ["🌑", "🌒", "🌓", …] })',
    note: "emoji 佔兩個 UTF-16 單位。用陣列傳入時每一項是完整的字，取樣不會拆壞。" },
  { label: "月相（字串，錯誤示範）", v: MOONS.join(""), code: 'b.set({ characters: "🌑🌒🌓…" })',
    note: "字串是用索引取樣，挑到的是半個 emoji，畫面出現亂碼方塊。這是 baffle 0.3.6 的實際行為。" },
];
const KEEP2 = [" ", "，", "。", ",", "."];

// Scene 3
const T3 = "第七號檔案已經解碼完成";
const SPEEDS3 = [20, 80, 240];

// Scene 4
const NEXT4 = ["夜鷹已就位", "目標正在移動", "行動代號：破曉", "任務完成，撤離"];

// Scene 5: Taiwan High Speed Rail stations, north to south.
const ST5 = ["南港 Nangang", "台北 Taipei", "板橋 Banqiao", "桃園 Taoyuan", "新竹 Hsinchu", "苗栗 Miaoli",
  "台中 Taichung", "彰化 Changhua", "雲林 Yunlin", "嘉義 Chiayi", "台南 Tainan", "左營 Zuoying"];
const STATUS5 = ["準點", "準點", "準點", "延誤 5 分", "延誤 10 分"];
const ROWS5 = [["08:05", "603", 11, "1"], ["08:12", "115", 6, "2"], ["08:20", "807", 1, "4"], ["08:31", "221", 9, "3"], ["08:40", "639", 4, "1"], ["08:46", "143", 10, "2"]];
const pad2 = (n) => String(n).padStart(2, "0");
const addMin = (t, d) => { const [h, m] = t.split(":").map(Number); const v = (h * 60 + m + d) % 1440; return `${pad2((v / 60) | 0)}:${pad2(v % 60)}`; };
const COLS5 = [
  { cls: "c-tm", opt: { characters: "0123456789", exclude: [":"] }, next: (t) => addMin(t, 37) },
  { cls: "c-no", opt: { characters: "0123456789" }, next: (t) => String(((+t - 100 + 14) % 900) + 100) },
  { cls: "c-dest", opt: { characters: "ABCDEFGHIJKLMNOPQRSTUVWXYZ台北南港板橋桃園新竹苗栗中彰化雲林嘉義左營", exclude: [" "] }, next: (t) => ST5[(ST5.indexOf(t) + 5) % ST5.length] },
  { cls: "c-pf", opt: { characters: "1234" }, next: () => String(1 + Math.floor(Math.random() * 4)) },
  { cls: "c-st", opt: { characters: "準點延誤分鐘班次", exclude: [" "] }, next: () => STATUS5[Math.floor(Math.random() * STATUS5.length)] },
];

// Scene 6
const MENU6 = [["HOME", "首頁"], ["WORK", "作品"], ["ABOUT", "關於"], ["NOTES", "筆記"], ["CONTACT", "聯絡"], ["ARCHIVE", "封存"]];
const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

// Scene 7: real PBKDF2 work through WebCrypto, so the wait is not a fake timer.
// 600,000 is the OWASP floor for PBKDF2-SHA256; the larger counts make the wait visible on fast machines.
const ITER7 = [600000, 3000000, 10000000];
const enc = new TextEncoder();
const SALT7 = enc.encode("js-tools-atlas");
const derive = async (pass, iterations) => {
  const key = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: SALT7, iterations, hash: "SHA-256" }, key, 256);
  return [...new Uint8Array(bits)].map((x) => x.toString(16).padStart(2, "0")).join("");
};

// Scene 8
const HEX = "0123456789ABCDEF";
const hexId = () => {
  let s = "";
  for (let i = 0; i < 6; i++) { s += HEX[(Math.random() * 16) | 0]; if (i === 2) s += "-"; }
  return s;
};

Showcase.run({ scenes: [
  {
    id: "casefile", title: "機密檔案解碼",
    api: "baffle(el, { characters, exclude, speed }).start()・b.reveal(ms)",
    desc: "招牌示範：六個欄位各一個 baffle 實例，先 start() 打亂，再依序 reveal() 還原，全部停下後蓋上已解密章。換字元集用 set({ characters })，滑過任一行只重新解碼那一行。",
    hint: "按解碼或全部打亂・換字元集・滑過任一行",
    mount(ctx) {
      ctx.html(`<div class="fill term"><div class="s1">
        <article class="file">
          <div class="no bf">CASE FILE #0921</div>
          <h1 class="bf">夜鷹計畫</h1>
          <div class="frow"><b>代號</b><span class="bf">NIGHTHAWK-07，三人小組</span></div>
          <div class="frow"><b>地點</b><span class="bf">台北市信義區，某棟大樓的頂樓</span></div>
          <div class="frow"><b>時間</b><span class="bf">十月三日，二十三點五十九分</span></div>
          <div class="frow memo"><b>備註</b><span class="bf">每一行都先被打亂，再一個字一個字還原成原文。</span></div>
          <div class="stamp">已解密</div>
        </article>
        <div class="read"><span class="tag">狀態 <b class="zh st">…</b></span><span class="tag">已停止 <b class="nr">0</b> / 6 個實例</span><span class="tag">字元集 <b class="zh cs">中文</b></span></div>
      </div></div>`);
      const root = ctx.$(".s1"), st = ctx.$(".s1 .st"), nr = ctx.$(".s1 .nr"), cs = ctx.$(".s1 .cs");
      const els = ctx.$$(".s1 .bf");
      // One instance per line, so each line can be scrambled and revealed on its own.
      const bs = els.map((el) => baffle(el, { characters: SETS.han, exclude: EXCLUDE1, speed: 60 }));
      ctx.onCleanup(() => bs.forEach((b) => b.stop()));
      let timers = [], decoding = false, auto = true;
      const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
      const scramble = () => { clearTimers(); bs.forEach((b) => b.start()); decoding = false; };
      // Staggered with our own timers (not reveal's delay argument) so 全部打亂 can cancel them.
      const decode = () => {
        scramble();
        decoding = true;
        bs.forEach((b, i) => timers.push(ctx.timeout(() => b.reveal(650 + i * 70), 120 + i * 170)));
      };
      ctx.interval(() => {
        const done = bs.filter((b) => !b.running).length;
        put(nr, String(done));
        const all = done === bs.length;
        root.classList.toggle("ok", all);
        put(st, all ? "已解密" : decoding ? "解碼中" : "打亂中");

      let mode = 0, insts = [], ticks = 0, lastTicks = 0, lastT = performance.now(), onceMs = 0;
      const stopAll = () => { insts.forEach((b) => b.stop()); insts = []; };
      ctx.onCleanup(stopAll);
      // Wrap once() on the instance: start()'s interval calls this.once(), so every tick is counted.
      const counted = (b) => {
        const once = b.once;
        b.once = function () { ticks++; return once.call(this); };
        return b;
      };
      const apply = (n) => {
        stopAll();
        box.style.setProperty("--fs", `${n <= 400 ? 14 : n <= 1600 ? 11 : n <= 6400 ? 8 : 6}px`);
        box.innerHTML = Array.from({ length: n }, () => `<span>${hexId()}</span>`).join(" ");
        insts = mode === 0 ? [counted(baffle(box.children, OPT8))] : [...box.children].map((el) => counted(baffle(el, OPT8)));
        const t0 = performance.now();
        insts.forEach((b) => b.once());
        onceMs = performance.now() - t0;
        insts.forEach((b) => b.start());
        ticks = 0; lastTicks = 0; lastT = performance.now();
      };
      ctx.group(["1 個實例", "每元素 1 個實例"], 0, (i) => { mode = i; lab.set(lab.value); });
      ctx.controls.classList.add("bottom");
      const lab = ctx.ramp({
        // Capped at 6,400: with 12,800 per-element intervals Chromium stopped running every page
        // timer (the ramp's own sleeps included), so the ramp would never finish that step.
        label: "打亂元素", unit: "個", steps: [100, 200, 400, 800, 1600, 3200, 4800, 6400],
        minFps: 30,
        apply,
        metrics: () => {
          const now = performance.now();
          const rate = (ticks - lastTicks) / ((now - lastT) / 1000) / Math.max(1, insts.length);
          lastTicks = ticks; lastT = now;
          return { "一輪寫入": `${onceMs.toFixed(1)} ms`, "每實例 tick/秒": rate.toFixed(1), "計時器": nf.format(insts.length) };
        },
        note: "每個元素是 7 字的十六進位 ID，speed 50 ms，理論上每個實例每秒 20 tick。tick/秒 掉下來代表 setInterval 排不上主執行緒；一輪寫入是全部元素各 once() 一次的耗時。每元素 1 個實例在 Chromium 實測到 1.3 萬個時，頁面所有計時器都停擺，所以只測到 6,400 個。",
      });
    },
  },
] });
</script>
</body>
</html>
