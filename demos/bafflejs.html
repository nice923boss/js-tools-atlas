<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>baffle.js 示範：機密檔案解碼</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: repeating-linear-gradient(0deg, rgba(123,211,137,.035) 0 2px, transparent 2px 4px), radial-gradient(70% 70% at 50% 40%, #12201a, var(--bg) 75%); }
  .wrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 64px 16px 50px; }
  .file { position: relative; width: min(100%, 640px); padding: clamp(18px, 4vw, 30px); border-radius: 14px; background: rgba(10,14,12,.85);
    border: 1px solid rgba(123,211,137,.28); box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 30px 70px rgba(0,0,0,.55); }
  .file .no { font: 700 12px var(--mono); letter-spacing: .14em; color: var(--c4); }
  .file h1 { margin: 6px 0 14px; font-size: clamp(34px, 8vw, 64px); line-height: 1.1; font-weight: 900; color: #e9ffe9; }
  .row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px dashed rgba(123,211,137,.2); cursor: default; }
  .row b { flex: 0 0 auto; font: 700 12px/1.9 var(--mono); color: var(--c4); width: 3.4em; }
  .row span { flex: 1; font-size: clamp(14px, 2.2vw, 17px); line-height: 1.7; color: #cfe9d2; }
  .row:hover span { color: #fff; }
  .stamp { position: absolute; right: clamp(12px, 4vw, 28px); top: clamp(14px, 3vw, 22px); padding: 6px 12px; border: 3px solid var(--c3); border-radius: 8px;
    color: var(--c3); font: 900 clamp(14px, 2.6vw, 20px)/1 var(--font); letter-spacing: .2em; transform: rotate(-10deg) scale(1.6); opacity: 0;
    transition: opacity .25s, transform .35s cubic-bezier(.2,1.6,.4,1); }
  .stamp.on { opacity: .9; transform: rotate(-10deg) scale(1); }
  .panel.ctl { position: fixed; right: 12px; top: 12px; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; max-width: calc(100% - 24px); }
  .ctl .btn { padding: 6px 10px; font-size: 12px; }
  .ctl .sep { width: 1px; height: 20px; background: var(--line); }
  @media (max-width: 560px) { .wrap { padding-top: 100px; } .ctl .sep { display: none; } }
</style>
</head>
<body>
<div class="panel ctl" id="ctl">
  <button class="btn primary" id="reveal">解碼</button>
  <button class="btn" id="scramble">全部打亂</button>
  <span class="sep"></span>
  <button class="btn" data-set="han" aria-pressed="true">中文</button>
  <button class="btn" data-set="block">方塊</button>
  <button class="btn" data-set="sym">符號</button>
</div>

<div class="wrap">
  <article class="file">
    <div class="no b">CASE FILE #0921</div>
    <h1 class="b">夜鷹計畫</h1>
    <div class="row"><b>代號</b><span class="b">NIGHTHAWK-07，三人小組</span></div>
    <div class="row"><b>地點</b><span class="b">台北市信義區，某棟大樓的頂樓</span></div>
    <div class="row"><b>時間</b><span class="b">十月三日，二十三點五十九分</span></div>
    <div class="row"><b>備註</b><span class="b">每一行都先被打亂，再一個字一個字還原成原文。</span></div>
    <div class="stamp" id="stamp">已解密</div>
  </article>
</div>
<div class="hint">游標移到任一行會重新打亂，按「解碼」還原全部</div>

<script src="https://cdn.jsdelivr.net/npm/baffle@0.3.6/dist/baffle.min.js"></script>
<script>
const SETS = {
  han: "密碼解譯資料檔案代號機要保護隱藏訊號頻率加鎖封存情報行動目標座標",
  block: "█▓▒░▚▞▙▟▛▜■□",
  sym: "!<>-_\\/[]{}=+*^?#%&@",
};
// Punctuation stays put so each line keeps its shape while scrambled
const EXCLUDE = [" ", "，", "。", "-", "#"];
const els = [...document.querySelectorAll(".b")];
const lines = els.map((el) => baffle(el, { characters: SETS.han, exclude: EXCLUDE, speed: 60 }));
const stamp = document.getElementById("stamp");

let doneTimer = null;
function revealAll() {
  stamp.classList.remove("on");
  lines.forEach((b, i) => { b.start(); b.reveal(1300 + i * 250, 250 + i * 300); });
  clearTimeout(doneTimer);
  doneTimer = setTimeout(() => stamp.classList.add("on"), 250 + (lines.length - 1) * 300 + 1300 + (lines.length - 1) * 250 + 200);
}
function scrambleAll() {
  clearTimeout(doneTimer);
  stamp.classList.remove("on");
  lines.forEach((b) => b.start());
}

document.getElementById("reveal").addEventListener("click", revealAll);
document.getElementById("scramble").addEventListener("click", scrambleAll);
document.getElementById("ctl").addEventListener("click", (e) => {
  const b = e.target.closest("[data-set]");
  if (!b) return;
  document.querySelectorAll("[data-set]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  lines.forEach((l) => l.set({ characters: SETS[b.dataset.set] }));
  revealAll();
});
// Hover a line: scramble just that line, then decode it again
document.querySelectorAll(".row, .file h1").forEach((row) => {
  const idx = els.indexOf(row.classList.contains("b") ? row : row.querySelector(".b"));
  row.addEventListener("mouseenter", () => { lines[idx].start(); lines[idx].reveal(900, 150); });
});

revealAll();
</script>
</body>
</html>
