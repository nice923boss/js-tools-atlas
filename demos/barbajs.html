<style>
  .pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Shell: a small site (nav bar + viewport) beside an explanation panel; .lay is the Barba wrapper. */
  .lay { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 10px; }
  .site { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-2); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
  .bar nav { display: flex; gap: 2px; flex: none; }
  .bar nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 8px; }
  .bar nav a:hover { color: var(--fg); }
  .bar nav a.on { color: var(--fg); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .addr { margin-left: auto; min-width: 0; font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vp { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .vp > main { position: absolute; inset: 8px; display: grid; gap: 8px; min-height: 0; }

  /* Route pages (fetched from assets/barbajs/) */
  .vp .ph { background-color: #1d2230; background-position: center; background-size: cover; background-repeat: no-repeat; }
  .vp .home { grid-template-columns: 2fr 1fr; }
  .vp .hero { position: relative; border-radius: 12px; overflow: hidden; display: flex; align-items: flex-end; min-height: 0; }
  .vp .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(0, 0, 0, .72)); }
  .vp .hero div { position: relative; z-index: 1; padding: 14px 16px; color: #fff; }
  .vp .hero small { color: #f7df1e; font-weight: 700; letter-spacing: .1em; font-size: 12px; }
  .vp .hero h2 { margin: 2px 0 4px; font-size: clamp(18px, 3vw, 28px); line-height: 1.2; }
  .vp .hero p { margin: 0; color: #d9d7cf; font-size: 12px; }
  .vp .cards { display: grid; gap: 8px; grid-template-rows: repeat(3, minmax(0, 1fr)); min-height: 0; }
  .vp .card { position: relative; border-radius: 12px; overflow: hidden; color: #fff; text-decoration: none; display: flex; align-items: flex-end; min-height: 0; }
  .vp .card span { margin: 8px; padding: 4px 10px; border-radius: 999px; background: rgba(14, 16, 19, .78); font-weight: 700; font-size: 12px; }
  .vp .gallery, .vp .toc { grid-template-rows: auto minmax(0, 1fr); }
  .vp .pg header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .vp .pg h2 { margin: 0; font-size: 18px; }
  .vp .pg header p { margin: 0; color: var(--muted); font-size: 12px; }
  .vp .pg header a { margin-left: auto; color: var(--fg); font-size: 12px; text-decoration: none; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .vp .grid { display: grid; gap: 8px; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); min-height: 0; }
  .vp .grid figure, .vp .stop figure { margin: 0; position: relative; border-radius: 10px; overflow: hidden; min-height: 0; }
  .vp figcaption { position: absolute; left: 8px; bottom: 8px; padding: 3px 9px; border-radius: 999px; background: rgba(14, 16, 19, .78); color: #fff; font-size: 12px; }
  .vp .list { position: relative; list-style: none; margin: 0; padding: 0 4px 0 0; overflow: auto; display: grid; gap: 6px; align-content: start; min-height: 0; }
  .vp .list a { display: grid; grid-template-columns: 88px auto 1fr; align-items: center; gap: 10px; padding: 5px; border-radius: 10px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 13px; }
  .vp .list a:hover { background: var(--panel); }
  .vp .list .ph { width: 88px; height: 52px; border-radius: 7px; }
  .vp .list small { color: var(--muted); font-size: 12px; }
  .vp .stop { grid-template-rows: minmax(0, 1fr) auto; }
  .vp .stop figcaption { display: flex; gap: 8px; align-items: baseline; padding: 5px 12px; }
  .vp .stop figcaption small { color: #f7df1e; font-size: 11px; font-weight: 700; }
  .vp .stopnav { display: flex; gap: 8px; justify-content: space-between; }
  .vp .stopnav a { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 12px; }
  .vp .stopnav a:last-child { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  /* Side panel */
  .side { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-size: 12px; overflow: hidden; }
  .sh { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; flex: none; }
  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; min-height: 0; overflow: hidden; }
  .log li { display: flex; align-items: baseline; gap: 6px; padding: 2px 7px; border-left: 3px solid var(--line); border-radius: 3px; background: var(--bg-2); white-space: nowrap; overflow: hidden; flex: none; }
  .log li code { font: 12px var(--mono); }
  .log li .ms { margin-left: auto; color: var(--muted); font: 11px var(--mono); }
  .log li.on { border-color: var(--c6); }
  .log li.lv { border-color: var(--c5); }
  .log li.en { border-color: var(--c2); }
  .route { color: var(--muted); line-height: 1.5; }
  .route b { color: var(--fg); }

  /* 1. curtain */
  .curtain { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; background: var(--cc, #f7df1e); color: #14140f; clip-path: inset(0 0 0 100%); pointer-events: none; }
  .curtain b { display: block; text-align: center; font-size: clamp(26px, 6vw, 56px); font-weight: 900; letter-spacing: .08em; }
  .curtain small { display: block; text-align: center; font: 600 12px var(--mono); opacity: .7; }
  .persist { position: absolute; right: 10px; bottom: 10px; z-index: 6; display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(14, 16, 19, .82); color: #fff; font-size: 12px; pointer-events: none; }
  .persist i { width: 8px; height: 8px; border-radius: 50%; background: #7bd389; animation: beat 1s infinite; }
  @keyframes beat { 50% { opacity: .25; } }

  /* 2. rules */
  .rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; flex: none; }
  .rules li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); transition: background .2s, border-color .2s; }
  .rules li code { font: 600 12px var(--mono); }
  .rules li span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rules li em { font: 11px var(--mono); font-style: normal; color: var(--muted); }
  .rules li.hit { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }

  /* 3. sync */
  .gantt { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .gantt .tr { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .gantt .tk { position: relative; height: 14px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .gantt .tk i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 4px; transition: left .3s, width .3s; }
  .gantt .r i { background: var(--c6); }
  .gantt .l i { background: var(--c5); }
  .gantt .e i { background: var(--c2); }
  .gantt .ax { display: flex; justify-content: space-between; margin-left: 46px; font: 10px var(--mono); color: var(--muted); }
  .total { font-size: 12px; flex: none; }
  .total b { font: 700 16px var(--mono); }

  /* 4. views */
  .views { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; flex: none; }
  .views li { display: grid; grid-template-columns: 10px auto minmax(0, 1fr); gap: 6px; align-items: center; padding: 4px 7px; border-radius: 8px; border: 1px solid var(--line); }
  .views li i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  .views li.on i { background: var(--c4); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c4) 30%, transparent); }
  .views li code { font: 600 12px var(--mono); }
  .views li span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live b { font: 700 14px var(--mono); }
  .badge { position: absolute; right: 10px; bottom: 10px; z-index: 3; padding: 5px 11px; border-radius: 999px; background: rgba(14, 16, 19, .82); color: #fff; font-size: 12px; pointer-events: none; }
  .badge b { font-family: var(--mono); color: #f7df1e; }
  .b4 .vp > main { overflow: hidden; }
  .b4 [data-barba-namespace="landscape"] figure { transition: opacity .3s, transform .3s; opacity: .4; }
  .b4 [data-barba-namespace="landscape"] figure.hl { opacity: 1; transform: scale(1.02); }
  .bubble { position: absolute; bottom: -24px; z-index: 2; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .8); background: rgba(76, 201, 240, .25); pointer-events: none; }

  /* 5. @barba/css: the transition name becomes the class prefix */
  .csrc { margin: 0; padding: 8px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font: 11px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden; color: var(--fg); flex: none; }
  .b5 .barba-once-active { transition: opacity .7s, transform .7s; }
  .b5 .barba-once { opacity: 0; transform: translateY(18px); }
  .b5 .fade-leave-active, .b5 .fade-enter-active { transition: opacity .45s; }
  .b5 .fade-leave-to, .b5 .fade-enter { opacity: 0; }
  .b5 .slide-leave-active, .b5 .slide-enter-active { transition: transform .5s cubic-bezier(.7, 0, .3, 1), opacity .5s; }
  .b5 .slide-leave-to { transform: translateX(-30%); opacity: 0; }
  .b5 .slide-enter { transform: translateX(30%); opacity: 0; }
  .b5 .zoom-leave-active, .b5 .zoom-enter-active { transition: transform .45s, opacity .45s; }
  .b5 .zoom-leave-to { transform: scale(1.1); opacity: 0; }
  .b5 .zoom-enter { transform: scale(.9); opacity: 0; }
  .b5 .log li b { font: 700 12px var(--mono); width: 8px; }

  /* 6. prefetch and cache */
  .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; flex: none; }
  .cell { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); font-size: 11px; line-height: 1.35; min-width: 0; }
  .cell b { display: block; font-weight: 600; white-space: nowrap; }
  .cell span { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cell[data-s="fulfilled"] { border-color: var(--c4); }
  .cell[data-s="fulfilled"][data-a="prefetch"], .cell[data-s="fulfilled"][data-a="enter"] { background: color-mix(in srgb, var(--c2) 14%, transparent); }
  .cell.cur { box-shadow: inset 0 0 0 2px var(--accent); }
  .totals { display: flex; gap: 10px; flex-wrap: wrap; flex: none; }
  .totals b { font: 700 14px var(--mono); }
  .pnote { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .srow { display: flex; gap: 6px; flex-wrap: wrap; flex: none; }
  .srow .btn { font-size: 12px; padding: 5px 9px; }

  /* 7. prevent */
  .pstatus { line-height: 1.5; min-height: 3em; flex: none; }
  .pstatus b { color: var(--fg); }
  .plinks { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .plinks a { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 12px; min-width: 0; }
  .plinks a:hover { background: var(--bg-2); }
  .plinks a i { font: 600 11px var(--mono); font-style: normal; color: var(--muted); }
  .plinks a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .plinks a code { font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .plinks a em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .plinks a[data-state="taken"] { border-color: var(--c4); }
  .plinks a[data-state="taken"] em { color: var(--c4); }
  .plinks a[data-state="passed"] { border-color: var(--c5); }
  .plinks a[data-state="passed"] em { color: var(--c5); }
  .plinks a[data-state="error"] { border-color: var(--c3); }
  .plinks a[data-state="error"] em { color: var(--c3); }
  .pall { display: flex; flex-direction: column; padding: 3px; border-radius: 9px; border: 1px dashed var(--muted); }

  /* 8. stress */
  .stress-vis { position: absolute; inset: 8px 8px 8px 350px; display: flex; flex-direction: column; gap: 8px; padding-bottom: var(--sc-ctl-b, 0px); overflow: hidden; }
  .stress-vis .sinfo { font-size: 12px; color: var(--muted); }
  .bwrap { position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); overflow: hidden; }
  .bwrap .vp { position: absolute; inset: 0; }
  .vp > main.bench { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px; overflow: hidden; }
  .bench i { width: 6px; height: 6px; border-radius: 1px; background: var(--c2); }
  .bench.b i { background: var(--c4); }

  @media (max-width: 760px) {
    .lay { grid-template-columns: minmax(0, 1fr) 168px; }
    .side { font-size: 11px; padding: 8px; gap: 6px; }
    .log li { padding: 1px 6px; }
    .log li code { font-size: 11px; }
    .csrc { font-size: 10px; }
    .b5 .log li .ms, .b6 .pnote { display: none; }
    .pstatus { min-height: 0; }
    .plinks { gap: 3px; }
    .plinks a { padding: 2px 6px; font-size: 11px; }
    .pall { padding: 2px; }
    .stress-vis { inset: 8px; }
  }
  @media (max-width: 520px) {
    .lay { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
    .side { max-height: 112px; }
    .b6 .side { max-height: 172px; }
    .b7 .side { max-height: 168px; }
    .sh, .addr, .csrc, .pnote, .b2 .log, .b3 .log, .b4 .log { display: none; }
    .bar nav a { padding: 5px 7px; }
    .log { flex-direction: row; flex-wrap: wrap; }
    .log li .ms { display: none; }
    .rules, .views { flex-direction: row; flex-wrap: wrap; }
    .rules li, .views li { display: flex; padding: 3px 7px; }
    .rules li span, .views li span { display: none; }
    .plinks { display: grid; grid-template-columns: 1fr 1fr; }
    .pall { display: contents; }
    .plinks a em { display: none; }
    .pstatus { min-height: 0; }
    .vp .home { grid-template-columns: 1fr; grid-template-rows: 1.4fr 1fr; }
    .vp .cards { grid-template-rows: none; grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .vp .hero p, .vp .pg header p { display: none; }
    .vp .grid { grid-auto-flow: row; grid-template-columns: 1fr 1fr; grid-auto-rows: minmax(0, 1fr); }
    .vp .grid figure:last-child:nth-child(odd) { grid-column: span 2; }
    .vp .list a { grid-template-columns: 64px auto 1fr; }
    .vp .list .ph { width: 64px; height: 40px; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@barba/css@2.1.16/dist/barba-css.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@barba/prefetch@2.2.0/dist/barba-prefetch.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Barba.js 2: every scene mounts a small site whose [data-barba="wrapper"] lives inside the stage.
// Route pages are real same-origin files in assets/barbajs/ fetched by Barba. Every visit uses
// history "replace", and the after hook puts the showcase URL (#scene) and title back.
const { fmt, fmtMs, h } = Showcase;
const BASE = location.href.split("#")[0], TITLE = document.title, ROOT = new URL(".", BASE).href;
const DIR = new URL("assets/barbajs/", BASE).href, R = (n) => `${DIR}${n}.html`;
const IMG = (n) => new URL(`_shared/img/photo-${n}.jpg`, BASE).href;
const NAMES = { home: "首頁", landscape: "山岳", animals: "動物", ocean: "海洋", toc: "目錄" };
const ORDER = ["home", "landscape", "animals", "ocean"];
const COLORS = { home: "#f7df1e", landscape: "#7bd389", animals: "#ff8c42", ocean: "#4cc9f0" };
const E1 = "cubic-bezier(.7,0,.3,1)", E2 = "cubic-bezier(.2,.8,.2,1)";
// Passed as trigger to barba.go() so programmatic visits also replace the history entry.
const REPL = h("a", { "data-barba-history": "replace" });
const nsOf = (href) => String(href || "").split(/[?#]/)[0].split("/").pop().replace(/\.html$/, "");
const nameOf = (href) => { const ns = nsOf(href), m = /^stop-(\d+)$/.exec(ns); return m ? `第 ${m[1]} 站` : NAMES[ns] || ns; };
const nextOf = (href) => R(ORDER[(ORDER.indexOf(nsOf(href)) + 1) % ORDER.length]);
// A promise that never settles: parks a Barba chain whose scene is gone.
const halt = () => new Promise(() => {});
const idle = (s) => !s.busy && !(barba.transitions && barba.transitions.isRunning);
const dir = (d) => Math.sign(ORDER.indexOf(nsOf(d.next.url.href)) - ORDER.indexOf(d.current.namespace)) || 1;

// Route pages reference their photos through class names ph1..ph8.
document.head.append(h("style", { text: [1, 2, 3, 4, 5, 6, 7, 8].map((n) => `.ph${n}{background-image:url("${IMG(n)}")}`).join("") }));
[1, 2, 3, 4, 5, 6, 7, 8].forEach((n) => { new Image().src = IMG(n); });

const pages = new Map();
function pageHtml(name) {
  if (!pages.has(name)) {
    const p = fetch(R(name)).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status} ${R(name)}`); return r.text(); });
    p.catch(() => pages.delete(name));
    pages.set(name, p);
  }
  return pages.get(name);
}
// Relative links in fetched pages must keep pointing into assets/barbajs/ after the URL is restored.
function absolutize(root, base) {
  root.querySelectorAll("a[href]").forEach((a) => a.setAttribute("href", new URL(a.getAttribute("href"), base).href));
}
// Put the first route page into the viewport ourselves; Barba takes over from there.
async function firstPage(s, name) {
  const html = await pageHtml(name);
  if (!s.ctx.active) throw new DOMException("Scene unmounted", "AbortError");
  const doc = new DOMParser().parseFromString(html, "text/html");
  const main = document.importNode(doc.querySelector('[data-barba="container"]'), true);
  absolutize(main, R(name));
  s.vp.querySelectorAll('[data-barba="container"]').forEach((c) => c.remove());
  s.vp.prepend(main);
  s.cur = R(name);
  mark(s, s.cur);
  return main;
}
function restore(id) {
  const want = `${BASE}#${id}`;
  if (location.href !== want) { try { history.replaceState(null, "", want); } catch { /* sandboxed */ } }
  document.title = TITLE;
}
function mark(s, href) {
  const ns = nsOf(href), key = /^stop-/.test(ns) ? "toc" : ns;
  s.nav.forEach((a) => a.classList.toggle("on", a.dataset.ns === key));
  if (s.addr) s.addr.textContent = String(href).replace(ROOT, "");
}
async function play(ctx, el, frames, opts, keep = false) {
  const a = el.animate(frames, { fill: "forwards", ...opts });
  await a.finished.catch(() => {});
  if (!ctx.active) return halt();
  if (keep && a.playState === "finished") { try { a.commitStyles(); } catch { /* detached */ } }
  a.cancel();
}
const clickLink = (a) => a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, button: 0, view: window }));
// Prefer clicking a real link so Barba sees a trigger element, like a user click.
function goTo(s, href) {
  if (href === s.cur || !idle(s)) return false;
  const a = [...s.vp.querySelectorAll("a"), ...s.nav].find((x) => x.href === href);
  if (a) clickLink(a); else barba.go(href, REPL);
  return true;
}
const fadeT = (ctx, ms) => ({
  name: "fade",
  leave: ({ current }) => play(ctx, current.container, [{ opacity: 1 }, { opacity: 0 }], { duration: ms }, true),
  enter: ({ next }) => play(ctx, next.container, [{ opacity: 0 }, { opacity: 1 }], { duration: ms }),
});
function whenIdle(s, fn) { if (idle(s)) fn(); else s.ctx.timeout(() => whenIdle(s, fn), 60); }
// Stop a transition chain as soon as its scene is unmounted.
const STEPS = ["once", "before", "beforeLeave", "leave", "afterLeave", "beforeEnter", "enter", "afterEnter", "after"];
function guard(ctx, t) {
  const g = { ...t };
  STEPS.forEach((k) => {
    const fn = t[k];
    if (typeof fn !== "function") return;
    g[k] = async function (d) {
      if (!ctx.active) return halt();
      const r = await fn.call(this, d);
      if (!ctx.active) return halt();
      return r;
    };

      const s = site(ctx, { cls: "b5", side: `<div class="sh">目前轉場的 CSS</div><pre class="csrc"></pre><div class="sh">容器 class 變化</div><ol class="log"></ol>` });
      const SRC = {
        fade: ".fade-leave-active,\n.fade-enter-active {\n  transition: opacity .45s;\n}\n.fade-leave-to,\n.fade-enter {\n  opacity: 0;\n}",
        slide: ".slide-leave-active,\n.slide-enter-active {\n  transition: transform .5s,\n              opacity .5s;\n}\n.slide-leave-to {\n  transform: translateX(-30%);\n  opacity: 0;\n}\n.slide-enter {\n  transform: translateX(30%);\n  opacity: 0;\n}",
        zoom: ".zoom-leave-active,\n.zoom-enter-active {\n  transition: transform .45s,\n              opacity .45s;\n}\n.zoom-leave-to {\n  transform: scale(1.1);\n  opacity: 0;\n}\n.zoom-enter {\n  transform: scale(.9);\n  opacity: 0;\n}",
      };
      const NAMES3 = ["fade", "slide", "zoom"];
      const src = ctx.$(".csrc"), log = ctx.$(".log");
      let mode = "fade", t0 = performance.now();
      const showSrc = () => { src.textContent = SRC[mode]; };
      showSrc();
      // Diff the class list of each container per mutation batch and log what was added or removed.
      const RX = /^(?!barba-enter)\w+-(once|leave|enter)(-active|-to)?$/;
      const mo = new MutationObserver((recs) => {
        const first = new Map();
        recs.forEach((r) => { if (r.target.matches('[data-barba="container"]') && !first.has(r.target)) first.set(r.target, r.oldValue || ""); });
        const ms = `+${Math.round(performance.now() - t0)} ms`;
        first.forEach((old, el) => {
          const a = new Set(old.split(/\s+/).filter((c) => RX.test(c))), b = new Set([...el.classList].filter((c) => RX.test(c)));
          b.forEach((c) => { if (!a.has(c)) logRow(log, [h("b", { text: "+" }), h("code", { text: c }), h("span", { class: "ms", text: ms })], "en", 14); });
          a.forEach((c) => { if (!b.has(c)) logRow(log, [h("b", { text: "-" }), h("code", { text: c }), h("span", { class: "ms", text: ms })], "lv", 14); });
        });
      });
      mo.observe(s.vp, { attributes: true, attributeFilter: ["class"], attributeOldValue: true, subtree: true });
      ctx.onCleanup(() => mo.disconnect());
      const hooks = () => {
        barbaCss.prefix = "barba";
        // The once flow also adds barba-enter through the enter hooks; drop the leftover.
        barba.hooks.afterOnce((d) => { if (d && d.next && d.next.container) d.next.container.classList.remove("barba-enter"); });
        barba.hooks.before((d) => { if (s.own(d)) { log.innerHTML = ""; t0 = performance.now(); } });
      };
      // @barba/css replaces leave/enter, but Barba only keeps page transitions that define them.
      const transitions = NAMES3.map((name) => ({ name, custom: () => mode === name, leave() {}, enter() {} }));
      const seg = ctx.group(NAMES3, 0, (i, l) => { mode = l; showSrc(); });
      let n = 0;
      tour(s, 2600, () => {
        if (n++ % 2 === 1) seg.children[(NAMES3.indexOf(mode) + 1) % 3].click();
        goTo(s, nextOf(s.cur));
      });
      open(s, "home", { hooks, plugins: [[barbaCss]], transitions });
    },
  },
  {
    id: "prefetch", title: "預取與快取",
    api: "barba.use(barbaPrefetch, { root, timeout })，barba.prefetch(url)，barba.cache.get(url)，cacheIgnore，prefetchIgnore",
    desc: "@barba/prefetch 用 IntersectionObserver 在連結進入可視範圍時先下載，核心本身則在滑鼠移到連結上時預取。每頁只下載一次，之後換頁直接讀快取。九宮格是 barba.cache 的即時內容：怎麼進快取、目前狀態、被請求幾次。",
    hint: "捲動目錄清單，進入可視範圍的頁面會被預取；改成「只有 hover」或關掉快取再比較請求次數",
    mount(ctx) {
      const s = site(ctx, {
        cls: "b6", nav: ["toc"],
        side: `<div class="sh">barba.cache 內容</div><div class="cells"></div><div class="totals"></div>
          <div class="pnote"></div><div class="srow"><button class="btn" type="button" data-k="clear">清空快取</button><button class="btn" type="button" data-k="all">barba.prefetch 全部</button></div>`,
      });
      const URLS = [R("toc"), ...[1, 2, 3, 4, 5, 6, 7, 8].map((i) => R(`stop-${i}`))];
      const ACT = { init: "初始頁", click: "點擊時下載", enter: "hover 預取", prefetch: "預取" };
      const ST = { pending: "下載中", fulfilled: "已快取", rejected: "失敗" };
      const NOTE = {
        plugin: "外掛：連結捲進可視範圍，瀏覽器空閒時就下載；滑鼠移上去也會預取。",
        hover: "只有核心：滑鼠移到連結上才下載。",
        off: "prefetchIgnore：點擊後才下載，下載過的頁面仍會快取。",
        ignore: "cacheIgnore：不寫入快取，每次換頁都重新下載，也無法預取。",
      };
      const counts = new Map();
      let how = "plugin", ignore = false, hits = 0, reqs = 0;
      const req0 = barba.request;
      barba.request = function (url, ...rest) { counts.set(url, (counts.get(url) || 0) + 1); reqs++; return req0.call(this, url, ...rest); };
      ctx.onCleanup(() => { barba.request = req0; });
      const grid = ctx.$(".cells"), totals = ctx.$(".totals"), pnote = ctx.$(".pnote"), allBtn = ctx.$('[data-k="all"]');
      const cells = URLS.map((u) => { const c = h("div", { class: "cell" }, h("b", { text: nameOf(u) }), h("span")); grid.append(c); return c; });
      const paint = () => {
        URLS.forEach((u, i) => {
          const c = cells[i], e = !ignore && barba.cache ? barba.cache.get(u) : null, n = counts.get(u) || 0;
          c.dataset.a = e ? e.action : ""; c.dataset.s = e ? e.status : "";
          c.classList.toggle("cur", u === s.cur);
          c.lastChild.textContent = `${e ? `${ACT[e.action] || e.action}・${ST[e.status] || e.status}` : ignore ? "不快取" : "未請求"}${n ? ` ×${n}` : ""}`;
        });
        totals.innerHTML = `<span>換頁 <b>${s.visits}</b></span><span>命中快取 <b>${hits}</b></span><span>請求 <b>${reqs}</b></span>`;
        pnote.textContent = ignore ? NOTE.ignore : NOTE[how];
        allBtn.disabled = ignore;
      };
      ctx.interval(paint, 250);
      ctx.on(s.wrap, "click", (e) => {
        const a = e.target.closest("a");
        if (!a || !idle(s) || a.href === s.cur || ignore || !barba.cache) return;
        const hit = barba.cache.get(a.href);
        if (hit && hit.status === "fulfilled") hits++;
      }, true);
      const start = () => {
        counts.clear(); hits = 0; reqs = 0; s.visits = 0;
        boot(s, {
          prefetchIgnore: how === "off", cacheIgnore: ignore,
          plugins: how === "plugin" && !ignore ? [[barbaPrefetch, { root: s.vp, timeout: 1000 }]] : [],
          transitions: [fadeT(ctx, 300)],
        });
        URLS.forEach((u) => barba.cache.delete(u));
        paint();
      };
      ctx.$('[data-k="clear"]').addEventListener("click", () => {
        URLS.forEach((u) => barba.cache.delete(u));
        // Prefetched links were unobserved; observe() queues the current page's links again.
        if (how === "plugin" && !ignore) { try { barbaPrefetch.observe(); } catch { /* not installed */ } }
        paint();
      });
      allBtn.addEventListener("click", () => { URLS.forEach((u) => barba.prefetch(u)); paint(); });
      let k = 0;
      const isOn = tour(s, 2200, () => {
        const list = s.vp.querySelector(".list");
        if (!list) { const back = s.vp.querySelector(".stopnav a"); if (back) clickLink(back); return; }
        const a = list.querySelectorAll("a")[k++ % 8];
        list.scrollTo({ top: a.parentElement.offsetTop - 4, behavior: "smooth" });
        ctx.timeout(() => a.dispatchEvent(new MouseEvent("mouseover", { bubbles: true, view: window })), 350);
        ctx.timeout(() => { if (isOn() && idle(s) && a.isConnected) clickLink(a); }, 900);
      });
      ctx.select("預取方式", [{ value: "plugin", label: "外掛預取" }, { value: "hover", label: "只有 hover" }, { value: "off", label: "關閉預取" }], "plugin",
        (v) => { how = v; whenIdle(s, start); });
      ctx.toggle("cacheIgnore", false, (v) => { ignore = v; whenIdle(s, start); });
      s.busy = true;
      firstPage(s, "toc").then(start);
    },
  },
  {
    id: "prevent", title: "攔截與錯誤",
    api: "data-barba-prevent=\"self\" | \"all\"，prevent: ({ el, href }) => bool，requestError: (trigger, action, url, response) => false",
    desc: "不是每個連結都該交給 Barba：新分頁、下載、外部網域與標了 data-barba-prevent 的連結會放行給瀏覽器，也能用 prevent 函式自訂規則。請求失敗時 requestError 回傳 false，就不會整頁跳轉，由頁面自己顯示錯誤。",
    hint: "逐一點右側連結，看哪些由 Barba 接手、哪些放行；最後一個 404 會觸發 requestError",
    mount(ctx) {
      const s = site(ctx, { cls: "b7", nav: ["home", "landscape"], side: `<div class="pstatus">點右側連結試試</div><div class="plinks"></div>` });
      const plinks = ctx.$(".plinks"), status = ctx.$(".pstatus");
      const L = [
        ["站內連結", R("landscape"), {}],
        ["data-barba-prevent=\"self\"", R("animals"), { "data-barba-prevent": "self" }, true],
        ["外層 prevent=\"all\"", R("ocean"), {}, true, "all"],
        ["target=\"_blank\"", R("home"), { target: "_blank" }, true],
        ["download", IMG(1), { download: true }, true],
        ["外部網域", "https://example.com/", {}],
        [".pdf 自訂規則", `${DIR}guide.pdf`, {}],
        ["404 頁面", R("missing"), {}],
      ];
      const links = L.map(([label, href, attrs, code, all], i) => {
        const a = h("a", { href, "data-barba-history": "replace", ...attrs }, h("i", { text: i + 1 }), h(code ? "code" : "span", { text: label }), h("em", { text: "未點" }));
        plinks.append(all ? h("div", { class: "pall", "data-barba-prevent": "all" }, a) : a);
        return a;
      });
      const WHY = { exists: "沒有 href", newTab: "按著修飾鍵開新分頁", blank: "target=\"_blank\"", corsDomain: "外部網域",
        download: "有 download 屬性", preventSelf: "data-barba-prevent=\"self\"", preventAll: "上層有 data-barba-prevent=\"all\"", pushState: "瀏覽器不支援 pushState" };
      let lastErr = "";
      const setRow = (a, state, text) => { if (!links.includes(a)) return; a.dataset.state = state; a.querySelector("em").textContent = text; };
      // Ask Barba's own prevent suite which rule (if any) lets the browser handle this click.
      ctx.on(s.wrap, "click", (e) => {
        const a = e.target.closest("a");
        if (!a) return;
        let why = "";
        if (!idle(s)) why = "轉場進行中";
        else {
          const rule = barba.prevent.suite.find((n) => barba.prevent.run(n, a, e, barba.dom.getHref(a)));
          if (rule === "preventCustom") why = a.href === s.cur ? "已經在這一頁" : "自訂 prevent 規則：.pdf";
          else if (rule) why = WHY[rule] || rule;
        }
        if (why) {
          setRow(a, "passed", "放行");
          status.replaceChildren("放行給瀏覽器：", h("b", { text: why }), "（示範中已擋下實際跳轉）");
        } else {
          setRow(a, "taken", "Barba 接手");
          status.replaceChildren("Barba 接手：", h("b", { text: nameOf(a.href) }), "，用 XHR 下載後只換容器");
        }
      }, true);
      s.onError = (d) => {
        const a = links.find((x) => x.href === d.next.url.href) || links[7];
        setRow(a, "error", `失敗 ${lastErr}`);
        status.replaceChildren("requestError：", h("b", { text: lastErr }), "，回傳 false 所以不整頁跳轉，留在原頁");
      };
      const cfg = {
        prefetchIgnore: true, transitions: [fadeT(ctx, 300)],
        prevent: ({ href }) => /\.pdf$/.test(href),
        requestError: (trigger, action, url, res) => { lastErr = res && res.status ? `HTTP ${res.status}` : "網路錯誤"; return false; },
      };
      let k = 0;
      tour(s, 1600, () => {
        const i = k++ % 8;
        clickLink(i < 7 ? links[i] : s.nav[0]);
      });
      open(s, "home", cfg);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "barba.cache.set(url, request)，await barba.go(url)",
    desc: "容器裡的節點越多，Barba 每次換頁要解析的 HTML、要替換與排版的 DOM 就越大。這裡把兩個大頁面事先放進快取，連續來回換頁，量平均每次換頁的耗時。",
    hint: "按「開始測試」；下方可切換每級換頁次數",
    mount(ctx) {
      ctx.html(`<div class="stress-vis"><div class="sinfo">目前：容器內 600 個節點</div>
        <div class="bwrap" data-barba="wrapper"><div class="vp"><main class="bench a" data-barba="container" data-barba-namespace="bench-a">${"<i></i>".repeat(600)}</main></div></div></div>`);
      const info = ctx.$(".sinfo");
      const s = { ctx, wrap: ctx.$(".bwrap"), vp: ctx.$(".vp"), addr: null, nav: [], cur: "", visits: 0, leaving: null, busy: false, doneAt: 0, raw: true };
      bind(ctx, s);
      boot(s, { prefetchIgnore: true, transitions: [{ name: "swap", leave() {}, enter() {} }] });
      let reps = 4, us = [];
      ctx.group(["每級 4 次", "每級 10 次"], 0, (i) => { reps = i ? 10 : 4; });
      ctx.controls.classList.add("bottom");
      const page = (k, n) => `<!doctype html><html><head><title>${TITLE}</title></head><body><div data-barba="wrapper"><main class="bench ${k}" data-barba="container" data-barba-namespace="bench-${k}">${"<i></i>".repeat(n)}</main></div></body></html>`;
      ctx.bench({
        label: "容器節點數", unit: "個", sizes: [100, 1000, 5000, 20000, 50000, 100000, 200000],
        prepare(n) {
          us.forEach((u) => barba.cache.delete(u));
          us = ["a", "b"].map((k) => {
            const u = `${DIR}bench-${k}.html?n=${n}`;
            barba.cache.set(u, Promise.resolve({ html: page(k, n), url: { href: u, ...barba.url.parse(u) } }), "prefetch", "fulfilled", u);
            return u;
          });
        },
        async run(n) {
          const t0 = performance.now();
          for (let i = 0; i < reps; i++) {
            await barba.go(us[i % 2], REPL);
            if (!ctx.active) return halt();
            void s.vp.offsetHeight;
          }
          const ms = performance.now() - t0;
          info.textContent = `目前：容器內 ${fmt(n)} 個節點，已來回換頁 ${reps} 次`;
          return `每次 ${fmtMs(ms / reps)}`;
        },
        note: "頁面事先放進快取，不經過網路。計時包含解析 HTML、替換容器、排版，以及 Barba 每次換頁後把整份文件序列化一次；不含繪製。",
      });
    },
  },
] });
</script>
