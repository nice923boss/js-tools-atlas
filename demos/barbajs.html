<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barba.js 示範：旅行誌首頁</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .top { position: fixed; left: 16px; top: 12px; z-index: 30; display: flex; align-items: center; gap: 14px; }
  .brand { font-weight: 800; font-size: 16px; }
  .brand small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 4px; }
  nav { display: flex; gap: 4px; }
  nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 7px 11px; border-radius: 8px; border: 1px solid transparent; }
  nav a:hover { color: var(--fg); }
  nav a[aria-current="page"] { color: var(--fg); border-color: var(--line); background: var(--panel); }

  /* Every container (also the ones fetched from assets/barbajs/) is styled here. */
  main[data-barba="container"] { position: fixed; inset: 60px 16px 100px; z-index: 1; display: grid; gap: 12px; }
  .home { grid-template-columns: 2fr 1fr; }
  .hero { position: relative; border-radius: 14px; overflow: hidden; background: #1d2230 center / cover no-repeat; display: flex; align-items: flex-end; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 35%, rgba(0, 0, 0, .7)); }
  .hero div { position: relative; z-index: 1; padding: 18px 20px; }
  .hero small { color: var(--accent); font-weight: 700; letter-spacing: .1em; }
  .hero h2 { margin: 2px 0 4px; font-size: clamp(22px, 4vw, 34px); line-height: 1.2; }
  .hero p { margin: 0; color: #d9d7cf; font-size: 13px; }
  .cards { display: grid; gap: 12px; grid-template-rows: 1fr 1fr; min-height: 0; }
  .card { position: relative; border-radius: 14px; overflow: hidden; background: #1d2230 center / cover no-repeat; color: #fff; text-decoration: none; display: flex; align-items: flex-end; min-height: 0; }
  .card span { position: relative; margin: 10px; padding: 5px 11px; border-radius: 999px; background: rgba(14, 16, 19, .78); font-weight: 700; font-size: 13px; }
  .gallery { grid-template-rows: auto 1fr; }
  .gallery header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .gallery h2 { margin: 0; font-size: 22px; }
  .gallery header p { margin: 0; color: var(--muted); font-size: 13px; }
  .gallery header a { margin-left: auto; color: var(--accent); font-size: 13px; text-decoration: none; }
  .grid { display: grid; gap: 10px; grid-auto-flow: column; grid-auto-columns: 1fr; min-height: 0; }
  .grid figure { margin: 0; position: relative; border-radius: 12px; overflow: hidden; background: #1d2230 center / cover no-repeat; min-height: 0; }
  .grid figcaption { position: absolute; left: 8px; bottom: 8px; padding: 3px 9px; border-radius: 999px; background: rgba(14, 16, 19, .78); font-size: 12px; }

  #curtain {
    position: fixed; inset: 60px 16px 100px; z-index: 20; border-radius: 14px; display: grid; place-items: center;
    background: var(--cc, #f7df1e); color: #14140f; clip-path: inset(0 0 0 100%); pointer-events: none;
  }
  #curtain b { font-size: clamp(30px, 7vw, 64px); font-weight: 900; letter-spacing: .08em; }
  #curtain small { display: block; text-align: center; font: 600 12px var(--mono); opacity: .7; }

  .foot { position: fixed; left: 16px; right: 16px; bottom: 56px; z-index: 30; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  .addr { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 5px 10px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); min-width: 0; }
  .addr b { color: var(--fg); font-weight: 600; }
  .hooks { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .hooks span { font: 11px/1 var(--mono); padding: 5px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); transition: background .2s, color .2s; }
  .hooks span.on { background: var(--c2); color: #0e1013; border-color: transparent; }
  .persist { position: fixed; right: 16px; bottom: 12px; z-index: 30; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
  .persist i { width: 8px; height: 8px; border-radius: 50%; background: var(--c4); animation: beat 1s infinite; }
  .persist b { color: var(--fg); }
  @keyframes beat { 50% { opacity: .25; } }

  @media (max-width: 620px) {
    .brand { display: none; }
    .top { left: 10px; }
    nav a { padding: 7px 8px; }
    main[data-barba="container"], #curtain { inset: 54px 10px 120px; }
    .home { grid-template-columns: 1fr; grid-template-rows: 1.4fr 1fr; }
    .cards { grid-template-rows: none; grid-template-columns: 1fr 1fr; }
    .hero p { display: none; }
    .grid { grid-auto-flow: row; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; }
    .grid figure:last-child:nth-child(odd) { grid-column: span 2; }
    .gallery header p { display: none; }
    .foot { left: 10px; right: 10px; bottom: 84px; }
    .hooks { display: none; }
    .addr { width: 100%; }
    .persist { right: auto; left: 10px; bottom: 48px; }
  }
</style>
</head>
<body data-barba="wrapper">
<header class="top">
  <div class="brand">旅行誌<small>Barba.js</small></div>
  <nav id="nav">
    <a href="barbajs.html" data-ns="home" data-barba-history="replace">首頁</a>
    <a href="assets/barbajs/landscape.html" data-ns="landscape" data-barba-history="replace">山岳</a>
    <a href="assets/barbajs/animals.html" data-ns="animals" data-barba-history="replace">動物</a>
  </nav>
</header>
<div class="controls">
  <button class="btn" id="auto" aria-pressed="true">自動導覽</button>
  <button class="btn primary" id="replay">重播</button>
</div>

<main data-barba="container" data-barba-namespace="home" class="home">
  <section class="hero" style="background-image:url(_shared/img/photo-1.jpg)">
    <div><small>第 1 站</small><h2>沿著峽灣往北走</h2><p>點上方選單換頁：只有中間這塊內容被替換，選單、網址列與右下角計時器都留在原地。</p></div>
  </section>
  <div class="cards">
    <a class="card" href="assets/barbajs/landscape.html" data-barba-history="replace" style="background-image:url(_shared/img/photo-3.jpg)"><span>山岳</span></a>
    <a class="card" href="assets/barbajs/animals.html" data-barba-history="replace" style="background-image:url(_shared/img/photo-7.jpg)"><span>動物</span></a>
  </div>
</main>

<div id="curtain"><div><b id="curtainName">山岳</b><small>leave → fetch → enter</small></div></div>
<div class="foot">
  <div class="addr mono">網址 <b id="addr"></b></div>
  <div class="hooks" id="hooks"></div>
</div>
<div class="persist"><i></i>常駐元素：已執行 <b id="secs">0</b> 秒，換頁 <b id="visits">0</b> 次</div>
<div class="hint">換頁不重新載入，只替換內容區</div>

<script src="https://cdn.jsdelivr.net/npm/@barba/core@2.10.3/dist/barba.umd.js"></script>
<script>
// Barba swaps only [data-barba="container"]; the header, curtain and timer persist across pages.
const NAMES = { home: "首頁", landscape: "山岳", animals: "動物" };
const COLORS = { home: "#f7df1e", landscape: "#7bd389", animals: "#ff8c42" };
const HOOKS = ["beforeLeave", "leave", "afterLeave", "beforeEnter", "enter", "afterEnter"];
const curtain = document.getElementById("curtain");
const autoBtn = document.getElementById("auto");
const navLinks = [...document.querySelectorAll("#nav a")];
let auto = true, timer = null, visits = 0, secs = 0;

// Freeze nav hrefs to absolute URLs: relative ones would break once the address changes folder.
navLinks.forEach((a) => a.setAttribute("href", a.href));
// Warm the image cache so fetched pages paint instantly.
[2, 3, 4, 5, 6, 7, 8].forEach((i) => { new Image().src = `_shared/img/photo-${i}.jpg`; });

const nsOf = (path) => (path.includes("landscape") ? "landscape" : path.includes("animals") ? "animals" : "home");
const hooksEl = document.getElementById("hooks");
hooksEl.innerHTML = HOOKS.map((h) => `<span data-h="${h}">${h}</span>`).join("");

function markPage() {
  const ns = nsOf(location.pathname);
  navLinks.forEach((a) => (a.dataset.ns === ns ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  document.getElementById("addr").textContent = location.pathname.replace(/^.*?(\/demos\/)/, "$1");
}

async function wipe(from, to, ms) {
  const a = curtain.animate([{ clipPath: from }, { clipPath: to }], { duration: ms, easing: "cubic-bezier(.7,0,.3,1)", fill: "forwards" });
  await a.finished;
  curtain.style.clipPath = to;
  a.cancel();
}

barba.init({
  preventRunning: true,
  transitions: [{
    name: "curtain",
    async leave({ current, next }) {
      const ns = nsOf(next.url.path || "");
      curtain.style.setProperty("--cc", COLORS[ns]);
      document.getElementById("curtainName").textContent = NAMES[ns];
      current.container.animate([{ opacity: 1, transform: "none" }, { opacity: .4, transform: "scale(.97)" }], { duration: 500, fill: "forwards" });
      await wipe("inset(0 0 0 100%)", "inset(0 0 0 0%)", 550);
      // Barba removes the old container only after enter, so hide it behind the curtain now.
      current.container.style.visibility = "hidden";
    },
    async enter({ next }) {
      const parts = next.container.querySelectorAll(".hero, .card, header, figure");
      parts.forEach((el, i) => el.animate(
        [{ opacity: 0, transform: "translateY(22px)" }, { opacity: 1, transform: "none" }],
        { duration: 520, delay: 120 + i * 70, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" }));
      await wipe("inset(0 0 0 0%)", "inset(0 100% 0 0)", 600);
    },
  }],
});

// Light up each lifecycle hook as Barba runs it.
barba.hooks.before(() => hooksEl.querySelectorAll("span").forEach((s) => s.classList.remove("on")));
HOOKS.forEach((h) => barba.hooks[h](() => hooksEl.querySelector(`[data-h="${h}"]`).classList.add("on")));
// The URL is already updated when the new container goes in, so refresh nav and address there.
barba.hooks.beforeEnter(markPage);
barba.hooks.after(() => {
  visits++;
  document.getElementById("visits").textContent = visits;
  if (auto) schedule();
});

// Auto tour: walk the nav links in order; the link is passed as trigger so its replace-history attribute applies.
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const i = navLinks.findIndex((a) => a.hasAttribute("aria-current"));
    const link = navLinks[(i + 1) % navLinks.length];
    barba.go(link.href, link);
  }, 2400);
}
function setAuto(on) {
  auto = on;
  autoBtn.setAttribute("aria-pressed", on);
  on ? schedule() : clearTimeout(timer);
}
document.addEventListener("click", (e) => { if (e.isTrusted && e.target.closest("a")) setAuto(false); });
autoBtn.addEventListener("click", () => setAuto(!auto));
document.getElementById("replay").addEventListener("click", () => {
  setAuto(true);
  if (nsOf(location.pathname) !== "home") { clearTimeout(timer); barba.go(navLinks[0].href, navLinks[0]); }
});
setInterval(() => { document.getElementById("secs").textContent = ++secs; }, 1000);

markPage();
schedule();
</script>
</body>
</html>
