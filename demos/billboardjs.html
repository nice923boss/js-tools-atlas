<script src="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.pkgd.min.js"></script>

<script>
// billboard.js showcase: eight scenes from the classic temperature band chart to an SVG vs Canvas benchmark.
const CANVAS_ESM = "https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist-esm/index.canvas.js/+esm";
const Y = "#f7df1e", CY = "#4cc9f0", PK = "#f72585", GR = "#7bd389", OR = "#ff8c42", PU = "#9d8cff", TAN = "#c9a66b";
const nf = new Intl.NumberFormat("zh-TW");
const pad = (v) => String(v).padStart(2, "0");
const compact = (v) => Showcase.fmtCompact(v).replace(" ", "");
function rng(seed) { let s = seed % 2147483647 || 1; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }
const jit = (v, r, amp) => +(v + (r() - 0.5) * amp).toFixed(1);

// Generate a chart that follows its parent's size, and destroy it exactly once.
function gen(ctx, el, opts) {
  const chart = bb.generate({ bindto: el, resize: { auto: "parent" }, ...opts });
  let alive = true;
  // billboard.js 4.1.1: destroy() interrupts a pending flow() wait loop, whose callback then runs on the
  // cleared internals and throws. The redrawing/flowing flags are unreliable here (a resize clears them early),
  // so keep a time budget per flow() call and destroy after it (plain setTimeout: ctx timers stop on cleanup).
  let busyUntil = 0;
  const flow = chart.flow.bind(chart);
  chart.flow = (args) => {
    busyUntil = performance.now() + (args.duration ?? 0) + (opts.transition?.duration ?? 350) + 800;
    return flow(args);
  };
  chart.dispose = () => {
    if (!alive) return;
    alive = false;
    const wait = busyUntil - performance.now();
    if (wait > 0) setTimeout(() => chart.destroy(), wait); else chart.destroy();
  };
  ctx.onCleanup(chart.dispose);
  return chart;
}
const cardHTML = (tag, sub = "") => `<div class="panel bbd-card"><div class="bbd-tag">${tag}${sub ? `<small>${sub}</small>` : ""}</div><div class="bbd-host"><div></div></div></div>`;

// ---------- scene 1 data: daily temperature band (seeded) ----------
const NORMALS = {
  台北: { hi: [19.2, 19.8, 22.0, 25.6, 29.0, 31.8, 34.0, 33.6, 31.4, 27.8, 24.6, 20.9], lo: [13.9, 14.3, 15.9, 19.2, 22.4, 25.0, 26.4, 26.2, 24.9, 22.3, 19.5, 15.6] },
  台中: { hi: [22.0, 22.4, 24.8, 27.9, 30.3, 31.9, 32.7, 32.3, 31.9, 30.1, 27.3, 23.5], lo: [12.6, 13.3, 15.6, 19.4, 22.6, 24.4, 25.2, 25.0, 24.0, 21.6, 17.9, 13.9] },
  高雄: { hi: [23.6, 24.6, 26.9, 29.3, 31.0, 31.9, 32.4, 31.9, 31.8, 30.8, 28.3, 24.9], lo: [15.7, 16.8, 19.2, 22.4, 24.8, 26.0, 26.4, 26.0, 25.4, 23.6, 20.6, 17.2] },
};
const DATES = [];
for (let d = new Date(2024, 0, 1); d.getFullYear() === 2024; d.setDate(d.getDate() + 1)) DATES.push(new Date(d));
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const meanOf = (city) => NORMALS[city].hi.map((h, i) => +((h + NORMALS[city].lo[i]) / 2).toFixed(1));

function bandSeries(city) {
  const rnd = rng(city.charCodeAt(0));
  const { hi, lo } = NORMALS[city];
  let wobble = 0, cold = 0;
  return DATES.map((d) => {
    const m = d.getMonth(), f = (d.getDate() - 15) / 30;
    const n = f < 0 ? (m + 11) % 12 : (m + 1) % 12, w = Math.abs(f);
    wobble = wobble * 0.85 + (rnd() - 0.5) * 1.6;
    if ((m <= 2 || m >= 10) && rnd() < 0.05) cold = -5; // occasional cold front fading over a few days
    cold *= 0.7;
    const h = hi[m] + (hi[n] - hi[m]) * w + wobble + cold + (rnd() - 0.5) * 0.6;
    const l = lo[m] + (lo[n] - lo[m]) * w + wobble * 0.7 + cold + (rnd() - 0.5) * 0.5;
    return [+h.toFixed(1), +((h + l) / 2).toFixed(1), +Math.min(l, h - 2).toFixed(1)];
  });
}
function bandColumns(city) {
  const band = bandSeries(city);
  return [["x", ...DATES.map(iso)], ["最高／最低溫", ...band], ["日均溫", ...band.map((b) => b[1])]];
}
const SEASONS = [
  { axis: "x", start: "2024-01-01", end: "2024-03-01", class: "monsoon", label: { text: "東北季風", y: 14, x: 6 } },
  { axis: "x", start: "2024-05-15", end: "2024-06-30", class: "plum", label: { text: "梅雨季", y: 14, x: 6 } },
  { axis: "x", start: "2024-07-01", end: "2024-10-01", class: "typhoon", label: { text: "颱風季", y: 14, x: 6 } },
];

// ---------- scene 2 data: one entry per chart type ----------
const MONTHS = Array.from({ length: 12 }, (_, i) => `${i + 1}月`);
const HOURS = Array.from({ length: 18 }, (_, i) => `${i + 6}時`);
const GALLERY = [
  { type: "spline", sub: "台北與高雄月均溫", legend: true,
    cols: (r) => [["x", ...MONTHS], ["台北", ...meanOf("台北").map((v) => jit(v, r, 2))], ["高雄", ...meanOf("高雄").map((v) => jit(v, r, 2))]],
    data: { x: "x", type: "spline", colors: { 台北: CY, 高雄: OR } },
    opts: { axis: { x: { type: "category", tick: { multiline: false, culling: { max: 4 } } }, y: { tick: { culling: { max: 4 }, format: (v) => v.toFixed(0) } } }, point: { focus: { only: true } } } },
  { type: "area-step", sub: "台北車站每小時進站",
    cols: (r) => [["x", ...HOURS], ["進站", ...HOURS.map((_, i) => Math.round((9 + 30 * Math.exp(-((i - 2) ** 2) / 2) + 24 * Math.exp(-((i - 12) ** 2) / 3)) * (0.85 + r() * 0.3)))]],
    data: { x: "x", type: "area-step", colors: { 進站: CY } },
    opts: (small) => ({ axis: { x: { type: "category", tick: { multiline: false, culling: { max: small ? 3 : 4 } } }, y: { tick: { culling: { max: 4 }, format: (v) => `${v.toFixed(0)}k` } } } }) },
  { type: "bar + groups", sub: "各季運量堆疊", legend: true,
    cols: (r) => [["x", "Q1", "Q2", "Q3", "Q4"], ["捷運", ...[190, 196, 205, 201].map((v) => Math.round(v * (0.85 + r() * 0.3)))],
      ["公車", ...[150, 148, 141, 146].map((v) => Math.round(v * (0.85 + r() * 0.3)))], ["YouBike", ...[32, 41, 44, 37].map((v) => Math.round(v * (0.7 + r() * 0.6)))]],
    data: { x: "x", type: "bar", groups: [["捷運", "公車", "YouBike"]], colors: { 捷運: CY, 公車: OR, YouBike: GR } },
    opts: { axis: { x: { type: "category", tick: { multiline: false } }, y: { tick: { culling: { max: 4 } } } }, bar: { width: { ratio: 0.6 }, radius: 2 } } },
  { type: "donut", sub: "發電結構",
    cols: (r) => [["燃氣", 42 + r() * 6], ["燃煤", 36 + r() * 6], ["再生", 9 + r() * 6], ["核能", 3 + r() * 3], ["其他", 3 + r() * 2]].map(([k, v]) => [k, +v.toFixed(1)]),
    data: { type: "donut", colors: { 燃氣: CY, 燃煤: TAN, 再生: GR, 核能: PU, 其他: OR } },
    opts: (small) => ({ donut: { title: small ? "" : "發電", width: small ? 16 : 22, label: { show: !small, threshold: 0.08 } } }) },
  { type: "radar", sub: "宜居指標", legend: true,
    cols: (r) => [["x", "交通", "房價", "美食", "綠地", "文化", "氣候"],
      ["台北", ...[92, 35, 80, 62, 88, 60].map((v) => Math.round(Math.min(100, v * (0.85 + r() * 0.3))))],
      ["台南", ...[55, 72, 95, 70, 85, 75].map((v) => Math.round(Math.min(100, v * (0.85 + r() * 0.3))))]],
    data: { x: "x", type: "radar", colors: { 台北: CY, 台南: OR } },
    opts: (small) => ({ radar: { axis: { max: 100, text: { show: !small } }, level: { depth: 4, text: { show: false } }, size: { ratio: small ? 0.9 : 0.72 } } }) },
  { type: "polar", sub: "一週 YouBike 借車",
    cols: (r) => ["一", "二", "三", "四", "五", "六", "日"].map((d, i) => [`週${d}`, Math.round((i < 5 ? 70 : 92) * (0.75 + r() * 0.5))]),
    data: { type: "polar", colors: Object.fromEntries(["一", "二", "三", "四", "五", "六", "日"].map((d, i) => [`週${d}`, [CY, PU, GR, Y, OR, PK, TAN][i]])) },
    opts: (small) => ({ polar: { label: { show: !small, format: (v, ratio, id) => id.slice(1) }, level: { depth: 3, text: { show: false } } } }) },
  { type: "treemap", sub: "縣市人口（萬）",
    cols: (r) => [["新北", 400], ["台中", 285], ["高雄", 273], ["台北", 249], ["桃園", 230], ["台南", 186], ["彰化", 124], ["其他", 590]].map(([k, v]) => [k, Math.round(v * (0.8 + r() * 0.4))]),
    data: { type: "treemap", colors: { 新北: CY, 台中: OR, 高雄: PK, 台北: Y, 桃園: GR, 台南: PU, 彰化: TAN, 其他: "#5b6470" }, labels: { colors: "#101215" } },
    opts: { treemap: { label: { format: (v, ratio, id) => id, threshold: 0.03 } } } },
  { type: "candlestick", sub: "加權指數（紅漲綠跌）",
    cols: (r) => {
      let c = 22000; const out = ["指數"];
      for (let i = 0; i < 20; i++) { const o = c; c = Math.round(o + (r() - 0.48) * 380); const h = Math.max(o, c) + Math.round(r() * 160), l = Math.min(o, c) - Math.round(r() * 160); out.push([o, h, l, c]); }
      return [out];
    },
    data: { type: "candlestick", colors: { 指數: PK } },
    opts: { candlestick: { width: { ratio: 0.6 }, color: { down: GR } }, axis: { x: { tick: { format: (i) => `${i + 1}`, culling: { max: 5 } } }, y: { tick: { culling: { max: 4 }, format: (v) => `${(v / 1000).toFixed(1)}k` } } } } },
];

// ---------- scene 3 data: MRT station entries every 5 minutes ----------
const STATIONS = [
  { name: "台北車站", base: 9000, am: 1.0, pm: 0.9, color: CY },
  { name: "市政府", base: 4200, am: 0.6, pm: 1.0, color: OR },
  { name: "板橋", base: 4800, am: 1.1, pm: 0.7, color: GR },
  { name: "西門", base: 3500, am: 0.4, pm: 1.1, color: PK },
  { name: "南港展覽館", base: 2600, am: 0.9, pm: 0.6, color: PU },
];
function entries(st, minute, r) {
  const h = (minute / 60) % 24;
  const peak = st.am * Math.exp(-((h - 8.2) ** 2) / 0.8) + st.pm * Math.exp(-((h - 18.2) ** 2) / 1.2);
  return Math.round((st.base / 12) * (0.3 + 1.6 * peak) * (0.9 + r() * 0.2));
}

// ---------- scene 4 data: hourly PM2.5 for a month ----------
function pm25() {
  const r = rng(2024), out = [];
  let episode = 0, base = 16;
  for (let i = 0; i < 720; i++) {
    const h = i % 24;
    if (h === 0 && r() < 0.2) episode = 16 + r() * 26; // a pollution episode decaying over the next day or two
    episode *= 0.965;
    base = Math.min(26, Math.max(8, base + (r() - 0.5) * 1.4));
    const diurnal = 6 * Math.exp(-((h - 9) ** 2) / 6) + 5 * Math.exp(-((h - 21) ** 2) / 8);
    out.push(+Math.max(2, base + episode + diurnal + (r() - 0.5) * 4).toFixed(1));
  }
  return out;
}

Showcase.run({ scenes: [
  {
    id: "band", title: "氣溫帶狀圖",
    api: 'bb.generate({ data: { types: { 帶: "area-spline-range" } }, regions, subchart }) + chart.load()',
    desc: "每日最高與最低溫畫成帶狀，日均溫疊成曲線；季節用 regions 標示，下方 subchart 可拖曳選取區間放大，切換城市用 chart.load() 平滑過渡。",
    hint: "拖曳下方縮圖選取區間放大・滑過看當日溫度",
    mount(ctx) {
      ctx.html(`<div class="bbd-wrap"><div class="bbd-head"><h2>台北 2024 每日氣溫</h2><p>示意資料・帶狀為每日最高與最低溫，線為日均溫，黃色虛線為年均溫</p></div><div class="bbd-host"><div></div></div></div>`);
      const title = ctx.$(".bbd-head h2");
      const narrow = ctx.el.clientWidth < 640;
      const avgLine = (cols) => {
        const m = cols[2].slice(1), avg = m.reduce((a, b) => a + b, 0) / m.length;
        return [{ value: +avg.toFixed(1), text: `年均 ${avg.toFixed(1)} °C`, position: "start" }];
      };
      const cols0 = bandColumns("台北");
      const chart = gen(ctx, ctx.$(".bbd-host > div"), {
        data: { x: "x", columns: cols0, types: { "最高／最低溫": "area-spline-range", 日均溫: "spline" }, colors: { "最高／最低溫": OR, 日均溫: Y } },
        point: { show: false, focus: { only: true } },
        axis: {
          x: { type: "timeseries", tick: { format: "%-m月", values: Array.from({ length: 12 }, (_, i) => `2024-${pad(i + 1)}-01`), outer: false } },
          y: { label: { text: "氣溫（°C）", position: "outer-middle" }, min: 6, max: 38, padding: { top: 0, bottom: 0 }, tick: { outer: false } },
        },
        grid: { y: { show: true, lines: avgLine(cols0) } },
        regions: SEASONS,
        subchart: { show: true, size: { height: narrow ? 28 : 40 }, axis: { x: { show: false } } },
        legend: { position: "bottom" },
        tooltip: {
          format: {
            title: (x) => `${x.getMonth() + 1} 月 ${x.getDate()} 日`,
            value: (v) => (Array.isArray(v) ? `${v[2]} 至 ${v[0]} °C` : v && typeof v === "object" ? `${v.low} 至 ${v.high} °C` : `${v} °C`),
          },
        },
        padding: { right: narrow ? 8 : 16 },
        transition: { duration: 700 },
      });
      ctx.group(["台北", "台中", "高雄"], 0, (i, city) => {
        const cols = bandColumns(city);
        title.textContent = `${city} 2024 每日氣溫`;
        chart.load({ columns: cols });
        chart.ygrids(avgLine(cols));
      });
      ctx.toggle("季節", true, (v) => (v ? chart.regions(SEASONS) : chart.regions.remove()));
      ctx.toggle("縮圖", true, (v) => (v ? chart.subchart.show() : chart.subchart.hide()));
    },
  },
  {
    id: "types", title: "圖型總覽",
    api: 'data.type: "spline" | "area-step" | "bar" | "donut" | "radar" | "polar" | "treemap" | "candlestick"',
    desc: "同一個 bb.generate() 介面換 data.type 就是另一種圖：折線、階梯面積、堆疊長條、甜甜圈、雷達、極座標、矩形樹圖、K 線。按「隨機資料」用 chart.load() 看各圖型的過渡動畫。",
    hint: "按「隨機資料」看八種圖型同時過渡",

        const type = canvasMode ? (scatter ? mod.scatter() : mod.line()) : (scatter ? "scatter" : "line");
        const opts = {
          bindto: el, resize: { auto: "parent" },
          data: { x: "x", columns: cols, type, colors: { 值: scatter ? CY : Y } },
          point: scatter ? { r: 1.6, focus: { expand: { enabled: false } } } : { focus: { only: true } },
          axis: { x: { tick: { fit: false, count: 6, format: (v) => compact(v) } }, y: { tick: { culling: { max: 5 }, format: (v) => compact(v) } } },
          legend: { show: false },
          transition: { duration: 0 },
          onrendered() { resolve(); },
        };
        if (canvasMode) opts.render = { mode: mod.canvas() };
        chart = lib.generate(opts);
      });
      const label = (n) => { tagSmall.textContent = `${scatter ? "散佈" : "折線"}・${canvasMode ? "Canvas" : "SVG"}・${compact(n)} 點・DOM ${nf.format(el.getElementsByTagName("*").length)} 個節點`; };
      let lastN = 5000;
      const redraw = async () => {
        if (canvasMode) await loadCanvas();
        if (!ctx.active) return;
        await render(make(lastN));
        label(lastN);
      };
      redraw();
      ctx.group(["散佈", "折線"], 0, (i) => { scatter = i === 0; redraw(); });
      ctx.group(["SVG", "Canvas"], 0, (i) => { canvasMode = i === 1; redraw(); });
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "資料點", unit: "點",
        sizes: [1000, 5000, 10000, 50000, 100000, 200000, 500000, 1000000],
        async prepare(n) { if (canvasMode) await loadCanvas(); return make(n); },
        async run(n, cols) {
          await render(cols);
          await ctx.frame(1);
          lastN = n;
          label(n);
          return `DOM ${compact(el.getElementsByTagName("*").length)}`;
        },
        note: "計時含資料轉換、座標尺度、繪製到 onrendered，再等一個畫格；資料產生不計入。SVG 散佈圖每個點都是一個 <circle> 節點，數量一大就卡在 DOM；折線只有一條 path，成本主要在資料轉換。Canvas 模式第一次切換時才從 CDN 載入 billboard.js/canvas 模組。",
      });
    },
  },
] });
</script>
</body>
