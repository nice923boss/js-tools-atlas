<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>billboard.js 示範：全年氣溫帶狀圖</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/theme/dark.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"每日氣溫由氣候平均加隨機變化生成，示意資料"}</script>
<style>
  body { background: radial-gradient(90% 80% at 50% 0%, #1d1a26 0%, var(--bg) 70%); }
  .title { position: fixed; left: 14px; top: 12px; z-index: 40; }
  .title h1 { margin: 0; font-size: 16px; }
  .title p { margin: 0; font-size: 12px; color: var(--muted); }
  .wrap { position: fixed; left: 6px; right: 12px; top: 62px; bottom: 42px; }
  #chart { width: 100%; height: 100%; }
  /* Dark theme tweaks so the chart sits on the page background */
  .bb svg { font-family: var(--font); }
  .bb text { fill: #9b998f; }
  .bb-legend-item text { fill: #ecebe6; }
  .bb-axis-y-label, .bb-axis-x-label { fill: #ecebe6 !important; }
  .bb-grid line { stroke: rgba(255,255,255,0.07); }
  .bb-region rect { fill-opacity: 0.12; }
  .bb-chart-lines .bb-area { opacity: 0.4 !important; }
  .bb-chart-lines .bb-line { stroke-width: 1.6px; }
  .bb-region.plum { fill: #4cc9f0; } .bb-region.typhoon { fill: #f72585; } .bb-region.monsoon { fill: #9d8cff; }
  .bb-region text { fill: #ecebe6 !important; font-size: 11px; }
  .bb-subchart .bb-brush .selection { fill: #f7df1e; fill-opacity: 0.15; stroke: #f7df1e; }
  .bb-tooltip-container { font-family: var(--font); }
  @media (max-width: 640px) { .title { top: 52px; } .wrap { top: 100px; } }
</style>
</head>
<body>
<div class="title"><h1 id="name">台北 2024 每日氣溫</h1><p>示意資料・帶狀為每日最高與最低溫，線為日均溫</p></div>
<div class="controls">
  <button class="btn" data-city="台北" aria-pressed="true">台北</button>
  <button class="btn" data-city="台中">台中</button>
  <button class="btn" data-city="高雄">高雄</button>
</div>
<div class="wrap"><div id="chart"></div></div>
<div class="hint">拖曳下方縮圖選取區間放大・滑過看當日溫度</div>

<script src="https://cdn.jsdelivr.net/npm/billboard.js@4.1.1/dist/billboard.pkgd.min.js"></script>
<script>
// billboard.js area-spline-range: daily high/low band + mean line, seasonal regions and a subchart brush.
const NORMALS = {
  台北: { hi: [19.2, 19.8, 22.0, 25.6, 29.0, 31.8, 34.0, 33.6, 31.4, 27.8, 24.6, 20.9], lo: [13.9, 14.3, 15.9, 19.2, 22.4, 25.0, 26.4, 26.2, 24.9, 22.3, 19.5, 15.6] },
  台中: { hi: [22.0, 22.4, 24.8, 27.9, 30.3, 31.9, 32.7, 32.3, 31.9, 30.1, 27.3, 23.5], lo: [12.6, 13.3, 15.6, 19.4, 22.6, 24.4, 25.2, 25.0, 24.0, 21.6, 17.9, 13.9] },
  高雄: { hi: [23.6, 24.6, 26.9, 29.3, 31.0, 31.9, 32.4, 31.9, 31.8, 30.8, 28.3, 24.9], lo: [15.7, 16.8, 19.2, 22.4, 24.8, 26.0, 26.4, 26.0, 25.4, 23.6, 20.6, 17.2] },
};

const dates = [];
for (let d = new Date(2024, 0, 1); d.getFullYear() === 2024; d.setDate(d.getDate() + 1)) dates.push(new Date(d));
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

// Interpolate monthly normals to days, then add a smooth random weather wobble (seeded for stable output).
function series(city) {
  let s = city.charCodeAt(0);
  const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const { hi, lo } = NORMALS[city];
  let wobble = 0, cold = 0;
  return dates.map((d) => {
    const m = d.getMonth(), f = (d.getDate() - 15) / 30;
    const n = f < 0 ? (m + 11) % 12 : (m + 1) % 12, w = Math.abs(f);
    wobble = wobble * 0.85 + (rnd() - 0.5) * 1.6;
    if ((m <= 2 || m >= 10) && rnd() < 0.05) cold = -5; // occasional cold front fading over a few days
    cold *= 0.7;
    const h = hi[m] + (hi[n] - hi[m]) * w + wobble + cold + (rnd() - 0.5) * 0.6;
    const l = lo[m] + (lo[n] - lo[m]) * w + wobble * 0.7 + cold + (rnd() - 0.5) * 0.5;
    return [+h.toFixed(1), +((h + l) / 2).toFixed(1), +Math.min(l, h - 2).toFixed(1)];
  });
}

function columns(city) {
  const band = series(city);
  return [["x", ...dates.map(iso)], ["最高／最低溫", ...band], ["日均溫", ...band.map((b) => b[1])]];
}

const narrow = innerWidth < 640;
const chart = bb.generate({
  bindto: "#chart",
  data: {
    x: "x",
    columns: columns("台北"),
    types: { "最高／最低溫": "area-spline-range", 日均溫: "spline" },
    colors: { "最高／最低溫": "#ff8c42", 日均溫: "#f7df1e" },
  },
  point: { show: false, focus: { only: true } },
  axis: {
    x: { type: "timeseries", tick: { format: "%-m月", values: Array.from({ length: 12 }, (_, i) => `2024-${String(i + 1).padStart(2, "0")}-01`), outer: false } },
    y: { label: { text: "氣溫（°C）", position: "outer-middle" }, min: 6, max: 38, padding: { top: 0, bottom: 0 }, tick: { outer: false } },
  },
  grid: { y: { show: true } },
  regions: [
    { axis: "x", start: "2024-01-01", end: "2024-03-01", class: "monsoon", label: { text: "東北季風", y: 14, x: 6 } },
    { axis: "x", start: "2024-05-15", end: "2024-06-30", class: "plum", label: { text: "梅雨季", y: 14, x: 6 } },
    { axis: "x", start: "2024-07-01", end: "2024-10-01", class: "typhoon", label: { text: "颱風季", y: 14, x: 6 } },
  ],
  subchart: { show: true, size: { height: narrow ? 28 : 40 }, axis: { x: { show: false } } },
  legend: { position: "bottom" },
  tooltip: {
    format: {
      title: (x) => `${x.getMonth() + 1} 月 ${x.getDate()} 日`,
      value: (v) => (Array.isArray(v) ? `${v[2]} 至 ${v[0]} °C` : v && typeof v === "object" ? `${v.low} 至 ${v.high} °C` : `${v} °C`),
    },
  },
  padding: { right: narrow ? 8 : 16 },
  transition: { duration: 700 },
});

document.querySelectorAll("[data-city]").forEach((b) => b.addEventListener("click", () => {
  const city = b.dataset.city;
  document.querySelectorAll("[data-city]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  document.getElementById("name").textContent = `${city} 2024 每日氣溫`;
  chart.load({ columns: columns(city) });
}));
</script>
</body>
</html>
