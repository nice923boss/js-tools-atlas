<style>
  .pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .fillbox { position: relative; min-width: 0; min-height: 0; }
  .fillbox > canvas, .fillbox > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .card h2 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }

  /* 1. poster (paper) */
  .poster-wrap { position: absolute; inset: 0; background: #f4ead8; color: #1d1d1b; }
  .poster-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
  .poster-wrap .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .5; }
  .poster-wrap .frame { position: absolute; inset: 10px; border: 1.5px solid rgba(29, 29, 27, .55); pointer-events: none; }
  .poster-wrap .stamp { position: absolute; left: 26px; top: 24px; font: 600 12px/1.5 var(--mono); letter-spacing: 1.5px; color: #4a453c; pointer-events: none; }
  .poster-wrap .stamp b { display: block; font-size: 20px; color: #1d1d1b; }
  .poster-wrap .poster { position: absolute; left: 26px; bottom: 24px; pointer-events: none; mix-blend-mode: multiply; }
  .poster h1 { margin: 0; font: 900 clamp(36px, 9.5vw, 100px)/0.95 var(--font); letter-spacing: 2px; color: #1d1d1b; }
  .poster p { margin: 8px 0 0 4px; font-size: 13px; letter-spacing: 1px; color: #4a453c; }
  .ctl { display: flex; align-items: center; gap: 4px; background: rgba(255, 255, 255, .6); border-radius: 999px; padding: 2px 4px 2px 10px; border: 1px solid var(--line); }
  .ctl span { font-size: 12px; color: #4a453c; }
  .ctl output { font: 700 13px var(--mono); min-width: 18px; text-align: center; }
  .ctl .btn { border-radius: 999px; padding: 4px 9px; }
  @media (max-width: 560px) {
    .poster-wrap .stamp { top: calc(var(--sc-ctl-h, 0px) + 12px); left: 20px; }
    .poster-wrap .poster { left: 20px; bottom: 20px; }
  }

  /* 2. parameter matrix */
  .mx { display: grid; gap: 4px; grid-template-columns: 3.2em repeat(5, minmax(0, 1fr)); grid-template-rows: 1.9em repeat(5, minmax(0, 1fr)); }
  .mx .hd { display: flex; flex-direction: column; align-items: center; justify-content: center; font: 500 11px/1.25 var(--mono); color: var(--muted); text-align: center; white-space: nowrap; }
  .mx .hd small { font-size: 10px; opacity: .7; }
  .mx .hd.corner b { color: var(--accent); font-weight: 700; }
  .mx .cell { position: relative; min-width: 0; min-height: 0; border-radius: 8px; background: rgba(255, 255, 255, .03); border: 1px solid rgba(255, 255, 255, .06); }
  .mx .cell svg { position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px); }
  .morph path { transition: d .7s cubic-bezier(.3, 1.35, .5, 1); }

  /* 3. seeded avatars */
  .av { display: grid; gap: 8px; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .av .ava { min-width: 0; min-height: 0; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .av .ava svg { flex: 1; min-height: 0; width: 100%; }
  .av .ava .meta { min-width: 0; max-width: 100%; display: flex; flex-direction: column; align-items: center; }
  .av .ava text { font: 700 22px var(--font); fill: #0e1013; text-anchor: middle; dominant-baseline: central; }
  .av .ava b { font-size: 13px; line-height: 1.3; }
  .av .ava small { font: 500 10.5px/1.2 var(--mono); color: var(--muted); white-space: nowrap; }
  .av .ava input { width: 100%; max-width: 8em; text-align: center; font-weight: 700; font-size: 13px; background: transparent; border: 0; border-bottom: 1px dashed var(--accent); outline: none; padding: 0 0 1px; }
  .av .ava.same { box-shadow: inset 0 0 0 1px rgba(123, 211, 137, .45); }
  .av .ava.diff { box-shadow: inset 0 0 0 1px rgba(247, 37, 133, .55); }
  .chip { font: 500 12px/1 var(--mono); color: var(--muted); }
  .chip b { color: var(--c4); }
  .chip b.bad { color: var(--c3); }
  @media (max-width: 560px) { .av { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .av .ava { flex-direction: row; } .av .ava svg { height: 100%; flex: none; width: 46%; } .av .ava .meta { align-items: flex-start; } }

  /* 4. three outputs */
  .outs { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .outs .card { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 8px 10px; }
  .outs .fillbox { flex: 1; }
  .outs .svgout svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .outs pre { margin: 6px 0 0; max-height: 6em; overflow: hidden; font: 10.5px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 560px) { .outs { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 6px; } .outs pre { max-height: 3em; } }

  /* 5. keyframe sequence */
  .kf { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .tl { padding: 10px 12px; }
  .tl .bar { position: relative; display: flex; height: 36px; border-radius: 6px; overflow: hidden; background: rgba(255, 255, 255, .04); }
  .tl .seg { min-width: 0; padding: 3px 6px; border-left: 1px solid rgba(255, 255, 255, .14); font: 500 10.5px/1.3 var(--mono); color: var(--muted); overflow: hidden; white-space: nowrap; transition: background .2s, color .2s; }
  .tl .seg b { display: block; color: var(--fg); font: 600 12px/1.3 var(--font); overflow: hidden; text-overflow: ellipsis; }
  .tl .seg.gap { background: repeating-linear-gradient(45deg, rgba(255, 255, 255, .07) 0 4px, transparent 4px 8px); }
  .tl .seg.on { background: rgba(76, 201, 240, .22); color: var(--fg); }
  .tl .head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .tl .head.off { background: var(--muted); box-shadow: none; }
  .tl .log { margin-top: 8px; height: 4.6em; overflow: hidden; font: 11px/1.55 var(--mono); color: var(--muted); }
  .tl .log div:first-child { color: var(--fg); }
  .tl .log .warn { color: var(--c5); }
  @media (max-width: 560px) { .tl { padding: 8px; } .tl .log { height: 3.1em; } .tl .seg.gap { padding: 0; } .tl .seg.gap * { display: none; } }

  /* 6. easing lanes */
  .lanes { position: absolute; left: 10px; right: 10px; top: calc(var(--sc-ctl-h, 0px) + 10px); bottom: calc(var(--sc-ctl-b, 0px) + 10px); }
  .lanes canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 7. stress */
  .stress-x { position: absolute; inset: 8px 8px 8px 350px; }
  .stress-x canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  @media (max-width: 760px) { .stress-x { inset: 8px; opacity: .9; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/blobs@2.2.0/v2/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blobs@2.2.0/v2/animate/index.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// blobs showcase: static generation (blobs2) and keyframe animation (blobs2Animate), ending in a stress ramp.
const css = getComputedStyle(document.documentElement);
const PAL = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const MONO = css.getPropertyValue("--mono");
const { h } = Showcase;
const TF = ["linear", "easeEnd", "easeStart", "ease", "elasticEnd0", "elasticEnd1", "elasticEnd2", "elasticEnd3"];

// Keep a canvas sized to its parent box (DPR capped at 2); returns a getter for {w, h, dpr}.
function autoCanvas(ctx, canvas, onSize) {
  const box = canvas.parentElement;
  let s = { w: 0, h: 0, dpr: 1 };
  const apply = () => {
    const w = box.clientWidth, hh = box.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
    if (w === s.w && hh === s.h && dpr === s.dpr) return;
    s = { w, h: hh, dpr };
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(hh * dpr));
    if (onSize) onSize(s);
  };
  const ro = new ResizeObserver(apply);
  ro.observe(box);
  ctx.onCleanup(() => ro.disconnect());
  apply();
  return () => s;
}
// Set a path both as attribute and as CSS `d`, so browsers that support it can transition the change.
function setD(path, d) {
  path.setAttribute("d", d);
  path.style.d = `path("${d}")`;
}
const hash = (str) => { let x = 2166136261; for (const ch of str) x = Math.imul(x ^ ch.codePointAt(0), 16777619); return x >>> 0; };

// Paper grain tile for the poster, rendered once.
let grainUrl = "";
function grainTile() {
  if (grainUrl) return grainUrl;
  const c = document.createElement("canvas");
  c.width = c.height = 220;
  const g = c.getContext("2d");
  const img = g.createImageData(220, 220);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 200 + Math.random() * 55;
    img.data[i] = v; img.data[i + 1] = v * 0.97; img.data[i + 2] = v * 0.9;
    img.data[i + 3] = Math.random() < 0.5 ? 40 : 0;
  }
  g.putImageData(img, 0, 0);
  return (grainUrl = c.toDataURL());
}

const POSTER_LAYERS = [
  { color: "#b9a4f2", px: -0.17, py: -0.10, size: 0.74, depth: 0.4, spin: 0.03 },
  { color: "#f2b134", px: 0.21, py: -0.12, size: 0.48, depth: 0.7, spin: -0.05 },
  { color: "#ff6b5b", px: 0.02, py: 0.04, size: 0.62, depth: 1.0, spin: 0.04 },
  { color: "#1f9e89", px: -0.24, py: 0.20, size: 0.34, depth: 1.3, spin: -0.06 },
  { stroke: "#1d1d1b", px: 0.08, py: -0.03, size: 0.55, depth: 1.6, spin: 0.02 },
  { dots: "#1d1d1b", px: 0.27, py: 0.17, size: 0.3, depth: 1.9, spin: -0.03 },
];
const NAMES = ["陳怡君", "林志明", "張雅婷", "王建宏", "李佳穎", "黃冠宇", "吳淑芬", "劉家豪", "蔡宗翰"];
const AV_COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff", "#ffd6a5", "#80ffdb"];

Showcase.run({ scenes: [
  {
    id: "poster", title: "流動海報", paper: true,
    api: "blobs2Animate.canvasPath().transition({ duration, timingFunction, blobOptions, callback })",
    desc: "六層色塊各是一個動畫物件，每段過場結束時在 callback 裡排下一個隨機形狀；multiply 疊印、半色調點與描邊模擬絹印海報，點擊用 isPointInPath 判斷打到哪一層。",
    hint: "點色塊讓它彈跳變形・移動滑鼠有視差・調整點數與隨機度",
    mount(ctx) {
      ctx.html(`<div class="poster-wrap"><canvas></canvas><div class="grain"></div><div class="frame"></div>
        <div class="stamp"><b>第 07 號</b>有機形狀研究・2026</div>
        <div class="poster"><h1>流動的形狀</h1><p>blobs 即時生成・四色相乘疊印</p></div></div>`);
      const wrap = ctx.$(".poster-wrap"), cv = ctx.$("canvas"), g = cv.getContext("2d");
      ctx.$(".grain").style.background = `url(${grainTile()})`;
      const UNIT = 200;
      const opts = { points: 5, rand: 6 };
      const keyframe = (duration, timingFunction, extra) => ({
        duration, timingFunction,
        blobOptions: { seed: Math.random(), extraPoints: opts.points, randomness: opts.rand, size: UNIT, ...extra },
      });
      const loop = (L) => L.anim.transition({ ...keyframe(2600 + Math.random() * 2400, "ease"), callback: () => loop(L) });
      const layers = POSTER_LAYERS.map((L) => ({ ...L, anim: blobs2Animate.canvasPath(), ox: 0, oy: 0, path: null }));
      layers.forEach((L) => L.anim.transition({ ...keyframe(0, "linear"), callback: () => loop(L) }));

      // Halftone dot pattern for the "printed" layer
      const dot = document.createElement("canvas");
      dot.width = dot.height = 9;
      const dg = dot.getContext("2d");
      dg.fillStyle = "#1d1d1b";
      dg.beginPath(); dg.arc(4.5, 4.5, 1.7, 0, Math.PI * 2); dg.fill();
      const pattern = g.createPattern(dot, "repeat");

      const size = autoCanvas(ctx, cv);
      const mouse = { x: 0, y: 0, tx: 0, ty: 0 };
      ctx.on(wrap, "pointermove", (e) => {
        const r = cv.getBoundingClientRect();
        mouse.tx = ((e.clientX - r.left) / r.width) * 2 - 1;
        mouse.ty = ((e.clientY - r.top) / r.height) * 2 - 1;
      });
      // Sets the canvas transform for one layer and returns its on-screen scale
      const place = (L, t) => {
        const { w: W, h: H, dpr } = size();
        const S = Math.min(W, H * 1.15);
        const cx = W / 2 + L.px * Math.min(W, H * 1.4) + L.ox;
        const cy = H * 0.44 + L.py * H + L.oy;
        const k = (S * L.size) / UNIT;
        g.setTransform(dpr * k, 0, 0, dpr * k, cx * dpr, cy * dpr);
        g.rotate(t * L.spin);
        g.translate(-UNIT / 2, -UNIT / 2);
        return k;
      };
      ctx.raf((now) => {
        const t = now / 1000;
        mouse.x += (mouse.tx - mouse.x) * 0.06;
        mouse.y += (mouse.ty - mouse.y) * 0.06;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, cv.width, cv.height);
        for (const L of layers) {
          L.ox = -mouse.x * L.depth * 16;
          L.oy = -mouse.y * L.depth * 12;
          const k = place(L, t);
          L.path = L.anim.renderFrame();
          if (L.stroke) {
            g.globalCompositeOperation = "source-over";
            g.strokeStyle = L.stroke;
            g.lineWidth = 2 / k;
            g.stroke(L.path);
          } else {
            g.globalCompositeOperation = "multiply";
            g.fillStyle = L.dots ? pattern : L.color;
            g.fill(L.path);
          }
        }
        g.globalCompositeOperation = "source-over";
      });
      // Click: the topmost filled layer under the pointer springs into a new shape
      ctx.on(cv, "click", (e) => {
        const r = cv.getBoundingClientRect(), dpr = size().dpr, t = performance.now() / 1000;
        const hit = layers.slice().reverse().find((L) => {
          if (!L.path || L.stroke) return false;
          place(L, t);
          return g.isPointInPath(L.path, (e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr);
        });
        g.setTransform(1, 0, 0, 1, 0, 0);
        if (!hit) return;
        hit.anim.play();
        hit.anim.transition({ ...keyframe(1500, "elasticEnd1", { randomness: Math.min(14, opts.rand + 4) }), callback: () => loop(hit) });
      });
      const stepper = (label, key, lo, hi) => {
        const out = h("output", { text: String(opts[key]) });
        const btn = (d) => h("button", { class: "btn", type: "button", "aria-label": `${label}${d < 0 ? "減少" : "增加"}`, onclick: () => {
          opts[key] = Math.max(lo, Math.min(hi, opts[key] + d));
          out.textContent = opts[key];
          layers.forEach((L) => L.anim.transition({ ...keyframe(900, "elasticEnd0"), callback: () => loop(L) }));
        } }, d < 0 ? "－" : "＋");
        ctx.controls.append(h("div", { class: "ctl" }, h("span", { text: label }), btn(-1), out, btn(1)));
      };
      stepper("點數", "points", 1, 12);
      stepper("隨機度", "rand", 1, 14);
      const playBtn = ctx.toggle("流動中", true, (v) => {
        layers.forEach((L) => (v ? L.anim.play() : L.anim.pause()));
        playBtn.textContent = v ? "流動中" : "已暫停";
      });
    },
  },
  {
    id: "matrix", title: "參數矩陣",
    api: "blobs2.svgPath({ seed, extraPoints, randomness, size })",
    desc: "列是 extraPoints（頂點數 = 3 + extraPoints），欄是 randomness（半徑抖動幅度）；同一個 seed 下 25 格形狀永遠固定，換 seed 才換一整組。點數相同的路徑指令結構相同，所以能直接用 CSS 補間 d。",
    hint: "按「換種子」或開自動，比較同一列與同一欄的規律",
    mount(ctx) {
      const ROWS = [0, 2, 4, 7, 12], COLS = [0, 3, 6, 10, 16];
      let cells = `<div class="hd corner"><small>seed</small><b></b></div>`;
      COLS.forEach((r) => (cells += `<div class="hd">隨機<small>${r}</small></div>`));
      ROWS.forEach((e, i) => {
        cells += `<div class="hd">${3 + e} 點<small>+${e}</small></div>`;
        COLS.forEach(() => (cells += `<div class="cell"><svg viewBox="-6 -6 112 112"><path fill="${PAL[i]}" fill-opacity=".9"/></svg></div>`));
      });
      ctx.html(`<div class="pad mx morph">${cells}</div>`);
      const paths = ctx.$$(".cell path"), seedEl = ctx.$(".corner b");
      let seed = 2026, auto = true;
      const render = () => {
        seedEl.textContent = seed;
        let k = 0;
        for (const e of ROWS) for (const r of COLS) setD(paths[k++], blobs2.svgPath({ seed, extraPoints: e, randomness: r, size: 100 }));
      };
      const next = () => { seed = Math.floor(Math.random() * 9000) + 1000; render(); };
      ctx.button("換種子", next, { primary: true });
      ctx.toggle("自動", auto, (v) => (auto = v));
      ctx.interval(() => auto && next(), 2400);
      render();
    },
  },
  {
    id: "seed", title: "種子頭像",
    api: "blobs2.svgPath({ seed: \"陳怡君\", ... })",
    desc: "seed 可以是字串：把使用者名稱當種子，每次產生的頭像形狀都一樣，不必存圖；改用 Math.random() 當種子，每次重新產生都會變。下方比對每次輸出的路徑字串是否完全相同。名字為示意。",
    hint: "改第一格的名字・切換種子來源後按「重新產生」",
    mount(ctx) {
      const label = (name) => (/[一-鿿]/.test(name) ? name.slice(-2) : name.slice(0, 2).toUpperCase()) || "？";
      const cardHtml = (me) => `<div class="panel ava"><svg viewBox="-6 -6 112 112"><path/><text x="50" y="50"></text></svg>
        <div class="meta">${me ? `<input type="text" value="王小明" maxlength="12" aria-label="輸入名字">` : "<b></b>"}<small></small></div></div>`;
      ctx.html(`<div class="pad av morph">${cardHtml(true)}${NAMES.map(() => cardHtml(false)).join("")}</div>`);
      const cards = ctx.$$(".ava"), input = ctx.$("input");
      let mode = 0, round = 0, prev = [];
      const build = (name, i) => {
        const hv = hash(name);
        const o = { seed: mode === 0 ? name : Math.random(), extraPoints: 2 + (hv % 5), randomness: 4 + ((hv >>> 4) % 7), size: 100 };
        const el = cards[i];
        const d = blobs2.svgPath(o);
        setD(el.querySelector("path"), d);
        el.querySelector("path").setAttribute("fill", AV_COLORS[hv % AV_COLORS.length]);
        el.querySelector("text").textContent = label(name);
        if (i) el.querySelector("b").textContent = name;
        el.querySelector("small").textContent = `${3 + o.extraPoints} 點・隨機 ${o.randomness}`;
        return d;
      };
      const chip = h("span", { class: "sc-field chip" });
      const regen = () => {
        const names = [input.value.trim() || "？", ...NAMES];
        const ds = names.map(build);
        round++;
        if (prev.length) {
          const same = ds.filter((d, i) => d === prev[i]).length;
          cards.forEach((c, i) => { c.classList.toggle("same", ds[i] === prev[i]); c.classList.toggle("diff", ds[i] !== prev[i]); });
          chip.innerHTML = `第 ${round} 次：<b class="${same === ds.length ? "" : "bad"}">${same}/${ds.length}</b> 與上次相同`;
        } else chip.textContent = "按「重新產生」比對";
        prev = ds;
      };
      ctx.group(["名字當種子", "Math.random()"], 0, (i) => { mode = i; regen(); });
      ctx.button("重新產生", regen, { primary: true });
      ctx.controls.append(chip);
      ctx.on(input, "input", () => {
        const d = build(input.value.trim() || "？", 0);
        prev[0] = d;
      });
      regen();
      ctx.timeout(regen, 1600);
    },
  },
  {
    id: "outputs", title: "三種輸出",
    api: "blobs2.svg() / blobs2.svgPath() / blobs2.canvasPath(opts, { offsetX, offsetY })",
    desc: "同一組 blobOptions 產生三種輸出：完整 SVG 字串（可直接存檔）、只有 d 的路徑字串（拿來當 clipPath 裁照片）、Canvas 的 Path2D（offsetX／offsetY 平移後三色相加，做出錯版印刷效果）。",
    hint: "換種子或拖曳點數、隨機度，三格會同步改變",
    mount(ctx) {
      ctx.html(`<div class="pad outs">
        <div class="panel card"><h2>svg()<small>完整 SVG 字串</small></h2><div class="fillbox svgout"></div><pre></pre></div>
        <div class="panel card"><h2>svgPath()<small>當 clipPath 裁切照片</small></h2><div class="fillbox morph"><svg viewBox="-6 -6 212 212">
          <defs><clipPath id="blob-clip"><path/></clipPath></defs>
          <image href="_shared/img/photo-6.jpg" x="-50" y="0" width="300" height="200" preserveAspectRatio="xMidYMid slice" clip-path="url(#blob-clip)"/>
          <path class="outline" fill="none" stroke="#ecebe6" stroke-width="1.5" stroke-dasharray="4 4"/></svg></div></div>
        <div class="panel card"><h2>canvasPath()<small>offsetX／Y 錯版疊印</small></h2><div class="fillbox"><canvas></canvas></div></div>
      </div>`);
      const svgOut = ctx.$(".svgout"), pre = ctx.$("pre");
      const [clip, outline] = ctx.$$(".morph path");
      const cv = ctx.$("canvas"), g = cv.getContext("2d");
      const size = autoCanvas(ctx, cv);
      const o = { seed: 7, extraPoints: 5, randomness: 7, size: 200 };
      const render = () => {
        const str = blobs2.svg(o, { fill: PAL[1], stroke: "#ecebe6", strokeWidth: 2 });
        svgOut.innerHTML = str;
        pre.textContent = str.replace(/\s+/g, " ");
        const d = blobs2.svgPath(o);
        setD(clip, d);
        setD(outline, d);
      };
      // Three additive copies with orbiting offsets; generating the Path2D each frame is cheap.
      const INKS = [["#ff3355", 0], ["#33ff66", 2.094], ["#3366ff", 4.189]];
      ctx.raf((t) => {
        const { w, h: H, dpr } = size();
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, cv.width, cv.height);
        const k = Math.min(w, H) / 236;
        g.setTransform(dpr * k, 0, 0, dpr * k, (w / 2 - 100 * k) * dpr, (H / 2 - 100 * k) * dpr);
        g.globalCompositeOperation = "lighter";
        const amp = 3 + 6 * (0.5 + 0.5 * Math.sin(t / 800));
        for (const [ink, ph] of INKS) {
          g.fillStyle = ink;
          g.fill(blobs2.canvasPath(o, { offsetX: Math.cos(t / 700 + ph) * amp, offsetY: Math.sin(t / 700 + ph) * amp }));
        }
        g.globalCompositeOperation = "source-over";
      });
      ctx.button("換種子", () => { o.seed = Math.floor(Math.random() * 1e4); render(); }, { primary: true });
      ctx.slider("點數", { min: 0, max: 12, value: o.extraPoints, format: (v) => `${v + 3}` }, (v) => { o.extraPoints = v; render(); });
      ctx.slider("隨機度", { min: 0, max: 16, value: o.randomness }, (v) => { o.randomness = v; render(); });
      render();
    },
  },
  {
    id: "keyframes", title: "關鍵影格",
    api: "anim.transition(k1, k2, k3, k4) + play() / pause() / playPause()",
    desc: "一次傳入四個關鍵影格：各自的 delay、duration、timingFunction、點數與 canvasOptions 位移，點數不同也能補間；每格完成會呼叫 callback。中途再呼叫 transition() 會取代剩下的影格，它們的 callback 就不會執行。",
    hint: "按「插隊」看被取代的 callback 消失・暫停與繼續",
    mount(ctx) {
      const SEQ = [
        { name: "圓", duration: 900, timingFunction: "easeEnd", blob: { extraPoints: 3, randomness: 0 }, x: 20 },
        { name: "不規則", delay: 350, duration: 1300, timingFunction: "elasticEnd1", blob: { extraPoints: 10, randomness: 14 }, x: 210 },
        { name: "三角", delay: 300, duration: 900, timingFunction: "ease", blob: { extraPoints: 0, randomness: 1 }, x: 400 },
        { name: "回原點", delay: 500, duration: 1300, timingFunction: "easeStart", blob: { extraPoints: 5, randomness: 6 }, x: 20 },
      ];
      let segs = "";
      SEQ.forEach((k, i) => {
        if (k.delay) segs += `<div class="seg gap" style="flex:${k.delay}"><b>delay</b><span>${k.delay}</span></div>`;
        segs += `<div class="seg" data-i="${i}" style="flex:${k.duration}"><b>${i + 1}. ${k.name}</b>${k.timingFunction}・${3 + k.blob.extraPoints} 點</div>`;
      });
      ctx.html(`<div class="pad kf"><div class="fillbox"><canvas></canvas></div>
        <div class="panel tl"><div class="bar">${segs}<i class="head"></i></div><div class="log"></div></div></div>`);
      const cv = ctx.$("canvas"), g = cv.getContext("2d"), size = autoCanvas(ctx, cv);
      const head = ctx.$(".head"), logEl = ctx.$(".log"), segEls = ctx.$$(".seg[data-i]");
      const total = SEQ.reduce((s, k) => s + (k.delay || 0) + k.duration, 0);
      const anim = blobs2Animate.canvasPath();
      const lines = [];
      const log = (text, cls = "") => { lines.unshift(`<div class="${cls}">${text}</div>`); lines.length = Math.min(lines.length, 4); logEl.innerHTML = lines.join(""); };
      let elapsed = 0, running = false, paused = false, auto = true, run = 0;
      const sec = () => `+${(elapsed / 1000).toFixed(2)}s`;
      const start = () => {
        const my = ++run;
        elapsed = 0; running = true;
        head.classList.remove("off");
        anim.play(); paused = false;
        anim.transition(...SEQ.map((k, i) => {
          const f = {
            duration: k.duration, timingFunction: k.timingFunction,
            blobOptions: { seed: `kf${i}`, size: 180, ...k.blob },
            canvasOptions: { offsetX: k.x, offsetY: 20 },
            callback: () => {
              log(`${sec()} callback：第 ${i + 1} 格「${k.name}」完成`);
              if (i === SEQ.length - 1 && my === run) { running = false; if (auto) ctx.timeout(() => my === run && start(), 900); }
            },
          };
          if (k.delay) f.delay = k.delay;
          return f;
        }));
      };
      const cutIn = () => {
        const left = SEQ.filter((k, i) => elapsed < SEQ.slice(0, i + 1).reduce((s, x) => s + (x.delay || 0) + x.duration, 0)).length;
        const my = ++run;
        running = false;
        head.classList.add("off");
        log(`${sec()} 插隊 transition()：取代剩下 ${left} 格，它們的 callback 不會執行`, "warn");
        anim.play(); paused = false;
        anim.transition({ duration: 700, timingFunction: "elasticEnd0", blobOptions: { seed: Math.random(), extraPoints: 6, randomness: 10, size: 180 },
          canvasOptions: { offsetX: 210, offsetY: 20 },
          callback: () => { log("插隊影格完成，1 秒後重播序列"); if (my === run) ctx.timeout(() => my === run && start(), 1000); } });
      };
      ctx.raf((t, dt) => {
        if (running && !paused) elapsed = Math.min(total, elapsed + dt);
        head.style.left = `${(elapsed / total) * 100}%`;
        let acc = 0, on = -1;
        SEQ.forEach((k, i) => { acc += k.delay || 0; if (elapsed >= acc && elapsed < acc + k.duration) on = i; acc += k.duration; });
        segEls.forEach((s, i) => s.classList.toggle("on", running && i === on));
        const { w, h: H, dpr } = size();
        const k = Math.min(w / 600, H / 220);
        const ox = (w - 600 * k) / 2, oy = (H - 220 * k) / 2;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, cv.width, cv.height);
        g.setTransform(dpr * k, 0, 0, dpr * k, ox * dpr, oy * dpr);
        g.strokeStyle = "rgba(255,255,255,.12)";
        g.setLineDash([4, 6]);
        g.lineWidth = 1 / k;
        g.font = `500 ${11 / k}px ${MONO}`;
        g.fillStyle = "rgba(255,255,255,.35)";
        for (const x of [20, 210, 400]) { g.strokeRect(x, 20, 180, 180); g.fillText(`offsetX ${x}`, x + 4, 14); }
        g.setLineDash([]);
        const path = anim.renderFrame();
        g.fillStyle = PAL[1];
        g.globalAlpha = 0.9;
        g.fill(path);
        g.globalAlpha = 1;
        g.strokeStyle = "#ecebe6";
        g.lineWidth = 1.5 / k;
        g.stroke(path);
      });
      ctx.button("播放序列", start, { primary: true });
      ctx.button("插隊", cutIn);
      const pp = (fn, v) => () => { anim[fn](); paused = v == null ? !paused : v; };
      ctx.button("pause()", pp("pause", true));
      ctx.button("play()", pp("play", false));
      ctx.button("playPause()", pp("playPause"));
      ctx.toggle("自動重播", auto, (v) => (auto = v));
      start();
    },
  },
  {
    id: "easing", title: "緩動函數",
    api: "timingFunction: linear | ease | easeStart | easeEnd | elasticEnd0～3",
    desc: "八條跑道同時用八種 timingFunction 走同一段：位移來自 canvasOptions.offsetX，形狀同時補間，所以 elasticEnd 的回彈同時作用在位置與輪廓上；數字越大，回彈越強、振盪越快（elasticEnd3 會先衝過終點約六成）。虛線是起點與終點。",
    hint: "拖曳「時長」放慢・關掉變形只看位移",
    mount(ctx) {
      ctx.html(`<div class="lanes"><canvas></canvas></div>`);
      const cv = ctx.$("canvas"), g = cv.getContext("2d"), size = autoCanvas(ctx, cv);
      const UNIT = 100, LABEL = 96;
      let dur = 1400, morph = true, timer = 0, round = 0;
      const lanes = TF.map((tf, i) => ({ tf, color: PAL[i % 6], anim: blobs2Animate.canvasPath() }));
      const geo = () => {
        const { w, h: H, dpr } = size();
        const lh = H / TF.length, bs = Math.min(lh * 0.84, 70), k = bs / UNIT;
        // Leave room for the ~58% overshoot of elasticEnd3 on both ends: total span = 2.2 * L
        const L = Math.max(0, ((w - LABEL - 14) / k - UNIT) / 2.2);
        return { w, H, dpr, lh, bs, k, L, B: L * 0.6 };
      };
      const shape = (seed, extra) => ({ seed, extraPoints: morph ? extra : 4, randomness: morph ? 9 : 4, size: UNIT });
      lanes.forEach((ln) => ln.anim.transition({ duration: 0, blobOptions: shape("s0", 2), canvasOptions: { offsetX: geo().B } }));
      const cycle = () => {
        const { L, B } = geo();
        const a = morph ? `s${round}` : "s0", b = morph ? `s${round + 1}` : "s0";
        round += 2;
        lanes.forEach((ln) => ln.anim.transition(
          { duration: dur, timingFunction: ln.tf, blobOptions: shape(b, 8), canvasOptions: { offsetX: B + L } },
          { delay: 450, duration: dur, timingFunction: ln.tf, blobOptions: shape(a, 2), canvasOptions: { offsetX: B } },
        ));
        clearTimeout(timer);
        timer = ctx.timeout(cycle, 2 * dur + 1000);
      };
      ctx.raf(() => {
        const { w, H, dpr, lh, bs, k, L, B } = geo();
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, w, H);
        g.font = `500 11.5px ${MONO}`;
        g.textBaseline = "middle";
        const x0 = LABEL + B * k + bs / 2, x1 = x0 + L * k;
        g.strokeStyle = "rgba(255,255,255,.22)";
        g.setLineDash([3, 4]);
        g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0, H); g.moveTo(x1, 0); g.lineTo(x1, H); g.stroke();
        g.setLineDash([]);
        lanes.forEach((ln, i) => {
          const y0 = i * lh;
          g.setTransform(dpr, 0, 0, dpr, 0, 0);
          g.fillStyle = "#9b998f";
          g.fillText(ln.tf, 8, y0 + lh / 2);
          g.strokeStyle = "rgba(255,255,255,.07)";
          g.beginPath(); g.moveTo(LABEL, y0 + lh / 2); g.lineTo(w - 14, y0 + lh / 2); g.stroke();
          const path = ln.anim.renderFrame();
          g.setTransform(dpr * k, 0, 0, dpr * k, LABEL * dpr, (y0 + (lh - bs) / 2) * dpr);
          g.fillStyle = ln.color;
          g.fill(path);
        });
      });
      const replay = () => { lanes.forEach((ln) => ln.anim.transition({ duration: 250, blobOptions: shape("s0", 2), canvasOptions: { offsetX: geo().B } })); round = 0; clearTimeout(timer); timer = ctx.timeout(cycle, 400); };
      ctx.slider("時長", { min: 500, max: 3000, step: 100, value: dur, format: (v) => `${(v / 1000).toFixed(1)}s` }, (v) => (dur = v));
      ctx.toggle("同時變形", morph, (v) => { morph = v; replay(); });
      ctx.button("重播", replay, { primary: true });
      timer = ctx.timeout(cycle, 300);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × blobs2Animate.canvasPath().renderFrame()",
    desc: "每個色塊都是獨立的動畫物件，每 0.9 到 1.8 秒換成新的隨機形狀；逐級增加同時動畫的數量，直到掉到 30 FPS 以下。renderFrame 負責補間與生成新形狀，fill 是 Canvas 繪製成本。",
    hint: "按「自動加壓」開始；開「只算不畫」比較純計算的上限",
    mount(ctx) {
      ctx.html(`<div class="stress-x"><canvas></canvas></div>`);
      const cv = ctx.$("canvas"), g = cv.getContext("2d"), size = autoCanvas(ctx, cv);
      const UNIT = 100, items = [];
      let genMs = 0, drawMs = 0, draw = true, kf = 0, kfRate = 0;
      const make = (i) => {
        const it = { anim: blobs2Animate.canvasPath(), color: PAL[i % 6], e: 2 + (i % 5), r: 4 + (i % 7), dead: false };
        const blob = () => ({ seed: Math.random(), extraPoints: it.e, randomness: it.r, size: UNIT });
        const next = () => { if (it.dead) return; kf++; it.anim.transition({ duration: 900 + Math.random() * 900, timingFunction: "ease", blobOptions: blob(), callback: next }); };
        it.anim.transition({ duration: 0, blobOptions: blob(), callback: next });
        return it;
      };
      ctx.interval(() => { kfRate = kf; kf = 0; }, 1000);
      ctx.raf(() => {
        const { w, h: H, dpr } = size();
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, cv.width, cv.height);
        const n = items.length;
        if (!n || !w || !H) return;
        const cols = Math.max(1, Math.round(Math.sqrt((n * w) / H)));
        const rows = Math.ceil(n / cols);
        const cell = Math.min(w / cols, H / rows), k = (cell * 0.92) / UNIT;
        const ox = (w - cols * cell) / 2 + cell * 0.04, oy = (H - rows * cell) / 2 + cell * 0.04;
        const t0 = performance.now();
        const paths = items.map((it) => it.anim.renderFrame());
        const t1 = performance.now();
        if (draw) {
          for (let i = 0; i < n; i++) {
            g.setTransform(dpr * k, 0, 0, dpr * k, (ox + (i % cols) * cell) * dpr, (oy + Math.floor(i / cols) * cell) * dpr);
            g.fillStyle = items[i].color;
            g.fill(paths[i]);
          }
        }
        const t2 = performance.now();
        genMs = genMs * 0.9 + (t1 - t0) * 0.1;
        drawMs = drawMs * 0.9 + (t2 - t1) * 0.1;
      });
      ctx.toggle("只算不畫", false, (v) => (draw = !v));
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "同時動畫", unit: "個", steps: [25, 100, 250, 500, 1000, 2000, 4000, 8000],
        minFps: 30,
        apply(n) {
          while (items.length < n) items.push(make(items.length));
          while (items.length > n) items.pop().dead = true;
        },
        metrics: () => ({ "renderFrame": `${genMs.toFixed(1)} ms`, "fill 繪製": draw ? `${drawMs.toFixed(1)} ms` : "略過", "每秒新形狀": kfRate }),
        note: "每格都會對所有色塊呼叫 renderFrame()：沒換形狀時只做點的補間，換形狀那一格要重新生成並對齊點數。開「只算不畫」後剩下純 JS 計算，可以看出瓶頸在補間還是在 Canvas 填色。",
      });
    },
  },
] });
</script>
</body>
