<script>
const C = { c2: "#1f8fb8", c3: "#d61f69", c4: "#2f9e55", c5: "#e06a1b", c6: "#6a5ae0" };
const FONT = getComputedStyle(document.body).fontFamily;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// ---------- XML builders (all diagrams are generated in the page) ----------
const NSA = `xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" xmlns:color="http://www.omg.org/spec/BPMN/non-normative/color/1.0"`;
const doc = (body) => `<?xml version="1.0" encoding="UTF-8"?>\n<bpmn:definitions ${NSA} id="Defs" targetNamespace="http://bpmn.io/schema/bpmn">${body}</bpmn:definitions>`;
const plane = (ref, di) => `<bpmndi:BPMNDiagram id="D_${ref}"><bpmndi:BPMNPlane id="P_${ref}" bpmnElement="${ref}">${di}</bpmndi:BPMNPlane></bpmndi:BPMNDiagram>`;
const label = (x, y, w, h) => `<bpmndi:BPMNLabel><dc:Bounds x="${x}" y="${y}" width="${w}" height="${h}" /></bpmndi:BPMNLabel>`;
const shape = (id, x, y, w, h, extra = "", lbl = "") =>
  `<bpmndi:BPMNShape id="${id}_di" bpmnElement="${id}" ${extra}><dc:Bounds x="${x}" y="${y}" width="${w}" height="${h}" />${lbl}</bpmndi:BPMNShape>`;
const edge = (id, pts, lbl = "") =>
  `<bpmndi:BPMNEdge id="${id}_di" bpmnElement="${id}">${pts.map(([x, y]) => `<di:waypoint x="${x}" y="${y}" />`).join("")}${lbl}</bpmndi:BPMNEdge>`;

// Compact process builder: nodes [id, kind, name, cx, cy], flows [id, from, to, name?]; edges are routed orthogonally.
const KIND = { start: "startEvent", end: "endEvent", task: "task", user: "userTask", service: "serviceTask", send: "sendTask", receive: "receiveTask", xor: "exclusiveGateway", sub: "subProcess" };
const sizeOf = (k) => (k === "start" || k === "end" ? [36, 36] : k === "xor" ? [50, 50] : [100, 80]);
function flowParts(nodes, flows, inner = {}) {
  const by = Object.fromEntries(nodes.map((n) => [n[0], n]));
  const box = (n) => { const [w, h] = sizeOf(n[1]); return { x: n[3] - w / 2, y: n[4] - h / 2, w, h }; };
  const sem = nodes.map(([id, k, name]) => (k === "sub"
    ? `<bpmn:subProcess id="${id}" name="${name}">${inner[id] || ""}</bpmn:subProcess>`
    : `<bpmn:${KIND[k]} id="${id}"${name ? ` name="${name}"` : ""} />`)).join("")
    + flows.map(([id, s, t, name]) => `<bpmn:sequenceFlow id="${id}" sourceRef="${s}" targetRef="${t}"${name ? ` name="${name}"` : ""} />`).join("");
  const di = nodes.map((n) => {
    const b = box(n), k = n[1];
    const extra = k === "xor" ? 'isMarkerVisible="true"' : k === "sub" ? 'isExpanded="false"' : "";
    // Split gateways send branches up and down, so their label sits above, left of the vertical line.
    const lbl = k === "xor" && n[2] ? label(b.x - 54, b.y - 32, 72, 28) : "";
    return shape(n[0], b.x, b.y, b.w, b.h, extra, lbl);
  }).join("") + flows.map(([id, sId, tId]) => {
    const s = by[sId], t = by[tId], a = box(s), b = box(t);
    let pts;
    if (s[4] === t[4]) pts = [[a.x + a.w, s[4]], [b.x, t[4]]];
    else if (s[1] === "xor") pts = [[s[3], t[4] < s[4] ? a.y : a.y + a.h], [s[3], t[4]], [b.x, t[4]]];
    else if (t[1] === "xor") pts = [[a.x + a.w, s[4]], [t[3], s[4]], [t[3], s[4] < t[4] ? b.y : b.y + b.h]];
    else { const mx = (a.x + a.w + b.x) / 2; pts = [[a.x + a.w, s[4]], [mx, s[4]], [mx, t[4]], [b.x, t[4]]]; }
    return edge(id, pts);
  }).join("");
  return { sem, di };
}

    <bpmn:endEvent id="End_OK" name="請假完成"><bpmn:incoming>Flow_H</bpmn:incoming></bpmn:endEvent>
    <bpmn:sequenceFlow id="Flow_1" sourceRef="Start" targetRef="Task_Fill" />
    <bpmn:sequenceFlow id="Flow_2" sourceRef="Task_Fill" targetRef="Gateway_Days" />

    <bpmn:sequenceFlow id="Flow_Reject" name="否" sourceRef="Gateway_Approved" targetRef="Task_Notify" />

    <bpmn:textAnnotation id="Annot_1"><bpmn:text>病假超過 3 天須附診斷證明</bpmn:text></bpmn:textAnnotation>
    <bpmn:association id="Assoc_1" sourceRef="Task_Fill" targetRef="Annot_1" />
  </bpmn:process>
  ${plane("Collaboration_1", [
    shape("Participant_1", 160, 60, 930, 500, 'isHorizontal="true"'),
    shape("Lane_Emp", 190, 60, 900, 140, 'isHorizontal="true"'),
    shape("Lane_Mgr", 190, 200, 900, 220, 'isHorizontal="true"'),
    shape("Lane_HR", 190, 420, 900, 140, 'isHorizontal="true"'),
    shape("Start", 242, 112, 36, 36, EMP, label(232, 155, 56, 14)),
    shape("Task_Fill", 320, 90, 110, 80, EMP),
    shape("Annot_1", 560, 88, 170, 44),
    shape("Gateway_Days", 475, 285, 50, 50, GATE + ' isMarkerVisible="true"', label(396, 290, 72, 40)),
    shape("Task_Direct", 590, 220, 110, 80, MGR),
    shape("Task_Dept", 590, 320, 110, 80, MGR),
    shape("Gateway_Approved", 745, 285, 50, 50, GATE + ' isMarkerVisible="true"', label(802, 303, 40, 14)),
    shape("Task_Notify", 860, 90, 110, 80, NO),
    shape("End_Reject", 1012, 112, 36, 36, NO, label(1002, 155, 56, 14)),
    shape("Task_HR", 860, 450, 110, 80, HR),
    shape("End_OK", 1012, 472, 36, 36, HR, label(1002, 515, 56, 14)),
    edge("Flow_1", [[278, 130], [320, 130]]),

    edge("Flow_Short", [[525, 310], [555, 310], [555, 260], [590, 260]], label(561, 278, 14, 14)),

    edge("Flow_D1", [[700, 260], [722, 260], [722, 310], [745, 310]]),
    edge("Flow_D2", [[700, 360], [722, 360], [722, 310], [745, 310]]),

// Scene 8: a serpentine chain of n tasks between one start and one end event.
function bigXml(n, named) {
  const total = n + 2, cols = Math.max(4, Math.ceil(Math.sqrt(total * 1.6)));
  const at = (k) => { const r = Math.floor(k / cols), c = k % cols; return [(r % 2 ? cols - 1 - c : c) * 150 + 60, r * 130 + 60, r]; };
  const ev = (k) => k === 0 || k === total - 1;
  const sem = [], di = [];
  for (let k = 0; k < total; k++) {
    const [cx, cy, r] = at(k), w = ev(k) ? 36 : 100, h = ev(k) ? 36 : 80;
    sem.push(k === 0 ? `<bpmn:startEvent id="N${k}" />` : ev(k) ? `<bpmn:endEvent id="N${k}" />` : `<bpmn:task id="N${k}"${named ? ` name="任務 ${k}"` : ""} />`);
    di.push(shape(`N${k}`, cx - w / 2, cy - h / 2, w, h));
    if (!k) continue;
    const [px, py, pr] = at(k - 1), hw = (j) => (ev(j) ? 18 : 50), hh = (j) => (ev(j) ? 18 : 40), dir = Math.sign(cx - px);
    sem.push(`<bpmn:sequenceFlow id="F${k}" sourceRef="N${k - 1}" targetRef="N${k}" />`);
    di.push(edge(`F${k}`, pr === r ? [[px + dir * hw(k - 1), py], [cx - dir * hw(k), cy]] : [[px, py + hh(k - 1)], [cx, cy - hh(k)]]));
  }
  return doc(`<bpmn:process id="P_Big" isExecutable="false">${sem.join("")}</bpmn:process>${plane("P_Big", di.join(""))}`);
}

// Fit the current root into the canvas, keeping clear of the palette and the tag in the top right.
function fit(m, max = 1.2) {
  const canvas = m.get("canvas");
  canvas.resized();
  const { inner, outer } = canvas.viewbox();
  if (!inner.width || !outer.width) return;
  const pal = canvas.getContainer().querySelector(".djs-palette");
  const left = pal && pal.offsetWidth ? pal.offsetLeft + pal.offsetWidth + 12 : 16;
  const pad = { l: left, r: 16, t: 40, b: 40 };
  const w = Math.max(40, outer.width - pad.l - pad.r), h = Math.max(40, outer.height - pad.t - pad.b);
  const s = Math.min(w / inner.width, h / inner.height, max);
  canvas.viewbox({
    x: inner.x - (pad.l + (w - inner.width * s) / 2) / s,
    y: inner.y - (pad.t + (h - inner.height * s) / 2) / s,
    width: outer.width / s, height: outer.height / s,
  });
}
// Refit whenever the canvas box changes: window resize, the control bar wrapping, the side panel stacking.
function autoFit(ctx, m, max) {
  const el = m.get("canvas").getContainer();
  let raf = 0, lw = 0, lh = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (el.clientWidth === lw && el.clientHeight === lh) return;
      lw = el.clientWidth;
      lh = el.clientHeight;
      fit(m, max);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}

}

      const log = ctx.$(".bp-log");
      const seen = {};
      const add = (name, text, cls = "") => {
        const now = performance.now();
        if (cls && now - (seen[name] || 0) < 900) return;
        seen[name] = now;
        ctx.$(".bp-empty")?.remove();
        log.insertAdjacentHTML("afterbegin", `<li class="${cls}"><code>${esc(name)}</code> ${text}</li>`);
        while (log.children.length > 60) log.lastChild.remove();
      };
      let lock = false;
      const block = (name) => () => { if (!lock) return; add(name, "已攔截（回傳 false）", "bp-block"); return false; };
      bus.on("element.dblclick", 2000, block("element.dblclick"));
      bus.on("commandStack.elements.move.canExecute", 2000, block("elements.move.canExecute"));
      bus.on("commandStack.elements.delete.canExecute", 2000, block("elements.delete.canExecute"));
      bus.on("element.click", (e) => add("element.click", esc(nameOf(e.element))));
      bus.on("element.dblclick", (e) => add("element.dblclick", esc(nameOf(e.element))));
      bus.on("selection.changed", (e) => add("selection.changed", `選取 ${e.newSelection.length} 個`));
      bus.on("commandStack.executed", (e) => add(`commandStack.${e.command}.executed`, "", "bp-cmd"));
      bus.on("element.hover", (e) => tag.set(`滑過：<b>${esc(nameOf(e.element))}</b>`));
      const reset = () => { log.innerHTML = `<li class="bp-empty">還沒有事件。點選、拖曳或雙擊左側的元素試試。</li>`; };
      await importInto(m, TICKET);
      reset();
      fit(m);
      tag.set("把滑鼠移到元素上");
      ctx.toggle("鎖定編輯", false, (v) => { lock = v; tag.flash(v ? "已鎖定：雙擊、移動、刪除都會被攔下" : "已解除鎖定"); });
      ctx.button("清空紀錄", reset);
      autoFit(ctx, m);
    },
  },
  {
    id: "colors", title: "著色與 XML 往返", paper: true,
    api: "modeling.setColor(elements, { fill, stroke }) + saveXML() → importXML()",
    desc: "選好筆刷顏色後點元素，modeling.setColor 會把顏色寫進 DI（BPMN in Color 的 color:background-color 與 color:border-color）。右側是 saveXML 的即時結果，著色的那幾行會標黃；按「存檔再匯入」證明顏色跟著 XML 走。",
    hint: "選筆刷顏色後點元素上色；或按「依類型上色」",
    async mount(ctx) {
      const m = modelerIn(ctx, layout(ctx, { side: `<div class="bp-side"><div class="bp-cap"></div><pre class="bp-pre"></pre></div>` }));
      const tag = tagger(ctx);
      const modeling = m.get("modeling"), registry = m.get("elementRegistry");
      const cap = ctx.$(".bp-cap"), pre = ctx.$(".bp-pre");
      const SWATCH = [["藍", "#d6ebf4", C.c2], ["綠", "#d7efe0", C.c4], ["紫", "#e5e1fb", C.c6], ["橘", "#fde5d2", C.c5], ["紅", "#fbe3ec", C.c3]];
      const paint = (els, i) => modeling.setColor(els, { fill: SWATCH[i][1], stroke: SWATCH[i][2] });
      let brush = 0, busy = 0;
      async function render() {
        const id = ++busy;
        const { xml } = await m.saveXML({ format: true });
        if (id !== busy) return;
        const lines = xml.split("\n").filter((l) => l.includes("<bpmndi:BPMNShape"));
        const colored = lines.filter((l) => l.includes("color:")).length;
        cap.innerHTML = `saveXML 結果：<span class="n">${Showcase.fmt(xml.length)}</span> 字元・著色 <span class="n">${colored}</span>／${lines.length} 個圖形`;
        pre.innerHTML = lines.map((l) => (l.includes("color:") ? `<mark>${esc(l.trim())}</mark>` : esc(l.trim()))).join("\n");
      }
      ctx.select("筆刷", SWATCH.map((s, i) => ({ value: String(i), label: s[0] })), "0", (v) => { brush = +v; });
      ctx.button("依類型上色", () => {
        const nodes = registry.filter(isNode);
        const pick = (re) => nodes.filter((e) => re.test(e.type));
        paint(pick(/UserTask/), 0);
        paint(pick(/ServiceTask|SendTask/), 1);
        paint(pick(/Gateway/), 3);
        paint(pick(/Event/), 2);
        tag.flash("使用者任務藍、系統任務綠、閘道橘、事件紫");
      });
      ctx.button("清除", () => modeling.setColor(registry.filter(isNode), null));
      ctx.button("存檔再匯入", () => quiet((async () => {
        const { xml } = await m.saveXML();
        await importInto(m, xml);
        fit(m);
        render();
        tag.flash(`重新匯入 <span class="n">${Showcase.fmt(xml.length)}</span> 字元，顏色保留`);
      })()));
      m.on("element.click", (e) => { if (isNode(e.element)) paint([e.element], brush); });
      m.on("commandStack.changed", () => quiet(render()));
      await importInto(m, TICKET);
      fit(m);
      tag.set("點元素套用筆刷顏色");
      await render();
      autoFit(ctx, m);
    },
  },
  {
    id: "drill", title: "子流程鑽取", paper: true,
    api: "canvas.setRootElement(root) + 收合子流程的獨立 BPMNPlane",
    desc: "收合的子流程在 XML 裡有自己的 BPMNDiagram，bpmn-js 會為每個平面建立一個根元素。點子流程右下角的箭頭或上方按鈕，用 canvas.setRootElement 切換根，左上角出現麵包屑可以回上層。",
    hint: "點子流程右下角的箭頭鑽進去；用左上角麵包屑或按鈕回主流程",
    async mount(ctx) {
      const m = modelerIn(ctx, layout(ctx));
      const tag = tagger(ctx);
      const canvas = m.get("canvas"), registry = m.get("elementRegistry");
      const ROOTS = [["主流程", "P_Cert"], ["資格審查", "C_Check_plane"], ["繳費與製證", "C_Pay_plane"]];
      await importInto(m, CERT);
      const group = ctx.group(ROOTS.map((r) => r[0]), 0, (i) => canvas.setRootElement(registry.get(ROOTS[i][1])));
      const sync = () => {
        const root = canvas.getRootElement();
        const i = ROOTS.findIndex((r) => r[1] === root.id);
        group.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
        const count = registry.filter((e) => isNode(e) && canvas.findRoot(e) === root).length;
        tag.set(`根元素 <b>${esc(nameOf(root))}</b>（<span class="n">${esc(root.id)}</span>）・節點 <span class="n">${count}</span>・平面 <span class="n">${canvas.getRootElements().length}</span> 個`);
        fit(m, 1.3);
      };
      // Drilldown centering also reacts to root.set, so fit on the next frame.
      m.on("root.set", () => ctx.timeout(sync, 0));
      sync();
      autoFit(ctx, m, 1.3);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "modeler.importXML(xml) + import.parse.complete 事件",
    desc: "每一級在頁內產生一條 N 個任務的蛇形流程 XML，計時 importXML 到畫面更新完成，並用 import.parse.complete 事件拆出「解析 XML」與「建立圖形」兩段，最新一級的拆分顯示在右上角。",
    hint: "按「開始測試」；關掉「任務名稱」再測，比較文字量測的成本",
    async mount(ctx) {
      ctx.html(`<div class="bp-stress bp-card bp-nopal"><div class="bp-canvas"></div><div class="bp-tag"></div></div>`);
      ctx.controls.classList.add("bottom");
      const m = modelerIn(ctx, ctx.$(".bp-canvas"));
      const tag = tagger(ctx);
      let named = true, tParse = 0;
      m.on("import.parse.complete", () => { tParse = performance.now(); });
      ctx.toggle("任務名稱", named, (v) => { named = v; });
      await importInto(m, bigXml(40, true));
      fit(m);
      tag.set("目前 <span class=\"n\">40</span> 個任務");
      autoFit(ctx, m);
      ctx.bench({
        label: "任務", unit: "個", sizes: [50, 100, 250, 500, 1000, 2000, 4000, 8000, 16000], budget: 2000,
        // Clear the previous diagram outside the timed run, otherwise its teardown lands on the next size.
        prepare: (n) => { m.clear(); return bigXml(n, named); },
        async run(n, xml) {
          const t0 = performance.now();
          await importInto(m, xml);
          const t1 = performance.now();
          await ctx.frame(1);
          fit(m);
          tag.set(`<span class="n">${Showcase.fmt(n)}</span> 個任務・XML <span class="n">${(xml.length / 1024).toFixed(0)}</span> KB・解析 <span class="n">${Showcase.fmtMs(tParse - t0)}</span>・建圖 <span class="n">${Showcase.fmtMs(t1 - tParse)}</span>`);
        },
        note: "計時從呼叫 importXML 到下一幀畫面，上一張圖在計時前先清掉。前段是 bpmn-moddle 把 XML 解析成模型物件，後段由 importer 為每個元素與連線建立 SVG 與互動層；本機實測後段約佔九成。關掉「任務名稱」後耗時差異落在量測誤差內，標籤文字不是主要成本，瓶頸在圖形數量本身。",
      });
    },
  },
] });
</script>
</body>
