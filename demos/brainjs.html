<body>
<script src="https://cdn.jsdelivr.net/npm/brain.js@2.0.0-beta.24/dist/browser.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// brain.js showcase: feed-forward nets, decision boundaries, option comparisons,
// recurrent time-step forecasting, object outputs, serialization and a training-throughput benchmark.

// ---------- shared helpers ----------
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const BLUE = [76, 201, 240], PINK = [247, 37, 133];
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

// Seeded PRNG so datasets look the same on every visit.
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646;
}

// Size a canvas to its CSS box (device pixels) and return a 2D context in CSS pixels.
function fit(canvas) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.max(1, Math.round(w * dpr));
    canvas.height = Math.max(1, Math.round(h * dpr));
  }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h };
}

function tag(g, text, x, y, color) {
  g.font = `600 11px ${cssVar("--mono")}`;
  const w = g.measureText(text).width + 10;
  g.fillStyle = "rgba(14,16,19,.72)";
  g.beginPath(); g.roundRect(x, y, w, 18, 5); g.fill();
  g.fillStyle = color || "#ecebe6";
  g.textBaseline = "middle";
  g.fillText(text, x + 5, y + 9.5);
}

// 2D two-class datasets in the unit square: { input: [x, y], output: [0 | 1] }
const DATASETS = {
  xor(r) {
    const out = [];
    for (const [cx, cy, c] of [[0.25, 0.25, 0], [0.75, 0.75, 0], [0.25, 0.75, 1], [0.75, 0.25, 1]]) {
      for (let i = 0; i < 26; i++) out.push({ input: [cx + (r() - 0.5) * 0.3, cy + (r() - 0.5) * 0.3], output: [c] });
    }
    return out;
  },
  circle(r) {
    const out = [];
    for (let i = 0; i < 140; i++) {
      const inner = i % 2 === 0;
      const rad = inner ? r() * 0.2 : 0.3 + r() * 0.16;
      const a = r() * Math.PI * 2;
      out.push({ input: [0.5 + Math.cos(a) * rad, 0.5 + Math.sin(a) * rad], output: [inner ? 1 : 0] });
    }
    return out;
  },
  spiral(r) {
    const out = [];
    for (let c = 0; c < 2; c++) {
      for (let i = 0; i < 70; i++) {
        const t = i / 70;
        const a = t * Math.PI * 3 + c * Math.PI;
        const rad = 0.05 + t * 0.4;
        out.push({ input: [0.5 + Math.cos(a) * rad + (r() - 0.5) * 0.03, 0.5 + Math.sin(a) * rad + (r() - 0.5) * 0.03], output: [c] });
      }
    }
    return out;
  },
};

// Paint the network's prediction over the unit square into an off-screen res x res bitmap.
function heatBitmap(net, res, off) {
  off.width = res; off.height = res;
  const g = off.getContext("2d");
  const img = g.createImageData(res, res);
  const bg = [23, 26, 31];
  for (let j = 0; j < res; j++) {
    for (let i = 0; i < res; i++) {
      const p = clamp01(net.run([(i + 0.5) / res, 1 - (j + 0.5) / res])[0]);
      const conf = Math.abs(p - 0.5) * 2;
      const c = mix(bg, mix(BLUE, PINK, p), 0.25 + conf * 0.45);
      const k = (j * res + i) * 4;
      img.data[k] = c[0]; img.data[k + 1] = c[1]; img.data[k + 2] = c[2]; img.data[k + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return off;
}

function drawPoints(g, data, x0, y0, size, radius = 4) {
  for (const d of data) {
    g.beginPath();
    g.arc(x0 + d.input[0] * size, y0 + (1 - d.input[1]) * size, radius, 0, Math.PI * 2);
    g.fillStyle = rgb(d.output[0] > 0.5 ? PINK : BLUE);
    g.fill();
    g.lineWidth = 1.2;
    g.strokeStyle = "rgba(255,255,255,.85)";
    g.stroke();
  }
}

// Error curves on a log axis. series: [{ color, pts: [[iter, err], ...] }]
function drawCurves(g, w, h, series, maxIter, thresh) {
  g.clearRect(0, 0, w, h);
  const L = 46, R = 12, T = 12, B = 24;
  const lo = Math.log10(1e-4), hi = Math.log10(0.5);
  const X = (i) => L + (i / maxIter) * (w - L - R);
  const Y = (e) => T + (1 - (Math.log10(Math.max(1e-4, Math.min(0.5, e))) - lo) / (hi - lo)) * (h - T - B);
  g.font = `11px ${cssVar("--mono")}`;
  g.fillStyle = cssVar("--muted");
  g.strokeStyle = "rgba(127,127,127,.18)";
  g.lineWidth = 1;
  g.textBaseline = "middle";
  for (const e of [0.5, 0.1, 0.01, 0.001, 0.0001]) {
    const y = Y(e);
    g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke();
    g.textAlign = "right"; g.fillText(String(e), L - 6, y);
  }
  g.textAlign = "center";
  for (let k = 0; k <= 4; k++) g.fillText(String(Math.round((maxIter * k) / 4)), X((maxIter * k) / 4), h - 10);
  if (thresh) {
    g.setLineDash([5, 4]); g.strokeStyle = cssVar("--muted");
    g.beginPath(); g.moveTo(L, Y(thresh)); g.lineTo(w - R, Y(thresh)); g.stroke();
    g.setLineDash([]);
    g.textAlign = "left"; g.fillText(`errorThresh ${thresh}`, L + 6, Y(thresh) - 9);
  }
  g.lineWidth = 2.2;
  for (const s of series) {
    g.strokeStyle = s.color;
    g.beginPath();
    s.pts.forEach(([i, e], k) => (k ? g.lineTo(X(i), Y(e)) : g.moveTo(X(i), Y(e))));
    g.stroke();
  }
  g.textAlign = "left";
}

// Train in small chunks until roughly `budget` ms have passed; returns iterations done this frame.
function trainFor(net, data, opts, budget, state) {
  const t0 = performance.now();
  let done = 0;
  while (performance.now() - t0 < budget) {
    const k = state.chunk || 2;
    const s0 = performance.now();
    const res = net.train(data, { ...opts, iterations: k });
    done += res.iterations;
    state.error = res.error;
    const dt = performance.now() - s0;
    state.chunk = Math.max(1, Math.min(200, Math.round(k * (dt < 2 ? 2 : dt > 6 ? 0.5 : 1))));
    if (res.error <= opts.errorThresh) { state.converged = true; break; }
  }
  return done;
}

// ---------- scene 1 data ----------
const hex = ({ r, g, b }) => "#" + [r, g, b].map((v) => Math.round(v * 255).toString(16).padStart(2, "0")).join("");
const parseHex = (s) => ({ r: parseInt(s.slice(1, 3), 16) / 255, g: parseInt(s.slice(3, 5), 16) / 255, b: parseInt(s.slice(5, 7), 16) / 255 });
const SEED = [
  ["#000000", 1], ["#ffffff", 0], ["#1d3557", 1], ["#f1faee", 0], ["#e63946", 1], ["#ffd166", 0],
  ["#06d6a0", 0], ["#118ab2", 1], ["#7b2cbf", 1], ["#f4a261", 0], ["#2b2d42", 1], ["#a8dadc", 0],
];
const seedData = () => SEED.map(([h, w]) => ({ input: parseHex(h), output: { white: w } }));

// ---------- scene 5 data: 5x7 digit glyphs ----------
const GLYPHS = [
  "01110100011001110101110011000101110", "00100011000010000100001000010001110",
  "01110100010000100010001000100011111", "11111000100010000010000011000101110",
  "00010001100101010010111110001000010", "11111100001111000001000011000101110",
  "00110010001000011110100011000101110", "11111000010001000100010000100001000",
  "01110100011000101110100011000101110", "01110100011000101111000010001001100",
].map((s) => [...s].map(Number));

Showcase.run({ scenes: [
  {
    id: "color", title: "文字配色",
    api: "new brain.NeuralNetwork({ hiddenLayers: [5] }).train(data)",
    desc: "前饋網路的招牌用法：輸入背景色 RGB（物件格式 {r,g,b}），輸出白字的機率 {white}。點色塊糾正判斷，網路會把你的教學加進訓練資料並重新訓練。",
    hint: "點色塊糾正・選色器測試新顏色",
    mount(ctx) {
      ctx.el.classList.add("scroll");
      ctx.html(`
        <div class="bj-pad bj-color">
          <div class="left">
            <div class="bj-preview"><div><b>台灣 JS 圖鑑</b><small class="pv">Aa 0123</small></div></div>
            <div class="bj-pick">
              <input type="color" class="pick" value="#2a9d8f" aria-label="背景色">
              <button class="btn rand" type="button">隨機顏色</button>
            </div>
            <div class="bj-meter bj-k">網路判斷<div class="track"><i class="w"></i><i class="k"></i></div><span class="mtext">白字 50%</span></div>
            <div>
              <div class="bj-card bj-loss"><canvas class="bj-cv"></canvas></div>
              <div class="bj-lossline"><span>訓練誤差</span><span>第 <b class="bj-num bj-acc iter">0</b> 回・誤差 <b class="bj-num bj-acc err">-</b></span></div>
            </div>
          </div>
          <div>
            <h3>點色塊可以糾正網路（切換黑字／白字），它會立刻重新訓練</h3>
            <div class="bj-grid"></div>
            <div class="bj-btns" style="margin-top:10px">
              <button class="btn shuffle" type="button">換一組色塊</button>
              <button class="btn reset" type="button">清除教學</button>
            </div>
          </div>
        </div>`);
      const r = rng(3);
      const randomColor = () => ({ r: r(), g: r(), b: r() });
      let taught = [], swatches = [], net, history = [], res = { iterations: 0, error: 0 }, shown = 0;

      const train = () => {
        net = new brain.NeuralNetwork({ hiddenLayers: [5] });
        history = [];
        const data = [...seedData(), ...taught.map((t) => ({ input: t.c, output: { white: t.w } }))];
        res = net.train(data, { iterations: 3000, errorThresh: 0.003, learningRate: 0.3, callbackPeriod: 20, callback: (s) => history.push(s.error) });
        shown = 0;
      };
      const cv = ctx.$(".bj-loss canvas");
      ctx.raf(() => {
        if (shown >= history.length && shown !== 0) return;
        shown = Math.min(history.length, shown + Math.max(1, Math.ceil(history.length / 30)));
        const { g, w, h } = fit(cv);
        g.clearRect(0, 0, w, h);
        const max = Math.max(...history, 0.01);
        const grad = g.createLinearGradient(0, 0, w, 0);
        grad.addColorStop(0, "#f72585"); grad.addColorStop(0.5, "#9d8cff"); grad.addColorStop(1, "#4cc9f0");
        g.strokeStyle = grad; g.lineWidth = 3; g.beginPath();
        for (let i = 0; i < shown; i++) {
          const x = (i / Math.max(1, history.length - 1)) * (w - 12) + 6;
          const y = h - 8 - (history[i] / max) * (h - 16);
          i ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.stroke();
        ctx.$(".iter").textContent = Math.round((shown / Math.max(1, history.length)) * res.iterations);
        ctx.$(".err").textContent = shown >= history.length ? res.error.toFixed(4) : (history[shown - 1] ?? res.error).toFixed(4);
        if (!history.length) shown = 1;
      });
      ctx.onResize(() => { shown = 0; });

      const predict = (c) => net.run(c).white;
      const renderGrid = () => {
        const grid = ctx.$(".bj-grid");
        grid.replaceChildren();
        for (const s of swatches) {
          const p = predict(s.c);
          const b = Showcase.h("button", { class: `bj-sw${s.taught ? " taught" : ""}`, type: "button", title: `${hex(s.c)}，點一下改成${p > 0.5 ? "黑字" : "白字"}` });
          b.style.background = hex(s.c);
          b.style.color = p > 0.5 ? "#fff" : "#111";
          b.innerHTML = `Aa<small>${Math.round(Math.max(p, 1 - p) * 100)}%</small>`;
          b.addEventListener("click", () => {
            const w = p > 0.5 ? 0 : 1;
            taught = taught.filter((t) => t.c !== s.c).concat({ c: s.c, w });
            s.taught = true;
            update();
          });
          grid.append(b);
        }
      };
      const renderPreview = () => {
        const c = parseHex(ctx.$(".pick").value);
        const p = predict(c);
        const pv = ctx.$(".bj-preview");
        pv.style.background = hex(c);
        pv.style.color = p > 0.5 ? "#fff" : "#111";
        ctx.$(".pv").textContent = `${hex(c).toUpperCase()}・建議${p > 0.5 ? "白字" : "黑字"}`;
        ctx.$(".track .w").style.width = `${p * 100}%`;
        ctx.$(".track .k").style.width = `${(1 - p) * 100}%`;
        ctx.$(".mtext").textContent = `白字 ${Math.round(p * 100)}%・黑字 ${Math.round((1 - p) * 100)}%`;
      };
      const newSwatches = () => { swatches = Array.from({ length: innerWidth < 640 ? 12 : 20 }, () => ({ c: randomColor(), taught: false })); };

          line: { width: 1, color: "rgba(155,153,143,.55)" },
          inputs: { color: "rgba(76,201,240,.75)", labels: ["R", "G", "B"] },
          hidden: { color: "rgba(247,223,30,.75)" },
          outputs: { color: "rgba(247,37,133,.75)" },
        }).replace("<svg", `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"`);
        box.querySelectorAll("text").forEach((t) => t.setAttribute("fill", cssVar("--fg")));
        let maxJ = 0, maxF = 0;
        const rowsHtml = SAMPLES.map((s) => {
          const c = parseHex(s);
          const a = net.run(c).white, b = restored.run(c).white, f = fn(c).white;
          maxJ = Math.max(maxJ, Math.abs(a - b)); maxF = Math.max(maxF, Math.abs(a - f));
          return `<tr><td><i style="background:${s}"></i>${s}</td><td>${a.toFixed(6)}</td><td>${b.toFixed(6)}</td><td>${f.toFixed(6)}</td></tr>`;
        }).join("");
        ctx.$(".bj-table").innerHTML = `<table><thead><tr><th>背景色</th><th>net.run</th><th>fromJSON 還原</th><th>toFunction</th></tr></thead><tbody>${rowsHtml}</tbody></table>
          <div class="bj-k" style="margin-top:4px">最大差異：fromJSON <b class="bj-num">${maxJ.toExponential(1)}</b>・toFunction <b class="bj-num">${maxF.toExponential(1)}</b>（函式用 64 位元浮點運算，網路內部是 Float32Array，差在小數第 7 位左右）</div>`;
        show();
      };
      const show = () => {
        const text = view === 0 ? JSON.stringify(json, null, 2) : fn.toString();
        ctx.$(".bj-code pre").textContent = text;
        ctx.$(".kind").textContent = view === 0 ? "toJSON()" : "toFunction().toString()";
        ctx.$(".bytes").textContent = `${Showcase.fmt(new Blob([text]).size)} bytes`;
      };
      ctx.group(["JSON", "函式"], 0, (i) => { view = i; show(); });
      ctx.button("重新訓練", train);
      train();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "net.train(samples, { iterations: 1 })",
    desc: "每一級產生 N 筆 16 維隨機樣本，對同一個網路做一個完整 epoch 的反向傳播（全部在主執行緒的 CPU 上），量耗時並換算每秒能訓練幾筆樣本。網路越大，每筆樣本的乘加次數越多。",
    hint: "選網路大小後按「開始測試」；右側圖表比較各級吞吐量",
    mount(ctx) {
      ctx.html(`<div class="bj-stress bj-card"><canvas class="bj-cv"></canvas></div>`);
      const NETS = {
        s: { label: "小 16→[32]→1", hidden: [32] },
        m: { label: "中 16→[128,128]→1", hidden: [128, 128] },
        l: { label: "大 16→[512,512]→1", hidden: [512, 512] },
      };
      let key = "m", net;
      const macs = () => { const s = [16, ...NETS[key].hidden, 1]; let m = 0; for (let i = 1; i < s.length; i++) m += s[i] * s[i - 1]; return m; };
      const newNet = () => { net = new brain.NeuralNetwork({ hiddenLayers: NETS[key].hidden }); };
      newNet();
      ctx.controls.classList.add("bottom");
      ctx.select("網路", Object.entries(NETS).map(([value, n]) => ({ value, label: n.label })), key, (v) => { key = v; newNet(); });
      const r = rng(9);
      const b = ctx.bench({
        label: "樣本數", unit: "筆", sizes: [500, 2000, 10000, 50000, 200000],
        prepare(n) {
          const out = new Array(n);
          for (let i = 0; i < n; i++) {
            const input = new Array(16);
            for (let k = 0; k < 16; k++) input[k] = r();
            out[i] = { input, output: [input[0] * input[1] + input[2] > 0.6 ? 1 : 0] };
          }
          return out;
        },
        run(n, data) {
          const res = net.train(data, { iterations: 1, errorThresh: 0.0001, learningRate: 0.1 });
          return `誤差 ${res.error.toFixed(3)}`;
        },
        note: "每筆樣本要做一次前向、一次反向傳播與權重更新。brain.js 的 NeuralNetwork 是純 JS 迴圈，不走 GPU；NeuralNetworkGPU 需要 gpu.js 的 WebGL 後端，這裡不測。",
      });
      const cv = ctx.$("canvas");
      ctx.raf(() => {
        const { g, w, h } = fit(cv);
        g.clearRect(0, 0, w, h);
        const left = w > 420 ? 16 : 10;
        g.fillStyle = cssVar("--fg");
        g.font = `600 14px ${cssVar("--font")}`;
        g.textBaseline = "top"; g.textAlign = "left";
        g.fillText("訓練吞吐量（每秒樣本數）", left, 14);
        g.font = `12px ${cssVar("--mono")}`;
        g.fillStyle = cssVar("--muted");
        g.fillText(`${NETS[key].label}・每筆約 ${Showcase.fmtCompact(macs())} 次乘加`, left, 36);
        const res = b.results;
        if (!res.length) { g.fillText("尚未測試", left, 64); return; }
        const rates = res.map((x) => x.n / (x.ms / 1000));
        const max = Math.max(...rates);
        const top = 66, rowH = Math.min(46, (h - top - 20) / 5);
        res.forEach((x, i) => {
          const y = top + i * rowH;
          const bw = Math.max(2, (rates[i] / max) * (w - left * 2 - 150));
          g.fillStyle = cssVar("--muted"); g.textBaseline = "middle";
          g.fillText(`${Showcase.fmtCompact(x.n)} 筆`, left, y + rowH / 2);
          g.fillStyle = x.ms <= 1000 ? "#7bd389" : x.ms <= 2000 ? "#ff8c42" : "#f72585";
          g.fillRect(left + 70, y + rowH * 0.22, bw, rowH * 0.56);
          g.fillStyle = cssVar("--fg");
          g.fillText(`${Showcase.fmtCompact(rates[i])}/秒`, left + 76 + bw, y + rowH / 2);
        });
      });
    },
  },
] });
</script>
</body>
</html>
