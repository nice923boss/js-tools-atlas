<script>
// Butterchurn showcase: MilkDrop presets rendered with WebGL2, driven by Web Audio or by hand-fed sample arrays.
const LIB = "https://cdn.jsdelivr.net/npm/butterchurn@2.6.7/lib/butterchurn.min.js";
const PACK_BASE = "https://cdn.jsdelivr.net/npm/butterchurn-presets@2.4.7/lib/";
// Raw (uncompressed) file sizes from the npm package listing; the transferred size is measured at runtime.
const PACKS = [
  { key: "butterchurnPresetsMinimal", label: "Minimal", raw: 191443 },
  { key: "butterchurnPresets", label: "主包", raw: 653572 },
  { key: "butterchurnPresetsMD1", label: "MD1", raw: 284134 },
  { key: "butterchurnPresetsExtra", label: "Extra", raw: 844754 },
  { key: "butterchurnPresetsExtra2", label: "Extra2", raw: 609623 },
];
const FIRST = "Flexi, martin + geiss - dedicated to the sherwin maxawow";
const { fmt, fmtCompact, fmtMs } = Showcase;
const kb = (n) => `${fmt(n / 1024, n < 10240 ? 1 : 0)} KB`;

function abortIfGone(ctx) { if (!ctx.active) throw new DOMException("Scene unmounted", "AbortError"); }
async function lib(ctx) {
  await Showcase.load(LIB);
  abortIfGone(ctx);
  return window.butterchurn.default || window.butterchurn;
}
async function loadPack(ctx, key) {
  await Showcase.load(PACK_BASE + key + ".min.js");
  abortIfGone(ctx);
  const m = window[key];
  return (m.default || m).getPresets();
}
function packBytes(key) {
  const e = performance.getEntriesByType("resource").find((r) => r.name === PACK_BASE + key + ".min.js");
  return e && e.encodedBodySize ? e.encodedBodySize : 0;
}

// ---------- audio: one AudioContext, buffers rendered once ----------
let AC = null;
const audioCtx = () => AC || (AC = new AudioContext());
function makeBuffer(sec, chans, fill) {
  const ac = audioCtx(), sr = ac.sampleRate, buf = ac.createBuffer(chans, Math.round(sec * sr), sr);
  for (let c = 0; c < chans; c++) fill(buf.getChannelData(c), sr, c);
  return buf;
}
function hit(d, sr, at, len, fn) {
  const s0 = Math.round(at * sr), n = Math.min(Math.round(len * sr), d.length - s0);
  for (let i = 0; i < n; i++) d[s0 + i] += fn(i / sr);
}
const BUFFERS = {
  loop: async () => audioCtx().decodeAudioData(await (await fetch("_shared/audio/loop.mp3")).arrayBuffer()),
  // Two bars of a 120 BPM beat with a strong kick, so bass-driven presets pulse clearly.
  drums: () => makeBuffer(4, 1, (d, sr) => {
    const S = 0.125;
    const kick = (t) => 0.9 * Math.exp(-t * 6) * Math.sin(2 * Math.PI * (45 * t + (110 / 18) * (1 - Math.exp(-t * 18))));
    const snare = (t) => (Math.random() * 2 - 1) * 0.45 * Math.exp(-t * 15) + 0.3 * Math.sin(2 * Math.PI * 185 * t) * Math.exp(-t * 14);
    const hat = (t) => (Math.random() * 2 - 1) * 0.16 * Math.exp(-t * 50);
    [0, 6, 8, 11, 16, 22, 24, 27, 30].forEach((s) => hit(d, sr, s * S, 0.5, kick));
    [4, 12, 20, 28].forEach((s) => hit(d, sr, s * S, 0.3, snare));
    for (let s = 0; s < 32; s += 2) hit(d, sr, s * S, 0.1, hat);
  }),
};
const jobs = {};
const getBuffer = (k) => jobs[k] || (jobs[k] = Promise.resolve().then(BUFFERS[k]).catch((e) => { delete jobs[k]; throw e; }));
const SOURCES = {
  loop: { label: "音樂", level: 0.8 },
  drums: { label: "鼓組", level: 0.7 },
  mic: { label: "麥克風", level: 0 },
  synth: { label: "自餵陣列", level: 0 },
  silence: { label: "靜音", level: 0 },
};

// Synthetic 100 BPM signal in butterchurn's own format (1024 unsigned bytes, 128 = silence).
const FAKE = new Uint8Array(1024);
function synthLevels(t, bpm = 100) {
  const beat = ((t * bpm) / 60) % 1, kick = Math.exp(-beat * 7), hat = Math.exp(-((beat * 2) % 1) * 18);
  for (let i = 0; i < FAKE.length; i++) {
    const s = i / 44100 + t;
    const v = 0.55 * kick * Math.sin(2 * Math.PI * 58 * s) + 0.18 * Math.sin(2 * Math.PI * 220 * s) * (0.6 + 0.4 * Math.sin(t * 0.7)) + 0.12 * hat * (Math.random() * 2 - 1);
    FAKE[i] = Math.max(0, Math.min(255, 128 + v * 127));
  }
  return { timeByteArray: FAKE, timeByteArrayL: FAKE, timeByteArrayR: FAKE };
}

// Per-scene rig: source -> bus (visualizer listens) -> monitor gain (0 until the user asks) -> speakers.
function rig(ctx, initial, { button = true } = {}) {
  const ac = audioCtx();
  const bus = ac.createGain(), out = ac.createGain();
  out.gain.value = 0;
  bus.connect(out);
  out.connect(ac.destination);
  let stopCur = null, key = initial, heard = false, token = 0;
  const fade = () => out.gain.setTargetAtTime(heard ? SOURCES[key].level : 0, ac.currentTime, 0.04);
  async function start(k) {
    if (k === "loop" || k === "drums") {
      const src = ac.createBufferSource();
      src.buffer = await getBuffer(k);
      src.loop = true;
      src.connect(bus);
      src.start();
      return () => { try { src.stop(); } catch (e) { /* already stopped */ } src.disconnect(); };
    }
    if (k === "mic") {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const node = ac.createMediaStreamSource(stream);
      node.connect(bus);
      return () => { node.disconnect(); stream.getTracks().forEach((t) => t.stop()); };
    }
    return () => {};
  }
  async function use(k) {
    const my = ++token;
    const stop = await start(k);
    if (my !== token || !ctx.active) return stop();
    if (stopCur) stopCur();
    stopCur = stop;
    key = k;
    fade();
  }
  if (button) {
    const btn = ctx.button("🔊 播放聲音", async () => {
      heard = !heard;
      btn.textContent = heard ? "🔇 靜音" : "🔊 播放聲音";
      if (heard && ac.state !== "running") await ac.resume();
      fade();
    }, { primary: true });
  }
  if (ac.state !== "running") ac.resume().catch(() => {});
  ctx.onCleanup(() => { token++; if (stopCur) stopCur(); stopCur = null; out.gain.value = 0; bus.disconnect(); out.disconnect(); });
  use(initial).catch((e) => { if (ctx.active) { console.error(e); ctx.hint(`音源載入失敗：${e.message}`); } });
  return { ac, bus, use, get key() { return key; } };
}

// Creates a visualizer on a fresh canvas inside `host`, renders every frame, and frees the GL context on cleanup.
function visualizer(ctx, BC, host, bus, { textureRatio = 1, mesh = [48, 36], fxaa = false, synth = () => false, onFrame } = {}) {
  const canvas = document.createElement("canvas");
  host.prepend(canvas);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const dims = () => [Math.max(2, Math.round(host.clientWidth * dpr)), Math.max(2, Math.round(host.clientHeight * dpr))];
  let [w, h] = dims();
  canvas.width = w; canvas.height = h;
  const viz = BC.createVisualizer(audioCtx(), canvas, { width: w, height: h, pixelRatio: 1, textureRatio, meshWidth: mesh[0], meshHeight: mesh[1], outputFXAA: fxaa });
  const gl = viz.renderer.gl;
  if (bus) viz.connectAudio(bus);
  ctx.onResize(() => {
    [w, h] = dims();
    if (w === canvas.width && h === canvas.height) return;
    canvas.width = w; canvas.height = h;
    viz.setRendererSize(w, h);
  });
  const state = { viz, canvas, gl, synthActive: false };
  ctx.raf((t) => {
    state.synthActive = synth() || audioCtx().state !== "running";
    if (state.synthActive) viz.render({ audioLevels: synthLevels(t / 1000) });
    else viz.render();
    if (onFrame) onFrame(t);
  });
  ctx.onCleanup(() => {
    if (bus) try { viz.disconnectAudio(bus); } catch (e) { /* bus already disconnected */ }
    const ext = gl.getExtension("WEBGL_lose_context");
    if (ext) ext.loseContext();
    canvas.remove();
  });
  return state;
}

// Bass / mid / treble as butterchurn computes them for the preset equations (1.0 = long-term average).
const LEVELS = [["bass", "低音 bass", "#f72585"], ["mid", "中音 mid", "#9d8cff"], ["treb", "高音 treb", "#4cc9f0"]];
function meters(el) {
  el.innerHTML = LEVELS.map(([k, l, c]) => `<span>${l}</span><i><b style="background:${c}"></b><u></u></i><em>0.00</em>`).join("");
  const rows = [...el.querySelectorAll("i")].map((i, k) => ({ bar: i.querySelector("b"), att: i.querySelector("u"), em: el.querySelectorAll("em")[k] }));
  return (viz) => {
    const L = viz.renderer.audioLevels;
    LEVELS.forEach(([k], i) => {
      const v = L[k] || 0, a = L[k + "_att"] || 0;
      rows[i].bar.style.width = `${Math.min(100, (v / 2.5) * 100)}%`;
      rows[i].att.style.left = `${Math.min(100, (a / 2.5) * 100)}%`;
      rows[i].em.textContent = v.toFixed(2);
    });
  };
}
const levelText = (viz) => LEVELS.map(([k, l]) => `${l.split(" ")[0]} <b>${(viz.renderer.audioLevels[k] || 0).toFixed(2)}</b>`).join("・");
function sourceTag(el, st, extra = "") {
  el.className = `bc-tag${st.synthActive ? " synth" : ""}`;
  el.textContent = st.synthActive ? "合成節拍驅動（尚未取得音訊，不出聲）" : `音訊分析中${extra}`;
}

const CURATED = [
  FIRST,
  "Geiss - Cauldron - painterly 2 (saturation remix)",
  "Zylot - Star Ornament",
  "Aderrasi - Songflower (Moss Posy)",
  "Rovastar - Oozing Resistance",
  "martin - witchcraft reloaded",
  "Flexi - predator-prey-spirals",
  "Unchained - Rewop",
  "Eo.S. + Zylot - skylight (Stained Glass Majesty mix)",
  "Geiss - Reaction Diffusion 2",
];
const short = (n) => (n.length > 38 ? n.slice(0, 36) + "…" : n);
const VIEW = `<div class="bc-board"><div class="bc-view"><div class="bc-chip"></div><div class="bc-tag"></div></div></div>`;

Showcase.run({ scenes: [
  {
    id: "signature", title: "招牌視覺",
    api: "butterchurn.createVisualizer(audioCtx, canvas, opts) ・ loadPreset(preset, blendSec)",
    desc: "原版示範：主預設包的 100 組 MilkDrop 預設，上一個、下一個、隨機、每 15 秒自動輪播，每次切換都用 2 秒平滑漸變。預設本身是一包方程式與著色器，跟著低音、中音、高音的能量即時改變縮放、旋轉、扭曲與顏色。",
    hint: "切換預設時會平滑漸變；按「播放聲音」才會出聲",
    async mount(ctx) {
      ctx.html(VIEW);
      const st0 = ctx.status("載入 butterchurn 與主預設包…");
      const [BC, presets] = await Promise.all([lib(ctx), loadPack(ctx, "butterchurnPresets")]);
      st0.done();
      const names = Object.keys(presets).sort((a, b) => a.localeCompare(b));
      const chip = ctx.$(".bc-chip"), tag = ctx.$(".bc-tag");
      const r = rig(ctx, "loop");
      const st = visualizer(ctx, BC, ctx.$(".bc-view"), r.bus);
      let idx = Math.max(0, names.indexOf(FIRST)), cycle = 0;
      const sel = ctx.select("", names.map((n) => ({ value: n, label: short(n) })), names[idx], (v) => load(names.indexOf(v), 2));
      function load(i, blend) {
        idx = (i + names.length) % names.length;
        st.viz.loadPreset(presets[names[idx]], blend);
        sel.value = names[idx];
      }
      ctx.button("‹", () => load(idx - 1, 2), { title: "上一個" });
      ctx.button("›", () => load(idx + 1, 2), { title: "下一個" });
      ctx.button("隨機", () => load(Math.floor(Math.random() * names.length), 2.5));
      ctx.toggle("自動輪播", false, (on) => {
        clearInterval(cycle);
        cycle = on ? setInterval(() => ctx.active && load(Math.floor(Math.random() * names.length), 3), 15000) : 0;
      });
      ctx.onCleanup(() => clearInterval(cycle));
      load(idx, 0);
      ctx.interval(() => {
        chip.innerHTML = `${idx + 1}/${names.length}・${levelText(st.viz)}`;
        sourceTag(tag, st);
      }, 200);
    },
  },
  {
    id: "blend", title: "預設融合",
    api: "loadPreset(preset, blendTime) ・ renderer.blendProgress",
    desc: "loadPreset() 的第二個參數是融合秒數：兩組預設在這段時間內同時運算，每次都用一張隨機產生的融合圖樣決定哪些像素先換過去，所以每次過場都不一樣。0 秒是硬切。右邊進度條讀的是內部屬性 renderer.blendProgress。",
    hint: "把融合秒數拉長到 6 秒以上，比較明顯看得到過場圖樣",
    async mount(ctx) {
      ctx.html(`<div class="bc-board"><div class="bc-row"><div class="bc-view"><div class="bc-chip"></div><div class="bc-tag"></div></div>
        <div class="bc-side"><h4>融合進度</h4><div class="bc-progress"><b></b></div><div class="bc-kv"></div><p class="bc-x">融合期間，舊預設與新預設各自跑方程式與著色器，GPU 工作量接近兩倍。</p></div></div></div>`);
      const st0 = ctx.status("載入 butterchurn 與主預設包…");
      const [BC, presets] = await Promise.all([lib(ctx), loadPack(ctx, "butterchurnPresets")]);
      st0.done();
      const r = rig(ctx, "loop");
      const st = visualizer(ctx, BC, ctx.$(".bc-view"), r.bus);
      const bar = ctx.$(".bc-progress b"), kv = ctx.$(".bc-kv"), chip = ctx.$(".bc-chip"), tag = ctx.$(".bc-tag");
      let A = CURATED[0], B = CURATED[1], secs = 4, side = "A", auto = 0, t0 = 0;
      const opts = CURATED.map((n) => ({ value: n, label: short(n) }));
      const go = (which) => { side = which; t0 = performance.now(); st.viz.loadPreset(presets[which === "A" ? A : B], secs); };
      ctx.select("A", opts, A, (v) => { A = v; });
      ctx.select("B", opts, B, (v) => { B = v; });
      ctx.slider("融合", { min: 0, max: 10, step: 0.5, value: secs, format: (v) => `${v.toFixed(1)} 秒` }, (v) => { secs = v; });
      ctx.button("切到 A", () => go("A"));
      ctx.button("切到 B", () => go("B"), { primary: true });
      ctx.toggle("自動來回", false, (on) => {
        clearInterval(auto);
        auto = on ? setInterval(() => ctx.active && go(side === "A" ? "B" : "A"), (secs + 2.5) * 1000) : 0;
      });
      ctx.onCleanup(() => clearInterval(auto));
      st.viz.loadPreset(presets[A], 0);
      ctx.timeout(() => go("B"), 1200);
      ctx.raf(() => {
        const R = st.viz.renderer, p = R.blending ? R.blendProgress : 1;
        bar.style.width = `${Math.round(p * 100)}%`;
      });
      ctx.interval(() => {
        const R = st.viz.renderer;
        kv.innerHTML = `<span>目前目標</span><b>${side}</b><span>融合秒數</span><b>${secs.toFixed(1)} s</b><span>blendProgress</span><b>${(R.blending ? R.blendProgress : 1).toFixed(2)}</b><span>已經過</span><b>${t0 ? ((performance.now() - t0) / 1000).toFixed(1) : "0.0"} s</b>`;
        chip.innerHTML = `${R.blending ? "融合中" : "單一預設"}・<span>${short(side === "A" ? A : B)}</span>`;
        sourceTag(tag, st);
      }, 150);
    },
  },
  {
    id: "audio", title: "音源驅動",
    api: "viz.connectAudio(node) ・ viz.render({ audioLevels: { timeByteArray, timeByteArrayL, timeByteArrayR } })",
    desc: "connectAudio() 接上任何 Web Audio 節點：音檔、合成鼓組或麥克風。butterchurn 內部用 1024 點的時域樣本算出 bass、mid、treb 三個能量值（1.0 代表長期平均），預設的方程式就靠這三個數字律動。「自餵陣列」不經過 Web Audio，直接把自己算的樣本陣列交給 render()，適合離線輸出或其他音訊來源。",
    hint: "鼓組的大鼓讓 bass 明顯跳動；白線是平滑過的 bass_att",
    async mount(ctx) {
      ctx.html(`<div class="bc-board"><div class="bc-row"><div class="bc-view"><div class="bc-chip"></div><div class="bc-tag"></div></div>
        <div class="bc-side"><h4>預設看到的音訊</h4><canvas class="bc-scope"></canvas><div class="bc-meters"></div><p class="bc-x">上方是這一格的時域波形（timeByteArray），下方長條是瞬時能量，白線是平滑後的 *_att。</p></div></div></div>`);
      const st0 = ctx.status("載入 butterchurn 與主預設包…");
      const [BC, presets] = await Promise.all([lib(ctx), loadPack(ctx, "butterchurnPresets")]);
      st0.done();
      const KEYS = ["loop", "drums", "mic", "synth", "silence"];
      const r = rig(ctx, "drums");
      let fallback = "";
      const st = visualizer(ctx, BC, ctx.$(".bc-view"), r.bus, { synth: () => r.key === "synth" });
      st.viz.loadPreset(presets["Geiss - Reaction Diffusion 2"] || presets[FIRST], 0);
      const seg = ctx.group(KEYS.map((k) => SOURCES[k].label), 1, (i) => {
        fallback = "";
        r.use(KEYS[i]).catch((e) => {
          if (!ctx.active) return;
          // No microphone (denied, missing or headless): fall back to a clearly labelled substitute.
          fallback = "（麥克風的替代音源）";
          ctx.hint(`取不到麥克風（${e.name === "NotAllowedError" ? "權限被拒" : e.name === "NotFoundError" ? "找不到裝置" : e.message}），已改用替代音源：鼓組`);
          [...seg.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === 1)));
          r.use("drums");
        });
      });
      const paint = meters(ctx.$(".bc-meters"));
      const scope = ctx.$(".bc-scope"), g = scope.getContext("2d"), chip = ctx.$(".bc-chip"), tag = ctx.$(".bc-tag");
      ctx.raf(() => {
        const W = scope.clientWidth, H = scope.clientHeight;
        if (!W) return;
        if (scope.width !== W * 2) { scope.width = W * 2; scope.height = H * 2; }
        g.setTransform(2, 0, 0, 2, 0, 0);
        g.clearRect(0, 0, W, H);
        const d = st.synthActive ? FAKE : st.viz.audio.timeByteArray;
        g.strokeStyle = st.synthActive ? "#f7df1e" : "#4cc9f0";
        g.lineWidth = 1.2;
        g.beginPath();
        for (let i = 0; i < d.length; i += 4) { const x = (i / d.length) * W, y = (d[i] / 255) * H; i ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.stroke();
        paint(st.viz);
      });
      ctx.interval(() => {
        const k = r.key;
        chip.innerHTML = `音源 <b>${SOURCES[k].label}</b>${fallback}・${k === "synth" ? "render({ audioLevels })" : k === "silence" ? "沒有輸入，能量歸零" : "connectAudio(bus)"}`;
        sourceTag(tag, st, k === "synth" ? "：自餵陣列不需要 Web Audio" : "");
        if (k === "synth") { tag.className = "bc-tag synth"; tag.textContent = "自餵陣列：render({ audioLevels })，不出聲"; }
      }, 200);
    },
  },
  {
    id: "packs", title: "預設包",
    api: "butterchurnPresets[Minimal | MD1 | Extra | Extra2].getPresets()",
    desc: "butterchurn-presets 把數百組 MilkDrop 預設拆成幾個包，各自是一支 JS 檔，需要時才下載。右邊統計每個包有多少預設寫了逐點方程（pixel eqs）、自訂 warp 或 comp 著色器、自訂形狀與波形；著色器越多，GPU 負擔越重。下載量是這次實際從 CDN 傳輸的大小。",
    hint: "切換預設包會先下載該包（約 190 到 850 KB）",
    async mount(ctx) {
      ctx.html(`<div class="bc-board"><div class="bc-row"><div class="bc-view"><div class="bc-chip"></div><div class="bc-tag"></div></div>
        <div class="bc-side"><h4 class="bc-pk-title">預設包</h4><div class="bc-kv"></div><p class="bc-x">MilkDrop 預設原本是 .milk 文字檔，這些包已經轉成 JS 物件，方程式轉成 JS 函式字串、著色器轉成 GLSL。</p></div></div></div>`);
      const BC = await lib(ctx);
      const r = rig(ctx, "loop");
      const st = visualizer(ctx, BC, ctx.$(".bc-view"), r.bus);
      const kv = ctx.$(".bc-kv"), title = ctx.$(".bc-pk-title"), chip = ctx.$(".bc-chip"), tag = ctx.$(".bc-tag");
      let names = [], presets = {}, idx = 0, token = 0, pack = PACKS[0];
      const show = (i) => {
        idx = (i + names.length) % names.length;
        st.viz.loadPreset(presets[names[idx]], 1.5);
        chip.innerHTML = `${pack.label} <b>${idx + 1}/${names.length}</b>・${names[idx]}`;
      };
      async function choose(p) {
        const my = ++token;
        pack = p;
        title.textContent = `${p.label}：下載中…`;
        const t0 = performance.now();
        const ps = await loadPack(ctx, p.key);
        if (my !== token) return;
        presets = ps; names = Object.keys(ps);
        const count = (f) => names.filter((n) => f(ps[n])).length;
        const enabled = (arr) => (arr || []).some((x) => x.baseVals && x.baseVals.enabled);
        const bytes = packBytes(p.key);
        title.textContent = `${p.label}：${names.length} 組預設`;
        kv.innerHTML = [
          ["實際下載", bytes ? kb(bytes) : "已快取"], ["原始檔案", kb(p.raw)], ["載入耗時", fmtMs(performance.now() - t0)],
          ["逐點方程", `${count((x) => (x.pixel_eqs_str || "").length > 0)} 組`], ["自訂 warp", `${count((x) => (x.warp || "").trim().length > 0)} 組`],
          ["自訂 comp", `${count((x) => (x.comp || "").trim().length > 0)} 組`], ["自訂形狀", `${count((x) => enabled(x.shapes))} 組`], ["自訂波形", `${count((x) => enabled(x.waves))} 組`],
        ].map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join("");
        show(Math.floor(Math.random() * names.length));
      }
      ctx.group(PACKS.map((p) => p.label), 0, (i) => choose(PACKS[i]).catch((e) => { if (ctx.active) { console.error(e); title.textContent = `下載失敗：${e.message}`; } }));
      ctx.button("‹", () => names.length && show(idx - 1), { title: "上一個" });
      ctx.button("›", () => names.length && show(idx + 1), { title: "下一個" });
      ctx.button("隨機", () => names.length && show(Math.floor(Math.random() * names.length)));
      ctx.interval(() => sourceTag(tag, st), 300);
      await choose(PACKS[0]);
    },
  },
  {
    id: "custom", title: "自訂預設",
    api: "loadPreset({ baseVals, shapes, waves, frame_eqs_str, warp, comp })",
    desc: "預設只是一個 JS 物件，不一定要從預設包來。這裡用滑桿組出 baseVals（縮放、旋轉、扭曲、殘影衰減、內建波形模式），加一段每格執行的方程式讓低音推動縮放，再加一條頻譜圓環波形與一個隨低音脹縮的多邊形。warp 與 comp 留空就用預設著色器。右邊是即時產生的預設內容。",
    hint: "衰減調到 1.0 讓殘影不消失，再把扭曲拉高",
    async mount(ctx) {
      ctx.html(`<div class="bc-board"><div class="bc-row"><div class="bc-view"><div class="bc-chip"></div><div class="bc-tag"></div></div>
        <div class="bc-side"><h4>產生的預設</h4><pre class="bc-code"></pre></div></div></div>`);
      const BC = await lib(ctx);
      const r = rig(ctx, "loop");
      const st = visualizer(ctx, BC, ctx.$(".bc-view"), r.bus);
      const code = ctx.$(".bc-code"), chip = ctx.$(".bc-chip"), tag = ctx.$(".bc-tag");
      const P = { zoom: 1.01, rot: 0.02, warp: 0.8, decay: 0.93, wave_mode: 2, bassZoom: true, ring: true, shape: true };
      const off = () => ({ baseVals: { enabled: 0 } });
      function build() {
        const frame = ["a.wave_r = 0.5 + 0.5 * Math.sin(a.time * 0.9);", "a.wave_g = 0.5 + 0.5 * Math.sin(a.time * 1.3);", "a.wave_b = 0.8;"];
        if (P.bassZoom) frame.push("a.zoom += 0.04 * (a.bass_att - 1);", "a.rot += 0.02 * (a.treb - 1);");
        return {
          baseVals: { zoom: P.zoom, rot: P.rot, warp: P.warp, decay: P.decay, wave_mode: P.wave_mode, wave_a: 0.7, wave_scale: 1, wave_thick: 1, additivewave: 0, wave_brighten: 0, echo_zoom: 1, gammaadj: 1, ob_size: 0.005, ob_a: 0.4, ob_r: 0.1, ob_b: 0.4 },
          shapes: [P.shape ? {
            baseVals: { enabled: 1, sides: 6, additive: 0, thickoutline: 1, rad: 0.12, x: 0.5, y: 0.5, r: 1, g: 0.25, b: 0.6, a: 0.3, r2: 0.2, g2: 0.6, b2: 1, a2: 0, border_r: 1, border_g: 1, border_b: 1, border_a: 0.7 },
            init_eqs_str: "", frame_eqs_str: "a.ang = a.time * 0.5; a.rad = 0.06 + 0.06 * a.bass_att;",
          } : off(), off(), off(), off()],
          waves: [P.ring ? {
            baseVals: { enabled: 1, samples: 256, spectrum: 1, thick: 1, additive: 0, scaling: 1, smoothing: 0.6, r: 0.4, g: 0.9, b: 1, a: 0.8 },
            init_eqs_str: "", frame_eqs_str: "",
            point_eqs_str: "a.x = 0.5 + 0.3 * Math.cos(a.sample * 6.2832) * (0.7 + a.value1 * 0.6); a.y = 0.5 + 0.4 * Math.sin(a.sample * 6.2832) * (0.7 + a.value1 * 0.6); a.r = 0.5 + 0.5 * Math.sin(a.sample * 6.2832 + a.time);",
          } : off(), off(), off(), off()],
          init_eqs_str: "", frame_eqs_str: frame.join(" "), pixel_eqs_str: "", warp: "", comp: "",
        };
      }
      let pending = 0;
      const apply = (blend = 0.4) => {
        cancelAnimationFrame(pending);
        pending = requestAnimationFrame(() => {
          const preset = build();
          code.textContent = JSON.stringify(preset, (k, v) => (v && v.baseVals && v.baseVals.enabled === 0 ? undefined : v), 1).replace(/\n\s*null,?/g, "");
          st.viz.loadPreset(preset, blend);
        });
      };
      ctx.onCleanup(() => cancelAnimationFrame(pending));
      ctx.slider("縮放", { min: 0.9, max: 1.1, step: 0.005, value: P.zoom, format: (v) => v.toFixed(3) }, (v) => { P.zoom = v; apply(); });
      ctx.slider("旋轉", { min: -0.2, max: 0.2, step: 0.01, value: P.rot, format: (v) => v.toFixed(2) }, (v) => { P.rot = v; apply(); });
      ctx.slider("扭曲", { min: 0, max: 3, step: 0.1, value: P.warp, format: (v) => v.toFixed(1) }, (v) => { P.warp = v; apply(); });
      ctx.slider("衰減", { min: 0.85, max: 1, step: 0.005, value: P.decay, format: (v) => v.toFixed(3) }, (v) => { P.decay = v; apply(); });
      ctx.select("波形", [0, 1, 2, 3, 4, 5, 6, 7].map((v) => ({ value: v, label: `wave_mode ${v}` })), String(P.wave_mode), (v) => { P.wave_mode = +v; apply(); });
      ctx.toggle("低音推縮放", P.bassZoom, (v) => { P.bassZoom = v; apply(); });
      ctx.toggle("頻譜圓環", P.ring, (v) => { P.ring = v; apply(); });
      ctx.toggle("多邊形", P.shape, (v) => { P.shape = v; apply(); });
      apply(0);
      ctx.interval(() => { chip.innerHTML = `自訂預設・${levelText(st.viz)}`; sourceTag(tag, st); }, 200);
    },
  },
  {
    id: "mesh", title: "解析度與網格",
    api: "createVisualizer(ac, canvas, { textureRatio, meshWidth, meshHeight, outputFXAA }) ・ setRendererSize ・ setInternalMeshSize",
    desc: "MilkDrop 的扭曲不是逐像素算的：畫面被切成網格，逐點方程只在網格頂點上用 JS 計算，頂點之間由 GPU 內插。網格越粗越快，但扭曲會出現折角；textureRatio 決定內部回饋紋理的解析度，低於 1 會變糊，高於 1 是超取樣。黃色線是目前的網格。",
    hint: "把網格切到 8×6 再打開格線，看扭曲怎麼沿著格子折",
    async mount(ctx) {
      ctx.html(`<div class="bc-board"><div class="bc-view"><canvas class="bc-grid"></canvas><div class="bc-chip"></div><div class="bc-tag"></div></div></div>`);
      const st0 = ctx.status("載入 butterchurn 與主預設包…");
      const [BC, presets] = await Promise.all([lib(ctx), loadPack(ctx, "butterchurnPresets")]);
      st0.done();
      const r = rig(ctx, "loop");
      const MESHES = [[8, 6], [16, 12], [48, 36], [96, 72]];
      let mesh = 2, ratio = 1, grid = true;
      const st = visualizer(ctx, BC, ctx.$(".bc-view"), r.bus, { mesh: MESHES[mesh] });
      const PICKS = ["Rovastar - Oozing Resistance", "Unchained - Unified Drag 2", "Aderrasi - Songflower (Moss Posy)"];
      st.viz.loadPreset(presets[PICKS[0]], 0);
      const ov = ctx.$(".bc-grid"), og = ov.getContext("2d"), chip = ctx.$(".bc-chip"), tag = ctx.$(".bc-tag");
      const fps = ctx.fps({ position: "br" });
      fps.el.style.display = "none";
      ctx.select("", PICKS.map((n) => ({ value: n, label: short(n) })), PICKS[0], (v) => st.viz.loadPreset(presets[v], 1));
      ctx.select("內部解析度", [0.25, 0.5, 1, 2].map((v) => ({ value: v, label: `${v}×` })), "1", (v) => {
        ratio = +v;
        st.viz.setRendererSize(st.canvas.width, st.canvas.height, { textureRatio: ratio });
      });
      ctx.group(MESHES.map(([w, h]) => `${w}×${h}`), mesh, (i) => { mesh = i; st.viz.setInternalMeshSize(...MESHES[i]); drawGrid(); });
      ctx.toggle("格線", grid, (v) => { grid = v; drawGrid(); });
      ctx.toggle("FXAA", false, (v) => st.viz.setOutputAA(v));
      function drawGrid() {
        const W = ov.clientWidth, H = ov.clientHeight;
        ov.width = W; ov.height = H;
        if (!grid) return;
        const [mw, mh] = MESHES[mesh];
        og.strokeStyle = "rgba(247,223,30,0.35)";
        og.lineWidth = 1;
        og.beginPath();
        for (let i = 0; i <= mw; i++) { const x = Math.round((i / mw) * W) + 0.5; og.moveTo(x, 0); og.lineTo(x, H); }
        for (let j = 0; j <= mh; j++) { const y = Math.round((j / mh) * H) + 0.5; og.moveTo(0, y); og.lineTo(W, y); }
        og.stroke();
      }
      ctx.onResize(drawGrid);
      drawGrid();
      ctx.interval(() => {
        const R = st.viz.renderer, { fps: f } = fps.read(1000);
        chip.innerHTML = `網格 <b>${R.mesh_width}×${R.mesh_height}</b>（${fmt((R.mesh_width + 1) * (R.mesh_height + 1))} 個頂點）・紋理 <b>${Math.round(R.texsizeX)}×${Math.round(R.texsizeY)}</b>・FPS <b>${f ? f.toFixed(0) : "…"}</b>`;
        sourceTag(tag, st);
      }, 400);
    },
  },
  {
    id: "capture", title: "擷取與標題",
    api: "viz.toDataURL() ・ viz.warpBufferToDataURL() ・ viz.launchSongTitleAnim(text)",
    desc: "toDataURL() 把目前畫面依內部紋理解析度重新合成並讀回成 PNG；warpBufferToDataURL() 讀的是合成前的回饋緩衝，看得到預設真正在疊代的那張圖。launchSongTitleAnim() 是 MilkDrop 的歌名動畫，文字會被畫成紋理並跟著扭曲飛走。",
    hint: "先按「顯示標題」，在標題飛走途中擷取畫面",
    async mount(ctx) {
      ctx.html(`<div class="bc-board"><div class="bc-view"><div class="bc-chip"></div><div class="bc-tag"></div></div><div class="bc-shots"></div></div>`);
      const st0 = ctx.status("載入 butterchurn 與主預設包…");
      const [BC, presets] = await Promise.all([lib(ctx), loadPack(ctx, "butterchurnPresets")]);
      st0.done();
      const r = rig(ctx, "loop");
      const st = visualizer(ctx, BC, ctx.$(".bc-view"), r.bus);
      st.viz.loadPreset(presets["martin - witchcraft reloaded"] || presets[FIRST], 0);
      const shots = ctx.$(".bc-shots"), chip = ctx.$(".bc-chip"), tag = ctx.$(".bc-tag");
      const TITLES = ["js-tools-atlas", "Butterchurn 2.6.7", "MilkDrop in WebGL2"];
      let ti = 0;
      ctx.select("", CURATED.map((n) => ({ value: n, label: short(n) })), "martin - witchcraft reloaded", (v) => st.viz.loadPreset(presets[v], 1.5));
      ctx.select("", TITLES.map((t) => ({ value: t, label: t })), TITLES[0], (v) => { ti = TITLES.indexOf(v); });
      ctx.button("顯示標題", () => st.viz.launchSongTitleAnim(TITLES[ti]));
      const grab = (fn, label) => {
        const t0 = performance.now();
        const url = st.viz[fn]();
        const ms = performance.now() - t0;
        const img = new Image();
        img.onload = () => {
          const item = document.createElement("div");
          item.className = "bc-shot";
          item.innerHTML = `<span>${label}・${img.naturalWidth}×${img.naturalHeight}</span><span>${kb(url.length * 0.75)}・${fmtMs(ms)}</span>`;
          item.prepend(img);
          shots.prepend(item);
          while (shots.children.length > 8) shots.lastChild.remove();
        };
        img.src = url;
      };
      ctx.button("擷取畫面", () => grab("toDataURL", "畫面"), { primary: true });
      ctx.button("擷取回饋緩衝", () => grab("warpBufferToDataURL", "warp"));
      ctx.timeout(() => st.viz.launchSongTitleAnim(TITLES[0]), 300);
      ctx.timeout(() => grab("toDataURL", "畫面"), 800);
      ctx.timeout(() => grab("warpBufferToDataURL", "warp"), 950);
      ctx.interval(() => { chip.innerHTML = `擷取次數 <b>${shots.children.length}</b>`; sourceTag(tag, st); }, 300);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "setInternalMeshSize(w, h) ・ 逐點方程每格在每個頂點跑一次",
    desc: "選一組逐點方程很長的預設，從 24×18 的網格一路加密到 384×288，量畫面掉到 30 FPS 以下的位置。網格每加密一倍，JS 端要算的頂點數就變四倍；內部解析度則決定 GPU 端的像素量，可以分開比較。",
    hint: "按「自動加壓」逐步加密網格",
    async mount(ctx) {
      ctx.html(`<div class="bc-stress"><div class="bc-view" style="position:absolute;inset:0"><div class="bc-chip"></div><div class="bc-tag"></div></div></div>`);
      ctx.controls.classList.add("bottom");
      const st0 = ctx.status("載入 butterchurn 與主預設包…");
      const [BC, presets] = await Promise.all([lib(ctx), loadPack(ctx, "butterchurnPresets")]);
      st0.done();
      const r = rig(ctx, "loop");
      const NAME = "flexi - bouncing balls [double mindblob neon mix]";
      const st = visualizer(ctx, BC, ctx.$(".bc-view"), r.bus, { mesh: [24, 18] });
      st.viz.loadPreset(presets[NAME] || presets[FIRST], 0);
      const chip = ctx.$(".bc-chip"), tag = ctx.$(".bc-tag");
      let ratio = 1;
      ctx.select("內部解析度", [0.5, 1, 2].map((v) => ({ value: v, label: `${v}×` })), "1", (v) => {
        ratio = +v;
        st.viz.setRendererSize(st.canvas.width, st.canvas.height, { textureRatio: ratio });
      });
      const verts = () => (st.viz.renderer.mesh_width + 1) * (st.viz.renderer.mesh_height + 1);
      ctx.ramp({
        label: "網格寬", unit: " 格", steps: [24, 48, 96, 144, 192, 256, 384],
        format: (n) => `${n}×${Math.round(n * 0.75)}`,
        apply(n) { st.viz.setInternalMeshSize(n, Math.round(n * 0.75)); },
        metrics: () => ({ 頂點數: fmtCompact(verts()), 紋理像素: fmtCompact(Math.round(st.viz.renderer.texsizeX * st.viz.renderer.texsizeY)), 內部解析度: `${ratio}×` }),
        note: `預設「${NAME}」的逐點方程有 1,117 字元，每格要在每個網格頂點用 JS 跑一次，所以網格加密時先撐不住的是 CPU。無頭或軟體繪圖環境的數字會明顯偏低。`,
      });
      ctx.interval(() => { chip.innerHTML = `網格 <b>${st.viz.renderer.mesh_width}×${st.viz.renderer.mesh_height}</b>・頂點 <b>${fmt(verts())}</b>`; sourceTag(tag, st); }, 300);
    },
  },
] });
</script>
