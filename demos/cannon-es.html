<script type="module">
// cannon-es showcase: eight scenes, each with its own CANNON.World and three.js renderer.
// three.js only draws; every position and rotation comes from cannon-es bodies.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
import * as CANNON from "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js";

const { h, fmt } = Showcase;
const PALETTE = [0xf7df1e, 0x4cc9f0, 0xf72585, 0x7bd389, 0xff8c42, 0x9d8cff];
const HEX = PALETTE.map((c) => "#" + c.toString(16).padStart(6, "0"));
const V = (x = 0, y = 0, z = 0) => new CANNON.Vec3(x, y, z);
const Q = (x, y, z) => new CANNON.Quaternion().setFromEuler(x, y, z);
const PLANE_UP = Q(-Math.PI / 2, 0, 0); // turns a CANNON.Plane normal (+z) into +y
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const std = (color, extra) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, ...extra });

// ---------- three.js stage (same pattern as the three.js showcase) ----------
function disposeAll(root, extra) {
  const seen = new Set();
  const free = (x) => { if (x && !seen.has(x) && typeof x.dispose === "function") { seen.add(x); x.dispose(); } };
  const freeMat = (m) => { if (!m) return; for (const v of Object.values(m)) if (v && v.isTexture) free(v); free(m); };
  root.traverse((o) => {
    free(o.geometry);
    [].concat(o.material || []).forEach(freeMat);
    if (o.isInstancedMesh) free(o);
  });
  for (const x of extra) (x && x.isMaterial ? freeMat : free)(x);
}

function stage(ctx, o = {}) {
  const host = o.host || ctx.el;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = o.exposure ?? 1;
  if (o.shadows) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; }
  const canvas = renderer.domElement;
  canvas.className = "gl";
  host.append(canvas);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(o.bg ?? 0x0e1013);
  const fov = o.fov ?? 45;
  const camera = new THREE.PerspectiveCamera(fov, 1, 0.1, o.far ?? 300);
  camera.position.set(...(o.pos || [0, 2, 8]));
  let controls = null;
  if (o.orbit !== false) {
    controls = new OrbitControls(camera, canvas);
    controls.target.set(...(o.target || [0, 0, 0]));
    controls.enableDamping = true;
    controls.enablePan = false;
    Object.assign(controls, o.orbit || {});
  }
  let labels = null;
  if (o.labels) {
    labels = new CSS2DRenderer();
    labels.domElement.className = "cn-labels";
    host.append(labels.domElement);
  }
  const frameFns = [], sizeFns = [], extra = [];
  const S = {
    renderer, scene, camera, controls, canvas, host, width: 1, height: 1, availH: 1, full: 1,
    render: () => renderer.render(scene, camera),
    onFrame(fn) { frameFns.push(fn); },
    onSize(fn) { sizeFns.push(fn); fn(S.width, S.height); },
    own(...xs) { extra.push(...xs); return xs[0]; },
  };
  let lastKey = "";
  const fit = () => {
    const w = Math.max(1, host.clientWidth), hh = Math.max(1, host.clientHeight);
    const top = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-h")) || 0;
    const bot = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-b")) || 0;
    const key = `${w}x${hh}:${top}:${bot}`;
    if (key === lastKey) return;
    lastKey = key;
    const d = Math.max(-hh * 0.4, Math.min(hh * 0.4, top - bot));
    S.width = w; S.height = hh; S.full = hh + Math.abs(d); S.availH = hh - Math.abs(d);
    renderer.setSize(w, hh);
    if (labels) labels.setSize(w, hh);
    camera.aspect = w / S.full;
    camera.fov = o.portraitFov && w < hh ? o.portraitFov : fov;
    if (d) camera.setViewOffset(w, S.full, 0, d < 0 ? -d : 0, w, hh); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    for (const fn of sizeFns) fn(w, hh);
  };
  fit();
  const timer = new THREE.Timer();
  ctx.raf((t) => {
    fit();
    timer.update(t);
    const dt = Math.max(0, Math.min(timer.getDelta(), 0.1)), time = timer.getElapsed();
    for (const fn of frameFns) fn(dt, time);
    if (controls) controls.update(dt);
    S.render();
    if (labels) labels.render(scene, camera);
  });
  ctx.onCleanup(() => {
    if (controls) controls.dispose();
    timer.dispose();
    disposeAll(scene, extra);
    renderer.dispose();
    renderer.forceContextLoss(); // WEBGL_lose_context: frees the GL context right away
    canvas.remove();
    if (labels) labels.domElement.remove();
  });
  return S;
}

// Camera distance that fits a halfW x halfH box into the visible (uncovered) part of the view.
function fitDistance(S, halfW, halfH, margin = 1.12) {
  const tanV = Math.tan(THREE.MathUtils.degToRad(S.camera.fov) / 2);
  return Math.max((halfH * S.full) / (S.availH * tanV), halfW / (tanV * S.camera.aspect)) * margin;
}
const setNdc = (S, e, v) => {
  const r = S.canvas.getBoundingClientRect();
  return v.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
// Click/tap that is not the end of an orbit drag.
function onTap(ctx, el, fn) {
  let d = null;
  ctx.on(el, "pointerdown", (e) => { d = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  ctx.on(el, "pointerup", (e) => {
    if (d && performance.now() - d.t < 300 && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 6) fn(e);
    d = null;
  });
}
// CSS2D label; userData.sub(text) updates the second line only when it changes.
function label(title, sub = "") {
  const s = h("small", { text: sub });
  const obj = new CSS2DObject(h("div", { class: "cn-lab" }, h("span", { text: title }), s));
  let last = sub;
  obj.userData.sub = (x) => { if (x !== last) { last = x; s.textContent = x; } };
  return obj;
}
function chip(ctx, html) {
  const el = h("div", { class: "cn-chip" });
  el.innerHTML = html;
  ctx.el.append(el);
  let last = html;
  return (next) => { if (next !== last) { last = next; el.innerHTML = next; } };
}
// Smooth camera moves between framed views; re-frames on resize.
function camRig(S) {
  let cur = null, k = 1;
  const p0 = new THREE.Vector3(), t0 = new THREE.Vector3(), p1 = new THREE.Vector3(), t1 = new THREE.Vector3();
  const goal = () => { t1.set(...cur.t); p1.set(...cur.d).normalize().multiplyScalar(fitDistance(S, cur.hw, cur.hh)).add(t1); };
  S.onSize(() => { if (!cur) return; goal(); if (k >= 1) { S.camera.position.copy(p1); S.controls.target.copy(t1); } });
  S.onFrame((dt) => {
    if (k >= 1) return;
    k = Math.min(1, k + dt / 1.2);
    const e = k * k * (3 - 2 * k);
    S.camera.position.lerpVectors(p0, p1, e);
    S.controls.target.lerpVectors(t0, t1, e);
  });
  return (view, instant) => {
    cur = view; goal();
    if (instant) { k = 1; S.camera.position.copy(p1); S.controls.target.copy(t1); }
    else { k = 0; p0.copy(S.camera.position); t0.copy(S.controls.target); }
  };
}
function lights(S, { shadow = 6, pos = [4, 9, 5], hemi = 1.3, sun = 2.4 } = {}) {
  S.scene.add(new THREE.HemisphereLight(0xfff4e6, 0x20232c, hemi));
  const d = new THREE.DirectionalLight(0xffffff, sun);
  d.position.set(...pos);
  if (shadow) {
    d.castShadow = true;
    d.shadow.mapSize.set(2048, 2048);
    Object.assign(d.shadow.camera, { left: -shadow, right: shadow, top: shadow, bottom: -shadow, near: 0.5, far: 60 });
    d.shadow.bias = -0.0005;
  }
  S.scene.add(d);
  return d;
}
function floor(S, w, d, color, x = 0) {
  const m = new THREE.Mesh(S.own(new THREE.PlaneGeometry(w, d)), S.own(std(color, { roughness: 0.9 })));
  m.rotation.x = -Math.PI / 2;
  m.position.x = x;
  m.receiveShadow = true;
  S.scene.add(m);
  return m;
}
function shadowed(geo, mat) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = m.receiveShadow = true;
  return m;
}

// ---------- cannon-es helpers ----------
function newWorld({ iter = 10, ...opts } = {}) {
  const world = new CANNON.World({ gravity: V(0, -9.82, 0), ...opts });
  world.broadphase = new CANNON.SAPBroadphase(world);
  world.solver.iterations = iter;
  return world;
}
// Static body. cannon-es 0.20 keeps a cached AABB for static bodies, so after setting the
// transform we flag it, otherwise rays and the broadphase test the stale box.
function fixed(world, shape, pos = V(), quat = null, material) {
  const b = new CANNON.Body({ mass: 0, shape, material, position: pos });
  if (quat) b.quaternion.copy(quat);
  b.aabbNeedsUpdate = true;
  world.addBody(b);
  return b;
}
// Teleport a body (and its interpolation state) and clear its motion.
function place(b, p, q) {
  for (const v of [b.position, b.previousPosition, b.interpolatedPosition]) v.copy(p);
  if (q) for (const v of [b.quaternion, b.previousQuaternion, b.interpolatedQuaternion]) v.copy(q);
  b.velocity.setZero(); b.angularVelocity.setZero(); b.force.setZero(); b.torque.setZero();
  b.aabbNeedsUpdate = true;
  b.wakeUp();
}
// Fixed-step loop: world.step(step, frameDt, maxSub) and copy interpolated transforms to meshes.
function sim(S, world, { step = 1 / 60, maxSub = 4 } = {}) {
  const pairs = new Map();
  const P = {
    scale: 1, ms: 0,
    add(body, mesh) { world.addBody(body); if (mesh) { pairs.set(body, mesh); S.scene.add(mesh); } return body; },
    remove(body) { world.removeBody(body); const m = pairs.get(body); if (m) { S.scene.remove(m); pairs.delete(body); } },
  };
  S.onFrame((dt) => {
    const t0 = performance.now();
    world.step(step, dt * P.scale, maxSub);
    P.ms += (performance.now() - t0 - P.ms) * 0.1;
    for (const [b, m] of pairs) { m.position.copy(b.interpolatedPosition); m.quaternion.copy(b.interpolatedQuaternion); }
  });
  return P;
}
// Convex hull from a closed three.js geometry; faces are re-wound counter-clockwise seen from outside.
function convexFrom(geo) {
  let g = geo.clone();
  g.deleteAttribute("normal"); g.deleteAttribute("uv");
  g = mergeVertices(g);
  const p = g.attributes.position, idx = g.index.array, vertices = [], faces = [];
  for (let i = 0; i < p.count; i++) vertices.push(V(p.getX(i), p.getY(i), p.getZ(i)));
  for (let i = 0; i < idx.length; i += 3) {
    const [a, b, c] = [idx[i], idx[i + 1], idx[i + 2]];
    const n = vertices[b].vsub(vertices[a]).cross(vertices[c].vsub(vertices[a]));
    faces.push(n.dot(vertices[a].vadd(vertices[b]).vadd(vertices[c])) < 0 ? [a, c, b] : [a, b, c]);
  }
  g.dispose();
  return new CANNON.ConvexPolyhedron({ vertices, faces });
}
// Chip legend item: colour swatch + text that never wraps in the middle.
const swatch = (i, html) => `<span class="cn-it"><i class="cn-sw" style="background:${HEX[i]}"></i>${html}</span>`;
const segSet = (wrap, i) => [...wrap.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));

// Domino layouts: parametric floor curves resampled at equal arc length.
const DOMINO_PATHS = [
  (u) => { const th = u * Math.PI * 6, r = 3.4 - 2.4 * u; return [r * Math.cos(th), r * Math.sin(th)]; },
  (u) => [(u - 0.5) * 7.2, 1.5 * Math.sin(u * Math.PI * 3)],
  (u) => {
    const t = u * Math.PI * 2, s = 0.21;
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    return [16 * Math.sin(t) ** 3 * s, -(y + 6) * s];
  },
];
function samplePath(fn, gap, max) {
  const pts = [];
  let prev = fn(0), acc = 0, next = 0;
  for (let i = 1; i <= 4000; i++) {
    const p = fn(i / 4000);
    acc += Math.hypot(p[0] - prev[0], p[1] - prev[1]);
    if (acc >= next) {
      const dx = p[0] - prev[0], dz = p[1] - prev[1], l = Math.hypot(dx, dz) || 1;
      pts.push({ x: p[0], z: p[1], tx: dx / l, tz: dz / l });
      next += gap;
    }
    prev = p;
  }
  const a = pts[0], b = pts[pts.length - 1];
  if (Math.hypot(a.x - b.x, a.z - b.z) < gap * 1.2) pts.pop(); // closed curve: drop the overlap
  return pts.slice(0, max);
}

Showcase.run({ scenes: [
  {
    id: "domino", title: "骨牌連鎖反應",
    api: "new CANNON.World({ allowSleep: true })・body.applyImpulse(impulse, point)",
    desc: "每張骨牌都是 cannon-es 剛體，靜止時進入睡眠、不參與求解，被撞到才醒來；畫面中顏色變暗的骨牌正在睡眠。",
    hint: "點任一張骨牌從那裡推倒・拖曳旋轉視角",
    mount(ctx) {
      const S = stage(ctx, { shadows: true, fov: 42, bg: 0x0e0c10,
        orbit: { autoRotate: true, autoRotateSpeed: 0.6, maxPolarAngle: Math.PI * 0.47, minDistance: 4, maxDistance: 24 } });
      const fog = (S.scene.fog = new THREE.Fog(0x0e0c10, 12, 26));
      lights(S, { shadow: 6, sun: 2.6, hemi: 1.4 });
      const ground = new THREE.Mesh(S.own(new THREE.CircleGeometry(9, 64)), S.own(std(0x4a3328, { roughness: 0.85 })));
      ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; S.scene.add(ground);
      S.onSize(() => {
        const d = fitDistance(S, 3.8, 2.9);
        S.camera.position.set(0, 0.72, 0.7).normalize().multiplyScalar(d);
        S.controls.target.set(0, 0, 0);
        fog.near = d * 1.26; fog.far = d * 2.7;
      });
      const SIZE = { t: 0.08, h: 0.5, w: 0.26 }, MAX = 400;
      const mesh = new THREE.InstancedMesh(S.own(new RoundedBoxGeometry(SIZE.t, SIZE.h, SIZE.w, 2, 0.015)), S.own(std(0xffffff, { roughness: 0.35 })), MAX);
      mesh.castShadow = mesh.receiveShadow = true; mesh.frustumCulled = false; mesh.count = 0;
      mesh.setColorAt(0, new THREE.Color());
      S.scene.add(mesh);
      const world = newWorld({ allowSleep: true, iter: 12 });
      const mFloor = new CANNON.Material(), mDom = new CANNON.Material();
      world.addContactMaterial(new CANNON.ContactMaterial(mFloor, mDom, { friction: 0.5, restitution: 0.02 }));
      world.addContactMaterial(new CANNON.ContactMaterial(mDom, mDom, { friction: 0.25, restitution: 0.05 }));
      fixed(world, new CANNON.Plane(), V(), PLANE_UP, mFloor);
      const box = new CANNON.Box(V(SIZE.t / 2, SIZE.h / 2, SIZE.w / 2));
      const base = [], dim = [], slept = new Int8Array(MAX);
      let doms = [], shape = 0, phase = "wait", phaseAt = 0, lastFallen = 0, lastChange = 0, auto = true, slow = 1;
      const setup = (i) => {
        shape = i; segSet(seg, i);
        for (const d of doms) world.removeBody(d.body);
        const pts = samplePath(DOMINO_PATHS[i], 0.25, MAX);
        doms = pts.map((pt, k) => {
          const body = new CANNON.Body({ mass: 0.12, material: mDom, shape: box, sleepSpeedLimit: 0.08, sleepTimeLimit: 0.4,
            position: V(pt.x, SIZE.h / 2, pt.z), quaternion: Q(0, Math.atan2(-pt.tz, pt.tx), 0) });
          world.addBody(body);
          body.sleep();
          base[k] = k === 0 ? new THREE.Color(0xffffff) : new THREE.Color().setHSL((k / pts.length) * 0.85, 0.75, 0.58);
          dim[k] = base[k].clone().multiplyScalar(0.45);
          return { body, pt };
        });
        mesh.count = doms.length;
        slept.fill(-1);
        phase = "wait"; phaseAt = world.time; lastFallen = 0;
      };
      const push = (i) => {
        const d = doms[i];
        if (!d) return;
        d.body.wakeUp();
        d.body.applyImpulse(V(d.pt.tx * 0.09, 0, d.pt.tz * 0.09), V(0, SIZE.h * 0.45, 0)); // tap the top edge forward
        if (phase === "wait") phase = "run";
        phaseAt = lastChange = world.time;
      };
      // y of the body's local up axis: 1 standing, about 0 lying flat.
      const upY = (b) => 1 - 2 * (b.quaternion.x ** 2 + b.quaternion.z ** 2);
      // A sleeping body acts as immovable during the step it is hit, which soaks up the chain's
      // momentum, so wake the next two dominoes ahead of anything that has started to tip.
      const wakeAhead = () => {
        for (let i = 0; i < doms.length; i++) {
          const b = doms[i].body;
          if (b.sleepState !== CANNON.Body.AWAKE || upY(b) > 0.995) continue;
          for (const j of [i + 1, i + 2]) if (doms[j] && doms[j].body.sleepState !== CANNON.Body.AWAKE) doms[j].body.wakeUp();
        }
      };
      const m4 = new THREE.Matrix4(), one = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3(), q = new THREE.Quaternion();
      const setChip = chip(ctx, "");
      S.onFrame((dt) => {
        wakeAhead();
        world.step(1 / 120, dt * slow, 6);
        let fallen = 0, sleeping = 0, recolor = false;
        doms.forEach((d, i) => {
          const b = d.body;
          mesh.setMatrixAt(i, m4.compose(p.copy(b.interpolatedPosition), q.copy(b.interpolatedQuaternion), one));
          if (upY(b) < 0.8) fallen++;
          const s = b.sleepState === CANNON.Body.SLEEPING ? 1 : 0;
          sleeping += s;
          if (s !== slept[i]) { slept[i] = s; mesh.setColorAt(i, s ? dim[i] : base[i]); recolor = true; }
        });
        mesh.instanceMatrix.needsUpdate = true;
        if (recolor) mesh.instanceColor.needsUpdate = true;
        const t = world.time;
        if (fallen !== lastFallen) { lastFallen = fallen; lastChange = t; }
        if (phase === "wait" && auto && t - phaseAt > 0.5) push(0);
        if (phase === "run" && (fallen === doms.length || t - lastChange > 2.5)) { phase = "done"; phaseAt = t; }
        if (phase === "done" && auto && t - phaseAt > 2.5) setup((shape + 1) % DOMINO_PATHS.length);
        setChip(`骨牌 <b>${doms.length}</b> 張・已倒 <b>${fallen}</b>・睡眠中 <b>${sleeping}</b>`);
      });
      const rc = new THREE.Raycaster(), ndc = new THREE.Vector2();
      onTap(ctx, S.canvas, (e) => {
        mesh.computeBoundingSphere();
        rc.setFromCamera(setNdc(S, e, ndc), S.camera);
        const hit = rc.intersectObject(mesh)[0];
        if (hit) { push(hit.instanceId); auto = false; autoBtn.setAttribute("aria-pressed", "false"); }
      });
      const seg = ctx.group(["螺旋", "波浪", "愛心"], 0, (i) => setup(i));
      ctx.button("推倒", () => { if (phase !== "wait") setup(shape); push(0); }, { primary: true });
      ctx.toggle("慢動作", false, (v) => { slow = v ? 0.25 : 1; });
      const autoBtn = ctx.toggle("自動輪播", true, (v) => { auto = v; });
      setup(0);

      const cLow = new THREE.Color(0x2f5d3a), cHigh = new THREE.Color(0x7d9a52), cRoad = new THREE.Color(0xb59a6a), c = new THREE.Color();
      for (let i = 0; i < NG; i++) for (let j = 0; j < NG; j++) {
        const k = i * NG + j, x = -HW + i, z = HW - j, y = data[i][j];
        pos.set([x, y, z], k * 3);
        c.lerpColors(cLow, cHigh, clamp(y / 3 + 0.5, 0, 1)).lerp(cRoad, 1 - clamp((Math.abs(Math.hypot(x, z) - R) - 1.2) / 0.8, 0, 1));
        col.set([c.r, c.g, c.b], k * 3);
        if (i < NG - 1 && j < NG - 1) idx.push(k, k + NG, k + 1, k + NG, k + NG + 1, k + 1);
      }
      const tg = S.own(new THREE.BufferGeometry());
      tg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      tg.setAttribute("color", new THREE.BufferAttribute(col, 3));
      tg.setIndex(idx);
      tg.computeVertexNormals();
      const terrain = new THREE.Mesh(tg, S.own(std(0xffffff, { vertexColors: true, roughness: 0.95 })));
      terrain.receiveShadow = true;
      S.scene.add(terrain);
      // vehicle: chassis box + four raycast wheels (front = local -x, left = local +z)
      const chassis = new CANNON.Body({ mass: 150 });
      chassis.addShape(new CANNON.Box(V(2, 0.5, 1)));
      const vehicle = new CANNON.RaycastVehicle({ chassisBody: chassis });
      const wheel = { radius: 0.5, directionLocal: V(0, -1, 0), suspensionStiffness: 30, suspensionRestLength: 0.3, frictionSlip: 1.4,
        dampingRelaxation: 2.3, dampingCompression: 4.4, maxSuspensionForce: 100000, rollInfluence: 0.01, axleLocal: V(0, 0, 1),
        maxSuspensionTravel: 0.3, customSlidingRotationalSpeed: -30, useCustomSlidingRotationalSpeed: true };
      for (const [x, z] of [[-1, 1], [-1, -1], [1, 1], [1, -1]]) vehicle.addWheel({ ...wheel, chassisConnectionPointLocal: V(x, 0, z) });
      vehicle.addToWorld(world);
      const car = new THREE.Group();
      const paint = S.own(std(PALETTE[0], { metalness: 0.3, roughness: 0.35 })), dark = S.own(std(0x1a1d24, { roughness: 0.7 }));
      const body1 = shadowed(S.own(new RoundedBoxGeometry(4, 0.6, 1.7, 3, 0.12)), paint);
      body1.position.y = 0.05;
      const cabin = shadowed(S.own(new RoundedBoxGeometry(1.9, 0.55, 1.5, 3, 0.12)), dark);
      cabin.position.set(0.25, 0.6, 0);
      car.add(body1, cabin);
      const wheelGeo = S.own(new THREE.CylinderGeometry(0.5, 0.5, 0.4, 24).rotateX(Math.PI / 2));
      const wheelMat = S.own(std(0x2a2d33, { roughness: 0.8 })), rimMat = S.own(std(0xc9ced6, { metalness: 0.7 }));
      const rimGeo = S.own(new THREE.BoxGeometry(0.7, 0.12, 0.42));
      const wheels = vehicle.wheelInfos.map(() => { const w = shadowed(wheelGeo, wheelMat); w.add(new THREE.Mesh(rimGeo, rimMat)); car.add(w); return w; });
      S.scene.add(car);
      // crates on the road
      const crateShape = new CANNON.Box(V(0.45, 0.45, 0.45)), crateGeo = S.own(new RoundedBoxGeometry(0.9, 0.9, 0.9, 2, 0.06));
      const crateMat = S.own(std(PALETTE[4], { roughness: 0.7 }));
      // frictionless chassis-crate contact: with friction the chassis edge rides up onto a crate and the car gets beached
      const chassisCM = new CANNON.Material("chassis"), crateCM = new CANNON.Material("crate");
      chassis.material = chassisCM;
      world.addContactMaterial(new CANNON.ContactMaterial(chassisCM, crateCM, { friction: 0, restitution: 0.2 }));
      const crates = Array.from({ length: 10 }, () => P.add(new CANNON.Body({ mass: 6, shape: crateShape, material: crateCM }), shadowed(crateGeo, crateMat)));
      const resetCrates = () => crates.forEach((b, k) => {
        const a = (k / 10) * Math.PI * 2 + 0.3, r = R + (k % 2 ? 0.7 : -0.7), x = r * Math.cos(a), z = r * Math.sin(a);
        if (Math.hypot(x - chassis.position.x, z - chassis.position.z) < 3.5) return; // the car is parked on that spot
        place(b, V(x, hAt(x, z) + 0.5, z), Q(0, -a, 0));
      });
      resetCrates();
      ctx.interval(resetCrates, 24000);
      let auto = true, stuck = 0, flipped = 0;
      const resetCar = (phi) => {
        // never drop the car onto a crate: step forward along the ring until the spot is clear
        const near = (a) => crates.some((b) => Math.hypot(b.position.x - R * Math.cos(a), b.position.z - R * Math.sin(a)) < 3.2);
        for (let k = 0; k < 12 && near(phi); k++) phi += 0.2;
        const x = R * Math.cos(phi), z = R * Math.sin(phi);
        place(chassis, V(x, hAt(x, z) + 1.3, z), new CANNON.Quaternion().setFromAxisAngle(V(0, 1, 0), Math.PI / 2 - phi));
        stuck = flipped = 0;
      };
      resetCar(0);
      const keys = new Set(), KEYS = ["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", " "];
      const autoBtn = ctx.toggle("自動駕駛", true, (v) => { auto = v; });
      ctx.on(window, "keydown", (e) => {
        const k = e.key.toLowerCase();
        if (!KEYS.includes(k)) return;
        e.preventDefault();
        keys.add(k);
        if (auto) { auto = false; autoBtn.setAttribute("aria-pressed", "false"); }
      });
      ctx.on(window, "keyup", (e) => keys.delete(e.key.toLowerCase()));
      ctx.button("重擺木箱", resetCrates);
      const cam = new THREE.Vector3(), look = new THREE.Vector3(), inv = new CANNON.Quaternion(), lq = new CANNON.Quaternion();
      let first = true;
      const setChip = chip(ctx, "");
      S.onFrame((dt) => {
        const p = chassis.position, kmh = Math.abs(vehicle.currentVehicleSpeedKmHour), phi = Math.atan2(p.z, p.x);
        let steer = 0, engine = 0, brake = 0;
        const has = (...ks) => ks.some((k) => keys.has(k));
        if (auto) {
          const ta = phi + 0.32, local = chassis.pointToLocalFrame(V(R * Math.cos(ta), p.y, R * Math.sin(ta)));
          steer = clamp(1.5 * Math.atan2(local.z, -local.x), -0.5, 0.5); // positive steering turns left (+z)
          engine = kmh < 30 ? -700 : 0;
        } else {
          if (has("w", "arrowup")) engine = -1000;
          if (has("s", "arrowdown")) engine = 600;
          if (has("a", "arrowleft")) steer = 0.5;
          if (has("d", "arrowright")) steer = -0.5;
          if (has(" ")) brake = 25;
        }
        for (let i = 0; i < 4; i++) { vehicle.setBrake(brake, i); if (i < 2) vehicle.setSteeringValue(steer, i); else vehicle.applyEngineForce(engine, i); }
        flipped = chassis.quaternion.vmult(V(0, 1, 0)).y < 0.3 ? flipped + dt : 0;
        stuck = auto && kmh < 2 ? stuck + dt : 0;
        if (flipped > 1.5 || stuck > 3 || Math.abs(p.x) > HW - 2 || Math.abs(p.z) > HW - 2 || p.y < -5) resetCar(phi);
        // draw: chassis from the interpolated pose, wheels relative to the chassis
        const ci = chassis.interpolatedPosition, cq = chassis.interpolatedQuaternion;
        car.position.copy(ci); car.quaternion.copy(cq);
        chassis.quaternion.conjugate(inv);
        const ground = vehicle.numWheelsOnGround; // read before updateWheelTransform, which clears isInContact
        vehicle.wheelInfos.forEach((w, i) => {
          vehicle.updateWheelTransform(i);
          const t = w.worldTransform;
          wheels[i].position.copy(chassis.pointToLocalFrame(t.position));
          wheels[i].quaternion.copy(inv.mult(t.quaternion, lq));
        });
        const f = cq.vmult(V(-1, 0, 0));
        const fl = Math.hypot(f.x, f.z) || 1;
        cam.set(ci.x - (f.x / fl) * 8, ci.y + 3.4, ci.z - (f.z / fl) * 8);
        cam.y = Math.max(cam.y, hAt(cam.x, cam.z) + 1.5);
        if (first) { S.camera.position.copy(cam); first = false; } else S.camera.position.lerp(cam, 1 - Math.exp(-dt * 3));
        S.camera.lookAt(look.set(ci.x + (f.x / fl) * 4, ci.y + 0.6, ci.z + (f.z / fl) * 4));
        sun.position.set(ci.x + 10, ci.y + 18, ci.z + 8);
        sun.target.position.copy(ci);
        setChip(`時速 <b>${kmh.toFixed(0)}</b> km/h・著地輪 <b>${ground}</b>/4・${auto ? "自動駕駛" : "手動駕駛"}`);
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "world.step(1 / 60)・world.broadphase = new CANNON.SAPBroadphase(world)・world.profile",
    desc: "把方塊與球持續倒進透明容器，逐級加量直到物理運算拖慢畫面；可切換寬相演算法與睡眠，看寬相、窄相、求解各花多少時間。",
    hint: "按「自動加壓」開始，可切換寬相與睡眠",
    mount(ctx) {
      ctx.html(`<div class="stress-view"></div>`);
      const host = ctx.$(".stress-view");
      ctx.controls.classList.add("bottom");
      const S = stage(ctx, { host, fov: 48, bg: 0x07080b, orbit: { autoRotate: true, autoRotateSpeed: 0.4, minDistance: 6, maxDistance: 40, maxPolarAngle: Math.PI * 0.48 } });
      lights(S, { shadow: 0, pos: [4, 12, 6], hemi: 1.4, sun: 2.2 });
      camRig(S)({ t: [0, 1.6, 0], d: [0, 0.75, 1], hw: 5.2, hh: 3.2 }, true);
      const world = newWorld({ allowSleep: true });
      world.doProfiling = true;
      const sap = world.broadphase, naive = new CANNON.NaiveBroadphase();
      naive.setWorld(world);
      fixed(world, new CANNON.Plane(), V(), PLANE_UP);
      const HB = 4.5;
      for (const [x, z, hx, hz] of [[HB + 0.25, 0, 0.25, HB], [-HB - 0.25, 0, 0.25, HB], [0, HB + 0.25, HB, 0.25], [0, -HB - 0.25, HB, 0.25]]) {
        fixed(world, new CANNON.Box(V(hx, 4, hz)), V(x, 4, z));
      }
      floor(S, HB * 2, HB * 2, 0x161b24);
      const cage = new THREE.LineSegments(S.own(new THREE.EdgesGeometry(new THREE.BoxGeometry(HB * 2, 3.5, HB * 2))), S.own(new THREE.LineBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.45 })));
      cage.position.y = 1.75;
      S.scene.add(cage);
      const CAP = 4000;
      const ims = [new THREE.BoxGeometry(0.34, 0.34, 0.34), new THREE.SphereGeometry(0.18, 12, 8)].map((g) => {
        const im = new THREE.InstancedMesh(S.own(g), S.own(std(0xffffff, { roughness: 0.45 })), CAP);
        im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        im.frustumCulled = false;
        im.count = 0;
        im.setColorAt(0, new THREE.Color());
        S.scene.add(im);
        return im;
      });
      const shapes = [new CANNON.Box(V(0.17, 0.17, 0.17)), new CANNON.Sphere(0.18)];
      const all = [], lists = [[], []], col = new THREE.Color();
      const paint = (r) => ims[r.kind].setColorAt(r.idx, col.setHex(PALETTE[r.idx % 6]).multiplyScalar(r.asleep ? 0.3 : 1));
      const add = (x, y, z) => {
        const kind = all.length % 3 === 2 ? 1 : 0; // two boxes per sphere
        const body = new CANNON.Body({ mass: 1, shape: shapes[kind], position: V(x, y, z), quaternion: Q(rand(0, 3), rand(0, 3), 0), sleepSpeedLimit: 0.15, sleepTimeLimit: 0.5 });
        world.addBody(body);
        const r = { body, kind, idx: lists[kind].length, asleep: false };
        lists[kind].push(body);
        all.push(r);
        paint(r);
      };
      let ms = 0, awake = 0;
      const prof = { broadphase: 0, narrowphase: 0, solve: 0 };
      const m4 = new THREE.Matrix4(), one = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3(), q = new THREE.Quaternion();
      S.onFrame(() => {
        const t0 = performance.now();
        world.step(1 / 60); // exactly one step per frame, so a slow step shows up as a low FPS
        ms += (performance.now() - t0 - ms) * 0.15;
        for (const k in prof) prof[k] += (world.profile[k] - prof[k]) * 0.15;
        awake = 0;
        let recolor = false;
        for (const r of all) {
          const b = r.body, s = b.sleepState === CANNON.Body.SLEEPING;
          if (!s) awake++;
          if (s !== r.asleep) { r.asleep = s; paint(r); recolor = true; }
          ims[r.kind].setMatrixAt(r.idx, m4.compose(p.copy(b.position), q.copy(b.quaternion), one));
        }
        for (const im of ims) { im.instanceMatrix.needsUpdate = true; if (recolor) im.instanceColor.needsUpdate = true; }
      });
      ctx.group(["SAP 寬相", "Naive 寬相"], 0, (i) => { world.broadphase = i ? naive : sap; });
      ctx.toggle("允許睡眠", true, (v) => { world.allowSleep = v; if (!v) for (const r of all) r.body.wakeUp(); });
      ctx.ramp({
        label: "剛體數", unit: "個",
        steps: [100, 250, 500, 1000, 1500, 2000, 3000, 4000],
        minFps: 30,
        apply(n) {
          while (all.length > n) { const r = all.pop(); world.removeBody(r.body); lists[r.kind].pop(); }
          let top = 0;
          for (const r of all) top = Math.max(top, r.body.position.y);
          // new bodies go on a 0.5 m lattice above the current pile, 289 per layer
          for (let k = 0, need = n - all.length; k < need; k++) {
            const s = ((k % 289) * 97) % 289, layer = Math.floor(k / 289); // 97 is coprime to 289: spreads a partial layer over the floor
            add(-4 + (s % 17) * 0.5 + rand(-0.04, 0.04), top + 0.6 + layer * 0.5, -4 + Math.floor(s / 17) * 0.5 + rand(-0.04, 0.04));
          }
          ims[0].count = lists[0].length; ims[1].count = lists[1].length;
          for (const im of ims) im.instanceColor.needsUpdate = true;
        },
        metrics: () => ({
          物理每步: `${ms.toFixed(1)} ms`, 寬相: `${prof.broadphase.toFixed(1)} ms`, 窄相: `${prof.narrowphase.toFixed(1)} ms`,
          求解: `${prof.solve.toFixed(1)} ms`, 接觸數: world.contacts.length, 醒著: awake,
        }),
        note: "每格只跑一次 world.step(1/60) 並量 JS 耗時，所以物理一慢 FPS 就跟著掉。寬相找出可能相撞的配對：SAP 沿座標軸排序後掃描，Naive 兩兩比對是 O(n²)；窄相計算實際接觸點；求解器以 GaussSeidel 迭代所有接觸與約束，接觸數越多越慢。開啟睡眠時靜止的物體（變暗）不參與求解，關掉可看全部醒著的成本。繪圖只用兩個 InstancedMesh，瓶頸在 CPU 端的物理。",
      });
    },
  },
] });
</script>
