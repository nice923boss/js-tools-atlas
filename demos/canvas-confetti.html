<style>
  .sc-scene canvas.cf { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .sc-scene .night { position: absolute; inset: 0; background: radial-gradient(80% 90% at 50% 20%, #1d2333 0%, #0e1013 70%); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; background: rgba(14, 16, 19, .8); border: 1px solid var(--line); font: 600 12px/1.35 var(--font); color: var(--fg); white-space: nowrap; }
  .chip code, .chip .num { font: 600 12px/1.35 var(--mono); color: var(--c2); }
  .chip .def { font: 500 11px/1 var(--font); color: var(--c4); }

  /* 1. party card */
  .party { cursor: pointer; }
  .party .card { position: absolute; left: 50%; top: calc(50% + var(--sc-ctl-h, 0px) / 2); transform: translate(-50%, -50%); width: min(340px, calc(100% - 32px)); text-align: center; padding: 20px 20px 18px; }
  .party .badge { font-size: 42px; line-height: 1; }
  .party h1 { margin: 8px 0 4px; font-size: clamp(22px, 5vw, 30px); }
  .party p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .party .prize { font-size: 15px; color: var(--accent); font-weight: 700; min-height: 1.6em; }

  /* 2. lanes, 3. shape cells */
  .lanes, .cells { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px 10px; display: grid; gap: 8px; }
  .lanes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cells { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 560px) { .cells { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); } }
  .lane, .cell { position: relative; overflow: hidden; border-radius: 12px; border: 1px dashed var(--line); background: rgba(255, 255, 255, .025); min-height: 0; }
  .cell { cursor: pointer; }
  .lane .chip, .cell .chip { position: absolute; left: 50%; transform: translateX(-50%); z-index: 2; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; }
  .lane .chip { top: 8px; }
  .cell .chip { bottom: 8px; }
  .cell .sub { position: absolute; left: 0; right: 0; top: 8px; text-align: center; font-size: 11.5px; color: var(--muted); z-index: 2; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 4. recipes, 5. promise log */
  .caption { position: absolute; left: 10px; bottom: 10px; z-index: 3; max-width: calc(100% - 20px); white-space: normal; }
  .side { position: absolute; left: 10px; bottom: 10px; z-index: 3; width: min(400px, calc(100% - 20px)); display: flex; flex-direction: column; gap: 6px; }
  .side .state { align-self: flex-start; }
  .side .state i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .side.busy .state i { background: var(--c4); box-shadow: 0 0 8px var(--c4); }
  .log { padding: 8px 10px; font-size: 12.5px; line-height: 1.55; min-height: 2.2em; }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .ts { font: 500 11.5px/1 var(--mono); color: var(--muted); margin-right: 6px; }
  .log b { font-family: var(--mono); color: var(--accent); }
  .log .ok b { color: var(--c4); }

  /* 6. course cards */
  .courses { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 6px) 14px 14px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .courses h2 { margin: 0; font-size: clamp(16px, 3vw, 22px); text-align: center; }
  .courses h2 small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .courses .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .course { position: relative; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 6px; min-height: 160px; }
  .course .city { font-size: 18px; font-weight: 800; }
  .course .meta { font-size: 12.5px; color: var(--muted); }
  .course .seat { font-size: 13px; margin-top: auto; }
  .course .seat b { font: 700 16px/1 var(--mono); color: var(--accent); }
  .course .btn { position: relative; z-index: 1; align-self: flex-start; }
  .course canvas.cf { z-index: 2; }
  .courses ~ canvas.cf { z-index: 4; }
  @media (max-width: 560px) {
    .courses .grid { grid-template-columns: 1fr; gap: 8px; }
    .course { min-height: 0; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 10px; row-gap: 2px; align-items: center; }
    .course .city { font-size: 15px; }
    .course .seat { margin: 0; grid-column: 1; }
    .course .btn { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  }

  /* 7. stress */
  .lab-stage { position: absolute; inset: 8px; border-radius: 12px; overflow: hidden; background: radial-gradient(70% 80% at 50% 100%, #1d2333 0%, #0e1013 75%); border: 1px solid var(--line); }
  @media (min-width: 761px) { .lab-stage { inset: 8px 8px 8px 350px; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// canvas-confetti showcase: seven scenes from the original raffle card to a continuous-fire stress ramp.
const { h, fmt, fmtMs } = Showcase;
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#9d8cff", "#ff8c42"];
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

// canvas-confetti draws in canvas pixels and has no devicePixelRatio handling, so canvases stay 1:1 with their CSS box.
function fit(canvas) {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(r.width));
  canvas.height = Math.max(1, Math.round(r.height));
}
// One confetti instance bound to a canvas inside `host` (instead of the library's full-page canvas).
function cannon(ctx, host, { cls = "" } = {}) {
  const canvas = h("canvas", { class: `cf ${cls}`.trim() });
  host.append(canvas);
  fit(canvas);
  const fire = confetti.create(canvas, { resize: true });
  ctx.onResize(() => fit(canvas));
  ctx.onCleanup(() => fire.reset());
  return { canvas, fire };
}
// Normalised origin {x, y} of a client point inside a canvas.
function originAt(canvas, clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width, y: (clientY - r.top) / r.height };
}
// Call fn every animation frame for `ms` milliseconds.
function during(ctx, ms, fn) {
  const end = performance.now() + ms;
  const stop = ctx.raf((t, dt) => { fn(t, dt); if (t >= end) stop(); });
  return stop;
}
const HEART = "M10 17.5 C 3 12 0 8.5 0 5.2 C 0 2.3 2.3 0 5.1 0 C 7 0 8.8 1.1 10 2.8 C 11.2 1.1 13 0 14.9 0 C 17.7 0 20 2.3 20 5.2 C 20 8.5 17 12 10 17.5 Z";
const heartShape = () => confetti.shapeFromPath({ path: HEART, matrix: [0.5, 0, 0, 0.5, -5, -4.375] });
const emojiShapes = (list, scalar) => list.map((text) => confetti.shapeFromText({ text, scalar }));

Showcase.run({ scenes: [
  {
    id: "party", title: "尾牙抽獎",
    api: "const fire = confetti.create(canvas, { resize: true }); fire({ particleCount, spread, origin, shapes })",
    desc: "原本的招牌示範：五種特效都是同一個 fire() 換參數。這裡用 confetti.create 綁定場景自己的 canvas，不另外蓋一層全頁畫布。",
    hint: "點畫面任何地方在該處放彩紙・右上切換特效・按「抽獎」換獎項",
    mount(ctx) {
      ctx.html(`<div class="night party"><div class="card panel"><div class="badge">🏆</div><h1>尾牙抽獎</h1>
        <p>點「抽獎」或點畫面任何地方放彩紙</p><div class="prize">頭獎：日本雙人來回機票</div>
        <button class="btn primary draw" type="button" style="margin-top:10px">抽獎</button></div></div>`);
      const PRIZES = ["頭獎：日本雙人來回機票", "二獎：最新款手機", "三獎：百貨禮券一萬元", "特別獎：帶薪假三天", "普獎：珍奶一年份"];
      const emoji = emojiShapes(["🎉", "🧋", "🧧"], 2.2);
      const FX = {
        burst(x = 0.5, y = 0.55) { fire({ particleCount: 140, spread: 80, startVelocity: 42, origin: { x, y }, colors: COLORS }); },
        cannons() {
          during(ctx, 1200, () => {
            fire({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.75 }, colors: COLORS });
            fire({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.75 }, colors: COLORS });
          });
        },
        fireworks() {
          for (let i = 0; i < 3; i++) {
            ctx.timeout(() => fire({
              particleCount: 70, spread: 360, startVelocity: 28, ticks: 70, gravity: 0.6, scalar: 0.9,
              origin: { x: rnd(0.15, 0.85), y: rnd(0.15, 0.5) }, colors: COLORS,
            }), i * 280);
          }
        },
        stars(x = 0.5, y = 0.45) {
          const o = { spread: 360, ticks: 60, gravity: 0, decay: 0.94, startVelocity: 26, colors: ["#fff3b0", "#f7df1e", "#ffb703"], origin: { x, y } };
          fire({ ...o, particleCount: 40, scalar: 1.3, shapes: ["star"] });
          fire({ ...o, particleCount: 14, scalar: 0.7, shapes: ["circle"] });
        },
        emoji(x = 0.5, y = 0.6) { fire({ particleCount: 36, spread: 100, startVelocity: 38, scalar: 2.2, flat: true, shapes: emoji, origin: { x, y } }); },
      };
      const keys = Object.keys(FX);
      let current = "burst", auto = true;
      ctx.group(["彩紙", "兩側禮炮", "煙火", "星星", "表情"], 0, (i) => { current = keys[i]; FX[current](); });
      ctx.toggle("自動播放", auto, (v) => { auto = v; });
      const { canvas, fire } = cannon(ctx, ctx.el);
      ctx.on(ctx.$(".draw"), "click", () => {
        ctx.$(".prize").textContent = pick(PRIZES);
        FX.cannons();
      });
      ctx.on(ctx.$(".party"), "pointerdown", (e) => {
        if (e.target.closest(".btn")) return;
        const o = originAt(canvas, e.clientX, e.clientY);
        FX[current](o.x, o.y);
      });
      FX.burst();
      ctx.interval(() => { if (auto) FX[current](rnd(0.2, 0.8), rnd(0.35, 0.65)); }, 1500);
    },
  },
  {
    id: "params", title: "參數對比",
    api: "fire({ particleCount, angle, spread, startVelocity, decay, gravity, drift, ticks, scalar, flat })",
    desc: "三條跑道各自一個 confetti 實例，同時發射、只差一個參數。中間那條是官方預設值，左右兩條往小與往大調。",
    hint: "上方選單切換參數・flat 關掉翻轉與擺動・每 2.2 秒自動重發",
    mount(ctx) {
      ctx.html(`<div class="lanes">${"<div class=\"lane\"><span class=\"chip\"></span></div>".repeat(3)}</div>`);
      // Middle column = library default (particleCount 50, spread 45, ...), the others step down and up.
      const PARAMS = {
        particleCount: [15, 50, 160],
        angle: [60, 90, 120],
        spread: [20, 45, 160],
        startVelocity: [25, 45, 65],
        decay: [0.85, 0.9, 0.95],
        gravity: [0.3, 1, 2.5],
        drift: [-2, 0, 2],
        ticks: [60, 200, 450],
        scalar: [0.6, 1, 2],
      };
      const BASE = { particleCount: 100, angle: 90, spread: 45, startVelocity: 45, decay: 0.9, gravity: 1, drift: 0, ticks: 200, scalar: 1 };
      let param = "spread", flat = false;
      ctx.select("參數", Object.keys(PARAMS), param, (v) => { param = v; label(); shoot(true); });
      ctx.toggle("flat", flat, (v) => { flat = v; shoot(true); });
      ctx.button("發射", () => shoot(false), { primary: true });
      const lanes = ctx.$$(".lane").map((lane) => ({ lane, chip: lane.querySelector(".chip"), ...cannon(ctx, lane) }));
      function label() {
        lanes.forEach((l, i) => {
          l.chip.innerHTML = `<code>${param}: ${PARAMS[param][i]}</code>${i === 1 ? '<span class="def">預設</span>' : ""}`;
        });
      }
      function shoot(clear) {
        lanes.forEach((l, i) => {
          if (clear) l.fire.reset();
          l.fire({ ...BASE, [param]: PARAMS[param][i], flat, origin: { x: 0.5, y: 0.98 }, colors: COLORS });
        });
      }
      label();
      shoot(false);
      ctx.interval(() => shoot(false), 2200);
    },
  },
  {
    id: "shapes", title: "形狀與顏色",
    api: "shapes: ['square' | 'circle' | 'star', confetti.shapeFromPath({ path, matrix }), confetti.shapeFromText({ text, scalar, color })]",
    desc: "內建三種形狀，另外可用 SVG 路徑或文字（中文字、emoji）做成自訂形狀。colors 只影響內建形狀與路徑，文字形狀的顏色在建立時就固定了，搭配 flat: true 才不會被翻轉壓扁。",
    hint: "點任一格在該處補發・上方切換 colors",
    mount(ctx) {
      ctx.html(`<div class="cells">${"<div class=\"cell\"><span class=\"sub\"></span><span class=\"chip\"></span></div>".repeat(6)}</div>`);
      const hanzi = [["福", "#f72585"], ["賀", "#f7df1e"], ["春", "#ff8c42"]].map(([text, color]) => confetti.shapeFromText({ text, color, scalar: 3, fontFamily: FONT }));
      const CELLS = [
        { name: "'square'", sub: "內建：方塊", opts: { shapes: ["square"] } },
        { name: "'circle'", sub: "內建：圓形", opts: { shapes: ["circle"] } },
        { name: "'star'", sub: "內建：星形", opts: { shapes: ["star"], scalar: 1.2 } },
        { name: "shapeFromPath", sub: "SVG 路徑：愛心", opts: { shapes: [heartShape()], scalar: 1.4 } },
        { name: "shapeFromText", sub: "中文字：福、賀、春", bitmap: true, opts: { shapes: hanzi, scalar: 3, flat: true, particleCount: 16 } },
        { name: "shapeFromText", sub: "emoji：🧋 🎉 🧧", bitmap: true, opts: { shapes: emojiShapes(["🧋", "🎉", "🧧"], 3), scalar: 3, flat: true, particleCount: 16 } },
      ];
      const PALETTES = [undefined, COLORS, ["#bb0000", "#f7df1e", "#ffd166"], ["#4cc9f0"]];
      let colors = PALETTES[0];
      ctx.group(["預設色", "JS 六色", "紅金", "單色"], 0, (i) => { colors = PALETTES[i]; puffAll(); });
      ctx.button("全部發射", () => puffAll(), { primary: true });
      const cells = ctx.$$(".cell").map((el, i) => {
        const c = CELLS[i];
        el.querySelector(".sub").textContent = c.bitmap ? `${c.sub}（顏色固定）` : c.sub;
        el.querySelector(".chip").innerHTML = `<code>${c.name}</code>`;
        return { el, c, ...cannon(ctx, el) };
      });
      function puff(cell, origin = { x: 0.5, y: 0.45 }) {
        const r = cell.canvas.getBoundingClientRect();
        // Scale launch speed to the cell so the burst stays inside it on small screens.
        const v = clamp(Math.min(r.width, r.height) / 13, 7, 17);
        const o = { particleCount: 26, spread: 360, startVelocity: v, decay: 0.9, gravity: 0.45, ticks: 150, origin, ...cell.c.opts };
        if (colors && !cell.c.bitmap) o.colors = colors;
        cell.fire(o);
      }
      function puffAll() { cells.forEach((c, i) => ctx.timeout(() => puff(c), i * 110)); }
      cells.forEach((cell) => ctx.on(cell.el, "pointerdown", (e) => puff(cell, originAt(cell.canvas, e.clientX, e.clientY))));
      puffAll();
      ctx.interval(puffAll, 2200);
    },
  },
  {
    id: "recipes", title: "官方配方",
    api: "README 範例：Realistic Look、Fireworks、School Pride、Snow",
    desc: "照官方 README 的四個配方寫：逼真是同一點連發五次不同參數疊加；煙火每 250 毫秒兩發；校隊配色每格左右各發 2 顆；下雪每格 1 顆、startVelocity 0。時間縮短方便輪播。",
    hint: "上方切換配方・關掉「輪播」可重複看同一個",
    mount(ctx) {
      ctx.html(`<div class="night"></div><span class="chip caption"></span>`);
      const capEl = ctx.$(".caption");
      const RECIPES = [
        {
          name: "逼真", dur: 2600,
          cap: "同一個 origin 連發 5 次：spread 26 到 120、decay 0.9 到 0.92、scalar 0.8 到 1.2，共 200 顆",
          start() {
            const count = 200, defaults = { origin: { y: 0.7 } };
            const shot = (ratio, o) => fire({ ...defaults, ...o, particleCount: Math.floor(count * ratio) });
            shot(0.25, { spread: 26, startVelocity: 55 });
            shot(0.2, { spread: 60 });
            shot(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            shot(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            shot(0.1, { spread: 120, startVelocity: 45 });
          },
        },
        {
          name: "煙火", dur: 4500, cap: "每 250 ms 在左右兩側各炸一發：spread 360、ticks 60，數量隨剩餘時間遞減",
          start() { this.next = 0; },
          frame(el) {
            if (el < this.next) return;
            this.next += 250;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60 };
            const particleCount = 50 * ((this.dur - el) / this.dur);
            fire({ ...defaults, particleCount, origin: { x: rnd(0.1, 0.3), y: Math.random() - 0.2 } });
            fire({ ...defaults, particleCount, origin: { x: rnd(0.7, 0.9), y: Math.random() - 0.2 } });
          },
        },
        {
          name: "校隊配色", dur: 3000, cap: "每格左右各 2 顆：angle 60 與 120、origin x 0 與 1、colors 紅白兩色",
          frame() {
            const colors = ["#bb0000", "#ffffff"];
            fire({ particleCount: 2, angle: 60, spread: 55, origin: { x: 0 }, colors });
            fire({ particleCount: 2, angle: 120, spread: 55, origin: { x: 1 }, colors });
          },
        },
        {
          name: "下雪", dur: 6000, cap: "每格 1 顆白色圓形：startVelocity 0、gravity 0.4 到 0.6、drift ±0.4、ticks 隨時間遞減",
          start() { this.skew = 1; },
          frame(el) {
            const ticks = Math.max(200, 500 * ((this.dur - el) / this.dur));
            this.skew = Math.max(0.8, this.skew - 0.001);
            fire({
              particleCount: 1, startVelocity: 0, ticks,
              origin: { x: Math.random(), y: Math.random() * this.skew - 0.2 },
              colors: ["#ffffff"], shapes: ["circle"],
              gravity: rnd(0.4, 0.6), scalar: rnd(0.4, 1), drift: rnd(-0.4, 0.4),
            });
          },
        },
      ];
      let idx = 0, auto = true, t0 = 0;
      const seg = ctx.group(RECIPES.map((r) => r.name), 0, (i) => play(i));
      ctx.toggle("輪播", auto, (v) => { auto = v; });
      const { fire } = cannon(ctx, ctx.el);
      function play(i) {
        idx = i;
        [...seg.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
        fire.reset();
        const r = RECIPES[i];
        capEl.innerHTML = `<b>${r.name}</b>${r.cap}`;
        t0 = performance.now();
        r.start?.();
      }
      ctx.raf((t) => {
        const r = RECIPES[idx], el = t - t0;
        if (el < r.dur) r.frame?.(el);
        else if (el > r.dur + 1400) play(auto ? (idx + 1) % RECIPES.length : idx);
      });
      play(0);
    },
  },
  {
    id: "promise", title: "Promise 與 reset",
    api: "await fire(opts)・fire.reset()・fire({ disableForReducedMotion: true })",
    desc: "fire() 回傳 Promise，所有粒子消失才 resolve；動畫進行中再呼叫會加進同一批，拿到同一個 Promise。reset() 立刻清空畫布並 resolve。",
    hint: "按上方按鈕看左下紀錄・ticks 越大等越久・操作後自動示範停止",
    mount(ctx) {
      ctx.html(`<div class="night"></div><div class="side"><span class="chip state"><i></i><span>閒置</span></span><div class="log panel"></div></div>`);
      const side = ctx.$(".side"), stateEl = ctx.$(".state span"), logEl = ctx.$(".log");
      const reduce = matchMedia("(prefers-reduced-motion)").matches;
      const born = performance.now();
      let ticks = 200, waiting = 0, user = false;
      const log = (html, cls = "") => {
        const row = h("div", { class: cls });
        row.innerHTML = `<span class="ts">+${((performance.now() - born) / 1000).toFixed(1)}s</span>${html}`;
        logEl.append(row);
        while (logEl.children.length > 6) logEl.firstChild.remove();
      };
      const busy = (d) => {
        waiting += d;
        stateEl.textContent = waiting ? `動畫中，${waiting} 個 await 等待中` : "閒置，沒有等待中的 Promise";
        side.classList.toggle("busy", waiting > 0);
      };
      async function track(p, what) {
        const s = performance.now();
        busy(1);
        await p;
        if (!ctx.active) return;
        busy(-1);
        log(`${what} resolve，等了 <b>${fmtMs(performance.now() - s)}</b>`, "ok");
      }
      const burst = (x, o = {}) => fire({ particleCount: 90, spread: 70, startVelocity: 40, ticks, origin: { x, y: 0.62 }, colors: COLORS, ...o });
      const DEMOS = {
        async wait() {
          log(`fire({ ticks: <b>${ticks}</b> }) 回傳 Promise（約 ${(ticks / 60).toFixed(1)} 秒）`);
          await track(burst(0.5), "Promise");
        },
        async join() {
          const p1 = burst(0.3);
          await ctx.sleep(500);
          const p2 = burst(0.7);
          log(`動畫中再呼叫 fire()：p1 === p2 是 <b>${p1 === p2}</b>`);
          await track(p2, "同一個 Promise");
        },
        async chain() {
          log("await 依序發射：左、中、右，每發等上一發結束");
          for (const x of [0.2, 0.5, 0.8]) {
            await fire({ particleCount: 60, spread: 60, startVelocity: 35, ticks: 90, origin: { x, y: 0.62 }, colors: COLORS });
            if (!ctx.active) return;
            log(`x = <b>${x}</b> 這發結束`, "ok");
          }
        },
        async reset() {
          if (!waiting) { track(burst(0.5, { ticks: 600, particleCount: 160 }), "長動畫的 Promise"); await ctx.sleep(900); }
          fire.reset();
          log("fire.reset()：畫布清空，等待中的 Promise 立即 resolve");
        },
        async rm() {
          const p = burst(0.5, { disableForReducedMotion: true });
          log(reduce ? "系統開啟減少動態：沒有畫任何粒子，Promise 直接 resolve" : "disableForReducedMotion：此系統未開啟減少動態，照常發射");
          await track(p, "Promise");
        },
      };
      const act = (k) => () => { user = true; DEMOS[k](); };
      ctx.button("發射並等待", act("wait"), { primary: true });
      ctx.button("動畫中加發", act("join"));
      ctx.button("await 三連發", act("chain"));
      ctx.button("reset()", act("reset"));
      ctx.button("減少動態", act("rm"), { title: "disableForReducedMotion" });
      ctx.slider("ticks", { min: 60, max: 600, step: 20, value: ticks }, (v) => { ticks = v; });
      const { fire } = cannon(ctx, ctx.el);
      log(`prefers-reduced-motion：<b>${reduce ? "開啟" : "未開啟"}</b>（頁面無法自行切換，要在系統設定改）`);
      busy(0);
      // Self-running tour until the viewer presses a button.
      const tour = ["wait", "join", "chain", "reset", "rm"];
      let step = 0;
      DEMOS.wait();
      ctx.interval(() => { if (!user) DEMOS[tour[++step % tour.length]](); }, 4800);
    },
  },
  {
    id: "multi", title: "多畫布",
    api: "cards.map((card) => confetti.create(card.querySelector('canvas'), { resize: true }))",
    desc: "每張卡片各有自己的 canvas 與實例，彩紙從按鈕位置噴出並被裁在卡片內；「全部報名」改用蓋住整個場景的另一個實例。",
    hint: "按卡片上的「報名」・右上「全部報名」用全幕畫布",
    mount(ctx) {
      const COURSES = [["台北場", "11/14（六）・中山區"], ["台中場", "11/21（六）・西屯區"], ["高雄場", "11/28（六）・前鎮區"]];
      ctx.html(`<div class="night"></div><div class="courses"><h2>週末 JS 動畫工作坊<small>三地開課，名額為示意資料</small></h2><div class="grid">${COURSES.map(([city, meta]) =>
        `<div class="course panel"><div class="city">${city}</div><div class="meta">${meta}</div><div class="seat">剩 <b>8</b> 位</div><button class="btn primary" type="button">報名</button></div>`).join("")}</div></div>`);
      let user = false;
      ctx.button("全部報名", () => { user = true; all(); }, { primary: true });
      ctx.button("重設名額", () => { cards.forEach((c) => setSeats(c, 8)); });
      const cards = ctx.$$(".course").map((el) => ({ el, btn: el.querySelector(".btn"), seatEl: el.querySelector(".seat b"), seats: 8, ...cannon(ctx, el) }));
      const overlay = cannon(ctx, ctx.el);
      function setSeats(c, n) {
        c.seats = n;
        c.seatEl.textContent = n;
        c.btn.disabled = n <= 0;
        c.btn.textContent = n <= 0 ? "額滿" : "報名";
      }
      function signUp(c) {
        if (c.seats <= 0) return;
        setSeats(c, c.seats - 1);
        const b = c.btn.getBoundingClientRect();
        c.fire({ particleCount: 80, spread: 75, startVelocity: 26, ticks: 160, scalar: 0.9, colors: COLORS, origin: originAt(c.canvas, b.left + b.width / 2, b.top + b.height / 2) });
      }
      function all() {
        cards.forEach((c) => setSeats(c, Math.max(0, c.seats - 1)));
        during(ctx, 900, () => {
          overlay.fire({ particleCount: 5, angle: 60, spread: 60, origin: { x: 0, y: 0.85 }, colors: COLORS });
          overlay.fire({ particleCount: 5, angle: 120, spread: 60, origin: { x: 1, y: 0.85 }, colors: COLORS });
        });
      }
      cards.forEach((c) => ctx.on(c.btn, "click", () => { user = true; signUp(c); }));
      signUp(cards[0]);
      ctx.interval(() => {
        if (user) return;
        const open = cards.filter((c) => c.seats > 0);
        if (!open.length) cards.forEach((c) => setSeats(c, 8));
        else signUp(pick(open));
      }, 1700);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "每格 fire({ particleCount: N / ticks, ticks: 100 })・confetti.create(canvas, { useWorker })",
    desc: "每格連續呼叫 fire() 補充粒子，讓畫面上維持約 N 顆彩紙（每顆活 100 格），逐級加量直到主執行緒掉到 30 FPS 以下。可切換 useWorker 與形狀比較。",
    hint: "按「自動加壓」開始・切換 useWorker 或形狀後再測一次",
    mount(ctx) {
      ctx.html(`<div class="lab-stage"></div>`);
      const stage = ctx.$(".lab-stage");
      const TICKS = 100;
      const canWorker = typeof OffscreenCanvas === "function" && "transferControlToOffscreen" in HTMLCanvasElement.prototype;
      const SHAPES = [["square"], ["circle"], ["star"], emojiShapes(["🎉"], 1.8)];
      let useWorker = false, shapeIdx = 0, target = 0, acc = 0, phase = 0, fireMs = 0, inst = null;
      ctx.controls.classList.add("bottom");
      ctx.group(["方塊", "圓形", "星形", "表情"], 0, (i) => { shapeIdx = i; });
      ctx.toggle(canWorker ? "useWorker" : "useWorker（不支援）", useWorker, (v) => { useWorker = v; build(); });
      // A worker-backed canvas is transferred to OffscreenCanvas and cannot be resized or reused, so rebuild it.
      function build() {
        if (inst) { inst.fire.reset(); inst.canvas.remove(); }
        const canvas = h("canvas", { class: "cf" });
        stage.append(canvas);
        fit(canvas);
        inst = { canvas, fire: confetti.create(canvas, { resize: true, useWorker }) };
        acc = 0;
      }
      build();
      ctx.onCleanup(() => inst.fire.reset());
      ctx.onResize(() => (useWorker ? build() : fit(inst.canvas)));
      ctx.raf((t, dt) => {
        if (!target) return;
        phase += dt / 1000;
        acc += (target / TICKS) * Math.min(1, dt / 16.7);
        const n = Math.floor(acc);
        if (n < 1) return;
        acc -= n;
        const v = clamp(inst.canvas.clientHeight / 15, 22, 46);
        const t0 = performance.now();
        inst.fire({
          particleCount: n, ticks: TICKS, angle: 90, spread: 70, startVelocity: v, colors: COLORS,
          origin: { x: 0.5 + 0.38 * Math.sin(phase * 0.9), y: 1.02 },
          shapes: SHAPES[shapeIdx], scalar: shapeIdx === 3 ? 1.8 : 1,
        });
        fireMs += (performance.now() - t0 - fireMs) * 0.1;
      });
      ctx.ramp({
        label: "畫面彩紙", unit: "顆", steps: [500, 1000, 2000, 4000, 6000, 8000, 12000, 16000, 24000], minFps: 30, warmup: 1800,
        apply(n) { target = n; },
        metrics: () => ({
          每格發射: `${fmt(target / TICKS)} 顆`,
          "fire() 耗時": `${fireMs.toFixed(2)} ms`,
          繪圖位置: useWorker && canWorker ? "Worker" : "主執行緒",
        }),
        note: "每顆彩紙固定活 100 格，所以每格補發 N / 100 顆就能維持約 N 顆在畫面上。主執行緒模式下，粒子的位置更新與 Canvas 2D 繪圖都在主執行緒，FPS 直接反映負擔；開 useWorker 後計算與繪圖移到 Worker 的 OffscreenCanvas，這裡的 FPS 只量主執行緒，Worker 畫面是否卡頓要用眼睛看。表情形狀是點陣圖，每顆每格都要建立 pattern 與矩陣，通常最重。",
      });
    },
  },
] });
</script>
