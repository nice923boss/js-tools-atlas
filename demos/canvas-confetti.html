<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canvas-confetti 示範：五種慶祝特效</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(80% 90% at 50% 20%, #1d2333 0%, #0e1013 70%); cursor: pointer; }
  .card {
    position: fixed; left: 50%; top: 52%; transform: translate(-50%, -50%);
    width: min(360px, calc(100% - 32px)); text-align: center; padding: 26px 22px;
  }
  .card .badge { font-size: 44px; line-height: 1; }
  .card h1 { margin: 10px 0 4px; font-size: clamp(22px, 5vw, 30px); }
  .card p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
  .card .prize { font-size: 15px; color: var(--accent); font-weight: 700; min-height: 1.6em; }
  .auto { position: fixed; right: 12px; bottom: 12px; z-index: 50; }
</style>
</head>
<body>
<div class="card panel">
  <div class="badge">🏆</div>
  <h1>尾牙抽獎</h1>
  <p>點「抽獎」或點畫面任何地方放彩紙</p>
  <div class="prize" id="prize">頭獎：日本雙人來回機票</div>
  <button class="btn primary" id="draw" style="margin-top:12px">抽獎</button>
</div>
<div class="controls" id="fx">
  <button class="btn" data-fx="burst" aria-pressed="true">彩紙</button>
  <button class="btn" data-fx="cannons">兩側禮炮</button>
  <button class="btn" data-fx="fireworks">煙火</button>
  <button class="btn" data-fx="stars">星星</button>
  <button class="btn" data-fx="emoji">表情符號</button>
</div>
<button class="btn auto" id="auto" aria-pressed="true">自動播放</button>
<div class="hint">點畫面在該處放彩紙・右上切換特效</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.js"></script>
<script>
// canvas-confetti: one function call per burst; presets below vary origin, angle, shapes and gravity.
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#9d8cff", "#ff8c42"];
const PRIZES = ["頭獎：日本雙人來回機票", "二獎：最新款手機", "三獎：百貨禮券一萬元", "特別獎：帶薪假三天", "普獎：珍奶一年份"];
const emojiShapes = ["🎉", "🧋", "🧧"].map((text) => confetti.shapeFromText({ text, scalar: 2.2 }));
let current = "burst";

const FX = {
  burst(x = 0.5, y = 0.55) {
    confetti({ particleCount: 140, spread: 80, startVelocity: 42, origin: { x, y }, colors: COLORS });
  },
  cannons() {
    const end = Date.now() + 1200;
    (function frame() {
      confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.75 }, colors: COLORS });
      confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.75 }, colors: COLORS });
      if (Date.now() < end) requestAnimationFrame(frame);
    })();
  },
  fireworks() {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => confetti({
        particleCount: 70, spread: 360, startVelocity: 28, ticks: 70, gravity: 0.6, scalar: 0.9,
        origin: { x: 0.15 + Math.random() * 0.7, y: 0.15 + Math.random() * 0.35 }, colors: COLORS,
      }), i * 280);
    }
  },
  stars(x = 0.5, y = 0.45) {
    const opts = { spread: 360, ticks: 60, gravity: 0, decay: 0.94, startVelocity: 26, shapes: ["star"], colors: ["#fff3b0", "#f7df1e", "#ffb703"], origin: { x, y } };
    confetti({ ...opts, particleCount: 40, scalar: 1.3 });
    confetti({ ...opts, particleCount: 14, scalar: 0.7, shapes: ["circle"] });
  },
  emoji(x = 0.5, y = 0.6) {
    confetti({ particleCount: 36, spread: 100, startVelocity: 38, scalar: 2.2, shapes: emojiShapes, origin: { x, y } });
  },
};

function fire(x, y) {
  // Point-based presets accept an origin; others ignore the click position.
  FX[current](x, y);
}

document.getElementById("fx").addEventListener("click", (e) => {
  e.stopPropagation();
  const b = e.target.closest("[data-fx]");
  if (!b) return;
  current = b.dataset.fx;
  document.querySelectorAll("#fx .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  fire();
});
document.getElementById("draw").addEventListener("click", (e) => {
  e.stopPropagation();
  document.getElementById("prize").textContent = PRIZES[Math.floor(Math.random() * PRIZES.length)];
  FX.cannons();
});
const autoBtn = document.getElementById("auto");
autoBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  autoBtn.setAttribute("aria-pressed", String(autoBtn.getAttribute("aria-pressed") !== "true"));
});
document.body.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".btn")) return;
  fire(e.clientX / innerWidth, e.clientY / innerHeight);
});

// Keep something on screen for idle previews: fire the selected preset on a timer.
fire();
setInterval(() => {
  if (autoBtn.getAttribute("aria-pressed") === "true") fire(0.2 + Math.random() * 0.6, 0.35 + Math.random() * 0.3);
}, 1500);
</script>
</body>
</html>
