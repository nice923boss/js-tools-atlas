<style>
  .cc-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px; }
  .cc-two { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); }
  .cc-even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .cc-three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cc-six { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 560px) {
    .cc-two, .cc-even { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .cc-three { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(0, 1fr)); }
    .cc-six { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); }
  }
  .cc-card { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: #07080b; overflow: hidden; }
  .cc-card > canvas, .cc-card > video, .cc-card > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .cc-tag { position: absolute; left: 8px; top: 8px; z-index: 2; max-width: calc(100% - 16px); padding: 3px 9px; border-radius: 999px; background: rgba(0, 0, 0, .66);
    font: 600 11.5px/1.4 var(--font); color: #e8e6df; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-tag.rec { background: rgba(200, 24, 48, .9); color: #fff; }
  .cc-tag code { font: 600 11px var(--mono); color: var(--accent); }
  .cc-info { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 2; padding: 5px 9px; border-radius: 8px; background: rgba(0, 0, 0, .7);
    font: 11.5px/1.55 var(--font); color: #cfd2d8; }
  .cc-info b, .cc-num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: #fff; font-weight: 600; }
  .cc-info a { color: var(--accent); }

  .cc-log { position: relative; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: 10px 12px; font-size: 12.5px; line-height: 1.7; }
  .cc-log h3 { margin: 0 0 6px; font-size: 13px; }
  .cc-log li { margin: 0 0 4px; }
  .cc-log ol { margin: 0; padding-left: 18px; }
  .cc-log .muted { font-size: 11.5px; }

  .cc-bench .cc-card { height: 100%; }
  @media (max-width: 760px) { .cc-bench { inset: 8px; opacity: .9; } }

<body>
<script src="https://cdn.jsdelivr.net/npm/ccapture.js@2.0.0/build/ccapture.umd.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// CCapture.js 2.0 showcase. While capturing, TimeWarp swaps performance.now, rAF, timers and Date
// for a virtual clock, so we keep handles on the real clock for wall-time measurements.
const realNow = performance.now.bind(performance);
const realTimeout = window.setTimeout.bind(window);
const { h, fmtMs } = Showcase;
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
const MONO = rootCss.getPropertyValue("--mono").trim() || "ui-monospace, monospace";
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42"];
const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(2)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const abortError = () => new DOMException("場景已切換", "AbortError");

function canvas(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c;
}
// Busy-wait on the real clock: simulates an expensive frame even while time is virtual.
function burn(ms) { const end = realNow() + ms; while (realNow() < end); }

// Signature scene (from the original demo): spinning five-blade wheel and three zipping balls.
// Drawn in a 640x360 logical space and scaled to the canvas.
function paint(cv, t, { balls = true, caption = "CCapture.js", extra = "" } = {}) {
  const g = cv.getContext("2d");
  const s = cv.width / 640;
  g.setTransform(s, 0, 0, s, 0, 0);
  const bg = g.createLinearGradient(0, 0, 640, 360);
  bg.addColorStop(0, "#10131c");
  bg.addColorStop(1, "#1c1030");
  g.fillStyle = bg;
  g.fillRect(0, 0, 640, 360);
  const cx = balls ? 190 : 320, cy = 180, R = balls ? 120 : 140;
  g.save();
  g.translate(cx, cy);
  g.rotate(t * Math.PI * 2 * 2.6);
  COLORS.forEach((c) => {
    g.rotate((Math.PI * 2) / COLORS.length);
    g.fillStyle = c;
    g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, -0.16, 0.16); g.closePath(); g.fill();
  });
  g.fillStyle = "#ecebe6";
  g.beginPath(); g.arc(0, 0, 16, 0, Math.PI * 2); g.fill();
  g.restore();
  g.strokeStyle = "rgba(255,255,255,.15)";
  g.lineWidth = 2;
  g.beginPath(); g.arc(cx, cy, R + 8, 0, Math.PI * 2); g.stroke();
  if (balls) {
    [[1.9, "#f72585", 110], [3.1, "#4cc9f0", 185], [4.3, "#f7df1e", 260]].forEach(([f, c, y]) => {
      g.fillStyle = c;
      g.beginPath(); g.arc(470 + Math.sin(t * Math.PI * f) * 120, y, 18, 0, Math.PI * 2); g.fill();
    });
  }
  if (caption === null) { g.setTransform(1, 0, 0, 1, 0, 0); return; }
  g.fillStyle = "rgba(236,235,230,.92)";
  g.font = `700 20px ${FONT}`;
  g.fillText(caption, 24, 312);
  g.font = `14px ${MONO}`;
  g.fillStyle = "#9b998f";
  g.fillText(`t = ${t.toFixed(3)} s${extra}`, 24, 336);
  g.setTransform(1, 0, 0, 1, 0, 0);
}

// Record `frames` output frames with CCapture driving our own rAF loop.
// No frameLimit on purpose: a limit makes CCapture auto-save, which triggers a download.
async function ccRecord(ctx, cv, opts, frames, render, onFrame) {
  const c = new CCapture({ quality: 90, name: "ccapture-demo", ...opts });
  let err = null;
  const stopped = new Promise((res) => c.on("stop", res));
  c.on("error", (e) => (err = e));
  c.on("frame", (n) => { if (onFrame) onFrame(n); if (n >= frames) c.stop(); });
  let pending = Promise.resolve(), dead = false, wake;
  const aborted = new Promise((res) => (wake = res));
  // Leaving the scene: restore the real clock synchronously (dispose() only does it after the
  // encoder flushes, and the next scene's capturer must not hook on top of these hooks), then let
  // the in-flight capture() settle before disposing, or its motion-blur buffer is freed under it.
  ctx.onCleanup(() => {
    dead = true;
    c.timewarp.stop();
    wake();
    Promise.race([pending, new Promise((res) => realTimeout(res, 3000))])
      .then(() => c.dispose()).catch(() => {});
  });
  const w0 = realNow();
  await c.start();
  const t0 = performance.now(); // virtual clock from here on
  let calls = 0;
  const loop = () => {
    if (dead || !c.capturing) return;
    requestAnimationFrame(loop); // hooked: advances one sub-frame per capture()
    render((performance.now() - t0) / 1000, calls++);
    pending = c.capture(cv);
  };
  loop();
  await Promise.race([stopped, aborted]);
  if (!ctx.active) throw abortError();
  if (err) throw err;
  const blob = await c.save(() => {}); // a callback hands us the Blob instead of downloading
  await c.dispose();
  return { blob, wall: realNow() - w0, calls, frames: c.frameCount };
}

// Object URLs owned by a scene; revoked on replace and on cleanup.
function urls(ctx) {
  const live = new Set();
  ctx.onCleanup(() => live.forEach((u) => URL.revokeObjectURL(u)));
  return {
    make(blob, prev) {
      if (prev) { URL.revokeObjectURL(prev); live.delete(prev); }
      const u = URL.createObjectURL(blob);
      live.add(u);
      return u;
    },
  };
}
// Put a playable element for `blob` in `box` and resolve with metadata read back from the file.
function showMedia(box, url, type, { loop = true, controls = false, muted = true } = {}) {
  box.querySelector("video, img, .cc-empty")?.remove();
  if (type.startsWith("image/")) {
    const img = h("img", { alt: "CCapture.js 輸出" });
    box.prepend(img);
    return new Promise((res) => { img.onload = () => res({ w: img.naturalWidth, h: img.naturalHeight, el: img }); img.onerror = () => res({ el: img }); img.src = url; });
  }
  const v = h("video", { playsinline: "" });
  Object.assign(v, { muted, loop, controls, autoplay: !controls, preload: "auto" });
  box.prepend(v);
  return new Promise((res) => {
    v.onloadedmetadata = () => res({ w: v.videoWidth, h: v.videoHeight, duration: v.duration, el: v });
    v.onerror = () => res({ el: v, error: true });
    v.src = url;
  });
}
const dl = (url, name) => `<a href="${url}" download="${name}">下載</a>`;

Showcase.run({ scenes: [
  {
    id: "record", title: "固定步長錄影",
    api: "new CCapture({ format, framerate: 30, motionBlurFrames }) → start() → capture(canvas) → save(cb)",
    desc: "CCapture 錄影時接管時鐘，每呼叫一次 capture() 才前進 1/30 秒，所以畫面再卡，輸出影片仍是平順的 30 fps。打開「模擬卡頓」比較實際花費時間與影片長度。",
    hint: "選格式與模糊取樣後按「錄製」・開啟模擬卡頓再錄一次",
    mount(ctx) {
      ctx.html(`<div class="cc-wrap cc-two">
        <div class="cc-card cc-live"><span class="cc-tag">即時預覽</span></div>
        <div class="cc-card cc-out"><div class="cc-empty">錄製完成後在這裡播放</div><div class="cc-info">準備錄製…</div></div></div>`);
      const FORMATS = ["mp4", "webm", "gif"], BLURS = [1, 4, 16];
      let fmt = "mp4", blur = 4, heavy = false, busy = false, url = null;
      ctx.group(["MP4", "WebM", "GIF"], 0, (i) => (fmt = FORMATS[i]));
      ctx.group(["無模糊", "模糊 ×4", "×16"], 1, (i) => (blur = BLURS[i]));
      ctx.toggle("模擬卡頓", heavy, (v) => (heavy = v));
      const recBtn = ctx.button("● 錄製", () => record(), { primary: true });
      const cv = canvas(640, 360);
      const live = ctx.$(".cc-live"), out = ctx.$(".cc-out"), info = ctx.$(".cc-info"), tag = ctx.$(".cc-live .cc-tag");
      live.prepend(cv);
      const keep = urls(ctx);
      let start = realNow(), last = realNow(), fps = 60;
      ctx.raf(() => {
        if (busy) return; // during capture, ccRecord's loop owns the canvas
        if (heavy) burn(45);
        paint(cv, (realNow() - start) / 1000);
        const r = realNow();
        fps += (1000 / Math.max(1, r - last) - fps) * 0.1;
        last = r;
        tag.textContent = `即時預覽・畫面 ${Math.round(fps)} FPS`;
      });
      async function record() {
        if (busy) return;
        busy = true; recBtn.disabled = true;
        const total = 60;
        tag.classList.add("rec");
        info.textContent = `錄製中：${fmt.toUpperCase()}・每格 ${blur} 次取樣${heavy ? "・模擬卡頓" : ""}`;
        try {
          const r = await ccRecord(ctx, cv, { format: fmt, framerate: 30, motionBlurFrames: blur, gifColors: 128 }, total,
            (t, i) => { if (heavy && i % blur === 0) burn(45); paint(cv, t); },
            (n) => { tag.textContent = `REC ${(n / 30).toFixed(2)} / 2 秒・第 ${n}/${total} 格`; });
          url = keep.make(r.blob, url);
          const m = await showMedia(out, url, r.blob.type);
          info.innerHTML = `${fmt.toUpperCase()}・<b>${m.w}×${m.h}</b>・<b>${kb(r.blob.size)}</b>・${dl(url, `ccapture-demo.${fmt}`)}<br>
            ${total} 格（每格 ${blur} 次取樣，共 ${r.calls} 次繪圖）實際花費 <b>${(r.wall / 1000).toFixed(2)} 秒</b>，影片長度 <b>${m.duration ? m.duration.toFixed(2) + " 秒" : "2.00 秒（GIF）"}</b>`;
        } catch (e) {
          if (e.name === "AbortError") return;
          info.textContent = `錄製失敗：${e.message}`;
        } finally {
          if (ctx.active) { busy = false; recBtn.disabled = false; tag.classList.remove("rec"); start = realNow(); }
        }
      }
      ctx.timeout(record, 400);
    },
  },
  {
    id: "blur", title: "動態模糊取樣",
    api: "new CCapture({ motionBlurFrames: 1 | 4 | 16, motionBlur: \"cpu\" })",
    desc: "motionBlurFrames 是每個輸出格要平均的子影格數：每格畫 N 次、時間各前進 1/N 格再疊加，像真實快門一樣拖出殘影。三段影片停在同一時間點比較，取樣越多越平滑但越慢。",
    hint: "三段錄好後停在 0.5 秒・按「播放」看動態效果",
    mount(ctx) {
      const SAMPLES = [1, 4, 16];
      ctx.html(`<div class="cc-wrap cc-three">${SAMPLES.map((n) => `<div class="cc-card"><span class="cc-tag"><code>motionBlurFrames: ${n}</code></span><div class="cc-empty">等待錄製</div><div class="cc-info">排隊中…</div></div>`).join("")}</div>`);
      const cards = ctx.$$(".cc-card"), keep = urls(ctx), vids = [];
      let playing = false;
      ctx.toggle("播放", playing, (v) => { playing = v; vids.forEach((x) => (v ? x.play() : (x.pause(), (x.currentTime = 0.5)))); });
      const cv = canvas(480, 270);
      (async () => {
        for (let k = 0; k < SAMPLES.length; k++) {
          const n = SAMPLES[k], card = cards[k], info = card.querySelector(".cc-info");
          info.textContent = "錄製中…";
          const r = await ccRecord(ctx, cv, { format: "webm", framerate: 30, motionBlurFrames: n, motionBlur: "cpu" }, 30,
            (t) => paint(cv, t, { balls: false, caption: `取樣 ${n}` }),
            (f) => (info.textContent = `錄製中 ${f}/30 格`));
          const m = await showMedia(card, keep.make(r.blob), r.blob.type, { loop: true });
          m.el.autoplay = false; m.el.pause(); m.el.currentTime = 0.5;
          if (playing) m.el.play();
          vids.push(m.el);
          info.innerHTML = `30 格 × ${n} = <b>${r.calls}</b> 次繪圖・耗時 <b>${fmtMs(r.wall)}</b>・${kb(r.blob.size)}`;
        }
      })().catch((e) => { if (e.name !== "AbortError") cards[0].querySelector(".cc-info").textContent = `失敗：${e.message}`; });
    },
  },
  {
    id: "formats", title: "輸出格式",
    api: "CCapture.formats → [\"mp4\", \"webm\", \"gif\", \"png\", \"jpg\", \"webp\", …]",
    desc: "同一段 1 秒、15 fps 動畫用六種格式各錄一次。MP4／WebM 走 WebCodecs，GIF 用 gifenc 量化成 256 色，PNG／JPG／WebP 打包成 .tar 影像序列（這裡拆開 tar 顯示第一張）。",
    hint: "比較檔案大小與耗時・每格都可下載",
    mount(ctx) {
      const LIST = ["mp4", "webm", "gif", "png", "jpg", "webp"];
      ctx.html(`<div class="cc-wrap cc-six">${LIST.map((f) => `<div class="cc-card"><span class="cc-tag"><code>format: "${f}"</code></span><div class="cc-empty">排隊中</div><div class="cc-info">…</div></div>`).join("")}</div>`);
      const cards = ctx.$$(".cc-card"), keep = urls(ctx), cv = canvas(320, 180);
      ctx.button("重錄", () => run(), { primary: true });
      let gen = 0;
      // Minimal ustar reader: 512-byte headers, octal size field, data padded to 512.
      function untar(buf) {
        const u8 = new Uint8Array(buf), td = new TextDecoder(), files = [];
        for (let o = 0; o + 512 <= u8.length;) {
          const name = td.decode(u8.subarray(o, o + 100)).replace(/\0[\s\S]*$/, "");
          if (!name) break;
          const size = parseInt(td.decode(u8.subarray(o + 124, o + 136)).replace(/\0[\s\S]*$/, "").trim(), 8) || 0;
          files.push({ name, data: u8.slice(o + 512, o + 512 + size) });
          o += 512 + Math.ceil(size / 512) * 512;
        }
        return files;
      }
      async function run() {
        const my = ++gen;
        for (let k = 0; k < LIST.length; k++) {
          if (my !== gen) return;
          const f = LIST[k], card = cards[k], info = card.querySelector(".cc-info");
          info.textContent = "錄製中…";
          try {
            const r = await ccRecord(ctx, cv, { format: f, framerate: 15 }, 15, (t) => paint(cv, t, { caption: null }));
            const url = keep.make(r.blob);
            const seq = ["png", "jpg", "webp"].includes(f);
            if (seq) {
              const files = untar(await r.blob.arrayBuffer());
              const mime = { png: "image/png", jpg: "image/jpeg", webp: "image/webp" }[f];
              await showMedia(card, keep.make(new Blob([files[0].data], { type: mime })), mime);
              info.innerHTML = `TAR 內 <b>${files.length}</b> 張・首張 <span class="cc-num">${files[0].name}</span><br><b>${kb(r.blob.size)}</b>・<b>${fmtMs(r.wall)}</b>・${dl(url, `ccapture-${f}.tar`)}`;
            } else {
              const m = await showMedia(card, url, r.blob.type);
              info.innerHTML = `<span class="cc-num">${r.blob.type}</span>・${m.duration ? `<b>${m.duration.toFixed(2)} 秒</b>` : `<b>${m.w}×${m.h}</b>`}<br><b>${kb(r.blob.size)}</b>・<b>${fmtMs(r.wall)}</b>・${dl(url, `ccapture.${f}`)}`;
            }
          } catch (e) {
            if (e.name === "AbortError") return;
            info.textContent = `此瀏覽器無法輸出：${e.message}`;
          }
        }
      }
      run();
    },
  },
  {
    id: "realtime", title: "即時錄影對照",
    api: "canvas.captureStream(30) + MediaRecorder  vs  CCapture({ framerate: 30 })",
    desc: "同一段重度運算的動畫錄 2 秒：MediaRecorder 跟著真實時間錄，畫不出來的格就掉了；CCapture 讓時間等繪圖，60 格一格不少，代價是錄製時間變長。畫面上的格數標記可以看出差別。",
    hint: "調整每格運算量後按「開始對照」",
    mount(ctx) {
      ctx.html(`<div class="cc-wrap cc-even">
        <div class="cc-card"><span class="cc-tag">MediaRecorder（即時）</span><div class="cc-empty">等待錄製</div><div class="cc-info">…</div></div>
        <div class="cc-card"><span class="cc-tag">CCapture（固定步長）</span><div class="cc-empty">等待錄製</div><div class="cc-info">…</div></div></div>`);
      let cost = 60, busy = false, gen = 0;
      ctx.slider("每格運算", { min: 0, max: 150, step: 10, value: cost, format: (v) => `${v} ms` }, (v) => (cost = v));
      const btn = ctx.button("開始對照", () => run(), { primary: true });
      const [mrCard, ccCard] = ctx.$$(".cc-card"), keep = urls(ctx), cv = canvas(640, 360);
      const draw = (t, n) => { burn(cost); paint(cv, t, { caption: `第 ${n + 1} 格`, extra: `・每格運算 ${cost} ms` }); };
      async function viaMediaRecorder() {
        const stream = cv.captureStream(30);
        const type = ["video/webm;codecs=vp9", "video/webm"].find((x) => MediaRecorder.isTypeSupported(x));
        const rec = new MediaRecorder(stream, { mimeType: type });
        const chunks = [];
        rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
        const done = new Promise((res) => (rec.onstop = res));
        ctx.onCleanup(() => { if (rec.state !== "inactive") rec.stop(); stream.getTracks().forEach((x) => x.stop()); });
        let n = 0;
        const t0 = realNow();
        rec.start();
        const stop = ctx.raf(() => { draw((realNow() - t0) / 1000, n++); });
        await new Promise((res) => realTimeout(res, 2000));
        stop(); rec.stop();
        await done;
        stream.getTracks().forEach((x) => x.stop());
        if (!ctx.active) throw abortError();
        return { blob: new Blob(chunks, { type: rec.mimeType }), n };
      }
      async function run() {
        if (busy) return;
        busy = true; btn.disabled = true;
        const my = ++gen;
        const [mrInfo, ccInfo] = [mrCard, ccCard].map((c) => c.querySelector(".cc-info"));
        try {
          mrInfo.textContent = "即時錄製 2 秒中…";
          ccInfo.textContent = "等待中…";
          const a = await viaMediaRecorder();
          await showMedia(mrCard, keep.make(a.blob), "video/webm");
          mrInfo.innerHTML = `2 秒真實時間內只畫出 <b>${a.n}</b> 格（目標 60 格）・${kb(a.blob.size)}<br>影片播放時會跳格`;
          ccInfo.textContent = "固定步長錄製中…";
          const b = await ccRecord(ctx, cv, { format: "webm", framerate: 30 }, 60, (t, i) => draw(t, i),
            (f) => (ccInfo.textContent = `固定步長錄製中 ${f}/60 格`));
          const m = await showMedia(ccCard, keep.make(b.blob), b.blob.type);
          ccInfo.innerHTML = `<b>${b.frames}</b> 格全數錄下・影片 <b>${m.duration.toFixed(2)} 秒</b><br>但錄製花了 <b>${(b.wall / 1000).toFixed(1)} 秒</b>（時間被 CCapture 接管）`;
        } catch (e) {
          if (e.name !== "AbortError") ccInfo.textContent = `失敗：${e.message}`;
        } finally {
          if (ctx.active && my === gen) { busy = false; btn.disabled = false; }
        }
      }
      ctx.timeout(run, 300);
    },
  },
  {
    id: "timewarp", title: "虛擬時鐘",
    api: "new CCapture.TimeWarp({ framerate: 60 }).start() / step() / stop()",
    desc: "TimeWarp 是 CCapture 裡負責時間的那一半：start() 之後 performance.now、requestAnimationFrame、setTimeout、Date.now 全部改走虛擬時鐘，只有 step() 才前進。左邊四個指針只有最下面那個讀真實時鐘。",
    hint: "按「凍結時鐘」後用「+1 格」「+1 秒」手動推進時間",
    mount(ctx) {
      ctx.html(`<div class="cc-wrap cc-two"><div class="cc-card"></div><div class="cc-log"><h3>快轉實驗</h3><ol></ol></div></div>`);
      const box = ctx.$(".cc-card"), log = ctx.$(".cc-log ol");
      const tw = new CCapture.TimeWarp({ framerate: 60 });
      ctx.onCleanup(() => tw.stop());
      let frozen = false, ticks = 0;
      const say = (html) => { const li = h("li"); li.innerHTML = html; log.append(li); log.parentElement.scrollTop = 1e6; };
      ctx.toggle("凍結時鐘", frozen, (v) => {
        frozen = v;
        if (v) { tw.start(); say("<b>start()</b>：時鐘凍結，畫面停住"); } else { tw.stop(); say("<b>stop()</b>：交還真實時鐘"); }
        stepBtns.forEach((b) => (b.disabled = !v));
      });
      const stepBtns = [
        ctx.button("+1 格", () => { tw.step(); }),
        ctx.button("+1 秒", () => { for (let i = 0; i < 60; i++) tw.step(); }),
      ];
      stepBtns.forEach((b) => (b.disabled = true));
      // Self-rescheduling timer: each setTimeout call goes through whichever clock is current.
      (function tick() { if (!ctx.active) return; ticks++; setTimeout(tick, 100); })();
      const cv = canvas(640, 400);
      box.append(cv);
      const g = cv.getContext("2d");
      const t0 = performance.now(), d0 = Date.now(), r0 = realNow();
      const dials = [
        ["performance.now()", () => performance.now() - t0, COLORS[0]],
        ["Date.now()", () => Date.now() - d0, COLORS[1]],
        ["setInterval 100ms", () => ticks * 100, COLORS[3]],
        ["真實時鐘（未掛勾）", () => realNow() - r0, "#9b998f"],
      ];
      ctx.raf(() => {
        g.fillStyle = "#0d0f14"; g.fillRect(0, 0, 640, 400);
        dials.forEach(([label, read, color], i) => {
          const ms = read(), y = 50 + i * 95, cx = 60;
          g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 2;
          g.beginPath(); g.arc(cx, y, 36, 0, Math.PI * 2); g.stroke();
          const a = (ms / 1000) * Math.PI * 2 / 4 - Math.PI / 2; // one turn per 4 s
          g.strokeStyle = color; g.lineWidth = 4; g.lineCap = "round";
          g.beginPath(); g.moveTo(cx, y); g.lineTo(cx + Math.cos(a) * 30, y + Math.sin(a) * 30); g.stroke();
          g.fillStyle = "#e8e6df"; g.font = `600 17px ${MONO}`; g.fillText(label, 120, y - 6);
          g.fillStyle = color; g.font = `600 22px ${MONO}`; g.fillText(`${(ms / 1000).toFixed(3)} s`, 120, y + 22);
          g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(330, y - 4, 290, 8);
          g.fillStyle = color; g.fillRect(330, y - 4, 290 * ((ms / 4000) % 1), 8);
        });
        g.fillStyle = frozen ? "#f72585" : "#7bd389"; g.font = `700 15px ${FONT}`;
        g.fillText(frozen ? `● 虛擬時鐘 ${tw.time.toFixed(1)} ms` : "● 真實時鐘", 330, 392);
      });
      // Fast-forward experiment: a 1 s timeout fires after enough step() calls, in well under 1 ms of real time.
      ctx.timeout(() => {
        const w = new CCapture.TimeWarp({ framerate: 60 });
        w.start();
        const v0 = performance.now(), r = realNow();
        let firedAt = null, steps = 0;
        setTimeout(() => (firedAt = performance.now() - v0), 1000);
        while (firedAt === null && steps < 240) { w.step(); steps++; }
        const real = realNow() - r;
        w.stop();
        say(`排一個 <code>setTimeout(fn, 1000)</code>，接著連呼叫 <b>${steps}</b> 次 <code>step()</code>`);
        say(`回呼在虛擬時間 <b class="cc-num">${firedAt.toFixed(1)} ms</b> 觸發，真實只過了 <b class="cc-num">${real.toFixed(2)} ms</b>`);
        say(`每次 step() 前進 <span class="cc-num">${w.frameStep.toFixed(3)} ms</span>（1/60 秒）`);
        say('<span class="muted">CCapture 錄影時就是這樣：畫完一格才 step() 一次，所以動畫不管多慢都對得上影格。</span>');
      }, 500);
    },
  },
  {
    id: "audio", title: "音訊同步",
    api: "CCapture.renderAudioFrames({ buffer, framerate, frames, fftSize }) + new CCapture({ audio: buffer })",
    desc: "用 OfflineAudioContext 合成 3 秒節拍，renderAudioFrames 離線算出每一格對應的頻譜，畫面跟音樂逐格對齊；再用 audio 選項把同一段 AudioBuffer 混進 MP4。結果列出從檔案讀回的音訊軌。",
    hint: "錄好後按影片上的播放鍵聽聲音",
    mount(ctx) {
      ctx.html(`<div class="cc-wrap cc-even"><div class="cc-card cc-viz"><span class="cc-tag">renderAudioFrames 頻譜（逐格）</span></div>
        <div class="cc-card cc-out"><span class="cc-tag">MP4（含音訊軌）</span><div class="cc-empty">合成音訊中…</div><div class="cc-info top">…</div></div></div>`);
      const FPS = 30, SEC = 3, FRAMES = FPS * SEC, SR = 48000;
      const cv = canvas(640, 360), g = cv.getContext("2d"), out = ctx.$(".cc-out"), info = ctx.$(".cc-out .cc-info"), keep = urls(ctx);
      ctx.$(".cc-viz").prepend(cv);
      async function synth() {
        const oc = new OfflineAudioContext(2, SR * SEC, SR);
        for (let b = 0; b < SEC * 4; b++) {
          const t = b * 0.25;
          if (b % 2 === 0) { // kick
            const o = oc.createOscillator(), gn = oc.createGain();
            o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.2);
            gn.gain.setValueAtTime(0.9, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            o.connect(gn).connect(oc.destination); o.start(t); o.stop(t + 0.3);
          }
          const note = [220, 262, 330, 392][b % 4] * (b >= 8 ? 1.5 : 1); // arpeggio
          const o = oc.createOscillator(), gn = oc.createGain(), f = oc.createBiquadFilter();
          o.type = "sawtooth"; o.frequency.value = note; f.frequency.value = 1800;
          gn.gain.setValueAtTime(0.18, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          o.connect(f).connect(gn).connect(oc.destination); o.start(t); o.stop(t + 0.24);
        }
        return oc.startRendering();
      }
      function drawFrame(i, data) {
        const { frequency, waveform } = data[Math.min(i, data.length - 1)];
        g.fillStyle = "#0d0f14"; g.fillRect(0, 0, 640, 360);
        const bars = 48, step = Math.floor(frequency.length / 2 / bars);
        for (let k = 0; k < bars; k++) {
          const v = frequency[k * step] / 255, bh = v * 230;
          g.fillStyle = COLORS[k % 5]; g.globalAlpha = 0.35 + v * 0.65;
          g.fillRect(20 + k * 12.5, 270 - bh, 9, bh);
        }
        g.globalAlpha = 1; g.strokeStyle = "#e8e6df"; g.lineWidth = 2; g.beginPath();
        for (let k = 0; k < waveform.length; k += 4) { const x = 20 + (k / waveform.length) * 600, y = 315 + (waveform[k] - 128) * 0.3; k ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.stroke();
        g.fillStyle = "#9b998f"; g.font = `14px ${MONO}`;
        g.fillText(`frame ${String(i + 1).padStart(2, "0")}/${FRAMES}   t = ${(i / FPS).toFixed(3)} s`, 20, 30);
      }
      // List the handler types of every 'hdlr' box in the MP4 (vide = video track, soun = audio track).
      function mp4Tracks(u8) {
        const found = [];
        for (let i = 4; i < u8.length - 12; i++) {
          if (u8[i] === 0x68 && u8[i + 1] === 0x64 && u8[i + 2] === 0x6c && u8[i + 3] === 0x72) {
            found.push(String.fromCharCode(...u8.subarray(i + 12, i + 16)));
          }
        }
        return found;
      }
      (async () => {
        const buffer = await synth();
        if (!ctx.active) return;
        out.querySelector(".cc-empty").textContent = "離線分析頻譜中…";
        const data = await CCapture.renderAudioFrames({ buffer, framerate: FPS, frames: FRAMES, fftSize: 1024 });
        if (!ctx.active) return;
        out.querySelector(".cc-empty").textContent = "錄製 MP4 中…";
        const r = await ccRecord(ctx, cv, { format: "mp4", framerate: FPS, audio: buffer }, FRAMES,
          (t) => drawFrame(Math.round(t * FPS), data), (f) => (info.textContent = `錄製中 ${f}/${FRAMES} 格`));
        const url = keep.make(r.blob);
        const m = await showMedia(out, url, r.blob.type, { controls: true, muted: false, loop: true });
        const tracks = mp4Tracks(new Uint8Array(await r.blob.arrayBuffer())).filter((x) => x === "vide" || x === "soun");
        const hasAudio = tracks.includes("soun");
        info.innerHTML = `讀回檔案：軌道 <b>${tracks.join(" + ") || "?"}</b>（${hasAudio ? "含音訊軌" : "此瀏覽器的 AudioEncoder 不支援，只有影像軌"}）<br>
          長度 <b>${m.duration.toFixed(2)} 秒</b>・<b>${kb(r.blob.size)}</b>・耗時 <b>${fmtMs(r.wall)}</b>・${dl(url, "ccapture-audio.mp4")}`;
        m.el.currentTime = 1.5; // land on a beat instead of the silent first frame
        // Left panel: follow the video while it plays, otherwise loop the precomputed frames.
        const r0 = realNow();
        ctx.raf(() => {
          const t = m.el.paused ? ((realNow() - r0) / 1000) % SEC : m.el.currentTime;
          drawFrame(Math.floor(t * FPS) % FRAMES, data);
        });
      })().catch((e) => { if (e.name !== "AbortError") info.textContent = `失敗：${e.message}`; });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new CCapture.FrameWrap({ format, framerate: 30 }).capture(canvas)",
    desc: "FrameWrap 是 CCapture 負責擷取與編碼的那一半，不碰時鐘。逐級放大畫布，每級錄 20 格並只計算 capture() 的時間，看每格擷取成本怎麼隨像素數成長。",
    hint: "選格式後按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="cc-bench"><div class="cc-card"><div class="cc-empty">按「開始測試」後在這裡顯示正在擷取的畫布</div></div></div>`);
      ctx.controls.classList.add("bottom");
      const FORMATS = ["mp4", "webm", "jpg", "gif"];
      let fmt = "mp4", blur = 1;
      ctx.group(["MP4", "WebM", "JPG 序列", "GIF"], 0, (i) => (fmt = FORMATS[i]));
      ctx.toggle("模糊 ×4", false, (v) => (blur = v ? 4 : 1));
      const card = ctx.$(".cc-bench .cc-card");
      const tag = h("span", { class: "cc-tag" });
      let fw = null;
      ctx.onCleanup(() => fw && fw.dispose().catch(() => {}));
      const H = (w) => Math.round((w * 9) / 16 / 2) * 2;
      ctx.bench({
        label: "畫布尺寸", unit: "", sizes: [320, 640, 1280, 1920, 2560, 3840], target: 2000, budget: 8000,
        format: (n) => `${n}×${H(n)}`,
        prepare(n) {
          const cv = canvas(n, H(n));
          card.replaceChildren(cv, tag);
          tag.textContent = `${n}×${H(n)}・${fmt.toUpperCase()}${blur > 1 ? "・模糊 ×4" : ""}`;
          return cv;
        },
        async run(n, cv) {
          if (fw) await fw.dispose().catch(() => {});
          fw = new CCapture.FrameWrap({ format: fmt, framerate: 30, quality: 80, motionBlurFrames: blur, motionBlur: "cpu" });
          await fw.start();
          let cap = 0;
          for (let i = 0; i < 20 * blur; i++) {
            paint(cv, i / (30 * blur));
            const t = realNow();
            await fw.capture(cv);
            cap += realNow() - t;
            if (!ctx.active) throw abortError();
          }
          await fw.stop();
          const blob = await fw.save(() => {});
          return `${(cap / 20).toFixed(1)} ms/格・${kb(blob.size)}`;
        },
        note: "每級錄 20 個輸出格，結果列顯示 capture() 的平均每格耗時（不含繪圖）。MP4／WebM 交給 WebCodecs 編碼，有背壓排隊；JPG 序列每格呼叫 canvas.toBlob；GIF 要讀回像素再量化成 256 色，最吃 CPU。開「模糊 ×4」時每格要多讀回並累加 4 張子影格，成本隨像素數直線上升。",
      });
    },
  },
] });
</script>
</body>
