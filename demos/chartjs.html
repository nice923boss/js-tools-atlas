<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart.js 示範：八個場景看懂圖表能力與上限</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="_shared/showcase.css">
<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["城市儀表板","八種圖表","即時串流","互動模式","動畫系統","自訂插件","堆疊與對數軸","極限測試"]}</script>
<style>
  .card { position: relative; min-height: 0; min-width: 0; padding: 8px 10px 6px; display: flex; flex-direction: column; }
  .card h2 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .box { position: relative; flex: 1; min-height: 0; }

  /* 1. dashboard */
  .board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px;
    grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "main radar" "main donut"; }
  .board .main { grid-area: main; } .board .radar { grid-area: radar; } .board .donut { grid-area: donut; }
  @media (max-width: 700px) {
    .board { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "main radar"; }
    .board .donut { display: none; }
  }
  @media (max-width: 520px) {
    .board { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-areas: "main" "radar"; }
  }

  /* 2. small multiples */
  .multi { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 8px;
    grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .multi .card h2 code { font: 500 10.5px/1 var(--mono); color: var(--muted); margin-left: 4px; }
  @media (max-width: 520px) { .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); } }

  /* 3. streaming / 7. axes: two panes */
  .split { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 220px); }
  .split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 560px) {
    .split, .split.even { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); }
    .split.even { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  }

  /* single chart scenes */
  .solo { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: flex; }
  .solo > .card { flex: 1; }
  .picked { position: absolute; left: 20px; bottom: 18px; z-index: 5; max-width: calc(100% - 40px); pointer-events: none;
    padding: 6px 10px; border-radius: 8px; font: 500 11.5px/1.5 var(--mono); color: var(--muted); }
  .picked b { color: var(--accent); }

  /* 8. stress */
  .stress-chart { position: absolute; inset: 8px 8px 8px 350px; }
  @media (max-width: 760px) { .stress-chart { inset: 8px; opacity: .9; } }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Chart.js showcase: eight scenes from the everyday dashboard to a point-count stress ramp.
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const GRID = "rgba(255,255,255,0.08)";
Chart.defaults.color = "#9b998f";
Chart.defaults.borderColor = GRID;
Chart.defaults.font.family = css.getPropertyValue("--font");
Chart.defaults.font.size = 11;
Chart.defaults.maintainAspectRatio = false;
Chart.defaults.plugins.legend.labels.boxWidth = 10;
Chart.defaults.plugins.legend.labels.boxHeight = 10;

const MONTHS = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
const rand = (lo, hi) => Math.round(lo + Math.random() * (hi - lo));
const nf = new Intl.NumberFormat("zh-TW");

// Create a chart that is destroyed when the scene unmounts.
function chart(ctx, canvas, cfg) {
  const c = new Chart(canvas, cfg);
  ctx.onCleanup(() => c.destroy());
  return c;
}
// Card markup: <div class="panel card"><h2>title<small>sub</small></h2><div class="box"><canvas></canvas></div></div>
const card = (cls, title, sub = "") =>
  `<div class="panel card ${cls}"><h2>${title}${sub ? `<small>${sub}</small>` : ""}</h2><div class="box"><canvas></canvas></div></div>`;

const CITY = {
  台北: { temp: [16.1, 16.5, 18.5, 21.9, 25.2, 27.7, 29.6, 29.2, 27.4, 24.5, 21.5, 17.9], rain: [83, 170, 180, 178, 231, 325, 245, 322, 360, 148, 83, 73] },
  台中: { temp: [16.6, 17.3, 19.8, 23.3, 26.3, 27.9, 28.8, 28.5, 27.8, 25.6, 22.3, 18.3], rain: [30, 88, 94, 136, 225, 384, 294, 300, 142, 17, 19, 24] },
  高雄: { temp: [19.3, 20.3, 22.6, 25.4, 27.6, 28.8, 29.4, 28.9, 28.5, 27.0, 24.4, 20.9], rain: [20, 22, 38, 75, 185, 416, 386, 434, 187, 46, 15, 14] },
};

Showcase.run({ scenes: [
  {
    id: "dashboard", title: "城市儀表板",
    api: "new Chart(canvas, { data, options })",
    desc: "同一張圖混用折線與長條（雙 Y 軸），搭配雷達圖與甜甜圈圖組成儀表板；資料為示意。",
    hint: "點城市切換・點圖例隱藏數列・滑過看數值",
    mount(ctx) {
      ctx.html(`<div class="board">${card("main", "台北 每月均溫與雨量", "折線＋長條雙軸")}${card("radar", "六都生活指標", "雷達圖")}${card("donut", "通勤方式占比", "甜甜圈圖")}</div>`);
      const [c1, c2, c3] = ctx.$$("canvas");
      const g = c1.getContext("2d").createLinearGradient(0, 0, 0, 400);
      g.addColorStop(0, rgba(C[1], 0.85));
      g.addColorStop(1, rgba(C[1], 0.12));
      const combo = chart(ctx, c1, {
        data: { labels: MONTHS, datasets: [
          { type: "line", label: "均溫（°C）", data: CITY.台北.temp, yAxisID: "t", borderColor: C[0], backgroundColor: C[0], tension: 0.4, borderWidth: 3, pointRadius: 3, pointHoverRadius: 6, order: 0 },
          { type: "bar", label: "雨量（mm）", data: CITY.台北.rain, yAxisID: "r", backgroundColor: g, borderRadius: 6, order: 1 },
        ] },
        options: {
          interaction: { mode: "index", intersect: false },
          animation: { duration: 900, easing: "easeOutQuart" },
          scales: {
            t: { position: "left", min: 10, max: 32, title: { display: true, text: "°C" } },
            r: { position: "right", min: 0, max: 500, title: { display: true, text: "mm" }, grid: { drawOnChartArea: false } },
            x: { grid: { display: false } },
          },
          plugins: { legend: { position: "top", align: "end" } },
        },
      });
      const radar = chart(ctx, c2, {
        type: "radar",
        data: { labels: ["交通", "綠地", "房價友善", "美食", "就業", "文化"], datasets: [
          { label: "台北", data: [92, 60, 35, 88, 90, 94], borderColor: C[1], backgroundColor: rgba(C[1], 0.18) },
          { label: "台中", data: [70, 74, 62, 84, 76, 72], borderColor: C[3], backgroundColor: rgba(C[3], 0.15) },
          { label: "高雄", data: [74, 80, 70, 86, 70, 76], borderColor: C[2], backgroundColor: rgba(C[2], 0.15) },
        ] },
        options: {
          elements: { line: { borderWidth: 2 }, point: { radius: 2, hoverRadius: 5 } },
          scales: { r: { min: 0, max: 100, ticks: { display: false, stepSize: 25 }, angleLines: { color: "rgba(255,255,255,0.1)" },
            grid: { color: "rgba(255,255,255,0.1)" }, pointLabels: { color: "#ecebe6", font: { size: 11 } } } },
          plugins: { legend: { position: "bottom" } },
        },
      });
      const donut = chart(ctx, c3, {
        type: "doughnut",
        data: { labels: ["捷運", "公車", "機車", "汽車", "自行車", "步行"],
          datasets: [{ data: [31, 18, 26, 14, 5, 6], backgroundColor: C, borderColor: "#171a1f", borderWidth: 3, hoverOffset: 10 }] },
        options: { cutout: "62%", plugins: { legend: { position: "right" } } },
      });
      const title = ctx.$(".main h2");
      ctx.group(["台北", "台中", "高雄"], 0, (i, name) => {
        combo.data.datasets[0].data = CITY[name].temp;
        combo.data.datasets[1].data = CITY[name].rain;
        combo.update();
        title.firstChild.textContent = `${name} 每月均溫與雨量`;
      });
      ctx.button("隨機更新", () => {
        radar.data.datasets.forEach((ds) => (ds.data = ds.data.map(() => rand(35, 98))));
        radar.update();
        donut.data.datasets[0].data = donut.data.labels.map(() => rand(4, 35));
        donut.update();
        combo.data.datasets[1].data = combo.data.datasets[1].data.map((v) => Math.max(5, Math.round(v * (0.6 + Math.random() * 0.8))));
        combo.update();
      }, { primary: true });
    },
  },
  {
    id: "types", title: "八種圖表",
    api: "type: line | bar | pie | doughnut | polarArea | radar | scatter | bubble",
    desc: "Chart.js 內建八種圖表類型，同一份設定結構只改 type 就能切換；長條圖加 indexAxis: 'y' 變橫向。",
    hint: "按「重播動畫」看每種圖的進場方式",
    mount(ctx) {
      const types = [
        ["line", "折線（面積）"], ["bar", "橫向長條"], ["pie", "圓餅"], ["doughnut", "甜甜圈"],
        ["polarArea", "極座標"], ["radar", "雷達"], ["scatter", "散佈"], ["bubble", "泡泡"],
      ];
      ctx.html(`<div class="multi">${types.map(([t, n]) => `<div class="panel card"><h2>${n}<code>${t}</code></h2><div class="box"><canvas></canvas></div></div>`).join("")}</div>`);
      const cv = ctx.$$("canvas");
      const six = ["一", "二", "三", "四", "五", "六"];
      const v6 = () => six.map(() => rand(10, 90));
      const pts = (n, r) => Array.from({ length: n }, () => ({ x: rand(0, 100), y: rand(0, 100), r: r ? rand(3, 14) : undefined }));
      const noAxes = { x: { display: false }, y: { display: false } };
      const base = { plugins: { legend: { display: false } }, layout: { padding: 2 } };
      const pal = C.map((c) => rgba(c, 0.85));
      const cfgs = [
        { type: "line", data: { labels: six, datasets: [{ data: v6(), fill: true, tension: 0.4, borderColor: C[1], backgroundColor: rgba(C[1], 0.25), pointRadius: 0 }] }, options: { ...base, scales: noAxes } },
        { type: "bar", data: { labels: six, datasets: [{ data: v6(), backgroundColor: pal, borderRadius: 4 }] }, options: { ...base, indexAxis: "y", scales: { x: { display: false }, y: { ticks: { font: { size: 9 } }, grid: { display: false } } } } },
        { type: "pie", data: { labels: six, datasets: [{ data: v6(), backgroundColor: pal, borderColor: "#171a1f", borderWidth: 2 }] }, options: base },
        { type: "doughnut", data: { labels: six, datasets: [{ data: v6(), backgroundColor: pal, borderColor: "#171a1f", borderWidth: 2 }] }, options: { ...base, cutout: "58%" } },
        { type: "polarArea", data: { labels: six, datasets: [{ data: v6(), backgroundColor: C.map((c) => rgba(c, 0.6)), borderWidth: 0 }] }, options: { ...base, scales: { r: { ticks: { display: false }, grid: { color: GRID } } } } },
        { type: "radar", data: { labels: six, datasets: [{ data: v6(), borderColor: C[2], backgroundColor: rgba(C[2], 0.2), pointRadius: 0 }, { data: v6(), borderColor: C[3], backgroundColor: rgba(C[3], 0.15), pointRadius: 0 }] }, options: { ...base, scales: { r: { ticks: { display: false }, pointLabels: { display: false }, grid: { color: GRID }, angleLines: { color: GRID } } } } },
        { type: "scatter", data: { datasets: [{ data: pts(60), backgroundColor: rgba(C[0], 0.8), pointRadius: 2.5 }, { data: pts(40), backgroundColor: rgba(C[5], 0.8), pointRadius: 2.5 }] }, options: { ...base, scales: noAxes } },
        { type: "bubble", data: { datasets: [{ data: pts(18, true), backgroundColor: rgba(C[4], 0.55), borderColor: C[4] }] }, options: { ...base, scales: noAxes } },
      ];
      const charts = cfgs.map((cfg, i) => chart(ctx, cv[i], cfg));
      ctx.button("隨機資料", () => charts.forEach((c) => {
        c.data.datasets.forEach((ds) => {
          ds.data = ds.data.map((d) => (typeof d === "number" ? rand(10, 90) : { x: rand(0, 100), y: rand(0, 100), r: d.r ? rand(3, 14) : undefined }));
        });
        c.update();
      }));
      ctx.button("重播動畫", () => charts.forEach((c) => { c.reset(); c.update(); }), { primary: true });
    },
  },
  {
    id: "stream", title: "即時串流",
    api: "data.push(v); data.shift(); chart.update('none')",
    desc: "每秒推入新資料點、移除最舊的點，用 update('none') 跳過動畫只重繪；右側儀表是 circumference 180 度的甜甜圈圖加中心文字插件。",
    hint: "拖曳「頻率」看每秒更新上限・按暫停凍結畫面",
    mount(ctx) {
      ctx.html(`<div class="split">${card("line", "主機負載", "最近 60 筆")}${card("gauge", "目前 CPU", "半圓儀表")}</div>`);
      const [c1, c2] = ctx.$$("canvas");
      const N = 60;
      let cpu = 45, net = 30, tick = 0;
      const stamp = () => { const d = new Date(); return `${d.getMinutes()}:${String(d.getSeconds()).padStart(2, "0")}.${tick % 10}`; };
      const labels = [], a = [], b = [];
      for (let i = 0; i < N; i++) { labels.push(""); a.push(null); b.push(null); }
      const line = chart(ctx, c1, {
        type: "line",
        data: { labels, datasets: [
          { label: "CPU %", data: a, borderColor: C[1], backgroundColor: rgba(C[1], 0.15), fill: true, tension: 0.35, pointRadius: 0, borderWidth: 2 },
          { label: "網路 MB/s", data: b, borderColor: C[2], tension: 0.35, pointRadius: 0, borderWidth: 2 },
        ] },
        options: { animation: false, interaction: { mode: "index", intersect: false },
          scales: { y: { min: 0, max: 100 }, x: { ticks: { maxRotation: 0, autoSkipPadding: 20 } } },
          plugins: { legend: { position: "top", align: "end" } } },
      });
      const center = {
        id: "centerText",
        afterDraw(c) {
          const { ctx: g, chartArea: { left, right, bottom } } = c;
          const v = c.data.datasets[0].data[0];
          g.save();
          g.fillStyle = "#ecebe6";
          g.font = `700 ${Math.max(18, (right - left) / 6)}px ${Chart.defaults.font.family}`;
          g.textAlign = "center";
          g.fillText(`${v.toFixed(0)}%`, (left + right) / 2, bottom - 8);
          g.restore();
        },
      };
      const gauge = chart(ctx, c2, {
        type: "doughnut",
        data: { labels: ["使用中", "閒置"], datasets: [{ data: [cpu, 100 - cpu], backgroundColor: [C[1], "rgba(255,255,255,0.08)"], borderWidth: 0 }] },
        options: { circumference: 180, rotation: -90, cutout: "72%", animation: { duration: 250 },
          plugins: { legend: { display: false }, tooltip: { enabled: false } } },
        plugins: [center],
      });
      let rate = 8, paused = false, acc = 0;
      const fps = ctx.fps({ position: "bottom" });
      ctx.slider("頻率", { min: 1, max: 60, value: rate, format: (v) => `${v}/秒` }, (v) => (rate = v));
      ctx.toggle("暫停", false, (v) => (paused = v));
      ctx.raf((t, dt) => {
        if (paused) return;
        acc += dt;
        let pushed = 0;
        while (acc >= 1000 / rate && pushed < 60) {
          acc -= 1000 / rate;
          tick++;
          cpu = Math.max(3, Math.min(97, cpu + (Math.random() - 0.5) * 12));
          net = Math.max(2, Math.min(95, net + (Math.random() - 0.5) * 16));
          labels.push(stamp()); labels.shift();
          a.push(cpu); a.shift();
          b.push(net); b.shift();
          pushed++;
        }
        if (!pushed) return;
        line.update("none");
        fps.set("更新", `${rate}/秒`);
        gauge.data.datasets[0].data = [cpu, 100 - cpu];
        gauge.data.datasets[0].backgroundColor[0] = cpu > 80 ? C[2] : cpu > 60 ? C[4] : C[1];
        gauge.update();
      });
    },
  },
  {
    id: "interaction", title: "互動模式",
    api: "options.interaction = { mode, intersect }",
    desc: "同一張圖切換五種互動模式，決定滑鼠指到哪些資料點；tooltip 的 callbacks 自訂文字並加總，點擊用 getElementsAtEventForMode 取回元素。",
    hint: "切換模式後滑過圖表・點一下資料點看回傳結果",
    mount(ctx) {
      ctx.html(`<div class="solo">${card("", "三家門市每月營收", "單位：萬元，示意資料")}</div><div class="picked panel">點擊圖表會列出取到的元素</div>`);
      const picked = ctx.$(".picked");
      const store = (base) => MONTHS.map((_, i) => Math.round(base + Math.sin(i / 1.8 + base) * 30 + Math.random() * 25));
      const c = chart(ctx, ctx.$("canvas"), {
        type: "line",
        data: { labels: MONTHS, datasets: [
          { label: "信義店", data: store(120), borderColor: C[0], backgroundColor: C[0] },
          { label: "西門店", data: store(95), borderColor: C[1], backgroundColor: C[1] },
          { label: "板橋店", data: store(70), borderColor: C[2], backgroundColor: C[2] },
        ] },
        options: {
          elements: { point: { radius: 4, hoverRadius: 8, hoverBorderWidth: 3 }, line: { tension: 0.3, borderWidth: 2 } },
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { position: "top", align: "end" },
            tooltip: {
              callbacks: {
                label: (it) => ` ${it.dataset.label}：${nf.format(it.parsed.y)} 萬`,
                footer: (items) => (items.length > 1 ? `合計 ${nf.format(items.reduce((s, it) => s + it.parsed.y, 0))} 萬` : ""),
              },
            },
          },
          onHover: (e, els) => (e.native.target.style.cursor = els.length ? "pointer" : "default"),
          onClick(e) {
            const { mode, intersect } = c.options.interaction;
            const els = c.getElementsAtEventForMode(e.native, mode, { intersect }, true);
            picked.innerHTML = els.length
              ? `<b>${mode}</b> 模式取到 ${els.length} 個：` + els.slice(0, 6).map((x) => `${c.data.datasets[x.datasetIndex].label}・${MONTHS[x.index]}`).join("、") + (els.length > 6 ? " …" : "")
              : `<b>${mode}</b> 模式沒有取到元素（intersect: ${intersect}）`;
          },
        },
      });
      const modes = ["index", "nearest", "point", "dataset", "x"];
      const inter = ctx.toggle("intersect", false, (v) => { c.options.interaction.intersect = v; c.update("none"); });
      ctx.select("mode", modes, "index", (m) => {
        c.options.interaction.mode = m;
        // point mode only makes sense when the pointer has to touch the element
        if (m === "point") { c.options.interaction.intersect = true; inter.setAttribute("aria-pressed", "true"); }
        c.update("none");
      });
    },
  },
  {
    id: "animation", title: "動畫系統",
    api: "options.animation / options.animations.{x,y}",
    desc: "動畫可依屬性與資料索引設定 delay、duration、easing：長條逐筆延遲、折線逐點描繪、圓餅旋轉展開，換 easing 就換節奏。",
    hint: "選效果與緩動函式，按「重播」",
    mount(ctx) {
      ctx.html(`<div class="solo">${card("", "動畫效果", "")}</div>`);
      const host = ctx.$(".box");
      const sub = ctx.$("h2 small") || ctx.$("h2").appendChild(document.createElement("small"));
      let effect = "bars", easing = "easeOutBounce", duration = 1200, current;
      const build = () => {
        current?.destroy();
        host.replaceChildren(document.createElement("canvas"));
        const canvas = host.firstChild;
        if (effect === "bars") {
          sub.textContent = "delay: dataIndex × 45ms";
          current = new Chart(canvas, {
            type: "bar",
            data: { labels: MONTHS, datasets: [0, 1, 2].map((d) => ({ label: ["北區", "中區", "南區"][d], data: MONTHS.map(() => rand(20, 100)), backgroundColor: [C[1], C[3], C[4]][d], borderRadius: 4 })) },
            options: { animation: { duration, easing, delay: (c) => (c.type === "data" && c.mode === "default" ? c.dataIndex * 45 + c.datasetIndex * 160 : 0) },
              plugins: { legend: { position: "top", align: "end" } }, scales: { x: { grid: { display: false } } } },
          });
        } else if (effect === "line") {
          sub.textContent = "animations.x / y 逐點 delay（500 點）";
          const pts = [];
          let y = 50;
          for (let i = 0; i < 500; i++) { y += 5 - Math.random() * 10; pts.push({ x: i, y }); }
          const step = duration / pts.length;
          const prevY = (c) => (c.index === 0 ? c.chart.scales.y.getPixelForValue(100) : c.chart.getDatasetMeta(c.datasetIndex).data[c.index - 1].getProps(["y"], true).y);
          current = new Chart(canvas, {
            type: "line",
            data: { datasets: [{ label: "隨機漫步", data: pts, borderColor: C[0], borderWidth: 1.5, pointRadius: 0 }] },
            options: {
              animation: false,
              animations: {
                x: { type: "number", easing: "linear", duration: step, from: NaN,
                  delay(c) { if (c.type !== "data" || c.xStarted) return 0; c.xStarted = true; return c.index * step; } },
                y: { type: "number", easing: "linear", duration: step, from: prevY,
                  delay(c) { if (c.type !== "data" || c.yStarted) return 0; c.yStarted = true; return c.index * step; } },
              },
              interaction: { intersect: false }, plugins: { legend: { display: false } }, scales: { x: { type: "linear" } },
            },
          });
        } else {
          sub.textContent = "animateRotate + animateScale";
          current = new Chart(canvas, {
            type: "doughnut",
            data: { labels: ["捷運", "公車", "機車", "汽車", "自行車", "步行"], datasets: [{ data: [31, 18, 26, 14, 5, 6], backgroundColor: C, borderColor: "#171a1f", borderWidth: 3 }] },
            options: { animation: { duration, easing, animateRotate: true, animateScale: true }, cutout: "55%", plugins: { legend: { position: "right" } } },
          });
        }
      };
      ctx.onCleanup(() => current?.destroy());
      ctx.select("", [{ value: "bars", label: "長條逐筆延遲" }, { value: "line", label: "折線逐點描繪" }, { value: "pie", label: "圓餅旋轉展開" }], effect, (v) => { effect = v; build(); });
      ctx.select("", ["easeOutBounce", "easeOutElastic", "easeOutBack", "easeInOutQuart", "linear"], easing, (v) => { easing = v; build(); });
      ctx.slider("時長", { min: 300, max: 4000, step: 100, value: duration, format: (v) => `${(v / 1000).toFixed(1)}s` }, (v) => (duration = v));
      ctx.button("重播", build, { primary: true });
      build();
    },
  },
  {
    id: "plugins", title: "自訂插件",
    api: "plugins: [{ id, beforeDatasetsDraw, afterDatasetsDraw, afterEvent }]",
    desc: "插件掛在繪圖生命週期上直接拿 canvas 畫：目標區間色帶、平均線、長條數值標籤、十字準線都是幾十行的行內插件，不需要額外套件。",
    hint: "開關各插件・滑鼠移到圖上看十字準線",
    mount(ctx) {
      ctx.html(`<div class="solo">${card("", "門市每日來客數", "示意資料・四個行內插件")}</div>`);
      const on = { zone: true, avg: true, labels: true, cross: true };
      const data = MONTHS.map(() => rand(380, 920));
      const font = (w, s) => `${w} ${s}px ${Chart.defaults.font.family}`;
      const zone = { id: "zone", beforeDatasetsDraw(c) {
        if (!on.zone) return;
        const { ctx: g, chartArea: { left, right }, scales: { y } } = c;
        const top = y.getPixelForValue(800), bot = y.getPixelForValue(600);
        g.save();
        g.fillStyle = rgba(C[3], 0.12); g.fillRect(left, top, right - left, bot - top);
        g.fillStyle = C[3]; g.font = font(600, 11); g.fillText("目標區間 600～800", left + 6, top + 14);
        g.restore();
      } };
      const avg = { id: "avg", afterDraw(c) {
        if (!on.avg) return;
        const vals = c.data.datasets[0].data;
        const m = vals.reduce((s, v) => s + v, 0) / vals.length;
        const { ctx: g, chartArea: { left, right }, scales: { y } } = c;
        const py = y.getPixelForValue(m);
        g.save();
        g.strokeStyle = C[0]; g.setLineDash([6, 4]); g.lineWidth = 1.5;
        g.beginPath(); g.moveTo(left, py); g.lineTo(right, py); g.stroke();
        const text = `平均 ${nf.format(Math.round(m))}`;
        g.setLineDash([]); g.font = font(700, 11);
        const w = g.measureText(text).width + 12;
        g.fillStyle = C[0]; g.fillRect(right - w, py - 9, w, 18);
        g.fillStyle = "#0e1013"; g.textAlign = "right";
        g.fillText(text, right - 6, py + 4);
        g.restore();
      } };
      const labels = { id: "valueLabels", afterDatasetsDraw(c) {
        if (!on.labels) return;
        const g = c.ctx;
        g.save();
        g.fillStyle = "#ecebe6"; g.font = font(600, 10); g.textAlign = "center";
        c.getDatasetMeta(0).data.forEach((bar, i) => g.fillText(c.data.datasets[0].data[i], bar.x, bar.y - 4));
        g.restore();
      } };
      const cross = { id: "crosshair",
        afterEvent(c, args) {
          const e = args.event;
          c.$cross = e.type === "mouseout" || !args.inChartArea ? null : { x: e.x, y: e.y };
          args.changed = true;
        },
        afterDraw(c) {
          if (!on.cross || !c.$cross) return;
          const { ctx: g, chartArea: { left, right, top, bottom }, scales: { y } } = c;
          const { x, y: py } = c.$cross;
          g.save();
          g.strokeStyle = "rgba(255,255,255,0.45)"; g.lineWidth = 1;
          g.beginPath(); g.moveTo(x, top); g.lineTo(x, bottom); g.moveTo(left, py); g.lineTo(right, py); g.stroke();
          const label = nf.format(Math.round(y.getValueForPixel(py)));
          g.font = font(600, 11);
          const w = g.measureText(label).width + 10;
          g.fillStyle = C[1]; g.fillRect(left, py - 9, w, 18);
          g.fillStyle = "#0e1013"; g.fillText(label, left + 5, py + 4);
          g.restore();
        } };
      const c = chart(ctx, ctx.$("canvas"), {
        type: "bar",
        data: { labels: MONTHS, datasets: [{ label: "來客數", data, backgroundColor: rgba(C[1], 0.7), borderRadius: 5 }] },
        options: { scales: { y: { min: 0, max: 1000 }, x: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { enabled: false } } },
        plugins: [zone, avg, labels, cross],
      });
      const flip = (k) => (v) => { on[k] = v; c.draw(); };
      ctx.toggle("色帶", true, flip("zone"));
      ctx.toggle("平均線", true, flip("avg"));
      ctx.toggle("數值", true, flip("labels"));
      ctx.toggle("準線", true, flip("cross"));
      ctx.button("換資料", () => { c.data.datasets[0].data = MONTHS.map(() => rand(380, 920)); c.update(); }, { primary: true });
    },
  },
  {
    id: "axes", title: "堆疊與對數軸",
    api: "scales.y.stacked / scales.y.type: 'logarithmic' / segment",
    desc: "左：堆疊面積圖用 fill: '-1' 填到前一條數列；右：對數軸讓 10 到 1000 萬同時看得清楚，segment 回呼把預測段畫成虛線，spanGaps 決定缺值要不要連起來。",
    hint: "切換堆疊、對數軸、跨越缺值",
    mount(ctx) {
      ctx.html(`<div class="split even">${card("", "發電結構", "億度，示意資料")}${card("", "用戶成長", "第 19 月起為預測")}</div>`);
      const [c1, c2] = ctx.$$("canvas");
      const years = Array.from({ length: 11 }, (_, i) => String(2015 + i));
      const series = [
        ["燃煤", C[5], (i) => 1050 - i * 32], ["燃氣", C[1], (i) => 720 + i * 45],
        ["核能", C[4], (i) => Math.max(0, 360 - i * 36)], ["再生能源", C[3], (i) => 120 + i * i * 4.2],
      ];
      const area = chart(ctx, c1, {
        type: "line",
        data: { labels: years, datasets: series.map(([label, col, f], k) => ({
          label, data: years.map((_, i) => Math.round(f(i) + Math.random() * 30)), borderColor: col, backgroundColor: rgba(col, 0.35),
          fill: k === 0 ? "origin" : "-1", pointRadius: 0, tension: 0.3, borderWidth: 1.5 })) },
        options: { interaction: { mode: "index", intersect: false }, scales: { y: { stacked: true, beginAtZero: true } }, plugins: { legend: { position: "top", align: "end" } } },
      });
      const growth = [12];
      for (let i = 1; i < 30; i++) growth.push(Math.round(growth[i - 1] * (1.55 - i * 0.012)));
      growth[9] = null;
      const log = chart(ctx, c2, {
        type: "line",
        data: { labels: growth.map((_, i) => `${i + 1}`), datasets: [{ label: "累積用戶", data: growth, borderColor: C[0], backgroundColor: C[0], pointRadius: 2, borderWidth: 2, spanGaps: false,
          segment: { borderDash: (s) => (s.p1DataIndex >= 18 ? [6, 5] : undefined), borderColor: (s) => (s.p1DataIndex >= 18 ? C[4] : undefined) } }] },
        options: { scales: { y: { type: "logarithmic", ticks: { callback: (v) => (/^1/.test(String(v)) ? Showcase.fmtCompact(v) : "") } }, x: { ticks: { maxRotation: 0, autoSkipPadding: 8 } } },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (it) => ` ${nf.format(it.parsed.y)} 人` } } } },
      });
      ctx.toggle("堆疊", true, (v) => { area.options.scales.y.stacked = v; area.update(); });
      ctx.toggle("對數軸", true, (v) => {
        log.options.scales.y = v
          ? { type: "logarithmic", ticks: { callback: (x) => (/^1/.test(String(x)) ? Showcase.fmtCompact(x) : "") } }
          : { type: "linear", ticks: { callback: (x) => Showcase.fmtCompact(x) } };
        log.update();
      });
      ctx.toggle("跨越缺值", false, (v) => { log.data.datasets[0].spanGaps = v; log.update(); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "parsing: false + plugins.decimation (LTTB)",
    desc: "折線圖每一格都平移視窗並重繪（update('none')），逐級增加資料點直到掉到 30 FPS 以下；開啟 decimation 抽樣後同一台裝置能撐的點數會差一到兩個數量級。",
    hint: "按「自動加壓」開始；切換抽樣後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="stress-chart"><canvas></canvas></div>`);
      let decim = false, n = 1000;
      const c = chart(ctx, ctx.$("canvas"), {
        type: "line",
        data: { datasets: [{ data: [], borderColor: C[1], borderWidth: 1, pointRadius: 0, indexAxis: "x" }] },
        options: {
          animation: false, parsing: false, normalized: true, spanGaps: true,
          interaction: { mode: "nearest", axis: "x", intersect: false },
          scales: { x: { type: "linear", ticks: { callback: (v) => Showcase.fmtCompact(v), maxRotation: 0 } }, y: { ticks: { maxTicksLimit: 6 } } },
          plugins: { legend: { display: false }, tooltip: { enabled: false }, decimation: { enabled: false, algorithm: "lttb", samples: 800 } },
        },
      });
      const make = (count) => {
        const out = new Array(count);
        let y = 0;
        for (let i = 0; i < count; i++) { y += Math.random() - 0.5; out[i] = { x: i, y }; }
        return out;
      };
      ctx.raf((t) => {
        const span = n * 0.7;
        const off = (Math.sin(t / 1600) * 0.5 + 0.5) * (n - span);
        c.options.scales.x.min = off;
        c.options.scales.x.max = off + span;
        c.update("none");
      });
      ctx.toggle("LTTB 抽樣", decim, (v) => { decim = v; c.options.plugins.decimation.enabled = v; c.update("none"); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "資料點", steps: [1000, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000],
        minFps: 30,
        apply(count) {
          n = count;
          c.data.datasets[0].data = make(count);
          c.update("none");
        },
        metrics: () => ({ "抽樣": decim ? "LTTB 開" : "關閉", "實際繪製": c.getDatasetMeta(0).data.length }),
        note: "每格都會重新計算座標並重繪整條線。關閉抽樣時，點數多到一個像素塞進數十個點，畫面不會更清楚但成本照算；開啟 LTTB 只畫約 800 個代表點。",
      });
    },
  },
] });
</script>
</body>
