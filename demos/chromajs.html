<script src="_shared/showcase.js"></script>
<script type="module">
import chroma from "https://cdn.jsdelivr.net/npm/chroma-js@3.2.0/+esm";

const { h, fmt, fmtCompact } = Showcase;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

// Seeded PRNG so generated data looks the same on every load.
function mulberry32(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Pick black or white text, whichever has the higher WCAG contrast on this background.
const ink = (c) => (chroma.contrast(c, "#fff") >= chroma.contrast(c, "#000") ? "#fff" : "#111");
const grade = (r) => (r >= 7 ? "AAA" : r >= 4.5 ? "AA" : r >= 3 ? "AA 大字" : "不合格");
const arr = (a, d) => a.map((v, i) => (Number.isNaN(v) ? "NaN" : String(+v.toFixed(d[i] ?? 2)))).join(", ");

function board(ctx, cls) {
  const b = h("div", { class: `board ${cls}` });
  ctx.el.append(b);
  return b;
}

// A row of <input type=color> inside the control bar.
function colorPicks(ctx, values, onInput, labels) {
  const inputs = values.map((v, i) => h("input", { type: "color", value: v, title: labels[i], "aria-label": labels[i] }));
  inputs.forEach((x) => x.addEventListener("input", () => onInput(inputs.map((y) => y.value))));
  ctx.controls.append(h("label", { class: "sc-field picks" }, ...inputs));
  return inputs;
}

// Redraw when an element changes size (deferred one frame so drawing never feeds back into layout).
function watch(ctx, el, fn) {
  let raf = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => ctx.active && fn());
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}

function fitCanvas(cv) {
  const w = cv.clientWidth, hh = cv.clientHeight;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(w * dpr));
  cv.height = Math.max(1, Math.round(hh * dpr));
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h: hh };
}

function copy(hex) {
  if (!navigator.clipboard) return;
  navigator.clipboard.writeText(hex).catch(() => { /* clipboard is often blocked inside iframes; the value stays visible on screen */ });
}

// ---------- 1. scale lab ----------
const PRESETS = [
  ["日落", "#ffe066", "#ff5d73", "#2d1b69"],
  ["海島", "#fafa6e", "#00a88f", "#2a4858"],
  ["霓虹", "#f72585", "#7209b7", "#4cc9f0"],
  ["森林", "#e9f5db", "#52b788", "#081c15"],
  ["藍鵲", "#fde74c", "#e4572e", "#1d4e89"],
];
const LAB_MODES = [
  { key: "rgb", name: "RGB", note: "直線混色，中段易灰" },
  { key: "hsl", name: "HSL", note: "繞色相環，亮度起伏" },
  { key: "lab", name: "Lab", note: "感知均勻" },
  { key: "lch", name: "LCH", note: "保留彩度" },
  { key: "oklch", name: "OKLCH", note: "新一代感知空間" },
  { key: "bezier", name: "Bezier", note: "曲線插值，中段不混濁" },
];

function scaleColors(mode, keys, n, fix) {
  const s = mode === "bezier" ? chroma.bezier(keys).scale() : chroma.scale(keys).mode(mode);
  if (fix) s.correctLightness();
  return s.colors(n);
}

// Evenness: how constant the perceptual step (deltaE) is between neighbours.
function evenness(colors) {
  const d = [];
  for (let i = 1; i < colors.length; i++) d.push(chroma.deltaE(colors[i - 1], colors[i]));
  const mean = d.reduce((a, b) => a + b, 0) / d.length;
  const sd = Math.sqrt(d.reduce((a, b) => a + (b - mean) ** 2, 0) / d.length);
  return Math.max(0, Math.round((1 - sd / mean) * 100));
}

// Lab L* of each step, drawn over the strip.
function drawCurve(strip, colors) {
  strip.querySelector("svg")?.remove();
  const w = strip.clientWidth, hh = strip.clientHeight;
  if (!w || !hh) return;
  strip.classList.toggle("tight", w / colors.length < 54 || hh < 30);
  const pts = colors.map((c, i) => [((i + 0.5) / colors.length) * w, 5 + (1 - chroma(c).get("lab.l") / 100) * (hh - 10)]);
  const poly = pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ");
  const dots = pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#fff" stroke="rgba(0,0,0,.45)" stroke-width="1"/>`).join("");
  strip.insertAdjacentHTML("beforeend",
    `<svg class="curve" width="${w}" height="${hh}"><polyline points="${poly}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="3.2" stroke-linejoin="round"/><polyline points="${poly}" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>${dots}</svg>`);
}

// ---------- 2. colour spaces ----------
const FORMATS = [
  ["HEX", "hex()", (c) => c.hex()],
  ["RGB", "rgb()", (c) => c.rgb().join(", ")],
  ["HSL", "hsl()", (c) => arr(c.hsl(), [1, 3, 3])],
  ["HSV", "hsv()", (c) => arr(c.hsv(), [1, 3, 3])],
  ["HCG", "hcg()", (c) => arr(c.hcg(), [1, 1, 1])],
  ["CMYK", "cmyk()", (c) => arr(c.cmyk(), [3, 3, 3, 3])],
  ["Lab", "lab()", (c) => arr(c.lab(), [2, 2, 2])],
  ["LCH", "lch()", (c) => arr(c.lch(), [2, 2, 1])],
  ["OKLab", "oklab()", (c) => arr(c.oklab(), [3, 3, 3])],
  ["OKLCH", "oklch()", (c) => arr(c.oklch(), [3, 3, 1])],
  ["WebGL", "gl()", (c) => arr(c.gl(), [3, 3, 3, 2])],
  ["整數", "num()", (c) => fmt(c.num())],
  ["相對亮度", "luminance()", (c) => c.luminance().toFixed(4)],

function benchFill(op, img) {
  const { width: w, height: hh, data } = img;
  const cx = w / 2, cy = hh / 2;
  let p = 0;
  if (op === 0) {
    const s = chroma.scale(["#fafa6e", "#00a88f", "#2a4858"]).mode("oklch").cache(false);
    for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++, p += 4) {
      const t = 0.5 + 0.5 * Math.sin((Math.hypot(x - cx, y - cy) / w) * 22 + (x / w) * 3);
      const [r, g, b] = s(t).rgb();
      data[p] = r; data[p + 1] = g; data[p + 2] = b; data[p + 3] = 255;
    }
  } else if (op === 1) {
    for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++, p += 4) {
      const o = chroma.hsl((x / w) * 360, 0.8, 0.15 + (0.7 * y) / hh).oklch();
      const [r, g, b] = chroma.oklch(o[0], o[1], (o[2] || 0) + 120).rgb();
      data[p] = r; data[p + 1] = g; data[p + 2] = b; data[p + 3] = 255;
    }
  } else if (op === 2) {
    const ref = chroma("#e4572e");
    const lut = chroma.scale(["#fde725", "#21918c", "#440154"]).mode("lab").colors(256, null).map((c) => c.rgb());
    for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++, p += 4) {
      const d = chroma.deltaE(ref, chroma.hsl((x / w) * 360, 0.75, 0.15 + (0.7 * y) / hh));
      const [r, g, b] = lut[Math.min(255, Math.round(d * 2.55))];
      data[p] = r; data[p + 1] = g; data[p + 2] = b; data[p + 3] = 255;
    }
  } else {
    const lut = chroma.scale(["#fafa6e", "#00a88f", "#2a4858"]).mode("oklch").colors(256, null).map((c) => c.rgb());
    for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++, p += 4) {
      const t = 0.5 + 0.5 * Math.sin((Math.hypot(x - cx, y - cy) / w) * 22 + (x / w) * 3);
      const [r, g, b] = lut[(t * 255) | 0];
      data[p] = r; data[p + 1] = g; data[p + 2] = b; data[p + 3] = 255;
    }
  }
}

        return { key, name, cv, mid, row };
      });
      const mark = () => rows.forEach((r, i) => r.row.classList.toggle("on", i === active));

      function drawRow(r) {
        const { g, w, h: hh } = fitCanvas(r.cv);
        if (w < 2 || hh < 2) return;
        const s = chroma.scale([a, b]).mode(r.key);
        for (let x = 0; x < w; x++) { g.fillStyle = s(x / (w - 1)).hex(); g.fillRect(x, 0, 1.5, hh); }
        g.beginPath();
        for (let k = 0; k <= 64; k++) {
          const t = k / 64, y = 4 + (1 - s(t).oklab()[0]) * (hh - 8);
          k ? g.lineTo(t * w, y) : g.moveTo(t * w, y);
        }
        g.lineJoin = "round";
        g.lineWidth = 3; g.strokeStyle = "rgba(0,0,0,.4)"; g.stroke();
        g.lineWidth = 1.5; g.strokeStyle = "#fff"; g.stroke();
        const m = chroma.mix(a, b, 0.5, r.key);
        r.mid.style.background = m.hex();
        r.mid.style.color = ink(m);
        r.mid.innerHTML = `<b>中點</b><span>C ${m.oklch()[1].toFixed(3)}</span>`;
      }
      function drawPlot() {
        if (!plotWrap.offsetWidth) return;
        const S = Math.max(120, Math.min(plotWrap.clientWidth, rowsEl.clientHeight - 40));
        plot.style.width = plot.style.height = `${S}px`;
        const { g } = fitCanvas(plot);
        const R = 0.4, c0 = S / 2, k = S / 2 / R;
        const P = (lab) => [c0 + lab[1] * k, c0 - lab[2] * k];
        g.fillStyle = "#14161b"; g.fillRect(0, 0, S, S);
        g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 1;
        for (const r of [0.1, 0.2, 0.3]) { g.beginPath(); g.arc(c0, c0, r * k, 0, Math.PI * 2); g.stroke(); }
        g.beginPath(); g.moveTo(0, c0); g.lineTo(S, c0); g.moveTo(c0, 0); g.lineTo(c0, S); g.stroke();
        g.fillStyle = "rgba(255,255,255,.45)"; g.font = "10px sans-serif";
        g.fillText("+a 紅", S - 34, c0 - 4); g.fillText("+b 黃", c0 + 4, 12); g.fillText("C 0.1／0.2／0.3", 6, S - 6);
        const paths = rows.map((r) => {
          const s = chroma.scale([a, b]).mode(r.key);
          return Array.from({ length: 41 }, (_, i) => s(i / 40));
        });
        paths.forEach((cs, i) => {
          if (i === active) return;
          g.beginPath();
          cs.forEach((c, j) => { const [x, y] = P(c.oklab()); j ? g.lineTo(x, y) : g.moveTo(x, y); });
          g.strokeStyle = "rgba(255,255,255,.28)"; g.lineWidth = 1; g.stroke();
        });
        const cs = paths[active];
        g.beginPath();
        cs.forEach((c, j) => { const [x, y] = P(c.oklab()); j ? g.lineTo(x, y) : g.moveTo(x, y); });
        g.strokeStyle = "#fff"; g.lineWidth = 2; g.stroke();
        cs.forEach((c, j) => {
          if (j % 2) return;
          const [x, y] = P(c.oklab());
          g.beginPath(); g.arc(x, y, j === 0 || j === 40 ? 6 : 4, 0, Math.PI * 2);
          g.fillStyle = c.hex(); g.fill(); g.strokeStyle = "#000"; g.lineWidth = 1; g.stroke();
        });
        plotCap.textContent = `OKLab a／b 平面：${rows[active].name} 路徑（灰線是其他模式）`;
      }
      function build() { rows.forEach(drawRow); mark(); drawPlot(); }
      watch(ctx, bd, build);
      build();
    },
  },

  {
    id: "brewer", title: "Brewer 色票與分級", paper: true,
    api: "chroma.scale('OrRd').classes(chroma.limits(data, 'e' | 'q' | 'l' | 'k', n))・chroma.brewer・chroma.cubehelix()",
    desc: "同一份右偏的人口密度資料（720 格），用 chroma.limits() 四種分級法切成 n 級再上色。等距會把多數格子塞進第一級，分位數讓每級格數相同，對數與 k-means 介於兩者之間。",
    hint: "切換分級方式看地圖與直方圖的分界線怎麼移動",
    mount(ctx) {
      const values = makeDistricts();
      let pal = "OrRd", mode = "q", n = 6, sc = null, lims = [];
      const bd = board(ctx, "brew");
      const mapCv = h("canvas"), histCv = h("canvas");
      const readout = h("div", { class: "readout" });
      const legend = h("div", { class: "legend" });
      bd.append(h("div", { class: "map" }, mapCv, readout), h("div", { class: "hist" }, histCv), legend);
      ctx.select("", PALS, pal, (v) => { pal = v; update(); });
      ctx.group(LIMIT_MODES.map((m) => m[0]), 1, (i) => { mode = LIMIT_MODES[i][1]; update(); });
      ctx.slider("級數", { min: 3, max: 9, step: 1, value: n }, (v) => { n = v; update(); });
      let geo = null;

      function update() {
        lims = chroma.limits(values, mode, n);
        sc = paletteScale(pal).classes(lims);
        drawMap(); drawHist(); drawLegend();
      }
      function drawMap() {
        const { g, w, h: hh } = fitCanvas(mapCv);
        if (w < 2) return;
        const cell = Math.min(w / COLS, hh / ROWS);
        const ox = (w - cell * COLS) / 2, oy = (hh - cell * ROWS) / 2;
        geo = { cell, ox, oy };
        g.clearRect(0, 0, w, hh);
        values.forEach((v, i) => {
          g.fillStyle = sc(v).hex();
          g.fillRect(ox + (i % COLS) * cell, oy + Math.floor(i / COLS) * cell, cell - 1, cell - 1);
        });
      }
      function drawHist() {
        const { g, w, h: hh } = fitCanvas(histCv);
        if (w < 2) return;
        const lo = Math.log10(Math.min(...values)), hi = Math.log10(Math.max(...values));
        const B = 48, bins = new Array(B).fill(0);
        values.forEach((v) => bins[Math.min(B - 1, Math.floor(((Math.log10(v) - lo) / (hi - lo)) * B))]++);
        const top = Math.max(...bins), padB = 14, bw = w / B;
        g.clearRect(0, 0, w, hh);
        bins.forEach((c, i) => {
          const bh = (c / top) * (hh - padB - 4);
          g.fillStyle = sc(10 ** (lo + ((i + 0.5) / B) * (hi - lo))).hex();
          g.fillRect(i * bw + 0.5, hh - padB - bh, bw - 1, bh);
        });
        g.strokeStyle = "rgba(0,0,0,.65)"; g.lineWidth = 1.2; g.setLineDash([3, 2]);
        lims.slice(1, -1).forEach((l) => {
          const x = ((Math.log10(l) - lo) / (hi - lo)) * w;
          g.beginPath(); g.moveTo(x, 0); g.lineTo(x, hh - padB); g.stroke();
        });
        g.setLineDash([]);
        g.fillStyle = "rgba(0,0,0,.55)"; g.font = "10px sans-serif";
        g.textAlign = "left"; g.fillText(fmt(Math.min(...values)), 2, hh - 3);
        g.textAlign = "center"; g.fillText("數值分布（對數座標），虛線是分級界線", w / 2, hh - 3);
        g.textAlign = "right"; g.fillText(fmt(Math.max(...values)), w - 2, hh - 3);
      }
      function drawLegend() {
        legend.textContent = "";
        legend.append(h("div", { class: "cap", text: `${LIMIT_MODES.find((m) => m[1] === mode)[0]}分級・${pal}` }));
        for (let i = 0; i < lims.length - 1; i++) {
          const a = lims[i], b = lims[i + 1];
          const cnt = values.filter((v) => v >= a && (i === lims.length - 2 ? v <= b : v < b)).length;
          legend.append(h("div", { class: "lg" },
            h("i", { style: `background:${sc((a + b) / 2).hex()}` }),
            h("span", { class: "num", text: `${fmt(Math.round(a))}～${fmt(Math.round(b))}` }),
            h("small", { text: `${cnt} 格` })));
        }
      }
      mapCv.addEventListener("pointermove", (e) => {
        if (!geo) return;
        const r = mapCv.getBoundingClientRect();
        const x = Math.floor((e.clientX - r.left - geo.ox) / geo.cell), y = Math.floor((e.clientY - r.top - geo.oy) / geo.cell);
        if (x < 0 || y < 0 || x >= COLS || y >= ROWS) { readout.textContent = ""; return; }
        const v = values[y * COLS + x];
        let k = 0;
        while (k < lims.length - 2 && v >= lims[k + 1]) k++;
        readout.textContent = `數值 ${fmt(v)}・第 ${k + 1} 級`;
      });
      mapCv.addEventListener("pointerleave", () => (readout.textContent = ""));
      watch(ctx, bd, () => { drawMap(); drawHist(); });
      update();
    },
  },

  {
    id: "contrast", title: "對比與可讀性", paper: true,
    api: "chroma.contrast(a, b)・chroma.contrastAPCA(text, bg)・color.luminance(L)",
    desc: "同時計算 WCAG 2 對比值與 APCA 的 Lc 值（WCAG 3 草案）。「修正到 AA」用 luminance() 只調整文字色亮度，讓對比剛好超過 4.5。下方色盤每格由 contrast() 比較黑白字，自動挑對比較高者。",
    hint: "點下方任一格，把它當背景色試試",
    mount(ctx) {
      let fg = "#8c8c8c", bg = "#ffffff", note = "";
      const bd = board(ctx, "contrast");
      const pv = h("div", { class: "pv" },
        h("div", { class: "t1", text: "標題文字 Aa" }),
        h("div", { class: "t2", text: "內文段落的閱讀舒適度，很大一部分取決於文字與背景的對比。" }),
        h("div", { class: "t3", text: "12 px 註解小字 The quick brown fox" }));
      const met = h("div", { class: "met" });
      const grid = h("div", { class: "grid" });
      bd.append(h("div", { class: "top" }, pv, met), h("div", { class: "cap", text: "自動選字色：每格比較白字與黑字的 contrast()，數字是勝出者的對比值" }), grid);
      const picks = colorPicks(ctx, [fg, bg], ([f, b]) => { fg = f; bg = b; note = ""; paint(); }, ["文字色", "背景色"]);
      const sync = () => { picks[0].value = fg; picks[1].value = bg; };
      ctx.button("交換", () => { [fg, bg] = [bg, fg]; note = ""; sync(); paint(); });
      ctx.button("修正到 AA", () => {
        const before = fg;
        fg = fixContrast(fg, bg);
        note = fg === before ? "已符合 AA，不需調整" : `文字色 ${before} → ${fg}（luminance() 只改亮度）`;
        sync(); paint();
      }, { primary: true });

      function paint() {
        pv.style.background = bg;
        pv.style.color = fg;
        const r = chroma.contrast(fg, bg);
        const lc = Math.abs(chroma.contrastAPCA(fg, bg));
        const badge = (ok, t) => `<span class="badge${ok ? "" : " no"}">${t}</span>`;
        met.innerHTML = `<div><small>WCAG 2 對比</small><div class="big">${r.toFixed(2)}:1</div>${badge(r >= 4.5, "AA")}${badge(r >= 7, "AAA")}${badge(r >= 3, "大字 AA")}</div>
          <div><small>APCA 對比（草案）</small><div class="big">Lc ${lc.toFixed(0)}</div><span>${apcaLevel(lc)}</span></div>
          ${note ? `<div class="fix">${note}</div>` : ""}`;
      }
      function buildGrid() {
        const cols = Math.round(clamp(Math.floor(grid.clientWidth / 64), 6, 12));
        const LS = [0.36, 0.5, 0.63, 0.76, 0.88];
        grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        grid.style.gridTemplateRows = `repeat(${LS.length}, minmax(0, 1fr))`;
        grid.textContent = "";
        for (const L of LS) {
          for (let i = 0; i < cols; i++) {
            const c = chroma.oklch(L, 0.13, (i / cols) * 360 + 20);
            const t = ink(c), hex = c.hex(), r = chroma.contrast(c, t);
            const cell = h("button", { class: "cell", type: "button", style: `background:${hex};color:${t}`, title: `${hex} 配${t === "#fff" ? "白" : "黑"}字 ${r.toFixed(2)}:1` }, "Aa", h("small", { text: r.toFixed(1) }));
            cell.addEventListener("click", () => { bg = hex; fg = t; note = ""; sync(); paint(); });
            grid.append(cell);
          }
        }
      }
      let lastW = 0;
      watch(ctx, grid, () => { if (Math.abs(grid.clientWidth - lastW) > 30) { lastW = grid.clientWidth; buildGrid(); } });
      paint();
      buildGrid();
      lastW = grid.clientWidth;
    },
  },

  {
    id: "cvd", title: "色覺差異檢查", paper: true,
    api: "chroma.deltaE(a, b)・chroma.gl(r, g, b)・chroma.brewer.Set1・模擬矩陣：Machado 2009（手寫）",
    desc: "chroma.js 沒有內建色盲模擬，這裡用 Machado 2009 發表的矩陣在線性 RGB 換算，再由 chroma 計算每組顏色兩兩之間的最小 ΔE 2000。低於 10 標成紅色（經驗門檻），白點標出最容易混淆的那一對。",
    hint: "切換色票，比較 Okabe-Ito 與紅綠燈在綠色盲列的最小 ΔE",
    mount(ctx) {
      let palName = "紅綠燈", view = 2;
      const bd = board(ctx, "cvd");
      const rowsEl = h("div", { class: "rows" });
      const chartCv = h("canvas");
      const chartTitle = h("b");
      bd.append(rowsEl, h("div", { class: "chart" }, chartTitle, h("div", { class: "cap", text: "堆疊長條圖用模擬後的顏色重畫" }), chartCv));
      ctx.select("", Object.keys(CVD_PALETTES), palName, (v) => { palName = v; update(); });
      ctx.group(CVD.map((v) => v.name), view, (i) => { view = i; drawChart(); });
      const rnd = mulberry32(11);
      const data = Array.from({ length: 8 }, () => Array.from({ length: 7 }, () => 2 + rnd() * 6));
      let sims = [];

      function update() {
        const pal = CVD_PALETTES[palName];
        sims = CVD.map((v) => pal.map((c) => simulate(c, v.m)));
        rowsEl.textContent = "";
        CVD.forEach((v, k) => {
          const cs = sims[k];
          let min = Infinity, pair = [0, 1];
          for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
            const d = chroma.deltaE(cs[i], cs[j]);
            if (d < min) { min = d; pair = [i, j]; }
          }
          rowsEl.append(h("div", { class: "row" },
            h("div", { class: "label" }, h("b", { text: v.name }), h("span", { text: v.en })),
            h("div", { class: "sws" }, cs.map((c, i) => h("i", { class: pair.includes(i) ? "pair" : "", style: `background:${c.hex()}`, title: `${pal[i]} → ${c.hex()}` }))),
            h("div", { class: "de" }, h("small", { text: "最小 ΔE" }), h("b", { class: min < DE_WARN ? "bad" : "", text: min.toFixed(1) }))));
        });
        drawChart();
      }
      function drawChart() {
        chartTitle.textContent = `${CVD[view].name}看到的圖表`;
        const { g, w, h: hh } = fitCanvas(chartCv);
        if (w < 2 || !sims.length) return;
        const cs = sims[view], k = cs.length;
        const padL = 4, padB = 16, cols = data.length;
        const totals = data.map((d) => d.slice(0, k).reduce((a, b) => a + b, 0));
        const max = Math.max(...totals);
        const slot = (w - padL) / cols, bw = slot * 0.7;
        g.clearRect(0, 0, w, hh);
        data.forEach((d, j) => {
          let y = hh - padB;
          const x = padL + j * slot + (slot - bw) / 2;
          for (let i = 0; i < k; i++) {
            const bh = (d[i] / max) * (hh - padB - 4);
            g.fillStyle = cs[i].hex();
            g.fillRect(x, y - bh, bw, bh);
            y -= bh;
          }
          g.fillStyle = "rgba(0,0,0,.5)"; g.font = "10px sans-serif"; g.textAlign = "center";
          g.fillText(`${j + 1}月`, x + bw / 2, hh - 3);
        });
      }
      watch(ctx, bd, drawChart);
      update();
    },
  },

  {
    id: "ops", title: "調整與混合",
    api: ".darken() .brighten() .saturate() .shade() .tint() .set('oklch.h', '+30') .luminance(L) .alpha(a)・chroma.mix()・chroma.blend()",
    desc: "以一個基準色為中心，每列示範一組色彩操作的七個級距：明暗、彩度、混黑白、色相旋轉、指定亮度、透明度，最後兩列把第二個顏色混入或疊加。所有結果都是新物件，原色不變。",
    hint: "改左上兩個色塊，八列一起重算",
    mount(ctx) {
      let base = "#e4572e", top = "#4cc9f0";
      const bd = board(ctx, "ops");
      colorPicks(ctx, [base, top], ([a, b]) => { base = a; top = b; render(); }, ["基準色", "疊加色"]);
      function render() {
        bd.textContent = "";
        const c = chroma(base), t = chroma(top);
        for (const op of OPS) {
          const cells = op.cells(c, t).map(([col, code]) => {
            const hex = col.hex();
            const title = `${hex}  ${typeof code === "string" ? code : ""}`;
            if (op.alpha) {
              return h("div", { class: "cell chk", title }, h("div", { style: `background:${col.css()}` }), h("span", { text: hex }));
            }
            const isBase = code === "原色";
            return h("div", { class: `cell${isBase ? " base" : ""}`, style: `background:${hex};color:${ink(col)}`, title },
              h("span", { text: hex }), h("code", { text: code }));
          });
          bd.append(h("div", { class: "row" }, h("div", { class: "lab7", title: op.name }, h("span", { class: "full", text: op.name }), h("span", { class: "short", text: op.short }), h("small", { text: op.sub })), cells));
        }
      }
      render();
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "ctx.bench・chroma.scale().mode('oklch').cache(false)・chroma.hsl().oklch()・chroma.deltaE()",
    desc: "每個像素做一次 chroma 運算，像素數從一千加到一百萬，量出每秒能算多少色。右側畫面是最後一輪算出的影像。「預建色表」只呼叫 256 次 scale，其餘查表，對照逐像素呼叫的成本差距。",
    hint: "選一種運算，按「開始測試」",
    mount(ctx) {
      let op = 0;
      const cv = h("canvas");
      const tag = h("div", { class: "tag" });
      ctx.el.append(h("div", { class: "bv" }, cv, tag));
      const g = cv.getContext("2d");
      const show = (img, label) => {
        cv.width = img.width; cv.height = img.height;
        g.putImageData(img, 0, 0);
        tag.textContent = `${label}・${fmt(img.width)} × ${fmt(img.height)} 像素`;
      };
      const preview = () => { const img = benchImage(40000); benchFill(op, img); show(img, `預覽：${BENCH_OPS[op].desc}`); };
      ctx.controls.classList.add("bottom");
      ctx.group(BENCH_OPS.map((o) => o.label), 0, (i) => { op = i; preview(); });
      ctx.bench({
        label: "像素數", unit: "像素",
        sizes: [1000, 10000, 50000, 100000, 250000, 500000, 1000000],
        target: 1000, budget: 2000,
        prepare: (n) => benchImage(n),
        run(n, img) {
          const t0 = performance.now();
          benchFill(op, img);
          const ms = performance.now() - t0;
          const which = op;
          // Draw after the timer stops so canvas upload is not counted.
          ctx.timeout(() => show(img, BENCH_OPS[which].desc), 0);
          return `${fmtCompact((img.width * img.height) / (ms / 1000))}／秒`;
        },
        note: "每像素建立 1 到 3 個 Color 物件；scale 取樣已用 .cache(false) 關閉快取，量的是真實插值成本。單輪超過 2 秒就停止加碼。大量著色時先用 scale().colors(256) 建色表再查表，通常快上百倍。",
      });
      preview();
    },
  },
] });
</script>
</body>
