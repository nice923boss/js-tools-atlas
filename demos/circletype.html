<style>
  .stage { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; }
  .read { flex: none; max-width: 100%; text-align: center; font-size: 12.5px; line-height: 1.7; color: var(--muted); }
  .read b { font: 600 12px var(--mono); color: var(--fg); }
  .read .warn { color: var(--c5); }
  .read .ok { color: var(--c4); }
  .read .kv { white-space: nowrap; }
  .txt { width: 11em; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0, 0, 0, .25); font-size: 13px; }

  /* 1. arc */
  .arcwrap { flex: none; width: 100%; }
  .arc { font: 900 clamp(24px, 5.4vw, 54px)/1 var(--font); color: var(--accent); text-shadow: 0 4px 24px rgba(247, 223, 30, .25); text-align: center; }
  .guide { position: absolute; border: 1px dashed rgba(247, 223, 30, .5); border-radius: 50%; pointer-events: none; }

  /* 2. seal */
  .seal { --d: 260px; --r: 104px; position: relative; flex: none; width: var(--d); height: var(--d); border-radius: 50%; border: 4px solid #e2382b; color: #e2382b;
    box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 5px #e2382b; }
  .seal .t, .seal .b { position: absolute; left: 0; right: 0; font: 900 calc(var(--d) * .075)/1 var(--font); }
  .seal .t { top: calc(50% - var(--r)); letter-spacing: .08em; }
  .seal .b { bottom: calc(50% - var(--r)); }
  .seal .mid { position: absolute; inset: 0; display: grid; place-items: center; font: 900 calc(var(--d) * .24)/1 var(--font); }

  /* 3. badges */
  .badges { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 18px 34px; }
  .bd { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .badge { position: relative; display: grid; place-items: center; font: 700 16px/1 var(--font); cursor: default; }
  .badge .ring { letter-spacing: .1em; color: var(--fg); }
  .badge .core { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink); font-weight: 900; }
  .bd .read { line-height: 1.5; }
  @media (max-width: 560px) { .badge { font-size: 12px; } .badges { gap: 12px 18px; } }

  /* 4. force box */
  .flow { flex: none; width: min(560px, 100%); padding: 10px 16px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; }
  .flow .para { margin: 4px 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .farc { font: 900 30px/1 var(--font); color: var(--c2); outline: 1px dashed rgba(236, 235, 230, .4); outline-offset: 2px; }
  .farc > div { outline: 1.5px solid var(--c3); margin: 0 auto; }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 16px; vertical-align: middle; margin-right: 5px; border-top: 1.5px solid var(--c3); }
  .legend i.dash { border-top: 1px dashed rgba(236, 235, 230, .7); }
  @media (max-width: 560px) { .farc { font-size: 24px; } }

  /* 5. splitter */
  .sarc { flex: none; width: 100%; font: 900 clamp(22px, 4.4vw, 42px)/1 var(--font); color: var(--c2); text-align: center; }
  .chips { flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 640px; }
  .chip { padding: 2px 7px; border-radius: 6px; background: rgba(127, 127, 127, .14); border: 1px solid var(--line); font-size: 13px; line-height: 1.5; }
  .chip.inv { font: 11px/1.8 var(--mono); color: var(--c5); border-color: var(--c5); }

  /* 6. refresh vs rebuild */
  .rmwrap { flex: none; width: 100%; }
  .rm { font: 700 40px/1 Georgia, "Times New Roman", serif; color: var(--c4); text-align: center; }

  /* 7. compass */
  .compass { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; }
  .compass > * { grid-area: 1 / 1; }
  .compass .ring { line-height: 1; font-weight: 700; border-radius: 50%; outline: 1px solid var(--line); outline-offset: 4px; }
  .hub { border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 900; line-height: 1; }
  .legend2 { flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; font-size: 12px; color: var(--muted); }
  .legend2 b { font: 600 11.5px var(--mono); color: var(--fg); margin-left: 4px; }
  .legend2 i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }

  /* 8. stress */
  .sbox { position: absolute; inset: 8px 8px 8px 350px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .sres { margin: 0 0 8px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  .sres b { font: 600 12px var(--mono); color: var(--fg); }
  .minis { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .mini { font: 700 9px/1 var(--font); }
  /* The bench panel only spans the full width below 560px; above that it leaves room on the right */
  @media (max-width: 560px) { .sbox { inset: 8px; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/circletype@2.3.0/dist/circletype.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const { h, fmtMs } = Showcase;
const C = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const px = (v) => `${Math.round(v)}`;
const fontPx = (el) => parseFloat(getComputedStyle(el).fontSize);
// CircleType trims the text, so a closed ring would butt its last glyph against the first; add a space token at the seam
const withSeam = (t) => [...t, " "];
// CircleType inserts each token with insertAdjacentHTML; tokens longer than one character must be escaped
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

// The controls height (--sc-ctl-h) is published asynchronously, so layouts that depend on the
// stage's free space watch the element itself instead of the scene
function observeSize(ctx, el, fn) {
  // Compare the content box: a padding change leaves clientWidth/clientHeight untouched
  let last = "";
  const ro = new ResizeObserver(([e]) => {
    const key = `${Math.round(e.contentRect.width)}x${Math.round(e.contentRect.height)}`;
    if (!ctx.active || key === last) return;
    last = key;
    fn();
  });
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
}

function textInput(ctx, value, label, onInput) {
  const input = h("input", { type: "text", class: "txt", maxlength: 30, value, "aria-label": label, spellcheck: "false" });
  input.addEventListener("input", () => onInput(input.value.trim()));
  ctx.controls.append(input);
  return input;
}

const SEALS = [
  { name: "工具圖鑑", top: "JS 工具圖鑑", bottom: "二〇二六年十月", mid: "驗" },
  { name: "老店", top: "台北好味道商行", bottom: "創立於一九八七", mid: "鮮" },
  { name: "英文", top: "環形文字研究社", bottom: "CIRCLETYPE", mid: "印" },
];
const BADGES = [
  { text: "JS ✦ 環形 ✦", core: "JS" },
  { text: "JS 工具圖鑑 ✦ 環形文字 ✦", core: "圖鑑" },
  { text: "JS 工具圖鑑 ✦ 環形文字 ✦ CIRCLETYPE ✦ 自動閉合一圈 ✦", core: "CT" },
];
const SPLITS = [
  { name: "逐字（預設）", code: "new CircleType(el)", fn: null },
  { name: "字素", code: "new CircleType(el, (t) => [...new Intl.Segmenter(\"zh-Hant\", { granularity: \"grapheme\" }).segment(t)].map((s) => s.segment))", g: "grapheme" },
  { name: "詞語", code: "new CircleType(el, (t) => [...new Intl.Segmenter(\"zh-Hant\", { granularity: \"word\" }).segment(t)].map((s) => s.segment))", g: "word" },
];
const SAMPLE = "全家\u{1F468}‍\u{1F469}‍\u{1F467}一起看環形文字展覽❤️讚\u{1F44D}\u{1F3FD}";
const FONTS = [
  { name: "Georgia", css: "Georgia, \"Times New Roman\", serif" },
  { name: "Consolas", css: "Consolas, \"Courier New\", monospace" },
  { name: "Impact", css: "Impact, \"Arial Narrow\", sans-serif" },
];
const RM_TEXT = "ROUND AND ROUND IT GOES";
const RINGS = [
  { name: "二十四節氣", frac: 1, color: "var(--fg)", speed: 3,
    text: "立春 雨水 驚蟄 春分 清明 穀雨 立夏 小滿 芒種 夏至 小暑 大暑 立秋 處暑 白露 秋分 寒露 霜降 立冬 小雪 大雪 冬至 小寒 大寒" },
  { name: "地支生肖", frac: 0.84, color: "var(--c1)", speed: -5, text: "子鼠 丑牛 寅虎 卯兔 辰龍 巳蛇 午馬 未羊 申猴 酉雞 戌狗 亥豬" },
  { name: "天干五行", frac: 0.64, color: "var(--c2)", speed: 8, text: "甲木 乙木 丙火 丁火 戊土 己土 庚金 辛金 壬水 癸水" },
  { name: "八卦", frac: 0.44, color: "var(--c3)", speed: -12, text: "乾 兌 離 震 巽 坎 艮 坤" },
];
const MINI = "環形文字壓力測試一圈二十五個字的小徽章轉呀轉呀轉！";

Showcase.run({
  scenes: [
    {
      id: "arc", title: "彩虹拱橋",
      api: "new CircleType(el).radius(340).dir(1)",
      desc: "CircleType 把每個字拆成 span、量好寬度，再沿著圓弧旋轉排列。radius() 決定弧度，dir(-1) 讓弧線往下彎。虛線是文字貼著的那個圓。",
      hint: "拖動半徑、切換方向，或直接改字",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="arcwrap"><div class="arc"></div></div><div class="read"></div></div>`);
        const el = ctx.$(".arc"), read = ctx.$(".read");
        let dir = 1, want = 340, text = "把文字繞成一道彩虹", c = null, guide = null;
        const apply = () => {
          // radius() never goes below the radius that closes a full circle
          const min = c.radius(1).radius();
          c.radius(want).dir(dir);
          const r = c.radius(), fs = fontPx(el), g = Math.max(0, r - fs);
          Object.assign(guide.style, { width: `${2 * g}px`, height: `${2 * g}px`, left: `calc(50% - ${g}px)`,
            top: dir === 1 ? `${fs}px` : "", bottom: dir === 1 ? "" : `${fs}px` });
          read.innerHTML = `<span class="kv">radius() 回傳 <b>${px(r)}</b> px</span>　<span class="kv">最小值 <b>${px(min)}</b> px（剛好繞一圈）</span>　<span class="kv">dir() 回傳 <b>${dir}</b></span>`
            + (want < min ? `<br><span class="warn">設定的 ${want} px 小於最小值，已自動夾到 ${px(min)} px</span>` : "");
        };
        const build = () => {
          if (c) c.destroy();
          el.textContent = text || " ";
          c = new CircleType(el);
          guide = h("i", { class: "guide" });
          c.container.append(guide);
          apply();
        };
        ctx.group(["上拱 dir(1)", "下彎 dir(-1)"], 0, (i) => { dir = i ? -1 : 1; apply(); });
        ctx.slider("半徑", { min: 90, max: 1000, step: 10, value: want, format: (v) => `${v} px` }, (v) => { want = v; apply(); });
        textInput(ctx, text, "弧形文字", (v) => { text = v; build(); });
        build();
        // The font size follows the viewport; radius is stored in px, so rebuild instead of rescaling
        ctx.onResize(build);
      },
    },
    {
      id: "seal", title: "印章：上下兩段弧",
      api: "new CircleType(top).radius(r) · new CircleType(bottom).radius(r).dir(-1)",
      desc: "兩段文字用同一個半徑，下面那段加 dir(-1) 翻到圓的下緣，兩段的圓心剛好落在同一點，就是傳統印章的排法。",
      hint: "換一組印文，或調半徑與傾斜角度",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="seal"><div class="t"></div><div class="mid"></div><div class="b"></div></div><div class="read"></div></div>`);
        const stage = ctx.$(".stage"), seal = ctx.$(".seal"), tEl = ctx.$(".seal .t"), bEl = ctx.$(".seal .b"), midEl = ctx.$(".seal .mid"), read = ctx.$(".read");
        let preset = 0, ratio = 0.4, tilt = -12, top = null, bottom = null, r = 0;
        const size = () => {
          const cs = getComputedStyle(stage);
          const w = stage.clientWidth - 24, hh = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 70;
          return Math.max(150, Math.min(w * 0.86, hh, 320));
        };
        const setR = () => {
          r = seal.clientWidth * ratio;
          seal.style.setProperty("--r", `${r}px`);
          top.radius(r);
          bottom.radius(r);
          read.innerHTML = `<span class="kv">top.radius() <b>${px(top.radius())}</b> px</span>　<span class="kv">bottom.radius() <b>${px(bottom.radius())}</b> px</span>　<span class="kv">bottom.dir() <b>${bottom.dir()}</b></span>`;
        };
        const build = () => {
          if (top) { top.destroy(); bottom.destroy(); }
          seal.style.setProperty("--d", `${size()}px`);
          const p = SEALS[preset];
          tEl.textContent = p.top;
          bEl.textContent = p.bottom;
          midEl.textContent = p.mid;
          top = new CircleType(tEl);
          bottom = new CircleType(bEl).dir(-1);
          setR();
        };
        ctx.group(SEALS.map((s) => s.name), 0, (i) => { preset = i; build(); });
        ctx.slider("半徑", { min: 0.3, max: 0.44, step: 0.01, value: ratio, format: (v) => `${Math.round(v * 100)}%` }, (v) => { ratio = v; setR(); });
        ctx.slider("傾斜", { min: -30, max: 30, step: 1, value: tilt, format: (v) => `${v}°` }, (v) => { tilt = v; seal.style.transform = `rotate(${v}deg)`; });
        seal.style.transform = `rotate(${tilt}deg)`;
        build();
        observeSize(ctx, stage, build);
      },
    },
    {
      id: "badge", title: "自動閉合的徽章",
      api: "new CircleType(el).forceWidth(true) · circle.radius()",
      desc: "不指定 radius() 時，CircleType 依字寬總和算出剛好繞一圈的半徑：字越多圈越大。轉動用一般 CSS transform 就行，三個徽章以相同線速度旋轉。",
      hint: "游標移到徽章上會加速",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="badges">${BADGES.map((b) => `<div class="bd"><div class="badge"><div class="ring"></div><div class="core"><span></span></div></div><div class="read"></div></div>`).join("")}</div></div>`);
        let speed = 40, reverse = false, paused = false;
        const items = ctx.$$(".bd").map((bd, i) => {
          const badge = bd.querySelector(".badge"), ring = bd.querySelector(".ring"), core = bd.querySelector(".core"), read = bd.querySelector(".read");
          ring.textContent = BADGES[i].text;
          const c = new CircleType(ring, withSeam).forceWidth(true);
          const fs0 = fontPx(ring), r0 = c.radius();
          // Sized in em so the badge keeps its proportions when the font size changes
          const inner = (2 * (r0 - fs0) - 10) / fs0;
          Object.assign(core.style, { width: `${inner}em`, height: `${inner}em` });
          core.firstChild.textContent = BADGES[i].core;
          core.firstChild.style.fontSize = `${inner * 0.32 / Math.max(1, BADGES[i].core.length * 0.6)}em`;
          const it = { ring, read, r0, fs0, angle: i * 40, boost: false, glyphs: [...BADGES[i].text].length };
          ctx.on(badge, "pointerenter", () => { it.boost = true; });
          ctx.on(badge, "pointerleave", () => { it.boost = false; });
          return it;
        });
        const paint = () => items.forEach((it) => {
          const r = it.r0 * fontPx(it.ring) / it.fs0;
          it.read.innerHTML = `${it.glyphs} 字　半徑 <b>${px(r)}</b> px`;
        });
        ctx.slider("線速度", { min: 0, max: 160, step: 5, value: speed, format: (v) => `${v} px/s` }, (v) => { speed = v; });
        ctx.toggle("反轉", reverse, (v) => { reverse = v; });
        ctx.toggle("暫停", paused, (v) => { paused = v; });
        paint();
        ctx.onResize(paint);
        ctx.raf((t, dt) => {
          if (paused) return;
          for (const it of items) {
            const r = it.r0 * fontPx(it.ring) / it.fs0;
            // Same linear speed for every badge, so smaller circles turn faster
            it.angle += (speed * (it.boost ? 4 : 1) / r) * (180 / Math.PI) * (dt / 1000) * (reverse ? -1 : 1);
            it.ring.style.transform = `rotate(${it.angle}deg)`;
          }
        });
      },
    },
    {
      id: "box", title: "forceWidth 與 forceHeight",
      api: "new CircleType(el).forceWidth(true).forceHeight(false)",
      desc: "字被轉成絕對定位後，容器本身不再有尺寸。forceHeight（預設開）把容器撐到弧形的高度，forceWidth（預設關）把寬度縮成弧的弦長。",
      hint: "關掉 forceHeight，看下方段落怎麼被壓上來",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="flow"><p class="para">上方段落：弧形標題放在一般的文件流裡。</p>
          <div class="farc">容器尺寸跟著弧形走</div>
          <p class="para">下方段落：forceHeight 關掉時，容器高度變成 0，這段文字會跑到弧形底下。</p></div>
          <div class="legend"><span><i class="dash"></i>元素本身</span><span><i></i>circle.container</span></div><div class="read"></div></div>`);
        const el = ctx.$(".farc"), read = ctx.$(".read");
        let fw = false, fh = true, radius = 260, c = null, seq = 0;
        const measure = async () => {
          const my = ++seq;
          await ctx.frame(2);
          if (my !== seq || !ctx.active) return;
          const box = c.container;
          read.innerHTML = `<span class="kv">元素 <b>${el.offsetWidth}×${el.offsetHeight}</b> px</span>　<span class="kv">container <b>${box.offsetWidth}×${box.offsetHeight}</b> px</span>`
            + `<br>2.3.0 關掉 force 選項時不會清掉先前寫入的尺寸，所以這裡每次切換都重建實例`;
        };
        const build = () => {
          if (c) c.destroy();
          el.textContent = "容器尺寸跟著弧形走";
          c = new CircleType(el).forceWidth(fw).forceHeight(fh).radius(radius);
          measure();
        };
        ctx.toggle("forceWidth", fw, (v) => { fw = v; build(); });
        ctx.toggle("forceHeight", fh, (v) => { fh = v; build(); });
        ctx.slider("半徑", { min: 150, max: 700, step: 10, value: radius, format: (v) => `${v} px` }, (v) => { radius = v; c.radius(v); measure(); });
        build();
        ctx.onResize(build);
      },
    },
    {
      id: "split", title: "自訂切字",
      api: "new CircleType(el, splitter) · splitter = (text) => string[]",
      desc: "第二個參數是切字函式。預設用 [...text] 逐個碼位切，會把組合 emoji 拆散；換成 Intl.Segmenter 依字素或詞語切，一家人就不會被拆開，詞語也能整塊沿弧排列。",
      hint: "切換三種切法，對照下方的切字結果",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="sarc"></div><div class="chips"></div><div class="read"></div></div>`);
        const el = ctx.$(".sarc"), chips = ctx.$(".chips"), read = ctx.$(".read");
        const hasSeg = typeof Intl.Segmenter === "function";
        let mode = hasSeg ? 1 : 0, text = SAMPLE, c = null;
        const tokens = (t) => {
          const s = SPLITS[mode];
          return s.g ? Array.from(new Intl.Segmenter("zh-Hant", { granularity: s.g }).segment(t), (x) => x.segment) : [...t];
        };
        const build = () => {
          if (c) c.destroy();
          el.textContent = text || " ";
          const s = SPLITS[mode];
          c = new CircleType(el, s.g ? (t) => tokens(t).map(esc) : undefined).radius(Math.max(240, el.clientWidth * 0.42));
          const list = tokens(text.trim());
          const invisible = (t) => /^[​-‏︀-️]+$/.test(t);
          chips.replaceChildren(...list.map((t) => invisible(t)
            ? h("span", { class: "chip inv", text: [...t].map((ch) => `U+${ch.codePointAt(0).toString(16).toUpperCase()}`).join(" ") })
            : h("span", { class: "chip", text: t === " " ? "空白" : t })));
          const inv = list.filter(invisible).length;
          read.innerHTML = `切成 <b>${list.length}</b> 段`
            + (inv ? `，<span class="warn">其中 ${inv} 段是看不見的連接字元，組合 emoji 被拆開了</span>` : "")
            + (hasSeg ? "" : `<br><span class="warn">這個瀏覽器沒有 Intl.Segmenter，只能示範預設切法</span>`);
        };
        ctx.group(SPLITS.map((s) => s.name), mode, (i) => { mode = hasSeg ? i : 0; build(); });
        textInput(ctx, text, "要排成弧形的文字", (v) => { text = v; build(); });
        build();
        ctx.onResize(build);
      },
    },
    {
      id: "remeasure", title: "refresh 與重建",
      api: "circle.refresh() · circle.destroy() · new CircleType(el)",
      desc: "CircleType 只在建構時量一次字寬，之後全用 em 排版。所以改字級只要 refresh() 就會等比例縮放；換字型時字寬變了，就得 destroy() 再重建。",
      hint: "先用「只呼叫 refresh()」換字型，再切到重建模式比較",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="rmwrap"><div class="rm"></div></div><div class="read"></div></div>`);
        const el = ctx.$(".rm"), read = ctx.$(".read");
        const g = document.createElement("canvas").getContext("2d");
        // Radius is built as 7.5em so the arc keeps one shape at any size: about 14.5em wide (with glyph overhang) and 4.8em tall
        const sz = ctx.size();
        let font = 0, rebuild = false, on = true, c = null, builtEm = 0;
        let size = Math.round(Math.max(16, Math.min(44, (sz.width - 24) / 15, (sz.height - 230) / 4.8)));
        const widthEm = () => {
          g.font = `700 100px ${FONTS[font].css}`;
          return g.measureText(RM_TEXT).width / 100;
        };
        const paint = () => {
          if (!on) { read.innerHTML = `已呼叫 destroy()，元素還原成原本的純文字 HTML`; return; }
          const now = widthEm(), diff = Math.abs(now - builtEm) / now;
          read.innerHTML = `<span class="kv">建構時量到的字寬 <b>${builtEm.toFixed(2)}</b> em</span>　<span class="kv">目前字型實際 <b>${now.toFixed(2)}</b> em</span><br>`
            + (diff > 0.02 ? `<span class="warn">差了 ${(diff * 100).toFixed(0)}%：字距還是舊字型的，字會擠在一起或拉開</span>` : `<span class="ok">一致：排版正確</span>`);
        };
        const build = () => {
          if (c) c.destroy();
          el.textContent = RM_TEXT;
          if (!on) { c = null; paint(); return; }
          c = new CircleType(el).radius(size * 7.5);
          builtEm = widthEm();
          paint();
        };
        ctx.group(FONTS.map((f) => f.name), 0, (i) => {
          font = i;
          el.style.fontFamily = FONTS[i].css;
          if (!c) return paint();
          if (rebuild) build(); else { c.refresh(); paint(); }
        });
        ctx.group(["只呼叫 refresh()", "destroy() 後重建"], 0, (i) => { rebuild = !!i; if (rebuild && on) build(); });
        ctx.slider("字級", { min: 16, max: 64, step: 1, value: size, format: (v) => `${v} px` }, (v) => {
          size = v;
          el.style.fontSize = `${v}px`;
          if (c) c.refresh();
          paint();
        });
        ctx.toggle("套用 CircleType", on, (v) => { on = v; build(); });
        el.style.fontSize = `${size}px`;
        build();
      },
    },
    {
      id: "compass", title: "同心羅盤",
      api: "new CircleType(el, splitter).forceWidth(true) · el.style.fontSize · el.style.transform = rotate()",
      desc: "四圈文字都用自動閉合的半徑建立，再改 font-size 把每圈縮放到指定大小。CircleType 的排版全用 em，縮放不必重建；旋轉交給 CSS transform。",
      hint: "調轉速或暫停；縮放視窗時只改字級",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="compass">${RINGS.map((r) => `<div class="ring" style="color:${r.color}"></div>`).join("")}<div class="hub">中</div></div><div class="legend2"></div></div>`);
        const box = ctx.$(".compass"), hub = ctx.$(".hub"), legend = ctx.$(".legend2");
        const FS0 = 20;
        const rings = ctx.$$(".compass .ring").map((el, i) => {
          el.style.fontSize = `${FS0}px`;
          el.textContent = RINGS[i].text;
          const c = new CircleType(el, withSeam).forceWidth(true);
          return { el, r0: c.radius(), angle: i * 30, fs: FS0 };
        });
        const fit = () => {
          const R = Math.max(80, Math.min(box.clientWidth, box.clientHeight) / 2 - 8);
          rings.forEach((ring, i) => {
            // Everything is laid out in em, so scaling the font scales the whole ring
            ring.fs = FS0 * (R * RINGS[i].frac) / ring.r0;
            ring.el.style.fontSize = `${ring.fs}px`;
          });
          const d = R * 0.5;
          Object.assign(hub.style, { width: `${d}px`, height: `${d}px`, fontSize: `${d * 0.5}px` });
          legend.replaceChildren(...RINGS.map((r, i) => h("span", {}, h("i", { style: `background:${r.color}` }), r.name, h("b", { text: `${rings[i].fs.toFixed(1)}px` }))));
        };
        let k = 1, paused = false;
        ctx.slider("轉速", { min: 0, max: 4, step: 0.1, value: k, format: (v) => `×${v.toFixed(1)}` }, (v) => { k = v; });
        ctx.toggle("暫停", paused, (v) => { paused = v; });
        fit();
        observeSize(ctx, box, fit);
        ctx.raf((t, dt) => {
          if (paused) return;
          rings.forEach((ring, i) => {
            ring.angle += RINGS[i].speed * k * dt / 1000;
            ring.el.style.transform = `rotate(${ring.angle}deg)`;
          });
        });
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "for (const el of els) new CircleType(el).forceWidth(true)",
      desc: "一次把大量文字排成環，量測從 new CircleType() 到下一幀排版完成的總時間，看單頁放多少字還撐得住。",
      hint: "按「開始測試」，字數會一路加到超過預算為止",
      mount(ctx) {
        ctx.html(`<div class="sbox"><p class="sres">每個小環 ${[...MINI].length} 字。按「開始測試」後，結果會留在這裡。</p><div class="minis"></div></div>`);
        const minis = ctx.$(".minis"), res = ctx.$(".sres");
        const PER = [...MINI].length;
        ctx.bench({
          label: "字數", unit: "字", sizes: [100, 300, 1000, 3000, 10000],
          note: "建構時逐字呼叫 getBoundingClientRect 量寬度，每建一個實例就強制瀏覽器重排一次；旋轉排版則延到下一幀，用 requestAnimationFrame 寫入每個字的 transform。",
          prepare(n) {
            const els = Array.from({ length: Math.round(n / PER) }, (_, i) => h("div", { class: "mini", style: `color:${C[i % C.length]}`, text: MINI }));
            minis.replaceChildren(...els);
            return els;
          },
          async run(n, els) {
            const t0 = performance.now();
            for (const el of els) new CircleType(el).forceWidth(true);
            const t1 = performance.now();
            await new Promise((r) => requestAnimationFrame(r));
            void minis.offsetHeight; // flush style and layout of the new transforms
            const t2 = performance.now();
            res.innerHTML = `最近一次：<b>${els.length}</b> 個環、<b>${els.length * PER}</b> 字　建構（逐字量寬）<b>${fmtMs(t1 - t0)}</b>　等下一幀排版完成 <b>${fmtMs(t2 - t1)}</b>`;
            return `${els.length} 環`;
          },
        });
      },
    },
  ],
});
</script>
</body>
</html>
