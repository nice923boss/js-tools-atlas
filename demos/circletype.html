<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CircleType 示範：弧形標題、旋轉徽章與印章</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 20%, #2a1d12, var(--bg) 70%); }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(12px, 3vh, 26px); padding: 24px 16px 52px; overflow: hidden; }
  #arc { font-size: clamp(26px, 6vw, 54px); font-weight: 900; color: var(--accent); text-shadow: 0 4px 24px rgba(247,223,30,.25); }
  .ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; max-width: 100%; }
  .ctl .btn { padding: 6px 10px; font-size: 12px; }
  .ctl label { font-size: 12px; color: var(--muted); }
  .ctl input[type=range] { width: 120px; }
  .ctl output { font: 12px var(--mono); min-width: 3.5em; }
  .ctl input[type=text] { width: 11em; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: rgba(0,0,0,.25); font-size: 13px; }
  .row { display: flex; gap: clamp(16px, 6vw, 70px); align-items: center; justify-content: center; }
  /* spinning badge */
  .badge { position: relative; width: var(--d); height: var(--d); --d: clamp(140px, 24vh, 190px); display: grid; place-items: center; }
  .badge .ring { position: absolute; inset: 0; display: grid; place-items: center; animation: spin 16s linear infinite; }
  .badge:hover .ring { animation-duration: 4s; }
  #badgeText { font: 700 clamp(12px, 1.9vh, 15px)/1 var(--font); letter-spacing: .12em; color: var(--fg); }
  .badge .core { width: 46%; height: 46%; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font: 900 clamp(18px, 3vh, 26px)/1 var(--font); }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* red seal */
  .seal { position: relative; width: var(--d); height: var(--d); --d: clamp(140px, 24vh, 190px); border-radius: 50%; border: 4px solid #e2382b; color: #e2382b;
    box-shadow: inset 0 0 0 3px rgba(14,16,19,1), inset 0 0 0 5px #e2382b; transform: rotate(-12deg); }
  /* both arcs share the seal centre: top arc hangs r above it, bottom arc sits r below it */
  .seal .t, .seal .b { position: absolute; left: 0; right: 0; font: 900 clamp(12px, 2vh, 16px)/1 var(--font); letter-spacing: .08em; }
  .seal .t { top: calc(50% - var(--r)); }
  .seal .b { bottom: calc(50% - var(--r)); letter-spacing: 0; }
  .seal .mid { position: absolute; inset: 0; display: grid; place-items: center; font: 900 clamp(30px, 6vh, 46px)/1 var(--font); }
  .cap { margin-top: 8px; text-align: center; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div id="arc">把文字繞成一道彩虹</div>
  <div class="panel ctl">
    <button class="btn" data-dir="1" aria-pressed="true">上拱</button>
    <button class="btn" data-dir="-1">下彎</button>
    <label for="r">半徑</label>
    <input type="range" id="r" min="90" max="1000" value="340">
    <output id="rv">340px</output>
    <input type="text" id="txt" maxlength="24" value="把文字繞成一道彩虹" aria-label="弧形標題文字">
  </div>
  <div class="row">
    <div>
      <div class="badge">
        <div class="ring"><div id="badgeText">JS 工具圖鑑 ✦ 環形文字 ✦ CIRCLETYPE ✦ </div></div>
        <div class="core">JS</div>
      </div>
      <div class="cap">自動算出剛好一圈的半徑</div>
    </div>
    <div>
      <div class="seal">
        <div class="t" id="sealTop">JS 工具圖鑑</div>
        <div class="mid">驗</div>
        <div class="b" id="sealBottom">二〇二六年十月</div>
      </div>
      <div class="cap">上下兩段，下方用 dir(-1)</div>
    </div>
  </div>
</div>
<div class="hint">拖曳半徑、切換方向或改字，游標移到徽章會加速</div>

<script src="https://cdn.jsdelivr.net/npm/circletype@2.3.0/dist/circletype.min.js"></script>
<script>
const arcEl = document.getElementById("arc");
const rIn = document.getElementById("r"), rOut = document.getElementById("rv");
let dir = 1;
let arc = new CircleType(arcEl).radius(+rIn.value).dir(dir);

function relayout() {
  arc.radius(+rIn.value).dir(dir);
  rOut.textContent = rIn.value + "px";
}
rIn.addEventListener("input", relayout);
document.querySelectorAll("[data-dir]").forEach((b) => b.addEventListener("click", () => {
  dir = +b.dataset.dir;
  document.querySelectorAll("[data-dir]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  relayout();
}));
// New text needs a fresh instance: destroy restores the original markup first
document.getElementById("txt").addEventListener("input", (e) => {
  arc.destroy();
  arcEl.textContent = e.target.value || " ";
  arc = new CircleType(arcEl);
  relayout();
});

// Badge: no radius given, so CircleType picks the one that closes the circle exactly
const badge = new CircleType(document.getElementById("badgeText")).forceWidth(true);

// Seal: two arcs on the same radius, the bottom one flipped
const seal = document.querySelector(".seal");
const sealR = () => { const r = seal.offsetWidth * 0.4; seal.style.setProperty("--r", r + "px"); return r; };
const sealTop = new CircleType(document.getElementById("sealTop")).radius(sealR());
const sealBottom = new CircleType(document.getElementById("sealBottom")).radius(sealR()).dir(-1);

addEventListener("resize", () => {
  arc.refresh(); badge.refresh();
  sealTop.radius(sealR()); sealBottom.radius(sealR());
});
</script>
</body>
</html>
