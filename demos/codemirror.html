const modCache = {};

async function cm(ctx, ...extra) {
  const st = ctx.status("載入 CodeMirror 模組…");
  const mods = await Promise.all([...BASE, ...extra].map(mod));
  st.done();
  return Object.assign({}, ...mods);
}

function editor(ctx, M, parent, doc, extensions) {
  const view = new M.EditorView({ parent, state: M.EditorState.create({ doc, extensions: [M.EditorState.phrases.of(ZH), extensions] }) });
  ctx.onCleanup(() => view.destroy());

const petals = 6;      // 花瓣數
const layers = 14;     // 層數
const speed = 0.6;     // 旋轉速度
const palette = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389"];

function draw(ctx, w, h, t) {
  ctx.fillStyle = "#0e1013";
  ctx.fillRect(0, 0, w, h);
  ctx.translate(w / 2, h / 2);
  const size = Math.min(w, h) * 0.44;
  for (let i = 0; i < layers; i++) {
    const r = size * (1 - i / layers);
    ctx.rotate(Math.sin(t * speed + i * 0.3) * 0.08);
    ctx.beginPath();
    for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.02) {
      const k = r * (0.75 + 0.25 * Math.cos(petals * a));
      ctx.lineTo(Math.cos(a) * k, Math.sin(a) * k);
    }
    ctx.strokeStyle = palette[i % palette.length];
    ctx.lineWidth = 2;
    ctx.globalAlpha = 0.35 + 0.65 * (1 - i / layers);
    ctx.stroke();
  }
}
`;

        ctx.$(".m").textContent = mode ? "單欄 unified" : "並排 MergeView";
        const n = mode ? (current && M.getChunks(current.state)?.chunks.length) : current?.chunks.length;
        ctx.$(".n").textContent = n ?? "…";
      };
      const build = () => {
        if (current) current.destroy();
        box.replaceChildren();
        const cu = collapse ? { margin: 2, minSize: 4 } : undefined;
        current = mode
          ? new M.EditorView({ parent: box, state: M.EditorState.create({ doc: MERGE_B, extensions: [...exts(), M.unifiedMergeView({ original: MERGE_A, mergeControls: true, collapseUnchanged: cu })] }) })
          : new M.MergeView({ parent: box, a: { doc: MERGE_A, extensions: exts() }, b: { doc: MERGE_B, extensions: exts() }, revertControls: "b-to-a", collapseUnchanged: cu });
        paint();
      };
      ctx.onCleanup(() => current && current.destroy());
      build();
      ctx.group(["並排", "單欄"], mode, (i) => { mode = i; build(); });
      ctx.toggle("收合未變更", true, (v) => { collapse = v; build(); });
    },
  },
  {
    id: "tx", title: "交易與事件",
    api: "EditorView.updateListener・EditorState.changeFilter・StateField.define()",
    desc: "每次編輯都是一筆 Transaction：右側即時列出 userEvent、變更範圍與 update 旗標；changeFilter 保護第 1 行，StateField 累計編輯次數。",
    hint: "自己打字、按 Ctrl+Z，或試著改第 1 行",
    async mount(ctx) {
      ctx.html(`<div class="cmd-fill cmd-side">
        <section class="cmd-pane"><div class="cmd-head"><b>notes.js</b><span class="sp"></span><code class="fc">StateField：0 次編輯</code></div><div class="cmd-ed"></div></section>
        <section class="cmd-pane"><div class="cmd-head">update 紀錄<span class="sp"></span><span class="cmd-num muted n">0</span></div><ul class="cmd-list"></ul></section></div>`);
      const M = await cm(ctx, "@codemirror/commands", "@codemirror/lang-javascript");
      const list = ctx.$(".cmd-list"), t0 = performance.now();
      let total = 0;
      const log = (html) => {
        total++;
        ctx.$(".n").textContent = `${total} 筆`;
        const li = Showcase.h("li", { class: "new" });
        li.innerHTML = `<span class="cmd-t">${((performance.now() - t0) / 1000).toFixed(1)}s</span>${html}`;
        list.prepend(li);
        while (list.children.length > 40) list.lastChild.remove();
      };
      const editCount = M.StateField.define({ create: () => 0, update: (v, tr) => (tr.docChanged ? v + 1 : v) });
      const protect = M.EditorState.changeFilter.of((tr) => {
        const end = tr.startState.doc.line(1).to;
        if (!tr.changes.touchesRange(0, end)) return true;
        log(`<span class="cmd-block">changeFilter 擋下第 1 行的修改</span>`);
        return [0, end];
      });
      const flags = (u) => ["docChanged", "selectionSet", "focusChanged", "viewportChanged"]
        .map((k) => `<span class="cmd-flag${u[k] ? " on" : ""}">${k.replace("Changed", "").replace("Set", "")}</span>`).join("");
      const DOC = "// 這一行受 changeFilter 保護，改不動\nconst todo = [\"備課\", \"錄影\"];\n";
      const view = editor(ctx, M, ctx.$(".cmd-ed"), DOC, [
        M.basicSetup, M.javascript(), M.oneDark, editCount, protect,
        M.EditorView.decorations.of((v) => M.Decoration.set([M.Decoration.line({ class: "cmd-lock" }).range(v.state.doc.line(1).from)])),
        M.EditorView.updateListener.of((u) => {
          ctx.$(".fc").textContent = `StateField：${u.state.field(editCount)} 次編輯`;
          if (!u.docChanged && !u.selectionSet && !u.focusChanged) return;
          for (const tr of u.transactions) {
            const ev = tr.annotation(M.Transaction.userEvent) || "（程式）";
            const parts = [];
            tr.changes.iterChanges((fA, tA, fB, tB, ins) => parts.push(tA > fA ? `刪 ${fA}-${tA}` : "", ins.length ? `插入「${esc(ins.toString().slice(0, 12)).replace(/\n/g, "↵")}」於 ${fB}` : ""));
            log(`<code>${esc(ev)}</code> ${parts.filter(Boolean).join("，") || `游標 ${tr.newSelection.main.head}`}<br>${flags(u)}`);
          }
          if (!u.transactions.length && u.focusChanged) log(`<code>focus</code> ${u.view.hasFocus ? "取得焦點" : "失去焦點"}<br>${flags(u)}`);
        }),
      ]);
      ctx.button("復原", () => M.undo(view));
      ctx.button("重做", () => M.redo(view));
      ctx.button("改第 1 行", () => view.dispatch({ changes: { from: 3, to: 5, insert: "試圖覆寫" }, userEvent: "input.paste" }));
      // Scripted typing: each character is its own transaction tagged input.type, exactly like a keystroke.
      const text = "todo.push(\"剪輯\");";
      let i = 0;
      const typer = ctx.interval(() => {
        if (i >= text.length) { clearInterval(typer); ctx.timeout(() => view.dispatch({ changes: { from: 3, to: 5, insert: "X" }, userEvent: "delete" }), 400); ctx.timeout(() => M.undo(view), 900); return; }
        const end = view.state.doc.length;
        view.dispatch({ changes: { from: end, insert: text[i++] }, selection: { anchor: end + 1 }, userEvent: "input.type" });
      }, 90);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "view.setState(EditorState.create({ doc }))・scrollDOM.scrollTop",
    desc: "文件從 1 千行加到 100 萬行：量換文件的耗時，並在連續捲動與隨機跳躍時看 FPS；DOM 行數維持在數十行，證明只繪製可視範圍。",
    hint: "按「自動加壓」逐級加行數；可關掉語法解析或打開換行比較",
    async mount(ctx) {
      ctx.html(`<div class="cmd-stress"><section class="cmd-pane"><div class="cmd-head"><b>big.js</b><span class="sp"></span><code class="info">…</code></div><div class="cmd-ed"></div></section></div>`);
      const M = await cm(ctx, "@codemirror/lang-javascript");
      const langC = new M.Compartment(), wrapC = new M.Compartment();
      let lang = true, wrap = false, loadMs = 0, lines = 0, frames = 0;
      const exts = () => [M.basicSetup, M.oneDark, langC.of(lang ? M.javascript() : []), wrapC.of(wrap ? M.EditorView.lineWrapping : [])];
      const view = editor(ctx, M, ctx.$(".cmd-ed"), "", exts());
      ctx.controls.classList.add("bottom");
      ctx.toggle("語法解析", true, (v) => { lang = v; view.dispatch({ effects: langC.reconfigure(v ? M.javascript() : []) }); });
      ctx.toggle("自動換行", false, (v) => { wrap = v; view.dispatch({ effects: wrapC.reconfigure(v ? M.EditorView.lineWrapping : []) }); });
      // Continuous scroll plus a random jump every 40 frames, so new lines must be laid out and highlighted.
      ctx.raf(() => {
        const s = view.scrollDOM, max = s.scrollHeight - s.clientHeight;
        if (max <= 0) return;
        if (++frames % 40 === 0) s.scrollTop = Math.random() * max;
        else s.scrollTop = s.scrollTop + 120 >= max ? 0 : s.scrollTop + 120;
      });
      ctx.ramp({
        label: "行數", unit: "行", steps: [1000, 10000, 50000, 100000, 250000, 500000, 1000000], minFps: 30,
        apply: async (n) => {
          const doc = stressDoc(n);
          await ctx.frame(1);
          const t = performance.now();
          view.setState(M.EditorState.create({ doc, extensions: exts() }));
          void view.contentDOM.offsetHeight;
          loadMs = performance.now() - t;
          lines = view.state.doc.lines;
          ctx.$(".info").textContent = `${Showcase.fmt(lines)} 行・${(doc.length / 1048576).toFixed(1)} MB 字元`;
        },
        metrics: () => ({ "載入耗時": Showcase.fmtMs(loadMs), "DOM 行數": String(view.contentDOM.querySelectorAll(".cm-line").length) }),
        note: "載入耗時是 setState 建立新文件（切分成 B 樹）到完成第一次排版；捲動時每 40 格隨機跳到文件任一處，逼 CodeMirror 重新排版並補做語法解析。DOM 行數幾乎不隨文件變大，瓶頸在高度估算與解析；關掉語法解析會變快，打開自動換行會讓高度估算變難。",
      });
    },
  },
] });
</script>
</body>
</html>
