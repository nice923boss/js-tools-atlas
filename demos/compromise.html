<style>
  .cp-wrap { position: absolute; inset: 0; overflow: auto; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px calc(var(--sc-ctl-b, 0px) + 14px); display: grid; gap: 10px; align-content: start; }
  .cp-cols { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) 240px; align-items: start; }
  .cp-cols.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 640px) { .cp-cols, .cp-cols.even { grid-template-columns: minmax(0, 1fr); } }
  .cp-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .cp-card h2 { margin: 0 0 6px; font: 500 13px var(--font); color: var(--muted); }
  .cp-card h2 code { font: 11px var(--mono); margin-left: 6px; }
  .cp-in { width: 100%; resize: none; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg); font: 15px/1.5 var(--font); outline: none; }
  .cp-in:focus { border-color: var(--c2); }
  input.cp-in { font: 14px var(--mono); }
  .cp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cp-chips button { border: 1px dashed var(--line); background: none; border-radius: 999px; padding: 3px 10px; font: 12px var(--font); color: var(--muted); cursor: pointer; }
  .cp-chips button code { font: 12px var(--mono); }
  .cp-chips button:hover, .cp-chips button[aria-pressed="true"] { color: var(--fg); border-color: var(--c2); border-style: solid; }
  .cp-toks { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: flex-end; }
  .cp-tok { display: inline-flex; flex-direction: column; align-items: center; padding: 3px 6px 2px; border-radius: 6px; background: color-mix(in srgb, var(--k) 16%, transparent); border-bottom: 3px solid var(--k); animation: cp-pop .25s ease-out both; }
  .cp-tok b { font: 600 15px var(--font); }

  .cp-out { font-size: 15px; line-height: 1.7; min-height: 26px; }
  .cp-out mark, .cp-para mark { background: color-mix(in srgb, var(--c3) 22%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; }
  .cp-para { font-size: 15px; line-height: 1.9; }
  .cp-para mark { box-shadow: inset 0 -2px 0 var(--c3); }
  .cp-ent { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 5px 8px; font-size: 12px; align-items: start; }
  .cp-ent > span { color: var(--muted); }
  .cp-ent em { font-style: normal; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
  .cp-pill { padding: 0 7px; border-radius: 999px; background: color-mix(in srgb, var(--k, var(--c2)) 18%, transparent); color: var(--fg); font-size: 12px; overflow-wrap: anywhere; }
  .cp-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); }
  .cp-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--k); margin-right: 4px; }
  .cp-stats { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .cp-stats b { color: var(--fg); font: 700 16px var(--mono); margin-right: 3px; }
  .cp-err { color: var(--c3); font-size: 12px; }
  .cp-tbl-wrap { overflow-x: auto; }
  .cp-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .cp-tbl th { text-align: left; font: 500 11.5px var(--font); color: var(--muted); padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .cp-tbl td { padding: 4px 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); font-family: var(--mono); white-space: nowrap; }
  .cp-tbl td.irr { color: var(--c3); font-weight: 600; }
  .cp-tbl td.miss { color: var(--muted); font-family: var(--font); }
  .cp-tbl tr.new td { animation: cp-pop .3s ease-out both; background: color-mix(in srgb, var(--c4) 10%, transparent); }
  .cp-add { display: flex; gap: 6px; flex-wrap: wrap; }
  .cp-add .cp-in { flex: 1 1 140px; width: auto; padding: 5px 10px; }
  .cp-add select { font: 13px var(--font); border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg); padding: 4px 6px; }
  .cp-sent { padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .cp-sent:last-child { border-bottom: 0; }

  .cp-meta { display: flex; flex-wrap: wrap; gap: 4px 6px; margin-top: 4px; font-size: 12px; }
  .cp-meta .cp-pill { font-family: var(--mono); font-size: 11.5px; }
  .cp-cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cp-cal .wd { font-size: 11px; color: var(--muted); text-align: center; }
  .cp-cal .d { position: relative; min-height: 36px; border-radius: 6px; background: color-mix(in srgb, var(--line) 35%, transparent); font: 11px var(--mono); padding: 2px 4px; color: var(--muted); }
  .cp-cal .d.today { outline: 2px solid var(--c2); color: var(--fg); }
  .cp-cal .d .dots { position: absolute; left: 4px; right: 4px; bottom: 3px; display: flex; gap: 2px; flex-wrap: wrap; }
  .cp-cal .d .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--k); }
  .cp-num { font-size: 22px; font: 700 22px var(--mono); }
  .cp-stress { position: absolute; inset: 8px; padding: 10px 12px calc(var(--sc-ctl-b, 0px) + 10px); overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
  @media (min-width: 761px) { .cp-stress { inset: 8px 8px 8px 350px; } }
  .cp-bars { display: grid; gap: 6px; }
  .cp-bar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 96px; gap: 8px; align-items: center; font-size: 12px; }
  .cp-bar .t { height: 14px; border-radius: 4px; background: color-mix(in srgb, var(--line) 50%, transparent); overflow: hidden; }
  .cp-bar .t i { display: block; height: 100%; width: 0; background: var(--k); transition: width .4s; }
  .cp-bar b { font: 600 12px var(--mono); text-align: right; }
  .cp-preview { overflow: hidden; font-size: 13px; line-height: 1.75; color: var(--muted); mask-image: linear-gradient(#000 70%, transparent); }
  .cp-preview .pl { color: var(--fg); background: color-mix(in srgb, var(--c4) 25%, transparent); border-radius: 3px; }
  .cp-preview .pp { color: var(--fg); background: color-mix(in srgb, var(--c3) 20%, transparent); border-radius: 3px; }
</style>
</head>
<body class="paper">
<script src="https://cdn.jsdelivr.net/npm/compromise@14.17.0/builds/compromise.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// compromise showcase: rule-based English NLP running in the browser, from POS tags to a words-per-second benchmark.
const DATES_URL = "https://cdn.jsdelivr.net/npm/compromise-dates@3.9.0/builds/compromise-dates.min.js";
const TAGS = [
  ["TaiwanFood", "台灣小吃", "var(--c5)"],
  ["Person", "人名", "var(--c3)"], ["Place", "地點", "var(--c4)"], ["Organization", "組織", "var(--c6)"],
  ["Value", "數值", "var(--c5)"], ["ProperNoun", "專有名詞", "var(--c6)"], ["Pronoun", "代名詞", "#8a8a8a"],
  ["Noun", "名詞", "var(--c2)"], ["Verb", "動詞", "var(--c3)"], ["Adjective", "形容詞", "var(--c4)"],
  ["Adverb", "副詞", "#c9a800"], ["Preposition", "介系詞", "#9a9a9a"], ["Conjunction", "連接詞", "#9a9a9a"],
  ["Determiner", "限定詞", "#b0b0b0"],
];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clean = (arr) => [...new Set(arr.map((s) => s.replace(/[.,!?;:]+$/, "").trim()).filter(Boolean))];
const pickTag = (tags) => TAGS.find(([t]) => tags.includes(t)) || [null, "其他", "#9a9a9a"];
const pills = (arr, color) => {
  const u = clean(arr);
  return u.length ? u.map((s) => `<span class="cp-pill" style="--k:${color}">${esc(s)}</span>`).join("") : '<span class="muted">（無）</span>';
};
const tokens = (terms, hot) => terms.map((t, i) => {
  const [, zh, color] = pickTag(t.tags);
  return `<span class="cp-tok${hot && hot(t) ? " hot" : ""}" style="--k:${color};animation-delay:${i * 15}ms" title="${esc(t.tags.join(", "))}"><b>${esc(t.text)}</b><i>${zh}</i></span>`;
}).join("");
const termsOf = (doc) => doc.json().flatMap((s) => s.terms);
function diff(before, after) {
  const seen = new Set(before.toLowerCase().match(/[\w'$%,.-]+/g) || []);
  return esc(after).replace(/[\w'$%,.-]+/g, (w) => (seen.has(w.toLowerCase()) ? w : `<mark>${w}</mark>`));
}
// Wrap [start, length] character ranges of `text` in <mark>.
function markRanges(text, ranges) {
  let out = "", at = 0;
  for (const [s, len] of [...ranges].sort((a, b) => a[0] - b[0])) {
    if (s < at) continue;
    out += esc(text.slice(at, s)) + `<mark>${esc(text.slice(s, s + len))}</mark>`;
    at = s + len;
  }
  return out + esc(text.slice(at));
}
const wrap = (ctx, inner) => { ctx.html(`<div class="cp-wrap">${inner}</div>`); return ctx.$(".cp-wrap"); };

// Global lexicon plugin used by the "custom lexicon" scene; snapshots are taken before it is installed.
const LEX_SAMPLES = [
  "After class, Mei rode a YouBike from Tamsui to Ximending and ate lu rou fan, gua bao and stinky tofu.",
  "Grandpa took the train to Jiufen, bought some taro balls and talked with Ah-Hui about the old gold mine.",
];
const LEX_PLUGIN = {
  tags: { TaiwanFood: { isA: "Noun" } },
  words: { "lu rou fan": "TaiwanFood", "gua bao": "TaiwanFood", "stinky tofu": "TaiwanFood", "taro balls": "TaiwanFood", tamsui: "Place", ximending: "Place", jiufen: "Place", youbike: "Organization" },
  api: (View) => { View.prototype.foods = function () { return this.match("#TaiwanFood+"); }; },
};
let lexBefore = null;
let datesReady = false;

Showcase.run({ scenes: [
  {
    id: "analyse", title: "即時分析", paper: true,
    api: "nlp(text).json()・doc.sentences().toPastTense()・doc.people()",
    desc: "一段英文同時做詞性標註、整句時態轉換與人名地名擷取，全部在瀏覽器以規則與詞庫完成，不需伺服器或模型下載。",
    hint: "直接修改英文句子，上方按鈕切換轉換方式",
    mount(ctx) {
      const EX = [
        "Emily takes the MRT to Taipei every morning and buys 2 cups of bubble tea.",
        "David is hiking in Taroko Gorge with 3 friends and they are taking many photos.",
        "We can't find a seat because the night market is crowded, so we're leaving at 9pm.",
        "My grandmother cooks beef noodles every Sunday because she loves her family.",
      ];
      const OPS = [
        ["過去式", (d) => d.sentences().toPastTense()], ["現在式", (d) => d.sentences().toPresentTense()],
        ["未來式", (d) => d.sentences().toFutureTense()], ["否定句", (d) => d.sentences().toNegative()],
        ["數字轉文字", (d) => d.numbers().toText()], ["展開縮寫", (d) => d.contractions().expand()],
      ];
      let op = 0, timer = 0;
      const w = wrap(ctx, `
        <div><textarea class="cp-in" rows="2" spellcheck="false" aria-label="英文輸入"></textarea>
          <div class="cp-chips" style="margin-top:6px">${EX.map((_, i) => `<button data-i="${i}">範例 ${i + 1}</button>`).join("")}</div></div>
        <div class="cp-cols">
          <div style="display:grid;gap:10px;min-width:0">
            <div class="cp-card"><h2>詞性標註</h2><div class="cp-toks"></div></div>
            <div class="cp-card"><h2>句子轉換<code class="op"></code></h2><div class="cp-out"></div></div>
          </div>
          <div style="display:grid;gap:10px;min-width:0">
            <div class="cp-card"><h2>統計</h2><div class="cp-stats"></div></div>
            <div class="cp-card"><h2>擷取結果</h2><div class="cp-ent"></div></div>
            <div class="cp-card"><h2>色彩說明</h2><div class="cp-legend">${TAGS.filter((t) => ["Person", "Place", "Value", "Noun", "Verb", "Adjective", "Adverb", "Pronoun"].includes(t[0])).map(([, zh, c]) => `<span style="--k:${c}">${zh}</span>`).join("")}</div></div>
          </div>
        </div>`);
      const input = w.querySelector("textarea");
      const CODE = ["sentences().toPastTense()", "sentences().toPresentTense()", "sentences().toFutureTense()", "sentences().toNegative()", "numbers().toText()", "contractions().expand()"];
      function analyse() {
        const text = input.value.trim();
        const doc = nlp(text);
        w.querySelector(".cp-toks").innerHTML = tokens(termsOf(doc)) || '<span class="muted">請輸入英文句子</span>';
        const t = nlp(text);
        OPS[op][1](t);
        w.querySelector(".op").textContent = CODE[op];
        w.querySelector(".cp-out").innerHTML = text ? diff(text, t.text()) : "";
        w.querySelector(".cp-stats").innerHTML = `<span><b>${doc.sentences().length}</b>句</span><span><b>${doc.wordCount()}</b>字</span><span><b>${doc.verbs().length}</b>動詞</span>`;
        w.querySelector(".cp-ent").innerHTML = [
          ["人名", doc.people().out("array"), "var(--c3)"], ["地點", doc.places().out("array"), "var(--c4)"],
          ["數字", doc.numbers().out("array"), "var(--c5)"], ["動詞原形", nlp(text).verbs().toInfinitive().out("array"), "var(--c2)"],
        ].map(([label, arr, c]) => `<span>${label}</span><em>${pills(arr, c)}</em>`).join("");
      }
      ctx.group(OPS.map((o) => o[0]), 0, (i) => { op = i; analyse(); });
      ctx.on(w.querySelector(".cp-chips"), "click", (e) => {
        if (!e.target.dataset.i) return;
        input.value = EX[+e.target.dataset.i];
        analyse();
      });
      ctx.on(input, "input", () => { clearTimeout(timer); timer = ctx.timeout(analyse, 120); });
      input.value = EX[0];
      analyse();
    },
  },
  {
    id: "match", title: "比對語法", paper: true,
    api: "doc.match('[<who>#Person] #Verb+').groups()",
    desc: "compromise 的 match 語法能混用詞性標籤、詞根、選擇群組與具名擷取，比正規表示式更貼近語意。下方段落即時標出命中範圍。",
    hint: "點選預設樣式，或在輸入框改寫比對語法",
    mount(ctx) {
      const PARA = "Last Sunday, Emily took the MRT to Tamsui with David. They bought 3 cups of bubble tea and some spicy fried chicken. Grace is taking the THSR to Tainan tomorrow because she loves old temples. The crowded night market was noisy but the food was cheap!";
      const PATS = [
        ["#Adjective #Noun", "形容詞＋名詞"], ["#Value #Noun+", "數量＋名詞"], ["{take}", "詞根：take 的各種變化"],
        ["[<who>#Person] #Verb+", "具名群組：誰做了什麼"], ["(bubble|milk|black) tea", "選擇群組"], ["#Acronym", "縮寫字"],
        ["#Noun+ (is|was) #Adjective", "主詞＋be 動詞＋形容詞"], ["to #ProperNoun", "前往的專有名詞"],
      ];
      const w = wrap(ctx, `
        <input class="cp-in" spellcheck="false" aria-label="比對語法">
        <div class="cp-chips">${PATS.map(([p, zh], i) => `<button data-i="${i}" title="${esc(zh)}"><code>${esc(p)}</code></button>`).join("")}</div>
        <div class="cp-card"><h2>原文段落</h2><div class="cp-para"></div></div>
        <div class="cp-cols even">
          <div class="cp-card"><h2>命中結果 <span class="cnt"></span></h2><div class="cp-ent res"></div></div>
          <div class="cp-card"><h2>具名群組<code>.groups()</code></h2><div class="cp-ent grp"></div></div>
        </div>`);
      const input = w.querySelector("input");
      const base = nlp(PARA);
      function run() {
        const pat = input.value.trim();
        w.querySelectorAll(".cp-chips button").forEach((b) => b.setAttribute("aria-pressed", String(PATS[+b.dataset.i][0] === pat)));
        const zh = (PATS.find((p) => p[0] === pat) || [])[1] || "自訂樣式";
        try {
          const m = base.match(pat);
          const hits = m.json({ offset: true, text: true, terms: false });
          w.querySelector(".cp-para").innerHTML = markRanges(PARA, hits.map((x) => [x.offset.start, x.offset.length]));
          w.querySelector(".cnt").textContent = `${hits.length} 筆・${zh}`;
          w.querySelector(".res").innerHTML = hits.length
            ? hits.map((x, i) => `<span>#${i + 1}</span><em><span class="cp-pill" style="--k:var(--c3)">${esc(x.text.replace(/[.,!?]+$/, ""))}</span></em>`).join("")
            : '<span>結果</span><em class="muted">沒有命中</em>';
          const names = Object.keys(m.groups());
          w.querySelector(".grp").innerHTML = names.length
            ? names.map((n) => `<span>${esc(n)}</span><em>${pills(m.groups(n).out("array"), "var(--c6)")}</em>`).join("")
            : '<span>提示</span><em class="muted">用 [&lt;名稱&gt;…] 包住片段即可擷取</em>';
        } catch (err) {
          w.querySelector(".res").innerHTML = `<span>錯誤</span><em class="cp-err">比對語法無法解析：${esc(err.message)}</em>`;
        }
      }
      ctx.on(w.querySelector(".cp-chips"), "click", (e) => {
        const b = e.target.closest("[data-i]");
        if (!b) return;
        input.value = PATS[+b.dataset.i][0];
        run();
      });
      let timer = 0;
      ctx.on(input, "input", () => { clearTimeout(timer); timer = ctx.timeout(run, 150); });
      input.value = PATS[3][0];
      run();
    },
  },
  {
    id: "conjugate", title: "動詞與形容詞", paper: true,
    api: "nlp(word).verbs().conjugate()・adjectives().conjugate()",
    desc: "內建不規則變化表加上字尾規則，產生完整的動詞變化與形容詞比較級。紅字是不規則形；過去分詞與過去式相同時 conjugate() 不另外回傳。規則推論也會出錯，例如 crowded 會得到 crowdeder。",
    hint: "在輸入框輸入英文單字後按「加入」",
    mount(ctx) {
      const VERBS = ["go", "take", "ride", "buy", "eat", "swim", "catch", "fly", "study", "queue", "panic"];
      const ADJS = ["cheap", "spicy", "good", "hot", "far", "crowded"];
      const VCOL = [["Infinitive", "原形"], ["PastTense", "過去式"], ["PresentTense", "第三人稱"], ["Gerund", "進行式"], ["Participle", "過去分詞"], ["FutureTense", "未來式"]];
      const ACOL = [["Adjective", "原級"], ["Comparative", "比較級"], ["Superlative", "最高級"], ["Adverb", "副詞"], ["Noun", "名詞"]];
      let mode = 0;
      const w = wrap(ctx, `
        <div class="cp-add"><input class="cp-in" spellcheck="false" placeholder="例如 sing、bring、happy" aria-label="英文單字"><button class="btn primary" type="button">加入</button></div>
        <div class="cp-card"><h2 class="ttl"></h2><div class="cp-tbl-wrap"><table class="cp-tbl"></table></div></div>`);
      const input = w.querySelector("input");
      const isIrr = (base, form, key) => {
        if (!form || key === "Infinitive" || key === "Adjective" || key === "FutureTense") return false;
        if (key === "PastTense" || key === "Participle") return !/ed$/.test(form);
        if (key === "Comparative") return !/er$/.test(form);
        if (key === "Superlative") return !/est$/.test(form);
        return false;
      };
      function row(word, isNew) {
        const verb = mode === 0;
        const d = nlp(word);
        d.tag(verb ? "Verb" : "Adjective");
        const c = (verb ? d.verbs() : d.adjectives()).conjugate()[0] || {};
        const cols = verb ? VCOL : ACOL;
        return `<tr class="${isNew ? "new" : ""}">${cols.map(([k]) => c[k]
          ? `<td class="${isIrr(word, c[k], k) ? "irr" : ""}">${esc(c[k])}</td>`
          : `<td class="miss">${k === "Participle" && c.PastTense ? "（同過去式）" : "（無）"}</td>`).join("")}</tr>`;
      }
      const lists = [VERBS.slice(), ADJS.slice()];
      function render(added) {
        const cols = mode === 0 ? VCOL : ACOL;
        w.querySelector(".ttl").innerHTML = mode === 0 ? "動詞變化<code>verbs().conjugate()</code>" : "形容詞變化<code>adjectives().conjugate()</code>";
        w.querySelector("table").innerHTML = `<thead><tr>${cols.map(([, zh]) => `<th>${zh}</th>`).join("")}</tr></thead><tbody>${lists[mode].map((v) => row(v, v === added)).join("")}</tbody>`;
      }
      const add = () => {
        const v = input.value.trim().toLowerCase();
        if (!/^[a-z][a-z-]*$/.test(v)) { input.focus(); return; }
        lists[mode] = [v, ...lists[mode].filter((x) => x !== v)];
        input.value = "";
        render(v);
      };
      ctx.group(["動詞", "形容詞"], 0, (i) => { mode = i; render(); });
      ctx.on(w.querySelector("button"), "click", add);
      ctx.on(input, "keydown", (e) => { if (e.key === "Enter") add(); });
      render();
    },
  },
  {
    id: "nouns", title: "名詞單複數", paper: true,
    api: "doc.nouns().toPlural()・nouns().json()",
    desc: "名詞片語會被切出限定詞、形容詞與中心詞，轉換時只改中心詞並連動限定詞。左表測試不規則複數的來回轉換。",
    hint: "上方切換整句轉複數或單數",
    mount(ctx) {
      const WORDS = ["child", "mouse", "goose", "person", "tooth", "sheep", "cactus", "knife", "city", "bus", "night market", "phenomenon"];
      const SENT = "The child bought a mango and an old scooter, then a tourist took a photo of the night market.";
      const SENT_PL = "The children bought mangos and old scooters, then three tourists took photos of the night markets.";
      let mode = 0;
      const w = wrap(ctx, `
        <div class="cp-cols even">
          <div class="cp-card"><h2>單字來回轉換</h2><div class="cp-tbl-wrap"><table class="cp-tbl wt"></table></div></div>
          <div style="display:grid;gap:10px;min-width:0">
            <div class="cp-card"><h2>整句轉換<code class="op"></code></h2><div class="cp-out"></div></div>
            <div class="cp-card"><h2>名詞片語結構<code>nouns().json()</code></h2><div class="cp-tbl-wrap"><table class="cp-tbl np"></table></div></div>
          </div>
        </div>`);
      const conv = (word, fn) => { const d = nlp(word); d.tag("Noun"); d.nouns()[fn](); return d.text(); };
      w.querySelector(".wt").innerHTML = `<thead><tr><th>單數</th><th>toPlural()</th><th>再 toSingular()</th></tr></thead><tbody>${WORDS.map((x) => {
        const p = conv(x, "toPlural"), s = conv(p, "toSingular");
        const irr = !p.startsWith(x);
        return `<tr><td>${esc(x)}</td><td class="${irr ? "irr" : ""}">${esc(p) || '<span class="muted">（無）</span>'}</td><td class="${s === x ? "" : "irr"}">${esc(s) || "（無）"}</td></tr>`;
      }).join("")}</tbody>`;
      function render() {
        const src = mode === 0 ? SENT : SENT_PL;
        const d = nlp(src);
        if (mode === 0) d.nouns().toPlural(); else d.nouns().toSingular();
        w.querySelector(".op").textContent = mode === 0 ? "nouns().toPlural()" : "nouns().toSingular()";
        w.querySelector(".cp-out").innerHTML = `<div class="muted" style="font-size:13px">${esc(src)}</div>${diff(src, d.text())}`;
        const np = nlp(src).nouns().json().map((x) => x.noun);
        w.querySelector(".np").innerHTML = `<thead><tr><th>限定詞</th><th>形容詞</th><th>中心詞</th><th>複數？</th></tr></thead><tbody>${np.map((x) =>
          `<tr><td>${esc(x.determiner || "")}</td><td>${esc((x.adjectives || []).join(" "))}</td><td>${esc(x.root)}</td><td>${x.isPlural ? "是" : "否"}</td></tr>`).join("")}</tbody>`;
      }
      ctx.group(["整句轉複數", "整句轉單數"], 0, (i) => { mode = i; render(); });
      render();
    },
  },
  {
    id: "numbers", title: "數字與金額", paper: true,
    api: "doc.numbers().toText()・numbers().add(n)・money().get()",
    desc: "同一套數值解析能讀懂阿拉伯數字、英文數字、序數、金額與百分比，並且可以改寫成其他寫法或直接做加法。",
    hint: "上方切換轉換方式，粉紅底是被改寫的部分",
    mount(ctx) {
      const SENTS = [
        "A bowl of beef noodles costs $180, and two cups of bubble tea cost 120 dollars.",
        "The THSR ticket from Taipei to Kaohsiung was 1490 dollars, about 30% off on the third day.",
        "Over 2500000 people live in Taipei, and twenty six MRT trains arrive every hour.",
        "I finished fifth in the marathon after running forty two kilometers in 4 hours.",
      ];
      const OPS = [
        ["原文", null, "numbers().json()"], ["轉英文", (d) => d.numbers().toText(), "numbers().toText()"],
        ["轉數字", (d) => d.numbers().toNumber(), "numbers().toNumber()"], ["序數", (d) => d.numbers().toOrdinal(), "numbers().toOrdinal()"],
        ["全部 +10", (d) => d.numbers().add(10), "numbers().add(10)"], ["千分位", (d) => d.numbers().toLocaleString(), "numbers().toLocaleString()"],
      ];
      let op = 0;
      const w = wrap(ctx, `<div class="cp-cols"><div class="cp-card"><h2>句子<code class="op"></code></h2><div class="list"></div></div>
        <div class="cp-card"><h2>解析出的數值</h2><div class="cp-ent vals"></div></div></div>`);
      function render() {
        const [, fn, code] = OPS[op];
        w.querySelector(".op").textContent = code;
        w.querySelector(".list").innerHTML = SENTS.map((s) => {
          const d = nlp(s);
          if (fn) fn(d);
          const nums = nlp(s).numbers().json().map((n) => n.number);
          return `<div class="cp-sent"><div class="cp-out">${fn ? diff(s, d.text()) : esc(s)}</div>
            <div class="cp-meta">${nums.map((n) => `<span class="cp-pill" style="--k:var(--c5)">${esc(n.prefix)}${n.num}${esc(n.suffix)}${n.unit ? " " + esc(n.unit) : ""}</span>`).join("")}</div></div>`;
        }).join("");
        const all = nlp(SENTS.join(" "));
        const fmtN = (a) => a.map((x) => (typeof x === "number" ? x.toLocaleString("en-US") : JSON.stringify(x)));
        w.querySelector(".vals").innerHTML = [
          ["全部數值", fmtN(all.numbers().get()), "var(--c5)"],
          ["金額", fmtN(all.money().get()), "var(--c4)"],
          ["百分比", fmtN(all.percentages().get()), "var(--c6)"],
          ["序數", all.numbers().isOrdinal().out("array"), "var(--c2)"],
          ["大於 100", all.numbers().greaterThan(100).out("array"), "var(--c3)"],
        ].map(([l, a, c]) => `<span>${l}</span><em>${pills(a, c)}</em>`).join("");
      }
      ctx.group(OPS.map((o) => o[0]), 0, (i) => { op = i; render(); });
      render();
    },
  },
  {
    id: "dates", title: "日期外掛", paper: true,
    api: "nlp.plugin(compromiseDates)・doc.dates({ today }).json()",
    desc: "官方外掛 compromise-dates 把 next Friday、tomorrow morning、in two days 這類說法換算成實際日期與時段，並以今天為基準畫在月曆上。解析失敗的句子照實顯示。",
    hint: "月曆上的圓點對應左側句子的顏色",
    async mount(ctx) {
      if (!window.compromiseDates) {
        const s = ctx.status("載入 compromise-dates 外掛（約 125 KB）…");
        await ctx.load(DATES_URL);
        s.done();
      }
      if (!datesReady) { nlp.plugin(window.compromiseDates); datesReady = true; }
      const SENTS = [
        "Let's meet at Taipei 101 next Friday at 7:30pm for two hours.",
        "My flight to Kaohsiung leaves tomorrow morning and I'll stay for 3 days.",
        "The typhoon will arrive in two days, so school is closed until Monday.",
        "We hiked Yangmingshan last weekend from 9am to noon.",
        "The Double Ninth Festival dinner is on October 25th.",
        "The Lantern Festival is on February 12th, and the fireworks start at 8pm.",
      ];
      const COLORS = ["var(--c3)", "var(--c2)", "var(--c5)", "var(--c4)", "var(--c6)", "#c9a800"];
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const today = key(now);
      const WD = "日一二三四五六";
      const show = (iso) => {
        if (!iso) return "?";
        const d = new Date(`${iso.slice(0, 10)}T00:00:00`);
        return `${d.getMonth() + 1}/${d.getDate()}（${WD[d.getDay()]}）${iso.slice(11, 16)}`;
      };
      const w = wrap(ctx, `<div class="cp-cols even"><div class="cp-card"><h2>句子與解析結果<code>today = ${today}</code></h2><div class="list"></div></div>
        <div class="cp-card"><h2>五週月曆</h2><div class="cp-cal"></div><div class="muted out" style="font-size:12px;margin-top:6px"></div></div></div>`);
      const marks = {};
      w.querySelector(".list").innerHTML = SENTS.map((s, i) => {
        const doc = nlp(s);
        const ds = doc.dates({ today, timezone: "Asia/Taipei" }).json({ offset: true });
        const rr = ds.map((x) => [x.offset.start, x.offset.length]);
        const rows = ds.map((x) => {
          const st = x.dates && x.dates.start, en = x.dates && x.dates.end;
          if (st) {
            const k = st.slice(0, 10);
            (marks[k] = marks[k] || []).push(COLORS[i]);
          }
          return st ? `<span class="cp-pill" style="--k:${COLORS[i]}">${show(st)} ~ ${show(en)}</span>` : `<span class="cp-pill" style="--k:var(--muted)">「${esc(x.text.replace(/[.,]+$/, ""))}」無法換算</span>`;
        });
        const times = doc.times().get().map((t) => `<span class="cp-pill" style="--k:var(--c2)">時刻 ${esc(t["24h"])}</span>`);
        const durs = doc.durations().get().map((o) => `<span class="cp-pill" style="--k:var(--c6)">時長 ${esc(Object.entries(o).map(([k, v]) => `${v} ${k}`).join(" "))}</span>`);
        return `<div class="cp-sent"><div class="cp-out" style="border-left:3px solid ${COLORS[i]};padding-left:8px">${markRanges(s, rr)}</div><div class="cp-meta">${rows.join("")}${times.join("")}${durs.join("")}</div></div>`;
      }).join("");
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() - 7);
      let cal = [...WD].map((c) => `<div class="wd">${c}</div>`).join("");
      const shown = new Set();
      for (let i = 0; i < 35; i++) {
        const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
        const k = key(d);
        if (marks[k]) shown.add(k);
        cal += `<div class="d${k === today ? " today" : ""}">${d.getDate() === 1 || i === 0 ? `${d.getMonth() + 1}/` : ""}${d.getDate()}<span class="dots">${(marks[k] || []).map((c) => `<i style="--k:${c}"></i>`).join("")}</span></div>`;
      }
      w.querySelector(".cp-cal").innerHTML = cal;
      const far = Object.keys(marks).filter((k) => !shown.has(k)).sort();
      w.querySelector(".out").textContent = far.length ? `超出月曆範圍：${far.join("、")}` : "";
    },
  },
  {
    id: "lexicon", title: "自訂詞庫", paper: true,
    api: "nlp.plugin({ tags, words, api })・nlp.addWords({...})",
    desc: "預設詞庫不認得台灣地名與小吃。用 nlp.plugin 加入新標籤 TaiwanFood、詞彙與自訂方法 .foods() 後，同一句話的標註立刻改變。詞庫是全域的，會影響本頁其他場景，重新整理才會還原。",
    hint: "可在下方自行加入單字與標籤，再看右欄變化",
    mount(ctx) {
      if (!lexBefore) {
        lexBefore = LEX_SAMPLES.map((s) => termsOf(nlp(s)));
        nlp.plugin(LEX_PLUGIN);
      }
      let si = 0;
      const added = new Set(Object.keys(LEX_PLUGIN.words));
      const w = wrap(ctx, `
        <div class="cp-cols even">
          <div class="cp-card"><h2>預設詞庫</h2><div class="cp-toks b"></div><div class="cp-ent eb" style="margin-top:10px"></div></div>
          <div class="cp-card"><h2>套用插件之後</h2><div class="cp-toks a"></div><div class="cp-ent ea" style="margin-top:10px"></div></div>
        </div>
        <div class="cp-card"><h2>自行加入詞彙<code>nlp.addWords()</code></h2>
          <div class="cp-add"><input class="cp-in" spellcheck="false" placeholder="例如 taro balls、ah-hui" aria-label="新詞彙">
            <select aria-label="標籤"><option value="TaiwanFood">台灣小吃</option><option value="Place">地點</option><option value="Person">人名</option><option value="Organization">組織</option></select>
            <button class="btn primary" type="button">加入</button></div>
          <div class="cp-meta words" style="margin-top:8px"></div></div>`);
      const input = w.querySelector("input");
      function render() {
        const text = LEX_SAMPLES[si];
        const doc = nlp(text);
        const after = termsOf(doc);
        const changed = (t, i) => (lexBefore[si][i] || {}).tags + "" !== t.tags + "";
        w.querySelector(".b").innerHTML = tokens(lexBefore[si]);
        w.querySelector(".a").innerHTML = after.map((t, i) => tokens([t], () => changed(t, i))).join("");
        const pick = (terms, tag) => {
          const out = [];
          let cur = [];
          terms.forEach((t) => { if (t.tags.includes(tag)) cur.push(t.text); else if (cur.length) { out.push(cur.join(" ")); cur = []; } });
          if (cur.length) out.push(cur.join(" "));
          return out;
        };
        w.querySelector(".eb").innerHTML = [["地點", pick(lexBefore[si], "Place"), "var(--c4)"], ["人名", pick(lexBefore[si], "Person"), "var(--c3)"], ["小吃", [], "var(--c5)"]]
          .map(([l, a, c]) => `<span>${l}</span><em>${pills(a, c)}</em>`).join("");
        w.querySelector(".ea").innerHTML = [["地點", doc.places().out("array"), "var(--c4)"], ["人名", doc.people().out("array"), "var(--c3)"], ["小吃", doc.foods().out("array"), "var(--c5)"]]
          .map(([l, a, c]) => `<span>${l}</span><em>${pills(a, c)}</em>`).join("");
        w.querySelector(".words").innerHTML = [...added].map((x) => `<span class="cp-pill" style="--k:var(--c4)">${esc(x)}</span>`).join("");
      }
      const add = () => {
        const v = input.value.trim().toLowerCase();
        if (!/^[a-z][a-z' -]*$/.test(v)) { input.focus(); return; }
        nlp.addWords({ [v]: w.querySelector("select").value });
        added.add(v);
        input.value = "";
        render();
      };
      ctx.group(["範例 1", "範例 2"], 0, (i) => { si = i; render(); });
      ctx.on(w.querySelector(".cp-add button"), "click", add);
      ctx.on(input, "keydown", (e) => { if (e.key === "Enter") add(); });
      render();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "nlp(text)・nlp.tokenize(text)・nlp.lazy(text, '#Place')",
    desc: "產生指定字數的英文語料，量測三種處理深度的吞吐量：完整詞性標註、只做斷詞、以及只找符合樣式片段的快速掃描。",
    hint: "上方選處理模式，左側按「開始測試」",
    mount(ctx) {
      const NAMES = ["Emily", "David", "Grace", "Kevin", "Mei", "Jason", "Linda", "Tom"];
      const PLACES = ["Taipei", "Tainan", "Kaohsiung", "Taichung", "Hualien", "Keelung", "Taitung", "Hsinchu"];
      const FOODS = ["bubble tea", "beef noodles", "pineapple cakes", "scallion pancakes", "fried chicken", "mango ice"];
      const VERBS = ["takes the train to", "rides a scooter to", "flew to", "will drive to", "is walking to", "visited"];
      const DAYS = ["on Monday", "every weekend", "last Friday", "tomorrow", "in the morning", "after work"];
      const r = (a) => a[(Math.random() * a.length) | 0];
      const sentence = () => {
        const k = Math.random();
        if (k < 0.5) return `${r(NAMES)} ${r(VERBS)} ${r(PLACES)} ${r(DAYS)} and buys ${2 + ((Math.random() * 9) | 0)} boxes of ${r(FOODS)}.`;
        if (k < 0.8) return `Did ${r(NAMES)} really enjoy the ${r(FOODS)} in ${r(PLACES)} ${r(DAYS)}?`;
        return `The crowded night market in ${r(PLACES)} was noisy, but ${r(NAMES)} didn't mind waiting for ${r(FOODS)}.`;
      };
      const MODES = [
        ["完整標註", "nlp(text)", "var(--c3)", (t) => { const d = nlp(t); return `人名 ${d.people().length}・地點 ${d.places().length}`; }],
        ["只斷詞", "nlp.tokenize(text)", "var(--c2)", (t) => `${nlp.tokenize(t).terms().length} 個詞`],
        ["快速掃描", "nlp.lazy(text, '#Place')", "var(--c4)", (t) => `命中 ${nlp.lazy(t, "#Place").length} 處`],
      ];
      const best = [0, 0, 0];
      let mi = 0, gen = 0;
      ctx.html(`<div class="cp-stress"><div class="cp-card"><h2>各模式最佳吞吐量（詞/秒）</h2><div class="cp-bars">${MODES.map(([n, code, c]) =>
        `<div class="cp-bar" style="--k:${c}" title="${esc(code)}"><span>${n}</span><span class="t"><i></i></span><b>未測</b></div>`).join("")}</div></div>
        <div class="cp-card cp-preview"><h2>最近一次語料預覽</h2><div class="txt"></div></div></div>`);
      const bars = ctx.$$(".cp-bar");
      const paintBars = () => {
        const max = Math.max(...best, 1);
        bars.forEach((b, i) => {
          b.querySelector("i").style.width = `${(best[i] / max) * 100}%`;
          b.querySelector("b").textContent = best[i] ? Showcase.fmtCompact(best[i]) : "未測";
        });
      };
      const preview = (text) => {
        const snippet = text.slice(0, 1400);
        const d = nlp(snippet);
        const ranges = [];
        d.places().json({ offset: true, terms: false }).forEach((x) => ranges.push([x.offset.start, x.offset.length, "pl"]));
        d.people().json({ offset: true, terms: false }).forEach((x) => ranges.push([x.offset.start, x.offset.length, "pp"]));
        ranges.sort((a, b) => a[0] - b[0]);
        let out = "", at = 0;
        for (const [s, len, cls] of ranges) {
          if (s < at) continue;
          out += esc(snippet.slice(at, s)) + `<span class="${cls}">${esc(snippet.slice(s, s + len))}</span>`;
          at = s + len;
        }
        ctx.$(".txt").innerHTML = out + esc(snippet.slice(at));
      };
      const makeBench = () => {
        const lab = ctx.el.querySelector(".sc-lab");
        if (lab) lab.remove();
        const my = ++gen, m = MODES[mi];
        ctx.bench({
          label: `${m[0]}字數`, unit: "詞", sizes: [1000, 5000, 20000, 50000, 100000], target: 1000, budget: 2500,
          prepare(n) {
            const parts = [];
            let words = 0;
            while (words < n) { const s = sentence(); parts.push(s); words += s.split(" ").length; }
            return parts.join(" ");
          },
          run(n, text) {
            if (my !== gen) throw new DOMException("Bench replaced", "AbortError");
            const t0 = performance.now();
            const detail = m[3](text);
            const rate = n / ((performance.now() - t0) / 1000);
            if (rate > best[mi]) best[mi] = rate;
            paintBars();
            if (n === 1000) preview(text);
            return detail;
          },
          note: `計時只含 ${m[1]} 與一次結果查詢，語料產生不計入。完整標註會跑詞庫比對、上下文規則與片語切分，最慢也最準；只斷詞跳過標註；快速掃描先用字串預篩，只對可能命中的句子標註。`,
        });
      };
      ctx.group(MODES.map((x) => x[0]), 0, (i) => { mi = i; makeBench(); });
      ctx.controls.classList.add("bottom");
      makeBench();
      preview(Array.from({ length: 30 }, sentence).join(" "));
    },
  },
] });
</script>
