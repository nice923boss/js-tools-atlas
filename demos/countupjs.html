<script src="https://cdn.jsdelivr.net/npm/countup.js@2.10.1/dist/countUp.umd.js"></script>

<script>
// CountUp.js 2.10.1: animated counters with formatting options, custom easing, smart easing for
// large numbers, playback control, IntersectionObserver auto-animate and render plugins.
const { CountUp } = countUp;
const C = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const CN = ["〇", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
const AR = ["٠", "١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩"];
const ODOMETER_URL = "https://cdn.jsdelivr.net/npm/odometer_countup@1.0.4/dist/odometer.min.js";
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmtInt = (n) => Math.round(n).toLocaleString("en-US");

// Robert Penner style easing functions, signature (t, b, c, d) as CountUp expects.
const EASE = {
  inOutCubic: (t, b, c, d) => ((t /= d / 2) < 1 ? (c / 2) * t * t * t + b : (c / 2) * ((t -= 2) * t * t + 2) + b),
  outBounce: (t, b, c, d) => {
    t /= d;
    if (t < 1 / 2.75) return c * (7.5625 * t * t) + b;
    if (t < 2 / 2.75) return c * (7.5625 * (t -= 1.5 / 2.75) * t + 0.75) + b;
    if (t < 2.5 / 2.75) return c * (7.5625 * (t -= 2.25 / 2.75) * t + 0.9375) + b;
    return c * (7.5625 * (t -= 2.625 / 2.75) * t + 0.984375) + b;
  },
  steps10: (t, b, c, d) => b + c * Math.min(1, Math.floor((t / d) * 10) / 10),
};

// Create a counter that is torn down with the scene.
function counter(ctx, el, end, opts) {
  const c = new CountUp(el, end, opts);
  if (c.error) throw new Error(c.error);
  ctx.onCleanup(() => c.onDestroy());
  return c;
}

// Value-over-time plot for recorded counter frames; redraws itself when its box resizes.
function makePlot(ctx, box, cfg) {
  const cv = document.createElement("canvas");
  box.append(cv);
  const g = cv.getContext("2d");
  const mono = css("--mono"), muted = css("--muted");
  let W = 0, H = 0;
  const ro = new ResizeObserver(() => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = box.clientWidth; H = box.clientHeight;
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  });
  ro.observe(box);
  ctx.onCleanup(() => ro.disconnect());
  function draw() {
    if (W < 40 || H < 40) return;
    const { ymin, ymax, yfmt, marks = [] } = cfg;
    const xmax = cfg.xmax();
    const L = 50, R = 10, T = 8, B = 20, pw = W - L - R, ph = H - T - B;
    const X = (t) => L + (t / xmax) * pw;
    const Y = (v) => T + (1 - (v - ymin) / (ymax - ymin)) * ph;
    g.clearRect(0, 0, W, H);
    g.font = `10px ${mono}`;
    g.lineWidth = 1;
    g.textAlign = "right"; g.textBaseline = "middle";
    for (let k = 0; k <= 4; k++) {
      const v = ymin + ((ymax - ymin) * k) / 4, y = Math.round(Y(v)) + 0.5;
      g.strokeStyle = "rgba(255,255,255,0.07)";
      g.beginPath(); g.moveTo(L, y); g.lineTo(W - R, y); g.stroke();
      g.fillStyle = muted; g.fillText(yfmt(v), L - 6, y);
    }
    g.textAlign = "center"; g.textBaseline = "top";
    const step = xmax > 4200 ? 1000 : 500;
    for (let t = 0; t <= xmax; t += step) g.fillText(`${t / 1000}s`, X(t), T + ph + 6);
    g.setLineDash([4, 4]);
    for (const m of marks) {
      const x = Math.round(X(m.t())) + 0.5;
      g.strokeStyle = "rgba(255,255,255,0.28)";
      g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke();
      g.textAlign = "left"; g.fillStyle = muted; g.fillText(m.label, x + 4, T + 2);
    }
    g.setLineDash([]);
    g.save();
    g.beginPath(); g.rect(L, T - 4, pw + 6, ph + 8); g.clip();
    for (const s of cfg.series()) {
      if (!s.pts.length) continue;
      g.strokeStyle = s.color; g.lineWidth = 2; g.lineJoin = "round";
      g.beginPath();
      s.pts.forEach(([t, v], i) => (i ? g.lineTo(X(t), Y(v)) : g.moveTo(X(t), Y(v))));
      g.stroke();
      const [lt, lv] = s.pts[s.pts.length - 1];
      g.fillStyle = s.color;
      g.beginPath(); g.arc(X(lt), Math.min(T + ph + 3, Math.max(T - 3, Y(lv))), 3.5, 0, Math.PI * 2); g.fill();
    }
    g.restore();
  }
  return { draw };
}

const laneRow = (l) =>
  `<div class="panel cu-lane" style="--c:${l.color}"><div class="cu-lt"><b>${l.name}</b><code>${l.code}</code></div><span class="cu-num">0</span></div>`;

// Shared driver for the two easing scenes: rebuild counters, replay them together and record frameVal.
// lab.dur is kept current so plot marks can read it.
function easingLab(ctx, lab) {
  const { lanes, end, min, max, plots } = lab;
  const nums = ctx.$$(".cu-lanes .cu-num");
  const pts = lanes.map(() => []);
  let counters = [], auto = true, recording = false, t0 = 0, tok = 0;
  const views = plots.map(({ box, ...cfg }) =>
    makePlot(ctx, box, { ...cfg, xmax: () => lab.dur * 1000 + 150, series: () => lanes.map((l, i) => ({ color: l.color, pts: pts[i] })) }));
  function build() {
    counters.forEach((c) => c.onDestroy());
    counters = lanes.map((l, i) => new CountUp(nums[i], end, { duration: lab.dur, ...l.o }));
  }
  function play() {
    tok++;
    pts.forEach((a) => (a.length = 0));
    counters.forEach((c) => { c.reset(); c.start(); });
    t0 = performance.now();
    recording = true;
  }
  ctx.raf(() => {
    if (!recording) return;
    const t = performance.now() - t0;
    counters.forEach((c, i) => pts[i].push([t, c.frameVal]));
    views.forEach((v) => v.draw());
    if (t > lab.dur * 1000 + 120) {
      recording = false;
      const mine = tok;
      ctx.timeout(() => { if (auto && mine === tok) play(); }, 1600);
    }
  });
  ctx.onCleanup(() => counters.forEach((c) => c.onDestroy()));
  ctx.slider("時間", { min, max, step: 0.5, value: lab.dur, format: (v) => `${v} 秒` }, (v) => { lab.dur = v; build(); play(); });
  ctx.toggle("自動重播", auto, (v) => { auto = v; if (v && !recording) play(); });
  ctx.button("重播", play, { primary: true });
  build();
  play();
}

  {

    hint: "切換緩動或國字數字會整組重播",
    mount(ctx) {
      const KPIS = [
        { label: "全台人口", end: 23400220, unit: "人", delta: "約略值", pct: 92, c: C[1] },
        { label: "高鐵年旅運量", end: 7512.6, decimals: 1, unit: "萬人次", delta: "▲ 6.8% 較去年", pct: 78, c: C[2] },
        { label: "YouBike 今日租借", end: 128450, unit: "次", delta: "▲ 3.1% 較上週同日", pct: 64, c: C[3] },
        { label: "固網平均下載", end: 312.48, decimals: 2, unit: "Mbps", delta: "▲ 41.2 Mbps 較去年", pct: 70, c: C[4] },
        { label: "再生能源發電占比", end: 11.6, decimals: 1, unit: "%", delta: "▲ 1.7 個百分點", pct: 46, c: C[5] },
        { label: "便利商店家數", end: 13912, unit: "間", delta: "▲ 287 間", pct: 58, c: C[0] },
      ];
      ctx.html(`<div class="cu-dash">
        <div class="panel cu-kpi cu-hero" style="--c:${C[0]}"><span class="cu-label">台北捷運今日累計進站</span>
          <div><span class="cu-num" data-hero>0</span><span class="cu-unit">人次</span></div>
          <span class="cu-live"><i></i>即時更新中・本次 <b data-tick>+0</b> 人次</span><span class="cu-meter"></span></div>
        ${KPIS.map((k) => `<div class="panel cu-kpi" style="--c:${k.c}"><span class="cu-label">${k.label}</span>
          <div><span class="cu-num">0</span><span class="cu-unit">${k.unit}</span></div>
          <span class="cu-delta">${k.delta}</span><span class="cu-meter" data-pct="${k.pct}"></span></div>`).join("")}
      </div>`);
      const dash = ctx.$(".cu-dash");
      const cards = ctx.$$(".cu-kpi:not(.cu-hero)");
      const EASES = [{}, { useEasing: false }, { easingFn: EASE.inOutCubic }];
      let ease = 0, useCN = false, live = 1856320, hero = null, list = [], run = 0;
      const opts = (extra) => ({ duration: 2.4, ...EASES[ease], ...(useCN ? { numerals: CN } : {}), ...extra });
      function play() {
        const mine = ++run;

        list = cells.map((cell) => {
          const extra = mode === 1 ? { decimalPlaces: 2, prefix: "$" } : mode === 2 ? { plugin: digits() } : { useGrouping: false };
          const c = new CountUp(cell, rnd(), {
            duration: 1.2 + Math.random() * 1.6, ...extra,
            onCompleteCallback: () => { finished++; c.update(rnd()); },
          });
          c.start();
          return c;
        });
      }
      ctx.onCleanup(clear);
      ctx.group(MODES, 0, (i) => { mode = i; fill(count); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "計數器", steps: [100, 200, 400, 800, 1600, 3200, 6400, 12800], minFps: 30,
        apply: fill,
        metrics: () => {
          const now = performance.now();
          const rate = ((finished - lastDone) * 1000) / Math.max(1, now - lastT);
          lastDone = finished; lastT = now;
          return { "模式": MODES[mode], "每秒完成": Math.round(rate) };
        },
        note: "每個 CountUp 實例各自排一個 requestAnimationFrame，每格都重新格式化字串再寫入 DOM，成本大致隨數量線性增加。千分位＋小數多了分組與小數處理；外掛逐位渲染只改有變動的字元，但元素數量變成好幾倍。被容器裁掉、看不見的格子仍然每格寫入。",
      });
      fill(100);
    },
  },
] });
</script>
