<style>
  .cj-board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px);
    display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) 232px; grid-template-rows: minmax(0, 1fr); }
  .cj-crop { position: relative; min-width: 0; min-height: 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: #08090b; }
  .cj-crop cropper-canvas { width: 100%; height: 100%; }
  .cj-side { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 10px; }
  .cj-side h3 { margin: 0; font: 500 12px/1.3 var(--font); color: var(--muted); letter-spacing: .03em; }
  .cj-side h3 code { font: 500 11px/1 var(--mono); color: var(--accent); margin-left: 4px; }
  .cj-kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 10px; font: 12px/1.45 var(--font); }
  .cj-kv span { color: var(--muted); white-space: nowrap; }
  .cj-kv b { font: 500 12px/1.45 var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cj-kv b.cj-zh { font-family: var(--font); }
  .cj-kv b.cj-hot { color: var(--accent); }
  .cj-thumb { flex: 1; min-height: 70px; display: grid; place-items: center; border-radius: 8px; overflow: hidden;
    background: repeating-conic-gradient(#23272e 0 25%, #191c21 0 50%) 0 0 / 16px 16px; }
  .cj-thumb > * { max-width: 100%; max-height: 100%; display: block; }
  .cj-mat { font: 11.5px/1.5 var(--mono); color: var(--c2); word-break: break-all; }
  .cj-dl { text-decoration: none; text-align: center; }
  .cj-dl[aria-disabled="true"] { opacity: .45; pointer-events: none; }
  .cj-note { font: 11.5px/1.55 var(--font); color: var(--muted); margin: 0; }
  .cj-note b { color: var(--fg); font-weight: 500; }

  /* 1. avatar */
  .cj-prev cropper-viewer { width: 100%; border-radius: 8px; overflow: hidden; background: #08090b; border: 1px solid var(--line); }
  .cj-avatars { display: flex; align-items: flex-end; gap: 12px; }
  .cj-avatars cropper-viewer { border-radius: 50%; overflow: hidden; background: #08090b; box-shadow: 0 0 0 2px var(--accent), 0 6px 18px rgba(0,0,0,.4); }
  .cj-av76 { width: 76px; height: 76px; } .cj-av48 { width: 48px; height: 48px; } .cj-av30 { width: 30px; height: 30px; }
  .cj-outrow { display: flex; align-items: center; gap: 10px; }
  .cj-round { width: 56px; height: 56px; border-radius: 50%; background: repeating-conic-gradient(#23272e 0 25%, #191c21 0 50%) 0 0 / 10px 10px; }
  .cj-outrow .btn { flex: 1; }

  /* 6. events */
  .cj-count { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .cj-count div { background: var(--bg-2); border-radius: 6px; padding: 4px 6px; }
  .cj-count small { display: block; font: 10.5px/1.3 var(--mono); color: var(--muted); }
  .cj-count b { font: 600 14px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
  .cj-log { flex: 1; min-height: 0; overflow: hidden; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; }
  .cj-log li { font: 11px/1.45 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cj-log li b { color: var(--c2); font-weight: 500; }
  .cj-log li.cj-block b { color: var(--c3); }
  .cj-log li.cj-block { color: var(--fg); }

  /* 7. multiple selections */
  .cj-tiles { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; align-content: start; overflow: hidden; }
  .cj-tile { position: relative; border-radius: 6px; overflow: hidden; background: #08090b; aspect-ratio: 1; display: grid; place-items: center; }
  .cj-tile canvas { max-width: 100%; max-height: 100%; }
  .cj-tile span { position: absolute; left: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px; background: rgba(0,0,0,.65); font: 10.5px/1.4 var(--mono); }

  /* 8. stress */
  .cj-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); background: #08090b; }
  .cj-stress cropper-canvas { width: 100%; height: 100%; }
  .cj-tag { position: absolute; left: 10px; bottom: 10px; z-index: 5; max-width: calc(100% - 20px); padding: 5px 9px; border-radius: 8px; pointer-events: none;
    background: rgba(8, 9, 11, .78); font: 11.5px/1.5 var(--font); color: var(--muted); }
  .cj-tag b { font: 500 11.5px/1.5 var(--mono); color: var(--accent); }
  @media (max-width: 760px) {
    .cj-board { grid-template-columns: minmax(0, 1fr) 196px; }
    .cj-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 8px; }
  }
  @media (max-height: 480px) { .cj-tall { display: none !important; } }
  @media (max-width: 560px) {
    .cj-board { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .cj-side { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 10px; max-height: 150px; padding: 8px; }
    .cj-side h3, .cj-hide-n { display: none !important; }
    .cj-side .cj-kv { flex: 1 1 100%; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); }
    .cj-avatars { gap: 8px; }
    .cj-av76 { width: 52px; height: 52px; } .cj-av48 { width: 36px; height: 36px; } .cj-av30 { width: 24px; height: 24px; }
    .cj-outrow { flex: 1; }
    .cj-round { width: 44px; height: 44px; }
    .cj-log { flex: 1 1 100%; max-height: 84px; }
    .cj-side > .cj-thumb { flex: 0 0 84px; height: 84px; min-height: 0; }
    .cj-side > .cj-thumb + .cj-kv { flex: 1 1 140px; grid-template-columns: auto minmax(0, 1fr); }
    .cj-tiles { flex: 1 1 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); max-height: 76px; }
    .cj-side > .btn, .cj-side > a.btn { flex: 1 1 100%; padding: 6px 10px; }
  }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@2.2.0/dist/cropper.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Cropper.js v2 showcase: web-component cropper from avatar cropping to an export-size benchmark.
const { h, fmtMs } = Showcase;
const PHOTO = (n) => `_shared/img/photo-${n}.jpg`;
const RESIZE = ["n", "e", "s", "w", "ne", "nw", "se", "sw"];
const r0 = (v) => Math.round(v);
const fmtBytes = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(2)} MB` : `${(n / 1024).toFixed(1)} KB`);

// Build a cropper template string; every element is a real Cropper.js v2 custom element.
function template({ id = "", ratio = "", coverage = 0.6, canvasAction = "move", selections = 1, multiple = false, grid = 3, fit = "contain", minFit = "" } = {}) {
  const sel = (i) =>
    `<cropper-selection${i === 0 && id ? ` id="${id}"` : ""}${ratio ? ` aspect-ratio="${ratio}"` : ""} initial-coverage="${coverage}" movable resizable keyboard outlined${multiple ? " multiple" : ""} theme-color="#f7df1e">` +
    `<cropper-grid role="grid" rows="${grid}" columns="${grid}" bordered covered theme-color="rgba(247,223,30,0.35)"></cropper-grid>` +
    `<cropper-crosshair centered theme-color="rgba(255,255,255,0.45)"></cropper-crosshair>` +
    `<cropper-handle action="move" theme-color="rgba(255,255,255,0.12)"></cropper-handle>` +
    RESIZE.map((d) => `<cropper-handle action="${d}-resize" theme-color="#f7df1e"></cropper-handle>`).join("") +
    `</cropper-selection>`;
  return `<cropper-canvas background>` +
    `<cropper-image rotatable scalable skewable translatable initial-fit="${fit}"${minFit ? ` min-fit="${minFit}"` : ""}></cropper-image>` +
    `<cropper-shade theme-color="rgba(0,0,0,0.6)"></cropper-shade>` +
    `<cropper-handle action="${canvasAction}" plain></cropper-handle>` +
    Array.from({ length: selections }, (_, i) => sel(i)).join("") + `</cropper-canvas>`;
}

// Mount a cropper into host; destroyed with the scene.
function mountCropper(ctx, host, src, opts) {
  const img = h("img", { src, alt: "待裁切的照片" });
  host.append(img);
  const cropper = new Cropper.default(img, { template: template(opts) });
  ctx.onCleanup(() => cropper.destroy());
  return { cropper, canvas: cropper.getCropperCanvas(), image: cropper.getCropperImage(), selection: cropper.getCropperSelection() };
}
async function ready(ctx, c) {
  await c.image.$ready();
  await ctx.frame(2);
}
// Swap the source image and re-fit it once the new pixels are loaded.
function setSource(c, url, fit = "contain") {
  return new Promise((resolve, reject) => {
    const el = c.image.$image;
    const ok = () => { el.removeEventListener("error", bad); c.image.$resetTransform(); c.image.$center(fit); resolve(); };
    const bad = () => { el.removeEventListener("load", ok); reject(new Error("圖片載入失敗")); };
    el.addEventListener("load", ok, { once: true });
    el.addEventListener("error", bad, { once: true });
    c.image.src = url;
  });
}
// Image rect relative to the cropper canvas (bounding box when rotated).
function imageRect(c) {
  const ir = c.image.getBoundingClientRect(), cr = c.canvas.getBoundingClientRect();
  return { x: ir.x - cr.x, y: ir.y - cr.y, width: ir.width, height: ir.height };
}
// Place a selection using fractions of the image.
function placeFrac(c, sel, fx, fy, fw, fh) {
  const r = imageRect(c);
  sel.$change(r.x + fx * r.width, r.y + fy * r.height, fw * r.width, fh * r.height);
}
// Center a selection with the given ratio inside the canvas.
function fitSelection(c, ratio, cover = 0.72) {
  const cw = c.canvas.offsetWidth, ch = c.canvas.offsetHeight;
  let w = c.selection.width, hh = c.selection.height;
  if (ratio > 0) { w = Math.min(cw * cover, ch * cover * ratio); hh = w / ratio; }
  c.selection.$change((cw - w) / 2, (ch - hh) / 2, w, hh);
}
const imgScale = (c) => { const [a, b] = c.image.$getTransform(); return Math.hypot(a, b); };
const toBlob = (canvas, type, q) => new Promise((resolve, reject) =>
  canvas.toBlob((b) => (b ? resolve(b) : reject(new Error(`無法編碼 ${type}`))), type, q));

// One revocable object URL slot per scene.
function blobSlot(ctx) {
  let url = null;
  ctx.onCleanup(() => url && URL.revokeObjectURL(url));
  return (blob) => { if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(blob); return url; };
}
// "Choose your own image" button: local File -> object URL, never uploaded.
function filePicker(ctx, onUrl) {
  const input = h("input", { type: "file", accept: "image/*", hidden: true });
  ctx.el.append(input);
  let url = null;
  ctx.on(input, "change", () => {
    const f = input.files[0];
    if (!f) return;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(f);
    input.value = "";
    onUrl(url, f.name);
  });
  ctx.onCleanup(() => url && URL.revokeObjectURL(url));
  return ctx.button("選擇自己的圖片", () => input.click(), { title: "從本機選圖，不會上傳" });
}
function debounced(ctx, fn, ms) {
  let t = 0;
  ctx.onCleanup(() => clearTimeout(t));
  return () => {
    clearTimeout(t);
    t = setTimeout(() => { if (ctx.active) Promise.resolve(fn()).catch((e) => ctx.active && console.error(e)); }, ms);
  };
}
const side = (inner) => `<div class="cj-board"><div class="cj-crop"></div><div class="panel cj-side">${inner}</div></div>`;
const kv = (pairs) => `<div class="cj-kv">${pairs.map(([k, label, cls = ""]) => `<span>${label}</span><b data-k="${k}" class="${cls}">…</b>`).join("")}</div>`;
const setKv = (ctx, vals) => { for (const [k, v] of Object.entries(vals)) { const el = ctx.$(`[data-k="${k}"]`); if (el) el.textContent = v; } };

Showcase.run({ scenes: [
  {
    id: "avatar", title: "大頭貼裁切",
    api: "new Cropper(img, { template })・<cropper-viewer>・selection.$toCanvas({ width, beforeDraw })",
    desc: "v2 把裁切器拆成 Web Components：框選、即時預覽與三種頭像尺寸同步更新；輸出時在 beforeDraw 先設定圓形剪裁，得到透明背景的圓形 PNG。",
    hint: "拖曳裁切框移動或拉角縮放・滾輪縮放照片・換照片會自動對準臉部",
    mount(ctx) {
      ctx.html(side(`<h3 class="cj-tall">即時預覽</h3><div class="cj-prev cj-tall"></div>
        <h3>頭像尺寸</h3><div class="cj-avatars"></div>
        ${kv([["sel", "選取範圍"], ["out", "輸出"]])}
        <div class="cj-outrow"><img class="cj-round" alt="圓形頭像輸出"><a class="btn primary cj-dl" download="avatar.png" aria-disabled="true">下載 PNG</a></div>`));
      // [photo, focusX, focusY, focusSize(relative to height)]
      const PH = [[4, 0.5, 0.3, 0.5], [7, 0.48, 0.5, 0.78], [8, 0.83, 0.4, 0.5]];
      let focus = PH[0];
      const c = mountCropper(ctx, ctx.$(".cj-crop"), PHOTO(4), { id: "cj-av", ratio: 1 });
      // Viewers resolve their selection selector on connect, so create them after the cropper exists.
      ctx.$(".cj-prev").append(h("cropper-viewer", { selection: "#cj-av", resize: "vertical" }));
      ctx.$(".cj-avatars").append(...[76, 48, 30].map((s) => h("cropper-viewer", { selection: "#cj-av", resize: "none", class: `cj-av${s}` })));
      const slot = blobSlot(ctx);
      const out = ctx.$(".cj-round"), dl = ctx.$(".cj-dl");
      const exportRound = async () => {
        const size = 512;
        const canvas = await c.selection.$toCanvas({
          width: size,
          beforeDraw(g, cv) { g.beginPath(); g.arc(cv.width / 2, cv.height / 2, cv.width / 2, 0, Math.PI * 2); g.clip(); },
        });
        const blob = await toBlob(canvas, "image/png");
        if (!ctx.active) return;
        out.src = dl.href = slot(blob);
        dl.removeAttribute("aria-disabled");
        setKv(ctx, { out: `${canvas.width}² PNG・${fmtBytes(blob.size)}` });
      };
      const refresh = debounced(ctx, exportRound, 220);
      const focusSubject = () => {
        const [, fx, fy, fs] = focus;
        const cw = c.canvas.offsetWidth, ch = c.canvas.offsetHeight, r = imageRect(c);
        const s = Math.min(fs * r.height, cw * 0.9, ch * 0.9);
        const clamp = (v, max) => Math.max(0, Math.min(v, max));
        c.selection.$change(clamp(r.x + fx * r.width - s / 2, cw - s), clamp(r.y + fy * r.height - s / 2, ch - s), s, s);
      };
      ctx.on(c.selection, "change", (e) => { setKv(ctx, { sel: `${r0(e.detail.width)} × ${r0(e.detail.height)}` }); refresh(); });
      ctx.on(c.image, "transform", refresh);
      ctx.group(["巴哥犬", "母獅", "海象"], 0, async (i) => {
        focus = PH[i];
        await setSource(c, PHOTO(focus[0]), "cover");
        await ctx.frame(1);
        focusSubject();
      });
      filePicker(ctx, async (url) => {
        focus = [0, 0.5, 0.5, 0.7];
        await setSource(c, url, "contain");
        await ctx.frame(1);
        focusSubject();
      });
      ctx.button("輸出圓形 PNG", exportRound, { primary: true });
      ctx.onResize(debounced(ctx, async () => { c.image.$resetTransform(); c.image.$center("cover"); await ctx.frame(1); focusSubject(); }, 150));
      ready(ctx, c).then(() => { c.image.$resetTransform(); c.image.$center("cover"); return ctx.frame(1); }).then(focusSubject);
    },
  },
  {
    id: "ratio", title: "比例與構圖格線",
    api: "selection.aspectRatio = 16 / 9・<cropper-grid rows columns>・shade.hidden",
    desc: "鎖定比例時拉任何一角都維持比例，設成 NaN 就是自由裁切；格線元件的列數與欄數可以換成三分法或 4×4，遮罩也能隱藏。右側縮圖是即時的裁切輸出。",
    hint: "切換比例後拉動角落把手，看右側「實際比例」是否維持",
    mount(ctx) {
      ctx.html(side(`<h3>選取框讀數</h3>${kv([["x", "X"], ["y", "Y"], ["w", "寬"], ["h", "高"], ["real", "實際比例", "cj-hot"], ["lock", "鎖定", "cj-zh"]])}
        <h3 class="cj-hide-n">即時輸出 <code>$toCanvas</code></h3><div class="cj-thumb cj-hide-n"></div>`));
      const RATIOS = [["自由", NaN], ["1:1", 1], ["4:3", 4 / 3], ["3:2", 3 / 2], ["16:9", 16 / 9], ["9:16", 9 / 16]];
      const c = mountCropper(ctx, ctx.$(".cj-crop"), PHOTO(3), { ratio: 16 / 9, coverage: 0.7 });
      const thumb = ctx.$(".cj-thumb");
      const paint = debounced(ctx, async () => {
        const cv = await c.selection.$toCanvas({ width: 360 });
        if (ctx.active) thumb.replaceChildren(cv);
      }, 60);
      const read = () => {
        const s = c.selection, ar = s.aspectRatio;
        setKv(ctx, { x: r0(s.x), y: r0(s.y), w: r0(s.width), h: r0(s.height), real: (s.width / s.height).toFixed(3),
          lock: ar > 0 ? `${RATIOS.find(([, v]) => Math.abs(v - ar) < 1e-6)?.[0] ?? ar.toFixed(2)}（${ar.toFixed(3)}）` : "自由（NaN）" });
        paint();
      };
      ctx.on(c.selection, "change", () => ctx.timeout(read, 0));
      ctx.group(RATIOS.map(([l]) => l), 4, (i) => {
        c.selection.aspectRatio = RATIOS[i][1];
        fitSelection(c, RATIOS[i][1]);
        read();
      });
      const grid = ctx.$("cropper-grid");
      ctx.group(["三分法", "4×4", "無格線"], 0, (i) => {
        grid.hidden = i === 2;
        if (i < 2) grid.rows = grid.columns = i === 0 ? 3 : 4;
      });
      ctx.toggle("遮罩", true, (v) => { ctx.$("cropper-shade").hidden = !v; });
      ready(ctx, c).then(() => { fitSelection(c, 16 / 9); read(); });
    },
  },
  {
    id: "transform", title: "旋轉縮放翻轉",
    api: "image.$rotate('90deg')・image.$scale(-1, 1)・image.$skew('8deg')・image.$getTransform()",
    desc: "影像本身是可變換的元件：旋轉、縮放、翻轉、傾斜都會累積到一個 2D 變換矩陣，transform 事件即時回報；輸出時依同一個矩陣重畫，所以翻轉與傾斜也會反映在結果裡。",
    hint: "按鈕是相對變換（可連按累積）・拖曳滑桿微調角度與縮放・滾輪也能縮放",
    mount(ctx) {
      ctx.html(side(`<h3 class="cj-hide-n">變換矩陣 <code>$getTransform()</code></h3><div class="cj-mat cj-hide-n">…</div>
        ${kv([["scale", "縮放"], ["rot", "旋轉"], ["flip", "翻轉", "cj-zh"], ["skew", "傾斜"]])}
        <h3 class="cj-hide-n cj-tall">即時輸出</h3><div class="cj-thumb cj-hide-n cj-tall"></div>`));
      const c = mountCropper(ctx, ctx.$(".cj-crop"), PHOTO(7), { ratio: 4 / 3, coverage: 0.62 });
      const thumb = ctx.$(".cj-thumb");
      let base = 1, lastRot = 0, lastZoom = 1;
      const paint = debounced(ctx, async () => {
        const cv = await c.selection.$toCanvas({ width: 360 });
        if (ctx.active) thumb.replaceChildren(cv);
      }, 60);
      const show = (m) => {
        const [a, b, cc, d, e, f] = m;
        const det = a * d - b * cc;
        ctx.$(".cj-mat").textContent = `matrix(${[a, b, cc, d].map((v) => v.toFixed(3)).join(", ")}, ${r0(e)}, ${r0(f)})`;
        const sx = Math.hypot(a, b);
        const shear = Math.atan2(a * cc + b * d, det) * 180 / Math.PI;
        setKv(ctx, { scale: `${(sx / base).toFixed(2)}×`, rot: `${(Math.atan2(b, a) * 180 / Math.PI).toFixed(1)}°`,
          flip: det < 0 ? "是（鏡像）" : "否", skew: `${shear.toFixed(1)}°` });
        paint();
      };
      ctx.on(c.image, "transform", (e) => show(e.detail.matrix));
      ctx.button("左轉 90°", () => c.image.$rotate("-90deg"));
      ctx.button("右轉 90°", () => c.image.$rotate("90deg"));
      ctx.button("水平翻轉", () => c.image.$scale(-1, 1));
      ctx.button("垂直翻轉", () => c.image.$scale(1, -1));
      ctx.button("傾斜 8°", () => c.image.$skew("8deg", 0));
      const rot = ctx.slider("微調角度", { min: -45, max: 45, step: 1, value: 0, format: (v) => `${v}°` }, (v) => {
        c.image.$rotate(`${v - lastRot}deg`); lastRot = v;
      });
      const zoom = ctx.slider("縮放", { min: 0.5, max: 3, step: 0.05, value: 1, format: (v) => `${v.toFixed(2)}×` }, (v) => {
        c.image.$scale(v / lastZoom); lastZoom = v;
      });
      const reset = () => {
        lastRot = 0; lastZoom = 1;
        rot.value = 0; zoom.value = 1;
        rot.dispatchEvent(new Event("input")); zoom.dispatchEvent(new Event("input"));
        c.image.$resetTransform(); c.image.$center("contain");
        base = imgScale(c);
        show(c.image.$getTransform());
      };
      ctx.button("重設", reset);
      filePicker(ctx, async (url) => { await setSource(c, url); reset(); fitSelection(c, 4 / 3, 0.62); });
      ready(ctx, c).then(() => { base = imgScale(c); fitSelection(c, 4 / 3, 0.62); c.image.$rotate("-6deg"); lastRot = -6; rot.value = -6; rot.dispatchEvent(new Event("input")); });
    },
  },
  {
    id: "export", title: "輸出尺寸與格式",
    api: "selection.$toCanvas({ width })・canvas.$toCanvas()・HTMLCanvasElement.toBlob(type, quality)",
    desc: "v2 的 $toCanvas 取代 v1 的 getCroppedCanvas：指定寬度就依比例放大縮小，不指定就是螢幕上的大小；也可以輸出整個畫布。再用 toBlob 比較 PNG、JPEG、WebP 的檔案大小與耗時。",
    hint: "改尺寸、格式或品質會自動重新輸出・右側按鈕下載實際檔案",
    mount(ctx) {
      ctx.html(side(`<div class="cj-thumb"></div>
        ${kv([["size", "輸出尺寸"], ["type", "實際格式"], ["bytes", "檔案大小", "cj-hot"], ["draw", "繪製耗時"], ["enc", "編碼耗時"]])}
        <a class="btn primary cj-dl" download="crop.png" aria-disabled="true">下載檔案</a>`));
      const c = mountCropper(ctx, ctx.$(".cj-crop"), PHOTO(1), { coverage: 0.66 });
      const slot = blobSlot(ctx);
      const thumb = ctx.$(".cj-thumb"), dl = ctx.$(".cj-dl");
      const TYPES = [["PNG", "image/png"], ["JPEG", "image/jpeg"], ["WebP", "image/webp"]];
      let sizeMode = "native", type = 1, quality = 0.85, whole = false;
      const targetWidth = () => {
        const w = whole ? c.canvas.offsetWidth : c.selection.width;
        if (sizeMode === "screen") return undefined;
        if (sizeMode === "native") return r0(w / imgScale(c));
        return +sizeMode;
      };
      const run = async () => {
        const width = targetWidth();
        const t0 = performance.now();
        const cv = whole ? await c.canvas.$toCanvas(width ? { width } : undefined) : await c.selection.$toCanvas(width ? { width } : undefined);
        const t1 = performance.now();
        const blob = await toBlob(cv, TYPES[type][1], quality);
        const t2 = performance.now();
        if (!ctx.active) return;
        const url = slot(blob);
        thumb.replaceChildren(h("img", { src: url, alt: "輸出結果" }));
        dl.href = url;
        dl.download = `crop.${blob.type.split("/")[1] || "bin"}`;
        dl.removeAttribute("aria-disabled");
        setKv(ctx, { size: `${cv.width} × ${cv.height}`, type: blob.type, bytes: fmtBytes(blob.size), draw: fmtMs(t1 - t0), enc: fmtMs(t2 - t1) });
      };
      const refresh = debounced(ctx, run, 200);
      ctx.select("尺寸", [
        { value: "native", label: "原始解析度" }, { value: "screen", label: "螢幕大小" },
        { value: "1920", label: "寬 1920" }, { value: "512", label: "寬 512" }, { value: "128", label: "寬 128" },
      ], sizeMode, (v) => { sizeMode = v; refresh(); });
      ctx.group(TYPES.map(([l]) => l), type, (i) => { type = i; refresh(); });
      ctx.slider("品質", { min: 0.1, max: 1, step: 0.05, value: quality, format: (v) => v.toFixed(2) }, (v) => { quality = v; refresh(); });
      ctx.group(["選取框", "整個畫布"], 0, (i) => { whole = i === 1; refresh(); });
      filePicker(ctx, async (url) => { await setSource(c, url); fitSelection(c, NaN); refresh(); });
      ctx.on(c.selection, "change", refresh);
      ctx.on(c.image, "transform", refresh);
      ready(ctx, c).then(() => { placeFrac(c, c.selection, 0.12, 0.08, 0.6, 0.62); refresh(); });
    },
  },
  {
    id: "limits", title: "限制範圍與拖曳模式",
    api: "selection change → event.preventDefault()・image min-fit・<cropper-handle action>",
    desc: "v2 沒有 viewMode 與 dragMode 選項，改成可組合的機制：攔下 change 事件把選框限制在圖片內、用 min-fit 限制圖片最小縮放，畫布上的 handle 換 action 就是換拖曳模式。",
    hint: "把選框拖向圖片外會被擋下・切換拖曳模式後在選框外拖曳・方向鍵可微調選框",
    mount(ctx) {
      ctx.html(side(`${kv([["mode", "拖曳模式", "cj-zh"], ["fit", "min-fit"], ["blocked", "攔下越界", "cj-hot"], ["img", "圖片範圍"]])}
        <h3 class="cj-hide-n">對照 v1 viewMode</h3>
        <p class="cj-note cj-hide-n"><b>0</b> 不限制<br><b>1</b> 選框不出圖片<br><b>2</b> 加上 min-fit = contain<br><b>3</b> 加上 min-fit = cover</p>`));
      const c = mountCropper(ctx, ctx.$(".cj-crop"), PHOTO(2), { coverage: 0.5 });
      const handle = ctx.$("cropper-canvas > cropper-handle");
      const MODES = [["移動", "move"], ["新框", "select"], ["縮放", "scale"], ["旋轉", "rotate"], ["停用", "none"]];
      let limit = true, blocked = 0, busy = false;
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));
      const read = () => {
        const r = imageRect(c);
        setKv(ctx, { mode: `${MODES.find(([, a]) => a === handle.action)?.[0]}（${handle.action}）`, fit: c.image.minFit || "未設定",
          blocked: `${blocked} 次`, img: `${r0(r.x)}, ${r0(r.y)}, ${r0(r.width)}×${r0(r.height)}` });
      };
      const inside = (d, r) => d.x >= r.x - 0.5 && d.y >= r.y - 0.5 && d.x + d.width <= r.x + r.width + 0.5 && d.y + d.height <= r.y + r.height + 0.5;
      ctx.on(c.selection, "change", (e) => {
        if (!limit || busy) return;
        const d = e.detail, r = imageRect(c), s = c.selection;
        if (!d.width || inside(d, r)) return;
        e.preventDefault();
        blocked++;
        // A pure move gets clamped to the edge; a resize past the edge is simply rejected.
        if (Math.abs(d.width - s.width) < 0.5 && Math.abs(d.height - s.height) < 0.5) {
          busy = true;
          s.$change(clamp(d.x, r.x, r.x + r.width - d.width), clamp(d.y, r.y, r.y + r.height - d.height));
          busy = false;
        }
        read();
      });
      // After the image moves, pull the selection back inside it.
      const reclamp = () => {
        if (!limit) return read();
        const r = imageRect(c), s = c.selection;
        let x1 = Math.max(s.x, r.x), y1 = Math.max(s.y, r.y), x2 = Math.min(s.x + s.width, r.x + r.width), y2 = Math.min(s.y + s.height, r.y + r.height);
        if (x2 - x1 < 24 || y2 - y1 < 24) { x1 = r.x + r.width * 0.25; y1 = r.y + r.height * 0.25; x2 = x1 + r.width * 0.5; y2 = y1 + r.height * 0.5; }
        if (x1 !== s.x || y1 !== s.y || x2 - x1 !== s.width || y2 - y1 !== s.height) { busy = true; s.$change(x1, y1, x2 - x1, y2 - y1); busy = false; }
        read();
      };
      const later = debounced(ctx, reclamp, 30);
      ctx.on(c.image, "transform", later);
      ctx.group(MODES.map(([l]) => l), 0, (i) => { handle.action = MODES[i][1]; read(); });
      ctx.select("min-fit", [{ value: "", label: "不限制" }, { value: "contain", label: "contain" }, { value: "cover", label: "cover" }], "", (v) => {
        c.image.minFit = v; ctx.timeout(reclamp, 60);
      });
      ctx.toggle("選框不出圖片", limit, (v) => { limit = v; reclamp(); });
      ctx.toggle("鍵盤微調", true, (v) => { c.selection.keyboard = v; });
      ready(ctx, c).then(() => { c.image.$zoom(-0.15); placeFrac(c, c.selection, 0.55, 0.3, 0.4, 0.5); ctx.timeout(reclamp, 60); });
    },
  },
  {
    id: "events", title: "事件與攔截",
    api: "canvas: actionstart / action / actionend・selection: change・image: transform",
    desc: "所有互動都經過可取消的 CustomEvent：畫布發出 action 系列，選框發出 change，影像發出 transform。在監聽器裡呼叫 preventDefault 就能擋下這一步，用來做最小尺寸或縮放上限。",
    hint: "拖曳、縮放、滾輪看事件流・開關攔截規則後試著把選框縮到很小或把照片放很大",
    mount(ctx) {
      ctx.html(side(`<div class="cj-count cj-hide-n">${["actionstart", "action", "actionend", "change", "transform", "攔下"].map((k) => `<div><small>${k}</small><b data-c="${k}">0</b></div>`).join("")}</div>
        <h3>事件紀錄（最新在上）</h3><ul class="cj-log"></ul>`));
      const c = mountCropper(ctx, ctx.$(".cj-crop"), PHOTO(5), { coverage: 0.55 });
      const log = ctx.$(".cj-log");
      const counts = {};
      let minSize = true, maxZoom = true, base = 1, lastAction = "", lastAt = 0;
      const bump = (k) => { counts[k] = (counts[k] || 0) + 1; const el = ctx.$(`[data-c="${k}"]`); if (el) el.textContent = counts[k]; };
      const push = (name, text, blocked = false) => {
        const li = h("li", { class: blocked ? "cj-block" : "" }, h("b", { text: name }), ` ${text}`);
        log.prepend(li);
        while (log.children.length > 14) log.lastChild.remove();
      };
      ctx.on(c.canvas, "actionstart", (e) => { bump("actionstart"); push("actionstart", e.detail.action); });
      ctx.on(c.canvas, "action", (e) => {
        bump("action");
        const now = performance.now(), d = e.detail;
        if (d.action === lastAction && now - lastAt < 300) return;
        lastAction = d.action; lastAt = now;
        push("action", d.action === "scale" ? `scale ${d.scale > 0 ? "+" : ""}${d.scale.toFixed(2)}` : d.action);
      });
      ctx.on(c.canvas, "actionend", (e) => { bump("actionend"); push("actionend", e.detail.action); });
      ctx.on(c.selection, "change", (e) => {
        const d = e.detail;
        if (minSize && (d.width < 80 || d.height < 80)) {
          e.preventDefault(); bump("攔下");
          return push("change", `${r0(d.width)}×${r0(d.height)} 小於 80，已攔下`, true);
        }
        bump("change");
        push("change", `x ${r0(d.x)} y ${r0(d.y)} ${r0(d.width)}×${r0(d.height)}`);
      });
      ctx.on(c.image, "transform", (e) => {
        const [a, b] = e.detail.matrix, s = Math.hypot(a, b) / base;
        if (maxZoom && s > 3) { e.preventDefault(); bump("攔下"); return push("transform", `縮放 ${s.toFixed(2)}× 超過 3×，已攔下`, true); }
        bump("transform");
        push("transform", `縮放 ${s.toFixed(2)}×・旋轉 ${(Math.atan2(b, a) * 180 / Math.PI).toFixed(0)}°`);
      });
      ctx.toggle("選框最小 80 px", minSize, (v) => { minSize = v; });
      ctx.toggle("縮放上限 3 倍", maxZoom, (v) => { maxZoom = v; });
      ctx.button("清除紀錄", () => { log.replaceChildren(); for (const k of Object.keys(counts)) { counts[k] = 0; const el = ctx.$(`[data-c="${k}"]`); if (el) el.textContent = 0; } });
      ready(ctx, c).then(async () => {
        base = imgScale(c);
        // Programmatic calls fire the same events as pointer input.
        c.image.$zoom(0.2); await ctx.sleep(120);
        c.selection.$move(30, 10); await ctx.sleep(120);
        c.selection.$change(c.selection.x, c.selection.y, 50, 50);
        await ctx.sleep(120);
        c.image.$rotate("4deg");
      });
    },
  },
  {
    id: "multi", title: "多選區批次輸出",
    api: "<cropper-selection multiple>・cropper.getCropperSelections()・<cropper-handle action=\"select\">",
    desc: "選框加上 multiple，並把畫布 handle 設成 select，就能在同一張圖上拉出多個選區；每個選區各自呼叫 $toCanvas，最後合成一張可下載的拼貼。",
    hint: "在選框外拖曳新增選區・點選區切換作用中・按 Delete 刪除作用中的選區",
    mount(ctx) {
      ctx.html(side(`<h3>各選區輸出</h3><div class="cj-tiles"></div><a class="btn primary cj-dl" download="contact-sheet.png" aria-disabled="true">下載拼貼 PNG</a>`));
      const c = mountCropper(ctx, ctx.$(".cj-crop"), PHOTO(8), { selections: 3, multiple: true, canvasAction: "select", coverage: 0.3 });
      const tiles = ctx.$(".cj-tiles"), dl = ctx.$(".cj-dl");
      const slot = blobSlot(ctx);
      const BOXES = [[0.03, 0.42, 0.2, 0.36], [0.74, 0.2, 0.17, 0.34], [0.3, 0.16, 0.68, 0.64]];
      const arrange = () => [...c.cropper.getCropperSelections()].forEach((s, i) => BOXES[i] && placeFrac(c, s, ...BOXES[i]));
      const update = async () => {
        const sels = [...c.cropper.getCropperSelections()].filter((s) => !s.hidden && s.width > 2 && s.height > 2);
        const canvases = await Promise.all(sels.map((s) => s.$toCanvas({ height: 240 })));
        if (!ctx.active) return;
        tiles.replaceChildren(...canvases.map((cv, i) => h("div", { class: "cj-tile" }, cv, h("span", { text: `#${i + 1} ${r0(sels[i].width)}×${r0(sels[i].height)}` }))));
        if (!canvases.length) return dl.setAttribute("aria-disabled", "true");
        const gap = 12, W = canvases.reduce((s, cv) => s + cv.width, 0) + gap * (canvases.length + 1), H = 240 + gap * 2;
        const sheet = h("canvas", { width: W, height: H });
        const g = sheet.getContext("2d");
        g.fillStyle = "#101216"; g.fillRect(0, 0, W, H);
        let x = gap;
        for (const cv of canvases) { g.drawImage(cv, x, gap); x += cv.width + gap; }
        const blob = await toBlob(sheet, "image/png");
        if (!ctx.active) return;
        dl.href = slot(blob);
        dl.removeAttribute("aria-disabled");
        dl.textContent = `下載拼貼 PNG（${W}×${H}）`;
      };
      const refresh = debounced(ctx, update, 200);
      ctx.on(c.canvas, "change", refresh);
      ctx.button("重新排列", async () => {
        const sels = [...c.cropper.getCropperSelections()];
        sels.slice(3).forEach((s) => s.remove());
        sels.slice(0, 3).forEach((s) => { s.hidden = false; });
        await ctx.frame(1); arrange(); refresh();
      });
      ctx.button("輸出拼貼", update, { primary: true });
      ready(ctx, c).then(() => { arrange(); refresh(); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "await selection.$toCanvas({ width: n }) → canvas.toBlob('image/jpeg', 0.9)",
    desc: "固定 1:1 選框，逐級加大輸出邊長（n × n 像素），量從裁切到產生 JPEG 檔的總耗時；可切換來源為 4096 × 2048 的全景圖比較。",
    hint: "按「開始測試」・切換來源圖後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="cj-stress"><div class="cj-tag">最近一次：<b>尚未測試</b></div></div>`);
      const c = mountCropper(ctx, ctx.$(".cj-stress"), PHOTO(3), { ratio: 1, coverage: 0.6 });
      const tag = ctx.$(".cj-tag");
      let src = "1200 × 800";
      ctx.controls.classList.add("bottom");
      ctx.group(["照片 1200×800", "全景 4096×2048"], 0, async (i) => {
        await setSource(c, i ? "_shared/img/panorama.jpg" : PHOTO(3));
        src = i ? "4096 × 2048" : "1200 × 800";
        await ctx.frame(1);
        fitSelection(c, 1, 0.6);
      });
      ready(ctx, c).then(() => fitSelection(c, 1, 0.6));
      ctx.bench({
        label: "輸出邊長", unit: "px", sizes: [512, 1024, 2048, 3072, 4096, 6144, 8192],
        format: (n) => String(n), target: 1000, budget: 2500,
        async run(n) {
          const t0 = performance.now();
          const cv = await c.selection.$toCanvas({ width: n });
          const t1 = performance.now();
          const blob = await toBlob(cv, "image/jpeg", 0.9);
          const t2 = performance.now();
          cv.width = cv.height = 0;
          tag.innerHTML = `最近一次：來源 <b>${src}</b>・輸出 <b>${n}×${n}</b>・繪製 <b>${fmtMs(t1 - t0)}</b>・JPEG 編碼 <b>${fmtMs(t2 - t1)}</b>・<b>${fmtBytes(blob.size)}</b>`;
          return fmtBytes(blob.size);
        },
        note: "計時包含 $toCanvas（建立 n×n canvas，依變換矩陣把來源圖畫進去）與 toBlob JPEG 編碼。像素數隨邊長平方成長，瓶頸通常在編碼與記憶體配置；來源圖解析度主要影響繪製階段。",
      });
    },
  },
] });
</script>
</body>
