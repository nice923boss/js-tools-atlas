<style>
  .site {

<script src="https://cdn.jsdelivr.net/npm/cursor-effects@1.0.18/dist/browser.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// cursor-effects showcase: every effect draws on its own 2D canvas and listens for mousemove on
// document.body, or on `element` when one is passed. Each call returns { destroy }.
const CE = window.cursoreffects;
const REDUCE = "(prefers-reduced-motion: reduce)";

// followingDotCursor's destroy() calls cancelAnimationFrame(loopFn) instead of the frame id, so its
// loop would run forever. A function passed to cancelAnimationFrame is remembered and never rescheduled.
const stoppedLoops = new WeakSet();
const raf0 = window.requestAnimationFrame.bind(window);
const caf0 = window.cancelAnimationFrame.bind(window);
window.requestAnimationFrame = (cb) => (stoppedLoops.has(cb) ? 0 : raf0(cb));
window.cancelAnimationFrame = (id) => (typeof id === "function" ? stoppedLoops.add(id) : caf0(id));

// One effect, optionally bound to `host`. Works around three 1.0.18 issues:
// - destroy() calls window.addEventListener("resize") again instead of removing it;
// - every effect keeps a matchMedia onchange that re-creates it after destroy() when the OS setting flips;
// - touch handlers ignore the element offset (or are missing), so touches are re-sent as mousemove.
// With a host, the size is tracked by a ResizeObserver so layout changes also resize the canvas.
const live = new WeakMap();
const warned = new WeakSet();
function effect(ctx, name, opts = {}, host = null) {
  if (matchMedia(REDUCE).matches) {
    if (!warned.has(ctx)) { warned.add(ctx); ctx.status("系統開啟了「減少動態效果」，cursor-effects 不會建立特效"); }
    return null;
  }
  const target = host || document.body;
  const addWin = window.addEventListener, mm = window.matchMedia;
  const add = EventTarget.prototype.addEventListener;
  let onResize = null, mql = null, fx;
  window.addEventListener = function (type, fn, o) {
    if (type === "resize") { onResize = fn; if (host) return; }
    return addWin.call(this, type, fn, o);
  };
  window.matchMedia = function (q) {
    const m = mm.call(this, q);
    if (q === REDUCE) mql = m;
    return m;
  };
  target.addEventListener = function (type, fn, o) {
    if (type === "touchstart" || type === "touchmove") return;
    return add.call(this, type, fn, o);
  };
  try { fx = CE[name](host ? { ...opts, element: host } : opts); }
  finally { window.addEventListener = addWin; window.matchMedia = mm; delete target.addEventListener; }
  const canvas = target.lastElementChild;
  const ro = host ? new ResizeObserver(() => onResize && onResize()) : null;
  if (ro) ro.observe(host);
  const touch = (ev) => {
    const t = ev.touches[0];
    if (t) target.dispatchEvent(new MouseEvent("mousemove", { clientX: t.clientX, clientY: t.clientY, bubbles: true }));
  };
  target.addEventListener("touchstart", touch, { passive: true });
  target.addEventListener("touchmove", touch, { passive: true });
  let set = live.get(ctx);
  if (!set) {
    set = new Set();
    live.set(ctx, set);
    ctx.onCleanup(() => [...set].forEach((x) => x.destroy()));
  }
  const e = {
    canvas,
    destroy() {
      if (!set.delete(e)) return;
      if (ro) ro.disconnect();
      target.removeEventListener("touchstart", touch, { passive: true });
      target.removeEventListener("touchmove", touch, { passive: true });
      if (mql) mql.onchange = null;
      window.addEventListener = function (type, fn, o) { if (type !== "resize") return addWin.call(this, type, fn, o); };
      try { fx.destroy(); } finally { window.addEventListener = addWin; }
      if (!host && onResize) window.removeEventListener("resize", onResize);
    },
  };
  set.add(e);
  return e;
}

// Autopilot: while the real pointer has been still for 1.5 s, a drawn arrow follows path(s) inside
// each box and synthetic mousemove events are dispatched where the effect listens.
const ARROW = '<svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 1l13 8-6 1.2L6 16z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>';
function pilot(ctx, list, speed = () => 1) {
  let lastReal = -Infinity, clock = 0;
  const mark = (e) => { if (e.isTrusted) lastReal = performance.now(); };
  for (const type of ["mousemove", "touchstart", "touchmove"]) ctx.on(window, type, mark, { capture: true, passive: true });
  const arrows = list.map(() => {
    const a = Showcase.h("div", { class: "pointer" });
    a.innerHTML = ARROW;
    document.body.append(a);
    return a;
  });
  ctx.onCleanup(() => arrows.forEach((a) => a.remove()));
  ctx.raf((t, dt) => {
    const idle = performance.now() - lastReal > 1500;
    clock += (dt / 1000) * speed();
    list.forEach((p, i) => {
      arrows[i].classList.toggle("on", idle);
      if (!idle) return;
      const r = (p.box || p.on).getBoundingClientRect();
      const [u, v] = p.path(clock);
      const x = r.left + u * r.width, y = r.top + v * r.height;
      arrows[i].style.transform = `translate(${x}px, ${y}px)`;
      p.on.dispatchEvent(new MouseEvent("mousemove", { clientX: x, clientY: y, bubbles: true }));
    });
  });
}
// Figure-eight path in 0..1 box coordinates.
const loop = (k = 0, { cx = 0.5, cy = 0.56, ax = 0.34, ay = 0.26 } = {}) => (s) => [cx + ax * Math.sin(s * 1.1 + k), cy + ay * Math.sin(s * 2.2 + 2 * k)];

function board(ctx, cls, n, light = false) {
  const cell = `<div class="cell${light ? " light" : ""}"><div class="lab"><span><b></b><code></code></span></div></div>`;
  ctx.html(`<div class="board ${cls}">${cell.repeat(n)}</div>`);
  return ctx.$$(".cell");
}
function setLab(cell, name, code) {
  cell.querySelector(".lab b").textContent = name;
  cell.querySelector(".lab code").textContent = code;
}

function sprite(size, paint) {
  const c = Showcase.h("canvas", { width: size, height: size });
  paint(c.getContext("2d"), size);
  return c.toDataURL("image/png");
}
const STAR = sprite(22, (g, s) => {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? s * 0.22 : s * 0.46, a = -Math.PI / 2 + (i * Math.PI) / 5;
    g.lineTo(s / 2 + r * Math.cos(a), s / 2 + r * Math.sin(a));
  }
  g.closePath();
  g.fillStyle = "#ffd166";
  g.fill();
  g.lineWidth = 1.5;
  g.strokeStyle = "#7a4a00";
  g.stroke();
});
const GHOST = sprite(30, (g, s) => {
  g.font = "24px serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText("👻", s / 2, s / 2 + 1);
});

const ZH_DAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
const ZH_MONTHS = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
const SNACKS = ["🧋", "🥟", "🍜", "🍢", "🍍"];
const RAINBOW = ["#ff595e", "#ff924c", "#ffca3a", "#8ac926", "#4cc9f0", "#b388ff"];
const FAIRY = ["#ff7eb6", "#ffd166", "#7bdff2", "#b388ff"];

const HOME = [
  { name: "rainbowCursor", label: "彩虹", opts: { length: 24, size: 4, colors: ["#e63946", "#f4a261", "#e9c46a", "#2a9d8f", "#457b9d", "#9d4edd"] }, code: "rainbowCursor({ length: 24, size: 4, colors })" },
  { name: "fairyDustCursor", label: "仙女棒", opts: { colors: ["#ff4d8d", "#f4a261", "#3a86ff", "#9d4edd"] }, code: "fairyDustCursor({ colors })" },
  { name: "bubbleCursor", label: "泡泡", opts: {}, code: "bubbleCursor()" },
  { name: "snowflakeCursor", label: "雪花", opts: {}, code: "snowflakeCursor()" },
  { name: "emojiCursor", label: "台灣小吃", opts: { emoji: SNACKS }, code: 'emojiCursor({ emoji: ["🧋", "🥟", "🍜", "🍢", "🍍"] })' },
  { name: "springyEmojiCursor", label: "彈簧珍奶", opts: { emoji: "🧋" }, code: 'springyEmojiCursor({ emoji: "🧋" })' },
  { name: "textFlag", label: "文字旗", opts: { text: "歡迎光臨阿明的網站", color: "#d62828", textSize: 16, font: "sans-serif" }, code: 'textFlag({ text: "歡迎光臨阿明的網站", color: "#d62828", textSize: 16 })' },
  { name: "clockCursor", label: "時鐘", opts: { theDays: ZH_DAYS, theMonths: ZH_MONTHS, dateColor: "#2a9d8f", secondsColor: "#e63946" }, code: "clockCursor({ theDays, theMonths, dateColor, secondsColor })" },
  { name: "characterCursor", label: "飛散字元", opts: { characters: ["台", "灣", "加", "油", "★"], font: "18px sans-serif", colors: ["#e63946", "#f4a261", "#2a9d8f", "#457b9d", "#9d4edd"] }, code: 'characterCursor({ characters: ["台", "灣", "加", "油", "★"], font: "18px sans-serif" })' },
  { name: "trailingCursor", label: "箭頭拖尾", opts: { particles: 12, rate: 0.35 }, code: "trailingCursor({ particles: 12, rate: 0.35 })" },
  { name: "followingDotCursor", label: "跟隨圓點", opts: { color: "#1d3557aa" }, code: 'followingDotCursor({ color: "#1d3557aa" })' },
  { name: "ghostCursor", label: "鬼影", opts: {}, code: "ghostCursor()" },
];

// Scenes that rebuild one effect per cell when a control changes: destroy() the old one, create anew.
function rebuilder(ctx, cells, defs) {
  const fxs = [], timers = [];
  const build = (i) => {
    if (fxs[i]) fxs[i].destroy();
    const d = defs[i]();
    setLab(cells[i], d.label, d.code);
    fxs[i] = effect(ctx, d.name, d.opts, cells[i]);
  };
  defs.forEach((_, i) => build(i));
  return (i) => { clearTimeout(timers[i]); timers[i] = ctx.timeout(() => build(i), 150); };
}

Showcase.run({ scenes: [
  {
    id: "homepage", title: "阿明的個人網站", paper: true,
    api: "cursoreffects.rainbowCursor(options)・fx.destroy()",
    desc: "不傳 element 時，特效在 body 末端加一張 position: fixed 的全視窗 canvas，並在 document.body 監聽 mousemove。選單列出 1.0.18 的全部 12 種特效，切換時先 destroy() 上一個再建立新的。1.0.18 的 destroy() 會重複加上 resize 監聽、followingDotCursor 的動畫迴圈不會停，本頁已在外層補上。",
    hint: "移動滑鼠看特效・停 1.5 秒後箭頭自動示範",
    mount(ctx) {
      ctx.html(`<div class="site"><div class="home">
        <div class="marquee"><span>★ 歡迎光臨 ★ 本站最佳解析度 800×600 ★ 記得加入我的最愛 ★</span></div>
        <h1>阿明的個人網站</h1>
        <p>移動滑鼠，看看 1999 年最流行的游標特效</p>
        <div class="counter" aria-label="訪客人數"><b>0</b><b>0</b><b>1</b><b>9</b><b>9</b><b>9</b></div>
        <div class="name">目前特效：<span class="cur"></span><small class="idx"></small></div>
        <code class="call"></code>
      </div></div>`);
      const cur = ctx.$(".cur"), idxEl = ctx.$(".idx"), call = ctx.$(".call");
      let fx = null, idx = 0, timer = 0;
      const use = (i) => {
        if (fx) fx.destroy();
        idx = i;
        const d = HOME[i];
        fx = effect(ctx, d.name, d.opts);
        cur.textContent = d.label;
        idxEl.textContent = `${i + 1} / ${HOME.length}`;
        call.textContent = `cursoreffects.${d.code}`;
        sel.value = d.name;
      };
      const sel = ctx.select("特效", HOME.map((d, i) => ({ value: d.name, label: `${i + 1}. ${d.label}` })), HOME[0].name, (v) => {
        clearInterval(timer);
        autoBtn.setAttribute("aria-pressed", "false");
        use(HOME.findIndex((d) => d.name === v));
      });
      const autoBtn = ctx.toggle("自動輪播", false, (v) => {
        clearInterval(timer);
        if (v) timer = ctx.interval(() => use((idx + 1) % HOME.length), 4000);
      });
      use(0);
      pilot(ctx, [{ on: document.body, box: ctx.el, path: (s) => [0.5 + 0.36 * Math.sin(s * 1.1), 0.55 + 0.27 * Math.sin(s * 2.2)] }]);
    },
  },
  {
    id: "lines", title: "線條拖尾",
    api: "rainbowCursor・trailingCursor・textFlag・followingDotCursor({ element, ... })",
    desc: "四種跟著游標畫線或拖影的特效，各綁在一個格子：傳入 element 後 canvas 改成 absolute 疊在該元素裡，座標扣掉元素位置。彩虹的 length 是節點數、size 是線寬；trailingCursor 的 rate 是每節追上前一節的比例，圖片換成 canvas 畫的星星；textFlag 的 gap 是字距。",
    hint: "拖動 length 與 rate 會 destroy() 後重建・滑鼠移入任一格",
    mount(ctx) {
      const cells = board(ctx, "g4", 4);
      let length = 30, rate = 0.4;
      const rebuild = rebuilder(ctx, cells, [
        () => ({ name: "rainbowCursor", label: "彩虹線條", opts: { length, size: 4, colors: RAINBOW }, code: `rainbowCursor({ element, length: ${length}, size: 4, colors })` }),
        () => ({ name: "trailingCursor", label: "圖片拖尾", opts: { particles: 16, rate, baseImageSrc: STAR }, code: `trailingCursor({ element, particles: 16, rate: ${rate}, baseImageSrc })` }),
        () => ({ name: "textFlag", label: "文字旗", opts: { text: "游標拖著旗子跑", color: "#ffd166", textSize: 15, gap: 17, font: "sans-serif" }, code: 'textFlag({ element, text, color: "#ffd166", textSize: 15, gap: 17 })' }),
        () => ({ name: "followingDotCursor", label: "跟隨圓點", opts: { color: "#4cc9f0cc" }, code: 'followingDotCursor({ element, color: "#4cc9f0cc" })' }),
      ]);
      ctx.slider("彩虹 length", { min: 4, max: 60, step: 1, value: length }, (v) => { length = v; rebuild(0); });
      ctx.slider("拖尾 rate", { min: 0.1, max: 0.9, step: 0.05, value: rate, format: (v) => v.toFixed(2) }, (v) => { rate = +v.toFixed(2); rebuild(1); });
      pilot(ctx, cells.map((c, i) => ({ on: c, path: loop(i * 1.3, i === 2 ? { cx: 0.26, ax: 0.16 } : {}) })));
    },
  },
  {
    id: "particles", title: "粒子噴發",
    api: "fairyDustCursor({ colors })・bubbleCursor・snowflakeCursor・emojiCursor({ emoji })",
    desc: "每次 mousemove 噴出粒子：仙女棒要移動超過 1.5 px 才噴，emoji 另有 16 ms 節流，泡泡與雪花每個事件都產生一顆，所以調慢示範速度時仙女棒最先停。1.0.18 的泡泡顏色寫死，fillColor 等選項不會生效；雪花固定是 ❄️。",
    hint: "調慢「示範速度」比較噴發條件",
    mount(ctx) {
      const cells = board(ctx, "g4", 4);
      const DEFS = [
        ["fairyDustCursor", "仙女棒", { colors: FAIRY }, "fairyDustCursor({ element, colors })"],
        ["bubbleCursor", "泡泡", {}, "bubbleCursor({ element })"],
        ["snowflakeCursor", "雪花", {}, "snowflakeCursor({ element })"],
        ["emojiCursor", "台灣小吃", { emoji: SNACKS }, 'emojiCursor({ element, emoji: ["🧋", "🥟", "🍜", "🍢", "🍍"] })'],
      ];
      DEFS.forEach(([name, label, opts, code], i) => {
        setLab(cells[i], label, code);
        effect(ctx, name, opts, cells[i]);
      });
      let speed = 1;
      ctx.slider("示範速度", { min: 0.15, max: 2.5, step: 0.05, value: speed, format: (v) => `${v.toFixed(2)}×` }, (v) => { speed = v; });
      pilot(ctx, cells.map((c, i) => ({ on: c, path: loop(i * 1.3) })), () => speed);
    },
  },
  {
    id: "ghost", title: "殘影",
    api: "ghostCursor({ element, randomDelay, minDelay, maxDelay, image, lifeSpan })",
    desc: "每次 mousemove 在原地留下一張圖，依 lifeSpan（幀數，預設 40）淡出。randomDelay 開啟後，兩張之間隨機間隔 minDelay 到 maxDelay 毫秒，殘影變成一顆顆分開的腳印；image 可換成任何 URL 或 dataURL，這裡用 canvas 畫的 👻。",
    hint: "拖動 maxDelay 與 lifeSpan 比較",
    mount(ctx) {
      const cells = board(ctx, "c3", 3, true);
      let maxDelay = 160, life = 90;
      const rebuild = rebuilder(ctx, cells, [
        () => ({ name: "ghostCursor", label: "預設：lifeSpan 40 幀", opts: {}, code: "ghostCursor({ element })" }),
        () => ({ name: "ghostCursor", label: "隨機間隔", opts: { randomDelay: true, minDelay: 30, maxDelay }, code: `ghostCursor({ element, randomDelay: true, minDelay: 30, maxDelay: ${maxDelay} })` }),
        () => ({ name: "ghostCursor", label: "自訂圖片", opts: { image: GHOST, lifeSpan: life }, code: `ghostCursor({ element, image, lifeSpan: ${life} })` }),
      ]);
      ctx.slider("maxDelay", { min: 40, max: 400, step: 10, value: maxDelay, format: (v) => `${v} ms` }, (v) => { maxDelay = v; rebuild(1); });
      ctx.slider("lifeSpan", { min: 10, max: 160, step: 5, value: life, format: (v) => `${v} 幀` }, (v) => { life = v; rebuild(2); });
      pilot(ctx, cells.map((c, i) => ({ on: c, path: loop(i * 1.7, { ax: 0.3, ay: 0.24 }) })));
    },
  },
  {
    id: "springy-clock", title: "彈簧與時鐘",
    api: "springyEmojiCursor({ emoji })・clockCursor({ theDays, theMonths, faceColor, dateColor, secondsColor, ... })",
    desc: "彈簧 emoji 是 7 個節點的彈簧鏈加上重力，碰到畫布底部與左右邊緣會反彈。時鐘用文字繞圈畫出日期、刻度與三根指針，每個字元以 0.4 的係數逐一追上游標；theDays、theMonths 換成中文，各部位顏色可分開設定（預設是黑色，深色背景必須改）。",
    hint: "換彈簧表情或切換中文日期會重建該特效",
    mount(ctx) {
      const cells = board(ctx, "c2", 2);
      let emoji = "🧋", zh = true;
      const COLORS = { faceColor: "#e9ecef", dateColor: "#8ecae6", secondsColor: "#ff6b6b", minutesColor: "#ffd166", hoursColor: "#ffd166" };
      const rebuild = rebuilder(ctx, cells, [
        () => ({ name: "springyEmojiCursor", label: "彈簧表情", opts: { emoji }, code: `springyEmojiCursor({ element, emoji: "${emoji}" })` }),
        () => ({
          name: "clockCursor", label: zh ? "時鐘：中文日期" : "時鐘：預設英文日期",
          opts: zh ? { ...COLORS, theDays: ZH_DAYS, theMonths: ZH_MONTHS } : COLORS,
          code: zh ? "clockCursor({ element, theDays, theMonths, faceColor, dateColor, ... })" : "clockCursor({ element, faceColor, dateColor, ... })",
        }),
      ]);
      ctx.select("彈簧表情", ["🧋", "🥟", "🐟", "⭐"], emoji, (v) => { emoji = v; rebuild(0); });
      ctx.toggle("中文日期", true, (v) => { zh = v; rebuild(1); });
      pilot(ctx, [
        { on: cells[0], path: (s) => [0.5 + 0.36 * Math.sin(s * 0.9), 0.3 + 0.1 * Math.sin(s * 1.8)] },
        { on: cells[1], path: (s) => [0.5 + 0.16 * Math.sin(s * 0.5), 0.56 + 0.08 * Math.sin(s * 1.0)] },
      ]);
    },
  },
  {
    id: "character", title: "自訂字元物理",
    api: "characterCursor({ characters, colors, font, cursorOffset, characterLifeSpanFunction, ... })",
    desc: "characterCursor 把粒子的壽命、初速、每幀加速度、縮放與旋轉都開放成函式，收到 age 與壽命，同一個特效能做出煙火、噴泉、落葉。colors 是建立時隨機分給每個字元，不是每顆粒子各自隨機；cursorOffset 讓噴出點偏離游標。",
    hint: "拖動字級會以新的 font 重建四個實例",
    mount(ctx) {
      const cells = board(ctx, "g4", 4);
      let size = 18;
      const rebuild = rebuilder(ctx, cells, [
        () => ({ name: "characterCursor", label: "預設參數（只改 font）", opts: { font: `${size}px serif` }, code: `characterCursor({ element, font: "${size}px serif" })` }),
        () => ({
          name: "characterCursor", label: "煙火：放射初速加重力", code: "initialCharacterVelocityFunction: 隨機角度 2~6・y_func: () => 0.09",
          opts: {
            characters: ["✦", "✶", "•", "★", "✺"], colors: ["#ffd166", "#ff6b6b", "#4cc9f0", "#b388ff", "#06d6a0"], font: `${size}px sans-serif`,
            characterLifeSpanFunction: () => 45 + Math.floor(Math.random() * 30),
            initialCharacterVelocityFunction: () => {
              const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 4;
              return { x: Math.cos(a) * v, y: Math.sin(a) * v };
            },
            characterVelocityChangeFunctions: { x_func: () => 0, y_func: () => 0.09 },
            characterScalingFunction: (age, life) => 1.4 * Math.max(1 - age / life, 0),
            characterNewRotationDegreesFunction: () => 0,
          },
        }),
        () => ({
          name: "characterCursor", label: "噴泉：向上初速加 cursorOffset", code: "cursorOffset: { x: 0, y: -10 }・y_func: () => 0.22",
          opts: {
            characters: ["0", "1"], colors: ["#06d6a0", "#80ffdb"], font: `${size}px monospace`, cursorOffset: { x: 0, y: -10 },
            characterLifeSpanFunction: () => 70,
            initialCharacterVelocityFunction: () => ({ x: (Math.random() - 0.5) * 3, y: -5 - Math.random() * 3 }),
            characterVelocityChangeFunctions: { x_func: () => 0, y_func: () => 0.22 },
            characterScalingFunction: () => 1,
            characterNewRotationDegreesFunction: () => 0,
          },
        }),
        () => ({
          name: "characterCursor", label: "落葉：左右擺盪加自轉", code: "x_func: (age) => Math.cos(age / 12) * 0.06・旋轉 age × 3°",
          opts: {
            characters: ["🍁", "🍂", "🌸"], font: `${size}px serif`, cursorOffset: { x: 0, y: 12 },
            characterLifeSpanFunction: () => 150 + Math.floor(Math.random() * 60),
            initialCharacterVelocityFunction: () => ({ x: (Math.random() - 0.5) * 1.2, y: Math.random() * 0.6 }),
            characterVelocityChangeFunctions: { x_func: (age) => Math.cos(age / 12) * 0.06, y_func: () => 0.012 },
            characterScalingFunction: (age, life) => Math.max(0, Math.min(1, age / 12, (life - age) / 30)),
            characterNewRotationDegreesFunction: (age) => age * 3,
          },
        }),
      ]);
      ctx.slider("字級 font", { min: 12, max: 32, step: 1, value: size, format: (v) => `${v}px` }, (v) => { size = v; [0, 1, 2, 3].forEach(rebuild); });
      pilot(ctx, [
        { on: cells[0], path: loop(0) },
        { on: cells[1], path: loop(1.3, { ax: 0.26, ay: 0.2 }) },
        { on: cells[2], path: loop(2.6, { cy: 0.68, ay: 0.14 }) },
        { on: cells[3], path: loop(3.9, { cy: 0.4, ay: 0.14 }) },
      ]);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "characterCursor({ characterLifeSpanFunction: () => 90 })・每幀 N 次 mousemove",
    desc: "單一 characterCursor，每幀沿路徑內插派送 N 次 mousemove，每次都產生一顆存活 90 幀的粒子，所以存活量約是 N × 91。量測每顆粒子都要 translate、rotate、drawImage 的 2D 繪製在數萬顆時 FPS 何時跌破 30。",
    hint: "按「自動加壓」開始，或拖曳手動滑桿",
    mount(ctx) {
      ctx.html(`<div class="stress-area"><div class="cell"><div class="lab"><span><b></b><code></code></span></div></div></div>`);
      const cell = ctx.$(".cell");
      setLab(cell, "單一 characterCursor", "characterLifeSpanFunction: () => 90");
      let perFrame = 2, drawn = 0, lastDrawn = 0, alive = 0, frameMs = 16.7, clock = 0, prev = null;
      const fx = effect(ctx, "characterCursor", {
        characters: ["★", "✦", "●", "◆", "▲"], colors: ["#ffd166", "#ff6b6b", "#4cc9f0", "#b388ff", "#06d6a0"], font: "15px sans-serif",
        characterLifeSpanFunction: () => 90,
        // Same as the default scaling; it runs once per live particle per frame, so it doubles as a counter.
        characterScalingFunction: (age, life) => { drawn++; return Math.max(((life - age) / life) * 2, 0); },
      }, cell);
      if (!fx) return;
      ctx.raf((t, dt) => {
        alive = drawn - lastDrawn;
        lastDrawn = drawn;
        frameMs = frameMs * 0.9 + dt * 0.1;
        clock += dt / 1000;
        const r = cell.getBoundingClientRect();
        const to = [r.left + r.width * (0.5 + 0.38 * Math.sin(clock * 1.3)), r.top + r.height * (0.5 + 0.34 * Math.sin(clock * 2.6))];
        const from = prev || to;
        for (let i = 1; i <= perFrame; i++) {
          const k = i / perFrame;
          cell.dispatchEvent(new MouseEvent("mousemove", { clientX: from[0] + (to[0] - from[0]) * k, clientY: from[1] + (to[1] - from[1]) * k }));
        }
        prev = to;
      });
      ctx.ramp({
        label: "每幀事件", unit: "次", steps: [2, 5, 10, 20, 40, 80, 160, 320], minFps: 30, warmup: 1600,
        apply: (n) => { perFrame = n; },
        metrics: () => ({
          存活粒子: alive,
          每秒新增: Math.round((perFrame * 1000) / frameMs),
          畫布: `${fx.canvas.width}×${fx.canvas.height}`,
        }),
        note: "存活粒子由 characterScalingFunction 每幀被呼叫的次數算出，每顆粒子每幀呼叫一次。一般滑鼠每幀大約只有一次 mousemove，這裡用合成事件把頻率推高，找出逐顆繪製的上限；套件沒有粒子數上限，也只有 emojiCursor 有節流。",
      });
    },
  },
] });
</script>
</body>
</html>
