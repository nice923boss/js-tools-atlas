<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cursor-effects 示範：90 年代游標特效</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"系統開啟「減少動態效果」時，套件會自動停用特效"}</script>
<style>
  body.paper {
    background-color: #fdf6e3;
    background-image: radial-gradient(rgba(120, 90, 40, .12) 1px, transparent 1px);
    background-size: 18px 18px;
  }
  .home {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100% - 32px));
    text-align: center; padding: 22px 20px; border: 3px double #6b4f1d; background: #fffdf5; box-shadow: 6px 6px 0 #e9d8a6;
    font-family: "Times New Roman", var(--font); pointer-events: none;
  }
  .home .marquee { overflow: hidden; white-space: nowrap; font-size: 13px; color: #b5179e; }
  .home .marquee span { display: inline-block; padding-left: 100%; animation: run 9s linear infinite; }
  @keyframes run { to { transform: translateX(-100%); } }
  .home h1 { margin: 10px 0 6px; font-size: clamp(24px, 6vw, 34px); color: #1d3557; }
  .home p { margin: 0; font-size: 13px; color: #6b5b3e; }
  .home .counter { display: inline-flex; gap: 2px; margin-top: 12px; font-family: var(--mono); }
  .home .counter b { background: #111; color: #39ff14; padding: 2px 5px; border-radius: 2px; font-size: 15px; }
  .home .name { margin-top: 10px; font-size: 13px; color: #1d3557; }
  .ghost { position: fixed; left: 0; top: 0; width: 18px; height: 18px; pointer-events: none; z-index: 60; opacity: 0; transition: opacity .3s; }
  .ghost.on { opacity: .8; }
  .reduced { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); display: none; font-size: 12px; }
  @media (max-width: 600px) { .home { top: 56%; } }
</style>
</head>
<body class="paper">
<div class="home">
  <div class="marquee"><span>★ 歡迎光臨 ★ 本站最佳解析度 800×600 ★ 記得加入我的最愛 ★</span></div>
  <h1>阿明的個人網站</h1>
  <p>移動滑鼠，看看 1999 年最流行的游標特效</p>
  <div class="counter" aria-label="訪客人數"><b>0</b><b>0</b><b>1</b><b>9</b><b>9</b><b>9</b></div>
  <div class="name">目前特效：<span id="name">彩虹</span></div>
</div>
<div class="controls" id="effects"></div>
<svg class="ghost" id="ghost" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 1l13 8-6 1.2L6 16z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
<div class="panel reduced" id="reduced">你的系統開啟了「減少動態效果」，套件會停用游標特效</div>
<div class="hint" id="hint">移動滑鼠或在手機上滑動・閒置時自動示範</div>

<script src="https://cdn.jsdelivr.net/npm/cursor-effects@1.0.18/dist/browser.js"></script>
<script>
// Each entry builds one cursoreffects instance; every instance returns { destroy }.
const CE = window.cursoreffects;
const ZH_DAYS = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
const ZH_MONTHS = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
const EFFECTS = [
  ["rainbow", "彩虹", () => CE.rainbowCursor({ length: 24, size: 4, colors: ["#e63946", "#f4a261", "#e9c46a", "#2a9d8f", "#457b9d", "#9d4edd"] })],
  ["fairy", "仙女棒", () => CE.fairyDustCursor({ colors: ["#ff7eb6", "#ffd166", "#7bdff2", "#b388ff"] })],
  ["bubble", "泡泡", () => CE.bubbleCursor({ fillColor: "#cdeffd", strokeColor: "#3a92c5" })],
  ["snow", "雪花", () => CE.snowflakeCursor()],
  ["emoji", "台灣小吃", () => CE.emojiCursor({ emoji: ["🧋", "🥟", "🍜", "🍢", "🍍"], delay: 20 })],
  ["springy", "彈簧珍奶", () => CE.springyEmojiCursor({ emoji: "🧋" })],
  ["flag", "文字旗", () => CE.textFlag({ text: "歡迎光臨阿明的網站", color: "#d62828", textSize: 16, font: "sans-serif" })],
  ["clock", "時鐘", () => CE.clockCursor({ theDays: ZH_DAYS, theMonths: ZH_MONTHS, dateColor: "#2a9d8f", secondsColor: "#e63946" })],
  ["char", "飛散字元", () => CE.characterCursor({ characters: ["台", "灣", "加", "油", "★"], font: "18px sans-serif", colors: ["#e63946", "#f4a261", "#2a9d8f", "#457b9d", "#9d4edd"] })],
];

const bar = document.getElementById("effects");
let current = null;
function use(key) {
  if (current) current.destroy();
  const [, label, make] = EFFECTS.find((e) => e[0] === key);
  current = make();
  document.getElementById("name").textContent = label;
  bar.querySelectorAll(".btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.e === key)));
}
for (const [key, label] of EFFECTS) {
  const b = document.createElement("button");
  b.className = "btn";
  b.dataset.e = key;
  b.textContent = label;
  bar.appendChild(b);
}
bar.addEventListener("click", (e) => {
  const b = e.target.closest("[data-e]");
  if (b) use(b.dataset.e);
});
use("rainbow");

if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.getElementById("reduced").style.display = "block";

// Idle demo: when the real pointer has been still for 2 s, a drawn arrow traces a figure eight
// and feeds synthetic mousemove events to document.body, where the effects listen.
const ghost = document.getElementById("ghost");
let lastReal = -Infinity;
addEventListener("mousemove", (e) => { if (e.isTrusted) lastReal = performance.now(); }, true);
addEventListener("touchmove", () => { lastReal = performance.now(); }, { passive: true, capture: true });
function drive(t) {
  const idle = t - lastReal > 2000;
  ghost.classList.toggle("on", idle);
  if (idle) {
    const s = t / 1000;
    const x = innerWidth / 2 + Math.sin(s * 1.1) * innerWidth * 0.36;
    const y = innerHeight * 0.52 + Math.sin(s * 2.2) * innerHeight * 0.26;
    ghost.style.transform = "translate(" + x + "px," + y + "px)";
    document.body.dispatchEvent(new MouseEvent("mousemove", { clientX: x, clientY: y, bubbles: true }));
  }
  requestAnimationFrame(drive);
}
requestAnimationFrame(drive);
</script>
</body>
</html>
