<script src="https://cdn.jsdelivr.net/npm/curtainsjs@8.1.6/dist/curtains.umd.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// curtains.js showcase: DOM images become WebGL planes, from a transition carousel to a plane-count stress ramp.
const { h, fmt } = Showcase;
const PHOTOS = [
  ["峽灣", "冰河切出的深谷"], ["紅岩峽谷", "砂岩層層堆疊"], ["山谷公路", "穿過綠色山谷"], ["巴哥犬", "皺眉的小鬥士"],
  ["瀑布彩虹", "水霧裡的光譜"], ["水母", "深海的發光傘"], ["母獅", "草原上的凝視"], ["海象", "冰洋上的長牙"],
];
const photo = (i) => `_shared/img/photo-${(i % 8) + 1}.jpg`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now();
const u1 = (name, value = 0) => ({ name, type: "1f", value });
const u2 = (name, x = 0, y = 0) => ({ name, type: "2f", value: new Vec2(x, y) });

// A plane element: hidden <img> children are what curtains.js uploads as textures.
function card(i, cls = "", ...extra) {
  return h("div", { class: `pl ${cls}` }, h("img", { src: photo(i), crossorigin: "anonymous", alt: PHOTOS[i % 8][0] }), ...extra);
}

// One Curtains renderer per scene. Its canvas sits under the DOM layer; planes copy their DOM boxes,
// so whenever the layer changes size we re-run the layout callback and let curtains re-measure.
function makeCurtains(ctx, layer, { onLayout, watchScroll = false } = {}) {
  const box = h("div", { class: "gl" });
  ctx.el.prepend(box);
  // autoRender is off: curtains 8.1.6 keeps its own rAF loop (and onRender callbacks) alive after dispose(),
  // so the scene drives render() itself and the loop stops with the scene.
  const curtains = new Curtains({
    container: box, watchScroll, autoRender: false, pixelRatio: Math.min(2, window.devicePixelRatio || 1),
    failIfMajorPerformanceCaveat: false,
  });
  if (!curtains.gl) {
    ctx.el.classList.add("no-gl");
    ctx.status("").error("此瀏覽器無法建立 WebGL，改顯示原始圖片");
    return null;
  }
  ctx.raf(() => curtains.render());
  ctx.onCleanup(() => {
    curtains.disableDrawing();
    curtains.dispose();
    // dispose() finishes on the next render: run it now so the WebGL context is released immediately
    curtains.render();
  });
  let pending = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      if (!ctx.active) return;
      onLayout && onLayout();
      curtains.resize();
    });
  });
  ro.observe(layer);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); });
  return curtains;
}

// Shared vertex shader head: curtains.js supplies the attributes, matrices and one texture matrix per sampler.
const VS_HEAD = `
precision mediump float;
attribute vec3 aVertexPosition;
attribute vec2 aTextureCoord;
uniform mat4 uMVMatrix;
uniform mat4 uPMatrix;
uniform mat4 uTextureMatrix0;
varying vec2 vUv;
varying vec2 vTexUv;
`;
const VS_BASIC = VS_HEAD + `
void main() {
  gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
  vUv = aTextureCoord;
  vTexUv = (uTextureMatrix0 * vec4(aTextureCoord, 0.0, 1.0)).xy;
}`;
const FS_BASIC = `
precision mediump float;
varying vec2 vUv;
varying vec2 vTexUv;
uniform sampler2D uSampler0;
void main() { gl_FragColor = texture2D(uSampler0, vTexUv); }`;
// ShaderPass fragment shaders read the scene through uRenderTexture with the default pass varyings.
const PASS_HEAD = `
precision mediump float;
varying vec3 vVertexPosition;
varying vec2 vTextureCoord;
uniform sampler2D uRenderTexture;
`;

// ---------- scene 1: the original carousel ----------
const S1_VS = `
precision mediump float;
attribute vec3 aVertexPosition;
attribute vec2 aTextureCoord;
uniform mat4 uMVMatrix;
uniform mat4 uPMatrix;
uniform mat4 activeTexMatrix;
uniform mat4 nextTexMatrix;
uniform vec2 uMouse;
uniform float uHover;
uniform float uTime;
uniform float uProgress;
varying vec2 vUv;
varying vec2 vActiveUv;
varying vec2 vNextUv;
varying float vLift;
void main() {
  vec3 p = aVertexPosition;
  // Bulge toward the camera around the cursor
  float d = distance(p.xy, uMouse);
  float lift = uHover * exp(-d * d * 3.0);
  // Gentle idle cloth wave plus a bow during transitions
  float wave = sin(p.x * 2.5 + uTime * 1.3) * cos(p.y * 2.0 + uTime * 0.9) * 0.018;
  float bow = sin(uProgress * 3.14159) * (1.0 - p.x * p.x) * 0.08;
  p.z += lift * 0.22 + wave + bow;
  gl_Position = uPMatrix * uMVMatrix * vec4(p, 1.0);
  vUv = aTextureCoord;
  vActiveUv = (activeTexMatrix * vec4(aTextureCoord, 0.0, 1.0)).xy;
  vNextUv = (nextTexMatrix * vec4(aTextureCoord, 0.0, 1.0)).xy;
  vLift = lift;
}`;
const S1_FS = `
precision mediump float;
varying vec2 vUv;
varying vec2 vActiveUv;
varying vec2 vNextUv;
varying float vLift;
uniform sampler2D activeTex;
uniform sampler2D nextTex;
uniform float uProgress;
uniform float uMode;
uniform float uTime;
uniform float uAspect;
uniform vec2 uMouse;
uniform vec2 uOrigin;
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
  return v;
}
// Mirror out-of-range coordinates so displaced edges never smear
vec2 mirror(vec2 uv) { return 1.0 - abs(1.0 - mod(uv, 2.0)); }
// RGB split sample: red and blue are pulled apart along dir
vec3 split(sampler2D t, vec2 uv, vec2 dir) {
  return vec3(texture2D(t, mirror(uv + dir)).r, texture2D(t, mirror(uv)).g, texture2D(t, mirror(uv - dir)).b);
}
void main() {
  const float PI = 3.14159;
  float p = uProgress;
  vec2 aspect = vec2(uAspect, 1.0);
  vec2 m = uMouse * 0.5 + 0.5;
  vec2 toM = vUv - m;
  vec2 dir = toM * vLift * 0.025;
  vec2 lens = -toM * vLift * 0.12;
  vec2 ua = vActiveUv + lens;
  vec2 ub = vNextUv + lens;
  vec3 col;
  if (uMode < 0.5) {
    // Noise dissolve with a glowing burn edge
    float n = fbm(vUv * aspect * 3.0 + vec2(0.0, uTime * 0.05));
    float edge = p * 1.3 - 0.15;
    float reveal = 1.0 - smoothstep(edge - 0.025, edge + 0.025, n);
    float glow = exp(-abs(n - edge) * 35.0) * sin(p * PI);
    col = mix(split(activeTex, ua, dir), split(nextTex, ub, dir), reveal);
    col += glow * vec3(1.0, 0.55, 0.15) * 1.6;
  } else if (uMode < 1.5) {
    // Ring wave expanding from where the user clicked
    vec2 dv = (vUv - uOrigin) * aspect;
    float r = length(dv);
    float maxR = length(max(uOrigin, 1.0 - uOrigin) * aspect) + 0.15;
    float k = r - p * maxR;
    float ring = exp(-k * k * 60.0) * sin(p * PI);
    vec2 off = normalize(dv + 1e-5) / aspect * ring * sin(k * 70.0) * 0.035;
    float reveal = smoothstep(0.02, -0.02, k);
    col = mix(split(activeTex, ua + off, dir), split(nextTex, ub + off, dir), reveal);
    col += ring * 0.18;
  } else {
    // Displacement slide: each image is pushed sideways by the other one's brightness
    float la = dot(texture2D(activeTex, vActiveUv).rgb, vec3(0.299, 0.587, 0.114));
    float lb = dot(texture2D(nextTex, vNextUv).rgb, vec3(0.299, 0.587, 0.114));
    float w = sin(vUv.y * 9.0 + uTime * 2.0) * 0.03;
    vec2 pa = vec2(p * (lb * 0.4 + w), 0.0);
    vec2 pb = vec2((1.0 - p) * (la * 0.4 + w), 0.0);
    col = mix(split(activeTex, ua + pa, dir), split(nextTex, ub - pb, dir), smoothstep(0.25, 0.75, p));
  }
  col *= 1.0 + vLift * 0.12;
  vec2 q = vUv - 0.5;
  col *= 1.0 - dot(q, q) * 0.5;
  gl_FragColor = vec4(col, 1.0);
}`;

// ---------- scene 2: hover cards ----------
const S2_VS = VS_HEAD + `
uniform float uHover;
void main() {
  vec3 p = aVertexPosition;
  p.z += uHover * (1.0 - dot(p.xy, p.xy) * 0.5) * 0.08;
  gl_Position = uPMatrix * uMVMatrix * vec4(p, 1.0);
  vUv = aTextureCoord;
  vTexUv = (uTextureMatrix0 * vec4(aTextureCoord, 0.0, 1.0)).xy;
}`;
const S2_FS = `
precision mediump float;
varying vec2 vUv;
varying vec2 vTexUv;
uniform sampler2D uSampler0;
uniform float uHover;
uniform vec2 uMouse;
void main() {
  vec3 c = texture2D(uSampler0, vTexUv).rgb;
  float g = dot(c, vec3(0.299, 0.587, 0.114));
  vec3 col = mix(vec3(g) * vec3(0.9, 0.96, 1.08), c, 0.2 + 0.8 * uHover);
  // Specular glint that follows the pointer across the tilted card
  float spot = exp(-distance(vUv, uMouse * 0.5 + 0.5) * 5.0) * uHover * 0.35;
  gl_FragColor = vec4(col * (0.75 + 0.25 * uHover) + spot, 1.0);
}`;

// ---------- scene 3: scroll bend ----------
const S3_VS = VS_HEAD + `
uniform float uVel;
void main() {
  vec3 p = aVertexPosition;
  // The middle of the plane lags behind its edges in proportion to scroll speed
  p.y += (1.0 - p.x * p.x) * uVel * 0.22;
  p.z += abs(uVel) * (1.0 - p.x * p.x) * 0.08;
  gl_Position = uPMatrix * uMVMatrix * vec4(p, 1.0);
  vUv = aTextureCoord;
  vTexUv = (uTextureMatrix0 * vec4(aTextureCoord, 0.0, 1.0)).xy;
}`;
const S3_FS = `
precision mediump float;
varying vec2 vUv;
varying vec2 vTexUv;
uniform sampler2D uSampler0;
uniform float uVel;
void main() {
  vec2 o = vec2(0.0, uVel * 0.012);
  gl_FragColor = vec4(texture2D(uSampler0, vTexUv + o).r, texture2D(uSampler0, vTexUv).g, texture2D(uSampler0, vTexUv - o).b, 1.0);
}`;

// ---------- scene 4: full-screen pass ----------
const S4_PASS = PASS_HEAD + `
uniform float uTime;
uniform float uEffect;
uniform float uAspect;
uniform float uStrength;
uniform vec2 uMouse;
float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
void main() {
  vec2 uv = vTextureCoord;
  vec2 asp = vec2(uAspect, 1.0);
  vec2 d = (uv - uMouse) * asp;
  float r = length(d);
  vec2 dir = normalize(d + 1e-5) / asp;
  vec4 col;
  if (uEffect < 0.5) {
    // Ripples spreading from the pointer plus chromatic aberration
    float w = sin(r * 42.0 - uTime * 5.0) * exp(-r * 3.5) * 0.012 * uStrength;
    float ca = 0.003 * uStrength * (1.0 + 3.0 * exp(-r * 6.0));
    vec2 q = uv + dir * w;
    vec4 g = texture2D(uRenderTexture, q);
    col = vec4(texture2D(uRenderTexture, q + dir * ca).r, g.g, texture2D(uRenderTexture, q - dir * ca).b, g.a);
  } else if (uEffect < 1.5) {
    // Pixelate: coarse cells far away, finer around the pointer
    float cells = mix(14.0, 90.0, smoothstep(0.5, 0.0, r)) / max(uStrength, 0.2);
    vec2 grid = vec2(cells * uAspect, cells);
    col = texture2D(uRenderTexture, (floor(uv * grid) + 0.5) / grid);
  } else if (uEffect < 2.5) {
    // Magnifier lens with a thin rim
    float R = 0.22;
    float k = smoothstep(0.0, R, r);
    vec2 q = uMouse + (d / asp) * mix(1.0 / (1.0 + uStrength * 1.2), 1.0, k * k);
    col = texture2D(uRenderTexture, q);
    col.rgb += exp(-pow((r - R) * 90.0, 2.0)) * 0.5;
  } else if (uEffect < 3.5) {
    // Old film: sepia, grain, flicker, scanlines and vignette
    col = texture2D(uRenderTexture, uv);
    float l = dot(col.rgb, vec3(0.299, 0.587, 0.114));
    vec3 sepia = vec3(l * 1.07, l * 0.86, l * 0.62);
    float grain = (hash(uv * 900.0 + fract(uTime * 7.0)) - 0.5) * 0.22 * uStrength;
    float flick = 1.0 + sin(uTime * 37.0) * 0.03 * uStrength;
    float scan = 0.94 + 0.06 * sin(uv.y * 800.0);
    float vig = 1.0 - dot((uv - 0.5) * asp, (uv - 0.5) * asp) * 0.9;
    col.rgb = (sepia + grain) * flick * scan * vig;
  } else {
    col = texture2D(uRenderTexture, uv);
  }
  gl_FragColor = col;
}`;

// ---------- scene 5: pass applied to a render target only ----------
const S5_PASS = PASS_HEAD + `
uniform float uTime;
uniform float uEffect;
uniform vec2 uTexel;
float lum(vec2 uv) { return dot(texture2D(uRenderTexture, uv).rgb, vec3(0.299, 0.587, 0.114)); }
void main() {
  vec2 uv = vTextureCoord;
  vec4 c;
  if (uEffect < 0.5) {
    // Underwater: wobble plus caustic highlights
    vec2 o = vec2(sin(uv.y * 30.0 + uTime * 2.2), cos(uv.x * 26.0 + uTime * 1.7)) * 0.006;
    c = texture2D(uRenderTexture, uv + o);
    float caustic = pow(0.5 + 0.5 * sin(uv.x * 70.0 + sin(uv.y * 45.0 + uTime * 2.0) * 2.5 + uTime), 6.0);
    c.rgb = c.rgb * vec3(0.5, 0.85, 1.05) + caustic * 0.22 * c.a;
  } else if (uEffect < 1.5) {
    // Thermal camera palette mapped from luminance
    c = texture2D(uRenderTexture, uv);
    float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));
    vec3 a = vec3(0.05, 0.0, 0.35), b = vec3(0.95, 0.1, 0.35), w = vec3(1.0, 0.95, 0.35);
    c.rgb = (l < 0.5 ? mix(a, b, l * 2.0) : mix(b, w, l * 2.0 - 1.0)) * c.a;
  } else {
    // Sobel edge detection
    vec2 t = uTexel;
    float gx = -lum(uv + vec2(-t.x, t.y)) - 2.0 * lum(uv + vec2(-t.x, 0.0)) - lum(uv - t)
               + lum(uv + t) + 2.0 * lum(uv + vec2(t.x, 0.0)) + lum(uv + vec2(t.x, -t.y));
    float gy = -lum(uv - t) - 2.0 * lum(uv + vec2(0.0, -t.y)) - lum(uv + vec2(t.x, -t.y))
               + lum(uv + vec2(-t.x, t.y)) + 2.0 * lum(uv + vec2(0.0, t.y)) + lum(uv + t);
    float e = clamp(length(vec2(gx, gy)) * 1.6, 0.0, 1.0);
    float a = texture2D(uRenderTexture, uv).a;
    c = vec4(mix(vec3(0.04, 0.05, 0.08), vec3(0.97, 0.87, 0.12), e) * a, a);
  }
  gl_FragColor = c;
}`;

// ---------- scene 6: ping-pong flow map ----------
const S6_FLOW_VS = `
precision mediump float;
attribute vec3 aVertexPosition;
attribute vec2 aTextureCoord;
uniform mat4 uMVMatrix;
uniform mat4 uPMatrix;
varying vec2 vTextureCoord;
void main() {
  gl_Position = uPMatrix * uMVMatrix * vec4(aVertexPosition, 1.0);
  vTextureCoord = aTextureCoord;
}`;
// The flow map lives in an 8-bit buffer: rg = velocity encoded around 0.5, b = ink, a = "written" flag.
const S6_FLOW_FS = `
precision mediump float;
varying vec2 vTextureCoord;
uniform sampler2D uFlowMap;
uniform vec2 uMouse;
uniform vec2 uVelocity;
uniform float uFalloff;
uniform float uDissipation;
uniform float uAspect;
// Fade toward zero by a ratio but at least one 8-bit step, so values never get stuck
float fade(float v) { return sign(v) * max(abs(v) - max(abs(v) * (1.0 - uDissipation), 0.0082), 0.0); }
void main() {
  vec4 prev = texture2D(uFlowMap, vTextureCoord);
  if (prev.a < 0.5) prev = vec4(0.5, 0.5, 0.0, 1.0);
  vec2 flow = (prev.rg - 0.5) * 2.0;
  flow = vec2(fade(flow.x), fade(flow.y));
  float ink = fade(prev.b);
  vec2 d = vTextureCoord - (uMouse * 0.5 + 0.5);
  d.x *= uAspect;
  float f = smoothstep(uFalloff, 0.0, length(d));
  float speed = min(1.0, length(uVelocity));
  flow = mix(flow, clamp(uVelocity, -1.0, 1.0), f * speed);
  ink = mix(ink, 1.0, f * speed);
  gl_FragColor = vec4(flow * 0.5 + 0.5, ink, 1.0);
}`;
const S6_FS = `
precision mediump float;
varying vec2 vUv;
varying vec2 vTexUv;
uniform sampler2D uSampler0;
uniform sampler2D uFlowTexture;
uniform float uStrength;
uniform float uShowFlow;
void main() {
  vec4 f = texture2D(uFlowTexture, vUv);
  vec2 flow = f.a < 0.5 ? vec2(0.0) : (f.rg - 0.5) * 2.0;
  float ink = f.a < 0.5 ? 0.0 : f.b;
  vec2 o = flow * 0.07 * uStrength;
  vec3 col = vec3(texture2D(uSampler0, vTexUv - o * 1.25).r, texture2D(uSampler0, vTexUv - o).g, texture2D(uSampler0, vTexUv - o * 0.75).b);
  col += ink * 0.08;
  // Debug view: black where still, red/green by horizontal/vertical speed, blue for ink
  vec3 dbg = clamp(vec3(abs(flow) * 3.0, ink * 1.5), 0.0, 1.0);
  gl_FragColor = vec4(mix(col, dbg, uShowFlow), 1.0);
}`;

// ---------- scene 7: canvas texture flag ----------
const S7_VS = `
precision mediump float;
attribute vec3 aVertexPosition;
attribute vec2 aTextureCoord;
uniform mat4 uMVMatrix;
uniform mat4 uPMatrix;
uniform mat4 uTextMatrix;
uniform float uTime;
uniform float uWind;
varying vec2 vTexUv;
varying float vShade;
void main() {
  vec3 p = aVertexPosition;
  float k = (p.x + 1.0) * 0.5;   // 0 at the pole, 1 at the free edge
  float ph = p.x * 3.0 - uTime * 2.6 + p.y * 1.2;
  p.z += (sin(ph) * 0.5 + sin(p.x * 7.0 - uTime * 4.1) * 0.12) * k * uWind * 0.2;
  p.y += sin(p.x * 2.0 - uTime * 1.7) * k * uWind * 0.03;
  vShade = cos(ph) * k * uWind;
  gl_Position = uPMatrix * uMVMatrix * vec4(p, 1.0);
  vTexUv = (uTextMatrix * vec4(aTextureCoord, 0.0, 1.0)).xy;
}`;
const S7_FS = `
precision mediump float;
varying vec2 vTexUv;
varying float vShade;
uniform sampler2D uText;
void main() {
  vec4 c = texture2D(uText, vTexUv);
  gl_FragColor = vec4(c.rgb * (0.86 + 0.22 * vShade), c.a);
}`;

// ---------- scene 8: stress tiles ----------
const S8_VS = VS_HEAD + `
uniform float uTime;
uniform float uPhase;
void main() {
  vec3 p = aVertexPosition;
  p.z += sin(p.x * 3.0 + p.y * 2.0 + uTime * 3.0 + uPhase) * 0.12;
  gl_Position = uPMatrix * uMVMatrix * vec4(p, 1.0);
  vUv = aTextureCoord;
  vTexUv = (uTextureMatrix0 * vec4(aTextureCoord, 0.0, 1.0)).xy;
}`;

// Pointer that falls back to a slow Lissajous path when the user is idle, so effects stay visible.
function idlePointer(idleMs = 2500) {
  const p = { x: 0, y: 0, last: -1e9, inside: false };
  return {
    move(x, y, inside = true) { p.x = x; p.y = y; p.inside = inside; p.last = now(); },
    get idle() { return now() - p.last > idleMs; },
    // Returns [x, y, active] in -1..1, either the real pointer or the idle path.
    read(t, ax = 0.55, ay = 0.45) {
      if (now() - p.last <= idleMs) return [p.x, p.y, p.inside ? 1 : 0];
      return [Math.sin(t * 0.7) * ax, Math.sin(t * 1.1 + 1) * ay, 0.75];
    },
  };
}

    id: "flow", title: "滑鼠流體",
    api: "new PingPongPlane(curtains, el, { sampler }) + createTexture({ fromTexture: flowMap.getTexture() })",
    desc: "PingPongPlane 內建兩個 RenderTarget 輪流讀寫：每格讀上一格的流場、衰減後再蓋上游標的速度，形成會殘留的流體軌跡。另一個 Plane 用 createTexture({ fromTexture }) 取用這張流場貼圖，拿來位移照片並分離色版。",
    hint: "在照片上快速劃過・開「顯示流場」直接看 ping-pong 緩衝的內容",
    mount(ctx) {
      let strength = 1, dissipation = 0.965, showFlow = 0;
      ctx.slider("強度", { min: 0, max: 2.5, step: 0.1, value: 1 }, (v) => { strength = v; });
      ctx.slider("殘留", { min: 0.9, max: 0.995, step: 0.005, value: dissipation, format: (v) => v.toFixed(3) }, (v) => { dissipation = v; });
      ctx.toggle("顯示流場", false, (v) => { showFlow = v ? 1 : 0; });
      const area = card(4);
      const layer = h("div", { class: "layer s6" }, area);
      ctx.el.append(layer);
      const curtains = makeCurtains(ctx, layer);
      if (!curtains) return;
      const flowMap = new PingPongPlane(curtains, area, {
        sampler: "uFlowMap", vertexShader: S6_FLOW_VS, fragmentShader: S6_FLOW_FS,
        uniforms: {
          mouse: u2("uMouse"), velocity: u2("uVelocity"), falloff: u1("uFalloff", 0.16),
          dissipation: u1("uDissipation", dissipation), aspect: u1("uAspect", 1),
        },
      });
      const plane = new Plane(curtains, area, {
        vertexShader: VS_BASIC, fragmentShader: S6_FS,
        uniforms: { strength: u1("uStrength", 1), showFlow: u1("uShowFlow") },
      });
      plane.createTexture({ sampler: "uFlowTexture", fromTexture: flowMap.getTexture() });

      const pointer = idlePointer(2000);
      const cur = { x: 0, y: 0 }, prev = { x: 0, y: 0 }, vel = { x: 0, y: 0 };
      ctx.on(layer, "pointermove", (e) => {
        const c = flowMap.mouseToPlaneCoords(new Vec2(e.clientX, e.clientY));
        pointer.move(c.x, c.y);
      });
      flowMap.onRender(() => {
        const t = now() / 1000;
        const [x, y] = pointer.idle ? [Math.sin(t * 1.3) * 0.7, Math.sin(t * 2.1) * 0.55] : pointer.read(t);
        prev.x = cur.x; prev.y = cur.y;
        cur.x = x; cur.y = y;
        vel.x = lerp(vel.x, (cur.x - prev.x) * 24, 0.5);
        vel.y = lerp(vel.y, (cur.y - prev.y) * 24, 0.5);
        const r = flowMap.getBoundingRect();
        const u = flowMap.uniforms;
        u.mouse.value.set(cur.x, cur.y);
        u.velocity.value.set(vel.x, vel.y);
        u.dissipation.value = dissipation;
        u.aspect.value = r.width / Math.max(1, r.height);
        plane.uniforms.strength.value = strength;
        plane.uniforms.showFlow.value = showFlow;
      });
    },
  },
  {
    id: "canvas", title: "Canvas 紋理",
    api: "<canvas data-sampler> 自動載入 + texture.shouldUpdate = false + texture.needUpdate()",
    desc: "平面的來源也可以是 <canvas>（或 <video>）。這裡用 Canvas 2D 畫文字與時鐘，curtains.js 自動把它載成取樣器 uText；關掉逐格上傳（shouldUpdate = false），只在文字或秒數改變時呼叫 needUpdate()，再用頂點著色器讓它像旗子一樣飄。",
    hint: "在右上輸入框改字・拉「風力」改變飄動幅度",
    mount(ctx) {
      let wind = 1, text = "你好，WebGL";
      const input = h("input", { type: "text", value: text, maxlength: 14, "aria-label": "旗面文字" });
      input.addEventListener("input", () => { text = input.value; draw(); });
      ctx.controls.append(h("label", { class: "sc-field" }, "文字", input));
      ctx.slider("風力", { min: 0, max: 2.5, step: 0.1, value: 1 }, (v) => { wind = v; });
      const cv = h("canvas", { "data-sampler": "uText" });
      const flag = h("div", { class: "pl" }, cv);
      const layer = h("div", { class: "layer s7" }, flag);
      ctx.el.append(layer);
      const rootCss = getComputedStyle(document.documentElement);
      const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
      const MONO = rootCss.getPropertyValue("--mono").trim() || "ui-monospace, monospace";
      let tex = null;
      function draw() {
        const w = cv.width, hh = cv.height, g = cv.getContext("2d");
        const grad = g.createLinearGradient(0, 0, w, hh);
        grad.addColorStop(0, "#4cc9f0"); grad.addColorStop(0.55, "#9d8cff"); grad.addColorStop(1, "#f72585");
        g.fillStyle = grad; g.fillRect(0, 0, w, hh);
        g.strokeStyle = "rgba(255,255,255,0.12)"; g.lineWidth = Math.max(1, w / 400);
        for (let x = 0; x < w; x += w / 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, hh); g.stroke(); }
        for (let y = 0; y < hh; y += w / 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
        g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
        g.shadowColor = "rgba(0,0,0,0.35)"; g.shadowBlur = w / 60;
        let size = hh * 0.26;
        g.font = `800 ${size}px ${FONT}`;
        const tw = g.measureText(text || " ").width;
        if (tw > w * 0.86) { size *= (w * 0.86) / tw; g.font = `800 ${size}px ${FONT}`; }
        g.fillText(text || " ", w / 2, hh * 0.44);
        g.shadowBlur = 0;
        g.font = `600 ${hh * 0.08}px ${MONO}`;
        g.fillStyle = "rgba(255,255,255,0.85)";
        g.fillText(`curtains.js・${new Date().toLocaleTimeString("zh-TW", { hour12: false })}`, w / 2, hh * 0.76);
        if (tex) tex.needUpdate();
      }
      function fit() {
        const { width: W, height: H } = ctx.size();
        const top = ctx.controls.offsetHeight + 20;
        const w = Math.max(160, Math.min(760, W - 40, (H - top - 30) * 1.6));
        flag.style.width = `${w}px`;
        flag.style.height = `${w / 1.6}px`;
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        cv.width = Math.round(w * dpr); cv.height = Math.round((w / 1.6) * dpr);
        draw();
      }
      fit();
      const curtains = makeCurtains(ctx, layer, { onLayout: fit });
      if (!curtains) return;
      const plane = new Plane(curtains, flag, {
        vertexShader: S7_VS, fragmentShader: S7_FS, widthSegments: 40, heightSegments: 20,
        uniforms: { time: u1("uTime"), wind: u1("uWind", 1) },
      });
      plane.onReady(() => {
        tex = plane.textures[0];
        tex.shouldUpdate = false;
        tex.needUpdate();
      }).onRender(() => {
        plane.uniforms.time.value = now() / 1000;
        plane.uniforms.wind.value = wind;
      });
      ctx.interval(draw, 1000);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "n × new Plane(curtains, el) + plane.remove()",
    desc: "每個平面都是一個 DOM 方格加一次 draw call，curtains.js 每格逐一更新 uniform 並繪製。逐級增加平面數量直到掉到 30 FPS 以下；切換細分可比較頂點數的影響，相同圖片的貼圖會被快取共用。",
    hint: "按「自動加壓」開始・切換細分後再測一次",
    mount(ctx) {
      ctx.controls.classList.add("bottom");
      let seg = 1, buildMs = 0;
      ctx.group(["細分 1×1", "細分 8×8", "細分 24×24"], 0, (i) => { seg = [1, 8, 24][i]; rebuild(); });
      const layer = h("div", { class: "layer s8" });
      ctx.el.append(layer);
      const curtains = makeCurtains(ctx, layer, { onLayout: () => layout() });
      const cells = [], planes = [];
      let count = 0;
      // Grid the cells into the free area (right of the lab panel on wide screens).
      function layout() {
        const { width: W, height: H } = ctx.size();
        const x0 = W >= 761 ? 350 : 10, y0 = 10, aw = W - x0 - 10, ah = H - ctx.controls.offsetHeight - 30;
        const n = Math.max(1, count);
        const cols = Math.max(1, Math.ceil(Math.sqrt((n * aw) / ah))), rows = Math.ceil(n / cols);
        const cw = aw / cols, ch = ah / rows, g = Math.min(4, cw * 0.12);
        cells.forEach((c, i) => Object.assign(c.style, {
          left: `${x0 + (i % cols) * cw}px`, top: `${y0 + Math.floor(i / cols) * ch}px`, width: `${cw - g}px`, height: `${ch - g}px`,
        }));
      }
      function apply(n) {
        if (!curtains) return;
        const t0 = now();
        count = n;
        while (cells.length > n) { planes.pop().remove(); cells.pop().remove(); }
        for (let i = cells.length; i < n; i++) cells.push(layer.appendChild(card(i)));
        layout();
        curtains.resize();
        for (let i = planes.length; i < n; i++) {
          planes.push(new Plane(curtains, cells[i], {
            vertexShader: S8_VS, fragmentShader: FS_BASIC, widthSegments: seg, heightSegments: seg,
            uniforms: { time: u1("uTime"), phase: u1("uPhase", (i % 37) * 0.7) },
          }));
        }
        buildMs = now() - t0;
      }
      function rebuild() {
        while (planes.length) planes.pop().remove();
        apply(count);
      }
      if (curtains) curtains.onRender(() => {
        const t = now() / 1000;
        for (let i = 0; i < planes.length; i++) planes[i].uniforms.time.value = t;
      });
      ctx.ramp({
        label: "平面", unit: "個", steps: [24, 60, 150, 300, 600, 1000, 1600, 2400, 3200], minFps: 30,
        apply,
        metrics: () => ({
          頂點: (seg + 1) * (seg + 1) * planes.length,
          "draw call": planes.length,
          增減耗時: `${buildMs.toFixed(0)} ms`,
        }),
        note: "每個平面各自一次 draw call 與一組 uniform 上傳，CPU 端的迴圈通常比 GPU 先到頂；細分加大後頂點數上升，弱 GPU 才會明顯變慢。增減耗時是建立或移除平面（含 DOM 方格與貼圖快取複製）所花的時間。",
      });
    },
  },
] });
</script>
</body>
</html>
