// Deterministic PRNG so every visit draws the same graph.
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Create a graph that is destroyed (and its WebGL context released) when the scene unmounts.
const KILL = new WeakMap();
function cyto(ctx, container, opts) {
  const cy = cytoscape({ container, ...opts });
  let dead = false;
  const kill = () => {
    if (dead) return;
    dead = true;
    const canvases = [...container.querySelectorAll("canvas")];
    cy.destroy();
    // cy.destroy() leaves the experimental WebGL layer's context alive; 2D canvases return null here.
    for (const c of canvases) c.getContext("webgl2")?.getExtension("WEBGL_lose_context")?.loseContext();
  };
  KILL.set(cy, kill);
  ctx.onCleanup(kill);
  return cy;
}

function buildMetro() {
  const stations = new Map();
  const edges = [];
  for (const [key, line] of Object.entries(LINES)) {
    line.stops.forEach(([name, x, y], i) => {
      const s = stations.get(name) || { name, x: x * 70, y: y * 70, color: line.color, lines: new Set() };
      s.lines.add(line.name);
      stations.set(name, s);
      if (i > 0) {
        const [prev, px, py] = line.stops[i - 1];
        edges.push({ data: { id: `${key}-${i}`, source: prev, target: name, color: line.color, line: line.name, len: Math.hypot(x - px, y - py) } });
      }
    });
  }
  const list = [...stations.values()];
  return {
    elements: [
      ...list.map((s) => ({ data: { id: s.name, color: s.color }, position: { x: s.x, y: s.y }, classes: s.lines.size > 1 ? "xfer" : "" })),
      ...edges,
    ],
    geo: Object.fromEntries(list.map((s) => [s.name, { x: s.x, y: s.y }])),
  };
}

// ---------- 2. org chart for layouts ----------
function orgChart() {
  const r = rng(11);
  const depts = ["研發", "產品", "業務", "營運", "財務"];
  const els = [{ data: { id: "hq", label: "總部", lvl: 0 } }];
  const teams = [];
  depts.forEach((d, i) => {
    const did = `d${i}`;
    els.push({ data: { id: did, label: d, lvl: 1 } }, { data: { source: "hq", target: did } });
    const nt = 2 + Math.floor(r() * 3);
    for (let t = 0; t < nt; t++) {
      const tid = `${did}t${t}`;
      teams.push(tid);
      els.push({ data: { id: tid, label: `${d}${t + 1}`, lvl: 2 } }, { data: { source: did, target: tid } });
      const nm = 2 + Math.floor(r() * 3);
      for (let m = 0; m < nm; m++) els.push({ data: { id: `${tid}m${m}`, label: "", lvl: 3 } }, { data: { source: tid, target: `${tid}m${m}` } });
    }
  });
  for (let k = 0; k < 7; k++) {
    const a = teams[Math.floor(r() * teams.length)], b = teams[Math.floor(r() * teams.length)];
    if (a !== b) els.push({ data: { source: a, target: b }, classes: "cross" });
  }
  return els;
}

// ---------- 4. weighted grid (spanning maze plus shortcuts, always connected) ----------
function gridGraph(cols, rows, seed) {
  const r = rng(seed), S = 80, N = cols * rows;
  const name = (i) => `${"ABCDEFGHIJ"[i % cols]}${Math.floor(i / cols) + 1}`;
  const els = [];
  for (let i = 0; i < N; i++) {
    els.push({ data: { id: name(i), lab: name(i), gx: i % cols, gy: Math.floor(i / cols) },
      position: { x: (i % cols) * S + (r() - 0.5) * 24, y: Math.floor(i / cols) * S + (r() - 0.5) * 24 } });
  }
  const pairs = new Map();
  const link = (a, b) => pairs.set(a < b ? `${a}-${b}` : `${b}-${a}`, [a, b]);
  const seen = new Uint8Array(N);
  const stack = [0];
  seen[0] = 1;
  while (stack.length) {
    const cur = stack[stack.length - 1], x = cur % cols, y = Math.floor(cur / cols);
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy])
      .filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < cols && ny < rows && !seen[ny * cols + nx]);
    if (!nb.length) { stack.pop(); continue; }
    const [nx, ny] = nb[Math.floor(r() * nb.length)];
    const ni = ny * cols + nx;
    seen[ni] = 1;
    link(cur, ni);
    stack.push(ni);
  }
  for (let i = 0; i < N; i++) {
    const x = i % cols, y = Math.floor(i / cols);
    if (x < cols - 1 && r() < 0.42) link(i, i + 1);
    if (y < rows - 1 && r() < 0.42) link(i, i + cols);
    if (x < cols - 1 && y < rows - 1 && r() < 0.1) link(i, i + cols + 1);
  }
  [...pairs.values()].forEach(([a, b], k) => els.push({ data: { id: `e${k}`, source: name(a), target: name(b), w: 1 + Math.floor(r() * 9) } }));
  return els;
}
const lerpColor = (a, b, t) => {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const [x, y] = [p(a), p(b)];
  return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",")})`;
};

// ---------- 5. compound org ----------
const GROUPS = [
  ["產品部", null, C[1]], ["前端組", "產品部", C[0]], ["後端組", "產品部", C[3]],
  ["設計組", null, C[2]], ["營運部", null, C[4]], ["客服組", "營運部", C[4]], ["行銷組", "營運部", C[5]],
];
const MEMBERS = {
  產品部: ["PM"], 前端組: ["React", "Vue", "CSS", "無障礙"], 後端組: ["API", "資料庫", "SRE"], 設計組: ["UI", "UX", "品牌"],
  營運部: ["營運長"], 客服組: ["客服 A", "客服 B"], 行銷組: ["社群", "廣告", "內容"],
};
const TIES = [["React", "API"], ["Vue", "API"], ["UI", "React"], ["UX", "Vue"], ["PM", "UX"], ["PM", "API"], ["SRE", "資料庫"], ["API", "資料庫"],
  ["品牌", "內容"], ["社群", "內容"], ["客服 A", "PM"], ["廣告", "社群"], ["無障礙", "UX"], ["CSS", "UI"], ["營運長", "PM"], ["客服 B", "客服 A"]];
function compoundEls() {
  const color = Object.fromEntries(GROUPS.map(([g, , c]) => [g, c]));
  return [
    ...GROUPS.map(([id, parent, c]) => ({ data: { id, parent, color: c, group: 1 } })),
    ...Object.entries(MEMBERS).flatMap(([g, list]) => list.map((m) => ({ data: { id: m, parent: g, color: color[g] } }))),
    ...TIES.map(([a, b]) => ({ data: { source: a, target: b } })),
  ];
}
// Links that cross groups get longer, looser springs so neighbouring group boxes do not overlap.
const sameGroup = (e) => e.source().parent().same(e.target().parent());
const FCOSE_COMPOUND = { name: "fcose", quality: "proof", packComponents: false, tile: true, nodeDimensionsIncludeLabels: true,
  nestingFactor: 0.1, gravityCompound: 1, nodeRepulsion: () => 2500,
  idealEdgeLength: (e) => (sameGroup(e) ? 35 : 100), edgeElasticity: (e) => (sameGroup(e) ? 0.45 : 0.1) };

// ---------- 6. small-world graph for events ----------
function smallWorld(seed) {
  const r = rng(seed), n = 24, els = [];
  const ids = Array.from({ length: n }, (_, i) => `N${i + 1}`);
  ids.forEach((id, i) => {
    const a = (i / n) * Math.PI * 2;
    els.push({ data: { id }, position: { x: Math.cos(a) * 200, y: Math.sin(a) * 200 } });
  });
  const seen = new Set();
  ids.forEach((id, i) => {
    for (const k of [1, 2]) {
      let j = (i + k) % n;
      if (r() < 0.18) j = Math.floor(r() * n);
      const key = [i, j].sort((x, y) => x - y).join("-");
      if (j !== i && !seen.has(key)) { seen.add(key); els.push({ data: { source: id, target: ids[j] } }); }
    }
  });
  return els;
}

// ---------- 8. clustered graph for the stress ramp ----------
function bigGraph(n) {
  const r = rng(n);
  const k = Math.max(1, Math.round(n / 70));
  const centers = Array.from({ length: k }, (_, c) => {
    const a = c * 2.399963, rad = 150 * Math.sqrt(c);
    return [Math.cos(a) * rad, Math.sin(a) * rad];
  });
  const gauss = () => (r() + r() + r() - 1.5) * 70;
  const els = new Array(n);
  for (let i = 0; i < n; i++) {
    const c = i % k;
    els[i] = { data: { id: `n${i}`, col: C[c % 6] }, position: { x: centers[c][0] + gauss(), y: centers[c][1] + gauss() } };
  }
  let e = 0;
  for (let i = k; i < n; i++) {
    const back = () => {
      const j = r() < 0.03 ? Math.floor(r() * i) : i - k * (1 + Math.floor(r() * Math.min(6, Math.floor(i / k))));
      return j >= 0 && j !== i ? j : i - k;
    };
    els.push({ data: { id: `e${e++}`, source: `n${i}`, target: `n${back()}` } });
    if (r() < 0.5) els.push({ data: { id: `e${e++}`, source: `n${i}`, target: `n${back()}` } });
  }
  return { els, edges: e };
}

            "text-valign": "top", "text-halign": "center", "text-margin-y": -4 } },
          { selector: "node[?group]:childless", style: { shape: "round-rectangle", width: 60, height: 30, "background-opacity": 0.07,
            "border-width": 1.5, "border-color": "data(color)", "border-style": "dashed", "text-valign": "center", "text-margin-y": 0, color: "data(color)" } },
          { selector: "edge", style: { width: 1.5, "line-color": "#4a515c", "curve-style": "bezier", opacity: 0.8 } },
          { selector: "node.picked", style: { "border-width": 4, "border-color": FG, width: 28, height: 28 } },
          { selector: "node:parent.focus", style: { "border-width": 3, "border-opacity": 1, "background-opacity": 0.18 } },
        ],
      });
      const tag = ctx.$('[data-k="tag"]');
      let picked = null, focus = null, born = 0;
      // Run fcose synchronously, swap x/y when the result's orientation fights the container's,
      // then animate members to the targets (group boxes follow their children).
      const hit = (A, B) => A.x1 < B.x2 && B.x1 < A.x2 && A.y1 < B.y2 && B.y1 < A.y2;
      const clash = () => {
        const g = cy.nodes(":parent");
        return g.some((a) => g.some((b) => !a.same(b) && !a.ancestors().contains(b) && !b.ancestors().contains(a) && hit(a.boundingBox(), b.boundingBox())));
      };
      const relayout = (animate = true, randomize = false) => {
        const members = cy.nodes(":childless");
        const before = members.map((n) => ({ ...n.position() }));
        // A random start occasionally leaves two group boxes touching; retry a few seeds.
        for (let k = 0; k < (randomize ? 5 : 1); k++) {
          cy.layout({ ...FCOSE_COMPOUND, randomize, animate: false, fit: false }).run();
          if (!clash()) break;
        }
        const bb = cy.elements().boundingBox();
        const flip = (bb.w < bb.h) !== (cy.width() < cy.height());
        const target = {};
        members.forEach((n) => { const p = n.position(); target[n.id()] = flip ? { x: p.y, y: p.x } : { ...p }; });
        if (animate) cy.batch(() => members.forEach((n, i) => n.position(before[i])));
        cy.layout({ name: "preset", positions: (n) => target[n.id()], animate, animationDuration: 600, animationEasing: "ease-in-out-cubic", fit: true, padding: 24 }).run();
      };
      const stats = () => {
        const groups = cy.nodes("[?group]"), members = cy.nodes("[!group]");
        const depth = Math.max(0, ...members.map((m) => m.ancestors().length));
        return `<span class="n">${groups.length}</span> 個群組・<span class="n">${members.length}</span> 位成員・最深 <span class="n">${depth}</span> 層`;
      };
      const say = (msg) => { tag.innerHTML = `${msg}　${stats()}`; };
      const setFocus = (g) => { cy.nodes().removeClass("focus"); focus = g; if (g) g.addClass("focus"); };
      cy.on("tap", "node", (e) => {
        const n = e.target;
        if (!n.data("group")) {
          if (picked) picked.removeClass("picked");
          picked = picked && picked.same(n) ? null : n.addClass("picked");
          setFocus(null);
          say(picked ? `已選 <b>${n.id()}</b>（在 ${n.parent().id() || "最外層"}），點另一個群組搬過去` : "取消選取");
          return;
        }
        if (picked) {
          picked.move({ parent: n.id() }).data("color", n.data("color")).removeClass("picked");
          say(`<b>${picked.id()}</b> 已搬到 <b>${n.id()}</b>`);
          picked = null;
          relayout();
          return;
        }
        setFocus(n);
        say(`<b>${n.id()}</b>：${n.descendants("[!group]").length} 位成員，可按「新增成員」或「解散群組」`);
      });
      cy.on("tap", (e) => { if (e.target === cy) { if (picked) picked.removeClass("picked"); picked = null; setFocus(null); say("點成員選取"); } });
      ctx.button("新增成員", () => {
        const g = focus || cy.$id("前端組");
        if (!g.inside()) return;
        const p = g.position();
        cy.add({ data: { id: `新人 ${++born}`, parent: g.id(), color: g.data("color") }, position: { x: p.x + 10, y: p.y + 10 } });
        say(`在 <b>${g.id()}</b> 新增成員，群組框自動長大`);
        relayout();
      });
      ctx.button("解散群組", () => {
        if (!focus || !focus.inside()) { say("先點一個群組"); return; }
        const parent = focus.data("parent") ?? null, name = focus.id();
        focus.children().move({ parent });
        focus.remove();
        setFocus(null);
        say(`<b>${name}</b> 已解散，成員移到 ${parent || "最外層"}`);
        relayout();
      });
      ctx.button("重設", () => { cy.elements().remove(); cy.add(compoundEls()); picked = focus = null; relayout(false, true); say("點成員選取"); });
      autoFit(cy, 24);
      relayout(false, true);
      say("點成員選取");
    },
  },
  {
    id: "events", title: "事件與匯出",
    api: "cy.on('tap dbltap cxttap mouseover grab free boxend zoom', …) + cy.png({ full, scale })",
    desc: "每個互動都是事件：點擊、雙擊、右鍵、滑過、拖曳、框選與縮放即時寫進日誌；「匯出 PNG」用 cy.png() 把整張圖輸出成 2 倍解析度圖檔。",
    hint: "雙擊節點亮出鄰居・右鍵節點刪除・Shift＋拖曳空白處框選・滾輪縮放",
    mount(ctx) {
      ctx.html(`<div class="cyx-box cyx-ev"></div><div class="panel cyx-log"><h3>事件日誌</h3><ol></ol></div>`);
      const list = ctx.$(".cyx-log ol");
      const KIND = { tap: C[0], dbltap: C[1], cxttap: C[2], mouseover: MUTED, grab: C[3], free: C[3], boxend: C[5], viewport: C[4], remove: C[2], add: C[3], png: C[0] };
      const t0 = performance.now();
      const log = (type, what) => {
        const li = Showcase.h("li", {},
          Showcase.h("time", { text: ((performance.now() - t0) / 1000).toFixed(1) + "s" }),
          Showcase.h("code", { text: type, style: `color:${KIND[type] || FG}` }),
          Showcase.h("span", { text: what }));
        list.prepend(li);
        while (list.children.length > 60) list.lastChild.remove();
      };
      const cy = cyto(ctx, ctx.$(".cyx-box"), {
        elements: smallWorld(3), minZoom: 0.3, maxZoom: 4, selectionType: "additive",
        layout: { name: "cose", randomize: false, animate: false, nodeRepulsion: () => 9000, idealEdgeLength: () => 60, padding: 24 },
        style: [
          { selector: "node", style: { ...LABEL, label: "data(id)", "font-size": 10, "text-valign": "center", "text-outline-width": 0, color: BG,
            width: 28, height: 28, "background-color": C[1], "border-width": 0, "transition-property": "background-color, width, height", "transition-duration": "0.2s" } },
          { selector: "node:selected", style: { "background-color": C[0], "border-width": 3, "border-color": FG } },
          { selector: "node.hover", style: { width: 34, height: 34 } },
          { selector: "edge", style: { width: 2, "line-color": "#4a515c", "curve-style": "bezier" } },
          { selector: ".hl", style: { "background-color": C[3], "line-color": C[3], width: 4 } },
          { selector: "node.hl", style: { width: 34, height: 34 } },
        ],
      });
      autoFit(cy, 24);
      const nameOf = (t) => (t === cy ? "背景" : t.isNode() ? `節點 ${t.id()}` : `邊 ${t.source().id()}–${t.target().id()}`);
      cy.on("tap", (e) => log("tap", nameOf(e.target)));
      cy.on("dbltap", "node", (e) => { log("dbltap", `${e.target.id()} 的鄰居 ${e.target.neighborhood("node").length} 個`); e.target.closedNeighborhood().flashClass("hl", 1400); });
      cy.on("cxttap", "node", (e) => {
        const n = e.target;
        log("cxttap", `刪除 ${n.id()}`);
        n.animate({ style: { width: 2, height: 2, opacity: 0 } }, { duration: 260, complete: () => {
          const k = n.connectedEdges().length;
          n.remove();
          log("remove", `${n.id()} 與相連的 ${k} 條邊，剩 ${cy.nodes().length} 個節點`);
        } });
      });
      cy.on("mouseover", "node", (e) => { e.target.addClass("hover"); log("mouseover", e.target.id()); });
      cy.on("mouseout", "node", (e) => e.target.removeClass("hover"));
      cy.on("grab", "node", (e) => log("grab", e.target.id()));
      cy.on("free", "node", (e) => { const p = e.target.position(); log("free", `${e.target.id()} → (${Math.round(p.x)}, ${Math.round(p.y)})`); });
      cy.on("boxend", () => ctx.timeout(() => log("boxend", `已選 ${cy.$(":selected").length} 個`), 0));
      let lastVp = 0;
      cy.on("zoom pan", () => {
        const now = performance.now();
        if (now - lastVp < 350) return;
        lastVp = now;
        log("viewport", `zoom ${cy.zoom().toFixed(2)}`);
      });
      let shot = null;
      ctx.button("匯出 PNG", () => {
        const t = performance.now();
        const uri = cy.png({ full: true, scale: 2, bg: BG });
        const took = performance.now() - t;
        shot?.remove();
        const kb = Math.round((uri.length * 0.75) / 1024);
        const info = Showcase.h("p", { text: `${kb} KB・${ms(took)} ms` });
        const img = Showcase.h("img", { alt: "匯出的 PNG 預覽", src: uri });
        img.onload = () => { info.textContent = `${img.naturalWidth}×${img.naturalHeight} px・${kb} KB・${ms(took)} ms`; };
        const close = Showcase.h("button", { class: "btn", type: "button" }, "關閉");
        close.onclick = () => { shot.remove(); shot = null; };
        shot = Showcase.h("div", { class: "panel cyx-shot" }, img, info, Showcase.h("a", { class: "btn", href: uri, download: "cytoscape-graph.png" }, "下載"), close);
        ctx.el.append(shot);
        log("png", `cy.png() 輸出 ${kb} KB`);
      }, { primary: true });
      ctx.button("重設", () => {
        shot?.remove();
        shot = null;
        cy.elements().remove();
        cy.add(smallWorld(3));
        cy.layout({ name: "cose", randomize: false, animate: false, nodeRepulsion: () => 9000, idealEdgeLength: () => 60, padding: 24 }).run();
        log("add", `重建 ${cy.nodes().length} 個節點`);
      });
      log("add", `載入 ${cy.nodes().length} 個節點、${cy.edges().length} 條邊`);
    },
  },
  {
    id: "batch", title: "批次與動畫",
    api: "ele.delay(ms).animate({ style }) + cy.batch(fn)",
    desc: "點任一節點，依 BFS 深度用 delay().animate() 排出漣漪動畫；兩個更新按鈕比較 800 個節點逐一改 data 與包進 cy.batch() 的同步耗時，差別在樣式重算與事件通知的次數。",
    hint: "點節點放漣漪・按兩個更新按鈕比較耗時",
    mount(ctx) {
      ctx.html(`<div class="cyx-box"></div><div class="panel cyx-tag" data-k="tag"></div>`);
      const COLS = 36, ROWS = 22, S = 22;
      const els = [];
      for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
        const id = `p${x}_${y}`;
        els.push({ data: { id, x, y, v: 0.5 }, position: { x: x * S, y: y * S } });
        if (x) els.push({ data: { source: `p${x - 1}_${y}`, target: id } });
        if (y) els.push({ data: { source: `p${x}_${y - 1}`, target: id } });
      }
      const cy = cyto(ctx, ctx.$(".cyx-box"), {
        elements: els, layout: { name: "preset", padding: 14 }, minZoom: 0.3, maxZoom: 4, autoungrabify: true, boxSelectionEnabled: false,
        style: [
          { selector: "node", style: { width: 9, height: 9, "border-width": 0, "background-color": `mapData(v, 0, 1, #20242b, ${C[5]})` } },
          { selector: "edge", style: { width: 1, "line-color": "#262b33", "curve-style": "haystack", "haystack-radius": 0 } },
        ],
      });
      autoFit(cy, 14);
      const tag = ctx.$('[data-k="tag"]');
      const nodes = cy.nodes();
      let hue = 0, phase = 0, auto = true, tOne = null, tBatch = null;
      const report = () => {
        const ratio = tOne && tBatch ? `　快 <span class="n">${(tOne / tBatch).toFixed(1)}×</span>` : "";
        tag.innerHTML = `<b>${fmt(nodes.length)}</b> 個節點　逐一更新 <span class="n">${tOne == null ? "未測" : ms(tOne) + " ms"}</span>　cy.batch() <span class="n">${tBatch == null ? "未測" : ms(tBatch) + " ms"}</span>${ratio}`;
      };
      function ripple(src) {
        const color = C[hue++ % 4];
        nodes.stop(true, false);
        cy.elements().bfs({ roots: src, visit: (v, e, u, i, depth) => {
          v.delay(depth * 40)
            .animate({ style: { "background-color": color, width: 17, height: 17 } }, { duration: 160 })
            .animate({ style: { width: 9, height: 9 } }, { duration: 380, complete: () => v.removeStyle("background-color width height") });
        } });
      }
      const pattern = (n) => 0.5 + 0.5 * Math.sin(n.data("x") * 0.35 + phase) * Math.cos(n.data("y") * 0.4 - phase * 0.7);
      const update = (batch) => {
        phase += 0.9;
        const t = performance.now();
        const work = () => nodes.forEach((n) => { n.data("v", pattern(n)); });
        if (batch) cy.batch(work); else work();
        const took = performance.now() - t;
        if (batch) tBatch = took; else tOne = took;
        report();
      };
      cy.on("tap", "node", (e) => { auto = false; ripple(e.target); });
      ctx.button("逐一更新", () => update(false));
      ctx.button("cy.batch() 更新", () => update(true), { primary: true });
      const mid = () => cy.$id(`p${COLS >> 1}_${ROWS >> 1}`);
      ctx.timeout(() => ripple(mid()), 300);
      ctx.interval(() => { if (auto) ripple(nodes[Math.floor(Math.random() * nodes.length)]); }, 3600);
      update(true);
      tBatch = null;
      report();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "cytoscape({ renderer: { name: 'canvas', webgl: true }, hideEdgesOnViewport }) + cy.viewport()",
    desc: "每一格都用 cy.viewport() 改縮放與平移，強迫整張圖重繪，逐級增加節點（邊約 1.5 倍）直到掉到 30 FPS 以下；可切換實驗性的 WebGL 渲染器或移動時隱藏邊再測一次。",
    hint: "按「自動加壓」開始；切換渲染器後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="cyx-stress"></div>`);
      const host = ctx.$(".cyx-stress");
      let cy = null, n = 500, edges = 0, webgl = false, hideEdges = false, buildMs = 0, view = null;
      const STYLE = [
        { selector: "node", style: { width: 7, height: 7, "background-color": "data(col)", "border-width": 0 } },
        { selector: "edge", style: { width: 0.7, "line-color": "#5a606b", opacity: 0.55, "curve-style": "haystack", "haystack-radius": 0 } },
      ];
      const frame = () => {
        cy.fit(undefined, 10);
        const bb = cy.elements().boundingBox();
        view = { zoom: cy.zoom(), cx: (bb.x1 + bb.x2) / 2, cy: (bb.y1 + bb.y2) / 2, span: Math.max(bb.w, bb.h) };
      };
      function build() {
        if (cy) KILL.get(cy)();
        cy = null;
        view = null;
        host.replaceChildren();
        const box = Showcase.h("div", { class: "cyx-fill" });
        box.style.backgroundColor = BG; // the WebGL layer clears to the container's inline background colour
        host.append(box);
        const g = bigGraph(n);
        edges = g.edges;
        const opts = { elements: g.els, style: STYLE, layout: { name: "preset" }, minZoom: 0.01, maxZoom: 8,
          hideEdgesOnViewport: hideEdges, autoungrabify: true, autounselectify: true, boxSelectionEnabled: false };
        if (webgl) opts.renderer = { name: "canvas", webgl: true };
        const t = performance.now();
        cy = cyto(ctx, box, opts);
        buildMs = performance.now() - t;
        frame();
        cy.on("resize", frame);
      }
      ctx.raf((t) => {
        if (!cy || !view) return;
        const z = view.zoom * (1.2 + 0.35 * Math.sin(t / 1100));
        const ox = Math.sin(t / 1700) * view.span * 0.16, oy = Math.cos(t / 2300) * view.span * 0.1;
        cy.viewport({ zoom: z, pan: { x: cy.width() / 2 - (view.cx + ox) * z, y: cy.height() / 2 - (view.cy + oy) * z } });
      });
      ctx.toggle("WebGL（實驗）", webgl, (v) => { webgl = v; build(); });
      ctx.toggle("移動時隱藏邊", hideEdges, (v) => { hideEdges = v; build(); });
      ctx.controls.classList.add("bottom");
      build();
      ctx.ramp({
        label: "節點", steps: [500, 1000, 2500, 5000, 10000, 25000, 50000], minFps: 30,
        apply(count) { n = count; build(); },
        metrics: () => ({ "邊": edges, "建立": Showcase.fmtMs(buildMs), "渲染器": webgl ? "WebGL" : "Canvas 2D" }),
        note: "每格都改變縮放與平移，Canvas 2D 必須逐一重畫所有可見的節點與邊，瓶頸在繪圖呼叫數量；WebGL 渲染器（實驗功能）把節點貼圖與邊批次送進 GPU。「移動時隱藏邊」在視窗變動期間不畫邊，等於只測節點。建立耗時含產生元素與初始化渲染器。",
      });
    },
  },
] });
</script>
</body>
</html>
