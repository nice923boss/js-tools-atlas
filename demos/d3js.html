<style>
  .d3-fill { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 6px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: flex; flex-direction: column; gap: 6px; }
  .d3-fill > svg { flex: 1; min-height: 0; width: 100%; display: block; }
  .d3-head { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
  .d3-head b { color: var(--fg); font-weight: 600; }
  .d3-key { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; }

  .d3-tip { position: absolute; left: 0; top: 0; z-index: 30; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: rgba(14,16,19,.94);
    border: 1px solid var(--line); font: 12px/1.5 var(--font); color: var(--fg); opacity: 0; transition: opacity .15s; white-space: nowrap; }
  .d3-tip b { color: var(--accent); font-family: var(--mono); font-weight: 600; }

    background: rgba(14,16,19,.78); border: 1px solid var(--line); font: 11.5px/1.4 var(--font); color: var(--muted); }

  /* 1. ecosystem graph */
  .d3-eco { cursor: grab; }

  .d3-link { stroke: rgba(255,255,255,.18); stroke-width: 1.2; fill: none; transition: stroke .2s, opacity .2s; }

  .d3-node.cat text { font-weight: 700; font-size: 13px; }

  /* 3. curve grid */
  .d3-grid { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 6px) 10px 10px; display: grid; gap: 8px;
    grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .d3-cell { position: relative; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,.02); }

  .d3-cell svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .d3-area { fill: rgba(76,201,240,.14); }
  .d3-line { fill: none; stroke: var(--c2); stroke-width: 2.2; }
  .d3-dot { fill: var(--bg); stroke: var(--c1); stroke-width: 2; cursor: ns-resize; }
  .d3-dot.on { fill: var(--c1); }
  @media (max-width: 480px) { .d3-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); } }

  /* 8. stress */

  .d3-stress > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  @media (max-width: 760px) {
    .d3-stress { inset: 8px; opacity: .9; }
    /* Keep the lab panel above the bottom mode switch instead of covering it. */

  }

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// D3.js showcase: forces, data joins, shapes, hierarchies, geo, zoom/brush, Delaunay/contours and an SVG vs Canvas stress ramp.
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const nf = new Intl.NumberFormat("zh-TW");
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const LINE = "rgba(255,255,255,0.14)";

// Call fn({ width, height }) now and whenever el changes size (stage resizes and control-bar height changes).
function fit(ctx, el, fn) {
  let w = -1, h = -1, queued = 0;
  const run = () => {
    queued = 0;
    const r = el.getBoundingClientRect(), width = Math.round(r.width), height = Math.round(r.height);
    if (width < 20 || height < 20 || (width === w && height === h)) return;
    w = width; h = height;
    fn({ width, height });
  };
  const ro = new ResizeObserver(() => { if (!queued) queued = requestAnimationFrame(run); });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(queued); });
  run();
}
// Floating tooltip inside the scene, kept within its bounds.
function tip(ctx) {
  const el = Showcase.h("div", { class: "d3-tip" });
  ctx.el.append(el);
  return {
    show(e, html) {
      el.innerHTML = html;
      const r = ctx.el.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
      let x = e.clientX - r.left + 14, y = e.clientY - r.top + 14;
      if (x + w > r.width - 6) x = e.clientX - r.left - w - 14;
      if (y + hh > r.height - 6) y = e.clientY - r.top - hh - 14;
      el.style.transform = `translate(${Math.max(4, x)}px,${Math.max(4, y)}px)`;
      el.style.opacity = 1;
    },
    hide() { el.style.opacity = 0; },
  };
}

const ECO = {
  name: "JavaScript",
  children: [
    { name: "視覺化", children: ["D3.js", "ECharts", "Chart.js", "Plotly", "Vega-Lite", "uPlot", "G2"] },
    { name: "3D 與遊戲", children: ["three.js", "Babylon.js", "PixiJS", "Phaser", "Matter.js"] },
    { name: "動畫", children: ["GSAP", "anime.js", "Lottie", "Motion", "p5.js"] },
    { name: "UI 框架", children: ["React", "Vue", "Svelte", "Solid", "Alpine.js", "Lit"] },
    { name: "表格與資料", children: ["Tabulator", "Grid.js", "DataTables", "Day.js", "Lodash"] },
    { name: "工具鏈", children: ["Vite", "esbuild", "Rollup", "Vitest", "ESLint", "Prettier"] },
  ].map((c) => ({ name: c.name, children: c.children.map((n) => ({ name: n })) })),
};
const COUNTIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "基隆市", "新竹市", "新竹縣", "苗栗縣", "彰化縣",
  "南投縣", "雲林縣", "嘉義市", "嘉義縣", "屏東縣", "宜蘭縣", "花蓮縣", "臺東縣", "澎湖縣", "金門縣", "連江縣"];
// Approximate population in 10k people, grouped by region (illustrative).
const POP = { 北部: { 新北市: 405, 臺北市: 249, 桃園市: 232, 新竹縣: 59, 新竹市: 46, 宜蘭縣: 45, 基隆市: 36 },
  中部: { 臺中市: 286, 彰化縣: 123, 雲林縣: 66, 苗栗縣: 53, 南投縣: 47 },
  南部: { 高雄市: 273, 臺南市: 186, 屏東縣: 79, 嘉義縣: 48, 嘉義市: 26 },
  東部: { 花蓮縣: 32, 臺東縣: 21 }, 離島: { 金門縣: 14, 澎湖縣: 11, 連江縣: 1.4 } };
const REG_COLOR = { 北部: C[1], 中部: C[3], 南部: C[4], 東部: C[5], 離島: C[2] };
const POP_TREE = { name: "臺灣", children: Object.entries(POP).map(([r, o]) => ({ name: r, children: Object.entries(o).map(([name, value]) => ({ name, value })) })) };

// Daily PM2.5 for one year: seasonal baseline plus a seeded random walk (illustrative).
let PM = null;
function pmSeries() {
  if (PM) return PM;
  const rnd = d3.randomLcg(7);
  let v = 25;
  PM = d3.timeDay.range(new Date(2025, 0, 1), new Date(2026, 0, 1)).map((date, i) => {
    const base = 19 + 11 * Math.cos(((i - 20) / 365) * 2 * Math.PI);
    v += (base - v) * 0.18 + (rnd() - 0.5) * 9 + (rnd() < 0.03 ? 16 : 0);
    return { date, value: Math.max(3, v) };
  });
  return PM;
}

let WORLD = null;
async function loadWorld(ctx) {
  if (WORLD) return WORLD;
  await ctx.load("https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js");
  const topo = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json", { signal: ctx.signal });
  const countries = topojson.feature(topo, topo.objects.countries).features;
  WORLD = {
    land: topojson.feature(topo, topo.objects.land),
    borders: topojson.mesh(topo, topo.objects.countries, (a, b) => a !== b),
    taiwan: countries.find((f) => f.id === "158"),
  };
  return WORLD;
}

Showcase.run({ scenes: [
  {
    id: "eco", title: "生態力導向圖",
    api: "d3.forceSimulation(nodes).force(\"link\", d3.forceLink(links))",
    desc: "JS 工具的階層資料先用力導向模擬排開；切到放射樹或橫向樹時，自訂 tween 把每個節點補間到 d3.tree() 算出的位置（極座標或直角座標）。",
    hint: "拖曳節點・滾輪縮放・滑過看關聯・切換三種佈局",
    mount(ctx) {
      ctx.html(`<div class="d3-fill"><svg class="d3-svg d3-eco"></svg></div><div class="d3-tag"></div>`);
      const svg = d3.select(ctx.$("svg"));
      const zoomLayer = svg.append("g"), linkG = zoomLayer.append("g"), nodeG = zoomLayer.append("g");
      const root = d3.hierarchy(ECO);
      root.children.forEach((c, i) => c.descendants().forEach((d) => (d.color = C[i])));
      root.color = C[0];
      const nodes = root.descendants(), links = root.links();
      ctx.$(".d3-tag").textContent = `${root.children.length} 大類・${root.leaves().length} 個工具`;
      const radius = (d) => (d.depth === 0 ? 40 : d.depth === 1 ? 13 : 6);
      let W = 0, H = 0, K = 1, mode = 0;

      const linkSel = linkG.selectAll("line").data(links).join("line").attr("class", "d3-link");
      const nodeSel = nodeG.selectAll("g").data(nodes).join("g").attr("class", (d) => "d3-node" + (d.depth === 0 ? " root" : d.depth === 1 ? " cat" : ""));
      nodeSel.append("circle").attr("r", radius).attr("fill", (d) => d.color).attr("fill-opacity", (d) => (d.depth === 2 ? 0.85 : 1));
      const labelSel = nodeSel.append("text").text((d) => d.data.name).attr("dy", "0.34em").attr("text-anchor", (d) => (d.depth === 0 ? "middle" : "start"));

      const sim = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).strength(0.9))
        .force("charge", d3.forceManyBody())
        .force("collide", d3.forceCollide((d) => (d.depth === 2 ? 14 : radius(d) + 10)))
        .force("x", d3.forceX(0).strength(0.04))
        .force("y", d3.forceY(0).strength(0.06))
        .on("tick", () => { keepInside(); render(); });
      ctx.onCleanup(() => { sim.stop(); svg.interrupt("morph"); });

      function keepInside() {
        const mx = W / K / 2 - 70, my = H / K / 2 - 30;
        for (const d of nodes) { d.x = clamp(d.x, -mx, mx); d.y = clamp(d.y, -my, my); }
      }
      // Force distances scale with the viewport so small stages stay readable without shrinking text.
      function setForces() {
        const S = clamp(Math.min(W, H) / K / 640, 0.6, 1.2);
        sim.force("link").distance((l) => (l.source.depth === 0 ? 135 * S : 58 * S));
        sim.force("charge").strength((d) => (d.depth === 0 ? -1000 : d.depth === 1 ? -420 : -120) * S);
      }
      function render() {
        linkSel.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y).attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
        nodeSel.attr("transform", (d) => `translate(${d.x},${d.y})`);
        // Leaf labels point away from their parent (force) or from the centre (radial), flipped on the left half.
        labelSel.filter((d) => d.depth > 0).each(function (d) {
          const off = radius(d) + 5, t = d3.select(this);
          if (mode === 2) {
            const leaf = d.depth === 2;
            t.attr("text-anchor", leaf ? "start" : "middle").attr("x", leaf ? off : 0).attr("y", leaf ? 0 : -off - 4).attr("transform", null);
            return;
          }
          const o = d.depth === 1 || mode > 0 ? { x: 0, y: 0 } : d.parent;
          const deg = (Math.atan2(d.y - o.y, d.x - o.x) * 180) / Math.PI, flip = Math.abs(deg) > 90;
          t.attr("text-anchor", flip ? "end" : "start").attr("x", flip ? -off : off).attr("y", 0)
            .attr("transform", d.depth === 2 ? `rotate(${flip ? deg + 180 : deg})` : null);
        });
      }
      // Targets from d3.tree (radial or left-to-right); the layout overwrites d.x/d.y, so live positions are restored afterwards.
      function treeTargets() {
        const live = nodes.map((d) => ({ x: d.x, y: d.y }));
        let out;
        if (mode === 1) {
          const R = Math.max(110, Math.min(W, H) / K / 2 - 80);
          d3.tree().size([2 * Math.PI, R]).separation((a, b) => (a.parent === b.parent ? 1 : 1.6))(root);
          out = nodes.map((d) => ({ x: d.y * Math.cos(d.x - Math.PI / 2), y: d.y * Math.sin(d.x - Math.PI / 2) }));
        } else {
          const w = W / K, h = H / K - 50;
          d3.tree().size([h, Math.max(160, w - 230)])(root);
          out = nodes.map((d) => ({ x: -w / 2 + 50 + d.y, y: -h / 2 + 10 + d.x }));
        }
        nodes.forEach((d, i) => { d.x = live[i].x; d.y = live[i].y; });
        return out;
      }
      function morphTo(targets) {
        const from = nodes.map((d) => ({ x: d.x, y: d.y }));
        svg.transition("morph").duration(1100).ease(d3.easeCubicInOut).tween("layout", () => (t) => {
          nodes.forEach((d, i) => { d.x = from[i].x + (targets[i].x - from[i].x) * t; d.y = from[i].y + (targets[i].y - from[i].y) * t; });
          render();
        });
      }
      function setMode(i) {
        mode = i;
        if (mode > 0) { sim.stop(); morphTo(treeTargets()); }
        else { svg.interrupt("morph"); nodes.forEach((d) => { d.fx = d.fy = null; d.vx = d.vy = 0; }); sim.alpha(0.9).restart(); }
      }
      const seg = ctx.group(["力導向", "放射樹", "橫向樹"], 0, (i) => setMode(i));
      ctx.button("打散重排", () => {
        if (mode > 0) seg.querySelector("button").click();
        nodes.forEach((d) => { d.x += (Math.random() - 0.5) * W * 0.8; d.y += (Math.random() - 0.5) * H * 0.8; });
        sim.alpha(1).restart();
      });

      nodeSel.call(d3.drag()
        .on("start", (e, d) => { if (mode === 0) { if (!e.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; } })
        .on("drag", (e, d) => { if (mode === 0) { d.fx = e.x; d.fy = e.y; } else { d.x = e.x; d.y = e.y; render(); } })
        .on("end", (e, d) => { if (mode === 0) { if (!e.active) sim.alphaTarget(0); d.fx = d.fy = null; } }));
      nodeSel.on("mouseenter", (e, d) => {
        const keep = new Set([...d.ancestors(), ...d.descendants()]);
        nodeSel.classed("d3-dim", (n) => !keep.has(n));
        linkSel.classed("d3-dim", (l) => !(keep.has(l.source) && keep.has(l.target))).classed("hot", (l) => keep.has(l.source) && keep.has(l.target));
      }).on("mouseleave", () => { nodeSel.classed("d3-dim", false); linkSel.classed("d3-dim", false).classed("hot", false); });

      const zoom = d3.zoom().scaleExtent([0.4, 3]).on("zoom", (e) => zoomLayer.attr("transform", e.transform));
      svg.call(zoom).on("dblclick.zoom", null);
      fit(ctx, svg.node(), ({ width, height }) => {
        W = width; H = height;
        svg.attr("viewBox", [-W / 2, -H / 2, W, H]);
        K = Math.min(1, Math.min(W, H) / 470);
        svg.call(zoom.transform, d3.zoomIdentity.scale(K));
        setForces();
        if (mode > 0) morphTo(treeTargets()); else sim.alpha(0.6).restart();
      });
    },
  },
  {
    id: "join", title: "資料連結與轉場",
    api: "selection.data(rows, d => d.name).join(enter, update, exit)",
    desc: "以縣市名稱當 key 做資料連結：新增的列從綠色淡入（enter）、數值變動的列平移並補間數字（update）、刪除的列轉紅淡出（exit），座標軸也跟著轉場。",
    hint: "按按鈕新增、移除或更新；關掉自動播放可逐步觀察",
    mount(ctx) {
      ctx.html(`<div class="d3-fill"><div class="d3-head"><b>各縣市週末觀光人次（萬人次，示意資料）</b>
        <span class="d3-key"><i style="background:${C[3]}"></i>enter 新增</span><span class="d3-key"><i style="background:${C[1]}"></i>update 更新</span>
        <span class="d3-key"><i style="background:${C[2]}"></i>exit 移除</span></div><svg class="d3-svg"></svg></div>`);
      const svg = d3.select(ctx.$("svg"));
      const m = { l: 58, r: 52, t: 20, b: 4 };
      const axisG = svg.append("g").attr("class", "d3-axis"), rowsG = svg.append("g");
      const x = d3.scaleLinear(), y = d3.scaleBand().padding(0.18);
      const rnd = () => Math.round(8 + Math.random() * 110);
      let data = d3.shuffle(COUNTIES.map((name, idx) => ({ name, idx }))).slice(0, 10).map((d) => ({ ...d, value: rnd() }));
      let W = 0, H = 0, sorted = true, auto = true;
      ctx.onCleanup(() => svg.selectAll("*").interrupt());

      function update(animate = true) {
        if (!W) return;
        const list = [...data].sort(sorted ? (a, b) => b.value - a.value : (a, b) => a.idx - b.idx);
        const iw = W - m.l - m.r, ih = H - m.t - m.b;
        x.domain([0, d3.max(data, (d) => d.value) || 1]).nice().range([0, iw]);
        y.domain(list.map((d) => d.name)).range([0, ih]);
        const bw = y.bandwidth(), fs = clamp(bw * 0.62, 9, 13);
        const tr = svg.transition().duration(animate ? 750 : 0).ease(d3.easeCubicInOut);
        axisG.attr("transform", `translate(${m.l},${m.t})`).transition(tr)
          .call(d3.axisTop(x).ticks(Math.max(2, Math.floor(iw / 90))).tickSizeInner(-ih).tickSizeOuter(0))
          .call((g) => g.selectAll(".tick line").attr("stroke-opacity", 0.5));
        rowsG.attr("transform", `translate(${m.l},${m.t})`).selectAll("g.d3-row").data(list, (d) => d.name).join(
          (enter) => {
            const g = enter.append("g").attr("class", "d3-row").attr("transform", (d) => `translate(0,${y(d.name)})`).style("opacity", 0);
            g.append("rect").attr("rx", 3).attr("height", bw).attr("width", 0).attr("fill", C[3]);
            g.append("text").attr("class", "nm").attr("x", -8).attr("text-anchor", "end").attr("dy", "0.35em").text((d) => d.name);
            g.append("text").attr("class", "val d3-num").attr("dy", "0.35em").attr("x", 6).text("0");
            return g;
          },
          (upd) => upd,
          (exit) => {
            exit.classed("d3-row", false).select("rect").attr("fill", C[2]);
            exit.transition(tr).style("opacity", 0).attr("transform", function () { return `${this.getAttribute("transform")} translate(30,0)`; }).remove();
          },
        ).call((sel) => {
          sel.transition(tr).style("opacity", 1).attr("transform", (d) => `translate(0,${y(d.name)})`);

        const focus = svg.append("g").attr("transform", `translate(${m.l},${m.t})`);
        const context = svg.append("g").attr("transform", `translate(${m.l},${m.t + fh + gap})`);
        const area = (xs, ys, h) => d3.area().curve(d3.curveMonotoneX).x((d) => xs(d.date)).y0(h).y1((d) => ys(d.value));
        const grad = svg.select("defs").append("linearGradient").attr("id", `${clipId}g`).attr("x1", 0).attr("x2", 0).attr("y1", 0).attr("y2", 1);
        grad.append("stop").attr("offset", 0).attr("stop-color", rgba(C[1], 0.55));
        grad.append("stop").attr("offset", 1).attr("stop-color", rgba(C[1], 0.04));
        const yAxis = focus.append("g").attr("class", "d3-axis").call(d3.axisLeft(y).ticks(Math.max(3, fh / 50)).tickSize(-iw)).call((g) => g.selectAll(".tick line").attr("stroke-opacity", 0.35));
        yAxis.select(".domain").remove();
        const body = focus.append("g").attr("clip-path", `url(#${clipId})`);
        const fArea = body.append("path").datum(data).attr("fill", `url(#${clipId}g)`);
        const fLine = body.append("path").datum(data).attr("fill", "none").attr("stroke", C[1]).attr("stroke-width", 1.6);
        body.append("line").attr("x1", 0).attr("x2", iw).attr("y1", y(35)).attr("y2", y(35)).attr("stroke", C[2]).attr("stroke-dasharray", "4 4");
        focus.append("text").attr("x", iw - 4).attr("y", y(35) - 5).attr("text-anchor", "end").style("font-size", "10.5px").attr("fill", C[2])
          .attr("paint-order", "stroke").attr("stroke", "#0e1013").attr("stroke-width", 3).text("35 示意門檻");
        const xAxis = focus.append("g").attr("class", "d3-axis").attr("transform", `translate(0,${fh})`);
        const cross = focus.append("g").style("display", "none");
        cross.append("line").attr("y1", 0).attr("y2", fh).attr("stroke", "rgba(255,255,255,.4)");
        cross.append("circle").attr("r", 4).attr("fill", C[0]);
        context.append("path").datum(data).attr("fill", rgba(C[1], 0.35)).attr("d", area(x2, y2, ch));
        context.append("g").attr("class", "d3-axis").attr("transform", `translate(0,${ch})`).call(d3.axisBottom(x2).ticks(Math.max(3, iw / 80)).tickFormat(tickFmt));
        redrawFocus = () => {
          fArea.attr("d", area(x, y, fh));
          fLine.attr("d", d3.line().curve(d3.curveMonotoneX).x((d) => x(d.date)).y((d) => y(d.value)));
          xAxis.call(d3.axisBottom(x).ticks(Math.max(3, iw / 80)).tickFormat(tickFmt));
          const [a, b] = x.domain(), sub = data.slice(bis.left(data, a), bis.right(data, b));
          shown = [a, b];
          if (sub.length) stat.innerHTML = `${dayFmt(a)} 至 ${dayFmt(b)}（<span class="d3-num">${sub.length}</span> 天）平均 <span class="d3-num">${d3.mean(sub, (d) => d.value).toFixed(1)}</span>，超過 35 共 <span class="d3-num">${sub.filter((d) => d.value > 35).length}</span> 天`;
        };
        brush = d3.brushX().extent([[0, 0], [iw, ch]]).on("brush end", (e) => {
          if (syncing) return;
          const s = e.selection || x2.range();
          x.domain(s.map(x2.invert, x2));
          redrawFocus();
          syncing = true;
          zoomRect.call(zoom.transform, d3.zoomIdentity.scale(iw / (s[1] - s[0])).translate(-s[0], 0));
          syncing = false;
        });
        zoom = d3.zoom().scaleExtent([1, 60]).translateExtent([[0, 0], [iw, fh]]).extent([[0, 0], [iw, fh]]).on("zoom", (e) => {
          if (syncing) return;
          x.domain(e.transform.rescaleX(x2).domain());
          redrawFocus();
          syncing = true;
          brushG.call(brush.move, x.range().map(e.transform.invertX, e.transform));
          syncing = false;
        });
        brushG = context.append("g").call(brush);
        brushG.selectAll(".selection").attr("fill", C[0]).attr("fill-opacity", 0.18).attr("stroke", C[0]);
        zoomRect = focus.append("rect").attr("width", iw).attr("height", fh).attr("fill", "transparent").style("cursor", "grab").call(zoom)
          .on("pointermove", (e) => {
            const [mx] = d3.pointer(e), i = clamp(bis.center(data, x.invert(mx)), 0, data.length - 1), d = data[i];
            cross.style("display", null).attr("transform", `translate(${x(d.date)},0)`).select("circle").attr("cy", y(d.value));
            tt.show(e, `${d3.timeFormat("%-m 月 %-d 日")(d.date)}　<b>${d.value.toFixed(1)}</b> μg/m³`);
          })
          .on("pointerleave", () => { cross.style("display", "none"); tt.hide(); });
        x.domain(shown);
        redrawFocus();
        if (+shown[0] !== +full[0] || +shown[1] !== +full[1]) brushG.call(brush.move, shown.map(x2));
      }
      const go = (a, b) => brushG.transition().duration(800).call(brush.move, [x2(a), x2(b)]);
      ctx.button("全年", () => go(...full));
      ctx.button("冬季", () => go(new Date(2025, 0, 1), new Date(2025, 2, 1)), { primary: true });
      ctx.button("梅雨季", () => go(new Date(2025, 4, 1), new Date(2025, 6, 1)));
      ctx.onCleanup(() => svg.selectAll("*").interrupt());
      fit(ctx, svg.node(), build);
    },
  },
  {
    id: "voronoi", title: "Voronoi 與等高線",
    api: "d3.Delaunay.from(points).voronoi(bounds) + d3.contourDensity()",
    desc: "四群示意點位同時算出核密度等高線（contourDensity）、Voronoi 分區與 Delaunay 三角網；滑鼠位置用 delaunay.find 找最近點並標出它的鄰居。",
    hint: "滑過找最近點・點擊新增點・調整頻寬",
    mount(ctx) {
      ctx.html(`<div class="d3-fill"><svg class="d3-svg" style="cursor:crosshair"></svg></div><div class="d3-tag">點位：<span class="d3-num"></span>　示意資料</div>`);
      const svg = d3.select(ctx.$("svg")), tt = tip(ctx), count = ctx.$(".d3-tag .d3-num");
      const gen = (seed) => {
        const rng = d3.randomLcg(seed), out = [];
        [[0.24, 0.34, 0.07], [0.64, 0.28, 0.09], [0.44, 0.7, 0.08], [0.82, 0.7, 0.06]].forEach(([cx, cy, s], k) => {
          const nx = d3.randomNormal.source(rng)(cx, s), ny = d3.randomNormal.source(rng)(cy, s);
          for (let i = 0; i < 70; i++) out.push([clamp(nx(), 0.01, 0.99), clamp(ny(), 0.01, 0.99), k]);
        });
        for (let i = 0; i < 40; i++) out.push([rng(), rng(), 4]);
        return out;
      };
      let pts = gen(11), bw = 18, showC = true, showV = true, showT = false, W = 0, H = 0, delaunay, voronoi;
      const color = d3.scaleSequential(d3.interpolateRgbBasis(["#14171c", "#2b1d5c", "#7a3fa8", "#f72585", "#ff8c42", "#f7df1e"]));
      const contourG = svg.append("g"), voro = svg.append("path").attr("fill", "none").attr("stroke", "rgba(255,255,255,.28)").attr("stroke-width", 0.8);
      const tri = svg.append("path").attr("fill", "none").attr("stroke", rgba(C[1], 0.45)).attr("stroke-width", 0.7);
      const cell = svg.append("path").attr("fill", rgba(C[0], 0.22)).attr("stroke", C[0]).attr("stroke-width", 1.5);
      const nbr = svg.append("g").attr("stroke", C[0]).attr("stroke-width", 1.2);
      const dots = svg.append("g");
      function render() {
        if (!W) return;
        const P = pts.map((p) => [p[0] * W, p[1] * H]);
        delaunay = d3.Delaunay.from(P);
        voronoi = delaunay.voronoi([0, 0, W, H]);
        const dens = showC ? d3.contourDensity().x((d) => d[0]).y((d) => d[1]).size([W, H]).bandwidth(bw).thresholds(14)(P) : [];
        color.domain([0, d3.max(dens, (d) => d.value) || 1]);
        contourG.selectAll("path").data(dens).join("path").attr("d", d3.geoPath()).attr("fill", (d) => color(d.value)).attr("fill-opacity", 0.85)
          .attr("stroke", "rgba(14,16,19,.5)").attr("stroke-width", 0.5);
        voro.attr("d", showV ? voronoi.render() : null);
        tri.attr("d", showT ? delaunay.render() : null);
        dots.selectAll("circle").data(P).join("circle").attr("r", 2.4).attr("cx", (d) => d[0]).attr("cy", (d) => d[1])
          .attr("fill", (d, i) => [C[1], C[3], C[4], C[5], "#ecebe6", C[0]][pts[i][2]]).attr("stroke", "#0e1013").attr("stroke-width", 0.8);
        cell.attr("d", null); nbr.selectAll("line").remove();
        count.textContent = pts.length;
      }
      svg.on("pointermove", (e) => {
        if (!delaunay) return;
        const [mx, my] = d3.pointer(e), i = delaunay.find(mx, my), p = [delaunay.points[2 * i], delaunay.points[2 * i + 1]];
        const ns = [...delaunay.neighbors(i)];
        cell.attr("d", voronoi.renderCell(i));
        nbr.selectAll("line").data(ns).join("line").attr("x1", p[0]).attr("y1", p[1]).attr("x2", (j) => delaunay.points[2 * j]).attr("y2", (j) => delaunay.points[2 * j + 1]);
        tt.show(e, `最近點 #${i + 1}・Delaunay 鄰居 <b>${ns.length}</b> 個`);
      }).on("pointerleave", () => { cell.attr("d", null); nbr.selectAll("line").remove(); tt.hide(); })
        .on("click", (e) => { const [mx, my] = d3.pointer(e); pts = [...pts, [mx / W, my / H, 5]]; render(); });
      ctx.slider("頻寬", { min: 6, max: 40, step: 1, value: bw }, (v) => { bw = v; render(); });
      ctx.toggle("等高線", showC, (v) => { showC = v; render(); });
      ctx.toggle("Voronoi", showV, (v) => { showV = v; render(); });
      ctx.toggle("三角網", showT, (v) => { showT = v; render(); });
      ctx.button("重新取樣", () => { pts = gen(Math.random()); render(); });
      fit(ctx, svg.node(), ({ width, height }) => { W = width; H = height; svg.attr("viewBox", [0, 0, W, H]); render(); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "selection.attr(\"cx\", i => x(xs[i])) vs canvas + d3.scaleLinear",
    desc: "N 個點每格移動一次：SVG 模式用資料連結建立 <circle>，每格以 selection.attr 改寫座標；Canvas 模式一樣用 d3 比例尺算座標，但直接畫在點陣上。",
    hint: "按「自動加壓」開始；切換 SVG／Canvas 後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="d3-stress"><canvas></canvas><svg class="d3-svg"></svg></div>`);
      const box = ctx.$(".d3-stress"), cv = ctx.$("canvas"), g2 = cv.getContext("2d");
      const svg = d3.select(ctx.$("svg")), layer = svg.append("g");
      const SVG_CAP = 50000;
      const sx = d3.scaleLinear([0, 1], [0, 1]), sy = d3.scaleLinear([0, 1], [0, 1]);
      let mode = 0, n = 0, drawn = 0, W = 1, H = 1, dpr = 1, circles = layer.selectAll("circle");
      let xs = new Float32Array(0), ys = xs, vx = xs, vy = xs;
      fit(ctx, box, ({ width, height }) => {
        W = width; H = height; dpr = Math.min(2, devicePixelRatio || 1);
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        sx.range([4, W - 4]); sy.range([H - 4, 4]);
        svg.attr("viewBox", [0, 0, W, H]);
      });
      function seed(count) {
        xs = new Float32Array(count); ys = new Float32Array(count); vx = new Float32Array(count); vy = new Float32Array(count);
        const rx = d3.randomNormal(0.5, 0.17);
        for (let i = 0; i < count; i++) {
          xs[i] = clamp(rx(), 0, 1); ys[i] = clamp(rx(), 0, 1);
          const a = Math.random() * Math.PI * 2, s = 0.00003 + Math.random() * 0.0001;
          vx[i] = Math.cos(a) * s; vy[i] = Math.sin(a) * s;
        }
      }
      function rebuild() {
        drawn = mode === 0 ? Math.min(n, SVG_CAP) : n;
        circles = layer.selectAll("circle").data(mode === 0 ? d3.range(drawn) : []).join("circle").attr("r", 1.5).attr("fill", (i) => C[i & 3]);
        svg.style("display", mode === 0 ? null : "none");
        cv.style.display = mode === 1 ? "" : "none";
      }
      ctx.raf((t, dt) => {
        for (let i = 0; i < n; i++) {
          let x = xs[i] + vx[i] * dt, y = ys[i] + vy[i] * dt;
          if (x < 0 || x > 1) { vx[i] = -vx[i]; x = xs[i]; }
          if (y < 0 || y > 1) { vy[i] = -vy[i]; y = ys[i]; }
          xs[i] = x; ys[i] = y;
        }
        if (mode === 0) { circles.attr("cx", (i) => sx(xs[i])).attr("cy", (i) => sy(ys[i])); return; }
        g2.setTransform(dpr, 0, 0, dpr, 0, 0);
        g2.clearRect(0, 0, W, H);
        for (let k = 0; k < 4; k++) {
          g2.fillStyle = C[k];
          g2.beginPath();
          for (let i = k; i < n; i += 4) g2.rect(sx(xs[i]) - 1, sy(ys[i]) - 1, 2, 2);
          g2.fill();
        }
      });
      ctx.group(["SVG", "Canvas"], 0, (i) => { mode = i; rebuild(); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "移動點", steps: [1000, 2500, 5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000],
        minFps: 30,
        apply(count) { n = count; seed(count); rebuild(); },
        metrics: () => ({ "模式": mode === 0 ? "SVG" : "Canvas", "實際繪製": drawn, "DOM 節點": mode === 0 ? drawn : 1 }),
        note: "每格都更新全部點的位置。SVG 模式的瓶頸是大量 DOM 屬性寫入與重新繪製，節點越多越慢；Canvas 模式只有一個元素，成本集中在 JS 迴圈與點陣繪製。為避免分頁卡死，SVG 模式最多建立 5 萬個節點（看「實際繪製」欄）。",
      });
    },
  },
] });
</script>
