<script type="text/plain" id="dy-trip-css">
.main { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 12px; }
.themes { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; scrollbar-width: thin; min-height: 0; }
.tile { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 9px; border-radius: var(--radius-box);
  background: var(--color-base-100); color: var(--color-base-content); border: 2px solid transparent; cursor: pointer; font-weight: 600; font-size: 12px; }

.content { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-auto-rows: max-content; gap: 12px; align-content: start; overflow-y: auto; min-height: 0; scrollbar-width: thin; }

  .content { grid-template-columns: minmax(0, 1fr); }

<script type="text/plain" id="dy-trip-js">
const THEMES = [["sunset", "夕陽"], ["light", "淺色"], ["dark", "深色"], ["cupcake", "杯子蛋糕"], ["synthwave", "合成波"], ["retro", "復古"],
  ["cyberpunk", "賽博龐克"], ["valentine", "情人節"], ["nord", "北歐"], ["dracula", "德古拉"], ["coffee", "咖啡"], ["emerald", "翡翠"], ["caramellatte", "焦糖拿鐵"], ["abyss", "深淵"]];
const STOPS = ["台北", "宜蘭", "花蓮", "台東", "墾丁"];
const $ = (id) => document.getElementById(id);
let stop = 2;
$("themes").innerHTML = THEMES.map(([id, label]) => `<button class="tile" data-theme="${id}" data-set="${id}" aria-pressed="${id === "sunset"}">
  <span>${label}</span><span class="dots"><i class="bg-primary"></i><i class="bg-secondary"></i><i class="bg-accent"></i><i class="bg-neutral"></i></span></button>`).join("");
$("themes").addEventListener("click", (e) => {
  const t = e.target.closest(".tile");
  if (!t) return;
  document.documentElement.dataset.theme = t.dataset.set;
  $("themeName").textContent = t.dataset.set;
  document.querySelectorAll(".tile").forEach((x) => x.setAttribute("aria-pressed", x === t));
});
function toast(text, kind = "success") {
  const el = Object.assign(document.createElement("div"), { className: `alert alert-${kind} py-2 text-sm`, textContent: text });
  $("toasts").append(el);
  setTimeout(() => el.remove(), 2200);
}
function renderRoute() {
  $("steps").innerHTML = STOPS.map((s, i) => `<li class="step${i <= stop ? " step-primary" : ""}" data-content="${i < stop ? "✓" : i === stop ? "●" : ""}">${s}</li>`).join("");
  const pct = Math.round((stop / (STOPS.length - 1)) * 100);
  $("prog").value = pct;
  $("pct").textContent = `${pct}%`;
  $("dayText").textContent = `第 ${stop + 1} 天`;
  $("legText").textContent = stop < STOPS.length - 1 ? `${STOPS[stop]} → ${STOPS[stop + 1]}` : "已抵達終點";
}
$("next").addEventListener("click", () => {
  if (stop >= STOPS.length - 1) return toast("已經是最後一站囉", "warning");
  stop++;
  renderRoute();
  toast(`抵達${STOPS[stop]}，記得打卡`, stop === STOPS.length - 1 ? "info" : "success");
});
$("prev").addEventListener("click", () => { if (stop > 0) { stop--; renderRoute(); } });
$("say").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = $("msg").value.trim();
  if (!text) return;
  const add = (who, cls, msg) => {
    const row = document.createElement("div");
    row.className = `chat ${who === "我" ? "chat-end" : "chat-start"}`;
    row.innerHTML = `<div class="chat-header text-xs opacity-60">${who}</div><div class="chat-bubble ${cls} text-sm"></div>`;
    row.lastChild.textContent = msg;
    $("chat").append(row);
    $("chat").scrollTop = $("chat").scrollHeight;
  };
  add("我", "chat-bubble-primary", text);
  $("msg").value = "";
  setTimeout(() => add("阿凱", "chat-bubble-secondary", "收到 👍"), 700);
});
$("budget").addEventListener("input", () => ($("budgetText").textContent = `NT$${(+$("budget").value).toLocaleString("zh-TW")}`));
$("save").addEventListener("click", () => toast(`已儲存：每晚 ${$("budgetText").textContent} 以內`));
$("bell").addEventListener("click", () => $("inbox").showModal());
$("readAll").addEventListener("click", () => { $("unread").hidden = true; toast("通知已全部標為已讀", "info"); });
// Countdown: updating --value lets daisyUI animate each digit.
let left = 9 * 3600 + 14 * 60 + 36;
setInterval(() => {
  left = Math.max(0, left - 1);
  [["hh", Math.floor(left / 3600)], ["mm", Math.floor(left / 60) % 60], ["ss", left % 60]].forEach(([id, v]) => {
    $(id).style.setProperty("--value", v);
    $(id).textContent = String(v).padStart(2, "0");
  });
}, 1000);
renderRoute();
</script>

<script>
// daisyUI showcase. daisyUI and Tailwind restyle :root, html and every form element, so each scene runs
// inside an iframe srcdoc: themes, preflight and fixed-position components stay inside the frame.
const { h, fmtMs, fmtCompact } = Showcase;
const CDN = "https://cdn.jsdelivr.net/npm/";
const DAISY_CSS = `${CDN}daisyui@5.7.47/daisyui.css`, THEMES_CSS = `${CDN}daisyui@5.7.47/themes.css`;
const TW_JS = `${CDN}@tailwindcss/browser@4.3.3/dist/index.global.js`;
const IMG = (n) => new URL(`_shared/img/photo-${n}.jpg`, location.href).href;
const FONT = getComputedStyle(document.body).fontFamily;
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim() || "monospace";
const THEMES = ["light", "dark", "cupcake", "bumblebee", "emerald", "corporate", "synthwave", "retro", "cyberpunk", "valentine", "halloween", "garden",
  "forest", "aqua", "lofi", "pastel", "fantasy", "wireframe", "black", "luxury", "dracula", "cmyk", "autumn", "business", "acid", "lemonade",
  "night", "coffee", "winter", "dim", "nord", "sunset", "caramellatte", "abyss", "silk"];
const COLORS = ["primary", "secondary", "accent", "neutral", "info", "success", "warning", "error"];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Creates the scene iframe and resolves with its document once the CSS (and Tailwind, unless tw is false) has run.
function daisyFrame(ctx, host, { theme = "dark", css = "", body = "", script = "", tw = true, label = "daisyUI 場景" }) {
  const f = h("iframe", { class: "dy-frame", title: label });
  f.srcdoc = `<!doctype html><html lang="zh-Hant" data-theme="${theme}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">` +
    `<link rel="stylesheet" href="${DAISY_CSS}"><link rel="stylesheet" href="${THEMES_CSS}">` +
    `<style>html,body{font-family:${FONT}}body{margin:0;background:var(--color-base-200);color:var(--color-base-content);transition:background .3s}` +
    `.mono,code,kbd,pre{font-family:${MONO}}${css}</style></head><body>${body}` +
    (tw ? `<script src="${TW_JS}"><\/script>` : "") + (script ? `<script>${script}<\/script>` : "") + `</body></html>`;
  ctx.onCleanup(() => f.remove());
  return new Promise((resolve) => {
    f.addEventListener("load", async () => {
      if (!ctx.active) return resolve(null);
      await new Promise((r) => f.contentWindow.requestAnimationFrame(() => setTimeout(r, 30)));
      resolve(ctx.active ? { f, doc: f.contentDocument, win: f.contentWindow } : null);
    }, { once: true });
    host.append(f);
  });
}
const frameHost = (ctx, extra = "") => { ctx.html(`<div class="dy-fill"><div class="dy-host ${extra}"></div></div>`); return ctx.$(".dy-host"); };
const themeSelect = (ctx, doc, value, list = THEMES) => ctx.select("主題", list, value, (v) => { doc.documentElement.dataset.theme = v; });

// ---------- scene 4: component catalogue panels ----------
const sec = (title, code, inner) => `<section class="dy-sec"><h3>${title}<code>${code}</code></h3>${inner}</section>`;
const CATALOG = {
  動作: () => [
    sec("按鈕顏色", "btn-{color}", `<div class="flex flex-wrap gap-2">${COLORS.map((c) => `<button class="btn btn-${c}">${c}</button>`).join("")}</div>`),
    sec("按鈕樣式", "btn-soft・outline・dash・ghost・link", `<div class="flex flex-wrap gap-2">${["", "btn-soft", "btn-outline", "btn-dash", "btn-ghost", "btn-link"].map((s) => `<button class="btn btn-primary ${s}">${s.replace("btn-", "") || "預設"}</button>`).join("")}<button class="btn btn-disabled">停用</button></div>`),
    sec("尺寸與形狀", "btn-xs…xl・square・circle", `<div class="flex flex-wrap items-center gap-2">${["xs", "sm", "md", "lg", "xl"].map((s) => `<button class="btn btn-secondary btn-${s}">${s}</button>`).join("")}<button class="btn btn-square btn-accent">＋</button><button class="btn btn-circle btn-accent"><span class="loading loading-spinner loading-sm"></span></button><button class="btn btn-wide btn-neutral">btn-wide</button></div>`),
    sec("群組", "join", `<div class="flex flex-wrap gap-3"><div class="join">${["日", "週", "月"].map((s, i) => `<input class="join-item btn btn-sm" type="radio" name="jr" aria-label="${s}"${i === 1 ? " checked" : ""}>`).join("")}</div>
      <div class="join"><input class="input input-sm join-item w-32" placeholder="搜尋景點"><select class="select select-sm join-item w-24"><option>全部</option><option>海景</option></select><button class="btn btn-sm btn-primary join-item">找</button></div></div>`),
    sec("下拉與切換", "dropdown・swap", `<div class="flex flex-wrap items-center gap-3"><details class="dropdown"><summary class="btn btn-sm">更多動作 ▾</summary><ul class="menu dropdown-content bg-base-100 rounded-box z-10 w-40 p-2 shadow-sm"><li><a>分享行程</a></li><li><a>匯出 PDF</a></li><li><a class="text-error">刪除</a></li></ul></details>
      <label class="swap swap-rotate text-3xl"><input type="checkbox" aria-label="切換日夜"><span class="swap-on">☀️</span><span class="swap-off">🌙</span></label>
      <label class="swap swap-flip text-3xl"><input type="checkbox" aria-label="切換表情"><span class="swap-on">😈</span><span class="swap-off">😇</span></label></div>`),
  ],
  資料: () => [
    sec("統計", "stats", `<div class="stats stats-vertical sm:stats-horizontal shadow-sm bg-base-100 w-full"><div class="stat"><div class="stat-title">今日里程</div><div class="stat-value text-primary">86 km</div><div class="stat-desc">↗ 比昨天多 12%</div></div><div class="stat"><div class="stat-title">爬升</div><div class="stat-value">620 m</div><div class="stat-desc">↘ 3%</div></div></div>`),
    sec("卡片與比較", "card・diff", `<div class="grid sm:grid-cols-2 gap-3"><div class="card card-sm bg-base-100 shadow-sm"><figure><img src="${IMG(3)}" alt="海岸" class="h-28 w-full object-cover"></figure><div class="card-body"><h4 class="card-title">清水斷崖 <span class="badge badge-secondary badge-sm">熱門</span></h4><p>太平洋與峭壁交會，建議清晨通過。</p><div class="card-actions justify-end"><button class="btn btn-primary btn-sm">加入行程</button></div></div></div>
      <figure class="diff rounded-box aspect-[4/3]" tabindex="0"><div class="diff-item-1" role="img"><img src="${IMG(6)}" alt="原圖"></div><div class="diff-item-2" role="img"><img src="${IMG(6)}" alt="灰階" style="filter:grayscale(1)"></div><div class="diff-resizer"></div></figure></div>`),

            <div class="rating" data-k="rating">${[1, 2, 3, 4, 5].map((n) => `<input type="radio" name="rate" value="${n}" class="mask mask-heart bg-error" aria-label="${n} 分"${n === 4 ? " checked" : ""}>`).join("")}</div>
            <div class="flex gap-2 mt-2"><button ${k("btn", "btn-primary")} type="submit">送出</button><button ${k("btn", "btn-ghost")} type="reset">重設</button></div>
          </fieldset>
        </div>
        <div class="bg-base-100 border border-base-300 rounded-box p-3 flex flex-col gap-2 min-w-0"><b class="text-sm">送出結果<span class="opacity-60 font-normal">（new FormData(form)）</span></b><pre class="dy-out text-xs whitespace-pre-wrap break-all opacity-80">尚未送出。直接按「送出」，瀏覽器會擋下並把欄位標成 :user-invalid。</pre></div>
      </form>` });
      if (!fr) return;
      const form = fr.doc.querySelector("form"), out = fr.doc.querySelector(".dy-out");
      ctx.on(form, "submit", (e) => {
        e.preventDefault();
        const rows = [...new FormData(form)].map(([key, val]) => `${key}: ${val instanceof fr.win.File ? `File(${val.name || "未選"})` : val}`);
        out.textContent = `通過驗證，共 ${rows.length} 個欄位\n${rows.join("\n")}`;
      });
      ctx.on(form, "invalid", () => { out.textContent = `被瀏覽器擋下：${form.querySelectorAll(":invalid").length} 個欄位不合格（紅框與下方提示都來自 CSS）`; }, true);
      ctx.on(form, "reset", () => { out.textContent = "已重設"; });
      const setVar = (re, make) => form.querySelectorAll("[data-k]").forEach((el) => {
        const base = el.dataset.k;
        el.className = el.className.split(/\s+/).filter((c) => !re(base).test(c)).join(" ");
        const add = make(base, el); if (add) el.classList.add(add);
      });
      const SIZES = ["xs", "sm", "md", "lg", "xl"];
      ctx.group(SIZES, 2, (i) => setVar((b) => new RegExp(`^${b}-(xs|sm|md|lg|xl)$`), (b) => `${b}-${SIZES[i]}`));
      ctx.select("顏色", ["primary", "secondary", "accent", "info", "success", "warning", "error"], "primary", (c) =>
        setVar((b) => new RegExp(`^${b}-(${COLORS.join("|")})$`), (b, el) => (["toggle", "radio", "checkbox", "range"].includes(b) || (b === "btn" && el.type === "submit") ? `${b}-${c}` : "")));
      setVar((b) => /^$/, (b, el) => (["toggle", "radio", "checkbox", "range"].includes(b) ? `${b}-primary` : ""));
      themeSelect(ctx, fr.doc, "dark", ["dark", "light", "corporate", "emerald", "dracula", "nord"]);
    },
  },
  {

    api: "modal-toggle・drawer-toggle・collapse・tabs (radio)・swap・details.dropdown・theme-controller",
    desc: "daisyUI 的互動元件大多不需要 JavaScript：對話框與抽屜靠隱藏的 checkbox，手風琴與分頁靠同名 radio，下拉選單靠 <details>，翻轉圖示靠 swap，連換主題都能用 theme-controller（:root:has(input:checked) 選擇器）。iframe 裡沒有任何事件處理程式；下方一行狀態是外框讀 :checked 與 [open] 得到的。",

            <label class="flex items-center gap-2"><input type="radio" name="dy-tc" value="retro" class="radio radio-sm theme-controller" data-n="retro">retro</label></div></div>

            <label class="btn btn-circle swap swap-rotate"><input type="checkbox" data-n="選單圖示" aria-label="切換選單圖示"><span class="swap-off text-xl">☰</span><span class="swap-on text-xl">✕</span></label>
            <details class="dropdown" data-n="下拉選單"><summary class="btn btn-sm">更多 ▾</summary><ul class="menu dropdown-content bg-base-100 rounded-box z-10 w-36 p-2 shadow"><li><a>分享</a></li><li><a>匯出</a></li></ul></details></div></div></div>
          <div class="flex flex-col gap-2 lg:col-span-2">${[["第一天：台北到宜蘭", "走濱海公路，在福隆吃便當。"], ["第二天：宜蘭到花蓮", "蘇花公路建議上午通過。"], ["第三天：花蓮到台東", "台 11 線看海，晚上住都蘭。"]].map(([t, c], i) => `<div class="collapse collapse-arrow bg-base-100 border border-base-300"><input type="radio" name="dy-acc" data-n="手風琴 ${i + 1}"${i ? "" : " checked"}><div class="collapse-title font-semibold">${t}</div><div class="collapse-content text-sm">${c}</div></div>`).join("")}</div>
          <div class="tabs tabs-lift">${[["路線", "台 9 線、台 11 線"], ["住宿", "民宿 5 晚、露營 3 晚"], ["預算", "每人約 NT$18,000"]].map(([t, c], i) => `<input type="radio" name="dy-tab" class="tab" aria-label="${t}" data-n="分頁 ${t}"${i ? "" : " checked"}><div class="tab-content bg-base-100 border-base-300 p-4">${c}</div>`).join("")}</div>
          <div class="card bg-base-100 card-sm sm:col-span-2 lg:col-span-3"><div class="card-body py-2"><div class="text-xs opacity-70">目前狀態：<span class="dy-state mono"></span></div></div></div>
        </div>
        <div class="drawer-side z-20"><label for="dy-drw" aria-label="關閉抽屜" class="drawer-overlay"></label><ul class="menu bg-base-100 min-h-full w-64 p-4"><li class="menu-title">環島選單</li><li><a>路線總覽</a></li><li><a>每日行程</a></li><li><a>預算</a></li><li><label for="dy-drw">關閉</label></li></ul></div>
      </div>
      <input type="checkbox" id="dy-modal" class="modal-toggle" data-n="對話框"><div class="modal" role="dialog"><div class="modal-box"><h3 class="text-lg font-bold">純 CSS 對話框</h3><p class="py-3">這個對話框靠 .modal-toggle:checked + .modal 顯示，點背景或按鈕關閉。</p><div class="modal-action"><label for="dy-modal" class="btn btn-sm">關閉</label></div></div><label class="modal-backdrop" for="dy-modal">關閉</label></div>` });
      if (!fr) return;
      const { doc } = fr, state = doc.querySelector(".dy-state");
      // Read-only status line: the frame itself has no handlers; this only reports which inputs are checked.
      const paint = () => {
        const on = [...doc.querySelectorAll("input[data-n]:checked, details[data-n][open]")].map((e) => e.dataset.n);
        state.textContent = on.join("、") || "（全部關閉）";
      };
      ctx.on(doc, "change", paint);
      ctx.on(doc, "toggle", paint, true);
      paint();
    },
  },
  {
    id: "responsive", title: "響應式斷點",
    api: "sm: md: lg: xl: 前綴 + stats-vertical md:stats-horizontal + sm:card-side",
    desc: "daisyUI 的元件 class 都能加 Tailwind 的斷點前綴，例如 stats-vertical md:stats-horizontal、steps-vertical sm:steps-horizontal、sm:card-side、sm:footer-horizontal。iframe 本身就是一個視窗，拖動寬度滑桿時裡面的媒體查詢會真的重新判斷：導覽列在 lg 以下收成漢堡選單，卡片欄數與統計方向跟著變。右上角的斷點徽章也是純 CSS。",
    hint: "拖「框寬」從手機寬拉到桌機寬，看版面怎麼重排",
    async mount(ctx) {
      const host = frameHost(ctx, "dy-ruler");
      const bp = `<span class="badge badge-primary mono"><span class="sm:hidden">base &lt; 640</span><span class="hidden sm:inline md:hidden">sm ≥ 640</span><span class="hidden md:inline lg:hidden">md ≥ 768</span><span class="hidden lg:inline xl:hidden">lg ≥ 1024</span><span class="hidden xl:inline">xl ≥ 1280</span></span>`;
      const fr = await daisyFrame(ctx, host, { theme: "emerald", label: "響應式斷點", body: `<div class="navbar bg-base-100 shadow-sm sticky top-0 z-10">
          <div class="navbar-start"><details class="dropdown lg:hidden"><summary class="btn btn-ghost btn-square" aria-label="選單">☰</summary><ul class="menu dropdown-content bg-base-100 rounded-box z-10 w-40 p-2 shadow"><li><a>路線</a></li><li><a>住宿</a></li><li><a>預算</a></li></ul></details><a class="btn btn-ghost text-lg">🧭 環島</a></div>
          <div class="navbar-center hidden lg:flex"><ul class="menu menu-horizontal"><li><a class="menu-active">路線</a></li><li><a>住宿</a></li><li><a>預算</a></li></ul></div>
          <div class="navbar-end gap-2">${bp}<button class="btn btn-primary btn-sm hidden sm:inline-flex">報名</button></div></div>
        <main class="p-3 sm:p-5 flex flex-col gap-4">
          <div class="stats stats-vertical md:stats-horizontal shadow-sm bg-base-100 w-full"><div class="stat"><div class="stat-title">總里程</div><div class="stat-value text-primary">980 km</div></div><div class="stat"><div class="stat-title">天數</div><div class="stat-value">9 天</div></div><div class="stat"><div class="stat-title">報名</div><div class="stat-value text-secondary">128 人</div></div></div>
          <ul class="steps steps-vertical sm:steps-horizontal w-full">${["台北", "宜蘭", "花蓮", "台東", "墾丁"].map((s, i) => `<li class="step${i < 3 ? " step-primary" : ""}">${s}</li>`).join("")}</ul>
          <div class="card sm:card-side bg-base-100 shadow-sm overflow-hidden"><figure class="sm:w-2/5 shrink-0"><img src="${IMG(2)}" alt="山路" class="h-40 sm:h-full w-full object-cover"></figure><div class="card-body"><h2 class="card-title">本週精選：南橫公路</h2><p>sm 以上 card-side 讓圖片靠左、文字在右；更窄時圖片在上。</p><div class="card-actions justify-end"><button class="btn btn-primary btn-sm">看路線</button></div></div></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">${[[5, "海線"], [6, "山線"], [7, "湖畔"], [8, "老街"]].map(([n, t]) => `<div class="card card-sm bg-base-100 shadow-sm"><figure><img src="${IMG(n)}" alt="${t}" class="h-24 w-full object-cover"></figure><div class="card-body"><h3 class="card-title text-base">${t}</h3><span class="badge badge-outline badge-sm">sm:2 欄・lg:4 欄</span></div></div>`).join("")}</div>
          <div class="join join-vertical sm:join-horizontal">${["上一站", "總覽", "下一站"].map((t) => `<button class="btn join-item">${t}</button>`).join("")}</div>
        </main>
        <footer class="footer sm:footer-horizontal bg-neutral text-neutral-content p-6"><nav><h6 class="footer-title">服務</h6><a class="link link-hover">路線規劃</a><a class="link link-hover">裝備租借</a></nav><nav><h6 class="footer-title">關於</h6><a class="link link-hover">團隊</a><a class="link link-hover">聯絡</a></nav><aside class="text-xs opacity-70">footer 在 sm 以上橫排</aside></footer>` });
      if (!fr) return;

      const name = (w) => (w >= 1280 ? "xl" : w >= 1024 ? "lg" : w >= 768 ? "md" : w >= 640 ? "sm" : "base");

      const start = Math.min(max, 820);
      ctx.slider("框寬", { min: 320, max, step: 10, value: start, format: (w) => `${w}px・${name(w)}` }, setW);
      themeSelect(ctx, fr.doc, "emerald", ["emerald", "light", "dark", "corporate", "night", "retro"]);

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × daisyUI 元件 → 首次渲染 + 換 data-theme",
    desc: "在 iframe 裡一次插入 N 個 daisyUI 元件，量兩件事：首次渲染（innerHTML 解析加上樣式計算與排版）以及把 data-theme 換成另一個主題後的重算時間。daisyUI 的顏色、圓角、邊框全部來自 CSS 變數，換主題等於讓每個元素重新解析變數。這個 iframe 不載 Tailwind，只量 daisyUI 本身的 CSS。",
    hint: "按「開始測試」；切換元件種類後再測一次",
    async mount(ctx) {
      ctx.html(`<div class="dy-stress"><div class="dy-sinfo mono">尚未測試</div><div class="dy-host"></div></div>`);
      const info = ctx.$(".dy-sinfo");
      ctx.controls.classList.add("bottom");
      const KINDS = [
        { label: "按鈕", html: (i) => `<button class="btn btn-sm btn-${COLORS[i % 8]}">#${i}</button>` },
        { label: "開關＋徽章", html: (i) => `<label class="label"><input type="checkbox" class="toggle toggle-sm toggle-${COLORS[i % 8]}"${i % 2 ? " checked" : ""}><span class="badge badge-${COLORS[(i + 3) % 8]}">${i}</span></label>` },
        { label: "卡片", html: (i) => `<div class="card card-xs bg-base-100" style="width:150px"><div class="card-body"><h3 class="card-title">#${i}</h3><progress class="progress progress-${COLORS[i % 8]}" value="${i % 100}" max="100"></progress><button class="btn btn-xs btn-${COLORS[i % 8]}">開啟</button></div></div>` },
        { label: "混合", html: (i) => [`<button class="btn btn-sm btn-soft btn-${COLORS[i % 8]}">#${i}</button>`, `<input class="input input-sm" style="width:110px" value="${i}">`, `<span class="badge badge-outline badge-${COLORS[i % 8]}">${i}</span>`, `<input type="checkbox" class="checkbox checkbox-sm"${i % 3 ? "" : " checked"}>`, `<div class="radial-progress" style="--value:${i % 100};--size:2.4rem;font-size:10px">${i % 100}</div>`][i % 5] },
      ];
      let kind = 0;
      ctx.group(KINDS.map((k) => k.label), 0, (i) => { kind = i; });
      const fr = await daisyFrame(ctx, ctx.$(".dy-host"), { theme: "dark", tw: false, label: "極限測試",
        body: `<div id="g" style="display:flex;flex-wrap:wrap;gap:4px;padding:8px;align-content:flex-start"></div>` });
      if (!fr) return;
      const { doc } = fr, root = doc.documentElement, g = doc.getElementById("g");
      ctx.bench({
        label: "元件數", unit: "個", sizes: [100, 500, 1000, 2500, 5000, 10000, 20000],
        prepare(n) {
          root.dataset.theme = "dark";
          g.textContent = ""; void doc.body.offsetHeight;
          const k = KINDS[kind];
          let s = "";
          for (let i = 0; i < n; i++) s += k.html(i);
          return s;
        },
        run(n, s) {
          const t0 = performance.now();
          g.innerHTML = s;
          void doc.body.offsetHeight;
          g.lastElementChild?.getBoundingClientRect();
          const t1 = performance.now();
          root.dataset.theme = "cupcake";
          void doc.body.offsetHeight;
          getComputedStyle(g.lastElementChild).backgroundColor;
          const t2 = performance.now();
          info.textContent = `${fmtCompact(n)} 個「${KINDS[kind].label}」・首次渲染 ${fmtMs(t1 - t0)}・dark → cupcake ${fmtMs(t2 - t1)}・DOM 節點 ${fmtCompact(g.getElementsByTagName("*").length)}`;
          return `渲染 ${fmtMs(t1 - t0)}・換主題 ${fmtMs(t2 - t1)}`;
        },
        note: "耗時含 innerHTML 解析、套用 daisyUI 選擇器的樣式計算、第一次排版，以及把 data-theme 從 dark 換成 cupcake 後的樣式重算與排版；不含繪製。換主題時所有 --color-*、--radius-* 變數都要重新解析，元件越多、每個元件的子元素越多，重算越久。超過 2 秒的級距之後略過。",
      });
    },
  },
  ],
});
</script>
