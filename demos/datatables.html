<style>
  :root { --dtd-ink: #6b2d5c; --dtd-ink-2: #f6eaf2; --dtd-hi: #c23b52; }
  .dtd-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; min-height: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px calc(var(--sc-ctl-b, 0px) + 8px); }
  .dtd-main { flex: 1; min-height: 0; min-width: 0; }
  .dtd-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 8px; }
  .dtd-split > .dtd-main { height: 100%; }
  .dtd-log { flex: none; min-height: 18px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dtd-log b { color: var(--fg); font-weight: 600; }
  .dtd-log em { font-style: normal; color: var(--dtd-hi); font-weight: 600; }
  .dtd-log .ok { color: #2b6a30; font-weight: 600; }
  .dtd-side { min-height: 0; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
  .dtd-cap { flex: none; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .dtd-cap b { color: var(--fg); }
  .dtd-cap code, .dtd-kv code { font: 11px var(--mono); color: var(--dtd-ink); }
  .dtd-kv { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 8px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-content: start; font-size: 12px; }
  .dtd-kv dt { color: var(--muted); white-space: nowrap; }
  .dtd-kv dd.dtd-wide { grid-column: 2 / -1; }
  .dtd-kv dd { margin: 0; color: var(--fg); word-break: break-all; font-variant-numeric: tabular-nums; }
  .dtd-pre { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 8px 10px; font: 11.5px/1.6 var(--font); white-space: pre; color: #3d2236; background: #fbfaf7; font-variant-numeric: tabular-nums; }
  .dtd-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; display: flex; flex-direction: column; gap: 8px; }
  .dtd-res { flex: none; border-collapse: collapse; font-size: 12px; background: #fff; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .dtd-res th { font: 600 11.5px var(--font); color: var(--muted); background: #f4f3ee; text-align: right; padding: 4px 8px; white-space: nowrap; }
  .dtd-res th:first-child, .dtd-res td:first-child { text-align: left; }

  @media (max-width: 760px) { .dtd-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); } }
  @media (max-width: 800px) { .dtd-split { grid-template-columns: minmax(0, 1fr) 200px; } }

  /* Let the DataTables container fill its frame: controls stay put, only the table area scrolls */

    display: block; flex: 1 1 0; min-height: 0; overflow: auto; margin: 0; background: #fff;
    border: 1px solid var(--line); border-radius: 8px;
  }
  .dtd-main .dt-container .dt-search input { width: 220px; padding: 6px 10px; border-radius: 8px; border-color: var(--line); background: #fff; font: 13px var(--font); }

  .dtd-main div.dt-buttons > .dt-button:hover:not(.disabled) { background: var(--dtd-ink-2); border-color: var(--dtd-ink); }
  .dtd-main table.dataTable { margin: 0 !important; min-width: var(--dtd-minw, 0); }
  .dtd-main table.dataTable thead > tr > * { position: sticky; top: 0; z-index: 2; background: #f3eff2; font-size: 12px; padding: 8px !important; border-bottom: 2px solid var(--dtd-ink) !important; white-space: nowrap; }
  .dtd-main table.dataTable tbody td { padding: 7px 8px !important; border-top-color: var(--line) !important; }
  .dtd-main table.dataTable tbody tr:hover > td { background: #fbf7fa; }
  .dtd-main table.dataTable > tbody > tr.dt-hasChild > td { background: var(--dtd-ink-2); }
  .dtd-main table.dataTable > tbody > tr.child ul.dtr-details { font-size: 12px; width: 100%; }
  .dtd-main table.dataTable > tbody > tr.child ul.dtr-details > li { display: flex; gap: 10px; align-items: center; padding: 4px 0; }
  .dtd-main table.dataTable > tbody > tr.child span.dtr-title { min-width: 48px; color: var(--muted); font-weight: 600; }
  .dtd-main table.dataTable td.dtr-control:before, .dtd-main table.dataTable td.dt-control:before { color: var(--dtd-ink); border-left-color: var(--dtd-ink); }
  .dtd-main table.dataTable td.dt-control { cursor: pointer; }
  /* highlight the columns that drive the current order */
  .dtd-main table.dataTable.display > tbody > tr > .sorting_1 { box-shadow: inset 0 0 0 9999px rgba(107, 45, 92, .07) !important; }
  .dtd-main table.dataTable.display > tbody > tr > .sorting_2 { box-shadow: inset 0 0 0 9999px rgba(107, 45, 92, .035) !important; }
  .dtd-main table.dataTable.display > tbody > tr.selected > * { box-shadow: inset 0 0 0 9999px rgba(107, 45, 92, .15) !important; color: var(--fg) !important; }
  .dtd-main table.dataTable input.dt-select-checkbox { accent-color: var(--dtd-ink); }

  /* Cell renderers */
  .dtd-cat { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12px; background: var(--cb); color: var(--cf); white-space: nowrap; }
  .dtd-c-lang { --cb: #e5eefb; --cf: #23508f; }
  .dtd-c-art { --cb: #fbeaf0; --cf: #93284d; }
  .dtd-c-sport { --cb: #e5f4e6; --cf: #2b6a30; }
  .dtd-c-it { --cb: #e7f2f5; --cf: #1b5f6e; }
  .dtd-c-life { --cb: #fdf1df; --cf: #8a4c09; }
  .dtd-c-job { --cb: #efeaf8; --cf: #4f3a8a; }
  .dtd-rate { display: flex; align-items: center; gap: 6px; min-width: 96px; font-variant-numeric: tabular-nums; }
  .dtd-rate i { flex: 1; height: 6px; border-radius: 3px; background: #ece8ea; position: relative; overflow: hidden; }
  .dtd-rate i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--rc, #4f9a6c); border-radius: 3px; }
  .dtd-rate span { width: 38px; text-align: right; font-size: 12px; }
  .dtd-rate.hot { --rc: #d98a1c; }
  .dtd-rate.full { --rc: #c23b52; }
  .dtd-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .dtd-pill.open { background: #e5f4e6; color: #2b6a30; }
  .dtd-pill.hot { background: #fdf0dc; color: #8a5208; }
  .dtd-pill.full { background: #fbe4e8; color: #a3253d; }
  .dtd-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dtd-code { font: 12px var(--mono); white-space: nowrap; color: #5d4a57; }
  .dtd-nowrap { white-space: nowrap; }
  .dtd-name { font-weight: 600; white-space: nowrap; }
  .dtd-id { margin-left: 6px; font: 11px var(--mono); color: var(--muted); }
  .dtd-main table.dataTable > tbody > tr.dtd-full > td:first-child { box-shadow: inset 3px 0 0 var(--dtd-hi); }
  .dtd-main table.dataTable > tbody > tr > td.dtd-picked { outline: 2px solid var(--dtd-ink); outline-offset: -2px; }
  .dtd-main table.dataTable > tbody > tr.dtd-locked > td { color: var(--muted); }
  .dtd-main table.dataTable > tbody > tr.dtd-flash > td { animation: dtd-flash 1.6s ease-out; }
  @keyframes dtd-flash { from { background: #ffe9a8; } to { background: transparent; } }

  /* Scene 3: child row detail */
  .dtd-main table.dataTable > tbody > tr.dtd-childrow > td { background: #fbf7fa; padding: 10px 14px !important; }
  .dtd-detail { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px 20px; font-size: 12px; }
  .dtd-detail h4 { margin: 0 0 4px; font-size: 12px; color: var(--dtd-ink); }
  .dtd-detail ol { margin: 0; padding: 0; list-style: none; }
  .dtd-detail li { display: flex; gap: 8px; padding: 1px 0; }
  .dtd-detail p { margin: 0 0 3px; }
  .dtd-wk { min-width: 6.4em; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dtd-seats { height: 8px; margin: 4px 0 6px; border-radius: 4px; background: #ece8ea; position: relative; overflow: hidden; }
  .dtd-seats::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--dtd-ink); }

  @media (max-width: 620px) {
    .dtd-wrap { padding-left: 8px; padding-right: 8px; }
    .dtd-main .dt-container .dt-search { display: flex; align-items: center; gap: 6px; }
    .dtd-main div.dt-container div.dt-layout-row:not(.dt-layout-table) div.dt-layout-cell > * { margin: 0; }
    .dtd-main .dt-container .dt-search input { flex: 1; width: auto; margin: 0 !important; }
    .dtd-main div.dt-container div.dt-layout-table ~ div.dt-layout-row { margin-top: 6px; }
    .dtd-main table.dataTable tbody td { padding: 6px 6px !important; }
  }
  @media (max-width: 560px) {
    .dtd-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 132px; }

    .dtd-kv { grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 8px; padding: 6px 8px; }
    .dtd-detail { grid-template-columns: 1fr 1fr; }
    .dtd-detail > :first-child { grid-column: 1 / -1; }
    .dtd-res th, .dtd-res td { padding: 3px 5px; }
  }
</style>

<script>
const { fmt, fmtMs } = Showcase;

// ---------- fictional course data ----------
const COURSES = [
  ["日語入門", "語言"], ["韓語五十音", "語言"], ["英語會話初級", "語言"], ["台語讀寫", "語言"], ["客語生活會話", "語言"], ["日語中級閱讀", "語言"],
  ["水彩風景寫生", "藝術"], ["書法楷書", "藝術"], ["陶藝手捏", "藝術"], ["攝影入門", "藝術"], ["烏克麗麗彈唱", "藝術"], ["素描基礎", "藝術"], ["插畫與色鉛筆", "藝術"],
  ["太極拳", "運動"], ["瑜伽伸展", "運動"], ["桌球技巧", "運動"], ["國標舞", "運動"], ["登山健行入門", "運動"], ["游泳換氣班", "運動"],
  ["Python 程式入門", "資訊"], ["手機攝影修圖", "資訊"], ["AI 工具應用", "資訊"], ["Excel 資料整理", "資訊"], ["短影音剪輯", "資訊"], ["網頁設計入門", "資訊"],
  ["中式麵點", "生活"], ["咖啡手沖", "生活"], ["盆栽園藝", "生活"], ["理財規劃入門", "生活"], ["茶藝與品茶", "生活"], ["烘焙小點心", "生活"],
  ["中餐烹調證照班", "職能"], ["室內配線基礎", "職能"], ["會計實務", "職能"], ["行銷文案寫作", "職能"], ["照顧服務員訓練", "職能"],
];
const CAT_CLASS = { 語言: "dtd-c-lang", 藝術: "dtd-c-art", 運動: "dtd-c-sport", 資訊: "dtd-c-it", 生活: "dtd-c-life", 職能: "dtd-c-job" };
const STATUS_CLASS = { 招生中: "open", 熱門: "hot", 額滿: "full" };
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市"];
const SURNAMES = "陳林黃張李王吳劉蔡楊許鄭謝郭洪";
const GIVEN = ["雅婷", "志明", "淑芬", "建宏", "怡君", "俊傑", "美玲", "家豪", "佩珊", "宗翰", "惠如", "冠廷"];
const DAYS = ["週一", "週二", "週三", "週四", "週五", "週六"];
const TOPICS = {
  語言: ["發音與基本句型", "情境對話練習", "短文閱讀", "成果發表"],
  藝術: ["工具與材料認識", "基礎技法", "主題創作", "作品展示"],
  運動: ["暖身與安全須知", "基本動作", "進階組合", "成果檢測"],
  資訊: ["環境安裝與介面", "核心功能操作", "實作小專題", "作品分享"],
  生活: ["器材與原料介紹", "基礎示範", "分組實作", "成品品評"],
  職能: ["法規與職場概論", "核心技能訓練", "模擬實務演練", "檢定準備"],
};

function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const pad = (n, w) => String(n).padStart(w, "0");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (r, arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};

// rate and status are derived, so every update goes through here and returns a new object
const withRate = (c) => {
  const rate = Math.round((c.enrolled / c.cap) * 100);
  return { ...c, rate, status: rate >= 100 ? "額滿" : rate >= 85 ? "熱門" : "招生中" };
};
function makeCourse(r, [name, cat], id, city) {
  const dayIdx = Math.floor(r() * 6);
  const time = pick(r, dayIdx === 5 ? ["09:30", "14:00"] : ["09:30", "14:00", "19:00"]);
  const cap = 20 + 5 * Math.floor(r() * 5);
  return withRate({
    id, name, cat,
    city: city || pick(r, CITIES),
    teacher: pick(r, SURNAMES) + pick(r, GIVEN),
    dayIdx, day: DAYS[dayIdx], time, slot: `${DAYS[dayIdx]} ${time}`,
    // first lesson falls on the slot's weekday (2026-09-07 is a Monday)
    start: `2026-09-${pad(7 + dayIdx + 7 * Math.floor(r() * 3), 2)}`,
    weeks: pick(r, [12, 16, 18]),
    fee: 1600 + 100 * Math.floor(r() * 33),
    cap, enrolled: Math.min(cap, Math.round(cap * (0.35 + r() * 0.8))),
    room: `${pick(r, "ABC")}${2 + Math.floor(r() * 4)}0${1 + Math.floor(r() * 8)}`,
  });
}
const buildCourses = (seed) => {
  const r = mulberry32(seed);
  return COURSES.map((c, i) => makeCourse(r, c, "F" + pad(i + 1, 3)));
};

// ---------- renderers ----------
// display(fn) only decorates the display value; sort, filter and type keep the raw data
const display = (fn) => (d, type, row) => (type === "display" ? fn(d, row) : d);
const rateHtml = (d) => `<div class="dtd-rate ${d >= 100 ? "full" : d >= 85 ? "hot" : ""}"><i style="--w:${Math.min(100, d)}%"></i><span>${d}%</span></div>`;
const catTag = display((d) => `<span class="dtd-cat ${CAT_CLASS[d]}">${d}</span>`);
const rateBar = display(rateHtml);
const pill = display((d) => `<span class="dtd-pill ${STATUS_CLASS[d]}">${d}</span>`);
const money = DataTable.render.number(",", ".", 0, "NT$ ");
const moneyRaw = display((d) => `NT$ ${fmt(d)}`);

// ---------- Traditional Chinese strings ----------
const ZH = {
  search: "搜尋",
  searchPlaceholder: "課程、講師、縣市…",
  lengthMenu: "每頁 _MENU_ 門",
  info: "第 _START_ 至 _END_ 門，共 _TOTAL_ 門",
  infoEmpty: "沒有符合的課程",
  infoFiltered: "（全部 _MAX_ 門）",
  zeroRecords: "找不到符合條件的課程",
  emptyTable: "目前沒有課程",
  loadingRecords: "載入中…",
  processing: "處理中…",
  entries: { _: "門", 1: "門" },
  aria: { paginate: { first: "第一頁", previous: "上一頁", next: "下一頁", last: "最後一頁" } },
  columnControl: {
    order: "排序（Shift 加點可多欄）",
    orderAsc: "遞增排序", orderDesc: "遞減排序", orderClear: "清除排序",
    orderAddAsc: "加入遞增排序", orderAddDesc: "加入遞減排序", orderRemove: "移出排序",
    dropdown: "篩選", searchDropdown: "搜尋", searchClear: "清除搜尋",
    searchList: "篩選「[title]」",
    list: { search: "搜尋選項…", all: "全選", none: "全不選", empty: "沒有選項" },
    search: {
      text: { contains: "包含", notContains: "不包含", equal: "等於", notEqual: "不等於", starts: "開頭是", ends: "結尾是", empty: "空白", notEmpty: "非空白" },

      ctx.select("全域", PRESETS.map((p, i) => ({ value: String(i), label: p.label })), "0", (v) => { preset = +v; apply(); });
      ctx.select("類別", [{ value: "", label: "全部" }, ...Object.keys(CAT_CLASS)], "", (v) => { cat = v; apply(); });
      ctx.select("縣市", [{ value: "", label: "全部" }, ...CITIES], "", (v) => { city = v; apply(); });
      ctx.slider("學費上限", { min: 1600, max: FEE_MAX, step: 200, value: FEE_MAX, format: (v) => (v >= FEE_MAX ? "不限" : fmt(v)) }, (v) => { feeMax = v; apply(); });
    },
  },

  // ---------- scene 6: Select + Buttons ----------
  {
    id: "select", title: "選取與匯出", paper: true,
    api: "select: { style, selectable }・buttons: [colvis, csv]・buttons.exportData()",
    desc: "Select 擴充加上勾選欄與表頭全選，selectable 函式讓額滿課程不能選；Buttons 擴充提供全選、欄位顯示切換（colvis）與 CSV 下載（bom: true，Excel 開中文不亂碼）。匯出時有選取就只匯出選取的列，隱藏的欄位也不匯出；右側用 buttons.exportData() 即時預覽 CSV 內容。",
    hint: "勾幾門課，或用「顯示欄位」藏欄，看右側預覽",
    mount(ctx) {
      ctx.html(`<div class="dtd-wrap"><div class="dtd-split"><div class="dtd-main" style="--dtd-minw:540px"></div><aside class="dtd-side"><div class="dtd-cap">匯出預覽 <code>buttons.exportData()</code></div><div class="dtd-cap dtd-sum"></div><pre class="dtd-pre"></pre></aside></div><div class="dtd-log"></div></div>`);
      const host = ctx.$(".dtd-main"), log = ctx.$(".dtd-log"), pre = ctx.$(".dtd-pre"), sum = ctx.$(".dtd-sum");
      const EXPORT = { columns: ":not(.dtd-nox):visible", orthogonal: "export" };
      const buttons = [
        "selectAll", "selectNone",
        { extend: "colvis", columns: ":not(.dtd-nox)" },
        { extend: "csv", bom: true, filename: "秋季課程", exportOptions: EXPORT },
      ];
      const table = createTable(host, {
        data: buildCourses(66), pageLength: 10, lengthMenu: [10, 20, 40], order: [[1, "asc"]],
        select: { style: "multi", selectable: (d) => d.status !== "額滿" },
        createdRow: (tr, d) => { if (d.status === "額滿") tr.classList.add("dtd-locked"); },
        layout: isNarrow(ctx)
          ? { topStart: { buttons }, topEnd: null, bottomStart: "info", bottomEnd: { paging: { buttons: 3, firstLast: false } } }
          : { topStart: { buttons }, topEnd: "search", bottomStart: "info", bottomEnd: "paging" },
        columns: [
          { data: null, title: "", className: "dtd-nox", orderable: false, render: DataTable.render.select(), width: "26px" },
          { data: "name", title: "課程", className: "dtd-nowrap" },
          { data: "cat", title: "類別", render: catTag },
          { data: "city", title: "縣市" },
          { data: "teacher", title: "講師" },
          { data: "fee", title: "學費", className: "dtd-num", render: moneyRaw },
          { data: "status", title: "狀態", render: pill },
        ],
      });
      ctx.onCleanup(() => table.destroy(true));
      const csvCell = (v) => (/[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v);
      const preview = () => {
        const data = table.buttons.exportData(EXPORT);
        const lines = [data.header, ...data.body].map((r) => r.map((v) => csvCell(String(v))).join(","));
        const keep = 14;
        pre.textContent = lines.slice(0, keep).join("\n") + (lines.length > keep ? `\n…另有 ${lines.length - keep} 列` : "");
        const picked = table.rows({ selected: true }).count();
        sum.innerHTML = picked ? `只匯出已選的 <b>${picked}</b> 門・${data.header.length} 欄` : `未選取，匯出全部 <b>${data.body.length}</b> 門・${data.header.length} 欄`;
        const locked = table.rows((i, d) => d.status === "額滿").count();
        log.innerHTML = `已選 <b>${picked}</b> 門・額滿 ${locked} 門（灰字）不能選・匯出欄位：${data.header.map(esc).join("、")}`;
      };
      ["select", "deselect", "column-visibility", "draw"].forEach((ev) => table.on(ev, preview));
      preview();
    },
  },

  // ---------- scene 7: server-side processing ----------
  {
    id: "server", title: "伺服器端處理", paper: true,
    api: "serverSide: true・ajax(data, callback)・processing・searchDelay",
    desc: "10 萬筆報名紀錄留在「伺服器」（頁面裡的一個函式），DataTables 每次換頁、排序、搜尋都送出一個請求（draw、start、length、order、search），伺服器回傳那一頁的 10 列與總數。瀏覽器 DOM 永遠只有一頁，資料再多也不卡；代價是每個動作都要等回應，延遲時會出現「處理中」。",
    hint: "調高模擬延遲，再換頁或排序看請求內容",
    mount(ctx) {
      ctx.html(`<div class="dtd-wrap"><div class="dtd-split"><div class="dtd-main" style="--dtd-minw:540px"></div><aside class="dtd-side"><div class="dtd-cap">最後一次請求 <code>ajax(data)</code></div><dl class="dtd-kv"></dl><div class="dtd-cap dtd-resp"></div></aside></div><div class="dtd-log"></div></div>`);
      const host = ctx.$(".dtd-main"), log = ctx.$(".dtd-log"), kv = ctx.$(".dtd-kv"), resp = ctx.$(".dtd-resp");
      const N = 100000;
      const r = mulberry32(777);
      const db = new Array(N), hay = new Array(N);
      for (let i = 0; i < N; i++) {
        const course = COURSES[(r() * COURSES.length) | 0][0];
        const city = CITIES[(r() * 6) | 0];
        const member = SURNAMES[(r() * SURNAMES.length) | 0] + GIVEN[(r() * GIVEN.length) | 0];
        const date = `2026-${pad(7 + ((r() * 2) | 0), 2)}-${pad(1 + ((r() * 31) | 0), 2)}`;
        db[i] = { id: `R${pad(i + 1, 6)}`, member, course, city, date, paid: 1600 + 100 * ((r() * 33) | 0) };
        hay[i] = `${db[i].id} ${member} ${course} ${city} ${date}`.toLowerCase();
      }
      // Precompute a numeric sort key per column so each request sorts integers, not strings
      const coll = new Intl.Collator("zh-TW");
      const rankOf = (field) => {
        const m = new Map([...new Set(db.map((x) => x[field]))].sort(coll.compare).map((v, i) => [v, i]));
        return Int32Array.from(db, (x) => m.get(x[field]));
      };
      const keys = [Int32Array.from(db, (_, i) => i), rankOf("member"), rankOf("course"), rankOf("city"), rankOf("date"), Int32Array.from(db, (x) => x.paid)];
      const FIELDS = ["編號", "學員", "課程", "縣市", "報名日", "繳費"];
      let cacheKey = "", cacheIdx = [], latency = 400, requests = 0;
      const server = (req) => {
        const q = (req.search?.value || "").trim().toLowerCase();
        const o = req.order?.[0] || { column: 0, dir: "desc" };
        const key = `${q}|${o.column}|${o.dir}`;
        let tFilter = 0, tSort = 0;
        const cached = key === cacheKey;
        if (!cached) {
          const t0 = performance.now();
          const terms = q.split(/\s+/).filter(Boolean);
          const idx = [];
          for (let i = 0; i < N; i++) if (terms.every((t) => hay[i].includes(t))) idx.push(i);
          const t1 = performance.now();
          const k = keys[o.column], sign = o.dir === "desc" ? -1 : 1;
          idx.sort((a, b) => sign * (k[a] - k[b]) || a - b);
          tFilter = t1 - t0; tSort = performance.now() - t1;
          cacheKey = key; cacheIdx = idx;
        }
        const page = cacheIdx.slice(req.start, req.start + req.length).map((i) => db[i]);
        return { json: { draw: req.draw, recordsTotal: N, recordsFiltered: cacheIdx.length, data: page }, tFilter, tSort, cached };
      };
      const showReq = (req, res) => {
        const order = (req.order || []).map((o) => `${o.column}（${FIELDS[o.column]}）${o.dir}`).join("、");
        kv.innerHTML = [["draw", req.draw], ["start", fmt(req.start)], ["length", req.length], ["order", order], ["search", `"${req.search?.value || ""}"`]]
          .map(([k, v]) => `<dt><code>${k}</code></dt><dd>${esc(v)}</dd>`).join("");
        resp.innerHTML = `回傳 <b>${res.json.data.length}</b> 列・符合 <b>${fmt(res.json.recordsFiltered)}</b> / ${fmt(N)}・${res.cached ? "沿用上次篩選排序結果" : `篩選 ${fmtMs(res.tFilter)}・排序 ${fmtMs(res.tSort)}`}・延遲 ${latency} ms`;
      };
      const table = createTable(host, {
        serverSide: true, processing: true, searchDelay: 350,
        pageLength: 10, lengthMenu: [10, 25, 50], order: [[0, "desc"]], layout: layoutFor(ctx),
        language: lang({ info: "第 _START_ 至 _END_ 筆，共 _TOTAL_ 筆", infoFiltered: "（全部 _MAX_ 筆）", infoEmpty: "沒有符合的紀錄", lengthMenu: "每頁 _MENU_ 筆", searchPlaceholder: "學員、課程、縣市…", zeroRecords: "找不到符合的報名紀錄", entries: { _: "筆", 1: "筆" } }),
        ajax: (data, callback) => {
          requests++;
          const res = server(data);
          showReq(data, res);
          ctx.timeout(() => callback(res.json), latency);
        },
        columns: [
          { data: "id", title: "編號", className: "dtd-code" },
          { data: "member", title: "學員" },
          { data: "course", title: "課程", className: "dtd-nowrap" },
          { data: "city", title: "縣市" },
          { data: "date", title: "報名日", className: "dtd-num" },
          { data: "paid", title: "繳費", className: "dtd-num", render: money },
        ],
      });
      ctx.onCleanup(() => table.destroy(true));
      table.on("draw", () => {
        log.innerHTML = `已送出 <b>${requests}</b> 次請求・瀏覽器 DOM 只有 <b>${host.querySelectorAll("tbody tr").length}</b> 列，其餘 ${fmt(N)} 筆留在伺服器函式`;
      });
      ctx.slider("模擬延遲", { min: 0, max: 1500, step: 100, value: latency, format: (v) => `${v} ms` }, (v) => { latency = v; });
      ctx.button("重新請求", () => table.draw(false));
    },
  },

  // ---------- scene 8: stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "rows.add(data).draw()・order().draw()・search().draw()・deferRender",
    desc: "逐級把 1 千到 100 萬列交給 DataTables，每級量三段：rows.add() 加 draw() 畫出第一頁、order() 依學費重新排序、search() 全表搜尋「臺中」。切到「deferRender 關」再測一次，可以看到每列都先建好 DOM 節點時成本差多少。",
    hint: "按左側「開始測試」；切到 deferRender 關再比較",
    mount(ctx) {
      ctx.html(`<div class="dtd-stress"><table class="dtd-res"><thead><tr><th>列數</th><th>deferRender</th><th>新增＋繪製</th><th>排序</th><th>搜尋</th><th>tr 節點</th></tr></thead><tbody><tr><td class="zh" colspan="6">尚未測試；下方是 1,000 列預覽</td></tr></tbody></table><div class="dtd-main"></div></div>`);
      const host = ctx.$(".dtd-stress .dtd-main");
      const resBody = ctx.$(".dtd-res tbody");
      ctx.controls.classList.add("bottom");
      let defer = true;
      ctx.group(["deferRender 開（預設）", "deferRender 關"], 0, (i) => { defer = i === 0; });
      let table = null;
      const drop = () => { if (table) { table.destroy(true); table = null; } host.innerHTML = ""; };
      ctx.onCleanup(drop);
      const columns = () => [
        { title: "#", className: "dtd-num" },
        { title: "課程", className: "dtd-nowrap" },
        { title: "縣市" },
        { title: "講師" },
        { title: "學費", className: "dtd-num", render: money },
        { title: "報名率", className: "dtd-num", render: (d, type) => (type === "display" ? `${d}%` : d) },
      ];
      const makeRows = (n) => {
        const r = mulberry32(n);
        const rows = new Array(n);
        for (let i = 0; i < n; i++) {
          rows[i] = [i + 1, COURSES[(r() * 36) | 0][0], CITIES[(r() * 6) | 0], SURNAMES[(r() * 15) | 0] + GIVEN[(r() * 12) | 0], 1600 + 100 * ((r() * 33) | 0), 35 + ((r() * 66) | 0)];
        }
        return rows;
      };
      const make = (data) => createTable(host, {
        data, columns: columns(), deferRender: defer, pageLength: 20, order: [], autoWidth: false,
        layout: { topStart: "info", topEnd: "search", bottomStart: null, bottomEnd: { paging: { buttons: 5, firstLast: false } } },
        language: lang({ info: "第 _START_ 至 _END_ 列，共 _TOTAL_ 列", infoFiltered: "（全部 _MAX_ 列）", searchPlaceholder: "" }),
      });
      table = make(makeRows(1000));   // preview so the stage is not empty before the run
      const results = [];
      const timed = (fn) => { const t0 = performance.now(); fn(); void host.offsetHeight; return performance.now() - t0; };
      ctx.bench({
        label: "資料列", unit: "列",
        sizes: [1000, 10000, 50000, 100000, 250000, 500000, 1000000],
        budget: 3000,
        prepare(n) {
          drop();
          return makeRows(n);
        },
        async run(n, rows) {
          table = make([]);
          const tAdd = timed(() => table.rows.add(rows).draw());
          await ctx.frame(1);
          const tSort = timed(() => table.order([4, "desc"]).draw());
          await ctx.frame(1);
          const tSearch = timed(() => table.search("臺中").draw());
          const nodes = table.rows().nodes().toArray().filter(Boolean).length;
          results.unshift([n, defer ? "開" : "關", tAdd, tSort, tSearch, nodes]);
          resBody.innerHTML = results.slice(0, 9).map(([n2, m, a, b, c, d]) =>
            `<tr><td>${fmt(n2)}</td><td class="zh">${m}</td><td>${fmtMs(a)}</td><td>${fmtMs(b)}</td><td>${fmtMs(c)}</td><td>${fmt(d)}</td></tr>`).join("");
          return `新增 ${fmtMs(tAdd)}・排序 ${fmtMs(tSort)}・搜尋 ${fmtMs(tSearch)}`;
        },
        note: "每級都重新建立空表再量，三段各自同步執行到畫面更新為止。deferRender 開啟（DataTables 2 起的預設）時只替目前這一頁建立 tr，關閉時 rows.add() 會替每一列建好 DOM 節點，列數一多建立節點就成為主要成本。排序第一次要替每列取出排序值、搜尋第一次要替每列組出搜尋字串，兩份快取都和列數成正比，所以這兩段也會隨列數上升；總時間超過 3 秒的那一級做完就停。",
      });
    },
  },
] });
</script>
</body>
</html>
