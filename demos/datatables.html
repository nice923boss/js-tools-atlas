<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataTables 示範：秋季課程總表</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-dt@3.1.3/css/dataTables.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-responsive-dt@4.1.1/css/responsive.dataTables.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/datatables.net-columncontrol-dt@2.1.2/css/columnControl.dataTables.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"Shift 加點欄位排序鈕可多欄排序，欄名旁的選單可逐欄篩選"}</script>
<style>
  :root { --ink: #6b2d5c; --ink-2: #f6eaf2; }
  .app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); }
  .tb { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--ink); color: #fff; }
  .tb h1 { font-size: 15px; margin: 0 auto 0 0; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; }
  .tb h1 small { font-weight: 400; opacity: .8; font-size: 12px; }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,.3); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: #fff; padding: 7px 10px; font: 600 12px var(--font); cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); }
  .seg span { padding: 7px 4px 7px 10px; font-size: 12px; opacity: .75; }
  .tb .btn { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.25); padding: 7px 11px; }

  .wrap { min-height: 0; min-width: 0; overflow: hidden; padding: 8px 12px 6px; }

  /* Let the DataTables container fill the frame: controls stay put, only the table area scrolls */
  .dt-container { height: 100%; display: flex; flex-direction: column; font-size: 13px; color: var(--fg); }
  div.dt-container div.dt-layout-row { margin: 0 0 8px; }
  div.dt-container div.dt-layout-table ~ div.dt-layout-row { margin: 8px 0 0; }
  .dt-container .dt-layout-row.dt-layout-table {
    display: block; flex: 1 1 0; min-height: 0; overflow: auto; margin: 0; background: #fff;
    border: 1px solid var(--line); border-radius: 8px;
  }
  .dt-container .dt-search input { width: 220px; padding: 6px 10px; border-radius: 8px; border-color: var(--line); background: #fff; font: 13px var(--font); }
  .dt-container .dt-input:focus { outline: 2px solid rgba(107,45,92,.3); }
  .dt-container .dt-length select { border-radius: 6px; background: #fff; padding: 4px; }
  .dt-container .dt-info { font-size: 12px; color: var(--muted); padding-top: 0; }
  .dt-container .dt-paging .dt-paging-button { padding: 4px 10px !important; min-width: 30px; border-radius: 6px; font-size: 12px; }
  .dt-container .dt-paging .dt-paging-button.current,
  .dt-container .dt-paging .dt-paging-button.current:hover { background: var(--ink) !important; color: #fff !important; border-color: var(--ink) !important; }
  table.dataTable { margin: 0 !important; }
  table.dataTable thead > tr > * { position: sticky; top: 0; z-index: 2; background: #f3eff2; font-size: 12px; padding: 8px 8px !important; border-bottom: 2px solid var(--ink) !important; white-space: nowrap; }
  table.dataTable tbody td { padding: 7px 8px !important; border-top-color: var(--line) !important; }
  table.dataTable tbody tr:hover > td { background: #fbf7fa; }
  table.dataTable > tbody > tr.dt-hasChild > td { background: var(--ink-2); }
  table.dataTable > tbody > tr.child ul.dtr-details { font-size: 12px; width: 100%; }
  table.dataTable > tbody > tr.child ul.dtr-details > li { display: flex; gap: 10px; align-items: center; padding: 4px 0; }
  table.dataTable > tbody > tr.child span.dtr-title { min-width: 48px; color: var(--muted); font-weight: 600; }
  table.dataTable td.dtr-control:before { color: var(--ink); }

  /* Highlight the columns that drive the current order */
  table.dataTable.display > tbody > tr > .sorting_1 { box-shadow: inset 0 0 0 9999px rgba(107,45,92,.07) !important; }
  table.dataTable.display > tbody > tr > .sorting_2 { box-shadow: inset 0 0 0 9999px rgba(107,45,92,.035) !important; }

  /* Custom renderers */
  .cat { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 12px; background: var(--cb); color: var(--cf); white-space: nowrap; }
  .c-lang { --cb: #e5eefb; --cf: #23508f; }
  .c-art { --cb: #fbeaf0; --cf: #93284d; }
  .c-sport { --cb: #e5f4e6; --cf: #2b6a30; }
  .c-it { --cb: #e7f2f5; --cf: #1b5f6e; }
  .c-life { --cb: #fdf1df; --cf: #8a4c09; }
  .c-job { --cb: #efeaf8; --cf: #4f3a8a; }
  .rate { display: flex; align-items: center; gap: 6px; min-width: 96px; font-variant-numeric: tabular-nums; }
  .rate i { flex: 1; height: 6px; border-radius: 3px; background: #ece8ea; position: relative; overflow: hidden; }
  .rate i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--rc, #4f9a6c); border-radius: 3px; }
  .rate span { width: 38px; text-align: right; font-size: 12px; }
  .rate.hot { --rc: #d98a1c; }
  .rate.full { --rc: #c23b52; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .pill.open { background: #e5f4e6; color: #2b6a30; }
  .pill.hot { background: #fdf0dc; color: #8a5208; }
  .pill.full { background: #fbe4e8; color: #a3253d; }
  .num { font-variant-numeric: tabular-nums; }
  .nowrap { white-space: nowrap; }

  .statusbar {
    display: flex; gap: 12px; align-items: center; padding: 6px 12px; min-height: 32px;
    border-top: 1px solid var(--line); background: #eeede8; font-size: 12px; color: var(--muted);
  }
  .statusbar b { color: var(--fg); font-weight: 600; }
  #state { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .statusbar .hint { position: static; flex: none; background: transparent; border: 0; padding: 0; backdrop-filter: none; }

  @media (max-width: 620px) {
    .tb h1 { flex: 1; }
    .tb h1 small, .seg span, .statusbar .hint { display: none; }
    .tb .seg { order: 5; }
    .wrap { padding: 6px 8px 4px; }
    .dt-container .dt-search { display: flex; align-items: center; gap: 6px; }
    div.dt-container div.dt-layout-row:not(.dt-layout-table) div.dt-layout-cell > * { margin: 0; }
    .dt-container .dt-search input { flex: 1; width: auto; margin: 0 !important; }
    div.dt-container div.dt-layout-table ~ div.dt-layout-row { margin-top: 6px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <header class="tb">
    <h1>DataTables 秋季課程總表 <small>示意資料・2026 社區大學</small></h1>
    <div class="seg" id="orderSeg" role="group" aria-label="排序組合">
      <span>排序</span>
      <button data-order="1:asc,8:desc" aria-pressed="true">類別 → 報名率</button>
      <button data-order="2:asc,7:asc" aria-pressed="false">縣市 → 學費</button>
    </div>
    <button class="btn" id="resetBtn">重設篩選</button>
  </header>
  <main class="wrap"><table id="courses" class="display"></table></main>
  <footer class="statusbar">
    <span id="state">示意資料</span>
    <span class="hint">Shift 加點排序鈕可多欄排序・欄名旁選單可篩選</span>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/datatables.net@3.1.3/js/dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net-dt@3.1.3/js/dataTables.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive@4.1.1/js/dataTables.responsive.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net-responsive-dt@4.1.1/js/responsive.dataTables.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net-columncontrol@2.1.2/js/dataTables.columnControl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/datatables.net-columncontrol-dt@2.1.2/js/columnControl.dataTables.min.js"></script>
<script>
// Fictional course catalogue: [course, category]
const COURSES = [
  ["日語入門", "語言"], ["韓語五十音", "語言"], ["英語會話初級", "語言"], ["台語讀寫", "語言"], ["客語生活會話", "語言"], ["日語中級閱讀", "語言"],
  ["水彩風景寫生", "藝術"], ["書法楷書", "藝術"], ["陶藝手捏", "藝術"], ["攝影入門", "藝術"], ["烏克麗麗彈唱", "藝術"], ["素描基礎", "藝術"], ["插畫與色鉛筆", "藝術"],
  ["太極拳", "運動"], ["瑜伽伸展", "運動"], ["桌球技巧", "運動"], ["國標舞", "運動"], ["登山健行入門", "運動"], ["游泳換氣班", "運動"],
  ["Python 程式入門", "資訊"], ["手機攝影修圖", "資訊"], ["AI 工具應用", "資訊"], ["Excel 資料整理", "資訊"], ["短影音剪輯", "資訊"], ["網頁設計入門", "資訊"],
  ["中式麵點", "生活"], ["咖啡手沖", "生活"], ["盆栽園藝", "生活"], ["理財規劃入門", "生活"], ["茶藝與品茶", "生活"], ["烘焙小點心", "生活"],
  ["中餐烹調證照班", "職能"], ["室內配線基礎", "職能"], ["會計實務", "職能"], ["行銷文案寫作", "職能"], ["照顧服務員訓練", "職能"],
];
const CAT_CLASS = { 語言: "c-lang", 藝術: "c-art", 運動: "c-sport", 資訊: "c-it", 生活: "c-life", 職能: "c-job" };
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市"];
const SURNAMES = "陳林黃張李王吳劉蔡楊許鄭謝郭洪";
const GIVEN = ["雅婷", "志明", "淑芬", "建宏", "怡君", "俊傑", "美玲", "家豪", "佩珊", "宗翰", "惠如", "冠廷"];
const DAYS = ["週一", "週二", "週三", "週四", "週五", "週六"];
const SLOTS = { 週六: ["09:30", "14:00"], other: ["09:30", "14:00", "19:00"] };

function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(2026);
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

const rows = COURSES.map(([name, cat]) => {
  const day = pick(DAYS);
  const cap = 20 + 5 * Math.floor(rand() * 5);
  const enrolled = Math.min(cap, Math.round(cap * (0.35 + rand() * 0.8)));
  const rate = Math.round((enrolled / cap) * 100);
  return {
    name, cat,
    city: pick(CITIES),
    teacher: pick(SURNAMES) + pick(GIVEN),
    slot: `${day} ${pick(SLOTS[day] || SLOTS.other)}`,
    start: `2026-09-${String(7 + Math.floor(rand() * 20)).padStart(2, "0")}`,
    weeks: pick([12, 16, 18]),
    fee: 1600 + 100 * Math.floor(rand() * 33),
    rate,
    status: rate >= 100 ? "額滿" : rate >= 85 ? "熱門" : "招生中",
  };
});

const narrow = innerWidth < 620;
const STATUS_CLASS = { 招生中: "open", 熱門: "hot", 額滿: "full" };
const asList = ["order", ["searchList"]];          // category-like columns: tick boxes
const asSearch = ["order", ["search"]];             // free text or number comparison
const display = (fn) => (d, type) => (type === "display" ? fn(d) : d);

const table = new DataTable("#courses", {
  data: rows,
  responsive: true,
  pageLength: 10,
  lengthMenu: [10, 20, 40],
  order: [[1, "asc"], [8, "desc"]],
  ordering: { indicators: false, handler: false },  // ColumnControl's order button replaces header clicks
  columnControl: asSearch,
  layout: narrow
    ? { topStart: "search", topEnd: null, bottomStart: "paging", bottomEnd: null }
    : { topStart: "pageLength", topEnd: "search", bottomStart: "info", bottomEnd: "paging" },
  columns: [
    { data: "name", title: "課程", responsivePriority: 1 },
    { data: "cat", title: "類別", responsivePriority: 3, columnControl: asList, render: display((d) => `<span class="cat ${CAT_CLASS[d]}">${d}</span>`) },
    { data: "city", title: "縣市", responsivePriority: 5, columnControl: asList },
    { data: "teacher", title: "講師", responsivePriority: 9 },
    { data: "slot", title: "時段", responsivePriority: 6, columnControl: asList },
    { data: "start", title: "開課日", responsivePriority: 10, className: "nowrap num", columnControl: ["order"] },
    { data: "weeks", title: "週數", responsivePriority: 11, className: "dt-right num", columnControl: asList },
    { data: "fee", title: "學費", responsivePriority: 4, className: "num", render: DataTable.render.number(",", ".", 0, "NT$ ") },
    { data: "rate", title: "報名率", responsivePriority: 2,
      render: display((d) => `<div class="rate ${d >= 100 ? "full" : d >= 85 ? "hot" : ""}"><i style="--w:${Math.min(100, d)}%"></i><span>${d}%</span></div>`) },
    { data: "status", title: "狀態", responsivePriority: 7, columnControl: asList, render: display((d) => `<span class="pill ${STATUS_CLASS[d]}">${d}</span>`) },
  ],
  language: {
    search: "搜尋",
    searchPlaceholder: "課程、講師、縣市…",
    lengthMenu: "每頁 _MENU_ 門",
    info: "第 _START_ 至 _END_ 門，共 _TOTAL_ 門",
    infoEmpty: "沒有符合的課程",
    infoFiltered: "（全部 _MAX_ 門）",
    zeroRecords: "找不到符合條件的課程",
    emptyTable: "目前沒有課程",
    loadingRecords: "載入中…",
    processing: "處理中…",
    entries: { _: "門", 1: "門" },
    paginate: { first: "第一頁", previous: "上一頁", next: "下一頁", last: "最後一頁" },
    aria: { paginate: { first: "第一頁", previous: "上一頁", next: "下一頁", last: "最後一頁" } },
    columnControl: {
      order: "排序（Shift 加點可多欄）",
      orderAsc: "遞增排序", orderDesc: "遞減排序", orderClear: "清除排序",
      orderAddAsc: "加入遞增排序", orderAddDesc: "加入遞減排序", orderRemove: "移出排序",
      dropdown: "篩選", searchDropdown: "搜尋", searchClear: "清除搜尋",
      searchList: "篩選「[title]」",
      list: { search: "搜尋選項…", all: "全選", none: "全不選", empty: "沒有選項" },
      search: {
        text: { contains: "包含", notContains: "不包含", equal: "等於", notEqual: "不等於", starts: "開頭是", ends: "結尾是", empty: "空白", notEmpty: "非空白" },
        number: { equal: "等於", notEqual: "不等於", greater: "大於", greaterOrEqual: "大於等於", less: "小於", lessOrEqual: "小於等於", empty: "空白", notEmpty: "非空白" },
      },
      buttons: { searchClear: "清除搜尋" },
    },
  },
});

// Status bar: spell out the current multi-column order and how many rows survive the filters
const state = document.getElementById("state");
table.on("draw", () => {
  const order = table.order().map(([col, dir]) => `<b>${table.column(col).title()}</b> ${dir === "asc" ? "↑" : "↓"}`);
  const info = table.page.info();
  const filtered = info.recordsDisplay < info.recordsTotal ? `篩選後 <b>${info.recordsDisplay}</b> / ${info.recordsTotal} 門` : `共 <b>${info.recordsTotal}</b> 門`;
  state.innerHTML = `示意資料・排序：${order.length ? order.join(" → ") : "無"}・${filtered}`;
});
table.draw(false);

const seg = document.getElementById("orderSeg");
seg.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  for (const x of seg.querySelectorAll("button")) x.setAttribute("aria-pressed", String(x === b));
  const order = b.dataset.order.split(",").map((p) => { const [c, d] = p.split(":"); return [Number(c), d]; });
  table.order(order).draw();
});
// Clear the pressed preset when the user sorts by hand
table.on("order", () => {
  const now = table.order().map(([c, d]) => `${c}:${d}`).join(",");
  for (const x of seg.querySelectorAll("button")) x.setAttribute("aria-pressed", String(x.dataset.order === now));
});
document.getElementById("resetBtn").addEventListener("click", () => {
  table.columns().columnControl.searchClear();
  table.search("").draw();
});
</script>
</body>
</html>
