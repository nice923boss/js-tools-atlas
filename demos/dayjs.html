<style>

<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/locale/zh-tw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/utc.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/timezone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/relativeTime.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/duration.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/localizedFormat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/advancedFormat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/customParseFormat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/isoWeek.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/weekOfYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/weekYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/dayOfYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/isLeapYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/quarterOfYear.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.23/plugin/isBetween.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Day.js showcase: time zones and countdowns, format tokens, custom parsing, relative time thresholds,
// meeting planner across DST, ISO/locale week calendar, diff/isBetween/immutability, and a throughput benchmark.
const PLUGINS = ["utc", "timezone", "relativeTime", "duration", "localizedFormat", "advancedFormat", "customParseFormat", "isoWeek", "weekOfYear", "weekYear", "dayOfYear", "isLeapYear", "quarterOfYear", "isBetween"];
PLUGINS.forEach((p) => dayjs.extend(window[`dayjs_plugin_${p}`]));
dayjs.locale("zh-tw");
const CDN = "https://cdn.jsdelivr.net/npm/dayjs@1.11.23";
const TPE = "Asia/Taipei";
const pad = (n) => String(n).padStart(2, "0");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const wrap = (ctx, inner) => { ctx.html(`<div class="dj-wrap">${inner}</div>`); return ctx.$(".dj-wrap"); };
const LANGS = [["zh-tw", "繁體中文"], ["en", "English"], ["ja", "日本語"], ["ko", "한국어"]];
// Locales other than en / zh-tw are fetched from the CDN on first use; the UMD file registers itself without changing the global locale.
const ensureLocale = (code) => (dayjs.Ls[code] ? Promise.resolve(false) : Showcase.load(`${CDN}/locale/${code}.js`).then(() => true));
const LUNAR_NEW_YEAR = ["2027-02-06", "2028-01-26", "2029-02-13", "2030-02-03", "2031-01-23"];

Showcase.run({ scenes: [
  {
    id: "clock", title: "世界時鐘與倒數",
    api: "dayjs().tz(zone)・dayjs.duration(target.diff(now))・target.fromNow()",
    desc: "同一個瞬間換算成六個城市的當地時間，色帶是當地一天 24 小時（深色為夜晚），白線是現在位置。右邊用 diff 算出毫秒差，交給 duration 拆成天、時、分、秒。",
    hint: "上方切換倒數目標；選「自訂」可輸入任何日期時間",
    mount(ctx) {
      const ZONES = [["🏙️", "台北", TPE], ["🗼", "東京", "Asia/Tokyo"], ["🦘", "雪梨", "Australia/Sydney"], ["💂", "倫敦", "Europe/London"], ["🗽", "紐約", "America/New_York"], ["🌉", "舊金山", "America/Los_Angeles"]];
      wrap(ctx, `<div class="dj-cols even">
        <div class="dj-card"><h2>世界時鐘 <code>dayjs().tz("Asia/Tokyo")</code></h2>
          <div class="dj-big"><b class="tpe">--:--:--</b><small class="ampm"></small></div><div class="dj-sub tpeDate"></div>
          <div class="zones" style="margin-top:6px">${ZONES.map(([e, n], i) => `<div class="dj-zone${i ? "" : " me"}"><span>${e}</span><span>${n}</span><b class="z${i}"></b><div class="dj-strip"><i class="m${i}"></i></div><span class="off o${i}"></span></div>`).join("")}</div></div>
        <div class="dj-card"><h2>倒數計時 <code>dayjs.duration(ms)</code></h2>
          <input type="datetime-local" class="dj-field custom" style="display:none;margin-bottom:6px">
          <div class="dj-cd"><div><b class="dd">0</b><small>天</small></div><div><b class="hh">00</b><small>時</small></div><div><b class="mm">00</b><small>分</small></div><div><b class="ss">00</b><small>秒</small></div></div>
          <div class="dj-sub">目標 <b class="tgt">-</b><br>fromNow：<b class="from">-</b>　humanize：<b class="hum">-</b><br>ISO 8601 期間：<b class="iso dj-code" style="color:var(--fg)">-</b></div>
          <div class="dj-sub ytxt" style="margin-top:10px"></div><div class="dj-pbar"><i class="ybar"></i></div></div></div>`);
      const custom = ctx.$(".custom");
      custom.value = dayjs().tz(TPE).add(10, "day").hour(18).minute(0).format("YYYY-MM-DDTHH:mm");
      const TARGETS = [
        (now) => dayjs.tz(`${now.year() + 1}-01-01 00:00`, TPE),
        (now) => { const d = LUNAR_NEW_YEAR.find((s) => dayjs.tz(`${s} 00:00`, TPE).isAfter(now)); return d ? dayjs.tz(`${d} 00:00`, TPE) : null; },
        (now) => { const t = dayjs.tz(`${now.year()}-12-25 00:00`, TPE); return t.isAfter(now) ? t : t.add(1, "year"); },
        () => (custom.value ? dayjs.tz(custom.value, TPE) : null),
      ];
      let ti = 0;
      const tick = () => {
        const now = dayjs(), tpe = now.tz(TPE);
        ctx.$(".tpe").textContent = tpe.format("HH:mm:ss");
        ctx.$(".ampm").textContent = tpe.format("A");
        ctx.$(".tpeDate").textContent = `台北 ${tpe.format("LL dddd")}・UTC${tpe.format("Z")}・第 ${tpe.isoWeek()} 週`;
        ZONES.forEach(([, , zone], i) => {
          const t = now.tz(zone), dh = (t.utcOffset() - tpe.utcOffset()) / 60;
          const dd = t.format("YYYYMMDD") > tpe.format("YYYYMMDD") ? 1 : t.format("YYYYMMDD") < tpe.format("YYYYMMDD") ? -1 : 0;
          ctx.$(`.z${i}`).textContent = t.format("HH:mm:ss");
          ctx.$(`.m${i}`).style.left = `${((t.hour() * 60 + t.minute()) / 1440) * 100}%`;
          ctx.$(`.o${i}`).innerHTML = i ? `<span class="dj-badge ${dd > 0 ? "next" : dd < 0 ? "prev" : ""}">${dd > 0 ? "明天" : dd < 0 ? "昨天" : "今天"}</span> ${dh > 0 ? "+" : ""}${dh}h` : `UTC${t.format("Z")}`;
        });
        const target = TARGETS[ti](tpe);
        if (!target || !target.isValid()) {
          ["dd", "hh", "mm", "ss"].forEach((c) => (ctx.$(`.${c}`).textContent = "-"));
          ctx.$(".tgt").textContent = "請選擇日期";
        } else {
          const ms = Math.max(0, target.diff(now)), d = dayjs.duration(ms);
          ctx.$(".dd").textContent = Math.floor(d.asDays());
          ctx.$(".hh").textContent = pad(d.hours());
          ctx.$(".mm").textContent = pad(d.minutes());
          ctx.$(".ss").textContent = pad(d.seconds());
          ctx.$(".tgt").textContent = target.format("YYYY/MM/DD dddd HH:mm");
          ctx.$(".from").textContent = ms ? target.fromNow() : "已到達";
          ctx.$(".hum").textContent = d.humanize();
          ctx.$(".iso").textContent = d.toISOString();
        }

      ctx.controls.classList.add("bottom");
      makeBench();
      paint();
    },
  },
] });
