<body>
<script src="https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

<script>
// deck.gl showcase: eight scenes from a MapLibre-hosted hexagon map to a multi-million point stress ramp.
const D = window.deck || {};
const {
  Deck, MapView, OrbitView, OrthographicView, _GlobeView: GlobeView, FlyToInterpolator, LinearInterpolator,
  LightingEffect, AmbientLight, _SunLight: SunLight, COORDINATE_SYSTEM, MapboxOverlay,
  HexagonLayer, ArcLayer, ScatterplotLayer, GeoJsonLayer, TextLayer, TripsLayer, PathLayer, IconLayer, HeatmapLayer,
  GridLayer, ScreenGridLayer, TileLayer, BitmapLayer, SimpleMeshLayer, PointCloudLayer, ColumnLayer,
  DataFilterExtension, CollisionFilterExtension,
} = D;

const MAPLIBRE_URL = "https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";
const STYLE_URL = "https://tiles.openfreemap.org/styles/dark";
const TW_URL = "https://cdn.jsdelivr.net/npm/taiwan-atlas@2021.9.20/counties-10t.json";
const WORLD_URL = "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json";
const ESRI_DARK = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}";
const DECK_FONT = '"Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif';
const COLOR_RANGE = [[27, 42, 74], [76, 201, 240], [157, 140, 255], [247, 37, 133], [255, 140, 66], [247, 223, 30]];
const RAMP = `linear-gradient(90deg, ${COLOR_RANGE.map((c) => `rgb(${c})`).join(", ")})`;
const PALETTE = [[247, 223, 30], [76, 201, 240], [247, 37, 133], [157, 140, 255], [123, 211, 137], [255, 140, 66]];

// Illustrative city centers and relative population weights.
const CITIES = [
  ["台北", 121.5654, 25.0330, 1.0], ["新北", 121.4628, 25.0144, 0.9], ["桃園", 121.3010, 24.9936, 0.7], ["新竹", 120.9675, 24.8138, 0.45],
  ["苗栗", 120.8214, 24.5602, 0.15], ["台中", 120.6736, 24.1477, 0.85], ["彰化", 120.5161, 24.0518, 0.35], ["南投", 120.6848, 23.9096, 0.12],
  ["雲林", 120.5439, 23.7092, 0.15], ["嘉義", 120.4491, 23.4801, 0.25], ["台南", 120.2270, 22.9997, 0.6], ["高雄", 120.3014, 22.6273, 0.8],
  ["屏東", 120.4880, 22.6727, 0.25], ["宜蘭", 121.7537, 24.7021, 0.2], ["花蓮", 121.6014, 23.9872, 0.18], ["台東", 121.1442, 22.7583, 0.12],
  ["基隆", 121.7419, 25.1276, 0.2],
];
const CITY = Object.fromEntries(CITIES.map((c) => [c[0], c]));
// Illustrative commute flows into the biggest metro areas: [from, to, relative volume].
const FLOWS = [
  ["新北", "台北", 9], ["桃園", "台北", 7], ["基隆", "台北", 4], ["宜蘭", "台北", 3], ["新竹", "台北", 4], ["新竹", "桃園", 3],
  ["彰化", "台中", 6], ["苗栗", "台中", 3], ["南投", "台中", 3], ["雲林", "台中", 2], ["嘉義", "台南", 3],
  ["台南", "高雄", 6], ["屏東", "高雄", 6], ["台東", "高雄", 2], ["花蓮", "台北", 2], ["台中", "台北", 5], ["高雄", "台北", 4],
].map(([a, b, v]) => ({ from: CITY[a], to: CITY[b], v }));

// County figures are rounded recent estimates (population in thousands, area in km2), for illustration only.
// The last two numbers are a label point inside each county.
const COUNTIES = [
  ["新北市", 4048, 2052.6, 121.70, 24.95], ["臺北市", 2495, 271.8, 121.56, 25.07], ["桃園市", 2327, 1221.0, 121.25, 24.90],
  ["臺中市", 2852, 2214.9, 120.80, 24.20], ["臺南市", 1858, 2191.7, 120.30, 23.15], ["高雄市", 2733, 2951.9, 120.50, 22.95],
  ["基隆市", 361, 132.8, 121.72, 25.12], ["新竹市", 451, 104.2, 120.95, 24.79], ["嘉義市", 263, 60.0, 120.45, 23.48],
  ["新竹縣", 591, 1427.5, 121.15, 24.70], ["苗栗縣", 535, 1820.3, 120.90, 24.48], ["彰化縣", 1240, 1074.4, 120.48, 23.98],
  ["南投縣", 482, 4106.4, 120.95, 23.85], ["雲林縣", 668, 1290.8, 120.40, 23.70], ["嘉義縣", 486, 1903.6, 120.58, 23.40],
  ["屏東縣", 795, 2775.6, 120.60, 22.50], ["宜蘭縣", 450, 2143.6, 121.65, 24.60], ["花蓮縣", 318, 4628.6, 121.40, 23.75],
  ["臺東縣", 213, 3515.3, 121.05, 22.85], ["澎湖縣", 107, 126.9, 119.58, 23.57], ["金門縣", 142, 151.7, 118.37, 24.45],
  ["連江縣", 14, 28.8, 119.95, 26.16],
].map(([name, pop, area, lng, lat]) => ({ name, pop, area, pos: [lng, lat] }));

// World metro anchors for the stress test: [lng, lat, relative weight].
const WORLD = [
  [121.56, 25.03, 1.0], [139.69, 35.68, 1.6], [126.98, 37.57, 1.1], [121.47, 31.23, 1.5], [116.4, 39.9, 1.3], [114.17, 22.32, 1.0],
  [113.26, 23.13, 1.2], [120.98, 14.6, 1.0], [106.85, -6.2, 1.2], [103.82, 1.35, 0.6], [100.5, 13.75, 0.9], [106.7, 10.78, 0.8],
  [77.21, 28.61, 1.6], [72.88, 19.08, 1.4], [88.36, 22.57, 1.0], [55.27, 25.2, 0.5], [31.24, 30.04, 1.0], [3.38, 6.52, 1.0],
  [28.05, -26.2, 0.6], [-0.12, 51.5, 1.0], [2.35, 48.86, 0.9], [13.4, 52.52, 0.6], [37.62, 55.75, 0.9], [28.97, 41.0, 0.9],
  [-74.0, 40.71, 1.2], [-118.24, 34.05, 1.0], [-87.63, 41.88, 0.6], [-99.13, 19.43, 1.1], [-46.63, -23.55, 1.2], [-58.38, -34.6, 0.8],
  [151.21, -33.87, 0.5],
];

function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }
const gauss = (r) => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r());
const num = (v) => Math.round(v).toLocaleString("zh-TW");
const narrowHost = (host) => host.clientWidth < 560;
const info = (k, sel = "", extra = "") => `<div class="dk-info panel"><div class="dk-k">${k}</div><div class="dk-v"></div><div class="dk-sel">${sel}</div>${extra}</div>`;
const legend = (lo, hi) => `<div class="dk-legend" style="background:${RAMP}"></div><div class="dk-ticks"><span>${lo}</span><span>${hi}</span></div>`;
const clock = (h) => `${String(Math.floor(h) % 24).padStart(2, "0")}:${String(Math.floor((h % 1) * 60)).padStart(2, "0")}`;
function colorAt(t) {
  const x = Math.max(0, Math.min(1, t)) * (COLOR_RANGE.length - 1);
  const i = Math.min(COLOR_RANGE.length - 2, Math.floor(x)), f = x - i, a = COLOR_RANGE[i], b = COLOR_RANGE[i + 1];
  return [0, 1, 2].map((k) => Math.round(a[k] + (b[k] - a[k]) * f));
}
function km(a, b) {
  const R = Math.PI / 180, dLat = (b[1] - a[1]) * R, dLng = (b[0] - a[0]) * R;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * R) * Math.cos(b[1] * R) * Math.sin(dLng / 2) ** 2;
  return 2 * 6371 * Math.asin(Math.sqrt(h));
}
const loseContext = (c) => c?.getContext("webgl2")?.getExtension("WEBGL_lose_context")?.loseContext();
// Software WebGL (no GPU acceleration) draws instanced points roughly a hundred times slower, so heavy scenes start lighter there.
let softGLCache = null;
function softwareGL() {
  if (softGLCache != null) return softGLCache;
  const gl = document.createElement("canvas").getContext("webgl2");
  const ext = gl?.getExtension("WEBGL_debug_renderer_info");
  const name = gl ? String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER)) : "";
  gl?.getExtension("WEBGL_lose_context")?.loseContext();
  return (softGLCache = /swiftshader|llvmpipe|softpipe|software|basic render/i.test(name));
}

// Deck factory: one canvas per scene, finalized and context released on unmount so switching scenes never exhausts WebGL contexts.
function makeDeck(ctx, host, props) {
  if (!Deck) throw new Error("deck.gl 程式庫載入失敗（CDN 無回應）");
  const d = new Deck({ parent: host, controller: true, ...props });
  ctx.onCleanup(() => {
    const c = d.getCanvas();
    d.finalize();
    loseContext(c);
    host.replaceChildren();
  });
  return d;
}

// Illustrative population points: Gaussian clusters around each city, deterministic per seed. Item: [lng, lat, cityIndex].
function twPoints(scale, seed) {
  const r = rng(seed), out = [];
  CITIES.forEach(([, lng, lat, w], ci) => {
    const n = Math.round((900 * w + 60) * scale), sigma = 0.025 + w * 0.035;
    for (let i = 0; i < n; i++) out.push([lng + gauss(r) * sigma, lat + gauss(r) * sigma * 0.9, ci]);
  });
  return out;
}

// Fetch that ignores the abort signal: tiles dropped by a camera move or a scene switch finish downloading
// in the background and are discarded, instead of surfacing as net::ERR_ABORTED.
const fetchNoAbort = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`); return r; });

// Keyless Esri dark-gray raster tiles through TileLayer + BitmapLayer; a failed tile only leaves the background dark.
function esriBase(ctx) {
  let warned = false;
  return new TileLayer({
    id: "esri-base", data: ESRI_DARK, minZoom: 0, maxZoom: 16, tileSize: 256,
    getTileData: ({ url }) => fetchNoAbort(url).then((r) => r.blob()).then((b) => createImageBitmap(b)),
    onTileError: () => {
      if (warned || !ctx.active) return;
      warned = true;
      ctx.status("").error("底圖圖磚載入失敗，改為純色背景");
    },
    renderSubLayers: (p) => {
      const [[w, s], [e, n]] = p.tile.boundingBox;
      return new BitmapLayer(p, { data: null, image: p.data, bounds: [w, s, e, n] });
    },
  });
}

function fetchJson(url) {
  return fetch(url).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
}
let twPromise = null, worldPromise = null;
function loadCounties() {
  twPromise ??= fetchJson(TW_URL).then((topo) => {
    if (typeof topojson === "undefined") throw new Error("topojson-client 未載入");
    const byName = Object.fromEntries(COUNTIES.map((c) => [c.name, c]));
    return topojson.feature(topo, topo.objects.counties).features
      .map((f) => ({ ...f, properties: { ...f.properties, rec: byName[String(f.properties.COUNTYNAME).replace(/台/g, "臺")] } }))
      .filter((f) => f.properties.rec);
  }).catch((e) => { twPromise = null; throw e; });
  return twPromise;
}
function loadWorld() {
  worldPromise ??= fetchJson(WORLD_URL).then((topo) => {
    if (typeof topojson === "undefined") throw new Error("topojson-client 未載入");
    // Antarctica wraps the pole and tessellates badly on the globe, so it is left out.
    return topojson.feature(topo, topo.objects.countries).features.filter((f) => f.id !== "010");
  }).catch((e) => { worldPromise = null; throw e; });
  return worldPromise;
}

let ptsCache = {}, eventsCache = null;
let nabRegistered = false;
const cachedPoints = (scale, seed) => (ptsCache[`${scale}:${seed}`] ??= twPoints(scale, seed));

Showcase.run({ scenes: [
  {
    id: "hex", title: "人口六角柱",
    api: "map.addControl(new MapboxOverlay({ layers: [new HexagonLayer(), new ArcLayer()] }))",
    desc: "deck.gl 疊在 MapLibre 向量底圖上：HexagonLayer 把示意人口點聚合成 3D 六角柱（長出來的動畫是 transitions），ArcLayer 畫通勤流向，滑鼠可逐格挑選。底圖用 OpenFreeMap 免金鑰樣式。",
    hint: "拖曳旋轉・滑過六角柱或弧線看數值・按「換視角」飛到下一個都會區",
    async mount(ctx) {
      ctx.html(`<div class="dk-map"></div>${info("示意人口點", "滑過六角柱或弧線看數值", legend("少", "多"))}`);
      const host = ctx.$(".dk-map"), selEl = ctx.$(".dk-sel");
      const POINTS = cachedPoints(1, 7);
      ctx.$(".dk-v").innerHTML = `<span class="dk-num">${num(POINTS.length)}</span> 點`;
      const narrow = narrowHost(host);
      const VIEWS = [
        { center: [120.95, 23.65], zoom: 6.9, pitch: 52, bearing: -18 },
        { center: [121.35, 24.92], zoom: 8.1, pitch: 55, bearing: 25 },
        { center: [120.4, 22.95], zoom: 7.9, pitch: 55, bearing: -35 },
      ].map((v) => ({ ...v, zoom: v.zoom - (narrow ? 0.9 : 0) }));
      const st = { hex: true, arc: true, radius: 4500, elev: 40, grow: 0, view: 0 };
      const layers = () => [
        st.hex && new HexagonLayer({
          id: "hex", data: POINTS, getPosition: (d) => [d[0], d[1]], radius: st.radius, coverage: 0.86, extruded: true,
          elevationScale: st.elev * st.grow, elevationRange: [0, 1000], colorRange: COLOR_RANGE, upperPercentile: 99,
          pickable: true, autoHighlight: true, highlightColor: [255, 255, 255, 160],
          material: { ambient: 0.6, diffuse: 0.6, shininess: 40 }, transitions: { elevationScale: { duration: 1600 } },
        }),
        st.arc && new ArcLayer({
          id: "arcs", data: FLOWS, getSourcePosition: (d) => [d.from[1], d.from[2]], getTargetPosition: (d) => [d.to[1], d.to[2]],
          getSourceColor: [76, 201, 240, 220], getTargetColor: [247, 223, 30, 240], getWidth: (d) => 1 + d.v * 0.6, getHeight: 0.6,
          greatCircle: false, pickable: true, autoHighlight: true,
        }),
        new ScatterplotLayer({
          id: "cities", data: CITIES, getPosition: (d) => [d[1], d[2]], getRadius: (d) => 2500 + d[3] * 3000,
          getFillColor: [247, 223, 30, 60], getLineColor: [247, 223, 30, 200], stroked: true, lineWidthMinPixels: 1, pickable: true,
        }),
      ].filter(Boolean);
      const tooltip = ({ object, layer }) => {
        if (!object || !layer) return null;
        if (layer.id === "hex") {
          const n = object.count ?? object.points?.length ?? object.elevationValue;
          return { html: `<b>此格約 <span class="dk-num">${num(n * 120)}</span> 人</b><br>（<span class="dk-num">${n}</span> 個樣本點，示意）` };
        }
        if (layer.id === "arcs") return { html: `<b>${object.from[0]} → ${object.to[0]}</b><br>每日通勤約 <span class="dk-num">${(object.v * 1.2).toFixed(1)}</span> 萬人次（示意）` };
        return { html: `<b>${object[0]}</b>` };
      };
      const onHover = ({ object, layer }) => {
        if (!object || !layer) { selEl.textContent = "滑過六角柱或弧線看數值"; return; }
        if (layer.id === "hex") selEl.textContent = `此格 ${object.count ?? object.points?.length ?? "?"} 個樣本點`;
        else if (layer.id === "arcs") selEl.textContent = `${object.from[0]} → ${object.to[0]}`;
        else selEl.textContent = object[0];
      };

      const s = ctx.status("載入 MapLibre 底圖…");
      let ml = null;
      try { ml = await import(MAPLIBRE_URL); } catch { ml = null; }
      if (!ctx.active) return;
      let refresh, flyTo;
      if (ml && MapboxOverlay) {
        s.done();
        if (!nabRegistered) {
          nabRegistered = true;
          ml.addProtocol("nab", async (p) => {
            const r = await fetchNoAbort("https://" + p.url.slice(6));
            return { data: p.type === "json" ? await r.json() : p.type === "string" ? await r.text() : await r.arrayBuffer() };
          });
        }
        const map = new ml.Map({
          container: host, style: STYLE_URL, ...VIEWS[0], maxPitch: 75, attributionControl: { compact: true },
          transformRequest: (url) => (url.startsWith("https://") ? { url: "nab://" + url.slice(8) } : undefined),
        });
        const overlay = new MapboxOverlay({ interleaved: false, layers: layers(), getTooltip: tooltip, onHover });
        map.addControl(overlay);
        map.addControl(new ml.NavigationControl({ visualizePitch: true }), "bottom-right");
        ctx.onCleanup(() => {
          const canvases = [...host.querySelectorAll("canvas")];
          map.remove();
          canvases.forEach(loseContext);
          host.replaceChildren();
        });
        let warned = false;
        // Registering an error listener also keeps MapLibre from printing tile failures to the console.
        map.on("error", () => {
          if (warned || !ctx.active) return;
          warned = true;
          ctx.status("").error("底圖載入失敗（OpenFreeMap 無回應），圖層照常顯示");
        });
        refresh = () => overlay.setProps({ layers: layers() });
        flyTo = (v) => map.flyTo({ ...v, duration: 3500, essential: true });
        ctx.onResize(() => map.resize());
        map.once("load", () => { st.grow = 1; refresh(); });
      } else {
        s.error("MapLibre 載入失敗，改為無底圖模式");
        const toVS = (v) => ({ longitude: v.center[0], latitude: v.center[1], zoom: v.zoom, pitch: v.pitch, bearing: v.bearing });
        const d = makeDeck(ctx, host, { initialViewState: toVS(VIEWS[0]), layers: layers(), getTooltip: tooltip, onHover });
        refresh = () => d.setProps({ layers: layers() });
        flyTo = (v) => d.setProps({ initialViewState: { ...toVS(v), transitionDuration: 3000, transitionInterpolator: new FlyToInterpolator() } });
      }
      // Columns grow out of the ground once the basemap is ready (or after a short wait if it never loads).
      ctx.timeout(() => { if (!st.grow) { st.grow = 1; refresh(); } }, 4000);

      ctx.toggle("六角柱", true, (v) => { st.hex = v; refresh(); });
      ctx.toggle("通勤弧線", true, (v) => { st.arc = v; refresh(); });
      ctx.slider("半徑", { min: 2000, max: 9000, step: 500, value: st.radius, format: (v) => `${(v / 1000).toFixed(1)} km` }, (v) => { st.radius = v; refresh(); });
      ctx.slider("高度", { min: 10, max: 100, step: 5, value: st.elev, format: (v) => `×${v}` }, (v) => { st.elev = v; refresh(); });
      ctx.button("換視角", () => { st.view = (st.view + 1) % VIEWS.length; flyTo(VIEWS[st.view]); });
    },
  },
  {

    id: "globe", title: "地球視圖",
    api: "new Deck({ views: new _GlobeView(), effects: [new LightingEffect({ sun: new _SunLight({ timestamp }) })] })",
    desc: "實驗性的 GlobeView 把同一套圖層畫在球面上：SimpleMeshLayer 畫海洋球體，GeoJsonLayer 畫陸地與國界，ArcLayer 以大圓弧連到各城市。_SunLight 依時間戳記算出太陽方向，配合 LightingEffect 畫出晝夜分界。",
    hint: "拖曳旋轉地球・拉 UTC 時刻看晝夜線移動・滑過航線看距離",
    async mount(ctx) {
      ctx.html(`<div class="dk-map dk-space"></div>${info("台北時間", "滑過航線看距離", `<div class="dk-note">陸地：Natural Earth（world-atlas）・太陽位置為近似計算</div>`)}`);
      const host = ctx.$(".dk-map"), vEl = ctx.$(".dk-v"), selEl = ctx.$(".dk-sel");
      const narrow = narrowHost(host);
      let land = null;
      const s = ctx.status("載入國界…");
      try { land = await loadWorld(); s.done(); } catch (e) { s.error(`國界資料載入失敗（${e.message}），只顯示海洋球體與航線`); }
      if (!ctx.active) return;
      const TPE = [121.23, 25.08];
      const DEST = [
        ["東京", 139.69, 35.68], ["首爾", 126.98, 37.57], ["新加坡", 103.82, 1.35], ["雪梨", 151.21, -33.87], ["洛杉磯", -118.24, 34.05],
        ["紐約", -74.0, 40.71], ["倫敦", -0.12, 51.5], ["巴黎", 2.35, 48.86], ["杜拜", 55.27, 25.2], ["孟買", 72.88, 19.08],
        ["約翰尼斯堡", 28.05, -26.2], ["聖保羅", -46.63, -23.55], ["溫哥華", -123.12, 49.28], ["奧克蘭", 174.76, -36.85],
      ].map(([name, lng, lat]) => ({ name, p: [lng, lat], km: km(TPE, [lng, lat]) }));
      const now = new Date(), day0 = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      const st = { utc: now.getUTCHours() + Math.floor(now.getUTCMinutes() / 15) / 4, spin: true, flow: false, drag: false };
      const sun = new SunLight({ timestamp: day0 + st.utc * 3600e3, color: [255, 248, 230], intensity: 2.6 });
      const lighting = new LightingEffect({ ambient: new AmbientLight({ color: [255, 255, 255], intensity: 0.22 }), sun });
      const sphere = new SimpleMeshLayer({
        id: "earth", data: [0], mesh: new luma.SphereGeometry({ radius: 6.3e6, nlat: 36, nlong: 72 }),
        coordinateSystem: COORDINATE_SYSTEM.CARTESIAN, getPosition: [0, 0, 0], getColor: [26, 58, 100],
      });
      const layers = [
        sphere,
        land && new GeoJsonLayer({ id: "land", data: land, filled: true, stroked: true, getFillColor: [58, 96, 120], getLineColor: [140, 180, 210, 140], lineWidthMinPixels: 0.6 }),
        new ArcLayer({
          id: "routes", data: DEST, getSourcePosition: TPE, getTargetPosition: (d) => d.p, greatCircle: true, getHeight: 0.35,
          getSourceColor: [76, 201, 240, 230], getTargetColor: [247, 223, 30, 240], getWidth: 2, pickable: true, autoHighlight: true, highlightColor: [255, 255, 255, 255],
        }),
        new ScatterplotLayer({ id: "dests", data: [{ name: "台北", p: TPE }, ...DEST], getPosition: (d) => d.p, getFillColor: [247, 223, 30], radiusUnits: "pixels", getRadius: 3 }),
        new TextLayer({
          id: "dest-names", data: DEST, getPosition: (d) => d.p, getText: (d) => d.name, characterSet: "auto", fontFamily: DECK_FONT,
          getSize: 11, getColor: [236, 235, 230, 220], getPixelOffset: [0, -12], background: true, getBackgroundColor: [5, 7, 11, 170], backgroundPadding: [3, 1],
        }),
      ].filter(Boolean);
      let vs = { longitude: 135, latitude: 20, zoom: narrow ? 0.45 : 1.3 };
      const deckI = makeDeck(ctx, host, {
        views: new GlobeView({ id: "globe" }),
        viewState: vs,
        onViewStateChange: ({ viewState }) => { vs = viewState; deckI.setProps({ viewState: vs }); },
        onInteractionStateChange: (s) => { st.drag = !!(s.isDragging || s.isZooming || s.isPanning || s.isRotating); },
        effects: [lighting], layers,
        getTooltip: ({ object }) => (object?.km ? { html: `<b>台北 → ${object.name}</b><br>大圓距離約 <span class="dk-num">${num(object.km)}</span> 公里` } : null),
        onHover: ({ object }) => { selEl.textContent = object?.km ? `台北 → ${object.name}：約 ${num(object.km)} 公里` : "滑過航線看距離"; },
      });
      let utcInput = null;
      const showTime = () => { vEl.innerHTML = `<span class="dk-num">${clock((st.utc + 8) % 24)}</span>`; };
      const setSun = () => { sun.timestamp = day0 + st.utc * 3600e3; showTime(); deckI.redraw("sun moved"); };
      showTime();
      ctx.raf((t, dt) => {
        if (st.flow) {
          st.utc = (st.utc + (dt / 1000) * 0.8) % 24;
          utcInput.value = st.utc;
          utcInput.nextElementSibling.textContent = clock(st.utc);
          setSun();
        }
        if (st.spin && !st.drag) { vs = { ...vs, longitude: vs.longitude + dt * 0.006 }; deckI.setProps({ viewState: vs }); }
      });
      ctx.toggle("自動旋轉", true, (v) => { st.spin = v; });
      ctx.toggle("時間流動", false, (v) => { st.flow = v; });
      utcInput = ctx.slider("UTC", { min: 0, max: 23.75, step: 0.25, value: st.utc, format: clock }, (v) => { st.utc = v; setSun(); });
    },
  },
  {
    id: "views", title: "多視圖與二進位屬性",
    api: "views: [new OrbitView(), new OrthographicView(), new OrthographicView()]・data: { length, attributes: { getPosition: { value, size, stride } } }",
    desc: "同一個 Deck 裡放三個視圖：左邊 OrbitView 用 PointCloudLayer 看 3D 的 Lorenz 吸子，右邊兩個 OrthographicView 分別投影到 XY 與 XZ 平面，layerFilter 決定每個視圖畫哪些圖層。資料全是 Float32Array／Uint8Array 直接當二進位屬性上傳（XY 視圖用 stride 從 XYZ 緩衝區跳著讀），改參數時只重算陣列、不建立任何 JS 物件。",
    hint: "拉 ρ 看混沌與收斂的差別・拖曳各視圖旋轉或平移",
    mount(ctx) {
      ctx.html(`<div class="dk-map dk-space"></div><div class="dk-frame"><span>3D 軌道視角（OrbitView）</span></div><div class="dk-frame"><span>俯視 XY 平面</span></div><div class="dk-frame"><span>側視 XZ 平面</span></div>${info("Lorenz 吸子（σ = 10，β = 8/3）", "", softwareGL() ? `<div class="dk-note">偵測到軟體繪圖（沒有 GPU 加速），預設點數已降低</div>` : "")}`);
      const host = ctx.$(".dk-map"), frames = ctx.$$(".dk-frame"), infoEl = ctx.$(".dk-info"), vEl = ctx.$(".dk-v"), selEl = ctx.$(".dk-sel");
      const MAXN = 400000;
      const POS = new Float32Array(MAXN * 3), XZ = new Float32Array(MAXN * 2), COL = new Uint8Array(MAXN * 4);
      const LUT = Array.from({ length: 256 }, (_, i) => colorAt(i / 255));
      const soft = softwareGL();
      const st = { n: soft ? 10000 : 150000, rho: 28, spin: true, drag: false, calcMs: 0, drawMs: null, pending: 0 };
      let data = null;
      const compute = () => {
        const t0 = performance.now(), sg = 10, b = 8 / 3, dt = 0.004, n = st.n, rho = st.rho;
        let x = 0.1, y = 0, z = 0;
        for (let i = 0; i < n; i++) {
          const dx = sg * (y - x), dy = x * (rho - z) - y, dz = x * y - b * z;
          x += dx * dt; y += dy * dt; z += dz * dt;
          POS[i * 3] = x; POS[i * 3 + 1] = y; POS[i * 3 + 2] = z - 25;
          XZ[i * 2] = x; XZ[i * 2 + 1] = z - 25;
          const c = LUT[Math.min(255, Math.floor((Math.hypot(dx, dy, dz) / 170) * 255))];
          COL[i * 4] = c[0]; COL[i * 4 + 1] = c[1]; COL[i * 4 + 2] = c[2]; COL[i * 4 + 3] = 215;
        }
        const pos = POS.subarray(0, n * 3), col = COL.subarray(0, n * 4);
        const color = { value: col, size: 4, normalized: true };
        data = {
          orbit: { length: n, attributes: { getPosition: { value: pos, size: 3 }, getColor: color } },
          xy: { length: n, attributes: { getPosition: { value: pos, size: 2, stride: 12, offset: 0 }, getFillColor: color } },
          xz: { length: n, attributes: { getPosition: { value: XZ.subarray(0, n * 2), size: 2 }, getFillColor: color } },
        };
        st.calcMs = performance.now() - t0;
      };
      const layers = () => [
        new PointCloudLayer({ id: "orbit-cloud", data: data.orbit, pointSize: 1.5, sizeUnits: "pixels", material: false }),
        new ScatterplotLayer({ id: "xy-cloud", data: data.xy, radiusUnits: "pixels", getRadius: 0.9 }),
        new ScatterplotLayer({ id: "xz-cloud", data: data.xz, radiusUnits: "pixels", getRadius: 0.9 }),
      ];
      // Layout in fractions of the host: side-by-side when wide, stacked when narrow; panels under the controls start below them.
      const layout = () => {
        const w = host.clientWidth, h = host.clientHeight, wide = w >= 700;
        const hb = host.getBoundingClientRect(), cb = ctx.controls.getBoundingClientRect();
        const top = cb.height && cb.top < hb.top + h / 2 ? Math.min(0.3, (cb.bottom - hb.top + 6) / h) : 0.01;
        const half = (1 - top - 0.022) / 2;
        const L = wide
          ? { orbit: [0, 0, 0.64, 1], xy: [0.65, top, 0.34, half], xz: [0.65, top + half + 0.012, 0.34, half] }
          : { orbit: [0, top, 1, 0.58 - top], xy: [0.01, 0.59, 0.485, 0.4], xz: [0.505, 0.59, 0.485, 0.4] };
        ["orbit", "xy", "xz"].forEach((k, i) => {
          const [x, y, fw, fh] = L[k];
          Object.assign(frames[i].style, { left: `${x * 100}%`, top: `${y * 100}%`, width: `${fw * 100}%`, height: `${fh * 100}%` });
        });
        infoEl.style.bottom = wide ? "" : `calc(${42 * h / 100}px + 10px)`;
        const px = (k) => [L[k][2] * w, L[k][3] * h];
        const [ow, oh] = px("orbit"), [aw, ah] = px("xy");
        return {
          L,
          zoom: { orbit: Math.log2(Math.min(ow, oh) / 70), xy: Math.log2(Math.min(aw / 50, ah / 64)), xz: Math.log2(Math.min(aw / 50, ah / 58)) },
        };
      };
      const pct = (v) => `${v * 100}%`;
      const makeViews = (L) => [
        new OrbitView({ id: "orbit", x: pct(L.orbit[0]), y: pct(L.orbit[1]), width: pct(L.orbit[2]), height: pct(L.orbit[3]), controller: true, orbitAxis: "Z" }),
        new OrthographicView({ id: "xy", x: pct(L.xy[0]), y: pct(L.xy[1]), width: pct(L.xy[2]), height: pct(L.xy[3]), controller: true, flipY: false }),
        new OrthographicView({ id: "xz", x: pct(L.xz[0]), y: pct(L.xz[1]), width: pct(L.xz[2]), height: pct(L.xz[3]), controller: true, flipY: false }),
      ];
      // Controls first, so the layout can measure them.
      ctx.slider("ρ", { min: 10, max: 40, step: 0.5, value: st.rho, format: (v) => v.toFixed(1) }, (v) => { st.rho = v; rebuild(); });
      ctx.slider("點數", { min: 10000, max: MAXN, step: 10000, value: st.n, format: Showcase.fmtCompact }, (v) => { st.n = v; rebuild(); });
      ctx.toggle("自動旋轉", true, (v) => { st.spin = v; });
      compute();
      let lay = layout();
      let vs = {
        orbit: { target: [0, 0, 0], rotationX: 18, rotationOrbit: 30, zoom: lay.zoom.orbit, minZoom: -3, maxZoom: 6 },
        xy: { target: [0, 0, 0], zoom: lay.zoom.xy },
        xz: { target: [0, 0, 0], zoom: lay.zoom.xz },
      };
      const report = () => {
        vEl.innerHTML = `<span class="dk-num">${num(st.n)}</span> 點`;
        const mb = (b) => (b < 1048576 ? `${Math.round(b / 1024)} KB` : `${(b / 1048576).toFixed(1)} MB`);
        selEl.innerHTML = `位置 ${mb(st.n * 20)}・顏色 ${mb(st.n * 4)}<br>重算 <span class="dk-num">${Showcase.fmtMs(st.calcMs)}</span>・上傳到畫出 <span class="dk-num">${st.drawMs == null ? "…" : Showcase.fmtMs(st.drawMs)}</span>`;
      };
      const deckI = makeDeck(ctx, host, {
        views: makeViews(lay.L), viewState: vs, layers: layers(),
        layerFilter: ({ layer, viewport }) => layer.id.startsWith(viewport.id),
        onViewStateChange: ({ viewId, viewState }) => { vs = { ...vs, [viewId]: viewState }; deckI.setProps({ viewState: vs }); },
        onInteractionStateChange: (s) => { st.drag = !!(s.isDragging || s.isZooming || s.isPanning || s.isRotating); },
        onAfterRender: () => { if (st.pending) { st.drawMs = performance.now() - st.pending; st.pending = 0; report(); } },
      });
      const rebuild = () => { compute(); st.drawMs = null; st.pending = performance.now(); deckI.setProps({ layers: layers() }); report(); };
      st.pending = performance.now();
      report();
      ctx.onResize(() => {
        lay = layout();
        vs = { orbit: { ...vs.orbit, zoom: lay.zoom.orbit }, xy: { ...vs.xy, zoom: lay.zoom.xy }, xz: { ...vs.xz, zoom: lay.zoom.xz } };
        deckI.setProps({ views: makeViews(lay.L), viewState: vs });
      });
      ctx.raf((t, dt) => {
        if (!st.spin || st.drag) return;
        vs = { ...vs, orbit: { ...vs.orbit, rotationOrbit: vs.orbit.rotationOrbit + dt * 0.012 } };
        deckI.setProps({ viewState: vs });
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new ScatterplotLayer({ data: { length, attributes: { getPosition: { value: Float32Array, size: 2 } } } })",
    desc: "同一批示意點用兩種格式交給 ScatterplotLayer：二進位屬性（Float32Array 直接上傳 GPU），或一般物件陣列（deck.gl 逐筆呼叫存取器填緩衝區）。從十萬點一路加到四百萬點，畫面持續平移讓每格都重畫，看 FPS、建立耗時與記憶體。",
    hint: "按「自動加壓」開始；切換資料格式後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="dk-map dk-stress"></div>`);
      const host = ctx.$(".dk-map");
      const narrow = narrowHost(host);
      const MAX = 4000000, r = rng(41);
      const POS = new Float32Array(MAX * 2), COL = new Uint8Array(MAX * 4), KIDX = new Uint8Array(MAX);
      const total = WORLD.reduce((a, m) => a + m[2], 0);
      let filled = 0;
      const pickMetro = () => { let x = r() * total; for (const m of WORLD) { x -= m[2]; if (x <= 0) return m; } return WORLD[0]; };
      // Fill the shared typed arrays lazily up to n: 85 % metro clusters, 15 % corridors between metros.
      const ensure = (n) => {
        for (let i = filled; i < n; i++) {
          let lng, lat, k;
          if (r() < 0.85) {
            const m = pickMetro(), s = 0.4 + 2.2 * r() * r();
            lng = m[0] + gauss(r) * s * 1.2; lat = m[1] + gauss(r) * s;
            k = WORLD.indexOf(m) % PALETTE.length;
          } else {
            const a = pickMetro(), b = pickMetro(), f = r();
            lng = a[0] + (b[0] - a[0]) * f + gauss(r) * 0.3; lat = a[1] + (b[1] - a[1]) * f + gauss(r) * 0.3;
            k = PALETTE.length;
          }
          POS[i * 2] = lng; POS[i * 2 + 1] = Math.max(-80, Math.min(80, lat));
          const c = k < PALETTE.length ? PALETTE[k] : [130, 140, 160];
          COL[i * 4] = c[0]; COL[i * 4 + 1] = c[1]; COL[i * 4 + 2] = c[2]; COL[i * 4 + 3] = k < PALETTE.length ? 150 : 90;
          KIDX[i] = k;
        }
        filled = Math.max(filled, n);
      };
      const COLORS = [...PALETTE.map((c) => [...c, 150]), [130, 140, 160, 90]];
      const MODES = ["二進位屬性", "物件陣列"];
      let mode = 0, count = 0, buildMs = 0, objs = [], afterRender = null;
      const layer = () => (mode === 0
        ? new ScatterplotLayer({
          id: "pts-binary", radiusUnits: "pixels", getRadius: 1, radiusMinPixels: 1,
          data: { length: count, attributes: { getPosition: { value: POS.subarray(0, count * 2), size: 2 }, getFillColor: { value: COL.subarray(0, count * 4), size: 4, normalized: true } } },
        })
        : new ScatterplotLayer({
          id: "pts-objects", radiusUnits: "pixels", getRadius: 1, radiusMinPixels: 1,
          data: objs.length === count ? objs : objs.slice(0, count), getPosition: (d) => [d.x, d.y], getFillColor: (d) => COLORS[d.k],
        }));
      let vs = { longitude: 110, latitude: 22, zoom: narrow ? 1.1 : 1.9, pitch: 0, bearing: 0 }, phase = 0, drag = false;
      const deckI = makeDeck(ctx, host, {
        viewState: vs, layers: [],
        onViewStateChange: ({ viewState }) => { vs = viewState; deckI.setProps({ viewState: vs }); },
        onInteractionStateChange: (s) => { drag = !!(s.isDragging || s.isZooming || s.isPanning); },
        onAfterRender: () => { if (afterRender) { const f = afterRender; afterRender = null; f(); } },
      });
      // Keep the view drifting so every frame is a full redraw of all points.
      ctx.raf((t, dt) => {
        if (drag) return;
        phase += dt;
        vs = { ...vs, longitude: vs.longitude + Math.cos(phase / 4000) * dt * 0.006 };
        deckI.setProps({ viewState: vs });
      });
      // Sum of the attribute buffers deck.gl uploaded (luma.gl's memory stats are not populated in this build).
      const gpuBytes = () => {
        let bytes = 0;
        for (const l of deckI.layerManager?.getLayers() ?? []) {
          for (const a of Object.values(l.getAttributeManager?.()?.getAttributes() ?? {})) bytes += a.buffer?.byteLength ?? 0;
        }
        return bytes;
      };
      const draw = async (n) => {
        ensure(n);
        count = n;
        const t0 = performance.now();
        if (mode === 1) for (let i = objs.length; i < n; i++) objs.push({ x: POS[i * 2], y: POS[i * 2 + 1], k: KIDX[i] });
        const done = new Promise((res) => { afterRender = res; ctx.timeout(res, 20000); });
        deckI.setProps({ layers: [layer()] });
        await done;
        buildMs = performance.now() - t0;
      };
      ctx.group(MODES, 0, async (i) => {
        if (i === mode) return;
        mode = i;
        if (i === 0) objs = [];
        await draw(count);
      });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "點數", steps: [100000, 250000, 500000, 1000000, 2000000, 4000000],
        minFps: 30,
        apply: draw,
        metrics: () => ({
          "資料格式": MODES[mode],
          "建立耗時": Showcase.fmtMs(buildMs),
          "GPU 緩衝區": `${(gpuBytes() / 1048576).toFixed(1)} MB`,
        }),
        note: "兩種格式上傳後在 GPU 上的繪製成本相同，所以 FPS 主要跟點數有關；差別在建立耗時與 JS 記憶體。物件陣列的建立耗時包含產生 JS 物件與逐筆呼叫存取器，二進位屬性則幾乎只剩上傳。點小到 1 像素時瓶頸通常是頂點數，點變大後換成填色像素數。",
      });
    },
  },
] });
</script>
</body>
