<script src="https://cdn.jsdelivr.net/npm/dexie@4.4.6/dist/dexie.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Dexie.js showcase: an offline todo app, schema upgrades, index queries, transactions, liveQuery,
// bulk writes with DBCore middleware, collection paging and a bulkAdd / index-query throughput benchmark.
const PREFIX = "atlas-dexiejs-";
const { fmt, fmtMs, fmtCompact } = Showcase;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const since = (t0) => performance.now() - t0;
const day = (t) => new Date(t).toISOString().slice(0, 10);
const mb = (b) => (b >= 1073741824 ? `${(b / 1073741824).toFixed(1)} GB` : `${(b / 1048576).toFixed(b < 10485760 ? 2 : 1)} MB`);

// Seeded PRNG (mulberry32) so every visit gets the same sample data
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const SUR = "陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴周".split("");
const GIV = ["怡君", "志明", "淑芬", "家豪", "雅婷", "俊傑", "美玲", "建宏", "宜蓁", "冠宇", "佳穎", "承恩", "詩涵", "柏翰", "心怡", "宇軒"];
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "新竹市", "基隆市", "宜蘭縣", "花蓮縣"];
const TAGS = ["Python", "JavaScript", "設計", "行銷", "資料分析", "AI", "攝影", "英文"];
function people(n, seed = 1) {
  const r = rng(seed);
  const pick = (a) => a[Math.floor(r() * a.length)];
  return Array.from({ length: n }, () => ({
    name: pick(SUR) + pick(GIV), city: pick(CITIES), age: 18 + Math.floor(r() * 50),
    tags: [...new Set([pick(TAGS), pick(TAGS), pick(TAGS)].slice(0, 1 + Math.floor(r() * 3)))],
    joined: Date.UTC(2023, 0, 1) + Math.floor(r() * 1000) * 864e5,
  }));
}

// A scene-owned database: deleted first (fresh start) and closed + deleted when the scene unmounts.
async function freshDb(ctx, suffix, setup) {
  const name = PREFIX + suffix;
  await Dexie.delete(name);
  const db = new Dexie(name);
  setup(db);
  ctx.onCleanup(() => { db.close(); Dexie.delete(name).catch((e) => console.warn("Dexie.delete failed", e)); });
  await db.open();
  return db;
}
// liveQuery subscription that ends with the scene
function live(ctx, query, next) {
  const sub = Dexie.liveQuery(query).subscribe({ next, error: (e) => console.error(e) });
  ctx.onCleanup(() => sub.unsubscribe());
  return sub;
}
function makeLog(el, max = 40) {
  return (text, { t, cls = "" } = {}) => {
    const row = document.createElement("div");
    row.className = cls;
    row.innerHTML = `<span>${esc(text)}</span><small>${t != null ? fmtMs(t) : ""}</small>`;
    el.prepend(row);
    while (el.children.length > max) el.lastChild.remove();
  };
}
// cols: [key, label, kind] where kind "n" right-aligns numbers and "d" formats epoch ms as a date
function tableHtml(rows, cols, { max = 120, flash } = {}) {
  if (!rows.length) return '<div class="dx-empty">沒有符合的資料</div>';
  const cell = (v, kind) => (v == null ? "" : kind === "d" ? day(v) : kind === "n" ? fmt(v) : Array.isArray(v) ? v.join("、") : v);
  return `<table class="dx-t"><thead><tr>${cols.map(([, l, k]) => `<th class="${k === "n" ? "n" : ""}">${esc(l)}</th>`).join("")}</tr></thead><tbody>${rows.slice(0, max).map((r) =>
    `<tr${flash && flash(r) ? ' class="flash"' : ""}>${cols.map(([key, , k]) => `<td class="${k === "n" ? "n" : ""}">${esc(cell(r[key], k))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
const autoCols = (rows) => [...new Set(rows.flatMap((r) => Object.keys(r)))].map((k) => [k, k, k === "id" ? "n" : ""]);
function bars(el, items) {
  const max = Math.max(...items.map((x) => x.v), 1e-6);
  el.innerHTML = items.map((x) => `<div><span>${esc(x.label)}</span><i class="${x.cls || ""}" style="width:${Math.max(1, (x.v / max) * 100).toFixed(1)}%"></i><small>${esc(x.text)}</small></div>`).join("");
}
// navigator.storage.estimate() line, refreshed every few seconds
async function usageText() {
  if (!navigator.storage || !navigator.storage.estimate) return "此瀏覽器不提供 navigator.storage.estimate()";
  const { usage = 0, quota = 0 } = await navigator.storage.estimate();
  return `本網域儲存用量約 ${mb(usage)}／配額約 ${mb(quota)}（storage.estimate）`;
}
function usage(ctx, el) {
  const paint = async () => { const t = await usageText(); if (ctx.active) el.textContent = t; };
  paint();
  ctx.interval(paint, 3000);
  return paint;
}
// Every database this demo ever created (plus the name used by the previous version of this page)
async function clearDemoData() {
  const names = new Set(["atlas-dexie-demo"]);
  if (indexedDB.databases) for (const d of await indexedDB.databases()) if (d.name && d.name.startsWith(PREFIX)) names.add(d.name);
  for (const n of names) await Dexie.delete(n);
  return names.size;
}
const hl = (code) => esc(code).replace(/(&quot;.*?&quot;)/g, '<span class="s">$1</span>').replace(/\.(\w+)\(/g, '.<span class="k">$1</span>(');

Showcase.run({ scenes: [
  {
    id: "todo", title: "待辦清單",
    api: "Dexie.liveQuery(() => db.todos.where(…).toArray())",
    desc: "原本的離線待辦：清單和右側資料表都是 liveQuery，新增、勾選、刪除後畫面自動更新；資料存在 IndexedDB，重新整理後還在。",
    hint: "新增或勾選後按「重新整理頁面」，資料還在",
    async mount(ctx) {
      ctx.html(`<div class="dx-board">
        <section class="dx-panel">
          <header><h3>待辦清單</h3><span class="dx-chip" data-visits></span></header>
          <form class="dx-add"><input class="dx-field" name="t" placeholder="新增待辦，按 Enter" autocomplete="off" aria-label="待辦內容">
            <select class="dx-field" name="tag" aria-label="標籤"><option>工作</option><option>學習</option><option>生活</option></select><button class="btn primary">新增</button></form>
          <div class="dx-filters"><button type="button" data-f="all">全部</button><button type="button" data-f="open">未完成</button><button type="button" data-f="done">已完成</button>
            <input class="dx-field" data-q placeholder="標題開頭" aria-label="標題開頭搜尋"></div>
          <div class="dx-scroll"><div class="dx-list"></div></div>
          <pre class="dx-code dx-hide-narrow" data-code></pre>
        </section>
        <section class="dx-panel dx-side">
          <header><h3>IndexedDB：todos<small>liveQuery 自動更新</small></h3></header>
          <div class="dx-scroll" data-rows></div>
          <header class="dx-logh"><h3>操作紀錄</h3></header>
          <div class="dx-log"></div>
          <div class="dx-usage"></div>
        </section></div>`);
      const SCHEMA = { todos: "++id, title, done, tag, createdAt", meta: "key" };
      const SEED = [["整理 Q3 課程回饋", "工作", 1], ["讀完 IndexedDB 文件", "學習", 0], ["預約牙醫", "生活", 0], ["準備 Dexie 分享簡報", "學習", 0], ["回覆合作邀約信", "工作", 1]];
      const log = makeLog(ctx.$(".dx-log"));
      const paintUsage = usage(ctx, ctx.$(".dx-usage"));
      const list = ctx.$(".dx-list"), q = ctx.$("[data-q]");
      let db, listSub, rowSub, filter = "all", prevIds = new Set();
      ctx.onCleanup(() => { listSub?.unsubscribe(); rowSub?.unsubscribe(); db?.close(); });

      function spec() {
        const s = q.value.trim(), done = filter === "open" ? 0 : filter === "done" ? 1 : null;
        if (s) return {
          code: `db.todos.where("title").startsWithIgnoreCase("${s}")${done === null ? "" : `\n  .filter(t => t.done === ${done})`}.toArray()`,
          run: () => { let c = db.todos.where("title").startsWithIgnoreCase(s); if (done !== null) c = c.filter((t) => t.done === done); return c.toArray(); },
        };
        if (done === null) return { code: 'db.todos.orderBy("createdAt").reverse().toArray()', run: () => db.todos.orderBy("createdAt").reverse().toArray() };
        return { code: `db.todos.where("done").equals(${done})\n  .reverse().sortBy("createdAt")`, run: () => db.todos.where("done").equals(done).reverse().sortBy("createdAt") };
      }
      function subscribeList() {
        listSub?.unsubscribe();
        const sp = spec();
        ctx.$("[data-code]").innerHTML = `<span class="c">// 目前清單用的查詢</span>\n${hl(sp.code)}`;
        ctx.$$(".dx-filters button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.f === filter)));
        listSub = Dexie.liveQuery(sp.run).subscribe({
          next: (items) => {
            list.innerHTML = items.length ? items.map((t) => `<div class="dx-item${t.done ? " done" : ""}" data-id="${t.id}"><input type="checkbox" ${t.done ? "checked" : ""} aria-label="完成">
              <span class="t">${esc(t.title)}</span><span class="dx-tag ${esc(t.tag)}">${esc(t.tag)}</span><button class="dx-del" type="button" aria-label="刪除">×</button></div>`).join("") : '<div class="dx-empty">沒有符合的項目</div>';
          },
          error: (e) => { list.innerHTML = `<div class="dx-empty">查詢失敗：${esc(e.message)}</div>`; },
        });
      }
      function subscribeRows() {
        rowSub?.unsubscribe();
        rowSub = Dexie.liveQuery(() => db.todos.toArray()).subscribe({
          next: (rows) => {
            const fresh = new Set(rows.filter((r) => prevIds.size && !prevIds.has(r.id)).map((r) => r.id));
            prevIds = new Set(rows.map((r) => r.id));
            ctx.$("[data-rows]").innerHTML = tableHtml(rows, [["id", "id", "n"], ["title", "title"], ["done", "done", "n"], ["tag", "tag"], ["createdAt", "createdAt", "d"]], { flash: (r) => fresh.has(r.id) });
            paintUsage();
          },
        });
      }
      async function start() {
        db = new Dexie(PREFIX + "todo");
        db.version(1).stores(SCHEMA);
        db.on("populate", (tx) => {
          const now = Date.now();
          tx.table("todos").bulkAdd(SEED.map(([title, tag, done], i) => ({ title, tag, done, createdAt: now - (SEED.length - i) * 3600e3 })));
          log("populate：第一次建立資料庫，寫入 5 筆示意資料", { cls: "info" });
        });
        const visits = ((await db.meta.get("visits"))?.value || 0) + 1;
        await db.meta.put({ key: "visits", value: visits });
        ctx.$("[data-visits]").innerHTML = `本頁第 <b>${visits}</b> 次載入`;
        log(`開啟 ${db.name}，目前 ${await db.todos.count()} 筆`);
        subscribeList();
        subscribeRows();
      }
      const op = async (label, fn) => { const t0 = performance.now(); const r = await fn(); log(typeof label === "function" ? label(r) : label, { t: since(t0), cls: "ok" }); };
      ctx.on(ctx.$(".dx-add"), "submit", async (e) => {
        e.preventDefault();

          <div class="dx-row"><button class="btn" type="button" data-op="loop">逐筆 add</button><button class="btn primary" type="button" data-op="bulkAdd">bulkAdd</button>
            <button class="btn" type="button" data-op="bulkPut">bulkPut 改年齡</button><button class="btn" type="button" data-op="bulkDelete">bulkDelete</button></div>
          <div class="dx-bars" data-bars><div class="dx-empty">按上方按鈕開始，結果會列在這裡</div></div>
          <pre class="dx-code dx-hide-narrow" data-mw></pre><div class="dx-usage"></div></section>
        <section class="dx-panel"><header><h3>最新 8 筆<small>savedAt 由中介層寫入</small></h3></header><div class="dx-scroll" data-rows></div><div class="dx-log dx-hide-narrow" style="flex:none;max-height:90px"></div></section></div>`);
      const calls = { mutate: 0, rows: 0, read: 0 };
      const db = await freshDb(ctx, "bulk", (d) => {
        d.version(1).stores({ people: "++id, city, age" });
        d.use({ stack: "dbcore", name: "atlasCounter", create: (down) => ({ ...down, table(n) {
          const t = down.table(n);
          return { ...t,
            mutate(req) { calls.mutate++; calls.rows += req.values ? req.values.length : req.keys ? req.keys.length : 0; return t.mutate(req); },
            query(req) { calls.read++; return t.query(req); },
            getMany(req) { calls.read++; return t.getMany(req); } };
        } }) });
        d.use({ stack: "dbcore", name: "atlasStamp", create: (down) => ({ ...down, table(n) {
          const t = down.table(n);
          return { ...t, mutate(req) {
            if (req.type === "add" || req.type === "put") req = { ...req, values: req.values.map((v) => ({ ...v, savedAt: new Date().toLocaleTimeString("zh-TW", { hour12: false }) })) };
            return t.mutate(req);
          } };
        } }) });
      });
      ctx.$("[data-mw]").innerHTML = hl('db.use({ stack: "dbcore", name: "atlasCounter",\n  create: down => ({ ...down, table(n) {\n    const t = down.table(n);\n    return { ...t, mutate(req) {\n      calls.mutate++;  // add/put/delete 都經過這裡\n      return t.mutate(req);\n    } };\n  } })\n});');
      const log = makeLog(ctx.$(".dx-log"), 8);
      const paintUsage = usage(ctx, ctx.$(".dx-usage"));
      let N = 1000;
      const results = [];
      live(ctx, () => Promise.all([db.people.count(), db.people.orderBy("id").reverse().limit(8).toArray()]), ([n, rows]) => {
        ctx.$("[data-count]").innerHTML = `資料表 <b>${fmt(n)}</b> 筆`;
        ctx.$("[data-rows]").innerHTML = tableHtml(rows, [["id", "id", "n"], ["name", "姓名"], ["city", "縣市"], ["age", "年齡", "n"], ["savedAt", "savedAt"]]);
      });
      const OPS = {
        loop: ["逐筆 await add", async (items) => { for (const p of items) await db.people.add(p); }],
        bulkAdd: ["bulkAdd(items)", (items) => db.people.bulkAdd(items)],
        bulkPut: ["bulkPut 改年齡", async () => { const all = await db.people.orderBy("id").limit(N).toArray(); await db.people.bulkPut(all.map((p) => ({ ...p, age: p.age + 1 }))); }],
        bulkDelete: ["bulkDelete(keys)", async () => { const keys = await db.people.orderBy("id").limit(N).primaryKeys(); await db.people.bulkDelete(keys); }],
      };
      let busy = false;
      ctx.on(ctx.$(".dx-row"), "click", async (e) => {
        const b = e.target.closest("[data-op]");
        if (!b || busy) return;
        busy = true;
        const [label, fn] = OPS[b.dataset.op];
        const items = people(N, Date.now() % 1000);
        const c0 = { ...calls };
        const t0 = performance.now();
        try { await fn(items); } catch (err) { log(err.message, { cls: "err" }); }
        const t = since(t0);
        const m = calls.mutate - c0.mutate;
        results.push({ label: `${label}`, v: t, text: `${fmtMs(t)}・mutate ${fmt(m)}`, cls: m > 1 ? "hot" : "ok" });
        if (results.length > 6) results.shift();
        bars(ctx.$("[data-bars]"), results);
        log(`${label}：${fmt(N)} 筆，DBCore mutate 呼叫 ${fmt(m)} 次、影響 ${fmt(calls.rows - c0.rows)} 列`, { t, cls: "ok" });
        paintUsage();
        busy = false;
      });
      ctx.select("筆數", [500, 1000, 2000, 5000].map((n) => ({ value: n, label: fmt(n) })), N, (v) => (N = +v));
    },
  },
  {
    id: "paging", title: "鏈式分頁",
    api: "orderBy(i).reverse().filter(fn).offset(n).limit(20)",
    desc: "Collection 可以一路串接：沿索引排序、反向、JS 篩選、offset／limit 分頁；指定分類時改用複合索引 [category+price] 保持排序。modify() 一次改寫整個查詢範圍。",
    hint: "切換分類、排序與「只看有庫存」，翻頁看產生的查詢",
    async mount(ctx) {
      ctx.html(`<div class="dx-board wide-left">
        <section class="dx-panel"><header><h3>商品列表<small>示意資料</small></h3><span class="dx-chip" data-stat>…</span></header>
          <div class="dx-scroll" data-rows></div>
          <div class="dx-pager"><button class="btn" type="button" data-p="-1">上一頁</button><span data-page></span><button class="btn" type="button" data-p="1">下一頁</button>
            <button class="btn" type="button" data-raise style="margin-left:auto">此範圍漲價 5%</button></div></section>
        <section class="dx-panel"><header><h3>產生的查詢</h3></header><pre class="dx-code" data-code></pre><div class="dx-log"></div></section></div>`);
      const CATS = ["筆電", "手機", "耳機", "螢幕", "鍵盤"];
      const BRANDS = ["曜石", "青松", "北辰", "藍鯨", "光點"];
      const BASE = { 筆電: 32000, 手機: 18000, 耳機: 3500, 螢幕: 7000, 鍵盤: 2200 };
      const db = await freshDb(ctx, "paging", (d) => d.version(1).stores({ products: "++id, category, price, date, [category+price]" }));
      const r = rng(21);
      await db.products.bulkAdd(Array.from({ length: 600 }, (_, i) => {
        const category = CATS[i % 5];
        return { name: `${BRANDS[Math.floor(r() * 5)]} ${category} ${String.fromCharCode(65 + Math.floor(r() * 26))}${Math.floor(r() * 90 + 10)}`,
          category, price: Math.round((BASE[category] * (0.5 + r() * 1.2)) / 10) * 10, stock: r() < 0.25 ? 0 : Math.floor(r() * 80), date: Date.UTC(2025, 0, 1) + Math.floor(r() * 640) * 864e5 };
      }));
      const log = makeLog(ctx.$(".dx-log"), 10);
      const PER = 20;
      let cat = "全部", sort = 0, inStock = false, page = 0;
      // Returns { coll, code, sortBy } describing the current query
      function build() {
        const field = sort === 2 ? "date" : "price", desc = sort !== 0;
        let coll, code, sortBy = null;
        if (cat === "全部") { coll = db.products.orderBy(field); code = `db.products.orderBy("${field}")`; }
        else if (field === "price") { coll = db.products.where("[category+price]").between([cat, Dexie.minKey], [cat, Dexie.maxKey]); code = `db.products.where("[category+price]")\n  .between(["${cat}", Dexie.minKey], ["${cat}", Dexie.maxKey])`; }
        else { coll = db.products.where("category").equals(cat); code = `db.products.where("category").equals("${cat}")`; sortBy = field; }
        if (desc) { coll = coll.reverse(); code += ".reverse()"; }
        if (inStock) { coll = coll.filter((p) => p.stock > 0); code += "\n  .filter(p => p.stock > 0)"; }
        return { coll, code, sortBy };
      }
      async function render() {
        const { coll, code, sortBy } = build();
        const t0 = performance.now();
        const total = await coll.clone().count();
        page = Math.max(0, Math.min(page, Math.ceil(total / PER) - 1));
        let rows, full;
        if (sortBy) { rows = (await coll.clone().sortBy(sortBy)).slice(page * PER, page * PER + PER); full = `${code}\n  .sortBy("${sortBy}")  // 先全部讀進記憶體排序\n  → .slice(${page * PER}, ${page * PER + PER})`; }
        else { rows = await coll.clone().offset(page * PER).limit(PER).toArray(); full = `${code}\n  .offset(${page * PER}).limit(${PER}).toArray()`; }
        const t = since(t0);
        ctx.$("[data-code]").innerHTML = `${hl(full)}\n<span class="c">// count() + 取一頁：${fmtMs(t)}</span>`;
        ctx.$("[data-stat]").innerHTML = `<b>${fmt(total)}</b> 件`;
        ctx.$("[data-page]").textContent = `第 ${page + 1}／${Math.max(1, Math.ceil(total / PER))} 頁`;
        ctx.$("[data-rows]").innerHTML = tableHtml(rows, [["id", "id", "n"], ["name", "品名"], ["category", "分類"], ["price", "價格", "n"], ["stock", "庫存", "n"], ["date", "上架", "d"]]);
      }
      ctx.on(ctx.$(".dx-pager"), "click", async (e) => {
        const b = e.target.closest("[data-p]");
        if (b) { page += +b.dataset.p; render(); return; }
        if (e.target.closest("[data-raise]")) {
          const t0 = performance.now();
          const n = await build().coll.modify((p) => { p.price = Math.round((p.price * 1.05) / 10) * 10; });
          log(`modify()：${cat} ${inStock ? "有庫存" : ""}共 ${fmt(n)} 件漲價 5%`, { t: since(t0), cls: "ok" });
          render();
        }
      });
      ctx.select("", ["全部", ...CATS], cat, (v) => { cat = v; page = 0; render(); });
      ctx.select("", [{ value: 0, label: "價格低到高" }, { value: 1, label: "價格高到低" }, { value: 2, label: "最新上架" }], 0, (v) => { sort = +v; page = 0; render(); });
      ctx.toggle("只看有庫存", false, (v) => { inStock = v; page = 0; render(); });
      await render();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: 'bulkAdd(rows) + where("age").between() + where("[city+age]")',
    desc: "逐級加大筆數：清空資料表、bulkAdd 寫入，接著跑兩個索引查詢，量寫入與查詢吞吐。測完自動清空；上限 20 萬筆，約佔數十 MB。",
    hint: "按「開始測試」；切換索引數量後再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="dx-stress"><section class="dx-panel"><header><h3>每級結果<small>寫入與查詢分開計時</small></h3></header>
        <div class="dx-scroll" data-rows><div class="dx-empty">尚未開始</div></div><div class="dx-usage"></div></section></div>`);
      ctx.controls.classList.add("bottom");
      const NAME = PREFIX + "stress";
      let rich = true, db = null, pending = Promise.resolve();
      const results = [];
      const paintUsage = usage(ctx, ctx.$(".dx-usage"));
      async function ensure() {
        if (db) return db;
        await Dexie.delete(NAME);
        db = new Dexie(NAME);
        db.version(1).stores({ people: rich ? "++id, name, city, age, joined, *tags, [city+age]" : "++id, age" });
        await db.open();
        return db;
      }
      ctx.onCleanup(() => { db?.close(); Dexie.delete(NAME).catch((e) => console.warn(e)); });
      const paint = () => {
        ctx.$("[data-rows]").innerHTML = tableHtml(results, [["n", "筆數", "n"], ["idx", "索引"], ["w", "寫入"], ["wr", "寫入 筆/秒"], ["q", "兩個查詢"], ["peak", "峰值用量"]]);
      };
      ctx.group(["7 個索引", "只有 age"], 0, async (i) => {
        rich = i === 0;
        await pending;
        db?.close();
        db = null;
      });
      ctx.button("清除示範資料", async () => { await pending; db?.close(); db = null; await clearDemoData(); results.length = 0; paint(); paintUsage(); });
      ctx.bench({
        label: "筆數", unit: "筆", sizes: [1000, 5000, 10000, 25000, 50000, 100000, 200000], budget: 6000, target: 1500,
        async prepare(n) { await pending; await ensure(); return people(n, n); },
        async run(n, rows) {
          const t0 = performance.now();
          await db.people.bulkAdd(rows);
          const w = since(t0);
          const t1 = performance.now();
          const a = await db.people.where("age").between(30, 40, true, true).count();
          const b = rich ? (await db.people.where("[city+age]").between(["臺中市", 20], ["臺中市", 29], true, true).toArray()).length : (await db.people.where("age").equals(25).toArray()).length;
          const q = since(t1);
          const row = { n, idx: rich ? "7 個" : "1 個", w: fmtMs(w), wr: fmtCompact(n / (w / 1000)), q: fmtMs(q), peak: "…" };
          results.push(row);
          paint();
          // Measure peak usage and clear the table after the timed part, before the next step starts
          pending = (async () => {
            if (navigator.storage?.estimate) row.peak = mb((await navigator.storage.estimate()).usage || 0);
            await db.people.clear();
            if (ctx.active) { paint(); paintUsage(); }
          })();
          return `寫 ${fmtMs(w)}・查 ${fmtMs(q)}（${fmt(a + b)} 筆）`;
        },
        note: "計時包含 bulkAdd 寫入（含維護索引）與兩個索引查詢。索引越多寫入越慢；multiEntry *tags 每筆會產生多個索引鍵。實際速度受磁碟、瀏覽器與 IndexedDB 後端影響，同一台機器第二次跑通常比較快。",
      });
    },
  },
] });
</script>
