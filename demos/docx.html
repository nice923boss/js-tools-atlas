// ---------- number formats used by numbering.xml and pgNumType ----------
const CN = "〇一二三四五六七八九";

    case "upperLetter": return String.fromCharCode(65 + (v - 1) % 26).repeat(Math.ceil(v / 26));

      <div class="dx-pg" data-h="${s.h}" style="width:${P(s.w)};min-height:${P(s.h)};padding:${P(m.top)} ${P(m.right)} ${P(m.bottom)} ${P(m.left)}">
      <div class="dx-hd" style="top:${P(m.header)};left:${P(m.left)};right:${P(m.right)}">${hf(pg, "header")}</div>

// ---------- shared scene shell: build -> Packer.toBlob -> read back -> paint ----------
function docView(ctx, { sideTitle, build, side }) {
  ctx.html(`<div class="dx-wrap"><div class="dx-split">
    <div class="dx-view"><div class="dx-cap"><b>讀回預覽</b><span class="dx-mut">依 XML 近似繪製，非 Word 畫面，不自動分頁</span><span class="dx-meta">產生中…</span></div>
      <div class="dx-scroll"><div class="dx-pages"></div></div></div>
    <div class="dx-side"><div class="dx-cap"><b>${sideTitle}</b><span class="dx-sub"></span></div><div class="dx-sb"></div></div>
  </div></div>`);
  const scroll = ctx.$(".dx-scroll"), pagesEl = ctx.$(".dx-pages");
  const st = { gen: 0, d: null, body: ctx.$(".dx-sb"), sub: ctx.$(".dx-sub") };
  ctx.on(pagesEl, "click", (e) => {
    const a = e.target.closest("a[data-go]");
    if (!a) return;
    e.preventDefault();
    pagesEl.querySelector(`[data-bm="${CSS.escape(a.dataset.go)}"]`)?.scrollIntoView({ block: "center", behavior: "smooth" });
  });
  st.refresh = async () => {
    const my = ++st.gen;
    try {
      const t0 = performance.now(), blob = await D.Packer.toBlob(build()), ms = performance.now() - t0;
      const d = await readDocx(blob);
      if (my !== st.gen || !ctx.active) return d.dispose();
      st.d?.dispose();
      st.d = d;
      const top = scroll.scrollTop, info = renderDoc(d, pagesEl);
      scroll.scrollTop = top;
      ctx.$(".dx-meta").innerHTML = `<span class="dx-n">${info.pages}</span> 頁・<span class="dx-n">${bytesText(blob.size)}</span>・toBlob <span class="dx-n">${fmtMs(ms)}</span>`;
      if (side) await side(d, info);
    } catch (err) {
      console.error(err);
      ctx.$(".dx-meta").textContent = "產生失敗：" + err.message;
    }
  };
  ctx.onCleanup(() => st.d?.dispose());
  return st;
}
const download = (ctx, build, name) => ctx.button("下載 .docx", async () => {

    const a = document.createElement("a");

// ---------- canvas artwork for the image scene ----------
function drawArt(seed, w = 480, h = 270) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d"), hue = (seed * 67) % 360;
  let s = seed * 7919 + 13;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const bg = g.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, `hsl(${hue},60%,96%)`); bg.addColorStop(1, `hsl(${hue + 40},55%,84%)`);
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = `hsl(${hue},45%,25%)`; g.font = "bold 22px 'Microsoft JhengHei', sans-serif"; g.fillText(`各月份報名人數（第 ${seed} 版）`, 20, 36);
  const bw = (w - 60) / 7;
  for (let i = 0; i < 7; i++) {
    const bh = (0.25 + rnd() * 0.65) * (h - 90);
    g.fillStyle = `hsl(${hue + i * 12},55%,${42 + i * 3}%)`; g.fillRect(30 + i * bw + 6, h - 30 - bh, bw - 12, bh);
    g.fillStyle = "#333"; g.font = "13px sans-serif"; g.fillText(`${i + 4}月`, 30 + i * bw + bw / 2 - 12, h - 10);
  }
  return c;
}
