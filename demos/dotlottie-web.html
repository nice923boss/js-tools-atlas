<style>
  .board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .lot { position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: radial-gradient(circle at 50% 45%, #1d2230, #12151b 72%); }
  .lot canvas { display: block; width: 100%; height: 100%; }
  .side { display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
  .grp label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .row { display: flex; gap: 6px; }
  .row .btn { flex: 1; min-width: 0; padding: 7px 4px; display: flex; gap: 6px; align-items: center; justify-content: center; }
  .readout { font: 12px/1.6 var(--font); color: var(--muted); }
  .readout b { font: 600 12px var(--mono); color: var(--fg); }
  .readout b.ok { color: var(--c4); }

  /* scene 1: weather pack */
  .wx { --glow: rgba(143, 211, 255, .14); background: radial-gradient(55% 65% at 36% 48%, var(--glow), transparent 70%); }
  .wx[data-theme="night"] { --glow: rgba(111, 126, 220, .2); }
  .wx[data-theme="candy"] { --glow: rgba(255, 140, 190, .18); }
  .s1 { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; height: 100%; }
  .s1 .lot { border: 0; background: none; }
  .prog { position: absolute; left: 14%; right: 14%; bottom: 2%; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .prog i { display: block; height: 100%; width: 0; background: var(--fg); opacity: .6; }
  .sw { display: inline-flex; }
  .sw i { width: 9px; height: 9px; border-radius: 50%; margin-left: -3px; border: 1px solid rgba(0, 0, 0, .35); }
  .tree { font: 12px/1.7 var(--mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); }
  .tree div { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree b { color: var(--fg); }
  .tree span { padding: 0 4px; border-radius: 4px; transition: background .3s, color .3s; }
  .tree span.on { background: var(--accent); color: var(--accent-ink); }

  /* scene 2: markers and segments */
  .s2 { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; height: 100%; }
  .tl { padding: 0 6px; }
  .bands { position: relative; height: 22px; }
  .bands button { position: absolute; top: 0; height: 20px; border: 0; border-radius: 5px; padding: 0; cursor: pointer; font: 600 11.5px/20px var(--mono); color: #0e1013; opacity: .5; overflow: hidden; white-space: nowrap; }
  .bands button.on { opacity: 1; box-shadow: 0 0 0 2px var(--fg); }
  .track { position: relative; height: 14px; margin-top: 5px; border-radius: 4px; background: rgba(127, 127, 127, .15); }
  .seg { position: absolute; top: 0; bottom: 0; border: 2px solid var(--fg); border-radius: 4px; background: rgba(255, 255, 255, .08); }
  .ph { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--c1); }
  .ticks { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); margin-top: 3px; }
  .s2 .readout { text-align: center; }

  /* scene 3: playback modes */
  .s3 { display: grid; grid-template: repeat(2, minmax(0, 1fr)) / repeat(2, minmax(0, 1fr)); gap: 10px; height: 100%; }
  .mcard { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 5px; min-width: 0; min-height: 0; }
  .mcard h3 { margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcard h3 small { color: var(--muted); font: 400 12px var(--mono); margin-left: 6px; }

  /* scene 4: themes and slots */
  .s4 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; height: 100%; }
  .sp { gap: 8px; }
  .sp .grp { display: flex; align-items: center; gap: 8px; }
  .sp .grp label, .rng span { width: 44px; margin: 0; flex: none; font-size: 12px; color: var(--muted); }
  .swb { flex: 1; min-width: 0; height: 28px; padding: 0 !important; }
  .swb::before { content: ""; display: block; width: 14px; height: 14px; border-radius: 50%; background: var(--sw); border: 1px solid rgba(127, 127, 127, .6); }
  .swb.gb::before { width: 70%; border-radius: 4px; }
  .sp .grp .row { flex: 1; min-width: 0; }
  .sp [data-k="anim"] { flex: none; padding: 0 8px !important; }
  .rng { display: flex; align-items: center; gap: 8px; }
  .rng input { flex: 1; min-width: 0; }
  .rng output { width: 3.2em; text-align: right; font: 12px var(--mono); color: var(--muted); }
  .slots { width: 100%; border-collapse: collapse; font: 11.5px/1.5 var(--mono); color: var(--muted); table-layout: fixed; }
  .slots th { font: 600 11px var(--font); text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); }
  .slots td { padding: 2px 4px; border-bottom: 1px dashed var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slots td:last-child { color: var(--fg); }
  .slots th:nth-child(1) { width: 26%; } .slots th:nth-child(2) { width: 24%; }
  .slots i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }

  /* scene 5: state machine */
  .s5 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 12px; height: 100%; }
  .s5 .lot { cursor: pointer; }
  .smp { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); }
  .smd { display: block; width: 100%; height: auto; max-height: 170px; flex: none; }
  .smd .ed { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  .smd marker path { fill: var(--muted); }
  .smd .lb { font: 10.5px var(--font); fill: var(--muted); }
  .smd .nd rect { fill: rgba(127, 127, 127, .08); stroke: var(--line); stroke-width: 1.5; transition: fill .25s, stroke .25s; }
  .smd .nd text { text-anchor: middle; }
  .smd .nd .id { font: 600 12px var(--mono); fill: var(--fg); }
  .smd .nd .zh { font: 10.5px var(--font); fill: var(--muted); }
  .smd .nd.on rect { stroke: var(--k); fill: var(--k); fill-opacity: .2; stroke-width: 2.5; }
  .log { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; font: 11.5px/1.5 var(--font); }
  .log li { display: grid; grid-template-columns: 4.6em 5.4em minmax(0, 1fr); gap: 6px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .log .t, .log .d { font-family: var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* scene 6: layout */
  .s6 { display: grid; grid-template-columns: minmax(0, 1fr) 210px; gap: 14px; height: 100%; }
  .lw { container-type: size; display: grid; place-items: center; min-width: 0; min-height: 0; }
  .fr { --ar: 2; width: min(100cqw, calc(100cqh * var(--ar))); aspect-ratio: var(--ar); outline: 1px dashed var(--muted); background: repeating-conic-gradient(#2a2f3a 0 25%, #1c2029 0 50%) 0 0 / 18px 18px; }
  .fr canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 132px; }
  .pad .btn { padding: 6px 0; }

  /* scene 7: stress view */
  .sview { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: radial-gradient(60% 60% at 50% 50%, rgba(76, 201, 240, .08), transparent 70%); }
  .sgrid { position: absolute; inset: 8px; display: grid; justify-content: center; align-content: center; }
  .sgrid canvas { display: block; width: 100%; height: 100%; }
  @media (max-width: 760px) { .sview { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); } }

  @media (max-width: 620px) {
    .row .btn { font-size: 12px; padding: 6px 2px; gap: 4px; }
    .s1 { grid-template-columns: minmax(0, 1fr) 220px; gap: 10px; }
    .tree { display: none; }
    .mcard h3 small { display: none; }
    .s4 { grid-template-columns: minmax(0, 1fr) 250px; gap: 10px; }
    .sp { gap: 5px; }
    .swb { height: 24px; }
    .s5 { grid-template-columns: minmax(0, 1fr) 270px; gap: 8px; }
    .smp { padding: 8px; gap: 6px; }
    .s6 { grid-template-columns: minmax(0, 1fr) 150px; gap: 10px; }
    .pad { width: 108px; }
  }
  @media (max-width: 620px) and (orientation: portrait) {
    .s1, .s4, .s6 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .s1 .side { gap: 6px; }
    .s1 .grp { display: flex; align-items: center; gap: 8px; }
    .s1 .grp label { margin: 0; width: 30px; flex: none; }
    .s1 .grp .row { flex: 1; }
    .s1 .readout { display: none; }
    .slots { font-size: 10.5px; }
    .s5 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1.25fr); }
    .smd { max-height: 120px; }
    .s6 .side { flex-direction: row; align-items: center; gap: 12px; }
  }
</style>

<script type="module">
import { DotLottie, DotLottieWorker } from "https://cdn.jsdelivr.net/npm/@lottiefiles/dotlottie-web@0.80.0/dist/index.js";

// dotlottie-web showcase: the original .lottie weather pack plus markers, playback modes, slots and
// themes, a packaged state machine, layout and resolution, and an instance-count stress ramp.
const WEATHER = "assets/dotlottie-web/weather.lottie";
const STATUS = "assets/dotlottie-web/status.lottie";
let statusBuf = null;
// One download feeds every player: DotLottie copies the bytes, so the ArrayBuffer stays reusable.
const statusBytes = () => (statusBuf ??= fetch(STATUS).then((r) => {
  if (!r.ok) throw new Error(`讀取 ${STATUS} 失敗（HTTP ${r.status}）`);
  return r.arrayBuffer();
}));
const MARK = { loading: "var(--c2)", success: "var(--c4)", error: "var(--c3)", idle: "var(--muted)" };
const STATE_NAME = { idle: "待命", loading: "載入中", success: "成功", error: "失敗" };
const press = (btns, on) => btns.forEach((b) => b.setAttribute("aria-pressed", String(on(b))));
const r1 = (v) => (Math.round(v * 10) / 10).toFixed(1);
const hex = (c) => "#" + c.slice(0, 3).map((v) => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, "0")).join("");
const rgb = (h) => [1, 3, 5].map((i) => +(parseInt(h.slice(i, i + 2), 16) / 255).toFixed(3));

// Track every player a scene creates so unmount destroys all of them (Worker destroy is async).
function players(ctx) {
  const set = new Set();
  const kill = (p) => Promise.resolve(p.destroy()).catch((e) => console.warn("destroy 失敗", e));
  ctx.onCleanup(() => { set.forEach(kill); set.clear(); });
  return {
    make(cfg, Kind = DotLottie) {
      const p = new Kind({ ...cfg, renderConfig: { autoResize: true, ...cfg.renderConfig } });
      set.add(p);
      return p;
    },
    drop(p) { if (set.delete(p)) kill(p); },
  };
}

// Wait for "load" behind a status card; loadError rejects so the showcase shows the failure.
function boot(ctx, p, text = "正在下載 WASM 渲染器…") {
  const card = ctx.status(text);
  return new Promise((resolve, reject) => {
    const off = () => { p.removeEventListener("load", ok); p.removeEventListener("loadError", bad); card.done(); };
    const ok = () => { off(); resolve(p); };
    const bad = (e) => { off(); reject(new Error(`載入失敗：${e.error?.message ?? e.error ?? "未知錯誤"}`)); };
    p.addEventListener("load", ok);
    p.addEventListener("loadError", bad);
    ctx.signal.addEventListener("abort", () => { off(); reject(new DOMException("場景已切換", "AbortError")); }, { once: true });
  });
}

function onBox(ctx, el, fn) {
  let raf = 0;
  const ro = new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => ctx.active && fn()); });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}

// ---------- minimal Lottie JSON builder for the generated scenes ----------
const LIN = [0, 0, 1, 1], EASE = [0.42, 0, 0.58, 1];
const st = (k, sid) => (sid ? { a: 0, k, sid } : { a: 0, k });
const prop = (v) => (v && typeof v === "object" && "a" in v ? v : st(v));
// keys: [frame, value]; ThorVG reads one easing curve per key.
const kf = (keys, e = EASE) => ({
  a: 1,
  k: keys.map(([t, s], i) => (i === keys.length - 1 ? { t, s: [].concat(s) }
    : { t, s: [].concat(s), o: { x: [e[0]], y: [e[1]] }, i: { x: [e[2]], y: [e[3]] } })),
});
const tr = (o = {}) => ({ ty: "tr", p: st([0, 0]), a: st([0, 0]), s: prop(o.s ?? [100, 100]), r: st(0), o: prop(o.o ?? 100), sk: st(0), sa: st(0) });
const group = (nm, items, t) => ({ ty: "gr", nm, it: [...items, tr(t)] });
const ell = (d, p = [0, 0]) => ({ ty: "el", d: 1, s: st([d, d]), p: st(p) });
const line = (a, b) => ({ ty: "sh", ks: st({ c: false, v: [a, b], i: [[0, 0], [0, 0]], o: [[0, 0], [0, 0]] }) });
const fill = (c) => ({ ty: "fl", c: prop(c), o: st(100), r: 1 });
const stroke = (c, w, op = 100) => ({ ty: "st", c: prop(c), o: st(op), w: st(w), lc: 2, lj: 2, ml: 4 });
const trim = (s, e) => ({ ty: "tm", s: prop(s), e: prop(e), o: st(0), m: 1 });
const layer = (ind, nm, shapes, t, op) => ({
  ddd: 0, ind, ty: 4, nm, sr: 1, ao: 0, ip: 0, op, st: 0, bm: 0, shapes,
  ks: { o: st(100), r: prop(t.r ?? 0), p: prop(t.p ?? [0, 0, 0]), a: st([0, 0, 0]), s: st([100, 100, 100]) },
});
const comp = (w, h, fr, op, layers, extra = {}) => ({ v: "5.7.4", fr, ip: 0, op, w, h, nm: "generated", ddd: 0, assets: [], layers, ...extra });

// Scene 3: a ball, a progress bar and a cyan-to-pink fill make the playback direction obvious.
function modesData() {
  const op = 24, a = [40, 116], b = [260, 116];
  return comp(300, 150, 12, op, [
    layer(1, "ball", [group("b", [ell(36), fill(kf([[0, [0.298, 0.788, 0.941, 1]], [op, [0.969, 0.145, 0.522, 1]]], LIN))])],
      { p: kf([[0, [40, 60, 0]], [op, [260, 60, 0]]], LIN) }, op),
    layer(2, "bar", [group("g", [line(a, b), trim(0, kf([[0, 0], [op, 100]], LIN)), stroke([0.969, 0.875, 0.118, 1], 10)])], {}, op),
    layer(3, "track", [group("g", [line(a, b), stroke([1, 1, 1, 1], 10, 16)])], {}, op),
  ]);
}

// Scene 4: every themable property carries a sid and is declared in the top-level "slots" table.
const BADGE = { accent: "#4cc9f0", bg: "#171a23", grad: ["#ffde1f", "#ff8c42"] };
const grad2 = ([a, b]) => [0, ...rgb(a), 1, ...rgb(b)];
function badgeData() {
  const op = 90, accent = st([...rgb(BADGE.accent), 1], "accent");
  const starShape = { ty: "sr", sy: 1, d: 1, pt: st(5), p: st([0, 0]), r: st(0), ir: st(32), is: st(0), or: st(72), os: st(0) };
  const gfill = { ty: "gf", o: st(100), r: 1, t: 1, s: st([-72, -72]), e: st([72, 72]), g: { p: 2, k: st(grad2(BADGE.grad), "grad") } };
  return comp(300, 300, 30, op, [
    layer(1, "sparks", [group("s", [ell(16, [0, -124]), ell(16, [107, 62]), ell(16, [-107, 62]), fill(accent)])], { p: [150, 150, 0], r: kf([[0, 0], [op, 120]], LIN) }, op),
    layer(2, "star", [group("st", [starShape, gfill], { s: st([100, 100], "size"), o: st(100, "alpha") })], { p: [150, 150, 0], r: kf([[0, 0], [op, 72]]) }, op),
    layer(3, "ring", [group("r", [ell(200), trim(0, kf([[0, 22], [45, 82], [op, 22]])), stroke(accent, 12)])], { p: [150, 150, 0], r: kf([[0, 0], [op, 360]], LIN) }, op),
    layer(4, "bg", [group("b", [{ ty: "rc", d: 1, s: st([300, 300]), p: st([0, 0]), r: st(40) }, fill(st([...rgb(BADGE.bg), 1], "bg"))])], { p: [150, 150, 0] }, op),
  ], {
    slots: {
      accent: { p: st([...rgb(BADGE.accent), 1]) }, bg: { p: st([...rgb(BADGE.bg), 1]) },
      grad: { p: { p: 2, k: st(grad2(BADGE.grad)) } }, size: { p: st([100, 100]) }, alpha: { p: st(100) },
    },
  });
}

Showcase.run({ scenes: [
  {
    id: "weather", title: "天氣組",
    api: "new DotLottie({ src, themeId }) / loadAnimation(id) / setTheme(id)",
    desc: "一個 4.5 KB 的 .lottie（其實是 zip）裝了 3 段動畫與 3 套主題。播放器先下載 ThorVG 編成的 WASM 渲染器，再把向量逐格點陣化到 canvas。loadAnimation() 在同一個檔案裡切換動畫，setTheme() 套用 t/ 資料夾裡的主題，改寫各動畫共用的顏色 slot。",
    hint: "點動畫或主題按鈕・右側檔案樹會標出目前使用的檔案",
    async mount(ctx) {
      const ANIMS = [["sunny", "晴天"], ["rainy", "雨天"], ["snowy", "下雪"]];
      const THEMES = [["day", "白天", ["#8fd3ff", "#ffc93c", "#2f6fe4"]], ["night", "夜晚", ["#16204a", "#f4efc4", "#9fd0ff"]], ["candy", "糖果", ["#ffc2dc", "#ff6f3c", "#f72585"]]];
      ctx.html(`<div class="board wx" data-theme="day"><div class="s1">
        <div class="lot"><canvas></canvas><div class="prog"><i></i></div></div>
        <aside class="side">
          <div class="grp"><label>動畫</label><div class="row">${ANIMS.map(([id, n]) => `<button class="btn" data-a="${id}">${n}</button>`).join("")}</div></div>
          <div class="grp"><label>主題</label><div class="row">${THEMES.map(([id, n, sw]) => `<button class="btn" data-t="${id}"><span class="sw">${sw.map((c) => `<i style="background:${c}"></i>`).join("")}</span>${n}</button>`).join("")}</div></div>
          <div class="tree"></div>
          <div class="readout"></div>
        </aside></div></div>`);
      const board = ctx.$(".wx"), prog = ctx.$(".prog i"), tree = ctx.$(".tree"), info = ctx.$(".readout");
      const aBtns = ctx.$$("[data-a]"), tBtns = ctx.$$("[data-t]");
      let animId = "sunny", themeId = "day", auto = true, step = 0;
      const dl = players(ctx).make({ canvas: ctx.$("canvas"), src: WEATHER, autoplay: true, loop: true, themeId });
      const mark = () => {
        press(aBtns, (b) => b.dataset.a === animId);
        press(tBtns, (b) => b.dataset.t === themeId);
        ctx.$$("[data-f]").forEach((s) => s.classList.toggle("on", s.dataset.f === animId || s.dataset.f === themeId));
        board.dataset.theme = themeId;
      };
      const setAnim = (id) => { animId = id; mark(); dl.loadAnimation(id); };
      const setTheme = (id) => { themeId = id; mark(); dl.setTheme(id); };
      const autoBtn = ctx.toggle("自動輪播", true, (v) => { auto = v; });
      const setAuto = (v) => { auto = v; autoBtn.setAttribute("aria-pressed", String(v)); };
      ctx.button("重播", () => { step = 0; themeId = "day"; setAnim("sunny"); setAuto(true); }, { primary: true });
      aBtns.forEach((b) => ctx.on(b, "click", () => { setAuto(false); setAnim(b.dataset.a); }));
      tBtns.forEach((b) => ctx.on(b, "click", () => { setAuto(false); setTheme(b.dataset.t); }));
      dl.addEventListener("frame", (e) => { prog.style.width = `${(e.currentFrame / Math.max(1, dl.totalFrames - 1)) * 100}%`; });
      // A newly loaded animation starts unthemed, so re-apply the current theme.
      dl.addEventListener("load", () => dl.setTheme(themeId));
      mark();
      await boot(ctx, dl);
      // The tree comes from the manifest inside the archive; the size comes from Resource Timing.
      const m = dl.manifest ?? {};
      const size = performance.getEntriesByType("resource").find((r) => r.name.endsWith("weather.lottie"))?.decodedBodySize;
      const files = (list = [], last) => list.map((x, i) => `<div>${last ? "  " : "│ "}${i === list.length - 1 ? "└" : "├"} <span data-f="${x.id}">${x.id}.json</span></div>`).join("");
      tree.innerHTML = `<div><b>weather.lottie</b> ${size ? `${(size / 1024).toFixed(1)} KB` : ""}</div><div>├ manifest.json</div>
        <div>├ a/</div>${files(m.animations)}<div>└ t/</div>${files(m.themes, true)}`;
      mark();
      const paint = () => {
        const { width, height } = dl.animationSize();

        let best = 0, cols = 1;
        for (let c = 1; c <= n; c++) {
          const s = Math.min(W / c, H / Math.ceil(n / c));
          if (s > best) { best = s; cols = c; }
        }
        size = Math.max(6, Math.floor(best));
        grid.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
        grid.style.gridAutoRows = `${size}px`;
      }
      function setCount(n) {
        while (cells.length < n) add();
        while (cells.length > n) remove();
        layout();
      }
      onBox(ctx, view, layout);
      ctx.interval(() => { rate = cells.length ? frames / cells.length : 0; frames = 0; }, 1000);
      ctx.ramp({
        label: "同時播放", unit: "個", steps: [4, 8, 16, 32, 64, 128, 256], minFps: 30,
        apply(n) { setCount(n); },
        metrics: () => ({
          播放器: worker ? "Worker" : "主執行緒",
          每實例更新率: `${rate.toFixed(0)} 次/秒`,
          格子邊長: `${size}px`,
        }),
        note: "每個實例都有自己的 ThorVG 播放器與像素緩衝，在 CPU 上做軟體點陣化，成本隨數量與畫布面積成長。主執行緒模式的繪製與 FPS 量測在同一條執行緒；Worker 模式把點陣化移走，FPS 會比較好看，所以要同時看「每實例更新率」是否還接近動畫的 60 fps。",
      });
    },
  },
] });
</script>
</body>
</html>
