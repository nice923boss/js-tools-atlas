<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawflow 示範：影像濾鏡流水線</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #df { position: fixed; inset: 0;
    background: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1.3px) 0 0 / 22px 22px, var(--bg); }
  .drawflow .drawflow-node { width: 172px; padding: 0; align-items: stretch; color: var(--fg);
    background: #1b1e25; border: 1px solid rgba(255,255,255,.13); border-radius: 12px;
    box-shadow: 0 10px 26px rgba(0,0,0,.38); transition: opacity .2s; }
  .drawflow .drawflow-node.selected { background: #1b1e25; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 10px 26px rgba(0,0,0,.4); }
  .drawflow .drawflow-node.out-node { width: 252px; }
  .drawflow .drawflow-node.idle { opacity: .55; }
  .drawflow .drawflow-node .inputs, .drawflow .drawflow-node .outputs { display: flex; flex-direction: column; justify-content: center; }
  .drawflow .drawflow-node .input, .drawflow .drawflow-node .output { width: 16px; height: 16px; margin: 0; top: 0;
    border: 3px solid #1b1e25; background: var(--c2); }
  .drawflow .drawflow-node .input { left: -9px; background: var(--c4); }
  .drawflow .drawflow-node .output { right: 7px; }
  .drawflow .drawflow-node .input:hover, .drawflow .drawflow-node .output:hover { background: var(--accent); }
  /* Portrait frames: ports on top and bottom so the pipeline reads downwards. */
  #df.vflow .drawflow-node { flex-direction: column; }
  #df.vflow .drawflow-node .inputs, #df.vflow .drawflow-node .outputs { width: auto; height: 0; flex-direction: row; justify-content: center; }
  #df.vflow .drawflow-node .input { left: 0; top: -9px; }
  #df.vflow .drawflow-node .output { right: 0; top: -7px; }
  .drawflow .connection .main-path { stroke: var(--c2); stroke-width: 3px; stroke-dasharray: 7 5; animation: flow .9s linear infinite; }
  .drawflow .connection .main-path:hover { stroke: var(--accent); }
  .drawflow .connection .main-path.selected { stroke: var(--c3); }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  .parent-node .drawflow-delete { width: 22px; height: 22px; line-height: 17px; right: -10px; top: -10px;
    background: var(--c3); border: 2px solid #1b1e25; font-size: 13px; }
  .drawflow > .drawflow-delete { width: 22px; height: 22px; line-height: 17px; margin-left: -11px; margin-top: 8px;
    background: var(--c3); border: 2px solid #1b1e25; font-size: 13px; }

  .nh { display: flex; align-items: center; gap: 7px; padding: 8px 12px 6px; font-weight: 700; font-size: 13px;
    border-bottom: 1px solid rgba(255,255,255,.07); }
  .nh i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .nh .val { margin-left: auto; font: 500 12px var(--mono); color: var(--muted); }
  .nh .tag { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--c3); display: none; }
  .idle .nh .tag { display: inline; }
  .idle .nh .val { display: none; }
  .nb { padding: 8px 12px 10px; display: grid; gap: 7px; }
  .nb input[type=range] { width: 100%; accent-color: var(--c); margin: 2px 0; cursor: pointer; }
  .nb canvas { display: block; width: 100%; border-radius: 7px; background: #000; }
  .nb select { width: 100%; font: 500 12px var(--font); color: var(--fg); background: #262a33; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 6px; cursor: pointer; }
  .chain { font-size: 11.5px; color: var(--muted); line-height: 1.45; min-height: 17px; }
  .chain b { color: var(--fg); font-weight: 500; }

  select.btn { padding-right: 10px; }
  select.btn option { background: #1b1e25; color: var(--fg); }
</style>
</head>
<body>
<div id="df"></div>
<div class="controls">
  <select class="btn" id="pick" aria-label="加入濾鏡節點">
    <option value="">＋ 加入濾鏡</option>
  </select>
  <button class="btn" id="reset">重設</button>
  <button class="btn" id="fit">置中</button>
</div>
<div class="hint">拉線接節點・拖滑桿即時重算・Delete 刪除</div>

<script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.js"></script>
<script>
// Each filter node maps to one CSS canvas filter; the output node composes the whole upstream chain.
const FX = {
  brightness: { title: "亮度", color: "#f7df1e", min: 40, max: 180, v: 125, unit: "%", css: (v) => `brightness(${v}%)` },
  hue: { title: "色相旋轉", color: "#f72585", min: 0, max: 360, v: 200, unit: "°", css: (v) => `hue-rotate(${v}deg)` },
  saturate: { title: "飽和度", color: "#ff8c42", min: 0, max: 300, v: 170, unit: "%", css: (v) => `saturate(${v}%)` },
  contrast: { title: "對比", color: "#4cc9f0", min: 40, max: 200, v: 140, unit: "%", css: (v) => `contrast(${v}%)` },
  blur: { title: "模糊", color: "#9d8cff", min: 0, max: 6, v: 2, unit: "px", css: (v) => `blur(${v}px)` },
  sepia: { title: "懷舊", color: "#d9a066", min: 0, max: 100, v: 85, unit: "%", css: (v) => `sepia(${v}%)` },
  gray: { title: "灰階", color: "#b8b8b8", min: 0, max: 100, v: 100, unit: "%", css: (v) => `grayscale(${v}%)` },
  invert: { title: "反相", color: "#7bd389", min: 0, max: 100, v: 100, unit: "%", css: (v) => `invert(${v}%)` },
};
const SCENES = { sunset: "黃昏海岸", mount: "星夜山脈", city: "城市夜景" };

// ---------- procedural source images (animated, so the pipeline is visibly live) ----------
function ridge(ctx, w, h, base, amp, seed, color) {
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 4) {
    const k = x / w;
    const y = base - amp * (0.55 * Math.sin(k * 5.1 + seed) + 0.3 * Math.sin(k * 11.7 + seed * 2.3) + 0.15 * Math.sin(k * 23 + seed * 4.1));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.fillStyle = color;
  ctx.fill();
}
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function drawScene(ctx, kind, t, w, h) {
  if (kind === "sunset") {
    const hz = h * 0.6;
    let g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, "#2b1b5a"); g.addColorStop(0.55, "#d9487a"); g.addColorStop(1, "#ffb259");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, hz);
    const sy = hz - h * 0.08 + Math.sin(t * 0.5) * 3;
    const sg = ctx.createRadialGradient(w * 0.5, sy, 0, w * 0.5, sy, w * 0.28);
    sg.addColorStop(0, "rgba(255,246,214,1)"); sg.addColorStop(0.18, "rgba(255,214,120,.95)"); sg.addColorStop(1, "rgba(255,150,90,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, w, hz);
    ridge(ctx, w, hz, hz, h * 0.06, 1.2, "#5a2a5e");
    g = ctx.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, "#e86f7c"); g.addColorStop(1, "#23184a");
    ctx.fillStyle = g; ctx.fillRect(0, hz, w, h - hz);
    for (let i = 0; i < 16; i++) {
      const y = hz + 3 + i * (h - hz) / 17;
      const len = w * 0.22 * (1 - i / 18) * (0.75 + 0.25 * Math.sin(t * 2.2 + i * 1.3));
      ctx.fillStyle = `rgba(255,224,160,${0.8 - i * 0.045})`;
      ctx.fillRect(w * 0.5 - len / 2 + Math.sin(t * 1.6 + i * 0.8) * 4, y, len, 2);
    }
  } else if (kind === "mount") {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#070b24"); g.addColorStop(0.6, "#1d2f6b"); g.addColorStop(1, "#3c5aa0");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const r = rand(7);
    for (let i = 0; i < 90; i++) {
      const x = r() * w, y = r() * h * 0.6, tw = 0.5 + 0.5 * Math.sin(t * 3 + i);
      ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.6 * tw * r()})`;
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    const mg = ctx.createRadialGradient(w * 0.78, h * 0.2, 0, w * 0.78, h * 0.2, h * 0.3);
    mg.addColorStop(0, "#fffbe6"); mg.addColorStop(0.22, "#fff2b8"); mg.addColorStop(0.26, "rgba(255,240,190,.25)"); mg.addColorStop(1, "rgba(255,240,190,0)");
    ctx.fillStyle = mg; ctx.fillRect(0, 0, w, h);
    ridge(ctx, w, h, h * 0.62, h * 0.18, 0.4, "#2b3f7e");
    ridge(ctx, w, h, h * 0.74, h * 0.14, 2.6, "#1a2856");
    ridge(ctx, w, h, h * 0.88, h * 0.1, 4.9, "#0d1432");
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#120a2e"); g.addColorStop(0.7, "#4b1d5e"); g.addColorStop(1, "#ff6f61");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const r = rand(42);
    let x = -4;
    while (x < w) {
      const bw = w * (0.06 + r() * 0.08), bh = h * (0.25 + r() * 0.5), top = h - bh;
      ctx.fillStyle = r() > 0.5 ? "#1a1233" : "#231845";
      ctx.fillRect(x, top, bw, bh);
      for (let wy = top + 6; wy < h - 6; wy += 7) {
        for (let wx = x + 4; wx < x + bw - 4; wx += 6) {
          const on = r() > 0.55 && Math.sin(t * 0.8 + wx * 0.37 + wy * 0.11) > -0.7;
          if (on) { ctx.fillStyle = r() > 0.3 ? "#ffd36b" : "#7cc7ff"; ctx.fillRect(wx, wy, 3, 3); }
        }
      }
      x += bw + 2;
    }
  }
}

// ---------- editor ----------
const df = document.getElementById("df");
const editor = new Drawflow(df);
editor.reroute = false;
editor.curvature = 0.42;
editor.zoom_min = 0.35;
editor.draggable_inputs = false; // let sliders and selects take the pointer instead of dragging the node
editor.start();

function filterHtml(key) {
  const f = FX[key];
  return `<div style="--c:${f.color}"><div class="nh"><i></i>${f.title}<b class="val"></b><span class="tag">未接線</span></div>
    <div class="nb"><input type="range" df-v min="${f.min}" max="${f.max}" step="1" aria-label="${f.title}"></div></div>`;
}
const SRC_HTML = `<div style="--c:#f7df1e"><div class="nh"><i></i>來源影像</div>
  <div class="nb"><canvas class="thumb" width="160" height="100"></canvas>
  <select df-scene aria-label="選擇來源影像">${Object.entries(SCENES).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div></div>`;
const OUT_HTML = `<div style="--c:#7bd389"><div class="nh"><i></i>輸出預覽</div>
  <div class="nb"><canvas class="out" width="228" height="142"></canvas><div class="chain"></div></div></div>`;

function addFilter(key, x, y) {
  return editor.addNode(key, 1, 1, x, y, "fx-node", { v: FX[key].v }, filterHtml(key));
}

// Initial pipeline: one source feeding two filter branches, each with its own preview.
function build() {
  editor.clear();
  const wide = innerWidth >= 640;
  df.classList.toggle("vflow", !wide);
  const src = editor.addNode("source", 0, 1, ...(wide ? [0, 150] : [0, 0]), "src-node", { scene: "sunset" }, SRC_HTML);
  if (wide) {
    const a = addFilter("brightness", 235, 30);
    const b = addFilter("hue", 470, 70);
    const out1 = editor.addNode("output", 1, 0, 705, 0, "out-node", {}, OUT_HTML);
    const c = addFilter("sepia", 235, 300);
    const d = addFilter("blur", 470, 330);
    const out2 = editor.addNode("output", 1, 0, 705, 260, "out-node", {}, OUT_HTML);
    [[src, a], [a, b], [b, out1], [src, c], [c, d], [d, out2]].forEach(([o, i]) => editor.addConnection(o, i, "output_1", "input_1"));
  } else {
    const b = addFilter("hue", 50, 222);
    const out = editor.addNode("output", 1, 0, -10, 339, "out-node", {}, OUT_HTML);
    editor.addConnection(src, b, "output_1", "input_1");
    editor.addConnection(b, out, "output_1", "input_1");
  }
  refresh();
  fit();
}

// Fit all nodes into the frame, leaving room for the buttons on top and the hint below.
function fit() {
  const W = df.clientWidth, H = df.clientHeight;
  const data = editor.drawflow.drawflow.Home.data;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const id in data) {
    const el = document.getElementById(`node-${id}`);
    const n = data[id];
    x0 = Math.min(x0, n.pos_x); y0 = Math.min(y0, n.pos_y);
    x1 = Math.max(x1, n.pos_x + el.offsetWidth); y1 = Math.max(y1, n.pos_y + el.offsetHeight);
  }
  if (!isFinite(x0)) return;
  const top = 58, bottom = 46, side = 24;
  const z = Math.max(0.35, Math.min(1.1, (W - 2 * side) / (x1 - x0), (H - top - bottom) / (y1 - y0)));
  // The canvas scales around its own centre, so the translation is relative to that.
  const tx = z * (W / 2 - (x0 + x1) / 2);
  const ty = z * (H / 2 - (y0 + y1) / 2) + (top - bottom) / 2;
  editor.zoom = editor.zoom_last_value = z;
  editor.canvas_x = tx;
  editor.canvas_y = ty;
  editor.precanvas.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
}

// ---------- evaluation ----------
let plans = [];   // one entry per output node: { canvas, scene, filter }
let sources = []; // one entry per source node: { canvas, scene }

// Walk upstream from a node until a source is found; null when the chain is broken or loops.
function upstream(id) {
  const data = editor.drawflow.drawflow.Home.data;
  const filters = [], names = [];
  const seen = new Set();
  let cur = data[id];
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    if (cur.name === "source") return { scene: cur.data.scene, filters: filters.reverse(), names: names.reverse() };
    if (FX[cur.name]) {
      filters.push(FX[cur.name].css(Number(cur.data.v)));
      names.push(FX[cur.name].title);
    }
    const c = cur.inputs.input_1 && cur.inputs.input_1.connections[0];
    cur = c ? data[c.node] : null;
  }
  return null;
}

function refresh() {
  const data = editor.drawflow.drawflow.Home.data;
  plans = [];
  sources = [];
  for (const id in data) {
    const n = data[id];
    const el = document.getElementById(`node-${id}`);
    if (n.name === "source") {
      sources.push({ canvas: el.querySelector("canvas"), scene: n.data.scene });
      continue;
    }
    const chain = upstream(id);
    el.classList.toggle("idle", !chain);
    if (FX[n.name]) {
      el.querySelector(".val").textContent = `${n.data.v}${FX[n.name].unit}`;
    } else if (n.name === "output") {
      const info = el.querySelector(".chain");
      if (chain) {
        info.innerHTML = [SCENES[chain.scene], ...chain.names].map((s) => `<b>${s}</b>`).join(" → ");
        plans.push({ canvas: el.querySelector("canvas"), scene: chain.scene, filter: chain.filters.join(" ") || "none" });
      } else {
        info.textContent = "尚未接到來源影像";
        const ctx = el.querySelector("canvas").getContext("2d");
        ctx.fillStyle = "#111318";
        ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
      }
    }
  }
}

// Render each used scene once per frame, then let every output apply its own filter chain.
const buffers = {};
function frame(ts) {
  const t = ts / 1000;
  const need = new Set([...sources.map((s) => s.scene), ...plans.map((p) => p.scene)]);
  for (const k of need) {
    if (!buffers[k]) { buffers[k] = document.createElement("canvas"); buffers[k].width = 320; buffers[k].height = 200; }
    drawScene(buffers[k].getContext("2d"), k, t, 320, 200);
  }
  for (const s of sources) s.canvas.getContext("2d").drawImage(buffers[s.scene], 0, 0, s.canvas.width, s.canvas.height);
  for (const p of plans) {
    const ctx = p.canvas.getContext("2d");
    ctx.filter = p.filter;
    ctx.drawImage(buffers[p.scene], 0, 0, p.canvas.width, p.canvas.height);
    ctx.filter = "none";
  }
  requestAnimationFrame(frame);
}

// A pipeline input takes one feed: a new wire replaces the old one.
editor.on("connectionCreated", ({ output_id, input_id, output_class, input_class }) => {
  const node = editor.drawflow.drawflow.Home.data[input_id];
  for (const c of [...node.inputs[input_class].connections]) {
    if (c.node !== String(output_id)) editor.removeSingleConnection(c.node, input_id, c.input, input_class);
  }
  refresh();
});
["connectionRemoved", "nodeRemoved", "nodeCreated", "nodeDataChanged"].forEach((ev) => editor.on(ev, refresh));

// ---------- controls ----------
const pick = document.getElementById("pick");
for (const [k, f] of Object.entries(FX)) pick.add(new Option(f.title, k));
pick.addEventListener("change", () => {
  if (!pick.value) return;
  // Drop the new node near the middle of the visible area.
  const z = editor.zoom;
  const x = df.clientWidth / 2 - editor.canvas_x / z - 86 + (Math.random() - 0.5) * 60;
  const y = df.clientHeight / 2 - editor.canvas_y / z - 40 + (Math.random() - 0.5) * 60;
  const id = addFilter(pick.value, x, y);
  pick.value = "";
  refresh();
  document.getElementById(`node-${id}`).animate([{ transform: "scale(.6)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], { duration: 260, easing: "ease-out" });
});
document.getElementById("reset").addEventListener("click", build);
document.getElementById("fit").addEventListener("click", fit);
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(fit, 120); });

build();
requestAnimationFrame(frame);
</script>
</body>
</html>
