<script src="https://cdn.jsdelivr.net/npm/drawflow@0.0.60/dist/drawflow.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const { h, fmt } = Showcase;
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------- shared helpers ----------
// Run fn(w, h) after the element really changes size (one call per frame at most).
function onBox(ctx, el, fn) {
  let lw = el.clientWidth, lh = el.clientHeight, raf = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = el.clientWidth, hh = el.clientHeight;
      if (!w || !hh || (w === lw && hh === lh)) return;
      lw = w; lh = hh;
      fn(w, hh);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}

// Drawflow binds every listener to its container, so removing the element is a full teardown.
function makeEditor(ctx, host, opts = {}) {
  // Drawflow switches on classList[0]; "parent-drawflow" must come first or view-mode panning
  // and drags that start on the container background are ignored.
  const el = h("div", { class: "parent-drawflow dw-canvas" });
  host.append(el);
  const ed = new Drawflow(el);
  Object.assign(ed, { curvature: 0.42, reroute_curvature: 0.42, reroute_curvature_start_end: 0.42,
    zoom_min: 0.3, zoom_max: 2, draggable_inputs: false }, opts);
  ed.start();
  // Drawflow calls preventDefault() on mousedown over a connection, so the container never gets
  // focus and its Delete key handler stays silent; focus it explicitly.
  ed.on("connectionSelected", () => el.focus({ preventScroll: true }));
  ctx.onCleanup(() => el.remove());
  return ed;
}
const nodesOf = (ed) => ed.drawflow.drawflow[ed.module].data;
const nodeEl = (ed, id) => ed.container.querySelector(`#node-${id}`);
const link = (ed, pairs) => pairs.forEach(([a, b, o = 1, i = 1]) => ed.addConnection(a, b, `output_${o}`, `input_${i}`));
const card = (title, color, body = "", tag = "") =>
  `<div style="--c:${color}"><div class="dw-nh"><i></i>${title}${tag}</div>${body ? `<div class="dw-nb">${body}</div>` : ""}</div>`;

// Screen point -> canvas coordinates (the precanvas rect already includes pan and zoom).
function toCanvas(ed, x, y) {
  const r = ed.precanvas.getBoundingClientRect();
  return [(x - r.left) / ed.zoom, (y - r.top) / ed.zoom];
}
function viewCenter(ed) {
  const r = ed.container.getBoundingClientRect();
  return toCanvas(ed, r.left + r.width / 2, r.top + r.height / 2);
}

// Pick the portrait layout when it would be drawn larger than the landscape one.
const pickVertical = (w, hh, wide, tall) => Math.min(w / tall[0], hh / tall[1]) > Math.min(w / wide[0], hh / wide[1]);

// Fit a canvas-space box into the visible frame. The precanvas scales around its own centre.
function fitBounds(ed, [x0, y0, x1, y1], { pad = 20, top = pad, bottom = pad, min = 0.3, max = 1.1 } = {}) {
  const W = ed.container.clientWidth, H = ed.container.clientHeight;
  if (!W || !H || !(x1 > x0) || !(y1 > y0)) return;
  const z = Math.max(min, Math.min(max, (W - 2 * pad) / (x1 - x0), (H - top - bottom) / (y1 - y0)));
  const sx = W / 2, sy = (top + H - bottom) / 2;
  const tx = sx - W / 2 + z * (W / 2 - (x0 + x1) / 2);
  const ty = sy - H / 2 + z * (H / 2 - (y0 + y1) / 2);
  ed.zoom = ed.zoom_last_value = z;
  ed.canvas_x = tx;
  ed.canvas_y = ty;
  ed.precanvas.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
  ed.dispatch("zoom", z);
  ed.dispatch("translate", { x: tx, y: ty });
}
function fitView(ed, opts) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const data = nodesOf(ed);
  for (const id in data) {
    const n = data[id], el = nodeEl(ed, id);
    if (!el) continue;
    x0 = Math.min(x0, n.pos_x); y0 = Math.min(y0, n.pos_y);
    x1 = Math.max(x1, n.pos_x + el.offsetWidth); y1 = Math.max(y1, n.pos_y + el.offsetHeight);
    for (const o of Object.values(n.outputs)) for (const c of o.connections) for (const p of c.points || []) {
      x0 = Math.min(x0, p.pos_x); x1 = Math.max(x1, p.pos_x); y0 = Math.min(y0, p.pos_y); y1 = Math.max(y1, p.pos_y);
    }
  }
  fitBounds(ed, [x0, y0, x1, y1], opts);
}

// A node input takes one feed: a new wire replaces the old one.
function singleFeed(ed) {
  ed.on("connectionCreated", ({ output_id, input_id, output_class, input_class }) => {
    for (const c of [...nodesOf(ed)[input_id].inputs[input_class].connections]) {
      if (c.node !== String(output_id) || c.input !== output_class) ed.removeSingleConnection(c.node, input_id, c.input, input_class);
    }
  });
}

// Build one module for import(): nodes {id,name,x,y,html,cls,data,ins,outs}, links [from,to,out,in,points].
function moduleJson(nodes, links) {
  const data = {};
  for (const n of nodes) {
    const inputs = {}, outputs = {};
    for (let i = 1; i <= (n.ins ?? 1); i++) inputs[`input_${i}`] = { connections: [] };
    for (let i = 1; i <= (n.outs ?? 1); i++) outputs[`output_${i}`] = { connections: [] };
    data[n.id] = { id: n.id, name: n.name, data: n.data || {}, class: n.cls || "", html: n.html, typenode: false, inputs, outputs, pos_x: n.x, pos_y: n.y };
  }
  for (const [a, b, o = 1, i = 1, points] of links) {
    const c = { node: String(b), output: `input_${i}` };
    if (points) c.points = points;
    data[a].outputs[`output_${o}`].connections.push(c);
    data[b].inputs[`input_${i}`].connections.push({ node: String(a), input: `output_${o}` });
  }
  return { data };
}

function makeLog(ul, counter) {
  let total = 0;
  return (kind, text, cls = "") => {
    ul.querySelector(".empty")?.remove();
    const d = new Date();
    const time = `${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;
    ul.prepend(h("li", {}, h("time", { text: time }), h("b", { class: cls, text: kind }), h("span", { text, title: text })));
    while (ul.children.length > 40) ul.lastElementChild.remove();
    if (counter) counter.textContent = `${++total} 筆`;
  };
}

// ---------- 1. filter pipeline (ported from the original demo) ----------
// Each filter node maps to one CSS canvas filter; the output node composes the whole upstream chain.
const FX = {
  brightness: { title: "亮度", color: "#f7df1e", min: 40, max: 180, v: 125, unit: "%", css: (v) => `brightness(${v}%)` },

function ridge(ctx, w, h, base, amp, seed, color) {
  ctx.beginPath();
  ctx.moveTo(0, h);
  for (let x = 0; x <= w; x += 4) {
    const k = x / w;
    const y = base - amp * (0.55 * Math.sin(k * 5.1 + seed) + 0.3 * Math.sin(k * 11.7 + seed * 2.3) + 0.15 * Math.sin(k * 23 + seed * 4.1));
    ctx.lineTo(x, y);
  }
  ctx.lineTo(w, h);
  ctx.fillStyle = color;
  ctx.fill();
}
function rand(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

function drawScene(ctx, kind, t, w, h) {
  if (kind === "sunset") {
    const hz = h * 0.6;
    let g = ctx.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, "#2b1b5a"); g.addColorStop(0.55, "#d9487a"); g.addColorStop(1, "#ffb259");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, hz);
    const sy = hz - h * 0.08 + Math.sin(t * 0.5) * 3;
    const sg = ctx.createRadialGradient(w * 0.5, sy, 0, w * 0.5, sy, w * 0.28);
    sg.addColorStop(0, "rgba(255,246,214,1)"); sg.addColorStop(0.18, "rgba(255,214,120,.95)"); sg.addColorStop(1, "rgba(255,150,90,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, w, hz);
    ridge(ctx, w, hz, hz, h * 0.06, 1.2, "#5a2a5e");
    g = ctx.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, "#e86f7c"); g.addColorStop(1, "#23184a");
    ctx.fillStyle = g; ctx.fillRect(0, hz, w, h - hz);
    for (let i = 0; i < 16; i++) {
      const y = hz + 3 + i * (h - hz) / 17;
      const len = w * 0.22 * (1 - i / 18) * (0.75 + 0.25 * Math.sin(t * 2.2 + i * 1.3));
      ctx.fillStyle = `rgba(255,224,160,${0.8 - i * 0.045})`;
      ctx.fillRect(w * 0.5 - len / 2 + Math.sin(t * 1.6 + i * 0.8) * 4, y, len, 2);
    }
  } else if (kind === "mount") {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#070b24"); g.addColorStop(0.6, "#1d2f6b"); g.addColorStop(1, "#3c5aa0");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const r = rand(7);
    for (let i = 0; i < 90; i++) {
      const x = r() * w, y = r() * h * 0.6, tw = 0.5 + 0.5 * Math.sin(t * 3 + i);
      ctx.fillStyle = `rgba(255,255,255,${0.25 + 0.6 * tw * r()})`;
      ctx.fillRect(x, y, 1.6, 1.6);
    }
    const mg = ctx.createRadialGradient(w * 0.78, h * 0.2, 0, w * 0.78, h * 0.2, h * 0.3);
    mg.addColorStop(0, "#fffbe6"); mg.addColorStop(0.22, "#fff2b8"); mg.addColorStop(0.26, "rgba(255,240,190,.25)"); mg.addColorStop(1, "rgba(255,240,190,0)");
    ctx.fillStyle = mg; ctx.fillRect(0, 0, w, h);
    ridge(ctx, w, h, h * 0.62, h * 0.18, 0.4, "#2b3f7e");
    ridge(ctx, w, h, h * 0.74, h * 0.14, 2.6, "#1a2856");
    ridge(ctx, w, h, h * 0.88, h * 0.1, 4.9, "#0d1432");
  } else {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#120a2e"); g.addColorStop(0.7, "#4b1d5e"); g.addColorStop(1, "#ff6f61");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const r = rand(42);
    let x = -4;
    while (x < w) {
      const bw = w * (0.06 + r() * 0.08), bh = h * (0.25 + r() * 0.5), top = h - bh;
      ctx.fillStyle = r() > 0.5 ? "#1a1233" : "#231845";
      ctx.fillRect(x, top, bw, bh);
      for (let wy = top + 6; wy < h - 6; wy += 7) {
        for (let wx = x + 4; wx < x + bw - 4; wx += 6) {
          const on = r() > 0.55 && Math.sin(t * 0.8 + wx * 0.37 + wy * 0.11) > -0.7;
          if (on) { ctx.fillStyle = r() > 0.3 ? "#ffd36b" : "#7cc7ff"; ctx.fillRect(wx, wy, 3, 3); }
        }
      }
      x += bw + 2;
    }
  }
}

// Photos are cover-cropped with a slow Ken Burns drift so they stay visibly live too.
function drawSource(g, kind, t, w, hh) {
  if (!PHOTOS[kind]) return drawScene(g, kind, t, w, hh);
  if (!photoCache[kind]) { photoCache[kind] = new Image(); photoCache[kind].src = `_shared/img/photo-${PHOTOS[kind]}.jpg`; }
  const img = photoCache[kind];
  g.fillStyle = "#111318";
  g.fillRect(0, 0, w, hh);
  if (!img.complete || !img.naturalWidth) return;
  const s = Math.max(w / img.naturalWidth, hh / img.naturalHeight) * (1.14 + 0.05 * Math.sin(t * 0.25));
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  g.drawImage(img, (w - dw) / 2 + Math.sin(t * 0.17) * (dw - w) * 0.4, (hh - dh) / 2 + Math.cos(t * 0.13) * (dh - hh) * 0.4, dw, dh);
}

Showcase.run({ scenes: [
  {
    id: "filters", title: "濾鏡流水線",
    api: "addNode()・addConnection()・df-* 雙向綁定・nodeDataChanged",
    desc: "原版示範強化：每個濾鏡節點對應一個 Canvas filter，輸出節點沿著連線往上游找到來源，把整條鏈組合後每格重畫。來源可選三段程序生成動畫或三張照片，輸出預覽可拖動分割線對照原圖；每個輸入只接一條線，新線會取代舊線；畫面直立時改成由上往下的直式流程。",
    hint: "拉線接節點・拖滑桿即時重算・點選節點或連線後按 Delete 刪除",
    mount(ctx) {
      ctx.html(`<div class="dw-fill"><div class="dw-box"></div></div>`);
      const box = ctx.$(".dw-box");
      const ed = makeEditor(ctx, box);
      let vertical = null, plans = [], sources = [];
      const buffers = {};
      const fit = () => fitView(ed, { pad: 18, max: 1.1 });
      const addFilter = (key, x, y) => ed.addNode(key, 1, 1, x, y, "dw-fx", { v: FX[key].v }, filterHtml(key));
      const addSource = (x, y, scene = "sunset") => ed.addNode("source", 0, 1, x, y, "dw-src", { scene }, SRC_HTML);
      const addOutput = (x, y) => ed.addNode("output", 1, 0, x, y, "dw-out", { split: 30 }, OUT_HTML);

      // Walk upstream until a source is found; null when the chain is broken or loops.
      const upstream = (id) => {
        const data = nodesOf(ed), filters = [], names = [], seen = new Set();
        let cur = data[id];
        while (cur && !seen.has(cur.id)) {
          seen.add(cur.id);
          if (cur.name === "source") return { scene: cur.data.scene, filters: filters.reverse(), names: names.reverse() };
          if (FX[cur.name]) { filters.push(FX[cur.name].css(Number(cur.data.v))); names.push(FX[cur.name].title); }
          const c = cur.inputs.input_1 && cur.inputs.input_1.connections[0];
          cur = c ? data[c.node] : null;
        }
        return null;
      };
      const refresh = () => {
        const data = nodesOf(ed);
        plans = []; sources = [];
        for (const id in data) {
          const n = data[id], el = nodeEl(ed, id);
          if (!el) continue;
          if (n.name === "source") { sources.push({ canvas: el.querySelector("canvas"), scene: n.data.scene }); continue; }

          el.classList.toggle("dw-idle", !chain);
          if (FX[n.name]) el.querySelector(".dw-val").textContent = `${n.data.v}${FX[n.name].unit}`;
          else if (n.name === "output") {
            const info = el.querySelector(".dw-chain"), cv = el.querySelector("canvas");
            if (chain) {
              info.innerHTML = [SOURCES[chain.scene], ...chain.names].map((s) => `<b>${s}</b>`).join(" → ");
              plans.push({ canvas: cv, scene: chain.scene, filter: chain.filters.join(" ") || "none", split: Number(n.data.split) || 0 });
            } else {

              const g = cv.getContext("2d");
              g.fillStyle = "#111318";
              g.fillRect(0, 0, cv.width, cv.height);
            }
          }
        }
      };
      singleFeed(ed);
      ["connectionCreated", "connectionRemoved", "nodeRemoved", "nodeCreated", "nodeDataChanged"].forEach((ev) => ed.on(ev, refresh));

      const build = () => {
        vertical = pickVertical(box.clientWidth, box.clientHeight, [960, 545], [252, 640]);
        ed.clear();
        ed.container.classList.toggle("dw-v", vertical);
        if (vertical) {
          const s = addSource(40, 0), b = addFilter("hue", 40, 240), o = addOutput(0, 372);

          const s = addSource(0, 170);

        fit();

      // Render each used source once per frame, then let every output apply its own filter chain.

          if (!buffers[k]) { buffers[k] = document.createElement("canvas"); buffers[k].width = 320; buffers[k].height = 200; }
          drawSource(buffers[k].getContext("2d"), k, t, 320, 200);

        for (const s of sources) s.canvas.getContext("2d").drawImage(buffers[s.scene], 0, 0, s.canvas.width, s.canvas.height);
        for (const p of plans) {
          const g = p.canvas.getContext("2d"), W = p.canvas.width, H = p.canvas.height, buf = buffers[p.scene];
          g.filter = p.filter;
          g.drawImage(buf, 0, 0, W, H);
          g.filter = "none";
          const x = Math.round(W * p.split / 100);
          if (x <= 0) continue;
          g.drawImage(buf, 0, 0, 320 * p.split / 100, 200, 0, 0, x, H);

          g.fillRect(x - 1, 0, 2, H);
          g.font = `600 10px ${FONT}`;
          g.textBaseline = "top";
          if (x > 38) tagLabel(g, "原圖", 4);

    mount(ctx) {

    desc: "飲料訂單試算：數值節點與運算節點串成算式，任何欄位、連線或節點變動都沿著連線遞迴重算，缺線或形成迴圈時標示原因。「隨機訂單」用 updateNodeDataFromId() 從程式寫入資料（這個方法不會觸發事件，所以要自己重算）；選取運算節點後可以增減輸入埠。",

    mount(ctx) {

      const fit = () => fitView(ed, { pad: 16, bottom: 50, max: 1.05 });

      const compute = () => {
        const data = nodesOf(ed), memo = {};
        const val = (id, stack) => {
          if (memo[id]) return memo[id];
          if (stack.has(id)) return { err: "無法計算" };
          const n = data[id];
          let r;
          if (n.name === "num") {
            const v = Number(n.data.v);
            r = n.data.v !== "" && Number.isFinite(v) ? { v, f: fmtN(v) } : { err: "無法計算" };
          } else {
            stack.add(id);
            const args = Object.keys(n.inputs).sort((a, b) => a.slice(6) - b.slice(6)).map((k) => {
              const c = n.inputs[k].connections[0];
              return c ? val(c.node, stack) : { err: "未接線" };
            });
            stack.delete(id);
            const bad = args.find((a) => a.err);
            if (bad) r = { err: bad.err };
            else if (n.name === "total") r = args[0];
            else {
              const op = n.data.op, p = PREC[op];
              const v = args.slice(1).reduce((acc, a) => (op === "add" ? acc + a.v : op === "sub" ? acc - a.v : op === "mul" ? acc * a.v : acc / a.v), args[0].v);
              const f = args.map((a, i) => (a.p && (a.p < p || (a.p === p && i > 0 && (op === "sub" || op === "div"))) ? `(${a.f})` : a.f)).join(` ${OPS[op]} `);

      const build = () => {

        const P = vertical

        ids = {

          o1: addOp("mul", ...P.o1), d: addNum("折扣", "#9d8cff", 0.9, ...P.d),

        paint();
      });
      ctx.button("－", () => ed.zoom_out(), { title: "zoom_out()" });
      ctx.button("＋", () => ed.zoom_in(), { title: "zoom_in()" });
      ctx.button("100%", () => ed.zoom_reset(), { title: "zoom_reset()" });
      ctx.button("置中", fit);
      onBox(ctx, box, fit);
      fit();
      paint();
    },
  },
  {
    id: "reroute", title: "轉折點與曲線",
    api: "reroute・reroute_fix_curvature・curvature・updateConnectionNodes()",
    desc: "配送路線：開啟 reroute 後，連線可以加上轉折點繞過障礙。橘色路線從倉庫繞過施工路段直達門市，轉折點存在連線資料的 points 裡，會跟著 export() / import() 保存。曲率滑桿即時改 curvature 並重畫所有連線；reroute_fix_curvature 讓每一段各自套用曲率。",
    hint: "雙擊連線加轉折點・拖曳轉折點・雙擊轉折點刪除",
    mount(ctx) {
      ctx.html(`<div class="dw-fill"><div class="dw-box"><div class="dw-badge"></div></div></div>`);
      const box = ctx.$(".dw-box"), badge = ctx.$(".dw-badge");
      const vertical = pickVertical(box.clientWidth, box.clientHeight - 60, [640, 345], [520, 405]);
      const place = (c, r) => (vertical ? [r * 190, c * 170] : [c * 250, r * 140]);
      const pt = (c, r) => { const [x, y] = place(c, r); return { pos_x: x, pos_y: y }; };
      const ROUTE = [
        { id: 1, t: "倉庫", c: "#f7df1e", sub: "林口物流園區", g: [0, 1], ins: 0 },
        { id: 2, t: "轉運站", c: "#4cc9f0", sub: "桃園分站", g: [1, 0] },
        { id: 3, t: "道路施工", c: "#ff8c42", sub: "封閉至月底", g: [1, 1], ins: 0, outs: 0, cls: "dw-block" },
        { id: 4, t: "冷鏈中心", c: "#9d8cff", sub: "低溫轉運", g: [1, 2] },
        { id: 5, t: "門市", c: "#7bd389", sub: "信義店", g: [2, 1], outs: 0 },
      ];
      const routeJson = () => ({ drawflow: { Home: moduleJson(ROUTE.map((n) => {
        const [x, y] = place(...n.g);
        return { id: n.id, name: "stop", x, y, ins: n.ins, outs: n.outs, cls: `dw-route ${n.cls || ""}`.trim(), data: {}, html: card(n.t, n.c, `<small>${n.sub}</small>`) };
      }), [[1, 2], [2, 5], [1, 4], [4, 5], [1, 5, 1, 1, [pt(0.8, 1.85), pt(1.75, 1.85)]]]) } });

      const ed = makeEditor(ctx, box, { reroute: true });
      ed.container.classList.toggle("dw-v", vertical);
      const fit = () => fitView(ed, { pad: 20, bottom: 64, max: 1.1 });
      let last = "無";
      const points = () => Object.values(nodesOf(ed)).reduce((s, n) => s + Object.values(n.outputs)
        .reduce((a, o) => a + o.connections.reduce((b, c) => b + (c.points ? c.points.length : 0), 0), 0), 0);
      const paint = () => {
        badge.innerHTML = `轉折點 <b>${points()}</b> 個・curvature <b>${ed.curvature.toFixed(2)}</b>・reroute_fix_curvature <code>${ed.reroute_fix_curvature}</code><br>最近事件 <code>${last}</code>`;
      };
      ["addReroute", "removeReroute", "rerouteMoved"].forEach((ev) => ed.on(ev, (id) => { last = `${ev}(${id})`; paint(); }));
      ["connectionCreated", "connectionRemoved", "import"].forEach((ev) => ed.on(ev, paint));
      const redrawAll = () => Object.keys(nodesOf(ed)).forEach((id) => ed.updateConnectionNodes(`node-${id}`));

      ctx.slider("曲率", { min: 0, max: 1, step: 0.05, value: 0.42, format: (v) => v.toFixed(2) }, (v) => {
        ed.curvature = ed.reroute_curvature = ed.reroute_curvature_start_end = v;
        redrawAll();
        paint();
      });
      ctx.toggle("reroute_fix_curvature", false, (v) => {
        // Each segment becomes its own path when fixed, so rebuild the drawing from the current data.
        const data = ed.export();
        ed.reroute_fix_curvature = v;
        ed.import(data);
      });
      ctx.button("清除轉折點", () => {
        const data = ed.export();
        for (const n of Object.values(data.drawflow.Home.data)) for (const o of Object.values(n.outputs)) for (const c of o.connections) delete c.points;
        last = "清除後 import()";
        ed.import(data);
      });
      ctx.button("還原路線", () => { last = "無"; ed.import(routeJson()); fit(); });
      onBox(ctx, box, fit);
      ed.import(routeJson());
      fit();
      paint();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "import() 載入 N 個節點與連線・拖曳畫布平移",
    desc: "Drawflow 沒有虛擬化，每個節點都是 DOM 元素、每條連線都是一個 SVG。逐步加大節點數，量 import() 把整份 JSON 建成畫面的時間，再用 Drawflow 自己的滑鼠事件處理程序自動拖曳畫布 0.4 秒，量平移時的 FPS。連線密度可以切換成只有節點、每個節點 1 條或 3 條。",
    hint: "測試前可切換連線密度・「自動平移」持續拖曳畫布，FPS 顯示在右上角",
    mount(ctx) {
      ctx.html(`<div class="dw-stress"><div class="dw-box"><div class="dw-panlog" aria-live="polite"></div></div></div>`);
      ctx.controls.classList.add("bottom");
      const box = ctx.$(".dw-box"), panlog = ctx.$(".dw-panlog");
      const ed = makeEditor(ctx, box, { zoom_min: 0.03 });
      ed.container.classList.add("dw-mini");
      let k = 1, count = 0, links = 0, cols = 4;

      // Grid of small nodes; k = 0 no links, 1 a chain, 3 chain + up + up-left neighbours.
      const gen = (n) => {
        const c = Math.max(4, Math.round(Math.sqrt(n * 2.2)));
        const nodes = [], ls = [];
        for (let i = 1; i <= n; i++) {
          nodes.push({ id: i, name: "n", x: ((i - 1) % c) * 150, y: Math.floor((i - 1) / c) * 80, cls: "dw-sn", data: {}, html: `<div class="dw-sn-b"><b>${i}</b>節點</div>` });
        }
        if (k >= 1) for (let i = 2; i <= n; i++) ls.push([i - 1, i]);
        if (k >= 3) for (let i = c + 1; i <= n; i++) { ls.push([i - c, i]); if ((i - 1) % c) ls.push([i - c - 1, i]); }
        return { n, cols: c, links: ls.length, json: { drawflow: { Home: moduleJson(nodes, ls) } } };
      };
      const fitGrid = () => {
        if (!count) return;
        const rows = Math.ceil(count / cols);
        fitBounds(ed, [-10, 0, (Math.min(count, cols) - 1) * 150 + 120, (rows - 1) * 80 + 34], { pad: 12, min: 0.03, max: 1 });
      };
      const show = (g) => {
        const t0 = performance.now();
        ed.import(g.json);
        const ms = performance.now() - t0;
        count = g.n; links = g.links; cols = g.cols;
        fitGrid();
        return ms;
      };

      // Drive Drawflow's own handlers: mousedown on the precanvas, mousemove/mouseup on the container.
      const mouse = (target, type, x, y) => target.dispatchEvent(new MouseEvent(type, { bubbles: true, clientX: x, clientY: y, button: 0 }));
      const panStart = () => {
        const r = ed.container.getBoundingClientRect();
        const sx = r.left + r.width / 2, sy = r.top + r.height / 2;
        mouse(ed.precanvas, "mousedown", sx, sy);
        return {
          move: (p) => mouse(ed.container, "mousemove", sx + Math.sin(p) * r.width * 0.2, sy + Math.sin(p * 2) * r.height * 0.12),
          // End where we started so the canvas returns to its fitted position.
          end: () => { mouse(ed.container, "mousemove", sx, sy); mouse(ed.container, "mouseup", sx, sy); },
        };
      };
      const panFps = async (ms) => {
        const p = panStart();
        let frames = 0;
        const t0 = performance.now();
        while (performance.now() - t0 < ms) {
          await ctx.frame(1);
          frames++;
          p.move(((performance.now() - t0) / ms) * Math.PI * 2);
        }
        const fps = frames / ((performance.now() - t0) / 1000);
        p.end();
        return fps;
      };
      let stopPan = null;
      const panBtn = ctx.toggle("自動平移", false, (v) => {
        if (!v) { if (stopPan) stopPan(); return; }
        const p = panStart(), t0 = performance.now();
        const stop = ctx.raf((t) => p.move(((t - t0) / 2400) * Math.PI * 2));
        stopPan = () => { stop(); p.end(); stopPan = null; };
      });
      const haltPan = () => { if (stopPan) stopPan(); panBtn.setAttribute("aria-pressed", "false"); };
      ctx.group(["只有節點", "鏈狀 1 條", "網狀 3 條"], 1, (i) => {
        k = [0, 1, 3][i];
        haltPan();
        ed.clear();
        show(gen(150));
      });
      ctx.fps({ position: "right", extra: () => ({ 節點: count, 連線: links }) });
      onBox(ctx, box, fitGrid);
      show(gen(150));

      // Pan FPS is sampled after each timed step (so it does not count toward the step time)
      // and listed in the box; the next prepare() waits for it before clearing the canvas.
      let pending = null, pans = [];
      const paintPans = () => {
        panlog.innerHTML = pans.length ? `拖曳平移 FPS：${pans.map(([n, f]) => `${fmt(n)} 節點 <b>${f}</b>`).join("・")}` : "";
      };
      ctx.bench({
        label: "節點", sizes: [100, 200, 400, 700, 1000, 1500, 2000, 3000], target: 1000, budget: 3000,
        async prepare(n) {
          if (pending) await pending;
          if (n === 100) { pans = []; paintPans(); }
          haltPan();
          // Clear the previous size first so tearing it down is not timed.
          ed.clear();
          count = links = 0;
          return gen(n);
        },
        async run(n, g) {
          show(g);
          await ctx.frame(2);
          pending = panFps(400).then((fps) => { pans.push([n, Math.round(fps)]); paintPans(); }, () => {}).finally(() => { pending = null; });
          return `${fmt(g.links)} 線`;
        },
        note: "每格時間 = import() 把 JSON 建成節點與連線，再加兩個畫格把畫面畫出來；超過 3 秒就停止。每一級完成後，再用 Drawflow 自己的滑鼠事件拖曳畫布 0.4 秒量 FPS（不計入時間），結果列在畫面左下。import() 每畫一條連線都要讀取兩端連接埠的位置再寫入 SVG 路徑，讀寫交錯會反覆觸發版面重算，所以連線越多，耗時增加得比節點數更快；切到「只有節點」可以看到接近線性的成本。平移只改畫布的 CSS transform，FPS 主要受畫面上的元素總數影響。",
      });
    },
  },
] });
</script>
</body>
</html>
