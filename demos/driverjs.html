const CDN = "https://cdn.jsdelivr.net/npm/driver.js@1.8.0/dist/";

// Shared look for every scene frame: the page palette plus a popover theme.
const BASE_CSS = `
  :root { --driver-popover-font-family: var(--font); }
  body { background: var(--bg-2); color: var(--fg); overflow: hidden; }
  button { font: inherit; }

// driver.js always appends its overlay and popover to document.body and turns off pointer events on
// every other element while a tour runs. Each scene therefore runs it inside a same-origin iframe:
// the spotlight stays inside the stage and the showcase tabs and controls keep working.
function frame(ctx, body, css = "") {
  ctx.html(`<div class="dv-host"><iframe class="dv-frame" title="示範畫面"></iframe></div>`);
  const ifr = ctx.$(".dv-frame");
  const ready = new Promise((resolve, reject) => {
    ifr.addEventListener("load", () => {
      if (!ctx.active) return;
      const win = ifr.contentWindow;
      if (!win.driver) { reject(new Error("driver.js 載入失敗")); return; }
      keepTabFocus(ctx, ifr);
      const doc = win.document;
      resolve({ win, doc, driver: win.driver.js.driver, $: (s) => doc.querySelector(s), $$: (s) => [...doc.querySelectorAll(s)] });
    }, { once: true });
  });
  ifr.srcdoc = `<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="_shared/demo.css"><link rel="stylesheet" href="${CDN}driver.css"><style>${BASE_CSS}${css}</style></head>
<body>${body}<script src="${CDN}driver.js.iife.js"><\/script></body></html>`;
  return ready;
}

// driver.js focuses the first popover button on every step, which pulls page focus into the frame.
// While the viewer is switching scenes from the tabs, hand focus straight back to the tab.
function keepTabFocus(ctx, ifr) {
  const isTab = (el) => !!(el && el.closest && el.closest(".sc-tabs"));
  let tab = isTab(document.activeElement) ? document.activeElement : null;
  ctx.on(document, "focusin", (e) => { if (isTab(e.target)) tab = e.target; else if (e.target !== ifr) tab = null; });
  ctx.on(document, "pointerdown", (e) => { if (!isTab(e.target)) tab = null; }, true);
  ctx.on(document, "keydown", (e) => { if (e.key === "Tab") tab = null; }, true);
  const doc = ifr.contentDocument;
  doc.addEventListener("pointerdown", () => { tab = null; }, true);
  doc.addEventListener("focusin", () => { if (tab) tab.focus({ preventScroll: true }); });
}

// destroy() refocuses whatever was focused when the tour started; keep the viewer's focus instead.
function quietDestroy(d) {
  if (!d || !d.isActive()) return;
  const f = document.activeElement;
  d.destroy();
  if (document.activeElement !== f) f?.focus?.({ preventScroll: true });
}

const POP = { popoverClass: "dv-pop", nextBtnText: "下一步", prevBtnText: "上一步", doneBtnText: "完成" };
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

// ---------- scene 1: the original budgeting app tour ----------
const PHONE_CSS = `

    background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(247, 223, 30, 0.3); }

  }
  @media (max-width: 480px) {

const SVG = (d) => `<svg viewBox="0 0 24 24">${d}</svg>`;
const PHONE = `<div class="dv-wrap"><div class="dv-phone">
  <div class="dv-sbar"><span>9:41</span><span>5G ▮▮▮</span></div>
  <header class="dv-head"><span class="dv-logo">豬</span><div><b>小豬記帳</b><small>2026 年 10 月</small></div><button class="dv-help" id="help" type="button">？ 導覽</button></header>
  <section class="dv-bal" id="balance">
    <div class="dv-top"><small>本月結餘</small><span class="dv-tag">示意資料</span></div>
    <b id="bal">NT$0</b>
    <div class="dv-io"><span>收入<i class="in" id="income">0</i></span><span>支出<i class="out" id="spent">0</i></span></div>
    <div class="dv-budget" id="budget"><div class="dv-row"><span>月預算 40,000</span><span id="pct">已用 0%</span></div><div class="dv-track"><i id="budget-bar"></i></div></div>
  </section>
  <section class="dv-sec" id="cats"><div class="dv-sec-head"><h2>支出分類</h2><span>本月</span></div><div class="dv-stack" id="stack"></div><ul class="dv-legend" id="legend"></ul></section>
  <section class="dv-sec dv-list"><div class="dv-sec-head"><h2>最近帳目</h2><span>全部</span></div><ul id="tx-list"></ul></section>
  <nav class="dv-tabbar">
    <a class="on">${SVG('<path d="M5 6h14M5 12h14M5 18h9"/>')}明細</a>
    <a>${SVG('<path d="M5 20V11M12 20V5M19 20v-6"/>')}圖表</a>
    <button class="dv-fab" id="fab" type="button" aria-label="記一筆">${SVG('<path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-linecap="round"/>')}</button>
    <a>${SVG('<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>')}帳戶</a>
    <a>${SVG('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>')}設定</a>
  </nav>
</div></div>`;

// ---------- scenes ----------
Showcase.run({ scenes: [
  {
    id: "tour", title: "招牌導覽",
    api: "driver({ steps, showProgress, progressText }).drive()",
    desc: "記帳 App 的六步新手導覽：遮罩挖洞聚焦目標，步驟之間聚光燈平滑移動；第四步點 ＋ 本身也能前進（advanceOnClick），並用 onNextClick 先新增一筆帳再換步。",
    hint: "點進畫面後可用方向鍵 ← → 換步、Esc 結束",
    mount(ctx) {
      const ready = frame(ctx, PHONE, PHONE_CSS);
      // Demo data (made up): October income, budget, per-category spending and recent entries.
      const INCOME = 42000, BUDGET = 40000;
      const CATS0 = [["餐飲", "var(--c5)", 9840], ["交通", "var(--c2)", 3520], ["購物", "var(--c6)", 6360], ["居家", "var(--c4)", 3860]];
      const TX0 = [["午餐便當", "餐飲", "今天 12:20", -95], ["捷運儲值", "交通", "今天 08:40", -500], ["網購耳機", "購物", "10/2", -2390], ["薪資入帳", "收入", "10/1", 42000], ["全聯採買", "居家", "10/1", -1280]];
      const DRAFT = { name: "珍珠奶茶", cat: "餐飲", when: "剛剛", amt: -60, isNew: true };
      let cats, txs, F = null, d = null;
      const reset = () => {
        cats = CATS0.map(([name, color, sum]) => ({ name, color, sum }));
        txs = TX0.map(([name, cat, when, amt]) => ({ name, cat, when, amt }));
      };
      const fmt = (n) => n.toLocaleString("en-US");
      function render() {
        const $ = (id) => F.doc.getElementById(id);
        const color = { 收入: "var(--accent)", ...Object.fromEntries(cats.map((c) => [c.name, c.color])) };
        const spent = cats.reduce((s, c) => s + c.sum, 0), used = Math.round((spent / BUDGET) * 100);
        $("bal").textContent = `NT$${fmt(INCOME - spent)}`;
        $("income").textContent = fmt(INCOME);
        $("spent").textContent = fmt(spent);
        $("pct").textContent = `已用 ${used}%`;
        $("budget-bar").style.width = `${Math.min(used, 100)}%`;
        $("budget-bar").classList.toggle("warn", used >= 80);
        $("stack").innerHTML = cats.map((c) => `<i style="flex:${c.sum};background:${c.color}"></i>`).join("");
        $("legend").innerHTML = cats.map((c) => `<li><span style="background:${c.color}"></span>${c.name} ${Math.round((c.sum / spent) * 100)}%</li>`).join("");
        $("tx-list").innerHTML = txs.map((t) => `<li${t.isNew ? ' class="is-new"' : ""}><span class="dv-ico" style="background:${color[t.cat]}">${t.cat[0]}</span>
          <span class="dv-tx"><b>${t.name}</b><small>${t.cat}・${t.when}</small></span><span class="dv-amt${t.amt > 0 ? " plus" : ""}">${t.amt > 0 ? "+" : "−"}${fmt(Math.abs(t.amt))}</span></li>`).join("");
      }
      // The "+" button records one sample expense (only once, so a restarted tour stays consistent).
      function addExpense() {
        if (txs.includes(DRAFT)) return;
        txs = [DRAFT, ...txs];
        cats.find((c) => c.name === DRAFT.cat).sum += -DRAFT.amt;
        render();
      }
      function steps() {
        // Beside the phone when the frame is wide, otherwise above or below the target.
        const at = (wide, tight) => (F.win.innerWidth >= 700 ? wide : tight);
        return [
          { element: "#balance", popover: { title: "本月結餘", description: "收入減去支出，這個月還能花多少一眼就知道。", side: at("right", "bottom"), align: "start" } },
          { element: "#budget", popover: { title: "預算進度", description: "進度條顯示月預算用掉多少，超過八成會轉成橘色提醒你收手。", side: at("left", "bottom"), align: "center" } },
          { element: "#cats", popover: { title: "支出分類", description: "長條依金額比例切成四段，餐飲占最多，是最值得留意的地方。", side: at("right", "bottom"), align: "center" } },
          { element: "#fab", advanceOnClick: true, popover: { title: "記一筆", description: "點中間的 ＋ 新增一筆示意支出，也可以直接按「下一步」。", side: at("right", "top"), align: "center",
            onNextClick: () => { addExpense(); d.moveNext(); } } },
          { element: "#tx-list .is-new", popover: { title: "新帳目出現了", description: "珍珠奶茶 −NT$60 排在最上面，結餘、預算與分類比例也同步更新。", side: at("left", "bottom"), align: "start" } },
          { element: "#help", popover: { title: "隨時重看", description: "導覽結束後，按右上角「？ 導覽」就能從頭再走一次。", side: "bottom", align: "end" } },
        ];
      }
      function start(at = 0) {
        if (!F) return;
        quietDestroy(d);
        d = F.driver({ ...POP, steps: steps(), showProgress: true, progressText: "{{current}} / {{total}}", overlayOpacity: 0.62, stagePadding: 6, stageRadius: 12 });
        d.drive(at);
      }
      ctx.button("開始導覽", () => start(), { primary: true });
      ctx.button("重設資料", () => { if (!F) return; reset(); render(); start(); });
      ctx.onCleanup(() => quietDestroy(d));
      // Sides depend on the frame width, so rebuild the steps at the same index after a resize.
      ctx.onResize(() => { if (d?.isActive()) start(d.getActiveIndex() || 0); });
      reset();
      ready.then((f) => {
        F = f;
        render();
        F.$("#fab").addEventListener("click", addExpense);
        F.$("#help").addEventListener("click", () => start());
        ctx.timeout(() => start(), 350);
      });
    },
  },
  {
    id: "highlight", title: "單點提示",
    api: "driver.highlight({ element, popover }) / overlayColor / stagePadding / stageRadius / animate",
    desc: "不跑整套導覽，只用 highlight() 點亮單一元素，適合新功能公告。連續呼叫時聚光燈會從上一個元素滑到下一個；不給 element 則以置中對話框呈現。右上可調遮罩顏色、留白與圓角。",
    hint: "右上切換要點亮的功能；點遮罩會關閉提示",
    mount(ctx) {
      const tiles = Array.from({ length: 12 }, (_, i) => `<div class="dv-tile" style="--h:${(i * 37) % 360}"><span>${["海邊", "山頂", "夜市", "咖啡", "貓", "老街"][i % 6]}</span></div>`).join("");
      const ready = frame(ctx, `<div class="dv-album">
        <header class="dv-abar"><b>☁ 雲端相簿</b><span class="dv-sp"></span><input class="dv-q" id="q" type="search" placeholder="搜尋照片" aria-label="搜尋照片">
          <button class="dv-tool" id="share" type="button">分享</button><button class="dv-tool dv-up" id="up" type="button">＋ 上傳</button></header>
        <div class="dv-grid">${tiles}</div></div>`, `
        .dv-album { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 14px; }
        .dv-abar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .dv-abar b { font-size: 16px; } .dv-sp { flex: 1; }
        .dv-q { width: 150px; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 13px var(--font); }
        .dv-tool { padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
        .dv-up { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
        .dv-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); grid-auto-rows: minmax(70px, 1fr); gap: 10px; overflow: hidden; }
        .dv-tile { border-radius: 12px; background: linear-gradient(135deg, hsl(var(--h) 60% 55%), hsl(calc(var(--h) + 50) 55% 30%)); display: flex; align-items: flex-end; padding: 8px; font-size: 12px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }

        if (!F) return;
        quietDestroy(d);
        d = F.driver({ ...POP, showProgress: true, progressText: "{{current}} / {{total}}",
          disableActiveInteraction: !cfg.canTouch,
          allowKeyboardControl: cfg.keys,
          overlayClickBehavior: cfg.overlay === 2
            ? () => { const p = F.$(".driver-popover"); p.classList.remove("dv-shake"); void p.offsetWidth; p.classList.add("dv-shake"); status("點了遮罩：自訂函式只抖動提示框，不關閉"); }
            : BEHAVIOR[cfg.overlay],
          onPopoverRender: (popover, { driver: drv }) => {
            if (!cfg.custom || drv.isLastStep()) return;
            const b = F.doc.createElement("button");
            b.className = "driver-popover-footer-btn dv-jump";
            b.textContent = "跳到最後";
            b.addEventListener("click", () => drv.moveTo(2));
            popover.footerButtons.prepend(b);
          },
          onDestroyed: () => status(`導覽已關閉（遮罩行為：${BEHAVIOR[cfg.overlay]}）`),
          steps: [
            { element: "#player", popover: { title: "播放器", description: "按按看「播放」。關掉「目標可操作」後，driver.js 會在目標加上 <code>driver-no-interaction</code>，點擊直接穿不過去。", side: "bottom", align: "start" } },
            { element: "#vol", popover: { title: "音量", description: "被點亮的目標預設可以操作，拖得動滑桿。", side: "bottom", align: "center" } },
            { element: "#songs", popover: { title: "播放清單", description: "點一首歌換播放。最後一步沒有「跳到最後」按鈕。", side: "top", align: "start" } },
          ] });
        d.drive(at);
      }
      const restart = () => { const at = d?.isActive() ? d.getActiveIndex() || 0 : 0; start(at); status(`規則已更新，從第 ${at + 1} 步重新開始`); };
      ctx.toggle("目標可操作", cfg.canTouch, (v) => { cfg.canTouch = v; restart(); });
      ctx.group(["點遮罩：關閉", "下一步", "自訂"], cfg.overlay, (i) => { cfg.overlay = i; restart(); });
      ctx.toggle("鍵盤控制", cfg.keys, (v) => { cfg.keys = v; restart(); });
      ctx.toggle("自訂按鈕", cfg.custom, (v) => { cfg.custom = v; restart(); });
      ctx.button("開始導覽", () => start(), { primary: true });
      ctx.onCleanup(() => quietDestroy(d));
      ready.then((f) => {
        F = f;
        F.$("#play").addEventListener("click", () => { plays++; F.$("#play").textContent = plays % 2 ? "❚❚ 暫停" : "▶ 播放"; status(`播放鍵被按了 ${plays} 次`); });
        const vol = F.$("#vol input");
        vol.addEventListener("input", () => { F.$("#vol output").textContent = vol.value; status(`音量調到 ${vol.value}`); });
        F.$("#songs").addEventListener("click", (e) => { const li = e.target.closest("li"); if (!li) return; F.$$("#songs li").forEach((x) => x.classList.toggle("on", x === li)); status(`換成「${li.textContent.slice(1)}」`); });
        F.doc.addEventListener("keyup", (e) => { if (["ArrowLeft", "ArrowRight", "Escape"].includes(e.key) && d?.isActive()) status(cfg.keys ? `按了 ${e.key}，導覽到第 ${d.getActiveIndex() + 1} 步` : `按了 ${e.key}，鍵盤控制已關閉，導覽不動`); });
        ctx.timeout(() => start(), 300);
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "moveNext()（每一幀換一步，animate: false）",
    desc: "頁面放 N 列帳目、每列一個步驟，每一幀呼叫一次 moveNext()。每次換步，driver.js 都要重建提示框、捲動目標進入畫面、量測位置並重畫遮罩；頁面越大，排版與量測越貴，看 FPS 在幾列時掉下來。",
    hint: "按左側「自動加壓」，或拖曳手動滑桿",
    mount(ctx) {
      const ready = frame(ctx, `<ol class="dv-rows" id="rows"></ol>`, `
        body { overflow: auto; }
        .dv-rows { list-style: none; margin: 0 0 0 auto; padding: 10px 12px; width: min(340px, 100%); box-sizing: border-box; }
        .dv-rows li { display: flex; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
        .dv-rows b { font: 600 12px var(--mono); color: var(--muted); width: 56px; } .dv-rows span { flex: 1; } .dv-rows i { font: normal 12px var(--mono); color: var(--c4); }
        .dv-mini { min-width: 0 !important; padding: 8px 12px !important; } .dv-mini .driver-popover-close-btn { display: none !important; }
        .dv-mini .driver-popover-title { font-size: 13px; padding: 0; }`);
      let F = null, d = null, stop = null;
      const m = { n: 0, drive: 0, sum: 0, count: 0, avg: 0, rate: 0, tick: performance.now() };
      ctx.interval(() => {
        const now = performance.now();
        m.avg = m.count ? m.sum / m.count : 0;
        m.rate = (m.count * 1000) / (now - m.tick);
        m.sum = 0; m.count = 0; m.tick = now;
      }, 1000);
      ctx.onCleanup(() => { stop?.(); quietDestroy(d); });
      ctx.ramp({
        label: "頁面列數", unit: "列",
        steps: [1000, 5000, 10000, 20000, 30000, 50000, 100000],
        async apply(n) {
          if (!F) F = await ready;
          stop?.();
          quietDestroy(d);
          const ol = F.$("#rows");
          ol.innerHTML = Array.from({ length: n }, (_, i) => `<li><b>#${String(i + 1).padStart(5, "0")}</b><span>${["早餐", "交通", "午餐", "購物", "晚餐"][i % 5]}</span><i>NT$${(i * 37) % 900 + 40}</i></li>`).join("");
          const rows = ol.children;
          const t = performance.now();
          // The close button is hidden so the popover has nothing to focus on each step.
          d = F.driver({ animate: false, smoothScroll: false, allowClose: false, allowKeyboardControl: false, overlayClickBehavior: () => {},
            popoverClass: "dv-pop dv-mini", showButtons: ["close"], stagePadding: 2, stageRadius: 6, overlayOpacity: 0.55,
            steps: Array.from(rows, (el, i) => ({ element: el, popover: { title: `第 ${i + 1} / ${n} 步`, side: "left", align: "center" } })) });
          d.drive(0);
          m.drive = performance.now() - t;
          m.n = n;
          stop = ctx.raf(() => {
            const s = performance.now();
            if (d.isLastStep()) d.moveTo(0); else d.moveNext();
            m.sum += performance.now() - s; m.count++;
          });
        },
        metrics: () => ({ "每步耗時": fmtMs(m.avg), "每秒換步": fmtCompact(Math.round(m.rate)), "建立＋drive()": fmtMs(m.drive), "頁面節點": fmtCompact(F ? F.doc.getElementsByTagName("*").length : 0) }),
        note: "每一幀換一步，所以「每秒換步」約等於 FPS。每次 moveNext() 會刪掉舊提示框再建新的、把目標捲進畫面（scrollIntoView）、讀取位置，並重寫遮罩 SVG；頁面節點越多，強制排版與 querySelectorAll 越慢。步驟陣列本身只是普通物件，不是瓶頸。",
      });
    },
  },
] });
</script>
</body>
</html>
