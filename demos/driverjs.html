<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver.js 示範：記帳 App 的功能導覽</title>
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.8.0/dist/driver.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  :root { --driver-popover-font-family: var(--font); }
  body { background: radial-gradient(60% 80% at 50% 0%, rgba(247, 223, 30, 0.08), transparent 70%), var(--bg); }

  /* Phone frame on wide screens; becomes the whole page on narrow ones. */
  .phone {
    position: relative; width: 340px; height: min(600px, calc(100vh - 36px));
    display: flex; flex-direction: column; gap: 10px; padding: 0 14px; overflow: hidden;
    background: #121418; border: 1px solid var(--line); border-radius: 34px;
    box-shadow: 0 0 0 7px #1d2026, 0 24px 60px rgba(0, 0, 0, 0.5);
  }
  .sbar { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 10px 10px 0; font: 600 12px var(--mono); }
  .sbar svg { width: 34px; height: 12px; fill: currentColor; }
  .head { flex: none; display: flex; align-items: center; gap: 10px; }
  .logo {
    flex: none; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    background: var(--c3); color: #fff; font-weight: 800;
  }
  .head b { display: block; font-size: 15px; line-height: 1.25; }
  .head small { color: var(--muted); font-size: 12px; }

  /* Balance card with budget bar */
  .balance {
    flex: none; padding: 12px 16px; border-radius: 18px;
    background: linear-gradient(135deg, #2b2712, #1a1c21 62%); border: 1px solid rgba(247, 223, 30, 0.25);
  }
  .balance .top { display: flex; justify-content: space-between; align-items: center; }
  .balance small { color: var(--muted); font-size: 12px; }
  .tag { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .balance > b { display: block; font: 800 28px/1.25 var(--font); font-variant-numeric: tabular-nums; margin: 2px 0 2px; }
  .io { display: flex; gap: 16px; font-size: 12px; color: var(--muted); }
  .io i { font-style: normal; font-family: var(--mono); margin-left: 4px; }
  .io .in { color: var(--c4); }
  .io .out { color: var(--c5); }
  .budget { margin-top: 8px; }
  .budget .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .track { height: 8px; border-radius: 8px; background: rgba(255, 255, 255, 0.1); overflow: hidden; margin-top: 4px; }
  .track i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .6s ease; }
  .track i.warn { background: var(--c5); }

  /* Category breakdown and transaction list */
  .sec { flex: none; background: var(--bg-2); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
  .sec-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .sec-head h2 { margin: 0; font-size: 14px; }
  .sec-head span { font-size: 12px; color: var(--muted); }
  .stack { display: flex; gap: 3px; height: 12px; }
  .stack i { border-radius: 4px; transition: flex .6s ease; }
  .legend { list-style: none; margin: 8px 0 0; padding: 0; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .list { flex: 1 1 auto; min-height: 0; overflow: hidden; padding-bottom: 0; }
  #tx-list { list-style: none; margin: 0; padding: 0; }
  #tx-list li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
  #tx-list li:first-child { border-top: 0; }
  #tx-list li.is-new { margin: 0 -8px; padding: 7px 8px; border-radius: 10px; background: rgba(247, 223, 30, 0.1); animation: drop-in .5s ease; }
  @keyframes drop-in { from { opacity: 0; transform: translateY(-8px); } }
  .ico { flex: none; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #15161a; }
  .tx-main { flex: 1; min-width: 0; line-height: 1.3; }
  .tx-main b { display: block; font-size: 14px; font-weight: 600; }
  .tx-main small { color: var(--muted); font-size: 12px; }
  .amt { font: 600 14px var(--mono); }
  .amt.plus { color: var(--c4); }

  /* Bottom tab bar with the raised add button */
  .tabbar {
    flex: none; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
    margin: 0 -14px; padding: 6px 8px 12px; background: #16181d; border-top: 1px solid var(--line);
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); text-decoration: none; cursor: pointer; }
  .tabbar a.on { color: var(--accent); }
  .tabbar svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .fab {
    justify-self: center; width: 52px; height: 52px; margin-top: -24px; padding: 0; cursor: pointer;
    display: grid; place-items: center; border-radius: 50%; border: 4px solid #121418;
    background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 18px rgba(247, 223, 30, 0.3);
  }
  .fab svg { width: 22px; height: 22px; stroke-width: 2.6; }

  .hint { animation: hint-fade .5s 8s forwards; }

  /* Tour popover theme (driver.js classes) */
  .driver-popover.atlas-pop { border-radius: 14px; padding: 16px 16px 14px; max-width: 290px; color: #1c1c1a; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); }
  .atlas-pop .driver-popover-title { font-size: 16px; }
  .atlas-pop .driver-popover-description { font-size: 13.5px; color: #4a4943; }
  .atlas-pop .driver-popover-progress-text { font: 600 12px var(--mono); color: #8a887f; }
  .atlas-pop .driver-popover-footer-btn { border-radius: 8px; padding: 6px 12px; font-size: 13px; text-shadow: none; border: 1px solid #d9d7cf; }
  .atlas-pop .driver-popover-next-btn, .atlas-pop .driver-popover-done-btn { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
  .atlas-pop .driver-popover-next-btn:hover, .atlas-pop .driver-popover-done-btn:hover { background: #ffe94d; }
  .atlas-pop .driver-popover-close-btn { color: #a5a39a; }

  /* Short frames: trim chrome so at least one transaction row stays visible. */
  @media (max-height: 480px) {
    .phone { height: calc(100vh - 20px); gap: 6px; padding-top: 10px; }
    .sbar, .head small { display: none; }
    .logo { width: 28px; height: 28px; border-radius: 9px; font-size: 13px; }
    .balance { padding: 8px 14px; }
    .balance > b { font-size: 22px; }
    .budget { margin-top: 6px; }
    .sec { padding: 8px 12px; }
    .sec-head { margin-bottom: 2px; }
    .legend { margin-top: 5px; }
    #tx-list li { padding: 4px 0; }
    #tx-list li.is-new { padding: 4px 8px; }
    .tabbar { padding: 4px 8px 8px; }
    .tabbar a { font-size: 0; gap: 0; }
  }
  @media (max-width: 480px) {
    .stage { display: block; }
    .phone { width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; padding-top: 12px; }
    .sbar { display: none; }
    .head { padding-right: 100px; } /* room for the fixed "開始導覽" button */
    .hint { bottom: 84px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="sbar">
      <span>9:41</span>
      <svg viewBox="0 0 34 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="18" y="1" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="20" y="3" width="8" height="6" rx="1.5"/></svg>
    </div>
    <header class="head">
      <span class="logo">豬</span>
      <div><b>小豬記帳</b><small>2026 年 10 月</small></div>
    </header>

    <section class="balance" id="balance">
      <div class="top"><small>本月結餘</small><span class="tag">示意資料</span></div>
      <b id="bal">NT$0</b>
      <div class="io"><span>收入<i class="in" id="income">0</i></span><span>支出<i class="out" id="spent">0</i></span></div>
      <div class="budget" id="budget">
        <div class="row"><span>月預算 40,000</span><span id="pct">已用 0%</span></div>
        <div class="track"><i id="budget-bar"></i></div>
      </div>
    </section>

    <section class="sec" id="cats">
      <div class="sec-head"><h2>支出分類</h2><span>本月</span></div>
      <div class="stack" id="stack"></div>
      <ul class="legend" id="legend"></ul>
    </section>

    <section class="sec list">
      <div class="sec-head"><h2>最近帳目</h2><span>全部</span></div>
      <ul id="tx-list"></ul>
    </section>

    <nav class="tabbar" id="tabbar">
      <a class="on"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>明細</a>
      <a><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>圖表</a>
      <button class="fab" id="fab" type="button" aria-label="記一筆"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <a><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>帳戶</a>
      <a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</a>
    </nav>
  </div>
</div>

<div class="controls"><button class="btn primary" id="tour-start" type="button">開始導覽</button></div>
<div class="hint">方向鍵 ← → 切換步驟，Esc 結束導覽</div>

<script src="https://cdn.jsdelivr.net/npm/driver.js@1.8.0/dist/driver.js.iife.js"></script>
<script>
  const { driver } = window.driver.js;

  // Demo data (made up): October income, budget, per-category spending and recent entries.
  const INCOME = 42000;
  const BUDGET = 40000;
  const CATS = [
    { name: "餐飲", color: "var(--c5)", sum: 9840 },
    { name: "交通", color: "var(--c2)", sum: 3520 },
    { name: "購物", color: "var(--c6)", sum: 6360 },
    { name: "居家", color: "var(--c4)", sum: 3860 },
  ];
  const COLOR = { 收入: "var(--accent)", ...Object.fromEntries(CATS.map((c) => [c.name, c.color])) };
  let txs = [
    { name: "午餐便當", cat: "餐飲", when: "今天 12:20", amt: -95 },
    { name: "捷運儲值", cat: "交通", when: "今天 08:40", amt: -500 },
    { name: "網購耳機", cat: "購物", when: "10/2", amt: -2390 },
    { name: "薪資入帳", cat: "收入", when: "10/1", amt: 42000 },
    { name: "全聯採買", cat: "居家", when: "10/1", amt: -1280 },
  ];
  const DRAFT = { name: "珍珠奶茶", cat: "餐飲", when: "剛剛", amt: -60, isNew: true };

  const $ = (id) => document.getElementById(id);
  const fmt = (n) => n.toLocaleString("en-US");

  function render() {
    const spent = CATS.reduce((s, c) => s + c.sum, 0);
    const used = Math.round((spent / BUDGET) * 100);
    $("bal").textContent = `NT$${fmt(INCOME - spent)}`;
    $("income").textContent = fmt(INCOME);
    $("spent").textContent = fmt(spent);
    $("pct").textContent = `已用 ${used}%`;
    $("budget-bar").style.width = `${Math.min(used, 100)}%`;
    $("budget-bar").classList.toggle("warn", used >= 80);
    $("stack").innerHTML = CATS.map((c) => `<i style="flex:${c.sum};background:${c.color}"></i>`).join("");
    $("legend").innerHTML = CATS.map(
      (c) => `<li><span style="background:${c.color}"></span>${c.name} ${Math.round((c.sum / spent) * 100)}%</li>`
    ).join("");
    $("tx-list").innerHTML = txs.map((t) => `
      <li${t.isNew ? ' class="is-new"' : ""}>
        <span class="ico" style="background:${COLOR[t.cat]}">${t.cat[0]}</span>
        <span class="tx-main"><b>${t.name}</b><small>${t.cat}・${t.when}</small></span>
        <span class="amt${t.amt > 0 ? " plus" : ""}">${t.amt > 0 ? "+" : "−"}${fmt(Math.abs(t.amt))}</span>
      </li>`).join("");
  }

  // The "+" button records one sample expense (only once, so restarting the tour stays consistent).
  function addExpense() {
    if (txs.includes(DRAFT)) return;
    txs = [DRAFT, ...txs];
    CATS.find((c) => c.name === DRAFT.cat).sum += -DRAFT.amt;
    render();
  }
  $("fab").addEventListener("click", addExpense);

  function buildSteps() {
    // Beside the phone when there is room, otherwise above/below the target.
    const roomy = matchMedia("(min-width: 800px)").matches;
    const at = (wide, tight) => (roomy ? wide : tight);
    return [
      { element: "#balance", popover: { title: "本月結餘", description: "收入減去支出，這個月還能花多少一眼就知道。", side: at("right", "bottom"), align: "start" } },
      { element: "#budget", popover: { title: "預算進度", description: "進度條顯示月預算用掉多少，超過八成會轉成橘色提醒你收手。", side: at("left", "bottom"), align: "center" } },
      { element: "#cats", popover: { title: "支出分類", description: "長條依金額比例切成四段，餐飲占最多，是最值得留意的地方。", side: at("right", "bottom"), align: "center" } },
      {
        element: "#fab",
        advanceOnClick: true,
        popover: {
          title: "記一筆",
          description: "點中間的 ＋ 新增一筆示意支出，也可以直接按「下一步」。",
          side: at("right", "top"), align: "center",
          onNextClick: () => { addExpense(); tour.moveNext(); },
        },
      },
      { element: "#tx-list .is-new", popover: { title: "新帳目出現了", description: "珍珠奶茶 −NT$60 排在最上面，結餘、預算與分類比例也同步更新。", side: at("left", "bottom"), align: "start" } },
      { element: "#tour-start", popover: { title: "隨時重看", description: "導覽結束後，按右上角這顆按鈕就能從頭再走一次。", side: "bottom", align: "end" } },
    ];
  }

  let tour = null;
  function startTour() {
    if (tour && tour.isActive()) tour.destroy();
    tour = driver({
      steps: buildSteps(),
      showProgress: true,
      progressText: "{{current}} / {{total}}",
      nextBtnText: "下一步",
      prevBtnText: "上一步",
      doneBtnText: "完成",
      popoverClass: "atlas-pop",
      overlayColor: "#000",
      overlayOpacity: 0.62,
      stagePadding: 6,
      stageRadius: 12,
    });
    tour.drive();
  }

  $("tour-start").addEventListener("click", (e) => { e.currentTarget.blur(); startTour(); });
  render();
  // Open the first step automatically so the popover is visible right after load.
  setTimeout(startTour, 500);
</script>
</body>
</html>
