<script>
// DuckDB-Wasm showcase: SQL console with file drop and export, analytical SQL (ROLLUP, window, PIVOT, QUALIFY),
// CSV / JSON / buffer ingestion with type sniffing, Parquet round trip with metadata, Arrow columnar access,
// prepared statements, and a range() aggregation benchmark. Every scene starts its own worker + database.
const DUCK = "https://cdn.jsdelivr.net/npm/@duckdb/duckdb-wasm@1.32.0/+esm";
const { fmt, fmtMs, fmtCompact } = Showcase;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const since = (t0) => performance.now() - t0;
const bytes = (b) => (b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(2)} MB`);
const KW = /\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|PIVOT|ON|IN|USING|COPY|TO|OVER|PARTITION BY|QUALIFY|ROLLUP|LIMIT|AS|JOIN|AND|ROWS BETWEEN|PRECEDING|CURRENT ROW|DESC|FORMAT|COMPRESSION|DESCRIBE|NULLS LAST)\b/g;
const hl = (sql) => esc(sql).replace(/('[^'\n]*')/g, '<span class="s">$1</span>').replace(KW, '<span class="k">$1</span>').replace(/(--[^\n]*)/g, '<span class="c">$1</span>');
const rows = (t) => t.toArray().map((r) => r.toJSON());
const sqlStr = (s) => `'${String(s).replace(/'/g, "''")}'`;

// Sample data: Taiwan counties (illustrative numbers, not official statistics)
// [code, name, region, area_km2, population_2025, annual_growth]
const COUNTIES = [
  ["NWT", "新北市", "北部", 2052.6, 4040000, -0.002], ["TXG", "臺中市", "中部", 2214.9, 2850000, 0.004],
  ["KHH", "高雄市", "南部", 2951.9, 2730000, -0.003], ["TPE", "臺北市", "北部", 271.8, 2480000, -0.010],
  ["TAO", "桃園市", "北部", 1221.0, 2330000, 0.010], ["TNN", "臺南市", "南部", 2191.7, 1850000, -0.003],
  ["CHA", "彰化縣", "中部", 1074.4, 1240000, -0.006], ["PIF", "屏東縣", "南部", 2775.6, 800000, -0.009],
  ["YUN", "雲林縣", "中部", 1290.8, 660000, -0.009], ["HSQ", "新竹縣", "北部", 1427.5, 590000, 0.013],
  ["MIA", "苗栗縣", "中部", 1820.3, 535000, -0.006], ["CYQ", "嘉義縣", "南部", 1903.6, 480000, -0.011],
  ["NAN", "南投縣", "中部", 4106.4, 480000, -0.009], ["ILA", "宜蘭縣", "北部", 2143.6, 450000, -0.004],
  ["HSZ", "新竹市", "北部", 104.2, 455000, 0.008], ["KEE", "基隆市", "北部", 132.8, 362000, -0.008],
  ["HUA", "花蓮縣", "東部", 4628.6, 318000, -0.008], ["CYI", "嘉義市", "南部", 60.0, 262000, -0.006],
  ["TTT", "臺東縣", "東部", 3515.3, 212000, -0.008], ["KIN", "金門縣", "離島", 151.7, 145000, 0.004],
  ["PEN", "澎湖縣", "離島", 126.9, 108000, 0.002], ["LIE", "連江縣", "離島", 28.8, 14000, 0.005],
];
const countyCsv = ["code,name,region,area_km2", ...COUNTIES.map(([c, n, r, a]) => `${c},${n},${r},${a}`)].join("\n");
const popCsv = ["code,year,people", ...COUNTIES.flatMap(([c, , , , pop, g]) =>
  Array.from({ length: 7 }, (_, i) => `${c},${2019 + i},${Math.round(pop / Math.pow(1 + g, 6 - i))}`))].join("\n");

// Synthetic sales table generated inside DuckDB (deterministic, illustrative only)
const REGIONS = ["北部", "中部", "南部", "東部", "離島"];
const salesSql = (n) => `CREATE OR REPLACE TABLE sales AS
SELECT id, d, ['北部','中部','南部','東部','離島'][r + 1] AS region, ['飲料','零食','文具','家電','服飾','生鮮'][c + 1] AS category,
  round((40 + h % 900) * (1 + 0.35 * sin(dayofyear(d) / 58.1 + r * 1.3)) * [1.6, 1.2, 1.1, 0.6, 0.4][r + 1]) AS amount
FROM (SELECT range AS id, DATE '2025-01-01' + ((range * 7919) % 365)::INTEGER AS d, (range * 2654435761) % 1000003 AS h,
  ((range * 31) % 97) % 5 AS r, ((range * 17) % 89) % 6 AS c FROM range(${n}))`;

// ---------- engine: one worker + database per scene, gate shown only before the first load ----------
let modP = null, bundleP = null, unlocked = false;
async function openDuck(ctx) {
  if (!unlocked) {
    await ctx.gate({
      icon: "🦆", title: "DuckDB-Wasm 分析型 SQL", button: "載入 DuckDB", tags: ["約 34 MB", "WebAssembly", "Web Worker"],
      desc: "按下後下載約 34 MB 的 WebAssembly 引擎（之後瀏覽器會快取）。每個場景各自啟動一個 Worker 與記憶體資料庫，離開場景時關閉。",
    });
    unlocked = true;
  }
  const st = ctx.status("下載 DuckDB 模組…");
  try {
    const duckdb = await (modP ||= import(DUCK));
    const bundle = await (bundleP ||= duckdb.selectBundle(duckdb.getJsDelivrBundles()));
    if (!ctx.active) throw new DOMException("Scene unmounted", "AbortError");
    // Cross-origin workers are not allowed, so wrap the CDN worker script in a same-origin blob
    const workerUrl = URL.createObjectURL(new Blob([`importScripts("${bundle.mainWorker}");`], { type: "text/javascript" }));
    const db = new duckdb.AsyncDuckDB(new duckdb.ConsoleLogger(duckdb.LogLevel.WARNING), new Worker(workerUrl));
    let conn = null;
    ctx.onCleanup(() => {
      URL.revokeObjectURL(workerUrl);
      // A long query may block close(), so give it a moment and then terminate the worker anyway
      const closing = conn ? Promise.race([conn.close(), new Promise((r) => setTimeout(r, 300))]) : Promise.resolve();
      closing.catch(() => {}).finally(() => db.terminate().catch(() => {}));
    });
    st.text("下載 WebAssembly 引擎…");
    await db.instantiate(bundle.mainModule, bundle.pthreadWorker, (p) => {
      if (p.bytesTotal > 0 && ctx.active) {
        st.progress(p.bytesLoaded / p.bytesTotal);
        st.text(`下載 WebAssembly 引擎… ${(p.bytesLoaded / 1048576).toFixed(1)} / ${(p.bytesTotal / 1048576).toFixed(1)} MB`);
      }
    });
    await db.open({ query: { castBigIntToDouble: true, castDecimalToDouble: true } });
    conn = await db.connect();
    st.text("準備示意資料…");
    return { duckdb, db, conn, st };
  } catch (e) {
    if (ctx.active) { modP = bundleP = null; st.error(`DuckDB 載入失敗：${e.message}`); }
    throw e;
  }
}

function cellOf(v, type) {
  if (v === null || v === undefined) return ["NULL", "null"];
  if (/^Date/.test(type)) return [new Date(v).toISOString().slice(0, 10), ""];
  if (/^Timestamp/.test(type)) return [new Date(v).toISOString().slice(0, 19).replace("T", " "), ""];
  if (typeof v === "bigint") return [v.toLocaleString("zh-TW"), "n"];
  if (typeof v === "number") return [Number.isInteger(v) && Math.abs(v) >= 10000 ? fmt(v) : String(Math.round(v * 1000) / 1000), "n"];
  if (typeof v === "boolean") return [String(v), "n"];
  if (typeof v === "object") return [esc(JSON.stringify(v.toJSON ? v.toJSON() : v, (k, x) => (typeof x === "bigint" ? x.toString() : x))), ""];
  return [esc(v), ""];
}

// Render an Arrow table; the last numeric column gets an inline bar when there is a text column too
function table(el, t, { max = 300 } = {}) {
  const fields = t.schema.fields;
  if (!fields.length) { el.innerHTML = '<div class="dk-empty">指令已執行，沒有回傳資料列。</div>'; return; }
  const n = Math.min(t.numRows, max);
  const cols = fields.map((_, i) => t.getChildAt(i));
  const types = fields.map((f) => String(f.type));
  const data = Array.from({ length: n }, (_, r) => cols.map((c) => c.get(r)));
  const isNum = (v) => typeof v === "number" || typeof v === "bigint";
  const numeric = fields.map((_, i) => n > 0 && !/^(Date|Timestamp)/.test(types[i]) && data.every((row) => row[i] === null || isNum(row[i])));
  // Bar goes on the numeric column with the largest magnitude (skips small rank / count columns)
  const peak = (i) => Math.max(...data.map((row) => Math.abs(Number(row[i] || 0))));
  let bar = -1, top = 1;
  if (numeric.some((x) => !x) && n <= 80) numeric.forEach((isN, i) => { if (isN && peak(i) >= top) { bar = i; top = peak(i) || 1; } });
  el.innerHTML = `<table class="dk-t"><thead><tr>${fields.map((f, i) => `<th>${esc(f.name)}<small>${esc(types[i])}</small></th>`).join("")}</tr></thead><tbody>${data.map((row) => `<tr>${row.map((v, i) => {
    const [s, cls] = cellOf(v, types[i]);
    return i === bar && v !== null ? `<td class="n bar" style="--w:${(Math.abs(Number(v)) / top).toFixed(3)}"><span>${s}</span></td>` : `<td class="${cls}">${s}</td>`;
  }).join("")}</tr>`).join("")}</tbody></table>${t.numRows > n ? `<div class="dk-empty">只顯示前 ${fmt(n)} 列，共 ${fmt(t.numRows)} 列</div>` : ""}`;
}

function pills(el, labels, onPick) {
  el.innerHTML = labels.map((l, i) => `<button class="dk-pill" type="button" data-i="${i}">${esc(l)}</button>`).join("");
  const mark = (i) => el.querySelectorAll(".dk-pill").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
  el.addEventListener("click", (e) => { const b = e.target.closest(".dk-pill"); if (b) { mark(+b.dataset.i); onPick(+b.dataset.i); } });
  return mark;
}

function download(buf, name, type) {
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([buf], { type })), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const CONSOLE_EXAMPLES = [
  { name: "視窗函數排名", sql: "-- 各區域人口前兩名：RANK() OVER 加上 DuckDB 的 QUALIFY\nSELECT c.region AS 區域, c.name AS 縣市, p.people AS 人口,\n       RANK() OVER (PARTITION BY c.region ORDER BY p.people DESC) AS 區內排名\nFROM population p JOIN county c USING (code)\nWHERE p.year = 2025\nQUALIFY 區內排名 <= 2\nORDER BY 區域, 區內排名;" },

      ctx.html(`<div class="dk-board">
        <section class="dk-panel"><header><h3>檔案大小<small>同一份 30 萬列資料</small></h3><span class="dk-chip" data-ms></span></header>
          <div class="dk-bars" data-bars></div><div class="dk-kv" data-kv></div><pre class="dk-code dk-hide-narrow" data-code></pre></section>
        <section class="dk-panel"><header><h3>parquet_metadata<small>每個欄位</small></h3></header><div class="dk-res" data-res></div></section></div>`);
      ctx.controls.classList.add("bottom");
      const { db, conn, st } = await openDuck(ctx);
      await conn.query(`CREATE TABLE readings AS SELECT range AS id, TIMESTAMP '2025-01-01' + to_seconds(range * 10) AS ts,
        ['A01', 'A02', 'B07', 'C11'][range % 4 + 1] AS sensor, round(20 + 6 * sin(range / 8640.0) + ((range * 7919) % 100) / 50.0, 2) AS temp,
        ((range * 31) % 100)::INTEGER AS humidity FROM range(300000)`);
      await conn.query("COPY readings TO 'readings.csv' (HEADER)");
      const csvSize = (await db.copyFileToBuffer("readings.csv")).byteLength;
      await db.dropFile("readings.csv");
      const truth = rows(await conn.query("SELECT count(*) AS n, round(sum(temp), 2) AS s FROM readings"))[0];
      st.done();
      const sizes = { "CSV（含標題）": csvSize };
      let comp = "snappy", buf = null, seq = 0, prev = "";
      const LABEL = { snappy: "Snappy", zstd: "ZSTD", uncompressed: "不壓縮" };
      async function write() {
        const my = ++seq, file = `back-${my}.parquet`;
        const copy = `COPY readings TO 'readings.parquet'\n  (FORMAT parquet, COMPRESSION ${comp})`;
        ctx.$("[data-code]").innerHTML = hl(copy);
        const t0 = performance.now();
        await conn.query(copy);
        const out = await db.copyFileToBuffer("readings.parquet");
        const wMs = since(t0);
        await db.dropFile("readings.parquet");
        if (prev) await db.dropFile(prev).catch(() => {});
        prev = file;
        // registerFileBuffer transfers (detaches) the buffer to the worker, so hand it a copy
        await db.registerFileBuffer(file, out.slice());
        const t1 = performance.now();
        const back = rows(await conn.query(`SELECT count(*) AS n, round(sum(temp), 2) AS s FROM '${file}'`))[0];
        const rMs = since(t1);
        const meta = await conn.query(`SELECT path_in_schema AS 欄位, any_value(type) AS 實體型別, any_value(compression) AS 壓縮,
          sum(total_uncompressed_size) AS 原始位元組, sum(total_compressed_size) AS 壓縮後位元組, count(*) AS 列群組 FROM parquet_metadata('${file}') GROUP BY ALL ORDER BY 欄位`);
        if (!ctx.active || my !== seq) return;
        buf = out;
        sizes[`Parquet ${LABEL[comp]}`] = out.byteLength;
        const top = Math.max(...Object.values(sizes));
        ctx.$("[data-bars]").innerHTML = Object.entries(sizes).map(([k, v]) => `<div><span>${k}</span><i class="${k.includes(LABEL[comp]) ? "hot" : ""}" style="width:${(v / top) * 100}%"></i><small>${bytes(v)}</small></div>`).join("");
        const tag = (a, b) => String.fromCharCode(...a.subarray(b, b + 4));
        const same = back.n === truth.n && back.s === truth.s;
        ctx.$("[data-kv]").innerHTML = `<span>檔頭／檔尾</span><b>${tag(out, 0)} … ${tag(out, out.length - 4)}</b>
          <span>寫出＋取回</span><b>${fmtMs(wMs)}</b><span>讀回查詢</span><b>${fmtMs(rMs)}</b>
          <span>列數核對</span><b class="${same ? "ok" : "bad"}">${fmt(back.n)} 列・溫度加總 ${fmt(back.s, 2)} ${same ? "與原表相同" : "不一致"}</b>
          <span>比 CSV 小</span><b>${((1 - out.byteLength / csvSize) * 100).toFixed(1)}%</b>`;
        ctx.$("[data-ms]").innerHTML = `<b>${bytes(out.byteLength)}</b>`;
        table(ctx.$("[data-res]"), meta);
      }
      const go = () => write().catch((e) => ctx.active && (ctx.$("[data-res]").innerHTML = `<div class="dk-empty">${esc(e.message)}</div>`));
      ctx.group(["Snappy", "ZSTD", "不壓縮"], 0, (i) => { comp = ["snappy", "zstd", "uncompressed"][i]; go(); });
      ctx.button("下載 .parquet", () => buf && download(buf, `readings-${comp}.parquet`, "application/vnd.apache.parquet"));
      await write();
    },
  },
  {
    id: "arrow", title: "Arrow 欄式資料",
    api: "table.getChild('x').toArray() → Float64Array",
    desc: "conn.query 回傳的是 Apache Arrow 表格：每個欄位是一段連續的型別陣列。這裡查出數十萬到兩百萬個點，直接用 getChild('x').toArray() 拿到 Float64Array 畫成密度圖，並和逐列轉成 JS 物件的做法比較耗時。左側列出 schema 型別與批次（record batch）數量。",
    hint: "加大點數，比較「取欄」與「逐列」的時間差",
    async mount(ctx) {
      ctx.html(`<div class="dk-board">
        <section class="dk-panel"><header><h3>Arrow 表格<small data-shape></small></h3></header><div class="dk-acc" data-acc></div>
          <div class="dk-kv" data-kv></div><pre class="dk-code dk-hide-narrow" data-code></pre></section>
        <section class="dk-panel"><header><h3>密度圖<small>直接讀 Float64Array</small></h3><span class="dk-chip" data-ms></span></header><canvas class="dk-cv" width="240" height="240"></canvas></section></div>`);
      ctx.controls.classList.add("bottom");
      const { conn, st } = await openDuck(ctx);
      st.done();
      const cv = ctx.$("canvas"), g = cv.getContext("2d");
      const SIZES = [100000, 500000, 1000000, 2000000];
      let seq = 0;
      async function draw(n) {
        const my = ++seq;
        const sql = `SELECT (random() + random() + random() - 1.5) * 1.3\n         + CASE WHEN range % 3 = 0 THEN 1.1 ELSE -0.55 END AS x,\n       (random() + random() + random() - 1.5) * 1.3\n         + CASE WHEN range % 3 = 0 THEN 0.7 ELSE -0.35 END AS y,\n       (range % 3)::TINYINT AS g\nFROM range(${n})`;
        ctx.$("[data-code]").innerHTML = hl(sql);
        const t0 = performance.now();
        const t = await conn.query(sql);
        const qMs = since(t0);
        if (!ctx.active || my !== seq) return;
        const t1 = performance.now();
        const xs = t.getChild("x").toArray(), ys = t.getChild("y").toArray();
        const colMs = since(t1);
        const t2 = performance.now();
        let sum = 0;
        for (const r of t.toArray()) sum += r.x;
        const rowMs = since(t2);
        const S = 240, bins = new Uint32Array(S * S);
        let top = 0;
        for (let i = 0; i < xs.length; i++) {
          const bx = Math.floor(((xs[i] + 3) / 6) * S), by = Math.floor(((3 - ys[i]) / 6) * S);
          if (bx >= 0 && bx < S && by >= 0 && by < S) top = Math.max(top, ++bins[by * S + bx]);
        }
        const img = g.createImageData(S, S), lt = Math.log(top + 1);
        for (let i = 0; i < bins.length; i++) {
          const k = Math.log(bins[i] + 1) / lt;
          img.data[i * 4] = 14 + 241 * k; img.data[i * 4 + 1] = 16 + 224 * Math.pow(k, 1.4); img.data[i * 4 + 2] = 19 + 60 * k * k; img.data[i * 4 + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        ctx.$("[data-shape]").textContent = `${fmt(t.numRows)} 列 × ${t.numCols} 欄`;
        ctx.$("[data-acc]").innerHTML = `<div><span>查詢＋傳回</span><b>${fmtMs(qMs)}</b></div><div><span>取欄 toArray()</span><b>${fmtMs(colMs)}</b></div><div><span>逐列轉物件</span><b class="slow">${fmtMs(rowMs)}</b></div>`;
        ctx.$("[data-kv]").innerHTML = t.schema.fields.map((f) => `<span>${esc(f.name)}</span><b>${esc(String(f.type))}・${t.getChild(f.name).toArray().constructor.name}</b>`).join("")
          + `<span>record batch</span><b>${fmt(t.batches.length)} 批</b><span>x 欄記憶體</span><b>${bytes(xs.byteLength)}</b><span>平均 x</span><b>${(sum / n).toFixed(4)}</b>`;
        ctx.$("[data-ms]").innerHTML = `逐列慢 <b>${(rowMs / Math.max(colMs, 0.01)).toFixed(0)}</b> 倍`;
      }
      ctx.group(SIZES.map((n) => `${fmtCompact(n)} 點`), 1, (i) => draw(SIZES[i]));
      await draw(SIZES[1]);
    },
  },
  {
    id: "prepared", title: "預備陳述式",
    api: "conn.prepare(sql) → stmt.query(...params)",
    desc: "30 萬筆示意銷售資料，SQL 只解析一次，之後每次拖動滑桿或換區域，只把新的參數送進 Worker 執行。參數是綁定的值不是字串拼接，所以帶引號的惡意輸入不會改變 SQL 結構；也可以實測 200 次預備陳述式與每次組字串的耗時。",
    hint: "拖動金額門檻或換區域；按「注入測試」看綁定參數的效果",
    async mount(ctx) {
      ctx.html(`<div class="dk-board">
        <section class="dk-panel"><header><h3>各品類營收<small data-sub></small></h3><span class="dk-chip" data-ms></span></header><div class="dk-bars" data-bars></div>
          <pre class="dk-code dk-hide-narrow" data-code></pre></section>
        <section class="dk-panel"><header><h3>參數綁定與效能</h3></header><div class="dk-kv" data-kv></div><div class="dk-bars" data-cmp></div><div class="dk-note" data-inj></div></section></div>`);
      ctx.controls.classList.add("bottom");
      const { conn, st } = await openDuck(ctx);
      await conn.query(salesSql(300000));
      const SQL = "SELECT category AS 品類, count(*) AS 筆數, round(sum(amount)) AS 營收\nFROM sales\nWHERE region = ? AND amount >= ?\nGROUP BY category\nORDER BY 營收 DESC";
      const stmt = await conn.prepare(SQL);
      const countStmt = await conn.prepare("SELECT count(*) AS n FROM sales WHERE region = ? AND amount >= ?");
      ctx.onCleanup(() => { stmt.close().catch(() => {}); countStmt.close().catch(() => {}); });
      st.done();
      ctx.$("[data-code]").innerHTML = hl(SQL);
      let region = "北部", min = 300, calls = 0, seq = 0;
      async function query() {
        const my = ++seq;
        const t0 = performance.now();
        const t = await stmt.query(region, min);
        const ms = since(t0);
        if (!ctx.active || my !== seq) return;
        calls++;
        const data = rows(t), top = Math.max(1, ...data.map((r) => r.營收));
        ctx.$("[data-bars]").innerHTML = data.length ? data.map((r, i) => `<div><span>${esc(r.品類)}</span><i class="${i === 0 ? "hot" : ""}" style="width:${(r.營收 / top) * 100}%"></i><small>${fmt(r.營收)}</small></div>`).join("") : '<div class="dk-empty">沒有符合的資料</div>';
        ctx.$("[data-sub]").textContent = `${region}・金額 ≥ ${fmt(min)}`;
        ctx.$("[data-ms]").innerHTML = `<b>${fmtMs(ms)}</b>`;
        ctx.$("[data-kv]").innerHTML = `<span>參數 1（region）</span><b>${esc(sqlStr(region))}</b><span>參數 2（amount）</span><b>${fmt(min)}</b><span>同一個 stmt 已執行</span><b>${fmt(calls)} 次</b><span>SQL 解析</span><b>只在 prepare() 時一次</b>`;
      }
      ctx.select("區域", REGIONS, region, (v) => { region = v; query(); });
      ctx.slider("金額門檻", { min: 0, max: 1200, step: 50, value: min }, (v) => { min = +v; query(); });
      ctx.button("注入測試", async () => {
        const evil = "北部' OR '1'='1";
        const bound = rows(await countStmt.query(evil, 0))[0].n;
        const concat = rows(await conn.query(`SELECT count(*) AS n FROM sales WHERE region = '${evil}' AND amount >= 0`))[0].n;
        if (ctx.active) ctx.$("[data-inj]").innerHTML = `輸入 <code>${esc(evil)}</code>：綁定參數查到 <b>${fmt(bound)}</b> 列（沒有這個區域）；字串拼接查到 <b style="color:var(--c3)">${fmt(concat)}</b> 列（OR 讓條件失效）。`;
      });
      ctx.button("各跑 200 次", async () => {
        const ROUNDS = 200, cmp = ctx.$("[data-cmp]");
        cmp.innerHTML = '<div class="dk-empty">測試中…</div>';
        const t0 = performance.now();
        for (let i = 0; i < ROUNDS; i++) await countStmt.query(REGIONS[i % 5], i);
        const a = since(t0);
        const t1 = performance.now();
        for (let i = 0; i < ROUNDS; i++) await conn.query(`SELECT count(*) AS n FROM sales WHERE region = '${REGIONS[i % 5]}' AND amount >= ${i}`);
        const b = since(t1);
        if (!ctx.active) return;
        const top = Math.max(a, b);
        cmp.innerHTML = `<div><span>stmt.query</span><i class="hot" style="width:${(a / top) * 100}%"></i><small>${fmtMs(a)}</small></div><div><span>組字串 query</span><i style="width:${(b / top) * 100}%"></i><small>${fmtMs(b)}</small></div>`
          + `<div class="dk-note" style="display:block">每次都要經過 Worker 往返，差距主要來自省下的 SQL 解析與規劃。</div>`;
      });
      await query();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "SELECT … FROM range(N) GROUP BY …",
    desc: "用 range(N) 在 DuckDB 內即時產生 N 列，逐級從 100 萬加大到 10 億列，量測整個查詢（含 Worker 往返）的耗時與每秒處理列數。可切換「分組聚合」（1,000 組 count＋sum）或「掃描加總」（count＋sum），每級都核對回傳的列數是否等於 N。資料不落地，記憶體用量很小。",
    hint: "按「開始測試」；切換模式再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="dk-stress"><section class="dk-panel"><header><h3>每級結果<small>count 必須等於 N</small></h3></header>
        <pre class="dk-code" data-code></pre><div class="dk-scroll" data-rows><div class="dk-empty">尚未開始</div></div>
        <div class="dk-note">WebAssembly 版預設單執行緒，數字代表單核表現；瀏覽器分頁的記憶體上限約 3 GB。</div></section></div>`);
      ctx.controls.classList.add("bottom");
      const { conn, st } = await openDuck(ctx);
      st.done();
      let grouped = true;
      const results = [];
      const sqlOf = (n) => grouped
        ? `SELECT count(*) AS groups, sum(c) AS rows FROM (\n  SELECT range % 1000 AS k, count(*) AS c, sum((range * 7919) % 10007) AS s\n  FROM range(${n}) GROUP BY k)`
        : `SELECT count(*) AS rows, sum(range) AS s FROM range(${n})`;
      const paintSql = () => { ctx.$("[data-code]").innerHTML = hl(sqlOf("N")); };
      const paint = () => {
        ctx.$("[data-rows]").innerHTML = `<table class="dk-t"><thead><tr><th>列數 N</th><th>模式</th><th>耗時</th><th>列/秒</th><th>核對</th></tr></thead><tbody>${results.map((r) =>
          `<tr><td class="n">${fmtCompact(r.n)}</td><td>${r.mode}</td><td class="n">${fmtMs(r.ms)}</td><td class="n">${fmtCompact(r.n / (r.ms / 1000))}</td><td style="color:${r.ok ? "var(--c4)" : "var(--c3)"}">${r.ok ? "相符" : "不符"}</td></tr>`).join("")}</tbody></table>`;
      };
      ctx.group(["分組聚合", "掃描加總"], 0, (i) => { grouped = i === 0; paintSql(); });
      paintSql();
      ctx.bench({
        label: "列數", unit: "列", sizes: [1e6, 1e7, 5e7, 1e8, 3e8, 1e9], budget: 5000, target: 1500,
        async run(n) {
          try {
            const t0 = performance.now();
            const r = rows(await conn.query(sqlOf(n)))[0];
            const ms = since(t0);
            const ok = r.rows === n;
            results.push({ n, ms, ok, mode: grouped ? "分組" : "掃描" });
            if (ctx.active) paint();
            return `${fmtCompact(n / (ms / 1000))} 列/秒`;
          } catch (e) {
            return `錯誤：${e.message.split("\n")[0]}`;
          }
        },
        note: "range() 由引擎內部產生資料，不經過 JS，所以量到的是 DuckDB 的向量化執行速度；超過 5 秒的級距之後會略過。",
      });
    },
  },
] });
</script>
</body>
</html>
