<style>

<script src="https://cdn.jsdelivr.net/npm/easeljs@1.0.2/lib/easeljs.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// EaselJS showcase: eight scenes from the original solar system to a Shape / Sprite / StageGL stress ramp.
const cj = createjs;
const rootCss = getComputedStyle(document.documentElement);
const cssVar = (name, fallback) => rootCss.getPropertyValue(name).trim() || fallback;
const C = {
  c1: cssVar("--c1", "#f7df1e"), c2: cssVar("--c2", "#4cc9f0"), c3: cssVar("--c3", "#f72585"),
  c4: cssVar("--c4", "#7bd389"), c5: cssVar("--c5", "#ff8c42"), c6: cssVar("--c6", "#9d8cff"),
};
const COLORS = [C.c1, C.c2, C.c3, C.c4, C.c5, C.c6];
const FONT = "'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif";
const MONO = "Consolas, 'JetBrains Mono', monospace";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const fmtN = (n) => n.toLocaleString("en-US");
const DPR = () => Math.min(2, window.devicePixelRatio || 1);
// Y just below the top-right control cluster, so scene content starts under the buttons.
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;
const PHOTO = (i) => `_shared/img/photo-${i}.jpg`;

// Hit tests and mouse-over read back single pixels; a willReadFrequently context keeps that path fast and quiet.
// OffscreenCanvas instead of a DOM canvas: once a Sprite's canvas has been drawn into a willReadFrequently DOM
// canvas, Chromium can return stale pixels on later reads, so clicks land on the wrong object in other scenes.
{
  const hit = typeof OffscreenCanvas === "function" ? new OffscreenCanvas(1, 1)
    : Object.assign(document.createElement("canvas"), { width: 1, height: 1 });
  cj.DisplayObject._hitTestCanvas = hit;
  cj.DisplayObject._hitTestContext = hit.getContext("2d", { willReadFrequently: true });
}
cj.Ticker.timingMode = cj.Ticker.RAF;

function canvas2d(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  return c;
}
// Canvas whose 2D context is set up for getImageData; pixel filters run on it when used as a cacheCanvas.
function readbackCanvas() {
  const c = document.createElement("canvas");
  c.getContext("2d", { willReadFrequently: true });
  return c;
}
// Status line in the bottom-left corner; returns a setter that takes HTML.
function readout(ctx, cls = "", parent = ctx.el) {
  const el = document.createElement("div");
  el.className = `readout ${cls}`.trim();
  parent.append(el);
  const set = (html) => { el.innerHTML = html; };
  set.el = el;
  return set;
}
// Global Ticker listener that is removed when the scene unmounts.
function onTick(ctx, fn) {
  cj.Ticker.addEventListener("tick", fn);
  ctx.onCleanup(() => cj.Ticker.removeEventListener("tick", fn));
}
const measureCtx = document.createElement("canvas").getContext("2d");
// EaselJS Text wraps only at spaces, so Chinese text gets explicit line breaks measured here.
function wrapCJK(text, font, width) {
  measureCtx.font = font;
  const lines = [];
  let line = "";
  for (const ch of text) {
    if (line && !"，。、：；）›".includes(ch) && measureCtx.measureText(line + ch).width > width) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines.join("\n");
}
const countTree = (o) => 1 + (o.children ? o.children.reduce((n, c) => n + countTree(c), 0) : 0);
function pathOf(o) {
  const names = [];
  for (let p = o; p; p = p.parent) names.unshift(p.name || "（未命名）");
  return names.join(" › ");
}
function ball(colors, size) {
  const s = new cj.Shape();
  const ratios = colors.map((c, i) => i / (colors.length - 1));
  s.graphics.rf(colors, ratios, -size * 0.35, -size * 0.35, 0, 0, 0, size).dc(0, 0, size);
  return s;
}

// Stage (or StageGL) that fills `box` at device resolution. A 2D stage is scaled by dpr; StageGL ignores the
// stage transform, so GL content goes into `root`, a container scaled by dpr. dispose() is safe to call twice.
function stageIn(ctx, box, { gl = false, over = 0, touch = false } = {}) {
  const canvas = document.createElement("canvas");
  box.append(canvas);
  const stage = gl ? new cj.StageGL(canvas, { antialias: false, transparent: true }) : new cj.Stage(canvas);
  stage.name = "stage";
  const root = gl ? stage.addChild(new cj.Container()) : stage;
  if (over) stage.enableMouseOver(over);
  if (touch && cj.Touch.isSupported()) cj.Touch.enable(stage);
  const size = { w: 0, h: 0, r: 1 };
  const sizeFns = [];
  const fit = () => {
    const r = DPR(), w = Math.max(1, box.clientWidth), h = Math.max(1, box.clientHeight);
    if (w === size.w && h === size.h && r === size.r) return false;
    size.w = w; size.h = h; size.r = r;
    canvas.width = Math.round(w * r); canvas.height = Math.round(h * r);
    canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
    root.scaleX = root.scaleY = r;
    if (gl) stage.updateViewport(canvas.width, canvas.height);
    return true;
  };
  fit();
  let pending = 0, gone = false;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => { if (ctx.active && !gone && fit()) sizeFns.forEach((fn) => fn(size.w, size.h)); });
  });
  ro.observe(box);
  const dispose = () => {
    if (gone) return;
    gone = true;
    ro.disconnect();
    cancelAnimationFrame(pending);
    stage.enableMouseOver(0);
    if (stage.__touch) cj.Touch.disable(stage);
    stage.enableDOMEvents(false);
    if (gl) canvas.getContext("webgl")?.getExtension("WEBGL_lose_context")?.loseContext();
    canvas.remove();
  };
  ctx.onCleanup(dispose);
  return { stage, root, canvas, size, dispose, onSize: (fn) => sizeFns.push(fn) };
}

// Graphics command classes (Graphics.PolyStar, Graphics.Fill, ...) mapped back to their names for display.
const CMD_NAMES = new Map(Object.entries(cj.Graphics)
  .filter(([, v]) => typeof v === "function" && v.prototype && typeof v.prototype.exec === "function")
  .map(([k, v]) => [v, k]));
function fmtVal(v) {
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : v.toFixed(1);
  if (typeof v === "string") return `"${v}"`;
  if (Array.isArray(v)) return `[${v.map(fmtVal).join(", ")}]`;
  if (v && v.props) return v.props.type === "bitmap" ? "點陣圖樣" : `${v.props.type} 漸層 ${v.props.colors.length} 色`;
  if (v instanceof cj.Matrix2D) return "Matrix2D";
  return String(v);
}
function fmtCmd(cmd) {
  const args = Object.entries(cmd).filter(([k, v]) => k !== "path" && v != null && typeof v !== "function").map(([k, v]) => `${k} ${fmtVal(v)}`);
  return `<b>${CMD_NAMES.get(cmd.constructor) || "?"}</b>(${args.join(", ")})`;
}

// 192 x 32 strip with six coloured bunnies for the Sprite stress modes.
function bunnyAtlas() {
  const blob = (g, x, y, rx, ry, rot) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); };
  return canvas2d(192, 32, (g) => {
    for (let i = 0; i < 6; i++) {
      const x = i * 32 + 16;
      g.fillStyle = COLORS[i];
      blob(g, x - 4, 9, 2.6, 7, -0.15);
      blob(g, x + 3, 8, 2.6, 7, 0.2);
      blob(g, x, 23, 9, 7.5, 0);
      blob(g, x + 1, 16, 6, 6, 0);
      g.fillStyle = "#0e1013";
      blob(g, x + 3, 15, 1.3, 1.3, 0);
    }
  });
}
// The same bunny as vector Graphics, registration point at the feet like the sprite frames.
function bunnyGraphics(color) {
  return new cj.Graphics().f(color).de(-6.6, -30, 5.2, 14).de(0.4, -31, 5.2, 14).de(-9, -16.5, 18, 15).de(-5, -22, 12, 12)
    .f("#0e1013").de(1.7, -18.3, 2.6, 2.6);
}

const TILT = 0.58;
const PLANETS = [
  { name: "水星", r: 0.2, size: 5, colors: ["#e8e2d6", "#9a8f80"], period: 88, dist: "0.39 AU", fact: "白天約 430°C，夜晚降到零下 180°C。" },
  { name: "金星", r: 0.32, size: 8, colors: ["#ffe7a8", "#d49a3a"], period: 225, dist: "0.72 AU", fact: "自轉方向和多數行星相反。" },
  { name: "地球", r: 0.46, size: 9, colors: ["#9be7ff", "#1d6fd1"], period: 365, dist: "1 AU", fact: "目前已知唯一有生命的星球。", moon: true },
  { name: "火星", r: 0.6, size: 7, colors: ["#ffb38a", "#c2452d"], period: 687, dist: "1.52 AU", fact: "有太陽系最高的火山：奧林帕斯山。" },
  { name: "木星", r: 0.78, size: 17, colors: ["#ffe2bf", "#c98b4f"], period: 4333, dist: "5.2 AU", fact: "大紅斑是一個比地球還大的風暴。", bands: true },
  { name: "土星", r: 0.96, size: 13, colors: ["#fff1c4", "#d6b16a"], period: 10759, dist: "9.5 AU", fact: "平均密度比水還低。", ring: true },
];
const SUN = { name: "太陽", colors: ["#fffbe0", "#f7df1e", "#ff8c42"], period: 0, dist: "太陽系中心", fact: "質量約佔整個太陽系的 99.8%。" };
const MOON = { name: "月球", colors: ["#ffffff", "#9aa0aa"], period: 27.3, dist: "距地球約 38 萬公里", fact: "地球唯一的天然衛星，總是同一面朝向地球。" };

Showcase.run({ scenes: [
  {
    id: "solar", title: "太陽系",
    api: "Container 巢狀・rotation 帶動子物件・Shadow・cache()・rollover／click・localToLocal()",
    desc: "Flash 風的互動課件：每顆行星放在會旋轉的「軌道」Container 裡，父容器一轉，行星、標籤、衛星全部跟著走；點選天體，小卡顯示它在顯示清單裡的真實路徑。",
    hint: "滑過行星放大・點擊行星或月球看小卡・開「座標軸」、關「反向旋轉」看父容器怎麼帶動子物件",
    mount(ctx) {
      ctx.el.classList.add("space");
      ctx.html(`<div class="ez"></div>`);
      let speed = 1, showLabels = true, showAxes = false, counter = true, selected = null;
      let bodies = [], axes = [], moonPivot = null, moonHolder = null, card = null, selRing = null, nodes = 0;
      ctx.group(["慢速", "正常", "快轉"], 1, (i) => { speed = [0.3, 1, 4][i]; });
      ctx.toggle("名稱", true, (v) => { showLabels = v; bodies.forEach((b) => { if (b.label) b.label.visible = v; }); });
      ctx.toggle("座標軸", false, (v) => { showAxes = v; axes.forEach((a) => { a.visible = v; }); });
      ctx.toggle("反向旋轉", true, (v) => { counter = v; });
      const { stage, size, onSize } = stageIn(ctx, ctx.$(".ez"), { over: 20, touch: true });
      const show = readout(ctx);

      const named = (o, name) => { o.name = name; return o; };
      function label(text, r) {
        const t = new cj.Text(text, `bold 12px ${FONT}`, "#e8e8ea");
        t.textAlign = "center"; t.textBaseline = "top"; t.mouseEnabled = false;
        // Canvas shadows ignore the transform, so blur and offset are given in device pixels.
        t.shadow = new cj.Shadow("rgba(0,0,0,0.8)", 0, r, 3 * r);
        return t;
      }
      function hoverable(target, rec) {
        target.cursor = "pointer";
        target.on("rollover", () => { rec.hover = 1; });
        target.on("rollout", () => { rec.hover = 0; });
        target.on("click", () => select(rec));
      }
      // Arm along the orbit container's x axis (rotates with it) plus upright axes on the planet holder.
      function addAxes(pivot, holder, len, size) {
        const arm = new cj.Shape(), ax = new cj.Shape();
        arm.graphics.ss(1.2).sd([4, 4]).s("rgba(247,223,30,0.6)").mt(0, 0).lt(len, 0);
        ax.graphics.ss(1.5).s(C.c3).mt(0, 0).lt(size + 12, 0).s(C.c4).mt(0, 0).lt(0, -size - 12);
        arm.visible = ax.visible = showAxes;
        arm.mouseEnabled = ax.mouseEnabled = false;
        pivot.addChildAt(arm, 0);
        holder.addChild(ax);
        axes.push(arm, ax);
      }

      function build() {
        stage.removeAllChildren();
        bodies = []; axes = []; moonPivot = null;
        const { w, h, r } = size, narrow = w < 560;
        const stars = named(new cj.Shape(), "星空");
        for (let i = 0; i < 220; i++) {
          stars.graphics.f(`rgba(255,255,255,${(0.25 + Math.random() * 0.6).toFixed(2)})`).dc(Math.random() * w, Math.random() * h, Math.random() < 0.08 ? 1.4 : 0.7);
        }
        // 220 circles become one bitmap, so the starfield costs a single drawImage per frame.
        stars.cache(0, 0, w, h, r);
        stage.addChild(stars);

        const top = narrow ? belowControls(ctx) + 150 : 0;
        const R = narrow ? Math.min(w * 0.41, ((h - top - 56) / (TILT * 2)) * 0.96) : Math.min(w * 0.47, ((h - 120) / (TILT * 2)) * 0.96);
        const k = clamp(R / 300, 0.75, 1.35);
        const system = named(new cj.Container(), "太陽系");
        system.x = w / 2;
        system.y = narrow ? top + (h - top - 56) / 2 : h * 0.53;
        stage.addChild(system);

        // Orbit rings live in a squashed shape so they read as a tilted plane.
        const orbits = named(new cj.Shape(), "軌道線");
        orbits.scaleY = TILT;
        for (const p of PLANETS) orbits.graphics.ss((1 / TILT) * 0.8).sd([4, 6]).s("rgba(157,140,255,0.35)").dc(0, 0, p.r * R).es();
        system.addChild(orbits);

        const sunGroup = named(new cj.Container(), "太陽");
        const sunR = 26 * k;
        for (let i = 4; i >= 1; i--) {
          const glow = new cj.Shape();
          glow.graphics.f(`rgba(255,170,60,${0.05 * (5 - i)})`).dc(0, 0, sunR * (1 + i * 0.35));
          sunGroup.addChild(glow);
        }
        const sunBody = named(ball(SUN.colors, sunR), "球體");
        sunBody.shadow = new cj.Shadow("#ff8c42", 0, 0, 30 * r);
        sunGroup.addChild(sunBody);
        const sunRec = { data: SUN, body: sunBody, hover: 0, scale: 1, size: sunR };
        hoverable(sunGroup, sunRec);
        system.addChild(sunGroup);

        for (const p of PLANETS) {
          // plane squashes, pivot rotates, holder undoes both so the planet stays round and upright.
          const plane = named(new cj.Container(), `${p.name}軌道面`);
          plane.scaleY = TILT;
          const pivot = named(new cj.Container(), `${p.name}軌道`);
          pivot.rotation = Math.random() * 360;
          const holder = named(new cj.Container(), p.name);
          holder.x = p.r * R;
          holder.scaleY = 1 / TILT;
          const sz = p.size * k;
          if (p.ring) {
            const back = named(new cj.Shape(), "土星環後");
            back.graphics.ss(3 * k).s("rgba(240,220,170,0.55)").de(-sz * 2.1, -sz * 0.55, sz * 4.2, sz * 1.1);
            back.rotation = -18;
            holder.addChild(back);
          }
          const body = named(ball(p.colors, sz), "球體");
          body.shadow = new cj.Shadow(p.colors[1], 0, 0, 12 * r);
          holder.addChild(body);
          if (p.bands) {
            const bands = named(new cj.Shape(), "雲帶");
            bands.graphics.f("rgba(150,90,50,0.35)").r(-sz, -sz * 0.35, sz * 2, sz * 0.18).r(-sz, sz * 0.15, sz * 2, sz * 0.14)
              .f("rgba(200,80,60,0.7)").de(sz * 0.15, sz * 0.32, sz * 0.42, sz * 0.22);
            const m = new cj.Shape();
            m.graphics.f("#000").dc(0, 0, sz);
            bands.mask = m;
            bands.mouseEnabled = false;
            holder.addChild(bands);
          }
          if (p.ring) {
            const front = named(new cj.Shape(), "土星環前");
            front.graphics.ss(3 * k).s("rgba(255,236,190,0.85)").a(0, 0, sz * 2.1, 0, Math.PI);
            front.scaleY = 0.26;
            front.rotation = -18;
            holder.addChild(front);
          }
          const lbl = label(p.name, r);
          lbl.y = sz + 5;
          holder.addChild(lbl);
          const rec = { data: p, pivot, holder, body, label: lbl, hover: 0, scale: 1, size: sz, omega: 0.9 * Math.pow(365 / p.period, 0.55) };
          hoverable(body, rec);
          addAxes(pivot, holder, p.r * R, sz);

          if (p.moon) {
            const moonPlane = named(new cj.Container(), "月球軌道面");
            moonPlane.scaleY = TILT;
            moonPivot = named(new cj.Container(), "月球軌道");
            const ring = new cj.Shape();
            ring.graphics.ss(1).s("rgba(255,255,255,0.18)").dc(0, 0, sz * 2.4);
            moonPlane.addChild(ring);
            moonHolder = named(new cj.Container(), "月球");
            moonHolder.x = sz * 2.4;
            moonHolder.scaleY = 1 / TILT;
            const moonSize = Math.max(2.5, sz * 0.32);
            const moonBody = named(ball(MOON.colors, moonSize), "球體");
            moonHolder.addChild(moonBody);

        }
      }
      function rebuild() {
        const n = items.length || 500;
        if (view) view.dispose();
        items = [];
        view = stageIn(ctx, box, { gl: mode === 2 });
        // Pure rendering: no Ticker-driven children and no pointer hit tests.
        view.stage.tickOnUpdate = false;
        view.stage.enableDOMEvents(false);
        setCount(n);
      }
      rebuild();

      ctx.raf((t, dt) => {
        const W = view.size.w, H = view.size.h, k = dt / 16.7, n = items.length;
        const t0 = performance.now();
        for (let i = 0; i < n; i++) {
          let x = bx[i] + bvx[i] * k, y = by[i] + bvy[i] * k;
          bvy[i] += 0.75 * k;
          if (x > W) { bvx[i] = -Math.abs(bvx[i]); x = W; } else if (x < 0) { bvx[i] = Math.abs(bvx[i]); x = 0; }
          if (y > H) { bvy[i] *= -0.85; y = H; if (Math.random() > 0.5) bvy[i] -= Math.random() * 6; } else if (y < 0) { bvy[i] = 0; y = 0; }
          bx[i] = x; by[i] = y;
          const o = items[i];
          o.x = x; o.y = y;
        }
        const t1 = performance.now();
        view.stage.update();
        const t2 = performance.now();
        upd += (t1 - t0 - upd) * 0.1;
        drw += (t2 - t1 - drw) * 0.1;
      });
      ctx.ramp({
        label: "兔子", unit: "隻", steps: [500, 1000, 2500, 5000, 10000, 20000, 50000, 100000], minFps: 30,
        apply: setCount,
        metrics: () => ({
          更新: `${upd.toFixed(1)} ms`,
          繪製: `${drw.toFixed(1)} ms`,
          模式: MODES[mode],
          渲染器: view.stage.isWebGL ? "WebGL" : "Canvas 2D",
        }),
        note: "每格先用 JavaScript 更新所有兔子的位置（更新），再呼叫一次 stage.update()（繪製），兩段分開計時，並關掉 tickOnUpdate 省下逐一 tick 子物件的成本。Shape 向量模式每隻兔子每格都要重播一次 Graphics 路徑；Canvas 2D 的 Sprite 每隻是一次 drawImage；StageGL 把 Sprite 合併成少量 WebGL 繪製呼叫，但只能畫 Bitmap、Sprite 與已快取的物件。繪製時間量的是 CPU 送出指令的時間，GPU 是非同步執行，實際瓶頸也可能在顯示卡。",
      });
    },
  },
] });
</script>
</body>
</html>
