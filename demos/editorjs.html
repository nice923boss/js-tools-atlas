<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor.js 示範：區塊式編輯與即時 JSON 輸出</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app {
    position: fixed; inset: 0; padding: 12px 12px 44px;
    display: grid; gap: 10px 12px;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 40%);
    grid-template-rows: auto minmax(0, 1fr);
  }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; }
  header h1 small { color: var(--muted); font-weight: 500; margin-left: 6px; }
  header .sp { flex: 1; }
  .chip {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; white-space: nowrap;
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
    border: 1px solid var(--line); color: var(--muted); background: var(--bg-2);
  }
  .chip.on { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
  .btn.sm { padding: 6px 10px; font-size: 12px; white-space: nowrap; }

  /* Editor card */
  .card {
    min-height: 0; min-width: 0; display: flex; flex-direction: column;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  .ins {
    flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted);
  }
  .ins .btn { padding: 5px 9px; font-size: 12px; background: var(--bg); }
  #scroller { flex: 1; min-height: 0; overflow: auto; position: relative; padding: 10px 6px 16px 18px; }
  /* Tool styles are injected at runtime after this sheet, so overrides are scoped with #editor */
  #editor { font: 14.5px/1.6 var(--font); color: var(--fg); }
  #editor .codex-editor__redactor { padding-bottom: 40px !important; }
  #editor .ce-block__content, #editor .ce-toolbar__content { max-width: none; }
  #editor .ce-header { padding: .5em 0 .2em; margin: 0; line-height: 1.35; }
  #editor h2.ce-header { font-size: 1.45em; }
  #editor h3.ce-header { font-size: 1.2em; }
  #editor h4.ce-header { font-size: 1.05em; }
  #editor .ce-paragraph { line-height: 1.7; }
  #editor .cdx-quote__text { min-height: 0; margin-bottom: 6px; }
  #editor .ce-code__textarea { font-family: var(--mono); font-size: 12.5px; min-height: 0; background: #f8f7f3; }
  #editor .inline-code { font-family: var(--mono); }
  .flash-ov {
    position: absolute; pointer-events: none; border-radius: 6px; opacity: 0;
    background: rgba(226, 196, 0, .32); mix-blend-mode: multiply;
  }

  /* Output panel */
  .out {
    min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 8px;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px;
  }
  .sec-h { display: flex; align-items: baseline; gap: 8px; font-size: 12px; flex: none; }
  .sec-h b { font-size: 12.5px; }
  .sec-h .muted { margin-left: auto; }
  .box { flex: none; border: 1px solid var(--line); border-radius: 8px; background: #fbfaf7; padding: 4px 8px; display: flex; }
  #events { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 0; font-size: 11.5px; line-height: 1.55; height: calc(4 * 1.55em); overflow: hidden; }
  #events li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 4px; }
  #events li.fresh { animation: flash 1s ease-out; }
  #events .empty { color: var(--muted); }
  @keyframes flash { from { background: rgba(226, 196, 0, .35); } to { background: transparent; } }
  .ev { display: inline-block; min-width: 96px; font-family: var(--mono); font-size: 11px; font-weight: 700; }
  .ev.block-added { color: #1f8a4c; } .ev.block-changed { color: #1f6fb8; }
  .ev.block-removed { color: #d61f69; } .ev.block-moved { color: #6a5ae0; }
  #json {
    flex: 1; min-height: 0; overflow: auto; margin: 0; position: relative;
    font: 11.5px/1.55 var(--mono); color: #3a3935;
  }
  #json .line { white-space: pre; }
  .blk {
    position: relative; margin: 2px 0 2px 14px; padding: 3px 6px 3px 8px; border-left: 3px solid var(--line);
    border-radius: 0 6px 6px 0; white-space: pre-wrap; word-break: break-all; transition: background .2s, border-color .2s;
  }
  .blk.cur { background: rgba(226, 196, 0, .16); border-left-color: var(--accent); }
  .blk .tag {
    float: right; margin: 0 0 2px 6px; font: 700 10px/1.6 var(--font); padding: 0 6px; border-radius: 4px;
    background: #efede6; color: #6d6b64;
  }
  .blk.cur .tag { background: var(--accent); color: var(--accent-ink); }
  .stats { flex: none; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
  .stats b { color: var(--fg); font-weight: 600; }
  .k { color: #8a5a00; } .k-type { color: #d61f69; font-weight: 700; } .k-id { color: #9b998f; }
  .s { color: #1f6f3c; } .n { color: #c2410c; } .l { color: #6a5ae0; }

  @media (max-width: 640px) {
    .app { padding: 8px; gap: 8px; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1.3fr) minmax(0, 1fr); }
    header h1 small { display: none; }
    header h1 { font-size: 14px; }
    .hint { display: none; }
    .ins { padding: 5px 8px; gap: 4px; }
    .ins .lbl { display: none; }
    .ins .btn { padding: 5px 7px; }
    #scroller { padding: 6px 8px 10px 10px; }
    .out { padding: 6px 10px 8px; gap: 6px; }
    .sec-h { display: none; }
    #events { height: calc(2 * 1.55em); }
    .blk { margin-left: 6px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <header>
    <h1>Editor.js 區塊編輯器<small>save() 即時輸出 JSON</small></h1>
    <span class="sp"></span>
    <span class="chip" id="mode">載入中</span>
    <button class="btn sm" id="replay" type="button">重播示範</button>
  </header>

  <div class="card">
    <div class="ins" id="ins">
      <span class="lbl">插入區塊：</span>
      <button class="btn" type="button" data-add="header">＋標題</button>
      <button class="btn" type="button" data-add="todo">＋待辦</button>
      <button class="btn" type="button" data-add="quote">＋引言</button>
      <button class="btn" type="button" data-add="table">＋表格</button>
    </div>
    <div id="scroller"><div id="editor"></div></div>
  </div>

  <section class="out">
    <div class="sec-h"><b>onChange 事件</b><span class="muted" id="evCount">0 次</span></div>
    <div class="box"><ol id="events"><li class="empty">等待編輯…</li></ol></div>
    <div class="sec-h"><b>await editor.save()</b><span class="muted">目前區塊以黃色標示</span></div>
    <div id="json"></div>
    <div class="stats" id="stats">載入中…</div>
  </section>
</div>
<div class="hint">點任一區塊即可對照右側 JSON，空白行按 / 叫出工具箱</div>

<script src="https://cdn.jsdelivr.net/npm/@editorjs/editorjs@2.31.7/dist/editorjs.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/header@2.8.9/dist/header.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2.0.9/dist/editorjs-list.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2.7.6/dist/quote.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@2.9.4/dist/code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1.4.2/dist/delimiter.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.6/dist/table.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@1.5.2/dist/inline-code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@1.4.0/dist/marker.umd.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const scroller = $('#scroller'), jsonEl = $('#json'), statsEl = $('#stats');
  const eventsEl = $('#events'), evCountEl = $('#evCount'), modeEl = $('#mode');
  // Highlight overlay lives outside the editor holder so it never triggers block mutations
  const flashEl = document.createElement('div');
  flashEl.className = 'flash-ov';
  scroller.appendChild(flashEl);

  // Sample document (示意資料)
  const INITIAL = {
    blocks: [
      { id: 'title', type: 'header', data: { text: '社區讀書會籌備筆記', level: 2 } },
      { id: 'intro', type: 'paragraph', data: { text: '本月主題是<b>台灣文學</b>，地點在<mark class="cdx-marker">永康街</mark>社區活動中心，預計 <code class="inline-code">20</code> 人參加（示意資料）。' } },
      { id: 'todo', type: 'list', data: { style: 'checklist', meta: {}, items: [
        { content: '借用場地', meta: { checked: true }, items: [] },
        { content: '準備茶點', meta: { checked: false }, items: [] },
        { content: '寄出邀請', meta: { checked: false }, items: [] },
      ] } },
      { id: 'motto', type: 'quote', data: { text: '讀一本書，就像和作者長談一個下午。', caption: '讀書會口號', alignment: 'left' } },
      { id: 'line', type: 'delimiter', data: {} },
      { id: 'agenda', type: 'table', data: { withHeadings: true, stretched: false, content: [['時間', '內容'], ['14:00', '導讀《台北人》'], ['15:00', '分組討論']] } },
      { id: 'books', type: 'code', data: { code: 'const 書單 = ["台北人", "千江有水千江月"];' } },
    ],
  };
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const editor = new EditorJS({
    holder: 'editor',
    data: clone(INITIAL),
    minHeight: 40,
    placeholder: '輸入文字，或按 / 插入區塊',
    tools: {
      header: { class: Header, inlineToolbar: true, config: { levels: [2, 3, 4], defaultLevel: 3, placeholder: '輸入標題' } },
      list: { class: EditorjsList, inlineToolbar: true, config: { defaultStyle: 'unordered' } },
      quote: { class: Quote, inlineToolbar: true, config: { quotePlaceholder: '輸入引言', captionPlaceholder: '出處' } },
      code: { class: CodeTool, config: { placeholder: '輸入程式碼' } },
      delimiter: Delimiter,
      table: { class: Table, inlineToolbar: true, config: { rows: 2, cols: 2, withHeadings: true } },
      marker: { class: Marker, shortcut: 'CMD+SHIFT+M' },
      inlineCode: { class: InlineCode, shortcut: 'CMD+SHIFT+C' },
    },
    i18n: {
      messages: {
        ui: {
          blockTunes: { toggler: { 'Click to tune': '點擊調整', 'or drag to move': '或拖曳移動' } },
          inlineToolbar: { converter: { 'Convert to': '轉換為' } },
          toolbar: { toolbox: { Add: '新增區塊' } },
          popover: { Filter: '篩選', 'Nothing found': '找不到符合的項目', 'Convert to': '轉換為' },
        },
        toolNames: {
          Text: '段落', Heading: '標題', 'Unordered List': '項目清單', 'Ordered List': '編號清單',
          Checklist: '核取清單', Quote: '引言', Code: '程式碼', Delimiter: '分隔線', Table: '表格',
          Link: '連結', Bold: '粗體', Italic: '斜體', Marker: '螢光筆', InlineCode: '行內程式碼',
        },
        tools: {
          link: { 'Add a link': '輸入連結' },
          stub: { 'The block can not be displayed correctly.': '此區塊無法正確顯示。' },
          header: { 'Heading 2': '標題 2', 'Heading 3': '標題 3', 'Heading 4': '標題 4' },
          list: {
            Unordered: '項目清單', Ordered: '編號清單', Checklist: '核取清單', 'Counter type': '編號樣式',
            'Start with': '起始數字', Numeric: '數字', 'Lower Roman': '小寫羅馬', 'Upper Roman': '大寫羅馬',
            'Lower Alpha': '小寫字母', 'Upper Alpha': '大寫字母',
          },
          quote: { 'Align Left': '靠左對齊', 'Align Center': '置中對齊' },
          table: {
            'Add column to left': '左側插入欄', 'Add column to right': '右側插入欄', 'Add row above': '上方插入列',
            'Add row below': '下方插入列', 'Delete column': '刪除此欄', 'Delete row': '刪除此列',
            Heading: '標題列', Stretch: '滿版', Collapse: '取消滿版', 'With headings': '含標題列', 'Without headings': '不含標題列',
          },
        },
        blockTunes: {
          delete: { Delete: '刪除', 'Click to delete': '再點一次確認刪除' },
          moveUp: { 'Move up': '上移' },
          moveDown: { 'Move down': '下移' },
        },
      },
    },
    onChange: (_api, event) => {
      [].concat(event).forEach(logEvent);
      sync();
    },
  });

  /* ---------- rendering ---------- */
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const TOK = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g;
  function colorJSON(s) {
    let out = '', last = 0, m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(s))) {
      out += esc(s.slice(last, m.index));
      if (m[1] && m[2]) {
        const k = m[1].slice(1, -1);
        out += `<span class="k${k === 'type' ? ' k-type' : k === 'id' ? ' k-id' : ''}">${esc(m[1])}</span>${m[2]}`;
      } else if (m[1]) out += `<span class="s">${esc(m[1])}</span>`;
      else if (m[3]) out += `<span class="l">${m[3]}</span>`;
      else out += `<span class="n">${m[4]}</span>`;
      last = TOK.lastIndex;
    }
    return out + esc(s.slice(last));
  }

  let curIndex = -1;
  function render(data, ms) {
    const head = `{\n  ${colorJSON(`"time": ${data.time}`)},\n  ${colorJSON(`"version": "${data.version}"`)},\n  ${colorJSON('"blocks": [')}`;
    const blocks = data.blocks.map((b, i) =>
      `<div class="blk${i === curIndex ? ' cur' : ''}" data-i="${i}"><span class="tag">#${i} ${esc(b.type)}</span>${colorJSON(JSON.stringify(b))}${i < data.blocks.length - 1 ? ',' : ''}</div>`).join('');
    jsonEl.innerHTML = `<div class="line">${head}</div>${blocks}<div class="line">  ]\n}</div>`;
    const kb = (new Blob([JSON.stringify(data)]).size / 1024).toFixed(1);
    statsEl.innerHTML = `<b>${data.blocks.length}</b> 個區塊・JSON <b>${kb}</b> KB・save() 耗時 <b>${ms.toFixed(1)}</b> ms`;
    revealCurrent();
  }

  function revealCurrent() {
    jsonEl.querySelectorAll('.blk').forEach((el) => el.classList.toggle('cur', Number(el.dataset.i) === curIndex));
    const el = jsonEl.querySelector('.blk.cur');
    if (!el) return;
    const top = el.offsetTop, bottom = top + el.offsetHeight;
    if (top < jsonEl.scrollTop || bottom > jsonEl.scrollTop + jsonEl.clientHeight) {
      jsonEl.scrollTo({ top: Math.max(0, top - 24), behavior: 'smooth' });
    }
  }

  function setCurrent(i) {
    if (i === curIndex) return;
    curIndex = i;
    revealCurrent();
  }

  // Coalesce save() calls: at most one in flight, rerun once if changes arrived meanwhile
  let saving = false, again = false;
  async function sync() {
    if (saving) { again = true; return; }
    saving = true;
    try {
      do {
        again = false;
        const t0 = performance.now();
        const data = await editor.save();
        render(data, performance.now() - t0);
      } while (again);
    } catch (err) {
      statsEl.textContent = '儲存失敗：' + err.message;
      console.error(err);
    } finally {
      saving = false;
    }
  }

  let evCount = 0;
  function logEvent(ev) {
    const d = ev.detail || {};
    const target = d.target;
    const idx = typeof d.index === 'number' ? d.index : typeof d.toIndex === 'number' ? d.toIndex : -1;
    const where = typeof d.fromIndex === 'number' ? `#${d.fromIndex} → #${d.toIndex}` : `#${idx}`;
    evCount += 1;
    evCountEl.textContent = evCount + ' 次';
    const li = document.createElement('li');
    li.className = 'fresh';
    li.innerHTML = `<span class="ev ${esc(ev.type)}">${esc(ev.type)}</span>${esc(target ? target.name : '')} <span class="muted">${where}</span>`;
    eventsEl.querySelector('.empty')?.remove();
    eventsEl.prepend(li);
    while (eventsEl.children.length > 12) eventsEl.lastElementChild.remove();
    if (idx >= 0 && ev.type !== 'block-removed') setCurrent(idx);
  }

  // Follow the caret: highlight the block being edited
  document.addEventListener('selectionchange', () => {
    if (!editorReady) return;
    const i = editor.blocks.getCurrentBlockIndex();
    if (i >= 0) setCurrent(i);
  });

  function flashBlock(i) {
    requestAnimationFrame(() => {
      const b = editor.blocks.getBlockByIndex(i);
      if (!b) return;
      const content = b.holder.querySelector('.ce-block__content') || b.holder;
      const r = content.getBoundingClientRect(), s = scroller.getBoundingClientRect();
      Object.assign(flashEl.style, {
        top: (r.top - s.top + scroller.scrollTop - 3) + 'px', left: (r.left - s.left + scroller.scrollLeft - 6) + 'px',
        width: (r.width + 12) + 'px', height: (r.height + 6) + 'px',
      });
      flashEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1200, easing: 'ease-out' });
      // Scroll inside the card only (never scrollIntoView, which can move the embedding page)
      if (r.top < s.top + 8 || r.bottom > s.bottom - 8) {
        scroller.scrollTo({ top: scroller.scrollTop + (r.top - s.top) - 30, behavior: 'smooth' });
      }
    });
  }

  /* ---------- scripted API tour ---------- */
  let editorReady = false, tourId = 0, touring = false;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  function setMode(text, on) { modeEl.textContent = text; modeEl.classList.toggle('on', on); }
  function stopTour() {
    if (!touring) return;
    touring = false; tourId += 1;
    setMode('手動編輯', false);
  }
  const indexOf = (id) => editor.blocks.getBlockIndex(id);

  async function runTour() {
    const my = ++tourId;
    const alive = () => my === tourId;
    touring = true;
    setMode('API 示範中', true);
    let noteId = null;
    const steps = [
      async () => {
        const at = indexOf('intro') + 1;
        noteId = editor.blocks.insert('paragraph', { text: '' }, {}, at, false).id;
        flashBlock(at);
        const text = '報名請洽里辦公室，額滿為止。';
        for (let n = 1; n <= text.length; n++) {
          if (!alive()) return false;
          await editor.blocks.update(noteId, { text: text.slice(0, n) });
          await sleep(80);
        }
        return true;
      },
      async () => {
        await editor.blocks.update(noteId, { text: '報名請洽<mark class="cdx-marker">里辦公室</mark>，<b>額滿為止</b>。' });
        flashBlock(indexOf(noteId));
        return true;
      },
      async () => {
        const data = clone(INITIAL.blocks[2].data);
        data.items[1].meta.checked = true;
        await editor.blocks.update('todo', data);
        flashBlock(indexOf('todo'));
        return true;
      },
      async () => {
        const data = clone(INITIAL.blocks[5].data);
        data.content.push(['16:00', '交流茶會']);
        await editor.blocks.update('agenda', data);
        flashBlock(indexOf('agenda'));
        return true;
      },
      async () => {
        const at = indexOf('agenda');
        editor.blocks.insert('header', { text: '活動流程', level: 3 }, {}, at, false);
        flashBlock(at);
        return true;
      },
      async () => {
        const from = indexOf('motto');
        editor.blocks.move(1, from);
        flashBlock(1);
        return true;
      },
    ];
    await sleep(400);
    for (const step of steps) {
      if (!alive() || !(await step())) return;
      await sleep(750);
    }
    if (!alive()) return;
    touring = false;
    setMode('示範完成', false);
  }

  /* ---------- insert buttons (user actions) ---------- */
  const PRESETS = {
    header: ['header', { text: '新的段落標題', level: 3 }],
    todo: ['list', { style: 'checklist', meta: {}, items: [{ content: '新的待辦事項', meta: { checked: false }, items: [] }] }],
    quote: ['quote', { text: '在這裡寫下一句話', caption: '出處', alignment: 'left' }],
    table: ['table', { withHeadings: true, stretched: false, content: [['項目', '負責人'], ['場地', '里長']] }],
  };
  $('#ins').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-add]');
    if (!btn || !editorReady) return;
    stopTour();
    const [type, data] = PRESETS[btn.dataset.add];
    const cur = editor.blocks.getCurrentBlockIndex();
    const at = cur >= 0 ? cur + 1 : editor.blocks.getBlocksCount();
    editor.blocks.insert(type, clone(data), {}, at, false);
    editor.caret.setToBlock(at, 'end');
    flashBlock(at);
    setCurrent(at);
  });

  $('.card').addEventListener('pointerdown', (e) => { if (!e.target.closest('#ins')) stopTour(); });
  $('.card').addEventListener('keydown', stopTour);
  $('#replay').addEventListener('click', async () => {
    if (!editorReady) return;
    stopTour();
    await editor.render(clone(INITIAL));
    scroller.scrollTop = 0;
    curIndex = -1;
    evCount = 0;
    evCountEl.textContent = '0 次';
    eventsEl.innerHTML = '<li class="empty">等待編輯…</li>';
    await sync();
    runTour();
  });

  editor.isReady.then(async () => {
    editorReady = true;
    await sync();
    runTour();
  }).catch((err) => {
    setMode('載入失敗', false);
    statsEl.textContent = 'Editor.js 初始化失敗：' + err.message;
    console.error(err);
  });
})();
</script>
</body>
</html>
