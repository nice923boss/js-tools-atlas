<style>

<script src="_shared/showcase.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@editorjs/list@2.0.9/dist/editorjs-list.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/quote@2.7.6/dist/quote.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/code@2.9.4/dist/code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/delimiter@1.4.2/dist/delimiter.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/table@2.4.6/dist/table.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/warning@1.4.1/dist/warning.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/simple-image@1.6.0/dist/simple-image.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/inline-code@1.5.2/dist/inline-code.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@editorjs/marker@1.4.0/dist/marker.umd.js"></script>
<script>
(() => {
  const { h, fmt } = Showcase;
  const clone = (o) => structuredClone(o);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const quiet = (p) => p.catch((e) => { if (e.name !== "AbortError") console.error(e); });
  const aborted = () => new DOMException("scene left", "AbortError");

  // ---------- custom block tool (scene 5) ----------
  const STAR = '<svg width="17" height="17" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';
  class RatingTool {
    static get toolbox() { return { title: "評分", icon: STAR }; }
    static get isReadOnlySupported() { return true; }
    constructor({ data, readOnly, block }) {
      this.data = { label: data.label || "", score: data.score ?? 3, max: data.max === 10 ? 10 : 5 };
      this.readOnly = readOnly;
      this.block = block;
    }
    render() {
      this.wrap = h("div", { class: "ej-rate" });
      this.label = h("div", { class: "ej-rate-label", "data-placeholder": "評分項目" });
      this.label.contentEditable = String(!this.readOnly);
      this.label.textContent = this.data.label;
      this.stars = h("div", { class: "ej-rate-stars" });
      this.num = h("span", { class: "ej-rate-n" });
      this.wrap.append(this.label, this.stars, this.num);
      this.paint();
      return this.wrap;
    }
    paint() {
      const { score, max } = this.data;
      this.stars.classList.toggle("ten", max === 10);
      this.stars.replaceChildren(...Array.from({ length: max }, (_, i) => {
        const b = h("button", { type: "button", class: i < score ? "on" : "", text: "★", "aria-label": `${i + 1} 分` });
        if (!this.readOnly) b.addEventListener("click", () => this.set(i + 1));
        return b;
      }));
      this.num.textContent = `${score} / ${max}`;
    }
    set(score) { this.data.score = score; this.paint(); this.block.dispatchChange(); }
    renderSettings() {
      return [5, 10].map((max) => ({
        icon: STAR, label: max === 5 ? "五星制" : "十分制", toggle: "max", isActive: this.data.max === max, closeOnActivate: true,
        onActivate: () => { this.data.score = Math.round((this.data.score * max) / this.data.max); this.data.max = max; this.paint(); this.block.dispatchChange(); },
      }));
    }
    save() { return { label: this.label.textContent.trim(), score: this.data.score, max: this.data.max }; }
    validate(d) { return d.score >= 0 && d.score <= d.max; }
  }

  // ---------- tools & i18n ----------
  const TOOLS = {
    header: { class: Header, inlineToolbar: true, config: { levels: [2, 3, 4], defaultLevel: 3, placeholder: "輸入標題" } },
    list: { class: EditorjsList, inlineToolbar: true, config: { defaultStyle: "unordered" } },
    quote: { class: Quote, inlineToolbar: true, config: { quotePlaceholder: "輸入引言", captionPlaceholder: "出處" } },
    code: { class: CodeTool, config: { placeholder: "輸入程式碼" } },
    delimiter: Delimiter,
    table: { class: Table, inlineToolbar: true, config: { rows: 2, cols: 2, withHeadings: true } },
    warning: { class: Warning, inlineToolbar: true, config: { titlePlaceholder: "標題", messagePlaceholder: "提醒內容" } },
    image: SimpleImage,
    rating: RatingTool,
    marker: { class: Marker, shortcut: "CMD+SHIFT+M" },
    inlineCode: { class: InlineCode, shortcut: "CMD+SHIFT+C" },
  };
  const ZH = {
    messages: {
      ui: {
        blockTunes: { toggler: { "Click to tune": "點擊調整", "or drag to move": "或拖曳移動" } },
        inlineToolbar: { converter: { "Convert to": "轉換為" } },
        toolbar: { toolbox: { Add: "新增區塊" } },
        popover: { Filter: "篩選", "Nothing found": "找不到符合的項目", "Convert to": "轉換為" },
      },
      toolNames: {
        Text: "段落", Heading: "標題", "Unordered List": "項目清單", "Ordered List": "編號清單", Checklist: "核取清單", Quote: "引言",
        Code: "程式碼", Delimiter: "分隔線", Table: "表格", Warning: "提醒框", Image: "圖片", Link: "連結", Bold: "粗體", Italic: "斜體",
        Marker: "螢光筆", InlineCode: "行內程式碼",
      },
      tools: {
        link: { "Add a link": "輸入連結" },
        stub: { "The block can not be displayed correctly.": "此區塊無法正確顯示。" },
        header: { "Heading 2": "標題 2", "Heading 3": "標題 3", "Heading 4": "標題 4" },
        list: { Unordered: "項目清單", Ordered: "編號清單", Checklist: "核取清單", "Counter type": "編號樣式", "Start with": "起始數字", Numeric: "數字" },
        quote: { "Align Left": "靠左對齊", "Align Center": "置中對齊" },
        table: {
          "Add column to left": "左側插入欄", "Add column to right": "右側插入欄", "Add row above": "上方插入列", "Add row below": "下方插入列",
          "Delete column": "刪除此欄", "Delete row": "刪除此列", "With headings": "含標題列", "Without headings": "不含標題列",
        },
      },
      blockTunes: { delete: { Delete: "刪除", "Click to delete": "再點一次確認刪除" }, moveUp: { "Move up": "上移" }, moveDown: { "Move down": "下移" } },
    },
  };
  // Each editor gets its own holder div so a pending destroy() never wipes a newer instance.
  function editorSlot(ctx, box) {
    let cur = null;
    const kill = () => {
      if (!cur) return;
      const { ed, holder } = cur;
      cur = null;
      holder.remove();
      ed.isReady.then(() => ed.destroy(), () => {});
    };
    ctx.onCleanup(kill);
    return async (opts) => {
      kill();
      const holder = h("div", { class: "ej-holder" });
      box.append(holder);
      // onChange is debounced inside Editor.js and can fire after destroy(); drop those late calls.
      const live = () => ctx.active && cur?.ed === ed;
      const onChange = opts.onChange && ((...a) => { if (live()) opts.onChange(...a); });
      const ed = new EditorJS({ holder, tools: TOOLS, i18n: ZH, logLevel: "ERROR", minHeight: 30, placeholder: "輸入文字，或按 Tab 叫出工具箱", ...opts, onChange });
      cur = { ed, holder };
      await ed.isReady;
      if (!ctx.active || cur?.ed !== ed) throw aborted();
      return ed;
    };
  }

  // ---------- rendering helpers ----------
  const TOK = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g;
  function colorJSON(s) {
    let out = "", last = 0, m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(s))) {
      out += esc(s.slice(last, m.index));
      if (m[1] && m[2]) { const k = m[1].slice(1, -1); out += `<span class="${k === "type" ? "ej-kt" : k === "id" ? "ej-ki" : "ej-k"}">${esc(m[1])}</span>${m[2]}`; }
      else if (m[1]) out += `<span class="ej-s">${esc(m[1])}</span>`;
      else if (m[3]) out += `<span class="ej-l">${m[3]}</span>`;
      else out += `<span class="ej-n">${m[4]}</span>`;
      last = TOK.lastIndex;
    }
    return out + esc(s.slice(last));
  }
  function blocksHTML(data, cur = -1) {
    const blocks = data.blocks.map((b, i) => `<div class="ej-blk${i === cur ? " cur" : ""}" data-i="${i}"><span class="tag">#${i} ${esc(b.type)}</span>${colorJSON(JSON.stringify(b))}</div>`).join("");
    return `${colorJSON(`{ "time": ${data.time}, "version": "${data.version}", "blocks": [`)}${blocks}]}`;
  }
  function reveal(box, i) {
    box.querySelectorAll(".ej-blk").forEach((el) => el.classList.toggle("cur", Number(el.dataset.i) === i));
    const el = box.querySelector(".ej-blk.cur");
    if (el && (el.offsetTop < box.scrollTop || el.offsetTop + el.offsetHeight > box.scrollTop + box.clientHeight)) box.scrollTo({ top: Math.max(0, el.offsetTop - 24), behavior: "smooth" });
  }
  // Highlight a block with an overlay that lives outside the holder (no block mutations).
  function flashBlock(scroll, ed, i) {
    let fl = scroll.querySelector(".ej-flash");
    if (!fl) { fl = h("div", { class: "ej-flash" }); scroll.append(fl); }
    requestAnimationFrame(() => {
      const b = ed.blocks?.getBlockByIndex(i);
      if (!b) return;
      const r = (b.holder.querySelector(".ce-block__content") || b.holder).getBoundingClientRect(), s = scroll.getBoundingClientRect();
      Object.assign(fl.style, { top: `${r.top - s.top + scroll.scrollTop - 3}px`, left: `${r.left - s.left + scroll.scrollLeft - 6}px`, width: `${r.width + 12}px`, height: `${r.height + 6}px` });
      fl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1200, easing: "ease-out" });
      if (r.top < s.top + 8 || r.bottom > s.bottom - 8) scroll.scrollTo({ top: scroll.scrollTop + (r.top - s.top) - 30, behavior: "smooth" });
    });
  }
  function logEvent(list, ev, max = 12) {
    const d = ev.detail || {};
    const where = typeof d.fromIndex === "number" ? `#${d.fromIndex} → #${d.toIndex}` : typeof d.index === "number" ? `#${d.index}` : "";
    const li = h("li", { class: "fresh" });
    li.innerHTML = `<span class="ej-ev ${esc(ev.type)}">${esc(ev.type)}</span>${esc(d.target?.name || "")} <span class="muted">${where}</span>`;
    list.querySelector(".muted:only-child")?.remove();
    list.prepend(li);
    while (list.children.length > max) list.lastElementChild.remove();
    return typeof d.toIndex === "number" ? d.toIndex : d.index ?? -1;
  }
  const kb = (data) => (new Blob([JSON.stringify(data)]).size / 1024).toFixed(1);
  const cardScene = (ctx, side, ins = "") => {
    ctx.html(`<div class="ej-board"><div class="ej-card">${ins}<div class="ej-scroll"></div></div><section class="ej-side">${side}</section></div>`);
    return ctx.$(".ej-scroll");
  };
  // Serialize save() calls: one in flight, rerun once if more changes arrived.
  function saver(ed, onData) {
    let busy = false, again = false;
    return async function sync() {
      if (busy) { again = true; return; }
      busy = true;
      try {
        do { again = false; if (typeof ed.save !== "function") return; const t0 = performance.now(); const data = await ed.save(); onData(data, performance.now() - t0); } while (again);
      } finally { busy = false; }
    };
  }

  // ---------- sample data (示意資料) ----------
  const IMG = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='640' height='160'><rect width='640' height='160' fill='#fff1a8'/><circle cx='560' cy='40' r='70' fill='#f7df1e'/><rect x='40' y='92' width='560' height='40' rx='8' fill='#1f8fb8' opacity='.85'/><text x='40' y='70' font-size='34' font-family='sans-serif' font-weight='700' fill='#1c1c1a'>秋季讀書會</text><text x='56' y='119' font-size='18' font-family='sans-serif' fill='#fff'>示意圖片（SVG data URL）</text></svg>");
  const BOOK = { blocks: [

    const STEPS = [
      ['insert("paragraph", data, {}, 2)', async () => { newId = ed.blocks.insert("paragraph", { text: "集合時間 8:30" }, {}, 2, false).id; return 2; }],
      ["update(id, data)", async () => { await ed.blocks.update(newId, { text: '集合時間 <b>8:00</b>（提早半小時）' }); return at(newId); }],
      ['convert(id, "header", { level: 3 })', async () => { const b = await ed.blocks.convert(newId, "header", { level: 3 }); newId = b.id; return at(newId); }],
      ['convert("c", "quote")', async () => { const b = await ed.blocks.convert("c", "quote"); return at(b.id); }],
      ['convert("a", "list")', async () => { const b = await ed.blocks.convert("a", "list"); return at(b.id); }],
      ["move(1, 3)", async () => { ed.blocks.move(1, 3); return 1; }],
      ["delete(4)", async () => { ed.blocks.delete(4); return -1; }],
      ["render(原始資料)", async () => { await ed.render(clone(API_DOC)); return -1; }],
    ];
    const rows = STEPS.map(([t]) => { const r = h("div", { class: "ej-step" }, h("span", { text: t }), h("div")); stepsEl.append(r); return r; });
    async function step() {
      if (busy) return;
      busy = true;
      try {
        if (k === 0) rows.forEach((r) => { r.className = "ej-step"; r.lastChild.innerHTML = ""; });
        rows.forEach((r, i) => (r.className = `ej-step ${i === k ? "on" : i < k ? "done" : ""}`));
        pending = [];
        const i = await STEPS[k][1]();
        if (i >= 0) flashBlock(scroll, ed, i);
        const row = rows[k];
        await ctx.sleep(450);
        row.lastChild.innerHTML = pending.map((ev) => `<span class="ej-chip ej-ev ${esc(ev.type)}">${esc(ev.type)}</span>`).join("") || '<span class="ej-chip">（沒有 onChange）</span>';
        k = (k + 1) % STEPS.length;
        cnt.textContent = `${ed.blocks.getBlocksCount()} 個區塊`;
      } finally { busy = false; }
    }
    ctx.button("下一步", () => { auto = false; quiet(step()); }, { primary: true });
    ctx.on(scroll, "pointerdown", () => { auto = false; }, true);
    await sync();
    cnt.textContent = `${ed.blocks.getBlocksCount()} 個區塊`;
    await ctx.sleep(900);
    while (auto) { await step(); await ctx.sleep(1500); }
  }

  // ---------- scene 7: stress ----------
  const SENT = ["今天人潮比上週多，下午三點最熱鬧。", "攤主反映電源不足，需要加裝延長線。", "雨備方案改到室內走廊，動線要重新規劃。", "志工排班表已更新，請大家確認時段。"];
  function bigData(n) {
    const blocks = [];
    for (let i = 0; i < n; i++) {
      if (i % 20 === 0) blocks.push({ type: "header", data: { text: `第 ${i / 20 + 1} 章・市集紀錄`, level: 3 } });
      else if (i % 7 === 3) blocks.push({ type: "list", data: { style: "unordered", meta: {}, items: [0, 1, 2].map((j) => ({ content: `項目 ${i}-${j}`, meta: {}, items: [] })) } });
      else if (i % 13 === 5) blocks.push({ type: "quote", data: { text: SENT[i % 4], caption: `第 ${i} 則`, alignment: "left" } });
      else blocks.push({ type: "paragraph", data: { text: `${i}. <b>紀錄</b>：${SENT[i % 4]}${i % 9 === 0 ? '<mark class="cdx-marker">（重點）</mark>' : ""}` } });
    }
    return { blocks };
  }
  async function sceneStress(ctx) {
    ctx.html(`<div class="ej-stress"><div class="ej-sbar">載入中…</div><div class="ej-card"><div class="ej-scroll"></div></div></div>`);
    ctx.controls.classList.add("bottom");
    const scroll = ctx.$(".ej-scroll"), sbar = ctx.$(".ej-sbar");
    let ed = null, last = "";
    const paint = () => { if (ed?.blocks) sbar.innerHTML = `目前文件：區塊 <b>${fmt(ed.blocks.getBlocksCount())}</b>・DOM 元素 <b>${fmt(scroll.getElementsByTagName("*").length)}</b>${last}`; };
    ctx.bench({
      label: "區塊數", unit: "塊", sizes: [100, 500, 1000, 2000, 5000, 10000], budget: 5000, target: 1000,
      note: "每一級產生 N 個區塊（段落含粗體與螢光筆、清單、引言、每 20 塊一個標題）。計時範圍是 render(data) 載入整份文件，再 save() 匯出 JSON；兩段各自的耗時寫在結果列後面。準備階段先 clear() 清空（不計時）。",
      async prepare(n) { await ed.clear(); await ctx.frame(1); return bigData(n); },
      async run(n, data) {
        const t0 = performance.now();
        await ed.render(data);
        void scroll.offsetHeight;
        const t1 = performance.now();
        const out = await ed.save();
        const t2 = performance.now();
        last = `・上一級 render <b>${(t1 - t0).toFixed(0)} ms</b>、save <b>${(t2 - t1).toFixed(0)} ms</b>（${kb(out)} KB）`;
        paint();
        return `render ${(t1 - t0).toFixed(0)}・save ${(t2 - t1).toFixed(0)}ms`;
      },
    });
    ed = await editorSlot(ctx, scroll)({ data: bigData(200) });
    paint();
    ctx.interval(paint, 1000);
  }

  const S = (id, title, api, desc, hint, mount, extra = {}) => ({ id, paper: true, title, api, desc, hint, mount: (ctx) => quiet(mount(ctx)), ...extra });
  Showcase.run({ scenes: [
    S("live", "即時 JSON", "new EditorJS({ holder, tools, onChange }); await editor.save()",
      "Editor.js 把文件存成區塊陣列，每個區塊是 { id, type, data }。左側的 API 示範與手動編輯都會觸發 onChange（block-added、block-changed…），右側即時呼叫 save() 輸出 JSON，並以黃色標示游標所在的區塊。",
      "點任一區塊對照右側 JSON；空白行按 Tab 叫出工具箱", sceneLive),
    S("tools", "區塊工具一覽", "tools: { header, list, quote, table, warning, image, … }",
      "每種區塊都是獨立的外掛工具：標題、圖片、清單（編號、核取）、提醒框、引言、分隔線、表格、程式碼，段落內還有粗體、螢光筆、行內程式碼等行內工具。右側列出各工具在 JSON 中的 data 欄位。",
      "選取段落文字會出現行內工具列", sceneTools),
    S("io", "save() 與 render()", "await editor.render({ blocks }); editor.blocks.renderFromHTML(html)",
      "save() 把畫面轉成 JSON，render() 把 JSON 載回編輯器；renderFromHTML() 則依各工具的 pasteConfig 把 HTML 標籤轉成區塊。右側 JSON 可以直接修改後重新載入，格式錯誤會顯示在下方。",
      "改右側 JSON 再按「render(JSON)」", sceneIO),
    S("ro", "唯讀與 i18n", "editor.readOnly.toggle(); new EditorJS({ i18n: { messages } })",
      "i18n 的 messages 物件翻譯工具名稱、工具箱、區塊設定與各工具的選項；切換到 English 時重建一個不帶 i18n 的編輯器作對照。唯讀模式由 readOnly.toggle() 切換，工具列與編輯都會停用。",
      "按「工具箱」與「區塊設定」比較兩種語系", sceneRO),
    S("custom", "自訂 Block Tool", "class RatingTool { static get toolbox(); render(); save(); renderSettings() }",
      "自訂區塊只要實作 render() 回傳 DOM、save() 回傳 data，再用 static toolbox 出現在工具箱。這個評分區塊的星星可以點選，renderSettings() 在區塊設定加入五星制與十分制切換，變更時用 block.dispatchChange() 通知 onChange。",
      "點星星改分數；按「插入評分區塊」新增一個", sceneCustom),
    S("api", "區塊 API 與轉換", "editor.blocks.insert / update / convert / move / delete",
      "Blocks API 可以在程式中插入、更新、搬移、刪除區塊；convert() 依各工具的 conversionConfig 把段落轉成標題、引言或清單（沒有 conversionConfig 的工具，例如提醒框，無法轉換）。每一步下方列出觸發的 onChange 事件類型。",
      "按「下一步」逐步執行", sceneAPI),
    S("stress", "極限測試", "await editor.render(bigData); await editor.save()",
      "逐級加大區塊數，量 render() 載入整份文件與 save() 匯出 JSON 的總耗時。",
      "按「開始測試」，滑過結果列看每秒處理量", sceneStress, { kind: "stress" }),
  ] });
})();
</script>
</body>
</html>
