<html lang="zh-Hant">
<head>

<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["視差輪播","對齊與 snap","拖曳物理","AutoHeight 與 ClassNames","Autoplay 與 AutoScroll","Fade 與垂直滾輪","縮圖同步與事件","極限測試"]}</script>
<style>
  .pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  /* Embla is headless: the only required CSS is overflow on the viewport and a flex container. */
  .ev { --gap: 12px; --size: 100%; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .ev .vp { flex: 1; min-height: 0; overflow: hidden; cursor: grab; }
  .ev .vp:active { cursor: grabbing; }
  .ev .ct { display: flex; height: 100%; touch-action: pan-y pinch-zoom; margin-left: calc(var(--gap) * -1); }
  .ev .sl { flex: 0 0 var(--size); min-width: 0; padding-left: var(--gap); height: 100%; }
  .card { position: relative; height: 100%; border-radius: 12px; overflow: hidden; background: #11141a; }
  .card img, .frame img, .ph4 img, .th img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; user-select: none; }
  .card .t { position: absolute; left: 8px; bottom: 8px; padding: 4px 7px; border-radius: 6px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 12px; white-space: nowrap; }
  .card .t i { font: 600 11px var(--mono); font-style: normal; color: var(--accent); margin-right: 5px; }
  .card .num { position: absolute; right: 10px; top: 6px; font: 800 26px var(--mono); color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
  .lab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .lab > span { overflow: hidden; text-overflow: ellipsis; }
  .lab code { font: 600 12px var(--mono); color: var(--fg); }
  .lab b { color: var(--accent); font-weight: 600; font-family: var(--mono); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips span { font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
  .chips span b { color: var(--fg); font-weight: 600; }
  .chips span.hit { animation: hit .6s ease-out; }
  @keyframes hit { from { background: var(--accent); color: var(--accent-ink); } }

  /* 1. parallax */
  .s1 { display: flex; flex-direction: column; gap: 10px; }
  .e1 { flex: 1; --size: 68%; --gap: 14px; }
  .frame { position: relative; height: 100%; margin: 0; border-radius: 20px; overflow: hidden; background: #000; will-change: transform; }
  .layer { position: relative; height: 100%; width: 100%; display: flex; justify-content: center; }
  .layer img { max-width: none; flex: 0 0 calc(130% + var(--gap) * 2); }
  .frame figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 18px 14px; background: linear-gradient(transparent, rgba(0, 0, 0, .75)); pointer-events: none; }
  .frame figcaption b { display: block; font-size: clamp(18px, 3vw, 28px); line-height: 1.2; }
  .frame figcaption small { font: 700 11px var(--mono); color: var(--accent); letter-spacing: .12em; }
  .track { width: min(60%, 360px); height: 3px; margin: 0 auto; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
  .track i { display: block; height: 100%; width: 22%; background: var(--c4); border-radius: 3px; }
  .foot { display: flex; align-items: center; justify-content: center; gap: 14px; flex: none; }
  .foot .btn.round { width: 36px; height: 36px; padding: 0; border-radius: 50%; font-size: 18px; }
  .dots { display: flex; gap: 8px; }
  .dots button { width: 10px; height: 10px; padding: 0; border-radius: 999px; border: 0; background: rgba(255, 255, 255, .28); cursor: pointer; transition: width .3s, background .3s; }
  .dots button.on { width: 26px; background: var(--accent); }

  /* 2. snaps */
  .s2 { display: flex; flex-direction: column; gap: 8px; }
  .e2 { flex: 1; --size: 38%; }
  .e2 .card::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--gc, transparent); }
  .ruler { position: relative; height: 34px; margin: 0 12px; flex: none; }
  .ruler .rail { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line); }
  .ticks span { position: absolute; top: 4px; width: 2px; height: 14px; margin-inline-start: -1px; background: var(--muted); }
  .ticks span b { position: absolute; top: 15px; left: -10px; width: 22px; text-align: center; font: 600 10px var(--mono); color: var(--muted); }
  .ticks span.on { background: var(--accent); }
  .ticks span.on b { color: var(--accent); }
  .ruler .cur { position: absolute; top: 5px; width: 12px; height: 12px; margin-inline-start: -6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(247, 223, 30, .25); }
  .reg { display: flex; flex-wrap: wrap; gap: 4px; font: 11px var(--mono); flex: none; }
  .reg span { padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); border-left: 4px solid var(--gc); color: var(--muted); }
  .reg span.k { border-left-width: 1px; border-style: dashed; }
  .reg span.on { color: var(--fg); background: rgba(255, 255, 255, .08); }

  /* 3. physics */
  .s3 { display: flex; flex-direction: column; gap: 8px; }
  .e3 { flex: 1; --size: 30%; --gap: 10px; }
  .plot { position: relative; height: 96px; flex: none; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .plot .pl { position: absolute; left: 8px; top: 6px; font: 500 10.5px var(--mono); color: var(--muted); display: flex; gap: 10px; }
  .plot .pl i { font-style: normal; }
  .plot .m1 { color: var(--c2); } .plot .m2 { color: var(--c5); } .plot .m3 { color: var(--c4); }

  /* 4. AutoHeight + ClassNames */
  .s4 { display: flex; flex-direction: column; gap: 8px; }
  .hw { flex: 1; min-height: 0; border: 1px dashed var(--line); border-radius: 12px; padding: 4px 0; overflow: hidden; }
  .e4 { --size: 44%; --gap: 10px; }
  .e4 .vp { flex: none; background: rgba(247, 223, 30, .07); }
  .e4 .ct { height: auto; align-items: flex-start; transition: height .35s ease; }
  .e4 .sl { height: auto; opacity: .3; transition: opacity .3s; }
  .e4 .sl.is-in-view { opacity: .7; }
  .e4 .sl.is-snapped { opacity: 1; }
  .card4 { display: flex; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--panel); border: 2px solid transparent; transition: border-color .3s, transform .2s; }
  .e4 .sl.is-snapped .card4 { border-color: var(--accent); }
  .e4 .vp.is-dragging .card4 { transform: scale(.96); }
  .ph4 { flex: 1; min-height: 0; }
  .card4 p { margin: 0; padding: 6px 10px; display: flex; justify-content: space-between; gap: 6px; font-size: 12px; white-space: nowrap; }
  .card4 p span { font-family: var(--mono); color: var(--muted); }
  .cls { display: flex; flex-wrap: wrap; gap: 4px; flex: none; }
  .cls span { font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
  .cls span.iv { border-color: var(--c4); color: var(--fg); }
  .cls span.sn { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  /* 5. Autoplay + AutoScroll */
  .s5 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.7fr) minmax(0, 1fr); }
  .e5a { flex: 1; --size: 40%; --gap: 10px; }
  .timer { height: 4px; flex: none; border-radius: 3px; background: var(--line); overflow: hidden; }
  .timer i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
  .e5b { flex: 1; --gap: 10px; }
  .e5b .sl { flex: 0 0 auto; display: flex; align-items: center; }
  .pill5 { padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--k); color: var(--k); font: 600 14px var(--mono); white-space: nowrap; background: var(--panel); }

  /* 6. Fade + vertical wheel */
  .s6 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }
  .e6a { flex: 1; --gap: 0px; }
  .e6a .sl { transform: translate3d(0, 0, 0); }
  .ops { display: flex; gap: 6px; height: 44px; flex: none; }
  .ops span { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .ops em { position: relative; flex: 1; width: 100%; border-radius: 4px; background: var(--line); overflow: hidden; }
  .ops i { position: absolute; inset: 0; background: var(--accent); transform-origin: bottom; transform: scaleY(0); }
  .ops b { font: 600 10px var(--mono); color: var(--muted); }
  .e6b { flex: 1; --gap: 10px; }
  .e6b .ct { flex-direction: column; margin-left: 0; margin-top: calc(var(--gap) * -1); touch-action: pan-x pinch-zoom; }
  .e6b .sl { flex: 0 0 58%; height: auto; padding-left: 0; padding-top: var(--gap); }

  /* 7. thumbs + events */
  .s7 { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 290px); }
  .mainc { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
  .e7m { flex: 1; --gap: 10px; }
  .e7t { flex: none; height: 64px; --size: 22%; --gap: 8px; }
  .th { display: block; width: 100%; height: 100%; padding: 0; border: 2px solid transparent; border-radius: 9px; overflow: hidden; opacity: .45; background: none; cursor: pointer; transition: opacity .25s, border-color .25s; }
  .e7t .sl.on .th { opacity: 1; border-color: var(--accent); }
  .log { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 8px; gap: 8px; }
  .log ol { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: hidden; font: 11px/1.55 var(--mono); }
  .log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .log li em { font-style: normal; color: var(--fg); }
  .log li .e1 { color: var(--c1); } .log li .e2 { color: var(--c2); } .log li .e3 { color: var(--c4); } .log li .e4 { color: var(--c5); } .log li .e5 { color: var(--c6); }

  /* 8. stress */
  .stress-vis { position: absolute; inset: 8px 8px 8px 350px; display: flex; flex-direction: column; gap: 8px; padding-bottom: var(--sc-ctl-b, 0px); overflow: hidden; }
  .stress-vis .sinfo { font-size: 12px; color: var(--muted); }
  .sgrid { flex: 1; min-height: 0; display: grid; gap: 4px; }
  .strip { position: relative; min-width: 0; min-height: 0; border-radius: 6px; overflow: hidden; background: var(--panel); }
  .strip .vp { position: absolute; inset: 0; overflow: hidden; }
  .strip .ct { display: flex; height: 100%; margin-left: -4px; }
  .strip .sl { flex: 0 0 34%; min-width: 0; padding-left: 4px; height: 100%; }
  .strip .sl b { display: flex; align-items: center; justify-content: center; height: 100%; border-radius: 4px; color: #0e1013; font: 700 12px var(--mono); overflow: hidden; }
  .strip .pb { position: absolute; left: 0; bottom: 0; width: 100%; height: 3px; background: #fff; opacity: .8; transform-origin: left; }
  .k0 { background: var(--c1); } .k1 { background: var(--c2); } .k2 { background: var(--c3); } .k3 { background: var(--c4); } .k4 { background: var(--c5); } .k5 { background: var(--c6); }

  @media (max-width: 760px) { .s7 { grid-template-columns: minmax(0, 1fr) minmax(0, 220px); } .ops { height: 32px; } }
  @media (max-width: 520px) {
    .s7 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); }
    .s6 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .e6b .sl { flex-basis: 70%; }
  }
  @media (max-width: 560px) {
    .e1 { --size: 80%; --gap: 10px; }
    .e2 { --size: 62%; }
    .e3 { --size: 46%; }
    .e4 { --size: 76%; }
    .e5a { --size: 70%; }
    .e7t { height: 48px; --size: 28%; --gap: 6px; }
    .plot { height: 76px; }
    .dots { gap: 5px; } .dots button { width: 8px; height: 8px; } .dots button.on { width: 18px; }
  }
  @media (max-width: 760px) { .stress-vis { inset: 8px; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/embla-carousel@8.6.0/embla-carousel.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/embla-carousel-autoplay@8.6.0/embla-carousel-autoplay.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/embla-carousel-auto-height@8.6.0/embla-carousel-auto-height.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/embla-carousel-class-names@8.6.0/embla-carousel-class-names.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/embla-carousel-fade@8.6.0/embla-carousel-fade.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/embla-carousel-auto-scroll@8.6.0/embla-carousel-auto-scroll.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/embla-carousel-wheel-gestures@8.1.0/dist/embla-carousel-wheel-gestures.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Embla 8: every scene builds its own carousels; make() registers destroy() for unmount.
const { fmt } = Showcase;
const PHOTOS = [["FJORD", "挪威峽灣"], ["CANYON", "紅岩峽谷"], ["VALLEY ROAD", "綠谷公路"], ["PUG", "披毯巴哥犬"],
  ["WATERFALL", "瀑布與彩虹"], ["JELLYFISH", "深海水母"], ["LIONESS", "母獅特寫"], ["WALRUS", "海象群"]];
const img = (i) => `<img src="_shared/img/photo-${(i % 8) + 1}.jpg" alt="${PHOTOS[i % 8][1]}" draggable="false">`;
const range = (n) => Array.from({ length: n }, (_, i) => i);
const wrap01 = (p) => ((p % 1) + 1) % 1;
const fmtOpt = (o) => `{ ${Object.entries(o).map(([k, v]) => `${k}: ${typeof v === "string" ? `"${v}"` : v}`).join(", ")} }`;
// Headless markup: root > viewport > container > slides. Styling is entirely ours.
const embla = (cls, slides) => `<div class="ev ${cls}"><div class="vp"><div class="ct">${slides}</div></div></div>`;
function make(ctx, root, options, plugins) {
  const api = EmblaCarousel(root.querySelector(".vp"), options, plugins);
  ctx.onCleanup(() => api.destroy());
  return api;
}
const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#fff";
// Drive Embla's real drag handler with synthetic mouse events spread over a few frames, so it measures a real velocity.
async function fling(ctx, api, dx) {
  const node = api.containerNode();
  const r = api.rootNode().getBoundingClientRect();
  let x = r.left + r.width / 2;
  const y = r.top + r.height / 2;
  const fire = (type, buttons) => node.dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, button: 0, buttons, bubbles: true, cancelable: true, view: window }));
  fire("mousedown", 1);
  for (let i = 0; i < 6 && ctx.active; i++) { await ctx.frame(); x += dx / 6; fire("mousemove", 1); }
  fire("mouseup", 0);
}

Showcase.run({ scenes: [
  {
    id: "parallax", title: "視差輪播",
    api: 'EmblaCarousel(viewport, { loop: true }, [Autoplay()])，on("scroll", tween)',
    desc: "Embla 不畫任何樣式，只回報 scrollProgress 與每張投影片的 snap 位置。這裡在每次 scroll 事件裡依距離算出圖層位移與縮放，做出視差與景深；Autoplay 外掛負責定時前進。",
    hint: "左右拖曳，圖片會比外框移動得慢；滑鼠停在輪播上會暫停自動播放",
    mount(ctx) {
      ctx.html(`<div class="pad s1">
        <div class="lab"><span>scrollProgress <b data-sp>0.000</b></span><span data-ap class="mono"></span></div>
        ${embla("e1", PHOTOS.map(([en, name], i) => `<div class="sl"><figure class="frame"><div class="layer">${img(i)}</div><figcaption><small>${en}</small><b>${name}</b></figcaption></figure></div>`).join(""))}
        <div class="track"><i></i></div>
        <div class="foot"><button class="btn round" type="button" data-prev aria-label="上一張">‹</button><div class="dots"></div><button class="btn round" type="button" data-next aria-label="下一張">›</button></div>
      </div>`);
      const api = make(ctx, ctx.$(".e1"), { loop: true }, [EmblaCarouselAutoplay({ delay: 3000, stopOnInteraction: false, stopOnMouseEnter: true })]);
      const frames = api.slideNodes().map((n) => n.querySelector(".frame"));
      const layers = api.slideNodes().map((n) => n.querySelector(".layer"));
      const opts = { parallax: true, scale: true };
      const spEl = ctx.$("[data-sp]"), bar = ctx.$(".track i");
      // Tween every slide from its distance to the current scroll progress (adapted from Embla's parallax example).
      const tween = (emblaApi, eventName) => {
        const engine = emblaApi.internalEngine();
        const progress = emblaApi.scrollProgress();
        const inView = emblaApi.slidesInView();
        const snaps = emblaApi.scrollSnapList();
        const n = snaps.length;
        snaps.forEach((snap, snapIndex) => {
          engine.slideRegistry[snapIndex].forEach((slideIndex) => {
            if (eventName === "scroll" && !inView.includes(slideIndex)) return;
            let diff = snap - progress;
            if (engine.options.loop) {
              engine.slideLooper.loopPoints.forEach((lp) => {
                const target = lp.target();
                if (slideIndex === lp.index && target !== 0) {
                  if (Math.sign(target) === -1) diff = snap - (1 + progress);
                  if (Math.sign(target) === 1) diff = snap + (1 - progress);
                }
              });
            }
            const dist = Math.min(Math.abs(diff * n), 1);
            layers[slideIndex].style.transform = opts.parallax ? `translateX(${diff * -0.2 * n * 100}%)` : "";
            frames[slideIndex].style.transformOrigin = diff > 0 ? "left center" : "right center";
            frames[slideIndex].style.transform = opts.scale ? `scale(${1 - dist * 0.2})` : "";
            frames[slideIndex].style.opacity = opts.scale ? 1 - dist * 0.45 : 1;
          });
        });
        spEl.textContent = wrap01(progress).toFixed(3);
        bar.style.transform = `translateX(${wrap01(progress) * 355}%)`;
      };
      api.on("reInit", tween).on("scroll", tween).on("slideFocus", tween);
      tween(api);
      const dots = ctx.$(".dots");
      dots.innerHTML = api.scrollSnapList().map((_, i) => `<button type="button" aria-label="第 ${i + 1} 張"></button>`).join("");
      const dotBtns = [...dots.children];
      dotBtns.forEach((b, i) => ctx.on(b, "click", () => api.scrollTo(i)));
      const markDot = () => dotBtns.forEach((b, i) => b.classList.toggle("on", i === api.selectedScrollSnap()));
      api.on("select", markDot).on("reInit", markDot);
      markDot();
      ctx.on(ctx.$("[data-prev]"), "click", () => api.scrollPrev());
      ctx.on(ctx.$("[data-next]"), "click", () => api.scrollNext());
      const ap = api.plugins().autoplay, apEl = ctx.$("[data-ap]");
      ctx.raf(() => {
        const t = ap.timeUntilNext();
        apEl.textContent = t == null ? "自動播放已停止" : `Autoplay 下一張 ${(Math.max(0, t) / 1000).toFixed(1)} 秒`;
      });
      ctx.toggle("視差", true, (v) => { opts.parallax = v; tween(api); });
      ctx.toggle("縮放", true, (v) => { opts.scale = v; tween(api); });
      const playBtn = ctx.toggle("自動播放", true, (v) => (v ? ap.play() : ap.stop()));
      api.on("autoplay:play", () => playBtn.setAttribute("aria-pressed", "true"));
      api.on("autoplay:stop", () => playBtn.setAttribute("aria-pressed", "false"));
    },
  },
  {
    id: "snaps", title: "對齊與 snap",
    api: 'reInit({ align: "start" | "center" | "end", containScroll, slidesToScroll, direction })',
    desc: "align 決定投影片停在視窗的哪裡，containScroll 決定兩端要不要裁掉多餘的 snap，slidesToScroll 把幾張分成一組。下方刻度是 scrollSnapList() 的實際值，色條是 slideRegistry 的分組。",
    hint: "切換 containScroll 看兩端 snap 被合併或保留；slidesToScroll 改成 2 或 auto 看分組",
    mount(ctx) {
      ctx.html(`<div class="pad s2">
        <div class="lab"><span data-ro></span></div>
        ${embla("e2", range(9).map((i) => `<div class="sl"><div class="card">${img(i)}<b class="num">${i + 1}</b></div></div>`).join(""))}
        <div class="ruler"><div class="rail"></div><div class="ticks"></div><i class="cur"></i></div>
        <div class="reg"></div>
      </div>`);
      const o = { align: "center", containScroll: "trimSnaps", slidesToScroll: 1, direction: "ltr" };
      const root = ctx.$(".e2"), ruler = ctx.$(".ruler");
      const api = make(ctx, root, { ...o });
      const ticks = ctx.$(".ticks"), cur = ctx.$(".cur"), reg = ctx.$(".reg"), ro = ctx.$("[data-ro]");
      const paint = () => {

      const apply = (n) => {
        while (live.length > n) { const { el, api } = live.pop(); api.destroy(); el.remove(); }
        while (live.length < n) add();
        layout(n);
        info.textContent = `${fmt(n)} 個輪播同時 AutoScroll，共 ${fmt(n * 6)} 張投影片，每個輪播每幀各自位移`;
      };
      ctx.onCleanup(() => live.splice(0).forEach(({ api }) => api.destroy()));
      ctx.onResize(() => layout(live.length));
      ctx.ramp({
        label: "同時捲動的輪播", unit: "個", steps: [4, 8, 16, 32, 64, 128, 256, 512],
        apply, metrics: () => ({ 投影片: live.length * 6 }),
        note: "每多一個輪播就多一組 requestAnimationFrame 迴圈與觀察器；版面改變時每個輪播都會自行 reInit。看 FPS 在哪一級掉到門檻以下。",
      });
    },
  },
] });
</script>
</body>
</html>
