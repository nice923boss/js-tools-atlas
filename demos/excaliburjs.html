<script src="https://cdn.jsdelivr.net/npm/excalibur@0.32.0/build/dist/excalibur.min.js"></script>

<script>
// Excalibur.js showcase: eight scenes from the original neon breakout to an Actor-count stress ramp.
const rootCss = getComputedStyle(document.documentElement);
const cssVar = (name, fallback) => rootCss.getPropertyValue(name).trim() || fallback;
const C = {
  c1: cssVar("--c1", "#f7df1e"), c2: cssVar("--c2", "#4cc9f0"), c3: cssVar("--c3", "#f72585"),
  c4: cssVar("--c4", "#7bd389"), c5: cssVar("--c5", "#ff8c42"), c6: cssVar("--c6", "#9d8cff"),
  fg: cssVar("--fg", "#ecebe6"), muted: cssVar("--muted", "#9b998f"),
};
const COLORS = [C.c1, C.c2, C.c3, C.c4, C.c5, C.c6];
const FONT = cssVar("--font", "sans-serif");
const MONO = cssVar("--mono", "monospace");
const DPR = Math.min(2, devicePixelRatio || 1);
const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const fmtN = (n) => Math.round(n).toLocaleString("en-US");
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
// Y just below the top-right control cluster, so scene content starts under the buttons.
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;
const PHOTO = (i) => `_shared/img/photo-${i}.jpg`;
const unmounted = () => new DOMException("Scene unmounted", "AbortError");
const hex = (s) => ex.Color.fromHex(s);
const vec = (x, y) => ex.vec(x, y);

function canvas2d(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  return c;
}
// Six shaded balls in one 96x16 strip.
function ballAtlas() {
  return canvas2d(96, 16, (g) => COLORS.forEach((c, i) => {
    const grd = g.createRadialGradient(i * 16 + 6, 6, 1, i * 16 + 8, 8, 8);
    grd.addColorStop(0, "#ffffff");
    grd.addColorStop(0.35, c);
    grd.addColorStop(1, c);
    g.fillStyle = grd;
    g.beginPath();
    g.arc(i * 16 + 8, 8, 7.5, 0, TAU);
    g.fill();
  }));
}
// Status line in the bottom-left corner; returns a setter that takes HTML.
function readout(ctx) {
  const el = document.createElement("div");
  el.className = "ex-readout";
  ctx.el.append(el);
  return (html) => { el.innerHTML = html; };
}
async function fontsReady(ctx) {
  await document.fonts.ready;
  if (!ctx.active) throw unmounted();
}
function font(size, color, { bold = false, mono = false, align = ex.TextAlign.Left, base = ex.BaseAlign.Alphabetic, shadow = false } = {}) {
  return new ex.Font({
    family: mono ? MONO : FONT, size, unit: ex.FontUnit.Px, color: hex(color), bold, textAlign: align, baseAlign: base,
    ...(shadow ? { shadow: { blur: 6, offset: vec(0, 2), color: ex.Color.fromRGB(0, 0, 0, 0.75) } } : {}),
  });
}
function label(scene, text, x, y, f, z = 10) {
  const l = new ex.Label({ text, pos: vec(x, y), font: f, z });
  scene.add(l);
  return l;
}
// Cached rounded pill with a glossy top band (the original breakout look).
function pill(w, h, color, r = 6) {
  return new ex.Canvas({
    width: w, height: h, cache: true, quality: DPR,
    draw: (g) => {
      g.fillStyle = color;
      g.beginPath(); g.roundRect(0, 0, w, h, r); g.fill();
      g.fillStyle = "rgba(255,255,255,.32)";
      g.beginPath(); g.roundRect(3, 2, w - 6, h * 0.36, r / 2); g.fill();
    },
  });
}
// Shaded disc with a dark spot, so rolling is visible.
function disc(r, color) {
  return new ex.Canvas({
    width: r * 2, height: r * 2, cache: true, quality: DPR,
    draw: (g) => {
      const grd = g.createRadialGradient(r * 0.7, r * 0.7, r * 0.1, r, r, r);
      grd.addColorStop(0, "#ffffff"); grd.addColorStop(0.35, color); grd.addColorStop(1, color);
      g.fillStyle = grd; g.beginPath(); g.arc(r, r, r - 0.5, 0, TAU); g.fill();
      g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.arc(r * 1.5, r, r * 0.2, 0, TAU); g.fill();
    },
  });
}
// Card background with optional decorations drawn in card-local pixels.
function panel(w, h, draw) {
  return new ex.Canvas({
    width: w, height: h, cache: true, quality: DPR,
    draw: (g) => {
      g.fillStyle = "rgba(255,255,255,.035)"; g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 1;
      g.beginPath(); g.roundRect(0.5, 0.5, w - 1, h - 1, 12); g.fill(); g.stroke();
      if (draw) draw(g);
    },
  });
}
// ScaleTo leaves a residual scale velocity behind, so zero it once the tween is done.
const settle = (a) => () => { a.get(ex.MotionComponent).scaleFactor = vec(0, 0); };
const fpsOf = (e) => Math.round(e.stats.currFrame.fps || 0);

// ---------- one Excalibur engine per scene ----------
// Each scene owns an Engine on its own canvas, sized to the box. A size change rebuilds it after a short
// debounce; on unmount the engine is disposed and its WebGL context released.
function engineIn(ctx, box, { options, build, start } = {}) {
  let engine = null, canvas = null, teardown = null, w0 = 0, h0 = 0, timer = 0;
  const size = () => [Math.max(1, Math.floor(box.clientWidth)), Math.max(1, Math.floor(box.clientHeight))];
  function dispose() {
    const e = engine;
    if (!e) return;
    engine = null;
    if (teardown) teardown();
    teardown = null;
    const gl = e.graphicsContext.__gl;
    e.stop();
    e.dispose();
    if (gl) gl.getExtension("WEBGL_lose_context")?.loseContext();
    canvas.remove();
  }
  function create() {
    dispose();
    const [w, h] = size();
    w0 = w; h0 = h;
    canvas = document.createElement("canvas");
    box.append(canvas);
    const e = new ex.Engine({
      canvasElement: canvas, width: w, height: h, displayMode: ex.DisplayMode.Fixed, pixelRatio: DPR,
      backgroundColor: ex.Color.Transparent, enableCanvasTransparency: true, antialiasing: true,
      suppressPlayButton: true, suppressConsoleBootMessage: true, grabWindowFocus: false,
      // the default handler reports a fatal error when dispose releases the context on purpose
      handleContextLost: () => {},
      ...(options ? options(w, h) : {}),
    });
    engine = e;
    teardown = build(e, w, h) || null;
    Promise.resolve(start ? start(e) : e.start()).catch((err) => { if (engine === e) console.error(err); });
    return e;
  }
  const ro = new ResizeObserver(() => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      if (!ctx.active || !engine) return;
      const [w, h] = size();
      if (w !== w0 || h !== h0) create();
    }, 200);
  });
  ro.observe(box);
  ctx.onCleanup(() => { ro.disconnect(); clearTimeout(timer); dispose(); });
  create();
  return { get engine() { return engine; }, rebuild: create };
}
// Smoothed frame timings from engine.stats (filled before "postframe" fires).
function frameStats(e) {
  const st = { upd: 0, drw: 0, dc: 0, contacts: 0 };
  e.on("postframe", () => {
    const f = e.stats.currFrame;
    st.upd += (f.duration.update - st.upd) * 0.1;
    st.drw += (f.duration.draw - st.drw) * 0.1;
    st.dc = f.graphics.drawCalls;
    st.contacts = f.physics.contacts.size;
  });
  return st;
}

// ---------- GLSL for scene 7 ----------
const MAT_HEAD = `#version 300 es
precision highp float;
uniform sampler2D u_graphic;
uniform float u_time_ms;
uniform float u_amt;
uniform vec2 u_size;
in vec2 v_uv;
out vec4 fragColor;
float seconds() { return mod(u_time_ms, 100000.0) * 0.001; }
`;
const MATERIALS = [
  { name: "波浪", api: "uv 正弦位移", src: `${MAT_HEAD}
void main() {
  float t = seconds();
  vec2 uv = v_uv;
  uv.x += sin(uv.y * 16.0 + t * 3.0) * 0.045 * u_amt;
  uv.y += cos(uv.x * 12.0 + t * 2.2) * 0.03 * u_amt;
  vec4 c = texture(u_graphic, clamp(uv, 0.0, 1.0));
  c.rgb *= c.a;
  fragColor = c;
}` },
  { name: "像素化", api: "u_size 對齊格子", src: `${MAT_HEAD}
void main() {
  vec2 cell = vec2(mix(1.0, 24.0, u_amt)) / max(u_size, vec2(1.0));
  vec2 uv = (floor(v_uv / cell) + 0.5) * cell;
  vec4 c = texture(u_graphic, u_amt < 0.02 ? v_uv : uv);
  c.rgb *= c.a;
  fragColor = c;
}` },
  { name: "色差掃光", api: "RGB 分離取樣", src: `${MAT_HEAD}
void main() {
  float t = seconds();
  float off = 0.014 * u_amt;
  vec4 c = texture(u_graphic, v_uv);
  float r = texture(u_graphic, clamp(v_uv + vec2(off, 0.0), 0.0, 1.0)).r;
  float b = texture(u_graphic, clamp(v_uv - vec2(off, 0.0), 0.0, 1.0)).b;
  float sweep = fract(t * 0.35) * 1.8 - 0.4;
  float band = smoothstep(0.12, 0.0, abs(v_uv.x + v_uv.y * 0.35 - sweep));
  vec3 col = vec3(r, c.g, b) + band * 0.4 * u_amt;
  fragColor = vec4(col * c.a, c.a);
}` },
  { name: "溶解", api: "雜訊 discard", src: `${MAT_HEAD}
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
}
void main() {
  float t = seconds();
  float n = noise(v_uv * 7.0) * 0.65 + noise(v_uv * 19.0) * 0.35;
  float th = (0.5 - 0.5 * cos(t * 0.9)) * u_amt * 1.05;
  if (n < th) discard;
  vec4 c = texture(u_graphic, v_uv);
  float edge = smoothstep(th + 0.07, th, n) * step(0.001, th);
  c.rgb = mix(c.rgb, vec3(1.0, 0.55, 0.26), edge);
  c.rgb *= c.a;
  fragColor = c;
}` },
];
const POST_HEAD = `#version 300 es
precision highp float;
uniform sampler2D u_image;
uniform vec2 u_resolution;
in vec2 v_uv;
out vec4 fragColor;
`;
const POSTS = [
  null,
  { name: "CRT", src: `${POST_HEAD}
void main() {
  vec2 cc = v_uv - 0.5;
  vec2 uv = 0.5 + cc * (1.0 + 0.14 * dot(cc, cc));
  vec4 c = texture(u_image, uv);
  c.rgb *= 0.8 + 0.2 * sin(uv.y * u_resolution.y * 1.5708);
  c.rgb *= 1.0 - 0.7 * dot(cc, cc);
  if (any(lessThan(uv, vec2(0.0))) || any(greaterThan(uv, vec2(1.0)))) c = vec4(0.0);
  fragColor = c;
}` },
  { name: "暈影", src: `${POST_HEAD}
void main() {
  vec4 c = texture(u_image, v_uv);
  float d = length((v_uv - 0.5) * vec2(u_resolution.x / max(u_resolution.y, 1.0), 1.0));
  c.rgb *= smoothstep(0.95, 0.3, d);
  c.rgb += vec3(0.05, 0.02, 0.0) * c.a;
  fragColor = c;
}` },
  { name: "灰階", src: `${POST_HEAD}
void main() {
  vec4 c = texture(u_image, v_uv);
  float l = dot(c.rgb, vec3(0.299, 0.587, 0.114));
  fragColor = vec4(vec3(l), c.a);
}` },
];
// A post processor wraps a ScreenShader; addPostProcessor() calls initialize() each time it is added.
function postProcessor(src) {
  return {
    shader: null,
    initialize(gc) { if (!this.shader) this.shader = new ex.ScreenShader(gc, src); },
    getShader() { return this.shader.getShader(); },
    getLayout() { return this.shader.getLayout(); },
  };
}

Showcase.run({ scenes: [
  {
    id: "breakout", title: "霓虹打磚塊",
    api: "new ex.Engine({ resolution, viewport })・ex.Actor + CollisionType・on('collisionstart')・actions.scaleTo().fade().die()・ParticleEmitter・camera.shake()",
    desc: "原版小遊戲：擋板、球和磚塊都是 Actor，球是 Passive 碰撞體，靠 collisionstart 事件判斷撞到誰，再依 mtv 決定反彈方向。磚塊破掉時用動作佇列放大、淡出再移除，同時噴粒子並讓攝影機震動。",
    hint: "滑鼠或手指移動擋板，← → 也可以・空白鍵或點擊發球",
    async mount(ctx) {
      ctx.el.classList.add("ex-neon");
      ctx.html(`<div class="ex-box ex-center"></div>
        <div class="ex-ov"><div class="ex-ov-card"><h1></h1><p class="sub"></p><p class="ex-blink"></p></div></div>`);
      await fontsReady(ctx);
      const box = ctx.$(".ex-box"), ov = ctx.$(".ex-ov");
      const overlay = (title, sub, go) => {
        ov.querySelector("h1").textContent = title;
        ov.querySelector(".sub").textContent = sub;
        ov.querySelector(".ex-blink").textContent = go;
        ov.classList.remove("hide");
      };
      let act = () => {};
      // clicks on the letterbox around the canvas also serve
      ctx.on(box, "pointerdown", (e) => { if (e.target === box) act(); });
      engineIn(ctx, box, {
        // portrait boxes get a taller board with fewer columns; the board is scaled to fit the box
        options: (bw, bh) => {
          const portrait = bh > bw * 1.1, W = portrait ? 480 : 720, H = portrait ? 700 : 480, z = Math.min(bw / W, bh / H);
          return { resolution: { width: W, height: H }, viewport: { width: Math.floor(W * z), height: Math.floor(H * z) }, pixelRatio: Math.min(3, DPR * Math.max(1, z)) };
        },
        build(game) {
          const { width: W, height: H } = game.screen.resolution;
          const PORTRAIT = H > W;
          const BRICKS = [C.c3, C.c5, C.c1, C.c4, C.c2, C.c6];
          const frame = new ex.Actor({ x: W / 2, y: H / 2, z: -5 });
          frame.graphics.use(new ex.Canvas({
            width: W, height: H, cache: true,
            draw: (g) => {
              g.strokeStyle = "rgba(76,201,240,.35)"; g.lineWidth = 3;
              g.beginPath(); g.roundRect(2, 2, W - 4, H + 40, 14); g.stroke();
            },
          }));
          game.add(frame);
          const paddle = new ex.Actor({ x: W / 2, y: H - (PORTRAIT ? 84 : 34), width: 112, height: 14, collisionType: ex.CollisionType.Fixed });
          paddle.graphics.use(pill(112, 14, C.c1, 7));
          game.add(paddle);
          const ball = new ex.Actor({ x: W / 2, y: H - 60, radius: 8, collisionType: ex.CollisionType.Passive });
          ball.graphics.use(new ex.Circle({ radius: 8, color: ex.Color.White }));
          game.add(ball);
          ball.addChild(new ex.ParticleEmitter({
            emitterType: ex.EmitterType.Circle, radius: 3, emitRate: 90, isEmitting: true,
            particle: { life: 320, minSpeed: 0, maxSpeed: 12, beginColor: hex(C.c2), endColor: hex(C.c6), startSize: 9, endSize: 1, fade: true, opacity: 0.6 },
          }));
          const burst = new ex.ParticleEmitter({
            emitterType: ex.EmitterType.Circle, radius: 14, isEmitting: false,
            particle: { life: 700, minSpeed: 60, maxSpeed: 260, startSize: 7, endSize: 1, fade: true, acc: vec(0, 500), beginColor: ex.Color.White, endColor: ex.Color.White },
          });
          game.add(burst);
          const scoreLabel = new ex.Label({ text: "", pos: vec(18, 30), font: font(18, C.c1, { bold: true }) });
          const livesLabel = new ex.Label({ text: "", pos: vec(W - 18, 30), font: font(18, C.c3, { bold: true, align: ex.TextAlign.Right }) });
          game.add(scoreLabel);
          game.add(livesLabel);

          let bricks = new Set();
          let mode = "demo"; // demo | ready | play | over
          let score = 0, lives = 3, level = 1, speed = 360, flipped = false, targetX = W / 2;
          function buildBricks() {
            for (const b of bricks) b.kill();
            bricks = new Set();
            const cols = PORTRAIT ? 7 : 10, rows = 6, gap = 6, bh = 20, bw = Math.floor((W - 40 - (cols - 1) * gap) / cols);
            const x0 = (W - (cols * bw + (cols - 1) * gap)) / 2 + bw / 2;
            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                const b = new ex.Actor({ x: x0 + c * (bw + gap), y: 70 + r * (bh + gap), width: bw, height: bh, collisionType: ex.CollisionType.Fixed });
                b.graphics.use(pill(bw, bh, BRICKS[r]));
                b.color0 = BRICKS[r];
                b.scale = vec(0.2, 0.2);
                b.actions.delay((r * cols + c) * 12).scaleTo({ scale: vec(1, 1), duration: 220 }).callMethod(settle(b));
                bricks.add(b);
                game.add(b);
              }
            }
          }
          function hud() {
            scoreLabel.text = mode === "demo" ? "展示模式" : `分數 ${score}　第 ${level} 關`;
            livesLabel.text = mode === "demo" ? "" : "♥".repeat(lives);
          }
          function serve() { ball.pos = vec(paddle.pos.x, paddle.pos.y - 22); ball.vel = vec(0, 0); }
          function launch() {
            const a = (Math.random() - 0.5) * 0.9;
            ball.vel = vec(Math.sin(a) * speed, -Math.cos(a) * speed);
          }
          function newGame() {
            score = 0; lives = 3; level = 1; speed = 360;
            buildBricks();
            mode = "ready";
            serve();
            ov.classList.add("hide");
            hud();
          }
          function action() {
            if (mode === "demo" || mode === "over") newGame();
            else if (mode === "ready") { mode = "play"; launch(); }
          }
          act = action;
          function breakBrick(b) {
            bricks.delete(b);
            b.body.collisionType = ex.CollisionType.PreventCollision;
            burst.pos = b.pos.clone();
            burst.particle.beginColor = hex(b.color0);
            burst.particle.endColor = hex(b.color0);
            burst.emitParticles(22);
            b.actions.clearActions();
            b.actions.scaleTo({ scale: vec(1.35, 1.6), duration: 70 }).callMethod(settle(b)).fade(0, 140).die();
            if (mode !== "demo") score += 10 * level;
            speed = Math.min(620, speed + 3);
            ball.vel = ball.vel.normalize().scale(speed);
            game.currentScene.camera.shake(3, 3, 90);
            hud();

      const sheet = ex.SpriteSheet.fromImageSource({ image: atlas, grid: { rows: 1, columns: 6, spriteWidth: 16, spriteHeight: 16 } });
      const sprites = [0, 1, 2, 3, 4, 5].map((i) => sheet.getSprite(i, 0));

      const MAX = 50000, CHUNK = 1500;
      const px = new Float32Array(MAX), py = new Float32Array(MAX), vx = new Float32Array(MAX), vy = new Float32Array(MAX), fr = new Uint8Array(MAX);
      for (let i = 0; i < MAX; i++) {
        const a = Math.random() * TAU, s = rnd(60, 160);
        vx[i] = Math.cos(a) * s; vy[i] = Math.sin(a) * s; fr[i] = i % 6;
      }
      let actors = [], count = 0, built = -1, gen = 0, applying = false, W = 1, H = 1;
      let upd = 0, col = 0, colAcc = 0, drw = 0, dc = 0, contacts = 0;
      async function apply(n) {
        applying = true;
        try {
          const m = mode;
          // removing thousands of entities one by one is slow, so shrinking or switching mode starts a fresh engine
          if (n < count || (built !== m && count > 0)) eng.rebuild();
          built = m;
          if (m === 2) {
            for (let i = count; i < n; i++) { px[i] = rnd(8, W - 8); py[i] = rnd(8, H - 8); }
            count = n;
            return;
          }
          const g = gen;
          while (count < n) {
            const e = eng.engine, end = Math.min(n, count + CHUNK);
            for (let i = count; i < end; i++) {
              const a = m === 0
                ? new ex.Actor({ x: rnd(8, W - 8), y: rnd(8, H - 8), radius: 7, collisionType: ex.CollisionType.Active })
                : new ex.Actor({ x: rnd(8, W - 8), y: rnd(8, H - 8) });
              a.graphics.use(sprites[fr[i]]);
              a.vel = vec(vx[i], vy[i]);
              e.add(a);
              actors.push(a);
            }
            count = end;
            if (count < n) {
              await ctx.frame();
              if (!ctx.active) throw unmounted();
              if (g !== gen) return;
            }
          }
        } finally {
          applying = false;
        }
      }
      ctl = ctx.ramp({
        label: "小球", unit: "顆", steps: [200, 500, 1000, 2000, 5000, 10000, 20000, 50000], minFps: 30,
        apply,
        metrics: () => ({
          更新: `${upd.toFixed(1)} ms`,
          碰撞系統: built === 0 ? `${col.toFixed(1)} ms` : "未啟用",
          繪製: `${drw.toFixed(1)} ms`,
          "draw call": String(dc),
          Actor: built === 2 ? "0" : fmtN(count),
          接觸: built === 0 ? fmtN(contacts) : "未啟用",
          模式: MODES[mode],
        }),
        note: "更新量的是引擎每格 update 階段的總時間（包含碰撞系統）：每個 Actor 都是 ECS 實體，MotionSystem、ActionsSystem 與圖形相關的系統每格都要走過所有實體的元件，數量一多就線性變慢。碰撞系統只量 CollisionSystem 本身：先用 SparseHashGrid 寬相位找出可能相碰的配對，再做圓形窄相位測試，最後交給 Arcade 求解器推開，球越密，配對與接觸就越多。繪製量的是 draw 階段，同一張圖集的精靈會合併成少數幾次 draw call，CPU 主要花在走訪實體、計算變形與填頂點。自繪 drawImage 模式不建 Actor，只在 postdraw 用陣列座標直接呼叫 drawImage()，可以看出 ECS 本身的額外開銷。GPU 是非同步執行，實際瓶頸也可能在顯示卡。",
      });
      // size the box for the bottom control bar before the engine reads it
      ctx.el.style.setProperty("--sc-ctl-b", `${ctx.controls.offsetHeight + 10}px`);
      eng = engineIn(ctx, ctx.$(".ex-stress"), {
        options: () => ({ physics: { solver: ex.SolverStrategy.Arcade, gravity: vec(0, 0) } }),
        build(e, w, h) {
          W = w; H = h;
          gen++;
          actors = []; count = 0; built = -1;
          const scene = e.currentScene;
          scene.onPreUpdate = (engine, ms) => {
            if (built === 2) {
              const d = ms / 1000;
              for (let i = 0; i < count; i++) {
                let x = px[i] + vx[i] * d, y = py[i] + vy[i] * d;
                if (x < 8) { x = 8; vx[i] = Math.abs(vx[i]); } else if (x > W - 8) { x = W - 8; vx[i] = -Math.abs(vx[i]); }
                if (y < 8) { y = 8; vy[i] = Math.abs(vy[i]); } else if (y > H - 8) { y = H - 8; vy[i] = -Math.abs(vy[i]); }
                px[i] = x; py[i] = y;
              }
              return;
            }
            for (const a of actors) {
              const p = a.pos, v = a.vel;
              if (p.x < 8) v.x = Math.abs(v.x); else if (p.x > W - 8) v.x = -Math.abs(v.x);
              if (p.y < 8) v.y = Math.abs(v.y); else if (p.y > H - 8) v.y = -Math.abs(v.y);
              // the Arcade solver cancels the velocity along each contact normal; give stalled balls a new push
              if (built === 0 && v.x * v.x + v.y * v.y < 900) { const t = Math.random() * TAU; v.x = Math.cos(t) * 100; v.y = Math.sin(t) * 100; }
            }
          };
          const img = atlas.image;
          scene.on("postdraw", (ev) => {
            if (built !== 2) return;
            const g = ev.ctx;
            for (let i = 0; i < count; i++) g.drawImage(img, fr[i] * 16, 0, 16, 16, px[i] - 8, py[i] - 8, 16, 16);
          });
          const cs = scene.world.systemManager.systems.find((s) => s instanceof ex.CollisionSystem);
          if (cs) {
            const update0 = cs.update.bind(cs);
            cs.update = (elapsed) => { const t = performance.now(); update0(elapsed); colAcc += performance.now() - t; };
          }
          e.on("postframe", () => {
            const f = e.stats.currFrame;
            upd += (f.duration.update - upd) * 0.1;
            drw += (f.duration.draw - drw) * 0.1;
            col += (colAcc - col) * 0.1;
            colAcc = 0;
            dc = f.graphics.drawCalls;
            contacts = f.physics.contacts.size;
          });
          // a resize rebuild drops every ball; put the current step back
          if (ctl && ctl.value > 0 && !applying) queueMicrotask(() => ctl.set(ctl.value));
        },
      });
    },
  },
] });
</script>
</body>
</html>
