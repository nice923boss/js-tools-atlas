<script>
const { fmt, fmtMs } = Showcase;
const COURSES = ["資料視覺化入門", "Node.js 實戰班", "AI 工具工作坊", "前端動畫設計", "Python 自動化"];
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "新竹市"];
const NAMES = ["林怡君", "陳冠宇", "張雅婷", "王柏翰", "李佳穎", "黃子軒", "吳欣怡", "劉承恩", "蔡佩珊", "楊宗翰"];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bytesText = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);
const hex = (argb) => (argb ? `#${argb.slice(-6)}` : "");
const solid = (argb) => ({ type: "pattern", pattern: "solid", fgColor: { argb } });
const VT = Object.fromEntries(Object.entries(ExcelJS.ValueType).map(([k, v]) => [v, k]));
const EXCEL_EPOCH = Date.UTC(1899, 11, 30);
const asJs = (o) => JSON.stringify(o).replace(/"(\w+)":/g, "$1: ").replace(/,(?=\w+: )/g, ", ").replace(/:\s?\{/g, ": { ").replace(/\}/g, " }");

async function roundTrip(wb) {
  const buf = await wb.xlsx.writeBuffer();
  const back = new ExcelJS.Workbook();
  await back.xlsx.load(buf);
  return { buf, back };
}
function saveXlsx(buf, name) {
  const url = URL.createObjectURL(new Blob([buf], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function zipText(buf, path) {
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file(path);
  return f ? f.async("string") : "";
}
function prettyXml(x) {
  let d = 0;
  return x.replace(/>\s*</g, ">\n<").split("\n").map((l) => {
    if (/^<\//.test(l)) d--;
    const out = "  ".repeat(Math.max(d, 0)) + l;
    if (/^<[^/!?][^>]*[^/]>$/.test(l)) d++;
    return out;
  }).join("\n");
}

// ---------- number formats (subset used on this page) ----------
function numText(v, f) {
  f = (f || "").split(";")[0];
  if (!f || f === "General") return String(Math.round(v * 1e9) / 1e9);
  const pre = (f.match(/^"([^"]*)"/) || [])[1] || "";
  const pct = f.includes("%");
  const dec = ((f.match(/\.(0+)/) || [])[1] || "").length;
  const x = pct ? v * 100 : v;
  const s = f.includes(",") ? x.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }) : x.toFixed(dec);
  return pre + s + (pct ? "%" : "");
}
function rawValue(v) {
  if (v && typeof v === "object" && !(v instanceof Date)) {
    if ("result" in v || "formula" in v || "sharedFormula" in v) return v.result && v.result.error ? v.result.error : v.result;
    if (v.richText) return v.richText.map((r) => r.text).join("");
    if ("hyperlink" in v) return v.text;
    if (v.error) return v.error;
  }
  return v;
}
function cellText(cell) {
  const v = rawValue(cell.value), f = cell.numFmt || "";
  if (v instanceof Date) {
    if (!/[yd]/i.test(f)) return numText((v - EXCEL_EPOCH) / 864e5, f);
    const s = v.toISOString();
    const d = f.includes("/") ? s.slice(0, 10).replace(/-/g, "/") : s.slice(0, 10);
    return /h/i.test(f) ? `${d} ${s.slice(11, 16)}` : d;
  }
  if (typeof v === "number") return numText(v, f);
  if (typeof v === "boolean") return v ? "TRUE" : "FALSE";
  return v ?? "";
}

// ---------- style -> CSS approximation ----------
const STRIPES = { darkVertical: "90deg", lightVertical: "90deg", darkHorizontal: "0deg", lightHorizontal: "0deg", darkDown: "45deg", lightDown: "45deg", darkUp: "-45deg", lightUp: "-45deg" };
const SHADES = { gray125: 12, gray0625: 6, lightGray: 25, mediumGray: 50, darkGray: 75 };
function fillCss(f) {
  if (!f) return "";
  if (f.type === "gradient") {
    const stops = (f.stops || []).map((s) => `${hex(s.color && s.color.argb) || "#fff"} ${Math.round(s.position * 100)}%`).join(",");
    return f.gradient === "path" ? `background:radial-gradient(circle,${stops});` : `background:linear-gradient(${(f.degree || 0) + 90}deg,${stops});`;
  }
  if (!f.pattern || f.pattern === "none") return "";
  const fg = hex(f.fgColor && f.fgColor.argb) || "#000", bg = hex(f.bgColor && f.bgColor.argb) || "#fff";
  if (f.pattern === "solid") return `background:${fg};`;
  if (STRIPES[f.pattern]) { const w = /^dark/.test(f.pattern) ? 3 : 1; return `background:repeating-linear-gradient(${STRIPES[f.pattern]},${fg} 0 ${w}px,${bg} ${w}px 5px);`; }
  if (SHADES[f.pattern]) return `background:color-mix(in srgb,${fg} ${SHADES[f.pattern]}%,${bg});`;
  return `background:${bg} radial-gradient(${fg} 1px,transparent 1.6px) 0 0/4px 4px;`;
}
function fontCss(f) {
  if (!f) return "";
  let s = "";
  if (f.bold) s += "font-weight:700;";
  if (f.italic) s += "font-style:italic;";
  const deco = [f.underline ? "underline" : "", f.strike ? "line-through" : ""].filter(Boolean).join(" ");
  if (deco) s += `text-decoration:${deco}${/double/i.test(String(f.underline)) ? " double" : ""};`;
  if (f.size) s += `font-size:${(f.size * 1.2).toFixed(1)}px;`;
  if (f.color && f.color.argb) s += `color:${hex(f.color.argb)};`;
  if (f.name && !/^(Calibri|新細明體)$/.test(f.name)) s += `font-family:"${f.name}",var(--font);`;
  return s;
}
function alignCss(a, isNum) {
  a = a || {};
  const h = a.horizontal;
  let s = `text-align:${/center/i.test(h || "") ? "center" : h === "right" ? "right" : h === "justify" || h === "distributed" ? "justify" : h ? "left" : isNum ? "right" : "left"};`;
  if (a.vertical) s += `vertical-align:${a.vertical === "top" ? "top" : a.vertical === "bottom" ? "bottom" : "middle"};`;
  if (a.wrapText) s += "white-space:normal;";
  if (a.indent) s += `padding-left:${5 + a.indent * 10}px;`;
  return s;
}
const BORDER = { thin: "1px solid", medium: "2px solid", thick: "3px solid", dashed: "1px dashed", dotted: "1px dotted", hair: "1px dotted", double: "3px double", mediumDashed: "2px dashed", dashDot: "1px dashed", mediumDashDot: "2px dashed", dashDotDot: "1px dashed", mediumDashDotDot: "2px dashed", slantDashDot: "2px dashed" };
function borderCss(b) {
  if (!b) return "";
  let s = ["top", "right", "bottom", "left"].map((k) => (b[k] && b[k].style ? `border-${k}:${BORDER[b[k].style] || "1px solid"} ${hex(b[k].color && b[k].color.argb) || "#333"};` : "")).join("");
  const d = b.diagonal;
  if (d && (d.up || d.down)) {
    const c = hex(d.color && d.color.argb) || "#333", line = `transparent calc(50% - 1px),${c} 50%,transparent calc(50% + 1px)`;
    s += `background-image:${[d.down ? `linear-gradient(to top right,${line})` : "", d.up ? `linear-gradient(to bottom right,${line})` : ""].filter(Boolean).join(",")};`;
  }
  return s;
}
function cellCss(cell) {
  const s = cell.style || {}, v = rawValue(cell.value);
  return fillCss(s.fill) + fontCss(s.font) + alignCss(s.alignment, typeof v === "number" || v instanceof Date) + borderCss(s.border);
}
function cellHtml(cell) {
  const v = cell.value, a = (cell.style && cell.style.alignment) || {}, va = cell.style && cell.style.font && cell.style.font.vertAlign;
  const wrapVa = (f, t) => (f && f.vertAlign === "superscript" ? `<sup>${t}</sup>` : f && f.vertAlign === "subscript" ? `<sub>${t}</sub>` : t);
  let inner;
  if (v && v.richText) inner = v.richText.map((r) => `<span style="${fontCss(r.font)}">${wrapVa(r.font, esc(r.text))}</span>`).join("");
  else if (v && v.hyperlink) inner = `<a href="${esc(v.hyperlink)}" target="_blank" rel="noopener">${esc(v.text)}</a>`;
  else inner = wrapVa({ vertAlign: va }, esc(cellText(cell)));
  if (a.textRotation === "vertical") return `<span class="xj-vert">${inner}</span>`;
  if (a.textRotation) return `<span class="xj-rot" style="transform:rotate(${-a.textRotation}deg)">${inner}</span>`;
  return inner;
}
// Render a read-back worksheet as an Excel-like grid with column letters and row numbers.
function sheetHtml(ws, { maxR = 80, maxC = 14, minR = 0, minC = 0 } = {}) {
  const R = Math.max(Math.min(ws.rowCount, maxR), minR), C = Math.max(Math.min(ws.columnCount, maxC), minC);
  const spans = {};
  for (const m of ws.model.merges || []) {
    const [a, b] = m.split(":"), s = ws.getCell(a), e = ws.getCell(b);
    spans[a] = [e.row - s.row + 1, e.col - s.col + 1];
  }
  let h = '<colgroup><col style="width:34px">';
  for (let c = 1; c <= C; c++) h += `<col style="width:${Math.round((ws.getColumn(c).width || 9) * 7.5 + 6)}px">`;
  h += "</colgroup><thead><tr><th></th>";
  for (let c = 1; c <= C; c++) h += `<th>${ws.getColumn(c).letter}</th>`;
  h += "</tr></thead><tbody>";
  for (let r = 1; r <= R; r++) {
    const row = ws.getRow(r);
    h += `<tr style="height:${Math.round((row.height || 15) * 4 / 3)}px"><th>${r}</th>`;
    for (let c = 1; c <= C; c++) {
      const cell = row.getCell(c);
      if (cell.isMerged && cell.master.address !== cell.address) continue;
      const sp = spans[cell.address];
      h += `<td data-a="${cell.address}"${sp ? ` rowspan="${sp[0]}" colspan="${Math.min(sp[1], C - c + 1)}"` : ""} style="${cellCss(cell)}">${cellHtml(cell)}</td>`;
    }
    h += "</tr>";
  }
  return h + "</tbody>";
}
function select(table, addr) {
  table.querySelectorAll("td.sel").forEach((t) => t.classList.remove("sel"));
  const td = table.querySelector(`td[data-a="${addr}"]`);
  if (td) td.classList.add("sel");
}

Showcase.run({ scenes: [
  // ---------- 1: styled report round trip (original demo) ----------
  {
    id: "report", title: "營收報表往返", paper: true,
    api: "wb.addWorksheet(name, { views }) ・ ws.mergeCells ・ cell.font / fill / border / numFmt ・ { formula, result } ・ wb.xlsx.writeBuffer() → xlsx.load()",
    desc: "用 ExcelJS 組出有合併標題、主題色、框線、千分位與百分比格式、SUM 公式的季報，寫成 xlsx 位元組後再用 ExcelJS 讀回，表格與右側樣式都來自讀回的檔案。",
    hint: "點任一儲存格看它在 xlsx 內的樣式；切換主題色或關掉達成率標色",
    mount(ctx) {
      ctx.html(`<div class="xj-wrap"><div class="xj-split">
        <div class="xj-book"><div class="xj-fx"><span class="ref">B5</span><i>fx</i><span class="v"></span></div><div class="xj-grid"><table class="xj-t"></table></div></div>
        <div class="xj-side"><div class="xj-cap"><b>儲存格樣式（從檔案讀回）</b></div><div class="xj-addr">B5</div><pre class="xj-pre wrap"></pre></div>
      </div><div class="xj-meta"></div></div>`);
      const THEMES = [["FF217346", "FFE8F3EC"], ["FF1F5F99", "FFE7EFF8"], ["FFC0521B", "FFFBEDE4"], ["FF5B48B5", "FFEFECFA"]];
      let theme = THEMES[0], flag = true, buf = null, back = null, sel = "B5", seq = 0;
      const newData = () => COURSES.map((c) => ({ course: c, m: [0, 0, 0].map(() => rnd(60, 220) * 1000), target: rnd(36, 60) * 10000 }));
      let data = newData();
      const build = () => {
        const [main, soft] = theme;
        const wb = new ExcelJS.Workbook();
        wb.creator = "JS Tools Atlas";
        const ws = wb.addWorksheet("第三季營收", { views: [{ state: "frozen", ySplit: 4 }] });
        ws.columns = [18, 11, 11, 11, 12, 12, 9].map((width) => ({ width }));
        const thin = { style: "thin", color: { argb: "FFD0CFC8" } }, box = { top: thin, left: thin, bottom: thin, right: thin };
        ws.mergeCells("A1:G1");
        Object.assign(ws.getCell("A1"), { value: "2026 第三季課程營收報表", font: { size: 16, bold: true, color: { argb: "FFFFFFFF" } }, fill: solid(main), alignment: { vertical: "middle", horizontal: "center" } });
        ws.getRow(1).height = 30;
        ws.mergeCells("A2:G2");
        Object.assign(ws.getCell("A2"), { value: "單位：新臺幣元（示意資料）", font: { size: 10, italic: true, color: { argb: "FF6D6B64" } }, alignment: { horizontal: "right" } });

          return `圖 ${k + 1}  ${m.extension}  ${bytesText(m.buffer.length)}\n  tl: col ${g.tl.nativeCol}, row ${g.tl.nativeRow}\n  ${g.ext ? `ext: ${g.ext.width} × ${g.ext.height} px` : `br: col ${g.br.nativeCol}, row ${g.br.nativeRow}（${g.editAs || "twoCell"}）`}`;
        }).join("\n\n") + `\n\n分頁顏色：\n${back.worksheets.map((ws) => `  ${ws.name}  ${ws.properties.tabColor && ws.properties.tabColor.argb}`).join("\n")}`;
        ctx.$(".xj-pre.zip").textContent = Object.values(zip.files).filter((f) => !f.dir).map((f) => `${String(f._data && f._data.uncompressedSize || 0).padStart(7)}  ${f.name}`).join("\n");
        ctx.$(".xj-meta").innerHTML = `工作表 <b class="n">${back.worksheets.length}</b>・圖片 <b class="n">${back.model.media.length}</b>・檔案 <b class="n">${bytesText(r.buf.byteLength)}</b>・往返 <b class="n">${fmtMs(performance.now() - t0)}</b>・公式結果是寫入時給的快取值，ExcelJS 不會計算`;
      };
      ctx.on(ctx.$(".xj-tabs"), "click", (e) => { const b = e.target.closest("button"); if (b && back) { sheet = [...b.parentNode.children].indexOf(b); showSheet(); } });
      ctx.on(ctx.$(".xj-t"), "click", (e) => { const td = e.target.closest("td"); if (td && back) pick(td.dataset.a); });
      ctx.group(["長條圖", "折線圖"], 0, (i) => { chart = i; run(); });
      ctx.button("換一組資料", () => { data = newData(); run(); });
      ctx.button("下載 xlsx", async () => saveXlsx(await build().xlsx.writeBuffer(), "第三季摘要.xlsx"), { primary: true });
      run();
    },
  },

  // ---------- 7: value types ----------
  {
    id: "types", title: "儲存格值類型", paper: true,
    api: "cell.value = number | string | Date | boolean | { formula } | { sharedFormula } | { richText } | { text, hyperlink } | { error } ・ cell.type ・ ExcelJS.ValueType",
    desc: "每一列寫入一種值，讀回後看 ExcelJS 判定的 cell.type，右側是同一格在 sheet1.xml 裡的 c 元素：字串進共用字串表（t=\"s\"），布林是 t=\"b\"，錯誤是 t=\"e\"，共用公式帶 t=\"shared\"。",
    hint: "點任一列看該格的原始 XML；切換日期格式看同一個序號的不同顯示",
    mount(ctx) {
      ctx.html(`<div class="xj-wrap"><div class="xj-split even">
        <div class="xj-book"><div class="xj-grid"><table class="xj-plain xj-ty"><thead><tr><th>位址</th><th>寫入的 JS 值</th><th>cell.type</th><th>顯示</th></tr></thead><tbody></tbody></table></div></div>
        <div class="xj-side"><div class="xj-cap"><b>sheet1.xml 中的 c 元素</b><span class="ad"></span></div><pre class="xj-pre half"></pre><div class="xj-cap"><b>讀回的 cell.value</b></div><pre class="xj-pre wrap val"></pre></div>
      </div><div class="xj-meta"></div></div>`);
      const D = new Date(Date.UTC(2026, 9, 11, 9, 30));
      const ROWS = [
        ["B1", "1234.5（numFmt #,##0.00）", 1234.5, "#,##0.00"],
        ["B2", '"臺北市"', "臺北市"],
        ["B3", "new Date(Date.UTC(2026, 9, 11, 9, 30))", D, "DATE"],
        ["B4", "true", true],
        ["B5", '{ formula: "B1*2", result: 2469 }', { formula: "B1*2", result: 2469 }, "#,##0"],
        ["B6", '{ formula: "B1+1", result: 1235.5 }', { formula: "B1+1", result: 1235.5 }],
        ["B7", '{ sharedFormula: "B6", result: 1236.5 }', { sharedFormula: "B6", result: 1236.5 }],
        ["B8", "{ richText: [粗體紅字, 一般, 上標] }", { richText: [{ text: "營收", font: { bold: true, color: { argb: "FFC0262D" } } }, { text: "成長 " }, { text: "2", font: { vertAlign: "superscript" } }] }],
        ["B9", '{ text: "官方文件", hyperlink: "https://github.com/exceljs/exceljs" }', { text: "官方文件", hyperlink: "https://github.com/exceljs/exceljs" }],
        ["B10", '{ error: "#DIV/0!" }', { error: "#DIV/0!" }],
        ["B11", "0.256（numFmt 0.0%）", 0.256, "0.0%"],
        ["B12", "mergeCells(\"B12:C12\") 的主格", "合併的主格"],
        ["C12", "（被合併的格）", undefined],
        ["B13", "只設定 fill，不給值", undefined],
      ];
      let dateFmt = "yyyy-mm-dd", xml = "", sst = [], back = null, cur = 0, seq = 0;
      const build = () => {
        const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet("型別");
        ROWS.forEach(([addr, , v, f]) => {
          if (v === undefined) return;
          const cell = ws.getCell(addr);
          cell.value = v;
          if (f) cell.numFmt = f === "DATE" ? dateFmt : f;
        });
        ws.mergeCells("B12:C12");
        ws.getCell("B13").fill = solid("FFFFF2CC");
        return wb;
      };
      const show = () => {
        const [addr] = ROWS[cur], cell = back.worksheets[0].getCell(addr);
        ctx.$$(".xj-ty tbody tr").forEach((tr, i) => tr.setAttribute("aria-selected", i === cur));
        ctx.$(".ad").textContent = addr;
        const c = (xml.match(new RegExp(`<c r="${addr}"[^>]*?(?:/>|>[\\s\\S]*?</c>)`)) || ["（此格沒有寫進 XML）"])[0];
        const si = / t="s"/.test(c) ? sst[Number((c.match(/<v>(\d+)<\/v>/) || [])[1])] : "";
        ctx.$(".xj-pre.half").textContent = prettyXml(c) + (si ? `\n\n<!-- xl/sharedStrings.xml 中的對應項 -->\n${prettyXml(si)}` : "");
        let val;
        try { val = JSON.stringify(cell.value, null, 1); } catch (e) { val = `（含循環參照）${Object.keys(cell.value || {}).join(", ")}`; }
        ctx.$(".val").textContent = `${val}\n\ncell.type = ${cell.type}（${VT[cell.type]}）\ncell.numFmt = ${JSON.stringify(cell.numFmt)}\ncell.isMerged = ${cell.isMerged}`;
      };
      const run = async () => {
        const my = ++seq, t0 = performance.now();
        const r = await roundTrip(build());
        const zip = await JSZip.loadAsync(r.buf);
        const x = await zip.file("xl/worksheets/sheet1.xml").async("string");
        const s = zip.file("xl/sharedStrings.xml") ? await zip.file("xl/sharedStrings.xml").async("string") : "";
        if (my !== seq || !ctx.active) return;
        back = r.back; xml = x; sst = s.match(/<si>[\s\S]*?<\/si>/g) || [];
        const ws = back.worksheets[0];
        ctx.$(".xj-ty tbody").innerHTML = ROWS.map(([addr, js]) => {
          const cell = ws.getCell(addr);
          return `<tr><td>${addr}</td><td>${esc(js)}</td><td>${cell.type} ${VT[cell.type]}</td><td style="${cellCss(cell)}">${cellHtml(cell)}</td></tr>`;
        }).join("");
        const counts = {};
        ROWS.forEach(([addr]) => { const t = VT[ws.getCell(addr).type]; counts[t] = (counts[t] || 0) + 1; });
        ctx.$(".xj-meta").innerHTML = `類型 <b class="n">${Object.keys(counts).length}</b> 種・共用字串 <b class="n">${sst.length}</b> 筆・檔案 <b class="n">${bytesText(r.buf.byteLength)}</b>・往返 <b class="n">${fmtMs(performance.now() - t0)}</b>`;
        show();
      };
      ctx.on(ctx.$(".xj-ty tbody"), "click", (e) => { const tr = e.target.closest("tr"); if (tr && back) { e.preventDefault(); cur = tr.sectionRowIndex; show(); } });
      ctx.group(["yyyy-mm-dd", "yyyy/m/d h:mm", "0.00（序號）"], 0, (i, l) => { dateFmt = ["yyyy-mm-dd", "yyyy/m/d h:mm", "0.00"][i]; cur = 2; run(); });
      run();
    },
  },

  // ---------- 8: stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "ws.addRows(rows) ・ row.fill ・ wb.xlsx.writeBuffer() ・ new ExcelJS.Workbook().xlsx.load(buffer)",
    desc: "逐級把 1 千到 20 萬列、6 欄的資料寫成 xlsx 再讀回。右上表格分段列出建表、writeBuffer、load 的耗時與檔案大小，下方是最後一級讀回的前 30 列。",
    hint: "按左側「開始測試」；打開「含樣式」或關掉「讀回」再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="xj-stress"><table class="xj-res"><thead><tr><th>列數</th><th>樣式</th><th>建表</th><th>寫入</th><th>讀回</th><th>大小</th></tr></thead><tbody><tr><td class="zh" colspan="6">尚未測試；下方是 1,000 列預覽</td></tr></tbody></table>
        <div class="xj-book"><div class="xj-cap"><b>讀回預覽</b><span class="pv"></span></div><div class="xj-grid"><table class="xj-t"></table></div></div></div>`);
      ctx.controls.classList.add("bottom");
      let styled = false, readBack = true;
      ctx.toggle("含樣式", false, (v) => { styled = v; });
      ctx.toggle("讀回", true, (v) => { readBack = v; });
      const HEAD = ["編號", "姓名", "縣市", "課程", "日期", "費用"];
      const makeRows = (n) => { const a = new Array(n); for (let i = 0; i < n; i++) a[i] = [i + 1, NAMES[i % 10], CITIES[(i * 3) % 7], COURSES[i % 5], new Date(Date.UTC(2026, i % 12, 1 + (i % 28))), 3000 + (i % 40) * 100]; return a; };
      const build = (rows, withStyle) => {
        const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet("資料");
        ws.columns = HEAD.map((header, i) => ({ header, width: [8, 10, 10, 16, 12, 10][i] }));
        ws.getColumn(5).numFmt = "yyyy-mm-dd";
        if (!withStyle) { ws.addRows(rows); return wb; }
        ws.getRow(1).eachCell((x) => Object.assign(x, { font: { bold: true, color: { argb: "FFFFFFFF" } }, fill: solid("FF217346") }));
        ws.views = [{ state: "frozen", ySplit: 1 }];
        const thin = { style: "thin", color: { argb: "FFD0CFC8" } }, box = { top: thin, left: thin, bottom: thin, right: thin };
        rows.forEach((r, i) => {
          const row = ws.addRow(r);
          row.eachCell((x) => (x.border = box));
          row.getCell(6).numFmt = '"NT$"#,##0';
          if (i % 2) row.fill = solid("FFF2F7F4");
        });
        return wb;
      };
      const preview = (ws, label) => { ctx.$(".xj-t").innerHTML = sheetHtml(ws, { maxR: 31 }); ctx.$(".pv").textContent = label; };
      (async () => {
        const { back } = await roundTrip(build(makeRows(1000), false));
        if (ctx.active) preview(back.worksheets[0], "1,000 列，無樣式");
      })();
      const results = [], resBody = ctx.$(".xj-res tbody");
      ctx.bench({
        label: "資料列", unit: "列", sizes: [1000, 5000, 10000, 50000, 100000, 200000], target: 1000, budget: 5000,
        prepare: makeRows,
        async run(n, rows) {
          const t0 = performance.now();
          const wb = build(rows, styled);
          const t1 = performance.now();
          const buf = await wb.xlsx.writeBuffer();
          const t2 = performance.now();
          let t3 = t2, back = null;
          if (readBack) {
            back = new ExcelJS.Workbook();
            await back.xlsx.load(buf);
            t3 = performance.now();
            const got = back.worksheets[0].actualRowCount - 1;
            if (got !== n) throw new Error(`讀回 ${got} 列，預期 ${n} 列`);
          }
          results.unshift([n, styled ? "有" : "無", t1 - t0, t2 - t1, readBack ? t3 - t2 : null, buf.byteLength]);
          resBody.innerHTML = results.slice(0, 8).map(([m, s, a, b, c, z]) => `<tr><td>${fmt(m)}</td><td class="zh">${s}</td><td>${fmtMs(a)}</td><td>${fmtMs(b)}</td><td>${c == null ? "略過" : fmtMs(c)}</td><td>${bytesText(z)}</td></tr>`).join("");
          if (back) ctx.timeout(() => preview(back.worksheets[0], `${fmt(n)} 列${styled ? "，含樣式" : ""}，只畫前 30 列`), 0);
          return `寫 ${fmtMs(t2 - t1)}${readBack ? `・讀 ${fmtMs(t3 - t2)}` : ""}・${bytesText(buf.byteLength)}`;
        },
        note: "計時包含建表（addRows，含樣式時逐格設框線與隔列底色）、writeBuffer 產生 xlsx 位元組、xlsx.load 解析回物件；資料產生不計時。ExcelJS 在記憶體中為每一格建立物件，列數大時寫入與讀回都很吃記憶體。瀏覽器版 exceljs.min.js 沒有 ExcelJS.stream（串流的 WorkbookWriter 只在 Node.js 版提供），所以這裡無法比較串流寫入。超過 5 秒的那一級之後就停止。",
      });
    },
  },
] });
</script>
</body>
</html>
