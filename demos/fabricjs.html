<script src="https://cdn.jsdelivr.net/npm/fabric@7.4.0/dist/index.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Fabric.js showcase: eight scenes from the original poster editor to an object-count stress ramp.
const rootCss = getComputedStyle(document.documentElement);
const cssVar = (name, fallback) => rootCss.getPropertyValue(name).trim() || fallback;
const C = {
  c1: cssVar("--c1", "#f7df1e"), c2: cssVar("--c2", "#4cc9f0"), c3: cssVar("--c3", "#f72585"),
  c4: cssVar("--c4", "#7bd389"), c5: cssVar("--c5", "#ff8c42"), c6: cssVar("--c6", "#9d8cff"),
};
const COLORS = [C.c1, C.c2, C.c3, C.c4, C.c5, C.c6];
// Font stack without quotes so toSVG() can write it straight into SVG attributes.
const FONT = "Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const kb = (n) => `${(n / 1024).toFixed(1)} KB`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Y just below the top-right control cluster, so scene content starts under the buttons.
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;
const PHOTO = (i) => `_shared/img/photo-${i}.jpg`;

// Selection handles shared by every interactive object.
Object.assign(fabric.InteractiveFabricObject.ownDefaults, {
  cornerStyle: "circle", cornerColor: C.c1, cornerStrokeColor: "#1a1a14", borderColor: C.c1,
  transparentCorners: false, cornerSize: 11, borderScaleFactor: 1.5, padding: 4,
});
const SELECTION = { preserveObjectStacking: true, selectionColor: "rgba(247,223,30,0.12)", selectionBorderColor: C.c1 };

function grad(colors, x1, y1, x2, y2) {
  return new fabric.Gradient({
    type: "linear", gradientUnits: "percentage", coords: { x1, y1, x2, y2 },
    colorStops: colors.map((color, i) => ({ offset: i / (colors.length - 1), color })),
  });
}
function radial(colors) {
  return new fabric.Gradient({
    type: "radial", gradientUnits: "percentage", coords: { x1: 0.5, y1: 0.5, r1: 0, x2: 0.5, y2: 0.5, r2: 0.5 },
    colorStops: colors.map((color, i) => ({ offset: i / (colors.length - 1), color })),
  });
}
function starPoints(n, r1, r2) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2;
    pts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
  }
  return pts;
}

// Fabric canvas that fills `box` and follows its size; disposed when the scene unmounts.
function fabricIn(ctx, box, { Kind = fabric.Canvas, ...opts } = {}, onSize) {
  const el = document.createElement("canvas");
  box.append(el);
  let lw = Math.max(1, box.clientWidth), lh = Math.max(1, box.clientHeight), pending = 0;
  const canvas = new Kind(el, { width: lw, height: lh, ...(Kind === fabric.Canvas ? SELECTION : {}), ...opts });
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = box.clientWidth, h = box.clientHeight;
      if (!w || !h || (w === lw && h === lh)) return;
      lw = w; lh = h;
      canvas.setDimensions({ width: w, height: h });
      if (onSize) onSize(w, h);
      canvas.requestRenderAll();
    });
  });
  ro.observe(box);
  ctx.onCleanup(() => {
    ro.disconnect();
    cancelAnimationFrame(pending);
    fabric.runningAnimations.cancelByCanvas(canvas);
    canvas.getObjects().forEach((o) => o.isEditing && o.exitEditing());
    canvas.dispose();
  });
  return canvas;
}
// Viewport transform that fits a PW x PH design area into the canvas, below the controls.
function fitView(canvas, PW, PH, { top = 0, bottom = 0, side = 16 } = {}) {
  const W = canvas.width, H = canvas.height;
  const k = Math.max(0.05, Math.min((W - side * 2) / PW, (H - top - bottom) / PH));
  canvas.setViewportTransform([k, 0, 0, k, (W - PW * k) / 2, top + (H - top - bottom - PH * k) / 2]);
  return k;
}
// Status line in the bottom-left corner; returns a setter that takes HTML.
function readout(ctx, parent = ctx.el) {
  const el = document.createElement("div");
  el.className = "readout";
  parent.append(el);
  return (html) => { el.innerHTML = html; };
}
function removeActive(canvas) {
  const objs = canvas.getActiveObjects();
  if (!objs.length) return;
  canvas.discardActiveObject();
  canvas.remove(...objs);
  canvas.requestRenderAll();
}
// Clone the active object or selection and select the copy (the official copy and paste pattern).
async function duplicateActive(canvas, ctx, decorate = () => {}) {
  const active = canvas.getActiveObject();
  if (!active) return;
  const copy = await active.clone(["name"]);
  if (!ctx.active) return;
  canvas.discardActiveObject();
  copy.set({ left: copy.left + 16, top: copy.top + 16, evented: true });
  if (copy instanceof fabric.ActiveSelection) {
    copy.canvas = canvas;
    copy.forEachObject((o) => { decorate(o); canvas.add(o); });
    copy.setCoords();
  } else {
    decorate(copy);
    canvas.add(copy);
  }
  decorate(copy);
  canvas.setActiveObject(copy);
  canvas.requestRenderAll();
}
// Delete or Backspace removes the selection, unless a text object or form field is being edited.
function deleteKey(ctx, canvas) {
  ctx.on(window, "keydown", (e) => {
    if (e.key !== "Delete" && e.key !== "Backspace") return;
    const a = canvas.getActiveObject();
    if (!a || a.isEditing || /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || "")) return;
    e.preventDefault();
    removeActive(canvas);
  });
}
// Round icon control drawn on the canvas next to the selection; runs `action(target)` on mouse up.
function iconControl({ x, y, glyph, color, action }) {
  return new fabric.Control({
    x, y, offsetX: x < 0 ? -15 : 15, offsetY: -15, sizeX: 22, sizeY: 22, cursorStyle: "pointer",
    mouseUpHandler: (eventData, transform) => { action(transform.target); return true; },
    render(c, left, top) {
      c.save();
      c.beginPath();
      c.arc(left, top, 10, 0, Math.PI * 2);
      c.fillStyle = color;
      c.fill();
      c.lineWidth = 1.5;
      c.strokeStyle = "#1a1a14";
      c.stroke();
      c.fillStyle = "#1a1a14";
      c.font = "bold 15px system-ui, sans-serif";
      c.textAlign = "center";
      c.textBaseline = "middle";
      c.fillText(glyph, left, top + 1);
      c.restore();
    },
  });
}

Showcase.run({ scenes: [
  {
    id: "poster", title: "海報編輯器",
    api: "new fabric.Canvas(el)・IText・Textbox・Group・Gradient・setViewportTransform()・toSVG()・toDataURL({ multiplier })",
    desc: "原本的海報編輯器：海報畫在 300×400 的設計座標，再用 viewportTransform 縮放到畫面；每個元素都能選取、拖曳、縮放、旋轉，匯出時同時產生向量 SVG 與 3 倍解析度的 PNG。",
    hint: "點物件拖曳或拉控制點・雙擊文字直接改字・Delete 刪除・按「匯出」看 SVG 與 PNG",
    mount(ctx) {
      ctx.el.classList.add("studio");
      ctx.html(`<div class="fb"></div>
        <div class="modal" hidden><div class="sheet">
          <div class="pair">
            <figure><img class="svg-img" alt="匯出的 SVG 海報"><figcaption class="svg-cap"></figcaption></figure>
            <figure><img class="png-img" alt="匯出的 PNG 海報"><figcaption class="png-cap"></figcaption></figure>
          </div>
          <h3>匯出完成</h3>
          <p class="info"></p>
          <div class="row">
            <a class="btn primary dl-svg" download="poster.svg">下載 SVG</a>
            <a class="btn dl-png" download="poster.png">下載 PNG</a>
            <button class="btn close" type="button">繼續編輯</button>
          </div>
        </div></div>`);
      const PW = 300, PH = 400;
      const THEMES = [
        { sky: ["#1b1446", "#5b2a86", "#d76d77", "#ffaf7b"], sun: ["#fff3b0", "#f7df1e", "#ff8c42"], hill: ["#2a1745", "#120b26"], ink: "#fff7d6" },
        { sky: ["#03256c", "#2541b2", "#1768ac", "#06bee1"], sun: ["#ffffff", "#c8f7ff", "#4cc9f0"], hill: ["#052a4a", "#021627"], ink: "#e8fbff" },
        { sky: ["#0b3d2e", "#1f6f50", "#7bd389", "#e9f5a1"], sun: ["#fffbe0", "#f7df1e", "#ff8c42"], hill: ["#0d2b20", "#061810"], ink: "#fbffe8" },
      ];
      const SHAPES = [
        () => new fabric.Circle({ radius: 26, fill: C.c2 }),
        () => new fabric.Triangle({ width: 56, height: 48, fill: C.c4 }),
        () => new fabric.Polygon(starPoints(5, 30, 13), { fill: C.c1 }),
        () => new fabric.Rect({ width: 60, height: 40, rx: 8, ry: 8, fill: C.c6 }),
      ];
      let themeIdx = 0, shapeIdx = 0, svgUrl = null;
      ctx.onCleanup(() => svgUrl && URL.revokeObjectURL(svgUrl));
      ctx.button("加文字", () => addObj(new fabric.IText("雙擊編輯", { fontSize: 24, fontWeight: "bold", fill: "#ffffff", fontFamily: FONT })));
      ctx.button("加形狀", () => addObj(SHAPES[shapeIdx++ % SHAPES.length]()));
      ctx.button("換配色", () => { themeIdx = (themeIdx + 1) % THEMES.length; applyTheme(); });
      ctx.button("複製", () => duplicateActive(canvas, ctx));
      ctx.button("匯出", exportPoster, { primary: true });
      const show = readout(ctx);
      const canvas = fabricIn(ctx, ctx.$(".fb"), {}, () => layout());
      const layout = () => fitView(canvas, PW, PH, { top: belowControls(ctx), bottom: 46 });

      const bg = new fabric.Rect({ left: PW / 2, top: PH / 2, width: PW, height: PH, selectable: false, evented: false, shadow: new fabric.Shadow({ color: "rgba(0,0,0,0.55)", blur: 40, offsetY: 14 }) });
      const sun = new fabric.Circle({ left: 150, top: 205, radius: 74 });
      const hillBack = new fabric.Path("M0 300 Q 60 250 120 285 T 230 270 T 300 262 L 300 400 L 0 400 Z", { opacity: 0.85 });
      const hillFront = new fabric.Path("M0 330 Q 70 300 150 330 T 300 318 L 300 400 L 0 400 Z", {});
      const title = new fabric.IText("夏日爵士夜", { left: 150, top: 70, fontSize: 46, fontWeight: "bold", fontFamily: FONT, charSpacing: 120 });
      const subtitle = new fabric.IText("河 岸 草 地 音 樂 會", { left: 150, top: 118, fontSize: 14, fontFamily: FONT, charSpacing: 200 });
      const info = new fabric.Textbox("8 月 15 日（六）晚上 7 點\n大稻埕碼頭・自備野餐墊", { left: 150, top: 368, width: 260, fontSize: 13, lineHeight: 1.5, textAlign: "center", fontFamily: FONT });
      const badge = new fabric.Group([
        new fabric.Circle({ radius: 30, fill: C.c3, stroke: "#ffffff", strokeWidth: 2 }),
        new fabric.FabricText("免費\n入場", { fontSize: 14, fontWeight: "bold", lineHeight: 1.1, textAlign: "center", fill: "#ffffff", fontFamily: FONT }),
      ], { left: 252, top: 180, angle: 14 });
      const sparkles = [[48, 168, 9], [262, 108, 6], [80, 232, 5], [228, 240, 7]].map(([x, y, r]) =>
        new fabric.Polygon(starPoints(4, r, r * 0.3), { left: x, top: y, fill: "#ffffff", opacity: 0.9 }));
      canvas.add(bg, sun, ...sparkles, hillBack, hillFront, title, subtitle, info, badge);

      function applyTheme() {
        const t = THEMES[themeIdx];
        bg.set("fill", grad(t.sky, 0, 0, 0, 1));
        sun.set({ fill: radial(t.sun), shadow: new fabric.Shadow({ color: t.sun[2], blur: 50 }) });
        hillBack.set("fill", t.hill[0]);
        hillFront.set("fill", t.hill[1]);
        title.set({ fill: t.ink, shadow: new fabric.Shadow({ color: "rgba(0,0,0,0.35)", blur: 8, offsetY: 3 }) });
        subtitle.set("fill", t.ink);
        info.set("fill", t.ink);
        canvas.requestRenderAll();
      }
      function addObj(obj) {
        obj.set({ left: 150 + rnd(-40, 40), top: 220 + rnd(-40, 40) });
        canvas.add(obj);
        canvas.setActiveObject(obj);
        canvas.requestRenderAll();
        describe();
      }
      function describe() {
        const a = canvas.getActiveObject();
        if (!a) return show(`未選取・海報共 <b>${canvas.getObjects().length}</b> 個物件・畫面縮放 ${canvas.getZoom().toFixed(2)} 倍`);
        if (a instanceof fabric.ActiveSelection) return show(`<b>ActiveSelection</b>・${a.size()} 個物件・x ${Math.round(a.left)}　y ${Math.round(a.top)}`);
        show(`<b>${a.constructor.type}</b>・x ${Math.round(a.left)}　y ${Math.round(a.top)}・角度 ${Math.round(a.angle)}°・縮放 ${a.scaleX.toFixed(2)}`);
      }
      ["selection:created", "selection:updated", "selection:cleared", "object:moving", "object:scaling", "object:rotating", "object:modified", "object:removed"]
        .forEach((ev) => canvas.on(ev, describe));

      const modal = ctx.$(".modal");
      ctx.$(".close").addEventListener("click", () => { modal.hidden = true; });
      function exportPoster() {
        canvas.discardActiveObject();
        canvas.renderAll();
        const svg = canvas.toSVG({ viewBox: { x: 0, y: 0, width: PW, height: PH }, width: PW, height: PH });
        if (svgUrl) URL.revokeObjectURL(svgUrl);
        svgUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
        // Crop the poster area (screen pixels) and sample it at 3x the design size.
        const vpt = canvas.viewportTransform, k = vpt[0];
        const png = canvas.toDataURL({ format: "png", multiplier: 3 / k, left: vpt[4], top: vpt[5], width: PW * k, height: PH * k });
        ctx.$(".svg-img").src = svgUrl;
        ctx.$(".png-img").src = png;
        ctx.$(".dl-svg").href = svgUrl;
        ctx.$(".dl-png").href = png;
        ctx.$(".svg-cap").textContent = `SVG・${kb(svg.length)}`;
        ctx.$(".png-cap").textContent = `PNG ${PW * 3}×${PH * 3}・${kb(png.length * 0.75)}`;
        ctx.$(".info").textContent = `toSVG() 把 ${canvas.getObjects().length} 個物件寫成向量元素，文字與漸層都還能再編輯；toDataURL() 以 ${(3 / k).toFixed(2)} 倍取樣輸出點陣圖。`;
        modal.hidden = false;
        describe();
      }
      deleteKey(ctx, canvas);

      applyTheme();
      layout();
      canvas.setActiveObject(title);
      describe();
      canvas.requestRenderAll();
    },
  },
  {
    id: "select", title: "選取與群組",
    api: "ActiveSelection・new fabric.Group(objs)・group.removeAll()・bringObjectToFront()・new fabric.Control({ mouseUpHandler, render })・obj.animate()",
    desc: "Shift 點選或框選得到 ActiveSelection，可以一起移動與變形；群組化後變成單一 Group，解散後還原成個別物件。每個物件都加了自訂控制點：右上角刪除、左上角複製。",
    hint: "框選或 Shift＋點選多個物件・按「群組」「解散」・點選取框角落的 × 刪除、＋ 複製",
    mount(ctx) {
      ctx.el.classList.add("dots");
      ctx.html(`<div class="fb"></div>`);
      const PW = 560, PH = 360;
      let tidy = false;
      const groupBtn = ctx.button("群組", toggleGroup);
      const frontBtn = ctx.button("置頂", () => restack(true));
      const backBtn = ctx.button("置底", () => restack(false));
      const lockBtn = ctx.button("鎖定", toggleLock);
      const tidyBtn = ctx.button("排列", arrange, { primary: true });
      const show = readout(ctx);
      const canvas = fabricIn(ctx, ctx.$(".fb"), {}, () => layout());
      const layout = () => fitView(canvas, PW, PH, { top: belowControls(ctx), bottom: 40 });

      const delCtl = iconControl({ x: 0.5, y: -0.5, glyph: "×", color: C.c3, action: () => { removeActive(canvas); describe(); } });
      const dupCtl = iconControl({ x: -0.5, y: -0.5, glyph: "+", color: C.c4, action: () => duplicateActive(canvas, ctx, decorate) });
      function decorate(o) {
        if (o.controls.del) return;
        o.controls = { ...o.controls, del: delCtl, dup: dupCtl };
        // oCoords holds one entry per control, so it must be rebuilt before the next render.
        o.setCoords();
      }

      const shapes = [
        new fabric.Rect({ left: 100, top: 105, width: 120, height: 82, rx: 12, ry: 12, fill: C.c6, name: "卡片" }),
        new fabric.Circle({ left: 268, top: 100, radius: 48, fill: C.c2, name: "圓形" }),

      ctx.on(ctx.el, "pointerdown", (e) => { if (e.isTrusted) stopDemo(); }, { capture: true });

      setBrush();
      startDemo();
    },
  },
  {
    id: "json", title: "序列化與復原",
    api: "canvas.toObject(['name'])・canvas.loadFromJSON(json)・includeDefaultValues・object:added／modified／removed",
    desc: "每次新增、修改、刪除物件就用 toObject() 存一份快照，復原與重做只是把快照交給 loadFromJSON() 重建；右下的小畫布是另一個 StaticCanvas，只靠同一份 JSON 就還原出相同畫面。",
    hint: "拖曳、旋轉或雙擊改字後按「復原」「重做」・打開「精簡 JSON」比較省略預設值後的大小",
    mount(ctx) {
      ctx.el.classList.add("studio");
      ctx.html(`<div class="split"><div class="pad"></div><div class="side">
        <div class="out panel"><h4>canvas.toObject(["name"])</h4><pre class="json"></pre><small class="json-info"></small></div>
        <div class="out panel"><h4>另一個畫布 loadFromJSON()</h4><div class="view mirror"></div><small class="mirror-info"></small></div>
      </div></div>`);
      const PW = 360, PH = 260;
      let history = [], idx = -1, loading = false, compact = false, queued = false, added = 0, mirrorChain = Promise.resolve();
      const undoBtn = ctx.button("復原", () => go(-1));
      const redoBtn = ctx.button("重做", () => go(1));
      ctx.button("加物件", addShape);
      ctx.button("清空", () => { canvas.discardActiveObject(); canvas.remove(...canvas.getObjects()); });
      ctx.toggle("精簡 JSON", compact, (v) => { compact = v; paintJSON(); });
      const pre = ctx.$(".json"), jsonInfo = ctx.$(".json-info"), mirrorInfo = ctx.$(".mirror-info");
      const canvas = fabricIn(ctx, ctx.$(".pad"), { backgroundColor: "#191c24" }, () => fit());
      const mirror = fabricIn(ctx, ctx.$(".mirror"), { Kind: fabric.StaticCanvas }, () => fitMirror());
      const fit = () => fitView(canvas, PW, PH, { top: 12, bottom: 12, side: 12 });
      const fitMirror = () => fitView(mirror, PW, PH, { top: 4, bottom: 4, side: 4 });

      canvas.add(
        new fabric.Rect({ left: 95, top: 88, width: 112, height: 76, rx: 12, ry: 12, fill: C.c6, angle: -6, name: "卡片" }),
        new fabric.Circle({ left: 255, top: 92, radius: 44, fill: C.c2, name: "圓形" }),
        new fabric.Polygon(starPoints(5, 40, 17), { left: 272, top: 196, fill: C.c1, angle: 12, name: "星形" }),
        new fabric.IText("雙擊改字", { left: 112, top: 200, fontSize: 30, fontWeight: "bold", fontFamily: FONT, fill: "#ffffff", name: "標題" }),
      );

      const serialize = (withDefaults) => {
        canvas.includeDefaultValues = withDefaults;
        const obj = canvas.toObject(["name"]);
        canvas.includeDefaultValues = true;
        return obj;
      };
      function record() {
        queued = false;
        if (loading || !ctx.active) return;
        history = history.slice(0, idx + 1);
        history.push(JSON.stringify(serialize(true)));
        if (history.length > 60) history.shift();
        idx = history.length - 1;
        refresh();
      }
      const queue = () => { if (loading || queued) return; queued = true; queueMicrotask(record); };
      ["object:added", "object:modified", "object:removed"].forEach((ev) => canvas.on(ev, queue));

      async function go(d) {
        const j = idx + d;
        if (loading || j < 0 || j >= history.length) return;
        loading = true;
        refresh();
        canvas.discardActiveObject();
        await canvas.loadFromJSON(history[j]);
        if (!ctx.active) return;
        idx = j;
        loading = false;
        canvas.requestRenderAll();
        refresh();
      }
      function paintJSON() {
        if (idx < 0) return;
        const full = history[idx], small = JSON.stringify(serialize(false));
        const shown = compact ? JSON.parse(small) : JSON.parse(full);
        pre.innerHTML = esc(JSON.stringify(shown, null, 1)).replace(/"([^"\n]+)":/g, '<b>"$1"</b>:');
        jsonInfo.textContent = `完整 ${kb(full.length)}・精簡 ${kb(small.length)}・歷史 ${idx + 1}／${history.length}`;
      }
      function refresh() {
        undoBtn.disabled = loading || idx <= 0;
        redoBtn.disabled = loading || idx >= history.length - 1;
        if (loading) return;
        paintJSON();
        const json = history[idx];
        mirrorChain = mirrorChain
          .then(() => ctx.active && mirror.loadFromJSON(json))
          .then(() => {
            if (!ctx.active) return;
            mirror.requestRenderAll();
            mirrorInfo.textContent = `從 ${kb(json.length)} 的 JSON 重建 ${mirror.getObjects().length} 個物件`;
          });
      }
      function addShape() {
        added++;
        const fill = COLORS[(added + 1) % COLORS.length], k = added % 3;
        const o = k === 0 ? new fabric.Circle({ radius: rnd(18, 32), fill })
          : k === 1 ? new fabric.Rect({ width: rnd(44, 80), height: rnd(32, 56), rx: 8, ry: 8, fill })
          : new fabric.Triangle({ width: 60, height: 52, fill });
        o.set({ left: rnd(50, PW - 50), top: rnd(50, PH - 50), angle: rnd(-20, 20), name: `新物件 ${added}` });
        canvas.add(o);
        canvas.setActiveObject(o);
        canvas.requestRenderAll();
      }

      fit();
      fitMirror();
      record();
    },
  },
  {
    id: "svg", title: "SVG 匯入匯出",
    api: "fabric.loadSVGFromString(svg)・util.groupSVGElements(objects, options)・canvas.toSVG({ viewBox })",
    desc: "把手寫的 SVG 字串解析成 Fabric 物件，路徑、漸層、文字與群組變形都會還原；拆開後每個元素都能單獨編輯，右側把原始 SVG 與 toSVG() 重新輸出的結果並排對照。",
    hint: "切換範例・按「拆開」後點單一元素拖曳或縮放，右下的輸出會跟著更新",
    mount(ctx) {
      ctx.el.classList.add("studio");
      ctx.html(`<div class="split"><div class="pad checker"></div><div class="side">
        <div class="out panel"><h4>原始 SVG（瀏覽器直接畫）</h4><div class="view"><img class="src" alt="原始 SVG"></div><small class="src-info"></small></div>
        <div class="out panel"><h4>canvas.toSVG() 再輸出</h4><div class="view"><img class="dst" alt="Fabric 匯出的 SVG"></div><small class="dst-info"></small></div>
      </div></div>`);
      const star = starPoints(5, 54, 23).map((p) => `${(120 + p.x).toFixed(1)},${(112 + p.y).toFixed(1)}`).join(" ");
      const SVGS = {
        山景: `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1446"/><stop offset="0.6" stop-color="#d76d77"/><stop offset="1" stop-color="#ffaf7b"/></linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#ff8c42"/></radialGradient>
  </defs>
  <rect width="320" height="220" rx="14" fill="url(#sky)"/>
  <circle cx="205" cy="118" r="46" fill="url(#sun)"/>
  <path d="M0 170 L70 110 L120 150 L180 95 L250 160 L320 120 L320 220 L0 220 Z" fill="#2a1745"/>
  <path d="M0 195 Q80 165 160 190 T320 185 L320 220 L0 220 Z" fill="#120b26"/>
  <polyline points="40,62 60,52 80,62" fill="none" stroke="#fff7d6" stroke-width="3" stroke-linecap="round"/>
  <polyline points="92,46 106,39 120,46" fill="none" stroke="#fff7d6" stroke-width="2.5" stroke-linecap="round"/>
</svg>`,
        徽章: `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7df1e"/><stop offset="1" stop-color="#ff8c42"/></linearGradient></defs>
  <circle cx="120" cy="120" r="104" fill="#1a1a14" stroke="url(#gold)" stroke-width="10"/>
  <ellipse cx="120" cy="40" rx="30" ry="7" fill="#4cc9f0" opacity="0.8"/>
  <polygon points="${star}" fill="url(#gold)"/>
  <text x="120" y="200" font-family="${FONT}" font-size="24" font-weight="bold" fill="#f7df1e" text-anchor="middle">JS 圖鑑</text>
</svg>`,
        相機: `<svg xmlns="http://www.w3.org/2000/svg" width="260" height="200" viewBox="0 0 260 200">
  <g transform="rotate(-8 130 100)">
    <rect x="30" y="50" width="200" height="120" rx="18" fill="#4cc9f0"/>
    <rect x="60" y="34" width="56" height="24" rx="6" fill="#4cc9f0"/>
    <circle cx="130" cy="110" r="42" fill="#0e1013"/>
    <circle cx="130" cy="110" r="27" fill="none" stroke="#f7df1e" stroke-width="7"/>
    <circle cx="200" cy="74" r="8" fill="#f72585"/>
    <line x1="46" y1="150" x2="92" y2="150" stroke="#0e1013" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>`,
      };
      let key = "山景", W = 320, H = 220, srcUrl = null, dstUrl = null, ticket = 0;
      ctx.onCleanup(() => { if (srcUrl) URL.revokeObjectURL(srcUrl); if (dstUrl) URL.revokeObjectURL(dstUrl); });
      ctx.select("範例", Object.keys(SVGS), key, (v) => { key = v; load(); });
      ctx.button("拆開", explode, { primary: true });
      ctx.button("下載 SVG", () => {
        const a = document.createElement("a");
        a.href = dstUrl;
        a.download = `fabric-${key}.svg`;
        a.click();
      });
      const canvas = fabricIn(ctx, ctx.$(".pad"), {}, () => fit());
      const fit = () => fitView(canvas, W, H, { top: 12, bottom: 12, side: 12 });
      const blobUrl = (svg) => URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));

      async function load() {
        const my = ++ticket, src = SVGS[key];
        const t0 = performance.now();
        const { objects, options } = await fabric.loadSVGFromString(src);
        if (!ctx.active || my !== ticket) return;
        const parsed = objects.filter(Boolean), ms = performance.now() - t0;
        const counts = {};
        parsed.forEach((o) => { counts[o.constructor.type] = (counts[o.constructor.type] || 0) + 1; });
        W = options.width || options.viewBoxWidth || 300;
        H = options.height || options.viewBoxHeight || 200;
        canvas.discardActiveObject();
        canvas.remove(...canvas.getObjects());
        const group = fabric.util.groupSVGElements(parsed, options);
        canvas.add(group);
        canvas.setActiveObject(group);
        fit();
        if (srcUrl) URL.revokeObjectURL(srcUrl);
        srcUrl = blobUrl(src);
        ctx.$(".src").src = srcUrl;
        ctx.$(".src-info").textContent = `${kb(src.length)}・${ms.toFixed(1)} ms 解析成 ${Object.entries(counts).map(([t, n]) => `${t} ${n}`).join("、")}`;
        update();
      }
      function update() {
        if (!ctx.active) return;
        const svg = canvas.toSVG({ viewBox: { x: 0, y: 0, width: W, height: H }, width: W, height: H });
        if (dstUrl) URL.revokeObjectURL(dstUrl);
        dstUrl = blobUrl(svg);
        ctx.$(".dst").src = dstUrl;
        const tags = (svg.match(/<(path|rect|circle|ellipse|line|polyline|polygon|text|g)\b/g) || []).length;
        ctx.$(".dst-info").textContent = `${kb(svg.length)}・${tags} 個元素・畫布頂層 ${canvas.getObjects().length} 個物件`;
      }
      function explode() {
        const a = canvas.getActiveObject();
        const g = a instanceof fabric.Group && !(a instanceof fabric.ActiveSelection) ? a : canvas.getObjects().find((o) => o instanceof fabric.Group);
        if (!g) return;
        canvas.discardActiveObject();
        canvas.remove(g);
        const parts = g.removeAll();
        canvas.add(...parts);
        canvas.setActiveObject(new fabric.ActiveSelection(parts, { canvas }));
        canvas.requestRenderAll();
        update();
      }
      canvas.on("object:modified", update);
      load();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new fabric.StaticCanvas(el, { renderOnAddRemove: false, skipOffscreen: false })・obj.set('left', x)・canvas.renderAll()・objectCaching",
    desc: "用沒有互動層的 StaticCanvas 放入大量圓形、方形、三角形與星形，每格先用 set() 更新位置，再手動 renderAll() 重畫，兩段分開計時；逐級增加物件數直到掉到 30 FPS 以下。可切換物件快取與旋轉比較成本。",
    hint: "按「自動加壓」開始・打開「物件快取」或「旋轉」再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="stress-box"></div>`);
      ctx.controls.classList.add("bottom");
      let caching = false, spin = false, objs = [], px, py, vx, vy, va, upd = 0, drw = 0;
      ctx.toggle("物件快取", caching, (v) => { caching = v; objs.forEach((o) => o.set("objectCaching", v)); });
      ctx.toggle("旋轉", spin, (v) => { spin = v; });
      const canvas = fabricIn(ctx, ctx.$(".stress-box"), { Kind: fabric.StaticCanvas, renderOnAddRemove: false, skipOffscreen: false });

      function spawn(n) {
        canvas.clear();
        const W = canvas.width, H = canvas.height, s = clamp(Math.sqrt((W * H) / n) * 0.3, 2.5, 16);
        const star = starPoints(5, s * 1.15, s * 0.5);
        px = new Float32Array(n); py = new Float32Array(n); vx = new Float32Array(n); vy = new Float32Array(n); va = new Float32Array(n);
        objs = new Array(n);
        for (let i = 0; i < n; i++) {
          px[i] = rnd(0, W); py[i] = rnd(0, H);
          const a = rnd(0, Math.PI * 2), sp = rnd(0.6, 2.2);
          vx[i] = Math.cos(a) * sp; vy[i] = Math.sin(a) * sp; va[i] = rnd(-3, 3);
          const o = { left: px[i], top: py[i], fill: COLORS[i % 6], stroke: "#0e1013", strokeWidth: 1, opacity: 0.85, objectCaching: caching };
          const kind = i % 4;
          objs[i] = kind === 0 ? new fabric.Circle({ ...o, radius: s })
            : kind === 1 ? new fabric.Rect({ ...o, width: s * 1.7, height: s * 1.7 })
            : kind === 2 ? new fabric.Triangle({ ...o, width: s * 2, height: s * 1.8 })
            : new fabric.Polygon(star, o);
        }
        canvas.add(...objs);
      }
      ctx.raf((t, dt) => {
        const n = objs.length;
        if (!n) return;
        const W = canvas.width, H = canvas.height, k = dt / 16.7;
        const t0 = performance.now();
        for (let i = 0; i < n; i++) {
          let x = px[i] + vx[i] * k, y = py[i] + vy[i] * k;
          if (x < 0) { x = 0; vx[i] = Math.abs(vx[i]); } else if (x > W) { x = W; vx[i] = -Math.abs(vx[i]); }
          if (y < 0) { y = 0; vy[i] = Math.abs(vy[i]); } else if (y > H) { y = H; vy[i] = -Math.abs(vy[i]); }
          px[i] = x; py[i] = y;
          const o = objs[i];
          o.set("left", x);
          o.set("top", y);
          if (spin) o.set("angle", (o.angle + va[i] * k) % 360);
        }
        const t1 = performance.now();
        canvas.renderAll();
        const t2 = performance.now();
        upd += (t1 - t0 - upd) * 0.1;
        drw += (t2 - t1 - drw) * 0.1;
      });
      ctx.ramp({
        label: "物件", unit: "個", steps: [250, 500, 1000, 2000, 4000, 8000, 12000, 16000], minFps: 30,
        apply(n) { spawn(n); },
        metrics: () => ({
          更新: `${upd.toFixed(1)} ms`,
          繪製: `${drw.toFixed(1)} ms`,
          模式: `${caching ? "物件快取" : "直接描繪"}・${spin ? "旋轉" : "不旋轉"}`,
        }),
        note: "每格先用 set() 改所有物件的 left、top（旋轉時再改 angle），再手動呼叫 canvas.renderAll() 重畫整張 StaticCanvas。預設關閉物件快取，每格直接描繪路徑、填色與描邊；打開後每個物件先畫進自己的小 canvas，再逐一 drawImage 貼上。開發時實測，這種只有幾個頂點的簡單圖形開快取反而明顯變慢，快取較適合點數多的路徑、文字與群組。skipOffscreen 關閉是因為移動中不更新包圍盒，改由全部繪製。",
      });
    },
  },
] });
</script>
