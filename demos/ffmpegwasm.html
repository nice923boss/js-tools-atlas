<script type="module">
// FFmpeg.wasm 0.12 showcase: the real FFmpeg CLI compiled to WebAssembly (single-thread core, no
// SharedArrayBuffer) running in a Web Worker. Each scene loads its own FFmpeg instance from the cached
// core blob URLs and terminates it on unmount; every output is read back with ffmpeg.ffprobe().
import { FFmpeg } from "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm/index.js";
import { toBlobURL, fetchFile } from "https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.2/dist/esm/index.js";
import { recording, recProgress, melody, wav, drawWave } from "./assets/ffmpegwasm/media.js";

const { h, fmtMs } = Showcase;
const FF = "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/esm";
const CORE = "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/esm";
const WASM_BYTES = 32232419; // jsDelivr sends no Content-Length, so use the known size
const MIME = { mp4: "video/mp4", webm: "video/webm", gif: "image/gif", png: "image/png", webp: "image/webp", mp3: "audio/mpeg", ogg: "audio/ogg",
  opus: "audio/ogg", m4a: "audio/mp4", flac: "audio/flac", wav: "audio/wav", m3u8: "application/vnd.apple.mpegurl", ts: "video/mp2t", txt: "text/plain" };
const X264 = ["-c:v", "libx264", "-preset", "ultrafast", "-pix_fmt", "yuv420p"];
const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(2)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const abortError = () => new DOMException("場景已切換", "AbortError");
const isAbort = (e) => e && e.name === "AbortError";
const quote = (a) => (/[\s|;[\]'"]/.test(a) ? `"${a}"` : a);
const cmdLine = (args) => ["ffmpeg", ...args].map(quote).join(" ");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const blobOf = (data, file) => new Blob([data], { type: MIME[file.split(".").pop()] || "application/octet-stream" });
const dl = (url, file) => `<a href="${url}" download="${file}">下載</a>`;
const GATE = {
  icon: "🎞️", title: "瀏覽器內執行 FFmpeg",
  desc: "按下後下載單執行緒版 FFmpeg 核心（WebAssembly），所有處理都在你的瀏覽器內完成，檔案不會上傳。下載一次後，切換其他場景不必再下載。",
};

// Object URLs created by a scene; revoked when the scene unmounts (or when a slot is reused).
function urls(ctx) {
  const live = new Map();
  ctx.onCleanup(() => live.forEach((u) => URL.revokeObjectURL(u)));
  return (blob, slot) => {
    // A replaced <video> may still be reading the old blob, so revoke it a moment later.
    if (live.has(slot)) { const old = live.get(slot); setTimeout(() => URL.revokeObjectURL(old), 2000); }
    const u = URL.createObjectURL(blob);
    live.set(slot, u);
    return u;
  };
}

function media(box, kind, url, { controls = true } = {}) {
  const el = h(kind === "image" ? "img" : "video", { class: "ff-fill" });
  if (kind === "image") Object.assign(el, { src: url, alt: "FFmpeg 輸出" });
  else {
    el.muted = true; el.defaultMuted = true;
    Object.assign(el, { preload: "auto", loop: true, autoplay: true, playsInline: true, controls, src: url });
  }
  box.querySelector(".ff-view").replaceChildren(el);
  return el;
}

// ---------- core download (shared) and one FFmpeg instance per scene ----------------------
let coreJob = null, coreGot = 0, coreReady = false;
// toBlobURL's progress mode compares Content-Length with decoded bytes and fails on compressed CDN
// responses, so stream the big wasm file ourselves to show progress.
async function wasmBlobURL(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`下載失敗 HTTP ${res.status}`);
  const reader = res.body.getReader(), chunks = [];
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    coreGot += value.length;
  }
  return URL.createObjectURL(new Blob(chunks, { type: "application/wasm" }));
}
function fetchCore() {
  if (!coreJob) {
    coreJob = Promise.all([toBlobURL(`${CORE}/ffmpeg-core.js`, "text/javascript"), wasmBlobURL(`${CORE}/ffmpeg-core.wasm`)])
      .then(([coreURL, wasmURL]) => {
        coreReady = true;
        // The worker must be same-origin, so wrap the CDN worker module in a blob that imports it.
        const classWorkerURL = URL.createObjectURL(new Blob([`import "${FF}/worker.js";`], { type: "text/javascript" }));
        return { coreURL, wasmURL, classWorkerURL };
      });
    coreJob.catch(() => { coreJob = null; coreGot = 0; });
  }
  return coreJob;
}

async function boot(ctx) {
  if (!coreJob) await ctx.gate({ ...GATE, tags: ["約 31 MB", "WebAssembly", "Web Worker"], button: "下載 FFmpeg（約 31 MB）並開始" });
  const st = ctx.status(coreReady ? "初始化 WebAssembly…" : "下載 FFmpeg 核心中…");
  ctx.interval(() => {
    if (coreReady) return;
    st.progress(coreGot / WASM_BYTES);
    st.text(`下載 FFmpeg 核心 ${(coreGot / 1048576).toFixed(1)} / ${(WASM_BYTES / 1048576).toFixed(1)} MB`);
  }, 150);
  try {
    const core = await fetchCore();
    if (!ctx.active) throw abortError();
    st.progress(1);
    st.text("初始化 WebAssembly…");
    const ff = new FFmpeg();
    ctx.onCleanup(() => ff.terminate());
    await ff.load(core);
    if (!ctx.active) throw abortError();
    st.done();
    return session(ctx, ff);
  } catch (e) {
    if (!ctx.active || isAbort(e)) throw abortError();
    st.error(`FFmpeg 載入失敗：${e.message || e}`);
    throw e;
  }
}

// Thin wrapper: terminate() during a call rejects with a plain Error, so turn that into AbortError.
function session(ctx, ff) {
  const guard = (fn) => Promise.resolve().then(fn).catch((e) => { throw ctx.active ? e : abortError(); });
  const S = {
    ff,
    async exec(args) {
      const t0 = performance.now();
      // The log level is global in the wasm module and probe() leaves it at "error", so reset it every call.
      const code = await guard(() => ff.exec(["-v", "info", ...args]));
      if (!ctx.active) throw abortError();
      if (code !== 0) throw new Error(`FFmpeg 結束碼 ${code}`);
      return performance.now() - t0;
    },
    write: (p, d) => guard(() => ff.writeFile(p, d)),
    read: (p, enc) => guard(() => ff.readFile(p, enc)),
    del: (p) => guard(() => ff.deleteFile(p)),
    ls: (p) => guard(() => ff.listDir(p)),
    // ffprobe returns a non-zero code even on success here, but the JSON file is complete.
    async probe(file) {
      await guard(() => ff.ffprobe(["-v", "error", "-show_entries", "format=duration,format_name:stream=codec_type,codec_name,width,height,sample_rate,channels",
        "-of", "json", file, "-o", "probe.json"]));
      const j = JSON.parse(await S.read("probe.json", "utf8"));
      await S.del("probe.json");
      const streams = j.streams || [];
      return { dur: +(j.format && j.format.duration) || 0, format: j.format && j.format.format_name, v: streams.find((s) => s.codec_type === "video"), a: streams.find((s) => s.codec_type === "audio") };
    },
    // The 3-second MediaRecorder clip, written into this instance's file system.
    async input() {
      if (!coreReady || recProgress() < 1) {
        const st = ctx.status("用 MediaRecorder 錄製 3 秒畫布動畫當素材…");
        ctx.interval(() => st.progress(recProgress()), 100);
        try { await recording(); } finally { st.done(); }
      }
      const r = await recording();
      if (!ctx.active) throw abortError();
      const name = `in.${r.ext}`;
      await S.write(name, new Uint8Array(await r.blob.arrayBuffer()));
      return { name, blob: r.blob, mime: r.mime };
    },
  };
  return S;
}

const probeText = (p) => [
  p.v && `<b>${p.v.codec_name} ${p.v.width}×${p.v.height}</b>`,
  p.a && `<b>${p.a.codec_name}</b> ${p.a.sample_rate} Hz${p.a.channels ? `／${p.a.channels} 聲道` : ""}`,
  p.dur ? `<b>${p.dur.toFixed(2)} s</b>` : "時長未記錄",
].filter(Boolean).join("・");

// ---------- scene 1: the original audio presets ------------------------------------------
const PRESETS = [
  { name: "波形影片", out: "waves.mp4", kind: "video", dur: (d) => Math.min(6, d),
    args: (i) => ["-i", i, "-t", "6", "-filter_complex",
      "[0:a]showwaves=s=640x240:mode=cline:rate=25:scale=sqrt:split_channels=1:colors=0xf7df1e|0x4cc9f0,format=yuv420p[v]",
      "-map", "[v]", "-map", "0:a", "-c:v", "libx264", "-preset", "ultrafast", "-crf", "28", "-c:a", "aac", "-b:a", "128k", "-shortest", "-movflags", "+faststart", "waves.mp4"] },
  { name: "頻譜 GIF", out: "spectrum.gif", kind: "image", dur: (d) => Math.min(4, d),
    args: (i) => ["-i", i, "-t", "4", "-filter_complex",
      "[0:a]showspectrum=s=320x160:slide=scroll:overlap=0.8:scale=cbrt:color=fire,fps=12,split[a][b];[a]palettegen=max_colors=64[p];[b][p]paletteuse", "spectrum.gif"] },
  { name: "剪輯淡出", out: "trim.mp3", kind: "audio", dur: (d) => Math.min(6, Math.max(0, d - 3)),
    args: (i) => ["-ss", "3", "-t", "6", "-i", i, "-af", "afade=t=in:d=1,afade=t=out:st=5:d=1", "-c:a", "libmp3lame", "-b:a", "128k", "trim.mp3"] },
  { name: "1.5 倍速", out: "fast.mp3", kind: "audio", dur: (d) => d / 1.5,
    args: (i) => ["-i", i, "-vn", "-af", "atempo=1.5", "-c:a", "libmp3lame", "-b:a", "128k", "fast.mp3"] },
  { name: "倒放", out: "reverse.mp3", kind: "audio", dur: (d) => d,
    args: (i) => ["-i", i, "-vn", "-af", "areverse", "-c:a", "libmp3lame", "-b:a", "128k", "reverse.mp3"] },
  { name: "山谷回音", out: "echo.mp3", kind: "audio", dur: (d) => d,
    args: (i) => ["-i", i, "-vn", "-af", "aecho=0.8:0.85:160|280:0.45|0.3", "-c:a", "libmp3lame", "-b:a", "128k", "echo.mp3"] },
];

// ---------- scene 3 / 6 option lists -----------------------------------------------------
const FILTERS = [
  { label: "裁中央再放大", vf: "crop=iw/2:ih/2,scale=640:-2:flags=lanczos" },
  { label: "直式 9:16", vf: "crop=ih*9/16:ih,scale=270:480" },
  { label: "像素化", vf: "scale=iw/10:-2,scale=640:-2:flags=neighbor" },
  { label: "鏡像＋轉 90°", vf: "hflip,transpose=1" },
  { label: "色相旋轉", vf: "hue=H=2*PI*t/3:s=1.4,eq=contrast=1.25" },
  { label: "邊緣偵測", vf: "edgedetect=mode=colormix:high=0.2" },
  { label: "模糊＋暗角", vf: "boxblur=8:2,vignette=PI/4" },
  { label: "左右對照", vf: "split[a][b];[b]hflip,lutrgb=r=negval:g=negval:b=negval[c];[a][c]hstack,scale=640:-2" },
];
const XFADES = ["fade", "wipeleft", "slideup", "circleopen", "dissolve", "pixelize"];

Showcase.run({ scenes: [
  {
    id: "studio", title: "音效工作台",
    api: 'ffmpeg.exec(["-i", "in.mp3", "-af", "aecho=…", "echo.mp3"])',
    desc: "完整的 FFmpeg 指令列在 Web Worker 裡跑：六個範例處理同一段 19 秒音樂，輸出波形影片、頻譜 GIF 或 MP3。進度條來自 progress 事件，下方是 FFmpeg 原生日誌，結果再用 ffprobe 讀回驗證。",
    hint: "選範例後按「執行」，也可以換成自己的檔案",
    async mount(ctx) {
      ctx.html(`<div class="ff-wrap ff-stack">
        <div class="ff-card"><div class="ff-view"><div class="ff-empty">FFmpeg 載入後會自動執行第一個範例</div></div>
          <span class="ff-tag">來源：loop.mp3（19 秒音樂）</span><div class="ff-info top"></div><div class="ff-meter"><i></i></div></div>
        <pre class="ff-term"></pre></div>`);
      let cur = 0, busy = false, input = "in.mp3", inputDur = 19, expected = 1, lines = [], redraw = null;
      ctx.select("", PRESETS.map((p, i) => ({ value: i, label: p.name })), 0, (v) => { cur = +v; paintCmd(); });
      const runBtn = ctx.button("執行", () => go(), { primary: true });
      const file = h("input", { type: "file", accept: "audio/*,video/*" });
      file.hidden = true;
      ctx.controls.append(h("label", { class: "btn", title: "檔案只在瀏覽器內處理，不會上傳" }, "換成自己的檔案", file));
      const card = ctx.$(".ff-card"), tag = ctx.$(".ff-tag"), info = ctx.$(".ff-info"), meter = ctx.$(".ff-meter i"), term = ctx.$(".ff-term");
      const make = urls(ctx);
      const paint = () => { term.innerHTML = lines.map((l, i) => (i ? esc(l) : `<b>$ ${esc(l)}</b>`)).join("\n"); term.scrollTop = term.scrollHeight; };
      const paintCmd = () => { lines = [cmdLine(PRESETS[cur].args(input))]; paint(); };
      const setBusy = (v) => { busy = v; runBtn.disabled = v; file.disabled = v; };
      ctx.onResize(() => redraw && redraw());
      setBusy(true);
      paintCmd();
      const S = await boot(ctx);
      S.ff.on("log", ({ message }) => {
        if (message === "Aborted()" || !busy) return; // "Aborted()" is the normal exit marker of the wasm build
        lines.push(message);
        if (lines.length > 160) lines.splice(1, lines.length - 120);
        paint();
      });
      // progress.time is the output timestamp in microseconds (progress.progress is unreliable here).
      S.ff.on("progress", ({ time }) => { if (busy) meter.style.width = `${Math.min(100, (time / 1e6 / expected) * 100)}%`; });
      await S.write(input, await fetchFile("_shared/audio/loop.mp3"));

      async function go() {
        if (busy) return;
        const p = PRESETS[cur];
        setBusy(true);
        expected = Math.max(0.1, p.dur(inputDur));
        paintCmd();
        meter.style.width = "0";
        info.textContent = `執行中：${p.name}…`;
        try {
          const ms = await S.exec(p.args(input));
          const data = await S.read(p.out);
          const pr = await S.probe(p.out);
          await S.del(p.out);
          const blob = blobOf(data, p.out), url = make(blob, "out");
          redraw = null;
          if (p.kind === "audio") {

    async mount(ctx) {
      ctx.html(`<div class="ff-wrap ff-two">
        <pre class="ff-pane tree"></pre>
        <div class="ff-col"><pre class="ff-pane view">點左邊的檔案查看內容</pre><pre class="ff-pane ops"></pre></div></div>`);
      const SYS = new Set(["tmp", "home", "dev", "proc"]);
      const tree = ctx.$(".tree"), view = ctx.$(".view"), ops = ctx.$(".ops");
      const opLines = [];
      let busy = false, selected = "";
      const op = (text, ms) => {
        opLines.push(`<b>${esc(text)}</b>${ms != null ? `  ${fmtMs(ms)}` : ""}`);
        ops.innerHTML = `<h4>API 呼叫紀錄</h4>${opLines.slice(-14).join("\n")}`;
        ops.scrollTop = ops.scrollHeight;
      };
      const act = (label, fn) => ctx.button(label, async () => {
        if (busy) return;
        busy = true;
        try { await fn(); await paintTree(); } catch (e) { if (!isAbort(e) && ctx.active) op(`失敗：${e.message}`); } finally { busy = false; }
      });
      const S = await boot(ctx);
      const timed = async (text, fn) => { const t0 = performance.now(); const r = await fn(); op(text, performance.now() - t0); return r; };
      const exists = async (dir, name) => (await S.ls(dir)).some((n) => n.name === name);
      async function paintTree() {
        const out = [];
        async function walk(dir, depth) {
          const items = (await S.ls(dir)).filter((n) => n.name !== "." && n.name !== "..");
          items.sort((a, b) => b.isDir - a.isDir || a.name.localeCompare(b.name));
          for (const n of items) {
            const p = dir === "/" ? `/${n.name}` : `${dir}/${n.name}`, pad = "  ".repeat(depth);
            if (n.isDir) {
              const sys = depth === 0 && SYS.has(n.name);
              out.push(`<span class="ff-file">${pad}${esc(n.name)}/${sys ? ' <i>系統資料夾</i>' : ""}</span>`);
              if (!sys) await walk(p, depth + 1);
            } else {
              const size = (await S.read(p)).length;
              out.push(`<span class="ff-file${p === selected ? " on" : ""}" data-p="${esc(p)}">${pad}${esc(n.name)} <em>${kb(size)}</em></span>`);
            }
          }
        }
        await walk("/", 0);
        tree.innerHTML = `<h4>listDir("/") 遞迴結果</h4>${out.join("")}`;
      }
      async function show(p) {
        selected = p;
        tree.querySelectorAll(".ff-file").forEach((x) => x.classList.toggle("on", x.dataset.p === p));
        if (/\.(m3u8|txt)$/.test(p)) {
          view.innerHTML = `<h4>readFile("${esc(p)}", "utf8")</h4>${esc(await S.read(p, "utf8"))}`;
          if (p.endsWith(".m3u8")) {
            const dir = p.slice(0, p.lastIndexOf("/")), segs = (await S.ls(dir)).filter((n) => n.name.endsWith(".ts"));
            const lines = [];
            for (const n of segs) { const pr = await S.probe(`${dir}/${n.name}`); lines.push(`${n.name}  ${pr.v ? `${pr.v.codec_name} ${pr.v.width}x${pr.v.height}` : ""}  ${pr.dur.toFixed(2)} s`); }
            view.innerHTML += `\n<h4>ffprobe 讀回每個切片</h4>${lines.join("\n")}`;
          }
        } else {
          const pr = await S.probe(p);
          view.innerHTML = `<h4>ffprobe ${esc(p)}</h4>格式 ${esc(pr.format || "?")}\n${pr.v ? `影像 ${pr.v.codec_name} ${pr.v.width}x${pr.v.height}\n` : ""}${pr.a ? `音訊 ${pr.a.codec_name} ${pr.a.sample_rate} Hz\n` : ""}時長 ${pr.dur ? pr.dur.toFixed(2) + " s" : "未記錄"}`;
        }
      }
      ctx.on(tree, "click", (e) => {
        const f = e.target.closest("[data-p]");
        if (f && !busy) { busy = true; show(f.dataset.p).catch((err) => !isAbort(err) && ctx.active && (view.textContent = `失敗：${err.message}`)).finally(() => (busy = false)); }
      });
      async function hls() {
        if (!(await exists("/", "work"))) await timed('createDir("/work")', () => S.ff.createDir("/work"));
        if (await exists("/work", "hls")) await clearDir("/work/hls");
        await timed('createDir("/work/hls")', () => S.ff.createDir("/work/hls"));
        const ms = await S.exec(["-i", src.name, "-r", "30", ...X264, "-g", "30", "-f", "hls", "-hls_time", "1", "-hls_list_size", "0",
          "-hls_segment_filename", "/work/hls/seg_%02d.ts", "/work/hls/index.m3u8"]);
        op("exec(-f hls -hls_time 1 … /work/hls/index.m3u8)", ms);
        await show("/work/hls/index.m3u8");
      }
      async function clearDir(dir) {
        for (const n of await S.ls(dir)) {
          if (n.name === "." || n.name === "..") continue;
          const p = `${dir}/${n.name}`;
          if (n.isDir) await clearDir(p);
          else await timed(`deleteFile("${p}")`, () => S.del(p));
        }
        await timed(`deleteDir("${dir}")`, () => S.ff.deleteDir(dir));
      }
      act("寫入 note.txt", async () => {
        if (!(await exists("/", "work"))) await timed('createDir("/work")', () => S.ff.createDir("/work"));
        const text = `這個檔案在 ${new Date().toLocaleTimeString("zh-TW")} 用 writeFile 寫入 MEMFS。\n`;
        await timed('writeFile("/work/note.txt", text)', () => S.write("/work/note.txt", text));
        await show("/work/note.txt");
      });
      act("改名", async () => {
        if (!(await exists("/", "work"))) return op("找不到 /work，請先寫入檔案");
        const has = await exists("/work", "note.txt");
        const [a, b] = has ? ["/work/note.txt", "/work/renamed.txt"] : ["/work/renamed.txt", "/work/note.txt"];
        if (!has && !(await exists("/work", "renamed.txt"))) return op("沒有 note.txt 可以改名");
        await timed(`rename("${a}", "${b}")`, () => S.ff.rename(a, b));
        await show(b);
      });
      act("HLS 切片", hls);
      act("刪除 /work", async () => {
        if (await exists("/", "work")) await clearDir("/work");
        selected = "";
        view.textContent = "/work 已刪除";
      });
      busy = true;
      const src = await S.input();
      op(`writeFile("/${src.name}", 錄影 ${kb(src.blob.size)})`);
      await timed('createDir("/work")', () => S.ff.createDir("/work"));
      await timed('writeFile("/work/note.txt", text)', () => S.write("/work/note.txt", "MEMFS 裡的文字檔，可以用 rename 改名。\n"));
      await hls();
      await paintTree();
      busy = false;
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: 'ffmpeg.exec(["-f", "lavfi", "-i", "testsrc2=s=WxH:r=30:d=2", "-c:v", "libx264", …])',
    desc: "逐級放大解析度，每級用 lavfi 的 testsrc2 產生 2 秒、30 fps 的測試影片並編碼，量單執行緒 WebAssembly 版 FFmpeg 的轉碼速度。2 秒內完成代表比即時快；超過 15 秒就停止加大。",
    hint: "選編碼器後按「開始測試」",
    async mount(ctx) {
      ctx.html(`<div class="ff-bench"><div class="ff-card"><div class="ff-view"><div class="ff-empty">按「開始測試」後，每一級的輸出都可以在這裡播放</div></div>
        <span class="ff-tag">輸出預覽</span><div class="ff-chips"></div></div></div>`);
      ctx.controls.classList.add("bottom");
      const CODECS = [
        { name: "H.264", ext: "mp4", args: [...X264] },
        { name: "VP8", ext: "webm", args: ["-c:v", "libvpx", "-deadline", "realtime", "-cpu-used", "8", "-b:v", "4M"] },
      ];
      let codec = 0;
      const S = await boot(ctx);
      ctx.group(CODECS.map((c) => c.name), 0, (i) => (codec = i));
      const SIZES = [320, 640, 1280, 1920, 2560, 3840];
      const card = ctx.$(".ff-card"), tag = ctx.$(".ff-tag"), chips = ctx.$(".ff-chips"), make = urls(ctx);
      const H = (w) => Math.round((w * 9) / 16 / 2) * 2;
      // Large outputs stream into <video> in chunks, so a level is only played when picked (the first one
      // auto-plays); swapping a half-loaded 4K video on every level would just abort its reads.
      const show = (b, url, text) => {
        chips.querySelectorAll(".btn").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        media(card, "video", url);
        tag.textContent = text;
      };
      ctx.bench({
        label: "解析度", sizes: SIZES, target: 2000, budget: 15000,
        format: (n) => `${n}×${H(n)}`,
        prepare(n) {
          if (n === SIZES[0]) chips.replaceChildren();
          tag.textContent = `編碼中：${n}×${H(n)}・${CODECS[codec].name}`;
          return CODECS[codec];
        },
        async run(n, c) {
          const out = `bench.${c.ext}`;
          const ms = await S.exec(["-f", "lavfi", "-i", `testsrc2=s=${n}x${H(n)}:r=30:d=2`, ...c.args, out]);
          const data = await S.read(out);
          await S.del(out);
          const url = make(blobOf(data, out), `${c.ext}${n}`), text = `${n}×${H(n)}・${c.name}・${kb(data.length)}`;
          const b = h("button", { class: "btn", type: "button", "aria-pressed": "false", text: `${H(n)}p` });
          b.addEventListener("click", () => show(b, url, text));
          chips.append(b);
          if (n === SIZES[0]) show(b, url, text);
          else tag.textContent = `完成 ${n}×${H(n)}（${kb(data.length)}），點下方按鈕播放各級輸出`;
          return `${(2000 / ms).toFixed(2)}× 即時・${(60 / (ms / 1000)).toFixed(0)} fps`;
        },
        note: "時間包含 testsrc2 產生畫面、編碼與讀回輸出檔，都在同一條 Worker 執行緒裡跑（單執行緒核心，不需要 SharedArrayBuffer 與跨來源隔離標頭）。H.264 用 ultrafast preset、VP8 用 realtime 模式；結果列的倍率是「影片長度 ÷ 處理時間」。",
      });
    },
  },
] });
</script>
</body>
</html>
