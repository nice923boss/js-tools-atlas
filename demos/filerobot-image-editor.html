// Filerobot Image Editor 4.9.1 showcase: a full React + Konva photo editor mounted into plain divs.

const PHOTO = (n) => `_shared/img/photo-${n}.jpg`;
const fmtBytes = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(2)} MB` : `${(n / 1024).toFixed(1)} KB`);
const toBlob = (canvas, type, q) => new Promise((resolve, reject) =>
  canvas.toBlob((b) => (b ? resolve(b) : reject(new Error(`無法編碼 ${type}`))), type, q));

// UI strings: Filerobot reads overrides from `translations` (keys from its default English dictionary).
const ZH = {

  changesLoseWarningHint: "按下重設後，目前的修改會消失，確定要繼續嗎？", discardChangesWarningHint: "關閉後，最後一次修改不會保存。",

  undoTitle: "復原", redoTitle: "重做", showImageTitle: "按住查看原圖", zoomInTitle: "放大", zoomOutTitle: "縮小", toggleZoomMenuTitle: "縮放選單",

  arrowTool: "箭頭", blurTool: "模糊", brightnessTool: "亮度", contrastTool: "對比", ellipseTool: "橢圓",
  unFlipX: "取消水平翻轉", flipX: "水平翻轉", unFlipY: "取消垂直翻轉", flipY: "垂直翻轉", hsvTool: "色相飽和", hue: "色相",
  brightness: "亮度", saturation: "飽和度", value: "明度", imageTool: "圖片", importing: "匯入中", addImage: "＋ 加入圖片",
  uploadImage: "上傳圖片", fromGallery: "從圖庫", lineTool: "直線", penTool: "畫筆", polygonTool: "多邊形", sides: "邊數",

  addWatermarkAsText: "以文字加入", padding: "內距", paddings: "內距", shadow: "陰影", horizontal: "水平", vertical: "垂直",
  blur: "模糊", opacity: "不透明度", transparency: "透明度", position: "位置", stroke: "外框", saveAsModalTitle: "另存新檔",

  width: "寬", height: "高", cropItemNoEffect: "這個裁切項目沒有預覽",
  // custom keys used by the social-media crop presets (scene 4)
  socialMedia: "社群媒體", instagram: "Instagram", igPost: "IG 貼文", igStory: "IG 限時動態", facebook: "Facebook",
  fbCover: "FB 粉專封面", youtube: "YouTube", ytThumb: "YouTube 縮圖",
};

// Dark palette so the editor matches the atlas; keys come from @scaleflex/ui.
const DARK = {
  "txt-primary": "#ecebe6", "txt-secondary": "#b9b7ae", "txt-secondary-invert": "#1a1a14", "txt-placeholder": "#7d7b73",
  "accent-primary": "#f7df1e", "accent-primary-hover": "#ffe94d", "accent-primary-active": "#e9d000", "accent-stateless": "#f7df1e",
  "bg-primary": "#171a1f", "bg-secondary": "#0e1013", "bg-stateless": "#1f232a", "bg-primary-light": "#1f232a",
  "bg-primary-hover": "#252a32", "bg-primary-active": "#2c313a", "bg-hover": "#252a32", "bg-active": "#2c313a",
  "bg-grey": "#2c313a", "bg-base-light": "#1f232a", "bg-base-medium": "#2c313a", "bg-tooltip": "#2c313a",
  "icon-primary": "#ecebe6", "icons-secondary": "#b9b7ae", "icons-placeholder": "#7d7b73", "icons-muted": "#7d7b73",
  "icons-primary-hover": "#ffffff", "icons-secondary-hover": "#ffffff", "icons-invert": "#1a1a14",
  "btn-primary-text": "#1a1a14", "btn-secondary-text": "#ecebe6", "btn-disabled-text": "#7d7b73",
  "link-primary": "#ecebe6", "link-stateless": "#ecebe6", "link-hover": "#f7df1e", "link-active": "#f7df1e", "link-muted": "#9b998f",
  "borders-primary": "#3a3f48", "borders-secondary": "#2c313a", "borders-strong": "#4a505a", "borders-button": "#3a3f48",
  "borders-item": "#2c313a", "border-primary-stateless": "#3a3f48", "borders-base-light": "#2c313a", "borders-base-medium": "#3a3f48",
  "active-secondary": "#2c313a", "active-secondary-hover": "#343a44",
};
const accentPalette = (a, hover, active) => ({ ...DARK, "accent-primary": a, "accent-primary-hover": hover, "accent-primary-active": active,
  "accent-stateless": a, "link-hover": a, "link-active": a });

const BASE = () => ({
  language: "en", translations: ZH, useBackendTranslations: false,
  theme: { palette: DARK, typography: { fontFamily: getComputedStyle(document.body).fontFamily } },
  savingPixelRatio: 1, previewPixelRatio: Math.min(window.devicePixelRatio || 1, 2),
  observePluginContainerSize: true, avoidChangesNotSavedAlertOnLeave: true,
  defaultSavedImageName: "filerobot-edit", defaultSavedImageType: "png",
  annotationsCommon: { fill: "#f7df1e", stroke: "#f7df1e" },
  Text: { text: "輸入文字", fontSize: 48, fontFamily: "sans-serif", fonts: [{ label: "黑體", value: "sans-serif" }, { label: "明體", value: "serif" }, { label: "等寬", value: "monospace" }] },
  Rotate: { angle: 90, componentType: "slider" },
});

// One editor per host; opening again terminates the previous instance, and the scene cleanup terminates the last one.
function editorSlot(ctx, host) {
  const slot = { ed: null };
  slot.close = () => { if (slot.ed) { slot.ed.terminate(); slot.ed = null; } };
  slot.open = (cfg) => {
    slot.close();
    const ed = new FilerobotImageEditor(host, { ...BASE(), ...cfg });
    ed.render();
    slot.ed = ed;
    return ed;
  };
  ctx.onCleanup(slot.close);
  return slot;
}

// updateState(fn) hands fn the editor's internal state. Poll until the image is laid out (same fitted width twice
// in a row), then let `patch(state)` return parts that live in shown-image units (crop boxes, annotations).
function ready(slot, ed, patch, every = 120, tries = 100) {
  return new Promise((resolve, reject) => {
    let done = false, n = 0, last = -1;
    const tick = () => {
      if (done || slot.ed !== ed) return;
      ed.updateState((st) => {
        const s = st.shownImageDimensions;
        if (done || st.isLoadingGlobally || !s || !s.width || !st.canvasWidth || s.width > st.canvasWidth + 1) return null;
        const stable = Math.abs(s.width - last) < 0.5;
        last = s.width;
        if (!stable) return null;
        done = true;
        resolve(st);
        return patch ? patch(st) : null;
      });
      if (++n > tries) { done = true; reject(new Error("圖片載入逾時，無法套用示範設定")); } else setTimeout(tick, every);
    };
    tick();
  });
}
const readState = (ed) => new Promise((resolve) => ed.updateState((st) => { resolve(st); return null; }));

// Design-state summary; works for onModify (functions inside) and saved designState (names only).
const nameOf = (x) => (typeof x === "string" ? x : x && (x.filterName || x.finetuneName || x.name)) || "";
function summary(s) {
  const ann = Object.values(s.annotations || {});
  const crop = s.adjustments && s.adjustments.crop;
  const kinds = {};
  ann.forEach((a) => { kinds[a.name] = (kinds[a.name] || 0) + 1; });
  return {
    filter: nameOf(s.filter) || "無",
    tunes: (s.finetunes || []).map(nameOf).filter(Boolean).join("・") || "無",
    ann: ann.length ? Object.entries(kinds).map(([k, v]) => `${k}×${v}`).join(" ") : "無",
    crop: crop && crop.width ? `${typeof crop.ratio === "number" ? crop.ratio.toFixed(2) : crop.ratio || "自由"}・${Math.round(crop.width)}×${Math.round(crop.height)}` : "未裁切",
  };
}

const board = (side) => `<div class="fr-board"><div class="fr-ed"><div class="fr-host"></div></div><div class="panel fr-side">${side}</div></div>`;
const kv = (pairs) => `<div class="fr-kv">${pairs.map(([k, label, cls = ""]) => `<span>${label}</span><b data-k="${k}" class="${cls}">…</b>`).join("")}</div>`;
const setKv = (ctx, vals) => { for (const [k, v] of Object.entries(vals)) { const el = ctx.$(`[data-k="${k}"]`); if (el) el.textContent = v; } };
const say = (ctx, text) => { const el = ctx.$(".fr-msg"); if (el) el.textContent = text; };
const OUT = (label = "下載 PNG") => `<div class="fr-thumb fr-tall"><img alt="輸出預覽"></div>${kv([["out", "輸出"]])}<a class="btn primary fr-dl" aria-disabled="true">${label}</a>`;

// One revocable object URL slot per scene.
function blobSlot(ctx) {
  let url = null;
  ctx.onCleanup(() => url && URL.revokeObjectURL(url));
  return (blob) => { if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(blob); return url; };
}
// Export: getCurrentImgData renders the full design at pixelRatio 1, then the canvas becomes a Blob URL for the link.
function exporter(ctx) {
  const slot = blobSlot(ctx);
  const show = async (imageData, designState) => {
    const cv = imageData.imageCanvas;
    const blob = await toBlob(cv, imageData.mimeType, /jpe?g|webp/.test(imageData.mimeType) ? 0.9 : undefined);
    if (!ctx.active) return null;
    const url = slot(blob);
    const img = ctx.$(".fr-thumb img"), a = ctx.$(".fr-dl");
    if (img) img.src = url;
    if (a) { a.href = url; a.download = imageData.fullName; a.removeAttribute("aria-disabled"); }
    setKv(ctx, { out: `${cv.width}×${cv.height}・${fmtBytes(blob.size)}` });
    return { url, blob, imageData, designState };
  };
  show.from = (ed, name = "filerobot-edit", extension = "png") => {
    const { imageData, designState } = ed.getCurrentImgData({ name, extension }, 1);
    if (!imageData || !imageData.imageCanvas) throw new Error("圖片尚未載入完成");
    return show(imageData, designState);
  };
  return show;
}
// "Choose your own image" button: local File -> object URL, never uploaded.
function filePicker(ctx, onUrl) {
  const input = h("input", { type: "file", accept: "image/*", hidden: true });
  ctx.el.append(input);
  let url = null;
  ctx.on(input, "change", () => {
    const f = input.files[0];
    if (!f) return;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(f);
    input.value = "";
    onUrl(url, f.name);
  });
  ctx.onCleanup(() => url && URL.revokeObjectURL(url));
  return ctx.button("選擇自己的圖片", () => input.click(), { title: "從本機選圖，不會上傳" });
}
const guard = (ctx, p) => p.catch((e) => { if (ctx.active) { say(ctx, e.message); console.warn(e); } });

// Annotations are stored in shown-image units, so they are authored for a 1200 px wide image and scaled by k.
const SCALED = ["x", "y", "radiusX", "radiusY", "width", "height", "fontSize", "letterSpacing",
  "strokeWidth", "pointerLength", "pointerWidth", "shadowBlur", "shadowOffsetX", "shadowOffsetY", "cornerRadius"];
function scaleAnn(a, k) {
  const out = { ...a };
  SCALED.forEach((p) => { if (typeof a[p] === "number") out[p] = a[p] * k; });
  if (a.points) out.points = a.points.map((v) => v * k);
  return out;
}
const scaleAll = (anns, k) => Object.fromEntries(Object.entries(anns).map(([id, a]) => [id, scaleAnn({ ...a, id }, k)]));
const TXT = { name: "Text", fontFamily: "sans-serif", fontStyle: "bold", align: "left", letterSpacing: 0, lineHeight: 1, stroke: "#000000",
  strokeWidth: 0, shadowColor: "#000000", shadowOffsetX: 0, shadowOffsetY: 2, opacity: 1 };
const TRIP = {
  title: { ...TXT, x: 48, y: 44, text: "第一天．峽灣晨光", fontSize: 64, fill: "#ffffff", letterSpacing: 2, width: 640, height: 76, shadowBlur: 12, shadowOpacity: 0.6 },
  spot: { name: "Ellipse", x: 420, y: 615, radiusX: 175, radiusY: 70, fill: "rgba(0,0,0,0)", stroke: "#f7df1e", strokeWidth: 6, opacity: 1 },
  arrow: { name: "Arrow", x: 0, y: 0, points: [760, 470, 580, 570], fill: "#f7df1e", stroke: "#f7df1e", strokeWidth: 8, pointerLength: 26, pointerWidth: 26, lineCap: "round", opacity: 1 },
  note: { ...TXT, x: 700, y: 405, text: "觀景台人潮", fontSize: 44, fill: "#f7df1e", width: 300, height: 52, shadowBlur: 10, shadowOpacity: 0.7 },
};
const kOf = (st) => st.shownImageDimensions.width / 1200;
function centerBox(W, H, r, cover = 1) {
  let w = W * cover, hh = w / r;
  if (hh > H * cover) { hh = H * cover; w = hh * r; }
  return { x: (W - w) / 2, y: (H - hh) / 2, width: w, height: hh };
}

// Watermark gallery images drawn on a page canvas (no external assets).
function logo(kind) {
  const c = document.createElement("canvas");
  c.width = 360; c.height = 120;
  const g = c.getContext("2d");
  g.textAlign = "center"; g.textBaseline = "middle";
  if (kind === 0) {
    g.fillStyle = "#f7df1e"; g.beginPath(); g.roundRect(6, 14, 348, 92, 46); g.fill();
    g.fillStyle = "#1a1a14"; g.font = "800 50px sans-serif"; g.fillText("JS ATLAS", 180, 62);
  } else if (kind === 1) {
    g.strokeStyle = "#ffffff"; g.lineWidth = 8; g.beginPath(); g.arc(60, 60, 48, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "#ffffff"; g.font = "700 60px serif"; g.fillText("©", 60, 64);
    g.font = "700 40px sans-serif"; g.textAlign = "left"; g.fillText("2026", 130, 62);
  } else {
    g.font = "900 64px sans-serif"; g.lineWidth = 6; g.strokeStyle = "#f72585"; g.strokeText("SAMPLE", 180, 62);
    g.fillStyle = "rgba(247,37,133,.25)"; g.fillText("SAMPLE", 180, 62);
  }
  return c.toDataURL("image/png");
}

Showcase.run({ scenes: [
  {
    id: "trip", title: "旅遊照標註",

        a.removeAttribute("aria-disabled");
        const v = summary(ds);
        setKv(ctx, { filter: v.filter, tunes: v.tunes, ann: v.ann, crop: v.crop, json: `${fmtBytes(text.length)}・${Object.keys(ds).length} 個欄位` });
        ctx.$(".fr-code").textContent = text.replace(/\s+/g, " ").slice(0, 600);
        say(ctx, `${via}：已保存圖片與設計`);
      };
      const open = (state, msg, patch) => {
        const ed = E.open({
          source: src, tabsIds: [TABS.ADJUST, TABS.FINETUNE, TABS.FILTERS, TABS.ANNOTATE, TABS.RESIZE], defaultTabId: TABS.ANNOTATE, defaultToolId: TOOLS.TEXT,
          loadableDesignState: state ? { ...state, imgSrc: src } : null,
          onBeforeSave: () => false,
          onSave: (img, ds) => guard(ctx, out(img, ds).then((o) => keep(o, "編輯器「儲存」"))),
        });
        say(ctx, "載入中…");
        return guard(ctx, ready(E, ed, patch).then(() => say(ctx, msg)).then(() => ed));
      };
      const save = () => guard(ctx, out.from(E.ed, "filerobot-design").then((o) => keep(o, "儲存設計")));
      // Start from a small edit so the first save already has something to restore.
      open({ filter: "Ludwig", finetunes: ["Warmth"], finetunesProps: { warmth: 10 } }, "已預先套用濾鏡與標註", (st) => ({
        annotations: scaleAll({ tag: { ...TXT, x: 60, y: 660, text: "存檔後還原，我還在這裡", fontSize: 50, fill: "#f7df1e", width: 760, height: 60, shadowBlur: 10, shadowOpacity: 0.7 },
          box: { name: "Rect", x: 40, y: 640, width: 800, height: 100, fill: "rgba(0,0,0,0.35)", stroke: "#f7df1e", strokeWidth: 4, cornerRadius: 14, opacity: 1 } }, kOf(st)),
      })).then((ed) => ed && ctx.sleep(120).then(save));
      ctx.button("儲存設計", save, { primary: true });
      ctx.button("還原上次儲存", () => { if (saved) open(saved, "已用 loadableDesignState 還原上次儲存的設計"); else say(ctx, "還沒有儲存過"); });
      ctx.button("清空重來", () => open(null, "已重新開啟原圖（上次儲存仍保留在右側）"));
      filePicker(ctx, (url) => { src = url; saved = null; open(null, "已載入自己的圖片，修改後按「儲存設計」"); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new FilerobotImageEditor(…).render() → 就緒 → getCurrentImgData({ extension: 'jpg' }, 1)",
    desc: "逐級加大來源圖長邊（由全景圖縮放成 2:1 的 JPEG），每一級都建立新的編輯器並套用 Clarendon 濾鏡，分別量「開啟到可編輯」與「以原始解析度輸出 JPEG」的耗時，看這個 React + Konva 編輯器能處理多大的照片。",
    hint: "按「開始測試」・每一級都會重新建立並銷毀編輯器",
    mount(ctx) {
      ctx.html(`<div class="fr-stress"><div class="fr-host"></div><div class="fr-idle">按「開始測試」後，每一級來源圖會在這裡開啟一次</div><div class="fr-tag">最近一次：<b>尚未測試</b></div></div>`);
      ctx.controls.classList.add("bottom");
      const E = editorSlot(ctx, ctx.$(".fr-host"));
      const tag = ctx.$(".fr-tag"), idle = ctx.$(".fr-idle");
      const urls = new Set();
      ctx.onCleanup(() => urls.forEach((u) => URL.revokeObjectURL(u)));
      let pano = null;
      const loadPano = () => pano || (pano = new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = () => reject(new Error("全景圖載入失敗"));
        im.src = "_shared/img/panorama.jpg";
      }));
      ctx.bench({
        label: "來源長邊", unit: "px", sizes: [1024, 2048, 4096, 6144, 8192, 10240, 12288],
        format: (n) => String(n), target: 3000, budget: 12000,
        async prepare(n) {
          const im = await loadPano();
          const cv = h("canvas", { width: n, height: n / 2 });
          cv.getContext("2d").drawImage(im, 0, 0, n, n / 2);
          const blob = await toBlob(cv, "image/jpeg", 0.9);
          cv.width = cv.height = 0;
          const url = URL.createObjectURL(blob);
          urls.add(url);
          return { url, size: blob.size };
        },
        async run(n, d) {
          idle.hidden = true;
          const t0 = performance.now();
          const ed = E.open({ source: d.url, tabsIds: [TABS.FILTERS, TABS.ADJUST], defaultTabId: TABS.FILTERS, defaultToolId: TOOLS.FILTERS,
            loadableDesignState: { imgSrc: d.url, filter: "Clarendon" } });
          await ready(E, ed, null, 40, 1000);
          const t1 = performance.now();
          const { imageData } = ed.getCurrentImgData({ name: "stress", extension: "jpg" }, 1);
          const t2 = performance.now();
          const ow = imageData.width, oh = imageData.height, bytes = imageData.imageBase64.length * 0.75;
          imageData.imageCanvas.width = imageData.imageCanvas.height = 0;
          URL.revokeObjectURL(d.url);
          urls.delete(d.url);
          tag.innerHTML = `最近一次：來源 <b>${n}×${n / 2}</b>（${fmtBytes(d.size)}）・開啟 <b>${fmtMs(t1 - t0)}</b>・輸出 <b>${ow}×${oh}</b> JPEG <b>${fmtMs(t2 - t1)}</b>・約 <b>${fmtBytes(bytes)}</b>`;
          return `開啟 ${fmtMs(t1 - t0)}・輸出 ${fmtMs(t2 - t1)}`;
        },
        note: "計時包含建立編輯器、解碼來源圖、Konva 排版與濾鏡快取，直到圖片尺寸連續兩次輪詢穩定（每 40 ms 一次）；再加上 getCurrentImgData 以原始解析度重繪並編碼成 JPEG base64。產生來源 JPEG 的時間不計入。",
      });
    },
  },
] });
</script>
</body>
</html>
