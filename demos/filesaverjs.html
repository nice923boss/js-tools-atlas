<script>
const { fmtMs, fmtCompact } = Showcase;
const enc = new TextEncoder();
const kb = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hx = (n) => n.toString(16).toUpperCase().padStart(2, "0");
const JSZIP_URL = "https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js";

// The same branch test FileSaver 2.0.5 runs once at load time (src/FileSaver.js).
const isMacOSWebView = /Macintosh/.test(navigator.userAgent) && /AppleWebKit/.test(navigator.userAgent) && !/Safari/.test(navigator.userAgent);
const BRANCH = "download" in HTMLAnchorElement.prototype && !isMacOSWebView ? "download" : "msSaveOrOpenBlob" in navigator ? "ms" : "popup";
const BOM_RX = /^\s*(?:text\/\S*|application\/xml|\S*\/\S*\+xml)\s*;.*charset\s*=\s*utf-8/i; // copied from FileSaver's bom()

// Call the real saveAs, but swallow the synthetic click on the <a> it creates. The page can then show exactly
// what FileSaver hands to the browser (download name, href, Blob) and no download is started.
async function inspectSave(...args) {
  if (BRANCH !== "download") return { unsupported: true };
  const rec = { a: null, blob: null, url: null, clickAt: null, syncMs: 0 };
  const ce = document.createElement, cou = URL.createObjectURL, t0 = performance.now();
  document.createElement = function (tag, opts) {
    const el = ce.call(document, tag, opts);
    if (!rec.a && String(tag).toLowerCase() === "a") { rec.a = el; el.dispatchEvent = () => { rec.clickAt = performance.now() - t0; return false; }; }
    return el;
  };
  URL.createObjectURL = function (obj) { const u = cou.call(URL, obj); if (!rec.url) { rec.blob = obj; rec.url = u; } return u; };
  try { saveAs(...args); } finally { rec.syncMs = performance.now() - t0; document.createElement = ce; URL.createObjectURL = cou; }
  for (let i = 0; i < 20 && rec.clickAt == null; i++) await new Promise((r) => setTimeout(r, 0)); // FileSaver clicks in setTimeout(0)
  return rec;
}
async function headBytes(blob, n = 8) { return new Uint8Array(await blob.slice(0, n).arrayBuffer()); }
const hexHtml = (u, bom = 0) => [...u].map((b, i) => `<i class="${i < bom ? "b" : ""}">${hx(b)}</i>`).join("");
const hasBom = (u) => u[0] === 0xef && u[1] === 0xbb && u[2] === 0xbf;

  stroke("#1f8fb8", 9, Array.from({ length: 60 }, (_, i) => [40 + i * 12, 380 + Math.sin(i / 4) * 26]));
  stroke("#1f8fb8", 6, Array.from({ length: 60 }, (_, i) => [40 + i * 12, 430 + Math.sin(i / 4 + 1.5) * 18]));

    mount(ctx) {

      box(0).querySelector("p").innerHTML = `要求 image/gif，實際得到 <b>${esc(gif.type)}</b>`;
      const urls = [];
      ctx.onCleanup(() => urls.forEach((u) => URL.revokeObjectURL(u)));
      const blobs = [];
      const FMT = [["image/png", "png"], ["image/jpeg", "jpg"], ["image/webp", "webp"]];
      let q = 0.8, seq = 0;
      async function run() {
        const my = ++seq;
        for (let i = 0; i < 3; i++) {
          const t0 = performance.now(), b = await toBlob(c, FMT[i][0], q), ms = performance.now() - t0;
          const bm = await createImageBitmap(b);
          if (my !== seq || !ctx.active) return;
          blobs[i] = b;
          const u = URL.createObjectURL(b); urls.push(u);
          const el = box(i + 1);
          el.querySelector(".pic").innerHTML = `<img src="${u}" alt="">`;
          el.querySelector("small").textContent = fmtMs(ms);
          el.querySelector("p").innerHTML = `<b>${kb(b.size)}</b><span class="fs-m">${esc(b.type)}</span><span class="fs-m">讀回 ${bm.width}×${bm.height}</span><button class="fs-mini" type="button" data-i="${i}">下載</button>`;
          bm.close();
        }
      }
      ctx.on(ctx.$(".fs-imgs"), "click", (e) => { const b = e.target.closest("[data-i]"); if (b && blobs[+b.dataset.i]) saveAs(blobs[+b.dataset.i], `canvas.${FMT[+b.dataset.i][1]}`); });
      ctx.slider("品質", { min: 0.1, max: 1, step: 0.05, value: q, format: (v) => v.toFixed(2) }, (v) => { q = v; run(); });
      run();
    },
  },

  // 6. JSZip builds the archive, FileSaver only hands the finished Blob over.
  {
    id: "zip", title: "搭配 JSZip",
    api: 'const blob = await zip.generateAsync({ type: "blob" }); saveAs(blob, "示範檔案.zip")',
    desc: "FileSaver 不管內容怎麼產生，常見搭配是 JSZip 把多個檔案壓成一個 Blob 再交給 saveAs。左邊是產生的 ZIP 用 loadAsync 讀回的內容，右邊是攔截 saveAs 看到的交付資訊。",
    hint: "右上「下載 ZIP」才會存檔・「重新打包」換一張塗鴉",
    async mount(ctx) {
      ctx.html(`<div class="fs-fill fs-zip"><div class="fs-card"><div class="fs-h">ZIP 內容（讀回）<small class="fs-zs">載入 JSZip…</small></div><div class="fs-pb"><i></i></div><div class="fs-body fs-zl"></div></div>
        <div class="fs-card"><div class="fs-h">交給 saveAs</div><div class="fs-body fs-kv fs-zr"></div></div></div>`);
      await ctx.load(JSZIP_URL);
      if (!ctx.active) return;
      const photo = await (await fetch("_shared/img/photo-4.jpg")).blob();
      let blob = null, n = 0;
      async function pack() {
        const cv = document.createElement("canvas"); cv.width = 800; cv.height = 500;
        const g = cv.getContext("2d"); sampleDoodle(g, 800, 500);
        g.fillStyle = "#d61f69"; g.font = `700 30px ${FONT}`; g.fillText(`第 ${++n} 次打包`, 40, 60);
        const zip = new JSZip();
        zip.file("會議筆記.txt", TXT);
        zip.file("資料/報名名單.csv", "\uFEFF" + CSV);
        zip.file("資料/settings.json", JSONTXT);
        zip.file("圖片/badge.svg", SVG);
        zip.file("圖片/塗鴉.png", await toBlob(cv, "image/png"));
        zip.file("圖片/照片.jpg", photo);
        const t0 = performance.now();
        blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" }, (m) => { ctx.$(".fs-pb i").style.width = `${m.percent}%`; });
        const ms = performance.now() - t0, back = await JSZip.loadAsync(blob), rows = [];
        for (const f of Object.values(back.files)) if (!f.dir) rows.push([f.name, (await f.async("uint8array")).length]);
        const rec = await inspectSave(blob, "示範檔案.zip");
        if (!ctx.active) return;
        const raw = rows.reduce((s, r) => s + r[1], 0);
        ctx.$(".fs-zs").textContent = `${rows.length} 個檔案・${fmtMs(ms)}`;
        ctx.$(".fs-zl").innerHTML = `<div class="hd"><span>路徑</span><small>原始</small><small></small></div>` + rows.map(([p, s]) => `<div><span>${esc(p)}</span><small>${kb(s)}</small><small></small></div>`).join("") +
          `<div><b>合計</b><small>${kb(raw)}</small><small>→ ${kb(blob.size)}</small></div>`;
        ctx.$(".fs-zr").innerHTML = rec.unsupported ? "<div><span>攔截</span><span>這個瀏覽器不走 download 屬性分支，不做攔截。</span></div>" : `
          <div><span>blob.type</span><span class="fs-m fs-ok">${esc(blob.type)}</span></div>
          <div><span>blob.size</span><span class="fs-m">${blob.size.toLocaleString()} bytes</span></div>
          <div><span>a.download</span><span class="fs-m">"${esc(rec.a.download)}"</span></div>
          <div><span>a.href</span><span class="fs-m">${esc(rec.url)}</span></div>
          <div><span>同一個 Blob</span><span class="fs-m fs-ok">${rec.blob === blob}</span><small>saveAs 不複製也不改內容，直接用你給的 Blob 建立網址</small></div>
          <div><span>開頭位元組</span><span class="fs-hex">${hexHtml(await headBytes(blob, 4))}</span><small>PK\\x03\\x04 是 ZIP 本地檔頭簽章</small></div>`;
      }
      ctx.button("重新打包", pack);
      ctx.button("下載 ZIP", () => blob && saveAs(blob, "示範檔案.zip"), { primary: true });
      pack();
    },
  },

  // 7. Stress: build ever larger Blobs, hand them to (intercepted) saveAs, then read every byte back.
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new Blob(chunks, { type })・saveAs(blob, name)・await blob.arrayBuffer()",
    desc: "逐級加大 Blob（1 MB 到 256 MB），量建立 Blob、呼叫 saveAs（攔截點擊，不下載）、再把整個 Blob 讀回並逐塊核對的總時間。右側表格拆開三段耗時。",
    hint: "按「開始測試」・右側可把最後一個 Blob 真的下載",
    mount(ctx) {
      ctx.html(`<div class="fs-stress"><div class="fs-card"><div class="fs-h">每一級的拆解<small class="fs-sl">尚未測試</small></div>
        <div class="fs-body"><table class="fs-tb"><thead><tr><th>大小</th><th>new Blob</th><th>saveAs</th><th>完整讀回</th><th class="w">讀回速度</th><th>核對</th></tr></thead><tbody></tbody></table>
        <div class="fs-kv fs-last" style="margin-top:10px"></div></div></div></div>`);
      const MB = 1048576, SIZES = [1, 4, 16, 32, 64, 128, 256];
      let lastBlob = null;
      const tbody = ctx.$(".fs-tb tbody");
      ctx.controls.classList.add("bottom");
      ctx.button("下載最後一個 Blob", () => lastBlob && saveAs(lastBlob, `壓力測試-${lastBlob.size / MB}MB.bin`));
      ctx.bench({
        label: "Blob 大小", unit: "MB", sizes: SIZES, target: 1000, budget: 3000,
        prepare(n) {
          const chunks = [];
          for (let i = 0; i < n; i++) { const u = new Uint8Array(MB); u.fill((i * 31) & 255); new DataView(u.buffer).setUint32(0, i); chunks.push(u); }
          return chunks;
        },
        async run(n, chunks) {
          if (n === SIZES[0]) { tbody.innerHTML = ""; lastBlob = null; }
          const t0 = performance.now(), blob = new Blob(chunks, { type: "application/octet-stream" }), t1 = performance.now();
          const rec = await inspectSave(blob, `壓力測試-${n}MB.bin`);
          const t2 = performance.now(), buf = await blob.arrayBuffer(), t3 = performance.now();
          const dv = new DataView(buf);
          let ok = buf.byteLength === n * MB;
          for (let i = 0; ok && i < n; i++) ok = dv.getUint32(i * MB) === i && dv.getUint8(i * MB + MB - 1) === ((i * 31) & 255);
          if (rec.url) URL.revokeObjectURL(rec.url);
          lastBlob = blob;
          tbody.insertAdjacentHTML("beforeend", `<tr><td>${n} MB</td><td>${fmtMs(t1 - t0)}</td><td>${rec.unsupported ? "－" : fmtMs(rec.syncMs)}</td><td>${fmtMs(t3 - t2)}</td><td class="w">${((n / (t3 - t2)) * 1000).toFixed(0)} MB/s</td><td class="${ok ? "fs-ok" : "fs-bad"}">${ok ? "一致" : "不符"}</td></tr>`);
          ctx.$(".fs-sl").textContent = `最後 ${n} MB・blob.size ${blob.size.toLocaleString()}`;
          ctx.$(".fs-last").innerHTML = rec.unsupported ? "" : `<div><span>a.download</span><span class="fs-m">"${esc(rec.a.download)}"</span></div><div><span>blob.type</span><span class="fs-m">${esc(blob.type)}</span></div>
            <div><span>點擊</span><span>已攔截，沒有下載；保留最後一個 Blob 供手動下載</span></div>`;
          return ok ? "核對一致" : "核對不符";
        },
        note: "每一級的資料在準備階段先產生 n 個 1 MB 的 Uint8Array，不計時。計時包含 new Blob 複製資料、saveAs 建立 blob: 網址（點擊被攔截）、arrayBuffer 讀回並逐塊核對。Blob 內容存在瀏覽器的 Blob 儲存區，heap 數字主要反映讀回的 ArrayBuffer；真實下載的寫檔速度取決於磁碟與瀏覽器，這裡無法量測。",
      });
    },
  },
] });
</script>
</body>
</html>
