<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileSaver.js 示範：一行程式存成檔案</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
  .form { padding: 14px 16px 56px; border-right: 1px solid var(--line); background: var(--bg-2); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .form h1 { font-size: 16px; margin: 0; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .tabs button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 6px 0 5px; cursor: pointer; font: 12px var(--font); display: grid; justify-items: center; gap: 1px; }
  .tabs button b { font: 600 10px var(--mono); color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--fg); color: var(--bg-2); border-color: var(--fg); }
  .tabs button[aria-pressed="true"] b { color: var(--accent); }
  .lab { font-size: 12px; color: var(--muted); margin-bottom: -6px; }
  .field { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); outline: none; font-size: 13px; }
  .field:focus { border-color: var(--c2); }
  .opt { font-size: 13px; display: flex; gap: 6px; align-items: center; }
  .opt input { accent-color: var(--c2); }
  .opt[hidden] { display: none; }
  #save { padding: 11px; font-size: 14px; }
  #save:disabled { opacity: .45; cursor: not-allowed; }
  .code { margin: 0; padding: 10px 12px; border-radius: 10px; background: #1c1d21; color: #e6e4dc; font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .code .k { color: #c792ea; } .code .f { color: #82aaff; } .code .s { color: #c3e88d; } .code .c { color: #7f848e; }
  .hist { display: grid; gap: 4px; font-size: 12px; }
  .hist div { display: grid; grid-template-columns: 56px 1fr auto; gap: 6px; padding: 4px 8px; border-radius: 6px; background: var(--bg); }
  .hist time, .hist small { font-family: var(--mono); color: var(--muted); }
  .hist span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; padding: 12px 14px 50px; gap: 10px; }
  .bar2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .blob { font: 12px var(--mono); padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); }
  .blob b { color: var(--c6); }
  .tools { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
  .tools input[type="range"] { width: 70px; }
  .area { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); place-items: center; position: relative; overflow: hidden; }
  .pane { width: 100%; height: 100%; display: none; min-height: 0; }
  .pane.on { display: grid; }
  #pad { background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.12); touch-action: none; cursor: crosshair; display: block; }
  .pane.draw { place-items: center; }
  .pane.text { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .pane.text.single { grid-template-rows: minmax(0, 1fr); }
  textarea { width: 100%; height: 100%; resize: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg-2); font: 13px/1.55 var(--mono); outline: none; }
  textarea:focus { border-color: var(--c2); }
  textarea.bad { border-color: var(--c3); }
  .out { overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); min-height: 0; }
  .out table { border-collapse: collapse; font-size: 13px; width: 100%; }
  .out th, .out td { border-bottom: 1px solid var(--line); padding: 5px 10px; text-align: left; white-space: nowrap; }
  .out th { background: var(--bg); position: sticky; top: 0; }
  .out .err { color: var(--c3); padding: 10px 12px; font-size: 13px; }
  .out.svg { display: grid; place-items: center; background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .out.svg svg { max-width: 90%; max-height: 90%; }
  .toast { position: fixed; right: 16px; bottom: 16px; z-index: 60; background: var(--fg); color: var(--bg-2); padding: 8px 14px; border-radius: 10px; font-size: 13px; transform: translateY(20px); opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { transform: none; opacity: 1; }
  @media (max-width: 640px) {
    /* stacked layout scrolls under the fixed hint: show it briefly, then fade it out */
    .hint { animation: hint-fade .5s 8s forwards; }
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 56%) minmax(0, 44%); }
    .main { grid-row: 1; padding: 8px 10px 6px; gap: 6px; }
    .form { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding: 10px 12px 52px; }
    .form h1 { display: none; }
    .tools input[type="range"] { width: 50px; }
    .toast { bottom: 50%; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="form">
    <h1>FileSaver.js 存檔</h1>
    <div class="tabs" id="tabs"></div>
    <span class="lab">檔名</span>
    <input class="field" id="name" spellcheck="false">
    <label class="opt" id="bomOpt" hidden><input type="checkbox" id="bom" checked> autoBom（讓 Excel 正確顯示中文）</label>
    <button class="btn primary" id="save">saveAs 存檔</button>
    <pre class="code" id="code"></pre>
    <span class="lab">存檔紀錄</span>
    <div class="hist" id="hist"><div><time>--:--</time><span class="muted">尚未存檔</span><small></small></div></div>
  </div>
  <div class="main">
    <div class="bar2">
      <span class="blob" id="blob"></span>
      <div class="tools" id="drawTools">
        <button class="sw" style="background:#1c1c1a" data-c="#1c1c1a" aria-label="黑色"></button>
        <button class="sw" style="background:#d61f69" data-c="#d61f69" aria-label="洋紅"></button>
        <button class="sw" style="background:#1f8fb8" data-c="#1f8fb8" aria-label="藍色"></button>
        <button class="sw" style="background:#e2c400" data-c="#e2c400" aria-label="黃色"></button>
        <input type="range" id="brush" min="2" max="24" value="7" aria-label="筆刷粗細">
        <button class="btn" id="clear">清除</button>
      </div>
    </div>
    <div class="area" id="area">
      <div class="pane draw" data-pane="png"><canvas id="pad"></canvas></div>
      <div class="pane text" data-pane="csv"><textarea id="csvText" spellcheck="false"></textarea><div class="out" id="csvOut"></div></div>
      <div class="pane text single" data-pane="txt"><textarea id="txtText"></textarea></div>
      <div class="pane text" data-pane="json"><textarea id="jsonText" spellcheck="false"></textarea><div class="out" id="jsonOut"></div></div>
      <div class="pane text" data-pane="svg"><textarea id="svgText" spellcheck="false"></textarea><div class="out svg" id="svgOut"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="hint">在畫布上畫畫或改文字，再按 saveAs 存檔</div>

<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const kb = (n) => (n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

const TYPES = {
  png: { label: "塗鴉", name: "我的塗鴉.png", mime: "image/png" },
  csv: { label: "試算表", name: "報名名單.csv", mime: "text/csv;charset=utf-8" },
  txt: { label: "筆記", name: "會議筆記.txt", mime: "text/plain;charset=utf-8" },
  json: { label: "資料", name: "settings.json", mime: "application/json" },
  svg: { label: "向量", name: "badge.svg", mime: "image/svg+xml" },
};
$("csvText").value = "姓名,單位,場次,人數\n王小明,圖鑑科技,上午場,2\n陳雅婷,前端學院,下午場,1\n林志豪,資料實驗室,上午場,3\n張家瑜,設計工作室,晚間場,1\n（以上為示意資料）,,,";
$("txtText").value = "會議筆記（示意資料）\n\n1. FileSaver.js 只做一件事：把 Blob 交給瀏覽器存檔。\n2. 產生內容（canvas、CSV、JSON）是你的程式負責。\n3. 檔名可以用中文，副檔名決定作業系統用什麼程式開。\n\n待辦：下週把匯出功能接到報表頁。";
$("jsonText").value = JSON.stringify({ theme: "paper", fontSize: 16, language: "zh-TW", favorites: ["Day.js", "Lodash", "JSZip"], note: "示意資料" }, null, 2);
$("svgText").value = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#4cc9f0"/><stop offset="1" stop-color="#f72585"/></linearGradient></defs>
  <rect x="4" y="4" width="232" height="112" rx="24" fill="url(#g)"/>
  <text x="120" y="74" font-family="Arial" font-size="34" font-weight="700" fill="#fff" text-anchor="middle">saveAs()</text>
</svg>`;

let type = "png";
let color = "#d61f69";

// ---- Sketch pad ----
const pad = $("pad"), g = pad.getContext("2d");
const W = 800, H = 500;
pad.width = W; pad.height = H;
function fitPad() {
  const r = $("area").getBoundingClientRect();
  const w = Math.max(120, Math.min(r.width, r.height * (W / H)));
  pad.style.width = `${w}px`; pad.style.height = `${w * (H / W)}px`;
}
function sampleDoodle() {
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.lineCap = g.lineJoin = "round";
  const stroke = (c, w, pts) => { g.strokeStyle = c; g.lineWidth = w; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); };
  g.fillStyle = "#e2c400"; g.beginPath(); g.arc(650, 120, 56, 0, Math.PI * 2); g.fill();
  for (let a = 0; a < 12; a++) { const t = (a / 12) * Math.PI * 2; stroke("#e2c400", 6, [[650 + Math.cos(t) * 72, 120 + Math.sin(t) * 72], [650 + Math.cos(t) * 96, 120 + Math.sin(t) * 96]]); }
  stroke("#1f8fb8", 9, Array.from({ length: 60 }, (_, i) => [40 + i * 12, 380 + Math.sin(i / 4) * 26]));
  stroke("#1f8fb8", 6, Array.from({ length: 60 }, (_, i) => [40 + i * 12, 430 + Math.sin(i / 4 + 1.5) * 18]));
  stroke("#1c1c1a", 7, [[140, 330], [140, 220], [230, 150], [320, 220], [320, 330], [140, 330]]);
  stroke("#d61f69", 7, [[205, 330], [205, 270], [255, 270], [255, 330]]);
  g.fillStyle = "#1c1c1a"; g.font = "700 40px 'Noto Sans TC','Microsoft JhengHei',sans-serif"; g.fillText("存成 PNG 吧！", 380, 280);
  g.fillStyle = "#9b998f"; g.font = "18px 'Noto Sans TC','Microsoft JhengHei',sans-serif"; g.fillText("示意塗鴉，直接在上面畫", 384, 316);
}
let drawing = false, last = null;
function pos(e) { const r = pad.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H]; }
pad.addEventListener("pointerdown", (e) => { drawing = true; last = pos(e); pad.setPointerCapture(e.pointerId); });
pad.addEventListener("pointermove", (e) => {
  if (!drawing) return;
  const p = pos(e);
  g.strokeStyle = color; g.lineWidth = +$("brush").value; g.lineCap = "round";
  g.beginPath(); g.moveTo(...last); g.lineTo(...p); g.stroke();
  last = p;
});
pad.addEventListener("pointerup", () => { drawing = false; updateBlob(); });
$("clear").addEventListener("click", () => { g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); updateBlob(); });
$("drawTools").addEventListener("click", (e) => {
  const b = e.target.closest(".sw"); if (!b) return;
  color = b.dataset.c;
  document.querySelectorAll(".sw").forEach((s) => s.setAttribute("aria-pressed", s === b));
});

// ---- Text panes ----
function parseCsv(text) { return text.trim().split(/\r?\n/).map((l) => l.split(",")); }
function renderCsv() {
  const rows = parseCsv($("csvText").value);
  $("csvOut").innerHTML = `<table><thead><tr>${rows[0].map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function renderJson() {
  try {
    const obj = JSON.parse($("jsonText").value);
    $("jsonText").classList.remove("bad");
    $("jsonOut").innerHTML = `<table><thead><tr><th>欄位</th><th>型別</th><th>值</th></tr></thead><tbody>${Object.entries(obj).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${Array.isArray(v) ? "陣列" : { string: "字串", number: "數字", boolean: "布林", object: v === null ? "null" : "物件" }[typeof v]}</td><td>${esc(JSON.stringify(v))}</td></tr>`).join("")}</tbody></table>`;
    return true;
  } catch (err) {
    $("jsonText").classList.add("bad");
    $("jsonOut").innerHTML = `<div class="err">JSON 格式錯誤：${esc(err.message)}<br>修正前無法存檔</div>`;
    return false;
  }
}
function renderSvg() { $("svgOut").innerHTML = $("svgText").value; }

// ---- Blob + code ----
function makeBlob() {
  const t = TYPES[type];
  if (type === "png") return new Promise((r) => pad.toBlob(r, "image/png"));
  const text = { csv: "csvText", txt: "txtText", json: "jsonText", svg: "svgText" }[type];
  return Promise.resolve(new Blob([$(text).value], { type: t.mime }));
}
const BOM_TEST = /^\s*(?:text\/\S*|application\/xml|\S*\/\S*\+xml)\s*;.*charset\s*=\s*utf-8/i; // same rule FileSaver uses
async function updateBlob() {
  const blob = await makeBlob();
  const bom = type === "csv" && $("bom").checked && BOM_TEST.test(blob.type);
  $("blob").innerHTML = `Blob { type: <b>"${blob.type}"</b>, size: <b>${kb(blob.size + (bom ? 3 : 0))}</b> }${bom ? "　含 BOM" : ""}`;
  const okJson = type !== "json" || renderJson();
  $("save").disabled = !okJson;
  updateCode();
}
function updateCode() {
  const n = $("name").value;
  const S = (s) => `<span class="s">"${esc(s)}"</span>`;
  const save = (opts = "") => `<span class="f">saveAs</span>(blob, ${S(n)}${opts});`;
  $("code").innerHTML = type === "png"
    ? `<span class="c">// canvas 轉成 Blob 後交給 FileSaver</span>\ncanvas.<span class="f">toBlob</span>((blob) =&gt;\n  ${save()});`
    : `<span class="k">const</span> blob = <span class="k">new</span> <span class="f">Blob</span>([text],\n  { type: ${S(TYPES[type].mime)} });\n${save(type === "csv" && $("bom").checked ? ", { autoBom: <span class=\"k\">true</span> }" : "")}`;
}

function select(t) {
  type = t;
  $("name").value = TYPES[t].name;
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.t === t));
  document.querySelectorAll(".pane").forEach((p) => p.classList.toggle("on", p.dataset.pane === t));
  $("drawTools").style.visibility = t === "png" ? "visible" : "hidden";
  $("bomOpt").hidden = t !== "csv";
  if (t === "csv") renderCsv();
  if (t === "svg") renderSvg();
  if (t === "png") fitPad();
  updateBlob();
}

function toast(msg) {
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2400);
}

$("tabs").innerHTML = Object.entries(TYPES).map(([k, v]) => `<button data-t="${k}">${v.label}<b>.${k}</b></button>`).join("");
$("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) select(b.dataset.t); });
$("name").addEventListener("input", updateCode);
$("bom").addEventListener("change", updateBlob);
$("csvText").addEventListener("input", () => { renderCsv(); updateBlob(); });
$("txtText").addEventListener("input", updateBlob);
$("jsonText").addEventListener("input", updateBlob);
$("svgText").addEventListener("input", () => { renderSvg(); updateBlob(); });
$("save").addEventListener("click", async () => {
  const blob = await makeBlob();
  const name = $("name").value.trim() || TYPES[type].name;
  saveAs(blob, name, { autoBom: type === "csv" && $("bom").checked });
  const hist = $("hist");
  if (hist.querySelector(".muted")) hist.innerHTML = "";
  const row = document.createElement("div");
  const bom = type === "csv" && $("bom").checked ? 3 : 0;
  row.innerHTML = `<time>${new Date().toLocaleTimeString("zh-TW", { hour12: false })}</time><span>${esc(name)}</span><small>${kb(blob.size + bom)}</small>`;
  hist.prepend(row);
  while (hist.children.length > 4) hist.lastChild.remove();
  toast(`已交給瀏覽器下載：${name}`);
});
addEventListener("resize", () => { if (type === "png") fitPad(); });

sampleDoodle();
document.querySelector('.sw[data-c="#d61f69"]').setAttribute("aria-pressed", "true");
select("png");
</script>
</body>
</html>
