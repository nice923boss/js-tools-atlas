<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fireworks-js 示範：台北跨年煙火</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: linear-gradient(#04060f 0%, #0b1230 60%, #1a1c3a 100%); }
  #fw { position: fixed; inset: 0; cursor: crosshair; }
  #skyline { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: min(42vh, 250px); pointer-events: none; }
  .title { position: fixed; left: 0; right: 0; top: 14%; text-align: center; pointer-events: none; }
  .title small { letter-spacing: .4em; font-size: 12px; color: rgba(255, 255, 255, .7); }
  .title h1 { margin: 4px 0 0; font-size: clamp(26px, 6.5vw, 54px); font-weight: 800; letter-spacing: .1em; text-shadow: 0 0 24px rgba(255, 200, 80, .45); }
</style>
</head>
<body>
<div id="fw"></div>
<svg id="skyline" viewBox="0 0 1000 250" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
<div class="title"><small>TAIPEI 2027</small><h1>新年快樂</h1></div>
<div class="controls" id="themes">
  <button class="btn" data-t="rainbow" aria-pressed="true">繽紛</button>
  <button class="btn" data-t="gold">金色</button>
  <button class="btn" data-t="cool">冷色</button>
  <button class="btn primary" id="salvo">齊放</button>
</div>
<div class="hint">按住畫面，煙火會朝滑鼠飛去</div>

<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.8/dist/index.umd.js"></script>
<script>
// Skyline silhouette with a Taipei 101-like tower, drawn as plain SVG paths.
(function drawSkyline() {
  const svg = document.getElementById("skyline");
  const NS = "http://www.w3.org/2000/svg";
  const add = (d, fill) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", fill);
    svg.appendChild(p);
  };
  // Back and front rows of rectangles with lit windows.
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (const [row, color, minH, maxH] of [[0, "#121735", 60, 130], [1, "#080a18", 30, 95]]) {
    let x = -10;
    let d = "";
    let lights = "";
    while (x < 1010) {
      const w = 26 + rnd() * 44;
      const h = minH + rnd() * (maxH - minH);
      // Leave a gap in the front row so the tower base stays visible.
      const skip = row === 1 && Math.abs(x + w / 2 - 500) < 70;
      if (!skip) {
        d += `M${x} 250V${250 - h}H${x + w}V250Z`;
        for (let wy = 250 - h + 8; row === 1 && wy < 244; wy += 12) {
          for (let wx = x + 5; wx < x + w - 6; wx += 9) {
            if (rnd() < 0.22) lights += `M${wx} ${wy}h4v5h-4Z`;
          }
        }
      }
      x += w + 2;
    }
    add(d, color);
    if (lights) add(lights, "rgba(255,214,120,.55)");
  }
  // Tower: podium, eight flared segments, crown and spire.
  let d = "M462 250L470 214H530L538 250Z";
  let y = 214;
  for (let i = 0; i < 8; i++) {
    d += `M482 ${y}L476 ${y - 19}H524L518 ${y}Z`;
    y -= 19;
  }
  d += `M488 ${y}L485 ${y - 10}H515L512 ${y}Z`;
  y -= 10;
  d += `M494 ${y}L492 ${y - 8}H508L506 ${y}Z`;
  y -= 8;
  d += `M498.6 ${y}L499.4 ${y - 34}H500.6L501.4 ${y}Z`;
  add(d, "#0a0c1c");
})();

// fireworks-js renders traces and explosions on its own canvas inside the container.
const THEMES = {
  rainbow: { hue: { min: 0, max: 360 }, brightness: { min: 50, max: 80 } },
  gold: { hue: { min: 28, max: 52 }, brightness: { min: 60, max: 90 } },
  cool: { hue: { min: 170, max: 280 }, brightness: { min: 55, max: 85 } },
};
const fireworks = new Fireworks.Fireworks(document.getElementById("fw"), {
  autoresize: true,
  opacity: 0.5,
  acceleration: 1.04,
  friction: 0.97,
  gravity: 1.4,
  particles: 90,
  traceLength: 3,
  traceSpeed: 10,
  explosion: 6,
  intensity: 32,
  flickering: 50,
  lineStyle: "round",
  rocketsPoint: { min: 15, max: 85 },
  delay: { min: 25, max: 50 },
  decay: { min: 0.015, max: 0.03 },
  lineWidth: { explosion: { min: 1, max: 3.5 }, trace: { min: 0.5, max: 1.5 } },
  mouse: { click: true, move: false, max: 4 },
  ...THEMES.rainbow,
});
fireworks.start();
fireworks.launch(4);

document.getElementById("themes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-t]");
  if (b) {
    fireworks.updateOptions(THEMES[b.dataset.t]);
    document.querySelectorAll("#themes [data-t]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    fireworks.launch(3);
  } else if (e.target.id === "salvo") {
    fireworks.launch(12);
  }
});
// Extra volleys on a timer so any moment of an idle preview has bursts in the sky.
setInterval(() => fireworks.launch(2), 1400);
</script>
</body>
</html>
