<style>
  .sc-scene canvas.fwc { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .fw-night { position: absolute; inset: 0; background: radial-gradient(100% 80% at 50% 100%, #1b2142 0%, #0b0e1d 55%, #05060c 100%); }
  .fw-host { position: absolute; inset: 0; }
  .fw-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; background: rgba(8, 10, 20, .8); border: 1px solid var(--line); font: 600 12px/1.35 var(--font); color: var(--fg); white-space: nowrap; }
  .fw-chip code, .fw-chip .num { font: 600 12px/1.35 var(--mono); color: var(--c2); font-variant-numeric: tabular-nums; }
  .fw-chip .def { font: 500 11px/1 var(--font); color: var(--c4); }
  /* Docks sit bottom right so the scene's opening hint toast (bottom left) does not cover them. */
  .fw-dock { position: absolute; right: 10px; bottom: 10px; z-index: 3; max-width: calc(100% - 20px); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; align-items: flex-end; pointer-events: none; }
  @media (max-width: 560px) { .fw-chip .k { display: none; } }
  @media (max-width: 720px) { .fw-dock { bottom: 44px; } }

  /* 1. Taipei countdown */
  .fw-tpe { position: absolute; inset: 0; background: linear-gradient(#04060f 0%, #0b1230 60%, #1a1c3a 100%); }
  .fw-tpe canvas.fwc { cursor: crosshair; }
  .fw-skyline { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: min(40%, 220px); pointer-events: none; }
  .fw-title { position: absolute; left: 0; right: 0; top: calc(var(--sc-ctl-h, 0px) + 6%); text-align: center; pointer-events: none; }
  .fw-title small { letter-spacing: .4em; font-size: 12px; color: rgba(255, 255, 255, .7); }
  .fw-title h1 { margin: 4px 0 0; font-size: clamp(26px, 6.5vw, 50px); font-weight: 800; letter-spacing: .1em; text-shadow: 0 0 24px rgba(255, 200, 80, .45); }

  /* 2. lanes */
  .fw-lanes { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .fw-lane { position: relative; overflow: hidden; border-radius: 12px; border: 1px dashed var(--line); background: rgba(255, 255, 255, .025); min-height: 0; }
  .fw-lane .fw-chip { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 2; max-width: calc(100% - 12px); overflow: hidden; }

  /* 3. style readout */
  .fw-opts { padding: 8px 12px; display: grid; grid-template-columns: repeat(2, auto auto); column-gap: 12px; row-gap: 1px; font: 500 12px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
  .fw-opts .k { color: var(--muted); }
  .fw-opts .v { color: var(--c2); text-align: right; }
  @media (max-width: 560px) { .fw-opts { grid-template-columns: auto auto; } }

  /* 4. launch zone overlay */
  .fw-zone { position: absolute; z-index: 2; pointer-events: none; border: 1.5px dashed rgba(76, 201, 240, .8); background: rgba(76, 201, 240, .06); border-radius: 6px; transition: left .35s, top .35s, width .35s, height .35s; }
  .fw-zone span { position: absolute; left: 6px; top: 4px; font-size: 11.5px; color: var(--c2); white-space: nowrap; }
  .fw-pad { position: absolute; z-index: 2; bottom: 0; height: 5px; background: var(--accent); border-radius: 3px 3px 0 0; box-shadow: 0 0 12px var(--accent); pointer-events: none; transition: left .35s, width .35s; }
  .fw-pad span { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); font-size: 11.5px; color: var(--accent); white-space: nowrap; }
  .fw-pad span code { font-family: var(--mono); }

  /* 5. ghost pointer */
  .fw-ghost { position: absolute; left: 0; top: 0; z-index: 3; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .85); pointer-events: none; transition: background .15s, transform .15s, opacity .2s; }
  .fw-ghost.down { background: rgba(247, 223, 30, .35); transform: scale(.8); }
  .fw-ghost.off { opacity: .35; }
  .fw-ghost[hidden] { display: none; }

  /* 6. lifecycle log */
  .fw-side { position: absolute; right: 10px; bottom: 10px; z-index: 3; width: min(430px, calc(100% - 20px)); display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
  @media (max-width: 720px) { .fw-side { bottom: 44px; } }
  .fw-state { align-self: flex-end; }
  .fw-state i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .fw-state.on i { background: var(--c4); box-shadow: 0 0 8px var(--c4); }
  .fw-log { padding: 8px 10px; font-size: 12.5px; line-height: 1.55; min-height: 2.2em; }
  .fw-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fw-log .ts { font: 500 11.5px/1 var(--mono); color: var(--muted); margin-right: 6px; }
  .fw-log b { font-family: var(--mono); color: var(--accent); }
  .fw-log .ok b { color: var(--c4); }

  /* 7. stress */
  .lab-stage { position: absolute; inset: 8px; border-radius: 12px; overflow: hidden; background: radial-gradient(70% 80% at 50% 100%, #1b2142 0%, #05060c 75%); border: 1px solid var(--line); }
  @media (min-width: 761px) { .lab-stage { inset: 8px 8px 8px 350px; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.8/dist/index.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const { h, fmt, fmtMs } = Showcase;
const SOUND_FILES = [0, 1, 2].map((i) => `https://cdn.jsdelivr.net/gh/crashmax-dev/fireworks-js@v2.10.8/website/public/sounds/explosion${i}.mp3`);
const rnd = (a, b) => a + Math.random() * (b - a);

// fireworks-js maps pointers with pageX - canvas.offsetLeft, which is only right when the canvas'
// offsetParent sits at the page origin. Inside the positioned stage that is off by the stage offset,
// so report the canvas' page position instead.
function pageOffsets(canvas) {
  Object.defineProperty(canvas, "offsetLeft", { get: () => canvas.getBoundingClientRect().left + scrollX });
  Object.defineProperty(canvas, "offsetTop", { get: () => canvas.getBoundingClientRect().top + scrollY });
}

// The canvas goes into the DOM first: a detached canvas target would be appended to document.body.
function mountFw(ctx, host, options) {
  const canvas = h("canvas", { class: "fwc" });
  host.append(canvas);
  pageOffsets(canvas);
  const fw = new Fireworks.Fireworks(canvas, options);
  ctx.onCleanup(() => {
    // clear() first so a pending waitStop() loop sees an empty sky and ends even while paused.
    fw.clear();
    fw.stop();
    fw.sound.audioContext?.close();
  });
  return fw;
}

// Rocket targets are drawn from x in [b.x, b.width - 2 b.x] and y in [b.y, b.height / 2],
// so a target rectangle [x0, x1] x [y0, y1] maps to these boundaries.
const boundsFor = (x0, x1, y0, y1) => ({ x: x0, y: y0, width: x1 + 2 * x0, height: 2 * y1 });

// Skyline silhouette with a Taipei 101-like tower, drawn as plain SVG paths.
function drawSkyline(svg) {
  const NS = "http://www.w3.org/2000/svg";
  const add = (d, fill) => {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", fill);
    svg.appendChild(p);
  };
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (const [row, color, minH, maxH] of [[0, "#121735", 60, 130], [1, "#080a18", 30, 95]]) {
    let x = -10, d = "", lights = "";
    while (x < 1010) {
      const w = 26 + rand() * 44;
      const hh = minH + rand() * (maxH - minH);
      // Leave a gap in the front row so the tower base stays visible.
      const skip = row === 1 && Math.abs(x + w / 2 - 500) < 70;
      if (!skip) {
        d += `M${x} 250V${250 - hh}H${x + w}V250Z`;
        for (let wy = 250 - hh + 8; row === 1 && wy < 244; wy += 12) {
          for (let wx = x + 5; wx < x + w - 6; wx += 9) if (rand() < 0.22) lights += `M${wx} ${wy}h4v5h-4Z`;
        }
      }
      x += w + 2;
    }
    add(d, color);
    if (lights) add(lights, "rgba(255,214,120,.55)");
  }
  // Tower: podium, eight flared segments, crown and spire.
  let d = "M462 250L470 214H530L538 250Z", y = 214;
  for (let i = 0; i < 8; i++) { d += `M482 ${y}L476 ${y - 19}H524L518 ${y}Z`; y -= 19; }
  d += `M488 ${y}L485 ${y - 10}H515L512 ${y}Z`; y -= 10;
  d += `M494 ${y}L492 ${y - 8}H508L506 ${y}Z`; y -= 8;
  d += `M498.6 ${y}L499.4 ${y - 34}H500.6L501.4 ${y}Z`;
  add(d, "#0a0c1c");
}

const THEMES = [
  { hue: { min: 0, max: 360 }, brightness: { min: 50, max: 80 } },
  { hue: { min: 28, max: 52 }, brightness: { min: 60, max: 90 } },
  { hue: { min: 170, max: 280 }, brightness: { min: 55, max: 85 } },
];

const PARAMS = {
  gravity: { vals: [0.5, 1.5, 4], def: 1 },
  friction: { vals: [0.9, 0.95, 0.99], def: 1 },
  decay: { vals: [{ min: 0.005, max: 0.01 }, { min: 0.015, max: 0.03 }, { min: 0.045, max: 0.06 }], def: 1 },
  particles: { vals: [20, 50, 150], def: 1 },
  explosion: { vals: [2, 5, 12], def: 1 },
  traceSpeed: { vals: [3, 10, 24], def: 1 },
  acceleration: { vals: [1, 1.05, 1.12], def: 1 },
};
const showVal = (v) => (typeof v === "object" ? `${v.min}~${v.max}` : String(v));

const STYLES = [
  ["菊花", { particles: 110, explosion: 7, friction: 0.96, gravity: 1.2, decay: { min: 0.012, max: 0.022 }, flickering: 30, opacity: 0.5, lineStyle: "round", hue: { min: 0, max: 360 }, brightness: { min: 55, max: 80 }, lineWidth: { explosion: { min: 1, max: 2.5 } } }],
  ["柳樹", { particles: 70, explosion: 12, friction: 0.985, gravity: 1.8, decay: { min: 0.006, max: 0.011 }, flickering: 15, opacity: 0.35, lineStyle: "round", hue: { min: 32, max: 46 }, brightness: { min: 45, max: 70 }, lineWidth: { explosion: { min: 0.8, max: 1.6 } } }],
  ["牡丹", { particles: 220, explosion: 3, friction: 0.92, gravity: 1, decay: { min: 0.022, max: 0.034 }, flickering: 0, opacity: 0.5, lineStyle: "round", hue: { min: 320, max: 360 }, brightness: { min: 55, max: 75 }, lineWidth: { explosion: { min: 2, max: 4 } } }],
  ["閃光", { particles: 160, explosion: 2, friction: 0.95, gravity: 0.8, decay: { min: 0.01, max: 0.02 }, flickering: 100, opacity: 0.5, lineStyle: "square", hue: { min: 190, max: 230 }, brightness: { min: 70, max: 100 }, lineWidth: { explosion: { min: 0.5, max: 1.5 } } }],
  ["長曝光", { particles: 60, explosion: 4, friction: 0.97, gravity: 1.5, decay: { min: 0.015, max: 0.03 }, flickering: 50, opacity: 0.06, lineStyle: "round", hue: { min: 0, max: 360 }, brightness: { min: 50, max: 80 }, lineWidth: { explosion: { min: 1, max: 2.5 } } }],
];
const STYLE_KEYS = ["particles", "explosion", "friction", "gravity", "decay", "flickering", "opacity", "lineStyle"];

// [label, options, target rect as fractions [x0, x1, y0, y1] or null for the library default]
const ZONES = [
  ["預設", { rocketsPoint: { min: 50, max: 50 } }, null],
  ["全寬", { rocketsPoint: { min: 0, max: 100 } }, null],
  ["斜射", { rocketsPoint: { min: 4, max: 24 } }, [0.6, 0.94, 0.1, 0.38]],
  ["定點", { rocketsPoint: { min: 40, max: 60 } }, [0.44, 0.56, 0.22, 0.3]],
];

Showcase.run({ scenes: [
  {
    id: "taipei", title: "台北跨年",
    api: "new Fireworks(canvas, { rocketsPoint, mouse: { click: true, max: 4 }, sound }).start()・launch(12)",
    desc: "原本的招牌示範：start() 之後依 intensity 與 delay 連續自動施放；按住夜空，煙火會朝指標飛去（mouse.click，最多 4 枚同時在空中）。齊放呼叫 launch(12)，切換配色用 updateOptions 換 hue 與 brightness，並把 intensity 短暫調高補一波；音效載入官方的三個爆炸音檔，開啟後每次爆炸隨機播一個。",
    hint: "按住夜空引導煙火・右上切換配色、齊放、音效",
    mount(ctx) {
      ctx.html(`<div class="fw-tpe"><div class="fw-host"></div>
        <svg class="fw-skyline" viewBox="0 0 1000 250" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
        <div class="fw-title"><small>TAIPEI 2027</small><h1>新年快樂</h1></div></div>`);
      drawSkyline(ctx.$(".fw-skyline"));
      const fw = mountFw(ctx, ctx.$(".fw-host"), {
        opacity: 0.5, acceleration: 1.04, friction: 0.97, gravity: 1.4, particles: 90,
        traceLength: 3, traceSpeed: 10, explosion: 6, intensity: 32, flickering: 50, lineStyle: "round",
        rocketsPoint: { min: 15, max: 85 }, delay: { min: 25, max: 50 }, decay: { min: 0.015, max: 0.03 },
        lineWidth: { explosion: { min: 1, max: 3.5 }, trace: { min: 0.5, max: 1.5 } },
        mouse: { click: true, move: false, max: 4 },
        sound: { enabled: false, files: SOUND_FILES, volume: { min: 4, max: 8 } },
        ...THEMES[0],
      });
      // A short intensity boost gives an opening salvo without launch(), which would pause auto and mouse rockets.
      let burstUntil = 0;
      const burst = () => { burstUntil = performance.now() + 1200; fw.updateOptions({ intensity: 100 }); };
      ctx.group(["繽紛", "金色", "冷色"], 0, (i) => { fw.updateOptions(THEMES[i]); burst(); });
      ctx.button("齊放", () => fw.launch(12), { primary: true });
      ctx.toggle("音效", false, (v) => fw.updateOptions({ sound: { enabled: v } }));
      fw.start();
      burst();
      ctx.interval(() => {
        if (performance.now() > burstUntil && fw.currentOptions.intensity !== 32) fw.updateOptions({ intensity: 32 });
        // launch() switches the instance to "finish and stop"; resume the endless show once it has stopped.
        if (!fw.isRunning) fw.start();
      }, 250);
    },
  },
  {
    id: "physics", title: "物理參數",
    api: "三個 new Fireworks(laneCanvas)・updateOptions({ gravity | friction | decay | particles | explosion | traceSpeed | acceleration })・launch(1)",
    desc: "三條跑道各有自己的 Fireworks 實例，每秒同時 launch(1)，目標框與色相相同，只差選單選的那一個參數。gravity 是粒子每格固定往下的位移，friction 是每格的減速倍率，decay 是透明度每格扣多少（越大越快消失），explosion 是粒子尾跡長度，traceSpeed 與 acceleration 決定火箭升空的初速與加速。",
    hint: "上方選單切換參數・每秒同步發射",
    mount(ctx) {
      ctx.html(`<div class="fw-night"></div><div class="fw-lanes">${[0, 1, 2].map(() => `<div class="fw-lane"><span class="fw-chip"></span></div>`).join("")}</div>`);
      let key = "gravity";
      const lanes = ctx.$$(".fw-lane").map((el, i) => ({ i, chip: el.querySelector(".fw-chip"), fw: mountFw(ctx, el, { rocketsPoint: { min: 50, max: 50 } }) }));
      const label = () => lanes.forEach(({ chip, i }) => {
        const p = PARAMS[key];
        chip.innerHTML = `<code><span class="k">${key}: </span>${showVal(p.vals[i])}</code>${i === p.def ? '<span class="def">預設</span>' : ""}`;
      });
      const apply = (prev) => lanes.forEach(({ fw, i }) => fw.updateOptions({
        ...(prev ? { [prev]: PARAMS[prev].vals[PARAMS[prev].def] } : {}),
        [key]: PARAMS[key].vals[i],
      }));
      const shoot = () => {
        const hue = Math.floor(rnd(0, 360));
        for (const { fw } of lanes) {
          const w = fw.width, hh = fw.height;
          fw.updateOptions({ hue: { min: hue, max: hue }, boundaries: boundsFor(w * 0.32, w * 0.68, hh * 0.22, hh * 0.34) });
          fw.launch(1);
        }
      };
      ctx.select("參數", Object.keys(PARAMS), key, (v) => { const prev = key; key = v; apply(prev); label(); shoot(); });
      ctx.button("發射", shoot, { primary: true });
      apply(null);
      label();
      shoot();
      ctx.timeout(() => { shoot(); ctx.interval(shoot, 1100); }, 600);
    },
  },
  {
    id: "styles", title: "煙火樣式",
    api: "fireworks.updateOptions({ particles, explosion, friction, gravity, decay, flickering, opacity, lineStyle, hue, brightness, lineWidth })",
    desc: "同一個實例只靠 updateOptions 換參數就能變出不同煙火：particles 粒子數、explosion 尾跡長度、friction 減速、gravity 下墜、decay 消失速度、flickering 閃爍機率、opacity 是每格蓋上去的淡出量（越小殘影越長）、lineStyle 是線頭形狀。新參數只影響之後發射的煙火，右下的數值是從 currentOptions 讀回來的。",
    hint: "上方切換樣式・每 0.9 秒發射兩枚",
    mount(ctx) {
      ctx.html(`<div class="fw-night"></div><div class="fw-host"></div><div class="fw-dock"><div class="fw-opts panel"></div></div>`);
      const fw = mountFw(ctx, ctx.$(".fw-host"), { rocketsPoint: { min: 30, max: 70 }, ...STYLES[0][1] });
      const optsEl = ctx.$(".fw-opts");
      const readout = () => {
        const o = fw.currentOptions;
        optsEl.innerHTML = STYLE_KEYS.map((k) => `<span class="k">${k}</span><span class="v">${showVal(o[k])}</span>`).join("");
      };
      ctx.group(STYLES.map(([n]) => n), 0, (i) => { fw.updateOptions(STYLES[i][1]); readout(); fw.launch(3); });
      readout();
      fw.launch(3);
      ctx.interval(() => fw.launch(2), 900);
    },
  },
  {
    id: "zone", title: "發射範圍",
    api: "updateOptions({ rocketsPoint: { min, max }, boundaries: { x, y, width, height }, intensity })・updateSize({ width, height })",
    desc: "rocketsPoint 是發射點在底邊的百分比範圍（黃線）；boundaries 決定火箭目標：x 落在 x 到 width - 2x、y 落在 y 到 height / 2 之間（虛線框由目前的 boundaries 反推畫出，2.10.8 的 boundaries.debug 不會畫任何東西）。這裡關掉 autoresize，尺寸改變時自己呼叫 updateSize()，它會把 boundaries 寬高重設成畫布大小，所以之後要再套一次自訂範圍。intensity 越大，自動發射越密。",
    hint: "上方切換範圍・拖動 intensity 看發射密度",
    mount(ctx) {
      ctx.html(`<div class="fw-night"></div><div class="fw-host"></div><div class="fw-zone"><span>目標範圍</span></div><div class="fw-pad"><span>發射點 <code></code></span></div><div class="fw-dock"><span class="fw-chip"><span class="k">boundaries</span><code class="bd"></code></span></div>`);
      const fw = mountFw(ctx, ctx.$(".fw-host"), { autoresize: false, intensity: 30, particles: 60 });
      const canvas = ctx.$("canvas.fwc"), zone = ctx.$(".fw-zone"), pad = ctx.$(".fw-pad"), bd = ctx.$(".bd");
      let idx = 0;
      const draw = () => {
        const { boundaries: b, rocketsPoint: rp } = fw.currentOptions;
        Object.assign(zone.style, { left: `${b.x}px`, top: `${b.y}px`, width: `${Math.max(4, b.width - 3 * b.x)}px`, height: `${Math.max(4, b.height / 2 - b.y)}px` });
        Object.assign(pad.style, { left: `calc(${rp.min}% - 2px)`, width: `calc(${rp.max - rp.min}% + 4px)` });
        pad.querySelector("code").textContent = rp.min === rp.max ? `${rp.min}%` : `${rp.min}~${rp.max}%`;
        bd.textContent = `{ x: ${Math.round(b.x)}, y: ${Math.round(b.y)}, width: ${Math.round(b.width)}, height: ${Math.round(b.height)} }`;
      };
      const apply = () => {
        const [, opts, r] = ZONES[idx];
        const w = fw.width, hh = fw.height;
        fw.updateOptions({ ...opts, boundaries: r ? boundsFor(r[0] * w, r[1] * w, r[2] * hh, r[3] * hh) : { x: 50, y: 50, width: w, height: hh } });
        draw();
      };
      ctx.group(ZONES.map(([n]) => n), 0, (i) => { idx = i; apply(); fw.launch(3); });
      ctx.slider("intensity", { min: 5, max: 90, value: 30 }, (v) => fw.updateOptions({ intensity: v }));
      const rateEl = h("span", { class: "num", text: "0.0" });
      ctx.controls.append(h("span", { class: "fw-chip" }, "實測 ", rateEl, " 發/秒"));
      ctx.onResize(() => { fw.updateSize({ width: canvas.clientWidth, height: canvas.clientHeight }); apply(); });
      apply();
      fw.start();
      // Count rockets as they appear to report the real launch rate.
      const seen = new WeakSet(), stamps = [], born = performance.now();
      let shown = 0;
      ctx.raf(() => {
        const now = performance.now();
        for (const t of fw.traces) if (!seen.has(t)) { seen.add(t); stamps.push(now); }
        while (stamps.length && now - stamps[0] > 3000) stamps.shift();
        if (now - shown > 300) { shown = now; rateEl.textContent = (stamps.length / Math.min(3, Math.max(0.5, (now - born) / 1000))).toFixed(1); }
      });
    },
  },
  {
    id: "mouse", title: "滑鼠互動",
    api: "updateOptions({ mouse: { click, move, max } })",
    desc: "mouse.click：按住時持續朝指標發射，同時在空中的火箭不超過 max 枚；mouse.move：記住指標最後的位置，之後自動發射的火箭都飛向那一點；兩個都關掉就回到隨機目標。自動示範用合成的 pointer 事件畫出愛心軌跡，在夜空按一下就換你操作。",
    hint: "在夜空按住拖曳・上方切換模式與 max",
    mount(ctx) {
      ctx.html(`<div class="fw-night"></div><div class="fw-host"></div><div class="fw-ghost"></div><div class="fw-dock"><span class="fw-chip mstate"></span></div>`);
      const fw = mountFw(ctx, ctx.$(".fw-host"), {
        intensity: 22, particles: 45, explosion: 4, decay: { min: 0.008, max: 0.016 },
        rocketsPoint: { min: 30, max: 70 }, mouse: { click: true, move: false, max: 5 },
      });
      const canvas = ctx.$("canvas.fwc"), ghost = ctx.$(".fw-ghost"), stateEl = ctx.$(".mstate");
      const MODES = [{ click: true, move: false }, { click: false, move: true }, { click: false, move: false }];
      let mode = 0, auto = true, down = false, phase = 0, shown = 0;
      const send = (type, x, y) => {
        const r = canvas.getBoundingClientRect();
        canvas.dispatchEvent(new PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerId: 1, pointerType: "mouse", isPrimary: true }));
      };
      ctx.group(["click 按住", "move 跟隨", "關閉"], 0, (i) => {
        // Release while the old options are active, otherwise pointerup is ignored and the press sticks.
        if (down) { send("pointerup", 0, 0); down = false; }
        mode = i;
        fw.updateOptions({ mouse: MODES[i] });
      });
      ctx.slider("max", { min: 1, max: 10, value: 5 }, (v) => fw.updateOptions({ mouse: { max: v } }));
      ctx.on(canvas, "pointerdown", (e) => { if (e.isTrusted && auto) { auto = false; down = false; ghost.hidden = true; } });
      fw.start();
      ctx.raf((t, dt) => {
        const now = performance.now();
        if (now - shown > 200) {
          shown = now;
          const m = fw.currentOptions.mouse;
          stateEl.innerHTML = `<code><span class="k">mouse: </span>{ click: ${m.click}, move: ${m.move}, max: ${m.max} }</code><span>空中 <span class="num">${fw.traces.length}</span> 枚</span>`;
        }
        if (!auto) return;
        const w = canvas.clientWidth, hh = canvas.clientHeight;
        phase += dt / 1000;
        let x, y;
        if (mode === 0) {
          // Hold while tracing a heart, then let go briefly.
          const cyc = phase % 4.2, k = Math.min(cyc / 3.4, 1) * Math.PI * 2;
          const s = Math.min(w, hh * 1.3) * 0.016;
          x = w / 2 + 16 * s * Math.sin(k) ** 3;
          y = hh * 0.4 - s * (13 * Math.cos(k) - 5 * Math.cos(2 * k) - 2 * Math.cos(3 * k) - Math.cos(4 * k));
          const want = cyc < 3.4;
          if (want && !down) { send("pointerdown", x, y); down = true; }
          else if (!want && down) { send("pointerup", x, y); down = false; }
          else send("pointermove", x, y);
        } else {
          x = w / 2 + w * 0.3 * Math.sin(phase * 0.9);
          y = hh * 0.36 + hh * 0.12 * Math.sin(phase * 1.8);
          send("pointermove", x, y);
        }
        ghost.style.left = `${x}px`;
        ghost.style.top = `${y}px`;
        ghost.classList.toggle("down", down);
        ghost.classList.toggle("off", mode === 2);
      });
    },
  },
  {
    id: "lifecycle", title: "生命週期",
    api: "start()・pause()・stop(remove?)・clear()・launch(count)・await waitStop()・isRunning",
    desc: "start() 進入自動施放；pause() 是切換，凍結畫面但保留粒子；stop() 停止並清空畫布，傳 true 會連 canvas 一起移除；clear() 只清掉目前的火箭與粒子。launch(n) 立刻發 n 枚並進入「放完就停」模式：期間不再自動發射、也不回應滑鼠，畫面淨空後自動 stop()；waitStop() 用同一個機制，回傳的 Promise 在淨空時 resolve。",
    hint: "按上方按鈕看右下紀錄・操作後自動示範停止",
    mount(ctx) {
      ctx.html(`<div class="fw-night"></div><div class="fw-host"></div><div class="fw-side"><span class="fw-chip fw-state"><i></i><span></span></span><div class="fw-log panel"></div></div>`);
      const fw = mountFw(ctx, ctx.$(".fw-host"), { intensity: 34, delay: { min: 20, max: 45 }, particles: 70, rocketsPoint: { min: 20, max: 80 } });
      const logEl = ctx.$(".fw-log"), stateEl = ctx.$(".fw-state"), stateText = stateEl.querySelector("span");
      const born = performance.now();
      const log = (html, cls = "") => {
        const row = h("div", { class: cls });
        row.innerHTML = `<span class="ts">+${((performance.now() - born) / 1000).toFixed(1)}s</span>${html}`;
        logEl.append(row);
        while (logEl.children.length > 4) logEl.firstChild.remove();
      };
      let mute = false, waiting = false, was = false, user = false, step = 0, shown = 0;
      const DEMOS = {
        start() { fw.start(); log("<b>start()</b> 自動施放，依 intensity 與 delay 隨機發射"); },
        pause() { mute = true; fw.pause(); log(`<b>pause()</b> ${fw.isRunning ? "繼續動畫" : "畫面凍結，再呼叫一次就繼續"}`); },
        stop() { mute = true; fw.stop(); log("<b>stop()</b> 停止並清空畫布"); },
        clear() {
          const n = fw.traces.length + fw.explosions.length;
          fw.clear();
          log(`<b>clear()</b> 清掉 ${fmt(n)} 個火箭與粒子，${fw.isRunning ? "動畫仍在執行" : "目前沒在執行"}`);
        },
        launch() { fw.launch(5); log("<b>launch(5)</b> 暫停自動發射，5 枚放完就自動 stop()"); },
        async waitStop() {
          if (!fw.isRunning) { log("<b>waitStop()</b> 目前沒在執行，立即 resolve"); return; }
          const s = performance.now();
          waiting = true;
          log("<b>waitStop()</b> 不再發新的，等空中的煙火放完…");
          await fw.waitStop();
          waiting = false;
          if (ctx.active) log(`<b>waitStop()</b> resolve，等了 ${fmtMs(performance.now() - s)}`, "ok");
        },
      };
      for (const [k, label] of [["start", "start()"], ["pause", "pause()"], ["stop", "stop()"], ["clear", "clear()"], ["launch", "launch(5)"], ["waitStop", "waitStop()"]]) {
        ctx.button(label, () => { user = true; DEMOS[k](); }, { primary: k === "launch" });
      }
      ctx.raf(() => {
        const run = fw.isRunning;
        if (run !== was) {
          if (!run && !mute && !waiting) log("<b>isRunning → false</b> 畫面淨空，自動 stop()", "ok");
          mute = false;
          was = run;
        }
        const now = performance.now();
        if (now - shown > 150) {
          shown = now;
          stateEl.classList.toggle("on", run);
          stateText.innerHTML = `isRunning <span class="num">${run}</span>・空中 <span class="num">${fw.traces.length}</span> 枚・粒子 <span class="num">${fmt(fw.explosions.length)}</span>`;
        }
      });
      const tour = ["pause", "pause", "launch", "start", "clear", "waitStop", "start", "stop", "start"];
      const next = () => { if (user) return; DEMOS[tour[step++ % tour.length]](); ctx.timeout(next, 2600); };
      DEMOS.start();
      ctx.timeout(next, 2600);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "每格 fireworks.launch(n)・updateOptions({ particles })",
    desc: "每秒發射 N 枚火箭，逐級加量直到 FPS 掉到 30 以下；下方可切換每枚炸開的粒子數，比較火箭數與粒子數哪個才是瓶頸。",
    hint: "按「自動加壓」開始・切換粒子數後再測一次",
    mount(ctx) {
      ctx.html(`<div class="lab-stage"></div>`);
      const PARTS = [50, 150, 400];
      let rate = 0, acc = 0, parts = PARTS[0];
      const fw = mountFw(ctx, ctx.$(".lab-stage"), {
        particles: parts, explosion: 4, rocketsPoint: { min: 8, max: 92 },
        lineWidth: { trace: { min: 1, max: 2 }, explosion: { min: 1, max: 2.5 } },
      });
      ctx.controls.classList.add("bottom");
      ctx.group(PARTS.map((n) => `每枚 ${n} 粒`), 0, (i) => { parts = PARTS[i]; fw.updateOptions({ particles: parts }); });
      ctx.raf((t, dt) => {
        if (!rate) return;
        acc += (rate * dt) / 1000;
        const n = Math.floor(acc);
        if (n < 1) return;
        acc -= n;
        fw.launch(n);
      });
      ctx.ramp({
        label: "每秒發射", unit: "枚", steps: [5, 10, 20, 40, 80, 140, 220, 320], minFps: 30, warmup: 2000,
        apply(n) { rate = n; },
        metrics: () => ({
          空中火箭: `${fmt(fw.traces.length)} 枚`,
          爆炸粒子: `${fmt(fw.explosions.length)} 顆`,
          每秒新粒子: `${fmt(rate * parts)} 顆`,
        }),
        note: "每枚火箭飛到目標後炸成 N 顆粒子，粒子約活 0.5 到 1 秒（decay 每格扣 0.015 到 0.03 的透明度）。每顆粒子每格都要組 hsla 色彩字串，再各自 beginPath、stroke，沒有批次繪製，所以成本大致與畫面上的粒子數成正比。函式庫用自己的 requestAnimationFrame 迴圈並限制在 60 FPS；launch() 讓實例進入放完就停模式，所以畫面上只有這裡手動發射的火箭。",
      });
    },
  },
] });
</script>
</body>
</html>
