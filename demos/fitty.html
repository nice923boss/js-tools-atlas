<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fitty 示範：每一行都撐滿寬度的海報</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 30%, #262410, var(--bg) 70%); }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px 16px 52px; }
  .poster { --max: min(640px, 100vw - 32px, (100vh - 210px) * 1.3); width: calc(var(--max) * var(--k, 1)); padding: clamp(10px, 2.4vw, 22px); border-radius: 6px;
    background: var(--accent); color: #111; box-shadow: 0 30px 70px rgba(0,0,0,.5); transition: width .12s; }
  .poster .ln { line-height: 1.08; }
  .fit { font-weight: 900; outline: none; border-radius: 4px; }
  .fit:focus { box-shadow: 0 0 0 2px rgba(0,0,0,.55); }
  .l1 { letter-spacing: -.02em; }
  .l3 { color: #d81b72; }
  .l4 { font-family: "JetBrains Mono", ui-monospace, Consolas, var(--font); font-weight: 700; padding-top: .25em; border-top: 3px solid #111; margin-top: .2em; }
  .ctl { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 8px 12px; }
  .ctl label { font-size: 12px; color: var(--muted); }
  .ctl input { width: 150px; }
  .ctl .btn { padding: 6px 10px; font-size: 12px; }
  .sizes { font: 12px var(--mono); color: var(--muted); text-align: center; }
  .sizes b { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="poster" id="poster">
    <div class="ln"><span class="fit l1" contenteditable="true" spellcheck="false">JS 工具圖鑑</span></div>
    <div class="ln"><span class="fit l2" contenteditable="true" spellcheck="false">字級自動撐滿</span></div>
    <div class="ln"><span class="fit l3" contenteditable="true" spellcheck="false">每一行都剛好</span></div>
    <div class="ln"><span class="fit l4" contenteditable="true" spellcheck="false">FITTY · 2026.10.03 · 台北</span></div>
  </div>
  <div class="panel ctl">
    <label for="w">海報寬度</label>
    <input type="range" id="w" min="35" max="100" value="100">
    <button class="btn" id="swap">換一組文案</button>
  </div>
  <div class="sizes" id="sizes">各行字級計算中…</div>
</div>
<div class="hint">點海報上的字可以直接改，字級會即時重算</div>

<script src="https://cdn.jsdelivr.net/npm/fitty@2.4.2/dist/fitty.min.js"></script>
<script>
const poster = document.getElementById("poster");
const lines = [...document.querySelectorAll(".fit")];
// One fitty instance per line; it also watches text edits through a MutationObserver
const fits = lines.map((el) => fitty(el, { minSize: 10, maxSize: 260 }));

const sizes = new Array(lines.length).fill(0);
const sizesEl = document.getElementById("sizes");
lines.forEach((el, i) => el.addEventListener("fit", (e) => {
  sizes[i] = Math.round(e.detail.newValue);
  sizesEl.innerHTML = "各行字級：" + sizes.map((s) => "<b>" + s + "</b>").join(" · ") + " px";
}));

// fitty only listens to window resize, so refit when the poster itself changes width
new ResizeObserver(() => fits.forEach((f) => f.fit())).observe(poster);
document.getElementById("w").addEventListener("input", (e) => poster.style.setProperty("--k", e.target.value / 100));

const PRESETS = [
  ["JS 工具圖鑑", "字級自動撐滿", "每一行都剛好", "FITTY · 2026.10.03 · 台北"],
  ["夏日音樂祭", "海風與啤酒", "三天兩夜不打烊", "LIVE · 海邊舞台 · 免費入場"],
  ["新品發表會", "只要一行 JS", "長短都對齊", "MULTI-LINE · NO MEASURING"],
];
let preset = 0;
document.getElementById("swap").addEventListener("click", () => {
  preset = (preset + 1) % PRESETS.length;
  lines.forEach((el, i) => { el.textContent = PRESETS[preset][i]; });
});
</script>
</body>
</html>
