<style>
  .stage { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; overflow: hidden; }

  .code { font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 560px) {
    .rows { gap: 10px; }

  /* 3. multiLine */
  .mcards { flex: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 28px; max-width: 100%; }

  /* 4. mutations */
  .tick { flex: none; width: min(620px, 100%); padding: 12px 16px 14px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tlab { font-size: 12px; color: var(--muted); margin: 6px 0 2px; }
  .tlab:first-child { margin-top: 0; }
  .tbox { line-height: 1.15; outline: 1px dashed rgba(236, 235, 230, .25); }
  .tbox .num { color: var(--accent); font-variant-numeric: tabular-nums; }

  .tbox .edit:focus { box-shadow: 0 0 0 2px rgba(247, 37, 133, .45); border-radius: 4px; }

  /* 5. resize + events */
  .rzwrap { flex: none; width: min(720px, 100%); }
  .rz { position: relative; width: 70%; min-width: 140px; padding: 10px 26px 10px 12px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; }
  .rzbox { line-height: 1.12; }
  .rzbox .ft { color: var(--c6); }
  .grip { position: absolute; top: 0; right: 0; bottom: 0; width: 20px; cursor: ew-resize; touch-action: none; display: grid; place-items: center; border-left: 1px solid var(--line); }
  .grip::before { content: ""; width: 4px; height: 34%; border-radius: 2px; background: var(--muted); }
  .grip:hover::before { background: var(--accent); }
  .log { flex: none; width: min(720px, 100%); font-size: 12px; line-height: 1.6; color: var(--muted); }
  .log .hd { color: var(--fg); margin-bottom: 2px; }
  .log .hd b, .log .r b { font: 600 12px var(--mono); color: var(--fg); }
  .log .r { font: 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .r:first-of-type { color: var(--fg); }

  /* 6. freeze / fitAll */
  .tags { flex: none; width: min(660px, 100%); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tag { position: relative; padding: 10px 10px 8px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .tag.frozen { border: 1px dashed var(--c6); }
  .tst { display: flex; justify-content: space-between; gap: 4px; margin-bottom: 4px; font-size: 11px; line-height: 1.5; color: var(--muted); white-space: nowrap; }
  .tst b { font: 600 11px var(--mono); color: var(--fg); }
  .tag.frozen .st { padding: 0 5px; border-radius: 6px; background: var(--c6); color: #15121f; }
  .tbx { line-height: 1.1; }
  .tags[data-font="0"] .ft { font-family: var(--font); font-weight: 900; letter-spacing: 0; }
  .tags[data-font="1"] .ft { font-family: "Noto Serif TC", "PMingLiU", "MingLiU", "Songti TC", Georgia, serif; font-weight: 700; letter-spacing: 0; }
  .tags[data-font="2"] .ft { font-family: var(--font); font-weight: 300; letter-spacing: .3em; }

  /* 7. pitfalls */
  .pits { flex: none; width: min(900px, 100%); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  .pit h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .pit h3 .tag2 { font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
  .bad .tag2 { background: rgba(255, 140, 66, .2); color: var(--c5); }
  .good .tag2 { background: rgba(123, 211, 137, .2); color: var(--c4); }
  .pcard { padding: var(--p, 24px); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; line-height: 1.15;
    background: linear-gradient(var(--bg-2), var(--bg-2)) content-box, rgba(255, 140, 66, .2); }
  .pcard .ft { color: var(--fg); }
  .pcard.blk .ft { display: block !important; width: 100%; }
  .pin { line-height: 1.15; }
  .pread { margin-top: 6px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .pread b { font: 600 12px var(--mono); color: var(--fg); }
  .plegend { flex: none; font-size: 12px; color: var(--muted); }
  .plegend i { display: inline-block; width: 12px; height: 12px; vertical-align: -2px; margin-right: 5px; border-radius: 3px; background: rgba(255, 140, 66, .35); }
  @media (max-width: 520px) {
    .pits { grid-template-columns: 1fr; gap: 8px; }
    .pit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 10px; align-items: center; }
    .pit h3 { grid-column: 1 / -1; margin-bottom: 4px; }
    .pread { margin-top: 0; font-size: 11px; line-height: 1.5; }
  }

  /* 8. stress */
  .sbox { position: absolute; inset: 8px 8px 8px 350px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
  .sres { margin: 0 0 8px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
  .sres b { font: 600 12px var(--mono); color: var(--fg); }
  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 4px; }
  .cells.narrow { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
  .cell { padding: 0; background: var(--bg-2); border-radius: 4px; line-height: 1.1; overflow: hidden; }
  /* The bench panel only spans the full width below 560px; above that it leaves room on the right */
  @media (max-width: 560px) { .sbox { inset: 8px; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/fitty@2.4.2/dist/fitty.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const { h, fmtMs } = Showcase;
const C = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const n1 = (v) => (Math.round(v * 10) / 10).toFixed(1);

// Every fitty instance lives in one global redraw list, so each scene unsubscribes its own on cleanup
function pool(ctx) {
  let list = [];
  const p = {
    add(el, opts) { const f = fitty(el, opts); list.push(f); return f; },
    clear() { list.forEach((f) => f.unsubscribe()); list = []; },
    get list() { return list; },
  };
  ctx.onCleanup(() => p.clear());
  return p;
}

// The controls height (--sc-ctl-h) arrives asynchronously, so layouts that depend on free space watch the element itself
function observeSize(ctx, el, fn) {
  let last = "";
  const ro = new ResizeObserver(([e]) => {
    const key = `${Math.round(e.contentRect.width)}x${Math.round(e.contentRect.height)}`;
    if (!ctx.active || key === last) return;
    last = key;
    fn();
  });
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
}

// fitty only listens to window resize; containers that change width on their own need a ResizeObserver.
// Only width matters here: the height follows the new font size and would otherwise trigger a second fit.
function onWidth(ctx, els, fn) {
  const last = new Map();
  const ro = new ResizeObserver((entries) => entries.forEach((e) => {
    const w = Math.round(e.contentRect.width);
    if (!ctx.active || last.get(e.target) === w) return;
    last.set(e.target, w);
    fn(e.target);
  }));
  els.forEach((el) => ro.observe(el));
  ctx.onCleanup(() => ro.disconnect());
}

const PRESETS = [
  ["JS 工具圖鑑", "字級自動撐滿", "每一行都剛好", "FITTY · 2026.10.03 · 台北"],
  ["夏日音樂祭", "海風與啤酒", "三天兩夜不打烊", "LIVE · 海邊舞台 · 免費入場"],
  ["新品發表會", "只要一行 JS", "長短都對齊", "MULTI-LINE · NO MEASURING"],
];
const CLAMP_ROWS = [
  { name: "短句", text: "讚" },
  { name: "中等", text: "字級剛好落在上下限之間的一行" },
  { name: "長句", text: "這一行非常非常長，長到算出來的字級比下限還小，於是停在下限，多出來的部分只好溢出容器右邊" },
];
const TAG_WORDS = ["JS", "工具圖鑑", "fitty", "字級", "撐滿容器", "2026"];
const FONTS = ["粗黑體", "明體", "細字寬字距"];
const CELL_WORDS = ["fitty", "撐滿", "JS 工具圖鑑", "2026", "字級", "Snug fit", "每一格都剛好", "台北", "AUTO", "環", "minSize", "一行字"];

Showcase.run({
  scenes: [
    {
      id: "poster", title: "撐滿海報",
      api: "fitty(el, { minSize: 10, maxSize: 260 })",
      desc: "fitty 比較文字寬度與父層寬度，一次算出剛好撐滿的字級。每一行各自一個實例，所以長短不同的句子都能左右切齊；預設的 MutationObserver 讓你改字時自動重算。",
      hint: "點海報上的字可以直接改，字級會即時重算",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="poster">${[1, 2, 3, 4].map((i) => `<div class="ln"><span class="fit l${i}" contenteditable="true" spellcheck="false"></span></div>`).join("")}</div><div class="read"></div></div>`);
        const stage = ctx.$(".stage"), poster = ctx.$(".poster"), read = ctx.$(".read");
        const lines = ctx.$$(".poster .fit");
        const fits = pool(ctx);
        const sizes = lines.map(() => 0);
        let preset = 0, on = true, events = 0;
        const paint = () => {
          read.innerHTML = on
            ? `各行字級 ${sizes.map((s) => `<b>${Math.round(s)}</b>`).join(" · ")} px　fit 事件 <b>${events}</b> 次`
            : `已呼叫 unsubscribe()：每一行還原成原本的行內樣式與字級`;
        };
        lines.forEach((el, i) => {
          el.textContent = PRESETS[0][i];
          ctx.on(el, "fit", (e) => { sizes[i] = e.detail.newValue; events++; paint(); });
        });
        const attach = () => lines.forEach((el) => fits.add(el, { minSize: 10, maxSize: 260 }));
        onWidth(ctx, [poster], () => fits.list.forEach((f) => f.fit()));
        const layout = () => {
          const cs = getComputedStyle(stage);
          const w = stage.clientWidth - 24;
          const hh = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 50;
          // Four lines come out at roughly 0.72 of the poster width in height
          poster.style.setProperty("--pw", `${Math.max(200, Math.min(640, w, hh / 0.72))}px`);
        };
        ctx.slider("海報寬度", { min: 35, max: 100, step: 1, value: 100, format: (v) => `${v}%` }, (v) => poster.style.setProperty("--k", v / 100));
        ctx.button("換一組文案", () => {
          preset = (preset + 1) % PRESETS.length;
          lines.forEach((el, i) => { el.textContent = PRESETS[preset][i]; });
        });
        ctx.toggle("套用 fitty", on, (v) => {
          on = v;
          if (v) attach(); else fits.clear();
          paint();
        });
        layout();
        observeSize(ctx, stage, layout);
        attach();
        paint();
      },
    },
    {
      id: "clamp", title: "上下限",
      api: "fitty(el, { minSize: 16, maxSize: 72, multiLine: false })",
      desc: "算出來的字級會被夾在 minSize 與 maxSize 之間。太短的字撞到上限就不再放大，右邊留白；太長的字撞到下限後不再縮小，這裡關掉 multiLine，所以直接溢出。",
      hint: "拖動上下限，看三行各自停在哪裡",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="rows">${CLAMP_ROWS.map((r) => `<div class="row"><div class="rlab"></div><div class="lane"><div class="lin"><span class="ft"></span></div></div></div>`).join("")}</div><div class="read code"></div></div>`);
        const read = ctx.$(".read");
        const fits = pool(ctx);
        const sz = ctx.size();
        let minSize = 16, maxSize = sz.height > 440 ? 72 : 48;
        const rows = ctx.$$(".row").map((row, i) => {
          const r = { lab: row.querySelector(".rlab"), lane: row.querySelector(".lane"), lin: row.querySelector(".lin"), el: row.querySelector(".ft") };
          r.el.textContent = CLAMP_ROWS[i].text;
          r.slack = h("i", { class: "slack" });
          ctx.on(r.el, "fit", (e) => paintRow(i, e.detail.newValue));
          return r;
        });
        const paintRow = (i, size) => {
          const r = rows[i], room = r.lin.clientWidth, used = r.el.offsetWidth;
          const atMax = size >= maxSize - 0.01, atMin = size <= minSize + 0.01;
          let note = `<span class="ok">在範圍內</span>`;
          if (atMax) note = `<span class="warn">撞到上限</span>，留白 <b>${Math.max(0, room - used)}</b> px`;
          if (atMin) note = `<span class="warn">撞到下限</span>，溢出 <b>${Math.max(0, used - room)}</b> px`;
          r.lab.innerHTML = `<span class="nm">${CLAMP_ROWS[i].name}</span><b>${n1(size)}</b> px<span class="st">${note}</span>`;
          r.lane.classList.toggle("over", atMin && used > room);
          if (atMax && room - used > 1) {
            // The lane has 10px right padding, so the hatched area covers it too
            r.slack.style.width = `${room - used + 10}px`;
            r.lane.append(r.slack);
          } else r.slack.remove();
        };
        const build = () => {
          fits.clear();
          rows.forEach((r) => fits.add(r.el, { minSize, maxSize, multiLine: false }));
          read.textContent = `fitty(el, { minSize: ${minSize}, maxSize: ${maxSize}, multiLine: false })`;
        };
        ctx.slider("minSize", { min: 8, max: 40, step: 1, value: minSize, format: (v) => `${v} px` }, (v) => {
          minSize = Math.min(v, maxSize);
          build();
        });
        ctx.slider("maxSize", { min: 24, max: 160, step: 2, value: maxSize, format: (v) => `${v} px` }, (v) => {
          maxSize = Math.max(v, minSize);
          build();
        });
        onWidth(ctx, rows.map((r) => r.lin), (t) => fits.list[rows.findIndex((r) => r.lin === t)]?.fit());
        build();
      },
    },
    {
      id: "multiline", title: "多行換行",
      api: "fitty(el, { minSize: 22, multiLine: true })",
      desc: "multiLine（預設開）只在字級撞到 minSize 時才生效：fitty 把 white-space 從 nowrap 改回 normal，讓長句換行。關掉它，長句停在下限後就直接溢出。",
      hint: "拖動卡片寬度，越過門檻時左邊會換行、右邊會溢出",
      mount(ctx) {
        const TEXT = "放不下又不能再縮小時，才換行";
        ctx.html(`<div class="stage"><div class="mcards">${[true, false].map((m) => `<div class="mcard"><div class="mhead">multiLine: <b>${m}</b></div><div class="mbox"><span class="ft">${TEXT}</span></div><div class="mread"></div></div>`).join("")}</div><div class="read"></div></div>`);
        const cards = ctx.$(".mcards"), read = ctx.$(".read");
        const fits = pool(ctx);
        let minSize = 22;
        const items = ctx.$$(".mcard").map((card, i) => ({ multi: i === 0, box: card.querySelector(".mbox"), el: card.querySelector(".ft"), out: card.querySelector(".mread") }));
        const paint = (it, size) => {
          const ws = it.el.style.whiteSpace, over = it.el.offsetWidth - it.box.clientWidth;
          it.box.classList.toggle("over", over > 1);
          it.out.innerHTML = `<b>${n1(size)}</b> px · <b>${ws}</b>`
            + (over > 1 ? ` · <span class="warn">溢出 ${over} px</span>` : "");
        };
        items.forEach((it) => ctx.on(it.el, "fit", (e) => paint(it, e.detail.newValue)));
        const build = () => {
          fits.clear();
          items.forEach((it) => fits.add(it.el, { minSize, maxSize: 80, multiLine: it.multi }));
          read.innerHTML = `門檻寬度約 <b>${Math.round([...TEXT].length * minSize)}</b> px：比這窄就撞到下限 <b>${minSize}</b> px`;
        };
        ctx.slider("卡片寬度", { min: 140, max: 440, step: 2, value: 240, format: (v) => `${v} px` }, (v) => { cards.style.setProperty("--cw", `${v}px`); });
        ctx.slider("minSize", { min: 12, max: 32, step: 1, value: minSize, format: (v) => `${v} px` }, (v) => { minSize = v; build(); });
        // fitty measures scrollWidth as-is; reset a wrapped line to nowrap first, or the wrapped width skews the ratio
        onWidth(ctx, items.map((it) => it.box), (t) => {
          const i = items.findIndex((it) => it.box === t);
          items[i].el.style.whiteSpace = "nowrap";
          fits.list[i]?.fit();
        });
        build();
      },
    },
    {
      id: "mutate", title: "內容變動自動重算",
      api: "fitty(el, { observeMutations: { subtree: true, childList: true, characterData: true } })",
      desc: "每個實例預設掛一個 MutationObserver，文字一變就重算。把 observeMutations 設成 false，內容變了字級不會跟著動，要自己呼叫 fit()。",
      hint: "關掉 observeMutations，看跳動的數字怎麼撐破卡片",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="tick"><div class="tlab">即時計數（每 0.45 秒改一次文字）</div><div class="tbox"><span class="ft num"></span></div>
          <div class="tlab">可以打字的一行</div><div class="tbox"><span class="ft edit" contenteditable="true" spellcheck="false">點這裡打字，字級會跟著變</span></div></div><div class="read"></div></div>`);
        const num = ctx.$(".num"), edit = ctx.$(".edit"), read = ctx.$(".read");
        const fits = pool(ctx);
        // Short stages cannot hold two 96px lines plus labels
        const maxSize = ctx.size().height < 440 ? 56 : 96;
        let observe = true, running = true, value = 1234, changes = 0, events = 0;
        const paint = () => {
          read.innerHTML = `文字變動 <b>${changes}</b> 次　fit 事件 <b>${events}</b> 次`
            + (observe ? "" : `<br><span class="warn">observeMutations: false，內容改了也不會重算；按「手動 fit()」才更新</span>`);
        };
        [num, edit].forEach((el) => ctx.on(el, "fit", () => { events++; paint(); }));
        ctx.on(edit, "input", () => { changes++; paint(); });
        const build = () => {
          fits.clear();
          [num, edit].forEach((el) => fits.add(el, { minSize: 14, maxSize, observeMutations: observe ? { subtree: true, childList: true, characterData: true } : false }));
          paint();
        };
        const show = () => { num.textContent = `累計 ${value.toLocaleString("en-US")} 次`; };
        ctx.toggle("observeMutations", observe, (v) => { observe = v; build(); });
        ctx.toggle("數字跳動", running, (v) => { running = v; });
        ctx.button("手動 fit()", () => fits.list.forEach((f) => f.fit()));
        ctx.interval(() => {
          if (!running) return;
          value = value > 2e9 ? 7 : Math.round(value * (1.5 + Math.random() * 0.9) + 7);
          show();
          changes++;
          paint();
        }, 450);
        show();
        build();
        onWidth(ctx, [num.parentNode, edit.parentNode], (t) => fits.list[t === num.parentNode ? 0 : 1]?.fit());
      },
    },
    {
      id: "resize", title: "拖曳改寬與 fit 事件",
      api: "new ResizeObserver(() => fitted.fit()) · el.addEventListener(\"fit\", (e) => e.detail)",
      desc: "fitty 自己只監聽 window 的 resize（fitty.observeWindow）。容器因版面變動而改寬時，要用 ResizeObserver 接到 fit()。每次重算都會觸發 fit 事件，detail 帶著 oldValue、newValue 與 scaleFactor。",
      hint: "拖右邊的把手；關掉 ResizeObserver 再拖拖看",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="rzwrap"><div class="rz"><div class="rzbox"><span class="ft">拖右邊的把手改寬度</span></div><div class="grip" title="拖曳改寬"></div></div></div><div class="log"></div></div>`);
        const wrap = ctx.$(".rzwrap"), rz = ctx.$(".rz"), box = ctx.$(".rzbox"), el = ctx.$(".rzbox .ft"), grip = ctx.$(".grip"), log = ctx.$(".log");
        const fits = pool(ctx);
        const f = fits.add(el, { minSize: 10, maxSize: 120 });
        let roOn = true, swing = true, drag = null, count = 0;
        const rows = [];
        ctx.on(el, "fit", (e) => {
          const d = e.detail;
          count++;
          rows.unshift(`#${count}　<b>${n1(d.oldValue)}</b> → <b>${n1(d.newValue)}</b>　×${d.scaleFactor.toFixed(3)}`);
          rows.length = Math.min(rows.length, 5);
          log.innerHTML = `<div class="hd">fit 事件共 <b>${count}</b> 次，最新 5 筆 event.detail：<br><span class="code">oldValue → newValue　×scaleFactor</span></div>`
            + rows.map((r) => `<div class="r">${r}</div>`).join("");
        });
        onWidth(ctx, [box], () => { if (roOn) f.fit(); });
        const setW = (w) => { rz.style.width = `${Math.max(140, Math.min(wrap.clientWidth, w))}px`; };
        ctx.toggle("ResizeObserver 接 fit()", roOn, (v) => { roOn = v; if (v) f.fit(); });
        const swingBtn = ctx.toggle("自動擺動", swing, (v) => { swing = v; });
        ctx.button("fit()", () => f.fit());
        ctx.on(grip, "pointerdown", (e) => {
          drag = { x: e.clientX, w: rz.offsetWidth };
          swing = false;
          swingBtn.setAttribute("aria-pressed", "false");
          grip.setPointerCapture(e.pointerId);
          e.preventDefault();
        });
        ctx.on(grip, "pointermove", (e) => { if (drag) setW(drag.w + e.clientX - drag.x); });
        ctx.on(grip, "pointerup", () => { drag = null; });
        ctx.on(grip, "pointercancel", () => { drag = null; });
        let phase = 0;
        ctx.raf((t, dt) => {
          if (!swing || drag) return;
          phase += dt / 1400;
          const max = wrap.clientWidth, min = Math.min(160, max);
          setW(min + (max - min) * (0.55 + 0.45 * Math.sin(phase)));
        });
      },
    },
    {
      id: "freeze", title: "fitAll 與 freeze",
      api: "fitty.fitAll({ sync: true }) · instance.freeze() · instance.unfreeze()",
      desc: "換字型這種純 CSS 變動，MutationObserver 看不到，要呼叫 fitty.fitAll() 一次重算全部實例。被 freeze() 的實例會被跳過，unfreeze() 時再補算。",
      hint: "點卡片切換凍結，再換字型比較",
      mount(ctx) {
        ctx.html(`<div class="stage"><div class="tags" data-font="0">${TAG_WORDS.map((w, i) => `<button type="button" class="tag"><div class="tst"><span class="st">啟用</span><b></b></div><div class="tbx"><span class="ft" style="color:${C[i % C.length]}">${w}</span></div></button>`).join("")}</div><div class="read"></div></div>`);
        const tags = ctx.$(".tags"), read = ctx.$(".read");
        const fits = pool(ctx);
        const maxSize = ctx.size().height < 440 ? 40 : 64;
        let autoAll = true, last = null, events = 0;
        const items = ctx.$$(".tag").map((tag) => {
          const el = tag.querySelector(".ft"), size = tag.querySelector(".tst b");
          ctx.on(el, "fit", (e) => { events++; size.textContent = n1(e.detail.newValue); });
          return { tag, el, f: fits.add(el, { minSize: 10, maxSize }), frozen: false };
        });
        const paint = () => {
          const fz = items.filter((it) => it.frozen).length;
          read.innerHTML = `啟用 <b>${items.length - fz}</b> 個、凍結 <b>${fz}</b> 個（卡片右上角是字級 px）`
            + (last == null ? "　點卡片可凍結" : `　上次 fitAll() 觸發 <b>${last}</b> 個 fit 事件`)
            + (autoAll ? "" : `<br><span class="warn">換字型後沒呼叫 fitAll()：字寬變了，字級還是舊的</span>`);
        };
        const fitAll = () => {
          const before = events;
          fitty.fitAll({ sync: true });
          last = events - before;
          paint();
        };
        const setFrozen = (it, v) => {
          it.frozen = v;
          it.tag.classList.toggle("frozen", v);
          it.tag.querySelector(".st").textContent = v ? "凍結" : "啟用";
          if (v) it.f.freeze(); else it.f.unfreeze();
        };
        items.forEach((it) => ctx.on(it.tag, "click", () => { setFrozen(it, !it.frozen); paint(); }));
        ctx.group(FONTS, 0, (i) => {
          tags.dataset.font = String(i);
          if (autoAll) fitAll(); else paint();
        });
        ctx.toggle("換字型後呼叫 fitAll()", autoAll, (v) => { autoAll = v; paint(); });
        ctx.button("fitty.fitAll()", fitAll);
        onWidth(ctx, items.map((it) => it.el.parentNode), (t) => items.find((it) => it.el.parentNode === t)?.f.fit());
        // Start with two frozen cards after the first fit has landed
        ctx.frame(2).then(() => {
          if (!ctx.active) return;
          setFrozen(items[1], true);
          setFrozen(items[4], true);
          paint();
        });
        paint();
      },
    },
    {
      id: "pitfall", title: "兩個常見陷阱",
      api: "availableWidth = el.parentNode.clientWidth · currentWidth = el.scrollWidth",
      desc: "fitty 拿父層的 clientWidth 當可用寬度，而 clientWidth 含 padding，所以 padding 加在父層會撐破；文字元素若被設成 block 或 width:100%，scrollWidth 永遠等於父層寬，比例恆為 1，字就放不大。把 padding 放外層、文字保持 inline-block 才對。",
      hint: "拖 padding，對照三張卡片的寬度數字",
      mount(ctx) {
        const TEXT = "撐滿這一行";
        ctx.html(`<div class="stage"><div class="pits">
          <div class="pit bad"><h3>父層加 padding<span class="tag2">錯誤</span></h3><div class="pcard"><span class="ft">${TEXT}</span></div><div class="pread"></div></div>
          <div class="pit bad"><h3>文字設成 block<span class="tag2">錯誤</span></h3><div class="pcard blk"><div class="pin"><span class="ft">${TEXT}</span></div></div><div class="pread"></div></div>
          <div class="pit good"><h3>padding 放外層<span class="tag2">正確</span></h3><div class="pcard"><div class="pin"><span class="ft">${TEXT}</span></div></div><div class="pread"></div></div>
          </div><div class="plegend"><i></i>橘色區塊是 padding</div></div>`);
        const pits = ctx.$(".pits");
        const fits = pool(ctx);
        const items = ctx.$$(".pit").map((pit) => {
          const el = pit.querySelector(".ft");
          return { el, parent: el.parentNode, out: pit.querySelector(".pread"), f: fits.add(el, { minSize: 10, maxSize: 120 }) };
        });
        const paint = () => {
          const [a, b, c] = items;
          const pad = (x) => parseFloat(getComputedStyle(x).paddingLeft) + parseFloat(getComputedStyle(x).paddingRight);
          const aRoom = a.parent.clientWidth - pad(a.parent);
          a.out.innerHTML = `可用寬度取 clientWidth <b>${a.parent.clientWidth}</b> px（含 padding）<br>實際內容寬 <b>${Math.round(aRoom)}</b> px，字寬 <b>${a.el.offsetWidth}</b> px`;
          b.out.innerHTML = `字級停在原本的 <b>${n1(parseFloat(getComputedStyle(b.el).fontSize))}</b> px<br>scrollWidth <b>${b.el.scrollWidth}</b> = 父層寬 <b>${b.parent.clientWidth}</b>，比例恆為 1`;
          c.out.innerHTML = `父層 clientWidth <b>${c.parent.clientWidth}</b> px<br>字寬 <b>${c.el.offsetWidth}</b> px，剛好撐滿`;
        };
        items.forEach((it) => ctx.on(it.el, "fit", () => requestAnimationFrame(() => { if (ctx.active) paint(); })));
        ctx.slider("padding", { min: 0, max: 40, step: 1, value: 24, format: (v) => `${v} px` }, (v) => { pits.style.setProperty("--p", `${v}px`); });
        // The content box shrinks as padding grows, so the observer fires for card A too
        onWidth(ctx, items.map((it) => it.parent), (t) => items.find((it) => it.parent === t)?.f.fit());
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "fitty(\".cell .ft\") · fitty.fitAll({ sync: true })",
      desc: "先讓大量元素各自 fit 好，再把每格的寬度改掉，量測一次 fitAll({ sync: true }) 重算全部加上瀏覽器重排的時間。",
      hint: "按「開始測試」，元素數會一路加到超過預算為止",
      mount(ctx) {
        ctx.html(`<div class="sbox"><p class="sres">每格一個 fitty 實例（observeMutations 關閉）。按「開始測試」後，結果會留在這裡。</p><div class="cells"></div></div>`);
        const cells = ctx.$(".cells"), res = ctx.$(".sres");
        let insts = [], created = 0, removed = 0, removedN = 0;
        const clear = () => {
          const t0 = performance.now();
          removedN = insts.length;
          insts.forEach((f) => f.unsubscribe());
          insts = [];
          removed = performance.now() - t0;
        };
        ctx.onCleanup(clear);
        ctx.bench({
          label: "元素數", unit: "個", sizes: [100, 300, 1000, 3000, 10000],
          note: "fitty 把所有實例的讀取（clientWidth、scrollWidth）與寫入（font-size）分批進行，一次重算只觸發一輪重排。unsubscribe() 每次都過濾整份全域清單，大量解除是 O(n²)，下方數字會看得出來。",
          async prepare(n) {
            clear();
            cells.classList.remove("narrow");
            cells.replaceChildren(...Array.from({ length: n }, (_, i) => h("div", { class: "cell" },
              h("span", { class: "ft", style: `color:${C[i % C.length]}`, text: CELL_WORDS[i % CELL_WORDS.length] }))));
            await ctx.frame(1);
            const t0 = performance.now();
            insts = fitty(".sbox .cell .ft", { minSize: 6, maxSize: 40, observeMutations: false });
            fitty.fitAll({ sync: true });
            created = performance.now() - t0;
            // Change every cell width so the timed run has real work to do
            cells.classList.add("narrow");
          },
          async run(n) {
            const t0 = performance.now();
            fitty.fitAll({ sync: true });
            const t1 = performance.now();
            void cells.offsetHeight;
            const t2 = performance.now();
            res.innerHTML = `最近一次：<b>${n}</b> 個元素　改寬後 fitAll 重算 <b>${fmtMs(t1 - t0)}</b>，之後重排 <b>${fmtMs(t2 - t1)}</b><br>`
              + `不計時的部分：建立實例並首次 fit <b>${fmtMs(created)}</b>`
              + (removedN ? `，unsubscribe() 上一輪 ${removedN} 個 <b>${fmtMs(removed)}</b>` : "");
          },
        });
      },
    },
  ],
});
</script>
</body>
</html>
