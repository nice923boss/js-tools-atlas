<style>
  .fp-board { position: absolute; inset: 0; overflow: hidden; display: flex; gap: 14px; align-items: center; justify-content: center;

  .fp-dark .flatpickr-weekwrapper .flatpickr-weeks { box-shadow: 1px 0 0 var(--line); }

  /* scene 1: paper booking (light) */
  .fp-book .flatpickr-calendar.inline { box-shadow: 0 10px 30px rgba(0,0,0,.08), 0 0 0 1px var(--line); border-radius: 12px; }
  .fp-book .flatpickr-day { position: relative; }

  .fp-book .flatpickr-day.selected .fp-dot, .fp-book .flatpickr-day.startRange .fp-dot, .fp-book .flatpickr-day.endRange .fp-dot { box-shadow: 0 0 0 1.5px #fff; }
  .fp-book .flatpickr-day.flatpickr-disabled { text-decoration: line-through; }
  .fp-book .flatpickr-day.selected, .fp-book .flatpickr-day.startRange, .fp-book .flatpickr-day.endRange { background: var(--c6); border-color: var(--c6); }
  .fp-book .flatpickr-day.inRange { background: #ece9ff; border-color: #ece9ff; box-shadow: -5px 0 0 #ece9ff, 5px 0 0 #ece9ff; }
  .fp-book .flatpickr-day.today { border-color: var(--c3); }
  .fp-book .flatpickr-weekday:first-child, .fp-book .flatpickr-weekday:last-child { color: var(--c3); }
  .fp-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .fp-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .fp-legend s { color: #b9b6ac; }
  .fp-book .fp-side { flex-basis: 260px; background: var(--bg-2); box-shadow: 0 10px 30px rgba(0,0,0,.06); }
  .fp-range { font-size: 14px; font-weight: 700; line-height: 1.5; min-height: 42px; }
  .fp-total { display: flex; justify-content: space-between; align-items: baseline; }
  .fp-total b { font: 700 20px var(--mono); color: var(--c6); }
  .fp-book .fp-side .flatpickr-calendar.inline { width: 100% !important; box-shadow: 0 0 0 1px var(--line); border-radius: 8px; }

  /* scene 3: rule markers */
  .fp-dark .flatpickr-day.fp-hol { position: relative; color: var(--c3); }
  .fp-dark .flatpickr-day.fp-hol::after { content: ""; position: absolute; right: 7px; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--c3); }
  .fp-dark .flatpickr-day.fp-extra { box-shadow: inset 0 -3px 0 var(--c4); }
  /* scene 4: sprint stripes */
  .fp-dark .flatpickr-day.fp-odd:not(.inRange):not(.startRange):not(.endRange):not(.prevMonthDay):not(.nextMonthDay) { background: rgba(76,201,240,.1); }

  /* scene 5: form with popups mounted inside the scene */
  .fp-form { width: min(330px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg-2); }
  .fp-form h3 { margin: 0; font-size: 15px; }
  .fp-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
  .fp-form input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: #11141a; color: var(--fg); font: 14px var(--font); cursor: pointer; }
  .fp-form input.active { border-color: var(--c6); }
  .fp-form .flatpickr-wrapper { display: block; }
  .fp-form .fp-btns { display: flex; gap: 6px; flex-wrap: wrap; }

  /* scene 6: API buttons */
  .fp-api { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }

  .fp-parse { display: flex; gap: 5px; }
  .fp-parse input { flex: 1; min-width: 0; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: #11141a; color: var(--fg); font: 12px var(--mono); }

  /* scene 8: stress */
  .fp-board.fp-lab { align-items: stretch; justify-content: flex-start; flex-direction: column; gap: 6px; }
  .fp-grid { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 4px; }
  .fp-grid .flatpickr-calendar.inline { zoom: .4; }

  @media (max-height: 480px) and (min-width: 561px) {

  @media (max-width: 560px) {

    .fp-side { flex: 1 1 auto; width: 100%; max-width: 340px; min-height: 0; padding: 8px 12px; gap: 5px; }

<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh-tw.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const DAY = 864e5;
const today = new Date(new Date().setHours(0, 0, 0, 0));
const plus = (n) => new Date(today.getFullYear(), today.getMonth(), today.getDate() + n);
const key = (d) => d.toDateString();
const WEEK = "日一二三四五六";
const md = (d) => `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

// One flatpickr slot per input: rebuilding destroys the previous instance, scene cleanup destroys the last one.
function slot(ctx) {
  let cur = null;
  ctx.onCleanup(() => { if (cur) cur.destroy(); cur = null; });
  return (el, opts) => {
    if (cur) cur.destroy();
    cur = flatpickr(el, { disableMobile: true, locale: "zh_tw", ...opts });
    return cur;
  };
}
function logger(box, max = 40) {
  return (html) => {
    const d = document.createElement("div");
    d.innerHTML = html;
    box.prepend(d);
    while (box.children.length > max) box.lastChild.remove();
  };
}

Showcase.run({ scenes: [
  {
    id: "book", title: "教室預約", paper: true,
    api: "flatpickr(el, { inline, mode, minDate, disable, showMonths, onDayCreate, onChange })",
    desc: "原示範升級：inline 月曆可切單日、區間、多選；onDayCreate 在有課的日子加圓點，額滿日用 disable 擋掉，右側即時計算場地費，下方再掛一個只選時間的 noCalendar 實例。",
    hint: "點兩個日期選出區間，圓點是已排課，刪除線是額滿",
    mount(ctx) {
      ctx.html(`<div class="fp-board fp-book">
        <div class="fp-col"><input type="hidden" class="fp-in">
          <div class="fp-legend"><span><i style="background:#1f8fb8"></i>AI 工具課</span><span><i style="background:#e06a1b"></i>簡報設計課</span><span><s>18</s> 已額滿</span></div>
        </div>
        <div class="fp-side">
          <h4>預約明細</h4>
          <div class="fp-range"></div>
          <div class="fp-kv"><span>使用天數</span><b class="fp-num" data-k="days"></b></div>
          <div class="fp-kv"><span>其中有課日</span><b class="fp-num" data-k="busy"></b></div>
          <div class="fp-total"><span>預估場地費（示意）</span><b data-k="total"></b></div>
          <div class="fp-label fp-hide-n">每日開始時間 <code class="fp-num" data-k="time">09:30</code></div>
          <div class="fp-hide-n"><input type="hidden" class="fp-time"></div>
          <div class="fp-note fp-hide-n">平日 NT$1,800、週末 NT$2,400 一天</div>
        </div></div>`);
      const COURSES = new Map([[2, "#1f8fb8"], [5, "#e06a1b"], [9, "#1f8fb8"], [12, "#e06a1b"], [16, "#1f8fb8"], [23, "#e06a1b"], [27, "#1f8fb8"], [33, "#e06a1b"]]
        .map(([n, c]) => [key(plus(n)), c]));
      const FULL = [7, 14, 21].map(plus);
      const price = (d) => (d.getDay() === 0 || d.getDay() === 6 ? 2400 : 1800);
      const out = (k, v) => (ctx.$(`[data-k="${k}"]`).textContent = v);
      function summarize(dates, mode) {
        let days = [];
        if (mode === "range" && dates.length === 2) {
          for (let d = dates[0]; d <= dates[1]; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) days.push(d);
          days = days.filter((d) => !FULL.some((f) => key(f) === key(d)));
        } else if (mode !== "range") days = dates.slice();
        ctx.$(".fp-range").textContent = !dates.length ? "請在月曆上選擇日期"
          : mode === "range" ? (dates.length === 2 ? `${md(dates[0])} 至 ${md(dates[1])}` : `${md(dates[0])} 起，請再點結束日`)
          : mode === "multiple" ? dates.slice().sort((a, b) => a - b).map(md).join("、") : md(dates[0]);
        out("days", `${days.length} 天`);
        out("busy", `${days.filter((d) => COURSES.has(key(d))).length} 天`);
        out("total", `NT$${days.reduce((s, d) => s + price(d), 0).toLocaleString("zh-TW")}`);
      }
      const make = slot(ctx);
      let mode = "range", months = 0;
      function build() {
        months = ctx.size().width >= 900 ? 2 : 1;
        const defaults = { range: [plus(3), plus(6)], single: [plus(3)], multiple: [plus(3), plus(5), plus(10)] }[mode];
        const fp = make(ctx.$(".fp-in"), {
          inline: true, mode, minDate: "today", disable: FULL, defaultDate: defaults, showMonths: months, dateFormat: "Y-m-d",
          onDayCreate(_, __, ___, dayElem) {
            const c = COURSES.get(key(dayElem.dateObj));
            if (c) dayElem.insertAdjacentHTML("beforeend", `<span class="fp-dot" style="background:${c}"></span>`);
          },
          onChange: (dates) => summarize(dates, mode),
        });
        summarize(fp.selectedDates, mode);
      }
      ctx.group(["單日", "區間", "多選"], 1, (i) => { mode = ["single", "range", "multiple"][i]; build(); });
      build();
      ctx.onResize(({ width }) => { if ((width >= 900 ? 2 : 1) !== months) build(); });
      slot(ctx)(ctx.$(".fp-time"), {
        inline: true, enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true, minuteIncrement: 15, defaultDate: "09:30",
        onChange: (_, str) => out("time", str),
      });
    },
  },
  {
    id: "time", title: "時間選擇與 24 小時制",
    api: "enableTime, time_24hr, minuteIncrement, enableSeconds, minTime / maxTime, noCalendar",
    desc: "開始時間用帶月曆的 enableTime，結束時間用 noCalendar 只選時間。開始一改，結束實例就用 set(\"minTime\") 跟著往後推；minTime／maxTime 會把時間輸入框夾在上班時段內。",
    hint: "點時與分的數字可以直接打字或用滾輪調整",
    mount(ctx) {
      ctx.html(`<div class="fp-board fp-dark">
        <div class="fp-col"><span class="fp-label">會議開始（enableTime）</span><input type="hidden" class="fp-s"></div>
        <div class="fp-col fp-side">
          <h4>會議結束（noCalendar）</h4><input type="hidden" class="fp-e">
          <div class="fp-kv"><span>開始 input.value</span><code data-k="s"></code></div>
          <div class="fp-kv"><span>結束 input.value</span><code data-k="e"></code></div>
          <div class="fp-kv"><span>會議長度</span><b data-k="len"></b></div>
          <pre class="fp-code fp-hide-n" data-k="code"></pre>
        </div></div>`);
      const o = { h24: true, step: 15, sec: false, office: true };
      const mkS = slot(ctx), mkE = slot(ctx);
      let s = null, e = null, sVal = new Date(plus(1).setHours(10, 0)), eVal = new Date(plus(1).setHours(11, 30));
      const mins = (d) => d.getHours() * 60 + d.getMinutes();
      const hm = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
      function render() {
        const out = (k, v) => (ctx.$(`[data-k="${k}"]`).textContent = v);
        out("s", s.input.value); out("e", e.input.value);
        const len = e.selectedDates[0] && s.selectedDates[0] ? mins(e.selectedDates[0]) - mins(s.selectedDates[0]) : 0;
        out("len", `${Math.floor(len / 60)} 小時 ${len % 60} 分`);
        ctx.$('[data-k="code"]').innerHTML = `time_24hr: <i>${o.h24}</i>\nminuteIncrement: <i>${o.step}</i>\nenableSeconds: <i>${o.sec}</i>\n` +
          (o.office ? `minTime: <i>"09:00"</i>, maxTime: <i>"18:00"</i>\n` : "") + `end.minTime = <i>"${hm(Math.min(mins(s.selectedDates[0] || sVal) + o.step, 1439))}"</i>`;
      }
      function follow() {
        const sd = s.selectedDates[0];
        if (!sd) return render();
        sVal = sd;
        const lo = Math.min(mins(sd) + o.step, 1439);
        e.set("minTime", hm(lo));
        const ed = e.selectedDates[0];
        if (!ed || mins(ed) < lo) {
          const t = Math.min(mins(sd) + 60, o.office ? 18 * 60 : 1439);
          e.setDate(new Date(new Date(today).setHours(Math.floor(t / 60), t % 60)), false);
        }
        eVal = e.selectedDates[0] || eVal;
        render();
      }
      function build() {
        const tf = o.sec ? "H:i:S" : "H:i";
        const base = { enableTime: true, inline: true, time_24hr: o.h24, minuteIncrement: o.step, enableSeconds: o.sec,
          ...(o.office ? { minTime: "09:00", maxTime: "18:00" } : {}) };
        s = mkS(ctx.$(".fp-s"), { ...base, dateFormat: `Y-m-d ${tf}`, minDate: "today", defaultDate: sVal, onChange: follow });
        e = mkE(ctx.$(".fp-e"), { ...base, noCalendar: true, dateFormat: tf, defaultDate: eVal, onChange: () => { eVal = e.selectedDates[0] || eVal; render(); } });
        follow();
      }
      ctx.toggle("24 小時制", true, (v) => { o.h24 = v; build(); });
      ctx.select("", [1, 5, 15, 30].map((m) => ({ value: m, label: `間隔 ${m} 分` })), 15, (v) => { o.step = +v; build(); });
      ctx.toggle("秒數", false, (v) => { o.sec = v; build(); });
      ctx.toggle("限上班時間", true, (v) => { o.office = v; build(); });
      build();
    },
  },
  {
    id: "rules", title: "可選日期規則",
    api: "minDate, maxDate, disable: [fn, Date, { from, to }], enable: [...], fp.isEnabled(date)",
    desc: "門診掛號：minDate／maxDate 先劃出可預約範圍，disable 可以混用函式（週末）、日期清單（國定假日）與區間物件（醫師休假）；切到 enable 則反過來，只開放白名單上的日子。",
    hint: "滑過紅點日期可看到假日名稱，換月時右側會重算可掛號天數",
    mount(ctx) {
      ctx.html(`<div class="fp-board fp-dark">
        <div class="fp-col"><input type="hidden" class="fp-in"></div>
        <div class="fp-side">
          <h4>目前生效的規則</h4><pre class="fp-code" data-k="code"></pre>
          <div class="fp-kv"><span>這個月可掛號</span><b class="fp-num" data-k="cnt"></b></div>
          <div class="fp-kv"><span>已選</span><b data-k="sel">尚未選擇</b></div>
          <div class="fp-note fp-hide-n">isEnabled() 是實例方法，用同一套規則判斷任一天能不能選，這裡拿它來數可掛號天數。</div>
        </div></div>`);
      const y = today.getFullYear();
      const HOL = [[1, 1, "元旦"], [2, 28, "和平紀念日"], [4, 4, "兒童節"], [5, 1, "勞動節"], [9, 28, "教師節"], [10, 10, "國慶日"], [10, 25, "臺灣光復節"], [12, 25, "行憲紀念日"]]
        .flatMap(([m, d, name]) => [y, y + 1].map((yy) => ({ date: new Date(yy, m - 1, d), name })));
      const holName = new Map(HOL.map((h) => [key(h.date), h.name]));
      const leave = { from: plus(8), to: plus(12) };
      const extra = plus(today.getDay() === 1 ? 6 : 5);
      const o = { white: false, weekend: true, hol: true, leave: true, max: 30 };
      const make = slot(ctx);
      let fp = null;
      const out = (k, v) => (ctx.$(`[data-k="${k}"]`).innerHTML = v);
      function count() {
        const n = new Date(fp.currentYear, fp.currentMonth + 1, 0).getDate();
        let c = 0;
        for (let d = 1; d <= n; d++) if (fp.isEnabled(new Date(fp.currentYear, fp.currentMonth, d))) c++;
        out("cnt", `${fp.currentMonth + 1} 月 ${c} 天`);
      }
      function build() {
        const rules = [];
        if (o.weekend) rules.push((d) => d.getDay() === 0 || d.getDay() === 6);
        if (o.hol) rules.push(...HOL.map((h) => h.date));
        if (o.leave) rules.push(leave);
        const enable = [(d) => d.getDay() === 2 || d.getDay() === 4, extra];
        fp = make(ctx.$(".fp-in"), {
          inline: true, minDate: "today", maxDate: new Date(today.getTime() + o.max * DAY),
          ...(o.white ? { enable } : { disable: rules }),
          onDayCreate(_, __, ___, el) {
            const name = holName.get(key(el.dateObj));
            if (name) { el.classList.add("fp-hol"); el.title = name; }
            if (o.white && key(el.dateObj) === key(extra)) { el.classList.add("fp-extra"); el.title = "加診"; }
            if (!o.white && o.leave && el.dateObj >= leave.from && el.dateObj <= leave.to) el.title = "醫師休假";
          },
          onChange: (d) => out("sel", d[0] ? md(d[0]) : "尚未選擇"),
          onMonthChange: count, onYearChange: count,
        });
        const lines = [`minDate: <i>"today"</i>`, `maxDate: <i>今天 + ${o.max} 天</i>`];
        if (o.white) lines.push(`enable: [`, `  d =&gt; 週二或週四,`, `  <i>${md(extra)}</i> 加診`, `]`);
        else {
          lines.push(`disable: [`);
          if (o.weekend) lines.push(`  d =&gt; d.getDay() % 6 === 0,`);
          if (o.hol) lines.push(`  ...國定假日 <i>${HOL.length}</i> 個 Date,`);
          if (o.leave) lines.push(`  { from: <i>${md(leave.from)}</i>,`, `    to: <i>${md(leave.to)}</i> },`);
          lines.push(`]`);
        }
        out("code", lines.join("\n"));
        count();
      }
      const tg = [];
      ctx.group(["disable 黑名單", "enable 白名單"], 0, (i) => { o.white = i === 1; tg.forEach((b) => (b.disabled = o.white)); build(); });
      tg.push(ctx.toggle("週末休診", true, (v) => { o.weekend = v; build(); }));
      tg.push(ctx.toggle("國定假日", true, (v) => { o.hol = v; build(); }));
      tg.push(ctx.toggle("醫師休假", true, (v) => { o.leave = v; build(); }));
      ctx.select("", [14, 30, 60].map((n) => ({ value: n, label: `maxDate ${n} 天` })), 30, (v) => { o.max = +v; build(); });
      build();
    },
  },
  {
    id: "weeks", title: "週數與多月份",
    api: "weekNumbers, showMonths, getWeek(date), mode: \"range\", flatpickr.formatDate(d, \"W\")",
    desc: "衝刺規劃：showMonths 一次攤開多個月份方便拉長區間；weekNumbers 在左邊加週數欄，getWeek 可以把週數改寫成兩週一期的衝刺編號。注意原始碼只在 showMonths 為 1 時才畫週數欄。",
    hint: "點兩個日期選出衝刺區間，淺藍底是單數衝刺期",
    mount(ctx) {
      ctx.html(`<div class="fp-board fp-dark">
        <div class="fp-col"><input type="hidden" class="fp-in"></div>
        <div class="fp-side">
          <h4>排程摘要</h4>
          <div class="fp-kv"><span>區間</span><b data-k="range"></b></div>
          <div class="fp-kv"><span>ISO 週數</span><b class="fp-num" data-k="iso"></b></div>
          <div class="fp-kv"><span>衝刺期</span><b class="fp-num" data-k="sprint"></b></div>
          <div class="fp-kv"><span>工作天</span><b class="fp-num" data-k="work"></b></div>
          <div class="fp-note fp-warn" data-k="warn"></div>
        </div></div>`);
      const monday = plus(-((today.getDay() + 6) % 7));
      const sprintOf = (d) => Math.floor(Math.floor((d - monday) / DAY / 7) / 2) + 1;
      const o = { months: 1, weeks: true, sprint: false };
      const make = slot(ctx);
      let sel = [plus(3), plus(24)];
      const out = (k, v) => (ctx.$(`[data-k="${k}"]`).textContent = v);
      function render(d) {
        sel = d.length ? d : sel;
        if (d.length < 2) { out("range", d[0] ? `${md(d[0])} 起` : "請選擇"); out("iso", "…"); out("sprint", "…"); out("work", "…"); return; }
        out("range", `${md(d[0])} 至 ${md(d[1])}`);
        out("iso", `W${flatpickr.formatDate(d[0], "W")} 到 W${flatpickr.formatDate(d[1], "W")}`);
        out("sprint", d[1] < monday ? "專案開始前" : `S${Math.max(1, sprintOf(d[0]))} 到 S${sprintOf(d[1])}`);
        let w = 0;
        for (let x = d[0]; x <= d[1]; x = new Date(x.getFullYear(), x.getMonth(), x.getDate() + 1)) if (x.getDay() % 6) w++;
        out("work", `${w} 天`);
      }
      function build() {
        const wk = o.weeks && o.months === 1;
        out("warn", o.weeks && o.months > 1 ? "showMonths 大於 1 時 weekNumbers 不會畫週數欄（flatpickr 4.6.13 的限制），改看淺藍底的衝刺條紋。" : "");
        const fp = make(ctx.$(".fp-in"), {
          inline: true, mode: "range", showMonths: o.months, weekNumbers: wk, defaultDate: sel,
          ...(o.sprint ? { getWeek: (d) => (d < monday ? "" : `S${sprintOf(d)}`) } : {}),
          onDayCreate(_, __, ___, el) { if (el.dateObj >= monday && sprintOf(el.dateObj) % 2) el.classList.add("fp-odd"); },
          onChange: render,
        });
        render(fp.selectedDates);
      }
      const w = ctx.size().width;
      const max = w <= 560 ? 1 : Math.max(1, Math.min(3, Math.floor((w - 24 - 300 - 40) / 308)));
      if (max > 1) ctx.group(["1 個月", "2 個月", "3 個月"].slice(0, max), 0, (i) => { o.months = i + 1; build(); });
      ctx.toggle("weekNumbers", true, (v) => { o.weeks = v; build(); });
      ctx.group(["ISO 週數", "getWeek 衝刺編號"], 0, (i) => { o.sprint = i === 1; build(); });
      build();
    },
  },
  {
    id: "alt", title: "altInput 與掛載位置",
    api: "altInput, altFormat, dateFormat, appendTo, position(fp, el), static, open()",
    desc: "表單送出用機器格式 dateFormat，畫面上給人看的是 altInput 的 altFormat。彈出月曆預設掛在 document.body；這裡用 appendTo 掛回場景內並以 position 函式自己算座標，也可以切成 static 讓月曆跟著輸入框排版（但不會翻轉方向）。",
    hint: "點輸入框開月曆，右側顯示真正會送出的值",
    mount(ctx) {
      ctx.html(`<div class="fp-board fp-dark">
        <form class="fp-form" onsubmit="return false">
          <h3>出貨單</h3>
          <label>出貨日（altFormat 中文長格式）<input name="ship"></label>
          <label>到貨時段（dateFormat 含字面 T）<input name="slot"></label>
          <label>促銷期間（range）<input name="promo"></label>
        </form>
        <div class="fp-side">
          <h4>實際送出的 input.value</h4><pre class="fp-code" data-k="vals"></pre>
          <h4 class="fp-hide-n">掛載位置</h4><pre class="fp-code fp-hide-n" data-k="mount"></pre>
        </div></div>`);
      const board = ctx.$(".fp-board");
      const mk = { ship: slot(ctx), slot: slot(ctx), promo: slot(ctx) };
      const keep = { ship: plus(2), slot: new Date(plus(3).setHours(14, 0)), promo: [plus(7), plus(13)] };
      const inst = {};
      let useStatic = false;
      function render() {
        ctx.$('[data-k="vals"]').textContent = Object.keys(inst).map((n) => `${n}=${inst[n].input.value}`).join("\n");
        const c = inst.ship.calendarContainer;
        ctx.$('[data-k="mount"]').innerHTML = useStatic
          ? `static: <i>true</i>\n月曆在 <i>.flatpickr-wrapper</i> 裡\nposition: absolute; top: 100%`
          : `appendTo: <i>場景容器</i>\nposition: <i>(fp, el) =&gt; {...}</i>\n月曆父節點：<i>${c.parentNode === board ? ".fp-board" : esc(c.parentNode.tagName)}</i>`;
      }
      // Custom placement relative to the scene board: below the input, flipped above when there is no room.
      function place(fp, custom) {
        const el = custom || fp._input, cal = fp.calendarContainer;
        const b = board.getBoundingClientRect(), r = el.getBoundingClientRect();
        const h = cal.offsetHeight, w = cal.offsetWidth;
        // visible height: the stage clips the board on short viewports
        const vh = Math.min(b.bottom, board.closest(".sc-stage").getBoundingClientRect().bottom) - b.top;
        const below = r.bottom - b.top + 4, above = r.top - b.top - h - 4;
        cal.style.top = `${below + h <= vh ? below : above >= 0 ? above : Math.max(0, vh - h - 4)}px`;
        cal.style.left = `${Math.max(4, Math.min(r.left - b.left, board.clientWidth - w - 4))}px`;
      }
      function build() {
        const base = (n) => ({
          altInput: true, defaultDate: keep[n],
          ...(useStatic ? { static: true } : { appendTo: board, position: place }),
          onChange: (d) => { keep[n] = n === "promo" ? d : d[0]; render(); },
        });
        inst.ship = mk.ship(ctx.$('[name="ship"]'), { ...base("ship"), altFormat: "Y年n月j日（l）", dateFormat: "Y-m-d", minDate: "today" });
        inst.slot = mk.slot(ctx.$('[name="slot"]'), { ...base("slot"), enableTime: true, time_24hr: true, minuteIncrement: 30, altFormat: "n月j日 H:i", dateFormat: "Y-m-d\\TH:i" });
        inst.promo = mk.promo(ctx.$('[name="promo"]'), { ...base("promo"), mode: "range", altFormat: "n月j日", dateFormat: "Y-m-d" });
        render();
      }
      ctx.group(["appendTo + position 函式", "static: true"], 0, (i) => { useStatic = i === 1; build(); });
      ctx.button("open() 出貨日", () => ctx.timeout(() => inst.ship.open(), 0), { primary: true });
      build();
      ctx.timeout(() => inst.ship.open(), 500);
    },
  },
  {
    id: "api", title: "API 與事件",
    api: "setDate(d, triggerChange), jumpToDate(d, triggerChange), changeMonth(n), clear(), set(opt, val)",
    desc: "實例方法都能從外部驅動月曆，右側記錄每個動作觸發了哪些事件。重點是 setDate 第二個參數 triggerChange 預設 false：不傳就只改值、不會觸發 onChange。",
    hint: "依序按右側按鈕，觀察事件紀錄差異",
    mount(ctx) {
      ctx.html(`<div class="fp-board fp-dark">
        <div class="fp-col"><input type="hidden" class="fp-in"><span class="fp-label">selectedDates：<code class="fp-num" data-k="sel"></code></span></div>
        <div class="fp-side fp-wide">
          <div class="fp-api"></div>
          <h4>事件紀錄（新的在上）</h4><div class="fp-log"></div>
        </div></div>`);
      const log = logger(ctx.$(".fp-log"));
      let dayCount = 0, weekendOff = false;
      const sel = (fp) => (ctx.$('[data-k="sel"]').textContent = `[${fp.selectedDates.map((d) => fp.formatDate(d, "m/d")).join(", ")}]`);
      const ev = (name) => (dates, str, fp) => { log(`<b>${name}</b> ${esc(str || "")} <span>${fp.currentYear}/${fp.currentMonth + 1}</span>`); sel(fp); };
      const fp = slot(ctx)(ctx.$(".fp-in"), {
        inline: true, defaultDate: plus(1),
        onReady: ev("onReady"), onChange: ev("onChange"), onValueUpdate: ev("onValueUpdate"),
        onMonthChange: ev("onMonthChange"), onYearChange: ev("onYearChange"),
        onDayCreate: () => { if (!dayCount++) queueMicrotask(() => { log(`<b>onDayCreate</b> ×${dayCount} <span>重畫日格</span>`); dayCount = 0; }); },
      });
      const yearEnd = new Date(today.getFullYear(), 11, 31);
      const acts = [
        ["setDate(今天, true)", () => fp.setDate(today, true)],
        ["setDate(+7 天)", () => fp.setDate(plus(7))],
        ["jumpToDate(12/31, true)", () => fp.jumpToDate(yearEnd, true)],
        ["jumpToDate(今天)", () => fp.jumpToDate(today)],
        ["changeMonth(-1)", () => fp.changeMonth(-1)],
        ["changeMonth(+1)", () => fp.changeMonth(1)],
        ["clear()", () => fp.clear()],
        ["set(disable, 週末)", () => { weekendOff = !weekendOff; fp.set("disable", weekendOff ? [(d) => d.getDay() % 6 === 0] : []); }],
      ];
      for (const [label, fn] of acts) {
        const b = document.createElement("button");
        b.className = "btn"; b.type = "button"; b.textContent = label; b.title = label;
        b.addEventListener("click", () => { log(`<span>呼叫</span> ${esc(label)}`); fn(); });
        ctx.$(".fp-api").append(b);
      }
      sel(fp);
    },
  },
  {
    id: "l10n", title: "語系與日期格式",
    api: "locale, firstDayOfWeek, fp.formatDate(d, fmt), fp.parseDate(str, fmt), errorHandler",
    desc: "locale 決定月份、星期名稱與週起始日；同一個日期用不同格式字元輸出，右側即時顯示。下方用 parseDate 把自訂格式的字串解析回 Date，解析失敗交給 errorHandler 處理，不會只丟到 console。",
    hint: "改格式字串或日期字串後按「解析」",
    mount(ctx) {
      ctx.html(`<div class="fp-board fp-dark">
        <div class="fp-col"><input type="hidden" class="fp-in"></div>
        <div class="fp-side">
          <h4>formatDate 格式字元</h4><div class="fp-tok"></div>
          <h4>parseDate 反向解析</h4>
          <div class="fp-parse"><input class="fp-str" aria-label="日期字串"><input class="fp-fmt" aria-label="格式" style="flex:.7"><button class="btn" type="button">解析</button></div>
          <div class="fp-note" data-k="parse"></div>
        </div></div>`);
      const TOK = ["Y-m-d", "Y年n月j日", "l", "D", "F", "M", "W", "U", "J"];
      const LOC = [
        ["zh_tw", "zh_tw"],
        ["zh_tw 週一開頭", { ...flatpickr.l10ns.zh_tw, firstDayOfWeek: 1 }],
        ["預設英文", "default"],
      ];
      const make = slot(ctx);
      let fp = null, cur = plus(2), li = 0;
      const msg = (t, bad) => { const n = ctx.$('[data-k="parse"]'); n.textContent = t; n.classList.toggle("fp-warn", !!bad); };
      function render() {
        const d = fp.selectedDates[0] || cur;
        ctx.$(".fp-tok").innerHTML = TOK.map((t) => `<code>${esc(t)}</code><span>${esc(fp.formatDate(d, t))}</span>`).join("");
      }
      function build() {
        fp = make(ctx.$(".fp-in"), {
          inline: true, locale: LOC[li][1], defaultDate: cur,
          errorHandler: (e) => msg(`errorHandler 收到：${e.message}`, true),
          onChange: (d) => { if (d[0]) cur = d[0]; render(); },
        });
        render();
      }
      ctx.group(LOC.map((l) => l[0]), 0, (i) => { li = i; build(); });
      ctx.$(".fp-str").value = `${today.getFullYear()}年12月25日`;
      ctx.$(".fp-fmt").value = "Y年n月j日";
      ctx.on(ctx.$(".fp-parse .btn"), "click", () => {
        const d = fp.parseDate(ctx.$(".fp-str").value, ctx.$(".fp-fmt").value);
        if (!d || isNaN(d)) return msg("無法解析：字串與格式不符", true);
        cur = d;
        fp.setDate(d, true);
        msg(`解析結果：${d.toLocaleDateString("zh-TW")}，已用 setDate 選取並跳到該月`);
      });
      build();
      msg("格式中的非格式字元（如「年」）會當作任一字元比對");
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "flatpickr(el, { inline }) × N、fp.set(\"disable\", rules) + changeMonth()",
    desc: "兩種加壓：一次建立 N 個 inline 月曆量建立耗時（每個約 100 個節點），或給單一月曆 N 條 disable 規則，量 set 加 12 次換月重繪的耗時。isEnabled 對每個日格逐條比對規則，規則數乘上日格數就是成本。",
    hint: "按「開始測試」逐級加壓，上方可切換加壓項目",
    mount(ctx) {
      ctx.html(`<div class="fp-board fp-dark fp-lab"><div class="fp-cap"></div><div class="fp-grid"></div></div>`);
      const board = ctx.$(".fp-board"), grid = ctx.$(".fp-grid"), cap = ctx.$(".fp-cap");
      let insts = [], one = null, gen = 0, panel = null, lastDestroy = null;
      const killAll = () => { insts.forEach((f) => f.destroy()); insts = []; if (one) { one.destroy(); one = null; } grid.textContent = ""; };
      ctx.onCleanup(killAll);
      const stale = (my) => { if (my !== gen) throw new DOMException("mode switched", "AbortError"); };
      const MODES = [
        {
          label: "inline 實例", unit: "個", sizes: [10, 25, 50, 100, 200, 400, 800],
          setup() { grid.className = "fp-grid"; cap.textContent = "N 個 inline 月曆（縮小顯示）"; },
          prepare(n) {
            const t0 = performance.now();
            killAll();
            lastDestroy = performance.now() - t0;
            cap.textContent = lastDestroy > 0.05 ? `清掉上一輪的 destroy() 耗時 ${lastDestroy.toFixed(1)} ms` : "N 個 inline 月曆（縮小顯示）";
            return Array.from({ length: n }, () => grid.appendChild(Object.assign(document.createElement("input"), { type: "hidden" })));
          },
          run(n, inputs) {
            insts = inputs.map((el, i) => flatpickr(el, { inline: true, locale: "zh_tw", disableMobile: true, defaultDate: plus(i % 28) }));
            void grid.offsetHeight;
            return `${grid.querySelectorAll(".flatpickr-day").length.toLocaleString("zh-TW")} 個日格`;
          },
        },
        {
          label: "disable 規則", unit: "條", sizes: [1000, 5000, 20000, 50000, 100000, 200000, 400000],
          setup() {
            grid.className = "fp-one";
            const input = grid.appendChild(Object.assign(document.createElement("input"), { type: "hidden" }));
            one = flatpickr(input, { inline: true, locale: "zh_tw", disableMobile: true, showMonths: ctx.size().width >= 1100 ? 2 : 1 });
            cap.textContent = "規則混合 Date 與 { from, to } 區間，年份散布在 1900 到 2299 年，加越多畫面上被劃掉的日子越多";
          },
          prepare(n) {
            const rules = new Array(n);
            for (let i = 0; i < n; i++) {
              const yy = 1900 + ((i * 7) % 400), mm = (i * 5) % 12, dd = 1 + ((i * 11) % 28);
              rules[i] = i % 10 === 9 ? { from: new Date(yy, mm, dd), to: new Date(yy, mm, dd + 2) } : new Date(yy, mm, dd);
            }
            return rules;
          },
          run(n, rules) {
            const t0 = performance.now();
            one.set("disable", rules);
            for (let i = 0; i < 12; i++) one.changeMonth(1);
            one.jumpToDate(today);
            const per = (performance.now() - t0) / 14;
            return `每次重繪 ${per.toFixed(1)} ms`;
          },
        },
      ];
      function setup(mi) {
        const my = ++gen, m = MODES[mi];
        if (panel) panel.remove();
        killAll();
        m.setup();
        const b = ctx.bench({
          label: m.label, unit: m.unit, sizes: m.sizes,
          prepare: async (n) => { stale(my); return m.prepare(n); },
          run: (n, data) => { stale(my); return m.run(n, data); },
          note: mi === 0
            ? "每個 inline 月曆會建 42 個日格、星期列、月份切換與年份輸入框；耗時大致隨 N 線性成長，destroy 也要逐個解除監聽並移除節點。"
            : "set(\"disable\") 會先把每條規則 parseDate 成新的 Date，再整個重畫；之後每次換月都對 42 個日格逐條比對。規則若能改寫成一個函式（例如查 Set），成本就與規則數無關。",
        });
        panel = b.panel.parentNode;
      }
      ctx.controls.classList.add("bottom");
      ctx.group(["N 個實例", "N 條 disable 規則"], 0, (i) => setup(i));
      setup(0);
    },
  },
] });
</script>
</body>
