<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flatpickr 示範：教室預約月曆</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 16px; padding: 56px 14px 50px; }
  .cal { display: flex; flex-direction: column; gap: 8px; }
  .modes { position: fixed; left: 14px; top: 12px; display: flex; gap: 6px; align-items: center; }
  .modes .title { font-weight: 700; margin-right: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: 1px; }
  .legend s { color: #b9b6ac; }
  /* flatpickr tweaks */
  .cal > input { display: none !important; }
  .flatpickr-calendar.inline { box-shadow: 0 10px 30px rgba(0,0,0,.08), 0 0 0 1px var(--line); border-radius: 12px; }
  .flatpickr-day { position: relative; }
  .flatpickr-day .dot { position: absolute; left: 50%; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; transform: translateX(-50%); }
  .flatpickr-day.selected .dot, .flatpickr-day.startRange .dot, .flatpickr-day.endRange .dot { box-shadow: 0 0 0 1.5px #fff; }
  .flatpickr-day.flatpickr-disabled { text-decoration: line-through; }
  .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange { background: var(--c6); border-color: var(--c6); }
  .flatpickr-day.inRange { background: #ece9ff; border-color: #ece9ff; box-shadow: -5px 0 0 #ece9ff, 5px 0 0 #ece9ff; }
  .flatpickr-day.today { border-color: var(--c3); }
  .flatpickr-weekdays .flatpickr-weekday:first-child, .flatpickr-weekdays .flatpickr-weekday:last-child { color: var(--c3); }
  /* summary */
  .sum { width: 250px; display: flex; flex-direction: column; gap: 8px; }
  .sum h2 { margin: 0; font-size: 15px; }
  .sum .range { font-size: 14px; font-weight: 600; line-height: 1.5; min-height: 42px; }
  .sum .kv { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); border-bottom: 1px dashed var(--line); padding-bottom: 4px; }
  .sum .kv b { color: var(--fg); font-family: var(--mono); }
  .sum .total { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .sum .total b { font: 700 20px var(--mono); color: var(--c6); }
  .sum label { font-size: 12px; color: var(--muted); }
  .sum input { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .tag { font-size: 11px; color: var(--muted); }
  @media (max-width: 760px) {
    .wrap { flex-direction: column; gap: 8px; padding-top: 52px; justify-content: flex-start; }
    .modes .title { display: none; }
    .sum { width: 308px; padding: 10px 12px; gap: 4px; }
    .sum h2, .sum label, .sum input, .sum .tag { display: none; }
    .sum .range { min-height: 0; font-size: 13px; }
    .legend { width: 308px; }
  }
</style>
</head>
<body class="paper">
<div class="modes">
  <span class="title">教室預約</span>
  <button class="btn" data-mode="single">單日</button>
  <button class="btn" data-mode="range" aria-pressed="true">區間</button>
  <button class="btn" data-mode="multiple">多選</button>
</div>
<div class="wrap">
  <div class="cal">
    <input id="cal" type="hidden">
    <div class="legend">
      <span><i style="background:#1f8fb8"></i>AI 工具課</span>
      <span><i style="background:#e06a1b"></i>簡報設計課</span>
      <span><s>18</s> 已額滿</span>
    </div>
  </div>
  <div class="sum panel">
    <h2>預約明細</h2>
    <div class="range" id="range">請在月曆上選擇日期</div>
    <div class="kv"><span>使用天數</span><b id="days">0 天</b></div>
    <div class="kv"><span>其中有課日</span><b id="busy">0 天</b></div>
    <div class="total"><span>預估場地費（示意）</span><b id="total">NT$0</b></div>
    <label for="time">每日開始時間</label>
    <input id="time" value="09:30">
    <div class="tag">平日 NT$1,800、週末 NT$2,400 一天</div>
  </div>
</div>
<div class="hint">點兩個日期選出區間・圓點代表已排課・刪除線為額滿</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh-tw.js"></script>
<script>
// flatpickr inline calendar: zh_tw locale, range/single/multiple modes, disabled days, onDayCreate dots, a time-only picker.
const DAY = 864e5;
const today = new Date(new Date().setHours(0, 0, 0, 0));
const plus = (n) => new Date(today.getTime() + n * DAY);
const key = (d) => d.toDateString();
const COURSES = new Map([[2, "#1f8fb8"], [5, "#e06a1b"], [9, "#1f8fb8"], [12, "#e06a1b"], [16, "#1f8fb8"], [23, "#e06a1b"], [27, "#1f8fb8"], [33, "#e06a1b"]]
  .map(([n, c]) => [key(plus(n)), c]));
const FULL = [7, 14, 21].map(plus);
const WEEK = "日一二三四五六";
const fmt = (d) => `${d.getMonth() + 1}月${d.getDate()}日（${WEEK[d.getDay()]}）`;
const price = (d) => (d.getDay() === 0 || d.getDay() === 6 ? 2400 : 1800);

function summarize(dates, mode) {
  let days = [];
  if (mode === "range" && dates.length === 2) {
    for (let t = dates[0].getTime(); t <= dates[1].getTime(); t += DAY) days.push(new Date(t));
    days = days.filter((d) => !FULL.some((f) => key(f) === key(d)));
  } else days = dates.slice();
  const rangeText = !dates.length ? "請在月曆上選擇日期"
    : mode === "range" ? (dates.length === 2 ? `${fmt(dates[0])} 至 ${fmt(dates[1])}` : `${fmt(dates[0])} 起，請再點結束日`)
    : mode === "multiple" ? dates.map(fmt).join("、") : fmt(dates[0]);
  document.getElementById("range").textContent = rangeText;
  document.getElementById("days").textContent = `${days.length} 天`;
  document.getElementById("busy").textContent = `${days.filter((d) => COURSES.has(key(d))).length} 天`;
  document.getElementById("total").textContent = `NT$${days.reduce((s, d) => s + price(d), 0).toLocaleString("zh-TW")}`;
}

let fp;
function build(mode) {
  if (fp) fp.destroy();
  const defaults = { range: [plus(3), plus(6)], single: [plus(3)], multiple: [plus(3), plus(5), plus(10)] }[mode];
  fp = flatpickr("#cal", {
    inline: true, disableMobile: true, locale: "zh_tw", mode, minDate: "today", disable: FULL, defaultDate: defaults,
    showMonths: innerWidth >= 900 ? 2 : 1, dateFormat: "Y-m-d",
    onDayCreate(_, __, ___, dayElem) {
      const c = COURSES.get(key(dayElem.dateObj));
      if (c) dayElem.insertAdjacentHTML("beforeend", `<span class="dot" style="background:${c}"></span>`);
    },
    onChange: (dates) => summarize(dates, mode),
  });
  summarize(fp.selectedDates, mode);
  document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === mode));
}
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => build(b.dataset.mode)));
build("range");

flatpickr("#time", { enableTime: true, noCalendar: true, disableMobile: true, dateFormat: "H:i", time_24hr: true, minuteIncrement: 15, locale: "zh_tw" });

let wide = innerWidth >= 900;
addEventListener("resize", () => { if ((innerWidth >= 900) !== wide) { wide = !wide; build(fp.config.mode); } });
</script>
</body>
</html>
