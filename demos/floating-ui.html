<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Floating UI 示範：會自動翻轉與平移的定位引擎</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #stage {
    position: fixed; inset: 96px 14px 46px; border: 1.5px dashed rgba(76,201,240,.45); border-radius: 14px; overflow: hidden;
    background:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,
      radial-gradient(60% 70% at 50% 50%, rgba(76,201,240,.07), transparent 70%);
  }
  #stage .label { position: absolute; right: 10px; top: 8px; font-size: 11px; color: rgba(76,201,240,.7); }
  #anchor {
    position: absolute; left: 0; top: 0; padding: 10px 16px; border-radius: 10px; border: 0; cursor: grab; touch-action: none; user-select: none;
    background: linear-gradient(135deg, var(--c2), var(--c6)); color: #0d1020; font: 700 14px var(--font);
    box-shadow: 0 10px 26px rgba(76,201,240,.35);
  }
  #anchor:active { cursor: grabbing; }
  #float {
    position: fixed; left: 0; top: 0; width: max-content; max-width: 220px; z-index: 30;
    padding: 10px 12px; border-radius: 10px; background: #f6f5f1; color: #1c1c1a; font-size: 13px; line-height: 1.5;
    box-shadow: 0 14px 34px rgba(0,0,0,.45); transition: background .2s;
  }
  #float b { font: 700 13px var(--mono); }
  #float .xy { font: 500 11px var(--mono); color: #6d6b64; }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; min-height: 0; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; font-weight: 700; }
  .badge.flip { background: #fde2ea; color: #d61f69; }
  .badge.shift { background: #dff3fa; color: #1f8fb8; }
  #arrow { position: absolute; width: 12px; height: 12px; background: #f6f5f1; transform: rotate(45deg); }
  .panel.top { position: fixed; left: 14px; right: 14px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; }
  .panel.top .title { font-weight: 700; margin-right: 6px; }
  select.btn { padding: 7px 8px; }
  .btn.sm { padding: 7px 10px; font: 600 12px var(--mono); }
  @media (max-width: 560px) { #stage { inset: 118px 8px 44px; } .panel.top .title { display: none; } }
</style>
</head>
<body>
<div class="panel top">
  <span class="title">中介層</span>
  <button class="btn sm" data-mw="offset" aria-pressed="true">offset</button>
  <button class="btn sm" data-mw="flip" aria-pressed="true">flip</button>
  <button class="btn sm" data-mw="shift" aria-pressed="true">shift</button>
  <button class="btn sm" data-mw="arrow" aria-pressed="true">arrow</button>
  <select class="btn" id="placement" aria-label="偏好位置"></select>
</div>
<div id="stage">
  <button id="anchor">拖曳我到邊緣</button>
  <span class="label">邊界（boundary）</span>
</div>
<div id="float" role="tooltip">
  <div>實際位置 <b id="pl">top</b></div>
  <div class="xy" id="xy"></div>
  <div class="badges" id="badges"></div>
  <div id="arrow"></div>
</div>
<div class="hint">把按鈕拖到邊緣，看提示框自動翻轉與平移・上方可開關中介層</div>

<script type="module">
// Floating UI playground: computePosition + offset / flip / shift / arrow middleware, re-run on drag via autoUpdate.
import { computePosition, autoUpdate, offset, flip, shift, arrow } from "https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.8.0/+esm";

const stage = document.getElementById("stage");
const anchor = document.getElementById("anchor");
const floating = document.getElementById("float");
const arrowEl = document.getElementById("arrow");
const select = document.getElementById("placement");
const enabled = { offset: true, flip: true, shift: true, arrow: true };
const PLACEMENTS = ["top", "top-start", "top-end", "right", "right-start", "right-end", "bottom", "bottom-start", "bottom-end", "left", "left-start", "left-end"];
select.innerHTML = PLACEMENTS.map((p) => `<option value="${p}">偏好：${p}</option>`).join("");

async function update() {
  const middleware = [];
  if (enabled.offset) middleware.push(offset(12));
  if (enabled.flip) middleware.push(flip({ boundary: stage, padding: 8 }));
  if (enabled.shift) middleware.push(shift({ boundary: stage, padding: 8 }));
  if (enabled.arrow) middleware.push(arrow({ element: arrowEl, padding: 8 }));
  const preferred = select.value;
  const { x, y, placement, middlewareData } = await computePosition(anchor, floating, { placement: preferred, strategy: "fixed", middleware });
  Object.assign(floating.style, { left: `${x}px`, top: `${y}px` });

  document.getElementById("pl").textContent = placement;
  document.getElementById("xy").textContent = `x: ${Math.round(x)}  y: ${Math.round(y)}`;
  const badges = [];
  if (placement !== preferred) badges.push(`<span class="badge flip">已翻轉</span>`);
  if (middlewareData.shift && (Math.abs(middlewareData.shift.x) > 0.5 || Math.abs(middlewareData.shift.y) > 0.5)) badges.push(`<span class="badge shift">已平移</span>`);
  document.getElementById("badges").innerHTML = badges.join("");

  arrowEl.style.display = enabled.arrow ? "block" : "none";
  if (enabled.arrow && middlewareData.arrow) {
    const side = { top: "bottom", right: "left", bottom: "top", left: "right" }[placement.split("-")[0]];
    const { x: ax, y: ay } = middlewareData.arrow;
    Object.assign(arrowEl.style, { left: ax != null ? `${ax}px` : "", top: ay != null ? `${ay}px` : "", right: "", bottom: "", [side]: "-6px" });
  }
}

// Drag the anchor inside the stage
let drag = null;
function place(x, y) {
  const maxX = stage.clientWidth - anchor.offsetWidth, maxY = stage.clientHeight - anchor.offsetHeight;
  anchor.style.left = `${Math.max(0, Math.min(maxX, x))}px`;
  anchor.style.top = `${Math.max(0, Math.min(maxY, y))}px`;
  update();
}
anchor.addEventListener("pointerdown", (e) => {
  anchor.setPointerCapture(e.pointerId);
  drag = { dx: e.clientX - anchor.offsetLeft, dy: e.clientY - anchor.offsetTop };
});
anchor.addEventListener("pointermove", (e) => { if (drag) place(e.clientX - drag.dx, e.clientY - drag.dy); });
anchor.addEventListener("pointerup", () => (drag = null));

document.querySelectorAll("[data-mw]").forEach((b) => b.addEventListener("click", () => {
  const k = b.dataset.mw;
  enabled[k] = !enabled[k];
  b.setAttribute("aria-pressed", enabled[k]);
  update();
}));
select.addEventListener("change", update);

// Start near the top edge so the preferred "top" placement is flipped to "bottom" right away.
place(stage.clientWidth * 0.08, 6);
autoUpdate(anchor, floating, update);
addEventListener("resize", () => place(anchor.offsetLeft, anchor.offsetTop));
</script>
</body>
</html>
