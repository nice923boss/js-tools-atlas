<style>
  .fu-board { position: absolute; inset: 0; overflow: hidden; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }

    background: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 28px 28px,

  @media (max-width: 760px) { .fu-cells { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); } }
  .fu-cell { position: relative; overflow: hidden; border-radius: 10px; border: 1.5px dashed var(--line); background: var(--bg-2); min-height: 0; }

  .fu-cell .fu-tip { padding: 5px 8px; font-size: 11.5px; }

  /* 4. size dropdown */
  .fu-select { position: absolute; left: 0; top: 0; width: 210px; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--c2); background: var(--bg-2); color: var(--fg);
    font: 600 13px var(--font); text-align: left; cursor: pointer; }
  .fu-list { position: absolute; left: 0; top: 0; margin: 0; padding: 4px; list-style: none; overflow: auto; border-radius: 9px; background: #f6f5f1; color: #1c1c1a;
    box-shadow: 0 14px 34px rgba(0,0,0,.5); z-index: 5; }
  .fu-list li { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .fu-list li:hover { background: #e9e6dc; }
  .fu-list li i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .fu-read { position: absolute; right: 10px; top: 8px; padding: 5px 9px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
    font: 500 11.5px/1.6 var(--mono); color: var(--muted); pointer-events: none; z-index: 6; }

  /* 5. scroll */
  .fu-split { display: grid; gap: 10px; height: 100%; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); }

  .fu-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 13px; }

  .fu-item.hot { background: rgba(247,223,30,.08); }

  .fu-scroll .fu-tip { width: 180px; }

  .fu-side .fu-read { position: static; white-space: normal; }

  /* 6. virtual element */
  .fu-photo { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 12px; background: #000 url(_shared/img/photo-6.jpg) center / cover no-repeat; cursor: crosshair; touch-action: none; }
  .fu-dot { position: absolute; left: 0; top: 0; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.35); pointer-events: none; }
  .fu-loupe { width: 120px; height: 120px; border-radius: 8px; background-repeat: no-repeat; background-image: url(_shared/img/photo-6.jpg); }
  .fu-photo .fu-tip { padding: 6px; pointer-events: none; }
  .fu-photo .fu-xy { text-align: center; margin-top: 3px; }

  /* 7. inline */
  .fu-paper { position: relative; height: 100%; overflow: hidden; display: grid; place-items: center; }
  .fu-article { position: relative; max-width: 560px; margin: 0 auto; padding: 16px 18px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line);
    font-size: 16px; line-height: 2; }
  .fu-article p { margin: 0; }
  .fu-box { position: absolute; pointer-events: none; border-radius: 3px; }
  .fu-box.union { border: 1.5px dashed rgba(255,255,255,.45); }
  .fu-box.line { border: 2px solid var(--c2); }
  .fu-bar { position: absolute; left: 0; top: 0; z-index: 5; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 9px; background: #f6f5f1; color: #1c1c1a;
    box-shadow: 0 12px 28px rgba(0,0,0,.45); white-space: nowrap; }
  .fu-bar button { border: 0; background: transparent; padding: 5px 8px; border-radius: 6px; font: 600 12.5px var(--font); color: inherit; cursor: pointer; }
  .fu-bar button:hover { background: #e6e2d6; }
  .fu-bar span { padding: 0 6px; font: 500 11px var(--mono); color: #6d6b64; }
  ::highlight(fu-mark) { background-color: rgba(247,223,30,.45); color: inherit; }

  /* 8. stress */
  .fu-arena { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); }
  @media (min-width: 761px) { .fu-arena { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; } }
  .fu-sdot { position: absolute; left: 0; top: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--c2); }
  .fu-slab { position: absolute; left: 0; top: 0; padding: 1px 4px; border-radius: 4px; background: #f6f5f1; color: #1c1c1a; font: 600 9.5px/1.3 var(--mono); white-space: nowrap; }
</style>

<body>
<script src="_shared/showcase.js"></script>
<script type="module">
// Floating UI showcase: computePosition + middleware, autoUpdate, virtual elements and an autoUpdate stress ramp.
import {
  computePosition, autoUpdate, offset, flip, shift, limitShift, arrow, size, hide, inline, autoPlacement,
} from "https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.8.0/+esm";

const { h } = Showcase;
const PLACEMENTS = ["top", "top-start", "top-end", "right", "right-start", "right-end", "bottom", "bottom-start", "bottom-end", "left", "left-start", "left-end"];
const SIDE_OPPOSITE = { top: "bottom", right: "left", bottom: "top", left: "right" };
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// Position the rotated-square arrow on the side facing the reference.
function placeArrow(el, placement, data) {
  const side = SIDE_OPPOSITE[placement.split("-")[0]];
  const a = data.arrow || {};
  Object.assign(el.style, { left: a.x != null ? `${a.x}px` : "", top: a.y != null ? `${a.y}px` : "", right: "", bottom: "", [side]: "-5px" });
}
// autoUpdate whose cleanup runs when the scene unmounts.
function follow(ctx, ref, floating, update, opts) {
  const stop = autoUpdate(ref, floating, update, opts);
  ctx.onCleanup(stop);
  return stop;
}
const setXY = (el, x, y) => { el.style.left = `${x}px`; el.style.top = `${y}px`; };

const STATIONS = [
  ...["淡水", "紅樹林", "竹圍", "關渡", "忠義", "復興崗", "北投", "奇岩", "唭哩岸", "石牌", "明德", "芝山", "士林", "劍潭", "圓山", "民權西路", "雙連", "中山", "台北車站", "台大醫院", "中正紀念堂", "東門", "大安森林公園", "大安", "信義安和", "台北 101／世貿", "象山"].map((n) => [n, "#e3002c"]),
  ...["頂埔", "永寧", "土城", "海山", "亞東醫院", "府中", "板橋", "新埔", "江子翠", "龍山寺", "西門", "善導寺", "忠孝新生", "忠孝復興", "忠孝敦化", "國父紀念館", "市政府", "永春", "後山埤", "昆陽", "南港", "南港展覽館"].map((n) => [n, "#0070bd"]),
];

Showcase.run({ scenes: [
  {
    id: "playground", title: "拖曳遊樂場",
    api: "computePosition(ref, el, { placement, middleware: [offset(), flip(), shift(), arrow()] })",
    desc: "拖曳按鈕到虛線邊界附近，提示框會自動翻面（flip）或沿邊平移（shift），箭頭始終指向按鈕；每個中介層都能單獨關掉比較。",
    hint: "拖曳按鈕到邊緣・右上可開關中介層與偏好位置",
    mount(ctx) {
      ctx.html(`<div class="fu-board"><div class="fu-zone">
        <button class="fu-anchor" type="button">拖曳我到邊緣</button><span class="fu-label">邊界（clipping 容器）</span>
        <div class="fu-tip" role="tooltip"><div>實際位置 <b class="pl">top</b></div><div class="fu-xy"></div><div class="fu-badges"></div><div class="fu-arrow"></div></div>
      </div></div>`);
      const zone = ctx.$(".fu-zone"), anchor = ctx.$(".fu-anchor"), tip = ctx.$(".fu-tip"), arrowEl = ctx.$(".fu-arrow");
      const on = { offset: true, flip: true, shift: true, arrow: true };
      let preferred = "top", tour = true;
      async function update() {
        const middleware = [];
        if (on.offset) middleware.push(offset(12));
        if (on.flip) middleware.push(flip({ padding: 8 }));
        if (on.shift) middleware.push(shift({ padding: 8 }));
        if (on.arrow) middleware.push(arrow({ element: arrowEl, padding: 8 }));
        const { x, y, placement, middlewareData } = await computePosition(anchor, tip, { placement: preferred, middleware });
        setXY(tip, x, y);
        ctx.$(".pl").textContent = placement;
        ctx.$(".fu-xy").textContent = `x ${Math.round(x)}・y ${Math.round(y)}`;
        const s = middlewareData.shift;
        ctx.$(".fu-badges").innerHTML = (placement !== preferred ? `<span class="fu-badge flip">已翻轉</span>` : "")
          + (s && (Math.abs(s.x) > 0.5 || Math.abs(s.y) > 0.5) ? `<span class="fu-badge shift">已平移 ${Math.round(Math.abs(s.x) || Math.abs(s.y))}px</span>` : "");
        arrowEl.style.display = on.arrow ? "block" : "none";
        if (on.arrow) placeArrow(arrowEl, placement, middlewareData);
      }
      const place = (x, y) => {
        setXY(anchor, clamp(x, 0, zone.clientWidth - anchor.offsetWidth), clamp(y, 0, zone.clientHeight - anchor.offsetHeight));
        update();
      };
      for (const k of Object.keys(on)) ctx.toggle(k, true, (v) => { on[k] = v; update(); });
      ctx.select("", PLACEMENTS.map((p) => ({ value: p, label: `偏好：${p}` })), preferred, (v) => { preferred = v; update(); });
      const tourBtn = ctx.toggle("自動繞行", true, (v) => (tour = v));

      let drag = null;
      ctx.on(anchor, "pointerdown", (e) => {
        anchor.setPointerCapture(e.pointerId);
        drag = { dx: e.clientX - anchor.offsetLeft, dy: e.clientY - anchor.offsetTop };
        tour = false; tourBtn.setAttribute("aria-pressed", "false");
      });
      ctx.on(anchor, "pointermove", (e) => { if (drag) place(e.clientX - drag.dx, e.clientY - drag.dy); });
      ctx.on(anchor, "pointerup", () => (drag = null));

      // Idle tour: walk the anchor around the inside of the boundary so flip and shift trigger on their own.
      let p = 0.02;
      ctx.raf((t, dt) => {
        if (!tour) return;
        p = (p + dt / 16000) % 1;
        const w = zone.clientWidth - anchor.offsetWidth, hh = zone.clientHeight - anchor.offsetHeight;
        const per = 2 * (w + hh), d = p * per;
        const [x, y] = d < w ? [d, 4] : d < w + hh ? [w - 4, d - w] : d < 2 * w + hh ? [w - (d - w - hh), hh - 4] : [4, hh - (d - 2 * w - hh)];
        place(x, y);
      });
      follow(ctx, anchor, tip, update);
      place(zone.clientWidth * 0.04, 4);
    },
  },
  {
    id: "placements", title: "12 種位置與 offset",
    api: "placement: 'top-start' … 'left-end'・offset({ mainAxis, crossAxis })",
    desc: "同一個參考元素同時放 12 個浮動標籤，對應 12 種 placement；拖動滑桿調整 offset 的主軸距離與交叉軸位移。",
    hint: "拖動 mainAxis／crossAxis 滑桿看標籤怎麼移動",
    mount(ctx) {
      ctx.html(`<div class="fu-board"><div class="fu-zone"><div class="fu-ref"><span>參考元素</span><code></code></div>
        ${PLACEMENTS.map((p, i) => `<span class="fu-chip" style="background:${COLORS[Math.floor(i / 3) + 1]}">${p}</span>`).join("")}</div></div>`);
      const zone = ctx.$(".fu-zone"), ref = ctx.$(".fu-ref"), chips = ctx.$$(".fu-chip");
      let main = 8, cross = 0;
      async function layout() {
        const cw = Math.max(...chips.map((c) => c.offsetWidth)), ch = chips[0].offsetHeight;
        const W = zone.clientWidth, H = zone.clientHeight;
        const rw = clamp(W - 2 * (cw + main + 3), 120, 360), rh = clamp(H - 2 * (ch + main + 8), 80, 240);
        Object.assign(ref.style, { width: `${rw}px`, height: `${rh}px`, left: `${(W - rw) / 2}px`, top: `${(H - rh) / 2}px` });
        ref.querySelector("code").textContent = `offset({ mainAxis: ${main}, crossAxis: ${cross} })`;
        await Promise.all(chips.map((chip, i) => computePosition(ref, chip, { placement: PLACEMENTS[i], middleware: [offset({ mainAxis: main, crossAxis: cross })] })
          .then(({ x, y }) => setXY(chip, x, y))));
      }
      ctx.slider("mainAxis", { min: 0, max: 20, value: main }, (v) => { main = v; layout(); });
      ctx.slider("crossAxis", { min: -20, max: 20, value: cross }, (v) => { cross = v; layout(); });
      ctx.onResize(layout);
      layout();
    },
  },
  {
    id: "compare", title: "防溢出策略對比",
    api: "flip()・shift({ limiter: limitShift() })・autoPlacement()",
    desc: "四格裡的錨點走同一條路線，偏好位置都是 top：沒有中介層會被裁掉，flip 翻面，shift 沿邊平移（limitShift 讓它不脫離錨點），autoPlacement 每次挑空間最大的一側。",
    hint: "右上可換偏好方向或暫停移動",
    mount(ctx) {
      const VARIANTS = [
        { name: "無中介層", mw: () => [offset(6)] },
        { name: "flip()", mw: () => [offset(6), flip({ padding: 4 })] },
        { name: "shift + limitShift", mw: () => [offset(6), shift({ padding: 4, limiter: limitShift() })] },
        { name: "autoPlacement()", mw: () => [offset(6), autoPlacement({ padding: 4 })] },
      ];
      ctx.html(`<div class="fu-board"><div class="fu-cells">${VARIANTS.map((v) => `<div class="fu-cell"><h3>${v.name}</h3><span class="fu-pill">錨點</span><div class="fu-tip"></div></div>`).join("")}</div></div>`);
      const cells = ctx.$$(".fu-cell").map((el, i) => ({ el, pill: el.querySelector(".fu-pill"), tip: el.querySelector(".fu-tip"), mw: VARIANTS[i].mw(), auto: i === 3 }));
      let preferred = "top", moving = true, clock = 0;
      ctx.group(["top", "right", "bottom", "left"], 0, (i, l) => { preferred = l; tick(); });
      ctx.toggle("移動", true, (v) => (moving = v));
      function tick() {
        const u = 0.5 + 0.5 * Math.sin(clock / 1500), v = 0.5 + 0.5 * Math.sin(clock / 1130 + 1.2);
        for (const c of cells) {
          setXY(c.pill, u * (c.el.clientWidth - c.pill.offsetWidth), v * (c.el.clientHeight - c.pill.offsetHeight));
          computePosition(c.pill, c.tip, { placement: c.auto ? undefined : preferred, middleware: c.mw }).then(({ x, y, placement, middlewareData }) => {
            setXY(c.tip, x, y);
            const s = middlewareData.shift;
            c.tip.innerHTML = `實際 <b>${placement}</b>${s && (Math.abs(s.x) > 0.5 || Math.abs(s.y) > 0.5) ? `<small>平移 ${Math.round(s.x || s.y)}px</small>` : ""}`;
          });
        }
      }
      ctx.raf((t, dt) => { if (moving) { clock += dt; tick(); } });
      ctx.onResize(tick);
      tick();
    },
  },
  {
    id: "size", title: "size 自適應清單",
    api: "size({ apply({ availableHeight, rects, elements }) {…} })",
    desc: "下拉清單有 49 個捷運站。size 中介層回報可用高度，把清單的 max-height 設成剛好裝得下，寬度對齊按鈕；關掉後清單會整個被邊界裁掉。",
    hint: "按鈕會上下移動；開關 size／flip 比較，點站名可選取",
    mount(ctx) {
      ctx.html(`<div class="fu-board"><div class="fu-zone"><button class="fu-select" type="button">選擇捷運站 ▾</button>
        <ul class="fu-list">${STATIONS.map(([n, c]) => `<li><i style="background:${c}"></i>${n}</li>`).join("")}</ul>
        <div class="fu-read"></div></div></div>`);
      const zone = ctx.$(".fu-zone"), btn = ctx.$(".fu-select"), list = ctx.$(".fu-list"), read = ctx.$(".fu-read");
      let useSize = true, useFlip = true, moving = true, clock = 0;
      async function update() {
        const middleware = [offset(6)];
        if (useFlip) middleware.push(flip({ padding: 8 }));
        let avail = null;
        if (useSize) middleware.push(size({ padding: 8, apply({ availableHeight, rects, elements }) {
          avail = availableHeight;
          Object.assign(elements.floating.style, { maxHeight: `${Math.max(60, availableHeight)}px`, width: `${rects.reference.width}px` });
        } }));
        else Object.assign(list.style, { maxHeight: "", width: "210px" });
        const { x, y, placement } = await computePosition(btn, list, { placement: "bottom-start", middleware });
        setXY(list, x, y);
        read.innerHTML = `placement <b>${placement}</b><br>availableHeight <b>${avail == null ? "未啟用" : Math.round(avail) + " px"}</b>`;
      }
      const move = () => {
        const v = 0.5 + 0.5 * Math.sin(clock / 2200 - 1.4);
        setXY(btn, Math.min(24, zone.clientWidth - btn.offsetWidth), 8 + v * (zone.clientHeight - btn.offsetHeight - 16));
        update();
      };
      ctx.toggle("size", true, (v) => { useSize = v; update(); });
      ctx.toggle("flip", true, (v) => { useFlip = v; update(); });
      ctx.toggle("移動", true, (v) => (moving = v));
      ctx.on(list, "click", (e) => {
        const li = e.target.closest("li");
        if (li) btn.textContent = `${li.textContent} ▾`;
        update();
      });
      ctx.raf((t, dt) => { if (moving) { clock += dt; move(); } });
      follow(ctx, btn, list, update);
      move();
    },
  },
  {
    id: "scroll", title: "捲動跟隨與 hide",
    api: "autoUpdate(ref, el, update)・strategy: 'fixed'・hide()",
    desc: "提示框放在可捲動清單裡。autoUpdate 監聽捲動讓它跟著錨點走；absolute 會被清單邊緣裁掉一半，fixed 能跳出裁切；hide 在錨點捲出可視範圍時把提示框藏起來。",
    hint: "切換 absolute／fixed 與 hide；也可以自己捲動清單",
    mount(ctx) {
      const NAMES = ["王", "林", "陳", "張", "李", "黃", "吳", "劉"];
      const MSGS = ["上傳了課程講義", "按讚你的貼文", "分享了一篇文章", "加入了讀書會", "回覆了你的提問", "更新了作業進度", "留言：明天見", "建立了新相簿"];
      const items = Array.from({ length: 31 }, (_, i) => i === 15
        ? `<div class="fu-item hot"><span class="fu-av" style="background:var(--c1)">陳</span><span>陳老師的課後討論</span><button class="fu-hotbtn" type="button">3 則新留言</button></div>`
        : `<div class="fu-item"><span class="fu-av" style="background:${COLORS[i % 6]}">${NAMES[i % 8]}</span><span>${NAMES[i % 8]}同學${MSGS[(i * 3) % 8]}</span></div>`).join("");
      ctx.html(`<div class="fu-board"><div class="fu-split"><div class="fu-scroll">${items}
        <div class="fu-tip"><b>陳老師</b>：簡報檔已更新，週四上課前記得下載。<div class="fu-arrow"></div></div></div>
        <div class="fu-side"><div class="fu-read"></div></div></div></div>`);
      const box = ctx.$(".fu-scroll"), ref = ctx.$(".fu-hotbtn"), tip = ctx.$(".fu-scroll .fu-tip"), arrowEl = ctx.$(".fu-arrow"), read = ctx.$(".fu-read");
      let strategy = "fixed", useHide = true, auto = true, clock = -2400;
      async function update() {
        const middleware = [offset(8), arrow({ element: arrowEl })];
        if (useHide) middleware.push(hide({ strategy: "referenceHidden" }));
        const { x, y, placement, middlewareData } = await computePosition(ref, tip, { placement: "right", strategy, middleware });
        tip.style.position = strategy;
        setXY(tip, x, y);
        placeArrow(arrowEl, placement, middlewareData);
        const hidden = !!middlewareData.hide?.referenceHidden;
        tip.style.visibility = useHide && hidden ? "hidden" : "visible";
        read.innerHTML = `strategy <b>${strategy}</b><br>referenceHidden <b>${useHide ? hidden : "未啟用"}</b><br>scrollTop <b>${Math.round(box.scrollTop)}</b>`;
      }
      ctx.group(["absolute", "fixed"], 1, (i, l) => { strategy = l; update(); });
      ctx.toggle("hide", true, (v) => { useHide = v; update(); });
      const autoBtn = ctx.toggle("自動捲動", true, (v) => (auto = v));
      ctx.on(box, "wheel", () => { auto = false; autoBtn.setAttribute("aria-pressed", "false"); }, { passive: true });
      ctx.on(box, "pointerdown", () => { auto = false; autoBtn.setAttribute("aria-pressed", "false"); });
      ctx.raf((t, dt) => {
        if (!auto) return;
        clock += dt;
        const item = ref.parentElement, hgt = box.clientHeight;
        const center = item.offsetTop - hgt / 2 + item.offsetHeight / 2;
        box.scrollTop = center + Math.sin(clock / 1500) * (hgt / 2 + 70);
      });
      follow(ctx, ref, tip, update);
    },
  },
  {
    id: "virtual", title: "虛擬元素放大鏡",
    api: "computePosition({ getBoundingClientRect, contextElement }, el, …)",
    desc: "參考元素不一定是 DOM：用一個只回傳滑鼠座標的物件當虛擬元素，放大鏡就會跟著游標走，靠近邊緣時一樣會翻面與平移。",
    hint: "在照片上移動滑鼠；放著不動會自動巡航",
    mount(ctx) {
      ctx.html(`<div class="fu-board"><div class="fu-photo"><i class="fu-dot"></i><div class="fu-tip"><div class="fu-loupe"></div><div class="fu-xy"></div></div></div></div>`);
      const photo = ctx.$(".fu-photo"), dot = ctx.$(".fu-dot"), tip = ctx.$(".fu-tip"), loupe = ctx.$(".fu-loupe"), xy = ctx.$(".fu-xy");
      const Z = 3, L = 120;
      let px = 0, py = 0, idleAt = 0, clock = 0;
      const virtualEl = {
        getBoundingClientRect() {
          const r = photo.getBoundingClientRect();
          const x = r.left + px, y = r.top + py;
          return { x, y, left: x, top: y, right: x, bottom: y, width: 0, height: 0 };
        },
        contextElement: photo,
      };
      async function update() {
        const W = photo.clientWidth, H = photo.clientHeight, s = Math.max(W / 1200, H / 800);
        const ox = (W - 1200 * s) / 2, oy = (H - 800 * s) / 2;
        loupe.style.backgroundSize = `${1200 * s * Z}px ${800 * s * Z}px`;
        loupe.style.backgroundPosition = `${L / 2 - (px - ox) * Z}px ${L / 2 - (py - oy) * Z}px`;
        xy.textContent = `${Math.round((px - ox) / s)}, ${Math.round((py - oy) / s)}・×${Z}`;
        setXY(dot, px, py);
        const { x, y } = await computePosition(virtualEl, tip, { placement: "right-start", middleware: [offset(16), flip({ padding: 6 }), shift({ padding: 6 })] });
        setXY(tip, x, y);
      }
      ctx.on(photo, "pointermove", (e) => {
        const r = photo.getBoundingClientRect();
        px = e.clientX - r.left; py = e.clientY - r.top; idleAt = performance.now();
        update();
      });
      ctx.raf((t, dt) => {
        if (t - idleAt < 1800) return;
        clock += dt;
        px = photo.clientWidth * (0.5 + 0.47 * Math.sin(clock / 1700));
        py = photo.clientHeight * (0.5 + 0.45 * Math.sin(clock / 1100 + 0.6));
        update();
      });
      ctx.onResize(update);
    },
  },
  {
    id: "inline", title: "inline 跨行選取",
    api: "inline()・{ getBoundingClientRect, getClientRects } = range",
    desc: "選取跨兩行時，整段選取的外框（虛線）中央其實不在任何文字上。inline 中介層改用實際的行框（藍框）定位，工具列就會對準真正選到的那一行。",
    hint: "自己選取一段文字試試；開關 inline 比較工具列位置",
    mount(ctx) {
      ctx.html(`<div class="fu-board"><div class="fu-paper"><div class="fu-article"><p>浮動元素的定位看似簡單，把提示框放在按鈕上方就好。但在真實頁面裡，按鈕可能貼著視窗邊緣、藏在可捲動的清單中，或是一段跨行的文字。Floating UI 把這些情況拆成一個個中介層：offset 調整距離，flip 在空間不足時翻面，shift 沿著邊緣平移，inline 則處理跨行的行內內容，讓工具列對準真正被選取的那一行。</p>
        <div class="fu-bar"><button type="button" data-act="mark">螢光筆</button><button type="button" data-act="clear">清除</button><span></span></div></div></div></div>`);
      const article = ctx.$(".fu-article"), para = ctx.$("p"), bar = ctx.$(".fu-bar"), count = ctx.$(".fu-bar span");
      const hasHL = typeof Highlight === "function" && CSS.highlights;
      const marks = hasHL ? new Highlight() : null;
      if (hasHL) { CSS.highlights.set("fu-mark", marks); ctx.onCleanup(() => CSS.highlights.delete("fu-mark")); }
      let range = null, useInline = true, preferred = "top";
      const boxes = [];
      const drawBoxes = () => {
        boxes.splice(0).forEach((b) => b.remove());
        if (!range) return;
        const a = article.getBoundingClientRect();
        const add = (r, cls) => {
          const b = h("i", { class: `fu-box ${cls}` });
          Object.assign(b.style, { left: `${r.left - a.left - 2}px`, top: `${r.top - a.top - 1}px`, width: `${r.width + 4}px`, height: `${r.height + 2}px` });
          article.append(b); boxes.push(b);
        };
        add(range.getBoundingClientRect(), "union");
        for (const r of range.getClientRects()) if (r.width > 1) add(r, "line");
      };
      async function update() {
        bar.style.visibility = range ? "visible" : "hidden";
        drawBoxes();
        if (!range) return;
        count.textContent = `${range.toString().length} 字`;
        const r = range;
        const ref = { getBoundingClientRect: () => r.getBoundingClientRect(), getClientRects: () => r.getClientRects(), contextElement: article };
        const middleware = [...(useInline ? [inline()] : []), offset(8), flip({ padding: 6 }), shift({ padding: 6 })];
        const { x, y } = await computePosition(ref, bar, { placement: preferred, middleware });
        setXY(bar, x, y);
      }
      // Select a few characters on each side of the first line break so the range spans two lines.
      function selectAcrossLines() {
        const text = para.firstChild, rg = document.createRange();
        let breakAt = -1, top0 = null;
        for (let i = 0; i < text.length; i++) {
          rg.setStart(text, i); rg.setEnd(text, i + 1);
          const t = rg.getBoundingClientRect().top;
          if (top0 == null) top0 = t; else if (t - top0 > 8) { breakAt = i; break; }
        }
        if (breakAt < 0) breakAt = Math.min(20, text.length - 6);
        const sel = document.getSelection(), pick = document.createRange();
        pick.setStart(text, Math.max(0, breakAt - 6)); pick.setEnd(text, Math.min(text.length, breakAt + 5));
        sel.removeAllRanges(); sel.addRange(pick);
        range = pick.cloneRange();
        update();
      }
      ctx.on(document, "selectionchange", () => {
        const sel = document.getSelection();
        if (!sel.rangeCount) return;
        const r = sel.getRangeAt(0);
        if (!para.contains(r.commonAncestorContainer)) return;
        range = r.collapsed ? null : r.cloneRange();
        update();
      });
      ctx.on(bar, "mousedown", (e) => e.preventDefault());
      ctx.on(bar, "click", (e) => {
        const act = e.target.dataset.act;
        if (!act || !hasHL) return;
        if (act === "mark" && range) marks.add(range.cloneRange());
        if (act === "clear") marks.clear();
      });
      ctx.toggle("inline()", true, (v) => { useInline = v; update(); });
      ctx.group(["top", "bottom"], 0, (i, l) => { preferred = l; update(); });
      ctx.button("重選跨行範圍", selectAcrossLines);
      ctx.onResize(selectAcrossLines);
      ctx.onCleanup(() => document.getSelection().removeAllRanges());
      selectAcrossLines();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "autoUpdate(ref, el, update, { animationFrame: true }) × N",
    desc: "N 個移動中的錨點各帶一個浮動標籤，每個標籤都用 animationFrame 模式的 autoUpdate 每格重新定位；逐級加量直到掉到 30 FPS 以下。",
    hint: "按「自動加壓」開始；切換中介層組合或寫入方式後再測一次",
    mount(ctx) {
      ctx.html(`<div class="fu-arena"></div>`);
      const arena = ctx.$(".fu-arena");
      const FULL = [offset(4), flip({ padding: 2 }), shift({ padding: 2 })], LITE = [offset(4)];
      let full = true, useTransform = true, calls = 0, cost = 0, avg = 0, rate = 0;
      const items = [];
      function add() {
        const dot = h("i", { class: "fu-sdot" }), lab = h("span", { class: "fu-slab" }, `#${items.length + 1}`);
        arena.append(dot, lab);
        const it = { dot, lab, cx: Math.random(), cy: Math.random(), r: 14 + Math.random() * 40, sp: (0.6 + Math.random()) / 900, ph: Math.random() * 6.3 };
        it.stop = autoUpdate(dot, lab, () => {
          const t0 = performance.now();
          return computePosition(dot, lab, { placement: "top", middleware: full ? FULL : LITE }).then(({ x, y }) => {
            if (useTransform) { lab.style.left = lab.style.top = "0"; lab.style.transform = `translate(${x}px,${y}px)`; }
            else { lab.style.transform = ""; setXY(lab, x, y); }
            cost += performance.now() - t0; calls++;
          });
        }, { animationFrame: true });
        items.push(it);
      }
      const drop = () => { const it = items.pop(); it.stop(); it.dot.remove(); it.lab.remove(); };
      ctx.onCleanup(() => { while (items.length) drop(); });
      ctx.raf((t) => {
        const W = arena.clientWidth, H = arena.clientHeight;
        for (const it of items) {
          const a = t * it.sp + it.ph;
          it.dot.style.transform = `translate(${it.cx * W + Math.cos(a) * it.r - 4}px,${it.cy * H + Math.sin(a) * it.r - 4}px)`;
        }
      });
      ctx.interval(() => { avg = calls ? cost / calls : 0; rate = calls * 2; calls = 0; cost = 0; }, 500);
      ctx.controls.classList.add("bottom");
      ctx.group(["offset+flip+shift", "只有 offset"], 0, (i) => (full = i === 0));
      ctx.group(["transform", "left/top"], 0, (i) => (useTransform = i === 0));
      ctx.ramp({
        label: "浮層數", unit: "個", steps: [25, 50, 100, 200, 400, 800, 1200, 1600, 2400], minFps: 30,
        apply(n) { while (items.length < n) add(); while (items.length > n) drop(); },
        metrics: () => ({ "平均每次重算": `${avg.toFixed(3)} ms`, "每秒重算": rate }),
        note: "每個 autoUpdate 每格都讀一次錨點的 getBoundingClientRect，再跑 computePosition 寫回位置；讀寫交錯會造成 N 次強制排版，這通常才是瓶頸。關掉 flip／shift 可看出中介層本身的成本；transform 寫入通常比 left/top 便宜。",
      });
    },
  },
] });
</script>
</body>
</html>
