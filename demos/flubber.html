<style>
  .pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .card { display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 8px 10px; }
  .card h2 { margin: 0; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card h2 small { font: 500 11px var(--mono); color: var(--muted); margin-left: 6px; }
  .card code { display: block; font: 11px/1.4 var(--mono); color: var(--c2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .view { position: relative; flex: 1; min-height: 0; }
  .card .view > svg, .card .view > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ghost { fill: none; stroke: #ecebe6; stroke-width: 1.2; opacity: .35; }
  .ghost.b { stroke-dasharray: 2 4; }
  .ghost.a { stroke-dasharray: 6 4; }

  /* 1. hero morph */
  .fl1 { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: calc(var(--sc-ctl-h, 0px) + 4px) 12px 12px;
    background: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1.4px) 0 0 / 22px 22px,
      radial-gradient(circle at 50% 42%, #1b2f6b 0%, #0d1b3e 55%, #070f26 100%); }
  .fl1 .ttl { position: absolute; left: 14px; top: 12px; color: #fff; line-height: 1.35; pointer-events: none; }
  .fl1 .ttl b { display: block; font-size: 17px; letter-spacing: 1px; }
  .fl1 .ttl span { font-size: 12px; color: var(--muted); }
  .fl1 > svg { flex: 1; min-height: 0; width: 100%; }
  .scrub { width: min(440px, 100%); display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  .scrub input { flex: 1; min-width: 0; accent-color: #f7df1e; }
  .scrub output { font: 600 12px var(--mono); min-width: 36px; text-align: right; color: #fff; }
  .shapes { display: flex; gap: 6px; padding: 5px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12); }
  .shapes button { width: 38px; height: 38px; padding: 5px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; background: transparent; transition: background .15s, transform .15s; }
  .shapes button:hover { background: rgba(255, 255, 255, .08); transform: translateY(-2px); }
  .shapes button[aria-pressed="true"] { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .45); }
  .shapes svg { width: 100%; height: 100%; display: block; }
  @media (max-width: 560px) { .fl1 .ttl { top: calc(var(--sc-ctl-h, 0px) + 4px); } .fl1 > svg { margin-top: 30px; } .shapes { gap: 2px; padding: 4px; } .shapes button { width: 36px; height: 36px; padding: 4px; } }

  /* grids */
  .g4 { display: grid; gap: 10px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
  .g2 { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
  @media (max-width: 900px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; } }
  .cap { margin-top: 4px; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .cap b { color: var(--fg); }

  /* 4. chart */
  .chart { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) 210px; }
  .chart .legend { display: flex; flex-direction: column; justify-content: center; gap: 6px; font-size: 13px; }
  .chart .legend div { display: flex; align-items: center; gap: 8px; }
  .chart .legend i { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .chart .legend span { margin-left: auto; font: 600 12px var(--mono); color: var(--muted); }
  .chart .legend h3 { margin: 0 0 4px; font-size: 13px; }
  .chart .legend small { color: var(--muted); font-size: 11px; }
  .chart text { font: 600 9px var(--font); fill: #ecebe6; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  @media (max-width: 560px) { .chart { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .chart .legend { flex-direction: row; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; } .chart .legend h3 { width: 100%; } .chart .legend span { margin-left: 2px; } }

  /* 6. split */
  .split { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr) auto; }
  .split .segs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 16px; padding: 8px 12px; font: 11px/1.6 var(--mono); color: var(--muted); }
  .split .segs > * { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .split .segs b { grid-column: 1 / -1; color: var(--c2); font-weight: 600; }
  .split .segs i { font-style: normal; color: var(--fg); }
  @media (max-width: 560px) { .split { gap: 6px; } .split .segs { font-size: 10px; padding: 6px 8px; column-gap: 8px; } }

  /* 7. stress */
  .stress-x { position: absolute; inset: 8px 8px 8px 350px; display: flex; flex-direction: column; }
  .stress-x svg { flex: 1; min-height: 0; width: 100%; }
  .stress-x .lbl { font: 600 12px var(--mono); color: var(--muted); text-align: center; }
  .stress-x .tbl { display: grid; grid-template-columns: repeat(4, auto); justify-content: center; gap: 2px 18px; margin-top: 8px; font: 500 11.5px/1.4 var(--mono); color: var(--muted); }
  .stress-x .tbl b { color: var(--fg); font-weight: 600; text-align: right; }
  .stress-x .tbl span { text-align: right; }
  @media (max-width: 760px) { .stress-x { inset: 8px; opacity: .85; } .stress-x .lbl, .stress-x .tbl { display: none; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/flubber@0.4.2/build/flubber.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// flubber showcase: interpolate, circle/rect helpers, one-to-many, many-to-many, sampling density, multi-subpath paths, stress bench.
const css = getComputedStyle(document.documentElement);
const PAL = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const { h, fmtMs } = Showcase;

const K = 0.5523; // cubic bezier circle constant
function circlePath(cx, cy, r) {
  const k = r * K;
  return `M${cx},${cy - r}C${cx + k},${cy - r} ${cx + r},${cy - k} ${cx + r},${cy}` +
    `C${cx + r},${cy + k} ${cx + k},${cy + r} ${cx},${cy + r}` +
    `C${cx - k},${cy + r} ${cx - r},${cy + k} ${cx - r},${cy}` +
    `C${cx - r},${cy - k} ${cx - k},${cy - r} ${cx},${cy - r}Z`;
}
function starPath(cx, cy, ro, ri, n) {
  let d = "";
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / n, r = i % 2 ? ri : ro;
    d += (i ? "L" : "M") + (cx + Math.cos(a) * r).toFixed(1) + "," + (cy + Math.sin(a) * r).toFixed(1);
  }
  return d + "Z";
}
// Rounded rectangle as quadratic corners
function roundRect(x, y, w, hh, r) {
  return `M${x + r},${y}L${x + w - r},${y}Q${x + w},${y} ${x + w},${y + r}L${x + w},${y + hh - r}Q${x + w},${y + hh} ${x + w - r},${y + hh}` +
    `L${x + r},${y + hh}Q${x},${y + hh} ${x},${y + hh - r}L${x},${y + r}Q${x},${y} ${x + r},${y}Z`;
}

// All shapes live in a 200 x 200 box
const SHAPES = [
  { name: "圓形", c: ["#4cc9f0", "#4361ee"], d: circlePath(100, 100, 82) },
  { name: "星星", c: ["#ffd166", "#f77f00"], d: starPath(100, 106, 92, 40, 5) },
  { name: "愛心", c: ["#ff8fa3", "#c9184a"], d: "M100,176C40,134 10,98 20,62C30,26 76,18 100,54C124,18 170,26 180,62C190,98 160,134 100,176Z" },
  { name: "閃電", c: ["#fde047", "#84cc16"], d: "M122,8L44,112L94,112L76,192L158,82L108,82L134,8Z" },
  { name: "水滴", c: ["#7dd3fc", "#2563eb"], d: "M100,12C100,12 36,90 36,128C36,164 65,190 100,190C135,190 164,164 164,128C164,90 100,12 100,12Z" },
  { name: "貓咪", c: ["#d8b4fe", "#7c3aed"], d: "M38,72L44,14L86,46C95,43 105,43 114,46L156,14L162,72C174,90 178,106 174,126C166,164 136,186 100,186C64,186 34,164 26,126C22,106 26,90 38,72Z" },
  { name: "對話框", c: ["#6ee7b7", "#059669"], d: "M40,28L160,28C177,28 188,39 188,56L188,122C188,139 177,150 160,150L98,150L58,186L66,150L40,150C23,150 12,139 12,122L12,56C12,39 23,28 40,28Z" },
];
const byName = (n) => SHAPES.find((s) => s.name === n);

const h2r = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
const mix = (a, b, t) => "#" + h2r(a).map((v, i) => Math.round(v + (h2r(b)[i] - v) * t).toString(16).padStart(2, "0")).join("");
const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const clamp01 = (v) => Math.max(0, Math.min(1, v));

// Ping-pong progress driver: auto toggle + scrub slider in the scene controls; draw(easedProgress)
function pingPong(ctx, draw, { dur = 1500, hold = 900 } = {}) {
  let t = 0, playing = true;
  const cycle = 2 * (dur + hold);
  const toggle = ctx.toggle("自動", true, (v) => (playing = v));
  const slider = ctx.slider("進度", { min: 0, max: 100, value: 0, format: (v) => `${v}%` }, (v) => {
    playing = false;
    toggle.setAttribute("aria-pressed", "false");
    t = (v / 100) * dur;
    draw(ease(v / 100));
  });
  const out = slider.nextElementSibling;
  ctx.raf((now, dt) => {
    if (!playing) return;
    t = (t + dt) % cycle;
    const u = t < dur ? t / dur : t < dur + hold ? 1 : t < 2 * dur + hold ? 1 - (t - dur - hold) / dur : 0;
    const pct = Math.round(u * 100);
    if (+slider.value !== pct) { slider.value = pct; out.textContent = `${pct}%`; }
    draw(ease(u));
  });
  draw(0);
}
// Keep a canvas sized to its parent (DPR capped at 2)
function autoCanvas(ctx, canvas) {
  const box = canvas.parentElement;
  const s = { w: 0, h: 0, dpr: 1 };
  const apply = () => {
    s.w = box.clientWidth; s.h = box.clientHeight; s.dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.max(1, Math.round(s.w * s.dpr));
    canvas.height = Math.max(1, Math.round(s.h * s.dpr));
  };
  const ro = new ResizeObserver(apply);
  ro.observe(box);
  ctx.onCleanup(() => ro.disconnect());
  apply();
  return s;
}

Showcase.run({ scenes: [
  {
    id: "hero", title: "形狀變形",
    api: "flubber.interpolate(fromPath, toPath, { maxSegmentLength: 2 })",
    desc: "flubber 把兩個點數、指令都不同的路徑重新取樣成同樣點數，再找出最佳起點對齊，回傳 t → 路徑字串的函式。分裂與合併用 separate／combine，一個形狀拆成三個圓再拼回去。",
    hint: "拖曳進度條逐格看變形・點下方圖示切換・虛線是起點與終點",
    mount(ctx) {
      ctx.html(`<div class="fl1">
        <div class="ttl"><b>形狀變形</b><span class="pair">圓形</span></div>
        <svg viewBox="-40 -30 280 260" preserveAspectRatio="xMidYMid meet">
          <defs><linearGradient id="fl-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0"/><stop offset="1"/></linearGradient>
          <filter id="fl-blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter></defs>
          <path class="glow" fill="url(#fl-grad)" opacity="0.55" filter="url(#fl-blur)"/>
          <path class="ga" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="5 5" vector-effect="non-scaling-stroke" opacity="0"/>
          <path class="gb" fill="none" stroke="#fff" stroke-width="1.4" stroke-dasharray="2 5" vector-effect="non-scaling-stroke" opacity="0"/>
          <path class="main" fill="url(#fl-grad)" stroke="rgba(255,255,255,.55)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="scrub"><span>進度</span><input type="range" min="0" max="1000" value="0" aria-label="變形進度"><output>0%</output></div>
        <div class="shapes"></div></div>`);
      const PIECES = [circlePath(100, 52, 36), circlePath(50, 138, 36), circlePath(150, 138, 36)];
      const PIECES_D = PIECES.join(" ");
      const OPT = { maxSegmentLength: 2 };
      const shapeEl = ctx.$(".main"), glowEl = ctx.$(".glow"), ghostA = ctx.$(".ga"), ghostB = ctx.$(".gb");
      const [s0, s1] = ctx.$$("stop"), pairEl = ctx.$(".pair");
      const prog = ctx.$(".scrub input"), pct = ctx.$(".scrub output");
      const state = { interp: () => SHAPES[0].d, p: 1, cFrom: SHAPES[0].c, cTo: SHAPES[0].c, cur: 0, split: false, auto: true, tween: null, timer: 0, scrubbing: false };

      const draw = () => {
        const e = ease(state.p), d = state.interp(e);
        shapeEl.setAttribute("d", d);
        glowEl.setAttribute("d", d);
        s0.setAttribute("stop-color", mix(state.cFrom[0], state.cTo[0], e));
        s1.setAttribute("stop-color", mix(state.cFrom[1], state.cTo[1], e));
        if (!state.scrubbing) prog.value = Math.round(state.p * 1000);
        pct.textContent = Math.round(state.p * 100) + "%";
        const mid = (0.15 + Math.sin(Math.PI * state.p) * 0.5).toFixed(2);
        ghostA.setAttribute("opacity", mid);
        ghostB.setAttribute("opacity", mid);
      };
      const morph = ({ interp, fromD, toD, cFrom, cTo, label, dur = 1000, done }) => {
        clearTimeout(state.timer);
        Object.assign(state, { interp, cFrom, cTo, p: 0 });
        ghostA.setAttribute("d", fromD);
        ghostB.setAttribute("d", toD);
        pairEl.textContent = label;
        state.tween = { start: performance.now(), dur, done };
      };
      const scheduleNext = () => {
        clearTimeout(state.timer);
        if (state.auto && !state.split) state.timer = ctx.timeout(() => goTo((state.cur + 1) % SHAPES.length), 1300);
      };
      let buttons = [];
      const markButton = (i) => buttons.forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
      const goTo = (i) => {
        const fromShape = SHAPES[state.cur], to = SHAPES[i], wasSplit = state.split;
        const interp = wasSplit ? flubber.combine(PIECES, to.d, { ...OPT, single: true }) : flubber.interpolate(fromShape.d, to.d, OPT);
        state.cur = i;
        state.split = false;
        splitBtn.textContent = "分裂";
        markButton(i);
        morph({ interp, fromD: wasSplit ? PIECES_D : fromShape.d, toD: to.d, cFrom: fromShape.c, cTo: to.c,
          label: (wasSplit ? "三個圓" : fromShape.name) + " → " + to.name, done: scheduleNext });
      };
      const autoBtn = ctx.toggle("自動播放", true, (v) => {
        state.auto = v;
        if (v && !state.tween) scheduleNext(); else clearTimeout(state.timer);
      });
      const splitBtn = ctx.button("分裂", () => {
        if (state.split) { goTo(state.cur); return; }
        const s = SHAPES[state.cur];
        state.split = true;
        splitBtn.textContent = "合併";
        morph({ interp: flubber.separate(s.d, PIECES, { ...OPT, single: true }), fromD: s.d, toD: PIECES_D, cFrom: s.c, cTo: s.c, label: s.name + " → 三個圓", dur: 1100 });
      }, { primary: true });
      ctx.on(prog, "input", () => {
        state.scrubbing = true;
        state.tween = null;
        clearTimeout(state.timer);
        if (state.auto) { state.auto = false; autoBtn.setAttribute("aria-pressed", "false"); }
        state.p = prog.value / 1000;
        draw();
      });
      ctx.on(prog, "change", () => (state.scrubbing = false));
      const bar = ctx.$(".shapes");
      buttons = SHAPES.map((s, i) => {
        const b = h("button", { type: "button", title: s.name, "aria-label": s.name, onclick: () => { if (i !== state.cur || state.split) goTo(i); } });
        b.innerHTML = `<svg viewBox="0 0 200 200"><path d="${s.d}" fill="${s.c[0]}"/></svg>`;
        bar.append(b);
        return b;
      });
      ctx.raf((now) => {
        const t = state.tween;
        if (!t) return;
        state.p = Math.min(1, (now - t.start) / t.dur);
        draw();
        if (state.p >= 1) { state.tween = null; if (t.done) t.done(); }
      });
      markButton(0);
      draw();
      goTo(1);
    },
  },
  {
    id: "circle-rect", title: "圓與矩形",
    api: "toCircle(shape, x, y, r) / toRect(shape, x, y, w, h) / fromCircle / fromRect",
    desc: "跟圓形、矩形互換時不必先畫出圓的路徑：flubber 依目標形狀的周長把點等距放到真正的圓周或矩形邊上，所以圓是完美的圓、矩形的邊是直的；t = 0 時直接回傳原始的弧線或矩形字串。",
    hint: "拖曳「進度」逐格比較四個函式",
    mount(ctx) {
      const O = { maxSegmentLength: 4 };
      const P = [
        { t: "toCircle", code: "toCircle(星星, 100, 100, 80)", c: PAL[0], mk: () => flubber.toCircle(byName("星星").d, 100, 100, 80, O) },
        { t: "toRect", code: "toRect(對話框, 20, 30, 160, 140)", c: PAL[1], mk: () => flubber.toRect(byName("對話框").d, 20, 30, 160, 140, O) },
        { t: "fromCircle", code: "fromCircle(100, 100, 80, 愛心)", c: PAL[2], mk: () => flubber.fromCircle(100, 100, 80, byName("愛心").d, O) },
        { t: "fromRect", code: "fromRect(20, 20, 160, 160, 閃電)", c: PAL[3], mk: () => flubber.fromRect(20, 20, 160, 160, byName("閃電").d, O) },
      ];
      ctx.html(`<div class="pad g4">${P.map((p) => `<div class="panel card"><h2>${p.t}()</h2><code>${p.code}</code>
        <div class="view"><svg viewBox="-12 -12 224 224"><path class="ghost a"/><path class="ghost b"/><path class="m" fill="${p.c}" fill-opacity=".88"/></svg></div></div>`).join("")}</div>`);
      const cards = ctx.$$(".card");
      const items = P.map((p, i) => {
        const fn = p.mk();
        const [ga, gb, m] = cards[i].querySelectorAll("path");
        ga.setAttribute("d", fn(0));
        gb.setAttribute("d", fn(1));
        return { fn, m };
      });
      pingPong(ctx, (e) => items.forEach((it) => it.m.setAttribute("d", it.fn(e))));
    },
  },
  {
    id: "separate", title: "一變多",
    api: "flubber.separate(shape, pieces, { single }) / flubber.combine(pieces, shape, { single })",
    desc: "separate 把一個形狀切成三角形群再分給 N 個目標，combine 反過來把 N 塊拼成一個。single: true 回傳單一函式，輸出合併成一條路徑；single: false 回傳 N 個函式，每塊可以各自上色、錯開時間。8 塊以內會窮舉最佳配對。",
    hint: "拖曳「塊數」改變拆成幾塊，比較左右兩種回傳方式",
    mount(ctx) {
      const ORDER = ["愛心", "星星", "貓咪", "對話框", "閃電"].map(byName);
      ctx.html(`<div class="pad g2">
        <div class="panel card"><h2>single: true<small>1 個函式、1 條路徑</small></h2><div class="view"><svg viewBox="-12 -12 224 224"><path class="one"/></svg></div><div class="cap">輸出是一條含多個子路徑的字串，只能整體上色。</div></div>
        <div class="panel card"><h2>single: false<small class="cnt"></small></h2><div class="view"><svg viewBox="-12 -12 224 224"><g class="many"></g></svg></div><div class="cap">每塊各一個插值函式：各自上色、依序錯開 0.15 的進度。</div></div>
      </div>`);
      const one = ctx.$(".one"), many = ctx.$(".many"), cnt = ctx.$(".cnt");
      let n = 4, si = 0, step = 0, t0 = 0, fnOne = null, fnMany = [], els = [], cA = "", cB = "", pieceCols = [];
      const STAG = 0.15, DUR = 1300, HOLD = 800;
      const pieces = () => Array.from({ length: n }, (_, i) => {
        const a = -Math.PI / 2 + (i * 2 * Math.PI) / n, R = n === 2 ? 48 : 64;
        const r = Math.min(30, R * Math.sin(Math.PI / n) * 0.8);
        return circlePath(+(100 + Math.cos(a) * R).toFixed(2), +(100 + Math.sin(a) * R).toFixed(2), +r.toFixed(2));
      });
      const O = { maxSegmentLength: 3 };
      const begin = () => {
        const pcs = pieces(), cur = ORDER[si % ORDER.length], nxt = ORDER[(si + 1) % ORDER.length];
        if (step === 0) {
          fnOne = flubber.separate(cur.d, pcs, { ...O, single: true });
          fnMany = flubber.separate(cur.d, pcs, { ...O, single: false });
          cA = cur.c[0]; cB = cur.c[1];
          pieceCols = pcs.map((_, i) => [cur.c[0], PAL[i % 6]]);
        } else {
          fnOne = flubber.combine(pcs, nxt.d, { ...O, single: true });
          fnMany = flubber.combine(pcs, nxt.d, { ...O, single: false });
          cA = cur.c[1]; cB = nxt.c[0];
          pieceCols = pcs.map((_, i) => [PAL[i % 6], nxt.c[0]]);
        }
        if (els.length !== n) {
          many.textContent = "";
          els = pcs.map(() => many.appendChild(document.createElementNS("http://www.w3.org/2000/svg", "path")));
        }
        cnt.textContent = `${fnMany.length} 個函式`;
        t0 = performance.now();
      };
      const reset = () => { step = 0; begin(); };
      ctx.raf((now) => {
        const el = now - t0, total = DUR * (1 + STAG * (n - 1));
        const u = clamp01(el / total);
        one.setAttribute("d", fnOne(ease(clamp01(el / DUR))));
        one.setAttribute("fill", mix(cA, cB, ease(clamp01(el / DUR))));
        fnMany.forEach((fn, i) => {
          const local = ease(clamp01((u * (1 + STAG * (n - 1)) - i * STAG)));
          els[i].setAttribute("d", fn(local));
          els[i].setAttribute("fill", mix(pieceCols[i][0], pieceCols[i][1], local));
        });
        if (el > total + HOLD) {
          if (step === 1) si++;
          step = 1 - step;
          begin();
        }
      });
      ctx.slider("塊數", { min: 2, max: 8, value: n }, (v) => { n = v; reset(); });
      ctx.button("重來", reset);
      reset();
    },
  },
  {
    id: "chart", title: "長條變圓餅",
    api: "flubber.interpolateAll(fromShapes, toShapes, { maxSegmentLength })",
    desc: "interpolateAll 一次處理兩組數量相同的形狀，第 i 個變成第 i 個，所以每根長條都能保留自己的顏色變成對應的扇形或環形。切換途中再按，會從目前畫面上的路徑接著變，不會跳回起點。資料為示意。",
    hint: "切換長條、圓餅、環形，途中也可以按",
    mount(ctx) {
      const DATA = [["全糖", 12], ["少糖", 18], ["半糖", 30], ["微糖", 24], ["無糖", 16]];
      const total = DATA.reduce((s, d) => s + d[1], 0);
      const COLS = [PAL[2], PAL[4], PAL[0], PAL[3], PAL[1]];
      const CX = 110, CY = 104, R = 86, RI = 46;
      const pt = (a, r) => [+(CX + Math.cos(a) * r).toFixed(2), +(CY + Math.sin(a) * r).toFixed(2)];
      const angles = () => { let a = -Math.PI / 2; return DATA.map((d) => { const s = a; a += (d[1] / total) * Math.PI * 2; return [s, a]; }); };
      const LAYOUTS = {
        bar: () => DATA.map((d, i) => {
          const w = 30, x = 18 + i * 40, top = 196 - (d[1] / 30) * 160;
          return { d: `M${x},${top}L${x + w},${top}L${x + w},196L${x},196Z`, lx: x + w / 2, ly: top - 8 };
        }),
        pie: () => angles().map(([a0, a1]) => {
          const [x0, y0] = pt(a0, R), [x1, y1] = pt(a1, R), mid = (a0 + a1) / 2;
          const [lx, ly] = pt(mid, R * 0.62);
          return { d: `M${CX},${CY}L${x0},${y0}A${R},${R} 0 ${a1 - a0 > Math.PI ? 1 : 0},1 ${x1},${y1}Z`, lx, ly };
        }),
        ring: () => angles().map(([a0, a1]) => {
          const g = 0.025, b0 = a0 + g, b1 = a1 - g, large = b1 - b0 > Math.PI ? 1 : 0;
          const [ox0, oy0] = pt(b0, R), [ox1, oy1] = pt(b1, R), [ix1, iy1] = pt(b1, RI), [ix0, iy0] = pt(b0, RI);
          const [lx, ly] = pt((a0 + a1) / 2, (R + RI) / 2);
          return { d: `M${ox0},${oy0}A${R},${R} 0 ${large},1 ${ox1},${oy1}L${ix1},${iy1}A${RI},${RI} 0 ${large},0 ${ix0},${iy0}Z`, lx, ly };
        }),
      };
      const MODES = ["bar", "pie", "ring"];
      ctx.html(`<div class="pad chart"><div class="panel card"><div class="view"><svg viewBox="0 0 220 210">
        <line x1="12" y1="196.5" x2="210" y2="196.5" stroke="rgba(255,255,255,.25)" class="axis"/>
        ${DATA.map((d, i) => `<path fill="${COLS[i]}"/>`).join("")}${DATA.map(() => "<text></text>").join("")}</svg></div></div>
        <div class="legend"><h3>手搖飲甜度偏好<br><small>示意資料・每 100 杯</small></h3>${DATA.map((d, i) => `<div><i style="background:${COLS[i]}"></i>${d[0]}<span>${d[1]}%</span></div>`).join("")}</div></div>`);
      const paths = ctx.$$(".chart path"), texts = ctx.$$(".chart text"), axis = ctx.$(".axis");
      let mode = 0, fns = null, fromL = null, toL = LAYOUTS.bar(), t0 = 0, auto = true, timer = 0;
      const DUR = 1000;
      toL.forEach((l, i) => { paths[i].setAttribute("d", l.d); texts[i].textContent = `${DATA[i][1]}%`; });
      const go = (m) => {
        const current = paths.map((p) => p.getAttribute("d"));
        fromL = toL.map((l, i) => ({ ...l, lx: +texts[i].getAttribute("x") || l.lx, ly: +texts[i].getAttribute("y") || l.ly }));
        mode = m;
        toL = LAYOUTS[MODES[m]]();
        fns = flubber.interpolateAll(current, toL.map((l) => l.d), { maxSegmentLength: 3 });
        t0 = performance.now();
        seg.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(i === m)));
        clearTimeout(timer);
        if (auto) timer = ctx.timeout(() => go((mode + 1) % 3), DUR + 1600);
      };
      ctx.raf((now) => {
        if (!fns) return;
        const e = ease(clamp01((now - t0) / DUR));
        fns.forEach((fn, i) => {
          paths[i].setAttribute("d", fn(e));
          texts[i].setAttribute("x", (fromL[i].lx + (toL[i].lx - fromL[i].lx) * e).toFixed(1));
          texts[i].setAttribute("y", (fromL[i].ly + (toL[i].ly - fromL[i].ly) * e).toFixed(1));
        });
        axis.setAttribute("opacity", String(mode === 0 ? e : 1 - e));
        if (e >= 1) fns = null;
      });
      toL.forEach((l, i) => { texts[i].setAttribute("x", l.lx); texts[i].setAttribute("y", l.ly); });
      const seg = ctx.group(["長條", "圓餅", "環形"], 0, (i) => go(i));
      ctx.toggle("自動輪播", auto, (v) => { auto = v; clearTimeout(timer); if (v) timer = ctx.timeout(() => go((mode + 1) % 3), 600); });
      timer = ctx.timeout(() => go(1), 700);
    },
  },
  {
    id: "density", title: "取樣密度",
    api: "interpolate(a, b, { maxSegmentLength, string: false }) → [[x, y], …]",
    desc: "曲線會依 maxSegmentLength 沿路徑等距取樣；設成 false 時曲線只剩 3 個點（變成三角形），直線多邊形則保留原頂點。值越小越平滑，但點數、建立時間與每格輸出都會增加。string: false 直接回傳點陣列，這裡用 Canvas 畫出每個取樣點。",
    hint: "切換形狀組合，比較四格的點數與建立時間",
    mount(ctx) {
      const PAIRS = [["圓形", "星星"], ["貓咪", "愛心"], ["閃電", "水滴"]];
      const LEN = [false, 40, 10, 2];
      ctx.html(`<div class="pad g4">${LEN.map((l) => `<div class="panel card"><h2>${l === false ? "false" : l}<small></small></h2><div class="view"><canvas></canvas></div></div>`).join("")}</div>`);
      const cards = ctx.$$(".card");
      const cells = LEN.map((len, i) => {
        const cv = cards[i].querySelector("canvas");
        return { len, cv, g: cv.getContext("2d"), s: autoCanvas(ctx, cv), info: cards[i].querySelector("small"), fn: null };
      });
      let pair = 0;
      const build = () => {
        const [a, b] = PAIRS[pair].map(byName);
        cells.forEach((c) => {
          const t0 = performance.now();
          c.fn = flubber.interpolate(a.d, b.d, { maxSegmentLength: c.len, string: false });
          const ms = performance.now() - t0;
          c.info.textContent = `${c.fn(0).length} 點・${ms < 1 ? ms.toFixed(2) : ms.toFixed(1)} ms`;
          c.col = [a.c[0], b.c[0]];
        });
      };
      build();
      pingPong(ctx, (e) => cells.forEach((c) => {
        const { w, h: H, dpr } = c.s, g = c.g;
        if (!w || !H) return;
        const pts = c.fn(e), k = Math.min(w, H) / 220;
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.clearRect(0, 0, c.cv.width, c.cv.height);
        g.setTransform(dpr * k, 0, 0, dpr * k, (w / 2 - 100 * k) * dpr, (H / 2 - 100 * k) * dpr);
        const col = mix(c.col[0], c.col[1], e);
        g.beginPath();
        pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y)));
        g.closePath();
        g.globalAlpha = 0.28;
        g.fillStyle = col;
        g.fill();
        g.globalAlpha = 1;
        g.strokeStyle = col;
        g.lineWidth = 1.2 / k;
        g.stroke();
        const r = Math.max(1.1, Math.min(3.2, 1.8 / k)) / (pts.length > 200 ? 1.8 : 1);
        g.fillStyle = "#ecebe6";
        for (const [x, y] of pts) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
      }), { dur: 1600, hold: 900 });
      ctx.select("", PAIRS.map((p, i) => ({ value: String(i), label: p.join(" → ") })), "0", (v) => { pair = +v; build(); });
    },
  },
  {
    id: "split", title: "拆解路徑",
    api: "flubber.splitPathString(d) + flubber.interpolateAll(partsA, partsB)",
    desc: "interpolate 只取路徑的第一個子路徑，所以笑臉的眼睛和嘴巴在變形途中會消失，到終點才突然跳回來。先用 splitPathString 拆成多段，再交給 interpolateAll 一對一變形，每個部件都能平順移動並保有自己的顏色。",
    hint: "注意左邊變形途中只剩外框；按「下一個」切換",
    mount(ctx) {
      const STATES = [
        { name: "笑臉", parts: [[circlePath(100, 100, 86), "#f7df1e", "臉"], [circlePath(70, 76, 12), "#1a1a14", "左眼"], [circlePath(130, 76, 12), "#1a1a14", "右眼"], ["M56,112Q100,170 144,112Q100,138 56,112Z", "#1a1a14", "嘴"]] },
        { name: "骰子", parts: [[roundRect(16, 16, 168, 168, 28), "#ecebe6", "底"], [circlePath(58, 58, 17), "#d61f69", "點一"], [circlePath(100, 100, 17), "#1a1a14", "點二"], [circlePath(142, 142, 17), "#1a1a14", "點三"]] },
        { name: "紅綠燈", parts: [[roundRect(56, 4, 88, 192, 30), "#3a3f48", "燈箱"], [circlePath(100, 44, 23), "#f72585", "紅燈"], [circlePath(100, 100, 23), "#f7df1e", "黃燈"], [circlePath(100, 156, 23), "#7bd389", "綠燈"]] },
      ];
      STATES.forEach((s) => (s.d = s.parts.map((p) => p[0]).join(" ")));
      ctx.html(`<div class="pad split">
        <div class="panel card"><h2>interpolate(a, b)<small>只取第一段</small></h2><div class="view"><svg viewBox="-12 -12 224 224"><path class="naive" fill-rule="evenodd"/></svg></div></div>
        <div class="panel card"><h2>splitPathString + interpolateAll<small>4 段各自變形</small></h2><div class="view"><svg viewBox="-12 -12 224 224"><g class="parts">${"<path/>".repeat(4)}</g></svg></div></div>
        <div class="panel segs"></div></div>`);
      const naive = ctx.$(".naive"), parts = ctx.$$(".parts path"), segs = ctx.$(".segs");
      let cur = 0, fnNaive = null, fnAll = null, t0 = 0, auto = true, timer = 0;
      const DUR = 1500;
      // Show the returned subpath with decimals rounded so it fits on one line
      const summary = (d) => d.replace(/-?\d*\.\d+(e-?\d+)?/g, (m) => String(Math.round(+m)));
      const go = () => {
        const a = STATES[cur], b = STATES[(cur + 1) % STATES.length];
        const pa = flubber.splitPathString(a.d), pb = flubber.splitPathString(b.d);
        fnNaive = flubber.interpolate(a.d, b.d, { maxSegmentLength: 3 });
        fnAll = flubber.interpolateAll(pa, pb, { maxSegmentLength: 3 });
        segs.innerHTML = `<b>splitPathString(${a.name}) → ${pa.length} 段</b>` +
          pa.map((d, i) => `<span>[${i}] <i>${a.parts[i][2]}</i> ${summary(d)}</span>`).join("");
        t0 = performance.now();
        clearTimeout(timer);
        if (auto) timer = ctx.timeout(() => { cur = (cur + 1) % STATES.length; go(); }, DUR + 1500);
      };
      ctx.raf((now) => {
        if (!fnAll) return;
        const e = ease(clamp01((now - t0) / DUR));
        const a = STATES[cur], b = STATES[(cur + 1) % STATES.length];
        naive.setAttribute("d", fnNaive(e));
        naive.setAttribute("fill", mix(a.parts[0][1], b.parts[0][1], e));
        fnAll.forEach((fn, i) => { parts[i].setAttribute("d", fn(e)); parts[i].setAttribute("fill", mix(a.parts[i][1], b.parts[i][1], e)); });
      });
      ctx.button("下一個", () => { cur = (cur + 1) % STATES.length; go(); }, { primary: true });
      ctx.toggle("自動", auto, (v) => { auto = v; clearTimeout(timer); if (v) timer = ctx.timeout(() => { cur = (cur + 1) % STATES.length; go(); }, 400); });
      go();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "interpolate(ringA, ringB, { maxSegmentLength: false }) + 61 次取樣",
    desc: "建立插值器時，flubber 會嘗試每一個起點位移，找出兩個環最接近的對齊方式，成本隨點數平方成長；之後每一格取樣則是線性。這裡用 N 個點的兩個環，量「建立 + 取樣 61 格」的總時間，右側列出兩者的拆分，並播放剛建好的結果。",
    hint: "按「開始測試」逐級加倍點數",
    mount(ctx) {
      ctx.html(`<div class="stress-x"><svg viewBox="-12 -12 224 224"><path class="sp" fill="${PAL[1]}" fill-opacity=".85" stroke="#ecebe6" stroke-width=".6"/></svg><div class="lbl"></div>
        <div class="tbl"><b>點數</b><b>建立</b><b>取樣／格</b><b>字串長度</b></div></div>`);
      const sp = ctx.$(".sp"), lbl = ctx.$(".lbl"), tbl = ctx.$(".tbl");
      const PREVIEW_MAX = 4000; // larger rings are timed but not animated, to keep the page responsive
      const SIZES = [250, 500, 1000, 2000, 4000, 8000, 16000, 32000];
      // Two wavy rings with exactly n points each
      const ring = (n, f) => Array.from({ length: n }, (_, i) => {
        const a = (i / n) * Math.PI * 2, r = f(a);
        return [100 + Math.cos(a) * r, 100 + Math.sin(a) * r];
      });
      const ringA = (n) => ring(n, (a) => 72 + 18 * Math.sin(7 * a) + 4 * Math.sin(41 * a));
      const ringB = (n) => ring(n, (a) => 64 + 26 * Math.cos(3 * a + 0.6) + 3 * Math.cos(29 * a));
      let show = flubber.interpolate(ringA(250), ringB(250), { maxSegmentLength: false });
      lbl.textContent = "播放中：250 點";
      let t = 0;
      ctx.raf((now, dt) => {
        t = (t + dt) % 3600;
        const u = t < 1400 ? t / 1400 : t < 1800 ? 1 : t < 3200 ? 1 - (t - 1800) / 1400 : 0;
        sp.setAttribute("d", show(ease(u)));
      });
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "每個形狀的點數", unit: "點",
        sizes: SIZES,
        budget: 1000, target: 300,
        prepare: (n) => [ringA(n), ringB(n)],
        run(n, [a, b]) {
          const t0 = performance.now();
          const fn = flubber.interpolate(a, b, { maxSegmentLength: false });
          const t1 = performance.now();
          let len = 0;
          for (let i = 0; i <= 60; i++) len += fn(i / 60).length;
          const t2 = performance.now();
          const kb = len / 61 / 1024, per = (t2 - t1) / 61;
          if (n === SIZES[0]) tbl.querySelectorAll("span").forEach((s) => s.remove());
          if (n <= PREVIEW_MAX) { show = fn; lbl.textContent = `播放中：${n.toLocaleString()} 點`; }
          tbl.append(...[n.toLocaleString(), fmtMs(t1 - t0), `${per.toFixed(2)} ms`, `${kb < 10 ? kb.toFixed(1) : Math.round(kb)} KB`].map((text) => h("span", { text })));
          return `建立 ${fmtMs(t1 - t0)}・取樣 ${per.toFixed(2)} ms/格`;
        },
        note: "總時間＝建立 1 次＋取樣 61 格。點數加倍時建立時間約變 4 倍（逐一嘗試起點的平方成本），取樣約變 2 倍；單次超過 1 秒就停止加碼。實務上 maxSegmentLength 設 2 到 10，單一形狀多半在幾百點以內。",
      });
    },
  },
] });
</script>
</body>
