<script>
// force-graph showcase: eight scenes from the original club network to a node-count stress ramp.
const COLORS = ["#4cc9f0", "#7bd389", "#f7df1e", "#f72585", "#9d8cff", "#ff8c42"];
const FONT = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif';
const BG = "#0e1013";
const { fmt } = Showcase;

// Seeded LCG so every visit shows the same fictional data.
function rng(seed) {
  return () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
}
// d3-force-3d is the engine force-graph runs on; extra forces (collide) come from the same package.
let d3fLoad = null;
const d3f = () => (d3fLoad ||= import("https://cdn.jsdelivr.net/npm/d3-force-3d@3.0.6/+esm"));

// One graph per scene inside a box that follows its own size; torn down on scene exit.
function makeGraph(ctx, box, { refit = null } = {}) {
  const g = new ForceGraph(box);
  const fit = () => {
    g.width(box.clientWidth).height(box.clientHeight);
    const n = g.graphData().nodes;
    if (refit != null && n.length && n[0].x != null) g.zoomToFit(0, refit);
  };
  fit();
  const ro = new ResizeObserver(() => ctx.active && fit());
  ro.observe(box);
  ctx.onCleanup(() => { ro.disconnect(); g._destructor(); box.replaceChildren(); });
  return g;
}

// Outlined text in graph coordinates; px is the on-screen size.
function label(c, str, x, y, px, scale, { color = "#ecebe6", weight = 500, align = "center", base = "middle", alpha = 1 } = {}) {
  const fs = px / scale;
  c.globalAlpha = alpha;
  c.font = `${weight} ${fs}px ${FONT}`;
  c.textAlign = align; c.textBaseline = base;
  c.lineJoin = "round"; c.lineWidth = 3 / scale; c.strokeStyle = BG;
  c.strokeText(str, x, y);
  c.fillStyle = color;
  c.fillText(str, x, y);
  c.globalAlpha = 1;
}

// Mix two #rrggbb colours (t = share of a).
function mix(a, b, t) {
  const p = (s, i) => parseInt(s.slice(i, i + 2), 16);
  const ch = (i) => Math.round(p(a, i) * t + p(b, i) * (1 - t)).toString(16).padStart(2, "0");
  return `#${ch(1)}${ch(3)}${ch(5)}`;
}

// Groups of nodes: a random tree inside each group, extra inner links and a few bridges.
function communities(r, groups, per, { extra = 0.4, bridges = 0.06 } = {}) {
  const nodes = [], links = [];
  for (let gi = 0; gi < groups; gi++) {
    const base = nodes.length, size = typeof per === "function" ? per(gi) : per;
    for (let i = 0; i < size; i++) {
      nodes.push({ id: nodes.length, g: gi, v: 1 + Math.floor(r() * r() * 8) });
      if (i) links.push({ source: base + i, target: base + Math.floor(r() * i) });
      if (i > 2 && r() < extra) links.push({ source: base + i, target: base + Math.floor(r() * i) });
    }
  }
  for (let k = 0; k < nodes.length * bridges; k++) {
    const a = nodes[Math.floor(r() * nodes.length)], b = nodes[Math.floor(r() * nodes.length)];
    if (a.g !== b.g) links.push({ source: a.id, target: b.id, bridge: true });
  }
  return { nodes, links };
}

// ---------- scene data ----------
const CLUBS = [
  { name: "攝影社", color: "#4cc9f0" }, { name: "登山社", color: "#7bd389" }, { name: "程式設計社", color: "#f7df1e" },
  { name: "熱舞社", color: "#f72585" }, { name: "桌遊社", color: "#9d8cff" },
];
const SURNAMES = "陳林黃張李王吳劉蔡楊許鄭謝洪郭邱曾廖賴徐周葉蘇莊呂江何蕭羅高".split("");
const GIVEN = ["怡君", "雅婷", "家豪", "冠宇", "宗翰", "承恩", "思妤", "品妍", "宥廷", "柏翰", "子晴", "欣妤",
  "俊傑", "佳穎", "建宏", "詩涵", "彥廷", "郁婷", "昱安", "語彤", "冠廷", "芷瑜", "博文", "芸萱", "哲瑋", "沛恩"];

function clubData() {
  const r = rng(20261003), pick = (arr) => arr[Math.floor(r() * arr.length)];
  const nodes = [], links = [], used = new Set();
  const newName = () => { let n; do n = pick(SURNAMES) + pick(GIVEN); while (used.has(n)); used.add(n); return n; };
  CLUBS.forEach((club, ci) => {
    const size = 12 + Math.floor(r() * 5), members = [];
    for (let i = 0; i < size; i++) members.push({ id: newName(), club: ci, leader: i === 0 });
    nodes.push(...members);
    members.slice(1).forEach((m, i) => {
      if (r() < 0.75) links.push({ source: members[0].id, target: m.id });
      const other = members[1 + Math.floor(r() * (size - 1))];
      if (other !== m) links.push({ source: m.id, target: other.id });
      if (i % 3 === 0) links.push({ source: m.id, target: pick(members).id });
    });
  });
  // Bridges: students who joined two clubs.
  for (let i = 0; i < 14; i++) {
    const a = pick(nodes), b = pick(nodes);
    if (a.club !== b.club) links.push({ source: a.id, target: b.id, bridge: true });
  }
  const clean = links.filter((l) => l.source !== l.target);
  const byId = new Map(nodes.map((n) => [n.id, Object.assign(n, { neighbors: new Set(), links: new Set() })]));
  clean.forEach((l) => {
    const a = byId.get(l.source), b = byId.get(l.target);
    a.neighbors.add(b); b.neighbors.add(a); a.links.add(l); b.links.add(l);
  });
  return { nodes, links: clean };
}

const FIELDS = ["程式基礎", "數學", "系統", "人工智慧", "應用"];
const COURSES = [
  ["計算機概論", 0], ["微積分", 1], ["線性代數", 1], ["離散數學", 1],
  ["程式設計（一）", 0, "計算機概論"], ["程式設計（二）", 0, "程式設計（一）"],
  ["資料結構", 0, "程式設計（二）", "離散數學"], ["演算法", 0, "資料結構", "離散數學"],
  ["機率與統計", 1, "微積分"], ["數位邏輯", 2, "計算機概論"], ["計算機組織", 2, "數位邏輯", "程式設計（一）"],
  ["作業系統", 2, "計算機組織", "資料結構"], ["計算機網路", 2, "作業系統"], ["編譯器", 2, "演算法", "計算機組織"],
  ["資訊安全", 2, "計算機網路", "作業系統"], ["分散式系統", 2, "作業系統", "計算機網路"],
  ["機器學習", 3, "線性代數", "機率與統計", "演算法"], ["深度學習", 3, "機器學習"],
  ["電腦視覺", 3, "深度學習"], ["自然語言處理", 3, "深度學習"], ["大數據分析", 3, "資料庫系統", "機器學習"],
  ["資料庫系統", 4, "資料結構"], ["軟體工程", 4, "資料結構"], ["網頁程式設計", 4, "程式設計（二）"],
  ["人機互動", 4, "網頁程式設計"], ["雲端運算", 4, "計算機網路", "資料庫系統"],
  ["畢業專題", 4, "軟體工程", "資料庫系統", "網頁程式設計"],
];

const LIBS = [
  ["框架", ["React", "Vue", "Svelte", "Angular", "Solid", "Preact"]],
  ["建置", ["Vite", "webpack", "esbuild", "Rollup", "Babel", "TypeScript"]],
  ["視覺化", ["D3", "Chart.js", "ECharts", "Three.js", "force-graph", "G6"]],
  ["動畫", ["GSAP", "anime.js", "Motion", "Lottie"]],
  ["後端", ["Node.js", "Express", "Fastify", "Koa"]],
  ["測試", ["Jest", "Vitest", "Playwright", "Cypress"]],
];
const LIB_LINKS = ("React~Vite React~Babel React~Jest Vue~Vite Svelte~Vite Solid~Vite Preact~Vite Angular~TypeScript Angular~webpack " +
  "Vite~esbuild Vite~Rollup Vite~Vitest webpack~Babel Jest~Babel TypeScript~esbuild D3~force-graph Three.js~force-graph React~Motion " +
  "React~Three.js Vue~ECharts React~Chart.js GSAP~Three.js Lottie~React Node.js~Express Node.js~Fastify Node.js~Koa Express~Jest " +
  "Playwright~Vite Cypress~React Node.js~TypeScript G6~React anime.js~Svelte D3~ECharts Vitest~TypeScript Rollup~Babel Motion~Vue").split(" ");

const CITIES = [
  ["基隆", 121.74, 25.13, "r"], ["台北", 121.56, 25.04, "t"], ["桃園", 121.30, 24.99, "l"], ["新竹", 120.97, 24.80, "l"],
  ["苗栗", 120.82, 24.56, "l"], ["台中", 120.68, 24.14, "r"], ["彰化", 120.54, 24.08, "l"], ["雲林", 120.43, 23.71, "l"],
  ["嘉義", 120.45, 23.48, "l"], ["台南", 120.21, 22.99, "l"], ["高雄", 120.30, 22.63, "l"], ["屏東", 120.49, 22.67, "r"],
  ["宜蘭", 121.75, 24.76, "r"], ["花蓮", 121.60, 23.98, "r"], ["台東", 121.15, 22.76, "r"],
];
const ROUTES = ["基隆~台北", "台北~桃園", "台北~宜蘭", "桃園~新竹", "新竹~苗栗", "苗栗~台中", "台中~彰化", "彰化~雲林",
  "雲林~嘉義", "嘉義~台南", "台南~高雄", "高雄~屏東", "宜蘭~花蓮", "花蓮~台東", "台東~屏東", "台北~高雄", "台北~台中"];

const DEPTS = ["資工系", "電機系", "企管系", "外文系", "設計系", "物理系", "法律系"];

Showcase.run({ scenes: [
  {
    id: "club", title: "社團網絡",
    api: "new ForceGraph(el).nodeCanvasObject(fn).linkDirectionalParticles(fn).onNodeHover(fn)",
    desc: "五個社團、六十多位同學的友誼網絡：nodeCanvasObject 自繪節點與名字，滑過節點高亮好友圈，連線上的光點是 linkDirectionalParticles，社團間的虛線用 linkLineDash。",
    hint: "滑過節點看好友圈・點人物拉近・點空白處全覽",
    mount(ctx) {
      ctx.html(`<div class="fg-box"></div>
        <div class="fg-card panel"><h3></h3><div class="sub"></div><div class="legend"></div><div class="friends"></div></div>`);
      const { nodes, links } = clubData();
      const hiNodes = new Set(), hiLinks = new Set();
      let hover = null, flowing = true;
      const radius = (n) => Math.sqrt(n.leader ? 6 : 1 + n.neighbors.size * 0.35) * 4;

      ctx.toggle("訊息流動", true, (v) => { flowing = v; g.linkDirectionalParticleSpeed(g.linkDirectionalParticleSpeed()); });
      ctx.button("重新散開", () => {
        nodes.forEach((n) => { n.fx = n.fy = undefined; n.vx = (Math.random() - 0.5) * 30; n.vy = (Math.random() - 0.5) * 30; });
        g.d3ReheatSimulation();
        ctx.timeout(() => g.zoomToFit(600, 40), 1500);
      });
      ctx.button("全覽", () => g.zoomToFit(600, 40));

      const g = makeGraph(ctx, ctx.$(".fg-box"))
        .graphData({ nodes, links })
        .nodeRelSize(4)
        .nodeVal((n) => (n.leader ? 6 : 1 + n.neighbors.size * 0.35))
        .nodeLabel(() => "")
        .linkColor((l) => (hiLinks.has(l) ? "rgba(247,223,30,.9)" : l.bridge ? "rgba(255,255,255,.28)" : "rgba(255,255,255,.12)"))
        .linkWidth((l) => (hiLinks.has(l) ? 2.4 : l.bridge ? 1.2 : 0.8))
        .linkLineDash((l) => (l.bridge ? [3, 3] : null))
        .linkDirectionalParticles((l) => (hiLinks.has(l) ? 4 : 1))
        .linkDirectionalParticleWidth((l) => (hiLinks.has(l) ? 3.5 : 2))
        .linkDirectionalParticleSpeed(() => (flowing ? 0.006 : 0))
        .linkDirectionalParticleColor((l) => CLUBS[l.source.club].color)
        .nodeCanvasObject((n, c, s) => {
          const r = radius(n);
          c.globalAlpha = hover && !hiNodes.has(n) ? 0.18 : 1;
          c.beginPath(); c.arc(n.x, n.y, r, 0, 2 * Math.PI);
          c.fillStyle = CLUBS[n.club].color; c.fill();
          if (n.leader || n === hover) { c.lineWidth = 2 / s; c.strokeStyle = "#fff"; c.stroke(); }
          // Labels: leaders always, others once zoomed in or highlighted.
          if (n !== hover && (n.leader || s > 2.2 || hiNodes.has(n))) {
            label(c, n.leader ? `${n.id}（${CLUBS[n.club].name}社長）` : n.id, n.x, n.y + r + 2 / s, n.leader ? 13 : 11, s,
              { weight: n.leader ? 700 : 500, base: "top", alpha: c.globalAlpha });
          }
          c.globalAlpha = 1;
        })
        .nodePointerAreaPaint((n, color, c) => { c.fillStyle = color; c.beginPath(); c.arc(n.x, n.y, radius(n) + 2, 0, 2 * Math.PI); c.fill(); })
        .onNodeHover((n) => {
          hiNodes.clear(); hiLinks.clear();
          if (n) { hiNodes.add(n); n.neighbors.forEach((x) => hiNodes.add(x)); n.links.forEach((l) => hiLinks.add(l)); }
          hover = n || null;
          card(hover);
        })
        // The hovered name is drawn last so neighbours' labels never cover it.
        .onRenderFramePost((c, s) => hover && label(c, hover.leader ? `${hover.id}（${CLUBS[hover.club].name}社長）` : hover.id,
          hover.x, hover.y + radius(hover) + 2 / s, 14, s, { weight: 700, base: "top", color: CLUBS[hover.club].color }))
        .onNodeClick((n) => { g.centerAt(n.x, n.y, 800); g.zoom(3, 800); })
        .onBackgroundClick(() => g.zoomToFit(600, 40))
        .cooldownTime(4000);
      g.d3Force("charge").strength(-60);
      g.d3Force("link").distance((l) => (l.bridge ? 110 : 34));
      ctx.timeout(() => g.zoomToFit(600, 40), 1200);

      const [h3, sub, legend, friends] = ["h3", ".sub", ".legend", ".friends"].map((s) => ctx.$(`.fg-card ${s}`));
      legend.innerHTML = CLUBS.map((c) => `<span><i style="background:${c.color}"></i>${c.name}</span>`).join("");
      function card(n) {
        legend.hidden = !!n;
        ctx.$(".fg-card").classList.toggle("idle", !n);
        if (!n) {
          h3.textContent = "校園社團網絡"; h3.style.color = "";
          sub.textContent = `${nodes.length} 位同學、${CLUBS.length} 個社團，光點是傳遞中的訊息`;
          friends.innerHTML = "";
          return;
        }
        h3.textContent = n.id; h3.style.color = CLUBS[n.club].color;
        sub.textContent = `${CLUBS[n.club].name}${n.leader ? "社長" : "社員"}，好友 ${n.neighbors.size} 人`;
        friends.innerHTML = [...n.neighbors].map((x) => `<span style="color:${CLUBS[x.club].color}">${x.id}</span>`).join("");
      }
      card(null);
    },
  },
  {
    id: "forces", title: "力學參數",
    api: "g.d3Force('charge').strength(v)・d3Force('link').distance(v)・d3Force('collide', forceCollide(r))",
    desc: "六個群組、約 150 個節點。三支滑桿即時改 d3-force 的斥力、連結長度與碰撞間距，每次調整都呼叫 d3ReheatSimulation 讓佈局重新收斂。",
    hint: "拖動滑桿後看佈局重新收斂・節點大小代表權重・可拖曳節點",
    async mount(ctx) {
      ctx.html(`<div class="fg-box"></div><div class="fg-tag"></div>`);
      const { forceCollide } = await d3f();
      const p = { charge: -30, dist: 30, pad: 0 };
      const data = communities(rng(7), 6, (i) => 18 + i * 3, { extra: 0.35, bridges: 0.05 });
      const radius = (n) => Math.sqrt(n.v) * 3;
      const tag = ctx.$(".fg-tag");
      let ticks = 0;
      const g = makeGraph(ctx, ctx.$(".fg-box"))
        .graphData(data)
        .nodeRelSize(3)
        .nodeVal("v")
        .nodeColor((n) => COLORS[n.g])
        .nodeLabel(() => "")
        .linkColor((l) => (l.bridge ? "rgba(255,255,255,.4)" : "rgba(255,255,255,.15)"))
        .cooldownTime(6000)
        .onEngineTick(() => { if (++ticks % 5 === 0) show(true); })
        .onEngineStop(() => { show(false); g.zoomToFit(500, 30); });
      const show = (running) => {
        tag.innerHTML = `模擬 tick <b>${fmt(ticks)}</b>・${running ? "收斂中" : "已停止（cooldownTime 到期）"}`;
      };
      let fitTimer = 0;
      const reheat = () => {
        ticks = 0; g.d3ReheatSimulation();
        clearTimeout(fitTimer); fitTimer = ctx.timeout(() => g.zoomToFit(600, 30), 1200);
      };
      const setCollide = () => g.d3Force("collide", p.pad > 0 ? forceCollide((n) => radius(n) + p.pad) : null);
      ctx.slider("斥力", { min: -200, max: 0, step: 5, value: p.charge }, (v) => { g.d3Force("charge").strength(v); reheat(); });
      ctx.slider("連結距離", { min: 5, max: 120, step: 1, value: p.dist }, (v) => { g.d3Force("link").distance(v); reheat(); });
      ctx.slider("碰撞間距", { min: 0, max: 20, step: 1, value: p.pad, format: (v) => (v ? `${v}` : "關") }, (v) => { p.pad = v; setCollide(); reheat(); });
      ctx.timeout(() => g.zoomToFit(500, 30), 900);
      ctx.timeout(() => g.zoomToFit(500, 30), 2400);
      show(true);
    },
  },
  {
    id: "dag", title: "DAG 階層",
    api: "g.dagMode('td' | 'lr' | 'radialout' | null).dagLevelDistance(px)",
    desc: "資工系課程先修關係是有向無環圖：dagMode 依深度把節點排成上到下、左到右或放射狀，關閉後回到一般力導向。滑過課程會高亮整條先修與後續路徑。",
    hint: "切換排列方式・滑過課程看先修鏈・拖動層距",
    async mount(ctx) {
      ctx.html(`<div class="fg-box"></div><div class="fg-tag"></div>`);
      const { forceCollide } = await d3f();
      const nodes = COURSES.map(([id, f]) => ({ id, f, pre: [], post: [] }));

        .linkColor(() => "rgba(255,255,255,.12)")
        .linkDirectionalParticleWidth(2)
        .linkDirectionalParticleSpeed(0.01)
        .linkDirectionalParticleColor((l) => COLORS[l.source.g])
        .onRenderFramePre(() => { t0 = performance.now(); ticked = false; })
        .onEngineTick(() => { t1 = performance.now(); ticked = true; })
        .onRenderFramePost(() => {
          const t2 = performance.now();
          simMs += ((ticked ? t1 - t0 : 0) - simMs) * 0.1;
          paintMs += (t2 - (ticked ? t1 : t0) - paintMs) * 0.1;
        });
      // Random tree (each node joins an earlier one, inheriting its colour) plus 20% shortcut links.
      function build(n) {
        const r = rng(n), nodes = [], links = [];
        for (let i = 0; i < n; i++) {
          const p = i ? Math.floor(r() * i) : -1;
          nodes.push({ id: i, g: i < 6 ? i : nodes[p].g });
          if (i) links.push({ source: i, target: p });
        }
        for (let k = 0; k < n * 0.2; k++) {
          const a = Math.floor(r() * n), b = Math.floor(r() * n);
          if (a !== b) links.push({ source: a, target: b });
        }
        linkCount = links.length;
        return { nodes, links };
      }
      ctx.interval(() => g.graphData().nodes.length && g.zoomToFit(400, 12), 1500);
      ctx.ramp({
        label: "節點", unit: "個", steps: [500, 1000, 2000, 4000, 8000, 12000, 20000, 30000, 50000], initial: 1, minFps: 30,
        apply(n) {
          g.graphData(build(n));
          if (!sim) g.cooldownTicks(0);
          ctx.timeout(() => g.zoomToFit(300, 12), 300);
        },
        metrics: () => ({
          連結: linkCount,
          模擬: `${simMs.toFixed(1)} ms`,
          繪圖: `${paintMs.toFixed(1)} ms`,
          模式: [sim ? "模擬" : "靜止", particles && "粒子", texts && "文字"].filter(Boolean).join("＋"),
        }),
        note: "每格先跑一次 d3-force 模擬（Barnes-Hut 斥力約 O(n log n)，再加上連結力），接著用 Canvas 2D 畫所有連線與節點，兩段分開計時。關「模擬」只量繪圖；開「粒子」每條連線多一顆移動光點；開「文字」每個節點多一次 fillText。為了單純量繪圖，已關閉滑鼠命中偵測用的影子畫布（enablePointerInteraction(false)）。",
      });
    },
  },
] });
</script>
</body>
</html>
