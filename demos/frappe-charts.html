<style>
  .fc-card { position: relative; min-height: 0; min-width: 0; padding: 8px 10px 6px; display: flex; flex-direction: column; }

  .fc-card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }

  .fc-grid { position: absolute; inset: var(--sc-ctl-h, 0px) 0 var(--sc-ctl-b, 0px); padding: 10px; overflow-y: auto; display: grid; gap: 8px;

  @media (max-width: 480px) { .fc-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(6, minmax(230px, 1fr)); } }

  /* Scene 2: HTML legend for aggregate charts */
  .fc-agg .chart-legend { display: none; }
  .fc-legend { display: flex; flex-wrap: wrap; gap: 1px 10px; padding-top: 2px; font: 11px/1.45 var(--font); color: var(--muted); }
  .fc-legend span { white-space: nowrap; }

  /* Scene 1: calendar + monthly chart */
  .fc-cal { position: absolute; inset: var(--sc-ctl-h, 0px) 0 var(--sc-ctl-b, 0px); padding: 10px; overflow-y: auto;
    display: grid; grid-template-rows: auto minmax(170px, 1fr); gap: 8px; }
  .fc-heat { margin-top: 4px; }
  .fc-heat svg { display: block; width: 100%; height: auto; }

  .fc-heat rect.day { transition: opacity .2s; cursor: pointer; }
  .fc-heat.fc-focus rect.day { opacity: 0.18; }
  .fc-heat.fc-focus rect.day.fc-on { opacity: 1; }
  .fc-tip { position: absolute; z-index: 30; pointer-events: none; padding: 6px 10px; border-radius: 8px; font: 12px/1.5 var(--font);
    background: var(--panel); border: 1px solid var(--line); color: var(--fg); transform: translate(-50%, -100%); white-space: nowrap; }
  .fc-tip[hidden] { display: none; }
  .fc-tip b { color: var(--accent); margin-left: 6px; }
  @media (max-width: 640px) { .fc-heat { overflow-x: auto; } .fc-heat svg { width: 600px; } }

  /* Scene 7: chart + event panel */
  .fc-split { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px);
    display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) 250px; }
  .fc-side { min-width: 0; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font: 12.5px/1.55 var(--font); color: var(--muted); overflow: hidden; }

  .fc-side .fc-val { font: 600 18px/1.2 var(--mono); color: var(--accent); }
  .fc-meter { height: 6px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .fc-meter i { display: block; height: 100%; width: 0; background: var(--c2); transition: width .3s; }
  .fc-side dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .fc-side dt { color: var(--muted); }
  .fc-side dd { margin: 0; color: var(--fg); font-family: var(--mono); }
  .fc-side pre { margin: auto 0 0; padding: 6px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line);
    font: 11px/1.5 var(--mono); color: var(--fg); white-space: pre-wrap; word-break: break-all; }
  @media (max-width: 640px) {
    .fc-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .fc-side { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; padding: 8px 12px; }
    .fc-side .fc-name { font-size: 16px; } .fc-side .fc-val { font-size: 15px; }
    .fc-side .fc-meter, .fc-side pre, .fc-side .fc-k { display: none; }
    .fc-side dl { display: flex; gap: 10px; margin: 0; } .fc-side dt { display: none; }
  }

  /* Scene 8: stress */
  .fc-stress { position: absolute; inset: 8px 8px 8px 350px; padding: 8px; }
  .fc-stress .fc-box { position: absolute; inset: 40px 8px 8px; }
  .fc-note { position: absolute; left: 10px; top: 8px; right: 10px; padding: 4px 9px; border-radius: 7px; background: var(--bg-2); border: 1px solid var(--line);
    font: 12px/1.5 var(--font); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fc-note b { color: var(--accent); font-weight: 600; }

  /* Dark theme for Frappe's built-in light styles */
  .chart-container { font-family: var(--font) !important; }

  .sc-scene .chart-container text { font-family: var(--font); }
  .sc-scene .chart-container .axis, .sc-scene .chart-container .chart-label { fill: #9b998f; }
  .sc-scene .chart-container .axis line, .sc-scene .chart-container .chart-label line { stroke: rgba(255, 255, 255, 0.08) !important; }
  .sc-scene .chart-container .dataset-units circle { stroke: #171a1f; }
  .sc-scene .chart-container .dataset-units text { fill: #ecebe6; }
  .sc-scene .chart-container .subdomain-name, .sc-scene .chart-container .domain-name { fill: #9b998f; }
  .sc-scene .chart-container .legend-dataset-text, .sc-scene .chart-container .chart-legend text { fill: #9b998f; }
  .sc-scene .chart-container text.title { fill: #ecebe6; font-weight: 600; }
  .sc-scene .chart-container .y-markers line { stroke: #ff8c42 !important; }
  .sc-scene .chart-container .y-markers text { fill: #ff8c42; }
  .sc-scene .chart-container .y-regions rect { fill: rgba(247, 37, 133, 0.13) !important; stroke: rgba(247, 37, 133, 0.45) !important; }
  .sc-scene .chart-container .y-regions text { fill: #f72585; }
  .sc-scene .graph-svg-tip { background: rgba(23, 26, 31, 0.96); border: 1px solid rgba(255, 255, 255, 0.12); color: #9b998f; font-family: var(--font); }
  .sc-scene .graph-svg-tip .svg-pointer { border-top-color: rgba(23, 26, 31, 0.96); }
  /* demo.css styles .bar as a 4px progress bar; restore Frappe's rect height attribute (bars and y-regions) */
  .sc-scene .chart-container rect.bar { height: revert-layer; }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/frappe-charts@1.6.2/dist/frappe-charts.min.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Frappe Charts showcase: eight scenes covering chart types, live data APIs, markers, styles and limits.
const C = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const rng = (s) => () => ((s = (s * 16807) % 2147483647) / 2147483647);
const pad = (v) => String(v).padStart(2, "0");
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const MONTHS = Array.from({ length: 12 }, (_, i) => `${i + 1}月`);
const card = (title, sub = "") =>
  `<div class="panel fc-card"><h2>${title}${sub ? `<small>${sub}</small>` : ""}</h2><div class="fc-box"></div></div>`;

// Frappe takes a fixed pixel height and only tracks its parent's width, so each chart gets a fresh
// child element sized from the card, and scenes rebuild charts when the card height changes.
function fc(ctx, box, cfg, cls = "fc-fill") {
  if (box.fc) box.fc.kill();
  const el = document.createElement("div");
  el.className = cls;
  box.append(el);
  const chart = new frappe.Chart(el, { height: Math.max(100, Math.floor(box.clientHeight)), ...cfg });
  // Frappe 1.6.2 bug: a ResizeObserver redraw before the intro update mixes the placeholder data
  // with the real labels. Keep the observer paused until the intro animation has finished.
  let dead = false;
  if (chart.resizeObserver) {
    chart.resizeObserver.disconnect();
    ctx.timeout(() => { if (!dead) chart.resizeObserver.observe(el); }, 1300);
  }
  // An animated update swaps the chart svg out for about 400ms; a resize redraw in that window
  // throws in makeChartArea (removeChild on a detached svg). Retry the redraw once it is back.
  const draw = chart.draw;
  chart.draw = function (...args) {
    if (dead) return;
    if (this.svg && this.svg.parentNode !== this.container) { ctx.timeout(() => this.draw(...args), 120); return; }
    return draw.apply(this, args);
  };
  chart.kill = () => {
    if (dead) return;
    dead = true;
    chart.destroy();
    el.remove();
    if (box.fc === chart) box.fc = null;
  };
  box.fc = chart;
  ctx.onCleanup(chart.kill);
  return chart;
}

// Build once the card has its final size and rebuild whenever it changes. The first build waits
// for the ResizeObserver pass because the controls bar publishes its height asynchronously.
function watch(ctx, box, build) {
  let w = -1, h = -1, raf = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const nw = box.clientWidth, nh = box.clientHeight;
      if (Math.abs(nw - w) < 2 && Math.abs(nh - h) < 2) return;
      w = nw; h = nh;
      build();
    });
  });
  ro.observe(box);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}

// ---------- Scene 1 data: illustrative Taipei 2024 daily weather ----------
const WET = [0.45, 0.5, 0.45, 0.45, 0.5, 0.55, 0.35, 0.45, 0.45, 0.35, 0.4, 0.42];
const PER_DAY = [6, 8, 9, 10, 13, 17, 14, 17, 18, 11, 7, 6];
const TMAX = [19.2, 19.8, 22.0, 25.6, 29.0, 31.8, 34.0, 33.6, 31.4, 27.8, 24.6, 20.9];
const STORMS = { "2024-07-24": 190, "2024-07-25": 270, "2024-10-02": 160, "2024-10-03": 240, "2024-10-31": 150 };
const DAYS = (() => {
  const rnd = rng(2024), out = [];
  for (let d = new Date(2024, 0, 1); d.getFullYear() === 2024; d.setDate(d.getDate() + 1)) {
    const m = d.getMonth(), k = `${d.getFullYear()}-${pad(m + 1)}-${pad(d.getDate())}`;
    const plum = (m === 4 && d.getDate() >= 18) || (m === 5 && d.getDate() <= 12);
    let rain = rnd() < WET[m] + (plum ? 0.25 : 0) ? Math.round(PER_DAY[m] * (0.3 + rnd() ** 2 * 3.2)) : 0;
    if (STORMS[k]) rain = STORMS[k];
    const tmax = +(TMAX[m] + (rnd() - 0.5) * 4 - (rain > 20 ? 2 : 0)).toFixed(1);
    out.push({ date: new Date(d), k, m, rain, tmax });
  }
  return out;
})();
const BYKEY = new Map(DAYS.map((d) => [d.k, d]));
const md = (d) => `${d.m + 1}/${d.date.getDate()}`;
const peak = (xs, f) => xs.reduce((a, d) => (f(d) > f(a) ? d : a));
const METRICS = {
  rain: {
    title: "台北 2024 每日雨量", legend: ["少", "多"],
    colors: ["#1c2129", "#17425d", "#1f6f9c", "#3aa6dc", "#9ee0ff"],
    intensity: (d) => d.rain, show: (d) => (d.rain ? `${d.rain} mm` : "無雨"),
    sum: (xs) => { const t = peak(xs, (d) => d.rain); return `雨天 ${xs.filter((d) => d.rain).length} 天，合計 ${fmt(xs.reduce((s, d) => s + d.rain, 0))} mm，單日最多 ${t.rain} mm（${md(t)}）`; },
    bars: { type: "bar", name: "每月雨量", color: "#4cc9f0", fmt: (v) => `${fmt(v)} mm`,
      values: MONTHS.map((_, i) => DAYS.filter((d) => d.m === i).reduce((s, d) => s + d.rain, 0)) },
  },
  temp: {
    title: "台北 2024 每日最高溫", legend: ["低", "高"],
    colors: ["#1c2129", "#4a3018", "#91501c", "#df7a26", "#ffc76e"],
    intensity: (d) => Math.max(0.1, d.tmax - 17), show: (d) => `${d.tmax} °C`,
    sum: (xs) => { const t = peak(xs, (d) => d.tmax); const avg = xs.reduce((s, d) => s + d.tmax, 0) / xs.length; return `平均 ${avg.toFixed(1)} °C，最高 ${t.tmax} °C（${md(t)}），33 °C 以上 ${xs.filter((d) => d.tmax >= 33).length} 天`; },
    bars: { type: "line", name: "月均最高溫", color: "#ff8c42", fmt: (v) => `${v} °C`,
      values: MONTHS.map((_, i) => { const xs = DAYS.filter((d) => d.m === i); return +(xs.reduce((s, d) => s + d.tmax, 0) / xs.length).toFixed(1); }) },
  },
};
const WEEK_LABELS = { Sun: "日", Mon: "一", Tue: "二", Wed: "三", Thu: "四", Fri: "五", Sat: "六" };
const ABBR = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

// ---------- Scene 2 data: one bubble-tea shop, three weeks ----------
const WEEKDAYS = ["週一", "週二", "週三", "週四", "週五", "週六", "週日"];
const DRINKS = ["珍奶", "紅茶", "綠茶", "鮮奶茶", "水果茶"];
const SHOP = [
  { store: [320, 290, 310, 335, 420, 610, 575], deliver: [140, 150, 130, 165, 210, 265, 240], drinks: [980, 640, 520, 760, 445] },
  { store: [280, 300, 295, 310, 390, 540, 600], deliver: [150, 140, 145, 150, 190, 230, 260], drinks: [900, 700, 480, 690, 390] },
  { store: [300, 310, 60, 40, 380, 650, 620], deliver: [150, 160, 420, 460, 230, 270, 250], drinks: [1010, 560, 430, 820, 300] },
];

// ---------- Scene 4 data: quarterly revenue (100M NTD) ----------
const QS = ["Q1", "Q2", "Q3", "Q4"];
const LINES = ["雲端服務", "硬體", "顧問"];
const REV = {
  2022: [[32, 35, 38, 44], [48, 44, 46, 52], [12, 14, 13, 16]],
  2023: [[41, 45, 49, 56], [45, 40, 43, 50], [13, 15, 15, 18]],
  2024: [[53, 58, 63, 72], [42, 38, 40, 47], [15, 16, 17, 20]],
  2025: [[68, 74, 80, 92], [40, 35, 38, 44], [16, 18, 19, 23]],
};

// ---------- Scene 6 data: Taipei monthly normals (rounded, illustrative) ----------
const NORMALS = [
  { name: "月均溫", unit: "°C", values: [16.1, 16.5, 18.5, 21.9, 25.2, 27.7, 29.6, 29.2, 27.4, 24.7, 21.5, 17.9] },
  { name: "月雨量", unit: "mm", values: [94, 170, 180, 178, 231, 325, 245, 322, 360, 148, 83, 73] },
];

// ---------- Scene 7 data: annual rainfall by county (rounded, illustrative) ----------
const COUNTIES = [["基隆", 3600], ["台北", 2400], ["新竹", 1750], ["台中", 1700], ["嘉義", 1850], ["台南", 1700],
  ["高雄", 1880], ["屏東", 2400], ["宜蘭", 2850], ["花蓮", 2150], ["台東", 1850], ["澎湖", 1000]];

Showcase.run({
  scenes: [
  {
    id: "calendar", title: "降雨日曆",
    api: "type: 'heatmap' + setCurrentDataPoint() + 'data-select'",
    desc: "把台北 2024 年 366 天的雨量畫成 GitHub 貢獻圖風格的熱度日曆，下方每月合計開啟 isNavigable 可用方向鍵導覽。點日曆格會呼叫 setCurrentDataPoint() 聚焦該月，長條圖觸發 data-select 事件時反過來淡化其他月份；discreteDomains 控制月份之間要不要留空，startSubDomain 決定一週從哪天開始。",
    hint: "滑過格子看當日數值，點格子或長條聚焦月份，選取後可按方向鍵左右切換",
    mount(ctx) {
      ctx.html(`<div class="fc-cal">
        <div class="panel fc-card"><h2><span class="fc-t1"></span><small>顏色越深數值越大</small></h2><div class="fc-heat"></div></div>
        <div class="panel fc-card"><h2><span class="fc-t2"></span><small class="fc-detail"></small></h2><div class="fc-box"></div></div>
        <div class="fc-tip" hidden></div></div>`);
      const cal = ctx.$(".fc-cal"), heatEl = ctx.$(".fc-heat"), box = ctx.$(".fc-box"), tip = ctx.$(".fc-tip"), detail = ctx.$(".fc-detail");
      let metric = "rain", discrete = true, monday = false, bars = null, focus = -1;

      // Frappe's heatmap ships English labels and a fixed-size SVG: translate labels and let it scale with the card.
      function localize() {
        const svg = heatEl.querySelector("svg");
        if (!svg) return;
        if (svg.hasAttribute("width")) {
          const b = svg.getBBox();
          if (!b.width) return;
          svg.setAttribute("viewBox", `${b.x - 4} ${b.y - 4} ${b.width + 8} ${b.height + 8}`);
          svg.removeAttribute("width");
          svg.removeAttribute("height");
        }
        const L = METRICS[metric].legend, map = { ...WEEK_LABELS, Less: L[0], More: L[1] };
        ABBR.forEach((a, i) => (map[a] = `${i + 1}月`));
        heatEl.querySelectorAll("text").forEach((t) => { if (map[t.textContent]) t.textContent = map[t.textContent]; });
        applyFocus();
      }
      const mo = new MutationObserver(localize);
      mo.observe(heatEl, { childList: true, subtree: true });
      ctx.onCleanup(() => mo.disconnect());

      function applyFocus() {
        heatEl.classList.toggle("fc-focus", focus >= 0);
        heatEl.querySelectorAll("rect.day").forEach((r) => {
          const d = r.getAttribute("data-date");
          r.classList.toggle("fc-on", !!d && +d.split("-")[1] - 1 === focus);
        });
        const M = METRICS[metric];
        detail.textContent = focus < 0 ? `全年：${M.sum(DAYS)}` : `${focus + 1} 月：${M.sum(DAYS.filter((d) => d.m === focus))}`;
      }

      function render() {
        const M = METRICS[metric], B = M.bars;
        focus = -1;
        const dataPoints = {};
        DAYS.forEach((d) => (dataPoints[Math.floor(d.date.getTime() / 1000)] = M.intensity(d)));
        fc(ctx, heatEl, {
          type: "heatmap", height: 150, radius: 2, colors: M.colors,
          discreteDomains: discrete ? 1 : 0, startSubDomain: monday ? "Monday" : "Sunday",
          data: { dataPoints, start: new Date(2024, 0, 1), end: new Date(2024, 11, 31) },
        }, "fc-flow");
        const chart = bars = fc(ctx, box, {
          type: B.type, colors: [B.color],
          data: { labels: MONTHS, datasets: [{ name: B.name, values: B.values }] },
          isNavigable: 1, valuesOverPoints: ctx.size().width >= 640 ? 1 : 0,
          barOptions: { spaceRatio: 0.35 }, lineOptions: { regionFill: 1, dotSize: 5, spline: 1 },
          axisOptions: { xAxisMode: "tick", yAxisMode: "span", xIsSeries: 1 },
          tooltipOptions: { formatTooltipY: B.fmt },
        });
        chart.parent.addEventListener("data-select", () => { if (bars === chart) { focus = chart.state.currentIndex; applyFocus(); } });
        ctx.$(".fc-t1").textContent = M.title;
        ctx.$(".fc-t2").textContent = B.name;
        applyFocus();
      }

      ctx.on(heatEl, "mousemove", (e) => {
        const r = e.target.closest && e.target.closest("rect.day");
        const d = r && BYKEY.get(r.getAttribute("data-date"));
        if (!d) { tip.hidden = true; return; }
        const b = r.getBoundingClientRect(), o = cal.getBoundingClientRect();
        tip.innerHTML = `${d.m + 1} 月 ${d.date.getDate()} 日（週${"日一二三四五六"[d.date.getDay()]}）<b>${METRICS[metric].show(d)}</b>`;
        tip.style.left = `${Math.min(o.width - 90, Math.max(90, b.left - o.left + b.width / 2))}px`;
        tip.style.top = `${b.top - o.top + cal.scrollTop - 6}px`;
        tip.hidden = false;
      });
      ctx.on(heatEl, "mouseleave", () => (tip.hidden = true));
      ctx.on(heatEl, "click", (e) => {
        const r = e.target.closest && e.target.closest("rect.day");
        if (r && bars) bars.setCurrentDataPoint(+r.getAttribute("data-date").split("-")[1] - 1);
      });

      ctx.group(["降雨量", "最高溫"], 0, (i) => { metric = i ? "temp" : "rain"; render(); });
      ctx.toggle("月份分隔", true, (v) => { discrete = v; render(); });
      ctx.toggle("週一起始", false, (v) => { monday = v; render(); });
      ctx.button("清除聚焦", () => { focus = -1; applyFocus(); });
      watch(ctx, box, render);
    },
  },
  {
    id: "types", title: "六種圖表",
    api: "type: 'line' | 'bar' | 'axis-mixed' | 'pie' | 'donut' | 'percentage'",
    desc: "同一間手搖飲店的資料交給六種圖表類型。上排三張是座標軸圖，axis-mixed 讓每組資料用 chartType 自己決定畫長條或折線；下排三張把各品項加總成比例。切換週次時每張圖都只呼叫 update()，看長條、折線、扇形與比例條各自怎麼補間。",
    hint: "切換週次看六張圖同時補間；滑過圖形看工具提示",
    mount(ctx) {
      const defs = [
        { name: "折線", type: "line", colors: [C[0], C[1]] },
        { name: "長條", type: "bar", colors: [C[0], C[1]] },
        { name: "混合", type: "axis-mixed", colors: [C[3], C[2]] },
        { name: "圓餅", type: "pie", colors: C.slice(0, 5) },
        { name: "甜甜圈", type: "donut", colors: C.slice(0, 5) },
        { name: "比例條", type: "percentage", colors: C.slice(0, 5) },
      ];
      const AGG = ["pie", "donut", "percentage"];
      // Frappe lays aggregate legends out in fixed 150px slots that overflow small cards, so these cards use an HTML legend.
      ctx.html(`<div class="fc-grid">${defs.map((d) => card(`${d.name}<code>${d.type}</code>`)
        .replace('<div class="fc-box"></div>', AGG.includes(d.type) ? '<div class="fc-box"></div><div class="fc-legend"></div>' : '<div class="fc-box"></div>')
        .replace("fc-card", AGG.includes(d.type) ? "fc-card fc-agg" : "fc-card")).join("")}</div>`);
      const boxes = ctx.$$(".fc-box"), legends = ctx.$$(".fc-legend");
      let week = 0;
      function legend() {
        const vs = SHOP[week].drinks, total = vs.reduce((s, v) => s + v, 0);
        legends.forEach((el, k) => (el.innerHTML = DRINKS.map((n, i) =>
          `<span><i style="background:${C[i]}"></i>${n}<b>${k === 0 ? fmt(vs[i]) : `${Math.round((vs[i] / total) * 100)}%`}</b></span>`).join("")));
      }
      legend();
      const axisData = (w, mixed) => ({
        labels: WEEKDAYS,
        datasets: [
          { name: "門市", values: SHOP[w].store, ...(mixed ? { chartType: "bar" } : {}) },
          { name: "外送", values: SHOP[w].deliver, ...(mixed ? { chartType: "line" } : {}) },
        ],
      });
      const aggData = (w) => ({ labels: DRINKS, datasets: [{ name: "杯數", values: SHOP[w].drinks }] });
      const dataFor = (d, w) => (["pie", "donut", "percentage"].includes(d.type) ? aggData(w) : axisData(w, d.type === "axis-mixed"));
      let charts = [];
      function build() {
        charts = defs.map((d, i) => fc(ctx, boxes[i], {
          type: d.type, colors: d.colors, data: dataFor(d, week),
          barOptions: d.type === "percentage" ? { height: 24, depth: 3 } : { spaceRatio: 0.4 },
          lineOptions: { dotSize: 3 }, strokeWidth: 22, maxLegendPoints: 5,
          axisOptions: { xIsSeries: 1 }, tooltipOptions: { formatTooltipY: (v) => `${fmt(v)} 杯` },
        }));
      }
      ctx.group(["本週", "上週", "颱風週"], 0, (i) => { week = i; legend(); charts.forEach((c, k) => c.update(dataFor(defs[k], week))); });
      ctx.button("重播進場", build);
      watch(ctx, boxes[0], build);
    },
  },
  {
    id: "live", title: "即時增減",
    api: "chart.addDataPoint(label, values) / chart.removeDataPoint(0)",
    desc: "每個 tick 以 addDataPoint() 在尾端補一筆五分鐘用電資料，等補間動畫跑完再用 removeDataPoint(0) 把最舊一筆擠出視窗，兩個 API 各自觸發一次 update() 動畫。視窗長度改變時用目前的歷史資料重建圖表；也能手動加點或刪點看單次動畫。",
    hint: "調整更新間隔與視窗長度；暫停後用「加一點」「刪最舊」逐步觀察",
    mount(ctx) {
      ctx.html(`<div class="fc-solo">${card("即時用電與太陽光電", "", "")}</div>`);
      const box = ctx.$(".fc-box"), sub = document.createElement("small");
      ctx.$(".fc-card h2").append(sub);
      const rnd = rng(77);
      let minute = 6 * 60, win = 24, ms = 1500, on = true, chart = null;
      const point = () => {
        const t = minute, hr = t / 60;
        minute += 5;
        const solar = Math.max(0, 920 * Math.sin((Math.PI * (hr - 6)) / 12.5)) * (0.82 + rnd() * 0.3);
        const load = 2850 + 700 * Math.sin((Math.PI * (hr - 8)) / 12) + (rnd() - 0.5) * 140;
        return { label: `${pad(Math.floor(t / 60) % 24)}:${pad(t % 60)}`, values: [Math.round(load), Math.round(solar)] };
      };
      const hist = Array.from({ length: 48 }, point);
      function info() {
        const n = chart.data.labels.length, last = hist[hist.length - 1];
        sub.textContent = `${n} 點・最新 ${last.label}：需求 ${fmt(last.values[0])}，光電 ${fmt(last.values[1])} 萬瓩（占 ${Math.round((last.values[1] / last.values[0]) * 100)}%）`;
      }
      function build() {
        const xs = hist.slice(-win);
        chart = fc(ctx, box, {
          type: "line", colors: [C[1], C[0]],
          data: { labels: xs.map((p) => p.label), datasets: [{ name: "用電需求", values: xs.map((p) => p.values[0]) }, { name: "太陽光電", values: xs.map((p) => p.values[1]) }] },
          lineOptions: { regionFill: 1, dotSize: 3, hideDots: win > 24 ? 1 : 0 },
          axisOptions: { xIsSeries: 1, xAxisMode: "tick" },
          tooltipOptions: { formatTooltipY: (v) => `${fmt(v)} 萬瓩` },
        });
        info();
      }
      function add() {
        const p = point(), c = chart;
        hist.push(p);
        if (hist.length > 200) hist.shift();
        c.addDataPoint(p.label, p.values);
        info();
        // Wait for the add animation (350 ms + 400 ms settle) before shifting the window.
        ctx.timeout(() => { if (chart === c && c.data.labels.length > win) { c.removeDataPoint(0); info(); } }, 800);
      }
      const loop = () => { if (on) add(); ctx.timeout(loop, ms); };
      ctx.timeout(loop, 1600);
      ctx.toggle("自動串流", true, (v) => (on = v));
      ctx.slider("間隔", { min: 1000, max: 4000, step: 250, value: ms, format: (v) => `${(v / 1000).toFixed(2)} 秒` }, (v) => (ms = v));
      ctx.group(["12 點", "24 點", "48 點"], 1, (i) => { win = [12, 24, 48][i]; build(); });
      ctx.button("加一點", add);
      ctx.button("刪最舊", () => { if (chart.data.labels.length > 2) { chart.removeDataPoint(0); info(); } });
      watch(ctx, box, build);
    },
  },
  {
    id: "update", title: "更新動畫",
    api: "chart.update(data) / updateDataset(values, i) / updateDatasets(list)",
    desc: "三條產品線的季營收。切換年度呼叫 update() 換掉整份資料；「只改硬體」用 updateDataset(values, 1) 只動第二組，其他長條保持不動；「全部隨機」用 updateDatasets() 一次換三組數值。堆疊 barOptions.stacked 屬建構選項，切換時重建圖表。",
    hint: "切換年度與堆疊，再按「只改硬體」比較單組與整份更新的差別",
    mount(ctx) {
      ctx.html(`<div class="fc-solo">${card("三條產品線季營收", "")}</div>`);
      const box = ctx.$(".fc-box"), sub = ctx.$(".fc-card h2 small") || document.createElement("small");
      ctx.$(".fc-card h2").append(sub);
      const rnd = rng(9);
      let year = 2024, stacked = false, chart = null, last = "update(data)";
      let cur = REV[year].map((v) => v.slice());
      const data = () => ({ labels: QS, datasets: LINES.map((name, i) => ({ name, values: cur[i] })) });
      const info = () => {
        const total = cur.flat().reduce((s, v) => s + v, 0);
        sub.innerHTML = `${year} 年合計 ${fmt(total)} 億元・上一次呼叫 <code>${last}</code>`;
      };
      function build() {
        chart = fc(ctx, box, {
          type: "bar", colors: [C[1], C[4], C[5]], data: data(),
          barOptions: { stacked: stacked ? 1 : 0, spaceRatio: 0.35 },
          valuesOverPoints: !stacked && ctx.size().width >= 700 ? 1 : 0,
          tooltipOptions: { formatTooltipY: (v) => `${v} 億元` },
        });
        info();
      }
      ctx.group(Object.keys(REV), 2, (i, l) => {
        year = +l;
        cur = REV[year].map((v) => v.slice());
        chart.update(data());
        last = "update(data)";
        info();
      });
      ctx.toggle("堆疊", false, (v) => { stacked = v; build(); });
      ctx.button("只改硬體", () => {
        cur[1] = cur[1].map((v) => Math.max(10, Math.round(v * (0.7 + rnd() * 0.6))));
        chart.updateDataset(cur[1], 1);
        last = "updateDataset(values, 1)";
        info();
      });
      ctx.button("全部隨機", () => {
        cur = cur.map((vs) => vs.map((v) => Math.max(8, Math.round(v * (0.75 + rnd() * 0.5)))));
        chart.updateDatasets(cur.map((v) => v.slice()));
        last = "updateDatasets(list)";
        info();
      });
      watch(ctx, box, build);
    },
  },
  {
    id: "markers", title: "參考線與區間",
    api: "data.yMarkers / data.yRegions",
    desc: "台北 7 月每日最高與最低溫。yMarkers 畫出可拖動的警戒線與月均線，yRegions 標出 36 °C 以上的高溫帶，兩者都會被算進 Y 軸範圍。拖動警戒線時把新值放進 data 再呼叫 update()，標記線會補間滑到新位置；標籤位置 labelPos 與開關屬建構選項，切換時重建。",
    hint: "拖動「警戒線」看標記線補間並重算超標天數；切換標籤位置",
    mount(ctx) {
      ctx.html(`<div class="fc-solo">${card("台北 7 月每日氣溫", "")}</div>`);
      const box = ctx.$(".fc-box"), sub = document.createElement("small");
      ctx.$(".fc-card h2").append(sub);
      const rnd = rng(731);
      const labels = Array.from({ length: 31 }, (_, i) => `7/${i + 1}`);
      const hi = labels.map((_, i) => +(33.2 + Math.sin(i / 4) * 0.9 + (i >= 19 && i <= 24 ? 2.6 : 0) + (rnd() - 0.5) * 1.6).toFixed(1));
      const lo = hi.map((v) => +(v - 6.5 - rnd() * 1.5).toFixed(1));
      const avg = +(hi.reduce((s, v) => s + v, 0) / hi.length).toFixed(1);
      let th = 35, showRegion = true, showAvg = true, right = true, chart = null, tok = 0;
      const data = () => {
        const d = { labels, datasets: [{ name: "最高溫", values: hi }, { name: "最低溫", values: lo }] };
        d.yMarkers = [{ label: `警戒 ${th.toFixed(1)}°C`, value: th, options: { labelPos: right ? "right" : "left" } }];
        if (showAvg) d.yMarkers.push({ label: `月均高溫 ${avg}°C`, value: avg, options: { labelPos: right ? "left" : "right" } });
        if (showRegion) d.yRegions = [{ label: "36°C 以上高溫帶", start: 36, end: 38, options: { labelPos: right ? "left" : "right" } }];
        return d;
      };
      const info = () => (sub.textContent = `最高溫達 ${th.toFixed(1)} °C 以上共 ${hi.filter((v) => v >= th).length} 天・月均高溫 ${avg} °C`);
      function build() {
        chart = fc(ctx, box, {
          type: "line", colors: [C[4], C[1]], data: data(),
          lineOptions: { dotSize: 4 }, axisOptions: { xIsSeries: 1, xAxisMode: "tick" },
          tooltipOptions: { formatTooltipY: (v) => `${v} °C` },
        });
        info();
      }
      ctx.slider("警戒線", { min: 33, max: 37, step: 0.5, value: th, format: (v) => `${v.toFixed(1)} °C` }, (v) => {
        th = v;
        info();
        const my = ++tok;
        ctx.timeout(() => { if (my === tok) chart.update(data()); }, 160);
      });
      ctx.toggle("高溫帶", true, (v) => { showRegion = v; build(); });
      ctx.toggle("月均線", true, (v) => { showAvg = v; build(); });
      ctx.group(["警戒標籤靠右", "靠左"], 0, (i) => { right = i === 0; build(); });
      watch(ctx, box, build);
    },
  },
  {
    id: "lines", title: "折線樣式",
    api: "lineOptions: { spline, regionFill, heatline, hideLine, hideDots, dotSize }",
    desc: "同一組月資料套上六種 lineOptions：預設、spline 平滑曲線、regionFill 區域漸層、heatline 依數值高低漸變的熱度線、hideLine 只畫點，以及 hideDots 搭配 axisOptions 的 tick 刻度軸。切換資料時六張圖都用 update() 補間。",
    hint: "切換月均溫、月雨量與隨機資料，比較六種線條在不同起伏下的樣子",
    mount(ctx) {
      const defs = [
        { name: "預設", code: "{}", opts: {} },
        { name: "平滑", code: "spline", opts: { lineOptions: { spline: 1 } } },
        { name: "區域填色", code: "regionFill", opts: { lineOptions: { regionFill: 1 } } },
        { name: "熱度線", code: "heatline", opts: { lineOptions: { heatline: 1, dotSize: 0.1 } } },
        { name: "只畫點", code: "hideLine", opts: { lineOptions: { hideLine: 1, dotSize: 6 } } },
        { name: "只畫線＋刻度軸", code: "hideDots", opts: { lineOptions: { hideDots: 1, spline: 1 }, axisOptions: { xAxisMode: "tick", yAxisMode: "tick" } } },
      ];
      ctx.html(`<div class="fc-grid">${defs.map((d) => card(`${d.name}<code>${d.code}</code>`)).join("")}</div>`);
      const boxes = ctx.$$(".fc-box"), rnd = rng(12);
      let set = NORMALS[0], charts = [];
      const data = () => ({ labels: MONTHS.map((_, i) => String(i + 1)), datasets: [{ name: set.name, values: set.values }] });
      function build() {
        charts = defs.map((d, i) => fc(ctx, boxes[i], {
          type: "line", colors: [C[[1, 3, 0, 2, 5, 4][i]]], data: data(),
          ...d.opts, axisOptions: { xIsSeries: 1, ...(d.opts.axisOptions || {}) },
          tooltipOptions: { formatTooltipX: (l) => `${l} 月`, formatTooltipY: (v) => `${v} ${set.unit}` },
        }));
      }
      ctx.group(["月均溫", "月雨量", "隨機"], 0, (i) => {
        set = i < 2 ? NORMALS[i] : { name: "隨機", unit: "", values: MONTHS.map(() => Math.round(20 + rnd() * 80)) };
        charts.forEach((c) => c.update(data()));
      });
      ctx.button("重播進場", build);
      watch(ctx, boxes[0], build);
    },
  },
  {
    id: "nav", title: "導覽與匯出",
    api: "isNavigable + 'data-select' + setCurrentDataPoint(i) + chart.export()",
    desc: "開啟 isNavigable 後，點長條或按方向鍵會移動選取框並在容器上觸發 data-select 事件，右側面板直接讀事件帶的 index、label、values。title 選項畫出圖表標題，valuesOverPoints 在長條頂端標數值；export() 會把目前的 SVG 連同 Frappe 預設樣式下載成獨立檔案。",
    hint: "點長條或按方向鍵切換縣市；按「匯出 SVG」下載目前圖表",
    mount(ctx) {
      ctx.html(`<div class="fc-split">${card("縣市年雨量", "示意資料")}<div class="panel fc-side">
        <div class="fc-k">data-select 事件</div><div class="fc-name"></div><div class="fc-val"></div><div class="fc-meter"><i></i></div>
        <dl><dt>雨量名次</dt><dd class="fc-rank"></dd><dt>與平均差</dt><dd class="fc-diff"></dd></dl><pre></pre></div></div>`);
      const box = ctx.$(".fc-box");
      let sorted = false, labelsOn = true, chart = null;
      const avg = COUNTIES.reduce((s, c) => s + c[1], 0) / COUNTIES.length, max = Math.max(...COUNTIES.map((c) => c[1]));
      const rows = () => (sorted ? COUNTIES.slice().sort((a, b) => b[1] - a[1]) : COUNTIES);
      const data = () => ({ labels: rows().map((c) => c[0]), datasets: [{ name: "年雨量", values: rows().map((c) => c[1]) }] });
      function show(e) {
        const v = e.values[0], rank = COUNTIES.filter((c) => c[1] > v).length + 1, d = ((v - avg) / avg) * 100;
        ctx.$(".fc-name").textContent = e.label;
        ctx.$(".fc-val").textContent = `${fmt(v)} mm`;
        ctx.$(".fc-meter i").style.width = `${(v / max) * 100}%`;
        ctx.$(".fc-rank").textContent = `${rank} / ${COUNTIES.length}`;
        ctx.$(".fc-diff").textContent = `${d >= 0 ? "+" : ""}${d.toFixed(0)}%`;
        ctx.$(".fc-side pre").textContent = `{ index: ${e.index}, label: "${e.label}", values: [${e.values}] }`;
      }
      function build() {
        const c = chart = fc(ctx, box, {
          type: "bar", title: "各縣市年雨量", colors: [C[1]], data: data(), isNavigable: 1,
          valuesOverPoints: labelsOn ? 1 : 0, barOptions: { spaceRatio: 0.3 },
          tooltipOptions: { formatTooltipX: (l) => `${l}`, formatTooltipY: (v) => `${fmt(v)} mm` },
        });
        c.parent.addEventListener("data-select", (e) => { if (chart === c) show(e); });
        // Frappe selects the last point by default; mirror that until the first data-select arrives.
        show(pick(COUNTIES.length - 1));
      }
      // Same shape as the data-select payload, read from our own rows (the chart still holds intro zeros at build time).
      const pick = (i) => ({ index: i, label: rows()[i][0], values: [rows()[i][1]] });
      const cur = () => chart.state.currentIndex ?? COUNTIES.length - 1;
      ctx.button("上一個", () => chart.setCurrentDataPoint(cur() - 1));
      ctx.button("下一個", () => chart.setCurrentDataPoint(cur() + 1));
      ctx.group(["北到南", "多到少"], 0, (i) => { sorted = i === 1; chart.update(data()); show(pick(cur())); });
      ctx.toggle("數值標籤", true, (v) => { labelsOn = v; build(); });
      ctx.button("匯出 SVG", () => chart.export(), { primary: true });
      watch(ctx, box, build);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "chart.update(data)（animate: 0）",
    desc: "逐級把資料點從 100 加到 5 萬，量測關閉動畫時 update() 重建整張 SVG 到下一個畫面畫完的時間；資料在準備階段先產生，不計入耗時。Frappe 每個點都是獨立的 SVG 元素（圓點、長條與 X 軸刻度），耗時會隨點數線性上升，圖面上方拆開顯示 update() 與繪製各花多少時間。",
    hint: "按「開始測試」；切換折線、長條、不畫點後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="fc-stress panel"><div class="fc-note"></div><div class="fc-box"></div></div>`);
      const box = ctx.$(".fc-box"), note = ctx.$(".fc-note");
      const KINDS = ["折線", "長條", "不畫點"];
      let kind = 0, chart = null;
      function make(n) {
        const rnd = rng((n % 2147483646) + 1), labels = new Array(n), values = new Array(n);
        let p = 500;
        for (let i = 0; i < n; i++) {
          p = Math.max(10, p + (rnd() - 0.5) * 40);
          labels[i] = String(i + 1);
          values[i] = Math.round(p);
        }
        return { labels, datasets: [{ name: "數值", values }] };
      }
      function build() {
        chart = fc(ctx, box, {
          type: kind === 1 ? "bar" : "line", animate: 0, colors: [C[1]], data: make(100),
          lineOptions: { dotSize: 2, hideDots: kind === 2 ? 1 : 0 },
          axisOptions: { xIsSeries: 1, xAxisMode: "tick" },
        });
        note.textContent = `${KINDS[kind]}・目前 100 點，按「開始測試」逐級加量`;
      }
      build();
      ctx.group(KINDS, 0, (i) => { kind = i; build(); });
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "資料點", unit: "點",
        sizes: [100, 500, 1000, 2000, 5000, 10000, 20000, 50000],
        target: 1000, budget: 4000,
        prepare: (n) => make(n),
        async run(n, data) {
          const t0 = performance.now();
          chart.update(data);
          const t1 = performance.now();
          await ctx.frame(1);
          const t2 = performance.now();
          note.innerHTML = `${KINDS[kind]} ${fmt(n)} 點：update() <b>${Showcase.fmtMs(t1 - t0)}</b>，繪製 <b>${Showcase.fmtMs(t2 - t1)}</b>，SVG 元素 ${fmt(box.querySelectorAll("svg *").length)} 個`;
        },
        note: "耗時包含 update() 重建 SVG 與下一個畫面的樣式、版面與繪製；圖面上方拆開顯示兩段時間與目前 SVG 元素數。",
      });
    },
  },
  ],
});
</script>
</body>
</html>
