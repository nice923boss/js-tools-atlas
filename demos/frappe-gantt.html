<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frappe Gantt 示範：課程開發專案時程</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/frappe-gantt@1.2.2/dist/frappe-gantt.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  :root {
    --g-header-background: #fffefb;
    --g-row-color: #fffefb;
    --g-border-color: #ece8de;
    --g-tick-color: #f1eee6;
    --g-tick-color-thick: #e2ddd0;
    --g-weekend-highlight-color: #f6f3ec;
    --g-arrow-color: #8a8577;
    --g-today-highlight: #d61f69;
    --g-text-dark: #1c1c1a;
    --g-text-muted: #6d6b64;
    --g-handle-color: #1c1c1a;
  }
  .head {
    position: fixed; left: 12px; top: 10px; z-index: 40;
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    max-width: calc(100% - 170px);
  }
  .head h1 { margin: 0; font-size: 17px; line-height: 1.3; }
  .head .meta { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .head .meta b { color: var(--fg); font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
  #wrap {
    position: fixed; inset: 58px 10px 44px;
    background: #fffefb; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 6px 22px rgba(40, 30, 10, .08); overflow: hidden;
  }
  .gantt-container { border-radius: 0; font-family: var(--font); }
  /* demo.css has a generic .bar progress style; undo its height for the SVG bars. */
  .gantt .bar-wrapper .bar { height: revert-layer; outline: none; stroke: rgba(40, 30, 10, .16); stroke-width: 1; }
  .gantt .bar-label { font-family: var(--font); font-size: 12px; fill: #1c1c1a; }
  .gantt .bar-label.big { fill: #45433d; }
  .gantt-container .upper-text { font-weight: 600; }
  .gantt-container .lower-text { color: var(--muted); }
  .gantt-container .lower-text.current-date-highlight { color: #fff; }
  .gantt-container .holiday-label { font-size: 11px; }
  .gantt-container .popup-wrapper { font-family: var(--font); }
  .gantt-container .popup-wrapper .details { font-size: 12px; line-height: 1.6; }
  .hint { transition: color .2s, border-color .2s; }
  .hint.on { color: var(--fg); border-color: var(--c2); }
  @media (max-width: 640px) {
    .legend { display: none; }
    .head h1 { font-size: 15px; }
    .head { gap: 0 8px; }
    #wrap { inset: 62px 6px 42px; }
  }
</style>
</head>
<body class="paper">
<div class="head">
  <h1>課程開發專案</h1>
  <span class="meta">整體進度 <b id="overall">0%</b></span>
  <span class="legend">
    <span><i style="background:#1f8fb8"></i>規劃</span>
    <span><i style="background:#6a5ae0"></i>製作</span>
    <span><i style="background:#e06a1b"></i>錄製</span>
    <span><i style="background:#2f9e55"></i>上線</span>
  </span>
</div>
<div class="controls" id="views">
  <button class="btn" data-mode="Day">日</button>
  <button class="btn" data-mode="Week" aria-pressed="true">週</button>
  <button class="btn" data-mode="Month">月</button>
</div>
<div id="wrap"><div id="gantt"></div></div>
<div class="hint">拖曳色條改日期・拖右端改長度・拖進度把手調進度</div>

<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@1.2.2/dist/frappe-gantt.umd.js"></script>
<script>
// Phase colours: light bar with a stronger progress fill, both from the paper palette.
const PHASE = {
  plan: { color: "#d6ebf4", color_progress: "#7fc0db" },
  make: { color: "#e5e1fb", color_progress: "#a99ef0" },
  rec: { color: "#fbe1d0", color_progress: "#f0a46f" },
  ship: { color: "#d7efe0", color_progress: "#7cc896" },
};
const task = (id, name, start, end, progress, phase, dependencies = "", owner = "") =>
  ({ id, name, start, end, progress, dependencies, description: owner, ...PHASE[phase] });

// Sample schedule for an online course, October to December 2026.
const TASKS = [
  task("t1", "需求訪談", "2026-10-01", "2026-10-07", 100, "plan", "", "負責：課程企劃"),
  task("t2", "課程大綱設計", "2026-10-06", "2026-10-16", 100, "plan", "t1", "負責：課程企劃"),
  task("t3", "教材簡報製作", "2026-10-14", "2026-11-06", 55, "make", "t2", "負責：講師"),
  task("t4", "實作範例開發", "2026-10-19", "2026-11-13", 35, "make", "t2", "負責：助教"),
  task("t5", "講師試講", "2026-11-09", "2026-11-13", 0, "rec", "t3", "負責：講師、課程企劃"),
  task("t6", "影片錄製", "2026-11-16", "2026-11-27", 0, "rec", "t5", "負責：攝影團隊"),
  task("t7", "後製剪輯", "2026-11-23", "2026-12-04", 0, "rec", "t6", "負責：剪輯師"),
  task("t8", "招生頁上線", "2026-11-30", "2026-12-04", 0, "ship", "t3", "負責：行銷"),
  task("t9", "正式開課", "2026-12-07", "2026-12-11", 0, "ship", "t7,t8", "負責：全體"),
];

// Chinese header labels. upper_text must return the same string when the previous date is null,
// because the library looks the label up again while scrolling.
const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
const VIEW_MODES = [
  {
    name: "Day", padding: ["3d", "7d"], step: "1d", column_width: 32, date_format: "YYYY-MM-DD",
    lower_text: (d) => String(d.getDate()),
    upper_text: (d, prev) => !prev || d.getMonth() !== prev.getMonth() ? `${d.getMonth() + 1} 月` : "",
    thick_line: (d) => d.getDay() === 1,
  },
  {
    name: "Week", padding: ["10d", "14d"], step: "7d", column_width: 58, date_format: "YYYY-MM-DD",
    lower_text: (d) => md(d),
    upper_text: (d, prev) => !prev || d.getMonth() !== prev.getMonth() ? `${d.getMonth() + 1} 月` : "",
    thick_line: (d) => d.getDate() <= 7,
  },
  {
    name: "Month", padding: ["1m", "1m"], step: "1m", column_width: 150, date_format: "YYYY-MM",
    lower_text: (d) => `${d.getMonth() + 1} 月`,
    upper_text: (d, prev) => !prev || d.getFullYear() !== prev.getFullYear() ? `${d.getFullYear()} 年` : "",
    thick_line: (d) => d.getMonth() % 3 === 0,
    snap_at: "7d",
  },
];

const hint = document.querySelector(".hint");
const HINT_TEXT = hint.textContent;
let hintTimer;
function flash(msg) {
  hint.textContent = msg;
  hint.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hint.textContent = HINT_TEXT; hint.classList.remove("on"); }, 2800);
}

// Overall progress weighted by each task's duration in days.
function updateOverall() {
  let total = 0, done = 0;
  for (const t of TASKS) {
    // _start/_end are the parsed dates Frappe Gantt keeps on each task (end is exclusive).
    const days = Math.max(1, (t._end - t._start) / 864e5);
    total += days;
    done += days * (t.progress || 0) / 100;
  }
  document.getElementById("overall").textContent = `${Math.round(done / total * 100)}%`;
}

const lastDay = (end) => new Date(end.getTime() - 1000);
let mode = "Week";
let gantt;
let moved = [];

const wrap = document.getElementById("wrap");

// Render once, then widen the columns if the timeline is narrower than the frame.
function build() {
  render(VIEW_MODES);
  const fit = Math.floor(wrap.clientWidth / gantt.dates.length);
  const base = VIEW_MODES.find((m) => m.name === mode).column_width;
  if (fit > base) render(VIEW_MODES.map((m) => (m.name === mode ? { ...m, column_width: fit } : m)));
}

function render(viewModes) {
  document.getElementById("gantt").replaceChildren();
  gantt = new Gantt("#gantt", TASKS, {
    // Frappe Gantt starts on the first entry of view_modes, so put the active one first.
    view_modes: [...viewModes].sort((a, b) => (b.name === mode) - (a.name === mode)),
    language: "zh-TW",
    bar_height: 24,
    padding: 16,
    bar_corner_radius: 5,
    upper_header_height: 34,
    lower_header_height: 26,
    container_height: wrap.clientHeight,
    infinite_padding: false,
    today_button: false,
    scroll_to: "start",
    holidays: {
      "var(--g-weekend-highlight-color)": "weekend",
      "#fbe3ec": [{ date: "2026-10-09", name: "國慶補假" }, { date: "2026-10-10", name: "國慶日" }],
    },
    popup({ task, set_title, set_subtitle, set_details }) {
      set_title(task.name);
      set_subtitle(task.description || "");
      set_details(`${md(task._start)}～${md(lastDay(task._end))}（${task.actual_duration} 天）<br>進度：${Math.round(task.progress)}%`);
    },
    on_date_change(task, start, end) {
      // Keep the new dates so a resize rebuild does not undo the drag.
      task.start = start;
      task.end = end;
      updateOverall();
      // Dependent bars fire this callback too; report the dragged bar (the first call) once.
      moved.push(`「${task.name}」改為 ${md(start)}～${md(lastDay(end))}`);
      if (moved.length === 1) setTimeout(() => {
        flash(moved.length > 1 ? `${moved[0]}，連動 ${moved.length - 1} 項相依工作` : moved[0]);
        moved = [];
      });
    },
    on_progress_change(task, progress) {
      updateOverall();
      flash(`「${task.name}」進度 ${Math.round(progress)}%`);
    },
  });
}

build();
updateOverall();

const views = document.getElementById("views");
views.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn) return;
  mode = btn.dataset.mode;
  for (const b of views.children) b.setAttribute("aria-pressed", String(b === btn));
  build();
});

// Rebuild on resize so the scroll container matches the new frame size.
let rz;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(build, 150);
});
</script>
</body>
</html>
