<style>

  .fg-msg { color: var(--fg); }
  .fg-chip { white-space: nowrap; }
  .fg-chip i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; border: 1px solid rgba(40, 30, 10, .18); }
  .fg-card { position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: #fffefb; overflow: hidden; box-shadow: 0 4px 16px rgba(40, 30, 10, .06); }

  .fg-side { min-width: 0; min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
  .fg-cap { flex: none; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }

  .fg-log .fg-chg code { color: var(--c5); }
  .fg-log .fg-act code { color: var(--c4); }
  .fg-tbl { flex: 1; min-height: 0; overflow: auto; }
  .fg-tbl table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .fg-tbl th, .fg-tbl td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .fg-tbl th:first-child, .fg-tbl td:first-child { text-align: left; white-space: normal; }
  .fg-tbl th { position: sticky; top: 0; background: #faf8f3; font-weight: 600; color: var(--muted); }

  }

  /* Frappe Gantt skin on the paper palette. */

  .gantt .bar-wrapper.fg-hold .bar-progress { fill: #cfcbc0; }
  .gantt .bar-wrapper.fg-hold .bar-label { fill: #6d6b64; }
  .gantt .bar-wrapper.fg-ms .bar { fill: #1c1c1a; stroke: #1c1c1a; }

<body class="paper">
<script src="https://cdn.jsdelivr.net/npm/frappe-gantt@1.2.2/dist/frappe-gantt.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const { fmt, fmtMs } = Showcase;
const DAY = 864e5;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pad2 = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const monday = (d) => addD(d, -((d.getDay() + 6) % 7));
const lastDay = (end) => new Date(end.getTime() - 1000);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
// Progress implied by the clock: finished before now = 100, not started = 0, rounded to 5 %.
const progressAt = (start, endExclusive, now = Date.now()) =>
  Math.max(0, Math.min(100, Math.round((now - start) / (endExclusive - start) * 20) * 5));

// Fixed-date national holidays in Taiwan, generated for whatever years the data covers.
const FIXED_HOLIDAYS = [["01-01", "元旦"], ["02-28", "和平紀念日"], ["04-04", "兒童節"], ["05-01", "勞動節"], ["10-10", "國慶日"]];
function holidaysBetween(from, to) {
  const out = [];
  for (let y = from.getFullYear(); y <= to.getFullYear(); y++) {
    for (const [mmdd, name] of FIXED_HOLIDAYS) {
      const d = new Date(`${y}-${mmdd}T00:00:00`);
      if (d >= from && d <= to) out.push({ date: `${y}-${mmdd}`, name });
    }
  }
  return out;
}

// Snapshot of the built-in view modes before any chart exists. Frappe Gantt rewrites string formats on
// these shared objects into closures bound to the first chart (its language leaks into later charts),
// so every chart gets its own copies.
const BUILTIN = Object.values(Gantt.VIEW_MODE).map((m) => ({ ...m }));
const order = (modes, first) => [...modes].sort((a, b) => (b.name === first) - (a.name === first));
const builtin = (first) => order(BUILTIN.map((m) => ({ ...m })), first);

// Chinese header labels. upper_text must return the same string when the previous date is null,
// because the library looks the label up again while scrolling.
function zhModes() {
  return [
    {
      name: "Day", padding: ["3d", "7d"], step: "1d", column_width: 34, date_format: "YYYY-MM-DD",
      lower_text: (d) => String(d.getDate()),
      upper_text: (d, prev) => !prev || d.getMonth() !== prev.getMonth() ? `${d.getMonth() + 1} 月` : "",
      thick_line: (d) => d.getDay() === 1,
    },
    {
      name: "Week", padding: ["14d", "14d"], step: "7d", column_width: 58, date_format: "YYYY-MM-DD",
      lower_text: (d) => md(d),
      upper_text: (d, prev) => !prev || d.getMonth() !== prev.getMonth() ? `${d.getMonth() + 1} 月` : "",
      thick_line: (d) => d.getDate() <= 7,
    },
    {
      name: "Month", padding: ["1m", "1m"], step: "1m", column_width: 150, date_format: "YYYY-MM",
      lower_text: (d) => `${d.getMonth() + 1} 月`,
      upper_text: (d, prev) => !prev || d.getFullYear() !== prev.getFullYear() ? `${d.getFullYear()} 年` : "",
      thick_line: (d) => d.getMonth() % 3 === 0,
      snap_at: "7d",
    },
  ];
}

function zhPopup({ task, set_title, set_subtitle, set_details }) {
  set_title(esc(task.name));
  set_subtitle(esc(task.description || ""));
  const skipped = task.ignored_duration ? `，另略過 ${task.ignored_duration} 天` : "";
  set_details(`${md(task._start)}～${md(lastDay(task._end))}（${task.actual_duration} 天${skipped}）<br>進度：${Math.round(task.progress)}%`);
}

const BASE = {
  language: "zh-TW", infinite_padding: false, today_button: false, view_mode_select: false,
  bar_height: 24, padding: 16, bar_corner_radius: 5, upper_header_height: 34, lower_header_height: 26,
  scroll_to: "start", popup: zhPopup,
};

// update_options() re-applies the constructor options, which also resets the view mode
// (to view_modes[0]); put back the mode that was showing.
function setOptions(g, opts) {
  const mode = g.config.view_mode;
  g.update_options(opts);
  if (g.config.view_mode !== mode) g.change_view_mode(mode, true);
}

// Frappe Gantt has no destroy(): the chart is removed by emptying its host when the scene unmounts.
// container_height follows the card, so the header stays sticky and rows scroll inside the chart.
async function ganttIn(ctx, host, tasks, opts) {
  await ctx.frame(2); // let the control bar settle so the first render gets the final height
  if (!ctx.active) return null;
  const g = new Gantt(host, tasks, { ...BASE, container_height: Math.max(160, host.clientHeight), ...opts });
  // Holiday name labels are bound only once in the constructor, but every render (view change,
  // refresh, update_options) rebuilds the highlight rects; bind the new ones after each render.
  const render = g.render;
  g.render = function () { render.call(this); this.bind_holiday_labels(); };
  let lh = host.clientHeight, raf = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!host.clientHeight || host.clientHeight === lh) return;
      lh = host.clientHeight;
      setOptions(g, { container_height: Math.max(160, lh) });
    });
  });
  ro.observe(host);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); host.replaceChildren(); });
  return g;
}

function layout(ctx, side = "") {
  ctx.html(`<div class="fg-wrap${side ? " fg-split" : ""}">
    <div class="fg-main"><div class="fg-info"></div><div class="fg-card"><div class="fg-host"></div></div></div>
    ${side ? `<aside class="fg-side">${side}</aside>` : ""}
  </div>`);
  return ctx.$(".fg-host");
}

function infoBar(ctx) {
  const el = ctx.$(".fg-info");
  let base = "", seq = 0, flashing = false;
  return {
    set(html) { base = html; if (!flashing) el.innerHTML = html; },
    flash(html, ms = 2800) {
      el.innerHTML = `<span class="fg-msg">${html}</span>`;
      flashing = true;
      const k = ++seq;
      ctx.timeout(() => { if (k === seq) { flashing = false; el.innerHTML = base; } }, ms);
    },
  };
}
const chip = (color, label, extra = "") => `<span class="fg-chip"><i style="background:${color};${extra}"></i>${label}</span>`;

// Rows: [id, name, start offset, length in days, dependencies, extra fields]
function planFrom(base, rows, now = Date.now()) {
  return rows.map(([id, name, s, len, dependencies, extra]) => {
    const start = addD(base, s), end = addD(base, s + len - 1);
    return { id, name, start: ymd(start), end: ymd(end), progress: progressAt(start, addD(end, 1), now), dependencies, ...extra };
  });
}

// ---------- scene data (all generated around today) ----------
const PHASE = {
  plan: { color: "#d6ebf4", color_progress: "#7fc0db" },
  make: { color: "#e5e1fb", color_progress: "#a99ef0" },
  rec: { color: "#fbe1d0", color_progress: "#f0a46f" },
  ship: { color: "#d7efe0", color_progress: "#7cc896" },
};
function courseTasks() {
  const B = addD(monday(today0()), -14);
  const ph = (p, owner) => ({ ...PHASE[p], description: `負責：${owner}` });
  return planFrom(B, [
    ["t1", "需求訪談", 0, 7, "", ph("plan", "課程企劃")],
    ["t2", "課程大綱設計", 5, 11, "t1", ph("plan", "課程企劃")],
    ["t3", "教材簡報製作", 13, 24, "t2", ph("make", "講師")],
    ["t4", "實作範例開發", 18, 26, "t2", ph("make", "助教")],
    ["t5", "講師試講", 39, 5, "t3", ph("rec", "講師、課程企劃")],
    ["t6", "影片錄製", 46, 12, "t5", ph("rec", "攝影團隊")],
    ["t7", "後製剪輯", 53, 12, "t6", ph("rec", "剪輯師")],
    ["t8", "招生頁上線", 60, 5, "t3", ph("ship", "行銷")],
    ["t9", "正式開課", 67, 5, "t7,t8", ph("ship", "全體")],
  ]);
}
const LEGEND = chip("#7fc0db", "規劃") + chip("#a99ef0", "製作") + chip("#f0a46f", "錄製") + chip("#7cc896", "上線");

function releaseTasks() {
  const T = today0();
  const days = (id, name, s, e, dependencies, who) =>
    ({ id, name, start: ymd(addD(T, s)), end: ymd(addD(T, e)), progress: progressAt(addD(T, s), addD(T, e + 1)), dependencies, description: `負責：${who}` });
  return [
    days("r1", "第四季產品迭代", -18, 30, "", "產品"),
    days("r2", "回歸測試", -5, -2, "", "測試組"),
    days("r3", "上線前檢查", -1, -1, "r2", "維運"),
    days("r4", "部署與資料遷移", 0, 0, "r3", "後端、維運"),
    days("r5", "灰度發布 10%", 1, 2, "r4", "維運"),
    days("r6", "全量發布", 3, 3, "r5", "維運"),
    days("r7", "上線觀察期", 4, 10, "r6", "全體"),
    days("r8", "使用者回饋整理", 11, 17, "r7", "產品"),
    days("r9", "明年度規劃", 24, 55, "", "產品、主管"),
  ];
}

function sprintTasks() {
  const B = addD(monday(today0()), -7);
  const who = (w) => ({ description: `負責：${w}` });
  return planFrom(B, [
    ["s1", "需求確認", 0, 3, "", who("產品")],
    ["s2", "介面設計", 2, 5, "s1", who("設計")],
    ["s3", "API 開發", 3, 8, "s1", who("後端")],
    ["s4", "測試案例", 6, 5, "s1", who("測試")],
    ["s5", "前端串接", 8, 6, "s2,s3", who("前端")],
    ["s6", "整合測試", 14, 4, "s4,s5", who("測試")],
    ["s7", "上線準備", 18, 3, "s6", who("維運")],
  ]);
}

function siteTasks() {
  const B = addD(monday(today0()), -10);
  const c = (custom_class, description) => ({ custom_class, description });
  const tasks = planFrom(B, [
    ["w1", "競品研究", 0, 4, "", c("fg-done", "已完成")],
    ["w2", "資訊架構", 3, 5, "w1", c("fg-done", "已完成")],
    ["w3", "視覺設計", 7, 8, "w2", c("", "進行中")],
    ["w4", "內容撰寫", 7, 12, "w2", c("fg-risk", "有風險：素材延遲")],
    ["w5", "前端切版", 14, 9, "w3", c("fg-crit", "關鍵路徑")],
    ["w6", "CMS 串接", 18, 8, "w5", c("fg-crit", "關鍵路徑")],
    ["w7", "第三方授權", 10, 7, "", c("fg-hold", "暫停：等法務")],
    ["w8", "驗收測試", 27, 4, "w4,w6", c("fg-crit", "關鍵路徑")],
    ["w9", "正式上線", 31, 1, "w8", c("fg-ms", "里程碑")],
  ]);
  tasks[0].progress = tasks[1].progress = 100;
  return tasks;
}
const CLASS_LEGEND = chip("#7cc896", "fg-done 已完成") + chip("#ec8db2", "fg-risk 有風險") +
  chip("#dcedf5", "fg-crit 關鍵路徑", "border:2px solid #1c1c1a") + chip("#f1efe9", "fg-hold 暫停", "border:1px dashed #8a8577") + chip("#1c1c1a", "fg-ms 里程碑");

// ---------- stress data ----------
function bigTasks(n, deps) {
  const B = addD(monday(today0()), -14), out = new Array(n);
  for (let i = 0; i < n; i++) {
    const s = addD(B, (i * 7) % 170), len = 2 + (i * 5) % 9;
    out[i] = { id: `k${i}`, name: `工作 ${i + 1}`, start: ymd(s), end: ymd(addD(s, len - 1)), progress: (i * 37) % 101, dependencies: deps && i % 10 ? `k${i - 1}` : "" };
  }
  return out;
}

Showcase.run({ scenes: [
  {
    id: "project", title: "課程開發專案", paper: true,
    api: "new Gantt(el, tasks, { view_modes, holidays, popup, on_date_change, on_progress_change })",
    desc: "九項工作組成的課程開發時程，示範相依箭頭、用 task.color 為各階段上色，以及週末與國定假日的底色。表頭換成繁中自訂刻度，點色條會跳出繁中說明。拖曳色條時，後續相依工作會一起往後推；拖進度把手則即時重算依工期加權的整體進度。",
    hint: "拖曳色條改日期・拖右端改長度・拖進度圓點調進度・點色條看詳情",
    async mount(ctx) {
      const host = layout(ctx);
      const info = infoBar(ctx);
      const tasks = courseTasks();
      const NAMES = ["Day", "Week", "Month"];
      let mode = "Week", g = null, moved = [];
      const overall = () => {
        let total = 0, done = 0;
        for (const t of tasks) {
          const days = Math.max(1, (t._end - t._start) / DAY);
          total += days;
          done += days * (t.progress || 0) / 100;
        }
        return Math.round(done / total * 100);
      };
      const stat = () => info.set(`整體進度 <b class="n">${overall()}%</b>　${LEGEND}`);
      // Widen the columns when the timeline is narrower than the card.
      function show(name) {
        mode = name;
        const base = g.options.view_modes.find((m) => m.name === name);
        g.change_view_mode(base);
        const fit = Math.floor(host.clientWidth / g.dates.length);
        if (fit > base.column_width) g.change_view_mode({ ...base, column_width: fit });
      }
      ctx.group(["日", "週", "月"], 1, (i) => g && show(NAMES[i]));
      ctx.button("回到今天", () => g && g.scroll_current());
      const B = addD(monday(today0()), -14);
      g = await ganttIn(ctx, host, tasks, {
        view_modes: order(zhModes(), mode),
        holidays: { "var(--g-weekend-highlight-color)": "weekend", "#fbe3ec": holidaysBetween(addD(B, -30), addD(B, 120)) },
        on_date_change(task, start, end) {
          stat();
          // Dependent bars fire this callback too; report the dragged bar (the first call) once.
          moved.push(`「${esc(task.name)}」改為 ${md(start)}～${md(end)}`);
          if (moved.length === 1) ctx.timeout(() => {
            info.flash(moved.length > 1 ? `${moved[0]}，連動 ${moved.length - 1} 項相依工作` : moved[0]);
            moved = [];
          }, 0);
        },
        on_progress_change(task, progress) {
          stat();
          info.flash(`「${esc(task.name)}」進度 ${Math.round(progress)}%・整體進度 ${overall()}%`);
        },
      });

      ctx.controls.classList.add("bottom");
      const host = ctx.$(".fg-host");
      const info = infoBar(ctx);
      let deps = true;
      ctx.toggle("相依箭頭", deps, (v) => { deps = v; });
      ctx.onCleanup(() => host.replaceChildren());
      const build = (tasks) => new Gantt(host, tasks, {
        ...BASE, view_modes: order(zhModes(), "Day"), container_height: Math.max(160, host.clientHeight),
      });
      await ctx.frame(2);
      if (!ctx.active) return;
      build(bigTasks(60, deps));
      info.set(`目前 <span class="n">60</span> 項工作`);
      ctx.bench({
        label: "工作", unit: "項", sizes: [100, 250, 500, 1000, 2000, 4000, 8000], budget: 2000,
        // Remove the previous chart outside the timed run, otherwise its teardown lands on the next size.
        prepare: (n) => { host.replaceChildren(); return bigTasks(n, deps); },
        async run(n, tasks) {
          const t0 = performance.now();
          build(tasks);
          const t1 = performance.now();
          await ctx.frame(1);
          const t2 = performance.now();
          // Counting nodes walks the whole chart, so it runs after the timed part.
          ctx.timeout(() => info.set(`<span class="n">${fmt(n)}</span> 項工作${deps ? "（含相依箭頭）" : ""}・DOM 節點 <span class="n">${fmt(host.querySelectorAll("*").length)}</span>・建構 <span class="n">${fmtMs(t1 - t0)}</span>・下一幀 <span class="n">${fmtMs(t2 - t1)}</span>`), 0);
        },
        note: "計時從呼叫 new Gantt 到下一幀，上一張圖在計時前先移除。建構階段同步建出格線、日期表頭、每項工作的色條群組與相依箭頭；下一幀裡每條色條用 getBBox 量標籤寬度，決定標籤放在條內還是條外，會觸發整張 SVG 的版面計算。開啟相依箭頭時，make_arrows 逐項用 find 查前置工作，map_arrows_on_bars 再讓每條色條比對全部箭頭，成本隨數量呈平方成長。",
      });
    },
  },
] });
</script>
</body>
</html>
