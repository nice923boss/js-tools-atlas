<style>
  :root {
    --fc-breezy-primary: #1f8fb8;
    --fc-breezy-primary-over: #2aa3cf;
    --fc-breezy-background: #fffefb;
  }
  /* FullCalendar writes height:100% on its root, so size a wrapper instead. */
  .fcx-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: flex; gap: 10px; }
  .fcx-cal {
    flex: 1; min-width: 0; height: 100%;
    background: var(--fc-breezy-background); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px 12px; box-shadow: 0 6px 22px rgba(40, 30, 10, .08);
    font-family: var(--font); font-size: 14px;
  }
  @media (max-width: 560px) {
    .fcx-wrap { padding-left: 6px; padding-right: 6px; }
  }
  /* small stages: tighter toolbar so the grid keeps its rows */
  @media (max-width: 620px), (max-height: 480px) {
    .fcx-cal { padding: 2px 4px 4px; font-size: 12px; }
    .fcx-cal .fcx-tb { padding: 6px 4px; gap: 6px; }
    .fcx-cal .fcx-title { font-size: 15px; }
    .fcx-cal .fcx-btn { height: 28px; padding: 2px 8px; font-size: 12px; }
  }

  /* change log beside the calendar (wide screens only) */
  .fcx-log { flex: 0 0 236px; display: flex; flex-direction: column; min-height: 0; padding: 10px 12px; }
  .fcx-log h3 { margin: 0 0 6px; font-size: 12.5px; font-weight: 600; }
  .fcx-log ol { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; min-height: 0; font-size: 12px; line-height: 1.5; }
  .fcx-log li { padding: 5px 0; border-top: 1px dashed var(--line); }
  .fcx-log li:first-child { border-top: 0; }
  .fcx-log .t { font: 500 10.5px/1 var(--mono); color: var(--muted); margin-right: 4px; }
  .fcx-log .k { font-weight: 600; color: var(--c2); }
  .fcx-log .empty { color: var(--muted); }
  @media (max-width: 760px) { .fcx-log { display: none; } }

  /* toast for actions */
  .fcx-msg { position: absolute; left: 50%; bottom: calc(var(--sc-ctl-b, 0px) + 22px); transform: translate(-50%, 6px); z-index: 30;
    max-width: calc(100% - 40px); padding: 6px 14px; border-radius: 999px; pointer-events: none;
    background: rgba(28, 28, 26, .9); color: #fff; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transition: opacity .2s, transform .2s; }
  .fcx-msg.on { opacity: 1; transform: translate(-50%, 0); }
  .fcx-busy { position: absolute; right: 24px; bottom: calc(var(--sc-ctl-b, 0px) + 22px); z-index: 30; padding: 4px 10px; border-radius: 999px;
    background: var(--c2); color: #fff; font-size: 12px; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .fcx-busy.on { opacity: 1; }

  /* 5. custom event content */
  .fcx-ev { display: flex; flex-direction: column; gap: 2px; padding: 1px 3px; min-width: 0; overflow: hidden; font-size: 11.5px; line-height: 1.3; }
  .fcx-ev b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fcx-ev .who { opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fcx-ev .seat { height: 4px; border-radius: 2px; background: color-mix(in srgb, currentColor 28%, transparent); overflow: hidden; flex: none; }
  .fcx-ev .seat i { display: block; height: 100%; background: currentColor; border-radius: 2px; }
  .fcx-ev .num { font: 500 10.5px/1.2 var(--mono); }
  .fcx-ev.compact { flex-direction: row; align-items: center; gap: 5px; }
  .fcx-ev.compact b { flex: 1; min-width: 0; }
  .fcx-full { background-image: repeating-linear-gradient(135deg, rgba(255, 255, 255, .22) 0 5px, transparent 5px 10px); }
  .fcx-badge { display: inline-block; margin-inline-start: 4px; padding: 0 5px; border-radius: 6px; background: color-mix(in srgb, var(--c2) 16%, transparent);
    color: var(--c2); font: 600 10px/1.6 var(--mono); }
  .fcx-dh { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
  .fcx-dh small { font: 500 10px/1.2 var(--mono); color: var(--muted); }
  .fcx-weekend { background: color-mix(in srgb, var(--c5) 5%, transparent); }

  /* 8. stress */
  .fcx-stress { position: absolute; inset: 8px 8px 8px 350px; display: flex; }
  @media (max-width: 760px) { .fcx-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 8px; } }

<body class="paper">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/rrule@2.8.1/dist/es5/rrule.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/rrule@7.1.0/global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/breezy/global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/locales/zh-tw/global.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// FullCalendar showcase: eight scenes from the course schedule to an event-count stress benchmark.
// Every date is generated relative to today so the calendar always has content.
const { h, fmt } = Showcase;
const FC = "https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0";

// Category colours follow the paper palette in demo.css.
const COLORS = {
  onsite: "#1f8fb8", online: "#6a5ae0", corp: "#e06a1b",
  admin: "#2f9e55", holiday: "#d61f69", added: "#d4a900",
};
const KINDS = ["onsite", "online", "corp", "admin"];
const TITLES = ["AI 工具入門", "Python 資料分析", "簡報實作", "Excel 自動化", "提示工程讀書會", "樂齡數位課",
  "企業內訓", "教師研習", "AI 繪圖直播", "課程企劃會議", "一對一諮詢", "影片剪輯"];
const HM = { hour: "2-digit", minute: "2-digit", hour12: false };
const DAY = 86400000;

// ---------- date helpers ----------
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const mondayOf = (d) => addDays(d, -((d.getDay() + 6) % 7));
const at = (d, hm) => `${ymd(d)}T${hm}`;
const dayFmt = new Intl.DateTimeFormat("zh-TW", { month: "numeric", day: "numeric", weekday: "short" });
const timeFmt = new Intl.DateTimeFormat("zh-TW", HM);
const mdFmt = new Intl.DateTimeFormat("zh-TW", { month: "numeric", day: "numeric" });
const when = (e) => e.allDay ? dayFmt.format(e.start) : `${dayFmt.format(e.start)} ${timeFmt.format(e.start)}`;
const span = (e) => {
  if (!e.end) return e.allDay ? "1 天" : "預設長度";
  const m = Math.round((e.end - e.start) / 60000);
  if (e.allDay) return `${Math.round(m / 1440)} 天`;
  return m % 60 ? `${Math.floor(m / 60)} 小時 ${m % 60} 分` : `${m / 60} 小時`;
};

// Small deterministic RNG so every reload shows the same layout for the same day.
function rng(seed) {
  let s = seed | 0;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, list) => list[Math.floor(r() * list.length)];

function randomEvents(n, from, days, seed) {
  const r = rng(seed);
  const out = new Array(n);
  for (let i = 0; i < n; i++) {
    const d = addDays(from, Math.floor(r() * days));
    const kind = pick(r, KINDS);
    const title = pick(r, TITLES);
    if (r() < 0.07) {
      out[i] = { title, start: ymd(d), end: ymd(addDays(d, 1 + Math.floor(r() * 3))), allDay: true, color: COLORS[kind] };
      continue;
    }
    const s = new Date(d);
    s.setHours(8 + Math.floor(r() * 12), r() < 0.5 ? 0 : 30, 0, 0);
    out[i] = { title, start: s, end: new Date(+s + (1 + Math.floor(r() * 3)) * 36e5), color: COLORS[kind] };
  }
  return out;
}

// ---------- calendar helpers ----------
const BASE = {
  locale: "zh-tw",
  // midnight, not "now": v7 scrolls a month grid one row too far when the current date carries a time and falls on the row's last day
  initialDate: today(),
  height: "100%",
  nowIndicator: true,
  fixedWeekCount: false,
  dayMaxEvents: true,
  eventDisplay: "block",
  slotMinTime: "08:00",
  slotMaxTime: "21:00",
  scrollTime: "08:00",
  slotDuration: "01:00",
  snapDuration: "00:15",
  expandRows: true,
  moreLinkContent: (arg) => `+${arg.num}`,
  // class options join with the theme's classes; used to tighten small stages
  toolbarClass: "fcx-tb",
  toolbarTitleClass: "fcx-title",
  buttonClass: "fcx-btn",
  eventTimeFormat: HM,
  slotHeaderFormat: HM,
  listDayFormat: { month: "long", day: "numeric" },
  listDayAltFormat: { weekday: "short" },
  buttons: {
    dayGridMonth: { text: "月" }, timeGridWeek: { text: "週" }, timeGridDay: { text: "日" },
    listWeek: { text: "清單" }, listMonth: { text: "清單" }, multiMonthYear: { text: "年" },
  },
};

// Creates the calendar, destroys it on scene change, and swaps toolbars when the stage crosses 620 px.
// A short month grid cannot fit even one event under dayMaxEvents:true (only "+N" links),
// so short calendars cap at one event per day and let the grid scroll instead.
function calendar(ctx, el, opts, toolbar) {
  const wide = () => ctx.size().width >= 620;
  const tall = () => el.clientHeight >= 420;
  const autoMax = !("dayMaxEvents" in opts);
  let last = wide(), lastTall = tall();
  const cal = new FullCalendar.Calendar(el, {
    ...BASE, ...opts,
    ...(autoMax ? { dayMaxEvents: lastTall ? true : 1 } : {}),
    ...(toolbar ? toolbar(last) : {}),
  });
  cal.render();
  ctx.onCleanup(() => cal.destroy());
  ctx.onResize(() => {
    const t = tall();
    if (autoMax && t !== lastTall) { lastTall = t; cal.setOption("dayMaxEvents", t ? true : 1); }
    const w = wide();
    if (!toolbar || w === last) return;
    last = w;
    const tb = toolbar(w);
    for (const k of Object.keys(tb)) cal.setOption(k, tb[k]);
  });
  return cal;
}

// Toast in the middle of the bottom edge.
function toaster(ctx) {
  const chip = h("div", { class: "fcx-msg", role: "status" });
  ctx.el.append(chip);
  let timer;
  ctx.onCleanup(() => clearTimeout(timer));
  return (msg) => {
    chip.textContent = msg;
    chip.classList.add("on");
    clearTimeout(timer);
    timer = setTimeout(() => chip.classList.remove("on"), 3000);
  };
}

// Side log on wide screens; falls back to the toast when the panel is hidden.
function logger(ctx, host, title, toast) {
  const list = h("ol", {}, h("li", { class: "empty", text: "還沒有紀錄" }));
  const box = h("div", { class: "panel fcx-log" }, h("h3", { text: title }), list);
  host.append(box);
  let n = 0;
  return (key, text) => {
    if (n === 0) list.textContent = "";
    n++;
    const t = new Date();
    list.prepend(h("li", {}, h("span", { class: "t", text: `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}` }),
      h("span", { class: "k", text: key }), " ", text));
    while (list.children.length > 40) list.lastChild.remove();
    if (!box.offsetParent) toast(`${key} ${text}`);
  };
}

// Ported course schedule: same day-of-month layout as the original October demo, now in the current month.
const COURSE = [
  [1, "09:30", "12:00", "AI 工具入門（台北）", "onsite"],
  [3, "13:30", "16:30", "Python 資料分析（台北）", "onsite"],
  [5, "19:00", "21:00", "生成式 AI 簡報實作（線上）", "online"],
  [7, "14:00", "17:00", "企業內訓：ChatGPT 辦公應用（台中）", "corp"],
  [9, null, 3, "連假（停課）", "holiday"],
  [13, "09:00", "12:00", "樂齡數位課（高雄）", "onsite"],
  [14, "19:00", "21:00", "AI 繪圖直播（線上）", "online"],
  [16, "10:00", "16:00", "自動化流程工作坊（新竹）", "corp"],
  [19, "19:00", "21:00", "Excel 自動化（線上）", "online"],
  [20, "13:00", "15:00", "課程企劃會議", "admin"],
  [21, null, 1, "期中作業繳交", "admin"],
  [22, "09:30", "16:30", "教師研習（台南）", "onsite"],
  [23, "10:00", "12:00", "企業內訓：AI 客服（桃園）", "corp"],
  [24, "14:00", "17:00", "提示工程讀書會（線上）", "online"],
  [26, null, 3, "課程影片剪輯", "admin"],
  [28, "19:00", "21:00", "學員線上 Q&A", "online"],
  [30, "10:00", "12:00", "月底結案報告", "admin"],
];
function courseEvents() {
  const t = today();
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  const day = (n) => new Date(t.getFullYear(), t.getMonth(), Math.min(n, last));
  const out = COURSE.map(([d, s, e, title, kind]) => {
    const base = day(d);
    return s
      ? { title, start: at(base, s), end: at(base, e), color: COLORS[kind] }
      : { title, start: ymd(base), end: ymd(addDays(base, e)), allDay: true, color: COLORS[kind] };
  });
  out.push({ title: "今天：備課與教材整理", start: at(t, "15:00"), end: at(t, "17:00"), color: COLORS.admin });
  return out;
}

// Taiwan fixed-date holidays (lunar holidays are omitted on purpose).
const HOLIDAYS = [["01-01", "元旦"], ["02-28", "和平紀念日"], ["04-04", "兒童節"], ["05-01", "勞動節"], ["10-10", "國慶日"], ["12-25", "行憲紀念日"]];

// Weekly generator used by the event-source function: deterministic per day and per seed.
function rangeEvents(start, end, seed) {
  const out = [];
  for (let d = new Date(start); d < end; d = addDays(d, 1)) {
    const r = rng((d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate()) * 7 + seed * 977);
    const dow = d.getDay();
    const n = dow === 0 || dow === 6 ? Math.floor(r() * 2) : 1 + Math.floor(r() * 3);
    for (let k = 0; k < n; k++) {
      const s = new Date(d);
      s.setHours(8 + Math.floor(r() * 11), r() < 0.5 ? 0 : 30, 0, 0);
      out.push({ id: `${ymd(d)}-${k}`, title: pick(r, TITLES), start: s, end: new Date(+s + (1 + Math.floor(r() * 3)) * 36e5), color: COLORS[pick(r, KINDS)] });
    }
  }
  return out;
}

const PALETTES = [
  { primary: "#1f8fb8", over: "#2aa3cf", fg: "#ffffff", event: "#3b82f6", bg: "#8b5cf6" },
  { primary: "#fbbf24", over: "#fcd34d", fg: "#451a03", event: "#d97706", bg: "#eab308" },
  { primary: "#059669", over: "#10b981", fg: "#ffffff", event: "#22c55e", bg: "#34d399" },
  { primary: "#e11d48", over: "#f43f5e", fg: "#ffffff", event: "#ec4899", bg: "#f97316" },
];

Showcase.run({ scenes: [
  {
    id: "course", title: "課程行事曆", paper: true,
    api: "new FullCalendar.Calendar(el, { editable, dateClick, eventDrop, eventResize, eventClick })・calendar.addEvent()",
    desc: "原本的課程行事曆搬到本月：依課程類型上色，日期以今天為基準產生。點空白日期新增課程，拖曳改期、拖曳底緣調整時長，點課程看時間；右上角切換月、週、清單三種檢視。",
    hint: "拖曳課程改期・點日期新增・右上切換月／週／清單",
    mount(ctx) {
      ctx.html(`<div class="fcx-wrap"><div class="fcx-cal"></div></div>`);
      const toast = toaster(ctx);
      let added = 0;
      const cal = calendar(ctx, ctx.$(".fcx-cal"), {
        initialView: "dayGridMonth",
        editable: true,
        events: courseEvents(),
        dateClick(info) {
          added += 1;
          const event = cal.addEvent({
            id: `new-${added}`, title: `新增課程 ${added}`,
            start: info.date,
            end: info.allDay ? undefined : new Date(info.date.getTime() + 90 * 60000),
            allDay: info.allDay, color: COLORS.added, contrastColor: "#1c1c1a",
          });
          toast(`已新增「${event.title}」：${when(event)}`);
        },
        eventDrop: (info) => toast(`已將「${info.event.title}」移到 ${when(info.event)}`),
        eventResize: (info) => toast(`「${info.event.title}」改為 ${span(info.event)}`),
        eventClick: (info) => toast(`${info.event.title}：${when(info.event)}`),
      }, (wide) => ({
        headerToolbar: wide
          ? { start: "title", end: "dayGridMonth,timeGridWeek,listMonth today prev,next" }
          : { start: "title", end: "dayGridMonth,timeGridWeek,listMonth" },
      }));
    },
  },
  {
    id: "views", title: "五種檢視", paper: true,
    api: "dayGridMonth・timeGridWeek・timeGridDay・listWeek・multiMonthYear・firstDay・weekends・weekNumbers・navLinks",
    desc: "同一份事件資料在月格、週時間軸、單日、清單與全年五種檢視間切換，切換只換版型不重抓資料。下方開關調整每週起始日、是否顯示週末與週次；點日期數字（navLinks）會跳到該日檢視。",
    hint: "用行事曆上方的按鈕切換檢視，點日期數字跳到單日",
    mount(ctx) {
      ctx.html(`<div class="fcx-wrap"><div class="fcx-cal"></div></div>`);
      const toast = toaster(ctx);
      const t = today();
      let first = true;
      const cal = calendar(ctx, ctx.$(".fcx-cal"), {
        initialView: "dayGridMonth",
        firstDay: 1,
        navLinks: true,
        events: randomEvents(150, addDays(t, -120), 300, 11),
        views: { multiMonthYear: { multiMonthMaxColumns: 4 } },
        datesSet: (info) => {
          if (first) { first = false; return; }
          toast(`${info.view.type}：${mdFmt.format(info.start)} 至 ${mdFmt.format(addDays(info.end, -1))}`);
        },
      }, (wide) => wide
        ? {
          headerToolbar: { start: "prev,next today", center: "title", end: "dayGridMonth,timeGridWeek,timeGridDay,listWeek,multiMonthYear" },
          footerToolbar: false,
        }
        : {
          headerToolbar: { start: "title", end: "prev,next" },
          footerToolbar: { center: "dayGridMonth,timeGridWeek,timeGridDay,listWeek,multiMonthYear" },
        });
      ctx.select("每週起始", [{ value: "1", label: "週一" }, { value: "0", label: "週日" }, { value: "6", label: "週六" }], "1",
        (v) => cal.setOption("firstDay", Number(v)));
      ctx.toggle("週末", true, (v) => cal.setOption("weekends", v));
      ctx.toggle("週次", false, (v) => cal.setOption("weekNumbers", v));
    },
  },
  {
    id: "edit", title: "拖曳與框選", paper: true,
    api: "selectable・selectMirror・select()・eventDrop / eventResize（oldEvent）・selectConstraint・eventOverlap・selectAllow / eventAllow",
    desc: "在週時間軸上按住拖曳框出時段就建立會議；事件可拖曳改期、上下緣都能調整長度（eventResizableFromStart），每 15 分鐘對齊。開關示範三種限制：只能排在營業時間、不可重疊、週末鎖定；點事件會刪除它。",
    hint: "在空白時段拖曳框選建立會議，點事件刪除",
    mount(ctx) {
      ctx.html(`<div class="fcx-wrap"><div class="fcx-cal"></div></div>`);
      const toast = toaster(ctx);
      const log = logger(ctx, ctx.$(".fcx-wrap"), "變更紀錄", toast);
      const mon = mondayOf(today());
      const meet = (d, s, e, title, kind) => ({ title, start: at(addDays(mon, d), s), end: at(addDays(mon, d), e), color: COLORS[kind] });
      let lockWeekend = false, made = 0;
      const weekendIn = (s, e) => {
        for (let d = new Date(s); d < e; d = new Date(+d + DAY)) if (d.getDay() === 0 || d.getDay() === 6) return true;
        return false;
      };
      const cal = calendar(ctx, ctx.$(".fcx-cal"), {
        initialView: "timeGridWeek",
        firstDay: 1,
        editable: true,
        selectable: true,
        selectMirror: true,
        eventResizableFromStart: true,
        snapDuration: "00:15",
        businessHours: { daysOfWeek: [1, 2, 3, 4, 5], startTime: "09:00", endTime: "18:00" },
        events: [
          meet(0, "10:00", "11:00", "產品週會", "onsite"),
          meet(1, "14:00", "15:30", "設計審查", "online"),
          meet(2, "15:00", "16:00", "客戶簡報", "corp"),
          meet(3, "11:00", "11:30", "一對一", "admin"),
          meet(4, "16:00", "17:00", "Sprint 回顧", "onsite"),
        ],
        selectAllow: (span) => !lockWeekend || !weekendIn(span.start, span.end),
        eventAllow: (span) => !lockWeekend || !weekendIn(span.start, span.end),
        select(info) {
          made += 1;
          const ev = cal.addEvent({ title: `新會議 ${made}`, start: info.start, end: info.end, allDay: info.allDay, color: COLORS.added, contrastColor: "#1c1c1a" });
          cal.unselect();
          log("框選", `${ev.title}：${when(ev)}，${span(ev)}`);
        },
        eventDrop: (info) => log("移動", `${info.event.title}：${when(info.oldEvent)} → ${when(info.event)}`),
        eventResize: (info) => log("長度", `${info.event.title}：${span(info.oldEvent)} → ${span(info.event)}`),
        eventClick(info) {
          info.event.remove();
          log("刪除", info.event.title);
        },
      }, (wide) => ({
        headerToolbar: wide ? { start: "title", end: "today prev,next" } : { start: "title", end: "prev,next" },
      }));
      ctx.toggle("限營業時間", false, (v) => {
        cal.setOption("selectConstraint", v ? "businessHours" : null);
        cal.setOption("eventConstraint", v ? "businessHours" : null);
        toast(v ? "只能排在週一到週五 9:00 至 18:00" : "已解除時段限制");
      });
      ctx.toggle("可重疊", true, (v) => {
        cal.setOption("eventOverlap", v);
        cal.setOption("selectOverlap", v);
        toast(v ? "允許時段重疊" : "重疊的拖放會被退回原位");
      });
      ctx.toggle("鎖週末", false, (v) => { lockWeekend = v; toast(v ? "週末不可框選或放入事件" : "週末已解鎖"); });
    },
  },
  {
    id: "recur", title: "重複與背景事件", paper: true,
    api: "daysOfWeek / startTime / startRecur・rrule 外掛（RRULE、exdate）・display: 'background'・businessHours・nowIndicator",
    desc: "晨會用 daysOfWeek 每週一三五重複；瑜珈課加上 startRecur / endRecur 限定期間；讀書會用 rrule 外掛設定隔週週六並以 exdate 排除一次，月例會是 RRULE 字串「每月第二個週二」。灰色午休、紅色維護與員工旅遊是背景事件，淺色區塊外是非營業時間，紅線是現在時刻。",
    hint: "切換週／月看重複規則，開關營業時間與背景事件",
    mount(ctx) {
      ctx.html(`<div class="fcx-wrap"><div class="fcx-cal"></div></div>`);
      const mon = mondayOf(today());
      const first = new Date(mon.getFullYear(), mon.getMonth() - 3, 1);
      const compact = (d) => ymd(d).replaceAll("-", "");
      const BH = [
        { daysOfWeek: [1, 2, 3, 4, 5], startTime: "09:00", endTime: "18:00" },
        { daysOfWeek: [6], startTime: "10:00", endTime: "14:00" },
      ];
      const recurring = [
        { title: "晨會", daysOfWeek: [1, 3, 5], startTime: "09:00", endTime: "09:30", color: COLORS.admin },
        { title: "瑜珈課", daysOfWeek: [2, 4], startTime: "18:30", endTime: "20:00",
          startRecur: ymd(addDays(mon, -14)), endRecur: ymd(addDays(mon, 42)), color: COLORS.online },
        { title: "隔週讀書會", rrule: { freq: "weekly", interval: 2, byweekday: ["sa"], dtstart: `${ymd(addDays(mon, 5 - 28))}T10:30:00` },
          duration: "02:00", exdate: [`${ymd(addDays(mon, 5 + 28))}T10:30:00`], color: COLORS.onsite },
        { title: "月例會", rrule: `DTSTART:${compact(first)}T140000\nRRULE:FREQ=MONTHLY;BYDAY=+2TU`, duration: "01:30", color: COLORS.corp },
      ];
      const background = {
        id: "bg",
        events: [
          { groupId: "lunch", daysOfWeek: [1, 2, 3, 4, 5], startTime: "12:00", endTime: "13:00", display: "background", color: "#8a8577" },
          { title: "系統維護", start: at(addDays(mon, 3), "18:00"), end: at(addDays(mon, 3), "22:00"), display: "background", color: COLORS.holiday },
          { title: "員工旅遊", start: ymd(addDays(mon, 11)), end: ymd(addDays(mon, 13)), allDay: true, display: "background", color: COLORS.added },
        ],
      };
      const VIEWS = ["timeGridWeek", "dayGridMonth"];
      const cal = calendar(ctx, ctx.$(".fcx-cal"), {
        initialView: VIEWS[0],
        firstDay: 1,
        businessHours: BH,
        eventSources: [recurring, background],
      }, (wide) => ({
        headerToolbar: wide ? { start: "title", end: "today prev,next" } : { start: "title", end: "prev,next" },
      }));
      ctx.group(["週", "月"], 0, (i) => cal.changeView(VIEWS[i]));
      ctx.toggle("營業時間", true, (v) => cal.setOption("businessHours", v ? BH : false));
      ctx.toggle("背景事件", true, (v) => {
        const src = cal.getEventSourceById("bg");
        if (v && !src) cal.addEventSource(background);
        if (!v && src) src.remove();
      });
    },
  },
  {
    id: "render", title: "自訂事件外觀", paper: true,
    api: "eventContent（domNodes）・eventClass・eventDidMount・dayHeaderContent・dayCellTopContent・dayCellClass・event.setExtendedProp()",
    desc: "eventContent 用自己的 DOM 取代預設事件內容：課名、講師與報名人數進度條，短事件與月檢視自動改成單行。eventClass 為滿班課程加上斜紋，週檢視的日期標頭與月檢視的日期格顯示當天報名總數。按「隨機報名」用 setExtendedProp 改資料，畫面只重繪受影響的部分。",
    hint: "按「隨機報名」看進度條與每日總數更新",
    mount(ctx) {
      ctx.html(`<div class="fcx-wrap"><div class="fcx-cal"></div></div>`);
      const toast = toaster(ctx);
      const mon = mondayOf(today());
      const r = rng(7);
      const TEACH = [["AI 工具入門", "王老師"], ["Python 資料分析", "林老師"], ["簡報實作", "陳老師"], ["Excel 自動化", "黃老師"], ["樂齡數位課", "張老師"], ["提示工程讀書會", "李老師"]];
      const data = [];
      for (let d = -7; d < 28; d++) {
        const day = addDays(mon, d);
        const dow = day.getDay();
        const n = dow === 0 ? 0 : dow === 6 ? 1 : 1 + Math.floor(r() * 2);
        for (let k = 0; k < n; k++) {
          const [title, teacher] = pick(r, TEACH);
          const cap = pick(r, [12, 20, 24, 30]);
          const s = new Date(day);
          s.setHours(k ? 14 + Math.floor(r() * 3) : 9 + Math.floor(r() * 2), 0, 0, 0);
          data.push({ id: `c${d}-${k}`, title, start: s, end: new Date(+s + (2 + Math.floor(r() * 2)) * 36e5), color: COLORS[pick(r, KINDS)],
            extendedProps: { teacher, cap, seats: Math.min(cap, Math.round(cap * (0.3 + r() * 0.85))) } });
        }
      }
      const sums = (list) => {
        const m = new Map();
        for (const e of list) m.set(ymd(e.start), (m.get(ymd(e.start)) || 0) + e.extendedProps.seats);
        return m;
      };
      // New generator functions on every data change so the memoized header and cell content re-render.
      const headerContent = (m) => (arg) => arg.view.type.startsWith("timeGrid")
        ? { html: `<div class="fcx-dh"><span>${arg.weekdayText} ${arg.dayNumberText}</span><small>${m.get(ymd(arg.date)) || 0} 人</small></div>` }
        : arg.text;
      const cellContent = (m) => (arg) => {
        const n = m.get(ymd(arg.date));
        return { html: `${arg.dayNumberText}${n ? `<span class="fcx-badge">${n}</span>` : ""}` };
      };
      const fullClass = (arg) => arg.event.extendedProps.seats >= arg.event.extendedProps.cap ? "fcx-full" : "";
      const VIEWS = ["timeGridWeek", "dayGridMonth", "listWeek"];
      const initial = sums(data);
      const cal = calendar(ctx, ctx.$(".fcx-cal"), {
        initialView: VIEWS[0],
        firstDay: 1,
        events: data,
        eventClass: fullClass,
        dayCellClass: (arg) => arg.dow === 0 || arg.dow === 6 ? "fcx-weekend" : "",
        dayHeaderContent: headerContent(initial),
        dayCellTopContent: cellContent(initial),
        eventContent(arg) {
          const p = arg.event.extendedProps;
          if (p.cap == null) return true;
          const compact = arg.isShort || arg.view.type === "dayGridMonth" || arg.view.type.startsWith("list");
          const num = h("span", { class: "num", text: `${p.seats}/${p.cap}` });
          if (compact) return { domNodes: [h("div", { class: "fcx-ev compact" }, h("b", { text: arg.event.title }), num)] };
          const bar = h("div", { class: "seat" }, h("i", { style: `width:${Math.round((p.seats / p.cap) * 100)}%` }));
          return { domNodes: [h("div", { class: "fcx-ev" },
            h("b", { text: arg.event.title }),
            h("span", { class: "who", text: `${arg.timeText}・${p.teacher}` }),
            bar, num)] };
        },
        eventDidMount(info) {
          const p = info.event.extendedProps;
          info.el.title = `${info.event.title}（${p.teacher}）報名 ${p.seats}／${p.cap}`;
        },
      }, (wide) => ({
        headerToolbar: wide ? { start: "title", end: "today prev,next" } : { start: "title", end: "prev,next" },
      }));
      ctx.group(["週", "月", "清單"], 0, (i) => cal.changeView(VIEWS[i]));
      ctx.button("隨機報名", () => {
        const open = cal.getEvents().filter((e) => e.extendedProps.seats < e.extendedProps.cap);
        if (!open.length) { toast("所有課程都已額滿"); return; }
        const names = [];
        for (let i = 0; i < 4 && open.length; i++) {
          const e = open.splice(Math.floor(Math.random() * open.length), 1)[0];
          const add = 1 + Math.floor(Math.random() * 6);
          e.setExtendedProp("seats", Math.min(e.extendedProps.cap, e.extendedProps.seats + add));
          names.push(`${e.title} +${add}`);
        }
        const m = sums(cal.getEvents());
        cal.setOption("dayHeaderContent", headerContent(m));
        cal.setOption("dayCellTopContent", cellContent(m));
        toast(names.join("、"));
      }, { primary: true });
      ctx.toggle("滿班斜紋", true, (v) => cal.setOption("eventClass", v ? fullClass : null));
    },
  },
  {
    id: "source", title: "動態事件來源", paper: true,
    api: "eventSources: [{ events(info, success) }, { events: (info) => Promise }]・loading・datesSet・refetchEvents()・getEventSourceById().remove()",
    desc: "事件不是事先寫好的陣列，而是兩個函式來源：課程來源用 callback，依可見範圍（info.start 至 info.end）即時產生；假日來源回傳 Promise。翻頁才會呼叫來源函式，切換到已載入範圍內的檢視會直接用快取（lazyFetching）。右側紀錄每次呼叫與產生筆數，模擬 350 ms 網路延遲時右下角顯示載入中。",
    hint: "翻頁或切換檢視，看右側紀錄何時呼叫來源函式",
    mount(ctx) {
      ctx.html(`<div class="fcx-wrap"><div class="fcx-cal"></div></div><div class="fcx-busy">載入中…</div>`);
      const toast = toaster(ctx);
      const log = logger(ctx, ctx.$(".fcx-wrap"), "來源呼叫紀錄", toast);
      const busy = ctx.$(".fcx-busy");
      const LATENCY = 350;
      let seed = 1, calls = 0;
      const range = (s, e) => `${mdFmt.format(s)} 至 ${mdFmt.format(addDays(e, -1))}`;
      const course = {
        id: "course",
        events(info, success) {
          const n = ++calls;
          const list = rangeEvents(info.start, info.end, seed);
          setTimeout(() => {
            success(list);
            log(`課程 #${n}`, `${range(info.start, info.end)}，產生 ${list.length} 筆`);
          }, LATENCY);
        },
      };
      const holiday = {
        id: "holiday", color: COLORS.holiday,
        events(info) {
          const n = ++calls;
          const lo = ymd(info.start), hi = ymd(info.end);
          const out = [];
          for (let y = info.start.getFullYear(); y <= info.end.getFullYear(); y++) {
            for (const [md, title] of HOLIDAYS) {
              const d = `${y}-${md}`;
              if (d >= lo && d < hi) out.push({ title, start: d, allDay: true });
            }
          }
          return new Promise((resolve) => setTimeout(() => {
            resolve(out);
            log(`假日 #${n}`, `${range(info.start, info.end)}，${out.length} 筆`);
          }, LATENCY));
        },
      };
      const cal = calendar(ctx, ctx.$(".fcx-cal"), {
        initialView: "dayGridMonth",
        firstDay: 1,
        eventSources: [course, holiday],
        loading: (on) => busy.classList.toggle("on", on),
        datesSet: (info) => log("檢視", `${info.view.type}：${range(info.start, info.end)}`),
      }, (wide) => ({
        headerToolbar: wide
          ? { start: "title", end: "dayGridMonth,timeGridWeek,listWeek prev,next" }
          : { start: "title", end: "dayGridMonth,listWeek prev,next" },
      }));
      const flip = (src, v) => {
        const cur = cal.getEventSourceById(src.id);
        if (v && !cur) cal.addEventSource(src);
        if (!v && cur) { cur.remove(); log("移除", src.id === "course" ? "課程來源" : "假日來源"); }
      };
      ctx.toggle("課程", true, (v) => flip(course, v));
      ctx.toggle("假日", true, (v) => flip(holiday, v));
      ctx.button("重新產生", () => { seed++; log("refetch", `種子 ${seed}`); cal.refetchEvents(); }, { primary: true });
    },
  },
  {
    id: "theme", title: "主題與語系", paper: true,
    api: "Breezy 主題 CSS 變數（--fc-breezy-*）・colorScheme: 'dark'・locale（zh-tw / en / ja / ar）・direction: 'rtl'・weekNumbers",
    desc: "同一個行事曆換外觀與語言。色票改寫 Breezy 主題的 CSS 變數（主色、事件色、背景事件色），深色模式用 colorScheme 讓主題切到暗色調。語系切換會連帶改月份與星期名稱、按鈕文字、每週起始日與週次規則；阿拉伯文語系會把整個版面翻成由右至左。",
    hint: "切換色票、深色與語系",
    async mount(ctx) {
      ctx.html(`<div class="fcx-wrap"><div class="fcx-cal"></div></div>`);
      await ctx.load([`${FC}/locales/ja/global.js`, `${FC}/locales/ar/global.js`]);
      const el = ctx.$(".fcx-cal");
      const t = today();
      const first = new Date(t.getFullYear(), t.getMonth(), 1);
      const events = randomEvents(36, addDays(first, -7), 49, 23).map(({ color, ...e }) => e);
      events.push({ title: "背景：期中週", start: ymd(addDays(t, 2)), end: ymd(addDays(t, 6)), allDay: true, display: "background" });
      const cal = calendar(ctx, el, {
        initialView: "dayGridMonth",
        weekNumbers: true,
        navLinks: true,
        buttons: {},
        events,
      }, (wide) => ({
        headerToolbar: wide
          ? { start: "prev,next today", center: "title", end: "dayGridMonth,timeGridWeek,listWeek" }
          : { start: "title", end: "prev,next" },
      }));
      const setPalette = (p) => {
        el.style.setProperty("--fc-breezy-primary", p.primary);
        el.style.setProperty("--fc-breezy-primary-over", p.over);
        el.style.setProperty("--fc-breezy-primary-foreground", p.fg);
        el.style.setProperty("--fc-breezy-event", p.event);
        el.style.setProperty("--fc-breezy-background-event", p.bg);
      };
      setPalette(PALETTES[0]);
      ctx.group(["湖水", "琥珀", "翡翠", "玫瑰"], 0, (i) => setPalette(PALETTES[i]));
      ctx.toggle("深色", false, (v) => cal.setOption("colorScheme", v ? "dark" : "light"));
      ctx.select("語系", [
        { value: "zh-tw", label: "繁體中文" }, { value: "en", label: "English" },
        { value: "ja", label: "日本語" }, { value: "ar", label: "العربية（RTL）" },
      ], "zh-tw", (v) => cal.setOption("locale", v));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "calendar.addEventSource(array)・dayMaxEvents・eventMaxStack・eventDidMount",
    desc: "每一級先清空，再用 addEventSource 一次加入 N 筆事件（分散在目前檢視的日期範圍內），計時從加入到畫面完成兩個畫格為止。可切換要測的檢視，以及是否收合放不下的事件（+N 更多）。",
    hint: "選檢視與收合設定，按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="fcx-stress"><div class="fcx-cal"></div></div>`);
      const VIEWS = ["dayGridMonth", "timeGridWeek", "listWeek"];
      let mounted = 0;
      const t = today();
      const cal = calendar(ctx, ctx.$(".fcx-cal"), {
        initialView: VIEWS[0],
        headerToolbar: { start: "title", end: "" },
        dayMaxEvents: true,
        eventMaxStack: 3,
        events: randomEvents(160, addDays(t, -t.getDate() - 6), 49, 5),
        eventDidMount: () => { mounted++; },
      });
      ctx.controls.classList.add("bottom");
      ctx.group(["月", "週", "清單"], 0, (i) => cal.changeView(VIEWS[i]));
      ctx.toggle("收合 +N", true, (v) => {
        cal.setOption("dayMaxEvents", v);
        cal.setOption("eventMaxStack", v ? 3 : null);
      });
      ctx.bench({
        label: "事件數", unit: "筆",
        sizes: [100, 300, 1000, 3000, 10000, 30000],
        budget: 2000, target: 1000,
        async prepare(n) {
          cal.removeAllEventSources();
          cal.removeAllEvents();
          await ctx.frame(1);
          const v = cal.view;
          return randomEvents(n, v.activeStart, Math.max(1, Math.round((v.activeEnd - v.activeStart) / DAY)), n);
        },
        async run(n, data) {
          mounted = 0;
          cal.addEventSource(data);
          ctx.el.getBoundingClientRect();
          await ctx.frame(2);
          return `掛載 ${fmt(mounted)} 個元素`;
        },
        note: "計時包含解析事件、依日期切段與排版、Preact 產生 DOM，以及之後兩個畫格的尺寸調整（約 30 ms 底噪）。開啟「收合 +N」時月檢視每格只畫放得下的事件、週檢視最多疊 3 層，DOM 數量幾乎不隨事件數增加；關閉後每筆事件都要一個元素，清單檢視本來就不收合，最吃 DOM。",
      });
    },
  },
] });
</script>
</body>
