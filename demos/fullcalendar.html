<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FullCalendar 示範：十月課程行事曆</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/skeleton.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/breezy/theme.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/breezy/palettes/indigo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  :root {
    --fc-breezy-primary: #1f8fb8;
    --fc-breezy-primary-over: #2aa3cf;
    --fc-breezy-background: #fffefb;
  }
  /* FullCalendar writes height:100% on its root, so size a wrapper instead. */
  #wrap { position: fixed; inset: 10px 10px 44px; }
  #cal {
    height: 100%;
    background: #fffefb; border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px 12px; box-shadow: 0 6px 22px rgba(40, 30, 10, .08);
    font-family: var(--font);
  }
  .hint { transition: color .2s, border-color .2s; }
  .hint.on { color: var(--fg); border-color: var(--c2); }
  @media (max-width: 520px) {
    #wrap { inset: 6px 6px 42px; }
    #cal { padding: 6px 6px 8px; font-size: 12px; }
  }
</style>
</head>
<body class="paper">
<div id="wrap"><div id="cal"></div></div>
<div class="hint">拖曳課程改期・點日期新增・切換月／週／清單</div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/all/global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/themes/breezy/global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@7.1.0/locales/zh-tw/global.js"></script>
<script>
// Category colours follow the paper palette in demo.css.
const COLORS = {
  onsite: "#1f8fb8", online: "#6a5ae0", corp: "#e06a1b",
  admin: "#2f9e55", holiday: "#d61f69", added: "#d4a900",
};
const ev = (title, start, end, kind, extra = {}) => ({ title, start, end, color: COLORS[kind], ...extra });

// October 2026 course schedule (sample data). 10/10 falls on a Saturday, so 10/9 is the make-up holiday.
const EVENTS = [
  ev("AI 工具入門（台北）", "2026-10-01T09:30", "2026-10-01T12:00", "onsite"),
  ev("Python 資料分析（台北）", "2026-10-03T13:30", "2026-10-03T16:30", "onsite"),
  ev("生成式 AI 簡報實作（線上）", "2026-10-05T19:00", "2026-10-05T21:00", "online"),
  ev("企業內訓：ChatGPT 辦公應用（台中）", "2026-10-07T14:00", "2026-10-07T17:00", "corp"),
  ev("國慶連假", "2026-10-09", "2026-10-12", "holiday", { allDay: true }),
  ev("樂齡數位課（高雄）", "2026-10-13T09:00", "2026-10-13T12:00", "onsite"),
  ev("AI 繪圖直播（線上）", "2026-10-14T19:00", "2026-10-14T21:00", "online"),
  ev("自動化流程工作坊（新竹）", "2026-10-16T10:00", "2026-10-16T16:00", "corp"),
  ev("Excel 自動化（線上）", "2026-10-19T19:00", "2026-10-19T21:00", "online"),
  ev("課程企劃會議", "2026-10-20T13:00", "2026-10-20T15:00", "admin"),
  ev("期中作業繳交", "2026-10-21", "2026-10-22", "admin", { allDay: true }),
  ev("教師研習（台南）", "2026-10-22T09:30", "2026-10-22T16:30", "onsite"),
  ev("企業內訓：AI 客服（桃園）", "2026-10-23T10:00", "2026-10-23T12:00", "corp"),
  ev("提示工程讀書會（線上）", "2026-10-24T14:00", "2026-10-24T17:00", "online"),
  ev("課程影片剪輯", "2026-10-26", "2026-10-29", "admin", { allDay: true }),
  ev("學員線上 Q&A", "2026-10-28T19:00", "2026-10-28T21:00", "online"),
  ev("月底結案報告", "2026-10-30T10:00", "2026-10-30T12:00", "admin"),
];

// Short status messages reuse the hint chip, then fall back to the instructions.
const hint = document.querySelector(".hint");
const HINT_TEXT = hint.textContent;
let hintTimer;
function flash(msg) {
  hint.textContent = msg;
  hint.classList.add("on");
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hint.textContent = HINT_TEXT; hint.classList.remove("on"); }, 2800);
}
const dayFmt = new Intl.DateTimeFormat("zh-TW", { month: "numeric", day: "numeric", weekday: "short" });
const timeFmt = new Intl.DateTimeFormat("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
const when = (event) => event.allDay ? dayFmt.format(event.start) : `${dayFmt.format(event.start)} ${timeFmt.format(event.start)}`;

const narrow = () => innerWidth < 520;
const toolbar = () => narrow()
  ? { start: "title", end: "dayGridMonth,timeGridWeek,listMonth" }
  : { start: "title", end: "dayGridMonth,timeGridWeek,listMonth prev,next" };

let added = 0;
const calendar = new FullCalendar.Calendar(document.getElementById("cal"), {
  locale: "zh-tw",
  // Mid-October so the week view opens on a busy week.
  initialDate: "2026-10-19",
  initialView: "dayGridMonth",
  height: "100%",
  headerToolbar: toolbar(),
  buttons: {
    dayGridMonth: { text: "月" },
    timeGridWeek: { text: "週" },
    listMonth: { text: "清單" },
  },
  editable: true,
  eventDisplay: "block",
  dayMaxEvents: true,
  fixedWeekCount: false,
  nowIndicator: true,
  slotMinTime: "08:00",
  slotMaxTime: "22:00",
  scrollTime: "09:00",
  eventTimeFormat: { hour: "2-digit", minute: "2-digit", hour12: false },
  slotHeaderFormat: { hour: "2-digit", minute: "2-digit", hour12: false },
  listDayFormat: { month: "long", day: "numeric" },
  listDayAltFormat: { weekday: "short" },
  events: EVENTS,
  dateClick(info) {
    added += 1;
    const start = info.date;
    const event = calendar.addEvent({
      id: `new-${added}`,
      title: `新增課程 ${added}`,
      start,
      end: info.allDay ? undefined : new Date(start.getTime() + 90 * 60 * 1000),
      allDay: info.allDay,
      color: COLORS.added,
      contrastColor: "#1c1c1a",
    });
    flash(`已新增「${event.title}」：${when(event)}`);
  },
  eventDrop(info) {
    flash(`已將「${info.event.title}」移到 ${when(info.event)}`);
  },
  eventResize(info) {
    flash(`已調整「${info.event.title}」的時間長度`);
  },
  eventClick(info) {
    flash(`${info.event.title}：${when(info.event)}`);
  },
});
calendar.render();

let rz;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => calendar.setOption("headerToolbar", toolbar()), 120);
});
</script>
</body>
</html>
