<style>

<body class="paper">
<script src="https://cdn.jsdelivr.net/npm/function-plot@1.25.4/dist/function-plot.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// function-plot showcase: eight scenes from tangent tracking to a redraw stress ramp.
const fp = window.functionPlot.default || window.functionPlot;
// the UMD build only exposes functionPlot(); take the Chart class from a throwaway instance
const FPChart = (() => {
  const c = fp({ target: document.createElement("div"), data: [] });
  c.removeAllListeners();
  for (const k of Object.keys(c.constructor.cache)) if (c.constructor.cache[k] === c) delete c.constructor.cache[k];
  return c.constructor;
})();
const COL = { f: "#1f8fb8", d: "#e06a1b", t: "#d61f69", g: "#2f9e55", p: "#6a5ae0", ink: "#3a3833", y: "#d4a900" };
const TAU = Math.PI * 2;
const fmt = (v, d = 3) => (Number.isFinite(v) ? (Math.abs(v) < 5e-13 ? 0 : v).toFixed(d) : "未定義");
// evaluate an expression with function-plot's own built-in evaluator
const evalAt = (fn, x) => fp.$eval.builtIn({ fn }, "fn", { x });
const TIP = { xLine: true, yLine: true, renderer: (x, y) => `(${x.toFixed(2)}, ${y.toFixed(2)})` };
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹", SUB = "₀₁₂₃₄₅₆₇₈₉";
const sup = (n) => String(n).replace(/\d/g, (c) => SUP[c]);
const sub = (n) => String(n).replace(/\d/g, (c) => SUB[c]);
const fact = (n) => { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; };

// detach a chart: drop its listeners and the static instance cache entry
function drop(chart) {
  if (!chart) return;
  chart.removeAllListeners();
  const cache = FPChart && FPChart.cache;
  if (cache) for (const k of Object.keys(cache)) if (cache[k] === chart) delete cache[k];
}

// x domain that keeps 1:1 aspect for the given y domain (function-plot margins: 40/20/20/20)
function eqX(y, w, h, cx = 0) {
  const r = ((y[1] - y[0]) * Math.max(1, w - 60)) / Math.max(1, h - 40) / 2;
  return [cx - r, cx + r];
}

// Mount a chart into el; build(w, h) returns options. Rebuilt (view reset) whenever el resizes.
function mkPlot(ctx, el, build, after) {
  const p = { chart: null };
  let lw = 0, lh = 0, pending = 0;
  p.render = (keepView = true) => {
    const w = el.clientWidth, h = el.clientHeight;
    if (w < 60 || h < 60) return null;
    lw = w; lh = h;
    const view = keepView && p.chart ? { x: p.chart.meta.xScale.domain(), y: p.chart.meta.yScale.domain() } : null;
    const o = build(w, h);
    if (view) { o.xAxis = { ...(o.xAxis || {}), domain: view.x }; o.yAxis = { ...(o.yAxis || {}), domain: view.y }; }
    drop(p.chart);
    el.innerHTML = "";
    // construct first so listeners (eval, before:draw, tip:update) see the initial build
    p.chart = new FPChart({ target: el, width: w, height: h, grid: true, ...o, data: o.data || [] });
    if (after) after(p.chart);
    p.chart.build();
    return p.chart;
  };
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      if (el.clientWidth !== lw || el.clientHeight !== lh) p.render(false);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); drop(p.chart); });
  return p;
}

const card = (extra = "") => `<div class="fp-card"><div class="fp-plot"></div>${extra}</div>`;

// ---------- scene data ----------
const TANGENT_EX = ["x^3/6 - x", "sin(2*x) + x/2", "exp(-x^2/2)*3", "x*cos(x)", "sqrt(abs(x))*2 - 2"];

const TAYLOR = [
  { name: "sin x", fn: "sin(x)", at: Math.PI, atS: "π", f: Math.sin, c: (k) => (k % 2 ? (((k - 1) / 2) % 2 ? -1 : 1) / fact(k) : 0), den: (k) => `${k}!`, dom: { x: [-9, 9], y: [-3, 3] } },
  { name: "cos x", fn: "cos(x)", at: Math.PI, atS: "π", f: Math.cos, c: (k) => (k % 2 ? 0 : ((k / 2) % 2 ? -1 : 1) / fact(k)), den: (k) => `${k}!`, dom: { x: [-9, 9], y: [-3, 3] } },
  { name: "eˣ", fn: "exp(x)", at: 2, atS: "2", f: Math.exp, c: (k) => 1 / fact(k), den: (k) => `${k}!`, dom: { x: [-5, 4], y: [-2, 12] } },
  { name: "ln(1+x)", fn: "log(1 + x)", at: 0.9, atS: "0.9", f: (x) => Math.log(1 + x), c: (k) => (k === 0 ? 0 : (k % 2 ? 1 : -1) / k), den: (k) => `${k}`, dom: { x: [-1.8, 2.6], y: [-3, 2.2] } },
];
// polynomial string for function-plot and a readable version
function taylorFn(t, n) {
  let s = "";
  for (let k = 0; k <= n; k++) {
    const c = t.c(k);
    if (!c) continue;
    const term = k === 0 ? `${Math.abs(c)}` : `${Math.abs(c)} * x^${k}`;
    s += s ? (c < 0 ? " - " : " + ") + term : (c < 0 ? "-" : "") + term;
  }
  return s || "0";
}
function taylorText(t, n) {
  let s = "";
  for (let k = 0; k <= n; k++) {
    const c = t.c(k);
    if (!c) continue;
    const pow = k === 0 ? "1" : k === 1 ? "x" : `x${sup(k)}`;
    const term = k <= 1 && Math.abs(c) === 1 ? pow : `${pow}/${t.den(k)}`;
    s += s ? (c < 0 ? " − " : " + ") + term : (c < 0 ? "−" : "") + term;
  }
  return s || "0";
}
const taylorVal = (t, n, x) => { let s = 0; for (let k = 0; k <= n; k++) s += t.c(k) * x ** k; return s; };

const IMPLICIT = [
  { name: "愛心", fn: "(x^2 + y^2 - 1)^3 - a * x^2 * y^3", show: (a) => `(x² + y² − 1)³ − ${a}·x²y³ = 0`, a: 1 },
  { name: "葉形線", fn: "x^3 + y^3 - 3 * a * x * y", show: (a) => `x³ + y³ − 3·${a}·xy = 0`, a: 1 },
  { name: "雙紐線", fn: "(x^2 + y^2)^2 - 2 * a^2 * (x^2 - y^2)", show: (a) => `(x² + y²)² − 2·${a}²(x² − y²) = 0`, a: 1.4 },
  { name: "波紋", fn: "sin(x^2 + y^2) - cos(a * x * y)", show: (a) => `sin(x² + y²) − cos(${a}·xy) = 0`, a: 1 },
];

const MVT = [
  { name: "x³/3 − x", fn: "x^3/3 - x", df: "x^2 - 1", a: -1.6, b: 2.2, dom: { x: [-3.5, 3.5], y: [-3, 3] } },
  { name: "sin x + x/3", fn: "sin(x) + x/3", df: "cos(x) + 1/3", a: -2.5, b: 4, dom: { x: [-5, 6], y: [-3, 4] } },
  { name: "eˣ/4", fn: "exp(x)/4", df: "exp(x)/4", a: -1, b: 2.2, dom: { x: [-3, 3.5], y: [-1, 5] } },
];

const ODE = [
  { name: "y′ = x − y", f: (x, y) => x - y, y: [-3, 3] },
  { name: "y′ = y(1 − y/2)", f: (x, y) => y * (1 - y / 2), y: [-1.5, 3.5] },
  { name: "y′ = sin(x)·y", f: (x, y) => Math.sin(x) * y, y: [-3, 3] },
  { name: "y′ = −x / y", f: (x, y) => -x / y, y: [-3, 3] },
];

const SAMPLER_FN = [
  { name: "tan x", fn: "tan(x)", dom: { x: [-5, 5], y: [-6, 6] } },
  { name: "sin(1/x)", fn: "sin(1/x)", dom: { x: [-0.6, 0.6], y: [-1.6, 1.6] } },
  { name: "1/(x² − 1)", fn: "1/(x^2 - 1)", dom: { x: [-3, 3], y: [-5, 5] } },
  { name: "√(4 − x²)", fn: "sqrt(4 - x^2)", dom: { x: [-3, 3], y: [-1, 3] } },
];

Showcase.run({ scenes: [
  {
    id: "tangent", title: "切線追蹤", paper: true,
    api: "derivative: { fn, x0, updateOnMouseMove: true }",
    desc: "輸入任意 f(x)，切線跟著滑鼠在曲線上滑動；橘色虛線是用 function-plot 內建求值器做中央差分得到的 f′(x)。",
    hint: "移動滑鼠看切線・滾輪縮放・拖曳平移",
    mount(ctx) {
      ctx.html(`<div class="fp-wrap">${card()}<aside class="fp-side">
        <h2>切線與導函數</h2>
        <p class="fp-lead">曲線、切線與導函數都由 function-plot 取樣繪製，輸入框即時重畫。</p>
        <div class="fp-fx"><label>f(x) =</label><input spellcheck="false" autocomplete="off"></div>
        <dl class="fp-rd"><dt>x₀</dt><dd data-k="x"></dd><dt>f(x₀)</dt><dd data-k="y"></dd><dt>斜率</dt><dd data-k="m"></dd><dt>切線</dt><dd data-k="l"></dd></dl>
        <div class="fp-lg"><span><i style="--k:${COL.f}"></i>f(x)</span><span><i class="d" style="--k:${COL.d}"></i>f′(x)</span><span><i style="--k:${COL.t}"></i>切線</span></div>
      </aside></div>`);
      const st = { expr: TANGENT_EX[0], x0: 1.2, showD: true };
      const input = ctx.$(".fp-fx input"), box = ctx.$(".fp-fx");
      const dd = (k) => ctx.$(`dd[data-k="${k}"]`);
      input.value = st.expr;
      const df = (s) => (evalAt(st.expr, s.x + 1e-4) - evalAt(st.expr, s.x - 1e-4)) / 2e-4;
      const read = (x) => {
        st.x0 = x;
        const y = evalAt(st.expr, x), m = df({ x });
        dd("x").textContent = fmt(x); dd("y").textContent = fmt(y); dd("m").textContent = fmt(m);
        dd("l").textContent = Number.isFinite(m) && Number.isFinite(y) ? `y = ${fmt(m, 2)}x ${y - m * x < 0 ? "−" : "+"} ${fmt(Math.abs(y - m * x), 2)}` : "未定義";
      };
      const plot = mkPlot(ctx, ctx.$(".fp-plot"), () => ({
        xAxis: { domain: [-5, 5] }, yAxis: { domain: [-4, 4] }, tip: TIP,
        data: [
          { fn: st.expr, color: COL.f, graphType: "polyline", attr: { "stroke-width": 3 }, derivative: { fn: df, x0: st.x0, updateOnMouseMove: true } },
          ...(st.showD ? [{ fn: df, color: COL.d, graphType: "polyline", skipTip: true, attr: { "stroke-dasharray": "7 6", "stroke-width": 2 } }] : []),
        ],
      }), (c) => c.on("tip:update", ({ x }) => read(x)));
      plot.render(false);
      read(st.x0);
      const setExpr = (e) => {
        try {
          // validate with function-plot's parser before plotting
          if (typeof evalAt(e, 0.37) !== "number") throw new Error("not a number");
          st.expr = e; box.classList.remove("bad"); plot.render(); read(st.x0);
        } catch (err) { box.classList.add("bad"); }
      };
      ctx.on(input, "input", () => setExpr(input.value));
      ctx.select("範例", TANGENT_EX, st.expr, (v) => { input.value = v; setExpr(v); });
      ctx.toggle("導函數", true, (v) => { st.showD = v; plot.render(); });
    },
  },
  {
    id: "taylor", title: "泰勒逼近", paper: true,
    api: "data: [{ fn: 'sin(x)' }, { fn: 'x - x^3/6 + …' }, …]",
    desc: "同一張圖疊多條函數：原函數、目前階數與較低階的泰勒多項式（淡色），看逼近範圍如何隨階數變寬；ln(1+x) 只在 |x| ≤ 1 收斂。",
    hint: "切換函數・拖曳階數滑桿・滾輪縮放",
    mount(ctx) {
      ctx.html(`<div class="fp-wrap">${card()}<aside class="fp-side">
        <h2>在 x = 0 展開</h2>
        <p class="fp-lead">淡紫色是較低階近似，紅色是目前階數，虛線標出比較點。</p>
        <div class="fp-eqn"></div>
        <dl class="fp-rd"><dt data-k="tl"></dt><dd data-k="t"></dd><dt data-k="fl"></dt><dd data-k="f"></dd><dt>誤差</dt><dd data-k="e"></dd></dl>
        <div class="fp-lg"><span><i style="--k:${COL.ink}"></i>原函數</span><span><i style="--k:${COL.t}"></i>Tₙ(x)</span></div>
      </aside></div>`);
      const st = { i: 0, n: 5 };
      const q = (k) => ctx.$(`[data-k="${k}"]`);
      const read = () => {
        const t = TAYLOR[st.i], v = taylorVal(t, st.n, t.at), f = t.f(t.at);
        ctx.$(".fp-eqn").textContent = `T${sub(st.n)}(x) = ${taylorText(t, st.n)}`;
        q("tl").textContent = `T${sub(st.n)}(${t.atS})`; q("t").textContent = fmt(v, 6);
        q("fl").textContent = `${t.name.replace("x", t.atS)}`; q("f").textContent = fmt(f, 6);
        q("e").textContent = fmt(Math.abs(v - f), 6);
      };
      const plot = mkPlot(ctx, ctx.$(".fp-plot"), () => {
        const t = TAYLOR[st.i];
        const data = [{ fn: t.fn, color: COL.ink, graphType: "polyline", attr: { "stroke-width": 3.5, opacity: 0.85 } }];
        const lower = [];
        for (let m = 1; m < st.n; m++) if (t.c(m)) lower.push(m);
        for (const m of lower.slice(-6)) data.push({ fn: taylorFn(t, m), color: COL.p, graphType: "polyline", skipTip: true, attr: { opacity: 0.15 + 0.45 * (m / st.n), "stroke-width": 1.5 } });
        data.push({ fn: taylorFn(t, st.n), color: COL.t, graphType: "polyline", attr: { "stroke-width": 3 } });
        return { xAxis: { domain: t.dom.x }, yAxis: { domain: t.dom.y }, tip: TIP, data, annotations: [{ x: t.at, text: `x = ${t.atS}` }] };
      });
      plot.render(false); read();
      ctx.group(TAYLOR.map((t) => t.name), 0, (i) => { st.i = i; plot.render(false); read(); });
      ctx.slider("階數 n", { min: 1, max: 15, step: 1, value: st.n }, (v) => { st.n = v; plot.render(); read(); });
    },
  },
  {
    id: "curves", title: "參數與極座標", paper: true,
    api: "fnType: 'parametric' { x, y, range } / 'polar' { r }",
    desc: "左邊是參數式利薩茹曲線 x = sin(at + φ)、y = sin(bt)，用 scope 傳參數並以 chart.draw() 逐格重畫；右邊是極座標玫瑰線 r = cos(kθ)，k 為分數時花瓣會交錯。",
    hint: "切換頻率比・拖曳 k・可關閉動畫",
    mount(ctx) {
      ctx.html(`<div class="fp-wrap duo">${card(`<div class="fp-tag" data-t="l"></div>`)}${card(`<div class="fp-tag" data-t="r"></div>`)}</div>`);
      const RATIOS = [[1, 2], [3, 2], [3, 4], [5, 4]];
      const st = { r: 1, k: 2.5, anim: true };
      const scope = { a: 3, b: 2, p: 0 };
      const [pl, pr] = ctx.$$(".fp-plot");
      const tagL = ctx.$('[data-t="l"]'), tagR = ctx.$('[data-t="r"]');
      const left = mkPlot(ctx, pl, (w, h) => ({
        yAxis: { domain: [-1.3, 1.3] }, xAxis: { domain: eqX([-1.3, 1.3], w, h) }, disableZoom: false,
        data: [{ x: "sin(a * t + p)", y: "sin(b * t)", scope, fnType: "parametric", graphType: "polyline", range: [0, TAU], nSamples: 900, color: COL.p, skipTip: true, attr: { "stroke-width": 2.5 } }],
      }));
      const right = mkPlot(ctx, pr, (w, h) => ({
        yAxis: { domain: [-1.25, 1.25] }, xAxis: { domain: eqX([-1.25, 1.25], w, h) },
        data: [{ r: `cos(${st.k} * theta)`, fnType: "polar", graphType: "polyline", range: [0, 4 * TAU], nSamples: 2400, color: COL.t, skipTip: true, attr: { "stroke-width": 2 } }],
      }));
      const label = () => {
        tagL.innerHTML = `參數式 a : b = <b>${scope.a} : ${scope.b}</b>　φ = <b>${(scope.p % TAU).toFixed(2)}</b>`;
        tagR.innerHTML = `極座標 r = cos(<b>${st.k}</b>θ)`;
      };
      left.render(false); right.render(false); label();
      ctx.raf((t, dt) => {
        if (!st.anim || !left.chart) return;
        scope.p += dt * 0.0007;
        left.chart.draw();
        label();
      });
      ctx.group(RATIOS.map(([a, b]) => `${a}:${b}`), st.r, (i) => { [scope.a, scope.b] = RATIOS[i]; left.chart && left.chart.draw(); label(); });
      ctx.slider("k", { min: 0.25, max: 6, step: 0.25, value: st.k, format: (v) => v.toFixed(2) }, (v) => { st.k = v; right.render(); label(); });
      ctx.toggle("動畫", true, (v) => { st.anim = v; });
    },
  },
  {
    id: "implicit", title: "隱函數", paper: true,
    api: "fnType: 'implicit', fn: 'F(x, y)', scope",
    desc: "隱函數只能用區間演算法取樣：把畫面遞迴切成四等分，F 的值域區間不含 0 的方塊直接丟掉，剩下 1 像素大小的方塊就是 F(x, y) = 0 的輪廓；縮放後會重新細分。",
    hint: "切換曲線・拖曳參數 a・滾輪放大看細節",
    mount(ctx) {
      ctx.html(`<div class="fp-wrap solo">${card(`<div class="fp-tag" data-t="eq"></div><div class="fp-tag br" data-t="n"></div>`)}</div>`);
      const st = { i: 0, a: IMPLICIT[0].a, cells: 0, ms: 0 };
      const tagEq = ctx.$('[data-t="eq"]'), tagN = ctx.$('[data-t="n"]');
      const label = () => {
        tagEq.innerHTML = `<b>${IMPLICIT[st.i].show(st.a)}</b>`;
        tagN.innerHTML = `區間方塊 <b>${Showcase.fmt(st.cells)}</b>・取樣 <b>${st.ms.toFixed(0)} ms</b>`;
      };
      let t0 = 0;
      const plot = mkPlot(ctx, ctx.$(".fp-plot"), (w, h) => ({
        yAxis: { domain: [-2.4, 2.4] }, xAxis: { domain: eqX([-2.4, 2.4], w, h) },
        data: [{ fn: IMPLICIT[st.i].fn, scope: { a: st.a }, fnType: "implicit", color: COL.t }],
      }), (c) => {
        c.on("before:draw", () => { t0 = performance.now(); });
        c.on("eval", (data) => { st.cells = data[0] ? data[0].length : 0; });
        c.on("after:draw", () => { st.ms = performance.now() - t0; label(); });
      });
      t0 = performance.now();
      plot.render(false);
      st.ms = performance.now() - t0; label();
      let slider = null;
      ctx.group(IMPLICIT.map((c) => c.name), 0, (i) => {
        st.i = i; st.a = IMPLICIT[i].a; slider.value = st.a; slider.dispatchEvent(new Event("input"));
      });
      slider = ctx.slider("a", { min: 0.2, max: 3, step: 0.1, value: st.a, format: (v) => v.toFixed(1) }, (v) => {
        st.a = v; t0 = performance.now(); plot.render(); st.ms = performance.now() - t0; label();
      });
    },
  },
  {
    id: "secant", title: "割線與註解", paper: true,
    api: "secants: [{ x0, x1 }, { x0, updateOnMouseMove }] + annotations",
    desc: "均值定理：固定割線連接 a、b 兩點，另一條割線從 a 跟著滑鼠；找出導數等於平均變化率的 c 畫出平行切線，三個位置用 annotations 垂直線標示。",
    hint: "移動滑鼠拉動第二條割線・拖曳 a、b",
    mount(ctx) {
      ctx.html(`<div class="fp-wrap">${card()}<aside class="fp-side">
        <h2>均值定理</h2>
        <p class="fp-lead">在 (a, b) 中至少有一點 c，切線斜率等於 a、b 割線的斜率。</p>
        <dl class="fp-rd"><dt>平均變化率</dt><dd data-k="m"></dd><dt>c</dt><dd data-k="c"></dd><dt>f′(c)</dt><dd data-k="d"></dd><dt>滑鼠割線</dt><dd data-k="s"></dd></dl>
        <div class="fp-lg"><span><i style="--k:${COL.f}"></i>f(x)</span><span><i style="--k:${COL.f};opacity:.5"></i>割線</span><span><i style="--k:${COL.t}"></i>c 點切線</span></div>
      </aside></div>`);
      const st = { i: 0, a: MVT[0].a, b: MVT[0].b };
      const q = (k) => ctx.$(`dd[data-k="${k}"]`);
      // roots of f'(x) - m inside (a, b) by scan + bisection
      const solve = (t, lo, hi, m) => {
        const g = (x) => evalAt(t.df, x) - m, out = [], N = 400;
        let px = lo, pg = g(lo);
        for (let i = 1; i <= N && out.length < 3; i++) {
          const x = lo + ((hi - lo) * i) / N, gx = g(x);
          if (pg === 0 || pg * gx < 0) {
            let l = px, r = x;
            for (let k = 0; k < 40; k++) { const mid = (l + r) / 2; if (g(l) * g(mid) <= 0) r = mid; else l = mid; }
            out.push((l + r) / 2);
          }
          px = x; pg = gx;
        }
        return out;
      };
      const calc = () => {
        const t = MVT[st.i], lo = Math.min(st.a, st.b), hi = Math.max(st.a, st.b);
        const m = (evalAt(t.fn, hi) - evalAt(t.fn, lo)) / (hi - lo || 1e-9);
        return { t, lo, hi, m, cs: solve(t, lo, hi, m) };
      };
      const plot = mkPlot(ctx, ctx.$(".fp-plot"), () => {
        const { t, lo, hi, m, cs } = calc();
        q("m").textContent = fmt(m);
        q("c").textContent = cs.length ? cs.map((c) => c.toFixed(3)).join("、") : "無";
        q("d").textContent = cs.length ? fmt(evalAt(t.df, cs[0])) : "未定義";
        return {
          xAxis: { domain: t.dom.x }, yAxis: { domain: t.dom.y }, tip: TIP,
          data: [
            { fn: t.fn, color: COL.f, graphType: "polyline", attr: { "stroke-width": 3 }, secants: [{ x0: lo, x1: hi }, { x0: lo, x1: (lo + hi) / 2 + 0.4, updateOnMouseMove: true }] },
            ...cs.map((c) => ({ fn: t.fn, color: COL.t, graphType: "polyline", skipTip: true, attr: { opacity: 0 }, derivative: { fn: t.df, x0: c } })),
            { points: [[lo, evalAt(t.fn, lo)], [hi, evalAt(t.fn, hi)], ...cs.map((c) => [c, evalAt(t.fn, c)])], fnType: "points", graphType: "scatter", color: COL.ink, attr: { r: 4.5, opacity: 1 } },
          ],
          annotations: [{ x: lo, text: "a" }, { x: hi, text: "b" }, ...cs.map((c, i) => ({ x: c, text: cs.length > 1 ? `c${sub(i + 1)}` : "c" }))],
        };
      }, (c) => c.on("tip:update", ({ x }) => {
        const { t, lo } = calc();
        q("s").textContent = Math.abs(x - lo) < 1e-6 ? "未定義" : fmt((evalAt(t.fn, x) - evalAt(t.fn, lo)) / (x - lo));
      }));
      plot.render(false);
      { const { t, lo, hi } = calc(), x = (lo + hi) / 2 + 0.4; q("s").textContent = fmt((evalAt(t.fn, x) - evalAt(t.fn, lo)) / (x - lo)); }
      let sa = null, sb = null;
      ctx.group(MVT.map((t) => t.name), 0, (i) => {
        st.i = i; st.a = MVT[i].a; st.b = MVT[i].b; sa.value = st.a; sb.value = st.b;
        sa.dispatchEvent(new Event("input")); sb.dispatchEvent(new Event("input")); plot.render(false);
      });
      sa = ctx.slider("a", { min: -3, max: 3, step: 0.1, value: st.a, format: (v) => v.toFixed(1) }, (v) => { st.a = v; plot.render(); });
      sb = ctx.slider("b", { min: -3, max: 4.5, step: 0.1, value: st.b, format: (v) => v.toFixed(1) }, (v) => { st.b = v; plot.render(); });
    },
  },
  {
    id: "vectors", title: "點與向量", paper: true,
    api: "fnType: 'vector' / 'points' + graphType: 'scatter' / 'text'",
    desc: "斜率場由數百個 fnType: vector 箭頭組成；點擊畫面放入初始點，用 RK4 數值解畫成 points 折線，Euler 法（步長 0.4）以 scatter 圓點對照誤差，graphType: text 標出方程式。",
    hint: "點擊畫面加入初始點・切換微分方程",
    mount(ctx) {
      ctx.html(`<div class="fp-wrap solo">${card(`<div class="fp-tag br" data-t="n"></div>`)}</div>`);
      const st = { i: 0, euler: true, seeds: [[-2, 2], [0, -2.5], [1.5, 0.5]] };
      const tagN = ctx.$('[data-t="n"]');
      const plotEl = ctx.$(".fp-plot");
      const rk4 = (f, x, y, h) => {
        const k1 = f(x, y), k2 = f(x + h / 2, y + (h * k1) / 2), k3 = f(x + h / 2, y + (h * k2) / 2), k4 = f(x + h, y + h * k3);
        return y + (h / 6) * (k1 + 2 * k2 + 2 * k3 + k4);
      };
      // integrate both directions from the seed until leaving a generous box
      const trace = (f, [x0, y0], xr, h, step) => {
        const out = [[x0, y0]];
        for (const dir of [1, -1]) {
          let x = x0, y = y0;
          const side = [];
          while (x > xr[0] && x < xr[1] && Number.isFinite(y) && Math.abs(y) < 40) {
            y = step(f, x, y, dir * h); x += dir * h;
            if (Number.isFinite(y)) side.push([x, y]);
          }
          if (dir > 0) out.push(...side); else out.unshift(...side.reverse());
        }
        return out;
      };
      const euler = (f, x, y, h) => y + h * f(x, y);
      let mouse = null;
      const plot = mkPlot(ctx, plotEl, (w, h) => {
        const o = ODE[st.i], yd = o.y, xd = eqX(yd, w, h);
        const data = [];
        const cols = Math.max(8, Math.round((w - 60) / 34)), rows = Math.max(6, Math.round((h - 40) / 34));
        const sx = (xd[1] - xd[0]) / cols, sy = (yd[1] - yd[0]) / rows, len = Math.min(sx, sy) * 0.62;
        for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
          const x = xd[0] + (i + 0.5) * sx, y = yd[0] + (j + 0.5) * sy, m = o.f(x, y);
          if (!Number.isFinite(m)) continue;
          const n = Math.hypot(1, m), dx = len / n, dy = (len * m) / n;
          data.push({ vector: [dx, dy], offset: [x - dx / 2, y - dy / 2], fnType: "vector", graphType: "polyline", color: "#9b968a", skipTip: true });
        }
        const xr = [xd[0] - 1, xd[1] + 1];
        st.seeds.forEach((s, k) => {
          const c = [COL.t, COL.f, COL.g, COL.p, COL.d][k % 5];
          data.push({ points: trace(o.f, s, xr, 0.02, rk4), fnType: "points", graphType: "polyline", color: c, skipTip: true, attr: { "stroke-width": 2.5 } });
          if (st.euler) data.push({ points: trace(o.f, s, xr, 0.4, euler), fnType: "points", graphType: "scatter", color: c, attr: { r: 3, opacity: 0.85 } });
          data.push({ points: [s], fnType: "points", graphType: "scatter", color: COL.ink, attr: { r: 5, opacity: 1, fill: "#fff", "stroke-width": 2.5 } });
        });
        data.push({ graphType: "text", location: [xd[0] + (xd[1] - xd[0]) * 0.03, yd[1] - (yd[1] - yd[0]) * 0.07], text: o.name, attr: { fill: COL.ink } });
        tagN.innerHTML = `向量 <b>${data.filter((d) => d.fnType === "vector").length}</b>・解曲線 <b>${st.seeds.length}</b>`;
        return { yAxis: { domain: yd }, xAxis: { domain: xd }, disableZoom: true, data };
      }, (c) => c.on("mousemove", (p) => { mouse = p; }));
      plot.render(false);
      // click (not drag) adds a seed at the last pointer position reported by the chart
      let down = null;
      ctx.on(plotEl, "pointerdown", (e) => { down = [e.clientX, e.clientY]; });
      ctx.on(plotEl, "click", (e) => {
        if (!mouse || (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4)) return;
        st.seeds = [...st.seeds.slice(-7), [mouse.x, mouse.y]];
        plot.render(false);
      });
      ctx.select("", ODE.map((o, i) => ({ value: String(i), label: o.name })), "0", (v) => { st.i = +v; plot.render(false); });
      ctx.toggle("Euler 對照", true, (v) => { st.euler = v; plot.render(false); });
      ctx.button("清除", () => { st.seeds = []; plot.render(false); });
    },
  },
  {
    id: "sampler", title: "取樣器對比", paper: true,
    api: "graphType: 'polyline'（builtIn）vs 'interval' + chart.addLink()",
    desc: "同一個函數用兩種取樣器：builtIn 逐點求值後連線，遇到漸近線或劇烈振盪會連錯或漏掉；interval 用區間演算法保證每個像素欄都包住真正的值。兩張圖以 addLink 連動縮放與游標。",
    hint: "在任一張圖縮放平移，另一張同步・調低取樣數比較",
    mount(ctx) {
      ctx.html(`<div class="fp-wrap duo">${card(`<div class="fp-tag br" data-t="l"></div>`)}${card(`<div class="fp-tag br" data-t="r"></div>`)}</div>`);
      const st = { i: 0, n: 160 };
      const [pl, pr] = ctx.$$(".fp-plot");
      const tagL = ctx.$('[data-t="l"]'), tagR = ctx.$('[data-t="r"]');
      const opts = (gt, col) => (w, h) => {
        const f = SAMPLER_FN[st.i];
        return { xAxis: { domain: f.dom.x }, yAxis: { domain: f.dom.y }, tip: TIP, data: [{ fn: f.fn, graphType: gt, nSamples: st.n, color: col, attr: gt === "polyline" ? { "stroke-width": 2 } : {} }] };
      };
      const stat = (tag, name) => (c) => {
        let t0 = 0;
        c.on("before:draw", () => { t0 = performance.now(); });
        c.on("after:draw", () => { tag.innerHTML = `${name}・<b>${st.n}</b> 取樣・<b>${(performance.now() - t0).toFixed(1)} ms</b>`; });
      };
      const a = mkPlot(ctx, pl, opts("polyline", COL.f), stat(tagL, "builtIn"));
      const b = mkPlot(ctx, pr, opts("interval", COL.t), stat(tagR, "interval"));
      const link = () => {
        if (!a.chart || !b.chart) return;
        a.chart.addLink(b.chart); b.chart.addLink(a.chart);
        a.chart.draw(); b.chart.draw();
      };
      const both = (keep) => { a.render(keep); b.render(keep); link(); };
      // mkPlot rebuilds each chart on resize; relink after any rebuild
      const ro = new ResizeObserver(() => requestAnimationFrame(link));
      ro.observe(pl); ro.observe(pr);
      ctx.onCleanup(() => ro.disconnect());
      both(false);
      ctx.group(SAMPLER_FN.map((f) => f.name), 0, (i) => { st.i = i; both(false); });
      ctx.slider("取樣數", { min: 20, max: 800, step: 20, value: st.n }, (v) => { st.n = v; both(true); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "chart.meta.xScale.domain([…]) + chart.draw()",
    desc: "每一格平移 x 軸並呼叫 chart.draw() 重新取樣、重建 SVG 路徑，逐級增加同時繪製的函數條數，直到掉到 30 FPS 以下；可切換 interval 取樣與每條取樣數比較。",
    hint: "按「自動加壓」開始；切換取樣器後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="fp-stress">${card(`<div class="fp-tag" data-t="s"></div>`)}</div>`);
      ctx.$(".fp-stress > .fp-card").style.cssText = "position:absolute;inset:0";
      const st = { n: 1, interval: false, per: 0, drawMs: 0 };
      const tag = ctx.$('[data-t="s"]');
      const fns = (n) => Array.from({ length: n }, (_, i) => ({
        fn: `sin(x * ${(1 + (i % 7) * 0.15).toFixed(2)} + ${(i * 0.37).toFixed(2)}) * ${(0.6 + ((i * 13) % 17) / 17 * 2.2).toFixed(2)}`,
        graphType: st.interval ? "interval" : "polyline",
        ...(st.per ? { nSamples: st.per } : {}),
        color: `hsl(${(i * 37) % 360} 62% 45%)`, skipTip: true,
      }));
      const plot = mkPlot(ctx, ctx.$(".fp-plot"), () => ({ xAxis: { domain: [-8, 8] }, yAxis: { domain: [-3.2, 3.2] }, disableZoom: true, data: fns(st.n) }));
      plot.render(false);
      ctx.raf((t) => {
        const c = plot.chart;
        if (!c) return;
        const s = (t / 1000) % 1000;
        c.meta.xScale.domain([-8 + s, 8 + s]);
        const t0 = performance.now();
        c.draw();
        st.drawMs = st.drawMs * 0.85 + (performance.now() - t0) * 0.15;
      });
      const samples = () => (st.per || Math.min(plot.chart ? plot.chart.meta.width * 2 : 0, 5500));
      const paintTag = () => { tag.innerHTML = `<b>${st.n}</b> 條函數・${st.interval ? "interval" : "builtIn"}・每條 <b>${Showcase.fmt(samples())}</b> 取樣`; };
      paintTag();
      ctx.interval(paintTag, 500);
      ctx.toggle("interval 取樣", false, (v) => { st.interval = v; plot.render(false); });
      ctx.select("每條取樣", [{ value: "0", label: "預設 2×寬" }, { value: "200", label: "200" }, { value: "2000", label: "2000" }], "0", (v) => { st.per = +v; plot.render(false); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "函數條數", unit: "條", steps: [1, 2, 4, 8, 16, 32, 64, 128, 256],
        minFps: 30,
        apply(n) { st.n = n; plot.render(false); },
        metrics: () => ({ "每格取樣點": Showcase.fmtCompact(st.n * samples()), "draw() 耗時": `${st.drawMs.toFixed(1)} ms`, "SVG path": ctx.$$(".fp-plot path").length }),
        note: "每格都會重新取樣每一條函數並重建整個 SVG 路徑，瓶頸在 JS 求值次數與瀏覽器的 SVG 版面計算。interval 取樣每個像素欄要做區間運算並畫矩形，成本通常更高；調低每條取樣數可延後掉幀。",
      });
    },
  },
] });
</script>
