<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>function-plot 示範：切線、泰勒展開與曲線下面積</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app {
    position: fixed; inset: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 276px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "top top" "plot side";
  }
  .top { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bg-2); border-bottom: 1px solid var(--line); min-width: 0; }
  .top b { font-size: 15px; white-space: nowrap; }
  .seg { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .seg::-webkit-scrollbar { display: none; }
  .seg .btn { flex: none; padding: 7px 11px; font-size: 12.5px; white-space: nowrap; }
  .seg .btn[aria-pressed="true"] { background: var(--fg); color: var(--bg-2); box-shadow: none; border-color: var(--fg); }
  #plot { grid-area: plot; position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #fdfcf9; margin-bottom: 40px; border-bottom: 1px solid var(--line); }
  .side { grid-area: side; min-height: 0; overflow: auto; padding: 14px 16px 52px; background: var(--bg-2); border-left: 1px solid var(--line); scrollbar-width: thin; }
  .side h2 { margin: 0 0 4px; font-size: 14px; }
  .side p.lead { margin: 0 0 12px; font-size: 12px; color: var(--muted); line-height: 1.55; }
  .fx { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: #fbfaf7; }
  .fx label { font: 600 13px var(--mono); color: var(--c2); white-space: nowrap; }
  .fx input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: 13px var(--mono); color: var(--fg); }
  .fx.bad { border-color: var(--c3); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 10px; }
  .chips button { appearance: none; border: 1px solid var(--line); background: none; border-radius: 999px; padding: 3px 8px; font: 11.5px var(--mono); color: var(--muted); cursor: pointer; }
  .chips button:hover { border-color: var(--c2); color: var(--fg); }
  .rd { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 8px 0; font-size: 12.5px; }
  .rd dt { color: var(--muted); white-space: nowrap; }
  .rd dd { margin: 0; text-align: right; font: 12.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eqn { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: #f4f2ec; font: 12.5px/1.6 var(--mono); word-break: break-word; }
  .sl { display: grid; grid-template-columns: 52px 1fr 34px; align-items: center; gap: 8px; margin: 6px 0; font-size: 12.5px; }
  .sl span { color: var(--muted); }
  .sl output { font: 12.5px var(--mono); text-align: right; }
  .sl input { width: 100%; accent-color: var(--c2); }
  .lg { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .lg i { display: inline-block; width: 16px; height: 0; margin-right: 5px; vertical-align: middle; border-top: 3px solid var(--k); }
  .lg i.d { border-top-style: dashed; border-top-width: 2px; }
  /* function-plot renders bare SVG; give axes and tips the paper palette */
  #plot svg { display: block; font-family: var(--font); }
  #plot .axis path, #plot .axis line { stroke: #b9b5aa; }
  #plot .axis text { fill: #77736a; font-size: 11px; }
  #plot .origin { stroke: #8f8b80; opacity: 1; }
  #plot .tip .inner-tip text { fill: var(--fg); font: 600 12px var(--mono); paint-order: stroke; stroke: #fdfcf9; stroke-width: 4px; stroke-linejoin: round; }
  #plot .tip circle { fill: var(--c3); stroke: #fff; stroke-width: 2px; }
  #plot .tip line { stroke: #b0aca2; stroke-dasharray: 4 4; }
  #plot .canvas > .content > rect, #plot rect.zoom-and-drag { cursor: grab; }
  /* tangent helper line redrawn by function-plot on every mouse move */
  #plot g.derivative path { stroke: #d61f69 !important; stroke-width: 2px !important; opacity: 0.95 !important; }
  @media (max-width: 700px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "top" "plot" "side";
      padding-bottom: 40px; background: var(--bg-2);
    }
    .top { padding: 8px 10px; }
    .top b { display: none; }
    #plot { margin-bottom: 0; border-bottom: 0; }
    .seg .btn { padding: 6px 9px; font-size: 12px; }
    .side { border-left: 0; border-top: 1px solid var(--line); padding: 8px 12px; overflow: hidden; }
    .side h2, .side p.lead, .chips, .lg { display: none; }
    .rd { grid-template-columns: auto 1fr auto 1fr; gap: 2px 8px; margin: 6px 0 0; font-size: 11.5px; }
    .rd dd { font-size: 11.5px; }
    .eqn { margin: 6px 0 0; padding: 5px 8px; font-size: 11.5px; }
    .sl { margin: 4px 0; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="top">
    <b>function-plot 函數實驗室</b>
    <div class="seg" id="seg"></div>
  </div>
  <div id="plot"></div>
  <aside class="side" id="side"></aside>
</div>
<div class="hint" id="hint">滾輪縮放・拖曳平移・移動滑鼠看切線</div>

<script src="https://cdn.jsdelivr.net/npm/function-plot@1.25.4/dist/function-plot.js"></script>
<script>
const fp = window.functionPlot.default || window.functionPlot;
const COL = { f: "#1f8fb8", d: "#e06a1b", t: "#d61f69", g: "#2f9e55", p: "#6a5ae0", ink: "#3a3833" };
const plotEl = document.getElementById("plot");
const side = document.getElementById("side");
const hint = document.getElementById("hint");
const $ = (id) => document.getElementById(id);
const fmt = (v, d = 3) => (Number.isFinite(v) ? (Math.abs(v) < 5e-13 ? 0 : v).toFixed(d) : "未定義");

// evaluate an expression string with function-plot's own built-in evaluator
const evalAt = (meta, x) => fp.$eval.builtIn(meta, "fn", { x });

let chart = null;
let preset = "tan";
const state = { expr: "x^3/6 - x", x0: 1.2, order: 5, a: 1, b: 6.5, n: 8, k: 4 };

// ---------- presets ----------
const PRESETS = {
  tan: {
    label: "切線追蹤",
    hint: "滾輪縮放・拖曳平移・移動滑鼠看切線",
    panel: () => `
      <h2>切線與導函數</h2>
      <p class="lead">輸入任意 f(x)，切線會跟著滑鼠在曲線上滑動；橘色虛線是數值微分算出的 f′(x)。</p>
      <div class="fx" id="fxBox"><label>f(x) =</label><input id="fx" spellcheck="false" autocomplete="off" value="${state.expr}"></div>
      <div class="chips">${["x^3/6 - x", "sin(2*x) + x/2", "exp(-x^2/2)*3", "x*cos(x)", "sqrt(abs(x))*2 - 2"].map((e) => `<button data-e="${e}">${e}</button>`).join("")}</div>
      <dl class="rd">
        <dt>x₀</dt><dd id="rx"></dd>
        <dt>f(x₀)</dt><dd id="ry"></dd>
        <dt>斜率 f′(x₀)</dt><dd id="rm"></dd>
        <dt>切線</dt><dd id="rl"></dd>
      </dl>
      <div class="lg"><span><i style="--k:${COL.f}"></i>f(x)</span><span><i class="d" style="--k:${COL.d}"></i>f′(x)</span><span><i style="--k:${COL.t}"></i>切線</span></div>`,
    bind() {
      const input = $("fx");
      input.addEventListener("input", () => setExpr(input.value));
      side.querySelectorAll(".chips button").forEach((b) => b.addEventListener("click", () => { input.value = b.dataset.e; setExpr(b.dataset.e); }));
      readTangent(state.x0);
    },
    domain: { x: [-5, 5], y: [-4, 4] },
    data() {
      const meta = { fn: state.expr };
      const df = (s) => (evalAt(meta, s.x + 1e-4) - evalAt(meta, s.x - 1e-4)) / 2e-4;
      return [
        { fn: state.expr, color: COL.f, graphType: "polyline", attr: { "stroke-width": 3 },
          derivative: { fn: df, x0: state.x0, updateOnMouseMove: true } },
        { fn: df, color: COL.d, graphType: "polyline", skipTip: true, attr: { "stroke-dasharray": "7 6", "stroke-width": 2 } },
      ];
    },
    after(c) {
      c.on("tip:update", ({ x }) => readTangent(x));
    },
  },
  taylor: {
    label: "泰勒逼近",
    hint: "拖曳滑桿增加階數・滾輪縮放",
    panel: () => `
      <h2>sin(x) 的泰勒多項式</h2>
      <p class="lead">在 x = 0 展開，階數越高，貼合 sin(x) 的範圍越寬。淡色線是較低階的近似。</p>
      <label class="sl"><span>階數 n</span><input id="ord" type="range" min="1" max="15" step="2" value="${state.order}"><output id="ordV"></output></label>
      <div class="eqn" id="poly"></div>
      <dl class="rd">
        <dt>sin(π)</dt><dd>0.000000</dd>
        <dt>Tₙ(π)</dt><dd id="tpi"></dd>
        <dt>誤差</dt><dd id="terr"></dd>
      </dl>
      <div class="lg"><span><i style="--k:${COL.ink}"></i>sin(x)</span><span><i style="--k:${COL.t}"></i>Tₙ(x)</span></div>`,
    bind() {
      const s = $("ord");
      const upd = () => { state.order = +s.value; $("ordV").textContent = s.value; render(); readTaylor(); };
      s.addEventListener("input", upd);
      $("ordV").textContent = s.value;
      readTaylor();
    },
    domain: { x: [-9, 9], y: [-3, 3] },
    data() {
      const out = [{ fn: "sin(x)", color: COL.ink, graphType: "polyline", attr: { "stroke-width": 3.5, opacity: 0.85 } }];
      for (let n = 1; n < state.order; n += 2) {
        out.push({ fn: taylor(n), color: COL.p, graphType: "polyline", skipTip: true, attr: { opacity: 0.18 + 0.5 * (n / state.order), "stroke-width": 1.5 } });
      }
      out.push({ fn: taylor(state.order), color: COL.t, graphType: "polyline", attr: { "stroke-width": 3 } });
      return out;
    },
  },
  area: {
    label: "曲線下面積",
    hint: "拖曳滑桿改區間與分割數・滾輪縮放",
    panel: () => `
      <h2>定積分與黎曼和</h2>
      <p class="lead">藍色區域是 f(x) 在 [a, b] 下的面積，橘色長條是中點黎曼和；分割越細越接近定積分。</p>
      <div class="eqn">f(x) = x·sin(x)/2 + 2</div>
      <label class="sl"><span>下限 a</span><input id="ia" type="range" min="-1" max="9" step="0.1" value="${state.a}"><output id="iaV"></output></label>
      <label class="sl"><span>上限 b</span><input id="ib" type="range" min="-1" max="9" step="0.1" value="${state.b}"><output id="ibV"></output></label>
      <label class="sl"><span>分割 n</span><input id="in" type="range" min="1" max="40" step="1" value="${state.n}"><output id="inV"></output></label>
      <dl class="rd">
        <dt>定積分</dt><dd id="iS"></dd>
        <dt>黎曼和</dt><dd id="iR"></dd>
        <dt>差距</dt><dd id="iE"></dd>
      </dl>`,
    bind() {
      const upd = () => {
        state.a = +$("ia").value; state.b = +$("ib").value; state.n = +$("in").value;
        $("iaV").textContent = state.a.toFixed(1); $("ibV").textContent = state.b.toFixed(1); $("inV").textContent = state.n;
        readArea();
      };
      ["ia", "ib", "in"].forEach((id) => $(id).addEventListener("input", () => { upd(); render(); }));
      upd();
    },
    expr: "x * sin(x) / 2 + 2",
    domain: { x: [-1.5, 9.5], y: [-0.8, 6.2] },
    data() {
      const { lo, hi } = bounds();
      const meta = { fn: this.expr };
      const dx = (hi - lo) / state.n;
      const pts = [[lo, 0]];
      for (let i = 0; i < state.n; i++) {
        const h = evalAt(meta, lo + (i + 0.5) * dx);
        pts.push([lo + i * dx, h], [lo + (i + 1) * dx, h]);
      }
      pts.push([hi, 0]);
      return [
        { fn: this.expr, range: [lo, hi], closed: true, color: COL.f, graphType: "polyline", skipTip: true },
        { points: pts, fnType: "points", graphType: "polyline", color: COL.d, skipTip: true, attr: { "stroke-width": 1.5, "fill-opacity": 0 } },
        { fn: this.expr, color: COL.f, graphType: "polyline", attr: { "stroke-width": 3 } },
      ];
    },
  },
  polar: {
    label: "極座標・隱函數",
    hint: "拖曳滑桿改花瓣・滾輪縮放",
    panel: () => `
      <h2>玫瑰線與愛心曲線</h2>
      <p class="lead">外圈是極座標玫瑰線 r = 3·sin(kθ)；中間的愛心是隱函數，由區間演算法直接解出 F(x, y) = 0 的輪廓。</p>
      <label class="sl"><span>k</span><input id="pk" type="range" min="1" max="9" step="1" value="${state.k}"><output id="pkV"></output></label>
      <div class="eqn">r = 3·sin(<b id="pkE"></b>θ)<br>(x² + y² − 1)³ − x²y³ = 0</div>
      <dl class="rd"><dt>花瓣數</dt><dd id="petal" style="font-family: var(--font)"></dd></dl>
      <div class="lg"><span><i style="--k:${COL.p}"></i>極座標</span><span><i style="--k:${COL.t}"></i>隱函數</span></div>`,
    bind() {
      const s = $("pk");
      const upd = () => {
        state.k = +s.value;
        $("pkV").textContent = s.value; $("pkE").textContent = s.value;
        $("petal").textContent = `${state.k % 2 ? state.k : state.k * 2} 片（k 為${state.k % 2 ? "奇數" : "偶數"}）`;
      };
      s.addEventListener("input", () => { upd(); render(); });
      upd();
    },
    domain: { y: [-3.6, 3.6], equal: true },
    data() {
      return [
        { r: `3 * sin(${state.k} * theta)`, fnType: "polar", range: [0, 2 * Math.PI], nSamples: 1200, graphType: "polyline", color: COL.p, attr: { "stroke-width": 2.5 } },
        { fn: "(x^2 + y^2 - 1)^3 - x^2 * y^3", fnType: "implicit", color: COL.t },
      ];
    },
  },
};

// ---------- helpers ----------
function factorial(n) { let f = 1; for (let i = 2; i <= n; i++) f *= i; return f; }
function taylor(n) {
  const terms = [];
  for (let k = 1, s = 1; k <= n; k += 2, s = -s) terms.push(`${s < 0 ? "- " : terms.length ? "+ " : ""}x^${k} / ${factorial(k)}`);
  return terms.join(" ");
}
const SUP = { 0: "⁰", 1: "¹", 2: "²", 3: "³", 4: "⁴", 5: "⁵", 6: "⁶", 7: "⁷", 8: "⁸", 9: "⁹" };
const sup = (n) => String(n).split("").map((c) => SUP[c]).join("");
function readTaylor() {
  const parts = [];
  for (let k = 1, s = 1; k <= state.order; k += 2, s = -s) parts.push(`${s < 0 ? " − " : parts.length ? " + " : ""}${k === 1 ? "x" : `x${sup(k)}/${k}!`}`);
  $("poly").textContent = `T${state.order === 1 ? "₁" : sup(state.order).replace(/./g, (c) => "₀₁₂₃₄₅₆₇₈₉"["⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)])}(x) = ${parts.join("")}`;
  const v = evalAt({ fn: taylor(state.order) }, Math.PI);
  $("tpi").textContent = fmt(v, 6);
  $("terr").textContent = fmt(Math.abs(v), 6);
}
function bounds() { return { lo: Math.min(state.a, state.b), hi: Math.max(state.a, state.b) }; }
function readArea() {
  const { lo, hi } = bounds();
  const meta = { fn: PRESETS.area.expr };
  // Simpson's rule on 400 panels (reference value)
  const m = 400, h = (hi - lo) / m;
  let s = evalAt(meta, lo) + evalAt(meta, hi);
  for (let i = 1; i < m; i++) s += (i % 2 ? 4 : 2) * evalAt(meta, lo + i * h);
  const exact = (s * h) / 3;
  const dx = (hi - lo) / state.n;
  let r = 0;
  for (let i = 0; i < state.n; i++) r += evalAt(meta, lo + (i + 0.5) * dx) * dx;
  $("iS").textContent = fmt(exact, 4);
  $("iR").textContent = fmt(r, 4);
  $("iE").textContent = fmt(Math.abs(exact - r), 4);
}
function readTangent(x) {
  if (!$("rx")) return;
  state.x0 = x;
  const meta = { fn: state.expr };
  try {
    const y = evalAt(meta, x);
    const m = (evalAt(meta, x + 1e-4) - evalAt(meta, x - 1e-4)) / 2e-4;
    $("rx").textContent = fmt(x);
    $("ry").textContent = fmt(y);
    $("rm").textContent = fmt(m);
    $("rl").textContent = Number.isFinite(m) && Number.isFinite(y) ? `y = ${fmt(m, 2)}x ${y - m * x < 0 ? "−" : "+"} ${fmt(Math.abs(y - m * x), 2)}` : "未定義";
  } catch (e) { /* ignore while the expression is incomplete */ }
}
function setExpr(expr) {
  const box = $("fxBox");
  try {
    // validate with function-plot's parser before plotting
    const v = evalAt({ fn: expr }, 0.37);
    if (typeof v !== "number") throw new Error("not a number");
    state.expr = expr;
    box.classList.remove("bad");
    render();
    readTangent(state.x0);
  } catch (e) {
    box.classList.add("bad");
  }
}

// ---------- rendering ----------
let view = null; // current x/y domain, kept across re-renders until the preset changes
function render(resetView = false) {
  const p = PRESETS[preset];
  const w = plotEl.clientWidth, h = plotEl.clientHeight;
  if (!w || !h) return;
  if (resetView || !view) {
    if (p.domain.equal) {
      const yr = p.domain.y[1] - p.domain.y[0];
      const xr = (yr * w) / h;
      view = { x: [-xr / 2, xr / 2], y: p.domain.y };
    } else {
      view = { x: p.domain.x, y: p.domain.y };
    }
  } else if (chart) {
    view = { x: chart.meta.xScale.domain(), y: chart.meta.yScale.domain() };
  }
  plotEl.innerHTML = "";
  chart = fp({
    target: plotEl, width: w, height: h, grid: true,
    xAxis: { domain: view.x.slice() }, yAxis: { domain: view.y.slice() },
    tip: { xLine: true, yLine: true, renderer: (x, y) => `(${x.toFixed(2)}, ${y.toFixed(2)})` },
    data: p.data(),
  });
  if (p.after) p.after(chart);
}

function choose(key) {
  preset = key;
  document.querySelectorAll("#seg .btn").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === key));
  side.innerHTML = PRESETS[key].panel();
  hint.textContent = PRESETS[key].hint;
  render(true);
  PRESETS[key].bind();
}

const seg = $("seg");
for (const [k, p] of Object.entries(PRESETS)) {
  const b = document.createElement("button");
  b.className = "btn";
  b.dataset.k = k;
  b.textContent = p.label;
  b.addEventListener("click", () => choose(k));
  seg.appendChild(b);
}

let rz = 0;
new ResizeObserver(() => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => render(true)); }).observe(plotEl);
choose("tan");
</script>
</body>
</html>
