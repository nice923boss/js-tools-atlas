    id: "extended", title: "擴充搜尋語法",
    api: "new Fuse(list, { useExtendedSearch: true })",
    desc: "開啟 useExtendedSearch 後，查詢字串可以用符號指定比對方式：等於、包含、開頭、結尾、排除。空白代表「而且」，直線 | 代表「或者」。下方會即時拆解你輸入的查詢。",
    hint: "點左側符號插入範例，或自己組合，例如 ^台 !市$",
    mount(ctx) {
      const OPS = [
        ["夜市", "fuzzy", "模糊比對（預設）"], ["=日月潭", "exact", "完全等於"], ["'老街", "include", "包含這段文字"],
        ["^台北", "prefix", "開頭是"], ["縣$", "suffix", "結尾是"], ["!夜市", "inverse", "不包含"],
        ["!^台", "inverse-prefix", "開頭不是"], ["!市$", "inverse-suffix", "結尾不是"],
      ];
      const kind = (t) => t.startsWith("=") ? "exact" : t.startsWith("!^") ? "inverse-prefix" : t.startsWith("!") && t.endsWith("$") ? "inverse-suffix"
        : t.startsWith("!") ? "inverse" : t.startsWith("'") ? "include" : t.startsWith("^") ? "prefix" : t.endsWith("$") ? "suffix" : "fuzzy";
      const ZH = Object.fromEntries(OPS.map(([, k, zh]) => [k, zh.replace(/（.*）/, "")]));
      let key = "name";
      const w = wrap(ctx, `<input class="fz-in" maxlength="32" value="'老街 | '夜市">${chips("組合範例：", [["'老街 | '夜市"], ["^台 !101"], ["!^台 '博物館"], ["縣$ !^台"], ["=日月潭 | =蘭嶼"]])}
        <div class="fz-card"><h2>查詢拆解</h2><div class="fz-parse"></div></div>
        <div class="fz-cols side"><div class="fz-card"><h2>符號</h2><div class="fz-ops">${OPS.map(([ex, k, zh]) => `<code data-op="${k}" data-ex="${esc(ex)}">${esc(ex)}</code><span>${zh}</span>`).join("")}</div></div>
        <div class="fz-card"><h2>結果 <span class="cnt"></span></h2><div class="fz-grid"></div></div></div>`);
      const q = ctx.$(".fz-in");
      const render = () => {
        const text = q.value.trim();
        const groups = text.split(/\s*\|\s*/).filter(Boolean).map((g) => g.split(/\s+/).filter(Boolean));
        const used = new Set(groups.flat().map(kind));
        ctx.$$(".fz-ops code").forEach((c) => c.classList.toggle("on", used.has(c.dataset.op)));
        ctx.$(".fz-parse").innerHTML = groups.length ? groups.map((g) => `<span class="grp">${g.map((t) => `<span class="fz-pill" style="--k:${kind(t).startsWith("inverse") ? "var(--c3)" : "var(--c2)"}"><code>${ZH[kind(t)]}</code>${esc(t.replace(/^[=!'^]+|\$$/g, "").replace(/^\^/, ""))}</span>`).join('<span class="and">且</span>')}</span>`).join('<span class="or">或</span>') : '<span class="muted">（空白）</span>';
        const fuse = new Fuse(PLACES, { keys: [key], useExtendedSearch: true, includeMatches: true, includeScore: true });
        const rows = text ? fuse.search(text) : [];
        ctx.$(".cnt").textContent = `${rows.length} 筆`;
        ctx.$(".fz-grid").innerHTML = rows.length ? rows.slice(0, 18).map(placeCard).join("") : `<div class="fz-empty">沒有符合的景點</div>`;
      };
      ctx.select("比對欄位", [{ value: "name", label: "名稱 name" }, { value: "city", label: "縣市 city" }, { value: "en", label: "英文 en" }], key, (v) => { key = v; render(); });
      ctx.on(q, "input", render);
      ctx.on(w, "click", (e) => {
        const b = e.target.closest("[data-q]");
        if (b) { q.value = b.dataset.q; render(); return; }
        const c = e.target.closest("[data-ex]");
        if (c) { q.value = c.dataset.ex; render(); }
      });
      render();
    },
  },
  {
    id: "logical", title: "邏輯查詢",
    api: "fuse.search({ $and: [{ city: '台北' }, { $or: [{ tags: '夜市' }, { tags: '夜景' }] }] })",
    desc: "查詢不只能是字串，也可以是物件：每個條件指定欄位與關鍵字，再用 $and、$or 任意巢狀組合。每個條件內部仍是模糊比對，所以「台比」也找得到台北。",
    hint: "改條件欄位與關鍵字，或在上方切換組合方式，看查詢物件與結果同步變化",
    mount(ctx) {
      const MODES = [["A 且（B 或 C）", (a, b, c) => ({ $and: [a, { $or: [b, c] }] })], ["A 且 B 且 C", (a, b, c) => ({ $and: [a, b, c] })], ["A 或 B 或 C", (a, b, c) => ({ $or: [a, b, c] })]];
      const INIT = [["city", "台北"], ["tags", "夜市"], ["tags", "夜景"]];
      let mode = 0;
      const opts = Object.keys(FIELD_ZH).map((k) => `<option value="${k}">${FIELD_ZH[k]} ${k}</option>`).join("");
      const w = wrap(ctx, `<div class="fz-cols"><div class="fz-card"><h2>條件</h2>${INIT.map(([k, v], i) => `<div class="fz-cond"><b>${"ABC"[i]}</b><select data-i="${i}">${opts}</select><input data-i="${i}" maxlength="32" value="${v}"></div>`).join("")}
        ${chips("範例：", [["台北|夜市|夜景"], ["台東|離島|海岸"], ["台比|老街|古蹟"], ["花蓮|海灘|步道"]])}</div>
        <div class="fz-card"><h2>查詢物件</h2><pre class="fz-json"></pre></div></div>
        <div class="fz-card"><h2>結果 <span class="cnt"></span></h2><div class="fz-grid"></div></div>`);
      INIT.forEach(([k], i) => (ctx.$$(".fz-cond select")[i].value = k));
      const fuse = new Fuse(PLACES, { keys: Object.keys(FIELD_ZH), includeMatches: true, includeScore: true, threshold: 0.4, ignoreLocation: true });
      const render = () => {
        const conds = ctx.$$(".fz-cond").map((row) => ({ [row.querySelector("select").value]: row.querySelector("input").value.trim() || "?" }));
        const query = MODES[mode][1](...conds);
        ctx.$(".fz-json").innerHTML = esc(JSON.stringify(query, null, 2)).replace(/&quot;(\$and|\$or)&quot;/g, '<span class="op">"$1"</span>');
        const rows = fuse.search(query);
        ctx.$(".cnt").textContent = `${rows.length} 筆`;
        ctx.$(".fz-grid").innerHTML = rows.length ? rows.slice(0, 18).map(placeCard).join("") : `<div class="fz-empty">沒有景點同時符合這些條件</div>`;
      };
      ctx.group(MODES.map((m) => m[0]), 0, (i) => { mode = i; render(); });
      ctx.on(w, "input", render);
      ctx.on(w, "change", render);
      ctx.on(w, "click", (e) => {
        const b = e.target.closest("[data-q]");
        if (!b) return;
        b.dataset.q.split("|").forEach((v, i) => (ctx.$$(".fz-cond input")[i].value = v));
        render();
      });
      render();
    },
  },
  {
    id: "zh", title: "中文斷詞",
    api: "new Fuse(list, { useTokenSearch: true, tokenize: (t) => Intl.Segmenter 斷詞, tokenMatch })",
    desc: "Fuse 的預設演算法（Bitap）把整串查詢當成一個連續樣式逐字比對，中文多詞查詢如「老街夕陽」在原文不相鄰就找不到，樣式也限 32 字。7.5 版新增的 token 搜尋改成逐詞比對再依詞頻加權，搭配瀏覽器內建的 Intl.Segmenter 中文斷詞，就能處理多詞查詢（旅遊短評為示意資料）。",
    hint: "比較左右兩欄；上方切換「任一詞」或「全部詞」都要命中",
    mount(ctx) {
      const REVIEWS = [
        "週末到士林夜市吃大腸包小腸，再去北投泡溫泉", "礁溪溫泉旁邊就是羅東夜市，吃完宵夜再泡湯",
        "九份老街的芋圓配上山城夜景，人潮多要早點去", "日月潭環湖步道適合騎單車，湖景很美",
        "台南安平老街有蝦餅與豆花，傍晚看夕陽", "高雄駁二假日有市集，晚上去六合夜市吃海鮮粥",
        "花蓮七星潭海灘撿石頭，晚餐吃東大門夜市", "陽明山花季人很多，下山順路去北投溫泉博物館",
        "淡水老街吃阿給，漁人碼頭的夕陽是招牌", "基隆廟口夜市的營養三明治和鼎邊銼一定要吃",
        "墾丁騎機車到鵝鑾鼻燈塔，回程在大街吃海鮮", "宜蘭冬山河騎單車，沿岸湖景跟稻田很療癒",
      ];
      let match = "any";
      const w = wrap(ctx, `<input class="fz-in" maxlength="32" value="老街夕陽">${chips("試試：", [["老街夕陽"], ["夜市 溫泉"], ["單車湖景"], ["海鮮夜市"], ["北投溫泉"]])}
        <div class="fz-cols even">
          <div class="fz-card"><h2>預設 Bitap <code>整串當一個樣式</code></h2><div class="fz-tok q1"></div><div class="r1" style="margin-top:6px"></div></div>
          <div class="fz-card"><h2>Token 搜尋 <code>Intl.Segmenter 斷詞</code></h2><div class="fz-tok q2"></div><div class="r2" style="margin-top:6px"></div></div>
        </div>
        <div class="fz-card"><h2>限制與注意</h2><ul class="fz-note"><li>Bitap 以字元為單位，中文沒有空白分詞，只能比對連續片段；查詢超過 32 字會直接拋錯。</li>
        <li>斷詞結果依瀏覽器內建的 ICU 字典，不同瀏覽器可能切得不一樣，例如「九份」可能被切成兩個字。</li>
        <li>${segmenter ? "此瀏覽器支援 Intl.Segmenter。" : "此瀏覽器不支援 Intl.Segmenter，改用連續字元當一個詞，效果會變差。"}</li></ul></div>`);
      const q = ctx.$(".fz-in");
      const base = { includeScore: true, includeMatches: true, threshold: 0.4 };
      const bitap = new Fuse(REVIEWS, { ...base, ignoreLocation: true });
      const list = (rows) => rows.length ? rows.slice(0, 6).map((r) => `<div class="fz-rv"><span>${hl(r.item, r.matches?.[0]?.indices)}</span><span class="num">${r.score.toFixed(2)}</span></div>`).join("")
        + (rows.length > 6 ? `<div class="fz-sub">另有 ${rows.length - 6} 筆</div>` : "") : `<div class="fz-empty">找不到</div>`;
      const render = () => {
        const text = q.value.trim().slice(0, 32);
        const token = new Fuse(REVIEWS, { ...base, useTokenSearch: true, tokenize: zhTokens, tokenMatch: match });
        ctx.$(".q1").innerHTML = text ? `<span class="one">${esc(text)}</span>` : "";
        ctx.$(".q2").innerHTML = zhTokens(text).map((t) => `<span>${esc(t)}</span>`).join("");
        ctx.$(".r1").innerHTML = text ? list(bitap.search(text)) : "";
        ctx.$(".r2").innerHTML = text ? list(token.search(text)) : "";
      };
      ctx.group(["任一詞命中 any", "全部詞命中 all"], 0, (i) => { match = i ? "all" : "any"; render(); });
      ctx.on(q, "input", render);
      ctx.on(w, "click", (e) => { const b = e.target.closest("[data-q]"); if (b) { q.value = b.dataset.q; render(); } });
      render();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "Fuse.createIndex(keys, docs)・index.toJSON()・Fuse.parseIndex(json)・fuse.search(q, { limit })",
    desc: "產生指定筆數的景點資料，依序量測：建立索引、序列化成 JSON 再用 parseIndex 還原（預建索引的典型流程）、以及五個查詢的平均耗時。上方可切換查詢模式。",
    hint: "上方選查詢模式，左側按「開始測試」",
    mount(ctx) {
      const A = ["北投", "礁溪", "九份", "淡水", "鹿港", "安平", "旗津", "墾丁", "七星潭", "日月潭", "阿里山", "太魯閣", "羅東", "逢甲", "士林", "大溪"];
      const B = ["溫泉會館", "夜市", "老街", "步道", "海灘", "民宿", "咖啡館", "博物館", "古蹟", "燈塔", "農場", "車站"];
      const CITIES = [...new Set(PLACES.map((p) => p.city))];
      const TAGS = [...new Set(PLACES.flatMap((p) => p.tags))];
      const QS = ["夜市", "溫泉會館", "老街步道", "日月譚", "墾丁海灘"];
      const KEYS = ["name", "city", "tags"];
      const MODES = [
        ["預設 Bitap", {}], ["ignoreLocation", { ignoreLocation: true }], ["Token 搜尋", { useTokenSearch: true, tokenize: zhTokens }],
      ];
      const results = MODES.map(() => new Map());
      let mi = 0, gen = 0;
      const r = (a) => a[(Math.random() * a.length) | 0];
      ctx.html(`<div class="fz-stress"><div class="fz-card"><h2>各級距耗時 <code class="mode"></code></h2><div style="overflow-x:auto"><table class="fz-tbl"><thead><tr><th>筆數</th><th>建立索引</th><th>序列化＋parseIndex</th><th>單次查詢</th><th>索引 JSON</th></tr></thead><tbody></tbody></table></div></div>
        <div class="fz-card"><h2>單次查詢：三種模式比較（最大已測級距）</h2><div class="cmp"></div></div>
        <div class="fz-card"><h2>樣本資料</h2><div class="sample fz-sub" style="white-space:normal"></div></div></div>`);
      const cell = (v, max, k, txt) => `<div class="fz-cell" style="--k:${k}"><div class="fz-sbar"><i style="width:${Math.max(3, (v / max) * 100)}%"></i></div><span>${txt}</span></div>`;
      const paint = () => {
        const rows = [...results[mi].values()];
        ctx.$(".mode").textContent = MODES[mi][0];
        const mx = (f) => Math.max(...rows.map(f), 0.01);
        ctx.$("tbody").innerHTML = rows.length ? rows.map((x) => `<tr><td class="num">${Showcase.fmt(x.n)}</td>
          <td>${cell(x.build, mx((y) => y.build), "var(--c2)", Showcase.fmtMs(x.build))}</td><td>${cell(x.parse, mx((y) => y.parse), "var(--c6)", Showcase.fmtMs(x.parse))}</td>
          <td>${cell(x.query, mx((y) => y.query), "var(--c1)", Showcase.fmtMs(x.query))}</td><td class="num">${(x.kb / 1024).toFixed(1)} MB</td></tr>`).join("")
          : `<tr><td colspan="5" class="fz-empty">按左側「開始測試」</td></tr>`;
        const last = results.map((m) => [...m.values()].pop());
        const qmax = Math.max(...last.map((x) => (x ? x.query : 0)), 0.01);
        ctx.$(".cmp").innerHTML = MODES.map(([name], i) => `<div class="fz-w" style="grid-template-columns:110px minmax(0,1fr) 150px;--k:var(--c${[2, 4, 6][i]})"><span>${name}</span>
          <div class="fz-sbar" style="height:12px"><i style="width:${last[i] ? Math.max(3, (last[i].query / qmax) * 100) : 0}%;background:var(--k)"></i></div>
          <b>${last[i] ? `${Showcase.fmtMs(last[i].query)}・${Showcase.fmtCompact(last[i].n)} 筆` : "未測"}</b></div>`).join("");
      };
      const makeBench = () => {
        const lab = ctx.el.querySelector(".sc-lab");
        if (lab) lab.remove();
        const my = ++gen, m = mi, opts = MODES[m][1];
        ctx.bench({
          label: "資料筆數", unit: "筆", sizes: [1000, 5000, 20000, 50000, 100000, 200000], target: 1000, budget: 3000,
          prepare(n) {
            const docs = Array.from({ length: n }, (_, i) => ({ name: `${r(A)}${r(B)} ${i}`, city: r(CITIES), tags: [r(TAGS), r(TAGS)] }));
            ctx.$(".sample").textContent = docs.slice(0, 6).map((d) => `${d.name}（${d.city}・${d.tags.join("、")}）`).join("　");
            return docs;
          },
          run(n, docs) {
            if (my !== gen) throw new DOMException("Bench replaced", "AbortError");
            const t0 = performance.now();
            const index = Fuse.createIndex(KEYS, docs);
            const t1 = performance.now();
            const json = JSON.stringify(index.toJSON());
            const fuse = new Fuse(docs, { keys: KEYS, threshold: 0.4, ...opts }, Fuse.parseIndex(JSON.parse(json)));
            const t2 = performance.now();
            let hits = 0;
            for (const q of QS) hits += fuse.search(q, { limit: 10 }).length;
            const t3 = performance.now();
            results[m].set(n, { n, build: t1 - t0, parse: t2 - t1, query: (t3 - t2) / QS.length, kb: json.length / 1024 });
            paint();
            return `查詢 ${Showcase.fmtMs((t3 - t2) / QS.length)}`;
          },
          note: "計時含建索引、JSON 序列化與 parseIndex 還原、五個查詢（limit 10）。資料產生不計入。Token 搜尋在建立 Fuse 時還要額外建倒排索引並逐筆斷詞，所以「序列化＋parseIndex」那欄會變慢。",
        });
      };
      ctx.group(MODES.map((x) => x[0]), 0, (i) => { mi = i; makeBench(); paint(); });
      ctx.controls.classList.add("bottom");
      makeBench();
      paint();
    },
  },
] });
</script>
</body>
</html>
