<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuse.js 示範：打錯字也找得到的景點搜尋</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"中文、英文都能模糊比對，打錯字也找得到"}</script>
<style>
  body { background: radial-gradient(70% 60% at 100% 0%, rgba(76,201,240,.12), transparent 60%), radial-gradient(60% 50% at 0% 100%, rgba(247,223,30,.08), transparent 60%), var(--bg); }
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 236px; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px 14px; padding: 14px 14px 46px; }
  header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; }
  header h1 { margin: 0; font-size: 18px; white-space: nowrap; }
  header p { margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .search { grid-column: 1; display: flex; flex-direction: column; gap: 8px; }
  .box { position: relative; }
  .box input {
    width: 100%; padding: 12px 44px 12px 42px; border-radius: 12px; border: 1px solid var(--line); outline: none;
    background: var(--bg-2); font-size: 17px; transition: border-color .15s, box-shadow .15s;
  }
  .box input:focus { border-color: var(--c2); box-shadow: 0 0 0 3px rgba(76,201,240,.18); }
  .box .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: .7; }
  .box .clr { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--line); color: var(--fg); cursor: pointer; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  .chip { border: 1px dashed rgba(76,201,240,.5); background: rgba(76,201,240,.08); color: var(--fg); border-radius: 999px; padding: 3px 10px; cursor: pointer; font: 12px var(--font); }
  .chip:hover { border-style: solid; border-color: var(--c2); }
  .chip s { color: var(--c3); text-decoration: none; font-weight: 700; }
  .results { grid-column: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 8px; align-content: start; padding-right: 2px; }
  .card { display: grid; grid-template-columns: 44px minmax(0, 1fr) 54px; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); animation: pop .25s ease both; }
  .card:first-child { border-color: rgba(247,223,30,.55); box-shadow: 0 0 0 1px rgba(247,223,30,.25), 0 8px 24px rgba(0,0,0,.25); }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .emo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; background: rgba(255,255,255,.05); }
  .nm { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .en { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { display: flex; gap: 4px; margin-top: 3px; flex-wrap: nowrap; overflow: hidden; }
  .meta span { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .meta .city { color: var(--c4); border-color: rgba(123,211,137,.4); }
  mark { background: rgba(247,223,30,.9); color: #1a1a14; border-radius: 3px; padding: 0 1px; }
  .en mark, .meta mark { background: rgba(247,223,30,.75); }
  .score { text-align: center; font: 700 15px var(--mono); }
  .score small { display: block; font: 10px var(--font); color: var(--muted); font-weight: 400; }
  .ring { --p: 0; width: 46px; height: 46px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255,255,255,.08) 0); }
  .ring b { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); font: 700 12px var(--mono); }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 40px 10px; }
  aside { grid-column: 2; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  aside h3 { margin: 0 0 8px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
  .row b { font: 700 13px var(--mono); color: var(--fg); }
  aside input[type=range] { width: 100%; margin: 6px 0 2px; }
  .scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .keys { display: grid; gap: 6px; }
  .key { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
  .key input { accent-color: var(--c2); }
  .key i { font: 11px var(--mono); color: var(--muted); font-style: normal; }
  .stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat div { padding: 8px; border-radius: 8px; background: rgba(255,255,255,.04); }
  .stat b { display: block; font: 700 18px var(--mono); color: var(--c2); }
  .stat small { font-size: 11px; color: var(--muted); }
  code.q { display: block; font: 11px/1.5 var(--mono); color: var(--muted); white-space: pre-wrap; word-break: break-all; }
  .mini { display: none; }
  @media (max-width: 640px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto minmax(0, 1fr); padding: 10px 10px 46px; gap: 8px; }
    header p { display: none; }
    header h1 { font-size: 16px; }
    aside { display: none; }
    .mini { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
    .mini input { flex: 1; }
    .mini b { font: 700 12px var(--mono); color: var(--fg); min-width: 30px; }
    .results { grid-template-columns: minmax(0, 1fr); }
    .box input { font-size: 16px; padding: 10px 40px 10px 38px; }
    .chips .lbl, .chips .chip:nth-of-type(n+8) { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header><h1>🔎 台灣景點模糊搜尋</h1><p>中文錯字、英文拼錯、只記得一半都找得到</p></header>
  <div class="search">
    <div class="box">
      <span class="ico">🔍</span>
      <input id="q" type="search" placeholder="輸入景點、縣市或特色，例如：日月譚、kenting" autocomplete="off" spellcheck="false">
      <button class="clr" id="clr" aria-label="清除">✕</button>
    </div>
    <div class="chips" id="chips"><span class="lbl">試試打錯字：</span></div>
    <div class="mini"><span>容錯</span><input type="range" id="th2" min="0" max="0.8" step="0.05" value="0.5"><b id="thv2">0.50</b></div>
  </div>
  <div class="results" id="results"></div>
  <aside>
    <div class="panel">
      <h3>容錯門檻 threshold</h3>
      <div class="row">目前值<b id="thv">0.50</b></div>
      <input type="range" id="th" min="0" max="0.8" step="0.05" value="0.5">
      <div class="scale"><span>0 完全相符</span><span>0.8 很寬鬆</span></div>
    </div>
    <div class="panel">
      <h3>搜尋欄位與權重 keys</h3>
      <div class="keys" id="keys"></div>
    </div>
    <div class="panel">
      <div class="stat">
        <div><b id="cnt">0</b><small>筆符合</small></div>
        <div><b id="ms">0</b><small>毫秒</small></div>
      </div>
    </div>
    <div class="panel"><code class="q" id="code"></code></div>
  </aside>
</div>
<div class="hint">輸入或點錯字範例，黃色是 Fuse.js 比對到的字元</div>

<script type="module">
// Fuse.js fuzzy search over Taiwan attractions: weighted keys, threshold, includeScore + includeMatches for highlighting.
import Fuse from "https://cdn.jsdelivr.net/npm/fuse.js@7.5.0/dist/fuse.min.mjs";

const PLACES = [
  ["台北 101", "Taipei 101", "台北市", ["地標", "夜景"], "🏙️"],
  ["士林夜市", "Shilin Night Market", "台北市", ["夜市", "小吃"], "🍢"],
  ["故宮博物院", "National Palace Museum", "台北市", ["博物館", "文化"], "🏺"],
  ["陽明山國家公園", "Yangmingshan National Park", "台北市", ["步道", "花季"], "⛰️"],
  ["北投溫泉", "Beitou Hot Spring", "台北市", ["溫泉"], "♨️"],
  ["象山步道", "Elephant Mountain Trail", "台北市", ["步道", "夜景"], "🥾"],
  ["九份老街", "Jiufen Old Street", "新北市", ["老街", "山城"], "🏮"],
  ["淡水老街", "Tamsui Old Street", "新北市", ["老街", "夕陽"], "🌅"],
  ["野柳地質公園", "Yehliu Geopark", "新北市", ["海岸", "地質"], "🪨"],
  ["十分瀑布", "Shifen Waterfall", "新北市", ["瀑布"], "🏞️"],
  ["平溪天燈", "Pingxi Sky Lanterns", "新北市", ["天燈", "鐵道"], "🏮"],
  ["基隆廟口夜市", "Keelung Miaokou Night Market", "基隆市", ["夜市", "海鮮"], "🦀"],
  ["和平島公園", "Heping Island Park", "基隆市", ["海岸"], "🌊"],
  ["大溪老街", "Daxi Old Street", "桃園市", ["老街", "豆干"], "🏘️"],
  ["拉拉山", "Lalashan", "桃園市", ["神木", "水蜜桃"], "🌲"],
  ["內灣老街", "Neiwan Old Street", "新竹縣", ["老街", "客家"], "🚂"],
  ["新竹城隍廟", "Hsinchu City God Temple", "新竹市", ["廟宇", "小吃"], "🛕"],
  ["南庄老街", "Nanzhuang Old Street", "苗栗縣", ["老街", "客家"], "🏡"],
  ["勝興車站", "Shengxing Station", "苗栗縣", ["鐵道"], "🚉"],
  ["高美濕地", "Gaomei Wetlands", "台中市", ["夕陽", "濕地"], "🌇"],
  ["逢甲夜市", "Fengjia Night Market", "台中市", ["夜市", "小吃"], "🍡"],
  ["彩虹眷村", "Rainbow Village", "台中市", ["彩繪", "拍照"], "🌈"],
  ["鹿港老街", "Lukang Old Street", "彰化縣", ["老街", "廟宇"], "🏯"],
  ["八卦山大佛", "Baguashan Great Buddha", "彰化縣", ["地標", "廟宇"], "🧘"],
  ["日月潭", "Sun Moon Lake", "南投縣", ["湖泊", "單車"], "🛶"],
  ["清境農場", "Cingjing Farm", "南投縣", ["農場", "綿羊"], "🐑"],
  ["合歡山", "Hehuanshan", "南投縣", ["高山", "星空"], "🌌"],
  ["阿里山", "Alishan", "嘉義縣", ["神木", "日出", "鐵道"], "🌄"],
  ["文化路夜市", "Wenhua Road Night Market", "嘉義市", ["夜市", "雞肉飯"], "🍗"],
  ["劍湖山世界", "Janfusun Fancyworld", "雲林縣", ["樂園"], "🎢"],
  ["安平古堡", "Anping Old Fort", "台南市", ["古蹟"], "🏰"],
  ["赤崁樓", "Chihkan Tower", "台南市", ["古蹟"], "🏯"],
  ["奇美博物館", "Chimei Museum", "台南市", ["博物館", "藝術"], "🏛️"],
  ["七股鹽山", "Cigu Salt Mountain", "台南市", ["鹽田"], "🧂"],
  ["駁二藝術特區", "The Pier-2 Art Center", "高雄市", ["藝術", "文創"], "🎨"],
  ["旗津", "Cijin", "高雄市", ["海岸", "海鮮"], "🦐"],
  ["蓮池潭", "Lotus Pond", "高雄市", ["湖泊", "廟宇"], "🐉"],
  ["墾丁大街", "Kenting Street", "屏東縣", ["夜市", "海灘"], "🏖️"],
  ["鵝鑾鼻燈塔", "Eluanbi Lighthouse", "屏東縣", ["燈塔", "海岸"], "🗼"],
  ["小琉球", "Xiaoliuqiu", "屏東縣", ["離島", "海龜"], "🐢"],
  ["礁溪溫泉", "Jiaoxi Hot Spring", "宜蘭縣", ["溫泉"], "♨️"],
  ["羅東夜市", "Luodong Night Market", "宜蘭縣", ["夜市", "小吃"], "🍜"],
  ["太魯閣國家公園", "Taroko National Park", "花蓮縣", ["峽谷", "步道"], "🏔️"],
  ["七星潭", "Qixingtan Beach", "花蓮縣", ["海灘"], "🌊"],
  ["清水斷崖", "Qingshui Cliff", "花蓮縣", ["海岸"], "🧗"],
  ["伯朗大道", "Mr. Brown Avenue", "台東縣", ["稻田", "單車"], "🌾"],
  ["鹿野高台", "Luye Highland", "台東縣", ["熱氣球"], "🎈"],
  ["三仙台", "Sanxiantai", "台東縣", ["海岸", "步橋"], "🌉"],
  ["綠島", "Green Island", "台東縣", ["離島", "浮潛"], "🤿"],
  ["蘭嶼", "Orchid Island", "台東縣", ["離島", "飛魚"], "🐟"],
  ["澎湖跨海大橋", "Penghu Great Bridge", "澎湖縣", ["離島", "海景"], "🌉"],
  ["金門莒光樓", "Kinmen Juguang Tower", "金門縣", ["古蹟", "離島"], "🏯"],
  ["馬祖藍眼淚", "Matsu Blue Tears", "連江縣", ["離島", "藍眼淚"], "✨"],
].map(([name, en, city, tags, emoji]) => ({ name, en, city, tags, emoji }));

const KEYS = [
  { name: "name", label: "中文名稱", weight: 3, on: true },
  { name: "en", label: "英文名稱", weight: 2, on: true },
  { name: "city", label: "縣市", weight: 1, on: true },
  { name: "tags", label: "特色標籤", weight: 1, on: true },
];
// [typo, index of the wrong character (-1 = no marker)]
const TYPOS = [["九分老街", 1], ["日月譚", 2], ["阿裡山", 1], ["溫全", 1], ["太魯格", 2], ["夜是", 1], ["鵝巒鼻", 1], ["kenting", -1], ["night markat", -1], ["sun moon lak", -1], ["Tarokko", -1]];

const $ = (id) => document.getElementById(id);
const q = $("q"), out = $("results");
let threshold = 0.5;
let fuse;

function build() {
  const keys = KEYS.filter((k) => k.on).map(({ name, weight }) => ({ name, weight }));
  const options = { keys, threshold, includeScore: true, includeMatches: true, ignoreLocation: true, minMatchCharLength: 1 };
  fuse = keys.length ? new Fuse(PLACES, options) : null;
  $("code").textContent = `new Fuse(places, {\n  keys: [${keys.map((k) => `"${k.name}"`).join(", ")}],\n  threshold: ${threshold},\n  includeScore: true,\n  includeMatches: true,\n  ignoreLocation: true\n})`;
}

const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Wrap Fuse match index ranges in <mark>
function hl(text, ranges) {
  if (!ranges || !ranges.length) return esc(text);
  let html = "", last = 0;
  for (const [a, b] of [...ranges].sort((x, y) => x[0] - y[0])) {
    if (a < last) continue;
    html += esc(text.slice(last, a)) + "<mark>" + esc(text.slice(a, b + 1)) + "</mark>";
    last = b + 1;
  }
  return html + esc(text.slice(last));
}

function render() {
  const text = q.value.trim();
  let rows;
  const t0 = performance.now();
  if (!text || !fuse) {
    rows = PLACES.slice(0, 12).map((item) => ({ item, score: null, matches: [] }));
  } else {
    rows = fuse.search(text, { limit: 30 });
  }
  const dt = performance.now() - t0;
  $("cnt").textContent = text ? rows.length : PLACES.length;
  $("ms").textContent = dt.toFixed(2);
  if (!rows.length) {
    out.innerHTML = `<div class="empty">找不到「${esc(text)}」，試著把容錯門檻調高一點</div>`;
    return;
  }
  out.innerHTML = rows.map(({ item, score, matches }) => {
    const m = (key, value) => matches.find((x) => x.key === key && (value === undefined || x.value === value))?.indices;
    const pct = score === null ? null : Math.round((1 - score) * 100);
    const color = pct === null ? "var(--muted)" : score < 0.6 ? "var(--c4)" : score < 0.8 ? "var(--c1)" : "var(--c5)";
    return `<div class="card">
      <div class="emo">${item.emoji}</div>
      <div style="min-width:0">
        <div class="nm">${hl(item.name, m("name"))}</div>
        <div class="en">${hl(item.en, m("en"))}</div>
        <div class="meta"><span class="city">${hl(item.city, m("city"))}</span>${item.tags.map((t) => `<span>${hl(t, m("tags", t))}</span>`).join("")}</div>
      </div>
      <div class="score">${pct === null ? `<small>全部景點</small>` :
        `<div class="ring" style="--p:${pct};--c:${color}"><b>${score.toFixed(2)}</b></div><small>越小越準</small>`}</div>
    </div>`;
  }).join("");
}

// Typo chips: highlight the wrong character
$("chips").insertAdjacentHTML("beforeend", TYPOS.map(([t, i]) =>
  `<button class="chip" data-q="${t}">${i < 0 ? esc(t) : esc(t.slice(0, i)) + "<s>" + t[i] + "</s>" + esc(t.slice(i + 1))}</button>`).join(""));
$("chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (!c) return;
  stopAuto();
  q.value = c.dataset.q;
  render();
});

$("keys").innerHTML = KEYS.map((k, i) => `<label class="key"><input type="checkbox" data-i="${i}" ${k.on ? "checked" : ""}><span>${k.label}</span><i>weight ${k.weight}</i></label>`).join("");
$("keys").addEventListener("change", (e) => {
  KEYS[+e.target.dataset.i].on = e.target.checked;
  build();
  render();
});

function setThreshold(v) {
  threshold = +v;
  $("th").value = $("th2").value = v;
  $("thv").textContent = $("thv2").textContent = threshold.toFixed(2);
  build();
  render();
}
$("th").addEventListener("input", (e) => setThreshold(e.target.value));
$("th2").addEventListener("input", (e) => setThreshold(e.target.value));
q.addEventListener("input", () => { stopAuto(); render(); });
$("clr").addEventListener("click", () => { stopAuto(); q.value = ""; render(); q.focus(); });

// Attract mode: type typo examples letter by letter until the user interacts
let autoTimer = null, autoIdx = 0;
function autoType() {
  const word = TYPOS[autoIdx % TYPOS.length][0];
  let n = 0;
  const step = () => {
    q.value = word.slice(0, ++n);
    render();
    autoTimer = setTimeout(n < word.length ? step : () => { autoIdx++; autoType(); }, n < word.length ? 160 : 2600);
  };
  step();
}
function stopAuto() { clearTimeout(autoTimer); autoTimer = null; }
q.addEventListener("focus", stopAuto);

build();
q.value = TYPOS[0][0];  // multi-result typo: ranked old streets
render();
autoTimer = setTimeout(() => { autoIdx = 1; autoType(); }, 3500);
</script>
</body>
</html>
