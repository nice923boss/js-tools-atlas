<script>
// Everything lives inside this function scope: Gibber.export(window) adds ~200 globals
// (time, step, scale, data, min, max ...), so the page must not declare globals of its own.
(() => {
const { h } = Showcase;
const WORKLET = "https://cdn.jsdelivr.net/npm/gibber.audio.lib@2.1.4/dist/gibberish_worklet.js";
const DPR = Math.min(2, window.devicePixelRatio || 1);
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';
const REST = -987654321; // value Steps reports for a '.' step
const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const noteName = (m) => NOTE[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

// ---------- Gibber engine (shared by every scene) ----------
const G = { ok: false, ctx: null, an: null, hi: null, phase: 0, rewinds: 0, mark: 0, err: "", seq: new Set(), errs: new Set() };
let READY;
if (window.Gibber) {
  // The official playground defines Array.prototype.addPattern; the standalone lib calls it
  // whenever an array is passed to .seq(). A non-enumerable no-op keeps arrays usable.
  if (!Array.prototype.addPattern) Object.defineProperty(Array.prototype, "addPattern", { value() {}, writable: true, configurable: true });
  // 2.1.4 race: the processor may render before any callback exists, which kills the node.
  // Queue a silent placeholder callback as the first message; the real one replaces it.
  const NativeWorklet = window.AudioWorkletNode;
  window.AudioWorkletNode = class extends NativeWorklet {
    constructor(c, name, o) {
      super(c, name, o);
      if (name === "gibberish") this.port.postMessage({ address: "eval", code: "if (this.callback === undefined) this.callback = () => [0, 0];" });
    }
  };
  // Gibberish oscillators assume 44100 Hz; on a 48 kHz context every pitch is 8.8 % sharp.
  // Gibber creates its context on the first mousedown / keydown, so the override stays until then.
  const NativeAC = window.AudioContext;
  window.AudioContext = class extends NativeAC { constructor(o = {}) { super(Object.assign({}, o, { sampleRate: 44100 })); } };
  READY = Gibber.init({ workletPath: WORKLET }).then(() => {
    window.AudioContext = NativeAC;
    Gibber.export(window);
    const ac = Gibberish.ctx;
    const node = Gibberish.worklet;
    // Page-level safety limiter (not part of Gibber): stacked fx and drum kits peak above 0 dBFS.
    const lim = ac.createDynamicsCompressor();
    lim.threshold.value = -6; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.15;
    node.disconnect();
    node.connect(lim); lim.connect(ac.destination);
    G.an = ac.createAnalyser(); G.an.fftSize = 2048; G.an.smoothingTimeConstant = 0.75;
    G.hi = ac.createAnalyser(); G.hi.fftSize = 8192; G.hi.smoothingTimeConstant = 0;
    node.connect(G.an); node.connect(G.hi);
    Gibberish.onphaseupdate = (p) => { if (p < G.phase) G.rewinds++; G.phase = p; };
    node.onprocessorerror = () => { G.err = "音訊引擎停止回應（AudioWorklet 發生錯誤），請重新整理頁面"; };
    // Sequencer messages from the audio thread: 'start' when a Seq starts, 'output' per event
    // for every Seq whose reportOutput flag is set.
    const H = Gibberish.utilities.workletHandlers, orig = H.__sequencer;
    H.__sequencer = (ev) => { const m = ev.data; G.seq.forEach((f) => f(m)); orig(ev); };
    Gibber.subscribe("error", (m) => G.errs.forEach((f) => f(String(m))));
    G.ctx = ac; G.ok = true;
  });
} else {
  READY = Promise.reject(new Error("Gibber 函式庫載入失敗，請確認網路連線"));
}
READY.catch(() => {});

async function boot() {
  await READY;
  if (G.ctx.state !== "running") await G.ctx.resume();
}
function hush() {
  if (!G.ok) return;
  G.mark = G.rewinds;
  Gibber.clear();
  Theory.mode = "aeolian"; Theory.root = 440;
}
// Per-scene runtime: start() clears the engine and builds a patch; leaving the scene clears it again.
function rig(ctx) {
  const subs = [];
  const r = {
    live: false,
    async start(build) {
      await boot();
      if (!ctx.active) return false;
      hush();
      r.live = true;
      build();
      return true;
    },
    stop() { if (r.live) hush(); r.live = false; },
    on(set, f) { set.add(f); subs.push([set, f]); },
  };
  ctx.onCleanup(() => { subs.forEach(([s, f]) => s.delete(f)); r.stop(); });
  return r;
}
// Sample clock at a Seq start; if the Gibber.clear() rewind has not reached the main thread yet,
// the clock still shows the old position, so fall back to 0 (where the rewind lands).
const freshPhase = () => (G.rewinds > G.mark ? Gibberish.phase : 0);
const bootError = (e) => (e && e.message) || "音訊引擎啟動失敗";

// ---------- canvas helpers ----------
function view(ctx, host, draw) {
  const cv = h("canvas");
  host.append(cv);
  const g = cv.getContext("2d");
  const v = { cv, g, w: 0, h: 0, draw: () => draw(v) };
  const fit = () => {
    const r = host.getBoundingClientRect();
    v.w = Math.max(1, r.width); v.h = Math.max(1, r.height);
    cv.width = Math.round(v.w * DPR); cv.height = Math.round(v.h * DPR);
    cv.style.width = v.w + "px"; cv.style.height = v.h + "px";
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw(v);
  };
  const ro = new ResizeObserver(fit);
  ro.observe(host);
  ctx.onCleanup(() => ro.disconnect());
  fit();
  return v;
}
function txt(g, s, x, y, color = "#e8e6e3", size = 12, align = "left", mono = false, weight = 500) {
  g.font = `${weight} ${size}px ${mono ? MONO : CJK}`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle";
  g.fillText(s, x, y);
}
const BUFS = new WeakMap();
function bufs(an) {
  let b = BUFS.get(an);
  if (!b) { b = { t: new Float32Array(an.fftSize), f: new Uint8Array(an.frequencyBinCount), d: new Float32Array(an.frequencyBinCount) }; BUFS.set(an, b); }
  return b;
}
function grid(g, w, hh) {
  g.strokeStyle = "rgba(255,255,255,.06)"; g.lineWidth = 1; g.beginPath();
  for (let i = 1; i < 8; i++) { const x = Math.round((i * w) / 8) + 0.5; g.moveTo(x, 0); g.lineTo(x, hh); }
  g.moveTo(0, Math.round(hh / 2) + 0.5); g.lineTo(w, Math.round(hh / 2) + 0.5); g.stroke();
}
function scope(g, x0, y0, w, hh, { color = "#f7df1e", live = true, idle = "" } = {}) {
  g.save(); g.translate(x0, y0);
  g.fillStyle = "#0a0c0f"; g.fillRect(0, 0, w, hh);
  grid(g, w, hh);
  const an = G.an;
  const t = an ? bufs(an).t : null;
  if (live && an) an.getFloatTimeDomainData(t);
  let s0 = 0;
  if (live && t) for (let i = 1; i < t.length / 2; i++) if (t[i - 1] < 0 && t[i] >= 0) { s0 = i; break; }
  const span = t ? Math.min(t.length - s0, 1024) : 1;
  g.lineWidth = 2; g.strokeStyle = color; g.beginPath();
  for (let x = 0; x <= w; x += 2) {
    const v = live && t ? t[s0 + Math.floor((x / w) * (span - 1))] : 0;
    const y = hh / 2 - Math.max(-1, Math.min(1, v)) * hh * 0.45;
    x ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  if (!live && idle) txt(g, idle, w / 2, hh / 2 - 14, "#7d8490", 12, "center");
  g.restore();
}
// Log-frequency spectrum outline (30 Hz to 16 kHz) from the master analyser.
function spectrum(g, x0, y0, w, hh, color, fill) {
  if (!G.an) return;
  const { f } = bufs(G.an);
  G.an.getByteFrequencyData(f);
  const ny = G.ctx.sampleRate / 2;
  g.beginPath(); g.moveTo(x0, y0 + hh);
  for (let px = 0; px <= w; px += 2) {
    const fr = 30 * Math.pow(16000 / 30, px / w);
    const v = f[Math.min(f.length - 1, Math.round((fr / ny) * f.length))] / 255;
    g.lineTo(x0 + px, y0 + hh - v * hh);
  }
  g.lineTo(x0 + w, y0 + hh);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (color) { g.strokeStyle = color; g.lineWidth = 1.6; g.stroke(); }
}
function level() {
  if (!G.an) return 0;
  const { t } = bufs(G.an);
  G.an.getFloatTimeDomainData(t);
  let p = 0;
  for (let i = 0; i < t.length; i++) p = Math.max(p, Math.abs(t[i]));
  return p;
}
const fv = (v) => {
  if (typeof v !== "number" || !isFinite(v)) return v == null ? "預設" : String(v);
  const a = Math.abs(v);
  return a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : String(+v.toFixed(3));
};
// Gibber properties are proxies; .value returns what was last written (or the preset value).
const readback = (obj, prop) => { try { const p = obj[prop]; return p && typeof p === "object" && "value" in p ? p.value : p; } catch (e) { return undefined; } };
function prow(label, sub, { min, max, step, value }, onInput) {
  const out = h("output");
  const input = h("input", { type: "range", min, max, step, value, "aria-label": label });
  const row = h("label", { class: "gb-prow" }, h("span", {}, label, sub ? h("i", { text: sub }) : null), input, out);
  input.addEventListener("input", () => onInput(+input.value, out));
  return { row, input, out };
}

const PALETTE = ["#4cc9f0", "#9d8cff", "#f72585", "#ff8c42", "#f7df1e"];
function mix(t) {
  const n = PALETTE.length - 1, i = Math.min(n - 1, Math.floor(t * n)), f = t * n - i;
  const a = PALETTE[i], b = PALETTE[i + 1];
  const c = (k) => Math.round(parseInt(a.slice(k, k + 2), 16) * (1 - f) + parseInt(b.slice(k, k + 2), 16) * f);
  return `rgb(${c(1)},${c(3)},${c(5)})`;
}

Showcase.run({
  scenes: [
    // 1 --------------------------------------------------------------------------------------
    {
      id: "live", title: "即時編碼樂段",

        const FXS = [
          { key: "Distortion", cn: "失真", color: "#ff8c42", knob: ["pregain", "增益", 0, 10, 0.1, 3] },
          { key: "BitCrusher", cn: "位元壓縮", color: "#f72585", knob: ["bitDepth", "位元", 0.05, 1, 0.01, 0.3] },
          { key: "Wavefolder", cn: "摺波", color: "#f7df1e", knob: ["gain", "增益", 0, 10, 0.1, 3] },
          { key: "Flanger", cn: "法蘭", color: "#7bd389", knob: ["frequency", "速度", 0.05, 8, 0.05, 0.5] },
          { key: "Delay", cn: "延遲", color: "#4cc9f0", knob: ["feedback", "回授", 0, 0.95, 0.01, 0.5] },
          { key: "Freeverb", cn: "殘響", color: "#9d8cff", knob: ["roomSize", "空間", 0, 0.99, 0.01, 0.9] },
        ];
        const LFOS = [["關閉", null], ["sine", "sine"], ["saw", "saw"], ["square", "square"], ["noise", "noise"]];
        let synth = null, chain = [], lfoType = "sine", lfoRate = 1, lfoDepth = 0.3, base = 0.5;
        const apiEl = ctx.$(".gb-api"), chainEl = ctx.$(".gb-chain");
        const fxHost = ctx.$(".gb-fxs");
        for (const f of FXS) {
          const [prop, label, min, max, step, def] = f.knob;
          f.val = def;
          f.el = h("div", { class: "gb-fx" });
          f.el.style.setProperty("--fc", f.color);
          const head = h("header", { role: "button", tabindex: 0, style: "cursor:pointer" }, h("b", { text: f.cn }), h("small", { text: f.key }));
          head.addEventListener("click", () => toggle(f));
          const p = prow(label, null, { min, max, step, value: def }, (v, out) => {
            f.val = v;
            if (!f.inst) { out.textContent = fv(v); return; }
            f.inst[prop] = v;
            out.textContent = fv(readback(f.inst, prop));
            apiEl.textContent = `${f.key.toLowerCase()}.${prop} = ${v}  → 讀回 ${fv(readback(f.inst, prop))}`;
          });
          p.out.textContent = fv(def);
          f.el.append(head, p.row);
          fxHost.append(f.el);
        }
        function paintChain() {
          const parts = ["<b>Synth</b>"];
          for (const f of chain) parts.push(`→ <b class="fx" style="--fc:${f.color}">${f.cn}</b>`);
          parts.push("→ <b>輸出</b>");
          chainEl.innerHTML = `訊號鏈：${parts.join(" ")}${synth ? `　fx.length = ${synth.fx.length}` : ""}`;
          FXS.forEach((f) => f.el.classList.toggle("on", chain.includes(f)));
        }
        function addFx(f) {
          f.inst = window[f.key]({ [f.knob[0]]: f.val });
          synth.fx.add(f.inst);
        }
        function toggle(f) {
          const at = chain.indexOf(f);
          if (at >= 0) chain = chain.filter((x) => x !== f); else chain = [...chain, f];
          if (synth) {
            if (at >= 0) { synth.fx.remove(at); f.inst = null; apiEl.textContent = `synth.fx.remove(${at})  → fx.length = ${synth.fx.length}`; }
            else { addFx(f); apiEl.textContent = `synth.fx.add(${f.key}({ ${f.knob[0]}: ${f.val} }))  → fx.length = ${synth.fx.length}`; }
          }
          paintChain();
        }
        function applyLfo() {
          if (!synth) return;
          if (!lfoType) { synth.cutoff = base; apiEl.textContent = `synth.cutoff = ${base}（移除 LFO）`; return; }
          synth.cutoff = lfo(lfoType, lfoRate, lfoDepth, base);
          apiEl.textContent = `synth.cutoff = lfo('${lfoType}', ${lfoRate}, ${lfoDepth}, ${base})`;
        }
        function build() {
          Clock.bpm = 120;
          synth = Synth("acidBass");
          const rb = readback(synth, "cutoff");
          base = typeof rb === "number" ? +rb.toFixed(2) : 0.5;
          synth.note.seq([0, 0, 7, 0, 5, 0, 3, -2], 1 / 8);
          FXS.forEach((f) => { f.inst = null; });
          chain.forEach(addFx);
          applyLfo();
          paintChain();
        }
        const play = ctx.button("▶ 播放", async () => {
          if (r.live) { r.stop(); synth = null; FXS.forEach((f) => { f.inst = null; }); play.textContent = "▶ 播放"; paintChain(); return; }
          try { await r.start(build); } catch (e) { apiEl.textContent = bootError(e); return; }
          if (ctx.active && r.live) play.textContent = "■ 停止";
        }, { primary: true });
        ctx.group(LFOS.map((x) => x[0]), 1, (i) => { lfoType = LFOS[i][1]; applyLfo(); });
        ctx.slider("LFO 速率", { min: 0.1, max: 8, step: 0.1, value: lfoRate, format: (v) => `${v.toFixed(1)} Hz` }, (v) => { lfoRate = v; applyLfo(); });
        ctx.slider("LFO 深度", { min: 0, max: 1, step: 0.01, value: lfoDepth }, (v) => { lfoDepth = v; applyLfo(); });
        toggle(FXS[0]); toggle(FXS[4]);
        // Scrolling spectrogram: one column per frame from the master analyser (log frequency axis).
        const off = document.createElement("canvas"), og = off.getContext("2d");
        const spg = view(ctx, ctx.$(".gb-spg"), (v) => {
          const { g, w, h: hh } = v;
          const W = Math.max(1, Math.round(w)), H = Math.max(1, Math.round(hh));
          if (off.width !== W || off.height !== H) { off.width = W; off.height = H; og.fillStyle = "#0a0c0f"; og.fillRect(0, 0, W, H); }
          const live = r.live && G.ok;
          og.drawImage(off, -2, 0);
          if (live) {
            const { f } = bufs(G.an);
            G.an.getByteFrequencyData(f);
            const ny = G.ctx.sampleRate / 2;
            for (let y = 0; y < H; y++) {
              const fr = 30 * Math.pow(16000 / 30, 1 - y / H);
              const val = f[Math.min(f.length - 1, Math.round((fr / ny) * f.length))] / 255;
              og.fillStyle = `hsl(${260 - val * 220}, 90%, ${val * 58}%)`;
              og.fillRect(W - 2, y, 2, 1);
            }
          } else { og.fillStyle = "#0a0c0f"; og.fillRect(W - 2, 0, 2, H); }
          g.drawImage(off, 0, 0, w, hh);
          [100, 1000, 10000].forEach((fr) => { const y = (1 - Math.log(fr / 30) / Math.log(16000 / 30)) * hh; txt(g, fr >= 1000 ? `${fr / 1000}k Hz` : `${fr} Hz`, 6, y, "rgba(255,255,255,.55)", 10, "left", true); });
          txt(g, live ? "頻譜瀑布圖（時間往左捲動，越亮能量越強）" : "按「▶ 播放」後開始捲動", w - 8, 12, "#7d8490", 11, "right");
        });
        ctx.raf(() => spg.draw());
        paintChain();
      },
    },
    // 7 --------------------------------------------------------------------------------------
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "N × Synth('bleep').note.seq(樣式, 1/16)",
      desc: "同時演奏的樂器數逐級增加：每個聲部是一個 Synth('bleep') 加一條 16 分音符序列，全部在同一個 AudioWorklet 的音訊執行緒裡合成。除了主執行緒 FPS，也量「音訊時鐘」：Gibberish 回報的樣本位置增量除以實際經過時間。",
      hint: "按「自動加壓」才會建立聲部並出聲（音量依聲部數自動降低）；離開此場景會立即 Gibber.clear() 釋放所有聲部。",
      mount(ctx) {
        ctx.html(`<div class="gb-sv"><div class="gb-cv" style="position:absolute;inset:0;border:0"></div></div>`);
        ctx.controls.classList.add("bottom");
        const r = rig(ctx);
        let armed = false, target = 0, voices = [], buildMs = 0, err = "";
        const clock = { s: [], rate: 1 };
        const hist = [];
        // Audio-clock result per voice count: last full window (>= 6 samples, 1.5 s) after the rebuild.
        const STEPS = [8, 16, 32, 64, 96, 128, 192, 256];
        const perStep = {};
        const audioLimit = () => {
          let best = null, fail = null;
          for (const n of STEPS) { if (perStep[n] == null) break; if (perStep[n] >= 0.98) best = n; else { fail = n; break; } }
          return { best, fail };
        };
        const gainFor = (n) => Math.min(0.25, 0.3 / Math.sqrt(Math.max(1, n)));
        function rebuild() {
          hush();
          const t0 = performance.now();
          Clock.bpm = 132;
          const gn = gainFor(target), list = [];
          for (let i = 0; i < target; i++) {
            const s = Synth("bleep");
            s.gain = gn;
            const notes = [i % 7, (i * 3 + 2) % 9, (i * 5 + 4) % 11 - 3, ((i * 2) % 7) + 7];
            s.note.seq(notes, 1 / 16);
            list.push({ notes, ph: Math.random() * 6.28 });
          }
          voices = list;
          clock.s.length = 0;
          buildMs = performance.now() - t0;
          r.live = true;
        }
        async function arm(e) {
          if (armed || !e.target.closest("[data-sc-run], .sc-lab input[type=range]")) return;
          armed = true;
          try { await boot(); } catch (x) { err = bootError(x); armed = false; return; }
          if (ctx.active) { clock.s.length = 0; rebuild(); }
        }
        ctx.on(ctx.el, "click", arm, true);
        ctx.on(ctx.el, "input", arm, true);
        ctx.button("釋放所有聲部", () => { armed = false; voices = []; r.stop(); });
        ctx.interval(() => {
          if (!G.ok) return;
          const s = clock.s;
          // Gibber.clear() rewinds the sample clock, so a backwards step starts a new window.
          if (s.length && G.phase < s[s.length - 1][1]) s.length = 0;
          s.push([performance.now(), G.phase]);
          if (s.length > 9) s.shift();
          if (s.length > 2) { const [w0, p0] = s[0], [w1, p1] = s[s.length - 1]; clock.rate = (p1 - p0) / G.ctx.sampleRate / ((w1 - w0) / 1000); }
          if (armed) {
            hist.push(clock.rate); if (hist.length > 120) hist.shift();
            if (voices.length === target && s.length >= 7) perStep[target] = clock.rate;
          }
        }, 250);
        const v = view(ctx, ctx.$(".gb-sv > .gb-cv"), (vv) => {
          const { g, w, h: hh } = vv;
          g.fillStyle = "#050608"; g.fillRect(0, 0, w, hh);
          const sh = Math.min(90, hh * 0.24);
          scope(g, 0, 0, w, sh, { color: "#7bd389", live: armed && voices.length > 0 && G.ok, idle: err || "尚未發聲：按「自動加壓」才會建立聲部" });
          const y0 = sh + 12, y1 = hh - 112, n = voices.length;
          const cols = Math.max(1, Math.ceil(Math.sqrt((n * (w - 20)) / Math.max(1, y1 - y0))));
          const rows = Math.max(1, Math.ceil(n / cols));
          const cw = (w - 20) / cols, chh = Math.min(cw, (y1 - y0) / rows);
          const t = performance.now() / 1000;
          voices.forEach((vo, i) => {
            const x = 10 + (i % cols) * cw + cw / 2, y = y0 + Math.floor(i / cols) * chh + chh / 2;
            g.fillStyle = `hsla(${(vo.notes[0] * 47 + i * 3) % 360}, 80%, 62%, ${0.35 + 0.35 * Math.sin(t * 6 + vo.ph)})`;
            g.beginPath(); g.arc(x, y, Math.max(1.5, Math.min(cw, chh) * 0.36), 0, 6.283); g.fill();
          });
          txt(g, armed ? `${n} 個 Synth('bleep')，每個 gain ${gainFor(n).toFixed(3)}，建立耗時 ${buildMs.toFixed(1)} ms` : `目標 ${target} 個聲部（尚未發聲）`, 10, y1 + 14, "#e8e6e3", 12, "left", false, 600);
          const cy = hh - 46, ch = 34;
          g.fillStyle = "rgba(255,255,255,.04)"; g.fillRect(10, cy, w - 20, ch);
          const Y = (rt) => cy + ch - Math.max(0, Math.min(1, (rt - 0.5) / 0.6)) * ch;
          g.strokeStyle = "rgba(255,255,255,.25)"; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(10, Y(1)); g.lineTo(w - 10, Y(1)); g.stroke(); g.setLineDash([]);
          g.strokeStyle = "#4cc9f0"; g.lineWidth = 1.5; g.beginPath();
          hist.forEach((rt, i) => { const x = 10 + (i / 119) * (w - 20); i ? g.lineTo(x, Y(rt)) : g.moveTo(x, Y(rt)); });
          g.stroke();
          txt(g, `音訊時鐘（虛線 = 100%，刻度 50% 到 110%）目前 ${G.ok ? (clock.rate * 100).toFixed(1) + "%" : "引擎未啟動"}`, 10, hh - 6, "#7d8490", 10.5);
          const done = STEPS.filter((k) => perStep[k] != null);
          if (done.length) {
            const { best, fail } = audioLimit();
            const verdict = fail ? `音訊時鐘維持 98% 以上的上限：${best ?? "低於 " + STEPS[0]} 聲部，${fail} 聲部降到 ${(perStep[fail] * 100).toFixed(0)}%` : `音訊時鐘目前都維持 98% 以上（已測到 ${done[done.length - 1]} 聲部）`;
            txt(g, verdict, 10, cy - 30, fail ? "#ff8c42" : "#7bd389", 12, "left", false, 700);
            txt(g, done.map((k) => `${k}:${(perStep[k] * 100).toFixed(0)}%`).join("  "), 10, cy - 12, "#9aa1ab", 10.5, "left", true);
          }
        });
        ctx.raf(() => v.draw());
        ctx.ramp({
          label: "同時演奏", unit: "聲部", steps: STEPS, minFps: 30, warmup: 1000, sample: 1500,
          title: "極限測試：同時演奏的 Gibber 樂器數",
          note: "FPS 只代表主執行緒（建立樂器、畫面）。Gibber 的合成在 AudioWorklet 執行緒，所以要看「音訊時鐘」：Gibberish 每 128 個樣本回報一次位置，位置增量除以 44100 再除以實際秒數；持續低於約 98% 代表音訊執行緒算不完，聲音開始斷續。FPS 判定只看主執行緒，音訊能撐幾個聲部以右側畫面每一階的音訊時鐘為準。",
          apply: async (n) => { target = n; if (armed && G.ok) rebuild(); },
          metrics: () => ({
            "發聲中": armed ? voices.length : "未發聲",
            "音訊時鐘": G.ok ? `${(clock.rate * 100).toFixed(1)}%` : "未啟動",
            "音訊上限": audioLimit().fail ? `${audioLimit().best ?? 0} 聲部` : "尚未觸及",
            "建立耗時": `${buildMs.toFixed(1)} ms`,
            "取樣率": G.ok ? `${G.ctx.sampleRate} Hz` : "未啟動",
          }),
        });
      },
    },
  ],
});
})();
</script>
</body>
</html>
