<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gibber 示範：邊寫程式邊演奏的即時編碼樂段</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":["audio"],"size":"約 1.3 MB","note":"按下播放才會發聲，播放中可改程式碼再按 Ctrl + Enter 套用"}</script>
<style>
  .app {
    position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr);
    gap: 10px; padding: 12px 14px 46px;
  }
  .top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); cursor: pointer;
    font: 600 12.5px var(--font); padding: 6px 11px; border-radius: 999px;
  }
  .chip[aria-pressed="true"] { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
  .spacer { flex: 1; }
  #play { min-width: 92px; }
  .main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
  .left { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .code {
    position: relative; flex: 1; min-height: 0; border-radius: 10px; border: 1px solid var(--line);
    background: #12151a; overflow: hidden;
  }
  .code pre, .code textarea {
    position: absolute; inset: 0; margin: 0; padding: 12px 14px; border: 0;
    font: 13px/1.6 var(--mono); white-space: pre; tab-size: 2; letter-spacing: 0;
  }
  .code pre { overflow: hidden; color: #d8d6cf; pointer-events: none; }
  .code textarea {
    resize: none; width: 100%; height: 100%; background: transparent; color: transparent;
    caret-color: var(--accent); outline: none; overflow: auto; scrollbar-width: none;
  }
  .code textarea::selection { background: rgba(247, 223, 30, 0.25); }
  .code:focus-within { border-color: rgba(247, 223, 30, 0.55); }
  .code.flash { animation: flash .45s ease-out; }
  @keyframes flash { from { box-shadow: inset 0 0 0 2px rgba(247, 223, 30, 0.8); } to { box-shadow: inset 0 0 0 2px rgba(247, 223, 30, 0); } }
  .t-com { color: #6f7680; font-style: italic; }
  .t-str { color: #7bd389; }
  .t-num { color: #ff8c42; }
  .t-fn { color: #4cc9f0; }
  .t-ug { color: #f7df1e; font-weight: 600; }
  .line { display: flex; gap: 10px; align-items: center; font: 12px var(--mono); color: var(--muted); min-height: 18px; }
  .line .err { color: var(--c3); font-family: var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .ok { color: var(--c4); font-family: var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #clock { white-space: nowrap; }
  kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--fg); }
  .viz {
    position: relative; min-width: 0; min-height: 0; border-radius: 10px; border: 1px solid var(--line);
    background: radial-gradient(90% 90% at 50% 45%, #1c2230, #0f1115 70%); overflow: hidden;
  }
  .viz canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .viz .cap {
    position: absolute; left: 10px; top: 8px; right: 10px; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  @media (max-width: 720px) {
    .app { padding: 10px 10px 46px; gap: 8px; }
    .main { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 8px; }
    .code pre, .code textarea { font-size: 11px; padding: 9px 10px; }
    .chip { padding: 5px 9px; font-size: 12px; }
    .line .keys { display: none; }
  }
  /* portrait: stack the editor above the visualizer */
  @media (max-width: 720px) and (max-aspect-ratio: 1/1) {
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); }
    .top .spacer { flex-basis: 100%; height: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div id="presets" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    <div class="spacer"></div>
    <button class="btn" id="apply" title="Ctrl + Enter">⟳ 套用</button>
    <button class="btn primary" id="play">▶ 播放</button>
  </div>
  <div class="main">
    <div class="left">
      <div class="code" id="codebox">
        <pre id="hl" aria-hidden="true"></pre>
        <textarea id="src" spellcheck="false" wrap="off" aria-label="Gibber 程式碼"></textarea>
      </div>
      <div class="line">
        <span id="clock">♩ 140</span>
        <span id="msg" class="ok"></span>
        <span class="spacer"></span>
        <span class="keys"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 套用</span>
      </div>
    </div>
    <div class="viz">
      <canvas id="cv"></canvas>
      <div class="cap">外圈是即時頻譜，16 格節拍環跟著 Gibber 音訊執行緒的時鐘走</div>
    </div>
  </div>
</div>
<div class="hint">按播放開始，邊聽邊改數字再按 Ctrl + Enter，立刻換成新的樂段</div>

<script src="https://cdn.jsdelivr.net/npm/gibber.audio.lib@2.1.4/dist/gibber.audio.js"></script>
<script>
// Gibber: live-coding audio environment. Instruments (Kick, Snare, Hat, FM, Synth, PolySynth...)
// run inside an AudioWorklet; .seq(values, timings) attaches pattern sequencers to any method or
// property. Euclid(k, n) produces euclidean rhythms. Code below is evaluated as-is on the page.
const WORKLET = "https://cdn.jsdelivr.net/npm/gibber.audio.lib@2.1.4/dist/gibberish_worklet.js";

// The official playground defines this hook (playground/proxies.js) and the standalone lib calls it
// whenever an array is passed to .seq(); a non-enumerable no-op keeps arrays usable outside it.
if (!Array.prototype.addPattern) {
  Object.defineProperty(Array.prototype, "addPattern", { value() {}, writable: true, configurable: true });
}

const PRESETS = {
  "四拍律動": `// 大鼓每拍一下，小鼓落在第 2、4 拍
Clock.bpm = 124
kick  = Kick('tight').trigger.seq( 1, 1/4 )
snare = Snare('snappy').trigger.seq( .6, 1/2, 0, 1/4 )
hat   = Hat().trigger.seq( [.3,.1,.5,.1], 1/16 )

// 音階級數：0 是主音，7 是高八度
bass = Synth('acidBass')
bass.note.seq( [0,0,7,0,5,0,3,-2], 1/8 )`,
  "歐幾里得": `// Euclid(3,8)：8 格裡盡量平均地放 3 下
Clock.bpm = 112
kick = Kick('deep').trigger.seq( 1, Euclid(3,8) )
hat  = Hat().trigger.seq( .25, Euclid(7,16) )
clap = Snare('snappy').trigger.seq( .4, Euclid(2,8,1/8,2) )

perc = FM('perc')
perc.note.seq( [0,2,4,7,9], Euclid(5,8) )
lead = Synth('bleep.echo')
lead.note.seq( [14,11,9,7], 1/8 )`,
  "和弦氛圍": `// 多聲部合成器彈和弦，送進殘響
Clock.bpm = 84
Theory.mode = 'dorian'
verb = Reverb('space').bus()

pad = PolySynth('stringPad').connect( verb, .6 )
pad.chord.seq( [[0,2,4],[3,5,7],[-2,0,2],[1,3,6]], 1 )

bell = FM('glockenspiel').connect( verb, .4 )
bell.note.seq( [7,9,11,14,11,9], [1/8,1/8,1/4] )
kick = Kick('deep').trigger.seq( .8, 1/2 )`,
};

const src = document.getElementById("src");
const hl = document.getElementById("hl");
const codebox = document.getElementById("codebox");
const playBtn = document.getElementById("play");
const msgEl = document.getElementById("msg");
const clockEl = document.getElementById("clock");
const cv = document.getElementById("cv");
const g = cv.getContext("2d");

let current = "四拍律動";
let playing = false;
let analyser = null, freq = null, wave = null;
let phase = 0, phaseOrigin = null;

// ---------- code view: lightweight syntax colouring ----------
const UGENS = /^(Kick|Snare|Hat|Clap|Cowbell|FM|Synth|PolySynth|Monosynth|Reverb|Delay|Euclid|Hex|Clock|Theory)$/;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function paintCode() {
  const re = /(\/\/[^\n]*)|('[^'\n]*'|"[^"\n]*")|(\b\d+(?:\.\d+)?\b|\.\d+\b)|([A-Za-z_]\w*)/g;
  const code = src.value;
  let html = "", last = 0, m;
  while ((m = re.exec(code))) {
    html += esc(code.slice(last, m.index));
    let cls = m[1] ? "t-com" : m[2] ? "t-str" : m[3] ? "t-num" : "";
    if (m[4]) cls = UGENS.test(m[4]) ? "t-ug" : code[m.index + m[0].length] === "(" ? "t-fn" : "";
    html += cls ? `<span class="${cls}">${esc(m[0])}</span>` : esc(m[0]);
    last = m.index + m[0].length;
  }
  hl.innerHTML = html + esc(code.slice(last)) + "\n";
  hl.scrollTop = src.scrollTop; hl.scrollLeft = src.scrollLeft;
}
src.addEventListener("scroll", () => { hl.scrollTop = src.scrollTop; hl.scrollLeft = src.scrollLeft; });
src.addEventListener("input", () => { paintCode(); setMsg("已修改，按 Ctrl + Enter 套用", "ok"); });
function setMsg(text, cls) { msgEl.textContent = text; msgEl.className = cls; }

// ---------- Gibber engine ----------
// Gibber.init waits for the first mousedown / keydown on the page to create its AudioContext,
// so it is called right away and the first press on the play button completes it.
let ready = null;
if (window.Gibber) {
  // gibber.audio.lib 2.1.4 race: the processor marks itself initialized on the first 'add' message
  // and may render before any callback exists, which throws and kills the node for good.
  // Queue a silent placeholder callback as the very first message to the processor;
  // the real callback replaces it on the next graph change.
  const NativeWorkletNode = window.AudioWorkletNode;
  window.AudioWorkletNode = class extends NativeWorkletNode {
    constructor(ctx, name, options) {
      super(ctx, name, options);
      if (name === "gibberish") {
        this.port.postMessage({
          address: "eval",
          code: "if (this.callback === undefined) this.callback = () => [0, 0];",
        });
      }
    }
  };
  ready = Gibber.init({ workletPath: WORKLET }).then(() => {
    Gibber.export(window);                      // Euclid, Hex, Seq... as globals
    const ctx = Gibberish.ctx;
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.78;
    Gibberish.worklet.connect(analyser);        // tap the master output of the worklet
    freq = new Uint8Array(analyser.frequencyBinCount);
    wave = new Uint8Array(analyser.fftSize);
    Gibberish.onphaseupdate = (p) => { phase = p; if (phaseOrigin === null) phaseOrigin = p; };
    Gibberish.worklet.onprocessorerror = () => setMsg("音訊引擎停止回應，請重新整理頁面再試", "err");
  });
} else {
  setMsg("Gibber 函式庫載入失敗，請確認網路連線", "err");
}

function run() {
  Gibber.clear();
  Theory.mode = "aeolian";                      // clear() keeps scale settings, so reset to the default
  try {
    new Function(src.value)();                  // plain script semantics: kick = ... becomes a global
  } catch (err) {
    setMsg(`程式錯誤：${err.message}`, "err");
    return false;
  }
  phaseOrigin = null;
  codebox.classList.remove("flash"); void codebox.offsetWidth; codebox.classList.add("flash");
  setMsg(`✓ 已套用「${current}」`, "ok");
  return true;
}

playBtn.addEventListener("click", async () => {
  if (!ready) return;
  if (playing) {
    Gibber.clear();
    playing = false;
    playBtn.textContent = "▶ 播放";
    setMsg("已停止", "ok");
    return;
  }
  setMsg("啟動音訊引擎中…", "ok");
  playBtn.disabled = true;
  try {
    await ready;
    await Gibberish.ctx.resume();
    if (run()) { playing = true; playBtn.textContent = "■ 停止"; }
  } catch (err) {
    console.error(err);
    setMsg(`音訊引擎啟動失敗：${err.message}`, "err");
  } finally {
    playBtn.disabled = false;
  }
});
function applyNow() {
  if (playing) run();
  else setMsg("先按播放，才會套用並發聲", "ok");
}
document.getElementById("apply").addEventListener("click", applyNow);
src.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); applyNow(); }
  if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertText", false, "  "); }
});

function loadPreset(name) {
  current = name;
  src.value = PRESETS[name];
  document.querySelectorAll("#presets .chip").forEach((b) => b.setAttribute("aria-pressed", b.textContent === name));
  paintCode();
  if (playing) run(); else setMsg("按播放開始演奏", "ok");
}
const presetsEl = document.getElementById("presets");
Object.keys(PRESETS).forEach((name) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = name;
  b.addEventListener("click", () => loadPreset(name));
  presetsEl.append(b);
});

// ---------- visualizer ----------
const PALETTE = ["#4cc9f0", "#9d8cff", "#f72585", "#ff8c42", "#f7df1e"];
function mix(t) {
  const n = PALETTE.length - 1, i = Math.min(n - 1, Math.floor(t * n)), f = t * n - i;
  const a = PALETTE[i], b = PALETTE[i + 1];
  const c = (k) => Math.round(parseInt(a.slice(k, k + 2), 16) * (1 - f) + parseInt(b.slice(k, k + 2), 16) * f);
  return `rgb(${c(1)},${c(3)},${c(5)})`;
}
let lowAvg = 0;
function draw() {
  const dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2 + 8;
  const R = Math.max(40, Math.min(W, H - 30) / 2 - 10);
  const r0 = R * 0.36;
  const live = playing && analyser;
  const bpm = window.Clock ? Clock.bpm : 140;

  // spectrum ring
  const BARS = 72;
  if (live) { analyser.getByteFrequencyData(freq); analyser.getByteTimeDomainData(wave); }
  let low = 0;
  for (let i = 0; i < BARS; i++) {
    let v = 0;
    if (live) {
      const lo = Math.floor(Math.pow(i / BARS, 2) * 180) + 1, hi = Math.floor(Math.pow((i + 1) / BARS, 2) * 180) + 2;
      for (let k = lo; k < hi; k++) v = Math.max(v, freq[k]);
      v /= 255;
      if (i < 6) low += v / 6;
    }
    const a = (i / BARS) * Math.PI * 2 - Math.PI / 2;
    const len = 4 + v * (R - r0 - 26);
    g.strokeStyle = live ? mix(i / BARS) : "rgba(255,255,255,0.10)";
    g.globalAlpha = live ? 0.35 + v * 0.65 : 1;
    g.lineWidth = Math.max(2, (Math.PI * 2 * (r0 + 14)) / BARS - 2.5);
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * (r0 + 14), cy + Math.sin(a) * (r0 + 14));
    g.lineTo(cx + Math.cos(a) * (r0 + 14 + len), cy + Math.sin(a) * (r0 + 14 + len));
    g.stroke();
  }
  g.globalAlpha = 1;
  lowAvg = lowAvg * 0.7 + low * 0.3;

  // waveform loop around the core
  if (live) {
    g.beginPath();
    for (let i = 0; i <= 256; i++) {
      const s = (wave[Math.floor((i % 256) / 256 * wave.length)] - 128) / 128;
      const a = (i / 256) * Math.PI * 2 - Math.PI / 2;
      const rr = r0 + 4 + s * r0 * 0.5;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.strokeStyle = "rgba(236,235,230,0.75)"; g.lineWidth = 1.5; g.stroke();
  }

  // core pulses with the low end
  const core = r0 * (0.62 + lowAvg * 0.32);
  const grad = g.createRadialGradient(cx, cy, 0, cx, cy, core);
  grad.addColorStop(0, live ? "rgba(247,223,30,0.95)" : "rgba(247,223,30,0.35)");
  grad.addColorStop(1, live ? "rgba(247,37,133,0.15)" : "rgba(247,223,30,0.04)");
  g.fillStyle = grad;
  g.beginPath(); g.arc(cx, cy, core, 0, Math.PI * 2); g.fill();

  // 16-step ring driven by the worklet sample clock
  let step = -1, bar = 0, beat = 0;
  if (live && phaseOrigin !== null) {
    const beats = (phase - phaseOrigin) / (Gibberish.ctx.sampleRate * 60 / bpm);
    step = Math.floor(beats * 4) % 16;
    bar = Math.floor(beats / 4) + 1;
    beat = Math.floor(beats % 4) + 1;
  }
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 - Math.PI / 2;
    const rr = R - 4;
    const on = i === step;
    g.fillStyle = on ? "#f7df1e" : i % 4 === 0 ? "rgba(255,255,255,0.45)" : "rgba(255,255,255,0.18)";
    if (on) { g.shadowColor = "#f7df1e"; g.shadowBlur = 16; }
    g.beginPath(); g.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, on ? 6 : i % 4 === 0 ? 4 : 3, 0, Math.PI * 2); g.fill();
    g.shadowBlur = 0;
  }

  // center text
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = live ? "#1a1a14" : "rgba(236,235,230,0.85)";
  g.font = `700 ${Math.round(r0 * 0.34)}px ${getComputedStyle(document.body).fontFamily}`;
  g.fillText(live ? `${bpm}` : "▶", cx, cy - (live ? r0 * 0.1 : 0));
  if (live) {
    g.font = `600 ${Math.max(10, Math.round(r0 * 0.15))}px ${getComputedStyle(document.body).fontFamily}`;
    g.fillText("BPM", cx, cy + r0 * 0.2);
  }
  clockEl.textContent = live && step >= 0 ? `♩ ${bpm}  第 ${bar} 小節 ${beat} 拍` : `♩ ${bpm}`;
  requestAnimationFrame(draw);
}

src.value = PRESETS[current];
loadPreset(current);
requestAnimationFrame(draw);
</script>
</body>
</html>
