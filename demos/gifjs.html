<style>

  .gj-bar.best .v { color: var(--c4); }
  .gj-log { flex: 1; min-height: 0; overflow: hidden; padding: 8px 10px; font: 11.5px/1.55 var(--mono); color: var(--muted); display: flex; flex-direction: column; justify-content: flex-end; }
  .gj-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gj-log b { font-weight: 600; } .gj-log .ev-start { color: var(--c2); } .gj-log .ev-finished { color: var(--c4); } .gj-log .ev-abort { color: var(--c3); } .gj-log .ev-progress { color: var(--accent); }

  /* 5. timeline */

<body>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// gif.js showcase: palette quantisation and LZW encoding run inside Web Workers.
// Workers cannot be loaded cross-origin, so the CDN worker is wrapped in a same-origin blob.
const WORKER_URL = URL.createObjectURL(new Blob(
  ['importScripts("https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js");'],
  { type: "application/javascript" },
));
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif";
const PERIOD = 1500;
const CORES = navigator.hardwareConcurrency || 2;
const KB = (b) => `${(b / 1024).toFixed(b < 10240 ? 1 : 0)} KB`;
const MS = (ms) => `${Math.round(ms)} ms`;

function ctx2d(w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  return c.getContext("2d", { willReadFrequently: true });
}

// Paint n frames with paint(g, phase, index) and return them as ImageData (painting is not timed).
function paintFrames(paint, w, h, n) {
  const g = ctx2d(w, h);
  const out = [];
  for (let i = 0; i < n; i++) { paint(g, i / n, i); out.push(g.getImageData(0, 0, w, h)); }
  return out;
}

// Encode ImageData frames. Resolves { blob, ms }; workers are terminated when done or on unmount.
function encode(ctx, frames, opts = {}, hooks = {}) {
  if (!ctx.active) return new Promise(() => {});
  const { delays, delay = 100 } = hooks;
  const gif = new GIF({ workers: 2, quality: 10, workerScript: WORKER_URL, width: frames[0].width, height: frames[0].height, ...opts });
  frames.forEach((f, i) => gif.addFrame(f, { delay: delays ? delays[i] : delay }));
  const kill = () => [...gif.freeWorkers, ...gif.activeWorkers].forEach((w) => w.terminate());
  ctx.onCleanup(() => { gif.removeAllListeners(); if (gif.running) gif.abort(); kill(); });
  return new Promise((resolve, reject) => {
    let t0 = performance.now();
    gif.on("start", () => { t0 = performance.now(); hooks.onEvent?.("start"); });
    gif.on("progress", (p) => hooks.onProgress?.(p));
    gif.on("finished", (blob) => { kill(); resolve({ blob, ms: performance.now() - t0 }); });
    gif.on("abort", () => { kill(); reject(new Error("aborted")); });
    hooks.onGif?.(gif);
    gif.render();
  });
}

// An <img> slot that shows a GIF blob and revokes the previous object URL.
function gifSlot(ctx, box, alt) {
  let url = null, img = null;
  ctx.onCleanup(() => url && URL.revokeObjectURL(url));
  return {
    show(blob) {
      if (url) URL.revokeObjectURL(url);
      url = URL.createObjectURL(blob);
      img?.remove();
      img = Showcase.h("img", { alt, src: url });
      box.prepend(img);
      box.querySelector(".gj-empty")?.remove();
    },
    replay() { if (img) { const n = img.cloneNode(); img.replaceWith(n); img = n; } },
    get url() { return url; },
  };
}

function loadImage(src) {
  const img = new Image();
  img.src = src;
  return img.decode().then(() => img);
}

const card = (title, info = "", cls = "") =>
  `<section class="gj-card"><header><b>${title}</b><span class="gj-info">${info}</span></header><div class="gj-pic ${cls}"><div class="gj-empty">編碼中…</div><div class="gj-meter"><i></i></div></div></section>`;
const meter = (cardEl, p) => {
  const m = cardEl.querySelector(".gj-meter");
  m.classList.toggle("on", p != null && p < 1);
  m.firstElementChild.style.width = `${Math.round((p || 0) * 100)}%`;
};

// Loop painters from the original demo: phase t in [0, 1) loops seamlessly.
const PAINTERS = {
  ball(ctx, s, t) {
    const sky = ctx.createLinearGradient(0, 0, 0, s);
    sky.addColorStop(0, "#ffd36e");
    sky.addColorStop(1, "#ff7a59");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, s, s);
    const floor = s * 0.82;
    ctx.fillStyle = "#3a2a4d";
    ctx.fillRect(0, floor, s, s - floor);
    const r = s * 0.11;
    const C = 0.14;
    const d = Math.min(t, 1 - t);
    const onGround = d < C / 2;
    const u = onGround ? 0 : (t - C / 2) / (1 - C);
    const h = onGround ? 0 : 4 * u * (1 - u);
    const contact = onGround ? Math.cos((d / (C / 2)) * Math.PI / 2) : 0;
    const speed = onGround ? 0 : Math.abs(1 - 2 * u);
    const sx = 1 + 0.4 * contact - 0.12 * speed * (1 - contact);
    const sy = 1 - 0.32 * contact + 0.16 * speed * (1 - contact);
    const cy = floor - r * sy - h * s * 0.52;
    ctx.fillStyle = `rgba(20, 10, 30, ${0.35 - h * 0.2})`;
    ctx.beginPath();
    ctx.ellipse(s / 2, floor + 3, r * (1.2 - h * 0.5) * sx, r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(s / 2, cy);
    ctx.scale(sx, sy);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    g.addColorStop(0, "#fff6c2");
    g.addColorStop(0.35, "#f7df1e");
    g.addColorStop(1, "#c9a400");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.rotate(t * Math.PI * 2);
    ctx.strokeStyle = "rgba(26, 26, 20, 0.85)";
    ctx.lineWidth = r * 0.16;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.62, -0.6, 0.6);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = "#3a2a4d";
    ctx.font = `800 ${s * 0.075}px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("BOING", s / 2, s * 0.14 + Math.sin(t * Math.PI * 2) * 3);
  },
  rings(ctx, s, t) {
    ctx.fillStyle = "#11131a";
    ctx.fillRect(0, 0, s, s);
    const colors = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42"];
    const turns = [1, -2, 3, -1, 2];
    ctx.lineCap = "round";
    colors.forEach((c, i) => {
      const r = s * (0.12 + i * 0.075);
      const len = Math.PI * (0.6 + 0.5 * (1 + Math.sin((t + i * 0.13) * Math.PI * 2)));
      const a = turns[i] * t * Math.PI * 2 + i;
      ctx.strokeStyle = c;
      ctx.lineWidth = s * 0.04;
      ctx.beginPath();
      ctx.arc(s / 2, s / 2, r, a, a + len);
      ctx.stroke();
      ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.arc(s / 2, s / 2, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
    const pulse = 0.5 + 0.5 * Math.cos(t * Math.PI * 4);
    ctx.fillStyle = "#ecebe6";
    ctx.beginPath();
    ctx.arc(s / 2, s / 2, s * (0.035 + pulse * 0.025), 0, Math.PI * 2);
    ctx.fill();
  },
  wave(ctx, s, t, text = "哈囉 GIF") {
    const bg = ctx.createLinearGradient(0, 0, s, s);
    bg.addColorStop(0, "#2b1055");
    bg.addColorStop(1, "#7597de");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, s, s);
    const chars = [...(text || "GIF")];
    const fs = Math.min(s * 0.24, (s * 0.86) / Math.max(1, chars.length) * 1.15);
    ctx.font = `900 ${fs}px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const widths = chars.map((c) => ctx.measureText(c).width);
    let x = s / 2 - widths.reduce((a, b) => a + b, 0) / 2;
    chars.forEach((c, i) => {
      const ph = (t + i / Math.max(4, chars.length)) * Math.PI * 2;
      const y = s / 2 + Math.sin(ph) * s * 0.11;
      const hue = (t * 360 + i * 40) % 360;
      const cx = x + widths[i] / 2;
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillText(c, cx + 3, y + 5);
      ctx.fillStyle = `hsl(${hue} 95% 68%)`;
      ctx.save();
      ctx.translate(cx, y);
      ctx.rotate(Math.cos(ph) * 0.18);
      ctx.fillText(c, 0, 0);
      ctx.restore();
      x += widths[i];
    });
  },
};

// Smooth hue/lightness field: 256 palette colours cannot cover it, which exposes banding.
function paintSpectrum(g, w, h) {
  for (let x = 0; x < w; x += 2) {
    const col = g.createLinearGradient(0, 0, 0, h);
    const hue = (x / w) * 300;
    col.addColorStop(0, `hsl(${hue} 90% 88%)`);
    col.addColorStop(0.5, `hsl(${hue} 85% 52%)`);
    col.addColorStop(1, `hsl(${hue} 70% 10%)`);
    g.fillStyle = col;
    g.fillRect(x, 0, 2, h);
  }
  const r = g.createRadialGradient(w * 0.72, h * 0.35, 4, w * 0.72, h * 0.35, h * 0.45);
  r.addColorStop(0, "rgba(255,255,255,0.75)");
  r.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = r;
  g.fillRect(0, 0, w, h);
}

async function sourceFrame(kind, w, h) {
  const g = ctx2d(w, h);
  if (kind === 0) {
    const img = await loadImage("_shared/img/photo-5.jpg");
    g.drawImage(img, 0, 0, w, h);
  } else paintSpectrum(g, w, h);
  return g.getImageData(0, 0, w, h);
}

// Rotating sticker used by the transparency scene.
function paintSticker(g, s, t) {
  g.save();
  g.translate(s / 2, s / 2);
  g.rotate(t * Math.PI * 2 / 5);
  const k = 1 + 0.06 * Math.sin(t * Math.PI * 2);
  g.scale(k, k);
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? s * 0.2 : s * 0.42;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    g.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  g.closePath();
  const grd = g.createLinearGradient(-s * 0.4, -s * 0.4, s * 0.4, s * 0.4);
  grd.addColorStop(0, "#fff3a6");
  grd.addColorStop(1, "#f7a400");
  g.fillStyle = grd;
  g.fill();
  g.lineWidth = s * 0.035;
  g.strokeStyle = "#1b2a4a";
  g.lineJoin = "round";
  g.stroke();
  g.rotate(-t * Math.PI * 2 / 5);
  g.fillStyle = "#1b2a4a";
  g.font = `900 ${s * 0.13}px ${FONT}`;
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText("NEW", 0, s * 0.01);
  g.restore();
}

Showcase.run({ scenes: [
  {
    id: "sign", title: "Canvas 動畫轉 GIF",
    api: "new GIF({ workers: 2, quality: 10, workerScript }); gif.addFrame(imageData, { delay }); gif.render()",
    desc: "左邊是即時繪製的 Canvas 動畫，按下產生後逐格擷取，交給 Worker 量化色彩並壓縮成無縫循環 GIF。",
    hint: "換動畫或規格後按「產生 GIF」，完成後可下載",
    mount(ctx) {
      ctx.html(`<div class="gj-wrap gj-two">
        <section class="gj-card"><header><b>即時畫面（Canvas）</b><span>loop ${PERIOD} ms</span></header><div class="gj-pic"><canvas width="320" height="320"></canvas></div></section>
        ${card("輸出 GIF", "", "gj-chk")}</div>`);
      const outCard = ctx.$$(".gj-card")[1];
      const lctx = ctx.$("canvas").getContext("2d");
      const slot = gifSlot(ctx, outCard.querySelector(".gj-pic"), "gif.js 產生的動畫 GIF");
      const SPECS = [{ n: 20, s: 240 }, { n: 30, s: 320 }, { n: 40, s: 320 }];
      let preset = "ball", spec = SPECS[1], text = "哈囉 GIF", busy = false;
      ctx.raf((t) => PAINTERS[preset](lctx, 320, (t % PERIOD) / PERIOD, text));
      const names = ["ball", "rings", "wave"];
      ctx.group(["彈跳球", "旋轉圓環", "文字波浪"], 0, (i) => { preset = names[i]; textField.hidden = preset !== "wave"; });
      const input = Showcase.h("input", { type: "text", class: "gj-text", value: text, maxlength: 8, "aria-label": "波浪文字" });
      const textField = Showcase.h("label", { class: "sc-field gj-textfield", hidden: true }, "文字", input);
      ctx.on(input, "input", () => (text = input.value));
      ctx.controls.append(textField);
      ctx.select("", SPECS.map((x, i) => ({ value: i, label: `${x.n} 格・${x.s}px` })), 1, (v) => (spec = SPECS[v]));
      const go = ctx.button("產生 GIF", render, { primary: true });
      const dl = ctx.button("下載", () => {
        const a = Showcase.h("a", { href: slot.url, download: `gifjs-${preset}.gif` });
        a.click();
      });
      dl.disabled = true;
      async function render() {
        if (busy) return;
        busy = true; go.disabled = true;
        const { n, s } = spec;
        const frames = paintFrames((g, t) => PAINTERS[preset](g, s, t, text), s, s, n);
        const info = outCard.querySelector(".gj-info");
        const { blob, ms } = await encode(ctx, frames, { workers: 2 }, {
          delay: Math.round(PERIOD / n),
          onProgress: (p) => { meter(outCard, p); info.textContent = `${Math.round(p * n)} / ${n}`; },
        });
        meter(outCard, null);
        slot.show(blob);
        info.textContent = `${s}×${s}・${n}f・${KB(blob.size)}・${MS(ms)}`;
        busy = false; go.disabled = false; dl.disabled = false;
      }
      render();
    },
  },
  {
    id: "quality", title: "取樣品質",
    api: "new GIF({ quality: 1 | 10 | 30 })",
    desc: "quality 是 NeuQuant 建調色盤時的像素取樣間隔：1 每個像素都看（最準、最慢），30 只抽樣少數像素，色彩容易偏掉。",
    hint: "比較天空、彩虹與暗部的色帶，標題列顯示耗時與檔案大小",
    mount(ctx) {
      const QS = [1, 10, 30];
      ctx.html(`<div class="gj-wrap gj-quad">
        <section class="gj-card"><header><b>原圖（Canvas）</b><span>24-bit</span></header><div class="gj-pic"><canvas></canvas></div></section>
        ${QS.map((q) => card(`<code>quality: ${q}</code>`, "", "gj-chk")).join("")}</div>`);
      const cards = ctx.$$(".gj-card").slice(1);
      const src = ctx.$("canvas");
      let kind = 0, token = 0;
      async function run() {
        const my = ++token;
        const W = 420, H = 280;
        const frame = await sourceFrame(kind, W, H);
        if (my !== token || !ctx.active) return;
        src.width = W; src.height = H;
        src.getContext("2d").putImageData(frame, 0, 0);
        for (let i = 0; i < QS.length; i++) {
          const c = cards[i];
          c.querySelector(".gj-info").textContent = "編碼中…";
          const { blob, ms } = await encode(ctx, [frame], { quality: QS[i], workers: 1 }, { onProgress: (p) => meter(c, p) });
          if (my !== token) return;
          meter(c, null);
          (c.slot ||= gifSlot(ctx, c.querySelector(".gj-pic"), `quality ${QS[i]} 的輸出`)).show(blob);
          c.querySelector(".gj-info").textContent = `${MS(ms)}・${KB(blob.size)}`;
        }
      }
      ctx.group(["照片", "漸層"], 0, (i) => { kind = i; run(); });
      ctx.button("重新編碼", run);
      run();
    },
  },
  {
    id: "dither", title: "抖色演算法",
    api: 'new GIF({ dither: false | "FloydSteinberg" | "Atkinson" | "Stucki" })',
    desc: "GIF 每格最多 256 色，平滑漸層會出現色帶。dither 把量化誤差擴散到鄰近像素，用顆粒換掉色帶；不同核心的顆粒感與檔案大小不同。",
    hint: "開啟「放大 4×」看像素顆粒；serpentine 是蛇行掃描，減少斜紋",
    mount(ctx) {
      const DS = [false, "FloydSteinberg", "Atkinson", "Stucki"];
      ctx.html(`<div class="gj-wrap gj-quad">${DS.map((d) => card(`<code>${d ? `"${d}"` : "false"}</code>`, "", "gj-chk")).join("")}</div>`);
      const wrap = ctx.$(".gj-wrap");
      const cards = ctx.$$(".gj-card");
      let kind = 1, serp = false, token = 0;
      async function run() {
        const my = ++token;
        const frame = await sourceFrame(kind, 320, 200);
        if (my !== token || !ctx.active) return;
        for (let i = 0; i < DS.length; i++) {
          const c = cards[i];
          c.querySelector(".gj-info").textContent = "編碼中…";
          const dither = DS[i] && serp ? `${DS[i]}-serpentine` : DS[i];
          const { blob, ms } = await encode(ctx, [frame], { dither, workers: 1 }, { onProgress: (p) => meter(c, p) });
          if (my !== token) return;
          meter(c, null);
          (c.slot ||= gifSlot(ctx, c.querySelector(".gj-pic"), `dither ${DS[i] || "關閉"} 的輸出`)).show(blob);
          c.querySelector(".gj-info").textContent = `${MS(ms)}・${KB(blob.size)}`;
        }
      }
      ctx.group(["漸層", "照片"], 0, (i) => { kind = i ? 0 : 1; run(); });
      ctx.toggle("serpentine", false, (v) => { serp = v; run(); });
      ctx.toggle("放大 4×", false, (v) => wrap.classList.toggle("gj-zoom", v));
      run();
    },
  },
  {
    id: "workers", title: "Worker 與事件",
    api: 'new GIF({ workers: n }); gif.on("start" | "progress" | "finished" | "abort"); gif.abort()',
    desc: "每個 Worker 一次處理一格，影格平均分給多個 Worker 平行量化。右側即時列出 gif.js 發出的事件；按「中止」會呼叫 abort() 終止進行中的 Worker。",
    hint: `同一組 36 格 320px 動畫，依序用 1、2、4、8 個 Worker 編碼（此裝置回報 ${CORES} 個邏輯核心）`,
    mount(ctx) {
      const WS = [1, 2, 4, 8];
      ctx.html(`<div class="gj-wrap gj-side">
        <section class="gj-card"><header><b>編碼耗時</b><span>36f・320×320</span></header><div class="gj-bars">
          ${WS.map((w) => `<div class="gj-bar"><span>workers: <b class="mono">${w}</b></span><div class="t"><i class="p"></i><i></i></div><span class="v">未測</span></div>`).join("")}
        </div></section>
        <section class="gj-card"><header><b>事件記錄</b><span>gif.on(…)</span></header><div class="gj-log"></div></section></div>`);
      const rows = ctx.$$(".gj-bar");
      const log = ctx.$(".gj-log");
      const frames = paintFrames((g, t) => PAINTERS.rings(g, 320, t), 320, 320, 36);
      let current = null, token = 0;
      const t00 = performance.now();
      const add = (ev, msg) => {
        const line = Showcase.h("div");
        line.innerHTML = `<span>${((performance.now() - t00) / 1000).toFixed(2)}s</span> <b class="ev-${ev}">${ev}</b> ${msg}`;
        log.append(line);
        while (log.children.length > 40) log.firstElementChild.remove();
      };
      async function run() {
        current?.abort();
        const my = ++token;
        rows.forEach((r) => { r.classList.remove("best"); r.querySelector(".v").textContent = "未測"; r.querySelectorAll("i").forEach((i) => (i.style.width = "0")); });
        const times = [];
        for (let k = 0; k < WS.length; k++) {
          const r = rows[k];
          const [pBar, tBar] = r.querySelectorAll("i");
          r.querySelector(".v").textContent = "編碼中…";
          let lastQ = -1;
          try {
            const { blob, ms } = await encode(ctx, frames, { workers: WS[k] }, {
              delay: 40,
              onGif: (g) => (current = g),
              onEvent: () => add("start", `workers=${WS[k]}`),
              onProgress: (p) => {
                pBar.style.width = `${p * 100}%`;
                const q = Math.floor(p * 4);
                if (q !== lastQ) { lastQ = q; add("progress", `${Math.round(p * 100)}%`); }
              },
            });
            if (my !== token) return;
            add("finished", `${KB(blob.size)}・${MS(ms)}`);
            times[k] = ms;
            r.querySelector(".v").textContent = MS(ms);
          } catch {
            add("abort", `workers=${WS[k]} 已終止`);
            r.querySelector(".v").textContent = "已中止";
            if (my !== token) return;
          }
          current = null;
          const max = Math.max(...times.filter(Boolean));
          rows.forEach((x, j) => { if (times[j]) x.querySelectorAll("i")[1].style.width = `${(times[j] / max) * 100}%`; });
          pBar.style.width = "0";
        }
        const valid = times.map((t, i) => [t, i]).filter(([t]) => t);
        if (valid.length) rows[valid.sort((a, b) => a[0] - b[0])[0][1]].classList.add("best");
      }
      ctx.button("重新測試", run, { primary: true });
      ctx.button("中止", () => current?.abort());
      run();
    },
  },
  {
    id: "delay", title: "延遲與循環",
    api: "gif.addFrame(frame, { delay }); new GIF({ repeat: 0 | -1 | 2 })",
    desc: "每一格可以有自己的 delay：打字時每字一格，句尾停留 1.5 秒，游標閃爍 400 ms。repeat 控制循環：0 無限、-1 只播一次、2 再重播 2 次。",
    hint: "GIF 延遲以 10 ms 為單位；多數瀏覽器會把 10 ms 以下的延遲當成 100 ms，選「10 ms」看看反而變慢",
    mount(ctx) {
      ctx.html(`<div class="gj-wrap gj-stack">${card("打字機 GIF", "", "gj-chk")}
        <section class="gj-card gj-tl"><div class="row"></div><div class="cap"><span>每格 delay（寬度＝停留時間）</span><span class="mono"></span></div></section></div>`);
      const outCard = ctx.$(".gj-card");
      const row = ctx.$(".gj-tl .row");
      const cap = ctx.$(".gj-tl .cap .mono");
      const slot = gifSlot(ctx, outCard.querySelector(".gj-pic"), "打字機效果 GIF");
      const TEXT = "gif.js：每一格都有自己的 delay";
      const SPEEDS = [20, 60, 120, 10];
      const REPEATS = [0, -1, 2];
      let speed = 60, repeat = 0, token = 0;
      const W = 480, H = 120;
      const paint = (g, shown, cursor) => {
        g.fillStyle = "#14161a"; g.fillRect(0, 0, W, H);
        g.fillStyle = "#f7df1e"; g.fillRect(0, 0, 6, H);
        g.font = `600 24px ${FONT}`; g.textBaseline = "middle"; g.textAlign = "left";
        g.fillStyle = "#ecebe6";
        g.fillText(shown, 26, H / 2);
        if (cursor) { g.fillStyle = "#4cc9f0"; g.fillRect(26 + g.measureText(shown).width + 3, H / 2 - 15, 3, 30); }
      };
      async function run() {
        const my = ++token;
        const chars = [...TEXT];
        const g = ctx2d(W, H);
        const frames = [], delays = [], kinds = [];
        for (let i = 0; i <= chars.length; i++) {
          paint(g, chars.slice(0, i).join(""), true);
          frames.push(g.getImageData(0, 0, W, H));
          const end = i === chars.length;
          const pause = "：，".includes(chars[i - 1]);
          delays.push(end ? 1500 : pause ? speed * 5 : speed);
          kinds.push(end ? "long" : pause ? "long" : "");
        }
        for (let b = 0; b < 4; b++) {
          paint(g, TEXT, b % 2 === 1);
          frames.push(g.getImageData(0, 0, W, H));
          delays.push(400); kinds.push("blink");
        }
        row.innerHTML = delays.map((d, i) => `<i class="${kinds[i]}" style="flex:${d <= 10 ? 100 : d}"></i>`).join("");
        const total = delays.reduce((a, d) => a + (d <= 10 ? 100 : d), 0);
        cap.innerHTML = `${frames.length}f・${(total / 1000).toFixed(2)} s/loop` + (speed <= 10 ? ` <span class="warn">10 ms → 100 ms</span>` : "");
        outCard.querySelector(".gj-info").textContent = "編碼中…";
        const { blob } = await encode(ctx, frames, { repeat, workers: 2 }, { delays, onProgress: (p) => meter(outCard, p) });
        if (my !== token) return;
        meter(outCard, null);
        slot.show(blob);
        outCard.querySelector(".gj-info").textContent = `repeat: ${repeat}・${KB(blob.size)}`;
      }
      ctx.group(SPEEDS.map((s) => `${s} ms`), 1, (i) => { speed = SPEEDS[i]; run(); });
      ctx.group(["無限循環", "只播一次", "重播 2 次"], 0, (i) => { repeat = REPEATS[i]; run(); });
      ctx.button("重播", () => slot.replay());
      run();
    },
  },
  {
    id: "transparent", title: "透明背景",
    api: "new GIF({ transparent: 0xFF00FF })",
    desc: "GIF 只有 1 位元透明：指定一個鍵色，量化後最接近它的那一色變成透明。抗鋸齒邊緣混到鍵色會留下洋紅毛邊；先把 alpha 二值化成硬邊就乾淨。",
    hint: "切換底色看毛邊；鍵色要選畫面中不會出現的顏色",
    mount(ctx) {
      ctx.html(`<div class="gj-wrap gj-two">
        <section class="gj-card"><header><b>送進編碼器的影格</b><span>key #FF00FF</span></header><div class="gj-pic"><canvas width="240" height="240"></canvas></div></section>
        ${card("輸出 GIF", "", "gj-chk")}</div>`);
      const outCard = ctx.$$(".gj-card")[1];
      const pic = outCard.querySelector(".gj-pic");
      const slot = gifSlot(ctx, pic, "透明背景貼紙 GIF");
      const view = ctx.$("canvas").getContext("2d");
      const S = 240, N = 24;
      let hard = false, token = 0;
      const frameAt = (t) => {
        const g = ctx2d(S, S);
        if (!hard) {
          g.fillStyle = "#ff00ff"; g.fillRect(0, 0, S, S);
          paintSticker(g, S, t);
          return g.getImageData(0, 0, S, S);
        }
        paintSticker(g, S, t);
        const im = g.getImageData(0, 0, S, S), d = im.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 128) { d[i] = 255; d[i + 1] = 0; d[i + 2] = 255; }
          d[i + 3] = 255;
        }
        return im;
      };
      ctx.raf((t) => view.putImageData(frameAt((t % 2400) / 2400), 0, 0));
      async function run() {
        const my = ++token;
        const frames = Array.from({ length: N }, (_, i) => frameAt(i / N));
        outCard.querySelector(".gj-info").textContent = "編碼中…";
        const { blob } = await encode(ctx, frames, { transparent: 0xff00ff, workers: 2 }, { delay: 100, onProgress: (p) => meter(outCard, p) });
        if (my !== token) return;
        meter(outCard, null);
        slot.show(blob);
        outCard.querySelector(".gj-info").textContent = `${N}f・${KB(blob.size)}`;
      }
      ctx.group(["抗鋸齒邊緣", "硬邊二值化"], 0, (i) => { hard = i === 1; run(); });
      const BG = ["gj-chk", "gj-bg-white", "gj-bg-dark", "gj-bg-yellow"];
      ctx.group(["棋盤", "白", "黑", "黃"], 0, (i) => { pic.classList.remove(...BG); pic.classList.add(BG[i]); });
      run();
    },
  },
  {
    id: "record", title: "錄製畫布",
    api: "gif.addFrame(ctx.getImageData(0, 0, w, h), { delay: 1000 / fps })",
    desc: "把互動中的 Canvas 依固定影格率擷取成 ImageData，錄完再一次交給 gif.js。適合做操作示範或分享小動畫；fps 與秒數直接決定影格數與檔案大小。",
    hint: "在左邊畫面拖曳會噴出光點，按「錄製」開始擷取",
    mount(ctx) {
      ctx.html(`<div class="gj-wrap gj-two">
        <section class="gj-card"><header><b>互動畫布</b><span>360×270</span></header><div class="gj-pic"><canvas class="gj-draw" width="360" height="270"></canvas><div class="gj-rec">● REC</div></div></section>
        ${card("錄好的 GIF", "", "gj-chk")}</div>`);
      const cv = ctx.$("canvas");
      const g = cv.getContext("2d", { willReadFrequently: true });
      const rec = ctx.$(".gj-rec");
      const outCard = ctx.$$(".gj-card")[1];
      outCard.querySelector(".gj-empty").textContent = "按「錄製」擷取左邊畫面";
      const slot = gifSlot(ctx, outCard.querySelector(".gj-pic"), "錄製畫布的 GIF");
      const W = 360, H = 270, parts = [];
      let pointer = null, fps = 15, secs = 2, capture = null;
      const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
      const emit = (x, y, n) => {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * Math.PI * 2, v = 0.5 + Math.random() * 2.2;
          parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: 1, c: COLORS[(Math.random() * 6) | 0] });
        }
      };
      const toLocal = (e) => {
        const r = cv.getBoundingClientRect();
        const k = Math.min(r.width / W, r.height / H);
        return { x: (e.clientX - r.left - (r.width - W * k) / 2) / k, y: (e.clientY - r.top - (r.height - H * k) / 2) / k };
      };
      ctx.on(cv, "pointerdown", (e) => { pointer = toLocal(e); cv.setPointerCapture(e.pointerId); });
      ctx.on(cv, "pointermove", (e) => { if (pointer) pointer = toLocal(e); });
      ctx.on(cv, "pointerup", () => (pointer = null));
      ctx.raf((t, dt) => {
        const k = dt / 16.7;
        g.fillStyle = "rgba(17, 19, 26, 0.22)";
        g.fillRect(0, 0, W, H);
        const gx = W / 2 + Math.cos(t / 900) * W * 0.32, gy = H / 2 + Math.sin(t / 650) * H * 0.3;
        emit(gx, gy, 2);
        if (pointer) emit(pointer.x, pointer.y, 6);
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.05 * k; p.life -= 0.012 * k;
          if (p.life <= 0) { parts.splice(i, 1); continue; }
          g.globalAlpha = p.life;
          g.fillStyle = p.c;
          g.beginPath(); g.arc(p.x, p.y, 2 + p.life * 3, 0, Math.PI * 2); g.fill();
        }
        g.globalAlpha = 1;
        if (capture) {
          capture.acc += dt;
          while (capture.acc >= 1000 / fps && capture.frames.length < capture.total) {
            capture.acc -= 1000 / fps;
            capture.frames.push(g.getImageData(0, 0, W, H));
          }
          rec.textContent = `● REC ${capture.frames.length} / ${capture.total}`;
          if (capture.frames.length >= capture.total) finish();
        }
      });
      async function finish() {
        const frames = capture.frames;
        capture = null;
        rec.classList.remove("on");
        const info = outCard.querySelector(".gj-info");
        info.textContent = "編碼中…";
        const { blob, ms } = await encode(ctx, frames, { workers: Math.min(4, CORES) }, { delay: Math.round(1000 / fps), onProgress: (p) => meter(outCard, p) });
        meter(outCard, null);
        slot.show(blob);
        info.textContent = `${frames.length}f・${fps}fps・${KB(blob.size)}・${MS(ms)}`;
        recBtn.disabled = false;
      }
      ctx.group(["10 fps", "15 fps", "20 fps"], 1, (i) => (fps = [10, 15, 20][i]));
      ctx.group(["2 秒", "4 秒"], 0, (i) => (secs = [2, 4][i]));
      const recBtn = ctx.button("錄製", () => {
        recBtn.disabled = true;
        rec.classList.add("on");
        capture = { frames: [], total: fps * secs, acc: 1000 / fps };
      }, { primary: true });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new GIF({ workers }); gif.addFrame(imageData) × n; gif.render()",
    desc: "逐級加倍影格數，量 render() 到 finished 的時間與輸出大小。尺寸用下方按鈕切換後再開始測試。",
    hint: "按「開始測試」；每一級完成後右側顯示該級的輸出",
    mount(ctx) {
      ctx.html(`<div class="gj-stress">${card("最近一次輸出", "", "gj-chk")}</div>`);
      const outCard = ctx.$(".gj-card");
      outCard.querySelector(".gj-empty").textContent = "按「開始測試」";
      const slot = gifSlot(ctx, outCard.querySelector(".gj-pic"), "極限測試輸出");
      const SIDES = [160, 240, 360];
      const workers = Math.min(4, CORES);
      let side = 240;
      ctx.controls.classList.add("bottom");
      ctx.group(SIDES.map((s) => `${s} px`), 1, (i) => (side = SIDES[i]));
      ctx.bench({
        label: "影格數", unit: "格", sizes: [10, 20, 40, 80, 160, 320],
        target: 3000, budget: 12000,
        prepare: (n) => paintFrames((g, t) => PAINTERS.rings(g, side, t), side, side, n),
        async run(n, frames) {
          const { blob } = await encode(ctx, frames, { workers }, { delay: Math.round(PERIOD / n * 2), onProgress: (p) => meter(outCard, p) });
          meter(outCard, null);
          slot.show(blob);
          outCard.querySelector(".gj-info").textContent = `${side}×${side}・${n}f・${KB(blob.size)}`;
          return `${side}px・${KB(blob.size)}`;
        },
        note: `計時範圍是 render() 到 finished：包含 ${workers} 個 Worker 啟動、每格各自用 NeuQuant 建調色盤、LZW 壓縮與組檔；影格事先畫好不計時。每格都獨立量化，耗時大致隨「影格數 × 像素數」成長，記憶體也要同時保留所有影格。Worker 數、quality 取樣間隔、dither 開關都會明顯改變結果。`,
      });
    },
  },
] });
</script>
</body>
</html>
