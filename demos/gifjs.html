<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gif.js 示範：Canvas 動畫轉 GIF</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":[],"note":"在瀏覽器內用 Web Worker 把 Canvas 影格編碼成無縫循環 GIF"}</script>
<style>
  body { display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px; padding: 14px 14px 46px; height: 100%; }
  .views { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
  .view { display: flex; flex-direction: column; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); overflow: hidden; }
  .view header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .view header b { font-weight: 700; }
  .view header span { font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pic { position: relative; flex: 1; min-height: 0; }
  .pic canvas, .pic img { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); object-fit: contain; display: block; }
  .out .pic { background: repeating-conic-gradient(#1b1e23 0 25%, #14161a 0 50%) 0 0 / 16px 16px; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .meter { position: absolute; left: 12px; right: 12px; bottom: 12px; height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.12); overflow: hidden; opacity: 0; transition: opacity .2s; }
  .meter.on { opacity: 1; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); }

  .panel-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; background: var(--bg-2); color: var(--fg); padding: 6px 11px; cursor: pointer; font: 13px var(--font); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .field { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .field select, .field input[type=text] { background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; color: var(--fg); font: 13px var(--font); }
  .field input[type=text] { width: 110px; }
  .field input[type=range] { width: 90px; accent-color: var(--accent); }
  .field output { font: 12px var(--mono); color: var(--fg); min-width: 18px; }
  .actions { display: inline-flex; gap: 8px; margin-left: auto; }
  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    body { padding: 10px 10px 42px; gap: 8px; }
    .views { gap: 8px; }
    .view header { padding: 6px 8px; font-size: 12px; }
    .view header span { display: none; }
    .panel-row { gap: 6px 8px; }
    .seg button { padding: 5px 8px; font-size: 12px; }
    .hide-narrow { display: none; }
    .actions { margin-left: 0; flex: 1 1 100%; }
    .actions .btn { flex: 1; }
  }
</style>
</head>
<body>
<div class="views">
  <section class="view">
    <header><b>即時畫面（Canvas）</b><span id="liveInfo">1.5 秒循環</span></header>
    <div class="pic"><canvas id="live" width="320" height="320"></canvas></div>
  </section>
  <section class="view out">
    <header><b>輸出 GIF</b><span id="outInfo">尚未產生</span></header>
    <div class="pic" id="outPic">
      <div class="empty" id="empty">按「產生 GIF」開始編碼</div>
      <div class="meter" id="meter"><i id="meterFill"></i></div>
    </div>
  </section>
</div>
<div class="panel-row">
  <div class="seg" id="preset">
    <button data-p="ball" class="on">彈跳球</button><button data-p="rings">旋轉圓環</button><button data-p="wave">文字波浪</button>
  </div>
  <label class="field" id="textField" hidden>文字<input type="text" id="text" value="哈囉 GIF" maxlength="8"></label>
  <label class="field">影格<select id="frames"><option>20</option><option selected>30</option><option>40</option></select></label>
  <label class="field">尺寸<select id="size"><option value="240">240</option><option value="320" selected>320</option></select></label>
  <label class="field hide-narrow">取樣間隔<input type="range" id="quality" min="1" max="20" value="10"><output id="qOut">10</output></label>
  <label class="field hide-narrow">抖色<select id="dither"><option value="">關閉</option><option value="FloydSteinberg">Floyd</option><option value="Atkinson">Atkinson</option></select></label>
  <div class="actions">
    <button class="btn primary" id="go">產生 GIF</button>
    <button class="btn" id="dl" disabled>下載 GIF</button>
  </div>
</div>
<div class="hint">換動畫或參數後按「產生 GIF」，取樣間隔越小色彩越精細</div>

<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
// gif.js: frames are quantised and LZW-encoded inside Web Workers, so the page stays responsive.
// Cross-origin workers are not allowed, so the CDN worker is wrapped in a same-origin blob.
const WORKER_URL = URL.createObjectURL(new Blob(
  ['importScripts("https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js");'],
  { type: "application/javascript" },
));
const PERIOD = 1500; // every preset loops seamlessly over this many ms
const $ = (id) => document.getElementById(id);
const live = $("live");
const liveCtx = live.getContext("2d");
let preset = "ball";
let lastUrl = null;
let busy = false;

// Each painter draws one frame for loop phase t in [0, 1) on a square canvas of side s.
const PAINTERS = {
  ball(ctx, s, t) {
    const sky = ctx.createLinearGradient(0, 0, 0, s);
    sky.addColorStop(0, "#ffd36e");
    sky.addColorStop(1, "#ff7a59");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, s, s);
    const floor = s * 0.82;
    ctx.fillStyle = "#3a2a4d";
    ctx.fillRect(0, floor, s, s - floor);
    const r = s * 0.11;
    // A short ground-contact window around t = 0 squashes the ball; the rest is a parabola.
    const C = 0.14;
    const d = Math.min(t, 1 - t);
    const onGround = d < C / 2;
    const u = onGround ? 0 : (t - C / 2) / (1 - C);
    const h = onGround ? 0 : 4 * u * (1 - u);
    const contact = onGround ? Math.cos((d / (C / 2)) * Math.PI / 2) : 0;
    const speed = onGround ? 0 : Math.abs(1 - 2 * u);
    const sx = 1 + 0.4 * contact - 0.12 * speed * (1 - contact);
    const sy = 1 - 0.32 * contact + 0.16 * speed * (1 - contact);
    const cy = floor - r * sy - h * s * 0.52;
    ctx.fillStyle = `rgba(20, 10, 30, ${0.35 - h * 0.2})`;
    ctx.beginPath();
    ctx.ellipse(s / 2, floor + 3, r * (1.2 - h * 0.5) * sx, r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(s / 2, cy);
    ctx.scale(sx, sy);
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    g.addColorStop(0, "#fff6c2");
    g.addColorStop(0.35, "#f7df1e");
    g.addColorStop(1, "#c9a400");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.rotate(t * Math.PI * 2);
    ctx.strokeStyle = "rgba(26, 26, 20, 0.85)";
    ctx.lineWidth = r * 0.16;
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.62, -0.6, 0.6);
    ctx.stroke();
    ctx.restore();
    ctx.fillStyle = "#3a2a4d";
    ctx.font = `800 ${s * 0.075}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign = "center";
    ctx.fillText("BOING", s / 2, s * 0.14 + Math.sin(t * Math.PI * 2) * 3);
  },
  rings(ctx, s, t) {
    ctx.fillStyle = "#11131a";
    ctx.fillRect(0, 0, s, s);
    const colors = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42"];
    const turns = [1, -2, 3, -1, 2]; // whole turns per loop keep the GIF seamless
    ctx.lineCap = "round";
    colors.forEach((c, i) => {
      const r = s * (0.12 + i * 0.075);
      const len = Math.PI * (0.6 + 0.5 * (1 + Math.sin((t + i * 0.13) * Math.PI * 2)));
      const a = turns[i] * t * Math.PI * 2 + i;
      ctx.strokeStyle = c;
      ctx.lineWidth = s * 0.04;
      ctx.beginPath();
      ctx.arc(s / 2, s / 2, r, a, a + len);
      ctx.stroke();
      ctx.globalAlpha = 0.18;
      ctx.beginPath();
      ctx.arc(s / 2, s / 2, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    });
    const pulse = 0.5 + 0.5 * Math.cos(t * Math.PI * 4);
    ctx.fillStyle = "#ecebe6";
    ctx.beginPath();
    ctx.arc(s / 2, s / 2, s * (0.035 + pulse * 0.025), 0, Math.PI * 2);
    ctx.fill();
  },
  wave(ctx, s, t) {
    const bg = ctx.createLinearGradient(0, 0, s, s);
    bg.addColorStop(0, "#2b1055");
    bg.addColorStop(1, "#7597de");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, s, s);
    const chars = [...($("text").value || "GIF")];
    const fs = Math.min(s * 0.24, (s * 0.86) / Math.max(1, chars.length) * 1.15);
    ctx.font = `900 ${fs}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const widths = chars.map((c) => ctx.measureText(c).width);
    let x = s / 2 - widths.reduce((a, b) => a + b, 0) / 2;
    chars.forEach((c, i) => {
      const ph = (t + i / Math.max(4, chars.length)) * Math.PI * 2;
      const y = s / 2 + Math.sin(ph) * s * 0.11;
      const hue = (t * 360 + i * 40) % 360;
      const cx = x + widths[i] / 2;
      ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
      ctx.fillText(c, cx + 3, y + 5);
      ctx.fillStyle = `hsl(${hue} 95% 68%)`;
      ctx.save();
      ctx.translate(cx, y);
      ctx.rotate(Math.cos(ph) * 0.18);
      ctx.fillText(c, 0, 0);
      ctx.restore();
      x += widths[i];
    });
  },
};

function tick(now) {
  PAINTERS[preset](liveCtx, live.width, (now % PERIOD) / PERIOD);
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

$("preset").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || busy) return;
  preset = b.dataset.p;
  [...$("preset").children].forEach((x) => x.classList.toggle("on", x === b));
  $("textField").hidden = preset !== "wave";
});
$("quality").addEventListener("input", (e) => { $("qOut").textContent = e.target.value; });

function render() {
  if (busy) return;
  busy = true;
  const size = Number($("size").value);
  const frames = Number($("frames").value);
  const delay = Math.round(PERIOD / frames);
  const gif = new GIF({
    workers: 2,
    workerScript: WORKER_URL,
    quality: Number($("quality").value),
    dither: $("dither").value || false,
    width: size,
    height: size,
  });
  const off = document.createElement("canvas");
  off.width = off.height = size;
  const ctx = off.getContext("2d", { willReadFrequently: true });
  for (let i = 0; i < frames; i++) {
    PAINTERS[preset](ctx, size, i / frames);
    gif.addFrame(ctx, { copy: true, delay });
  }
  const t0 = performance.now();
  $("go").disabled = true;
  $("go").textContent = "編碼中…";
  $("meter").classList.add("on");
  gif.on("progress", (p) => {
    $("meterFill").style.width = `${Math.round(p * 100)}%`;
    $("outInfo").textContent = `編碼中 ${Math.round(p * frames)} / ${frames} 影格`;
  });
  gif.on("finished", (blob) => {
    const secs = ((performance.now() - t0) / 1000).toFixed(1);
    gif.freeWorkers.forEach((w) => w.terminate());
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    const img = new Image();
    img.alt = "gif.js 產生的動畫 GIF";
    img.src = lastUrl;
    $("outPic").querySelector("img")?.remove();
    $("empty").hidden = true;
    $("outPic").prepend(img);
    $("outInfo").textContent = `${size}×${size}・${frames} 影格・${(blob.size / 1024).toFixed(0)} KB・${secs} 秒`;
    $("meter").classList.remove("on");
    $("dl").disabled = false;
    $("go").disabled = false;
    $("go").textContent = "產生 GIF";
    busy = false;
  });
  gif.render();
}

$("go").onclick = render;
$("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = lastUrl;
  a.download = `gifjs-${preset}.gif`;
  a.click();
};
render();
</script>
</body>
</html>
