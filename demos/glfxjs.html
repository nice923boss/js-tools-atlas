<script src="https://cdn.jsdelivr.net/npm/glfx@0.0.4/glfx.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// glfx.js showcase: GPU filters on a WebGL1 canvas, from interactive filters to a filter-chain FPS ramp.
const { h, fmtMs, fmtCompact } = Showcase;
const PHOTO = (n) => `_shared/img/photo-${n}.jpg`;
const PHOTOS = [5, 1, 2, 3, 6, 7];
const NO_GL = "此瀏覽器或裝置無法建立 WebGL 1 context，glfx.js 需要 WebGL 才能執行。請開啟瀏覽器的硬體加速，或改用支援 WebGL 的瀏覽器。";

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`圖片載入失敗：${src}`));
    img.src = src;
  });
}
// Downscale very large sources so they fit comfortably in a texture.
function limit(img, max = 2400) {
  const s = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
  if (s === 1) return img;
  const c = h("canvas", { width: Math.round(img.naturalWidth * s), height: Math.round(img.naturalHeight * s) });
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
// Create a glfx canvas; returns null when WebGL is unavailable. The GL context is released on cleanup.
function makeFx(ctx) {
  let cv;
  try { cv = fx.canvas(); } catch (e) { console.warn("[glfx] WebGL unavailable:", e); return null; }
  ctx.onCleanup(() => { cv._.gl.getExtension("WEBGL_lose_context")?.loseContext(); cv.width = cv.height = 1; cv.remove(); });
  return cv;
}
// A view box holding one glfx canvas (object-fit: contain) plus coordinate helpers.
function fxView(ctx, host) {
  const view = h("div", { class: "gx-view" });
  host.append(view);
  const cv = makeFx(ctx);
  if (!cv) { view.append(h("div", { class: "gx-err", text: NO_GL })); return null; }
  view.append(cv);
  let tex = null, src = null;
  ctx.onCleanup(() => tex && tex.destroy());
  const box = () => {
    const r = cv.getBoundingClientRect(), vr = view.getBoundingClientRect();
    const s = Math.min(r.width / cv.width, r.height / cv.height);
    return { s, x: r.left - vr.left + (r.width - cv.width * s) / 2, y: r.top - vr.top + (r.height - cv.height * s) / 2, vr };
  };
  return {
    view, cv,
    get tex() { return tex; }, get src() { return src; },
    get W() { return tex ? tex._.width : 1; }, get H() { return tex ? tex._.height : 1; },
    setImage(el) { if (tex) tex.destroy(); tex = cv.texture(el); src = el; cv.draw(tex).update(); },
    toImage(e) { const b = box(); return [(e.clientX - b.vr.left - b.x) / b.s, (e.clientY - b.vr.top - b.y) / b.s]; },
    toView(x, y) { const b = box(); return [b.x + x * b.s, b.y + y * b.s, b.s]; },
  };
}
// Range sliders written into el; values[key] is updated in place.
function params(el, defs, values, onChange, tip) {
  el.replaceChildren();
  for (const [key, label, min, max, step, val, fmt] of defs) {
    values[key] = values[key] ?? val;
    const out = h("output");
    const input = h("input", { type: "range", min, max, step, value: values[key], "aria-label": label });
    const show = () => { out.textContent = fmt ? fmt(+input.value) : String(+(+input.value).toFixed(step < 1 ? 2 : 0)); };
    input.addEventListener("input", () => { values[key] = +input.value; show(); onChange(); });
    show();
    el.append(h("label", {}, label, input, out));
  }
  if (tip) el.append(h("span", { class: "gx-tip", text: tip }));
}
// Draggable handles positioned in image pixel space.
function handles(ctx, v, list, onMove) {
  const els = list.map((p, i) => {
    const el = h("div", { class: `gx-h ${p.cls || ""}`, text: p.label || "" });
    v.view.append(el);
    el.addEventListener("pointerdown", (e) => { e.stopPropagation(); el.setPointerCapture(e.pointerId); el.dataset.drag = "1"; });
    el.addEventListener("pointermove", (e) => {
      if (!el.dataset.drag) return;
      const [x, y] = v.toImage(e);
      onMove(i, Math.max(-v.W * 0.25, Math.min(v.W * 1.25, x)), Math.max(-v.H * 0.25, Math.min(v.H * 1.25, y)));
    });
    el.addEventListener("pointerup", () => { delete el.dataset.drag; });
    return el;
  });
  const place = () => list.forEach((p, i) => {
    const [x, y] = v.toView(p.x, p.y);
    els[i].style.left = `${x}px`; els[i].style.top = `${y}px`; els[i].hidden = !!p.hidden;
  });
  ctx.onResize(place);
  return { els, place };
}
function filePicker(ctx, onUrl) {
  const input = h("input", { type: "file", accept: "image/*", hidden: true });
  ctx.el.append(input);
  let url = null;
  ctx.on(input, "change", () => {
    const f = input.files[0];
    if (!f) return;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(f);
    input.value = "";
    onUrl(url);
  });
  ctx.onCleanup(() => url && URL.revokeObjectURL(url));
  return ctx.button("選擇自己的圖片", () => input.click(), { title: "從本機選圖，不會上傳" });
}
// Load a photo (index into PHOTOS or a URL) into a view; reports failures in the code chip.
async function usePhoto(ctx, v, src) {
  const img = limit(await loadImage(typeof src === "number" ? PHOTO(PHOTOS[src]) : src));
  if (ctx.active) v.setImage(img);
  return img;
}
function frameLoop(ctx, render) {
  let queued = false;
  return () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; if (ctx.active) render(); }); };
}
const code = (v, text) => {
  let el = v.view.querySelector(".gx-code");
  if (!el) { el = h("div", { class: "gx-code" }); v.view.append(el); }
  el.textContent = text;
};
const n0 = (x) => Math.round(x);
const fmtBytes = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(2)} MB` : `${(n / 1024).toFixed(1)} KB`);

Showcase.run({ scenes: [
  {
    id: "lab", title: "互動濾鏡實驗室",
    api: "fx.canvas()・canvas.texture(img)・canvas.draw(texture).swirl(x, y, r, a).update()",
    desc: "把照片上傳成 WebGL 紋理，每次拖動滑桿或指標就重新跑一次著色器。七種濾鏡涵蓋扭曲、模糊、像素化、網點與調色，開啟「對照原圖」可看左右差異。",
    hint: "選濾鏡後拖動滑桿・在照片上按住拖曳移動效果中心",
    mount(ctx) {
      ctx.html(`<div class="gx-col"><div class="gx-host" style="display:contents"></div><div class="panel gx-params"></div></div>`);
      const v = fxView(ctx, ctx.$(".gx-host"));
      if (!v) return;
      const FILTERS = [
        { name: "漩渦", center: true, p: [["radius", "半徑", 50, 600, 1, 320], ["angle", "角度", -20, 20, 0.1, 4]],
          apply: (c, p, x, y) => c.swirl(x, y, p.radius, p.angle), code: (p, x, y) => `swirl(${x}, ${y}, ${p.radius}, ${p.angle})` },
        { name: "鼓起收縮", center: true, p: [["radius", "半徑", 50, 600, 1, 300], ["strength", "強度", -1, 1, 0.01, 0.7]],
          apply: (c, p, x, y) => c.bulgePinch(x, y, p.radius, p.strength), code: (p, x, y) => `bulgePinch(${x}, ${y}, ${p.radius}, ${p.strength})` },
        { name: "移軸攝影", center: true, p: [["blur", "模糊", 0, 50, 1, 22], ["gradient", "清晰帶", 20, 500, 1, 160]],
          apply: (c, p, x, y, w) => c.tiltShift(0, y, w, y, p.blur, p.gradient), code: (p, x, y, w) => `tiltShift(0, ${y}, ${w}, ${y}, ${p.blur}, ${p.gradient})` },
        { name: "六角馬賽克", center: true, p: [["scale", "格子", 6, 80, 1, 22]],
          apply: (c, p, x, y) => c.hexagonalPixelate(x, y, p.scale), code: (p, x, y) => `hexagonalPixelate(${x}, ${y}, ${p.scale})` },
        { name: "彩色網點", center: true, p: [["size", "網點", 3, 20, 0.5, 6], ["angle", "角度", 0, 1.57, 0.01, 0.25]],
          apply: (c, p, x, y) => c.colorHalftone(x, y, p.angle, p.size), code: (p, x, y) => `colorHalftone(${x}, ${y}, ${p.angle}, ${p.size})` },
        { name: "墨水素描", p: [["strength", "強度", 0, 1, 0.01, 0.6]], apply: (c, p) => c.ink(p.strength), code: (p) => `ink(${p.strength})` },
        { name: "電影調色", p: [["hue", "色相", -1, 1, 0.01, -0.08], ["sat", "飽和", -1, 1, 0.01, 0.35], ["contrast", "對比", -1, 1, 0.01, 0.2], ["vig", "暗角", 0, 1, 0.01, 0.6]],
          apply: (c, p) => c.hueSaturation(p.hue, p.sat).brightnessContrast(0, p.contrast).vignette(0.5, p.vig),
          code: (p) => `hueSaturation(${p.hue}, ${p.sat}).brightnessContrast(0, ${p.contrast}).vignette(0.5, ${p.vig})` },
      ];
      let cur = FILTERS[0], values = {}, cx = 0, cy = 0, photo = 0, orig = null;
      const dot = h("div", { class: "gx-dot" });
      v.view.append(dot);
      v.view.classList.add("gx-pick");
      const render = () => {
        if (!v.tex) return;
        cur.apply(v.cv.draw(v.tex), values, cx, cy, v.W).update();
        const [x, y] = v.toView(cx, cy);
        dot.style.left = `${x}px`; dot.style.top = `${y}px`; dot.hidden = !cur.center;
        code(v, `canvas.draw(texture).${cur.code(values, n0(cx), n0(cy), v.W)}.update()`);
      };
      const schedule = frameLoop(ctx, render);
      const select = (i) => {
        cur = FILTERS[i]; values = {};
        params(ctx.$(".gx-params"), cur.p, values, schedule, cur.center ? "可在照片上拖曳中心點" : "整張照片套用");
        schedule();
      };
      const load = async (src) => {
        await usePhoto(ctx, v, src);
        cx = v.W / 2; cy = v.H / 2;
        if (orig) orig.src = typeof src === "number" ? PHOTO(PHOTOS[src]) : src;
        schedule();
      };
      const pointer = (e) => { if (!cur.center) return; [cx, cy] = v.toImage(e); schedule(); };
      ctx.on(v.view, "pointerdown", (e) => { v.view.setPointerCapture(e.pointerId); pointer(e); });
      ctx.on(v.view, "pointermove", (e) => { if (e.buttons) pointer(e); });
      ctx.onResize(schedule);
      ctx.group(FILTERS.map((f) => f.name), 0, select);
      ctx.button("換照片", () => { photo = (photo + 1) % PHOTOS.length; load(photo); }, { primary: true });
      filePicker(ctx, load);
      ctx.toggle("對照原圖", false, (on) => {
        if (orig) { orig.remove(); ctx.$(".gx-split").remove(); orig = null; return; }
        orig = h("img", { class: "gx-orig", alt: "原圖", src: v.src.src || v.src.toDataURL() });
        v.view.append(orig, h("div", { class: "gx-split" }, h("span", { text: "原圖｜濾鏡" })));
      });
      select(0);
      load(photo).catch((e) => code(v, e.message));
    },
  },
  {
    id: "color", title: "色彩調整與直方圖",
    api: "curves(r, g, b)・brightnessContrast・hueSaturation・vibrance・sepia・vignette・drawImage 讀回",
    desc: "六個調色濾鏡依固定順序串接，只有非零的參數才會加入鏈條；曲線可以三個色板分別設定做出冷暖調。右上直方圖把 GPU 結果 drawImage 到小 canvas 即時統計（glfx 0.0.4 的 getPixelArray 在使用浮點紋理的裝置上讀不到資料）。",
    hint: "拖動右側滑桿・切換曲線預設看直方圖怎麼移動",
    mount(ctx) {
      ctx.html(`<div class="gx-board"><div class="gx-host" style="display:contents"></div><div class="panel gx-side">
        <h3>輸出直方圖（RGB）</h3><canvas class="gx-hist" width="440" height="140"></canvas>
        <div class="gx-params"></div><pre class="gx-pre gx-hide-n gx-tall"></pre></div></div>`);
      const v = fxView(ctx, ctx.$(".gx-host"));
      if (!v) return;
      const CURVES = {
        "無": null,
        "S 曲線": [[[0, 0], [0.25, 0.17], [0.75, 0.85], [1, 1]]],
        "褪色底片": [[[0, 0.13], [0.5, 0.5], [1, 0.9]]],
        "冷調": [[[0, 0], [0.5, 0.43], [1, 0.95]], [[0, 0], [0.5, 0.5], [1, 1]], [[0, 0.07], [0.5, 0.59], [1, 1]]],

        const hex = STEPS.find((s) => s.name === "六角馬賽克"), ink = STEPS.find((s) => s.name === "墨水");
        hex.on = ink.on = true;
        STEPS.splice(STEPS.indexOf(hex), 1);
        STEPS.splice(STEPS.indexOf(ink) + 1, 0, hex);
        rows(); schedule();
      });
      let photo = 0;
      ctx.button("換照片", () => { photo = (photo + 1) % PHOTOS.length; usePhoto(ctx, v, photo).then(schedule); });
      filePicker(ctx, (url2) => usePhoto(ctx, v, url2).then(schedule));
      ctx.onResize(schedule);
      rows();
      usePhoto(ctx, v, photo).then(() => { render(); exportPng(); }).catch((e) => code(v, e.message));
    },
  },
  {
    id: "live", title: "即時影像紋理",
    api: "texture.loadContentsOf(canvas2d)・ctx.raf → draw(texture).zoomBlur().update()",
    desc: "右上角是頁內用 Canvas 2D 每幀畫出的動畫，當成影片來源；每一幀用 loadContentsOf 把它重新上傳到同一個紋理，再跑濾鏡。換成 video 元素或攝影機也是同樣寫法。",
    hint: "切換濾鏡看即時效果・左下角是 FPS",
    mount(ctx) {
      ctx.html(`<div class="gx-col" style="grid-template-rows:minmax(0,1fr)"><div class="gx-host" style="display:contents"></div></div>`);
      const v = fxView(ctx, ctx.$(".gx-host"));
      if (!v) return;
      const src = h("canvas", { class: "gx-pip", width: 960, height: 540 });
      v.view.append(src);
      const g = src.getContext("2d");
      const COLORS = ["#f7df1e", "#3ddc97", "#4cc9f0", "#ff6b6b", "#b388ff", "#ffa94d"];
      const paintSource = (t) => {
        const W = 960, H = 540, s = t / 1000;
        const grd = g.createLinearGradient(0, 0, W, H);
        grd.addColorStop(0, `hsl(${(s * 20) % 360} 45% 16%)`); grd.addColorStop(1, `hsl(${(s * 20 + 140) % 360} 50% 10%)`);
        g.fillStyle = grd; g.fillRect(0, 0, W, H);
        for (let i = 0; i < 18; i++) {
          const a = s * (0.3 + (i % 5) * 0.12) + i * 1.7, rr = 120 + (i % 4) * 55;
          g.fillStyle = COLORS[i % COLORS.length]; g.globalAlpha = 0.85;
          g.beginPath(); g.arc(W / 2 + Math.cos(a) * rr * 1.6, H / 2 + Math.sin(a * 1.3) * rr * 0.8, 16 + (i % 3) * 12, 0, Math.PI * 2); g.fill();
        }
        g.globalAlpha = 1;
        for (let i = 0; i < 32; i++) {
          const bh = (Math.sin(s * 3 + i * 0.45) * 0.5 + 0.5) * 120 + 10;
          g.fillStyle = COLORS[(i >> 2) % COLORS.length]; g.fillRect(40 + i * 27, H - 30 - bh, 18, bh);
        }
        g.fillStyle = "#fff"; g.font = "700 92px system-ui, sans-serif"; g.textAlign = "center";
        g.fillText("glfx.js", W / 2, H / 2 + 10);
        g.font = "500 36px ui-monospace, monospace"; g.fillText(`${s.toFixed(2)} s`, W / 2, H / 2 + 62);
      };
      const label = h("div", { class: "gx-piplabel", text: "來源 2D canvas" });
      v.view.append(label);
      const FILTERS = [
        ["原始", () => "", (c) => c],
        ["縮放模糊", (s) => `zoomBlur(cx, cy, 0.3)`, (c, W, H, s) => c.zoomBlur(W / 2 + Math.cos(s) * W * 0.2, H / 2 + Math.sin(s * 1.3) * H * 0.2, 0.3)],
        ["六角馬賽克", () => "hexagonalPixelate(cx, cy, 20)", (c, W, H) => c.hexagonalPixelate(W / 2, H / 2, 20)],
        ["彩色網點", () => "colorHalftone(cx, cy, 0.25, 5)", (c, W, H) => c.colorHalftone(W / 2, H / 2, 0.25, 5)],
        ["邊緣", () => "edgeWork(6)", (c) => c.edgeWork(6)],
        ["漩渦", (s) => `swirl(cx, cy, 300, ${(Math.sin(s) * 6).toFixed(1)})`, (c, W, H, s) => c.swirl(W / 2, H / 2, 300, Math.sin(s) * 6)],
        ["鼓起", () => "bulgePinch(x, y, 200, 0.8)", (c, W, H, s) => c.bulgePinch(W / 2 + Math.cos(s * 0.8) * 260, H / 2, 200, 0.8)],
      ];
      let pick = 1, paused = false, tSrc = 0, tex = null;
      ctx.onCleanup(() => tex && tex.destroy());
      const fps = ctx.fps({ position: "bottom" });
      ctx.group(FILTERS.map((f) => f[0]), pick, (i) => { pick = i; });
      ctx.toggle("暫停來源動畫", false, (on) => { paused = on; });
      const placeLabel = () => { label.style.top = `${src.offsetTop + src.offsetHeight + 4}px`; };
      ctx.onResize(placeLabel);
      ctx.raf((t, dt) => {
        if (!paused) tSrc += dt;
        paintSource(tSrc);
        if (!tex) { tex = v.cv.texture(src); placeLabel(); } else tex.loadContentsOf(src);
        const [, desc, run] = FILTERS[pick];
        run(v.cv.draw(tex), 960, 540, tSrc / 1000).update();
        fps.set("紋理", "960×540");
        code(v, `texture.loadContentsOf(src); canvas.draw(texture)${desc(tSrc / 1000) ? `.${desc(tSrc / 1000)}` : ""}.update()`);
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "每幀 canvas.draw(texture) → N 個濾鏡 pass → update()",
    desc: "每一幀把全景圖重新跑一次 N 個濾鏡（調色、扭曲、描邊、暗角輪流），逐級加倍串接數量直到 FPS 掉到 30 以下；可切換紋理解析度，看像素數與 pass 數哪個先成為瓶頸。",
    hint: "按「自動加壓」開始・可先切換解析度",
    mount(ctx) {
      ctx.html(`<div class="gx-stress"></div>`);
      ctx.controls.classList.add("bottom");
      const v = fxView(ctx, ctx.$(".gx-stress"));
      if (!v) return;
      v.view.style.height = "100%";
      const CHAIN = [
        (c, W, H, s) => c.hueSaturation(Math.sin(s) * 0.1, 0.1),
        (c, W, H, s) => c.swirl(W / 2, H / 2, H * 0.45, Math.sin(s) * 0.6),
        (c) => c.brightnessContrast(0.01, 0.02),
        (c, W, H, s) => c.bulgePinch(W / 2 + Math.cos(s) * W * 0.2, H / 2, H * 0.3, 0.15),
        (c) => c.vibrance(0.05),
        (c) => c.ink(0.08),
        (c) => c.sepia(0.04),
        (c) => c.vignette(0.6, 0.15),
      ];
      const RES = [[1024, 512], [2048, 1024], [4096, 2048]];
      let n = 1, res = 1, pano = null, t = 0;
      const build = () => {
        const [W, H] = RES[res];
        const c2 = h("canvas", { width: W, height: H });
        c2.getContext("2d").drawImage(pano, 0, 0, W, H);
        v.setImage(c2);
      };
      ctx.group(RES.map(([W, H]) => `${W}×${H}`), res, (i) => { res = i; if (pano) build(); });
      loadImage("_shared/img/panorama.jpg").then((img) => { pano = img; if (ctx.active) build(); }).catch((e) => code(v, e.message));
      ctx.raf((now, dt) => {
        if (!v.tex) return;
        t += dt / 1000;
        const c = v.cv.draw(v.tex);
        for (let i = 0; i < n; i++) CHAIN[i % CHAIN.length](c, v.W, v.H, t + i * 0.3);
        c.update();
        code(v, `${v.W}×${v.H}・每幀 ${n} 個 pass・${fmtCompact(v.W * v.H * n)} 像素著色`);
      });
      ctx.ramp({
        label: "串接濾鏡數", unit: "個", steps: [1, 2, 4, 8, 16, 32, 48, 64, 96, 128], minFps: 30,
        apply(k) { n = k; },
        metrics: () => ({ "紋理": `${RES[res][0]}×${RES[res][1]}`, "每幀像素": fmtCompact(RES[res][0] * RES[res][1] * n) }),
        note: "每個濾鏡是一次全畫面 fragment shader pass（讀一張紋理、寫到另一張）。成本約等於 解析度 × pass 數，所以 4096×2048 能承受的串接數約是 1024×512 的十六分之一；若裝置顯示 SwiftShader，代表 WebGL 跑在 CPU 上，數字會偏低。",
      });
    },
  },
] });
</script>
</body>
