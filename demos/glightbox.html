<style>
  /* Shared layout */

  .gl-host { contain: layout paint; container-type: size; min-width: 0; min-height: 0; }

<body>
<script src="_shared/showcase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/glightbox@3.3.1/dist/js/glightbox.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script>
<script>
// GLightbox 3.3.1: one lightbox for images, video, inline HTML and iframes, configured by data attributes or arrays.
const { h, fmt, fmtMs } = Showcase;
const css = getComputedStyle(document.documentElement);
const MONO = css.getPropertyValue("--mono").trim() || "monospace";
const FONT = css.getPropertyValue("--font").trim() || "sans-serif";
const C = [1, 2, 3, 4, 5, 6].map((i) => css.getPropertyValue(`--c${i}`).trim());
const IMG = (n) => `_shared/img/photo-${n}.jpg`;
// Local clip copied from assets/plyr/clip-360.mp4 (made for this site: 640x360, 12 s, H.264 + AAC).
const CLIP = "assets/glightbox/clip-360.mp4";
// GLightbox writes local videos with preload="metadata"; Chromium then suspends and cancels the read.
// Plyr and its CSS are loaded up front (GLightbox then skips injecting both) so the video can switch to preload="auto"
// before its resource selection starts.
window.Plyr = class extends Plyr {
  constructor(target, config) {
    const el = typeof target === "string" ? document.querySelector(target) : target;
    if (el?.tagName === "VIDEO") el.preload = "auto";
    super(target, config);
  }
};
// Read the clip fully into a Blob once: a <video> pointing at the file keeps a range request open,
// and removing the lightbox mid-read aborts it. A Blob URL has nothing left to abort.
let clipUrl = null;
const loadClip = async () => (clipUrl ||= URL.createObjectURL(await (await fetch(CLIP)).blob()));
// GLightbox injects Plyr for video slides; point it at jsDelivr instead of the default cdn.plyr.io.
const PLYR = {
  css: "https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.css",
  js: "https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js",
  config: { muted: true, controls: ["play-large", "play", "progress", "current-time", "mute"] },
};

// ---------- helpers: keep a GLightbox instance inside a host element ----------
// build() always appends the modal to <body> and hides every other body child; move it into the host
// and undo the aria-hidden. resize() writes "100vh" inline for bottom/top descriptions; switch it to cqh.
function glMake(host, opts) {
  const lb = GLightbox({ moreText: "查看更多", autofocusVideos: false, plyr: PLYR, ...opts });
  const build = lb.build;
  lb.build = function () {
    const fresh = !this.built;
    const r = build.call(this);
    if (fresh && this.modal) {
      host.append(this.modal);
      this.bodyHiddenChildElms.forEach((el) => el.removeAttribute("aria-hidden"));
      this.bodyHiddenChildElms = [];
    }
    return r;
  };
  const resize = lb.resize;
  lb.resize = function (slide) {
    resize.call(this, slide);
    const s = slide || this.activeSlide;
    const img = s?.querySelector(".gslide-image img"), desc = s?.querySelector(".gslide-description");
    if (!img || !desc || !img.style.maxHeight.includes("vh")) return;
    // GLightbox measures the description once at full width, then narrows it to the image width,
    // so the text wraps taller and overflows. Re-measure until the height settles.
    for (let k = 0, last = -1; k < 4 && desc.offsetHeight !== last; k++) {
      last = desc.offsetHeight;
      img.style.maxHeight = `calc(100cqh - ${last}px)`;
      desc.style.maxWidth = `${img.offsetWidth}px`;
    }
  };
  return lb;
}
// destroy() only starts the close animation and removes the modal when it ends; tear down synchronously.
function gkill(lb) {
  if (!lb || lb.__dead) return;
  lb.__dead = true;
  lb.settings.autoplayVideos = false;
  for (const p of Object.values(lb.videoPlayers || {})) p.destroy();
  lb.videoPlayers = {};
  lb.modal?.querySelectorAll("video").forEach((v) => v.pause());
  if (lb.events) { for (const k in lb.events) lb.events[k].destroy(); lb.events = null; }
  lb.modal?.remove();
  Object.assign(lb, { built: false, lightboxOpen: false, closing: null, activeSlide: null });
  document.documentElement.classList.remove("glightbox-open");
  document.body.classList.remove("glightbox-open", "touching", "gdesc-open", "glightbox-touch", "glightbox-mobile", "gscrollbar-fixer");
  document.querySelector(".gcss-styles")?.remove();
  lb.clearAllEvents();
  lb.baseEvents?.destroy();
}
const loop = (promise) => promise.catch((e) => { if (e?.name !== "AbortError") console.error(e); });
const chipOf = (ctx) => { const el = h("div", { class: "gl-chip" }); ctx.el.append(el); return el; };

// ---------- generated artwork (canvas -> Blob URL), cached for the page lifetime ----------
const artCache = new Map();
function art(w, h2, hue, label) {
  const key = `${w}x${h2}-${hue}-${label}`;
  if (!artCache.has(key)) artCache.set(key, new Promise((resolve) => {
    const c = document.createElement("canvas");
    c.width = w; c.height = h2;
    const g = c.getContext("2d");
    const grd = g.createLinearGradient(0, 0, w, h2);
    grd.addColorStop(0, `hsl(${hue} 65% 20%)`);
    grd.addColorStop(1, `hsl(${(hue + 50) % 360} 75% 52%)`);
    g.fillStyle = grd; g.fillRect(0, 0, w, h2);
    const m = Math.min(w, h2);
    g.strokeStyle = "rgba(255,255,255,.2)"; g.lineWidth = m * 0.008;
    for (let r = m * 0.1; r < Math.hypot(w, h2) / 2; r += m * 0.1) { g.beginPath(); g.arc(w / 2, h2 / 2, r, 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `700 ${Math.round(m * 0.16)}px ${MONO}`;
    g.fillText(label, w / 2, h2 / 2 - m * 0.04);
    g.font = `400 ${Math.round(m * 0.055)}px ${MONO}`;
    g.fillStyle = "rgba(255,255,255,.75)";
    g.fillText(`${w} × ${h2} px`, w / 2, h2 / 2 + m * 0.12);
    c.toBlob((b) => resolve(URL.createObjectURL(b)), "image/jpeg", 0.85);
  }));
  return artCache.get(key);
}

const TRIP = [
  [1, "第一天．峽灣晨光", "峽灣晨光", "第一天清晨", '<p>清晨六點出發，趁還沒起風時拍下水面倒影。山壁直落海面，整條峽灣安靜得只聽得到鳥叫。</p><span class="gl-tag">#攝影</span><span class="gl-tag">#日出</span>'],
  [5, "第一天．瀑布彩虹", "瀑布彩虹", "第一天午後", "<p>沿著步道走四十分鐘抵達瀑布。午後兩點左右陽光斜射，水霧裡會出現一道完整的彩虹。</p><ul><li>步道難度：輕鬆</li><li>建議穿防水外套</li></ul>"],
  [3, "第二天．山谷公路", "山谷公路", "第二天自駕", '<p>一路彎進雲裡的高山公路，沿途有多個觀景台可以停車。山區天氣變化快，記得預留時間。</p><span class="gl-tag">#自駕</span><span class="gl-tag">#公路旅行</span>'],
  [2, "第三天．紅岩峽谷", "紅岩峽谷", "第三天健行", "<p>峽谷內光線從岩縫灑落，岩壁被照成一層層的紅。正午前後光線最好，需要預約導覽。</p><ul><li>健行時間：約三小時</li><li>需攜帶兩公升飲水</li></ul>"],
];
const TRIP_HTML = `<div class="gl-trip"><h2>三日慢旅行行程表</h2><p>這一頁是一般 HTML，GLightbox 以 inline 方式放進燈箱</p><ol>
  <li><time>第一天</time><div><b>峽灣日出、瀑布步道</b><span>清晨拍倒影，午後走步道看彩虹</span></div></li>
  <li><time>第二天</time><div><b>高山公路自駕</b><span>沿途觀景台停留，傍晚入住山屋</span></div></li>
  <li><time>第三天</time><div><b>紅岩峽谷健行</b><span>預約導覽，正午前抵達最佳拍攝點</span></div></li></ol></div>`;

Showcase.run({ scenes: [
  // 1 ------------------------------------------------------------------
  { id: "trip", title: "圖文旅記", api: 'GLightbox({ selector }) ・ data-glightbox="title; description: .class; descPosition: right"',
    desc: "原本的招牌畫面：四張照片附右側圖文說明，最後一格是 inline HTML 行程表；同一個 data-gallery 讓五格串成一組，切換效果會重建實例並從第二張開啟。",
    hint: "點卡片開啟・左右鍵或滑動換張・點照片放大・點背景或 Esc 關閉",
    mount(ctx) {
      ctx.html(`<div class="gl1"><header><h1>三日慢旅行：山海景點</h1><p>點任一張卡片開啟燈箱，照片旁附帶完整圖文說明，最後一張是 HTML 行程表</p></header><div class="gl1-grid"></div></div>
        <div class="gl-hide">${TRIP.map((t, i) => `<div class="gl1-d${i + 1}">${t[4]}</div>`).join("")}<div id="gl1-trip">${TRIP_HTML}</div></div>
        <div class="gl-host gl-full"></div>`);
      const grid = ctx.$(".gl1-grid"), host = ctx.$(".gl-full");

  { id: "api", title: "API 與事件", api: "openAt・insertSlide・removeSlide・setElements・on(slide_changed…)",

        log.prepend(li);

      const EV = [

      loop((async () => {

          const data = new Array(n);
          for (let i = 0; i < n; i++) data[i] = { href: pool[i % pool.length], type: "image", title: `第 ${fmt(i + 1)} 張` };
          return data;
        },
        run(n, data) {
          gkill(lb); lb = null;
          const q = glMake(view, { elements: [], openEffect: "none", closeEffect: "none", slideEffect: "none", preload: false, keyboardNavigation: false, closeButton: false, closeOnOutsideClick: false });
          const t0 = performance.now();
          q.setElements(data);
          const t1 = performance.now();
          q.openAt(Math.floor(n / 2));
          const t2 = performance.now();
          lb = q;
          return `setElements ${fmtMs(t1 - t0)}・開啟 ${fmtMs(t2 - t1)}・.gslide ${fmt(view.querySelectorAll(".gslide").length)}`;
        },
        note: "計時包含 setElements() 為每筆建立 Slide 與解析設定，以及 openAt() 的 build()：它會替每一筆都建立一個 .gslide 節點並掛進 DOM，而且每建一張就用 querySelectorAll('.gslide')[i] 重查全部節點，實測張數乘 10 時開啟耗時約乘 45，接近平方成長；setElements() 本身只占幾毫秒。不像 PhotoSwipe 只保留三個容器，上千張的圖庫應分頁或分組載入。準備資料陣列的時間不計入；效果設為 none、關閉預載。",
      });
    } },
] });
</script>
</body>
</html>
