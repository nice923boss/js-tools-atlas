<style>
  .gg-globe { position: absolute; inset: 0; background: #000; overflow: hidden; }
  .gg-globe.gg-stress { inset: 8px; border-radius: 10px; }
  @media (min-width: 761px) { .gg-globe.gg-stress { inset: 8px 8px 8px 350px; } }
  .gg-globe .float-tooltip-kap { font: 12px/1.55 var(--font); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .gg-globe .float-tooltip-kap b { color: var(--accent); }
  .gg-globe .float-tooltip-kap .gg-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .gg-info { position: absolute; left: 10px; bottom: calc(var(--sc-ctl-b, 0px) + 10px); z-index: 5; width: max-content; max-width: min(290px, calc(100% - 20px)); padding: 8px 12px; font: 12px/1.5 var(--font); pointer-events: none; }
  .gg-info .gg-k { color: var(--muted); font-size: 11.5px; }
  .gg-info .gg-v { font: 700 20px/1.25 var(--font); color: var(--accent); }
  .gg-info .gg-v .gg-num, .gg-info .gg-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .gg-info .gg-sel { color: var(--fg); min-height: 18px; margin-top: 2px; }
  .gg-info .gg-note { color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  .gg-legend { height: 8px; border-radius: 4px; margin: 6px 0 2px; }
  .gg-ticks { display: flex; justify-content: space-between; gap: 12px; font-size: 10.5px; color: var(--muted); }
  .gg-keys { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 3px; }
  .gg-keys i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .gg-label { display: block; color: var(--accent); font: 700 13px var(--font); text-shadow: 0 0 6px #000, 0 0 2px #000; transform: translateY(-16px); pointer-events: none; white-space: nowrap; }
  .gg-sun { display: block; width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(#fffbd6, #f7df1e 55%, rgba(247,223,30,0) 72%); box-shadow: 0 0 22px 8px rgba(247,223,30,.45); pointer-events: none; }
  .gg-eye { display: block; width: 18px; height: 18px; border-radius: 50%; border: 3px solid #f72585; border-right-color: transparent; border-left-color: transparent; animation: gg-spin .9s linear infinite; pointer-events: none; }
  @keyframes gg-spin { to { transform: rotate(-360deg); } }
  @media (max-width: 560px) { .gg-info { padding: 6px 10px; } .gg-info .gg-v { font-size: 16px; } .gg-label { font-size: 12px; } }

<body>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Globe.gl showcase: eight scenes from the flight-route globe to a point-count stress ramp.
const IMG = "https://cdn.jsdelivr.net/npm/three-globe@2.45.3/example/img/";
const GEO_URL = "https://cdn.jsdelivr.net/npm/three-globe@2.45.3/example/country-polygons/ne_110m_admin_0_countries.geojson";
const THREE_URL = "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.min.js";
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#9d8cff", "#7bd389", "#ff8c42"];
const STOPS = ["#1b2a4a", "#2c6e9c", "#4cc9f0", "#f7df1e", "#ff8c42", "#f72585"];
const D2R = Math.PI / 180;

const HUBS = {
  TPE: { name: "桃園機場", lat: 25.0777, lng: 121.2328 },
  KHH: { name: "高雄機場", lat: 22.5771, lng: 120.3500 },
};
const DEST = [
  ["東京", 35.772, 140.393, "TK"], ["大阪", 34.434, 135.244, "TK"], ["首爾", 37.460, 126.440, "TK"], ["香港", 22.308, 113.918, "TK"],
  ["馬尼拉", 14.509, 121.020, "TK"], ["新加坡", 1.364, 103.991, "TK"], ["曼谷", 13.690, 100.750, "TK"], ["胡志明市", 10.818, 106.652, "TK"],
  ["洛杉磯", 33.942, -118.408, "T"], ["舊金山", 37.619, -122.375, "T"], ["西雅圖", 47.450, -122.309, "T"], ["溫哥華", 49.195, -123.184, "T"],
  ["紐約", 40.641, -73.778, "T"], ["倫敦", 51.470, -0.454, "T"], ["巴黎", 49.010, 2.548, "T"], ["阿姆斯特丹", 52.310, 4.768, "T"],
  ["法蘭克福", 50.038, 8.562, "T"], ["維也納", 48.110, 16.570, "T"], ["杜拜", 25.253, 55.365, "T"], ["雪梨", -33.940, 151.175, "T"],
  ["布里斯本", -27.384, 153.117, "T"], ["奧克蘭", -37.008, 174.792, "T"], ["澳門", 22.149, 113.592, "K"], ["峴港", 16.044, 108.199, "K"],
];
// Metro anchors for the synthetic point clouds: [lat, lng, relative weight].
const METROS = [
  [25.03, 121.56, 1.0], [35.68, 139.69, 1.6], [37.57, 126.98, 1.1], [31.23, 121.47, 1.5], [39.9, 116.4, 1.3], [22.32, 114.17, 0.9],
  [14.6, 120.98, 1.0], [-6.2, 106.85, 1.2], [1.35, 103.82, 0.6], [13.75, 100.5, 0.9], [28.61, 77.21, 1.6], [19.08, 72.88, 1.4],
  [25.2, 55.27, 0.5], [30.04, 31.24, 1.0], [6.52, 3.38, 1.0], [-26.2, 28.05, 0.6], [51.5, -0.12, 1.0], [48.86, 2.35, 0.9],
  [52.52, 13.4, 0.6], [55.75, 37.62, 0.9], [41.0, 28.97, 0.9], [40.71, -74.0, 1.2], [34.05, -118.24, 1.0], [41.88, -87.63, 0.6],
  [19.43, -99.13, 1.1], [-23.55, -46.63, 1.2], [-34.6, -58.38, 0.8], [-12.05, -77.04, 0.6], [-33.87, 151.21, 0.5],
];

function km(a, b) {
  const dLat = (b.lat - a.lat) * D2R, dLng = (b.lng - a.lng) * D2R;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * D2R) * Math.cos(b.lat * D2R) * Math.sin(dLng / 2) ** 2;
  return Math.round(2 * 6371 * Math.asin(Math.sqrt(h)));
}
function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }
const gauss = (r) => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r());
const hexRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function lerpColor(t, alpha = 1) {
  const x = Math.max(0, Math.min(1, t)) * (STOPS.length - 1);
  const i = Math.min(STOPS.length - 2, Math.floor(x)), f = x - i;
  const a = hexRgb(STOPS[i]), b = hexRgb(STOPS[i + 1]);
  return `rgba(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",")},${alpha})`;
}
const GRADIENT = `linear-gradient(90deg, ${STOPS.join(", ")})`;
const far = (host) => (host.clientWidth < 560 ? 1.5 : 1);
const info = (k, sel = "", extra = "") => `<div class="gg-info panel"><div class="gg-k">${k}</div><div class="gg-v"></div><div class="gg-sel">${sel}</div>${extra}</div>`;
const tag = (cls, text = "") => { const wrap = document.createElement("div"); const s = document.createElement("span"); s.className = cls; s.textContent = text; wrap.append(s); return wrap; };

// Globe factory: fills the host, follows resizes and fully releases the WebGL context on unmount.
function makeGlobe(ctx, host) {
  const world = new Globe(host, { waitForGlobeReady: false, animateIn: false });
  const fit = () => world.width(host.clientWidth).height(host.clientHeight);
  fit();
  ctx.onResize(fit);
  ctx.onCleanup(() => {
    const r = world.renderer();
    world._destructor();
    r.dispose();
    r.forceContextLoss();
    host.replaceChildren();
  });
  return world;
}
function plainGlobe(world, color = "#0d1b33") { world.globeMaterial().color.set(color); return world; }
// Texture with a visible fallback: if the CDN image fails, keep a solid globe and say so.
function setTexture(ctx, world, file) {
  world.globeImageUrl(IMG + file);
  const probe = new Image();
  probe.crossOrigin = "anonymous";
  probe.onerror = () => {
    if (!ctx.active) return;
    world.globeImageUrl(null);
    plainGlobe(world, "#1d2b4f");
    ctx.status("").error("地球貼圖載入失敗（CDN 無回應），改用純色地球");
  };
  probe.src = IMG + file;
}

let geoPromise = null, threePromise = null;
function loadCountries() {
  geoPromise ??= fetch(GEO_URL)
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then((g) => g.features.filter((f) => f.properties.ISO_A2 !== "AQ"))
    .catch((e) => { geoPromise = null; throw e; });
  return geoPromise;
}
const loadThree = () => (threePromise ??= import(THREE_URL).catch((e) => { threePromise = null; throw e; }));

const REGION = new Intl.DisplayNames(["zh-TW"], { type: "region" });
const NAME_FIX = { France: "法國", Norway: "挪威", "Northern Cyprus": "北賽普勒斯", Somaliland: "索馬利蘭" };
const zhName = (p) => NAME_FIX[p.ADMIN] || (/^[A-Z]{2}$/.test(p.ISO_A2) ? REGION.of(p.ISO_A2) : p.ADMIN);
const INCOME = ["", "高所得（OECD）", "高所得（非 OECD）", "中高所得", "中低所得", "低所得"];
const gdpPc = (p) => (p.POP_EST > 0 ? (p.GDP_MD_EST * 1e6) / p.POP_EST : 0);

// Synthetic metro-clustered points (illustrative only).
function metroPoints(n, seed, spread = 2.6) {
  const r = rng(seed), total = METROS.reduce((s, m) => s + m[2], 0), out = [];
  for (let i = 0; i < n; i++) {
    let pick = r() * total, m = METROS[0];
    for (const x of METROS) { pick -= x[2]; if (pick <= 0) { m = x; break; } }
    const s = spread * (0.6 + r() * 0.8);
    out.push({ lat: Math.max(-85, Math.min(85, m[0] + gauss(r) * s)), lng: m[1] + gauss(r) * s * 1.3, w: 0.5 + r() * 1.5 });
  }
  return out;
}

Showcase.run({ scenes: [
  {
    id: "routes", title: "航線地球",
    api: "new Globe(el).arcsData(arcs).arcDashAnimateTime(fn).ringsData(hubs).htmlElementsData(hubs)",
    desc: "從桃園、高雄出發的大圓航線（示意航點）。弧線以虛線動畫表現飛行方向，起點有擴散光環與 HTML 標籤；貼圖為夜間燈光、地形凹凸與星空背景。",
    hint: "切換出發機場・滑過弧線看距離・點城市讓相機飛過去",
    mount(ctx) {
      ctx.html(`<div class="gg-globe"></div>${info("直飛航點（示意）", "滑過弧線看距離・點城市飛過去")}`);
      const host = ctx.$(".gg-globe"), valEl = ctx.$(".gg-v"), selEl = ctx.$(".gg-sel");
      const world = makeGlobe(ctx, host);
      setTexture(ctx, world, "earth-night.jpg");
      let hovered = null, picked = null, codes = ["TPE"];
      const stroke = () => (d) => (d === hovered || (picked && d.to === picked.name) ? 1.4 : 0.55);
      const pointColor = () => (d) => (d === picked ? "#f7df1e" : "#ecebe6");
      const labels = () => [...codes.map((c) => HUBS[c]), ...(picked ? [picked] : [])];
      world.bumpImageUrl(IMG + "earth-topology.png")
        .backgroundImageUrl(IMG + "night-sky.png")
        .atmosphereColor("#4cc9f0").atmosphereAltitude(0.18)
        .arcColor((d) => [`${d.color}22`, d.color])
        .arcStroke(stroke())
        .arcAltitudeAutoScale(0.42)
        .arcDashLength(0.45).arcDashGap(0.25)
        .arcDashInitialGap(() => Math.random())
        .arcDashAnimateTime((d) => 1400 + d.dist / 4)
        .arcLabel((d) => `<b>${d.from} → ${d.to}</b><br>大圓距離約 <span class="gg-num">${d.dist.toLocaleString()}</span> 公里`)
        .onArcHover((d) => {
          hovered = d;
          if (d) selEl.textContent = `${d.from} → ${d.to}：約 ${d.dist.toLocaleString()} 公里`;
          world.arcStroke(stroke());
        })
        .pointColor(pointColor()).pointAltitude(0.01).pointRadius(0.32)
        .pointLabel((d) => d.name)
        .onPointClick((d) => {
          picked = d;
          const legs = codes.map((c) => `${HUBS[c].name.slice(0, 2)} ${km(HUBS[c], d).toLocaleString()} 公里`).join("、");
          selEl.textContent = `${d.name}：${legs}`;
          world.pointColor(pointColor()).arcStroke(stroke()).htmlElementsData(labels())
            .pointOfView({ lat: d.lat, lng: d.lng, altitude: 1.7 * far(host) }, 1400);
        })
        .ringColor(() => (t) => `rgba(247,223,30,${1 - t})`)
        .ringMaxRadius(4).ringPropagationSpeed(2.2).ringRepeatPeriod(900)
        .htmlElement((d) => tag("gg-label", d.name));
      function show(list) {
        codes = list;
        picked = null;
        const arcs = [], dests = new Map();
        list.forEach((code, h) => {
          const hub = HUBS[code];
          DEST.filter((d) => d[3].includes(code[0])).forEach(([to, lat, lng], i) => {
            arcs.push({ startLat: hub.lat, startLng: hub.lng, endLat: lat, endLng: lng, from: hub.name, to,
              color: list.length > 1 ? COLORS[h ? 2 : 1] : COLORS[i % COLORS.length], dist: km(hub, { lat, lng }) });
            if (!dests.has(to)) dests.set(to, { name: to, lat, lng });
          });
        });
        world.arcsData(arcs).pointsData([...dests.values()]).ringsData(list.map((c) => HUBS[c]))
          .pointColor(pointColor()).htmlElementsData(labels());
        valEl.innerHTML = `<span class="gg-num">${dests.size}</span> 個城市・<span class="gg-num">${arcs.length}</span> 條航線`;
        selEl.textContent = "滑過弧線看距離・點城市飛過去";
      }
      show(codes);
      world.pointOfView({ lat: 22, lng: 128, altitude: 2.3 * far(host) }, 0);
      const controls = world.controls();
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.45;
      ctx.group(["桃園出發", "高雄出發", "兩地並列"], 0, (i) => {
        show(i === 2 ? ["TPE", "KHH"] : [i ? "KHH" : "TPE"]);
        const hub = HUBS[i === 1 ? "KHH" : "TPE"];
        world.pointOfView({ lat: hub.lat - 3, lng: hub.lng + 6, altitude: 2.3 * far(host) }, 1200);
      });
      ctx.toggle("自動旋轉", true, (v) => (controls.autoRotate = v));
    },
  },
  {
    id: "choropleth", title: "國家分級著色",
    api: "polygonsData(features).polygonCapColor(fn).polygonAltitude(fn).onPolygonHover(fn)",
    desc: "Natural Earth 國界 GeoJSON 依指標上色並拉高，滑過的國家浮起、點擊後相機飛過去；資料為 Natural Earth 附帶的 2016～2017 年估計值。",
    hint: "切換指標・滑過國家浮起・點國家飛過去",
    async mount(ctx) {
      ctx.html(`<div class="gg-globe"></div>${info("人口", "滑過國家看數值・點一下飛過去", `<div class="gg-legend" style="background:${GRADIENT}"></div><div class="gg-ticks"><span></span><span></span></div><div class="gg-note">資料：Natural Earth 1:110m（約 2017 年估計）</div>`)}`);
      const host = ctx.$(".gg-globe"), keyEl = ctx.$(".gg-k"), valEl = ctx.$(".gg-v"), selEl = ctx.$(".gg-sel"), [lo, hi] = ctx.$$(".gg-ticks span");
      const world = plainGlobe(makeGlobe(ctx, host), "#0b1830");
      world.showAtmosphere(true).atmosphereColor("#9d8cff").atmosphereAltitude(0.16)
        .pointOfView({ lat: 22, lng: 112, altitude: 2.4 * far(host) });
      world.controls().autoRotate = true;
      world.controls().autoRotateSpeed = 0.35;
      const st = ctx.status("載入國界 GeoJSON（約 480 KB）…");
      let features;
      try { features = await loadCountries(); } catch (e) { st.error(`國界資料載入失敗：${e.message}`); return; }
      if (!ctx.active) return;
      st.done();
      const METRICS = [
        { name: "人口", label: "人口（人）", val: (p) => p.POP_EST, log: true, fmt: (v) => Showcase.fmtCompact(v) },
        { name: "人均 GDP", label: "人均 GDP（美元）", val: gdpPc, log: true, fmt: (v) => `US$ ${Showcase.fmt(Math.round(v))}` },
        { name: "所得分組", label: "世界銀行所得分組", val: (p) => 5 - parseInt(p.INCOME_GRP, 10), fmt: (v) => INCOME[5 - v] },
      ];
      let m = METRICS[0], hover = null, tall = true, range = [0, 1];
      const norm = (p) => {
        const v = m.val(p);
        if (m.log) return v > 0 ? (Math.log(v) - range[0]) / (range[1] - range[0]) : 0;
        return v / 4;
      };
      const setMetric = (next) => {
        m = next;
        if (m.log) {
          const vals = features.map((f) => m.val(f.properties)).filter((v) => v > 0);
          range = [Math.log(Math.min(...vals)), Math.log(Math.max(...vals))];
          lo.textContent = m.fmt(Math.exp(range[0]));
          hi.textContent = m.fmt(Math.exp(range[1]));
        } else { lo.textContent = "低所得"; hi.textContent = "高所得"; }
        keyEl.textContent = m.label;
        refresh();
      };
      const refresh = () => world
        .polygonCapColor((d) => (d === hover ? "#ffffff" : lerpColor(norm(d.properties), 0.92)))
        .polygonAltitude((d) => (tall ? 0.008 + norm(d.properties) * 0.16 : 0.008) + (d === hover ? 0.06 : 0));
      world.polygonsData(features)
        .polygonSideColor(() => "rgba(76,201,240,0.18)")
        .polygonStrokeColor(() => "#0b0d10")
        .polygonsTransitionDuration(450)
        .polygonLabel(({ properties: p }) => `<b>${zhName(p)}</b><br>人口 <span class="gg-num">${Showcase.fmtCompact(p.POP_EST)}</span><br>人均 GDP <span class="gg-num">US$ ${Showcase.fmt(Math.round(gdpPc(p)))}</span><br>${INCOME[parseInt(p.INCOME_GRP, 10)]}`)
        .onPolygonHover((d) => {
          hover = d;
          host.style.cursor = d ? "pointer" : "";
          valEl.textContent = d ? zhName(d.properties) : "";
          selEl.textContent = d ? `${m.label}：${m.fmt(m.val(d.properties))}` : "滑過國家看數值・點一下飛過去";
          refresh();
        })
        .onPolygonClick((d, ev, { lat, lng }) => {
          world.controls().autoRotate = false;
          world.pointOfView({ lat, lng, altitude: 1.4 * far(host) }, 1000);
        });
      setMetric(m);
      ctx.group(METRICS.map((x) => x.name), 0, (i) => setMetric(METRICS[i]));
      ctx.toggle("立體高度", true, (v) => { tall = v; refresh(); });
    },
  },
  {
    id: "hexheat", title: "六角柱與熱度",
    api: "hexBinPointsData(pts).hexBinResolution(r)・heatmapsData([pts]).heatmapBandwidth(bw)",
    desc: "同一批示意點資料，用 H3 六角格加總成立體柱，或用核密度估計畫成熱度圖；解析度與頻寬決定聚合的粗細。",
    hint: "切換聚合方式・拖曳解析度與頻寬・滑過六角柱看筆數",
    mount(ctx) {
      ctx.html(`<div class="gg-globe"></div>${info("示意資料點", "H3 解析度 2：邊長約 158 公里")}`);
      const host = ctx.$(".gg-globe"), valEl = ctx.$(".gg-v"), selEl = ctx.$(".gg-sel");
      const world = plainGlobe(makeGlobe(ctx, host), "#0a1424");
      world.showGraticules(true).atmosphereColor("#4cc9f0").atmosphereAltitude(0.14)
        .pointOfView({ lat: 26, lng: 105, altitude: 2.3 * far(host) });
      world.controls().autoRotate = true;
      world.controls().autoRotateSpeed = 0.3;
      const EDGE = [1107, 418, 158, 60, 23];
      let seed = 11, pts = metroPoints(3000, seed), mode = 0, res = 2, bw = 1.4;
      const k = () => 0.0011 * Math.pow(7, res - 1);
      const apply = () => {
        world.hexBinPointsData(mode !== 1 ? pts : [])
          .heatmapsData(mode !== 0 ? [pts] : []);
        valEl.innerHTML = `<span class="gg-num">${pts.length.toLocaleString()}</span> 筆`;
        selEl.textContent = mode === 1 ? `熱度圖頻寬 ${bw.toFixed(1)}°` : `H3 解析度 ${res}：邊長約 ${EDGE[res]} 公里`;
      };
      world.hexBinPointWeight("w").hexBinResolution(res).hexMargin(0.18).hexBinMerge(false)
        .hexAltitude((d) => Math.min(0.35, d.sumWeight * k()))
        .hexTopColor((d) => lerpColor(d.sumWeight * k() / 0.35 + 0.15))

      world.atmosphereColor("#4cc9f0").atmosphereAltitude(0.12).pointOfView({ lat: 20, lng: 110, altitude: 2.4 * far(host) });
      world.controls().autoRotate = true;
      world.controls().autoRotateSpeed = 1.2;
      const MAX = 100000, r = rng(23);
      const ALL = metroPoints(MAX * 0.7, 29, 4).concat(Array.from({ length: MAX * 0.3 }, () => ({ lat: Math.asin(2 * r() - 1) / D2R, lng: r() * 360 - 180 })))
        .map((p, i) => ({ lat: p.lat, lng: p.lng, alt: 0.004 + Math.pow(r(), 3) * 0.12, c: COLORS[i % COLORS.length] }));
      for (let i = ALL.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [ALL[i], ALL[j]] = [ALL[j], ALL[i]]; }
      const MODES = ["個別柱體", "合併柱體", "粒子圖層"];
      let mode = 0, count = 0, buildMs = 0;
      world.pointLat("lat").pointLng("lng").pointAltitude("alt").pointColor("c").pointRadius(0.14).pointResolution(4)
        .pointsTransitionDuration(0)
        .particleLat("lat").particleLng("lng").particleAltitude("alt")
        .particlesColor(() => "#4cc9f0").particlesSize(2).particlesSizeAttenuation(false);
      const draw = async (n) => {
        count = n;
        const t0 = performance.now(), pts = ALL.slice(0, n);
        if (mode === 2) world.particlesData([pts]);
        else world.pointsData(pts);
        // Layer updates are debounced by about 1 ms; a 1 ms timer queued after the call fires once the rebuild is done.
        await new Promise((res) => ctx.timeout(res, 1));
        buildMs = performance.now() - t0;
        await ctx.frame(1);
      };
      // Setting pointsMerge empties the layer scene, so clear the data first and rebuild afterwards.
      ctx.group(MODES, 0, async (i) => {
        if (i === mode) return;
        world.pointsData([]).particlesData([]);
        await ctx.frame(2);
        mode = i;
        world.pointsMerge(i === 1);
        await ctx.frame(2);
        await draw(count);
      });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "點數", steps: [1000, 2500, 5000, 10000, 25000, 50000, 100000],
        minFps: 30,
        apply: draw,
        metrics: () => {
          const info = world.renderer().info.render;
          return { "繪製方式": MODES[mode], "Draw calls": info.calls, "三角形": Showcase.fmtCompact(info.triangles), "建立耗時": Showcase.fmtMs(buildMs) };
        },
        note: "個別柱體每點都是一個 Mesh，draw call 跟著點數線性增加，最先撐不住，但保留逐點滑鼠互動；合併柱體把所有柱子併成一個幾何，draw call 只剩一個，代價是每次換資料要重建整個幾何（看建立耗時）且失去逐點互動；粒子圖層只畫螢幕上的點，最省但沒有高度柱。",
      });
    },
  },
] });
</script>
</body>
</html>
