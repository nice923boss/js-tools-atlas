<script src="https://cdn.jsdelivr.net/npm/glslCanvas@0.2.6/dist/GlslCanvas.min.js"></script>
<script>
const { h, fmtCompact, fmtMs } = Showcase;
const DPR = () => Math.min(2, window.devicePixelRatio || 1);
const LIM = 4096;
const IMG = (n) => `_shared/img/photo-${n}.jpg`;
const PHOTOS = ["峽灣", "紅岩峽谷", "綠色山谷公路", "披毯巴哥犬", "瀑布彩虹", "藍底水母", "母獅特寫", "海象群"];
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// ---------- sandbox helper ----------
// glslCanvas keeps ping-pong buffer textures alive across load(); free them before replacing.
function dropBuffers(sb) {
  const gl = sb.gl;
  for (const k in sb.buffers) {
    const b = sb.buffers[k];
    if (b.bundle) for (const io of [b.bundle.input, b.bundle.output]) { gl.deleteTexture(io.texture); gl.deleteFramebuffer(io.buffer); }
    if (b.program) gl.deleteProgram(b.program);
  }
  sb.buffers = {};
}

// BUFFER_n passes render into RGBA float textures; check that the device can actually draw into one.
function floatRT(gl) {
  if (!gl.getExtension("OES_texture_float")) return false;
  gl.getExtension("WEBGL_color_buffer_float");
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.FLOAT, null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.deleteFramebuffer(fb);
  gl.deleteTexture(tex);
  return ok;
}

// One GlslCanvas per canvas element. We own the backing-store size (DPR capped at 2, optional scale)
// and replace sb.resize so glslCanvas never runs its float readPixels buffer-resize path.
function createSandbox(ctx, host, { frag, scale = 1, dpr = true, pointer = false, attrs = {} } = {}) {
  const canvas = h("canvas", { class: "gc-cv", ...attrs });
  host.append(canvas);
  const g = { canvas, scale, dpr, renders: 0, rps: 0, loads: 0, frag: frag || attrs["data-fragment"] || "", vert: undefined, ms: 0, ctorMs: 0, sb: null };
  let sb = null;
  const size = () => {
    const k = (g.dpr ? DPR() : 1) * g.scale;
    const cw = canvas.clientWidth, ch = canvas.clientHeight;
    const w = Math.max(1, Math.min(LIM, Math.round(cw * k)));
    const hh = Math.max(1, Math.min(LIM, Math.round(ch * k)));
    const changed = canvas.width !== w || canvas.height !== hh;
    if (changed) { canvas.width = w; canvas.height = hh; }
    if (sb && sb.gl) {
      sb.width = cw;
      sb.height = ch;
      sb.realToCSSPixels = cw ? w / cw : k;
      if (changed) sb.gl.viewport(0, 0, w, hh);
    }
    return changed;
  };
  size();
  const t0 = performance.now();
  sb = new GlslCanvas(canvas, frag ? { fragmentString: frag } : {}, { onError() {} });
  g.ctorMs = performance.now() - t0;
  g.sb = sb;
  if (!sb.gl) {
    canvas.remove();
    throw new Error("此瀏覽器無法建立 WebGL，glslCanvas 需要 WebGL 1。");
  }
  size();

  // Wrapper around sb.load(): frees the previous program and buffers, and survives link failures
  // (glslCanvas leaves program = null and its internal render() then throws).
  g.load = (f, v) => {
    size();
    const old = sb.program;
    dropBuffers(sb);
    g.frag = f;
    if (v) g.vert = v;
    const t1 = performance.now();
    try { sb.load(f, v); } catch (err) { if (sb.program) throw err; }
    g.ms = performance.now() - t1;
    g.loads++;
    if (old && old !== sb.program) sb.gl.deleteProgram(old);
  };
  sb.resize = () => {
    const c = size();
    if (c) {
      sb.forceRender = true;
      // Buffers are sized at load time, so a new size means a fresh load (the simulation restarts).
      if (Object.keys(sb.buffers).length) g.load(g.frag, g.vert);
    }
    return c;
  };

  sb.on("render", () => g.renders++);
  let last = 0;
  ctx.interval(() => { g.rps = (g.renders - last) * 2; last = g.renders; }, 500);

  if (pointer) {
    // glslCanvas only listens to document mousemove; forward touch and pen moves so u_mouse follows a finger too.
    canvas.style.touchAction = "none";
    const fwd = (e) => { if (e.pointerType !== "mouse") document.dispatchEvent(new MouseEvent("mousemove", { clientX: e.clientX, clientY: e.clientY })); };
    ctx.on(canvas, "pointermove", fwd);
    ctx.on(canvas, "pointerdown", fwd);
  }
  ctx.on(canvas, "webglcontextlost", (e) => {
    e.preventDefault();
    if (ctx.active) ctx.status("").error("WebGL 內容遺失（GPU 負載過重或被系統回收），切到別的場景再回來即可重建。");
  });
  ctx.onCleanup(() => {
    const gl = sb.gl;
    const lose = gl && gl.getExtension("WEBGL_lose_context");
    if (gl) { dropBuffers(sb); sb.destroy(); }
    if (lose) lose.loseContext();
    canvas.remove();
  });
  return g;
}

// ---------- scene 1: the original live-editor presets ----------
const HEADER = `#ifdef GL_ES
precision highp float;
#endif

uniform vec2 u_resolution;
uniform vec2 u_mouse;
uniform float u_time;
uniform float u_speed;
uniform float u_hue;
`;

const NOISE = `
float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}
`;

const SHADERS = {
  aurora: HEADER + NOISE + `
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
  return v;
}

vec3 palette(float t) {
  return 0.5 + 0.5 * cos(6.2832 * (t + vec3(0.0, 0.33, 0.67)));
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution;
  vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
  float t = u_time * u_speed;
  // Mouse x bends the curtains like wind
  float wind = u_mouse.x > 0.0 ? u_mouse.x / u_resolution.x - 0.5 : 0.2 * sin(t * 0.2);

  vec3 col = mix(vec3(0.01, 0.015, 0.05), vec3(0.03, 0.05, 0.14), uv.y);
  vec2 cell = floor(gl_FragCoord.xy / 2.0);
  col += step(0.996, hash(cell)) * (0.6 + 0.4 * sin(t * 2.0 + hash(cell + 3.0) * 30.0)) * uv.y;

  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float x = p.x * (1.0 + fi * 0.35) + wind * p.y * 2.0 + fi * 7.0;
    float base = 0.02 + fi * 0.07 + (fbm(vec2(x * 1.3 + t * 0.06, fi + t * 0.1)) - 0.5) * 0.7;
    float h = p.y - base;
    float rays = 0.55 + 0.45 * noise(vec2(x * 28.0, t * 0.6 + fi));
    float glow = smoothstep(-0.015, 0.01, h) * exp(-max(h, 0.0) * (5.0 + fi * 2.0)) * rays;
    col += palette(0.67 + u_hue - h * 1.2 - fi * 0.05) * glow * (0.8 - fi * 0.18);
  }

  float ridge = -0.3 + 0.2 * fbm(vec2(p.x * 2.5 + 3.0, 0.5));
  col = mix(col, vec3(0.005, 0.008, 0.015), smoothstep(ridge + 0.004, ridge - 0.004, p.y));
  gl_FragColor = vec4(col, 1.0);
}
`,

  grid: HEADER + `
vec3 hueShift(vec3 c, float a) {
  const vec3 k = vec3(0.57735);
  float ca = cos(a);
  return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}

void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y;
  float t = u_time * u_speed;
  vec2 m = u_mouse.x > 0.0 ? u_mouse / u_resolution - 0.5 : vec2(0.15 * sin(t * 0.3), 0.0);
  float horizon = -0.04;
  vec3 col;

  if (p.y > horizon) {
    float h = p.y - horizon;
    col = mix(vec3(0.6, 0.08, 0.45), vec3(0.04, 0.01, 0.12), smoothstep(0.0, 0.45, h));
    // Striped retro sun
    vec2 sp = p - vec2(m.x * 0.4, horizon + 0.2);
    float r = length(sp);
    float band = sin(sp.y * 70.0 - t * 2.0);
    float cut = sp.y > 0.0 ? 1.0 : step(-0.2 - sp.y * 4.0, band);
    vec3 sun = mix(vec3(1.0, 0.15, 0.55), vec3(1.0, 0.85, 0.25), smoothstep(-0.18, 0.18, sp.y));
    col = mix(col, sun, smoothstep(0.185, 0.18, r) * cut);
    col += vec3(1.0, 0.25, 0.6) * 0.3 * exp(-r * 5.0);
  } else {
    // Perspective floor grid scrolling toward the viewer
    float d = horizon - p.y;
    float z = 0.3 / d;
    vec2 g = vec2((p.x - m.x * 0.4) * z * 5.0, z * 5.0 + t * 2.0);
    float wx = 1.2 * z * 5.0 / u_resolution.y + 0.012;
    float wz = 1.2 * z * z * 5.0 / (0.3 * u_resolution.y) + 0.012;
    float lx = 1.0 - smoothstep(0.0, wx, abs(fract(g.x + 0.5) - 0.5));
    float lz = 1.0 - smoothstep(0.0, wz, abs(fract(g.y + 0.5) - 0.5));
    float grid = max(lx, lz) * exp(-z * 0.25) * smoothstep(0.0, 0.03, d);
    col = vec3(0.03, 0.0, 0.08) + vec3(0.2, 0.9, 1.0) * grid + vec3(0.9, 0.2, 0.7) * 0.35 * exp(-d * 10.0);
  }
  col += vec3(1.0, 0.35, 0.75) * 0.7 * exp(-abs(p.y - horizon) * 60.0);
  gl_FragColor = vec4(hueShift(col, u_hue * 6.2832), 1.0);
}
`,

  cells: HEADER + `
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}

vec3 palette(float t) {
  return 0.5 + 0.5 * cos(6.2832 * (t + vec3(0.0, 0.33, 0.67)));
}

void main() {
  float t = u_time * u_speed;
  vec2 p = gl_FragCoord.xy / u_resolution.y * 6.0;
  vec2 ip = floor(p), fp = fract(p);
  float d1 = 8.0, d2 = 8.0;
  vec2 id = vec2(0.0);
  // Animated Voronoi: keep the nearest and second-nearest seed
  for (int y = -1; y <= 1; y++) {
    for (int x = -1; x <= 1; x++) {
      vec2 g = vec2(float(x), float(y));
      vec2 o = 0.5 + 0.42 * sin(t + 6.2832 * hash2(ip + g));
      vec2 r = g + o - fp;
      float d = dot(r, r);
      if (d < d1) { d2 = d1; d1 = d; id = ip + g; }
      else if (d < d2) { d2 = d; }
    }
  }
  float edge = sqrt(d2) - sqrt(d1);
  vec3 base = palette(hash2(id).x * 0.45 + u_hue + 0.5);
  vec3 col = base * (0.85 - 0.55 * sqrt(d1));
  col += base * 0.7 * smoothstep(0.14, 0.05, edge);
  col = mix(vec3(0.02, 0.02, 0.04), col, smoothstep(0.015, 0.045, edge));
  col += vec3(1.0, 0.97, 0.9) * 0.8 * smoothstep(0.012, 0.003, d1);
  // The cursor lights up nearby cells
  float md = u_mouse.x > 0.0 ? length(gl_FragCoord.xy - u_mouse) / u_resolution.y : 9.0;
  col += vec3(1.0, 0.95, 0.8) * 0.45 * exp(-md * 9.0);
  gl_FragColor = vec4(col, 1.0);
}
`,

  lava: HEADER + NOISE + `
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 r = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = r * p * 2.0; a *= 0.5; }
  return v;
}

vec3 hueShift(vec3 c, float a) {
  const vec3 k = vec3(0.57735);
  float ca = cos(a);
  return c * ca + cross(k, c) * sin(a) + k * dot(k, c) * (1.0 - ca);
}

void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y * 3.0;
  float t = u_time * u_speed * 0.25;
  vec2 m = u_mouse.x > 0.0 ? (u_mouse - 0.5 * u_resolution) / u_resolution.y * 3.0 : vec2(0.0);
  // Domain warping: fbm feeding fbm feeding fbm
  vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 1.5 + m * 0.3),
                fbm(p + 4.0 * q + vec2(8.3, 2.8) - t));
  float f = fbm(p + 3.5 * r);
  vec3 col = mix(vec3(0.06, 0.0, 0.03), vec3(0.85, 0.12, 0.02), clamp(f * f * 3.0, 0.0, 1.0));
  col = mix(col, vec3(1.0, 0.7, 0.15), clamp(length(q) * f * 1.4 - 0.25, 0.0, 1.0));
  col = mix(col, vec3(0.03, 0.0, 0.06), clamp(r.y * r.y - 0.15, 0.0, 1.0));
  col += vec3(1.0, 0.9, 0.6) * pow(clamp(f * 1.25, 0.0, 1.0), 8.0);
  gl_FragColor = vec4(hueShift(col, u_hue * 6.2832), 1.0);
}
`,
};

const CLOCK = `#ifdef GL_ES
precision highp float;
#endif

uniform vec2 u_resolution;
uniform vec2 u_mouse;
uniform float u_time;
uniform float u_delta;
uniform vec4 u_date;

#define TAU 6.28318530718

float seg(vec2 p, vec2 a, vec2 b) {
  vec2 pa = p - a, ba = b - a;
  float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
  return length(pa - ba * h);
}

vec2 dir(float turns) { return vec2(sin(turns * TAU), cos(turns * TAU)); }

// 1 inside a band of half-width w around distance d, with a 1 px soft edge
float band(float d, float w) { return 1.0 - smoothstep(w - 0.5, w + 0.5, d); }

void main() {
  vec2 fc = gl_FragCoord.xy;
  vec3 col = vec3(0.05, 0.057, 0.07);
  // Pixel grid every 100 px, brighter every 500 px (u_resolution is in device pixels)
  vec2 g1 = step(mod(fc, 100.0), vec2(1.0));
  vec2 g5 = step(mod(fc, 500.0), vec2(1.0));
  col += 0.045 * max(g1.x, g1.y) + 0.06 * max(g5.x, g5.y);

  vec2 c = 0.5 * u_resolution;
  float R = 0.34 * min(u_resolution.x, u_resolution.y);
  float k = max(R / 150.0, 0.7);
  vec2 p = fc - c;
  float r = length(p);
  float ang = fract(atan(p.x, p.y) / TAU + 1.0);

  // Dial face and rim
  col = mix(col, vec3(0.085, 0.095, 0.12), 1.0 - smoothstep(R - 0.5, R + 0.5, r));
  col = mix(col, vec3(0.36, 0.38, 0.44), band(abs(r - R), 1.5 * k));

  // Radar sweep driven by u_time: one turn every 6 s
  float sweep = fract(u_time / 6.0);
  float trail = exp(-fract(sweep - ang) * 9.0);
  float inner = 1.0 - smoothstep(0.77 * R - 0.5, 0.77 * R + 0.5, r);
  col += vec3(0.3, 0.79, 0.94) * 0.3 * trail * inner;
  col = mix(col, vec3(0.3, 0.79, 0.94), band(seg(p, vec2(0.0), dir(sweep) * 0.77 * R), 0.8 * k) * 0.8);

  // Minute and hour ticks
  float dMin = abs(fract(ang * 60.0 + 0.5) - 0.5) / 60.0 * TAU * r;
  float dHour = abs(fract(ang * 12.0 + 0.5) - 0.5) / 12.0 * TAU * r;
  float bMin = step(0.88 * R, r) * step(r, 0.95 * R);
  float bHour = step(0.8 * R, r) * step(r, 0.95 * R);
  col = mix(col, vec3(0.55, 0.56, 0.6), band(dMin, 0.8 * k) * bMin);
  col = mix(col, vec3(0.92, 0.91, 0.88), band(dHour, 2.2 * k) * bHour);

  // Hands from u_date.w = seconds since local midnight
  float s = u_date.w;
  vec2 sd = dir(s / 60.0);
  col = mix(col, vec3(0.92, 0.91, 0.88), band(seg(p, vec2(0.0), dir(s / 43200.0) * 0.5 * R), 4.0 * k));
  col = mix(col, vec3(0.92, 0.91, 0.88), band(seg(p, vec2(0.0), dir(s / 3600.0) * 0.75 * R), 2.6 * k));
  col = mix(col, vec3(0.97, 0.87, 0.12), band(seg(p, -sd * 0.16 * R, sd * 0.86 * R), 1.2 * k));
  col = mix(col, vec3(0.97, 0.87, 0.12), band(r, 6.0 * k));

  // u_delta ring: a full circle is 66.7 ms (15 fps); white marks at 16.7 ms and 33.3 ms
  float fill = clamp(u_delta / 0.0667, 0.0, 1.0);
  float ring = band(abs(r - 1.1 * R), 3.0 * k);
  col = mix(col, vec3(0.2, 0.21, 0.25), ring);
  col = mix(col, vec3(0.97, 0.15, 0.52), ring * step(ang, fill));
  float dMark = min(abs(fract(ang + 0.25) - 0.5), abs(fract(ang) - 0.5)) * TAU * r;
  col = mix(col, vec3(1.0), band(dMark, 0.8) * band(abs(r - 1.1 * R), 5.0 * k));

  // u_mouse crosshair; a dim marker orbits until the cursor enters the canvas
  float live = step(0.5, u_mouse.x + u_mouse.y);
  vec2 m = mix(c + dir(u_time * 0.1) * 1.25 * R, u_mouse, live);
  float dm = length(fc - m);
  vec3 orange = vec3(1.0, 0.55, 0.26);
  col = mix(col, orange, band(min(abs(fc.x - m.x), abs(fc.y - m.y)), 0.5) * 0.45 * live);
  col = mix(col, orange, band(abs(dm - 12.0 * k), 1.0) * mix(0.35, 1.0, live));
  col = mix(col, orange, band(dm, 2.5 * k) * mix(0.35, 1.0, live));

  gl_FragColor = vec4(col, 1.0);
}
`;

const METABALL = `#ifdef GL_ES
precision highp float;
#endif

uniform vec2 u_resolution;
uniform vec2 u_balls[6];
uniform float u_r[6];
uniform vec3 u_color;
uniform float u_thresh;
uniform bool u_iso;

struct Light {
  vec2 pos;
  float power;
};
uniform Light u_light;

float field(vec2 p) {
  float f = 0.0;
  for (int i = 0; i < 6; i++) {
    vec2 d = p - u_balls[i];
    float r = max(u_r[i], 0.001);
    f += exp(-dot(d, d) / (r * r));
  }
  return f;
}

void main() {
  float px = 1.0 / u_resolution.y;
  vec2 p = gl_FragCoord.xy * px;
  float f = field(p);
  // Field change per pixel, from central differences
  vec2 grad = vec2(field(p + vec2(1.5 * px, 0.0)) - field(p - vec2(1.5 * px, 0.0)),
                   field(p + vec2(0.0, 1.5 * px)) - field(p - vec2(0.0, 1.5 * px))) / 3.0;
  float w = max(length(grad), 1e-4);
  float inside = smoothstep(-w, w, f - u_thresh);

  // Treat the field as a height map; a gentle slope keeps the blobs dome-shaped
  vec3 n = normalize(vec3(-grad * 0.07 * u_resolution.y, 1.0));
  vec3 ld = normalize(vec3(u_light.pos, 0.5) - vec3(p, 0.0));
  // Half-Lambert wrap so the far side fades instead of cutting to black
  float diff = 0.5 + 0.5 * dot(n, ld);
  diff *= diff;
  float spec = pow(max(dot(n, normalize(ld + vec3(0.0, 0.0, 1.0))), 0.0), 40.0);
  vec2 lv = p - u_light.pos;
  vec3 bg = vec3(0.04, 0.045, 0.06) + u_color * 0.12 * exp(-dot(lv, lv) * 18.0) * u_light.power;
  vec3 blob = u_color * (0.18 + 0.82 * diff * u_light.power) + vec3(1.0) * spec * 0.8 * u_light.power;
  vec3 col = mix(bg, blob, inside);

  if (u_iso) {
    // Distance to the nearest 0.1 contour of the field, in pixels
    float dpx = abs(fract(f / 0.1 + 0.5) - 0.5) * 0.1 / w;
    float iso = (1.0 - smoothstep(0.5, 1.5, dpx)) * step(0.02, f) * (1.0 - inside);
    col = mix(col, u_color * 0.9 + 0.1, iso * 0.6);
  }

  // Light marker
  float lr = length(lv) / px;
  col = mix(col, vec3(1.0, 0.95, 0.8), (1.0 - smoothstep(1.0, 2.0, abs(lr - 9.0))) * 0.9);
  col = mix(col, vec3(1.0, 0.95, 0.8), 1.0 - smoothstep(2.5, 3.5, lr));
  gl_FragColor = vec4(col, 1.0);
}
`;

vec3 sampleInk(vec2 px) {
  vec2 q = px - 0.5;
  vec2 i = floor(q), f = fract(q);
  vec2 inv = 1.0 / u_resolution;
  vec3 a = texture2D(u_buffer0, (i + vec2(0.5, 0.5)) * inv).rgb;
  vec3 b = texture2D(u_buffer0, (i + vec2(1.5, 0.5)) * inv).rgb;
  vec3 c = texture2D(u_buffer0, (i + vec2(0.5, 1.5)) * inv).rgb;
  vec3 d = texture2D(u_buffer0, (i + vec2(1.5, 1.5)) * inv).rgb;
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}

void main() {
  float H = u_resolution.y;
  float asp = u_resolution.x / H;
  vec2 p = gl_FragCoord.xy / H;
  float t = u_time;
  // Velocity: a slow wavy drift plus two counter-rotating vortices
  vec2 v = vec2(sin(p.y * 6.0 + t * 0.4), sin(p.x * 5.0 - t * 0.3)) * 0.0008;
  vec2 d1 = p - vec2(asp * 0.33, 0.5), d2 = p - vec2(asp * 0.67, 0.5);
  float q1 = dot(d1, d1), q2 = dot(d2, d2);
  v += 0.0025 * vec2(-d1.y, d1.x) / (q1 + 0.02) * exp(-q1 * 6.0);
  v -= 0.0025 * vec2(-d2.y, d2.x) / (q2 + 0.02) * exp(-q2 * 6.0);
  // Semi-Lagrangian advection: read the ink from where this pixel's fluid came from
  vec3 ink = sampleInk((p - v) * H) * 0.996;
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float a = t * (0.5 + fi * 0.13) + fi * 2.094;
    vec2 e = vec2(asp * (0.5 + 0.3 * cos(a)), 0.5 + 0.3 * sin(a * 1.3));
    vec2 de = p - e;
    ink += pal(fi * 0.33 + t * 0.05) * exp(-dot(de, de) * 1800.0) * 0.06;
  }
  vec2 dp = p - u_pen.xy;
  ink += pal(t * 0.1 + 0.5) * exp(-dot(dp, dp) * 2500.0) * 0.12 * u_pen.z;
  gl_FragColor = vec4(min(ink, vec3(6.0)), 1.0);
}
#else
void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution;
  vec3 ink = texture2D(u_buffer0, uv).rgb;
  vec3 bg = mix(vec3(0.02, 0.022, 0.03), vec3(0.05, 0.055, 0.075), uv.y);
  gl_FragColor = vec4(bg + (1.0 - exp(-ink * 1.5)), 1.0);
}
#endif
`;
const WAVE = `#ifdef GL_ES
precision highp float;
#endif

uniform vec2 u_resolution;
uniform float u_time;
uniform vec3 u_pen;
uniform vec3 u_drop;
uniform sampler2D u_buffer0;

float height(vec2 px) { return texture2D(u_buffer0, px / u_resolution).r; }

#ifdef BUFFER_0
// r = height now, g = height one step ago: a discrete wave equation
void main() {
  vec2 fc = gl_FragCoord.xy;
  vec4 s = texture2D(u_buffer0, fc / u_resolution);
  float lap = height(fc + vec2(1.0, 0.0)) + height(fc - vec2(1.0, 0.0))
            + height(fc + vec2(0.0, 1.0)) + height(fc - vec2(0.0, 1.0)) - 4.0 * s.r;
  float hn = (2.0 * s.r - s.g + 0.45 * lap) * 0.992;
  vec2 p = fc / u_resolution.y;
  vec2 dd = p - u_drop.xy;
  hn += u_drop.z * exp(-dot(dd, dd) * 1500.0);
  vec2 dp = p - u_pen.xy;
  hn += u_pen.z * 0.25 * sin(u_time * 18.0) * exp(-dot(dp, dp) * 2500.0);
  gl_FragColor = vec4(hn, s.r, 0.0, 1.0);
}
#else
void main() {
  vec2 fc = gl_FragCoord.xy;
  vec2 grad = vec2(height(fc + vec2(1.0, 0.0)) - height(fc - vec2(1.0, 0.0)),
                   height(fc + vec2(0.0, 1.0)) - height(fc - vec2(0.0, 1.0)));
  vec3 n = normalize(vec3(-grad * 2.0, 1.0));
  // Look at the pool floor through the bent surface
  vec2 p = fc / u_resolution.y + n.xy * 0.08;
  vec2 f = abs(fract(p * 8.0) - 0.5);
  float grout = smoothstep(0.43, 0.47, max(f.x, f.y));
  vec3 col = mix(vec3(0.15, 0.52, 0.62), vec3(0.05, 0.2, 0.27), grout);
  float ca = sin(p.x * 23.0 + u_time * 1.3) * sin(p.y * 19.0 - u_time * 1.1) + sin((p.x + p.y) * 14.0 + u_time * 0.9);
  col += vec3(0.55, 0.9, 1.0) * pow(clamp(0.5 + 0.25 * ca, 0.0, 1.0), 3.0) * 0.25;
  col *= 0.75 + 0.25 * n.z;
  vec3 L = normalize(vec3(-0.4, 0.5, 0.75));
  col += vec3(1.0) * pow(max(dot(reflect(-L, n), vec3(0.0, 0.0, 1.0)), 0.0), 60.0) * 0.8;
  col += vec3(0.4, 0.8, 1.0) * clamp(length(grad) * 3.0, 0.0, 0.35);
  gl_FragColor = vec4(col, 1.0);
}
#endif
`;

// ---------- scene 8: stress shader ----------
const stressFrag = (oct) => `#ifdef GL_ES
precision highp float;
#endif
#define OCTAVES ${oct}

uniform vec2 u_resolution;
uniform float u_time;
` + NOISE + `
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 r = mat2(0.8, 0.6, -0.6, 0.8);
  for (int i = 0; i < OCTAVES; i++) { v += a * noise(p); p = r * p * 2.0; a *= 0.5; }
  return v;
}

void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution) / u_resolution.y * 3.0;
  float t = u_time * 0.25;
  // Five fbm calls per pixel: two for q, two for r, one for the final value
  vec2 q = vec2(fbm(p + vec2(0.0, t)), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 1.5), fbm(p + 4.0 * q + vec2(8.3, 2.8) - t));
  float f = fbm(p + 3.5 * r);
  vec3 col = mix(vec3(0.06, 0.0, 0.03), vec3(0.85, 0.12, 0.02), clamp(f * f * 3.0, 0.0, 1.0));
  col = mix(col, vec3(1.0, 0.7, 0.15), clamp(length(q) * f * 1.4 - 0.25, 0.0, 1.0));
  col = mix(col, vec3(0.03, 0.0, 0.06), clamp(r.y * r.y - 0.15, 0.0, 1.0));
  col += vec3(1.0, 0.9, 0.6) * pow(clamp(f * 1.25, 0.0, 1.0), 8.0);
  gl_FragColor = vec4(col, 1.0);
}
`;

      title: "load() 熱抽換",
      api: "load(frag, vert)・on(\"load\")",
      desc: "把著色器拆成可替換的片段，每次選單變動就拼出新字串、呼叫 load() 重新編譯；選「傾斜卡片」時連頂點著色器一起換。新程式的自訂 uniform 會歸零，所以要在 on(\"load\") 裡重新設定。",
      hint: "換任一個選單，左側會標出改了哪一段",
      mount(ctx) {
        ctx.html(`<div class="gc-swap"><div class="gc-code panel"><pre></pre><div class="gc-st2"></div></div><div class="gc-view2 gc-checker"></div></div>`);
        const pre = ctx.$("pre"), st = ctx.$(".gc-st2");
        const g = createSandbox(ctx, ctx.$(".gc-view2"));
        const sb = g.sb;
        const vert0 = sb.vertexString;
        const sel = { pattern: 0, palette: 0, post: 0, vert: 0 };
        const LISTS = { pattern: SW_PAT, palette: SW_PAL, post: SW_POST, vert: SW_VERT };
        const swap = (changed) => {
          const secs = [
            ["head", SW_HEAD],
            ["pattern", `// [圖樣] ${SW_PAT[sel.pattern][0]}\n${SW_PAT[sel.pattern][1]}\n`],
            ["palette", `// [調色] ${SW_PAL[sel.palette][0]}\n${SW_PAL[sel.palette][1]}\n`],
            ["post", `// [後製] ${SW_POST[sel.post][0]}\n${SW_POST[sel.post][1]}\n`],
            ["main", SW_MAIN],
          ];
          const vert = sel.vert ? CARD_VERT : vert0;
          secs.push(["vert", `\n// ---- 頂點著色器：load() 的第二個參數（${SW_VERT[sel.vert]}）----\n${vert.trim()}\n`]);
          const frag = secs.slice(0, 5).map((s) => s[1]).join("");
          g.load(frag, vert);
          pre.innerHTML = secs.map(([k, s]) => (k === changed ? `<mark class="gc-hl">${esc(s)}</mark>` : esc(s))).join("");
          const mark = pre.querySelector("mark");
          pre.scrollTop = mark ? Math.max(0, mark.offsetTop - 8) : 0;
          st.textContent = sb.isValid && sb.program
            ? `第 ${g.loads} 次 load()・${fmtMs(g.ms)}・片段 ${frag.split("\n").length} 行・頂點：${SW_VERT[sel.vert]}`
            : "編譯失敗";
        };
        const sels = {};
        const add = (key, label) => {
          sels[key] = ctx.select(label, LISTS[key].map((o, i) => ({ value: String(i), label: Array.isArray(o) ? o[0] : o })), "0", (v) => { sel[key] = +v; swap(key); });
        };
        add("pattern", "圖樣");
        add("palette", "調色");
        add("post", "後製");
        add("vert", "頂點");
        let auto = false;
        ctx.toggle("自動輪播", false, (v) => { auto = v; });
        const KEYS = Object.keys(sel);
        ctx.interval(() => {
          if (!auto) return;
          const k = KEYS[Math.floor(Math.random() * KEYS.length)];
          const n = LISTS[k].length;
          sel[k] = (sel[k] + 1 + Math.floor(Math.random() * (n - 1))) % n;
          sels[k].value = String(sel[k]);
          swap(k);
        }, 2200);
        swap(null);
      },
    },
    {
      id: "multi",
      title: "多畫布",
      api: "data-fragment・data-textures・new GlslCanvas(el)",
      desc: "每個 canvas 都是獨立的 GlslCanvas 與 WebGL 環境，著色器寫在 data-fragment 屬性、圖片寫在 data-textures。沒用到 u_time 或 u_mouse 的靜態著色器只畫一次，所以標籤上的 render 次數是 0。",
      hint: "拖色相：靜態畫布也會因 setUniform 重畫一次",
      mount(ctx) {
        ctx.html(`<div class="gc-tiles"></div>`);
        const wrap = ctx.$(".gc-tiles");
        let hue = 0;
        const items = TILES.map((tl) => {
          const tile = h("div", { class: "gc-tile" });
          wrap.append(tile);
          const attrs = { "data-fragment": tl.frag };
          if (tl.tex) attrs["data-textures"] = tl.tex;
          const g = createSandbox(ctx, tile, { attrs, pointer: true });
          const em = h("em", { text: "…" });
          tile.append(h("div", { class: "gc-tag" }, h("div", {}, h("b", { text: tl.name }), h("span", { text: tl.api })), em));
          g.sb.setUniform("u_hue", hue);
          return { g, em };
        });
        const paint = () => items.forEach(({ g, em }) => {
          em.textContent = `${g.rps}/s・${g.sb.animated ? "動態" : "靜態"}・建立 ${fmtMs(g.ctorMs)}`;
        });
        ctx.slider("色相", { min: 0, max: 1, step: 0.01, value: 0 }, (v) => { hue = v; items.forEach(({ g }) => g.sb.setUniform("u_hue", v)); });
        ctx.toggle("全部暫停", false, (v) => items.forEach(({ g }) => (v ? g.sb.pause() : g.sb.play())));
        ctx.interval(paint, 500);
        paint();
      },
    },
    {
      id: "buffers",
      title: "多通道緩衝",
      api: "#ifdef BUFFER_0・uniform sampler2D u_buffer0",
      desc: "原始碼裡寫 #ifdef BUFFER_0，glslCanvas 就會多編一支程式畫進浮點紋理，下一幀再以 u_buffer0 讀回，於是能在 GPU 上跑會累積狀態的模擬。這需要浮點渲染目標，部分行動裝置不支援。",
      hint: "按住拖曳攪動，再切到「水波模擬」",
      mount(ctx) {
        ctx.html(`<div class="gc-fill gc-bg"></div><div class="gc-readout panel"></div>`);
        const g = createSandbox(ctx, ctx.$(".gc-fill"), { dpr: false });
        const sb = g.sb, canvas = g.canvas, box = ctx.$(".gc-readout");
        if (!floatRT(sb.gl)) {
          ctx.status("").error("這個裝置不支援浮點渲染目標（OES_texture_float 加浮點 framebuffer），glslCanvas 的多通道緩衝無法運作。");
          return;
        }
        const SIMS = [
          { name: "墨水漩渦", frag: INK, dpr: false, scale: 1 },
          { name: "水波模擬", frag: WAVE, dpr: true, scale: 0.5 },
        ];
        let cur = 0, pen = [0, 0, 0], dropPending = false;
        sb.on("load", () => { sb.setUniform("u_pen", ...pen); sb.setUniform("u_drop", 0, 0, 0); });
        // A drop is an impulse: clear it right after the frame that consumed it.
        sb.on("render", () => { if (dropPending) { dropPending = false; sb.setUniform("u_drop", 0, 0, 0); } });
        const paint = () => {
          const w = canvas.width, hh = canvas.height;
          box.innerHTML = `<div><b>#ifdef BUFFER_0</b> 這段畫進 u_buffer0，下一幀再讀回（兩張浮點紋理輪流）</div>
<div>緩衝 <b>${w}×${hh}</b>・RGBA 浮點 ×2・${((w * hh * 16 * 2) / 1048576).toFixed(1)} MB</div>
<div>主畫面讀到的是上一幀；尺寸一變就重新 load()，模擬歸零</div>
<div>render <b>${g.rps}</b> 次/秒・${cur ? "每 0.6 秒落一滴・" : ""}按住拖曳可攪動</div>`;
        };
        const run = (i) => {
          cur = i;
          g.dpr = SIMS[i].dpr;
          g.scale = SIMS[i].scale;
          g.load(SIMS[i].frag);
          paint();
        };
        ctx.group(SIMS.map((s) => s.name), 0, (i) => run(i));
        ctx.button("重設", () => run(cur));
        canvas.style.touchAction = "none";
        const setPen = (e, z) => {
          const r = canvas.getBoundingClientRect();
          pen = [(e.clientX - r.left) / r.height, (r.bottom - e.clientY) / r.height, z];
          sb.setUniform("u_pen", ...pen);
        };
        ctx.on(canvas, "pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); setPen(e, 1); });
        ctx.on(canvas, "pointermove", (e) => { if (pen[2]) setPen(e, 1); });
        const up = (e) => { if (pen[2]) setPen(e, 0); };
        ctx.on(canvas, "pointerup", up);
        ctx.on(canvas, "pointercancel", up);
        ctx.interval(() => {
          if (cur !== 1) return;
          const asp = canvas.clientWidth / Math.max(1, canvas.clientHeight);
          sb.setUniform("u_drop", asp * (0.1 + 0.8 * Math.random()), 0.1 + 0.8 * Math.random(), 0.5 + 0.5 * Math.random());
          dropPending = true;
        }, 600);
        ctx.interval(paint, 500);
        run(0);
      },
    },
    {
      id: "stress",
      title: "極限測試",
      kind: "stress",
      api: "canvas 解析度 × fbm 八度",
      desc: "片段著色器的成本約等於像素數乘上每個像素的運算量：逐級放大繪圖緩衝的解析度倍率，看 FPS 何時跌破 30。",
      hint: "按「自動加壓」開始",
      mount(ctx) {
        ctx.html(`<div class="gc-stress gc-bg"><div class="gc-badge panel"><b>×1</b><span></span></div></div>`);
        const host = ctx.$(".gc-stress"), badgeN = ctx.$(".gc-badge b"), badgeInfo = ctx.$(".gc-badge span");
        ctx.controls.classList.add("bottom");
        let oct = 5;
        const g = createSandbox(ctx, host, { frag: stressFrag(oct), dpr: false });
        const paint = () => {
          const { width: w, height: hh } = g.canvas;
          badgeN.textContent = `×${g.scale}`;
          badgeInfo.textContent = `${w}×${hh} px・${((w * hh) / 1e6).toFixed(2)} MP・每像素 ${5 * oct} 次雜訊`;
        };
        ctx.select("fbm 八度", [3, 5, 8].map((n) => ({ value: String(n), label: `${n} 層` })), "5", (v) => { oct = +v; g.load(stressFrag(oct)); paint(); });
        ctx.interval(paint, 500);
        paint();
        ctx.ramp({
          label: "解析度倍率",
          steps: [0.25, 0.5, 0.75, 1, 1.5, 2, 3],
          initial: 3,
          format: (n) => `×${n}`,
          async apply(n) {
            g.scale = n;
            g.sb.resize();
            paint();
            await ctx.frame(2);
          },
          metrics: () => {
            const { width: w, height: hh } = g.canvas;
            return { "繪圖緩衝": `${w}×${hh}`, "百萬像素": ((w * hh) / 1e6).toFixed(2), "雜訊/幀": fmtCompact(w * hh * 5 * oct) };
          },
          note: "倍率是每個 CSS 像素對應幾個繪圖像素，倍率加倍時像素數變四倍。每個像素要算 5 次 fbm，每次 fbm 疊「八度」層雜訊，所以成本約為像素數 × 5 × 八度。軟體算圖（SwiftShader）會比實體 GPU 早很多掉幀。",
        });
      },
    },
  ],
});
</script>
</body>
</html>
