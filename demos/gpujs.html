<script>
// ---------- Kernels: plain JavaScript that GPU.js transpiles to GLSL, WebAssembly or JS ----------
function mandelbrot(left, bottom, step, maxIter, shift) {
  const x0 = left + this.thread.x * step;
  const y0 = bottom + this.thread.y * step;
  let x = 0;
  let y = 0;
  let dx = 0;
  let dy = 0;
  let count = 0;
  for (let n = 0; n < maxIter; n++) {
    const xx = x * x;
    const yy = y * y;
    if (xx + yy > 256) break;
    // Track the derivative dz = 2 z dz + 1 for the distance estimate
    const ndx = 2 * (x * dx - y * dy) + 1;
    dy = 2 * (x * dy + y * dx);
    dx = ndx;
    y = 2 * x * y + y0;
    x = xx - yy + x0;
    count = count + 1;
  }
  if (count >= maxIter) {
    this.color(0.012, 0.016, 0.035, 1);
  } else {
    const mag = Math.sqrt(x * x + y * y);
    // Smooth escape count drives the hue, distance to the set drives the glow
    const smooth = count + 1 - Math.log(Math.log(mag)) / 0.693147;
    const dist = (mag * Math.log(mag)) / Math.sqrt(dx * dx + dy * dy);
    const near = Math.max(0, 1 - dist / (step * 12));
    const glow = 0.12 + 0.88 * Math.pow(near, 3);
    const t = Math.log(smooth) * 0.55 + shift;
    const r = 0.5 + 0.5 * Math.cos(6.28318 * (t + 0.0));
    const g = 0.5 + 0.5 * Math.cos(6.28318 * (t + 0.1));
    const b = 0.5 + 0.5 * Math.cos(6.28318 * (t + 0.22));
    const core = Math.pow(near, 14) * 0.6;
    this.color(r * glow + core, g * glow + core, (0.2 + b * 0.8) * glow + core, 1);
  }
}

function matMul(a, b) {
  let sum = 0;
  for (let i = 0; i < this.constants.size; i++) {
    sum += a[this.thread.y][i] * b[i][this.thread.x];
  }
  return sum;
}

// mode 0 box blur (radius r), 1 sharpen, 2 Sobel edges, 3 emboss
function convolve(img, mode, r) {
  const x = this.thread.x;
  const y = this.thread.y;
  const W = this.output.x - 1;
  const H = this.output.y - 1;
  const c = img[y][x];
  if (mode === 0) {
    let sr = 0;
    let sg = 0;
    let sb = 0;
    let n = 0;
    for (let j = -r; j <= r; j++) {
      for (let i = -r; i <= r; i++) {
        let yy = y + j;
        let xx = x + i;
        if (yy < 0) yy = 0;
        if (yy > H) yy = H;
        if (xx < 0) xx = 0;
        if (xx > W) xx = W;
        const p = img[yy][xx];
        sr += p[0];
        sg += p[1];
        sb += p[2];
        n++;
      }
    }
    this.color(sr / n, sg / n, sb / n, 1);
  } else {
    let xl = x - 1;
    let xr = x + 1;
    let yd = y - 1;
    let yu = y + 1;
    if (xl < 0) xl = 0;
    if (xr > W) xr = W;
    if (yd < 0) yd = 0;
    if (yu > H) yu = H;
    if (mode === 1) {
      const n4 = img[y][xl];
      const e4 = img[y][xr];
      const s4 = img[yd][x];
      const u4 = img[yu][x];
      const k = r * 0.35;
      this.color(
        c[0] + (4 * c[0] - n4[0] - e4[0] - s4[0] - u4[0]) * k,
        c[1] + (4 * c[1] - n4[1] - e4[1] - s4[1] - u4[1]) * k,
        c[2] + (4 * c[2] - n4[2] - e4[2] - s4[2] - u4[2]) * k, 1);
    } else {
      const p00 = img[yd][xl]; const p10 = img[yd][x]; const p20 = img[yd][xr];
      const p01 = img[y][xl]; const p21 = img[y][xr];
      const p02 = img[yu][xl]; const p12 = img[yu][x]; const p22 = img[yu][xr];
      const l00 = p00[0] * 0.3 + p00[1] * 0.59 + p00[2] * 0.11;
      const l10 = p10[0] * 0.3 + p10[1] * 0.59 + p10[2] * 0.11;
      const l20 = p20[0] * 0.3 + p20[1] * 0.59 + p20[2] * 0.11;
      const l01 = p01[0] * 0.3 + p01[1] * 0.59 + p01[2] * 0.11;
      const l21 = p21[0] * 0.3 + p21[1] * 0.59 + p21[2] * 0.11;
      const l02 = p02[0] * 0.3 + p02[1] * 0.59 + p02[2] * 0.11;
      const l12 = p12[0] * 0.3 + p12[1] * 0.59 + p12[2] * 0.11;
      const l22 = p22[0] * 0.3 + p22[1] * 0.59 + p22[2] * 0.11;
      if (mode === 2) {
        const gx = (l20 + 2 * l21 + l22) - (l00 + 2 * l01 + l02);
        const gy = (l02 + 2 * l12 + l22) - (l00 + 2 * l10 + l20);
        const m = Math.min(1, Math.sqrt(gx * gx + gy * gy) * r * 0.45);
        this.color(m * 0.3 + c[0] * 0.08, m * 0.79 + c[1] * 0.08, m * 0.94 + c[2] * 0.08, 1);
      } else {
        const e = 0.5 + (l22 + l21 + l12 - l00 - l01 - l10) * r * 0.25;
        this.color(e, e * 0.97, e * 0.92, 1);
      }
    }
  }
}

// Gray-Scott reaction diffusion, state per cell is [u, v]
function gsInit(seed) {
  // Scatter round seeds of radius 5 over roughly one in six 16-cell blocks
  const bx = Math.floor(this.thread.x / 16);
  const by = Math.floor(this.thread.y / 16);
  const hsh = Math.sin(bx * 12.9898 + by * 78.233 + seed) * 43758.5453;
  const dx = this.thread.x - (bx * 16 + 8);
  const dy = this.thread.y - (by * 16 + 8);
  let u = 1;
  let v = 0;
  if (hsh - Math.floor(hsh) > 0.83 && dx * dx + dy * dy < 26) {
    u = 0.5;
    v = 0.25;
  }
  return [u, v];
}
function gsStep(s, f, k, px, py, pr) {
  const x = this.thread.x;
  const y = this.thread.y;
  const w = this.output.x;
  const h = this.output.y;
  const xl = (x + w - 1) % w;
  const xr = (x + 1) % w;
  const yd = (y + h - 1) % h;
  const yu = (y + 1) % h;
  const c = s[y][x];
  const n1 = s[y][xl]; const n2 = s[y][xr]; const n3 = s[yd][x]; const n4 = s[yu][x];
  const d1 = s[yd][xl]; const d2 = s[yd][xr]; const d3 = s[yu][xl]; const d4 = s[yu][xr];
  const lu = 0.2 * (n1[0] + n2[0] + n3[0] + n4[0]) + 0.05 * (d1[0] + d2[0] + d3[0] + d4[0]) - c[0];
  const lv = 0.2 * (n1[1] + n2[1] + n3[1] + n4[1]) + 0.05 * (d1[1] + d2[1] + d3[1] + d4[1]) - c[1];
  const uvv = c[0] * c[1] * c[1];
  let u = c[0] + (lu - uvv + f * (1 - c[0]));
  let v = c[1] + (0.5 * lv + uvv - (k + f) * c[1]);
  const ddx = x - px;
  const ddy = y - py;
  if (ddx * ddx + ddy * ddy < pr * pr) {
    u = 0.5;
    v = 0.25;
  }
  return [Math.min(1, Math.max(0, u)), Math.min(1, Math.max(0, v))];
}
function gsRender(s) {
  const c = s[this.thread.y][this.thread.x];
  const a = Math.min(1, c[1] * 4.5);
  const b = Math.min(1, Math.max(0, c[1] * 4.5 - 1.1));
  this.color(0.02 + 0.28 * a + 0.67 * b, 0.03 + 0.76 * a - 0.62 * b, 0.07 + 0.87 * a - 0.4 * b, 1);
}

// Value noise helpers registered with gpu.addFunction
function vhash(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y) {
  const ix = Math.floor(x);
  const iy = Math.floor(y);
  const fx = x - ix;
  const fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = vhash(ix, iy);
  const b = vhash(ix + 1, iy);
  const c = vhash(ix, iy + 1);
  const d = vhash(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, oct) {
  let s = 0;
  let amp = 0.5;
  let fr = 1;
  for (let i = 0; i < 8; i++) {
    if (i < oct) s += amp * vnoise(x * fr, y * fr);
    amp *= 0.42;
    fr *= 2.03;
  }
  return s;
}

// One Jacobi sweep of the heat equation with sources q and fixed borders
function sweep(u, q) {
  const x = this.thread.x;
  const y = this.thread.y;
  const hi = this.constants.hi;
  if (x === 0 || y === 0 || x === hi || y === hi) return u[y][x];
  return 0.25 * (u[y][x - 1] + u[y][x + 1] + u[y - 1][x] + u[y + 1][x] + q[y][x]);
}
function copyGrid(a) {
  return a[this.thread.y][this.thread.x];
}

// Glow of `iters` point lights spread along a morphing Lissajous curve.
// More iterations only make the curve smoother, but the cost grows linearly: heavy on purpose.
function field(t, iters, da, invW, invH, asp) {
  const x = this.thread.x * invW - 0.5;
  const y = (this.thread.y * invH - 0.5) * asp;
  let s = 0;
  for (let i = 0; i < iters; i++) {
    const a = i * da;
    const dx = x - Math.sin(a * 3 + t * 0.9) * 0.4;
    const dy = y - Math.sin(a * 2 + t * 0.6) * 0.4 * asp;
    s += 1 / (dx * dx + dy * dy + 0.0004);
  }
  return s / iters;
}

// ---------- Helpers ----------
const { h, fmt, fmtMs, fmtCompact } = Showcase;
const abort = () => new DOMException("Scene unmounted", "AbortError");

function destroyGpu(gpu) {
  try {
    const p = gpu.destroy();
    if (p && typeof p.catch === "function") p.catch((e) => console.warn("[gpujs] destroy failed", e));
  } catch (e) {
    console.warn("[gpujs] destroy failed", e);
  }
}
// One GPU instance per scene (or per backend), destroyed with the scene
function gpuFor(ctx, settings) {
  const gpu = settings ? new GPU(settings) : new GPU();
  ctx.onCleanup(() => destroyGpu(gpu));
  return gpu;
}
// Let the browser paint, and stop if the viewer left the scene
async function breathe(ctx) {
  await ctx.frame(2);
  await ctx.sleep(0);
}
function backendOf(k) {
  const inner = k.kernel || k;
  const mode = inner.constructor.mode;
  if (mode === "gpu") return typeof WebGL2RenderingContext !== "undefined" && inner.context instanceof WebGL2RenderingContext ? "WebGL2" : "WebGL1";
  if (mode === "webasm") return "WebAssembly";
  if (mode === "webgpu") return "WebGPU";
  return "JavaScript";
}
function randomInput(n) {
  const m = new Float32Array(n * n);
  for (let i = 0; i < m.length; i++) m[i] = Math.random();
  return GPU.input(m, [n, n]);
}
function maxDiff(p, q) {
  let d = 0;
  for (let y = 0; y < p.length; y++) {
    const rp = p[y], rq = q[y];
    for (let x = 0; x < rp.length; x++) d = Math.max(d, Math.abs(rp[x] - rq[x]));
  }
  return d;
}
const gflops = (n, ms) => (2 * n ** 3) / (ms / 1000) / 1e9;
const softwareGl = () => Showcase.device().software;
const glName = () => Showcase.device().gpu || "未知";

// 256-entry colour lookup table from [t, r, g, b] stops
function lut(stops) {
  const t = new Uint8ClampedArray(256 * 3);
  for (let i = 0; i < 256; i++) {
    const x = i / 255;
    let j = 0;
    while (j < stops.length - 2 && x > stops[j + 1][0]) j++;
    const a = stops[j], b = stops[j + 1];
    const f = Math.max(0, Math.min(1, (x - a[0]) / (b[0] - a[0])));
    for (let c = 0; c < 3; c++) t[i * 3 + c] = a[c + 1] + (b[c + 1] - a[c + 1]) * f;
  }
  return t;
}
const HEAT = lut([[0, 5, 6, 16], [0.3, 86, 20, 125], [0.55, 214, 52, 96], [0.8, 255, 150, 60], [1, 255, 244, 170]]);
const GREY = lut([[0, 10, 14, 24], [1, 236, 240, 248]]);
const SLOPE = lut([[0, 8, 10, 22], [0.35, 40, 70, 160], [0.7, 76, 201, 240], [1, 240, 250, 255]]);
const LAND = lut([[0, 18, 46, 98], [0.4, 46, 112, 170], [0.43, 214, 200, 150], [0.5, 96, 150, 72], [0.66, 52, 100, 54], [0.8, 128, 110, 92], [0.9, 236, 236, 240], [1, 255, 255, 255]]);

// Draw a 2D result (array of rows) through a value -> [0, 1] mapping and a LUT,
// optionally scaling brightness. Kernel rows start at the bottom, so `flip` puts row 0 last.
function paint(cv, rows, map, table, flip, shade) {
  const hh = rows.length, w = rows[0].length;
  if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; }
  const g = cv.getContext("2d");
  const img = g.createImageData(w, hh);
  const d = img.data;
  for (let y = 0; y < hh; y++) {
    const ry = flip ? hh - 1 - y : y;
    const row = rows[ry];
    for (let x = 0; x < w; x++) {
      const v = map(row[x], x, ry);
      const s = shade ? shade(row[x], x, ry) : 1;
      const i = Math.max(0, Math.min(255, (v * 255) | 0)) * 3, o = (y * w + x) * 4;
      d[o] = table[i] * s; d[o + 1] = table[i + 1] * s; d[o + 2] = table[i + 2] * s; d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
}

// Lane rows used by the race scenes
function laneRow(name, color) {
  const nameEl = h("span", { class: "name", text: name });
  const ms = h("span", { class: "ms", text: "待命" });

// ---------- Scene 1 constants ----------
const TARGETS = [
  { name: "海馬谷", x: -0.743643887037151, y: 0.13182590420533 },
  { name: "螺旋", x: -0.77568377, y: 0.13646737 },
  { name: "漩渦", x: 0.001643721971153, y: -0.822467633298876 },
];
const HOME = { x: -0.76, y: 0 };
const HOLD = 3;             // seconds to show the whole set before diving in
const PERIOD = 32;          // seconds for one zoom in and back out
const MIN_SCALE = 2.6e-7;   // complex units per CSS pixel at the deepest point (float32 limit)

Showcase.run({ scenes: [
  {
    id: "fractal", title: "碎形縮放",
    api: "gpu.createKernel(mandelbrot).setGraphical(true).setLoopMaxIterations(520)",
    desc: "同一個 JavaScript 函式被 GPU.js 轉成 GLSL，每個像素一條執行緒計算 Mandelbrot 逃逸次數，再用 this.color() 直接上色；切到 CPU 改由純 JavaScript 逐格執行同一個函式。",
    hint: "切換 GPU／CPU 比較每幀耗時，「換放大點」跳到下一個深處",
    mount(ctx) {
      const view = h("div", { class: "view" });
      ctx.el.append(view);
      let engine = "gpu", engines = {}, target = 0, zoomStart = performance.now(), layout = null, info = null;
      ctx.group(["GPU", "CPU"], 0, (i) => { engine = i ? "cpu" : "gpu"; });
      ctx.button("換放大點", () => { target = (target + 1) % TARGETS.length; zoomStart = performance.now() - HOLD * 1000; });
      const meter = ctx.fps({
        extra: () => info ? { 後端: info.backend, 解析度: `${layout.w}×${layout.h}`, 迭代: info.maxIter, [info.name]: `${fmtCompact(Math.round(info.zoom))}×` } : {},
      });
      meter.el.classList.add("under");

      function computeLayout() {
        const W = view.clientWidth, H = view.clientHeight;
        const top = ctx.controls.offsetHeight + meter.el.offsetHeight + 24, bottom = 16;
        const fw = Math.max(80, W), fh = Math.max(80, H - top - bottom);
        const k = Math.min(1, Math.sqrt(420000 / (W * H)));
        return { W, H, fx: W / 2, fy: top + fh / 2, s0: Math.max(2.9 / fw, 2.5 / fh), w: Math.max(2, Math.round(W * k)), h: Math.max(2, Math.round(H * k)) };
      }
      function dropEngines() {
        for (const e of Object.values(engines)) { destroyGpu(e.gpu); e.canvas?.remove(); }
        engines = {};
      }
      ctx.onCleanup(dropEngines);
      function engineFor(kind) {
        if (!engines[kind]) {
          const gpu = kind === "cpu" ? new GPU({ mode: "cpu" }) : new GPU();
          const kernel = gpu.createKernel(mandelbrot).setOutput([layout.w, layout.h]).setGraphical(true).setLoopMaxIterations(520);
          engines[kind] = { gpu, kernel, canvas: null };
        }
        return engines[kind];
      }
      ctx.onResize(() => {
        const next = computeLayout();
        if (!layout || next.w !== layout.w || next.h !== layout.h) dropEngines();
        layout = next;
      });

      ctx.raf((now) => {
        if (!layout) layout = computeLayout();
        let t = (now - zoomStart) / 1000;
        if (t > HOLD + PERIOD) { target = (target + 1) % TARGETS.length; zoomStart = now; t = 0; }
        const z = t < HOLD ? 0 : 0.5 - 0.5 * Math.cos((2 * Math.PI * (t - HOLD)) / PERIOD);
        const s = layout.s0 * Math.pow(MIN_SCALE / layout.s0, z);
        const T = TARGETS[target];
        // The target point stays fixed on screen while the scale shrinks around it.
        const cx = T.x + (HOME.x - T.x) * (s / layout.s0);
        const cy = T.y + (HOME.y - T.y) * (s / layout.s0);
        const left = cx - layout.fx * s;
        const bottom = cy - (layout.H - layout.fy) * s;
        const step = (s * layout.W) / layout.w;
        const zoom = layout.s0 / s;
        const maxIter = Math.round(Math.min(500, 110 + 70 * Math.log10(zoom)));
        const e = engineFor(engine);
        e.kernel(left, bottom, step, maxIter, t * 0.015);
        // Show whichever canvas the kernel draws into (it changes if GPU.js falls back to CPU).
        const c = e.kernel.canvas;
        if (c !== e.canvas) { e.canvas?.remove(); e.canvas = c; view.append(c); }
        for (const other of Object.values(engines)) if (other.canvas) other.canvas.hidden = other !== e;

    async mount(ctx) {

      if (!ctx.active) throw abort();

  {

      const gpu = gpuFor(ctx);

      const km = gpu.createKernelMap({
        height: function saveHeight(v) { return v; },

      }, function (ox, oy, sc, oct, az) {
        const x = ox + this.thread.x * sc;
        const y = oy + this.thread.y * sc;
        const hc = fbm(x, y, oct);
        const gx = (fbm(x + sc, y, oct) - fbm(x - sc, y, oct)) / (2 * sc);

        paint(fR.cv, r.result, (v, x, y) => level(hr[y][x]), LAND, true,
          (v, x, y) => (level(hr[y][x]) < 0.42 ? 0.92 : 0.25 + 0.95 * v));
        info.textContent = `${w}×${hgt}・三份輸出一次執行 ${fmtMs(ms)}`;
      });
    },
  },

  {
    id: "createpipe", title: "編譯管線",
    api: "gpu.createPipeline(fn, { constants: { sweeps } })・pipeline.executorKind",
    desc: "同一個熱擴散 Jacobi 迭代用五種方式跑：每步讀回、setPipeline 紋理串接、createPipeline（WebGL 與 WebAssembly），比較耗時並核對結果一致。熱源是「GPU.js」字樣。",
    hint: "調整迭代次數會重新量測",
    async mount(ctx) {
      const N = 128;
      // Heat sources: the text "GPU.js" rasterised into the grid
      const tc = h("canvas", { width: N, height: N });
      const tg = tc.getContext("2d");
      tg.fillStyle = "#fff";
      tg.textAlign = "center";
      tg.textBaseline = "middle";
      tg.font = "bold 34px system-ui, sans-serif";
      tg.fillText("GPU.js", N / 2, N / 2 + 2);
      const alpha = tg.getImageData(0, 0, N, N).data;
      const q = new Float32Array(N * N);
      for (let i = 0; i < q.length; i++) q[i] = alpha[i * 4 + 3] > 120 ? 0.6 : 0;
      const U = GPU.input(new Float32Array(N * N), [N, N]), Q = GPU.input(q, [N, N]);

      const heat = h("canvas");
      const mapLbl = h("span", { class: "lbl bl" });
      const verdict = h("div", { class: "verdict", text: "量測中…" });
      const lanesEl = h("div", { style: "display:grid;gap:10px" });
      const note = h("p", { class: "small" });
      const board = h("div", { class: "board" },
        h("div", { class: "card" }, h("h3", { text: `${N}×${N} 熱擴散：五種跑法` }), lanesEl, verdict, note),
        h("div", { class: "card" }, h("div", { class: "heatmap" }, heat, mapLbl),
          h("p", { class: "small", text: "邊界固定為 0 度，字樣持續加熱；每次迭代每格取上下左右平均。五條跑道算出的溫度場應該一模一樣。" })));
      ctx.el.append(board);

      let sweeps = 300, busy = false, again = false;
      ctx.slider("迭代次數", { min: 50, max: 1000, step: 50, value: sweeps }, (v) => { sweeps = v; schedule(); });
      ctx.button("重新量測", () => schedule());

      const gl = gpuFor(ctx), wa = gpuFor(ctx, { mode: "webasm" });
      const C = { constants: { hi: N - 1 }, output: [N, N] };
      const kRead = gl.createKernel(sweep, C);
      const kCopy = gl.createKernel(copyGrid, { output: [N, N], pipeline: true, immutable: true });
      const kTex = gl.createKernel(sweep, { ...C, pipeline: true, immutable: true });
      const kGlInner = gl.createKernel(sweep, C);
      const kWasm = wa.createKernel(sweep, C);
      const kWaInner = wa.createKernel(sweep, C);
      const pipes = { n: 0, gl: null, wa: null };
      const makePipe = (gpu, k, n) => gpu.createPipeline(function (u, q) {
        for (let s = 0; s < this.constants.sweeps; s++) u = k(u, q);
        return u;
      }, { constants: { sweeps: n } });
      ctx.onCleanup(() => { pipes.gl?.destroy?.(); pipes.wa?.destroy?.(); });

      const perStep = (k) => (n) => { let u = k(U, Q); for (let i = 1; i < n; i++) u = k(u, Q); return u; };
      const lanes = [
        { name: "WebGL・每步讀回", color: "var(--c5)", warm: () => kRead(U, Q), run: perStep(kRead) },
        {
          name: "WebGL・紋理串接", color: "var(--c2)",
          warm: () => { const a = kCopy(U), b = kTex(a, a); a.delete(); b.delete(); },
          run: (n) => {
            const tq = kCopy(Q);
            let tu = kCopy(U);
            for (let i = 0; i < n; i++) { const nt = kTex(tu, tq); tu.delete(); tu = nt; }
            const out = tu.toArray();
            tu.delete(); tq.delete();
            return out;
          },
        },
        { name: "WebGL・createPipeline", color: "var(--c6)", pipe: "gl" },
        { name: "WASM・每步呼叫", color: "var(--c1)", warm: () => kWasm(U, Q), run: perStep(kWasm) },
        { name: "WASM・createPipeline", color: "var(--c4)", pipe: "wa" },
      ].map((l) => ({ ...l, row: laneRow(l.name, l.color) }));
      lanesEl.append(...lanes.map((l) => l.row.el));

      function schedule() {
        again = true;
        if (!busy) measure();
      }
      async function measure() {
        busy = true;
        try {
          while (again) {
            again = false;
            const n = sweeps;
            if (pipes.n !== n) {
              pipes.gl?.destroy?.(); pipes.wa?.destroy?.();
              pipes.gl = makePipe(gl, kGlInner, n); pipes.wa = makePipe(wa, kWaInner, n); pipes.n = n; pipes.warm = false;
            }
            verdict.textContent = `${n} 次迭代量測中…`;
            lanes.forEach((l) => l.row.set("等待", 0, false));
            const res = [];
            for (const l of lanes) {
              l.row.set("暖身中…", 0);
              await breathe(ctx);
              let out, t0;
              if (l.pipe) {
                const p = pipes[l.pipe];
                await p(U, Q); // first call records the plan and compiles
                l.row.set("計算中…", 0);
                await breathe(ctx);
                t0 = performance.now();
                out = await p(U, Q);
                l.row.tag(p.executorKind + (l.pipe === "wa" && p.fallbackReason ? "（退回）" : ""));
              } else {
                l.warm();
                l.row.set("計算中…", 0);
                await breathe(ctx);
                t0 = performance.now();
                out = l.run(n);
              }
              const ms = performance.now() - t0;
              res.push({ l, ms, out });
              l.row.set(fmtMs(ms), 100, false, "");
              if (res.length === 1 || l.pipe === "gl") drawHeat(out);
              if (again) break;
            }
            if (again) continue;
            const base = res[0], max = Math.max(...res.map((r) => r.ms));
            const best = res.reduce((a, b) => (b.ms < a.ms ? b : a));
            for (const r of res) {
              const x = base.ms / r.ms;
              r.l.row.set(fmtMs(r.ms), (r.ms / max) * 100, r === best,
                `${r === base ? "基準" : `${x >= 1 ? "快" : "慢"} ${(x >= 1 ? x : 1 / x).toFixed(1)} 倍`}・與基準最大差 ${r === base ? "0" : maxDiff(r.out, base.out).toExponential(1)}`);
            }
            verdict.innerHTML = `<b>${best.l.name}</b> 最快，是每步讀回的 ${(base.ms / best.ms).toFixed(1)} 倍`;
            const pw = pipes.wa;
            note.textContent = `WebGL 的 createPipeline 走 ${pipes.gl.executorKind} 執行器（依序呼叫核心，中間結果留在紋理，只在最後讀回）；WebAssembly 走 ${pw.executorKind}${pw.fallbackReason ? `，退回原因：${pw.fallbackReason}` : "，所有步驟在同一塊記憶體內連續執行"}。暖身呼叫（轉譯、編譯、記錄計畫）不計入。`;
          }
        } catch (e) {
          if (e && e.name === "AbortError") return;
          console.error(e);
          verdict.textContent = `量測失敗：${e?.message || e}`;
        } finally {
          busy = false;
        }
      }
      function drawHeat(rows) {
        let m = 1e-6;
        for (const row of rows) for (let x = 0; x < row.length; x++) m = Math.max(m, row[x]);
        paint(heat, rows, (v) => Math.sqrt(v / m), HEAT, false);
        mapLbl.textContent = `最高溫 ${m.toFixed(1)}`;
      }
      schedule();
    },
  },

  {
    id: "async", title: "非同步讀回",
    api: "kernel.setAsyncMode(true)・await kernel(t, iters, …)",
    desc: "同步呼叫要等 GPU 算完、讀回結果才回到主執行緒；setAsyncMode 在 WebGL2 改用像素緩衝與 fence 讀回，主執行緒照常跑動畫。下方時間軸是每一幀的間隔。",
    hint: "切換同步／非同步，拉高迴圈數看卡頓差異",
    mount(ctx) {
      const field2d = h("canvas", { class: "field" });
      const orbit = h("canvas", { class: "orbit" });
      const tlc = h("canvas");
      ctx.el.append(field2d, orbit, h("div", { class: "gapbox" }, tlc));
      const { width: W, height: H } = ctx.size();
      const fw = Math.max(64, Math.round(Math.sqrt((48000 * W) / Math.max(1, H)))), fh = Math.max(48, Math.round(48000 / fw));
      const asp = fh / fw;
      const gpu = gpuFor(ctx);
      const MAX_ITERS = 20000;
      const kSync = gpu.createKernel(field).setOutput([fw, fh]).setLoopMaxIterations(MAX_ITERS);
      const kAsync = gpu.createKernel(field).setOutput([fw, fh]).setLoopMaxIterations(MAX_ITERS).setAsyncMode(true);
      // Slider position 0..100 maps to 100..20000 iterations on a log scale
      const itersAt = (p) => Math.max(100, Math.round((100 * Math.pow(200, p / 100)) / 50) * 50);

      let useAsync = false, iters = itersAt(41), pending = false, lastFrame = 0, waitMs = 0, latency = 0, warm = false;
      const gaps = [], shown = [];
      ctx.group(["同步呼叫", "非同步 setAsyncMode"], 0, (i) => { useAsync = i === 1; });
      ctx.slider("迴圈", { min: 0, max: 100, value: 41, format: (p) => fmt(itersAt(p)) }, (p) => { iters = itersAt(p); });
      const rate = () => { const now = performance.now(); while (shown.length && shown[0] < now - 1000) shown.shift(); return shown.length; };
      const meter = ctx.fps({ extra: () => ({ 輸出: `${fw}×${fh}`, 每秒結果: rate(), [useAsync ? "結果延遲" : "主執行緒等待"]: fmtMs(useAsync ? latency : waitMs) }) });
      meter.el.classList.add("under");

      const show = (rows) => {
        // log scale between the dimmest and brightest pixel keeps the curve readable at any load
        let lo = Infinity, hi = 0;
        for (const row of rows) for (let x = 0; x < row.length; x++) { const v = row[x]; if (v < lo) lo = v; if (v > hi) hi = v; }
        const span = Math.log(Math.max(hi / Math.max(lo, 1e-6), 1.0001));
        paint(field2d, rows, (v) => Math.log(Math.max(v, lo) / Math.max(lo, 1e-6)) / span, HEAT, false);
        shown.push(performance.now());
      };
      const sizeCanvas = (cv) => {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.round(cv.clientWidth * dpr), hh = Math.round(cv.clientHeight * dpr);
        if (cv.width !== w || cv.height !== hh) { cv.width = w; cv.height = hh; }
        return dpr;
      };
      function drawOrbit(t) {
        const dpr = sizeCanvas(orbit);
        const g = orbit.getContext("2d");
        g.clearRect(0, 0, orbit.width, orbit.height);
        const cx = orbit.width / 2, cy = (orbit.height - 110 * dpr) / 2 + 30 * dpr, R = Math.min(cx, cy) * 0.45;
        for (let i = 0; i < 12; i++) {
          const a = t / 260 - i * 0.16;
          g.fillStyle = `rgba(120, 220, 255, ${(1 - i / 12).toFixed(2)})`;
          g.beginPath();
          g.arc(cx + Math.cos(a) * R, cy + Math.sin(a) * R, (9 - i * 0.55) * dpr, 0, Math.PI * 2);
          g.fill();
        }
      }
      function drawTimeline() {
        const dpr = sizeCanvas(tlc);
        const g = tlc.getContext("2d"), w = tlc.width, hh = tlc.height;
        g.clearRect(0, 0, w, hh);
        const top = 24 * dpr, base = hh - 8 * dpr, span = base - top;
        const y = (ms) => base - Math.min(1, ms / 200) * span;
        g.strokeStyle = "rgba(123, 211, 137, 0.6)"; g.setLineDash([4 * dpr, 4 * dpr]);
        g.beginPath(); g.moveTo(0, y(16.7)); g.lineTo(w, y(16.7)); g.stroke();
        g.strokeStyle = "rgba(247, 37, 133, 0.5)";
        g.beginPath(); g.moveTo(0, y(100)); g.lineTo(w, y(100)); g.stroke();
        g.setLineDash([]);
        const bw = w / 180;
        gaps.forEach((ms, i) => {
          g.fillStyle = ms > 50 ? "#f72585" : ms > 25 ? "#ff8c42" : "#7bd389";
          g.fillRect(w - (gaps.length - i) * bw, y(ms), Math.max(1, bw - 1), base - y(ms));
        });
        const worst = gaps.length ? Math.max(...gaps.slice(-120)) : 0;
        g.fillStyle = "#cfd6e6"; g.font = `${11.5 * dpr}px ui-monospace, monospace`; g.textBaseline = "top";
        g.fillText(`每幀間隔（最近 180 幀）  最長卡頓 ${worst.toFixed(0)} ms  虛線 16.7 ms／100 ms`, 8 * dpr, 7 * dpr);
      }

      ctx.raf((t) => {
        const now = performance.now();
        if (lastFrame) { gaps.push(now - lastFrame); if (gaps.length > 180) gaps.shift(); }
        lastFrame = now;
        drawOrbit(t);
        if (!warm) { warm = true; kSync(0, 50, 0.1, 1 / fw, 1 / fh, asp); }
        const n = iters, da = (2 * Math.PI) / n;
        if (!useAsync) {
          const t0 = performance.now();
          const rows = kSync(t / 1000, n, da, 1 / fw, 1 / fh, asp);
          waitMs = performance.now() - t0;
          show(rows);
        } else if (!pending) {
          pending = true;
          const t0 = performance.now();
          kAsync(t / 1000, n, da, 1 / fw, 1 / fh, asp).then((rows) => {
            pending = false;
            if (!ctx.active) return;
            latency = performance.now() - t0;
            show(rows);
          }, (e) => { pending = false; if (ctx.active) console.error(e); });
        }
        drawTimeline();
      });
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "gpu.createKernel(matMul).setOutput([n, n]).setConstants({ size: n })",
    desc: "矩陣邊長從 64 加到 2048，計時 WebGL 核心單次呼叫；右側同時列出 WebAssembly 與純 JavaScript 跑同一個函式的耗時。",
    hint: "按「開始測試」",
    mount(ctx) {
      const KEYS = [
        { id: "gpu", name: "GPU", color: "var(--c2)" },
        { id: "webasm", name: "WASM", color: "var(--c6)" },
        { id: "cpu", name: "JS", color: "var(--c5)" },
      ];
      const SIZES = [64, 128, 256, 384, 512, 768, 1024, 1536, 2048];
      const SKIP = 2500;
      const rowsEl = h("div", { style: "display:grid;gap:6px" }, h("div", { class: "empty", text: "按「開始測試」後逐級顯示三種後端的耗時。" }));
      const chart = h("div", { class: "mm" },
        h("div", { class: "hd" }, h("b", { text: "同一個 matMul，三種後端" }), h("span", { class: "small", text: "對數刻度・越短越快" })),
        h("div", { class: "legend" }, KEYS.map((k) => h("span", {}, h("i", { style: `background:${k.color}` }), k.id === "gpu" ? "GPU（WebGL）" : k.id === "webasm" ? "WebAssembly" : "純 JavaScript"))),
        rowsEl);
      ctx.el.append(chart);
      const gpus = { gpu: gpuFor(ctx), webasm: gpuFor(ctx, { mode: "webasm" }), cpu: gpuFor(ctx, { mode: "cpu" }) };
      const perN3 = { webasm: 0, cpu: 0 };
      const rows = new Map();

      function rowFor(n) {
        if (rows.has(n)) return rows.get(n);
        if (!rows.size) rowsEl.replaceChildren();
        const cells = {}, ms = {};
        const say = h("div", { class: "say" });
        const bars = h("div", { class: "bars" }, KEYS.map((k) => {
          const i = h("i", { style: `background:${k.color}` });
          const v = h("span", { text: "…" });
          cells[k.id] = { i, v };
          return h("div", { class: "b" }, h("span", { text: k.name }), h("div", { class: "t" }, i), v);
        }));
        rowsEl.append(h("div", { class: "row" }, h("b", { text: `${n}²` }), bars, say));
        const api = {
          set(id, value, text) {
            const c = cells[id];
            if (value != null) {
              ms[id] = value;
              c.i.style.width = `${Math.max(2, Math.min(100, ((Math.log10(Math.max(value, 0.1)) + 1) / 5) * 100))}%`;
              c.v.textContent = fmtMs(value);
            } else c.v.textContent = text;
            c.v.title = c.v.textContent;
          },
          done() {
            const g = ms.gpu, ref = ms.cpu ?? ms.webasm, refName = ms.cpu != null ? "純 JS" : "WASM";
            let s = `${gflops(n, g).toFixed(2)} GFLOPS`;
            if (ref != null) s += g <= ref ? `・GPU 比${refName}快 <b>${(ref / g).toFixed(1)}</b> 倍` : `・GPU 比${refName}慢 <b>${(g / ref).toFixed(1)}</b> 倍`;
            say.innerHTML = s;
          },
        };
        rows.set(n, api);
        chart.scrollTop = chart.scrollHeight;
        return api;
      }

      ctx.bench({
        label: "矩陣邊長", sizes: SIZES, format: (n) => `${n}²`, target: 500, budget: 1500,
        title: "極限測試：GPU 矩陣乘法",
        note: "每列計時的是 WebGL 核心單次呼叫，含上傳兩個矩陣與讀回結果；首次呼叫的轉譯與著色器編譯不計入。右側的 WebAssembly 與純 JavaScript 在準備階段量測，預估超過 2.5 秒的級距略過，大尺寸只跑一次。沒有顯示卡（軟體模擬 WebGL）時 GPU 數字會偏慢，實體顯示卡在大尺寸通常領先。",
        async prepare(n) {
          rows.delete(n);
          const row = rowFor(n);
          const A = randomInput(n), B = randomInput(n);
          row.set("gpu", null, "編譯中…");
          await breathe(ctx);
          const kg = gpus.gpu.createKernel(matMul).setOutput([n, n]).setConstants({ size: n });
          kg(A, B);
          for (const id of ["webasm", "cpu"]) {
            const guess = perN3[id] * n ** 3;
            if (guess > SKIP) { row.set(id, null, `略過 約${fmtMs(guess)}`); continue; }
            row.set(id, null, "計算中…");
            await breathe(ctx);
            const k = gpus[id].createKernel(matMul).setOutput([n, n]).setConstants({ size: n });
            if (guess < 400) k(A, B);
            const t0 = performance.now();
            k(A, B);
            const ms = performance.now() - t0;
            perN3[id] = ms / n ** 3;
            row.set(id, ms);
          }
          row.set("gpu", null, "計時中…");
          return { kg, A, B, row };
        },
        run(n, { kg, A, B, row }) {
          const t0 = performance.now();
          kg(A, B);
          row.set("gpu", performance.now() - t0);
          row.done();
        },
      });
    },
  },
] });
</script>
</body>
