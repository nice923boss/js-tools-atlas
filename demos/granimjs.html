<script src="https://cdn.jsdelivr.net/npm/granim@2.0.0/dist/granim.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Granim.js 2.0.0 showcase: eight scenes, from the original fjord hero to a many-canvas stress ramp.
const img = (n) => `_shared/img/photo-${n}.jpg`;
const swatch = (c) => (typeof c === "string" ? c : c.color);
const rgba = (a) => `rgba(${a[0]}, ${a[1]}, ${a[2]}, ${a[3]})`;
// Granim parses hsl() only with integer components.
const hsl = (h, s = 82, l = 56) => `hsl(${((Math.round(h) % 360) + 360) % 360}, ${s}%, ${l}%)`;
let uid = 0;

// destroy() leaves two async hooks alive: a pending image onload (which would start a fresh rAF loop)
// and the isPausedWhenNotInView debounce timer.
function kill(g) {
  if (!g) return;
  if (g.imageNode) { g.imageNode.onload = null; g.imageNode.onerror = null; }
  clearTimeout(g.scrollDebounceTimeout);
  g.destroy();
}
// One live instance per slot; the scene cleanup kills the last one.
function holder(ctx) {
  let g = null;
  ctx.onCleanup(() => { kill(g); g = null; });
  return {
    get g() { return g; },
    set(opts) { kill(g); g = new Granim(opts); return g; },
  };
}
// An image instance starts its own rAF loop in image.onload. Calling changeState() before that
// starts a second loop which destroy() can no longer cancel, so callers rebuild instead.
const ready = (g) => !g.image || g.isImgLoaded;

const HERO_STATES = {
  dawn: { gradients: [["#ff9a8b", "#f6d365"], ["#f72585", "#ff8c42"], ["#9d8cff", "#ff9a8b"]], transitionSpeed: 2600 },
  ocean: { gradients: [["#0f2027", "#4cc9f0"], ["#1e3c72", "#7bd389"], ["#134e5e", "#71b280"]], transitionSpeed: 2600 },
  neon: { gradients: [["#f72585", "#4361ee"], ["#7209b7", "#4cc9f0"], ["#f7df1e", "#f72585"]], transitionSpeed: 2000 },
};
const HERO_TITLES = { dawn: "峽灣晨光", ocean: "深海藍調", neon: "霓虹夜色" };
const HERO_BLENDS = [["色彩增值", "multiply"], ["覆蓋", "overlay"], ["柔光", "soft-light"], ["濾色", "screen"], ["純漸層", ""]];

const DIR_GRADS = [["#f72585", "#7209b7", "#3a0ca3", "#4cc9f0"], ["#ff9f1c", "#f72585", "#7209b7", "#2ec4b6"], ["#4cc9f0", "#4361ee", "#f72585", "#ffd166"]];
const DIR_POS = [[0, 0.12, 0.3, 1], [0, 0.55, 0.8, 1], [0, 0.25, 0.7, 1]];
const DIRS = [["對角", "diagonal"], ["左右", "left-right"], ["上下", "top-bottom"], ["放射", "radial"], ["自訂", "custom"]];
// Mirrors Granim's setDirection(): [x0, y0, x1, y1], or [cx, cy, r] for radial.
function gradientLine(g) {
  const W = g.x1, H = g.y1, c = g.customDirection;
  const px = (v, size) => (v.indexOf("%") > -1 ? (size / 100) * parseInt(v, 10) : parseInt(v, 10));
  switch (g.direction) {
    case "diagonal": return [0, 0, W, H];
    case "left-right": return [0, 0, W, 0];
    case "top-bottom": return [W / 2, 0, W / 2, H];
    case "radial": return [W / 2, H / 2, W / 2];
    default: return [px(c.x0, W), px(c.y0, H), px(c.x1, W), px(c.y1, H)];
  }
}

// Extra keys (label, temp, text) are ignored by Granim; it only reads gradients, transitionSpeed and loop.
const WX = {
  sunny: { label: "晴天", temp: 30, text: "晴時多雲", transitionSpeed: 2200, gradients: [["#1e90ff", "#56ccf2", "#ffe29f"], ["#2f80ed", "#6dd5fa", "#fff3b0"], ["#0f6fde", "#89f7fe", "#ffd166"]] },
  cloudy: { label: "陰天", temp: 24, text: "陰時多雲", transitionSpeed: 3000, gradients: [["#606c88", "#8e9eab", "#cfd9df"], ["#757f9a", "#a7b4c2", "#e2ebf0"], ["#4b5563", "#9ca3af", "#d1d5db"]] },
  sunset: { label: "夕陽", temp: 27, text: "傍晚轉晴", transitionSpeed: 1800, loop: false, gradients: [["#ff7e5f", "#feb47b", "#ffd166"], ["#f72585", "#ff7e5f", "#feb47b"], ["#3a0ca3", "#b5179e", "#ff7e5f"]] },
  night: { label: "夜晚", temp: 22, text: "晴朗無雲", transitionSpeed: 3200, gradients: [["#0f0c29", "#302b63", "#24243e"], ["#141e30", "#243b55", "#3a6073"], ["#000428", "#004e92", "#1a2a6c"]] },
};

const POSTERS = [
  { date: "11.08 SAT", title: "秋夜爵士音樂會", place: "臺中・草悟道", dir: "diagonal", speed: 2600, gradients: [["#fceabb", "#f8b500"], ["#1a1a2e", "#16213e"], ["#ffecd2", "#fcb69f"], ["#0f2027", "#2c5364"]] },
  { date: "11.15 SAT", title: "城市設計週", place: "高雄・駁二藝術特區", dir: "top-bottom", speed: 3000, gradients: [["#e0c3fc", "#8ec5fc"], ["#2b1055", "#1a0b38"], ["#d4fc79", "#96e6a1"], ["#24123f", "#3b2f6a"]] },
  { date: "11.22 SAT", title: "海岸電影節", place: "花蓮・七星潭", dir: "radial", speed: 3400, gradients: [["#a1ffce", "#faffd1"], ["#0b1a2e", "#1d3557"], ["#fdfbfb", "#ebedee"], ["#200122", "#5a0a0a"]] },
];

const BLEND_GRID = [["色彩增值", "multiply"], ["濾色", "screen"], ["覆蓋", "overlay"], ["柔光", "soft-light"], ["加深", "color-burn"], ["明度", "luminosity"], ["色相", "hue"], ["差異值", "difference"]];
const BLEND_STATES = {
  warm: { gradients: [["#ff5f6d", "#ffc371"], ["#f72585", "#ffd166"], ["#ff8c42", "#9d8cff"]], transitionSpeed: 2400 },
  cool: { gradients: [["#4cc9f0", "#3a0ca3"], ["#2ec4b6", "#4361ee"], ["#7bd389", "#1e3c72"]], transitionSpeed: 2400 },
};
const PHOTOS = [["峽灣", 1], ["水母", 6], ["母獅", 7]];

const MASK_TEXTS = ["GRANIM.JS", "流動漸層", "2026"];
const MASK_BLENDS = [["填字", "multiply"], ["白字", "screen"], ["反相", "difference"]];
const MASK_FITS = [
  { label: "填滿", full: true, position: ["center", "center"], stretchMode: ["none", "none"] },
  { label: "拉伸", position: ["center", "center"], stretchMode: ["stretch", "stretch"] },
  { label: "置中", position: ["center", "center"], stretchMode: ["none", "none"] },
  { label: "右下", position: ["right", "bottom"], stretchMode: ["none", "none"] },
];
const MASK_STATES = { "default-state": { gradients: [["#f72585", "#7209b7", "#4cc9f0"], ["#ff9f1c", "#f72585", "#3a0ca3"], ["#7bd389", "#4cc9f0", "#f7df1e"]], transitionSpeed: 2200 } };
// White text on black. multiply keeps the gradient inside the letters, screen keeps it outside.
function maskURL(text, w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.fillStyle = "#000"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  const font = (s) => `900 ${s}px "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif`;
  let size = h * 0.5;
  g.font = font(size);
  const tw = g.measureText(text).width;
  if (tw > w * 0.86) { size *= (w * 0.86) / tw; g.font = font(size); }
  g.fillText(text, w / 2, h / 2);
  return c.toDataURL();
}

const CITIES = ["基隆", "臺北", "新北", "桃園", "新竹", "苗栗", "臺中", "彰化", "雲林", "嘉義", "臺南", "高雄"];

Showcase.run({ scenes: [
  {
    id: "hero", title: "主視覺",
    api: "new Granim({ element, states, image })・changeState()・changeBlendingMode()",
    desc: "原本的峽灣主視覺：Granim 每一格先畫照片，再用 image.blendingMode 把流動漸層疊上去。換配色用 changeState()，會從目前的顏色平滑過渡；換混合模式用 changeBlendingMode()，兩者都不必重建。只有「純漸層」要拿掉 image 選項，才需要重建實例。",
    hint: "切換配色與混合模式・純漸層會重建實例",
    mount(ctx) {
      ctx.html(`<div class="gbox hero"><canvas class="gc"></canvas><div class="hero-txt"><small>NORWAY FJORD TOUR</small><h1>峽灣晨光</h1><p>漸層會在三種配色之間持續流動</p></div></div><div class="tag"></div>`);
      const cv = ctx.$("canvas"), h1 = ctx.$("h1"), tag = ctx.$(".tag");
      const slot = holder(ctx);
      const keys = Object.keys(HERO_STATES);
      let state = keys[0], blend = "multiply", made = 0, call = "";
      const build = () => {
        made++;
        slot.set({
          element: cv, direction: "diagonal", states: HERO_STATES, defaultStateName: state, stateTransitionSpeed: 1400,
          ...(blend ? { image: { source: img(1), blendingMode: blend, position: ["center", "center"], stretchMode: ["stretch-if-smaller", "stretch-if-smaller"] } } : {}),
        });
      };
      const paint = () => {
        tag.innerHTML = `<code>${call}</code><br><span class="muted">配色 <b>${state}</b>・混合 <b>${blend || "無照片"}</b>・累計建立 <b>${made}</b> 個實例</span>`;
      };
      ctx.group(["晨光", "海洋", "霓虹"], 0, (i) => {
        state = keys[i];
        h1.textContent = HERO_TITLES[state];
        if (ready(slot.g)) { slot.g.changeState(state); call = `granim.changeState("${state}")`; }
        else { build(); call = `new Granim({ defaultStateName: "${state}", ... })`; }
        paint();
      });
      ctx.group(HERO_BLENDS.map((b) => b[0]), 0, (i) => {
        const next = HERO_BLENDS[i][1];
        const live = next && blend && slot.g.image;
        blend = next;
        if (live) { slot.g.changeBlendingMode(next); call = `granim.changeBlendingMode("${next}")`; }
        else { build(); call = next ? `new Granim({ image: { source, blendingMode: "${next}" } })` : "new Granim({ states })　不帶 image，重建實例"; }
        paint();
      });
      build();
      call = `new Granim({ image: { source, blendingMode: "multiply" } })`;
      paint();
    },
  },
  {
    id: "direction", title: "方向與色標",
    api: "direction・customDirection・changeDirection()・{ color, pos }",
    desc: "白色虛線是 Granim 實際傳給 Canvas 的漸層軸，圓點是每個色標目前的位置與顏色。五種 direction 中前四種可用 changeDirection() 即時切換；custom 要搭配 customDirection（px 或 % 字串），它只在建構時讀取，所以改角度會重建實例。打開「指定色標」後，每個顏色寫成 { color, pos }，位置也會跟著動畫。",
    hint: "切換方向・自訂時拖曳角度・打開指定色標看位置移動",
    mount(ctx) {
      ctx.html(`<div class="gbox"><canvas class="gc"></canvas><svg class="ov" preserveAspectRatio="none"><circle class="ring"/><line/><g class="dots"></g></svg></div><div class="tag"></div>`);
      const cv = ctx.$("canvas"), svg = ctx.$("svg"), ring = ctx.$(".ring"), axis = ctx.$("line"), dotsG = ctx.$(".dots"), tag = ctx.$(".tag");
      const slot = holder(ctx);
      const dots = DIR_GRADS[0].map(() => {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("r", 7);
        dotsG.append(c);
        return c;
      });
      let dir = "diagonal", angle = 30, usePos = false, pending = 0, call = "new Granim({ direction: \"diagonal\" })", lastTag = 0;
      const custom = () => {
        const a = (angle * Math.PI) / 180;
        const p = (v) => `${Math.round(50 + 50 * v)}%`;
        return { x0: p(-Math.cos(a)), y0: p(-Math.sin(a)), x1: p(Math.cos(a)), y1: p(Math.sin(a)) };
      };
      const build = () => {
        const cd = custom();
        slot.set({
          element: cv, direction: dir, ...(dir === "custom" ? { customDirection: cd } : {}),
          states: { "default-state": { transitionSpeed: 2400, gradients: usePos ? DIR_GRADS.map((gr, k) => gr.map((color, i) => ({ color, pos: DIR_POS[k][i] }))) : DIR_GRADS } },
        });
        call = dir === "custom"
          ? `new Granim({ direction: "custom", customDirection: { x0: "${cd.x0}", y0: "${cd.y0}", x1: "${cd.x1}", y1: "${cd.y1}" } })`
          : `new Granim({ direction: "${dir}"${usePos ? ", states: { gradients: [[{ color, pos }, ...]] }" : ""} })`;
      };
      ctx.group(DIRS.map((d) => d[0]), 0, (i) => {
        dir = DIRS[i][1];
        angleIn.parentElement.style.display = dir === "custom" ? "" : "none";
        // customDirection is read only by the constructor.
        if (dir === "custom") build();
        else { slot.g.changeDirection(dir); call = `granim.changeDirection("${dir}")`; }
      });
      const angleIn = ctx.slider("角度", { min: 0, max: 345, step: 15, value: angle, format: (v) => `${v}°` }, (v) => {
        angle = v;
        clearTimeout(pending);
        pending = ctx.timeout(build, 160);
      });
      angleIn.parentElement.style.display = "none";
      ctx.toggle("指定色標 pos", false, (v) => { usePos = v; build(); });
      const setLine = (x0, y0, x1, y1) => { axis.setAttribute("x1", x0); axis.setAttribute("y1", y0); axis.setAttribute("x2", x1); axis.setAttribute("y2", y1); };
      const r1 = (v) => Math.round(v);
      ctx.raf((t) => {
        const g = slot.g;
        if (!g || !g.currentColors.length) return;
        const W = g.x1, H = g.y1;
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        const L = gradientLine(g);
        let at, real;
        if (g.direction === "radial") {
          const [cx, cy, r] = L;
          ring.style.display = "";
          ring.setAttribute("cx", cx); ring.setAttribute("cy", cy); ring.setAttribute("r", r);
          setLine(cx + r, cy, cx, cy);
          // createRadialGradient(cx, cy, r, cx, cy, 0): stop 0 sits on the outer circle, stop 1 at the centre.
          at = (p) => [cx + r * (1 - p), cy];
          real = `createRadialGradient(${r1(cx)}, ${r1(cy)}, ${r1(r)}, ${r1(cx)}, ${r1(cy)}, 0)`;
        } else {
          ring.style.display = "none";
          const [x0, y0, x1, y1] = L;
          real = `createLinearGradient(${r1(x0)}, ${r1(y0)}, ${r1(x1)}, ${r1(y1)})`;
          // left-right runs along y = 0; the gradient is constant across the axis, so draw it through the centre.
          const dx = W / 2 - (x0 + x1) / 2, dy = H / 2 - (y0 + y1) / 2;
          setLine(x0 + dx, y0 + dy, x1 + dx, y1 + dy);
          at = (p) => [x0 + dx + (x1 - x0) * p, y0 + dy + (y1 - y0) * p];
        }
        g.currentColorsPos.forEach((p, i) => {
          const [x, y] = at(p);
          dots[i].setAttribute("cx", x); dots[i].setAttribute("cy", y);
          dots[i].setAttribute("fill", rgba(g.currentColors[i]));
        });
        if (t - lastTag < 200) return;
        lastTag = t;
        const pos = g.currentColorsPos.map((p) => +p.toFixed(2)).join("・");
        tag.innerHTML = `<code>${call}</code><br><span class="muted">實際呼叫</span> <code>${real}</code><br><span class="muted">色標 pos</span> <b>${pos}</b>${usePos ? "" : "　<span class=\"muted\">未指定時平均分配</span>"}`;
      });
      build();
    },
  },
  {
    id: "events", title: "狀態與事件",
    api: "changeState()・pause()・play()・clear()・granim:gradientChange・granim:end",
    desc: "四種天氣是四個 state，每個 state 的顏色數必須相同。changeState() 先用 stateTransitionSpeed 從目前顏色過渡過去，之後改用該 state 自己的 transitionSpeed。canvas 會派送 granim:start、granim:gradientChange、granim:end 三種事件，右側紀錄每一次事件與顏色；夕陽設了 loop: false，播完最後一組會停下並觸發 granim:end。",
    hint: "切換天氣・暫停、清空・調整切換時間後再換天氣",
    mount(ctx) {
      ctx.html(`<div class="gbox"><canvas class="gc"></canvas><div class="wx-wrap"><div class="wx"><small>臺北市・今天</small><b class="t"></b><span class="d"></span><code class="s"></code></div><div class="log"><header>事件紀錄</header><ol></ol></div></div></div>`);
      const cv = ctx.$("canvas"), ol = ctx.$("ol");
      const slot = holder(ctx);
      const keys = Object.keys(WX);
      let state = "sunny", speed = 1000, pending = 0;
      const sw = (cols) => `<span class="sw">${cols.map((c) => `<i style="background:${swatch(c)}"></i>`).join("")}</span>`;
      const log = (html) => {
        const li = document.createElement("li");
        li.innerHTML = `<time>${new Date().toTimeString().slice(0, 8)}</time>${html}`;
        ol.prepend(li);
        while (ol.children.length > 9) ol.lastChild.remove();
      };
      const paintCard = () => {
        ctx.$(".t").textContent = `${WX[state].temp}°`;
        ctx.$(".d").textContent = WX[state].text;
        ctx.$(".s").textContent = `activeState: "${state}"`;
      };
      // Granim dispatches granim:start inside its constructor, so listen before the first new Granim().
      ctx.on(cv, "granim:start", () => log("<code>granim:start</code>"));
      ctx.on(cv, "granim:gradientChange", (e) => {
        const d = e.detail;
        log(`<code>gradientChange</code> ${sw(d.colorsFrom)} → ${sw(d.colorsTo)}${d.isLooping ? " <em>回到第一組</em>" : ""}`);
      });
      ctx.on(cv, "granim:end", () => log(`<code>granim:end</code> <em>loop: false，停在最後一組</em>`));
      const build = () => {
        slot.set({ element: cv, direction: "top-bottom", states: WX, defaultStateName: state, stateTransitionSpeed: speed });
        pauseBtn.setAttribute("aria-pressed", "false");
      };
      ctx.group(keys.map((k) => WX[k].label), 0, (i) => {
        if (keys[i] === state) return;
        state = keys[i];
        log(`<code class="m">changeState("${state}")</code>`);
        slot.g.changeState(state);
        pauseBtn.setAttribute("aria-pressed", "false");
        paintCard();
      });
      const pauseBtn = ctx.toggle("暫停", false, (v) => {
        if (v) slot.g.pause(); else slot.g.play();
        log(`<code class="m">${v ? "pause()" : "play()"}</code>`);
      });
      ctx.button("清空", () => {
        // clear() alone cancels the loop but keeps the instance flagged as animating, so a later play()
        // would not restart it. Pausing first leaves it restartable.
        slot.g.pause();
        slot.g.clear();
        pauseBtn.setAttribute("aria-pressed", "true");
        log(`<code class="m">clear()</code> <em>畫布清空，按暫停可再播放</em>`);
      });
      ctx.slider("切換時間", { min: 200, max: 3000, step: 100, value: speed, format: (v) => `${v} ms` }, (v) => {
        speed = v;
        clearTimeout(pending);
        pending = ctx.timeout(() => {
          log(`<code class="m">new Granim({ stateTransitionSpeed: ${v} })</code>`);
          build();
        }, 350);
      });
      paintCard();
      build();
    },
  },
  {
    id: "lightness", title: "明暗偵測",
    api: "new Granim({ name, elToSetClassOn })",
    desc: "設定 name 後，Granim 每一格會計算漸層的平均亮度，在 elToSetClassOn 指定的元素上切換 name-light 或 name-dark 類別，CSS 就能自動換文字色。三張海報各自是一個實例，漸層在淺色與深色之間輪替；關掉後文字色固定，淺色階段幾乎看不清。注意它取每個顏色 RGB 的最大值再平均，所以飽和的深藍、深紫容易被判成亮色，深色配色要讓三個通道都偏低。",
    hint: "觀察海報文字隨背景換色・關掉自動切換比較",
    mount(ctx) {
      const id = ++uid;
      ctx.html(`<div class="posters">${POSTERS.map((p, i) => `<article class="poster" id="gp-${id}-${i}"><canvas></canvas><small>${p.date}</small><b>${p.title}</b><span>${p.place}</span><em class="cls"></em></article>`).join("")}</div><div class="tag"></div>`);
      const cards = ctx.$$(".poster"), tag = ctx.$(".tag");
      const flips = cards.map(() => 0), last = cards.map(() => null);
      let auto = true, gs = [];
      const killAll = () => { gs.forEach(kill); gs = []; };
      ctx.onCleanup(killAll);
      const build = () => {
        killAll();
        cards.forEach((el) => el.classList.remove("poster-light", "poster-dark"));
        gs = POSTERS.map((p, i) => new Granim({
          element: cards[i].querySelector("canvas"), direction: p.dir,
          ...(auto ? { name: "poster", elToSetClassOn: `#${cards[i].id}` } : {}),
          states: { "default-state": { gradients: p.gradients, transitionSpeed: p.speed } },
        }));
        tag.innerHTML = auto
          ? `<code>new Granim({ name: "poster", elToSetClassOn: "#${cards[0].id}" })</code><br><span class="muted">平均亮度 ≥ 128 加 .poster-light，否則加 .poster-dark</span>`
          : `<code>new Granim({ states })</code>　<span class="muted">未設定 name，不會加任何類別</span>`;
      };
      ctx.raf(() => cards.forEach((el, i) => {
        const cls = el.classList.contains("poster-light") ? "poster-light" : el.classList.contains("poster-dark") ? "poster-dark" : "";
        if (cls === last[i]) return;
        if (last[i] && cls) flips[i]++;
        last[i] = cls;
        el.querySelector(".cls").innerHTML = cls ? `<code>.${cls}</code>・已切換 ${flips[i]} 次` : "文字色固定為白色";
      }));
      ctx.toggle("自動切換文字色", true, (v) => { auto = v; build(); });
      build();
    },
  },
  {
    id: "blend", title: "混合模式總覽",
    api: "image: { source, blendingMode, stretchMode }",
    desc: "同一組漸層、同一張照片，只換 image.blendingMode。Granim 接受 17 種值，對應 Canvas 2D 的 globalCompositeOperation；這裡挑 8 種並排比較。每格都是獨立實例，stretchMode 設成 stretch 讓照片填滿格子，暖色、冷色用 changeState() 一起切換。",
    hint: "切換照片・切換暖色與冷色",
    mount(ctx) {
      ctx.html(`<div class="bgrid">${BLEND_GRID.map(([zh, m]) => `<figure><canvas></canvas><figcaption><b>${zh}</b><code>${m}</code></figcaption></figure>`).join("")}</div>`);
      const cvs = ctx.$$(".bgrid canvas");
      let photo = 1, state = "warm", gs = [];
      const killAll = () => { gs.forEach(kill); gs = []; };
      ctx.onCleanup(killAll);
      const build = () => {
        killAll();
        gs = BLEND_GRID.map(([, m], i) => new Granim({
          element: cvs[i], direction: "left-right", states: BLEND_STATES, defaultStateName: state, stateTransitionSpeed: 900,
          image: { source: img(photo), blendingMode: m, stretchMode: ["stretch", "stretch"] },
        }));
      };
      ctx.group(PHOTOS.map((p) => p[0]), 0, (i) => { photo = PHOTOS[i][1]; build(); });
      ctx.group(["暖色", "冷色"], 0, (i) => {
        state = i ? "cool" : "warm";
        if (gs.every(ready)) gs.forEach((g) => g.changeState(state));
        else build();
      });
      build();
    },
  },
  {
    id: "mask", title: "文字遮罩",
    api: "image: { source, position, stretchMode }・changeBlendingMode()",
    desc: "把一張白字黑底的圖當成 image，混合模式就決定漸層出現在哪裡：multiply 只留在字裡，screen 只留在字外，difference 讓字變成反相的漸層。圖片由 Canvas 即時產生成 dataURL。position 決定對齊，stretchMode 決定是否拉伸；圖片比畫布小時，框外沒有圖可混合，只剩純漸層。",
    hint: "切換文字、混合方式與圖片尺寸",
    mount(ctx) {
      ctx.html(`<div class="gbox"><canvas class="gc"></canvas></div><div class="tag"></div>`);
      const cv = ctx.$("canvas"), tag = ctx.$(".tag");
      const slot = holder(ctx);
      let text = 0, blend = 0, fit = 0, pending = 0, box = [0, 0];
      const paint = () => {
        const f = MASK_FITS[fit];
        tag.innerHTML = `<code>image: { source: dataURL, blendingMode: "${MASK_BLENDS[blend][1]}", position: ["${f.position.join('", "')}"], stretchMode: ["${f.stretchMode.join('", "')}"] }</code><br><span class="muted">遮罩圖 <b>${box[0]}×${box[1]}</b>・畫布 <b>${cv.offsetWidth}×${cv.offsetHeight}</b></span>`;
      };
      const build = () => {
        const W = cv.offsetWidth, H = cv.offsetHeight, f = MASK_FITS[fit];
        const bw = f.full ? W : Math.round(Math.min(W * 0.72, 680));
        box = [bw, f.full ? H : Math.round(bw * 0.4)];
        slot.set({
          element: cv, direction: "diagonal", states: MASK_STATES,
          image: { source: maskURL(MASK_TEXTS[text], box[0], box[1]), blendingMode: MASK_BLENDS[blend][1], position: f.position, stretchMode: f.stretchMode },
        });
        paint();
      };
      ctx.group(MASK_TEXTS, 0, (i) => { text = i; build(); });
      ctx.group(MASK_BLENDS.map((b) => b[0]), 0, (i) => { blend = i; slot.g.changeBlendingMode(MASK_BLENDS[i][1]); paint(); });
      ctx.group(MASK_FITS.map((f) => f.label), 0, (i) => { fit = i; build(); });
      ctx.onResize(() => { clearTimeout(pending); pending = ctx.timeout(build, 200); });
      build();
    },
  },
  {
    id: "inview", title: "捲動自動暫停",
    api: "isPausedWhenNotInView・scrollDebounceThreshold",
    desc: "十二張卡片各是一個實例。開啟 isPausedWhenNotInView 後，Granim 在捲動停止 scrollDebounceThreshold 毫秒後檢查畫布是否在視窗內，離開就停止重繪。它只監聽 window 的 scroll 並和整個視窗比較，不認得捲動容器，所以這裡把容器的 scroll 轉發給 window；容器外但仍在視窗範圍內的卡片會被當成看得見。綠點是每 400 ms 取樣中心像素、確實有在變化的卡片。",
    hint: "自動捲動中觀察綠點・調整判斷延遲・關掉暫停功能比較",
    mount(ctx) {
      ctx.html(`<div class="strip"><div class="track">${CITIES.map((c, i) => `<div class="city"><canvas></canvas><small>${String(i + 1).padStart(2, "0")}</small><b>${c}</b><em class="st">等待中</em></div>`).join("")}</div></div><div class="tag"></div>`);
      const strip = ctx.$(".strip"), cards = ctx.$$(".city"), tag = ctx.$(".tag");
      const cvs = cards.map((c) => c.querySelector("canvas")), st = cards.map((c) => c.querySelector(".st"));
      // Create the 2D context first with willReadFrequently; Granim's own getContext('2d') returns this same context.
      const c2d = cvs.map((cv) => cv.getContext("2d", { willReadFrequently: true }));
      let pauseOff = true, delay = 300, auto = true, dirn = 1, gs = [], pending = 0;
      const killAll = () => { gs.forEach(kill); gs = []; };
      ctx.onCleanup(killAll);
      const build = () => {
        killAll();
        gs = cvs.map((cv, i) => {
          const h = i * 30;
          return new Granim({
            element: cv, direction: i % 2 ? "top-bottom" : "diagonal", isPausedWhenNotInView: pauseOff, scrollDebounceThreshold: delay,
            states: { "default-state": { transitionSpeed: 1500, gradients: [[hsl(h), hsl(h + 120)], [hsl(h + 120), hsl(h + 240)], [hsl(h + 240), hsl(h)]] } },
          });
        });
      };
      const later = () => { clearTimeout(pending); pending = ctx.timeout(build, 300); };
      // Granim only listens to window scroll; forward the container's scroll so it re-checks visibility.
      ctx.on(strip, "scroll", () => window.dispatchEvent(new Event("scroll")));
      const stopAuto = () => { if (auto) { auto = false; autoBtn.setAttribute("aria-pressed", "false"); } };
      ctx.on(strip, "wheel", stopAuto, { passive: true });
      ctx.on(strip, "pointerdown", stopAuto);
      const prev = cvs.map(() => null);
      ctx.interval(() => {
        const sr = strip.getBoundingClientRect();
        let playing = 0, dots = "";
        cvs.forEach((cv, i) => {
          if (!cv.width || !cv.height) return;
          const d = c2d[i].getImageData(cv.width >> 1, cv.height >> 1, 1, 1).data;
          const key = d[0] * 65536 + d[1] * 256 + d[2];
          const on = prev[i] !== null && key !== prev[i];
          prev[i] = key;
          if (on) playing++;
          cards[i].classList.toggle("on", on);
          st[i].textContent = on ? "播放中" : "已暫停";
          const r = cards[i].getBoundingClientRect();
          const vis = r.right > sr.left && r.left < sr.right;
          dots += `<i class="${on ? "on" : ""} ${vis ? "vis" : ""}"></i>`;
        });
        tag.innerHTML = `<code>isPausedWhenNotInView: ${pauseOff}・scrollDebounceThreshold: ${delay}</code><br><span class="map">${dots}</span>播放中 <b>${playing}</b>／${cvs.length}　<span class="muted">白框＝容器內看得到</span>`;
      }, 400);
      ctx.interval(() => {
        if (!auto) return;
        const max = strip.scrollWidth - strip.clientWidth;
        if (strip.scrollLeft >= max - 2) dirn = -1; else if (strip.scrollLeft <= 2) dirn = 1;
        strip.scrollBy({ left: dirn * (cards[0].offsetWidth + 10), behavior: "smooth" });
      }, 2200);
      const autoBtn = ctx.toggle("自動捲動", true, (v) => { auto = v; });
      ctx.slider("判斷延遲", { min: 100, max: 1000, step: 100, value: delay, format: (v) => `${v} ms` }, (v) => { delay = v; later(); });
      ctx.toggle("離開視窗就暫停", true, (v) => { pauseOff = v; build(); });
      build();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × new Granim({ element, states, onGradientChange })",
    desc: "同時跑 N 個 Granim 實例，每個實例都有自己的 requestAnimationFrame 迴圈。逐級加倍數量直到掉到 30 FPS 以下，看這台裝置能同時撐幾個流動漸層。",
    hint: "按「自動加壓」開始・打開照片混色再測一次",
    mount(ctx) {
      ctx.html(`<div class="gbox stress"><div class="sgrid"></div></div>`);
      ctx.controls.classList.add("bottom");
      const box = ctx.$(".gbox"), grid = ctx.$(".sgrid");
      const DIR4 = ["diagonal", "left-right", "top-bottom", "radial"];
      let gs = [], photo = false, thumb = "", pixels = 0, events = 0, evT = performance.now(), evRate = 0;
      const killAll = () => { gs.forEach(kill); gs = []; };
      ctx.onCleanup(killAll);
      const apply = (n) => {
        killAll();
        const W = box.clientWidth, H = box.clientHeight;
        const cols = Math.max(1, Math.round(Math.sqrt((n * W) / H)));
        grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        grid.style.gridTemplateRows = `repeat(${Math.ceil(n / cols)}, minmax(0, 1fr))`;
        grid.replaceChildren(...Array.from({ length: n }, () => document.createElement("canvas")));
        pixels = 0;
        gs = [...grid.children].map((cv, i) => {
          const h = (i * 47) % 360;
          const g = new Granim({
            element: cv, direction: DIR4[i % 4], onGradientChange: () => events++,
            states: { "default-state": { transitionSpeed: 900 + (i % 5) * 300, gradients: [[hsl(h), hsl(h + 90)], [hsl(h + 120), hsl(h + 210)], [hsl(h + 240), hsl(h + 330)]] } },
            ...(photo ? { image: { source: thumb, blendingMode: "multiply", stretchMode: ["stretch", "stretch"] } } : {}),
          });
          pixels += g.x1 * g.y1;
          return g;
        });
      };
      // A 240x160 copy of the photo keeps the per-frame drawImage cheap and identical for every cell.
      const makeThumb = () => new Promise((resolve, reject) => {
        const im = new Image();
        im.onload = () => {
          const c = document.createElement("canvas");
          c.width = 240; c.height = 160;
          c.getContext("2d").drawImage(im, 0, 0, 240, 160);
          resolve(c.toDataURL("image/jpeg", 0.85));
        };
        im.onerror = () => reject(new Error("照片載入失敗"));
        im.src = img(1);
      });
      ctx.toggle("照片混色", false, async (v) => {
        if (v && !thumb) thumb = await makeThumb();
        if (!ctx.active) return;
        photo = v;
        lab.set(lab.value);
      });
      const lab = ctx.ramp({
        label: "Granim 實例", steps: [4, 8, 16, 32, 64, 128, 256, 512], minFps: 30, apply,
        metrics: () => {
          const now = performance.now();
          if (now - evT >= 1000) { evRate = (events * 1000) / (now - evT); events = 0; evT = now; }
          return {
            總像素: pixels,
            每實例像素: gs.length ? Math.round(pixels / gs.length) : 0,
            "漸層切換/秒": +evRate.toFixed(1),
            繪製內容: photo ? "照片混色" : "純漸層",
          };
        },
        note: "每一級先 destroy() 全部實例，再把畫面切成 N 格各建一個實例。畫面總像素大致不變，所以掉幀主要來自實例數：每個實例每格各跑一次 rAF 回呼、重建 CanvasGradient、重畫整張畫布。打開「照片混色」後，每格還要多一次 drawImage 與 multiply 混合。",
      });
    },
  },
] });
</script>
</body>
