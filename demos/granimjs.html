<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Granim.js 示範：流動漸層與照片混色</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #granim { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hero {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    pointer-events: none; padding: 0 20px; text-shadow: 0 1px 3px rgba(0, 0, 0, .55), 0 2px 24px rgba(0, 0, 0, .5);
  }
  .hero small { letter-spacing: .3em; font-size: 12px; opacity: .9; }
  .hero h1 { margin: 6px 0 0; font-size: clamp(28px, 7vw, 60px); font-weight: 800; letter-spacing: .1em; }
  .hero p { margin: 8px 0 0; font-size: clamp(13px, 2vw, 16px); opacity: .9; }
  .blend { position: fixed; right: 12px; top: 56px; z-index: 50; }
</style>
</head>
<body>
<canvas id="granim"></canvas>
<div class="hero">
  <small>NORWAY FJORD TOUR</small>
  <h1 id="title">峽灣晨光</h1>
  <p>漸層會在三種配色之間持續流動</p>
</div>
<div class="controls" id="states">
  <button class="btn" data-state="dawn" aria-pressed="true">晨光</button>
  <button class="btn" data-state="ocean">海洋</button>
  <button class="btn" data-state="neon">霓虹</button>
</div>
<div class="controls blend" id="blends">
  <button class="btn" data-blend="multiply" aria-pressed="true">色彩增值</button>
  <button class="btn" data-blend="overlay">覆蓋</button>
  <button class="btn" data-blend="none">純漸層</button>
</div>
<div class="hint">切換配色狀態與照片混合模式</div>

<script src="https://cdn.jsdelivr.net/npm/granim@2.0.0/dist/granim.min.js"></script>
<script>
// Granim animates between gradient pairs inside each "state" and blends them over a photo.
const TITLES = { dawn: "峽灣晨光", ocean: "深海藍調", neon: "霓虹夜色" };
const STATES = {
  dawn: { gradients: [["#ff9a8b", "#f6d365"], ["#f72585", "#ff8c42"], ["#9d8cff", "#ff9a8b"]], transitionSpeed: 2600 },
  ocean: { gradients: [["#0f2027", "#4cc9f0"], ["#1e3c72", "#7bd389"], ["#134e5e", "#71b280"]], transitionSpeed: 2600 },
  neon: { gradients: [["#f72585", "#4361ee"], ["#7209b7", "#4cc9f0"], ["#f7df1e", "#f72585"]], transitionSpeed: 2000 },
};
let current = "dawn";
let granim = null;

function build(blend) {
  if (granim) granim.destroy();
  const opts = {
    element: "#granim",
    direction: "diagonal",
    isPausedWhenNotInView: true,
    defaultStateName: current,
    states: STATES,
  };
  if (blend !== "none") {
    opts.image = {
      source: "_shared/img/photo-1.jpg",
      blendingMode: blend,
      position: ["center", "center"],
      stretchMode: ["stretch-if-smaller", "stretch-if-smaller"],
    };
  }
  granim = new Granim(opts);
}

function press(groupId, attr, value) {
  document.querySelectorAll(`#${groupId} .btn`).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset[attr] === value)));
}

document.getElementById("states").addEventListener("click", (e) => {
  const b = e.target.closest("[data-state]");
  if (!b) return;
  current = b.dataset.state;
  granim.changeState(current);
  document.getElementById("title").textContent = TITLES[current];
  press("states", "state", current);
});

document.getElementById("blends").addEventListener("click", (e) => {
  const b = e.target.closest("[data-blend]");
  if (!b) return;
  const mode = b.dataset.blend;
  // Switching between blend modes is a live call; adding/removing the photo needs a rebuild.
  const hadImage = !!granim.image;
  if (mode !== "none" && hadImage) granim.changeBlendingMode(mode);
  else build(mode);
  press("blends", "blend", mode);
});

build("multiply");
</script>
</body>
</html>
