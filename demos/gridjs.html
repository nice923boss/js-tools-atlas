function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20261003);

// Resolve after `rounds` processing rounds reach "rendered"; Grid.js 6.2 does not emit ready/load
// events. The guard covers a round that never starts, so a wrong count cannot hang the page.
const whenRendered = (grid, rounds = 1) => new Promise((resolve, reject) => {
  let seen = 0;
  let guard = 0;
  const done = () => { clearTimeout(guard); off(); resolve(); };
  const off = grid.config.store.subscribe((s, p) => {
    if (s.status === p.status) return;
    clearTimeout(guard);
    if (s.status === 4) { off(); reject(new Error("Grid.js 回報資料錯誤")); }
    else if (s.status === 3) { if (++seen >= rounds) done(); else guard = setTimeout(done, 400); }
  });
});
// updateConfig().forceRender() with one workaround: Grid.js 6.2 useSelector compares against the
// value captured at mount, so a body mounted while status is "rendered" never sees it return to
// "rendered" and stops showing the "no records" row. Resetting to Init first avoids that.
const rebuild = (grid, partial) => {
  grid.config.store.dispatch((s) => ({ ...s, status: 0 }));
  grid.updateConfig(partial).forceRender();
};

        if (!table) return;
        const on = (b) => (b ? "開" : "關");
        log.innerHTML = `表頭 <span class="n">${ctx.$$("thead tr").length}</span> 層・資料欄 <span class="n">${ctx.$$("tbody tr:first-child td").length}</span> 個・欄寬 <span class="n">${ctx.$$("tbody tr:first-child td").map((td) => td.offsetWidth).join("/")}</span> px・固定表頭 <b>${on(opt.fixedHeader)}</b>・拖曳欄寬 <b>${on(opt.resizable)}</b>・自動欄寬 <b>${on(opt.autoWidth)}</b>`;
      };
      const off = grid.config.store.subscribe((s, p) => { if (s.status === 3 && p.status !== 3) report(); });
      ctx.onCleanup(() => { off(); grid.destroy(); });
      grid.render(ctx.$(".gj-grid"));
      const set = (key) => (v) => { opt[key] = v; rebuild(grid, { ...opt }); };
      ctx.toggle("固定表頭", true, set("fixedHeader"));
      ctx.toggle("拖曳欄寬", true, set("resizable"));
      ctx.toggle("自動欄寬", true, set("autoWidth"));
    },
  },

  // ---------- scene 5: Intl.Collator sorting, search selector ----------
  {
    id: "zh-sort", title: "中文排序與搜尋", paper: true,
    api: "sort: { compare }・Intl.Collator(\"zh-TW-u-co-…\")・search: { selector }",
    desc: "會員名單的姓名與縣市欄用 sort.compare 接上 Intl.Collator，可在筆畫、注音、拼音與 Unicode 碼位之間切換；搜尋用 selector 把手機號碼多算一份去掉「-」的版本，所以輸入連續數字也找得到。",
    hint: "切換排序方式，看上方的姓氏順序與表格怎麼變；用「快速搜尋」試試不含「-」的手機號碼",
    mount(ctx) {
      ctx.html(`<div class="gj-wrap"><div class="gj-strip"><span>姓氏順序</span><b class="gj-order"></b></div><div class="gj-grid" style="--gj-minw:500px"></div><div class="gj-log"></div></div>`);
      const log = ctx.$(".gj-log");
      const orderEl = ctx.$(".gj-order");
      const MODES = [
        { label: "筆畫", locale: "zh-TW-u-co-stroke" },
        { label: "注音", locale: "zh-TW-u-co-zhuyin" },
        { label: "拼音", locale: "zh-TW-u-co-pinyin" },
        { label: "Unicode", locale: null },
      ];
      let mode = 0;
      let collator = new Intl.Collator(MODES[0].locale);
      // A stable wrapper: the sort state keeps this function, the collator behind it can change
      const compare = (a, b) => (collator ? collator.compare(a, b) : a < b ? -1 : a > b ? 1 : 0);
      const NAMES = ["姓名", "手機", "縣市", "加入日", "點數"];
      const surnames = [...new Set(MEMBERS.map((m) => m.name[0]))];
      const grid = new Grid({
        columns: [
          { id: "name", name: "姓名", sort: { compare } },
          { id: "phone", name: "手機" },
          { id: "city", name: "縣市", sort: { compare } },
          { id: "joined", name: "加入日" },
          { id: "points", name: "點數", formatter: (v) => fmt(v) },
        ],
        data: MEMBERS,
        sort: true,
        fixedHeader: true,
        search: { selector: (cell, rowIndex, cellIndex) => (cellIndex === 1 ? `${cell} ${String(cell).replace(/-/g, "")}` : String(cell)) },
        language: { ...ZH, search: { placeholder: "搜尋姓名、手機或縣市" }, noRecordsFound: "沒有符合的會員" },
      });
      let sortedOnce = false;
      const report = () => {
        const s = grid.config.store.getState();
        const cols = (s.sort && s.sort.columns) || [];
        const sortText = cols.length ? cols.map((c) => `${NAMES[c.index]} ${c.direction === 1 ? "↑" : "↓"}`).join("、") : "未排序";
        const kw = s.search && s.search.keyword;
        const ro = collator ? collator.resolvedOptions() : null;
        log.innerHTML = `排序：<b>${sortText}</b>・${ro ? `Intl.Collator（collation: <span class="n">${ro.collation}</span>）` : "依 Unicode 碼位"}・` +
          `${kw ? `搜尋「${kw}」` : "全部"}符合 <span class="n">${s.data ? s.data.rows.length : 0}</span> 位`;
      };
      const off = grid.config.store.subscribe((s, p) => {
        if (s.status !== 3 || p.status === 3) return;
        if (!sortedOnce) {
          // Start sorted by name: click the header like a user would
          sortedOnce = true;
          const th = ctx.$("th.gridjs-th-sort");
          if (th) { th.click(); return; }
        }
        report();
      });
      ctx.onCleanup(() => { off(); grid.destroy(); });
      grid.render(ctx.$(".gj-grid"));
      const showOrder = () => { orderEl.textContent = [...surnames].sort(compare).join(" "); };
      showOrder();
      ctx.group(MODES.map((m) => m.label), 0, (i) => {
        mode = i;
        collator = MODES[mode].locale ? new Intl.Collator(MODES[mode].locale) : null;
        showOrder();
        // updateConfig rebuilds the pipeline, so the stored sort runs again with the new collator
        rebuild(grid, {});
      });
      const digits = MEMBERS[3].phone.replace(/-/g, "").slice(0, 7);
      ctx.select("快速搜尋", [
        { value: "", label: "（清空）" },
        { value: digits, label: `手機 ${digits}` },
        { value: MEMBERS[5].name[0], label: `姓 ${MEMBERS[5].name[0]}` },
        { value: "臺中", label: "臺中" },
      ], "", (v) => {
        const input = ctx.$(".gridjs-search-input");
        if (!input) return;
        input.value = v;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      });
    },
  },

  // ---------- scene 6: selection plugin + custom footer plugin ----------
  {
    id: "select", title: "列選取外掛", paper: true,
    api: "h(RowSelection, { row })・RowSelectionActions・plugins: [{ position: Footer }]・useSelector",
    desc: "出貨單用官方 selection 外掛加上勾選欄，選取狀態存在 Grid.js 的 store 裡，換頁、搜尋、排序都不會遺失；頁尾的「已選幾筆、合計多少」是自己寫的外掛元件，用 useSelector 訂閱選取狀態。",
    hint: "勾選幾筆再換頁或搜尋，選取會保留；「標記已出貨」會改資料並重建表格",
    mount(ctx) {
      ctx.html(`<div class="gj-wrap"><div class="gj-split"><div class="gj-grid" style="--gj-minw:620px"></div><div class="gj-side"><div class="gj-cap"><b>已選訂單</b><span class="gj-cnt"></span></div><ul class="gj-list"></ul></div></div><div class="gj-log">勾選框是官方 RowSelection 元件，選取的是 Row.id；6.2.0 的欄位 plugin 設定會在初始化時被清掉，所以改由 formatter 渲染</div></div>`);
      const list = ctx.$(".gj-list");
      const cnt = ctx.$(".gj-cnt");
      const log = ctx.$(".gj-log");
      const { RowSelection, RowSelectionActions } = gridjs.plugins.selection;
      const orders = ORDERS.map((o) => ({ ...o }));
      const byId = new Map(orders.map((o) => [o.id, o]));
      const rowMap = new Map(); // Row.id -> order, collected from every page that has been shown
      const selection = (s) => s.rowSelection;
      const selectedOrders = (s) => (((s.rowSelection || {}).rowIds) || []).map((id) => rowMap.get(id)).filter(Boolean);
      function SelectionFooter() {
        gridjs.useSelector(selection); // re-render whenever the selection changes
        const picked = selectedOrders(grid.config.store.getState());
        const sum = picked.reduce((a, o) => a + o.amount, 0);
        return h("div", { className: "gj-selsum" }, picked.length ? ["已選 ", h("b", null, picked.length), " 筆・合計 NT$ ", h("b", null, fmt(sum))] : "尚未選取");
      }
      const grid = new Grid({
        columns: [
          // Grid.js 6.2.0 drops column `plugin` entries (the plugin manager is reset right after
          // the header registers them), so the official component is rendered from a formatter
          { id: "sel", name: "", sort: false, width: "42px", formatter: (_, row) => h(RowSelection, { row }) },
          { id: "id", name: "單號" },
          { id: "customer", name: "客戶" },
          { id: "item", name: "品項" },
          { id: "qty", name: "數量" },
          { id: "amount", name: "金額", formatter: (v) => fmt(v) },
          { id: "status", name: "狀態", formatter: (v) => html(`<span class="gj-pill${v === "已出貨" ? " done" : ""}">${v}</span>`) },
        ],
        data: orders,
        sort: true,
        search: { selector: (cell, r, c) => (c === 0 ? "" : String(cell)) },
        pagination: { limit: 8, buttonsCount: 1 },
        plugins: [{ id: "selection-total", component: SelectionFooter, position: gridjs.PluginPosition.Footer, order: 0 }],
        language: { ...ZH, search: { placeholder: "搜尋單號、客戶或品項" } },
      });
      const renderSide = (s) => {
        const picked = selectedOrders(s);
        cnt.textContent = picked.length ? `${picked.length} 筆` : "";
        list.innerHTML = picked.length
          ? picked.map((o) => `<li><span class="n">${o.id}</span><span>${o.customer}</span><span class="n">${fmt(o.amount)}</span></li>`).join("")
          : `<li class="gj-empty">勾選表格左側的方塊</li>`;
      };
      const off = grid.config.store.subscribe((s, p) => {
        if (s.data && s.data !== p.data) for (const row of s.data.rows) rowMap.set(row.id, byId.get(row.cells[1].data));
        if (s.rowSelection !== p.rowSelection || s.data !== p.data) renderSide(s);
      });
      ctx.onCleanup(() => { off(); grid.destroy(); });
      grid.render(ctx.$(".gj-grid"));
      renderSide(grid.config.store.getState());
      const store = grid.config.store;
      const ids = () => ((store.getState().rowSelection || {}).rowIds) || [];
      ctx.button("勾選本頁", () => {
        const s = store.getState();
        if (!s.data) return;
        for (const row of s.data.rows) if (!ids().includes(row.id)) store.dispatch(RowSelectionActions.CheckRow(row.id));
      });
      const clearAll = () => { for (const id of [...ids()]) store.dispatch(RowSelectionActions.UncheckRow(id)); };
      ctx.button("全部清除", clearAll);
      ctx.button("標記已出貨", () => {
        const picked = selectedOrders(store.getState());
        if (!picked.length) { log.textContent = "先勾選要出貨的訂單"; return; }
        for (const o of picked) o.status = "已出貨";
        clearAll();
        rowMap.clear(); // rows get new ids after updateConfig
        rebuild(grid, { data: orders });
        log.innerHTML = `已把 <b>${picked.length}</b> 筆訂單標記為已出貨（updateConfig 後列物件重建，選取一併清除）`;
      }, { primary: true });
    },
  },

  // ---------- scene 7: l10n + className/style ----------
  {
    id: "i18n", title: "語系與樣式", paper: true,
    api: "language: gridjs.l10n.jaJP…・className: { table, td }・style: { th, td }",
    desc: "介面文字由 language 物件決定：日、韓、簡中、法文來自官方 gridjs/l10n 套件，繁體中文是自訂物件（官方沒有 zh-TW）。外觀用 className 加自己的類別、或用 style 直接給行內樣式，三種預設都透過 updateConfig().forceRender() 套用。",
    hint: "切換語系看搜尋框、分頁與「查無資料」怎麼變；切換樣式比較 className 與 style 兩種做法",
    mount(ctx) {
      ctx.html(`<div class="gj-wrap"><div class="gj-grid" style="--gj-minw:520px"></div><div class="gj-log"></div></div>`);
      const log = ctx.$(".gj-log");
      const L = gridjs.l10n;
      const LANGS = [["繁中（自訂）", ZH], ["日本語", L.jaJP], ["한국어", L.koKR], ["简体中文", L.cnCN], ["Français", L.frFR]];
      const STYLES = [
        { name: "預設", className: {}, style: {} },
        { name: "深色（style）", className: { container: "gj-dark" }, style: {
          th: { backgroundColor: "#22312f", color: "#e3efec", borderColor: "#34504b" },
          td: { backgroundColor: "#182220", color: "#dfe9e6", borderColor: "#2c3f3b" },
          footer: { backgroundColor: "#182220", color: "#b9cbc6", borderColor: "#34504b" },
        } },
        { name: "緊湊斑馬紋（className）", className: { table: "gj-zebra", th: "gj-tight", td: "gj-tight" }, style: {} },
      ];
      let lang = 0;
      let look = 0;
      const grid = new Grid({
        columns: ["書名", "作者", "分類", "出版年", { name: "定價", formatter: (v) => `NT$ ${v}` }],
        data: BOOKS, search: true, sort: true, fixedHeader: true,
        pagination: { limit: 6, buttonsCount: 1 },
        language: ZH,
      }).render(ctx.$(".gj-grid"));
      ctx.onCleanup(() => grid.destroy());
      const report = () => {
        const p = LANGS[lang][1].pagination;
        log.innerHTML = `language.pagination：上一頁「<b>${p.previous}</b>」下一頁「<b>${p.next}</b>」・noRecordsFound「<b>${LANGS[lang][1].noRecordsFound}</b>」・樣式：${STYLES[look].name}`;
      };
      const apply = () => {
        rebuild(grid, { language: LANGS[lang][1], className: STYLES[look].className, style: STYLES[look].style });
        report();
      };
      ctx.group(LANGS.map((l) => l[0]), 0, (i) => { lang = i; apply(); });
      ctx.select("樣式", STYLES.map((s, i) => ({ value: String(i), label: s.name })), "0", (v) => { look = +v; apply(); });
      ctx.toggle("搜尋不存在的字", false, (v) => {
        const input = ctx.$(".gridjs-search-input");
        if (!input) return;
        input.value = v ? "zzz" : "";
        input.dispatchEvent(new Event("input", { bubbles: true }));
      });
      report();
    },
  },

  // ---------- scene 8: stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "new Grid({ data, search, sort, pagination })・processingThrottleMs: 0",
    desc: "逐級把 1 千到 50 萬列資料交給 Grid.js，每級量三段：render() 到畫面完成、點「金額」排序全部資料、在搜尋框輸入「臺中」。切到「不分頁」可以看到沒有虛擬捲動時，DOM 列數直接決定成本。",
    hint: "按左側「開始測試」；切到「不分頁」再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="gj-stress"><table class="gj-res"><thead><tr><th>列數</th><th>模式</th><th>渲染</th><th>排序</th><th>搜尋</th><th>DOM 列</th></tr></thead><tbody><tr><td class="zh" colspan="6">尚未測試；下方是 1,000 列預覽</td></tr></tbody></table><div class="gj-grid"></div></div>`);
      const host = ctx.$(".gj-stress .gj-grid");
      const resBody = ctx.$(".gj-res tbody");
      ctx.controls.classList.add("bottom");
      let paged = true;
      ctx.group(["分頁 20 筆", "不分頁"], 0, (i) => { paged = i === 0; });
      let grid = null;
      const drop = () => { if (grid) { grid.destroy(); grid = null; } host.innerHTML = ""; };
      ctx.onCleanup(drop);
      // Every sortable header pushes the sort state into the pipeline on its own, so with a 0 ms
      // throttle N sortable columns mean N full sorts per click; only the timed column is sortable
      const fixed = (name) => ({ name, sort: false });
      const columns = [fixed("#"), fixed("姓名"), fixed("縣市"), { name: "金額", formatter: (v) => fmt(v) }, fixed("日期")];
      const makeRows = (n) => {
        const r = mulberry32(n);
        const rows = new Array(n);
        for (let i = 0; i < n; i++) {
          rows[i] = [i + 1, SURNAMES[(r() * 20) | 0] + GIVEN[(r() * 16) | 0], CITIES[(r() * 10) | 0], 100 + ((r() * 99000) | 0), `2026-${pad(1 + ((r() * 12) | 0), 2)}-${pad(1 + ((r() * 28) | 0), 2)}`];
        }
        return rows;
      };
      // a 1,000-row preview so the stage is not empty before the run
      grid = new Grid({ columns, data: makeRows(1000), search: true, sort: true, fixedHeader: true, pagination: { limit: 20, buttonsCount: 1 }, processingThrottleMs: 0, language: ZH }).render(host);
      const results = [];
      const timed = async (fn, rounds = 1) => { const t0 = performance.now(); const done = whenRendered(grid, rounds); fn(); await done; void host.offsetHeight; return performance.now() - t0; };
      ctx.bench({
        label: "資料列", unit: "列",
        sizes: [1000, 5000, 10000, 50000, 100000, 250000, 500000],
        prepare(n) {
          drop();
          return makeRows(n);
        },
        async run(n, rows) {
          grid = new Grid({ columns, data: rows, search: true, sort: true, fixedHeader: true, pagination: paged ? { limit: 20, buttonsCount: 1 } : false, processingThrottleMs: 0, language: ZH });
          const tRender = await timed(() => grid.render(host), 2); // sorting adds a second round on mount
          const th = ctx.$$("th.gridjs-th-sort", host).find((x) => x.textContent.includes("金額"));
          const tSort = await timed(() => th.click());
          const input = ctx.$(".gridjs-search-input", host);
          const tSearch = await timed(() => { input.value = "臺中"; input.dispatchEvent(new Event("input", { bubbles: true })); });
          const dom = host.querySelectorAll("tbody tr").length;
          results.unshift([n, paged ? "分頁" : "不分頁", tRender, tSort, tSearch, dom]);
          resBody.innerHTML = results.slice(0, 9).map(([n2, m, a, b, c, d]) =>
            `<tr><td>${fmt(n2)}</td><td class="zh">${m}</td><td>${fmtMs(a)}</td><td>${fmtMs(b)}</td><td>${fmtMs(c)}</td><td>${fmt(d)}</td></tr>`).join("");
          return `渲染 ${fmtMs(tRender)}・排序 ${fmtMs(tSort)}・搜尋 ${fmtMs(tSearch)}`;
        },
        note: "每級都重新建立 Grid，量到 store 狀態變成「已渲染」為止；開啟排序時初次渲染會跑兩輪處理（排序元件掛載後再觸發一次），渲染時間量到第二輪完成。processingThrottleMs 設為 0，否則每次處理前會先等 100 ms 節流；但 Grid.js 6.2 的每個可排序表頭都會各自觸發一次處理，節流為 0 時 5 個可排序欄就會重複排序 5 次，所以這裡只開放「金額」欄排序。Grid.js 沒有虛擬捲動：分頁時 DOM 只有 20 列，成本集中在資料轉換、排序與搜尋；「不分頁」時每一列都會放進 DOM，耗時隨列數直線上升。搜尋是對每個儲存格跑一次正規表示式，所以列數與欄數都會影響。",
      });
    },
  },
] });
</script>
</body>
</html>
