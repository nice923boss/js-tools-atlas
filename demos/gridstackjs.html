<style>
  /* shared */
  .gsd-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 8px) 8px calc(var(--sc-ctl-b, 0px) + 8px);
    display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .gsd-scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .gsd-clip { flex: 1; min-height: 0; overflow: hidden; }
  .gsd-log { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsd-log b { color: var(--fg); font-weight: 600; }
  .gsd-log code, .gsd-evt code { font: 500 11.5px/1 var(--mono); color: var(--c2); }
  .sc-scene .grid-stack-item-content { background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden !important; }
  .sc-scene .grid-stack-item.ui-draggable-dragging > .grid-stack-item-content,
  .sc-scene .grid-stack-item.ui-resizable-resizing > .grid-stack-item-content { border-color: var(--accent); box-shadow: 0 12px 28px rgba(0,0,0,.4); }
  .sc-scene .grid-stack > .grid-stack-placeholder > .placeholder-content { border: 2px dashed var(--accent); border-radius: 10px; background: rgba(247,223,30,.07); }
  .gsd-card { height: 100%; display: flex; flex-direction: column; padding: 7px 10px; min-height: 0; }

  .gsd-x { margin-left: auto; cursor: pointer; opacity: .5; border: 0; background: none; color: inherit; font-size: 13px; padding: 0 2px; }
  .gsd-x:hover { opacity: 1; color: var(--c3); }
  .gsd-num { font: 700 clamp(16px, 2.6vw, 26px)/1.2 var(--mono); margin-top: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsd-delta { font-size: 12px; color: var(--c4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsd-delta.down { color: var(--c3); }
  .gsd-time { font: 700 clamp(18px, 3vw, 30px)/1.1 var(--mono); margin-top: auto; color: var(--accent); }
  .gsd-bars { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 6%; padding-top: 6px; }
  .gsd-bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; font-size: 11px; color: var(--muted); }
  .gsd-bars i { display: block; width: 100%; border-radius: 5px 5px 2px 2px; background: linear-gradient(180deg, var(--c2), rgba(76,201,240,.2)); }
  .gsd-bars div:nth-child(5) i { background: linear-gradient(180deg, var(--accent), rgba(247,223,30,.2)); }
  .gsd-ring { flex: 1; min-height: 0; display: grid; place-items: center; }
  .gsd-ring svg { height: 100%; max-height: 120px; }
  .gsd-todo { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12.5px; overflow: hidden; }
  .gsd-todo li { display: flex; align-items: center; gap: 7px; padding: 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .gsd-todo li::before { content: ""; width: 11px; height: 11px; border-radius: 3px; border: 2px solid var(--c6); flex: none; }
  .gsd-todo li.ok { color: var(--muted); text-decoration: line-through; }
  .gsd-todo li.ok::before { background: var(--c6); }
  /* colored tiles used by most scenes */
  .gsd-tile { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 4px 9px; border-left: 4px solid var(--k, var(--c2));
    background: linear-gradient(90deg, color-mix(in srgb, var(--k, var(--c2)) 16%, transparent), transparent 80%); cursor: move; min-width: 0; }
  .sc-scene .grid-stack-item-content { container-type: size; user-select: none; }
  @container (max-height: 46px) { .gsd-tile small { display: none; } .gsd-tile { padding-block: 0; } }
  .gsd-tile b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsd-tile small { font: 500 11px/1.2 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gsd-pane { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 6px; background: color-mix(in srgb, var(--bg-2) 45%, transparent); }
  .gsd-pane > header { flex: none; display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; padding: 0 2px 5px; white-space: nowrap; overflow: hidden; }
  .gsd-pane > header code { font: 500 11.5px/1 var(--mono); color: var(--c2); }
  .gsd-pane > header small { margin-left: auto; color: var(--muted); font: 500 11.5px/1 var(--mono); }
  .gsd-two { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  @media (max-width: 520px) { .gsd-two { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); } }
  /* 3. responsive */
  .gsd-resp { position: relative; height: 100%; margin: 0 auto; border: 1px dashed color-mix(in srgb, var(--accent) 60%, transparent); border-radius: 10px; padding: 4px; transition: width .5s ease; }
  .gsd-badge { position: absolute; left: 50%; top: -1px; transform: translate(-50%, -50%); z-index: 5; padding: 2px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font: 700 12px/1.5 var(--mono); white-space: nowrap; }
  /* 4. nested */
  .gsd-nest .grid-stack-sub-grid > .grid-stack-item-content { display: flex; flex-direction: column; padding: 0 4px 4px; background: color-mix(in srgb, var(--bg-2) 70%, transparent); }
  .gsd-nest .grid-stack-sub-grid > .grid-stack-item-content > .gsd-h { padding: 6px 4px 4px; color: var(--fg); font-size: 12.5px; }
  .gsd-nest .grid-stack-nested .grid-stack-item-content { border-radius: 7px; }
  .gsd-count { font: 600 11px/1 var(--mono); color: var(--muted); }
  /* 5. drag between */
  .gsd-bar { flex: none; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .gsd-new { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px dashed var(--c2); color: var(--fg); font-size: 12.5px; cursor: grab; background: var(--bg-2); user-select: none; }
  .gsd-new.grid-stack-item { position: static; width: auto; height: 30px; }
  .gsd-trash { margin-left: auto; display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 8px; border: 1px dashed var(--c3); color: var(--c3); font-size: 12.5px; }
  .gsd-trash.ui-droppable-over { background: color-mix(in srgb, var(--c3) 20%, transparent); }
  .gsd-evt { flex: none; height: 58px; overflow: hidden; font-size: 12px; color: var(--muted); display: flex; flex-direction: column-reverse; justify-content: flex-end; }
  .gsd-evt div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 19px; }
  .gsd-evt div:first-child { color: var(--fg); }
  /* 6. save / load */
  .gsd-json { margin: 0; flex: 1; min-height: 0; overflow: auto; font: 500 11px/1.45 var(--mono); color: var(--muted); white-space: pre; scrollbar-width: thin; }
  .gsd-json b { color: var(--c4); font-weight: 600; }
  .gsd-sl { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 8px; }
  @media (max-width: 520px) { .gsd-sl { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.3fr) minmax(0, 1fr); } }
  /* 7. locks + events */
  .gsd-ev { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 8px; }
  .gsd-ev .gsd-evt { height: auto; flex: 1; }
  @media (max-width: 620px) { .gsd-ev { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr); } }
  /* 8. stress */
  .gsd-stress { position: absolute; inset: 8px 8px 8px 350px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; }
  .gsd-stress .grid-stack-item-content { border-radius: 2px; border: 0; background: color-mix(in srgb, var(--k) 55%, transparent); }
  @media (max-width: 760px) { .gsd-stress { inset: 8px; opacity: .85; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/gridstack@14.0.0/dist/gridstack-all.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// GridStack.js showcase: eight scenes from the original course dashboard to a widget-count stress benchmark.
const { fmt, fmtMs } = Showcase;
const K = (i) => `var(--c${(i % 6) + 1})`;
// Default renderCB writes textContent; our widget content is trusted local HTML.
GridStack.renderCB = (el, w) => { if (w.content != null) el.innerHTML = w.content; };

function makeGrid(ctx, el, opts, items) {
  const g = GridStack.init({ margin: 4, animate: true, ...opts }, el);
  ctx.onCleanup(() => g.destroy(false));
  if (items) g.load(items);
  return g;
}
// Fit `rows` rows into the box height (min cell height keeps text readable; the box scrolls if needed).
function fitRows(ctx, g, box, rows, min = 30) {
  const go = () => { const h = box.clientHeight; if (h > 0) g.cellHeight(Math.max(min, Math.floor(h / rows))); };
  go();
  ctx.onResize(go);
}
const tile = (label, i, sub = "") => `<div class="gsd-tile" style="--k:${K(i)}"><b>${label}</b>${sub ? `<small>${sub}</small>` : ""}</div>`;
const card = (title, body, x = true) => `<div class="gsd-card"><div class="gsd-h">${title}${x ? `<button class="gsd-x" type="button" title="移除">✕</button>` : ""}</div>${body}</div>`;
const pos = (n) => `x${n.x} y${n.y} ${n.w}×${n.h}`;
const now = () => new Date().toLocaleTimeString("zh-TW", { hour12: false }) + "." + String(Date.now() % 1000).padStart(3, "0");
function eventLog(box, max = 40) {
  return (html) => {
    const row = document.createElement("div");
    row.innerHTML = `<code>${now().slice(3)}</code> ${html}`;
    box.prepend(row);
    while (box.children.length > max) box.lastChild.remove();
  };
}
const rnd = (n) => Math.floor(Math.random() * n);

// ---------- 1. dashboard data ----------
const MONTHS = [["5月", 62], ["6月", 78], ["7月", 95], ["8月", 71], ["9月", 118], ["10月", 88]];
const NAMES = { rev: "本月營收", new: "新學員", refund: "退費率", clock: "台北時間", chart: "報名人數", ring: "完課率", todo: "今日待辦" };
const DASH = [
  { id: "rev", x: 0, y: 0, w: 3, h: 2, content: card("💰 本月營收", `<div class="gsd-num">NT$ 486K</div><div class="gsd-delta">▲ 12.4% 較上月</div>`) },
  { id: "new", x: 3, y: 0, w: 3, h: 2, content: card("🎓 新學員", `<div class="gsd-num">238 人</div><div class="gsd-delta">▲ 31 人</div>`) },
  { id: "refund", x: 6, y: 0, w: 3, h: 2, content: card("↩️ 退費率", `<div class="gsd-num">1.8%</div><div class="gsd-delta down">▼ 0.6 個百分點</div>`) },
  { id: "clock", x: 9, y: 0, w: 3, h: 2, content: card("🕒 台北時間", `<div class="gsd-time">--:--:--</div><div class="gsd-delta gsd-date" style="color:var(--muted)"></div>`) },
  { id: "chart", x: 0, y: 2, w: 6, h: 4, content: card("📊 各月報名人數（示意資料）", `<div class="gsd-bars">${MONTHS.map(([m, v]) => `<div><span>${v}</span><i style="height:${(v / 130) * 100}%"></i>${m}</div>`).join("")}</div>`) },
  { id: "ring", x: 6, y: 2, w: 3, h: 4, content: card("🎯 平均完課率", `<div class="gsd-ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="rgba(127,127,127,.18)" stroke-width="14"/><circle cx="60" cy="60" r="48" fill="none" stroke="var(--c4)" stroke-width="14" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="69" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" fill="currentColor" font-size="20" font-weight="700">77%</text></svg></div>`) },
  { id: "todo", x: 9, y: 2, w: 3, h: 4, content: card("✅ 今日待辦", `<ul class="gsd-todo"><li class="ok">回覆學員來信</li><li>上傳第 4 堂講義</li><li>確認台中場教室</li><li>發送結業問卷</li></ul>`) },
];
const EXTRA = [
  ["🔥 熱門課程", `<div class="gsd-num">AI 簡報術</div><div class="gsd-delta">本週 64 人報名</div>`],
  ["⭐ 滿意度", `<div class="gsd-num">4.8 / 5</div><div class="gsd-delta">▲ 0.2</div>`],
  ["📍 開課城市", `<div class="gsd-num">6 個</div><div class="gsd-delta">台北、新竹、台中、台南、高雄、花蓮</div>`],
];

Showcase.run({ scenes: [
  {
    id: "dashboard", title: "課程儀表板",
    api: "GridStack.init({ handle, resizable, columnOpts }) + update()",
    desc: "原版的課程營運儀表板：拖曳標題列移動、拉右下角與邊緣調整大小，其他小工具會自動讓位。寬度低於 820px 自動切 6 欄、低於 560px 切 1 欄。「自動示範」每 1.4 秒用 update() 隨機搬動或縮放一個小工具，效果和手動拖曳相同。",
    hint: "拖曳標題列移動・拉右下角改大小・試試自動示範",
    mount(ctx) {
      ctx.html(`<div class="gsd-wrap"><div class="gsd-scroll"><div class="grid-stack"></div></div><div class="gsd-log">拖曳標題列移動，拉右下角調整大小</div></div>`);
      const box = ctx.$(".gsd-scroll"), logEl = ctx.$(".gsd-log");
      const log = (t) => (logEl.innerHTML = t);
      const g = makeGrid(ctx, ctx.$(".grid-stack"), {
        margin: 5, float: false, handle: ".gsd-h", resizable: { handles: "se,e,s" },
        columnOpts: { breakpoints: [{ w: 560, c: 1 }, { w: 820, c: 6 }] },
      }, DASH);
      const fit = () => g.cellHeight(Math.max(40, Math.floor(box.clientHeight / (g.getColumn() === 1 ? 9 : 6))));
      fit();
      ctx.onResize(fit);
      const name = (n) => NAMES[n.id] || n.id || "小工具";
      g.on("dragstop", (e, el) => log(`<code>dragstop</code> 已移動「<b>${name(el.gridstackNode)}</b>」到第 ${el.gridstackNode.x + 1} 欄、第 ${el.gridstackNode.y + 1} 列`));
      g.on("resizestop", (e, el) => log(`<code>resizestop</code>「<b>${name(el.gridstackNode)}</b>」調整為 ${el.gridstackNode.w} × ${el.gridstackNode.h} 格`));
      g.on("removed", (e, items) => log(`<code>removed</code> 移除「<b>${name(items[0])}</b>」，下方小工具往上補位`));
      // Remove buttons live inside the drag handle; stop the press before it reaches the handle.
      ctx.on(g.el, "mousedown", (e) => { if (e.target.closest(".gsd-x")) e.stopPropagation(); }, true);
      ctx.on(g.el, "click", (e) => { const x = e.target.closest(".gsd-x"); if (x) g.removeWidget(x.closest(".grid-stack-item")); });
      const tick = () => {
        const d = new Date();
        const t = g.el.querySelector(".gsd-time"), dd = g.el.querySelector(".gsd-date");
        if (t) t.textContent = d.toLocaleTimeString("zh-TW", { hour12: false, timeZone: "Asia/Taipei" });
        if (dd) dd.textContent = d.toLocaleDateString("zh-TW", { month: "long", day: "numeric", weekday: "long", timeZone: "Asia/Taipei" });
      };
      tick();
      ctx.interval(tick, 1000);

      let extra = 0, auto = 0, step = 0;
      ctx.button("＋ 小工具", () => {
        const [title, body] = EXTRA[extra % EXTRA.length];
        const el = g.addWidget({ id: `x${extra++}`, w: 3, h: 2, content: card(title, body) });
        NAMES[el.gridstackNode.id] = title.slice(2).trim();
        log(`<code>addWidget()</code> 新增「<b>${title.slice(2).trim()}</b>」，自動找空位放在 x${el.gridstackNode.x} y${el.gridstackNode.y}`);
        el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }, { primary: true });
      ctx.toggle("自由擺放", false, (v) => { g.float(v); log(v ? "<code>float(true)</code> 小工具不會自動往上靠" : "<code>float(false)</code> 小工具會往上補空位"); });
      ctx.button("整理", () => { g.compact(); log("<code>compact()</code> 已整理版面，空隙全部補齊"); });
      ctx.toggle("自動示範", false, (v) => {
        clearInterval(auto);
        if (!v) return log("自動示範已停止");
        const run = () => {
          const items = g.getGridItems();
          if (!items.length) return;
          const el = items[rnd(items.length)], n = el.gridstackNode, col = g.getColumn();
          if (step++ % 3 === 2 && col > 1) {
            const w = Math.max(2, Math.min(col, n.w + (Math.random() < 0.5 ? -1 : 1)));
            g.update(el, { w });
            log(`自動示範：<code>update(el, { w: ${w} })</code>「<b>${name(n)}</b>」改為 ${w} 格寬`);
          } else {
            const x = col === 1 ? 0 : rnd(col - n.w + 1), y = rnd(5);
            g.update(el, { x, y });
            log(`自動示範：<code>update(el, { x: ${x}, y: ${y} })</code> 搬動「<b>${name(n)}</b>」，其他小工具讓位`);
          }
        };
        run();
        auto = setInterval(run, 1400);
      });
      ctx.onCleanup(() => clearInterval(auto));
    },
  },
  {
    id: "float", title: "浮動與靠攏",
    api: "float: true | false・compact('compact' | 'list')",
    desc: "同一組小工具、同一個初始座標載入兩個網格。左邊 float: true 保留原本的空位；右邊是預設的 float: false，所有小工具會像受重力一樣往上靠攏。「隨機挪動」對兩邊套用同一個 update()，可以看到右邊永遠補滿空隙。",
    hint: "按「隨機挪動」比較兩邊的差異；compact() 只整理左邊",
    mount(ctx) {
      const ITEMS = [
        { id: "a", x: 0, y: 0, w: 2, h: 2 }, { id: "b", x: 3, y: 1, w: 3, h: 1 }, { id: "c", x: 1, y: 3, w: 2, h: 2 },
        { id: "d", x: 4, y: 4, w: 2, h: 1 }, { id: "e", x: 0, y: 6, w: 3, h: 1 }, { id: "f", x: 5, y: 2, w: 1, h: 2 },
      ];
      const LABEL = { a: "報名表", b: "公告", c: "講義", d: "問卷", e: "收據", f: "點名" };
      const items = () => ITEMS.map((it, i) => ({ ...it, content: tile(LABEL[it.id], i, `${it.w}×${it.h}`) }));
      ctx.html(`<div class="gsd-wrap"><div class="gsd-two">
        <section class="gsd-pane"><header><code>float: true</code>自由擺放<small class="r0"></small></header><div class="gsd-clip"><div class="grid-stack g0"></div></div></section>
        <section class="gsd-pane"><header><code>float: false</code>往上靠攏（預設）<small class="r1"></small></header><div class="gsd-clip"><div class="grid-stack g1"></div></div></section>
      </div><div class="gsd-log">兩邊載入完全相同的座標，右邊一載入就把空隙補掉了</div></div>`);
      const ROWS = 7;
      const grids = [0, 1].map((k) => {
        const g = makeGrid(ctx, ctx.$(`.g${k}`), { column: 6, float: k === 0, maxRow: ROWS, margin: 3 }, items());
        fitRows(ctx, g, ctx.$(`.g${k}`).parentElement, ROWS, 16);
        return g;
      });
      const stat = () => grids.forEach((g, k) => {
        const holes = ROWS * 6 - g.engine.nodes.reduce((s, n) => s + n.w * n.h, 0);
        ctx.$(`.r${k}`).textContent = `使用 ${g.getRow()} 列・空格 ${holes - (ROWS - g.getRow()) * 6}`;
      });
      grids.forEach((g) => g.on("change", stat));
      stat();
      const log = (t) => (ctx.$(".gsd-log").innerHTML = t);
      const move = () => {
        const it = ITEMS[rnd(ITEMS.length)];
        const n = grids[0].engine.nodes.find((x) => x.id === it.id);
        const x = rnd(6 - n.w + 1), y = rnd(ROWS - n.h + 1);
        grids.forEach((g) => g.update(g.engine.nodes.find((m) => m.id === it.id).el, { x, y }));
        log(`兩邊同時 <code>update(「${LABEL[it.id]}」, { x: ${x}, y: ${y} })</code>，右邊會再往上靠到第一個空位`);
      };
      let auto = 0;
      ctx.toggle("隨機挪動", true, (v) => { clearInterval(auto); if (v) { move(); auto = setInterval(move, 1600); } });
      auto = setInterval(move, 1600);
      ctx.onCleanup(() => clearInterval(auto));
      ctx.button("左邊 compact()", () => { grids[0].compact(); log("<code>compact()</code> 預設模式：保持順序並往上補位"); });
      ctx.button("compact('list')", () => { grids[0].compact("list"); log("<code>compact('list')</code> 依序像文字一樣排成列，不再保留欄位"); });
      ctx.button("重設", () => { grids.forEach((g) => g.load(items())); stat(); log("兩邊重新 <code>load()</code> 同一組座標"); });
    },
  },
  {
    id: "responsive", title: "響應式欄數",
    api: "columnOpts: { breakpoints, layout }・column(n, layout)",
    desc: "虛線框是網格容器。GridStack 用 ResizeObserver 監看容器本身的寬度（不是視窗），依 breakpoints 切換 1、3、6、12 欄，切換時依 layout 重新排版。每種欄數的版面會被快取，從 1 欄放大回 12 欄時能還原原本的位置。",
    hint: "拖「容器寬度」或開「自動掃描」；換不同 layout 比較重排方式",
    mount(ctx) {
      const SIZES = [[6, 2], [3, 1], [3, 1], [3, 1], [3, 1], [4, 1], [4, 1], [4, 1], [8, 1], [4, 1]];
      const NAMES2 = ["主視覺", "報名", "營收", "出席", "評價", "講師", "教室", "教材", "課表", "公告"];
      const items = SIZES.map(([w, h], i) => ({ id: `r${i}`, w, h, content: tile(NAMES2[i], i, `原始 ${w}×${h}`) }));
      ctx.html(`<div class="gsd-wrap"><div class="gsd-clip" style="padding-top:12px"><div class="gsd-resp"><span class="gsd-badge"></span><div class="gsd-scroll" style="height:100%"><div class="grid-stack"></div></div></div></div><div class="gsd-log"></div></div>`);
      const resp = ctx.$(".gsd-resp"), badge = ctx.$(".gsd-badge");
      const opts = { breakpoints: [{ w: 420, c: 1 }, { w: 620, c: 3 }, { w: 820, c: 6 }], columnMax: 12, layout: "moveScale" };
      const g = makeGrid(ctx, ctx.$(".grid-stack"), { margin: 3, cellHeight: 44, columnOpts: opts }, items);
      const show = () => {
        badge.textContent = `${Math.round(g.el.clientWidth)}px → ${g.getColumn()} 欄`;
        ctx.$(".gsd-log").innerHTML = `斷點（容器寬）：≤420 → 1 欄・≤620 → 3 欄・≤820 → 6 欄・更寬 → 12 欄；目前 layout：<code>${opts.layout}</code>`;
      };
      const ro = new ResizeObserver(() => requestAnimationFrame(show));
      ro.observe(g.el);
      ctx.onCleanup(() => ro.disconnect());
      g.on("change", show);
      let pct = 100;
      const slider = ctx.slider("容器寬度", { min: 25, max: 100, value: pct, format: (v) => `${v}%` }, (v) => { pct = v; resp.style.width = `${v}%`; });
      resp.style.width = "100%";
      ctx.select("layout", ["moveScale", "move", "scale", "list", "compact", "none"], "moveScale", (v) => { opts.layout = v; show(); });
      const SWEEP = [100, 78, 56, 36, 56, 78];
      let si = 0, auto = 0;
      ctx.toggle("自動掃描", true, (v) => { clearInterval(auto); if (v) auto = setInterval(sweep, 1700); });
      function sweep() { si = (si + 1) % SWEEP.length; pct = SWEEP[si]; slider.value = pct; slider.dispatchEvent(new Event("input")); }
      auto = setInterval(sweep, 1700);
      ctx.onCleanup(() => clearInterval(auto));
      show();
    },
  },
  {
    id: "nested", title: "巢狀子網格",
    api: "subGridOpts: { column: 'auto', acceptWidgets }・makeSubGrid()",
    desc: "外層網格的三個小工具本身又是網格（subGridOpts），裡面的課程卡可以在三個教室之間拖來拖去。column: 'auto' 讓子網格欄數永遠等於它在外層佔的寬度，拉寬外層小工具時卡片會跟著重排；拖曳外層標題列則整組一起移動。",
    hint: "把課程卡拖到另一間教室・拖標題列移動整組・拉右下角改寬度",
    mount(ctx) {
      const CARDS = {
        p1: ["Python 入門", "週一 19:00"], p2: ["Excel 自動化", "週二 19:00"], p3: ["AI 簡報術", "週三 14:00"],
        p4: ["影音剪輯", "週四 19:00"], p5: ["UI 設計基礎", "週六 10:00"], t1: ["資料視覺化", "週五 19:00"], c1: ["手機攝影", "週日 14:00"],
      };
      const cardW = (id, i) => ({ id, w: 4, h: 1, content: tile(CARDS[id][0], i, CARDS[id][1]) });
      const SUB = { column: "auto", cellHeight: 44, margin: 3, acceptWidgets: true, handle: ".grid-stack-item-content", minRow: 2, float: false };
      const room = (id, x, title, ids) => ({
        id, x, y: 0, w: 4, h: 6, content: `<div class="gsd-h">${title} <span class="gsd-count"></span></div>`,
        subGridOpts: { ...SUB, children: ids.map((c) => cardW(c, Object.keys(CARDS).indexOf(c))) },
      });
      const LAYOUT = () => [room("pool", 0, "📋 待排課程", ["p1", "p2", "p3", "p4", "p5"]), room("tpe", 4, "🏙 台北教室", ["t1"]), room("txg", 8, "🌳 台中教室", ["c1"])];
      ctx.html(`<div class="gsd-wrap gsd-nest"><div class="gsd-scroll"><div class="grid-stack"></div></div><div class="gsd-log">每間教室都是獨立的 GridStack 實例，卡片拖到哪裡就屬於哪個網格</div></div>`);
      const box = ctx.$(".gsd-scroll");
      const g = makeGrid(ctx, ctx.$(".grid-stack"), { handle: ".gsd-h", margin: 4, columnOpts: { breakpoints: [{ w: 560, c: 1 }] } });
      const log = (t) => (ctx.$(".gsd-log").innerHTML = t);
      const subs = () => Object.fromEntries(g.engine.nodes.map((n) => [n.id, n.subGrid]));
      const count = () => g.engine.nodes.forEach((n) => { const c = n.el.querySelector(".gsd-count"); if (c && n.subGrid) c.textContent = `${n.subGrid.engine.nodes.length} 堂`; });
      // Sub-grid added/removed events bubble up to the outermost grid, so listen there once.
      const roomName = (sg) => g.engine.nodes.find((n) => n.subGrid === sg)?.el.querySelector(".gsd-h").firstChild.textContent.trim();
      g.on("added", (e, items) => {
        count();
        const it = items.find((n) => n.grid?.parentGridNode);
        if (it) log(`<code>added</code>「<b>${CARDS[it.id]?.[0] || "課程"}</b>」移入 <b>${roomName(it.grid)}</b>`);
      });
      g.on("removed", count);
      const reset = () => { g.removeAll(); g.load(LAYOUT()); count(); };
      reset();
      const fit = () => g.cellHeight(Math.max(36, Math.floor(box.clientHeight / 6)));
      fit();
      ctx.onResize(fit);
      let turn = 0;
      ctx.button("排一堂（API）", () => {
        const s = subs(), from = s.pool, to = turn++ % 2 ? s.txg : s.tpe;
        const el = from?.getGridItems()[0];
        if (!el) return log("待排課程已經排完，按「重設」再來一次");
        const id = el.gridstackNode.id;
        from.removeWidget(el);
        to.addWidget(cardW(id, Object.keys(CARDS).indexOf(id)));
      }, { primary: true });
      ctx.button("台北教室加寬", () => {
        const n = g.engine.nodes.find((x) => x.id === "tpe");
        if (g.getColumn() === 1) return log("1 欄模式下無法加寬，請放寬視窗");
        g.update(n.el, { w: n.w === 4 ? 8 : 4 });
        log(`<code>update(台北, { w: ${n.w} })</code> 子網格 column: 'auto' 跟著變成 ${n.w} 欄`);
      });
      ctx.button("重設", () => { reset(); log("已重新 <code>load()</code> 三個子網格"); });
    },
  },
  {
    id: "dragin", title: "跨網格拖放",
    api: "acceptWidgets・GridStack.setupDragIn()・removable",
    desc: "兩個網格都設 acceptWidgets: true，小工具可以互相拖過去；上方工具列用 GridStack.setupDragIn() 註冊成外部拖入來源，放下時依指定的 GridStackWidget 建立新小工具；拖到紅色垃圾桶（removable）就刪除。下方即時列出 added、removed、dropped 事件。",
    hint: "把工具列的項目拖進網格・把小工具拖到另一邊或垃圾桶",
    mount(ctx) {
      const KINDS = [["🎤 講座", 2, 1], ["🛠 工作坊", 3, 1], ["📚 讀書會", 2, 2]];
      ctx.html(`<div class="gsd-wrap">
        <div class="gsd-bar">${KINDS.map(([t], i) => `<span class="gsd-new grid-stack-item" data-i="${i}">${t}</span>`).join("")}<span class="gsd-trash">🗑 拖到這裡刪除</span></div>
        <div class="gsd-two">
          <section class="gsd-pane"><header>本週活動<small class="c0"></small></header><div class="gsd-clip"><div class="grid-stack g0"></div></div></section>
          <section class="gsd-pane"><header>下週活動<small class="c1"></small></header><div class="gsd-clip"><div class="grid-stack g1"></div></div></section>
        </div><div class="gsd-evt"></div></div>`);
      const log = eventLog(ctx.$(".gsd-evt"), 6);
      let seq = 0;
      const w = (t, i, ww, hh) => ({ id: `d${seq++}`, w: ww, h: hh, content: tile(t, i, `${ww}×${hh}`) });
      const START = [
        [w("週二 AI 講座", 1, 2, 1), w("週四 木工坊", 3, 3, 1), w("週六 讀書會", 5, 2, 2)],
        [w("週一 簡報課", 0, 3, 1), w("週三 攝影走讀", 4, 2, 1)],
      ];
      const ROWS = 5;
      const opt = { column: 6, acceptWidgets: true, removable: ".gsd-trash", maxRow: ROWS, margin: 3 };
      const grids = [0, 1].map((k) => {
        const g = makeGrid(ctx, ctx.$(`.g${k}`), opt, START[k]);
        fitRows(ctx, g, ctx.$(`.g${k}`).parentElement, ROWS, 18);
        const label = k ? "下週" : "本週";
        g.on("added", (e, items) => log(`<code>added</code> ${label}：${items.map(pos).join("、")}`));
        g.on("removed", (e, items) => log(`<code>removed</code> ${label}：${items.length} 個`));
        g.on("dropped", (e, prev, next) => log(`<code>dropped</code> ${prev?.grid && prev.grid !== g ? "從另一個網格" : prev?.grid ? "同網格" : "從工具列"}放入${label} ${pos(next)}`));
        g.on("added removed change", () => (ctx.$(`.c${k}`).textContent = `${g.engine.nodes.length} 項`));
        ctx.$(`.c${k}`).textContent = `${g.engine.nodes.length} 項`;
        return g;
      });
      const chips = ctx.$$(".gsd-new");
      GridStack.setupDragIn(chips, { appendTo: "body", helper: "clone" },
        KINDS.map(([t, ww, hh], i) => ({ w: ww, h: hh, content: tile(t.slice(2).trim(), i + 2, `新增 ${ww}×${hh}`) })));
      ctx.button("示範搬移（API）", () => {
        const [a, b] = grids[0].engine.nodes.length ? grids : [grids[1], grids[0]];
        const n = a.engine.nodes[0];
        const html = n.el.querySelector(".grid-stack-item-content").innerHTML;
        a.removeWidget(n.el);
        b.addWidget({ id: n.id, w: n.w, h: n.h, content: html });
      });
    },
  },
  {
    id: "save", title: "存檔與還原",
    api: "save(saveContent) → JSON・load(items, addRemove)",
    desc: "右邊是 save(false) 輸出的 JSON（不含內容，只有 id 與座標），每次 change 事件即時更新。切換版型時 load() 會依 id 比對：已存在的小工具用動畫搬到新位置，不會整個重建；「存檔」記下快照、「還原」把快照載回來。",
    hint: "切換版型或打亂，再按「還原」回到存檔時的樣子",
    mount(ctx) {
      const IDS = ["報名", "營收", "出席", "滿意", "講師", "教室", "公告", "待辦"];
      const content = (id) => tile(id, IDS.indexOf(id), `id: ${id}`);
      const PRESETS = [
        IDS.map((id, i) => ({ id, x: (i % 4) * 2, y: Math.floor(i / 4) * 2, w: 2, h: 2 })),
        IDS.map((id, i) => (i === 0 ? { id, x: 0, y: 0, w: 8, h: 2 } : { id, x: ((i - 1) % 4) * 2, y: 2 + Math.floor((i - 1) / 4), w: 2, h: 1 })),
        IDS.map((id, i) => ({ id, x: (i % 2) * 4, y: Math.floor(i / 2), w: 4, h: 1 })),
      ];
      const withContent = (list) => list.map((n) => ({ ...n, content: content(n.id) }));
      ctx.html(`<div class="gsd-wrap"><div class="gsd-sl">
        <section class="gsd-pane"><header>網格<small class="sz"></small></header><div class="gsd-clip"><div class="grid-stack"></div></div></section>
        <section class="gsd-pane"><header><code>grid.save(false)</code><small class="by"></small></header><pre class="gsd-json"></pre></section>
      </div><div class="gsd-log">尚未存檔</div></div>`);
      const g = makeGrid(ctx, ctx.$(".grid-stack"), { column: 8, margin: 3, float: true }, withContent(PRESETS[0]));
      fitRows(ctx, g, ctx.$(".gsd-clip"), 4, 26);
      const show = () => {
        const data = g.save(false);
        const json = JSON.stringify(data);
        ctx.$(".gsd-json").innerHTML = data.map((n) => JSON.stringify(n).replace(/"id":"([^"]+)"/, `"id":"<b>$1</b>"`)).join(",\n");
        ctx.$(".by").textContent = `${data.length} 項・${fmt(new Blob([json]).size)} bytes`;
      };
      g.on("change", show);
      show();
      let snap = null;
      const log = (t) => (ctx.$(".gsd-log").innerHTML = t);
      ctx.group(["版型 A", "B", "C"], 0, (i) => { const t = performance.now(); g.load(withContent(PRESETS[i])); show(); log(`<code>load(版型 ${"ABC"[i]})</code> 依 id 更新 8 個小工具，耗時 ${fmtMs(performance.now() - t)}`); });
      ctx.button("打亂", () => {
        const list = g.save(false).map((n) => ({ ...n, x: rnd(8 - n.w + 1), y: rnd(4) }));
        g.load(list);
        show();
        log("隨機座標 <code>load()</code>，float: true 會保留空位");
      });
      ctx.button("存檔", () => { snap = g.save(false); log(`<code>save(false)</code> 已存檔：${snap.length} 項・${fmt(JSON.stringify(snap).length)} 字元`); }, { primary: true });
      ctx.button("還原", () => {
        if (!snap) return log("還沒有存檔，先按「存檔」");
        g.load(snap);
        show();
        log("<code>load(snapshot)</code> 已還原到存檔時的版面");
      });
    },
  },
  {
    id: "locks", title: "鎖定與事件",
    api: "locked・noMove・noResize・minW/maxW・setStatic()・on(events)",
    desc: "locked 的小工具不會被其他小工具推開，但自己仍可拖；noMove 不能拖、noResize 不能縮放、minW/maxW 限制縮放範圍。上方切換整個網格的靜態模式與移動、縮放開關。右邊即時列出所有事件（drag 與 resize 過程事件只計數，避免洗版）。",
    hint: "把一般小工具推向 🔒 試試・按「推擠示範」",
    mount(ctx) {
      const ITEMS = [
        { id: "lock", x: 3, y: 1, w: 2, h: 2, locked: true, content: tile("🔒 locked", 2, "不會被推開") },
        { id: "nomove", x: 0, y: 0, w: 2, h: 1, noMove: true, content: tile("📌 noMove", 0, "不能拖曳") },
        { id: "nores", x: 6, y: 0, w: 2, h: 1, noResize: true, content: tile("📐 noResize", 1, "不能縮放") },
        { id: "mm", x: 0, y: 2, w: 2, h: 1, minW: 2, maxW: 4, maxH: 2, content: tile("↔ minW 2・maxW 4", 3, "縮放受限") },
        { id: "n1", x: 0, y: 1, w: 3, h: 1, content: tile("一般 A", 4, "可拖可縮") },
        { id: "n2", x: 5, y: 2, w: 3, h: 1, content: tile("一般 B", 5, "可拖可縮") },
      ];
      ctx.html(`<div class="gsd-wrap"><div class="gsd-ev">
        <section class="gsd-pane"><header>網格<small class="mode">可編輯</small></header><div class="gsd-clip"><div class="grid-stack"></div></div></section>
        <section class="gsd-pane"><header>事件紀錄<small class="cnt"></small></header><div class="gsd-evt"></div></section>
      </div></div>`);
      const g = makeGrid(ctx, ctx.$(".grid-stack"), { column: 8, margin: 3, float: false }, ITEMS);
      fitRows(ctx, g, ctx.$(".gsd-clip"), 5, 30);
      const log = eventLog(ctx.$(".gsd-evt"));
      const counts = { drag: 0, resize: 0 };
      const name = (el) => el?.gridstackNode?.id || "?";
      g.on("dragstart", (e, el) => { counts.drag = 0; log(`<code>dragstart</code> ${name(el)}`); });
      g.on("drag", () => { counts.drag++; ctx.$(".cnt").textContent = `drag ×${counts.drag}`; });
      g.on("dragstop", (e, el) => log(`<code>dragstop</code> ${name(el)} → ${pos(el.gridstackNode)}（drag ×${counts.drag}）`));
      g.on("resizestart", (e, el) => { counts.resize = 0; log(`<code>resizestart</code> ${name(el)}`); });
      g.on("resize", () => { counts.resize++; ctx.$(".cnt").textContent = `resize ×${counts.resize}`; });
      g.on("resizestop", (e, el) => log(`<code>resizestop</code> ${name(el)} → ${el.gridstackNode.w}×${el.gridstackNode.h}（resize ×${counts.resize}）`));
      g.on("change", (e, items) => log(`<code>change</code> ${items.map((n) => `${n.id} ${pos(n)}`).join("、")}`));
      g.on("enable disable", (e) => log(`<code>${e.type}</code> 網格互動${e.type === "enable" ? "開啟" : "關閉"}`));
      const mode = () => (ctx.$(".mode").textContent = g.opts.staticGrid ? "靜態（staticGrid）" : "可編輯");
      ctx.toggle("靜態模式", false, (v) => { g.setStatic(v); mode(); log(`<code>setStatic(${v})</code>`); });
      ctx.toggle("可移動", true, (v) => { g.enableMove(v); log(`<code>enableMove(${v})</code>`); });
      ctx.toggle("可縮放", true, (v) => { g.enableResize(v); log(`<code>enableResize(${v})</code>`); });
      let flip = 0;
      ctx.button("推擠示範", () => {
        const el = g.engine.nodes.find((n) => n.id === "n2").el;
        const target = flip++ % 2 ? { x: 5, y: 2 } : { x: 3, y: 1 };
        log(`<code>update(n2, ${JSON.stringify(target)})</code>${target.x === 3 ? " 撞上 locked，改找其他位置" : " 移回原位"}`);
        g.update(el, target);
      }, { primary: true });
      log("網格就緒，試著拖曳或縮放");
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "batchUpdate() + load(items)・compact()",
    desc: "每一級先 removeAll()，再以 batchUpdate() 包住 load() 一次載入 N 個隨機大小、會互相重疊的小工具（24 欄），由引擎解決碰撞並建立 DOM 與拖放處理；接著量測 compact() 重新排列全部小工具的時間。總時間是 load + compact。",
    hint: "按「開始測試」；右邊會實際畫出每一級的小工具",
    mount(ctx) {
      ctx.html(`<div class="gsd-stress"><div class="grid-stack"></div></div>`);
      const g = makeGrid(ctx, ctx.$(".grid-stack"), { column: 24, cellHeight: 12, margin: 1, animate: false, float: true });
      const make = (n) => Array.from({ length: n }, (_, i) => {
        const w = 1 + rnd(3), h = 1 + rnd(2);
        return { x: rnd(24 - w + 1), y: rnd(Math.max(4, Math.ceil(n / 12))), w, h };
      });
      // Color each tile through a CSS variable on its content element.
      const paint = () => g.getGridItems().forEach((el, i) => el.firstElementChild.style.setProperty("--k", K(i)));
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "小工具", unit: "個",
        sizes: [50, 100, 200, 400, 800, 1600, 3200, 6400],
        prepare: (n) => make(n),
        async run(n, items) {
          g.removeAll();
          g.batchUpdate();
          const t0 = performance.now();
          g.load(items);
          g.batchUpdate(false);
          const t1 = performance.now();
          g.compact();
          const t2 = performance.now();
          paint();
          await ctx.frame(1);
          return `load ${fmtMs(t1 - t0)}・compact ${fmtMs(t2 - t1)}・${g.getRow()} 列`;
        },
        target: 1000, budget: 2000,
        note: "load() 的成本主要在引擎逐一檢查碰撞（越多重疊越慢）與建立 DOM、綁定拖放事件；batchUpdate() 讓中間不重算容器高度也不觸發 change。compact() 會依序重新放置每個小工具，數量大時同樣接近平方成長。",
      });
      g.load(make(200));
      g.compact();
      paint();
    },
  },
] });
</script>
