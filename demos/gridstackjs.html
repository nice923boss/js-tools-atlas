<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridStack.js 示範：可拖曳調整的儀表板</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@14.0.0/dist/gridstack.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .top { position: fixed; left: 14px; top: 12px; right: 280px; z-index: 40; display: flex; flex-direction: column; }
  .top h1 { margin: 0; font-size: 16px; }
  .top .log { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scroller { position: fixed; inset: 58px 6px 40px; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .grid-stack-item-content {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; padding: 10px 12px; overflow: hidden !important;
  }
  .grid-stack-item.ui-draggable-dragging .grid-stack-item-content,
  .grid-stack-item.ui-resizable-resizing .grid-stack-item-content { border-color: var(--accent); box-shadow: 0 14px 30px rgba(0,0,0,.45); }
  .grid-stack > .grid-stack-placeholder > .placeholder-content { border: 2px dashed rgba(247,223,30,.6); border-radius: 12px; background: rgba(247,223,30,.06); }
  .w-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); cursor: move; }
  .w-head .x { margin-left: auto; cursor: pointer; opacity: .5; border: 0; background: none; color: inherit; font-size: 14px; padding: 0 2px; }
  .w-head .x:hover { opacity: 1; color: var(--c3); }
  .kpi .num { font: 700 clamp(18px, 3.2vw, 28px)/1.2 var(--mono); margin-top: auto; }
  .kpi .delta { font-size: 12px; color: var(--c4); }
  .kpi .delta.down { color: var(--c3); }
  .bars { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 6%; padding-top: 8px; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; font-size: 11px; color: var(--muted); }
  .bars i { display: block; width: 100%; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--c2), rgba(76,201,240,.25)); }
  .bars div:nth-child(5) i { background: linear-gradient(180deg, var(--accent), rgba(247,223,30,.25)); }
  .todo { list-style: none; margin: 8px 0 0; padding: 0; font-size: 13px; overflow: auto; }
  .todo li { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .todo li::before { content: ""; width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--c6); flex: none; }
  .todo li.ok { color: var(--muted); text-decoration: line-through; }
  .todo li.ok::before { background: var(--c6); }
  .clock .time { font: 700 clamp(20px, 4vw, 34px)/1.1 var(--mono); margin-top: auto; color: var(--accent); }
  .ring { flex: 1; min-height: 0; display: grid; place-items: center; }
  .ring svg { height: 100%; max-height: 120px; }
  @media (max-width: 600px) { .top { right: 14px; top: 52px; } .top h1 { display: none; } .scroller { top: 80px; } }
</style>
</head>
<body>
<div class="top">
  <h1>課程營運儀表板</h1>
  <div class="log" id="log">拖曳標題列移動，拉右下角調整大小</div>
</div>
<div class="controls">
  <button class="btn primary" id="add">＋ 小工具</button>
  <button class="btn" id="float" aria-pressed="false">自由擺放</button>
  <button class="btn" id="compact">整理</button>
</div>
<div class="scroller">
  <div class="grid-stack" id="grid">
    <div class="grid-stack-item" gs-x="0" gs-y="0" gs-w="3" gs-h="2" gs-id="rev"><div class="grid-stack-item-content kpi">
      <div class="w-head">💰 本月營收</div><div class="num">NT$ 486K</div><div class="delta">▲ 12.4% 較上月</div></div></div>
    <div class="grid-stack-item" gs-x="3" gs-y="0" gs-w="3" gs-h="2" gs-id="new"><div class="grid-stack-item-content kpi">
      <div class="w-head">🎓 新學員</div><div class="num">238 人</div><div class="delta">▲ 31 人</div></div></div>
    <div class="grid-stack-item" gs-x="6" gs-y="0" gs-w="3" gs-h="2" gs-id="refund"><div class="grid-stack-item-content kpi">
      <div class="w-head">↩️ 退費率</div><div class="num">1.8%</div><div class="delta down">▼ 0.6 個百分點</div></div></div>
    <div class="grid-stack-item" gs-x="9" gs-y="0" gs-w="3" gs-h="2" gs-id="clock"><div class="grid-stack-item-content clock">
      <div class="w-head">🕒 台北時間</div><div class="time" id="time">--:--:--</div><div class="muted" id="date" style="font-size:12px"></div></div></div>
    <div class="grid-stack-item" gs-x="0" gs-y="2" gs-w="6" gs-h="4" gs-id="chart"><div class="grid-stack-item-content">
      <div class="w-head">📊 各月報名人數（示意資料）</div>
      <div class="bars" id="bars"></div></div></div>
    <div class="grid-stack-item" gs-x="6" gs-y="2" gs-w="3" gs-h="4" gs-id="ring"><div class="grid-stack-item-content">
      <div class="w-head">🎯 平均完課率</div>
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
        <circle cx="60" cy="60" r="48" fill="none" stroke="#7bd389" stroke-width="14" stroke-linecap="round" stroke-dasharray="301.6" stroke-dashoffset="69" transform="rotate(-90 60 60)"/>
        <text x="60" y="66" text-anchor="middle" fill="#ecebe6" font-size="20" font-weight="700">77%</text></svg></div></div></div>
    <div class="grid-stack-item" gs-x="9" gs-y="2" gs-w="3" gs-h="4" gs-id="todo"><div class="grid-stack-item-content">
      <div class="w-head">✅ 今日待辦</div>
      <ul class="todo"><li class="ok">回覆學員來信</li><li>上傳第 4 堂講義</li><li>確認台中場教室</li><li>發送結業問卷</li></ul></div></div>
  </div>
</div>
<div class="hint">拖曳小工具重新排列・拉邊角改變大小</div>

<script src="https://cdn.jsdelivr.net/npm/gridstack@14.0.0/dist/gridstack-all.js"></script>
<script>
// Dashboard built with GridStack: drag, resize, float toggle, compact, add/remove widgets, responsive columns.
const MONTHS = [["5月", 62], ["6月", 78], ["7月", 95], ["8月", 71], ["9月", 118], ["10月", 88]];
document.getElementById("bars").innerHTML = MONTHS
  .map(([m, v]) => `<div><span>${v}</span><i style="height:${(v / 130) * 100}%"></i>${m}</div>`).join("");

function rowHeight() {
  const usable = document.querySelector(".scroller").clientHeight;
  return Math.max(44, Math.floor(usable / (innerWidth < 560 ? 9 : 6)));
}

const grid = GridStack.init({
  cellHeight: rowHeight(),
  margin: 5,
  float: false,
  animate: true,
  handle: ".w-head",
  resizable: { handles: "se,e,s" },
  columnOpts: { breakpoints: [{ w: 560, c: 1 }, { w: 820, c: 6 }] },
});

const NAMES = { rev: "本月營收", new: "新學員", refund: "退費率", clock: "台北時間", chart: "報名人數", ring: "完課率", todo: "今日待辦" };
const log = (t) => (document.getElementById("log").textContent = t);
grid.on("dragstop", (e, el) => {
  const n = el.gridstackNode;
  log(`已移動「${NAMES[n.id] || "小工具"}」到第 ${n.x + 1} 欄、第 ${n.y + 1} 列`);
});
grid.on("resizestop", (e, el) => {
  const n = el.gridstackNode;
  log(`「${NAMES[n.id] || "小工具"}」調整為 ${n.w} × ${n.h} 格`);
});

// Remove buttons on every widget header
function addClose(item) {
  const head = item.querySelector(".w-head");
  const b = document.createElement("button");
  b.className = "x";
  b.textContent = "✕";
  b.title = "移除";
  b.addEventListener("mousedown", (e) => e.stopPropagation());
  b.addEventListener("click", () => { grid.removeWidget(item); log("已移除一個小工具"); });
  head.append(b);
}
document.querySelectorAll(".grid-stack-item").forEach(addClose);

const EXTRA = [
  ["🔥 熱門課程", "<div class='num'>AI 簡報術</div><div class='delta'>本週 64 人報名</div>"],
  ["⭐ 滿意度", "<div class='num'>4.8 / 5</div><div class='delta'>▲ 0.2</div>"],
  ["📍 開課城市", "<div class='num'>6 個</div><div class='delta'>台北、新竹、台中、台南、高雄、花蓮</div>"],
];
let extra = 0;
document.getElementById("add").addEventListener("click", () => {
  const [title, body] = EXTRA[extra++ % EXTRA.length];
  const el = document.createElement("div");
  el.className = "grid-stack-item";
  el.innerHTML = `<div class="grid-stack-item-content kpi"><div class="w-head">${title}</div>${body}</div>`;
  grid.el.append(el);
  grid.makeWidget(el, { w: 3, h: 2 });
  addClose(el);
  log(`已新增「${title.slice(2)}」，自動找空位放入`);
  el.scrollIntoView({ behavior: "smooth", block: "nearest" });
});

const floatBtn = document.getElementById("float");
floatBtn.addEventListener("click", () => {
  const on = !grid.getFloat();
  grid.float(on);
  floatBtn.setAttribute("aria-pressed", on);
  log(on ? "自由擺放：小工具不會自動往上靠" : "自動靠攏：小工具會往上補空位");
});
document.getElementById("compact").addEventListener("click", () => { grid.compact(); log("已整理版面，空隙全部補齊"); });

addEventListener("resize", () => grid.cellHeight(rowHeight()));

function tick() {
  const now = new Date();
  document.getElementById("time").textContent = now.toLocaleTimeString("zh-TW", { hour12: false, timeZone: "Asia/Taipei" });
  document.getElementById("date").textContent = now.toLocaleDateString("zh-TW", { month: "long", day: "numeric", weekday: "long", timeZone: "Asia/Taipei" });
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
