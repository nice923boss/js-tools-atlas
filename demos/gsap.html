<style>
  .board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); overflow: hidden; }
  .tag { display: inline-block; max-width: 100%; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,.06); border: 1px solid var(--line);
    font: 500 11px/1.4 var(--mono); color: var(--c1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 1. timeline */
  .tl1 { display: flex; flex-direction: column; gap: 10px; }
  .tl1 .show { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
  .orbit { position: absolute; inset: 0; margin: auto; width: min(94cqh, 82cqw); height: min(94cqh, 82cqw); border: 1px dashed var(--line); border-radius: 50%; }

  /* 2. eases */
  .eases { height: 100%; display: grid; grid-template-rows: repeat(8, minmax(0, 1fr)); gap: 4px; }
  .ease { min-height: 0; display: grid; grid-template-columns: 46px 12em minmax(0, 1fr); align-items: center; gap: 12px; padding: 0 14px 0 6px;
    border-radius: 10px; background: rgba(255,255,255,.03); border: 1px solid var(--line); }
  .ease svg { width: 46px; height: 100%; max-height: 48px; overflow: visible; }

  .foods.list .food { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 6px 10px; text-align: left; }

  /* 6. text + morph */
  .duo { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px; }
  .duo > .panel { position: relative; min-height: 0; padding: 12px 16px; overflow: hidden; }
  .txt { display: flex; flex-direction: column; justify-content: center; gap: 8px; }
  .txt .tag, .morph .tag { position: absolute; left: 10px; top: 10px; right: 10px; width: max-content; }
  .txt h3 { margin: 0; font-size: clamp(18px, 3vw, 28px); color: var(--c1); }

  .morph b { font-size: 13px; color: var(--muted); }
  @media (max-width: 520px) { .duo { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); } .txt { padding-top: 36px !important; } }

  /* 7. drag */
  .drag-area { position: relative; height: 100%; overflow: hidden; }
  .drag-area.gridon { background-image: radial-gradient(rgba(255,255,255,.28) 1.2px, transparent 1.6px); background-size: 40px 40px; background-position: -20px -20px; }
  .token { position: absolute; left: 0; top: 0; padding: 9px 14px; border-radius: 10px; font-weight: 700; cursor: grab; user-select: none; touch-action: none; z-index: 2;

  .ghost { position: absolute; left: 0; top: 0; height: 38px; border-radius: 10px; border: 2px dashed var(--c1); opacity: 0; pointer-events: none; }
  .knob-wrap { position: absolute; right: 18px; bottom: 14px; display: grid; justify-items: center; gap: 6px; z-index: 1; }
  .dialbox { position: relative; width: 104px; height: 104px; }
  .dial { position: absolute; inset: -9px; border-radius: 50%; background: conic-gradient(from -135deg, var(--c2), var(--c3) 270deg, transparent 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); mask: radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px)); }
  .knob { position: absolute; inset: 0; border-radius: 50%; cursor: grab; touch-action: none;
    background: radial-gradient(circle at 50% 38%, #2c313a, #15181d 70%); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .knob i { position: absolute; left: calc(50% - 2px); top: 9px; width: 4px; height: 28%; border-radius: 2px; background: var(--c5); }
  .knob-out { font: 700 17px var(--mono); color: var(--c5); }
  .knob-out small { font: 500 11px var(--font); color: var(--muted); margin-right: 4px; }
  .readout { position: absolute; left: 12px; bottom: 10px; right: 150px; font: 500 11.5px/1.5 var(--mono); color: var(--muted); }
  @media (max-width: 560px) { .dialbox { width: 80px; height: 80px; } .readout { right: 110px; font-size: 10.5px; } }

  /* 8. stress */
  .stress-box { position: absolute; inset: 8px 8px 8px 350px; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.015); }
  .stress-box i { position: absolute; width: 8px; height: 8px; border-radius: 2px; }
  @media (max-width: 760px) { .stress-box { inset: 8px; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/CustomEase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MotionPathPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/DrawSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Flip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/MorphSVGPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Draggable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/InertiaPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrambleTextPlugin.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// GSAP showcase: timeline choreography, easing, staggers, plugins (MotionPath, Flip, SplitText, MorphSVG, Draggable) and a tween-count stress ramp.
gsap.registerPlugin(SplitText, CustomEase, MotionPathPlugin, DrawSVGPlugin, Flip, MorphSVGPlugin, Draggable, InertiaPlugin, ScrambleTextPlugin);
CustomEase.create("hop", "M0,0 C0.2,0 0.18,0.62 0.34,0.62 0.48,0.62 0.5,0.34 0.62,0.34 0.76,0.34 0.74,1 1,1");

const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const { random } = gsap.utils;
const { h } = Showcase;

// Every tween, SplitText and Draggable a scene creates goes through run() into one gsap.context,
// so unmounting the scene reverts all of them in one call.
function scope(ctx) {
  const g = gsap.context(() => {}, ctx.el);
  ctx.onCleanup(() => g.revert());
  return (fn) => g.add(fn);
}
// Keep a ctx.slider's <output> in sync when the value changes from code.
function setSlider(input, v, text) {
  input.value = v;
  if (input.nextElementSibling) input.nextElementSibling.textContent = text;
}
// Smooth closed outline through points, built with MotionPathPlugin's own helpers.
const loopPath = (pts, curviness) =>
  MotionPathPlugin.rawPathToString(MotionPathPlugin.arrayToRawPath([...pts, pts[0]].map(([x, y]) => ({ x, y })), { curviness }));

// Rough Taiwan coastline and a round-the-island rail loop (SVG units, not to scale).
const COAST = [[229, 12], [259, 31], [294, 49], [274, 100], [241, 177], [207, 287], [175, 331], [140, 381], [133, 437], [116, 434], [97, 379],
  [52, 347], [28, 300], [35, 252], [63, 169], [84, 141], [143, 69], [168, 40], [210, 27]];
const STATIONS = [["台北", 232, 47], ["桃園", 196, 55], ["新竹", 152, 78], ["台中", 110, 158], ["嘉義", 80, 240], ["台南", 48, 298],
  ["高雄", 64, 338], ["枋寮", 102, 370], ["台東", 166, 324], ["花蓮", 228, 180], ["宜蘭", 256, 84]];
const FOODS = [["蚵仔煎", "鹹", 70], ["大腸包小腸", "鹹", 65], ["鹽酥雞", "鹹", 80], ["臭豆腐", "鹹", 60], ["胡椒餅", "鹹", 55], ["豆花", "甜", 45],
  ["雞蛋糕", "甜", 50], ["車輪餅", "甜", 30], ["芒果冰", "甜", 120], ["珍珠奶茶", "飲", 60], ["木瓜牛奶", "飲", 65], ["甘蔗汁", "飲", 50]];
const CAT = { 鹹: ["鹹食", C[4]], 甜: ["甜點", C[2]], 飲: ["飲料", C[1]] };
const TEXT = "清晨六點，捷運從淡水出發，穿過城市地底，在象山迎接第一道陽光。車廂裡有人打盹，有人背單字，也有人望著窗外的觀音山發呆。";
const starPath = () => {
  const pts = Array.from({ length: 10 }, (_, i) => {
    const a = -Math.PI / 2 + (i * Math.PI) / 5, r = i % 2 ? 38 : 88;
    return `${(100 + r * Math.cos(a)).toFixed(1)},${(106 + r * Math.sin(a)).toFixed(1)}`;
  });
  return `M${pts.join(" L")} Z`;
};
const SHAPES = [
  ["圓形", "M100,20 C144.2,20 180,55.8 180,100 C180,144.2 144.2,180 100,180 C55.8,180 20,144.2 20,100 C20,55.8 55.8,20 100,20 Z", C[5]],
  ["星形", starPath(), C[0]],
  ["愛心", "M100,172 C58,140 22,112 22,72 C22,44 44,26 68,26 C84,26 94,36 100,48 C106,36 116,26 132,26 C156,26 178,44 178,72 C178,112 142,140 100,172 Z", C[2]],
  ["水滴", "M100,16 C122,52 160,86 160,124 C160,158 133,184 100,184 C67,184 40,158 40,124 C40,86 78,52 100,16 Z", C[1]],
];

Showcase.run({ scenes: [
  {
    id: "timeline", title: "時間軸編排",
    api: 'gsap.timeline().addLabel("標題", "-=0.3").add(tween, "<0.35")',
    desc: "一條主時間軸編排七段補間：標籤與位置參數（-=0.3、<、<0.35、收尾+=0.1）決定每段從哪裡開始，下方甘特圖畫出實際排程與播放頭。",
    hint: "拖曳甘特圖跳到任意時間，點標籤從該段播放",
    mount(ctx) {
      ctx.html(`<div class="board tl1">
        <div class="show">
          <div class="orbit"><i></i></div><div class="orbit o2"><i></i></div>
          <div class="center">
            <div class="mark">JS</div>
            <h1 class="title">JS 工具圖鑑</h1>
            <p class="sub">328 個工具，一次看懂</p>
            <div class="cards">
              <div class="card"><div class="ico circle"></div><span>動畫</span></div>
              <div class="card"><div class="ico square"></div><span>圖表</span></div>
              <div class="card"><div class="ico tri"></div><span>3D</span></div>
              <div class="card"><div class="ico ring"></div><span>音訊</span></div>
            </div>
          </div>
        </div>
        <div class="panel gantt"><header><b>排程</b><span class="labels"></span><span class="t"></span></header><div class="rows"></div></div>
      </div>`);
      const run = scope(ctx);
      const rowsEl = ctx.$(".rows"), timeEl = ctx.$(".gantt .t");
      const steps = [];
      let tl;
      const paint = () => {
        rowsEl.style.setProperty("--p", tl.time() / tl.duration());
        timeEl.textContent = `${tl.time().toFixed(2)} / ${tl.duration().toFixed(2)} s`;
      };
      run(() => {
        gsap.utils.toArray(".orbit").forEach((el, i) => gsap.to(el, { rotation: i ? -360 : 360, duration: 14 + i * 6, repeat: -1, ease: "none" }));
        const split = SplitText.create(".title", { type: "chars" });
        tl = gsap.timeline({ repeat: -1, yoyo: true, repeatDelay: 1.2, onUpdate: paint });
        // Each step is a standalone tween placed with a position parameter, so the gantt can read its start and length.
        const add = (name, pos, tween, color) => { tl.add(tween, pos); steps.push({ name, pos, tween, color }); };
        tl.addLabel("標誌");
        add("標誌 放大旋轉", "標誌", gsap.from(".mark", { scale: 0, rotation: -200, duration: 0.9, ease: "back.out(1.8)" }), C[0]);
        tl.addLabel("標題", "-=0.3");
        add("標題 逐字翻轉", "標題", gsap.from(split.chars, { yPercent: 110, rotationX: -90, opacity: 0, duration: 0.7, stagger: 0.06, ease: "power3.out" }), C[1]);
        add("副標 淡入", "<0.35", gsap.from(".sub", { y: 16, opacity: 0, duration: 0.5, ease: "power3.out" }), C[5]);
        tl.addLabel("卡片", "-=0.15");
        add("卡片 交錯彈出", "卡片", gsap.from(".card", { y: 50, scale: 0.7, opacity: 0, duration: 0.6, stagger: 0.1, ease: "back.out(1.5)" }), C[3]);
        tl.addLabel("收尾", "+=0.2");

    api: "gsap.to(el, { x, y, repeat: -1, yoyo: true }) × N",
    desc: "每個方塊各有一個無限往返的 gsap.to()，逐級加量直到掉到 30 FPS 以下；切換成 left／top 再測一次，比較 transform 與版面屬性的成本差距。",
    hint: "按「自動加壓」開始；切換屬性後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="stress-box"></div>`);
      const box = ctx.$(".stress-box");
      let mode = 0, count = 0, tweens = [];
      const clear = () => { tweens.forEach((t) => t.kill()); tweens = []; box.textContent = ""; };
      function fill(n) {
        clear();
        count = n;
        const W = box.clientWidth, H = box.clientHeight, frag = document.createDocumentFragment(), els = [];
        for (let i = 0; i < n; i++) {
          const el = document.createElement("i");
          el.style.cssText = `background:${C[i % 6]};left:${(Math.random() * (W - 8)).toFixed(1)}px;top:${(Math.random() * (H - 8)).toFixed(1)}px`;
          frag.append(el);
          els.push(el);
        }
        box.append(frag);
        for (const el of els) {
          const dx = random(-50, 50), dy = random(-50, 50);
          const vars = mode === 0 ? { x: dx, y: dy } : { left: `+=${dx}`, top: `+=${dy}` };
          tweens.push(gsap.to(el, { ...vars, duration: random(0.8, 2), ease: "sine.inOut", repeat: -1, yoyo: true }));
        }
      }
      ctx.onCleanup(clear);
      ctx.group(["transform（x／y）", "版面（left／top）"], 0, (i) => { mode = i; fill(count); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "動畫元素", steps: [250, 500, 1000, 2000, 4000, 8000, 16000], minFps: 30,
        apply: fill,
        metrics: () => ({ "屬性": mode ? "left／top" : "transform", "進行中補間": gsap.globalTimeline.getChildren(false, true, false).length }),
        note: "每格 GSAP 都要計算所有補間並寫回樣式，這部分兩種模式一樣。差別在瀏覽器：transform 不影響其他元素，只需重繪或合成；left／top 是版面屬性，改了就要重新計算版面再重繪，元素越多差距越大。",
      });
    },
  },
] });
</script>
</body>
</html>
