<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>

<script>
// Hammer.js showcase: six scenes from a swipe card stack to a manager-count stress ramp.
const { h } = Showcase;
const H = Hammer;
const ARROW = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 2l6.5 19 2.6-7.6L20 11z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r0 = (v) => Math.round(v);
const DIR = { 1: "NONE", 2: "LEFT", 4: "RIGHT", 8: "UP", 16: "DOWN" };
const evtLine = (el) => (name, text = "") => { el.innerHTML = `<code>${name}</code>${esc(text)}`; };
const P = (el, fx = 0.5, fy = 0.5) => { const r = el.getBoundingClientRect(); return [r.left + r.width * fx, r.top + r.height * fy]; };
const line = (a, b) => (k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k];
// Manager destroyed when the scene unmounts.
function mgr(ctx, el, opts) { const m = new H.Manager(el, opts); ctx.onCleanup(() => m.destroy()); return m; }

// ---------- robot input ----------
// Synthetic PointerEvents go through Hammer's real PointerEventInput (pointerdown on the element,
// pointermove / pointerup on window). The robot mouse uses pointerId 7 so a real hovering mouse
// (pointerId 1) is ignored by Hammer's pointer store; a real press releases the robot first.
const ROBOT = 7;
const USER = new Error("user took over");
const held = new Map();
let userAt = 0;
function fire(type, x, y, id = ROBOT, pointerType = "mouse") {
  if (type === "pointerdown" || type === "pointermove") held.set(id, [x, y, pointerType]); else held.delete(id);
  const t = document.elementFromPoint(x, y) || document.body;
  const ev = new PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true, pointerId: id, pointerType, isPrimary: id === ROBOT || id === 11,
    button: type === "pointermove" ? -1 : 0, buttons: type === "pointerup" ? 0 : 1, clientX: x, clientY: y,
  });
  t.dispatchEvent(ev);
}
window.addEventListener("pointerdown", (e) => {
  if (!e.isTrusted) return;
  userAt = performance.now();
  for (const [id, [x, y, pt]] of [...held]) fire("pointerup", x, y, id, pt);
}, true);
function check(ctx) { if (!ctx.active || userAt > ctx.hmSince) throw USER; }
// Overlay showing the robot: arrow cursor for the mouse, yellow circles for touch fingers.
function overlay(ctx, n, touch) {
  let ov = ctx.el.querySelector(".hm-ov");
  if (!ov) { ov = h("div", { class: "hm-ov" }); ctx.el.append(ov); }
  ov.innerHTML = touch ? '<svg class="hm-fl"><line/></svg>' + '<i class="hm-fg"></i>'.repeat(n) : `<i class="hm-cur">${ARROW}</i>`;
  ov.classList.add("on");
  const host = ctx.el.getBoundingClientRect(), dots = [...ov.querySelectorAll("i")], ln = ov.querySelector("line");
  return {
    place(pts) {
      pts.forEach(([x, y], i) => { dots[i].style.transform = `translate(${x - host.left}px, ${y - host.top}px)`; });
      if (ln && pts[1]) { ln.setAttribute("x1", pts[0][0] - host.left); ln.setAttribute("y1", pts[0][1] - host.top); ln.setAttribute("x2", pts[1][0] - host.left); ln.setAttribute("y2", pts[1][1] - host.top); }
    },
    down(v) { ov.classList.toggle("down", v); },
  };
}
// One gesture: each path maps progress k (0..1) to a client point; several paths = several touch fingers.
async function gesture(ctx, paths, { ms = 600, hold = 100, ease = true, touch = paths.length > 1 } = {}) {
  const ov = overlay(ctx, paths.length, touch);
  const ids = paths.map((_, i) => (touch ? 11 + i : ROBOT)), type = touch ? "touch" : "mouse";
  let pts = paths.map((p) => p(0));
  ov.place(pts);
  await ctx.sleep(180);
  check(ctx);
  ov.down(true);
  pts.forEach((p, i) => fire("pointerdown", p[0], p[1], ids[i], type));
  const t0 = performance.now();
  for (let k = 0; k < 1;) {
    await ctx.sleep(16);
    if (userAt > ctx.hmSince) ov.down(false);
    check(ctx);
    k = ms ? Math.min(1, (performance.now() - t0) / ms) : 1;
    const e = ease ? (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2) : k;
    pts = paths.map((p) => p(e));
    ov.place(pts);
    pts.forEach((p, i) => fire("pointermove", p[0], p[1], ids[i], type));
  }
  if (hold) await ctx.sleep(hold);
  check(ctx);
  pts.forEach((p, i) => fire("pointerup", p[0], p[1], ids[i], type));
  ov.down(false);
  await ctx.sleep(250);
}
async function tap(ctx, p, { hold = 60, gap = 0 } = {}) {
  const ov = overlay(ctx, 1, false);
  ov.place([p]);
  await ctx.sleep(gap || 160);
  check(ctx);
  ov.down(true); fire("pointerdown", p[0], p[1]);
  await ctx.sleep(hold);
  check(ctx);
  fire("pointerup", p[0], p[1]); ov.down(false);
}
async function taps(ctx, p, n) { await tap(ctx, p); for (let i = 1; i < n; i++) await tap(ctx, p, { gap: 90 }); }
function demoRunner(ctx, fn, delay = 700) {
  let busy = false;
  const go = async () => {
    if (busy) return;
    busy = true;
    ctx.hmSince = performance.now(); // a real press any time after this stops the whole run
    try { await fn(); } catch (err) { if (err !== USER) throw err; } finally {
      busy = false;
      const ov = ctx.el.querySelector(".hm-ov"); if (ov) ov.classList.remove("on", "down");
    }
  };
  ctx.timeout(go, delay);
  return go;
}

const PHOTOS = [
  ["峽灣", "挪威式峽灣，水面倒映山壁"], ["紅岩峽谷", "砂岩層層堆疊的紅色峽谷"], ["綠色山谷公路", "蜿蜒穿過山谷的公路"], ["披毯巴哥犬", "裹著毯子打盹的巴哥"],
  ["瀑布彩虹", "瀑布水氣折射出彩虹"], ["藍底水母", "在藍色深海漂浮的水母"], ["母獅特寫", "母獅凝視鏡頭的特寫"], ["海象群", "在岸邊曬太陽的海象群"],
];
const MAIL = [
  ["新竹場窗口", "09:12", "下週二的教室已確認，投影機需要 HDMI 轉接頭"], ["學員 王小姐", "08:47", "請問課程講義可以寄電子檔嗎？"],
  ["會計部", "昨天", "十月份講師費已入帳，請查收明細"], ["台南學員", "昨天", "發票抬頭要改成公司名稱，統編如下"],
  ["花蓮場合作", "週一", "場地費報價單附件，請回覆是否續約"], ["系統通知", "週一", "您的雲端空間已使用 82%"],
  ["助教 小林", "週日", "作業批改完畢，平均分數 86"], ["課程平台", "週六", "新課程上架審核通過"],
  ["讀書會", "週五", "本月選書投票結果出爐"], ["印刷廠", "週四", "結業證書打樣完成，請確認字型"],
];

Showcase.run({ scenes: [
  {
    id: "cards", title: "照片卡堆疊",
    api: "new Hammer.Manager(el) + Pan / Swipe / Pinch / Rotate / Tap({ taps: 2 }) / Press，recognizeWith",
    desc: "一個 Manager 掛在卡片堆上，手勢永遠作用在最上面那張：pan 讓卡片跟手並依水平位移傾斜，放開時位移超過 35% 或 velocityX 夠快就甩出；doubletap 放大、press 450ms 顯示說明；觸控螢幕可雙指 pinch 縮放、rotate 旋轉。swipe.recognizeWith(pan)、pinch.recognizeWith(rotate) 讓這些辨識器在同一次觸控中同時成立，否則同一時間只會有一個辨識器勝出。",
    hint: "左右甩卡片・雙擊放大・長按看說明・觸控可雙指縮放旋轉",
    mount(ctx) {
      const GESTURES = [["pan", "拖曳"], ["swipe", "甩動"], ["pinch", "捏合"], ["rotate", "旋轉"], ["doubletap", "雙擊"], ["press", "長按"]];
      ctx.html(`<div class="hm-wrap"><div class="hm-head"><b>照片卡</b><span class="hm-evt">左右甩動卡片，右收藏、左略過</span><span class="hm-score">♥ <b class="hm-nl">0</b>　✕ <b class="hm-nn">0</b></span></div>
        <div class="hm-chips">${GESTURES.map(([k, n]) => `<span class="hm-chip" data-g="${k}">${n}<b>${k}</b></span>`).join("")}</div>
        <div class="hm-area hm-deck"><div class="hm-stack"></div></div></div>`);
      const stack = ctx.$(".hm-stack"), evt = evtLine(ctx.$(".hm-evt"));
      const counts = { like: 0, nope: 0 };
      let t = { x: 0, y: 0, s: 1, r: 0 }, base = { ...t };
      const flash = (g) => { const c = ctx.$(`[data-g="${g}"]`); c.classList.add("on"); clearTimeout(c._t); c._t = setTimeout(() => c.classList.remove("on"), 260); };
      const cards = () => ctx.$$(".hm-card");
      const top = () => cards().pop();
      const paint = (el) => {
        el.style.transform = `translate(${t.x}px, ${t.y}px) rotate(${t.r + (t.s <= 1.02 ? t.x * 0.06 : 0)}deg) scale(${t.s})`;
        const k = t.s <= 1.02 ? clamp(t.x / 120, -1, 1) : 0;
        el.querySelector(".hm-like").style.opacity = Math.max(0, k);
        el.querySelector(".hm-nope").style.opacity = Math.max(0, -k);
      };
      const restack = () => {
        const c = cards();
        c.forEach((el, i) => {
          const depth = c.length - 1 - i, d = Math.min(depth, 3);
          el.classList.toggle("hm-top", depth === 0);
          el.classList.add("hm-anim");
          if (depth > 0) { el.style.transform = `translateY(${d * 10}px) scale(${1 - d * 0.04}) rotate(${(i % 2 ? 1 : -1) * d * 1.5}deg)`; el.style.opacity = depth > 3 ? 0 : 1; }
        });
        t = { x: 0, y: 0, s: 1, r: 0 }; base = { ...t };
        if (top()) paint(top());
      };
      const build = () => {
        stack.innerHTML = `<div class="hm-empty">看完了<br>按「重來」再玩一次</div>`;
        PHOTOS.forEach(([name, info], i) => {
          const el = h("div", { class: "hm-card" });
          el.innerHTML = `<img src="_shared/img/photo-${i + 1}.jpg" alt="" draggable="false"><div class="hm-cap">${name}<span>${i + 1} / 8</span></div>
            <div class="hm-stamp hm-like">收藏</div><div class="hm-stamp hm-nope">略過</div><div class="hm-info">${info}</div>`;
          stack.querySelector(".hm-empty").after(el); // first photo ends up on top
        });

        a = P(rows()[1], 0.7, 0.5);
        await gesture(ctx, [line(a, [a[0] - 150, a[1] + 4])], { ms: 110, hold: 0, ease: false });
        await ctx.sleep(900);
        a = P(rows()[2], 0.25, 0.5);
        await gesture(ctx, [line(a, [a[0] + rows()[2].offsetWidth * 0.5, a[1]])], { ms: 800, hold: 200 });
      });
      ctx.button("自動示範", go);
    },
  },
  {
    id: "pinch", title: "雙指縮放旋轉",
    api: "Pinch() + Rotate()，pinch.recognizeWith(rotate) 或 dropRecognizeWith(rotate)",
    desc: "Pinch 與 Rotate 都需要兩個指標，也就是觸控螢幕的兩根手指；桌機滑鼠只有一個指標（觸控板的雙指縮放在瀏覽器裡是 ctrl + wheel，不是指標事件），所以這裡由程式送出兩組 pointerType: touch 的合成事件（黃色圓圈）。開啟 recognizeWith 時一邊旋轉一邊縮放兩者同時生效；關閉時兩邊都要 dropRecognizeWith（這個方法只拆單邊），之後同一次手勢只會有先成立的 pinch 勝出，rotatemove 次數停在 0。單指可拖移，雙擊還原。",
    hint: "觸控螢幕兩指操作・桌機按上方「模擬」按鈕・切換 recognizeWith 比較",
    mount(ctx) {
      ctx.html(`<div class="hm-wrap"><div class="hm-head"><b>雙指縮放旋轉</b><span class="hm-evt">需要兩指觸控；滑鼠可單指拖移</span></div>
        <div class="hm-stats"><span>scale <b class="hm-p1">1.00</b></span><span>rotation <b class="hm-p2">0°</b></span><span>center <b class="hm-p3">-</b></span><span>pinchmove <b class="hm-p4">0</b></span><span>rotatemove <b class="hm-p5">0</b></span></div>
        <div class="hm-area hm-pz"><span class="hm-badge">真實觸控或合成觸控事件皆可</span><div class="hm-photo"><img src="_shared/img/photo-1.jpg" alt="峽灣"></div></div></div>`);
      const area = ctx.$(".hm-pz"), photo = ctx.$(".hm-photo"), badge = ctx.$(".hm-badge"), evt = evtLine(ctx.$(".hm-evt"));
      const st = { x: 0, y: 0, a: 0, s: 1 };
      let base = { ...st }, c0 = null, nP = 0, nR = 0, together = true;
      const apply = () => { photo.style.transform = `translate(${st.x}px, ${st.y}px) rotate(${st.a}deg) scale(${st.s})`; };
      const reset = () => { Object.assign(st, { x: area.clientWidth / 2 - photo.offsetWidth / 2, y: area.clientHeight / 2 - photo.offsetHeight / 2, a: 0, s: 1 }); apply(); };
      reset(); ctx.onResize(reset);
      const mc = mgr(ctx, area);
      const pinch = new H.Pinch(), rotate = new H.Rotate(), pan = new H.Pan({ pointers: 1 }), dbl = new H.Tap({ event: "doubletap", taps: 2 });
      pinch.recognizeWith(rotate);
      mc.add([pinch, rotate, pan, dbl]);
      const begin = (e) => { base = { ...st }; c0 = e.type === "panstart" ? { x: e.center.x - e.deltaX, y: e.center.y - e.deltaY } : e.center; if (e.type !== "panstart") { nP = nR = 0; ctx.$(".hm-p4").textContent = ctx.$(".hm-p5").textContent = 0; } };
      const follow = (e) => { st.x = base.x + e.center.x - c0.x; st.y = base.y + e.center.y - c0.y; ctx.$(".hm-p3").textContent = `${r0(e.center.x)}, ${r0(e.center.y)}`; };
      mc.on("pinchstart rotatestart panstart", begin);
      mc.on("pinchmove", (e) => { st.s = clamp(base.s * e.scale, 0.4, 3); follow(e); apply(); ctx.$(".hm-p1").textContent = e.scale.toFixed(2); ctx.$(".hm-p4").textContent = ++nP; evt("pinchmove", ` scale ${e.scale.toFixed(2)}　pointers ${e.pointers.length}`); });
      mc.on("rotatemove", (e) => { st.a = base.a + e.rotation; if (!together || !pinch.state) follow(e); apply(); ctx.$(".hm-p2").textContent = `${e.rotation.toFixed(1)}°`; ctx.$(".hm-p5").textContent = ++nR; });
      mc.on("panmove", (e) => { follow(e); apply(); evt("panmove", " 單一指標：只能移動"); });
      mc.on("pinchend rotateend", () => evt("end", ` pinchmove ${nP} 次、rotatemove ${nR} 次${together ? "" : "（未設 recognizeWith，只有一個辨識器勝出）"}`));
      mc.on("doubletap", () => { reset(); evt("doubletap", " 還原"); });
      const twoFinger = async (turn, spread) => {
        badge.textContent = "合成觸控事件：pointerType 'touch' × 2"; badge.classList.add("on");
        const c = P(photo), a0 = -0.5;
        const f = (sgn) => (k) => { const a = a0 + (turn * Math.PI / 180) * k, r = 50 + spread * k; return [c[0] + sgn * r * Math.cos(a), c[1] + sgn * r * Math.sin(a)]; };
        try { await gesture(ctx, [f(1), f(-1)], { ms: 1300, hold: 150 }); } finally { badge.classList.remove("on"); badge.textContent = "真實觸控或合成觸控事件皆可"; }
      };
      const go = demoRunner(ctx, async () => { await twoFinger(80, 40); await ctx.sleep(500); await twoFinger(-30, -25); });
      ctx.toggle("recognizeWith", together, (v) => { together = v; if (v) pinch.recognizeWith(rotate); else { pinch.dropRecognizeWith(rotate); rotate.dropRecognizeWith(pinch); } evt("set", v ? " pinch 與 rotate 同時辨識" : " 雙向 dropRecognizeWith（只拆一邊不會生效）：同一次手勢只會有一個辨識器"); });
      const sim = (turn, spread) => () => { ctx.hmSince = performance.now(); twoFinger(turn, spread).catch((err) => { if (err !== USER) throw err; }); };
      ctx.button("模擬旋轉＋放大", sim(80, 40), { primary: true });
      ctx.button("模擬只捏合", sim(0, -30));
      ctx.button("重設", reset);
      ctx.button("自動示範", go);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new Hammer(el)  ×  N 個元素，指標事件持續輸入",
    desc: "放入 N 個色塊，每個 new Hammer(el)（預設 7 個辨識器），程式每一幀送出合成指標事件：按下隨機色塊、拖 12 幀、放開、再移動 6 幀（hover），逐級加量直到掉到 30 FPS 以下。量建立與 destroy 耗時，以及 pointerdown、拖曳 move、hover move 交給 Hammer 處理的同步耗時。可切換成「父層單一 Manager」比較。",
    hint: "按「自動加壓」開始・切換父層單一 Manager 比較",
    mount(ctx) {
      ctx.html(`<div class="hm-stress"></div>`);
      const box = ctx.$(".hm-stress");
      let one = false, mcs = [], parent = null, n = 0, initMs = 0, killMs = 0;
      const T = { down: [], drag: [], hover: [] };
      const avg = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0);
      const push = (a, v) => { a.push(v); if (a.length > 90) a.shift(); };
      const kill = () => {
        const t0 = performance.now();
        if (parent) { parent.destroy(); parent = null; }
        for (const m of mcs) m.destroy();
        mcs = [];
        killMs = performance.now() - t0;
      };
      ctx.onCleanup(kill);
      const onPan = (e) => { const el = e.target.closest(".hm-stress > div"); if (el) el.style.translate = e.type === "panend" ? "" : `${e.deltaX}px ${e.deltaY}px`; };
      const build = (count) => {
        kill(); n = count;
        T.down.length = T.drag.length = T.hover.length = 0;
        const W = box.clientWidth - 8, Hh = box.clientHeight - 8;
        const side = Math.max(3, Math.floor(Math.sqrt((W * Hh) / n)) - 1);
        box.style.gridTemplateColumns = `repeat(${Math.max(1, Math.floor(W / (side + 1)))}, ${side}px)`;
        box.style.gridAutoRows = `${side}px`;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < n; i++) { const d = document.createElement("div"); d.style.background = `hsl(${(i / n) * 300} 70% 55%)`; frag.append(d); }
        box.replaceChildren(frag);
        const t0 = performance.now();
        if (one) { parent = new H(box); parent.on("panmove panend", onPan); } else for (const d of box.children) { const m = new H(d); m.on("panmove panend", onPan); mcs.push(m); }
        initMs = performance.now() - t0;
      };
      const timed = (type, x, y) => { const t0 = performance.now(); fire(type, x, y); return performance.now() - t0; };
      const bot = { phase: 0, k: 0, x: 0, y: 0, a: 0 };
      ctx.raf(() => {
        if (!n || !box.children.length) return;
        if (bot.phase === 0) {
          const d = box.children[(Math.random() * box.children.length) | 0], r = d.getBoundingClientRect();
          bot.x = r.left + r.width / 2; bot.y = r.top + r.height / 2; bot.a = Math.random() * 6.28; bot.k = 0; bot.phase = 1;
          push(T.down, timed("pointerdown", bot.x, bot.y));
        } else if (bot.phase === 1) {
          bot.x += Math.cos(bot.a) * 5; bot.y += Math.sin(bot.a) * 5;
          push(T.drag, timed("pointermove", bot.x, bot.y));
          if (++bot.k >= 12) { fire("pointerup", bot.x, bot.y); bot.phase = 2; bot.k = 0; }
        } else {
          bot.x += 7; bot.y += 3;
          const t0 = performance.now();
          (document.elementFromPoint(bot.x, bot.y) || box).dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerId: ROBOT, pointerType: "mouse", button: -1, buttons: 0, clientX: bot.x, clientY: bot.y }));
          push(T.hover, performance.now() - t0);
          if (++bot.k >= 6) bot.phase = 0;
        }
      });
      ctx.controls.classList.add("bottom");
      ctx.toggle("父層單一 Manager", one, (v) => { one = v; build(n || 100); });
      ctx.ramp({
        label: "Hammer 元素", steps: [100, 300, 1000, 3000, 10000, 20000], minFps: 30,
        apply: (c) => build(c),
        metrics: () => ({
          "建立": Showcase.fmtMs(initMs), "destroy": Showcase.fmtMs(killMs),
          "pointerdown": Showcase.fmtMs(avg(T.down)), "拖曳 move": Showcase.fmtMs(avg(T.drag)), "hover move": Showcase.fmtMs(avg(T.hover)),
          "綁定方式": one ? "父層單一" : "逐一 new Hammer",
        }),
        note: "Hammer 2 的 PointerEventInput 在每個 Manager 的元素上聽 pointerdown，但 pointermove / pointerup 是掛在 window 上，所以 N 個 Manager 就有 N 個 window 監聽器，每一次滑鼠移動（即使只是 hover）都要跑 N 次；建立時每個 Manager 還要產生 7 個辨識器並計算 touch-action。父層單一 Manager 再用 e.target 找出色塊，成本與 N 無關。",
      });
    },
  },
] });
</script>
