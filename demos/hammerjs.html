<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hammer.js 示範：觸控手勢照片卡</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"手機或觸控螢幕可用雙指縮放、旋轉"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 40%, rgba(76,201,240,.10), transparent 70%), var(--bg); }
  .layout { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 46px; padding: 54px 12px 46px; }
  .stack { position: relative; width: min(82vw, 440px, calc((100vh - 250px) * 1.3)); aspect-ratio: 4 / 3.35; touch-action: none; }
  .card {
    position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: var(--bg-2);
    box-shadow: 0 18px 40px rgba(0,0,0,.45); border: 1px solid var(--line);
    user-select: none; -webkit-user-drag: none; will-change: transform; transform-origin: 50% 60%;
  }
  .card img { display: block; width: 100%; height: 82%; object-fit: cover; pointer-events: none; }
  .card .cap { height: 18%; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 14px; font-weight: 600; }
  .card .cap span { color: var(--muted); font: 500 12px var(--mono); }
  .card.top { cursor: grab; }
  .card.anim { transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s; }
  .stamp { position: absolute; top: 18px; padding: 4px 12px; border: 3px solid; border-radius: 8px; font-size: 22px; font-weight: 900; opacity: 0; letter-spacing: 2px; background: rgba(0,0,0,.25); }
  .stamp.like { left: 16px; color: var(--c4); transform: rotate(-12deg); }
  .stamp.nope { right: 16px; color: var(--c3); transform: rotate(12deg); }
  .info { position: absolute; inset: auto 10px 22% 10px; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,.65); font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .info.show { opacity: 1; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); border: 2px dashed var(--line); border-radius: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 660px; }
  .chip { padding: 5px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); font-size: 12px; color: var(--muted); transition: all .25s; }
  .chip b { font: 600 11px var(--mono); margin-left: 4px; opacity: .7; }
  .chip.flash { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); transform: translateY(-2px); transition: none; }
  .score { position: fixed; left: 12px; top: 12px; z-index: 50; display: flex; gap: 6px; }
  .score .btn { pointer-events: none; }
</style>
</head>
<body>
<div class="score">
  <span class="btn">♥ 收藏 <b id="nLike">0</b></span>
  <span class="btn">✕ 略過 <b id="nNope">0</b></span>
</div>
<div class="controls">
  <button class="btn" id="bNope">✕</button>
  <button class="btn primary" id="bLike">♥</button>
  <button class="btn" id="bReset">重來</button>
</div>
<div class="layout">
  <div class="stack" id="stack"></div>
  <div class="chips" id="chips"></div>
</div>
<div class="hint">左右甩卡片・雙擊放大・長按看說明・觸控可雙指縮放旋轉</div>

<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
<script>
// Tinder-like photo stack driven by a Hammer.Manager with pan, swipe, pinch, rotate, tap, doubletap and press.
const PHOTOS = [
  ["峽灣", "挪威式峽灣，水面倒映山壁"], ["紅岩峽谷", "砂岩層層堆疊的紅色峽谷"],
  ["綠色山谷公路", "蜿蜒穿過山谷的公路"], ["披毯巴哥犬", "裹著毯子打盹的巴哥"],
  ["瀑布彩虹", "瀑布水氣折射出彩虹"], ["藍底水母", "在藍色深海漂浮的水母"],
  ["母獅特寫", "母獅凝視鏡頭的特寫"], ["海象群", "在岸邊曬太陽的海象群"],
];
const GESTURES = [["pan", "拖曳"], ["swipe", "甩動"], ["pinch", "捏合"], ["rotate", "旋轉"], ["doubletap", "雙擊"], ["press", "長按"]];
const stack = document.getElementById("stack");
const chips = document.getElementById("chips");
const counts = { like: 0, nope: 0 };
let t = { x: 0, y: 0, s: 1, r: 0 };   // live transform of the top card
let base = { ...t };

chips.innerHTML = GESTURES.map(([k, n]) => `<span class="chip" data-g="${k}">${n}<b>${k}</b></span>`).join("");
function flash(name) {
  const chip = chips.querySelector(`[data-g="${name}"]`);
  if (!chip) return;
  chip.classList.add("flash");
  clearTimeout(chip._t);
  chip._t = setTimeout(() => chip.classList.remove("flash"), 260);
}

function build() {
  stack.innerHTML = `<div class="empty">看完了！<br>按「重來」再玩一次</div>`;
  const order = [...PHOTOS.keys()].sort(() => Math.random() - .5);
  order.forEach((i, n) => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<img src="_shared/img/photo-${i + 1}.jpg" alt="" draggable="false">
      <div class="cap">${PHOTOS[i][0]}<span>${n + 1} / 8</span></div>
      <div class="stamp like">收藏</div><div class="stamp nope">略過</div>
      <div class="info">${PHOTOS[i][1]}</div>`;
    stack.prepend(el); // first photo ends up on top
  });
  // stack.prepend put the first card at the bottom of the DOM order, so move the empty note back to the bottom
  stack.prepend(stack.querySelector(".empty"));
  restack();
}
function cards() { return [...stack.querySelectorAll(".card")]; }
function topCard() { const c = cards(); return c[c.length - 1]; }

function restack() {
  const c = cards();
  c.forEach((el, i) => {
    const depth = c.length - 1 - i;
    el.classList.toggle("top", depth === 0);
    el.classList.add("anim");
    if (depth > 0) {
      const d = Math.min(depth, 3);
      el.style.transform = `translateY(${d * 10}px) scale(${1 - d * 0.04}) rotate(${(i % 2 ? 1 : -1) * d * 1.5}deg)`;
      el.style.opacity = depth > 3 ? 0 : 1;
    }
  });
  t = { x: 0, y: 0, s: 1, r: 0 };
  base = { ...t };
  if (topCard()) paint(topCard());
}

function paint(el) {
  el.style.transform = `translate(${t.x}px, ${t.y}px) rotate(${t.r + (t.s <= 1.02 ? t.x * 0.06 : 0)}deg) scale(${t.s})`;
  const k = t.s <= 1.02 ? Math.max(-1, Math.min(1, t.x / 120)) : 0;
  el.querySelector(".like").style.opacity = Math.max(0, k);
  el.querySelector(".nope").style.opacity = Math.max(0, -k);
}

function fling(dir) {
  const el = topCard();
  if (!el) return;
  el.classList.add("anim");
  t.x = dir * innerWidth * 1.1;
  t.y += 40;
  paint(el);
  el.style.opacity = 0;
  counts[dir > 0 ? "like" : "nope"]++;
  document.getElementById("nLike").textContent = counts.like;
  document.getElementById("nNope").textContent = counts.nope;
  setTimeout(() => { el.remove(); restack(); }, 330);
}

// One manager on the stack; gestures always act on the current top card.
const mc = new Hammer.Manager(stack);
const pan = new Hammer.Pan({ threshold: 2, pointers: 0 });
const swipe = new Hammer.Swipe({ velocity: 0.4 });
const pinch = new Hammer.Pinch();
const rotate = new Hammer.Rotate();
const dtap = new Hammer.Tap({ event: "doubletap", taps: 2 });
const press = new Hammer.Press({ time: 450 });
swipe.recognizeWith(pan);
pinch.recognizeWith(rotate);
pan.recognizeWith([pinch, rotate]);
mc.add([pan, swipe, rotate, pinch, dtap, press]);

mc.on("panstart pinchstart rotatestart", () => {
  const el = topCard();
  if (!el) return;
  el.classList.remove("anim");
  base = { ...t };
});
mc.on("panmove", (e) => {
  const el = topCard();
  if (!el) return;
  flash("pan");
  t.x = base.x + e.deltaX;
  t.y = base.y + e.deltaY;
  paint(el);
});
mc.on("pinchmove", (e) => { const el = topCard(); if (!el) return; flash("pinch"); t.s = Math.max(0.6, Math.min(3, base.s * e.scale)); paint(el); });
mc.on("rotatemove", (e) => { const el = topCard(); if (!el) return; flash("rotate"); t.r = base.r + e.rotation; paint(el); });
mc.on("swipeleft swiperight", (e) => flash("swipe"));
mc.on("panend pancancel pinchend rotateend", (e) => {
  const el = topCard();
  if (!el || e.type !== "panend" && e.type !== "pancancel") return;
  const zoomed = t.s > 1.02;
  if (!zoomed && (Math.abs(t.x) > stack.offsetWidth * 0.35 || Math.abs(e.velocityX) > 0.6)) {
    fling(Math.sign(t.x || e.velocityX));
  } else if (!zoomed) {
    el.classList.add("anim");
    t = { x: 0, y: 0, s: 1, r: 0 };
    paint(el);
  }
});
mc.on("doubletap", () => {
  const el = topCard();
  if (!el) return;
  flash("doubletap");
  el.classList.add("anim");
  t = t.s > 1.02 ? { x: 0, y: 0, s: 1, r: 0 } : { x: 0, y: 0, s: 1.8, r: 0 };
  paint(el);
});
mc.on("press", () => {
  const el = topCard();
  if (!el) return;
  flash("press");
  const info = el.querySelector(".info");
  info.classList.add("show");
  setTimeout(() => info.classList.remove("show"), 1600);
});

document.getElementById("bLike").onclick = () => fling(1);
document.getElementById("bNope").onclick = () => fling(-1);
document.getElementById("bReset").onclick = () => { counts.like = counts.nope = 0; nLike.textContent = nNope.textContent = 0; build(); };
build();
</script>
</body>
</html>
