const DPR = Math.min(2, window.devicePixelRatio || 1);
const fmt = Showcase.fmt;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const GRAD = { 0.15: "#4cc9f0", 0.4: "#7bd389", 0.65: "#f7df1e", 0.85: "#ff8c42", 1: "#f72585" };
const THERMAL = { 0.05: "#1b2a7a", 0.3: "#1f8fd1", 0.5: "#35c98a", 0.7: "#f2d53c", 0.85: "#f28c28", 1: "#e8352f" };

// Seeded LCG with gaussian and weighted-pick helpers, so simulated data is the same on every visit.
function rng(seed) {
  let s = seed >>> 0;
  const r = () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
  r.gauss = () => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); };
  r.pick = (ws) => { let p = r() * ws.reduce((a, b) => a + b, 0); const i = ws.findIndex((w) => (p -= w) < 0); return i < 0 ? ws.length - 1 : i; };
  return r;
}
const RND = rng(Math.random() * 4294967296);

// heatmap.js reads its shadow canvas back on every render without willReadFrequently,
// which makes Chrome log a performance warning; pass the flag while the instance is built.
function makeHeat(container, cfg) {
  const orig = HTMLCanvasElement.prototype.getContext;
  HTMLCanvasElement.prototype.getContext = function (type, opts) {
    return orig.call(this, type, type === "2d" ? { ...opts, willReadFrequently: true } : opts);
  };
  try { return h337.create({ container, ...cfg }); }
  finally { HTMLCanvasElement.prototype.getContext = orig; }
}

// CSS version of a heatmap.js gradient, drawn over a checkerboard so alpha stays visible.
function gradCss(g) {
  const stops = Object.keys(g).map(Number).sort((a, b) => a - b).map((k) => `${g[k]} ${(k * 100).toFixed(1)}%`);
  return `linear-gradient(90deg, transparent 0%, ${stops.join(", ")}), repeating-conic-gradient(#5a5a5a 0 25%, #2c2c2c 0 50%) 0 0 / 8px 8px`;
}

// Legend row fed by onExtremaChange: min, gradient bar, max, plus a free-form extra slot.
function legendRow(el, format = (v) => fmt(v)) {
  el.innerHTML = `<span class="hm-num">0</span><i class="hm-bar"></i><span class="hm-num">0</span><span></span>`;
  const [lo, bar, hi, extra] = el.children;
  return { extra, update(d) { lo.textContent = format(d.min); hi.textContent = format(d.max); bar.style.background = gradCss(d.gradient); } };
}

// Rebuild when an element's box changes. Unlike ctx.onResize this also catches the control bar
// settling after mount, so a heatmap is never created at a stale size.
function onBox(ctx, el, fn) {
  let pending = 0, lw = -1, lh = -1;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      const w = el.clientWidth, h = el.clientHeight;
      if (w === lw && h === lh) return;
      lw = w; lh = h;
      if (w > 0 && h > 0) fn();
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); });
}

// Busiest grid cell (summed values) times k: a max that saturates only the real hotspots.
function peakCount(pts, cell, k = 0.6) {
  const m = new Map();
  let best = 1;
  for (const p of pts) {
    const key = Math.floor(p.x / cell) * 8192 + Math.floor(p.y / cell);
    const n = (m.get(key) || 0) + (p.value || 1);
    m.set(key, n);
    if (n > best) best = n;
  }
  return Math.max(2, Math.round(best * k));
}

const rel = (el, host) => { const a = el.getBoundingClientRect(), b = host.getBoundingClientRect(); return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height }; };
function tipAt(tip, host, x, y, text) {
  tip.style.display = "block"; tip.style.left = `${x}px`; tip.style.top = `${y}px`; tip.textContent = text;
  tip.classList.toggle("flip", x > host.clientWidth - 190);
}

// One list of position pings [u, v, zone] per minute from 10:00 to 18:00; zone -1 marks aisle traces.
function makeDay() {
  const r = rng(20241012), mins = [];
  for (let m = 0; m < 480; m++) {
    const crowd = 5 + 9 * Math.pow(Math.sin((m / 480) * Math.PI), 0.7) + 7 * Math.exp(-(((m - 240) / 35) ** 2));
    const ws = FLOOR.map((z) => z[7] + z[8].reduce((s, [c, w, k]) => s + k * Math.exp(-(((m - c) / w) ** 2)), 0));
    const list = [];
    for (let i = 0, n = Math.round(crowd * (0.7 + r() * 0.6)); i < n; i++) {
      const zi = r.pick(ws), z = FLOOR[zi];
      const u = (z[3] + z[5] / 2 + r.gauss() * z[5] * 0.22) / 100, v = (z[4] + z[6] / 2 + r.gauss() * z[6] * 0.22) / 100;
      list.push([u, v, zi]);
      if (r() < 0.4) { const t = r(); list.push([0.51 + (u - 0.51) * t + r.gauss() * 0.012, 0.93 + (v - 0.93) * t + r.gauss() * 0.015, -1]); }
    }
    mins.push(list);
  }
  return mins;
}

        heat.setData({ min: 0, max: peakCount(data, radius, 0.55), data });
        label();
      }
      ctx.group(PRESETS.map((p) => p[0]), 0, (i) => { gi = i; apply({ gradient: PRESETS[i][1] }); });
      const maxIn = ctx.slider("maxOpacity", { min: 0.1, max: 1, step: 0.05, value: cfg.maxOpacity }, (v) => apply({ maxOpacity: v }));
      const minIn = ctx.slider("minOpacity", { min: 0, max: 0.6, step: 0.05, value: cfg.minOpacity }, (v) => apply({ minOpacity: v }));
      ctx.toggle("色階透明度", false, (v) => { maxIn.disabled = minIn.disabled = v; apply({ useGradientOpacity: v }); });
      onBox(ctx, city, build);
    },
  },
  {
    id: "thermal", title: "機房溫度",
    api: "h337.create({ xField, yField, valueField }) + setDataMin／setDataMax",
    desc: "感測器網格回報溫度，資料欄位用自訂的 cx、cy、celsius，setData() 的 min 與 max 就是色階的溫度區間。熱圖是逐點疊加而非內插，游標處同時顯示 getValueAt() 讀回的熱圖值與最近感測器的實測值。",
    hint: "點機櫃切換負載・拖曳「冷氣」・調整色階上下限",
    mount(ctx) {
      ctx.html(`<div class="hm-fill"><div class="hm-room">${layer}<canvas class="hm-ov"></canvas><div class="hm-racks"></div><div class="hm-crac">冷氣</div><div class="hm-tip"></div></div><div class="hm-legend"></div></div>`);
      const room = ctx.$(".hm-room"), box = ctx.$(".hm-layer > div"), ov = ctx.$(".hm-ov"), og = ov.getContext("2d");
      const rackBox = ctx.$(".hm-racks"), crac = ctx.$(".hm-crac"), tip = ctx.$(".hm-tip");
      const lg = legendRow(ctx.$(".hm-legend"), (v) => `${v}°C`);
      const LOADS = [[0.12, "待機", "#7bd389"], [0.55, "中", "#f7df1e"], [1, "滿載", "#ff5d5d"]];
      const load = [2, 1, 0, 2, 1, 1, 0, 1, 2, 2, 0, 1], ac = { u: 0.5, v: 0.5 };
      let W = 0, H = 0, racks = [], sensors = [], grid = null, heat = null, lo = 18, hi = 38, drag = false;
      const placeAc = () => { crac.style.left = `${ac.u * 100}%`; crac.style.top = `${ac.v * 100}%`; };
      const paintRacks = () => rackBox.querySelectorAll(".hm-rack").forEach((b) => {
        const [, name, c] = LOADS[load[+b.dataset.k]];
        b.style.setProperty("--led", c);
        b.lastElementChild.textContent = name;
      });
      // Steady-state model: ambient + heat plume per rack (scaled by load) - cooling around the AC unit.
      function target(x, y, t) {
        let T = 21;
        const sig = Math.max(racks[0].w, H * 0.12) * 1.1;
        for (const r of racks) {
          const L = LOADS[load[r.k]][0] * (1 + 0.08 * Math.sin(t * 0.0012 + r.k));
          T += L * 17 * Math.exp(-((x - r.x) ** 2 + (y - r.y) ** 2) / (sig * sig));
        }
        const R = Math.min(W, H) * 0.32;
        return T - 9 * Math.exp(-((x - ac.u * W) ** 2 + (y - ac.v * H) ** 2) / (R * R));
      }
      function build() {
        W = room.clientWidth; H = room.clientHeight;
        const per = W < 480 ? 4 : 6, rw = Math.min(70, ((W * 0.76) / per) * 0.62), rh = Math.min(90, H * 0.17);
        racks = [];
        for (let row = 0; row < 2; row++) for (let i = 0; i < per; i++) racks.push({ x: W * (0.12 + (0.76 * (i + 0.5)) / per), y: H * (row ? 0.72 : 0.28), w: rw, k: row * 6 + i });
        rackBox.innerHTML = racks.map((r, i) => `<button class="hm-rack" type="button" data-k="${r.k}" aria-label="切換機櫃負載" style="left:${r.x - rw / 2}px;top:${r.y - rh / 2}px;width:${rw}px;height:${rh}px"><i></i><b>R${i + 1}</b><span></span></button>`).join("");
        paintRacks();
        const s = clamp(Math.min(W, H) / 9, 26, 60), cols = Math.max(3, Math.round(W / s)), rows = Math.max(3, Math.round(H / s));
        grid = { sx: W / cols, sy: H / rows, cols, rows };
        sensors = [];
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const cx = Math.round((c + 0.5) * grid.sx), cy = Math.round((r + 0.5) * grid.sy);
          sensors.push({ cx, cy, celsius: target(cx, cy, 0) });
        }
        box.innerHTML = "";
        heat = makeHeat(box, { radius: Math.round(Math.max(grid.sx, grid.sy) * 1.05), blur: 1, maxOpacity: 0.8, minOpacity: 0.3, gradient: THERMAL, xField: "cx", yField: "cy", valueField: "celsius", onExtremaChange: lg.update });
        ov.width = Math.round(W * DPR); ov.height = Math.round(H * DPR);
        step(performance.now(), 0);
      }
      function step(t, k) {
        let sum = 0, hot = sensors[0];
        for (const p of sensors) { p.celsius += (target(p.cx, p.cy, t) - p.celsius) * k; sum += p.celsius; if (p.celsius > hot.celsius) hot = p; }
        heat.setData({ min: lo, max: hi, data: sensors });
        og.setTransform(DPR, 0, 0, DPR, 0, 0);
        og.clearRect(0, 0, W, H);
        og.fillStyle = "rgba(255,255,255,.35)";
        for (const p of sensors) og.fillRect(p.cx - 1, p.cy - 1, 2, 2);
        lg.extra.innerHTML = `・平均 <b class="hm-num">${(sum / sensors.length).toFixed(1)}°C</b>・最高 <b class="hm-num">${hot.celsius.toFixed(1)}°C</b>・感測器 <b class="hm-num">${sensors.length}</b>`;
      }
      ctx.slider("下限", { min: 10, max: 30, step: 1, value: lo, format: (v) => `${v}°C` }, (v) => { lo = v; heat && heat.setDataMin(lo); });
      ctx.slider("上限", { min: 32, max: 60, step: 1, value: hi, format: (v) => `${v}°C` }, (v) => { hi = v; heat && heat.setDataMax(hi); });
      ctx.interval(() => heat && step(performance.now(), 0.08), 90);
      ctx.on(rackBox, "click", (e) => { const b = e.target.closest(".hm-rack"); if (b) { load[+b.dataset.k] = (load[+b.dataset.k] + 1) % 3; paintRacks(); } });
      ctx.on(crac, "pointerdown", (e) => { drag = true; room.setPointerCapture(e.pointerId); crac.style.cursor = "grabbing"; e.preventDefault(); });
      ctx.on(room, "pointerup", () => { drag = false; crac.style.cursor = ""; });
      ctx.on(room, "pointermove", (e) => {
        const r = room.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
        if (drag) { ac.u = clamp(x / W, 0.04, 0.96); ac.v = clamp(y / H, 0.05, 0.95); placeAc(); tip.style.display = "none"; return; }
        if (!heat) return;
        const near = sensors[clamp(Math.floor(y / grid.sy), 0, grid.rows - 1) * grid.cols + clamp(Math.floor(x / grid.sx), 0, grid.cols - 1)];
        tipAt(tip, room, x, y, `熱圖讀值 ≈ ${lo + heat.getValueAt({ x: Math.round(x), y: Math.round(y) })}°C・最近感測器 ${near.celsius.toFixed(1)}°C`);
      });
      ctx.on(room, "pointerleave", () => { tip.style.display = "none"; });
      placeAc();
      onBox(ctx, room, build);
    },
  },
  {
    id: "ab", title: "A/B 版面比較",
    api: "兩個 h337 實例 + setDataMax(max) 共用色階",
    desc: "同一商品頁的兩個版本各配一個熱力圖（模擬點擊）。各自色階時兩邊都會「看起來很熱」；開啟共用色階後兩邊用同一個 max，才能直接比較：B 版把購買按鈕放大上移，點擊明顯集中過去。",
    hint: "開關「共用色階」比較差異・「重新抽樣」換一批訪客",
    mount(ctx) {
      ctx.html(`<div class="hm-fill"><div class="hm-ab">${["A", "B"].map((v) => `<div class="hm-abcol" data-v="${v}"><div class="hm-abhead"></div><div class="hm-shop">${shop(v)}${layer}</div></div>`).join("")}</div></div>`);
      const ab = ctx.$(".hm-ab");
      let seed = 11, clicks = null, panes = [], shared = true;
      function sample() {
        const r = rng(seed++);
        clicks = {};
        for (const [id, { visitors, w }] of Object.entries(AB)) {
          const list = (clicks[id] = []);
          for (let i = 0; i < visitors; i++) for (let j = 0, n = r() < 0.35 ? 2 : 1; j < n; j++) list.push([r.pick(w), r.gauss() * 0.15, r.gauss() * 0.15]);
        }
      }
      function build() {
        panes = Object.keys(AB).map((id) => {
          const col = ctx.$(`[data-v="${id}"]`), page = col.querySelector(".hm-shop");
          const W = page.clientWidth, H = page.clientHeight, els = {};
          page.querySelectorAll("[data-k]").forEach((e) => { els[e.dataset.k] = rel(e, page); });
          const data = [];
          for (const [k, gx, gy] of clicks[id]) {
            const r = els[k];
            if (r && r.w) data.push({ x: Math.round(clamp(r.x + r.w * (0.5 + gx), 0, W - 1)), y: Math.round(clamp(r.y + r.h * (0.5 + gy), 0, H - 1)), value: 1 });
          }
          const radius = Math.max(14, Math.round(W * 0.06)), box = page.querySelector(".hm-layer > div");
          box.innerHTML = "";
          const heat = makeHeat(box, { radius, gradient: GRAD, maxOpacity: 0.8 });
          return { id, heat, data, own: peakCount(data, radius, 0.4), cta: clicks[id].filter((c) => c[0] === 6).length, head: col.querySelector(".hm-abhead") };
        });
        apply(true);
      }
      function apply(first) {
        const top = Math.max(...panes.map((p) => p.own));
        for (const p of panes) {
          const max = shared ? top : p.own, n = AB[p.id].visitors;
          if (first) p.heat.setData({ min: 0, max, data: p.data }); else p.heat.setDataMax(max);
          p.head.innerHTML = `<b>${p.id} 版</b>・<span class="hm-num">${n}</span> 人・購買 <span class="hm-num">${p.cta}</span> 次（${Math.round((p.cta / n) * 100)}%）・max <span class="hm-num">${max}</span>${shared ? "（共用）" : "（各自）"}`;
        }
      }
      sample();
      ctx.toggle("共用色階", true, (v) => { shared = v; if (panes.length) apply(false); });
      ctx.button("重新抽樣", () => { sample(); build(); });
      onBox(ctx, ab, build);
    },
  },
  {
    id: "gaze", title: "視線追蹤",
    api: "addData({ x, y, value, radius }) + getDataURL()",
    desc: "模擬眼動儀的注視點：停留越久 value 越大、radius 也越大，逐點 addData() 累積。「聚光燈」把 getDataURL() 產生的 PNG 當 CSS 遮罩，只露出被看過的地方；匯出把照片與熱圖合成為可下載的 PNG。",
    hint: "切換照片（再點一次重錄）・切換聚光燈・按「匯出 PNG」",
    mount(ctx) {
      ctx.html(`<div class="hm-fill"><div class="hm-eye"><div class="hm-frame"><img class="base" alt=""><img class="spot" alt="">${layer}<i class="hm-gaze"></i><span class="hm-tag"></span></div></div><div class="hm-strip"><span>匯出的 PNG 會出現在這裡，點一下即可下載</span></div></div>`);
      const eye = ctx.$(".hm-eye"), frame = ctx.$(".hm-frame"), base = ctx.$(".base"), spot = ctx.$(".spot");
      const box = ctx.$(".hm-layer > div"), gaze = ctx.$(".hm-gaze"), tag = ctx.$(".hm-tag"), strip = ctx.$(".hm-strip");
      const FIXN = 40, MAXV = 24, urls = [];
      let pi = 0, spotOn = false, heat = null, fix = [], run = 0, W = 0, H = 0, shots = 0, started = false;
      const R = () => Math.max(10, Math.round(W * 0.045));
      const toPt = (f) => ({ x: Math.round(f.u * W), y: Math.round(f.v * H), value: f.value, radius: Math.round(R() * f.rk) });
      const mask = () => {
        if (!spotOn || !heat) return;
        const u = `url(${heat.getDataURL()})`;
        spot.style.webkitMaskImage = u; spot.style.maskImage = u;
      };
      function layout() {
        const w = Math.min(eye.clientWidth, eye.clientHeight * 1.5);
        W = Math.round(w); H = Math.round(w / 1.5);
        frame.style.width = `${W}px`; frame.style.height = `${H}px`;
        box.innerHTML = "";
        heat = makeHeat(box, { radius: R(), maxOpacity: 0.75, blur: 0.85, gradient: GRAD });
        heat.setData({ min: 0, max: MAXV, data: fix.map(toPt) });
        mask();
        if (!started) { started = true; start(); }
      }
      function setPhoto(i) {
        pi = i;
        base.src = spot.src = `_shared/img/${PHOTOS[i][1]}.jpg`;
      }
      async function record() {
        const id = ++run, aois = PHOTOS[pi][2], ws = aois.map((a) => a[3]);
        fix = [];
        heat.setData({ min: 0, max: MAXV, data: [] });
        mask();
        for (let i = 0; i < FIXN; i++) {
          const a = aois[RND.pick(ws)], free = RND() < 0.15;
          const u = free ? 0.08 + RND() * 0.84 : clamp(a[0] + RND.gauss() * a[2], 0.01, 0.99);
          const v = free ? 0.08 + RND() * 0.84 : clamp(a[1] + RND.gauss() * a[2] * 1.2, 0.01, 0.99);
          gaze.style.transform = `translate(${u * W}px, ${v * H}px)`;
          await ctx.sleep(80);
          const dur = 120 + RND() * 600;
          gaze.classList.add("dwell");
          await ctx.sleep(dur * 0.5);
          gaze.classList.remove("dwell");
          if (id !== run) return;
          const f = { u, v, value: Math.round(dur / 60), rk: 0.6 + dur / 900 };
          fix.push(f);
          heat.addData(toPt(f));
          mask();
          tag.textContent = `注視 ${fix.length}／${FIXN}・停留 ${Math.round(dur)} ms`;
        }
        tag.textContent = `完成 ${FIXN} 次注視・已自動匯出`;
        await exportPng();
      }
      const start = () => record().catch((e) => { if (e.name !== "AbortError") console.error(e); });
      async function exportPng() {
        const c = document.createElement("canvas");
        c.width = W; c.height = H;
        const g = c.getContext("2d");
        await base.decode();
        g.drawImage(base, 0, 0, W, H);
        const im = new Image();
        im.src = heat.getDataURL();
        await im.decode();
        g.drawImage(im, 0, 0);
        const blob = await new Promise((res) => c.toBlob(res, "image/png"));
        if (!ctx.active || !blob) return;
        const url = URL.createObjectURL(blob), name = `視線熱圖-${PHOTOS[pi][0]}-${++shots}.png`;
        urls.push(url);
        strip.querySelector("span")?.remove();
        const links = strip.querySelectorAll("a");
        if (links.length >= 3) { URL.revokeObjectURL(links[0].href); links[0].remove(); }
        strip.append(Showcase.h("a", { href: url, download: name, title: `下載 ${name}` },
          Showcase.h("img", { src: url, alt: "" }), Showcase.h("span", { text: `${PHOTOS[pi][0]}・${Math.round(blob.size / 1024)} KB` })));
      }
      ctx.onCleanup(() => urls.forEach((u) => URL.revokeObjectURL(u)));
      ctx.group(PHOTOS.map((p) => p[0]), 0, (i) => { setPhoto(i); if (heat) start(); });
      ctx.group(["熱區", "聚光燈"], 0, (i) => { spotOn = i === 1; frame.classList.toggle("on", spotOn); mask(); });
      ctx.button("匯出 PNG", () => heat && exportPng().catch((e) => { if (e.name !== "AbortError") console.error(e); }));
      setPhoto(0);
      onBox(ctx, eye, layout);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "每格 setData({ min, max, data: N 點 })",
    desc: "N 個粒子沿流場移動，每格用 setData() 整批重畫。每個點都要在影子 canvas 疊一次漸層模板，再把整個範圍 getImageData 依 alpha 查色階上色，所以耗時隨點數與半徑一起上升。",
    hint: "按「自動加壓」・切換半徑比較",
    mount(ctx) {
      ctx.html(`<div class="hm-stress">${layer}</div>`);
      const host = ctx.$(".hm-stress"), box = ctx.$(".hm-layer > div"), RADII = [10, 25, 50];
      let R = 25, pts = [], heat = null, W = 0, H = 0, ms = 0;
      function build() {
        const nw = host.clientWidth, nh = host.clientHeight;
        for (const p of pts) { p.fx = W ? (p.fx * nw) / W : RND() * nw; p.fy = H ? (p.fy * nh) / H : RND() * nh; }
        W = nw; H = nh;
        box.innerHTML = "";
        heat = makeHeat(box, { radius: R, gradient: GRAD, maxOpacity: 0.85, blur: 0.85 });
      }
      function setCount(n) {
        while (pts.length < n) pts.push({ fx: RND() * W, fy: RND() * H, x: 0, y: 0, value: 1, radius: R });
        pts.length = n;
      }
      ctx.group(RADII.map((r) => `半徑 ${r}`), 1, (i) => { R = RADII[i]; for (const p of pts) p.radius = R; });
      ctx.controls.classList.add("bottom");
      ctx.raf((t, dt) => {
        if (!heat) return;
        const k = (dt / 1000) * 60, s = t / 1000;
        for (const p of pts) {
          const a = Math.sin(p.fx * 0.006 + s * 0.4) * 2.2 + Math.cos(p.fy * 0.008 - s * 0.3) * 2.2;
          p.fx += Math.cos(a) * k; p.fy += Math.sin(a) * k;
          if (p.fx < 0) p.fx += W; else if (p.fx >= W) p.fx -= W;
          if (p.fy < 0) p.fy += H; else if (p.fy >= H) p.fy -= H;
          p.x = p.fx | 0; p.y = p.fy | 0;
        }
        // Scale max with the expected overlap so color still separates dense and sparse areas.
        const max = Math.max(2, ((pts.length * Math.PI * R * R) / (W * H)) * 1.5);
        const t0 = performance.now();
        heat.setData({ min: 0, max, data: pts });
        const d = performance.now() - t0;
        ms = ms ? ms * 0.85 + d * 0.15 : d;
      });
      ctx.ramp({
        label: "資料點", unit: "點", steps: [250, 500, 1000, 2000, 4000, 8000, 16000, 32000, 64000], minFps: 30,
        apply: (n) => setCount(n),
        metrics: () => ({ "setData 耗時": `${ms.toFixed(1)} ms`, "半徑": `${R} px` }),
        note: "移動中的點只能整批 setData()，addData() 只能累加。點數決定疊模板（drawImage）的次數，半徑決定每次填多少像素，畫布越大上色（getImageData／putImageData）越慢。",
      });
      onBox(ctx, host, build);
    },
  },
] });
</script>
