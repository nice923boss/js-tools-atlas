<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>highlight.js 示範：自動偵測程式語言</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/styles/github-dark.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"使用官方 common 套件，內含 36 種常用語言"}</script>
<style>
  .app {
    position: fixed; inset: 0; padding: 12px 12px 46px; display: grid; gap: 10px;
    grid-template-columns: minmax(0, 1.5fr) minmax(220px, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .top .title { flex: none; font-weight: 700; font-size: 14px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 1px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips .btn { flex: none; padding: 6px 10px; font-size: 12px; font-family: var(--mono); }
  .pane { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #0d1117; }
  .tabbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; }
  .dots i:nth-child(3) { background: #28c840; }
  .badge { font: 700 12px var(--mono); padding: 3px 9px; border-radius: 999px; color: #0e1013; background: var(--accent); transition: background .25s; }
  .badge.none { background: var(--line); color: var(--muted); }
  .tabbar .sp { flex: 1; }
  .auto { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabbar .btn { padding: 5px 10px; font-size: 12px; }
  /* Overlay editor: a transparent textarea on top of the highlighted <pre>, same metrics */
  .code { position: relative; flex: 1 1 0; min-height: 0; }
  .code pre, .code textarea {
    position: absolute; inset: 0; margin: 0; padding: 14px 16px; border: 0;
    font: 13px/1.6 var(--mono); letter-spacing: 0; tab-size: 4; white-space: pre; word-wrap: normal;
    font-variant-ligatures: none;
  }
  .code pre { overflow: hidden; pointer-events: none; }
  .code pre code.hljs { display: block; padding: 0; background: none; overflow: visible; font: inherit; }
  .code textarea {
    resize: none; outline: none; background: transparent; color: transparent; caret-color: #f7df1e;
    overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent;
  }
  .code textarea::selection { background: rgba(247, 223, 30, .22); color: transparent; }
  .code textarea::placeholder { color: var(--muted); }
  .side { padding: 14px 16px; gap: 10px; background: var(--bg-2); }
  .label { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); }
  .result { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .result b { font-size: 26px; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { flex: none; text-align: right; color: var(--muted); font-size: 12px; }
  .score i { display: block; font: 700 26px/1.1 var(--mono); font-style: normal; color: var(--accent); }
  .lead { font-size: 12.5px; color: var(--muted); min-height: 1.6em; }
  .lead em { font-style: normal; color: var(--fg); }
  #ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
  #ranks li { display: grid; grid-template-columns: 92px 1fr 40px; align-items: center; gap: 8px; font-size: 12.5px; }
  #ranks li span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #ranks li .track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.06); overflow: hidden; }
  #ranks li .track i { display: block; height: 100%; border-radius: 4px; background: var(--c2); transition: width .3s; }
  #ranks li:first-child .track i { background: var(--accent); }
  #ranks li:first-child span { color: var(--fg); font-weight: 700; }
  #ranks li em { font: 12px var(--mono); font-style: normal; color: var(--muted); text-align: right; }
  #ranks li.empty { display: block; color: var(--muted); }
  .meta { margin-top: auto; font: 11.5px var(--mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 8px; }
  @media (max-width: 640px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; padding: 10px 10px 44px; gap: 8px; }
    .top .title { display: none; }
    .side { padding: 10px 12px; gap: 6px; }
    .result b, .score i { font-size: 20px; }
    .score { display: flex; align-items: baseline; gap: 4px; }
    .score i { display: inline; }
    #ranks { gap: 5px; }
    #ranks li { grid-template-columns: 80px 1fr 34px; }
    #ranks li:nth-child(n+4) { display: none; }
    .side .label, .meta, .auto { display: none; }
    .code pre, .code textarea { font-size: 12px; padding: 10px 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">貼上任何程式碼，自動判斷語言</span>
    <div class="chips" id="chips"></div>
  </div>
  <section class="pane">
    <div class="tabbar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="badge" id="badge">…</span>
      <span class="auto" id="auto"></span>
      <span class="sp"></span>
      <button class="btn" id="clear">清空</button>
    </div>
    <div class="code">
      <pre aria-hidden="true"><code class="hljs" id="hl"></code></pre>
      <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="程式碼輸入區" placeholder="在這裡貼上或輸入任何程式碼…"></textarea>
    </div>
  </section>
  <aside class="pane side">
    <div class="label">highlightAuto() 偵測結果</div>
    <div class="result"><b id="lang">…</b><span class="score"><i id="score">0</i>信心分數</span></div>
    <div class="lead" id="lead"></div>
    <div class="label">候選語言排行（relevance）</div>
    <ol id="ranks"></ol>
    <div class="meta" id="meta"></div>
  </aside>
</div>
<div class="hint">貼上任何程式碼，即時判斷語言與信心分數</div>

<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0/highlight.min.js"></script>
<script>
// highlight.js auto-detection: highlightAuto() scores every registered grammar and keeps the best "relevance".
const SAMPLES = {
  Python: `# 計算各縣市的報名人數（示意資料）
from collections import Counter

signups = [
    {"name": "小明", "city": "台北"},
    {"name": "阿華", "city": "台中"},
    {"name": "小美", "city": "台北"},
]

def top_cities(rows, n=3):
    counts = Counter(r["city"] for r in rows)
    return counts.most_common(n)

if __name__ == "__main__":
    for city, total in top_cities(signups):
        print(f"{city}: {total} 人")
`,
  JavaScript: `// 監看捲動，元素進入畫面時淡入
const observer = new IntersectionObserver((entries) => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    entry.target.classList.add("is-visible");
    observer.unobserve(entry.target);
  }
}, { threshold: 0.2 });

document.querySelectorAll(".card").forEach((el) => {
  observer.observe(el);
});

export const fadeIn = async (selector) => {
  await document.fonts.ready;
  console.log(\`準備好了：\${selector}\`);
};
`,
  Rust: `// 找出座位數最多的課程
#[derive(Debug)]
struct Course {
    name: String,
    seats: u32,
}

fn busiest(courses: &[Course]) -> Option<&Course> {
    courses.iter().max_by_key(|c| c.seats)
}

fn main() {
    let list = vec![
        Course { name: String::from("JS 入門"), seats: 42 },
        Course { name: String::from("Rust 實戰"), seats: 28 },
    ];
    if let Some(c) = busiest(&list) {
        println!("{} 最熱門：{} 人", c.name, c.seats);
    }
}
`,
  Go: `// 平行抓取多個網址並回報狀態碼
package main

import (
	"fmt"
	"net/http"
	"sync"
)

func main() {
	urls := []string{"https://example.com", "https://go.dev"}
	var wg sync.WaitGroup
	for _, u := range urls {
		wg.Add(1)
		go func(url string) {
			defer wg.Done()
			resp, err := http.Get(url)
			if err != nil {
				fmt.Println("失敗：", err)
				return
			}
			fmt.Println(url, resp.StatusCode)
		}(u)
	}
	wg.Wait()
}
`,
  SQL: `-- 統計 2026 年各月份的課程營收（示意資料）
SELECT
  strftime('%m', o.created_at) AS month,
  c.title,
  COUNT(*)            AS orders,
  SUM(o.amount)       AS revenue
FROM orders AS o
JOIN courses AS c ON c.id = o.course_id
WHERE o.status = 'paid'
  AND o.created_at >= '2026-01-01'
GROUP BY month, c.title
HAVING revenue > 10000
ORDER BY month, revenue DESC
LIMIT 20;
`,
  CSS: `/* 卡片懸停時浮起並發光 */
.card {
  display: grid;
  gap: 12px;
  padding: 20px 24px;
  border-radius: 16px;
  background: linear-gradient(135deg, #4cc9f0 0%, #9d8cff 100%);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 32px rgba(76, 201, 240, 0.45);
}

@media (max-width: 600px) {
  .card { padding: 14px; }
}
`,
  Bash: `#!/usr/bin/env bash
# 每天凌晨備份網站並只保留最近 7 份
set -euo pipefail

SRC="/var/www/atlas"
DEST="$HOME/backups"
STAMP=$(date +%Y%m%d)

mkdir -p "$DEST"
tar -czf "$DEST/atlas-$STAMP.tar.gz" -C "$SRC" .

ls -1t "$DEST"/atlas-*.tar.gz | tail -n +8 | xargs -r rm --
echo "備份完成：atlas-$STAMP.tar.gz"
`,
  JSON: `{
  "name": "js-tools-atlas",
  "version": "1.4.0",
  "private": true,
  "scripts": {
    "dev": "vite",
    "build": "vite build",
    "preview": "vite preview --port 4173"
  },
  "dependencies": {
    "highlight.js": "^11.12.0"
  },
  "keywords": ["語法高亮", "教學", "示範"]
}
`,
};
const NAMES = Object.keys(SAMPLES);
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];

const $ = (id) => document.getElementById(id);
const src = $("src"), hl = $("hl");
const pre = hl.parentElement;
// Only grammars that take part in auto-detection (plaintext etc. opt out).
const CANDIDATES = hljs.listLanguages().filter((n) => hljs.autoDetection(n));
const NICE = { php: "PHP" };
const displayName = (id) => NICE[id] || (id && hljs.getLanguage(id) ? hljs.getLanguage(id).name : id);
const fmt = (n) => (Math.round(n * 10) / 10).toString();
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function colorFor(id) {
  let h = 0;
  for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
}

function analyze() {
  const code = src.value;
  const t0 = performance.now();
  const auto = hljs.highlightAuto(code, CANDIDATES);
  const ms = performance.now() - t0;
  hl.innerHTML = auto.value + (code.endsWith("\n") || !code ? " " : "");
  syncScroll();

  // Score every candidate the same way highlightAuto() does, to draw the leaderboard.
  const ranks = code.trim() ? CANDIDATES.map((id) => {
    const r = hljs.highlight(code, { language: id, ignoreIllegals: false });
    return { id, rel: r.illegal ? 0 : r.relevance };
  }).filter((r) => r.rel > 0).sort((a, b) => b.rel - a.rel).slice(0, 6) : [];

  const lang = auto.language;
  const badge = $("badge");
  badge.textContent = lang ? displayName(lang) : "未偵測";
  badge.classList.toggle("none", !lang);
  if (lang) badge.style.background = colorFor(lang);
  $("lang").textContent = lang ? displayName(lang) : "等待程式碼";
  $("score").textContent = fmt(auto.relevance || 0);

  const second = auto.secondBest;
  if (lang && second && second.language) {
    const gap = auto.relevance - second.relevance;
    $("lead").innerHTML = gap > 0
      ? `領先第二名 <em>${esc(displayName(second.language))}</em> ${fmt(gap)} 分`
      : `與 <em>${esc(displayName(second.language))}</em> 同分，依語言超集合規則判定`;
  } else {
    $("lead").textContent = lang ? "沒有其他候選語言" : "貼上程式碼後開始判斷";
  }

  const max = ranks.length ? ranks[0].rel : 1;
  $("ranks").innerHTML = ranks.length
    ? ranks.map((r) => `<li><span>${esc(displayName(r.id))}</span><span class="track"><i style="width:${Math.max(4, (r.rel / max) * 100)}%"></i></span><em>${fmt(r.rel)}</em></li>`).join("")
    : `<li class="empty">尚無候選</li>`;
  const lines = code ? code.replace(/\n$/, "").split("\n").length : 0;
  $("meta").textContent = `比對 ${CANDIDATES.length} 種語言・${ms.toFixed(1)} ms・${lines} 行`;

  for (const b of document.querySelectorAll("#chips .btn")) {
    b.setAttribute("aria-pressed", String(SAMPLES[b.dataset.name] === code));
  }
}

function syncScroll() {
  pre.scrollTop = src.scrollTop;
  pre.scrollLeft = src.scrollLeft;
}

let queued = false;
function schedule() {
  if (queued) return;
  queued = true;
  requestAnimationFrame(() => { queued = false; analyze(); });
}

src.addEventListener("input", schedule);
src.addEventListener("scroll", syncScroll);
src.addEventListener("keydown", (e) => {
  // Tab inserts two spaces instead of leaving the editor.
  if (e.key !== "Tab") return;
  e.preventDefault();
  src.setRangeText("  ", src.selectionStart, src.selectionEnd, "end");
  schedule();
});

// Sample chips
for (const name of NAMES) {
  const b = document.createElement("button");
  b.className = "btn";
  b.dataset.name = name;
  b.textContent = name;
  b.addEventListener("click", () => { stopAuto(); setCode(SAMPLES[name]); });
  $("chips").append(b);
}
function setCode(text) {
  src.value = text;
  src.scrollTop = 0;
  src.scrollLeft = 0;
  analyze();
}
$("clear").addEventListener("click", () => { stopAuto(); setCode(""); src.focus(); });

// Auto demo: type the next sample character by character so the guess visibly changes as code arrives.
let autoTimer = 0, autoOn = true, sampleIdx = 0;
function stopAuto() {
  if (!autoOn) return;
  autoOn = false;
  clearTimeout(autoTimer);
  $("auto").textContent = "";
}
function typeSample() {
  if (!autoOn) return;
  sampleIdx = (sampleIdx + 1) % NAMES.length;
  const text = SAMPLES[NAMES[sampleIdx]];
  $("auto").textContent = "自動示範中，點一下即可接手";
  let i = 0;
  src.value = "";
  const step = () => {
    if (!autoOn) return;
    i = Math.min(text.length, i + 3);
    src.value = text.slice(0, i);
    src.scrollTop = src.scrollHeight;
    analyze();
    if (i < text.length) autoTimer = setTimeout(step, 28);
    else autoTimer = setTimeout(typeSample, 3200);
  };
  step();
}
for (const ev of ["pointerdown", "keydown", "paste", "focus"]) src.addEventListener(ev, stopAuto);

setCode(SAMPLES[NAMES[0]]);
autoTimer = setTimeout(typeSample, 5000);
</script>
</body>
</html>
