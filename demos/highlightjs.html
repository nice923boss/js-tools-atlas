<script>
const CDN = "https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12.0";
// Snapshot of the common bundle: later scenes register extra grammars, scene 1 keeps comparing the same set.
const CANDIDATES = hljs.listLanguages().filter((n) => hljs.autoDetection(n));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt1 = (n) => (Math.round(n * 10) / 10).toString();
const nameOf = (id) => (id && hljs.getLanguage(id) ? hljs.getLanguage(id).name : id || "");
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const colorFor = (id) => { let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };

// Editable code area: a transparent <textarea> laid over a <pre> that receives the highlighted HTML.
function overlay(ctx, host, onInput, placeholder = "") {
  host.classList.add("hj-ov");
  host.innerHTML = `<pre aria-hidden="true"><code class="hljs"></code></pre><textarea spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="程式碼輸入區"></textarea>`;
  const ta = host.querySelector("textarea"), pre = host.querySelector("pre"), code = pre.firstChild;
  ta.placeholder = placeholder;
  const sync = () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; };
  ctx.on(ta, "scroll", sync);
  ctx.on(ta, "input", () => onInput(ta.value));
  ctx.on(ta, "keydown", (e) => {
    if (e.key !== "Tab") return;
    e.preventDefault();
    ta.setRangeText("  ", ta.selectionStart, ta.selectionEnd, "end");
    onInput(ta.value);
  });
  return {
    ta,
    paint(html) { code.innerHTML = html + (ta.value.endsWith("\n") || !ta.value ? " " : ""); sync(); },
    set(text) { ta.value = text; ta.scrollTop = 0; ta.scrollLeft = 0; onInput(text); },
  };
}
// Re-highlighting an element needs plain text and no data-highlighted flag, otherwise hljs skips or warns.
function resetBlock(el) { el.textContent = el.textContent; delete el.dataset.highlighted; }

    api: "hljs.configure({ cssSelector, classPrefix, languages })・hljs.highlightAll()・element.result",
    desc: "highlightAll() 掃描頁面上的程式碼區塊，依 class（language-*、lang-*、父元素 class）決定語言，沒標就自動偵測，nohighlight 會被略過。configure() 可以改 class 前綴與自動偵測的候選語言。",
    hint: "切換 class 前綴（tok- 時主題 CSS 失效，改用自訂配色）；限定候選語言看第三段結果改變",
    async mount(ctx) {
      ctx.html(`<div class="hj-fill">
        <section class="hj-pane"><div class="hj-doc">
          <p>① <code>&lt;code class="language-sql"&gt;</code> 明確指定</p>
          <pre><code class="language-sql">SELECT city, COUNT(*) FROM signups WHERE seats > 0 GROUP BY city;</code></pre>
          <p>② 寫在父元素 <code>&lt;pre class="lang-py"&gt;</code></p>
          <pre class="lang-py"><code>for city, n in counts.items():\n    print(f"{city}：{n} 人")  # 依城市</code></pre>
          <p>③ 沒有 class，交給自動偵測</p>
          <pre><code>for f in *.csv; do\n  echo "處理 $f"\ndone</code></pre>
          <p>④ <code>class="nohighlight"</code> 會被略過</p>
          <pre><code class="nohighlight">const raw = "這段保持原樣";</code></pre>
          <p>⑤ 別名 <code>language-yml</code></p>
          <pre><code class="language-yml">course: Python 入門\nseats: 30\nonline: true</code></pre>
        </div></section>
        <aside class="hj-pane side"><div class="hj-head">highlightAll() 之後<span class="sp"></span><code class="cfg"></code></div><ol class="hj-st"></ol></aside></div>`);
      ctx.$$(".hj-doc pre code").forEach((c) => (c.textContent = c.textContent.replace(/\\n/g, "\n")));
      const authored = ctx.$$(".hj-doc pre code").map((c) => c.className);
      const cfg = { cssSelector: ".hj-doc pre code", classPrefix: "hljs-", languages: null };
      ctx.onCleanup(() => hljs.configure({ cssSelector: "pre code", classPrefix: "hljs-", languages: null }));
      ctx.group(["hljs-", "tok-"], 0, (i, label) => { cfg.classPrefix = label; run(); });
      ctx.toggle("限定 JS／Python／SQL", false, (v) => { cfg.languages = v ? ["javascript", "python", "sql"] : null; run(); });
      ctx.button("highlightAll()", () => run(), { primary: true });
      function run() {
        const blocks = ctx.$$(".hj-doc pre code");
        // Restore the authored class so each run re-resolves the language from scratch.
        blocks.forEach((b, i) => { resetBlock(b); b.className = authored[i]; });
        hljs.configure(cfg);
        hljs.highlightAll();
        ctx.$(".cfg").textContent = `classPrefix "${cfg.classPrefix}"`;
        ctx.$(".hj-st").innerHTML = blocks.map((b, i) => {
          if (!b.dataset.highlighted) return `<li class="skip"><b>${"①②③④⑤"[i]} 略過</b><code>class="${esc(b.className)}"</code></li>`;
          const r = b.result, second = b.secondBest;
          return `<li><b>${"①②③④⑤"[i]} ${esc(nameOf(r.language))}</b>　相關度 <span class="hj-num">${r.relevance}</span>${second ? `，次佳 ${esc(nameOf(second.language))}` : ""}<code>class="${esc(b.className)}"</code><code>${esc(b.querySelector("span") ? b.querySelector("span").className : "")}…</code></li>`;
        }).join("");
      }
      run();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "hljs.highlight(code, { language })・hljs.highlightAuto(code)",
    desc: `從 16 KB 加到 4 MB 的程式碼，量 highlight() 產生 HTML 的耗時與每秒處理量；切到「自動偵測」時每一級都要用 ${CANDIDATES.length} 種可自動偵測的文法各跑一次。`,
    hint: "按「開始測試」逐級加大；可切換語言與是否含 DOM 插入",
    async mount(ctx) {
      ctx.html(`<div class="hj-stress"><section class="hj-pane"><div class="hj-head"><b>輸出預覽</b><span class="sp"></span><code class="info">尚未執行</code></div><div class="hj-body"><pre><code class="hljs"></code></pre></div></section></div>`);
      ctx.controls.classList.add("bottom");
      let mode = 0, dom = false;
      ctx.group(["JavaScript", "Python", "自動偵測"], 0, (i) => (mode = i));
      ctx.toggle("含 DOM 插入", false, (v) => (dom = v));
      const out = ctx.$("pre code");
      ctx.bench({
        label: "程式碼", unit: "KB", sizes: [16, 64, 256, 1024, 2048, 4096],
        prepare: (kb) => sizedText(mode === 1 ? BENCH_PY : BENCH_JS, kb),
        run: (kb, text) => {
          const t0 = performance.now();
          const r = mode === 2 ? hljs.highlightAuto(text, CANDIDATES) : hljs.highlight(text, { language: mode === 1 ? "python" : "javascript" });
          if (dom) { out.innerHTML = r.value; void out.offsetHeight; }
          const ms = performance.now() - t0;
          if (!dom) out.innerHTML = r.value.slice(0, r.value.indexOf("\n", 6000) + 1 || 6000);
          ctx.$(".info").textContent = `${nameOf(r.language)}・輸出 ${(r.value.length / 1048576).toFixed(1)} MB HTML`;
          return `${Showcase.fmt(Math.round(kb / (ms / 1000)))} KB/s`;
        },
        note: "耗時是 highlight() 由原始碼產生 HTML 字串的時間；開啟「含 DOM 插入」會再加上 innerHTML 解析與排版，通常比高亮本身更慢。自動偵測要逐一嘗試所有候選文法，所以慢上數十倍；實務上指定語言即可避開。",
      });
    },
  },
] });
</script>
</body>
</html>
