<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// hls.js showcase: ABR monitor, simulated bandwidth, event lanes, retries, tracks, live latency, support matrix, parser stress.
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim() || "sans-serif";
const MONO = css.getPropertyValue("--mono").trim() || "monospace";
const MUX = "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";
const MUX_SEG = "https://test-streams.mux.dev/x36xhzz/url_6/";
const ED = "https://playertest.longtailvideo.com/adaptive/elephants_dream_v4/index.m3u8";
const LV = [C[1], C[3], C[5], C[4], C[2]];
const ACTIONS = ["DoNothing", "SendEndCallback", "SendAlternateToPenaltyBox", "RemoveAlternatePermanently", "InsertDiscontinuity", "RetryRequest"];
const E = Hls.Events;
const kbps = (b) => (!b ? "-" : b >= 1e6 ? `${(b / 1e6).toFixed(1)} Mbps` : `${Math.round(b / 1e3)} kbps`);
const sec = (s) => (s == null || !isFinite(s) ? "-" : `${s.toFixed(1)} s`);
const clock = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const stats = (items, cls = "") => `<div class="hj-stats ${cls}">${items.map(([l, k]) => `<div><small>${l}</small><b data-s="${k}">-</b></div>`).join("")}</div>`;
const setS = (ctx, k, v) => { const el = ctx.$(`[data-s="${k}"]`); if (el && el.textContent !== String(v)) el.textContent = v; };

function fit(c) {
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, r.width, r.height);
  return [g, r.width, r.height];
}
function bufAhead(v) {
  const t = v.currentTime;
  for (let i = 0; i < v.buffered.length; i++) if (t >= v.buffered.start(i) - 0.2 && t <= v.buffered.end(i)) return v.buffered.end(i) - t;
  return 0;
}
function logger(box, max = 16) {
  return (msg, bad) => {
    const d = document.createElement("div");
    d.innerHTML = `${new Date().toLocaleTimeString("zh-TW", { hour12: false })} ${msg}`;
    if (bad) d.className = "bad";
    box.prepend(d);
    while (box.children.length > max) box.lastChild.remove();
  };
}
function mse(ctx) {
  if (Hls.isSupported()) return true;
  ctx.html(`<div class="hj-none"><b>此瀏覽器沒有 MediaSource Extensions</b><p>Hls.isSupported() 回傳 false，hls.js 無法運作。iOS Safari 可直接把 .m3u8 設給 video.src 原生播放，詳見「支援度偵測」場景。</p></div>`);
  return false;
}
// One replaceable Hls instance per scene; destroyed and detached on scene exit.
function slot(ctx, video) {
  const s = { hls: null };
  s.kill = () => { if (s.hls) { s.hls.destroy(); s.hls = null; } };
  s.start = (src, config, wire) => {
    s.kill();
    const hls = (s.hls = new Hls({ loader: SoftXhr, ...config }));
    wire && wire(hls);
    hls.on(E.MANIFEST_PARSED, () => video.play().catch(() => {}));
    hls.on(E.ERROR, (_, d) => {
      if (!d.fatal || s.hls !== hls) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
      else if (d.type === Hls.ErrorTypes.NETWORK_ERROR) ctx.timeout(() => s.hls === hls && hls.startLoad(), 1500);
    });
    hls.loadSource(src);
    hls.attachMedia(video);
    return hls;
  };
  ctx.onCleanup(() => { s.kill(); video.removeAttribute("src"); video.load(); });
  return s;
}
// XHR loader whose abort detaches the request instead of cancelling it: the download finishes in the
// background and is discarded, so switching scenes does not leave cancelled requests in the network log.
const SoftXhr = class extends Hls.DefaultConfig.loader {
  abortInternal() {
    const x = this.loader;
    clearTimeout(this.requestTimeout);
    clearTimeout(this.retryTimeout);
    if (x) { x.onreadystatechange = null; x.onprogress = null; if (x.readyState !== 4) this.stats.aborted = true; }
  }
};
// Playlist loader that answers selected URLs from memory (generated playlists); everything else goes to the network.
function memLoader(serve) {
  return class extends SoftXhr {
    load(context, config, callbacks) {
      const text = serve(context.url);
      if (text == null) return super.load(context, config, callbacks);
      const st = this.stats, now = performance.now();
      this.context = context;
      st.loading.start = st.loading.first = st.loading.end = now;
      st.loaded = st.total = text.length;
      this.hjT = setTimeout(() => callbacks.onSuccess({ url: context.url, data: text }, st, context, null), 0);
    }
    abort() { clearTimeout(this.hjT); super.abort(); }
    destroy() { clearTimeout(this.hjT); super.destroy(); }
  };
}
// Fragment loader hooks: cap() delays delivery to emulate a bandwidth ceiling (bits/s),
// fault() returns an HTTP status to fail the request with, attempt() observes every main-fragment request.
function fragLoader(hook) {
  return class extends SoftXhr {
    load(context, config, callbacks) {
      const main = context.frag && context.frag.type === "main";
      const code = main && hook.fault ? hook.fault() : null;
      if (code) {
        const st = this.stats;
        this.context = context;
        st.loading.start = performance.now();
        this.hjT = setTimeout(() => {
          st.loading.end = performance.now();
          hook.attempt && hook.attempt(context, code);
          callbacks.onError({ code, text: "模擬伺服器錯誤" }, context, null, st);
        }, 150);
        return;
      }
      const cap = main && hook.cap ? hook.cap() : 0;
      if (!main || (!cap && !hook.attempt)) return super.load(context, config, callbacks);
      const ok = callbacks.onSuccess;
      super.load(context, config, { ...callbacks, onSuccess: (resp, st, c, nd) => {
        hook.attempt && hook.attempt(c, 200);
        const wait = cap ? (st.loaded * 8 / cap) * 1000 - (performance.now() - st.loading.start) : 0;
        if (wait <= 0) return ok(resp, st, c, nd);
        this.hjT = setTimeout(() => { st.loading.end = performance.now(); ok(resp, st, c, nd); }, wait);
      } });
    }
    abort() { clearTimeout(this.hjT); super.abort(); }
    destroy() { clearTimeout(this.hjT); super.destroy(); }
  };
}
const vidHTML = (tags) => `<div class="hj-vid"><video muted playsinline></video><div class="hj-tags">${tags}</div></div>`;
function soundButtons(ctx, v) {
  const s = ctx.button("開啟聲音", () => { v.muted = !v.muted; s.textContent = v.muted ? "開啟聲音" : "靜音"; });
  const pp = ctx.button("暫停", () => (v.paused ? v.play().catch(() => {}) : v.pause()));
  ctx.on(v, "play", () => (pp.textContent = "暫停"));
  ctx.on(v, "pause", () => (pp.textContent = "播放"));
}

Showcase.run({ scenes: [
  {
    id: "monitor", title: "串流監控台",
    api: "new Hls(cfg).loadSource(url)；hls.currentLevel = i",
    desc: "多碼率串流從最低畫質起播，ABR 依頻寬逐級往上爬；下方時間軸用顏色標出每個片段是哪個畫質下載的，灰色是瀏覽器實際持有的緩衝。",
    hint: "點畫質層級手動鎖定，選「自動」交還給 ABR",
    mount(ctx) {
      if (!mse(ctx)) return;
      ctx.html(`<div class="hj-wrap"><div class="hj-main">${vidHTML(`<span class="on" data-s="lv">載入中</span><span data-s="bufTag">緩衝 0.0 秒</span>`)}
        <canvas class="hj-cv hj-tl"></canvas><div class="hj-legend hj-wide"></div></div>
        <div class="hj-side"><h3 class="hj-h">畫質層級（點選鎖定）</h3><div class="hj-list"></div>
        ${stats([["頻寬估計", "bw"], ["已下載片段", "n"], ["前方緩衝", "buf"], ["丟棄影格", "drop"]])}
        <div class="hj-wide hj-short"><h3 class="hj-h">頻寬估計變化</h3><canvas class="hj-cv hj-bw" style="height:46px"></canvas></div>
        <div class="hj-log hj-wide"></div></div></div>`);
      soundButtons(ctx, ctx.$("video"));
      const v = ctx.$("video"), log = logger(ctx.$(".hj-log")), frags = [], bwHist = [], box = ctx.$(".hj-list");
      let fragN = 0;
      const p = slot(ctx, v);
      const refresh = () => {
        const hls = p.hls, playing = hls.currentLevel, manual = hls.autoLevelEnabled ? -1 : hls.manualLevel;
        for (const b of box.children) {
          const i = +b.dataset.i;
          b.classList.toggle("sel", i === manual);
          b.classList.toggle("play", i === playing && i >= 0);
        }
        const lv = hls.levels[playing];
        setS(ctx, "lv", lv ? `${lv.height}p・${hls.autoLevelEnabled ? "自動" : "手動"}` : "載入中");
      };
      const hls = p.start(MUX, { startLevel: 0, maxBufferLength: 30, abrBandWidthFactor: 0.8, abrBandWidthUpFactor: 0.5 }, (h) => {
        h.on(E.MANIFEST_PARSED, (_, d) => {
          log(`<em>MANIFEST_PARSED</em> ${d.levels.length} 個畫質層級`);
          const order = d.levels.map((l, i) => ({ l, i })).sort((a, b) => b.l.height - a.l.height);
          box.innerHTML = `<button data-i="-1"><span>自動（ABR）</span></button>` +
            order.map(({ l, i }) => `<button data-i="${i}"><span>${l.height}p</span><small>${kbps(l.bitrate)}</small></button>`).join("");
          ctx.$(".hj-legend").innerHTML = order.map(({ l, i }) => `<span><i style="background:${LV[i % 5]}"></i>${l.height}p</span>`).join("") + `<span><i style="background:#ecebe6"></i>播放位置</span>`;
          refresh();
        });
        h.on(E.LEVEL_SWITCHED, (_, d) => { log(`<em>LEVEL_SWITCHED</em> 切到 ${h.levels[d.level].height}p`); refresh(); });
        h.on(E.FRAG_LOADED, (_, d) => {
          const f = d.frag;
          fragN++;
          frags.push({ a: f.start, b: f.start + f.duration, lv: f.level });
          log(`<em>FRAG_LOADED</em> #${f.sn} ${h.levels[f.level].height}p ${(f.stats.loaded / 1024).toFixed(0)} KB ${Math.round(f.stats.loading.end - f.stats.loading.start)} ms`);
        });
        h.on(E.FRAG_LOAD_EMERGENCY_ABORTED, (_, d) => log(`<em>EMERGENCY_ABORTED</em> 放棄 ${h.levels[d.frag.level].height}p 片段並降級`, true));
        h.on(E.ERROR, (_, d) => log(`<em>ERROR</em> ${d.details}${d.fatal ? "（致命）" : ""}`, true));
      });
      ctx.on(box, "click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const i = +b.dataset.i;
        hls.currentLevel = i;
        log(i < 0 ? "切回自動畫質選擇" : `手動鎖定 ${hls.levels[i].height}p，清除前方緩衝`);
        refresh();
      });
      ctx.interval(() => {
        const bw = hls.bandwidthEstimate;
        if (bw) { bwHist.push(bw); if (bwHist.length > 60) bwHist.shift(); }
        setS(ctx, "bw", kbps(bw));
        setS(ctx, "n", fragN);
        const q = v.getVideoPlaybackQuality && v.getVideoPlaybackQuality();
        setS(ctx, "drop", q ? q.droppedVideoFrames : "-");
        const c = ctx.$(".hj-bw");
        if (!c.offsetParent || bwHist.length < 2) return;
        const [g, w, h] = fit(c), max = Math.max(...bwHist) * 1.15;
        g.beginPath();
        bwHist.forEach((b, i) => { const x = (i / (bwHist.length - 1)) * w, y = h - (b / max) * (h - 4) - 2; i ? g.lineTo(x, y) : g.moveTo(x, y); });
        g.strokeStyle = C[0]; g.lineWidth = 2; g.stroke();
        g.lineTo(w, h); g.lineTo(0, h); g.fillStyle = "rgba(247,223,30,0.12)"; g.fill();
      }, 1000);
      ctx.raf(() => {
        const [g, w, h] = fit(ctx.$(".hj-tl"));
        const t = v.currentTime || 0, from = Math.max(0, t - 15), span = 60, x = (s) => ((s - from) / span) * w;
        g.fillStyle = "rgba(255,255,255,0.10)";
        for (let i = 0; i < v.buffered.length; i++) {
          const a = v.buffered.start(i), b = v.buffered.end(i);
          if (b > from && a < from + span) g.fillRect(x(a), 6, x(b) - x(a), h - 22);
        }
        for (const f of frags) {
          if (f.b < from || f.a > from + span) continue;
          g.fillStyle = LV[f.lv % 5];
          g.fillRect(x(f.a) + 1, h - 30, Math.max(2, x(f.b) - x(f.a) - 2), 12);
        }
        g.fillStyle = "#9b998f"; g.font = `10px ${MONO}`;
        for (let s = Math.ceil(from / 10) * 10; s <= from + span; s += 10) { g.fillRect(x(s), h - 14, 1, 4); g.fillText(clock(s), x(s) + 3, h - 4); }
        g.fillStyle = "#ecebe6"; g.fillRect(x(t) - 1, 2, 2, h - 18);
        const ahead = bufAhead(v);
        setS(ctx, "buf", sec(ahead));
        setS(ctx, "bufTag", `緩衝 ${ahead.toFixed(1)} 秒`);
      });
    },

        setS(ctx, "drift", h.drift != null ? h.drift.toFixed(2) : "-");
        setS(ctx, "rate", `${v.playbackRate.toFixed(2)}×`);
        setS(ctx, "date", pd ? pd.toLocaleTimeString("zh-TW", { hour12: false }) : "-");
        setS(ctx, "reloads", reloads);
        setS(ctx, "win", d && d.fragments.length ? `sn ${d.startSN}～${d.endSN}` : "-");
        setS(ctx, "buf", sec(bufAhead(v)));
      }, 300);
      ctx.raf(() => {
        const h = p.hls, d = h && h.latestLevelDetails;
        const [g, w, hh] = fit(ctx.$(".hj-live"));
        if (!d || !d.fragments.length) return;
        const edge = d.edge, from = edge - (WIN + 0.6) * SEG, to = edge + 4, x = (s) => 8 + ((s - from) / (to - from)) * (w - 16);
        g.font = `10px ${MONO}`;
        for (const f of d.fragments) {
          g.fillStyle = "rgba(76,201,240,0.18)"; g.fillRect(x(f.start) + 1, 8, x(f.start + f.duration) - x(f.start) - 2, 22);
          g.fillStyle = C[1]; g.fillText(`sn ${f.sn}`, x(f.start) + 4, 23);
        }
        g.fillStyle = "rgba(255,255,255,0.22)";
        for (let i = 0; i < v.buffered.length; i++) g.fillRect(x(Math.max(from, v.buffered.start(i))), 34, Math.max(0, x(v.buffered.end(i)) - x(Math.max(from, v.buffered.start(i)))), 8);
        const mark = (t, c, label, row) => {
          if (t == null || !isFinite(t)) return;
          g.fillStyle = c; g.fillRect(x(t) - 1, 6, 2, 42);
          g.font = `11px ${FONT}`; const tw = g.measureText(label).width;
          g.fillText(label, Math.min(w - tw - 4, Math.max(4, x(t) - tw / 2)), 60 + row * 14);
        };
        mark(edge, C[2], "直播邊緣", 0);
        mark(h.liveSyncPosition, C[3], "目標位置", 1);
        mark(v.currentTime, "#ecebe6", "播放頭", 0);
      });
    },
  },
  {
    id: "support", title: "支援度偵測",
    api: "Hls.isSupported()、Hls.isMSESupported()、Hls.getMediaSource()、MediaSource.isTypeSupported()",
    desc: "hls.js 只在有 MediaSource（或 iOS 17.1 起的 ManagedMediaSource）時才能運作；沒有時應改走 video 原生 HLS。下表是這個瀏覽器的實測結果，不是寫死的清單。",
    hint: "換個瀏覽器（Safari、Firefox、手機）開同一頁比較",
    mount(ctx) {
      ctx.el.classList.add("scroll");
      const ok = (b) => `<b class="${b ? "hj-ok" : "hj-no"}">${b ? "支援" : "不支援"}</b>`;
      const MS = Hls.getMediaSource && Hls.getMediaSource();
      const nativeHls = document.createElement("video").canPlayType("application/vnd.apple.mpegurl");
      const env = [
        ["Hls.version", `<b>${Hls.version}</b>`],
        ["Hls.isMSESupported()", ok(Hls.isMSESupported())],
        ["Hls.isSupported()", ok(Hls.isSupported())],
        ["Hls.getMediaSource()", `<b>${MS ? MS.name : "無"}</b>`],
        ["window.ManagedMediaSource", ok(!!window.ManagedMediaSource)],
        ["video.canPlayType(HLS)", `<b class="${nativeHls ? "hj-ok" : "hj-no"}">${nativeHls || "空字串"}</b>`],
      ];
      const codecs = [
        ["H.264 Baseline", 'video/mp4; codecs="avc1.42000d"'], ["H.264 Main", 'video/mp4; codecs="avc1.4d401f"'], ["H.264 High", 'video/mp4; codecs="avc1.640028"'],
        ["HEVC", 'video/mp4; codecs="hvc1.1.6.L93.B0"'], ["AV1", 'video/mp4; codecs="av01.0.05M.08"'], ["VP9", 'video/mp4; codecs="vp09.00.10.08"'],
        ["AAC-LC", 'audio/mp4; codecs="mp4a.40.2"'], ["HE-AAC", 'audio/mp4; codecs="mp4a.40.5"'], ["E-AC-3", 'audio/mp4; codecs="ec-3"'], ["Opus", 'audio/mp4; codecs="opus"'],
      ].map(([n, t]) => [`${n}<code>${t.split('"')[1]}</code>`, ok(MS ? MS.isTypeSupported(t) : false)]);
      const D = Hls.DefaultConfig;
      const cfg = [["maxBufferLength", `${D.maxBufferLength} s`], ["backBufferLength", `${D.backBufferLength}`], ["liveSyncDurationCount", D.liveSyncDurationCount],
        ["lowLatencyMode", D.lowLatencyMode], ["enableWorker", D.enableWorker], ["abrEwmaDefaultEstimate", kbps(D.abrEwmaDefaultEstimate)],
        ["abrBandWidthFactor", D.abrBandWidthFactor], ["capLevelToPlayerSize", D.capLevelToPlayerSize]].map(([k, val]) => [`<code>${k}</code>`, `<b>${val}</b>`]);
      const rows = (list) => list.map(([a, b]) => `<div class="hj-row"><span>${a}</span>${b}</div>`).join("");
      const advice = Hls.isSupported() ? "建議路徑：<b>使用 hls.js</b>（new Hls().attachMedia(video)），可取得 ABR、事件與錯誤控制。"
        : nativeHls ? "建議路徑：<b>原生播放</b>，直接 video.src = '….m3u8'，但拿不到 hls.js 的事件與層級控制。"
        : "建議路徑：<b>無法播放 HLS</b>，請提供 MP4 備援檔。";
      ctx.html(`<div class="hj-sup"><div class="panel hj-card"><h2>播放環境<small>本機實測</small></h2>${rows(env)}<div class="hj-advice">${advice}</div></div>
        <div class="panel hj-card"><h2>編碼支援<small>MediaSource.isTypeSupported</small></h2>${rows(codecs)}</div>
        <div class="panel hj-card"><h2>預設設定重點<small>Hls.DefaultConfig</small></h2>${rows(cfg)}</div></div>`);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new Hls({ pLoader }).loadSource(url) → LEVEL_LOADED",
    desc: "產生含 N 個片段的 VOD 媒體清單，交給 hls.js 的 M3U8 parser 解析成 Fragment 物件，量從 loadSource 到 LEVEL_LOADED 的時間（含建立實例與銷毀）。",
    hint: "按「開始測試」；開啟 PROGRAM-DATE-TIME 後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="hj-stress panel"><h3 class="hj-h">最近一次解析結果</h3>
        ${stats([["片段數", "frags"], ["總長度", "dur"], ["parser 耗時", "parse"], ["每萬片段", "per"], ["清單大小", "size"], ["PROGRAM-DATE-TIME", "pdt"]])}
        <h3 class="hj-h">各級距總耗時</h3><canvas class="hj-cv hj-bars"></canvas></div>`);
      let pdt = false, cur = null;
      const URL_ = "mem://bench/playlist.m3u8", hist = [];
      ctx.onCleanup(() => cur && cur.destroy());
      ctx.toggle("含 PROGRAM-DATE-TIME", false, (on) => (pdt = on));
      ctx.controls.classList.add("bottom");
      const draw = () => {
        const [g, w, h] = fit(ctx.$(".hj-bars"));
        if (!hist.length) { g.fillStyle = "#9b998f"; g.font = `12px ${FONT}`; g.fillText("按「開始測試」後顯示", 10, 22); return; }
        const max = Math.max(...hist.map((r) => r.ms)), bw = Math.min(70, (w - 20) / hist.length - 8);
        g.font = `10px ${MONO}`;
        hist.forEach((r, i) => {
          const bh = Math.max(2, (r.ms / max) * (h - 40)), x = 10 + i * (bw + 8);
          g.fillStyle = r.pdt ? C[5] : C[1]; g.fillRect(x, h - 18 - bh, bw, bh);
          g.fillStyle = "#ecebe6"; g.fillText(Showcase.fmtMs(r.ms), x, h - 22 - bh);
          g.fillStyle = "#9b998f"; g.fillText(Showcase.fmtCompact(r.n), x, h - 5);
        });
      };
      draw();
      ctx.onResize(draw);
      ctx.bench({
        label: "片段數", unit: "段", sizes: [1000, 5000, 20000, 50000, 100000, 250000, 500000, 1000000],
        prepare(n) {
          const t0 = Date.UTC(2026, 0, 1), parts = ["#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-TARGETDURATION:4\n#EXT-X-MEDIA-SEQUENCE:0\n#EXT-X-PLAYLIST-TYPE:VOD\n"];
          for (let i = 0; i < n; i++) parts.push(`${pdt ? `#EXT-X-PROGRAM-DATE-TIME:${new Date(t0 + i * 4000).toISOString()}\n` : ""}#EXTINF:4.000,\nseg-${i}.ts\n`);
          parts.push("#EXT-X-ENDLIST\n");
          return parts.join("");
        },
        async run(n, text) {
          const hls = (cur = new Hls({ loader: SoftXhr, autoStartLoad: false, enableWorker: false, pLoader: memLoader((u) => (u === URL_ ? text : null)) }));
          const d = await new Promise((res, rej) => {
            hls.on(E.LEVEL_LOADED, (_, data) => res(data));
            hls.on(E.ERROR, (_, data) => data.fatal && rej(new Error(data.details)));
            hls.loadSource(URL_);
          });
          hls.destroy();
          cur = null;
          const det = d.details, ps = d.stats.parsing, parse = ps.end > ps.start ? ps.end - ps.start : NaN;
          setS(ctx, "frags", Showcase.fmt(det.fragments.length));
          setS(ctx, "dur", `${(det.totalduration / 3600).toFixed(1)} 小時`);
          setS(ctx, "parse", isFinite(parse) ? Showcase.fmtMs(parse) : "-");
          setS(ctx, "per", isFinite(parse) ? Showcase.fmtMs(parse / n * 1e4) : "-");
          setS(ctx, "size", `${(text.length / 1048576).toFixed(1)} MB`);
          setS(ctx, "pdt", det.hasProgramDateTime ? "有" : "無");
          ctx.timeout(() => { hist.push({ n, ms: d.stats.parsing.end - d.stats.loading.start, pdt }); if (hist.length > 8) hist.shift(); draw(); }, 0);
          return isFinite(parse) ? `解析 ${Showcase.fmtMs(parse)}` : "";
        },
        note: "瓶頸在 parser 逐行比對正規表示式並為每段建立 Fragment 物件，耗時與記憶體大致隨片段數線性成長。PROGRAM-DATE-TIME 每段多一次日期解析，會明顯變慢。實務上長時間 DVR 直播清單才會到萬段等級。",
      });
    },
  },
] });
</script>
