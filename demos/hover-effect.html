<style>
  .board { position: absolute; inset: 0; display: grid; gap: 10px; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .board.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .board.g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .board.g6 { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 620px) and (orientation: portrait) {
    .board.c3 { grid-template-columns: 1fr; grid-template-rows: repeat(3, minmax(0, 1fr)); }
    .board.g6 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); }
  }
  .cell { position: relative; min-height: 0; border-radius: 12px; overflow: hidden; background: #151821; border: 1px solid var(--line); }
  .board.one { grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
  .fx, .deck { position: absolute; inset: 0; }
  .fx canvas { display: block; }
  .lab {
    position: absolute; left: 8px; top: 8px; z-index: 3; pointer-events: none; max-width: calc(100% - 16px);
    padding: 4px 8px; border-radius: 7px; background: rgba(14, 16, 19, .74); color: var(--fg);
    font: 600 12.5px/1.35 var(--font); display: flex; align-items: center; gap: 7px;
  }
  .lab > span { min-width: 0; }
  .lab code { display: block; font: 500 11px/1.35 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lab img { flex: none; width: 26px; height: 26px; border-radius: 4px; border: 1px solid rgba(255, 255, 255, .35); }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 26px 14px 12px; pointer-events: none; background: linear-gradient(transparent, rgba(0, 0, 0, .72)); }
  .cap b { display: block; font: 700 16px/1.4 var(--font); letter-spacing: .04em; }
  .cap span { font-size: 12px; color: rgba(255, 255, 255, .78); }
  .curve { position: absolute; right: 8px; bottom: 8px; z-index: 3; width: 132px; height: 74px; border-radius: 8px; background: rgba(14, 16, 19, .74); pointer-events: none; }
  .dots { position: absolute; left: 50%; bottom: 14px; z-index: 3; display: flex; gap: 7px; transform: translateX(-50%); pointer-events: none; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, .35); transition: background .2s; }
  .dots i.on { background: var(--accent); }
  .board.ratio { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: auto minmax(0, 1fr) auto minmax(0, 1fr); row-gap: 6px; }
  .rowhead { grid-column: 1 / -1; font: 600 13px/1.4 var(--font); color: var(--fg); }
  .rowhead code { font: 500 12px/1.4 var(--mono); color: var(--accent); margin-right: 6px; }
  .rowhead span { color: var(--muted); font-weight: 400; }
  .slot { min-height: 0; display: grid; place-items: center; container-type: size; }
  .frame { position: relative; aspect-ratio: var(--ar); width: min(100cqw, calc(100cqh * var(--ar))); border-radius: 10px; overflow: hidden; background: #151821; border: 1px solid var(--line); }
  .stress-area { position: absolute; inset: 8px; display: grid; gap: 6px; }
  @media (min-width: 761px) { .stress-area { inset: 8px 8px 8px 350px; } }
  .stress-area .cell { border-radius: 8px; }

<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hover-effect@1.2.1/dist/hover-effect.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// hover-effect showcase: one WebGL plane mixes two photos while a grayscale map pushes their UVs apart.
const IMG = "_shared/img/";
const MAP = "assets/hover-effect/";
const photo = (n) => `${IMG}photo-${n}.jpg`;
const RATIO = 800 / 1200; // every shared photo is 1200x800, imagesRatio is height / width
const PHOTOS = ["峽灣", "紅岩峽谷", "山谷公路", "披毯巴哥犬", "瀑布彩虹", "深海水母", "母獅", "海象群"];
// A new next()/previous() tween replaces a running one instead of fighting over dispFactor.
gsap.defaults({ overwrite: "auto" });

// Grayscale displacement maps drawn on a canvas and passed as data URLs.
function drawMap(paint) {
  const c = Showcase.h("canvas", { width: 256, height: 256 });
  paint(c.getContext("2d"), 256);
  return c.toDataURL("image/png");
}
const GEN = {
  mosaic: drawMap((g, s) => {
    let seed = 7;
    const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const n = 8, k = s / n;
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
      const v = Math.floor(rand() * 256);
      g.fillStyle = `rgb(${v},${v},${v})`;
      g.fillRect(x * k, y * k, k, k);
    }
  }),
  sweep: drawMap((g, s) => {
    const gr = g.createLinearGradient(0, 0, s, 0);
    gr.addColorStop(0, "#000");
    gr.addColorStop(1, "#fff");
    g.fillStyle = gr;
    g.fillRect(0, 0, s, s);
  }),
  radial: drawMap((g, s) => {
    const gr = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s * 0.72);
    gr.addColorStop(0, "#fff");
    gr.addColorStop(1, "#000");
    g.fillStyle = gr;
    g.fillRect(0, 0, s, s);
  }),
};

// One hoverEffect inside `parent`. The library has no destroy(), reads the parent size only on
// window resize and never removes that listener, so the listener is captured here and driven by a
// ResizeObserver instead; destroy() releases the WebGL context. All live effects die with the scene.
const live = new WeakMap();
function effect(ctx, parent, opts) {
  const add = window.addEventListener;
  let refit = null;
  window.addEventListener = function (type, fn, o) {
    if (type === "resize" && !refit) { refit = fn; return; }
    return add.call(this, type, fn, o);
  };
  let fx;
  try { fx = new hoverEffect({ parent, imagesRatio: RATIO, ...opts }); } finally { window.addEventListener = add; }
  const canvas = parent.querySelector("canvas");
  const ro = new ResizeObserver(() => refit && refit());
  ro.observe(parent);
  let set = live.get(ctx);
  if (!set) {
    set = new Set();
    live.set(ctx, set);
    ctx.onCleanup(() => [...set].forEach((x) => x.destroy()));
  }
  let factor = null;
  const e = {
    fx, canvas,
    get value() { return factor ? factor.value : 0; },
    // Calls next() (dir > 0) or previous() and returns the gsap tween that call started.
    play(dir) {
      const before = new Set(gsap.globalTimeline.getChildren(false, true, false));
      if (dir > 0) fx.next(); else fx.previous();
      const tw = gsap.globalTimeline.getChildren(false, true, false).find((t) => !before.has(t)) || null;
      if (tw) factor = tw.targets()[0];
      return tw;
    },
    destroy() {
      if (!set.delete(e)) return;
      ro.disconnect();
      if (factor) gsap.killTweensOf(factor);
      const gl = canvas.getContext("webgl2") || canvas.getContext("webgl");
      gl?.getExtension("WEBGL_lose_context")?.loseContext();
      canvas.remove();
    },
  };
  set.add(e);
  return e;
}

// Shared driver for comparison scenes: every effect gets one paused tween and the scene moves them
// all to the same progress, either from the slider or from a looping wave.
// wave(): hold 0 for `hold` of the cycle, ease up, hold 1, ease down.
const smooth = (x) => x * x * (3 - 2 * x);
const wave = (s, hold) => {
  const r = 0.5 - hold;
  return s < hold ? 0 : s < 0.5 ? smooth((s - hold) / r) : s < 0.5 + hold ? 1 : 1 - smooth((s - 0.5 - hold) / r);
};
function scrub(ctx, list, { period = 4200, hold = 0.05, phase = 0.16 } = {}) {
  const tweens = list.map((e) => e.play(1).pause());
  let auto = true, start = performance.now() - phase * period, p = -1;
  const set = (v) => { if (v !== p) { p = v; tweens.forEach((tw) => tw.progress(v)); } };
  const autoBtn = ctx.toggle("自動循環", true, (v) => {
    auto = v;
    // resume from the current slider value on the rising half
    start = performance.now() - (hold + (0.5 - hold) * Math.max(0, p)) * period;
  });
  const input = ctx.slider("轉場進度", { min: 0, max: 1, step: 0.01, value: 0, format: (v) => v.toFixed(2) }, (v) => {
    auto = false;
    autoBtn.setAttribute("aria-pressed", "false");
    set(v);
  });
  const out = input.nextElementSibling;
  ctx.raf((t) => {
    if (!auto) return;
    const v = Math.round(wave((((t - start) / period) % 1 + 1) % 1, hold) * 100) / 100;
    set(v);
    input.value = v;
    out.textContent = v.toFixed(2);
  });
}

function cells(ctx, cls, n) {
  ctx.html(`<div class="board ${cls}">${Array.from({ length: n }, () => `<div class="cell"><div class="fx"></div><div class="lab"></div></div>`).join("")}</div>`);
  return { hosts: ctx.$$(".fx"), labs: ctx.$$(".lab") };
}
const labHtml = (name, code, img) => `${img ? `<img alt="" src="${img}">` : ""}<span>${name}<code>${code}</code></span>`;
const label = (el, name, code, img) => { el.innerHTML = labHtml(name, code, img); };

const CARDS = [
  { a: 1, b: 3, map: "stripes.png", mapName: "斜紋", title: "峽灣 ⇄ 山谷公路", sub: "斜紋貼圖把畫面切成平移的條帶", intensity: 0.35, angle: Math.PI / 5, angleText: "π/5" },
  { a: 5, b: 6, map: "clouds.png", mapName: "雲霧", title: "瀑布彩虹 ⇄ 深海水母", sub: "雲霧雜訊像水波一樣流動", intensity: 0.6, angle: Math.PI / 3, angleText: "π/3" },
  { a: 7, b: 8, map: "ripple.png", mapName: "漣漪", title: "母獅 ⇄ 海象群", sub: "同心圓貼圖從中心擴散", intensity: 0.4, angle: -Math.PI / 4, angleText: "-π/4" },
];

Showcase.run({ scenes: [
  {
    id: "postcards", title: "旅行明信片",
    api: "new hoverEffect({ parent, image1, image2, displacementImage, intensity, angle })",
    desc: "每張卡片是一個 WebGL 平面：滑入時 dispFactor 由 0 補間到 1，位移貼圖的灰階值把兩張照片的 UV 往相反方向推開再交叉淡入。三張卡各用一張不同的位移貼圖。",
    hint: "滑鼠移入卡片翻面、移出還原・手機點一下",
    mount(ctx) {
      ctx.html(`<div class="board c3">${CARDS.map((c) => `<div class="cell"><div class="fx"></div><div class="lab">${labHtml(`位移貼圖：${c.mapName}`, `intensity ${c.intensity}・angle ${c.angleText}`, MAP + c.map)}</div><div class="cap"><b>${c.title}</b><span>${c.sub}</span></div></div>`).join("")}</div>`);
      let timer = 0, step = 0, autoBtn;
      const stopAuto = () => { clearInterval(timer); autoBtn.setAttribute("aria-pressed", "false"); };
      const startAuto = () => {
        clearInterval(timer);
        autoBtn.setAttribute("aria-pressed", "true");
        timer = ctx.interval(() => { const c = cards[step++ % cards.length]; flip(c, !c.flipped); }, 900);
      };
      const flip = (c, on) => {
        if (c.flipped === on) return;
        c.flipped = on;
        c.e.play(on ? 1 : -1);
      };
      const cards = ctx.$$(".cell").map((cell, i) => {
        const d = CARDS[i];
        const c = {
          flipped: false,
          e: effect(ctx, cell.querySelector(".fx"), {
            image1: photo(d.a), image2: photo(d.b), displacementImage: MAP + d.map,
            intensity: d.intensity, angle: d.angle, speedIn: 1.4, speedOut: 1.1, easing: "power3.inOut",
          }),
        };
        // The library flips on mouseenter / mouseleave itself; this only mirrors its state.
        ctx.on(cell, "mouseenter", () => { c.flipped = true; stopAuto(); });
        ctx.on(cell, "mouseleave", () => { c.flipped = false; });
        return c;
      });
      ctx.button("全部翻面", () => {
        stopAuto();
        const on = !cards.every((c) => c.flipped);
        cards.forEach((c, i) => ctx.timeout(() => flip(c, on), i * 180));
      }, { primary: true });
      autoBtn = ctx.toggle("自動輪播", true, (v) => (v ? startAuto() : stopAuto()));
      startAuto();
    },
  },
  {
    id: "maps", title: "位移貼圖",
    api: "displacementImage: url | dataURL",
    desc: "同一組照片、同樣的強度與角度，只換 displacementImage。貼圖的灰階決定每個像素被推多遠：條紋切出平移帶、雜訊像水波、同心圓會擴散；後三張是 canvas 現畫再轉成 dataURL 傳入。",
    hint: "拖曳「轉場進度」停在任一位置比較・hover: false 由滑桿驅動",
    mount(ctx) {
      const MAPS = [
        ["斜紋", "stripes.png", MAP + "stripes.png"],
        ["雲霧", "clouds.png", MAP + "clouds.png"],
        ["漣漪", "ripple.png", MAP + "ripple.png"],
        ["馬賽克", "canvas 8×8 色塊", GEN.mosaic],
        ["橫向漸層", "canvas 線性漸層", GEN.sweep],
        ["放射", "canvas 放射漸層", GEN.radial],
      ];
      const { hosts, labs } = cells(ctx, "g6", 6);
      const list = hosts.map((host, i) => {
        label(labs[i], MAPS[i][0], MAPS[i][1], MAPS[i][2]);
        return effect(ctx, host, { image1: photo(3), image2: photo(7), displacementImage: MAPS[i][2], intensity: 0.4, hover: false, easing: "none" });
      });
      scrub(ctx, list);
    },
  },
  {
    id: "intensity", title: "強度",
    api: "intensity・intensity1・intensity2",
    desc: "intensity 乘上貼圖灰階就是位移量：太小只是交叉淡入，太大會把畫面撕成條紋。intensity1 與 intensity2 可分開設定出場圖與進場圖，例如只讓進場圖扭曲。",
    hint: "拖曳「轉場進度」比較四種強度",
    mount(ctx) {
      const SETS = [
        ["輕微", "intensity: 0.1", { intensity: 0.1 }],
        ["適中", "intensity: 0.4", { intensity: 0.4 }],
        ["強烈", "intensity: 1.2", { intensity: 1.2 }],
        ["只扭曲進場圖", "intensity1: 0・intensity2: 1", { intensity1: 0, intensity2: 1 }],
      ];
      const { hosts, labs } = cells(ctx, "g4", 4);
      const list = hosts.map((host, i) => {
        label(labs[i], SETS[i][0], SETS[i][1]);
        return effect(ctx, host, { image1: photo(5), image2: photo(2), displacementImage: MAP + "clouds.png", hover: false, easing: "none", ...SETS[i][2] });
      });
      scrub(ctx, list);
    },
  },
  {
    id: "angle", title: "角度",
    api: "angle・angle1・angle2",
    desc: "angle 旋轉位移方向。預設 angle1 = angle、angle2 = -3 × angle，所以 π/4 時出場圖往一側滑、進場圖從另一側滑入；也可以分別指定，做出同向推移或水平出、垂直進。",
    hint: "拖曳「轉場進度」看位移方向",
    mount(ctx) {
      const P = Math.PI;
      const SETS = [
        ["預設：水平反向", "angle: π/4 → 45° / -135°", { angle: P / 4 }],
        ["垂直反向", "angle: -π/4 → -45° / 135°", { angle: -P / 4 }],
        ["同向推移", "angle1 = angle2 = π/4", { angle1: P / 4, angle2: P / 4 }],
        ["水平出、垂直進", "angle1: π/4・angle2: -π/4", { angle1: P / 4, angle2: -P / 4 }],
      ];
      const { hosts, labs } = cells(ctx, "g4", 4);
      const list = hosts.map((host, i) => {
        label(labs[i], SETS[i][0], SETS[i][1]);
        return effect(ctx, host, { image1: photo(1), image2: photo(8), displacementImage: GEN.sweep, intensity: 0.5, hover: false, easing: "none", ...SETS[i][2] });
      });
      scrub(ctx, list);
    },
  },
  {
    id: "easing", title: "速度與緩動",
    api: "speedIn・speedOut・easing: \"expo.out\" | \"bounce.out\" | \"steps(6)\"",
    desc: "轉場本身是 gsap 補間：speedIn / speedOut 是進場與退場秒數，easing 接受任何 gsap ease 字串。右下角畫出 dispFactor 隨時間的變化，黃線是 next()，紫線是 previous()。",
    hint: "拖曳秒數會重建四個實例・滑入任一格不會觸發（hover: false）",
    mount(ctx) {
      const EASES = ["expo.out", "power3.inOut", "bounce.out", "steps(6)"];
      const NAMES = ["預設", "前後緩", "彈跳", "階梯"];
      ctx.html(`<div class="board g4">${EASES.map(() => `<div class="cell"><div class="fx"></div><div class="lab"></div><canvas class="curve"></canvas></div>`).join("")}</div>`);
      const hosts = ctx.$$(".fx"), labs = ctx.$$(".lab"), curves = ctx.$$(".curve");
      const dpr = Math.min(2, devicePixelRatio || 1);
      curves.forEach((c) => { c.width = 132 * dpr; c.height = 74 * dpr; });
      let speedIn = 1.6, speedOut = 1.2, panes = [], dir = -1, rebuildTimer = 0;
      const build = () => {
        panes.forEach((p) => p.e.destroy());
        panes = hosts.map((host, i) => {
          label(labs[i], NAMES[i], `easing: "${EASES[i]}"`);
          return { e: effect(ctx, host, { image1: photo(4), image2: photo(6), displacementImage: MAP + "ripple.png", intensity: 0.35, hover: false, speedIn, speedOut, easing: EASES[i] }), tw: null, trace: { in: [], out: [] } };
        });
        dir = -1;
      };
      const rebuild = () => { clearTimeout(rebuildTimer); rebuildTimer = ctx.timeout(build, 300); };
      ctx.slider("進場 speedIn", { min: 0.3, max: 3, step: 0.1, value: speedIn, format: (v) => `${v.toFixed(1)} s` }, (v) => { speedIn = v; rebuild(); });
      ctx.slider("退場 speedOut", { min: 0.3, max: 3, step: 0.1, value: speedOut, format: (v) => `${v.toFixed(1)} s` }, (v) => { speedOut = v; rebuild(); });
      build();
      const draw = (cv, p) => {
        const g = cv.getContext("2d"), W = cv.width, H = cv.height, d = W / 132;
        const x0 = 8 * d, y0 = 8 * d, w = W - 16 * d, h = H - 16 * d;
        g.clearRect(0, 0, W, H);
        g.strokeStyle = "rgba(255,255,255,.16)";
        g.lineWidth = d;
        g.strokeRect(x0, y0, w, h);
        for (const [k, color] of [["out", "#9d8cff"], ["in", "#ffb703"]]) {
          const pts = p.trace[k];
          if (pts.length < 2) continue;
          g.strokeStyle = color;
          g.lineWidth = 2 * d;
          g.beginPath();
          pts.forEach(([x, y], i) => (i ? g.lineTo(x0 + x * w, y0 + (1 - y) * h) : g.moveTo(x0 + x * w, y0 + (1 - y) * h)));
          g.stroke();
        }
      };
      ctx.raf(() => panes.forEach((p, i) => {
        if (p.tw && p.tw.isActive()) p.trace[dir > 0 ? "in" : "out"].push([p.tw.progress(), p.e.value]);
        draw(curves[i], p);
      }));
      (async () => {
        while (ctx.active) {
          dir = -dir;
          for (const p of panes) {
            p.trace[dir > 0 ? "in" : "out"] = [[0, dir > 0 ? 0 : 1]];
            p.tw = p.e.play(dir);
          }
          await ctx.sleep((dir > 0 ? speedIn : speedOut) * 1000 + 700);
        }
      })().catch((e) => { if (e.name !== "AbortError") console.error(e); });
    },
  },
  {
    id: "manual", title: "手動輪播",
    api: "hover: false・fx.next()・fx.previous()",
    desc: "關掉 hover 後，next() 與 previous() 就是程式化的轉場開關。每個實例只綁兩張圖，所以輪播每換一張就在上層建立新實例、等貼圖載入後移除舊的（並釋放它的 WebGL context）；往回翻時新實例先停在 1 再呼叫 previous()。",
    hint: "按「上一張／下一張」或切換位移貼圖",
    mount(ctx) {
      ctx.html(`<div class="board one"><div class="cell"><div class="deck"></div><div class="lab"></div><div class="dots">${PHOTOS.map(() => "<i></i>").join("")}</div></div></div>`);
      PHOTOS.forEach((_, i) => { new Image().src = photo(i + 1); });
      const deck = ctx.$(".deck"), lab = ctx.$(".lab"), dots = ctx.$$(".dots i");
      const MAPS = [["雲霧", MAP + "clouds.png"], ["斜紋", MAP + "stripes.png"], ["漣漪", MAP + "ripple.png"]];
      let idx = 0, map = MAPS[0][1], busy = false, cur, autoBtn, timer = 0;
      const make = (a, b) => {
        const layer = Showcase.h("div", { class: "fx" });
        deck.append(layer);
        const e = effect(ctx, layer, { image1: photo(a + 1), image2: photo(b + 1), displacementImage: map, intensity: 0.45, hover: false, speedIn: 1.2, speedOut: 1.2, easing: "power2.inOut" });
        return { e, layer };
      };
      const show = (call) => {
        label(lab, `第 ${idx + 1} 張：${PHOTOS[idx]}`, call);
        dots.forEach((d, i) => d.classList.toggle("on", i === idx));
      };
      async function go(dir) {
        if (busy) return;
        busy = true;
        const to = (idx + dir + PHOTOS.length) % PHOTOS.length;
        const next = dir > 0 ? make(idx, to) : make(to, idx);
        if (dir < 0) next.e.play(1).progress(1); // start on the current photo (image2)
        await ctx.sleep(350); // the new layer stays transparent until its textures arrive
        cur.e.destroy();
        cur.layer.remove();
        cur = next;
        cur.e.play(dir);
        idx = to;
        show(dir > 0 ? "fx.next()：dispFactor 0 → 1" : "fx.previous()：dispFactor 1 → 0");
        await ctx.sleep(1250);
        busy = false;
      }
      const run = (dir) => go(dir).catch((e) => { if (e.name !== "AbortError") console.error(e); });
      const stopAuto = () => { clearInterval(timer); autoBtn.setAttribute("aria-pressed", "false"); };
      ctx.button("上一張", () => { stopAuto(); run(-1); });
      ctx.button("下一張", () => { stopAuto(); run(1); }, { primary: true });
      autoBtn = ctx.toggle("自動播放", true, (v) => { clearInterval(timer); if (v) timer = ctx.interval(() => run(1), 2600); });
      ctx.group(MAPS.map((m) => m[0]), 0, (i) => { map = MAPS[i][1]; });
      cur = make(0, 1);
      show("new hoverEffect({ hover: false })");
      timer = ctx.interval(() => run(1), 2600);
      ctx.timeout(() => run(1), 900);
    },
  },
  {
    id: "ratio", title: "圖片比例",
    api: "imagesRatio: 圖高 / 圖寬",
    desc: "外框比例和照片不同時，hover-effect 依 imagesRatio 做 cover 裁切。上排填入照片的真實比例 800 / 1200，三種框都不變形；下排用預設值 1，照片被當成正方形，在寬框、方框、直框裡都被壓扁或拉長。",
    hint: "拖曳「轉場進度」・注意下排母獅與巴哥犬的臉型",
    mount(ctx) {
      const FRAMES = [["16:9", 16 / 9], ["1:1", 1], ["9:16", 9 / 16]];
      const ROWS = [["imagesRatio: 800 / 1200", "照片真實比例，三種框都正確裁切", RATIO], ["imagesRatio: 1", "預設值，照片被當成正方形而變形", 1]];
      ctx.html(`<div class="board ratio">${ROWS.map(([code, note]) => `<div class="rowhead"><code>${code}</code><span>${note}</span></div>${FRAMES.map(([fn, ar]) => `<div class="slot"><div class="frame" style="--ar:${ar}"><div class="fx"></div><div class="lab"><span>${fn}</span></div></div></div>`).join("")}`).join("")}</div>`);
      const hosts = ctx.$$(".fx");
      const list = hosts.map((host, i) => effect(ctx, host, {
        image1: photo(7), image2: photo(4), displacementImage: MAP + "clouds.png", intensity: 0.3, hover: false, easing: "none",
        imagesRatio: ROWS[Math.floor(i / 3)][2],
      }));
      // long holds so both photos sit still long enough to judge their proportions
      scrub(ctx, list, { period: 7000, hold: 0.3, phase: 0.78 });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × new hoverEffect()・next() / previous() 輪流觸發",
    desc: "逐級增加同時轉場的卡片數，每張都是獨立的 WebGLRenderer（自己的 context、三張貼圖、固定 2 倍像素比），並持續以線性緩動來回轉場，量測 FPS 與建立耗時。",
    hint: "按「自動加壓」開始，或拖曳手動滑桿",
    mount(ctx) {
      ctx.html(`<div class="stress-area"></div>`);
      const area = ctx.$(".stress-area");
      const MAPS = ["clouds.png", "stripes.png", "ripple.png"];
      let items = [], buildMs = 0;
      const layout = (n) => {
        const r = area.getBoundingClientRect();
        const cols = Math.min(n, Math.max(1, Math.round(Math.sqrt((n * r.width) / Math.max(1, r.height) / 1.5))));
        area.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        area.style.gridTemplateRows = `repeat(${Math.ceil(n / cols)}, minmax(0, 1fr))`;
      };
      const apply = (n) => {
        items.forEach((it) => { it.e.destroy(); it.cell.remove(); });
        layout(n);
        const t0 = performance.now(), now = performance.now();
        items = Array.from({ length: n }, (_, i) => {
          const cell = Showcase.h("div", { class: "cell" }, Showcase.h("div", { class: "fx" }));
          area.append(cell);
          const e = effect(ctx, cell.firstChild, {
            image1: photo((i % 8) + 1), image2: photo(((i + 3) % 8) + 1), displacementImage: MAP + MAPS[i % 3],
            intensity: 0.4, hover: false, speedIn: 0.9, speedOut: 0.9, easing: "none",
          });
          return { e, cell, dir: -1, at: now + i * 90 };
        });
        buildMs = performance.now() - t0;
      };
      ctx.interval(() => {
        const now = performance.now();
        for (const it of items) if (now >= it.at) { it.dir = -it.dir; it.e.play(it.dir); it.at = now + 950; }
      }, 50);
      ctx.ramp({
        label: "同時轉場", unit: "張", steps: [1, 2, 4, 6, 8, 10, 12], minFps: 30, warmup: 1200,
        apply,
        metrics: () => ({
          "WebGL context": `${items.length} 個`,
          繪圖像素: `${Math.round(items.reduce((s, it) => s + it.e.canvas.width * it.e.canvas.height, 0) / 1e4)} 萬`,
          建立耗時: `${buildMs.toFixed(0)} ms`,
        }),
        note: "每張卡都是一個獨立 WebGL context，瀏覽器同時能保有的 context 約 16 個，超過會強制遺失最舊的，所以級距停在 12。成本來自 context 切換、三張貼圖上傳與寫死的 2 倍像素比填充；要大量卡片時應改用單一 canvas 自己寫 shader。",
      });
    },
  },
] });
</script>
</body>
</html>
