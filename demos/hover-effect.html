<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hover-effect 示範：位移貼圖轉場卡片</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"hover-effect 依賴全域 THREE 與 gsap，此頁搭配其相依版本 three r149 的 UMD 建置"}</script>
<style>
  body { background: #0b0d12; }
  .page { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; padding: 18px 20px 52px; gap: 14px; }
  .page h1 { margin: 0; font-size: clamp(20px, 4vw, 28px); letter-spacing: .06em; }
  .page h1 small { display: block; margin-top: 4px; font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: .02em; }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; min-height: 0; }
  .card { position: relative; border-radius: 14px; overflow: hidden; background: #151821; min-height: 0; }
  .card .fx { position: absolute; inset: 0; }
  .card .fx canvas { display: block; }
  .card .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 14px 12px; pointer-events: none;
    background: linear-gradient(transparent, rgba(0, 0, 0, .72));
  }
  .card .cap b { display: block; font-size: 16px; letter-spacing: .04em; }
  .card .cap span { font-size: 12px; color: rgba(255, 255, 255, .75); }
  .card .map { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; align-items: center; font-size: 11px; pointer-events: none; }
  .card .map img { width: 26px; height: 26px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, .4); }
  .card .map span { background: rgba(0, 0, 0, .55); padding: 2px 7px; border-radius: 999px; }
  @media (max-width: 600px) {
    .page { padding: 14px 12px 48px; gap: 10px; }
    .cards { grid-template-columns: 1fr; grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .card .cap { padding: 18px 12px 8px; }
  }
</style>
</head>
<body>
<div class="page">
  <h1>旅行明信片<small>滑入卡片，兩張照片會依左上角的位移貼圖扭曲交換</small></h1>
  <div class="cards" id="cards"></div>
</div>
<div class="controls">
  <button class="btn" id="all">全部翻面</button>
  <button class="btn" id="auto" aria-pressed="true">自動輪播</button>
</div>
<div class="hint">滑鼠移入翻面・移出還原・手機點一下</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hover-effect@1.2.1/dist/hover-effect.umd.js"></script>
<script>
// Each card pairs two photos with a different grayscale displacement map (made with Pillow).
const IMG = "_shared/img/";
const MAP = "assets/hover-effect/";
const CARDS = [
  { a: "photo-1.jpg", b: "photo-3.jpg", map: "stripes.png", mapName: "斜紋", title: "峽灣 ⇄ 山谷公路", sub: "斜紋貼圖把畫面切成平移的條帶", intensity: 0.35, angle: Math.PI / 5 },
  { a: "photo-5.jpg", b: "photo-6.jpg", map: "clouds.png", mapName: "雲霧", title: "瀑布彩虹 ⇄ 深海水母", sub: "雲霧雜訊像水波一樣流動", intensity: 0.6, angle: Math.PI / 3 },
  { a: "photo-7.jpg", b: "photo-8.jpg", map: "ripple.png", mapName: "漣漪", title: "母獅 ⇄ 海象群", sub: "同心圓貼圖從中心擴散", intensity: 0.4, angle: -Math.PI / 4 },
];

const wrap = document.getElementById("cards");
const effects = CARDS.map((c) => {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    '<div class="fx"></div>' +
    '<div class="map"><img alt="" src="' + MAP + c.map + '"><span>位移貼圖：' + c.mapName + "</span></div>" +
    '<div class="cap"><b>' + c.title + "</b><span>" + c.sub + "</span></div>";
  wrap.appendChild(card);
  const fx = new hoverEffect({
    parent: card.querySelector(".fx"),
    image1: IMG + c.a,
    image2: IMG + c.b,
    displacementImage: MAP + c.map,
    intensity: c.intensity,
    angle: c.angle,
    speedIn: 1.4,
    speedOut: 1.1,
    imagesRatio: 800 / 1200,
    easing: "power3.inOut",
  });
  return { fx, card, flipped: false };
});

// Keep our own flip state in sync with the library's hover handling.
effects.forEach((e) => {
  e.card.addEventListener("mouseenter", () => { e.flipped = true; stopAuto(); });
  e.card.addEventListener("mouseleave", () => { e.flipped = false; });
});
const flip = (e, on) => {
  if (e.flipped === on) return;
  e.flipped = on;
  on ? e.fx.next() : e.fx.previous();
};

document.getElementById("all").addEventListener("click", () => {
  stopAuto();
  const on = !effects.every((e) => e.flipped);
  effects.forEach((e, i) => setTimeout(() => flip(e, on), i * 180));
});

// Auto mode flips one card at a time so idle previews always show a transition in progress.
const autoBtn = document.getElementById("auto");
let step = 0;
let timer = 0;
function startAuto() {
  autoBtn.setAttribute("aria-pressed", "true");
  clearInterval(timer);
  timer = setInterval(() => {
    const e = effects[step % effects.length];
    flip(e, !e.flipped);
    step += 1;
  }, 900);
}
function stopAuto() {
  autoBtn.setAttribute("aria-pressed", "false");
  clearInterval(timer);
}
autoBtn.addEventListener("click", () => (autoBtn.getAttribute("aria-pressed") === "true" ? stopAuto() : startAuto()));
startAuto();
</script>
</body>
</html>
