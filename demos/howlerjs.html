            const hw = howls[i];
            let p = 0, s = 0, on = false;
            if (hw && hw.state() === "loaded" && ids[i] != null) {
              on = hw.playing(ids[i]);
              const v = hw.seek(ids[i]);
              s = typeof v === "number" ? v : 0;
              p = clamp(s / (hw.duration() || 1), 0, 1);
            }
            c.bar.style.width = `${(p * 100).toFixed(1)}%`;
            const t = `${s.toFixed(1)}s`;
            if (c.tm.textContent !== t) c.tm.textContent = t;
            if (c.on !== on) { c.on = on; c.pb.textContent = on ? "❚❚" : "▶"; }
          });
          const { g, w, h: hh } = sp;
          g.clearRect(0, 0, w, hh);
          const bw = Math.min(w * 0.42, 340), x1 = bw + 16;
          txt(g, "載入耗時（對數刻度）", 8, 6, "#e8e6e3");
          const top = 26, rh = Math.max(8, Math.min(26, (hh - top - 10) / 3 - 6));
          MODES.forEach((m, i) => {
            const y = top + i * (rh + 6);
            g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(8, y, bw - 8, rh);
            if (ms[i] != null) {
              const f = clamp(Math.log10(Math.max(0.1, ms[i]) / 0.1) / 4, 0.02, 1);
              g.fillStyle = m.c; g.fillRect(8, y, (bw - 8) * f, rh);
              txt(g, fmtMs(ms[i]), 12, y + rh / 2 - 6, "#050608", true, "left", 10.5);
            } else txt(g, m.name, 12, y + rh / 2 - 6, "#7d8490", false, "left", 10.5);
          });
          txt(g, "0.1 ms", 8, top + 3 * (rh + 6), "#7d8490", true, "left", 9);
          txt(g, "1 s", bw, top + 3 * (rh + 6), "#7d8490", true, "right", 9);
          const T = tap();
          let lb = null;
          if (T) { T.an.getByteFrequencyData(T.fq); lb = logBands(T.fq, 96); }
          for (let i = 0; i < 96; i++) hold[i] = Math.max(lb ? lb[i] : 0, hold[i] * 0.9);
          txt(g, "masterGain 頻譜：#3 HTML5 的聲音不經過這裡", x1, 6, "#e8e6e3");
          lane(g, x1, 24, w - x1 - 8, hh - 32);
          drawBands(g, hold, x1, 24, w - x1 - 8, hh - 32);
        });
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "同一個 Howl 同時 play() N 次・rate(r, id)・stereo(p, id)・seek(id)・playing(id)",
      desc: "同一個 1 秒循環音色同時播放 N 個 Sound ID，每個都有自己的音高與左右位置。每一格畫面都對每個 id 呼叫 seek(id) 與 playing(id)，Howler 內部以線性搜尋找 id，成本隨 N² 成長。",
      hint: "按「自動加壓」從 16 個逐級加到 1024 個；「▶ 試聽」用目前數量發聲，「■ 停止聲音」全部停止。音訊時鐘／實際時間接近 1.000 代表音訊執行緒跟得上。",
      mount(ctx) {
        ctx.html(`<div class="hw-bv"><div class="hw-cv hw-bvin"></div></div>`);
        ctx.controls.classList.add("bottom");
        const k = keeper(ctx);
        const PENTA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2];
        let howl = null, loading = null, started = false, target = 16, ids = [], playMs = 0, live = 0, envA = null;
        const clk = { a: 0, p: 0, r: 0 };
        const v = view(ctx, ctx.$(".hw-bvin"));
        asset("pulse").then((a) => { if (ctx.active) envA = envelope(a.data, 200); }).catch(fail(ctx, "合成音色"));
        const ensure = () => (loading ||= asset("pulse").then((a) => new Promise((res, rej) => {
          if (!ctx.active) return rej(new DOMException("Scene unmounted", "AbortError"));
          howl = k.add(new Howl({ src: [a.src], format: a.fmt, loop: true, volume: 0.05, onloaderror: (_, e) => rej(new Error(`載入失敗：${e}`)), onplayerror: fail(ctx, "播放") }));
          tap();
          if (howl.state() === "loaded") res(); else howl.once("load", () => res());
        })).catch((e) => { loading = null; throw e; }));
        const apply = async (n) => {
          target = n;
          if (!started) return;
          await ensure();
          if (!ctx.active || !started) return;
          const t0 = performance.now();
          let made = 0;
          while (ids.length < n) {
            const i = ids.length, id = howl.play();
            howl.rate(PENTA[i % 6] * (i % 12 < 6 ? 1 : 0.5), id);
            howl.stereo(((i * 0.618) % 1) * 2 - 1, id);
            ids.push(id); made++;
          }
          while (ids.length > n) howl.stop(ids.pop());
          // Voices sharing a rate start in the same render quantum and add up coherently, so scale by 1/N.
          howl.volume(0.9 / n);
          if (made) playMs = (performance.now() - t0) / made;
        };
        const r = ctx.ramp({
          label: "同時播放數", unit: "個", steps: [16, 32, 64, 128, 256, 512, 1024], apply,
          title: "極限測試：同時播放的 Sound ID",
          note: "FPS 反映主執行緒成本：每格對 N 個 id 呼叫 seek 與 playing 再畫出來。play() 平均耗時含 rate 與 stereo 設定；音訊時鐘比值低於 0.98 代表音訊執行緒開始跟不上。",
          metrics: () => ({ "播放中": live, "play() 平均": playMs ? `${playMs.toFixed(2)} ms` : "…", "音訊時鐘／實際": clk.r ? clk.r.toFixed(3) : "…" }),
        });
        // The ramp's own run button is the gesture that may create the AudioContext.
        ctx.on(ctx.el, "click", (e) => { if (e.target.closest && e.target.closest("[data-sc-run]")) { started = true; ensure().catch(() => {}); } }, { capture: true });
        ctx.button("▶ 試聽", () => { started = true; ensure().catch(fail(ctx, "載入")); r.set(r.value); }, { primary: true });
        ctx.button("■ 停止聲音", () => { started = false; if (howl) howl.stop(); ids = []; });
        ctx.interval(() => {
          const ac = Howler.ctx;
          if (!ac || !started) { clk.p = 0; clk.r = 0; return; }
          const a = ac.currentTime, p = performance.now();
          if (clk.p) clk.r = (a - clk.a) / ((p - clk.p) / 1000);
          clk.a = a; clk.p = p;
        }, 1000);
        const hold = new Float32Array(96);
        ctx.raf(() => {
          const { g, w, h: hh } = v;
          g.clearRect(0, 0, w, hh);
          const ok = started && howl && howl.state() === "loaded", n = ok ? ids.length : target, T = tap();
          const th = Math.min(120, hh * 0.28);
          lane(g, 10, 26, w - 20, th);
          let lb = null;
          if (T && ok) { T.an.getByteFrequencyData(T.fq); T.an.getFloatTimeDomainData(T.td); lb = logBands(T.fq, 96); }
          for (let i = 0; i < 96; i++) hold[i] = Math.max(lb ? lb[i] : 0, hold[i] * 0.9);
          drawBands(g, hold, 10, 26, w - 20, th);
          if (lb) drawLive(g, T.td, 10, 26, w - 20, th, "#f7df1e", 2);
          txt(g, ok ? `masterGain 即時頻譜與波形・每個聲音音量 ${(0.9 / Math.max(1, n)).toFixed(4)}` : "尚未發聲：按「自動加壓」或「▶ 試聽」", 12, 8, ok ? "#e8e6e3" : "#7d8490");
          const gy = 26 + th + 12, gh = hh - gy - 10, gw = w - 20;
          const cols = Math.max(1, Math.ceil(Math.sqrt((n * gw) / Math.max(1, gh)))), rows = Math.ceil(n / cols);
          const cell = Math.min(gw / cols, gh / Math.max(1, rows)), rad = Math.max(1, cell * 0.38);
          let on = 0;
          for (let i = 0; i < n; i++) {
            let b = 0.12;
            if (ok) {
              const id = ids[i];
              if (howl.playing(id)) {
                on++;
                const s = howl.seek(id), ph = typeof s === "number" ? ((s % 1) + 1) % 1 : 0;
                b = 0.25 + 0.75 * (envA ? envA[Math.min(envA.length - 1, Math.floor(ph * envA.length))] : 0.5);
              }
            }
            g.fillStyle = `hsl(${185 + (i % 6) * 30} ${i % 12 < 6 ? 85 : 55}% ${Math.round(14 + b * 54)}%)`;
            const x = 10 + (i % cols) * cell + cell / 2, y = gy + Math.floor(i / cols) * cell + cell / 2;
            if (rad < 3) g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
            else { g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill(); }
          }
          live = on;
          txt(g, `${ok ? `播放中 ${on}` : `待命 ${n}`} 個 Sound ID・顏色＝音高（6 音 × 2 個八度）・亮度＝各自循環內的位置`, 12, gy - 12 > 26 + th ? gy - 11 : gy, "#9aa0aa", false, "left", 10.5);
        });
      },
    },
  ],
});
</script>
</body>
