<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Howler.js 示範：音樂播放器與取樣切片</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":["audio"]}</script>
<style>
  body {
    background:
      radial-gradient(70% 70% at 20% 30%, rgba(157, 140, 255, 0.14), transparent 70%),
      radial-gradient(60% 60% at 90% 90%, rgba(76, 201, 240, 0.10), transparent 70%),
      var(--bg);
  }
  .wrap {
    position: fixed; inset: 0; display: grid; place-items: center; padding: 16px 16px 48px;
  }
  .card {
    width: min(860px, 100%); display: grid; gap: 18px 24px;
    grid-template-columns: auto 1fr; align-items: center;
  }
  .disc { position: relative; width: 250px; aspect-ratio: 1; }
  .disc canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .disc .playbtn {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 84px; height: 84px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-size: 30px; font-weight: 700;
    box-shadow: 0 0 0 8px rgba(247, 223, 30, 0.12), 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .disc .playbtn:active { transform: translate(-50%, -48%); }
  .info { min-width: 0; }
  .info h1 { margin: 0; font-size: 20px; }
  .info .sub { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
  .seek { height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; cursor: pointer; position: relative; }
  .seek i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px;
    background: linear-gradient(90deg, var(--c6), var(--c2)); }
  .time { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); margin: 6px 0 12px; }
  .row { display: grid; grid-template-columns: 74px 1fr 46px; align-items: center; gap: 8px; font-size: 13px; }
  .row span:last-child { font: 12px var(--mono); color: var(--muted); text-align: right; }
  .row input { width: 100%; }
  .fx { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .pads { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; }
  .pad {
    aspect-ratio: 1.3; border-radius: 10px; border: 1px solid var(--line); cursor: pointer;
    background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    color: var(--fg); font: 600 13px var(--font); display: grid; place-items: center; align-content: center; gap: 2px;
    transition: transform .08s, box-shadow .2s, background .2s;
  }
  .pad small { font: 11px var(--mono); color: var(--muted); }
  .pad.hit { background: var(--pc); color: #111; box-shadow: 0 0 24px -2px var(--pc); transform: scale(0.96); }
  .pad.hit small { color: #222; }
  .padtitle { grid-column: 1 / -1; margin-bottom: -10px; font-size: 12px; color: var(--muted); }
  @media (max-width: 620px) {
    /* stacked layout: the hint would sit on the slice pads; show it briefly, then fade it out */
    .hint { animation: hint-fade .5s 8s forwards; }
    .card { grid-template-columns: minmax(0, 1fr); gap: 10px; justify-items: center; }
    .disc { width: 150px; }
    .disc .playbtn { width: 56px; height: 56px; font-size: 20px; }
    .info { width: 100%; }
    .info h1 { font-size: 16px; }
    .info .sub { margin-bottom: 6px; }
    .time { margin: 4px 0 6px; }
    .row { grid-template-columns: 60px 1fr 40px; font-size: 12px; }
    .pads { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; }
    .pad { aspect-ratio: 2.2; font-size: 12px; }
    .padtitle { display: none; }
    .fx .btn { padding: 6px 9px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="disc">
      <canvas id="viz"></canvas>
      <button class="playbtn" id="play" aria-label="播放">▶</button>
    </div>
    <div class="info">
      <h1>示範循環音樂</h1>
      <div class="sub">100 BPM・Am F C G・自製電子樂</div>
      <div class="seek" id="seek"><i id="bar"></i></div>
      <div class="time"><span id="cur">0:00</span><span id="dur">0:19</span></div>
      <div class="row"><span>音量</span><input type="range" id="vol" min="0" max="100" value="80"><span id="volv">80%</span></div>
      <div class="row"><span>播放速度</span><input type="range" id="rate" min="50" max="200" value="100"><span id="ratev">1.00x</span></div>
      <div class="row"><span>左右聲道</span><input type="range" id="pan" min="-100" max="100" value="0"><span id="panv">置中</span></div>
      <div class="fx">
        <button class="btn" id="fadein">淡入 2 秒</button>
        <button class="btn" id="fadeout">淡出 2 秒</button>
        <button class="btn" id="loop" aria-pressed="true">循環播放</button>
      </div>
    </div>
    <div class="padtitle">取樣切片（Audio Sprite，鍵盤 1 到 8）</div>
    <div class="pads" id="pads"></div>
  </div>
</div>
<div class="hint">按中間播放鍵，拖曳滑桿調速度與聲道，點切片即時觸發</div>

<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
<script>
// Howler.js: one Howl for the looping track, one Howl with an audio sprite for the pads.
const SRC = ["_shared/audio/loop.mp3"];
const BAR_MS = 2400; // 100 BPM, 4/4
const COLORS = ["#f7df1e", "#ff8c42", "#f72585", "#9d8cff", "#4cc9f0", "#7bd389", "#f7df1e", "#ff8c42"];

const music = new Howl({ src: SRC, loop: true, volume: 0.8 });
const sprite = {};
for (let i = 0; i < 8; i++) sprite["s" + i] = [i * BAR_MS, 1200];
const pads = new Howl({ src: SRC, sprite, volume: 0.9 });

// Tap Howler's master output with an AnalyserNode for the ring visualizer.
const ctx = Howler.ctx;
let analyser = null;
if (ctx && Howler.masterGain) {
  analyser = ctx.createAnalyser();
  analyser.fftSize = 256;
  analyser.smoothingTimeConstant = 0.8;
  Howler.masterGain.disconnect();
  Howler.masterGain.connect(analyser);
  analyser.connect(ctx.destination);
}
const freq = new Uint8Array(analyser ? analyser.frequencyBinCount : 128);

const $ = (id) => document.getElementById(id);
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
music.once("load", () => { $("dur").textContent = fmt(music.duration()); });

const playBtn = $("play");
function syncPlayButton() { playBtn.textContent = music.playing() ? "❚❚" : "▶"; }
playBtn.addEventListener("click", () => {
  if (music.playing()) music.pause();
  else music.play();
});
music.on("play", syncPlayButton);
music.on("pause", syncPlayButton);
music.on("stop", syncPlayButton);

$("seek").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  music.seek(((e.clientX - r.left) / r.width) * music.duration());
});
$("vol").addEventListener("input", (e) => {
  music.volume(e.target.value / 100);
  $("volv").textContent = `${e.target.value}%`;
});
$("rate").addEventListener("input", (e) => {
  const r = e.target.value / 100;
  music.rate(r);
  pads.rate(r);
  $("ratev").textContent = `${r.toFixed(2)}x`;
});
$("pan").addEventListener("input", (e) => {
  const p = e.target.value / 100;
  music.stereo(p);
  $("panv").textContent = p === 0 ? "置中" : p < 0 ? `左 ${Math.round(-p * 100)}` : `右 ${Math.round(p * 100)}`;
});
$("fadein").addEventListener("click", () => {
  if (!music.playing()) music.play();
  music.fade(0, $("vol").value / 100, 2000);
});
$("fadeout").addEventListener("click", () => { if (music.playing()) music.fade(music.volume(), 0, 2000); });
$("loop").addEventListener("click", (e) => {
  const on = e.currentTarget.getAttribute("aria-pressed") !== "true";
  e.currentTarget.setAttribute("aria-pressed", on);
  music.loop(on);
});
music.on("end", () => { if (!music.loop()) syncPlayButton(); });

// Sprite pads
const padEls = [];
for (let i = 0; i < 8; i++) {
  const b = document.createElement("button");
  b.className = "pad";
  b.style.setProperty("--pc", COLORS[i]);
  b.innerHTML = `切片 ${i + 1}<small>${(i * BAR_MS / 1000).toFixed(1)} 秒</small>`;
  b.addEventListener("pointerdown", () => hit(i));
  $("pads").append(b);
  padEls.push(b);
}
function hit(i) {
  pads.play("s" + i);
  padEls[i].classList.add("hit");
  setTimeout(() => padEls[i].classList.remove("hit"), 180);
}
window.addEventListener("keydown", (e) => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 8) hit(n - 1);
  if (e.code === "Space") { e.preventDefault(); playBtn.click(); }
});

// Ring visualizer
const cv = $("viz");
const g = cv.getContext("2d");
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = cv.clientWidth * dpr;
  cv.height = cv.clientHeight * dpr;
}
resize();
window.addEventListener("resize", resize);

let spin = 0;
function frame(t) {
  const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2, R = W * 0.29;
  g.clearRect(0, 0, W, H);
  const live = analyser && (music.playing() || pads.playing());
  if (analyser) analyser.getByteFrequencyData(freq);
  const N = 64;
  spin += music.playing() ? 0.004 : 0.001;
  // vinyl-like disc
  const grd = g.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
  grd.addColorStop(0, "#22252c");
  grd.addColorStop(1, "#121418");
  g.fillStyle = grd;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
  g.strokeStyle = "rgba(255,255,255,0.05)";
  for (let k = 1; k < 6; k++) { g.beginPath(); g.arc(cx, cy, R * (0.45 + k * 0.1), 0, Math.PI * 2); g.stroke(); }
  for (let i = 0; i < N; i++) {
    const a = spin + (i / N) * Math.PI * 2;
    const v = live ? freq[Math.floor(i * 1.6)] / 255 : 0.12 + 0.08 * Math.sin(i * 0.7 + t / 900);
    const len = R * 0.06 + v * R * 0.55;
    const hue = 250 - (i / N) * 70;
    g.strokeStyle = `hsl(${hue} 90% ${55 + v * 15}%)`;
    g.lineWidth = Math.max(2, W / 120);
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * (R + 6), cy + Math.sin(a) * (R + 6));
    g.lineTo(cx + Math.cos(a) * (R + 6 + len), cy + Math.sin(a) * (R + 6 + len));
    g.stroke();
  }
  const d = music.duration() || 19.2;
  const pos = music.state() === "loaded" ? music.seek() : 0;
  $("bar").style.width = `${(pos / d) * 100}%`;
  $("cur").textContent = fmt(pos);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
