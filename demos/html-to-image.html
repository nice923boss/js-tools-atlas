// Pixel probe over a 112x72 RGBA buffer.
function probe(d, W = 112, H = 72) {
  const p = (x, y) => { const i = (y * W + x) * 4; return [d[i], d[i + 1], d[i + 2]]; };
  return {
    p,
    count(fn, x0 = 0, y0 = 0, x1 = W, y1 = H) { let n = 0; for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (fn(p(x, y))) n++; return n; },
    bbox(fn) {
      let a = W, b = H, c = -1, e = -1;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (fn(p(x, y))) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); e = Math.max(e, y); }
      return c < 0 ? null : { w: c - a + 1, h: e - b + 1 };
    },
  };
}

        const [fc, t1] = await timed(() => H.getFontEmbedCSS(el));
        [u, t] = await timed(() => H.toPng(el, { ...o, fontEmbedCSS: fc }));
        if (!ctx.active) return;
        show(2, u, `預算 <b>${ms(t1)}</b>＋匯出 <b>${ms(t)}</b>・CSS <b>${kb(fc.length)}</b>`);
      }, (e) => { ctx.$("[data-i='0']").textContent = `匯出失敗：${e.message || e}`; });
      ctx.button("再匯出一次", () => go(), { primary: true });
      let faces = [];
      try { faces = await document.fonts.load('34px "HtiPacifico"'); } catch (e) { faces = []; }
      if (!ctx.active) return;
      ctx.$("[data-fs]").textContent = faces.length && faces.every((f) => f.status === "loaded")
        ? "頁面已載入 Pacifico（woff2，來自 jsDelivr）。三格是同一節點的三種字型處理方式；中文字用系統字型，不受影響。"
        : "網頁字型載入失敗（可能離線），三格都會退回預設字型。";
      go();
    } },

  { id: "css", title: "CSS 支援度", api: "toCanvas(tile, { pixelRatio: 1 })；getImageData() 像素判定",
    desc: "與 html2canvas 示範用同一份 20 項測試。html-to-image 不自己重畫，而是把節點與計算後樣式交給瀏覽器在 SVG 裡排版，所以支援度取決於瀏覽器；html2canvas 同一份測試只有 8 項完整支援。",
    hint: "左格是瀏覽器原生畫面，右格是輸出；判定前先填洋紅底，空白輸出不會被誤判為通過",
    mount(ctx) {
      ctx.el.classList.add("scroll");
      ctx.html(`<div class="hti-css"><p class="hti-sum"><span>實測結果</span><b data-sum>-</b><span class="muted" data-note>逐項轉換中…</span></p>
        <div class="hti-grid">${CASES.map((c) => `<div class="hti-case"><header><b>${c.name}</b><code>${c.prop}</code><span>…</span></header>
        <div class="hti-pair"><figure><div class="hti-tile">${c.html}</div><figcaption>瀏覽器原生</figcaption></figure>
        <figure><canvas width="112" height="72"></canvas><figcaption>html-to-image 輸出</figcaption></figure></div></div>`).join("")}</div></div>`);
      const cards = ctx.$$(".hti-case");
      const judge = (c, canvas) => {
        const g = Showcase.h("canvas", { width: 112, height: 72 }).getContext("2d", { willReadFrequently: true });
        g.fillStyle = "#ff00ff"; // sentinel: an empty output must fail every test
        g.fillRect(0, 0, 112, 72);
        g.drawImage(canvas, 0, 0);
        return c.test(probe(g.getImageData(0, 0, 112, 72).data));
      };
      const run = serial(ctx, async () => {
        let ok = 0, total = 0;
        const bad = [];
        cards.forEach((c) => { const s = c.querySelector("header span"); s.textContent = "…"; s.className = ""; });
        for (const [i, c] of CASES.entries()) {
          const card = cards[i];
          const [canvas, t] = await timed(() => H.toCanvas(card.querySelector(".hti-tile"), { pixelRatio: 1, skipFonts: true }));
          if (!ctx.active) return;
          const g = card.querySelector("canvas").getContext("2d");
          g.clearRect(0, 0, 112, 72);
          g.drawImage(canvas, 0, 0);
          const pass = judge(c, canvas);
          ok += pass ? 1 : 0; total += t;
          if (!pass) bad.push(c.name);
          const v = card.querySelector("header span");
          v.textContent = pass ? "支援" : "不支援";
          v.className = pass ? "hti-ok" : "hti-no";
          ctx.$("[data-sum]").textContent = `${ok}／${i + 1}`;
          ctx.$("[data-note]").textContent = i + 1 < CASES.length ? "逐項轉換中…"
            : `項支援・${bad.length ? `未通過：${bad.join("、")}・` : ""}${CASES.length} 次轉換共 ${ms(total)}`;
        }
      }, (e) => { ctx.$("[data-note]").textContent = `轉換失敗：${e.message || e}`; });
      ctx.button("重新測試", () => run());
      run();
    } },

  { id: "cache", title: "cacheBust 與快取", api: "toPng(node, { cacheBust, includeQueryParams })；performance.getEntriesByType('resource')",
    desc: "節點裡的圖片會先用 fetch 下載再轉成 data URL 嵌入。html-to-image 有一份整頁共用的內部快取，鍵值預設去掉查詢字串；cacheBust 在網址加時間戳繞過瀏覽器快取，但只在內部快取沒命中時才會發出請求。",
    hint: "下表用 Resource Timing 記錄每次匯出時函式庫自己發出的 fetch；先換版本號，再分別開啟 includeQueryParams 或 cacheBust 匯出比較",
    mount(ctx) {
      try { performance.setResourceTimingBufferSize(2000); } catch (e) { /* older engines: default buffer is enough for a few exports */ }
      ctx.html(`<div class="hti-s7"><div class="hti-pane hti-fit"><div class="hti-post"><img alt="今日精選照片" src="${PIC}?v=1"><b>今日精選照片</b><small data-src></small></div></div>
        <div class="hti-pane hti-check hti-fit" data-out><span class="muted">尚未匯出</span></div>
        <div class="hti-log"><table><thead><tr><th>#</th><th>選項</th><th>圖片網址</th><th>html-to-image 發出的 fetch</th><th>耗時</th></tr></thead><tbody></tbody></table></div></div>`);
      const post = ctx.$(".hti-post"), img = post.querySelector("img"), body = ctx.$("tbody");
      let v = 1, bust = false, incl = false, n = 0;
      const srcLine = () => { ctx.$("[data-src]").textContent = `photo-7.jpg?v=${v}`; };
      srcLine();
      ctx.toggle("cacheBust", bust, (x) => { bust = x; });
      ctx.toggle("includeQueryParams", incl, (x) => { incl = x; });
      ctx.button("版本號 +1", () => { v++; img.src = `${PIC}?v=${v}`; srcLine(); });
      const go = serial(ctx, async () => {
        await img.decode().catch(() => {});
        const t0 = performance.now();
        const [u, t] = await timed(() => H.toPng(post, { pixelRatio: 1, skipFonts: true, cacheBust: bust, includeQueryParams: incl }));
        if (!ctx.active) return;
        const reqs = performance.getEntriesByType("resource").filter((e) => e.startTime >= t0 && e.initiatorType === "fetch" && e.name.includes("photo-7"));
        const how = reqs.length ? reqs.map((e) => {
          const name = e.name.split("/").pop();
          const kind = e.transferSize === 0 ? "瀏覽器 HTTP 快取" : e.encodedBodySize && e.transferSize < e.encodedBodySize ? "重新驗證（304）" : `網路下載 ${kb(e.transferSize)}`;
          return `${name}<br>${kind}`;
        }).join("<br>") : "沒有請求：命中 html-to-image 內部快取";
        const tag = [bust && "cacheBust", incl && "includeQueryParams"].filter(Boolean).join("＋") || "預設";
        const row = Showcase.h("tr");
        row.innerHTML = `<td class="m">${++n}</td><td>${tag}</td><td class="m">photo-7.jpg?v=${v}</td><td class="m">${how}</td><td class="m">${ms(t)}</td>`;
        body.prepend(row);
        const pic = imgOf(u, "匯出結果");
        ctx.$("[data-out]").replaceChildren(pic);
      }, (e) => { ctx.$("[data-out]").textContent = `匯出失敗：${e.message || e}`; });
      ctx.button("匯出", () => go(), { primary: true });
      (async () => { await go(); if (ctx.active) await go(); })();
    } },

  { id: "stress", title: "極限測試", kind: "stress", api: "toSvg／toPng／toJpeg(grid, { pixelRatio: 1, skipFonts: true })",
    desc: "逐級增加 DOM 節點數，每一級依序量 toSvg、toPng、toJpeg 三種輸出的耗時。複製時每個元素的所有計算後樣式都會寫進 style 屬性，所以 SVG 字串大小與耗時都隨節點數線性成長。",
    hint: "按「開始測試」；開啟「含文字」後每個節點多一個文字節點，比較耗時差異",
    mount(ctx) {
      ctx.html(`<div class="hti-stress"><div class="hti-o"><h3>原始 DOM<small data-n></small></h3><div class="hti-pane"><div class="hti-sgrid"></div></div></div>
        <div class="hti-o"><h3>PNG 輸出<small data-d></small></h3><div class="hti-pane hti-check hti-fit" data-out></div></div><canvas class="hti-schart"></canvas></div>`);
      ctx.controls.classList.add("bottom");
      let text = false;
      const grid = ctx.$(".hti-sgrid"), out = ctx.$("[data-out]"), chart = ctx.$(".hti-schart"), res = [];
      const KEYS = [["SVG", 1], ["PNG", 3], ["JPEG", 4]];
      ctx.toggle("含文字", text, (v) => { text = v; });
      const draw = () => {
        const [g, w, h] = fitCanvas(chart);
        g.font = `11px ${FONT}`; g.fillStyle = "#9b998f";
        if (!res.length) { g.fillText("每級三種格式的耗時會畫在這裡", 12, h / 2); return; }
        const max = Math.max(...res.flatMap((r) => r.t)), gw = Math.min(90, (w - 20) / res.length - 10), bw = gw / 3;
        res.forEach((r, i) => {
          const x = 12 + i * (gw + 10);
          r.t.forEach((v, j) => { const s = (h - 46) * v / max; g.fillStyle = C[KEYS[j][1]]; g.fillRect(x + j * bw, h - 18 - s, bw - 1, s); });
          g.fillStyle = "#9b998f"; g.font = `10px ${MONO}`; g.fillText(Showcase.fmtCompact(r.n), x, h - 5);
          g.fillStyle = "#ecebe6"; g.fillText(ms(Math.max(...r.t)), x, h - 22 - (h - 46) * Math.max(...r.t) / max);
        });
        g.font = `11px ${FONT}`;
        KEYS.forEach(([l, c], j) => { g.fillStyle = C[c]; g.fillText(`■ ${l}`, w - 150 + j * 48, 14); });
      };
      ctx.onResize(draw); draw();
      ctx.bench({
        label: "DOM 節點", unit: "個", sizes: [100, 300, 1000, 3000, 6000, 10000, 20000], target: 1000, budget: 6000,
        note: "每級的總耗時是三種格式相加。html-to-image 只複製目標節點（不像 html2canvas 複製整份文件），但每個元素都要讀一次 getComputedStyle 並逐項寫回，再把整份 SVG 做 URI 編碼；PNG 與 JPEG 還要等瀏覽器解析 SVG 圖片再畫進 canvas。",
        prepare(n) {
          const r = grid.getBoundingClientRect(), s = Math.max(3, Math.floor(Math.sqrt((r.width * r.height) / n)));
          grid.style.setProperty("--s", `${s}px`);
          let html = "";
          for (let i = 0; i < n; i++) html += `<i style="background:hsl(${(i * 7) % 360} 70% ${55 + (i % 3) * 8}%)">${text ? i % 100 : ""}</i>`;
          grid.innerHTML = html;
          ctx.$("[data-n]").textContent = ` ${n.toLocaleString()} 個節點・格子 ${s}px`;
        },
        async run(n) {
          const o = { pixelRatio: 1, skipFonts: true };
          const [svg, a] = await timed(() => H.toSvg(grid, o));
          const [png, b] = await timed(() => H.toPng(grid, o));
          const [, c] = await timed(() => H.toJpeg(grid, { ...o, quality: 0.8 }));
          out.replaceChildren(imgOf(png, "PNG 輸出"));
          ctx.$("[data-d]").textContent = ` SVG 字串 ${kb(svg.length)}`;
          res.push({ n, t: [a, b, c] });
          draw();
          return `SVG ${Math.round(a)}／PNG ${Math.round(b)}／JPEG ${Math.round(c)}`;
        },
      });
    } },
] });
</script>
</body>
</html>
