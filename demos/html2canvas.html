<script>
// html2canvas showcase: share card, scale/background, CSS support matrix, CORS images, clone hooks, windowWidth, node-count bench.
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim() || "sans-serif";
const MONO = css.getPropertyValue("--mono").trim() || "monospace";
const ART = "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r160/examples/textures/758px-Canestra_di_frutta_(Caravaggio).jpg";
const ms = (t) => `${Math.round(t)} ms`;
const kb = (n) => `${(n / 1024).toFixed(n < 10240 ? 1 : 0)} KB`;

async function snap(el, opts = {}) {
  const t0 = performance.now();
  const canvas = await html2canvas(el, { logging: false, ...opts });
  return { canvas, ms: performance.now() - t0 };
}
function blobOf(canvas, type = "image/png", q) {
  return new Promise((res, rej) => {
    try { canvas.toBlob((b) => (b ? res(b) : rej(new Error("toBlob 回傳空值"))), type, q); } catch (e) { rej(e); }
  });
}
// One object URL per owner; revoked on replace and on scene exit.
function urlKeeper(ctx) {
  let u = null;
  ctx.onCleanup(() => u && URL.revokeObjectURL(u));
  return (blob) => { if (u) URL.revokeObjectURL(u); u = URL.createObjectURL(blob); return u; };
}
function download(url, name) { const a = document.createElement("a"); a.href = url; a.download = name; a.click(); }
function fitCanvas(c) {
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, r.width, r.height);
  return [g, r.width, r.height];
}
function imgReady(img) { return img.complete ? Promise.resolve() : new Promise((r) => { img.onload = img.onerror = r; }); }

// ---------- shared CSS test items (same list as the html-to-image demo) ----------
const BOX = "left:12px;top:12px;width:88px;height:48px;";
const SVG_BAR = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="100"><rect width="300" height="100" fill="#1d4ed8"/></svg>');
const k = (style, inner = "", cls = "") => `<i class="h2-k ${cls}" style="${style}">${inner}</i>`;
const isRed = ([r, g, b]) => r > 170 && g < 120 && b < 130;
const isBlue = ([r, g, b]) => b > 150 && r < 110 && b > g + 60;
const isGreen = ([r, g, b]) => g > 150 && r < 90;
const isYellow = ([r, g, b]) => r > 200 && g > 150 && b < 150;
const isWhite = (p) => Math.min(...p) > 244;
const isBG = ([r, g, b]) => Math.abs(r - 239) <= 12 && Math.abs(g - 234) <= 12 && Math.abs(b - 223) <= 12;
const isDark = ([r, g, b]) => r + g + b < 300;
const CASES = [
  { name: "線性漸層", prop: "linear-gradient()", html: k(BOX + "background:linear-gradient(90deg,#e63946,#1d4ed8)"), test: (q) => isRed(q.p(16, 36)) && isBlue(q.p(96, 36)) },
  { name: "放射漸層", prop: "radial-gradient()", html: k(BOX + "background:radial-gradient(circle,#ffd166 0 35%,#1d4ed8 75%)"), test: (q) => isYellow(q.p(56, 36)) && isBlue(q.p(15, 15)) },
  { name: "圓錐漸層", prop: "conic-gradient()", html: k(BOX + "background:conic-gradient(#e63946 0 25%,#06d6a0 0 50%,#1d4ed8 0 75%,#ffd166 0)"), test: (q) => isRed(q.p(80, 22)) && isGreen(q.p(80, 50)) && isBlue(q.p(32, 50)) },
  { name: "外陰影", prop: "box-shadow", html: k("left:12px;top:10px;width:56px;height:34px;background:#fff;box-shadow:16px 14px 0 #1d4ed8"), test: (q) => isBlue(q.p(78, 52)) && !isBlue(q.p(20, 20)) },
  { name: "內陰影", prop: "box-shadow: inset", html: k(BOX + "background:#fff;box-shadow:inset 0 0 0 10px #e63946"), test: (q) => isRed(q.p(16, 36)) && isWhite(q.p(56, 36)) },
  { name: "圓角", prop: "border-radius", html: k(BOX + "background:#1d4ed8;border-radius:24px"), test: (q) => !isBlue(q.p(14, 14)) && isBlue(q.p(56, 36)) && isBlue(q.p(14, 36)) },
  { name: "文字陰影", prop: "text-shadow", html: k("left:14px;top:6px;font:900 44px/1 Arial,sans-serif;color:#222;text-shadow:7px 6px 0 #e63946", "Aa"), test: (q) => q.count(isRed) > 40 },
  { name: "旋轉變形", prop: "transform: rotate()", html: k("left:36px;top:16px;width:40px;height:40px;background:#1d4ed8;transform:rotate(45deg)"), test: (q) => !isBlue(q.p(38, 18)) && isBlue(q.p(56, 11)) },
  { name: "不透明度", prop: "opacity", html: k(BOX + "background:#1d4ed8;opacity:.35"), test: (q) => { const [r, , b] = q.p(56, 36); return r > 130 && r < 200 && b > 200; } },
  { name: "灰階濾鏡", prop: "filter: grayscale()", html: k(BOX + "background:#e63946;filter:grayscale(1)"), test: (q) => { const p = q.p(56, 36); return Math.max(...p) - Math.min(...p) < 16 && p[0] < 170; } },
  { name: "模糊濾鏡", prop: "filter: blur()", html: k("left:40px;top:20px;width:32px;height:32px;background:#1d4ed8;filter:blur(5px)"), test: (q) => { const [r, , b] = q.p(37, 36); return b > r + 15; } },

// Pixel probe over a 112x72 RGBA buffer.
function probe(d, W = 112, H = 72) {
  const p = (x, y) => { const i = (y * W + x) * 4; return [d[i], d[i + 1], d[i + 2]]; };
  return {
    p,
    count(fn, x0 = 0, y0 = 0, x1 = W, y1 = H) { let n = 0; for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) if (fn(p(x, y))) n++; return n; },
    bbox(fn) {
      let a = W, b = H, c = -1, e = -1;
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (fn(p(x, y))) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); e = Math.max(e, y); }
      return c < 0 ? null : { w: c - a + 1, h: e - b + 1 };
    },
  };
}

    mount(ctx) {
      const W = [375, 768, 1280];
      ctx.html(`<div class="h2-s6"><div class="h2-pane h2-live"><p data-vw></p><div class="h2-rwd"><header><b>工具圖鑑學院</b><nav><span>課程</span><span>講師</span><span>價格</span><span>登入</span></nav><span class="menu">選單</span></header>
        <div class="hero"><h2>秋季前端課程開放報名</h2><p>從 DOM 截圖到資料視覺化，三門課帶你做出能分享的作品。</p></div>
        <div class="body"><div class="cards"><div><b>Canvas 創意程式</b><span>18 小時・台北</span></div><div><b>資料視覺化實戰</b><span>30 小時・線上</span></div><div><b>網頁動畫入門</b><span>12 小時・台中</span></div></div><aside>早鳥優惠<br>10/31 前報名 85 折</aside></div></div></div>
        <div class="h2-outs">${W.map((w) => `<div class="h2-o"><div class="h2-pane h2-check h2-fit" data-o="${w}"></div><div class="h2-info" data-i="${w}">windowWidth ${w}</div></div>`).join("")}</div></div>`);
      const rwd = ctx.$(".h2-rwd"), live = ctx.$(".h2-live");
      const fit = () => { rwd.style.transform = `scale(${live.clientWidth / window.innerWidth})`; ctx.$("[data-vw]").textContent = `目前視窗 ${window.innerWidth} px（縮放預覽）`; };
      ctx.onResize(fit); fit();
      ctx.button("重新截圖", () => run(), { primary: true });
      let token = 0;
      async function run() {
        const my = ++token;
        for (const w of W) {
          const { canvas, ms: t } = await snap(rwd, { scale: 1, windowWidth: w, onclone: (doc, el) => { el.style.transform = "none"; } });
          if (!ctx.active || my !== token) return;
          ctx.$(`[data-o="${w}"]`).replaceChildren(canvas);
          ctx.$(`[data-i="${w}"]`).innerHTML = `windowWidth ${w} → <b>${canvas.width}×${canvas.height}</b>・${ms(t)}`;
        }
      }
      run();
    } },

  { id: "stress", title: "極限測試", kind: "stress", api: "html2canvas(grid, { scale: 1, ignoreElements, onclone })",
    desc: "逐級增加 DOM 節點數，量一次截圖的耗時，並用 onclone 的時間點把它拆成「複製文件」與「解析繪製」兩段。",
    hint: "按「開始測試」；開啟「含文字」後每個節點多一個文字節點，比較耗時差異",
    mount(ctx) {
      ctx.html(`<div class="h2-stress"><div class="h2-col"><h3>原始 DOM<small data-n></small></h3><div class="h2-pane"><div class="h2-sgrid"></div></div></div>
        <div class="h2-col"><h3>html2canvas 輸出<small data-d></small></h3><div class="h2-pane h2-check h2-fit" data-out></div></div><canvas class="h2-schart"></canvas></div>`);
      ctx.controls.classList.add("bottom");
      let text = false;
      const grid = ctx.$(".h2-sgrid"), out = ctx.$("[data-out]"), chart = ctx.$(".h2-schart"), res = [];
      ctx.toggle("含文字", text, (v) => { text = v; });
      const draw = () => {
        const [g, w, h] = fitCanvas(chart);
        g.font = `11px ${FONT}`; g.fillStyle = "#9b998f";
        if (!res.length) { g.fillText("每級的「複製文件／解析繪製」耗時會畫在這裡", 12, h / 2); return; }
        const max = Math.max(...res.map((r) => r.a + r.b)), bw = Math.min(70, (w - 20) / res.length - 8);
        res.forEach((r, i) => {
          const x = 12 + i * (bw + 8), sa = (h - 46) * r.a / max, sb = (h - 46) * r.b / max;
          g.fillStyle = C[1]; g.fillRect(x, h - 18 - sa, bw, sa);
          g.fillStyle = C[4]; g.fillRect(x, h - 18 - sa - sb, bw, sb);
          g.fillStyle = "#9b998f"; g.font = `10px ${MONO}`; g.fillText(Showcase.fmtCompact(r.n), x, h - 5);
          g.fillStyle = "#ecebe6"; g.fillText(ms(r.a + r.b), x, h - 22 - sa - sb);
        });
        g.font = `11px ${FONT}`; g.fillStyle = C[1]; g.fillText("■ 複製文件", w - 160, 14); g.fillStyle = C[4]; g.fillText("■ 解析繪製", w - 82, 14);
      };
      ctx.onResize(draw); draw();
      ctx.bench({
        label: "DOM 節點", unit: "個", sizes: [100, 300, 1000, 3000, 6000, 10000, 20000], target: 1000, budget: 2500,
        note: "html2canvas 每次都會把整份文件（不只目標元素）複製進 iframe，再逐節點讀取計算後樣式重畫，所以耗時隨頁面總節點數成長；文字需要逐字量測換行，比純色塊慢。這裡用 ignoreElements 排除右側輸出區，避免上一張大畫布被一起複製。",
        prepare(n) {
          const r = grid.getBoundingClientRect(), s = Math.max(3, Math.floor(Math.sqrt((r.width * r.height) / n)));
          grid.style.setProperty("--s", `${s}px`);
          let html = "";
          for (let i = 0; i < n; i++) html += `<i style="background:hsl(${(i * 7) % 360} 70% ${55 + (i % 3) * 8}%)">${text ? i % 100 : ""}</i>`;
          grid.innerHTML = html;
          ctx.$("[data-n]").textContent = ` ${n.toLocaleString()} 個節點・格子 ${s}px`;
        },
        async run(n) {
          let tc = 0;
          const t0 = performance.now();
          const canvas = await html2canvas(grid, { scale: 1, logging: false, backgroundColor: null, ignoreElements: (el) => el === out, onclone: () => { tc = performance.now(); } });
          const t1 = performance.now();
          out.replaceChildren(canvas);
          ctx.$("[data-d]").textContent = ` ${canvas.width}×${canvas.height}`;
          res.push({ n, a: tc - t0, b: t1 - tc });
          draw();
          return `複製 ${Math.round(tc - t0)}／繪製 ${Math.round(t1 - tc)}`;
        },
      });
    } },
] });
</script>
</body>
</html>
