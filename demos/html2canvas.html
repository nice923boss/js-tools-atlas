<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>html2canvas 示範：活動分享卡截圖</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":[],"note":"卡片文字可直接點擊編輯，按產生後輸出 PNG"}</script>
<style>
  body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; padding: 14px 14px 46px; height: 100%; }
  .stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
  .scaler { position: absolute; left: 50%; top: 50%; width: 360px; height: 450px; transform: translate(-50%, -50%); }
  .card {
    --tone: #ff8c42;
    position: relative; width: 360px; height: 450px; border-radius: 22px; overflow: hidden; color: #fff;
    font-family: var(--font); background: #222; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
  }
  .photo { position: absolute; inset: 0; background: center / cover no-repeat; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0.15) 0%, rgba(0, 0, 0, 0.05) 35%, rgba(8, 8, 12, 0.88) 78%); }
  .content { position: absolute; inset: 0; padding: 22px; display: flex; flex-direction: column; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .tag { background: var(--tone); color: #15120d; font-weight: 700; font-size: 12px; padding: 5px 11px; border-radius: 999px; }
  .date { text-align: right; font-weight: 700; font-size: 12px; letter-spacing: .12em; line-height: 1.25; }
  .date b { display: block; font-size: 26px; letter-spacing: 0; }
  .spacer { flex: 1; }
  .card h1 { margin: 0; font-size: 34px; line-height: 1.15; font-weight: 800; outline: none; }
  .card p { margin: 10px 0 14px; font-size: 13px; line-height: 1.6; color: rgba(255, 255, 255, 0.82); outline: none; }
  .card [contenteditable]:focus { box-shadow: 0 0 0 2px var(--tone); border-radius: 4px; }
  .chips { display: flex; gap: 6px; }
  .chips span { font-size: 12px; padding: 4px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.22); }
  .foot { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.18); font-size: 12px; }
  .seats { flex: 1; }
  .seats .track { height: 6px; border-radius: 6px; background: rgba(255, 255, 255, 0.2); margin-top: 5px; overflow: hidden; }
  .seats .track i { display: block; height: 100%; width: 70%; background: var(--tone); border-radius: 6px; }
  .go { background: #fff; color: #15120d; font-weight: 800; padding: 8px 14px; border-radius: 10px; font-size: 13px; }

  aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  aside h2 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .thumbs button { all: unset; cursor: pointer; aspect-ratio: 1; border-radius: 8px; background: center / cover; border: 2px solid transparent; }
  .thumbs button.on { border-color: var(--accent); }
  .tones { display: flex; gap: 8px; align-items: center; }
  .tones button { all: unset; cursor: pointer; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--bg); box-shadow: 0 0 0 1px var(--line); }
  .tones button.on { box-shadow: 0 0 0 2px var(--fg); }
  .tones select { margin-left: auto; background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .actions { display: flex; gap: 8px; }
  .actions .btn { flex: 1; }
  .result { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
  .result .box { flex: 1; min-height: 0; display: grid; place-items: center; border-radius: 10px; border: 1px dashed var(--line); background: repeating-conic-gradient(#1b1e23 0 25%, #14161a 0 50%) 0 0 / 16px 16px; }
  .result img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .result .box { position: relative; overflow: hidden; }
  .result .info { font: 12px var(--mono); color: var(--muted); }
  .flash { animation: flash .6s; }
  @keyframes flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }

  @media (max-width: 640px) {
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; padding: 10px 10px 42px; gap: 8px; }
    aside { flex-direction: row; flex-wrap: wrap; gap: 8px; }
    aside > section.pick { display: none; }
    .tones-sec { flex: 1 1 100%; }
    aside h2 { display: none; }
    .actions { flex: 1; }
    .result { flex: 0 0 100%; flex-direction: row; align-items: center; height: 74px; }
    .result .box { flex: 0 0 60px; height: 74px; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="scaler" id="scaler">
    <div class="card" id="card">
      <div class="photo" id="photo"></div>
      <div class="shade"></div>
      <div class="content">
        <div class="top">
          <span class="tag">週末健行團</span>
          <div class="date">NOV<b>16</b>星期六</div>
        </div>
        <div class="spacer"></div>
        <h1 contenteditable="true" spellcheck="false">紅岩峽谷<br>日出健行</h1>
        <p contenteditable="true" spellcheck="false">清晨五點集合，走進被晨光點亮的紅色岩壁，用雙腳讀懂大地的紋理。</p>
        <div class="chips"><span>8.2 公里</span><span>中等難度</span><span>含早餐</span></div>
        <div class="foot">
          <div class="seats">已報名 14 / 20 人<div class="track"><i></i></div></div>
          <span class="go">立即報名</span>
        </div>
      </div>
    </div>
  </div>
</div>
<aside>
  <section class="pick">
    <h2>背景照片</h2>
    <div class="thumbs" id="thumbs"></div>
  </section>
  <section class="tones-sec">
    <h2>主題色與輸出倍率</h2>
    <div class="tones" id="tones">
      <select id="scale" aria-label="輸出倍率">
        <option value="1">1 倍</option>
        <option value="2">2 倍</option>
        <option value="3" selected>3 倍</option>
      </select>
    </div>
  </section>
  <div class="actions">
    <button class="btn primary" id="shot">產生圖片</button>
    <button class="btn" id="dl" disabled>下載 PNG</button>
  </div>
  <section class="result">
    <h2>截圖結果</h2>
    <div class="box" id="box"><span class="muted">尚未產生</span></div>
    <div class="info" id="info"></div>
  </section>
</aside>
<div class="hint">直接點卡片改標題與內文，再按「產生圖片」</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// html2canvas: re-renders a live DOM block (CSS gradients, background images, editable text) onto a <canvas>.
const PHOTOS = ["photo-2", "photo-1", "photo-5", "photo-3"];
const TONES = ["#ff8c42", "#f7df1e", "#4cc9f0", "#f72585", "#7bd389"];
const $ = (id) => document.getElementById(id);
const card = $("card");
let lastUrl = null;

PHOTOS.forEach((p, i) => {
  const b = document.createElement("button");
  b.style.backgroundImage = `url(_shared/img/${p}.jpg)`;
  b.setAttribute("aria-label", `背景 ${i + 1}`);
  b.onclick = () => setPhoto(i);
  $("thumbs").append(b);
});
TONES.forEach((c, i) => {
  const b = document.createElement("button");
  b.style.background = c;
  b.setAttribute("aria-label", `主題色 ${i + 1}`);
  b.onclick = () => setTone(i);
  $("tones").insertBefore(b, $("scale"));
});

function setPhoto(i) {
  $("photo").style.backgroundImage = `url(_shared/img/${PHOTOS[i]}.jpg)`;
  [...$("thumbs").children].forEach((b, j) => b.classList.toggle("on", i === j));
}
function setTone(i) {
  card.style.setProperty("--tone", TONES[i]);
  [...$("tones").querySelectorAll("button")].forEach((b, j) => b.classList.toggle("on", i === j));
}

function fit() {
  const r = $("stage").getBoundingClientRect();
  const k = Math.min(1.25, (r.width - 8) / 360, (r.height - 8) / 450);
  $("scaler").style.transform = `translate(-50%, -50%) scale(${Math.max(0.3, k)})`;
}
addEventListener("resize", fit);

async function shoot() {
  const scale = Number($("scale").value);
  $("shot").disabled = true;
  $("shot").textContent = "產生中…";
  const t0 = performance.now();
  try {
    const canvas = await html2canvas(card, {
      scale,
      backgroundColor: null,
      useCORS: true,
      logging: false,
      // The on-screen preview is scaled with CSS; capture the card at its natural size.
      onclone: (doc) => { doc.getElementById("scaler").style.transform = "translate(-50%, -50%)"; },
    });
    const ms = Math.round(performance.now() - t0);
    const blob = await new Promise((res) => canvas.toBlob(res, "image/png"));
    if (lastUrl) URL.revokeObjectURL(lastUrl);
    lastUrl = URL.createObjectURL(blob);
    const img = new Image();
    img.src = lastUrl;
    img.alt = "html2canvas 產生的分享卡";
    $("box").replaceChildren(img);
    $("box").classList.remove("flash");
    void $("box").offsetWidth;
    $("box").classList.add("flash");
    $("info").textContent = `${canvas.width} × ${canvas.height} px・${(blob.size / 1024).toFixed(0)} KB・${ms} ms`;
    $("dl").disabled = false;
  } catch (err) {
    $("info").textContent = `截圖失敗：${err.message}`;
    console.error(err);
  } finally {
    $("shot").disabled = false;
    $("shot").textContent = "產生圖片";
  }
}

$("shot").onclick = shoot;
$("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = lastUrl;
  a.download = "share-card.png";
  a.click();
};

setPhoto(0);
setTone(0);
fit();
// Wait for the background photo before the first automatic capture.
const pre = new Image();
pre.onload = pre.onerror = () => shoot();
pre.src = `_shared/img/${PHOTOS[0]}.jpg`;
</script>
</body>
</html>
