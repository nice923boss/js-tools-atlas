<style>

    .hq-s5 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 40%) minmax(0, 60%); gap: 6px; }

  .hq-sgrid figure { margin: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }

<body class="paper">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// html5-qrcode showcase. Every result on this page comes from real decoding of images
// (sample tickets, or codes generated with qrcode-generator / JsBarcode). The camera scenes
// only start after a button press and report honestly when no camera exists.
const { fmt, fmtMs, h } = Showcase;
const F = Html5QrcodeSupportedFormats;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const now = () => new Date().toLocaleTimeString("zh-TW", { hour12: false });
let uid = 0;

// A hidden element for each Html5Qrcode instance (the library draws its work canvas there)
function scannerIn(ctx, cfg = {}) {
  const d = h("div", { class: "hq-hide", id: `hq-r${++uid}` });
  ctx.el.append(d);
  return new Html5Qrcode(d.id, { verbose: false, ...cfg });
}
async function scan(sc, file) {
  const t0 = performance.now();
  try {
    const r = await sc.scanFileV2(file, false);
    return { ok: true, text: r.decodedText, format: r.result?.format?.formatName ?? "?", decoder: r.result?.debugData?.decoderName ?? "?", raw: r, ms: performance.now() - t0 };
  } catch (e) {
    return { ok: false, err: String(e?.message ?? e), ms: performance.now() - t0 };
  }
}
const zhErr = (err) => /No MultiFormat Readers/.test(err) ? "找不到可辨識的條碼" : err;
const toFile = (cv, type = "image/png", q) => new Promise((res) => cv.toBlob((b) => res(new File([b], type === "image/png" ? "x.png" : "x.jpg", { type })), type, q));
const urlFile = async (url) => new File([await (await fetch(url)).blob()], url.split("/").pop(), { type: "image/png" });
function qrCanvas(text, { scale = 6, ec = "M", quiet = 4 } = {}) {
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const q = qrcode(0, ec); q.addData(text); q.make();
  const n = q.getModuleCount(), cv = document.createElement("canvas");
  cv.width = cv.height = (n + quiet * 2) * scale;
  const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = "#000";
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (q.isDark(i, j)) g.fillRect((j + quiet) * scale, (i + quiet) * scale, scale, scale);
  return cv;
}
function barCanvas(format, value, opts = {}) {
  const cv = document.createElement("canvas");
  JsBarcode(cv, value, { format, width: 2, height: 70, margin: 16, fontSize: 16, ...opts });
  return cv;
}
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const TICKETS = [1, 2, 3].map((i) => `assets/html5-qrcode/ticket-${i}.png`);
const GUESTS = [
  { code: "ATLAS2026-A07", name: "王小明", seat: "A 區 07" }, { code: "ATLAS2026-B12", name: "陳雅婷", seat: "B 區 12" },
  { code: "ATLAS2026-C03", name: "林志豪", seat: "C 區 03" }, { code: "ATLAS2026-A15", name: "張家瑜", seat: "A 區 15" },
  { code: "ATLAS2026-B02", name: "李承恩", seat: "B 區 02" }, { code: "ATLAS2026-C21", name: "黃怡君", seat: "C 區 21" },
];
// A photo-like picture with no code in it
function noCodeCanvas() {
  const cv = document.createElement("canvas"); cv.width = 460; cv.height = 220;
  const g = cv.getContext("2d");
  const gr = g.createLinearGradient(0, 0, 460, 220); gr.addColorStop(0, "#f7d9a8"); gr.addColorStop(1, "#8ec5d6");
  g.fillStyle = gr; g.fillRect(0, 0, 460, 220);
  g.fillStyle = "rgba(255,255,255,.7)"; g.beginPath(); g.arc(360, 70, 40, 0, 7); g.fill();
  g.fillStyle = "#3d6b4f"; g.beginPath(); g.moveTo(0, 220); g.lineTo(140, 90); g.lineTo(260, 220); g.fill();
  g.fillStyle = "#1c1c1a"; g.font = "bold 22px sans-serif"; g.fillText("會場外景照片", 24, 40);
  return cv;
}

Showcase.run({ scenes: [
  // ---------- 1. check-in ----------
  {
    id: "checkin", title: "活動報到", paper: true,
    api: "new Html5Qrcode(id).scanFileV2(file, false) → { decodedText, result }",
    desc: "從圖片解碼的報到流程：點下方任一張圖，scanFileV2 把圖片交給 ZXing 解碼，回傳文字、格式名稱與解碼器。同一套流程同時接受 QR Code 與一維條碼（貼紙是 Code 128）；不是報到碼、重複報到、圖中沒有條碼都會照實顯示。下方是函式庫回傳的原始結果物件。",
    hint: "點下方票券、條碼或照片；也可以上傳自己的圖片",
    async mount(ctx) {
      const samples = [
        ...TICKETS.map((u, i) => ({ label: `票券 ${i + 1}`, src: u })),
        { label: "條碼貼紙", cv: barCanvas("CODE128", "ATLAS2026-A15", { height: 60 }) },
        { label: "外部 QR", cv: qrCanvas("https://example.com/coupon/2026", { scale: 5 }) },
        { label: "無碼照片", cv: noCodeCanvas() },
      ];
      for (const s of samples) if (s.cv) s.src = s.cv.toDataURL();
      ctx.html(`<div class="hq-wrap hq-s1">
        <div class="hq-pane"><h3><b>掃描台</b><span class="r hq-st">等待掃描</span></h3>
          <div class="hq-view"><img alt="最近掃描的圖片"><div class="hq-flash"></div><div class="hq-toast"></div></div>
          <pre class="hq-code hq-json">// scanFileV2 的回傳值會顯示在這裡</pre>
          <div class="hq-samples">${samples.map((s, i) => `<button type="button" data-i="${i}"><img src="${s.src}" alt=""><span>${s.label}</span></button>`).join("")}
            <label><b>＋</b><span>上傳圖片</span><input type="file" accept="image/*" hidden></label></div></div>
        <div class="hq-pane"><div class="hq-sum">已報到（示意資料）<br><b class="hq-cnt">0</b> / ${GUESTS.length}<div class="hq-meter"><i></i></div></div>
          <div class="hq-guests"></div><div class="hq-log"></div></div></div>`);
      const sc = scannerIn(ctx);
      const checked = new Map();
      const view = ctx.$(".hq-view img"), flash = ctx.$(".hq-flash"), toast = ctx.$(".hq-toast"), logEl = ctx.$(".hq-log");
      const guests = () => {
        ctx.$(".hq-guests").innerHTML = GUESTS.map((g) => `<div class="hq-g${checked.has(g.code) ? " in" : ""}"><span>${g.name}　<small>${g.seat}</small></span><span class="st">${checked.has(g.code) ? `✓ ${checked.get(g.code)}` : "未報到"}</span><small>${g.code}</small></div>`).join("");
        ctx.$(".hq-cnt").textContent = checked.size;
        ctx.$(".hq-meter i").style.width = `${(checked.size / GUESTS.length) * 100}%`;
      };
      const log = (cls, msg, r) => logEl.prepend(h("div", {}, h("time", { text: now() }), r.ok ? h("span", { class: "hq-chip", text: r.format }) : null, " ", h("span", { class: cls, text: msg }), h("span", { class: "hq-num", style: "color:var(--muted)", text: `・${fmtMs(r.ms)}` })));
      const feedback = (ok, msg) => { flash.className = "hq-flash"; void flash.offsetWidth; flash.className = `hq-flash ${ok ? "ok" : "bad"}`; toast.textContent = msg; };
      let busy = false;
      const run = async (file, src) => {
        if (busy) return;
        busy = true;
        view.src = src;
        ctx.$(".hq-st").textContent = "解碼中…";
        const r = await scan(sc, file);
        busy = false;
        if (!ctx.active) return;
        ctx.$(".hq-st").textContent = `${r.ok ? "解碼成功" : "解碼失敗"}・${fmtMs(r.ms)}`;

  {

    hint: "切換格數與重疊，或按「重新排列」換一張海報",
    mount(ctx) {

      const ro = new ResizeObserver(fit); ro.observe(stage); ctx.onCleanup(() => ro.disconnect());

        const R = rng(seed);

        g.fillStyle = "#d61f69"; g.fillRect(0, 0, W, 10);
        g.fillStyle = "#1c1c1a"; g.font = "bold 30px sans-serif"; g.fillText("JS 工具圖鑑年會 2026・會場資訊", 30, 58);
        g.fillStyle = "#8a877d"; g.font = "16px sans-serif"; g.fillText("報到、地圖、議程與周邊兌換都請掃描下方的碼（示意海報）", 30, 88);
        const imgs = await Promise.all([TICKETS[0], TICKETS[1]].map((u) => new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.src = u; })));
        const src = [
          { el: imgs[0], w: 300, h: 143, text: "ATLAS2026-A07" },
          { el: imgs[1], w: 300, h: 143, text: "ATLAS2026-B12" },
          { el: barCanvas("CODE128", "ATLAS2026-C21", { height: 56 }), w: 0, h: 0, text: "ATLAS2026-C21" },
          { el: qrCanvas("https://example.com/map", { scale: 4 }), w: 0, h: 0, text: "https://example.com/map" },
        ];
        items = [];
        for (const s of src) {
          const w = s.w || s.el.width * 0.75, hh = s.h || s.el.height * 0.75;
          let x = 0, y = 0;
          for (let k = 0; k < 300; k++) {
            x = 20 + R() * (W - w - 40); y = 110 + R() * (H - hh - 130);
            if (!items.some((o) => x < o.x + o.w + 16 && o.x < x + w + 16 && y < o.y + o.h + 16 && o.y < y + hh + 16)) break;
          }
          g.drawImage(s.el, x, y, w, hh);
          items.push({ x, y, w, h: hh, text: s.text });
        }

        const found = new Map(), crop = document.createElement("canvas");
        crop.width = Math.round(tw); crop.height = Math.round(th);
        const cg = crop.getContext("2d");
        const t0 = performance.now();
        for (const t of tiles) {
          cg.fillStyle = "#fff"; cg.fillRect(0, 0, crop.width, crop.height);
          cg.drawImage(cv, t.x, t.y, tw, th, 0, 0, crop.width, crop.height);
          const r = await scan(sc, await toFile(crop));

          ov.append(tile);
          if (r.ok) {
            const f = found.get(r.text);
            const box = { x0: t.x, y0: t.y, x1: t.x + tw, y1: t.y + th };
            if (!f) found.set(r.text, { ...box, n: 1, format: r.format });
            else found.set(r.text, { x0: Math.max(f.x0, box.x0), y0: Math.max(f.y0, box.y0), x1: Math.min(f.x1, box.x1), y1: Math.min(f.y1, box.y1), n: f.n + 1, format: f.format });
          }
        }
        const ms = performance.now() - t0;
        for (const [text, f] of found) ov.append(h("div", { class: "hq-box est", style: pct(f.x0, f.y0, f.x1 - f.x0, f.y1 - f.y0) }, h("span", { text: text.length > 16 ? `${text.slice(0, 15)}…` : text })));
        ctx.$(".hq-sum3").textContent = `找到 ${found.size}／${items.length}`;

          + [...found].map(([text, f]) => `<div><span class="hq-chip">${f.format}</span> ${esc(text)}<br><span class="hq-num" style="color:var(--muted)">x ${Math.round(f.x0)} 到 ${Math.round(f.x1)}・y ${Math.round(f.y0)} 到 ${Math.round(f.y1)}・${f.n} 格命中</span></div>`).join("")
          + items.filter((o) => !found.has(o.text)).map((o) => `<div class="hq-bad">漏掉：${esc(o.text)}（被格線切開）</div>`).join(""));
      };
      ctx.group(GRIDS.map(([c, r]) => `${c}×${r} 格`), grid, (i) => { grid = i; run(); });
      ctx.toggle("格子重疊 50%", overlap, (v) => { overlap = v; run(); });

    },
  },

  {

    hint: "拖動右側滑桿，或點上方情境套用參數",
    mount(ctx) {
      const DEF = { rot: 0, blur: 0, noise: 0, contrast: 100, size: 240, invert: false };
      const PRESETS = [
        ["原圖", {}], ["旋轉 45°", { rot: 45, size: 200 }], ["模糊 6px", { blur: 6 }], ["雜訊 ±30", { noise: 30 }],

        const im = g.getImageData(0, 0, S, S), d = im.data, R = rng(42), c = p.contrast / 100;

      const sc = new Html5Qrcode(rid, { verbose: false });
      ctx.onCleanup(() => { if (sc.isScanning) sc.stop().catch(() => {}); });
      await ctx.gate({ icon: "📷", title: "鏡頭掃描", desc: "按下後呼叫 Html5Qrcode.getCameras()，瀏覽器會詢問鏡頭權限。沒有鏡頭時會照實顯示錯誤。", tags: ["需要鏡頭權限", "HTTPS 或 localhost"], button: "偵測並開啟鏡頭" });
      let cams;
      try { cams = await Html5Qrcode.getCameras(); } catch (e) {
        if (!ctx.active) return;
        const s = String(e?.message ?? e);
        rows.push(["getCameras()", `<span class='hq-bad'>${esc(s.slice(0, 80))}</span>`]); paint();
        const why = /NotFound|not found/i.test(s) ? "找不到鏡頭：這台電腦沒有可用的鏡頭，或是在無頭瀏覽器中執行。"
          : /NotAllowed|Permission/i.test(s) ? "鏡頭權限被拒絕：請在網址列的權限設定中允許鏡頭。"
          : /NotReadable/i.test(s) ? "鏡頭被其他程式占用。" : "無法取得鏡頭清單。";
        msg.className = "hq-msg bad"; msg.textContent = `${why}這裡不會產生任何掃描結果；改用「活動報到」等場景的圖片解碼。`;
        ctx.$(".hq-cst").textContent = "無法使用鏡頭";
        ctx.$(".hq-pht").textContent = why;
        return;
      }
      if (!ctx.active) return;
      rows.push(["getCameras()", `<span class='hq-ok'>${cams.length} 個鏡頭</span>`]);
      cams.forEach((c, i) => rows.push([`鏡頭 ${i + 1}`, esc(c.label || c.id.slice(0, 12))]));
      paint();
      if (!cams.length) { msg.className = "hq-msg bad"; msg.textContent = "清單是空的：沒有可用鏡頭。"; return; }
      const camLog = ctx.$(".hq-camlog");
      let last = "", lastAt = 0;
      try {
        await sc.start(cams[cams.length - 1].id, { fps: 10, qrbox: (w, hh) => { const s = Math.floor(Math.min(w, hh) * 0.7); return { width: s, height: s }; } }, (text, result) => {
          if (text === last && Date.now() - lastAt < 2500) return;
          last = text; lastAt = Date.now();
          camLog.prepend(h("div", {}, h("time", { text: now() }), h("span", { class: "hq-chip", text: result?.result?.format?.formatName ?? "?" }), ` ${text}`));
        }, () => {});
        if (!ctx.active) return;
        ctx.$(".hq-cam").classList.add("on");
        ctx.$(".hq-cst").textContent = "掃描中（每秒 10 次）";
        msg.className = "hq-msg"; msg.textContent = "把 QR Code 或條碼對準中央的掃描框；結果會列在下方。";
        ctx.button("停止鏡頭", async () => { if (sc.isScanning) await sc.stop(); ctx.$(".hq-cam").classList.remove("on"); ctx.$(".hq-cst").textContent = "已停止"; });
      } catch (e) {
        msg.className = "hq-msg bad"; msg.textContent = `start() 失敗：${String(e?.message ?? e).slice(0, 120)}`;
      }
    },
  },

  // ---------- 6. built-in scanner UI ----------
  {
    id: "scanner-ui", title: "內建掃描器介面", paper: true,
    api: "new Html5QrcodeScanner(id, { supportedScanTypes, fps, qrbox }).render(onSuccess, onError)",
    desc: "除了底層的 Html5Qrcode，函式庫還附了一套現成介面 Html5QrcodeScanner：一行 render() 就有選檔、拖放圖片與切換鏡頭的按鈕（介面文字是英文，樣式由函式庫內嵌）。這裡把 supportedScanTypes 設成檔案優先，所以開場不會請求鏡頭；點 Scan using camera directly 才會詢問權限。",
    hint: "按 Choose Image 選一張含條碼的圖片（可先存下範例票券）",
    mount(ctx) {
      const rid = `hq-ui${++uid}`;
      ctx.html(`<div class="hq-wrap hq-s6"><div class="hq-pane"><h3><b>Html5QrcodeScanner 產生的介面</b></h3><div class="hq-ui"><div id="${rid}"></div></div></div>
        <div class="hq-pane"><h3><b>設定與結果</b></h3><div class="hq-scroll"><pre class="hq-code">new Html5QrcodeScanner("${rid}", {
  fps: 10,
  qrbox: 220,
  rememberLastUsedCamera: false,
  supportedScanTypes: [
    Html5QrcodeScanType.SCAN_TYPE_FILE,
    Html5QrcodeScanType.SCAN_TYPE_CAMERA,
  ],
}, false).render(onSuccess, onError);</pre><div class="hq-note">結果：</div><div class="hq-log hq-uilog"><div class="hq-note">還沒有掃描結果</div></div></div></div></div>`);
      const sc = new Html5QrcodeScanner(rid, { fps: 10, qrbox: 220, rememberLastUsedCamera: false, supportedScanTypes: [Html5QrcodeScanType.SCAN_TYPE_FILE, Html5QrcodeScanType.SCAN_TYPE_CAMERA] }, false);
      const logEl = ctx.$(".hq-uilog");
      sc.render((text, result) => {
        logEl.querySelector(".hq-note")?.remove();
        logEl.prepend(h("div", {}, h("time", { text: now() }), h("span", { class: "hq-chip", text: result?.result?.format?.formatName ?? "?" }), ` ${text}`));
      }, () => {});
      ctx.onCleanup(() => { sc.clear().catch(() => {}); });
    },
  },

  // ---------- 7. stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "scanFileV2(file) × 8・圖片邊長 200 到 4800 px",
    desc: "每一級產生 8 張不同內容的 QR 圖（碼占圖寬 30%），依序交給 scanFileV2，量平均解碼時間與成功率。scanFileV2 會把整張圖畫到內部 canvas 再做二值化，所以圖越大越慢（長條時間是 8 張合計）；碼太小或圖太大時成功率都可能下降；只認 QR_CODE 少試一維格式，通常會快一些。加干擾會隨機旋轉並模糊，看小圖的成功率掉多少。",
    hint: "按左側「開始測試」；切換底部格式設定或干擾再測一次",
    mount(ctx) {
      ctx.html(`<div class="hq-stress"><div class="hq-bar"><span class="hq-pill">尚未測試：右側會顯示這一級的 8 張圖與解碼結果</span></div><div class="hq-sgrid"></div></div>`);
      ctx.controls.classList.add("bottom");
      let fm = 0, hard = false;
      ctx.group(["全部格式", "只認 QR_CODE"], 0, (i) => { fm = i; });
      ctx.toggle("加干擾（旋轉＋模糊）", false, (v) => { hard = v; });
      const scanners = [scannerIn(ctx), scannerIn(ctx, { formatsToSupport: [F.QR_CODE] })];
      const grid = ctx.$(".hq-sgrid"), bar = ctx.$(".hq-bar");
      const K = 8;
      ctx.bench({
        label: "圖片邊長", unit: "px", sizes: [200, 400, 800, 1600, 2400, 3200, 4800], target: 1000, budget: 5000, format: (n) => fmt(n),
        async prepare(side) {
          const R = rng(side), items = [];
          for (let k = 0; k < K; k++) {
            const text = `ATLAS-${side}-${k}-${Math.floor(R() * 1e6)}`;
            const cv = document.createElement("canvas"); cv.width = cv.height = side;
            const g = cv.getContext("2d");
            g.fillStyle = "#fff"; g.fillRect(0, 0, side, side);
            if (hard) g.filter = `blur(${(side / 500).toFixed(2)}px)`;
            g.translate(side * (0.3 + R() * 0.4), side * (0.3 + R() * 0.4));
            if (hard) g.rotate(((10 + R() * 35) * Math.PI) / 180);
            const q = qrCanvas(text, { scale: 4, quiet: 2 }), s = side * 0.3;
            g.drawImage(q, -s / 2, -s / 2, s, s);
            const th = document.createElement("canvas"); th.width = th.height = 120;
            th.getContext("2d").drawImage(cv, 0, 0, 120, 120);
            items.push({ text, file: await toFile(cv, "image/jpeg", 0.92), th });
          }
          return items;
        },
        async run(side, items) {
          const sc = scanners[fm], out = [];
          let ok = 0, sum = 0;
          for (const it of items) {
            const r = await scan(sc, it.file);
            const good = r.ok && r.text === it.text;
            ok += good; sum += r.ms;
            out.push({ it, r, good });
          }
          grid.replaceChildren(...out.map(({ it, r, good }) => h("figure", {}, it.th, h("figcaption", { class: good ? "hq-ok" : "hq-bad", text: `${good ? "✓" : "✗"} ${fmtMs(r.ms)}` }))));
          bar.innerHTML = `<span class="hq-pill">${fm ? "只認 QR_CODE" : "全部格式"}${hard ? "＋干擾" : ""}・邊長 <b>${fmt(side)}</b> px</span><span class="hq-pill">平均 <b>${fmtMs(sum / K)}</b>／張</span><span class="hq-pill">成功 <b>${ok}／${K}</b></span>`;
          return `${fmtMs(sum / K)}／張・成功 ${ok}/${K}`;
        },
        note: "圖片在 prepare 階段先產生並轉成 JPEG（不計時）；計時包含 scanFileV2 載入圖片、畫進內部 canvas 與 ZXing 解碼。右側只顯示最後一級的縮圖。",
      });
    },
  },
] });
</script>
</body>
</html>
