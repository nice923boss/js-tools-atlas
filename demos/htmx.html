<body>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
(() => {
  // ---------- mock server: swap window.XMLHttpRequest for an in-page fake while a scene is mounted ----------
  const RealXHR = window.XMLHttpRequest;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const kb = (n) => (n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`);
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

  function mockServer(ctx, routes, opt = {}) {
    const server = { latency: opt.latency ?? 300, onLog: opt.onLog || null, hits: 0 };
    const timers = new Set();
    let live = true;
    const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); if (live) fn(); }, ms); timers.add(id); return id; };
    class MockXHR {
      constructor() {
        Object.assign(this, { readyState: 0, status: 0, statusText: "", response: "", responseText: "", responseURL: "", timeout: 0, withCredentials: false });
        this._rq = {}; this._rs = {}; this._ls = {};
        this.upload = { addEventListener() {}, removeEventListener() {} };
      }
      open(method, url) { this._m = String(method).toUpperCase(); this._u = url; this.readyState = 1; }
      overrideMimeType() {}
      setRequestHeader(k, v) { this._rq[k.toLowerCase()] = v; }
      getResponseHeader(k) { const v = this._rs[k.toLowerCase()]; return v == null ? null : String(v); }
      getAllResponseHeaders() { return Object.entries(this._rs).map(([k, v]) => `${k}: ${v}\r\n`).join(""); }
      addEventListener(t, f) { (this._ls[t] ||= []).push(f); }
      removeEventListener(t, f) { this._ls[t] = (this._ls[t] || []).filter((x) => x !== f); }
      _fire(t) {
        const e = { type: t, target: this, lengthComputable: false, loaded: 0, total: 0 };
        (this._ls[t] || []).slice().forEach((f) => f.call(this, e));
        if (typeof this[`on${t}`] === "function") this[`on${t}`](e);
      }
      abort() { clearTimeout(this._tid); timers.delete(this._tid); this.readyState = 4; this._fire("abort"); this._fire("loadend"); }
      send(body) {
        const t0 = performance.now();
        const url = new URL(this._u, location.href);
        const params = new URLSearchParams(url.search);
        if (body instanceof FormData) for (const [k, v] of body) params.append(k, v);
        else if (typeof body === "string" && body) for (const [k, v] of new URLSearchParams(body)) params.append(k, v);
        const at = url.pathname.indexOf("/mock/");
        const parts = at >= 0 ? url.pathname.slice(at + 6).split("/").filter(Boolean) : [];
        const handler = at >= 0 ? routes[parts[0]] : routes["*"];
        const req = { method: this._m, rest: parts.slice(1), params, q: (k) => params.get(k) ?? "", headers: this._rq, href: url.href };
        this._fire("loadstart");
        Promise.resolve().then(() => (handler ? handler(req) : { status: 404, body: "" })).then((res) => {
          if (!live) return;
          const r = typeof res === "string" ? { body: res } : res;
          const lat = r.delay ?? (typeof server.latency === "function" ? server.latency() : server.latency);
          this._tid = later(() => {
            this.readyState = 4; this.status = r.status || 200; this.responseURL = url.href;
            this._rs = { "content-type": "text/html; charset=utf-8" };
            for (const [k, v] of Object.entries(r.headers || {})) this._rs[k.toLowerCase()] = typeof v === "string" ? v : JSON.stringify(v);
            this.response = this.responseText = r.body ?? "";
            server.hits++;
            if (server.onLog) {
              const path = url.pathname.replace(/^.*\/demos\//, "") + decodeURIComponent(url.search);
              server.onLog({ method: this._m, path, status: this.status, ms: performance.now() - t0, bytes: new Blob([this.responseText]).size });
            }
            this._fire("load"); this._fire("loadend");
          }, lat);
        });
      }
    }
    window.XMLHttpRequest = MockXHR;
    ctx.onCleanup(() => {
      live = false; timers.forEach(clearTimeout); timers.clear();
      if (window.XMLHttpRequest === MockXHR) window.XMLHttpRequest = RealXHR;
    });
    return server;
  }

  // Patch htmx.config for one scene and restore it on unmount.
  function useConfig(ctx, patch) {
    const prev = {};
    for (const k of Object.keys(patch)) { prev[k] = htmx.config[k]; htmx.config[k] = patch[k]; }
    ctx.onCleanup(() => Object.assign(htmx.config, prev));
  }

  // Render markup, let htmx bind it, and let htmx clean its listeners on unmount.
  // `before(root)` runs ahead of htmx.process so listeners catch requests fired by hx-trigger="load".
  function hxMount(ctx, markup, cls, attrs = "", before) {
    ctx.html(`<div class="hx-root ${cls}" ${attrs}>${markup}</div>`);
    const root = ctx.el.firstElementChild;
    if (before) before(root);
    htmx.process(root);
    ctx.onCleanup(() => htmx.swap(root, "", { swapStyle: "innerHTML", swapDelay: 0, settleDelay: 0 }));
    return root;
  }
  const swapIn = (target, markup) => htmx.swap(target, markup, { swapStyle: "innerHTML", swapDelay: 0, settleDelay: 0 });

  function logger(ol, max = 40) {
    return (e) => {
      const li = document.createElement("li");
      if (e.status >= 400) li.className = "warn";
      li.innerHTML = `<i>${e.method}</i> <span class="u">${esc(e.path)}</span> → ${e.status}・${Math.round(e.ms)} ms・${kb(e.bytes)}`;
      ol.prepend(li);
      while (ol.children.length > max) ol.lastChild.remove();
    };
  }

  // Async loops that stop quietly when the scene unmounts (ctx.sleep rejects).
  const loop = (fn) => fn().catch(() => {});

  // ---------- data ----------
  const LINES = { BL: ["板南線", "#0070bd"], R: ["淡水信義線", "#e3002c"], G: ["松山新店線", "#008659"], O: ["中和新蘆線", "#f8b61c"], BR: ["文湖線", "#c48c31"] };
  const LINE_SRC = {
    BL: "頂埔 永寧 土城 海山 亞東醫院 府中 板橋 新埔 江子翠 龍山寺 西門 台北車站 善導寺 忠孝新生 忠孝復興 忠孝敦化 國父紀念館 市政府 永春 後山埤 昆陽 南港 南港展覽館",
    R: "象山 台北101/世貿 信義安和 大安 大安森林公園 東門 中正紀念堂 台大醫院 台北車站 中山 雙連 民權西路 圓山 劍潭 士林 芝山 明德 石牌 唭哩岸 奇岩 北投 新北投 復興崗 忠義 關渡 竹圍 紅樹林 淡水",
    G: "新店 新店區公所 七張 小碧潭 大坪林 景美 萬隆 公館 台電大樓 古亭 中正紀念堂 小南門 西門 北門 中山 松江南京 南京復興 台北小巨蛋 南京三民 松山",
    O: "南勢角 景安 永安市場 頂溪 古亭 東門 忠孝新生 松江南京 行天宮 中山國小 民權西路 大橋頭 台北橋 菜寮 三重 先嗇宮 頭前庄 新莊 輔大 丹鳳 迴龍 三重國小 三和國中 徐匯中學 三民高中 蘆洲",
    BR: "動物園 木柵 萬芳社區 萬芳醫院 辛亥 麟光 六張犁 科技大樓 大安 忠孝復興 南京復興 中山國中 松山機場 大直 劍南路 西湖 港墘 文德 內湖 大湖公園 葫洲 東湖 南港軟體園區 南港展覽館",
  };
  const STATIONS = new Map();
  for (const [code, list] of Object.entries(LINE_SRC)) for (const s of list.split(" ")) STATIONS.set(s, [...(STATIONS.get(s) || []), code]);

  const PEOPLE = [["🚴", "阿凱"], ["📷", "小美"], ["🍜", "老王"], ["🍍", "Rita"], ["⛰️", "大雄"], ["🚂", "阿豪"], ["🌊", "小琪"], ["🏮", "Ken"]];
  const SAYS = ["剛騎完北宜公路，九彎十八拐的風景值得。", "象山步道的夕陽，雲層剛剛好。", "第二市場的滷肉飯排十分鐘很值得。", "關廟鳳梨季到了，路邊一顆 60 元。",
    "合歡山今天能見度超好，看得到奇萊山。", "坐南迴線看太平洋，多良車站一定要下車。", "北投溫泉博物館免費參觀，建築很美。", "大稻埕碼頭的晚霞配上貨櫃市集。",
    "九份的芋圓還是要吃阿柑姨那家。", "花蓮七星潭的石頭灘，聽浪聲很療癒。", "台南早餐吃牛肉湯，六點就開門。", "淡水騎單車到漁人碼頭剛好一小時。"];

  Showcase.run({
    scenes: [
      // 1 ---------------------------------------------------------------------------
      {
        id: "week", title: "城市散步週報",
        api: "hx-get · hx-target · hx-trigger=\"load\" · hx-indicator · settle",
        desc: "原示範移植：分頁、載入更多、子分頁全部由 HTML 片段組成。左上角延遲可調，右側紀錄每次請求與觸發元素的 hx 屬性。",
        hint: "點分頁或頁碼，或開啟自動導覽",
        mount(ctx) {
          useConfig(ctx, { defaultSettleDelay: 250 });
          let lat = 350;
          const server = mockServer(ctx, { "*": (req) => fetch(req.href).then((r) => r.text()) }, { latency: () => lat });
          const root = hxMount(ctx, `
            <div class="head"><h2>城市散步週報</h2><span class="sim">模擬伺服器・延遲 <b class="lat">350</b> ms</span></div>
            <div class="tabs" role="tablist">
              <button role="tab" aria-selected="true" hx-get="assets/htmx/events-1.html">活動<span class="sub">・分頁</span></button>
              <button role="tab" aria-selected="false" hx-get="assets/htmx/feed-1.html">動態<span class="sub">・載入更多</span></button>
              <button role="tab" aria-selected="false" hx-get="assets/htmx/city-tpe.html">景點<span class="sub">・子分頁</span></button>
            </div>
            <div class="pw"><div class="wbar htmx-indicator" id="hx-wk-bar"></div><div id="panel" hx-get="assets/htmx/events-1.html" hx-trigger="load"></div></div>
            <aside class="log"><h3>請求紀錄 <small>前端攔截 XHR</small></h3><ol class="hx-log"></ol>
              <div class="attr">等待第一個請求…</div></aside>`, "hx-week", `hx-target="#panel" hx-indicator="#hx-wk-bar"`, (root) => {
            const attr = root.querySelector(".attr");
            ctx.on(root, "htmx:beforeRequest", (e) => {
              const elt = e.detail.elt;
              if (elt.closest(".tabs")) root.querySelectorAll(".tabs [role=tab]").forEach((b) => b.setAttribute("aria-selected", String(b === elt)));
              const own = [...elt.attributes].filter((a) => a.name.startsWith("hx-")).map((a) => `<code>${a.name}</code>="${esc(a.value)}"`).join(" ");
              const tgt = e.detail.target;
              attr.innerHTML = `&lt;${elt.tagName.toLowerCase()} ${own}&gt;<br>實際目標：<code>${tgt === elt ? "this" : "#" + esc(tgt.id)}</code>`;
            });
          });
          server.onLog = logger(root.querySelector(".hx-log"));
          ctx.slider("延遲", { min: 0, max: 1500, step: 50, value: lat, format: (v) => `${v} ms` }, (v) => { lat = v; root.querySelector(".lat").textContent = v; });
          let auto = true;
          ctx.toggle("自動導覽", auto, (v) => (auto = v));
          const TOUR = [".pager button:not(.on):not(:disabled)", ".tabs [role=tab]:nth-child(2)", ".more", ".more", ".tabs [role=tab]:nth-child(3)",
            ".subtabs [aria-selected=false]", ".subtabs [aria-selected=false]", ".tabs [role=tab]:nth-child(1)"];
          let step = 0;
          ctx.timeout(() => ctx.interval(() => {
            if (!auto) return;
            const b = root.querySelector(TOUR[step++ % TOUR.length]);
            if (b) b.click();
          }, 2600), 600);
        },
      },
      // 2 ---------------------------------------------------------------------------
      {
        id: "swap", title: "交換策略",
        api: "hx-swap: innerHTML · outerHTML · afterbegin · beforeend · beforebegin · afterend · delete · none",
        desc: "同一個伺服器回應，換一個 hx-swap 就落在不同位置。虛線框是 hx-target，彩色標籤是伺服器回傳的片段。",
        hint: "按各卡的送出，或全部送出",
        mount(ctx) {
          const MODES = [
            ["innerHTML", "取代目標內部"], ["outerHTML", "連目標本身換掉（回應帶同一個 id）"], ["afterbegin", "插到目標內最前面"],
            ["beforeend scroll:bottom", "插到最後並捲到底"], ["beforebegin", "插在目標之前（框外）"], ["afterend", "插在目標之後（框外）"],
            ["delete swap:400ms", "淡出後刪除目標，回應被忽略"], ["none", "目標不動，只處理 OOB"],
          ];
          const counts = MODES.map(() => 0);
          let noneN = 0;
          const chip = (i, n) => `<span class="hx-chip" style="--h:${(i * 47 + n * 23) % 360}">#${n}</span>`;
          const tgt = (i) => `<div class="hx-tgt" id="hx-t${i}"><span class="hx-chip old">原內容</span></div>`;
          mockServer(ctx, {
            chip: (req) => {
              const i = +req.rest[0], n = ++counts[i];
              if (i === 1) return `<div class="hx-tgt" id="hx-t1">${chip(i, n)}<span class="hx-chip old">新的框</span></div>`;
              if (i === 7) return `${chip(i, n)}<b id="hx-none-n" hx-swap-oob="true">${++noneN}</b>`;
              return chip(i, n);
            },
          }, { latency: 180 });
          const cards = () => MODES.map(([m, d], i) => `
            <div class="hx-sw"><div class="top"><code><span class="k">hx-swap=</span>"${m}"</code>
              <button class="hx-b pri" hx-get="mock/chip/${i}" hx-target="#hx-t${i}" hx-swap="${m}">送出</button></div>
              <div class="hx-stage">${tgt(i)}</div>
              <p>${d}${i === 7 ? `・OOB 計數 <b id="hx-none-n">0</b>` : ""}</p></div>`).join("");
          const root = hxMount(ctx, cards(), "hx-swaps");
          // keep stages readable: trim chips that piled up outside the target box
          ctx.on(root, "htmx:afterSettle", () => root.querySelectorAll(".hx-stage").forEach((st) => {
            const out = [...st.children].filter((c) => !c.classList.contains("hx-tgt"));
            out.slice(0, Math.max(0, out.length - 4)).forEach((c) => c.remove());
          }));
          ctx.on(root, "htmx:beforeRequest", (e) => {
            if (e.detail.target.id !== "hx-t6") return;
            const btn = e.detail.elt;
            btn.disabled = true;
            ctx.timeout(() => {
              const st = btn.closest(".hx-sw").querySelector(".hx-stage");
              if (!st.querySelector("#hx-t6")) st.insertAdjacentHTML("beforeend", tgt(6));
              btn.disabled = false;
            }, 1300);
          });
          const fireAll = () => root.querySelectorAll(".top .hx-b").forEach((b, i) => ctx.timeout(() => b.isConnected && !b.disabled && b.click(), i * 120));
          ctx.button("全部送出", fireAll, { primary: true });
          ctx.button("重設", () => { counts.fill(0); noneN = 0; swapIn(root, cards()); });
          let auto = true;
          ctx.toggle("自動", auto, (v) => (auto = v));
          ctx.timeout(fireAll, 300);
          ctx.interval(() => {
            if (!auto) return;
            const bs = [...root.querySelectorAll(".top .hx-b:not(:disabled)")];
            bs[rnd(0, bs.length - 1)]?.click();
          }, 1500);
        },
      },
      // 3 ---------------------------------------------------------------------------
      {
        id: "search", title: "主動搜尋",
        api: "hx-trigger=\"input changed delay:250ms\" · keyup[key=='Enter'] · throttle · hx-indicator",
        desc: "輸入時才向伺服器查台北捷運站。右側同時餵入三種觸發寫法，灰格是 input 事件，藍格是真的送出的請求，看防抖與節流差在哪。",
        hint: "在任一輸入框打字，或讓它自動打字",
        mount(ctx) {
          const TRIG = [["input", "每次輸入都送"], ["input changed delay:300ms", "停手 300ms 才送（防抖）"], ["input throttle:500ms", "每 500ms 最多一次（節流）"]];
          mockServer(ctx, {
            search: (req) => {
              const q = req.q("q").trim();
              if (!q) return `<li class="cnt">輸入站名，例如「忠孝」或「南港」</li>`;
              const hit = [...STATIONS].filter(([name]) => name.includes(q));
              const mark = (s) => esc(s).split(esc(q)).join(`<mark>${esc(q)}</mark>`);
              return `<li class="cnt">「${esc(q)}」找到 ${hit.length} 站</li>` + hit.slice(0, 8).map(([name, ls]) =>
                `<li><span class="dots">${ls.map((c) => `<i style="--c:${LINES[c][1]}"></i>`).join("")}</span>${mark(name)}<small>${ls.map((c) => LINES[c][0]).join("、")}</small></li>`).join("");
            },
            echo: (req) => `→「${esc(req.q("v"))}」`,
          }, { latency: 220 });
          const root = hxMount(ctx, `
            <section class="hx-pane"><h3>台北捷運站搜尋 <small>input changed delay:250ms</small></h3>
              <label class="box"><span>🔍</span><input name="q" type="search" placeholder="輸入站名" autocomplete="off"
                hx-get="mock/search" hx-trigger="input changed delay:250ms, keyup[key=='Enter'], load" hx-target="#hx-res" hx-indicator="#hx-q-spin">

          mockServer(ctx, {
            vt: (req) => (req.rest.length ? detail(+req.rest[0]) : list()),
            job: (req) => {
              if (req.rest[0] === "reset") { pct = 0; return jobBox(); }
              pct = Math.min(100, pct + rnd(5, 14));
              return pct >= 100 ? { status: 286, body: jobInner(true) } : jobInner(false);
            },
            quote: () => quote(),
          }, { latency: 150 });
          const qswap = `hx-swap="innerHTML swap:300ms settle:300ms"`;
          const root = hxMount(ctx, `
            <section class="hx-pane"><h3>View Transitions <small>transition:true</small></h3><div id="hx-vt">${list()}</div></section>
            <div class="col">
              <section class="hx-pane"><h3>同 id 屬性過渡 <small>every 600ms，到 100% 回 286</small></h3>${jobBox()}</section>
              <section class="hx-pane"><h3>淡出淡入 <small>swap:300ms settle:300ms</small></h3>
                <div id="hx-quote" hx-get="mock/quote" hx-trigger="every 2.4s" ${qswap}>${quote()}</div>
                <button class="hx-b" hx-get="mock/quote" hx-target="#hx-quote" ${qswap}>下一句</button></section>
            </div>`, "hx-fx");
          let auto = true, k = 0, idle = 0;
          ctx.toggle("自動播放", auto, (v) => (auto = v));
          const flip = () => {
            if (!auto) return;
            const back = root.querySelector(".hx-vtd .hx-b");
            if (back) back.click();
            else root.querySelectorAll(".hx-vtc")[k++ % SPOTS.length]?.click();
          };
          // first flip early (200 ms + 150 ms latency + 450 ms animation) so screenshots at 1.2 s and 2.5 s land on a settled detail view
          ctx.timeout(() => { flip(); ctx.interval(flip, 4000); }, 200);
          ctx.interval(() => {
            const r = root.querySelector(".hx-restart");
            idle = r ? idle + 1 : 0;
            if (auto && r && idle >= 2) r.click();
          }, 1000);
        },
      },
      // 8 ---------------------------------------------------------------------------
      {
        id: "stress", title: "極限測試", kind: "stress",
        api: "htmx.ajax() · innerHTML 交換 · htmx.process 綁定 · 清理舊節點",
        desc: "一次交換 n 列表格，每列帶一顆 hx-post 按鈕，量 htmx 解析片段、插入、為新按鈕綁定監聽，再用另一份 n 列取代並清理舊列的總時間。",
        hint: "按開始測試；測完可點任一列的 +1",
        mount(ctx) {
          useConfig(ctx, { defaultSettleDelay: 0 });
          let data = { a: "", b: "" };
          const counts = new Map();
          const rows = (n, tag) => {
            let s = "";
            for (let i = 0; i < n; i++) s += `<tr><td class="id">${tag}${i + 1}</td><td>站點 ${i + 1}・${tag === "A" ? "原始資料" : "取代資料"}</td><td class="n" id="hx-r${i}">0</td><td><button hx-post="mock/row/${i}" hx-target="#hx-r${i}">+1</button></td></tr>`;
            return s;
          };
          mockServer(ctx, {
            rows: (req) => data[req.rest[0]],
            row: (req) => { const i = +req.rest[0]; counts.set(i, (counts.get(i) || 0) + 1); return String(counts.get(i)); },
          }, { latency: 0 });
          const root = hxMount(ctx, `<div class="hd">已渲染 <b class="cnt">0</b> 列<span class="res"></span></div>
            <div class="tbl"><table><tbody id="hx-tb"></tbody></table></div>`, "hx-stress");
          const tbody = root.querySelector("#hx-tb"), table = root.querySelector("table");
          const cnt = root.querySelector(".cnt"), res = root.querySelector(".res");
          ctx.controls.classList.add("bottom");
          data = { a: rows(200, "A"), b: "" };
          htmx.ajax("GET", "mock/rows/a", { source: table, target: tbody, swap: "innerHTML" }).then(() => (cnt.textContent = tbody.rows.length));
          ctx.bench({
            label: "列數", unit: "列", sizes: [100, 500, 1000, 2000, 5000, 10000, 20000, 50000], target: 1000, budget: 2000,
            note: "每次：htmx.ajax 從模擬伺服器取回 n 列（每列一顆 hx-post 按鈕）以 innerHTML 交換並綁定，再用另一份 n 列取代（含清理舊列）。延遲設 0，計時含一次 setTimeout(0) 排程。",
            prepare: (n) => { counts.clear(); data = { a: rows(n, "A"), b: rows(n, "B") }; },
            run: async (n) => {
              const t0 = performance.now();
              await htmx.ajax("GET", "mock/rows/a", { source: table, target: tbody, swap: "innerHTML" });
              const t1 = performance.now();
              await htmx.ajax("GET", "mock/rows/b", { source: table, target: tbody, swap: "innerHTML" });
              const t2 = performance.now();
              cnt.textContent = Showcase.fmt(tbody.rows.length);
              const detail = `建立 ${Showcase.fmtMs(t1 - t0)}・取代 ${Showcase.fmtMs(t2 - t1)}`;
              res.textContent = `・${detail}`;
              return detail;
            },
          });
        },
      },
    ],
  });
})();
</script>
</body>
</html>
