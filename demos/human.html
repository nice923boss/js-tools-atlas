<script type="module">
// Human (@vladmandic/human) showcase: eight scenes over ONE shared Human instance.
// Every call into Human goes through a single promise queue, so detection, model loading and
// backend switches never overlap. Panels show the live tensor count and how many tensors the
// most recent inference left behind (+0 means nothing accumulates).
const { fmtMs } = Showcase;
const VER = "3.3.6";
const LIB = `https://cdn.jsdelivr.net/npm/@vladmandic/human@${VER}/dist/human.esm.js`;
const MODEL_BASE = `https://cdn.jsdelivr.net/npm/@vladmandic/human@${VER}/models/`;
// Models that are not part of the npm package come from the author's model repository on GitHub Pages.
const GH = "https://vladmandic.github.io/human-models/models/";
// Sample photos are loaded from public hosts (Google's MediaPipe test assets and the transformers.js
// docs dataset); nothing is copied into this repository.
const GA = "https://storage.googleapis.com/mediapipe-assets/";
const HF = "https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/fbe92bd97d48f3ec17779d8d8f2964e1c6bc7634/";
const IMG = {
  thumb: [GA + "thumb_up.jpg", "比讚"], victory: [GA + "victory.jpg", "勝利手勢"], pointing: [GA + "pointing_up.jpg", "食指朝上"],
  fist: [GA + "fist.jpg", "握拳"], pose: [GA + "pose.jpg", "瑜伽姿勢"], car: [HF + "young-man-standing-and-leaning-on-car.jpg", "倚車站立"],
  woman: [HF + "portrait-of-woman_small.jpg", "肖像"], afro: [HF + "woman-with-afro.jpg", "爆炸頭"], portrait: [GA + "portrait.jpg", "側臉肖像"],
  selfie: [HF + "selfie_segmentation.png", "自拍"], city: [HF + "city-streets.jpg", "街景"], catdog: [GA + "cats_and_dogs.jpg", "貓與狗"],
  football: [HF + "football-match.jpg", "足球賽"], savanna: [HF + "savanna.jpg", "草原"], corgi: [HF + "corgi.jpg", "柯基"],
};
const LIB_MB = 2.1;
// Approximate download size (weights + json) per model, in MB.
const MODEL_MB = { blazeface: 0.55, facemesh: 1.5, iris: 2.65, emotion: 0.85, faceres: 7.0, movenet: 4.7, blazepose: 2.9, handtrack: 3.0, handskeleton: 2.05, centernet: 4.1 };
const MODEL_ZH = { blazeface: "臉部偵測", facemesh: "臉部網格", iris: "虹膜", emotion: "情緒", faceres: "年齡性別", movenet: "MoveNet", blazepose: "BlazePose", handtrack: "手部偵測", handskeleton: "手部關鍵點", centernet: "CenterNet" };
const MOVENET = "movenet-lightning.json", BLAZEPOSE = GH + "blazepose-lite.json";
const FULL_FACE = { mesh: true, iris: true, emotion: true, desc: true };

// ---------- config: always pass every module explicitly (Human merges partial configs permanently) ----------
function cfgOf(o = {}) {
  const f = o.face;
  return {
    async: o.async ?? true,
    cacheSensitivity: o.cache ?? 0,
    face: {
      enabled: !!f,
      detector: { rotation: false, maxDetected: o.maxFaces ?? 3 },
      mesh: { enabled: !!f?.mesh }, iris: { enabled: !!f?.iris }, emotion: { enabled: !!f?.emotion }, description: { enabled: !!f?.desc },
      attention: { enabled: false }, antispoof: { enabled: false }, liveness: { enabled: false }, gear: { enabled: false },
    },
    body: { enabled: !!o.body, modelPath: o.body || MOVENET, maxDetected: 1, minConfidence: 0.2 },
    hand: { enabled: !!o.hand, maxDetected: 2, landmarks: true, rotation: true },
    object: { enabled: !!o.object, minConfidence: o.objConf ?? 0.2, maxDetected: o.objMax ?? 10 },
    gesture: { enabled: o.gesture ?? true },
    segmentation: { enabled: false },
    // skip the optional WebGL image-filter pass; plain resize only
    filter: { enabled: false },
  };
}
function keysOf(c) {
  const k = [];
  if (c.face.enabled) {
    k.push("blazeface");
    if (c.face.mesh.enabled) k.push("facemesh");
    if (c.face.iris.enabled) k.push("iris");
    if (c.face.emotion.enabled) k.push("emotion");
    if (c.face.description.enabled) k.push("faceres");
  }
  if (c.body.enabled) k.push(/blazepose/.test(c.body.modelPath) ? "blazepose" : "movenet");
  if (c.hand.enabled) k.push("handtrack", "handskeleton");
  if (c.object.enabled) k.push("centernet");
  return k;
}

// ---------- backend choice ----------
let AUTO = null;
// Software WebGL (SwiftShader, llvmpipe) spends ~10 s compiling shaders and then runs slower than WASM SIMD.
function pickBackend() {
  if (AUTO) return AUTO;
  const c = document.createElement("canvas"), gl = c.getContext("webgl2") || c.getContext("webgl");
  let renderer = "";
  if (gl) {
    const ext = gl.getExtension("WEBGL_debug_renderer_info");
    renderer = String(gl.getParameter(ext ? ext.UNMASKED_RENDERER_WEBGL : gl.RENDERER));
    gl.getExtension("WEBGL_lose_context")?.loseContext();
  }
  const soft = !gl || /swiftshader|llvmpipe|software|basic render/i.test(renderer);
  AUTO = { b: soft ? "wasm" : "webgl", why: !gl ? "沒有 WebGL，改用 WASM" : soft ? "偵測到軟體繪圖，改用 WASM" : "硬體 GPU，使用 WebGL", renderer: renderer || "無" };
  return AUTO;
}
const BK = { webgl: "WebGL", wasm: "WASM", cpu: "CPU", humangl: "WebGL" };

// ---------- one Human instance, one queue ----------
let human = null, libP = null;
let chain = Promise.resolve();
function q(fn) { const p = chain.then(fn); chain = p.catch(() => {}); return p; }
const MEM = { last: null };
const tensors = () => human.tf.memory().numTensors;

async function loadLib() {
  const { Human } = await import(LIB);
  const h = new Human({ modelBasePath: MODEL_BASE, backend: pickBackend().b, warmup: "none", debug: false, ...cfgOf({}) });
  await h.init();
  human = h;
}
const abortable = (ctx, p) => new Promise((resolve, reject) => {
  p.then(resolve, reject);
  ctx.signal.addEventListener("abort", () => reject(new DOMException("aborted", "AbortError")), { once: true });
});

async function ready(ctx, cfg, extra = null) {
  const need = (human ? keysOf(cfg).filter((k) => !human.models.loaded().includes(k)) : keysOf(cfg));
  if (!libP) {
    const mb = need.reduce((s, k) => s + MODEL_MB[k], 0) + (extra ? extra[1] : 0);
    await ctx.gate({
      icon: "🙂", title: "Human 臉部與身體分析實驗室", button: `載入（約 ${Math.max(1, Math.round(LIB_MB + mb))} MB）`,
      tags: ["函式庫 2.1 MB", `本場景模型 ${mb.toFixed(1)} MB`, "TensorFlow.js 4.22", "不需鏡頭"],
      desc: "下載 Human 3.3.6（內含 TensorFlow.js）與本場景用到的模型。八個場景共用同一個 Human，模型載入後整頁都能沿用，切到其他場景時只補下載缺少的模型。",
    });
    libP ??= loadLib().catch((e) => { libP = null; throw new Error(`Human 載入失敗：${e.message}`); });
  }
  if (human && !need.length) return;
  const st = ctx.status("下載 Human 函式庫（2.1 MB）…");
  const paint = () => {
    if (!human) return;
    const todo = keysOf(cfg), done = todo.filter((k) => human.models.loaded().includes(k));
    const left = todo.filter((k) => !done.includes(k));
    st.progress(todo.length ? done.length / todo.length : 1);
    st.text(left.length ? `下載模型：${left.map((k) => MODEL_ZH[k]).join("、")}（約 ${left.reduce((s, k) => s + MODEL_MB[k], 0).toFixed(1)} MB）…` : "初始化模型…");
  };
  const id = ctx.interval(paint, 150);
  try {
    await abortable(ctx, libP);
    paint();
    await abortable(ctx, q(() => human.load(cfg)));
  } finally { clearInterval(id); st.done(); }
}

// Run detect in the queue; record how many tensors the call left behind (null when it loaded a model).
function detect(cfg, input) {
  return q(async () => {
    const n0 = tensors(), m0 = human.models.loaded().length;
    const t0 = performance.now();
    const r = await human.detect(input, cfg);
    const ms = performance.now() - t0;
    if (r.error) throw new Error(r.error);
    MEM.last = human.models.loaded().length !== m0 ? null : tensors() - n0;
    return { r, ms };
  });
}
async function setBackend(b) {
  return q(async () => {
    if (human.tf.getBackend() === b) return 0;
    const t0 = performance.now();
    human.config.backend = b;
    await human.init();
    if (human.tf.getBackend() !== b) throw new Error(`無法切換到 ${BK[b] || b} 後端`);
    return performance.now() - t0;
  });
}
function restoreBackend(ctx) {
  ctx.onCleanup(() => { if (human && human.config.backend !== AUTO.b) setBackend(AUTO.b).catch((e) => console.error(e)); });
}
const memHTML = () => {
  if (!human) return "";
  const m = human.tf.memory(), d = MEM.last;
  return `張量 <b>${m.numTensors}</b>・${m.numBytesInGPU ? "顯示卡" : "記憶體"} <b>${((m.numBytesInGPU || m.numBytes) / 1e6).toFixed(0)} MB</b>・` +
    `最近一次推論殘留 <b>${d == null ? "含模型載入" : (d >= 0 ? "+" : "") + d}</b>・已載入模型 <b>${human.models.loaded().length}</b> 個・後端 <b>${BK[human.tf.getBackend()] || human.tf.getBackend()}</b>`;
};
function memWatch(ctx) { const paint = () => ctx.$$(".hu-mem").forEach((el) => (el.innerHTML = memHTML())); paint(); ctx.interval(paint, 600); return paint; }

// ---------- page helpers ----------
const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) {
    imgCache.set(src, new Promise((ok, fail) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => ok(img);
      img.onerror = () => { imgCache.delete(src); fail(new Error("範例照片載入失敗，請檢查網路")); };
      img.src = src;
    }));
  }
  return imgCache.get(src);
}
function fitInto(frame, box, w, hh) {
  const bw = box.clientWidth - 8, bh = box.clientHeight - 8;
  if (!w || !hh || bw <= 0 || bh <= 0) return;
  const k = Math.min(bw / w, bh / hh);
  frame.style.width = `${Math.floor(w * k)}px`;
  frame.style.height = `${Math.floor(hh * k)}px`;
}
function watch(ctx, el, fn) { const ro = new ResizeObserver(() => ctx.active && fn()); ro.observe(el); ctx.onCleanup(() => ro.disconnect()); }
const isAbort = (e) => e && e.name === "AbortError";
const pct = (v) => `${Math.round(v * 100)}%`;
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const deg = (rad) => (rad == null || Number.isNaN(rad) ? "－" : `${Math.round((rad * 180) / Math.PI)}°`);
const bars = (items, cls = "") => items.map(([label, v, txt]) =>
  `<div class="hu-row ${cls}"><span>${label}</span><span class="m"><i style="width:${Math.round(clamp01(v) * 100)}%"></i></span><b>${txt ?? pct(v)}</b></div>`).join("");
const hero = (emo, ttl, sub) => `<div class="hu-hero"><span class="hu-big">${emo}</span><div><div class="hu-ttl">${ttl}</div><div class="hu-sub">${sub}</div></div></div>`;
const kv = (rows) => `<div class="hu-kv">${rows.map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join("")}</div>`;
const chips = (list, empty) => `<div class="hu-chips">${list.length ? list.map((t) => `<span>${t}</span>`).join("") : `<span class="none">${empty}</span>`}</div>`;
const hasCamera = async () => { try { return (await navigator.mediaDevices.enumerateDevices()).some((d) => d.kind === "videoinput"); } catch { return false; } };

// Image view: `src` holds the scaled input that Human sees, `cvs` shows it plus the overlay.
function layout(ctx, panelHTML = "") {
  ctx.html(`<div class="hu-wrap"><div class="hu-view"><div class="hu-frame"><canvas></canvas><div class="hu-tags"></div></div>
    <span class="hu-tag" data-tag></span><div class="hu-msg">載入範例照片與第一次推論…</div><div class="hu-thumbs"></div></div>
    <aside class="hu-panel">${panelHTML}<div data-out></div><div class="hu-mem"></div></aside></div>`);
  const view = ctx.$(".hu-view"), frame = ctx.$(".hu-frame"), cvs = frame.querySelector("canvas"), src = document.createElement("canvas");
  const L = { view, frame, cvs, src, g: cvs.getContext("2d"), panel: ctx.$(".hu-panel"), out: ctx.$("[data-out]"), msg: ctx.$(".hu-msg"),
    tag: ctx.$("[data-tag]"), tags: ctx.$(".hu-tags"), thumbs: ctx.$(".hu-thumbs") };
  L.size = (w, hh) => {
    for (const c of [cvs, src]) if (c.width !== w || c.height !== hh) { c.width = w; c.height = hh; }
    fitInto(frame, view, w, hh);
  };
  L.load = (img, max = 960) => {
    const w = img.naturalWidth || img.width, hh = img.naturalHeight || img.height, k = Math.min(1, max / Math.max(w, hh));
    L.size(Math.round(w * k), Math.round(hh * k));
    src.getContext("2d").drawImage(img, 0, 0, src.width, src.height);
  };
  L.paint = () => L.g.drawImage(src, 0, 0);
  L.setTags = (list) => {

  }

// ---------- scene 6: background segmentation ----------
const SEG = [
  { value: "selfie", label: "Selfie（0.3 MB）", file: "selfie.json", mb: 0.3 },
  { value: "meet", label: "Meet（0.5 MB）", file: "meet.json", mb: 0.47 },
  { value: "rvm", label: "RVM（4.4 MB）", file: "rvm.json", mb: 4.35 },
];
const SEG_USED = new Set();
function segment(input, file) {
  return q(async () => {
    const n0 = tensors(), t0 = performance.now();
    const t = await human.segmentation(input, { segmentation: { enabled: true, modelPath: GH + file, mode: "default" } });
    const ms = performance.now() - t0;
    if (!t) throw new Error("分割模型沒有回傳結果");
    const shape = t.shape.slice(), dtype = t.dtype;
    let data;
    try { data = await t.data(); } finally { human.tf.dispose(t); }
    const first = !SEG_USED.has(file);
    SEG_USED.add(file);
    MEM.last = first ? null : tensors() - n0;
    return { data, shape, dtype, ms, first };
  });
}
async function mountSegment(ctx) {
  let model = SEG[0], bg = 0;
  await ready(ctx, cfgOf({}), ["分割模型", model.mb]);
  const L = layout(ctx, `<canvas class="hu-mini" data-mask hidden></canvas>`);
  memWatch(ctx);
  const fail = guard(L);
  const mini = ctx.$("[data-mask]");
  const mask = document.createElement("canvas"), person = document.createElement("canvas");
  const samples = [IMG.selfie, IMG.woman, IMG.car, IMG.afro];
  const rec = new Map();
  let img = null, sample = 0, gen = 0, last = null;
  const compose = () => {
    if (!last) return;
    const W = L.cvs.width, H = L.cvs.height, g = L.g;
    g.save();
    if (bg === 0) {
      const s = Math.max(8, Math.round(W / 40));
      for (let y = 0; y < H; y += s) for (let x = 0; x < W; x += s) { g.fillStyle = ((x / s + y / s) & 1) ? "#2a2d33" : "#1a1c20"; g.fillRect(x, y, s, s); }
    } else if (bg === 1) {
      const gr = g.createLinearGradient(0, 0, W, H); gr.addColorStop(0, "#1f8fb8"); gr.addColorStop(1, "#9d8cff");
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    } else if (bg === 2) {
      g.filter = `blur(${Math.max(6, Math.round(W / 70))}px)`; g.drawImage(L.src, 0, 0); g.filter = "none";
    } else { g.fillStyle = "#000"; g.fillRect(0, 0, W, H); g.drawImage(mask, 0, 0, W, H); }
    g.restore();
    if (bg !== 3) {
      person.width = W; person.height = H;
      const pg = person.getContext("2d");
      pg.drawImage(L.src, 0, 0);
      pg.globalCompositeOperation = "destination-in";
      pg.drawImage(mask, 0, 0, W, H);
      g.drawImage(person, 0, 0);
    }
    mini.hidden = false;
    mini.width = mask.width; mini.height = mask.height;
    const mg = mini.getContext("2d"); mg.fillStyle = "#000"; mg.fillRect(0, 0, mini.width, mini.height); mg.drawImage(mask, 0, 0);
  };
  const run = async () => {
    if (!img) return;
    const my = ++gen, m = model;
    try {
      if (!SEG_USED.has(m.file)) L.msg.textContent = `下載並初始化 ${m.label}…`;
      L.load(img, 720);
      let x = await segment(L.src, m.file);
      const cold = x.first ? x.ms : null;
      // A model's first call includes download and graph setup; run once more for the steady-state time.
      if (x.first && my === gen && ctx.active) x = await segment(L.src, m.file);
      if (my !== gen || !ctx.active) return;
      const [h, w] = x.shape, ch = x.shape[2] || 1, d = x.data, n = w * h;
      let mx = 0;
      for (let i = 0; i < n; i++) { const a = d[i * ch + (ch === 4 ? 3 : 0)]; if (a > mx) mx = a; }
      const k = mx <= 1 ? 255 : 1;
      const id = new ImageData(w, h);
      let sum = 0;
      for (let i = 0; i < n; i++) {
        const a = Math.min(255, d[i * ch + (ch === 4 ? 3 : 0)] * k);
        id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = 255; id.data[i * 4 + 3] = a; sum += a;
      }
      mask.width = w; mask.height = h; mask.getContext("2d").putImageData(id, 0, 0);
      last = { cover: sum / 255 / n, shape: x.shape, dtype: x.dtype };
      const prev = rec.get(`${m.value}:${sample}`) || {};
      rec.set(`${m.value}:${sample}`, { cold: cold ?? prev.cold, warm: x.ms, cover: last.cover });
      L.msg.textContent = "";
      compose();
      L.tag.innerHTML = `${m.label}・<i>human.segmentation(input, { mode: "default" })</i>`;
      L.out.innerHTML = hero("✂️", `人像占 ${pct(last.cover)}`, `${fmtMs(x.ms)}・輸出 ${x.shape.join("×")} ${x.dtype}`) +
        `<h4>三個模型比較（同一張照片）</h4><table class="hu-table"><tr><th>模型</th><th>首次</th><th>再次</th><th>人像</th></tr>` +
        SEG.map((s) => { const r = rec.get(`${s.value}:${sample}`); return `<tr><td class="t">${s.value === "rvm" ? "RVM" : s.value === "meet" ? "Meet" : "Selfie"}</td><td>${r?.cold ? fmtMs(r.cold) : "－"}</td><td>${r ? fmtMs(r.warm) : "未測"}</td><td>${r ? pct(r.cover) : "－"}</td></tr>`; }).join("") +
        `</table><p class="hu-note">上方小圖是遮罩本身（白色為人像）。回傳值是張量，讀出資料後立刻 tf.dispose()，所以推論殘留維持 +0。Selfie 與 Meet 是輕量即時模型，RVM 較大但頭髮邊緣較細。</p>`;
    } catch (e) { fail(e); }
  };
  const pick = async (i) => { sample = i; try { img = await loadImg(samples[i][0]); if (ctx.active) await run(); } catch (e) { fail(e); } };
  thumbStrip(L.thumbs, samples, pick);
  ctx.select("模型", SEG.map(({ value, label }) => ({ value, label })), model.value, (v) => { model = SEG.find((s) => s.value === v); run(); });
  ctx.group(["透明", "漸層", "模糊", "遮罩"], 0, (i) => { bg = i; compose(); });
  await pick(0);
}

// ---------- scene 7: modules, backends and warmup ----------
const PERF = [["inputProcess", "影像前處理"], ["face", "臉部（含子模組）"], ["emotion", "└ 情緒"], ["description", "└ 年齡性別"], ["body", "身體"], ["hand", "手部"], ["object", "物件"], ["gesture", "手勢判讀"]];
const COLD_SEEN = new Set();
const BACKENDS = () => [{ value: "auto", label: `自動（${BK[pickBackend().b]}）` }, { value: "webgl", label: "WebGL" }, { value: "wasm", label: "WASM" }, { value: "cpu", label: "CPU（純 JS）" }];
async function mountModules(ctx) {
  const mods = { face: true, body: true, hand: true, object: false };

  const cfg = () => cfgOf({ face: mods.face ? FULL_FACE : null, body: mods.body ? MOVENET : null, hand: mods.hand, object: mods.object, async: false });
  await ready(ctx, cfg());

      (lastRes ? bars(PERF.filter(([k]) => p[k] != null).map(([k, nm]) => [nm, total ? p[k] / total : 0, fmtMs(p[k])]), "wide") + kv([["總計 performance.total", fmtMs(total)]]) : `<p>${status || "量測中…"}</p>`) +
      `<h4>量測紀錄</h4><table class="hu-table"><tr><th>後端</th><th>模組</th><th>首次</th><th>平均</th></tr>` +
      recs.slice(0, 6).map((r) => `<tr><td class="t">${BK[r.b]}${r.cold ? " ★" : ""}</td><td class="t">${r.mods}</td><td>${r.first == null ? "…" : fmtMs(r.first)}</td><td>${r.avg == null ? "…" : `${fmtMs(r.avg)}`}</td></tr>`).join("") +
      `</table><p class="hu-note">★ 為此後端在本頁的第一次推論，含 WebGL 著色器編譯或 WASM 初始化。首次與平均的差距就是暖機要消除的成本。</p>` +
      `<h4>環境</h4>` + kv([["自動選擇", AUTO.why], ["WASM SIMD", human.env.wasm?.simd ? "支援" : "不支援"], ["WASM 多執行緒", human.env.wasm?.multithread ? "支援" : "未啟用"],
        ["切換後端", "config.backend＋init()"], ["暖機", warmMs == null ? "尚未執行" : fmtMs(warmMs)]]) +
      `<p class="hu-note">WASM 多執行緒需要跨來源隔離（COOP／COEP 標頭），一般靜態網站不會有。每次切換後端 Human 會重建約 6 個常數張量，這是函式庫行為，不會隨推論累積。</p>`;
  };
  const measure = async () => {
    const my = ++gen, b = want === "auto" ? AUTO.b : want, c = cfg();

  const crop = document.createElement("canvas");

  const rows = new Map();
  const sizeView = () => { const r = view.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); view.width = Math.max(1, Math.round(r.width * d)); view.height = Math.max(1, Math.round(r.height * d)); dirty = true; };

    if (!rows.size) { brk.innerHTML = ""; return; }
    const max = Math.max(...[...rows.values()].map((r) => r.total));
    brk.innerHTML = `<div class="hu-legend">${SEGS.map(([, nm, c]) => `<span><i style="background:${c}"></i>${nm}</span>`).join("")}</div>` +
      [...rows.entries()].sort((a, b) => a[0] - b[0]).map(([n, r]) =>
        `<div class="hu-sbar"><span>${n}・${STAGES[n - 1][0]}</span><span class="s">${SEGS.map(([k, , c]) => (r[k] > 0 ? `<i style="width:${((r[k] / max) * 100).toFixed(1)}%;background:${c}" title="${k}"></i>` : "")).join("")}</span><b>${fmtMs(r.total)}</b></div>`).join("");
  };
  const pan = (k) => {
    // every call sees a new 80% window of the photo, so no stage can reuse a cached frame
    const ph = performance.now() / 700 + k, w = img.naturalWidth, hh = img.naturalHeight;
    const s = Math.min(1, 640 / (w * 0.8));
    crop.width = Math.round(w * 0.8 * s); crop.height = Math.round(hh * 0.8 * s);
    crop.getContext("2d").drawImage(img, (0.1 + 0.1 * Math.sin(ph)) * w, (0.1 + 0.1 * Math.cos(ph * 0.8)) * hh, w * 0.8, hh * 0.8, 0, 0, crop.width, crop.height);
  };
  const shot = async (n) => {
    pan(n);
    const x = await detect(stageCfg(n), crop);
    last = { r: x.r, w: crop.width, h: crop.height, frame: crop.getContext("2d").getImageData(0, 0, crop.width, crop.height) };
    lastMs = x.ms; dirty = true;
    return x;
  };
  ctx.raf(() => {
    if (!dirty || !last) return;
    dirty = false;
    const W = view.width, H = view.height, k = Math.min(W / last.w, H / last.h) * 0.98;
    const tmp = document.createElement("canvas");
    tmp.width = last.w; tmp.height = last.h;
    tmp.getContext("2d").putImageData(last.frame, 0, 0);
    drawRes(tmp, last.r, { drawPolygons: false, drawPoints: true, drawGaze: false });
    g.fillStyle = "#0a0c0f"; g.fillRect(0, 0, W, H);
    g.drawImage(tmp, (W - last.w * k) / 2, (H - last.h * k) / 2, last.w * k, last.h * k);
    tag.innerHTML = `${stage}・${STAGES[stage - 1][0]}・單幀 <i>${fmtMs(lastMs)}</i>・${BK[human.tf.getBackend()]}・臉 ${last.r.face.length}・身 ${last.r.body.length}・手 ${last.r.hand.length}・物 ${last.r.object.length}`;
  });
  ctx.select("後端", BACKENDS(), want, async (v) => {
    want = v;
    try { msg.textContent = "切換後端…"; await setBackend(v === "auto" ? AUTO.b : v); rows.clear(); paintBreak(); msg.textContent = `已切換到 ${BK[human.tf.getBackend()]}，按「開始測試」重新量測`; }
    catch (e) { console.error(e); msg.textContent = `切換失敗：${e.message || e}`; }
  });
  ctx.bench({
    label: "逐一開啟模組", unit: "個模組", sizes: [1, 2, 3, 4, 5, 6, 7, 8], target: 1000 / 10, budget: 2000,
    async prepare(n) {
      stage = n;
      await setBackend(want === "auto" ? AUTO.b : want);
      await ready(ctx, stageCfg(n));
      // two warm calls: the first one after enabling a module builds its graph / shaders
      await shot(n); await shot(n);
    },
    async run(n) {
      const x = await shot(n);
      const p = x.r.performance || {};
      const parts = { input: p.inputProcess || 0, face: p.face || 0, body: p.body || 0, hand: p.hand || 0, object: p.object || 0 };
      const sum = parts.input + parts.face + parts.body + parts.hand + parts.object;
      rows.set(n, { ...parts, rest: Math.max(0, x.ms - sum), total: x.ms });
      paintBreak();
      return `${(1000 / x.ms).toFixed(1)} FPS`;
    },
    note: "第 n 級同時開啟前 n 個模組（臉部偵測、網格、虹膜、情緒、年齡性別、身體、手部、物件），每級先暖機兩次，再量一次單幀 detect（async: false，輸入每次平移，不吃快取）。達到 10 FPS（單幀 100 ms 內）的級距算通過；堆疊條是 result.performance 拆出的影像前處理與各模組耗時。右上角可換後端比較。",
  });
  img = await loadImg(IMG.car[0]);
  if (!ctx.active) return;
  await shot(1);
}
