<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hydra 示範：滑鼠即時操控的影像合成器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: #000; }
  #hy { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .code {
    position: fixed; left: 12px; bottom: 50px; z-index: 50;
    margin: 0; padding: 10px 14px; max-width: min(520px, calc(100% - 24px));
    font: 12px/1.55 var(--mono); white-space: pre-wrap; overflow: hidden;
    background: rgba(0, 0, 0, 0.62); border-color: rgba(255, 255, 255, 0.16);
  }
  .code .fn { color: #4cc9f0; }
  .code .num { color: #f7df1e; }
  .code .kw { color: #ff8fb8; }
  .tag { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; font-family: var(--font); }
  @media (max-width: 560px) { .code { font-size: 10.5px; padding: 8px 10px; } }
</style>
</head>
<body>
<canvas id="hy"></canvas>
<div class="controls" id="presets"></div>
<pre class="panel code" id="code"></pre>
<div class="hint">移動滑鼠即時改變參數・點選預設切換畫面</div>

<script src="https://cdn.jsdelivr.net/npm/hydra-synth@1.4.0/dist/hydra-synth.js"></script>
<script>
// Each preset is real Hydra code: chained video-synth functions compiled to a GLSL shader.
// Arrow functions are re-evaluated every frame, so mouse position drives parameters live.
const PRESETS = [
  { name: "萬花筒", code:
`osc(18, 0.06, 1.4)
  .kaleid(6)
  .color(1.1, 0.55, 1.2)
  .rotate(0, 0.08)
  .modulate(noise(3, 0.2), () => 0.05 + mouse.x / width * 0.3)
  .modulateScale(osc(6, 0.02), () => mouse.y / height * 0.6)
  .out()` },
  { name: "流體", code:
`osc(10, 0.04, 1.6)
  .modulate(noise(2.2, 0.08), () => 0.6 + mouse.x / width)
  .modulateRotate(noise(1.4, 0.05), 1.2)
  .saturate(1.6)
  .color(1, 0.7, 1.1)
  .out()` },
  { name: "回授隧道", code:
`shape(4, 0.3, 0.01)
  .color(1, 0.3, 0.7)
  .diff(
    src(o0)
      .scale(1.04)
      .rotate(() => 0.02 + mouse.x / width * 0.06)
      .hue(0.03)
  )
  .out()` },
  { name: "細胞", code:
`voronoi(7, 0.5, 0.3)
  .mult(osc(8, 0.1, 1.6).saturate(2))
  .modulate(noise(2, 0.15), 0.2)
  .kaleid(() => 3 + Math.floor(mouse.x / width * 6))
  .out()` },
  { name: "故障", code:
`osc(40, 0.02, 0.9)
  .rotate(0.5)
  .pixelate(48, 18)
  .diff(osc(24, -0.03, 0.6).rotate(-0.3))
  .modulateScrollX(noise(3, 0.2), () => mouse.x / width * 0.4)
  .contrast(1.4)
  .out()` },
];

const canvas = document.getElementById("hy");
const ratio = Math.min(devicePixelRatio || 1, 1.5);
const hydra = new Hydra({
  canvas,
  width: Math.round(innerWidth * ratio),
  height: Math.round(innerHeight * ratio),
  detectAudio: false,
  enableStreamCapture: false,
  makeGlobal: true,
});

function highlight(src) {
  const esc = src.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc
    .replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>')
    .replace(/(\.?)([a-zA-Z]+)(?=\()/g, '$1<span class="fn">$2</span>')
    .replace(/\b(mouse|width|height|o0)\b/g, '<span class="kw">$1</span>');
}

const codeEl = document.getElementById("code");
const bar = document.getElementById("presets");
const buttons = PRESETS.map((p, i) => {
  const b = document.createElement("button");
  b.className = "btn";
  b.textContent = p.name;
  b.addEventListener("click", () => run(i));
  bar.appendChild(b);
  return b;
});

function run(i) {
  const p = PRESETS[i];
  try {
    new Function(p.code)();
  } catch (err) {
    console.error("Hydra preset failed", p.name, err);
    codeEl.textContent = "這段程式碼無法執行：" + err.message;
    return;
  }
  buttons.forEach((b, k) => b.setAttribute("aria-pressed", k === i));
  codeEl.innerHTML = '<span class="tag">hydra 即時程式碼・' + p.name + "</span>" + highlight(p.code);
}

let rt;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => hydra.setResolution(Math.round(innerWidth * ratio), Math.round(innerHeight * ratio)), 150);
});
run(0);
</script>
</body>
</html>
