<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>i18next 示範：繁中、英文、日文即時切換</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"切換語言、調整晚數與人數，觀察複數、插值與 Intl 格式化"}</script>
<style>
  body { background: radial-gradient(60% 70% at 0% 100%, rgba(76,201,240,.12), transparent 60%), radial-gradient(50% 60% at 100% 0%, rgba(247,37,133,.10), transparent 60%), var(--bg); }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 46px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; }
  .langs { display: inline-flex; padding: 3px; gap: 3px; border-radius: 999px; background: var(--bg-2); border: 1px solid var(--line); }
  .langs button { border: 0; background: none; color: var(--fg); font: 600 13px var(--font); padding: 5px 14px; border-radius: 999px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--c2); color: #08171d; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 12px; }
  /* booking app */
  .phone { min-height: 0; display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: #fbfaf7; color: #1d1d1b; box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .hero { position: relative; flex: 0 0 104px; background: linear-gradient(180deg, #ffd9a8 0%, #ff9e7a 38%, #6a7fdb 39%, #2c4aa8 100%); overflow: hidden; }
  .hero::before { content: ""; position: absolute; left: -10%; right: -10%; bottom: 52%; height: 46px; background: #3e5c4b; clip-path: polygon(0 100%, 12% 30%, 22% 70%, 36% 10%, 50% 75%, 63% 25%, 78% 80%, 90% 35%, 100% 100%); }
  .hero::after { content: ""; position: absolute; left: 30%; top: 12px; width: 26px; height: 26px; border-radius: 50%; background: #fff3c4; box-shadow: 0 0 30px #fff3c4; }
  .hero .brand { position: absolute; left: 14px; bottom: 10px; color: #fff; font-weight: 800; font-size: 17px; text-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .hero .greet { position: absolute; right: 12px; top: 10px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.88); color: #1d1d1b; font-weight: 600; max-width: 62%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .body { flex: 1; min-height: 0; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .hotel { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .hotel h2 { margin: 0; font-size: 18px; line-height: 1.3; }
  .hotel .loc { font-size: 12px; color: #6d6b64; }
  .score { flex: none; text-align: right; font-size: 11px; color: #6d6b64; }
  .score b { display: inline-block; padding: 2px 7px; border-radius: 6px 6px 6px 0; background: #1f6fd1; color: #fff; font-size: 14px; }
  .step { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 10px; background: #f0eee8; font-size: 14px; }
  .step .ctl { display: flex; align-items: center; gap: 10px; }
  .step button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid #c9c6bd; background: #fff; color: #1d1d1b; font: 700 16px/1 var(--font); cursor: pointer; }
  .step output { min-width: 84px; text-align: center; font-weight: 700; }
  .info { font-size: 13px; color: #3d3c38; display: grid; gap: 2px; }
  .info .tag { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; background: #e5f6ec; color: #23824a; font-size: 12px; font-weight: 600; }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; border-top: 1px solid #e6e3da; }
  .foot .total { font-size: 12px; color: #6d6b64; }
  .foot .total b { display: block; font-size: 20px; color: #1d1d1b; }
  .foot button { border: 0; border-radius: 10px; padding: 10px 16px; background: #f72585; color: #fff; font: 700 14px var(--font); cursor: pointer; white-space: nowrap; }
  .live { font-size: 12px; color: #c0392b; font-weight: 600; }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  /* resource panel */
  .side { min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; }
  .side h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  .side h3 code { font: 11px var(--mono); color: var(--c2); }
  .calls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; font: 12px/1.45 var(--mono); }
  .call { padding: 6px 10px; border-radius: 8px; background: #0b0d10; border: 1px solid var(--line); }
  .call .fn { color: #c8c6bd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .call .fn i { font-style: normal; color: var(--c2); }
  .call .fn s { text-decoration: none; color: var(--c4); }
  .call .tpl { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .call .tpl em { font-style: normal; color: var(--c5); }
  .call .out { color: var(--fg); font-family: var(--font); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .call .out::before { content: "→ "; color: var(--c3); font-family: var(--mono); }
  .call .sfx { float: right; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: rgba(157,140,255,.18); color: var(--c6); font-size: 10px; }
  @media (max-width: 720px) {
    .app { overflow-y: auto; }
    .main { flex: none; grid-template-columns: minmax(0, 1fr); }
    .phone { min-height: 440px; }
    header h1 { font-size: 16px; }
    .langs button { padding: 4px 10px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🌐 i18next 多語系介面</h1>
    <div class="langs" id="langs"><button data-l="zh-TW" aria-pressed="true">繁體中文</button><button data-l="en">English</button><button data-l="ja">日本語</button></div>
  </header>
  <div class="main">
    <article class="phone" id="phone">
      <div class="hero"><span class="brand" data-k="appName"></span><span class="greet" id="greet"></span></div>
      <div class="body" id="body">
        <div class="hotel"><div><h2 data-k="hotel"></h2><div class="loc" data-k="location"></div></div><div class="score"><b id="score"></b><div id="reviews"></div></div></div>
        <div class="step"><span data-k="nightsLabel"></span><div class="ctl"><button data-s="nights" data-d="-1">−</button><output id="nights"></output><button data-s="nights" data-d="1">+</button></div></div>
        <div class="step"><span data-k="guestsLabel"></span><div class="ctl"><button data-s="guests" data-d="-1">−</button><output id="guests"></output><button data-s="guests" data-d="1">+</button></div></div>
        <div class="info"><div><span id="checkin"></span><span class="tag" id="countdown"></span></div><div id="amen"></div><div class="live" id="live"></div></div>
        <div class="foot"><div class="total"><span id="per"></span><b id="total"></b></div><button data-k="book"></button></div>
      </div>
    </article>
    <aside class="side">
      <h3><span data-k="sideTitle"></span><code id="lngCode"></code></h3>
      <div class="calls" id="calls"></div>
    </aside>
  </div>
</div>
<div class="hint">切換語言或按 + − 調整，觀察複數與格式化</div>

<script src="https://cdn.jsdelivr.net/npm/i18next@26.4.2/dist/umd/i18next.min.js"></script>
<script>
// i18next demo: three languages switched at runtime, with interpolation, plurals (Intl.PluralRules suffixes)
// and the built-in Intl formatters (number, currency, datetime, relativetime, list).
const PRICE = "currency(currency: TWD; minimumFractionDigits: 0)";
const resources = {
  "zh-TW": { translation: {
    appName: "台灣好好玩", greeting: "{{name}}，歡迎回來！", hotel: "日月潭湖景旅店", location: "南投縣魚池鄉．湖畔第一排",
    score: "{{v, number(minimumFractionDigits: 1)}}", reviews_other: "{{count, number}} 則評論",
    nightsLabel: "住宿晚數", guestsLabel: "入住人數",
    nights_zero: "尚未選擇", nights_other: "{{count}} 晚",
    guests_other: "{{count}} 位旅客",
    checkin: "入住：{{date, datetime(month: long; day: numeric; weekday: short)}}",
    countdown: "{{days, relativetime(day)}}出發",
    amenities: "設施：{{list, list}}", amenItems: ["無邊際泳池", "湖景早餐", "免費腳踏車"],
    perNight: "每晚 {{val, " + PRICE + "}}", total: "{{val, " + PRICE + "}}", totalZero: "請先選擇晚數",
    book: "立即訂房",
    viewing_other: "🔥 目前有 {{count}} 人正在看這間房",
    sideTitle: "t() 呼叫與翻譯結果",
  } },
  en: { translation: {
    appName: "Taiwan Getaway", greeting: "Welcome back, {{name}}!", hotel: "Sun Moon Lake Lodge", location: "Yuchi, Nantou · Lakefront",
    score: "{{v, number(minimumFractionDigits: 1)}}", reviews_one: "{{count, number}} review", reviews_other: "{{count, number}} reviews",
    nightsLabel: "Nights", guestsLabel: "Guests",
    nights_zero: "Not selected", nights_one: "{{count}} night", nights_other: "{{count}} nights",
    guests_one: "{{count}} guest", guests_other: "{{count}} guests",
    checkin: "Check-in: {{date, datetime(month: long; day: numeric; weekday: short)}}",
    countdown: "Departing {{days, relativetime(day)}}",
    amenities: "Amenities: {{list, list}}", amenItems: ["infinity pool", "lake-view breakfast", "free bikes"],
    perNight: "{{val, " + PRICE + "}} per night", total: "{{val, " + PRICE + "}}", totalZero: "Choose your nights",
    book: "Book now",
    viewing_one: "🔥 {{count}} person is viewing this room", viewing_other: "🔥 {{count}} people are viewing this room",
    sideTitle: "t() calls and results",
  } },
  ja: { translation: {
    appName: "台湾トラベル", greeting: "{{name}}さん、おかえりなさい！", hotel: "日月潭レイクビュー旅館", location: "南投県魚池郷・湖畔",
    score: "{{v, number(minimumFractionDigits: 1)}}", reviews_other: "{{count, number}}件のクチコミ",
    nightsLabel: "宿泊数", guestsLabel: "人数",
    nights_zero: "未選択", nights_other: "{{count}}泊",
    guests_other: "{{count}}名",
    checkin: "チェックイン：{{date, datetime(month: long; day: numeric; weekday: short)}}",
    countdown: "{{days, relativetime(day)}}に出発",
    amenities: "設備：{{list, list}}", amenItems: ["インフィニティプール", "湖畔の朝食", "無料レンタサイクル"],
    perNight: "1泊 {{val, " + PRICE + "}}", total: "{{val, " + PRICE + "}}", totalZero: "泊数を選択してください",
    book: "今すぐ予約",
    viewing_other: "🔥 {{count}}人がこの部屋を見ています",
    sideTitle: "t() の呼び出しと結果",
  } },
};

const state = { nights: 2, guests: 2, name: "怡君", viewing: 1, days: 7 };
const $ = (id) => document.getElementById(id);
const checkinDate = new Date(Date.now() + state.days * 86400000);

function suffix(key, count) {
  const lng = i18next.language;
  if (count === 0 && i18next.exists(`${key}_zero`)) return "_zero";
  const s = `_${new Intl.PluralRules(lng).select(count)}`;
  return i18next.exists(`${key}${s}`) ? s : "_other";
}
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const showTpl = (key) => esc(i18next.getResource(i18next.language, "translation", key)).replace(/\{\{[^}]+\}\}/g, (m) => `<em>${m}</em>`);

function render(animate) {
  const t = (...args) => i18next.t(...args);
  document.querySelectorAll("[data-k]").forEach((el) => { el.textContent = t(el.dataset.k); });
  $("phone").lang = i18next.language;
  $("greet").textContent = t("greeting", { name: state.name });
  $("score").textContent = t("score", { v: 9.2 });
  $("reviews").textContent = t("reviews", { count: 1286 });
  $("nights").textContent = t("nights", { count: state.nights });
  $("guests").textContent = t("guests", { count: state.guests });
  $("checkin").textContent = t("checkin", { date: checkinDate });
  $("countdown").textContent = t("countdown", { days: state.days });
  const amen = t("amenItems", { returnObjects: true });
  $("amen").textContent = t("amenities", { list: amen });
  $("live").textContent = t("viewing", { count: state.viewing });
  const nightly = 3200 + Math.max(0, state.guests - 2) * 600;
  $("per").textContent = t("perNight", { val: nightly });
  $("total").textContent = state.nights ? t("total", { val: nightly * state.nights }) : t("totalZero");
  $("lngCode").textContent = `lng: "${i18next.language}"`;

  const calls = [
    ["greeting", `{ name: <s>"${state.name}"</s> }`, t("greeting", { name: state.name }), ""],
    ["nights", `{ count: <s>${state.nights}</s> }`, t("nights", { count: state.nights }), "nights" + suffix("nights", state.nights)],
    ["perNight", `{ val: <s>${nightly}</s> }`, t("perNight", { val: nightly }), "currency"],
    ["checkin", `{ date: <s>new Date()</s> }`, t("checkin", { date: checkinDate }), "datetime"],
    ["countdown", `{ days: <s>${state.days}</s> }`, t("countdown", { days: state.days }), "relativetime"],
    ["amenities", `{ list: <s>[…]</s> }`, t("amenities", { list: amen }), "list"],
  ];
  $("calls").innerHTML = calls.map(([k, args, out, sfx]) => {
    const tplKey = sfx.startsWith(k) ? sfx : k;
    return `<div class="call${animate ? " fade" : ""}"><div class="fn">${sfx ? `<span class="sfx">${sfx}</span>` : ""}<i>t</i>("${k}", ${args})</div>` +
      `<div class="tpl">${showTpl(tplKey)}</div><div class="out">${esc(out)}</div></div>`;
  }).join("");
  if (animate) {
    $("body").classList.remove("fade");
    void $("body").offsetWidth;
    $("body").classList.add("fade");
  }
}

let auto = true;
function setLang(lng, animate = true) {
  i18next.changeLanguage(lng).then(() => {
    document.querySelectorAll("#langs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.l === lng));
    render(animate);
  });
}
$("langs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  auto = false;
  setLang(b.dataset.l);
});
document.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => {
  auto = false;
  const k = b.dataset.s;
  state[k] = Math.max(k === "guests" ? 1 : 0, Math.min(k === "guests" ? 8 : 30, state[k] + +b.dataset.d));
  render(false);
}));

i18next.init({ lng: "zh-TW", fallbackLng: "en", resources }).then(() => {
  render(false);
  // Auto tour: rotate languages and counts so plural forms change, until the viewer interacts.
  const LNGS = ["zh-TW", "en", "ja"];
  const STEPS = [[2, 2, 1], [1, 1, 5], [0, 3, 12], [3, 4, 1]];
  let i = 0;
  setInterval(() => {
    if (!auto) return;
    i += 1;
    [state.nights, state.guests, state.viewing] = STEPS[i % STEPS.length];
    setLang(LNGS[i % LNGS.length]);
  }, 3200);
});
</script>
</body>
</html>
