<style>

<script src="_shared/showcase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/i18next@26.4.2/dist/umd/i18next.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/i18next-browser-languagedetector@8.2.1/dist/umd/i18nextBrowserLanguageDetector.min.js"></script>
<script>
// i18next showcase: a booking UI switched between three languages, Intl-backed formatters, CLDR plural and ordinal
// rules, context keys, namespaces with fallback chains and missing-key reporting, $t() nesting, the browser language
// detector with lifecycle events, and a key-count benchmark against a hand-written lookup.
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const wrap = (ctx, inner) => { ctx.html(`<div class="ix-wrap">${inner}</div>`); return ctx.$(".ix-wrap"); };
const tplHtml = (s) => esc(s ?? "（無此鍵）").replace(/\{\{[^}]+\}\}/g, (m) => `<em>${m}</em>`).replace(/\$t\([^)]*\)/g, (m) => `<mark>${m}</mark>`);
// Each scene owns an isolated instance so changing language in one scene never leaks into another.
const make = (opts) => { const inst = i18next.createInstance(); inst.init({ initAsync: false, ...opts }); return inst; };
const LANG_NAME = { "zh-TW": "繁體中文", "zh-HK": "香港中文", zh: "中文", en: "English", ja: "日本語", ru: "Русский", ar: "العربية", fr: "Français", ko: "한국어", dev: "dev" };
const LANG_COLOR = { "zh-HK": "#ff8c42", zh: "#9d8cff", "zh-TW": "#f7df1e", en: "#4cc9f0", ja: "#ff5e8a", ko: "#7bd389", fr: "#9d8cff" };
const now = () => new Date().toTimeString().slice(0, 8);

Showcase.run({ scenes: [
  {
    id: "booking", title: "多語訂房介面",
    api: "i18next.changeLanguage(lng)・t(key, { count, name, val, date })・Intl 格式化",
    desc: "同一份程式碼、三套翻譯資源。切換語言後，晚數與旅客的複數字尾、幣別、日期、相對時間與清單連接詞都跟著該語言的規則變化。右側列出每個 t() 呼叫、實際命中的鍵與原始範本。",
    hint: "上方切換語言；在手機畫面按 + − 調整晚數與人數（會停止自動輪播）",
    mount(ctx) {
      const PRICE = "currency(currency: TWD; minimumFractionDigits: 0)";
      const R = {
        "zh-TW": { appName: "台灣好好玩", greeting: "{{name}}，歡迎回來！", hotel: "日月潭湖景旅店", location: "南投縣魚池鄉・湖畔第一排", score: "{{v, number(minimumFractionDigits: 1)}}", reviews_other: "{{count, number}} 則評論",
          nightsLabel: "住宿晚數", guestsLabel: "入住人數", nights_zero: "尚未選擇", nights_other: "{{count}} 晚", guests_other: "{{count}} 位旅客", checkin: "入住：{{date, datetime(month: long; day: numeric; weekday: short)}}",
          countdown: "{{days, relativetime(day)}}出發", amenities: "設施：{{list, list}}", amenItems: ["無邊際泳池", "湖景早餐", "免費腳踏車"], perNight: `每晚 {{val, ${PRICE}}}`, total: `{{val, ${PRICE}}}`, totalZero: "請先選擇晚數", book: "立即訂房", viewing_other: "目前有 {{count}} 人正在看這間房" },
        en: { appName: "Taiwan Getaway", greeting: "Welcome back, {{name}}!", hotel: "Sun Moon Lake Lodge", location: "Yuchi, Nantou ・ Lakefront", score: "{{v, number(minimumFractionDigits: 1)}}", reviews_one: "{{count, number}} review", reviews_other: "{{count, number}} reviews",
          nightsLabel: "Nights", guestsLabel: "Guests", nights_zero: "Not selected", nights_one: "{{count}} night", nights_other: "{{count}} nights", guests_one: "{{count}} guest", guests_other: "{{count}} guests", checkin: "Check-in: {{date, datetime(month: long; day: numeric; weekday: short)}}",
          countdown: "Departing {{days, relativetime(day)}}", amenities: "Amenities: {{list, list}}", amenItems: ["infinity pool", "lake-view breakfast", "free bikes"], perNight: `{{val, ${PRICE}}} per night`, total: `{{val, ${PRICE}}}`, totalZero: "Choose your nights", book: "Book now",
          viewing_one: "{{count}} person is viewing this room", viewing_other: "{{count}} people are viewing this room" },
        ja: { appName: "台湾トラベル", greeting: "{{name}}さん、おかえりなさい！", hotel: "日月潭レイクビュー旅館", location: "南投県魚池郷・湖畔", score: "{{v, number(minimumFractionDigits: 1)}}", reviews_other: "{{count, number}}件のクチコミ",
          nightsLabel: "宿泊数", guestsLabel: "人数", nights_zero: "未選択", nights_other: "{{count}}泊", guests_other: "{{count}}名", checkin: "チェックイン：{{date, datetime(month: long; day: numeric; weekday: short)}}",
          countdown: "{{days, relativetime(day)}}に出発", amenities: "設備：{{list, list}}", amenItems: ["インフィニティプール", "湖畔の朝食", "無料レンタサイクル"], perNight: `1泊 {{val, ${PRICE}}}`, total: `{{val, ${PRICE}}}`, totalZero: "泊数を選択してください", book: "今すぐ予約", viewing_other: "{{count}}人がこの部屋を見ています" },
      };
      const LNGS = ["zh-TW", "en", "ja"];
      const inst = make({ lng: "zh-TW", fallbackLng: "en", resources: _resources(R) });
      const st = { nights: 2, guests: 2, viewing: 1, days: 7, name: "怡君" }, checkin = new Date(Date.now() + st.days * 864e5);
      ctx.html(`<div class="ix-book"><article class="ix-phone"><div class="ix-hero"><span class="brand" data-k="appName"></span><span class="greet"></span></div><div class="ix-pb">
        <div class="ix-hotel"><div><h3 data-k="hotel"></h3><div class="loc" data-k="location"></div></div><div class="ix-score"><b class="sc"></b><div class="rv"></div></div></div>
        <div class="ix-stepper"><span data-k="nightsLabel"></span><div><button data-s="nights" data-d="-1">−</button><output class="ni"></output><button data-s="nights" data-d="1">+</button></div></div>
        <div class="ix-stepper"><span data-k="guestsLabel"></span><div><button data-s="guests" data-d="-1">−</button><output class="gu"></output><button data-s="guests" data-d="1">+</button></div></div>
        <div class="ix-info"><div><span class="ci"></span><span class="tag cd"></span></div><div class="am"></div><div class="live"></div></div>
        <div class="ix-foot"><div class="total"><span class="per"></span><b class="tot"></b></div><button data-k="book"></button></div></div></article>
        <div class="ix-card"><h2>t() 呼叫與翻譯結果 <code class="lc"></code></h2><div class="ix-calls"></div></div></div>`);
      const q = (s) => ctx.$(s);
      const suffix = (key, count) => {
        if (count === 0 && inst.exists(`${key}_zero`)) return `${key}_zero`;
        const s = `${key}_${new Intl.PluralRules(inst.language).select(count)}`;
        return inst.exists(s) ? s : `${key}_other`;
      };
      const render = (animate) => {
        const t = inst.t;
        ctx.$$("[data-k]").forEach((el) => (el.textContent = t(el.dataset.k)));
        q(".ix-phone").lang = inst.language;
        q(".greet").textContent = t("greeting", { name: st.name });
        q(".sc").textContent = t("score", { v: 9.2 });
        q(".rv").textContent = t("reviews", { count: 1286 });
        q(".ni").textContent = t("nights", { count: st.nights });
        q(".gu").textContent = t("guests", { count: st.guests });
        q(".ci").textContent = t("checkin", { date: checkin });
        q(".cd").textContent = t("countdown", { days: st.days });
        const amen = t("amenItems", { returnObjects: true });
        q(".am").textContent = t("amenities", { list: amen });
        q(".live").textContent = t("viewing", { count: st.viewing });
        const nightly = 3200 + Math.max(0, st.guests - 2) * 600;
        q(".per").textContent = t("perNight", { val: nightly });
        q(".tot").textContent = st.nights ? t("total", { val: nightly * st.nights }) : t("totalZero");
        q(".lc").textContent = `lng: "${inst.language}"`;
        const calls = [
          ["greeting", `{ name: <s>"${st.name}"</s> }`, t("greeting", { name: st.name }), "greeting", "插值"],
          ["nights", `{ count: <s>${st.nights}</s> }`, t("nights", { count: st.nights }), suffix("nights", st.nights), "複數"],
          ["guests", `{ count: <s>${st.guests}</s> }`, t("guests", { count: st.guests }), suffix("guests", st.guests), "複數"],
          ["perNight", `{ val: <s>${nightly}</s> }`, t("perNight", { val: nightly }), "perNight", "currency"],
          ["checkin", `{ date: <s>new Date()</s> }`, t("checkin", { date: checkin }), "checkin", "datetime"],
          ["countdown", `{ days: <s>${st.days}</s> }`, t("countdown", { days: st.days }), "countdown", "relativetime"],
          ["amenities", "{ list: <s>[…]</s> }", t("amenities", { list: amen }), "amenities", "list"],
        ];
        q(".ix-calls").innerHTML = calls.map(([k, args, out, hit, tag]) => `<div class="ix-call${animate ? " ix-fade" : ""}"><div class="fn"><span class="sfx">${hit !== k ? hit : tag}</span><i>t</i>("${k}", ${args})</div>` +
          `<div class="ix-tpl">${tplHtml(inst.getResource(inst.language, "translation", hit))}</div><div class="out">${esc(out)}</div></div>`).join("");
        if (animate) { q(".ix-phone").classList.remove("ix-fade"); void q(".ix-phone").offsetWidth; q(".ix-phone").classList.add("ix-fade"); }
      };
      let auto = true, step = 0;
      const seg = ctx.group(LNGS.map((l) => LANG_NAME[l]), 0, (i) => { auto = false; setLng(LNGS[i]); });
      const setLng = (l) => inst.changeLanguage(l).then(() => { if (!ctx.active) return; [...seg.children].forEach((b, i) => b.setAttribute("aria-pressed", String(LNGS[i] === l))); render(true); });
      ctx.on(q(".ix-phone"), "click", (e) => {
        const b = e.target.closest("[data-s]");
        if (!b) return;
        auto = false;
        const k = b.dataset.s;
        st[k] = Math.max(k === "guests" ? 1 : 0, Math.min(k === "guests" ? 8 : 30, st[k] + +b.dataset.d));
        render(false);
      });
      const STEPS = [[2, 2, 1], [1, 1, 5], [0, 3, 12], [3, 4, 1]];
      ctx.interval(() => {
        if (!auto) return;
        step += 1;
        [st.nights, st.guests, st.viewing] = STEPS[step % STEPS.length];
        setLng(LNGS[step % LNGS.length]);
      }, 3200);
      render(false);
    },
  },
  {

          <div class="ix-chips">${CALLS.map(([k, o]) => `<button type="button" data-k="${esc(k)}" data-o="${esc(o)}">${esc(k)}</button>`).join("")}</div>
          <h2 style="margin-top:10px">原始字串</h2><pre class="ix-pre raw"></pre><h2 style="margin-top:8px">展開的 $t() 參照</h2><div class="refs ix-sub"></div><h2 style="margin-top:8px">結果</h2><div class="ix-big out"></div></div>
        <div class="ix-card"><h2>const tm = getFixedT(null, null, "menu")</h2><div class="ix-sub fx"></div></div></div></div>`);
      let inst;
      const T = ctx.$(".res");
      T.value = JSON.stringify(RES, null, 1);
      const rebuild = () => {
        try { inst = make({ lng: "zh-TW", resources: { "zh-TW": { translation: JSON.parse(T.value) } } }); ctx.$(".rs").textContent = "已用新資源重新 init"; }
        catch (e) { ctx.$(".rs").innerHTML = `<span class="ix-err">JSON 格式錯誤：${esc(e.message)}</span>`; }
      };
      const render = () => {
        if (!inst) return;
        const key = ctx.$(".key").value.trim();
        let opts = {};
        try { opts = JSON.parse(ctx.$(".opt").value || "{}"); } catch (e) { ctx.$(".out").innerHTML = `<span class="ix-err">選項 JSON 錯誤</span>`; return; }
        const raw = inst.getResource("zh-TW", "translation", key);
        ctx.$(".raw").innerHTML = typeof raw === "string" ? tplHtml(raw) : esc(JSON.stringify(raw, null, 1) ?? "（無此鍵）");
        const refs = typeof raw === "string" ? [...raw.matchAll(/\$t\(([^,)]+)(?:,\s*([^)]*))?\)/g)] : [];
        ctx.$(".refs").innerHTML = refs.length ? refs.map((m) => `<div><code class="ix-code">$t(${esc(m[1])})</code> → ${tplHtml(inst.getResource("zh-TW", "translation", m[1]) ?? inst.getResource("zh-TW", "translation", `${m[1]}_other`))}${m[2] ? `　參數 <code class="ix-code">${esc(m[2])}</code>` : ""}</div>`).join("") : "無";
        const out = inst.t(key, opts);
        ctx.$(".out").innerHTML = typeof out === "string" ? esc(out) : `<pre class="ix-pre">${esc(JSON.stringify(out, null, 1))}</pre>`;
        const tm = inst.getFixedT(null, null, "menu");
        ctx.$(".fx").innerHTML = [["title", {}], ["price.tea", { v: 65 }], ["drinks", { returnObjects: true }]].map(([k, o]) => { const v = tm(k, o); return `<div><code class="ix-code">tm("${k}"${o.v ? ", { v: 65 }" : o.returnObjects ? ", { returnObjects: true }" : ""})</code> → <b>${esc(Array.isArray(v) ? v.join("、") : v)}</b></div>`; }).join("");
      };
      const pick = (k, o) => { ctx.$(".key").value = k; ctx.$(".opt").value = o; render(); };
      ctx.on(T, "input", () => { rebuild(); render(); });
      [".key", ".opt"].forEach((s) => ctx.on(ctx.$(s), "input", render));
      ctx.on(ctx.el, "click", (e) => { const b = e.target.closest("[data-k]"); if (b) pick(b.dataset.k, b.dataset.o); });
      rebuild(); pick(...CALLS[1]);
    },
  },
  {
    id: "detect", title: "語言偵測與事件",
    api: "i18next.use(LanguageDetector)・detection.order・addDetector()・caches・on(\"languageChanged\" | \"missingKey\" | \"added\")",
    desc: "語言偵測外掛依 order 逐一詢問各來源，再從 supportedLngs 挑最接近的語言。這裡把網址參數換成可調的自訂偵測器（無頭環境不能改網址），localStorage 與瀏覽器設定是真的讀取。changeLanguage 後外掛會把結果寫進 localStorage，下次偵測就會優先命中。右邊是 i18next 實例發出的事件紀錄。",
    hint: "上方切換偵測順序與模擬的 ?lng=；按「新增韓文資源」後再切到韓文",
    mount(ctx) {
      const LS_KEY = "atlas-i18n-demo-lng";
      const RES = { "zh-TW": { translation: { hi: "歡迎使用台灣好好玩", sub: "已為您切換為繁體中文" } }, en: { translation: { hi: "Welcome to Taiwan Getaway", sub: "Showing English" } }, ja: { translation: { hi: "台湾トラベルへようこそ", sub: "日本語で表示しています" } } };
      const ORDERS = [["demoQuery", "localStorage", "navigator", "htmlTag"], ["navigator", "localStorage", "htmlTag"], ["htmlTag", "navigator"]];
      const SRC = { demoQuery: "模擬網址 ?lng=", localStorage: `localStorage["${LS_KEY}"]`, navigator: "navigator.languages", htmlTag: "<html lang>" };
      const events = [];
      let oi = 0, query = "", inst, det;
      wrap(ctx, `<div class="ix-cols wide"><div class="ix-card"><h2>偵測來源（依 order）</h2><div style="overflow-x:auto"><table class="ix-tbl"><thead><tr><th>#</th><th>來源</th><th>讀到的值</th></tr></thead><tbody></tbody></table></div>
          <div class="ix-sub res" style="margin-top:8px"></div><div class="ix-card" style="margin-top:8px;background:var(--bg)"><div class="ix-big hi"></div><div class="ix-sub sub"></div></div></div>
        <div class="ix-card"><h2>事件紀錄</h2><ul class="ix-log"></ul></div></div>`);
      const log = (cls, text) => { events.unshift([now(), cls, text]); events.length = Math.min(events.length, 14); ctx.$(".ix-log").innerHTML = events.map(([t, c, x]) => `<li><span>${t}</span><span class="${c}">${esc(x)}</span></li>`).join(""); };
      const build = () => {
        // The plugin's init() resets its detector table, so the custom detector is registered inside init.
        det = new (class extends i18nextBrowserLanguageDetector { init(...a) { super.init(...a); this.addDetector({ name: "demoQuery", lookup: () => query || undefined }); } })();
        inst = i18next.createInstance();
        inst.on("initialized", () => log("in", "initialized"));
        inst.on("languageChanged", (l) => log("lc", `languageChanged → ${l}`));
        inst.on("missingKey", (lngs, ns, key) => log("mk", `missingKey ${key} @ ${lngs}`));
        inst.use(det).init({ initAsync: false, resources: RES, fallbackLng: "en", supportedLngs: ["zh", "zh-TW", "en", "ja", "ko"], nonExplicitSupportedLngs: true, saveMissing: true, missingKeyHandler: () => {},
          detection: { order: ORDERS[oi], lookupLocalStorage: LS_KEY, caches: ["localStorage"] } });
        inst.store.on("added", (l, ns) => log("ad", `added ${l} / ${ns}`));
        render();
      };
      const render = () => {
        let first = true;
        ctx.$("tbody").innerHTML = ORDERS[oi].map((name, i) => {
          let v;
          try { v = det.detectors[name].lookup(det.options); } catch (e) { v = `讀取失敗：${e.message}`; }
          const show = v == null || (Array.isArray(v) && !v.length) ? "" : Array.isArray(v) ? v.join(", ") : String(v);
          const mark = show && first ? (first = false, " <span class=\"ix-badge ok\">優先</span>") : "";
          return `<tr><td class="num">${i + 1}</td><td><code>${esc(SRC[name])}</code></td><td>${show ? `<code>${esc(show)}</code>${mark}` : "<span class=\"ix-badge\">無</span>"}</td></tr>`;
        }).join("");
        ctx.$(".res").innerHTML = `detect() 候選 <b>[${esc([].concat(det.detect() ?? []).join(", "))}]</b>，i18next 從 supportedLngs 挑最接近者；目前 language <b>${inst.language}</b>，resolvedLanguage <b>${inst.resolvedLanguage}</b>`;
        ctx.$(".hi").textContent = inst.t("hi"); ctx.$(".sub").textContent = inst.t("sub");
      };
      ctx.select("順序", ORDERS.map((o, i) => ({ value: i, label: o.join(" → ") })), 0, (v) => { oi = +v; build(); });
      ctx.select("?lng=", [["", "（無）"], ["ja", "ja"], ["en-GB", "en-GB"], ["zh-TW", "zh-TW"], ["ko", "ko"]].map(([value, label]) => ({ value, label })), "", (v) => { query = v; inst.changeLanguage().then(() => ctx.active && render()); });
      ctx.select("切換", ["zh-TW", "en", "ja", "ko"], "", (v) => inst.changeLanguage(v).then(() => ctx.active && render()));
      ctx.button("新增韓文資源", () => { inst.addResourceBundle("ko", "translation", { hi: "타이완 여행에 오신 것을 환영합니다", sub: "한국어로 표시 중" }); render(); });
      ctx.button("查不存在的鍵", () => { inst.t("promo.banner"); render(); });
      ctx.button("清除快取", () => { try { localStorage.removeItem(LS_KEY); log("mk", "localStorage 已清除"); } catch (e) { log("mk", `localStorage 無法使用：${e.message}`); } render(); });
      build();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "i18next.init({ resources })・t() 對照手寫查表＋replace",
    desc: "產生 n 個翻譯鍵，量 init 的耗時，再呼叫 t() 五萬次算吞吐量，與「物件查表加正規式替換」的手寫版本並排。上方切換 t() 要做的事：純文字、插值、複數、$t 巢狀、數字格式化。",
    hint: "上方選 t() 類型，左側按「開始測試」",
    mount(ctx) {
      const CALLS = 50000;
      const fill = (s, o) => s.replace(/\{\{(\w+)\}\}/g, (m, k) => o[k]);
      const MODES = [
        { name: "純文字", gen: (r, i) => { r[`k${i}`] = `第 ${i} 則通知`; }, opt: () => undefined, nat: (r, k) => r[k] },
        { name: "插值", gen: (r, i) => { r[`k${i}`] = `第 ${i} 筆，{{name}} 您好，共 {{n}} 件`; }, opt: (j) => ({ name: "怡君", n: j }), nat: (r, k, o) => fill(r[k], o) },
        { name: "複數", gen: (r, i) => { r[`k${i}_one`] = `{{count}} item ${i}`; r[`k${i}_other`] = `{{count}} items ${i}`; }, opt: (j) => ({ count: j % 3 }), nat: (r, k, o, pr) => fill(r[`${k}_${pr.select(o.count)}`], o) },
        { name: "$t 巢狀", gen: (r, i) => { r.base = "台灣好好玩"; r[`k${i}`] = `$t(base) 第 ${i} 站`; }, opt: () => undefined, nat: (r, k) => r[k].replace(/\$t\((\w+)\)/g, (m, x) => r[x]) },
        { name: "數字格式化", gen: (r, i) => { r[`k${i}`] = `第 ${i} 筆 {{v, number}} 元`; }, opt: (j) => ({ v: j * 1234.5 }), nat: (r, k, o, pr, nf) => r[k].replace("{{v, number}}", nf.format(o.v)) },
      ];
      const results = MODES.map(() => new Map());
      let mi = 0, gen = 0;
      ctx.html(`<div class="ix-stress"><div class="ix-card"><h2>各級距結果 <code class="mode"></code></h2><div style="overflow-x:auto"><table class="ix-tbl"><thead><tr><th>鍵數</th><th>init</th><th>t() 每秒</th><th>手寫查表每秒</th><th>倍率</th></tr></thead><tbody></tbody></table></div>
        <div class="ix-legend"><span><i style="--k:var(--c5)"></i>init 耗時</span><span><i style="--k:var(--c2)"></i>i18next t()</span><span><i style="--k:var(--c3)"></i>手寫查表</span></div></div>
        <div class="ix-card"><h2>觀察</h2><div class="ix-sub obs">按左側「開始測試」。</div></div></div>`);
      const cell = (v, max, k, txt) => `<div class="ix-cell"><div class="ix-sbar" style="--k:${k}"><i style="width:${Math.max(3, (v / max) * 100)}%"></i></div><span>${txt}</span></div>`;
      const paint = () => {
        const rows = [...results[mi].values()];
        ctx.$(".mode").textContent = `${MODES[mi].name}・每級距 t() ${Showcase.fmtCompact(CALLS)} 次`;
        const mi0 = Math.max(0.01, ...rows.map((r) => r.init)), mr = Math.max(1, ...rows.flatMap((r) => [r.rate, r.nrate]));
        ctx.$("tbody").innerHTML = rows.length ? rows.map((r) => `<tr><td class="num">${Showcase.fmtCompact(r.n)}</td><td>${cell(r.init, mi0, "var(--c5)", Showcase.fmtMs(r.init))}</td><td>${cell(r.rate, mr, "var(--c2)", Showcase.fmtCompact(r.rate))}</td><td>${cell(r.nrate, mr, "var(--c3)", Showcase.fmtCompact(r.nrate))}</td><td class="num">${(r.nrate / r.rate).toFixed(1)}×</td></tr>`).join("")
          : `<tr><td colspan="5" class="ix-empty">尚未測試</td></tr>`;
        const a = rows[0], z = rows[rows.length - 1];
        if (z) ctx.$(".obs").innerHTML = `${Showcase.fmtCompact(z.n)} 個鍵時 init 花 <b>${Showcase.fmtMs(z.init)}</b>，t() 每秒約 <b>${Showcase.fmtCompact(z.rate)}</b> 次${rows.length > 1 ? `（鍵數 ${Showcase.fmtCompact(a.n)} 時為 ${Showcase.fmtCompact(a.rate)}，查表是物件屬性存取，鍵數增加幾乎不影響）` : ""}。` +
          `手寫版本快 <b>${(z.nrate / z.rate).toFixed(1)} 倍</b>，差距來自 i18next 每次呼叫都要解析選項、走 fallback 鏈、處理跳脫與後處理；一般介面每次渲染只呼叫數十到數百次，這個成本感覺不到。`;
      };
      const makeBench = () => {
        const lab = ctx.el.querySelector(".sc-lab");
        if (lab) lab.remove();
        const my = ++gen, m = mi, M = MODES[m];
        ctx.bench({
          label: "翻譯鍵數", unit: "鍵", sizes: [1000, 10000, 50000, 100000, 300000], target: 1500, budget: 4000,
          prepare(n) { const r = {}; for (let i = 0; i < n; i++) M.gen(r, i); return r; },
          run(n, r) {
            if (my !== gen) throw new DOMException("Bench replaced", "AbortError");
            let t0 = performance.now();
            const inst = make({ lng: "en", resources: { en: { translation: r } } });
            const init = performance.now() - t0;
            const keys = Array.from({ length: 997 }, (_, j) => `k${(j * 7919) % n}`);
            let s = 0;
            t0 = performance.now();
            for (let j = 0; j < CALLS; j++) s += inst.t(keys[j % 997], M.opt(j)).length;
            const ti = performance.now() - t0;
            const pr = new Intl.PluralRules("en"), nf = new Intl.NumberFormat("en");
            t0 = performance.now();
            for (let j = 0; j < CALLS; j++) s += M.nat(r, keys[j % 997], M.opt(j), pr, nf).length;
            const tn = performance.now() - t0;
            const same = inst.t(keys[5], M.opt(5)) === M.nat(r, keys[5], M.opt(5), pr, nf);
            results[m].set(n, { n, init, rate: CALLS / (ti / 1000), nrate: CALLS / (tn / 1000) });
            paint();
            return `init ${Showcase.fmtMs(init)}・t() ${Showcase.fmtMs(ti)}${same ? "" : "・輸出不同"}${s < 0 ? "" : ""}`;
          },
          note: "每級距重新產生資源並建立新實例；t() 與手寫版本都抽 997 個鍵循環呼叫，並比對同一鍵兩邊輸出是否一致。",
        });
      };
      ctx.group(MODES.map((x) => x.name), 0, (i) => { mi = i; makeBench(); paint(); });
      ctx.controls.classList.add("bottom");
      makeBench();
      paint();
    },
  },
] });

// Wrap a { lng: { key: value } } map into i18next's { lng: { translation: {...} } } resource shape.
function _resources(map) { return Object.fromEntries(Object.entries(map).map(([l, t]) => [l, { translation: t }])); }
</script>
</body>
