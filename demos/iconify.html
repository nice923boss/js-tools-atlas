async function getJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);

}
async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Clipboard API is often blocked inside iframes; fall back to a temporary textarea.
    const t = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(t);
    t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  }
}
function toaster(ctx) {
  const el = h("div", { class: "ic-toast" });
  ctx.el.append(el);

function renderedMode(el) {
  const node = [...el.shadowRoot.childNodes].find((n) => n.nodeName === "svg" || n.nodeName === "SPAN");

// Procedural shapes on a 24x24 grid: star-N, poly-N, ring-N.
function shapePoints(kind, n, inner = 0.45, R = 10) {
  const steps = kind === "star" ? n * 2 : n, pts = [];
  for (let i = 0; i < steps; i++) {
    const rad = kind === "star" && i % 2 ? R * inner : R;
    const a = -Math.PI / 2 + (i * Math.PI * 2) / steps;
    pts.push(`${(12 + rad * Math.cos(a)).toFixed(2)} ${(12 + rad * Math.sin(a)).toFixed(2)}`);
  }
  return `M${pts.join("L")}Z`;
}

  ["ph", ["house-duotone", "magnifying-glass-duotone", "gear-duotone", "heart-duotone", "user-duotone", "camera-duotone", "coffee-duotone"]],
  ["material-symbols", ["home-rounded", "search-rounded", "settings-rounded", "favorite-rounded", "person-rounded", "photo-camera-rounded", "coffee-rounded"]],
  ["fluent-emoji-flat", ["house", "magnifying-glass-tilted-left", "gear", "red-heart", "bust-in-silhouette", "camera", "hot-beverage"]],
];
const BRANDS = ["javascript", "typescript-icon", "react", "vue", "nodejs-icon", "vitejs"];
const FLAGS = ["tw-4x3", "jp-4x3", "kr-4x3", "us-4x3", "fr-4x3", "de-4x3"];

Showcase.run({
  scenes: [
  // 1. Original signature demo: live search across every icon set.
  {
    id: "search", title: "跨圖示集搜尋",
    api: "fetch(api.iconify.design/search) + <iconify-icon icon=\"prefix:name\">",
    desc: "用 Iconify 公開 API 同時搜尋 200 多套圖示集，結果直接以 <iconify-icon> 顯示，元件會自動把同一圖示集的圖示合併成一次請求下載。點圖示複製「圖示集:名稱」，右側可旋轉、翻轉並看授權資訊。",
    hint: "輸入英文關鍵字或點快捷詞；點圖示複製名稱",
    mount(ctx) {
      ctx.html(`<div class="ic-fill ic-app">
        <div class="ic-main">
          <div class="ic-top"><label class="ic-search"><iconify-icon icon="mdi:magnify" height="20"></iconify-icon><input value="cat" placeholder="輸入英文關鍵字" autocomplete="off" aria-label="搜尋圖示"><span class="ic-total mono"></span></label>
            <select class="ic-set" aria-label="圖示集">${SETS.map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></div>
          <div class="ic-chips"></div>
          <div class="ic-grid"></div>
        </div>
        <div class="ic-side">
          <div class="ic-big"><iconify-icon icon="noto:cat-face"></iconify-icon></div>
          <div><div class="ic-id mono"></div><div class="ic-meta"></div></div>
          <div class="ic-tools"><button class="btn" type="button" data-a="rot">旋轉 90°</button><button class="btn" type="button" data-a="flip">水平翻轉</button><button class="btn" type="button" data-a="copy">複製標籤</button></div>
          <pre class="ic-pre"></pre>
        </div></div>`);
      const input = ctx.$("input"), setSel = ctx.$(".ic-set"), grid = ctx.$(".ic-grid"), total = ctx.$(".ic-total");
      const big = ctx.$(".ic-big iconify-icon"), idEl = ctx.$(".ic-id"), meta = ctx.$(".ic-meta"), pre = ctx.$(".ic-side .ic-pre");
      const toast = toaster(ctx);
      let collections = {}, selected = "noto:cat-face", rotate = 0, flipped = false, seq = 0, timer = 0;
      ctx.onCleanup(() => clearTimeout(timer));
      ctx.$(".ic-chips").append(...QUICK.map(([label, q, icon]) => h("button", { class: "ic-chip", type: "button", "data-q": q }, ico(icon, { height: 18 }), label)));

      async function search() {
        const q = input.value.trim(), my = ++seq;
        if (!q) { grid.innerHTML = `<div class="ic-msg">輸入關鍵字開始搜尋</div>`; total.textContent = ""; return; }
        grid.innerHTML = `<div class="ic-msg">搜尋中…</div>`;
        const url = new URL(`${API}/search`);
        url.search = new URLSearchParams({ query: q, limit: 150, ...(setSel.value && { prefixes: setSel.value }) });
        try {
          const data = await getJSON(url);
          if (my !== seq || !ctx.active) return;
          collections = { ...collections, ...data.collections };
          total.textContent = `${data.icons.length} 個・${Object.keys(data.collections || {}).length} 套`;
          grid.innerHTML = data.icons.length
            ? data.icons.map((id) => `<button class="ic-tile" type="button" data-id="${id}" title="${id}" aria-pressed="${id === selected}"><iconify-icon icon="${id}"></iconify-icon><small>${id.split(":")[0]}</small></button>`).join("")
            : `<div class="ic-msg">找不到「${esc(q)}」，試試 heart、star、train</div>`;
        } catch (err) {
          console.warn("Iconify search failed", err);
          if (my === seq && ctx.active) grid.innerHTML = `<div class="ic-msg">無法連線到 Iconify API（${esc(err.message)}）。<br>這個場景需要外網；離線時可看「離線自訂圖示」與「極限測試」。</div>`;
        }
      }
      function code() {
        return `<iconify-icon icon="${selected}"${rotate ? ` rotate="${rotate}deg"` : ""}${flipped ? ` flip="horizontal"` : ""}></iconify-icon>`;
      }
      function show() {
        big.setAttribute("icon", selected);
        big.setAttribute("rotate", `${rotate}deg`);
        flipped ? big.setAttribute("flip", "horizontal") : big.removeAttribute("flip");
        idEl.textContent = selected;
        const c = collections[selected.split(":")[0]];
        meta.textContent = c ? `${c.name}・${c.total.toLocaleString("zh-TW")} 個圖示・${c.license?.title || "授權見官網"}${c.author?.name ? `・${c.author.name}` : ""}` : "點任一圖示即複製名稱";
        pre.textContent = code();
      }
      grid.addEventListener("click", async (e) => {
        const t = e.target.closest(".ic-tile");
        if (!t) return;
        grid.querySelector('[aria-pressed="true"]')?.setAttribute("aria-pressed", "false");
        t.setAttribute("aria-pressed", "true");
        selected = t.dataset.id; rotate = 0; flipped = false;
        show();
        toast((await copy(selected)) ? `已複製 ${selected}` : "瀏覽器不允許自動複製，請手動選取名稱");
      });
      ctx.$(".ic-chips").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) { input.value = b.dataset.q; search(); }
      });
      ctx.$(".ic-tools").addEventListener("click", async (e) => {
        const a = e.target.closest("button")?.dataset.a;
        if (a === "rot") rotate = (rotate + 90) % 360;
        if (a === "flip") flipped = !flipped;
        if (a === "copy") toast((await copy(code())) ? "已複製元件標籤" : "瀏覽器不允許自動複製");
        show();
      });
      input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 350); });
      setSel.addEventListener("change", search);
      search();
      show();
    },
  },

  // 2. Same concept across sets, plus palette sets (logos, flags).
  {
    id: "tour", title: "圖示集巡禮",
    api: "<iconify-icon icon=\"mdi:home\"> + fetch(/collections?prefixes=…)",
    desc: "同一個概念在六套圖示集裡長什麼樣子：線條、填色、雙色調到彩色表情；下方是品牌標誌與國旗。打開「著色」只會改變單色圖示，彩色集（palette）保留原本配色；左欄的作者與授權由 /collections API 取得。",
    hint: "拖動尺寸、切換著色，比較單色與彩色圖示集",
    mount(ctx) {
      ctx.html(`<div class="ic-fill ic-tour"><div class="ic-tbl"></div><div class="ic-strips"></div><div class="ic-note ic-tstat"></div></div>`);
      const wrap = ctx.$(".ic-tour"), tbl = ctx.$(".ic-tbl"), heads = {};
      ctx.slider("尺寸", { min: 16, max: 48, step: 2, value: 28, format: (v) => `${v}px` }, (v) => wrap.style.setProperty("--ic-s", `${v}px`));
      ctx.toggle("著色 color", false, (on) => wrap.style.setProperty("--ic-ink", on ? "var(--c3)" : "var(--fg)"));
      tbl.append(h("div", { class: "ic-th", text: "圖示集" }), ...CONCEPTS.map((c) => h("div", { class: "ic-th", text: c })));
      for (const [prefix, names] of TOUR) {
        heads[prefix] = h("small", { text: "讀取資訊中…" });
        tbl.append(h("div", { class: "ic-rh" }, h("b", { text: prefix }), heads[prefix]),
          ...names.map((n) => h("div", { class: "ic-cell", title: `${prefix}:${n}` }, ico(`${prefix}:${n}`))));
      }
      const strip = (prefix, title, names) => {
        heads[prefix] = h("code", { text: "" });
        return h("div", { class: "ic-card" }, h("h3", {}, title, heads[prefix]),
          h("div", { class: "ic-strip" }, names.map((n) => h("span", { title: `${prefix}:${n}` }, ico(`${prefix}:${n}`), h("small", { text: n.replace(/-(icon|4x3)$/, "") })))));
      };
      ctx.$(".ic-strips").append(strip("logos", "品牌標誌 logos", BRANDS), strip("flag", "國旗 flag（4:3）", FLAGS));
      const prefixes = [...TOUR.map((t) => t[0]), "logos", "flag"];
      getJSON(`${API}/collections?prefixes=${prefixes.join(",")}`).then((data) => {
        if (!ctx.active) return;
        for (const p of prefixes) {
          const c = data[p];
          if (c) heads[p].textContent = `${c.name}・${c.total.toLocaleString("zh-TW")} 個・${c.license?.spdx || c.license?.title || ""}${c.palette ? "・彩色" : ""}`;
        }
      }).catch((e) => { for (const p of prefixes) heads[p].textContent = `無法取得資訊（${e.message}）`; });
      ctx.timeout(() => {
        const els = ctx.$$(".ic-tour iconify-icon"), by = (s) => els.filter((e) => e.status === s).length;
        ctx.$(".ic-tstat").textContent = `共 ${els.length} 個 <iconify-icon>：rendered ${by("rendered")}、loading ${by("loading")}、failed ${by("failed")}。${by("loading") ? "仍在載入，可能沒有外網。" : ""}`;
      }, 3500);
    },
  },

  // 3. Customisation attributes: height, rotate, flip, color.
  {
    id: "transform", title: "尺寸旋轉翻轉",
    api: "<iconify-icon height rotate=\"90deg\" flip=\"horizontal\">",
    desc: "只設定 height 時寬度依 viewBox 比例自動算出，所以寬版 Logo 不會被壓扁；rotate 與 flip 直接改寫 SVG 的 transform，旋轉 90 度時寬高會對調。color 透過 currentColor 只影響單色圖示。虛線框是元件實際占的盒子。",
    hint: "調整高度、旋轉、翻轉與顏色，看實測尺寸變化",
    mount(ctx) {
      const items = [["tabler:arrow-big-right", "單色向量"], ["noto:rocket", "彩色"], ["logos:google", "寬版 Logo"]];
      ctx.html(`<div class="ic-fill ic-xf">${items.map(([id, label]) => `<div class="ic-xcard"><div class="ic-xstage"><iconify-icon icon="${id}"></iconify-icon></div><div class="ic-xcap"><span>${label}</span><span>…</span></div></div>`).join("")}<pre class="ic-pre"></pre></div>`);
      const els = ctx.$$(".ic-xstage iconify-icon"), caps = ctx.$$(".ic-xcap span:last-child"), pre = ctx.$(".ic-xf .ic-pre");
      const st = { size: 64, rot: 0, flip: "", color: "var(--fg)" };
      const FLIPS = ["", "horizontal", "vertical"];
      function measure() {
        els.forEach((e, i) => {
          const r = e.getBoundingClientRect();
          caps[i].textContent = e.status === "rendered" ? `${Math.round(r.width)} × ${Math.round(r.height)} px` : e.status;
        });
      }
      function apply() {
        ctx.$(".ic-xf").style.setProperty("--ic-ink", st.color);
        for (const e of els) {
          e.setAttribute("height", st.size);
          st.rot ? e.setAttribute("rotate", `${st.rot}deg`) : e.removeAttribute("rotate");
          st.flip ? e.setAttribute("flip", st.flip) : e.removeAttribute("flip");
        }
        pre.textContent = `<iconify-icon icon="logos:google" height="${st.size}"${st.rot ? ` rotate="${st.rot}deg"` : ""}${st.flip ? ` flip="${st.flip}"` : ""} style="color: ${st.color}">\n<!-- 沒給 width：寬度 = height × viewBox 寬高比，旋轉 90°／270° 時改用高寬比 -->`;
        ctx.timeout(measure, 80);
      }
      ctx.slider("高度", { min: 16, max: 120, step: 4, value: st.size, format: (v) => `${v}px` }, (v) => { st.size = v; apply(); });
      ctx.group(["0°", "90°", "180°", "270°"], 0, (i) => { st.rot = i * 90; apply(); });
      ctx.group(["不翻轉", "水平", "垂直"], 0, (i) => { st.flip = FLIPS[i]; apply(); });
      ctx.select("顏色", COLORS, st.color, (v) => { st.color = v; apply(); });
      apply();
      ctx.interval(measure, 1000);
    },
  },

  // 4. Render modes and inline alignment.
  {
    id: "modes", title: "渲染模式與行內",
    api: "mode=\"svg|bg|mask|style\" + inline + restartAnimation()",
    desc: "同一顆圖示用四種模式渲染（顏色都設成粉紅）：svg 直接放 <svg>；bg 把 SVG 當背景圖，currentColor 會變成黑色；mask 用遮罩吃 currentColor，彩色圖示會變剪影。不指定時，含 SMIL 動畫的圖示會自動改用 mask 或 bg。右側比較 inline 屬性對基線的影響。",
    hint: "看每格下方實際採用的模式；黃字是元件自動決定的",
    mount(ctx) {
      const ROWS = [["tabler:heart", "單色"], ["noto:rocket", "彩色"], ["svg-spinners:ring-resize", "單色動畫"], ["svg-spinners:bars-scale", "單色動畫"]];
      const MODES = ["", "svg", "bg", "mask"];
      ctx.html(`<div class="ic-fill ic-modes">
        <div class="ic-card"><h3>mode 屬性<code>預設 = 自動</code></h3><div class="ic-mtbl"></div></div>
        <div class="ic-card ic-inl"><h3>inline 屬性<code>vertical-align</code></h3>
          <p><u>下載</u><iconify-icon icon="tabler:download"></iconify-icon><u>檔案</u>、<u>離線</u><iconify-icon icon="tabler:cloud-off"></iconify-icon><u>模式</u></p><div class="ic-note"></div>
          <p><u>下載</u><iconify-icon inline icon="tabler:download"></iconify-icon><u>檔案</u>、<u>離線</u><iconify-icon inline icon="tabler:cloud-off"></iconify-icon><u>模式</u></p><div class="ic-note"></div>
          <div class="ic-note">底線是文字基線。加上 inline 後元件改為 vertical-align: -0.125em，圖示底部會略低於基線，視覺上和中文字置中對齊。</div></div></div>`);
      const tbl = ctx.$(".ic-mtbl");
      tbl.append(h("div"), ...MODES.map((m) => h("div", { class: "ic-th", text: m || "不指定" })));
      const cells = [];
      for (const [id, label] of ROWS) {
        tbl.append(h("div", { class: "ic-rh" }, h("b", { text: id.split(":")[1] }), h("small", { text: label })));
        for (const m of MODES) {
          const el = ico(id, m ? { mode: m } : {}), tag = h("small", { text: "…" });
          cells.push([el, tag, m]);
          tbl.append(h("div", { class: "ic-mcell" }, el, tag));
        }
      }
      const notes = ctx.$$(".ic-inl > .ic-note");
      const paint = () => {
        for (const [el, tag, m] of cells) {
          tag.textContent = renderedMode(el);
          tag.classList.toggle("ic-auto", !m);
        }
        ctx.$$(".ic-inl p").forEach((p, i) => {
          notes[i].textContent = `${i ? "inline" : "預設"}：vertical-align = ${getComputedStyle(p.querySelector("iconify-icon")).verticalAlign}`;
        });
      };
      ctx.button("restartAnimation()", () => ctx.$$("iconify-icon[icon^='svg-spinners']").forEach((e) => e.restartAnimation()));
      ctx.toggle("inline 全開", false, (on) => ctx.$$(".ic-inl p:first-of-type iconify-icon").forEach((e) => (on ? e.setAttribute("inline", "") : e.removeAttribute("inline"))));
      paint();
      ctx.interval(paint, 600);
    },
  },

  // 5. Offline: addCollection, addIcon, custom loader, inline icon objects.
  {
    id: "offline", title: "離線自訂圖示",
    api: "addCollection(json) + addIcon() + setCustomIconLoader() + icon={…}",
    desc: "三種不連網的做法：用 addCollection 註冊頁內 JSON 圖示集（含 alias 與 hFlip 變體），用 setCustomIconLoader 在需要時才用程式產生圖示，或把 { body, width, height } 物件直接交給元件。全部不會發出網路請求。",
    hint: "點產生器的名稱或自己輸入，例如 star-9、poly-5；右側可直接改 SVG body",
    mount(ctx) {
      ctx.html(`<div class="ic-fill ic-off">
        <div class="ic-card"><h3>addCollection + addIcon</h3><div class="ic-gal"></div><pre class="ic-pre ic-api"></pre></div>
        <div class="ic-card"><h3>setCustomIconLoader<code>prefix: gen</code></h3>
          <div class="ic-genrow"></div><input class="ic-in" value="star-7" aria-label="產生器圖示名稱">
          <div class="ic-genbig"><iconify-icon icon="gen:star-7"></iconify-icon></div><div class="ic-note ic-gstat"></div></div>
        <div class="ic-card"><h3>icon = { body, width, height }</h3><textarea class="ic-ta" spellcheck="false" aria-label="SVG body"></textarea>
          <div class="ic-sizes"><iconify-icon height="16"></iconify-icon><iconify-icon height="32"></iconify-icon><iconify-icon height="96"></iconify-icon></div><div class="ic-note ic-err"></div></div></div>`);
      const GAL = [["tw:boba", "boba"], ["tw:bubble-tea", "alias"], ["tw:dumpling", "dumpling"], ["tw:taipei101", "taipei101"], ["tw:scooter", "scooter"], ["tw:scooter-left", "alias+hFlip"], ["tw:lantern", "addIcon 彩色"]];
      ctx.$(".ic-gal").append(...GAL.map(([id, label]) => h("span", { title: id }, ico(id), h("small", { text: label }))));
      const left = I.getIcon("tw:scooter-left");
      ctx.$(".ic-api").textContent = `listIcons("", "tw")\n→ ${JSON.stringify(I.listIcons("", "tw"))}\niconLoaded("tw:lantern") → ${I.iconLoaded("tw:lantern")}\ngetIcon("tw:scooter-left").hFlip → ${left && left.hFlip}`;

      const big = ctx.$(".ic-genbig iconify-icon"), input = ctx.$(".ic-in"), gstat = ctx.$(".ic-gstat");
      const GEN = ["star-5", "star-8", "star-12", "poly-3", "poly-6", "ring-8", "ring-24", "star-30"];
      ctx.$(".ic-genrow").append(...GEN.map((n) => h("button", { type: "button", "data-n": n }, ico(`gen:${n}`, { height: 14 }), " ", n)));
      const setGen = (n) => { input.value = n; big.setAttribute("icon", `gen:${n}`); };
      ctx.$(".ic-genrow").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setGen(b.dataset.n); });
      input.addEventListener("input", () => big.setAttribute("icon", `gen:${input.value.trim()}`));
      ctx.interval(() => {
        gstat.textContent = `狀態：${big.status}・產生器累計被呼叫 ${genCalls} 次（同名只產生一次，之後走記憶體）${big.status === "failed" ? "・名稱需為 star／poly／ring 加 3 到 24" : ""}`;
      }, 300);

      const ta = ctx.$(".ic-ta"), err = ctx.$(".ic-err"), sizes = ctx.$$(".ic-sizes iconify-icon");
      ta.value = '<g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">\n  <circle cx="12" cy="12" r="9"/>\n  <path d="M8 14s1.5 2 4 2 4-2 4-2"/>\n  <path d="M9 9h.01M15 9h.01"/>\n</g>';
      const renderBody = () => {
        const doc = new DOMParser().parseFromString(`<svg xmlns="http://www.w3.org/2000/svg">${ta.value}</svg>`, "image/svg+xml");
        const bad = doc.querySelector("parsererror");
        err.textContent = bad ? "SVG 語法錯誤，保留上一次的結果" : `body ${ta.value.length} 字元，16／32／96 px 共用同一份資料`;
        if (!bad) for (const e of sizes) e.icon = { body: ta.value, width: 24, height: 24 };
      };
      ta.addEventListener("input", renderBody);
      renderBody();
    },
  },

  // 6. Loading lifecycle: loadIcons callback, status, batching, in-memory cache.
  {
    id: "loading", title: "載入狀態與快取",
    api: "loadIcons(names, (loaded, missing, pending) => …) + el.status",
    desc: "從 tabler 6,000 多個名稱隨機抽 24 個，呼叫 loadIcons 並記錄每次回呼；同一圖示集的名稱會合併成一次 API 請求，不存在的名稱進入 missing、元件 status 變成 failed。再載一次同一批時資料已在記憶體，回呼立即完成、不發請求。",
    hint: "按「抽新一批」看載入過程；再按「同一批再載一次」比較",
    mount(ctx) {
      ctx.html(`<div class="ic-fill ic-load"><div class="ic-card"><h3>本批圖示<code class="ic-lsum"></code></h3><div class="ic-lgrid"><div class="ic-msg">讀取 tabler 名稱清單中…</div></div></div>
        <div class="ic-card"><h3>loadIcons 回呼紀錄<code>新的在上</code></h3><div class="ic-pre ic-log"></div></div></div>`);
      const grid = ctx.$(".ic-lgrid"), logEl = ctx.$(".ic-log"), sum = ctx.$(".ic-lsum");
      let names = null, batch = [], withMissing = true, round = 0;
      const log = (s) => { logEl.prepend(h("div", { text: s })); while (logEl.childElementCount > 80) logEl.lastChild.remove(); };
      const apiCount = () => performance.getEntriesByType("resource").filter((e) => e.name.startsWith(`${API}/tabler.json`)).length;
      function run(list, label) {
        grid.replaceChildren(...list.map((id) => h("div", { class: "ic-lt", "data-s": "loading", title: id }, ico(id), h("small", { text: id.split(":")[1] }))));
        const t0 = performance.now(), req0 = apiCount(), r = ++round;
        let calls = 0;
        log(`── 第 ${r} 輪 ${label}：loadIcons(${list.length} 個)`);
        const abort = I.loadIcons(list, (loaded, missing, pending) => {
          if (!ctx.active) return;
          calls++;
          const t = performance.now() - t0;
          log(`#${calls} ${fmtMs(t)}：loaded ${loaded.length}、missing ${missing.length}、pending ${pending.length}`);
          if (!pending.length) ctx.timeout(() => log(`完成 ${fmtMs(t)}・API 請求 ${apiCount() - req0} 次・missing：${missing.map((m) => m.name).join(", ") || "無"}`), 60);
        });
        ctx.onCleanup(abort);
      }
      function fresh() {
        if (!names) return;
        const pick = new Set();
        while (pick.size < (withMissing ? 23 : 24)) pick.add(`tabler:${names[(Math.random() * names.length) | 0]}`);
        batch = [...pick];
        if (withMissing) batch.push(`tabler:not-a-real-icon-${round + 1}`);
        run(batch, "新一批");
      }
      ctx.button("抽新一批", fresh, { primary: true });
      ctx.button("同一批再載一次", () => batch.length && run(batch, "同一批"));
      ctx.toggle("混入不存在的名稱", true, (v) => { withMissing = v; });
      ctx.interval(() => {
        const tiles = [...grid.children].filter((t) => t.classList.contains("ic-lt"));
        let ok = 0;
        for (const t of tiles) { const s = t.firstChild.status; t.dataset.s = s; if (s === "rendered") ok++; }
        if (tiles.length) sum.textContent = `rendered ${ok}／${tiles.length}`;
      }, 100);
      getJSON(`${API}/collection?prefix=tabler`).then((d) => {
        if (!ctx.active) return;
        names = [...(d.uncategorized || []), ...Object.values(d.categories || {}).flat()];
        log(`名稱清單：tabler 共 ${names.length.toLocaleString("zh-TW")} 個`);
        fresh();
      }).catch((e) => {
        if (!ctx.active) return;
        grid.innerHTML = `<div class="ic-msg">無法連線到 Iconify API（${esc(e.message)}），這個場景需要外網。</div>`;
        log(`錯誤：${e.message}`);
      });
    },
  },

  // 7. Export: loadIcon -> buildIcon -> iconToHTML -> svgToURL.
  {
    id: "export", title: "匯出 SVG",
    api: "loadIcon() → buildIcon(data, { height, rotate, hFlip }) → iconToHTML() → svgToURL()",
    desc: "不經過元件，直接用 Iconify 的工具函式把圖示資料組成獨立的 SVG 字串：buildIcon 算出 viewBox、寬高與 transform，iconToHTML 包成 <svg>，svgToURL 轉成 CSS 可用的 data URL。左側同一份輸出分別以行內 SVG、<img> 與 background-image 呈現。",
    hint: "換圖示、尺寸、旋轉與顏色，複製或下載 SVG／PNG",
    mount(ctx) {
      const EXP = [["mdi:home", "mdi"], ["tabler:heart", "tabler"], ["ph:paper-plane-tilt-duotone", "ph 雙色"], ["fluent-emoji-flat:hot-beverage", "彩色"], ["logos:google", "寬版"], ["flag:tw-4x3", "國旗"]];
      ctx.html(`<div class="ic-fill ic-exp">
        <div class="ic-card"><h3>同一份 SVG 的三種用法</h3><div class="ic-outs">
          <div class="ic-out"><div class="ic-o1"></div><small>行內 SVG</small></div>
          <div class="ic-out"><div><img class="ic-o2" alt="匯出的 SVG 圖片"></div><small>&lt;img src&gt;</small></div>
          <div class="ic-out"><div><div class="ic-bgbox"></div></div><small>background-image</small></div></div>
          <div class="ic-tools"><button class="btn" type="button" data-a="copy">複製 SVG</button><button class="btn" type="button" data-a="svg">下載 .svg</button><button class="btn" type="button" data-a="png">下載 PNG</button></div>
          <div class="ic-note">顏色選項把 body 裡的 currentColor 換成固定色碼，匯出檔離開網頁也保有顏色；彩色圖示沒有 currentColor，不受影響。</div></div>
        <div class="ic-card"><h3>輸出<code class="ic-stats"></code></h3><pre class="ic-pre ic-svg"></pre><pre class="ic-pre ic-url"></pre></div></div>`);
      const st = { name: EXP[0][0], size: 96, rot: 0, flip: false, color: "#4cc9f0" };
      const toast = toaster(ctx);
      let svg = "", seq = 0;
      async function update() {
        const my = ++seq;
        let data;
        try { data = await I.loadIcon(st.name); } catch {
          if (my === seq && ctx.active) ctx.$(".ic-svg").textContent = `無法載入 ${st.name}，這個場景需要外網連到 Iconify API。`;
          return;
        }
        if (my !== seq || !ctx.active) return;
        const res = I.buildIcon(data, { height: st.size, rotate: st.rot, hFlip: st.flip });
        svg = I.iconToHTML(res.body.replaceAll("currentColor", st.color), res.attributes);
        const url = I.svgToURL(svg);
        ctx.$(".ic-o1").innerHTML = svg;
        ctx.$(".ic-o2").src = url.slice(5, -2);
        ctx.$(".ic-bgbox").style.backgroundImage = url;
        ctx.$(".ic-stats").textContent = `${res.attributes.width}×${res.attributes.height}・viewBox ${res.attributes.viewBox}・${svg.length} 字元`;
        ctx.$(".ic-svg").textContent = svg;
        ctx.$(".ic-url").textContent = `svgToURL(svg)\n→ ${url.length > 260 ? url.slice(0, 260) + "…" : url}`;
      }
      async function png() {
        const img = new Image();
        img.src = ctx.$(".ic-o2").src;
        await img.decode();
        const k = 4, c = h("canvas", { width: img.naturalWidth * k, height: img.naturalHeight * k });
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        c.toBlob((b) => b && download(`${st.name.replace(":", "-")}@4x.png`, b));
      }
      ctx.$(".ic-tools").addEventListener("click", async (e) => {
        const a = e.target.closest("button")?.dataset.a;
        if (!svg || !a) return;
        if (a === "copy") toast((await copy(svg)) ? "已複製 SVG 原始碼" : "瀏覽器不允許自動複製");
        if (a === "svg") download(`${st.name.replace(":", "-")}.svg`, new Blob([svg], { type: "image/svg+xml" }));
        if (a === "png") png().catch((er) => toast(`PNG 轉換失敗：${er.message}`));
      });
      ctx.select("圖示", EXP.map(([v, l]) => ({ value: v, label: `${l}・${v.split(":")[1]}` })), st.name, (v) => { st.name = v; update(); });
      ctx.slider("高度", { min: 16, max: 160, step: 8, value: st.size, format: (v) => `${v}px` }, (v) => { st.size = v; update(); });
      ctx.group(["0°", "90°", "180°", "270°"], 0, (i) => { st.rot = i; update(); });
      ctx.toggle("hFlip", false, (v) => { st.flip = v; update(); });
      ctx.select("顏色", [{ value: "#4cc9f0", label: "藍" }, { value: "#f72585", label: "粉" }, { value: "#80ed99", label: "綠" }, { value: "currentColor", label: "保留 currentColor" }], st.color, (v) => { st.color = v; update(); });
      update();
    },
  },

  // 8. Stress: N <iconify-icon> from an offline collection until every status is "rendered".
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "addCollection(360 個) + N × <iconify-icon icon=\"bench:sK\" mode>",
    desc: "先用 addCollection 註冊 360 個程式產生的多色星形與多邊形（完全離線），再一次插入 N 個 <iconify-icon>，計時到每一個元件的 status 都變成 rendered；可切換 svg、bg、mask 三種渲染模式比較。",
    hint: "按「開始測試」；切換模式後再測一次",
    mount(ctx) {
      if (!I.iconLoaded("bench:s0")) {
        const icons = {};
        for (let i = 0; i < 360; i++) {
          const kind = i % 2 ? "poly" : "star", n = 3 + (i % 18), hue = (i * 37) % 360;
          icons[`s${i}`] = { body: `<path d="${shapePoints(kind, n, 0.38 + (i % 5) * 0.08)}" fill="hsl(${hue} 80% 60%)" stroke="currentColor" stroke-width="1"/>` };
        }
        I.addCollection({ prefix: "bench", width: 24, height: 24, icons });
      }
      ctx.html(`<div class="ic-stress"><div class="ic-sinfo mono">尚未測試</div><div class="ic-sgrid"></div></div>`);
      const grid = ctx.$(".ic-sgrid"), info = ctx.$(".ic-sinfo");
      const MODES = ["svg", "bg", "mask"];
      let mode = 0;
      ctx.controls.classList.add("bottom");
      ctx.group(["mode=svg", "mode=bg", "mode=mask"], 0, (i) => { mode = i; });
      ctx.bench({
        label: "元件數", unit: "個", sizes: [200, 1000, 5000, 10000, 20000, 40000],
        prepare() {
          grid.textContent = "";
          void grid.offsetHeight;
        },
        async run(n) {
          const m = MODES[mode];
          const t0 = performance.now();
          const frag = document.createDocumentFragment();
          for (let i = 0; i < n; i++) {
            const e = document.createElement("iconify-icon");
            e.setAttribute("icon", `bench:s${i % 360}`);
            e.setAttribute("mode", m);
            frag.append(e);
          }
          grid.append(frag);
          const t1 = performance.now();
          // Each element queues its own setTimeout check; poll until the last one has rendered.
          const els = grid.children, last = els[els.length - 1];
          while (last.status !== "rendered") {
            await new Promise((r) => setTimeout(r, 0));
            if (!ctx.active) return "";
          }
          let ok = 0;
          for (const e of els) if (e.status === "rendered") ok++;
          void grid.offsetHeight;
          const t2 = performance.now();
          info.textContent = `${fmtCompact(n)} 個（${m}）・建立 ${fmtMs(t1 - t0)}・渲染到 rendered ${fmtMs(t2 - t1)}・rendered ${fmtCompact(ok)}`;
          return `建立 ${fmtMs(t1 - t0)}・渲染 ${fmtMs(t2 - t1)}`;
        },
        note: "耗時含建立元件（每個都 attachShadow 並套用共用樣式表）、每個元件自己排程的 setTimeout 檢查、產生 <svg> 或 data URL，以及第一次排版。bg 與 mask 要把 SVG 編碼成 data URL 再交給 CSS 解碼，svg 模式則是建立真實的 SVG 節點。每個元件還會各自建立一個 IntersectionObserver。超過 2 秒的級距之後略過。",
      });
    },
  },
  ],
});
</script>
</body>
</html>
