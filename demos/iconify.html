<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconify 示範：跨圖示集即時搜尋</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"圖示即時從 Iconify API 下載"}</script>
<style>
  body { background: radial-gradient(80% 60% at 0% 0%, rgba(76,201,240,.12), transparent 60%), radial-gradient(70% 60% at 100% 100%, rgba(247,37,133,.10), transparent 60%), var(--bg); }
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 46px; }
  .topbar { display: flex; gap: 8px; align-items: center; }
  .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 14px; }
  .search .total { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  select.btn { height: 40px; }
  .quick { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .quick button { flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px 4px 6px; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--fg); font: 12px var(--font); cursor: pointer; }
  .quick button:hover { border-color: var(--accent); }
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 230px; grid-template-rows: minmax(0, 1fr); gap: 12px; }
  .grid { min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); grid-auto-rows: 76px; gap: 6px; align-content: start; scrollbar-width: thin; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 12px; border: 1px solid transparent; background: rgba(255,255,255,.035); color: var(--fg); cursor: pointer; transition: transform .12s, background .12s; min-width: 0; padding: 0 4px; }
  .tile:hover { background: rgba(255,255,255,.08); transform: translateY(-2px); }
  .tile.sel { border-color: var(--accent); }
  .tile small { font: 10px var(--mono); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg { grid-column: 1 / -1; padding: 24px; color: var(--muted); text-align: center; }
  .side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .big { height: 140px; display: grid; place-items: center; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); color: var(--c2); font-size: 96px; }
  .id { font: 600 13px var(--mono); word-break: break-all; }
  .meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .tools .btn { padding: 6px 9px; font-size: 12px; }
  pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0a0c0f; border: 1px solid var(--line); font: 11px/1.5 var(--mono); color: #b9c7d6; white-space: pre-wrap; word-break: break-all; }
  .toast { position: fixed; left: 50%; bottom: 52px; transform: translate(-50%, 80px); padding: 8px 14px; border-radius: 10px; background: var(--c2); color: #06202b; font-weight: 700; font-size: 13px; transition: transform .25s; z-index: 80; white-space: nowrap; }
  .toast.on { transform: translate(-50%, 0); }
  @media (max-width: 640px) {
    .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .side { flex-direction: row; align-items: center; }
    .big { width: 60px; height: 60px; flex: none; font-size: 44px; }
    .side .tools, .side pre, .side .meta { display: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); grid-auto-rows: 64px; }
    .search .total { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <label class="search"><iconify-icon icon="mdi:magnify" width="20" style="color:var(--muted)"></iconify-icon><input id="q" value="cat" placeholder="輸入英文關鍵字" autocomplete="off"><span class="total" id="total"></span></label>
    <select class="btn" id="set" aria-label="圖示集">
      <option value="">全部圖示集</option>
      <option value="fluent-emoji-flat,noto,twemoji,openmoji">彩色表情</option>
      <option value="logos,simple-icons,skill-icons">品牌標誌</option>
      <option value="tabler,lucide,ph,iconoir">線條圖示</option>
      <option value="mdi,material-symbols,ic">Material</option>
    </select>
  </div>
  <div class="quick" id="quick"></div>
  <div class="body">
    <div class="grid" id="grid"></div>
    <div class="side">
      <div class="big"><iconify-icon id="big" icon="noto:cat-face" width="1em" height="1em"></iconify-icon></div>
      <div>
        <div class="id" id="id">noto:cat-face</div>
        <div class="meta" id="meta">點任一圖示即複製名稱</div>
      </div>
      <div class="tools">
        <button class="btn" id="rot">旋轉 90°</button>
        <button class="btn" id="flip">水平翻轉</button>
      </div>
      <pre id="code"></pre>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="hint">搜尋英文關鍵字或點快捷詞・點圖示複製「圖示集:名稱」</div>

<script src="https://cdn.jsdelivr.net/npm/iconify-icon@3.0.3/dist/iconify-icon.min.js"></script>
<script>
// Iconify browser: search the Iconify API across 200+ icon sets and render results with the <iconify-icon> web component.
const QUICK = [["咖啡", "coffee", "noto:hot-beverage"], ["貓咪", "cat", "noto:cat-face"], ["火箭", "rocket", "noto:rocket"], ["台灣", "taiwan", "twemoji:flag-taiwan"],
  ["天氣", "weather", "noto:sun-behind-rain-cloud"], ["音樂", "music", "noto:musical-notes"], ["程式", "javascript", "logos:javascript"], ["禮物", "gift", "noto:wrapped-gift"]];
const $ = (id) => document.getElementById(id);
let collections = {}, selected = "noto:cat-face", rotate = 0, flipped = false, timer, seq = 0;

$("quick").innerHTML = QUICK.map(([label, q, icon]) => `<button data-q="${q}"><iconify-icon icon="${icon}" width="18" height="18"></iconify-icon>${label}</button>`).join("");

async function search() {
  const q = $("q").value.trim();
  const my = ++seq;
  if (!q) { $("grid").innerHTML = `<div class="msg">輸入關鍵字開始搜尋</div>`; $("total").textContent = ""; return; }
  $("grid").innerHTML = `<div class="msg">搜尋中…</div>`;
  const url = new URL("https://api.iconify.design/search");
  url.search = new URLSearchParams({ query: q, limit: 120, ...($("set").value && { prefixes: $("set").value }) });
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    if (my !== seq) return;
    collections = { ...collections, ...data.collections };
    $("total").textContent = `${data.icons.length} 個結果・${Object.keys(data.collections || {}).length} 個圖示集`;
    $("grid").innerHTML = data.icons.length
      ? data.icons.map((id) => `<button class="tile${id === selected ? " sel" : ""}" data-id="${id}" title="${id}"><iconify-icon icon="${id}" width="32" height="32"></iconify-icon><small>${id.split(":")[0]}</small></button>`).join("")
      : `<div class="msg">找不到「${q}」，試試 heart、star、train</div>`;
  } catch (err) {
    console.warn("Iconify search failed", err);
    if (my === seq) $("grid").innerHTML = `<div class="msg">無法連線到 Iconify API（${err.message}），請稍後再試</div>`;
  }
}

function show() {
  const big = $("big");
  big.setAttribute("icon", selected);
  big.setAttribute("rotate", `${rotate}deg`);
  flipped ? big.setAttribute("flip", "horizontal") : big.removeAttribute("flip");
  $("id").textContent = selected;
  const c = collections[selected.split(":")[0]];
  $("meta").textContent = c ? `${c.name}・${c.total.toLocaleString("zh-TW")} 個圖示・${c.license?.title || "授權見官網"}` : "點任一圖示即複製名稱";
  const extra = (rotate ? ` rotate="${rotate}deg"` : "") + (flipped ? ` flip="horizontal"` : "");
  $("code").textContent = `<iconify-icon icon="${selected}"${extra}></iconify-icon>`;
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {
    // Clipboard API is often blocked in iframes; fall back to a temporary textarea.
    const t = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(t); t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  }
}
let toastTimer;
function toast(text) {
  $("toast").textContent = text;
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("on"), 1600);
}

$("grid").addEventListener("click", async (e) => {
  const t = e.target.closest(".tile");
  if (!t) return;
  document.querySelector(".tile.sel")?.classList.remove("sel");
  t.classList.add("sel");
  selected = t.dataset.id;
  rotate = 0; flipped = false;
  show();
  toast((await copy(selected)) ? `已複製 ${selected}` : "瀏覽器不允許自動複製，請手動選取右側名稱");
});
$("quick").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  $("q").value = b.dataset.q;
  search();
});
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(search, 350); });
$("set").addEventListener("change", search);
$("rot").addEventListener("click", () => { rotate = (rotate + 90) % 360; show(); });
$("flip").addEventListener("click", () => { flipped = !flipped; show(); });

search();
show();
</script>
</body>
</html>
