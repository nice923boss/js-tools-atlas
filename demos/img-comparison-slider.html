<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>img-comparison-slider 示範：修圖前後對比</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/img-comparison-slider@8.0.7/dist/styles.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app { position: fixed; inset: 0; padding: 12px 12px 46px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bar .btn { padding: 7px 11px; font-size: 12px; }
  .bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
  .stage-c { min-height: 0; display: grid; place-items: center; }
  img-comparison-slider {
    display: block; width: var(--w); height: var(--h); border-radius: 10px;
    box-shadow: 0 14px 44px rgba(0,0,0,.55);
    --divider-width: 2px; --divider-color: #f7df1e;
    --default-handle-color: #f7df1e; --default-handle-width: 56px;
    --default-handle-shadow: 0 0 8px rgba(0,0,0,.6);
    outline: none;
  }
  img-comparison-slider figure { margin: 0; width: var(--w); height: var(--h); position: relative; }
  img-comparison-slider img { width: 100%; height: 100%; object-fit: cover; display: block; }
  figcaption {
    position: absolute; top: 12px; padding: 4px 10px; border-radius: 999px;
    font: 600 12px/1.4 var(--font); color: #fff; background: rgba(0,0,0,.55); backdrop-filter: blur(4px);
  }
  [slot="first"] figcaption { left: 12px; }
  [slot="second"] figcaption { right: 12px; background: rgba(247,223,30,.92); color: #1a1a14; }
  img-comparison-slider[direction="vertical"] [slot="second"] figcaption { top: auto; bottom: 12px; }
  .thumbs { display: flex; gap: 8px; justify-content: center; }
  .thumbs button {
    width: 64px; height: 42px; border-radius: 6px; padding: 0; cursor: pointer; overflow: hidden;
    border: 2px solid transparent; background: none; opacity: .65; transition: opacity .15s, border-color .15s;
  }
  .thumbs button[aria-pressed="true"] { border-color: var(--accent); opacity: 1; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 520px) { .thumbs button { width: 48px; height: 32px; } }
</style>
</head>
<body>
<div class="app">
  <div class="bar" id="fx">
    <button class="btn" data-f="grayscale(1) contrast(1.25) brightness(1.05)" aria-pressed="true">黑白膠片</button>
    <button class="btn" data-f="sepia(.55) saturate(1.5) hue-rotate(-12deg) contrast(1.05)">復古暖調</button>
    <button class="btn" data-f="brightness(.72) contrast(1.15) hue-rotate(185deg) saturate(1.4)">藍調夜景</button>
    <button class="btn" data-f="contrast(1.35) saturate(1.75) brightness(1.05)">鮮豔增強</button>
    <span class="sep"></span>
    <button class="btn" id="dir">切換為上下對比</button>
    <button class="btn" id="hover">滑鼠跟隨：關</button>
  </div>
  <div class="stage-c" id="stage">
    <img-comparison-slider id="cmp" tabindex="0">
      <figure slot="first"><img id="a" src="_shared/img/photo-3.jpg" alt="原圖"><figcaption>原圖</figcaption></figure>
      <figure slot="second"><img id="b" src="_shared/img/photo-3.jpg" alt="處理後"><figcaption id="cap">黑白膠片</figcaption></figure>
    </img-comparison-slider>
  </div>
  <div class="thumbs" id="thumbs"></div>
</div>
<div class="hint">拖曳中間把手比較前後差異・也可用方向鍵</div>

<script defer src="https://cdn.jsdelivr.net/npm/img-comparison-slider@8.0.7/dist/index.js"></script>
<script>
// img-comparison-slider: a web component that reveals slot="first" over slot="second" with a draggable divider.
const cmp = document.getElementById("cmp");
const imgA = document.getElementById("a"), imgB = document.getElementById("b");
const cap = document.getElementById("cap");
const PHOTOS = [3, 1, 5, 2, 7, 6];

function fit() {
  const r = document.getElementById("stage").getBoundingClientRect();
  const s = Math.min(r.width / 1200, r.height / 800);
  cmp.style.setProperty("--w", `${Math.floor(1200 * s)}px`);
  cmp.style.setProperty("--h", `${Math.floor(800 * s)}px`);
}

function setFilter(btn) {
  document.querySelectorAll("#fx [data-f]").forEach((b) => b.setAttribute("aria-pressed", b === btn));
  imgB.style.filter = btn.dataset.f;
  cap.textContent = btn.textContent;
}
document.querySelectorAll("#fx [data-f]").forEach((b) => b.addEventListener("click", () => setFilter(b)));
setFilter(document.querySelector("#fx [data-f]"));

const thumbs = document.getElementById("thumbs");
PHOTOS.forEach((n, i) => {
  const b = document.createElement("button");
  b.innerHTML = `<img src="_shared/img/photo-${n}.jpg" alt="">`;
  b.setAttribute("aria-pressed", i === 0);
  b.onclick = () => {
    [...thumbs.children].forEach((x) => x.setAttribute("aria-pressed", x === b));
    imgA.src = imgB.src = `_shared/img/photo-${n}.jpg`;
  };
  thumbs.append(b);
});

document.getElementById("dir").onclick = (e) => {
  const v = cmp.getAttribute("direction") === "vertical";
  if (v) cmp.removeAttribute("direction"); else cmp.setAttribute("direction", "vertical");
  e.target.textContent = v ? "切換為上下對比" : "切換為左右對比";
};
document.getElementById("hover").onclick = (e) => {
  const on = !cmp.hasAttribute("hover");
  cmp.toggleAttribute("hover", on);
  e.target.textContent = `滑鼠跟隨：${on ? "開" : "關"}`;
  e.target.setAttribute("aria-pressed", on);
};

// Animate the divider once on load so the effect is obvious, then hand control to the reader.
window.addEventListener("load", () => {
  fit();
  let t0 = null;
  const sweep = (ts) => {
    if (t0 === null) t0 = ts;
    const k = Math.min(1, (ts - t0) / 1600);
    cmp.value = 50 + Math.sin(k * Math.PI * 2) * 30;
    if (k < 1) requestAnimationFrame(sweep);
  };
  customElements.whenDefined("img-comparison-slider").then(() => requestAnimationFrame(sweep));
});
window.addEventListener("resize", fit);
fit();
</script>
</body>
</html>
