<script>
// impress.js owns the whole document it runs in (body classes, keyboard, hash, viewport meta),
// so every scene runs its deck inside an iframe srcdoc and removes the iframe on unmount.
const { h, fmtMs, fmtCompact } = Showcase;
const IMPRESS_SRC = "https://cdn.jsdelivr.net/npm/impress.js@1.1.0/js/impress.min.js";
const DEMO_CSS = new URL("_shared/demo.css", location.href).href;
const IMG = (n) => new URL(`_shared/img/photo-${n}.jpg`, location.href).href;
const FRAME_CSS = `html,body{background:transparent}
.impress-enabled{pointer-events:none}
.impress-enabled #impress,.impress-enabled #impress-toolbar{pointer-events:auto}
.clip{position:fixed;inset:0;overflow:hidden}
#impress{font-family:var(--font);color:var(--fg)}
.substep{opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s}
.substep.substep-visible{opacity:1;transform:none}`;
// impress assigns location.hash on every step, which would push a history entry per step.
// Replacing the fragment first makes that assignment a no-op. A srcdoc URL must be spelled out in full,
// since relative URLs resolve against the parent page.
const HASH_GUARD = `document.addEventListener("impress:stepenter",function(e){history.replaceState(null,"","about:srcdoc#/"+e.target.id)},true);`;

// Creates the iframe and resolves once impress.min.js has loaded inside it (init is left to the caller).
function impressFrame(ctx, host, { css = "", body = "", root = "", extra = "", label = "impress.js 簡報" }) {
  const f = h("iframe", { class: "im-frame", title: label });
  f.srcdoc = `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">` +
    `<link rel="stylesheet" href="${DEMO_CSS}"><style>${FRAME_CSS}${css}</style></head><body class="impress-not-supported">${extra}` +
    `<div class="clip"><div id="impress" ${root}>${body}</div></div><script src="${IMPRESS_SRC}"><\/script><script>${HASH_GUARD}<\/script></body></html>`;
  ctx.onCleanup(() => f.remove());
  return new Promise((resolve) => {
    f.addEventListener("load", () => resolve(ctx.active ? f : null), { once: true });
    host.append(f);
  });
}
// Run an action, then hand keyboard focus to the deck so arrow keys keep driving it.
const focusing = (f, fn) => (...args) => { fn(...args); f.contentWindow?.focus(); };
const portraitOf = (el) => el.clientWidth / Math.max(1, el.clientHeight) < 0.9;
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
function eventLog(list, max = 8) {
  const rows = [];
  return (name, text = "") => {
    rows.unshift(`<li><code>${name}</code>${esc(text)}</li>`);
    rows.length = Math.min(rows.length, max);
    list.innerHTML = rows.join("");
  };
}
const dataAttrs = (el) => el.getAttributeNames().filter((n) => n.startsWith("data-") && n !== "data-label")
  .map((n) => `${n}="${el.getAttribute(n)}"`).join("\n") || "（沒有 data-* 屬性）";

// ---------- signature map geometry (x = east, y = south) ----------
const COAST = [[1276,-3960],[1738,-3576],[2310,-3264],[2024,-2880],[2002,-2280],[1474,-792],[946,1320],[462,2160],[-110,3120],[-220,4200],[-484,4128],[-792,3072],[-1496,2472],[-1738,1560],[-1760,648],[-1144,-984],[-946,-1488],[-550,-2160],[-66,-2880],[330,-3360],[1012,-3672]];
const CITIES = [{ name: "台北", at: [1342, -3336] }, { name: "花蓮", at: [1474, -792], left: true }, { name: "台東", at: [462, 2160], left: true },
  { name: "墾丁", at: [-330, 4080] }, { name: "台南", at: [-1650, 1584] }, { name: "台中", at: [-594, -1200] }];
function smoothClosedPath(points) {
  const n = points.length, r = Math.round;
  let d = `M${points[0].map(r)}`;
  for (let i = 0; i < n; i++) {
    const [p0, p1, p2, p3] = [-1, 0, 1, 2].map((k) => points[(i + k + n) % n]);
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6].map(r);
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6].map(r);
    d += ` C${c1} ${c2} ${p2.map(r)}`;
  }
  return `${d} Z`;
}

Showcase.run({ scenes: [
  {
    id: "signature", title: "招牌簡報",
    api: "impress().init()・data-x / data-rotate / data-scale / data-z",
    desc: "環島 9 天：整張台灣地圖就是畫布，每站是一個 step，鏡頭靠平移、旋轉、縮放與 3D 翻轉在站點之間飛行。",
    hint: "點畫面後用 ← → 或空白鍵前進，點卡片可直接跳站",
    async mount(ctx) {
      ctx.html(`<div class="im-host"></div>`);
      const host = ctx.$(".im-host");
      const portrait = portraitOf(host);
      const f = await impressFrame(ctx, host, {
        css: document.getElementById("im-sig-css").innerHTML,
        body: document.getElementById("im-sig-body").innerHTML,
        extra: `<div class="fallback">這個瀏覽器不支援 CSS 3D 轉換，無法播放 impress.js 簡報。</div>`,
        root: `data-max-scale="2" data-transition-duration="1100" data-perspective="1200" data-width="${portrait ? 680 : 1000}" data-height="${portrait ? 1000 : 720}"`,
        label: "環島 9 天地圖簡報",
      });
      if (!f) return;
      const doc = f.contentDocument, win = f.contentWindow;
      doc.getElementById("coast").setAttribute("d", smoothClosedPath(COAST));
      doc.getElementById("route").setAttribute("d", smoothClosedPath(CITIES.map((c) => c.at)));
      const [px, py] = [22, 432];
      doc.getElementById("pins").innerHTML = CITIES.map(({ name, at: [x, y], left }) =>
        `<circle class="dot" cx="${x}" cy="${y}" r="46"/><text class="label" x="${left ? x - 80 : x + 80}" y="${y + 52}" text-anchor="${left ? "end" : "start"}">${name}</text>`).join("") +
        `<path class="mountain" d="M${px - 150},${py + 110} L${px},${py - 150} L${px + 150},${py + 110} Z"/><text class="label" x="${px + 180}" y="${py + 90}">玉山</text>`;
      const count = h("span", { class: "im-count", text: "1 / 10・開場" });
      const steps = [...doc.querySelectorAll(".step")];
      ctx.on(doc, "impress:stepenter", (e) => { count.textContent = `${steps.indexOf(e.target) + 1} / ${steps.length}・${e.target.dataset.label}`; });
      const api = win.impress();
      api.init();
      ctx.controls.append(count);
      ctx.button("上一站", focusing(f, () => api.prev()));
      ctx.button("總覽", focusing(f, () => api.goto("overview")));
      ctx.button("下一站", focusing(f, () => api.next()), { primary: true });
    },
  },
  {
    id: "cube", title: "3D 立方體",
    api: 'data-z="400" data-rotate-y="90" data-rotate-x="90"',
    desc: "六個 step 拼成一顆立方體：每一面都是一般的 HTML，靠 data-z 與 data-rotate-x / y 擺進 3D 空間，鏡頭繞著它飛。",
    hint: "點上方的面切換視角；左上角即時顯示 impress 套在畫布上的 transform",
    async mount(ctx) {
      ctx.html(`<div class="im-host"><div class="im-overlay"><b>畫布 transform</b><br><code class="im-cam">…</code></div></div>`);
      const host = ctx.$(".im-host");
      const S = 400;
      const FACES = [
        ["front", "前", "正面", `data-z="${S}"`, "#4cc9f0"],
        ["right", "右", "右側", `data-x="${S}" data-rotate-y="90"`, "#f72585"],
        ["back", "後", "背面", `data-z="-${S}" data-rotate-y="180"`, "#7bd389"],
        ["left", "左", "左側", `data-x="-${S}" data-rotate-y="-90"`, "#ff8c42"],
        ["top", "上", "頂面", `data-y="-${S}" data-rotate-x="90"`, "#f7df1e"],
        ["bottom", "下", "底面", `data-y="${S}" data-rotate-x="-90"`, "#9d8cff"],
      ];
      const body = `<div id="iso" class="step im-iso" data-rotate-x="-28" data-rotate-y="38" data-scale="2.2"></div>` + FACES.map(([id, , name, attrs, color], i) =>
        `<div id="${id}" class="step im-face" ${attrs} style="--c:${color}"><span class="im-n">${i + 1}</span><h2>${name}</h2><code>${attrs.replace(/"/g, "&quot;")}</code></div>`).join("");
      const css = `.step{opacity:1}.im-iso{width:10px;height:10px}
        .im-face{width:${S * 2}px;height:${S * 2}px;padding:60px;border:6px solid var(--c);border-radius:24px;background:color-mix(in srgb,var(--c) 28%,#0b0e14);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;backface-visibility:visible}
        .im-face h2{margin:0;font-size:110px;font-weight:900;color:#fff}
        .im-face code{font:700 40px var(--mono);color:var(--c);background:rgba(0,0,0,.45);padding:10px 22px;border-radius:14px}
        .im-n{font:900 200px/1 var(--mono);color:var(--c);opacity:.5}`;
      const f = await impressFrame(ctx, host, { css, body, root: 'data-perspective="1000" data-transition-duration="1200" data-width="1000" data-height="1000"', label: "3D 立方體" });
      if (!f) return;
      const doc = f.contentDocument, win = f.contentWindow;
      const cam = ctx.$(".im-cam");
      let duration = 1200;
      const ids = ["iso", ...FACES.map((x) => x[0])];
      const api = win.impress();

      const css = `.step{opacity:.35;transition:opacity .6s}.step.active,.impress-on-all .step{opacity:1}.im-all{width:10px;height:10px}

  {
    id: "autoplay", title: "自動播放與工具列",
    api: 'data-autoplay="3"・#impress-toolbar・.impress-progressbar',
    desc: "內建外掛一次用上：data-autoplay 自動換頁（單頁可覆寫秒數）、工具列的上一頁、跳頁選單、暫停鈕，以及底部進度條。",
    hint: "左上角是 impress 內建工具列；上方切換每張停留秒數，右上顯示倒數",
    async mount(ctx) {
      ctx.html(`<div class="im-host"><div class="im-overlay" style="left:auto;right:10px;top:40px"><b>下一張倒數</b> <code class="im-cd">…</code></div></div>`);
      const host = ctx.$(".im-host");
      const R = 1700, N = 8;
      let body = "";
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2;
        const special = i === 3;
        body += `<div id="照片${i + 1}" class="step im-p" data-x="${Math.round(Math.sin(a) * R)}" data-y="${Math.round(-Math.cos(a) * R)}" data-rotate="${i * 45}" ${special ? 'data-autoplay="6"' : ""}>

      }
      body += `<div id="總覽" class="step im-o" data-x="0" data-y="0" data-scale="5.2"></div>`;

        .im-p img{display:block;width:100%;height:520px;object-fit:cover;border-radius:16px}
        .im-p p{margin:16px 6px 4px;font-size:34px;font-weight:700}
        #impress-toolbar{position:fixed;left:12px;top:10px;display:flex;gap:6px;z-index:5}

        .impress-progressbar{position:fixed;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.08)}
        .impress-progressbar div{height:100%;width:0;background:var(--accent);transition:width .8s}

  },
  {
    id: "api", title: "API 與事件",
    api: "impress().goto(id, ms)・next()・prev()・tear()・init()",
    desc: "從外部程式控制簡報：指定轉場毫秒跳頁，或用 tear() 把頁面拆回一般 HTML 再 init() 重建；右側即時顯示事件與目前 step 的屬性。",
    hint: "按「tear() 拆除」看原始排版，再按「init() 重建」回到 3D 畫布",
    async mount(ctx) {
      ctx.html(`<div class="im-split"><div class="im-host"></div><aside class="im-side">
        <h4>目前 step 的屬性</h4><pre class="im-attrs">…</pre><h4>事件紀錄</h4><ol class="im-log"></ol></aside></div>`);
      const host = ctx.$(".im-host");
      const DEF = [
        ["s1", "起點", 'data-x="0" data-y="0"'],
        ["s2", "往右平移", 'data-x="1200" data-y="0"'],
        ["s3", "旋轉 90°", 'data-x="1200" data-y="900" data-rotate="90"'],
        ["s4", "放大 3 倍", 'data-x="0" data-y="900" data-scale="3"'],
        ["s5", "立起來", 'data-x="-600" data-y="0" data-z="600" data-rotate-y="-60"'],
      ];
      const body = DEF.map(([id, t, a], i) => `<div id="${id}" class="step im-a" ${a}><span>${i + 1}</span><h2>${t}</h2><code>${a.replace(/"/g, "&quot;")}</code></div>`).join("");
      const css = `.step{opacity:.4;transition:opacity .6s}.step.active{opacity:1}
        .im-a{width:800px;padding:40px 50px;border-radius:26px;border:4px solid var(--c2);background:#161a21;margin:20px}
        .im-a span{font:900 70px/1 var(--mono);color:var(--c2)}.im-a h2{margin:10px 0;font-size:64px;color:#fff}
        .im-a code{font:600 28px var(--mono);color:var(--accent)}
        body:not(.impress-enabled) .clip{overflow:auto;padding:10px}
        body:not(.impress-enabled) .im-a{opacity:1;zoom:.4;display:inline-block;vertical-align:top}`;
      const f = await impressFrame(ctx, host, { css, body, root: 'data-transition-duration="1000" data-width="1100" data-height="800"', label: "API 示範" });

      const log = eventLog(ctx.$(".im-log")), attrs = ctx.$(".im-attrs");
      let api = null, ms = 1000;
      ctx.on(doc, "impress:init", () => log("impress:init", `${doc.querySelectorAll(".step").length} 個 step`));
      ctx.on(doc, "impress:stepleave", (e) => log("stepleave", `${e.target.id} → ${e.detail.next.id}`));
      ctx.on(doc, "impress:stepenter", (e) => { log("stepenter", e.target.id); attrs.textContent = `id="${e.target.id}"\n${dataAttrs(e.target)}`; });
      const start = () => { api = win.impress(); api.init(); tearBtn.disabled = false; initBtn.disabled = true; };
      const live = (fn) => focusing(f, () => api && fn(api));
      ctx.button("◀", live((a) => a.prev()), { title: "prev()" });
      ctx.button("▶", live((a) => a.next()), { title: "next()", primary: true });
      ctx.select("跳到", DEF.map(([id, t]) => ({ value: id, label: `${id}・${t}` })), "s1", live((a) => a.goto(ctx.$("select").value, ms)));
      ctx.slider("毫秒", { min: 0, max: 3000, step: 100, value: ms, format: (v) => `${v}` }, (v) => { ms = v; });
      const tearBtn = ctx.button("tear() 拆除", () => {
        api.tear(); api = null; tearBtn.disabled = true; initBtn.disabled = false;
        log("tear()", "DOM 回到原始 HTML"); attrs.textContent = "已拆除：step 回到一般排版";
      });
      const initBtn = ctx.button("init() 重建", focusing(f, start));
      start();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "impress().tear()・init()・next()",
    desc: "把 N 個 step 排成往畫面深處延伸的 3D 螺旋，每一級拆掉重建一次，量 init() 耗時，同時每 0.8 秒自動 next() 量飛行時的 FPS。",
    hint: "按「自動加壓」逐級增加 step 數量",
    async mount(ctx) {
      ctx.html(`<div class="im-host im-stress"></div>`);
      const host = ctx.$(".im-stress");
      const css = `.step{opacity:.45}.step.active{opacity:1}
        .im-s{width:420px;height:260px;border-radius:22px;display:grid;place-items:center;background:hsl(var(--h) 65% 30%);border:4px solid hsl(var(--h) 80% 65%)}
        .im-s b{font:900 110px/1 var(--mono);color:#fff}.im-s span{font:600 30px var(--mono);color:rgba(255,255,255,.75)}`;
      const f = await impressFrame(ctx, host, { css, root: 'data-transition-duration="650" data-perspective="1000" data-width="1000" data-height="760"', label: "壓力測試" });
      if (!f) return;
      const doc = f.contentDocument, win = f.contentWindow, root = doc.getElementById("impress");
      const m = { init: 0, nav: 0, nodes: 0 };
      let api = null;
      const build = (n) => {
        let s = "";
        for (let i = 0; i < n; i++) {
          const a = i * 0.45;
          s += `<div class="step im-s" data-x="${Math.round(Math.cos(a) * 900)}" data-y="${Math.round(Math.sin(a) * 900)}" data-z="${-i * 140}" data-rotate="${Math.round((a * 180) / Math.PI + 90)}" style="--h:${(i * 23) % 360}"><div><b>${i + 1}</b><span> / ${n}</span></div></div>`;
        }
        return s;
      };
      ctx.interval(() => {
        if (!api) return;
        const t = performance.now();
        api.next();
        m.nav = performance.now() - t;
      }, 800);
      ctx.ramp({
        label: "step", unit: "個",
        steps: [20, 100, 300, 600, 1200, 2500, 5000],
        apply(n) {
          if (api) api.tear();
          api = null;
          root.innerHTML = build(n);
          const t = performance.now();
          const next = win.impress();
          next.init();
          m.init = performance.now() - t;
          m.nodes = doc.getElementsByTagName("*").length;
          api = next;
        },
        metrics: () => ({ "init()": fmtMs(m.init), "next() 呼叫": fmtMs(m.nav), "DOM 節點": fmtCompact(m.nodes) }),
        note: "每一級先 tear() 拆掉上一份簡報，再產生 N 個帶 3D 位置的 step 並 init()，接著每 0.8 秒呼叫 next() 讓鏡頭沿螺旋飛行。impress 會為每個 step 計算並寫入 transform，所以 init() 隨數量線性成長；飛行時所有 step 都在同一個 3D 圖層裡，FPS 受合成器負擔影響。",
      });
    },
  },
] });
</script>
