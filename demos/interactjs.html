<script>
// interact.js showcase: eight scenes from a sticky-note wall to an interactable-count stress ramp.
const { h } = Showcase;
const M = interact.modifiers;
const ARROW = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 2l6.5 19 2.6-7.6L20 11z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const r0 = (v) => Math.round(v);

// Interactable that is unset (and its running interactions stopped) when the scene unmounts.
function ix(ctx, target, opts) {
  const i = interact(target, opts);
  ctx.onCleanup(() => { interact.stop(); i.unset(); });
  return i;
}
// Translate helper: position lives in data-x / data-y.
function moveBy(el, dx, dy) { setXY(el, (+el.dataset.x || 0) + dx, (+el.dataset.y || 0) + dy); }
function setXY(el, x, y, extra = el.dataset.t || "") {
  el.dataset.x = x; el.dataset.y = y;
  el.style.transform = `translate(${x}px, ${y}px) ${extra}`;

const at = (el, fx = 0.5, fy = 0.5) => () => { const r = el.getBoundingClientRect(); return [r.left + r.width * fx, r.top + r.height * fy]; };
const off = (el, dx, dy, fx = 0.5, fy = 0.5) => () => { const [x, y] = at(el, fx, fy)(); return [x + dx, y + dy]; };

// pointer registered after release, and a second mouse id would turn later real drags into two-pointer ones.
let mouseId = 1;
for (const t of ["pointerdown", "pointermove"]) document.addEventListener(t, (e) => { if (e.isTrusted && e.pointerType === "mouse") mouseId = e.pointerId; }, true);

  const target = document.elementFromPoint(x, y) || document.body;
  target.dispatchEvent(new PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true, pointerId: id, pointerType, isPrimary: pointerType === "mouse" || id % 2 === 1,

// Fake cursor overlay so screenshots show what the automatic demo is doing.
function cursor(ctx) {

  if (!cur) { cur = h("div", { class: "ix-cur" }); cur.innerHTML = ARROW; ctx.el.append(cur); }
  const host = ctx.el.getBoundingClientRect();

    place(x, y) { cur.style.transform = `translate(${x - host.left}px, ${y - host.top}px)`; cur.classList.add("on"); },

// any document listener of interact.js, so the robot's pointer is released first and the two
// never share one mouse interaction.
const USER = new Error("user took over");
const robot = { down: false, x: 0, y: 0 };
let userAt = 0;
window.addEventListener("pointerdown", (e) => {
  if (!e.isTrusted) return;
  userAt = performance.now();
  if (robot.down) { robot.down = false; firePointer("pointerup", robot.x, robot.y); }
}, true);
// Robot and real mouse share one pointerId, so a real hover move during a robot drag would be read as

window.addEventListener("pointermove", (e) => { if (e.isTrusted && robot.down && e.pointerType === "mouse" && !e.buttons) e.stopImmediatePropagation(); }, true);

// Automatic demo: synthetic pointer events go through interact.js's real document listeners,
// so actions, modifiers, inertia and dropzones are exercised for real. `to` may be a list of waypoints.
async function simDrag(ctx, from, to, { ms = 650, hold = 140, linear = false } = {}) {
  if (!ctx.active) return;
  const c = cursor(ctx);
  const since = ctx.ixSince ?? performance.now();
  const [x0, y0] = pt(from);
  c.place(x0, y0);
  await ctx.sleep(200);
  if (userAt > since) throw USER;
  c.down(true);
  robotFire("pointerdown", x0, y0);
  let x = x0, y = y0;

  for (const leg of legs) {
    const [sx, sy] = [x, y];
    const hb = ctx.el.getBoundingClientRect();

      const k = Math.min(1, (performance.now() - t0) / (ms / legs.length));

      c.place(x, y);
      if (userAt > since) { c.down(false); throw USER; }
      robotFire("pointermove", x, y);
      if (k >= 1) break;
      await ctx.sleep(16);

  c.down(false);
  await ctx.sleep(300);

  await ctx.sleep(160);
