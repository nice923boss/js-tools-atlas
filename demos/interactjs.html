<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>interact.js 示範：可拖曳縮放的便利貼牆</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body {
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 0) 0 0 / 22px 22px,
      radial-gradient(80% 60% at 20% 0%, rgba(157,140,255,.10), transparent 70%),
      var(--bg);
  }
  #board { position: fixed; inset: 0; touch-action: none; }
  .note {
    position: absolute; left: 0; top: 0; width: 170px; height: 150px;
    padding: 14px 14px 12px; border-radius: 4px 4px 14px 4px;
    color: #2a2618; background: var(--n); cursor: grab; user-select: none; touch-action: none;
    box-shadow: 0 10px 22px rgba(0,0,0,.35), inset 0 -18px 30px rgba(0,0,0,.05);
    display: flex; flex-direction: column; gap: 6px; box-sizing: border-box;
    transition: box-shadow .2s, outline-color .2s; outline: 2px solid transparent; outline-offset: 3px;
  }
  .note::before { /* tape */
    content: ""; position: absolute; top: -9px; left: 50%; width: 54px; height: 18px; transform: translateX(-50%) rotate(-3deg);
    background: rgba(255,255,255,.35); border-radius: 2px; backdrop-filter: blur(2px);
  }
  .note h3 { margin: 0; font-size: 15px; line-height: 1.3; }
  .note p { margin: 0; font-size: 12px; line-height: 1.5; opacity: .8; overflow: hidden; }
  .note .size { margin-top: auto; font: 600 10px/1 var(--mono); opacity: .45; }
  .note .grip { position: absolute; right: 4px; bottom: 4px; width: 14px; height: 14px; opacity: .35;
    background: linear-gradient(135deg, transparent 50%, #2a2618 50%, #2a2618 60%, transparent 60%, transparent 72%, #2a2618 72%, #2a2618 82%, transparent 82%); }
  .note.dragging { cursor: grabbing; box-shadow: 0 22px 40px rgba(0,0,0,.5); z-index: 30; }
  .note.over-trash { opacity: .55; outline-color: #e5484d; }
  #trash {
    position: fixed; right: 16px; bottom: 16px; width: 120px; height: 82px; z-index: 5;
    border: 2px dashed rgba(229,72,77,.45); border-radius: 14px; color: #ff8a8d;
    display: grid; place-items: center; text-align: center; font-size: 12px; line-height: 1.4;
    background: rgba(229,72,77,.06); transition: transform .2s, background .2s, border-color .2s;
  }
  #trash b { display: block; font-size: 22px; }
  #trash.active { border-color: rgba(229,72,77,.8); }
  #trash.hot { transform: scale(1.08); background: rgba(229,72,77,.2); border-style: solid; }
  @media (max-width: 520px) { #trash { bottom: 50px; width: 90px; height: 64px; font-size: 11px; } #trash b { font-size: 18px; } }
</style>
</head>
<body>
<div id="board"></div>
<div id="trash"><div><b>🗑</b>拖到這裡刪除</div></div>
<div class="controls">
  <button class="btn primary" id="add">＋ 新便利貼</button>
  <button class="btn" id="tidy">整齊排列</button>
</div>
<div class="hint">拖曳移動（有慣性）・拉右下角縮放・丟進垃圾桶刪除</div>

<script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.28/dist/interact.min.js"></script>
<script>
// Sticky-note wall: interact.js draggable (inertia + bounds), resizable (min/max) and a dropzone.
const COLORS = ["#fde68a", "#a7f3d0", "#fbcfe8", "#bae6fd", "#ddd6fe", "#fed7aa"];
const NOTES = [
  ["週一 10:00", "與講師確認新竹場的課程大綱"],
  ["買文具", "白板筆、便利貼、延長線"],
  ["靈感", "把作業改成小組闖關形式"],
  ["待回覆", "台南學員詢問發票抬頭"],
  ["本週目標", "完成三支教學短片剪輯"],
  ["電話", "回撥花蓮場合作窗口"],
];
const board = document.getElementById("board");
let made = 0;

function setPos(el, x, y, rot) {
  el.dataset.x = x;
  el.dataset.y = y;
  if (rot !== undefined) el.dataset.r = rot;
  el.style.transform = `translate(${x}px, ${y}px) rotate(${el.dataset.r || 0}deg)`;
}
function updateSize(el) {
  el.querySelector(".size").textContent = `${Math.round(el.offsetWidth)} × ${Math.round(el.offsetHeight)}`;
}

function addNote([title, body], x, y) {
  const el = document.createElement("div");
  el.className = "note";
  el.style.setProperty("--n", COLORS[made % COLORS.length]);
  el.innerHTML = `<h3></h3><p></p><span class="size"></span><span class="grip"></span>`;
  el.querySelector("h3").textContent = title;
  el.querySelector("p").textContent = body;
  board.append(el);
  const small = innerWidth < 520;
  el.style.width = `${(small ? 122 : 165) + (made * 17) % (small ? 20 : 45)}px`;
  el.style.height = `${(small ? 112 : 140) + (made * 23) % (small ? 16 : 40)}px`;
  setPos(el, x, y, (Math.random() * 8 - 4).toFixed(1));
  updateSize(el);
  made++;
  return el;
}

function layout() {
  // Spread notes over the board: one cell per note, note centered in its cell with a little jitter.
  const notes = [...board.children];
  const top = 58, bottom = innerWidth < 520 ? 120 : 92;
  const W = innerWidth - 20, H = innerHeight - top - bottom;
  const cols = Math.max(1, Math.round(Math.sqrt(notes.length * W / H)));
  const rows = Math.ceil(notes.length / cols);
  const cw = W / cols, ch = H / rows;
  notes.forEach((el, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const x = 10 + col * cw + (cw - el.offsetWidth) / 2 + (i % 3 - 1) * 10;
    const y = top + row * ch + (ch - el.offsetHeight) / 2 + ((i * 7) % 3 - 1) * 8;
    setPos(el, Math.max(6, x), Math.max(top, y));
  });
}

NOTES.forEach((n) => addNote(n, 0, 0));
layout();

interact(".note")
  .draggable({
    inertia: true,
    modifiers: [interact.modifiers.restrictRect({ restriction: "parent", endOnly: true })],
    listeners: {
      start(e) { e.target.classList.add("dragging"); board.append(e.target); },
      move(e) {
        const el = e.target;
        setPos(el, (parseFloat(el.dataset.x) || 0) + e.dx, (parseFloat(el.dataset.y) || 0) + e.dy);
      },
      end(e) { e.target.classList.remove("dragging"); },
    },
  })
  .resizable({
    edges: { right: true, bottom: true },
    modifiers: [interact.modifiers.restrictSize({ min: { width: 110, height: 90 }, max: { width: 340, height: 300 } })],
    listeners: {
      move(e) {
        const el = e.target;
        el.style.width = e.rect.width + "px";
        el.style.height = e.rect.height + "px";
        updateSize(el);
      },
    },
  });

interact("#trash").dropzone({
  accept: ".note",
  overlap: 0.35,
  ondropactivate: (e) => e.target.classList.add("active"),
  ondropdeactivate: (e) => e.target.classList.remove("active", "hot"),
  ondragenter: (e) => { e.target.classList.add("hot"); e.relatedTarget.classList.add("over-trash"); },
  ondragleave: (e) => { e.target.classList.remove("hot"); e.relatedTarget.classList.remove("over-trash"); },
  ondrop: (e) => {
    const el = e.relatedTarget;
    el.animate([{ opacity: 1, scale: 1 }, { opacity: 0, scale: .3 }], { duration: 220, easing: "ease-in" }).onfinish = () => el.remove();
  },
});

const IDEAS = [["新想法", "結業式加一段學員作品展"], ["提醒", "下午三點交月報"], ["問卷", "整理課後滿意度"]];
document.getElementById("add").addEventListener("click", () => {
  const el = addNote(IDEAS[made % IDEAS.length], innerWidth / 2 - 85 + Math.random() * 60 - 30, innerHeight / 2 - 75 + Math.random() * 40 - 20);
  el.animate([{ scale: .6, opacity: 0 }, { scale: 1, opacity: 1 }], { duration: 260, easing: "cubic-bezier(.2,1.4,.4,1)" });
});
document.getElementById("tidy").addEventListener("click", layout);
addEventListener("resize", layout);
</script>
</body>
</html>
