  // 7. Contact callbacks drive static conveyor belts and a bounce pad; a ray fan queries the narrow phase every frame.

        labs.belt.sub.textContent = `表面速度 ${speed.toFixed(1)} m/s`;
        labs.sensor.sub.textContent = scan ? `命中 ${hits}／${NR}` : "關閉";
        labs.pad.sub.textContent = `e ${bounce.toFixed(2)}・彈起 ${vShow.toFixed(1)} m/s`;
        labs.bin.sub.textContent = `${inBin} 件`;
      }, 250);
      autoFit(S, 6.6, 2.4);
      hud(ctx, () => `物件 <b>${items.length}</b>／${MAX}・接觸回呼 <b>${cps}</b>／秒・射線命中 <b>${hits}</b>／${NR}・查詢 <b>${qms.toFixed(3)}</b> ms・物理 <b>${P.ms.toFixed(1)}</b> ms`);
    },
  },

  // 8. Stress: rigid body count ramp in a stirred glass box.
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "PhysicsSystem.Update（單執行緒）・GetNumActiveBodies・InstancedMesh 直讀 WASM 堆積",
    desc: "方塊與球逐級加量倒進攪拌箱，量測 Jolt 每步耗時、同步到 InstancedMesh 的時間、活動剛體數與 WASM 堆積用量，畫面掉到 30 FPS 以下就停止加壓。",
    hint: "按「自動加壓」逐級增加剛體數",
    async mount(ctx) {
      ctx.html('<div class="jp-view"></div>');
      const host = ctx.$(".jp-view");
      ctx.controls.classList.add("bottom");
      await boot(ctx);
      const S = stage(ctx, { host, shadows: false, fov: 50, bg: 0x07080b, pos: [0, 13, 18], target: [0, 1, 0],
        orbit: { autoRotate: true, autoRotateSpeed: 0.4, maxPolarAngle: Math.PI * 0.47, minDistance: 8, maxDistance: 60 } });
      env(S, 0.5);
      sunLight(S, { intensity: 1.8, pos: [6, 14, 8], shadow: false, hemi: [0xe8f0ff, 0x15171d, 0.9] });
      const P = physics(ctx, { maxContacts: 20000 });
      const fl = new THREE.Mesh(S.own(new THREE.PlaneGeometry(15, 15).rotateX(-Math.PI / 2)), S.own(std(0x141821, { roughness: 0.95 }))); S.scene.add(fl);
      P.body(new J.BoxShape(P.V(7.5, 0.5, 7.5), 0.05, null), [0, -0.5, 0], { motion: "static" });
      const glass = S.own(new THREE.MeshStandardMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.08, depthWrite: false }));
      const wx = P.keep(new J.BoxShape(P.V(7.5, 3, 0.25), 0.05, null)), wz = P.keep(new J.BoxShape(P.V(0.25, 3, 7.5), 0.05, null));
      const gx = S.own(new THREE.BoxGeometry(15, 6, 0.5)), gz = S.own(new THREE.BoxGeometry(0.5, 6, 15));
      for (const s of [-1, 1]) {
        const mx = new THREE.Mesh(gx, glass), mz = new THREE.Mesh(gz, glass); S.scene.add(mx, mz);
        P.body(wx, [0, 3, s * 7.25], { motion: "static", mesh: mx });
        P.body(wz, [s * 7.25, 3, 0], { motion: "static", mesh: mz });
      }
      const edges = new THREE.LineSegments(S.own(new THREE.EdgesGeometry(new THREE.BoxGeometry(15, 6, 15))), S.own(new THREE.LineBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.4 })));
      edges.position.y = 3; S.scene.add(edges);
      const padM = new THREE.Mesh(S.own(new THREE.BoxGeometry(13.6, 0.6, 0.3)), S.own(std(0xff8c42, { roughness: 0.4 }))); S.scene.add(padM);
      const paddle = P.body(new J.BoxShape(P.V(6.8, 0.3, 0.15), 0.05, null), [0, 0.45, 0], { motion: "kinematic", sleep: false, mesh: padM });
      let stir = true, ang = 0, syncMs = 0;
      P.onStep((dt) => {
        if (stir) ang += 0.6 * dt;
        P.bi.MoveKinematic(paddle.b.GetID(), P.R(0, 0.45, 0), P.Q(...qy(ang)), dt);
      });

      const CAP = 2500;
      const boxShape = P.keep(new J.BoxShape(P.V(0.22, 0.22, 0.22), 0.05, null)), sphShape = P.keep(new J.SphereShape(0.25, null));
      const boxInst = new THREE.InstancedMesh(S.own(new RoundedBoxGeometry(0.44, 0.44, 0.44, 2, 0.05)), S.own(std(0xffffff, { roughness: 0.45 })), CAP);
      const sphInst = new THREE.InstancedMesh(S.own(new THREE.SphereGeometry(0.25, 12, 8)), S.own(std(0xffffff, { roughness: 0.35 })), CAP);
      const colr = new THREE.Color();
      for (let i = 0; i < CAP; i++) { boxInst.setColorAt(i, colr.setHex(PALETTE[i % 6])); sphInst.setColorAt(i, colr.setHex(PALETTE[(i + 3) % 6])); }
      for (const m of [boxInst, sphInst]) { m.frustumCulled = false; m.count = 0; S.scene.add(m); }
      ctx.onCleanup(() => { boxInst.dispose(); sphInst.dispose(); });
      const all = [], boxes = [], sphs = [];
      const spawnPos = (k) => { const g = k % 196; return [((g % 14) - 6.5) * 0.9 + (Math.random() - 0.5) * 0.2, 7 + Math.floor(k / 196) * 0.8, (Math.floor(g / 14) - 6.5) * 0.9 + (Math.random() - 0.5) * 0.2]; };
      function apply(n) {
        while (all.length < n) {
          const k = all.length, isBox = k % 2 === 0;
          const r = P.body(isBox ? boxShape : sphShape, spawnPos(k), { restitution: 0.1 });
          r.isBox = isBox; all.push(r); (isBox ? boxes : sphs).push(r);
        }
        while (all.length > n) { const r = all.pop(); (r.isBox ? boxes : sphs).pop(); P.remove(r); }
      }
      ctx.toggle("攪拌槳", true, (v) => { stir = v; });
      ctx.button("重新灑落", () => { all.forEach((r, k) => P.place(r, spawnPos(k), undefined, true)); });
      S.onFrame((dt) => {
        P.step(dt);
        P.sync(paddle);
        const t0 = performance.now();
        for (const [list, inst] of [[boxes, boxInst], [sphs, sphInst]]) {
          const e = inst.instanceMatrix.array;
          for (let i = 0; i < list.length; i++) bodyMatrix(list[i], e, i * 16);
          inst.count = list.length; inst.instanceMatrix.needsUpdate = true;
        }
        syncMs = ema(syncMs, performance.now() - t0);
      });
      autoFit(S, 8, 4, 1.05);
      ctx.ramp({
        label: "剛體", unit: "個",
        steps: [100, 250, 500, 1000, 2000, 3000, 4000, 5000],
        minFps: 30,
        apply,
        metrics: () => ({
          物理步進: `${P.ms.toFixed(1)} ms`,
          同步繪圖: `${syncMs.toFixed(2)} ms`,
          活動剛體: P.ps.GetNumActiveBodies(J.EBodyType_RigidBody),
          "WASM 堆積": heapText(),
        }),
        note: "JoltPhysics.js 在單執行緒的 WebAssembly 裡跑完整 Jolt 管線：四元樹寬相、窄相碰撞與接觸約束求解器。剛體越密，接觸約束越多，求解器負擔隨之上升；關閉攪拌槳後靜止的剛體會進入休眠、幾乎不耗時。WASM 堆積大小固定，滿了就無法再加剛體；畫面用 InstancedMesh 直接讀 WASM 記憶體裡的位置與旋轉。",
      });
    },
  },
] });
</script>
</body>
</html>
