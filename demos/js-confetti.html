<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Confetti 示範：表情符號彩紙</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body.paper { background: linear-gradient(160deg, #fff4e6 0%, #ffe3ec 55%, #e8f0ff 100%); }
  .card {
    position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
    width: min(380px, calc(100% - 32px)); text-align: center; padding: 22px 20px 18px;
    box-shadow: 0 18px 50px rgba(120, 60, 90, .18);
  }
  .card .to { font-size: 12px; letter-spacing: .2em; color: var(--muted); }
  .card h1 { margin: 6px 0 2px; font-size: clamp(24px, 6vw, 34px); }
  .card p { margin: 0; color: var(--muted); font-size: 13px; }
  .reactions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .reactions .btn { font-size: 20px; padding: 8px 10px; background: #fff; }
  .reactions .btn small { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .count { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .count b { color: var(--c3); }
</style>
</head>
<body class="paper">
<div class="card panel">
  <div class="to">TO 小美</div>
  <h1>生日快樂！</h1>
  <p>點下方的反應，表情會從畫面兩側噴出</p>
  <div class="reactions" id="reactions">
    <button class="btn" data-r="cake">🎂<small>蛋糕</small></button>
    <button class="btn" data-r="balloon">🎈<small>氣球</small></button>
    <button class="btn" data-r="tea">🧋<small>珍奶</small></button>
    <button class="btn" data-r="sakura">🌸<small>櫻花</small></button>
    <button class="btn" data-r="paper">🎊<small>彩紙</small></button>
  </div>
  <div class="count">已送出 <b id="sent">0</b> 次祝福</div>
</div>
<div class="hint">點按鈕送出祝福・點空白處在滑鼠位置噴發</div>

<script src="https://cdn.jsdelivr.net/npm/js-confetti@0.13.1/dist/js-confetti.browser.js"></script>
<script>
// JSConfetti creates one full-page canvas; each addConfetti call shoots from both lower corners.
const jsConfetti = new JSConfetti();
const REACTIONS = {
  cake: { emojis: ["🎂", "🍰", "🕯️"], emojiSize: 60, confettiNumber: 40 },
  balloon: { emojis: ["🎈", "🎈", "🎁"], emojiSize: 70, confettiNumber: 32 },
  tea: { emojis: ["🧋", "🧋", "🥤"], emojiSize: 64, confettiNumber: 36 },
  sakura: { emojis: ["🌸", "💮", "🌷"], emojiSize: 46, confettiNumber: 60 },
  paper: { confettiColors: ["#f72585", "#ffb703", "#4cc9f0", "#7bd389", "#9d8cff"], confettiRadius: 5, confettiNumber: 260 },
};
const keys = Object.keys(REACTIONS);
let last = "cake";
let sent = 0;
let userActed = false;

function send(key, pos) {
  last = key;
  sent += 1;
  document.getElementById("sent").textContent = sent;
  document.querySelectorAll("#reactions .btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.r === key)));
  if (pos) jsConfetti.addConfettiAtPosition({ ...REACTIONS[key], confettiDispatchPosition: pos });
  else jsConfetti.addConfetti(REACTIONS[key]);
}

document.getElementById("reactions").addEventListener("click", (e) => {
  const b = e.target.closest("[data-r]");
  if (!b) return;
  userActed = true;
  send(b.dataset.r);
});
document.body.addEventListener("pointerdown", (e) => {
  if (e.target.closest(".card")) return;
  userActed = true;
  send(last, { x: e.clientX, y: e.clientY });
});

// Idle previews: cycle through the reactions until the viewer interacts.
let i = 0;
send(keys[0]);
setInterval(() => {
  if (userActed) return;
  i = (i + 1) % keys.length;
  send(keys[i]);
}, 1800);
</script>
</body>
</html>
