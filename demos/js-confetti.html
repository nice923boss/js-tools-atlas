<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Confetti 示範：七個場景看懂表情彩紙與上限</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="_shared/showcase.css">
<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["生日祝福卡","彩紙參數","Emoji 大小與組合","定點發射","Promise 與清除","嵌入元件與寬度","極限測試"]}</script>
<style>
  /* js-confetti sizes its bitmap from the canvas CSS box every frame, so canvases only need a CSS size. */
  .sc-scene canvas.jc { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; pointer-events: none; z-index: 5; }
  .sc-scene .night { position: absolute; inset: 0; background: radial-gradient(80% 90% at 50% 20%, #1d2333 0%, #0e1013 70%); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 7px; background: rgba(14, 16, 19, .8); border: 1px solid var(--line); font: 600 12px/1.35 var(--font); color: var(--fg); white-space: nowrap; }
  .chip code, .chip .num { font: 600 12px/1.35 var(--mono); color: var(--c2); }
  .chip .def { font: 500 11px/1 var(--font); color: var(--c4); }
  .sw { display: inline-flex; gap: 2px; }
  .sw i { width: 9px; height: 9px; border-radius: 50%; }
  @media (max-width: 560px) { .lane .chip .k, .lane .chip .sw { display: none; } }

  /* 1. birthday card */
  .bday { position: absolute; inset: 0; background: linear-gradient(160deg, #fff4e6 0%, #ffe3ec 55%, #e8f0ff 100%); cursor: pointer; }
  .bday .card { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 32px)); text-align: center; padding: 22px 20px 18px; box-shadow: 0 18px 50px rgba(120, 60, 90, .18); cursor: default; }
  .bday .to { font-size: 12px; letter-spacing: .2em; color: var(--muted); }
  .bday h1 { margin: 6px 0 2px; font-size: clamp(24px, 6vw, 34px); }
  .bday p { margin: 0; color: var(--muted); font-size: 13px; }
  .reactions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
  .reactions .btn { font-size: 20px; padding: 8px 10px; background: #fff; }
  .reactions .btn small { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .bday .count { margin-top: 12px; font-size: 12px; color: var(--muted); }
  .bday .count b { color: var(--c3); font-family: var(--mono); }

  /* 2, 3. lanes */
  .lanes { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px 10px; display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .lane { position: relative; overflow: hidden; border-radius: 12px; border: 1px dashed var(--line); background: rgba(255, 255, 255, .025); min-height: 0; }
  .lane .chip { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 6; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; }

  /* 4. todo list */
  .todo { position: absolute; left: 50%; top: calc(50% + var(--sc-ctl-h, 0px) / 2); transform: translate(-50%, -50%); width: min(380px, calc(100% - 32px)); padding: 14px 14px 12px; }
  .todo .head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 10px; font-size: 16px; }
  .todo .head .prog { font: 600 13px/1 var(--mono); color: var(--c2); }
  .todo ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .tick { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 255, 255, .03); color: var(--fg); font: 500 14px/1.3 var(--font); text-align: left; cursor: pointer; }
  .tick i { flex: none; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; font-style: normal; font-size: 13px; font-weight: 800; color: #0e1013; }
  .tick[aria-pressed="true"] i { background: var(--c4); border-color: var(--c4); }
  .tick[aria-pressed="true"] i::after { content: "✓"; }
  .tick[aria-pressed="true"] span { color: var(--muted); text-decoration: line-through; }
  .caption { position: absolute; left: 10px; bottom: 10px; z-index: 6; max-width: calc(100% - 20px); }
  @media (max-height: 480px) {
    .todo { padding: 10px 12px; }
    .todo .head { margin-bottom: 6px; font-size: 14px; }
    .todo ul { gap: 4px; }
    .tick { padding: 5px 8px; font-size: 13px; }
    .tick i { width: 16px; height: 16px; font-size: 11px; }
  }

  /* 5. promise log */
  .side { position: absolute; left: 10px; bottom: 10px; z-index: 6; width: min(420px, calc(100% - 20px)); display: flex; flex-direction: column; gap: 6px; }
  .side .state { align-self: flex-start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .side .state i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .side.busy .state i { background: var(--c4); box-shadow: 0 0 8px var(--c4); }
  .side.gone .state i { background: var(--c3); }
  .log { padding: 8px 10px; font-size: 12.5px; line-height: 1.55; min-height: 2.2em; }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .ts { font: 500 11.5px/1 var(--mono); color: var(--muted); margin-right: 6px; }
  .log b { font-family: var(--mono); color: var(--accent); }
  .log .ok b { color: var(--c4); }
  .log .warn b { color: var(--c3); }

  /* 6. embedded widgets */
  .embeds { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px 10px; display: grid; gap: 10px; grid-template-columns: 1fr 1.7fr 3fr; }
  .emb { container-type: inline-size; position: relative; overflow: hidden; padding: 0; display: flex; align-items: center; justify-content: center; text-align: center; min-height: 0; min-width: 0; }
  .emb .body { padding: 0 10px; }
  .emb .body b { display: block; font-size: clamp(15px, 2vw, 21px); }
  .emb .body small { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  .emb .body .wv { font-family: var(--mono); color: var(--c2); }
  @container (max-width: 150px) { .emb .chip .k { display: none; } }
  .emb .chip { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 6; max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 560px) {
    .embeds { grid-template-columns: 1fr; grid-template-rows: repeat(3, minmax(0, 1fr)); }
    .emb:nth-child(1) { width: 46%; justify-self: center; }
    .emb:nth-child(2) { width: 72%; justify-self: center; }
    .emb .chip { top: 6px; }
    .emb .body { padding-top: 22px; }
  }

  /* 7. stress */
  .lab-stage { position: absolute; inset: 8px; border-radius: 12px; overflow: hidden; background: radial-gradient(70% 80% at 50% 100%, #1d2333 0%, #0e1013 75%); border: 1px solid var(--line); }
  @media (min-width: 761px) { .lab-stage { inset: 8px 8px 8px 350px; } }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/js-confetti@0.13.1/dist/js-confetti.browser.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// js-confetti showcase: seven scenes from the original birthday card to a confettiNumber stress ramp.
const { h, fmt, fmtMs } = Showcase;
const PALETTE = ["#f72585", "#ffb703", "#4cc9f0", "#7bd389", "#9d8cff"];
const LIB_COLORS = ["#fcf403", "#62fc03", "#f4fc03", "#03e7fc", "#03fca5", "#a503fc", "#fc03ad", "#fc03c2"]; // js-confetti defaults, for swatches only
const PASTEL = ["#ffadad", "#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff", "#bdb2ff"];
const GOLD = ["#f7df1e", "#ffd166", "#e9b949", "#fff3b0"];

// One JSConfetti instance drawing on its own canvas inside `host` (instead of the library's full-page fixed canvas).
function blaster(ctx, host) {
  const canvas = h("canvas", { class: "jc" });
  host.append(canvas);
  const jc = new JSConfetti({ canvas });
  ctx.onCleanup(() => jc.clearCanvas());
  return { canvas, jc };
}
// confettiDispatchPosition is in CSS pixels relative to the canvas.
function posIn(canvas, clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}
// activeConfettiBatches is internal state; read it only to show how many shapes are still alive.
const aliveCount = (jc) => jc.activeConfettiBatches.reduce((n, b) => n + b.shapes.length, 0);
const swatch = (colors) => `<span class="sw">${colors.map((c) => `<i style="background:${c}"></i>`).join("")}</span>`;

Showcase.run({ scenes: [
  {
    id: "card", title: "生日祝福卡", paper: true,
    api: "jsConfetti.addConfetti({ emojis, emojiSize, confettiNumber })・addConfettiAtPosition({ confettiDispatchPosition })",
    desc: "原本的招牌示範：五個反應按鈕各是一組 emojis 或 confettiColors 設定，addConfetti 從畫面左右兩側往上噴；點空白處改用 addConfettiAtPosition 從游標位置噴出。",
    hint: "點卡片上的反應送出祝福・點空白處在該位置噴發",
    mount(ctx) {
      const R = {
        cake: { icon: "🎂", name: "蛋糕", opts: { emojis: ["🎂", "🍰", "🕯️"], emojiSize: 60, confettiNumber: 40 } },
        balloon: { icon: "🎈", name: "氣球", opts: { emojis: ["🎈", "🎈", "🎁"], emojiSize: 70, confettiNumber: 32 } },
        tea: { icon: "🧋", name: "珍奶", opts: { emojis: ["🧋", "🧋", "🥤"], emojiSize: 64, confettiNumber: 36 } },
        sakura: { icon: "🌸", name: "櫻花", opts: { emojis: ["🌸", "💮", "🌷"], emojiSize: 46, confettiNumber: 60 } },
        paper: { icon: "🎊", name: "彩紙", opts: { confettiColors: PALETTE, confettiRadius: 5, confettiNumber: 260 } },
      };
      ctx.html(`<div class="bday"><div class="card panel"><div class="to">TO 小美</div><h1>生日快樂！</h1><p>點下方的反應，表情會從畫面兩側噴出</p>
        <div class="reactions">${Object.entries(R).map(([k, r]) => `<button class="btn" type="button" data-r="${k}">${r.icon}<small>${r.name}</small></button>`).join("")}</div>
        <div class="count">已送出 <b>0</b> 次祝福</div></div></div>`);
      const stage = ctx.$(".bday"), sentEl = ctx.$(".count b"), btns = ctx.$$(".reactions .btn");
      const { canvas, jc } = blaster(ctx, ctx.el);
      let last = "cake", sent = 0, user = false;
      function send(key, pos) {
        last = key;
        sentEl.textContent = ++sent;
        btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.r === key)));
        const o = R[key].opts;
        if (pos) jc.addConfettiAtPosition({ ...o, confettiDispatchPosition: pos });
        else jc.addConfetti(o);
      }
      btns.forEach((b) => ctx.on(b, "click", () => { user = true; send(b.dataset.r); }));
      ctx.on(stage, "pointerdown", (e) => {
        if (e.target.closest(".card")) return;
        user = true;
        send(last, posIn(canvas, e.clientX, e.clientY));
      });
      // Idle preview: cycle through the reactions until the viewer interacts.
      const keys = Object.keys(R);
      let i = 0;
      send(keys[0]);
      ctx.interval(() => { if (!user) send(keys[(i = (i + 1) % keys.length)]); }, 1800);
    },
  },
  {
    id: "params", title: "彩紙參數",
    api: "jsConfetti.addConfetti({ confettiRadius, confettiNumber, confettiColors })",
    desc: "三條跑道各有自己的 canvas 與 JSConfetti 實例，同時發射、只差一個參數。js-confetti 的彩紙只有圓片一種形狀（翻轉時壓成細條），能調的就是半徑、數量與顏色。",
    hint: "上方選單切換參數・每秒自動重發",
    mount(ctx) {
      const PARAMS = {
        confettiRadius: { vals: [3, 6, 12], def: 1 },
        confettiNumber: { vals: [60, 250, 600], def: 1 },
        confettiColors: { vals: [undefined, PASTEL, GOLD], names: ["預設八色", "馬卡龍", "金色"], def: 0 },
      };
      ctx.html(`<div class="night"></div><div class="lanes">${'<div class="lane"><span class="chip"></span></div>'.repeat(3)}</div>`);
      let param = "confettiRadius";
      ctx.select("參數", Object.keys(PARAMS), param, (v) => { param = v; label(); shoot(); });
      ctx.button("發射", () => shoot(), { primary: true });
      const lanes = ctx.$$(".lane").map((el) => ({ chip: el.querySelector(".chip"), ...blaster(ctx, el) }));
      function label() {
        const p = PARAMS[param];
        lanes.forEach((l, i) => {
          const def = i === p.def ? '<span class="def">預設</span>' : "";
          l.chip.innerHTML = p.names
            ? `<code class="k">confettiColors</code>${swatch(p.vals[i] || LIB_COLORS)}${p.names[i]}`
            : `<code><span class="k">${param}: </span>${p.vals[i]}</code>${def}`;
        });
      }
      function shoot() {
        const p = PARAMS[param];
        lanes.forEach((l, i) => {
          const o = { confettiRadius: 5, confettiNumber: 160 };
          if (p.vals[i] !== undefined) o[param] = p.vals[i];
          else delete o[param];
          l.jc.addConfetti(o);
        });
      }
      label();
      shoot();
      ctx.interval(shoot, 1000);
    },
  },
  {
    id: "emoji", title: "Emoji 大小與組合",
    api: "jsConfetti.addConfetti({ emojis: ['🧋', '🥟', '🍢'], emojiSize, confettiNumber: 20 })",
    desc: "傳入 emojis 就改噴表情，數量預設 40（彩紙預設 250）。emojiSize 以 canvas 像素計，函式庫沒有依 devicePixelRatio 放大字型，高解析度螢幕上看起來會比設定值小。同一次呼叫只能二選一，表情配彩紙要呼叫兩次。",
    hint: "上方切換表情組合・「加彩紙」示範同時呼叫兩次",
    mount(ctx) {
      const SETS = [["慶生", ["🎂", "🎉", "🎁"]], ["小吃", ["🧋", "🥟", "🍢"]], ["天氣", ["⛅", "☔", "🌈"]], ["運動", ["⚽", "🏀", "🏸"]]];
      const SIZES = [36, 80, 130];
      ctx.html(`<div class="night"></div><div class="lanes">${'<div class="lane"><span class="chip"></span></div>'.repeat(3)}</div>`);
      let set = 0, mix = false;
      ctx.group(SETS.map(([n]) => n), 0, (i) => { set = i; shoot(); });
      ctx.toggle("加彩紙", mix, (v) => { mix = v; shoot(); });
      ctx.button("發射", () => shoot(), { primary: true });
      const lanes = ctx.$$(".lane").map((el, i) => {
        el.querySelector(".chip").innerHTML = `<code><span class="k">emojiSize: </span>${SIZES[i]}</code>${i === 1 ? '<span class="def">預設</span>' : ""}`;
        return blaster(ctx, el);
      });
      function shoot() {
        lanes.forEach(({ jc }, i) => {
          jc.addConfetti({ emojis: SETS[set][1], emojiSize: SIZES[i], confettiNumber: 20 });
          if (mix) jc.addConfetti({ confettiRadius: 4, confettiNumber: 90, confettiColors: PALETTE });
        });
      }
      shoot();
      ctx.interval(shoot, 1000);
    },
  },
  {
    id: "position", title: "定點發射",
    api: "jsConfetti.addConfettiAtPosition({ confettiDispatchPosition: { x, y }, confettiNumber, confettiRadius })",
    desc: "addConfettiAtPosition 從指定座標（相對 canvas 的 CSS 像素）往上半圈噴出，適合綁在按鈕或勾選框上。清單全部完成時，再用 addConfetti 從兩側收尾。",
    hint: "勾選待辦會從勾選框噴出・點空白處在該位置噴發",
    mount(ctx) {
      const TASKS = ["寫完週報", "回覆客戶的報價信", "修好登入頁的 bug", "上傳研討會簡報", "預約下週會議室"];
      ctx.html(`<div class="night"></div><div class="todo panel"><div class="head"><b>今天的待辦</b><span class="prog">0 / ${TASKS.length}</span></div>
        <ul>${TASKS.map((t) => `<li><button class="tick" type="button" aria-pressed="false"><i></i><span>${t}</span></button></li>`).join("")}</ul></div>
        <span class="chip caption"><code>confettiDispatchPosition</code><span class="num pos">尚未發射</span></span>`);
      let num = 70, user = false, rest = 0;
      ctx.button("重設清單", () => { user = true; reset(); });
      ctx.slider("confettiNumber", { min: 20, max: 200, step: 10, value: num }, (v) => { num = v; });
      const { canvas, jc } = blaster(ctx, ctx.el);
      const progEl = ctx.$(".prog"), posEl = ctx.$(".pos"), headEl = ctx.$(".head b");
      const tasks = ctx.$$(".tick").map((btn) => ({ btn, box: btn.querySelector("i"), done: false }));
      function burstAt(pos) {
        jc.addConfettiAtPosition({ confettiDispatchPosition: pos, confettiNumber: num, confettiRadius: 4, confettiColors: PALETTE });
        posEl.textContent = `{ x: ${Math.round(pos.x)}, y: ${Math.round(pos.y)} }`;
      }
      function setDone(t, done) {
        t.done = done;
        t.btn.setAttribute("aria-pressed", String(done));
        const n = tasks.filter((x) => x.done).length;
        progEl.textContent = `${n} / ${tasks.length}`;
        headEl.textContent = n === tasks.length ? "全部完成！" : "今天的待辦";
      }
      function check(t) {
        if (t.done) { setDone(t, false); return; }
        setDone(t, true);
        const r = t.box.getBoundingClientRect();
        burstAt(posIn(canvas, r.left + r.width / 2, r.top + r.height / 2));
        if (tasks.every((x) => x.done)) {
          ctx.timeout(() => {
            jc.addConfetti({ emojis: ["🎉", "🏆", "✨"], emojiSize: 56, confettiNumber: 24 });
            jc.addConfetti({ confettiColors: PALETTE, confettiNumber: 220 });
          }, 350);
        }
      }
      function reset() { tasks.forEach((t) => setDone(t, false)); }
      tasks.forEach((t) => ctx.on(t.btn, "click", () => { user = true; check(t); }));
      ctx.on(ctx.$(".night"), "pointerdown", (e) => { user = true; burstAt(posIn(canvas, e.clientX, e.clientY)); });
      // Self-running preview: tick one task at a time, celebrate, then start over.
      check(tasks[0]);
      ctx.interval(() => {
        if (user) return;
        const next = tasks.find((t) => !t.done);
        if (next) check(next);
        else if (++rest > 2) { rest = 0; reset(); }
      }, 1300);
    },
  },
  {
    id: "promise", title: "Promise 與清除",
    api: "await jsConfetti.addConfetti()・jsConfetti.clearCanvas()・jsConfetti.destroyCanvas()",
    desc: "每次 addConfetti 回傳該批的 Promise，碎片全部落出畫布才 resolve（約每 10 格檢查一次）。clearCanvas() 直接丟掉進行中的批次，那些 Promise 永遠不會 resolve；destroyCanvas() 只把 canvas 移出 DOM，要先 clearCanvas。",
    hint: "按上方按鈕看左下紀錄・操作後自動示範停止",
    mount(ctx) {
      ctx.html(`<div class="night"></div><div class="side"><span class="chip state"><i></i><span></span></span><div class="log panel"></div></div>`);
      const side = ctx.$(".side"), stateEl = ctx.$(".state span"), logEl = ctx.$(".log");
      const born = performance.now();
      const pending = new Map();
      let cur = null, seq = 0, user = false;
      const log = (html, cls = "") => {
        const row = h("div", { class: cls });
        row.innerHTML = `<span class="ts">+${((performance.now() - born) / 1000).toFixed(1)}s</span>${html}`;
        logEl.append(row);
        while (logEl.children.length > 6) logEl.firstChild.remove();
      };
      function build() {
        const canvas = h("canvas", { class: "jc" });
        ctx.el.append(canvas);
        cur = { canvas, jc: new JSConfetti({ canvas }) };
      }
      build();
      ctx.onCleanup(() => cur && cur.jc.clearCanvas());
      function launch(opts, what) {
        const id = ++seq, t0 = performance.now();
        const p = opts.confettiDispatchPosition ? cur.jc.addConfettiAtPosition(opts) : cur.jc.addConfetti(opts);
        pending.set(id, t0);
        p.then(() => {
          if (!ctx.active || !pending.has(id)) return;
          pending.delete(id);
          log(`#${id} ${what} resolve，等了 <b>${fmtMs(performance.now() - t0)}</b>`, "ok");
        });
        return { id, p };
      }
      const DEMOS = {
        wait() {
          if (!cur) return;
          const { id } = launch({ confettiNumber: 180, confettiColors: PALETTE }, "addConfetti");
          log(`addConfetti() 送出第 <b>#${id}</b> 批，拿到一個 Promise`);
        },
        async triple() {
          if (!cur) return;
          log("連發三批 addConfettiAtPosition，Promise.all 等全部結束");
          const ps = [];
          for (const k of [0.25, 0.5, 0.75]) {
            if (!cur) return;
            const r = cur.canvas.getBoundingClientRect();
            ps.push(launch({ confettiDispatchPosition: { x: r.width * k, y: r.height * 0.6 }, confettiNumber: 80, confettiColors: PALETTE }, "定點").p);
            await ctx.sleep(300);
          }
          Promise.all(ps).then(() => { if (ctx.active) log("Promise.all：三批都 resolve 了", "ok"); });
        },
        async clear() {
          if (!cur) return;
          if (!pending.size) { launch({ confettiNumber: 240, confettiColors: PALETTE }, "addConfetti"); await ctx.sleep(700); }
          if (!cur) return;
          const n = pending.size;
          cur.jc.clearCanvas();
          pending.clear();
          log(`clearCanvas()：畫面清空，<b>${n}</b> 個 Promise 永遠不會 resolve`, "warn");
        },
        async destroy() {
          if (!cur) return;
          if (!pending.size) { launch({ confettiNumber: 200, confettiColors: PALETTE }, "addConfetti"); await ctx.sleep(600); }
          if (!cur) return;
          cur.jc.clearCanvas();
          pending.clear();
          cur.jc.destroyCanvas();
          cur = null;
          log("clearCanvas() 再 destroyCanvas()：canvas 已移出 DOM", "warn");
          await ctx.sleep(1500);
          build();
          log("new JSConfetti({ canvas })：換上新的畫布");
        },
      };
      const act = (k) => () => { user = true; DEMOS[k](); };
      ctx.button("發射並等待", act("wait"), { primary: true });
      ctx.button("三連發", act("triple"));
      ctx.button("clearCanvas()", act("clear"));
      ctx.button("destroyCanvas()", act("destroy"));
      // Status line: batches and shapes still alive, and how many promises are still waiting.
      let lastPaint = 0;
      ctx.raf((t) => {
        if (t - lastPaint < 150) return;
        lastPaint = t;
        side.classList.toggle("busy", pending.size > 0);
        side.classList.toggle("gone", !cur);
        stateEl.textContent = cur
          ? `進行中 ${cur.jc.activeConfettiBatches.length} 批・畫面 ${fmt(aliveCount(cur.jc))} 片・等待中 Promise ${pending.size} 個`
          : "畫布已移除";
      });
      log("每批 Promise 在碎片全部落出畫布後 resolve");
      // Self-running tour until the viewer presses a button.
      const tour = ["wait", "triple", "clear", "destroy"];
      let step = 0;
      const next = () => { if (user) return; DEMOS[tour[++step % tour.length]](); ctx.timeout(next, 4200); };
      DEMOS.wait();
      ctx.timeout(next, 1800);
    },
  },
  {
    id: "embed", title: "嵌入元件與寬度",
    api: "new JSConfetti({ canvas: card.querySelector('canvas') })・初速 × log(canvas 寬) / log(1920)",
    desc: "傳入自己的 canvas，彩紙就只畫在那張卡片裡。js-confetti 會依 canvas 寬度調整初速，寬 1920px 為 1 倍，越窄噴得越低越慢，所以同一組參數在小元件裡比較收斂。",
    hint: "右上「同時發射」・三張卡片用同一組參數",
    mount(ctx) {
      const CARDS = [["訂單已送達", "手機通知卡片"], ["付款成功", "結帳對話框"], ["年度業績達標", "全幅橫幅"]];
      ctx.html(`<div class="night"></div><div class="embeds">${CARDS.map(([t, s]) => `<div class="emb panel"><span class="chip"></span><div class="body"><b>${t}</b><small>${s}</small><small>canvas 寬 <span class="wv"></span></small></div></div>`).join("")}</div>`);
      ctx.button("同時發射", () => shoot(), { primary: true });
      const cards = ctx.$$(".emb").map((el) => ({ chip: el.querySelector(".chip"), wv: el.querySelector(".wv"), ...blaster(ctx, el) }));
      function label() {
        cards.forEach((c) => {
          const w = Math.round(c.canvas.getBoundingClientRect().width);
          c.wv.textContent = `${w}px`;
          c.chip.innerHTML = `<span class="k">初速 </span><span class="num">×${(Math.log(w) / Math.log(1920)).toFixed(2)}</span>`;
        });
      }
      function shoot() { cards.forEach((c) => c.jc.addConfetti({ confettiNumber: 120, confettiRadius: 5, confettiColors: PALETTE })); }
      label();
      ctx.onResize(label);
      shoot();
      ctx.interval(shoot, 1400);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "每 0.5 秒 jsConfetti.addConfetti({ confettiNumber: N })",
    desc: "每 0.5 秒呼叫一次 addConfetti，逐級加大每批的 confettiNumber，直到 FPS 掉到 30 以下。可切換圓形彩紙與 Emoji 比較繪圖成本。",
    hint: "按「自動加壓」開始・切換 Emoji 後再測一次",
    mount(ctx) {
      ctx.html(`<div class="lab-stage"></div>`);
      const { jc } = blaster(ctx, ctx.$(".lab-stage"));
      let n = 0, emoji = false, callMs = 0;
      ctx.controls.classList.add("bottom");
      ctx.group(["圓形彩紙", "Emoji"], 0, (i) => { emoji = i === 1; });
      ctx.interval(() => {
        if (!n) return;
        const t0 = performance.now();
        jc.addConfetti(emoji ? { emojis: ["🎉", "🎈", "✨"], emojiSize: 40, confettiNumber: n } : { confettiNumber: n, confettiRadius: 5, confettiColors: PALETTE });
        callMs += (performance.now() - t0 - callMs) * 0.3;
      }, 500);
      ctx.ramp({
        label: "每批片數", unit: "片", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 12000], minFps: 30, warmup: 2600,
        apply(v) { n = v; },
        metrics: () => ({
          畫面存活: `${fmt(aliveCount(jc))} 片`,
          進行中批次: `${jc.activeConfettiBatches.length} 批`,
          "addConfetti 耗時": `${callMs.toFixed(2)} ms`,
        }),
        note: "每批從左右兩側各噴一半，大約 2 到 3 秒落出畫布，所以畫面上同時有 4 到 6 批。js-confetti 每格都重設 canvas 尺寸（等於清空）再把所有碎片重畫一次，也沒有數量上限，存活片數越多主執行緒越吃緊。Emoji 用 fillText 畫字，比畫橢圓重得多。",
      });
    },
  },
] });
</script>
</body>
</html>
