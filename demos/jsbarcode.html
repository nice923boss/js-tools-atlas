<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JsBarcode 示範：多格式條碼產生器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 100%; }
  .form { padding: 14px 16px 56px; border-right: 1px solid var(--line); background: var(--bg-2); overflow-y: auto; }
  .form h1 { font-size: 16px; margin: 0 0 4px; }
  .lab { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .field { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); outline: none; font: 14px var(--mono); }
  .field:focus { border-color: var(--c2); }
  .field.bad { border-color: var(--c3); background: rgba(214, 31, 105, .05); }
  .msg { font-size: 12px; min-height: 18px; margin-top: 4px; color: var(--c4); }
  .msg.bad { color: var(--c3); }
  .range { display: grid; grid-template-columns: 1fr 36px; gap: 8px; align-items: center; font: 12px var(--mono); color: var(--muted); }
  input[type="range"] { width: 100%; accent-color: var(--c2); }
  .row { display: flex; gap: 12px; align-items: center; font-size: 13px; margin-top: 10px; }
  .row input[type="color"] { width: 44px; height: 28px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--bg); }
  .row input[type="checkbox"] { accent-color: var(--c2); }
  .actions { display: flex; gap: 8px; margin-top: 14px; }
  .actions .btn { flex: 1; }
  .main { display: grid; grid-template-rows: minmax(0, 52%) minmax(0, 48%); min-width: 0; min-height: 0; }
  .hero { display: grid; place-items: center; padding: 14px; min-height: 0;
    background: repeating-linear-gradient(-45deg, #efeee9 0 12px, #e8e6e0 12px 24px); }
  .label { background: #fff; border-radius: 12px; box-shadow: 0 12px 34px rgba(0,0,0,.16); padding: 14px 20px 12px; display: grid; gap: 4px; max-width: 100%; max-height: 100%; }
  .label .top { display: flex; justify-content: space-between; align-items: baseline; gap: 18px; }
  .label .name { font-weight: 700; font-size: 15px; color: #1c1c1a; }
  .label .price { font: 700 18px var(--mono); color: var(--c3); }
  .label .sub { font-size: 11px; color: #8a877d; display: flex; justify-content: space-between; gap: 12px; }
  .label .code { display: grid; place-items: center; min-height: 0; overflow: hidden; }
  .label .code svg { max-width: 100%; height: auto; display: block; }
  .gallery { overflow-y: auto; padding: 12px 14px 50px; border-top: 1px solid var(--line); }
  .gallery h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .fmt { border: 1px solid var(--line); background: var(--bg-2); border-radius: 10px; padding: 8px 8px 6px; cursor: pointer; text-align: left; font: inherit; color: inherit; display: grid; gap: 2px; }
  .fmt:hover { border-color: var(--c2); }
  .fmt[aria-pressed="true"] { border-color: var(--c2); box-shadow: 0 0 0 2px rgba(31, 143, 184, .25); }
  .fmt b { font-size: 12px; }
  .fmt small { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fmt svg { width: 100%; height: 44px; display: block; }
  @media (max-width: 640px) {
    /* stacked layout scrolls under the fixed hint; the form labels already explain the controls */
    .hint { display: none; }
    .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .form { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px 4px; overflow: visible; }
    .form .wide { display: none; }
    .main { grid-template-rows: minmax(0, 44%) minmax(0, 56%); }
    .label { padding: 10px 12px 8px; }
    .label .name { font-size: 13px; }
    .label .price { font-size: 15px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .gallery { padding: 8px 10px 46px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="form">
    <h1 class="wide">JsBarcode 條碼產生器</h1>
    <label class="lab wide" for="value">條碼內容</label>
    <input class="field" id="value" spellcheck="false" aria-label="條碼內容">
    <div class="msg" id="msg"></div>
    <div class="wide">
      <span class="lab">線寬</span>
      <div class="range"><input type="range" id="width" min="1" max="4" step="1" value="2"><span id="widthV">2</span></div>
      <span class="lab">高度</span>
      <div class="range"><input type="range" id="height" min="30" max="140" step="5" value="80"><span id="heightV">80</span></div>
      <div class="row">
        <label><input type="checkbox" id="text" checked> 顯示文字</label>
        <label>顏色 <input type="color" id="color" value="#1c1c1a"></label>
      </div>
      <div class="actions">
        <button class="btn primary" id="svgBtn">下載 SVG</button>
        <button class="btn" id="pngBtn">下載 PNG</button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="hero">
      <div class="label">
        <div class="top"><span class="name">JS 工具圖鑑 精裝版</span><span class="price">NT$ 680</span></div>
        <div class="sub"><span id="fmtName"></span><span>示意資料</span></div>
        <div class="code"><svg id="barcode"></svg></div>
      </div>
    </div>
    <div class="gallery">
      <h2>同一個函式，10 種格式（點選切換）</h2>
      <div class="grid" id="grid"></div>
    </div>
  </div>
</div>
<div class="hint">改內容會即時檢查格式是否合法</div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const FORMATS = [
  { f: "CODE128", name: "Code 128", sample: "JS-ATLAS-2026", use: "通用，英數與符號皆可", rule: "可用任意 ASCII 字元" },
  { f: "EAN13", name: "EAN-13", sample: "4710088432018", use: "零售商品（臺灣 471 開頭）", rule: "需 12 碼數字，或含正確檢查碼的 13 碼" },
  { f: "EAN8", name: "EAN-8", sample: "96385074", use: "小型商品包裝", rule: "需 7 碼數字，或含正確檢查碼的 8 碼" },
  { f: "UPC", name: "UPC-A", sample: "123456789999", use: "北美零售商品", rule: "需 11 碼數字，或含正確檢查碼的 12 碼" },
  { f: "CODE39", name: "Code 39", sample: "ATLAS 2026", use: "工業與資產標籤", rule: "只接受大寫英文、數字、空白與 - . $ / + %" },
  { f: "CODE93", name: "Code 93", sample: "ATLAS93", use: "物流與郵件", rule: "只接受大寫英文、數字與少數符號" },
  { f: "ITF14", name: "ITF-14", sample: "15400141288763", use: "物流外箱", rule: "需 13 碼數字，或含正確檢查碼的 14 碼" },
  { f: "codabar", name: "Codabar", sample: "A40156B", use: "圖書館、血袋", rule: "數字與 - $ : / . +，頭尾可加 A 到 D" },
  { f: "MSI", name: "MSI", sample: "123456", use: "倉儲貨架", rule: "只接受數字" },
  { f: "pharmacode", name: "Pharmacode", sample: "1234", use: "藥品包裝", rule: "3 到 131070 的整數" },
];
let current = FORMATS[1];

function opts(extra) {
  return {
    format: current.f,
    width: +$("width").value,
    height: +$("height").value,
    displayValue: $("text").checked,
    lineColor: $("color").value,
    background: "#ffffff",
    margin: 6,
    font: "JetBrains Mono, Consolas, monospace",
    fontSize: 16,
    ...extra,
  };
}

function render() {
  let ok = true;
  const value = $("value").value;
  JsBarcode("#barcode", value, opts({ valid: (v) => { ok = v; } }));
  $("value").classList.toggle("bad", !ok);
  $("msg").classList.toggle("bad", !ok);
  $("msg").textContent = ok ? `✓ 合法的 ${current.name}` : `不合法：${current.rule}`;
  $("fmtName").textContent = `${current.name}・${current.use}`;
  $("barcode").style.opacity = ok ? 1 : 0.15;
}

function buildGallery() {
  $("grid").innerHTML = FORMATS.map((x, i) =>
    `<button class="fmt" data-i="${i}" aria-pressed="${x === current}"><b>${x.name}</b><svg id="g${i}"></svg><small>${x.use}</small></button>`).join("");
  FORMATS.forEach((x, i) => JsBarcode(`#g${i}`, x.sample, { format: x.f, width: 1.4, height: 34, displayValue: false, margin: 2, lineColor: "#1c1c1a", background: "transparent" }));
}

function select(i) {
  current = FORMATS[i];
  $("value").value = current.sample;
  $("grid").querySelectorAll(".fmt").forEach((b) => b.setAttribute("aria-pressed", +b.dataset.i === i));
  render();
}

function download(name, url) {
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
}
$("svgBtn").addEventListener("click", () => {
  const xml = new XMLSerializer().serializeToString($("barcode"));
  const url = URL.createObjectURL(new Blob([xml], { type: "image/svg+xml" }));
  download(`barcode-${current.f}.svg`, url);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});
$("pngBtn").addEventListener("click", () => {
  const c = document.createElement("canvas");
  JsBarcode(c, $("value").value, opts({ width: +$("width").value * 2, height: +$("height").value * 2, fontSize: 32, margin: 20 }));
  download(`barcode-${current.f}.png`, c.toDataURL("image/png"));
});

$("grid").addEventListener("click", (e) => { const b = e.target.closest(".fmt"); if (b) select(+b.dataset.i); });
$("value").addEventListener("input", render);
for (const id of ["width", "height"]) $(id).addEventListener("input", () => { $(id + "V").textContent = $(id).value; render(); });
for (const id of ["text", "color"]) $(id).addEventListener("input", render);

buildGallery();
select(1);
</script>
</body>
</html>
