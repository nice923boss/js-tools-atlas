<style>

  .jb-lab { display: block; font-size: 12px; color: var(--muted); margin: 9px 0 4px; }

  /* 2. gallery */
  .jb-s2 { grid-template-rows: minmax(0, 1fr); }

  .jb-sub .nm small { font-size: 11px; color: var(--muted); }
  .jb-sub .bc { min-width: 0; overflow: hidden; background: #fff; border-radius: 6px; padding: 4px; min-height: 52px; display: flex; align-items: center; }
  .jb-sub .bc svg { max-width: 100%; height: auto; display: block; }
  .jb-sub .st { font-size: 12px; line-height: 1.5; }
  .jb-sub .meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 3px; }
  .jb-sub .meter i { display: block; height: 100%; background: var(--c2); }
  .jb-sub.off .bc { opacity: .25; }
  @media (max-width: 640px) {
    .jb-sub { grid-template-columns: minmax(0, 1fr) 118px; padding: 6px 8px; }

  @media (max-width: 640px) {
    .jb-s4 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 34%) minmax(0, 1fr) auto; gap: 6px; }

  /* 5. targets */

  @media (max-width: 640px) {

  .jb-shelf svg, .jb-shelf img { width: 100%; height: 42px; display: block; }

    .jb-s7 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 42%) minmax(0, 58%); gap: 6px; }

  /* 8. stress */
  .jb-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; display: flex; flex-direction: column; gap: 8px; }
  .jb-sbar { flex: none; display: flex; flex-wrap: wrap; gap: 5px; }

  .jb-pill b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .jb-sgrid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 4px; align-content: start; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
  .jb-sgrid > * { width: 100%; height: 34px; display: block; background: #fff; }
  @media (max-width: 760px) { .jb-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); } }
</style>

<body class="paper">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// JsBarcode showcase: product label, format gallery with automatic check digits, Code 128 subsets,
// appearance options, SVG / canvas / img targets, validation, chaining plus init(), and a render bench.
const { fmt, fmtMs, h } = Showcase;
const NS = "http://www.w3.org/2000/svg";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const newSvg = () => document.createElementNS(NS, "svg");
// Visible characters, with control characters spelled out
const show = (s) => esc(s).replace(/\t/g, "⇥").replace(/\n/g, "⏎");
// Text printed under the bars (EAN/UPC split it into several <text> groups)
const printed = (svg) => [...svg.querySelectorAll("text")].map((t) => t.textContent).join("");
// Render with the valid callback; returns { ok, svg }
function draw(target, value, opts) {
  let ok = true;
  JsBarcode(target, value, { ...opts, valid: (v) => { ok = v; } });
  return ok;
}
// Without the callback JsBarcode throws; the message names the minified encoder class, so keep only the useful part
function throwMsg(value, format) {
  try { JsBarcode(newSvg(), value, { format }); return ""; } catch (e) { return String(e && e.message ? e.message : e).replace(/ for \w+$/, ""); }
}

const LABEL_FORMATS = [
  { f: "CODE128", name: "Code 128", sample: "JS-ATLAS-2026", use: "通用，英數與符號皆可", rule: "可用任意 ASCII 字元" },
  { f: "EAN13", name: "EAN-13", sample: "4710088432018", use: "零售商品（臺灣 471 開頭）", rule: "需 12 碼數字，或含正確檢查碼的 13 碼" },
  { f: "EAN8", name: "EAN-8", sample: "96385074", use: "小型商品包裝", rule: "需 7 碼數字，或含正確檢查碼的 8 碼" },
  { f: "UPC", name: "UPC-A", sample: "123456789999", use: "北美零售商品", rule: "需 11 碼數字，或含正確檢查碼的 12 碼" },
  { f: "CODE39", name: "Code 39", sample: "ATLAS 2026", use: "工業與資產標籤", rule: "大寫英文、數字、空白與 - . $ / + %（小寫會自動轉大寫）" },
  { f: "CODE93", name: "Code 93", sample: "ATLAS93", use: "物流與郵件", rule: "大寫英文、數字與少數符號" },
  { f: "ITF14", name: "ITF-14", sample: "15400141288763", use: "物流外箱", rule: "需 13 碼數字，或含正確檢查碼的 14 碼" },
  { f: "codabar", name: "Codabar", sample: "A40156B", use: "圖書館、血袋", rule: "數字與 - $ : / . +，頭尾可加 A 到 D" },
  { f: "MSI", name: "MSI", sample: "123456", use: "倉儲貨架", rule: "只接受數字" },
  { f: "pharmacode", name: "Pharmacode", sample: "1234", use: "藥品包裝", rule: "3 到 131070 的整數" },
];

Showcase.run({ scenes: [
  // ---------- 1. product label ----------
  {
    id: "label", title: "商品標籤", paper: true,
    api: "JsBarcode(svg, value, { format, width, height, displayValue, lineColor, valid })",
    desc: "一個函式、一行呼叫就能畫出商品條碼。改內容時用 valid 回呼即時檢查格式是否合法：不合法時 JsBarcode 不會丟例外，也不會改動原本的條碼，這裡把它淡化並顯示該格式的規則。",
    hint: "改條碼內容或換格式，看合法性即時檢查",
    mount(ctx) {
      ctx.html(`<div class="jb-wrap jb-s1"><div class="jb-pane jb-form">
          <label class="jb-lab jb-wide" for="jb-v">條碼內容</label>
          <input class="jb-field" id="jb-v" spellcheck="false" aria-label="條碼內容">
          <div class="jb-msg"></div>
          <label class="jb-lab jb-wide" for="jb-f">格式</label>
          <select class="jb-field jb-wide" id="jb-f">${LABEL_FORMATS.map((x, i) => `<option value="${i}">${x.name}（${x.f}）</option>`).join("")}</select>
          <div class="jb-wide">
            <span class="jb-lab">線寬 width</span><div class="jb-row"><input type="range" data-k="width" min="1" max="4" step="1" value="2"><span>2</span></div>
            <span class="jb-lab">高度 height</span><div class="jb-row"><input type="range" data-k="height" min="30" max="140" step="5" value="80"><span>80</span></div>
            <div class="jb-checks"><label><input type="checkbox" data-k="text" checked> 顯示文字</label><label>顏色 <input type="color" data-k="color" value="#1c1c1a"></label></div>
          </div>
        </div>
        <div class="jb-stage"><div class="jb-label">
          <div class="top"><span class="name">JS 工具圖鑑 精裝版</span><span class="price">NT$ 680</span></div>
          <div class="sub"><span class="fn"></span><span>示意資料</span></div>
          <div class="code"><svg></svg></div>
        </div></div></div>`);
      const input = ctx.$("#jb-v"), sel = ctx.$("#jb-f"), msg = ctx.$(".jb-msg"), svg = ctx.$(".jb-label svg"), code = ctx.$(".jb-label .code");
      const k = (n) => ctx.$(`[data-k="${n}"]`);
      let cur = LABEL_FORMATS[1];
      const render = () => {
        const narrow = innerWidth < 640;
        const ok = draw(svg, input.value, {
          format: cur.f, width: +k("width").value, height: narrow ? 56 : +k("height").value, displayValue: k("text").checked,
          lineColor: k("color").value, background: "#ffffff", margin: 6, font: "JetBrains Mono, Consolas, monospace", fontSize: narrow ? 13 : 16,
        });
        input.classList.toggle("bad", !ok);
        msg.classList.toggle("bad", !ok);
        msg.textContent = ok ? `✓ 合法的 ${cur.name}，印出「${printed(svg)}」` : `✗ 不合法，條碼維持上一張：${cur.rule}`;
        ctx.$(".jb-label .fn").textContent = `${cur.name}・${cur.use}`;
        code.style.opacity = ok ? 1 : 0.15;
      };
      ctx.on(sel, "change", () => { cur = LABEL_FORMATS[+sel.value]; input.value = cur.sample; render(); });
      ctx.on(input, "input", render);
      for (const n of ["width", "height"]) ctx.on(k(n), "input", () => { k(n).nextElementSibling.textContent = k(n).value; render(); });
      for (const n of ["text", "color"]) ctx.on(k(n), "input", render);
      sel.value = "1"; input.value = cur.sample;
      render();
    },
  },

  // ---------- 2. format gallery ----------
  {
    id: "formats", title: "格式圖鑑", paper: true,
    api: "format: \"EAN13\" | \"UPCE\" | \"ITF14\" | \"MSI1010\" | \"codabar\" | …",
    desc: "JsBarcode 3.12 內建 20 多種格式。每張卡片都是實際產生的條碼，下方列出「輸入 → 印出」：EAN、UPC、ITF-14 只給前面幾碼時會自動補上檢查碼（紅字），MSI10／MSI11／MSI1010 各用不同算法補一或兩碼，Codabar 的起訖字元 A 到 D 不會印出。",
    hint: "上方切換分類；flat 讓 EAN／UPC 不加長保護線",
    mount(ctx) {
      const ALL = [
        ["零售", "EAN13", "EAN-13", "471008843201", "商品條碼，12 碼自動補檢查碼"],
        ["零售", "EAN8", "EAN-8", "9638507", "小包裝商品，7 碼自動補"],
        ["零售", "UPC", "UPC-A", "12345678999", "北美商品，11 碼自動補"],
        ["零售", "UPCE", "UPC-E", "01245714", "UPC 壓縮版，小包裝"],
        ["零售", "EAN5", "EAN-5", "12345", "書籍價格加購碼"],
        ["零售", "EAN2", "EAN-2", "53", "期刊期數加購碼"],
        ["物流工業", "CODE128", "Code 128", "JS-ATLAS-2026", "通用，自動挑最短子集"],
        ["物流工業", "CODE39", "Code 39", "ATLAS 2026", "資產標籤，自帶起訖符"],
        ["物流工業", "CODE93", "Code 93", "ATLAS93", "比 Code 39 更密"],
        ["物流工業", "CODE93FullASCII", "Code 93 全 ASCII", "Atlas93", "可編小寫"],
        ["物流工業", "ITF14", "ITF-14", "1540014128876", "外箱，13 碼自動補"],
        ["物流工業", "ITF", "ITF", "12345670", "交錯 2 of 5，偶數位數"],

  // ---------- 3. Code 128 subsets ----------
  {

    hint: "換範例或自己輸入，比較四種寫法的寬度（模組數越少越短）",
    mount(ctx) {
      const PRESETS = [
        { label: "英數混合", v: "ATLAS-2026-0012345678" },
        { label: "純數字", v: "20261011123456" },

      ctx.html(`<div class="jb-wrap jb-s3"><label class="jb-in"><span>內容</span><input class="jb-field" spellcheck="false" value="${PRESETS[0].v}"></label>
        <div class="jb-pane"><h3><b>同一段資料，四種 Code 128 寫法</b><span class="r">寬度 = 模組數 × width</span></h3><div class="jb-scroll jb-rows"></div>
        <div class="jb-note">GS1-128 列固定使用範例「(01)04710088432018(17)261231(10)LOT7」：商品代碼、有效日期、批號。</div></div></div>`);
      const input = ctx.$(".jb-in input"), rows = ctx.$(".jb-rows");
      const SUBS = [
        { f: "CODE128", nm: "CODE128", sm: "自動混用子集" },
        { f: "CODE128A", nm: "CODE128A", sm: "大寫＋控制字元" },
        { f: "CODE128B", nm: "CODE128B", sm: "大小寫＋符號" },
        { f: "CODE128C", nm: "CODE128C", sm: "成對數字" },
        { f: "CODE128", nm: "GS1-128", sm: "ean128: true", gs1: true },
      ];
      const render = () => {
        const val = input.value;
        const res = SUBS.map((s) => {
          const svg = newSvg();
          const v = s.gs1 ? "(01)04710088432018(17)261231(10)LOT7" : val;
          const ok = v.length > 0 && draw(svg, v, { format: s.f, ean128: !!s.gs1, width: 2, height: 46, margin: 0, displayValue: true, fontSize: 13, font: "Consolas, monospace" });

    mount(ctx) {
      const col = (k, title) => `<div class="jb-pane jb-tgt" data-t="${k}"><h3><b>${title}</b></h3><div class="view"><span class="z"></span></div><dl class="jb-kv"></dl></div>`;
      ctx.html(`<div class="jb-wrap jb-s5">${col("svg", "&lt;svg&gt; 向量")}${col("canvas", "&lt;canvas&gt; 點陣")}${col("img", "&lt;img&gt; data URL")}</div>`);
      const OPTS = { format: "EAN13", width: 2, height: 60, margin: 6, fontSize: 16, background: "#ffffff" };
      const VALUE = "4710088432018";
      const els = { svg: newSvg(), canvas: document.createElement("canvas"), img: document.createElement("img") };
      for (const k of Object.keys(els)) {
        const view = ctx.$(`[data-t="${k}"] .view`);
        view.insertBefore(els[k], view.firstChild);
        const t0 = performance.now();
        for (let i = 0; i < 50; i++) JsBarcode(els[k], VALUE, OPTS);
        els[k].dataset.ms = (performance.now() - t0) / 50;
      }
      const info = () => {
        const s = els.svg, c = els.canvas, im = els.img;
        ctx.$('[data-t="svg"] .jb-kv').innerHTML = `<dt>產物</dt><dd>${s.querySelectorAll("rect").length} 個 &lt;rect&gt;＋${s.querySelectorAll("text").length} 個 &lt;text&gt;</dd><dt>尺寸</dt><dd class="jb-num">${s.getAttribute("width")} × ${s.getAttribute("height")}</dd><dt>序列化</dt><dd class="jb-num">${fmt(new XMLSerializer().serializeToString(s).length)} 字元</dd><dt>平均耗時</dt><dd class="jb-num">${(+s.dataset.ms).toFixed(3)} ms</dd>`;
        ctx.$('[data-t="canvas"] .jb-kv').innerHTML = `<dt>產物</dt><dd>點陣圖</dd><dt>尺寸</dt><dd class="jb-num">${c.width} × ${c.height} px</dd><dt>DPR</dt><dd class="jb-num">${devicePixelRatio}（canvas 不會自動乘上）</dd><dt>平均耗時</dt><dd class="jb-num">${(+c.dataset.ms).toFixed(3)} ms</dd>`;
        ctx.$('[data-t="img"] .jb-kv').innerHTML = `<dt>產物</dt><dd>PNG data URL</dd><dt>尺寸</dt><dd class="jb-num">${im.naturalWidth || "…"} × ${im.naturalHeight || "…"} px</dd><dt>src 長度</dt><dd class="jb-num">${fmt(im.src.length)} 字元</dd><dt>平均耗時</dt><dd class="jb-num">${(+im.dataset.ms).toFixed(3)} ms</dd>`;
      };
      let zoom = 1;
      const fit = () => {
        for (const k of Object.keys(els)) {
          const el = els[k], view = el.parentElement;
          const w = k === "svg" ? parseFloat(el.getAttribute("width")) : k === "canvas" ? el.width : el.naturalWidth;
          const base = Math.min(1, (view.clientWidth - 16) / (w || 1));
          el.style.transform = `translateY(-50%) scale(${base * zoom})`;
          view.querySelector(".z").textContent = `${(base * zoom).toFixed(2)}×`;
        }
      };
      ctx.slider("放大", { min: 1, max: 6, step: 0.5, value: 1, format: (v) => `${v}×` }, (v) => { zoom = v; fit(); });
      ctx.on(els.img, "load", () => { info(); fit(); });
      ctx.onResize(fit);
      info();
      ctx.frame(2).then(fit);
    },
  },

          }
        });
        ctx.$(".jb-ims").textContent = `${SHELF.length - fail}／${SHELF.length} 成功・${fmtMs(performance.now() - t1)}`;
      };
      ctx.button("重新 init()", run, { primary: true });
      run();
    },
  },

  // ---------- 8. stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "JsBarcode(target, value, opts) × N",
    desc: "一次產生 N 個內容各不相同的 Code 128 條碼，量總時間換算每個的微秒數。SVG 模式每個都是新的 svg 放進 DOM；Canvas 模式重複使用同一個 canvas，只量編碼加繪製；img 模式每個都轉成 PNG data URL。",
    hint: "按左側「開始測試」；切換底部模式再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="jb-stress"><div class="jb-sbar"><span class="jb-pill">尚未測試：右側會顯示這一級產生的條碼（最多 240 個）</span></div><div class="jb-sgrid"></div></div>`);
      ctx.controls.classList.add("bottom");
      const MODES = ["SVG 進 DOM", "Canvas 重用", "img data URL"];
      let mode = 0;
      ctx.group(MODES, 0, (i) => { mode = i; });
      const grid = ctx.$(".jb-sgrid"), bar = ctx.$(".jb-sbar");
      const OPTS = { format: "CODE128", width: 1, height: 30, margin: 2, fontSize: 10, background: "#ffffff" };
      const val = (i) => `ATL-${(i * 7919 + 1013).toString(36).toUpperCase()}`;
      ctx.bench({
        label: "條碼數量", unit: "個",
        sizes: [100, 300, 1000, 3000, 10000, 30000, 100000],
        target: 1000, budget: 4000,
        prepare(n) { grid.replaceChildren(); return n; },
        run(n) {
          const SHOW = 240;
          let t0 = performance.now(), bytes = 0;
          if (mode === 0) {
            const frag = document.createDocumentFragment();
            for (let i = 0; i < n; i++) { const s = newSvg(); JsBarcode(s, val(i), OPTS); frag.append(s); }
            grid.append(frag);
            grid.offsetHeight; // include layout of the inserted nodes
          } else if (mode === 1) {
            const c = document.createElement("canvas");
            for (let i = 0; i < n; i++) JsBarcode(c, val(i), OPTS);
          } else {
            const im = document.createElement("img");
            for (let i = 0; i < n; i++) { JsBarcode(im, val(i), OPTS); bytes += im.src.length; }
          }
          const ms = performance.now() - t0;
          if (mode !== 0) {
            // Preview only, outside the timed part
            for (let i = Math.max(0, n - SHOW); i < n; i++) { const el = mode === 1 ? document.createElement("canvas") : document.createElement("img"); JsBarcode(el, val(i), OPTS); grid.append(el); }
          }
          const nodes = mode === 0 ? grid.querySelectorAll("*").length : grid.children.length;
          bar.innerHTML = `<span class="jb-pill">${MODES[mode]}・<b>${fmt(n)}</b> 個</span><span class="jb-pill">總計 <b>${fmtMs(ms)}</b>・每個 <b>${((ms / n) * 1000).toFixed(0)} µs</b></span>`
            + (mode === 0 ? `<span class="jb-pill">DOM 節點 <b>${fmt(nodes)}</b></span>` : mode === 2 ? `<span class="jb-pill">data URL 共 <b>${fmt(Math.round(bytes / 1024))} KB</b></span>` : `<span class="jb-pill">只保留最後一張的點陣</span>`);
          return `${((ms / n) * 1000).toFixed(0)} µs／個`;
        },
        note: "每個條碼內容都不同，都要重新編碼。SVG 模式的時間包含建立 rect 節點與插入 DOM 後的版面計算，數量大時 DOM 是瓶頸；Canvas 重用只量純繪製，是三者上限；img 模式多了 PNG 壓縮與 base64 字串。非 SVG 模式的預覽只畫最後 240 個，不計時。",
      });
    },
  },
] });
</script>
</body>
</html>
