<script type="module">
const { h, fmt, fmtCompact, fmtMs } = Showcase;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Consolas, "Noto Sans TC", "Microsoft JhengHei", monospace';
const SR = 44100, FS = 352800; // output rate, and the 8x oversampled rate the filters run at
const RIFF_URL = "https://cdn.jsdelivr.net/npm/jsfxr@1.4.1/riffwave.js";
const SFXR_URL = "https://cdn.jsdelivr.net/npm/jsfxr@1.4.1/sfxr.js";

// ---------- library loading ----------
let libP = null, ORDER = [], SIGNED = [];
function lib() {
  // riffwave.js must be evaluated first: sfxr.js picks up the global RIFFWAVE and sets window.jsfxr.
  libP ||= Showcase.load([RIFF_URL, SFXR_URL]).then(() => {
    const J = window.jsfxr;
    if (!J || !J.sfxr || !J.Params || !J.SoundEffect) throw new Error("jsfxr 沒有正確載入");
    ORDER = J.parameters.order;
    SIGNED = J.parameters.signed;
    return J;
  }).catch((e) => { libP = null; throw e; });
  return libP;
}
async function boot(ctx, label = "載入 jsfxr 1.4.1…") {
  const st = ctx.status(label);
  try { return await lib(); } finally { st.done(); }
}

// ---------- parameters ----------
const GENS = [
  { a: "pickupCoin", zh: "金幣", c: "#f7df1e" }, { a: "laserShoot", zh: "雷射", c: "#f72585" },
  { a: "explosion", zh: "爆炸", c: "#ff8c42" }, { a: "powerUp", zh: "升級", c: "#9d8cff" },
  { a: "hitHurt", zh: "受傷", c: "#ff5d73" }, { a: "jump", zh: "跳躍", c: "#7bd389" },
  { a: "blipSelect", zh: "選取", c: "#4cc9f0" }, { a: "synth", zh: "合成器", c: "#c77dff" },
  { a: "tone", zh: "純音", c: "#e8f0ff" }, { a: "click", zh: "點擊", c: "#a0e8ff" },
  { a: "random", zh: "隨機", c: "#39ff88" },
];
const GEN_BY = Object.fromEntries(GENS.map((g) => [g.a, g]));
const WAVES = ["方波", "鋸齒", "正弦", "雜訊"];
const RATES = [[44100, "44.1k"], [22050, "22k"], [11025, "11k"]];
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
const PZH = {
  wave_type: "波形", p_env_attack: "起音", p_env_sustain: "持續", p_env_punch: "衝擊", p_env_decay: "衰減",
  p_base_freq: "起始頻率", p_freq_limit: "最低頻率", p_freq_ramp: "滑音", p_freq_dramp: "滑音加速",
  p_vib_strength: "顫音深度", p_vib_speed: "顫音速度", p_arp_mod: "琶音幅度", p_arp_speed: "琶音速度",
  p_duty: "佔空比", p_duty_ramp: "佔空比掃描", p_repeat_speed: "重複速度", p_pha_offset: "鑲邊偏移",
  p_pha_ramp: "鑲邊掃描", p_lpf_freq: "低通", p_lpf_ramp: "低通掃描", p_lpf_resonance: "共振",
  p_hpf_freq: "高通", p_hpf_ramp: "高通掃描",
};
const p3 = (x) => String(Number(x.toPrecision(3)));
const fHz = (f) => (!Number.isFinite(f) ? "超出 22 kHz" : f >= 1000 ? `${p3(f / 1000)} kHz` : `${Math.round(f)} Hz`);

// Exact -3 dB points of sfxr's one-pole filters, which run once per oversampled step (352.8 kHz).
// convert.units uses a formula that does not match the code, so the demo computes the real response.
const lpfGain = (w, d, f) => {
  const t = (2 * Math.PI * f) / FS, c = Math.cos(t), s = Math.sin(t), a = 1 - d, b = a * w;
  const re = (1 - c) * (1 - a * c) - a * s * s + b * c, im = (1 - c) * a * s + s * (1 - a * c) - b * s;
  return b / Math.hypot(re, im);
};
const hpfGain = (hp, f) => {
  const t = (2 * Math.PI * f) / FS, c = Math.cos(t), s = Math.sin(t), a = 1 - hp;
  return (a * Math.hypot(1 - c, s)) / Math.hypot(1 - a * c, a * s);
};
function crossing(g, rising) {
  let f = 1, prev = 1;
  for (; f <= 22050; prev = f, f *= 1.02) if ((g(f) >= Math.SQRT1_2) === rising) break;
  if (f > 22050) return Infinity;
  let lo = prev, hi = f;
  for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if ((g(m) >= Math.SQRT1_2) === rising) hi = m; else lo = m; }
  return hi;
}
const lpfCut = (w, d) => (w <= 0 ? 0 : crossing((f) => lpfGain(w, d, f), false));
const hpfCut = (hp) => crossing((f) => hpfGain(hp, f), true);
const lpfW = (v) => Math.min(0.1, Math.max(0, v ** 3 * 0.1));
const lpfD = (w, res) => Math.min(0.8, (5 / (1 + res * res * 20)) * (0.01 + w));
const hpfK = (v) => Math.min(0.1, Math.max(1e-5, v * v * 0.1));

const ZERO_OFF = new Set(["p_hpf_freq", "p_duty_ramp", "p_pha_offset", "p_pha_ramp", "p_lpf_ramp", "p_freq_limit"]);
// Human-readable value of one parameter; six of the library's own unit strings are replaced by values derived from the synth loop.
function unitText(J, k, v, res = 0) {
  if (!Number.isFinite(v)) return String(v);
  if (k === "wave_type") return WAVES[v] ?? String(v);
  if (k === "p_lpf_freq") { if (v === 1) return "關"; const w = lpfW(v); return "≈" + fHz(lpfCut(w, lpfD(w, res))); }
  if (ZERO_OFF.has(k) && v === 0) return "關";
  if (k === "p_hpf_freq") return "≈" + fHz(hpfCut(hpfK(v)));
  if (k === "p_duty_ramp") return `≈${p3(-v * 220.5)}%/秒`;
  if (k === "p_pha_offset") return `≈${p3((Math.sign(v) * v * v * 1020) / 352.8)} ms`;

          g.fillText(`${dec ? "WAV 讀回" : "toWave 樣本"}・${fmt(n)} 樣本・${(n / sr).toFixed(2)} 秒・${bits} 位元 ${fmt(sr)} Hz`, 8, 5, w - 16);
          const X = 6, Wd = w - 12, top = 22, H = hh - top - 6, H1 = Math.round(H * 0.55), H2 = H - H1 - 22;
          if (H1 < 12 || !n) return;

          const raw = W.buffer;
          g.fillStyle = "rgba(247,37,133,.9)";
          for (let i = 0, shown = 0; i < raw.length && shown < 200; i++) if (!Number.isFinite(raw[i])) { g.fillRect(Math.round(X + (i / n) * Wd), top, 1.5, H1); shown++; }

          g.strokeStyle = "rgba(247,223,30,.6)"; g.lineWidth = 1;

          const zy = top + H1 + 20;
          g.fillStyle = "#9b998f"; g.textBaseline = "bottom";
          g.fillText(`放大第 ${fmt(from)} 到 ${fmt(to)} 個樣本：方塊＝WAV 存下的值，黃線＝原始浮點值`, 8, zy - 3, w - 16);
          let mx = 0.02;

          g.fillStyle = "#0b0d11"; g.fillRect(X, zy, Wd, H2);

          for (let i = from; i < to; i++) {
            const x = X + (i - from) * cw, y = mid - src[i] * k;
            g.fillStyle = Number.isFinite(raw[i]) ? "rgba(76,201,240,.75)" : "#f72585";
            g.fillRect(x + 1, Math.min(y, mid), Math.max(1, cw - 2), Math.max(1, Math.abs(y - mid)));
          }

            if (!Number.isFinite(raw[i])) { pen = false; continue; }

        }
        function drawBars() {
          const { g, w, h: hh } = sizeCanvas(bcv, bbox);
          g.clearRect(0, 0, w, hh);

          for (const b of [8, 16]) for (const [r, t] of RATES) rows.push([`${b} 位元 ${t}`, 44 + Math.floor(n44 / Math.floor(44100 / r)) * (b / 8), "位元組", "#4cc9f0", b === bits && r === rate]);
          rows.push(["dataURI", W.dataURI.length, "字元", "#f72585", false]);
          g.font = `11px ${CJK}`; g.textBaseline = "middle"; g.fillStyle = "#9b998f";
          g.fillText("同一個音效的檔案大小（對數刻度）", 4, 9, w - 8);
          const lx = 78, x0 = lx + 4, x1 = w - 76, top = 24, rh = (hh - top - 16) / rows.length, L0 = 1, L1 = 6;
          const px = (v) => x0 + ((Math.log10(Math.max(10, v)) - L0) / (L1 - L0)) * (x1 - x0);
          for (let e = L0; e <= L1; e++) { g.fillStyle = "rgba(255,255,255,.07)"; g.fillRect(Math.round(px(10 ** e)), top, 1, rh * rows.length); }

            const y = top + k * rh + rh / 2, bh = Math.max(3, Math.min(12, rh - 6));
            g.font = `11px ${CJK}`; g.fillStyle = cur ? "#f7df1e" : "#d8d6cf"; g.fillText(name, 4, y, lx - 6);
            g.fillStyle = cur ? "#f7df1e" : col; g.fillRect(x0, y - bh / 2, px(v) - x0, bh);
            g.font = `10.5px ${MONO}`; g.fillStyle = "#9b998f";
            g.fillText(`${fmtCompact(v)} ${unit}`, px(v) + 4, y, w - px(v) - 6);
          });
          g.fillStyle = "#77756d"; g.font = `10px ${MONO}`; g.textAlign = "center";
          ["10", "100", "1k", "10k", "100k", "1M"].forEach((t, e) => g.fillText(t, px(10 ** (e + 1)), hh - 6));
          g.textAlign = "left";
        }
        watch(ctx, wbox, drawWav);
        watch(ctx, bbox, drawBars);
        regen();
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "ctx.bench・new SoundEffect(params).getRawBuffer() × N・sfxr.toWave(params) × N",
      desc: "每一輪先用 sfxr.generate() 準備 N 組隨機參數，再計時把它們全部合成成樣本（只算不播放），N 從 10 加到 2,000。右側是最新一輪前 40 個音效的波形牆，以及三種測試組合的耗時對數圖。",
      hint: "先選測試組合，再按「開始測試」",
      async mount(ctx) {
        const J = await boot(ctx);
        ctx.html(`<div class="jf-bv"><div class="jf-bvin"><canvas></canvas></div></div>`);
        const bx = ctx.$(".jf-bvin"), cv = bx.firstElementChild;
        const FAST = GENS.map((g, i) => i).filter((i) => !["synth", "tone", "random"].includes(GENS[i].a)), ALL = GENS.map((g, i) => i);
        const MODES = [
          { name: "快速 8 類", color: "#4cc9f0", pool: FAST, wave: false },
          { name: "全部 11 類", color: "#f72585", pool: ALL, wave: false },
          { name: "含 toWave 編碼", color: "#7bd389", pool: FAST, wave: true },
        ];
        const SIZES = [10, 20, 50, 100, 200, 500, 1000, 2000]; // x2.5 steps: a long-sound mix can cost 6 ms each, so a coarser ladder overshoots the 2 s budget by far
        let mode = 0, hist = [[], [], []], last = null, preview = [];
        const gen = (m, n) => Array.from({ length: n }, () => { const c = MODES[m].pool[Math.floor(Math.random() * MODES[m].pool.length)]; return { c, p: make(J, GENS[c].a) }; });
        const makePreview = () => { preview = gen(mode, 40).map((x) => ({ c: x.c, s: render(J, x.p).s })); };
        ctx.controls.classList.add("bottom");
        ctx.group(MODES.map((m) => m.name), 0, (i) => { mode = i; makePreview(); paint(); });
        ctx.bench({
          label: "音效數量", unit: "個", sizes: SIZES, target: 1000, budget: 2000,
          prepare: (n) => ({ mode, list: gen(mode, n) }),
          run(n, d) {
            const wave = MODES[d.mode].wave, raws = [], t0 = performance.now();
            let total = 0;
            for (let k = 0; k < n; k++) {
              const s = wave ? J.sfxr.toWave(d.list[k].p).buffer : new J.SoundEffect(d.list[k].p).getRawBuffer().normalized;
              total += s.length;
              if (k < 40) raws.push(s);
            }
            const ms = performance.now() - t0, H = hist[d.mode];
            hist = hist.map((x, j) => (j === d.mode ? [...(H.length && n <= H[H.length - 1].n ? [] : H), { n, ms, total }] : x));
            last = { n, ms, total, mode: d.mode, thumbs: raws.map((s, k) => ({ c: d.list[k].c, s: clean(s).s })) };
            ctx.timeout(paint, 0);
          },
          note: "只量合成，不含 generate() 準備參數與播放。sfxr 每個輸出樣本都跑 8 次超取樣，每次都算一遍波形、低通、高通與鑲邊，所以耗時和總樣本數成正比；「全部 11 類」多了合成器、純音、隨機三類長音效，一個就有 1 到 2 秒；「含 toWave 編碼」再加上 riffwave.js 用 Array.concat 組檔與 base64 編碼的成本。單輪超過 2 秒就停止加碼。",
        });
        function drawStats(g, X, Y, W) {
          const r = last, col = MODES[r ? r.mode : mode].color;
          const items = r
            ? [["每個音效", fmtMs(r.ms / r.n)], ["每秒合成樣本", fmtCompact(r.total / (r.ms / 1000))], ["比即時播放快", `×${fmt(r.total / SR / (r.ms / 1000))}`], ["一幀 16.7 ms 可合成", `${fmt(Math.floor(16.7 / (r.ms / r.n)))} 個`]]
            : [["每個音效", "…"], ["每秒合成樣本", "…"], ["比即時播放快", "…"], ["一幀 16.7 ms 可合成", "…"]];
          const cols = W >= 520 ? 4 : 2, bw = (W - (cols - 1) * 8) / cols, bh = 46;
          items.forEach(([k, v], i) => {
            const x = X + (i % cols) * (bw + 8), y = Y + Math.floor(i / cols) * (bh + 6);
            g.fillStyle = "rgba(255,255,255,.05)"; g.beginPath(); g.roundRect(x, y, bw, bh, 8); g.fill();
            g.textBaseline = "top"; g.fillStyle = "#9b998f"; g.font = `11px ${CJK}`; g.fillText(k, x + 10, y + 7, bw - 20);
            g.fillStyle = col; g.font = `700 17px ${MONO}`; g.fillText(v, x + 10, y + 22, bw - 20);
          });
          return Math.ceil(items.length / cols) * (bh + 6);
        }
        function drawWall(g, X, Y, W, H) {
          const th = last ? last.thumbs : preview;
          g.font = `11px ${CJK}`; g.fillStyle = "#9b998f"; g.textBaseline = "top";
          g.fillText(last ? `最新一輪（${fmt(last.n)} 個，${MODES[last.mode].name}）的前 ${th.length} 個` : `預覽：${MODES[mode].name}隨機 40 個`, X, Y, W);
          const top = Y + 18, HH = H - 18;
          if (!th.length || HH < 20) return;
          const cols = Math.max(4, Math.round(Math.sqrt((th.length * W) / HH))), rows = Math.ceil(th.length / cols), cw = W / cols, chh = HH / rows;
          th.forEach((t, k) => {
            const x = X + (k % cols) * cw, y = top + Math.floor(k / cols) * chh;
            g.fillStyle = "#0d1015"; g.fillRect(x + 1, y + 1, cw - 3, chh - 3);
            drawWave(g, t.s, x + 3, y + 3, cw - 7, chh - 7, { color: GENS[t.c].c });
          });
        }
        function drawChart(g, X, Y, W, H) {
          g.font = `11px ${CJK}`; g.textBaseline = "middle";
          let lx = X, ly = Y + 6;
          for (const m of MODES) {
            const tw = g.measureText(m.name).width + 24;
            if (lx + tw > X + W) { lx = X; ly += 16; }

            g.fillStyle = "#d8d6cf"; g.fillText(m.name, lx + 14, ly);

          }
          const top = ly + 14, all = hist.flat();

          const px = (n) => x0 + ((Math.log10(n) - Lx0) / (Lx1 - Lx0)) * (x1 - x0);
          const py = (ms) => y0 - ((Math.log10(Math.max(0.01, ms)) - lo) / (hi - lo)) * (y0 - y1);
          g.textAlign = "right";
          const every = Math.max(1, Math.ceil(14 / ((y0 - y1) / (hi - lo))));

            const y = py(10 ** e);
            g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(x0, Math.round(y), x1 - x0, 1);
            if ((e - lo) % every === 0) { g.fillStyle = "#77756d"; g.fillText(fmtMs(10 ** e), x0 - 6, y); }
          }
          g.textAlign = "center";
          SIZES.forEach((n, k) => { if (k % ((x1 - x0) / SIZES.length < 40 ? 2 : 1) === 0) { g.fillStyle = "#77756d"; g.fillText(fmtCompact(n), px(n), y0 + 11); } });
          g.textAlign = "left";
          for (const [ms, t] of [[1000, "1 秒"], [16.7, "一幀 16.7 ms"]]) {
            const y = py(ms);
            g.strokeStyle = "rgba(247,223,30,.45)"; g.setLineDash([5, 4]); g.lineWidth = 1;
            g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke(); g.setLineDash([]);
            g.fillStyle = "rgba(247,223,30,.8)"; g.fillText(t, x0 + 4, y - 8);
          }
          hist.forEach((H, j) => {
            if (!H.length) return;
            g.strokeStyle = MODES[j].color; g.fillStyle = MODES[j].color; g.lineWidth = 2;
            g.beginPath(); H.forEach((r, k) => (k ? g.lineTo(px(r.n), py(r.ms)) : g.moveTo(px(r.n), py(r.ms)))); g.stroke();
            for (const r of H) { g.beginPath(); g.arc(px(r.n), py(r.ms), 2.5, 0, Math.PI * 2); g.fill(); }
          });
        }
        function paint() {
          const { g, w: fullW, h: hh } = sizeCanvas(cv, bx);
          g.clearRect(0, 0, fullW, hh);
          // on mid-size stages the bench panel overlaps the left side; draw in the uncovered part
          const lab = ctx.$(".sc-lab");
          let ox = 0;
          if (lab && !lab.classList.contains("min")) {
            const cover = lab.getBoundingClientRect().right - bx.getBoundingClientRect().left + 8;
            if (cover > 0 && fullW - cover >= 230) ox = cover;

          g.save();
          g.translate(ox, 0);
          const w = fullW - ox, sh = drawStats(g, 12, 12, w - 24) + 18;
          if (w >= 560 && w > hh) {
            const ww = Math.round((w - 36) * 0.42);

            drawChart(g, ww + 30, sh, w - ww - 42, hh - sh - 8);

            drawChart(g, 12, sh, w - 24, hh - sh - 8); // too short for both: the chart matters more
          } else {
            const wallH = Math.max(70, Math.min(170, (hh - sh) * 0.38));
            drawWall(g, 12, sh, w - 24, wallH);
            drawChart(g, 12, sh + wallH + 12, w - 24, hh - sh - wallH - 20);
          }
          g.restore();
        }
        makePreview();
        watch(ctx, bx, paint);
        const lab = ctx.$(".sc-lab");
        if (lab) watch(ctx, lab, paint);
        paint();
      },
    },
  ],
});
