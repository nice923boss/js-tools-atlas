<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jsMind 示範：開一家咖啡店</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsmind@0.9.1/style/jsmind.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: #f7f4ec; }
  /* A fixed element has no offsetParent, which sends jsMind into a slower fallback; wrap it. */
  #wrap { position: fixed; inset: 0; }
  #jm { width: 100%; height: 100%;
    background: radial-gradient(circle, rgba(60,45,20,.10) 1px, transparent 1.3px) 0 0 / 20px 20px; }
  jmnodes jmnode { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; font-size: 14px; padding: 7px 12px; border-radius: 8px; box-shadow: 0 2px 6px rgba(40,30,10,.12); }
  jmnode.root { font-size: 20px; font-weight: 700; padding: 10px 18px; border-radius: 12px; }
  jmexpander { line-height: 10px; }
  .jsmind-inner { scrollbar-width: none; }
  .jsmind-inner::-webkit-scrollbar { display: none; }
  #theme b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
</style>
</head>
<body class="paper">
<div id="wrap"><div id="jm"></div></div>
<div class="controls">
  <button class="btn" id="theme"><b></b>配色：<span>海綠</span></button>
  <button class="btn" id="fold" aria-pressed="false">收合分支</button>
  <button class="btn" id="add">加子節點</button>
</div>
<div class="hint">點選節點・雙擊改字・拖曳節點換位置・拖曳空白處平移</div>

<script src="https://cdn.jsdelivr.net/npm/jsmind@0.9.1/es6/jsmind.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsmind@0.9.1/es6/jsmind.draggable-node.js"></script>
<script>
// jsMind ships 15 colour themes; cycle through a few that read well on paper.
const THEMES = [
  ["greensea", "海綠", "#1abc9c"], ["orange", "橘子", "#f39c12"], ["belizehole", "湛藍", "#2980b9"],
  ["wisteria", "紫藤", "#8e44ad"], ["pomegranate", "石榴", "#c0392b"], ["asphalt", "墨灰", "#34495e"],
];

const mind = {
  meta: { name: "coffee-shop", author: "demo", version: "1" },
  format: "node_tree",
  data: { id: "root", topic: "開一家咖啡店", children: [
    { id: "menu", topic: "菜單", direction: "right", children: [
      { id: "m1", topic: "招牌拿鐵" }, { id: "m2", topic: "手沖單品豆" },
      { id: "m3", topic: "季節甜點" }, { id: "m4", topic: "早午餐輕食" },
    ]},
    { id: "gear", topic: "設備", direction: "right", children: [
      { id: "g1", topic: "半自動咖啡機" }, { id: "g2", topic: "磨豆機" }, { id: "g3", topic: "製冰機" },
    ]},
    { id: "mkt", topic: "行銷", direction: "right", children: [
      { id: "k1", topic: "開幕買一送一" }, { id: "k2", topic: "IG 打卡牆" }, { id: "k3", topic: "集點卡" },
    ]},
    { id: "loc", topic: "選址", direction: "left", children: [
      { id: "l1", topic: "人流與租金" }, { id: "l2", topic: "鄰近學校與辦公室" }, { id: "l3", topic: "騎樓與停車" },
    ]},
    { id: "cash", topic: "資金（示意）", direction: "left", children: [
      { id: "c1", topic: "裝潢 80 萬" }, { id: "c2", topic: "設備 45 萬" }, { id: "c3", topic: "週轉金 6 個月" },
    ]},
    { id: "law", topic: "法規", direction: "left", children: [
      { id: "r1", topic: "營業登記" }, { id: "r2", topic: "食品業者登錄" }, { id: "r3", topic: "消防安檢" },
    ]},
  ]},
};

let themeIdx = 0;
let jm = null;
let sideMode = null;

// jsMind centres the map inside view.size; when zoomed out, grow that size so the
// shrunken map still sits in the middle of the frame instead of the top-left corner.
function patchView(view) {
  const expand = view.expand_size.bind(view);
  view.expand_size = function () {
    expand();
    this.size.w = Math.max(this.size.w, this.e_panel.clientWidth / this.zoom_current);
    this.size.h = Math.max(this.size.h, this.e_panel.clientHeight / this.zoom_current);
  };
}

// Portrait frames use "side" mode (all branches to the right), which is taller than wide.
function build() {
  const side = innerWidth < 640;
  if (jm && side === sideMode) return false;
  sideMode = side;
  document.getElementById("jm").replaceChildren();
  jm = new jsMind({
    container: "jm",
    editable: true,
    theme: THEMES[themeIdx][0],
    mode: side ? "side" : "full",
    view: {
      engine: "svg",
      hmargin: 40,
      vmargin: 30,
      line_width: 2,
      line_color: "#8a7f68",
      line_style: "curved",
      draggable: true,
      hide_scrollbars_when_draggable: true,
      node_overflow: "wrap",
      zoom: { min: 0.4, max: 2, step: 0.1 },
    },
    layout: { hspace: side ? 22 : 34, vspace: side ? 8 : 12, pspace: 14 },
  });
  patchView(jm.view);
  jm.show(mind);
  const fb = document.getElementById("fold");
  fb.setAttribute("aria-pressed", "false");
  fb.textContent = "收合分支";
  return true;
}

// Zoom so the whole map fits the frame (leaving room for the buttons), then centre the root.
function fit() {
  const view = jm.view;
  const b = jm.layout.bounds;
  const box = document.getElementById("jm").getBoundingClientRect();
  const z = Math.max(0.4, Math.min(1.25, (box.width - 24) / (b.e - b.w + 40), (box.height - 120) / (b.s - b.n + 20)));
  view.zoom_current = Math.round(z * 100) / 100;
  for (const el of view.e_panel.children) el.style.zoom = view.zoom_current;
  view.expand_size();
  view._show();
  jm.scroll_node_to_center(jm.get_root());
}
build();
fit();

let rz;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => { if (!build()) jm.resize(); fit(); }, 120);
});

const themeBtn = document.getElementById("theme");
function paintThemeBtn() {
  const [, label, color] = THEMES[themeIdx];
  themeBtn.querySelector("span").textContent = label;
  themeBtn.querySelector("b").style.background = color;
}
paintThemeBtn();
themeBtn.addEventListener("click", () => {
  themeIdx = (themeIdx + 1) % THEMES.length;
  jm.set_theme(THEMES[themeIdx][0]);
  paintThemeBtn();
});

const foldBtn = document.getElementById("fold");
foldBtn.addEventListener("click", () => {
  const folded = foldBtn.getAttribute("aria-pressed") !== "true";
  if (folded) jm.expand_to_depth(1); else jm.expand_all();
  foldBtn.setAttribute("aria-pressed", String(folded));
  foldBtn.textContent = folded ? "展開全部" : "收合分支";
  fit();
});

let seq = 0;
document.getElementById("add").addEventListener("click", () => {
  const parent = jm.get_selected_node() || jm.get_root();
  const id = `new${++seq}`;
  const node = jm.add_node(parent, id, `新點子 ${seq}`);
  if (node) {
    jm.select_node(id);
    jm.begin_edit(id);
  }
});
</script>
</body>
</html>
