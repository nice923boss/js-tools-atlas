// ---------- helpers ----------
// jsMind centres the map inside view.size; grow that size when zoomed out so a shrunken map stays centred.
function patchView(view) {
  const expand = view.expand_size.bind(view);
  view.expand_size = function () {
    expand();
    this.size.w = Math.max(this.size.w, this.e_panel.clientWidth / this.zoom_current);
    this.size.h = Math.max(this.size.h, this.e_panel.clientHeight / this.zoom_current);
  };
}

function makeMind(host, opts = {}, data) {
  host.replaceChildren();
  const { view = {}, layout = {}, ...rest } = opts;
  const jm = new jsMind({
    container: host, editable: false, theme: "greensea", log_level: "warn", ...rest,
    view: { engine: "svg", hmargin: 30, vmargin: 24, line_width: 2, line_color: "#8a7f68", line_style: "curved", draggable: true,
      hide_scrollbars_when_draggable: true, node_overflow: "wrap", zoom: { min: 0.2, max: 2, step: 0.1 }, ...view },
    layout: { hspace: 30, vspace: 12, pspace: 14, ...layout },
  });
  patchView(jm.view);
  if (data) jm.show(data);
  return jm;
}

function dropMind(jm) {
  if (!jm) return;
  jm.clear_event_listener();
  jm.view.container.replaceChildren();
}

// Zoom so the whole map fits its panel, then scroll the bounding box to the middle.
function fitMind(jm, { min = 0.25, max = 1.15, pad = 12 } = {}) {
  const view = jm.view, b = jm.layout.bounds, p = view.e_panel;
  const w = p.clientWidth, hh = p.clientHeight;
  if (!w || !hh || !b) return;
  // bounds.e / bounds.w already include the root; bounds.s is the full height of the taller side.
  const mw = b.e - b.w + 32, mh = b.s - b.n + 24;
  const z = Math.max(min, Math.min(max, (w - 2 * pad) / mw, (hh - 2 * pad) / mh));
  view.zoom_current = Math.round(z * 1000) / 1000;
  for (const el of p.children) el.style.zoom = view.zoom_current;
  view.expand_size();
  view._show();
  p.scrollLeft = (p.scrollWidth - w) / 2;
  p.scrollTop = (p.scrollHeight - hh) / 2;
}

// Resize callback for an inner element (ctx.onResize only watches the scene itself).
function onBox(ctx, el, fn) {
  let lw = el.clientWidth, lh = el.clientHeight, raf = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = el.clientWidth, hh = el.clientHeight;
      if (!w || !hh || (w === lw && hh === lh)) return;
      lw = w; lh = hh;
      fn(w, hh);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function compactJson(obj) {
  // Keep leaf objects on one line so the tree shape stays readable.
  return JSON.stringify(obj, null, 2).replace(/\{\n\s+([^{}[\]]*?)\n\s*\}/g, (m, body) => `{ ${body.replace(/,\n\s+/g, ", ")} }`);
}
function prettyXml(xml) {
  let depth = 0;
  return xml.replace(/></g, ">\n<").split("\n").map((line) => {
    if (line.startsWith("</")) depth--;
    const out = "  ".repeat(Math.max(0, depth)) + line;
    if (!line.startsWith("</") && !line.endsWith("/>") && !/<\/[^>]+>$/.test(line) && !line.startsWith("<?")) depth++;
    return out;
  }).join("\n");
}

const progressOf = (n) => n.children.length ? Math.round(n.children.reduce((s, c) => s + progressOf(c), 0) / n.children.length) : (+n.data.p || 0);

// Breadth-first tree: node i hangs under node floor((i - 1) / 6).
function bigMind(n, format = "node_tree") {
  const nodes = [{ id: "n0", topic: "根節點", children: [] }];
  for (let i = 1; i < n; i++) {
    const node = { id: `n${i}`, topic: `節點 ${i}`, children: [] };
    if (i <= 6) node.direction = i % 2 ? "right" : "left";
    nodes[Math.floor((i - 1) / 6)].children.push(node);
    nodes.push(node);
  }
  const meta = { name: "stress" };
  if (format === "node_array") {
    return { meta, format, data: nodes.map((x, i) => i ? { id: x.id, parentid: `n${Math.floor((i - 1) / 6)}`, topic: x.topic, ...(x.direction ? { direction: x.direction } : {}) }
      : { id: "n0", isroot: true, topic: x.topic }) };
  }
  return { meta, format: "node_tree", data: nodes[0] };
}

    hint: "截圖後先預覽，按「下載 PNG」才會存檔",
    mount(ctx) {
      ctx.html(`<div class="jm-fill"><div class="jm-box jm-render"></div></div>`);
      const box = ctx.$(".jm-box");
      const render = (jmi, ele, node) => {
        if (node.isroot) return false;
        const p = progressOf(node), phase = node.children.length > 0, d = node.data;
        const sub = phase ? `${node.children.length} 項工作` : `${d.owner}・${d.due} 截止`;
        ele.innerHTML = `<div class="jm-task${phase ? " phase" : ""}${p >= 100 ? " done" : ""}"><b>${esc(node.topic)}</b><small>${esc(sub)}</small>` +
          `<span class="jm-bar"><i style="width:${p}%"></i></span><em>${p}%</em></div>`;
        return true;
      };
      const jm = makeMind(box, { editable: true, theme: null, view: { custom_node_render: render, expander_style: "number", line_color: "#a59b85", enable_device_pixel_ratio: true },
        layout: { hspace: 32, vspace: 10, pspace: 16 } }, siteTree());
      ctx.onCleanup(() => dropMind(jm));
      const fit = () => fitMind(jm, { min: 0.3, max: 1.1 });
      fit();
      onBox(ctx, box, () => { jm.resize(); fit(); });

      // update_node() with an unchanged topic re-runs the renderer without a relayout.
      const rerender = (node) => { for (let x = node; x && !x.isroot; x = x.parent) jm.update_node(x.id, x.topic); };
      const advance = () => {
        if (jm.view.is_editing()) return;
        const open = [];
        const collect = (n) => { if (!n.children.length && !n.isroot && (+n.data.p || 0) < 100) open.push(n); n.children.forEach(collect); };
        collect(jm.get_root());
        if (!open.length) { jm.show(siteTree()); fit(); return; }
        open.sort((a, b) => a.data.due.localeCompare(b.data.due));
        for (const n of open.slice(0, 2)) {
          n.data.p = Math.min(100, (+n.data.p || 0) + 10 + Math.round(Math.random() * 20));
          rerender(n);
        }
      };
      let auto = true;
      ctx.interval(() => { if (auto) advance(); }, 1200);
      ctx.toggle("自動推進", true, (v) => { auto = v; });
      ctx.button("推進一步", advance);

      let preview = null;
      const closePreview = () => { preview?.remove(); preview = null; };
      ctx.onCleanup(closePreview);
      ctx.button("截圖 PNG", async () => {
        closePreview();
        const st = ctx.status("載入 dom-to-image 與截圖外掛…");
        let canvas = null, shot = null;
        try {
          await ctx.load(CDN + "dom-to-image@2.6.0/dist/dom-to-image.min.js");
          await ctx.load(CDN + "jsmind@0.9.1/es6/jsmind.screenshot.js");
          st.text("合成連線與節點…");
          shot = new jsMindScreenshot.JmScreenshot(jm, { watermark: { left: "jsMind 0.9.1・jsmind.screenshot", right: "" }, background: "#fffdf8" });
          // Same steps as shoot(), but without its automatic download.
          canvas = shot.create_canvas();
          const g = canvas.getContext("2d");
          g.scale(shot.dpr, shot.dpr);
          await shot.draw_background(g);
          await shot.draw_lines(g);
          await shot.draw_nodes(g);
          shot.draw_watermark(canvas, g);
          const url = canvas.toDataURL("image/png");
          if (!ctx.active) return;
          const w = canvas.width, hh = canvas.height;
          preview = h("div", { class: "jm-shot" },
            h("img", { src: url, alt: "jsMind 截圖預覽" }),
            h("footer", {}, h("span", {}, "PNG ", h("code", { text: `${w} × ${hh}` }), `・約 ${fmt(Math.round(url.length * 0.75 / 1024))} KB`),
              h("a", { class: "btn primary", href: url, download: "web-revamp.png" }, "下載 PNG")));
          const close = h("button", { class: "btn", type: "button" }, "關閉");
          close.addEventListener("click", closePreview);
          preview.querySelector("footer").append(close);
          ctx.el.append(preview);
          st.done();
        } catch (e) {
          if (ctx.active) st.error(`截圖失敗：${e?.message || e}`);
        } finally {
          if (canvas?.parentNode) canvas.remove();
        }
      }, { primary: true });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "show() 載入 N 個節點・add_node() 觸發整張重排",
    desc: "jsMind 沒有虛擬化，每個節點都是一個 DOM 元素。逐步加大節點數，量測 show() 載入（解析、建立 DOM、量測尺寸、排版、畫連線）、一次 add_node() 引發的整張重排，以及瀏覽器第一次繪製。",
    hint: "可以切換連線引擎與資料格式後重新測試",
    mount(ctx) {
      ctx.html(`<div class="jm-stress"><div class="jm-box"></div><div class="jm-badge"></div></div>`);
      ctx.controls.classList.add("bottom");
      const box = ctx.$(".jm-box"), badge = ctx.$(".jm-badge");
      let engine = "svg", format = "node_tree", jm = null, shown = 0;
      // Stop at 30%: zooming out further only widens the centred scroll area, and with it the canvas line layer.
      const fit = () => fitMind(jm, { min: 0.3, max: 1, pad: 6 });
      // The canvas engine paints every line onto one canvas as large as the whole map. Past the browser's
      // canvas size limit nothing is drawn and nothing is reported, so sample a band through the root.
      const linesDrawn = () => {
        const cv = jm.view.graph.element();
        if (!(cv instanceof HTMLCanvasElement)) return true;
        const r = jm.get_root()._data.view;
        const y = Math.max(0, Math.round(r.abs_y + r.height / 2) - 20);
        const d = cv.getContext("2d").getImageData(0, y, cv.width, 40).data;
        for (let i = 3; i < d.length; i += 4) if (d[i]) return true;
        return false;
      };
      const paint = () => {
        const cv = jm.view.graph.element();
        const layer = cv instanceof HTMLCanvasElement ? `・連線 canvas <b>${fmt(cv.width)}×${fmt(cv.height)}</b>${linesDrawn() ? "" : "（未繪出）"}` : "";
        badge.innerHTML = `<b>${fmt(shown)}</b> 個節點・${engine.toUpperCase()}・${format}・縮放 <b>${Math.round(jm.view.zoom_current * 100)}%</b>${layer}`;
      };
      const build = () => {
        dropMind(jm);
        jm = makeMind(box, { editable: true, theme: "greensea", shortcut: { enable: false },
          view: { engine, line_width: 1, hmargin: 20, vmargin: 20, zoom: { min: 0.1, max: 2, step: 0.1 } },
          layout: { hspace: 24, vspace: 3, pspace: 10 } }, bigMind(300, format));
        shown = 300;
        fit(); paint();
      };
      build();
      ctx.onCleanup(() => dropMind(jm));
      onBox(ctx, box, () => { jm.resize(); fit(); paint(); });
      ctx.group(["SVG 連線", "Canvas 連線"], 0, (i) => { engine = i ? "canvas" : "svg"; build(); });
      ctx.group(["node_tree", "node_array"], 0, (i) => { format = i ? "node_array" : "node_tree"; build(); });
      ctx.bench({
        label: "節點", sizes: [200, 500, 1000, 2000, 5000, 10000, 20000], target: 1000, budget: 3000,
        prepare(n) {
          // Swap in a tiny map first so tearing down the previous size is not timed.
          jm.show(bigMind(20, format));
          return bigMind(n, format);
        },
        async run(n, data) {
          const t0 = performance.now();
          jm.show(data);
          const t1 = performance.now();
          jm.add_node("n1", "probe", "新增節點");
          const t2 = performance.now();
          fit();
          await ctx.frame(2);
          shown = n + 1;
          paint();
          return `載入 ${fmtMs(t1 - t0)}・重排 ${fmtMs(t2 - t1)}${linesDrawn() ? "" : "・連線未繪出"}`;
        },
        note: "每格 = show() 載入 + 一次 add_node() 重排 + 兩個畫格的繪製，單次超過 3 秒就停止；add_node() 每次都重排整張圖、重畫所有連線。Canvas 連線把線全畫在一張與整張圖同大的 canvas 上，超過瀏覽器畫布上限就整層空白且不報錯（實測 Chromium：5 千節點、畫布高約 5.7 萬 px 可畫；1 萬節點、約 11.4 萬 px 畫不出來），結果列會標「連線未繪出」。node_array 要先把扁平陣列逐層組回樹，載入比 node_tree 稍慢。",
      });
    },
  },
] });
</script>
</body>
</html>
