<style>
  .jx-board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) 270px; min-height: 0; }
  .jx-card { position: relative; min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; color: var(--fg); }
  .jx-box.jxgbox { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; border-radius: 10px; background: transparent; }
  .jx-box .JXGtext { font-family: var(--font); }
  .jx-box .jx-lv { font-weight: 700; font-size: 17px; }
  .jx-side { display: flex; flex-direction: column; overflow: auto; padding: 12px 14px; gap: 10px; }
  .jx-side h3 { margin: 0; font: 600 12px/1.4 var(--font); color: var(--muted); letter-spacing: .04em; }
  .jx-dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 10px; margin: 0; font-size: 12.5px; }
  .jx-dl dt { color: var(--muted); white-space: nowrap; }
  .jx-dl dd { margin: 0; font: 12px/1.5 var(--mono); text-align: right; overflow-wrap: anywhere; }
  .jx-dl dd.jx-t { font-family: var(--font); }
  .jx-ok { color: var(--c4); }
  .jx-big { font-size: 15px; font-weight: 700; color: var(--c1); }
  .jx-note { margin: 0; font-size: 12px; line-height: 1.65; color: var(--muted); }
  .jx-spark { width: 100%; height: 90px; display: block; border: 1px solid var(--line); border-radius: 8px; }
  .jx-spark polyline { fill: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; }
  .jx-spark line { stroke: var(--c3); stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
  /* scene 1 toggles */
  .jx-tg { display: flex; flex-direction: column; gap: 2px; }
  .jx-tgl { appearance: none; display: grid; grid-template-columns: 12px auto 1fr; align-items: center; gap: 8px; width: 100%; padding: 5px 8px; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--muted); font: 500 13px/1.3 var(--font); text-align: left; cursor: pointer; }
  .jx-tgl:hover { border-color: var(--line); }
  .jx-tgl i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--k); }

  .jx-tgl[aria-pressed="true"] i { background: var(--k); }

    .jx-board { grid-template-columns: minmax(0, 1fr) 210px; }
    .jx-side { padding: 8px 10px; gap: 6px; }
    .jx-tgl { padding: 3px 6px; grid-template-columns: 10px auto; }
    .jx-tgl small { display: none; }
  }
  @media (max-width: 760px) and (orientation: portrait) {
    .jx-board { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .jx-side { max-height: 34vh; padding: 8px 12px; gap: 6px; }
    .jx-side .jx-note, .jx-side h3 { display: none; }
    .jx-dl { grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 3px 8px; font-size: 11.5px; }
    .jx-dl dd { font-size: 11px; }
    .jx-tg { flex-direction: row; overflow-x: auto; scrollbar-width: none; gap: 6px; flex: none; }
    .jx-tgl { width: auto; flex: none; grid-template-columns: 10px auto; padding: 4px 9px; border-color: var(--line); border-radius: 999px; font-size: 12px; }
    .jx-tgl small { display: none; }
    .jx-spark { height: 50px; }
  }
  @media (max-height: 480px) { .jx-side .jx-note { display: none; } .jx-spark { height: 50px; } }
  /* scene 8 */
  .jx-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; }
  @media (max-width: 760px) { .jx-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 8px; opacity: .6; } }

<body>
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.13.3/distrib/jsxgraphcore.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// JSXGraph showcase: dependent geometry, sliders, calculus, curves, 3D, input handling and an FPS ramp.
const PI = Math.PI;
const f2 = (x) => (Number.isFinite(x) ? x.toFixed(2) : "∞");

// Read the current theme tokens and push them into JSXGraph's global defaults.
function theme() {
  const cs = getComputedStyle(document.body);
  const v = (k) => cs.getPropertyValue(k).trim();
  const P = { fg: v("--fg"), muted: v("--muted"), line: v("--line"), bg: v("--bg"), c1: v("--c1"), c2: v("--c2"), c3: v("--c3"), c4: v("--c4"), c5: v("--c5"), c6: v("--c6") };
  JXG.Options.text.strokeColor = P.fg;
  JXG.Options.label.strokeColor = P.fg;
  JXG.Options.axis.strokeColor = P.muted;
  JXG.Options.axis.highlightStrokeColor = P.muted;
  JXG.Options.ticks.strokeColor = P.muted;
  JXG.Options.ticks.strokeOpacity = 0.35;
  return P;
}
// Same color when hovered, so highlight does not flash the default palette.
const same = (o) => ({ ...o, highlightStrokeColor: o.strokeColor, highlightFillColor: o.fillColor, highlightStrokeOpacity: o.strokeOpacity ?? 1, highlightFillOpacity: o.fillOpacity ?? 1 });

// Create a board inside .jx-box, keep it sized to its card, free it on unmount.
function makeBoard(ctx, box, { bbox, keep = false, axis = false, fitBox, ...attrs }) {
  const board = JXG.JSXGraph.initBoard(box, {
    boundingbox: bbox, keepaspectratio: keep, axis, showCopyright: false, showNavigation: false, showInfobox: false,
    pan: { enabled: false }, zoom: { enabled: false }, resize: { enabled: false }, ...attrs,
  });
  const fit = () => {
    const w = box.clientWidth, h = box.clientHeight;
    if (!w || !h) return;
    board.resizeContainer(w, h, true, true);
    board.setBoundingBox(fitBox ? fitBox() : bbox, keep);
    board.fullUpdate();
  };
  const ro = new ResizeObserver(() => ctx.active && fit());
  ro.observe(box);
  ctx.onCleanup(() => { ro.disconnect(); JXG.JSXGraph.freeBoard(board); });
  return { board, fit };
}
const layout = (ctx, side) => {
  ctx.html(`<div class="jx-board"><div class="jx-card"><div class="jx-box jxgbox"></div></div><aside class="jx-card jx-side">${side}</aside></div>`);
  return ctx.$(".jx-box");
};
const dl = (rows) => rows.map(([k, v, t]) => `<dt>${k}</dt><dd${t ? ' class="jx-t"' : ""}>${v}</dd>`).join("");
// log-scale sparkline of |error| for n = 1..N
function spark(svg, values, color) {
  const lg = values.map((v) => Math.log10(Math.max(Math.abs(v), 1e-12)));
  const lo = Math.min(...lg), hi = Math.max(...lg), span = hi - lo || 1;
  const pts = lg.map((v, i) => `${(i / (lg.length - 1)) * 100},${4 + (1 - (v - lo) / span) * 52}`).join(" ");
  svg.innerHTML = `<polyline points="${pts}" stroke="${color}"></polyline>`;
}

Showcase.run({ scenes: [
  {
    id: "centers", title: "三角形的心",
    api: "board.create('circumcenter' | 'incenter' | 'perpendicular' | 'glider' | 'tangent', …)",
    desc: "所有作圖都宣告成相依元素：拖曳頂點，外心、內心、重心、垂心、歐拉線、九點圓與切線全部即時重算，右側同步驗證 OI² = R(R−2r) 與 OG : GH = 1 : 2。",
    hint: "拖曳頂點 A、B、C 或圓上的 P・切換左側各組作圖",
    mount(ctx) {
      const K = theme();
      const box = layout(ctx, `<div class="jx-tg"></div><div><div class="jx-big"></div></div><dl class="jx-dl"></dl>`);
      const START = { A: [-3.4, -1.9], B: [3.8, -1.9], C: [0.7, 3.0] };
      let O, circ, H;
      const { board, fit } = makeBoard(ctx, box, { bbox: [-6, 6, 6, -6], keep: true, fitBox: () => {
        const xs = [H.X(), O.X() - circ.Radius(), O.X() + circ.Radius()], ys = [H.Y(), O.Y() - circ.Radius(), O.Y() + circ.Radius()];
        const pad = 0.16 * (Math.max(...xs) - Math.min(...xs) + Math.max(...ys) - Math.min(...ys)) / 2 + 0.5;
        return [Math.min(...xs) - pad, Math.max(...ys) + pad, Math.max(...xs) + pad, Math.min(...ys) - pad];
      } });
      const vertex = (name, xy, off) => board.create("point", xy, same({ name, size: 7, face: "o", fillColor: K.c1, strokeColor: K.bg, strokeWidth: 2,
        label: { offset: off, cssClass: "JXGtext jx-lv", highlightCssClass: "JXGtext jx-lv", strokeColor: K.c1 } }));
      const center = (type, parents, name, color, extra = {}) => board.create(type, parents, same({ name, size: 4, face: "o", fillColor: color, strokeColor: K.bg, strokeWidth: 1.5, fixed: true,
        label: { offset: [7, 9], strokeColor: color, fontSize: 14 }, ...extra }));
      const aux = (color) => same({ strokeColor: color, strokeWidth: 1, strokeOpacity: 0.38, dash: 2, fixed: true });
      const curve = (color, w = 2, dash = 0) => same({ strokeColor: color, strokeWidth: w, dash, fillColor: "none", fixed: true });
      const A = vertex("A", START.A, [-20, -16]), B = vertex("B", START.B, [10, -16]), C = vertex("C", START.C, [-5, 20]);
      const tri = board.create("polygon", [A, B, C], same({ fillColor: K.c1, fillOpacity: 0.06, hasInnerPoints: false, borders: same({ strokeColor: K.fg, strokeWidth: 2, strokeOpacity: 0.9 }) }));
      const [AB, BC, CA] = tri.borders;
      const angOpt = (name) => same({ name, radius: 0.6, fillColor: K.c1, fillOpacity: 0.16, strokeColor: K.c1, strokeOpacity: 0.55, fixed: true, label: { fontSize: 13, strokeColor: K.c1 } });
      const angs = [[B, A, C, "α"], [C, B, A, "β"], [A, C, B, "γ"]].map(([p, q, r, n]) => board.create("nonreflexangle", [p, q, r], angOpt(n)));
      const midOpt = same({ size: 2.5, fillColor: K.c6, strokeColor: K.c6, fixed: true, withLabel: false });
      const Mab = board.create("midpoint", [A, B], midOpt), Mbc = board.create("midpoint", [B, C], midOpt), Mca = board.create("midpoint", [C, A], midOpt);
      O = center("circumcenter", [A, B, C], "O", K.c2);
      circ = board.create("circle", [O, A], curve(K.c2, 2.2));
      const pbs = [[AB, Mab], [BC, Mbc], [CA, Mca]].map((p) => board.create("perpendicular", p, aux(K.c2)));
      const I = center("incenter", [A, B, C], "I", K.c4);
      const inr = () => (2 * tri.Area()) / tri.Perimeter();
      const incirc = board.create("circle", [I, inr], curve(K.c4, 2));
      const abs = [[B, A, C], [C, B, A], [A, C, B]].map((p) => board.create("bisector", p, aux(K.c4)));
      const G = center("point", [() => (A.X() + B.X() + C.X()) / 3, () => (A.Y() + B.Y() + C.Y()) / 3], "G", K.c5);
      const meds = [[A, Mbc], [B, Mca], [C, Mab]].map((p) => board.create("segment", p, aux(K.c5)));
      H = center("point", [() => A.X() + B.X() + C.X() - 2 * O.X(), () => A.Y() + B.Y() + C.Y() - 2 * O.Y()], "H", K.c3);
      const alts = [[BC, A], [CA, B], [AB, C]].map((p) => board.create("perpendicular", p, aux(K.c3)));
      const feet = [[A, BC], [B, CA], [C, AB]].map((p) => board.create("orthogonalprojection", p, midOpt));
      const euler = board.create("line", [O, H], same({ strokeColor: K.c6, strokeWidth: 2.5, strokeOpacity: 0.85, fixed: true }));
      const N = center("midpoint", [O, H], "N", K.c6, { size: 3 });
      const nine = board.create("circumcircle", [Mab, Mbc, Mca], { ...curve(K.c6, 1.6, 3), center: { visible: false, withLabel: false } });
      const P = board.create("glider", [O.X() + 3, O.Y() + 3, circ], same({ name: "P", size: 5, face: "o", fillColor: K.fg, strokeColor: K.c2, strokeWidth: 2, label: { offset: [8, 10], strokeColor: K.fg, fontSize: 14 } }));
      const tangent = board.create("tangent", [P], same({ strokeColor: K.fg, strokeWidth: 1.6, strokeOpacity: 0.8, fixed: true }));
      const OP = board.create("segment", [O, P], aux(K.fg));
      const Q = board.create("point", [() => P.X() - (P.Y() - O.Y()), () => P.Y() + (P.X() - O.X())], { visible: false, withLabel: false });
      const right = board.create("nonreflexangle", [O, P, Q], same({ name: "", radius: 0.32, orthoType: "square", fillColor: K.fg, fillOpacity: 0.15, strokeColor: K.fg, strokeOpacity: 0.7, fixed: true, withLabel: false }));
      const GROUPS = [
        { key: "circ", name: "外心 O・外接圓", note: "中垂線交點", color: K.c2, on: true, main: [O, circ], aux: pbs },
        { key: "inc", name: "內心 I・內切圓", note: "角平分線交點", color: K.c4, on: false, main: [I, incirc], aux: abs },
        { key: "cen", name: "重心 G", note: "中線交點", color: K.c5, on: true, main: [G], aux: meds },
        { key: "ort", name: "垂心 H", note: "三高交點", color: K.c3, on: true, main: [H], aux: alts },
        { key: "eul", name: "歐拉線", note: "O、G、H 共線", color: K.c6, on: true, main: [euler], aux: [] },
        { key: "nin", name: "九點圓", note: "中點與垂足共圓", color: K.c6, on: false, main: [nine, N, Mab, Mbc, Mca, ...feet], aux: [] },
        { key: "tan", name: "切線", note: "切線垂直半徑", color: K.fg, on: true, main: [P, tangent, OP, right], aux: [] },
        { key: "aux", name: "輔助線", note: "作圖過程", color: K.muted, on: true, main: [], aux: [] },
      ];
      const state = Object.fromEntries(GROUPS.map((g) => [g.key, g.on]));
      const apply = () => {
        for (const g of GROUPS) {
          g.main.forEach((el) => el.setAttribute({ visible: state[g.key] }));
          g.aux.forEach((el) => el.setAttribute({ visible: state[g.key] && state.aux }));
        }
        board.update();
      };
      const tg = ctx.$(".jx-tg");
      for (const g of GROUPS) {
        const b = Showcase.h("button", { class: "jx-tgl", type: "button", "aria-pressed": String(g.on) });
        b.style.setProperty("--k", g.color);
        b.innerHTML = `<i></i><span>${g.name}</span><small>${g.note}</small>`;
        b.addEventListener("click", () => { state[g.key] = !state[g.key]; b.setAttribute("aria-pressed", state[g.key]); apply(); });
        tg.append(b);
      }
      const place = (pts) => { A.moveTo(pts.A); B.moveTo(pts.B); C.moveTo(pts.C); P.moveTo([O.X() + 0.7 * circ.Radius(), O.Y() + 0.7 * circ.Radius()]); fit(); };
      ctx.button("鈍角範例", () => place({ A: [-3.6, -1.2], B: [3.6, -1.2], C: [-1.6, 1.0] }));
      ctx.button("重設", () => place(START));
      const big = ctx.$(".jx-big"), stats = ctx.$(".jx-dl");
      const deg = (el) => (el.Value() * 180) / PI;
      board.on("update", () => {
        const a = angs.map(deg), mx = Math.max(...a);
        const sides = [B.Dist(C), C.Dist(A), A.Dist(B)].sort((x, y) => x - y);
        const eq = (x, y) => Math.abs(x - y) < 0.02 * sides[2];
        let type = mx > 90.5 ? "鈍角三角形" : mx > 89.5 ? "直角三角形" : "銳角三角形";
        if (eq(sides[0], sides[2])) type = "正三角形"; else if (eq(sides[0], sides[1]) || eq(sides[1], sides[2])) type = "等腰" + type;
        const R = O.Dist(A), r = inr(), og = O.Dist(G), gh = G.Dist(H);
        big.textContent = `${type}・內角和 ${(a[0] + a[1] + a[2]).toFixed(1)}°`;
        stats.innerHTML = dl([["∠A ∠B ∠C", a.map((x) => x.toFixed(1) + "°").join(" ")], ["面積", f2(tri.Area())], ["周長", f2(tri.Perimeter())],
          ["外接圓 R", f2(R)], ["內切圓 r", f2(r)], ["OI² ／ R(R−2r)", `${f2(O.Dist(I) ** 2)} ／ ${f2(R * (R - 2 * r))} <span class="jx-ok">✓</span>`],
          ["OG : GH", og < 1e-6 ? "三心重合" : `1 : ${(gh / og).toFixed(2)} <span class="jx-ok">✓</span>`]]);
      });
      P.moveTo([O.X() + 0.7 * circ.Radius(), O.Y() + 0.7 * circ.Radius()]);
      apply();
      fit();
    },
  },
  {
    id: "sliders", title: "函數與滑桿",
    api: "board.create('slider', …)・functiongraph((x) => a.Value() * …)",
    desc: "f(x) = a·sin(bx + c) + d 的四個參數都是 JSXGraph 內建滑桿，函數圖形、週期標尺、振幅標記與板上公式文字都以函數形式相依於滑桿，拖動任何一個即時重繪。",
    hint: "拖曳板上 a、b、c、d 滑桿・打開「相位動畫」讓 c 自動轉動",
    mount(ctx) {
      const K = theme();
      const box = layout(ctx, `<h3>目前參數</h3><dl class="jx-dl"></dl><p class="jx-note">板上的滑桿、曲線、標尺、文字都是同一張相依圖的節點；改一個值，JSXGraph 只重算受影響的元素。</p>`);
      const { board } = makeBoard(ctx, box, { bbox: [-7.5, 5.5, 7.5, -4.5], axis: true });
      const sl = (y, name, min, val, max, color) => board.create("slider", [[-7, y], [-3, y], [min, val, max]], { name, snapWidth: 0.05, precision: 2, fillColor: color, strokeColor: color, baseline: { strokeColor: K.muted }, highline: { strokeColor: color }, label: { strokeColor: K.fg, fontSize: 13 } });
      const a = sl(4.8, "a", -3, 2, 3, K.c1), b = sl(4.2, "b", 0.2, 1, 3, K.c2), c = sl(3.6, "c", -PI, 0, PI, K.c5), d = sl(3.0, "d", -2, 0, 2, K.c4);
      const f = (x) => a.Value() * Math.sin(b.Value() * x + c.Value()) + d.Value();
      const ref = board.create("functiongraph", [Math.sin], same({ strokeColor: K.muted, strokeWidth: 1.5, dash: 2, fixed: true }));
      board.create("functiongraph", [f], same({ strokeColor: K.c1, strokeWidth: 3, fixed: true }));
      board.create("line", [[0, () => d.Value()], [1, () => d.Value()]], same({ strokeColor: K.c4, strokeWidth: 1, dash: 3, fixed: true }));
      // one period, starting where the argument bx + c is 0
      const x0 = () => -c.Value() / b.Value(), T = () => (2 * PI) / b.Value();
      const p1 = board.create("point", [x0, () => d.Value()], same({ size: 3, fillColor: K.c2, strokeColor: K.c2, fixed: true, name: "" }));
      const p2 = board.create("point", [() => x0() + T(), () => d.Value()], same({ size: 3, fillColor: K.c2, strokeColor: K.c2, fixed: true, name: "" }));
      board.create("segment", [p1, p2], same({ strokeColor: K.c2, strokeWidth: 3, fixed: true, lastArrow: false }));
      board.create("text", [() => x0() + T() / 2, () => d.Value() - 0.6, "週期 T"], { anchorX: "middle", strokeColor: K.c2, fontSize: 13, fixed: true });
      const top = board.create("point", [() => x0() + T() / 4, () => d.Value() + a.Value()], same({ size: 4, fillColor: K.c1, strokeColor: K.bg, fixed: true, name: "" }));
      board.create("segment", [[() => x0() + T() / 4, () => d.Value()], top], same({ strokeColor: K.c3, strokeWidth: 2, fixed: true, lastArrow: true }));
      board.create("text", [7.3, -4.2, () => `f(x) = ${a.Value().toFixed(2)}·sin(${b.Value().toFixed(2)}x ${c.Value() < 0 ? "−" : "+"} ${Math.abs(c.Value()).toFixed(2)}) ${d.Value() < 0 ? "−" : "+"} ${Math.abs(d.Value()).toFixed(2)}`], { fontSize: 15, anchorX: "right", strokeColor: K.fg, fixed: true });
      const stats = ctx.$(".jx-dl");
      board.on("update", () => {
        const A = Math.abs(a.Value()), D = d.Value();
        stats.innerHTML = dl([["振幅 |a|", f2(A)], ["週期 2π/b", f2(T())], ["相位移 −c/b", f2(x0())], ["中線 y", f2(D)], ["值域", `[${f2(D - A)}, ${f2(D + A)}]`]]);
      });
      let anim = false;
      ctx.toggle("sin x 參考", true, (v) => { ref.setAttribute({ visible: v }); board.update(); });
      ctx.toggle("相位動畫", false, (v) => (anim = v));
      ctx.button("重設", () => { a.setValue(2); b.setValue(1); c.setValue(0); d.setValue(0); board.update(); });
      ctx.raf((t, dt) => { if (!anim) return; let v = c.Value() + dt * 0.0015; if (v > PI) v -= 2 * PI; c.setValue(v); board.update(); });
      board.update();

        board.setBoundingBox([-r, r, r, -r], true);
        board.unsuspendUpdate();
      }
      function build() {
        if (board) JXG.JSXGraph.freeBoard(board);
        els = [];
        board = JXG.JSXGraph.initBoard(box, { boundingbox: [-7, 7, 7, -7], keepaspectratio: true, renderer, showCopyright: false, showNavigation: false, showInfobox: false, pan: { enabled: false }, zoom: { enabled: false } });
        resize(n);
      }
      ctx.onCleanup(() => board && JXG.JSXGraph.freeBoard(board));
      ctx.onResize(() => board && board.resizeContainer(box.clientWidth, box.clientHeight));
      ctx.controls.classList.add("bottom");
      ctx.select("渲染器", [{ value: "svg", label: "SVG" }, { value: "canvas", label: "Canvas" }], renderer, (v) => { renderer = v; build(); });
      build();
      ctx.raf((now, dt) => { t += dt / 1000; board.update(); });
      ctx.ramp({
        label: "相依點", unit: "點", steps: [50, 100, 250, 500, 1000, 2000, 4000, 8000], minFps: 30,
        note: "每一格都把 t 往前推並呼叫 board.update()；每個點有自己的座標函數，所以重算量與點數成正比。SVG 每點一個 DOM 節點，Canvas 每格整張重畫。",
        apply(v) { n = v; resize(v); },
        metrics: () => ({ 渲染器: renderer === "svg" ? "SVG" : "Canvas", "板上物件": board ? board.objectsList.length : 0 }),
      });
    },
  },
] });
</script>
