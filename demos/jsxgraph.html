<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSXGraph 示範：三角形的心與歐拉線</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.13.3/distrib/jsxgraph.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app {
    position: fixed; inset: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 272px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "board tg" "board st";
  }
  #box {
    grid-area: board; width: 100%; height: 100%; margin: 0; border: 0; border-radius: 0;
    background: radial-gradient(circle at 50% 45%, #1b2028 0%, var(--bg) 75%);
    background-color: var(--bg);
  }
  .tg { grid-area: tg; display: flex; flex-direction: column; gap: 2px; padding: 12px 12px 8px; background: var(--bg-2); border-left: 1px solid var(--line); }
  .tg h1 { margin: 0 0 6px; font-size: 14px; letter-spacing: .02em; }
  .tg h1 small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
  .tgl {
    appearance: none; display: grid; grid-template-columns: 12px auto 1fr; align-items: center; gap: 8px; width: 100%;
    padding: 5px 8px; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--muted);
    font: 500 13px/1.3 var(--font); text-align: left; cursor: pointer;
  }
  .tgl:hover { border-color: var(--line); }
  .tgl i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--k); }
  .tgl small { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tgl[aria-pressed="true"] { color: var(--fg); background: rgba(255, 255, 255, .05); }
  .tgl[aria-pressed="true"] i { background: var(--k); }
  .tg .row { display: flex; gap: 6px; margin-top: 6px; }
  .tg .row .btn { flex: 1; padding: 6px 8px; font-size: 12px; white-space: nowrap; }
  .st { grid-area: st; min-height: 0; overflow: auto; padding: 10px 14px 14px; background: var(--bg-2); border-left: 1px solid var(--line); border-top: 1px solid var(--line); scrollbar-width: thin; }
  .st .type { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .st .type b { font-size: 14px; color: var(--c1); }
  .st .type span { font-size: 11px; color: var(--muted); }
  .st dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12.5px; }
  .st dt { color: var(--muted); white-space: nowrap; }
  .st dd { margin: 0; font-family: var(--mono); font-size: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st dd .ok { color: var(--c4); }
  .jxgbox .JXGtext { font-family: var(--font); font-weight: 700; }
  .jxgbox .lbl-v { font-size: 17px; }
  @media (max-width: 700px) {
    .app {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas: "tg" "board" "st";
      padding-bottom: 40px; background: var(--bg-2);
    }
    .tg { flex-direction: row; overflow-x: auto; scrollbar-width: none; padding: 8px 10px; gap: 6px; border-left: 0; border-bottom: 1px solid var(--line); }
    .tg::-webkit-scrollbar { display: none; }
    .tg h1, .tgl small { display: none; }
    .tgl { width: auto; flex: none; grid-template-columns: 10px auto; gap: 6px; padding: 5px 9px; border-color: var(--line); border-radius: 999px; font-size: 12px; }
    .tg .row { margin: 0; flex: none; }
    .tg .row .btn { padding: 5px 9px; border-radius: 999px; }
    .st { border-left: 0; padding: 8px 12px; overflow: hidden; }
    .st dl { grid-template-columns: auto 1fr auto 1fr; gap: 3px 8px; font-size: 11.5px; }
    .st dd { font-size: 11px; }
    .st .wide { grid-column: span 3; }
  }
</style>
</head>
<body>
<div class="app">
  <div id="box" class="jxgbox" aria-label="可拖曳的三角形作圖"></div>
  <div class="tg" id="tg">
    <h1>三角形的心<small>拖曳頂點，所有作圖即時連動</small></h1>
  </div>
  <div class="st">
    <div class="type"><b id="sType">銳角三角形</b><span id="sSum">內角和 180.0°</span></div>
    <dl>
      <dt>∠A・∠B・∠C</dt><dd id="sAng" class="wide"></dd>
      <dt>面積</dt><dd id="sArea"></dd>
      <dt>周長</dt><dd id="sPer"></dd>
      <dt>外接圓 R</dt><dd id="sR"></dd>
      <dt>內切圓 r</dt><dd id="sr"></dd>
      <dt>OI² ＝ R(R−2r)</dt><dd id="sEuler" class="wide"></dd>
      <dt>OG : GH</dt><dd id="sRatio" class="wide"></dd>
    </dl>
  </div>
</div>
<div class="hint">拖曳頂點 A、B、C 或圓上的 P</div>

<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.13.3/distrib/jsxgraphcore.js"></script>
<script>
const K = { fg: "#ecebe6", ink: "#0e1013", c1: "#f7df1e", c2: "#4cc9f0", c3: "#f72585", c4: "#7bd389", c5: "#ff8c42", c6: "#9d8cff" };
const START = { A: [-3.4, -1.9], B: [3.8, -1.9], C: [0.7, 3.0] };

JXG.Options.text.strokeColor = K.fg;
JXG.Options.label.strokeColor = K.fg;

const box = document.getElementById("box");
const board = JXG.JSXGraph.initBoard(box, {
  boundingbox: [-6, 6, 6, -6], keepaspectratio: true, axis: false, grid: false,
  showCopyright: false, showNavigation: false, showInfobox: false,
  pan: { enabled: false }, zoom: { enabled: false }, resize: { enabled: false },
});

// ---------- style helpers ----------
const same = (o) => ({ ...o, highlightStrokeColor: o.strokeColor, highlightFillColor: o.fillColor, highlightStrokeOpacity: o.strokeOpacity ?? 1, highlightFillOpacity: o.fillOpacity ?? 1 });
const vertex = (name, xy, off) => board.create("point", xy, same({
  name, size: 7, face: "o", fillColor: K.c1, strokeColor: K.ink, strokeWidth: 2,
  label: { offset: off, cssClass: "JXGtext lbl-v", highlightCssClass: "JXGtext lbl-v", strokeColor: K.c1 },
}));
const center = (parents, name, color, extra = {}) => board.create(parents[0], parents[1], same({
  name, size: 4, face: "o", fillColor: color, strokeColor: K.ink, strokeWidth: 1.5, fixed: true,
  label: { offset: [7, 9], strokeColor: color, fontSize: 14 }, ...extra,
}));
const hidden = { visible: false, withLabel: false };
const aux = (color) => same({ strokeColor: color, strokeWidth: 1, strokeOpacity: 0.38, dash: 2, fixed: true });
const curve = (color, w = 2, dash = 0) => same({ strokeColor: color, strokeWidth: w, dash, fillColor: "none", fixed: true });

// ---------- triangle ----------
const A = vertex("A", START.A, [-20, -16]);
const B = vertex("B", START.B, [10, -16]);
const C = vertex("C", START.C, [-5, 20]);
const tri = board.create("polygon", [A, B, C], same({
  fillColor: K.c1, fillOpacity: 0.06, hasInnerPoints: false,
  borders: same({ strokeColor: K.fg, strokeWidth: 2, strokeOpacity: 0.9 }),
}));
const [AB, BC, CA] = tri.borders;
const angOpt = (name) => same({
  name, radius: 0.6, fillColor: K.c1, fillOpacity: 0.16, strokeColor: K.c1, strokeOpacity: 0.55, fixed: true,
  label: { fontSize: 13, strokeColor: K.c1 },
});
const angA = board.create("nonreflexangle", [B, A, C], angOpt("α"));
const angB = board.create("nonreflexangle", [C, B, A], angOpt("β"));
const angC = board.create("nonreflexangle", [A, C, B], angOpt("γ"));

// midpoints (shared by perpendicular bisectors, medians and the nine-point circle)
const midOpt = (name) => same({ name, size: 2.5, fillColor: K.c6, strokeColor: K.c6, fixed: true, withLabel: false });
const Mab = board.create("midpoint", [A, B], midOpt("Mab"));
const Mbc = board.create("midpoint", [B, C], midOpt("Mbc"));
const Mca = board.create("midpoint", [C, A], midOpt("Mca"));

// circumcenter O + circumcircle, perpendicular bisectors
const O = center(["circumcenter", [A, B, C]], "O", K.c2);
const circ = board.create("circle", [O, A], curve(K.c2, 2.2));
const pbs = [[AB, Mab], [BC, Mbc], [CA, Mca]].map((p) => board.create("perpendicular", p, aux(K.c2)));

// incenter I + incircle (radius r = 2 * area / perimeter), angle bisectors
const I = center(["incenter", [A, B, C]], "I", K.c4);
const inr = () => (2 * tri.Area()) / tri.Perimeter();
const incirc = board.create("circle", [I, inr], curve(K.c4, 2));
const abs = [[B, A, C], [C, B, A], [A, C, B]].map((p) => board.create("bisector", p, aux(K.c4)));

// centroid G, medians
const G = center(["point", [() => (A.X() + B.X() + C.X()) / 3, () => (A.Y() + B.Y() + C.Y()) / 3]], "G", K.c5);
const meds = [[A, Mbc], [B, Mca], [C, Mab]].map((p) => board.create("segment", p, aux(K.c5)));

// orthocenter H (OH = OA + OB + OC), altitudes and their feet
const H = center(["point", [() => A.X() + B.X() + C.X() - 2 * O.X(), () => A.Y() + B.Y() + C.Y() - 2 * O.Y()]], "H", K.c3);
const alts = [[BC, A], [CA, B], [AB, C]].map((p) => board.create("perpendicular", p, aux(K.c3)));
const feet = [[A, BC], [B, CA], [C, AB]].map((p) => board.create("orthogonalprojection", p, midOpt("F")));

// Euler line through O, G, H and nine-point circle centred at N (midpoint of OH)
const euler = board.create("line", [O, H], same({ strokeColor: K.c6, strokeWidth: 2.5, strokeOpacity: 0.85, fixed: true }));
const N = center(["midpoint", [O, H]], "N", K.c6, { size: 3 });
const nine = board.create("circumcircle", [Mab, Mbc, Mca], { ...curve(K.c6, 1.6, 3), center: hidden });

// glider P on the circumcircle and its tangent
const P = board.create("glider", [O.X() + 3, O.Y() + 3, circ], same({
  name: "P", size: 5, face: "o", fillColor: K.fg, strokeColor: K.c2, strokeWidth: 2,
  label: { offset: [8, 10], strokeColor: K.fg, fontSize: 14 },
}));
const tangent = board.create("tangent", [P], same({ strokeColor: K.fg, strokeWidth: 1.6, strokeOpacity: 0.8, fixed: true }));
const OP = board.create("segment", [O, P], aux(K.fg));
const Q = board.create("point", [() => P.X() - (P.Y() - O.Y()), () => P.Y() + (P.X() - O.X())], hidden);
const right = board.create("nonreflexangle", [O, P, Q], same({ name: "", radius: 0.32, orthoType: "square", fillColor: K.fg, fillOpacity: 0.15, strokeColor: K.fg, strokeOpacity: 0.7, fixed: true, withLabel: false }));

// ---------- toggles ----------
const GROUPS = [
  { key: "circ", name: "外心 O・外接圓", note: "中垂線交點", color: K.c2, on: true, main: [O, circ], aux: pbs },
  { key: "inc", name: "內心 I・內切圓", note: "角平分線交點", color: K.c4, on: false, main: [I, incirc], aux: abs },
  { key: "cen", name: "重心 G", note: "中線交點", color: K.c5, on: true, main: [G], aux: meds },
  { key: "ort", name: "垂心 H", note: "三高交點", color: K.c3, on: true, main: [H], aux: alts },
  { key: "eul", name: "歐拉線", note: "O、G、H 共線", color: K.c6, on: true, main: [euler], aux: [] },
  { key: "nin", name: "九點圓", note: "中點與垂足共圓", color: K.c6, on: false, main: [nine, N, Mab, Mbc, Mca, ...feet], aux: [] },
  { key: "tan", name: "切線", note: "切線垂直半徑", color: K.fg, on: true, main: [P, tangent, OP, right], aux: [] },
  { key: "aux", name: "輔助線", note: "作圖過程", color: "#6f6d66", on: true, main: [], aux: [] },
];
const state = Object.fromEntries(GROUPS.map((g) => [g.key, g.on]));

function applyVisibility() {
  for (const g of GROUPS) {
    g.main.forEach((el) => el.setAttribute({ visible: state[g.key] }));
    g.aux.forEach((el) => el.setAttribute({ visible: state[g.key] && state.aux }));
  }
  board.update();
}

const tg = document.getElementById("tg");
for (const g of GROUPS) {
  const b = document.createElement("button");
  b.className = "tgl";
  b.style.setProperty("--k", g.color);
  b.setAttribute("aria-pressed", g.on);
  b.innerHTML = `<i></i><span>${g.name}</span><small>${g.note}</small>`;
  b.addEventListener("click", () => {
    state[g.key] = !state[g.key];
    b.setAttribute("aria-pressed", state[g.key]);
    applyVisibility();
  });
  tg.appendChild(b);
}
const row = document.createElement("div");
row.className = "row";
row.innerHTML = '<button class="btn" id="obtuse">鈍角範例</button><button class="btn" id="reset">重設</button>';
tg.appendChild(row);

function place(pts) {
  A.moveTo(pts.A); B.moveTo(pts.B); C.moveTo(pts.C);
  P.moveTo([O.X() + 0.7 * circ.Radius(), O.Y() + 0.7 * circ.Radius()]);
  fit();
}
document.getElementById("reset").addEventListener("click", () => place(START));
document.getElementById("obtuse").addEventListener("click", () => place({ A: [-3.6, -1.2], B: [3.6, -1.2], C: [-1.6, 1.0] }));

// ---------- live measurements ----------
const $ = (id) => document.getElementById(id);
const deg = (el) => (el.Value() * 180) / Math.PI;
const f2 = (x) => x.toFixed(2);

function renderStats() {
  const angs = [deg(angA), deg(angB), deg(angC)];
  const big = Math.max(...angs);
  const sides = [B.Dist(C), C.Dist(A), A.Dist(B)].sort((x, y) => x - y);
  const eq = (x, y) => Math.abs(x - y) < 0.02 * sides[2];
  let type = big > 90.5 ? "鈍角三角形" : big > 89.5 ? "直角三角形" : "銳角三角形";
  if (eq(sides[0], sides[2])) type = "正三角形";
  else if (eq(sides[0], sides[1]) || eq(sides[1], sides[2])) type = "等腰" + type;
  const area = tri.Area();
  const R = O.Dist(A);
  const r = inr();
  const oi2 = O.Dist(I) ** 2;
  const og = O.Dist(G);
  const gh = G.Dist(H);
  $("sType").textContent = type;
  $("sSum").textContent = `內角和 ${(angs[0] + angs[1] + angs[2]).toFixed(1)}°`;
  $("sAng").textContent = angs.map((a) => a.toFixed(1) + "°").join("  ");
  $("sArea").textContent = f2(area);
  $("sPer").textContent = f2(tri.Perimeter());
  $("sR").textContent = f2(R);
  $("sr").textContent = f2(r);
  $("sEuler").innerHTML = `${f2(oi2)} = ${f2(R * (R - 2 * r))} <span class="ok">✓</span>`;
  $("sRatio").innerHTML = og < 1e-6 ? "三心重合" : `1 : ${(gh / og).toFixed(2)} <span class="ok">✓ 共線</span>`;
}
board.on("update", renderStats);

// ---------- fit the drawing to the container ----------
function fit() {
  const w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return;
  board.resizeContainer(w, h, true, true);
  // keep the circumcircle and the orthocenter (outside the triangle when obtuse) in view
  const xs = [H.X(), O.X() - circ.Radius(), O.X() + circ.Radius()];
  const ys = [H.Y(), O.Y() - circ.Radius(), O.Y() + circ.Radius()];
  const pad = 0.16 * (Math.max(...xs) - Math.min(...xs) + Math.max(...ys) - Math.min(...ys)) / 2 + 0.5;
  board.setBoundingBox([Math.min(...xs) - pad, Math.max(...ys) + pad, Math.max(...xs) + pad, Math.min(...ys) - pad], true);
  board.fullUpdate();
}
new ResizeObserver(fit).observe(box);

P.moveTo([O.X() + 0.7 * circ.Radius(), O.Y() + 0.7 * circ.Radius()]);
applyVisibility();
fit();
</script>
</body>
</html>
