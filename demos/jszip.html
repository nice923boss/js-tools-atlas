<script>
const { fmtMs, fmtCompact } = Showcase;
const enc = new TextEncoder(), dec = new TextDecoder();
const kb = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const hx = (n, w = 2) => n.toString(16).toUpperCase().padStart(w, "0");
const num = (n) => n.toLocaleString("en-US");
const kind = (v) => Object.prototype.toString.call(v).slice(8, -1);
const rng = (s) => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);

// Parse the central directory of a (non ZIP64) archive, so sizes and flags come from the real bytes JSZip wrote.
function readCD(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error("找不到 ZIP 結尾記錄");
  const count = dv.getUint16(e + 10, true), cdOff = dv.getUint32(e + 16, true), cl = dv.getUint16(e + 20, true);
  const list = [];
  for (let p = cdOff, i = 0; i < count; i++) {
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), ml = dv.getUint16(p + 32, true);
    list.push({ name: dec.decode(u8.subarray(p + 46, p + 46 + nl)), at: p, nl, xl, ml, made: dv.getUint16(p + 4, true), flags: dv.getUint16(p + 8, true),
      method: dv.getUint16(p + 10, true), crc: dv.getUint32(p + 16, true), comp: dv.getUint32(p + 20, true), size: dv.getUint32(p + 24, true),
      attr: dv.getUint32(p + 38, true), offset: dv.getUint32(p + 42, true) });
    p += 46 + nl + xl + ml;
  }
  return { list, cdOff, eocd: e, comment: dec.decode(u8.subarray(e + 22, e + 22 + cl)) };
}

// ---- sample data (generated in the browser, illustrative only) ----
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市"];
const ITEMS = ["課程票券", "線上課程", "講義", "工作坊"];
function revenueCsv(q) {
  const rows = ["日期,城市,品項,數量,營收"];
  for (let d = 0; d < 90; d++) {
    const date = new Date(2026, (q - 1) * 3, 1 + d).toISOString().slice(0, 10);
    CITIES.forEach((c, i) => rows.push(`${date},${c},課程票券,${10 + ((d * 7 + i * 13) % 40)},${(10 + ((d * 7 + i * 13) % 40)) * 680}`));
  }
  return rows.join("\n");
}
function salesCsv(n, seed = 7) {
  const r = rng(seed), out = ["日期,城市,品項,數量,營收"];
  for (let i = 0; i < n; i++) {
    const q = 1 + Math.floor(r() * 60);
    out.push(`${new Date(Date.UTC(2026, 0, 1 + (i % 365))).toISOString().slice(0, 10)},${CITIES[Math.floor(r() * 6)]},${ITEMS[Math.floor(r() * 4)]},${q},${q * 680}`);
  }
  return out.join("\n");
}
function noisePng() {
  const c = document.createElement("canvas"); c.width = c.height = 120;
  const g = c.getContext("2d"), img = g.createImageData(120, 120);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = v; img.data[i + 1] = v * 0.7 + 60; img.data[i + 2] = 255 - v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return new Promise((r) => c.toBlob(r, "image/png"));
}
function randomBytes(n) {
  const u = new Uint8Array(n);
  for (let o = 0; o < n; o += 65536) crypto.getRandomValues(u.subarray(o, Math.min(n, o + 65536)));

          if (!p.length) continue;
          g += `<polyline class="${cls}" points="${p.map((q) => `${X(q.n).toFixed(1)},${Y(q.ms).toFixed(1)}`).join(" ")}"/>`;
          g += p.map((q) => `<circle class="${cls}" cx="${X(q.n).toFixed(1)}" cy="${Y(q.ms).toFixed(1)}" r="3.5"/>`).join("");
        }
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        svg.innerHTML = g;
        const last = (a) => (a.length ? `${fmtCompact(a[a.length - 1].n)} 檔 ${fmtMs(a[a.length - 1].ms)}・壓成 ${a[a.length - 1].pct}%` : "－");
        ctx.$(".jz-ld").textContent = last(res.DEFLATE);
        ctx.$(".jz-ls").textContent = last(res.STORE);
      }
      ctx.onResize(chart);
      ctx.controls.classList.add("bottom");
      ctx.group(["DEFLATE 6", "STORE"], 0, (i) => { mode = i ? "STORE" : "DEFLATE"; });
      ctx.bench({
        label: "檔案數", unit: "個", sizes: SIZES, target: 1000, budget: 3000,
        prepare(n) {
          const files = [];
          let raw = 0;
          for (let i = 0; i < n; i++) { const t = rowText(i); raw += t.length; files.push([`資料/${String(Math.floor(i / 1000)).padStart(3, "0")}/${i}.csv`, t]); }
          return { files, raw };
        },
        async run(n, { files, raw }) {
          if (n === SIZES[0]) res[mode] = [];
          const t0 = performance.now(), zip = new JSZip();
          for (const [p, t] of files) zip.file(p, t);
          const out = await zip.generateAsync({ type: "uint8array", compression: mode, compressionOptions: { level: 6 } });
          const pct = Math.round((out.length / raw) * 100);
          res[mode].push({ n, ms: performance.now() - t0, pct });
          ctx.$(".jz-sl").textContent = `${mode}・原始 ${kb(raw)} → ${kb(out.length)}`;
          chart();
          return `${pct}%`;
        },
        note: "每一級都從新的 JSZip 開始：逐檔 zip.file（每 1000 檔一個資料夾），再 generateAsync 輸出 Uint8Array；測試資料在準備階段產生，不計時。DEFLATE 的瓶頸是壓縮運算，STORE 剩下每個檔案的物件建立、CRC-32 與檔頭組裝，檔案越多越明顯。JSZip 分段非同步執行，畫面不會整個卡住，但結果要整份留在記憶體裡。",
      });
      chart();
    },
  },
] });
</script>
</body>
