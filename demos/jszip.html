<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSZip 示範：瀏覽器端批次打包</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 280px minmax(0, 1fr); }
  .form { padding: 14px 16px 56px; border-right: 1px solid var(--line); background: var(--bg-2); overflow-y: auto; }
  .form h1 { font-size: 16px; margin: 0 0 2px; }
  .form p { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .lab { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
  .files { display: grid; gap: 2px; }
  .files label { display: grid; grid-template-columns: 18px 20px 1fr auto; align-items: center; gap: 4px; font-size: 13px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .files label:hover { background: var(--bg); }
  .files input { accent-color: var(--c2); margin: 0; }
  .files small { font: 11px var(--mono); color: var(--muted); }
  .files .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lv { display: grid; grid-template-columns: 1fr 74px; gap: 8px; align-items: center; }
  .lv input { width: 100%; accent-color: var(--c2); }
  .lv b { font: 600 12px var(--mono); text-align: right; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .actions .btn { text-align: center; }
  .main { display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(0, 36%); min-width: 0; min-height: 0; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .summary .big { font-size: 15px; font-weight: 700; margin-right: auto; }
  .summary .big em { font-style: normal; color: var(--c4); }
  .pill { font: 12px var(--mono); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); }
  .pill.src { color: var(--c6); border-color: rgba(106, 90, 224, .35); }
  .table { overflow-y: auto; padding: 6px 12px; }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 130px 58px; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  .row:hover { background: var(--bg-2); }
  .row.sel { background: rgba(31, 143, 184, .1); box-shadow: inset 3px 0 0 var(--c2); }
  .row .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.dir { cursor: default; color: var(--muted); font-size: 12px; padding-top: 8px; }
  .row.dir:hover { background: none; }
  .row.child .nm { padding-left: 18px; }
  .bars { display: grid; gap: 2px; }
  .bars i { display: block; height: 6px; border-radius: 3px; }
  .bars .o { background: rgba(0, 0, 0, .12); }
  .bars .c { background: linear-gradient(90deg, var(--c2), var(--c6)); }
  .ratio { font: 12px var(--mono); text-align: right; }
  .ratio small { display: block; color: var(--muted); font-size: 10px; }
  .preview { border-top: 1px solid var(--line); background: var(--bg-2); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; padding-bottom: 44px; }
  .preview .ph { font-size: 12px; color: var(--muted); padding: 8px 16px 4px; display: flex; flex-wrap: wrap; gap: 2px 8px; }
  .preview .ph code { color: var(--fg); }
  .preview .ph span { white-space: nowrap; }
  #pv { min-height: 0; overflow: auto; }
  .preview pre { margin: 0; padding: 4px 16px 8px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre; }
  .preview .img { display: flex; gap: 12px; align-items: center; padding: 4px 16px; min-height: 0; }
  .preview .img img { max-height: 100%; max-width: 50%; image-rendering: pixelated; border: 1px solid var(--line); background: #fff; }
  .drop { position: fixed; inset: 0; display: none; place-items: center; background: rgba(31, 143, 184, .16); border: 3px dashed var(--c2); font-size: 18px; font-weight: 700; color: var(--c2); z-index: 60; }
  body.dragging .drop { display: grid; }
  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 38%) minmax(0, 62%); }
    .form { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px 10px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; overflow: hidden; }
    .form h1, .form p, .form .lab.lv-lab { display: none; }
    .files { overflow-y: auto; align-content: start; }
    .lab { margin-top: 0; }
    .lv { margin-top: 6px; }
    .actions { margin-top: 8px; }
    .preview { padding-bottom: 40px; }
    .main { grid-template-rows: auto minmax(0, 1fr) minmax(0, 44%); }
    .preview .ph { padding: 6px 12px 2px; font-size: 11px; }
    .preview .ph span { display: none; }
    .preview pre { padding: 2px 12px 6px; font-size: 11px; }
    .summary { padding: 8px 10px; gap: 6px; }
    .summary .big { font-size: 13px; width: 100%; }
    .row { grid-template-columns: minmax(0, 1fr) 70px 48px; gap: 6px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="form">
    <h1>JSZip 批次打包</h1>
    <p>勾選檔案，瀏覽器直接壓成 .zip，不經過伺服器</p>
    <div class="lab"><span>要打包的檔案（示意資料）</span><span id="selN"></span></div>
    <div class="files" id="files"></div>
    <div class="lab lv-lab"><span>壓縮方式</span></div>
    <div class="lv"><input type="range" id="level" min="0" max="9" value="6"><b id="levelV"></b></div>
    <div class="actions">
      <button class="btn primary" id="dl">下載 ZIP</button>
      <label class="btn" for="up">讀取 ZIP</label>
      <input type="file" id="up" accept=".zip,application/zip" hidden>
    </div>
  </div>
  <div class="main">
    <div class="summary" id="summary"></div>
    <div class="table" id="table"></div>
    <div class="preview">
      <div class="ph" id="ph"></div>
      <div id="pv"></div>
    </div>
  </div>
</div>
<div class="drop">放開以讀取 ZIP 內容</div>
<div class="hint">也可以把任何 .zip 拖進來看內容</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.2/dist/jszip.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const enc = new TextEncoder();
const kb = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

// ---- Sample files (generated in the browser) ----
function revenueCsv(q) {
  const cities = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市"];
  const rows = ["日期,城市,品項,數量,營收"];
  for (let d = 0; d < 90; d++) {
    const date = new Date(2026, (q - 1) * 3, 1 + d).toISOString().slice(0, 10);
    cities.forEach((c, i) => rows.push(`${date},${c},課程票券,${10 + ((d * 7 + i * 13) % 40)},${(10 + ((d * 7 + i * 13) % 40)) * 680}`));
  }
  return rows.join("\n");
}
function noisePng() {
  const c = document.createElement("canvas"); c.width = c.height = 120;
  const g = c.getContext("2d"), img = g.createImageData(120, 120);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 255;
    img.data[i] = v; img.data[i + 1] = v * 0.7 + 60; img.data[i + 2] = 255 - v; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return new Promise((r) => c.toBlob(r, "image/png"));
}
const LOGO = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><rect width="120" height="120" rx="22" fill="#f7df1e"/><text x="104" y="102" font-family="Arial" font-weight="700" font-size="54" text-anchor="end" fill="#1a1a14">JS</text></svg>`;
const README = [
  "JS 工具圖鑑：JSZip 批次下載示範",
  "",
  "這個壓縮檔完全在瀏覽器裡產生：",
  "1. 用 zip.file(路徑, 內容) 加入檔案，路徑含資料夾會自動建立。",
  "2. 用 zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }) 產生壓縮檔。",
  "3. 文字類檔案壓縮率高，PNG 本身已壓縮，所以幾乎不會變小。",
  "",
  "所有內容皆為示意資料。",
].join("\n");
const TOOLS = ["p5.js", "Three.js", "GSAP", "D3.js", "Chart.js", "ECharts", "Leaflet", "Tone.js", "PDF.js", "jsPDF", "SheetJS", "ExcelJS", "JSZip", "Day.js", "Lodash", "Fuse.js", "i18next", "Dexie.js", "sql.js", "DuckDB-Wasm"];

const FILES = [
  { path: "README.txt", icon: "📄", make: () => README },
  { path: "報表/2026-Q1-營收.csv", icon: "📊", make: () => revenueCsv(1) },
  { path: "報表/2026-Q2-營收.csv", icon: "📊", make: () => revenueCsv(2) },
  { path: "資料/tools.json", icon: "🧾", make: () => JSON.stringify(TOOLS.map((name, i) => ({ id: i + 1, name, category: i < 7 ? "視覺" : "資料" })), null, 2) },
  { path: "圖片/logo.svg", icon: "🖼️", make: () => LOGO },
  { path: "圖片/雜訊.png", icon: "🎲", make: noisePng },
];

let lastZip = null, lastBlob = null, mode = "build", srcName = "", selected = null, buildSeq = 0;

function sizeOf(content) { return content instanceof Blob ? content.size : enc.encode(content).length; }

function levelLabel(v) { return +v === 0 ? "不壓縮" : `DEFLATE ${v}`; }

async function build() {
  const seq = ++buildSeq;
  const level = +$("level").value;
  $("levelV").textContent = levelLabel(level);
  const zip = new JSZip();
  const picked = FILES.filter((f) => f.on);
  $("selN").textContent = `${picked.length} / ${FILES.length}`;
  for (const f of picked) zip.file(f.path, f.content);
  const t0 = performance.now();
  const blob = await zip.generateAsync({
    type: "blob",
    compression: level ? "DEFLATE" : "STORE",
    compressionOptions: { level: level || 1 },
    comment: "Generated by JSZip demo",
  });
  const ms = performance.now() - t0;
  // Read the archive back to get per-entry compressed sizes
  const readBack = await JSZip.loadAsync(blob);
  if (seq !== buildSeq) return; // a newer build (slider drag) superseded this one
  lastBlob = blob;
  lastZip = readBack;
  mode = "build";
  render(ms);
}

function entries(zip) {
  const list = [];
  zip.forEach((path, f) => { if (!f.dir) list.push({ path, f, orig: f._data.uncompressedSize, comp: f._data.compressedSize }); });
  return list.sort((a, b) => a.path.localeCompare(b.path, "zh-Hant"));
}

function render(ms) {
  const list = entries(lastZip);
  const orig = list.reduce((s, e) => s + e.orig, 0);
  const zipSize = mode === "build" ? lastBlob.size : srcSize;
  const saved = orig ? Math.round((1 - zipSize / orig) * 100) : 0;
  $("summary").innerHTML = `<span class="big">${kb(orig)} → <em>${kb(zipSize)}</em>（${saved >= 0 ? "省 " + saved : "多 " + -saved}%）</span>` +
    (mode === "read" ? `<span class="pill src">讀取：${esc(srcName)}</span><button class="btn" id="back">回到打包</button>` :
      `<span class="pill">${list.length} 個檔案</span><span class="pill">${levelLabel($("level").value)}</span><span class="pill">${ms.toFixed(0)} ms</span>`);
  $("back")?.addEventListener("click", build);
  const max = Math.max(1, ...list.map((e) => e.orig));
  let html = "", dir = null;
  for (const e of list) {
    const slash = e.path.lastIndexOf("/");
    const d = slash > 0 ? e.path.slice(0, slash + 1) : "";
    if (d && d !== dir) html += `<div class="row dir"><span class="nm">📁 ${esc(d)}</span></div>`;
    dir = d;
    const pct = e.orig ? Math.round((e.comp / e.orig) * 100) : 100;
    html += `<div class="row${d ? " child" : ""}${e.path === selected ? " sel" : ""}" data-p="${esc(e.path)}">
      <span class="nm">${esc(e.path.slice(slash + 1))}</span>
      <span class="bars"><i class="o" style="width:${(e.orig / max) * 100}%"></i><i class="c" style="width:${(e.comp / max) * 100}%"></i></span>
      <span class="ratio">${pct}%<small>${kb(e.comp)}</small></span></div>`;
  }
  $("table").innerHTML = html || '<div class="row dir"><span class="nm">壓縮檔是空的</span></div>';
  if (!list.some((e) => e.path === selected)) selected = list[0]?.path;
  preview(selected);
}

async function preview(path) {
  selected = path;
  document.querySelectorAll(".row[data-p]").forEach((r) => r.classList.toggle("sel", r.dataset.p === path));
  if (!path) { $("ph").textContent = ""; $("pv").innerHTML = ""; return; }
  const f = lastZip.file(path);
  $("ph").innerHTML = `<span>從 ZIP 讀回：</span><code>zip.file("${esc(path)}").async(${/\.(png|jpe?g|gif|webp|svg)$/i.test(path) ? '"blob"' : '"string"'})</code>`;
  if (/\.(png|jpe?g|gif|webp|svg)$/i.test(path)) {
    const blob = await f.async("blob");
    const url = URL.createObjectURL(path.endsWith(".svg") ? new Blob([blob], { type: "image/svg+xml" }) : blob);
    $("pv").className = "img";
    $("pv").innerHTML = `<img src="${url}" alt=""><span class="muted">${kb(blob.size)}・${path.endsWith(".png") ? "PNG 已經壓縮過，再 DEFLATE 幾乎沒差" : "SVG 是文字，壓縮效果好"}</span>`;
  } else if (/\.(txt|csv|json|md|js|html|css|xml)$/i.test(path)) {
    const text = await f.async("string");
    const lines = text.split("\n");
    $("pv").className = "";
    $("pv").innerHTML = `<pre>${esc(lines.slice(0, 40).join("\n"))}${lines.length > 40 ? `\n…（共 ${lines.length} 行）` : ""}</pre>`;
  } else {
    const buf = await f.async("uint8array");
    $("pv").className = "";
    $("pv").innerHTML = `<pre>${[...buf.slice(0, 128)].map((b) => b.toString(16).padStart(2, "0")).join(" ")}${buf.length > 128 ? " …" : ""}</pre>`;
  }
}

let srcSize = 0;
async function readZip(file) {
  try {
    lastZip = await JSZip.loadAsync(file);
    mode = "read"; srcName = file.name; srcSize = file.size; selected = null;
    render(0);
  } catch (err) {
    $("summary").innerHTML = `<span class="big" style="color:var(--c3)">讀取失敗：${esc(file.name)} 不是有效的 ZIP</span><button class="btn" id="back">回到打包</button>`;
    $("back").addEventListener("click", build);
    console.warn(err);
  }
}

$("table").addEventListener("click", (e) => { const r = e.target.closest(".row[data-p]"); if (r) preview(r.dataset.p); });
$("level").addEventListener("input", build);
$("dl").addEventListener("click", async () => {
  if (mode !== "build") await build();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(lastBlob); a.download = "批次下載示範.zip"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$("up").addEventListener("change", (e) => { if (e.target.files[0]) readZip(e.target.files[0]); e.target.value = ""; });
addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
addEventListener("dragleave", (e) => { if (!e.relatedTarget) document.body.classList.remove("dragging"); });
addEventListener("drop", (e) => {
  e.preventDefault(); document.body.classList.remove("dragging");
  const f = e.dataTransfer.files[0]; if (f) readZip(f);
});

(async () => {
  for (const f of FILES) { f.content = await f.make(); f.on = true; }
  $("files").innerHTML = FILES.map((f, i) => `<label><input type="checkbox" data-i="${i}" checked><span>${f.icon}</span><span class="p">${esc(f.path)}</span><small>${kb(sizeOf(f.content))}</small></label>`).join("");
  $("files").addEventListener("change", (e) => { FILES[+e.target.dataset.i].on = e.target.checked; build(); });
  build();
})();
</script>
</body>
</html>
