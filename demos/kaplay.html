<style>

  .sc-scene.kp-studio { background: radial-gradient(70% 90% at 50% 40%, #20232c, #0e1013); }
  .sc-scene.kp-paper { background: #15181e radial-gradient(rgba(255,255,255,.10) 1px, transparent 1.6px) 0 0 / 22px 22px; }
  .readout {
    position: absolute; left: 10px; bottom: 10px; z-index: 20; max-width: calc(100% - 20px); padding: 6px 10px; border-radius: 8px;

    position: absolute; left: 50%; top: 22%; transform: translateX(-50%); z-index: 15; pointer-events: none; white-space: nowrap;
    font: 800 22px/1.2 var(--font); color: var(--accent); text-shadow: 0 3px 12px rgba(0,0,0,.6); opacity: 0; transition: opacity .3s;
  }

  .kp-pad .btn.primary { width: 64px; font: 700 15px var(--font); }
  @media (pointer: coarse) { .kp-pad { display: flex; } .kp-has-pad .readout { bottom: 66px; } }
  .kp-err {
    position: absolute; left: 50%; bottom: 52px; transform: translateX(-50%); z-index: 18; width: min(560px, calc(100% - 20px));
    padding: 8px 12px; border-radius: 10px; background: var(--panel); border: 1px solid rgba(247,37,133,.55); backdrop-filter: blur(6px);
    font: 500 12.5px/1.55 var(--font); color: var(--fg); pointer-events: none;

  .stress-box {
    position: absolute; top: 8px; right: 8px; bottom: calc(var(--sc-ctl-b, 0px) + 8px); left: 350px;
    border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); overflow: hidden;

<script src="https://cdn.jsdelivr.net/npm/kaplay@3001.0.19/dist/kaplay.js"></script>

<script>
// KAPLAY showcase: eight scenes from the original meteor-dodging game to an object-count stress ramp.
const rootCss = getComputedStyle(document.documentElement);
const cssVar = (name, fallback) => rootCss.getPropertyValue(name).trim() || fallback;
const C = {
  c1: cssVar("--c1", "#f7df1e"), c2: cssVar("--c2", "#4cc9f0"), c3: cssVar("--c3", "#f72585"),
  c4: cssVar("--c4", "#7bd389"), c5: cssVar("--c5", "#ff8c42"), c6: cssVar("--c6", "#9d8cff"),
};
const COLORS = [C.c1, C.c2, C.c3, C.c4, C.c5, C.c6];
const FONT = cssVar("--font", "sans-serif");
const MONO = cssVar("--mono", "monospace");
const DPR = Math.min(2, devicePixelRatio || 1);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const fmtN = (n) => n.toLocaleString("en-US");
// Y just below the top-right control cluster, so scene content starts under the buttons.
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;
const PHOTO = (i) => `_shared/img/photo-${i}.jpg`;
const unmounted = () => new DOMException("Scene unmounted", "AbortError");

function canvas2d(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  return c;
}
// Soft white dot; tinted per particle.
function glowCanvas(s, core = 0.25) {
  return canvas2d(s, s, (g) => {
    const r = s / 2, grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0, "rgba(255,255,255,1)");
    grd.addColorStop(core, "rgba(255,255,255,0.8)");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
  });
}
// Six shaded balls in one 96x16 strip (sliceX: 6).
function ballAtlas() {
  return canvas2d(96, 16, (g) => COLORS.forEach((c, i) => {
    const grd = g.createRadialGradient(i * 16 + 6, 6, 1, i * 16 + 8, 8, 8);
    grd.addColorStop(0, "#ffffff");
    grd.addColorStop(0.35, c);
    grd.addColorStop(1, c);
    g.fillStyle = grd;
    g.beginPath();
    g.arc(i * 16 + 8, 8, 7.5, 0, Math.PI * 2);
    g.fill();
  }));
}
// Status line in the bottom-left corner; returns a setter that takes HTML.
function readout(ctx, parent = ctx.el) {
  const el = document.createElement("div");
  el.className = "readout";
  parent.append(el);
  return (html) => { el.innerHTML = html; };
}
// Centred toast; returns a function that shows a line of text for 1.8 s.
function message(ctx) {
  const el = document.createElement("div");
  el.className = "kp-msg";
  ctx.el.append(el);
  let id = 0;
  ctx.onCleanup(() => clearTimeout(id));
  return (text) => {
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(id);
    id = setTimeout(() => el.classList.remove("show"), 1800);
  };
}
// Touch pad (left / right / jump) shown on coarse pointers; returns the shared input state.
function touchPad(ctx, onPress) {
  ctx.el.classList.add("kp-has-pad");
  const pad = document.createElement("div");
  pad.className = "kp-pad";
  pad.innerHTML = `<button class="btn" data-k="left" aria-label="向左">◀</button><button class="btn" data-k="right" aria-label="向右">▶</button><button class="btn primary" data-k="jump">跳</button>`;
  ctx.el.append(pad);
  const touch = { left: false, right: false, jump: false };
  for (const b of pad.querySelectorAll(".btn")) {
    const key = b.dataset.k;
    b.addEventListener("pointerdown", (e) => { e.preventDefault(); touch[key] = true; onPress(); });
    for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => { if (key !== "jump") touch[key] = false; });
  }
  return touch;
}

// ---------- one KAPLAY instance per scene ----------
let kpN = 0;
// KAPLAY keeps its current instance in module state (kaplay() quits the previous one with a warning) and
// caches text atlases module-wide by font family, so each scene gets unique family names, stops its loop
// synchronously and releases its WebGL and audio contexts on cleanup.
function kaplayIn(ctx, box, opt = {}) {
  const canvas = document.createElement("canvas");
  box.append(canvas);
  const n = ++kpN, font = `"kp${n}", ${FONT}`;
  const k = kaplay({
    canvas, root: box, global: false, focus: false, loadingScreen: false, debug: false, crisp: false,
    tagsAsComponents: true, pixelDensity: DPR, font, background: [14, 16, 19], ...opt,
  });
  k.FONT = font;
  k.MONO = `"kpm${n}", ${MONO}`;
  const { app, audio } = k._k, gl = canvas.getContext("webgl");
  // KAPLAY listens for keys on the canvas itself
  canvas.addEventListener("pointerdown", () => canvas.focus({ preventScroll: true }));
  ctx.onCleanup(() => {
    app.quit();
    if (k._k.k === k) k._k.k = null;
    // the AudioContext is still decoding the built-in burp sound right after start-up
    const close = (tries) => {
      if (audio.burpSnd?.buf || tries > 20) audio.ctx.close().catch(() => {});
      else setTimeout(() => close(tries + 1), 150);
    };
    close(0);
    const ext = gl && gl.getExtension("WEBGL_lose_context");
    if (ext) ext.loseContext();
  });
  return k;
}
const ready = (ctx, k) => new Promise((resolve, reject) => {
  k.onLoad(resolve);
  ctx.onCleanup(() => reject(unmounted()));
});
// Canvas text is rasterised into a glyph atlas on first use, so wait for the web fonts first.
async function fontsReady(ctx) {
  await document.fonts.ready;
  if (!ctx.active) throw unmounted();
}
// Layout-dependent KAPLAY scenes rebuild once a new size settles. Call inside the scene function:
// go() clears every event handler registered by the previous scene.
function restartOnResize(ctx, k, name, ...args) {
  const w0 = k.width(), h0 = k.height();
  let id = 0;
  k.onResize(() => {
    clearTimeout(id);
    id = setTimeout(() => {
      if (ctx.active && k.getSceneName() === name && (k.width() !== w0 || k.height() !== h0)) k.go(name, ...args);
    }, 200);
  });
}
const fpsOf = (k) => Math.round(k.debug.fps());

// ---------- scene 2 level data ----------
const TS = 32, LV_W = 64, LV_H = 14;
const LV_PITS = new Set([14, 15, 16, 33, 34, 35, 50, 51]);
const LV_COINS = [[4, 11], [5, 11], [7, 8], [9, 8], [13, 7], [15, 7], [17, 7], [15, 10], [23, 5], [25, 5], [29, 7],
  [34, 10], [37, 5], [39, 5], [40, 8], [44, 9], [48, 7], [51, 7], [50, 10], [56, 5], [58, 5], [61, 11]];
const LV_CHECKPOINTS = [2, 11, 18, 22, 37, 47, 52];
const LV_SLIMES = [[4, 12], [27, 31.5], [55, 60]];
function levelRows() {
  const g = Array.from({ length: LV_H }, () => Array(LV_W).fill(" "));
  for (let x = 0; x < LV_W; x++) if (!LV_PITS.has(x)) { g[12][x] = "="; g[13][x] = "%"; }
  for (const x of [24, 25, 44, 45]) g[11][x] = "^";
  for (const y of [10, 11]) g[y][20] = "#";
  for (const y of [9, 10, 11]) g[y][40] = "#";
  for (const [a, b, y] of [[6, 10, 9], [12, 18, 8], [27, 31, 8], [36, 41, 6], [47, 52, 8], [55, 59, 6]]) {
    for (let x = a; x <= b; x++) g[y][x] = "-";
  }
  for (let x = 22; x <= 26; x++) g[6][x] = "B";
  for (const [x, y] of LV_COINS) g[y][x] = "$";
  g[11][62] = "F";
  return g.map((r) => r.join(""));
}
function levelSprites(k) {
  const spr = (name, w, h, draw) => k.loadSprite(name, canvas2d(w, h, draw));
  spr("grass", 32, 32, (g) => {
    g.fillStyle = "#262c3a"; g.fillRect(0, 0, 32, 32);
    g.fillStyle = "#30384a"; g.fillRect(5, 16, 6, 6); g.fillRect(20, 24, 7, 5);
    g.fillStyle = "#7bd389"; g.fillRect(0, 0, 32, 8);
    g.fillStyle = "#5cb06b"; g.fillRect(0, 8, 32, 3);
  });
  spr("dirt", 32, 32, (g) => {
    g.fillStyle = "#262c3a"; g.fillRect(0, 0, 32, 32);
    g.fillStyle = "#30384a"; g.fillRect(4, 6, 6, 6); g.fillRect(19, 18, 8, 6);
  });
  spr("plank", 32, 12, (g) => {
    g.fillStyle = "#343c50"; g.fillRect(0, 0, 32, 12);
    g.fillStyle = "#4cc9f0"; g.fillRect(0, 0, 32, 4);
    g.fillStyle = "#2a3040"; g.fillRect(31, 0, 1, 12);
  });
  spr("wall", 32, 32, (g) => {
    g.fillStyle = "#3a4256"; g.fillRect(0, 0, 32, 32);
    g.strokeStyle = "#262c3a"; g.lineWidth = 2; g.strokeRect(1, 1, 30, 30);
    g.fillStyle = "#4a5470"; g.fillRect(4, 4, 24, 4);
  });
  spr("brick", 32, 32, (g) => {
    g.fillStyle = "#ff8c42"; g.fillRect(0, 0, 32, 32);
    g.fillStyle = "#c9652a"; g.fillRect(0, 15, 32, 2); g.fillRect(15, 0, 2, 15); g.fillRect(7, 17, 2, 15); g.fillRect(23, 17, 2, 15);
  });
  spr("spike", 32, 32, (g) => {
    g.fillStyle = "#c9c7bd";
    const s = 32 / 3;
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(i * s, 32); g.lineTo(i * s + s / 2, 14); g.lineTo(i * s + s, 32); g.fill(); }
  });
  spr("kcoin", 32, 32, (g) => {
    g.fillStyle = "#8a7a00"; g.beginPath(); g.arc(16, 16, 11, 0, Math.PI * 2); g.fill();
    g.fillStyle = C.c1; g.beginPath(); g.arc(16, 16, 8.5, 0, Math.PI * 2); g.fill();
  });
  spr("slime", 30, 22, (g) => {
    g.fillStyle = C.c3; g.beginPath(); g.roundRect(0, 0, 30, 22, [11, 11, 3, 3]); g.fill();
    g.fillStyle = "#ffffff"; g.beginPath(); g.arc(10, 9, 4, 0, Math.PI * 2); g.arc(20, 9, 4, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#1a1a14"; g.beginPath(); g.arc(11, 10, 2, 0, Math.PI * 2); g.arc(21, 10, 2, 0, Math.PI * 2); g.fill();
  });
  spr("flag", 32, 96, (g) => {
    g.fillStyle = "#c9c7bd"; g.fillRect(4, 2, 3, 94);
    g.fillStyle = C.c4; g.beginPath(); g.moveTo(7, 6); g.lineTo(30, 17); g.lineTo(7, 28); g.fill();
  });
}

const ROCKS = ["#f72585", "#ff8c42", "#9d8cff", "#4cc9f0"];

Showcase.run({ scenes: [
  {
    id: "dodge", title: "豆豆躲隕石",
    api: "kaplay({ canvas, global: false })・scene() / go()・add([sprite(), area(), …])・onCollide()・lifespan()・addKaboom()・shake()",
    desc: "原版小遊戲：用 scene() 拆成標題、遊戲、結束三個場景，每個物件都是元件陣列組成的 GameObj。隕石拖尾是帶 lifespan() 的小圓點，撞到就 addKaboom() 加 shake()。自動示範每格預測隕石落點，挑最安全的位置。",
    hint: "← → 或按住拖曳移動・躲開隕石、接住金幣・點一下畫面或按方向鍵即接手",
    async mount(ctx) {
      ctx.el.classList.add("kp-night");
      ctx.html(`<div class="kp-box"></div>`);
      const say = message(ctx), show = readout(ctx);
      let auto = true, k = null, best = 0;
      const autoBtn = ctx.toggle("自動示範", true, (v) => { auto = v; say(v ? "自動示範中" : "手動操作中"); });
      ctx.button("重新開始", () => k && k.go("title"));
      const takeOver = () => {
        if (!auto) return;
        auto = false;
        autoBtn.setAttribute("aria-pressed", "false");
        say("手動操作中");
      };
      await fontsReady(ctx);
      k = kaplayIn(ctx, ctx.$(".kp-box"), { background: [0, 0, 0, 0] });
      k.loadBean();
      const { vec2, rand } = k;
      const hex = (s) => k.Color.fromHex(s);
      const INK = hex("#1a1a14");
      const label = (str, size, comps) => k.add([k.text(str, { size, font: k.FONT }), k.anchor("center"), ...comps]);

      // parallax star backdrop as a custom draw component
      const starfield = () => {
        const stars = Array.from({ length: 90 }, () => ({ x: rand(0, 1), y: rand(0, 1), r: rand(0.6, 2.2), v: rand(0.02, 0.12) }));
        k.add([k.z(-10), {
          update() { for (const s of stars) { s.y += s.v * k.dt(); if (s.y > 1) s.y -= 1; } },
          draw() {
            for (const s of stars) k.drawCircle({ pos: vec2(s.x * k.width(), s.y * k.height()), radius: s.r, color: k.WHITE, opacity: 0.25 + s.r * 0.2 });
          },
        }]);
      };
      const spawnRock = (mul = 1) => {
        const r = rand(12, 30);
        const rock = k.add([
          k.pos(rand(r, k.width() - r), -r - 10), k.circle(r), k.anchor("center"), k.color(hex(k.choose(ROCKS))),
          k.outline(3, INK), k.area(), k.rotate(0), "rock", { vy: rand(150, 250) * mul, spin: rand(-200, 200) },
        ]);
        rock.onUpdate(() => {
          rock.pos.y += rock.vy * k.dt();
          rock.angle += rock.spin * k.dt();
          if (rand() < 0.45) {
            k.add([k.pos(rock.pos.add(rand(-r, r) * 0.5, -r * 0.6)), k.circle(rand(2, 5)), k.anchor("center"),
              k.color(rock.color), k.opacity(0.6), k.lifespan(0.35, { fade: 0.3 }), k.z(-1)]);
          }
          if (rock.pos.y > k.height() + r + 10) k.destroy(rock);
        });
      };
      const spawnCoin = () => {
        const c = k.add([k.pos(rand(20, k.width() - 20), -20), k.circle(11), k.anchor("center"), k.color(hex("#f7df1e")),
          k.outline(3, hex("#8a7a00")), k.area(), k.scale(1), "coin", { vy: rand(120, 170) }]);
        c.onUpdate(() => {
          c.pos.y += c.vy * k.dt();
          c.scale = vec2(Math.abs(Math.sin(k.time() * 5)) * 0.8 + 0.2, 1);
          if (c.pos.y > k.height() + 30) k.destroy(c);
        });
      };
      const popText = (p, msg, col) => k.add([k.pos(p), k.text(msg, { size: 22, font: k.FONT }), k.anchor("center"),
        k.color(hex(col)), k.opacity(1), k.move(k.UP, 70), k.lifespan(0.7, { fade: 0.5 })]);

      // Autopilot: score candidate x positions by simulating every rock's fall for the next 1.4 s.
      const planX = (player) => {
        const w = k.width(), py = player.pos.y, x0 = player.pos.x;
        const rocks = k.get("rock"), coins = k.get("coin");
        let bestX = x0, bestCost = Infinity;
        for (let x = 30; x <= w - 30; x += 20) {
          let cost = 0.05 * Math.abs(x - x0) + 0.02 * Math.abs(x - w / 2);
          if (Math.abs(x - x0) < 25) cost -= 5;
          for (const r of rocks) {
            for (let t = 0; t <= 1.4; t += 0.05) {
              const ry = r.pos.y + r.vy * t;
              if (Math.abs(ry - py) >= r.radius + 20) continue;
              const bx = x0 + clamp(x - x0, -440 * t, 440 * t);
              if (Math.abs(bx - r.pos.x) < r.radius + 26) cost += 1000 / (t + 0.1);
            }
          }
          for (const c of coins) {
            const t = (py - c.pos.y) / c.vy;
            if (t > 0 && t < 1.4 && Math.abs(c.pos.x - x) < 25 && Math.abs(c.pos.x - x0) < 440 * t + 20) cost -= 40;
          }
          if (cost < bestCost) { bestCost = cost; bestX = x; }
        }
        return bestX;
      };

      k.scene("title", () => {
        starfield();
        const demo = () => { spawnRock(0.8); k.wait(rand(0.25, 0.6), demo); };
        demo();
        const c = k.center(), w = k.width();
        const bean = k.add([k.sprite("bean"), k.pos(c), k.anchor("center"), k.scale(1.6), k.rotate(0)]);
        bean.onUpdate(() => {
          bean.pos = k.center().add(Math.sin(k.time() * 2) * 30, -k.height() * 0.2 + Math.sin(k.time() * 4) * 8);
          bean.angle = Math.sin(k.time() * 2) * 10;
        });
        const title = label("豆豆躲隕石", Math.min(56, w / 7), [k.pos(c.add(0, 20)), k.color(hex("#f7df1e")), k.outline(4, INK), k.scale(1), k.z(5)]);
        label("躲開彩色隕石，接住金幣加分", 18, [k.pos(c.add(0, 70)), k.color(hex("#ecebe6")), k.z(5)]);
        const go1 = label("按任意鍵或點擊開始", 18, [k.pos(c.add(0, 106)), k.color(hex("#4cc9f0")), k.opacity(1), k.z(5)]);
        go1.onUpdate(() => { go1.opacity = 0.55 + Math.sin(k.time() * 5) * 0.45; });
        title.onUpdate(() => { title.scale = vec2(1 + Math.sin(k.time() * 3) * 0.03); });
        const t0 = k.time();
        let leaving = false;
        const start = () => { if (!leaving) { leaving = true; k.go("game"); } };
        k.onUpdate(() => { if (auto && k.time() - t0 > 1.2) start(); });
        k.onKeyPress(() => { takeOver(); start(); });
        k.onMousePress(() => { takeOver(); start(); });
        restartOnResize(ctx, k, "title");
      });

      k.scene("game", () => {
        starfield();
        let score = 0, alive = true, elapsed = 0;
        const player = k.add([k.sprite("bean"), k.pos(k.width() / 2, k.height() - 70), k.anchor("center"), k.area({ scale: 0.72 }),
          k.scale(1), k.rotate(0), "player"]);
        const hud = k.add([k.text("分數 0", { size: 22, font: k.FONT }), k.pos(16, 14), k.color(hex("#f7df1e")), k.z(10)]);
        const lvl = k.add([k.text("", { size: 15, font: k.FONT }), k.pos(16, 44), k.color(hex("#9b998f")), k.z(10)]);

        const loopRocks = () => {
          if (!alive) return;
          spawnRock(1 + elapsed * 0.03);
          if (elapsed > 12 && rand() < 0.3) spawnRock(1.2 + elapsed * 0.03);
          k.wait(Math.max(0.16, 0.6 - elapsed * 0.012), loopRocks);
        };
        loopRocks();
        k.loop(1.6, () => { if (alive) spawnCoin(); });
        k.onKeyPress(["left", "right", "a", "d"], takeOver);
        k.onMousePress(takeOver);

        player.onUpdate(() => {
          if (!alive) return;
          const dt = k.dt();
          elapsed += dt;
          score += dt * 10;
          hud.text = `分數 ${Math.floor(score)}`;

        note: "更新量的是根節點 update() 加上固定步長 fixedUpdate() 的時間：每個遊戲物件每格都要走過自己的元件 update 與事件分派，欄位也經過 getter 讀寫，數量一多就跟著線性變慢。碰撞量的是更新與繪製之間的空檔，KAPLAY 在每個固定步長後與每格更新後都會把帶 area() 的物件放進雜湊格子，同一格裡的物件逐對算出 worldArea() 再做多邊形重疊測試並觸發 onCollide，越密配對越多。繪製量的是 root.draw() 到這一格結束，同一張圖集的小球會合併成少數幾次 draw call，CPU 主要花在逐一走訪物件、計算變形並填頂點。onDraw 模式不建遊戲物件，只用陣列搬座標再呼叫 drawSprite()，可以看出物件系統本身的額外開銷。GPU 是非同步執行，實際瓶頸也可能在顯示卡。",
