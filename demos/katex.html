<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaTeX 示範：即時 LaTeX 公式編輯器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-bottom: 42px; }
  .top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg-2); border-bottom: 1px solid var(--line); min-width: 0; }
  .top b { font-size: 15px; white-space: nowrap; }
  .ex { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
  .ex::-webkit-scrollbar { display: none; }
  .ex .btn { padding: 6px 10px; font-size: 12.5px; white-space: nowrap; flex: none; }
  .panes { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.25fr); min-height: 0; }
  .pane { position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
  .pane + .pane { border-left: 1px solid var(--line); }
  .tag { position: absolute; top: 8px; right: 12px; font: 700 11px var(--mono); letter-spacing: .1em; color: var(--muted); pointer-events: none; z-index: 2; }
  textarea {
    flex: 1; width: 100%; resize: none; border: 0; outline: none; padding: 18px 18px; background: #fbfaf7; color: #2c3b46;
    font: 14px/1.75 var(--mono); tab-size: 2;
  }
  .err { min-height: 0; padding: 0 18px; font-size: 12.5px; color: var(--c3); background: #fbfaf7; }
  .err:not(:empty) { padding: 8px 18px; border-top: 1px dashed rgba(214, 31, 105, .35); }
  .view { background: var(--bg-2); }
  .pal { border-top: 1px solid var(--line); background: #fbfaf7; padding: 10px 14px 12px; }
  .pal small { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: .05em; }
  .pal div { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 5px; }
  .pal button {
    height: 40px; border: 1px solid var(--line); border-radius: 7px; background: #fff; cursor: pointer; color: #1c1c1a;
    font-size: 13px; display: grid; place-items: center; overflow: hidden; padding: 0;
  }
  .pal button:hover { border-color: var(--accent); background: #fffbe0; }
  .display {
    flex: 1; min-height: 0; display: grid; place-items: center; padding: 26px 22px 8px; overflow: hidden;
    font-size: 34px; color: #1c1c1a; transition: opacity .15s;
  }
  .display.stale { opacity: .35; }
  .display .katex-display { margin: 0; }
  .inline { white-space: nowrap; overflow: hidden; margin: 0 22px 12px; padding: 10px 14px; border-radius: 10px; background: #f6f5f1; border: 1px solid var(--line); font-size: 14px; line-height: 2; color: #3c3a34; }
  .inline small { display: block; font-size: 11px; color: var(--muted); line-height: 1.4; margin-bottom: 2px; letter-spacing: .05em; }
  .meter { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 10px 22px 14px; border-top: 1px solid var(--line); }
  .speed { line-height: 1.1; }
  .speed small { display: block; font-size: 11px; color: var(--muted); }
  .speed b { font: 700 24px var(--mono); color: var(--c4); }
  .speed b i { font: 500 12px var(--font); font-style: normal; color: var(--muted); margin-left: 3px; }
  #spark { width: 100%; height: 34px; display: block; }
  #spark rect { fill: var(--c4); opacity: .55; }
  #spark rect:last-child { opacity: 1; }
  .bench { text-align: right; }
  .bench .btn { padding: 7px 11px; font-size: 12.5px; white-space: nowrap; }
  .bench div { font-size: 11.5px; color: var(--muted); margin-top: 4px; white-space: nowrap; }
  .bench div b { color: var(--fg); font-family: var(--mono); }
  @media (max-width: 700px) {
    .top b { display: none; }
    .tag { display: none; }
    .pal { display: none; }
    .panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: 96px minmax(0, 1fr); }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
    textarea { padding: 10px 12px; font-size: 12.5px; line-height: 1.6; }
    .display { padding: 22px 12px 6px; }
    .inline { margin: 0 12px 8px; padding: 6px 10px; font-size: 13px; }
    .meter { grid-template-columns: auto minmax(0, 1fr); padding: 8px 12px 10px; gap: 10px; }
    .bench { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; text-align: left; }
    .bench div { margin: 0; }
    .speed b { font-size: 20px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="top">
    <b>KaTeX 即時公式</b>
    <div class="ex" id="examples"></div>
  </div>
  <div class="panes">
    <div class="pane">
      <span class="tag">LATEX</span>
      <textarea id="tex" spellcheck="false" aria-label="LaTeX 原始碼"></textarea>
      <div class="err" id="err" role="status"></div>
      <div class="pal"><small>點一下插入語法（按鈕本身也是 KaTeX 渲染的）</small><div id="pal"></div></div>
    </div>
    <div class="pane view">
      <span class="tag">即時預覽</span>
      <div class="display" id="display"></div>
      <p class="inline"><small>行內模式</small>放進句子裡：<span id="inl"></span>，和中文同一行排版。</p>
      <div class="meter">
        <div class="speed"><small>本次渲染</small><b id="ms">0<i>ms</i></b></div>
        <svg id="spark" viewBox="0 0 120 34" preserveAspectRatio="none" aria-label="最近 30 次渲染耗時"></svg>
        <div class="bench">
          <button class="btn primary" id="bench">連續渲染 1,000 次</button>
          <div id="benchOut">測試同步渲染的吞吐量</div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="hint">改左邊 LaTeX 即時重排・點上方範例套用</div>

<script src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js"></script>
<script>
// KaTeX: synchronous LaTeX -> HTML rendering, fast enough to re-render on every keystroke.
const EXAMPLES = [
  ["二次公式", String.raw`x = \dfrac{-b \pm \sqrt{\textcolor{#d61f69}{b^2 - 4ac}}}{2a}`],
  ["歐拉恆等式", String.raw`e^{i\pi} + 1 = 0`],
  ["旋轉矩陣", String.raw`\begin{bmatrix} x' \\ y' \end{bmatrix} = \begin{bmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{bmatrix} \begin{bmatrix} x \\ y \end{bmatrix}`],
  ["高斯積分", String.raw`\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}`],
  ["巴賽爾級數", String.raw`\sum_{n=1}^{\infty} \frac{1}{n^2} = \frac{1}{1^2} + \frac{1}{2^2} + \cdots = \frac{\pi^2}{6}`],
  ["導數定義", String.raw`f'(x) = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h}`],
  ["馬克士威", String.raw`\begin{aligned}
\nabla \cdot \mathbf{E} &= \frac{\rho}{\varepsilon_0} &
\nabla \cdot \mathbf{B} &= 0 \\
\nabla \times \mathbf{E} &= -\frac{\partial \mathbf{B}}{\partial t} &
\nabla \times \mathbf{B} &= \mu_0 \mathbf{J} + \mu_0 \varepsilon_0 \frac{\partial \mathbf{E}}{\partial t}
\end{aligned}`],
  ["分段函數", String.raw`|x| = \begin{cases} \phantom{-}x, & x \ge 0 \\ -x, & x < 0 \end{cases}`],
];

const OPTS = { throwOnError: true, strict: "ignore", output: "htmlAndMathml" };
const ta = document.getElementById("tex");
const display = document.getElementById("display");
const inl = document.getElementById("inl");
const errEl = document.getElementById("err");
const msEl = document.getElementById("ms");
const spark = document.getElementById("spark");
const benchOut = document.getElementById("benchOut");
const exWrap = document.getElementById("examples");
const times = [];
const BASE_SIZE = () => (innerWidth < 700 ? 26 : 34);

// Shrink the display formula until it fits its box (long matrices / aligned blocks).
function fit() {
  let size = BASE_SIZE();
  display.style.fontSize = size + "px";
  const box = display.getBoundingClientRect();
  const inner = display.firstElementChild;
  if (!inner) return;
  for (let i = 0; i < 12; i++) {
    const r = inner.getBoundingClientRect();
    if (r.width <= box.width - 24 && r.height <= box.height - 16) break;
    size = Math.max(11, size * 0.88);
    display.style.fontSize = size + "px";
  }
}

function drawSpark() {
  const max = Math.max(1, ...times);
  const w = 120 / 30;
  spark.innerHTML = times.map((v, i) => {
    const h = Math.max(1.5, (v / max) * 32);
    return `<rect x="${(30 - times.length + i) * w + 0.6}" y="${34 - h}" width="${w - 1.2}" height="${h}" rx="1"></rect>`;
  }).join("");
}

function render() {
  const tex = ta.value;
  const t0 = performance.now();
  try {
    katex.render(tex, display, { ...OPTS, displayMode: true });
  } catch (e) {
    // keep the last good render, dimmed, and show KaTeX's parse error
    display.classList.add("stale");
    errEl.textContent = "語法錯誤：" + (e instanceof katex.ParseError ? e.rawMessage || e.message : e.message);
    return;
  }
  const ms = performance.now() - t0;
  display.classList.remove("stale");
  errEl.textContent = "";
  katex.render(tex, inl, { ...OPTS, displayMode: false });
  msEl.innerHTML = `${ms < 10 ? ms.toFixed(2) : ms.toFixed(1)}<i>ms</i>`;
  times.push(ms);
  if (times.length > 30) times.shift();
  drawSpark();
  fit();
}

EXAMPLES.forEach(([label, tex], i) => {
  const b = document.createElement("button");
  b.className = "btn";
  b.textContent = label;
  b.setAttribute("aria-pressed", i === 0);
  b.addEventListener("click", () => {
    exWrap.querySelectorAll(".btn").forEach((x) => x.setAttribute("aria-pressed", x === b));
    ta.value = tex;
    render();
  });
  exWrap.append(b);
});

// Snippet palette: each button face is itself rendered by KaTeX.
// [button face, inserted text]; the caret lands inside the first empty {} if any.
const SNIPPETS = [
  [String.raw`\frac{a}{b}`, String.raw`\frac{}{}`], [String.raw`\sqrt{x}`, String.raw`\sqrt{}`], ["x^{2}", "^{}"], ["x_{i}", "_{}"],
  [String.raw`\sum_{i=1}^{n}`, String.raw`\sum_{i=1}^{n} `], [String.raw`\int_{a}^{b}`, String.raw`\int_{a}^{b} `],
  [String.raw`\lim_{x\to 0}`, String.raw`\lim_{x \to 0} `], [String.raw`\vec{v}`, String.raw`\vec{v}`],
  [String.raw`\binom{n}{k}`, String.raw`\binom{n}{k}`], [String.raw`\alpha`, String.raw`\alpha `], [String.raw`\pi`, String.raw`\pi `],
  [String.raw`\infty`, String.raw`\infty `], [String.raw`\le`, String.raw`\le `], [String.raw`\neq`, String.raw`\neq `],
  [String.raw`\cdot`, String.raw`\cdot `], [String.raw`\pm`, String.raw`\pm `],
];
const pal = document.getElementById("pal");
for (const [face, ins] of SNIPPETS) {
  const caret = ins.includes("{}") ? ins.indexOf("{}") + 1 : ins.length;
  const b = document.createElement("button");
  b.title = ins.trim();
  b.innerHTML = katex.renderToString(face, { throwOnError: false });
  b.addEventListener("click", () => {
    const start = ta.selectionStart;
    ta.setRangeText(ins, start, ta.selectionEnd, "end");
    ta.focus();
    ta.setSelectionRange(start + caret, start + caret);
    ta.dispatchEvent(new Event("input"));
  });
  pal.append(b);
}

ta.addEventListener("input", () => {
  exWrap.querySelectorAll(".btn").forEach((x) => x.setAttribute("aria-pressed", "false"));
  render();
});

document.getElementById("bench").addEventListener("click", () => {
  const tex = ta.value;
  const N = 1000;
  try { katex.renderToString(tex, OPTS); } catch (e) { benchOut.textContent = "請先修正語法錯誤"; return; }
  const t0 = performance.now();
  for (let i = 0; i < N; i++) katex.renderToString(tex, { ...OPTS, displayMode: true });
  const total = performance.now() - t0;
  const avg = total / N;
  benchOut.innerHTML = `共 <b>${total.toFixed(0)}</b> ms，平均 <b>${avg.toFixed(3)}</b> ms，約每秒 <b>${Math.round(1000 / avg).toLocaleString()}</b> 個`;
});

addEventListener("resize", fit);
// Warm-up: time one real render of every example so the sparkline starts with data.
for (const [, tex] of EXAMPLES) {
  const t0 = performance.now();
  katex.renderToString(tex, { ...OPTS, displayMode: true });
  times.push(performance.now() - t0);
}
ta.value = EXAMPLES[0][1];
render();
</script>
</body>
</html>
