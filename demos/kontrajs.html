<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontra 示範：七個場景看懂迷你遊戲引擎與上限</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="_shared/showcase.css">
<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["霓虹貪食蛇","精靈表動畫","TileEngine 地圖","Scene 攝影機","介面元件","四叉樹碰撞","極限測試"]}</script>
<style>
  .kt-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .kt-wrap iframe, .kt-stress iframe { display: block; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 10px; background: #0e1013; }
  .kt-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; }
  @media (max-width: 760px) { .kt-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); } }
</style>
</head>
<body>
<!-- Kontra keeps module-level state (default canvas, pointer, keys, seeded rand), so each scene loads it inside its own iframe (see kontraFrame). -->
<script src="_shared/showcase.js"></script>
<script>
// Kontra showcase: seven scenes from the neon snake to a 32k-sprite stress ramp.
const KONTRA = "https://cdn.jsdelivr.net/npm/kontra@10.0.2/kontra.min.mjs";
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim();
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim();
const TAU = Math.PI * 2;
const DPR = () => Math.min(2, window.devicePixelRatio || 1);
const setPressed = (b, v) => b.setAttribute("aria-pressed", String(v));

// Loads Kontra as an ES module inside a srcdoc iframe. Removing the iframe on cleanup also stops its GameLoop.
function kontraFrame(ctx, host, { pixelated = false, css = "" } = {}) {
  const f = document.createElement("iframe");
  f.title = "Kontra 畫布";
  f.srcdoc = `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0e1013;color:#ecebe6;font:13px/1.5 ${FONT}}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none${pixelated ? ";image-rendering:pixelated" : ""}}${css}</style></head>
<body><canvas></canvas><script type="module">import * as K from "${KONTRA}"; window.K = K;<\/script></body></html>`;
  host.append(f);
  ctx.onCleanup(() => f.remove());
  return new Promise((resolve, reject) => {
    f.addEventListener("load", () => {
      const win = f.contentWindow;
      if (!win || !win.K) return reject(new Error("Kontra 無法從 CDN 載入"));
      resolve({ win, doc: win.document, K: win.K, canvas: win.document.querySelector("canvas") });
    }, { once: true });
  });
}

// Keys pressed while focus is on the outer page are re-dispatched inside the iframe so Kontra's initKeys sees them.
function forwardKeys(ctx, win) {
  const fwd = (e) => {
    const t = e.target;
    if (t.closest && t.closest("input,select,textarea,[role=tab]")) return;
    if (t.closest && t.closest("button") && (e.code === "Space" || e.code === "Enter")) return;
    if (/^Arrow|^Space$/.test(e.code)) e.preventDefault();
    win.dispatchEvent(new win.KeyboardEvent(e.type, { code: e.code, key: e.key }));
  };
  ctx.on(document, "keydown", fwd);
  ctx.on(document, "keyup", fwd);
}

async function boot(ctx, opts) {
  ctx.html(`<div class="kt-wrap"></div>`);
  const fr = await kontraFrame(ctx, ctx.$(".kt-wrap"), opts);
  const { context: g } = fr.K.init(fr.canvas);
  forwardKeys(ctx, fr.win);
  return { ...fr, g };
}

// Matches the canvas backing store to its CSS size times ratio; returns true when it changed.
function fitCanvas(canvas, ratio) {
  const w = Math.max(1, Math.round(canvas.clientWidth * ratio)), h = Math.max(1, Math.round(canvas.clientHeight * ratio));
  if (canvas.width === w && canvas.height === h) return false;
  canvas.width = w; canvas.height = h;
  return true;
}

Showcase.run({ scenes: [
  {
    id: "snake", title: "霓虹貪食蛇",
    api: "GameLoop・Sprite・Pool・Text・onKey・onPointer",
    desc: "原本的招牌示範移植過來：GameLoop 以固定 1/60 秒步進更新，蛇身在格子之間補間；果實與金色星星是自訂 render 的 Sprite，爆開的粒子來自 Pool 物件池，得分飄字是 Text。預設由自動駕駛展示，按方向鍵、WASD 或滑動就換你玩。",
    hint: "方向鍵／WASD 或滑動轉向；點畫面接手遊戲，撞牆後按任意鍵重來",
    async mount(ctx) {
      const { K, win, canvas, g } = await boot(ctx);
      K.initKeys(); K.initPointer();
      const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
      let W = 0, H = 0, dpr = 1, cell = 24, cols = 20, rows = 14, ox = 0, oy = 0;
      let mode = "auto", snake = [], prev = [], dir = "right", queue = [], grow = 0, food = null, star = null;
      let score = 0, best = 0, stepMs = 130, acc = 0, shake = 0, overAt = 0, dieTimer = 0, popups = [];
      const particles = K.Pool({ create: K.Sprite, maxSize: 600 });

      function layout(resetGrid) {
        W = canvas.clientWidth; H = canvas.clientHeight; dpr = DPR();
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        const top = 44, bottom = 10, side = 20;
        if (resetGrid) {
          cell = K.clamp(16, 32, Math.floor(Math.min(W, H) / 13));
          cols = Math.max(10, Math.floor((W - side) / cell));
          rows = Math.max(8, Math.floor((H - top - bottom) / cell));
        }
        cell = Math.min((W - side) / cols, (H - top - bottom) / rows);
        ox = (W - cols * cell) / 2; oy = top + (H - top - bottom - rows * cell) / 2;
      }
      const key = (x, y) => y * cols + x;
      const inside = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows;
      const center = (gx, gy) => [ox + (gx + 0.5) * cell, oy + (gy + 0.5) * cell];
      function occupied(x, y, ignoreTail) {
        const n = snake.length - (ignoreTail ? 1 : 0);
        for (let i = 0; i < n; i++) if (snake[i].x === x && snake[i].y === y) return true;
        return false;
      }
      function freeCell() {
        for (let i = 0; i < 500; i++) {
          const x = K.randInt(0, cols - 1), y = K.randInt(0, rows - 1);
          if (occupied(x, y) || (food && food.gx === x && food.gy === y) || (star && star.gx === x && star.gy === y)) continue;
          return { x, y };
        }
        return { x: 0, y: 0 };
      }
      function makeFood(bonus) {
        const c = freeCell();
        return K.Sprite({
          gx: c.x, gy: c.y, life: bonus ? 6 : Infinity,
          render() {
            const t = performance.now() / 1000, r = cell * (0.32 + Math.sin(t * 6) * 0.04), x = this.context, col = bonus ? "#f7df1e" : "#f72585";
            x.shadowColor = col; x.shadowBlur = cell * 0.6; x.fillStyle = col;
            if (bonus) {
              x.beginPath();
              for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5 + t, rr = i % 2 ? r * 0.5 : r * 1.15; x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
              x.closePath(); x.fill();
              x.shadowBlur = 0; x.strokeStyle = "rgba(247,223,30,.6)"; x.lineWidth = 2;
              x.beginPath(); x.arc(0, 0, cell * 0.62, -Math.PI / 2, -Math.PI / 2 + TAU * (this.life / 6)); x.stroke();
            } else {
              x.beginPath(); x.arc(0, 0, r, 0, TAU); x.fill();
              x.shadowBlur = 0; x.fillStyle = "#7bd389";
              x.beginPath(); x.ellipse(r * 0.35, -r * 1.05, r * 0.38, r * 0.18, -0.5, 0, TAU); x.fill();
            }
          },
        });
      }
      function dot() {
        const x = this.context;
        x.globalAlpha = Math.min(1, this.ttl / 25); x.fillStyle = this.color;
        x.beginPath(); x.arc(0, 0, this.size, 0, TAU); x.fill();
      }
      function burst(px, py, color, n, speed = 4) {
        for (let i = 0; i < n; i++) {
          const a = Math.random() * TAU, v = Math.random() * speed + 1;
          particles.get({ x: px, y: py, dx: Math.cos(a) * v, dy: Math.sin(a) * v, ttl: K.randInt(20, 45), color, size: Math.random() * 3 + 2, render: dot });
        }
      }
      function popup(text, px, py, color) {
        popups.push(K.Text({ text, x: px, y: py, anchor: { x: 0.5, y: 0.5 }, font: `bold ${Math.round(cell * 0.8)}px ${FONT}`, color, ttl: 50 }));
      }
      function reset() {
        const tall = rows > cols;
        const sx = tall ? Math.floor(cols / 2) : Math.floor(cols / 3), sy = tall ? Math.floor(rows * 2 / 3) : Math.floor(rows / 2);
        snake = [];
        for (let i = 0; i < 4; i++) snake.push(tall ? { x: sx, y: sy + i } : { x: sx - i, y: sy });
        prev = snake.map((s) => ({ ...s }));
        dir = tall ? "up" : "right"; queue = []; grow = 0; score = 0; stepMs = 130; acc = -500;
        star = null; food = null; food = makeFood(false);
      }
      function turn(d) {
        if (mode !== "play") return;
        const last = queue.length ? queue[queue.length - 1] : dir;
        const [lx, ly] = DIRS[last], [nx, ny] = DIRS[d];
        if (d === last || (lx + nx === 0 && ly + ny === 0)) return;
        if (queue.length < 2) queue.push(d);
      }
      // Flood fill from a cell, bounded by 3x the body length: tells the autopilot whether a move leaves enough room.
      function reachable(x0, y0) {
        const seen = new Set(), stack = [[x0, y0]], limit = snake.length * 3;
        for (let i = 0; i < snake.length - 1; i++) seen.add(key(snake[i].x, snake[i].y));
        let n = 0;
        while (stack.length && n < limit) {
          const [x, y] = stack.pop(), k = key(x, y);
          if (!inside(x, y) || seen.has(k)) continue;
          seen.add(k); n++;
          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
        return n;
      }
      function autopilot() {
        const h = snake[0], target = star || food, len = snake.length, [cx, cy] = DIRS[dir];
        let pick = dir, bestScore = Infinity;
        for (const d in DIRS) {
          const [dx, dy] = DIRS[d];
          if (dx + cx === 0 && dy + cy === 0) continue;
          const nx = h.x + dx, ny = h.y + dy;
          if (!inside(nx, ny) || occupied(nx, ny, true)) continue;
          const room = reachable(nx, ny);
          const s = Math.abs(target.gx - nx) + Math.abs(target.gy - ny) + (room < len ? 1000 - room : 0);
          if (s < bestScore) { bestScore = s; pick = d; }
        }
        dir = pick;
      }
      function step() {
        prev = snake.map((s) => ({ ...s }));
        if (mode === "auto") autopilot(); else if (queue.length) dir = queue.shift();
        const [dx, dy] = DIRS[dir], h = snake[0], nx = h.x + dx, ny = h.y + dy;
        if (!inside(nx, ny) || occupied(nx, ny, grow === 0)) return die();
        snake.unshift({ x: nx, y: ny });
        if (grow > 0) { grow--; prev.push({ ...prev[prev.length - 1] }); } else snake.pop();
        const [px, py] = center(nx, ny);
        if (star && star.gx === nx && star.gy === ny) {
          grow += 3; star = null;
          if (mode === "play") { score += 50; popup("+50", px, py - cell * 0.6, "#f7df1e"); }
          burst(px, py, "#f7df1e", 40, 6); shake = 6;
        } else if (food.gx === nx && food.gy === ny) {
          grow += 1; food = makeFood(false);
          if (mode === "play") { score += 10; popup("+10", px, py - cell * 0.6, "#ecebe6"); }
          burst(px, py, "#f72585", 18);
          if (!star && Math.random() < 0.3) star = makeFood(true);
        }
        stepMs = Math.max(65, 130 - snake.length * 1.6);
      }
      function die() {
        if (mode === "auto") { const [px, py] = center(snake[0].x, snake[0].y); burst(px, py, "#4cc9f0", 30); reset(); return; }
        mode = "dying"; dieTimer = 0; shake = 14; best = Math.max(best, score);
      }
      function start() { mode = "play"; layout(true); reset(); }
      function goAuto() { mode = "auto"; setPressed(autoBtn, true); layout(true); reset(); }

      function update(dt) {
        if (mode === "play" || mode === "auto") {
          acc += dt * 1000;
          while ((mode === "play" || mode === "auto") && acc >= (mode === "auto" ? 95 : stepMs)) { acc -= mode === "auto" ? 95 : stepMs; step(); }
          if (star) { star.life -= dt; if (star.life <= 0) star = null; }
        } else if (mode === "dying") {
          dieTimer += dt;
          while (dieTimer > 0.04 && snake.length) {
            dieTimer -= 0.04;
            const s = snake.shift(); prev.shift();
            const [px, py] = center(s.x, s.y);
            burst(px, py, `hsl(${190 + Math.random() * 80} 85% 62%)`, 10, 5);
          }
          if (!snake.length) { mode = "over"; overAt = performance.now(); }
        } else if (mode === "over" && performance.now() - overAt > 8000) goAuto();
        particles.update();
        popups = popups.filter((p) => { p.y -= 1; p.ttl--; p.opacity = Math.min(1, p.ttl / 25); return p.ttl > 0; });
        shake *= 0.86;
      }
      function drawBoard() {
        g.fillStyle = "rgba(255,255,255,.025)"; g.strokeStyle = "rgba(76,201,240,.35)"; g.lineWidth = 2;
        g.beginPath(); g.roundRect(ox - 4, oy - 4, cols * cell + 8, rows * cell + 8, 10); g.fill(); g.stroke();
        g.fillStyle = "rgba(255,255,255,.07)";
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) g.fillRect(ox + (x + 0.5) * cell - 1, oy + (y + 0.5) * cell - 1, 2, 2);
      }
      function drawSnake(t) {
        const n = snake.length;
        for (let i = n - 1; i >= 0; i--) {
          const a = prev[i] || snake[i], b = snake[i];
          const [x, y] = center(K.lerp(a.x, b.x, t), K.lerp(a.y, b.y, t));
          const hue = 190 + (i / Math.max(1, n - 1)) * 80, sz = cell * (i === 0 ? 0.9 : 0.8 - (i / n) * 0.2);
          g.fillStyle = `hsl(${hue} 85% 62%)`; g.shadowColor = `hsl(${hue} 90% 60%)`; g.shadowBlur = cell * (i === 0 ? 0.7 : 0.3);
          g.beginPath(); g.roundRect(x - sz / 2, y - sz / 2, sz, sz, sz * 0.35); g.fill();
        }
        g.shadowBlur = 0;
        if (!n) return;
        const [dx, dy] = DIRS[dir], h = snake[0], p = prev[0] || h;
        const [x, y] = center(K.lerp(p.x, h.x, t), K.lerp(p.y, h.y, t));
        for (const s of [-1, 1]) {
          const ex = x + dx * cell * 0.18 + dy * s * cell * 0.2, ey = y + dy * cell * 0.18 - dx * s * cell * 0.2;
          g.fillStyle = "#fff"; g.beginPath(); g.arc(ex, ey, cell * 0.13, 0, TAU); g.fill();
          g.fillStyle = "#0e1013"; g.beginPath(); g.arc(ex + dx * cell * 0.05, ey + dy * cell * 0.05, cell * 0.065, 0, TAU); g.fill();
        }
      }
      function hud() {
        g.font = `bold ${W > 520 ? 18 : 15}px ${FONT}`; g.textBaseline = "middle";
        g.textAlign = "left"; g.fillStyle = mode === "auto" ? "#9d8cff" : "#f7df1e";
        g.fillText(mode === "auto" ? "展示模式（自動駕駛）" : `分數 ${score}`, 14, 22);
        g.textAlign = "right"; g.fillStyle = "#9b998f";
        g.fillText(`長度 ${snake.length}　最高 ${best}`, W - 14, 22);
      }
      function overCard() {
        const w = Math.min(W - 40, 360), h = 150, x = (W - w) / 2, y = (H - h) / 2;
        g.fillStyle = "rgba(14,16,19,.78)"; g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 1;
        g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill(); g.stroke();
        const grad = g.createLinearGradient(x, 0, x + w, 0);
        grad.addColorStop(0, "#7bd389"); grad.addColorStop(0.5, "#4cc9f0"); grad.addColorStop(1, "#9d8cff");
        g.textAlign = "center"; g.textBaseline = "middle";
        g.font = `bold 30px ${FONT}`; g.fillStyle = grad; g.fillText("撞到了！", W / 2, y + 40);
        g.font = `bold 16px ${FONT}`; g.fillStyle = "#ecebe6"; g.fillText(`分數 ${score}　最高 ${best}`, W / 2, y + 82);
        g.globalAlpha = Math.floor(performance.now() / 600) % 2 ? 0.25 : 1;
        g.font = `14px ${FONT}`; g.fillStyle = "#f7df1e"; g.fillText("按任意鍵或點擊再玩一次", W / 2, y + 118);
        g.globalAlpha = 1;
      }
      function render() {
        if (!canvas.clientWidth || !canvas.clientHeight) return;
        if (canvas.clientWidth !== W || canvas.clientHeight !== H || DPR() !== dpr) { layout(mode === "auto"); if (mode === "auto") reset(); }
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.fillStyle = "#0e1013"; g.fillRect(0, 0, W, H);
        g.save();
        if (shake > 0.3) g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        drawBoard();
        for (const f of [food, star]) if (f) { [f.x, f.y] = center(f.gx, f.gy); f.render(); }
        drawSnake(K.clamp(0, 1, acc / (mode === "auto" ? 95 : stepMs)));
        particles.render();
        for (const p of popups) p.render();
        g.restore();
        hud();
        if (mode === "over") overCard();
      }

      const autoBtn = ctx.toggle("自動展示", true, (v) => (v ? goAuto() : start()));
      ctx.button("重新開始", () => { setPressed(autoBtn, false); start(); });
      const takeOver = () => { setPressed(autoBtn, false); start(); };
      const steer = (d) => { if (mode === "auto") takeOver(); turn(d); };
      K.onKey(["arrowup", "w"], () => steer("up"));
      K.onKey(["arrowdown", "s"], () => steer("down"));
      K.onKey(["arrowleft", "a"], () => steer("left"));
      K.onKey(["arrowright", "d"], () => steer("right"));
      win.addEventListener("keydown", () => { if (mode === "over" && performance.now() - overAt > 500) start(); });
      let down = null;
      K.onPointer("down", () => { const p = K.getPointer(); down = { x: p.x / dpr, y: p.y / dpr }; });
      K.onPointer("up", () => {
        if (!down) return;
        const p = K.getPointer(), px = p.x / dpr, py = p.y / dpr, dx = px - down.x, dy = py - down.y;
        down = null;
        if (mode === "over") { if (performance.now() - overAt > 500) start(); return; }
        if (mode === "auto") { takeOver(); if (Math.hypot(dx, dy) <= 24) return; }
        if (mode !== "play") return;
        if (Math.hypot(dx, dy) > 24) return turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
        const [hx, hy] = center(snake[0].x, snake[0].y), rx = px - hx, ry = py - hy;
        turn(Math.abs(rx) > Math.abs(ry) ? (rx > 0 ? "right" : "left") : (ry > 0 ? "down" : "up"));
      });
      layout(true); reset();
      K.GameLoop({ blur: true, clearCanvas: false, update, render }).start();
    },
  },
  {
    id: "sheet", title: "精靈表動畫",
    api: "SpriteSheet・Animation・playAnimation・keyPressed",
    desc: "用程式在畫布上畫出 8×3 格、每格 32px 的像素精靈表，交給 SpriteSheet 切成 idle、walk、run、jump 等八段動畫。角色依速度與是否著地切換 playAnimation，上方即時標出目前動畫用到的格子與正在播的那一格。",
    hint: "←→ 或 A/D 走路（按住加速成跑步），↑／W／空白鍵跳；手機點左右兩側移動、點中間跳",
    async mount(ctx) {
      const { K, win, doc, canvas, g } = await boot(ctx);
      K.initKeys(); K.initPointer();
      // 32x32 pixel hero drawn with rectangles; every pose is a set of small offsets.
      function drawHero(c, x0, y0, { hop = 0, sq = 0, ll = 0, rl = 0, la = 0, ra = 0, lx = 0, rx = 0, eye = 0, mouth = 0 } = {}) {
        const px = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x0 + x, y0 + y, w, h); };
        const ol = (x, y, w, h, col) => { px(x - 1, y - 1, w + 2, h + 2, "#15171c"); px(x, y, w, h, col); };
        const feet = 31 - hop, bh = 15 - sq, bw = 14 + Math.max(0, sq), bx = 16 - (bw >> 1), by = feet - 3 - bh, sy = by + 7;
        const arm = (m, x, out) => {
          if (m === 0) ol(x, sy, 2, 5, "#e8c30f");
          else if (m === 1) ol(out < 0 ? x - 3 : x, sy, 5, 2, "#e8c30f");
          else ol(x, sy - 7, 2, 7, "#e8c30f");
        };
        arm(la, bx - 2 + lx, -1);
        px(bx - 1, by, bw + 2, bh, "#15171c"); px(bx, by - 1, bw, bh + 2, "#15171c");
        px(bx, by, bw, bh, "#f7df1e");
        px(bx, by + bh - 3, bw, 3, "#d4a20a");
        px(bx + bw - 2, by + 1, 2, bh - 4, "#e8c30f");
        px(bx + 2, by + 2, 3, 2, "#fff6b0");
        for (const x of [12 + ll, 17 + rl]) { px(x, feet - 3, 3, 2, "#5a5f6b"); px(x, feet - 1, 4, 2, "#4cc9f0"); }
        arm(ra, bx + bw + rx, 1);
        const ey = by + 4;
        for (const ex of [bx + bw - 8, bx + bw - 4]) {
          if (eye === 1) px(ex, ey + 1, 2, 1, "#15171c");

    id: "stress", title: "極限測試", kind: "stress",
    api: "Pool・Sprite.render・Quadtree・collides",
    desc: "Pool 逐級產生 4×4 的 Sprite，每個都走 Kontra 的 advance 與 render（各自 save、translate、restore）。碰撞偵測開啟時，每格重建 Quadtree，再替每個方塊查詢候選並做 collides，撞到的變粉紅。",
    hint: "按「自動加壓」逐級加量；切換碰撞偵測比較兩種負載",
    async mount(ctx) {
      ctx.html(`<div class="kt-stress"></div>`);
      const { K, canvas } = await kontraFrame(ctx, ctx.$(".kt-stress"));
      const { context: g } = K.init(canvas);
      const COLORS = ["#4cc9f0", "#7bd389", "#f7df1e", "#9d8cff"];
      let W = 1, H = 1, collide = true, checks = 0, hits = 0, updMs = 0, drawMs = 0, last = 0, qt = null;
      const fit = () => {
        if (!fitCanvas(canvas, 1)) return;
        W = canvas.width; H = canvas.height;
        qt = K.Quadtree({ maxDepth: 6, maxObjects: 16, bounds: { x: 0, y: 0, width: W, height: H } });
      };
      fit();
      function sprUpdate(dt) {
        this.advance(dt);
        if (this.x < 0) { this.x = 0; this.dx = Math.abs(this.dx); } else if (this.x > W - 4) { this.x = W - 4; this.dx = -Math.abs(this.dx); }
        if (this.y < 0) { this.y = 0; this.dy = Math.abs(this.dy); } else if (this.y > H - 4) { this.y = H - 4; this.dy = -Math.abs(this.dy); }
        if (this.hitT > 0 && --this.hitT === 0) this.color = this.base;
      }
      const pool = K.Pool({ create: K.Sprite, maxSize: 32000 });
      function spawn() {
        const a = Math.random() * TAU, v = 30 + Math.random() * 60, base = COLORS[pool.size % 4];
        pool.get({ x: Math.random() * (W - 4), y: Math.random() * (H - 4), width: 4, height: 4, dx: Math.cos(a) * v, dy: Math.sin(a) * v, color: base, base, hitT: 0, update: sprUpdate });
      }
      // Updates run here with the real frame time, once per drawn frame, so a slow frame never queues extra updates.
      function frame() {
        const now = performance.now(), dt = last ? Math.min(0.05, (now - last) / 1000) : 1 / 60;
        last = now;
        fit();
        const t0 = performance.now();
        pool.update(dt);
        checks = hits = 0;
        if (collide) {
          const alive = pool.getAliveObjects();
          qt.clear(); qt.add(alive);
          for (const o of alive) {
            for (const c of qt.get(o)) {
              checks++;
              if (K.collides(o, c)) { o.hitT = 8; o.color = "#f72585"; hits++; break; }
            }
          }
        }
        const t1 = performance.now();
        g.setTransform(1, 0, 0, 1, 0, 0);
        g.fillStyle = "#0e1013"; g.fillRect(0, 0, W, H);
        pool.render();
        const t2 = performance.now();
        updMs = updMs ? updMs * 0.9 + (t1 - t0) * 0.1 : t1 - t0;
        drawMs = drawMs ? drawMs * 0.9 + (t2 - t1) * 0.1 : t2 - t1;
      }
      ctx.controls.classList.add("bottom");
      ctx.toggle("碰撞偵測", true, (v) => { collide = v; });
      ctx.ramp({
        label: "精靈", steps: [250, 500, 1000, 2000, 4000, 8000, 16000, 32000],
        minFps: 30,
        apply(n) {
          while (pool.size < n) spawn();
          // Alive objects sit at the front of pool.objects, so shrinking size retires the tail; get() re-inits them later.
          if (pool.size > n) pool.size = n;
        },
        metrics: () => ({
          "存活": pool.size,
          "碰撞檢查": collide ? checks : "關閉",
          "命中": collide ? hits : "關閉",
          "更新": Showcase.fmtMs(updMs),
          "繪製": Showcase.fmtMs(drawMs),
        }),
        note: "瓶頸：每個 Sprite 的 render 都要 save、translate、restore；advance 每次產生新 Vector；碰撞開啟時每個方塊查一次 Quadtree，get 會建立 Set 與陣列。關掉碰撞可看出繪製上限。",
      });
      K.GameLoop({ blur: true, clearCanvas: false, update() {}, render: frame }).start();
    },
  },
] });
</script>
</body>
</html>
