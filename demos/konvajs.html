<style>

  @media (max-width: 620px) {
    .export { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); }
    .export .side { grid-template-rows: minmax(0, 1fr); grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  }

    position: absolute; top: 8px; right: 8px; bottom: calc(var(--sc-ctl-b, 0px) + 8px); left: 350px;
    border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.02); overflow: hidden;

<script src="https://cdn.jsdelivr.net/npm/konva@10.7.0/konva.min.js"></script>

<script>
// Konva.js showcase: eight scenes from the original moodboard editor to a shape-count stress ramp.
Konva.pixelRatio = Math.min(2, window.devicePixelRatio || 1);
const rootCss = getComputedStyle(document.documentElement);
const cssVar = (name, fallback) => rootCss.getPropertyValue(name).trim() || fallback;
const C = {
  c1: cssVar("--c1", "#f7df1e"), c2: cssVar("--c2", "#4cc9f0"), c3: cssVar("--c3", "#f72585"),
  c4: cssVar("--c4", "#7bd389"), c5: cssVar("--c5", "#ff8c42"), c6: cssVar("--c6", "#9d8cff"),
  fg: cssVar("--fg", "#e8e6df"), muted: cssVar("--muted", "#9b998f"),
};
const COLORS = [C.c1, C.c2, C.c3, C.c4, C.c5, C.c6];
const FONT = cssVar("--font", "system-ui, sans-serif");
const MONO = cssVar("--mono", "ui-monospace, monospace");
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const span = (lo, hi) => (lo < hi ? rnd(lo, hi) : (lo + hi) / 2);
// Y just below the top-right control cluster, so scene content starts under the buttons.
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;
const PHOTO = (i) => `_shared/img/photo-${i}.jpg`;
const HEART = "M0,-6 C-2,-12 -12,-11 -12,-3 C-12,4 -4,8 0,12 C4,8 12,4 12,-3 C12,-11 2,-12 0,-6 Z";
const CORNERS = ["top-left", "top-right", "bottom-left", "bottom-right"];
const ALL_ANCHORS = ["top-left", "top-center", "top-right", "middle-right", "middle-left", "bottom-left", "bottom-center", "bottom-right"];
const TR_STYLE = {
  padding: 6, rotateAnchorOffset: 26, anchorSize: 10, anchorCornerRadius: 3, anchorFill: C.c1,
  anchorStroke: "#1a1a14", borderStroke: C.c1, borderDash: [4, 4],
};

const imageCache = new Map();
function loadImage(src) {
  if (!imageCache.has(src)) {
    imageCache.set(src, new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => { imageCache.delete(src); reject(new Error("圖片載入失敗：" + src)); };
      img.src = src;
    }));
  }
  return imageCache.get(src);
}
// Crop rectangle that makes an image cover a w x h box (like CSS object-fit: cover).
function cover(img, w, h) {
  const s = Math.max(w / img.width, h / img.height), cw = w / s, ch = h / s;
  return { x: (img.width - cw) / 2, y: (img.height - ch) / 2, width: cw, height: ch };
}
// Small rounded caption built from Konva.Label + Tag + Text.
function chip(text, { x = 0, y = 0, color = C.fg, size = 11, mono = true, bg = "rgba(14,16,19,.8)" } = {}) {
  const label = new Konva.Label({ x, y, listening: false });
  label.add(new Konva.Tag({ fill: bg, cornerRadius: 5 }));
  label.add(new Konva.Text({ text, fontSize: size, fontFamily: mono ? MONO : FONT, fill: color, padding: 5 }));
  return label;
}
// Change a chip's text and center it on (x, y).
function placeChip(label, text, x, y) {
  label.getText().text(text);
  label.offset({ x: label.width() / 2, y: label.height() / 2 });
  label.position({ x, y });
}

// Konva.Stage that fills `box` and follows its size; destroyed when the scene unmounts.
function stageIn(ctx, box, onSize) {
  const stage = new Konva.Stage({ container: box, width: Math.max(1, box.clientWidth), height: Math.max(1, box.clientHeight) });
  ctx.onCleanup(() => stage.destroy());
  let pending = 0, lw = stage.width(), lh = stage.height();
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = box.clientWidth, h = box.clientHeight;
      if (!w || !h || (w === lw && h === lh)) return;
      lw = w; lh = h;
      stage.size({ width: w, height: h });
      if (onSize) onSize(w, h);
    });
  });
  ro.observe(box);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); });
  return stage;
}
// Tween factory: each tween plays at once and is destroyed when it finishes or the scene unmounts.
function tweener(ctx) {
  const live = new Set();
  ctx.onCleanup(() => { live.forEach((t) => t.destroy()); live.clear(); });
  return (node, cfg) => {
    const { onFinish, ...rest } = cfg;
    const t = new Konva.Tween({ node, ...rest, onFinish() { live.delete(t); t.destroy(); if (onFinish) onFinish(); } });
    live.add(t);
    t.play();
    return t;
  };
}

const FX = [
  { name: "原圖", filters: [] },
  { name: "黑白", filters: [Konva.Filters.Grayscale] },
  { name: "復古", filters: [Konva.Filters.Sepia] },
  { name: "像素", filters: [Konva.Filters.Pixelate], set: (pic, u) => pic.pixelSize(Math.max(4, Math.round(u / 22))) },
  { name: "模糊", filters: [Konva.Filters.Blur], set: (pic, u) => pic.blurRadius(Math.max(3, Math.round(u / 18))) },
];

const KINDS = [
  { zh: "圓角矩形", en: "Rect", make: (r) => new Konva.Rect({ width: r * 1.7, height: r * 1.2, offsetX: r * 0.85, offsetY: r * 0.6, cornerRadius: r * 0.22 }) },
  { zh: "圓形", en: "Circle", make: (r) => new Konva.Circle({ radius: r * 0.85 }) },
  { zh: "圓環", en: "Ring", make: (r) => new Konva.Ring({ innerRadius: r * 0.45, outerRadius: r * 0.85 }) },
  { zh: "弧形", en: "Arc", make: (r) => new Konva.Arc({ innerRadius: r * 0.42, outerRadius: r * 0.88, angle: 260, rotation: -40 }) },
  { zh: "扇形", en: "Wedge", make: (r) => new Konva.Wedge({ radius: r * 0.9, angle: 300, rotation: 30 }) },
  { zh: "星形", en: "Star", make: (r) => new Konva.Star({ numPoints: 5, innerRadius: r * 0.4, outerRadius: r * 0.92 }) },
  { zh: "正多邊形", en: "RegularPolygon", make: (r) => new Konva.RegularPolygon({ sides: 6, radius: r * 0.9 }) },
  {
    zh: "平滑曲線", en: "Line tension", make: (r) => new Konva.Line({
      points: [0, 1, 2, 3, 4, 5, 6].flatMap((k) => { const a = (k / 7) * Math.PI * 2, d = r * (k % 2 ? 0.55 : 0.9); return [Math.cos(a) * d, Math.sin(a) * d]; }),
      closed: true, tension: 0.45,
    }),
  },
  {
    zh: "箭頭", en: "Arrow", make: (r) => new Konva.Arrow({
      points: [-r * 0.9, r * 0.5, -r * 0.1, -r * 0.5, r * 0.85, r * 0.15], tension: 0.45,
      pointerLength: r * 0.32, pointerWidth: r * 0.34, lineW: Math.max(3, r * 0.11), lineCap: "round",
    }),
  },
  { zh: "SVG 路徑", en: "Path", make: (r) => new Konva.Path({ data: HEART, offsetY: 1, scaleX: r / 13, scaleY: r / 13, strokeScaleEnabled: false }) },
  {
    zh: "文字路徑", en: "TextPath", make: (r) => new Konva.TextPath({
      data: `M ${-r} ${r * 0.35} Q 0 ${-r * 0.95} ${r} ${r * 0.35}`, text: "沿著路徑走的字",
      fontSize: Math.max(10, r * 0.3), fontFamily: FONT, fontStyle: "bold",
    }),
  },
  {
    zh: "標籤", en: "Label + Tag", make: (r) => {
      const label = new Konva.Label({ y: r * 0.55 });
      label.add(new Konva.Tag({ pointerDirection: "down", pointerWidth: r * 0.35, pointerHeight: r * 0.28, cornerRadius: 8, lineJoin: "round" }));
      label.add(new Konva.Text({ text: "你好！", fontSize: Math.max(12, r * 0.42), padding: r * 0.22, fontFamily: FONT, fontStyle: "bold" }));
      return label;
    },
  },
];
// One style mode applied to any shape: 0 solid, 1 linear gradient, 2 dashed outline, 3 glow.
function paintShape(node, i, mode) {
  const c = COLORS[i % 6], c2 = COLORS[(i + 2) % 6];
  const target = node instanceof Konva.Label ? node.getTag() : node;
  const b = target.getSelfRect();
  target.setAttrs({
    fill: c, fillEnabled: mode !== 2, fillPriority: mode === 1 ? "linear-gradient" : "color",
    fillLinearGradientStartPoint: { x: b.x, y: b.y }, fillLinearGradientEndPoint: { x: b.x + b.width, y: b.y + b.height },
    fillLinearGradientColorStops: [0, c, 1, c2],
    stroke: c, strokeEnabled: mode === 2, strokeWidth: 3, dash: [9, 6], dashEnabled: mode === 2,
    shadowColor: c, shadowBlur: 24, shadowOpacity: 0.9, shadowOffset: { x: 0, y: 0 }, shadowEnabled: mode === 3,
  });
  if (node instanceof Konva.Arrow) node.setAttrs({ strokeEnabled: true, strokeWidth: node.getAttr("lineW") });
  if (node instanceof Konva.TextPath && mode === 2) node.setAttrs({ strokeWidth: 1, dashEnabled: false });
  if (node instanceof Konva.Label) node.getText().fill(mode === 2 ? c : "#0e1013");
}

const FURNITURE = [
  { name: "地毯", w: 2.8, h: 1.9, x: 2.6, y: 2.9, color: C.c3, rug: true },
  { name: "電視櫃", w: 1.8, h: 0.45, x: 2.6, y: 0.4, color: C.c1 },
  { name: "茶几", w: 1.2, h: 0.6, x: 2.6, y: 2.9, color: C.c5 },
  { name: "沙發", w: 2.2, h: 0.9, x: 2.6, y: 4.4, color: C.c6 },
  { name: "餐桌", w: 1.6, h: 1.8, x: 6.2, y: 1.6, color: C.c4, chairs: true },
  { name: "書桌", w: 1.4, h: 0.7, x: 6.3, y: 4.25, color: C.c2 },
  { name: "植物", w: 0.6, h: 0.6, x: 0.45, y: 4.45, color: C.c4, plant: true },
];

const FILTER_TILES = [
  { zh: "模糊", f: "Blur", set: (n, s) => n.blurRadius(Math.round(s * 20)), show: (n) => `blurRadius ${n.blurRadius()}` },
  { zh: "亮度", f: "Brightness", set: (n, s) => n.brightness(+(0.25 + s * 1.5).toFixed(2)), show: (n) => `brightness ${n.brightness().toFixed(2)}` },
  { zh: "對比", f: "Contrast", set: (n, s) => n.contrast(Math.round(s * 90)), show: (n) => `contrast ${n.contrast()}` },
  { zh: "色相", f: "HSL", set: (n, s) => n.hue(Math.round(s * 359)), show: (n) => `hue ${n.hue()}°` },
  { zh: "像素化", f: "Pixelate", set: (n, s) => n.pixelSize(1 + Math.round(s * 24)), show: (n) => `pixelSize ${n.pixelSize()}` },
  { zh: "色階", f: "Posterize", set: (n, s) => n.levels(+(0.02 + (1 - s) * 0.12).toFixed(3)), show: (n) => `levels ${n.levels()}` },
  { zh: "雜訊", f: "Noise", set: (n, s) => n.noise(+(s * 0.8).toFixed(2)), show: (n) => `noise ${n.noise()}` },
  { zh: "萬花筒", f: "Kaleidoscope", set: (n, s) => { n.kaleidoscopePower(2); n.kaleidoscopeAngle(Math.round(s * 360)); }, show: (n) => `angle ${n.kaleidoscopeAngle()}°` },
];

const EASINGS = [
  ["Linear", "線性"], ["EaseInOut", "緩入緩出"], ["StrongEaseOut", "強力減速"],
  ["BackEaseOut", "超出回彈"], ["ElasticEaseOut", "彈簧"], ["BounceEaseOut", "落地彈跳"],
];

Showcase.run({ scenes: [
  {
    id: "board", title: "靈感板",
    api: "new Konva.Transformer({ nodes, keepRatio, rotationSnaps })・node.moveUp()・image.cache() + filters()",
    desc: "照片、便利貼與貼紙都是同一個 Layer 裡的節點：Transformer 提供縮放旋轉把手（旋轉吸附 90°），moveUp／moveDown 調前後順序，照片 cache() 後套 Konva.Filters，「重排」用補間移動。",
    hint: "拖曳移動・拉角落把手縮放旋轉・點照片後切換濾鏡・按「重排」",
    async mount(ctx) {
      ctx.el.classList.add("cork");
      ctx.html(`<div class="kv"></div><div class="panel layers"><h3>圖層（上到下）</h3><ol></ol></div>`);
      const listEl = ctx.$(".layers ol"), layersEl = ctx.$(".layers");
      const seg = ctx.group(FX.map((f) => f.name), 0, (i) => setFx(i));
      const upBtn = ctx.button("上移", () => restack(1));
      const downBtn = ctx.button("下移", () => restack(-1));
      ctx.button("重排", shuffle, { primary: true });
      const stage = stageIn(ctx, ctx.$(".kv"), relayout);
      const layer = new Konva.Layer();
      stage.add(layer);
      const tween = tweener(ctx);
      const tr = new Konva.Transformer({ ...TR_STYLE, keepRatio: true, enabledAnchors: CORNERS, rotationSnaps: [0, 90, 180, 270], rotationSnapTolerance: 6 });
      layer.add(tr);
      let selected = null;
      let box = area();
      const u = clamp(Math.min(box.w / 3.4, box.h / 2.5), 80, 240);

      function area() {
        const top = belowControls(ctx), right = layersEl.offsetParent ? layersEl.offsetWidth + 20 : 0;
        return { x: 10, y: top, w: Math.max(120, stage.width() - 20 - right), h: Math.max(120, stage.height() - top - 10) };
      }
      const at = (fx, fy) => ({ x: box.x + box.w * fx, y: box.y + box.h * fy });
      const items = () => layer.getChildren((n) => n.hasName("item"));
      const picOf = (n) => (n instanceof Konva.Group ? n.findOne(".pic") : null);
      function item(node, label, swatch) {
        node.setAttrs({ name: "item", draggable: true, label, swatch });
        layer.add(node);
        return node;
      }
      function photo(img, caption, fx, fy, rot, swatch) {
        const pad = u * 0.06, iw = u - pad * 2, ih = iw * (img.height / img.width), capH = u * 0.2, w = u, h = pad + ih + capH;
        const g = new Konva.Group({ ...at(fx, fy), rotation: rot, offsetX: w / 2, offsetY: h / 2 });
        g.add(new Konva.Rect({ width: w, height: h, fill: "#f7f4ec", cornerRadius: 3, shadowColor: "#000", shadowBlur: 22, shadowOpacity: 0.5, shadowOffset: { x: 4, y: 10 } }));
        const pic = new Konva.Image({ image: img, x: pad, y: pad, width: iw, height: ih, name: "pic" });
        g.add(pic);
        g.add(new Konva.Text({ text: caption, y: pad + ih + capH * 0.22, width: w, align: "center", fontSize: capH * 0.42, fill: "#3a3833", fontFamily: FONT }));
        g.add(new Konva.Rect({ x: w / 2 - u * 0.17, y: -u * 0.05, width: u * 0.34, height: u * 0.1, fill: swatch, opacity: 0.75, rotation: -4 }));
        pic.cache();
        return item(g, "照片：" + caption, swatch);
      }
      function note(text, fx, fy, rot) {
        const w = u * 0.9, h = u * 0.72;
        const g = new Konva.Group({ ...at(fx, fy), rotation: rot, offsetX: w / 2, offsetY: h / 2 });
        g.add(new Konva.Rect({ width: w, height: h, fill: C.c1, shadowColor: "#000", shadowBlur: 14, shadowOpacity: 0.4, shadowOffset: { x: 2, y: 6 } }));
        g.add(new Konva.Text({ text, x: u * 0.08, y: u * 0.08, width: w - u * 0.16, fontSize: Math.max(10, u * 0.095), lineHeight: 1.5, fill: "#1a1a14", fontFamily: FONT }));
        return item(g, "便利貼", C.c1);
      }
      function badge(text, fx, fy) {
        const r = u * 0.26, g = new Konva.Group({ ...at(fx, fy), rotation: 12 });
        g.add(new Konva.Circle({ radius: r, fill: C.c2, stroke: "#ecebe6", strokeWidth: 4, shadowColor: "#000", shadowBlur: 10, shadowOpacity: 0.4 }));
        g.add(new Konva.Text({ text, x: -r, y: -r * 0.22, width: r * 2, align: "center", fontSize: r * 0.44, fontStyle: "bold", fill: "#0e1013", fontFamily: FONT }));
        return item(g, "圓形貼紙", C.c2);
      }
      function star(fx, fy) {
        return item(new Konva.Star({
          ...at(fx, fy), numPoints: 5, innerRadius: u * 0.11, outerRadius: u * 0.25, rotation: -10, fill: C.c3,
          stroke: "#ecebe6", strokeWidth: 4, lineJoin: "round", shadowColor: C.c3, shadowBlur: 20, shadowOpacity: 0.6,
        }), "星星貼紙", C.c3);
      }
      function title() {
        const t = new Konva.Text({ text: "旅行靈感板", fontSize: u * 0.26, fontStyle: "bold", fill: "#ecebe6", fontFamily: FONT, letterSpacing: 2 });
        t.offset({ x: t.width() / 2, y: t.height() / 2 });
        t.position({ x: box.x + t.width() / 2 + 6, y: box.y + t.height() / 2 + 4 });
        return item(t, "標題文字", "#ecebe6");
      }

      function select(node) {
        selected = node;
        tr.nodes(node ? [node] : []);
        tr.moveToTop();
        const pic = picOf(node), fx = pic ? pic.getAttr("fx") || 0 : -1;
        [...seg.children].forEach((b, i) => { b.disabled = !pic; b.setAttribute("aria-pressed", String(i === fx)); });
        upBtn.disabled = downBtn.disabled = !node;
        renderList();
      }
      function setFx(i) {
        const pic = picOf(selected);
        if (!pic) return;
        pic.setAttr("fx", i);
        pic.filters(FX[i].filters);
        if (FX[i].set) FX[i].set(pic, u);
      }
      function restack(dir) {
        if (!selected) return;
        if (dir > 0) selected.moveUp(); else selected.moveDown();
        tr.moveToTop();
        renderList();
      }
      function renderList() {
        listEl.innerHTML = "";
        for (const n of items().sort((a, b) => b.zIndex() - a.zIndex())) {
          const li = document.createElement("li"), sw = document.createElement("i");
          sw.style.background = n.getAttr("swatch");
          li.append(sw, document.createTextNode(n.getAttr("label")));
          if (n === selected) li.className = "on";
          li.addEventListener("click", () => select(n));
          listEl.append(li);
        }
      }
      function topItem(target) {
        let n = target;

        text: "拉側邊把手改寬度，這段文字會重新換行，字級維持不變。",
      });
      text.on("transform", () => text.setAttrs({ width: Math.max(40, text.width() * text.scaleX()), scaleX: 1, scaleY: 1 }));
      [photo, star, card, text].forEach((n) => {
        n.setAttrs({ name: "item", draggable: true });
        n.on("transform dragmove", readout);
        layer.add(n);
      });
      stage.on("mouseover", (e) => { if (e.target.hasName("item")) stage.container().style.cursor = "move"; });
      stage.on("mouseout", () => { stage.container().style.cursor = ""; });
      pick([photo]);
    },
  },
  {
    id: "filters", title: "快取與濾鏡",
    api: "image.cache({ drawBorder })・filters([Konva.Filters.Blur, …])・blurRadius()・hue()",
    desc: "濾鏡作用在節點的點陣快取上：先 cache() 把節點畫成離屏 canvas，再逐像素套用 Konva.Filters。改濾鏡參數會標記快取過期，下一次 draw 才重算；左下顯示 8 個濾鏡一起重算的耗時。",
    hint: "拉「強度」滑桿・開「快取邊框」看快取範圍",
    async mount(ctx) {
      ctx.html(`<div class="kv"></div><div class="readout"></div>`);
      const out = ctx.$(".readout");
      let strength = 0.6, border = false, tiles = [];
      ctx.slider("強度", { min: 0, max: 100, value: 60, format: (v) => `${v}%` }, (v) => { strength = v / 100; update(); });
      ctx.toggle("快取邊框", border, (v) => { border = v; tiles.forEach((t) => t.img.cache({ drawBorder: border })); update(); });
      const stage = stageIn(ctx, ctx.$(".kv"), () => build());
      const layer = new Konva.Layer({ listening: false });
      stage.add(layer);
      const photo = await loadImage(PHOTO(5));
      if (!ctx.active) return;

      function build() {
        layer.destroyChildren();
        const W = stage.width(), H = stage.height(), top = belowControls(ctx), aw = W - 20, ah = H - top - 48, gap = 8;
        let best = null;
        for (const cols of [4, 2]) {
          const rows = 8 / cols, tw = (aw - gap * (cols - 1)) / cols, th = (ah - gap * (rows - 1)) / rows, s = Math.min(tw, th * 1.5);
          if (!best || s > best.s) best = { cols, tw, th, s };
        }
        const { cols, tw, th } = best;
        tiles = FILTER_TILES.map((def, i) => {
          const x = 10 + (i % cols) * (tw + gap), y = top + Math.floor(i / cols) * (th + gap);
          const img = new Konva.Image({ x, y, image: photo, width: tw, height: th, crop: cover(photo, tw, th), cornerRadius: 8 });
          img.cache({ drawBorder: border });
          img.filters([Konva.Filters[def.f]]);
          layer.add(img);
          const name = chip(`${def.zh}・${def.f}`, { x: x + 6, y: y + 6, size: 11.5, mono: false, color: COLORS[i % 6] });
          const cap = chip("", { x: x + 6, y: y + th - 26, size: 10.5 });
          layer.add(name, cap);
          return { def, img, cap };
        });
        update();
      }
      function update() {
        tiles.forEach((t) => { t.def.set(t.img, strength); t.cap.getText().text(t.def.show(t.img)); });
        const t0 = performance.now();
        layer.draw();
        const ms = performance.now() - t0;
        out.innerHTML = `layer.draw() 重算 8 個濾鏡 <b>${ms.toFixed(1)} ms</b>　強度 ${Math.round(strength * 100)}%`;
      }
      build();
    },
  },
  {
    id: "tween", title: "動畫與補間",
    api: "new Konva.Animation(frame => {}, layer)・new Konva.Tween({ node, easing, x, rotation })・tween.reverse()",
    desc: "上方是 Konva.Animation：每格拿 frame.time 自己算位置；下方六條跑道是同樣距離與時長的 Konva.Tween，只換 Konva.Easings 緩動曲線，抵達後用 reverse() 倒著播回來。",
    hint: "拉「時長」滑桿改補間秒數・按「重播」從頭再跑",
    mount(ctx) {
      ctx.html(`<div class="kv"></div>`);
      let dur = 1.6, tweens = [], dots = [], band = null, forward = true, nextAt = 0, clock = null;
      ctx.button("重播", () => { tweens.forEach((t) => t.reset()); forward = true; nextAt = 0; }, { primary: true });
      ctx.slider("時長", { min: 0.6, max: 3, step: 0.1, value: dur, format: (v) => `${v.toFixed(1)} 秒` }, (v) => { dur = v; build(); });
      const stage = stageIn(ctx, ctx.$(".kv"), () => build());
      const waveLayer = new Konva.Layer({ listening: false });
      const laneLayer = new Konva.Layer({ listening: false });
      stage.add(waveLayer, laneLayer);
      const killTweens = () => { tweens.forEach((t) => t.destroy()); tweens = []; };
      ctx.onCleanup(killTweens);

      const anim = new Konva.Animation((frame) => {
        if (!band) return false;
        const t = frame.time;
        dots.forEach((d, i) => {
          const a = Math.sin(t / 520 + i * 0.42) * (0.65 + 0.35 * Math.sin(t / 1900));
          d.y(band.cy + a * band.amp);
          d.scale({ x: 0.7 + 0.45 * (a + 1) / 2, y: 0.7 + 0.45 * (a + 1) / 2 });
        });
        clock.getText().text(`Konva.Animation　frame.time ${(t / 1000).toFixed(1)} s　timeDiff ${frame.timeDiff.toFixed(1)} ms`);
      }, waveLayer);
      anim.start();
      ctx.onCleanup(() => anim.stop());

      function build() {
        killTweens();
        waveLayer.destroyChildren();
        laneLayer.destroyChildren();
        const W = stage.width(), H = stage.height(), top = belowControls(ctx);
        const bandH = clamp((H - top) * 0.24, 56, 130);
        band = { cy: top + bandH / 2 + 8, amp: bandH * 0.3 };
        const n = clamp(Math.round(W / 26), 16, 48), gx = (W - 40) / (n - 1), dr = clamp(gx * 0.28, 3, 8);
        dots = Array.from({ length: n }, (_, i) => new Konva.Circle({ x: 20 + i * gx, y: band.cy, radius: dr, fill: COLORS[i % 6] }));
        waveLayer.add(...dots);
        clock = chip("", { x: 10, y: top + bandH - 6, size: 10.5 });
        waveLayer.add(clock);
        const wide = W >= 560, lanesTop = top + bandH + 26, lh = (H - lanesTop - 8) / EASINGS.length;
        // Leave ~10% headroom on the right so BackEaseOut overshoot stays visible.
        const rr = clamp(lh * 0.3, 7, 18), labelW = wide ? 170 : 0, x0 = 20 + labelW + rr, x1 = W - 20 - rr - (W - 40 - labelW - rr * 2) * 0.1;
        EASINGS.forEach(([name, zh], i) => {
          const cy = lanesTop + lh * i + (wide ? lh / 2 : lh * 0.66), color = COLORS[i % 6];
          laneLayer.add(new Konva.Line({ points: [x0, cy, x1, cy], stroke: "rgba(255,255,255,.12)", strokeWidth: 2, dash: [2, 6], lineCap: "round" }));
          laneLayer.add(new Konva.Line({ points: [x1 + rr + 4, cy - rr, x1 + rr + 4, cy + rr], stroke: "rgba(255,255,255,.3)", strokeWidth: 2 }));
          if (wide && lh >= 40) {
            laneLayer.add(new Konva.Text({ x: 20, y: cy - 15, text: name, fontSize: 13, fontFamily: MONO, fill: color }));
            laneLayer.add(new Konva.Text({ x: 20, y: cy + 2, text: zh, fontSize: 11.5, fontFamily: FONT, fill: C.muted }));
          } else if (wide) {
            laneLayer.add(new Konva.Text({ x: 20, y: cy - 6, text: `${name}・${zh}`, fontSize: 11.5, fontFamily: MONO, fill: color }));
          } else {
            laneLayer.add(new Konva.Text({ x: 20, y: cy - rr - 15, text: `${name}・${zh}`, fontSize: 10.5, fontFamily: MONO, fill: color }));
          }
          const star = new Konva.Star({ x: x0, y: cy, numPoints: 5, innerRadius: rr * 0.45, outerRadius: rr, fill: color });
          laneLayer.add(star);
          tweens.push(new Konva.Tween({ node: star, duration: dur, easing: Konva.Easings[name], x: x1, rotation: 360 }));
        });
        forward = true;
        nextAt = 0;
      }
      // Alternate play() and reverse() so every lane runs back and forth with the same timing.
      ctx.interval(() => {
        const now = performance.now();
        if (now < nextAt) return;
        tweens.forEach((t) => (forward ? t.play() : t.reverse()));
        forward = !forward;
        nextAt = now + (dur + 0.7) * 1000;
      }, 50);
      build();
    },
  },
  {
    id: "export", title: "匯出與還原",
    api: "stage.toDataURL({ pixelRatio })・stage.toBlob()・stage.toJSON()・Konva.Node.create(json, container)",
    desc: "左邊用 Konva.Line 手繪（橡皮擦是 destination-out 合成模式，只擦塗鴉層）。每畫完一筆，右上用 toDataURL 輸出 PNG，右下把 toJSON 的字串交給 Konva.Node.create 重建成另一個縮小的 Stage。",
    hint: "在左邊畫圖・切換顏色或橡皮擦・按「下載 PNG」存檔",
    mount(ctx) {
      ctx.html(`<div class="export"><div class="pad"></div><div class="side">
        <div class="panel out"><h4>toDataURL() → PNG</h4><div class="view"><img alt="匯出的 PNG"></div><small class="png-info">…</small></div>
        <div class="panel out"><h4>toJSON() → Node.create()</h4><div class="view mini"></div><small class="json-info">…</small></div>
      </div></div>`);
      const PENS = [["墨", "#22252b"], ["藍", "#1f8fbf"], ["粉", C.c3], ["綠", "#2f9e57"], ["橡皮擦", null]];
      let pen = 2, width = 6, mini = null, drawing = null;
      const urls = new Set();
      ctx.group(PENS.map((p) => p[0]), pen, (i) => { pen = i; });
      ctx.slider("粗細", { min: 2, max: 24, value: width }, (v) => { width = v; });
      ctx.button("清空", () => { drawLayer.destroyChildren(); exportAll(); });
      ctx.button("下載 PNG", async () => {
        const blob = await stage.toBlob({ pixelRatio: 2 });
        if (!ctx.active) return;
        const url = URL.createObjectURL(blob);
        urls.add(url);
        const a = document.createElement("a");
        a.href = url;
        a.download = "konva-塗鴉.png";
        a.click();
        ctx.timeout(() => { URL.revokeObjectURL(url); urls.delete(url); }, 3000);
      }, { primary: true });
      ctx.onCleanup(() => urls.forEach((u) => URL.revokeObjectURL(u)));
      ctx.$(".export").style.top = `${belowControls(ctx)}px`;
      const pngImg = ctx.$(".view img"), pngInfo = ctx.$(".png-info"), miniBox = ctx.$(".mini"), jsonInfo = ctx.$(".json-info");
      const stage = stageIn(ctx, ctx.$(".pad"), (w, h) => { paper.size({ width: w, height: h }); exportAll(); });
      const paperLayer = new Konva.Layer({ listening: false });
      const drawLayer = new Konva.Layer({ listening: false });
      stage.add(paperLayer, drawLayer);
      ctx.onCleanup(() => { if (mini) mini.destroy(); });
      const W = stage.width(), H = stage.height(), s = Math.min(W, H);
      const paper = new Konva.Rect({ width: W, height: H, fill: "#fbf8ef" });
      paperLayer.add(paper);
      for (let y = 28; y < Math.max(H, 2000); y += 28) paperLayer.add(new Konva.Line({ points: [0, y, 4000, y], stroke: "rgba(31,143,191,.13)", strokeWidth: 1 }));

      // A pre-drawn doodle so both exports have content right away.
      const sx = W * 0.2, sy = H * 0.3, sr = s * 0.1;
      drawLayer.add(new Konva.Circle({ x: sx, y: sy, radius: sr, fill: C.c1, stroke: "#e0a800", strokeWidth: 3 }));
      for (let k = 0; k < 10; k++) {
        const a = (k / 10) * Math.PI * 2;
        drawLayer.add(new Konva.Line({ points: [sx + Math.cos(a) * sr * 1.3, sy + Math.sin(a) * sr * 1.3, sx + Math.cos(a) * sr * 1.75, sy + Math.sin(a) * sr * 1.75], stroke: "#e0a800", strokeWidth: 4, lineCap: "round" }));
      }
      for (let k = 0; k < 3; k++) {
        const pts = [];
        for (let x = W * 0.06; x <= W * 0.94; x += W * 0.11) pts.push(x, H * (0.68 + k * 0.1) + Math.sin(x / (W * 0.07) + k) * s * 0.035);
        drawLayer.add(new Konva.Line({ points: pts, tension: 0.5, stroke: k ? C.c2 : "#1f8fbf", strokeWidth: Math.max(3, s * 0.018), lineCap: "round" }));
      }
      drawLayer.add(new Konva.Path({ x: W * 0.78, y: H * 0.3, data: HEART, scaleX: s / 140, scaleY: s / 140, fill: C.c3, rotation: 10 }));
      drawLayer.add(new Konva.Text({ x: W * 0.36, y: H * 0.2, text: "週末去海邊！", fontSize: Math.max(14, s * 0.075), fontFamily: FONT, fontStyle: "bold", fill: "#3a3833", rotation: -4 }));

      function exportAll() {
        const url = stage.toDataURL({ pixelRatio: 1 });
        pngImg.src = url;
        pngInfo.textContent = `${stage.width()}×${stage.height()} px・${((url.length * 0.75) / 1024).toFixed(1)} KB`;
        const json = stage.toJSON();
        if (mini) mini.destroy();
        mini = Konva.Node.create(json, miniBox);
        const k = Math.min((miniBox.clientWidth - 4) / stage.width(), (miniBox.clientHeight - 4) / stage.height());
        mini.setAttrs({ scaleX: k, scaleY: k, width: stage.width() * k, height: stage.height() * k, listening: false });
        jsonInfo.textContent = `JSON ${(json.length / 1024).toFixed(1)} KB・${stage.find("Shape").length} 個圖形`;
      }
      stage.on("mousedown touchstart", () => {
        const p = stage.getPointerPosition(), erase = PENS[pen][1] === null;
        drawing = new Konva.Line({
          points: [p.x, p.y, p.x, p.y], stroke: erase ? "#000" : PENS[pen][1], strokeWidth: erase ? width * 2.5 : width,
          lineCap: "round", lineJoin: "round", globalCompositeOperation: erase ? "destination-out" : "source-over",
        });
        drawLayer.add(drawing);
      });
      stage.on("mousemove touchmove", (e) => {
        if (!drawing) return;
        e.evt.preventDefault();
        const p = stage.getPointerPosition();
        drawing.points(drawing.points().concat([p.x, p.y]));
      });
      const finish = () => { if (drawing) { drawing = null; exportAll(); } };
      stage.on("mouseup touchend", finish);
      ctx.on(window, "pointerup", finish);
      exportAll();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "Konva.autoDrawEnabled = false・node.x()／y()・layer.draw()・layer.listening()・perfectDrawEnabled",
    desc: "關掉自動重畫，每格手動更新所有節點的 x、y 再呼叫 layer.draw()，兩段分開計時；逐級增加圖形數量直到掉到 30 FPS 以下。可切換命中圖與完美繪製比較成本。",
    hint: "按「自動加壓」開始・關掉「命中圖」或打開「完美繪製」再測一次",
    mount(ctx) {
      ctx.html(`<div class="stress-box"></div>`);
      ctx.controls.classList.add("bottom");
      let hit = true, perfect = false, nodes = [], px, py, vx, vy, upd = 0, drw = 0;
      ctx.toggle("命中圖", hit, (v) => { hit = v; layer.listening(v); });
      ctx.toggle("完美繪製", perfect, (v) => { perfect = v; nodes.forEach((n) => n.perfectDrawEnabled(v)); });
      const prevAuto = Konva.autoDrawEnabled;
      Konva.autoDrawEnabled = false;
      ctx.onCleanup(() => { Konva.autoDrawEnabled = prevAuto; });
      const stage = stageIn(ctx, ctx.$(".stress-box"));
      const layer = new Konva.Layer({ listening: hit });
      stage.add(layer);

      function spawn(n) {
        layer.destroyChildren();
        const W = stage.width(), H = stage.height(), s = clamp(Math.sqrt((W * H) / n) * 0.3, 2.5, 16);
        px = new Float32Array(n); py = new Float32Array(n); vx = new Float32Array(n); vy = new Float32Array(n);
        nodes = new Array(n);
        for (let i = 0; i < n; i++) {
          px[i] = rnd(0, W); py[i] = rnd(0, H);
          const a = rnd(0, Math.PI * 2), sp = rnd(0.6, 2.2);
          vx[i] = Math.cos(a) * sp; vy[i] = Math.sin(a) * sp;
          const o = { x: px[i], y: py[i], fill: COLORS[i % 6], stroke: "#0e1013", strokeWidth: 1, opacity: 0.85, perfectDrawEnabled: perfect };
          const kind = i % 3;
          nodes[i] = kind === 0 ? new Konva.Circle({ ...o, radius: s })
            : kind === 1 ? new Konva.Rect({ ...o, width: s * 1.7, height: s * 1.7, offsetX: s * 0.85, offsetY: s * 0.85 })
            : new Konva.Star({ ...o, numPoints: 5, innerRadius: s * 0.5, outerRadius: s * 1.15 });
          layer.add(nodes[i]);
        }
      }
      ctx.raf((t, dt) => {
        const n = nodes.length;
        if (!n) return;
        const W = stage.width(), H = stage.height(), k = dt / 16.7;
        const t0 = performance.now();
        for (let i = 0; i < n; i++) {
          let x = px[i] + vx[i] * k, y = py[i] + vy[i] * k;
          if (x < 0) { x = 0; vx[i] = Math.abs(vx[i]); } else if (x > W) { x = W; vx[i] = -Math.abs(vx[i]); }
          if (y < 0) { y = 0; vy[i] = Math.abs(vy[i]); } else if (y > H) { y = H; vy[i] = -Math.abs(vy[i]); }
          px[i] = x; py[i] = y;
          nodes[i].x(x);
          nodes[i].y(y);
        }
        const t1 = performance.now();
        layer.draw();
        const t2 = performance.now();
        upd += (t1 - t0 - upd) * 0.1;
        drw += (t2 - t1 - drw) * 0.1;
      });
      ctx.ramp({
        label: "圖形", unit: "個", steps: [250, 500, 1000, 2000, 4000, 8000, 12000, 16000, 24000], minFps: 30,
        apply(n) { spawn(n); },
        metrics: () => ({
          更新: `${upd.toFixed(1)} ms`,
          繪製: `${drw.toFixed(1)} ms`,
          模式: `${hit ? "命中圖" : "無命中圖"}・${perfect ? "完美繪製" : "直接繪製"}`,
        }),
        note: "每格先改所有節點的 x、y（Konva 屬性系統與變換快取），再手動 layer.draw()（場景圖走訪與 Canvas 2D 繪圖）。開著「命中圖」時每個圖形還要再畫一次到隱藏的 hit canvas 供滑鼠偵測；「完美繪製」（預設關閉）讓同時有填色、描邊與透明度的圖形先畫到 stage 大小的暫存 canvas 再合成，每個圖形多一次整張貼圖。兩者都是官方效能建議裡可關掉的開關。",
      });
    },
  },
] });
</script>
</body>
