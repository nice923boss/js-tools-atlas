<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUTE.js 示範：SVG 形狀變形</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(45% 60% at 35% 50%, rgba(76, 201, 240, .08), transparent 70%), var(--bg); }
  h1 { position: fixed; left: 16px; top: 14px; margin: 0; font-size: 16px; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .layout { position: fixed; inset: 56px 16px 52px; display: flex; gap: 28px; align-items: center; justify-content: center; }
  svg { height: 100%; max-height: 460px; aspect-ratio: 1; max-width: calc(100% - 310px); overflow: visible; }
  #track { fill: none; stroke: var(--line); stroke-width: 3; }
  #ring { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  #shape { filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .45)); }
  #dots circle { fill: #fff; opacity: .85; }
  #dots.off { display: none; }
  .side { width: 280px; display: grid; gap: 14px; padding: 16px; }
  .name { font-size: 40px; font-weight: 900; line-height: 1; min-height: 40px; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--fg); font: 700 22px var(--mono); margin-right: 4px; }
  .shapes { display: flex; gap: 6px; flex-wrap: wrap; }
  .shapes .btn { padding: 6px 10px; font-size: 13px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .row b { color: var(--fg); font-family: var(--mono); }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
  .code { font-size: 11.5px; line-height: 1.6; color: var(--muted); padding: 8px 10px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); white-space: pre; overflow: hidden; }
  .code b { color: var(--accent); font-weight: 600; }
  @media (max-width: 640px) {
    h1 { display: none; }
    .layout { flex-direction: column; inset: 52px 10px 46px; gap: 8px; }
    svg { flex: 1 1 0; min-height: 0; height: auto; max-width: 100%; }
    .side { width: 100%; padding: 10px; gap: 8px; }
    .name { font-size: 26px; min-height: 26px; }
    .head { display: flex; align-items: center; justify-content: space-between; }
    .code { display: none; }
  }
</style>
</head>
<body>
<h1>SVG 形狀變形<small>svgMorph 把路徑取樣成多邊形，再逐點補間</small></h1>
<div class="controls">
  <button class="btn" id="auto" aria-pressed="true">自動播放</button>
  <button class="btn primary" id="replay">重播</button>
</div>
<main class="layout">
  <svg viewBox="-10 -10 220 220" aria-label="變形中的形狀">
    <circle id="track" cx="100" cy="100" r="98"></circle>
    <circle id="ring" cx="100" cy="100" r="98" transform="rotate(-90 100 100)"></circle>
    <path id="shape" fill="#4cc9f0"></path>
    <g id="dots"></g>
  </svg>
  <section class="panel side">
    <div class="head">
      <div class="name" id="name">圓形</div>
      <div class="stat"><b id="count">0</b>個頂點</div>
    </div>
    <div class="shapes" id="shapes"></div>
    <div>
      <div class="row"><span>morphPrecision（取樣間距）</span><b id="precVal">8</b></div>
      <input type="range" id="prec" min="3" max="40" value="8" aria-label="取樣間距">
      <div class="row"><span>數字越大，點越少、越有稜角</span>
        <label><input type="checkbox" id="showDots" checked> 頂點</label></div>
    </div>
    <div class="code mono" id="code"></div>
  </section>
</main>
<div class="hint">點形狀按鈕，或拖動取樣間距看多邊形變粗糙</div>

<script src="https://cdn.jsdelivr.net/npm/kute.js@2.2.6/dist/kute.min.js"></script>
<script>
// Each hop runs four KUTE tweens at once: path morph, fill attribute, ring draw and a text scramble.
function starPath(cx, cy, R, r, n) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / n, rad = i % 2 ? r : R;
    pts.push(`${(cx + Math.cos(a) * rad).toFixed(2)} ${(cy + Math.sin(a) * rad).toFixed(2)}`);
  }
  return `M${pts.join(" L")} Z`;
}
const SHAPES = [
  { id: "circle", name: "圓形", color: "#4cc9f0",
    d: "M100 30 C138.66 30 170 61.34 170 100 C170 138.66 138.66 170 100 170 C61.34 170 30 138.66 30 100 C30 61.34 61.34 30 100 30 Z" },
  { id: "star", name: "星星", color: "#f7df1e", d: starPath(100, 104, 78, 33, 5) },
  { id: "heart", name: "愛心", color: "#f72585",
    d: "M100 166 C62 136 26 110 26 74 C26 50 44 34 66 34 C82 34 94 44 100 58 C106 44 118 34 134 34 C156 34 174 50 174 74 C174 110 138 136 100 166 Z" },
  { id: "bolt", name: "閃電", color: "#ff8c42", d: "M124 18 L54 114 L96 114 L80 184 L152 86 L108 86 Z" },
  { id: "drop", name: "水滴", color: "#7bd389",
    d: "M100 22 C100 22 158 88 158 124 C158 156 132 180 100 180 C68 180 42 156 42 124 C42 88 100 22 100 22 Z" },
];
const shape = document.getElementById("shape");
const ring = document.getElementById("ring");
const dots = document.getElementById("dots");
const countEl = document.getElementById("count");
const prec = document.getElementById("prec");
const autoBtn = document.getElementById("auto");
let cur = 0, auto = true, timer = null, busy = false;

shape.setAttribute("d", SHAPES[0].d);
document.getElementById("shapes").innerHTML = SHAPES.map((s, i) =>
  `<button class="btn" data-i="${i}" aria-pressed="${i === 0}"><span style="color:${s.color}">●</span> ${s.name}</button>`).join("");

// Plot the vertices of the in-between polygon so the sampling density is visible.
function plotDots(d) {
  const pts = d.slice(1, -1).split("L").map((p) => p.trim().split(/[\s,]+/).map(Number));
  dots.innerHTML = pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.6"></circle>`).join("");
  return pts.length;
}

function morphTo(i) {
  if (busy) return;
  busy = true;
  const next = SHAPES[i], p = Number(prec.value), old = Number(countEl.textContent);
  let counted = false;
  document.querySelectorAll("[data-i]").forEach((b) => b.setAttribute("aria-pressed", Number(b.dataset.i) === i));
  document.getElementById("code").innerHTML =
    `KUTE.to(shape,\n  { path: <b>${next.id}</b> },\n  { morphPrecision: <b>${p}</b> }\n).start();`;

  KUTE.to(shape, { path: next.d }, {
    duration: 1200, easing: "easingCubicInOut", morphPrecision: p,
    onUpdate() {
      const d = shape.getAttribute("d");
      if (d === next.d) return; // the last frame restores the original curve path
      const n = plotDots(d);
      if (!counted) { counted = true; KUTE.fromTo(countEl, { number: old }, { number: n }, { duration: 600 }).start(); }
    },
    onComplete() { cur = i; busy = false; if (auto) schedule(); },
  }).start();
  KUTE.to(shape, { attr: { fill: next.color } }, { duration: 1200, easing: "easingCubicInOut" }).start();
  KUTE.fromTo(ring, { draw: "0% 0%" }, { draw: "0% 100%" }, { duration: 1200, easing: "easingCubicInOut" }).start();
  ring.style.stroke = next.color;
  KUTE.to(document.getElementById("name"), { text: next.name }, { duration: 700, textChars: "●★♥⚡◆▲■" }).start();
}

function schedule() { clearTimeout(timer); timer = setTimeout(() => morphTo((cur + 1) % SHAPES.length), 1400); }
function setAuto(on) {
  auto = on;
  autoBtn.setAttribute("aria-pressed", on);
  on ? schedule() : clearTimeout(timer);
}

document.getElementById("shapes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-i]");
  if (!b || busy) return;
  setAuto(false);
  morphTo(Number(b.dataset.i));
});
prec.addEventListener("input", () => { document.getElementById("precVal").textContent = prec.value; });
// Morph to the next shape so the new precision shows up immediately.
prec.addEventListener("change", () => { setAuto(false); morphTo((cur + 1) % SHAPES.length); });
document.getElementById("showDots").addEventListener("change", (e) => dots.classList.toggle("off", !e.target.checked));
autoBtn.addEventListener("click", () => setAuto(!auto));
document.getElementById("replay").addEventListener("click", () => {
  clearTimeout(timer);
  auto = true; autoBtn.setAttribute("aria-pressed", "true");
  const go = () => (busy ? setTimeout(go, 100) : morphTo(0));
  go();
});

// Start the tour right away so the first frame already shows sampled vertices.
morphTo(1);
</script>
</body>
</html>
