<script src="https://cdn.jsdelivr.net/npm/kute.js@2.2.6/dist/kute.min.js"></script>

<script>
// KUTE.js showcase: svgMorph, transform functions, colours and numbers, easing, chain and playback control,
// tween collections with stagger, svgDraw and textWrite, then a stress ramp of simultaneous tweens.
const css = getComputedStyle(document.documentElement);
const PAL = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const CHARS = "■□●○◆◇▲△";
const SVGNS = "http://www.w3.org/2000/svg";
const svgEl = (tag, attrs) => {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};

// Track every tween a scene starts; stopping them on cleanup also lets KUTE drop its render cache.
function keeper(ctx) {
  const set = new Set();
  const live = (t) => (typeof t.playing === "function" ? t.playing() : t.playing);
  const keep = (tw) => {
    if (set.size > 300) set.forEach((t) => { if (!live(t)) set.delete(t); });
    set.add(tw);
    return tw;
  };
  keep.stopAll = () => { set.forEach((t) => t.stop()); set.clear(); };
  ctx.onCleanup(keep.stopAll);
  return keep;
}

function starPath(cx, cy, R, r, n) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / n, rad = i % 2 ? r : R;
    pts.push(`${(cx + Math.cos(a) * rad).toFixed(2)} ${(cy + Math.sin(a) * rad).toFixed(2)}`);
  }
  return `M${pts.join(" L")} Z`;
}
const SHAPES = [
  { id: "circle", name: "圓形", color: "#4cc9f0",
    d: "M100 30 C138.66 30 170 61.34 170 100 C170 138.66 138.66 170 100 170 C61.34 170 30 138.66 30 100 C30 61.34 61.34 30 100 30 Z" },
  { id: "star", name: "星星", color: "#f7df1e", d: starPath(100, 104, 78, 33, 5) },
  { id: "heart", name: "愛心", color: "#f72585",
    d: "M100 166 C62 136 26 110 26 74 C26 50 44 34 66 34 C82 34 94 44 100 58 C106 44 118 34 134 34 C156 34 174 50 174 74 C174 110 138 136 100 166 Z" },
  { id: "bolt", name: "閃電", color: "#ff8c42", d: "M124 18 L54 114 L96 114 L80 184 L152 86 L108 86 Z" },
  { id: "drop", name: "水滴", color: "#7bd389",
    d: "M100 22 C100 22 158 88 158 124 C158 156 132 180 100 180 C68 180 42 156 42 124 C42 88 100 22 100 22 Z" },
];

const h2r = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
const mix = (a, b, t) => "#" + h2r(a).map((v, i) => Math.round(v + (h2r(b)[i] - v) * t).toString(16).padStart(2, "0")).join("");
const TEMP_STOPS = [[8, "#4cc9f0"], [16, "#7bd389"], [22, "#f7df1e"], [27, "#ff8c42"], [31, "#f72585"]];
function tempColor(t) {
  if (t <= TEMP_STOPS[0][0]) return TEMP_STOPS[0][1];
  for (let i = 1; i < TEMP_STOPS.length; i++) {
    const [t1, c1] = TEMP_STOPS[i], [t0, c0] = TEMP_STOPS[i - 1];
    if (t <= t1) return mix(c0, c1, (t - t0) / (t1 - t0));
  }
  return TEMP_STOPS[TEMP_STOPS.length - 1][1];
}
// Custom easing function (standard bounce-out) passed straight to KUTE
function bounceOut(t) {
  const n = 7.5625, d = 2.75;
  if (t < 1 / d) return n * t * t;
  if (t < 2 / d) return n * (t -= 1.5 / d) * t + 0.75;
  if (t < 2.5 / d) return n * (t -= 2.25 / d) * t + 0.9375;
  return n * (t -= 2.625 / d) * t + 0.984375;
}

// Scene 2 data
const T2 = [
  { name: "平移", key: "translate3d", from: { translate3d: [-34, -14, 0] }, to: { translate3d: [34, 14, 0] } },
  { name: "景深", key: "perspective + translateZ", from: { perspective: 300, translateZ: -140 }, to: { perspective: 300, translateZ: 90 } },
  { name: "3D 旋轉", key: "rotateX + rotateY", from: { perspective: 500, rotateX: 0, rotateY: 0 }, to: { perspective: 500, rotateX: 35, rotateY: 180 } },
  { name: "傾斜", key: "skewX + skewY", from: { skewX: -24, skewY: 0 }, to: { skewX: 24, skewY: 10 } },
  { name: "旋轉縮放", key: "rotate + scale", from: { rotate: 0, scale: 0.55 }, to: { rotate: 180, scale: 1.15 } },
  { name: "組合", key: "五種一起", from: { perspective: 400, translateX: -24, rotateY: -50, skewX: -12, scale: 0.8 },
    to: { perspective: 400, translateX: 24, rotateY: 50, skewX: 12, scale: 1.1 } },
];
// Scene 3 data (illustrative monthly averages: Jan / Apr / Jul / Oct)
const CITIES = [
  { n: "台北", t: [16, 22, 30, 24], r: [95, 180, 230, 120] },
  { n: "台中", t: [17, 23, 29, 25], r: [35, 130, 290, 20] },
  { n: "高雄", t: [19, 26, 30, 27], r: [20, 70, 410, 50] },
  { n: "花蓮", t: [18, 22, 29, 25], r: [70, 95, 210, 350] },
  { n: "台東", t: [19, 24, 29, 26], r: [40, 65, 250, 230] },
  { n: "阿里山", t: [6, 11, 15, 12], r: [90, 230, 620, 150] },
];
const MONTHS = ["1 月", "4 月", "7 月", "10 月"];
const FAMS = [["Sinusoidal", "正弦"], ["Quadratic", "二次"], ["Cubic", "三次"], ["Quartic", "四次"], ["Quintic", "五次"],
  ["Exponential", "指數"], ["Circular", "圓弧"], ["Back", "回拉"]];
const STNS = ["台北車站", "中山", "雙連", "民權西路", "圓山", "劍潭"];

Showcase.run({ scenes: [
  {
    id: "morph", title: "形狀變形",
    api: "KUTE.to(path, { path: d, attr: { fill } }, { morphPrecision }).start()",
    desc: "svgMorph 先把兩條路徑沿長度取樣成點數相同的多邊形，再逐點補間；同時還有 attr 換色、draw 描外圈、text 換名稱、number 計數四個補間一起跑。白點是 KUTE.Util.getInterpolationPoints 算出的取樣頂點。",
    hint: "點形狀按鈕切換；拖動取樣間距看多邊形變粗糙",
    mount(ctx) {
      ctx.html(`<div class="k1 pad">
        <div class="art"><svg viewBox="-10 -10 220 220" aria-label="變形中的形狀">
          <circle class="trk" cx="100" cy="100" r="98"></circle>
          <circle class="ring" cx="100" cy="100" r="98" transform="rotate(-90 100 100)"></circle>
          <path class="shape"></path><g class="dots"></g></svg></div>
        <aside class="panel side">
          <div class="head"><div class="nm"></div><div class="st"><b class="vc">0</b>個頂點</div></div>
          <div class="shapes"></div>
          <pre class="kcode"></pre>
        </aside></div>`);
      const keep = keeper(ctx);
      const shape = ctx.$(".shape"), ring = ctx.$(".ring"), dots = ctx.$(".dots"), nm = ctx.$(".nm"), vc = ctx.$(".vc"), code = ctx.$(".kcode");
      let cur = 0, prev = 0, prec = 10, auto = true, timer = 0, live = [], morphing = false;
      shape.setAttribute("d", SHAPES[0].d);
      shape.setAttribute("fill", SHAPES[0].color);
      ring.setAttribute("stroke", SHAPES[0].color);
      nm.textContent = SHAPES[0].name;
      const btns = SHAPES.map((s, i) => {

          <path class="sh" stroke="${PAL[0]}" d="M18 70 C30 10 50 10 50 50 S70 90 82 30"></path>
          <circle class="sh" stroke="${PAL[1]}" cx="150" cy="50" r="32"></circle>
          <rect class="sh" stroke="${PAL[2]}" x="218" y="18" width="64" height="64"></rect>
          <polygon class="sh" stroke="${PAL[3]}" points="${pts}"></polygon>
          <polyline class="sh" stroke="${PAL[4]}" points="116,188 133,148 150,188 167,148 184,188"></polyline>
          <line class="sh" stroke="${PAL[5]}" x1="220" y1="196" x2="280" y2="136"></line>
          ${DRAWS.map((d) => `<text class="lb" x="${d.x}" y="${d.y + 50}">${d.name}</text><text class="lv" x="${d.x}" y="${d.y + 61}">${d.from} → ${d.to}</text>`).join("")}
        </svg></section>
        <section class="panel txt">
          <div class="sub"><code>text</code>：逐字替換</div><div class="hl">KUTE.js</div>
          <div class="sub"><code>number</code>：累計人次（示意）</div><div class="cnt">0</div>
          <div class="sub"><code>createTextTweens</code>：先倒序清除舊段落，再逐段打字</div><div class="tw"></div>
        </section></div>`);
      const keep = keeper(ctx);
      const shapes = ctx.$$(".drw .sh"), hl = ctx.$(".hl"), cnt = ctx.$(".cnt"), tw = ctx.$(".tw");
      const PHR = ["台北 101", "日月潭", "太魯閣峽谷", "九份老街", "墾丁海岸"];
      const MSG = ["用 <b>KUTE.js</b> 讓文字逐段出現", "分段打字並保留 <b>粗體</b> 標籤"];
      let k = 0, cs = "alpha", loop = 0, pending = 0;
      tw.innerHTML = MSG[1];
      function cycle() {
        const T = performance.now();
        DRAWS.forEach((d, i) => keep(KUTE.fromTo(shapes[i], { draw: d.from }, { draw: d.to },
          { duration: 1400, repeat: 1, yoyo: true, repeatDelay: 600, easing: "easingCubicInOut" })).start(T));
        keep(KUTE.to(hl, { text: PHR[k % PHR.length] }, { duration: 1200, textChars: cs })).start(T);
        keep(KUTE.fromTo(cnt, { number: 0 }, { number: 120000 + ((k * 389117) % 880000) }, { duration: 2400, easing: "easingCubicOut" })).start(T);
        const parts = KUTE.Util.createTextTweens(tw, MSG[k % 2], { textChars: cs });
        if (parts) { parts.forEach(keep); parts.start(); }
        k++;
      }
      function restart(delay) {
        clearInterval(loop);
        clearTimeout(pending);
        pending = ctx.timeout(() => { cycle(); loop = ctx.interval(cycle, 6500); }, delay);
      }
      ctx.select("textChars", [
        { value: "alpha", label: "alpha" }, { value: "upper", label: "upper" }, { value: "numeric", label: "numeric" },
        { value: "alphanumeric", label: "alphanumeric" }, { value: "★☆♥♡◆◇", label: "自訂 ★☆♥♡" },
      ], cs, (v) => {
        cs = v;
        clearInterval(loop);
        keep.stopAll();
        tw.playing = false;
        tw.innerHTML = MSG[(k + 1) % 2];
        hl.textContent = k ? PHR[(k - 1) % PHR.length] : "KUTE.js";
        // KUTE only re-registers the text renderer after its ticker has been idle for 64 ms.
        restart(150);
      });
      restart(160);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × KUTE.fromTo(el, from, to, { yoyo: true, repeat: Infinity }).start(T)",
    desc: "每個方塊一個獨立 Tween，全部由 KUTE 同一個 requestAnimationFrame 迴圈驅動；逐級加量直到低於 30 FPS。可切換補間的屬性，比較只需合成的 transform、要重繪的顏色、會觸發版面計算的 left／top。",
    hint: "按「自動加壓」開始；切換補間屬性比較瓶頸",
    mount(ctx) {
      ctx.html(`<div class="stress-x"><div class="wall8"></div></div>`);
      const wall = ctx.$(".wall8");
      let mode = "transform", N = 0, cell = 10, buildMs = 0, updMs = 0;
      function layout() {
        const W = wall.clientWidth, H = wall.clientHeight;
        if (!N || !W || !H) return;
        const cols = Math.max(1, Math.ceil(Math.sqrt((N * W) / H))), rows = Math.ceil(N / cols);
        cell = Math.max(1, Math.floor(Math.min(W / cols, H / rows) * 100) / 100);
        wall.style.gridTemplateColumns = `repeat(${cols}, ${cell}px)`;
        wall.style.gridAutoRows = `${cell}px`;
      }
      function props(i) {
        if (mode === "color") return [{ backgroundColor: PAL[i % 6] }, { backgroundColor: PAL[(i + 3) % 6] }];
        if (mode === "box") { const d = Math.max(1, Math.round(cell * 0.15)); return [{ left: `${-d}px`, top: `${-d}px` }, { left: `${d}px`, top: `${d}px` }]; }
        return [{ rotate: 0, scale: 0.4 }, { rotate: 180, scale: 1 }];
      }
      function rebuild() {
        KUTE.Internals.removeAll();
        wall.textContent = "";
        updMs = 0;
        if (!N) return;
        const frag = document.createDocumentFragment(), els = [];
        for (let i = 0; i < N; i++) {
          const el = document.createElement("i");
          el.style.background = PAL[i % 6];
          frag.appendChild(el);
          els.push(el);
        }
        wall.appendChild(frag);
        layout();
        const t0 = performance.now();
        const tws = els.map((el, i) => {
          const [a, b] = props(i);
          return KUTE.fromTo(el, a, b, { duration: 800 + Math.random() * 800, yoyo: true, repeat: Infinity, easing: "easingSinusoidalInOut" });
        });
        const T = performance.now();
        tws.forEach((tw) => tw.start(T));
        buildMs = performance.now() - t0;
        // Time one ticker pass: from the first tween's update to the end of the last one's.
        const first = tws[0], last = tws[tws.length - 1], update = Object.getPrototypeOf(first).update;
        let s = 0;
        first.update = function (t) { s = performance.now(); return update.call(this, t); };
        const end = function (t) { const r = update.call(this, t); updMs = updMs * 0.9 + (performance.now() - s) * 0.1; return r; };
        if (first === last) first.update = function (t) { s = performance.now(); return end.call(this, t); };
        else last.update = end;
      }
      ctx.onCleanup(() => { KUTE.Internals.removeAll(); KUTE.Internals.stop(); });
      ctx.select("補間屬性", [{ value: "transform", label: "transform" }, { value: "color", label: "backgroundColor" }, { value: "box", label: "left / top" }],
        mode, (v) => { mode = v; rebuild(); });
      ctx.controls.classList.add("bottom");
      ctx.onResize(layout);
      ctx.ramp({
        label: "同時補間", unit: "個", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000],
        minFps: 30,
        apply(n) { N = n; rebuild(); },
        metrics: () => ({ "進行中 Tween": KUTE.Internals.getAll().length, "建立＋start": `${buildMs.toFixed(1)} ms`, "KUTE 更新／格": `${updMs.toFixed(2)} ms` }),
        note: "「KUTE 更新／格」只量 JS 端：Ticker 逐一呼叫每個 Tween.update() 並寫入 style 的時間，不含之後的樣式計算、版面與繪製。transform 只需合成，backgroundColor 每格都要重繪，left／top 會觸發版面重排，所以同樣數量下的 FPS 差距主要來自瀏覽器端。「建立＋start」是每換一級重新建立 N 個 Tween 的一次性成本。",
      });
    },
  },
] });
</script>
</body>
