const CITIES = [[25.045, 121.53, 1.0, .06], [25.01, 121.45, .7, .06], [24.99, 121.30, .55, .06], [24.80, 120.98, .35, .05], [24.56, 120.82, .12, .05], [24.15, 120.67, .8, .07],

const TW_BOUNDS = L.latLngBounds([21.88, 120.03], [25.31, 122.01]);

const LABELS = [["台北", 25.05, 121.52], ["基隆", 25.13, 121.74], ["桃園", 24.99, 121.30], ["新竹", 24.80, 120.97], ["苗栗", 24.56, 120.82], ["台中", 24.15, 120.67],

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

function gauss(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function inTaiwan(lng, lat) {
  let inside = false;
  for (let i = 0, j = TW.length - 1; i < TW.length; j = i++) {
    const [xi, yi] = TW[i], [xj, yj] = TW[j];
    if ((yi > lat) !== (yj > lat) && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// Simulated store locations: 100k points clustered around cities, flat [lat, lng, ...]
let POOL = null;
function points() {
  if (POOL) return POOL;
  const r = rng(7), total = 100000, out = new Float64Array(total * 2);
  const wsum = CITIES.reduce((s, c) => s + c[2], 0);
  for (let i = 0; i < total;) {
    let lat, lng;
    if (r() < 0.12) { lat = 21.9 + r() * 3.4; lng = 120.05 + r() * 1.95; }
    else {
      let k = r() * wsum, c = CITIES[0];
      for (const cc of CITIES) { k -= cc[2]; if (k <= 0) { c = cc; break; } }
      lat = c[0] + gauss(r) * c[3]; lng = c[1] + gauss(r) * c[3] * 1.1;
    }
    if (!inTaiwan(lng, lat)) continue;
    out[i * 2] = lat; out[i * 2 + 1] = lng; i++;
  }
  return (POOL = out);
}

// ---------- map helpers ----------
const ATTR_OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者';
// Key-free sources only: OSM standard tiles (CSS filters give the dark / gray looks) and OpenFreeMap's Natural Earth relief.
const osm = (opts = {}) => L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: ATTR_OSM, ...opts });
const dark = () => osm({ className: "dark-tiles" });
const relief = () => L.tileLayer("https://tiles.openfreemap.org/natural_earth/ne2sr/{z}/{x}/{y}.png",

function makeMap(ctx, opts = {}, host = ctx.$(".lf-map")) {

  ctx.onCleanup(() => map.remove());
  ctx.onResize(() => map.invalidateSize());

}

function watchTiles(ctx, layer) {
  let shown = false;
  layer.on("tileerror", () => {
    if (shown || !ctx.active) return;

    ctx.el.append(h("div", { class: "lf-note", text: "底圖圖磚載入失敗（可能離線或被阻擋），向量圖層仍可正常操作" }));

}
function box(position, cls, onAdd) {

    L.DomEvent.disableClickPropagation(el);

// ---------- 2. hex grid ----------
function hexGrid(r) {
  const k = Math.cos((23.7 * Math.PI) / 180), w = Math.sqrt(3) * r;
  const rand = rng(42), features = [];
  for (let row = 0, y = 21.85; y < 25.35; row++, y += 1.5 * r) {
    for (let x = 120.0 * k + (row % 2) * (w / 2); x < 122.05 * k; x += w) {
      const lng = x / k, lat = y;
      if (!inTaiwan(lng, lat)) continue;
      let d = 0;
      for (const [cl, cg, cw, cs] of CITIES) d += cw * Math.exp(-((lat - cl) ** 2 + ((lng - cg) * k) ** 2) / (2 * (cs * 2.2) ** 2));
      const density = Math.min(100, d * 82 + rand() * 6);
      const aging = Math.max(8, Math.min(32, 26 - density * 0.16 + gauss(rand) * 2.4));
      const ring = [];
      for (let i = 0; i < 7; i++) { const a = (Math.PI / 180) * (60 * (i % 6) - 30); ring.push([(x + r * Math.cos(a)) / k, y + r * Math.sin(a)]); }
      features.push({ type: "Feature", properties: { id: features.length + 1, density, aging }, geometry: { type: "Polygon", coordinates: [ring] } });
    }
  }
  return { type: "FeatureCollection", features };
}

};
function breaksOf(values, method) {
  const v = [...values].sort((a, b) => a - b), n = 7, out = [];
  for (let i = 1; i < n; i++) out.push(method === "quantile" ? v[Math.floor((i / n) * v.length)] : v[0] + ((v[v.length - 1] - v[0]) * i) / n);
  return out;
}

      // Cumulative distance along the line for constant-speed interpolation.
      const cum = [0];
      for (let i = 1; i < line.length; i++) cum.push(cum[i - 1] + line[i - 1].distanceTo(line[i]));
      const total = cum[cum.length - 1];
      const trail = L.polyline([], { color: "#f7df1e", weight: 4, opacity: 0.95, interactive: false }).addTo(map);

    mount(ctx) {

        <div class="lf-half"><div class="lf-map" data-r="svg"></div><div class="lf-box lf-tag" data-tag="svg"></div></div>
        <div class="lf-half"><div class="lf-map" data-r="canvas"></div><div class="lf-box lf-tag" data-tag="canvas"></div></div></div>`);
      const SIZES = [1000, 5000, 10000];
      ctx.group(SIZES.map((n) => `${fmt(n)} 點`), 1, (i) => build(SIZES[i]));
      const sides = ["svg", "canvas"].map((kind) => {
        const map = makeMap(ctx, { zoomControl: false, minZoom: 6, attributionControl: kind === "canvas" }, ctx.$(`[data-r="${kind}"]`));
        map.fitBounds(TW_BOUNDS, { padding: [4, 4] });

        return { kind, map, renderer: kind === "svg" ? L.svg() : L.canvas(), tag: ctx.$(`[data-tag="${kind}"]`), group: null };
      });
      let syncing = false;
      for (const s of sides) {

          syncing = false;

      let buildId = 0;
      async function build(n) {
        const P = points(), id = ++buildId;
        for (const s of sides) {
          if (s.group) { s.group.remove(); s.group = null; }
          const t0 = performance.now();
          const g = L.featureGroup();
          for (let i = 0; i < n; i++) g.addLayer(L.circleMarker([P[i * 2], P[i * 2 + 1]], { renderer: s.renderer, radius: 3, weight: 0, fillOpacity: 0.8, fillColor: PALETTE[i % 6], idx: i + 1 }));

          g.addTo(s.map);
          await new Promise((r) => requestAnimationFrame(r)); // canvas draws inside the next animation frame
          const ms = performance.now() - t0;
          if (!ctx.active || id !== buildId) { g.remove(); return; }
          s.group = g;
          const nodes = s.kind === "svg" ? ctx.$(`[data-r="svg"] svg`)?.querySelectorAll("path").length ?? 0 : ctx.$(`[data-r="canvas"]`).querySelectorAll("canvas").length;
          s.tag.innerHTML = `<b>${s.kind === "svg" ? "L.svg()" : "L.canvas()"}</b><br><small>建立到繪製</small> <span class="mono">${fmtMs(ms)}</span><br><small>DOM 節點</small> <span class="mono">${fmt(nodes)}</span> ${s.kind === "svg" ? "個 path" : "張 canvas"}`;
        }
      }
      build(SIZES[1]);
    },
  },
  {
    id: "plugins", title: "外掛生態",
    api: "Leaflet.markercluster・Leaflet.heat・chunkedLoading",
    desc: "執行時載入兩個社群外掛：markercluster 以 chunkedLoading 分批加入 5,000 個標記並自動群集，leaflet.heat 用同一批點畫熱度圖。點位為示意資料。",
    hint: "點群集會放大到該範圍，最大縮放時展開成蜘蛛狀；切換群集、熱度圖或兩者疊加。",
    async mount(ctx) {
      ctx.html(`<div class="lf-map"></div>`);
      let cluster, heat;
      ctx.group(["群集", "熱度圖", "兩者"], 0, (i) => {
        if (!cluster) return;
        if (i !== 1) cluster.addTo(map); else cluster.remove();
        if (i !== 0) heat.addTo(map); else heat.remove();
      });
      const map = makeMap(ctx, { zoomControl: false, minZoom: 6 });
      map.fitBounds(TW_BOUNDS, { paddingTopLeft: [10, ctx.controls.offsetHeight + 10], paddingBottomRight: [10, 10] });
      watchTiles(ctx, dark()).addTo(map);
      L.control.zoom({ position: "bottomright" }).addTo(map);

      const st = ctx.status("載入 Leaflet.markercluster 與 Leaflet.heat…");
      const MC = "https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/";
      try {
        await ctx.css(`${MC}MarkerCluster.css`);
        await ctx.load([`${MC}leaflet.markercluster.js`, "https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"]);
      } catch (e) {
        st.error(`外掛載入失敗：${e.message}`);
        return;
      }
      if (!ctx.active) return;
      const N = 5000, P = points();
      const tone = (n) => (n < 30 ? "#4cc9f0" : n < 300 ? "#9d8cff" : "#f72585");
      cluster = L.markerClusterGroup({
        chunkedLoading: true, showCoverageOnHover: true, maxClusterRadius: 60,
        polygonOptions: { color: "#f7df1e", weight: 1.5, fillOpacity: 0.08 },
        chunkProgress: (done, total) => { st.text(`chunkedLoading 分批加入 ${fmt(done)} / ${fmt(total)}`); st.progress(done / total); if (done === total) st.done(); },
        iconCreateFunction: (c) => {
          const n = c.getChildCount(), s = n < 30 ? 30 : n < 300 ? 38 : 48;
          return L.divIcon({ className: "", html: `<div class="lf-cl" style="--k:${tone(n)};width:${s}px;height:${s}px">${fmtCompact(n)}</div>`, iconSize: [s, s] });
        },
      });
      const dot = L.divIcon({ className: "", html: '<div class="lf-dot"></div>', iconSize: [10, 10] });
      const markers = [], heatPts = [];
      for (let i = 0; i < N; i++) {
        const la = P[i * 2], ln = P[i * 2 + 1];
        markers.push(L.marker([la, ln], { icon: dot, title: `示意點位 #${i + 1}` }));
        heatPts.push([la, ln, 0.6]);
      }
      cluster.addTo(map);
      cluster.addLayers(markers);
      heat = L.heatLayer(heatPts, { radius: 16, blur: 18, maxZoom: 12, minOpacity: 0.25,
        gradient: { 0.25: "#1b2a4a", 0.45: "#4cc9f0", 0.65: "#9d8cff", 0.85: "#f72585", 1: "#f7df1e" } });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "L.circleMarker × N・L.canvas / L.svg・panBy",
    desc: "逐級增加向量圓點，地圖每幀以 panBy 沿 40 px 圓周平移，觸發渲染器重新投影並重繪全部圓點；可切換 Canvas 或 SVG 渲染器比較上限。",
    hint: "按「自動加壓」逐級量測，或拖曳手動滑桿；底部切換渲染器後再測一次比較。",
    mount(ctx) {
      ctx.html(`<div class="lf-stress"><div class="lf-map"></div></div>`);
      ctx.controls.classList.add("bottom");
      let kind = "canvas", layer = null, count = 0, buildMs = 0;
      ctx.group(["Canvas", "SVG"], 0, (i) => { kind = i ? "svg" : "canvas"; if (count) build(count); });
      const map = makeMap(ctx, { zoomControl: false, minZoom: 6 }, ctx.$(".lf-stress .lf-map"));
      map.fitBounds(TW_BOUNDS, { padding: [8, 8] });
      watchTiles(ctx, dark()).addTo(map);
      const renderers = { canvas: L.canvas({ padding: 0.3 }), svg: L.svg({ padding: 0.3 }) };
      function build(n) {
        const P = points();
        if (layer) layer.remove();
        const t0 = performance.now();
        const g = L.layerGroup();
        for (let i = 0; i < n; i++) g.addLayer(L.circleMarker([P[i * 2], P[i * 2 + 1]], { renderer: renderers[kind], radius: 2.5, weight: 0, fillOpacity: 0.75, fillColor: PALETTE[i % 6], interactive: false }));
        g.addTo(map);
        buildMs = performance.now() - t0;
        layer = g; count = n;
      }
      // Pan along a 40 px circle every frame; tiles stay inside the keep buffer.
      let ox = 0, oy = 0;
      ctx.raf((t) => {
        const a = t / 700, x = Math.cos(a) * 40, y = Math.sin(a) * 40;
        map.panBy([x - ox, y - oy], { animate: false });
        ox = x; oy = y;
      });
      ctx.ramp({
        label: "圓點", unit: "點", steps: [1000, 2500, 5000, 10000, 20000, 40000, 80000], minFps: 30,
        apply: (n) => build(n),
        metrics: () => ({ "渲染器": kind === "canvas" ? "Canvas" : "SVG", "建立耗時": fmtMs(buildMs) }),
        note: "每幀 panBy 會觸發 moveend，渲染器重新計算邊界並重繪全部圓點；SVG 每點一個 path 節點，Canvas 全部畫在一張畫布上。",
      });
    },
  },
] });
</script>
</body>
</html>
