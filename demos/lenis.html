<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenis 示範：平滑捲動與速度感</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { height: auto; min-height: 100%; }
  .hud { position: fixed; right: 12px; top: 12px; z-index: 50; width: 176px; padding: 10px 12px; font-size: 12px; }
  .hud .row { display: flex; justify-content: space-between; gap: 8px; }
  .hud .row b { font: 600 12px/1.6 var(--mono); color: var(--accent); }
  .hud .bar { margin: 6px 0 8px; }
  .hud .btn { width: 100%; padding: 7px 10px; font-size: 12px; }
  .hud label { display: block; margin-top: 8px; color: var(--muted); }
  .hud input { width: 100%; }
  .hero { height: 100vh; min-height: 420px; display: grid; place-items: center; text-align: center; position: relative; overflow: hidden; padding: 0 20px; }
  .blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .hero-in { position: relative; }
  .hero h1 { position: relative; margin: 0 0 12px; font-size: clamp(34px, 8vw, 78px); line-height: 1.1; font-weight: 900; letter-spacing: .02em; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { position: relative; margin: 0 auto 18px; max-width: 28em; color: var(--muted); }
  .jump { position: relative; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .down { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); font-size: 13px; }
  .down b { display: block; width: 16px; height: 16px; margin: 6px auto 0; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 6px; } }
  .sec-title { text-align: center; padding: 60px 20px 10px; }
  .sec-title h2 { margin: 0 0 4px; font-size: clamp(22px, 4.4vw, 36px); }
  .sec-title p { margin: 0; color: var(--muted); }
  .gallery { display: grid; gap: 28px; max-width: 760px; margin: 30px auto; padding: 0 20px; }
  .shot { margin: 0; border-radius: 16px; overflow: hidden; aspect-ratio: 16 / 9; will-change: transform; box-shadow: 0 18px 40px rgba(0,0,0,.4); }
  .shot img { width: 100%; height: 120%; object-fit: cover; display: block; will-change: transform; }
  .shot:nth-child(even) { margin-left: 12%; }
  .shot:nth-child(odd) { margin-right: 12%; }
  .marquee { overflow: hidden; padding: 40px 0; white-space: nowrap; }
  .marquee .row { display: inline-block; font-size: clamp(40px, 9vw, 96px); font-weight: 900; line-height: 1.15; will-change: transform; }
  .marquee .row.b { -webkit-text-stroke: 1.5px var(--c2); color: transparent; }
  .outro { padding: 80px 20px 120px; text-align: center; }
  @media (max-width: 520px) { .hud { width: 140px; padding: 8px 10px; } .hud label { display: none; } .hero-in { margin-top: 90px; } }
</style>
</head>
<body class="scroll">
<div class="hud panel">
  <div class="row"><span>捲動位置</span><b id="pos">0</b></div>
  <div class="row"><span>速度</span><b id="vel">0.0</b></div>
  <div class="bar"><i id="prog"></i></div>
  <button class="btn" id="smooth" aria-pressed="true">平滑捲動：開</button>
  <label>慣性 lerp <span id="lerpv">0.08</span><input type="range" id="lerp" min="0.02" max="0.3" step="0.01" value="0.08"></label>
</div>

<section class="hero" id="top">
  <div class="blob" style="width:340px;height:340px;left:-60px;top:-40px;background:var(--c6)"></div>
  <div class="blob" style="width:300px;height:300px;right:-40px;bottom:0;background:var(--c2)"></div>
  <div class="blob" style="width:200px;height:200px;left:45%;top:40%;background:var(--c3);opacity:.35"></div>
  <div class="hero-in">
    <h1>如絲般<br><em>滑順</em>的捲動</h1>
    <p>Lenis 把滾輪的每一格變成帶慣性的平滑曲線，還提供即時速度，讓畫面跟著捲動的力道反應。</p>
    <div class="jump">
      <button class="btn primary" data-to="#gallery">跳到畫廊</button>
      <button class="btn" data-to="#marquee">跳到跑馬燈</button>
    </div>
  </div>
  <div class="down">往下捲<b></b></div>
</section>

<div class="sec-title" id="gallery"><h2>速度驅動的傾斜</h2><p>捲得越快，照片越傾斜；停下來就回正。</p></div>
<div class="gallery">
  <figure class="shot"><img src="_shared/img/photo-1.jpg" alt="峽灣"></figure>
  <figure class="shot"><img src="_shared/img/photo-6.jpg" alt="水母"></figure>
  <figure class="shot"><img src="_shared/img/photo-5.jpg" alt="瀑布彩虹"></figure>
  <figure class="shot"><img src="_shared/img/photo-3.jpg" alt="山谷公路"></figure>
</div>

<div class="sec-title" id="marquee"><h2>跟著力道加速的跑馬燈</h2><p>往上捲會反向。</p></div>
<div class="marquee">
  <div class="row a" id="rowA"></div><br>
  <div class="row b" id="rowB"></div>
</div>

<div class="outro">
  <h2>到底了</h2>
  <p class="muted">把右上角的平滑捲動關掉，再捲一次比較手感。</p>
  <button class="btn primary" data-to="#top">平滑回到頂端</button>
</div>

<div class="hint">用滾輪捲動，感受慣性</div>

<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script>
const lenis = new Lenis({ lerp: 0.08, smoothWheel: true });

const $ = (id) => document.getElementById(id);
const shots = [...document.querySelectorAll(".shot")];
const rowA = $("rowA"), rowB = $("rowB");
rowA.textContent = "平滑・慣性・速度・".repeat(8);
rowB.textContent = "SMOOTH SCROLL ・ LENIS ・ ".repeat(8);
let marqueeX = 0; // unbounded offset, wrapped per row
let skew = 0;

lenis.on("scroll", (l) => {
  $("pos").textContent = Math.round(l.scroll);
  $("vel").textContent = l.velocity.toFixed(1);
  $("prog").style.width = (l.progress * 100).toFixed(1) + "%";
});

function raf(time) {
  lenis.raf(time);
  // Ease skew toward current velocity so images settle back when scrolling stops
  const target = Math.max(-12, Math.min(12, lenis.velocity * 0.35));
  skew += (target - skew) * 0.12;
  const vh = window.innerHeight;
  for (const s of shots) {
    s.style.transform = `skewY(${skew.toFixed(2)}deg)`;
    const r = s.getBoundingClientRect();
    const p = (r.top + r.height / 2 - vh / 2) / vh; // -1..1 around viewport center
    s.firstElementChild.style.transform = `translateY(${(-8 - p * 8).toFixed(2)}%)`;
  }
  // Marquee speed follows scroll force, direction follows scroll direction
  const dir = lenis.direction || 1;
  marqueeX += (0.6 + Math.abs(lenis.velocity) * 0.25) * dir;
  const wa = rowA.scrollWidth / 2, wb = rowB.scrollWidth / 2;
  const ma = ((marqueeX % wa) + wa) % wa, mb = ((marqueeX % wb) + wb) % wb;
  rowA.style.transform = `translateX(${-ma}px)`;
  rowB.style.transform = `translateX(${mb - wb}px)`;
  requestAnimationFrame(raf);
}
requestAnimationFrame(raf);

document.querySelectorAll("[data-to]").forEach((b) =>
  b.addEventListener("click", () => lenis.scrollTo(b.dataset.to, { duration: 1.8, easing: (t) => 1 - Math.pow(1 - t, 4) }))
);

$("smooth").addEventListener("click", (e) => {
  const on = !lenis.options.smoothWheel;
  lenis.options.smoothWheel = on;
  e.currentTarget.setAttribute("aria-pressed", on);
  e.currentTarget.textContent = "平滑捲動：" + (on ? "開" : "關");
});
$("lerp").addEventListener("input", (e) => {
  lenis.options.lerp = +e.target.value;
  $("lerpv").textContent = (+e.target.value).toFixed(2);
});
</script>
</body>
</html>
