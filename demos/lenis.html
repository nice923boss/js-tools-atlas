<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const { h } = Showcase;
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const IMG = (n) => `_shared/img/photo-${n}.jpg`;
const CDN = "https://cdn.jsdelivr.net/npm";
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  easeOutExpo: (t) => (t === 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  easeOutBack: (t) => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  easeOutQuart: (t) => 1 - Math.pow(1 - t, 4),
  linear: (t) => t,
};
// offsetTop summed up to `root` (ignores transforms, unlike getBoundingClientRect)
const topIn = (el, root) => { let y = 0; for (let n = el; n && n !== root; n = n.offsetParent) y += n.offsetTop; return y; };

// Every scene scrolls inside its own container, never the page. This builds it, attaches a Lenis
// instance to it (wrapper + content), keeps --vh / --vw in sync and destroys everything on unmount.
function lenisStage(ctx, html, { cls = "", options = {}, host = ctx.el, drive = true } = {}) {
  host.insertAdjacentHTML("beforeend", `<div class="scroller ${cls}" tabindex="0"><div class="page">${html}</div></div>`);
  const sc = host.lastElementChild, page = sc.firstElementChild;
  const st = {
    sc, page, lenis: null, onSize: [],
    build(o = options) {
      if (st.lenis) st.lenis.destroy();
      st.lenis = new Lenis({ wrapper: sc, content: page, ...o });
      return st.lenis;
    },
    $: (s) => sc.querySelector(s), $$: (s) => [...sc.querySelectorAll(s)],
  };
  let w = -1, hh = -1;
  const sync = () => {
    if (sc.clientWidth === w && sc.clientHeight === hh) return;
    w = sc.clientWidth; hh = sc.clientHeight;
    sc.style.setProperty("--vh", `${hh}px`); sc.style.setProperty("--vw", `${w}px`);
    st.onSize.forEach((fn) => fn());
  };
  sync();
  const ro = new ResizeObserver(sync);
  ro.observe(sc);
  st.build(options);
  if (drive) ctx.raf((t) => st.lenis.raf(t));
  ctx.onCleanup(() => { ro.disconnect(); st.lenis.destroy(); });
  return st;
}

// One wheel notch. A synthetic WheelEvent goes through Lenis's real input path (virtual-scroll,
// prevent checks, lerp / duration). With smoothWheel off Lenis leaves wheel input to the browser,
// and a synthetic event never scrolls natively, so do what the browser would: an instant scrollBy.
// Returns false when Lenis (or anyone) called preventDefault, i.e. Lenis took the input.
function notch(lenis, dy, dx = 0, target = lenis.options.wrapper) {
  const w = lenis.options.wrapper;
  if (!lenis.options.smoothWheel) {
    if (lenis.isHorizontal) w.scrollBy(Math.abs(dx) > Math.abs(dy) ? dx : dy, 0); else w.scrollBy(0, dy);
    return true;
  }
  return target.dispatchEvent(new WheelEvent("wheel", { deltaY: dy, deltaX: dx, bubbles: true, cancelable: true }));
}

// Self-running demo that stops for good on the first real wheel / touch / drag / key input.
// Our own synthetic wheel events are untrusted, so they never count as the user taking over.
function takeover(ctx, target, text = "自動示範中・捲動即接手") {
  const chip = h("div", { class: "auto-chip" }, text);
  ctx.el.append(chip);
  const s = { on: true, stop() { if (s.on) { s.on = false; chip.remove(); } } };
  const user = (e) => { if (e.isTrusted) s.stop(); };
  for (const t of ["wheel", "touchstart", "pointerdown", "keydown"]) ctx.on(target, t, user, { passive: true });
  return s;
}

// Slow wheel-driven ping-pong (or endless forward motion when infinite) so the preview moves.
function autoWheel(ctx, st, tk, { delta = 120, every = 220, pause = 900, axis } = {}) {
  let dir = 1, acc = 0, wait = 0, clock = 0;
  ctx.raf((t, dt) => {
    clock += dt;
    const l = st.lenis;
    if (!tk.on || l.limit <= 0) return;
    if (wait > 0) { wait -= dt; return; }
    if ((acc += dt) < every) return;
    acc = 0;
    if (!l.options.infinite) {
      if (dir > 0 && l.targetScroll >= l.limit - 2) { dir = -1; wait = pause; return; }
      if (dir < 0 && l.targetScroll <= 2) { dir = 1; wait = pause; return; }
    }
    const d = dir * (typeof delta === "function" ? delta(clock) : delta);
    if (axis && axis() === "x") notch(l, 0, d); else notch(l, d);
  });
}

const fmtPx = (v) => Math.round(v).toLocaleString("en-US");

Showcase.run({ scenes: [
  {
    id: "signature", title: "招牌絲滑頁",
    api: "new Lenis({ wrapper, content, lerp: 0.08 })・lenis.velocity",
    desc: "原版整頁示範搬進獨立捲動容器：滾輪每一格變成帶慣性的平滑曲線，照片依即時速度傾斜並帶視差，跑馬燈隨捲動力道加速、往上捲就反向。右上角是即時位置、速度與進度。",
    hint: "快速捲一段再停下・關掉平滑捲動比較手感",
    mount(ctx) {

      const ev = h("div", { class: "ev" });
      ev.innerHTML = `<div class="kv"><span>圈數</span><b class="laps">0</b></div><div class="kv"><span>direction</span><b class="dir">0</b></div>
        <div class="kv"><span>velocity</span><b class="vel">0</b></div><div class="kv"><span>狀態</span><b class="state">idle</b></div>
        <canvas></canvas><header>virtual-scroll</header><div class="vs"><div>等待輸入</div></div>`;
      ctx.el.append(ev);
      const lapsEl = ev.querySelector(".laps"), dirEl = ev.querySelector(".dir"), velEl = ev.querySelector(".vel"), stateEl = ev.querySelector(".state"),
        vsEl = ev.querySelector(".vs"), cv = ev.querySelector("canvas"), g = cv.getContext("2d");
      let stopped = false, laps = 0, last = null;
      const vs = [];
      const hook = () => {
        st.lenis.on("virtual-scroll", ({ deltaY }) => {
          vs.unshift(`${deltaY > 0 ? "▼" : "▲"} Δy ${deltaY.toFixed(0)}${stopped ? "（已停止，未捲動）" : ""}`);
          vs.length = Math.min(vs.length, 5);
          vsEl.innerHTML = vs.map((s) => `<div>${s}</div>`).join("");
        });
        last = null;
      };
      hook();
      const rebuild = () => {
        st.page.classList.toggle("finite", !opts.infinite);
        st.build(opts);
        hook();
        if (stopped) st.lenis.stop();
      };
      const hist = [];
      ctx.raf(() => {
        const l = st.lenis, s = l.scroll, now = performance.now();
        if (last != null && opts.infinite && l.limit > 0) {
          if (s - last < -l.limit / 2) laps++; else if (s - last > l.limit / 2) laps--;
        }
        last = s;
        lapsEl.textContent = opts.infinite ? String(laps) : "（未開啟）";
        dirEl.textContent = l.direction > 0 ? "1 往下" : l.direction < 0 ? "-1 往上" : "0";
        velEl.textContent = `${l.velocity.toFixed(1)} px/幀`;
        stateEl.textContent = l.isStopped ? "stopped" : l.isScrolling ? `scrolling・${l.isScrolling}` : "idle";
        hist.push([now, l.velocity]);
        while (hist.length && now - hist[0][0] > 3000) hist.shift();
        const W = cv.clientWidth, H = cv.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
        if (cv.width !== Math.round(W * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, W, H);
        g.strokeStyle = "rgba(127,127,127,.35)"; g.lineWidth = 1;
        g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
        g.strokeStyle = COLORS[0]; g.lineWidth = 1.5; g.beginPath();
        hist.forEach(([t, v], i) => {
          const x = W - ((now - t) / 3000) * W, y = H / 2 - clamp(v / 40, -1, 1) * (H / 2 - 2);
          if (i) g.lineTo(x, y); else g.moveTo(x, y);
        });
        g.stroke();
      });
      ctx.toggle("infinite", true, (v) => { opts = { ...opts, infinite: v }; laps = 0; rebuild(); });
      const sb = ctx.button("stop()", () => {
        stopped = !stopped;
        if (stopped) st.lenis.stop(); else st.lenis.start();
        sb.textContent = stopped ? "start()" : "stop()";
      });
      ctx.slider("wheelMultiplier", { min: 0.2, max: 3, step: 0.1, value: 1, format: (v) => `${v.toFixed(1)}×` }, (v) => { opts = { ...opts, wheelMultiplier: v }; rebuild(); });
      const tk = takeover(ctx, st.sc);
      autoWheel(ctx, st, tk, { delta: 100, every: 200 });
    },
  },

  {
    id: "snap", title: "Snap 吸附",
    api: "new Snap(lenis, { type, duration, onSnapStart, onSnapComplete })",
    desc: "官方 lenis/snap 外掛：停止輸入 500ms 後把位置吸到吸附點。mandatory 一定吸附；proximity 只在 40% 容器高度內才吸；lock 每次只走一格，途中鎖住輸入。吸附點用 add(offsetTop) 註冊，因為 addElement 依整個視窗計算，不適用巢狀容器。",
    hint: "捲一小段後放開・切到 lock 每次只走一格",
    async mount(ctx) {
      await ctx.load(`${CDN}/lenis@1.3.26/dist/lenis-snap.min.js`);
      if (!ctx.active) return;
      const data = [
        [1, "峽灣", "放開滾輪 500ms 後，Snap 找最近的吸附點。"],
        [2, "紅岩峽谷", "mandatory：不管離多遠都會吸過去。"],
        [5, "瀑布彩虹", "proximity：距離在門檻內才吸，否則停在原地。"],
        [3, "山谷公路", "lock：每次輸入只前進或後退一格。"],
        [7, "母獅", "右側圓點呼叫 snap.goTo(index)。"],
        [6, "水母", "onSnapStart 與 onSnapComplete 記錄在左上角。"],
      ];
      const st = lenisStage(ctx, data.map(([n, t, p], i) =>
        `<section class="slide" style="background-image:url(${IMG(n)})"><div class="num">0${i + 1}</div><h3>${t}</h3><p>${p}</p></section>`).join(""),
        { cls: "s-snap", options: { lerp: 0.1 } });
      const els = st.$$(".slide");
      const log = h("div", { class: "snap-log" });
      ctx.el.append(log);
      const lines = [];
      let snap = null;
      const render = () => { log.innerHTML = `<b>type: ${snap.options.type}</b>${lines.map((s) => `<div>${s}</div>`).join("")}`; };
      const say = (s) => { lines.unshift(s); lines.length = Math.min(lines.length, 3); render(); };
      snap = new Snap(st.lenis, {
        type: "mandatory", duration: 0.8, easing: EASE.easeOutQuart,
        onSnapStart: (s) => say(`<span class="t">onSnapStart</span> #${s.index + 1}`),
        onSnapComplete: (s) => say(`<span class="t">onSnapComplete</span> #${s.index + 1}`),
      });
      // stop() first so a pending debounced snap cannot fire after destroy
      ctx.onCleanup(() => { snap.stop(); snap.destroy(); });
      render();
      let removers = [];
      const setPoints = () => {
        removers.forEach((r) => r());
        removers = els.map((el) => snap.add(el.offsetTop));
        snap.options.distanceThreshold = Math.round(st.sc.clientHeight * 0.4);
      };
      setPoints();
      st.onSize.push(setPoints);
      const tk = takeover(ctx, st.sc, "自動示範：捲一小段後放開");
      const dots = h("div", { class: "dots" });
      els.forEach((_, i) => dots.append(h("button", { type: "button", "aria-label": `第 ${i + 1} 張` })));
      ctx.el.append(dots);
      const dotEls = [...dots.children];
      ctx.on(dots, "click", (e) => { const i = dotEls.indexOf(e.target); if (i >= 0) { tk.stop(); snap.goTo(i); } });
      let cur = -1;
      ctx.raf(() => {
        const i = Math.round(st.lenis.scroll / st.sc.clientHeight);
        if (i !== cur) { cur = i; dotEls.forEach((d, k) => d.classList.toggle("on", k === i)); }
      });
      ctx.group(["mandatory", "proximity", "lock"], 0, (i, l) => { snap.options.type = l; render(); });
      ctx.button("‹ previous()", () => { tk.stop(); snap.previous(); });
      ctx.button("next() ›", () => { tk.stop(); snap.next(); });
      ctx.toggle("吸附", true, (v) => (v ? snap.start() : snap.stop()));
      let dir = 1;
      const nudge = () => {
        if (!tk.on) return;
        const vh = st.sc.clientHeight, i = Math.round(st.lenis.scroll / vh);
        if (i >= els.length - 1) dir = -1; else if (i <= 0) dir = 1;
        for (let k = 0; k < 4; k++) ctx.timeout(() => tk.on && notch(st.lenis, dir * vh * 0.16), k * 60);
      };
      ctx.timeout(nudge, 500);
      ctx.interval(nudge, 2600);
    },
  },

  {
    id: "scrolltrigger", title: "搭配 ScrollTrigger",
    api: "lenis.on(\"scroll\", ScrollTrigger.update)・gsap.ticker.add(t => lenis.raf(t * 1000))",
    desc: "官方建議的整合方式：Lenis 交給 GSAP ticker 驅動，每次捲動同步通知 ScrollTrigger。釘選圓環的擦洗時間軸、照片視差都跟著平滑後的位置走，照片傾斜讀的是 lenis.velocity。右上角同時列出 Lenis 位置與 ScrollTrigger 進度。",
    hint: "往下捲到圓環區段・往回捲動畫倒轉",
    async mount(ctx) {
      await ctx.load([`${CDN}/gsap@3.15.0/dist/gsap.min.js`, `${CDN}/gsap@3.15.0/dist/ScrollTrigger.min.js`]);
      if (!ctx.active) return;
      gsap.registerPlugin(ScrollTrigger);
      const figs = [[2, "紅岩峽谷"], [8, "海象群"], [4, "巴哥犬"]]
        .map(([n, t]) => `<figure><img src="${IMG(n)}" alt="${t}"><figcaption>${t}</figcaption></figure>`).join("");
      const st = lenisStage(ctx, `
        <section class="intro"><div class="kicker">LENIS × SCROLLTRIGGER</div><h2>平滑捲動，照樣精準觸發</h2>
          <p>Lenis 負責把捲動變滑順，ScrollTrigger 負責把捲動位置換成動畫進度，兩者共用同一個時鐘。</p></section>
        <section class="ring"><div class="tag">pin + scrub</div><svg viewBox="0 0 200 200"><circle class="track" cx="100" cy="100" r="80"/><circle class="arc" cx="100" cy="100" r="80"/></svg>
          <div class="pct">0%</div><div class="words"><span>釘選</span><span>擦洗</span><span>同步</span></div></section>
        <section class="gal">${figs}</section>
        <section class="outro"><div><h2>到底了</h2><p>往回捲，圓環與照片視差都會倒轉。</p></div></section>`,
        { cls: "s-st", options: { lerp: 0.08 }, drive: false });
      const sc = st.sc;
      ScrollTrigger.defaults({ scroller: sc });
      const hud = h("div", { class: "hud" });
      hud.innerHTML = `<div><span>lenis.scroll</span><b class="pos">0</b></div><div><span>圓環進度</span><b class="prog">0%</b></div><div><span>釘選中</span><b class="pin">否</b></div>`;
      ctx.el.append(hud);
      const posEl = hud.querySelector(".pos"), progEl = hud.querySelector(".prog"), pinEl = hud.querySelector(".pin");
      const figEls = st.$$(".gal figure");
      let ring = null, skew = 0;
      const g = gsap.context(() => {
        const C = 2 * Math.PI * 80, pct = st.$(".pct");
        gsap.set(st.$(".arc"), { strokeDasharray: C, strokeDashoffset: C, rotation: -90, transformOrigin: "50% 50%" });
        const tl = gsap.timeline({
          defaults: { ease: "none" },
          scrollTrigger: { trigger: st.$(".ring"), pin: true, scrub: true, start: "top top", end: "+=150%" },
        });
        tl.to(st.$(".arc"), { strokeDashoffset: 0, duration: 1, onUpdate() { pct.textContent = `${Math.round(this.progress() * 100)}%`; } }, 0)
          .from(st.$$(".words span"), { opacity: 0, y: 30, stagger: 0.25, duration: 0.3 }, 0.1)
          .to(st.$("svg"), { scale: 1.12, duration: 0.3 }, 0.7);
        ring = tl.scrollTrigger;
        st.$$(".gal img").forEach((img) => gsap.fromTo(img, { yPercent: -12 }, {
          yPercent: 12, ease: "none", immediateRender: false,
          scrollTrigger: { trigger: img.parentNode, start: "top bottom", end: "bottom top", scrub: true },
        }));
      }, sc);
      const off = st.lenis.on("scroll", ScrollTrigger.update);
      const onRefresh = () => st.lenis.resize();
      ScrollTrigger.addEventListener("refresh", onRefresh);
      const tick = (time) => {
        const l = st.lenis;
        l.raf(time * 1000);
        skew += (clamp(l.velocity * 0.3, -10, 10) - skew) * 0.12;
        for (const f of figEls) f.style.transform = `skewY(${skew.toFixed(2)}deg)`;
        posEl.textContent = fmtPx(l.scroll);
        progEl.textContent = `${Math.round(ring.progress * 100)}%`;
        pinEl.textContent = ring.isActive ? "是" : "否";
      };
      gsap.ticker.add(tick);
      gsap.ticker.lagSmoothing(0);
      ctx.onCleanup(() => {
        gsap.ticker.remove(tick);
        gsap.ticker.lagSmoothing(500, 33);
        off();
        ScrollTrigger.removeEventListener("refresh", onRefresh);
        g.revert();
        ScrollTrigger.getAll().forEach((t) => t.kill());
      });
      st.onSize.push(() => requestAnimationFrame(() => ctx.active && ScrollTrigger.refresh()));
      ctx.toggle("平滑捲動", true, (v) => { st.lenis.options.smoothWheel = v; });
      ctx.slider("lerp", { min: 0.02, max: 0.3, step: 0.01, value: 0.08 }, (v) => { st.lenis.options.lerp = v; });
      const tk = takeover(ctx, sc);
      autoWheel(ctx, st, tk, { delta: 90, every: 200 });
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "lenis.on(\"scroll\", () => N × el.style.transform)",
    desc: "Lenis 每幀只更新一個捲動位置，實務上的成本在 scroll 回呼。每個方塊依各自速度做視差位移，容器持續以滾輪自動上下捲；逐級加倍方塊數，直到掉到 30 FPS 以下。可切到 top 位移（每幀觸發版面配置）比較。",
    hint: "按「自動加壓」開始・切到 top 模式後再測一次",
    mount(ctx) {
      ctx.controls.classList.add("bottom");
      const st = lenisStage(ctx, `<div class="st-grid"></div>`, { cls: "stress", options: { lerp: 0.1 } });
      const grid = st.$(".st-grid");
      let items = [], base = [], speed = [], useTop = false, cost = 0, autoOn = true;
      // items are position: relative, so offsetTop includes any `top` offset: clear it before measuring
      const measure = () => {
        if (useTop) for (const el of items) el.style.top = "";
        base = items.map((el) => el.offsetTop + el.offsetHeight / 2);
      };
      const update = () => {
        const t0 = performance.now(), c = st.lenis.scroll + st.sc.clientHeight / 2, n = items.length;
        if (useTop) for (let i = 0; i < n; i++) items[i].style.top = `${((base[i] - c) * speed[i]).toFixed(1)}px`;
        else for (let i = 0; i < n; i++) items[i].style.transform = `translateY(${((base[i] - c) * speed[i]).toFixed(1)}px)`;
        const ms = performance.now() - t0;
        cost = cost ? cost * 0.85 + ms * 0.15 : ms;
      };
      const build = (n) => {
        const frag = document.createDocumentFragment();
        items = Array.from({ length: n }, (_, i) => {
          const el = document.createElement("i");
          el.style.background = COLORS[i % 6];
          frag.append(el);
          return el;
        });
        speed = items.map((_, i) => (((i * 7) % 11) - 5) * 0.06);
        grid.replaceChildren(frag);
        measure();
        cost = 0;
        update();
      };
      st.lenis.on("scroll", update);
      st.onSize.push(() => { measure(); update(); });
      ctx.group(["transform", "top（觸發版面配置）"], 0, (i) => {
        if (useTop === !!i) return;
        for (const el of items) { el.style.transform = ""; el.style.top = ""; }
        useTop = !!i;
        measure(); cost = 0; update();
      });
      ctx.toggle("自動捲動", true, (v) => { autoOn = v; });
      autoWheel(ctx, st, { get on() { return autoOn; } }, { delta: 90, every: 70, pause: 300 });
      ctx.ramp({
        label: "視差元素", unit: "個", steps: [250, 500, 1000, 2000, 4000, 8000, 16000, 32000],
        apply: build,
        metrics: () => ({
          "回呼耗時": Showcase.fmtMs(cost),
          "速度": `${Math.abs(st.lenis.velocity).toFixed(1)} px/幀`,
        }),
        note: "回呼耗時只算 scroll 回呼裡 JS 寫入樣式的時間；之後的樣式重算、版面配置與繪製不在這個數字裡，FPS 才反映總成本。transform 只需重新合成，top 每幀都要重排整個格線，所以同樣數量下掉得更快。Lenis 本身的成本與元素數量無關。",
      });
    },
  },
] });
</script>
</body>
</html>
