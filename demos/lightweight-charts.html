<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["台股 K 線","六種系列","即時串流","價格線與標記","十字線模式","多窗格指標","價格軸與在地化","極限測試"],"note":"指數、類股與成交量皆為隨機生成的示意資料，非真實行情"}</script>
<style>
  .lw-card { position: relative; min-height: 0; min-width: 0; padding: 8px 10px 6px; display: flex; flex-direction: column; }
  .lw-card h2 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lw-card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .lw-card h2 code { font: 500 10.5px/1 var(--mono); color: var(--muted); margin-left: 4px; }
  .lw-box { position: relative; flex: 1; min-height: 0; }
  .lw-fill { position: absolute; inset: 0; }
  .lw-solo { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: flex; }
  .lw-solo > .lw-card { flex: 1; }
  .lw-grid { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 8px;
    grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 560px) { .lw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); } }

  .lw-legend { position: absolute; left: 6px; top: 2px; z-index: 5; pointer-events: none; font: 12px/1.55 var(--font); color: var(--muted); max-width: calc(100% - 80px); }
  .lw-legend b { font-family: var(--mono); color: var(--fg); font-weight: 600; }
  .lw-legend .lw-up, .lw-tip .lw-up { color: #f23645; }
  .lw-legend .lw-down, .lw-tip .lw-down { color: #22ab94; }
  .lw-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }

  .lw-tip { position: absolute; z-index: 6; pointer-events: none; padding: 6px 9px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
    font: 12px/1.55 var(--font); color: var(--muted); white-space: nowrap; display: none; }
  .lw-tip b { font-family: var(--mono); color: var(--fg); font-weight: 600; }
  .lw-tip .lw-head { color: var(--fg); font-weight: 600; }

  .lw-note { position: absolute; left: 8px; top: 4px; z-index: 5; pointer-events: none; max-width: calc(100% - 90px);
    padding: 4px 9px; border-radius: 7px; background: var(--panel); border: 1px solid var(--line); font: 12px/1.5 var(--font); color: var(--muted); }
  .lw-note b { color: var(--accent); font-weight: 600; }
  .lw-shot { position: absolute; right: 70px; top: 30px; z-index: 7; width: min(42%, 320px); padding: 6px; border-radius: 9px; cursor: pointer;
    background: var(--bg-2); border: 1px solid var(--accent); box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .lw-shot img { display: block; width: 100%; border-radius: 5px; }
  .lw-shot div { font: 11.5px/1.5 var(--font); color: var(--muted); margin-top: 4px; }

  .lw-stress { position: absolute; inset: 8px 8px 8px 350px; padding: 8px; }
  .lw-stress .lw-fill { inset: 8px; }
  @media (max-width: 760px) { .lw-stress { inset: 8px; opacity: .9; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Lightweight Charts v5 showcase: eight scenes from a Taiwan-style candlestick chart to a setData() stress bench.
const L = LightweightCharts;
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim();
const UP = "#f23645", DOWN = "#22ab94"; // Taiwan convention: red = up, green = down
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const CANDLE = { upColor: UP, downColor: DOWN, borderUpColor: UP, borderDownColor: DOWN, wickUpColor: UP, wickDownColor: DOWN };
const pad = (v) => String(v).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmt = (v) => Math.round(v).toLocaleString();
// The library hands times back as strings, BusinessDay objects or UTC timestamps; normalise to [y, m, d].
const ymd = (t) => typeof t === "string" ? t.split("-").map(Number)
  : typeof t === "number" ? ((d) => [d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()])(new Date(t * 1000))
  : [t.year, t.month, t.day];
const key = (t) => ymd(t).join("-");
const hhmm = (t) => { const d = new Date(t * 1000); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };

// Seeded generator so every visit shows the same "market".
function rng(seed) {
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const gauss = () => { let s = 0; for (let i = 0; i < 6; i++) s += rnd(); return (s - 3) * 1.41; };
  return { rnd, gauss };
}

function makeDaily() {
  const { gauss } = rng(20240102);
  const out = [];
  let close = 17900;
  for (let d = new Date(2024, 0, 2); d.getFullYear() === 2024; d.setDate(d.getDate() + 1)) {
    const wd = d.getDay(), m = d.getMonth(), day = d.getDate();
    if (wd === 0 || wd === 6 || (m === 1 && day >= 6 && day <= 14)) continue; // weekends and Lunar New Year break
    const drift = m < 6 ? 0.0022 : m === 6 ? -0.0025 : m >= 9 ? 0.0007 : 0.001;
    const shock = m === 7 && day === 5 ? -0.08 : m === 7 && day === 6 ? 0.034 : 0;
    const ret = drift + gauss() * 0.009 + shock;
    const open = close * (1 + gauss() * 0.003);
    const c = close * (1 + ret);
    const high = Math.max(open, c) * (1 + Math.abs(gauss()) * 0.004);
    const low = Math.min(open, c) * (1 - Math.abs(gauss()) * 0.004);
    const vol = Math.max(1800, 3600 * (1 + Math.abs(ret) * 22 + gauss() * 0.12));
    out.push({ time: iso(d), open, high, low, close: c, vol });
    close = c;
  }
  return out;
}

// Weekly bars keyed by the first trading day of each week.
function toWeekly(daily) {
  const weeks = new Map();
  for (const b of daily) {
    const d = new Date(b.time), monday = new Date(d);
    monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const k = iso(monday), w = weeks.get(k);
    if (!w) weeks.set(k, { ...b });
    else weeks.set(k, { ...w, high: Math.max(w.high, b.high), low: Math.min(w.low, b.low), close: b.close, vol: w.vol + b.vol });
  }
  return [...weeks.values()];
}

const movingAvg = (bars, n) => bars.map((b, i) => (i < n - 1 ? null : { time: b.time, value: bars.slice(i - n + 1, i + 1).reduce((s, x) => s + x.close, 0) / n })).filter(Boolean);
const ema = (arr, n) => { const k = 2 / (n + 1); let e = arr[0]; return arr.map((v, i) => (e = i ? v * k + e * (1 - k) : v)); };
function rsi(closes, n = 14) {
  const out = [];
  let g = 0, l = 0;
  for (let i = 1; i < closes.length; i++) {
    const d = closes[i] - closes[i - 1], up = Math.max(d, 0), dn = Math.max(-d, 0);
    if (i <= n) { g += up; l += dn; if (i === n) { g /= n; l /= n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)); } }
    else { g = (g * (n - 1) + up) / n; l = (l * (n - 1) + dn) / n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)); }
  }
  return out;
}

function crossMarkers(fast, slow) {
  const slowAt = new Map(slow.map((p) => [p.time, p.value]));
  const marks = [];
  let prev = null;
  for (const p of fast) {
    if (!slowAt.has(p.time)) continue;
    const diff = p.value - slowAt.get(p.time);
    if (prev !== null && Math.sign(diff) !== Math.sign(prev)) {
      marks.push(diff > 0
        ? { time: p.time, position: "belowBar", color: UP, shape: "arrowUp", text: "黃金交叉" }
        : { time: p.time, position: "aboveBar", color: DOWN, shape: "arrowDown", text: "死亡交叉" });
    }
    prev = diff;
  }
  return marks;
}

const DAILY = makeDaily();
const volBar = (b) => ({ time: b.time, value: b.vol, color: b.close >= b.open ? rgba(UP, 0.55) : rgba(DOWN, 0.55) });

function tickMark(t, type) {
  if (type >= 3) return hhmm(t);
  const [y, m, d] = ymd(t);
  return type === 0 ? `${y} 年` : type === 1 ? `${m} 月` : `${d} 日`;
}

const BASE = {
  autoSize: true,
  layout: { background: { color: "transparent" }, textColor: "#9b998f", fontFamily: FONT, fontSize: 11,
    panes: { separatorColor: "rgba(255,255,255,0.12)", separatorHoverColor: "rgba(247,223,30,0.25)", enableResize: true } },
  grid: { vertLines: { color: "rgba(255,255,255,0.04)" }, horzLines: { color: "rgba(255,255,255,0.06)" } },
  crosshair: { mode: L.CrosshairMode.Normal, vertLine: { labelBackgroundColor: "#2a2d33" }, horzLine: { labelBackgroundColor: "#2a2d33" } },
  rightPriceScale: { borderColor: "rgba(255,255,255,0.12)" },
  leftPriceScale: { borderColor: "rgba(255,255,255,0.12)" },
  timeScale: { borderColor: "rgba(255,255,255,0.12)", tickMarkFormatter: tickMark },
  localization: { locale: "zh-TW", dateFormat: "yyyy/MM/dd" },
};

// Create a chart with the shared dark theme and remove it when the scene unmounts.
function mk(ctx, el, opts) {
  const c = L.createChart(el, BASE);
  if (opts) c.applyOptions(opts);
  ctx.onCleanup(() => c.remove());
  return c;
}

const card = (title, sub = "", extra = "") =>
  `<div class="panel lw-card"><h2>${title}${sub ? `<small>${sub}</small>` : ""}</h2><div class="lw-box"><div class="lw-fill"></div>${extra}</div></div>`;

Showcase.run({
  scenes: [
  {
    id: "taiex", title: "台股 K 線",
    api: "addSeries(CandlestickSeries) + paneIndex + createSeriesMarkers + series.update()",
    desc: "日 K 與成交量分屬兩個窗格（v5 的 paneIndex），月線季線交叉時自動標出黃金交叉與死亡交叉；最後一根 K 棒每 0.45 秒用 series.update() 跳動，十字線移動時圖例同步顯示開高低收。",
    hint: "滾輪縮放、拖曳平移、拖動窗格分隔線；切換日 K／週 K 與均線",
    mount(ctx) {
      ctx.html(`<div class="lw-solo">${card(`<span class="lw-name">台股模擬指數 2024 日 K</span>`, "示意資料・紅漲綠跌", `<div class="lw-legend"></div>`)}</div>`);
      const FRAMES = {
        day: { bars: DAILY, ma: [20, 60], label: "日 K" },
        week: { bars: toWeekly(DAILY), ma: [4, 13], label: "週 K" },
      };
      const lg = ctx.$(".lw-legend");
      const chart = mk(ctx, ctx.$(".lw-fill"), { timeScale: { rightOffset: 4, barSpacing: 6 }, localization: { priceFormatter: (p) => fmt(p) } });
      const candles = chart.addSeries(L.CandlestickSeries, CANDLE);
      const lineOpt = { lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };
      const ma1 = chart.addSeries(L.LineSeries, { ...lineOpt, color: C[0] });
      const ma2 = chart.addSeries(L.LineSeries, { ...lineOpt, color: C[5] });
      const volume = chart.addSeries(L.HistogramSeries, {
        priceFormat: { type: "custom", minMove: 1, formatter: (v) => `${fmt(v)} 億` }, priceLineVisible: false,
      }, 1);
      chart.panes()[0].setStretchFactor(3);
      chart.panes()[1].setStretchFactor(1);
      L.createTextWatermark(chart.panes()[0], { horzAlign: "center", vertAlign: "center",
        lines: [{ text: "示意資料", color: "rgba(255,255,255,0.05)", fontSize: 56, fontStyle: "bold", fontFamily: FONT }] });
      const markers = L.createSeriesMarkers(candles, []);

      let tf = "day", bars = [], maLast = [], showMa = true, live = true, hovering = false;
      function legend(param) {
        const bar = param && param.time ? param.seriesData.get(candles) : bars[bars.length - 1];
        if (!bar) return;
        const i = bars.findIndex((b) => key(b.time) === key(bar.time));
        const prev = bars[i - 1] || bar;
        const chg = ((bar.close - prev.close) / prev.close) * 100, cls = chg >= 0 ? "lw-up" : "lw-down";
        const m1 = param && param.time ? param.seriesData.get(ma1) : maLast[0];
        const m2 = param && param.time ? param.seriesData.get(ma2) : maLast[1];
        const br = ctx.size().width < 640 ? "<br>" : "　";
        const [y, m, d] = ymd(bar.time);
        lg.innerHTML =
          `<b>${y}/${pad(m)}/${pad(d)}</b>　收 <b class="${cls}">${fmt(bar.close)}</b> <span class="${cls}">${chg >= 0 ? "▲" : "▼"} ${Math.abs(chg).toFixed(2)}%</span>` +
          `${br}開 <b>${fmt(bar.open)}</b> 高 <b>${fmt(bar.high)}</b> 低 <b>${fmt(bar.low)}</b>　量 <b>${fmt(bars[i] ? bars[i].vol : 0)}</b> 億` +
          (showMa ? `${br}<span style="color:${C[0]}">月線 ${m1 ? fmt(m1.value) : "-"}</span>　<span style="color:${C[5]}">季線 ${m2 ? fmt(m2.value) : "-"}</span>` : "");
      }
      function load() {
        const f = FRAMES[tf];
        bars = f.bars.map((b) => ({ ...b }));
        candles.setData(bars);
        volume.setData(bars.map(volBar));
        const a = movingAvg(bars, f.ma[0]), b = movingAvg(bars, f.ma[1]);
        maLast = [a[a.length - 1], b[b.length - 1]];
        ma1.setData(a);
        ma2.setData(b);
        markers.setMarkers(crossMarkers(a, b));
        ctx.$(".lw-name").textContent = `台股模擬指數 2024 ${f.label}`;
        chart.timeScale().fitContent();
        legend();
      }
      chart.subscribeCrosshairMove((param) => { hovering = !!param.time; legend(param); });
      load();

      // Live mode: jiggle the last bar like an intraday feed.
      const { gauss, rnd } = rng(77);
      ctx.interval(() => {
        if (!live) return;
        const last = bars[bars.length - 1];
        const close = last.close * (1 + gauss() * 0.0012);
        const next = { ...last, close, high: Math.max(last.high, close), low: Math.min(last.low, close), vol: last.vol + 8 + rnd() * 20 };
        bars[bars.length - 1] = next;
        candles.update(next);
        volume.update(volBar(next));
        if (!hovering) legend();
      }, 450);

      ctx.group(["日 K", "週 K"], 0, (i) => { tf = i ? "week" : "day"; load(); });
      ctx.toggle("均線", true, (v) => { showMa = v; ma1.applyOptions({ visible: v }); ma2.applyOptions({ visible: v }); legend(); });
      ctx.toggle("即時跳動", true, (v) => { live = v; });
    },
  },
  {
    id: "series", title: "六種系列",
    api: "CandlestickSeries・BarSeries・LineSeries・AreaSeries・BaselineSeries・HistogramSeries",
    desc: "同一段 90 個交易日資料畫成內建的六種系列。打開同步後，任一張圖的十字線會用 setCrosshairPosition() 帶動其他五張，縮放平移也透過 setVisibleLogicalRange() 一起連動。",
    hint: "在任一張圖上移動或縮放；切換折線與面積的線型",
    mount(ctx) {
      const SUB = DAILY.slice(-90);
      const prevClose = DAILY[DAILY.length - 91].close;
      const mean = SUB.reduce((s, b) => s + b.close, 0) / SUB.length;
      const closes = SUB.map((b) => ({ time: b.time, value: b.close }));
      const defs = [
        { name: "K 線", def: "CandlestickSeries", opts: CANDLE, data: SUB },
        { name: "美式 OHLC", def: "BarSeries", opts: { upColor: UP, downColor: DOWN, thinBars: false }, data: SUB },
        { name: "折線", def: "LineSeries", opts: { color: C[1], lineWidth: 2 }, data: closes },
        { name: "面積", def: "AreaSeries", opts: { lineColor: C[3], topColor: rgba(C[3], 0.4), bottomColor: rgba(C[3], 0.02), lineWidth: 2 }, data: closes },
        { name: "基準線", def: "BaselineSeries", opts: { baseValue: { type: "price", price: mean },
          topLineColor: UP, topFillColor1: rgba(UP, 0.35), topFillColor2: rgba(UP, 0.03),
          bottomLineColor: DOWN, bottomFillColor1: rgba(DOWN, 0.03), bottomFillColor2: rgba(DOWN, 0.35) }, data: closes },
        { name: "直方圖（日漲跌 %）", def: "HistogramSeries", opts: { priceFormat: { type: "percent" } },
          data: SUB.map((b, i) => { const p = i ? SUB[i - 1].close : prevClose; const v = ((b.close - p) / p) * 100; return { time: b.time, value: v, color: v >= 0 ? UP : DOWN }; }) },
      ];
      ctx.html(`<div class="lw-grid">${defs.map((d) => card(`${d.name}<code>${d.def}</code>`)).join("")}</div>`);
      const boxes = ctx.$$(".lw-fill");
      const items = defs.map((d, i) => {
        const chart = mk(ctx, boxes[i], { layout: { fontSize: 10 }, timeScale: { rightOffset: 2 }, rightPriceScale: { scaleMargins: { top: 0.12, bottom: 0.08 } },
          localization: { priceFormatter: i === 5 ? (p) => `${p.toFixed(1)}%` : (p) => fmt(p) } });
        const series = chart.addSeries(L[d.def], { ...d.opts, priceLineVisible: false });
        series.setData(d.data);
        if (d.def === "BaselineSeries") series.createPriceLine({ price: mean, color: "rgba(255,255,255,0.35)", lineStyle: L.LineStyle.Dotted, title: "均值", lineWidth: 1 });
        chart.timeScale().fitContent();
        const at = new Map(d.data.map((p) => [key(p.time), p]));
        return { chart, series, at };
      });
      let sync = true, lock = false;
      for (const a of items) {
        a.chart.subscribeCrosshairMove((p) => {
          if (lock || !sync) return;
          lock = true;
          for (const b of items) {
            if (b === a) continue;
            const pt = p.time !== undefined ? b.at.get(key(p.time)) : null;
            if (pt) b.chart.setCrosshairPosition(pt.close !== undefined ? pt.close : pt.value, pt.time, b.series);
            else b.chart.clearCrosshairPosition();
          }
          lock = false;
        });
        a.chart.timeScale().subscribeVisibleLogicalRangeChange((r) => {
          if (lock || !sync || !r) return;
          lock = true;
          for (const b of items) if (b !== a) b.chart.timeScale().setVisibleLogicalRange(r);
          lock = false;
        });
      }
      const TYPES = [L.LineType.Simple, L.LineType.WithSteps, L.LineType.Curved];
      ctx.group(["直線", "階梯", "曲線"], 0, (i) => { items[2].series.applyOptions({ lineType: TYPES[i] }); items[3].series.applyOptions({ lineType: TYPES[i] }); });
      ctx.toggle("同步十字線與縮放", true, (v) => { sync = v; if (!v) items.forEach((x) => x.chart.clearCrosshairPosition()); });
      ctx.button("全部還原", () => items.forEach((x) => x.chart.timeScale().fitContent()));
    },
  },
  {
    id: "stream", title: "即時串流",
    api: "series.update() + scrollToRealTime() + subscribeVisibleLogicalRangeChange + createUpDownMarkers",
    desc: "模擬成交 tick 聚合成 1 分 K：同一分鐘內用 update() 改寫最後一根，跨分鐘就新增一根。往左拖到最舊資料時，subscribeVisibleLogicalRangeChange 觸發補載更早的歷史；折線模式開啟最新價脈動動畫與漲跌標記外掛。",
    hint: "調整 tick 速度；往左拖到底會自動補載歷史，按「回到最新」跟上即時",
    mount(ctx) {
      ctx.html(`<div class="lw-solo">${card("模擬分 K 即時串流", "每個 tick 推進 5 秒", `<div class="lw-legend"></div>`)}</div>`);
      const lg = ctx.$(".lw-legend");
      const chart = mk(ctx, ctx.$(".lw-fill"), {
        timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 8, barSpacing: 9 },
        localization: { priceFormatter: (p) => p.toFixed(1), timeFormatter: (t) => { const [y, m, d] = ymd(t); return `${m}/${d} ${hhmm(t)}`; } },
      });
      const { gauss, rnd } = rng(911);
      const T0 = Date.UTC(2024, 9, 7, 9, 0) / 1000;
      // Build `count` bars ending right before `endTime`, walking backwards from `endPrice`.
      function history(count, endTime, endPrice) {
        const out = [];
        let p = endPrice;
        for (let i = 1; i <= count; i++) {
          const close = p, open = close / (1 + gauss() * 0.0016);
          const high = Math.max(open, close) * (1 + Math.abs(gauss()) * 0.0008), low = Math.min(open, close) * (1 - Math.abs(gauss()) * 0.0008);
          out.unshift({ time: endTime - i * 60, open, high, low, close, vol: 40 + rnd() * 160 });
          p = open;
        }
        return out;
      }
      let bars = history(400, T0 + 400 * 60, 22350);
      let price = bars[bars.length - 1].close, simT = bars[bars.length - 1].time + 55, loaded = 0, ticks = 0;
      const vol = chart.addSeries(L.HistogramSeries, { priceScaleId: "vol", priceFormat: { type: "volume" }, priceLineVisible: false, lastValueVisible: false });

          tick: (t, type) => { const [y, m, d] = ymd(t); return type === 0 ? `民國 ${y - 1911} 年` : type === 1 ? `${m} 月` : `${d} 日`; } },
        "月日星期": { time: (t) => { const [y, m, d] = ymd(t); return `${m} 月 ${d} 日（週${week[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}）`; },
          tick: (t, type) => { const [y, m, d] = ymd(t); return type === 0 ? `${y}` : type === 1 ? `${m}月` : `${m}/${d}`; } },
      };
      ctx.group(["價格", "對數", "百分比", "基準 100"], mode, (i) => { mode = i; applyMode(); });
      ctx.select("日期", Object.keys(FMT), "西元", (v) => chart.applyOptions({ localization: { timeFormatter: FMT[v].time }, timeScale: { tickMarkFormatter: FMT[v].tick } }));
      ctx.toggle("金融類用左軸", false, (v) => {
        left = v;
        SECT[2].series.applyOptions({ priceScaleId: v ? "left" : "right" });
        chart.applyOptions({ leftPriceScale: { visible: v } });
        applyMode();
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "series.setData(data) + timeScale().fitContent()",
    desc: "逐級把 K 棒數從 1 千加到 200 萬，量測 setData() 載入到第一個畫面畫完的時間；資料在準備階段先產生，不計入耗時。雖然只繪製可見範圍，setData 的資料轉換與 fitContent 後的第一次繪製仍會隨總量線性變慢，圖面左上角會拆開顯示兩段耗時。",
    hint: "按「開始測試」；切換 K 線／折線後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="lw-stress panel"><div class="lw-fill"></div><div class="lw-note"></div></div>`);
      const note = ctx.$(".lw-note");
      const chart = mk(ctx, ctx.$(".lw-fill"), {
        timeScale: { timeVisible: true, rightOffset: 2 },
        localization: { priceFormatter: (p) => p.toFixed(0), timeFormatter: (t) => { const [y, m, d] = ymd(t); return `${y}/${m}/${d} ${hhmm(t)}`; } },
      });
      let kind = 0, series = null;
      const T0 = Date.UTC(2020, 0, 1) / 1000;
      function make(n) {
        const { gauss } = rng(n % 2147483646 + 1);
        const out = new Array(n);
        let p = 10000;
        for (let i = 0; i < n; i++) {
          const o = p;
          p = Math.max(100, p * (1 + gauss() * 0.002));
          out[i] = kind === 0
            ? { time: T0 + i * 60, open: o, high: Math.max(o, p) * 1.0008, low: Math.min(o, p) * 0.9992, close: p }
            : { time: T0 + i * 60, value: p };
        }
        return out;
      }
      function add() {
        if (series) chart.removeSeries(series);
        series = kind === 0
          ? chart.addSeries(L.CandlestickSeries, { ...CANDLE, priceLineVisible: false })
          : chart.addSeries(L.LineSeries, { color: C[1], lineWidth: 1, priceLineVisible: false });
        series.setData(make(1000));
        chart.timeScale().fitContent();
        note.textContent = `${kind ? "折線" : "K 線"}・目前 1,000 根，按「開始測試」逐級加量`;
      }
      add();
      ctx.group(["K 線", "折線"], 0, (i) => { kind = i; add(); });
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "K 棒數", unit: "根",
        sizes: [1000, 10000, 50000, 100000, 250000, 500000, 1000000, 2000000],
        target: 1000, budget: 2000,
        prepare: (n) => make(n),
        async run(n, data) {
          const t0 = performance.now();
          series.setData(data);
          const t1 = performance.now();
          chart.timeScale().fitContent();
          await ctx.frame(1);
          const t2 = performance.now();
          note.innerHTML = `${fmt(n)} 根：setData <b>${Showcase.fmtMs(t1 - t0)}</b>，繪製 <b>${Showcase.fmtMs(t2 - t1)}</b>`;
        },
        note: "耗時包含 setData() 與 fitContent() 後的第一次繪製；圖面左上角拆開顯示 setData 與繪製各花多少時間。",
      });
    },
  },
  ],
});
</script>
</body>
