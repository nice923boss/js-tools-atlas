<style>
  :root { --gw: 268px; }
  /* Site palette applied through lil-gui's CSS variables (they are declared on every .lil-gui, folders included) */
  .lil-gui {
    --background-color: rgba(18, 20, 24, 0.9);
    --widget-color: #2a2e36;
    --hover-color: #353a44;
    --focus-color: #3d434f;
    --number-color: #f7df1e;
    --string-color: #7bd389;
    --title-background-color: #1d2027;
    --font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --font-size: 12px;
    --widget-height: 22px;
    --name-width: 42%;
  }
  .lil-controller.flash { animation: flash 1.1s ease-out; }
  @keyframes flash { from { background: rgba(247, 223, 30, 0.32); } to { background: transparent; } }

  /* stage area on the left, panel column on the right; panel drops to the bottom half on phones */
  .view { position: absolute; top: 0; left: 0; bottom: 0; right: calc(var(--gw) + 20px); overflow: hidden; }
  .view > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .gui-host { position: absolute; z-index: 20; top: 10px; right: 10px; bottom: 10px; width: var(--gw); display: flex; flex-direction: column; pointer-events: none; }
  .gui-host > .lil-gui.lil-root { pointer-events: auto; width: 100%; max-height: 100%; border-radius: 10px; overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35); backdrop-filter: blur(8px); }
  .gui-host > .lil-gui.lil-root > .lil-title { font-weight: 700; color: var(--c1); }
  @media (max-width: 560px) {
    .view { right: 0; bottom: 50%; }
    .gui-host { top: auto; left: 10px; width: auto; height: calc(50% - 16px); }
  }

  .lbl { position: absolute; left: 10px; top: 10px; z-index: 5; max-width: calc(100% - 20px); padding: 4px 9px; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--line); font: 500 11.5px/1.45 var(--mono); color: var(--fg); pointer-events: none; }
  .lbl b { color: var(--c1); font-weight: 600; }
  pre.json { position: absolute; left: 10px; top: 46px; z-index: 5; margin: 0; max-width: min(300px, calc(100% - 20px)); max-height: calc(100% - 100px); overflow: hidden;
    padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font: 11px/1.45 var(--mono); color: var(--fg); white-space: pre; }
  pre.json[hidden] { display: none; }

  /* 2. ticket card */
  .ticket-wrap { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; }
  .ticket { container-type: inline-size; position: relative; width: min(400px, 92%); aspect-ratio: 2 / 1; display: flex; overflow: hidden;
    border-radius: 16px; transition: transform 0.35s, border-radius 0.25s, box-shadow 0.35s;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 18px 60px -12px var(--glow, transparent); }
  .ticket .main { flex: 1; padding: 6cqw 6cqw 5cqw; display: flex; flex-direction: column; gap: 1.6cqw; min-width: 0; }
  .ticket.th-neon .main { background: radial-gradient(circle at 15% 15%, rgba(247, 37, 133, 0.38), transparent 55%), linear-gradient(135deg, #1b1035, #0b2633); color: #f2f2f2; }
  .ticket.th-sunset .main { background: linear-gradient(135deg, #ff8c42, #f72585 62%, #9d8cff); color: #fff; }
  .ticket.th-mono .main { background: #ecebe6; color: #14161b; }
  .ticket .kicker { font: 600 2.6cqw/1 var(--mono); letter-spacing: 0.12em; opacity: 0.75; }
  .ticket .title { font: 800 6.6cqw/1.12 var(--font); color: var(--accent); overflow-wrap: anywhere; }
  .ticket .meta { display: flex; gap: 3cqw; align-items: center; font: 600 3.2cqw/1 var(--font); }
  .ticket .meta .zone { padding: 0.8cqw 2cqw; border-radius: 99px; border: 1.5px solid var(--accent); color: var(--accent); }
  .ticket .dots { letter-spacing: 0.5cqw; color: var(--accent); }
  .ticket .price { margin-top: auto; font: 600 3.3cqw/1.2 var(--mono); }
  .ticket .stub { width: 30%; background: var(--paper); color: var(--ink); border-left: 2px dashed rgba(0, 0, 0, 0.35); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2.4cqw; position: relative; }
  .ticket .stub::before, .ticket .stub::after { content: ""; position: absolute; left: -3cqw; width: 6cqw; height: 6cqw; border-radius: 50%; background: var(--bg); }
  .ticket .stub::before { top: -3cqw; } .ticket .stub::after { bottom: -3cqw; }
  .ticket .qr { width: 15cqw; aspect-ratio: 1; display: grid; grid-template-columns: repeat(9, 1fr); }
  .ticket .qr i { background: currentColor; }
  .ticket .qr i.o { background: transparent; }
  .ticket .serial { font: 600 2.6cqw/1 var(--mono); }
  .ticket .vip { position: absolute; top: 4cqw; right: 33%; padding: 1cqw 2.4cqw; border-radius: 6px; background: var(--accent); color: #111; font: 800 2.8cqw/1 var(--font); transform: rotate(8deg); }
  .ticket .stamp { position: absolute; left: 34%; top: 38%; padding: 1.4cqw 3.4cqw; border: 3px solid #f72585; border-radius: 8px; color: #f72585;
    font: 900 6cqw/1 var(--font); transform: rotate(-14deg) scale(2.2); opacity: 0; pointer-events: none; }
  .ticket .stamp.on { animation: stamp 1.6s ease-out; }
  @keyframes stamp { 0% { opacity: 0; transform: rotate(-14deg) scale(2.2); } 18% { opacity: 0.95; transform: rotate(-14deg) scale(1); } 75% { opacity: 0.9; } 100% { opacity: 0; transform: rotate(-14deg) scale(1); } }

  /* 3. event log */
  .evlog { position: absolute; left: 10px; top: 10px; z-index: 5; margin: 0; padding: 7px 10px; list-style: none; width: min(360px, calc(100% - 20px));
    max-height: 46%; overflow: hidden; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font: 11px/1.6 var(--mono); color: var(--fg); }
  .evlog:empty { display: none; }
  .evlog li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .evlog li b { display: inline-block; min-width: 9.5em; font-weight: 600; }
  .evlog .k-change { color: var(--c2); } .evlog .k-finish { color: var(--c4); } .evlog .k-open { color: var(--c6); }
  .evlog li.new { animation: flash 0.9s ease-out; }

  /* 4. read-only monitors stay readable */
  .mon .lil-controller.lil-disabled { opacity: 0.85; }

  /* 6. theme editor */
  .theme-stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 18px; padding: 44px 14px 14px; }
  .sample-host { width: 250px; max-width: 100%; max-height: 100%; display: flex; flex-direction: column; flex: none; }
  .sample-host > .lil-gui.lil-root { width: 100%; max-height: 100%; overflow: hidden; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); transition: border-radius 0.2s; }
  pre.css-out { margin: 0; max-width: 340px; max-height: 100%; overflow: hidden; padding: 10px 12px; border-radius: 8px; background: var(--panel);
    border: 1px solid var(--line); font: 11px/1.5 var(--mono); color: var(--muted); white-space: pre; }
  pre.css-out em { font-style: normal; color: var(--c1); }
  @media (max-width: 900px) { pre.css-out { display: none; } }

  /* 7. stress */
  .stress-box { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; border-radius: 10px; overflow: hidden; background: rgba(255, 255, 255, 0.02); }
  .stress-box .cols { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 8px; }
  @media (max-width: 760px) { .stress-box { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 8px; } }
</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.21.0/dist/lil-gui.esm.min.js"
} }
</script>
<script type="module">
// lil-gui showcase: controller types, folders and events, listen(), save/load presets, theming, listen() stress ramp.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import GUI from "lil-gui";

const PALETTE = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const NF = new Intl.NumberFormat("zh-TW");

function make(tag, cls, html = "") {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  d.innerHTML = html;
  return d;
}

// Stage area + a lil-gui instance mounted into the scene (container option), destroyed on scene switch.
function layout(ctx, title) {
  const view = make("div", "view");
  const host = make("div", "gui-host");
  ctx.el.append(view, host);
  const gui = new GUI({ container: host, title });
  ctx.onCleanup(() => gui.destroy());
  return { view, gui };
}

// HiDPI 2D canvas filling the view.
function canvas2d(ctx, view) {
  const c = document.createElement("canvas");
  view.prepend(c);
  const S = { c, g: c.getContext("2d"), w: 1, h: 1, onSize: null };
  const fit = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    S.w = Math.max(1, view.clientWidth);
    S.h = Math.max(1, view.clientHeight);
    c.width = Math.round(S.w * dpr);
    c.height = Math.round(S.h * dpr);
    S.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (S.onSize) S.onSize();
  };
  fit();
  ctx.onResize(fit);
  return S;
}

function flash(ctrl) {
  const d = ctrl.domElement;
  d.classList.remove("flash");
  void d.offsetWidth;
  d.classList.add("flash");
}

// Stops the scripted auto-demo as soon as the viewer touches a panel.
function userFlag(ctx, ...els) {
  const f = { on: false };
  for (const el of els) {
    ctx.on(el, "pointerdown", () => { f.on = true; });
    ctx.on(el, "keydown", () => { f.on = true; });
  }
  return f;
}

const hexToRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbToHex = (c) => "#" + c.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
const mixHex = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); return rgbToHex(x.map((v, i) => v + (y[i] - v) * t)); };

function starSprite() {
  const c = document.createElement("canvas");
  c.width = c.height = 64;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, "rgba(255,255,255,1)");
  grd.addColorStop(0.25, "rgba(255,255,255,.65)");
  grd.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = grd;
  g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}

// lil-gui stores controller values under their display names; this flattens gui.save() for display.
function flatSave(g) {
  const out = {};
  const walk = (o) => { Object.assign(out, o.controllers); Object.values(o.folders).forEach(walk); };
  walk(g.save());
  return out;
}

Showcase.run({ scenes: [
  {
    id: "galaxy", title: "星系產生器",
    api: "gui.add(obj, prop, min, max, step).onFinishChange(fn)・gui.addFolder(title)・gui.addColor()",
    desc: "六萬顆星點的螺旋星系。結構類滑桿放開才重算（onFinishChange），星點大小與轉速拖曳時即時套用（onChange）；預設樣式下拉選單一次改多個值後用 updateDisplay() 同步面板。",
    hint: "拖曳旋轉星系・調整右側面板・按「顯示 save()」看設定 JSON",
    mount(ctx) {
      const { view, gui } = layout(ctx, "星系參數");
      const canvas = document.createElement("canvas");
      view.append(canvas);
      const json = make("pre", "json");
      json.hidden = true;
      view.append(json);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
      camera.position.set(3.2, 3.4, 5.2);
      const orbit = new OrbitControls(camera, canvas);
      orbit.enableDamping = true;
      const sprite = starSprite();

      const params = {
        preset: "spiral", count: 60000, size: 0.05, radius: 5, branches: 4, spin: 1.2, randomness: 0.3, randomnessPower: 3,
        insideColor: "#ff8c42", outsideColor: "#4cc9f0", background: "#07080b", rotate: true, speed: 0.12,
        random() { randomize(); },
        showJson() { json.hidden = !json.hidden; renderJson(); },
        reset() { gui.reset(); },
      };
      const PRESETS = {
        spiral: { branches: 4, spin: 1.2, randomness: 0.3, randomnessPower: 3, insideColor: "#ff8c42", outsideColor: "#4cc9f0" },
        barred: { branches: 2, spin: 2.6, randomness: 0.22, randomnessPower: 2.4, insideColor: "#f7df1e", outsideColor: "#9d8cff" },
        wild: { branches: 9, spin: -3.2, randomness: 0.55, randomnessPower: 1.6, insideColor: "#f72585", outsideColor: "#7bd389" },
      };

      let points = null, dirty = true;
      const regen = () => { dirty = true; };
      function generate() {
        dirty = false;
        if (points) { points.geometry.dispose(); points.material.dispose(); scene.remove(points); }
        const { count, radius, branches, spin, randomness, randomnessPower } = params;
        const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
        const inside = new THREE.Color(params.insideColor), outside = new THREE.Color(params.outsideColor), c = new THREE.Color();
        const jitter = () => Math.pow(Math.random(), randomnessPower) * (Math.random() < 0.5 ? 1 : -1) * randomness;
        for (let i = 0; i < count; i++) {
          const r = Math.random() * radius;
          const angle = ((i % branches) / branches) * Math.PI * 2 + r * spin;
          pos[i * 3] = Math.cos(angle) * r + jitter() * r;
          pos[i * 3 + 1] = jitter() * r * 0.6;
          pos[i * 3 + 2] = Math.sin(angle) * r + jitter() * r;
          c.copy(inside).lerp(outside, r / radius);
          col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
        geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
        const mat = new THREE.PointsMaterial({ size: params.size, sizeAttenuation: true, vertexColors: true, map: sprite,
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
        const rot = points ? points.rotation.y : 0;
        points = new THREE.Points(geo, mat);
        points.rotation.y = rot;
        scene.add(points);
      }

      const presetCtrl = gui.add(params, "preset", { "螺旋星系": "spiral", "棒旋星系": "barred", "狂野星雲": "wild" }).name("預設樣式")
        .onChange((k) => { Object.assign(params, PRESETS[k]); gui.controllersRecursive().forEach((c) => c.updateDisplay()); regen(); });
      const shape = gui.addFolder("結構");
      shape.add(params, "count", 1000, 200000, 1000).name("星點數量").onFinishChange(regen);
      shape.add(params, "radius", 1, 10, 0.1).name("半徑").onFinishChange(regen);
      shape.add(params, "branches", 2, 12, 1).name("旋臂數").onFinishChange(regen);
      shape.add(params, "spin", -5, 5, 0.01).name("扭轉").onFinishChange(regen);
      shape.add(params, "randomness", 0, 1, 0.01).name("離散").onFinishChange(regen);
      shape.add(params, "randomnessPower", 1, 8, 0.1).name("集中度").onFinishChange(regen);
      shape.add(params, "size", 0.005, 0.1, 0.001).name("星點大小").onChange((v) => { if (points) points.material.size = v; });
      const look = gui.addFolder("色彩");
      look.addColor(params, "insideColor").name("核心色").onChange(regen);
      look.addColor(params, "outsideColor").name("外圍色").onChange(regen);
      look.addColor(params, "background").name("背景").onChange((v) => scene.background.set(v));
      const anim = gui.addFolder("動畫");
      anim.add(params, "rotate").name("自動旋轉");
      anim.add(params, "speed", -1, 1, 0.01).name("轉速");
      if (ctx.el.clientWidth < 560) { look.close(); anim.close(); }
      gui.add(params, "random").name("隨機生成");
      gui.add(params, "showJson").name("顯示 save()");
      gui.add(params, "reset").name("重設 reset()");

      function renderJson() {
        if (!json.hidden) json.textContent = "gui.save() =\n" + JSON.stringify(flatSave(gui), null, 1);
      }
      gui.onFinishChange(renderJson);

      function randomize() {
        const rnd = (a, b) => a + Math.random() * (b - a);
        const hex = () => "#" + new THREE.Color().setHSL(Math.random(), 0.85, 0.6).getHexString();
        Object.assign(params, {
          branches: Math.round(rnd(2, 9)), spin: +rnd(-4, 4).toFixed(2), randomness: +rnd(0.1, 0.6).toFixed(2),
          randomnessPower: +rnd(1.4, 4).toFixed(1), insideColor: hex(), outsideColor: hex(),
        });
        gui.controllersRecursive().forEach((c) => c.updateDisplay());
        regen();
        renderJson();
      }

      scene.background = new THREE.Color(params.background);
      const fit = () => {
        const w = Math.max(1, view.clientWidth), h = Math.max(1, view.clientHeight);
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.position.setLength(w < h ? 10.5 : 6.8);
        camera.updateProjectionMatrix();
      };
      fit();
      ctx.onResize(fit);
      ctx.onCleanup(() => {
        orbit.dispose();
        if (points) { points.geometry.dispose(); points.material.dispose(); }
        sprite.dispose();
        renderer.dispose();
        renderer.forceContextLoss();
      });

      // Until the viewer touches the panel, cycle the presets so the panel visibly drives the scene.
      const user = userFlag(ctx, gui.domElement);
      const ORDER = ["barred", "wild", "spiral"];
      let k = 0;
      ctx.interval(() => { if (user.on) return; presetCtrl.setValue(ORDER[k++ % 3]); flash(presetCtrl); renderJson(); }, 3800);
      ctx.raf((t, dt) => {
        if (dirty) generate();
        if (params.rotate && points) points.rotation.y += (dt / 1000) * params.speed;
        orbit.update();
        renderer.render(scene, camera);
      });
    },
  },
  {
    id: "types", title: "控制項型別",
    api: "gui.add(obj, prop) 依值的型別自動產生控制項・gui.addColor(obj, prop, rgbScale)・controller.disable()",
    desc: "同一個 add() 依屬性型別長出不同控制項：字串變文字框、沒給範圍的數字變數字欄、給了範圍變滑桿、陣列或物件變下拉選單、布林變勾選、函式變按鈕；顏色支援 #hex、數值、{r,g,b} 與陣列四種格式。",
    hint: "改右側任一欄位，票券即時更新・按「列印」蓋章並遞增序號",
    mount(ctx) {
      const { view, gui } = layout(ctx, "活動票券");
      gui.domElement.style.setProperty("--name-width", "46%");
      view.innerHTML = `<div class="ticket-wrap"><div class="ticket"><div class="main"><div class="kicker">JS TOOLS ATLAS LIVE</div>
        <div class="title"></div><div class="meta"><span class="zone"></span><span class="dots"></span></div><div class="price"></div></div>
        <div class="stub"><div class="qr"></div><div class="serial"></div></div><div class="vip">VIP</div><div class="stamp">已列印</div></div></div>`;
      const $ = (s) => view.querySelector(s);
      const ticket = $(".ticket");
      let serialNo = 123;
      const p = {
        title: "JS 工具地圖之夜", price: 1200, seats: 2, radius: 16, tilt: -3, zone: "B 區", theme: "neon",
        accent: "#f7df1e", ink: 0x14161b, glow: { r: 0.3, g: 0.79, b: 0.94 }, paper: [250, 246, 236],
        vip: true, qr: true, serial: "No. 000123",
        print() {
          serialNo++;
          serialCtrl.setValue(`No. ${String(serialNo).padStart(6, "0")}`);
          const s = $(".stamp");
          s.classList.remove("on");
          void s.offsetWidth;
          s.classList.add("on");
        },
      };
      const C = {
        title: gui.add(p, "title").name("標題・文字"),
        price: gui.add(p, "price").step(50).name("票價・數字欄"),
        seats: gui.add(p, "seats", 1, 8, 1).name("張數・滑桿"),
        radius: gui.add(p, "radius", 0, 40, 1).name("圓角・滑桿"),
        tilt: gui.add(p, "tilt", -12, 12, 0.5).name("傾斜・滑桿"),
        zone: gui.add(p, "zone", ["A 區", "B 區", "C 區", "搖滾區"]).name("區域・陣列選單"),
        theme: gui.add(p, "theme", { "霓虹": "neon", "日落": "sunset", "極簡": "mono" }).name("主題・物件選單"),
        accent: gui.addColor(p, "accent").name("強調・#hex"),
        ink: gui.addColor(p, "ink").name("墨色・數值"),
        glow: gui.addColor(p, "glow").name("光暈・{r,g,b}"),

      params.onFinishChange(renderJson);
      setBadge();
      renderJson();

      const d = { ...p };
      const user = userFlag(ctx, gui.domElement);
      const NAMES = Object.keys(BUILTIN);
      let k = 0;
      ctx.interval(() => {
        if (user.on) return;
        k = (k + 1) % NAMES.length;
        presetCtrl.setValue(NAMES[k]);
        flash(presetCtrl);
      }, 2600);
      ctx.raf((t, dtMs) => {
        const s = t / 1000, g = S.g, e = 1 - Math.exp(-dtMs / 160);
        for (const key of ["petals", "inner", "layers", "twist", "wobble", "width", "spin"]) d[key] += (p[key] - d[key]) * e;
        const A = hexToRgb(p.colorA), B = hexToRgb(p.colorB);
        d.ca = d.ca ? d.ca.map((v, i) => v + (A[i] - v) * e) : A;
        d.cb = d.cb ? d.cb.map((v, i) => v + (B[i] - v) * e) : B;
        g.fillStyle = "#07080b";
        g.fillRect(0, 0, S.w, S.h);
        // Keep the figure clear of the JSON panel (about 170px wide) when it is shown.
        const side = state.json ? Math.min(180, S.w * 0.4) : 0;
        const cx = side + (S.w - side) / 2, cy = S.h / 2 + 8, R = Math.min(S.w - side, S.h - 40) * 0.44;
        const layers = Math.max(1, Math.round(d.layers)), petals = Math.round(d.petals);
        g.lineWidth = d.width;
        g.lineJoin = "round";
        for (let L = 0; L < layers; L++) {
          const f = layers > 1 ? L / (layers - 1) : 0;
          const col = `rgb(${d.ca.map((v, i) => Math.round(v + (d.cb[i] - v) * f)).join(",")})`;
          g.strokeStyle = col;
          g.shadowColor = col;
          g.shadowBlur = p.glow ? 12 : 0;
          const r0 = R * (1 - f * 0.78), rot = s * d.spin * (L % 2 ? -1 : 1) + L * d.twist * (Math.PI * 2 / petals);
          g.beginPath();
          for (let i = 0; i <= 360; i++) {
            const a = (i / 360) * Math.PI * 2;
            const r = r0 * (1 - d.inner + d.inner * Math.cos(petals * a)) * (1 + d.wobble * Math.sin(3 * a + s * 1.3 + L));
            const x = cx + Math.cos(a + rot) * r, y = cy + Math.sin(a + rot) * r;
            if (i) g.lineTo(x, y); else g.moveTo(x, y);
          }
          g.closePath();
          g.stroke();
        }
        g.shadowBlur = 0;
      });
    },
  },
  {
    id: "theme", title: "主題自訂",
    api: ".lil-gui { --background-color; --widget-height; --name-width; ... }・new GUI({ container, title })・gui.title()",
    desc: "lil-gui 的外觀全靠 CSS 自訂屬性，換主題不用改 JavaScript。右側是第一個 GUI（主題編輯器），它即時改寫左邊第二個 GUI（預覽面板）的 CSS 變數，並用 title() 更新預覽面板標題。",
    hint: "換主題預設・調顏色與尺寸看預覽面板即時變化",
    mount(ctx) {
      const { view, gui } = layout(ctx, "主題編輯器");
      view.innerHTML = `<div class="lbl">右側 GUI 即時改寫左側 GUI 的 CSS 變數</div>
        <div class="theme-stage"><div class="sample-host"></div><pre class="css-out"></pre></div><style></style>`;
      const styleEl = view.querySelector("style"), cssOut = view.querySelector(".css-out");
      const sample = new GUI({ container: view.querySelector(".sample-host"), title: "預覽面板" });
      ctx.onCleanup(() => sample.destroy());
      const demo = { "速度": 0.62, "名稱": "lil-gui", "啟用": true, "模式": "柔和", "顏色": "#9d8cff", "數量": 42, "執行"() {} };
      sample.add(demo, "速度", 0, 1);
      sample.add(demo, "名稱");
      sample.add(demo, "啟用");
      sample.add(demo, "模式", ["柔和", "銳利", "霓虹"]);
      sample.addColor(demo, "顏色");
      const sub = sample.addFolder("子資料夾");
      sub.add(demo, "數量", 0, 100, 1);
      sub.add(demo, "執行").name("執行按鈕");

      const THEMES = {
        "lil 原廠": { bg: "#1f1f1f", text: "#ebebeb", title: "#111111", widget: "#424242", number: "#2cc9ff", string: "#a2db3c", fontSize: 11, widgetH: 20, spacing: 4, nameW: 45, radius: 2 },
        "站內深色": { bg: "#121418", text: "#ebebeb", title: "#1d2027", widget: "#2a2e36", number: "#f7df1e", string: "#7bd389", fontSize: 12, widgetH: 22, spacing: 4, nameW: 42, radius: 3 },
        "亮色": { bg: "#f4f4f0", text: "#22252b", title: "#e2e2dc", widget: "#d6d6cf", number: "#c2185b", string: "#2e7d32", fontSize: 12, widgetH: 24, spacing: 5, nameW: 42, radius: 6 },
        "終端機": { bg: "#04140a", text: "#7bd389", title: "#0a2614", widget: "#0f3019", number: "#c6ff6e", string: "#7bd389", fontSize: 12, widgetH: 20, spacing: 3, nameW: 46, radius: 0 },
        "霓虹": { bg: "#1a0b2e", text: "#f8e9ff", title: "#f72585", widget: "#3a1866", number: "#4cc9f0", string: "#f7df1e", fontSize: 13, widgetH: 28, spacing: 6, nameW: 40, radius: 10 },
      };
      const th = { preset: "霓虹", ...THEMES["霓虹"] };
      const presetCtrl = gui.add(th, "preset", Object.keys(THEMES)).name("主題預設")
        // gui.onChange runs before this controller's onChange, so apply() again once the preset values are in place.
        .onChange((name) => { Object.assign(th, THEMES[name]); gui.controllersRecursive().forEach((c) => c.updateDisplay()); apply(); });
      const colors = gui.addFolder("顏色");
      colors.addColor(th, "bg").name("背景");
      colors.addColor(th, "text").name("文字");
      colors.addColor(th, "title").name("標題列");
      colors.addColor(th, "widget").name("控制項底");
      colors.addColor(th, "number").name("數字");
      colors.addColor(th, "string").name("字串");
      const sizes = gui.addFolder("尺寸");
      sizes.add(th, "fontSize", 9, 16, 1).name("字級 px");
      sizes.add(th, "widgetH", 16, 34, 1).name("控制項高");
      sizes.add(th, "spacing", 1, 10, 1).name("間距");
      sizes.add(th, "nameW", 25, 65, 1).name("名稱寬 %");
      sizes.add(th, "radius", 0, 14, 1).name("圓角");
      if (ctx.el.clientWidth < 560) colors.close();

      const apply = () => {
        const vars = [
          ["--background-color", th.bg], ["--text-color", th.text], ["--title-background-color", th.title], ["--title-text-color", th.text],
          ["--widget-color", th.widget], ["--hover-color", mixHex(th.widget, th.text, 0.12)], ["--focus-color", mixHex(th.widget, th.text, 0.22)],
          ["--number-color", th.number], ["--string-color", th.string], ["--font-size", `${th.fontSize}px`], ["--input-font-size", `${th.fontSize}px`],
          ["--widget-height", `${th.widgetH}px`], ["--spacing", `${th.spacing}px`], ["--padding", `${th.spacing}px`],
          ["--name-width", `${th.nameW}%`], ["--widget-border-radius", `${th.radius}px`],
        ];
        const body = vars.map(([k, v]) => `  ${k}: ${v};`).join("\n");
        styleEl.textContent = `.sample-host .lil-gui {\n${body}\n}\n.sample-host > .lil-gui { border-radius: ${th.radius * 1.4}px; }`;
        cssOut.innerHTML = `<em>.lil-gui</em> {\n${vars.slice(0, 11).map(([k, v]) => `  ${k}: ${v};`).join("\n")}\n  ...\n}`;
        sample.title(`預覽面板・${th.preset}`);
      };
      gui.onChange(apply);
      apply();

      const user = userFlag(ctx, gui.domElement);
      const NAMES = Object.keys(THEMES);
      let k = NAMES.indexOf(th.preset);
      ctx.interval(() => {
        if (user.on) return;
        k = (k + 1) % NAMES.length;
        presetCtrl.setValue(NAMES[k]);
        flash(presetCtrl);
      }, 2400);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "controller.listen()：每個控制項一個 requestAnimationFrame 迴圈",
    desc: "一次建立 N 個滑桿並全部 listen()，綁定的數值每幀都在變，逐級加量直到掉到 30 FPS 以下；可關掉 listen 再測，比較「數值在變但面板不更新」的成本差距。",
    hint: "按「自動加壓」開始；關掉 listen() 再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="stress-box"><div class="cols"></div></div>`);
      const cols = ctx.$(".cols");
      let guis = [], ctrls = [], vals = [], buildMs = 0, listening = true;
      const build = (n) => {
        guis.forEach((g) => g.destroy());
        guis = []; ctrls = [];
        const t0 = performance.now();
        vals = Array.from({ length: n }, () => ({ v: 0 }));
        for (let i = 0; i < n; i++) {
          if (i % 25 === 0) guis.push(new GUI({ container: cols, title: `第 ${guis.length + 1} 組`, width: 200 }));
          const c = guis[guis.length - 1].add(vals[i], "v", -1, 1, 0.01).name(`#${i + 1}`);
          if (listening) c.listen();
          ctrls.push(c);
        }
        buildMs = performance.now() - t0;
      };
      ctx.onCleanup(() => guis.forEach((g) => g.destroy()));
      ctx.toggle("listen()", true, (v) => { listening = v; ctrls.forEach((c) => c.listen(v)); });
      ctx.controls.classList.add("bottom");
      ctx.raf((t) => {
        const s = t * 0.004;
        for (let i = 0; i < vals.length; i++) vals[i].v = Math.round(Math.sin(s + i * 0.37) * 100) / 100;
      });
      ctx.ramp({
        label: "同時 listen 的控制項", unit: "個", steps: [25, 50, 100, 200, 400, 800, 1600, 3200],
        minFps: 30,
        apply(n) { build(n); },
        metrics: () => ({
          "GUI 面板": guis.length,
          "DOM 節點": NF.format(cols.getElementsByTagName("*").length),
          "建立耗時": `${buildMs.toFixed(0)} ms`,
        }),
        note: "listen() 會替每個控制項各開一個 requestAnimationFrame 迴圈，每幀呼叫 save() 比對數值，有變才 updateDisplay() 改寫滑桿與數字欄；數值每幀都在變，成本隨控制項數線性成長。關掉 listen() 時數值照樣更新，只是面板不重畫。",
      });
    },
  },
] });
</script>
