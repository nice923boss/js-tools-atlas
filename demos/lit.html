<!doctype html>
<html lang="zh-Hant">
<head>

<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["智慧家庭面板","樣式封裝","repeat 與 key","非同步指令","生命週期","ReactiveController","slot 與事件","極限測試"],"note":"Lit 3 官方單檔版 lit-all，免建置直接用 ESM 載入"}</script>
<style>
  .lt-pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px; min-height: 0; }
  .lt-pad > * { min-width: 0; min-height: 0; }
  .lt-chip { display: inline-block; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.07); color: var(--muted); font: 500 11px/1.5 var(--font); white-space: nowrap; }
  .lt-chip code { font-family: var(--mono); color: var(--accent); }
  .lt-box { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; }
  .lt-box h3 { margin: 0; font: 600 12.5px/1.4 var(--font); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .lt-box h3 code { font: 500 11px var(--mono); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lt-log { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 0; list-style: none; font: 11.5px/1.65 var(--mono); color: #b9b7ae; }
  .lt-log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lt-log li i { font-style: normal; color: #6b6a63; margin-right: 6px; }
  .lt-log li b { font-weight: 600; }
  .lt-log li.sep { color: #6b6a63; border-top: 1px dashed rgba(255,255,255,.1); margin-top: 3px; }

  /* 1. smart home */
  .lt-home { grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.2fr); grid-template-rows: minmax(0, 1.15fr) minmax(0, 1fr); }
  .lt-home power-meter { grid-column: span 2; }
  .lt-home .lt-inspect { grid-column: span 2; background: #0b0d10; }
  .lt-inspect pre { margin: 0; font: 11.5px/1.6 var(--mono); color: #8d8a80; white-space: pre-wrap; overflow: hidden; }
  .lt-inspect .tg { color: var(--c3); } .lt-inspect .at { color: var(--c2); } .lt-inspect .va { color: var(--c4); } .lt-inspect .sr { color: var(--c6); }
  .lt-inspect .flash { background: rgba(247,223,30,.28); border-radius: 3px; }
  @media (max-width: 640px) {
    .lt-home { overflow-y: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: 186px; }
    .lt-home power-meter, .lt-home .lt-inspect { grid-column: 1 / -1; }
    .lt-home .lt-inspect { min-height: 170px; }
  }

  /* 2. encapsulation */
  .lt-enc { grid-template-columns: repeat(3, minmax(0, 1fr)); align-content: center; }
  .lt-col { display: flex; flex-direction: column; gap: 8px; }
  .lt-col > .lt-chip { align-self: flex-start; }
  .lt-col p.lt-why { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .lt-enc .lt-theme-a { --lt-accent: #4cc9f0; --lt-radius: 4px; }
  .lt-enc .lt-theme-b { --lt-accent: #f72585; --lt-radius: 20px; }
  .lt-enc .lt-theme-b::part(cta) { color: #fff; letter-spacing: 2px; }
  .lt-enc .lt-theme-b::part(card) { box-shadow: 0 0 0 2px #f72585 inset; }
  /* light-DOM copy has to be styled from the page */
  .lt-light .cc { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); font-family: var(--font); }
  .lt-light .tag { align-self: flex-start; padding: 1px 8px; border-radius: 999px; background: rgba(247,223,30,.14); color: var(--accent); font-size: 11px; }
  .lt-light h3 { margin: 0; font: 700 15px/1.3 var(--font); color: var(--fg); }
  .lt-light p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .lt-light .row { display: flex; justify-content: space-between; align-items: center; }
  .lt-light .price { font: 700 14px var(--mono); }
  .lt-light button { border: 0; cursor: pointer; padding: 5px 14px; border-radius: 8px; background: #f7df1e; color: #1a1a14; font: 700 12px var(--font); }
  @media (max-width: 640px) { .lt-enc { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; } .lt-enc > .lt-col { flex: none; } .lt-col p.lt-why { display: none; } }

  /* 3 / 5 / 7: two panes */
  .lt-two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .lt-two.wide-r { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); }
  @media (max-width: 560px) {
    .lt-two.stack, .lt-two.wide-r { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
  }
  .lt-stage-host { display: grid; place-items: center; padding: 12px; }

  /* 6. controllers */
  .lt-ctrl { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.2fr); grid-template-rows: auto minmax(0, 1fr); }
  .lt-ctrl .lt-stat { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px; color: var(--muted); }
  .lt-ctrl .lt-stat b { font: 700 15px var(--mono); color: var(--accent); }
  @media (max-width: 640px) { .lt-ctrl { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr); } .lt-ctrl lt-pointer-pad { grid-column: 1 / -1; } }

  /* 8. stress */
  .lt-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; overflow: hidden; border-radius: 10px; background: #0b0d10; border: 1px solid var(--line); }
  @media (max-width: 760px) { .lt-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 8px; } }
</style>
</head>
<body>
<script>window.litDisableBundleWarning = true; // the all-in-one bundle otherwise prints a console hint</script>
<script src="_shared/showcase.js"></script>
<script type="module">
// Lit showcase: eight scenes from the original smart-home panel to a component-count stress ramp.
import { LitElement, html, svg, css, nothing, repeat, classMap, styleMap, until, cache, ref, live, guard }
  from "https://cdn.jsdelivr.net/gh/lit/dist@3.3.3/all/lit-all.min.js";

const define = (name, cls) => { if (!customElements.get(name)) customElements.define(name, cls); };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Small log list helper: newest line at the bottom, capped.
function logger(list, max = 60) {
  const t0 = performance.now();
  return (text, color, cls = "") => {
    const li = document.createElement("li");
    if (cls) li.className = cls;
    li.innerHTML = cls === "sep" ? esc(text) : `<i>${(performance.now() - t0).toFixed(0).padStart(5, " ")}</i><b style="color:${color || "var(--fg)"}">${esc(text)}</b>`;
    list.append(li);
    while (list.children.length > max) list.firstChild.remove();
    list.scrollTop = list.scrollHeight;
  };
}

const base = css`
  :host { display: block; font-family: var(--font); color: var(--fg); }
  .card { position: relative; box-sizing: border-box; height: 100%; padding: 12px 14px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .title { margin: 0; font: 600 14px/1.3 var(--font); color: var(--fg); position: relative; }
  button { font: 700 12px var(--font); cursor: pointer; border: 0; }
  code { font-family: var(--mono); }
`;

// ---------- 1. smart home (ported from the original page) ----------
class LampCard extends LitElement {
  static properties = { name: {}, icon: {}, hue: { type: Number, reflect: true }, brightness: { type: Number, reflect: true }, on: { type: Boolean, reflect: true } };
  static styles = [base, css`
    .card { --b: calc(var(--br) / 100); }
    .glow { position: absolute; left: -30%; right: -30%; top: -50%; height: 150%; pointer-events: none; transition: opacity .3s;
      background: radial-gradient(circle at 50% 42%, hsl(var(--h) 95% 60% / calc(var(--b) * .5)), transparent 58%); }
    :host(:not([on])) .glow { opacity: 0; }
    .bulb { position: relative; width: 44px; height: 44px; margin: 2px auto 0; border-radius: 50%; transition: all .3s; flex: none;
      background: radial-gradient(circle at 40% 35%, #fff, hsl(var(--h) 95% 62%) 70%);
      box-shadow: 0 0 calc(var(--b) * 46px) hsl(var(--h) 95% 60%); opacity: calc(.35 + var(--b) * .65); }
    :host(:not([on])) .bulb { background: #2a2d33; box-shadow: inset 0 -6px 12px rgba(0,0,0,.4); opacity: 1; }
    .row { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .toggle { padding: 4px 12px; border-radius: 999px; background: hsl(var(--h) 90% 62%); color: #111; }
    :host(:not([on])) .toggle { background: #33363d; color: var(--muted); }
    input { position: relative; width: 100%; margin: 0; accent-color: hsl(var(--h) 90% 62%); }
    .hues { position: relative; display: flex; gap: 6px; justify-content: center; }
    .hues button { width: 15px; height: 15px; padding: 0; border-radius: 50%; background: hsl(var(--hh) 90% 62%); }
    .hues button.sel { box-shadow: 0 0 0 2px var(--bg-2), 0 0 0 4px hsl(var(--hh) 90% 62%); }
  `];
  constructor() { super(); this.name = "燈"; this.icon = "💡"; this.hue = 40; this.brightness = 70; this.on = false; }
  updated(changed) {
    if (changed.has("on") || changed.has("brightness")) this.dispatchEvent(new CustomEvent("lamp-change", { bubbles: true, composed: true }));
  }
  render() {
    return html`<div class="card" style="--h:${this.hue};--br:${this.brightness}">
      <div class="glow"></div><div class="bulb"></div>
      <h3 class="title">${this.icon} ${this.name}</h3>
      <div class="row"><span>${this.on ? `亮度 ${this.brightness}%` : "已關閉"}</span>
        <button class="toggle" @click=${() => { this.on = !this.on; }}>${this.on ? "開" : "關"}</button></div>
      <input type="range" min="5" max="100" .value=${String(this.brightness)} @input=${(e) => { this.brightness = +e.target.value; this.on = true; }}>
      <div class="hues">${[38, 0, 120, 190, 280].map((h) => html`<button class=${h === this.hue ? "sel" : ""} style="--hh:${h}" title="色相 ${h}" @click=${() => { this.hue = h; }}></button>`)}</div>
    </div>`;
  }
}
define("lamp-card", LampCard);

const polar = (cx, cy, r, deg) => [cx + r * Math.cos((deg - 90) * Math.PI / 180), cy + r * Math.sin((deg - 90) * Math.PI / 180)];
const arc = (cx, cy, r, a0, a1) => { const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1); return `M${x0} ${y0} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };

class ThermoDial extends LitElement {
  static properties = { value: { type: Number, reflect: true } };
  static styles = [base, css`
    svg { flex: 1; min-height: 0; width: 100%; }
    .ctl { display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 12px; color: var(--muted); }
    .ctl button { width: 28px; height: 28px; border-radius: 50%; background: #2a2d33; color: var(--fg); font-size: 16px; }
  `];
  constructor() { super(); this.value = 24; }
  render() {
    const t = (this.value - 16) / 14, hue = 200 - t * 185;
    const mode = this.value <= 21 ? "❄️ 冷氣" : this.value >= 27 ? "🔥 暖氣" : "🍃 舒適";
    return html`<div class="card"><h3 class="title">🌡️ 空調溫度</h3>
      <svg viewBox="0 0 160 130">
        <path d=${arc(80, 74, 56, -135, 135)} fill="none" stroke="#2a2d33" stroke-width="12" stroke-linecap="round"/>
        <path d=${arc(80, 74, 56, -135, -135 + 270 * Math.max(0.01, t))} fill="none" stroke="hsl(${hue} 90% 58%)" stroke-width="12" stroke-linecap="round"/>
        ${svg`<text x="80" y="82" text-anchor="middle" fill="currentColor" font-size="30" font-weight="700" font-family="Consolas, monospace">${this.value}°</text>`}
        <text x="80" y="102" text-anchor="middle" fill="#9b998f" font-size="11">${mode}</text>
      </svg>
      <div class="ctl"><button @click=${() => { this.value = clamp(this.value - 1, 16, 30); }}>−</button><span>16° ~ 30°</span><button @click=${() => { this.value = clamp(this.value + 1, 16, 30); }}>+</button></div>
    </div>`;
  }
}
define("thermo-dial", ThermoDial);

class PowerMeter extends LitElement {
  static properties = { watts: { type: Number }, max: { type: Number }, lamps: { type: Number } };
  static styles = [base, css`
    .big { font: 700 28px/1 var(--mono); color: var(--c1); }
    .big small { font-size: 13px; color: var(--muted); margin-left: 4px; }
    .segs { display: grid; grid-template-columns: repeat(18, 1fr); gap: 3px; height: 22px; margin-top: auto; }
    .segs i { border-radius: 3px; background: #2a2d33; transition: background .3s; }
    .segs i.on { background: hsl(calc(120 - var(--k) * 120) 85% 55%); }
    p { margin: 0; font-size: 12px; color: var(--muted); }
  `];
  constructor() { super(); this.watts = 0; this.max = 36; this.lamps = 0; }
  render() {
    const n = Math.round((this.watts / this.max) * 18);
    return html`<div class="card"><h3 class="title">⚡ 即時耗電</h3>
      <div class="big">${this.watts.toFixed(1)}<small>W / ${this.max} W</small></div>
      <p>${this.lamps} 盞燈開啟中，父層把 .watts 屬性傳進來</p>
      <div class="segs">${Array.from({ length: 18 }, (_, i) => html`<i class=${i < n ? "on" : ""} style="--k:${i / 17}"></i>`)}</div>
    </div>`;
  }
}
define("power-meter", PowerMeter);

// ---------- 2. encapsulation ----------
const COURSE = { heading: "JavaScript 入門班", tag: "台北・週六班", desc: "從變數、函式到 DOM 操作，八週做出第一個網頁小工具。", price: 6800 };
class LtCourse extends LitElement {
  static properties = { heading: {}, tag: {}, desc: {}, price: { type: Number }, joined: { state: true } };
  static styles = [base, css`
    .cc { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: var(--lt-radius, 14px); background: var(--bg-2); border: 1px solid var(--line); }
    .tag { align-self: flex-start; padding: 1px 8px; border-radius: 999px; background: rgba(247,223,30,.14); color: var(--lt-accent, var(--accent)); font-size: 11px; }
    h3 { margin: 0; font: 700 15px/1.3 var(--font); }
    p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
    .row { display: flex; justify-content: space-between; align-items: center; }
    .price { font: 700 14px var(--mono); }
    button { padding: 5px 14px; border-radius: calc(var(--lt-radius, 14px) / 2); background: var(--lt-accent, #f7df1e); color: #1a1a14; }
  `];
  constructor() { super(); Object.assign(this, COURSE); this.joined = 0; }
  render() {
    return html`<div class="cc" part="card"><span class="tag">${this.tag}</span><h3>${this.heading}</h3><p>${this.desc}</p>
      <div class="row"><b class="price">NT$ ${this.price.toLocaleString("zh-TW")}</b><button part="cta" @click=${() => this.joined++}>${this.joined ? `已報名 ${this.joined}` : "報名"}</button></div></div>`;
  }
}
define("lt-course", LtCourse);
// Same template, but rendered into light DOM: static styles no longer apply and page CSS reaches in.
class LtCourseLight extends LtCourse { createRenderRoot() { return this; } }
define("lt-course-light", LtCourseLight);

// ---------- 3. repeat vs map ----------
class LtKeyed extends LitElement {
  static properties = { items: { attribute: false }, mode: {} };
  static styles = [base, css`
    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
    li { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid transparent; font-size: 13px; transition: background .4s; }
    li::before { content: "#" attr(data-node); font: 600 10.5px var(--mono); color: var(--muted); min-width: 24px; }
    li[data-fresh] { background: rgba(247,223,30,.25); }
    li:has(input:checked) { border-color: var(--c4); }
    li.hot .nm { color: var(--c5); }
    input { margin: 0; accent-color: var(--c4); }
    .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar { width: 46px; height: 6px; border-radius: 3px; background: #2a2d33; overflow: hidden; flex: none; }
    .bar i { display: block; height: 100%; background: var(--c2); }
    @media (max-width: 480px) { .bar { display: none; } li::before { min-width: 18px; } }
    @media (max-height: 460px) { ul { gap: 2px; } li { height: 22px; font-size: 12px; } }
  `];
  created = 0;
  #seen = new WeakSet();
  // Stable ref callback: Lit calls it only when a part receives a different element.
  #mark = (el) => {
    if (!el || this.#seen.has(el)) return;
    this.#seen.add(el);
    el.dataset.node = ++this.created;
    el.dataset.fresh = "";
    setTimeout(() => delete el.dataset.fresh, 600);
  };
  constructor() { super(); this.items = []; this.mode = "repeat"; }
  row(s) {
    return html`<li ${ref(this.#mark)} class=${classMap({ hot: s.hot })}><input type="checkbox" aria-label="勾選"><span class="nm">${s.name}</span>
      <span class="bar"><i style=${styleMap({ width: `${s.load}%`, background: s.hot ? "var(--c5)" : null })}></i></span></li>`;
  }
  render() {
    return html`<ul>${this.mode === "repeat" ? repeat(this.items, (s) => s.id, (s) => this.row(s)) : this.items.map((s) => this.row(s))}</ul>`;
  }
  // Simulate a user ticking boxes: this state lives only in the DOM, not in the data.
  tick(names) { this.renderRoot.querySelectorAll("li").forEach((li) => { li.querySelector("input").checked = names.includes(li.querySelector(".nm").textContent); }); }
}
define("lt-keyed", LtKeyed);

// ---------- 4. async and caching directives ----------
const sieve = (n) => { const a = new Uint8Array(n + 1); let c = 0; for (let i = 2; i <= n; i++) if (!a[i]) { c++; for (let j = i * i; j <= n; j += i) a[j] = 1; } return c; };
const STATIONS = ["台北車站", "西門", "市政府", "大安", "中山", "南港展覽館", "淡水", "動物園", "板橋", "頂溪"];
class LtDirectives extends LitElement {
  static properties = { tick: { state: true }, view: { state: true }, n: { state: true }, arrival: { state: true }, qtyA: { state: true }, qtyB: { state: true } };
  static styles = [base, css`
    :host { height: 100%; }
    .grid { height: 100%; display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
    .card { gap: 6px; padding: 10px 12px; }
    h3 { margin: 0; display: flex; justify-content: space-between; gap: 8px; font: 600 12.5px var(--font); color: var(--muted); }
    h3 code { color: var(--accent); font-size: 11px; white-space: nowrap; }
    .big { font: 700 22px/1.2 var(--mono); }
    .wait { color: var(--muted); font-size: 13px; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .35; } }
    .note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    .note b { font-family: var(--mono); color: var(--fg); }
    .views { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; min-height: 0; }
    .views > div { min-height: 0; overflow: hidden; border-radius: 8px; background: rgba(255,255,255,.03); padding: 6px; }
    .vlist { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); }
    .vgrid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
    .vgrid i { aspect-ratio: 1; border-radius: 3px; background: var(--c6); opacity: .7; }
    .cap { font: 600 11px var(--font); color: var(--fg); margin-bottom: 4px; }
    input { width: 64px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 600 14px var(--mono); }
    .pair { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
    .pair label { display: flex; gap: 6px; align-items: center; }
    @media (max-width: 640px) { .grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(4, 200px); } }
  `];
  created = { cache: 0, plain: 0 };
  runs = { guard: 0, plain: 0 };
  #seen = new WeakSet();
  #markCache = (el) => { if (el && !this.#seen.has(el)) { this.#seen.add(el); this.created.cache++; } };
  #markPlain = (el) => { if (el && !this.#seen.has(el)) { this.#seen.add(el); this.created.plain++; } };
  constructor() { super(); this.tick = 0; this.view = "list"; this.n = 20000; this.qtyA = 10; this.qtyB = 10; this.arrival = this.query(); }
  connectedCallback() {
    super.connectedCallback();
    this.timer = setInterval(() => {
      this.tick++;
      if (this.tick % 6 === 0) this.view = this.view === "list" ? "grid" : "list";

class ClockController {
  static active = 0;
  constructor(host, ms = 1000) { this.host = host; this.ms = ms; this.now = new Date(); host.addController(this); }
  hostConnected() { ClockController.active++; this.id = setInterval(() => { this.now = new Date(); this.host.requestUpdate(); }, this.ms); }
  hostDisconnected() { ClockController.active--; clearInterval(this.id); }
}
class PointerController {
  static active = 0;
  constructor(host) { this.host = host; this.pos = null; host.addController(this); }
  #move = (e) => { const r = this.host.getBoundingClientRect(); this.pos = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; this.host.requestUpdate(); };
  #leave = () => { this.pos = null; this.host.requestUpdate(); };
  hostConnected() { PointerController.active++; this.host.addEventListener("pointermove", this.#move); this.host.addEventListener("pointerleave", this.#leave); }
  hostDisconnected() { PointerController.active--; this.host.removeEventListener("pointermove", this.#move); this.host.removeEventListener("pointerleave", this.#leave); }
}

  },
  {
    id: "life", title: "生命週期",
    api: "willUpdate(changed) → render() → firstUpdated() → updated(changed)",
    desc: "右側即時記錄每個 lifecycle 回呼。連改三個屬性只觸發一次更新（微任務批次），changedProperties 帶著所有舊值；移除節點會呼叫 disconnectedCallback，加回時重新 connected 但不再 firstUpdated。",
    hint: "依序按按鈕，對照右側紀錄",
    mount(ctx) {
      ctx.html(`<div class="lt-pad lt-two wide-r"><div class="lt-stage-host"></div><div class="lt-box"><h3>lifecycle 紀錄<code>changedProperties</code></h3><ul class="lt-log"></ul></div></div>`);
      lifeSink = logger(ctx.$(".lt-log"));
      ctx.onCleanup(() => { lifeSink = null; });
      const host = ctx.$(".lt-stage-host");
      lifeSink("document.createElement('lt-life')", "", "sep");
      const el = document.createElement("lt-life");
      el.style.cssText = "width:min(260px,100%);height:min(220px,100%)";
      const CITIES = ["台北", "台中", "高雄", "花蓮", "台南", "新竹"];
      const actions = {
        inc: () => { lifeSink("el.count++", "", "sep"); el.count++; },
        batch: () => { lifeSink("連改三個屬性（同一個事件迴圈）", "", "sep"); el.count += 10; el.city = CITIES[(CITIES.indexOf(el.city) + 1) % CITIES.length]; el.hue = (el.hue + 70) % 360; },
        req: () => { lifeSink("el.requestUpdate()", "", "sep"); el.requestUpdate(); },
        toggle: () => { if (el.isConnected) { lifeSink("el.remove()", "", "sep"); el.remove(); } else { lifeSink("host.append(el)", "", "sep"); host.append(el); } },
      };
      ctx.timeout(() => { lifeSink("host.append(el)", "", "sep"); host.append(el); }, 300);
      const script = [actions.inc, actions.batch, actions.toggle, actions.toggle];
      let auto = true, k = 0;
      ctx.interval(() => { if (auto && k < script.length) script[k++](); }, 1500);
      const manual = (fn) => () => { auto = false; if (!el.isConnected && fn !== actions.toggle) return; fn(); };
      ctx.button("count++", manual(actions.inc), { primary: true });
      ctx.button("連改三個", manual(actions.batch));
      ctx.button("requestUpdate", manual(actions.req));
      ctx.button("移除／加回", manual(actions.toggle));
    },
  },
  {
    id: "controller", title: "ReactiveController",
    api: "class C { hostConnected() {} hostDisconnected() {} }; host.addController(this)",
    desc: "把計時器、滑鼠追蹤等可重用邏輯寫成 controller，任何元件 new 一個就能用，跟著宿主元件的連線狀態自動啟動與清理；同一個 ClockController 被三個元件以不同頻率共用。",
    hint: "滑鼠移到右邊格子・按「移除時鐘」看計數下降",
    mount(ctx) {
      ctx.html(`<div class="lt-pad lt-ctrl"><div class="lt-stat"><span>使用中 ClockController <b class="k1">0</b></span><span>PointerController <b class="k2">0</b></span><span class="lt-chip">hostDisconnected() 會清掉 setInterval</span></div>
        <lt-analog></lt-analog><lt-digital></lt-digital><lt-pointer-pad></lt-pointer-pad></div>`);
      const analog = ctx.$("lt-analog"), k1 = ctx.$(".k1"), k2 = ctx.$(".k2");
      const paint = () => { k1.textContent = ClockController.active; k2.textContent = PointerController.active; };
      ctx.interval(paint, 200);
      ctx.timeout(paint, 30);
      ctx.button("移除／加回時鐘", () => { if (analog.isConnected) analog.remove(); else ctx.$(".lt-stat").after(analog); paint(); }, { primary: true });
    },
  },
  {
    id: "slots", title: "slot 與事件",
    api: "<slot name=\"header\"> / @slotchange / new CustomEvent(type, { composed: true })",
    desc: "元件用具名 slot 接收外部節點，slotchange 自動更新計數；外部完全用原生 DOM（appendChild、setAttribute、addEventListener）操作它。composed 事件穿出 shadow root 後 target 會被重新指向宿主元件。",
    hint: "用左上按鈕以原生 DOM 增減項目，按元件裡的按鈕送事件",
    mount(ctx) {
      ctx.html(`<div class="lt-pad lt-two stack"><div class="lt-stage-host" style="padding:0">
        <lt-panel style="width:100%;height:100%"><h3 slot="header">本週課程</h3><ul><li>週一 Lit 入門</li><li>週三 Shadow DOM</li></ul></lt-panel></div>
        <div class="lt-box"><h3>原生 addEventListener 收到的事件<code>e.composedPath()</code></h3><ul class="lt-log"></ul></div></div>`);
      const panel = ctx.$("lt-panel"), log = logger(ctx.$(".lt-log"));
      const LESSONS = ["週五 ReactiveController", "週六 directives", "週日 SSR 概念", "週二 slot 實作", "週四 自訂事件"];
      let k = 0, auto = true;
      ctx.on(ctx.el, "lt-pick", (e) => log(`lt-pick：target=<${e.target.localName}> detail=${JSON.stringify(e.detail)} 路徑 ${e.composedPath().length} 層`, "#7bd389"));
      ctx.on(panel, "click", (e) => { if (e.target.localName === "li") log(`click 在 slot 內的 <li>：${e.target.textContent}`, "#4cc9f0"); });
      const add = () => { const li = document.createElement("li"); li.textContent = LESSONS[k++ % LESSONS.length]; panel.querySelector("ul").append(li); log("ul.appendChild(li) → slotchange", "#f7df1e"); };
      const del = () => { const li = panel.querySelector("ul li:last-child"); if (li) { li.remove(); log("li.remove() → slotchange", "#f7df1e"); } };
      const tones = ["info", "warn", "ok"];
      const tone = () => { const t = tones[(tones.indexOf(panel.getAttribute("tone")) + 1) % 3]; panel.setAttribute("tone", t); log(`setAttribute("tone", "${t}") → 屬性轉成 property`, "#ff8c42"); };
      const stop = (fn) => () => { auto = false; fn(); };
      ctx.button("appendChild", stop(add), { primary: true });
      ctx.button("remove", stop(del));
      ctx.button("setAttribute", stop(tone));
      const script = [add, tone, () => panel.renderRoot.querySelector(".pick").click(), add, del, tone];
      let s = 0;
      ctx.interval(() => { if (auto && panel.querySelectorAll("li").length < 7) script[s++ % script.length](); }, 1600);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × <lt-cell .v> 或 repeat(N 列) 每格更新",
    desc: "每一格把所有方塊的 reactive property 改掉，等 updateComplete 量一次更新耗時；逐級增加數量直到掉到 30 FPS 以下。可切換「每格一個元件」（各有 shadow root）與「一個元件 repeat N 列」比較成本。",
    hint: "按「自動加壓」開始・切換模式再測一次",
    mount(ctx) {
      ctx.html(`<div class="lt-stress"></div>`);
      const box = ctx.$(".lt-stress");
      let mode = 0, n = 0, cells = [], grid = null, cost = 0, busy = false, phase = 0;
      const sizeFor = (count) => { const { clientWidth: w, clientHeight: h } = box; return Math.max(2, Math.floor(Math.sqrt((w * h) / count)) - 1); };
      const build = (count) => {
        n = count;
        box.replaceChildren();
        box.style.setProperty("--s", `${sizeFor(count)}px`);
        cells = []; grid = null;
        if (mode === 0) {
          const wrap = document.createElement("div");
          wrap.style.cssText = "display:flex;flex-wrap:wrap;gap:1px;align-content:flex-start";
          for (let i = 0; i < count; i++) cells.push(document.createElement("lt-cell"));
          wrap.append(...cells);
          box.append(wrap);
        } else {
          grid = document.createElement("lt-grid");
          grid.vals = new Array(count).fill(0);
          box.append(grid);
        }
      };
      ctx.raf(() => {
        if (busy || !n) return;
        busy = true;
        phase += 4;
        const t0 = performance.now();
        let done;
        if (mode === 0) {
          for (let i = 0; i < cells.length; i++) cells[i].v = (phase + i * 2) % 360;
          done = cells[cells.length - 1].updateComplete;
        } else {
          const v = new Array(n);
          for (let i = 0; i < n; i++) v[i] = (phase + i * 2) % 360;
          grid.vals = v;
          done = grid.updateComplete;
        }
        done.then(() => { cost += (performance.now() - t0 - cost) * 0.15; busy = false; });
      });
      ctx.controls.classList.add("bottom");
      ctx.group(["每格一個元件", "repeat N 列"], 0, (i) => { mode = i; if (n) build(n); });
      ctx.onResize(() => n && box.style.setProperty("--s", `${sizeFor(n)}px`));
      ctx.ramp({
        label: "方塊", unit: "個", steps: [200, 500, 1000, 2000, 4000, 8000, 16000, 32000], minFps: 30,
        apply: async (count) => { build(count); await ctx.frame(2); },
        metrics: () => ({ "更新耗時": `${cost.toFixed(1)} ms`, "模式": mode ? "repeat" : "元件", "DOM 元素": mode ? n : n * 2 }),
        note: "每格都改 N 個值並等 Lit 完成批次更新與 DOM 寫入。元件模式每個方塊各有 shadow root 與自己的更新排程，建立與更新成本都比 repeat 高；repeat 模式只有一個元件，靠 key 對應逐列更新樣式。瓶頸通常在樣式重算與繪製。",
      });
    },
  },
] });
</script>
</body>
</html>
