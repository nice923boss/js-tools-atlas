<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiteGraph.js 示範：波形合成節點圖</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/css/litegraph.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #lg { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
  select.btn option { background: #1b1e25; color: var(--fg); }
  .litecontextmenu { font-family: var(--font) !important; }
</style>
</head>
<body>
<canvas id="lg"></canvas>
<div class="controls">
  <select class="btn" id="pick" aria-label="加入節點"><option value="">＋ 加入節點</option></select>
  <button class="btn" id="run" aria-pressed="false">暫停</button>
  <button class="btn" id="fit">置中</button>
</div>
<div class="hint">拖曳輸出點連線・拖滑桿改參數・右鍵開選單</div>

<script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/build/litegraph.core.min.js"></script>
<script>
const FONT = '"Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif';
const SIG = "訊號"; // single slot type, also shown as the slot menu title

// Dark palette in line with the rest of the atlas (must be set before the canvas is created).
Object.assign(LiteGraph, {
  NODE_TITLE_COLOR: "#cfd2dc", NODE_SELECTED_TITLE_COLOR: "#ffffff", NODE_TEXT_COLOR: "#cfd2dc",
  NODE_DEFAULT_COLOR: "#262a33", NODE_DEFAULT_BGCOLOR: "#1b1e25", NODE_DEFAULT_BOXCOLOR: "#5a5f6b",
  WIDGET_BGCOLOR: "#111318", WIDGET_OUTLINE_COLOR: "#3a3f4b", WIDGET_TEXT_COLOR: "#ecebe6",
  WIDGET_SECONDARY_TEXT_COLOR: "#9b998f", LINK_COLOR: "#4cc9f0", CONNECTING_LINK_COLOR: "#f7df1e",
  DEFAULT_SHADOW_COLOR: "rgba(0,0,0,.45)",
});

// A shared clock that stops while paused, so waveforms freeze instead of jumping.
let clock = 0;
let paused = false;
let last = performance.now();

const WAVES = {
  "正弦": (p) => Math.sin(p * Math.PI * 2),
  "方波": (p) => (p < 0.5 ? 1 : -1),
  "三角": (p) => 1 - 4 * Math.abs(p - 0.5),
  "鋸齒": (p) => 2 * p - 1,
};

function nodeMenu() {
  const node = this;
  return [
    { content: "收合／展開", callback: () => node.collapse() },
    { content: "刪除節點", callback: () => { node.graph.remove(node); } },
  ];
}
function slotMenu(slot) {
  const node = this;
  return [{ content: "中斷連線", callback: () => (slot.input ? node.disconnectInput(slot.slot) : node.disconnectOutput(slot.slot)) }];
}
function base(Ctor, title, color) {
  Ctor.title = title;
  Ctor.prototype.color = color;
  Ctor.prototype.getMenuOptions = nodeMenu;
  Ctor.prototype.getSlotMenuOptions = slotMenu;
}
// Small helper: a rounded dark panel inside a node body.
function panel(ctx, x, y, w, h) {
  ctx.fillStyle = "#0b0d11";
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, 6);
  ctx.fill();
}

// ---------- 振盪器：generates a waveform from the shared clock ----------
function Osc() {
  this.addOutput("輸出", SIG);
  this.properties = { wave: "正弦", freq: 0.5, amp: 1 };
  this.addWidget("combo", "波形", "正弦", "wave", { values: Object.keys(WAVES) });
  this.addWidget("slider", "頻率 Hz", 0.5, "freq", { min: 0.1, max: 3, precision: 2 });
  this.addWidget("slider", "振幅", 1, "amp", { min: 0, max: 1, precision: 2 });
  this.size = [210, 140];
  this.phase = 0;
}
base(Osc, "振盪器", "#4a4212");
Osc.prototype.onExecute = function () {
  this.phase = (clock * this.properties.freq) % 1;
  this.setOutputData(0, this.properties.amp * WAVES[this.properties.wave](this.phase));
};
// One period of the wave with a dot riding on the current phase.
Osc.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const x = 10, y = this.size[1] - 40, w = this.size[0] - 20, h = 32;
  panel(ctx, x, y, w, h);
  const f = WAVES[this.properties.wave], a = this.properties.amp;
  ctx.strokeStyle = "#f7df1e";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const p = i / 60;
    ctx.lineTo(x + 6 + p * (w - 12), y + h / 2 - f(p) * a * (h / 2 - 4));
  }
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.arc(x + 6 + this.phase * (w - 12), y + h / 2 - f(this.phase) * a * (h / 2 - 4), 3.2, 0, Math.PI * 2);
  ctx.fill();
  this.setDirtyCanvas(true, false);
};

// ---------- 混合器：combines two signals ----------
const OPS = { "相加": (a, b) => a + b, "相乘": (a, b) => a * b, "相減": (a, b) => a - b, "取大值": (a, b) => Math.max(a, b) };
function Mix() {
  this.addInput("A", SIG);
  this.addInput("B", SIG);
  this.addOutput("結果", SIG);
  this.properties = { op: "相加" };
  this.addWidget("combo", "運算", "相加", "op", { values: Object.keys(OPS) });
  this.size = [170, 100];
  this.value = 0;
}
base(Mix, "混合器", "#123a4a");
Mix.prototype.onExecute = function () {
  this.value = OPS[this.properties.op](this.getInputData(0) ?? 0, this.getInputData(1) ?? 0);
  this.setOutputData(0, this.value);
};
// A centre-zero meter showing the live result.
Mix.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const x = 10, y = this.size[1] - 26, w = this.size[0] - 20;
  panel(ctx, x, y, w, 18);
  const v = Math.max(-2, Math.min(2, this.value));
  ctx.fillStyle = v >= 0 ? "#4cc9f0" : "#f72585";
  const mid = x + w / 2;
  ctx.fillRect(Math.min(mid, mid + (v / 2) * (w / 2 - 4)), y + 4, Math.abs(v / 2) * (w / 2 - 4), 10);
  ctx.fillStyle = "#ecebe6";
  ctx.font = `600 11px ${FONT}`;
  ctx.textAlign = "right";
  ctx.fillText(this.value.toFixed(2), x + w - 6, y - 6);
  this.setDirtyCanvas(true, false);
};

// ---------- 平滑：one-pole low-pass filter ----------
function Smooth() {
  this.addInput("輸入", SIG);
  this.addOutput("輸出", SIG);
  this.properties = { k: 0.9 };
  this.addWidget("slider", "平滑度", 0.9, "k", { min: 0, max: 0.98, precision: 2 });
  this.size = [170, 60];
  this.y = 0;
}
base(Smooth, "平滑濾波", "#3a1a4a");
Smooth.prototype.onExecute = function () {
  const x = this.getInputData(0) ?? 0;
  if (!paused) this.y += (x - this.y) * (1 - this.properties.k);
  this.setOutputData(0, this.y);
};

// ---------- 示波器：scrolling two-trace scope ----------
const TRACE = ["#f7df1e", "#f72585"];
function Scope() {
  this.addInput("原始", SIG);
  this.addInput("平滑", SIG);
  this.size = [290, 170];
  this.buf = [[], []];
}
base(Scope, "示波器", "#1e4a2a");
Scope.prototype.onExecute = function () {
  if (paused) return;
  for (let i = 0; i < 2; i++) {
    const v = this.getInputData(i);
    const b = this.buf[i];
    b.push(v ?? null);
    if (b.length > 240) b.shift();
  }
  this.setDirtyCanvas(true, false);
};
Scope.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const x = 64, y = 8, w = this.size[0] - x - 8, h = this.size[1] - 16;
  panel(ctx, x, y, w, h);
  ctx.strokeStyle = "rgba(255,255,255,.07)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(x, y + (h * i) / 4); ctx.lineTo(x + w, y + (h * i) / 4); ctx.stroke();
  }
  const range = 2.2;
  for (let k = 0; k < 2; k++) {
    const b = this.buf[k];
    ctx.strokeStyle = TRACE[k];
    ctx.lineWidth = k ? 2.4 : 1.6;
    ctx.beginPath();
    let pen = false;
    b.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      const px = x + w - (b.length - 1 - i) * (w / 239), py = y + h / 2 - (v / range) * (h / 2);
      pen ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      pen = true;
    });
    ctx.stroke();
  }
  ctx.font = `600 11px ${FONT}`;
  ctx.textAlign = "left";
  ["原始", "平滑"].forEach((s, k) => {
    const v = this.getInputData(k);
    ctx.fillStyle = TRACE[k];
    ctx.fillText(`${s} ${v == null ? "未接" : v.toFixed(2)}`, x + 8 + k * 84, y + 16);
  });
};

// ---------- 數值錶：big readout with a half-circle gauge ----------
function Gauge() {
  this.addInput("輸入", SIG);
  this.size = [170, 110];
}
base(Gauge, "數值錶", "#4a2a12");
Gauge.prototype.onExecute = function () { this.setDirtyCanvas(true, false); };
Gauge.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const v = this.getInputData(0);
  const cx = this.size[0] / 2 + 14, cy = this.size[1] - 18, r = 46;
  ctx.lineWidth = 9;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#0b0d11";
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.stroke();
  if (v != null) {
    const t = (Math.max(-2, Math.min(2, v)) + 2) / 4;
    ctx.strokeStyle = "#ff8c42";
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI + t * Math.PI); ctx.stroke();
  }
  ctx.lineCap = "butt";
  ctx.fillStyle = "#ecebe6";
  ctx.font = `700 20px ${FONT}`;
  ctx.textAlign = "center";
  ctx.fillText(v == null ? "--" : v.toFixed(2), cx, cy - 6);
};

const TYPES = { "訊號/振盪器": Osc, "訊號/混合器": Mix, "訊號/平滑濾波": Smooth, "訊號/示波器": Scope, "訊號/數值錶": Gauge };
for (const [type, Ctor] of Object.entries(TYPES)) LiteGraph.registerNodeType(type, Ctor);

// ---------- graph and canvas ----------
const graph = new LGraph();
const el = document.getElementById("lg");
const canvas = new LGraphCanvas(el, graph);
Object.assign(canvas, {
  background_image: null, clear_background_color: "#0e1013", show_info: false, render_canvas_border: false,
  allow_searchbox: false, render_shadows: true, round_radius: 10,
  title_text_font: `700 13px ${FONT}`, inner_text_font: `normal 12px ${FONT}`,
});
// Dotted grid drawn in graph space so it pans and zooms with the nodes.
canvas.onDrawBackground = (ctx, area) => {
  const s = 24;
  ctx.fillStyle = "rgba(255,255,255,.07)";
  for (let x = Math.floor(area[0] / s) * s; x < area[0] + area[2]; x += s)
    for (let y = Math.floor(area[1] / s) * s; y < area[1] + area[3]; y += s) ctx.fillRect(x, y, 1.5, 1.5);
};
// Chinese menus instead of the built-in English ones.
canvas.getMenuOptions = () => Object.keys(TYPES).map((type) => ({
  content: `新增${TYPES[type].title}`,
  callback: () => addNode(type, [...canvas.graph_mouse]),
}));
canvas.showLinkMenu = function (link, e) {
  new LiteGraph.ContextMenu([{ content: "刪除連線", callback: () => { graph.removeLink(link.id); canvas.setDirty(true, true); } }], { event: e, title: "連線" });
  return false;
};

function addNode(type, pos) {
  const n = LiteGraph.createNode(type);
  n.pos = pos;
  graph.add(n);
  return n;
}

function build() {
  graph.clear();
  const wide = innerWidth >= 640;
  const make = (type, pos, props) => {
    const n = addNode(type, pos);
    if (props) {
      Object.assign(n.properties, props);
      n.widgets.forEach((w) => { if (w.options.property in props) w.value = props[w.options.property]; });
    }
    return n;
  };
  if (wide) {
    const a = make("訊號/振盪器", [0, 20], { wave: "正弦", freq: 0.45, amp: 1 });
    const b = make("訊號/振盪器", [0, 280], { wave: "方波", freq: 1.6, amp: 0.45 });
    const m = make("訊號/混合器", [270, 170]);
    const s = make("訊號/平滑濾波", [490, 330]);
    const sc = make("訊號/示波器", [700, 110]);
    const g = make("訊號/數值錶", [720, 350]);
    a.connect(0, m, 0); b.connect(0, m, 1);
    m.connect(0, sc, 0); m.connect(0, s, 0);
    s.connect(0, sc, 1); s.connect(0, g, 0);
  } else {
    const a = make("訊號/振盪器", [0, 0], { wave: "正弦", freq: 0.45, amp: 1 });
    const b = make("訊號/振盪器", [0, 210], { wave: "方波", freq: 1.6, amp: 0.45 });
    const m = make("訊號/混合器", [240, 130]);
    const sc = make("訊號/示波器", [60, 430]);
    a.connect(0, m, 0); b.connect(0, m, 1);
    m.connect(0, sc, 0);
  }
  fit();
}

// Scale and centre the graph, leaving space for the buttons and the hint.
function fit() {
  const W = el.clientWidth, H = el.clientHeight;
  if (el.width !== W || el.height !== H) canvas.resize(W, H);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of graph._nodes) {
    x0 = Math.min(x0, n.pos[0]); y0 = Math.min(y0, n.pos[1] - LiteGraph.NODE_TITLE_HEIGHT);
    x1 = Math.max(x1, n.pos[0] + n.size[0]); y1 = Math.max(y1, n.pos[1] + n.size[1]);
  }
  if (!isFinite(x0)) return;
  const top = 58, bottom = 46, side = 24;
  const z = Math.max(0.4, Math.min(1.15, (W - 2 * side) / (x1 - x0), (H - top - bottom) / (y1 - y0)));
  canvas.ds.scale = z;
  canvas.ds.offset[0] = W / (2 * z) - (x0 + x1) / 2;
  canvas.ds.offset[1] = (top + (H - top - bottom) / 2) / z - (y0 + y1) / 2;
  canvas.setDirty(true, true);
}

graph.onBeforeStep = () => {
  const now = performance.now();
  if (!paused) clock += Math.min(0.1, (now - last) / 1000);
  last = now;
};

// ---------- controls ----------
const pick = document.getElementById("pick");
for (const type of Object.keys(TYPES)) pick.add(new Option(TYPES[type].title, type));
pick.addEventListener("change", () => {
  if (!pick.value) return;
  // Place the new node near the middle of what is on screen.
  const c = canvas.ds.convertCanvasToOffset([el.clientWidth / 2, el.clientHeight / 2]);
  const n = addNode(pick.value, [c[0] - 80 + (Math.random() - 0.5) * 80, c[1] - 40 + (Math.random() - 0.5) * 80]);
  canvas.selectNode(n);
  pick.value = "";
});
const runBtn = document.getElementById("run");
runBtn.addEventListener("click", () => {
  paused = !paused;
  runBtn.setAttribute("aria-pressed", String(paused));
  runBtn.textContent = paused ? "繼續" : "暫停";
});
document.getElementById("fit").addEventListener("click", fit);
let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(fit, 120); });

canvas.resize(el.clientWidth, el.clientHeight);
build();
graph.start();
</script>
</body>
</html>
