<script>
const { h, fmt } = Showcase;
const C = { c1: "#f7df1e", c2: "#4cc9f0", c3: "#f72585", c4: "#7bd389", c5: "#ff8c42", c6: "#9d8cff", muted: "#9b998f", fg: "#ecebe6" };
const BG = "#0e1013";
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "sans-serif";
const MONO = rootCss.getPropertyValue("--mono").trim() || "monospace";
let TNOW = 0; // seconds, refreshed before every graph step
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- global LiteGraph look (must be set before any canvas exists) ----------
Object.assign(LiteGraph, {
  NODE_TITLE_COLOR: "#cfd2dc", NODE_SELECTED_TITLE_COLOR: "#ffffff", NODE_TEXT_COLOR: "#cfd2dc",
  NODE_DEFAULT_COLOR: "#262a33", NODE_DEFAULT_BGCOLOR: "#1b1e25", NODE_DEFAULT_BOXCOLOR: "#5a5f6b",
  WIDGET_BGCOLOR: "#111318", WIDGET_OUTLINE_COLOR: "#3a3f4b", WIDGET_TEXT_COLOR: "#ecebe6",
  WIDGET_SECONDARY_TEXT_COLOR: "#9b998f", LINK_COLOR: C.c2, EVENT_LINK_COLOR: C.c5, CONNECTING_LINK_COLOR: C.c1,
  DEFAULT_SHADOW_COLOR: "rgba(0,0,0,.45)",
  node_box_coloured_by_mode: true,
  // mode 0 (always) keeps the node's own box colour; on event / never / on trigger get tinted
  NODE_MODES_COLORS: ["", C.c6, C.c3, C.c6, C.c6],
});
Object.assign(LGraphCanvas.link_type_colors, { "-1": C.c5, number: C.c2, boolean: C.c4, string: C.c6, palette: C.c3 });
const SLOT_ON = { number: C.c2, boolean: C.c4, string: C.c6, palette: C.c3, "-1": C.c5 };
const SLOT_OFF = Object.fromEntries(Object.entries(SLOT_ON).map(([k, v]) => [k, v + "73"]));
const TYPE_ZH = { number: "數值", boolean: "布林", string: "字串", palette: "色票", array: "陣列", object: "物件" };
function typeZh(t) {
  if (t === -1 || t === "-1") return "事件";
  if (t === "" || t === "*" || t === 0 || t == null) return "任意";
  return String(t).split(",").map((s) => TYPE_ZH[s.toLowerCase()] || s).join("、");
}

// ---------- built-in node types kept on this page, with Chinese titles and labels ----------
// type: [title, input labels, output labels, widget labels]
const ZH = {
  "basic/time": ["時間", null, ["毫秒", "秒"]],
  "basic/const": ["常數", null, null, { value: "數值" }],
  "basic/boolean": ["布林常數", null, ["布林"], { value: "值" }],
  "basic/watch": ["監看"],
  "math/operation": ["運算", ["A", "B"], ["結果"]],
  "math/trigonometry": ["三角函數", ["角度"], ["正弦"]],
  "math/scale": ["縮放", ["輸入"], ["輸出"]],
  "math/noise": ["雜訊", ["輸入"], ["輸出"]],
  "math/clamp": ["夾限", ["輸入"], ["輸出"]],
  "math/abs": ["絕對值", ["輸入"], ["輸出"]],
  "math/rand": ["亂數", null, ["值"]],
  "math/range": ["範圍映射", ["輸入"], ["輸出", "夾限後"]],
  "math/condition": ["條件", ["A", "B"], ["成立", "不成立"], { "Cond.": "比較" }],
  "math/lerp": ["線性內插", ["A", "B"], ["輸出"]],
  "math/accumulate": ["累加", ["增量"], ["總和"]],
  "logic/AND": ["且", ["A", "B"], ["輸出"]],
  "logic/OR": ["或", ["A", "B"], ["輸出"]],
  "logic/NOT": ["非", ["輸入"], ["輸出"]],
  "string/toFixed": ["固定小數", ["數值"], ["字串"]],
  "string/concatenate": ["字串串接", ["A", "B"], ["輸出"]],
  "events/timer": ["計時器", null, ["滴答"]],
  "events/counter": ["計數器", ["加一", "減一", "歸零"], ["變化", "數值"], { "Count Exec.": "執行時也計數" }],
  "events/sequence": ["依序觸發"],
  "events/delay": ["延遲", ["事件"], ["時間到"]],
  "events/filter": ["事件過濾", ["事件"], ["通過"]],
  "events/branch": ["分支", ["事件", "條件"], ["成立", "不成立"]],
  "events/once": ["只觸發一次", ["事件", "重設"], ["輸出"], { reset: "重設" }],
  "widget/knob": ["旋鈕"],
  "widget/hslider": ["水平滑桿"],
  "widget/progress": ["進度條"],
  "widget/button": ["按鈕"],
  "widget/toggle": ["開關"],
  "widget/number": ["數字"],
  "graphics/plot": ["曲線圖"],
  "graph/input": ["子圖輸入", null, null, { Name: "名稱", Type: "型別", Value: "預設值" }],
  "graph/output": ["子圖輸出", null, null, { Name: "名稱", Type: "型別" }],
  "graph/subgraph": ["子圖"],
};
const CAT_ZH = { basic: "基本", math: "數學", logic: "邏輯", string: "字串", events: "事件", widget: "小工具", graphics: "圖形", graph: "子圖" };
const TOTAL_TYPES = Object.keys(LiteGraph.registered_node_types).length;
const EN_TITLE = {};
for (const type of Object.keys(LiteGraph.registered_node_types)) {
  if (!ZH[type]) { LiteGraph.unregisterNodeType(type); continue; }
  const cls = LiteGraph.registered_node_types[type];
  EN_TITLE[type] = cls.title;
  cls.title = ZH[type][0];
}
const T = (type) => LiteGraph.registered_node_types[type];

// Chinese titles that depend on properties
T("events/timer").prototype.getTitle = function () { return `計時器 ${this.properties.interval} ms`; };
T("events/timer").on_color = C.c5;
T("events/sequence").prototype.getTitle = LGraphNode.prototype.getTitle;
T("math/operation").prototype.getTitle = function () {
  const op = this.properties.OP;
  return { "*": "A × B", "/": "A ÷ B", max: "取大值(A, B)", min: "取小值(A, B)" }[op] || `A ${op} B`;
};
T("math/condition").prototype.getTitle = function () { return `條件 A ${this.properties.OP} B`; };
T("graph/input").prototype.getTitle = function () { return `輸入：${this.properties.name || "（未命名）"}`; };
T("graph/output").prototype.getTitle = function () { return `輸出：${this.properties.name || "（未命名）"}`; };
T("graphics/plot").colors = [C.c1, C.c3, C.c2, C.c4];
// Watch writes its value into the slot label; show booleans and decimals the Chinese way.
T("basic/watch").toString = function str(o) {
  if (o == null) return "null";
  if (typeof o === "number") return Number.isInteger(o) ? String(o) : o.toFixed(3);
  if (typeof o === "boolean") return o ? "真" : "假";
  if (Array.isArray(o)) return `[${o.map(str).join(", ")}]`;
  return String(o);
};
// Themed button body (the original paints fixed light blue).
T("widget/button").prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const m = 8, w = this.size[0] - m * 2, hh = this.size[1] - m * 2;
  ctx.fillStyle = this.clicked ? C.c5 : this.mouseOver ? "#343a47" : "#272c36";
  ctx.strokeStyle = C.c5;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(m, m, w, hh, 7); ctx.fill(); ctx.stroke();
  const fs = this.properties.font_size || 16;
  ctx.fillStyle = this.clicked ? "#111" : C.fg;
  ctx.font = `700 ${fs}px ${FONT}`;
  ctx.textAlign = "center";
  ctx.fillText(this.properties.text, this.size[0] / 2, this.size[1] / 2 + fs * 0.35);
  ctx.textAlign = "left";
};
// Subgraph: a Chinese "enter" bar instead of the English property dialogs.
const SUB_BAR = 26;
T("graph/subgraph").prototype.onDrawBackground = function (ctx, gc, canvas, pos) {
  if (this.flags.collapsed) return;
  const y = this.size[1] - SUB_BAR;
  const over = pos && LiteGraph.isInsideRectangle(pos[0], pos[1], this.pos[0], this.pos[1] + y, this.size[0], SUB_BAR);
  ctx.fillStyle = over ? "rgba(76,201,240,.3)" : "rgba(76,201,240,.12)";
  ctx.beginPath(); ctx.roundRect(0, y, this.size[0], SUB_BAR, [0, 0, 10, 10]); ctx.fill();
  ctx.fillStyle = over ? C.fg : C.c2;
  ctx.font = `600 12px ${FONT}`;
  ctx.textAlign = "center";
  ctx.fillText("雙擊或點此進入 ▸", this.size[0] / 2, y + 17);
  ctx.textAlign = "left";
};
T("graph/subgraph").prototype.onMouseDown = function (e, local, gc) {
  if (this.flags.collapsed || local[1] < this.size[1] - SUB_BAR) return false;
  setTimeout(() => gc.openSubgraph(this.subgraph), 10);
  return true;
};

// Translate titles, slot labels and widget labels of a freshly added node.
function localize(n) {
  const z = ZH[n.type];
  if (z) {
    if (!n.title || n.title === EN_TITLE[n.type]) n.title = z[0];
    const [, ins, outs, wl] = z;
    const label = (list, names) => names && (list || []).forEach((s, i) => { if (names[i] && (!s.label || s.label === s.name)) s.label = names[i]; });
    label(n.inputs, ins);
    label(n.outputs, outs);
    if (wl) for (const w of n.widgets || []) if (wl[w.name] && w.type !== "slider") w.label = wl[w.name];
  }
  for (const w of n.widgets || []) if (w.type === "toggle" && w.options) { w.options.on ??= "開"; w.options.off ??= "關"; }
  if (n.subgraph) n.subgraph.onNodeAdded = localize;
}

// Swap the library's hard-coded Arial / Tahoma for the page font on a 2D context.
function fontFix(c) {
  const d = Object.getOwnPropertyDescriptor(CanvasRenderingContext2D.prototype, "font");
  const cache = new Map();
  Object.defineProperty(c, "font", {
    configurable: true,
    get() { return d.get.call(this); },
    set(v) {
      let f = cache.get(v);
      if (f === undefined) { f = String(v).replace(/\b(Arial|Tahoma)\b/g, FONT); cache.set(v, f); }
      d.set.call(this, f);
    },
  });
}

// ---------- small helpers ----------
function onBox(ctx, el, fn) {
  let lw = el.clientWidth, lh = el.clientHeight, raf = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = el.clientWidth, hh = el.clientHeight;
      if (!w || !hh || (w === lw && hh === lh)) return;
      lw = w; lh = hh;
      fn(w, hh);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}
function makeLog(ul, counter) {
  let total = 0;
  return (kind, text, cls = "") => {
    ul.querySelector(".empty")?.remove();
    const d = new Date();
    const time = `${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;
    ul.prepend(h("li", {}, h("time", { text: time }), h("b", { class: cls, text: kind }), h("span", { text, title: text })));
    while (ul.children.length > 40) ul.lastElementChild.remove();
    if (counter) counter.textContent = `${++total} 筆`;
  };
}
function badge(box) { const b = h("div", { class: "lg-badge" }); box.append(b); return b; }
function well(ctx, x, y, w, hh) { ctx.fillStyle = "#0b0d11"; ctx.beginPath(); ctx.roundRect(x, y, w, hh, 6); ctx.fill(); }
function hslHex(hue, s, l) {
  hue = ((hue % 360) + 360) % 360; s /= 100; l /= 100;
  const a = s * Math.min(l, 1 - l);
  const f = (n) => { const k = (n + hue / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
  return "#" + [f(0), f(8), f(4)].map((v) => v.toString(16).padStart(2, "0")).join("");
}
function setProps(n, props) {
  const keys = Object.keys(props);
  // graph/output must know its type before the name creates the outer slot
  if (n.type === "graph/output") keys.sort((a, b) => (a === "type" ? -1 : b === "type" ? 1 : 0));
  for (const k of keys) n.setProperty(k, props[k]);
  if (n.value_widget && "value" in props) n.value_widget.value = props.value;
}
function add(g, type, { title, props, size, color } = {}) {
  const n = LiteGraph.createNode(type);
  if (!n) throw new Error(`找不到節點型別 ${type}`);
  g.add(n);
  if (props) setProps(n, props);
  if (title) n.title = title;
  if (size) n.size = [...size];
  if (color) n.color = color;
  return n;
}
function place(list) { for (const [n, x, y, size] of list) { n.pos = [x, y]; if (size) n.size = [...size]; } }
// Fit a group around nodes, leaving room for its title bar.
function wrap(gr, nodes, pad = 14) {
  const b = new Float32Array(4);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) { n.getBounding(b); x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[0] + b[2]); y1 = Math.max(y1, b[1] + b[3]); }
  gr.pos = [x0 - pad, y0 - 34];
  gr.size = [x1 - x0 + pad * 2, y1 - y0 + 34 + pad];
}
function group(g, title, color, nodes) {
  const gr = new LiteGraph.LGraphGroup(title);
  gr.color = color;
  gr.font_size = 18;
  g.add(gr);
  if (nodes) wrap(gr, nodes);
  return gr;
}
function bounds(g) {
  const b = new Float32Array(4);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const take = (x, y, w, hh) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + hh); };
  for (const n of g._nodes) { n.getBounding(b); take(b[0], b[1], b[2], b[3]); }
  for (const gr of g._groups) take(...gr._bounding);
  return isFinite(x0) ? [x0, y0, x1 - x0, y1 - y0] : null;
}
const sigOf = (g) => g._nodes.length + ":" + g._nodes.map((n) => `${Math.round(n.pos[0])},${Math.round(n.pos[1])}`).join(";");
const linkCount = (g) => Object.values(g.links || {}).filter(Boolean).length;
function fitView(lgc, { pad = 16, top = 14, bot = 44, min = 0.5, max = 1.15 } = {}) {
  const b = bounds(lgc.graph), ds = lgc.ds;
  const W = lgc.canvas.width, H = lgc.canvas.height;
  if (!b || !W || !H) { lgc.setDirty(true, true); return; }
  const aw = W - pad * 2, ah = H - top - bot;
  const s = clamp(Math.min(aw / b[2], ah / b[3]), min, max);
  ds.scale = s;
  ds.offset[0] = b[2] * s <= aw ? (W / s - b[2]) / 2 - b[0] : pad / s - b[0];
  ds.offset[1] = b[3] * s <= ah ? (top + (ah - b[3] * s) / 2) / s - b[1] : top / s - b[1];
  lgc.setDirty(true, true);
}

// ---------- custom nodes ----------
function def(type, Ctor, title, color) {
  Ctor.title = title;
  if (color) Ctor.prototype.color = color;
  // keep property-bound widgets in step after configure()
  Ctor.prototype.onConfigure = function () {
    for (const w of this.widgets || []) { const p = w.options && w.options.property; if (p && p in this.properties) w.value = this.properties[p]; }
  };
  LiteGraph.registerNodeType(type, Ctor);
}

const WAVES = {
  "正弦": (p) => Math.sin(p * Math.PI * 2),
  "方波": (p) => (p < 0.5 ? 1 : -1),
  "三角": (p) => 1 - 4 * Math.abs(p - 0.5),
  "鋸齒": (p) => 2 * p - 1,
};
function Osc() {
  this.addOutput("輸出", "number");
  this.properties = { wave: "正弦", freq: 0.5, amp: 1 };
  this.addWidget("combo", "波形", "正弦", "wave", { values: Object.keys(WAVES) });
  this.addWidget("slider", "頻率 Hz", 0.5, "freq", { min: 0.1, max: 3, precision: 2 });
  this.addWidget("slider", "振幅", 1, "amp", { min: 0, max: 1, precision: 2 });
  this.size = [210, 140];
  this.phase = 0;
}
Osc.prototype.onExecute = function () {
  const dt = Math.min(0.1, (this.graph && this.graph.elapsed_time) || 0.016);
  this.phase = (this.phase + dt * this.properties.freq) % 1;
  this.setOutputData(0, this.properties.amp * WAVES[this.properties.wave](this.phase));
};
// One period of the wave with a dot riding on the current phase.
Osc.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const x = 10, y = this.size[1] - 38, w = this.size[0] - 20, hh = 30;
  well(ctx, x, y, w, hh);
  const f = WAVES[this.properties.wave] || WAVES["正弦"], a = this.properties.amp;
  ctx.strokeStyle = C.c1;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) ctx.lineTo(x + 6 + (i / 60) * (w - 12), y + hh / 2 - f(i / 60) * a * (hh / 2 - 4));
  ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(x + 6 + this.phase * (w - 12), y + hh / 2 - f(this.phase) * a * (hh / 2 - 4), 3.2, 0, Math.PI * 2);
  ctx.fill();
};
def("訊號/振盪器", Osc, "振盪器", "#4a4212");

const OPS = { "相加": (a, b) => a + b, "相乘": (a, b) => a * b, "相減": (a, b) => a - b, "取大值": (a, b) => Math.max(a, b) };
function Mix() {
  this.addInput("A", "number");
  this.addInput("B", "number");
  this.addOutput("結果", "number");
  this.properties = { op: "相加" };
  this.addWidget("combo", "運算", "相加", "op", { values: Object.keys(OPS) });
  this.size = [170, 100];
  this.value = 0;
}
Mix.prototype.onExecute = function () {
  this.value = (OPS[this.properties.op] || OPS["相加"])(this.getInputData(0) ?? 0, this.getInputData(1) ?? 0);
  this.setOutputData(0, this.value);
};
// Centre-zero meter with the live result.
Mix.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  // meter on the left of the well, numeric value on the right (keeps clear of the combo widget)
  const x = 10, y = this.size[1] - 24, w = this.size[0] - 20, bw = w - 50, mid = x + bw / 2;
  well(ctx, x, y, w, 16);
  const v = clamp(this.value, -2, 2);
  ctx.fillStyle = v >= 0 ? C.c2 : C.c3;
  ctx.fillRect(Math.min(mid, mid + (v / 2) * (bw / 2 - 4)), y + 4, Math.abs(v / 2) * (bw / 2 - 4), 8);
  ctx.fillStyle = C.fg;
  ctx.font = `600 11px ${MONO}`;
  ctx.textAlign = "right";
  ctx.fillText(this.value.toFixed(2), x + w - 5, y + 12);
  ctx.textAlign = "left";
};
def("訊號/混合器", Mix, "混合器", "#123a4a");

function Smooth() {
  this.addInput("輸入", "number");
  this.addOutput("輸出", "number");
  this.properties = { k: 0.9 };
  this.addWidget("slider", "平滑度", 0.9, "k", { min: 0, max: 0.98, precision: 2 });
  this.size = [170, 60];
  this.y = 0;
}
Smooth.prototype.onExecute = function () {
  const x = this.getInputData(0) ?? 0;
  this.y += (x - this.y) * (1 - this.properties.k);
  this.setOutputData(0, this.y);
};
def("訊號/平滑濾波", Smooth, "平滑濾波", "#3a1a4a");

const TRACE = [C.c1, C.c3, C.c2, C.c4];
function Scope() { this.traces(["A", "B"]); }
Scope.prototype.traces = function (names) {
  while (this.inputs && this.inputs.length) this.removeInput(0);
  names.forEach((n, i) => this.addInput(n, "number", { color_on: TRACE[i], color_off: TRACE[i] + "88" }));
  this.buf = names.map(() => []);
  this.size = [290, 170];
  this.lo = -1; this.hi = 1;
};
Scope.prototype.onExecute = function () {
  const n = this.inputs.length;
  if (this.buf.length !== n) this.buf = Array.from({ length: n }, () => []);
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < n; i++) {
    const v = this.getInputData(i), b = this.buf[i];
    b.push(typeof v === "number" ? v : null);
    if (b.length > 240) b.shift();
    for (const x of b) if (x != null) { lo = Math.min(lo, x); hi = Math.max(hi, x); }
  }
  if (!isFinite(lo)) { lo = -1; hi = 1; }
  const span = Math.max(0.5, hi - lo), c = (hi + lo) / 2;
  this.lo += (c - span * 0.6 - this.lo) * 0.08;
  this.hi += (c + span * 0.6 - this.hi) * 0.08;
};
Scope.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const n = this.inputs.length, x = n >= 3 ? 84 : 72, y = 8, w = this.size[0] - x - 8, hh = this.size[1] - 16;
  well(ctx, x, y, w, hh);
  ctx.strokeStyle = "rgba(255,255,255,.07)";
  ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x, y + (hh * i) / 4); ctx.lineTo(x + w, y + (hh * i) / 4); ctx.stroke(); }
  const lo = this.lo, hi = this.hi, py = (v) => y + hh - ((v - lo) / (hi - lo)) * hh;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, hh); ctx.clip();
  if (lo < 0 && hi > 0) { ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.beginPath(); ctx.moveTo(x, py(0)); ctx.lineTo(x + w, py(0)); ctx.stroke(); }
  (this.buf || []).forEach((b, k) => {
    ctx.strokeStyle = TRACE[k % TRACE.length];
    ctx.lineWidth = k ? 2 : 1.6;
    ctx.beginPath();
    let pen = false;
    b.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      const px = x + w - (b.length - 1 - i) * (w / 239);
      pen ? ctx.lineTo(px, py(v)) : ctx.moveTo(px, py(v));
      pen = true;
    });
    ctx.stroke();
  });
  ctx.restore();
  ctx.font = `600 11px ${MONO}`;
  ctx.textAlign = "left";
  const y0 = n * LiteGraph.NODE_SLOT_HEIGHT + 22;
  this.inputs.forEach((s, k) => {
    const v = this.getInputData(k);
    ctx.fillStyle = TRACE[k % TRACE.length];
    ctx.fillText(typeof v === "number" ? v.toFixed(2) : "--", 12, y0 + k * 16);
  });
};
def("訊號/示波器", Scope, "示波器", "#1e4a2a");

function Gauge() { this.addInput("輸入", "number"); this.size = [170, 110]; }
Gauge.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const v = this.getInputData(0);
  const cx = this.size[0] / 2 + 14, cy = this.size[1] - 16, r = 44;
  ctx.lineWidth = 9;
  ctx.lineCap = "round";
  ctx.strokeStyle = "#0b0d11";
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.stroke();
  if (typeof v === "number") {
    const t = (clamp(v, -2, 2) + 2) / 4;
    ctx.strokeStyle = C.c5;
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI + t * Math.PI); ctx.stroke();
  }
  ctx.lineCap = "butt";
  ctx.fillStyle = C.fg;
  ctx.font = `700 19px ${MONO}`;
  ctx.textAlign = "center";
  ctx.fillText(typeof v === "number" ? v.toFixed(2) : "--", cx, cy - 6);
  ctx.textAlign = "left";
};
def("訊號/數值錶", Gauge, "數值錶", "#4a2a12");

// Event sink: counts every onAction() call and reports it to the page.
function EvLog() {
  this.addInput("事件", LiteGraph.ACTION);
  this.properties = { tag: "事件" };
  this.size = [160, 30];
  this.count = 0;
  this.flash = 0;
}
EvLog.prototype.getTitle = function () { return this.properties.tag; };
EvLog.prototype.onAction = function (action, param) {
  this.count++;
  this.flash = performance.now();
  if (this.graph && this.graph.onEvLog) this.graph.onEvLog(this.properties.tag, param);
  this.setDirtyCanvas(true, false);
};
EvLog.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  ctx.font = `600 12px ${FONT}`;
  ctx.textAlign = "right";
  ctx.fillStyle = C.fg;
  ctx.fillText(`${this.count} 次`, this.size[0] - 24, this.size[1] / 2 + 4);
  const a = Math.max(0, 1 - (performance.now() - this.flash) / 600);
  ctx.fillStyle = `rgba(255,140,66,${0.15 + 0.85 * a})`;
  ctx.beginPath(); ctx.arc(this.size[0] - 11, this.size[1] / 2, 5, 0, Math.PI * 2); ctx.fill();
  ctx.textAlign = "left";
  if (a > 0) this.setDirtyCanvas(true, false);
};
def("示範/事件紀錄", EvLog, "事件紀錄", "#4a3312");

// Colour tool chain: five widget kinds feeding typed outputs.
const SCHEMES = { "互補": [0, 180], "三角": [0, 120, 240], "類似": [-30, 0, 30], "分裂互補": [0, 150, 210] };
function Panel() {
  this.addOutput("色相", "number");
  this.addOutput("飽和度", "number");
  this.addOutput("配色", "string");
  this.addOutput("顯示色碼", "boolean");
  this.addOutput("標籤", "string");
  this.properties = { hue: 200, sat: 70, scheme: "三角", hex: true, label: "我的配色" };
  this.addWidget("slider", "色相", 200, "hue", { min: 0, max: 360, precision: 0 });
  this.addWidget("number", "飽和度", 70, "sat", { min: 0, max: 100, step: 50, precision: 0 });
  this.addWidget("combo", "配色", "三角", "scheme", { values: Object.keys(SCHEMES) });
  this.addWidget("toggle", "顯示色碼", true, "hex", { on: "開", off: "關" });
  this.addWidget("text", "標籤", "我的配色", "label");
  this.addWidget("button", "隨機色相", null, () => this.setProperty("hue", Math.round(Math.random() * 360)));
  this.size = [230, this.computeSize()[1]];
}
Panel.prototype.onExecute = function () {
  const p = this.properties;
  [p.hue, p.sat, p.scheme, p.hex, p.label].forEach((v, i) => this.setOutputData(i, v));
};
def("色彩/控制面板", Panel, "控制面板", "#3a2a4a");

function Calc() {
  this.addInput("色相", "number");
  this.addInput("飽和度", "number");
  this.addInput("配色", "string");
  this.addOutput("色票", "palette");
  this.size = [190, 92];
  this.pal = [];
}
Calc.prototype.onExecute = function () {
  const hue = this.getInputData(0) ?? 200, s = this.getInputData(1) ?? 70;
  const sc = SCHEMES[this.getInputData(2)] || SCHEMES["三角"];
  this.pal = sc.map((d) => ({ h: (((hue + d) % 360) + 360) % 360, s: clamp(s, 0, 100) }));
  this.setOutputData(0, this.pal);
};
Calc.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed || !this.pal.length) return;
  const x = 10, y = this.size[1] - 24, w = (this.size[0] - 20) / this.pal.length;
  this.pal.forEach((p, i) => { ctx.fillStyle = hslHex(p.h, p.s, 55); ctx.beginPath(); ctx.roundRect(x + i * w + 1, y, w - 2, 16, 4); ctx.fill(); });
};
def("色彩/配色計算", Calc, "配色計算", "#2a3a4a");

function Shade() {
  this.addInput("色票", "palette");
  this.addInput("亮度", "number");
  this.addOutput("色票", "palette");
  this.properties = { light: 55 };
  this.size = [180, 74];
  this.pal = [];
  this.l = 55;
}
Shade.prototype.onExecute = function () {
  const pal = this.getInputData(0) || [];
  this.l = clamp(this.getInputData(1) ?? this.properties.light, 5, 95);
  this.pal = pal.map((p) => ({ ...p, l: this.l }));
  this.setOutputData(0, this.pal);
};
Shade.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const x = 10, y = this.size[1] - 22, w = this.size[0] - 20, hue = this.pal[0] ? this.pal[0].h : 0, s = this.pal[0] ? this.pal[0].s : 0;
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  for (let i = 0; i <= 4; i++) g.addColorStop(i / 4, hslHex(hue, s, 10 + i * 20));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(x, y, w, 12, 4); ctx.fill();
  const mx = x + ((this.l - 10) / 80) * w;
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.moveTo(mx, y - 1); ctx.lineTo(mx - 5, y - 8); ctx.lineTo(mx + 5, y - 8); ctx.fill();
};
def("色彩/明暗調整", Shade, "明暗調整", "#2a3a4a");

function Swatch() {
  this.addInput("色票", "palette");
  this.addInput("顯示色碼", "boolean");
  this.addInput("標籤", "string");
  this.size = [260, 160];
  this.pal = [];
}
Swatch.prototype.onExecute = function () { this.pal = this.getInputData(0) || []; };
Swatch.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const showHex = this.getInputData(1) !== false, label = this.getInputData(2) ?? "未命名";
  const x = 84, y = 8, w = this.size[0] - x - 10;
  ctx.textAlign = "left";
  ctx.fillStyle = C.fg;
  ctx.font = `700 13px ${FONT}`;
  ctx.fillText(String(label).slice(0, 14), x, y + 12);
  if (!this.pal.length) { ctx.fillStyle = C.muted; ctx.font = `12px ${FONT}`; ctx.fillText("等待色票輸入", x, y + 40); return; }
  const cw = w / this.pal.length, rh = showHex ? 26 : 34, top = y + 22;
  this.pal.forEach((p, i) => [-18, 0, 18].forEach((d, r) => {
    ctx.fillStyle = hslHex(p.h, p.s, clamp((p.l ?? 55) + d, 5, 95));
    ctx.fillRect(x + i * cw + 1, top + r * rh, cw - 2, rh - 2);
  }));
  if (showHex) {
    ctx.font = `10px ${MONO}`;
    ctx.fillStyle = C.muted;
    ctx.textAlign = "center";
    this.pal.forEach((p, i) => ctx.fillText(hslHex(p.h, p.s, p.l ?? 55).slice(1).toUpperCase(), x + i * cw + cw / 2, top + 3 * rh + 11));
    ctx.textAlign = "left";
  }
};
def("色彩/色票", Swatch, "色票", "#2a3a4a");

// Stress node: one input, one output, a tiny bar. Chains of these form the load.
function Chain() {
  this.addInput("", "number");
  this.addOutput("", "number");
  this.size = [120, 26];
  this.v = 0;
}
Chain.prototype.onExecute = function () {
  const x = this.getInputData(0);
  this.v = x == null ? Math.sin(TNOW * 2 + this.id) : 0.92 * x + 0.08 * Math.sin(TNOW * 3 + this.id * 0.3);
  this.setOutputData(0, this.v);
};
Chain.prototype.onDrawForeground = function (ctx) {
  if (this.flags.collapsed) return;
  const mid = 60, w = clamp(this.v, -1, 1) * 46;
  ctx.fillStyle = "#0b0d11";
  ctx.fillRect(12, 9, 96, 8);
  ctx.fillStyle = w >= 0 ? C.c2 : C.c3;
  ctx.fillRect(Math.min(mid, mid + w), 9, Math.abs(w), 8);
};
def("壓測/鏈節", Chain, "鏈節", "#21303a");

// ---------- graph + canvas factory ----------
const MODES = [["一律執行", LiteGraph.ALWAYS], ["僅事件觸發", LiteGraph.ON_EVENT], ["停用", LiteGraph.NEVER]];
const GROUP_COLORS = [["黃", C.c1], ["藍", C.c2], ["桃紅", C.c3], ["綠", C.c4], ["橘", C.c5], ["紫", C.c6]];
function makeGraph(ctx, host, { search = true, onNav, ...view } = {}) {
  const cv = h("canvas", { class: "lg-cv" });
  host.prepend(cv);
  const bodyOverflow = document.body.style.overflow;
  const graph = new LGraph();
  graph.onNodeAdded = localize;
  const lgc = new LGraphCanvas(cv, graph);
  lgc.bgctx = lgc.bgcanvas.getContext("2d");
  fontFix(lgc.ctx);
  fontFix(lgc.bgctx);
  Object.assign(lgc, {
    background_image: null, clear_background_color: BG, show_info: false, render_canvas_border: false,
    render_shadows: true, round_radius: 10, allow_searchbox: search,
    title_text_font: `700 13px ${FONT}`, inner_text_font: `normal 12px ${FONT}`,
    default_connection_color_byType: { ...SLOT_ON }, default_connection_color_byTypeOff: { ...SLOT_OFF },
  });
  const dirty = () => lgc.setDirty(true, true);

  // Background in screen space: flat colour, dot grid, a cyan frame inside subgraphs.
  lgc.onRenderBackground = (c, g) => {
    g.fillStyle = BG;
    g.fillRect(0, 0, c.width, c.height);
    const s = lgc.ds.scale;
    if (s >= 0.5) {
      const step = 24 * s, ox = ((lgc.ds.offset[0] * s) % step + step) % step, oy = ((lgc.ds.offset[1] * s) % step + step) % step;
      g.fillStyle = "rgba(255,255,255,.07)";
      for (let x = ox; x < c.width; x += step) for (let y = oy; y < c.height; y += step) g.fillRect(x, y, 1.5, 1.5);
    }
    if (lgc.graph && lgc.graph._is_subgraph) { g.strokeStyle = "rgba(76,201,240,.55)"; g.lineWidth = 3; g.strokeRect(1.5, 1.5, c.width - 3, c.height - 3); }
    return true;
  };

  const addAt = (type, pos) => {
    const n = LiteGraph.createNode(type);
    if (!n) return;
    n.pos = [pos[0], pos[1]];
    lgc.graph.add(n);
    lgc.selectNode(n);
  };
  const addable = () => Object.keys(LiteGraph.registered_node_types).filter((t) => !t.startsWith("壓測/") && (!/^graph\/(input|output)$/.test(t) || lgc.graph._is_subgraph));

  // Chinese right-click menus for slots, nodes and the empty canvas.
  lgc.processContextMenu = function (node, e) {
    const items = [];
    let title = "";
    const slot = node ? node.getSlotInPosition(e.canvasX, e.canvasY) : null;
    if (slot) {
      const isIn = !!slot.input, s = slot.input || slot.output;
      title = `${isIn ? "輸入" : "輸出"}：${esc(s.label || s.name || "（未命名）")}`;
      items.push({ content: `型別：${esc(typeZh(s.type))}`, disabled: true });
      const linked = isIn ? s.link != null : s.links && s.links.length;
      items.push(linked
        ? { content: "中斷連線", callback: () => { isIn ? node.disconnectInput(slot.slot) : node.disconnectOutput(slot.slot); dirty(); } }
        : { content: "尚未連線", disabled: true });
    } else if (node) {
      title = `${esc(node.getTitle() || node.title || "")}<code>${esc(node.type)}</code>`;
      if (node.subgraph) items.push({ content: "進入子圖", callback: () => lgc.openSubgraph(node.subgraph) });
      items.push({ content: node.flags.collapsed ? "展開節點" : "收合節點", callback: () => { node.collapse(true); dirty(); } });
      items.push({ content: node.flags.pinned ? "取消釘選" : "釘選位置", callback: () => { node.pin(); dirty(); } });
      items.push({
        content: "執行模式", has_submenu: true,
        submenu: { title: "執行模式", options: MODES.map(([label, m]) => ({ content: `${node.mode === m ? "● " : "　"}${label}`, callback: () => { node.changeMode(m); dirty(); } })) },
      });
      items.push(null);
      const io = /^graph\/(input|output)$/.test(node.type);
      items.push({
        content: "複製節點", disabled: io,
        callback: () => { const c = node.clone(); if (!c) return; c.pos = [node.pos[0] + 24, node.pos[1] + 24]; node.graph.add(c); lgc.selectNode(c); },
      });
      items.push({ content: "刪除節點", callback: () => { node.graph.remove(node); dirty(); } });
    } else {
      const pos = [e.canvasX, e.canvasY], cats = {};
      for (const t of addable()) (cats[t.split("/")[0]] ||= []).push({ content: esc(T(t).title), callback: () => addAt(t, pos) });
      title = "畫布";
      items.push({
        content: "新增節點", has_submenu: true,
        submenu: { title: "新增節點", options: Object.entries(cats).map(([c, list]) => ({ content: esc(CAT_ZH[c] || c), has_submenu: true, submenu: { title: esc(CAT_ZH[c] || c), options: list } })) },
      });
      items.push({ content: "新增群組", callback: () => { const gr = group(lgc.graph, "新群組", C.c6); gr.pos = pos; gr.size = [260, 160]; dirty(); } });
      items.push({ content: "置中檢視", callback: () => api.fit() });
      if (lgc.graph._is_subgraph) items.push({ content: "返回上一層", callback: () => lgc.closeSubgraph() });
      const gr = lgc.graph.getGroupOnPos(pos[0], pos[1]);
      if (gr) {
        items.push(null,
          { content: `重新命名群組「${esc(gr.title)}」`, callback: (v, o, ev) => { lgc.prompt("群組名稱", gr.title, (t) => { gr.title = t; dirty(); }, ev); } },
          { content: "群組顏色", has_submenu: true, submenu: { title: "群組顏色", options: GROUP_COLORS.map(([n, c]) => ({ content: `<span style="color:${c}">●</span> ${n}`, callback: () => { gr.color = c; dirty(); } })) } },
          { content: "刪除群組（保留節點）", callback: () => { lgc.graph.remove(gr); dirty(); } });
      }
    }
    new LiteGraph.ContextMenu(items, { event: e, title }, window);
  };
  lgc.showLinkMenu = function (link, e) {
    new LiteGraph.ContextMenu([{ content: "刪除連線", callback: () => { lgc.graph.removeLink(link.id); dirty(); } }], { event: e, title: `連線（${esc(typeZh(link.type))}）` }, window);

  };

  lgc.drawSubgraphPanel = () => {};

  lgc.onSearchBox = (helper, str) => {
    const q = str.trim().toLowerCase();
    return addable().filter((t) => !q || T(t).title.toLowerCase().includes(q) || t.toLowerCase().includes(q)).map((t) => `${T(t).title}　${t}`);
  };
  lgc.onSearchBoxSelection = (name, ev, gc) => addAt(name.split("　").pop(), gc.convertEventToCanvasOffset(ev));
  const keepIn = (d, W, H) => {
    const left = parseFloat(d.style.left) || 0, top = parseFloat(d.style.top) || 0;
    d.style.left = `${clamp(left, 6, Math.max(6, W - d.offsetWidth - 6))}px`;
    d.style.top = `${clamp(top, 6, Math.max(6, H - Math.max(d.offsetHeight, 60) - 6))}px`;
  };
  const showSearch0 = lgc.showSearchBox;
  lgc.showSearchBox = function (ev, opts) {
    const d = showSearch0.call(this, ev, opts);
    if (d) {
      d.querySelector(".name").textContent = "搜尋節點";
      d.querySelector("input").placeholder = "輸入中文名稱或型別";
      keepIn(d, innerWidth, innerHeight - 250);
    }
    return d;
  };
  const prompt0 = lgc.prompt;
  lgc.prompt = function (title, value, cb, ev, multi) {
    const d = prompt0.call(this, title === "Value" ? "輸入新值" : title, value, cb, ev, multi);
    const btn = d.querySelector("button");
    if (btn) btn.textContent = "確定";
    keepIn(d, host.clientWidth, host.clientHeight);
    return d;
  };

  // Layout variants per graph: pick the one that fits largest, until the user moves things.
  const places = new Map(), sigs = new Map();
  const fit = () => fitView(lgc, view);
  const layout = () => {
    const g = lgc.graph, vs = places.get(g);
    if (vs && (!sigs.has(g) || sigs.get(g) === sigOf(g))) {
      const W = lgc.canvas.width - 2 * (view.pad ?? 16), H = lgc.canvas.height - (view.top ?? 14) - (view.bot ?? 44);
      let best = 0, bestS = -1;
      vs.forEach((fn, i) => {
        fn();
        const b = bounds(g);
        const s = b ? Math.min(view.max ?? 1.15, W / b[2], H / b[3]) : 1;
        if (s > bestS * 1.02) { best = i; bestS = s; }
      });
      vs[best]();
      sigs.set(g, sigOf(g));
    }
    fit();
  };
  lgc.openSubgraph = function (g) { LGraphCanvas.prototype.openSubgraph.call(this, g); onNav && onNav(); layout(); };
  lgc.closeSubgraph = function () {
    if (!this._graph_stack || !this._graph_stack.length) return;
    LGraphCanvas.prototype.closeSubgraph.call(this);
    onNav && onNav();
    layout();
  };

  lgc.resize(host.clientWidth, host.clientHeight);
  onBox(ctx, host, (w, hh) => { lgc.resize(w, hh); layout(); });

  ctx.onCleanup(() => {
    graph.stop();
    lgc.stopRendering();
    // LGraphCanvas.unbindEvents() leaves these document listeners behind
    document.removeEventListener("keyup", lgc._key_callback, true);
    LiteGraph.pointerListenerRemove(document, "move", lgc._mousemove_callback, true);
    LiteGraph.pointerListenerRemove(document, "up", lgc._mouseup_callback, true);
    try { lgc.unbindEvents(); } catch (err) { console.warn("unbindEvents", err); }
    LiteGraph.closeAllContextMenus(window);
    document.querySelectorAll(".litesearchbox, .graphdialog").forEach((d) => d.remove());
    document.body.style.overflow = bodyOverflow;
    if (LGraphCanvas.active_canvas === lgc) LGraphCanvas.active_canvas = null;
    cv.remove();
  });

  const api = {
    graph, lgc, fit, layout,
    plan(fns, g = graph) { places.set(g, fns); sigs.delete(g); },
    free(g = graph) { places.delete(g); sigs.delete(g); },
  };
  return api;
}

// Drives graph.start(0) (one runStep per animation frame) and times each step.
function live(ctx, graph, lgc) {
  const st = { ms: 0, steps: 0, running: false };
  let t0 = 0, raf = 0;
  graph.onBeforeStep = () => { t0 = performance.now(); TNOW = t0 / 1000; };
  graph.onAfterStep = () => {
    const d = performance.now() - t0;
    st.ms = st.ms ? st.ms * 0.9 + d * 0.1 : d;
    st.steps++;
    lgc.setDirty(true, false);
  };
  st.stop = () => { cancelAnimationFrame(raf); graph.stop(); st.running = false; };
  st.start = () => {
    st.stop();
    raf = requestAnimationFrame(() => { if (ctx.active) { graph.start(0); st.running = true; } });
  };
  ctx.onCleanup(st.stop);
  return st;
}

    desc: "連接埠都帶型別：數值、布林、字串，以及自訂的「色票」。拖線時只有相容的連接埠會亮起，程式呼叫 connect() 接錯型別會直接回傳 null。控制面板用了六種內建小工具（滑桿、數字、下拉、開關、文字、按鈕），每個都用 options.property 綁定到節點屬性；配色計算把色相與配色方式變成色票陣列，再經明暗調整畫成色票卡。",
    hint: "拖「色相」滑桿、點「隨機色相」・點「標籤」文字框可改名・「試接錯誤型別」看拒絕結果",
    mount(ctx) {
      ctx.html(`<div class="lg-fill"><div class="lg-box"></div></div>`);
      const box = ctx.$(".lg-box");
      const api = makeGraph(ctx, box);
      const { graph, lgc } = api;
      const panel = add(graph, "色彩/控制面板");
      const calc = add(graph, "色彩/配色計算");
      const knob = add(graph, "widget/knob", { title: "亮度", props: { min: 20, max: 80, value: 55, precision: 0, color: C.c1 } });
      const shade = add(graph, "色彩/明暗調整");
      const sw = add(graph, "色彩/色票");
      const watch = add(graph, "basic/watch");
      panel.connect(0, calc, 0); panel.connect(1, calc, 1); panel.connect(2, calc, 2);
      calc.connect(0, shade, 0); knob.connect(0, shade, 1);
      shade.connect(0, sw, 0); panel.connect(3, sw, 1); panel.connect(4, sw, 2);
      panel.connect(2, watch, 0);
      api.plan([
        () => place([[panel, 0, 30], [calc, 260, 30], [knob, 270, 170], [shade, 360, 180], [sw, 570, 30], [watch, 570, 240]]),
        () => place([[panel, 0, 30], [calc, 250, 30], [knob, 270, 150], [shade, 250, 270], [sw, 0, 330], [watch, 270, 380]]),
      ]);
      api.layout();
      const run = live(ctx, graph, lgc);
      run.start();
      const bd = badge(box);
      const base = legend([[C.c2, "數值"], [C.c4, "布林"], [C.c6, "字串"], [C.c3, "色票"]]);
      bd.innerHTML = base + "・拖線時只會接到相容的連接埠";
      let msgT = 0;
      ctx.button("試接錯誤型別", () => {
        const link = panel.connect(3, calc, 0);
        clearTimeout(msgT);
        bd.innerHTML = base + (link
          ? `・<span class="msg ok">意外接上了</span>`
          : `・<span class="msg">connect() 回傳 null：布林 → 數值被 isValidConnection() 拒絕</span>`);
        msgT = ctx.timeout(() => { bd.innerHTML = base + "・拖線時只會接到相容的連接埠"; }, 4000);
      });
      ctx.toggle("展示模式", false, (v) => { lgc.live_mode = v; lgc.setDirty(true, true); });
    },
  },
  {
    id: "canvas", title: "畫布與群組",
    api: "LGraphGroup・ds.changeScale()・links_render_mode・render_execution_order",
    desc: "LGraphCanvas 把縮放與平移交給 DragAndScale（ds），滾輪縮放、拖曳空白處平移；縮放低於 60% 時改用低畫質模式，只畫方塊不畫文字與接點。LGraphGroup 是畫在背景的區塊，拖曳群組標題會連同框內節點一起移動，右下角可調大小。連線可切成曲線、折線或直線，也能把每個節點的執行順序編號畫出來。",
    hint: "滾輪縮放、拖空白處平移・拖曳群組標題整組移動・右鍵群組可改名、換色",
    mount(ctx) {
      ctx.html(`<div class="lg-fill"><div class="lg-box"></div></div>`);
      const box = ctx.$(".lg-box");
      const api = makeGraph(ctx, box, { min: 0.45 });
      const { graph, lgc } = api;
      const time = add(graph, "basic/time");
      const k = add(graph, "basic/const", { props: { value: 2 } });
      const rand = add(graph, "math/rand", { props: { min: -1, max: 1 }, size: [110, 30] });
      const op = add(graph, "math/operation", { props: { OP: "*" }, size: [120, 60] });
      const trig = add(graph, "math/trigonometry");
      const lerp = add(graph, "math/lerp", { props: { f: 0.2 } });
      const watch = add(graph, "basic/watch");
      const prog = add(graph, "widget/progress", { props: { min: -1, max: 1, color: C.c4 } });
      const plot = add(graph, "graphics/plot");
      time.connect(1, op, 0); k.connect(0, op, 1); op.connect(0, trig, 0);
      trig.connect(0, lerp, 0); rand.connect(0, lerp, 1);
      lerp.connect(0, watch, 0); trig.connect(0, prog, 0); trig.connect(0, plot, 0); lerp.connect(0, plot, 1);
      const gIn = group(graph, "輸入", C.c2), gOp = group(graph, "運算", C.c5), gOut = group(graph, "輸出", C.c4);
      const wrapAll = () => { wrap(gIn, [time, k, rand]); wrap(gOp, [op, trig, lerp]); wrap(gOut, [watch, prog, plot]); };
      api.plan([
        () => { place([[time, 10, 70], [k, 10, 160], [rand, 10, 230], [op, 260, 70], [trig, 260, 170], [lerp, 260, 240],
          [watch, 470, 70], [prog, 470, 140], [plot, 470, 210, [200, 110]]]); wrapAll(); },
        () => { place([[time, 10, 70], [k, 10, 160], [rand, 10, 230], [op, 240, 70], [trig, 240, 170], [lerp, 240, 240],
          [watch, 10, 370], [prog, 180, 370], [plot, 10, 440, [310, 100]]]); wrapAll(); },
      ]);
      api.layout();
      const run = live(ctx, graph, lgc);
      run.start();

      ctx.group(["曲線", "折線", "直線"], 0, (i) => {
        lgc.links_render_mode = [LiteGraph.SPLINE_LINK, LiteGraph.LINEAR_LINK, LiteGraph.STRAIGHT_LINK][i];
        lgc.setDirty(true, true);
      });
      ctx.group(["全覽", "100%", "200%"], 0, (i) => {
        if (i === 0) { api.fit(); return; }
        lgc.ds.changeScale(i, [lgc.canvas.width / 2, lgc.canvas.height / 2]);
        lgc.setDirty(true, true);
      });
      ctx.toggle("執行順序", false, (v) => { lgc.render_execution_order = v; lgc.setDirty(true, true); });
      ctx.toggle("收合節點", false, (v) => {
        for (const n of graph._nodes) if (!!n.flags.collapsed !== v) n.collapse(true);
        lgc.setDirty(true, true);
      });
      const bd = badge(box);
      const paint = () => {
        const s = lgc.ds.scale;
        bd.innerHTML = `縮放 <b>${Math.round(s * 100)}%</b>・可見 <b>${(lgc.visible_nodes || []).length}</b> / ${graph._nodes.length} 節點・<b>${graph._groups.length}</b> 個群組` +
          (s < 0.6 ? `・<span class="lq">低畫質模式（縮放 &lt; 60%）</span>` : "・拖曳群組標題會連同節點一起移動");
      };
      paint();
      ctx.interval(paint, 250);
    },
  },
  {
    id: "serialize", title: "序列化與還原",
    api: "graph.serialize()・graph.configure()・LGraphNode.onConfigure()",
    desc: "graph.serialize() 把節點、連線、群組與每個節點的 properties 輸出成純 JSON；graph.configure() 依 type 重新 createNode() 再還原屬性與連線。右側即時顯示目前的 JSON，可以直接改數字（例如振幅或座標）再按「套用 JSON」。先存快照、把圖改亂或清空，再還原，就能看到整張圖連同小工具的值一起回來；套用前會先檢查未註冊的型別。",
    hint: "改右側 JSON 後按「套用 JSON」・存快照後隨意刪節點、拉線，再按「還原快照」",
    mount(ctx) {
      ctx.html(`<div class="lg-fill duo"><div class="lg-box"></div>
        <div class="lg-side"><header><code>graph.serialize()</code> <small></small></header><textarea class="lg-json" spellcheck="false" aria-label="圖形 JSON"></textarea><footer><span></span></footer></div></div>`);
      const box = ctx.$(".lg-box"), ta = ctx.$(".lg-json"), foot = ctx.$(".lg-side footer span"), head = ctx.$(".lg-side header small");
      const api = makeGraph(ctx, box);
      const { graph, lgc } = api;
      const run = live(ctx, graph, lgc);
      let snap = null, dirty = false;

      const build = () => {
        graph.clear();
        const o1 = add(graph, "訊號/振盪器", { props: { wave: "正弦", freq: 0.5, amp: 1 } });
        const o2 = add(graph, "訊號/振盪器", { props: { wave: "三角", freq: 1.2, amp: 0.6 } });
        const mix = add(graph, "訊號/混合器", { props: { op: "相加" } });
        const gauge = add(graph, "訊號/數值錶");
        o1.connect(0, mix, 0); o2.connect(0, mix, 1); mix.connect(0, gauge, 0);
        const gr = group(graph, "訊號源", C.c1);
        api.plan([
          () => { place([[o1, 20, 70], [o2, 20, 270], [mix, 280, 180], [gauge, 500, 170]]); wrap(gr, [o1, o2]); },
          () => { place([[o1, 20, 70], [o2, 250, 70], [mix, 20, 280], [gauge, 250, 270]]); wrap(gr, [o1, o2]); },
        ]);
        api.layout();
        run.start();
      };
      const status = (text, err = false) => { foot.textContent = text; foot.className = err ? "err" : ""; };
      const refresh = (force = false) => {
        if (!force && (dirty || document.activeElement === ta)) return;
        const json = JSON.stringify(graph.serialize(), null, 1);
        if (json !== ta.value) { const st = ta.scrollTop; ta.value = json; ta.scrollTop = st; }
        head.textContent = `${(json.length / 1024).toFixed(1)} KB`;
        dirty = false;
      };
      const apply = (data, label) => {
        const unknown = (data.nodes || []).map((n) => n.type).filter((t) => !LiteGraph.registered_node_types[t]);
        if (unknown.length) throw new Error(`未註冊的型別：${[...new Set(unknown)].join("、")}`);
        api.free();
        graph.configure(data);
        api.fit();
        run.start();
        refresh(true);
        status(`${label}：${graph._nodes.length} 節點、${linkCount(graph)} 連線`);
      };
      ta.addEventListener("input", () => { dirty = true; status("已修改，按「套用 JSON」生效"); });
      ta.addEventListener("blur", () => { if (!dirty) refresh(); });

      ctx.button("存快照", () => {
        snap = JSON.parse(JSON.stringify(graph.serialize()));
        const d = new Date();
        status(`快照已存：${snap.nodes.length} 節點（${d.toLocaleTimeString("zh-TW", { hour12: false })}）`);
      }, { primary: true });
      ctx.button("還原快照", () => {
        if (!snap) { status("還沒有快照，請先按「存快照」", true); return; }
        apply(JSON.parse(JSON.stringify(snap)), "已還原快照");
      });
      ctx.button("清空", () => { api.free(); graph.clear(); api.fit(); refresh(true); status("已清空，可用「還原快照」或「重建範例」"); });
      ctx.button("重建範例", () => { build(); refresh(true); status("已重建範例"); });
      ctx.button("套用 JSON", () => {
        let data;
        try { data = JSON.parse(ta.value); } catch (e) { status(`JSON 格式錯誤：${e.message}`, true); return; }
        try { apply(data, "已套用 JSON"); } catch (e) { status(e.message, true); }
      });

      build();
      refresh(true);
      status(`${graph._nodes.length} 節點、${linkCount(graph)} 連線、${graph._groups.length} 個群組`);
      ctx.interval(() => refresh(), 800);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "graph.configure()・runStep()・LGraphCanvas.draw()",
    desc: "把 N 個「鏈節」節點（每 16 個串成一條鏈）用 configure() 一次載入，graph.start(0) 每個畫格跑一次 runStep()，畫布同時重畫所有可見節點。逐級加大節點數直到 FPS 掉到 30 以下，同時記錄單步 runStep、單次繪製與 configure() 的耗時。可切換全覽（所有節點都在畫面上，縮放很小時是低畫質模式）或局部 100%（只畫看得到的少數節點）。",
    hint: "按「自動加壓」逐級測試・切「局部 100%」比較只畫可見節點時的差異",
    mount(ctx) {
      ctx.html(`<div class="lg-stress"><div class="lg-box"></div></div>`);
      ctx.controls.classList.add("bottom");
      const box = ctx.$(".lg-box");
      const maxNodes = LiteGraph.MAX_NUMBER_OF_NODES;
      LiteGraph.MAX_NUMBER_OF_NODES = 20000;
      ctx.onCleanup(() => { LiteGraph.MAX_NUMBER_OF_NODES = maxNodes; });
      const api = makeGraph(ctx, box, { search: false, min: 0.002, max: 1, top: 10, bot: 10, pad: 10 });
      const { graph, lgc } = api;
      lgc.ds.min_scale = 0.002;
      ctx.onCleanup(() => graph.clear());
      const run = live(ctx, graph, lgc);
      let overview = true, links = 0, cfgMs = 0, drawMs = 0;

      // Time only the draws that actually repaint something.
      const draw0 = lgc.draw;
      lgc.draw = function (fc, fb) {
        if (!(this.dirty_canvas || this.dirty_bgcanvas || fc || fb)) return draw0.call(this, fc, fb);
        const t = performance.now();
        draw0.call(this, fc, fb);
        const d = performance.now() - t;
        drawMs = drawMs ? drawMs * 0.85 + d * 0.15 : d;
      };

      // Chains of 16 nodes laid out in K columns so the whole set matches the box aspect.
      const chainJSON = (n, aspect) => {
        const L = 16, m = Math.ceil(n / L), K = Math.max(1, Math.round(Math.sqrt(aspect * m * 0.0256)));
        const nodes = [], ls = [];
        for (let i = 0; i < n; i++) {
          const c = Math.floor(i / L), j = i % L;
          nodes.push({ id: i + 1, type: "壓測/鏈節", pos: [(c % K) * 2500 + j * 150, Math.floor(c / K) * 64], size: [120, 26], flags: {}, order: i, mode: 0,
            inputs: [{ name: "", type: "number", link: null }], outputs: [{ name: "", type: "number", links: [] }], properties: {} });
          if (j) {
            const id = ls.length + 1;
            ls.push([id, i, 0, i + 1, 0, "number"]);
            nodes[i - 1].outputs[0].links.push(id);
            nodes[i].inputs[0].link = id;
          }
        }
        return { last_node_id: n, last_link_id: ls.length, nodes, links: ls, groups: [], config: {}, extra: {}, version: 0.4 };
      };
      const applyView = () => {
        if (overview) { api.fit(); return; }
        lgc.ds.scale = 1;
        lgc.ds.offset[0] = 20;
        lgc.ds.offset[1] = 40;
        lgc.setDirty(true, true);
      };
      ctx.group(["全覽", "局部 100%"], 0, (i) => { overview = i === 0; applyView(); });
      onBox(ctx, box, () => applyView());

      ctx.ramp({
        label: "節點", steps: [100, 200, 400, 800, 1600, 3200, 6400, 12800],
        async apply(n) {
          run.stop();
          graph.clear();
          await ctx.frame(1);
          const data = chainJSON(n, box.clientWidth / Math.max(1, box.clientHeight));
          links = data.links.length; // configure() rewrites data.links, so count first
          const t = performance.now();
          graph.configure(data);
          cfgMs = performance.now() - t;
          drawMs = 0;
          run.ms = 0;
          applyView();
          run.start();
        },
        metrics: () => ({
          "runStep": `${run.ms.toFixed(2)} ms`,
          "繪製": `${drawMs.toFixed(1)} ms`,
          "可見節點": (lgc.visible_nodes || []).length,
          "連線": links,
          "configure()": `${cfgMs.toFixed(0)} ms`,
        }),
        note: "每一級先用 graph.configure() 載入整份 JSON（耗時列在 configure()），之後每個畫格跑一次 runStep()：依執行順序呼叫每個節點的 onExecute()，所以 runStep 隨節點總數線性增加，與畫面上看到多少無關。繪製耗時則取決於可見節點數：全覽時縮放很小，LiteGraph 進入低畫質模式只畫方塊，但每個節點仍要逐一畫；切到局部 100% 只畫畫面內的少數節點，FPS 主要剩 runStep 的成本。LiteGraph 預設單張圖最多 1000 個節點（MAX_NUMBER_OF_NODES），本場景暫時調高到 2 萬。",
      });
    },
  },
] });
</script>
</body>
