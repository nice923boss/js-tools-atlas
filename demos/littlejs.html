<body>
<!-- LittleJS keeps the whole engine in module globals and allows one engineInit per window, so each scene runs it inside its own iframe (see ljsFrame). -->
<script src="_shared/showcase.js"></script>
<script>
// LittleJS showcase: eight scenes from the original space shooter to an EngineObject stress ramp.
const LJS = "https://cdn.jsdelivr.net/npm/littlejsengine@1.23.1/dist/littlejs.esm.min.js";
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim();
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim();

// Loads LittleJS as an ES module inside a srcdoc iframe. Removing the iframe on cleanup also stops its engine loop and audio.
function ljsFrame(ctx, host) {
  const f = document.createElement("iframe");
  f.title = "LittleJS 畫布";
  f.srcdoc = `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0e1013}</style></head>
<body><script type="module">import * as L from "${LJS}"; window.L = L;<\/script></body></html>`;
  host.append(f);
  ctx.onCleanup(() => f.remove());
  return new Promise((resolve, reject) => {
    f.addEventListener("load", () => {
      const win = f.contentWindow;
      if (!win || !win.L) return reject(new Error("LittleJS 無法從 CDN 載入"));
      resolve({ win, L: win.L });
    }, { once: true });
  });
}

// Keys pressed while focus is on the outer page are re-dispatched on the iframe document, where LittleJS listens.
function forwardKeys(ctx, win) {
  const fwd = (e) => {
    const t = e.target;
    if (t.closest && t.closest("input,select,textarea,[role=tab]")) return;
    if (t.closest && t.closest("button") && (e.code === "Space" || e.code === "Enter")) return;
    if (/^Arrow|^Space$/.test(e.code)) e.preventDefault();
    win.document.dispatchEvent(new win.KeyboardEvent(e.type, { code: e.code, key: e.key, bubbles: true }));
  };
  ctx.on(document, "keydown", fwd);
  ctx.on(document, "keyup", fwd);
}

async function boot(ctx, cls = "lj-wrap") {
  ctx.html(`<div class="${cls}"></div>`);
  const fr = await ljsFrame(ctx, ctx.$("." + cls));
  fr.L.setFontDefault(FONT);
  forwardKeys(ctx, fr.win);
  return fr;
}

// Pixel-art sheet drawn at runtime (8 tiles of 16 px) so the platform scene needs no image files.
function makeSheet() {
  const c = document.createElement("canvas");
  c.width = 128; c.height = 16;
  const g = c.getContext("2d");
  const px = (i, x, y, w, h, col) => { g.fillStyle = col; g.fillRect(i * 16 + x, y, w, h); };
  // 0 brick
  px(0, 0, 0, 16, 16, "#7a4636");
  for (let r = 0; r < 4; r++) {
    px(0, 0, r * 4 + 3, 16, 1, "#3d2019");
    for (let k = 0; k < 2; k++) px(0, ((r % 2 ? 0 : 4) + k * 8) % 16, r * 4, 1, 3, "#3d2019");
    px(0, 0, r * 4, 16, 1, "#94584a");
  }
  // 1 grass on dirt
  px(1, 0, 0, 16, 16, "#5c3b2b");
  [[3, 8], [10, 11], [6, 13], [13, 7]].forEach(([x, y]) => px(1, x, y, 2, 1, "#7a5240"));
  px(1, 0, 0, 16, 4, "#62c55c"); px(1, 0, 4, 16, 1, "#3d8a3a");
  [1, 5, 9, 13].forEach((x) => px(1, x, 4, 2, 2, "#62c55c"));
  px(1, 0, 0, 16, 1, "#a2e69c");
  // 2 crate
  px(2, 0, 0, 16, 16, "#b07a3c");
  px(2, 0, 0, 16, 2, "#6e4520"); px(2, 0, 14, 16, 2, "#6e4520"); px(2, 0, 0, 2, 16, "#6e4520"); px(2, 14, 0, 2, 16, "#6e4520");
  for (let i = 2; i < 14; i++) { px(2, i, i, 2, 1, "#6e4520"); px(2, 14 - i, i, 2, 1, "#6e4520"); }
  // 3 steel
  px(3, 0, 0, 16, 16, "#6d7a8a"); px(3, 0, 0, 16, 1, "#b2bfcc"); px(3, 0, 15, 16, 1, "#3a434e"); px(3, 15, 0, 1, 16, "#3a434e");
  [[2, 2], [12, 2], [2, 12], [12, 12]].forEach(([x, y]) => { px(3, x, y, 2, 2, "#d3dce5"); px(3, x + 1, y + 1, 1, 1, "#4a5562"); });
  // 4 and 5 hero walk frames (facing right)
  for (const f of [4, 5]) {
    px(f, 3, 2, 10, 9, "#4cc9f0"); px(f, 4, 1, 8, 1, "#4cc9f0"); px(f, 4, 2, 5, 1, "#a6e8fa");
    px(f, 8, 4, 5, 3, "#14212b"); px(f, 10, 5, 2, 1, "#ffffff");
    if (f === 4) { px(f, 4, 11, 3, 4, "#f72585"); px(f, 9, 11, 3, 4, "#f72585"); }
    else { px(f, 2, 11, 3, 3, "#f72585"); px(f, 10, 11, 4, 3, "#f72585"); }
  }
  // 6 bouncy ball
  g.fillStyle = "#f72585"; g.beginPath(); g.arc(104, 8, 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#ffd1e6"; g.fillRect(100, 4, 3, 2);
  g.fillStyle = "#b8165f"; g.fillRect(97, 8, 14, 1);
  // 7 coin
  g.fillStyle = "#c79a00"; g.beginPath(); g.arc(120, 8, 6.5, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#f7df1e"; g.beginPath(); g.arc(120, 8, 5, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#fff6b0"; g.fillRect(117, 5, 2, 4);
  return c.toDataURL();
}

Showcase.run({ scenes: [
  {
    id: "shooter", title: "星域守衛",
    api: "engineInit・EngineObject・addChild・particleEffect・Sound・postProcessBloom",
    desc: "原本的招牌小遊戲。戰機、子彈與三種敵機都是 EngineObject 子類別，只覆寫 update 與 render；尾焰是用 addChild 掛在戰機上的粒子發射器，爆炸是內建的 explosion 與 sparks 特效。整個畫面經過 postProcessBloom 光暈後製，分數用 drawTextScreen 畫在 2D 層，不受光暈影響。",
    hint: "點擊畫布或按任意鍵接手，拖曳或方向鍵移動；ZzFX 音效要在畫布內點擊才會解鎖，無頭環境聽不到",
    async mount(ctx) {
      const { L, win } = await boot(ctx);
      const { vec2, rgb, rand, clamp } = L;
      const C = { cyan: rgb(.3, .79, .94), yellow: rgb(.97, .87, .12), pink: rgb(.97, .15, .52), green: rgb(.48, .83, .54), orange: rgb(1, .55, .26), violet: rgb(.62, .55, 1), white: rgb(1, 1, 1) };
      const SFX = {
        shoot: new L.Sound([.25, .05, 980, .01, .02, .05, 2, 1.6, -18, , , , , , , , , .6]),
        boom: new L.Sound([1.1, .1, 70, .02, .18, .5, 4, 2.6, , , , , , 1.4, , .5, .1, .5, .15]),
        hurt: new L.Sound([1, .1, 260, .01, .08, .3, 3, 1.8, -6, , , , , 1.2, , .3]),
        hit: new L.Sound([.5, .1, 520, , .01, .05, 4, 1.4, , , , , , .6]),
      };
      const KINDS = {
        drone: { hp: 1, pts: 100, color: C.pink, size: 1.1 },
        dart: { hp: 1, pts: 150, color: C.green, size: 1 },
        saucer: { hp: 4, pts: 400, color: C.orange, size: 1.8 },
      };
      let mode = "demo", score = 0, best = 0, lives = 3, wave = 1, spawnT = 1, fireT = 0, overT = 0, invuln = 0, shake = 0, hw = 7.5;
      let ship = null, bloom = null, wantStart = false;
      const target = vec2(0, -8);
      const stars = Array.from({ length: 130 }, () => ({ x: rand(-1, 1), y: rand(-13, 13), z: rand(.15, 1) }));
      const sfx = (s, pos) => { if (mode === "play") s.play(pos); };

      class Shot extends L.EngineObject {
        constructor(pos, vel, hostile) {
          super(pos, hostile ? vec2(.45) : vec2(.16, .9));
          this.velocity = vel; this.hostile = hostile; this.renderOrder = hostile ? 3 : 2;
        }
        update() { if (Math.abs(this.pos.y) > 14 || Math.abs(this.pos.x) > hw + 2) this.destroy(); }
        render() {
          if (this.hostile) { L.drawCircle(this.pos, .45, C.pink); L.drawCircle(this.pos, .22, C.white); }
          else L.drawRect(this.pos, this.size, C.yellow);
        }
      }
      class Enemy extends L.EngineObject {
        constructor(kind) {
          const k = KINDS[kind];
          super(vec2(rand(-hw + 1.2, hw - 1.2), 13.5), vec2(k.size));
          Object.assign(this, { kind, k, hp: k.hp, x0: this.pos.x, ph: rand(6.28), fireT: rand(.8, 1.6), flash: 0, renderOrder: 1 });
        }
        update() {
          const t = this.getAliveTime(), p = this.pos;
          this.flash = Math.max(0, this.flash - L.timeDelta);
          if (this.kind === "drone") { p.y -= .07 + wave * .004; p.x = this.x0 + Math.sin(t * 2.4 + this.ph) * 2.2; }
          else if (this.kind === "dart") { p.y -= .1 + wave * .005; p.x += clamp(ship.pos.x - p.x, -.05, .05); }
          else {
            p.y -= p.y > 7 ? .05 : .012;
            p.x = this.x0 + Math.sin(t * .8 + this.ph) * 1.5;
            if ((this.fireT -= L.timeDelta) < 0 && p.y < 11 && mode !== "over") {
              this.fireT = 1.6;
              for (const dx of [-.06, 0, .06]) new Shot(p.add(vec2(0, -.8)), vec2(dx, -.17), true);
            }
          }
          if (p.y < -14) this.destroy();
        }
        render() {
          const p = this.pos, col = this.flash > 0 ? C.white : this.k.color;
          if (this.kind === "drone") {
            L.drawRegularPoly(p, vec2(1.1), 6, col, 0, undefined, L.time * 2 + this.ph);
            L.drawCircle(p, .42, rgb(.1, .05, .12));
            L.drawCircle(p, .2, C.white);
          } else if (this.kind === "dart") {
            L.drawPoly([vec2(0, -.6), vec2(.5, .45), vec2(0, .15), vec2(-.5, .45)], col, 0, undefined, p);
          } else {
            L.drawEllipse(p, vec2(.9, .32), col);
            L.drawCircle(p.add(vec2(0, .22)), .7, C.violet);
            for (let i = 0; i < this.hp; i++) L.drawRect(p.add(vec2(-.45 + i * .3, -.6)), vec2(.2, .1), C.white);
          }
        }
      }
      class Ship extends L.EngineObject {
        constructor() {
          super(vec2(0, -8), vec2(1.4));
          this.tilt = 0; this.renderOrder = 4;
          this.flame = L.particleEffect("trail", this.pos, { angle: Math.PI, speed: .07, emitConeAngle: .2, sizeStart: .45, particleTime: .3, emitRate: 90, hue: .45 });
          if (this.flame) this.addChild(this.flame, vec2(0, -.8), Math.PI);
        }
        update() {
          const p = this.pos, dx = target.x - p.x;
          p.x += dx * .2; p.y += (target.y - p.y) * .2;
          this.tilt = clamp(dx * .15, -.22, .22);
          if (this.flame) this.flame.emitRate = mode === "over" ? 0 : 90;
        }
        render() {
          if (mode === "over" || (invuln > 0 && (L.time * 12 | 0) % 2)) return;
          const p = this.pos, a = this.tilt;
          L.drawPoly([vec2(0, .8), vec2(.62, -.5), vec2(.24, -.32), vec2(0, -.52), vec2(-.24, -.32), vec2(-.62, -.5)], C.cyan, .05, C.white, p, a);
          L.drawCircle(p.add(vec2(0, .05)), .42, C.violet);
          L.drawCircle(p.add(vec2(.06, .12)), .14, C.white);
        }
      }

      const live = (T) => L.engineObjects.filter((o) => o instanceof T && !o.destroyed);
      function explode(pos, color, scale) {
        L.particleEffect("explosion", pos, { scale });
        L.particleEffect("sparks", pos, { emitTime: .08, emitRate: 400, colorStartA: color, colorStartB: C.white, scale });
        shake = Math.max(shake, .3 * scale);
      }
      function kill(e, scoring = true) {
        if (scoring) score += e.k.pts;
        explode(e.pos, e.k.color, e.kind === "saucer" ? 1.4 : .8);
        sfx(SFX.boom, e.pos);
        e.destroy();
      }
      function hurt() {
        explode(ship.pos, C.cyan, 1.1);
        sfx(SFX.hurt, ship.pos);
        invuln = 2;
        if (mode === "play" && --lives <= 0) { mode = "over"; overT = 3.2; best = Math.max(best, score); }
      }
      function reset(next) {
        for (const o of [...live(Shot), ...live(Enemy)]) o.destroy();
        Object.assign(target, { x: 0, y: -8 });
        ship.pos = vec2(0, -8);
        score = 0; lives = 3; wave = 1; spawnT = 1; invuln = 1.5; mode = next;
      }
      win.document.addEventListener("keydown", () => { if (mode !== "play") wantStart = true; });

      function update() {
        const W = L.mainCanvasSize.x, H = L.mainCanvasSize.y, scale = Math.min(H / 24, W / 15);
        L.setCameraScale(scale); hw = W / scale / 2;
        if (shake > .02) { L.setCameraPos(vec2(rand(-shake, shake), rand(-shake, shake))); shake *= .88; } else L.setCameraPos(vec2());
        if (mode !== "play" && (wantStart || L.mouseWasPressed(0))) reset("play");
        wantStart = false;
        if (mode === "over" && (overT -= L.timeDelta) <= 0) reset("demo");
        invuln = Math.max(0, invuln - L.timeDelta);
        for (const s of stars) { s.y -= s.z * (mode === "play" ? .13 : .09); if (s.y < -13) { s.y = 13; s.x = rand(-1, 1); } }

        const enemies = live(Enemy), shots = live(Shot);
        if (mode === "play") {
          const k = L.keyDirection();
          target.x += k.x * .32; target.y += k.y * .32;
          if (L.mouseIsDown(0)) { target.x = L.mousePos.x; target.y = L.mousePos.y + 1.2; }
        } else if (mode === "demo") {
          let foe = null;
          for (const e of enemies) if (e.pos.y > -6 && (!foe || e.pos.y < foe.pos.y)) foe = e;
          target.x = foe ? foe.pos.x : Math.sin(L.time * .7) * hw * .5; target.y = -8;
          for (const s of shots) if (s.hostile && s.pos.distance(ship.pos) < 2.4) target.x += ship.pos.x > s.pos.x ? 1.4 : -1.4;
        }
        target.x = clamp(target.x, -hw + .8, hw - .8); target.y = clamp(target.y, -11, 2);

        if (mode !== "over") {
          if ((spawnT -= L.timeDelta) < 0) {
            spawnT = Math.max(.55, 1.9 - wave * .12) * rand(.7, 1.2) * (mode === "demo" ? .6 : 1);
            const r = rand();
            new Enemy(r < Math.min(.3, .08 + wave * .03) ? "saucer" : r < .6 ? "drone" : "dart");
          }
          if ((fireT -= L.timeDelta) < 0) {
            fireT = .13;
            for (const dx of [-.32, .32]) new Shot(ship.pos.add(vec2(dx, .6)), vec2(0, .5), false);
            sfx(SFX.shoot, ship.pos);
          }
        }
        for (const s of shots) {
          if (s.destroyed) continue;
          if (s.hostile) { if (mode !== "over" && !invuln && s.pos.distance(ship.pos) < .7) { s.destroy(); hurt(); } continue; }
          for (const e of enemies) {
            if (e.destroyed || s.pos.distance(e.pos) > e.k.size * .55) continue;
            s.destroy(); e.hp--; e.flash = .08;
            if (e.hp <= 0) kill(e); else sfx(SFX.hit, e.pos);
            break;
          }
        }
        if (mode !== "over" && !invuln) {
          for (const e of enemies) if (!e.destroyed && e.pos.distance(ship.pos) < e.k.size * .5 + .5) { kill(e, false); hurt(); break; }
        }
        wave = 1 + Math.floor(score / 2500);
      }
      function render() {
        for (const s of stars) L.drawRect(vec2(s.x * hw, s.y), vec2(.05 + s.z * .07), rgb(.75, .85, 1, .2 + s.z * .55));
      }
      function hud() {
        const W = L.mainCanvasSize.x, H = L.mainCanvasSize.y, dim = rgb(1, 1, 1, .6);
        L.drawTextScreen("分數", vec2(18, 20), 13, dim, 0, undefined, "left", FONT);
        L.drawTextScreen(String(score), vec2(18, 44), 24, C.white, 0, undefined, "left", MONO);
        L.drawTextScreen("波次", vec2(W - 18, 20), 13, dim, 0, undefined, "right", FONT);
        L.drawTextScreen(String(wave), vec2(W - 18, 44), 24, C.yellow, 0, undefined, "right", MONO);
        for (let i = 0; i < (mode === "play" ? lives : 0); i++) {
          L.drawPoly([vec2(0, -9), vec2(7, 6), vec2(0, 3), vec2(-7, 6)], C.cyan, 0, undefined, vec2(26 + i * 20, 72), 0, false, true);
        }
        if (mode === "play") return;
        const cy = H * .42, big = Math.min(54, W / 7);
        L.drawRect(vec2(W / 2, cy + 6), vec2(W, big + 132), rgb(0, 0, 0, .55), 0, false, true);
        if (mode === "demo") {
          L.drawTextScreen("星域守衛", vec2(W / 2, cy - 30), big, C.cyan, 0, undefined, "center", FONT, "bold");
          L.drawTextScreen("擊落敵機、閃避彈幕，自動開火", vec2(W / 2, cy + 18), 16, rgb(1, 1, 1, .85), 0, undefined, "center", FONT);
          if ((L.time * 2 | 0) % 2 === 0) L.drawTextScreen("點擊畫布或按任意鍵開始（有音效）", vec2(W / 2, cy + 50), 15, C.yellow, 0, undefined, "center", FONT);
          if (best) L.drawTextScreen("最高分 " + best, vec2(W / 2, cy + 78), 13, dim, 0, undefined, "center", FONT);
        } else {
          L.drawTextScreen("任務結束", vec2(W / 2, cy - 22), big, C.pink, 0, undefined, "center", FONT, "bold");
          L.drawTextScreen(String(score), vec2(W / 2, cy + 30), 30, C.white, 0, undefined, "center", MONO);
          L.drawTextScreen("即將回到示範模式", vec2(W / 2, cy + 64), 13, dim, 0, undefined, "center", FONT);
        }
      }

      await L.engineInit(() => {
        L.setCanvasClearColor(rgb(.02, .03, .06));
        ship = new Ship();
        bloom = L.postProcessBloom(.45, 1.1, 6);
      }, update, () => {}, render, hud);
      ctx.button("重新開始", () => reset("play"), { primary: true });
      ctx.toggle("光暈", true, (v) => bloom && bloom.setShaderCode(v ? L.postProcessBloomShader(.45, 1.1, 6) : undefined));
    },
  },
  {
    id: "platform", title: "磚塊平台",
    api: "TileCollisionLayer・TileLayerData・setCollision・setGravity・ParallaxLayer",
    desc: "關卡是一張 TileCollisionLayer：同一張圖層同時存碰撞資料與 TileLayerData 外觀，物件呼叫 setCollision 後就會跟磚塊碰撞。主角、木箱、彈力球都交給引擎的 updatePhysics 處理重力、摩擦與反彈，木箱可以被推動。背景三層 ParallaxLayer 山脈依視差跟著攝影機捲動，圖塊是執行時用 canvas 畫出來的 16 像素圖集。",
    hint: "方向鍵／WASD 移動、上或空白鍵跳；點擊畫布格子放置或移除磚塊",
    async mount(ctx) {
      const { L, win } = await boot(ctx);
      const { vec2, rgb, hsl, clamp } = L;
      const LW = 72, LH = 26;
      let seed = 1, layer = null, hero = null, coins = 0, userActive = false, touched = false, autoT = 1.5, tossKind = 0, cam = vec2(8, 8);
      const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const props = [];
      const FR = [];
      const solidAt = (x, y) => layer.getCollisionData(vec2(Math.floor(x), Math.floor(y))) > 0;
      win.document.addEventListener("keydown", () => { userActive = touched = true; });

      class Hero extends L.EngineObject {
        constructor() {
          super(vec2(3.5, 9), vec2(.8, .9), FR[0]);
          this.setCollision(); this.dir = 1; this.groundT = 0; this.jumpT = 0; this.renderOrder = 3;
        }
        update() {
          const dt = L.timeDelta, ground = !!this.groundObject;
          const jumpKey = (f) => f("ArrowUp") || f("KeyW") || f("Space");
          let mx, held;
          if (userActive) {
            mx = L.keyDirection().x; held = jumpKey(L.keyIsDown);
            if (jumpKey(L.keyWasPressed)) this.jumpT = .12;
          } else {
            mx = this.dir; held = true;
            if (this.pos.x > LW - 4) this.dir = -1;

          const p = this.pos, v = this.velocity, bx = bounds.x - .15, by = bounds.y - .15;
          if (p.x < -bx) { p.x = -bx; v.x = Math.abs(v.x); } else if (p.x > bx) { p.x = bx; v.x = -Math.abs(v.x); }
          if (p.y < -by) { p.y = -by; v.y = Math.abs(v.y); } else if (p.y > by) { p.y = by; v.y = -Math.abs(v.y); }
        }
      }
      L.setEngineVariableStep(true);
      await L.engineInit(() => {
        L.setCanvasClearColor(L.rgb(.055, .063, .075));
        L.setGravity(vec2(0, -.004));
        L.setCameraScale(20);
      }, () => {
        t0 = performance.now();
        bounds = L.mainCanvasSize.scale(.5 / 20);
      }, () => { updMs = ema(updMs, performance.now() - t0); },
      () => { t0 = performance.now(); },
      () => { drawMs = ema(drawMs, performance.now() - t0); });

      ctx.controls.classList.add("bottom");
      ctx.toggle("碰撞偵測", true, (v) => { collide = v; for (const b of boxes) b.setCollision(v, v, false, false); });
      ctx.ramp({
        label: "物件", steps: [200, 400, 800, 1600, 3200, 6400, 12800, 25600],
        minFps: 30,
        apply(n) {
          while (boxes.length < n) boxes.push(new Box());
          while (boxes.length > n) boxes.pop().destroy();
        },
        metrics: () => ({
          "碰撞清單": L.engineObjectsCollide.length,
          "碰撞": collide ? "開啟" : "關閉",
          "更新": Showcase.fmtMs(updMs),
          "繪製": Showcase.fmtMs(drawMs),
        }),
        note: "瓶頸：碰撞開啟時，每個方塊的 updatePhysics 都會走訪整個 engineObjectsCollide 清單做 AABB 重疊測試，沒有空間分割，成本是 O(n²)；關閉後只剩速度積分、牆面反彈與 WebGL 批次繪製，上限高出許多。",
      });
    },
  },
] });
</script>
</body>
</html>
