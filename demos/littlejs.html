<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LittleJS 示範：星域守衛</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":["audio"]}</script>
<style>
  body { background: #07080d; }
  canvas { touch-action: none; }
  .overlay { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; pointer-events: none; transition: opacity .3s; }
  .overlay.hide { opacity: 0; }
  .overlay .card { text-align: center; padding: 16px 26px; margin: 0 16px; border-radius: 16px; background: rgba(7, 8, 13, .66); backdrop-filter: blur(3px); border: 1px solid var(--line); }
  .overlay h1 { margin: 0; font-size: clamp(28px, 7vw, 48px); letter-spacing: 4px;
    background: linear-gradient(90deg, var(--c2), var(--c6), var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .overlay p { margin: 6px 0 0; }
  .overlay .blink { color: var(--c1); animation: blink 1.2s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .25; } }
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="card">
    <h1 id="ov-title">星域守衛</h1>
    <p id="ov-sub">擊落敵機、閃避彈幕，自動開火</p>
    <p class="blink" id="ov-go">按任意鍵或點擊開始（有音效）</p>
  </div>
</div>
<div class="hint">滑鼠或手指拖曳移動戰機，方向鍵／WASD 也可以</div>

<script type="module">
// LittleJS space shooter: EngineObject subclasses, WebGL batched shapes, built-in particle effects,
// ZzFX sounds, bloom post process and camera shake.
import {
  engineInit, vec2, rgb, hsl, EngineObject, drawRect, drawPoly, drawCircle, drawTextScreen,
  keyIsDown, mouseIsDown, mouseWasPressed, mousePos, mousePosScreen, mainCanvasSize,
  setCameraScale, setCameraPos, setCanvasClearColor, particleEffect, Sound, postProcessBloom, rand, clamp, time,
} from "https://cdn.jsdelivr.net/npm/littlejsengine@1.23.1/dist/littlejs.esm.min.js";

const FONT = "Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif";
const $ = (id) => document.getElementById(id);
const C = {
  cyan: rgb(.3, .79, .94), yellow: rgb(.97, .87, .12), pink: rgb(.97, .15, .52),
  green: rgb(.48, .83, .54), orange: rgb(1, .55, .26), violet: rgb(.62, .55, 1), white: rgb(1, 1, 1),
};

// ZzFX sound arrays, played by the engine's Sound class
const sfx = {
  shoot: new Sound([.25, .05, 980, .01, .02, .05, 2, 1.6, -18, , , , , , , , , .6]),
  boom: new Sound([1.1, .1, 70, .02, .18, .5, 4, 2.6, , , , , , 1.4, , .5, .1, .5, .15]),
  hurt: new Sound([1, .1, 260, .01, .08, .3, 3, 1.8, -6, , , , , 1.2, , .3]),
  hit: new Sound([.5, .1, 520, , .01, .05, 4, 1.4, , , , , , .6]),
};

let mode = "title"; // title | play | over
let overAt = 0, anyKey = false, usingMouse = false, lastMouse = vec2();
let score = 0, lives = 3, wave = 1, invuln = 0, shake = 0;
let fireTimer = 0, spawnTimer = 0, hw = 10;
const VIEW_H = 24;
let player, thruster;
const enemies = [], shots = [], bombs = [];
const stars = Array.from({ length: 130 }, () => ({ x: rand(-1, 1), y: rand(-12, 12), z: rand(.2, 1) }));

class Ship extends EngineObject {
  constructor() { super(vec2(0, -8), vec2(1.4)); this.target = this.pos.copy(); }
  update() {
    this.pos = this.pos.lerp(this.target, .2);
    this.pos.x = clamp(this.pos.x, -hw + .8, hw - .8);
    this.pos.y = clamp(this.pos.y, -11, 2);
  }
  render() {
    if (mode === "over" || (invuln > 0 && (time * 12 | 0) % 2)) return;
    const p = this.pos, tilt = clamp((this.target.x - p.x) * .25, -.35, .35);
    drawPoly([vec2(0, -.55), vec2(.18, -.95 - Math.sin(time * 40) * .2), vec2(-.18, -.95)], C.orange, 0, C.orange, p);
    drawPoly([vec2(0, .95), vec2(.35, -.05), vec2(.8, -.55), vec2(.2, -.45), vec2(0, -.62), vec2(-.2, -.45), vec2(-.8, -.55), vec2(-.35, -.05)],
      C.cyan, 0, C.cyan, p, tilt);
    drawPoly([vec2(0, .5), vec2(.14, .08), vec2(0, -.12), vec2(-.14, .08)], C.white, 0, C.white, p, tilt);
  }
}

class Shot extends EngineObject {
  constructor(pos, vel, color, hostile) {
    super(pos, vec2(hostile ? .45 : .16, hostile ? .45 : .9));
    this.velocity = vel; this.color = color; this.hostile = hostile;
  }
  update() {
    super.update();
    if (Math.abs(this.pos.y) > 14 || Math.abs(this.pos.x) > hw + 2) this.destroy();
  }
  render() {
    if (this.hostile) {
      drawCircle(this.pos, .55, this.color.scale(1, .35));
      drawCircle(this.pos, .3, this.color);
    } else drawRect(this.pos, this.size, this.color);
  }
}

// three enemy kinds with different shapes, movement and toughness
const KINDS = {
  drone: { hp: 1, pts: 100, color: C.pink, size: 1.1 },
  dart: { hp: 1, pts: 150, color: C.green, size: 1 },
  saucer: { hp: 4, pts: 400, color: C.orange, size: 1.8 },
};
class Enemy extends EngineObject {
  constructor(kind, x) {
    const k = KINDS[kind];
    super(vec2(x, 13), vec2(k.size));
    this.kind = kind; this.hp = k.hp; this.color = k.color.copy(); this.base = x; this.t = rand(9); this.flash = 0;
    this.velocity = vec2(0, kind === "saucer" ? -.03 : kind === "dart" ? -.09 : -.05);
    this.fire = rand(1, 2.5);
  }
  update() {
    this.t += 1 / 60;
    if (this.kind === "drone") this.pos.x = this.base + Math.sin(this.t * 2) * 2.4;
    if (this.kind === "dart") this.velocity.x = clamp((player.pos.x - this.pos.x) * .01, -.06, .06);
    if (this.kind === "saucer") { this.pos.x = this.base + Math.sin(this.t * .9) * 3; if (this.pos.y < 7) this.velocity.y *= .97; }
    super.update();
    this.flash = Math.max(0, this.flash - 1 / 15);
    if (this.kind !== "dart" && (this.fire -= 1 / 60) < 0 && this.pos.y < 11) {
      this.fire = this.kind === "saucer" ? 1.1 : rand(2.5, 4.5);
      const dir = player.pos.subtract(this.pos).normalize(.12);
      if (this.kind === "saucer") for (const a of [-.25, 0, .25]) bombs.push(new Shot(this.pos.copy(), dir.rotate(a), C.violet, true));
      else bombs.push(new Shot(this.pos.copy(), dir, C.pink, true));
    }
    if (this.pos.y < -14) this.destroy();
  }
  render() {
    const p = this.pos, s = this.size.x, col = this.flash > 0 ? C.white : this.color, t = this.t;
    if (this.kind === "drone") {
      drawPoly([vec2(0, .55), vec2(.55, 0), vec2(0, -.55), vec2(-.55, 0)].map((v) => v.scale(s)), col, 0, col, p, t * 2);
      drawCircle(p, s * .35, rgb(.1, .05, .12));
    } else if (this.kind === "dart") {
      drawPoly([vec2(0, -.6), vec2(.5, .5), vec2(0, .2), vec2(-.5, .5)].map((v) => v.scale(s)), col, 0, col, p);
    } else {
      drawRect(p.add(vec2(0, -.05)), vec2(s, s * .32), col);
      drawCircle(p.add(vec2(0, .12)), s * .45, this.flash > 0 ? C.white : C.yellow);
      for (let i = 0; i < 4; i++) drawCircle(p.add(vec2(-.6 + i * .4, -.1)), .14, (t * 6 | 0) % 4 === i ? C.white : rgb(.2, .1, .05));
    }
  }
}

function clearAll() {
  for (const list of [enemies, shots, bombs]) { list.forEach((o) => o.destroy()); list.length = 0; }
}

function overlay(title, sub, go) {
  $("ov-title").textContent = title; $("ov-sub").textContent = sub; $("ov-go").textContent = go;
  $("overlay").classList.remove("hide");
}

function start() {
  clearAll();
  mode = "play"; score = 0; lives = 3; wave = 1; invuln = 1.5; spawnTimer = 1;
  player.pos = vec2(0, -8); player.target = player.pos.copy();
  $("overlay").classList.add("hide");
}

function explode(pos, color, big) {
  const e = particleEffect("explosion", pos, { scale: big ? 2 : 1.1 });
  particleEffect("sparks", pos, { emitTime: .08, emitRate: big ? 600 : 300, colorStartA: color, colorStartB: C.white });
  shake = Math.max(shake, big ? .6 : .25);
  return e;
}

function hurtPlayer() {
  if (mode !== "play" || invuln > 0) return;
  lives--; invuln = 2; shake = 1;
  explode(player.pos, C.cyan, true);
  sfx.hurt.play();
  if (lives <= 0) {
    mode = "over"; overAt = time;
    overlay("任務失敗", `分數 ${score}，撐到第 ${wave} 波`, "按任意鍵或點擊再玩一次");
  }
}

function spawnWave() {
  const r = Math.random(), x = rand(-hw + 2, hw - 2);
  if (wave > 1 && r < .18) enemies.push(new Enemy("saucer", clamp(x, -hw + 3, hw - 3)));
  else if (r < .5) enemies.push(new Enemy("dart", x));
  else for (let i = 0; i < 3; i++) setTimeout(() => mode !== "over" && enemies.push(new Enemy("drone", x)), i * 260);
}

function gameInit() {
  setCanvasClearColor(rgb(.027, .031, .05));
  postProcessBloom(.45, 1.1, 6);
  player = new Ship();
  thruster = particleEffect("trail", player.pos, { angle: Math.PI, speed: .07, emitConeAngle: .2, sizeStart: .45, particleTime: .3, emitRate: 90, hue: .45 });
  addEventListener("keydown", () => { anyKey = true; });
}

function gameUpdate() {
  // resize: keep 24 world units tall, narrower screens zoom out to stay playable
  const scale = Math.min(mainCanvasSize.y / VIEW_H, mainCanvasSize.x / 15);
  setCameraScale(scale);
  hw = mainCanvasSize.x / scale / 2;

  const pressed = mouseWasPressed(0) || anyKey;
  anyKey = false;
  if (mode !== "play" && pressed && (mode === "title" || time - overAt > .6)) start();

  // input: keyboard moves, pointer movement or drag takes over
  const kx = (keyIsDown("ArrowRight") || keyIsDown("KeyD") ? 1 : 0) - (keyIsDown("ArrowLeft") || keyIsDown("KeyA") ? 1 : 0);
  const ky = (keyIsDown("ArrowUp") || keyIsDown("KeyW") ? 1 : 0) - (keyIsDown("ArrowDown") || keyIsDown("KeyS") ? 1 : 0);
  if (kx || ky) usingMouse = false;
  if (mousePosScreen.distance(lastMouse) > 1 || mouseIsDown(0)) usingMouse = true;
  lastMouse = mousePosScreen.copy();

  if (mode === "play") {
    if (usingMouse) player.target = mousePos.add(vec2(0, 1.2));
    else player.target = player.pos.add(vec2(kx, ky).scale(.42));
  } else if (mode === "title") {
    // attract mode: autopilot chases the lowest enemy and weaves away from shots
    const prey = enemies.reduce((a, e) => (!a || e.pos.y < a.pos.y ? e : a), null);
    const danger = bombs.find((b) => b.pos.distance(player.pos) < 2.4);
    let tx = prey ? prey.pos.x : Math.sin(time) * hw * .5;
    if (danger) tx = player.pos.x + (player.pos.x > danger.pos.x ? 3 : -3);
    player.target = vec2(tx, -8 + Math.sin(time * 1.3) * 1.2);
  }

  // auto fire
  if (mode !== "over" && (fireTimer -= 1 / 60) < 0) {
    fireTimer = .13;
    for (const dx of [-.32, .32]) shots.push(new Shot(player.pos.add(vec2(dx, .7)), vec2(0, .55), C.yellow, false));
    if (mode === "play") sfx.shoot.play();
  }

  // spawning ramps up with time
  if ((spawnTimer -= 1 / 60) < 0) {
    spawnWave();
    spawnTimer = Math.max(.55, 1.9 - wave * .12) * rand(.7, 1.2);
  }
  if (mode === "play") wave = 1 + Math.floor(score / 2500);

  // collisions
  for (const s of shots) {
    if (s.destroyed) continue;
    for (const e of enemies) {
      if (e.destroyed || s.pos.distance(e.pos) > e.size.x * .55) continue;
      s.destroy(); e.hp--; e.flash = 1;
      particleEffect("hit", s.pos, { scale: .6 });
      if (e.hp <= 0) {
        explode(e.pos, e.color, e.kind === "saucer");
        e.destroy();
        if (mode === "play") { score += KINDS[e.kind].pts; sfx.boom.play(); }
      } else if (mode === "play") sfx.hit.play();
      break;
    }
  }
  for (const b of bombs) if (!b.destroyed && b.pos.distance(player.pos) < .6) { b.destroy(); hurtPlayer(); }
  for (const e of enemies) if (!e.destroyed && e.pos.distance(player.pos) < e.size.x * .5 + .4) {
    if (mode === "play" && invuln <= 0) { explode(e.pos, e.color, false); e.destroy(); }
    hurtPlayer();
  }
  for (const list of [enemies, shots, bombs]) for (let i = list.length - 1; i >= 0; i--) if (list[i].destroyed) list.splice(i, 1);

  invuln = Math.max(0, invuln - 1 / 60);
  shake *= .88;
  setCameraPos(vec2(rand(-shake, shake), rand(-shake, shake)));
  thruster.pos = player.pos.add(vec2(0, -.7));
  thruster.emitRate = mode === "over" ? 0 : 90;
}

function gameRender() {
  // parallax starfield
  for (const s of stars) {
    s.y -= s.z * .12;
    if (s.y < -12.5) { s.y = 12.5; s.x = rand(-1, 1); }
    drawRect(vec2(s.x * hw, s.y), vec2(.05 + s.z * .05, .08 + s.z * .2), rgb(.6, .7, 1, .25 + s.z * .6));
  }
}

function gameRenderPost() {
  const w = mainCanvasSize.x, sz = w < 500 ? 16 : 20;
  if (mode === "title") {
    drawTextScreen("展示模式", vec2(16, 26), sz, C.violet, 0, C.white, "left", FONT, "bold");
    return;
  }
  drawTextScreen(`分數 ${score}`, vec2(16, 26), sz, C.yellow, 0, C.white, "left", FONT, "bold");
  drawTextScreen(`第 ${wave} 波`, vec2(16, 26 + sz * 1.3), sz * .8, rgb(.8, .8, .85), 0, C.white, "left", FONT, "bold");
  drawTextScreen("♥".repeat(Math.max(0, lives)), vec2(w - 16, 26), sz, C.pink, 0, C.white, "right", FONT, "bold");
}

engineInit(gameInit, gameUpdate, () => {}, gameRender, gameRenderPost);
</script>
</body>
</html>
