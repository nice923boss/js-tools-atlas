<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>localForage 示範：會記得的便利貼</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"資料存在瀏覽器本機，重新整理後仍在"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  .board { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; padding: 14px 16px 50px; min-height: 0;
    background: radial-gradient(circle at 1px 1px, rgba(0,0,0,.08) 1px, transparent 0) 0 0 / 18px 18px, var(--bg); }
  .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .head h1 { font-size: 17px; margin: 0; margin-right: auto; }
  .chip { font: 12px var(--mono); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); }
  .chip b { color: var(--c5); }
  .settings { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .settings .sw { width: 20px; height: 20px; border-radius: 6px; border: 1px solid rgba(0,0,0,.15); cursor: pointer; padding: 0; }
  .settings .sw[aria-pressed="true"] { outline: 2px solid var(--fg); outline-offset: 1px; }
  .settings input[type="range"] { width: 80px; accent-color: var(--c5); }
  .settings .saved { margin-left: auto; color: var(--c4); opacity: 0; transition: opacity .3s; }
  .settings .saved.show { opacity: 1; }
  .notes { overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; align-content: start; padding: 4px 2px 8px; }
  .note { position: relative; border-radius: 4px 4px 14px 4px; padding: 10px 10px 6px; box-shadow: 0 6px 16px rgba(0,0,0,.12); display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 130px; transform: rotate(var(--r)); transition: transform .2s; }
  .note:hover { transform: rotate(0) scale(1.02); z-index: 1; }
  .note textarea { border: 0; background: transparent; resize: none; outline: none; font: inherit; font-size: var(--fs, 15px); line-height: 1.5; color: #2b2a26; min-height: 90px; }
  .note small { font: 10px var(--mono); color: rgba(0,0,0,.45); }
  .note .x { position: absolute; top: 2px; right: 6px; border: 0; background: none; cursor: pointer; font-size: 15px; color: rgba(0,0,0,.35); }
  .note .x:hover { color: var(--c3); }
  .addnote { border: 2px dashed var(--line); border-radius: 8px; background: none; min-height: 130px; cursor: pointer; color: var(--muted); font: 14px var(--font); }
  .addnote:hover { border-color: var(--c5); color: var(--c5); }
  .store { background: #17181c; color: #e6e4dc; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; min-height: 0; padding-bottom: 46px; }
  .store h2 { font-size: 13px; margin: 0; padding: 12px 14px 8px; display: flex; gap: 6px; align-items: center; color: #b9b7ae; font-weight: 600; }
  .store h2 .sp { margin-left: auto; display: flex; gap: 6px; }
  .store h2 .btn { white-space: nowrap; }
  .store .btn { padding: 5px 9px; font-size: 12px; background: #24262c; color: #e6e4dc; border-color: #34363d; }
  .keys { overflow: auto; margin: 0 14px; border: 1px solid #2b2d33; border-radius: 8px; }
  .keys table { border-collapse: collapse; width: 100%; font: 12px var(--mono); }
  .keys th { position: sticky; top: 0; background: #22242a; color: #9b998f; font-weight: 500; text-align: left; }
  .keys th, .keys td { padding: 5px 8px; border-bottom: 1px solid #26282e; white-space: nowrap; vertical-align: middle; }
  .keys td.v { max-width: 170px; overflow: hidden; text-overflow: ellipsis; color: #b9b7ae; }
  .keys img { height: 26px; vertical-align: middle; border-radius: 4px; }
  .ty { padding: 1px 6px; border-radius: 4px; font-size: 11px; }
  .ty.Object { background: rgba(130, 170, 255, .16); color: #82aaff; }
  .ty.Number { background: rgba(247, 223, 30, .14); color: #f7df1e; }
  .ty.Blob { background: rgba(247, 37, 133, .16); color: #ff6fae; }
  .ty.String { background: rgba(195, 232, 141, .14); color: #c3e88d; }
  tr.flash td { animation: fl 1s; }
  @keyframes fl { from { background: rgba(255, 140, 66, .25); } }
  .cmp { margin: 0 14px; font: 12px var(--mono); border: 1px solid #2b2d33; border-radius: 8px; overflow: hidden; }
  .cmp div { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 6px; padding: 4px 8px; border-bottom: 1px solid #26282e; }
  .cmp div:first-child { background: #22242a; color: #9b998f; }
  .cmp .ok { color: #7bd389; } .cmp .no { color: #ff6fae; }
  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 55%) minmax(0, 45%); }
    .board { padding: 10px 12px 8px; gap: 7px; }
    .notes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .note, .addnote { min-height: 100px; }
    .note textarea { min-height: 60px; }
    .store { grid-template-rows: auto minmax(0, 1fr) auto; }
    .store .cmph, .cmp, .store h2 .fn { display: none; }
    .store h2 { padding: 8px 12px 6px; }
    .keys td.v { max-width: 90px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <section class="board">
    <div class="head"><h1>便利貼筆記</h1><span class="chip" id="driver"></span><span class="chip" id="visits"></span></div>
    <div class="settings">
      新便利貼顏色 <span id="colors"></span>
      字級 <input type="range" id="fs" min="12" max="20" value="15" aria-label="字級">
      <span class="saved" id="saved"></span>
    </div>
    <div class="notes" id="notes"></div>
  </section>
  <aside class="store">
    <h2>儲存內容<span class="fn">（localforage.iterate）</span><span class="sp"><button class="btn" id="reload">重新整理頁面</button><button class="btn" id="clear">清除全部</button></span></h2>
    <div class="keys" id="keys"></div>
    <h2 class="cmph">同一個值，讀回來的型別</h2>
    <div class="cmp" id="cmp"></div>
  </aside>
</div>
<div class="hint">打字會自動存檔，重新整理後便利貼還在</div>

<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const store = localforage.createInstance({ name: "atlas-localforage-demo" });
const COLORS = ["#fff3a3", "#ffd6e0", "#c9f2d5", "#cfe8ff", "#e8dcff"];
const SEED = [
  "週五前交課程大綱\n（示意資料）",
  "localForage 可以直接存物件、數字、Blob，不用 JSON.stringify",
  "買咖啡豆、牛奶",
];
let settings = { color: COLORS[0], fontSize: 15 };
let lastKey = "";
const typeName = (v) => (v instanceof Blob ? "Blob" : Array.isArray(v) ? "Array" : v instanceof Date ? "Date" : typeof v === "object" ? "Object" : typeof v === "number" ? "Number" : "String");
const timeStr = (d) => new Date(d).toLocaleTimeString("zh-TW", { hour12: false });

function flashSaved(text) {
  const el = $("saved"); el.textContent = text; el.classList.add("show");
  clearTimeout(flashSaved.t); flashSaved.t = setTimeout(() => el.classList.remove("show"), 1600);
}

async function save(key, value) {
  await store.setItem(key, value);
  lastKey = key;
  flashSaved(`✓ setItem("${key}") ${timeStr(Date.now())}`);
  renderKeys();
}

// ---- Inspector ----
async function renderKeys() {
  const rows = [];
  await store.iterate((value, key) => { rows.push([key, value]); });
  rows.sort((a, b) => a[0].localeCompare(b[0]));
  $("keys").innerHTML = `<table><thead><tr><th>key</th><th>型別</th><th>大小</th><th>值</th></tr></thead><tbody>${rows.map(([k, v]) => {
    const t = typeName(v);
    const size = t === "Blob" ? v.size : new TextEncoder().encode(JSON.stringify(v)).length;
    const preview = t === "Blob" ? `<img src="${URL.createObjectURL(v)}" alt="">` : esc(JSON.stringify(v));
    return `<tr${k === lastKey ? ' class="flash"' : ""}><td>${esc(k)}</td><td><span class="ty ${t}">${t}</span></td><td>${size} B</td><td class="v">${preview}</td></tr>`;
  }).join("")}</tbody></table>`;
}

async function renderCompare() {
  const samples = [["visits", await store.getItem("visits")], ["settings", await store.getItem("settings")], ["badge", await store.getItem("badge")]];
  let html = "<div><span>key</span><span>localForage</span><span>localStorage</span></div>";
  for (const [k, v] of samples) {
    // Real round trip through localStorage to show it only keeps strings
    const probe = "atlas-lf-compare";
    let back;
    try {
      localStorage.setItem(probe, v);
      back = localStorage.getItem(probe);
      localStorage.removeItem(probe);
    } catch (err) {
      back = "（無法使用）";
      console.warn("localStorage unavailable:", err);
    }
    html += `<div><span>${k}</span><span class="ok">${typeName(v)}</span><span class="no">${typeName(back)} ${esc(back.slice(0, 14))}</span></div>`;
  }
  $("cmp").innerHTML = html;
}

// ---- Notes ----
function noteEl(key, note) {
  const el = document.createElement("div");
  el.className = "note";
  el.style.background = note.color;
  el.style.setProperty("--r", `${(Math.random() * 3 - 1.5).toFixed(1)}deg`);
  el.innerHTML = `<textarea aria-label="便利貼內容">${esc(note.text)}</textarea><small>更新 ${timeStr(note.updated)}</small><button class="x" aria-label="刪除">×</button>`;
  let t;
  el.querySelector("textarea").addEventListener("input", (e) => {
    clearTimeout(t);
    t = setTimeout(async () => {
      note = { ...note, text: e.target.value, updated: new Date() };
      el.querySelector("small").textContent = `更新 ${timeStr(note.updated)}`;
      await save(key, note);
    }, 350);
  });
  el.querySelector(".x").addEventListener("click", async () => {
    await store.removeItem(key);
    el.remove();
    flashSaved(`✓ removeItem("${key}")`);
    renderKeys();
  });
  return el;
}

async function renderNotes() {
  const keys = (await store.keys()).filter((k) => k.startsWith("note:")).sort();
  const notes = $("notes");
  notes.innerHTML = "";
  for (const k of keys) notes.append(noteEl(k, await store.getItem(k)));
  const add = document.createElement("button");
  add.className = "addnote"; add.textContent = "＋ 新增便利貼";
  add.addEventListener("click", async () => {
    const key = `note:${Date.now()}`;
    const note = { text: "", color: settings.color, updated: new Date() };
    await save(key, note);
    const el = noteEl(key, note);
    notes.insertBefore(el, add);
    el.querySelector("textarea").focus();
  });
  notes.append(add);
}

function applySettings() {
  $("notes").style.setProperty("--fs", `${settings.fontSize}px`);
  $("fs").value = settings.fontSize;
  document.querySelectorAll("#colors .sw").forEach((b) => b.setAttribute("aria-pressed", b.dataset.c === settings.color));
}

// A small PNG badge, stored as a Blob on first visit
function makeBadge() {
  const c = document.createElement("canvas"); c.width = 120; c.height = 48;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 120, 48); grd.addColorStop(0, "#ff8c42"); grd.addColorStop(1, "#f72585");
  g.fillStyle = grd; g.beginPath(); g.roundRect(0, 0, 120, 48, 12); g.fill();
  g.fillStyle = "#fff"; g.font = "700 15px 'Microsoft JhengHei',sans-serif"; g.textAlign = "center";
  g.fillText("首次造訪", 60, 22);
  g.font = "12px monospace"; g.fillText(new Date().toISOString().slice(0, 10), 60, 39);
  return new Promise((r) => c.toBlob(r, "image/png"));
}

async function start() {
  await store.ready();
  $("driver").innerHTML = `驅動 <b>${store.driver() === "asyncStorage" ? "IndexedDB" : store.driver()}</b>`;
  const visits = ((await store.getItem("visits")) || 0) + 1;
  if (visits === 1) {
    const now = Date.now();
    for (let i = 0; i < SEED.length; i++) {
      await store.setItem(`note:${now - (SEED.length - i)}`, { text: SEED[i], color: COLORS[i], updated: new Date(now) });
    }
    await store.setItem("settings", settings);
    await store.setItem("badge", await makeBadge());
  }
  await store.setItem("visits", visits);
  settings = { ...settings, ...(await store.getItem("settings")) };
  $("visits").innerHTML = `第 <b>${visits}</b> 次載入`;
  $("colors").innerHTML = COLORS.map((c) => `<button class="sw" data-c="${c}" style="background:${c}" aria-label="顏色 ${c}"></button>`).join(" ");
  applySettings();
  await renderNotes();
  await renderKeys();
  await renderCompare();
}

$("colors").addEventListener("click", (e) => {
  const b = e.target.closest(".sw"); if (!b) return;
  settings = { ...settings, color: b.dataset.c }; applySettings(); save("settings", settings);
});
let fsT;
$("fs").addEventListener("input", () => {
  settings = { ...settings, fontSize: +$("fs").value }; applySettings();
  clearTimeout(fsT); fsT = setTimeout(() => save("settings", settings), 250);
});
$("reload").addEventListener("click", () => location.reload());
$("clear").addEventListener("click", async () => {
  await store.clear();
  settings = { color: COLORS[0], fontSize: 15 };
  location.reload();
});

start().catch((err) => {
  $("notes").innerHTML = `<p>無法使用本機儲存：${esc(err.message)}（無痕模式或瀏覽器設定可能封鎖）</p>`;
  console.error(err);
});
</script>
</body>
</html>
