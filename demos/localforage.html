<script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// localForage showcase: sticky notes, driver detection, type round-trips, multiple stores,
// a custom in-memory driver, a comparison with raw localStorage and a setItem/getItem benchmark.
const PREFIX = "atlas-localforage-";
const { fmt, fmtMs, fmtCompact } = Showcase;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const since = (t0) => performance.now() - t0;
const mb = (b) => (b >= 1073741824 ? `${(b / 1073741824).toFixed(1)} GB` : `${(b / 1048576).toFixed(b < 10485760 ? 2 : 1)} MB`);
const bytes = (b) => (b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : mb(b));
const timeStr = (d) => new Date(d).toLocaleTimeString("zh-TW", { hour12: false });
const DRIVER_LABEL = { asyncStorage: "IndexedDB", webSQLStorage: "WebSQL", localStorageWrapper: "localStorage", atlasMemoryDriver: "記憶體（自訂）" };
const hl = (code) => esc(code).replace(/(&quot;.*?&quot;)/g, '<span class="s">$1</span>').replace(/\.(\w+)\(/g, '.<span class="k">$1</span>(').replace(/(\/\/[^\n]*)/g, '<span class="c">$1</span>');

function typeName(v) {
  if (v === null) return "null";
  if (v instanceof Blob) return "Blob";
  if (v instanceof ArrayBuffer) return "ArrayBuffer";
  if (ArrayBuffer.isView(v)) return v.constructor.name;
  if (v instanceof Date) return "Date";
  if (Array.isArray(v)) return "Array";
  const t = typeof v;
  return t === "object" ? "Object" : t[0].toUpperCase() + t.slice(1);
}
function sizeOf(v) {
  if (v instanceof Blob) return v.size;
  if (v instanceof ArrayBuffer || ArrayBuffer.isView(v)) return v.byteLength;
  return new TextEncoder().encode(JSON.stringify(v) ?? "").length;
}
function preview(v, urls) {
  if (v instanceof Blob) { if (v.type.startsWith("image/")) { const u = URL.createObjectURL(v); urls.push(u); return `<img src="${u}" alt="">`; } return `Blob ${v.type}`; }
  if (v instanceof ArrayBuffer) v = new Uint8Array(v);
  if (ArrayBuffer.isView(v)) return esc(`[${Array.from(v.slice(0, 6)).join(", ")}${v.length > 6 ? ", …" : ""}]`);
  return esc(JSON.stringify(v));
}

// Custom driver: plain Maps keyed by "name/storeName", lives only as long as this tab
const MEM = new Map();
const MEM_CALLS = { n: 0, last: "" };
const MEMORY_DRIVER = {
  _driver: "atlasMemoryDriver",
  _support: true,
  async _initStorage(options) {
    const id = `${options.name}/${options.storeName}`;
    if (!MEM.has(id)) MEM.set(id, new Map());
    this._dbInfo = { ...options, map: MEM.get(id) };
  },
  async getItem(k) { MEM_CALLS.n++; MEM_CALLS.last = "getItem"; const v = this._dbInfo.map.get(k); return v === undefined ? null : v; },
  async setItem(k, v) { MEM_CALLS.n++; MEM_CALLS.last = "setItem"; this._dbInfo.map.set(k, v === undefined ? null : v); return v; },
  async removeItem(k) { MEM_CALLS.n++; MEM_CALLS.last = "removeItem"; this._dbInfo.map.delete(k); },
  async clear() { MEM_CALLS.n++; MEM_CALLS.last = "clear"; this._dbInfo.map.clear(); },
  async length() { MEM_CALLS.n++; MEM_CALLS.last = "length"; return this._dbInfo.map.size; },
  async key(n) { MEM_CALLS.n++; MEM_CALLS.last = "key"; return [...this._dbInfo.map.keys()][n] ?? null; },
  async keys() { MEM_CALLS.n++; MEM_CALLS.last = "keys"; return [...this._dbInfo.map.keys()]; },
  async iterate(fn) {
    MEM_CALLS.n++; MEM_CALLS.last = "iterate";
    let i = 1;
    for (const [k, v] of this._dbInfo.map) { const r = fn(v, k, i++); if (r !== undefined) return r; }
  },
  async dropInstance(o = {}) { MEM.delete(`${o.name || this._dbInfo.name}/${o.storeName || this._dbInfo.storeName}`); },
};
const memReady = localforage.defineDriver(MEMORY_DRIVER);

// Instance owned by a scene: dropped (data deleted) when the scene unmounts
async function own(ctx, opts) {
  if (opts.driver === MEMORY_DRIVER._driver) await memReady;
  const inst = localforage.createInstance(opts);
  await inst.ready();
  ctx.onCleanup(() => inst.dropInstance({ name: opts.name }).catch((e) => console.warn("dropInstance failed", e)));
  return inst;
}
function makeLog(el, max = 40) {
  return (text, { t, cls = "" } = {}) => {
    const row = document.createElement("div");
    row.className = cls;
    row.innerHTML = `<span>${esc(text)}</span><small>${t != null ? fmtMs(t) : ""}</small>`;
    el.prepend(row);
    while (el.children.length > max) el.lastChild.remove();
  };
}
function bars(el, items) {
  const max = Math.max(...items.map((x) => x.v), 1e-6);
  el.innerHTML = items.map((x) => `<div><span>${esc(x.label)}</span><i class="${x.cls || ""}" style="width:${Math.max(1, (x.v / max) * 100).toFixed(1)}%"></i><small>${esc(x.text)}</small></div>`).join("");
}
async function usageText() {
  if (!navigator.storage || !navigator.storage.estimate) return "此瀏覽器不提供 navigator.storage.estimate()";
  const { usage = 0, quota = 0 } = await navigator.storage.estimate();
  return `本網域儲存用量約 ${mb(usage)}／配額約 ${mb(quota)}（storage.estimate）`;
}
function usage(ctx, el) {
  const paint = async () => { const t = await usageText(); if (ctx.active) el.textContent = t; };
  paint();
  ctx.interval(paint, 3000);
  return paint;
}
const deleteDb = (name) => new Promise((res) => { const r = indexedDB.deleteDatabase(name); r.onsuccess = r.onerror = r.onblocked = () => res(); });
// Deletes every IndexedDB database and localStorage key this demo created (also the old page's names)
async function clearDemoData() {
  const names = new Set(["atlas-localforage-demo", PREFIX + "notes"]);
  if (indexedDB.databases) for (const d of await indexedDB.databases()) if (d.name && d.name.startsWith(PREFIX)) names.add(d.name);
  for (const n of names) await localforage.createInstance({ name: n }).dropInstance({ name: n }).catch(() => deleteDb(n));
  let keys = 0;
  for (const k of Object.keys(localStorage)) if (k.startsWith(PREFIX) || k.startsWith("atlas-lf-")) { localStorage.removeItem(k); keys++; }
  MEM.clear();
  return { dbs: names.size, keys };
}
// A small PNG badge drawn on a canvas
function makeBadge(text = "首次造訪", colors = ["#ff8c42", "#f72585"]) {
  const c = document.createElement("canvas"); c.width = 120; c.height = 48;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 120, 48); grd.addColorStop(0, colors[0]); grd.addColorStop(1, colors[1]);
  g.fillStyle = grd; g.beginPath(); g.roundRect(0, 0, 120, 48, 12); g.fill();
  g.fillStyle = "#fff"; g.font = "700 15px 'Microsoft JhengHei',sans-serif"; g.textAlign = "center";
  g.fillText(text, 60, 22);
  g.font = "12px monospace"; g.fillText(new Date().toISOString().slice(0, 10), 60, 39);
  return new Promise((r) => c.toBlob(r, "image/png"));
}

Showcase.run({ scenes: [
  {
    id: "notes", title: "便利貼", paper: true,
    api: "localforage.setItem(key, object) / iterate()",
    desc: "原本的便利貼：打字 350 毫秒後自動 setItem，物件、數字、Blob 直接存，不用 JSON.stringify。右側用 iterate() 列出全部內容；重新整理後資料還在。",
    hint: "打字會自動存檔，按「重新整理頁面」便利貼還在",
    async mount(ctx) {
      ctx.html(`<div class="lf-board wide-left">
        <section class="lf-notes-wrap">
          <div class="lf-set"><span class="lf-chip" style="margin:0" data-driver></span><span class="lf-chip" style="margin:0" data-visits></span>
            新便利貼顏色 <span data-colors></span> 字級 <input type="range" min="12" max="20" value="15" aria-label="字級" data-fs><span class="lf-saved"></span></div>
          <div class="lf-notes"></div></section>
        <section class="lf-panel"><header><h3>儲存內容<small>localforage.iterate</small></h3></header>
          <div class="lf-scroll" data-keys></div>
          <header class="lf-hide-narrow"><h3>同一個值，原生 localStorage 讀回</h3></header>
          <div class="lf-cmp lf-hide-narrow" data-cmp></div><div class="lf-usage"></div></section></div>`);
      const COLORS = ["#fff3a3", "#ffd6e0", "#c9f2d5", "#cfe8ff", "#e8dcff"];
      const SEED = ["週五前交課程大綱\n（示意資料）", "localForage 可以直接存物件、數字、Blob，不用 JSON.stringify", "買咖啡豆、牛奶"];
      const DEFAULTS = { color: COLORS[0], fontSize: 15 };
      let store, settings = { ...DEFAULTS }, lastKey = "", urls = [];
      const notesEl = ctx.$(".lf-notes"), savedEl = ctx.$(".lf-saved");
      const timers = new Set();
      ctx.onCleanup(() => { timers.forEach(clearTimeout); urls.forEach(URL.revokeObjectURL); });
      const paintUsage = usage(ctx, ctx.$(".lf-usage"));
      const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); if (ctx.active) fn(); }, ms); timers.add(id); return id; };
      let savedT;
      function flashSaved(text) { savedEl.textContent = text; savedEl.classList.add("show"); clearTimeout(savedT); savedT = later(() => savedEl.classList.remove("show"), 1600); }
      async function save(key, value) { await store.setItem(key, value); lastKey = key; flashSaved(`setItem("${key}") ${timeStr(Date.now())}`); renderKeys(); }
      async function renderKeys() {
        const rows = [];
        await store.iterate((value, key) => { rows.push([key, value]); });
        rows.sort((a, b) => a[0].localeCompare(b[0]));
        urls.forEach(URL.revokeObjectURL); urls = [];
        ctx.$("[data-keys]").innerHTML = `<table class="lf-t"><thead><tr><th>key</th><th>型別</th><th class="n">大小</th><th>值</th></tr></thead><tbody>${rows.map(([k, v]) => {
          const t = typeName(v);
          return `<tr${k === lastKey ? ' class="flash"' : ""}><td>${esc(k)}</td><td><span class="lf-ty ${t}">${t}</span></td><td class="n">${bytes(sizeOf(v))}</td><td class="v">${preview(v, urls)}</td></tr>`;
        }).join("")}</tbody></table>`;
        paintUsage();
      }
      async function renderCompare() {
        let html = "<div><span>key</span><span>localForage</span><span>localStorage 讀回</span></div>";
        for (const k of ["visits", "settings", "badge"]) {
          const v = await store.getItem(k);
          const probe = PREFIX + "cmp";
          let back;
          try { localStorage.setItem(probe, v); back = localStorage.getItem(probe); localStorage.removeItem(probe); }
          catch (err) { back = "（無法使用）"; console.warn("localStorage unavailable:", err); }
          html += `<div><span>${k}</span><span class="lf-ok">${typeName(v)}</span><span class="lf-no">${typeName(back)} ${esc(String(back).slice(0, 16))}</span></div>`;
        }
        ctx.$("[data-cmp]").innerHTML = html;
      }
      function noteEl(key, note) {
        const el = document.createElement("div");
        el.className = "lf-note";
        el.style.background = note.color;
        el.style.setProperty("--r", `${((key.length * 7 + key.charCodeAt(key.length - 1)) % 30 / 10 - 1.5).toFixed(1)}deg`);
        el.innerHTML = `<textarea aria-label="便利貼內容">${esc(note.text)}</textarea><small>更新 ${timeStr(note.updated)}</small><button class="x" type="button" aria-label="刪除">×</button>`;
        let t;
        el.querySelector("textarea").addEventListener("input", (e) => {
          clearTimeout(t);
          t = later(async () => {
            note = { ...note, text: e.target.value, updated: new Date() };
            el.querySelector("small").textContent = `更新 ${timeStr(note.updated)}`;
            await save(key, note);
          }, 350);
        });
        el.querySelector(".x").addEventListener("click", async () => { await store.removeItem(key); el.remove(); flashSaved(`removeItem("${key}")`); renderKeys(); });
        return el;

          const r = since(t1);
          out.push({ label: `${label} 寫`, v: w, text: fmtMs(w), cls: inst === mem ? "ok" : "" }, { label: `${label} 讀`, v: r, text: fmtMs(r), cls: inst === mem ? "ok" : "" });
          log(`${label}：setItem ×1,000 ${fmtMs(w)}、getItem ×1,000 ${fmtMs(r)}`, { cls: "ok" });
          bars(ctx.$("[data-bars]"), out);
          await ctx.frame();
        }
        await idb.clear();
        paint();
      }, { primary: true });
      for (let k = 0; k < 3; k++) { const key = `item-${++i}`; await mem.setItem(key, { n: i, at: timeStr(Date.now()) }); }
      await paint();
    },
  },
  {
    id: "native", title: "對照 localStorage",
    api: "localStorage.setItem（同步）vs localforage.setItem（Promise）",
    desc: "左邊：一邊跑動畫一邊寫入，同步的 localStorage 會卡住主執行緒，看最長一幀間隔。右邊：實測容量，localStorage 寫到配額錯誤為止；localForage（IndexedDB）存 70 MB 的 Blob 也沒問題，測完立即刪除。",
    hint: "依序按兩種寫入，比較小球的卡頓；再按「測容量」",
    async mount(ctx) {
      ctx.html(`<div class="lf-board">
        <section class="lf-panel"><header><h3>主執行緒卡頓<small>寫 600 筆、每筆 3,000 字</small></h3></header>
          <div class="lf-track"><div class="lf-ball"></div></div>
          <div class="lf-gap" data-gap>0 ms<small>目前最長一幀間隔</small></div>
          <div class="lf-row"><button class="btn" type="button" data-j="ls">localStorage 同步寫</button><button class="btn primary" type="button" data-j="lf">localforage 非同步寫</button></div>
          <div class="lf-bars" data-jank><div class="lf-empty">結果會列在這裡</div></div></section>
        <section class="lf-panel"><header><h3>容量</h3></header>
          <div class="lf-row"><button class="btn primary" type="button" data-cap>測容量</button></div>
          <div class="lf-bars" data-capbars><div class="lf-empty">localStorage 逐步加大單一 key 直到配額錯誤；IndexedDB 寫入 10、20、40 MB Blob</div></div>
          <div class="lf-log"></div><div class="lf-usage"></div></section></div>`);
      const lf = await own(ctx, { name: PREFIX + "native" });
      const log = makeLog(ctx.$(".lf-log"), 10);
      const paintUsage = usage(ctx, ctx.$(".lf-usage"));
      const KEY = PREFIX + "native-";
      const clearLs = () => { for (const k of Object.keys(localStorage)) if (k.startsWith(KEY)) localStorage.removeItem(k); };
      ctx.onCleanup(clearLs);
      const ball = ctx.$(".lf-ball"), track = ctx.$(".lf-track");
      let last = performance.now(), worst = 0, x = 0;
      ctx.raf((t) => {
        const now = performance.now();
        worst = Math.max(worst, now - last);
        last = now;
        x = (x + 3) % Math.max(1, track.clientWidth - 20);
        ball.style.transform = `translateX(${x}px)`;
      });
      ctx.interval(() => (ctx.$("[data-gap]").innerHTML = `${fmtMs(worst)}<small>目前最長一幀間隔</small>`), 200);
      const jank = [];
      const value = "示".repeat(3000);
      ctx.on(ctx.$("[data-j='ls']").parentElement, "click", async (e) => {
        const b = e.target.closest("[data-j]");
        if (!b) return;
        await ctx.frame(3);
        worst = 0; last = performance.now();
        const t0 = performance.now();
        if (b.dataset.j === "ls") {
          try { for (let i = 0; i < 600; i++) localStorage.setItem(KEY + i, value); } catch (err) { log(`localStorage：${err.name}`, { cls: "err" }); }
        } else {
          await Promise.all(Array.from({ length: 600 }, (_, i) => lf.setItem(`k${i}`, value)));
        }
        const total = since(t0);
        await ctx.frame(3);
        const label = b.dataset.j === "ls" ? "localStorage" : "localforage";
        jank.push({ label: `${label} 卡頓`, v: worst, text: `最長 ${fmtMs(worst)}`, cls: b.dataset.j === "ls" ? "hot" : "ok" });
        bars(ctx.$("[data-jank]"), jank.slice(-4));
        log(`${label}：600 筆共 ${fmtMs(total)}，期間最長一幀 ${fmtMs(worst)}`, { cls: "ok" });
        clearLs(); await lf.clear(); paintUsage();
      });
      ctx.on(ctx.$("[data-cap]"), "click", async (e) => {
        const btn = e.currentTarget;
        btn.disabled = true;
        const out = [];
        // localStorage: grow one key in 512K-character steps until the browser refuses
        const chunk = "a".repeat(512 * 1024);
        let s = "", maxChars = 0, err = "";
        const t0 = performance.now();
        for (let i = 0; i < 40; i++) {
          s += chunk;
          try { localStorage.setItem(KEY + "cap", s); maxChars = s.length; } catch (x) { err = x.name; break; }
        }
        localStorage.removeItem(KEY + "cap");
        out.push({ label: "localStorage", v: maxChars, text: `約 ${(maxChars / 1048576).toFixed(1)} M 字元`, cls: "hot" });
        log(`localStorage 單一 key 最多約 ${fmt(maxChars)} 字元，再大就丟 ${err || "（未達上限）"}`, { t: since(t0), cls: "info" });
        bars(ctx.$("[data-capbars]"), out);
        // IndexedDB through localforage: 10 + 20 + 40 MB Blobs (70 MB total, under the 100 MB cap)
        for (const m of [10, 20, 40]) {
          const t1 = performance.now();
          try {
            await lf.setItem(`blob-${m}`, new Blob([new Uint8Array(m * 1048576)]));
            const back = await lf.getItem(`blob-${m}`);
            out.push({ label: `IndexedDB ${m} MB`, v: back.size / 2, text: `${bytes(back.size)} 讀回`, cls: "ok" });
            log(`localforage.setItem 一個 ${m} MB 的 Blob 再讀回`, { t: since(t1), cls: "ok" });
          } catch (x) { log(`IndexedDB ${m} MB：${x.message}`, { cls: "err" }); }
          bars(ctx.$("[data-capbars]"), out);
          await paintUsage();
        }
        await lf.clear();
        log("測試資料已刪除", { cls: "info" });
        paintUsage();
        btn.disabled = false;
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "Promise.all(keys.map(k => store.setItem(k, v)))",
    desc: "逐級加大筆數：每筆約 1 KB 的物件，全部 setItem 後再全部 getItem，量寫入與讀取耗時。可切換驅動；localStorage 驅動遇到配額錯誤會記錄在第幾筆停下。每級測完立即清空。",
    hint: "按「開始測試」；切換驅動後再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="lf-stress"><section class="lf-panel"><header><h3>每級結果<small>寫入與讀取分開計時</small></h3></header>
        <div class="lf-scroll" data-rows><div class="lf-empty">尚未開始</div></div><div class="lf-usage"></div></section></div>`);
      ctx.controls.classList.add("bottom");
      await memReady;
      const DRIVERS = [["IndexedDB", localforage.INDEXEDDB], ["localStorage", localforage.LOCALSTORAGE], ["記憶體", MEMORY_DRIVER._driver]];
      const insts = {};
      let pick = 0;
      const results = [];
      const paintUsage = usage(ctx, ctx.$(".lf-usage"));
      const inst = async () => {
        const [label, driver] = DRIVERS[pick];
        if (!insts[label]) { insts[label] = localforage.createInstance({ name: PREFIX + "stress", storeName: `s${pick}`, driver }); await insts[label].ready(); }
        return insts[label];
      };
      ctx.onCleanup(() => { for (const i of Object.values(insts)) i.dropInstance({ name: PREFIX + "stress" }).catch((e) => console.warn(e)); });
      const paint = () => {
        ctx.$("[data-rows]").innerHTML = results.length ? `<table class="lf-t"><thead><tr><th class="n">筆數</th><th>驅動</th><th class="n">寫入</th><th class="n">寫 筆/秒</th><th class="n">讀取</th><th>備註</th></tr></thead><tbody>${results.map((r) =>
          `<tr><td class="n">${fmt(r.n)}</td><td>${r.d}</td><td class="n">${r.w}</td><td class="n">${r.wr}</td><td class="n">${r.r}</td><td>${esc(r.note)}</td></tr>`).join("")}</tbody></table>` : '<div class="lf-empty">尚未開始</div>';
      };
      ctx.group(DRIVERS.map((d) => d[0]), 0, (i) => (pick = i));
      ctx.button("清除示範資料", async () => { await clearDemoData(); for (const k of Object.keys(insts)) delete insts[k]; results.length = 0; paint(); paintUsage(); });
      const filler = "示意資料內容".repeat(80);
      ctx.bench({
        label: "筆數", unit: "筆", sizes: [100, 500, 1000, 2000, 5000, 10000, 20000], budget: 6000, target: 1500,
        async prepare(n) {
          const s = await inst();
          await s.clear();
          return { s, items: Array.from({ length: n }, (_, i) => [`k${i}`, { i, at: Date.now(), text: filler }]) };
        },
        async run(n, { s, items }) {
          const d = DRIVERS[pick][0];
          const t0 = performance.now();
          let written = n, note = "";
          if (s.driver() === localforage.LOCALSTORAGE) {
            // Sequential so we can tell exactly where the quota stops us
            for (let i = 0; i < n; i++) {
              try { await s.setItem(items[i][0], items[i][1]); } catch (e) { written = i; note = `配額已滿，寫到第 ${fmt(i)} 筆`; break; }
            }
          } else await Promise.all(items.map(([k, v]) => s.setItem(k, v)));
          const w = since(t0);
          const t1 = performance.now();
          await Promise.all(items.slice(0, written).map(([k]) => s.getItem(k)));
          const r = since(t1);
          if (navigator.storage?.estimate && !note) note = `峰值用量約 ${mb((await navigator.storage.estimate()).usage || 0)}`;
          results.push({ n, d, w: fmtMs(w), wr: fmtCompact(written / (w / 1000)), r: fmtMs(r), note });
          paint();
          await s.clear();
          paintUsage();
          return written < n ? `寫 ${fmtMs(w)}・${note}` : `寫 ${fmtMs(w)}・讀 ${fmtMs(r)}`;
        },
        note: "每筆約 1 KB（物件含 480 字中文）。IndexedDB 每次 setItem 是獨立交易；localStorage 驅動要先序列化成字串，配額約 5 MB，超過就停在那一級；記憶體驅動是對照組，代表 localForage 本身的開銷。最大 20,000 筆約 20 MB。",
      });
    },
  },
] });
</script>
</body>
