<style>
  /* shared scroll container: every scene scrolls inside its own box, below the control cluster */

<script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@5.0.1/bundled/locomotive-scroll.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const { h } = Showcase;
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const IMG = (n) => `_shared/img/photo-${n}.jpg`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const EASE = {
  easeInOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  easeOutQuart: (t) => 1 - Math.pow(1 - t, 4),
};
const fmtPx = (v) => Math.round(v).toLocaleString("en-US");
const two = (i) => String(i + 1).padStart(2, "0");
let seq = 0;
// window events and element ids are global, so every mount gets its own names
const uid = (p) => `${p}${++seq}`;
// offsetTop summed up to `root` (ignores transforms, unlike getBoundingClientRect)
const topIn = (el, root) => { let y = 0; for (let n = el; n && n !== root; n = n.offsetParent) y += n.offsetTop; return y; };

// Locomotive Scroll 5 measures each element with getBoundingClientRect(), i.e. relative to the browser
// window. With a custom wrapper (any box that is not the window) every offset is shifted by the
// wrapper's own distance from the window edge, so parallax, progress and calls all fire too early.
// Re-base each ScrollElement on the wrapper's inner edge and recompute once. Returns the resize cost.
function rebase(loco) {
  const lenis = loco.lenisInstance, wr = lenis.rootElement, horiz = lenis.isHorizontal;
  const edge = horiz
    ? () => wr.getBoundingClientRect().left + wr.clientLeft
    : () => wr.getBoundingClientRect().top + wr.clientTop;
  for (const se of loco.coreInstance.scrollElements) {
    se.getMetricsStart = horiz ? (b) => b.left - edge() : (b) => b.top - edge();
  }
  const t0 = performance.now();
  loco.resize();
  return performance.now() - t0;
}

// Every scene scrolls inside its own container, never the page. This builds it, attaches a
// LocomotiveScroll instance (Lenis wrapper + content), drives it from the scene's frame loop through
// initCustomTicker, keeps --vh / --vw in sync and destroys everything on unmount.
function locoStage(ctx, html, { cls = "", lenis = {} } = {}) {
  ctx.el.insertAdjacentHTML("beforeend", `<div class="scroller ${cls}" tabindex="0"><div class="page">${html}</div></div>`);
  const sc = ctx.el.lastElementChild, page = sc.firstElementChild;
  let tick = null, warm = 0;
  const st = {
    sc, page, loco: null, onSize: [], cost: 0, resizeMs: 0,
    get lenis() { return st.loco.lenisInstance; },
    build(extra = {}) {
      if (st.loco) st.loco.destroy();
      tick = null;
      const inst = new LocomotiveScroll({
        lenisOptions: { wrapper: sc, content: page, ...lenis, ...extra },
        // called by start(): the core exists from here on
        initCustomTicker: (render) => {
          if (st.loco !== inst) return;
          // the first frames after a rebuild pay a one-off style/layout pass for the new elements; keep it out of st.cost
          if (!inst.rebased) { inst.rebased = true; st.resizeMs = rebase(inst); st.cost = 0; warm = 6; }
          tick = render;
        },
        destroyCustomTicker: () => { if (st.loco === inst) tick = null; },
      });
      st.loco = inst;
      return inst;
    },
    $: (s) => sc.querySelector(s), $$: (s) => [...sc.querySelectorAll(s)],
  };
  let w = -1, hh = -1;
  const sync = () => {
    if (sc.clientWidth === w && sc.clientHeight === hh) return;
    w = sc.clientWidth; hh = sc.clientHeight;
    sc.style.setProperty("--vh", `${hh}px`); sc.style.setProperty("--vw", `${w}px`);
    st.onSize.forEach((fn) => fn());
  };
  sync();
  const ro = new ResizeObserver(sync);
  ro.observe(sc);
  st.build();
  ctx.raf(() => {
    if (!tick) return;
    if (warm > 0) { warm--; tick(); return; }
    const t0 = performance.now();
    tick();
    const ms = performance.now() - t0;
    st.cost = st.cost ? st.cost * 0.9 + ms * 0.1 : ms;
  });
  ctx.onCleanup(() => { ro.disconnect(); st.loco.destroy(); });
  return st;
}

// One wheel notch through Lenis's real input path (the wrapper's wheel listener). With smoothWheel off
// Lenis leaves wheel input to the browser and a synthetic event never scrolls natively, so scrollBy.
function notch(lenis, dy) {
  const w = lenis.options.wrapper;
  if (!lenis.options.smoothWheel) {
    if (lenis.isHorizontal) w.scrollBy(dy, 0); else w.scrollBy(0, dy);
    return true;
  }
  return w.dispatchEvent(new WheelEvent("wheel", { deltaY: dy, bubbles: true, cancelable: true }));
}

// Self-running demo that stops for good on the first real wheel / touch / drag / key input.
// Our own synthetic wheel events are untrusted, so they never count as the user taking over.
function takeover(ctx, target, text = "自動示範中・捲動即接手") {
  const chip = h("div", { class: "auto-chip" }, text);
  ctx.el.append(chip);
  const s = { on: true, stop() { if (s.on) { s.on = false; chip.remove(); } } };
  const user = (e) => { if (e.isTrusted) s.stop(); };
  for (const t of ["wheel", "touchstart", "pointerdown", "keydown"]) ctx.on(target, t, user, { passive: true });
  return s;
}

// Slow wheel-driven ping-pong so the preview moves.
function autoWheel(ctx, st, tk, { delta = 100, every = 200, pause = 900 } = {}) {
  let dir = 1, acc = 0, wait = 0, clock = 0;
  ctx.raf((t, dt) => {
    clock += dt;
    const l = st.lenis;
    if (!tk.on || l.limit <= 0 || l.isStopped) return;
    if (wait > 0) { wait -= dt; return; }
    if ((acc += dt) < every) return;
    acc = 0;
    if (dir > 0 && l.targetScroll >= l.limit - 2) { dir = -1; wait = pause; return; }
    if (dir < 0 && l.targetScroll <= 2) { dir = 1; wait = pause; return; }
    notch(l, dir * (typeof delta === "function" ? delta(clock) : delta));
  });
}

function hud(ctx, rows, cls = "") {
  const el = h("div", { class: `hud ${cls}` });
  el.innerHTML = rows.map(([k, c]) => (k === "bar" ? `<div class="bar"><i></i></div>` : `<div><span>${k}</span><b class="${c}">-</b></div>`)).join("");
  ctx.el.append(el);
  return (c) => el.querySelector(c === "bar" ? ".bar i" : `.${c}`);
}

function logBox(ctx, title, max = 5) {
  const el = h("div", { class: "log" });
  el.innerHTML = `<header><span>${title}</span><b></b></header><section></section>`;
  ctx.el.append(el);
  const rows = el.querySelector("section"), state = el.querySelector("header b");
  return {
    add(txt) {
      const d = document.createElement("div");
      d.textContent = txt;
      rows.prepend(d);
      while (rows.children.length > max) rows.lastChild.remove();
    },
    state(txt) { state.textContent = txt; },
  };
}

        st.sc.classList.toggle("stopped", !v);
        log.state(v ? "啟用中" : "已停止");
        log.add(v ? "start()：恢復捲動與視差" : "stop()：滾輪、scrollTo、視差全部凍結");
      });
      const tk = takeover(ctx, st.sc);
      let next = 1;
      const auto = () => {
        if (!tk.on || st.lenis.isStopped) return;
        links[next].click();
        next = (next + 1) % links.length;
      };
      ctx.timeout(auto, 700);
      ctx.interval(auto, 2800);
    },
  },

  {
    id: "horizontal", title: "水平視差",
    api: "lenisOptions: { orientation: \"horizontal\" }",
    desc: "同一套 data-scroll 屬性改成水平捲動：Locomotive 依 Lenis 的方向把視差改寫成 translateX，進度也改用水平位置計算。垂直滾輪會轉成水平捲動（gestureOrientation: both）；每張卡片底部的進度條吃自己的 --progress，空心大字則帶較大的 data-scroll-speed。",
    hint: "直接用滾輪，畫面會往右捲",
    mount(ctx) {
      const P = [[1, "峽灣", "-0.06"], [4, "巴哥犬", "-0.06"], [5, "瀑布", "-0.06"], [8, "海象", "-0.06"], [3, "公路", "-0.06"]];
      const WORDS = ["MOVE", "FLOW", "DRIFT", "GLIDE"];
      const parts = [];
      P.forEach(([n, t, sp], i) => {
        parts.push(`<article class="hp" style="--c:${COLORS[i]}" data-scroll data-scroll-css-progress>
          <div class="fr"><img src="${IMG(n)}" alt="${t}" data-scroll data-scroll-speed="${sp}"></div>
          <h4>${two(i)} ${t}</h4><p>img speed ${sp}・--progress</p><div class="hbar"><i></i></div></article>`);
        if (i < WORDS.length) parts.push(`<div class="big" style="--c:${COLORS[(i + 2) % 6]}" data-scroll data-scroll-speed="${i % 2 ? 0.25 : -0.2}">${WORDS[i]}</div>`);
      });
      const st = locoStage(ctx, `<section class="intro"><div class="kicker">ORIENTATION: HORIZONTAL</div><h2>水平視差長廊</h2>
        <p>同樣的 data-scroll-speed，換成水平方向就變成左右錯位。</p></section>${parts.join("")}`,
        { cls: "hz s-hz", lenis: { orientation: "horizontal", gestureOrientation: "both", lerp: 0.08 } });
      const bar = h("i");
      ctx.el.append(h("div", { class: "hz-top" }, bar));
      const read = h("div", { class: "hz-read" });
      ctx.el.append(read);
      let last = "";
      ctx.raf(() => {
        const l = st.lenis;
        bar.style.transform = `scaleX(${l.progress.toFixed(4)})`;
        const txt = `x <b>${fmtPx(l.scroll)}</b> / ${fmtPx(l.limit)}・速度 <b>${l.velocity.toFixed(1)}</b>`;
        if (txt !== last) { last = txt; read.innerHTML = txt; }
      });
      ctx.button("回到起點", () => st.loco.scrollTo("start", { duration: 1.6, easing: EASE.easeOutQuart }));
      const tk = takeover(ctx, st.sc);
      autoWheel(ctx, st, tk, { delta: 80, every: 200 });
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × data-scroll-speed・每級重建 new LocomotiveScroll()",
    desc: "格線裡每個方塊都掛 data-scroll 與各自的 data-scroll-speed（或 css-progress），容器持續以滾輪自動上下捲；每一級重建整個實例，逐級加倍方塊數，直到掉到 30 FPS 以下。「每幀運算」是 Lenis 與 Locomotive 每幀的 JS 時間，「更新中」是目前被 IntersectionObserver 納入每幀計算的元素數。",
    hint: "按「自動加壓」開始・切到 CSS 進度模式再測一次",
    mount(ctx) {
      ctx.controls.classList.add("bottom");
      const st = locoStage(ctx, `<div class="st-grid"></div>`, { cls: "stress", lenis: { lerp: 0.1 } });
      const grid = st.$(".st-grid");
      let mode = 0, count = 0, autoOn = true;
      const sp = (i) => ((((i * 7) % 11) - 5) * 0.05).toFixed(2);
      const build = (n) => {
        count = n;
        grid.classList.toggle("cp", mode === 1);
        grid.innerHTML = mode === 1
          ? "<i data-scroll data-scroll-css-progress></i>".repeat(n)
          : Array.from({ length: n }, (_, i) => `<i data-scroll data-scroll-speed="${sp(i)}"></i>`).join("");
        st.build();
      };
      ctx.group(["視差 speed", "CSS 進度"], 0, (i) => { if (mode !== i) { mode = i; build(count); } });
      ctx.toggle("自動捲動", true, (v) => { autoOn = v; });
      autoWheel(ctx, st, { get on() { return autoOn; } }, { delta: 90, every: 70, pause: 300 });
      ctx.ramp({
        label: "data-scroll 元素", unit: "個", steps: [250, 500, 1000, 2000, 4000, 8000, 16000, 32000],
        apply: build,
        metrics: () => {
          const core = st.loco.coreInstance;
          return {
            "每幀運算": Showcase.fmtMs(st.cost),
            "更新中": core ? `${core.scrollElementsToUpdate.length.toLocaleString("en-US")} 個` : "建置中",
            "resize 耗時": Showcase.fmtMs(st.resizeMs),
          };
        },
        note: "Locomotive 用 IntersectionObserver（rafRootMargin 預設上下各一屏）挑出需要每幀計算的元素，所以每幀運算跟畫面附近的密度有關，不隨總數線性成長；但建置與 resize 都要對全部元素量一次 getBoundingClientRect。之後的樣式重算與繪製不在數字裡，FPS 才反映總成本。",
      });
    },
  },
] });
</script>
</body>
</html>
