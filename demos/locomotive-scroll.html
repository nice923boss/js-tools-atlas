<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Locomotive Scroll 示範：視差作品集</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/locomotive-scroll@5.0.1/bundled/locomotive-scroll.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { height: auto; min-height: 100%; }
  .hero { position: relative; height: 100vh; min-height: 440px; overflow: hidden; display: grid; place-items: center; text-align: center;
    background: radial-gradient(70% 60% at 50% 100%, rgba(157,140,255,.18), transparent 70%), var(--bg); }
  .hero .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--accent); }
  .hero h1 { margin: 12px 0 0; font-size: clamp(46px, 12vw, 120px); line-height: .98; font-weight: 900; }
  .hero h1 .l2 { display: block; background: linear-gradient(90deg, var(--c6), var(--c2) 55%, var(--c4)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 16px auto 0; color: var(--muted); max-width: 24em; padding: 0 20px; position: relative; z-index: 2; }
  .float { position: absolute; border-radius: 14px; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.5); }
  .float img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .f1 { width: 22vw; max-width: 200px; aspect-ratio: 3/4; left: 6%; top: 14%; }
  .f2 { width: 18vw; max-width: 170px; aspect-ratio: 1; right: 7%; top: 10%; }
  .f3 { width: 24vw; max-width: 220px; aspect-ratio: 4/3; right: 4%; bottom: 7%; }
  .center { position: relative; z-index: 1; }
  .down { position: absolute; left: 50%; bottom: 50px; transform: translateX(-50%); font-size: 13px; z-index: 2; }
  .down b { display: block; width: 16px; height: 16px; margin: 6px auto 0; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 6px; } }
  .works { display: grid; grid-template-columns: 1fr 1fr; gap: 6vw; max-width: 900px; margin: 0 auto; padding: 80px 6vw 40px; }
  .col { display: grid; gap: 8vw; align-content: start; }
  .col.right { padding-top: 22vh; }
  .work .frame { border-radius: 14px; overflow: hidden; aspect-ratio: 4/5; }
  .work .frame img { width: 100%; height: 130%; margin-top: -15%; object-fit: cover; display: block; }
  .work h3 { margin: 12px 0 2px; font-size: clamp(16px, 2.4vw, 22px); }
  .work span { color: var(--muted); font-size: 13px; }
  .reveal { opacity: 0; transform: translateY(30px); transition: opacity .8s, transform .8s cubic-bezier(.2,.8,.2,1); }
  .reveal.is-inview { opacity: 1; transform: none; }
  .meter { max-width: 760px; margin: 0 auto; padding: 80px 20px 60px; }
  .meter h2 { margin: 0 0 4px; font-size: clamp(22px, 4.4vw, 36px); }
  .meter .track { height: 10px; border-radius: 10px; background: var(--line); overflow: hidden; margin: 20px 0 10px; }
  .meter .fill { height: 100%; width: calc(var(--progress, 0) * 100%); background: linear-gradient(90deg, var(--c2), var(--c6), var(--c3)); }
  .meter .num { font: 800 clamp(40px, 9vw, 80px)/1 var(--mono); color: var(--accent); }
  .outro { padding: 80px 20px 200px; text-align: center; }
  .outro h2 { font-size: clamp(28px, 7vw, 64px); margin: 0; }
  @media (max-width: 520px) { .f1 { top: 8%; } .f2 { top: 6%; } .f3 { bottom: 14%; } .down { bottom: 76px; } }
</style>
</head>
<body class="scroll">
<section class="hero">
  <div class="float f1" data-scroll data-scroll-speed="0.35"><img src="_shared/img/photo-7.jpg" alt="母獅"></div>
  <div class="float f2" data-scroll data-scroll-speed="-0.25"><img src="_shared/img/photo-6.jpg" alt="水母"></div>
  <div class="float f3" data-scroll data-scroll-speed="0.2"><img src="_shared/img/photo-2.jpg" alt="紅岩峽谷"></div>
  <div class="center">
    <div class="kicker">LOCOMOTIVE SCROLL 5</div>
    <h1><span data-scroll data-scroll-speed="0.12" style="display:block">視差</span><span class="l2" data-scroll data-scroll-speed="-0.08">作品集</span></h1>
    <p>每個元素用 data-scroll-speed 設定自己的速度，捲動時前後景自然拉開層次。</p>
  </div>
  <div class="down">往下捲<b></b></div>
</section>

<section class="works">
  <div class="col">
    <article class="work"><div class="frame"><img src="_shared/img/photo-1.jpg" alt="峽灣" data-scroll data-scroll-speed="-0.08"></div>
      <h3 class="reveal" data-scroll data-scroll-repeat>挪威峽灣</h3><span>風景攝影・2026</span></article>
    <article class="work"><div class="frame"><img src="_shared/img/photo-4.jpg" alt="巴哥犬" data-scroll data-scroll-speed="-0.08"></div>
      <h3 class="reveal" data-scroll data-scroll-repeat>午睡的巴哥</h3><span>寵物肖像・2025</span></article>
  </div>
  <div class="col right" data-scroll data-scroll-speed="0.1">
    <article class="work"><div class="frame"><img src="_shared/img/photo-5.jpg" alt="瀑布彩虹" data-scroll data-scroll-speed="-0.08"></div>
      <h3 class="reveal" data-scroll data-scroll-repeat>瀑布與彩虹</h3><span>旅行紀錄・2026</span></article>
    <article class="work"><div class="frame"><img src="_shared/img/photo-8.jpg" alt="海象群" data-scroll data-scroll-speed="-0.08"></div>
      <h3 class="reveal" data-scroll data-scroll-repeat>海象日光浴</h3><span>生態觀察・2024</span></article>
  </div>
</section>

<section class="meter" data-scroll data-scroll-css-progress data-scroll-event-progress="meterProgress" data-scroll-position="start,end" data-scroll-offset="0,60%">
  <h2>捲動進度變成 CSS 變數</h2>
  <p class="muted">data-scroll-css-progress 會把 0 到 1 的進度寫進 --progress，直接拿來畫進度條。</p>
  <div class="track"><div class="fill"></div></div>
  <div class="num" id="num">0%</div>
</section>

<section class="outro">
  <h2 class="reveal" data-scroll data-scroll-repeat>謝謝觀賞</h2>
  <p class="muted">往回捲，視差與進場效果都會重新計算。</p>
</section>

<div class="hint">往下捲，看前後景以不同速度移動</div>

<script src="https://cdn.jsdelivr.net/npm/locomotive-scroll@5.0.1/bundled/locomotive-scroll.min.js"></script>
<script>
const scroll = new LocomotiveScroll({ lenisOptions: { lerp: 0.09 } });
const num = document.getElementById("num");
window.addEventListener("meterProgress", (e) => {
  num.textContent = Math.round(e.detail.progress * 100) + "%";
});
</script>
</body>
</html>
