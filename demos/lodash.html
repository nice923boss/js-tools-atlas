<script src="_shared/showcase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lodash@4.18.1/lodash.min.js"></script>
<script>
// Lodash showcase: debounce/throttle timeline, collection grouping, deep paths, merge vs assign and cloning,
// array set operations, lazy chain shortcut fusion with memoize, template and isEqual, and a benchmark against native APIs.
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const wrap = (ctx, inner) => { ctx.html(`<div class="ld-wrap">${inner}</div>`); return ctx.$(".ld-wrap"); };
const PAL = ["#ff5e8a", "#4cc9f0", "#f7df1e", "#ff8c42", "#7bd389", "#9d8cff"];
const CITIES = ["台北", "台中", "高雄", "台南", "新竹", "花蓮"], CATS = ["咖啡", "甜點", "便當", "手搖飲", "麵包"], PAYS = ["悠遊卡", "LINE Pay", "信用卡", "現金"];
const money = (n) => `$${Math.round(n).toLocaleString("zh-TW")}`;
const fmtVal = (v) => (v === undefined ? "undefined" : typeof v === "string" ? JSON.stringify(v) : v instanceof Date ? `Date(${v.toISOString().slice(0, 10)})` : JSON.stringify(v));

// Flatten a value into tree rows; paths use lodash syntax so they round-trip through _.get / _.toPath.
const treeRows = (v, key = null, path = "", d = 0, out = []) => {
  const isObj = v !== null && typeof v === "object" && !(v instanceof Date);
  out.push({ key, path, d, v, isObj });
  if (isObj) _.forEach(v, (cv, ck) => treeRows(cv, Array.isArray(v) ? `[${ck}]` : ck, Array.isArray(v) ? `${path}[${ck}]` : path ? `${path}.${ck}` : ck, d + 1, out));
  return out;
};
const treeHtml = (rows, cls = () => "") => rows.map((r) => {
  const t = r.isObj ? `<span class="obj">${Array.isArray(r.v) ? `陣列 ${r.v.length} 項` : `物件 ${_.size(r.v)} 鍵`}</span>` : `<span class="${typeof r.v === "string" ? "str" : typeof r.v === "number" ? "num" : "lit"}">${esc(fmtVal(r.v))}</span>`;
  return `<div class="r ${cls(r)}" data-p="${esc(r.path)}" style="--d:${r.d}">${r.key === null ? "<span class=\"k\">（根）</span> " : `<span class="k">${esc(r.key)}</span>：`}${t}</div>`;
}).join("");
const pathOf = (segs) => segs.reduce((p, k) => (/^\d+$/.test(k) ? `${p}[${k}]` : p ? `${p}.${k}` : k), "");

Showcase.run({ scenes: [
  {
    id: "timing", title: "debounce 與 throttle",
    api: "_.throttle(fn, wait)・_.debounce(fn, wait, { leading, trailing, maxWait })・.flush()・.cancel()",
    desc: "同一串滑鼠事件（粉紅細線）同時交給四種包裝。throttle 固定節奏放行；debounce 等事件停下 wait 毫秒才執行；leading 版在第一下就執行、之後冷卻；maxWait 保證連續輸入時最久多少毫秒一定執行一次。",
    hint: "在左側方塊移動滑鼠；上方調 wait，按 flush() 立即執行等待中的呼叫，cancel() 丟掉它",
    mount(ctx) {
      ctx.html(`<div class="ld-tl"><div class="ld-pad"><span class="mode">自動模擬</span><i class="ld-dot"></i><p>在這裡移動滑鼠或手指</p></div><div class="ld-lanes"><canvas></canvas></div></div>`);
      const pad = ctx.$(".ld-pad"), dot = ctx.$(".ld-dot"), cv = ctx.$("canvas"), g = cv.getContext("2d");
      const FONT = getComputedStyle(document.body).fontFamily, MONO = "Consolas, monospace";
      const PAST = 5200, FUTURE = 800;
      let wait = 300, lanes = [], handlers = [], lastRaw = -1e9, lastClear = -1e9, marks = [], manualUntil = 0;
      const build = () => {
        handlers.forEach((h) => h.cancel && h.cancel());
        const prev = lanes;
        lanes = [["原始事件", "pointermove"], ["throttle", `_.throttle(fn, ${wait})`], ["debounce", `_.debounce(fn, ${wait})`],
          ["leading", `_.debounce(fn, ${wait}, { leading: true, trailing: false })`], ["maxWait", `_.debounce(fn, ${wait}, { maxWait: ${wait * 3} })`]]
          .map(([name, code], i) => ({ name, code, color: PAL[i === 4 ? 5 : i === 3 ? 4 : i], events: prev[i] ? prev[i].events : [], count: prev[i] ? prev[i].count : 0 }));
        const rec = (i) => () => { lanes[i].events.push(performance.now()); lanes[i].count += 1; };
        handlers = [rec(0), _.throttle(rec(1), wait), _.debounce(rec(2), wait), _.debounce(rec(3), wait, { leading: true, trailing: false }), _.debounce(rec(4), wait, { maxWait: wait * 3 })];
      };
      ctx.onCleanup(() => handlers.forEach((h) => h.cancel && h.cancel()));
      const fire = () => { lastRaw = performance.now(); handlers.forEach((h) => h()); };
      const moveDot = (x, y) => { dot.style.left = `${x}px`; dot.style.top = `${y}px`; };
      ctx.on(pad, "pointermove", (e) => { const r = pad.getBoundingClientRect(); manualUntil = performance.now() + 2500; moveDot(e.clientX - r.left, e.clientY - r.top); fire(); });
      let simNext = 0, burstEnd = 0, simT = 0;
      const simulate = (now) => {
        if (now < manualUntil) { ctx.$(".mode").textContent = "手動輸入"; return; }
        ctx.$(".mode").textContent = "自動模擬";
        if (now > burstEnd && now >= simNext) { burstEnd = now + _.random(500, 1700); simNext = now; }
        if (now <= burstEnd && now >= simNext) {
          simT += 0.09;
          moveDot(pad.clientWidth * (0.5 + 0.36 * Math.sin(simT * 1.3)), pad.clientHeight * (0.45 + 0.3 * Math.sin(simT * 2.1 + 1)));
          fire();
          simNext = now + _.random(25, 70);
          if (simNext > burstEnd) simNext = burstEnd + _.random(450, 1300);
        }
      };
      const draw = (now) => {
        const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
        if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); g.setTransform(dpr, 0, 0, dpr, 0, 0); }
        const laneH = (H - 18) / lanes.length, x = (t) => ((t - (now - PAST)) / (PAST + FUTURE)) * W, nowX = x(now);
        g.clearRect(0, 0, W, H);
        g.fillStyle = "rgba(255,255,255,.035)"; g.fillRect(nowX, 0, W - nowX, H - 16);
        g.font = `10px ${MONO}`; g.fillStyle = "rgba(255,255,255,.4)";
        for (let s = 0; s <= 5; s++) { const gx = x(now - s * 1000); g.fillRect(gx, H - 14, 1, 4); g.fillText(s ? `-${s}s` : "現在", gx - (s ? 8 : 10), H - 2); }
        g.fillStyle = "rgba(255,255,255,.5)"; g.fillRect(nowX, 0, 1, H - 16);
        marks = marks.filter((m) => m.t > now - PAST - 200);
        marks.forEach((m) => { const mx = x(m.t); g.fillStyle = m.k === "flush" ? "rgba(123,211,137,.7)" : "rgba(255,94,138,.7)"; for (let y = 0; y < H - 16; y += 8) g.fillRect(mx, y, 1.5, 4); g.font = `11px ${MONO}`; g.fillText(`${m.k}()`, mx + 3, H - 20); });
        lanes.forEach((ln, i) => {
          const y0 = i * laneH, mid = y0 + 18 + (laneH - 18) / 2;
          ln.events = ln.events.filter((t) => t > now - PAST - 200);
          g.font = `600 12px ${FONT}`; g.fillStyle = ln.color; g.fillText(ln.name, 0, y0 + 13);
          const nw = g.measureText(ln.name).width;
          g.font = `11px ${MONO}`; g.fillStyle = "rgba(236,235,230,.55)";
          if (W > 380) g.fillText(ln.code, nw + 8, y0 + 13);
          g.textAlign = "right"; g.fillStyle = "#ecebe6"; g.font = `12px ${FONT}`; g.fillText(`${ln.count} 次`, W - 2, y0 + 13); g.textAlign = "left";
          g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(0, mid, W, 1);
          const pending = lastRaw > lastClear && now - lastRaw < wait;
          if (i >= 2 && (pending || (i === 3 && now - lastRaw < wait))) {
            g.fillStyle = `${ln.color}33`; g.fillRect(x(lastRaw), mid - 7, x(lastRaw + wait) - x(lastRaw), 14);
            g.fillStyle = ln.color; g.font = `10px ${FONT}`; g.fillText(i === 3 ? "冷卻中" : "等待中", x(lastRaw + wait) + 3, mid + 4);
          }
          g.fillStyle = ln.color;
          ln.events.forEach((t) => {
            const ex = x(t);
            if (i === 0) { g.globalAlpha = 0.75; g.fillRect(ex, mid - 8, 1.5, 16); g.globalAlpha = 1; return; }
            const age = now - t;
            g.shadowColor = ln.color; g.shadowBlur = age < 400 ? 14 : 4;
            g.beginPath(); g.arc(ex, mid, age < 250 ? 7 - age / 60 : 4.5, 0, Math.PI * 2); g.fill(); g.shadowBlur = 0;
          });
        });
      };
      build();
      ctx.slider("wait", { min: 100, max: 800, step: 50, value: wait, format: (v) => `${v} ms` }, (v) => { wait = v; build(); });
      ctx.button("flush()", () => { handlers.slice(1).forEach((h) => h.flush()); lastClear = performance.now(); marks.push({ t: lastClear, k: "flush" }); });
      ctx.button("cancel()", () => { handlers.slice(1).forEach((h) => h.cancel()); lastClear = performance.now(); marks.push({ t: lastClear, k: "cancel" }); });
      ctx.button("歸零", () => lanes.forEach((l) => { l.events = []; l.count = 0; }));
      ctx.raf((now) => { simulate(now); draw(now); });
    },
  },
  {
    id: "collection", title: "集合分組",
    api: "_(orders).groupBy(key).map(…).orderBy()・_.partition・_.countBy・_.keyBy",
    desc: "40 筆台灣各地的隨機訂單。左邊用 groupBy 分組後以 sumBy／meanBy 彙總再 orderBy 排序；右邊 partition 依門檻一刀切成兩堆，keyBy 把陣列變成以編號查詢的物件；下方 countBy 數出城市與付款方式的交叉次數。",
    hint: "上方切換分組欄位與指標；拖動門檻、輸入訂單編號",
    mount(ctx) {
      const KEYS = { city: ["城市", CITIES], cat: ["品類", CATS], pay: ["付款方式", PAYS] };
      const st = { key: "city", metric: "total", dir: "desc", cut: 500 };
      let orders = [], byId = {};
      wrap(ctx, `<div class="ld-cols wide"><div class="ld-card"><h2>groupBy → map → orderBy</h2><pre class="ld-pre code"></pre><div class="ld-bars"></div><div class="ld-sub stats" style="margin-top:8px"></div></div>

        ctx.$(".uqs").innerHTML = `${SIGN.length} 筆報名 → <b>${kept.size}</b> 人；若只用 _.uniqBy(報名, "電話") 會留下 <b>${_.uniqBy(SIGN, "電話").length}</b> 筆（格式不同就當成不同人）。保留第一次出現的那筆。`;
      };
      ctx.slider("每組人數", { min: 1, max: 7, step: 1, value: size, format: (v) => `${v} 人` }, (v) => { size = v; render(); });
      [la, lb].forEach((x) => ctx.on(x, "input", render));
      render();
    },
  },
  {
    id: "lazy", title: "惰性鏈與 memoize",
    api: "_(arr).map(f).filter(g).take(k).value()・_.memoize(fn, resolver)・memo.cache",
    desc: "左邊：同樣的「加 5% 稅、篩出 800 元以上、取前 k 筆」，lodash 的鏈會把 map、filter、take 融合成一趟，找到 k 筆就停；_.take(_.filter(_.map())) 與原生陣列方法則會把每一筆都跑完。方格是前 400 筆，亮起的是惰性鏈實際碰過的資料。右邊：memoize 把運費計算結果快取起來，第二次相同參數直接命中。",
    hint: "上方調整資料筆數與 take 數量；右邊換城市與重量看快取命中",
    mount(ctx) {
      let n = 10000, k = 5;
      const mkData = (len) => _.times(len, (i) => ({ id: i, amount: ((i * 7919) % 1000) + 50 }));
      let data = mkData(n);
      const FEE = { 台北: 60, 台中: 80, 高雄: 95, 花蓮: 120, 澎湖: 180, 金門: 220 };
      const busy = (ms) => { const t = performance.now() + ms; let x = 0; while (performance.now() < t) x++; return x; };
      const shipFee = _.memoize((city, kg) => { busy(40); return FEE[city] + Math.ceil(kg) * 25; }, (city, kg) => `${city}|${kg}`);
      const seen = [], log = [];
      wrap(ctx, `<div class="ld-cols wide"><div class="ld-card"><h2>同一條管線，三種寫法</h2><pre class="ld-pre code"></pre>
          <div class="ld-cnt"></div><h2 style="margin-top:10px">惰性鏈碰過的資料（前 400 筆）</h2><div class="ld-grid"></div>
          <div class="ld-legend"><span><i style="--k:rgba(255,255,255,.1)"></i>沒碰</span><span><i style="--k:rgba(76,201,240,.6)"></i>map 與 filter 過</span><span><i style="--k:var(--c1)"></i>被 take 取走</span></div></div>
        <div class="ld-card"><h2>_.memoize(運費, (城市, 公斤) => 城市 + "|" + 公斤)</h2>
          <div class="ld-sub">城市 <select class="ld-field city">${Object.keys(FEE).map((c) => `<option>${c}</option>`).join("")}</select>　重量 <input type="range" class="kg" min="1" max="5" value="2"> <b class="kgv"></b></div>
          <div class="ld-res fee" style="margin-top:8px"></div><div class="ld-sub fs"></div>
          <h2 style="margin-top:8px">呼叫紀錄 <button type="button" class="clr" style="all:unset;cursor:pointer;color:var(--c3);font-size:12px">［memo.cache.clear()］</button></h2><ul class="ld-log"></ul><div class="ld-sub keys" style="margin-top:6px"></div></div></div>`);
      const run = () => {
        let m1 = 0, f1 = 0, m2 = 0, f2 = 0, m3 = 0, f3 = 0;
        const touched = new Set();
        const tax = (o) => ({ id: o.id, total: Math.round(o.amount * 1.05) }), keep = (o) => o.total >= 800;
        let t0 = performance.now();
        const lazy = _(data).map((o) => { m1++; touched.add(o.id); return tax(o); }).filter((o) => { f1++; return keep(o); }).take(k).value();
        const tl = performance.now() - t0; t0 = performance.now();
        _.take(_.filter(_.map(data, (o) => { m2++; return tax(o); }), (o) => { f2++; return keep(o); }), k);
        const te = performance.now() - t0; t0 = performance.now();
        data.map((o) => { m3++; return tax(o); }).filter((o) => { f3++; return keep(o); }).slice(0, k);
        const tn = performance.now() - t0;
        ctx.$(".code").innerHTML = `<span class="k">_</span>(data).<span class="k">map</span>(加稅).<span class="k">filter</span>(total &gt;= 800).<span class="k">take</span>(${k}).<span class="k">value</span>()\n<span class="k">_.take</span>(<span class="k">_.filter</span>(<span class="k">_.map</span>(data, 加稅), 篩選), ${k})\ndata.<span class="k">map</span>(加稅).<span class="k">filter</span>(篩選).<span class="k">slice</span>(0, ${k})`;
        const rows = [["惰性鏈 _(…)", m1 + f1, tl, "var(--c1)"], ["_.take(_.filter(_.map()))", m2 + f2, te, "var(--c2)"], ["原生 map／filter／slice", m3 + f3, tn, "var(--c3)"]], mx = Math.max(...rows.map((r) => r[1]));
        ctx.$(".ld-cnt").innerHTML = `<span style="color:var(--muted)">寫法</span><span style="color:var(--muted)">迭代函式呼叫次數</span><span style="color:var(--muted);text-align:right">次數／耗時</span>` +
          rows.map(([name, c, t, col]) => `<span>${name}</span><div class="ld-sbar" style="--k:${col}"><i style="width:${Math.max(0.6, (c / mx) * 100)}%"></i></div><b>${Showcase.fmt(c)}・${Showcase.fmtMs(t)}</b>`).join("") +
          `<span></span><span class="ld-sub" style="grid-column:span 2">取得 ${lazy.length} 筆：${lazy.map((o) => `#${o.id} ${money(o.total)}`).join("、")}</span>`;
        const ids = new Set(lazy.map((o) => o.id));
        ctx.$(".ld-grid").innerHTML = _.times(Math.min(400, data.length), (i) => `<i class="${ids.has(i) ? "m" : touched.has(i) ? "v" : ""}"></i>`).join("");
      };
      const fee = () => {
        const city = ctx.$(".city").value, kg = +ctx.$(".kg").value, key = `${city}|${kg}`, hit = shipFee.cache.has(key);
        const t0 = performance.now(), v = shipFee(city, kg), ms = performance.now() - t0;
        ctx.$(".kgv").textContent = `${kg} 公斤`;
        ctx.$(".fee").textContent = money(v);
        ctx.$(".fs").innerHTML = `${hit ? "<span class=\"ld-badge ok\">快取命中</span>" : "<span class=\"ld-badge no\">未命中，實際計算</span>"} 耗時 <b>${Showcase.fmtMs(ms)}</b>`;
        if (!seen.includes(key)) seen.push(key);
        log.unshift([key, hit, ms]); log.length = Math.min(log.length, 6);
        ctx.$(".ld-log").innerHTML = log.map(([kk, h, t]) => `<li><span>shipFee("${kk.replace("|", "\", ")})</span><span class="ld-badge ${h ? "ok" : "no"}">${h ? "命中" : "計算"}</span><span style="text-align:right">${Showcase.fmtMs(t)}</span></li>`).join("");
        ctx.$(".keys").innerHTML = `快取中的鍵（memo.cache.has 檢查）：${seen.filter((s) => shipFee.cache.has(s)).map((s) => `<code class="ld-code">${s}</code>`).join(" ") || "空"}`;
      };
      ctx.slider("資料筆數", { min: 2, max: 5.7, step: 0.1, value: 4, format: (v) => Showcase.fmtCompact(Math.round(10 ** v)) }, (v) => { n = Math.round(10 ** v); data = mkData(n); run(); });
      ctx.slider("take", { min: 1, max: 60, step: 1, value: k }, (v) => { k = v; run(); });
      ctx.on(ctx.$(".city"), "change", fee);
      ctx.on(ctx.$(".kg"), "input", fee);
      ctx.on(ctx.$(".clr"), "click", () => { shipFee.cache.clear(); log.length = 0; fee(); });
      run(); fee();
      ctx.$(".kg").value = 3; fee(); ctx.$(".kg").value = 2; fee();
    },
  },
  {
    id: "tpl", title: "template 與 isEqual",
    api: "_.template(src)(data)・<%- 跳脫 %>・<%= 原樣 %>・<% 程式 %>・_.isEqual(a, b)",
    desc: "上方：lodash 範本把資料套進 HTML。<%- %> 會跳脫 HTML，所以顧客名稱的標籤原樣顯示；<%= %> 不跳脫，備註裡的斜體真的生效；也支援 ES 風格的錢字號大括號插值。下方：深度比較與 === 和 JSON.stringify 的差別，每格都是即時計算的。",
    hint: "直接編輯範本或資料 JSON；改右下兩段 JSON 看 isEqual 與 JSON.stringify 何時不同",
    mount(ctx) {
      const TPL = ["<h3>${ 店名 } 訂單確認</h3>", "<p>親愛的 <%- 顧客 %> 您好，共 <%= 品項.length %> 項：</p>", "<ul><% _.forEach(品項, function (it) { %>",
        "  <li><%- it.名稱 %> × <%= it.數量 %>，小計 <%= it.單價 * it.數量 %> 元</li><% }); %>", "</ul>", "<p>備註：<%= 備註 %></p>"].join("\n");
      const DATA = { 店名: "日月潭紅茶舖", 顧客: "<b>林小美</b>", 品項: [{ 名稱: "台茶 18 號", 數量: 2, 單價: 380 }, { 名稱: "紅玉奶茶", 數量: 3, 單價: 75 }], 備註: "<i>不要吸管，謝謝</i>" };
      const CASES = [
        ["鍵順序不同", "{ a: 1, b: 2 }", "{ b: 2, a: 1 }", { a: 1, b: 2 }, { b: 2, a: 1 }], ["NaN", "NaN", "NaN", NaN, NaN],
        ["Date 同一時刻", "new Date(2026, 9, 10)", "new Date(2026, 9, 10)", new Date(2026, 9, 10), new Date(2026, 9, 10)],
        ["Map 內容不同", "Map{台北→1}", "Map{高雄→2}", new Map([["台北", 1]]), new Map([["高雄", 2]])], ["陣列順序不同", "[1, 2, 3]", "[3, 2, 1]", [1, 2, 3], [3, 2, 1]],
        ["undefined 屬性", "{ a: 1, b: undefined }", "{ a: 1 }", { a: 1, b: undefined }, { a: 1 }], ["+0 與 -0", "0", "-0", 0, -0], ["數字與字串", "{ n: 1 }", "{ n: \"1\" }", { n: 1 }, { n: "1" }],
      ];
      const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
      const badge = (v) => `<span class="ld-badge ${v ? "ok" : "no"}">${v}</span>`;
      wrap(ctx, `<div class="ld-cols"><div class="ld-card"><h2>範本 <code>_.template(src)</code></h2><textarea class="ld-field tpl" rows="7" spellcheck="false"></textarea><h2 style="margin-top:6px">資料</h2><textarea class="ld-field dat" rows="6" spellcheck="false"></textarea></div>
        <div class="ld-card"><h2>輸出（渲染後）</h2><div class="ld-out"></div><h2 style="margin-top:8px">輸出 HTML 原始碼</h2><pre class="ld-pre src" style="white-space:pre-wrap;max-height:120px"></pre><div class="ld-sub fsrc"></div></div></div>
        <div class="ld-cols wide"><div class="ld-card"><h2>深度比較對照</h2><div style="overflow-x:auto"><table class="ld-tbl"><thead><tr><th>情境</th><th>a</th><th>b</th><th>===</th><th>JSON.stringify</th><th>_.isEqual</th></tr></thead><tbody>
          ${CASES.map(([n, sa, sb, a, b]) => `<tr><td>${n}</td><td><code>${esc(sa)}</code></td><td><code>${esc(sb)}</code></td><td>${badge(a === b)}</td><td>${badge(same(a, b))}</td><td>${badge(_.isEqual(a, b))}</td></tr>`).join("")}</tbody></table></div></div>
        <div class="ld-card"><h2>自己比 JSON</h2><textarea class="ld-field ja" rows="4" spellcheck="false"></textarea><textarea class="ld-field jb" rows="4" spellcheck="false" style="margin-top:6px"></textarea><div class="ld-sub cmp" style="margin-top:6px"></div></div></div>`);
      const T = ctx.$(".tpl"), D = ctx.$(".dat"), JA = ctx.$(".ja"), JB = ctx.$(".jb");
      T.value = TPL; D.value = JSON.stringify(DATA, null, 1);
      JA.value = JSON.stringify({ 車次: 123, 座位: ["5車12A", "5車12B"], 乘客: { 成人: 2, 孩童: 1 } });
      JB.value = JSON.stringify({ 乘客: { 孩童: 1, 成人: 2 }, 車次: 123, 座位: ["5車12A", "5車12C"] });
      const diffs = (a, b, p = "", out = []) => {
        if (_.isEqual(a, b) || out.length >= 5) return out;
        if (_.isObject(a) && _.isObject(b)) _.union(_.keys(a), _.keys(b)).forEach((kk) => diffs(a[kk], b[kk], Array.isArray(a) ? `${p}[${kk}]` : p ? `${p}.${kk}` : kk, out));
        else out.push(`${p || "（根）"}：${JSON.stringify(a)} ≠ ${JSON.stringify(b)}`);
        return out;
      };
      const render = () => {
        try {
          const f = _.template(T.value), html = f(JSON.parse(D.value));
          ctx.$(".ld-out").innerHTML = html;
          ctx.$(".src").textContent = html;
          ctx.$(".fsrc").textContent = `編譯後函式 f.source 共 ${f.source.length} 字元，之後每次套資料都重用`;
        } catch (e) { ctx.$(".ld-out").innerHTML = `<span class="ld-err">${esc(`${e.name}: ${e.message}`)}</span>`; ctx.$(".src").textContent = ""; }
        try {
          const a = JSON.parse(JA.value), b = JSON.parse(JB.value), eq = _.isEqual(a, b);
          ctx.$(".cmp").innerHTML = `JSON.stringify 相等 ${badge(same(a, b))}　_.isEqual ${badge(eq)}${eq ? "" : `<br>差異：${diffs(a, b).map((d) => `<code class="ld-code">${esc(d)}</code>`).join("<br>")}`}`;
        } catch (e) { ctx.$(".cmp").innerHTML = `<span class="ld-err">JSON 格式錯誤：${esc(e.message)}</span>`; }
      };
      [T, D, JA, JB].forEach((x) => ctx.on(x, "input", render));
      render();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "_.cloneDeep・_.isEqual・_.orderBy・_.groupBy 對照 structuredClone・JSON・Array.sort・Object.groupBy",
    desc: "產生 n 筆巢狀訂單物件，lodash 與原生做同一件事，比較耗時。上方切換要比的操作；每個級距是資料筆數，超過時間預算就停止。",
    hint: "上方選操作，左側按「開始測試」",
    mount(ctx) {
      const NATIVE_GROUP = typeof Object.groupBy === "function";
      const cmp = (x, y) => (x.city < y.city ? -1 : x.city > y.city ? 1 : y.amount - x.amount);
      const MODES = [
        { name: "深複製", lo: "_.cloneDeep", a: (d) => _.cloneDeep(d), alts: [["structuredClone", (d) => structuredClone(d)], ["JSON 來回", (d) => JSON.parse(JSON.stringify(d))]] },
        { name: "深比較", lo: "_.isEqual", prep: (d) => _.cloneDeep(d), a: (d, c) => _.isEqual(d, c), alts: [["JSON.stringify ===", (d, c) => JSON.stringify(d) === JSON.stringify(c)]] },
        { name: "多欄排序", lo: "_.orderBy(城市↑, 金額↓)", a: (d) => _.orderBy(d, ["city", "amount"], ["asc", "desc"]), alts: [["slice().sort(比較函式)", (d) => d.slice().sort(cmp)]] },
        { name: "分組加總", lo: "_.groupBy + _.sumBy", a: (d) => _.mapValues(_.groupBy(d, "city"), (l) => _.sumBy(l, "amount")),
          alts: [[NATIVE_GROUP ? "Object.groupBy + reduce" : "for 迴圈", (d) => { if (NATIVE_GROUP) { const g = Object.groupBy(d, (o) => o.city), r = {}; for (const k in g) r[k] = g[k].reduce((s, o) => s + o.amount, 0); return r; } const r = {}; for (const o of d) r[o.city] = (r[o.city] || 0) + o.amount; return r; }]] },
      ];
      const mk = (n) => _.times(n, (i) => ({ id: i, name: `訂單${i}`, city: CITIES[i % 6], amount: (i * 7919) % 1000, items: [{ sku: `A${i % 97}`, qty: i % 5 }], meta: { at: 1790000000000 + i * 1000, tags: ["外送", "會員"] } }));
      const results = MODES.map(() => new Map());
      let mi = 0, gen = 0;
      ctx.html(`<div class="ld-stress"><div class="ld-card"><h2>各級距耗時 <code class="mode"></code></h2><div style="overflow-x:auto"><table class="ld-tbl"><thead class="hd"></thead><tbody></tbody></table></div><div class="ld-legend lg"></div></div>
        <div class="ld-card"><h2>觀察</h2><div class="ld-sub obs">按左側「開始測試」。</div></div></div>`);
      const cell = (v, max, k, txt) => `<div class="ld-cell"><div class="ld-sbar" style="--k:${k}"><i style="width:${Math.max(3, (v / max) * 100)}%"></i></div><span>${txt}</span></div>`;
      const COLS = ["var(--c1)", "var(--c2)", "var(--c3)"];
      const paint = () => {
        const M = MODES[mi], rows = [...results[mi].values()], names = [M.lo, ...M.alts.map((a) => a[0])];
        ctx.$(".mode").textContent = names.join("  vs  ");
        ctx.$(".hd").innerHTML = `<tr><th>筆數</th>${names.map((x) => `<th>${esc(x)}</th>`).join("")}<th>lodash 筆/秒</th></tr>`;
        ctx.$(".lg").innerHTML = names.map((x, i) => `<span><i style="--k:${COLS[i]}"></i>${esc(x)}</span>`).join("");
        const mx = Math.max(0.01, ...rows.flatMap((r) => r.t));
        ctx.$("tbody").innerHTML = rows.length ? rows.map((r) => `<tr><td class="num">${Showcase.fmtCompact(r.n)}</td>${r.t.map((t, i) => `<td>${cell(t, mx, COLS[i], Showcase.fmtMs(t))}</td>`).join("")}<td class="num">${Showcase.fmtCompact(r.n / (r.t[0] / 1000))}</td></tr>`).join("")
          : `<tr><td colspan="${names.length + 2}" class="ld-empty">尚未測試</td></tr>`;
        const last = rows[rows.length - 1];
        if (last) {
          const best = _.minBy(names.map((x, i) => [x, last.t[i]]), 1);
          ctx.$(".obs").innerHTML = `${Showcase.fmtCompact(last.n)} 筆時最快的是 <b>${esc(best[0])}</b>（${Showcase.fmtMs(best[1])}）。` + names.slice(1).map((x, i) => `${esc(M.lo)} 是 ${esc(x)} 的 <b>${(last.t[0] / Math.max(last.t[i + 1], 0.001)).toFixed(1)} 倍</b>耗時`).join("；") +
            "。<br>lodash 的優勢在語意與邊界處理（循環參照、Map、鍵順序無關的比較、穩定排序），不是速度。";
        }
      };
      const makeBench = () => {
        const lab = ctx.el.querySelector(".sc-lab");
        if (lab) lab.remove();
        const my = ++gen, m = mi, M = MODES[m];
        ctx.bench({
          label: "資料筆數", unit: "筆", sizes: [1000, 5000, 20000, 100000, 300000], target: 1000, budget: 3000,
          prepare(n) { const d = mk(n); return { d, c: M.prep ? M.prep(d) : null }; },
          run(n, { d, c }) {
            if (my !== gen) throw new DOMException("Bench replaced", "AbortError");
            const fns = [M.a, ...M.alts.map((x) => x[1])], t = [];
            let ok = true, first;
            fns.forEach((f, i) => { const t0 = performance.now(), r = f(d, c); t.push(performance.now() - t0); if (i === 0) first = r; else if (m >= 2) ok = ok && _.isEqual(first, r); else if (m === 1) ok = ok && r === first; });
            results[m].set(n, { n, t });
            paint();
            return `lodash ${Showcase.fmtMs(t[0])}・對照 ${t.slice(1).map(Showcase.fmtMs).join("／")}${ok ? "" : "・結果不一致"}`;
          },
          note: "每個級距都重新產生資料；排序與分組會比對 lodash 與原生的結果是否一致。",
        });
      };
      ctx.group(MODES.map((x) => x.name), 0, (i) => { mi = i; makeBench(); paint(); });
      ctx.controls.classList.add("bottom");
      makeBench();
      paint();
    },
  },
] });
</script>
