<style>
  .board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }

  /* Every Lottie host is a positioned box: the HTML renderer places its layers absolutely. */
  .lot {
    position: relative; overflow: hidden; min-width: 0; min-height: 0;
    border: 1px solid var(--line); border-radius: 12px;
    background: radial-gradient(circle at 50% 45%, #1d2230, #12151b 72%);

  }

  .scrub { display: flex; gap: 10px; align-items: center; }

  /* scenes 2 and 6: side-by-side renderer cards */

  .s6 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .rcard { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-width: 0; min-height: 0; }
  .s6 .rcard { grid-template-rows: auto minmax(0, 1fr) 64px; }
  .rmeta { min-width: 0; }
  .rmeta h3 { margin: 0 0 2px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rmeta h3 small { color: var(--muted); font: 400 11.5px var(--mono); margin-left: 6px; }
  .plot { display: block; width: 100%; height: 100%; min-height: 0; border: 1px solid var(--line); border-radius: 8px; background: rgba(127, 127, 127, .06); }

  /* scene 3: playback */
  .s3 { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; height: 100%; }
  .segrow { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }

  .counters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .counters > div { padding: 5px 8px; border-radius: 8px; background: rgba(127, 127, 127, .10); min-width: 0; }
  .counters small { display: block; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .counters b { font: 700 15px/1.3 var(--mono); }

<body>
<script src="https://cdn.jsdelivr.net/npm/lottie-web@5.13.0/build/player/lottie.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// lottie-web showcase: the original marker-driven status player plus six scenes on renderers,
// playback API, events, runtime text and slots, subframes and an instance-count stress ramp.
const SRC = "assets/lottie-web/status.json";
let statusText = null;
// Fetch once, parse a fresh copy per load: lottie-web mutates the data object it is given.
const statusJSON = () => (statusText ??= fetch(SRC).then((r) => {
  if (!r.ok) throw new Error(`讀取 ${SRC} 失敗（HTTP ${r.status}）`);
  return r.text();
}));
const markerMap = (data) => Object.fromEntries(data.markers.map((m) => [m.cm, [m.tm, m.tm + m.dr]]));
const STATE = {
  loading: { name: "載入中", color: "var(--c2)" },
  success: { name: "成功", color: "var(--c4)" },
  error: { name: "失敗", color: "var(--c3)" },
};
// ctx.slider only refreshes its <output> on user input; this keeps it in sync during playback.
const syncSlider = (input, v, text) => { input.value = v; input.nextElementSibling.textContent = text; };
const pressIn = (wrap, i) => [...wrap.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
const ready = (a) => new Promise((res) => (a.isLoaded ? res() : a.addEventListener("DOMLoaded", res)));

// Track every AnimationItem a scene creates so unmount destroys all of them.
function players(ctx) {
  const set = new Set();
  const api = {
    load(opts) { const a = lottie.loadAnimation(opts); set.add(a); return a; },
    drop(a) { if (a && set.delete(a)) a.destroy(); },
    clear() { set.forEach((a) => a.destroy()); set.clear(); },
  };
  ctx.onCleanup(() => api.clear());
  return api;
}

// Canvas and HTML renderers measure their host once; call fn again whenever the box changes.
function onBox(ctx, el, fn) {
  let raf = 0, lw = -1, lh = -1;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h || (w === lw && h === lh)) return;
      lw = w; lh = h;
      fn(w, h);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}
// resize() before DOMLoaded would touch a canvas context that does not exist yet.
const fit = (a) => { if (a && a.isLoaded) a.resize(); };

// ---------- minimal Lottie JSON builder (shape layers, text layers, slots) ----------
const EASE = [0.42, 0, 0.58, 1], LIN = [0, 0, 1, 1], OUT = [0.2, 0.8, 0.3, 1];
const UP = [0.33, 0.66, 0.66, 1], DOWN = [0.33, 0, 0.66, 0.33];
const st = (k) => ({ a: 0, k });
const prop = (v) => (v && typeof v === "object" && "a" in v ? v : st(v));
// keys: [frame, value, easing to the next key]
const kf = (keys, ease = EASE) => ({
  a: 1,
  k: keys.map(([t, s, e = ease], i) => {
    const v = Array.isArray(s) ? s : [s];
    if (i === keys.length - 1) return { t, s: v };
    const n = v.length, rep = (x) => Array(n).fill(x);
    return { t, s: v, o: { x: rep(e[0]), y: rep(e[1]) }, i: { x: rep(e[2]), y: rep(e[3]) } };
  }),
});
const tr = (o = {}) => ({ ty: "tr", p: prop(o.p ?? [0, 0]), a: st([0, 0]), s: prop(o.s ?? [100, 100]), r: prop(o.r ?? 0), o: prop(o.o ?? 100), sk: st(0), sa: st(0) });
const group = (nm, items, t) => ({ ty: "gr", nm, it: [...items, tr(t)] });
const ell = (size, p = [0, 0]) => ({ ty: "el", d: 1, s: prop(size), p: prop(p) });
const rect = (size, r = 0, p = [0, 0]) => ({ ty: "rc", d: 1, s: prop(size), p: prop(p), r: prop(r) });
const star = (pts, or, ir) => ({ ty: "sr", sy: 1, d: 1, pt: st(pts), p: st([0, 0]), r: st(0), ir: st(ir), is: st(0), or: st(or), os: st(0) });
const path = (v, i, o) => ({ ty: "sh", ks: st({ c: false, v, i, o }) });
const fill = (c, sid) => ({ ty: "fl", c: sid ? { a: 0, k: c, sid } : prop(c), o: st(100), r: 1 });
const stroke = (c, w, dash) => ({
  ty: "st", c: prop(c), o: st(100), w: prop(w), lc: 2, lj: 2, ml: 4,
  ...(dash ? { d: [{ n: "d", nm: "dash", v: st(dash[0]) }, { n: "g", nm: "gap", v: st(dash[1]) }, { n: "o", nm: "offset", v: st(0) }] } : {}),
});
const trim = (s, e) => ({ ty: "tm", s: prop(s), e: prop(e), o: st(0), m: 1 });
const ks = (o = {}) => ({ o: prop(o.o ?? 100), r: prop(o.r ?? 0), p: o.p && o.p.s ? o.p : prop(o.p ?? [0, 0, 0]), a: st([0, 0, 0]), s: prop(o.s ?? [100, 100, 100]) });
const shapeLayer = (ind, nm, shapes, t, range) => ({ ddd: 0, ind, ty: 4, nm, sr: 1, ks: ks(t), ao: 0, shapes, ip: range[0], op: range[1], st: 0, bm: 0 });
const textLayer = (ind, nm, doc, t, range) => ({
  ddd: 0, ind, ty: 5, nm, sr: 1, ks: ks(t), ao: 0,
  t: { d: { k: [{ s: { s: 40, f: "Sans", j: 2, tr: 0, lh: 48, ls: 0, fc: [1, 1, 1], ...doc }, t: 0 }] }, p: {}, m: { g: 1, a: st([0, 0]) }, a: [] },
  ip: range[0], op: range[1], st: 0, bm: 0,
});
const comp = (nm, w, h, fr, op, layers, extra = {}) => ({ v: "5.7.4", fr, ip: 0, op, w, h, nm, ddd: 0, assets: [], layers, markers: [], ...extra });
// Text without glyph data: SVG and HTML renderers draw it with the system font.
const FONTS = { list: [{ fName: "Sans", fFamily: "sans-serif", fStyle: "Bold", ascent: 75 }] };
const RGB = {
  y: [0.969, 0.875, 0.118], b: [0.298, 0.788, 0.941], p: [0.969, 0.145, 0.522],
  g: [0.482, 0.827, 0.537], o: [1, 0.549, 0.259], v: [0.616, 0.549, 1], w: [0.93, 0.92, 0.9],
};
const rgba = (c, a = 1) => [...c, a];

// Scene 3: a ball hops three times along a dashed trail, a ring tracks overall progress.
const HOP = { op: 96, T: [0, 36, 64, 84] };
function hopData() {
  const { op, T } = HOP, GY = 222, R = 17, cy = GY - R;
  const xs = [60, 200, 320, 420], hs = [118, 68, 34];
  // Each hop is a parabola: one cubic segment whose handles sit 2/3 of the way to the apex control.
  const v = xs.map((x) => [x, cy]), vi = [[0, 0]], vo = [];
  hs.forEach((hh, k) => {
    const w = xs[k + 1] - xs[k];
    vo.push([w / 3, (-4 * hh) / 3]);
    vi.push([-w / 3, (-4 * hh) / 3]);
  });
  vo.push([0, 0]);
  const hopLen = (w, hh) => {
    let L = 0, px = 0, py = 0;
    for (let s = 1; s <= 40; s++) { const x = (w * s) / 40, y = (4 * hh * x * (w - x)) / (w * w); L += Math.hypot(x - px, y - py); px = x; py = y; }
    return L;
  };
  const lens = hs.map((hh, k) => hopLen(xs[k + 1] - xs[k], hh)), total = lens.reduce((a, b) => a + b, 0);
  const trimKeys = [[T[0], 0, LIN]];
  let acc = 0;
  hs.forEach((hh, k) => {
    trimKeys.push([(T[k] + T[k + 1]) / 2, ((acc + lens[k] / 2) / total) * 100, LIN]);
    acc += lens[k];
    trimKeys.push([T[k + 1], (acc / total) * 100, LIN]);
  });
  const xKeys = xs.map((x, k) => [T[k], x, LIN]);
  const yKeys = [[T[0], GY, UP]];
  hs.forEach((hh, k) => yKeys.push([(T[k] + T[k + 1]) / 2, GY - hh, DOWN], [T[k + 1], GY, UP]));
  const squash = [[0, [100, 100, 100]]];
  T.slice(1).forEach((t, k) => {
    const a = 1 - k * 0.3;
    squash.push([t - 8, [100, 100, 100]], [t - 3, [92, 110, 100]], [t, [100 + 24 * a, 100 - 22 * a, 100]], [t + 4, [100, 100, 100]]);
  });
  const shadowS = [[0, [100, 100, 100]]], shadowO = [[0, 40]];
  hs.forEach((hh, k) => {
    const mid = (T[k] + T[k + 1]) / 2, s = 100 - hh * 0.45;
    shadowS.push([mid, [s, s, 100]], [T[k + 1], [100, 100, 100]]);
    shadowO.push([mid, 40 - hh * 0.2], [T[k + 1], 40]);
  });
  const C = [RGB.y, RGB.b, RGB.p, RGB.g].map((c) => rgba(c));
  const ballC = [[0, C[0]], [33, C[0]], [37, C[1]], [61, C[1]], [65, C[2]], [81, C[2]], [85, C[3]]];
  return comp("hop", 480, 270, 30, op, [
    shapeLayer(1, "ring", [
      group("arc", [ell([40, 40]), trim(0, kf([[0, 0, LIN], [op - 1, 100]])), stroke(rgba(RGB.y), 4)]),
      group("track", [ell([40, 40]), stroke([1, 1, 1, 0.15], 4)]),
    ], { p: [440, 40, 0] }, [0, op]),
    shapeLayer(2, "ball", [group("ball", [ell([2 * R, 2 * R], [0, -R]), fill(kf(ballC))])], { p: { s: true, x: kf(xKeys), y: kf(yKeys) }, s: kf(squash) }, [0, op]),
    shapeLayer(3, "shadow", [group("shadow", [ell([46, 10]), fill([0, 0, 0, 1])])], { p: { s: true, x: kf(xKeys), y: st(GY + 3) }, s: kf(shadowS), o: kf(shadowO) }, [0, op]),
    shapeLayer(4, "trail", [group("trail", [path(v, vi, vo), trim(0, kf(trimKeys)), stroke(rgba(RGB.w, 0.55), 2, [5, 7])])], {}, [0, op]),
    shapeLayer(5, "ground", [group("ground", [rect([400, 3], 1.5), fill([1, 1, 1, 0.18])], { p: [240, GY + 1.5] })], {}, [0, op]),
  ]);
}

// Scene 4: a 1.5 s star pop that loops cleanly.
function popData() {
  const op = 45, PAL = [RGB.y, RGB.b, RGB.p, RGB.g];
  const dots = Array.from({ length: 8 }, (_, i) => {
    const a = (i / 8) * Math.PI * 2, r = 112;
    return group(`dot${i}`, [ell([14, 14]), fill(rgba(PAL[i % 4]))], {
      p: kf([[4, [0, 0], OUT], [26, [Math.cos(a) * r, Math.sin(a) * r]]]),
      s: kf([[4, [100, 100]], [30, [0, 0]]]),
    });
  });
  return comp("pop", 300, 300, 30, op, [
    shapeLayer(1, "star", [group("star", [star(5, 70, 30), fill(rgba(RGB.y))])], {
      p: [150, 150, 0], r: kf([[0, -72], [44, 72]]),
      s: kf([[0, [0, 0, 100], OUT], [12, [118, 118, 100]], [18, [100, 100, 100]], [36, [100, 100, 100]], [44, [0, 0, 100]]]),
    }, [0, op]),
    shapeLayer(2, "dots", dots, { p: [150, 150, 0] }, [0, op]),
    shapeLayer(3, "ring", [group("ring", [ell([120, 120]), stroke(rgba(RGB.b), kf([[2, 14], [26, 0]]))], { s: kf([[2, [40, 40], OUT], [26, [190, 190]]]) })], { p: [150, 150, 0] }, [0, op]),
  ]);
}

// Scene 5: weather card with two text layers and shapes bound to the "accent" slot.
function cardData(city, temp, accent) {
  const op = 150, A = rgba(accent);
  const textIn = (y0, y1, d) => ({ o: kf([[d, 0], [d + 14, 100], [op - 16, 100], [op - 4, 0]]), p: kf([[d, [240, y0, 0], OUT], [d + 14, [240, y1, 0]]]) });
  const pop = (d) => kf([[d, [0, 0], OUT], [d + 14, [100, 100]], [op - 16, [100, 100]], [op - 4, [0, 0]]]);
  return comp("card", 480, 300, 30, op, [
    textLayer(1, "city", { t: city, s: 60, lh: 66 }, textIn(188, 174, 6), [0, op]),
    textLayer(2, "temp", { t: temp, s: 22, lh: 26, fc: accent }, textIn(226, 214, 12), [0, op]),
    shapeLayer(3, "bar", [group("bar", [rect([140, 5], 2.5), fill(A, "accent")], { s: kf([[16, [0, 100], OUT], [34, [100, 100]], [op - 16, [100, 100]], [op - 4, [0, 100]]]) })], { p: [240, 240, 0] }, [0, op]),
    shapeLayer(4, "sun", [
      group("core", [ell([40, 40]), fill(A, "accent")], { s: pop(0) }),
      group("rays", [star(12, 42, 30), fill(A, "accent")], { o: 55, s: pop(4), r: kf([[0, 0, LIN], [op, 90]]) }),
    ], { p: [240, 84, 0] }, [0, op]),
    shapeLayer(5, "card", [group("card", [rect([440, 268], 24), fill([0.12, 0.13, 0.17, 1])])], { p: [240, 150, 0] }, [0, op]),
  ], { fonts: FONTS, slots: { accent: { p: { a: 0, k: A } } } });
}

// Scene 6: a clock hand and a sliding ball, two seconds long at any frame rate.
function tickData(fr) {
  const op = fr * 2;
  const ticks = Array.from({ length: 12 }, (_, i) => group(`t${i}`, [rect([3, i % 3 ? 8 : 14], 1.5, [0, -70])], { r: i * 30 }));
  return comp("tick", 400, 240, fr, op, [
    shapeLayer(1, "hand", [group("hub", [ell([14, 14]), fill(rgba(RGB.w))]), group("hand", [rect([6, 66], 3, [0, -30]), fill(rgba(RGB.y))])], { p: [200, 100, 0], r: kf([[0, 0, LIN], [op, 360]]) }, [0, op]),
    shapeLayer(2, "dial", [group("ticks", [...ticks, fill([1, 1, 1, 0.45])]), group("rim", [ell([170, 170]), stroke([1, 1, 1, 0.2], 2)])], { p: [200, 100, 0] }, [0, op]),
    shapeLayer(3, "ball", [group("ball", [ell([24, 24]), fill(rgba(RGB.b))])], { p: kf([[0, [40, 212, 0]], [fr, [360, 212, 0]], [op, [40, 212, 0]]]) }, [0, op]),
    shapeLayer(4, "track", [group("track", [rect([340, 2], 1), fill([1, 1, 1, 0.2])], { p: [200, 212] })], {}, [0, op]),
  ]);
}

Showcase.run({ scenes: [
  {
    id: "status", title: "狀態動畫",
    api: "anim.playSegments(markers.success, true)",

        const { c, g, buf } = p, w = c.clientWidth, h = c.clientHeight, dpr = Math.min(2, devicePixelRatio || 1);
        if (!w || !h) return;
        if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, w, h);
        g.strokeStyle = i ? "#4cc9f0" : "#ff8c42";
        g.lineWidth = 1.6;
        g.beginPath();
        const step = w / 89;
        buf.forEach((v, k) => {
          const x = w - (buf.length - 1 - k) * step, y = h - 4 - v * (h - 8);
          if (k) g.lineTo(x, y); else g.moveTo(x, y);
        });
        g.stroke();
      }
      ctx.raf(() => anims.forEach((a, i) => {
        if (!a.isLoaded) return;
        if (a.currentFrame !== seen[i]) { seen[i] = a.currentFrame; counts[i]++; }
        const p = plots[i];
        p.buf.push(a.currentFrame / a.totalFrames);
        if (p.buf.length > 90) p.buf.shift();
        draw(p, i);
      }));
      ctx.interval(() => {
        rates.forEach((el, i) => { el.innerHTML = `每秒畫面更新 <b>${counts[i]}</b> 次・素材 ${fr} fps × ${speed}`; });
        counts.fill(0);
      }, 1000);
      ctx.group(["8 fps", "12 fps", "24 fps"], 1, (i) => { fr = [8, 12, 24][i]; load(); });
      ctx.slider("速度", { min: 0.25, max: 2, step: 0.25, value: 1, format: (v) => `${v}×` }, (v) => { speed = v; anims.forEach((a) => a.setSpeed(v)); });
      load();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "lottie.loadAnimation({ renderer, loop: true }) × N",
    desc: "同時播放 N 份 status.json（12 個形狀圖層、240 影格，各自從隨機影格開始），逐級加倍直到掉到 30 FPS 以下。可切換 SVG 與 Canvas 渲染器重新量測：SVG 每格改寫大量 path 屬性再交給瀏覽器合成，Canvas 每格清空並重畫每張點陣。",
    hint: "按「自動加壓」開始・切換渲染器後再測一次",
    async mount(ctx) {
      ctx.html(`<div class="sview"><div class="sgrid"></div></div>`);
      const view = ctx.$(".sview"), grid = ctx.$(".sgrid");
      ctx.controls.classList.add("bottom");
      const lot = players(ctx);
      let renderer = "svg", cells = [];
      ctx.group(["SVG", "Canvas"], 0, (i) => {
        renderer = ["svg", "canvas"][i];
        const n = cells.length;
        setCount(0);
        setCount(n);
      });
      const text = await statusJSON();
      if (!ctx.active) return;

      function add() {
        const cell = document.createElement("div");
        cell.className = "scell";
        grid.append(cell);
        const a = lot.load({ container: cell, renderer, loop: true, autoplay: true, animationData: JSON.parse(text) });
        a.addEventListener("DOMLoaded", () => a.goToAndPlay(Math.floor(Math.random() * a.totalFrames), true));
        cells.push({ cell, a });
      }
      function remove() {
        const it = cells.pop();
        lot.drop(it.a);
        it.cell.remove();
      }
      // Pick the column count that gives the largest square cells for n players.
      function layout() {
        const W = grid.clientWidth, H = grid.clientHeight, n = Math.max(1, cells.length);
        let best = 0, cols = 1;
        for (let c = 1; c <= n; c++) {
          const s = Math.min(W / c, H / Math.ceil(n / c));
          if (s > best) { best = s; cols = c; }
        }
        const size = Math.max(6, Math.floor(best));
        grid.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
        grid.style.gridAutoRows = `${size}px`;
        if (renderer !== "svg") cells.forEach((it) => fit(it.a));
      }
      function setCount(n) {
        while (cells.length < n) add();
        while (cells.length > n) remove();
        layout();
      }
      onBox(ctx, view, layout);
      ctx.ramp({
        label: "同時播放", unit: "個", steps: [4, 8, 16, 32, 64, 128, 256], minFps: 30,
        apply(n) { setCount(n); },
        metrics: () => ({
          渲染器: renderer === "svg" ? "SVG" : "Canvas",
          "DOM 節點": view.getElementsByTagName("*").length,
        }),
        note: "所有實例共用 lottie 的同一個 requestAnimationFrame 迴圈，但每個實例各自計算圖層變形與路徑。SVG 的成本集中在 DOM 屬性寫入與合成，Canvas 則是每格重畫點陣，兩者差距會隨裝置的 CPU、GPU 與像素比而變。",
      });
    },
  },
] });
</script>
</body>
</html>
