<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucide 示範：圖示瀏覽器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 250px; gap: 12px; padding: 12px 12px 46px; }
  .main { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
  .search { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); }
  .search svg { color: var(--muted); flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 14px; }
  .search .count { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .chip { flex: none; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: none; color: var(--fg); font: 12px var(--font); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
  .grid { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); grid-auto-rows: 58px; gap: 6px; align-content: start; scrollbar-width: thin; padding-right: 2px; }
  .ico { display: grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: rgba(255,255,255,.03); color: var(--ink, var(--fg)); cursor: pointer; transition: background .12s, transform .12s; }
  .ico:hover { background: rgba(255,255,255,.08); border-color: var(--line); transform: translateY(-1px); }
  .ico.sel { border-color: var(--accent); background: rgba(247,223,30,.08); }
  .more { grid-column: 1 / -1; height: 40px; }
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .preview { display: grid; place-items: center; height: 150px; border-radius: 12px; background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.06), transparent 70%), var(--bg-2); border: 1px solid var(--line); color: var(--ink, var(--fg)); }
  .name { font: 600 15px var(--mono); word-break: break-all; }
  pre { margin: 0; padding: 8px 10px; border-radius: 8px; background: #0a0c0f; border: 1px solid var(--line); font: 11px/1.5 var(--mono); color: #b9c7d6; white-space: pre-wrap; word-break: break-all; }
  .ctl { display: grid; grid-template-columns: 52px 1fr 30px; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .ctl output { font: 11px var(--mono); text-align: right; }
  .swatches { display: flex; gap: 6px; }
  .swatches button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatches button[aria-pressed="true"] { border-color: #fff; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translate(-50%, -60px); padding: 8px 14px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px; transition: transform .25s; z-index: 80; display: flex; gap: 6px; align-items: center; }
  .toast.on { transform: translate(-50%, 0); }
  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .side { flex-direction: row; align-items: center; gap: 10px; }
    .preview { width: 64px; height: 64px; flex: none; }
    .preview svg { width: 44px; height: 44px; }
    .search .count { display: none; }
    .side .ctl, .side .swatches, .side pre { display: none; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); grid-auto-rows: 48px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="main">
    <label class="search"><i data-lucide="search"></i><input id="q" placeholder="搜尋英文名稱，例如 heart、cloud、arrow" autocomplete="off"><span class="count" id="count"></span></label>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="side">
    <div class="preview" id="preview"></div>
    <div>
      <div class="name" id="name">heart</div>
      <div class="muted" style="font-size:12px">點圖示即複製名稱</div>
    </div>
    <pre id="code"></pre>
    <div class="ctl"><span>粗細</span><input type="range" id="stroke" min="0.75" max="3" step="0.25" value="2"><output id="strokeV">2</output></div>
    <div class="ctl"><span>尺寸</span><input type="range" id="size" min="16" max="40" step="2" value="26"><output id="sizeV">26</output></div>
    <div class="swatches" id="swatches"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="hint">搜尋或點分類・點圖示複製名稱・右側調粗細與顏色</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@1.50.0/dist/umd/lucide.min.js"></script>
<script>
// Lucide icon browser: every icon node from lucide.icons, rendered with lucide.createElement, searchable and copyable.
const { icons, createElement, createIcons } = lucide;
createIcons({ icons, attrs: { width: 18, height: 18 } });

// lucide.icons also contains aliases that share the same node; keep the first name for each node.
const seen = new Map();
for (const [pascal, node] of Object.entries(icons)) if (!seen.has(node)) seen.set(node, pascal);
const toKebab = (s) => s.replace(/([a-z])([A-Z0-9])/g, "$1-$2").replace(/([0-9])([A-Z])/g, "$1-$2").toLowerCase();
const ALL = [...seen].map(([node, pascal]) => ({ node, name: toKebab(pascal) }));

const CATS = [["全部", ""], ["箭頭", "arrow"], ["天氣", "cloud|sun|moon|snow|wind|umbrella|rain"], ["檔案", "file|folder"], ["人物", "user|users|person|baby|smile"],
  ["交通", "car|bus|train|plane|bike|ship"], ["購物", "shopping|cart|wallet|credit|store|tag"], ["音樂", "music|audio|headphones|mic|volume"], ["地圖", "map|pin|compass|navigation|globe"]];
const COLORS = ["#ecebe6", "#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const PAGE = 240;
let list = ALL, shown = 0, cat = "", selected = ALL.find((i) => i.name === "heart") || ALL[0];
const $ = (id) => document.getElementById(id);

function attrs() {
  return { width: +$("size").value, height: +$("size").value, "stroke-width": +$("stroke").value };
}

function filter() {
  const q = $("q").value.trim().toLowerCase();
  const re = cat ? new RegExp(cat) : null;
  list = ALL.filter((i) => (!q || i.name.includes(q)) && (!re || re.test(i.name)));
  $("count").textContent = `${list.length} / ${ALL.length}`;
  $("grid").innerHTML = "";
  shown = 0;
  renderMore();
}

function renderMore() {
  const grid = $("grid");
  grid.querySelector(".more")?.remove();
  const frag = document.createDocumentFragment();
  const a = attrs();
  list.slice(shown, shown + PAGE).forEach((item) => {
    const b = document.createElement("button");
    b.className = "ico" + (item === selected ? " sel" : "");
    b.title = item.name;
    b.item = item;
    b.append(createElement(item.node, a));
    frag.append(b);
  });
  shown = Math.min(list.length, shown + PAGE);
  if (shown < list.length) {
    const m = document.createElement("button");
    m.className = "btn more";
    m.textContent = `再顯示 ${Math.min(PAGE, list.length - shown)} 個（剩 ${list.length - shown} 個）`;
    frag.append(m);
  }
  if (!list.length) grid.innerHTML = `<div class="muted" style="grid-column:1/-1;padding:20px">找不到「${$("q").value}」，試試 heart、star、book</div>`;
  grid.append(frag);
}

function preview() {
  $("preview").replaceChildren(createElement(selected.node, { width: 96, height: 96, "stroke-width": +$("stroke").value }));
  $("name").textContent = selected.name;
  $("code").textContent = `<i data-lucide="${selected.name}"></i>\nlucide.createIcons();`;
}

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Clipboard API is often blocked inside iframes; fall back to a temporary textarea.
    const t = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(t);
    t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  }
}

let toastTimer;
function toast(html) {
  $("toast").innerHTML = html;
  $("toast").classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("on"), 1600);
}

$("grid").addEventListener("click", async (e) => {
  if (e.target.closest(".more")) return renderMore();
  const b = e.target.closest(".ico");
  if (!b) return;
  document.querySelector(".ico.sel")?.classList.remove("sel");
  b.classList.add("sel");
  selected = b.item;
  preview();
  const ok = await copy(selected.name);
  toast(ok ? `已複製「${selected.name}」` : `瀏覽器不允許自動複製，請手動選取右側名稱`);
});

$("chips").innerHTML = CATS.map(([label, re]) => `<button class="chip" data-re="${re}" aria-pressed="${re === ""}">${label}</button>`).join("");
$("chips").addEventListener("click", (e) => {
  const c = e.target.closest(".chip");
  if (!c) return;
  cat = c.dataset.re;
  document.querySelectorAll(".chip").forEach((x) => x.setAttribute("aria-pressed", x === c));
  filter();
});

$("swatches").innerHTML = COLORS.map((c, i) => `<button style="background:${c}" data-c="${c}" aria-pressed="${i === 0}" aria-label="顏色 ${i + 1}"></button>`).join("");
$("swatches").addEventListener("click", (e) => {
  const c = e.target.dataset.c;
  if (!c) return;
  document.body.style.setProperty("--ink", c);
  document.querySelectorAll("#swatches button").forEach((x) => x.setAttribute("aria-pressed", x === e.target));
});

function restyle() {
  $("strokeV").textContent = $("stroke").value;
  $("sizeV").textContent = $("size").value;
  const a = attrs();
  document.querySelectorAll("#grid .ico svg").forEach((svg) => Object.entries(a).forEach(([k, v]) => svg.setAttribute(k, v)));
  preview();
}
$("stroke").addEventListener("input", restyle);
$("size").addEventListener("input", restyle);
$("q").addEventListener("input", filter);

filter();
preview();
</script>
</body>
</html>
