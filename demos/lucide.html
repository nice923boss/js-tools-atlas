<script>
// Lucide showcase: browse/search, stroke maths, createIcons vs createElement, custom icon nodes,
// CSS/stroke animation, SVG export and a createIcons throughput benchmark.
const { icons, createElement, createIcons } = lucide;
const { h, fmtMs, fmtCompact } = Showcase;
const TAGS_URL = "https://cdn.jsdelivr.net/npm/lucide-static@1.50.0/tags.json";

// lucide.icons also contains aliases that share the same node; keep the first name for each node.
const toKebab = (s) => s.replace(/([a-z])([A-Z0-9])/g, "$1-$2").replace(/([0-9])([A-Z])/g, "$1-$2").toLowerCase();
const seen = new Map();
for (const [pascal, node] of Object.entries(icons)) if (!seen.has(node)) seen.set(node, pascal);
const ALL = [...seen].map(([node, pascal]) => ({ node, pascal, name: toKebab(pascal) }));
const BY_NAME = new Map(ALL.map((i) => [i.name, i]));
const toPascal = (name) => name.replace(/(^|-)([a-z0-9])/g, (_, __, c) => c.toUpperCase());
const nodeOf = (name) => BY_NAME.get(name)?.node || icons[toPascal(name)];
const icon = (name, attrs = {}) => createElement(nodeOf(name), attrs);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const openTag = (el) => el.outerHTML.slice(0, el.outerHTML.indexOf(">") + 1);
const nodeJSON = (node) => "[\n" + node.map((c) => "  " + JSON.stringify(c)).join(",\n") + "\n]";
const COLORS = [["預設", "var(--fg)"], ["黃", "var(--c1)"], ["藍", "var(--c2)"], ["粉", "var(--c3)"], ["綠", "var(--c4)"], ["橘", "var(--c5)"], ["紫", "var(--c6)"]];

let tagsPromise = null;
const loadTags = () => (tagsPromise ||= fetch(TAGS_URL).then((r) => (r.ok ? r.json() : Promise.reject(new Error(`HTTP ${r.status}`)))));

async function copy(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    // Clipboard API is often blocked inside iframes; fall back to a temporary textarea.
    const t = Object.assign(document.createElement("textarea"), { value: text });
    document.body.append(t);
    t.select();
    const ok = document.execCommand("copy");
    t.remove();
    return ok;
  }
}
function toaster(ctx) {
  const el = h("div", { class: "lu-toast" });
  ctx.el.append(el);
  let t;
  return (text) => {
    el.textContent = text;
    el.classList.add("on");
    clearTimeout(t);
    t = setTimeout(() => el.classList.remove("on"), 1600);
  };
}
function download(name, blob) {
  const url = URL.createObjectURL(blob);
  h("a", { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

// Custom icon nodes drawn on the same 24x24 grid, 2px stroke, round caps as the official set.
const CUSTOM_BASE = {
  BubbleTea: [["path", { d: "M5 8h14" }], ["path", { d: "M7 8a5 3 0 0 1 10 0" }], ["path", { d: "m6.5 8 1.3 12.2A2 2 0 0 0 9.8 22h4.4a2 2 0 0 0 2-1.8L17.5 8" }],
    ["path", { d: "m13 5 1.5-3.5 3 1" }], ["circle", { cx: "10", cy: "17.5", r: "1" }], ["circle", { cx: "14", cy: "17.5", r: "1" }], ["circle", { cx: "12", cy: "14", r: "1" }]],
  Dumpling: [["path", { d: "M3 18a9 7.5 0 0 1 18 0z" }], ["path", { d: "M10.5 10.6 12 8.5l1.5 2.1" }], ["path", { d: "M12 10.5c-1.4 2-2 4.3-2 7.5" }],
    ["path", { d: "M12 10.5c1.4 2 2 4.3 2 7.5" }], ["path", { d: "M2 21h20" }], ["path", { d: "M8 6c0-1 1-1.2 1-2.5" }], ["path", { d: "M16 6c0-1 1-1.2 1-2.5" }]],
  Taipei101: [["path", { d: "M12 2v3" }], ["path", { d: "M10.5 5h3v2.5h-3z" }], ["path", { d: "M8.5 7.5h7l-1 3h-5z" }], ["path", { d: "M8.5 10.5h7l-1 3h-5z" }],
    ["path", { d: "M8.5 13.5h7l-1 3h-5z" }], ["path", { d: "M9 16.5h6V22H9z" }], ["path", { d: "M5 22h14" }]],
  Scooter: [["circle", { cx: "5.5", cy: "17.5", r: "2.5" }], ["circle", { cx: "18.5", cy: "17.5", r: "2.5" }], ["path", { d: "M18.5 17.5 16 5h-2.5" }],
    ["path", { d: "M8 17.5h6.5l2-5" }], ["path", { d: "M3 14.5 4.5 10h6" }]],
};
const CUSTOM_LABEL = { BubbleTea: "珍珠奶茶 bubble-tea", Dumpling: "小籠包 dumpling", Taipei101: "台北 101 taipei-101", Scooter: "機車 scooter" };

Showcase.run({
  scenes: [
  // 1. Original signature demo, now with official tags search.
  {
    id: "browse", title: "圖示瀏覽器",
    api: "lucide.icons + createElement(node, attrs)",
    desc: "把 lucide.icons 去掉別名後的全部圖示用 createElement 畫成網格；搜尋同時比對名稱與 lucide-static 的 tags.json 標籤，分類也用標籤判斷。點圖示複製名稱，右側即時調整尺寸、線寬與顏色。",
    hint: "搜尋英文名稱或標籤，例如 weather、money；點圖示複製名稱",
    mount(ctx) {
      ctx.html(`<div class="lu-fill lu-app">
        <div class="lu-main">
          <label class="lu-search"><span class="lu-si"></span><input placeholder="搜尋名稱或標籤，例如 heart、weather、money" autocomplete="off"><span class="lu-count mono"></span></label>
          <div class="lu-chips"></div>
          <div class="lu-grid"></div>
        </div>
        <div class="lu-side">
          <div class="lu-preview"></div>
          <div><div class="lu-name"></div><div class="lu-tags"></div></div>
          <pre class="lu-pre"></pre>
          <label class="lu-ctl"><span>線寬</span><input type="range" class="lu-stroke" min="0.75" max="3" step="0.25" value="2"><output class="mono"></output></label>
          <label class="lu-ctl"><span>尺寸</span><input type="range" class="lu-size" min="16" max="40" step="2" value="26"><output class="mono"></output></label>
          <div class="lu-sw"></div>
        </div>
      </div>`);
      const toast = toaster(ctx);
      const CATS = [["全部", ""], ["箭頭", "arrow|direction"], ["天氣", "weather|cloud|sun|rain|snow|wind"], ["檔案", "file|folder|document"],
        ["人物", "user|person|people|account"], ["交通", "transport|vehicle|car|train|plane"], ["購物", "shopping|cart|ecommerce|payment|money"],
        ["音樂", "music|audio|sound"], ["地圖", "map|location|navigation"]];
      const PAGE = 240;
      const q = ctx.$(".lu-search input"), grid = ctx.$(".lu-grid"), count = ctx.$(".lu-count");
      const stroke = ctx.$(".lu-stroke"), size = ctx.$(".lu-size");
      ctx.$(".lu-si").append(icon("search", { width: 16, height: 16 }));
      let TAGS = {}, tagNote = "標籤載入中", list = ALL, shown = 0, cat = "", selected = BY_NAME.get("heart") || ALL[0];
      const tagsOf = (it) => TAGS[it.name] || [];
      const attrs = () => ({ width: +size.value, height: +size.value, "stroke-width": +stroke.value });

      function filter() {
        const s = q.value.trim().toLowerCase();
        const re = cat ? new RegExp(cat) : null;
        const byName = [], byTag = [];
        for (const it of ALL) {
          if (re && !re.test(it.name + " " + tagsOf(it).join(" "))) continue;
          if (!s || it.name.includes(s)) byName.push(it);
          else if (tagsOf(it).some((t) => t.includes(s))) byTag.push(it);
        }
        list = byName.concat(byTag);
        count.textContent = `${list.length} / ${ALL.length}・${tagNote}`;
        grid.innerHTML = "";
        shown = 0;
        more();
      }
      function more() {
        grid.querySelector(".lu-more")?.remove();

    desc: "Lucide 圖示是純線條 SVG，每個子元素都能用 getTotalLength() 量長度，再用 stroke-dasharray 與 stroke-dashoffset 做描邊動畫；整顆 svg 則能直接套 CSS 旋轉、縮放、搖晃。下排可點：送出按鈕會先轉圈再描出勾勾，愛心會切換填色。",

        anims.splice(0).forEach((a) => a.cancel());

          [...svg.children].forEach((el, j) => {
            const len = el.getTotalLength ? el.getTotalLength() : 50;
            el.style.strokeDasharray = `${len} ${len}`;
            anims.push(el.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }],

      ctx.select("圖示", ["rocket", "heart", "coffee", "camera", "cloud-sun", "zap", "gift", "palette"], name, (v) => { name = v; draw(); });
      ctx.slider("尺寸", { min: 16, max: 128, step: 8, value: size }, (v) => { size = v; draw(); });
      ctx.slider("線寬", { min: 1, max: 3, step: 0.25, value: sw }, (v) => { sw = v; draw(); });
      ctx.select("stroke", [{ value: "#f72585", label: "#f72585" }, { value: "#4cc9f0", label: "#4cc9f0" }, { value: "#7bd389", label: "#7bd389" }, { value: "currentColor", label: "currentColor" }], color, (v) => { color = v; draw(); });
      draw();
    },
  },

  // 7. Stress: replace N placeholders with createIcons (or build N nodes with createElement), timing the replace and the layout.
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "createIcons({ icons, root }) × N",
    desc: "先放 N 個 <i data-lucide> 占位（輪流使用 1,600 多種圖示），量 createIcons 掃描並替換成 <svg> 的時間，以及接著強制排版的時間；也可改成用 createElement 直接建立再一次插入，比較省掉 querySelectorAll 與逐一 replaceChild 的差距。",
    hint: "按「開始測試」；切換建立方式後再測一次",
    mount(ctx) {
      ctx.html(`<div class="lu-stress"><div class="lu-sinfo mono">尚未測試</div><div class="lu-sgrid"></div></div>`);
      const grid = ctx.$(".lu-sgrid"), info = ctx.$(".lu-sinfo");
      let mode = 0;
      ctx.controls.classList.add("bottom");
      ctx.group(["createIcons 替換", "createElement 直接建立"], 0, (i) => { mode = i; });
      const A = { width: 16, height: 16 };
      ctx.bench({
        label: "圖示數", unit: "個", sizes: [500, 2000, 5000, 10000, 25000, 50000],
        prepare(n) {
          grid.textContent = "";
          if (mode === 0) {
            let s = "";
            for (let i = 0; i < n; i++) s += `<i data-lucide="${ALL[i % ALL.length].name}"></i>`;
            grid.innerHTML = s;
          }
          void grid.offsetHeight;
        },
        run(n) {
          const t0 = performance.now();
          if (mode === 0) createIcons({ icons, root: grid, attrs: A });
          else {
            const frag = document.createDocumentFragment();
            for (let i = 0; i < n; i++) frag.append(createElement(ALL[i % ALL.length].node, A));
            grid.append(frag);
          }
          const t1 = performance.now();
          void grid.offsetHeight;
          grid.lastElementChild?.getBoundingClientRect();
          const t2 = performance.now();
          const nodes = grid.getElementsByTagName("*").length;
          info.textContent = `${fmtCompact(n)} 個圖示・${fmtCompact(nodes)} 個 DOM 節點・建立 ${fmtMs(t1 - t0)}・排版 ${fmtMs(t2 - t1)}`;
          return `建立 ${fmtMs(t1 - t0)}・${fmtCompact(nodes)} 節點`;
        },
        note: "耗時含建立 SVG 節點與第一次排版；createIcons 每個占位都要讀屬性、轉 PascalCase 查表、合併 class 再 replaceChild，所以比一次插入 DocumentFragment 慢。每個圖示平均 3 到 5 個子元素，5 萬個圖示約 20 萬個 DOM 節點。超過 2 秒的級距之後略過。",
      });
    },
  },
  ],
});
</script>
</body>
</html>
