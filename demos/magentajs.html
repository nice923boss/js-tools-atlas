<script src="_shared/showcase.js"></script>
<script>
// Magenta.js showcase: MusicRNN, MusicVAE and Coconet running in the browser with TensorFlow.js, plus players and visualizers.
const MM_URL = "https://cdn.jsdelivr.net/npm/@magenta/music@1.23.1/dist/magentamusic.js";
const CKPT = "https://storage.googleapis.com/magentadata/js/checkpoints/";
const SOUNDFONT = "https://storage.googleapis.com/magentadata/js/soundfonts/salamander";
const LIB_BYTES = 2494289;
// Checkpoint sizes: sum of the weight shards listed in each weights_manifest.json (GCS sends no Timing-Allow-Origin, so the browser cannot report them).
const MODELS = {
  rnn: { cls: "MusicRNN", path: "music_rnn/basic_rnn", bytes: 12988568, label: "MusicRNN basic_rnn" },
  improv: { cls: "MusicRNN", path: "music_rnn/chord_pitches_improv", bytes: 5601432, label: "MusicRNN chord_pitches_improv" },
  vae: { cls: "MusicVAE", path: "music_vae/mel_2bar_small", bytes: 17695080, label: "MusicVAE mel_2bar_small" },
  coco: { cls: "Coconet", path: "coconet/bach", bytes: 553436, label: "Coconet bach" },
};
const QPM = 110, SPQ = 4, VEL = 80;
const stepSec = (qpm) => 60 / qpm / SPQ;
const SOLFEGE = { 0: "Do", 2: "Re", 4: "Mi", 5: "Fa", 7: "Sol", 9: "La", 11: "Si" };
const N = ([pitch, s, e], k = "seed", v = 0) => ({ pitch, s, e, k, v });
// "Little Bee" (a Taiwanese children's song) and "Two Tigers" (Frere Jacques), 4 steps per quarter note
const BEE = [[67,0,4],[64,4,8],[64,8,16],[65,16,20],[62,20,24],[62,24,32],[60,32,36],[62,36,40],[64,40,44],[65,44,48],[67,48,52],[67,52,56],[67,56,64]];
const BEE_BASS = [[48,0,8],[55,8,16],[43,16,24],[50,24,32],[48,32,40],[52,40,48],[43,48,56],[48,56,64]];
const TIGERS = [[60,0,4],[62,4,8],[64,8,12],[60,12,16],[60,16,20],[62,20,24],[64,24,28],[60,28,32]];
const { fmt, fmtMs } = Showcase;
const mb = (b) => `${fmt(b / 1048576, 1)} MB`;
const isBlack = (p) => [1, 3, 6, 8, 10].includes(p % 12);
const end = (notes) => notes.reduce((m, n) => Math.max(m, n.e), 0);
const cssVar = (k, d) => getComputedStyle(document.documentElement).getPropertyValue(k).trim() || d;
const FONT = cssVar("--font", "'Noto Sans TC', 'Microsoft JhengHei', sans-serif"), MONO = cssVar("--mono", "ui-monospace, Consolas, monospace");
let lastGen = null; // most recent generated piece, reused by the visualizer scene

function abortIfGone(ctx) { if (!ctx.active) throw new DOMException("Scene unmounted", "AbortError"); }

// ---------- note sequences ----------
function Q(notes, total = end(notes)) {
  return {
    notes: notes.map((n) => ({ pitch: n.pitch, velocity: n.vel || VEL, instrument: n.v || 0, quantizedStartStep: n.s, quantizedEndStep: n.e })),
    totalQuantizedSteps: total, quantizationInfo: { stepsPerQuarter: SPQ },
  };
}
function UQ(seq, qpm = QPM) {
  const u = mm.sequences.unquantizeSequence(seq, qpm);
  u.tempos = [{ time: 0, qpm }];
  return u;
}
const U = (notes, total, qpm) => UQ(Q(notes, total), qpm);
const fromSeq = (seq, off = 0, k = "gen") => seq.notes.map((n) => ({ pitch: n.pitch, s: off + (n.quantizedStartStep || 0), e: off + (n.quantizedEndStep || 0), k, v: n.instrument || 0 }));
function stats(notes) {
  if (!notes.length) return { n: 0, range: 0, kinds: 0, leap: 0 };
  const ps = notes.map((n) => n.pitch);
  let leap = 0;
  for (let i = 1; i < ps.length; i++) leap += Math.abs(ps[i] - ps[i - 1]);
  return { n: notes.length, range: Math.max(...ps) - Math.min(...ps), kinds: new Set(ps).size, leap: ps.length > 1 ? leap / (ps.length - 1) : 0 };
}
function downloadMidi(seq, name) {
  const url = URL.createObjectURL(new Blob([mm.sequenceProtoToMidi(seq)], { type: "audio/midi" }));
  Showcase.h("a", { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ---------- loading: library and models are fetched once and shared by every scene ----------
async function lib(ctx) {
  if (!window.mm) {
    const st = ctx.status(`下載 Magenta.js（約 ${mb(LIB_BYTES)}）…`);
    try { await Showcase.load(MM_URL); } finally { st.done(); }
  }
  abortIfGone(ctx);
  return window.mm;
}
async function needModel(ctx, key, gate) {
  const m = MODELS[key];
  if (!m.ready && !m.job) {
    const tags = [...(gate.tags || []), `模型約 ${mb(m.bytes)}`];
    if (!window.mm) tags.push(`函式庫約 ${mb(LIB_BYTES)}`);
    await ctx.gate({ ...gate, tags, button: gate.button || "載入模型" });
  }
  if (!m.job) {
    m.job = (async () => {
      await Showcase.load(MM_URL);
      const t0 = performance.now();
      const model = new mm[m.cls](CKPT + m.path);
      await model.initialize();
      m.ms = performance.now() - t0;
      m.ready = model;
      return model;
    })().catch((e) => { m.job = null; throw e; });
  }
  if (!m.ready) {
    const st = ctx.status(`下載 ${m.label}（約 ${mb(m.bytes)}）並初始化…`);
    st.progress(0.3);
    try { await m.job; } finally { st.done(); }
  }
  abortIfGone(ctx);
  return m.ready;
}
const loadInfo = (key) => `${MODELS[key].label} <b>${mb(MODELS[key].bytes)}</b>・載入 <b>${fmtMs(MODELS[key].ms || 0)}</b>`;

// ---------- playback: one SoundFontPlayer (salamander piano) shared by all scenes ----------
let PIANO = null, SYNTH = null;
const piano = () => PIANO || (PIANO = new mm.SoundFontPlayer(SOUNDFONT));
function transport(ctx, { onState, onNote } = {}) {
  let token = 0, player = null;
  const tp = { playing: false, tag: null, anchor: null, qpm: QPM, live: QPM, synth: false };
  tp.stop = () => {
    token++;
    if (player) { player.stop(); player.callbackObject = null; player = null; }
    if (tp.playing) { tp.playing = false; tp.tag = null; tp.anchor = null; if (onState) onState(false); }
  };
  tp.play = async (seq, tag = null) => {
    tp.stop();
    const my = token, p = tp.synth ? (SYNTH || (SYNTH = new mm.Player())) : piano();
    Object.assign(tp, { playing: true, tag, qpm: seq.tempos[0].qpm, anchor: null });
    if (onState) onState(true);
    try {
      p.resumeContext();
      if (p.loadSamples) await p.loadSamples(seq);
      if (my !== token || !ctx.active) return;
      player = p;
      p.callbackObject = {
        run: (n) => {
          if (my !== token) return;
          tp.anchor = { step: n.startTime / stepSec(tp.qpm), at: performance.now() };
          if (onNote) onNote(n, tp.anchor.step);
        },
        stop: () => { if (my === token) tp.stop(); },
      };
      // Samples are loaded above, so start the base player directly; no async gap where a stop could be missed.
      const done = mm.BasePlayer ? mm.BasePlayer.prototype.start.call(p, seq) : p.start(seq);
      if (tp.live !== tp.qpm) p.setTempo(tp.live);
      await done;
    } catch (e) {
      if (my === token) { console.error(e); tp.stop(); ctx.hint(`播放失敗：${e.message}`); }
    }
  };
  tp.setTempo = (q) => { tp.live = q; if (player) player.setTempo(q); };
  tp.step = () => (tp.playing && tp.anchor ? tp.anchor.step + (performance.now() - tp.anchor.at) / 1000 / stepSec(tp.live) : -1);
  ctx.onCleanup(tp.stop);
  return tp;
}

// ---------- piano roll on canvas ----------
const COLORS = { seed: "#f7df1e", held: "#fff7b8", gen: "#4cc9f0", out: "#f72585", v0: "#f7df1e", v1: "#f72585", v2: "#4cc9f0", v3: "#9d8cff" };
function fit(cv) {
  const dpr = Math.min(devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h, g];
}
// o: { notes, total, lo, hi, split, labels:[a,b], chords:[{s,e,name}], step, busy, empty, axis, color(n), top }
function drawRoll(cv, o) {
  const [W, H, g] = fit(cv);
  g.clearRect(0, 0, W, H);
  if (W < 4 || H < 4) return;
  const notes = o.notes || [], total = Math.max(o.total || 0, 16);
  const ps = notes.filter((n) => n.k !== "chord").map((n) => n.pitch);
  let lo = o.lo ?? (ps.length ? Math.min(...ps) - 2 : 58), hi = o.hi ?? (ps.length ? Math.max(...ps) + 2 : 80);
  if (hi - lo < 14) { const c = (hi + lo) / 2; lo = Math.floor(c - 7); hi = Math.ceil(c + 7); }
  const gx = o.axis === false ? 0 : 30, top = o.top ?? (o.labels || o.chords ? 22 : 4), bottom = o.bottom ?? 4;
  const sw = (W - gx - 4) / total, rh = (H - top - bottom) / (hi - lo + 1);
  const X = (s) => gx + s * sw, Y = (p) => top + (hi - p) * rh;
  for (let p = lo; p <= hi; p++) {
    if (isBlack(p)) { g.fillStyle = "rgba(0,0,0,.22)"; g.fillRect(gx, Y(p), W - gx, rh); }
    if (p % 12 === 0) {
      g.fillStyle = "rgba(255,255,255,.07)"; g.fillRect(gx, Y(p) + rh - 1, W - gx, 1);
      if (gx) { g.fillStyle = "#9b998f"; g.font = `10.5px ${MONO}`; g.textBaseline = "middle"; g.fillText(`C${p / 12 - 1}`, 4, Y(p) + rh / 2); }
    }
  }
  for (let s = 0; s <= total; s += 4) { g.fillStyle = s % 16 ? "rgba(255,255,255,.05)" : "rgba(255,255,255,.15)"; g.fillRect(Math.round(X(s)), top, 1, H - top); }
  g.textBaseline = "middle";
  if (o.chords) o.chords.forEach((c, i) => {
    g.fillStyle = i % 2 ? "rgba(157,140,255,.16)" : "rgba(157,140,255,.26)"; g.fillRect(X(c.s), 2, X(c.e) - X(c.s) - 1, 18);
    g.fillStyle = "#e4e0ff"; g.font = `600 11.5px ${MONO}`; g.fillText(c.name, X(c.s) + 5, 11);
  });
  if (o.split != null) {
    g.fillStyle = "rgba(76,201,240,.045)"; g.fillRect(X(o.split), top, W - X(o.split), H - top);
    g.save(); g.strokeStyle = "rgba(247,223,30,.6)"; g.setLineDash([4, 4]); g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(X(o.split), 2); g.lineTo(X(o.split), H); g.stroke(); g.restore();
    if (o.labels) {
      g.font = `600 12px ${FONT}`;
      g.fillStyle = "#f7df1e"; g.fillText(o.labels[0], gx + 6, 11);
      g.fillStyle = "#4cc9f0"; g.fillText(o.labels[1], X(o.split) + 8, 11);
    }
  }
  const ph = o.step ?? -1;
  for (const n of notes) {
    const x = X(n.s) + 1, y = Y(n.pitch) + 1, w = Math.max(2, (n.e - n.s) * sw - 2), h = Math.max(2, rh - 2);
    if (n.k === "chord") { g.fillStyle = "rgba(157,140,255,.22)"; g.fillRect(x, y, w, h); continue; }
    const on = ph >= n.s && ph < n.e;
    g.save();
    if (on) { g.shadowColor = "rgba(255,255,255,.9)"; g.shadowBlur = 14; }
    g.fillStyle = on ? "#ffffff" : (o.color ? o.color(n) : COLORS[n.k] || COLORS.gen);
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, w, h, Math.min(3, h / 2)); else g.rect(x, y, w, h);
    g.fill(); g.restore();
  }
  const zx = o.split != null ? X(o.split) : gx, zw = W - zx;
  if (o.busy) {
    const t = (performance.now() / 900) % 1, gr = g.createLinearGradient(zx + zw * (t - 0.3), 0, zx + zw * t, 0);
    gr.addColorStop(0, "rgba(76,201,240,0)"); gr.addColorStop(1, "rgba(76,201,240,.22)");
    g.fillStyle = gr; g.fillRect(zx, top, zw, H - top);
  }
  const msg = o.busy || (!notes.length || (o.split != null && !notes.some((n) => n.k === "gen"))) && o.empty;
  if (msg) {
    g.fillStyle = o.busy ? "#cfefff" : "rgba(207,239,255,.6)"; g.textAlign = "center"; g.font = `${o.busy ? "600 14px" : "13px"} ${FONT}`;
    const lines = g.measureText(msg).width > zw - 16 ? msg.split("|") : [msg.replace("|", "")];
    lines.forEach((l, i) => g.fillText(l, zx + zw / 2, top + (H - top) / 2 + (i - (lines.length - 1) / 2) * 18));
    g.textAlign = "start";
  }
  if (ph >= 0 && ph <= total) {
    g.save(); g.shadowColor = "rgba(255,255,255,.8)"; g.shadowBlur = 8; g.fillStyle = "#fff";
    g.fillRect(X(ph) - 1, top - 2, 2, H - top + 2); g.restore();
  }
}

// ---------- shared mini-roll grid (VAE scenes) ----------
function cellGrid(host, items, { label, color, sel, playing, onClick }) {
  host.innerHTML = items.map((_, i) => `<div class="mg-cell" data-i="${i}"><span></span><canvas></canvas></div>`).join("");
  const cells = [...host.children];
  cells.forEach((c, i) => c.addEventListener("click", () => onClick(i)));
  return (step) => {
    const all = items.flatMap((x) => x || []), ps = all.map((n) => n.pitch);
    const lo = ps.length ? Math.min(...ps) - 2 : 55, hi = ps.length ? Math.max(...ps) + 2 : 79;
    cells.forEach((c, i) => {
      c.classList.toggle("sel", sel() === i);
      c.classList.toggle("on", playing() === i);
      c.firstChild.textContent = label(i, items[i]);
      drawRoll(c.lastChild, { notes: items[i] || [], total: 32, lo, hi, axis: false, top: 18, step: playing() === i ? step : -1, color: color && ((n) => color(i, n)), empty: items[i] ? "" : "…" });
    });
  };
}

Showcase.run({ scenes: [
  {
    id: "continue", title: "接續旋律",
    api: "new mm.MusicRNN(ckpt).continueSequence(seq, 64, temperature) ・ SoundFontPlayer.playNoteDown() / start()",
    desc: "原版示範：在螢幕鋼琴彈一小段旋律（按久一點是長音），basic_rnn 會在瀏覽器內往後寫 4 小節，並用 Salamander 鋼琴取樣播放。每按一次「接續旋律」都會寫出不同版本。",
    hint: "點下方鋼琴彈幾個音，再按「✨ 接續旋律」；▶ 播放才會出聲",
    async mount(ctx) {

          label: (i) => (i === 0 ? "A" : i === items.length - 1 ? "B" : `${i}/${items.length - 1}`), sel: () => -1, playing,
          color: (i) => mix(i / Math.max(1, items.length - 1)),
          onClick: (i) => { if (!items[i]) return; if (tp.playing && tp.tag === i) tp.stop(); else tp.play(U(items[i], 32), i); },
        });
        paint(-1);
      };
      ctx.raf(() => { if (tp.playing) paint(tp.tag === "all" ? tp.step() % 32 : tp.step()); });
      ctx.onResize(regrid);
      ctx.select("B", [{ value: "tigers", label: "兩隻老虎" }, { value: "random", label: "隨機取樣" }], bKind, (v) => { bKind = v; run(true); });
      ctx.slider("段數", { min: 3, max: 9, step: 1, value: count }, (v) => { count = v; });
      ctx.button("內插", () => run(false), { primary: true });
      const allBtn = ctx.button("▶ 播放全部", () => {
        if (tp.playing && tp.tag === "all") return tp.stop();
        if (!items.length || items.some((x) => !x)) return;
        tp.play(UQ(mm.sequences.concatenate(items.map((x) => Q(x, 32)))), "all");
      });
      async function run(newB) {
        if (!vae) return;
        const my = ++job;
        tp.stop();
        items = new Array(count).fill(null); regrid();
        let tB = 0;
        if (bKind === "random" && (newB || B === TIG)) { const t0 = performance.now(); B = fromSeq((await vae.sample(1, 0.8))[0], 0, "gen"); tB = performance.now() - t0; }
        if (bKind === "tigers") B = TIG;
        if (!ctx.active || my !== job) return;
        const t0 = performance.now(), out = await vae.interpolate([Q(A, 32), Q(B, 32)], count);
        const ms = performance.now() - t0;
        if (!ctx.active || my !== job) return;
        items = out.map((s) => fromSeq(s, 0, "gen"));
        regrid();
        foot.innerHTML = `interpolate(${count}) <span class="mg-n">${fmtMs(ms)}</span>${tB ? `・取樣 B <span class="mg-n">${fmtMs(tB)}</span>` : ""}・mel_2bar_small <span class="mg-n">${mb(MODELS.vae.bytes)}</span>`;
      }
      regrid();
      vae = await needModel(ctx, "vae", { icon: "🌈", title: "MusicVAE 內插", desc: "在兩段旋律的潛在向量之間取點，聽旋律怎麼一步步變形。", tags: ["會發出聲音"] });
      await run(true);
    },
  },
  {
    id: "coconet", title: "巴哈和聲",
    api: "new mm.Coconet(ckpt).infill(seq, { numIterations, temperature }) ・ mm.sequences.mergeConsecutiveNotes() ・ mm.sequenceProtoToMidi()",
    desc: "Coconet 用巴哈 306 首四部合唱訓練，給它女高音旋律，它會反覆擦掉、重填另外三個聲部（Gibbs 取樣），迭代越多次和聲越穩定。輸出每個音只有 1 步長，用 mergeConsecutiveNotes() 合併成長音後才好讀。",
    hint: "調高迭代次數再按「配和聲」，比較和聲是否更順；可下載 MIDI",
    async mount(ctx) {
      ctx.html(`<div class="mg-board"><div class="mg-roll"><canvas></canvas><div class="mg-legend">${["女高音（給定）", "女低音", "男高音", "男低音"].map((l, i) => `<span><i style="background:${COLORS["v" + i]}"></i>${l}</span>`).join("")}</div><div class="mg-chip">等待載入模型</div></div></div>`);
      const cv = ctx.$("canvas"), chip = ctx.$(".mg-chip");
      let bars = 2, iters = 16, temp = 0.99, voices = [], busy = false, coco = null, job = 0;
      const sop = () => BEE.filter((n) => n[1] < bars * 16).map((n) => N(n, "seed", 0));
      const tp = transport(ctx, { onState: (on) => { playBtn.textContent = on ? "■ 停止" : "▶ 播放"; } });
      const all = () => [...sop(), ...voices];
      ctx.select("旋律", [{ value: "2", label: "小蜜蜂 2 小節" }, { value: "4", label: "小蜜蜂 4 小節" }], "2", (v) => { bars = +v; voices = []; run(); });
      ctx.slider("迭代", { min: 4, max: 96, step: 4, value: iters }, (v) => { iters = v; });
      ctx.slider("溫度", { min: 0.3, max: 1.5, step: 0.01, value: temp, format: (v) => v.toFixed(2) }, (v) => { temp = v; });
      ctx.button("🎼 配和聲", () => run(), { primary: true });
      const playBtn = ctx.button("▶ 播放", () => (tp.playing ? tp.stop() : voices.length && tp.play(U(all(), bars * 16))));
      ctx.button("⬇ MIDI", () => voices.length && downloadMidi(U(all(), bars * 16), "magenta-coconet-bach.mid"));
      ctx.raf(() => drawRoll(cv, { notes: all(), total: bars * 16, lo: 34, hi: 72, top: 26, step: tp.step(), busy: busy && `Coconet 迭代 ${iters} 次中…`, color: (n) => COLORS["v" + n.v] }));
      async function run() {
        if (!coco) return;
        const my = ++job;
        tp.stop(); busy = true;
        try {
          const t0 = performance.now();
          const out = await coco.infill(Q(sop(), bars * 16), { temperature: temp, numIterations: iters });
          const ms = performance.now() - t0;
          if (!ctx.active || my !== job) return;
          const merged = mm.sequences.mergeConsecutiveNotes(out);
          voices = fromSeq(merged, 0, "gen").filter((n) => n.v > 0);
          lastGen = { notes: all(), total: bars * 16, label: "Coconet 四部和聲" };
          chip.innerHTML = `迭代 <b>${iters}</b> 次・<b>${fmtMs(ms)}</b>・原始 <b>${out.notes.length}</b> 個 1 步音，合併後 <b>${merged.notes.length}</b> 音・${loadInfo("coco")}`;
        } finally { if (my === job) busy = false; }
      }
      coco = await needModel(ctx, "coco", { icon: "🎼", title: "Coconet 巴哈四部和聲", desc: "給一條女高音旋律，讓 Coconet 補上女低音、男高音、男低音。", tags: ["會發出聲音"] });
      await run();
    },
  },
  {
    id: "visualizers", title: "視覺化器",
    api: "PianoRollSVGVisualizer ・ PianoRollCanvasVisualizer ・ WaterfallSVGVisualizer ・ StaffSVGVisualizer ・ Player.setTempo()",
    desc: "Magenta 內建四種 NoteSequence 視覺化器，播放器的回呼把正在響的音交給 redraw(note, true)，畫面就會標亮並自動捲動。播放器可選 SoundFontPlayer（鋼琴取樣）或 Player（Tone.js 合成器），速度可以在播放中即時調整。",
    hint: "切換視覺化器與音源，播放中拖動速度滑桿",
    async mount(ctx) {
      ctx.html(`<div class="mg-board"><div class="mg-viz"></div><div class="mg-h mg-foot"></div></div>`);
      const host = ctx.$(".mg-viz"), foot = ctx.$(".mg-foot");
      await lib(ctx);
      const DUET = { notes: [...BEE.map((n) => N(n, "seed", 0)), ...BEE_BASS.map((n) => N(n, "gen", 1))], total: 64, label: "雙聲部小蜜蜂" };
      let src = "duet", type = 0, seq = null, viz = null, piece = DUET;
      const tp = transport(ctx, {
        onState: (on) => { playBtn.textContent = on ? "■ 停止" : "▶ 播放"; if (!on && viz) viz.clearActiveNotes(); },
        onNote: (n) => { if (viz) viz.redraw(n, true); },
      });
      const TYPES = ["鋼琴卷 SVG", "鋼琴卷 Canvas", "瀑布", "五線譜"];
      function build() {
        piece = src === "last" && lastGen ? lastGen : DUET;
        seq = U(piece.notes, piece.total);
        host.innerHTML = "";
        host.scrollTop = 0; host.scrollLeft = 0;
        const W = host.clientWidth - 4, H = host.clientHeight - 4, ps = piece.notes.map((n) => n.pitch);
        const lo = Math.min(...ps) - 1, hi = Math.max(...ps) + 1;
        const roll = { noteHeight: Math.max(3, (H - 4) / (hi - lo + 1)), pixelsPerTimeStep: Math.max(24, W / seq.totalTime), minPitch: lo - 1, maxPitch: hi, noteRGB: "8, 41, 64", activeNoteRGB: "240, 84, 119" };
        if (type === 0) { const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); host.append(svg); viz = new mm.PianoRollSVGVisualizer(seq, svg, roll); }
        else if (type === 1) { const c = document.createElement("canvas"); host.append(c); viz = new mm.PianoRollCanvasVisualizer(seq, c, roll); }
        else {
          const div = document.createElement("div"); host.append(div);
          if (type === 2) {
            const whites = 7 * (Math.floor(hi / 12) - Math.floor(lo / 12) + 1);
            viz = new mm.WaterfallSVGVisualizer(seq, div, { showOnlyOctavesUsed: true, whiteNoteWidth: Math.max(8, Math.min(24, Math.floor(W / (whites + 1)))), noteHeight: 6, pixelsPerTimeStep: 60, noteRGB: "8, 41, 64", activeNoteRGB: "240, 84, 119" });
          } else viz = new mm.StaffSVGVisualizer(seq, div, { noteHeight: 10, pixelsPerTimeStep: 0, noteRGB: "8, 41, 64", activeNoteRGB: "240, 84, 119" });
        }
        foot.innerHTML = `${piece.label}・<span class="mg-n">${piece.notes.length}</span> 音・<span class="mg-n">${seq.totalTime.toFixed(1)}</span> 秒・${TYPES[type]}`;
      }
      ctx.group(TYPES, type, (i) => { type = i; build(); });
      ctx.select("來源", [{ value: "duet", label: "雙聲部小蜜蜂" }, { value: "last", label: "前面場景最後生成的" }], src, (v) => {
        src = v; tp.stop();
        if (v === "last" && !lastGen) ctx.hint("還沒有生成結果：先到前面任一個生成場景跑一次，這裡暫時顯示雙聲部小蜜蜂");
        build();
      });
      ctx.select("音源", [{ value: "piano", label: "SoundFontPlayer 鋼琴" }, { value: "synth", label: "Player 合成器" }], "piano", (v) => { tp.stop(); tp.synth = v === "synth"; });
      ctx.slider("速度", { min: 60, max: 180, step: 5, value: QPM, format: (v) => `${v} BPM` }, (v) => tp.setTempo(v));
      const playBtn = ctx.button("▶ 播放", () => (tp.playing ? tp.stop() : tp.play(seq)), { primary: true });
      ctx.button("⬇ MIDI", () => downloadMidi(seq, "magenta-sequence.mid"));
      ctx.onResize(() => { if (!tp.playing) build(); });
      build();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "await rnn.continueSequence(seed, n, temperature) 計時 ・ mm.tf.memory()",
    desc: "用同一段 2 小節種子，讓 basic_rnn 逐級生成 16 到 512 步並計時；切換溫度再跑一次，右側表格會把各溫度的耗時並排，驗證溫度對速度有沒有影響。",
    hint: "按「開始測試」；換溫度後再跑一次比較表格",
    async mount(ctx) {
      ctx.html(`<div class="mg-stress"><div class="mg-roll"><canvas></canvas><div class="mg-chip">尚未執行</div></div><table class="mg-table"></table><div class="mg-foot"></div></div>`);
      const cv = ctx.$("canvas"), chip = ctx.$(".mg-chip"), table = ctx.$(".mg-table"), foot = ctx.$(".mg-foot");
      const SIZES = [16, 32, 64, 128, 256, 512], TEMPS = [0.5, 1.0, 1.5, 2.0], seed = BEE.slice(0, 6).map((n) => N(n));
      const res = {};
      let temp = 1.0, latest = null;
      ctx.controls.classList.add("bottom");
      ctx.select("溫度", TEMPS.map((t) => ({ value: String(t), label: t.toFixed(1) })), "1", (v) => { temp = +v; paint(); });
      function paint() {
        table.innerHTML = `<tr><th>溫度＼步數</th>${SIZES.map((s) => `<th>${s}</th>`).join("")}</tr>` + TEMPS.map((t) =>
          `<tr class="${t === temp ? "cur" : ""}"><th>${t.toFixed(1)}</th>${SIZES.map((s) => `<td>${res[t] && res[t][s] ? fmtMs(res[t][s]) : "-"}</td>`).join("")}</tr>`).join("");
        if (window.mm) {
          const m = mm.tf.memory();
          foot.innerHTML = `後端 <span class="mg-n">${mm.tf.getBackend()}</span>・張量 <span class="mg-n">${fmt(m.numTensors)}</span>・tf 記憶體 <span class="mg-n">${mb(m.numBytes)}</span>`;
        }
        drawRoll(cv, latest ? { notes: latest.notes, total: latest.total, split: 32, labels: ["種子", `生成 ${latest.n} 步 →`], lo: 46, hi: 86 } : { notes: [], total: 64, empty: "生成結果會畫在這裡" });
      }
      ctx.onResize(paint);
      paint();
      const rnn = await needModel(ctx, "rnn", { icon: "⏱️", title: "生成速度極限測試", desc: "逐級加長生成步數並計時，比較不同溫度的耗時。", tags: ["不會發出聲音"] });
      paint();
      ctx.bench({
        label: "生成步數", unit: "步", sizes: SIZES, target: 3000, budget: 15000, title: "極限測試：MusicRNN 生成步數",
        run: async (n) => {
          const t0 = performance.now(), out = await rnn.continueSequence(Q(seed, 32), n, temp);
          const ms = performance.now() - t0;
          abortIfGone(ctx);
          (res[temp] = res[temp] || {})[n] = ms;
          latest = { notes: [...seed, ...fromSeq(out, 32)], total: 32 + n, n };
          chip.innerHTML = `最新：<b>${n}</b> 步・溫度 <b>${temp.toFixed(1)}</b>・<b>${out.notes.length}</b> 音・<b>${fmtMs(ms)}</b>`;
          paint();
          return `${out.notes.length} 音`;
        },
        note: "MusicRNN 一步一步往後生成：每一步跑一次 LSTM 前向運算，再從機率分布抽樣，所以耗時大致隨步數線性增加，而且無法平行。溫度只是在抽樣前縮放 logits，理論上不改變計算量，換溫度重跑即可在右側表格對照。第一次呼叫含 WebGL 著色器編譯；無頭或沒有 GPU 的環境會退回軟體繪圖，整體會慢很多。",
      });
    },
  },
] });
</script>
</body>
</html>
