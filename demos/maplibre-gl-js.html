<script type="module">
import * as maplibregl from "https://cdn.jsdelivr.net/npm/maplibre-gl@6.11.2/dist/maplibre-gl.mjs";
const { h, fmt, fmtCompact, fmtMs } = Showcase;

// ---------- shared data (simulated, for demonstration only) ----------
// Rough outline of the main island [lng, lat], hand-traced for point-in-polygon tests (not survey grade)
const TW = [[121.51, 25.30], [121.62, 25.22], [121.75, 25.15], [121.87, 25.12], [122.00, 25.01], [121.86, 24.87], [121.84, 24.70], [121.87, 24.58], [121.80, 24.42],
  [121.74, 24.25], [121.64, 24.05], [121.61, 23.95], [121.52, 23.70], [121.47, 23.45], [121.38, 23.12], [121.21, 22.84], [121.08, 22.67], [120.93, 22.40], [120.88, 22.18],
  [120.86, 21.97], [120.83, 21.90], [120.72, 21.93], [120.70, 22.05], [120.63, 22.29], [120.50, 22.42], [120.32, 22.55], [120.26, 22.66], [120.20, 22.85], [120.14, 23.00],
  [120.06, 23.12], [120.10, 23.30], [120.14, 23.46], [120.14, 23.62], [120.19, 23.79], [120.30, 23.97], [120.41, 24.10], [120.52, 24.28], [120.62, 24.45], [120.76, 24.62],
  [120.90, 24.83], [121.02, 24.98], [121.15, 25.07], [121.30, 25.13], [121.41, 25.18]];
// Population centres used to synthesise demo data [lat, lng, weight, sigma(deg)]
const CITIES = [[25.045, 121.53, 1.0, .06], [25.01, 121.45, .7, .06], [24.99, 121.30, .55, .06], [24.80, 120.98, .35, .05], [24.56, 120.82, .12, .05], [24.15, 120.67, .8, .07],
  [24.07, 120.54, .3, .05], [23.70, 120.53, .15, .06], [23.48, 120.45, .22, .05], [22.99, 120.21, .55, .06], [22.63, 120.31, .8, .06], [22.67, 120.49, .2, .05],
  [24.75, 121.75, .18, .05], [23.98, 121.60, .12, .04], [22.76, 121.14, .08, .04], [25.13, 121.74, .15, .03], [23.91, 120.69, .1, .05]];
const TW_BOUNDS = [[120.03, 21.88], [122.01, 25.31]];
const PALETTE = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const KINDS = ["餐飲", "購物", "交通", "文教", "醫療"];
const KCOL = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#9d8cff"];
const KIND_COLOR = ["match", ["get", "kind"], ...KINDS.flatMap((k, i) => [k, KCOL[i]]), "#888888"];
const EMPTY = { type: "FeatureCollection", features: [] };

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function inTaiwan(lng, lat) {
  let inside = false;
  for (let i = 0, j = TW.length - 1; i < TW.length; j = i++) {
    const [xi, yi] = TW[i], [xj, yj] = TW[j];
    if ((yi > lat) !== (yj > lat) && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// 100k simulated locations clustered around cities, flat [lat, lng, ...]
let POOL = null;
function points() {
  if (POOL) return POOL;
  const r = rng(7), total = 100000, out = new Float64Array(total * 2);
  const wsum = CITIES.reduce((s, c) => s + c[2], 0);
  for (let i = 0; i < total;) {
    let lat, lng;
    if (r() < 0.12) { lat = 21.9 + r() * 3.4; lng = 120.05 + r() * 1.95; }
    else {
      let k = r() * wsum, c = CITIES[0];
      for (const cc of CITIES) { k -= cc[2]; if (k <= 0) { c = cc; break; } }
      lat = c[0] + gauss(r) * c[3]; lng = c[1] + gauss(r) * c[3] * 1.1;
    }
    if (!inTaiwan(lng, lat)) continue;
    out[i * 2] = lat; out[i * 2 + 1] = lng; i++;
  }
  return (POOL = out);
}
// Simulated stores: kind, score (drifts higher towards the north so aggregates differ), average spend
const storeCache = new Map();
function stores(n) {
  if (storeCache.has(n)) return storeCache.get(n);
  const P = points(), r = rng(11), W = [0.36, 0.24, 0.14, 0.16, 0.10], features = new Array(n);
  for (let i = 0; i < n; i++) {
    const j = (i * 7919) % 100000, lat = P[j * 2], lng = P[j * 2 + 1];
    let u = r(), k = 0;
    while (k < 4 && (u -= W[k]) > 0) k++;
    const score = Math.round(Math.max(0, Math.min(100, 38 + (lat - 21.9) * 7 + gauss(r) * 14)));
    const amt = Math.round(Math.exp(5.5 + 0.8 * gauss(r)));
    features[i] = { type: "Feature", id: i + 1, properties: { id: i + 1, kind: KINDS[k], score, amt }, geometry: { type: "Point", coordinates: [lng, lat] } };
  }
  const fc = { type: "FeatureCollection", features };
  storeCache.set(n, fc);
  return fc;
}

// ---------- map helpers ----------
// Key-free sources only: OpenFreeMap styles / tiles, AWS Terrain Tiles (terrarium), OpenFreeMap Natural Earth raster.
const OFM = "https://tiles.openfreemap.org";
const GLYPHS = `${OFM}/fonts/{fontstack}/{range}.pbf`;
const FONT = ["Noto Sans Regular"], FONT_B = ["Noto Sans Bold"];
// Network requests go through a custom protocol whose fetch ignores MapLibre's abort signal: tiles cancelled by
// camera moves or map.remove() finish downloading in the background instead of surfacing as net::ERR_ABORTED.
maplibregl.addProtocol("nab", async (params) => {
  const url = "https://" + params.url.slice(6);
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
  const data = params.type === "json" ? await r.json() : params.type === "string" ? await r.text() : await r.arrayBuffer();
  return { data };
});
const viaNab = (url) => (url.startsWith("https://") ? { url: "nab://" + url.slice(8) } : undefined);
const styleCache = {};
async function getStyle(name) {
  styleCache[name] ??= fetch(`${OFM}/styles/${name}`).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); });
  try { return structuredClone(await styleCache[name]); }
  catch (e) { console.warn(`[maplibre] style ${name} failed:`, e); delete styleCache[name]; return null; }
}
getStyle("dark");
const fallbackStyle = () => ({ version: 8, glyphs: GLYPHS, sources: {}, layers: [{ id: "background", type: "background", paint: { "background-color": "#12151b" } }] });
const abortError = () => Object.assign(new Error("場景已切換"), { name: "AbortError" });

function notice(ctx, where = ctx.el) {
  if (!ctx.active || ctx.el.querySelector(".ml-note")) return;
  where.append(h("div", { class: "ml-note", text: "底圖或圖磚載入失敗（可能離線或被阻擋），資料圖層仍可操作" }));
}
async function makeMap(ctx, { style, ...opts }, host = ctx.$(".ml-map")) {
  let failed = false;
  if (typeof style === "string") { const s = await getStyle(style); failed = !s; style = s || fallbackStyle(); }
  if (!ctx.active) throw abortError();
  const map = new maplibregl.Map({ container: host, style, attributionControl: { compact: true }, transformRequest: viaNab, ...opts });
  ctx.onCleanup(() => {
    const c = map.getCanvas();
    const gl = c.getContext("webgl2") || c.getContext("webgl");
    map.remove();
    if (gl && !gl.isContextLost()) gl.getExtension("WEBGL_lose_context")?.loseContext();
  });
  map.on("error", (e) => { console.warn("[maplibre]", e.error?.message || e.error || e); notice(ctx, host.parentElement); });
  if (failed) notice(ctx, host.parentElement);
  // style.load (not load): data layers and controls appear before every basemap tile has arrived.
  await map.once("style.load");
  if (!ctx.active) throw abortError();
  return map;
}
// Info box as a MapLibre IControl, so it stacks with attribution / navigation controls.
function panel(map, position = "bottom-left", cls = "") {
  const el = h("div", { class: `maplibregl-ctrl ml-box ${cls}` });
  map.addControl({ onAdd: () => el, onRemove: () => el.remove() }, position);
  return el;
}
// Brighten OpenFreeMap "dark" a little so data layers sit on a readable base.
function tuneDark(map) {
  const set = (id, prop, v) => map.getLayer(id) && map.setPaintProperty(id, prop, v);
  set("background", "background-color", "#12151b");
  set("water", "fill-color", "#0b1b2b");
  set("landcover_wood", "fill-pattern", undefined);
  set("landcover_wood", "fill-color", "#17201b");
  set("landuse_park", "fill-color", "#17201b");
  set("landuse_residential", "fill-color", "#1a1d24");
  for (const l of map.getStyle().layers) if (l.id.startsWith("place_")) set(l.id, "text-color", "#8b939e");
}
// Insert data layers below the label layers.
const labelLayer = (map) => map.getStyle().layers.find((l) => l.type === "symbol" && /^(place_|highway_name)/.test(l.id))?.id;
const setSeg = (seg, i) => [...seg.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
const gradCss = (stops) => `linear-gradient(90deg, ${stops.map(([c, p]) => `${c} ${p}%`).join(", ")})`;
const storePopup = (p) => `<b>店家 #${p.id}</b>（示意資料）<br>類別 ${p.kind}・評分 <span class="mono">${p.score}</span><br>平均客單 <span class="mono">${fmt(p.amt)}</span> 元`;
const pointer = (map, layer) => {
  map.on("mouseenter", layer, () => (map.getCanvas().style.cursor = "pointer"));
  map.on("mouseleave", layer, () => (map.getCanvas().style.cursor = ""));
};

// ---------- 1. city ----------
const PLACES = [
  { name: "台北 101", c: [121.5645, 25.0335], z: 15.6, b: -25, sub: "信義計畫區，建築依高度上色" },
  { name: "台北車站", c: [121.5170, 25.0470], z: 15.8, b: 30, sub: "交通樞紐與周邊商辦" },
  { name: "台中七期", c: [120.6440, 24.1600], z: 15.2, b: -60, sub: "新市政中心與豪宅天際線" },
  { name: "高雄 85 大樓", c: [120.3002, 22.6116], z: 15.4, b: 70, sub: "亞洲新灣區與港口" },
];
const HEIGHT = ["coalesce", ["get", "render_height"], 0];
const H_STOPS = [[0, "#2b3445"], [25, "#4cc9f0"], [80, "#9d8cff"], [180, "#f72585"], [400, "#f7df1e"]];

// ---------- 2. expressions ----------
const ZR = (a, b) => ["interpolate", ["linear"], ["zoom"], 7, a, 13, b];
const HI = [">=", ["get", "score"], 75];
const EXPRS = [
  { name: "match", color: KIND_COLOR, radius: ZR(2, 6), keys: KINDS.map((k, i) => [KCOL[i], k]), what: "依類別字串對應顏色" },
  { name: "interpolate", color: ["interpolate", ["linear"], ["get", "score"], 25, "#2b3445", 45, "#4cc9f0", 60, "#f7df1e", 80, "#f72585"], radius: ZR(2, 6),
    keys: [["#2b3445", "25 分"], ["#4cc9f0", "45"], ["#f7df1e", "60"], ["#f72585", "80"]], what: "依評分連續內插" },
  { name: "step", color: ["step", ["get", "amt"], "#3a4150", 200, "#7bd389", 500, "#ff8c42", 1500, "#f72585"],
    radius: ZR(["step", ["get", "amt"], 1.2, 200, 2, 500, 3, 1500, 4.5], ["step", ["get", "amt"], 3, 200, 5, 500, 8, 1500, 12]),
    keys: [["#3a4150", "< 200 元"], ["#7bd389", "200+"], ["#ff8c42", "500+"], ["#f72585", "1500+"]], what: "依客單價分級，顏色與半徑一起變" },
  { name: "case", color: ["case", ["all", ["==", ["get", "kind"], "餐飲"], HI], "#f7df1e", HI, "#4cc9f0", "#3a4150"],
    radius: ZR(["case", HI, 3, 1.4], ["case", HI, 7, 3]),
    keys: [["#f7df1e", "75 分以上餐飲"], ["#4cc9f0", "75 分以上其他"], ["#3a4150", "其餘"]], what: "多條件判斷，凸顯高分餐飲" },
];

// ---------- 3. heatmap ----------
const HEAT_RAMPS = {
  "岩漿": ["#3b0f70", "#8c2981", "#de4968", "#fe9f6d", "#fcfdbf"],
  "冰藍": ["#0c2c55", "#1565a8", "#2aa1d8", "#7fd6f2", "#effcff"],
  "霓虹": ["#3a0ca3", "#7209b7", "#f72585", "#4cc9f0", "#f7df1e"],
};
const heatColor = (c) => ["interpolate", ["linear"], ["heatmap-density"], 0, "rgba(0,0,0,0)", 0.02, c[0], 0.12, c[1], 0.32, c[2], 0.62, c[3], 1, c[4]];
let HEAT = null;
function heatData() {
  if (HEAT) return HEAT;
  const P = points(), r = rng(5), features = new Array(100000);
  for (let i = 0; i < 100000; i++) {
    features[i] = { type: "Feature", properties: { amt: Math.round(Math.exp(5.5 + 0.8 * gauss(r))) }, geometry: { type: "Point", coordinates: [P[i * 2 + 1], P[i * 2]] } };
  }
  return (HEAT = { type: "FeatureCollection", features });
}

// ---------- 6. terrain ----------
const TERRARIUM = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";
const DEM = { type: "raster-dem", tiles: [TERRARIUM], encoding: "terrarium", tileSize: 256, maxzoom: 14 };
const PEAKS = [["玉山", 3952, 120.9572, 23.4700], ["雪山", 3886, 121.2317, 24.3833], ["秀姑巒山", 3825, 121.0583, 23.4975], ["南湖大山", 3742, 121.4383, 24.3614],
  ["中央尖山", 3705, 121.4167, 24.3117], ["奇萊主山北峰", 3607, 121.3306, 24.1272], ["合歡山主峰", 3417, 121.2711, 24.1419], ["北大武山", 3092, 120.7631, 22.6264]];
const VIEWS = [
  { name: "玉山", center: [120.935, 23.425], zoom: 11.7, bearing: 25, pitch: 64 },
  { name: "雪山", center: [121.205, 24.345], zoom: 11.7, bearing: 20, pitch: 64 },
  { name: "太魯閣", center: [121.56, 24.15], zoom: 12, bearing: -70, pitch: 64 },
];
const RELIEF = [[-2000, "#08162a"], [-1, "#123047"], [0, "#2d4a3a"], [300, "#3f6b3a"], [1000, "#7d8f47"], [2000, "#a3865a"], [3000, "#c6b39a"], [3800, "#f4f4f4"]];

// ---------- 7. globe ----------
const TPE = [121.56, 25.04];
const DEST = [["東京", 139.69, 35.69], ["首爾", 126.98, 37.57], ["香港", 114.17, 22.32], ["新加坡", 103.82, 1.35], ["曼谷", 100.50, 13.76], ["雪梨", 151.21, -33.87],
  ["杜拜", 55.27, 25.20], ["倫敦", -0.13, 51.51], ["阿姆斯特丹", 4.90, 52.37], ["洛杉磯", -118.24, 34.05], ["舊金山", -122.42, 37.77], ["溫哥華", -123.12, 49.28],
  ["紐約", -74.01, 40.71], ["奧克蘭", 174.76, -36.85]];
// Great-circle path by spherical linear interpolation; longitudes are unwrapped so lines cross the antimeridian cleanly.
function arc(a, b, n = 96) {
  const rad = Math.PI / 180;
  const v = ([lng, lat]) => [Math.cos(lat * rad) * Math.cos(lng * rad), Math.cos(lat * rad) * Math.sin(lng * rad), Math.sin(lat * rad)];
  const A = v(a), B = v(b), d = Math.acos(Math.min(1, A[0] * B[0] + A[1] * B[1] + A[2] * B[2])), out = [];
  let prev = a[0];

    const x = s1 * A[0] + s2 * B[0], y = s1 * A[1] + s2 * B[1], z = s1 * A[2] + s2 * B[2];
    let lng = Math.atan2(y, x) / rad;
    while (lng - prev > 180) lng -= 360;
    while (lng - prev < -180) lng += 360;
    prev = lng;
    out.push([lng, Math.atan2(z, Math.hypot(x, y)) / rad]);
  }
  return { coords: out, km: d * 6371 };

  },
  {
    id: "terrain", title: "3D 地形",
    api: "raster-dem・terrain・color-relief・hillshade・sky・queryTerrainElevation",
    desc: "用免金鑰的 Terrarium 高程圖磚建立 3D 地形，color-relief 依海拔上色、hillshade 補上光影，sky 加上天空與霧；游標所在的海拔即時讀出。",
    hint: "上方切換山區；拖曳「誇張倍率」調整起伏；右鍵拖曳旋轉傾斜，滑鼠移動讀取海拔。",
    async mount(ctx) {
      ctx.html(`<div class="ml-map"></div>`);
      let ex = 1.4;
      const v0 = VIEWS[0];
      const style = {
        version: 8, glyphs: GLYPHS,
        sources: {
          dem: { ...DEM, attribution: '<a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md">AWS Terrain Tiles（Mapzen）</a>' },
          relief: { ...DEM },
          peaks: { type: "geojson", data: { type: "FeatureCollection", features: PEAKS.map(([name, ele, lng, lat]) => ({ type: "Feature", properties: { name, ele }, geometry: { type: "Point", coordinates: [lng, lat] } })) } },
        },
        terrain: { source: "dem", exaggeration: ex },
        sky: { "sky-color": "#0e1a33", "horizon-color": "#3a4f73", "fog-color": "#1b2436", "fog-ground-blend": 0.5, "horizon-fog-blend": 0.6, "sky-horizon-blend": 0.7, "atmosphere-blend": 0 },
        layers: [
          { id: "bg", type: "background", paint: { "background-color": "#0b0d10" } },
          { id: "relief", type: "color-relief", source: "relief", paint: { "color-relief-color": ["interpolate", ["linear"], ["elevation"], ...RELIEF.flat()] } },
          { id: "hillshade", type: "hillshade", source: "relief", paint: { "hillshade-method": "multidirectional", "hillshade-exaggeration": 0.45 } },
          { id: "peak-dot", type: "circle", source: "peaks", paint: { "circle-radius": 4, "circle-color": "#f7df1e", "circle-stroke-width": 1.5, "circle-stroke-color": "#0e1013" } },
          { id: "peak-label", type: "symbol", source: "peaks", layout: { "text-field": ["concat", ["get", "name"], "\n", ["to-string", ["get", "ele"]], " m"],
            "text-font": FONT, "text-size": 12, "text-offset": [0, -1.6], "text-anchor": "bottom" }, paint: { "text-color": "#ffffff", "text-halo-color": "#0e1013", "text-halo-width": 1.6 } },
        ],
      };
      const map = await makeMap(ctx, { style, center: v0.center, zoom: v0.zoom, bearing: v0.bearing, pitch: v0.pitch, maxPitch: 80 });
      map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
      const elev = h("span", { class: "num", text: "…" }), where = h("small", { class: "mono" });
      panel(map, "bottom-left").append(h("h4", { text: "海拔讀數" }), h("div", {}, elev, " ", where),
        h("div", { class: "ml-grad", style: `background:${gradCss(RELIEF.filter(([m]) => m >= 0).map(([m, c]) => [c, (m / 3800) * 100]))}` }),
        h("div", { class: "ml-ticks" }, ...["0", "1000", "2000", "3000", "3800 m"].map((t) => h("span", { text: t }))));
      const read = (ll) => {
        const e = map.queryTerrainElevation(ll);
        // null / 0 means the DEM tile under that point has not arrived yet (these views are all mountains).
        if (!e) { elev.textContent = "載入中…"; return; }
        elev.textContent = `${fmt(Math.max(0, e / ex))} m`;
        where.textContent = `${ll.lat.toFixed(4)}, ${ll.lng.toFixed(4)}`;
      };
      // Until the pointer is used, keep reading the map centre (DEM tiles stream in after load).
      let hovered = false;
      map.on("mousemove", (e) => { hovered = true; read(e.lngLat); });
      map.on("mouseout", () => { hovered = false; });
      ctx.interval(() => { if (!hovered) read(map.getCenter()); }, 700);
      ctx.group(VIEWS.map((v) => v.name), 0, (i) => { const v = VIEWS[i]; map.flyTo({ center: v.center, zoom: v.zoom, bearing: v.bearing, pitch: v.pitch, duration: 4000, essential: true }); });
      ctx.slider("誇張倍率", { min: 0.5, max: 3, step: 0.1, value: ex, format: (v) => `${v.toFixed(1)}×` }, (v) => { ex = v; map.setTerrain({ source: "dem", exaggeration: v }); });
      ctx.toggle("色階", true, (v) => map.setLayoutProperty("relief", "visibility", v ? "visible" : "none"));
      ctx.toggle("暈渲", true, (v) => map.setLayoutProperty("hillshade", "visibility", v ? "visible" : "none"));
    },
  },
  {
    id: "globe", title: "地球儀",
    api: "projection globe・setProjection・sky atmosphere・line-gradient・setData 動畫",
    desc: "樣式設定 projection 為 globe 就成為 3D 地球，縮放到區域時自動過渡回平面；台北出發的大圓航線以 line-gradient 著色，航機位置每幀用 setData 更新。",
    hint: "拖曳轉動地球，操作後自轉會停止；上方切換地球儀與麥卡托投影，或飛到台灣看投影過渡。",
    async mount(ctx) {
      ctx.html(`<div class="ml-map"></div>`);
      const host = ctx.$(".ml-map");
      const fitZ = () => { const r = host.getBoundingClientRect(); return Math.max(0, Math.log2((0.82 * Math.min(r.width, r.height)) / 130)); };
      const arcs = DEST.map(([name, lng, lat]) => ({ name, ...arc(TPE, [lng, lat]) }));
      const style = {
        version: 8, glyphs: GLYPHS, projection: { type: "globe" },
        sky: { "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 1, 5, 1, 7, 0] },
        sources: {
          ne: { type: "raster", tiles: [`${OFM}/natural_earth/ne2sr/{z}/{x}/{y}.png`], tileSize: 256, maxzoom: 6, attribution: '<a href="https://openfreemap.org">OpenFreeMap</a> Natural Earth' },
          arcs: { type: "geojson", lineMetrics: true, data: { type: "FeatureCollection", features: arcs.map((a) => ({ type: "Feature", properties: { name: a.name }, geometry: { type: "LineString", coordinates: a.coords } })) } },
          cities: { type: "geojson", data: { type: "FeatureCollection", features: [["台北", ...TPE], ...DEST].map(([name, lng, lat], i) => ({ type: "Feature", properties: { name, hub: i === 0 }, geometry: { type: "Point", coordinates: [lng, lat] } })) } },
          planes: { type: "geojson", data: EMPTY },
        },
        layers: [
          { id: "bg", type: "background", paint: { "background-color": "#0a1424" } },
          { id: "ne", type: "raster", source: "ne", paint: { "raster-brightness-max": 0.7, "raster-saturation": -0.4 } },
          // A translucent background drawn above the raster tints the shaded relief to the page's night palette.
          { id: "tint", type: "background", paint: { "background-color": "#0a1a33", "background-opacity": 0.72 } },
          { id: "arcs", type: "line", source: "arcs", layout: { "line-cap": "round" }, paint: { "line-width": 1.8, "line-gradient": ["interpolate", ["linear"], ["line-progress"], 0, "#f7df1e", 0.5, "#f72585", 1, "#4cc9f0"] } },
          { id: "cities", type: "circle", source: "cities", paint: { "circle-radius": ["case", ["get", "hub"], 5.5, 3.5], "circle-color": ["case", ["get", "hub"], "#f7df1e", "#4cc9f0"], "circle-stroke-width": 1, "circle-stroke-color": "#0e1013" } },
          { id: "planes-glow", type: "circle", source: "planes", paint: { "circle-radius": 9, "circle-color": "#ffffff", "circle-opacity": 0.25, "circle-blur": 1 } },
          { id: "planes", type: "circle", source: "planes", paint: { "circle-radius": 3, "circle-color": "#ffffff" } },
          { id: "city-label", type: "symbol", source: "cities", layout: { "text-field": ["get", "name"], "text-font": FONT, "text-size": 12, "text-offset": [0, 0.9], "text-anchor": "top" },
            paint: { "text-color": "#e8ecf1", "text-halo-color": "#0b0d10", "text-halo-width": 1.4 } },
        ],
      };
      const map = await makeMap(ctx, { style, center: [140, 18], zoom: fitZ() });
      const total = arcs.reduce((s, a) => s + a.km, 0);
      const proj = h("span", { class: "mono", text: "globe" });
      panel(map, "bottom-left").append(h("h4", { text: `台北出發 ${arcs.length} 條航線` }),
        h("div", {}, "總長 ", h("span", { class: "num", text: fmt(Math.round(total)) }), " km・投影 ", proj),
        h("small", { class: "ml-hide-s", text: "大圓航線以球面線性插值計算，跨越換日線時展開經度，兩種投影都能正確連線。" }));
      // Each plane loops along its arc; duration grows with distance.
      const planes = map.getSource("planes");
      ctx.raf((t) => {
        const features = arcs.map((a, i) => {
          const dur = 5000 + a.km * 0.5, u = ((t / dur) + i * 0.137) % 1, k = u * (a.coords.length - 1), j = Math.floor(k), f = k - j;
          const p = a.coords[j], q = a.coords[Math.min(j + 1, a.coords.length - 1)];
          return { type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f] } };
        });
        planes.setData({ type: "FeatureCollection", features });
      });
      let spin = true;
      const spinBtn = ctx.toggle("自轉", true, (v) => { spin = v; });
      for (const ev of ["mousedown", "touchstart", "wheel"]) map.on(ev, () => { spin = false; spinBtn.setAttribute("aria-pressed", "false"); });
      ctx.raf((t, dt) => {
        if (!spin || map.isMoving() || map.getZoom() > 4) return;
        const c = map.getCenter();
        map.setCenter([c.lng + dt * 0.004, c.lat]);
      });
      ctx.group(["地球儀", "麥卡托"], 0, (i) => { const type = i ? "mercator" : "globe"; map.setProjection({ type }); proj.textContent = type; });
      ctx.group(["全球", "台灣"], 0, (i) => map.flyTo(i ? { center: [121, 23.7], zoom: 5.6, duration: 3500, essential: true } : { center: [140, 18], zoom: fitZ(), duration: 3500, essential: true }));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "GeoJSONSource.setData × N・circle / heatmap・setBearing",
    desc: "逐級增加 GeoJSON 點數，地圖每幀旋轉相機，GPU 必須重繪全部點；setData 把資料送進 Web Worker 切成向量圖磚，耗時另外列出。",
    hint: "按「自動加壓」逐級量測，或拖曳手動滑桿；底部切換圓點或熱度圖後再測一次比較。",
    async mount(ctx) {
      ctx.html(`<div class="ml-stress"><div class="ml-map"></div></div>`);
      ctx.controls.classList.add("bottom");
      const map = await makeMap(ctx, { style: "dark", bounds: TW_BOUNDS, fitBoundsOptions: { padding: 16 }, pitch: 40 }, ctx.$(".ml-stress .ml-map"));
      tuneDark(map);
      let mode = 0, ms = 0;
      const before = labelLayer(map);
      map.addSource("pts", { type: "geojson", data: EMPTY });
      map.addLayer({ id: "dots", type: "circle", source: "pts", paint: { "circle-radius": 2, "circle-opacity": 0.8, "circle-color": ["match", ["get", "k"], ...PALETTE.flatMap((c, i) => [i, c]), "#888888"] } }, before);
      map.addLayer({ id: "heat", type: "heatmap", source: "pts", layout: { visibility: "none" }, paint: { "heatmap-radius": 8, "heatmap-intensity": 0.04, "heatmap-color": heatColor(HEAT_RAMPS["霓虹"]) } }, before);
      ctx.group(["圓點", "熱度圖"], 0, (i) => {
        mode = i;
        map.setLayoutProperty("dots", "visibility", i ? "none" : "visible");
        map.setLayoutProperty("heat", "visibility", i ? "visible" : "none");
      });
      const P = points(), jitter = rng(3);
      const data = (n) => {
        const features = new Array(n);
        for (let i = 0; i < n; i++) {
          const j = i % 100000, d = i < 100000 ? 0 : 0.012;
          features[i] = { type: "Feature", properties: { k: i % 6 }, geometry: { type: "Point", coordinates: [P[j * 2 + 1] + (jitter() - 0.5) * d, P[j * 2] + (jitter() - 0.5) * d] } };
        }
        return { type: "FeatureCollection", features };
      };
      ctx.raf((t) => map.setBearing((t / 80) % 360));
      ctx.ramp({
        label: "資料點", unit: "點", steps: [5000, 10000, 25000, 50000, 100000, 200000, 300000], minFps: 30,
        apply: async (n) => {
          const fc = data(n), t0 = performance.now();
          await map.getSource("pts").setData(fc);
          ms = performance.now() - t0;
        },
        metrics: () => ({ "圖層": mode ? "熱度圖" : "圓點", "setData 耗時": fmtMs(ms) }),
        note: "每幀 setBearing 旋轉相機，觸發整張地圖重繪；超過十萬點後以原資料加微小抖動補足。",
      });
      // On small stages the map runs full-bleed under the lab panel: pad the camera so Taiwan sits beside it.
      const hr = ctx.$(".ml-stress").getBoundingClientRect(), pr = ctx.el.querySelector(".sc-lab")?.getBoundingClientRect();
      const off = pr ? pr.right - hr.left : 0;
      if (off > 20 && hr.width - off > 160) {
        map.setPadding({ left: off, top: 0, right: 0, bottom: 0 });
        map.fitBounds(TW_BOUNDS, { padding: 12, pitch: 40, duration: 0 });
      }
    },
  },
] });
</script>
</body>
</html>
