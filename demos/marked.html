const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);

const slug = (s) => s.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "") || "section";

// Links in previews must not navigate the demo iframe (a hash link would also switch scenes).
function guardLinks(ctx, root) {
  ctx.on(root, "click", (e) => {
    const a = e.target.closest("a[href]");
    if (!a) return;
    e.preventDefault();
    const href = a.getAttribute("href");
    if (href.startsWith("#")) {
      root.querySelector(`[id="${CSS.escape(decodeURIComponent(href.slice(1)))}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" });
    } else if (/^https?:/i.test(href)) window.open(href, "_blank", "noopener");
  });
}

const LEX_SAMPLES = {
  "通勤小抄": `# 捷運通勤小抄

`,
  "巢狀結構": `> ## 引言裡的標題
>
> 1. 第一層
>    - 第二層有 \`code\`
>    - 第二層有 ~~刪除~~
> 2. 回到第一層
`,
};
const TY_COLOR = { heading: "var(--c3)", paragraph: "var(--c2)", list: "var(--c4)", list_item: "var(--c4)", checkbox: "var(--c4)", table: "var(--c5)", th: "var(--c5)", td: "var(--c5)", code: "var(--c6)", codespan: "var(--c6)", blockquote: "#8a6d00", link: "var(--c2)", def: "var(--c2)", strong: "#a0522d", em: "#a0522d", del: "#a0522d" };
const PROPS = ["depth", "lang", "ordered", "start", "loose", "task", "checked", "href", "title", "align"];
const tokenProps = (t) => PROPS
  .filter((k) => t[k] != null && t[k] !== "" && t[k] !== false && !(Array.isArray(t[k]) && t[k].every((x) => x == null)))
  .map((k) => `${k}: ${JSON.stringify(t[k])}`).join("  ");
function tokenKids(t) {
  if (t.type === "list") return t.items;
  if (t.type === "table") return [...t.header.map((c) => ({ ...c, type: "th" })), ...t.rows.flat().map((c) => ({ ...c, type: "td" }))];
  return t.tokens || [];
}
function treeNode(t, level, i) {
  const kids = tokenKids(t);
  const raw = String(t.raw ?? t.text ?? "").replace(/\n/g, "↵");
  return h("details", { class: `tk${kids.length ? "" : " leaf"}`, open: level < 2 && kids.length > 0 && kids.length <= 8, "data-i": level === 0 ? i : null },
    h("summary", {},
      h("b", { class: "ty", style: `color:${TY_COLOR[t.type] || "var(--muted)"}`, text: t.type }),
      h("span", { class: "pr", text: tokenProps(t) }),
      h("code", { text: raw.length > 36 ? `${raw.slice(0, 36)}…` : raw })),
    ...kids.map((k) => treeNode(k, level + 1)));
}

// ---------- scene 3: custom syntax extensions ----------
const EXT_MD = `:::tip 出發前檢查
記得帶 **悠遊卡** 和雨傘，==午後有雷陣雨==。

:::

關掉擴充後，這些語法會原樣留在文字裡。
`;
const EXT_DEFS = [
  { label: ":::callout", ext: {
    name: "callout", level: "block", childTokens: ["titleTokens", "tokens"],
    start: (src) => src.match(/^:::/m)?.index,
    tokenizer(src) {
      const m = /^:::(tip|warn)[ \t]*([^\n]*)\n([\s\S]*?)\n:::[ \t]*(?:\n+|$)/.exec(src);
      if (!m) return;
      const token = { type: "callout", raw: m[0], kind: m[1], titleTokens: this.lexer.inlineTokens(m[2].trim()), tokens: [] };
      this.lexer.blockTokens(m[3], token.tokens);
      return token;
    },
    renderer(t) {
      return `<aside class="callout ${t.kind}"><p class="callout-t">${t.kind === "warn" ? "⚠️" : "💡"} ${this.parser.parseInline(t.titleTokens)}</p>${this.parser.parse(t.tokens)}</aside>\n`;
    },
  } },
  { label: "==mark==", ext: {
    name: "mark", level: "inline",
    start: (src) => src.indexOf("=="),
    tokenizer(src) {
      const m = /^==(?=\S)([\s\S]*?\S)==/.exec(src);
      if (m) return { type: "mark", raw: m[0], tokens: this.lexer.inlineTokens(m[1]) };
    },
    renderer(t) { return `<mark>${this.parser.parseInline(t.tokens)}</mark>`; },
  } },
  { label: "{ruby}", ext: {
    name: "ruby", level: "inline",
    start: (src) => src.indexOf("{"),
    tokenizer(src) {
      const m = /^\{([^|{}\n]+)\|([^{}\n]+)\}/.exec(src);
      if (m) return { type: "ruby", raw: m[0], base: m[1], reading: m[2].trim() };
    },
    renderer(t) {
      // One reading per character when the counts match, otherwise one reading for the whole word.
      const chars = [...t.base], reads = t.reading.split(/\s+/);
      const pairs = chars.length === reads.length ? chars.map((c, i) => [c, reads[i]]) : [[t.base, t.reading]];
      return `<ruby>${pairs.map(([c, r]) => `${esc(c)}<rp>(</rp><rt>${esc(r)}</rt><rp>)</rp>`).join("")}</ruby>`;
    },
  } },
];

const OVERRIDES = [
  { label: "heading()", tip: "標題加上 id 與 # 錨點", fn: {
    heading({ tokens, depth }) {
      const id = slug(this.parser.parseInline(tokens, this.parser.textRenderer));
      return `<h${depth} id="${esc(id)}"><a class="anchor" href="#${esc(id)}" aria-label="連到這個標題">#</a>${this.parser.parseInline(tokens)}</h${depth}>\n`;
    },
  } },
  { label: "link()", tip: "外部連結開新分頁並加上 ↗；站內連結回傳 false 交給預設處理", fn: {
    link({ href, title, tokens }) {
      if (!/^https?:\/\//i.test(href)) return false;
      return `<a href="${esc(href)}"${title ? ` title="${esc(title)}"` : ""} target="_blank" rel="noopener noreferrer">${this.parser.parseInline(tokens)}<span class="ext-i">↗</span></a>`;
    },
  } },
  { label: "image()", tip: "圖片改成 figure 與圖說；只含圖片的段落不再包 p", fn: {
    image({ href, title, text }) {
      return `<figure><img src="${esc(href)}" alt="${esc(text)}" loading="lazy"><figcaption>${esc(title || text)}</figcaption></figure>`;
    },
    paragraph({ tokens }) {
      // A paragraph holding only an image would put <figure> inside <p>, which is invalid HTML.

function pipelineInstance(flags, st) {
  const ext = {
    renderer: {
      heading({ tokens, depth, id }) {
        return id ? `<h${depth} id="${id}">${this.parser.parseInline(tokens)}</h${depth}>\n` : false;
      },
    },
    hooks: {
      processAllTokens(tokens) { st.top = tokens.length; return tokens; },
    },
  };
  if (flags.pre) ext.hooks.preprocess = (md) => {
    const m = /^---\n([\s\S]*?)\n---\n/.exec(md);
    if (!m) return md;
    for (const line of m[1].split("\n")) {
      const i = line.indexOf(":");
      if (i > 0) st.meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
    }
    return md.slice(m[0].length);
  };
  if (flags.walk) ext.walkTokens = (t) => {
    st.walked++;
    if (t.type === "heading") {
      t.depth = Math.min(6, t.depth + 1);
      t.id = `sec-${st.headings.length + 1}`;
      st.headings.push({ depth: t.depth, text: t.text, id: t.id });
    } else if (t.type === "text" && !t.tokens) {
      st.han += (t.text.match(/\p{Script=Han}/gu) || []).length;
    } else if (t.type === "link" && /^https?:/i.test(t.href)) st.ext++;
  };
  if (flags.post) ext.hooks.postprocess = (html) => {
    st.htmlLen = html.length;
    const m = st.meta;
    const tags = (m.tags || "").split(/[,，]\s*/).filter(Boolean);
    const info = flags.walk ? `約 ${Math.max(1, Math.round(st.han / 400))} 分鐘讀完（${fmt(st.han)} 字）` : "walkTokens 關閉，沒有字數";
    const head = `<header class="post-h"><h1>${esc(m.title || "（沒有 front matter 標題）")}</h1><p>${esc(m.author || "作者不明")}・${esc(m.date || "日期不明")}・${info}</p>${tags.length ? `<p class="tags">${tags.map((x) => `<span>#${esc(x)}</span>`).join("")}</p>` : ""}</header>`;
    const toc = st.headings.length ? `<nav class="toc"><b>目錄</b>${st.headings.map((x) => `<a class="d${x.depth}" href="#${x.id}">${esc(x.text)}</a>`).join("")}</nav>` : "";
    return head + toc + html;
  };
  return new marked.Marked(ext);
}

const enc = new TextEncoder();
function buildDoc(kind, kb) {
  const d = STRESS_KINDS[kind];
  const headBytes = enc.encode(d.head).length, unitBytes = enc.encode(d.unit).length;
  const k = Math.max(1, Math.ceil((kb * 1024 - headBytes) / unitBytes));
  return { md: d.head + d.unit.repeat(k), bytes: headBytes + unitBytes * k };
}

    hint: "關掉 async 再解析：parse() 直接回傳字串，walkTokens 的 await 來不及，程式碼不會上色",
    async mount(ctx) {
      ctx.html(`<div class="wrap"><div class="cols pl">
        <div class="box"><div class="cap"><b>執行紀錄</b>時間從呼叫 parse() 前起算</div><ol class="out as-log"></ol></div>
        <div class="box"><div class="cap"><b>輸出</b><span class="as-state"></span></div><div class="out md as-out"></div></div>
      </div></div>`);
      const logEl = ctx.$(".as-log"), out = ctx.$(".as-out"), state = ctx.$(".as-state");
      let useAsync = true, seq = 0, t0 = 0;
      const log = (run, msg, cls = "") => {
        if (run !== seq) return;
        logEl.append(h("li", { class: cls }, h("span", { class: "num", text: `+${(performance.now() - t0).toFixed(1)} ms` }), h("span", { text: msg })));
      };
      async function run() {
        const id = ++seq;
        logEl.replaceChildren();
        out.classList.add("wait");
        state.textContent = "解析中…";
        // walkTokens runs for all code blocks concurrently, so only the first one reports the download.
        let announce = !window.hljs;
        const inst = new marked.Marked({
          async: useAsync,
          async walkTokens(token) {
            if (token.type !== "code") return;
            const lang = token.lang || "plaintext";
            log(id, `walkTokens 遇到 code（${lang}），開始 await`);
            const tl = performance.now();
            await ctx.load(HLJS);
            if (announce) {
              announce = false;
              log(id, `highlight.js 載入完成（${fmtMs(performance.now() - tl)}）`, "ok");
            }
            token.text = hljs.getLanguage(lang) ? hljs.highlight(token.text, { language: lang }).value : esc(token.text);
            token.escaped = true;
            log(id, useAsync ? `${lang} 上色完成` : `${lang} 上色完成，但 parse() 早已回傳`, useAsync ? "ok" : "warn");
          },
        });
        t0 = performance.now();
        const result = inst.parse(ASYNC_MD);
        const isPromise = result instanceof Promise;
        log(id, isPromise ? "parse() 回傳 Promise，等待 walkTokens…" : "parse() 立刻回傳字串", isPromise ? "" : "warn");
        const html = await result;
        if (id !== seq || !ctx.active) return;
        out.innerHTML = purify(html);
        out.classList.remove("wait");
        const n = out.querySelectorAll("pre [class^='hljs-']").length;
        log(id, `輸出 ${fmt(html.length)} 字元 HTML，含 ${n} 個上色片段`, n ? "ok" : "warn");
        state.innerHTML = `async: <code>${useAsync}</code>，上色片段 <code>${n}</code>`;
      }
      ctx.toggle("async", true, (v) => { useAsync = v; run(); });
      ctx.button("重新解析", () => run(), { primary: true });
      run();
    },
  },
  {
    id: "xss", title: "XSS 防護", paper: true,
    api: "DOMPurify.sanitize(marked.parse(md))",
    desc: "marked 會原封不動輸出 <script>、onerror 屬性與 javascript: 連結。中間欄只當文字顯示（危險處標紅），右邊是 DOMPurify 過濾後的安全結果與被移除清單。",
    hint: "切到「跳脫 HTML」看另一種做法：renderer 把原始 HTML 變成文字並擋掉非網址連結",
    async mount(ctx) {
      ctx.html(`<div class="wrap"><div class="xs">
        <div class="box xs-src"><div class="cap"><b>Markdown</b>可自行輸入攻擊字串</div><textarea spellcheck="false" aria-label="含惡意內容的 Markdown"></textarea></div>
        <div class="box xs-raw"><div class="cap"><b class="xs-raw-t"></b>未過濾，只當文字顯示</div><pre class="out code-out xs-raw-out"></pre></div>
        <div class="box xs-safe"><div class="cap"><b>安全預覽</b><span class="xs-meta"></span></div><div class="out md xs-safe-out"></div><div class="xs-rm"></div></div>
      </div></div>`);
      const src = ctx.$("textarea"), rawOut = ctx.$(".xs-raw-out"), rawT = ctx.$(".xs-raw-t"), safeOut = ctx.$(".xs-safe-out"), meta = ctx.$(".xs-meta"), rmEl = ctx.$(".xs-rm");
      let mode = 0;
      guardLinks(ctx, safeOut);
      function render() {
        const raw = mode === 0 ? marked.parse(src.value) : escapeInst.parse(src.value);
        rawT.textContent = mode === 0 ? "marked.parse() 輸出" : "跳脫 HTML 的輸出";
        // The unsafe string is only ever shown as escaped text.
        const hits = (esc(raw).match(DANGER) || []).length;
        rawOut.innerHTML = esc(raw).replace(DANGER, '<mark class="bad">$1</mark>');
        safeOut.innerHTML = DOMPurify.sanitize(raw);
        const removed = DOMPurify.removed.map(describeRemoved).filter(Boolean);
        meta.innerHTML = `${mode === 0 ? "危險片段" : "可疑字樣（已是純文字）"} <code>${hits}</code>，DOMPurify 移除 <code>${removed.length}</code> 項`;
        rmEl.replaceChildren(...(removed.length ? removed : [h("em", { text: "沒有需要移除的內容" })]));
      }
      ctx.on(src, "input", render);
      ctx.group(["DOMPurify 過濾", "跳脫 HTML"], 0, (i) => { mode = i; render(); });
      src.value = XSS_MD;
      render();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "marked.lexer(md) + marked.parser(tokens)",
    desc: "從 1 KB 到約 16 MB 逐級加大 Markdown 文件，分開量 lexer 與 parser 的耗時與吞吐量；可換內容類型，或加上 DOMPurify 一起計時。",
    hint: "按左側「開始測試」；換內容類型後再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="stress-stage">
        <div class="st-card"></div>
        <div class="box" style="flex:1"><div class="cap"><b>內容範例</b><span class="st-kind"></span></div><div class="out md st-prev"></div></div>
      </div>`);
      const card = ctx.$(".st-card"), prev = ctx.$(".st-prev"), kindEl = ctx.$(".st-kind");
      let kind = "mixed", withPurify = false;
      guardLinks(ctx, prev);
      const setCard = (c) => card.replaceChildren(...Object.entries(c).map(([k, v]) => h("div", {}, k, h("b", { text: v }))));
      const resetCard = () => setCard({ 文件大小: "未測", "頂層 token": "未測", lexer: "未測", parser: "未測", DOMPurify: withPurify ? "未測" : "未啟用", 吞吐量: "未測" });
      function preview() {
        const d = STRESS_KINDS[kind];
        prev.innerHTML = purify(marked.parse(d.head + d.unit.repeat(3)));
        kindEl.textContent = `${d.label}，單位片段重複堆到指定大小`;
        resetCard();
      }
      ctx.controls.classList.add("bottom");
      ctx.select("內容", Object.entries(STRESS_KINDS).map(([value, d]) => ({ value, label: d.label })), kind, (v) => { kind = v; preview(); });
      ctx.toggle("加上 DOMPurify", false, (v) => { withPurify = v; resetCard(); });
      preview();
      ctx.bench({
        label: "解析 Markdown", unit: "KB", format: fmt,
        sizes: [1, 10, 100, 1000, 4000, 16000],
        prepare: (kb) => buildDoc(kind, kb),
        run(kb, d) {
          const t0 = performance.now();
          const tokens = marked.lexer(d.md);
          const t1 = performance.now();
          const html = marked.parser(tokens);
          const t2 = performance.now();
          if (withPurify) DOMPurify.sanitize(html);
          const t3 = performance.now();
          const mbps = d.bytes / 1048576 / ((t3 - t0) / 1000);
          setCard({
            文件大小: d.bytes >= 1048576 ? `${(d.bytes / 1048576).toFixed(1)} MB` : `${fmt(d.bytes / 1024, 1)} KB`,
            "頂層 token": fmt(tokens.length),
            lexer: fmtMs(t1 - t0),
            parser: fmtMs(t2 - t1),
            DOMPurify: withPurify ? fmtMs(t3 - t2) : "未啟用",
            吞吐量: `${mbps.toFixed(1)} MB/s`,
          });
          return `${mbps.toFixed(1)} MB/s`;
        },
        note: "測的是 marked.lexer() 把文件切成 token、再由 marked.parser() 轉成 HTML 的總耗時，文件越大，token 物件與輸出字串佔的記憶體也越多。內容類型會改變瓶頸：深層巢狀清單要反覆判斷縮排，通常比一般段落慢；加上 DOMPurify 會把整份 HTML 再解析成 DOM 檢查一次。",
      });
    },
  },
] });
</script>
