<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.18.12/dist/browser/index.iife.js"></script>

<script>
const { h, fmt } = Showcase;
const { Transformer, Markmap, Toolbar, deriveOptions, defaultOptions, loadCSS, loadJS } = window.markmap;
const md = (id) => document.getElementById(id).textContent.trim();

const WARM = ["#ffd36b", "#ff7aa8", "#7cc7ff", "#8be3a6", "#b49cff", "#ffa66b", "#5ee0d6"];
const PALETTES = {
  warm: WARM,
  tableau: ["#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f", "#edc948", "#b07aa1", "#ff9da7"],
  mono: ["#f7df1e"],
};
// Freeze colours at level 2 so every main branch keeps one hue down to its leaves.
const baseOpts = (extra = {}) => ({
  ...deriveOptions({ color: WARM, colorFreezeLevel: 2 }),
  spacingVertical: 8, spacingHorizontal: 70, paddingX: 10, duration: 450, fitRatio: 0.88, maxWidth: 260, ...extra,
});

// Count nodes in the tree and the ones currently shown (children of folded nodes are hidden).
function countNodes(root) {
  let total = 0, shown = 0;
  (function walk(n, visible) {
    total++;
    if (visible) shown++;
    (n.children || []).forEach((c) => walk(c, visible && !n.payload?.fold));
  })(root, true);
  return { total, shown };
}

function makeMap(ctx, svg, opts, data) {
  const mm = Markmap.create(svg, opts, data);
  // Watch the svg itself: the controls bar and side panes change its size without resizing the stage.
  const ro = new ResizeObserver(() => { if (mm.state.data) mm.fit(); });
  ro.observe(svg);
  ctx.onCleanup(() => { ro.disconnect(); mm.destroy(); });
  return mm;
}

// Node content is HTML with non-ASCII characters escaped as entities; this turns it back into readable text.
function decode(html) {
  const el = document.createElement("textarea");
  el.innerHTML = html;
  return el.value;
}

function download(ctx, text, type, name) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = h("a", { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  ctx.onCleanup(() => URL.revokeObjectURL(url));
  ctx.timeout(() => URL.revokeObjectURL(url), 1500);
}

// Large outline: N branches, 9 items each, 4 details per item.
function genOutline(n) {
  const lines = ["# 產生的大綱"];
  let c = 1;
  for (let i = 0; c < n; i++) {
    lines.push(`## 分支 ${i}`); c++;
    for (let j = 0; j < 9 && c < n; j++) {
      lines.push(`- 項目 ${i}-${j}`); c++;
      for (let k = 0; k < 4 && c < n; k++) { lines.push(`  - 細項 ${i}-${j}-${k}`); c++; }
    }
  }
  return lines.join("\n");
}

Showcase.run({ scenes: [
  {
    id: "editor", title: "即時編輯",
    api: "new Transformer().transform(md)、Markmap.create(svg, opts, root)",
    desc: "左邊寫 Markdown，標題與清單層級直接變成心智圖分支。顏色在第 2 層凍結，同一主幹維持同一色系。",
    hint: "修改左邊文字，或點圓點收合分支",
    mount(ctx) {
      ctx.html(`<div class="mkm-board mkm-ed">
        <section class="mkm-box mkm-pane"><div class="mkm-head"><b>Markdown 原始碼</b><span class="mkm-stat">標題與清單都會變成節點</span></div>
          <textarea class="mkm-src" spellcheck="false" wrap="off" aria-label="Markdown 原始碼"></textarea></section>
        <div class="mkm-box mkm-map"><svg class="mkm-svg"></svg></div>
      </div>`);
      const board = ctx.$(".mkm-ed"), src = ctx.$(".mkm-src"), stat = ctx.$(".mkm-stat");
      const t = new Transformer();
      const mm = makeMap(ctx, ctx.$(".mkm-svg"), baseOpts());
      let level = -1, timer = 0;
      async function draw(refit) {
        const t0 = performance.now();
        const { root } = t.transform(src.value);
        await mm.setData(root, { initialExpandLevel: level });
        if (refit) await mm.fit();
        stat.textContent = `${countNodes(root).total} 個節點，${Math.round(performance.now() - t0)} ms`;
      }
      ctx.on(src, "input", () => { clearTimeout(timer); timer = ctx.timeout(() => draw(false), 250); });
      const wide = ctx.size().width > 640;
      board.classList.toggle("no-src", !wide);
      ctx.toggle("原始碼", wide, (v) => board.classList.toggle("no-src", !v));
      ctx.group(["全部展開", "只看主幹"], 0, (i) => { level = i ? 2 : -1; draw(true); });
      ctx.button("置中", () => mm.fit());
      src.value = md("mkm-learn");
      draw(true);
    },
  },
  {
    id: "fold", title: "摺疊與聚焦",
    api: "toggleNode(node, recursive)、setHighlight(node)、centerNode(node)、<!-- markmap: fold -->",
    desc: "「離島」分支用 <!-- markmap: fold --> 預設收合。選地區會收起其他分支並標示；點節點文字會置中並加上框線，點圓點則收合。",
    hint: "選地區，或點節點文字置中",
    mount(ctx) {
      ctx.html(`<div class="mkm-board"><div class="mkm-box mkm-map" style="height:100%">
        <svg class="mkm-svg"></svg><div class="mkm-tag">顯示 <b class="mkm-num">0</b> 個節點，共 <span class="mkm-num">0</span> 個</div></div></div>`);
      const svg = ctx.$(".mkm-svg"), [shownEl, totalEl] = ctx.$$(".mkm-tag .mkm-num");
      const t = new Transformer();
      const mm = makeMap(ctx, svg, baseOpts());
      const REGIONS = ["北部", "中部", "南部", "東部", "離島"];
      const recount = () => { const c = countNodes(mm.state.data); shownEl.textContent = c.shown; totalEl.textContent = c.total; };
      async function load(level) {
        await mm.setHighlight(null);
        await mm.setData(t.transform(md("mkm-trip")).root, { initialExpandLevel: level });
        await mm.fit();
        recount();
      }
      async function setAll(fold) {
        const root = mm.state.data;
        (function walk(n) { if (n !== root && n.children?.length) n.payload = { ...n.payload, fold }; n.children?.forEach(walk); })(root);
        await mm.setHighlight(null);
        await mm.renderData();
        await mm.fit();
        recount();
      }
      async function focus(name) {
        const root = mm.state.data;
        const target = root.children.find((c) => decode(c.content).includes(name));
        if (!target) return;
        root.children.forEach((c) => (c.payload = { ...c.payload, fold: c === target ? 0 : 1 }));
        await mm.renderData();
        await mm.fit();
        await mm.setHighlight(target);
        recount();
      }
      // Clicking the text centers and highlights the node; the circle keeps its built-in toggle.
      ctx.on(svg, "click", (e) => {
        const g = e.target.closest("g.markmap-node");
        if (!g || e.target.closest("circle")) { ctx.timeout(recount, 80); return; }
        const node = d3.select(g).datum();
        mm.setHighlight(node).then(() => mm.centerNode(node));
      });
      ctx.select("聚焦", [{ value: "", label: "（全部地區）" }, ...REGIONS], "", (v) => (v ? focus(v) : load(-1)));
      ctx.slider("展開層級", { min: 1, max: 4, value: 4, format: (v) => (v === 4 ? "全部" : `${v} 層`) }, (v) => load(v === 4 ? -1 : v));
      ctx.button("全部收合", () => setAll(1));
      ctx.button("全部展開", () => setAll(0));
      ctx.toggle("遞迴收合", false, (v) => mm.setOptions({ toggleRecursively: v }));
      load(-1);
    },
  },
  {
    id: "options", title: "版面選項",
    api: "mm.setOptions({ spacingHorizontal, maxWidth, color, lineWidth })、deriveOptions({ colorFreezeLevel })",
    desc: "同一份大綱調整水平間距、節點最大寬度（長文字自動換行）、配色、顏色凍結層級與線寬。下方顯示目前的選項。",
    hint: "拖曳滑桿、切換配色看版面變化",
    mount(ctx) {
      ctx.html(`<div class="mkm-board"><div class="mkm-box mkm-map mkm-col"><pre class="mkm-code"></pre><svg class="mkm-svg"></svg></div></div>`);
      const code = ctx.$(".mkm-code");
      const t = new Transformer();
      const mm = makeMap(ctx, ctx.$(".mkm-svg"), baseOpts({ duration: 300 }));
      const s = { sh: 70, mw: 240, pal: "warm", freeze: 2, thin: true };
      let timer = 0;
      async function apply() {
        mm.setOptions({
          ...deriveOptions({ color: PALETTES[s.pal], colorFreezeLevel: s.freeze }),
          spacingHorizontal: s.sh, maxWidth: s.mw,
          lineWidth: s.thin ? defaultOptions.lineWidth : () => 1.5,
        });
        await mm.setData(t.transform(md("mkm-shop")).root);
        await mm.fit();
        code.textContent = `{ spacingHorizontal: ${s.sh}, maxWidth: ${s.mw}, colorFreezeLevel: ${s.freeze}, lineWidth: ${s.thin ? "defaultOptions.lineWidth" : "() => 1.5"} }`;
      }
      const later = () => { clearTimeout(timer); timer = ctx.timeout(apply, 80); };
      ctx.slider("水平間距", { min: 20, max: 160, step: 10, value: s.sh }, (v) => { s.sh = v; later(); });
      ctx.slider("最大寬度", { min: 0, max: 400, step: 20, value: s.mw, format: (v) => (v ? `${v}px` : "不限") }, (v) => { s.mw = v; later(); });
      ctx.select("配色", [{ value: "warm", label: "暖色系" }, { value: "tableau", label: "Tableau 10" }, { value: "mono", label: "單一顏色" }], s.pal, (v) => { s.pal = v; apply(); });
      ctx.select("凍結層級", [{ value: "0", label: "不凍結" }, { value: "1", label: "第 1 層" }, { value: "2", label: "第 2 層" }, { value: "3", label: "第 3 層" }], "2", (v) => { s.freeze = +v; apply(); });
      ctx.toggle("線寬漸細", true, (v) => { s.thin = v; apply(); });
      apply();
    },
  },
  {
    id: "toolbar", title: "工具列與主題", paper: true,
    api: "Toolbar.create(mm)、toolbar.register({ id, title, content, onClick })、setItems()",
    desc: "markmap-toolbar 提供放大、縮小、置中、遞迴收合與深色主題按鈕。這裡另外註冊一個「下一個分支」按鈕，示範自訂工具列項目。",
    hint: "用右上工具列操作，或關閉縮放",
    mount(ctx) {
      ctx.html(`<div class="mkm-board"><div class="mkm-box mkm-tb" style="height:100%">
        <svg class="mkm-svg"></svg><div class="mkm-tag">縮放 <b class="mkm-num">1.00×</b><span class="mkm-cur"></span></div></div></div>`);
      const wrap = ctx.$(".mkm-tb"), scaleEl = ctx.$(".mkm-tag .mkm-num"), cur = ctx.$(".mkm-cur");
      const t = new Transformer();
      const mm = makeMap(ctx, ctx.$(".mkm-svg"), { duration: 400, maxWidth: 240, fitRatio: 0.88 }, t.transform(md("mkm-launch")).root);
      mm.zoom.on("zoom.mkm", (e) => { scaleEl.textContent = `${e.transform.k.toFixed(2)}×`; });
      let idx = -1;
      const tb = Toolbar.create(mm);
      tb.register({
        id: "mkm-next", title: "下一個分支",
        content: Toolbar.icon("M6 4l8 6-8 6z"),
        onClick: async () => {
          const kids = mm.state.data.children;
          idx = (idx + 1) % kids.length;
          await mm.setHighlight(kids[idx]);
          await mm.centerNode(kids[idx]);
          cur.textContent = `，目前：${decode(kids[idx].content)}`;
        },
      });
      tb.setBrand(false);
      tb.setItems(["zoomIn", "zoomOut", "fit", "recurse", "mkm-next", "dark"]);
      tb.render();
      wrap.append(tb.el);
      ctx.onCleanup(() => document.documentElement.classList.remove("markmap-dark"));
      ctx.toggle("滾輪縮放與拖曳", true, (v) => mm.setOptions({ zoom: v }));
      ctx.button("深色主題", () => document.documentElement.classList.toggle("markmap-dark"));
      mm.fit();
    },
  },
  {
    id: "rich", title: "豐富內容", paper: true,
    api: "transformer.getUsedAssets(features)、loadCSS／loadJS、hooks.retransform",
    desc: "markmap-lib 內建 KaTeX 數學、highlight.js 程式碼上色、核取方塊與連結。偵測到用到的外掛後才載入對應資源；frontmatter 的 markmap 區塊可設定選項。",
    hint: "點「預設收合」左邊的圓點展開",
    mount(ctx) {
      ctx.html(`<div class="mkm-board mkm-side">
        <section class="mkm-box mkm-pane"><div class="mkm-head"><b>Markdown 原始碼</b><span class="mkm-stat">載入外掛中…</span></div><pre class="mkm-src"></pre></section>
        <div class="mkm-box mkm-map"><svg class="mkm-svg"></svg></div>
      </div>`);
      const src = md("mkm-rich"), stat = ctx.$(".mkm-stat");
      ctx.$(".mkm-src").textContent = src;
      const t = new Transformer();
      const mm = makeMap(ctx, ctx.$(".mkm-svg"), { duration: 300, fitRatio: 0.9 });
      let loaded = false, names = "";
      const showStat = () => { stat.textContent = `外掛：${names}（${loaded ? "已載入" : "載入中"}）`; };
      async function draw() {
        if (!ctx.active) return;
        const { root, features, frontmatter } = t.transform(src);
        names = Object.keys(features).join("、") || "無";
        mm.setOptions({ duration: 300, fitRatio: 0.9, ...deriveOptions(frontmatter?.markmap) });
        await mm.setData(root);
        await mm.fit();
        showStat();
        return features;
      }
      // KaTeX and highlight.js load on demand; retransform fires once per loaded script and font,
      // so collapse the burst into a single redraw instead of racing many setData calls.
      let timer = 0;
      const off = t.hooks.retransform.tap(() => { clearTimeout(timer); timer = ctx.timeout(draw, 250); });
      if (typeof off === "function") ctx.onCleanup(off);
      draw().then((features) => {
        const { styles, scripts } = t.getUsedAssets(features);
        if (styles) loadCSS(styles);
        if (scripts) return loadJS(scripts, { getMarkmap: () => window.markmap });
      }).then(() => { loaded = true; showStat(); })
        .catch((e) => { stat.textContent = `外掛載入失敗：${e.message}`; });
    },
  },
  {
    id: "data", title: "資料與匯出",
    api: "transform() 產出 { content, children, payload }、mm.setData(root)、markmap-render fillTemplate()",
    desc: "transform 的結果是一般 JSON 樹，程式可以直接增減節點再 setData。可下載成 SVG，或用 markmap-render 產生可離線開啟的單一 HTML 檔。",
    hint: "按「新增分支」，再下載 SVG 或 HTML",
    mount(ctx) {
      ctx.html(`<div class="mkm-board mkm-side">
        <section class="mkm-box mkm-pane"><div class="mkm-head"><b>資料結構（JSON）</b><span class="mkm-stat"></span></div><pre class="mkm-src"></pre></section>
        <div class="mkm-box mkm-map"><svg class="mkm-svg"></svg></div>
      </div>`);
      const pre = ctx.$(".mkm-src"), stat = ctx.$(".mkm-stat"), svg = ctx.$(".mkm-svg");
      const t = new Transformer();
      const { root, features } = t.transform(md("mkm-market"));
      const mm = makeMap(ctx, svg, baseOpts({ duration: 300 }));
      const IDEAS = [["手作飾品", "耳環", "髮夾"], ["二手書", "繪本", "小說"], ["植栽", "多肉", "香草"], ["插畫明信片", "城市系列"], ["咖啡外帶", "冰滴", "熱拿鐵"]];
      const KEEP = new Set(["", "content", "children", "payload", "tag", "fold"]);
      let k = 0;
      async function show() {
        await mm.setData(root);
        await mm.fit();
        pre.textContent = JSON.stringify(root, function (k, v) {
          if (!Array.isArray(this) && !KEEP.has(k)) return undefined;
          return k === "content" ? decode(v) : v;
        }, 2);
        stat.textContent = `${countNodes(root).total} 個節點`;
      }
      ctx.button("新增分支", () => {
        const [name, ...kids] = IDEAS[k++ % IDEAS.length];
        root.children.push({ content: `${name}（新）`, payload: { tag: "h2" }, children: kids.map((c) => ({ content: c, payload: { tag: "li" }, children: [] })) });
        show();
      }, { primary: true });
      ctx.button("下載 SVG", () => {
        const clone = svg.cloneNode(true);
        clone.setAttribute("width", svg.clientWidth);
        clone.setAttribute("height", svg.clientHeight);
        download(ctx, new XMLSerializer().serializeToString(clone), "image/svg+xml", "markmap.svg");
      });
      ctx.button("下載 HTML", async () => {
        stat.textContent = "產生 HTML 中…";
        try {
          const { fillTemplate } = await import("https://cdn.jsdelivr.net/npm/markmap-render@0.18.12/+esm");
          const html = fillTemplate(root, t.getUsedAssets(features), { jsonOptions: { colorFreezeLevel: 2, maxWidth: 260 } });
          download(ctx, html, "text/html", "markmap.html");
          stat.textContent = `已產生 HTML（${fmt(html.length / 1024, 1)} KB）`;
        } catch (e) { stat.textContent = `產生失敗：${e.message}`; }
      });
      show();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "transformer.transform(md) ＋ mm.setData(root) ＋ mm.fit()",
    desc: "產生越來越長的 Markdown 大綱（每個分支 9 個項目、每項 4 個細項），量從文字解析、量測節點尺寸、排版到畫出 SVG 的總耗時。",
    hint: "選展開層級，再按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="mkm-stress mkm-box mkm-map"><svg class="mkm-svg"></svg><div class="mkm-tag"><b>最後一次繪製</b> <span class="mkm-num"></span></div></div>`);
      const svg = ctx.$(".mkm-svg"), tag = ctx.$(".mkm-tag .mkm-num");
      ctx.controls.classList.add("bottom");
      const t = new Transformer();
      const mm = makeMap(ctx, svg, baseOpts({ duration: 0, maxWidth: 0 }));
      let level = -1;
      ctx.group(["全部展開", "只展開 2 層"], 0, (i) => { level = i ? 2 : -1; });
      mm.setData(t.transform(genOutline(60)).root).then(() => mm.fit());
      tag.textContent = "預覽 60 節點";
      ctx.bench({
        label: "心智圖節點", unit: "節點",
        sizes: [250, 500, 1000, 2000, 4000, 8000, 16000],
        prepare: (n) => ({ text: genOutline(n), level }),
        async run(n, job) {
          const { root } = t.transform(job.text);
          await mm.setData(root, { initialExpandLevel: job.level });
          await mm.fit();
          const shown = countNodes(root).shown;
          tag.textContent = `${fmt(n)} 節點，畫出 ${fmt(shown)} 個`;
          return `畫出 ${fmt(shown)} 個節點`;
        },
        note: "每個節點都是 foreignObject 裡的 HTML，markmap 要先量測文字尺寸才能排版，所以耗時跟畫出的節點數成正比。切到「只展開 2 層」時，收合的節點只解析不繪製，同樣大小的大綱快很多。動畫時間設為 0，避免把過場動畫算進去。",
      });
    },
  },
] });
</script>
</body>
</html>
