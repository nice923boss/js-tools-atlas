<style>
  /* Shared */
  .ms-pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px 12px; overflow: auto; }
  .ms-chip { position: absolute; right: 10px; bottom: 10px; z-index: 20; max-width: calc(100% - 20px); padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.7); color: #fff; font: 12px/1.5 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; backdrop-filter: blur(6px); }
  .ms-chip:empty { display: none; }
  .ms-chip b, .ms-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ms-chip b { color: var(--accent); font-weight: 600; }
  .ms-b { box-sizing: border-box; border-radius: 9px; background: color-mix(in srgb, var(--c) 24%, var(--bg-2)); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); display: grid; place-items: center; font: 600 14px var(--mono); color: var(--fg); }
  .ms-b.new { animation: ms-flash 1.2s ease; }
  @keyframes ms-flash { from { box-shadow: 0 0 0 4px var(--accent); } to { box-shadow: 0 0 0 0 transparent; } }

  /* 1. inspiration wall (ported from the original page) */
  .ms1-head { display: flex; gap: 8px; align-items: baseline; margin: 0 0 10px; }
  .ms1-head b { font-size: 16px; }
  .ms1-head small { color: var(--muted); font-size: 12px; }
  .ms1-grid { margin: 0 auto 30px; }
  .ms1-sizer, .ms1-it { width: calc((100% - 30px) / 4); }
  .ms1-gut { width: 10px; }
  .ms1-it { margin-bottom: 10px; border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--bg-2); border: 1px solid var(--line); transition: box-shadow .2s; }
  .ms1-it:hover { box-shadow: 0 0 0 2px var(--accent); }
  .ms1-it.big { width: calc((100% - 30px) / 4 * 2 + 10px); }
  .ms1-it img { display: block; width: 100%; object-fit: cover; }
  .ms1-cap { padding: 8px 10px 10px; font-size: 12.5px; line-height: 1.45; }
  .ms1-cap b { display: block; font-size: 13px; }
  .ms1-cap span { color: var(--muted); font-size: 11.5px; }
  .ms1-tall img { aspect-ratio: 3 / 4; } .ms1-xtall img { aspect-ratio: 2 / 3; }
  .ms1-sq img { aspect-ratio: 1; } .ms1-wide img { aspect-ratio: 4 / 3; } .ms1-pano img { aspect-ratio: 16 / 9; }
  .ms1-note { padding: 14px 14px 16px; border: none; color: #15151a; }
  .ms1-note q { display: block; font-size: 15px; font-weight: 700; line-height: 1.5; quotes: "「" "」"; }
  .ms1-note p { margin: 8px 0 0; font-size: 12px; opacity: .75; }
  .ms1-note.c1 { background: var(--c1); } .ms1-note.c2 { background: var(--c2); } .ms1-note.c3 { background: var(--c3); color: #fff; }
  .ms1-note.c4 { background: var(--c4); } .ms1-note.c5 { background: var(--c5); } .ms1-note.c6 { background: var(--c6); color: #fff; }
  .ms1-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .ms1-tags i { font-style: normal; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(127,127,127,.15); color: var(--muted); }
  @media (max-width: 760px) { .ms1-sizer, .ms1-it { width: calc((100% - 20px) / 3); } .ms1-it.big { width: calc((100% - 20px) / 3 * 2 + 10px); } }
  @media (max-width: 480px) { .ms1-sizer, .ms1-it { width: calc((100% - 10px) / 2); } .ms1-it.big { width: 100%; } .ms1-head small { display: none; } }

  /* 2. columnWidth / gutter / fitWidth */
  .ms2-grid { --cw: 120px; --g: 12px; margin: 0 auto; outline: 1px dashed color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 3px; }
  .ms2-grid .ms-b { width: var(--cw); margin-bottom: var(--g); }
  .ms2-grid .ms-b.w2 { width: calc(var(--cw) * 2 + var(--g)); }
  .ms2-guides { position: absolute; inset: -3px 0; pointer-events: none; }
  .ms2-guides i { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--c2) 9%, transparent); border-inline: 1px dashed color-mix(in srgb, var(--c2) 55%, transparent); }

  /* 3. percentPosition */
  .ms3 { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ms3 section { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-width: 0; min-height: 0; }
  .ms3 h3 { margin: 0; font: 600 13px var(--mono); }
  .ms3 h3 small { margin-left: 6px; font: 12px var(--font); color: var(--muted); }
  .ms3-box { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); min-height: 0; }
  .ms3-grid { width: var(--w, 100%); transition: width .9s ease; outline: 2px dashed color-mix(in srgb, var(--accent) 75%, transparent); outline-offset: -2px; }
  .ms3-sizer, .ms3 .ms-b { width: 25%; }
  .ms3 .ms-b { border: 3px solid var(--bg-2); border-radius: 10px; }
  .ms3-pos { position: absolute; left: 8px; bottom: 8px; z-index: 5; padding: 3px 9px; border-radius: 7px; background: rgba(0,0,0,.72); color: #fff; font: 12px/1.5 var(--font); }
  .ms3-pos b { font-family: var(--mono); color: var(--accent); }
  @media (max-width: 560px) { .ms3 { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; } }

  /* 4. stamp */
  .ms4-grid { position: relative; }
  .ms4-sizer, .ms4-grid .ms-b { width: calc((100% - 30px) / 4); }
  .ms4-grid .ms-b { margin-bottom: 10px; }
  .ms4-stamp { position: absolute; z-index: 3; width: calc((100% - 30px) / 4 * 2 + 10px); height: 110px; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: grab; touch-action: none; user-select: none; display: grid; align-content: center; gap: 2px; transition: opacity .2s, box-shadow .2s; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  .ms4-stamp b { font-size: 15px; }
  .ms4-stamp small { font-size: 12px; opacity: .8; }
  .ms4-stamp.off { opacity: .55; background: transparent; color: var(--fg); outline: 2px dashed var(--accent); outline-offset: -2px; box-shadow: none; }
  .ms4-stamp:active { cursor: grabbing; }

  /* 5. order */
  .ms5-grid { position: relative; }
  .ms5-sizer, .ms5-grid .ms-b { width: calc((100% - 30px) / 4); }
  .ms5-grid .ms-b { margin-bottom: 10px; font-size: 16px; place-items: start; padding: 5px 9px; }
  .ms5-path { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: visible; }
  .ms5-path polyline { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 1; animation: ms5-draw 1.4s ease forwards; }
  .ms5-path circle { fill: var(--accent); }
  @keyframes ms5-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

  /* 6. lazy images */
  .ms6 { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px 44px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ms6 section { display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 6px; min-width: 0; min-height: 0; }
  .ms6 h3 { margin: 0; font-size: 13px; }
  .ms6 h3 span { margin-left: 6px; font-weight: 400; color: var(--muted); font-size: 12px; }
  .ms6-box { overflow: auto; border-radius: 10px; border: 1px solid var(--line); padding: 8px; min-height: 0; }
  .ms6-sizer, .ms6-c { width: calc((100% - 16px) / 3); }
  .ms6-c { margin-bottom: 8px; border-radius: 8px; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line); }
  .ms6-c img { display: block; width: 100%; }
  .ms6-c p { margin: 0; padding: 4px 7px; font: 11px var(--mono); color: var(--muted); }
  @media (max-width: 560px) { .ms6 { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; } }

  /* 7. add / remove / transitions */
  .ms7 { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px 12px; display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 12px; }
  .ms7-box { overflow: auto; min-height: 0; }
  .ms7-sizer, .ms7 .ms-b { width: calc((100% - 24px) / 4); }
  .ms7 .ms-b { margin-bottom: 8px; }
  .ms7-log { margin: 0; padding: 8px 10px; list-style: none; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); font-size: 12px; min-height: 0; }
  .ms7-log li { padding: 4px 0; border-bottom: 1px solid var(--line); line-height: 1.45; }
  .ms7-log li b { font-family: var(--mono); color: var(--c2); font-weight: 600; }
  .ms7-log li.rm b { color: var(--c3); }
  .ms7-log li span { font-family: var(--mono); color: var(--muted); }
  @media (max-width: 560px) { .ms7 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 96px; } }

  /* 8. stress */
  .ms8 { position: absolute; inset: calc(var(--sc-ctl-h, 0px) + 4px) 8px 8px 350px; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); }
  .ms8-empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .ms8-grid { margin: 6px; }
  .ms8-i { width: 36px; margin-bottom: 4px; border-radius: 4px; }
  .ms8.pre .ms8-i { position: absolute; left: 0; top: 0; }
  .ms8-i.k0 { background: var(--c1); } .ms8-i.k1 { background: var(--c2); } .ms8-i.k2 { background: var(--c3); }
  .ms8-i.k3 { background: var(--c4); } .ms8-i.k4 { background: var(--c5); } .ms8-i.k5 { background: var(--c6); }
  @media (max-width: 760px) { .ms8 { inset: calc(var(--sc-ctl-h, 0px) + 4px) 8px 8px; } .ms8-empty { display: none; } }
</style>

<body>
<script src="_shared/showcase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js"></script>
<script>
// Masonry 4.2.2: absolutely positions mixed-height items into the shortest column.
const { fmt, fmtMs } = Showcase;
const IMG = (n) => `_shared/img/photo-${n}.jpg`;
// Small seeded PRNG so every visit shows the same wall.
const rng = (s) => () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
const tpl = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const block = (n, height, extra = "") => tpl(`<div class="ms-b ${extra}" style="height:${height}px;--c:var(--c${(n % 6) + 1})">${n}</div>`);

// One Masonry instance per grid; destroy() also unbinds its window resize listener.
function mason(ctx, el, opts) {
  const m = new Masonry(el, opts);
  ctx.onCleanup(() => m.destroy());
  return m;
}
// layout() itself is synchronous: positions are computed and written before it returns.
function timed(m) { const t = performance.now(); m.layout(); return performance.now() - t; }
const press = (wrap, i) => [...wrap.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
// Drive a demo script until the user presses anywhere in the scene.
function autoplay(ctx, steps, gap = 2400, delay = 1200) {
  const st = { on: true };
  ctx.on(ctx.el, "pointerdown", (e) => { if (e.isTrusted) st.on = false; });
  (async () => {
    await ctx.sleep(delay);
    for (let i = 0; ; i++) { if (st.on) await steps[i % steps.length](); await ctx.sleep(gap); }
  })().catch((e) => { if (e.name !== "AbortError") console.error(e); });
  return st;
}

// ---------- scene 1 data (from the original page) ----------
const PHOTO_CARDS = [
  [1, "tall", "挪威峽灣", "清晨的水面像鏡子一樣", ["北歐", "健行"]],
  [5, "xtall", "瀑布彩虹", "午後陽光才看得到", ["攝影", "秘境"]],
  [3, "wide", "山谷公路", "一路開到雲裡面", ["自駕", "公路"]],
  [7, "sq", "草原母獅", "長鏡頭等了兩小時", ["野生動物"]],
  [2, "tall", "紅岩峽谷", "光線從縫隙灑落", ["地景", "沙漠"]],
  [6, "sq", "藍色水母", "水族館最安靜的角落", ["海洋"]],
  [4, "wide", "披毯巴哥", "旅伴兼行李監督員", ["寵物"]],
  [8, "pano", "海象群", "整片海灘都在打呼", ["極地", "生態"]],
];
const NOTES = [
  ["c1", "出發前把行程排鬆一點，留白才有驚喜。", "旅行筆記 #12"],
  ["c2", "花蓮的海和挪威的峽灣，藍得不一樣。", "東部散策"],
  ["c3", "最好的照片，常常在迷路的時候拍到。", "攝影小語"],
  ["c4", "下一站：阿里山看日出，記得帶外套。", "待辦清單"],
  ["c5", "帶一本小筆記本，比一百張照片更記得住。", "旅行筆記 #7"],
  ["c6", "風景會變，但當下的心情只有一次。", "給自己"],
];
const photoCard = ([n, ratio, title, desc, tags]) => tpl(`<div class="ms1-it ms1-${ratio}">
  <img src="${IMG(n)}" alt="${title}" loading="lazy">
  <div class="ms1-cap"><b>${title}</b><span>${desc}</span><div class="ms1-tags">${tags.map((t) => `<i>#${t}</i>`).join("")}</div></div></div>`);
const noteCard = ([c, text, src]) => tpl(`<div class="ms1-it ms1-note ${c}"><q>${text}</q><p>${src}</p></div>`);

// ---------- scene 6: canvas-made images with varied aspect ratios ----------
async function art(w, hgt, hue, label) {
  const c = document.createElement("canvas");
  c.width = w; c.height = hgt;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, w, hgt);
  grad.addColorStop(0, `hsl(${hue} 70% 58%)`);
  grad.addColorStop(1, `hsl(${(hue + 50) % 360} 65% 32%)`);
  g.fillStyle = grad; g.fillRect(0, 0, w, hgt);
  g.fillStyle = "rgba(255,255,255,.9)";
  g.font = `700 ${Math.round(w / 4)}px ${getComputedStyle(document.documentElement).getPropertyValue("--mono")}`;
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(label, w / 2, hgt / 2);
  const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
  return URL.createObjectURL(blob);
}

Showcase.run({ scenes: [
  // 1 ------------------------------------------------------------------
  { id: "wall", title: "靈感牆", api: "new Masonry(grid, { columnWidth: '.sizer', gutter: '.gutter', percentPosition: true })・prepended()・reloadItems()",
    desc: "照片與便利貼高度各不相同，Masonry 把每張卡片放進目前最矮的那一欄。點卡片放大成兩欄寬，其他卡片自動讓位；新增卡片用 prepended() 插到最前面，隨機排序後用 reloadItems() 重新讀取 DOM 順序。",
    hint: "點卡片放大或縮小・往下捲看更多",
    mount(ctx) {
      ctx.html(`<div class="ms-pad ms1"><header class="ms1-head"><b>旅途靈感牆</b><small>不同高度的卡片自動錯落排版</small></header>
        <div class="ms1-grid"><div class="ms1-sizer"></div><div class="ms1-gut"></div></div></div><div class="ms-chip"></div>`);
      const pad = ctx.$(".ms1"), grid = ctx.$(".ms1-grid"), chip = ctx.$(".ms-chip");
      for (let round = 0; round < 2; round++) {
        PHOTO_CARDS.forEach((p, i) => {
          grid.append(photoCard(round ? PHOTO_CARDS[(i + 3) % PHOTO_CARDS.length] : p));
          if (i % 2 === 1) grid.append(noteCard(NOTES[(i + round * 3) % NOTES.length]));
        });
      }
      const m = mason(ctx, grid, { itemSelector: ".ms1-it", columnWidth: ".ms1-sizer", gutter: ".ms1-gut", percentPosition: true, transitionDuration: "0.35s" });
      const show = (what, ms) => (chip.innerHTML = `${what}・<b>${m.items.length}</b> 張・<b>${m.cols}</b> 欄・計算 <b>${fmtMs(ms)}</b>`);
      show("初次排版", 0);
      const r = rng(7);
      const pick = (arr) => arr[Math.floor(r() * arr.length)];
      const toggleBig = (el) => { el.classList.toggle("big"); show(el.classList.contains("big") ? "放大" : "縮小", timed(m)); };
      const add = () => {
        const fresh = r() < 0.5 ? photoCard(pick(PHOTO_CARDS)) : noteCard(pick(NOTES));
        grid.insertBefore(fresh, grid.querySelector(".ms1-it"));
        const t = performance.now();
        m.prepended(fresh);
        show("prepended()", performance.now() - t);
        pad.scrollTo({ top: 0, behavior: "smooth" });
      };
      const shuffle = () => {
        const els = [...grid.querySelectorAll(".ms1-it")];
        for (let i = els.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [els[i], els[j]] = [els[j], els[i]]; }
        els.forEach((el) => grid.append(el));
        const t = performance.now();
        m.reloadItems(); m.layout();
        show("reloadItems() + layout()", performance.now() - t);
      };
      ctx.on(grid, "click", (e) => { const it = e.target.closest(".ms1-it"); if (it) toggleBig(it); });
      ctx.button("新增卡片", add, { primary: true, title: "prepended(elem)" });
      ctx.button("隨機排序", shuffle, { title: "reloadItems() + layout()" });
      let big = null;
      autoplay(ctx, [
        () => toggleBig((big = m.items[2 + Math.floor(r() * 6)].element)),
        add,
        () => toggleBig(big),
        shuffle,
      ]);
    } },

  // 2 ------------------------------------------------------------------
  { id: "columns", title: "欄寬與間距", api: "columnWidth: 數字・gutter: 數字・fitWidth: true・msnry.cols",
    desc: "columnWidth 與 gutter 直接給像素值時，Masonry 用 (容器寬 + gutter) / (欄寬 + gutter) 算出欄數；藍色條是實際的欄位，黃色虛線是容器邊界。開啟 fitWidth 後容器寬度改成剛好包住用到的欄位，再用 margin: auto 置中，右側不再留白。",
    hint: "拖動欄寬、間距滑桿，或切換 fitWidth",
    mount(ctx) {
      ctx.html(`<div class="ms-pad"><div class="ms2-wrap"><div class="ms2-grid"><div class="ms2-guides"></div></div></div></div><div class="ms-chip"></div>`);
      const grid = ctx.$(".ms2-grid"), guides = ctx.$(".ms2-guides"), chip = ctx.$(".ms-chip");
      const r = rng(21);
      for (let i = 1; i <= 26; i++) grid.append(block(i, 50 + Math.floor(r() * 110), i % 7 === 3 ? "w2" : ""));
      let cw = 120, g = 12, fit = false, queued = false;
      const m = mason(ctx, grid, { itemSelector: ".ms-b", columnWidth: cw, gutter: g, transitionDuration: "0.4s" });
      const apply = () => {
        queued = false;
        grid.style.setProperty("--cw", `${cw}px`);
        grid.style.setProperty("--g", `${g}px`);
        m.options.columnWidth = cw; m.options.gutter = g; m.options.fitWidth = fit;
        if (!fit) grid.style.width = ""; // fitWidth wrote an inline width; drop it so the container is full width again
        const ms = timed(m);
        guides.replaceChildren(...Array.from({ length: m.cols }, (_, i) => Object.assign(document.createElement("i"), { style: `left:${i * m.columnWidth}px;width:${cw}px` })));
        chip.innerHTML = `<b>${m.cols}</b> 欄・欄寬 <b>${cw}</b> + 間距 <b>${g}</b>・容器 <b>${grid.offsetWidth}</b> px・layout <b>${fmtMs(ms)}</b>`;
      };
      const queue = () => { if (!queued) { queued = true; ctx.frame().then(apply); } };
      const sw = ctx.slider("欄寬", { min: 70, max: 220, step: 5, value: cw, format: (v) => `${v}px` }, (v) => { cw = v; queue(); });
      const sg = ctx.slider("間距", { min: 0, max: 40, step: 2, value: g, format: (v) => `${v}px` }, (v) => { g = v; queue(); });
      const tf = ctx.toggle("fitWidth", fit, (v) => { fit = v; queue(); });
      apply();
      const set = (w, gap, f) => {
        sw.value = w; sw.dispatchEvent(new Event("input"));
        sg.value = gap; sg.dispatchEvent(new Event("input"));
        if (f !== fit) tf.click();
      };
      autoplay(ctx, [() => set(90, 6, false), () => set(170, 24, false), () => set(170, 24, true), () => set(120, 12, true), () => set(120, 12, false)], 2300, 1500);
    } },

  // 3 ------------------------------------------------------------------
  { id: "percent", title: "百分比定位", api: "percentPosition: true・item.style.left = '25%'",
    desc: "兩邊都是 4 欄、項目寬 25%。容器寬度改變但還沒呼叫 layout() 時，左邊用像素寫的 left 停在原位，欄位出現空隙或互相重疊；右邊 percentPosition 寫的是百分比，會跟著容器一起縮放，不必重排就保持對齊。",
    hint: "切換容器寬度，再按 layout() 比較兩邊",
    mount(ctx) {
      ctx.html(`<div class="ms3">${[false, true].map((p) => `<section><h3>percentPosition: ${p}<small>${p ? "left 用百分比" : "left 用像素"}</small></h3>
        <div class="ms3-box"><div class="ms3-grid"><div class="ms3-sizer"></div></div><div class="ms3-pos"></div></div></section>`).join("")}</div><div class="ms-chip"></div>`);
      const grids = ctx.$$(".ms3-grid"), pos = ctx.$$(".ms3-pos"), chip = ctx.$(".ms-chip");
      const ms = grids.map((grid, k) => {
        const r = rng(5);
        for (let i = 1; i <= 16; i++) grid.append(block(i, 40 + Math.floor(r() * 70)));
        return mason(ctx, grid, { itemSelector: ".ms-b", columnWidth: ".ms3-sizer", percentPosition: k === 1, transitionDuration: "0.5s" });
      });
      const read = () => ms.forEach((m, k) => (pos[k].innerHTML = `#2 的 style.left = <b>${m.items[1].element.style.left || "0"}</b>`));
      ctx.interval(read, 250);
      read();
      let wide = true;
      const resize = (i) => {
        wide = i === 0;
        grids.forEach((g) => g.style.setProperty("--w", wide ? "100%" : "55%"));
        chip.innerHTML = `容器改成 <b>${wide ? "100%" : "55%"}</b>，尚未呼叫 layout()`;
      };
      const relayout = () => {
        const t = ms.map(timed);
        chip.innerHTML = `layout() 完成：像素版 <b>${fmtMs(t[0])}</b>・百分比版 <b>${fmtMs(t[1])}</b>`;
      };
      const seg = ctx.group(["容器 100%", "容器 55%"], 0, resize);
      ctx.button("layout()", relayout, { primary: true });
      chip.textContent = "兩邊目前排列相同";
      autoplay(ctx, [() => { press(seg, 1); resize(1); }, relayout, () => { press(seg, 0); resize(0); }, relayout], 2400, 1000);
    } },

  // 4 ------------------------------------------------------------------
  { id: "stamp", title: "stamp 固定元素", api: "stamp: '.stamp'・msnry.stamp(el)・msnry.unstamp(el)・layout()",
    desc: "黃色公告是絕對定位的固定元素，用 stamp 選項登記後，Masonry 排版時會把它佔的欄位高度墊高，卡片自動繞開。拖曳公告到任何位置，放開前就會即時重排；切換 unstamp() 後卡片不再避開，會直接蓋過去。",
    hint: "拖曳黃色公告，或切換 stamp 開關",
    mount(ctx) {
      ctx.html(`<div class="ms-pad"><div class="ms4-grid"><div class="ms4-sizer"></div>
        <div class="ms4-stamp"><b>置頂公告</b><small>拖曳我，卡片會讓位</small></div></div></div><div class="ms-chip"></div>`);
      const grid = ctx.$(".ms4-grid"), st = ctx.$(".ms4-stamp"), chip = ctx.$(".ms-chip");
      const r = rng(11);
      for (let i = 1; i <= 24; i++) grid.append(block(i, 46 + Math.floor(r() * 90)));
      const m = mason(ctx, grid, { itemSelector: ".ms-b", columnWidth: ".ms4-sizer", gutter: 10, percentPosition: true, stamp: ".ms4-stamp", transitionDuration: "0.3s" });
      let on = true, pending = false;
      const relayout = () => {
        pending = false;
        const ms = timed(m);
        chip.innerHTML = `stamps <b>${m.stamps.length}</b>・公告 <b>${Math.round(st.offsetLeft)}, ${Math.round(st.offsetTop)}</b>・layout <b>${fmtMs(ms)}</b>`;
      };
      const place = (x, y) => {
        st.style.left = `${Math.max(0, Math.min(x, grid.clientWidth - st.offsetWidth))}px`;
        st.style.top = `${Math.max(0, Math.min(y, 320))}px`;
      };
      const PRESETS = [[0, 0], [0.5, 70], [1, 20]];
      const preset = (i) => { const [fx, y] = PRESETS[i]; place(fx * (grid.clientWidth - st.offsetWidth), y); relayout(); };
      const setOn = (v) => {
        on = v; tg.setAttribute("aria-pressed", String(v));
        st.classList.toggle("off", !v);
        st.querySelector("small").textContent = v ? "拖曳我，卡片會讓位" : "已 unstamp：卡片不再避開";
        if (v) m.stamp(st); else m.unstamp(st);
        relayout();
      };
      let drag = null;
      ctx.on(st, "pointerdown", (e) => { drag = { x: e.clientX - st.offsetLeft, y: e.clientY - st.offsetTop }; st.setPointerCapture(e.pointerId); });
      ctx.on(st, "pointermove", (e) => {
        if (!drag) return;
        place(e.clientX - drag.x, e.clientY - drag.y);
        if (!pending) { pending = true; ctx.frame().then(relayout); }
      });
      ctx.on(st, "pointerup", () => (drag = null));
      const seg = ctx.group(["左上", "中間", "右側"], 0, preset);
      const tg = ctx.toggle("stamp", on, (v) => setOn(v));
      place(0, 0); relayout();
      autoplay(ctx, [
        () => { press(seg, 1); preset(1); }, () => { press(seg, 2); preset(2); },
        () => setOn(false), () => setOn(true), () => { press(seg, 0); preset(0); },
      ], 2300, 1200);
    } },

  // 5 ------------------------------------------------------------------
  { id: "order", title: "排列順序", api: "horizontalOrder: true・originLeft: false・originTop: false",
    desc: "黃線依 DOM 順序把卡片連起來。預設每張放進最矮的欄，順序會左右跳；horizontalOrder 改成固定由左到右輪流放，閱讀順序比較穩定；originLeft: false 從右邊開始排（適合由右往左的版面）；originTop: false 從底部往上堆。切換時重建實例，卡片以動畫移到新位置。",
    hint: "切換四種排列方式，看黃線的順序",
    mount(ctx) {
      ctx.html(`<div class="ms-pad"><div class="ms5-grid"><div class="ms5-sizer"></div><svg class="ms5-path"></svg></div></div><div class="ms-chip"></div>`);
      const grid = ctx.$(".ms5-grid"), svg = ctx.$(".ms5-path"), chip = ctx.$(".ms-chip");
      const r = rng(3);
      const HS = [140, 50, 90, 60, 50, 120, 70, 100, 60, 130, 50, 80, 110, 60, 90, 50];
      HS.forEach((v, i) => grid.append(block(i + 1, v + Math.floor(r() * 10))));
      const items = [...grid.querySelectorAll(".ms-b")];
      const MODES = [
        [{}, "預設：每張放進最矮的欄，#2 之後順序左右跳動"],
        [{ horizontalOrder: true }, "horizontalOrder：由左到右輪流放，每列順序固定"],
        [{ originLeft: false }, "originLeft: false：從右邊開始排"],
        [{ originTop: false }, "originTop: false：從底部往上堆"],
      ];
      let m = null;
      ctx.onCleanup(() => m?.destroy());
      const draw = () => {
        const pts = items.map((el) => [el.offsetLeft + el.offsetWidth / 2, el.offsetTop + el.offsetHeight / 2]);
        svg.innerHTML = `<polyline pathLength="1" points="${pts.map((p) => p.join(",")).join(" ")}"/>${pts.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5"/>`).join("")}`;
      };
      const build = (i) => {
        const before = new Map(items.map((el) => [el, el.getBoundingClientRect()]));
        m?.destroy();
        const t = performance.now();
        m = new Masonry(grid, { itemSelector: ".ms-b", columnWidth: ".ms5-sizer", gutter: 10, percentPosition: true, ...MODES[i][0] });
        const ms = performance.now() - t;
        // FLIP: the first layout is instant, so animate from the old box to the new one.
        for (const el of items) {
          const a = before.get(el), b = el.getBoundingClientRect();
          const dx = a.left - b.left, dy = a.top - b.top;
          if (a.width && (dx || dy)) el.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: "none" }], { duration: 500, easing: "cubic-bezier(.2,.7,.2,1)" });
        }
        draw();
        chip.innerHTML = `${MODES[i][1]}・建立 <b>${fmtMs(ms)}</b>`;
      };
      let mode = 0;
      const seg = ctx.group(["預設", "horizontalOrder", "originLeft: false", "originTop: false"], 0, (i) => build((mode = i)));
      build(0);
      ctx.onResize(() => ctx.frame(2).then(draw));
      autoplay(ctx, [() => { mode = (mode + 1) % 4; press(seg, mode); build(mode); }], 2800, 1800);
    } },

  // 6 ------------------------------------------------------------------
  { id: "images", title: "圖片延遲載入", api: "img.onload → msnry.layout()",
    desc: "圖片沒有預先寫好尺寸時，排版當下高度是 0，載入完才撐開。左邊排完就不管，圖片陸續載入後卡片互相重疊；右邊在每張圖的 load 事件呼叫一次 layout()，卡片隨時讓位。imagesLoaded 外掛做的就是這件事，這裡直接用 load 事件，延遲以計時器模擬慢速網路。",
    hint: "按「重新載入」再看一次",
    async mount(ctx) {
      ctx.html(`<div class="ms6">${["排完不管", "每張 load 後 layout()"].map((t, k) => `<section><h3>${t}<span class="ms6-n${k}"></span></h3>
        <div class="ms6-box"><div class="ms6-grid"><div class="ms6-sizer"></div></div></div></section>`).join("")}</div><div class="ms-chip"></div>`);
      const grids = ctx.$$(".ms6-grid"), counts = [ctx.$(".ms6-n0"), ctx.$(".ms6-n1")], chip = ctx.$(".ms-chip");
      const RATIOS = [1.4, 0.7, 1, 1.6, 0.8, 1.25, 0.6, 1.5, 0.9, 1.1, 0.75, 1.3];
      const urls = await Promise.all(RATIOS.map((q, i) => art(240, Math.round(240 * q), (i * 31) % 360, `${i + 1}`)));
      ctx.onCleanup(() => urls.forEach((u) => URL.revokeObjectURL(u)));
      if (!ctx.active) return;
      let ms = [], run = 0;
      ctx.onCleanup(() => ms.forEach((m) => m.destroy()));
      const start = () => {
        const id = ++run, r = rng(Math.floor(Math.random() * 1e6));
        ms.forEach((m) => m.destroy());
        const imgs = grids.map((grid) => {
          grid.querySelectorAll(".ms6-c").forEach((el) => el.remove());
          return RATIOS.map((q, i) => {
            const card = tpl(`<div class="ms6-c"><img alt=""><p>#${i + 1}・240×${Math.round(240 * q)}</p></div>`);
            grid.append(card);
            return card.firstElementChild;
          });
        });
        ms = grids.map((grid) => new Masonry(grid, { itemSelector: ".ms6-c", columnWidth: ".ms6-sizer", gutter: 8, percentPosition: true, transitionDuration: "0.3s" }));
        const loaded = [0, 0];
        let layouts = 0;
        const show = () => {
          counts[0].textContent = `已載入 ${loaded[0]}/12`;
          counts[1].textContent = `已載入 ${loaded[1]}/12・layout() ${layouts} 次`;
          chip.innerHTML = loaded[1] < 12 ? `模擬網路延遲中・<b>${loaded[1]}</b>/12` : "全部載入完成：左邊卡片重疊，右邊排列正確";
        };
        imgs.forEach((list, k) => list.forEach((img) => img.addEventListener("load", () => {
          if (id !== run) return;
          loaded[k]++;
          if (k === 1) { ms[1].layout(); layouts++; }
          show();
        })));
        RATIOS.forEach((_, i) => ctx.timeout(() => { if (id === run) imgs.forEach((list) => (list[i].src = urls[i])); }, 300 + Math.floor(r() * 2600)));
        show();
      };
      ctx.button("重新載入", start, { primary: true });
      start();
      autoplay(ctx, [start], 6500, 6500);
    } },

  // 7 ------------------------------------------------------------------
  { id: "dynamic", title: "動態增刪", api: "appended()・prepended()・remove()・transitionDuration・stagger・on('layoutComplete' | 'removeComplete')",
    desc: "appended() 把新卡片接在最後、prepended() 插到最前面，remove() 先播放消失動畫再移出 DOM，接著 layout() 讓其餘卡片補位。transitionDuration 控制移動時間，stagger 讓每張卡片依序延遲出發；右側記錄 layoutComplete 與 removeComplete 事件，以及從操作到事件觸發經過的時間。",
    hint: "按 appended、remove，再調過場與 stagger",
    mount(ctx) {
      ctx.html(`<div class="ms7"><div class="ms7-box"><div class="ms7-grid"><div class="ms7-sizer"></div></div></div><ol class="ms7-log"></ol></div>`);
      const grid = ctx.$(".ms7-grid"), logEl = ctx.$(".ms7-log");
      const r = rng(17);
      let next = 1;
      const make = () => block(next++, 46 + Math.floor(r() * 90), "new");
      for (let i = 0; i < 14; i++) grid.append(make());
      grid.querySelectorAll(".new").forEach((el) => el.classList.remove("new"));
      const m = mason(ctx, grid, { itemSelector: ".ms-b", columnWidth: ".ms7-sizer", gutter: 8, percentPosition: true, transitionDuration: "0.4s", stagger: 30 });
      let t0 = performance.now();
      const log = (cls, name, text) => {
        logEl.prepend(tpl(`<li class="${cls}"><b>${name}</b> ${text}・<span>+${fmtMs(performance.now() - t0)}</span></li>`));
        while (logEl.children.length > 14) logEl.lastElementChild.remove();
      };
      m.on("layoutComplete", (items) => log("", "layoutComplete", `${items.length} 項`));
      m.on("removeComplete", (items) => log("rm", "removeComplete", `移除 ${items.length} 項`));
      const append = () => { t0 = performance.now(); const els = [make(), make()]; grid.append(...els); m.appended(els); };
      const prepend = () => { t0 = performance.now(); const el = make(); grid.insertBefore(el, grid.querySelector(".ms-b")); m.prepended(el); };
      const remove = () => {
        if (m.items.length < 4) return;
        t0 = performance.now();
        const pick = new Set();
        while (pick.size < 2) pick.add(m.items[Math.floor(r() * m.items.length)].element);
        m.remove([...pick]); m.layout();
      };
      const reshape = () => { t0 = performance.now(); m.items.forEach((it) => (it.element.style.height = `${46 + Math.floor(r() * 90)}px`)); m.layout(); };
      ctx.button("appended", append, { primary: true, title: "appended([el, el])" });
      ctx.button("prepended", prepend, { title: "prepended(el)" });
      ctx.button("remove", remove, { title: "remove([el, el]) + layout()" });
      ctx.button("改高度", reshape, { title: "改每張高度後 layout()" });
      ctx.slider("過場", { min: 0, max: 1.5, step: 0.05, value: 0.4, format: (v) => `${v.toFixed(2)}s` }, (v) => (m.options.transitionDuration = `${v}s`));
      ctx.slider("stagger", { min: 0, max: 150, step: 10, value: 30, format: (v) => `${v}ms` }, (v) => (m.options.stagger = v));
      autoplay(ctx, [append, reshape, prepend, remove, () => (m.items.length > 20 ? remove() : append())], 2200, 1000);
    } },

  // 8 ------------------------------------------------------------------
  { id: "stress", title: "極限測試", kind: "stress", api: "new Masonry(grid, { initLayout: false })・layout()",
    desc: "項目從 100 個加到 10 萬個，量建立實例（讀取並登記每個項目）與 layout() 一次排完的耗時；右側保留最後一級的牆面頂端。右上角可切換是否先在 CSS 把項目設成絕對定位，比較兩者差距。",
    hint: "按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="ms8"><div class="ms8-empty">按「開始測試」後，這裡會顯示每一級排好的牆面</div></div>`);
      const view = ctx.$(".ms8");
      let m = null;
      ctx.onCleanup(() => m?.destroy());
      ctx.toggle("CSS 預先 absolute", false, (v) => view.classList.toggle("pre", v));
      ctx.bench({
        label: "項目", unit: "個", sizes: [100, 1000, 3000, 10000, 30000, 100000], target: 100, budget: 3000,
        prepare(n) {
          m?.destroy(); m = null;
          const grid = document.createElement("div");
          grid.className = "ms8-grid";
          const r = rng(n), frag = document.createDocumentFragment();
          for (let i = 0; i < n; i++) {
            const d = document.createElement("div");
            d.className = `ms8-i k${i % 6}`;
            d.style.height = `${12 + Math.floor(r() * 48)}px`;
            frag.append(d);
          }
          grid.append(frag);
          view.replaceChildren(grid);
          void grid.offsetHeight; // settle the static layout before timing
          return grid;
        },
        run(n, grid) {
          const t0 = performance.now();
          m = new Masonry(grid, { itemSelector: ".ms8-i", columnWidth: 36, gutter: 4, transitionDuration: 0, initLayout: false, resize: false });
          const t1 = performance.now();
          m.layout();
          const t2 = performance.now();
          return `layout() ${fmtMs(t2 - t1)}・建立 ${fmtMs(t1 - t0)}・${m.cols} 欄・牆高 ${fmt(Math.round(m.maxY))} px${view.classList.contains("pre") ? "・預先 absolute" : ""}`;
        },
        note: "計時包含建構實例（替每個項目建立 Item 並改成 position: absolute）與一次 layout()：量容器與欄寬，逐一讀取每個項目的尺寸放進最矮的欄，再寫入 left / top。本機實測在一般 CSS 下，layout() 第一次量尺寸會強制瀏覽器重排剛轉成絕對定位的整面牆，這一步接近平方成長（1 萬個約 0.57 秒、3 萬個約 4.6 秒）；打開「CSS 預先 absolute」讓項目一開始就是 position: absolute; left: 0; top: 0，3 萬個降到約 0.58 秒、10 萬個約 1.3 秒，回到線性。上千張的牆仍建議無限捲動分批 appended()。建立 DOM 的時間不計入，transitionDuration 設為 0。",
      });
    } },
] });
</script>
</body>
</html>
