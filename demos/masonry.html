<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masonry 示範：Pinterest 風靈感牆</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .scroller { position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 56px 12px 48px; }
  .topfade { position: fixed; left: 0; right: 0; top: 0; height: 54px; z-index: 40; pointer-events: none; background: linear-gradient(var(--bg) 78%, rgba(14,16,19,0)); }
  .title { position: fixed; left: 14px; top: 14px; z-index: 50; font-weight: 700; font-size: 15px; display: flex; gap: 8px; align-items: center; }
  .title small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .grid { margin: 0 auto; }
  .grid-sizer, .item { width: calc((100% - 30px) / 4); }
  .gutter { width: 10px; }
  .item { margin-bottom: 10px; border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--bg-2); border: 1px solid var(--line); transition: box-shadow .2s; }
  .item:hover { box-shadow: 0 0 0 2px var(--accent); }
  .item.big { width: calc((100% - 30px) / 4 * 2 + 10px); }
  .item img { display: block; width: 100%; object-fit: cover; }
  .item .cap { padding: 8px 10px 10px; font-size: 12.5px; line-height: 1.45; }
  .item .cap b { display: block; font-size: 13px; }
  .item .cap span { color: var(--muted); font-size: 11.5px; }
  .r-tall img { aspect-ratio: 3 / 4; } .r-xtall img { aspect-ratio: 2 / 3; }
  .r-sq img { aspect-ratio: 1; } .r-wide img { aspect-ratio: 4 / 3; } .r-pano img { aspect-ratio: 16 / 9; }
  .note { padding: 14px 14px 16px; border: none; color: #15151a; }
  .note q { display: block; font-size: 15px; font-weight: 700; line-height: 1.5; quotes: "「" "」"; }
  .note p { margin: 8px 0 0; font-size: 12px; opacity: .75; }
  .note.c1 { background: var(--c1); } .note.c2 { background: var(--c2); } .note.c3 { background: var(--c3); color: #fff; }
  .note.c4 { background: var(--c4); } .note.c5 { background: var(--c5); } .note.c6 { background: var(--c6); color: #fff; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .tags i { font-style: normal; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--muted); }
  @media (max-width: 760px) { .grid-sizer, .item { width: calc((100% - 20px) / 3); } .item.big { width: calc((100% - 20px) / 3 * 2 + 10px); } }
  /* cards fill the whole viewport and scroll under the fixed hint at every size: show it briefly, then fade it out */
  .hint { animation: hint-fade .5s 8s forwards; }
  @media (max-width: 480px) { .grid-sizer, .item { width: calc((100% - 10px) / 2); } .item.big { width: 100%; } .title small { display: none; } }
</style>
</head>
<body>
<div class="topfade"></div>
<div class="title">旅途靈感牆 <small>不同高度的卡片自動錯落排版</small></div>
<div class="controls">
  <button class="btn primary" id="add">新增卡片</button>
  <button class="btn" id="shuffle">隨機排序</button>
</div>
<div class="scroller" id="scroller">
  <div class="grid" id="grid">
    <div class="grid-sizer"></div><div class="gutter"></div>
  </div>
</div>
<div class="hint">往下捲看更多・點卡片放大或縮小，其他卡片會自動讓位</div>

<script src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js"></script>
<script>
// Masonry: absolute-positions mixed-height cards into the shortest column; relayout animates on change.
const PHOTO_CARDS = [
  [1, "r-tall", "挪威峽灣", "清晨的水面像鏡子一樣", ["北歐", "健行"]],
  [5, "r-xtall", "瀑布彩虹", "午後陽光才看得到", ["攝影", "秘境"]],
  [3, "r-wide", "山谷公路", "一路開到雲裡面", ["自駕", "公路"]],
  [7, "r-sq", "草原母獅", "長鏡頭等了兩小時", ["野生動物"]],
  [2, "r-tall", "紅岩峽谷", "光線從縫隙灑落", ["地景", "沙漠"]],
  [6, "r-sq", "藍色水母", "水族館最安靜的角落", ["海洋"]],
  [4, "r-wide", "披毯巴哥", "旅伴兼行李監督員", ["寵物"]],
  [8, "r-pano", "海象群", "整片海灘都在打呼", ["極地", "生態"]],
];
const NOTES = [
  ["c1", "出發前把行程排鬆一點，留白才有驚喜。", "旅行筆記 #12"],
  ["c2", "花蓮的海和挪威的峽灣，藍得不一樣。", "東部散策"],
  ["c3", "最好的照片，常常在迷路的時候拍到。", "攝影小語"],
  ["c4", "下一站：阿里山看日出，記得帶外套。", "待辦清單"],
  ["c5", "帶一本小筆記本，比一百張照片更記得住。", "旅行筆記 #7"],
  ["c6", "風景會變，但當下的心情只有一次。", "給自己"],
];

const grid = document.getElementById("grid");
function photoCard([n, ratio, title, desc, tags]) {
  const el = document.createElement("div");
  el.className = `item ${ratio}`;
  el.innerHTML = `<img src="_shared/img/photo-${n}.jpg" alt="${title}" loading="lazy">
    <div class="cap"><b>${title}</b><span>${desc}</span><div class="tags">${tags.map((t) => `<i>#${t}</i>`).join("")}</div></div>`;
  return el;
}
function noteCard([c, text, src]) {
  const el = document.createElement("div");
  el.className = `item note ${c}`;
  el.innerHTML = `<q>${text}</q><p>${src}</p>`;
  return el;
}

// Interleave photos and notes, twice over, for a wall long enough to scroll.
const items = [];
for (let round = 0; round < 2; round++) {
  PHOTO_CARDS.forEach((p, i) => {
    items.push(photoCard(round ? PHOTO_CARDS[(i + 3) % PHOTO_CARDS.length] : p));
    if (i % 2 === 1) items.push(noteCard(NOTES[(i + round * 3) % NOTES.length]));
  });
}
items.forEach((el) => grid.append(el));

const msnry = new Masonry(grid, {
  itemSelector: ".item",
  columnWidth: ".grid-sizer",
  gutter: ".gutter",
  percentPosition: true,
  transitionDuration: "0.35s",
});

grid.addEventListener("click", (e) => {
  const item = e.target.closest(".item");
  if (!item) return;
  item.classList.toggle("big");
  msnry.layout();
});

document.getElementById("add").onclick = () => {
  const fresh = Math.random() < 0.5
    ? photoCard(PHOTO_CARDS[Math.floor(Math.random() * PHOTO_CARDS.length)])
    : noteCard(NOTES[Math.floor(Math.random() * NOTES.length)]);
  grid.insertBefore(fresh, grid.querySelector(".item"));
  msnry.prepended(fresh);
  document.getElementById("scroller").scrollTo({ top: 0, behavior: "smooth" });
};

document.getElementById("shuffle").onclick = () => {
  const els = [...grid.querySelectorAll(".item")];
  for (let i = els.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [els[i], els[j]] = [els[j], els[i]];
  }
  els.forEach((el) => grid.append(el));
  msnry.reloadItems();
  msnry.layout();
};

// Images have fixed aspect ratios, but relayout after load in case caption heights shift.
window.addEventListener("load", () => msnry.layout());
</script>
</body>
</html>
