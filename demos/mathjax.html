<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathJax 示範：整頁教材自動排版與公式編號</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"字型與無障礙模組由 MathJax 從 jsDelivr 按需載入"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-bottom: 42px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; background: var(--bg-2); border-bottom: 1px solid var(--line); }
  .top b { font-size: 15px; margin-right: 4px; white-space: nowrap; }
  .top .sp { flex: 1; }
  .top .btn { padding: 6px 11px; font-size: 12.5px; white-space: nowrap; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 6px 11px; font: 600 12.5px var(--font); cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: #fff; }
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; min-height: 0; }
  .sheet { min-height: 0; overflow: auto; padding: 16px 18px 24px; scrollbar-width: thin; }
  .page {
    max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .07); padding: 22px 30px 26px; font-size: 15px; line-height: 1.85; color: #2a2925;
  }
  .page h1 { font-size: 21px; margin: 0 0 2px; letter-spacing: .02em; }
  .page h1 span { color: var(--c2); margin-right: 8px; }
  .page .lead { margin: 0 0 12px; font-size: 12px; color: var(--muted); border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
  .page h2 { font-size: 16px; margin: 18px 0 4px; padding-left: 10px; border-left: 4px solid var(--c2); }
  .page p { margin: 6px 0; }
  .page .box { margin: 6px 0; padding: 2px 12px; border-radius: 8px; background: #fff8d6; border: 1px dashed #d4a900; animation: pop .6s ease; }
  .page .box b { font-size: 12px; color: #8a6d00; }
  @keyframes pop { from { background: #ffe55c; } }
  .page mjx-container { cursor: pointer; border-radius: 4px; transition: background .15s; }
  .page mjx-container:hover { background: rgba(31, 143, 184, .08); }
  .page mjx-container.sel { background: rgba(31, 143, 184, .14); outline: 1.5px solid rgba(31, 143, 184, .5); }
  .page mjx-container[display="true"] { padding: 2px 0; }
  .ref-flash { animation: flash 1.4s ease; }
  @keyframes flash { 0%, 40% { background: #ffe55c; } }
  pre.src { margin: 0; white-space: pre-wrap; word-break: break-all; font: 12px/1.7 var(--mono); color: #3a5a40; }
  pre.src .m { color: var(--c3); }
  .side { border-left: 1px solid var(--line); background: var(--bg-2); min-height: 0; display: flex; flex-direction: column; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
  .stats div { padding: 10px 6px 8px; text-align: center; font-size: 11px; color: var(--muted); }
  .stats div + div { border-left: 1px solid var(--line); }
  .stats b { display: block; font: 700 20px var(--mono); color: var(--fg); }
  .insp { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px; scrollbar-width: thin; }
  .insp h3 { margin: 0 0 4px; font-size: 13px; }
  .insp h3 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .insp label { display: block; margin: 10px 0 4px; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .insp pre { margin: 0; padding: 8px 10px; background: #f6f5f1; border: 1px solid var(--line); border-radius: 7px; white-space: pre-wrap; word-break: break-all; font: 11.5px/1.55 var(--mono); color: #33322d; }
  .insp pre.mml { color: #1f5f8b; max-height: 220px; overflow: auto; }
  .insp .speech { font-size: 12.5px; color: #3c3a34; background: #eef7fb; border-color: rgba(31, 143, 184, .3); font-family: var(--font); }
  .empty { color: var(--muted); font-size: 13px; }
  .insp .tip { margin: 0; font-size: 12px; line-height: 1.6; color: var(--muted); }
  @media (max-width: 760px) {
    .main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 160px; }
    .side { border-left: 0; border-top: 1px solid var(--line); }
    .stats div { padding: 4px 6px 3px; }
    .stats b { display: inline; font-size: 14px; margin-right: 4px; }
    .sheet { padding: 10px 10px 16px; }
    .page { padding: 14px 16px 18px; font-size: 14px; }
    .top b { display: none; }
    .top .sp { display: none; }
    .insp { padding: 8px 12px; }
    .insp pre.mml { max-height: 70px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="top">
    <b>MathJax 教材排版</b>
    <div class="seg" id="view">
      <button data-v="out" aria-pressed="true">排版結果</button>
      <button data-v="src" aria-pressed="false">原稿</button>
    </div>
    <span class="sp"></span>
    <button class="btn primary" id="ins" aria-pressed="false">＋插入週期公式</button>
  </div>
  <div class="main">
    <div class="sheet" id="sheet"><div class="page" id="page"></div></div>
    <aside class="side">
      <div class="stats">
        <div><b id="nAll">0</b>公式總數</div>
        <div><b id="nTag">0</b>自動編號</div>
        <div><b id="tMs">0</b>排版 ms</div>
      </div>
      <div class="insp" id="insp"><p class="empty">點頁面上任一公式，這裡會顯示它的 TeX 原始碼、MathJax 產生的 MathML 與螢幕報讀文字。</p></div>
    </aside>
  </div>
</div>
<div class="hint">點公式看 MathML・按「插入」看編號與引用自動更新</div>

<script>
// One HTML source string with TeX ($...$, \begin{equation}, \label/\eqref, mhchem \ce) and raw MathML.
// MathJax finds and typesets everything inside #page; the "原稿" tab shows this exact source.
function source(withPeriod) {
  return String.raw`<h1><span>3-2</span>簡諧運動與能量守恆</h1>
<p class="lead">高二物理・示意教材（整頁由 MathJax 自動排版）</p>
<p>質量為 $m$ 的物體掛在彈力常數 $k$ 的彈簧上。由虎克定律 $F = -kx$ 與牛頓第二定律 $F = ma$，得到運動方程式：</p>
\begin{equation} m\frac{d^2x}{dt^2} + kx = 0 \label{eq:ode} \end{equation}
<p>式 \eqref{eq:ode} 的通解為</p>
\begin{equation} x(t) = A\cos(\omega t + \phi), \qquad \omega = \sqrt{\frac{k}{m}} \label{eq:sol} \end{equation}
${withPeriod ? String.raw`<div class="box"><b>補充</b>　由角頻率 $\omega$ 可得週期：
\begin{equation} T = \frac{2\pi}{\omega} = 2\pi\sqrt{\frac{m}{k}} \label{eq:period} \end{equation}</div>
` : ""}<p>將式 \eqref{eq:sol} 代入動能與彈性位能，總力學能為定值：</p>
\begin{align} E &= \tfrac{1}{2} m v^2 + \tfrac{1}{2} k x^2 \label{eq:energy} \\ &= \tfrac{1}{2} k A^2 \notag \end{align}
<h2>延伸：化學反應中的能量</h2>
<p>甲烷完全燃燒會放熱，$\Delta H = -890\ \mathrm{kJ/mol}$：</p>
\begin{equation} \ce{CH4(g) + 2O2(g) -> CO2(g) + 2H2O(l)} \label{eq:ch4} \end{equation}
<p>哈柏法合成氨是可逆反應 $\ce{N2 + 3H2 <=> 2NH3}$。比較式 \eqref{eq:energy} 與式 \eqref{eq:ch4}，能量守恆同時貫穿物理與化學。</p>
<h2>直接寫 MathML 也可以</h2>
<p>下面這條黃金比例是用 MathML 標籤寫的，MathJax 一樣能排版：</p>
<math display="block"><mi>φ</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mo>≈</mo><mn>1.618</mn></math>`;
}

window.MathJax = {
  loader: { load: ["[tex]/mhchem"] },
  tex: {
    inlineMath: [["$", "$"], ["\\(", "\\)"]],
    tags: "ams",
    packages: { "[+]": ["mhchem"] },
  },
  startup: {
    typeset: false,
    ready() {
      MathJax.startup.defaultReady();
      MathJax.startup.promise.then(() => typesetPage(false));
    },
  },
};

const page = document.getElementById("page");
const insp = document.getElementById("insp");
const insBtn = document.getElementById("ins");
let withPeriod = false;
let view = "out";
let selected = null;

function esc(s) {
  return s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

async function typesetPage(flash) {
  if (view === "src") {
    // show the raw source with math delimiters highlighted
    const html = esc(source(withPeriod)).replace(/(\$[^$]+\$|\\begin\{(equation|align)\}[\s\S]*?\\end\{\2\}|\\eqref\{[^}]+\})/g, '<span class="m">$1</span>');
    page.innerHTML = `<pre class="src">${html}</pre>`;
    return;
  }
  MathJax.typesetClear([page]);
  MathJax.texReset();               // restart equation numbering and labels
  page.innerHTML = source(withPeriod);
  const t0 = performance.now();
  await MathJax.typesetPromise([page]);
  const ms = performance.now() - t0;
  const items = MathJax.startup.document.getMathItemsWithin(page);
  document.getElementById("nAll").textContent = items.length;
  document.getElementById("nTag").textContent = countTags(items);
  document.getElementById("tMs").textContent = Math.round(ms);
  if (flash) {
    page.querySelector(".box")?.scrollIntoView({ block: "center", behavior: "smooth" });
    page.querySelectorAll("mjx-container:not([display='true'])").forEach((el) => {
      if (/^\(\d\)$/.test(el.textContent.trim()) || el.querySelector("a")) el.classList.add("ref-flash");
    });
  }
  selected = null;
}

// Every numbered equation on this page carries a \label, so count labels in display math.
function countTags(items) {
  return items.reduce((n, it) => n + (it.display ? (it.math.match(/\\label/g) || []).length : 0), 0);
}

function showItem(item, el) {
  if (selected) selected.classList.remove("sel");
  selected = el;
  el.classList.add("sel");
  // drop the semantic-enrichment data-* attributes so the MathML stays readable
  const mml = MathJax.startup.toMML(item.root).replace(/\s+data-[\w-]+="[^"]*"/g, "");
  const speech = el.getAttribute("data-semantic-speech-none") || "";
  const braille = el.getAttribute("data-semantic-braille") || "";
  const tag = item.display ? (el.querySelector("mjx-mlabeledtr, mjx-labels") ? "區塊・有編號" : "區塊") : "行內";
  const kind = item.inputJax.name === "MathML" ? "MathML 輸入" : "TeX 輸入";
  insp.innerHTML = `<h3>選取的公式<small>${tag}・${kind}</small></h3>
    <label>原始碼</label><pre>${esc(item.math.trim())}</pre>
    <label>MathJax 轉出的 MathML（無障礙用）</label><pre class="mml">${esc(mml)}</pre>
    ${speech ? `<label>螢幕報讀文字（英文 ClearSpeak）</label><pre class="speech">${esc(speech)}</pre>` : ""}
    ${braille ? `<label>點字（Nemeth）</label><pre class="speech">${esc(braille)}</pre>` : ""}
    <label>鍵盤探索</label><p class="tip">公式已取得焦點，可用方向鍵逐層瀏覽子運算式（MathJax 表達式探索器），Esc 離開。</p>`;
}

page.addEventListener("click", (e) => {
  const el = e.target.closest("mjx-container");
  if (!el || !window.MathJax?.startup?.document) return;
  const item = MathJax.startup.document.getMathItemsWithin(page).find((it) => it.typesetRoot === el);
  if (item) showItem(item, el);
});

document.getElementById("view").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#view button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  insp.innerHTML = view === "src"
    ? '<p class="empty">這是送進 MathJax 前的原稿：一般 HTML 夾著 $…$、\\begin{equation}、\\label、\\eqref、\\ce 與 &lt;math&gt; 標籤，沒有任何手動編號。</p>'
    : '<p class="empty">點頁面上任一公式，這裡會顯示它的 TeX 原始碼、MathJax 產生的 MathML 與螢幕報讀文字。</p>';
  typesetPage(false);
});

insBtn.addEventListener("click", () => {
  withPeriod = !withPeriod;
  insBtn.setAttribute("aria-pressed", withPeriod);
  insBtn.textContent = withPeriod ? "－移除週期公式" : "＋插入週期公式";
  typesetPage(withPeriod);
});
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js" async></script>
</body>
</html>
