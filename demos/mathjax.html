<script>
// MathJax showcase: one global CHTML document (TeX + MathML + AsciiMath input, a11y on)
// plus a second, a11y-free SVG document built from MathJax's internal classes.
const R = String.raw;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const disp = (tex) => R`\[` + esc(tex) + R`\]`;
let mjResolve;
const mjReady = new Promise((r) => (mjResolve = r));
window.MathJax = {
  loader: { load: ["output/svg", "input/asciimath", "[tex]/physics", "[tex]/mhchem"] },
  tex: {
    inlineMath: [["$", "$"], [R`\(`, R`\)`]],
    tags: "ams",
    packages: { "[+]": ["physics", "mhchem"] },
    macros: { R: R`\mathbb{R}`, vect: [R`\mathbf{#1}`, 1], E: R`\operatorname{\mathbb{E}}` },
  },
  svg: { fontCache: "none" },
  startup: {
    typeset: false,
    ready() { MathJax.startup.defaultReady(); MathJax.startup.promise.then(mjResolve); },
  },
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-mml-chtml.js" async></script>
<script src="_shared/showcase.js"></script>
<script>
const A11Y = ["enableEnrichment", "enableSpeech", "enableBraille", "enableExplorer"];

// MathJax must not typeset two batches at once, so every call goes through one promise chain.
let chain = Promise.resolve();
function typeset(els, { a11y = true } = {}) {
  const job = chain.then(async () => {
    const D = MathJax.startup.document;
    const prev = A11Y.map((k) => D.options[k]);
    if (!a11y) A11Y.forEach((k) => (D.options[k] = false));
    try { await MathJax.typesetPromise(els); } finally { A11Y.forEach((k, i) => (D.options[k] = prev[i])); }
  });
  chain = job.catch((e) => console.error("MathJax 排版失敗：", e));
  return job;
}
function clearAll() { if (window.MathJax && MathJax.typesetClear) MathJax.typesetClear(); }

// Second document with SVG output; it has no a11y handlers, which makes it a clean speed baseline.
let svgDocCache = null;
function svgDoc() {
  if (!svgDocCache) {
    const { TeX } = MathJax._.input.tex_ts;
    const { SVG } = MathJax._.output.svg_ts;
    svgDocCache = MathJax._.mathjax.mathjax.document(document, {
      InputJax: new TeX({ ...MathJax.config.tex, tags: "none" }),
      OutputJax: new SVG({ ...MathJax.config.svg, fontCache: "none" }),
    });
  }
  return svgDocCache;
}
function typesetSVG(el) {
  const job = chain.then(() => MathJax._.mathjax.mathjax.handleRetriesFor(() => {
    const doc = svgDoc();
    doc.clear(); doc.reset();
    doc.findMath({ elements: [el] }).compile().getMetrics().typeset().updateDocument();
  }));
  chain = job.catch((e) => console.error("MathJax SVG 排版失敗：", e));
  return job;
}
// Every scene waits for MathJax, and clears all MathItems when it unmounts.
async function boot(ctx) {
  ctx.onCleanup(clearAll);
  if (window.MathJax && MathJax.typesetPromise) return ctx.active;
  const st = ctx.status("載入 MathJax 與字型…");
  await mjReady;
  st.done();
  return ctx.active;
}
const stripData = (mml) => mml.replace(/\s+data-[\w-]+="[^"]*"/g, "");
const kb = (n) => `${(n / 1024).toFixed(1)} KB`;

// Scene 1 source: plain HTML with TeX, \label/\eqref, mhchem and a raw MathML block.
function textbook(withPeriod) {
  return R`<h1><span>3-2</span>簡諧運動與能量守恆</h1>
<p class="mj-lead">高二物理・示意教材（整頁由 MathJax 自動排版）</p>
<p>質量為 $m$ 的物體掛在彈力常數 $k$ 的彈簧上。由虎克定律 $F = -kx$ 與牛頓第二定律 $F = ma$，得到運動方程式：</p>
\begin{equation} m\frac{d^2x}{dt^2} + kx = 0 \label{eq:ode} \end{equation}
<p>式 \eqref{eq:ode} 的通解為</p>
\begin{equation} x(t) = A\cos(\omega t + \phi), \qquad \omega = \sqrt{\frac{k}{m}} \label{eq:sol} \end{equation}
${withPeriod ? R`<div class="mj-box"><b>補充</b>　由角頻率 $\omega$ 可得週期：
\begin{equation} T = \frac{2\pi}{\omega} = 2\pi\sqrt{\frac{m}{k}} \label{eq:period} \end{equation}</div>
` : ""}<p>將式 \eqref{eq:sol} 代入動能與彈性位能，總力學能為定值：</p>
\begin{align} E &= \tfrac{1}{2} m v^2 + \tfrac{1}{2} k x^2 \label{eq:energy} \\ &= \tfrac{1}{2} k A^2 \notag \end{align}
<h2>延伸：化學反應中的能量</h2>
<p>甲烷完全燃燒會放熱，$\Delta H = -890\ \mathrm{kJ/mol}$：</p>
\begin{equation} \ce{CH4(g) + 2O2(g) -> CO2(g) + 2H2O(l)} \label{eq:ch4} \end{equation}
<p>哈柏法合成氨是可逆反應 $\ce{N2 + 3H2 <=> 2NH3}$。比較式 \eqref{eq:energy} 與式 \eqref{eq:ch4}，能量守恆同時貫穿物理與化學。</p>
<h2>直接寫 MathML 也可以</h2>
<p>下面這條黃金比例是用 MathML 標籤寫的，MathJax 一樣能排版：</p>
<math display="block"><mi>φ</mi><mo>=</mo><mfrac><mrow><mn>1</mn><mo>+</mo><msqrt><mn>5</mn></msqrt></mrow><mn>2</mn></mfrac><mo>≈</mo><mn>1.618</mn></math>`;
}

const FORMULAS = [
  ["二次公式", R`x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a}`],
  ["畢氏定理", R`a^2 + b^2 = c^2`],
  ["高斯積分", R`\int_{-\infty}^{\infty} e^{-x^2}\,dx = \sqrt{\pi}`],
  ["巴賽爾級數", R`\sum_{n=1}^{\infty} \frac{1}{n^2} = \frac{\pi^2}{6}`],
  ["旋轉矩陣", R`\begin{pmatrix} \cos\theta & -\sin\theta \\ \sin\theta & \cos\theta \end{pmatrix}`],
  ["法拉第定律", R`\oint_{\partial S} \mathbf{E}\cdot d\mathbf{l} = -\frac{d}{dt}\iint_S \mathbf{B}\cdot d\mathbf{A}`],
  ["導數定義", R`f'(x) = \lim_{h \to 0} \frac{f(x+h) - f(x)}{h}`],
  ["燃燒反應", R`\ce{CH4 + 2O2 -> CO2 + 2H2O}`],
];

Showcase.run({ scenes: [
  {
    id: "textbook", title: "教材自動排版", paper: true,
    api: "MathJax.typesetPromise([el])・texReset()・tags: 'ams'",
    desc: "整頁 HTML 夾著 $…$、equation、align、\\ce 與 <math>，MathJax 掃描後一次排版，自動編號並解析 \\eqref 交互參照。",
    hint: "點公式看 MathML 與報讀文字・插入週期公式後編號與引用自動重排",
    async mount(ctx) {
      ctx.html(`<div class="mj-board mj-book">
        <div class="mj-card"><div class="mj-page"></div></div>
        <aside class="mj-card mj-side">
          <div class="mj-stats"><div><b>0</b>公式總數</div><div><b>0</b>自動編號</div><div><b>0</b>排版 ms</div></div>
          <div class="mj-insp"><p class="mj-empty">點頁面上任一公式，這裡會顯示它的 TeX 原始碼、MathJax 轉出的 MathML 與螢幕報讀文字。</p></div>
        </aside></div>`);
      const page = ctx.$(".mj-page"), insp = ctx.$(".mj-insp"), [nAll, nTag, nMs] = ctx.$$(".mj-stats b");
      let withPeriod = false, view = 0, selected = null;
      ctx.group(["排版結果", "原稿"], 0, (i) => { view = i; render(false); });
      const ins = ctx.button("＋插入週期公式", () => {
        withPeriod = !withPeriod;
        ins.textContent = withPeriod ? "－移除週期公式" : "＋插入週期公式";
        render(withPeriod);
      }, { primary: true });
      if (!(await boot(ctx))) return;

      async function render(flash) {
        selected = null;
        if (view === 1) {
          clearAll();
          const html = esc(textbook(withPeriod)).replace(/(\$[^$]+\$|\\begin\{(equation|align)\}[\s\S]*?\\end\{\2\}|\\eqref\{[^}]+\}|&lt;math[\s\S]*?&lt;\/math&gt;)/g, "<span>$1</span>");
          page.innerHTML = `<pre class="mj-src">${html}</pre>`;
          insp.innerHTML = `<p class="mj-empty">送進 MathJax 前的原稿：一般 HTML 夾著 $…$、\\begin{equation}、\\label、\\eqref、\\ce 與 &lt;math&gt; 標籤，沒有任何手寫編號。</p>`;
          return;
        }
        MathJax.typesetClear([page]);
        MathJax.texReset();
        page.innerHTML = textbook(withPeriod);
        const t0 = performance.now();
        await typeset([page]);
        if (!ctx.active) return;
        const items = MathJax.startup.document.getMathItemsWithin(page);
        nAll.textContent = items.length;
        nTag.textContent = items.reduce((n, it) => n + (it.display ? (it.math.match(/\\label/g) || []).length : 0), 0);
        nMs.textContent = Math.round(performance.now() - t0);
        insp.innerHTML = `<p class="mj-empty">點頁面上任一公式，這裡會顯示它的 TeX 原始碼、MathJax 轉出的 MathML 與螢幕報讀文字。</p>`;
        if (flash) {
          const box = page.querySelector(".mj-box"), card = page.parentElement;
          if (box) card.scrollTo({ top: box.offsetTop - card.clientHeight / 3, behavior: "smooth" });
          page.querySelectorAll("mjx-container:not([display='true'])").forEach((el) => { if (el.querySelector("a") || /^\(\d\)$/.test(el.textContent.trim())) el.classList.add("mj-flash"); });
        }
      }
      ctx.on(page, "click", (e) => {
        const el = e.target.closest("mjx-container");
        if (!el) return;
        const item = MathJax.startup.document.getMathItemsWithin(page).find((it) => it.typesetRoot === el);
        if (!item) return;

    id: "stress", title: "極限測試", kind: "stress",
    api: "typesetPromise([container]) × N 條 display 公式",
    desc: "把 N 條區塊公式放進隱藏容器後一次排版，量測吞吐量（式/秒）。可切換 CHTML 或 SVG 輸出，以及是否產生報讀文字與點字，後者是最大的成本。",
    hint: "按「開始測試」逐級加量・打開「報讀與點字」再測，看無障礙資料的代價",
    async mount(ctx) {
      ctx.html(`<div class="mj-stress"><header></header><div class="mj-wall"></div></div><div class="mj-sink"></div>`);
      const head = ctx.$(".mj-stress header"), wall = ctx.$(".mj-wall"), sink = ctx.$(".mj-sink");
      let output = "chtml", a11y = false;
      const label = () => `${output === "svg" ? "SVG" : "CHTML"}${output === "chtml" && a11y ? "＋報讀與點字" : ""}`;
      ctx.controls.classList.add("bottom");
      ctx.select("輸出", [{ value: "chtml", label: "CHTML" }, { value: "svg", label: "SVG" }], output, (v) => { output = v; head.innerHTML = `模式 <b>${label()}</b>`; });
      ctx.toggle("報讀與點字（僅 CHTML）", false, (v) => { a11y = v; head.innerHTML = `模式 <b>${label()}</b>`; });
      if (!(await boot(ctx))) return;
      wall.innerHTML = Array.from({ length: 40 }, (_, i) => `<div>${disp(FORMULAS[i % FORMULAS.length][1])}</div>`).join("");
      await typeset([wall], { a11y: false });
      if (!ctx.active) return;
      head.innerHTML = `模式 <b>${label()}</b>・下方為樣本（${FORMULAS.length} 種公式循環）`;
      ctx.onCleanup(() => { sink.textContent = ""; });
      ctx.bench({
        label: "公式數", unit: "式", sizes: [10, 25, 50, 100, 250, 500, 1000, 2000], target: 1000, budget: 3000,
        note: "每一級把 N 條公式寫進隱藏容器後呼叫一次排版，計時只含排版本身。開啟報讀與點字時，CHTML 每條公式都要跑語意分析。",
        prepare(n) {
          MathJax.typesetClear([sink]);
          sink.innerHTML = Array.from({ length: n }, (_, i) => `<div>${disp(FORMULAS[i % FORMULAS.length][1])}</div>`).join("");
        },
        async run(n) {
          const t0 = performance.now();
          if (output === "svg") await typesetSVG(sink); else await typeset([sink], { a11y });
          const rate = n / ((performance.now() - t0) / 1000);
          head.innerHTML = `模式 <b>${label()}</b>・本輪 <b>${Showcase.fmt(n)}</b> 式・每秒約 <b>${Showcase.fmtCompact(rate)}</b> 式`;
          return `${Showcase.fmtCompact(rate)} 式/秒`;
        },
      });
    },
  },
] });
</script>
</body>
</html>
