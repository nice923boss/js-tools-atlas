<script>
// math.js showcase: calculator, parse/compile, units, matrices, number types, symbolic, statistics, stress.
const C = { blue: "#1f8fb8", orange: "#e06a1b", pink: "#d61f69", green: "#2f9e55", violet: "#6a5ae0", yellow: "#d4a900", ink: "#3a3833", muted: "#8a867c", grid: "#ece9e1", axis: "#b9b5aa" };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const f4 = (v, p = 4) => math.format(v, { precision: p });

// a DPR-aware canvas that fills el and redraws on resize
function canvasIn(ctx, el, draw) {
  const cv = document.createElement("canvas");
  el.appendChild(cv);
  const g = cv.getContext("2d");
  const s = { cv, g, w: 0, h: 0 };
  s.draw = () => {
    const w = el.clientWidth, h = el.clientHeight;
    if (w < 20 || h < 20) return;
    const d = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== Math.round(w * d) || cv.height !== Math.round(h * d)) {
      cv.width = Math.round(w * d); cv.height = Math.round(h * d);
      cv.style.width = `${w}px`; cv.style.height = `${h}px`;
    }
    s.w = w; s.h = h;
    g.setTransform(d, 0, 0, d, 0, 0);
    g.clearRect(0, 0, w, h);
    draw(g, w, h);
  };
  const ro = new ResizeObserver(() => s.draw());
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
  return s;
}
function niceStep(r) { const p = 10 ** Math.floor(Math.log10(r)); const m = r / p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10) * p; }
// grid + axes for a world view; returns world->pixel mappers
function axes(g, w, h, vx, vy) {
  const X = (x) => ((x - vx[0]) / (vx[1] - vx[0])) * w, Y = (y) => h - ((y - vy[0]) / (vy[1] - vy[0])) * h;
  g.font = "11px ui-monospace, Consolas, monospace";
  g.lineWidth = 1;
  const sx = niceStep((vx[1] - vx[0]) / Math.max(2, w / 80)), sy = niceStep((vy[1] - vy[0]) / Math.max(2, h / 60));
  const x0 = Math.min(Math.max(X(0), 0), w - 1), y0 = Math.min(Math.max(Y(0), 0), h - 1);
  for (let x = Math.ceil(vx[0] / sx) * sx; x <= vx[1]; x += sx) {
    g.strokeStyle = C.grid; g.beginPath(); g.moveTo(X(x), 0); g.lineTo(X(x), h); g.stroke();
    if (Math.abs(x) > sx / 2) { g.fillStyle = C.muted; g.fillText(+x.toFixed(6), X(x) + 3, Math.min(h - 4, y0 + 13)); }
  }
  for (let y = Math.ceil(vy[0] / sy) * sy; y <= vy[1]; y += sy) {
    g.strokeStyle = C.grid; g.beginPath(); g.moveTo(0, Y(y)); g.lineTo(w, Y(y)); g.stroke();
    if (Math.abs(y) > sy / 2) { g.fillStyle = C.muted; g.fillText(+y.toFixed(6), Math.min(w - 30, x0 + 4), Y(y) - 3); }
  }
  g.strokeStyle = C.axis; g.beginPath(); g.moveTo(x0, 0); g.lineTo(x0, h); g.moveTo(0, y0); g.lineTo(w, y0); g.stroke();
  return { X, Y };
}
// sample f once per pixel; break the path on non-finite values and on huge jumps (poles)
function curve(g, w, h, m, vx, f, color, width = 2.5, dash = []) {
  g.strokeStyle = color; g.lineWidth = width; g.setLineDash(dash); g.beginPath();
  let pen = false, py = 0;
  for (let px = 0; px <= w; px++) {
    const x = vx[0] + (px / w) * (vx[1] - vx[0]);
    let y;
    try { y = f(x); } catch (e) { y = NaN; }
    const sy = typeof y === "number" ? m.Y(y) : NaN;
    if (!Number.isFinite(sy) || Math.abs(sy - py) > h * 3) { pen = false; py = sy; if (!Number.isFinite(sy)) continue; }
    if (pen) g.lineTo(px, sy); else g.moveTo(px, sy);
    pen = true; py = sy;
  }
  g.stroke(); g.setLineDash([]);
}

// ---------- scene 1: calculator on a sandboxed, extended instance ----------
const calc = math.create();
calc.createUnit({ ping: "3.305785 m^2", catty: "600 g", tael: "37.5 g" });
calc.import({
  // body-mass index that accepts units or plain kg / cm numbers
  bmi: (w, h) => (math.isUnit(w) ? w.toNumber("kg") : w) / (math.isUnit(h) ? h.toNumber("m") : h / 100) ** 2,
  clamp: (x, lo, hi) => Math.min(hi, Math.max(lo, x)),
});
const calcEval = calc.evaluate;
// sandbox pattern from the math.js security docs: disable functions that could change the instance
calc.import({
  import: () => { throw new Error("沙盒模式已停用 import()"); },
  createUnit: () => { throw new Error("沙盒模式已停用 createUnit()"); },
}, { override: true });

const CATS = {
  unit: ["單位換算", [["12.7 cm to inch", "公分換英吋"], ["60 km/h to m/s", "時速換秒速"], ["98.6 degF to degC", "華氏換攝氏"], ["5 inch + 3 cm", "不同單位直接相加"], ["2 kWh to MJ", "能量換算"]]],
  matrix: ["矩陣", [["A = [2, 1; 1, 3]", "定義矩陣 A"], ["inv(A)", "反矩陣"], ["det(A)", "行列式"], ["A * [1; 2]", "矩陣乘向量"], ["lusolve(A, [3; 5])", "解 2x + y = 3、x + 3y = 5"], ["eigs(A).values", "特徵值"]]],
  frac: ["分數", [["fraction(1, 3) + fraction(1, 6)", "通分相加"], ["fraction(0.125)", "小數化分數"], ['fraction("0.(3)")', "循環小數"], ["fraction(5, 8) / fraction(15, 4)", "相除自動約分"]]],
  sym: ["符號", [['derivative("x^3 + 2x^2 - sin(x)", "x")', "符號微分"], ['simplify("2x + 3x - x^2 * x / x")', "化簡"], ['rationalize("1/x + 1/(x + 1)")', "通分成單一分式"], ["f(x) = x^2 + 1", "自訂函式"], ["f(3) + f(-1)", "呼叫自訂函式"]]],
  cplx: ["複數", [["sqrt(-4)", "負數開根號"], ["(2 + 3i) * (1 - i)", "複數乘法"], ["e^(i * pi)", "歐拉恆等式"], ["abs(3 + 4i)", "複數的絕對值"]]],
  big: ["大數", [["0.1 + 0.2", "浮點數誤差"], ["bignumber(0.1) + bignumber(0.2)", "十進位大數精確"], ["bignumber(2)^200", "61 位數"], ["factorial(bignumber(30))", "30 階乘"]]],
  ext: ["擴充", [["30 ping to m^2", "自訂單位：坪"], ["1.5 catty to tael", "台斤換台兩"], ["bmi(68 kg, 172 cm)", "import 的自訂函式"], ["clamp(12, 0, 10)", "import 的自訂函式"], ["import({x: 1})", "沙盒擋下 import"]]],
};
const TYPES = {
  Unit: ["單位", "var(--c2)"], DenseMatrix: ["矩陣", "var(--c6)"], SparseMatrix: ["矩陣", "var(--c6)"], Fraction: ["分數", "var(--c4)"],
  Complex: ["複數", "var(--c5)"], BigNumber: ["大數", "var(--c3)"], number: ["數值", "#8a867c"], boolean: ["布林", "#8a867c"], string: ["字串", "#8a867c"], function: ["函式", "var(--c1)"],
};
const typeInfo = (v) => (v && v.isNode ? ["運算式", "var(--c3)"] : TYPES[math.typeOf(v)] || [math.typeOf(v), "#8a867c"]);
const ERR_ZH = [
  [/^Unexpected end of expression \(char (\d+)\)/, (m) => `運算式不完整，在第 ${m[1]} 個字元處結束`],
  [/^Parenthesis \) expected \(char (\d+)\)/, (m) => `第 ${m[1]} 個字元處缺少右括號`],
  [/^Value expected \(char (\d+)\)/, (m) => `第 ${m[1]} 個字元處缺少數值`],
  [/^Undefined symbol (.+)$/, (m) => `未定義的變數或單位：${m[1]}`],
  [/^Undefined function (.+)$/, (m) => `未定義的函式：${m[1]}`],
  [/^Units do not match/, () => "單位的物理量不同，無法換算"],
  [/^Dimension mismatch/, () => "矩陣維度不相符，無法運算"],
  [/^Cannot calculate inverse, determinant is zero/, () => "行列式為 0，此矩陣沒有反矩陣"],
  [/^(沙盒.*)$/, (m) => m[1]],
];
function zhError(msg) { for (const [re, fn] of ERR_ZH) { const m = msg.match(re); if (m) return fn(m); } return `無法計算（${msg}）`; }
const fmtScalar = (v, p = 14) => (math.typeOf(v) === "BigNumber" ? math.format(v, { notation: "fixed" }) : math.typeOf(v) === "number" ? math.format(v) : math.format(v, { precision: p }));
function renderValue(v) {
  const box = document.createElement("div");
  if (math.isMatrix(v) || Array.isArray(v)) {
    const m = math.matrix(v), size = m.size(), rows = size.length === 1 ? [m.toArray()] : m.toArray();
    if (size.length <= 2 && rows.length <= 8 && rows[0].length <= 8) {
      box.style.display = "flex";
      box.innerHTML = `<div class="mj-mat" style="grid-template-columns:repeat(${rows[0].length || 1},auto)">${rows.flat().map((x) => `<span>${esc(fmtScalar(x, 6))}</span>`).join("")}</div><span class="mj-dim">${size.join(" × ")}</span>`;
      return box;
    }

          g.beginPath(); g.moveTo(...P([k, -8])); g.lineTo(...P([k, 8])); g.moveTo(...P([-8, k])); g.lineTo(...P([8, k])); g.stroke();
          g.strokeStyle = k ? "rgba(106,90,224,.28)" : "rgba(106,90,224,.75)";
          g.beginPath(); g.moveTo(...P(T([k, -8]))); g.lineTo(...P(T([k, 8]))); g.moveTo(...P(T([-8, k]))); g.lineTo(...P(T([8, k]))); g.stroke();
        }
        const sq = [[0, 0], [1, 0], [1, 1], [0, 1]].map((p) => P(T(p)));
        g.fillStyle = math.det(M) < 0 ? "rgba(224,106,27,.22)" : "rgba(212,169,0,.25)";
        g.beginPath(); sq.forEach((p, i) => (i ? g.lineTo(...p) : g.moveTo(...p))); g.closePath(); g.fill();
        g.setLineDash([6, 5]); g.lineWidth = 1.5; g.strokeStyle = C.green;
        for (const e of st.t === 1 ? st.eig : []) {
          const [a, b] = e.map((v) => 9 * v);
          g.beginPath(); g.moveTo(...P([-a, -b])); g.lineTo(...P([a, b])); g.stroke();
        }
        g.setLineDash([]);
        const arrow = (v, col) => {
          const [x1, y1] = P(v), [x0, y0] = P([0, 0]), ang = Math.atan2(y1 - y0, x1 - x0);
          g.strokeStyle = g.fillStyle = col; g.lineWidth = 3;
          g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
          g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 12 * Math.cos(ang - 0.4), y1 - 12 * Math.sin(ang - 0.4)); g.lineTo(x1 - 12 * Math.cos(ang + 0.4), y1 - 12 * Math.sin(ang + 0.4)); g.fill();
          g.beginPath(); g.arc(x1, y1, 6, 0, 7); g.globalAlpha = 0.25; g.fill(); g.globalAlpha = 1;
        };
        arrow([M[0][0], M[1][0]], C.pink);
        arrow([M[0][1], M[1][1]], C.blue);
      });
      const info = () => {
        const A = st.A;
        const d = math.det(A);
        ctx.$('[data-k="A"]').innerHTML = mat(A);
        ctx.$('[data-k="inv"]').innerHTML = Math.abs(d) < 1e-9 ? `<span class="mj-err">det = 0，不可逆</span>` : mat(math.inv(A));
        ctx.$('[data-k="A2"]').innerHTML = mat(math.multiply(A, A));
        st.eig = [];
        let rows = "";
        try {
          const r = math.eigs(A);
          r.values.forEach((v, i) => { rows += `<dt>λ${i + 1}</dt><dd>${esc(f4(v, 4))}</dd>`; });
          for (const e of r.eigenvectors) if (!math.isComplex(e.value)) st.eig.push(e.vector.map(Number));
          if (math.isComplex(r.values[0])) rows += `<dt>說明</dt><dd style="white-space:normal;font-family:var(--font)">複數特徵值，無實數不變方向</dd>`;
        } catch (e) { rows = `<dt>eigs</dt><dd>${esc(e.message)}</dd>`; }
        ctx.$('[data-k="eig"]').innerHTML = rows;
        ctx.$(".mj-tag").innerHTML = `det(A) = <b>${f4(d, 4)}</b>・面積縮放 <b>${f4(Math.abs(d), 3)}×</b>${d < 0 ? "・方向翻轉" : ""}`;
        plot.draw();
      };
      const cv = plot.cv;
      const toWorld = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - view.cx) / view.s, -(e.clientY - r.top - view.cy) / view.s]; };
      ctx.on(cv, "pointerdown", (e) => {
        if (!view) return;
        const [x, y] = toWorld(e), A = st.A;
        const di = Math.hypot(x - A[0][0], y - A[1][0]), dj = Math.hypot(x - A[0][1], y - A[1][1]);
        st.drag = Math.min(di, dj) < 0.45 ? (di < dj ? 0 : 1) : -1;
        if (st.drag >= 0) { st.t = 1; cv.setPointerCapture(e.pointerId); }
      });
      ctx.on(cv, "pointermove", (e) => {
        if (st.drag < 0) return;
        const [x, y] = toWorld(e).map((v) => Math.round(Math.max(-3.4, Math.min(3.4, v)) * 10) / 10);
        st.A = st.A.map((row, i) => row.map((v, j) => (j === st.drag ? (i === 0 ? x : y) : v)));
        info();
      });
      ctx.on(cv, "pointerup", () => { st.drag = -1; });
      ctx.select("預設", PRESETS.map(([n], i) => ({ value: String(i), label: n })), "", (v) => { st.A = PRESETS[+v][1].map((r) => r.slice()); st.t = 1; info(); });
      let stop = null;
      ctx.button("播放", () => {
        if (stop) stop();
        const t0 = performance.now();
        stop = ctx.raf(() => {
          const k = Math.min(1, (performance.now() - t0) / 1400);
          st.t = k < 1 ? 0.5 - Math.cos(k * Math.PI) / 2 : 1;
          plot.draw();
          if (k >= 1) { stop(); stop = null; }
        });
      });
      info();
    },
  },
  {
    id: "precision", title: "精度對照", paper: true,
    api: "math.create() + config({ number: 'BigNumber' | 'Fraction' | 'bigint', precision })",
    desc: "同一批運算式交給四個 math.js 實例，各自用 config 設定不同的預設數字型別。綠色代表結果和精確值完全相同，橘色標出誤差大小。BigNumber 是十進位任意精度，位數由滑桿控制；Fraction 永遠精確但無法表示無理數；bigint 只處理整數，遇到小數會退回 number。",
    hint: "拖動 BigNumber 位數，看哪些列由橘轉綠",
    mount(ctx) {
      ctx.html(`<div class="mj-wrap" style="grid-template-columns:minmax(0,1fr)"><div class="mj-card mj-scroll"><table class="mj-tbl"><colgroup><col style="width:22%"><col><col><col><col></colgroup>
        <thead><tr><th>運算式</th><th>number（預設）</th><th data-k="bn">BigNumber</th><th>Fraction</th><th>bigint</th></tr></thead><tbody></tbody></table></div></div>`);
      const tb = ctx.$("tbody");
      const render = () => {
        ctx.$('[data-k="bn"]').textContent = `BigNumber（${NT.BigNumber.config().precision} 位）`;
        tb.innerHTML = PREC_ROWS.map(([expr, exact]) => {
          const tds = Object.entries(NT).map(([key, m]) => {
            try {
              const { v, t, text } = precCell(m, expr);
              let cls = "", note = t === key ? t : `${t}（退回）`;
              if (exact != null) {
                const diff = REF.abs(REF.subtract(REF.evaluate(t === "Fraction" ? text : String(v)), REF.bignumber(exact)));
                if (diff.lt("1e-150")) { cls = "ok"; note += "・精確"; } else { cls = "off"; note += `・誤差 ${REF.format(diff, { notation: "exponential", precision: 2 })}`; }
              }
              return `<td class="${cls}" title="${esc(text)}"><div>${esc(text)}</div><small>${esc(note)}</small></td>`;
            } catch (e) {
              return `<td class="na" title="${esc(e.message)}"><div>${/Fraction/.test(e.message) ? "無法以分數表示" : "無法計算"}</div><small>${esc(e.message.slice(0, 40))}</small></td>`;

      ctx.slider("BigNumber 位數", { min: 8, max: 100, step: 1, value: NT.BigNumber.config().precision, format: (v) => `${v}` }, (v) => { NT.BigNumber.config({ precision: v }); render(); });
      render();

  },
  {
    id: "symbolic", title: "符號微分", paper: true,
    api: "math.derivative(expr, 'x', { simplify })・math.simplify・math.rationalize",
    desc: "derivative 直接在運算式樹上套微分規則：未化簡的版本可以看到連鎖律留下的 1 與 (3 - 1)，simplify 後才整理乾淨。再對結果微分一次得到 f″。rationalize 把有理式通分成單一分式；遇到 sin、log 這類非有理式會回報不適用。右圖畫出 f、f′、f″。",
    hint: "選範例或自己輸入 f(x)",
    mount(ctx) {
      ctx.html(`<div class="mj-wrap left"><div class="mj-side"><div class="mj-fx"><label>f(x) =</label><input spellcheck="false" aria-label="函數"></div>
        <div class="mj-code wide"><small>derivative(…, { simplify: false })</small><span data-k="raw"></span></div>
        <div class="mj-code"><small>f′(x) = derivative(f, "x")</small><span data-k="d1" style="color:${C.orange}"></span></div>
        <div class="mj-code"><small>f″(x)</small><span data-k="d2" style="color:${C.green}"></span></div>
        <div class="mj-code wide"><small>rationalize(f)</small><span data-k="rat"></span></div>
        <div class="mj-code wide"><small>f′ 的 toTex()</small><span data-k="tex"></span></div></div>
        <div class="mj-card"><div class="mj-cv"></div><div class="mj-tag"></div></div></div>`);
      const st = { f: null, d1: null, d2: null, show2: true };
      const box = ctx.$(".mj-fx"), inp = ctx.$(".mj-fx input");
      const sc = { x: 0 };
      const ev = (c) => (x) => { sc.x = x; return c.evaluate(sc); };
      const plot = canvasIn(ctx, ctx.$(".mj-cv"), (g, w, h) => {
        const vx = [-5, 5];
        let lo = Infinity, hi = -Infinity;
        if (st.f) for (let i = 0; i <= 200; i++) { let y; try { y = ev(st.f)(vx[0] + i / 20); } catch (e) { y = NaN; } if (Number.isFinite(y) && Math.abs(y) < 50) { lo = Math.min(lo, y); hi = Math.max(hi, y); } }
        if (!(hi > lo)) { lo = -3; hi = 3; }
        const pad = Math.max(1, (hi - lo) * 0.35), vy = [Math.max(-30, lo - pad), Math.min(30, hi + pad)];
        const m = axes(g, w, h, vx, vy);
        if (!st.f) return;
        if (st.show2) curve(g, w, h, m, vx, ev(st.d2), C.green, 1.8, [6, 5]);
        curve(g, w, h, m, vx, ev(st.d1), C.orange, 2.2);
        curve(g, w, h, m, vx, ev(st.f), C.blue, 3);
      });
      const set = (expr) => {
        try {
          const node = math.parse(expr);
          const d1 = math.derivative(node, "x"), d2 = math.derivative(d1, "x");
          st.f = node.compile(); st.d1 = d1.compile(); st.d2 = d2.compile();
          box.classList.remove("bad");
          ctx.$('[data-k="raw"]').textContent = math.derivative(node, "x", { simplify: false }).toString();
          ctx.$('[data-k="d1"]').textContent = d1.toString();
          ctx.$('[data-k="d2"]').textContent = d2.toString();
          ctx.$('[data-k="tex"]').textContent = d1.toTex();
          let rat;
          try { rat = math.rationalize(node).toString(); } catch (e) { rat = "非有理式，rationalize 不適用"; }
          ctx.$('[data-k="rat"]').textContent = rat;
          ctx.$(".mj-tag").innerHTML = `<b style="color:${C.blue}">f</b>・<b style="color:${C.orange}">f′</b>${st.show2 ? `・<b style="color:${C.green}">f″</b>` : ""}・運算式樹節點 <b>${node.filter(() => true).length}</b> → <b>${d1.filter(() => true).length}</b>`;
          plot.draw();
        } catch (e) { box.classList.add("bad"); }
      };
      inp.value = SYM_PRESETS[1];
      ctx.on(inp, "input", () => set(inp.value));
      ctx.select("範例", SYM_PRESETS.map((v) => ({ value: v, label: v })), SYM_PRESETS[1], (v) => { inp.value = v; set(v); });
      ctx.toggle("f″", true, (v) => { st.show2 = v; set(inp.value); });
      set(inp.value);
    },
  },
  {
    id: "stats", title: "統計分析", paper: true,
    api: "config({ randomSeed })・math.random・mean・median・std・variance・mad・quantileSeq",
    desc: "用 config({ randomSeed }) 讓 math.random 可重現：同一個種子永遠抽出同一批樣本。直方圖上的紅線是 mean、藍線是 median、黃色帶是 ±1 std，下方箱形圖的四分位數來自 quantileSeq。偏斜的指數分布可以看到 mean 被長尾拉離 median。",
    hint: "換分布、調樣本數・按「重抽」換種子",
    mount(ctx) {
      ctx.html(`<div class="mj-wrap"><div class="mj-card"><div class="mj-cv"></div><div class="mj-tag"></div></div><div class="mj-side"><dl class="mj-rd"></dl></div></div>`);
      const rng = math.create();
      const st = { dist: 0, n: 800, seed: 1, data: [], s: null };
      const sample = () => {
        rng.config({ randomSeed: `atlas-${st.seed}` });
        const r = () => rng.random();
        st.data = Array.from({ length: st.n }, () => DISTS[st.dist].gen(r));
        const d = st.data, [q1, q2, q3] = math.quantileSeq(d, [0.25, 0.5, 0.75]);
        st.s = { mean: math.mean(d), median: math.median(d), std: math.std(d), stdU: math.std(d, "uncorrected"), variance: math.variance(d), mad: math.mad(d), min: math.min(d), max: math.max(d), q1, q2, q3 };
        const s = st.s, row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
        ctx.$(".mj-rd").innerHTML = row("樣本數", st.n) + row("種子", `atlas-${st.seed}`) + row("mean", f4(s.mean, 5)) + row("median", f4(s.median, 5)) + row("std（不偏）", f4(s.std, 5)) +
          row("std（母體）", f4(s.stdU, 5)) + row("variance", f4(s.variance, 5)) + row("mad", f4(s.mad, 5)) + row("Q1／Q3", `${f4(q1, 4)}／${f4(q3, 4)}`) + row("min／max", `${f4(s.min, 3)}／${f4(s.max, 3)}`);
        ctx.$(".mj-tag").innerHTML = `${DISTS[st.dist].name}分布・<b>${st.n}</b> 筆・mean − median = <b>${f4(s.mean - s.median, 3)}</b>`;
        plot.draw();
      };
      const plot = canvasIn(ctx, ctx.$(".mj-cv"), (g, w, h) => {
        const s = st.s;
        if (!s) return;
        const lo = Math.floor(Math.min(0, s.min)), hi = Math.ceil(Math.max(10, s.max)), bins = Math.min(48, Math.max(10, Math.round(Math.sqrt(st.n))));
        const cnt = new Array(bins).fill(0);
        for (const v of st.data) cnt[Math.min(bins - 1, Math.floor(((v - lo) / (hi - lo)) * bins))]++;
        const top = 40, bot = h - 70, L = 14, R = w - 14, X = (v) => L + ((v - lo) / (hi - lo)) * (R - L), mx = Math.max(...cnt);
        g.fillStyle = "rgba(212,169,0,.18)"; g.fillRect(X(s.mean - s.std), top, X(s.mean + s.std) - X(s.mean - s.std), bot - top);
        const bw = (R - L) / bins;
        g.fillStyle = "rgba(31,143,184,.55)";
        cnt.forEach((c, i) => { const bh = (c / mx) * (bot - top - 6); g.fillRect(L + i * bw + 1, bot - bh, bw - 2, bh); });
        g.strokeStyle = C.axis; g.lineWidth = 1; g.beginPath(); g.moveTo(L, bot); g.lineTo(R, bot); g.stroke();
        g.font = "11px ui-monospace, Consolas, monospace"; g.fillStyle = C.muted;
        const step = niceStep((hi - lo) / Math.max(2, w / 70));
        for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) g.fillText(+v.toFixed(4), X(v) - 4, bot + 14);
        const vline = (v, col) => { g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath(); g.moveTo(X(v), top - 4); g.lineTo(X(v), bot); g.stroke(); };
        vline(s.mean, C.pink); vline(s.median, C.blue);
        const by = bot + 34;
        g.strokeStyle = C.ink; g.lineWidth = 1.5; g.fillStyle = "rgba(106,90,224,.18)";
        g.beginPath(); g.moveTo(X(s.min), by); g.lineTo(X(s.q1), by); g.moveTo(X(s.q3), by); g.lineTo(X(s.max), by); g.stroke();
        g.fillRect(X(s.q1), by - 10, X(s.q3) - X(s.q1), 20); g.strokeRect(X(s.q1), by - 10, X(s.q3) - X(s.q1), 20);
        g.strokeStyle = C.blue; g.lineWidth = 2.5; g.beginPath(); g.moveTo(X(s.q2), by - 10); g.lineTo(X(s.q2), by + 10); g.stroke();
      });
      ctx.select("分布", DISTS.map((d, i) => ({ value: String(i), label: d.name })), "0", (v) => { st.dist = +v; sample(); });
      ctx.slider("樣本數", { min: 20, max: 5000, step: 20, value: st.n }, (v) => { st.n = v; sample(); });
      ctx.button("重抽", () => { st.seed++; sample(); });
      sample();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "math.multiply / inv / det / eigs on n × n arrays",
    desc: "逐級加大方陣維度，量一次 math.multiply、inv、det 或 eigs 要花多久。乘法與反矩陣是 O(n³)，維度加倍耗時約變八倍；eigs 對稱矩陣用迭代法，成本更高。右圖是最後一級結果的熱圖（紅正藍負），反矩陣另外檢查 A·A⁻¹ 與單位矩陣的最大誤差。",
    hint: "選一種運算，按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="mj-stress"><div class="mj-card" style="position:absolute;inset:0"><div class="mj-cv"></div><div class="mj-tag"></div></div></div>`);
      const st = { op: 0, M: null, label: "" };
      const tag = ctx.$(".mj-tag");
      const rnd = math.create();
      const plot = canvasIn(ctx, ctx.$(".mj-cv"), (g, w, h) => { if (st.M) heat(g, w, h, st.M.length > 160 ? st.M.slice(0, 160).map((r) => r.slice(0, 160)) : st.M); });
      const show = (M, label) => { st.M = M; tag.innerHTML = label; plot.draw(); };
      const prep = (n) => {
        rnd.config({ randomSeed: `bench-${n}` });
        const A = rnd.random([n, n], -1, 1);
        // symmetric and diagonally dominant: well conditioned for inv and real eigenvalues for eigs
        return math.add(math.divide(math.add(A, math.transpose(A)), 2), math.multiply(math.identity(n, "dense").toArray(), n / 4));
      };
      ctx.controls.classList.add("bottom");
      ctx.group(BENCH_OPS.map((o) => o.name), 0, (i) => { st.op = i; tag.textContent = `已切換到 ${BENCH_OPS[i].name}，按「開始測試」`; });
      ctx.bench({
        label: "矩陣維度", unit: "階", sizes: [10, 25, 50, 100, 150, 200, 300, 400, 600],
        target: 1000, budget: 2000,
        format: (n) => `${n}×${n}`,
        prepare: (n) => prep(n),
        run(n, A) {
          const op = BENCH_OPS[st.op];
          const t0 = performance.now();
          const r = op.run(A, A);
          const ms = performance.now() - t0;
          ctx.timeout(() => {
            if (op.name === "inv") {
              const E = math.subtract(math.multiply(A, r), math.identity(n, "dense").toArray());
              show(r, `inv・<b>${n}×${n}</b>・${Showcase.fmtMs(ms)}・max|A·A⁻¹ − I| = <b>${f4(math.max(math.abs(E)), 2)}</b>`);
            } else if (Array.isArray(r) && Array.isArray(r[0])) show(r, `${op.name}・<b>${n}×${n}</b>・${Showcase.fmtMs(ms)}`);
            else show(A, `${op.name}(A)・<b>${n}×${n}</b>・${Showcase.fmtMs(ms)}・熱圖為輸入矩陣 A`);
          }, 0);
          return op.flop ? `${Showcase.fmtCompact(op.flop(n) / (ms / 1000) / 1e6)} MFLOPS` : `${n} 個特徵值`;
        },
        note: "math.js 用純 JavaScript 巢狀陣列運算，沒有 SIMD 或 WebAssembly，效能取決於 JIT 與快取命中。輸入是對稱、對角優勢的隨機矩陣，確保 inv 穩定且 eigs 為實數。單輪超過 2 秒就停止加碼；熱圖只畫左上 160 × 160。",
      });
      show(prep(40), "預覽：40×40 測試矩陣（對稱、對角優勢）");
    },
  },
] });
