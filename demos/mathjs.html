<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>math.js 示範：單位、矩陣、分數與符號微分計算機</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app {
    position: fixed; inset: 0; display: grid;
    grid-template-columns: minmax(0, 1fr) 250px;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top top" "log vars" "inp vars";
  }
  .top { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--bg-2); border-bottom: 1px solid var(--line); min-width: 0; }
  .top b { font-size: 15px; white-space: nowrap; }
  .seg { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  .seg::-webkit-scrollbar { display: none; }
  .seg .btn { flex: none; padding: 7px 11px; font-size: 12.5px; white-space: nowrap; }
  .seg .btn[aria-pressed="true"] { background: var(--fg); color: var(--bg-2); border-color: var(--fg); box-shadow: none; }

  .log { grid-area: log; overflow-y: auto; padding: 14px 18px 8px; scrollbar-width: thin; min-height: 0; }
  .ent { padding: 9px 0 11px; border-bottom: 1px dashed var(--line); animation: pop .25s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(4px); } }
  .ent .q { display: flex; align-items: baseline; gap: 8px; font: 13.5px/1.5 var(--mono); color: var(--muted); cursor: pointer; }
  .ent .q::before { content: "›"; color: var(--c2); font-weight: 700; }
  .ent .q:hover { color: var(--fg); }
  .ent .note { margin-left: auto; font: 11.5px var(--font); color: var(--muted); white-space: nowrap; }
  .ent .a { display: flex; align-items: flex-start; gap: 10px; margin-top: 4px; padding-left: 16px; }
  .ent .a > div { min-width: 0; }
  .val { font: 600 17px/1.45 var(--mono); color: var(--fg); word-break: break-all; min-width: 0; }
  .tex { margin-top: 3px; font: 11.5px var(--mono); color: var(--muted); word-break: break-all; }
  .err .val { color: var(--c3); font: 13px/1.5 var(--mono); }
  .tag { flex: none; margin-top: 3px; padding: 2px 7px; border-radius: 999px; font: 600 10.5px var(--font); letter-spacing: .04em; color: #fff; background: var(--k, var(--muted)); }
  .mat { display: inline-grid; gap: 2px 16px; padding: 4px 12px; border-left: 2px solid var(--fg); border-right: 2px solid var(--fg); border-radius: 6px; font: 600 15px var(--mono); }
  .mat span { text-align: right; }
  .dim { margin-left: 8px; font: 11.5px var(--font); color: var(--muted); align-self: center; }

  .inp { grid-area: inp; padding: 8px 14px 46px; border-top: 1px solid var(--line); background: var(--bg-2); min-width: 0; }
  .ex { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 8px; }
  .ex::-webkit-scrollbar { display: none; }
  .ex button { flex: none; appearance: none; border: 1px solid var(--line); background: #fbfaf7; border-radius: 8px; padding: 4px 9px; cursor: pointer; text-align: left; }
  .ex button code { display: block; font: 12px var(--mono); color: var(--fg); white-space: nowrap; }
  .ex button small { display: block; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .ex button:hover { border-color: var(--c2); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font: 14px var(--mono); color: var(--fg); outline: none; }
  .row input:focus { border-color: var(--c2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c2) 18%, transparent); }
  .row .btn { flex: none; }

  .vars { grid-area: vars; min-height: 0; overflow-y: auto; padding: 14px 16px 52px; border-left: 1px solid var(--line); background: var(--bg-2); scrollbar-width: thin; }
  .vars h2 { margin: 0 0 8px; font-size: 13.5px; display: flex; align-items: center; justify-content: space-between; }
  .vars h2 button { appearance: none; border: 0; background: none; color: var(--c2); font: 12px var(--font); cursor: pointer; padding: 0; }
  .vl { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 6px; }
  .vl li { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 6px 8px; border-radius: 8px; background: #fbfaf7; border: 1px solid var(--line); }
  .vl b { font: 600 13px var(--mono); }
  .vl em { justify-self: end; font: normal 10.5px var(--font); color: var(--k, var(--muted)); }
  .vl code { grid-column: 1 / -1; font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vl .empty { display: block; background: none; border: 0; padding: 0; font-size: 12px; color: var(--muted); }
  .vars p { margin: 0 0 6px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  .vars kbd { font: 11px var(--mono); padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
  @media (max-width: 700px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "log" "inp"; }
    .vars { display: none; }
    .top { padding: 8px 10px; }
    .top b { display: none; }
    .seg .btn { padding: 6px 9px; font-size: 12px; }
    .log { padding: 8px 12px 4px; }
    .ent { padding: 7px 0 9px; }
    .ent .q { font-size: 12.5px; }
    .ent .note { display: none; }
    .val { font-size: 15px; }
    .mat { font-size: 13.5px; gap: 2px 12px; }
    .inp { padding: 6px 10px 42px; }
    .row .btn { padding: 8px 12px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="top">
    <b>math.js 計算機</b>
    <div class="seg" id="seg"></div>
  </div>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="inp">
    <div class="ex" id="ex"></div>
    <form class="row" id="form" autocomplete="off">
      <input id="q" spellcheck="false" placeholder="輸入運算式，例如 3 ft to cm 或 det([1, 2; 3, 4])" aria-label="運算式">
      <button class="btn primary" type="submit">計算</button>
    </form>
  </div>
  <aside class="vars">
    <h2>變數與函式 <button id="clear" type="button">清除</button></h2>
    <ul class="vl" id="vl"></ul>
    <h2>操作提示</h2>
    <p>用 <kbd>=</kbd> 指定變數，例如 <code>r = 2 m</code>，之後的運算都能沿用。</p>
    <p>用 <kbd>f(x) = …</kbd> 定義自己的函式。</p>
    <p><kbd>↑</kbd> <kbd>↓</kbd> 叫回輸入紀錄；點紀錄中的運算式可再次編輯。</p>
    <p id="ver"></p>
  </aside>
</div>
<div class="hint">按 Enter 計算・點上方分類換範例</div>

<script src="https://cdn.jsdelivr.net/npm/mathjs@15.2.0/lib/browser/math.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const logEl = $("log"), exEl = $("ex"), q = $("q");
const scope = new Map();
// a Taiwanese area unit, so "30 ping to m^2" also works before the createUnit example is run
math.createUnit("ping", "3.305785 m^2");
$("ver").textContent = `math.js 版本 ${math.version}`;

const CATS = {
  unit: { label: "單位換算", items: [
    ["12.7 cm to inch", "公分換英吋"],
    ["60 km/h to m/s", "時速換秒速"],
    ["98.6 degF to degC", "華氏換攝氏"],
    ["5 inch + 3 cm", "不同單位直接相加"],
    ['createUnit("ping", "3.305785 m^2", {override: true})', "自訂單位：台灣的坪"],
    ["30 ping to m^2", "30 坪是幾平方公尺"],
    ["2 kWh to MJ", "能量換算"],
  ] },
  matrix: { label: "矩陣", items: [
    ["A = [2, 1; 1, 3]", "定義矩陣 A"],
    ["inv(A)", "反矩陣"],
    ["det(A)", "行列式"],
    ["A * [1; 2]", "矩陣乘向量"],
    ["lusolve(A, [3; 5])", "解 2x + y = 3、x + 3y = 5"],
    ["eigs(A).values", "特徵值"],
    ["identity(3) * 2", "單位矩陣"],
  ] },
  frac: { label: "分數", items: [
    ["fraction(1, 3) + fraction(1, 6)", "通分相加"],
    ["fraction(0.125)", "小數化分數"],
    ['fraction("0.(3)")', "循環小數 0.333…"],
    ["fraction(7, 12) * 3", "分數乘整數"],
    ["fraction(5, 8) / fraction(15, 4)", "分數相除自動約分"],
  ] },
  sym: { label: "符號運算", items: [
    ['derivative("x^3 + 2x^2 - sin(x)", "x")', "符號微分"],
    ['derivative("e^(2x) * cos(x)", "x")', "乘積與連鎖律"],
    ['simplify("2x + 3x - x^2 * x / x")', "化簡"],
    ['rationalize("1/x + 1/(x + 1)")', "通分成單一分式"],
    ["f(x) = x^2 + 1", "自訂函式"],
    ["f(3) + f(-1)", "呼叫自訂函式"],
  ] },
  cplx: { label: "複數", items: [
    ["sqrt(-4)", "負數開根號"],
    ["(2 + 3i) * (1 - i)", "複數乘法"],
    ["e^(i * pi)", "歐拉恆等式"],
    ["abs(3 + 4i)", "複數的絕對值"],
    ["roots = [sqrt(-1), -sqrt(-1)]", "x² + 1 = 0 的兩根"],
  ] },
  big: { label: "大數精度", items: [
    ["0.1 + 0.2", "一般浮點數有誤差"],
    ["bignumber(0.1) + bignumber(0.2)", "十進位大數精確"],
    ["bignumber(2)^200", "2 的 200 次方，61 位數"],
    ["factorial(bignumber(30))", "30 階乘"],
  ] },
};

const TYPES = {
  Unit: ["單位", "var(--c2)"], DenseMatrix: ["矩陣", "var(--c6)"], SparseMatrix: ["矩陣", "var(--c6)"],
  Fraction: ["分數", "var(--c4)"], Complex: ["複數", "var(--c5)"], BigNumber: ["大數", "var(--c3)"],
  number: ["數值", "#8a867c"], boolean: ["布林", "#8a867c"], string: ["字串", "#8a867c"], function: ["函式", "var(--c1)"],
};
function typeInfo(v) {
  const t = math.typeOf(v);
  if (v && v.isNode) return ["運算式", "var(--c3)", t];
  return [...(TYPES[t] || [t, "#8a867c"]), t];
}

// ---------- formatting real math.js values ----------
function fmtScalar(v, precision = 14) {
  const t = math.typeOf(v);
  if (t === "BigNumber") return math.format(v, { notation: "fixed" });
  if (t === "number") return math.format(v); // full JS precision, so 0.1 + 0.2 shows its float error
  return math.format(v, { precision });
}
function renderValue(v) {
  const box = document.createElement("div");
  if (math.isMatrix(v) || Array.isArray(v)) {
    const m = math.matrix(v);
    const size = m.size();
    const rows = size.length === 1 ? [m.toArray()] : m.toArray();
    if (size.length <= 2 && rows.length <= 8 && rows[0].length <= 8) {
      const g = document.createElement("div");
      g.className = "mat";
      g.style.gridTemplateColumns = `repeat(${rows[0].length || 1}, auto)`;
      rows.flat().forEach((x) => { const s = document.createElement("span"); s.textContent = fmtScalar(x, 6); g.appendChild(s); });
      const wrap = document.createElement("div");
      wrap.style.display = "flex";
      wrap.appendChild(g);
      const d = document.createElement("span");
      d.className = "dim";
      d.textContent = size.join(" × ");
      wrap.appendChild(d);
      box.appendChild(wrap);
      return box;
    }
  }
  const val = document.createElement("div");
  val.className = "val";
  if (typeof v === "function") val.textContent = `${v.syntax || "函式"} 已定義`;
  else if (v && v.isNode) {
    val.textContent = v.toString();
    const tex = document.createElement("div");
    tex.className = "tex";
    tex.textContent = `LaTeX：${v.toTex()}`;
    box.append(val, tex);
    return box;
  } else val.textContent = fmtScalar(v);
  box.appendChild(val);
  return box;
}

// translate the most common math.js error messages; unknown ones keep the original text in brackets
const ERR_ZH = [
  [/^Unexpected end of expression \(char (\d+)\)/, (m) => `運算式不完整，在第 ${m[1]} 個字元處結束`],
  [/^Parenthesis \) expected \(char (\d+)\)/, (m) => `第 ${m[1]} 個字元處缺少右括號`],
  [/^Value expected \(char (\d+)\)/, (m) => `第 ${m[1]} 個字元處缺少數值`],
  [/^Syntax error in part "(.*)" \(char (\d+)\)/, (m) => `語法錯誤：第 ${m[2]} 個字元的「${m[1]}」`],
  [/^Undefined symbol (.+)$/, (m) => `未定義的變數或單位：${m[1]}`],
  [/^Undefined function (.+)$/, (m) => `未定義的函式：${m[1]}`],
  [/^Units do not match/, () => "單位的物理量不同，無法換算"],
  [/^Dimension mismatch/, () => "矩陣維度不相符，無法運算"],
  [/^Cannot calculate inverse, determinant is zero/, () => "行列式為 0，此矩陣沒有反矩陣"],
];
function zhError(msg) {
  for (const [re, fn] of ERR_ZH) { const m = msg.match(re); if (m) return fn(m); }
  return `無法計算（${msg}）`;
}

function addEntry(expr, note) {
  const ent = document.createElement("div");
  ent.className = "ent";
  const qd = document.createElement("div");
  qd.className = "q";
  qd.title = "點一下放回輸入框";
  const code = document.createElement("span");
  code.textContent = expr;
  qd.appendChild(code);
  if (note) { const n = document.createElement("span"); n.className = "note"; n.textContent = note; qd.appendChild(n); }
  qd.addEventListener("click", () => { q.value = expr; q.focus(); });
  ent.appendChild(qd);
  let results;
  try {
    const r = math.evaluate(expr, scope);
    // multi-statement input ("a = 1; b = 2") returns a ResultSet
    results = r && r.isResultSet ? r.entries : r === undefined ? [] : [r];
  } catch (err) {
    ent.classList.add("err");
    results = null;
    const a = document.createElement("div");
    a.className = "a";
    a.innerHTML = `<span class="tag" style="--k: var(--c3)">錯誤</span>`;
    const v = document.createElement("div");
    v.className = "val";
    v.textContent = zhError(err.message);
    a.appendChild(v);
    ent.appendChild(a);
  }
  if (results) {
    if (!results.length) results = [undefined];
    for (const r of results) {
      const a = document.createElement("div");
      a.className = "a";
      if (r === undefined) {
        a.innerHTML = `<span class="tag">完成</span><div class="val" style="font-weight:400;font-size:13px;color:var(--muted)">已執行，無輸出</div>`;
      } else {
        const [label, color, raw] = typeInfo(r);
        const tag = document.createElement("span");
        tag.className = "tag";
        tag.style.setProperty("--k", color);
        tag.textContent = label;
        tag.title = raw;
        a.append(tag, renderValue(r));
      }
      ent.appendChild(a);
    }
  }
  logEl.appendChild(ent);
  while (logEl.children.length > 60) logEl.firstChild.remove();
  stick();
  renderVars();
}

function renderVars() {
  const vl = $("vl");
  vl.innerHTML = "";
  if (!scope.size) { vl.innerHTML = `<li class="empty">尚無變數，試試 <code>A = [2, 1; 1, 3]</code></li>`; return; }
  for (const [k, v] of scope) {
    const li = document.createElement("li");
    const [label, color] = typeInfo(v);
    li.style.setProperty("--k", color);
    const b = document.createElement("b"); b.textContent = k;
    const em = document.createElement("em"); em.textContent = label;
    const c = document.createElement("code");
    c.textContent = typeof v === "function" ? v.syntax : math.isMatrix(v) ? math.format(v, { precision: 4 }) : fmtScalar(v, 8);
    li.append(b, em, c);
    vl.appendChild(li);
  }
}

// ---------- categories & examples ----------
function showCat(key) {
  document.querySelectorAll("#seg .btn").forEach((b) => b.setAttribute("aria-pressed", b.dataset.k === key));
  exEl.innerHTML = "";
  for (const [e, note] of CATS[key].items) {
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = "<code></code><small></small>";
    b.firstChild.textContent = e;
    b.lastChild.textContent = note;
    b.addEventListener("click", () => run(e, note));
    exEl.appendChild(b);
  }
  exEl.scrollLeft = 0;
}
for (const [k, c] of Object.entries(CATS)) {
  const b = document.createElement("button");
  b.className = "btn";
  b.dataset.k = k;
  b.textContent = c.label;
  b.addEventListener("click", () => showCat(k));
  $("seg").appendChild(b);
}

// keep the newest result in view, also when the example row or fonts change the log height
let atBottom = true;
const stick = () => { logEl.scrollTop = logEl.scrollHeight; atBottom = true; };
logEl.addEventListener("scroll", () => { atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 8; });
new ResizeObserver(() => { if (atBottom) logEl.scrollTop = logEl.scrollHeight; }).observe(logEl);

// ---------- input & history ----------
const hist = [];
let hi = 0;
function run(expr, note) {
  expr = expr.trim();
  if (!expr) return;
  hist.push(expr);
  hi = hist.length;
  addEntry(expr, note);
}
$("form").addEventListener("submit", (e) => { e.preventDefault(); run(q.value); q.value = ""; });
q.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp" && hi > 0) { hi--; q.value = hist[hi]; e.preventDefault(); }
  else if (e.key === "ArrowDown") { hi = Math.min(hist.length, hi + 1); q.value = hist[hi] || ""; e.preventDefault(); }
});
$("clear").addEventListener("click", () => { scope.clear(); renderVars(); });

// pre-fill the log with one real calculation from each category
[
  ["60 km/h to m/s", "時速換秒速"],
  ["A = [2, 1; 1, 3]", "定義矩陣 A"],
  ["inv(A)", "反矩陣"],
  ["fraction(1, 3) + fraction(1, 6)", "通分相加"],
  ['derivative("x^3 + 2x^2 - sin(x)", "x")', "符號微分"],
  ["(2 + 3i) * (1 - i)", "複數乘法"],
  ["bignumber(2)^200", "2 的 200 次方"],
].forEach(([e, n]) => run(e, n));
showCat("unit");
stick();
</script>
</body>
</html>
