<style>

  .sc-scene.night { background: linear-gradient(#141826 0%, #0e1013 75%); }

<body>
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>

<script>
// Matter.js showcase: eight scenes from the original falling-sign demo to a body-count stress ramp.
const { Engine, Render, Runner, Bodies, Body, Composite, Composites, Constraint, Mouse, MouseConstraint, Events, Sleeping, Vector } = Matter;
const COLORS = ["#f72585", "#ffb703", "#4cc9f0", "#7bd389", "#9d8cff", "#ff7b54"];
const MUTED = "#9b998f";
const STEEL = "#4a5262";
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
const MONO = rootCss.getPropertyValue("--mono").trim() || "ui-monospace, monospace";
const font = (weight, px, mono) => `${weight} ${px}px ${mono ? MONO : FONT}`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
// Body render style shorthand: { ...look("#f72585") }
const look = (fillStyle, extra) => ({ render: { fillStyle, strokeStyle: "rgba(0,0,0,.35)", lineWidth: 1, ...extra } });
// Y just below the top-right control cluster, so scene content starts under the buttons.
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;

// Small rounded caption drawn on the canvas (CSS pixels). fit = canvas width to keep it on screen.
function tag(g, text, x, y, { color = "#e8e6df", size = 11, align = "center", mono = true, fit = 0 } = {}) {
  g.font = font(600, size, mono);
  const w = g.measureText(text).width + 10, hh = size + 8;
  let left = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  if (fit) left = clamp(left, 4, fit - w - 4);
  g.fillStyle = "rgba(14,16,19,.78)";
  g.beginPath();
  g.roundRect(left, y - hh / 2, w, hh, 5);
  g.fill();
  g.fillStyle = color;
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.fillText(text, left + 5, y + 0.5);
}
function dashed(g, x1, y1, x2, y2, color = "rgba(255,255,255,.25)") {
  g.save();
  g.setLineDash([5, 5]);
  g.strokeStyle = color;
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.restore();
}
// Fading motion trail for bodies created with plugin: { trail: [] }
function trails(g, bodies) {
  for (const b of bodies) {
    const t = b.plugin && b.plugin.trail;
    if (!t) continue;
    t.push(b.position.x, b.position.y);
    if (t.length > 160) t.splice(0, 2);
    g.strokeStyle = b.render.fillStyle;
    g.globalAlpha = 0.35;
    g.lineWidth = 2;
    g.beginPath();
    for (let i = 0; i < t.length; i += 2) (i ? g.lineTo(t[i], t[i + 1]) : g.moveTo(t[i], t[i + 1]));
    g.stroke();
    g.globalAlpha = 1;
  }
}

// One Matter.js world bound to a scene: engine, Render canvas, mouse dragging and screen-edge walls.
// Everything is torn down through ctx.onCleanup when the scene unmounts.
function physics(ctx, { gravity = 1, floor = 0, ceiling = false, options = {}, run = true } = {}) {
  const engine = Engine.create({ gravity: { x: 0, y: gravity } });
  const world = engine.world;
  const pr = Math.min(window.devicePixelRatio || 1, 2);
  let { width: W, height: H } = ctx.size();
  const gap = () => (typeof floor === "function" ? floor(W, H) : floor);
  const render = Render.create({
    element: ctx.el, engine,
    options: { width: W, height: H, pixelRatio: pr, wireframes: false, background: "transparent", wireframeBackground: "transparent", ...options },
  });
  const canvas = render.canvas;
  canvas.classList.add("world");

  // Mouse.create rounds the pixel ratio down (wrong on 1.25x / 1.5x screens) and blocks page scrolling on wheel.
  const mouse = Mouse.create(canvas);
  mouse.pixelRatio = pr;
  canvas.removeEventListener("wheel", mouse.mousewheel);
  const grab = MouseConstraint.create(engine, { mouse, constraint: { stiffness: 0.2, damping: 0.1, render: { visible: false } } });
  render.mouse = mouse;
  ctx.on(window, "mouseup", () => { mouse.button = -1; }); // release drags that end outside the canvas
  Events.on(grab, "startdrag", () => { canvas.style.cursor = "grabbing"; });
  Events.on(grab, "enddrag", () => { canvas.style.cursor = ""; });

  const T = 400, solid = { isStatic: true, label: "wall", render: { visible: false } };
  const walls = {
    floor: Bodies.rectangle(W / 2, H - gap() + T / 2, 20000, T, solid),
    left: Bodies.rectangle(-T / 2, 0, T, 20000, solid),
    right: Bodies.rectangle(W + T / 2, 0, T, 20000, solid),
  };
  if (ceiling) walls.top = Bodies.rectangle(W / 2, -T / 2, 20000, T, solid);
  const keep = () => [...Object.values(walls), grab];
  Composite.add(world, keep());

  let runner = null;
  if (run) {
    runner = Runner.create();
    Render.run(render);
    Runner.run(runner, engine);
  }

  const resizers = [];
  ctx.onResize(({ width, height }) => {
    W = width; H = height;
    Render.setSize(render, W, H);
    Body.setPosition(walls.floor, { x: W / 2, y: H - gap() + T / 2 });
    Body.setPosition(walls.right, { x: W + T / 2, y: 0 });
    if (walls.top) Body.setPosition(walls.top, { x: W / 2, y: -T / 2 });
    resizers.forEach((fn) => fn(W, H));
  });
  ctx.onCleanup(() => {
    Render.stop(render);
    if (runner) Runner.stop(runner);
    Events.off(render); Events.off(engine); Events.off(grab);
    Composite.clear(world, false, true);
    Engine.clear(engine);
    canvas.remove();
  });

  const p = {
    engine, world, render, mouse, grab, walls,
    get W() { return W; },
    get H() { return H; },
    get floorY() { return H - gap(); },
    add: (...items) => Composite.add(world, items.flat()),
    remove: (item) => Composite.remove(world, item),
    bodies: () => Composite.allBodies(world).filter((b) => !b.isStatic),
    onResize: (fn) => resizers.push(fn),
    // Draw on top of Matter's own rendering, in CSS pixels.
    draw: (fn) => Events.on(render, "afterRender", () => fn(render.context)),
    // Empty the world (walls and dragging stay), then run build(W, H); repeated after every resize.
    build(fn) {
      const go = () => {
        Composite.clear(world, false, true);
        Engine.clear(engine);
        grab.body = null;
        grab.constraint.bodyB = null;
        Composite.add(world, keep());
        fn(W, H);
      };
      go();
      resizers.push(go);
      return go;
    },
    // Click or tap that did not grab a body and barely moved.
    onTap(fn) {
      let at = null;
      Events.on(grab, "mousedown", () => { at = { x: mouse.position.x, y: mouse.position.y, body: grab.body }; });
      Events.on(grab, "mouseup", () => {
        if (at && !at.body && Math.hypot(mouse.position.x - at.x, mouse.position.y - at.y) < 6) fn(mouse.position.x, mouse.position.y);
        at = null;
      });
    },
  };
  return p;
}

// Car built from the official car example (Composites.car is deprecated in 0.20).
function makeCar(x, y, width, height, wheelSize) {
  const group = Body.nextGroup(true);
  const base = width * 0.14, ax = -width * 0.5 + base, bx = width * 0.5 - base;
  const body = Bodies.rectangle(x, y, width, height, { collisionFilter: { group }, chamfer: { radius: height * 0.5 }, density: 0.0002, ...look(COLORS[1]) });
  const wheel = (dx) => Bodies.circle(x + dx, y, wheelSize, { collisionFilter: { group }, friction: 0.8, ...look("#23262e", { strokeStyle: "#9aa3b5", lineWidth: 2 }) });
  const wheelA = wheel(ax), wheelB = wheel(bx);
  const axle = (w, dx) => Constraint.create({ bodyB: body, pointB: { x: dx, y: 0 }, bodyA: w, stiffness: 1, length: 0, render: { visible: false } });
  const composite = Composite.create({ label: "Car" });
  Composite.add(composite, [body, wheelA, wheelB, axle(wheelA, ax), axle(wheelB, bx)]);
  return { composite, body, wheels: [wheelA, wheelB] };
}

Showcase.run({ scenes: [
  {
    id: "sign", title: "招牌字",
    api: "Bodies.rectangle(x, y, w, h, { chamfer }) + MouseConstraint",
    desc: "每個字都是倒圓角的剛體，Matter.js 負責碰撞、堆疊與拖曳（MouseConstraint），字與珍珠在 afterRender 事件裡自己畫。",
    hint: "拖曳文字方塊丟出去・點空白處加一顆珍珠",
    mount(ctx) {
      ctx.el.classList.add("night");
      const WORD = ["歡", "迎", "光", "臨"];
      const hidden = { visible: false };
      const p = physics(ctx, { gravity: 1.1, floor: (W, H) => Math.min(48, H * 0.1) });
      const blockSize = () => Math.round(clamp(Math.min(p.W / 5.4, p.H / 4.6), 44, 140));

      function dropWord() {
        p.bodies().filter((b) => b.label === "char" || b.label === "pearl").forEach((b) => p.remove(b));
        const s = blockSize();
        WORD.forEach((ch, i) => {
          const b = Bodies.rectangle(p.W / 2 + (i - 1.5) * s * 1.15, -s * (1 + i * 0.9), s, s, {
            chamfer: { radius: s * 0.16 }, restitution: 0.35, friction: 0.5, density: 0.002, label: "char",
            render: hidden, plugin: { ch, color: COLORS[i % COLORS.length], size: s },
          });
          Body.setAngle(b, rnd(-0.3, 0.3));
          p.add(b);
        });
      }
      function addPearl(x, y) {
        const r = Math.max(9, blockSize() * 0.11);
        p.add(Bodies.circle(x, y, r, { restitution: 0.55, friction: 0.05, density: 0.004, label: "pearl", render: hidden, plugin: { r } }));
      }
      p.onTap(addPearl);

      let count = 0;
      p.draw((g) => {
        const fy = p.floorY;
        // Shop counter the blocks land on.
        g.fillStyle = "#2a1d14";
        g.fillRect(0, fy, p.W, p.H - fy);
        g.fillStyle = "#5c3d26";
        g.fillRect(0, fy, p.W, 5);
        count = 0;
        for (const b of Composite.allBodies(p.world)) {
          if (b.label === "char") {
            count++;
            const { ch, color, size } = b.plugin;
            g.save();
            g.shadowColor = "rgba(0,0,0,.45)";
            g.shadowBlur = 16;
            g.shadowOffsetY = 6;
            g.beginPath();
            b.vertices.forEach((v, i) => (i ? g.lineTo(v.x, v.y) : g.moveTo(v.x, v.y)));
            g.closePath();
            g.fillStyle = color;
            g.fill();
            g.restore();
            g.save();
            g.translate(b.position.x, b.position.y);
            g.rotate(b.angle);
            g.fillStyle = "#0e1013";
            g.font = font(800, Math.round(size * 0.62));
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.fillText(ch, 0, size * 0.04);
            g.restore();
          } else if (b.label === "pearl") {
            count++;
            const r = b.plugin.r, { x, y } = b.position;
            const grad = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
            grad.addColorStop(0, "#8a5a3b");
            grad.addColorStop(1, "#2b160c");
            g.fillStyle = grad;
            g.beginPath();
            g.arc(x, y, r, 0, Math.PI * 2);
            g.fill();
          }
        }
      });

      ctx.button("重新掉落", dropWord, { primary: true });
      ctx.button("珍珠雨", () => {
        for (let i = 0; i < 40; i++) ctx.timeout(() => addPearl(p.W * rnd(0.15, 0.85), -20 - Math.random() * 60), i * 35);
      });
      ctx.button("地震", () => {
        for (const b of p.bodies()) {
          Body.setVelocity(b, { x: rnd(-9, 9), y: rnd(-22, -8) });
          Body.setAngularVelocity(b, rnd(-0.2, 0.2));
        }
      });
      ctx.fps({ position: "right bottom", extra: () => ({ 剛體: count }) });
      dropWord();
      // Idle preview: a few pearls drizzle in until there are plenty.
      ctx.interval(() => {
        const pearls = p.bodies().filter((b) => b.label === "pearl").length;
        if (pearls < 60) for (let i = 0; i < 3; i++) addPearl(p.W * rnd(0.2, 0.8), -20);
      }, 1800);
    },
  },
  {
    id: "material", title: "材質參數",
    api: "restitution・friction・frictionAir・density",
    desc: "同一個世界只改一個參數：彈性決定反彈高度，摩擦決定滑多遠，空氣阻力決定終端速度，密度乘上面積就是質量，蹺蹺板看誰比較重。",
    hint: "切換四個實驗・按「重放」再看一次",
    mount(ctx) {
      let mode = 0, builtAt = 0, overlay = null;
      ctx.group(["彈性", "摩擦", "空氣阻力", "密度"], 0, (i) => { mode = i; rebuild(); });
      ctx.button("重放", () => rebuild(), { primary: true });
      const p = physics(ctx, { floor: 36 });
      const narrow = () => p.W < 560;

      // Five balls dropped from the same height; only restitution differs.
      function bounce(W, top, fy) {
        const vals = [0, 0.3, 0.6, 0.8, 0.95];
        const r = clamp(W / 28, 9, 20), y0 = top + r + 8;
        const xs = vals.map((_, i) => (W * (i + 0.5)) / vals.length);
        vals.forEach((v, i) => p.add(Bodies.circle(xs[i], y0, r, {
          restitution: v, friction: 0, frictionAir: 0, ...look(COLORS[i]), plugin: { trail: [] },
        })));
        return (g) => {
          dashed(g, 0, y0, W, y0);
          vals.forEach((v, i) => tag(g, narrow() ? `${v}` : `restitution ${v}`, xs[i], fy + 18, { color: COLORS[i] }));
        };
      }
      // Four boxes launched at the same speed along shelves; only friction differs.
      function slide(W, top, fy) {
        const vals = [0, 0.02, 0.05, 0.2];
        const rowH = (fy - top) / vals.length;
        const s = clamp(rowH * 0.38, 12, 30);
        const x0 = 12, x1 = W - 12;
        // Stopping distance is about 275 px * (v0 / 6)^2 at friction 0.02, so the 0.02 box covers ~75% of the shelf.
        const v0 = 6 * Math.sqrt((0.75 * (x1 - x0 - 2 * s)) / 275);
        const shelf = { isStatic: true, friction: 1, ...look(STEEL, { lineWidth: 0 }) };
        const boxes = vals.map((v, i) => {
          const y = top + rowH * (i + 1) - 4;
          p.add([
            Bodies.rectangle((x0 + x1) / 2, y + 4, x1 - x0, 8, shelf),
            Bodies.rectangle(x1 - 4, y - s, 8, s * 2, shelf),
          ]);
          const b = Bodies.rectangle(x0 + s, y - s / 2, s, s, { friction: v, frictionAir: 0, ...look(COLORS[i]), plugin: { start: x0 + s } });
          p.add(b);
          return b;
        });
        ctx.timeout(() => boxes.forEach((b) => Body.setVelocity(b, { x: v0, y: 0 })), 350);
        return (g) => boxes.forEach((b, i) => {
          const d = Math.round(b.position.x - b.plugin.start);
          tag(g, `${narrow() ? "" : "friction "}${vals[i]}・${d} px`, b.position.x, b.bounds.min.y - 12, { color: COLORS[i], fit: W });
        });
      }
      // Four boxes falling; frictionAir caps the speed they can reach.
      function air(W, top, fy) {
        const vals = [0, 0.02, 0.05, 0.1];
        const s = clamp(W / 18, 14, 30);
        const xs = vals.map((_, i) => (W * (i + 0.5)) / vals.length);
        const boxes = vals.map((v, i) => {
          const b = Bodies.rectangle(xs[i], top + s, s, s, { frictionAir: v, restitution: 0.1, ...look(COLORS[i]), plugin: { trail: [] } });
          p.add(b);
          return b;
        });
        return (g) => boxes.forEach((b, i) => {
          tag(g, narrow() ? `${vals[i]}` : `frictionAir ${vals[i]}`, xs[i], fy + 18, { color: COLORS[i] });
          tag(g, `v ${b.speed.toFixed(1)}`, b.position.x, b.bounds.min.y - 12, { color: COLORS[i], fit: W });
        });
      }
      // Seesaw: a big light box against a small dense one.
      function density(W, top, fy) {
        const L = clamp(W * 0.72, 220, 560), cx = W / 2, py = fy - L * 0.2;
        const plank = Bodies.rectangle(cx, py, L, 12, { friction: 0.9, ...look(STEEL) });
        p.add([plank, Constraint.create({ pointA: { x: cx, y: py }, bodyB: plank, length: 0, stiffness: 1, render: { visible: false } })]);
        const s = clamp(L / 14, 16, 34);
        const big = Bodies.rectangle(cx - L * 0.36, top + s, s * 2, s * 2, { density: 0.0005, friction: 0.9, ...look(COLORS[2]) });
        const small = Bodies.rectangle(cx + L * 0.36, top + s, s, s, { density: 0.01, friction: 0.9, ...look(COLORS[0]) });
        p.add([big, small]);
        return (g) => {
          g.fillStyle = "#596173";
          g.beginPath(); g.moveTo(cx, py + 6); g.lineTo(cx - 18, fy); g.lineTo(cx + 18, fy); g.closePath(); g.fill();
          for (const b of [big, small]) {
            tag(g, `density ${b.density}・質量 ${b.mass.toFixed(2)}`, b.position.x, b.bounds.min.y - 12, { color: b.render.fillStyle, fit: W });
          }
        };
      }

      const EXP = [bounce, slide, air, density];
      const rebuild = p.build((W) => {
        builtAt = performance.now();
        overlay = EXP[mode](W, belowControls(ctx), p.floorY);
      });
      p.draw((g) => {
        trails(g, p.bodies());
        if (overlay) overlay(g);
      });
      // The air-drag race is short, so it replays by itself.
      ctx.interval(() => { if (mode === 2 && performance.now() - builtAt > 4500) rebuild(); }, 500);
    },
  },
  {
    id: "constraint", title: "約束與鏈條",
    api: "Constraint.create({ length, stiffness, damping }) + Composites.chain",
    desc: "牛頓擺是五條長度固定的約束，彈簧是低剛性的約束，繩索與吊橋用 Composites.chain 把剛體頭尾相連，箱子會不斷掉在吊橋上。",
    hint: "拖曳擺錘、繩索或吊橋・拉滑桿改彈簧剛性",
    mount(ctx) {
      const kOf = (v) => 10 ** (-2.7 + (2.7 * v) / 100); // slider 0..100 -> stiffness 0.002..1
      let k = kOf(15), spring = null, cradle = [], pullTo = null, boxes = [], overlay = null;
      ctx.slider("彈簧剛性", { min: 0, max: 100, step: 1, value: 15, format: (v) => kOf(v).toFixed(3) }, (v) => {
        k = kOf(v);
        if (spring) spring.stiffness = k;
      });
      ctx.button("拉起擺錘", () => pull(), { primary: true });
      const p = physics(ctx);

      function pull() {
        if (!pullTo) return;
        cradle.forEach((b) => Body.setVelocity(b, { x: 0, y: 0 }));
        Body.setPosition(cradle[0], pullTo);
        Body.setVelocity(cradle[0], { x: 0, y: 0 });
      }

      p.build((W) => {
        boxes = [];
        const top = belowControls(ctx), fy = p.floorY;
        const h1 = (fy - top) * 0.56, h2 = fy - top - h1;
        const wide = W >= 640;
        const ink = { strokeStyle: "#8b93a7", lineWidth: 1 };

        // Newton's cradle (from the official example; Composites.newtonsCradle is deprecated).
        const cw = wide ? W * 0.42 : W * 0.6;
        const r = clamp(Math.min(cw / 11.5, h1 * 0.11), 7, 24);
        const L = h1 - r - 14, sep = 1.9 * r, n = 5, ay = top + 4;
        const cx0 = cw / 2 - ((n - 1) * sep) / 2;
        cradle = [];
        for (let i = 0; i < n; i++) {
          const x = cx0 + i * sep;
          const ball = Bodies.circle(x, ay + L, r, { inertia: Infinity, restitution: 1, friction: 0, frictionAir: 0, slop: r * 0.02, ...look(COLORS[i]) });
          p.add([ball, Constraint.create({ pointA: { x, y: ay }, bodyB: ball, render: ink })]);
          cradle.push(ball);
        }
        const theta = Math.min(0.9, Math.asin(clamp((cx0 - r - 6) / L, 0, 1)));
        pullTo = { x: cx0 - L * Math.sin(theta), y: ay + L * Math.cos(theta) };
        pull();

        // Spring: a box hanging from a soft constraint.
        const sx = wide ? cw + W * 0.12 : cw + (W - cw) / 2;
        const bs = clamp(W / 26, 14, 28);
        const sbox = Bodies.rectangle(sx, ay + h1 * 0.4 + 40, bs, bs, look(COLORS[1]));
        spring = Constraint.create({ pointA: { x: sx, y: ay }, bodyB: sbox, length: h1 * 0.4, stiffness: k, damping: 0.01, render: { type: "spring", strokeStyle: COLORS[1], lineWidth: 1.5 } });
        p.add([sbox, spring]);

        // Rope: a horizontal chain pinned at one end, it swings down on start.
        let rope = null;
        if (wide) {
          const rx = cw + W * 0.27, rw = W - rx - 16;
          const links = 9, lw = Math.min(rw / links, (h1 - 10) / links);
          const group = Body.nextGroup(true);
          rope = Composites.stack(rx, ay, links, 1, 0, 0, (x, y) => Bodies.rectangle(x, y, lw, 8, { collisionFilter: { group }, chamfer: { radius: 4 }, ...look(COLORS[4]) }));
          Composites.chain(rope, 0.4, 0, -0.4, 0, { stiffness: 0.9, length: 0, render: { visible: false } });

    id: "stress", title: "極限測試", kind: "stress",
    api: "Engine.update(engine, delta) + Render.world(render)",
    desc: "不用 Runner，每格手動呼叫 Engine.update 與 Render.world 並分別計時；逐級增加剛體數量直到掉到 30 FPS 以下。中間的槳持續攪動，可切換線框與休眠比較成本。",
    hint: "按「自動加壓」開始・切換線框或休眠後再測一次",
    mount(ctx) {
      ctx.controls.classList.add("bottom");
      let wire = false, sleep = false;
      ctx.toggle("線框", wire, (v) => { wire = v; p.render.options.wireframes = v; });
      ctx.toggle("休眠", sleep, (v) => {
        sleep = v;
        p.engine.enableSleeping = v;
        if (!v) p.bodies().forEach((b) => Sleeping.set(b, false));
      });
      const p = physics(ctx, { run: false, options: { showSleeping: true } });
      let box = null, paddle = null, angle = 0, count = 0, phys = 0, paint = 0;

      // Fill the container with n bodies on a grid sized so they always fit.
      function spawn(n) {
        count = n;
        for (const b of p.bodies()) Composite.remove(p.world, b, true);
        Engine.clear(p.engine);
        const { x0, y0, cw, ch } = box;
        const s = clamp(Math.sqrt((cw * ch * 0.55) / n) * 0.8, 3, 26), gap = s * 1.3;
        const cols = Math.max(1, Math.floor((cw - 10) / gap));
        const list = [];
        for (let i = 0; i < n; i++) {
          const x = x0 + 5 + gap / 2 + (i % cols) * gap, y = y0 + gap / 2 + Math.floor(i / cols) * gap;
          const o = { restitution: 0.1, friction: 0.05, render: { fillStyle: COLORS[i % 6], lineWidth: 0 } };
          list.push(i % 2 ? Bodies.circle(x, y, s / 2, o) : Bodies.rectangle(x, y, s * 0.9, s * 0.9, o));
        }
        p.add(list);
      }
      p.build((W, H) => {
        const x0 = W >= 760 ? 350 : 10, x1 = W - 10, y0 = 10, y1 = H - ctx.controls.offsetHeight - 20;
        box = { x0, x1, y0, y1, cw: x1 - x0, ch: y1 - y0 };
        const t = 12, wall = { isStatic: true, label: "box", render: { fillStyle: "#2a2f3a" } };
        p.add([
          Bodies.rectangle((x0 + x1) / 2, y1 + t / 2, box.cw + 2 * t, t, wall),
          Bodies.rectangle(x0 - t / 2, y1 - 1000, t, 2000, wall),
          Bodies.rectangle(x1 + t / 2, y1 - 1000, t, 2000, wall),
        ]);
        paddle = Bodies.rectangle((x0 + x1) / 2, y1 - box.ch * 0.3, box.cw * 0.36, 10, { isStatic: true, label: "paddle", render: { fillStyle: COLORS[1] } });
        p.add(paddle);
        if (count) spawn(count);
      });

      ctx.raf(() => {
        if (!paddle) return;
        angle += 0.03;
        Body.setAngle(paddle, angle, true);
        const t0 = performance.now();
        Engine.update(p.engine, 1000 / 60);
        const t1 = performance.now();
        Render.world(p.render);
        const t2 = performance.now();
        phys += (t1 - t0 - phys) * 0.1;
        paint += (t2 - t1 - paint) * 0.1;
      });

      ctx.ramp({
        label: "剛體", unit: "個", steps: [100, 250, 500, 1000, 1500, 2000, 3000, 4000, 6000], minFps: 30,
        apply(n) { spawn(n); },
        metrics: () => ({
          碰撞對: p.engine.pairs.list.length,
          物理: `${phys.toFixed(1)} ms`,
          繪圖: `${paint.toFixed(1)} ms`,
          模式: `${wire ? "線框" : "填色"}${sleep ? "＋休眠" : ""}`,
        }),
        note: "每格先跑 Engine.update（碰撞偵測與求解）再跑 Render.world（Canvas 2D 繪圖），兩段分開計時。開「休眠」後遠離槳、已靜止的物體停算；開「線框」省下填色成本。手機與內顯的上限通常是桌機的三分之一到一半。",
      });
    },
  },
] });
</script>
</body>
</html>
