<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mediabunny 示範：音樂視覺化影片產生器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":["audio"],"note":"把 loop.mp3 離線算成頻譜動畫，用 WebCodecs 編碼並封裝成含音軌的 MP4"}</script>
<style>
  body { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; padding: 14px 14px 46px; height: 100%; }
  .stage-box { position: relative; min-width: 0; min-height: 0; border-radius: 12px; overflow: hidden; background: #06070a; border: 1px solid var(--line); }
  .stage-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .pill { position: absolute; left: 12px; top: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(0, 0, 0, 0.6); font: 12px var(--mono); color: #d5d7dc; }
  .meter { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255, 255, 255, 0.1); }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); }

  aside { display: flex; flex-direction: column; gap: 9px; min-height: 0; overflow: hidden; }
  .cap { font-size: 12px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); line-height: 1.5; }
  .cap.ok { border-color: rgba(123, 211, 137, 0.5); color: #b9ecc2; }
  .cap.bad { border-color: rgba(229, 72, 77, 0.6); color: #ffb4b6; }
  .group { display: flex; flex-direction: column; gap: 4px; }
  .group > span { font-size: 12px; color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { flex: 1; border: 0; background: var(--bg-2); color: var(--fg); padding: 6px 0; cursor: pointer; font: 12px var(--font); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .seg button:disabled { opacity: .45; cursor: not-allowed; }
  .result { flex: 1; min-height: 80px; position: relative; border-radius: 10px; border: 1px dashed var(--line); background: #0a0b0e; overflow: hidden; }
  .result video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .result .empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; color: var(--muted); }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; font-size: 12px; }
  .meta dt { color: var(--muted); }
  .meta dd { margin: 0; font-family: var(--mono); font-size: 11px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }

  @media (max-width: 640px) {
    /* stacked layout scrolls under the fixed hint: show it briefly, then fade it out */
    .hint { animation: hint-fade .5s 8s forwards; }
    body { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; padding: 10px 10px 42px; gap: 8px; }
    aside { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; overflow: visible; }
    .group > span, .meta, .hide-narrow { display: none; }
    .cap { grid-column: 1 / -1; padding: 4px 8px; font-size: 11px; }
    .result { min-height: 0; height: 58px; }
  }
</style>
</head>
<body>
<div class="stage-box">
  <canvas id="cv" width="640" height="360"></canvas>
  <div class="pill" id="pill">準備中…</div>
  <div class="meter"><i id="meter"></i></div>
</div>
<aside>
  <div class="cap" id="cap">檢查 WebCodecs 編碼器中…</div>
  <div class="group"><span>影片長度</span>
    <div class="seg" id="len"><button data-v="8" class="on">前 8 秒</button><button data-v="19">完整 19 秒</button></div>
  </div>
  <div class="group"><span>解析度</span>
    <div class="seg" id="res"><button data-v="640" class="on">640×360</button><button data-v="1280">1280×720</button></div>
  </div>
  <div class="group hide-narrow"><span>畫質（位元率）</span>
    <div class="seg" id="q"><button data-v="LOW">低</button><button data-v="MEDIUM" class="on">中</button><button data-v="HIGH">高</button></div>
  </div>
  <button class="btn primary" id="go" disabled>產生 MP4</button>
  <div class="result" id="result"><div class="empty">完成後在這裡播放（含音樂）</div></div>
  <dl class="meta" id="meta">
    <dt>容器</dt><dd id="mMime">尚未產生</dd>
    <dt>視訊</dt><dd id="mVideo">無</dd>
    <dt>音訊</dt><dd id="mAudio">無</dd>
    <dt>長度</dt><dd id="mDur">無</dd>
    <dt>檔案</dt><dd id="mSize">無</dd>
  </dl>
  <div class="row"><button class="btn" id="dl" disabled>下載 MP4</button></div>
</aside>
<div class="hint">離線算圖比即時播放更快，再由瀏覽器的 WebCodecs 編碼器壓成 MP4</div>

<script type="module">
// Mediabunny: a dependency-free media toolkit. Here it drives WebCodecs to encode canvas frames
// and an AudioBuffer, muxes them into an MP4 entirely in the browser, then reads the file back.
import * as MB from "https://cdn.jsdelivr.net/npm/mediabunny@1.61.0/dist/bundles/mediabunny.min.mjs";

const $ = (id) => document.getElementById(id);
const cv = $("cv");
const ctx = cv.getContext("2d");
const FPS = 30;
const FFT_SIZE = 2048;
const BANDS = 64;
const NAMES = { avc: "H.264", hevc: "H.265", vp9: "VP9", av1: "AV1", vp8: "VP8", aac: "AAC", opus: "Opus", mp3: "MP3" };
const opts = { len: 8, res: 640, q: "MEDIUM" };
const font = getComputedStyle(document.body).fontFamily;
let song = null;
let lastUrl = null;
let busy = false;

for (const id of ["len", "res", "q"]) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b || busy) return;
    opts[id] = id === "q" ? b.dataset.v : Number(b.dataset.v);
    [...$(id).children].forEach((x) => x.classList.toggle("on", x === b));
  });
}

// --- tiny radix-2 FFT for the offline spectrum ---------------------------------
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = (-2 * Math.PI) / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const ncr = cr * wr - ci * wi;
        ci = cr * wi + ci * wr;
        cr = ncr;
      }
    }
  }
}

const hann = Float32Array.from({ length: FFT_SIZE }, (_, i) => 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (FFT_SIZE - 1)));
const smooth = new Float32Array(BANDS);
function analyse(mono, sr, t) {
  const re = new Float32Array(FFT_SIZE);
  const im = new Float32Array(FFT_SIZE);
  const start = Math.max(0, Math.floor(t * sr) - FFT_SIZE / 2);
  let energy = 0;
  for (let i = 0; i < FFT_SIZE; i++) {
    const v = mono[start + i] || 0;
    re[i] = v * hann[i];
    energy += v * v;
  }
  fft(re, im);
  const lo = Math.log(40), hi = Math.log(12000);
  for (let b = 0; b < BANDS; b++) {
    const f0 = Math.exp(lo + ((hi - lo) * b) / BANDS);
    const f1 = Math.exp(lo + ((hi - lo) * (b + 1)) / BANDS);
    const i0 = Math.max(1, Math.floor((f0 / sr) * FFT_SIZE));
    const i1 = Math.max(i0 + 1, Math.ceil((f1 / sr) * FFT_SIZE));
    let m = 0;
    for (let i = i0; i < i1; i++) m = Math.max(m, Math.hypot(re[i], im[i]));
    const db = 20 * Math.log10((m * 4) / FFT_SIZE + 1e-9);
    const v = Math.min(1, Math.max(0, (db + 62) / 56));
    smooth[b] = Math.max(v, smooth[b] * 0.86);
  }
  return { bands: smooth, energy: Math.sqrt(energy / FFT_SIZE), start };
}

function draw(t, dur, mono, sr) {
  const W = cv.width, H = cv.height, k = H / 360;
  const { bands, energy, start } = analyse(mono, sr, t);
  const pulse = Math.min(1, energy * 3.2);
  const hue = 220 + Math.sin(t * 0.6) * 40;
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, W * 0.7);
  bg.addColorStop(0, `hsl(${hue} 60% ${12 + pulse * 10}%)`);
  bg.addColorStop(1, "#050508");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Circular, mirrored spectrum.
  const cx = W / 2, cy = H * 0.46;
  const R = H * (0.2 + pulse * 0.04);
  ctx.lineCap = "round";
  ctx.lineWidth = Math.max(2, 4 * k);
  for (let s = -1; s <= 1; s += 2) {
    for (let b = 0; b < BANDS; b++) {
      const a = -Math.PI / 2 + s * (b + 0.5) * (Math.PI / BANDS);
      const len = 4 * k + bands[b] * H * 0.2;
      ctx.strokeStyle = `hsl(${(hue + 120 + b * 2.6) % 360} 90% ${55 + bands[b] * 20}%)`;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
      ctx.lineTo(cx + Math.cos(a) * (R + len), cy + Math.sin(a) * (R + len));
      ctx.stroke();
    }
  }
  ctx.fillStyle = "rgba(5, 5, 10, 0.85)";
  ctx.beginPath();
  ctx.arc(cx, cy, R - 6 * k, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#f7df1e";
  ctx.font = `800 ${20 * k}px ${font}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("Mediabunny", cx, cy - 8 * k);
  ctx.fillStyle = "#cfd2d8";
  ctx.font = `${12 * k}px Consolas, monospace`;
  ctx.fillText(`${t.toFixed(1)} / ${dur.toFixed(1)} s`, cx, cy + 14 * k);

  // Waveform strip along the bottom.
  const baseY = H * 0.88;
  ctx.strokeStyle = "rgba(76, 201, 240, 0.85)";
  ctx.lineWidth = 1.5 * k;
  ctx.beginPath();
  for (let x = 0; x <= W; x += 2) {
    const v = mono[start + Math.floor((x / W) * FFT_SIZE)] || 0;
    const y = baseY + v * H * 0.12;
    x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = "rgba(255, 255, 255, 0.12)";
  ctx.fillRect(0, H - 4 * k, W, 4 * k);
  ctx.fillStyle = "#f7df1e";
  ctx.fillRect(0, H - 4 * k, (W * t) / dur, 4 * k);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "rgba(236, 235, 230, 0.7)";
  ctx.font = `${12 * k}px ${font}`;
  ctx.fillText("loop.mp3・WebCodecs 編碼", 14 * k, 24 * k);
}

function sliceBuffer(buf, from, to) {
  const sr = buf.sampleRate;
  const a = Math.floor(from * sr), b = Math.min(buf.length, Math.floor(to * sr));
  const out = new AudioBuffer({ length: b - a, numberOfChannels: buf.numberOfChannels, sampleRate: sr });
  for (let c = 0; c < buf.numberOfChannels; c++) out.copyToChannel(buf.getChannelData(c).subarray(a, b), c);
  return out;
}

function cutWithFade(buf, dur) {
  const out = sliceBuffer(buf, 0, dur);
  if (dur < buf.duration - 0.05) {
    const sr = out.sampleRate, n = Math.floor(0.6 * sr);
    for (let c = 0; c < out.numberOfChannels; c++) {
      const d = out.getChannelData(c);
      for (let i = 0; i < n; i++) d[d.length - 1 - i] *= i / n;
    }
  }
  return out;
}

async function detect() {
  if (typeof VideoEncoder === "undefined") return null;
  const video = await MB.getFirstEncodableVideoCodec(["avc", "vp9", "av1"], { width: 1280, height: 720 });
  const audio = await MB.getFirstEncodableAudioCodec(["aac", "opus"], { numberOfChannels: 2, sampleRate: 44100 });
  return video ? { video, audio } : null;
}

async function generate() {
  if (busy) return;
  busy = true;
  $("go").disabled = true;
  document.querySelectorAll(".seg button").forEach((b) => { b.disabled = true; });
  const W = opts.res, H = Math.round((opts.res * 9) / 16);
  cv.width = W;
  cv.height = H;
  smooth.fill(0);
  const dur = Math.min(opts.len, song.duration);
  const audio = cutWithFade(song, dur);
  const mono = audio.getChannelData(0);
  const sr = audio.sampleRate;
  const total = Math.round(dur * FPS);
  const quality = MB[`QUALITY_${opts.q}`];
  const videoCodec = await MB.getFirstEncodableVideoCodec(["avc", "vp9", "av1"], { width: W, height: H });
  const audioCodec = await MB.getFirstEncodableAudioCodec(["aac", "opus"], { numberOfChannels: audio.numberOfChannels, sampleRate: sr });

  const output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: "in-memory" }), target: new MB.BufferTarget() });
  const videoSource = new MB.CanvasSource(cv, { codec: videoCodec, quality, keyFrameInterval: 2 });
  output.addVideoTrack(videoSource, { frameRate: FPS });
  let audioSource = null;
  if (audioCodec) {
    audioSource = new MB.AudioBufferSource({ codec: audioCodec, quality: MB.QUALITY_MEDIUM });
    output.addAudioTrack(audioSource);
  }
  await output.start();

  const t0 = performance.now();
  let audioUntil = 0;
  for (let i = 0; i < total; i++) {
    const t = i / FPS;
    // Keep the audio track at most one second ahead of the video so the muxer can interleave.
    if (audioSource && t >= audioUntil) {
      await audioSource.add(sliceBuffer(audio, audioUntil, Math.min(dur, audioUntil + 1)));
      audioUntil += 1;
    }
    draw(t, dur, mono, sr);
    await videoSource.add(t, 1 / FPS);
    if (i % 6 === 0) {
      const speed = t / Math.max(0.001, (performance.now() - t0) / 1000);
      $("pill").textContent = `離線算圖 ${i} / ${total} 影格・${speed.toFixed(1)}× 即時速度`;
      $("meter").style.width = `${(i / total) * 100}%`;
      await new Promise((r) => setTimeout(r)); // let the canvas repaint
    }
  }
  while (audioSource && audioUntil < dur) {
    await audioSource.add(sliceBuffer(audio, audioUntil, Math.min(dur, audioUntil + 1)));
    audioUntil += 1;
  }
  $("pill").textContent = "封裝 MP4 中…";
  await output.finalize();
  const secs = (performance.now() - t0) / 1000;
  const blob = new Blob([output.target.buffer], { type: "video/mp4" });
  $("meter").style.width = "100%";
  $("pill").textContent = `完成：${dur.toFixed(1)} 秒影片只花 ${secs.toFixed(1)} 秒（${(dur / secs).toFixed(1)}× 即時）`;

  if (lastUrl) URL.revokeObjectURL(lastUrl);
  lastUrl = URL.createObjectURL(blob);
  const video = document.createElement("video");
  Object.assign(video, { src: lastUrl, controls: true, muted: true, autoplay: true, loop: true, playsInline: true });
  $("result").replaceChildren(video);
  $("dl").disabled = false;
  await describe(blob);

  busy = false;
  $("go").disabled = false;
  document.querySelectorAll(".seg button").forEach((b) => { b.disabled = false; });
}

// Read the freshly written file back with Mediabunny's demuxer.
async function describe(blob) {
  const input = new MB.Input({ source: new MB.BlobSource(blob), formats: MB.ALL_FORMATS });
  const mime = await input.getMimeType();
  const duration = await input.computeDuration();
  const vt = await input.getPrimaryVideoTrack();
  const at = await input.getPrimaryAudioTrack();
  $("mMime").textContent = mime;
  $("mMime").title = mime;
  if (vt) {
    const stats = await vt.computePacketStats(90);
    $("mVideo").textContent = `${NAMES[vt.codec] || vt.codec}・${vt.displayWidth}×${vt.displayHeight}・${Math.round(stats.averagePacketRate)} fps・${(stats.averageBitrate / 1e6).toFixed(2)} Mbps`;
  }
  $("mAudio").textContent = at ? `${NAMES[at.codec] || at.codec}・${at.sampleRate} Hz・${at.numberOfChannels} 聲道` : "瀏覽器無可用音訊編碼器";
  $("mDur").textContent = `${duration.toFixed(2)} 秒`;
  $("mSize").textContent = `${(blob.size / 1024).toFixed(0)} KB`;
}

$("go").onclick = generate;
$("dl").onclick = () => {
  const a = document.createElement("a");
  a.href = lastUrl;
  a.download = "mediabunny-visualizer.mp4";
  a.click();
};

const support = await detect();
if (!support) {
  $("cap").className = "cap bad";
  $("cap").textContent = "此瀏覽器沒有可用的 WebCodecs 影像編碼器，請改用新版 Chrome、Edge 或 Safari。";
  $("pill").textContent = "無法編碼";
} else {
  $("cap").className = "cap ok";
  $("cap").textContent = `WebCodecs 可用・視訊 ${NAMES[support.video]}・音訊 ${support.audio ? NAMES[support.audio] : "無"}`;
  $("pill").textContent = "解碼 loop.mp3 中…";
  const bytes = await (await fetch("_shared/audio/loop.mp3")).arrayBuffer();
  song = await new OfflineAudioContext(2, 44100, 44100).decodeAudioData(bytes);
  generate();
}
</script>
</body>
</html>
