<script type="module">
// Mediabunny 1.61 showcase: read containers (Input), decode (CanvasSink / AudioBufferSink),
// encode and mux (Output + CanvasSource / AudioBufferSource) and convert (Conversion).
// All sources are generated in the page; every output file is read back with Mediabunny.
import * as MB from "https://cdn.jsdelivr.net/npm/mediabunny@1.61.0/dist/bundles/mediabunny.min.mjs";
import { pattern, melody, visualize, smooth, sliceBuffer, cutWithFade, drawWave } from "./assets/mediabunny/visual.js";

const { h, fmtMs } = Showcase;
const css = getComputedStyle(document.documentElement);
const MONO = css.getPropertyValue("--mono").trim() || "ui-monospace, monospace";
const NAMES = { avc: "H.264", hevc: "H.265", vp9: "VP9", av1: "AV1", vp8: "VP8", aac: "AAC", opus: "Opus", mp3: "MP3", vorbis: "Vorbis", flac: "FLAC", "pcm-s16": "PCM 16-bit" };
const QUALITIES = [MB.QUALITY_LOW, MB.QUALITY_MEDIUM, MB.QUALITY_HIGH];
const FPS = 30;
const HAS_WC = typeof VideoEncoder !== "undefined" && typeof VideoDecoder !== "undefined";
const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(2)} MB` : `${Math.max(1, Math.round(n / 1024))} KB`);
const kbps = (bytes, sec) => `${Math.round((bytes * 8) / sec / 1000)} kbps`;
const name = (c) => NAMES[c] || c || "?";
const abortError = () => new DOMException("場景已切換", "AbortError");
const isAbort = (e) => e && e.name === "AbortError";

function canvas(w, hh) {
  const c = document.createElement("canvas");
  c.width = w; c.height = hh;
  return c;
}
const readInput = (data) => new MB.Input({ source: data instanceof Blob ? new MB.BlobSource(data) : new MB.BufferSource(data), formats: MB.ALL_FORMATS });

// Object URLs created by a scene; revoked when the scene unmounts (or when a slot is reused).
function urls(ctx) {
  const live = new Map();
  ctx.onCleanup(() => live.forEach((u) => URL.revokeObjectURL(u)));
  return (blob, slot = blob) => {
    if (live.has(slot)) URL.revokeObjectURL(live.get(slot));
    const u = URL.createObjectURL(blob);
    live.set(slot, u);
    return u;
  };
}
const dl = (url, file) => `<a href="${url}" download="${file}">下載</a>`;

function showVideo(box, url, { controls = false, muted = true } = {}) {
  box.querySelectorAll("video, .mb-empty").forEach((x) => x.remove());
  const v = h("video", { class: "mb-fill" });
  v.muted = muted; v.defaultMuted = muted;
  Object.assign(v, { preload: "auto", loop: true, autoplay: true, playsInline: true, controls, src: url });
  box.prepend(v);
  return v;
}

// Explain what is missing instead of failing when WebCodecs is not available.
function noWebCodecs(ctx) {
  if (HAS_WC) return false;
  ctx.html(`<div class="mb-wrap"><div class="mb-card mb-msg"><h3>這個瀏覽器沒有 WebCodecs</h3>
    <p>Mediabunny 讀寫容器（MP4、WebM、WAV 的封裝與解析）是純 JavaScript，但影音的編碼與解碼交給瀏覽器內建的 WebCodecs
    （<code>VideoEncoder</code>／<code>VideoDecoder</code>）。請改用 Chrome／Edge 94 以上、Safari 16.4 以上或 Firefox 130 以上。</p></div></div>`);
  return true;
}


// Encode `frames` frames of the test pattern (plus an optional AudioBuffer) and return the file bytes.
async function encodeCanvas({ cv, codec, mp4, frames, quality = MB.QUALITY_MEDIUM, audio = null, audioCodec = null, label = "", alive = () => true, onFrame }) {
  const output = new MB.Output({ format: mp4 ? new MB.Mp4OutputFormat({ fastStart: "in-memory" }) : new MB.WebMOutputFormat(), target: new MB.BufferTarget() });
  const src = new MB.CanvasSource(cv, { codec, quality, keyFrameInterval: 1 });
  output.addVideoTrack(src, { frameRate: FPS });
  let asrc = null;
  if (audio && audioCodec) {
    asrc = new MB.AudioBufferSource({ codec: audioCodec, quality: MB.QUALITY_MEDIUM });
    output.addAudioTrack(asrc);
  }
  await output.start();
  if (asrc) await asrc.add(audio);
  const t0 = performance.now();
  for (let i = 0; i < frames; i++) {
    if (!alive()) { await output.cancel(); throw abortError(); }
    pattern(cv, i / FPS, label);
    await src.add(i / FPS, 1 / FPS);
    if (onFrame) await onFrame(i);
  }
  await output.finalize();
  const mime = await output.getMimeType();
  return { blob: new Blob([output.target.buffer], { type: mime.split(";")[0] }), mime, ms: performance.now() - t0 };
}

// 4-second 640x360 clip with audio, written by Mediabunny itself (shared by several scenes).
let synthJob = null;
function synthClip() {
  if (!synthJob) synthJob = (async () => {
    const video = await MB.getFirstEncodableVideoCodec(["avc", "vp9", "av1", "vp8"], { width: 640, height: 360 });
    if (!video) throw new Error("此瀏覽器沒有可用的影像編碼器");
    const mp4 = video === "avc";
    const audio = await MB.getFirstEncodableAudioCodec(mp4 ? ["aac", "opus"] : ["opus"], { numberOfChannels: 2, sampleRate: 44100 });
    const r = await encodeCanvas({ cv: canvas(640, 360), codec: video, mp4, frames: 4 * FPS, audio: await melody(4), audioCodec: audio, label: "Mediabunny 測試片" });
    return r.blob;
  })();
  synthJob.catch(() => (synthJob = null));
  return synthJob;
}

let songJob = null;
const song = () => (songJob ||= fetch("_shared/audio/loop.mp3").then((r) => r.arrayBuffer()).then((b) => new OfflineAudioContext(2, 44100, 44100).decodeAudioData(b)));

// ---------- scene 2 helpers --------------------------------------------------------------
const REC_SEC = 3;
let recJob = null;
// Record the test pattern in real time with the browser's own MediaRecorder (a file Mediabunny did not write).
function recording() {
  if (recJob) return recJob;
  const cv = canvas(640, 360);
  const mime = ["video/webm;codecs=vp8", "video/webm", "video/mp4"].find((m) => MediaRecorder.isTypeSupported(m));
  const rec = new MediaRecorder(cv.captureStream(FPS), { mimeType: mime, videoBitsPerSecond: 2e6 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  const done = new Promise((res, rej) => {
    rec.onstop = () => res(new Blob(chunks, { type: rec.mimeType.split(";")[0] }));
    rec.onerror = (e) => rej(e.error || new Error("MediaRecorder 失敗"));
  });
  const t0 = performance.now();
  pattern(cv, 0, "MediaRecorder 錄製");
  rec.start(500);
  const tick = () => {
    const t = (performance.now() - t0) / 1000;
    pattern(cv, t, "MediaRecorder 錄製");
    if (t < REC_SEC) setTimeout(tick, 16); else rec.stop();
  };
  tick();
  recJob = { cv, done };
  done.catch(() => (recJob = null));
  return recJob;
}
async function inspect(blob) {
  const input = readInput(blob);
  const fmt = await input.getFormat();
  const vt = await input.getPrimaryVideoTrack(), at = await input.getPrimaryAudioTrack();
  const dur = await input.computeDuration();
  const info = { fmt: fmt.name, mime: await input.getMimeType(), dur, size: blob.size, packets: [], keys: 0 };
  if (vt) {
    const fr = await vt.computeFrameRateMetrics();
    info.video = `${name(await vt.getCodec())}・${await vt.getDisplayWidth()}×${await vt.getDisplayHeight()}`;
    info.fps = fr.frameRateIsConstant ? `固定 ${fr.bestGuessFrameRate} fps` : `不固定 ${fr.minFrameRate.toFixed(0)}~${fr.maxFrameRate.toFixed(0)} fps（中位 ${fr.medianFrameRate.toFixed(0)}）`;
    // EncodedPacketSink reads compressed packets straight from the container: no decoding involved.
    for await (const p of new MB.EncodedPacketSink(vt).packets()) {
      info.packets.push({ t: p.timestamp, size: p.byteLength, key: p.type === "key" });
      if (p.type === "key") info.keys++;
    }
  }
  info.audio = at ? `${name(await at.getCodec())}・${await at.getSampleRate()} Hz・${await at.getNumberOfChannels()} 聲道` : "無";
  return info;
}
function drawPackets(cv, info) {
  const dpr = Math.min(2, devicePixelRatio || 1), W = Math.max(50, cv.clientWidth * dpr), H = Math.max(40, cv.clientHeight * dpr);
  cv.width = W; cv.height = H;
  const g = cv.getContext("2d");
  g.fillStyle = "#0d0f14";
  g.fillRect(0, 0, W, H);
  const list = info.packets, max = Math.max(...list.map((p) => p.size)), dur = Math.max(info.dur, 0.001);
  const top = 30 * dpr, bw = Math.max(1, (W - 16 * dpr) / Math.max(list.length, 1) - 1);
  for (const p of list) {
    const bh = Math.sqrt(p.size / max) * (H - top - 6 * dpr);
    g.fillStyle = p.key ? "#f7df1e" : "#4cc9f0";
    g.fillRect(8 * dpr + (p.t / dur) * (W - 16 * dpr - bw), H - 4 * dpr - bh, bw, bh);
  }
}
function infoRows(dlEl, info) {
  const keyTimes = info.packets.filter((p) => p.key).map((p) => p.t.toFixed(2));
  const rows = [
    ["容器", `${info.fmt}・${kb(info.size)}`],
    ["MIME", info.mime],
    ["長度", `${info.dur.toFixed(3)} s`],
    ["影像", info.video || "無"],
    ["影格率", info.fps || "無"],
    ["音訊", info.audio],
    ["封包", `${info.packets.length} 個・平均 ${kbps(info.packets.reduce((s, p) => s + p.size, 0), info.dur)}`],
    ["關鍵格", `${info.keys} 個（${keyTimes.slice(0, 6).join("、")}${keyTimes.length > 6 ? "…" : ""} s）`],
  ];
  dlEl.replaceChildren(...rows.flatMap(([k, v]) => [h("dt", { text: k }), h("dd", { text: v, title: v })]));
}


Showcase.run({ scenes: [
  {
    id: "visualizer", title: "音樂視覺化 MP4",
    api: "new Output({ format: new Mp4OutputFormat(), target: new BufferTarget() })",
    desc: "把 loop.mp3 逐格算成頻譜動畫，CanvasSource 把每一格畫布交給 WebCodecs 編碼，AudioBufferSource 同時寫入音軌，最後封裝成 MP4 並用 Input 讀回驗證。",
    hint: "離線算圖通常比即時播放快",
    mount(ctx) {
      if (noWebCodecs(ctx)) return;
      ctx.html(`<div class="mb-wrap mb-two">
        <div class="mb-card"><canvas class="mb-fill" width="640" height="360"></canvas><span class="mb-tag">準備中…</span><div class="mb-meter"><i></i></div></div>
        <div class="mb-col"><div class="mb-card mb-grow"><div class="mb-empty">完成後在這裡播放（含音樂）</div></div><dl class="mb-dl"></dl></div></div>`);
      const opts = { len: 8, res: 640, q: 1 };
      ctx.group(["前 8 秒", "完整 19 秒"], 0, (i) => (opts.len = i ? 19 : 8));
      ctx.group(["640×360", "1280×720"], 0, (i) => (opts.res = i ? 1280 : 640));
      ctx.group(["低", "中", "高"], 1, (i) => (opts.q = i));
      const go = ctx.button("產生 MP4", () => generate(), { primary: true });
      const cv = ctx.$("canvas"), tag = ctx.$(".mb-tag"), meter = ctx.$(".mb-meter i");
      const box = ctx.$(".mb-col .mb-card"), meta = ctx.$(".mb-dl");
      const make = urls(ctx);
      let busy = false, stopPreview = null;
      async function generate() {
        if (busy) return;
        busy = true; go.disabled = true;
        if (stopPreview) stopPreview();
        try {
          const buf = await song();
          const W = opts.res, H = (opts.res * 9) / 16;
          cv.width = W; cv.height = H;
          smooth.fill(0);
          const dur = Math.min(opts.len, buf.duration), audio = cutWithFade(buf, dur), mono = audio.getChannelData(0), sr = audio.sampleRate;
          const vcodec = await MB.getFirstEncodableVideoCodec(["avc", "vp9", "av1"], { width: W, height: H });
          const acodec = await MB.getFirstEncodableAudioCodec(["aac", "opus"], { numberOfChannels: audio.numberOfChannels, sampleRate: sr });
          if (!vcodec) throw new Error("沒有可用的影像編碼器");
          const output = new MB.Output({ format: new MB.Mp4OutputFormat({ fastStart: "in-memory" }), target: new MB.BufferTarget() });
          const vsrc = new MB.CanvasSource(cv, { codec: vcodec, quality: QUALITIES[opts.q], keyFrameInterval: 2 });
          output.addVideoTrack(vsrc, { frameRate: FPS });
          const asrc = acodec ? new MB.AudioBufferSource({ codec: acodec, quality: MB.QUALITY_MEDIUM }) : null;
          if (asrc) output.addAudioTrack(asrc);
          await output.start();
          const total = Math.round(dur * FPS), t0 = performance.now();
          let audioUntil = 0;
          for (let i = 0; i < total; i++) {
            if (!ctx.active) { await output.cancel(); return; }
            const t = i / FPS;
            // Keep audio at most one second ahead of video so the muxer can interleave.
            if (asrc && t >= audioUntil) { await asrc.add(sliceBuffer(audio, audioUntil, Math.min(dur, audioUntil + 1))); audioUntil += 1; }
            visualize(cv, t, dur, mono, sr);
            await vsrc.add(t, 1 / FPS);
            if (i % 6 === 0) {
              tag.innerHTML = `編碼 <b>${name(vcodec)}</b> ${i}/${total} 格・<b>${(t / Math.max(0.001, (performance.now() - t0) / 1000)).toFixed(1)}×</b> 即時速度`;
              meter.style.width = `${(i / total) * 100}%`;
              await new Promise((r) => setTimeout(r));
            }
          }
          while (asrc && audioUntil < dur) { await asrc.add(sliceBuffer(audio, audioUntil, Math.min(dur, audioUntil + 1))); audioUntil += 1; }
          tag.textContent = "封裝 MP4 中…";
          await output.finalize();
          if (!ctx.active) return;
          const secs = (performance.now() - t0) / 1000;
          const blob = new Blob([output.target.buffer], { type: "video/mp4" });
          meter.style.width = "100%";
          tag.innerHTML = `完成：${dur.toFixed(1)} 秒影片花 <b>${secs.toFixed(1)} s</b>（<b>${(dur / secs).toFixed(1)}×</b> 即時）`;
          const url = make(blob, "out");
          const video = showVideo(box, url, { controls: true });
          // Read the freshly written file back with Mediabunny's demuxer.
          const input = readInput(blob);
          const vt = await input.getPrimaryVideoTrack(), at = await input.getPrimaryAudioTrack();
          const stats = await vt.computePacketStats(90);
          const rows = [
            ["容器", await input.getMimeType()],
            ["影像", `${name(await vt.getCodec())}・${await vt.getDisplayWidth()}×${await vt.getDisplayHeight()}・${Math.round(stats.averagePacketRate)} fps・${(stats.averageBitrate / 1e6).toFixed(2)} Mbps`],
            ["音訊", at ? `${name(await at.getCodec())}・${await at.getSampleRate()} Hz・${await at.getNumberOfChannels()} 聲道` : "瀏覽器無可用音訊編碼器"],
            ["長度", `${(await input.computeDuration()).toFixed(2)} 秒`],
            ["檔案", `${kb(blob.size)}`],
          ];

    mount(ctx) {
      if (noWebCodecs(ctx)) return;
      ctx.html(`<div class="mb-bench"><div class="mb-card"><div class="mb-empty">按「開始測試」後在這裡顯示正在編碼的畫布</div></div></div>`);
      ctx.controls.classList.add("bottom");
      const CODECS = ["avc", "vp9", "av1"];
      let codec = "avc";
      ctx.group(["H.264", "VP9", "AV1"], 0, (i) => (codec = CODECS[i]));
      const card = ctx.$(".mb-bench .mb-card"), tag = h("span", { class: "mb-tag" });
      const H = (w) => Math.round((w * 9) / 16 / 2) * 2;
      ctx.bench({
        label: "畫布尺寸", unit: "", sizes: [320, 640, 1280, 1920, 2560, 3840], target: 2000, budget: 12000,
        format: (n) => `${n}×${H(n)}`,
        async prepare(n) {
          const cv = canvas(n, H(n));
          card.replaceChildren(cv, tag);
          cv.className = "mb-fill";
          const ok = await MB.canEncodeVideo(codec, { width: n, height: H(n) });
          tag.textContent = `${n}×${H(n)}・${name(codec)}${ok ? "" : "・此尺寸不支援"}`;
          return { cv, ok };
        },
        async run(n, { cv, ok }) {
          if (!ok) return "不支援";
          const r = await encodeCanvas({ cv, codec, mp4: codec === "avc", frames: 60, label: `${n}×${H(n)}`, alive: () => ctx.active });
          return `${(60 / (r.ms / 1000)).toFixed(0)} fps・${(2000 / r.ms).toFixed(1)}× 即時・${kb(r.blob.size)}`;
        },
        note: "每級編碼 60 格 640×360 版面放大後的測試動畫，時間包含繪圖、VideoFrame 建立、WebCodecs 編碼與封裝。H.264 封裝成 MP4，VP9／AV1 封裝成 WebM。有硬體編碼器時通常比軟體編碼快很多；結果列的 fps 是整體吞吐量。",
      });
    },
  },
] });
</script>
</body>
</html>
