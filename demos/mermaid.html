<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mermaid 示範：用文字畫圖表</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(250px, 36%) 1fr; }
  #pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fbfaf7; border-right: 1px solid var(--line); }
  #pane .head { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px 4px; font-size: 12px; color: var(--muted); }
  #pane .head b { color: var(--fg); font-weight: 700; }
  #src { flex: 1; min-height: 0; resize: none; border: 0; outline: 0; background: transparent; color: #2b2a26;
    padding: 6px 14px 48px; font: 12.5px/1.65 var(--mono); tab-size: 2; white-space: pre; overflow: auto; font-variant-ligatures: none; }
  #view { position: relative; min-width: 0; min-height: 0; overflow: hidden;
    background: radial-gradient(circle, rgba(0,0,0,.07) 1px, transparent 1.2px) 0 0 / 18px 18px; }
  #out { position: absolute; inset: 60px 16px 48px; display: grid; place-items: center; }
  #out svg { display: block; }
  #err { position: absolute; left: 16px; right: 16px; bottom: 46px; display: none; z-index: 5;
    color: #b3261e; background: #fdecea; border: 1px solid #f3b8b3; border-radius: 8px; padding: 8px 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
  .hint { left: auto; right: 12px; }
  @media (max-width: 640px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 36% 1fr; }
    #pane { border-right: 0; border-bottom: 1px solid var(--line); }
    #src { padding-bottom: 10px; font-size: 12px; }
    .controls { top: calc(36% + 8px); }
    #out { inset: 52px 10px 40px; }
  }
</style>
</head>
<body class="paper">
<div id="app">
  <section id="pane">
    <div class="head"><b>Mermaid 原始碼</b><span id="stat">可直接修改</span></div>
    <textarea id="src" spellcheck="false" wrap="off" aria-label="Mermaid 原始碼"></textarea>
  </section>
  <section id="view">
    <div id="out"></div>
    <div id="err"></div>
  </section>
</div>
<div class="controls">
  <button class="btn" data-k="flow" aria-pressed="true">流程圖</button>
  <button class="btn" data-k="seq" aria-pressed="false">循序圖</button>
  <button class="btn" data-k="gantt" aria-pressed="false">甘特圖</button>
</div>
<div class="hint">改左邊的文字，右邊即時重畫</div>

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist/mermaid.esm.min.mjs";

const SAMPLES = {
  flow: `flowchart TD
  S([新專案開工]) --> Q1{需要 SEO？}
  Q1 -- 需要 --> Q2{團隊熟悉哪個？}
  Q1 -- 不需要 --> Q3{專案規模}
  Q2 -- React --> N[Next.js]
  Q2 -- Vue --> X[Nuxt]
  Q3 -- 大型企業 --> A[Angular]
  Q3 -- 中小型 --> V[Vite + React／Vue]
  Q3 -- 內容網站 --> P[Astro]

  classDef start fill:#fff3b0,stroke:#d4a900,stroke-width:2px
  classDef ask fill:#ffe1ec,stroke:#d61f69
  classDef pick fill:#dff3fb,stroke:#1f8fb8,stroke-width:1.5px
  class S start
  class Q1,Q2,Q3 ask
  class N,X,A,V,P pick`,
  seq: `sequenceDiagram
  autonumber
  actor C as 顧客
  participant S as 網路商店
  participant P as 金流平台
  participant M as 超商門市
  C->>S: 下單，選「超商取貨付款」
  S->>P: 建立交易
  P-->>S: 回傳交易編號
  S->>M: 寄件到指定門市
  Note over M: 到店後發簡訊通知
  M-->>C: 您的包裹已到店
  C->>M: 付款並取貨
  M->>P: 回報已收款
  P-->>S: 撥款（扣手續費）
  S-->>C: 訂單完成，邀請評價`,
  gantt: `gantt
  title 官網改版專案（示意）
  dateFormat YYYY-MM-DD
  axisFormat %m/%d
  todayMarker off
  section 規劃
  需求訪談      :done, a1, 2026-10-05, 5d
  資訊架構      :done, a2, after a1, 4d
  section 設計
  視覺設計      :active, d1, after a2, 8d
  使用者測試    :d2, after d1, 3d
  section 開發
  後端 API      :b1, after a2, 12d
  前端切版      :f1, after d1, 10d
  section 上線
  驗收與修正    :crit, q1, after f1, 5d
  正式上線      :milestone, m1, after q1, 0d`,
};

mermaid.initialize({
  startOnLoad: false,
  securityLevel: "strict",
  theme: "base",
  themeVariables: {
    fontFamily: "Noto Sans TC, Microsoft JhengHei, PingFang TC, sans-serif",
    fontSize: "15px",
    primaryColor: "#fffbe6",
    primaryBorderColor: "#b89500",
    primaryTextColor: "#1c1c1a",
    lineColor: "#6d6b64",
    secondaryColor: "#dff3fb",
    tertiaryColor: "#f6f5f1",
    actorBkg: "#fff3b0",
    actorBorder: "#b89500",
    noteBkgColor: "#e8f7ec",
    noteBorderColor: "#2f9e55",
    signalColor: "#33322e",
    taskBkgColor: "#bfe6f5",
    taskBorderColor: "#1f8fb8",
    activeTaskBkgColor: "#fff3b0",
    activeTaskBorderColor: "#b89500",
    doneTaskBkgColor: "#cfe9d6",
    doneTaskBorderColor: "#2f9e55",
    critBkgColor: "#ffd0e1",
    critBorderColor: "#d61f69",
    sectionBkgColor: "rgba(0,0,0,.035)",
    altSectionBkgColor: "rgba(0,0,0,0)",
    gridColor: "#d9d7cf",
  },
  flowchart: { curve: "basis", nodeSpacing: 30, rankSpacing: 46 },
  sequence: { mirrorActors: false, showSequenceNumbers: true },
  gantt: { useWidth: 660, barHeight: 26, barGap: 6, fontSize: 13, sectionFontSize: 13, leftPadding: 64, rightPadding: 40 },
});

const src = document.getElementById("src");
const out = document.getElementById("out");
const err = document.getElementById("err");
const stat = document.getElementById("stat");
let seq = 0;

// Scale the rendered SVG to the preview box (at most 1.5x so small diagrams stay crisp).
function fit() {
  const svg = out.querySelector("svg");
  if (!svg) return;
  const vb = svg.viewBox.baseVal;
  const box = out.getBoundingClientRect();
  if (!vb || !vb.width || !box.width) return;
  const s = Math.min(box.width / vb.width, box.height / vb.height, 1.5);
  svg.removeAttribute("style");
  svg.setAttribute("width", Math.floor(vb.width * s));
  svg.setAttribute("height", Math.floor(vb.height * s));
}

async function draw() {
  const code = src.value;
  const t0 = performance.now();
  try {
    await mermaid.parse(code);
    const { svg } = await mermaid.render(`mmd${++seq}`, code);
    out.innerHTML = svg;
    fit();
    err.style.display = "none";
    stat.textContent = `已重畫，${Math.round(performance.now() - t0)} 毫秒`;
  } catch (e) {
    // Keep the last good diagram and show the parser message instead.
    err.textContent = `語法錯誤：${String(e.message || e).split("\n").slice(0, 4).join("\n")}`;
    err.style.display = "block";
    stat.textContent = "等待修正語法";
  }
}

let timer;
src.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(draw, 300); });

function load(k) {
  document.querySelectorAll("[data-k]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  src.value = SAMPLES[k];
  draw();
}
document.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => load(b.dataset.k)));
addEventListener("resize", fit);
load("flow");
</script>
</body>
</html>
