  actorBkg: "#fff3b0", actorBorder: "#b89500", noteBkgColor: "#e8f7ec", noteBorderColor: "#2f9e55", signalColor: "#33322e",

  doneTaskBkgColor: "#cfe9d6", doneTaskBorderColor: "#2f9e55", critBkgColor: "#ffd0e1", critBorderColor: "#d61f69",

  clusterBkg: "#1b1e24", clusterBorder: "#3a3d45", edgeLabelBackground: "#171a1f", titleColor: "#ecebe6",
};
const BASE = {
  startOnLoad: false, suppressErrorRendering: true, securityLevel: "strict",
  theme: "base", themeVariables: WARM,
  flowchart: { curve: "basis", nodeSpacing: 30, rankSpacing: 46 },
  sequence: { mirrorActors: false, showSequenceNumbers: true },
  gantt: { useWidth: 660, barHeight: 26, barGap: 6, fontSize: 13, sectionFontSize: 13, leftPadding: 64, rightPadding: 40 },
};
// initialize() resets the site config to defaults first, so each scene states its full config.
const setup = (extra = {}) => mermaid.initialize({ ...BASE, ...extra });

let uid = 0;
async function render(box, code) {
  const { svg, bindFunctions } = await mermaid.render(`mmd-${++uid}`, code);
  box.innerHTML = svg;
  bindFunctions?.(box);
  return box.querySelector("svg");
}
// Scale the rendered SVG to its box (capped so small diagrams stay crisp).
function fit(box, max = 1.5) {
  const svg = box.querySelector("svg");
  const vb = svg?.viewBox.baseVal;
  const w = box.clientWidth, hh = box.clientHeight;
  if (!vb || !vb.width || !w || !hh) return;
  const s = Math.min(w / vb.width, hh / vb.height, max);
  svg.removeAttribute("style");
  svg.setAttribute("width", Math.floor(vb.width * s));
  svg.setAttribute("height", Math.floor(vb.height * s));
}
const errText = (e) => String(e?.message || e).split("\n").slice(0, 4).join("\n");
const showErr = (box, e) => box.replaceChildren(h("div", { class: "mmd-err", text: `語法錯誤：${errText(e)}` }));

// Parallel lanes with cross links: keeps the result roughly square at any size.
function bigFlow(n, layout) {
  const lanes = Math.max(2, Math.round(Math.sqrt(n) * 1.2));
  const lines = [`---\nconfig:\n  layout: ${layout}\n---\nflowchart LR`];
  let edges = 0;
  for (let i = 0; i < n; i++) {
    lines.push(`  n${i}[節點 ${i}]`);
    if (i >= lanes) { lines.push(`  n${i - lanes} --> n${i}`); edges++; }
    if (i >= lanes && i % 3 === 0 && i % lanes !== lanes - 1 && i + 1 < n) { lines.push(`  n${i - lanes} -.-> n${i + 1}`); edges++; }
  }
  return { code: lines.join("\n"), edges };
}

function downloadSvg(ctx, svg, name) {
  const xml = new XMLSerializer().serializeToString(svg);
  const url = URL.createObjectURL(new Blob([xml], { type: "image/svg+xml" }));
  const a = h("a", { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  ctx.onCleanup(() => URL.revokeObjectURL(url));
  ctx.timeout(() => URL.revokeObjectURL(url), 1500);
}
