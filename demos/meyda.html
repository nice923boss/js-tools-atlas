<script src="https://cdn.jsdelivr.net/npm/meyda@5.6.3/dist/web/meyda.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
(() => {
const { fmt, fmtMs, fmtCompact } = Showcase;
const css = getComputedStyle(document.documentElement);
const FONT = css.getPropertyValue("--font").trim() || "sans-serif";
const MONO = css.getPropertyValue("--mono").trim() || "monospace";
const SR = 44100;
const NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const STOPS = [[14, 16, 30], [70, 40, 140], [200, 50, 140], [255, 140, 66], [247, 223, 30]];
// spectralFlux is listed by Meyda 5.6.3 but throws without a previous frame, so it stays out of every set.
const ALL = Meyda.listAvailableFeatureExtractors().filter((f) => f !== "spectralFlux");
const VOWELS = { a: [800, 1150, 2900], i: [270, 2300, 3000], u: [325, 700, 2530], e: [400, 2000, 2550], o: [450, 800, 2830] };

// ---------- drawing helpers ----------
function cmap(v) {
  v = Math.max(0, Math.min(1, v || 0)) * (STOPS.length - 1);
  const i = Math.min(STOPS.length - 2, Math.floor(v)), f = v - i;
  return STOPS[i].map((c, k) => Math.round(c + (STOPS[i + 1][k] - c) * f));
}
function fitCanvas(cv) {
  const dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  return { g, W, H };
}
// cols x rows heat map (row 0 at the bottom) painted once into a small canvas, later stretched with blit().
function heatCanvas(cols, rows, val) {
  const c = document.createElement("canvas"); c.width = cols; c.height = rows;
  const g = c.getContext("2d"), img = g.createImageData(cols, rows);
  for (let x = 0; x < cols; x++) for (let y = 0; y < rows; y++) {
    const p = cmap(val(x, y)), i = ((rows - 1 - y) * cols + x) * 4;
    img.data[i] = p[0]; img.data[i + 1] = p[1]; img.data[i + 2] = p[2]; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}
function blit(g, src, x, y, w, h) { g.imageSmoothingEnabled = false; g.drawImage(src, x, y, w, h); g.imageSmoothingEnabled = true; }
function text(g, s, x, y, { size = 11, color = "rgba(236,235,230,.72)", align = "left", base = "middle", mono = false, bold = false } = {}) {
  g.font = `${bold ? "600 " : ""}${size}px ${mono ? MONO : FONT}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y);
}
const fmtHz = (f) => (f >= 1000 ? `${fmt(f / 1000, f >= 10000 ? 1 : 2)} kHz` : `${fmt(f)} Hz`);
const clamp01 = (v) => Math.max(0, Math.min(1, v || 0));
// Rows of label / bar / value inside a .md-vals box; returns set(i, fraction, text, highlight).
function meters(el, labels) {
  el.innerHTML = labels.map((l) => `<span>${l}</span><i><b></b></i><em>…</em>`).join("");
  const sp = [...el.querySelectorAll("span")], bs = [...el.querySelectorAll("b")], es = [...el.querySelectorAll("em")];
  return (i, frac, txt, on = false) => { bs[i].style.width = `${clamp01(frac) * 100}%`; es[i].textContent = txt; sp[i].classList.toggle("on", on); };
}

// ---------- signals ----------
const tone = (f, len, a = 0.5) => Float32Array.from({ length: len }, (_, i) => a * Math.sin((2 * Math.PI * f * i) / SR));
function noise(len, pink = false) {
  const d = new Float32Array(len); let b0 = 0, b1 = 0, b2 = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (!pink) { d[i] = w * 0.5; continue; }
    b0 = 0.99765 * b0 + w * 0.099046; b1 = 0.963 * b1 + w * 0.2965164; b2 = 0.57 * b2 + w * 1.0526913;
    d[i] = (b0 + b1 + b2 + w * 0.1848) * 0.1;
  }
  return d;
}
function norm(d, rms) { const r = Math.sqrt(d.reduce((s, v) => s + v * v, 0) / d.length) || 1; return d.map((v) => (v * rms) / r); }
function bufferOf(ac, data) { const b = ac.createBuffer(1, data.length, SR); b.copyToChannel(data, 0); return b; }
function loopSource(ac, buf, dest) { const s = ac.createBufferSource(); s.buffer = buf; s.loop = true; s.connect(dest); s.start(); return s; }
// Render a graph built by build(ctx, destination) offline, so every scene has numbers before any sound plays.
async function render(build, sec) {
  const oc = new OfflineAudioContext(1, Math.round(SR * sec), SR);
  build(oc, oc.destination);
  return (await oc.startRendering()).getChannelData(0);
}
function formants(ac, src, out, fs, gains = [4, 2, 1.2]) {
  return fs.map((f, k) => {
    const bp = ac.createBiquadFilter(), g = ac.createGain();
    bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = 5 + 3 * k; g.gain.value = gains[k];
    src.connect(bp).connect(g).connect(out);
    return bp;
  });
}

// ---------- Meyda plumbing ----------
// Meyda keeps filter banks on its global object and only rebuilds the chroma bank when chromaBands changes,
// so drop every cached bank whenever bufferSize or sampleRate move.
function cfg(N, sr = SR, win = "hanning") {
  if (Meyda.bufferSize !== N || Meyda.sampleRate !== sr) Meyda.barkScale = Meyda.melFilterBank = Meyda.chromaFilterBank = undefined;
  Meyda.bufferSize = N; Meyda.sampleRate = sr; Meyda.windowingFunction = win;
}
// MeydaAnalyzer writes its options onto the global Meyda and stop() only flips a flag,
// so the ScriptProcessor it creates has to be detached by hand.
function analyzer(ac, source, N, feats, cb, win = "hanning") {
  cfg(N, ac.sampleRate, win);
  const an = Meyda.createMeydaAnalyzer({ audioContext: ac, source, bufferSize: N, windowingFunction: win, featureExtractors: feats, callback: cb });
  const spn = an._m.spn;
  an.start();
  return () => { an.stop(); spn.onaudioprocess = null; spn.disconnect(); try { source.disconnect(spn); } catch (e) { /* already detached */ } };
}
// Running blend of feature objects (numbers, arrays, nested objects); non-finite values never poison the average.
function mix(prev, f, k) {
  if (prev == null) return f;
  if (typeof f === "number") return !isFinite(prev) ? f : !isFinite(f) ? prev : prev * k + f * (1 - k);
  if (f && f.length !== undefined) return Array.from(f, (v, i) => mix(prev[i], v, k));
  if (f && typeof f === "object") { const o = {}; for (const key in f) o[key] = mix(prev[key], f[key], k); return o; }
  return f;
}
function avgExtract(data, N, feats, count = 6, win = "hanning") {
  cfg(N, SR, win);
  let acc = null;
  for (let k = 0; k < count; k++) acc = mix(acc, Meyda.extract(feats, data.subarray((k * N) / 2, (k * N) / 2 + N)), k / (k + 1));
  return acc;
}

// ---------- audio lifecycle ----------
let AC = null;
async function wake() { AC = AC || new AudioContext(); if (AC.state !== "running") await AC.resume(); return AC; }
// Primary play/stop button for one scene. start(ac) builds the graph and returns its teardown.
function transport(ctx, start, label = "▶ 播放") {
  let stop = null, busy = false;
  const btn = ctx.button(label, async () => {
    if (busy) return;
    if (stop) return halt();
    busy = true; btn.disabled = true;
    try {
      const ac = await wake();
      const s = ctx.active ? await start(ac) : null;
      if (!ctx.active) { if (s) s(); return; }
      if (s) { stop = s; btn.textContent = "■ 停止"; }
    } catch (e) { console.error(e); ctx.hint(`無法啟動音訊：${e.message}`); } finally { busy = false; btn.disabled = false; }
  }, { primary: true });
  function halt() { if (stop) { const s = stop; stop = null; s(); } btn.textContent = label; if (AC && AC.state === "running") AC.suspend(); }
  ctx.onCleanup(halt);
  return { get on() { return !!stop; }, async restart() { if (!stop) return; const s = stop; stop = null; s(); stop = await start(AC); } };
}

// ---------- scene 1 data: loop.mp3 analysed once, cached across visits ----------
const N1 = 4096, HOP = 2048, BAR = 2.4, F1 = ["chroma", "mfcc", "rms", "spectralCentroid", "spectralFlatness", "zcr"];
let song = null, songJob = null, songProgress = () => {};
// Cosine match of a chroma vector against the 24 major / minor triads, best first.
function triads(c) {
  const den = Math.hypot(...c) * Math.sqrt(3) || 1, out = [];
  for (let r = 0; r < 12; r++) for (const [t, s] of [[4, ""], [3, "m"]]) {
    const notes = [r, (r + t) % 12, (r + 7) % 12];
    out.push({ name: NOTES[r] + s, notes, s: (c[notes[0]] + c[notes[1]] + c[notes[2]]) / den });
  }
  return out.sort((a, b) => b.s - a.s);
}
function loadSong() {
  songJob = songJob || (async () => {
    const raw = await (await fetch("_shared/audio/loop.mp3")).arrayBuffer();
    const buf = await new OfflineAudioContext(1, SR, SR).decodeAudioData(raw);
    const mono = new Float32Array(buf.length);
    for (let c = 0; c < buf.numberOfChannels; c++) buf.getChannelData(c).forEach((v, i) => (mono[i] += v / buf.numberOfChannels));
    const frames = [], total = Math.floor((mono.length - N1) / HOP);
    for (let k = 0; k <= total; k++) {
      cfg(N1);
      frames.push(Meyda.extract(F1, mono.subarray(k * HOP, k * HOP + N1)));
      if (k % 40 === 0) { songProgress(k / total); await new Promise((z) => setTimeout(z, 0)); }
    }
    const fps = SR / HOP, chords = [], bars = Math.round(frames.length / fps / BAR);
    for (let b = 0; b < bars; b++) {
      const mean = new Array(12).fill(0);
      for (let f = Math.floor(b * BAR * fps); f < Math.min(frames.length, Math.floor((b + 1) * BAR * fps)); f++) frames[f].chroma.forEach((v, i) => (mean[i] += v));
      chords.push(triads(mean)[0].name);
    }
    const mu = [], sd = [];
    for (let c = 1; c <= 12; c++) {
      const xs = frames.map((f) => f.mfcc[c]), m = xs.reduce((s, v) => s + v, 0) / xs.length;
      mu.push(m); sd.push(Math.sqrt(xs.reduce((s, v) => s + (v - m) ** 2, 0) / xs.length) || 1);
    }
    return (song = {
      buf, dur: buf.duration, frames, chords, maxRms: Math.max(...frames.map((f) => f.rms)),
      chromaImg: heatCanvas(frames.length, 12, (x, y) => Math.pow(frames[x].chroma[y], 1.6)),
      mfccImg: heatCanvas(frames.length, 12, (x, y) => 0.5 + (frames[x].mfcc[y + 1] - mu[y]) / sd[y] / 4),
    });
  })().catch((e) => { songJob = null; throw e; });
  return songJob;
}
function drawWheel(cv, chroma, hi) {
  const { g, W, H } = fitCanvas(cv);
  const cx = W / 2, cy = H / 2 + 9, R = Math.max(10, Math.min(W, H - 18) / 2 - 18), mx = Math.max(1e-6, ...chroma);
  const pt = (i, r) => [cx + Math.cos((i / 12) * 2 * Math.PI - Math.PI / 2) * r, cy + Math.sin((i / 12) * 2 * Math.PI - Math.PI / 2) * r];
  g.strokeStyle = "rgba(255,255,255,.1)";
  for (const f of [0.5, 1]) { g.beginPath(); g.arc(cx, cy, R * f, 0, 2 * Math.PI); g.stroke(); }
  g.beginPath(); hi.forEach((n, j) => { const [x, y] = pt(n, R); j ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath();
  g.strokeStyle = "rgba(247,223,30,.55)"; g.setLineDash([4, 4]); g.stroke(); g.setLineDash([]);
  g.beginPath(); chroma.forEach((v, i) => { const [x, y] = pt(i, (R * v) / mx); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.closePath();
  g.fillStyle = "rgba(76,201,240,.28)"; g.fill(); g.strokeStyle = "#4cc9f0"; g.lineWidth = 1.5; g.stroke(); g.lineWidth = 1;
  NOTES.forEach((nm, i) => { const [x, y] = pt(i, R + 11); text(g, nm, x, y, { size: 10.5, mono: true, align: "center", color: hi.includes(i) ? "#f7df1e" : "rgba(236,235,230,.6)", bold: hi.includes(i) }); });
}

// ---------- synth builders shared by several scenes ----------
const WAVES = [["sine", "正弦"], ["triangle", "三角"], ["sawtooth", "鋸齒"], ["square", "方波"]];
function shapeGraph(ac, dest, s) {
  const o = ac.createOscillator(), og = ac.createGain(), nz = ac.createBufferSource(), ng = ac.createGain(), lp = ac.createBiquadFilter(), out = ac.createGain();
  o.frequency.value = 220; nz.buffer = bufferOf(ac, noise(SR)); nz.loop = true; lp.Q.value = 0.7; out.gain.value = 0.45;
  o.connect(og).connect(lp); nz.connect(ng).connect(lp); lp.connect(out).connect(dest);
  let first = true;
  const at = (p, v) => (first ? (p.value = v) : p.setTargetAtTime(v, ac.currentTime, 0.03));
  const set = (st) => { o.type = st.wave; at(lp.frequency, st.cut); at(og.gain, 1 - st.noise); at(ng.gain, 1.2 * st.noise); first = false; };
  set(s); o.start(); nz.start();
  return { out, set, stop() { o.stop(); nz.stop(); out.disconnect(); } };
}
const TIM = [["sine", "正弦"], ["triangle", "三角"], ["sawtooth", "鋸齒"], ["square", "方波"], ["noise", "噪音"], ["a", "母音 a"], ["i", "母音 i"], ["u", "母音 u"]];
function timbre(ac, dest, kind, f0) {
  const out = ac.createGain(); out.gain.value = 0.35; out.connect(dest);
  let src;
  if (kind === "noise") { src = ac.createBufferSource(); src.buffer = bufferOf(ac, noise(SR)); src.loop = true; src.connect(out); }
  else {
    src = ac.createOscillator(); src.type = VOWELS[kind] ? "sawtooth" : kind; src.frequency.value = f0;
    if (VOWELS[kind]) formants(ac, src, out, VOWELS[kind]); else src.connect(out);
  }
  src.start();
  return { out, pitch: (f) => src.frequency && src.frequency.setTargetAtTime(f, ac.currentTime, 0.03), stop() { src.stop(); out.disconnect(); } };
}
// Eight syllables of a formant "voice" with sibilant bursts, rendered once and looped as the microphone fallback.
function speech(ac, dest) {
  const SYL = [["s", "a"], ["", "i"], ["sh", "u"], ["", "e"], ["", "o"], ["s", "i"], ["", "a"], ["sh", "u"]];
  const src = ac.createOscillator(), vib = ac.createOscillator(), vg = ac.createGain(), amp = ac.createGain();
  src.type = "sawtooth"; vib.frequency.value = 5.5; vg.gain.value = 3; amp.gain.value = 0;
  vib.connect(vg).connect(src.frequency); amp.connect(dest);
  const bps = formants(ac, src, amp, VOWELS.a, [5, 2.5, 1.4]);
  const nz = ac.createBufferSource(), hp = ac.createBiquadFilter(), ng = ac.createGain();
  nz.buffer = bufferOf(ac, noise(SR)); nz.loop = true; hp.type = "highpass"; ng.gain.value = 0;
  nz.connect(hp).connect(ng).connect(dest);
  SYL.forEach(([fr, v], i) => {
    const t = i * 0.6, tv = t + (fr ? 0.16 : 0.02);
    if (fr) {
      hp.frequency.setValueAtTime(fr === "s" ? 5000 : 2600, t);
      ng.gain.setValueAtTime(0, t); ng.gain.linearRampToValueAtTime(0.5, t + 0.05); ng.gain.linearRampToValueAtTime(0, t + 0.16);
    }
    VOWELS[v].forEach((f, k) => bps[k].frequency.setValueAtTime(f, tv));
    src.frequency.setValueAtTime(135 + 35 * Math.sin(i * 1.7), tv); src.frequency.linearRampToValueAtTime(115 + 30 * Math.sin(i * 1.7), tv + 0.38);
    amp.gain.setValueAtTime(0, tv); amp.gain.linearRampToValueAtTime(0.55, tv + 0.05); amp.gain.setValueAtTime(0.55, tv + 0.3); amp.gain.linearRampToValueAtTime(0, tv + 0.4);
  });
  src.start(); vib.start(); nz.start();
}
let prints = null, voiceJob = null;

Showcase.run({ scenes: [
  {
    id: "chroma", title: "色度與和弦",
    api: "Meyda.extract(['chroma','mfcc','rms',…], frame)・createMeydaAnalyzer",
    desc: "先離線逐格分析整段 loop.mp3：上排是 12 個半音的色度圖，中間是 MFCC 音色變化，底下是音量。每 2.4 秒取平均色度，與 24 個大小三和弦做餘弦比對得出和弦名稱。播放時改用 MeydaAnalyzer 即時算色度，右側列出最像的三個和弦。",
    hint: "按「播放」聽音樂看即時色度；滑過圖可看該時刻特徵，點一下跳到該處",
    async mount(ctx) {
      ctx.html(`<div class="board"><div class="md-split"><div class="md-panel"><canvas data-chart></canvas></div>
        <div class="md-side md-row"><div class="md-panel md-grow"><canvas data-wheel></canvas><span class="md-tag" data-tag>色度輪</span></div><div class="md-vals" data-vals></div></div></div></div>`);
      const chart = ctx.$("[data-chart]"), wheel = ctx.$("[data-wheel]"), tag = ctx.$("[data-tag]");
      const set = meters(ctx.$("[data-vals]"), ["第 1 名", "第 2 名", "第 3 名", "音量 RMS", "頻譜質心", "平坦度", "過零率"]);
      let S = song, hover = -1, offset = 0, t0 = 0, live = null;
      const tp = transport(ctx, async (ac) => {
        S = await loadSong();
        const src = ac.createBufferSource(); src.buffer = S.buf; src.loop = true; src.connect(ac.destination);
        src.start(0, offset); t0 = ac.currentTime - offset;
        const off = analyzer(ac, src, N1, ["chroma", "rms", "spectralCentroid", "spectralFlatness", "zcr"], (f) => (live = mix(live, { ...f, sr: ac.sampleRate }, 0.6)));
        return () => { offset = (ac.currentTime - t0) % S.dur; off(); src.stop(); src.disconnect(); live = null; };

        <div class="md-side"><div class="md-vals" data-vals></div><div class="md-msg"><b>分得開</b>：兩個峰至少相隔兩個 bin，中間凹陷 3 dB 以上。<b>看得見</b>：1200 Hz 那一格要比「拿掉弱音」時的同一格高 6 dB 以上，也就是高過強音洩漏過來的能量。黃格取整秒訊號 8 個位置的平均，避免兩個強音的拍頻造成假凹陷。</div></div></div></div>`);
      const wave = (weak) => new Float32Array(SR).map((_, i) => 0.42 * Math.sin((2 * Math.PI * 440 * i) / SR) + 0.42 * Math.sin((2 * Math.PI * 466 * i) / SR) + weak * Math.sin((2 * Math.PI * 1200 * i) / SR));
      const SIG = wave(0.00042), REF = wave(0);
      const WINS = [["rect", "矩形"], ["hanning", "Hann"], ["hamming", "Hamming"], ["blackman", "Blackman"], ["sine", "正弦"]];
      const cv = ctx.$("canvas"), tag = ctx.$("[data-tag]");
      const set = meters(ctx.$("[data-vals]"), ["頻率解析度", "每幀時長", "每秒幀數", "440／466 Hz", "1200 Hz 弱音", "即時回呼"]);
      let N = 2048, win = "hanning", spec = null, vd = null, liveSp = null, liveSr = SR, calls = 0, rate = 0, again = null;
      // Magnitude spectra averaged over 8 frames spread across the second, so the 26 Hz beating cannot fake a dip.
      const avgSpec = (x) => { let acc = null; for (let k = 0; k < 8; k++) { const o = Math.round((k * (SR - N)) / 7); acc = mix(acc, Meyda.extract("amplitudeSpectrum", x.subarray(o, o + N)), k / (k + 1)); } return acc; };
      const offline = () => { cfg(N, SR, win); spec = avgSpec(SIG); vd = verdict(spec, avgSpec(REF), SR / N); };
      const tp = transport(ctx, (ac) => {
        const gn = ac.createGain(); gn.gain.value = 0.3; gn.connect(ac.destination);
        const src = loopSource(ac, bufferOf(ac, SIG), gn), cb = (f) => { liveSp = f.amplitudeSpectrum; liveSr = ac.sampleRate; calls++; };
        let off = analyzer(ac, src, N, ["amplitudeSpectrum"], cb, win);
        again = () => { off(); liveSp = null; offline(); off = analyzer(ac, src, N, ["amplitudeSpectrum"], cb, win); };
        return () => { off(); src.stop(); gn.disconnect(); liveSp = null; again = null; };
      });
      const change = () => (again ? again() : offline());
      ctx.select("bufferSize", [256, 512, 1024, 2048, 4096, 8192, 16384].map((v) => ({ value: v, label: String(v) })), N, (v) => { N = +v; change(); });
      ctx.group(WINS.map((w) => w[1]), 1, (i) => { win = WINS[i][0]; change(); });
      ctx.interval(() => { rate = calls; calls = 0; }, 1000);
      offline();
      const F0 = 300, F1 = 1400;
      function verdict(sp, ref, bw) {
        const mx = Math.max(...sp) || 1, db = (s, k) => 20 * Math.log10(s[k] / mx + 1e-12);
        const peak = (f) => { const k = Math.round(f / bw); let b = k; for (let j = k - 1; j <= k + 1; j++) if (sp[j] > sp[b]) b = j; return b; };
        const a = peak(440), b = peak(466), w = Math.round(1200 / bw), lift = db(sp, w) - db(ref, w);
        let dip = Infinity; for (let k = a + 1; k < b; k++) dip = Math.min(dip, db(sp, k));
        return { split: b - a >= 2 && dip < Math.min(db(sp, a), db(sp, b)) - 3, seen: lift > 6, lift };
      }
      ctx.raf(() => {
        const { g, W, H } = fitCanvas(cv);
        const T = 30, B = H - 20, xOf = (f) => ((f - F0) / (F1 - F0)) * W, yOf = (d) => T + clamp01(-d / 100) * (B - T);
        for (const d of [0, -20, -40, -60, -80]) { g.fillStyle = "rgba(255,255,255,.07)"; g.fillRect(0, yOf(d), W, 1); text(g, `${d} dB`, W - 4, yOf(d) - 6, { size: 10, mono: true, align: "right", color: "rgba(236,235,230,.45)" }); }
        const bw = SR / N, mx = Math.max(...spec) || 1;
        g.fillStyle = "rgba(247,223,30,.6)";
        for (let k = Math.floor(F0 / bw); k <= Math.ceil(F1 / bw) && k < spec.length; k++) {
          const y = yOf(20 * Math.log10(spec[k] / mx + 1e-12)), x0 = xOf((k - 0.5) * bw), x1 = xOf((k + 0.5) * bw);
          g.fillRect(x0 + (x1 - x0 > 4 ? 1 : 0), y, Math.max(1, x1 - x0 - (x1 - x0 > 4 ? 2 : 0)), B - y);
        }
        if (liveSp) {
          const lb = liveSr / N, lm = Math.max(...liveSp) || 1;
          g.beginPath(); g.strokeStyle = "#4cc9f0"; g.lineWidth = 1.5;
          for (let k = Math.floor(F0 / lb); k <= F1 / lb && k < liveSp.length; k++) (k === Math.floor(F0 / lb) ? g.moveTo : g.lineTo).call(g, xOf(k * lb), yOf(20 * Math.log10(liveSp[k] / lm + 1e-12)));
          g.stroke(); g.lineWidth = 1;
        }
        [[440, "440"], [466, "466"], [1200, "1200 Hz（−60 dB）"]].forEach(([f, l], i) => {
          g.fillStyle = "rgba(247,37,133,.7)"; g.fillRect(xOf(f), T - 4, 1, B - T + 4);
          const left = i === 0 || xOf(f) > W - 120;
          text(g, l, xOf(f) + (left ? -4 : 4), B + 10, { size: 10.5, mono: true, align: left ? "right" : "left", color: "#f72585" });
        });
        const wv = Meyda.windowing(new Float32Array(64).fill(1), win), wx = W - 130, wy = T + 10;
        g.fillStyle = "rgba(15,17,21,.7)"; g.fillRect(wx - 6, wy - 4, 124, 58);
        g.beginPath(); wv.forEach((v, i) => (i ? g.lineTo : g.moveTo).call(g, wx + (i / 63) * 112, wy + 46 - v * 42)); g.strokeStyle = "#7bd389"; g.stroke();
        text(g, "窗形狀", wx, wy + 4, { size: 10.5, color: "#7bd389" });
        const v = vd, fps = SR / N;
        set(0, 1 - Math.log2(bw / 2.5) / 7, `${fmt(bw, bw < 10 ? 2 : 1)} Hz`); set(1, Math.log2(N / 128) / 7, fmtMs((N / SR) * 1000));
        set(2, fps / 172, `${fmt(fps, 1)} 幀`); set(3, v.split ? 1 : 0, v.split ? "分得開" : "分不開", v.split);
        set(4, v.seen ? 1 : 0, v.seen ? `看得見（高出洩漏 ${fmt(v.lift, 0)} dB）` : "被洩漏淹沒", v.seen);
        set(5, rate / 172, tp.on ? `${rate} 次/秒` : "未播放");
        tag.textContent = `黃格：離線 amplitudeSpectrum（N=${N}，${WINS.find((w) => w[0] === win)[1]} 窗，8 幀平均）${liveSp ? "・藍線：即時單幀" : ""}`;
      });
    },
  },
  {
    id: "mic", title: "麥克風即時分析",
    api: "getUserMedia → createMediaStreamSource → createMeydaAnalyzer({ featureExtractors: ['melBands','rms','zcr',…] })",
    desc: "把麥克風接進 MeydaAnalyzer，每 1024 個樣本算一次 26 個梅爾頻帶、音量、過零率與頻譜質心，畫成捲動的梅爾頻譜。右側用很簡單的規則判斷靜音、有聲（母音）或擦音。沒有麥克風或拒絕權限時，改用頁內合成的人聲。",
    hint: "按「開始」並允許麥克風；說「ㄙ」與「啊」比較過零率的差別",
    async mount(ctx) {
      ctx.html(`<div class="board"><div class="md-split"><div class="md-panel"><canvas></canvas><span class="md-tag" data-tag>梅爾頻譜（melBands）・黃線音量・藍線過零率</span></div>
        <div class="md-side"><div class="md-vals" data-vals></div><div class="md-msg" data-msg>畫面先顯示合成人聲的離線分析。按「開始」後瀏覽器會詢問麥克風權限；麥克風的聲音只做分析，不會從喇叭播出。</div></div></div></div>`);
      const cv = ctx.$("canvas"), msg = ctx.$("[data-msg]");
      const set = meters(ctx.$("[data-vals]"), ["音量", "頻譜質心", "過零率", "判斷", "來源"]);
      const COLS = 360, F = ["melBands", "rms", "zcr", "spectralCentroid"], spec = document.createElement("canvas");
      spec.width = COLS; spec.height = 26;
      const sg = spec.getContext("2d"), rmsH = [], zcrH = [];
      let peak = 1e-9, cur = null, mode = 0, from = "合成人聲（離線）";
      function push(f, sr) {
        peak = Math.max(peak * 0.999, ...f.melBands);
        sg.drawImage(spec, -1, 0);
        const col = sg.createImageData(1, 26);
        f.melBands.forEach((v, i) => { const p = cmap((10 * Math.log10(v / peak + 1e-12) + 45) / 45), j = (25 - i) * 4; col.data[j] = p[0]; col.data[j + 1] = p[1]; col.data[j + 2] = p[2]; col.data[j + 3] = 255; });
        sg.putImageData(col, COLS - 1, 0);
        rmsH.push(f.rms); zcrH.push((f.zcr * sr) / 1024);
        if (rmsH.length > COLS) { rmsH.shift(); zcrH.shift(); }
        cur = { ...f, sr };
      }
      const tp = transport(ctx, async (ac) => {
        let node = null, stream = null, kill = null;
        if (mode === 0) {
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
            node = ac.createMediaStreamSource(stream); from = "麥克風";
            msg.innerHTML = "<b>麥克風已開啟。</b>對著麥克風說話、吹氣或彈指，看梅爾頻譜與判斷結果。聲音不會從喇叭播出。";
          } catch (e) { msg.innerHTML = `<span class="warn">未取得麥克風（${e.name || e.message}），改用合成人聲。</span>`; }
        }
        if (!node) {
          node = loopSource(ac, bufferOf(ac, await voiceJob), ac.destination); kill = () => node.stop(); from = "合成人聲";
          if (mode === 1) msg.innerHTML = "<b>播放合成人聲：</b>鋸齒波經過三個共振峰濾波器組成母音，夾雜高通噪音模擬「ㄙ」「ㄕ」。";
        }
        const off = analyzer(ac, node, 1024, F, (f) => push(f, ac.sampleRate));
        return () => { off(); if (kill) kill(); node.disconnect(); if (stream) stream.getTracks().forEach((t) => t.stop()); from = `${from}（已停止）`; };
      }, "▶ 開始");
      ctx.group(["麥克風", "合成人聲"], 0, (i) => { mode = i; tp.restart(); });
      ctx.raf(() => {
        const { g, W, H } = fitCanvas(cv);
        const T = 28, hS = (H - T) * 0.64, yL = T + hS + 8, hL = H - yL - 8;
        blit(g, spec, 0, T, W, hS);
        text(g, "高", 6, T + 8, { size: 10 }); text(g, "低", 6, T + hS - 8, { size: 10 });
        g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(0, yL, W, hL);
        const off = COLS - rmsH.length;
        [[rmsH, (v) => (20 * Math.log10(v + 1e-6) + 60) / 60, "#f7df1e"], [zcrH, (v) => v / 10000, "#4cc9f0"]].forEach(([arr, f, c]) => {
          g.beginPath(); arr.forEach((v, i) => (i ? g.lineTo : g.moveTo).call(g, ((off + i) / (COLS - 1)) * W, yL + hL - clamp01(f(v)) * hL)); g.strokeStyle = c; g.lineWidth = 1.5; g.stroke(); g.lineWidth = 1;
        });
        if (!cur) return;
        const db = 20 * Math.log10(cur.rms + 1e-6), cen = (cur.spectralCentroid * cur.sr) / 1024, zr = (cur.zcr * cur.sr) / 1024;
        const state = cur.rms < 0.01 ? "靜音" : zr > 3000 && cen > 2500 ? "擦音／氣音" : "有聲（母音）";
        set(0, (db + 60) / 60, `${fmt(db, 1)} dBFS`); set(1, Math.log(Math.max(cen, 50) / 50) / Math.log(200), isFinite(cen) ? fmtHz(cen) : "無訊號");
        set(2, zr / 10000, `${fmtCompact(zr)}/秒`); set(3, state === "靜音" ? 0 : 1, state, state !== "靜音"); set(4, tp.on ? 1 : 0, from);
      });
      // Normalise the rendered voice to a 0.7 peak; the stacked formant gains can otherwise push it to full scale.
      voiceJob = voiceJob || render(speech, 4.8).then((d) => { const m = d.reduce((s, v) => Math.max(s, Math.abs(v)), 0) || 1; return d.map((v) => (v * 0.7) / m); });
      const data = await voiceJob;
      if (!ctx.active || tp.on) return;
      cfg(1024);
      for (let k = 0; k + 1024 <= data.length && k < 512 * 400; k += 512) push(Meyda.extract(F, data.subarray(k, k + 1024)), SR);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "Meyda.extract(features, frame) 逐幀計算",
    desc: "模擬同時分析很多聲道：每個聲道是 1 秒的音訊，以半個 bufferSize 為步距逐幀呼叫 Meyda.extract。全部聲道在 1 秒內算完就代表跟得上即時。上方是每個特徵在一幀上的額外成本，下方疊加每次測試的曲線。",
    hint: "選 bufferSize 與特徵組合後按「開始測試」；換設定再測一次可疊加比較",
    mount(ctx) {
      ctx.html(`<div class="md-stress"><div class="md-head"><b>特徵成本與聲道數（只計算，不發聲）</b><small data-sub>準備中…</small></div><div class="md-panel md-grow"><canvas></canvas></div></div>`);
      const cv = ctx.$("canvas"), sub = ctx.$("[data-sub]"), SRC = noise(SR * 2).map((v, i) => v * 0.3 + 0.4 * Math.sin(i * 0.0627));
      const SETS = [["輕量 3 項", ["rms", "zcr", "energy"]], ["頻譜 8 項", ["rms", "zcr", "spectralCentroid", "spectralFlatness", "spectralRolloff", "spectralSpread", "spectralCrest", "loudness"]], [`全部 ${ALL.length} 項`, ALL]];
      const COL = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389"];
      let N = 1024, si = 2, costs = [], base = 0, series = [], curS = null;
      function measureCosts() {
        cfg(N); const fr = SRC.subarray(0, N);
        const time = (f) => { Meyda.extract(f, fr); let k = 0; const t0 = performance.now(); do { Meyda.extract(f, fr); k++; } while (performance.now() - t0 < 5); return (performance.now() - t0) / k; };
        base = time("buffer");
        costs = ALL.filter((f) => f !== "buffer").map((f) => ({ f, ms: Math.max(0, time(f) - base) })).sort((a, b) => b.ms - a.ms);
        const tot = costs.reduce((s, c) => s + c.ms, 0) + base;
        sub.innerHTML = `N=<span class="md-m">${N}</span>：基本開銷 <span class="md-m">${fmtMs(base)}</span>，全部特徵合計約 <span class="md-m">${fmtMs(tot)}</span>／幀；步距 ${N / 2} 樣本時單聲道即時倍率約 <span class="md-m">${fmt((N / 2 / SR) * 1000 / tot, 0)}</span>×`;
        draw();
      }
      function draw() {
        const { g, W, H } = fitCanvas(cv);
        const hT = Math.min(H * 0.46, 250), rows = [{ f: "基本開銷（buffer）", ms: base }, ...costs.slice(0, 8)], rh = (hT - 26) / rows.length, mx = Math.max(...rows.map((r) => r.ms)) || 1;
        text(g, `每幀成本（N=${N}，扣除基本開銷後的前 8 名）`, 10, 13, { size: 11.5, color: "rgba(236,235,230,.85)" });
        rows.forEach((r, i) => {
          const y = 24 + i * rh, w = (r.ms / mx) * (W - 230);
          text(g, r.f, 150, y + rh / 2, { size: 10.5, mono: true, align: "right" });
          g.fillStyle = i ? "#4cc9f0" : "#ff8c42"; g.fillRect(156, y + 2, Math.max(1, w), Math.max(2, rh - 4));
          text(g, fmtMs(r.ms), 162 + w, y + rh / 2, { size: 10, mono: true });
        });
        const L = 44, T = hT + 26, B = H - 22, R = W - 12, ns = [1, 4, 16, 64, 256];
        const xOf = (n) => L + (Math.log(n) / Math.log(256)) * (R - L), yOf = (ms) => B - clamp01(Math.log10(Math.max(ms, 1)) / 4.3) * (B - T);
        text(g, "下：全部聲道算完 1 秒音訊的時間（橫軸聲道數，縱軸對數）", 10, hT + 10, { size: 11.5, color: "rgba(236,235,230,.85)" });
        ns.forEach((n) => text(g, String(n), xOf(n), B + 11, { size: 10, mono: true, align: "center" }));
        [1, 10, 100, 1000, 10000].forEach((ms) => { g.fillStyle = ms === 1000 ? "rgba(247,37,133,.6)" : "rgba(255,255,255,.07)"; g.fillRect(L, yOf(ms), R - L, 1); text(g, ms >= 1000 ? `${ms / 1000} 秒` : `${ms} ms`, L - 4, yOf(ms), { size: 9.5, mono: true, align: "right" }); });
        text(g, "即時上限", R - 4, yOf(1000) - 8, { size: 10.5, align: "right", color: "#f72585" });
        series.forEach((s, k) => {
          g.strokeStyle = COL[k % 4]; g.fillStyle = COL[k % 4]; g.lineWidth = 2; g.beginPath();
          s.pts.forEach((p, j) => (j ? g.lineTo : g.moveTo).call(g, xOf(p.n), yOf(p.ms))); g.stroke(); g.lineWidth = 1;
          s.pts.forEach((p) => g.fillRect(xOf(p.n) - 2.5, yOf(p.ms) - 2.5, 5, 5));
          text(g, s.label, L + 8, T + 8 + k * 15, { size: 10.5, color: COL[k % 4] });
        });
      }
      ctx.onResize(draw);
      ctx.controls.classList.add("bottom");
      ctx.select("bufferSize", [512, 1024, 2048, 4096].map((v) => ({ value: v, label: String(v) })), N, (v) => { N = +v; measureCosts(); });
      ctx.group(SETS.map((s) => s[0]), si, (i) => (si = i));
      ctx.bench({
        label: "同時分析的聲道", unit: "聲道", sizes: [1, 4, 16, 64, 256], format: fmt, target: 1000, budget: 2000,
        prepare: (n) => { if (n === 1) { curS = { label: `N=${N}・${SETS[si][0]}`, pts: [] }; series = [...series.slice(-3), curS]; } },
        run: async (n) => {
          cfg(N);
          const feats = SETS[si][1], hop = N / 2, frames = Math.floor((SR - N) / hop) + 1, t0 = performance.now();
          let tY = t0;
          for (let s = 0; s < n; s++) {
            const o = (s * 4099) % SR;
            for (let k = 0; k < frames; k++) Meyda.extract(feats, SRC.subarray(o + k * hop, o + k * hop + N));
            if (performance.now() - tY > 120) { await new Promise((z) => setTimeout(z, 0)); if (!ctx.active) return ""; tY = performance.now(); }
          }
          const ms = performance.now() - t0;
          curS.pts.push({ n, ms }); draw();
          return `每幀 ${fmtMs(ms / (n * frames))}・約 ${fmt(Math.floor((n * 1000) / ms))} 聲道可即時`;
        },
        note: "只量 Meyda.extract 的純 JavaScript 計算。MeydaAnalyzer 另外靠已淘汰的 ScriptProcessor 在主執行緒回呼，畫面忙碌時回呼會延遲，實際可即時的聲道數會更少。",
      });
      measureCosts();
    },
  },
] });
})();
</script>
