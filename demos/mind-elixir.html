<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Elixir 示範：可直接編輯的旅遊規劃心智圖</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mind-elixir@5.15.1/dist/MindElixir.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  /* Mind Elixir makes its host position:relative, so a fixed wrapper sets the size. */
  #wrap { position: fixed; inset: 0; }
  #map { width: 100%; height: 100%; }
  #map .map-container { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  .controls { flex-wrap: wrap; max-width: calc(100% - 24px); }
  #title { position: fixed; top: 16px; left: 18px; z-index: 5; pointer-events: none; }
  #title b { display: block; font-size: 17px; letter-spacing: .02em; }
  #title span { font-size: 12px; color: var(--muted); }
  body.light #title b { color: #1c1c1a; }
  @media (max-width: 640px) {
    #title { top: 60px; left: 14px; }
    #title b { font-size: 15px; }
    #title span { display: none; }
  }
</style>
</head>
<body>
<div id="wrap"><div id="map"></div></div>
<div id="title"><b>台南兩天一夜</b><span>行程規劃草稿（示意）</span></div>
<div class="controls">
  <button class="btn" id="add">加子節點</button>
  <button class="btn" id="dir">單側展開</button>
  <button class="btn" id="theme" aria-pressed="false">亮色主題</button>
  <button class="btn" id="fit">置中</button>
</div>
<div class="hint">雙擊改字・Tab 加子節點・拖曳節點換位置・右鍵選單</div>

<script src="https://cdn.jsdelivr.net/npm/mind-elixir@5.15.1/dist/MindElixir.iife.js"></script>
<script>
const ME = window.MindElixir;
const Mind = ME.default;

// Two themes built from the library's own presets, with the page palette swapped in.
const PALETTE = ["#ffd36b", "#ff7aa8", "#7cc7ff", "#8be3a6", "#b49cff", "#ffa66b"];
const DARK = {
  ...ME.DARK_THEME, name: "Atlas Dark", palette: PALETTE,
  cssVar: { ...ME.DARK_THEME.cssVar, "--bgcolor": "#14151a", "--root-bgcolor": "#ffd36b", "--root-color": "#1c1b17",
    "--main-bgcolor": "#262833", "--main-color": "#f2f1ec", "--color": "#d7d6d0", "--selected": "#ffd36b",
    "--main-radius": "10px", "--root-radius": "14px" },
};
const LIGHT = {
  ...ME.THEME, name: "Atlas Light",
  palette: ["#c99a00", "#d61f69", "#1f8fb8", "#2f9e55", "#6a5ae0", "#e0661f"],
  cssVar: { ...ME.THEME.cssVar, "--bgcolor": "#fbfaf6", "--root-bgcolor": "#1c1c1a", "--root-color": "#fff8dc",
    "--main-radius": "10px", "--root-radius": "14px" },
};

let uid = 0;
const n = (topic, extra = {}) => ({ id: `n${++uid}`, topic, ...extra });
const tag = (text, bg) => ({ text, style: { background: bg, color: "#1c1b17" } });

const day1 = n("第一天", { direction: 1, children: [
  n("上午：赤崁樓", { icons: ["🏯"], tags: [tag("古蹟", "#ffe08a")] }),
  n("中午：度小月擔仔麵", { icons: ["🍜"] }),
  n("下午：安平古堡", { icons: ["⛵"], tags: [tag("古蹟", "#ffe08a")] }),
  n("傍晚：神農街散步", { icons: ["🏮"] }),
]});
const day2 = n("第二天", { direction: 1, children: [
  n("早餐：溫體牛肉湯", { icons: ["🥣"], tags: [tag("早點去", "#ffb3cb")] }),
  n("上午：奇美博物館", { icons: ["🏛️"], tags: [tag("需購票", "#a8dcff")] }),
  n("下午：藍晒圖文創園區", { icons: ["🎨"] }),
  n("回程：高鐵臺南站", { icons: ["🚄"] }),
]});
const food = n("必吃清單", { direction: 0, children: [
  n("虱目魚粥"), n("棺材板"), n("豆花"), n("蝦捲"),
]});
const budget = n("預算（示意）", { direction: 0, children: [
  n("住宿 2,400 元"), n("交通 1,800 元"), n("餐飲 1,500 元"),
]});
const prep = n("行前準備", { direction: 0, children: [
  n("防曬與雨具"), n("預約民宿"), n("下載公車 App"),
]});

const data = {
  nodeData: n("台南兩天一夜", { children: [day1, day2, food, budget, prep] }),
  // A cross-link and a bracket summary show features plain trees do not have.
  arrows: [{ id: "a1", label: "步行 10 分", from: day1.children[0].id, to: day1.children[3].id,
    delta1: { x: 190, y: 20 }, delta2: { x: 190, y: -20 } }],
  summaries: [{ id: "s1", label: "府城古蹟線", parent: day1.id, start: 0, end: 2 }],
};

const mind = new Mind({
  el: "#map",
  direction: Mind.SIDE,
  draggable: true,
  editable: true,
  toolBar: false,
  keypress: true,
  allowUndo: true,
  newTopicName: "新節點",
  theme: DARK,
  contextMenu: {
    focus: true,
    link: true,
    locale: {
      addChild: "新增子節點", addParent: "新增父節點", addSibling: "新增同層節點", removeNode: "刪除節點",
      focus: "專注模式", cancelFocus: "取消專注", moveUp: "上移", moveDown: "下移",
      link: "連線", linkBidirectional: "雙向連線", clickTips: "請點選目標節點", summary: "摘要",
    },
  },
});
mind.init(data);

// Like the built-in scaleFit, but leaves a margin for the buttons and title.
function fit() {
  const { container: c, nodes, map } = mind;
  const s = Math.min(1, (0.92 * c.offsetWidth) / nodes.offsetWidth, (0.8 * c.offsetHeight) / nodes.offsetHeight);
  const dx = (c.offsetWidth - nodes.offsetWidth) / 2;
  const dy = (c.offsetHeight - nodes.offsetHeight) / 2 + 10;
  mind.scaleVal = s;
  map.style.transformOrigin = "50% 50%";
  map.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${s})`;
}

let side = true;
const dirBtn = document.getElementById("dir");
function setSide(on) {
  side = on;
  if (side) mind.initSide(); else mind.initRight();
  dirBtn.textContent = side ? "單側展開" : "左右展開";
  requestAnimationFrame(fit);
}
dirBtn.addEventListener("click", () => setSide(!side));
// Portrait frames get the taller one-sided layout so the text stays legible.
if (innerWidth < 640) setSide(false); else requestAnimationFrame(fit);

let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(fit, 120); });

document.getElementById("fit").addEventListener("click", fit);
document.getElementById("add").addEventListener("click", () => {
  // Add under the selected node, or under the root when nothing is selected.
  const target = mind.currentNode || Mind.E(data.nodeData.id);
  mind.selectNode(target);
  mind.addChild(target);
});

const themeBtn = document.getElementById("theme");
themeBtn.addEventListener("click", () => {
  const light = themeBtn.getAttribute("aria-pressed") !== "true";
  themeBtn.setAttribute("aria-pressed", String(light));
  document.body.classList.toggle("paper", light);
  document.body.classList.toggle("light", light);
  mind.changeTheme(light ? LIGHT : DARK);
});
</script>
</body>
</html>
