let uid = 0;
const n = (topic, extra = {}) => ({ id: `n${++uid}`, topic, ...extra });
const tag = (text, bg) => ({ text, style: { background: bg, color: "#1c1b17" } });
const leaves = (...names) => names.map((t) => n(t));

// Center the whole map with a margin; the built-in scaleFit fills the box edge to edge.
function fit(mind, pad = 0.95) {
  const { container: c, nodes, map } = mind;
  if (!c || !c.offsetWidth || !nodes.offsetWidth) return;
  const s = Math.min(1, (pad * c.offsetWidth) / nodes.offsetWidth, (pad * c.offsetHeight) / nodes.offsetHeight);
  mind.scaleVal = s;
  map.style.transformOrigin = "50% 50%";
  map.style.transform = `translate3d(${(c.offsetWidth - nodes.offsetWidth) / 2}px, ${(c.offsetHeight - nodes.offsetHeight) / 2}px, 0) scale(${s})`;
}

// Tall frames get the one-sided layout so the text stays legible.
const portrait = (ctx) => { const { width, height } = ctx.size(); return height > width; };

function makeMind(ctx, box, opts, data, place = fit) {
  const host = h("div", { class: "mel-host" });
  box.prepend(host);
  const mind = new Mind({
    el: host, direction: portrait(ctx) ? Mind.RIGHT : Mind.SIDE, toolBar: false, keypress: true, allowUndo: true,
    newTopicName: "新節點", contextMenu: MENU, theme: DARK, ...opts,
  });
  mind.init(data);
  const refit = () => place(mind);
  // The controls bar and side panes resize the box without resizing the stage, so watch the box itself.
  const ro = new ResizeObserver(refit);
  ro.observe(box);
  document.fonts.ready.then(() => ctx.active && refit());
  ctx.onCleanup(() => { ro.disconnect(); mind.destroy(); });
  return { mind, refit };
}

function download(blob, name) {
  const a = h("a", { href: URL.createObjectURL(blob), download: name });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// Full tree for the stress test: every node gets 6 children, breadth first.
function genTree(count, foldDepth) {
  let id = 0;
  const mk = (topic, depth) => ({ id: `t${id++}`, topic, children: [], ...(foldDepth && depth >= foldDepth ? { expanded: false } : {}) });
  const root = mk("壓力測試", 0);
  const queue = [[root, 0]];
  for (let made = 1, q = 0; made < count; q++) {
    const [parent, depth] = queue[q];
    for (let i = 0; i < 6 && made < count; i++, made++) {
      const child = mk(`節點 ${made}`, depth + 1);
      parent.children.push(child);
      queue.push([child, depth + 1]);
    }
  }
  return { nodeData: root, arrows: [], summaries: [] };
}

// A tiny inline Markdown renderer for the markdown option: escape first, then code, bold and italic.
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const tinyMd = (text) => esc(text)
  .replace(/`([^`]+)`/g, "<code>$1</code>")
  .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
  .replace(/\*([^*]+)\*/g, "<i>$1</i>");

const OP_LABEL = {
  addChild: "新增子節點", insertSibling: "新增同層", insertParent: "新增父節點", removeNodes: "刪除",
  finishEdit: "改字", moveNodeBefore: "往前移", moveNodeAfter: "往後移", moveNodeIn: "拖進節點",
  reshapeNode: "改樣式", copyNode: "複製", copyNodes: "複製", createArrow: "加關聯線", removeArrow: "刪關聯線",

Showcase.run({ scenes: [
  {
    id: "trip", title: "旅遊規劃",
    api: "new MindElixir({ el, direction, contextMenu, theme }).init(data)",
    desc: "台南兩天一夜的行程草稿：節點帶標籤與圖示，還有一條關聯線和一個摘要框；可以直接雙擊改字、拖曳換位置、右鍵新增或連線。",
    hint: "雙擊改字・Tab 加子節點・拖曳節點換位置・右鍵選單",
    mount(ctx) {
      ctx.html(`<div class="mel-board"><div class="mel-box"><div class="mel-title"><b>台南兩天一夜</b><span>行程規劃草稿（示意）</span></div></div></div>`);
      const data = tripData();
      const { mind, refit } = makeMind(ctx, ctx.$(".mel-box"), {}, data);
      const setDir = (i) => { if (i) mind.initRight(); else mind.initSide(); refit(); };
      ctx.group(["左右展開", "單側展開"], portrait(ctx) ? 1 : 0, setDir);
      ctx.button("加子節點", () => {
        // Add under the selected node, or under the root when nothing is selected.
        const target = mind.currentNode || Mind.E(data.nodeData.id);
        mind.selectNode(target);
        mind.addChild(target);
      });
      ctx.toggle("亮色主題", false, (on) => {
        document.body.classList.toggle("paper", on);
        mind.changeTheme(on ? LIGHT : DARK);
      });
      ctx.button("置中", refit);
    },
  },
  {
    id: "edit", title: "編輯與操作紀錄",
    api: "addChild() ・ insertSibling() ・ removeNodes() ・ undo() ・ bus.addListener('operation')",
    desc: "按鈕直接呼叫編輯 API，每個動作都從 operation 事件流進右側紀錄；before 攔截器會擋下刪除「必留」節點，復原與重做來自 allowUndo。",
    hint: "先點選節點再按按鈕；鍵盤也行：Tab 子節點、Enter 同層、Delete 刪除、Ctrl＋Z 復原",
    mount(ctx) {
      ctx.html(`<div class="mel-board mel-split"><div class="mel-box"></div>
        <div class="mel-pane"><div class="mel-head"><b>操作紀錄</b><span class="mel-num">0 筆</span></div><ol class="mel-log"></ol></div></div>`);
      const log = ctx.$(".mel-log"), count = ctx.$(".mel-head .mel-num");
      let total = 0;
      const add = (label, what, cls) => {
        count.textContent = `${fmt(++total)} 筆`;
        log.prepend(h("li", { class: cls }, h("span", { class: "mel-op" }, label), what));
        while (log.children.length > 80) log.lastChild.remove();
      };
      const hasKeep = (o) => (o.tags || []).some((t) => (t.text ?? t) === "必留") || (o.children || []).some(hasKeep);
      const data = launchData();
      const { mind } = makeMind(ctx, ctx.$(".mel-box"), {
        before: {
          // Returning false cancels the operation before anything changes.
          async removeNodes(els) {
            const hit = els.find((el) => hasKeep(el.nodeObj));
            if (hit) add("已阻擋", `「${hit.nodeObj.topic}」含有必留節點`, "mel-block");
            return !hit;
          },
        },
      }, data);
      mind.bus.addListener("operation", (op) => {
        if (!OP_LABEL[op.name]) return;
        const what = op.obj?.topic ?? op.objs?.map((o) => o.topic).join("、") ?? "";
        add(OP_LABEL[op.name], what ? `「${what}」` : "");
      });
      mind.selectNode(Mind.E(data.nodeData.children[0].children[1].id));
      const withNode = (fn) => () => {
        const el = mind.currentNode;
        if (!el) { add("提示", "先點選一個節點", "mel-undo"); return; }
        fn(el);
      };
      ctx.button("子節點", withNode((el) => mind.addChild(el)));
      ctx.button("同層", withNode((el) => mind.insertSibling("after", el)));
      ctx.button("父節點", withNode((el) => mind.insertParent(el)));
      ctx.button("刪除", withNode(() => mind.removeNodes(mind.currentNodes)));
      ctx.button("上移", withNode((el) => mind.moveUpNode(el)));
      ctx.button("下移", withNode((el) => mind.moveDownNode(el)));
      ctx.button("復原", () => { mind.undo(); add("復原", ""); });
      ctx.button("重做", () => { mind.redo(); add("重做", ""); });
    },
  },
  {
    id: "layout", title: "方向與版面",
    api: "initSide() ・ initRight() ・ initLeft() ・ initDown() ・ changeCompact() ・ focusNode()",
    desc: "同一份組織圖切換四種方向，向下就是組織樹；緊湊模式縮小節點間距，收合只留部門，專注模式暫時把一個分支當成根節點。",
    hint: "點節點邊的圓點也能收合單一分支",
    mount(ctx) {
      ctx.html(`<div class="mel-board"><div class="mel-box"><div class="mel-tag"><b>地圖尺寸</b> <span class="mel-num"></span>　<span class="mel-dir"></span></div></div></div>`);
      const data = orgData();
      const depts = data.nodeData.children.map((c) => c.id);
      const { mind, refit } = makeMind(ctx, ctx.$(".mel-box"), {}, data);
      const size = ctx.$(".mel-num"), dirEl = ctx.$(".mel-dir");
      const DIRS = ["左右", "向右", "向左", "向下"];
      let dir = portrait(ctx) ? 1 : 3, focused = false;
      const show = () => {
        refit();
        size.textContent = `${fmt(mind.nodes.offsetWidth)} × ${fmt(mind.nodes.offsetHeight)}`;
        dirEl.textContent = focused ? "專注：產品部" : `方向：${DIRS[dir]}`;
      };
      const applyDir = () => {
        [mind.initSide, mind.initRight, mind.initLeft, mind.initDown][dir].call(mind);
        show();
      };
      ctx.group(DIRS, dir, (i) => { dir = i; applyDir(); });
      ctx.toggle("緊湊", false, (on) => { mind.changeCompact(on); show(); });
      ctx.toggle("只看部門", false, (on) => {
        depts.forEach((id) => mind.expandNode(Mind.E(id), !on));
        show();
      });
      ctx.toggle("專注產品部", false, (on) => {
        focused = on;
        if (on) mind.focusNode(Mind.E(depts[0])); else mind.cancelFocus();
        show();
      });
      applyDir();
    },
  },
  {
    id: "theme", title: "主題與分支線",
    api: "changeTheme({ name, type, palette, cssVar, generateMainBranch })",
    desc: "主題就是一組 CSS 變數加一串分支配色：兩個內建主題、兩個自訂主題，還能改圓角，或用 generateMainBranch 自己畫主分支線的路徑。",
    hint: "換主題、拖圓角滑桿，或開直角分支線",
    mount(ctx) {
      ctx.html(`<div class="mel-board"><div class="mel-box mel-col"><div class="mel-code"></div><div class="mel-fill"></div></div></div>`);
      const code = ctx.$(".mel-code");
      const THEMES = {
        theme: ME.THEME,
        dark: ME.DARK_THEME,
        matcha: { name: "抹茶", type: "light", palette: ["#5b8c3a", "#a3712a", "#3f7f8c", "#8c5b7a", "#6d7f2a", "#b0563c"],
          cssVar: { ...ME.THEME.cssVar, "--bgcolor": "#f4f1e6", "--root-bgcolor": "#3d5a2a", "--root-color": "#f4f1e6",
            "--root-border-color": "transparent", "--main-bgcolor": "#e4ecd6", "--main-color": "#2c3a22",
            "--main-border": "1px solid #b8c9a0", "--color": "#3a3a30", "--selected": "#5b8c3a" } },
        night: { name: "夜市", type: "dark", palette: ["#ff4fd8", "#3df5ff", "#ffe14f", "#7dff6b", "#ff8a3d", "#a07bff"],
          cssVar: { ...ME.DARK_THEME.cssVar, "--bgcolor": "#0b0820", "--root-bgcolor": "#ff4fd8", "--root-color": "#0b0820",
            "--root-border-color": "#ffe14f", "--main-bgcolor": "#1a1440", "--main-color": "#f5f0ff",
            "--main-border": "1px solid #3df5ff", "--color": "#cfc8ff", "--selected": "#3df5ff" } },
      };
      // Elbow connectors: out from the root, across, then down to the child (or across for the top-down layout).
      function elbow({ pT, pL, pW, pH, cT, cL, cW, cH, direction }) {
        if (direction === "down") {
          const x1 = pL + pW / 2, y1 = pT + pH, x2 = cL + cW / 2, y2 = cT, m = (y1 + y2) / 2;
          return `M ${x1} ${y1} V ${m} H ${x2} V ${y2}`;
        }
        const x1 = pL + pW / 2, y1 = pT + pH / 2, x2 = direction === "lhs" ? cL + cW : cL, y2 = cT + cH / 2, m = (x1 + x2) / 2;
        return `M ${x1} ${y1} H ${m} V ${y2} H ${x2}`;
      }
      let key = "night", radius = 10, square = false, mind;
      const build = () => {
        const base = THEMES[key];
        const theme = { ...base, name: base.name,
          cssVar: { ...base.cssVar, "--main-radius": `${radius}px`, "--root-radius": `${radius + 4}px` },
          ...(square ? { generateMainBranch: elbow } : {}) };
        document.body.classList.toggle("paper", theme.type === "light");
        code.replaceChildren(
          h("span", {}, "palette ", h("span", { class: "mel-sw" }, theme.palette.map((c) => h("i", { style: `background:${c}` })))),
          h("code", {}, `name: "${theme.name}"・type: "${theme.type}"・--main-radius: ${radius}px${square ? "・generateMainBranch: elbow" : ""}`),
        );
        return theme;
      };
      ({ mind } = makeMind(ctx, ctx.$(".mel-fill"), { theme: build() }, coffeeData()));
      const apply = () => { mind.changeTheme(build()); fit(mind); };
      ctx.select("主題", [
        { value: "theme", label: "內建 THEME" }, { value: "dark", label: "內建 DARK_THEME" },
        { value: "matcha", label: "自訂：抹茶" }, { value: "night", label: "自訂：夜市" },
      ], key, (v) => { key = v; apply(); });
      ctx.slider("圓角", { min: 0, max: 24, value: radius, format: (v) => `${v}px` }, (v) => { radius = v; apply(); });
      ctx.toggle("直角分支線", false, (on) => { square = on; apply(); });
    },
  },
  {
    id: "content", title: "節點內容",
    api: "nodeObj.{ style, tags, icons, hyperLink, image, branchColor, dangerouslySetInnerHTML } ・ reshapeNode()",
    desc: "一個節點可以帶樣式、標籤、圖示、超連結、圖片、整段 HTML，分支也能各自指定顏色；markdown 選項把節點文字轉成 HTML。右側即時顯示選取節點的資料。",
    hint: "點一個節點，再用按鈕改它的樣式",
    mount(ctx) {
      ctx.html(`<div class="mel-board mel-split"><div class="mel-box"></div>
        <div class="mel-pane"><div class="mel-head"><b>節點資料</b><span class="mel-sel"></span></div><pre class="mel-json"></pre></div></div>`);
      const json = ctx.$(".mel-json"), selEl = ctx.$(".mel-sel");
      const data = readingData();
      const { mind } = makeMind(ctx, ctx.$(".mel-box"), { markdown: (text) => tinyMd(text) }, data);
      const show = () => {
        const el = mind.currentNode;
        if (!el) { selEl.textContent = "未選取"; json.textContent = "點一個節點看它的資料"; return; }
        const o = el.nodeObj;
        selEl.textContent = o.topic;
        // parent is a circular reference and children can be long, so show only the count.
        json.textContent = JSON.stringify(o, (k, v) => (k === "parent" ? undefined : k === "children" ? `（${v.length} 個子節點）` : k === "url" && v.startsWith("data:") ? "data:image/svg+xml,…" : v), 2);
      };
      mind.bus.addListener("selectNodes", show);
      mind.bus.addListener("unselectNodes", show);
      mind.bus.addListener("operation", show);
      mind.selectNode(Mind.E(data.nodeData.children[0].children[0].id));
      show();
      const BG = ["#ffd36b", "#8be3a6", "#7cc7ff", "#ff9b9b"];
      const reshape = (patch) => () => {
        const el = mind.currentNode;
        if (el) mind.reshapeNode(el, patch(el.nodeObj));
      };
      ctx.button("加粗", reshape((o) => ({ style: { fontWeight: o.style?.fontWeight === "bold" ? "normal" : "bold" } })));
      ctx.button("換底色", reshape((o) => {
        const next = BG[(BG.indexOf(o.style?.background) + 1) % BG.length];
        return { style: { background: next, color: "#1c1b17" } };
      }));
      ctx.button("加標籤", reshape((o) => ({ tags: [...(o.tags || []), tag("已複習", "#b49cff")] })));
      ctx.button("加圖示", reshape((o) => ({ icons: [...(o.icons || []), "⭐"] })));
    },
  },
  {
    id: "links", title: "摘要與關聯線",
    api: "createSummaryFrom({ parent, start, end, label }) ・ createArrow(from, to, { bidirectional, style })",
    desc: "摘要用大括號框住同一層的幾個節點，關聯線把樹上任兩個節點連起來，可設雙向、虛線與文字；點選關聯線還能拖曳控制點調整弧度。",
    hint: "Ctrl＋點選可多選節點，再按「加摘要」或「加關聯線」",
    mount(ctx) {
      ctx.html(`<div class="mel-board"><div class="mel-box"><div class="mel-tag"><span class="mel-num"></span></div></div></div>`);
      const data = projectData();
      const { mind, refit } = makeMind(ctx, ctx.$(".mel-box"), {}, data);
      const stat = ctx.$(".mel-tag .mel-num");
      const show = () => {
        const sel = mind.currentNodes?.length || 0;
        stat.textContent = `關聯線 ${mind.arrows.length} 條・摘要 ${mind.summaries.length} 個・已選 ${sel} 個節點`;
      };
      ["selectNodes", "unselectNodes", "operation"].forEach((ev) => mind.bus.addListener(ev, show));
      const say = (t) => { stat.textContent = t; ctx.timeout(show, 2200); };
      let twoWay = true, dashed = true;
      ctx.button("加摘要", () => {
        const sel = mind.currentNodes || [];
        const parent = sel[0]?.nodeObj.parent;
        if (!sel.length || !parent || sel.some((el) => el.nodeObj.parent !== parent)) return say("請選同一層的節點（根節點除外）");
        const idx = sel.map((el) => parent.children.indexOf(el.nodeObj));
        mind.createSummaryFrom({ parent: parent.id, start: Math.min(...idx), end: Math.max(...idx), label: `共 ${sel.length} 項` });
        show();
      });
      ctx.button("加關聯線", () => {
        const sel = mind.currentNodes || [];
        if (sel.length !== 2) return say("請剛好選 2 個節點");
        mind.createArrow(sel[0], sel[1], { label: twoWay ? "互相影響" : "影響", bidirectional: twoWay,
          style: { stroke: "#ff7aa8", strokeWidth: 2, ...(dashed ? { strokeDasharray: "6 4" } : {}), labelColor: "#ff7aa8" } });
        show();
      });
      ctx.toggle("雙向", twoWay, (v) => { twoWay = v; });
      ctx.toggle("虛線", dashed, (v) => { dashed = v; });
      ctx.button("全部清除", () => { mind.refresh({ ...mind.getData(), arrows: [], summaries: [] }); refit(); show(); });
      // Start with two siblings selected so both buttons do something right away.
      const plan = data.nodeData.children[0].children;
      mind.selectNodes([Mind.E(plan[0].id), Mind.E(plan[2].id)]);
      show();
    },
  },
  {
    id: "data", title: "資料匯入匯出",
    api: "plaintextToMindElixir(text) ・ mind.getData() ・ exportPng() ・ exportSvg()",
    desc: "左邊用縮排純文字寫大綱（含樣式、摘要與關聯線語法），右邊即時轉成心智圖；也能把目前的圖匯出成純文字、JSON、PNG 或 SVG。",
    hint: "改左邊的文字，或切到匯出看資料格式",
    mount(ctx) {
      ctx.html(`<div class="mel-board mel-split src-left">
        <div class="mel-pane"><div class="mel-head"><b class="mel-mode">純文字大綱</b><span class="mel-num">載入轉換器…</span></div>
          <textarea class="mel-src" spellcheck="false"></textarea></div>
        <div class="mel-box"></div></div>`);
      const src = ctx.$(".mel-src"), stat = ctx.$(".mel-head .mel-num"), modeEl = ctx.$(".mel-mode");
      let text = document.getElementById("mel-plain").textContent.trim(), pc = null, mode = 0;
      src.value = text;
      const { mind, refit } = makeMind(ctx, ctx.$(".mel-box"), {}, Mind.new("載入中…"));
      const apply = () => {
        if (!pc) return;
        try {
          const d = pc.plaintextToMindElixir(text);
          mind.refresh(d);
          refit();
          stat.textContent = `${fmt(mind.nodes.querySelectorAll("me-tpc").length)} 節點・${fmt(d.arrows?.length || 0)} 連線・${fmt(d.summaries?.length || 0)} 摘要`;
        } catch (e) {
          stat.textContent = `語法錯誤：${e.message}`;
        }
      };
      let timer = 0;
      ctx.on(src, "input", () => {
        if (mode) return;
        text = src.value;
        clearTimeout(timer);
        timer = ctx.timeout(apply, 300);
      });
      const MODES = ["純文字大綱", "匯出純文字", "匯出 JSON"];
      ctx.group(["編輯大綱", "匯出純文字", "匯出 JSON"], 0, (i) => {
        mode = i;
        modeEl.textContent = MODES[i];
        src.readOnly = i > 0;
        if (i === 0) src.value = text;
        else if (i === 1) src.value = pc ? pc.mindElixirToPlaintext(mind.getData()) : "";
        else src.value = JSON.stringify(mind.getData(), (k, v) => (k === "theme" ? `（主題物件：${v.name}）` : v), 2);
      });
      ctx.button("下載 PNG", async () => download(await mind.exportPng(), "mind-elixir.png"));
      ctx.button("下載 SVG", () => download(mind.exportSvg(), "mind-elixir.svg"));
      import(CDN + "PlaintextConverter.js").then((m) => {
        if (!ctx.active) return;
        pc = m;
        apply();
      }, (e) => { stat.textContent = `轉換器載入失敗：${e.message}`; });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "mind.refresh({ nodeData, arrows, summaries })",
    desc: "產生越來越大的樹（每個節點 6 個子節點），量 refresh 從清空、建立每個節點的 DOM、排版到畫完分支線的總耗時。",
    hint: "選層級後按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="mel-stress mel-box"><div class="mel-tag"><b>最後一次繪製</b> <span class="mel-num"></span></div></div>`);
      ctx.controls.classList.add("bottom");
      const tagEl = ctx.$(".mel-tag .mel-num");
      // Whole-map fit, but never below 0.35 so a huge tree still shows legible nodes around the root.
      const place = (m) => { fit(m); if (m.scaleVal < 0.35) { m.scaleVal = 0.35; m.toCenter(); } };
      const { mind, refit } = makeMind(ctx, ctx.$(".mel-stress"),
        { draggable: false, editable: false, contextMenu: false, keypress: false, allowUndo: false }, genTree(60, 0), place);
      tagEl.textContent = "預覽 60 節點";
      let fold = 0;
      ctx.group(["全部展開", "只展開 2 層"], 0, (i) => { fold = i ? 2 : 0; });
      ctx.bench({
        label: "心智圖節點", unit: "節點",
        sizes: [500, 1000, 2000, 4000, 8000, 16000, 32000],
        prepare: (count) => genTree(count, fold),
        run(count, data) {
          mind.refresh(data);
          void mind.nodes.offsetWidth; // force layout so the timing includes it
          refit();
          const shown = mind.nodes.querySelectorAll("me-tpc").length;
          tagEl.textContent = `${fmt(count)} 節點，畫出 ${fmt(shown)} 個`;
          return `畫出 ${fmt(shown)} 個主題`;
        },
        note: "每個節點都是真的 DOM 元素，refresh 會整張重建，所以耗時隨畫出的節點數上升，地圖也會長到幾十萬像素高。切到「只展開 2 層」時，第 2 層以下設成 expanded: false，資料還在但不建 DOM，同樣大小的樹快很多。",
      });
    },
  },
] });
</script>
</body>
</html>
