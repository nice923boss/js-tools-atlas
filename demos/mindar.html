<script type="module">
// MindAR 1.2.5 ships ESM builds that import "three" through the import map above
const MINDAR = "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/";
const HF_IMG = "https://huggingface.co/datasets/Xenova/transformers.js-docs/resolve/fbe92bd97d48f3ec17779d8d8f2964e1c6bc7634/";
// Sample portraits (Unsplash photos mirrored in the transformers.js docs dataset); fx/fy = crop center, z = share of image height shown
const FACES = [
  { url: HF_IMG + "portrait-of-woman_small.jpg", fx: 0.5, fy: 0.5, z: 0.92 },
  { url: HF_IMG + "woman-with-afro.jpg", fx: 0.46, fy: 0.45, z: 0.58 },
  { url: HF_IMG + "selfie_segmentation.png", fx: 0.48, fy: 0.5, z: 1 },
];
const FACE_SRC = [{ value: "0", label: "範例照片一" }, { value: "1", label: "範例照片二" }, { value: "2", label: "範例照片三" }, { value: "cam", label: "鏡頭" }];
const CARD_PNG = "assets/mindar/card.png", CARD_MIND = "assets/mindar/card.mind";
const CARD_ASPECT = 372 / 674;
const PHOTOS = [
  { id: "4", label: "巴哥犬", url: "_shared/img/photo-4.jpg" },
  { id: "6", label: "水母", url: "_shared/img/photo-6.jpg" },
  { id: "7", label: "母獅", url: "_shared/img/photo-7.jpg" },
  { id: "2", label: "紅岩峽谷", url: "_shared/img/photo-2.jpg" },
];
const FEED_W = 640, FEED_H = 480, COMPILE_W = 480;
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#b392f0"];
const { fmt, fmtMs, fmtCompact } = Showcase;

/* ---------- library loading (one gate for the whole page) ---------- */
const lib = { THREE: null, Face: null, Image: null, Compiler: null, Controller: null };
let gated = false;
async function libs(ctx, need) {
  if (!gated) {
    await ctx.gate({
      icon: "🕶️", title: "MindAR 臉部與圖片追蹤", button: "開始",
      desc: "載入 MindAR 1.2.5、three.js 與 MediaPipe 臉部模型。沒有鏡頭也能看：臉部場景用範例照片，圖片場景用頁內畫布畫出的「模擬畫面」當影片來源，追蹤結果都由 MindAR 實際計算。只有在你選擇「鏡頭」時才會要求權限。",
      tags: ["約 17 MB", "MindAR 1.2.5", "鏡頭可選"],
    });
    gated = true;
  }
  const todo = [];
  if (!lib.THREE) todo.push(async () => { lib.THREE = await import("three"); });
  if (need.includes("face") && !lib.Face) todo.push(async () => { lib.Face = (await import(MINDAR + "mindar-face-three.prod.js")).MindARThree; });
  if (need.includes("image") && !lib.Image) todo.push(async () => { lib.Image = (await import(MINDAR + "mindar-image-three.prod.js")).MindARThree; });
  if (need.includes("core") && !lib.Compiler) {
    todo.push(async () => { ({ Compiler: lib.Compiler, Controller: lib.Controller } = await import(MINDAR + "mindar-image.prod.js")); });
  }
  if (!todo.length) return lib;
  const st = ctx.status("下載 MindAR 與 three.js…");
  try {
    for (let i = 0; i < todo.length; i++) { st.progress(i / todo.length); await todo[i](); }
  } catch (e) {
    st.error("MindAR 載入失敗，請確認網路連線後重新整理");
    throw e;
  }
  st.done();
  return lib;
}

/* ---------- small helpers ---------- */
const abortError = () => new DOMException("scene switched", "AbortError");
const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;
const imgCache = new Map();
function loadImage(url) {
  if (!imgCache.has(url)) {
    imgCache.set(url, new Promise((ok, fail) => {
      const img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = () => ok(img);
      img.onerror = () => { imgCache.delete(url); fail(new Error(`圖片載入失敗：${url}`)); };
      img.src = url;
    }));
  }
  return imgCache.get(url);
}
function sized(img, w) {
  const c = document.createElement("canvas");
  c.width = w; c.height = Math.round(w * img.naturalHeight / img.naturalWidth);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c;
}
// Sub-lifecycle inside a scene: each restart disposes the previous AR session first
function runner(ctx) {
  let cur = null;
  const stop = () => { const old = cur; cur = null; if (old) while (old.fns.length) { try { old.fns.pop()(); } catch (e) { console.warn(e); } } };
  ctx.onCleanup(stop);
  return async (fn) => {
    stop();
    const life = { fns: [], get active() { return ctx.active && cur === life; }, onCleanup(f) { if (life.active) life.fns.push(f); else f(); } };
    cur = life;
    try { await fn(life); } catch (e) { if (life.active && e?.name !== "AbortError") throw e; }
  };
}
function arBox(extra = "") {
  return `<div class="ma-ar"><div class="ma-host"></div>${extra}<span class="ma-tag"></span><span class="ma-state"></span><div class="ma-msg" hidden></div></div>`;
}
function arUI(ctx, root = ctx.el) {
  const tag = root.querySelector(".ma-tag"), state = root.querySelector(".ma-state"), msg = root.querySelector(".ma-msg");
  return {
    host: root.querySelector(".ma-host"),
    tag(text, sim) { tag.textContent = text; tag.classList.toggle("sim", !!sim); },
    state(text, on) { state.textContent = text; state.classList.toggle("on", !!on); },
    msg(text, err) { msg.textContent = text || ""; msg.hidden = !text; msg.classList.toggle("err", !!err); },
  };
}

/* ---------- video sources ---------- */
function canvasFeed(life, draw, w = FEED_W, h = FEED_H) {
  const canvas = Object.assign(document.createElement("canvas"), { width: w, height: h });
  const g = canvas.getContext("2d");
  const t0 = performance.now();
  let id = 0;
  const loop = () => { draw(g, (performance.now() - t0) / 1000); id = requestAnimationFrame(loop); };
  loop();
  const stream = canvas.captureStream(30);
  life.onCleanup(() => { cancelAnimationFrame(id); stream.getTracks().forEach((t) => t.stop()); });
  return { canvas, stream };
}
function backdrop(g, w, h) {
  const bg = g.createRadialGradient(w / 2, h * 0.3, 40, w / 2, h / 2, w * 0.75);
  bg.addColorStop(0, "#2a3340"); bg.addColorStop(1, "#0b0e12");
  g.fillStyle = bg; g.fillRect(0, 0, w, h);
}
function drawCard(g, img, x, y, w, aspect, rot = 0, skew = 0) {
  const h = w * aspect;
  g.save();
  g.translate(x, y); g.rotate(rot); g.transform(1, 0, skew, 1, 0, 0);
  g.shadowColor = "rgba(0, 0, 0, .6)"; g.shadowBlur = 24; g.shadowOffsetY = 10;
  g.fillStyle = "#fff"; g.fillRect(-w / 2 - 7, -h / 2 - 7, w + 14, h + 14);
  g.shadowColor = "transparent";
  g.drawImage(img, -w / 2, -h / 2, w, h);
  g.restore();
}
async function photoFeed(life, p) {
  const img = await loadImage(p.url);
  const W = img.naturalWidth, H = img.naturalHeight;
  const sh = p.z * H, k = FEED_H / sh;
  const cx = p.fx * W, cy = Math.max(sh / 2, Math.min(H - sh / 2, p.fy * H));
  const cover = Math.max(FEED_W / W, FEED_H / H);
  // Gentle sway so the tracking visibly follows a moving head; a blurred copy fills any side gaps
  return canvasFeed(life, (g, t) => {
    g.filter = "blur(18px) brightness(.7)";
    g.drawImage(img, (FEED_W - W * cover) / 2, (FEED_H - H * cover) / 2, W * cover, H * cover);
    g.filter = "none";
    g.save();
    g.translate(FEED_W / 2 + Math.sin(t * 0.7) * 12, FEED_H / 2 + Math.sin(t * 0.9) * 5);
    g.rotate(Math.sin(t * 0.6) * 0.07);
    const s = k * (1 + Math.sin(t * 0.5) * 0.03);
    g.scale(s, s);
    g.drawImage(img, -cx, -cy, W, H);
    g.restore();
  });
}
async function openCamera(life, facingMode) {
  if (!navigator.mediaDevices?.getUserMedia) throw Object.assign(new Error("這個瀏覽器不支援 getUserMedia"), { name: "NotSupportedError" });
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode, width: { ideal: 640 }, height: { ideal: 480 } } });
  life.onCleanup(() => stream.getTracks().forEach((t) => t.stop()));
  return stream;
}
function camError(e) {
  if (e?.name === "NotAllowedError" || e?.name === "SecurityError") return "未取得鏡頭權限";
  if (e?.name === "NotFoundError" || e?.name === "OverconstrainedError") return "這台裝置找不到可用的鏡頭";
  if (e?.name === "NotSupportedError") return "這個瀏覽器不支援鏡頭存取";
  return `無法開啟鏡頭（${e?.name || e?.message || e}）`;
}
// MindAR only reads getUserMedia; this subclass hands it any MediaStream, using the same video setup as the library
function fedBy(Base, stream) {
  return class extends Base {
    _startVideo() {
      return new Promise((resolve) => {
        const v = document.createElement("video");
        v.setAttribute("autoplay", ""); v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
        v.muted = true;
        Object.assign(v.style, { position: "absolute", top: "0px", left: "0px", zIndex: "-2" });
        this.video = v;
        this.container.appendChild(v);
        v.addEventListener("loadedmetadata", () => { v.setAttribute("width", v.videoWidth); v.setAttribute("height", v.videoHeight); resolve(); }, { once: true });
        v.srcObject = stream;
      });
    }
  };
}

/* ---------- MindARThree session lifecycle ---------- */
const once = (() => { const seen = new WeakSet(); return (o, fn) => { if (o && !seen.has(o)) { seen.add(o); fn(o); } }; })();
function killAR(ar) {
  ar.renderer.setAnimationLoop(null);
  const c = ar.controller;
  c?.stopProcessVideo();
  once(c?.worker, (w) => { c.dispose(); w.terminate(); });
  once(c?.faceMeshHelper?.faceLandmarker, (lm) => setTimeout(() => lm.close(), 150));
  once(ar.renderer, (r) => { r.dispose(); r.forceContextLoss(); r.domElement.remove(); ar.cssRenderer.domElement.remove(); });
  if (!ar.starting && ar.video) { ar.video.srcObject = null; ar.video.remove(); ar.video = null; }
}
function makeAR(life, host, Base, stream, opts = {}) {
  const ar = new (fedBy(Base, stream))({ container: host, uiLoading: "no", uiScanning: "no", uiError: "no", ...opts });
  life.onCleanup(() => killAR(ar));
  return ar;
}
async function runAR(life, ctx, ar, ui, onFrame) {
  // Parts of start() run inside async Promise executors, so some failures only surface as unhandled rejections
  const off = ctx.on(window, "unhandledrejection", (e) => {
    e.preventDefault();
    if (life.active) { console.error(e.reason); ui.msg(`AR 引擎啟動失敗：${e.reason?.message || e.reason || "未知錯誤"}`, true); }
  });
  ar.starting = true;
  try { await ar.start(); } finally { ar.starting = false; }
  if (!life.active) { killAR(ar); throw abortError(); }
  if (typeof off === "function") off();
  const clock = new lib.THREE.Clock();
  ar.renderer.setAnimationLoop(() => { onFrame?.(clock.getDelta()); ar.renderer.render(ar.scene, ar.camera); });
  const fit = () => { if (ar.video) (ar._resize || ar.resize).call(ar); };
  ctx.onResize(fit);
  fit();
}
function addLights(T, scene) {
  scene.add(new T.HemisphereLight(0xffffff, 0x445566, 2.2));
  const sun = new T.DirectionalLight(0xffffff, 2.2);
  sun.position.set(0.5, 1, 2);
  scene.add(sun);
}
// Feed choice shared by the face scenes: sample photo, or a real camera with an honest fallback
async function faceStream(life, v, ui, sel) {
  if (v === "cam") {
    try {
      const s = await openCamera(life, "user");
      ui.tag("📷 鏡頭");
      return s;
    } catch (e) {
      ui.msg(`${camError(e)}，改用範例照片一`);
      sel.value = "0";
      v = "0";
    }
  }
  ui.tag("範例照片", true);
  return (await photoFeed(life, FACES[+v])).stream;
}
async function cardStream(life, ui, sel, simFeed) {
  if (sel.value === "cam") {
    try {
      const s = await openCamera(life, "environment");
      ui.tag("📷 鏡頭");
      return s;
    } catch (e) {
      ui.msg(`${camError(e)}，改用模擬畫面`);
      sel.value = "sim";
    }
  }
  ui.tag("模擬畫面", true);

function targetFrame(T, aspect, color) {

// Fetch the model bytes once per page; each visit parses its own copy so disposal never touches a shared scene
let robotBytes = null;
async function loadRobot(T) {
  robotBytes ||= fetch("_shared/models/robot.glb").then((r) => {
    if (!r.ok) throw new Error(`robot.glb HTTP ${r.status}`);
    return r.arrayBuffer();
  });
  robotBytes.catch(() => { robotBytes = null; });
  const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
  const gltf = await new GLTFLoader().parseAsync(await robotBytes, "");
  const model = gltf.scene;
  // Skinned hand meshes report bind-pose bounds hundreds of units wide, so size the robot from rigid meshes only
  const box = new T.Box3();
  model.updateMatrixWorld(true);
  model.traverse((o) => { if (o.isMesh && !o.isSkinnedMesh) box.expandByObject(o); });
  const k = 0.55 / (box.max.y - box.min.y);
  model.scale.setScalar(k);
  model.position.set(0, -0.22 - box.min.y * k, 0.06);
  const mixer = new T.AnimationMixer(model);
  const clip = gltf.animations.find((a) => a.name === "Dance") || gltf.animations[0];
  if (clip) mixer.clipAction(clip).play();
  const group = targetFrame(T, CARD_ASPECT, 0x4cc9f0);
  const disc = new T.Mesh(new T.CircleGeometry(0.16, 40), new T.MeshBasicMaterial({ color: 0xf7df1e, transparent: true, opacity: 0.35, depthWrite: false }));
  disc.position.set(0, -0.22, 0.004);
  group.add(disc, model);
  return { group, mixer };
}

/* ---------- in-browser target compilation (cached per page) ---------- */
const compiled = new Map();
async function compileTargets(key, canvases, onProgress) {
  if (!compiled.has(key)) {
    const job = (async () => {
      const comp = new lib.Compiler();
      const t0 = performance.now();
      const data = await comp.compileImageTargets(canvases, onProgress);
      const ms = performance.now() - t0;
      const buf = comp.exportData();
      return { data, ms, buf, url: URL.createObjectURL(new Blob([buf], { type: "application/octet-stream" })) };
    })();
    compiled.set(key, job);
    job.catch(() => compiled.delete(key));
  }
  return compiled.get(key);
}

const trackCount = (d) => d.trackingData.reduce((a, t) => a + t.points.length, 0);
function drawFeatures(g, W, H, img, d, { legend = true } = {}) {
  g.clearRect(0, 0, W, H);
  const iw = img.width, ih = img.height;
  const k = Math.min((W - 20) / iw, (H - (legend ? 56 : 20)) / ih);
  const ox = (W - iw * k) / 2, oy = 10;
  g.drawImage(img, ox, oy, iw * k, ih * k);
  g.fillStyle = "rgba(10, 12, 15, .35)"; g.fillRect(ox, oy, iw * k, ih * k);
  if (!d) return;
  const m0 = d.matchingData[0], t0 = d.trackingData[0];
  const dot = (x, y, r, color, square) => {
    g.beginPath();
    if (square) g.rect(ox + x * k - r, oy + y * k - r, r * 2, r * 2); else g.arc(ox + x * k, oy + y * k, r, 0, Math.PI * 2);
    g.strokeStyle = color; g.lineWidth = 1.4; g.stroke();
  };
  for (const p of m0.maximaPoints) dot(p.x / m0.scale, p.y / m0.scale, 2.6, COLORS[3]);
  for (const p of m0.minimaPoints) dot(p.x / m0.scale, p.y / m0.scale, 2.6, COLORS[1]);
  for (const p of t0.points) dot(p.x / t0.scale, p.y / t0.scale, 3.4, COLORS[0], true);
  if (!legend) return;
  const items = [[COLORS[3], `極大值 ${m0.maximaPoints.length}`], [COLORS[1], `極小值 ${m0.minimaPoints.length}`], [COLORS[0], `追蹤點 ${t0.points.length}`]];
  g.font = "12px " + getComputedStyle(document.body).getPropertyValue("--font");
  g.textBaseline = "middle";
  let x = ox;
  const y = oy + ih * k + 16;
  for (const [c, t] of items) {
    g.strokeStyle = c; g.lineWidth = 1.6; g.beginPath(); g.arc(x + 5, y, 4, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "#c9d1d9"; g.fillText(t, x + 14, y);
    x += g.measureText(t).width + 30;
  }
  g.fillStyle = "#8b949e";
  g.fillText("第 0 層（原尺寸）比對特徵點，與第 0 層追蹤點", ox, y + 20);
}
function fitCanvas(ctx, canvas, paint) {
  const g = canvas.getContext("2d");
  const resize = () => {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    paint(g, r.width, r.height);
  };
  // Observe the canvas itself: the control bar can shrink it later without resizing the scene element
  const ro = new ResizeObserver(() => { if (ctx.active) resize(); });
  ro.observe(canvas);
  ctx.onCleanup(() => ro.disconnect());
  resize();
  return { g, size: () => canvas.getBoundingClientRect(), repaint: resize };
}

        if (last) { drawFeatures(g, w, h, last.canvas, last.d); return; }
        g.clearRect(0, 0, w, h);
        g.fillStyle = "#8b949e"; g.font = `13px ${getComputedStyle(document.body).getPropertyValue("--font")}`; g.textAlign = "center";
        g.fillText("按「開始測試」，每一級編譯完會在這裡畫出特徵點", w / 2, h / 2);
        g.textAlign = "left";
      });
      let warmed = false;
      ctx.bench({
        label: "圖片寬度", unit: "px", sizes: [256, 512, 768, 1024, 1536, 2048, 3072], target: 3000, budget: 10000, format: (n) => String(n),
        note: "量 Compiler 把一張圖編譯成 .mind 的時間。比對特徵在主執行緒以 tfjs（WebGL）逐層建影像金字塔、找極值點；追蹤特徵固定縮到 256 px 高後在 Worker 萃取，所以耗時主要隨寬度與層數成長。第一次開始前先暖機編譯一張小圖（不計時），新尺寸仍會編譯新的著色器。顯示卡越慢、圖越大越久。",
        prepare: async (n) => {
          if (!warmed) { await new lib.Compiler().compileImageTargets([sized(img, 200)], () => {}); warmed = true; }
          if (n === 256) tbody.replaceChildren();
          return sized(img, n);
        },
        run: async (n, canvas) => {
          const comp = new lib.Compiler();
          const t0 = performance.now();
          let tm = 0;
          const data = await comp.compileImageTargets([canvas], (p) => { if (!tm && p >= 50) tm = performance.now() - t0; });
          const total = performance.now() - t0;
          const kb = comp.exportData().length / 1024;
          const d = data[0];
          last = { canvas, d };
          view.repaint();
          tbody.append(Showcase.h("tr", {},
            ...[`${n}×${canvas.height}`, fmtMs(total), fmtMs(tm), fmtMs(total - tm), String(d.matchingData.length), fmtCompact(featureCount(d)), `${kb.toFixed(0)} KB`]
              .map((t) => Showcase.h("td", { text: t }))));
          return `${d.matchingData.length} 層`;
        },
      });
    },
  },
] });
</script>
