<script>
const { h } = Showcase;
const ML5_URL = "https://cdn.jsdelivr.net/npm/ml5@1.4.0/dist/ml5.min.js";
// Official MediaPipe sample images (Google, Apache-2.0 repo assets, served with CORS)
const MP = "https://storage.googleapis.com/mediapipe-assets/";
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif";
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim() || "monospace";

// Approximate download sizes measured from the network panel (MB)
const MB = { lib: 4.5, hand: 8.2, body: 9.7, blaze: 12.6, face: 3.8, mobilenet: 14, doodle: 2, sentiment: 10.7, nn: 0 };
const NAME = { hand: "handPose", body: "bodyPose（MoveNet）", blaze: "bodyPose（BlazePose）", face: "faceMesh",
  mobilenet: "MobileNet", doodle: "DoodleNet", sentiment: "sentiment", nn: "neuralNetwork" };
const MAKE = {
  hand: () => ml5.handPose({ maxHands: 2, flipped: false }),
  body: () => ml5.bodyPose(),
  blaze: () => ml5.bodyPose("BlazePose"),
  face: () => ml5.faceMesh({ maxFaces: 1, refineLandmarks: true, flipped: false }),
  mobilenet: () => ml5.imageClassifier("MobileNet"),
  doodle: () => ml5.imageClassifier("DoodleNet"),
  sentiment: () => ml5.sentiment("MovieReviews"),
};
const FINGERS = [
  { chain: [0, 1, 2, 3, 4], color: "#f72585" },
  { chain: [0, 5, 6, 7, 8], color: "#f7df1e" },
  { chain: [9, 10, 11, 12], color: "#4cc9f0" },
  { chain: [13, 14, 15, 16], color: "#7bd389" },
  { chain: [0, 17, 18, 19, 20], color: "#9d8cff" },
];
const PALM = [0, 5, 9, 13, 17, 0];
const HAND_EDGES = [...FINGERS.flatMap((f) => f.chain.slice(1).map((b, i) => [f.chain[i], b, f.color])), [5, 9, "#ffffff"], [9, 13, "#ffffff"], [13, 17, "#ffffff"]];
const ZH = {
  lion: "獅子", jellyfish: "水母", "sea lion": "海獅", cliff: "懸崖", valley: "山谷", alp: "高山", promontory: "岬角", lakeside: "湖畔",
  seashore: "海岸", volcano: "火山", cougar: "美洲獅", cheetah: "獵豹", tiger: "老虎", leopard: "花豹", dugong: "儒艮", fountain: "噴泉",
  geyser: "間歇泉", "dam": "水壩", "canyon": "峽谷", "mountain": "山", "house": "房子", "sun": "太陽", "fish": "魚", "star": "星星",
  "eyeglasses": "眼鏡", "circle": "圓形", "barn": "穀倉", "tent": "帳篷", "shark": "鯊魚", "flower": "花", "octagon": "八角形",
  "snowflake": "雪花", "spider": "蜘蛛", "wheel": "輪子", "clock": "時鐘", "triangle": "三角形", "square": "正方形", "church": "教堂",
  "castle": "城堡", "bicycle": "腳踏車", "fireplace": "壁爐", "lighthouse": "燈塔", "garden": "花園", "hexagon": "六角形",
  "whale": "鯨魚", "umbrella": "雨傘", "envelope": "信封", "snowman": "雪人", "ladder": "梯子", "mug": "馬克杯", "cup": "杯子", "postcard": "明信片", "parachute": "降落傘", "owl": "貓頭鷹", "submarine": "潛水艇", "dolphin": "海豚", "sea turtle": "海龜", "hospital": "醫院", "door": "門", "lantern": "燈籠",
  "binoculars": "望遠鏡", "bracelet": "手環", "dumbbell": "啞鈴", "headphones": "耳機", "mouth": "嘴巴", "lollipop": "棒棒糖",
};

let consent = false;
const imgCache = new Map();
const isAbort = (e) => e && e.name === "AbortError";
const abortErr = () => Object.assign(new Error("superseded"), { name: "AbortError" });
const mbText = (n) => `${n < 10 ? n.toFixed(1) : Math.round(n)} MB`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const contain = (sw, sh, W, H, pad = 0) => {
  const s = Math.min((W - pad * 2) / sw, (H - pad * 2) / sh);
  return { s, x: (W - sw * s) / 2, y: (H - sh * s) / 2, w: sw * s, h: sh * s };
};

function loadImage(src) {
  if (!imgCache.has(src)) {
    imgCache.set(src, new Promise((ok, no) => {
      const i = new Image();
      i.crossOrigin = "anonymous";
      i.onload = () => ok(i);
      i.onerror = () => { imgCache.delete(src); no(new Error(`圖片載入失敗：${src}`)); };
      i.src = src;
    }));
  }
  return imgCache.get(src);
}

// Gate once per page visit, then make sure ml5.js itself is loaded.
async function startMl5(ctx, key, { icon, title, desc }) {
  if (!consent) {
    const need = (window.ml5 ? 0 : MB.lib) + MB[key];
    const what = MB[key] ? `ml5.js 與 ${NAME[key]}` : "ml5.js";
    await ctx.gate({
      icon, title,
      desc: `${desc}。推論都在瀏覽器內執行，圖片、鏡頭影像與文字不會上傳；之後切到其他場景會自動下載該場景的模型（2～14 MB）。`,
      tags: [`約 ${mbText(need)}`, "ml5.js 1.4.0", "TensorFlow.js WebGL"],
      button: `載入 ${what}（約 ${mbText(need)}）`,
    });
    consent = true;
  }
  if (!window.ml5) {
    const s = ctx.status(`下載 ml5.js（約 ${mbText(MB.lib)}）…`);
    try { await ctx.load(ML5_URL); await ml5.tf.ready(); } catch (e) { if (!isAbort(e)) s.error(`ml5.js 載入失敗：${e.message}`); throw e; }
    s.done();
  }
}

// ml5 wrappers keep the tf model at .model (detectors, sentiment) or .model.model (image classifiers).
function freeModel(m) {
  try {
    const inner = m && m.model && (typeof m.model.dispose === "function" ? m.model : m.model.model);
    if (inner && typeof inner.dispose === "function") inner.dispose();
  } catch (e) { console.warn("[ml5 demo] dispose failed", e); }
}

// One live model per scene; switching or leaving disposes the previous one.
function modelSlot(ctx) {
  let cur = null, seq = 0;
  ctx.onCleanup(() => { seq++; if (cur) freeModel(cur); cur = null; });
  return {
    get model() { return cur; },
    async use(key) {
      const my = ++seq;
      if (cur) { freeModel(cur); cur = null; }
      const s = ctx.status(`下載並初始化 ${NAME[key]} 模型（約 ${mbText(MB[key])}）…`);
      let m;
      try { m = await MAKE[key](); if (m && m.ready) await m.ready; } catch (e) {
        if (ctx.active) s.error(`${NAME[key]} 載入失敗：${e.message}`);
        throw e;
      }
      s.done();
      if (my !== seq || !ctx.active) { freeModel(m); throw abortErr(); }
      cur = m;
      return m;
    },
  };
}

// Surface async errors inside the scene instead of an unhandled rejection.
function guard(ctx, p) {
  return Promise.resolve(p).catch((e) => { if (!isAbort(e) && ctx.active) ctx.status("").error(`發生錯誤：${e.message}`); });
}

function canvasIn(ctx, host, onFit) {
  const cv = h("canvas");
  host.append(cv);
  const g = cv.getContext("2d");
  const st = { cv, g, w: 0, h: 0 };
  const fit = (first) => {
    const w = host.clientWidth, hh = host.clientHeight;
    if (!w || !hh || (w === st.w && hh === st.h)) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    st.w = w; st.h = hh;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (onFit) first === true ? queueMicrotask(() => ctx.active && onFit(st)) : onFit(st);
  };
  const ro = new ResizeObserver(() => fit());
  ro.observe(host);
  ctx.onCleanup(() => ro.disconnect());
  fit(true);
  return st;
}

function memTag(ctx, host = ctx.el) {
  const el = h("div", { class: "m5-mem" });
  host.append(el);
  const paint = () => {
    if (!window.ml5) return;
    const m = ml5.tf.memory();
    el.innerHTML = `張量 <b>${m.numTensors}</b>・<b>${(m.numBytes / 1048576).toFixed(1)}</b> MB・<b>${ml5.tf.getBackend()}</b>`;
  };
  ctx.interval(paint, 500);
  paint();
  return el;
}

function pressGroup(wrap, i) {
  wrap.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
}

function pill(g, text, x, y, color = "#f7df1e") {
  g.font = `600 12px ${FONT}`;
  const w = g.measureText(text).width + 14;
  g.fillStyle = "rgba(12,14,18,.8)";
  g.beginPath(); g.roundRect(x - w / 2, y - 10, w, 20, 10); g.fill();
  g.fillStyle = color; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(text, x, y + 0.5);
}

// Top-k bar list (label + percentage)
function barsIn(host, n) {
  host.innerHTML = "";
  const rows = Array.from({ length: n }, () => {
    const l = h("div", { class: "l" }), p = h("span", { class: "p" }), i = h("i");
    host.append(h("div", { class: "m5-bar" }, l, p, h("div", { class: "t" }, i)));
    return { l, p, i };
  });
  return (items) => rows.forEach((r, k) => {
    const it = items[k];
    const name = it ? String(it.label).split(",")[0].replace(/_/g, " ").trim() : "";
    r.l.innerHTML = it ? `<code>${esc(name)}</code>${ZH[name] ? `<span>${ZH[name]}</span>` : ""}` : "&nbsp;";
    r.p.textContent = it ? `${(it.confidence * 100).toFixed(1)}%` : "";
    r.i.style.width = it ? `${Math.max(1, it.confidence * 100)}%` : "0";
  });
}

// Rotating orthographic view of 3D keypoints (meters, y down).
function draw3D(v, pts, edges, angle, span) {
  const { g, w, h: H } = v;
  g.clearRect(0, 0, w, H);
  if (!pts || !pts.length) return;
  const n = pts.length;
  const m = pts.reduce((a, p) => ({ x: a.x + p.x / n, y: a.y + p.y / n, z: a.z + (p.z || 0) / n }), { x: 0, y: 0, z: 0 });
  const ca = Math.cos(angle), sa = Math.sin(angle), s = Math.min(w, H) / span, cx = w / 2, cy = H / 2 + 6;
  const P = pts.map((p) => {
    const x = p.x - m.x, y = p.y - m.y, z = (p.z || 0) - m.z;
    return { x: cx + (x * ca + z * sa) * s, y: cy + y * s, d: -x * sa + z * ca };
  });
  g.strokeStyle = "rgba(255,255,255,.08)"; g.lineWidth = 1;
  for (let k = -2; k <= 2; k++) {
    const off = k * span * 0.15 * s;
    g.beginPath(); g.moveTo(cx - span * 0.3 * s * ca + off * sa, H - 14 + off * 0.12); g.lineTo(cx + span * 0.3 * s * ca + off * sa, H - 14 + off * 0.12); g.stroke();
  }
  const order = edges.map((e, i) => [i, (P[e[0]].d + P[e[1]].d) / 2]).sort((a, b) => b[1] - a[1]);
  const dmax = Math.max(1e-6, ...P.map((p) => Math.abs(p.d)));
  g.lineCap = "round";
  for (const [i, d] of order) {
    const [a, b, color] = edges[i];
    g.globalAlpha = clamp(0.95 - (d / dmax) * 0.35, 0.35, 1);
    g.strokeStyle = color; g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(P[a].x, P[a].y); g.lineTo(P[b].x, P[b].y); g.stroke();
  }
  g.globalAlpha = 1;
}

const sideColor = (name) => (/^left/.test(name) ? "#4cc9f0" : /^right/.test(name) ? "#f72585" : "#f7df1e");
const jointAngle = (a, b, c) => {
  const u = [a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0)], v = [c.x - b.x, c.y - b.y, (c.z || 0) - (b.z || 0)];
  const dot = u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
  const nu = Math.hypot(...u), nv = Math.hypot(...v);
  return nu && nv ? (Math.acos(clamp(dot / (nu * nv), -1, 1)) * 180) / Math.PI : NaN;
};

// ---------- hand analysis (ported from the original demo) ----------
function extendedFingers(pts) {
  const fromWrist = (i) => dist(pts[i], pts[0]);
  const others = [[8, 6], [12, 10], [16, 14], [20, 18]].map(([tip, pip]) => fromWrist(tip) > fromWrist(pip) * 1.1);
  const palm = dist(pts[0], pts[9]);
  const thumb = dist(pts[4], pts[9]) > palm * 0.6 && dist(pts[4], pts[17]) > dist(pts[5], pts[17]) * 1.1;
  return [thumb, ...others];
}

function drawHand(g, P, p, fingers) {
  const lw = clamp(dist(P[0], P[9]) * 0.06, 2.2, 7);
  g.lineCap = "round"; g.lineJoin = "round";
  g.fillStyle = "rgba(255,255,255,.08)"; g.strokeStyle = "rgba(255,255,255,.35)"; g.lineWidth = 2;
  g.beginPath(); PALM.forEach((k, i) => (i ? g.lineTo(P[k].x, P[k].y) : g.moveTo(P[k].x, P[k].y))); g.fill(); g.stroke();
  FINGERS.forEach((f, fi) => {

function hslToRgb(hh, s, l) {
  const f = (n) => { const k = (n + hh / 30) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return [0, 0, l];
  const s = d / (1 - Math.abs(2 * l - 1));
  const hh = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [hh * 60, s, l];
}
// Ground-truth naming rule used to label the synthetic training set
function colorRule([r, g, b]) {
  const [hh, s, l] = rgbToHsl(r, g, b);
  if (s < 0.15 || l < 0.1 || l > 0.92) return "gray";
  if (hh >= 15 && hh < 45 && l < 0.38) return "brown";
  if (hh < 12 || hh >= 345) return l > 0.72 ? "pink" : "red";
  if (hh < 40) return "orange";
  if (hh < 68) return "yellow";
  if (hh < 165) return "green";
  if (hh < 195) return "cyan";
  if (hh < 255) return "blue";
  if (hh < 295) return "purple";
  return "pink";
}

        const PARTS = [["faceOval", "#f7df1e"], ["lips", "#f72585"], ["leftEye", "#4cc9f0"], ["rightEye", "#4cc9f0"], ["leftEyebrow", "#7bd389"], ["rightEyebrow", "#7bd389"]];

          pred = null; losses = []; drawMaps(); drawLoss();
          ctx.$("[data-r=acc]").textContent = "…"; ctx.$("[data-r=ans]").textContent = "訓練中…";
          const net = ml5.neuralNetwork({ task: "classification", debug: false, learningRate: 0.25, hiddenUnits: 32 });
          nn = net;
          for (let i = 0; i < 1200; i++) { const rgb = randRgb(); net.addData(rgb, [colorRule(rgb)]); }
          net.normalizeData();
          const total = epochs;
          training = net.train({ epochs: total, batchSize: 64 }, (epoch, logs) => {
            if (!ctx.active) return;
            losses.push(logs.loss); drawLoss();
            ctx.$("[data-r=ep]").textContent = `${epoch + 1}/${total}`;
            ctx.$("[data-r=loss]").textContent = logs.loss.toFixed(3);
          }, () => {}); // with a single callback ml5 treats it as the "finished" callback
          try { await training; } finally { training = null; }
          if (!ctx.active || nn !== net) return;
          const test = Array.from({ length: 300 }, randRgb);
          const tr = await net.classifyMultiple(test);
          if (!ctx.active || nn !== net) return;
          const ok = tr.filter((r, i) => r[0].label === colorRule(test[i])).length;
          ctx.$("[data-r=acc]").textContent = `${((ok / test.length) * 100).toFixed(1)}%`;
          const pm = await net.classifyMultiple(grid);
          if (!ctx.active || nn !== net) return;
          pred = pm.map((r) => r[0].label);
          drawMaps();
          trainBtn.disabled = false;
        }
        ctx.interval(async () => {
          if (!nn || training || !pred) return;
          const net = nn, rgb = randRgb();
          const r = await net.classify(rgb);
          if (!ctx.active || net !== nn) return;
          const want = COLOR_BY[colorRule(rgb)], got = COLOR_BY[r[0].label];
          ctx.$("[data-r=sw]").style.background = `rgb(${rgb})`;
          ctx.$("[data-r=ans]").innerHTML = `模型：<b>${got.t}</b>（${(r[0].confidence * 100).toFixed(0)}%）<br>規則：${want.t}　${got === want ? "✔ 一致" : "✘ 不同"}`;
        }, 1300);
        await train();
      },
    },

    // 7 ---------------------------------------------------------------------------------
    {
      id: "sentiment", title: "情緒分析",
      api: "ml5.sentiment(\"MovieReviews\") → predict(text)",
      desc: "以 IMDB 影評訓練的情緒模型，輸出 0（負面）到 1（正面）的分數，只認得英文單字。這裡把句子從第一個字開始逐字加長，每個前綴都預測一次，畫出分數怎麼隨著讀到的字改變；字的底色代表該字讓分數上升（綠）或下降（紅）。",
      hint: "切換範例句子，或在輸入框打英文句子後按「分析」",
      async mount(ctx) {
        await startMl5(ctx, "sentiment", { icon: "💬", title: "情緒分析", desc: "sentiment 模型判斷英文句子是正面還是負面" });
        ctx.html(`<div class="m5-wrap m5-sent"><div class="m5-words" data-r="words">準備中…</div><div class="m5-box" data-r="main"></div></div>`);
        let idx = 0, auto = true, seq = 0, curve = [], words = [], shownAt = 0;
        const seg = ctx.group(SENTENCES.map((_, i) => `例句 ${i + 1}`), 0, (i) => { auto = false; autoBtn.setAttribute("aria-pressed", "false"); idx = i; guard(ctx, analyze(SENTENCES[i])); });
        const autoBtn = ctx.toggle("自動輪播", true, (v) => (auto = v));
        const input = h("input", { class: "m5-input", type: "text", placeholder: "輸入英文句子，例如 What a great day", maxlength: "160" });
        ctx.controls.append(input);
        const go = () => { const v = input.value.trim(); if (!v) return; auto = false; autoBtn.setAttribute("aria-pressed", "false"); pressGroup(seg, -1); guard(ctx, analyze({ en: v, zh: "" })); };
        ctx.button("分析", go);
        ctx.on(input, "keydown", (e) => { if (e.key === "Enter") go(); });
        const main = ctx.$("[data-r=main]");
        const view = canvasIn(ctx, main);
        memTag(ctx, main);
        const slot = modelSlot(ctx);
        const model = await slot.use("sentiment");
        async function analyze(s) {
          const my = ++seq;
          if (SENTENCES.includes(s)) pressGroup(seg, SENTENCES.indexOf(s));
          const ws = s.en.split(/\s+/).filter(Boolean).slice(0, 24);
          const scores = [];
          for (let k = 1; k <= ws.length; k++) {
            const r = await model.predict(ws.slice(0, k).join(" "));
            if (my !== seq || !ctx.active) return;
            scores.push(r.confidence);
          }
          words = ws; curve = scores; shownAt = performance.now();
          const box = ctx.$("[data-r=words]");
          box.innerHTML = "";
          ws.forEach((wd, i) => {
            const d = scores[i] - (i ? scores[i - 1] : 0.5);
            const a = clamp(Math.abs(d) * 2.2, 0, 0.75);
            box.append(h("span", { class: "off", style: `background:${d >= 0 ? `rgba(123,211,137,${a})` : `rgba(247,37,133,${a})`}`, title: `${d >= 0 ? "+" : ""}${d.toFixed(3)}` }, wd));
          });
          if (s.zh) box.append(h("small", { text: s.zh }));
        }
        ctx.interval(() => { if (auto) { idx = (idx + 1) % SENTENCES.length; guard(ctx, analyze(SENTENCES[idx])); } }, 5200);
        await analyze(SENTENCES[0]);
        ctx.raf((t) => {
          const { g, w, h: H } = view;
          g.clearRect(0, 0, w, H);
          const L = 46, R = 18, T = 20, B = 30, pw = w - L - R, ph = H - T - B;
          g.font = `500 11px ${MONO}`; g.textAlign = "right"; g.textBaseline = "middle";
          [0, 0.25, 0.5, 0.75, 1].forEach((v) => {
            const y = T + (1 - v) * ph;
            g.strokeStyle = v === 0.5 ? "rgba(255,255,255,.35)" : "rgba(255,255,255,.08)"; g.setLineDash(v === 0.5 ? [5, 5] : []);
            g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke();
            g.fillStyle = "#9b998f"; g.fillText(v.toFixed(2), L - 6, y);
          });
          g.setLineDash([]);
          g.font = `500 11px ${FONT}`; g.textAlign = "right"; g.fillStyle = "#7bd389"; g.fillText("正面", L - 6, T + ph * 0.125);
          g.fillStyle = "#f72585"; g.fillText("負面", L - 6, T + ph * 0.875);
          if (!curve.length) return;
          const n = curve.length, shown = clamp(((t - shownAt) / 1800) * n, 1, n);
          const X = (i) => L + (n === 1 ? pw / 2 : (i / (n - 1)) * pw), Y = (v) => T + (1 - v) * ph;
          const spans = ctx.$$("[data-r=words] span");
          spans.forEach((sp, i) => sp.classList.toggle("off", i >= Math.ceil(shown)));
          g.lineWidth = 3; g.lineJoin = "round";
          for (let i = 1; i < Math.ceil(shown); i++) {
            const f = Math.min(1, shown - i);
            const x0 = X(i - 1), y0 = Y(curve[i - 1]), x1 = X(i), y1 = Y(curve[i]);
            g.strokeStyle = `hsl(${clamp(curve[i], 0, 1) * 130 + 330},80%,62%)`;
            g.beginPath(); g.moveTo(x0, y0); g.lineTo(x0 + (x1 - x0) * f, y0 + (y1 - y0) * f); g.stroke();
          }
          for (let i = 0; i < Math.floor(shown); i++) {
            g.fillStyle = `hsl(${clamp(curve[i], 0, 1) * 130 + 330},80%,62%)`;
            g.beginPath(); g.arc(X(i), Y(curve[i]), 4, 0, Math.PI * 2); g.fill();
            if (n <= 16 || i % 2 === 0) {
              g.save(); g.translate(X(i), T + ph + 8); g.rotate(-0.5); g.font = `500 10.5px ${FONT}`; g.fillStyle = "#9b998f"; g.textAlign = "right";
              g.fillText(words[i], 0, 0); g.restore();
            }
          }
          const fin = curve[Math.max(0, Math.floor(shown) - 1)];
          // Big score sits in the half of the plot opposite to the latest point.
          const sy = fin >= 0.5 ? T + ph * 0.62 : T + ph * 0.1;
          g.textAlign = "right"; g.textBaseline = "top";
          g.font = `800 30px ${MONO}`; g.fillStyle = fin >= 0.5 ? "#7bd389" : "#f72585";
          g.fillText(fin.toFixed(2), L + pw - 4, sy);
          g.font = `600 12.5px ${FONT}`; g.fillText(fin >= 0.5 ? "偏正面" : "偏負面", L + pw - 4, sy + 36);
        });
      },
    },

    // 8 ---------------------------------------------------------------------------------
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "for (n 次) await model.detect / classify / predict(input)",
      desc: "同一個輸入連續推論 n 次（一次一張，等上一次完成才送下一次），量出每秒可推論幾次。切換模型後再測一次，右側長條圖會累積各模型的結果；「首次推論」包含 WebGL shader 編譯，通常比之後慢很多。",
      hint: "先在下方選模型（未下載的會先下載），再按「開始測試」",
      async mount(ctx) {
        await startMl5(ctx, "hand", { icon: "⏱️", title: "推論速度極限測試", desc: "連續推論 n 次，量出各模型每秒推論次數" });
        ctx.html(`<div class="m5-stress m5-box"></div>`);
        const box = ctx.$(".m5-stress");
        const tag = memTag(ctx, box);
        tag.style.cssText = "left:auto;right:10px;top:8px;bottom:auto;";
        const KEYS = ["hand", "body", "face", "mobilenet", "doodle", "sentiment"];
        const doodle = h("canvas", { width: 280, height: 280 });
        { const g = doodle.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, 280, 280); g.lineWidth = 16; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = "#111"; DOODLES[1].strokes.forEach((st) => { g.beginPath(); st.forEach(([x, y], i) => (i ? g.lineTo(x * 280, y * 280) : g.moveTo(x * 280, y * 280))); g.stroke(); }); }
        const INPUT = {
          hand: () => loadImage(MP + "thumb_up.jpg"), body: () => loadImage(MP + "pose.jpg"), face: () => loadImage(MP + "portrait.jpg"),
          mobilenet: () => loadImage("_shared/img/photo-7.jpg"), doodle: async () => doodle, sentiment: async () => SENTENCES[0].en,
        };
        const INFER = {
          hand: (m, x) => m.detect(x), body: (m, x) => m.detect(x), face: (m, x) => m.detect(x),
          mobilenet: (m, x) => m.classify(x, 5), doodle: (m, x) => m.classify(x, 5), sentiment: (m, x) => m.predict(x),
        };
        const results = {}, first = {};
        let key = "hand", ready = null;
        const slot = modelSlot(ctx);
        const view = canvasIn(ctx, box, () => draw());
        function draw() {
          const { g, w, h: H } = view;
          g.clearRect(0, 0, w, H);
          const L = Math.min(150, w * 0.36), R = 74, T = 46, rowH = Math.min(52, (H - T - 20) / KEYS.length);
          g.font = `600 13px ${FONT}`; g.fillStyle = "#ecebe6"; g.textAlign = "left"; g.textBaseline = "alphabetic";
          g.fillText("每秒推論次數（一次一筆，連續呼叫）", 14, 26);
          const best = Math.max(1, ...Object.values(results).map((r) => r.rate));
          KEYS.forEach((k, i) => {
            const y = T + i * rowH, bh = Math.max(10, rowH * 0.42);
            g.font = `600 12px ${MONO}`; g.textAlign = "right"; g.textBaseline = "middle";
            g.fillStyle = k === key ? "#f7df1e" : "#ecebe6";
            g.fillText(NAME[k].replace("bodyPose（MoveNet）", "MoveNet"), L - 10, y + bh / 2);
            g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(L, y, w - L - R, bh);
            const r = results[k];
            g.textAlign = "left"; g.font = `500 10.5px ${FONT}`; g.fillStyle = "#9b998f";
            g.fillText(first[k] != null ? `首次推論 ${first[k].toFixed(0)} ms${r ? `・n=${r.n}` : ""}` : "未測", L, y + bh + 10);
            if (!r) return;
            g.fillStyle = FINGERS[i % 5].color;
            g.fillRect(L, y, ((w - L - R) * r.rate) / best, bh);
            g.font = `700 12.5px ${MONO}`; g.fillStyle = "#ecebe6";
            g.fillText(r.rate.toFixed(1), L + ((w - L - R) * r.rate) / best + 6, y + bh / 2);
          });
        }
        function choose(k) {
          key = k; draw();
          ready = (async () => {
            const [m, x] = await Promise.all([slot.use(k), INPUT[k]()]);
            if (first[k] == null) { const t0 = performance.now(); await INFER[k](m, x); first[k] = performance.now() - t0; draw(); }
            return { m, x, k };
          })();
          guard(ctx, ready);
        }
        const sel = ctx.select("模型", KEYS.map((k) => ({ value: k, label: `${NAME[k]}（${mbText(MB[k])}）` })), "hand", (v) => choose(v));
        ctx.controls.classList.add("bottom");
        choose("hand");
        const bench = ctx.bench({
          label: "連續推論", unit: "次", sizes: [1, 5, 10, 25, 50, 100, 200, 400], target: 1000, budget: 3000,
          note: "一次一筆、等上一次完成才送下一次；時間含讀回結果。右側長條取最大完成級距的速率。",
          async run(n) {
            const { m, x, k } = await ready;
            const n0 = ml5.tf.memory().numTensors;
            const t0 = performance.now();
            for (let i = 0; i < n; i++) await INFER[k](m, x);
            const dt = performance.now() - t0;
            const rate = n / (dt / 1000);
            results[k] = { rate, n };
            draw();
            const dn = ml5.tf.memory().numTensors - n0;
            return `${rate.toFixed(1)} 次/秒${dn ? `・張量 +${dn}` : ""}`;
          },
        });
        const runBtn = bench.panel.querySelector("[data-sc-run]");
        ctx.interval(() => (sel.disabled = runBtn.disabled), 250);
      },
    },
  ],
});
</script>
</body>
