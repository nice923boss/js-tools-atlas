<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>model-viewer 示範：AR 商品展示頁</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"手機開啟時會出現 AR 按鈕，可把機器人放到現實桌面上"}</script>
<style>
  body { background: radial-gradient(ellipse 70% 60% at 58% 45%, #2a2e38, var(--bg) 75%); }
  model-viewer { position: fixed; inset: 0; width: 100%; height: 100%; background: transparent; --poster-color: transparent; --progress-bar-color: var(--accent); }
  .btn { padding: 7px 10px; font-size: 12px; }
  .controls { max-width: min(330px, calc(100% - 24px)); }

  /* Hotspots live in the 3D scene; model-viewer moves them and sets data-visible */
  .hotspot {
    position: relative; width: 24px; height: 24px; padding: 0; border-radius: 50%;
    border: 2px solid #fff; background: var(--accent); color: var(--accent-ink);
    font: 700 12px/1 var(--font); cursor: pointer;
    box-shadow: 0 0 0 5px rgba(247, 223, 30, 0.25), 0 2px 8px rgba(0, 0, 0, 0.5);
    transition: opacity 0.3s, transform 0.2s;
  }
  .hotspot:hover { transform: scale(1.12); }
  .hotspot:not([data-visible]) { opacity: 0.2; pointer-events: none; }
  .hotspot .anno {
    position: absolute; left: 32px; top: 50%; transform: translateY(-50%);
    padding: 5px 9px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
    color: var(--fg); font: 500 12px/1.4 var(--font); white-space: nowrap; text-align: left; backdrop-filter: blur(6px);
  }
  .hotspot.left .anno { left: auto; right: 32px; }
  .hotspot .anno small { display: none; color: var(--muted); font-size: 11px; }
  .hotspot.open .anno small { display: block; }
  .hotspot.open { background: #fff; }

  #card { position: fixed; left: 12px; top: 12px; z-index: 50; width: 220px; padding: 12px 14px; }
  #card .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  #card h1 { margin: 6px 0 0; font-size: 17px; line-height: 1.3; }
  #card .price { color: var(--accent); font-weight: 700; font-size: 15px; margin: 2px 0 8px; }
  #card .sw { display: flex; gap: 7px; margin: 6px 0 8px; }
  #card .sw button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  #card .sw button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  #card .ar { font-size: 11px; color: var(--muted); line-height: 1.5; }
  #arBtn { position: fixed; left: 50%; bottom: 52px; transform: translateX(-50%); }

  @media (max-width: 560px) {
    #card { top: auto; bottom: 48px; left: 8px; right: 8px; width: auto; padding: 8px 12px; display: grid; grid-template-columns: 1fr auto; column-gap: 10px; }
    #card h1 { font-size: 14px; margin: 2px 0 0; }
    #card .price { margin: 0; font-size: 13px; }
    #card .sw { grid-row: 1 / span 3; grid-column: 2; align-self: center; flex-wrap: wrap; width: 82px; gap: 5px; margin: 0; }
    #card .ar, #card .swl { display: none; }
    model-viewer { bottom: 118px; height: auto; }
    .hotspot .anno { font-size: 11px; padding: 3px 7px; }
    .hotspot:not(.open) .anno { display: none; }
    .hotspot .anno, .hotspot.left .anno { left: 50%; right: auto; top: 32px; transform: translateX(-50%); white-space: normal; width: 150px; }
  }
</style>
</head>
<body>
<model-viewer id="mv" src="_shared/models/robot.glb" alt="可互動的 3D 機器人商品模型"
  camera-controls touch-action="pan-y" auto-rotate-delay="4000" rotation-per-second="14deg"
  camera-orbit="5deg 76deg auto" interaction-prompt="none"
  environment-image="_shared/img/panorama.jpg" exposure="1.05" tone-mapping="neutral"
  shadow-intensity="1.3" shadow-softness="0.7"
  animation-name="Idle" autoplay
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto">
  <button class="hotspot" slot="hotspot-head" data-surface="2 2 375 376 377 0.605 0.299 0.096" data-visibility-attribute="visible">1<span class="anno">頭燈感測器<small>雙眼內建距離感測，夜間自動補光</small></span></button>
  <button class="hotspot" slot="hotspot-arm" data-surface="13 0 162 163 164 0.588 0.246 0.165" data-visibility-attribute="visible">2<span class="anno">強化手臂<small>可舉 2 公斤，關節防夾設計</small></span></button>
  <button class="hotspot left" slot="hotspot-foot" data-surface="3 0 56 58 59 0.326 0.311 0.362" data-visibility-attribute="visible">3<span class="anno">防滑腳底<small>矽膠紋路，木地板與磁磚都穩</small></span></button>
  <button slot="ar-button" id="arBtn" class="btn primary">📱 放到你的空間</button>
</model-viewer>

<div id="card" class="panel">
  <div><span class="badge">示意商品</span>
  <h1>RX-01 陪伴機器人</h1>
  <div class="price">NT$ 12,900</div></div>
  <div class="swl muted" style="font-size:11px">機身配色</div>
  <div class="sw" id="sw"></div>
  <div class="ar">✓ 支援 AR：手機上可直接擺到桌面<br>✓ 拖曳 360° 檢視・點編號看細節</div>
</div>
<div class="controls" id="anims"></div>
<div class="hint">拖曳旋轉・滾輪縮放・點黃色編號拉近看說明</div>

<script type="module">
import "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.2.0/dist/model-viewer.min.js";

const mv = document.getElementById("mv");
// Orbits are relative to the robot (it faces +Z); auto-rotate spins the model itself,
// so the current turntable angle is added when the camera moves.
const HOME_ORBIT = [40, "78deg auto"];
const relOrbit = ([theta, rest]) => `${theta + (mv.turntableRotation * 180) / Math.PI}deg ${rest}`;
const ANIMS = [["Idle", "待機", true], ["Wave", "揮手", false], ["ThumbsUp", "比讚", false], ["Dance", "跳舞", true], ["Jump", "跳躍", false]];
const COLORS = [["原廠", null], ["湖水藍", "#4cc9f0"], ["桃紅", "#f72585"], ["薄荷綠", "#7bd389"], ["石墨黑", "#2b2f36"]];

// Animation chips: loops keep playing, one-shots return to the last loop
const animBox = document.getElementById("anims");
let lastLoop = "Idle";
function playAnim(name, loop) {
  mv.animationName = name;
  mv.play(loop ? undefined : { repetitions: 1 });
  if (loop) lastLoop = name;
  animBox.querySelectorAll(".btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === name)));
}
mv.addEventListener("finished", () => playAnim(lastLoop, true));
for (const [k, label, loop] of ANIMS) {
  const b = document.createElement("button");
  b.className = "btn";
  b.dataset.k = k;
  b.textContent = label;
  b.setAttribute("aria-pressed", String(k === "Idle"));
  b.addEventListener("click", () => playAnim(k, loop));
  animBox.append(b);
}

// Color swatches change the "Main" material through the scene-graph API
const swBox = document.getElementById("sw");
let mainMat, originalColor;
for (const [label, hex] of COLORS) {
  const b = document.createElement("button");
  b.title = label;
  b.setAttribute("aria-label", label);
  b.style.background = hex || "conic-gradient(#f2c14e 0 50%, #6d7380 0)";
  b.setAttribute("aria-pressed", String(hex === null));
  b.addEventListener("click", () => {
    if (!mainMat) return;
    mainMat.pbrMetallicRoughness.setBaseColorFactor(hex || originalColor);
    swBox.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  });
  swBox.append(b);
}

// Hotspots use data-surface (mesh + triangle + barycentric), so they stick to the animated mesh.
// Per-hotspot close-up orbit: theta relative to the robot, phi, camera distance
const SPOT_ORBIT = { "hotspot-head": [45, "72deg 8m"], "hotspot-arm": [70, "80deg 8m"], "hotspot-foot": [35, "80deg 7.5m"] };
mv.addEventListener("load", () => {
  mainMat = mv.model.materials.find((m) => m.name === "Main") || mv.model.materials[0];
  originalColor = [...mainMat.pbrMetallicRoughness.baseColorFactor];
  mv.cameraOrbit = relOrbit(HOME_ORBIT); // short intro glide from the attribute orbit
  setTimeout(() => { if (!openSpot) mv.autoRotate = true; }, 9000);
});

// Clicking a hotspot flies the camera to it and expands its description
let openSpot = null;
for (const h of mv.querySelectorAll(".hotspot")) {
  h.addEventListener("click", (e) => {
    e.stopPropagation();
    if (openSpot === h) { closeSpot(); return; }
    closeSpot();
    openSpot = h;
    h.classList.add("open");
    mv.autoRotate = false;
    const q = mv.queryHotspot(h.slot);
    if (q) mv.cameraTarget = q.position.toString();
    mv.cameraOrbit = relOrbit(SPOT_ORBIT[h.slot]);
  });
}
function closeSpot() {
  if (!openSpot) return;
  openSpot.classList.remove("open");
  openSpot = null;
  mv.cameraTarget = "auto auto auto";
  mv.cameraOrbit = relOrbit(HOME_ORBIT);
  mv.autoRotate = true;
}
mv.addEventListener("click", closeSpot);
</script>
</body>
</html>
