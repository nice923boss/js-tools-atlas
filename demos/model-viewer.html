<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>model-viewer 示範：八個場景看懂 3D 展示元件與上限</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="_shared/showcase.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"手機開啟時會出現 AR 按鈕，可把機器人放到現實桌面上","scenes":["商品頁","相機控制","環境光與曝光","表面標註","動畫切換","材質 API","截圖與 AR","極限測試"]}</script>
<style>
  model-viewer { display: block; width: 100%; height: 100%; background: transparent; --poster-color: transparent; --progress-bar-color: var(--accent); }
  .full { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 4px) 0 calc(var(--sc-ctl-b, 0px) + 4px); }
  .glow { background: radial-gradient(ellipse 70% 60% at 58% 45%, #2a2e38, var(--bg) 75%); }
  .muted { color: var(--muted); }
  code { font: 500 11px/1.4 var(--mono); }

  /* Hotspots live in the 3D scene; model-viewer moves them and sets data-visible */
  .hotspot {
    position: relative; width: 24px; height: 24px; padding: 0; border-radius: 50%;
    border: 2px solid #fff; background: var(--accent); color: var(--accent-ink);
    font: 700 12px/1 var(--font); cursor: pointer;
    box-shadow: 0 0 0 5px rgba(247, 223, 30, 0.25), 0 2px 8px rgba(0, 0, 0, 0.5);
    transition: opacity 0.3s, transform 0.2s;
  }
  .hotspot:hover { transform: scale(1.12); }
  .hotspot:not([data-visible]) { opacity: 0.2; }
  .hotspot .anno {
    position: absolute; left: 32px; top: 50%; transform: translateY(-50%);
    padding: 5px 9px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line);
    color: var(--fg); font: 500 12px/1.4 var(--font); white-space: nowrap; text-align: left; backdrop-filter: blur(6px);
  }
  .hotspot.left .anno { left: auto; right: 32px; }
  .hotspot .anno small { display: none; color: var(--muted); font-size: 11px; }
  .hotspot.open .anno small { display: block; }
  .hotspot.open { background: #fff; }
  .hotspot.pin { background: var(--c2); width: 20px; height: 20px; font-size: 11px; box-shadow: 0 0 0 4px rgba(76, 201, 240, 0.25), 0 2px 8px rgba(0, 0, 0, 0.5); }
  .dim { padding: 3px 8px; border-radius: 999px; background: var(--c3); color: #fff; border: 0; font: 600 11px/1.3 var(--mono); white-space: nowrap; pointer-events: none; }
  .dim:not([data-visible]) { opacity: 0.35; }

  /* 1. product page */
  .shop { position: absolute; inset: 0; }
  .shop model-viewer { position: absolute; inset: 0; }
  .mv-card { position: absolute; left: 10px; top: 10px; z-index: 50; width: 220px; padding: 12px 14px; }
  .mv-card .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .mv-card h1 { margin: 6px 0 0; font-size: 17px; line-height: 1.3; }
  .mv-card .price { color: var(--accent); font-weight: 700; font-size: 15px; margin: 2px 0 8px; }
  .mv-card .sw { display: flex; gap: 7px; margin: 6px 0 8px; }
  .mv-card .sw button { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .mv-card .sw button[aria-pressed="true"] { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .mv-card .ar { font-size: 11px; color: var(--muted); line-height: 1.5; }
  .ar-btn { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); }
  @media (max-width: 560px) {
    .mv-card { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; padding: 8px 12px; display: grid; grid-template-columns: 1fr auto; column-gap: 10px; }
    .mv-card h1 { font-size: 14px; margin: 2px 0 0; }
    .mv-card .price { margin: 0; font-size: 13px; }
    .mv-card .sw { grid-row: 1 / span 3; grid-column: 2; align-self: center; flex-wrap: wrap; width: 82px; gap: 5px; margin: 0; }
    .mv-card .ar, .mv-card .swl { display: none; }
    .shop model-viewer { top: var(--sc-ctl-h, 0px); bottom: 84px; height: auto; }
    .hotspot .anno { font-size: 11px; padding: 3px 7px; }
    .hotspot:not(.open) .anno { display: none; }
    .hotspot .anno, .hotspot.left .anno { left: 50%; right: auto; top: 30px; transform: translateX(-50%); white-space: normal; width: 140px; }
  }

  /* shared readout / side panel layouts */
  .readout { position: absolute; left: 10px; bottom: 10px; z-index: 40; padding: 8px 11px; font: 500 11.5px/1.6 var(--mono); color: var(--muted); min-width: 190px; }
  .readout b { color: var(--fg); font-weight: 600; }
  .duo { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 8px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px;
    grid-template-columns: minmax(0, 1fr) 270px; }
  .duo .view { position: relative; min-width: 0; min-height: 0; }
  .side { min-height: 0; overflow: auto; padding: 10px 12px; font-size: 12.5px; display: flex; flex-direction: column; gap: 8px; }
  .side h3 { margin: 0; font-size: 13px; }
  .side p { margin: 0; line-height: 1.5; }
  .side ol, .side ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .side li { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .side li code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .num { flex: none; display: inline-grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; background: var(--c2); color: #111; font: 700 10.5px/1 var(--font); }
  .num.y { background: var(--accent); }
  @media (max-width: 760px) { .duo { grid-template-columns: minmax(0, 1fr) 220px; } }
  @media (max-width: 520px) {
    .duo { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, auto); }
    .side { max-height: 150px; padding: 8px 10px; }
    .side .long { display: none; }
  }

  /* 3. lighting trio */
  .trio { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 8px) 10px 10px; display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .pane { position: relative; margin: 0; min-width: 0; min-height: 0; overflow: hidden; padding: 0; }
  .pane figcaption { position: absolute; left: 8px; right: 8px; bottom: 7px; font-size: 11.5px; color: var(--muted); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pane figcaption b { color: var(--fg); display: block; font-size: 12.5px; }
  @media (max-width: 760px) {
    .trio { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .trio .legacy { display: none; }
  }
  @media (max-width: 520px) { .trio { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); } }

  /* 5. animation */
  .chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  .chips .btn { padding: 6px 8px; font-size: 12px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips .btn small { color: var(--muted); font: 500 10.5px/1 var(--mono); margin-left: 4px; }
  .chips .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chips .btn[aria-pressed="true"] small { color: var(--accent-ink); }
  .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; background: var(--c4); }
  .log { font: 500 11px/1.55 var(--mono); color: var(--muted); min-height: 5.2em; }
  .log b { color: var(--c5); font-weight: 600; }
  @media (max-width: 760px) { .chips .btn small { display: none; } }
  @media (max-width: 520px) { .chips { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  /* 6. materials */
  .mats li { cursor: pointer; padding: 5px 6px; border-radius: 8px; border: 1px solid transparent; }
  .mats li[aria-selected="true"] { border-color: var(--accent); background: rgba(247, 223, 30, 0.08); }
  .mats li span:last-child { margin-left: auto; font: 500 10.5px/1 var(--mono); color: var(--muted); }
  .chip { flex: none; width: 18px; height: 18px; border-radius: 5px; border: 1px solid var(--line); }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; }
  .colors button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
  .colors button.reset { width: auto; border-radius: 8px; padding: 0 8px; background: var(--panel); color: var(--fg); font-size: 11.5px; }

  /* 7. snapshots */
  .shots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .shots figure { margin: 0; aspect-ratio: 4 / 3; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); position: relative; overflow: hidden; }
  .shots img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .shots figcaption { position: absolute; left: 5px; bottom: 3px; font-size: 10.5px; color: var(--muted); }
  .side dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 8px; font-size: 11.5px; }
  .side dt { font: 500 11px/1.5 var(--mono); color: var(--c2); }
  .side dd { margin: 0; line-height: 1.5; color: var(--muted); }
  .side a { color: var(--accent); }
  @media (max-width: 520px) { .shots { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  /* 8. stress grid */
  .mv-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; display: grid; gap: 4px; }
  .mv-stress model-viewer { min-width: 0; min-height: 0; width: 100%; height: 100%; border-radius: 6px; background: var(--bg-2); }
  @media (max-width: 760px) { .mv-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); opacity: 0.9; } }
</style>
</head>
<body>
<script src="_shared/showcase.js"></script>
<script type="module">
import "https://cdn.jsdelivr.net/npm/@google/model-viewer@4.2.0/dist/model-viewer.min.js";

const MODEL = "_shared/models/robot.glb";
const PANO = "_shared/img/panorama.jpg";
const deg = (rad) => (rad * 180) / Math.PI;

// Resolve when the model is ready; shows a progress overlay meanwhile.
function whenLoaded(ctx, mv, label = "載入 robot.glb…") {
  if (mv.loaded) return Promise.resolve(mv);
  const st = ctx.status(label);
  const onProgress = (e) => st.progress(e.detail.totalProgress);
  mv.addEventListener("progress", onProgress);
  return new Promise((resolve, reject) => {
    mv.addEventListener("load", () => { mv.removeEventListener("progress", onProgress); st.done(); resolve(mv); }, { once: true });
    mv.addEventListener("error", () => { st.error("模型載入失敗"); reject(new Error("robot.glb failed to load")); }, { once: true });
  });
}

// Linear glTF color factor -> CSS color for UI swatches
const cssColor = ([r, g, b]) => `rgb(${[r, g, b].map((v) => Math.round(Math.pow(Math.max(0, v), 1 / 2.2) * 255)).join(",")})`;

Showcase.run({
  scenes: [
    {
      id: "shop",
      title: "商品頁",
      api: "hotspot + materials + animation-name",
      desc: "原版商品頁：data-surface 標註黏在會動的網格上，色票用 materials API 換主色，動作晶片切換 glTF 內建動畫，手機上會出現 AR 按鈕。",
      hint: "拖曳旋轉・滾輪縮放・點黃色編號拉近看說明",
      async mount(ctx) {
        ctx.html(`<div class="shop glow">
          <model-viewer src="${MODEL}" alt="可互動的 3D 機器人商品模型"
            camera-controls touch-action="pan-y" auto-rotate-delay="4000" rotation-per-second="14deg"
            camera-orbit="5deg 76deg auto" interaction-prompt="none"
            environment-image="${PANO}" exposure="1.05" tone-mapping="neutral"
            shadow-intensity="1.3" shadow-softness="0.7" animation-name="Idle" autoplay
            ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto">
            <button class="hotspot" slot="hotspot-head" data-surface="2 2 375 376 377 0.605 0.299 0.096" data-visibility-attribute="visible">1<span class="anno">頭燈感測器<small>雙眼內建距離感測，夜間自動補光</small></span></button>
            <button class="hotspot" slot="hotspot-arm" data-surface="13 0 162 163 164 0.588 0.246 0.165" data-visibility-attribute="visible">2<span class="anno">強化手臂<small>可舉 2 公斤，關節防夾設計</small></span></button>
            <button class="hotspot left" slot="hotspot-foot" data-surface="3 0 56 58 59 0.326 0.311 0.362" data-visibility-attribute="visible">3<span class="anno">防滑腳底<small>矽膠紋路，木地板與磁磚都穩</small></span></button>
            <button slot="ar-button" class="btn primary ar-btn">📱 放到你的空間</button>
          </model-viewer>
          <div class="mv-card panel">
            <div><span class="badge">示意商品</span><h1>RX-01 陪伴機器人</h1><div class="price">NT$ 12,900</div></div>
            <div class="swl muted" style="font-size:11px">機身配色</div>
            <div class="sw"></div>
            <div class="ar">✓ 支援 AR：手機上可直接擺到桌面<br>✓ 拖曳 360° 檢視・點編號看細節</div>
          </div>
        </div>`);
        const mv = ctx.$("model-viewer");
        const HOME = [40, "78deg auto"];
        const SPOT = { "hotspot-head": [45, "72deg 8m"], "hotspot-arm": [70, "80deg 8m"], "hotspot-foot": [35, "80deg 7.5m"] };
        // Orbits are relative to the robot; auto-rotate spins the model, so add the turntable angle.
        const relOrbit = ([theta, rest]) => `${theta + deg(mv.turntableRotation)}deg ${rest}`;

        const ANIMS = [["Idle", "待機", true], ["Wave", "揮手", false], ["ThumbsUp", "比讚", false], ["Dance", "跳舞", true], ["Jump", "跳躍", false]];
        let lastLoop = 0;
        const seg = ctx.group(ANIMS.map((a) => a[1]), 0, (i) => playAnim(i));
        function playAnim(i) {
          const [name, , loop] = ANIMS[i];
          mv.animationName = name;
          mv.play(loop ? undefined : { repetitions: 1 });
          if (loop) lastLoop = i;
          seg.querySelectorAll(".btn").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
        }
        ctx.on(mv, "finished", () => playAnim(lastLoop));

        const COLORS = [["原廠", null], ["湖水藍", "#4cc9f0"], ["桃紅", "#f72585"], ["薄荷綠", "#7bd389"], ["石墨黑", "#2b2f36"]];
        const sw = ctx.$(".sw");
        let mainMat, originalColor;
        for (const [label, hex] of COLORS) {
          const b = Showcase.h("button", { type: "button", title: label, "aria-label": label, "aria-pressed": String(hex === null) });
          b.style.background = hex || "conic-gradient(#f2c14e 0 50%, #6d7380 0)";
          b.addEventListener("click", () => {
            if (!mainMat) return;
            mainMat.pbrMetallicRoughness.setBaseColorFactor(hex || originalColor);
            sw.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
          });
          sw.append(b);
        }

        let openSpot = null;
        const closeSpot = () => {
          if (!openSpot) return;
          openSpot.classList.remove("open");
          openSpot = null;
          mv.cameraTarget = "auto auto auto";
          mv.cameraOrbit = relOrbit(HOME);
          mv.autoRotate = true;
        };
        for (const spot of ctx.$$(".hotspot")) {
          ctx.on(spot, "click", (e) => {
            e.stopPropagation();
            if (openSpot === spot) { closeSpot(); return; }
            closeSpot();
            openSpot = spot;
            spot.classList.add("open");
            mv.autoRotate = false;
            const q = mv.queryHotspot(spot.slot);
            if (q) mv.cameraTarget = q.position.toString();
            mv.cameraOrbit = relOrbit(SPOT[spot.slot]);
          });
        }
        ctx.on(mv, "click", closeSpot);

        await whenLoaded(ctx, mv);
        mainMat = mv.model.materials.find((m) => m.name === "Main") || mv.model.materials[0];
        originalColor = [...mainMat.pbrMetallicRoughness.baseColorFactor];
        mv.cameraOrbit = relOrbit(HOME);
        ctx.timeout(() => { if (!openSpot) mv.autoRotate = true; }, 6000);
      },
    },

    {
      id: "camera",
      title: "相機控制",
      api: "camera-orbit / field-of-view / camera-change",
      desc: "camera-orbit 以「水平角 仰角 距離」描述相機，改屬性會平滑飛過去（interpolation-decay 控制速度），jumpCameraToGoal() 則瞬間到位；camera-change 事件回報每一次變化與來源。",
      hint: "拖曳或點視角按鈕，左下即時讀出 getCameraOrbit()",
      async mount(ctx) {
        ctx.html(`<div class="full glow"><model-viewer src="${MODEL}" alt="機器人" camera-controls interaction-prompt="none"
            camera-orbit="30deg 75deg 105%" field-of-view="30deg" environment-image="${PANO}" shadow-intensity="1"
            animation-name="Idle" autoplay rotation-per-second="30deg" auto-rotate-delay="0"></model-viewer></div>
          <div class="readout panel"></div>`);
        const mv = ctx.$("model-viewer");
        const out = ctx.$(".readout");
        const VIEWS = [["正面", "0deg 80deg 105%"], ["側面", "90deg 80deg 105%"], ["俯視", "20deg 25deg 120%"], ["特寫", "25deg 72deg 65%"]];
        let jump = false;
        ctx.group(VIEWS.map((v) => v[0]), 0, (i) => {
          mv.autoRotate = false;
          rotBtn.setAttribute("aria-pressed", "false");
          mv.cameraOrbit = VIEWS[i][1];
          if (jump) mv.jumpCameraToGoal();
        });
        const rotBtn = ctx.toggle("自動旋轉", false, (v) => (mv.autoRotate = v));
        ctx.toggle("瞬移", false, (v) => (jump = v));
        ctx.slider("視角", { min: 10, max: 60, step: 1, value: 30, format: (v) => `${v}°` }, (v) => (mv.fieldOfView = `${v}deg`));
        ctx.slider("緩動", { min: 20, max: 400, step: 10, value: 50, format: (v) => `${v}ms` }, (v) => (mv.interpolationDecay = v));

        let source = "none", events = 0;
        const paint = () => {
          const o = mv.getCameraOrbit();
          out.innerHTML = `θ 水平 <b>${deg(o.theta).toFixed(1)}°</b><br>φ 仰角 <b>${deg(o.phi).toFixed(1)}°</b><br>距離 <b>${o.radius.toFixed(2)} m</b><br>FOV <b>${mv.getFieldOfView().toFixed(1)}°</b><br>camera-change <b>${events}</b> 次・${source}`;
        };
        ctx.on(mv, "camera-change", (e) => { events++; source = e.detail.source; });
        await whenLoaded(ctx, mv);
        ctx.interval(paint, 120);
        paint();
      },
    },

    {
      id: "light",
      title: "環境光與曝光",
      api: "environment-image / exposure / tone-mapping",
      desc: "同一個模型放三種環境光：內建 neutral、內建 legacy、自訂全景圖（可同時當 skybox 背景）。曝光、色調映射、陰影一次套到三個畫面；拖曳任一個，另外兩個同步視角。",
      hint: "調曝光與色調映射，比較三種環境光；拖曳任一畫面會同步視角",
      async mount(ctx) {
        const pane = (cls, env, title, sub) => `<figure class="pane panel ${cls}">
            <model-viewer src="${MODEL}" alt="${title}" camera-controls interaction-prompt="none" camera-orbit="35deg 78deg 110%"
              environment-image="${env}" exposure="1" tone-mapping="neutral" shadow-intensity="1" shadow-softness="0.6" animation-name="Idle" autoplay></model-viewer>
            <figcaption><b>${title}</b>${sub}</figcaption></figure>`;
        ctx.html(`<div class="trio">
            ${pane("", "neutral", "neutral（預設）", "內建柔光棚，適合商品")}
            ${pane("legacy", "legacy", "legacy", "舊版內建光，對比較強")}
            ${pane("pano", PANO, "panorama.jpg", "等距長方全景當環境光")}
          </div>`);
        const mvs = ctx.$$("model-viewer");
        const pano = ctx.$(".pano model-viewer");
        ctx.slider("曝光", { min: 0.2, max: 2.5, step: 0.05, value: 1 }, (v) => mvs.forEach((m) => (m.exposure = v)));
        ctx.select("色調映射", ["neutral", "aces", "agx", "reinhard", "linear"], "neutral", (v) => mvs.forEach((m) => (m.toneMapping = v)));
        ctx.slider("陰影", { min: 0, max: 2, step: 0.1, value: 1 }, (v) => mvs.forEach((m) => (m.shadowIntensity = v)));
        ctx.toggle("天空盒", false, (v) => { pano.skyboxImage = v ? PANO : null; });

        // Mirror user camera moves to the other panes
        for (const m of mvs) {
          ctx.on(m, "camera-change", (e) => {
            if (e.detail.source !== "user-interaction") return;
            const orbit = m.getCameraOrbit().toString();
            for (const o of mvs) if (o !== m) { o.cameraOrbit = orbit; o.jumpCameraToGoal(); }
          });
        }
        // Hidden panes (narrow screens) never load, so only wait for the visible ones.
        await Promise.all(mvs.filter((m) => m.offsetWidth > 0).map((m) => whenLoaded(ctx, m, "載入模型與環境貼圖…")));
      },
    },

    {
      id: "annotate",
      title: "表面標註",
      api: "surfaceFromPoint() / data-surface / data-position",
      desc: "點模型任一處，surfaceFromPoint() 回傳「網格 + 三角形 + 重心座標」字串，放進 data-surface 的標註會黏在動畫中的網格上；尺寸標示則用 getDimensions() 加上固定的 data-position。",
      hint: "點機器人身上任一處新增藍色標註，看它跟著跳舞",
      async mount(ctx) {
        ctx.html(`<div class="duo"><div class="view"><model-viewer src="${MODEL}" alt="可加標註的機器人" camera-controls interaction-prompt="none"
            camera-orbit="25deg 78deg 105%" environment-image="${PANO}" shadow-intensity="1" animation-name="Dance" autoplay>
            <button class="hotspot" slot="hotspot-s1" data-surface="2 2 375 376 377 0.605 0.299 0.096" data-visibility-attribute="visible">1</button>
            <button class="hotspot" slot="hotspot-s2" data-surface="13 0 162 163 164 0.588 0.246 0.165" data-visibility-attribute="visible">2</button>
            <button class="hotspot" slot="hotspot-s3" data-surface="3 0 56 58 59 0.326 0.311 0.362" data-visibility-attribute="visible">3</button>
          </model-viewer></div>
          <aside class="side panel"><h3>標註清單</h3><ol class="pins"></ol>
            <p class="muted long">黃色 1~3 是預先寫好的 data-surface；藍色是你點出來的。surface 字串格式：網格 primitive、三個頂點索引、三個重心權重。</p></aside></div>`);
        const mv = ctx.$("model-viewer");
        const list = ctx.$(".pins");
        const addRow = (n, cls, surface) => {
          list.append(Showcase.h("li", {}, Showcase.h("span", { class: `num ${cls}`, text: String(n) }), Showcase.h("code", { text: surface, title: surface })));
        };
        ctx.$$(".hotspot").forEach((s, i) => addRow(i + 1, "y", s.dataset.surface));

        let count = 0;
        let down = null;
        ctx.on(mv, "pointerdown", (e) => (down = [e.clientX, e.clientY]));
        ctx.on(mv, "pointerup", (e) => {
          if (!down || e.target !== mv || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
          const r = mv.getBoundingClientRect();
          const surface = mv.surfaceFromPoint(e.clientX - r.left, e.clientY - r.top);
          if (!surface) { ctx.hint("沒點到模型，換個位置試試"); return; }
          count++;
          const n = count + 3;
          mv.append(Showcase.h("button", { class: "hotspot pin", slot: `hotspot-pin-${count}`, "data-surface": surface, "data-visibility-attribute": "visible", type: "button" }, String(n)));
          addRow(n, "", surface);
          list.lastElementChild.scrollIntoView({ block: "nearest" });
        });

        ctx.toggle("動畫", true, (v) => (v ? mv.play() : mv.pause()));
        let dims = [];
        ctx.toggle("尺寸標示", true, (v) => dims.forEach((d) => (d.hidden = !v)));
        ctx.button("清除藍色", () => {
          mv.querySelectorAll(".pin").forEach((p) => p.remove());
          list.querySelectorAll("li").forEach((li, i) => { if (i >= 3) li.remove(); });
          count = 0;
        });

        await whenLoaded(ctx, mv);
        const c = mv.getBoundingBoxCenter();
        const d = mv.getDimensions();
        const spots = [
          ["dim-h", `${c.x} ${c.y + d.y / 2} ${c.z}`, `高 ${d.y.toFixed(2)} m`],
          ["dim-w", `${c.x + d.x / 2} ${c.y} ${c.z}`, `寬 ${d.x.toFixed(2)} m`],
          ["dim-d", `${c.x} ${c.y - d.y / 2} ${c.z + d.z / 2}`, `深 ${d.z.toFixed(2)} m`],
        ];
        dims = spots.map(([slot, pos, text]) => {
          const b = Showcase.h("div", { class: "dim", slot: `hotspot-${slot}`, "data-position": pos, "data-visibility-attribute": "visible" }, text);
          mv.append(b);
          return b;
        });
      },
    },

    {
      id: "anim",
      title: "動畫切換",
      api: "availableAnimations / play() / appendAnimation()",
      desc: "availableAnimations 列出 glTF 內所有動畫（這顆模型有 14 段）。切換時用 animation-crossfade-duration 交叉淡化，timeScale 調速度，play({repetitions, pingpong}) 控制次數，appendAnimation() 把揮手疊在目前動作上。",
      hint: "點右側動作切換；開「疊加揮手」看兩段動畫混合",
      async mount(ctx) {
        ctx.html(`<div class="duo"><div class="view"><model-viewer src="${MODEL}" alt="動畫機器人" camera-controls interaction-prompt="none"
            camera-orbit="20deg 78deg 110%" environment-image="${PANO}" shadow-intensity="1" animation-name="Idle" autoplay
            animation-crossfade-duration="300"></model-viewer></div>
          <aside class="side panel"><h3>availableAnimations</h3><div class="chips"></div>
            <div class="track"><i></i></div><div class="muted time">…</div><div class="log"></div></aside></div>`);
        const mv = ctx.$("model-viewer");
        const chips = ctx.$(".chips");
        const bar = ctx.$(".track i");
        const timeEl = ctx.$(".time");
        const logEl = ctx.$(".log");
        const ZH = { Dance: "跳舞", Death: "倒地", Idle: "待機", Jump: "跳躍", No: "搖頭", Punch: "出拳", Running: "跑步", Sitting: "坐下", Standing: "站起", ThumbsUp: "比讚", Walking: "走路", WalkJump: "走跳", Wave: "揮手", Yes: "點頭" };
        const lines = [];
        const log = (name, extra = "") => {
          lines.unshift(`<b>${name}</b> ${extra}`);
          lines.length = Math.min(lines.length, 4);
          logEl.innerHTML = lines.join("<br>");
        };
        let loop = true, pingpong = false;
        const playName = (name) => {
          mv.animationName = name;
          mv.play(loop ? { pingpong } : { repetitions: pingpong ? 2 : 1, pingpong });
          chips.querySelectorAll(".btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === name)));
        };
        ctx.slider("速度", { min: 0.1, max: 2.5, step: 0.05, value: 1, format: (v) => `${v.toFixed(2)}×` }, (v) => (mv.timeScale = v));
        ctx.slider("淡化", { min: 0, max: 1500, step: 50, value: 300, format: (v) => `${v}ms` }, (v) => (mv.animationCrossfadeDuration = v));
        ctx.toggle("循環", true, (v) => { loop = v; playName(mv.animationName); });
        ctx.toggle("來回", false, (v) => { pingpong = v; playName(mv.animationName); });
        ctx.toggle("疊加揮手", false, (v) => (v ? mv.appendAnimation("Wave", { weight: 1, fade: 0.3 }) : mv.detachAnimation("Wave", { fade: 0.3 })));
        ctx.toggle("暫停", false, (v) => (v ? mv.pause() : mv.play()));

        ctx.on(mv, "play", () => log("play", mv.animationName));
        ctx.on(mv, "pause", () => log("pause", `t=${mv.currentTime.toFixed(2)}s`));
        ctx.on(mv, "loop", (e) => log("loop", `第 ${e.detail.count} 次`));
        ctx.on(mv, "finished", () => { log("finished", "回到待機"); ctx.timeout(() => playName("Idle"), 500); });
        ctx.on(mv, "append-animation", () => log("append-animation", "Wave"));
        ctx.on(mv, "detach-animation", () => log("detach-animation", "Wave"));

        await whenLoaded(ctx, mv);
        for (const name of mv.availableAnimations) {
          const b = Showcase.h("button", { class: "btn", type: "button", "data-k": name, "aria-pressed": String(name === "Idle") }, ZH[name] || name, Showcase.h("small", { text: name }));
          b.addEventListener("click", () => playName(name));
          chips.append(b);
        }
        ctx.raf(() => {
          const d = mv.duration || 0;
          const t = mv.currentTime || 0;
          bar.style.width = d ? `${Math.min(100, ((t % d) / d) * 100)}%` : "0";
          timeEl.textContent = `${mv.animationName}　${t.toFixed(2)} / ${d.toFixed(2)} s`;
        });
      },
    },

    {
      id: "material",
      title: "材質 API",
      api: "model.materials / materialFromPoint()",
      desc: "model.materials 取得 glTF 的 PBR 材質（這顆模型有 Grey、Main、Black 三個），可即時改底色、金屬度、粗糙度與自發光；materialFromPoint() 從點擊位置反查材質。",
      hint: "點機器人任一部位選取材質，再調顏色與金屬度",
      async mount(ctx) {
        ctx.html(`<div class="duo"><div class="view"><model-viewer src="${MODEL}" alt="材質編輯機器人" camera-controls interaction-prompt="none"
            camera-orbit="30deg 78deg 105%" environment-image="${PANO}" shadow-intensity="1" animation-name="Idle" autoplay></model-viewer></div>
          <aside class="side panel"><h3>model.materials</h3><ul class="mats"></ul>
            <div class="muted">選取材質的底色</div><div class="colors"></div>
            <p class="muted long">金屬度、粗糙度與自發光在右上角；每個值都直接寫回 three.js 材質，不需重新載入模型。</p></aside></div>`);
        const mv = ctx.$("model-viewer");
        const listEl = ctx.$(".mats");
        const colorsEl = ctx.$(".colors");
        let mats = [], sel = null, originals = new Map(), glow = false;

        const metal = ctx.slider("金屬度", { min: 0, max: 1, step: 0.01, value: 0.1 }, (v) => { sel?.pbrMetallicRoughness.setMetallicFactor(v); paintList(); });
        const rough = ctx.slider("粗糙度", { min: 0, max: 1, step: 0.01, value: 0.9 }, (v) => { sel?.pbrMetallicRoughness.setRoughnessFactor(v); paintList(); });
        ctx.toggle("自發光", false, (v) => { glow = v; sel?.setEmissiveFactor(v ? [1, 0.55, 0.1] : [0, 0, 0]); });

        const setSlider = (input, v) => { input.value = v; input.dispatchEvent(new Event("input")); };
        function paintList() {
          listEl.innerHTML = "";
          for (const m of mats) {
            const p = m.pbrMetallicRoughness;
            const li = Showcase.h("li", { "aria-selected": String(m === sel) },
              Showcase.h("span", { class: "chip", style: `background:${cssColor(p.baseColorFactor)}` }),
              Showcase.h("b", { text: m.name }),
              Showcase.h("span", { text: `M ${p.metallicFactor.toFixed(2)}・R ${p.roughnessFactor.toFixed(2)}` }));
            li.addEventListener("click", () => select(m));
            listEl.append(li);
          }
        }
        function select(m) {
          if (!m) return;
          if (sel && sel !== m && glow) sel.setEmissiveFactor([0, 0, 0]);
          sel = m;
          const p = m.pbrMetallicRoughness;
          setSlider(metal, p.metallicFactor);
          setSlider(rough, p.roughnessFactor);
          // Brief emissive flash to show which parts use this material
          m.setEmissiveFactor(glow ? [1, 0.55, 0.1] : [0.5, 0.45, 0]);
          if (!glow) ctx.timeout(() => { if (!glow) m.setEmissiveFactor([0, 0, 0]); }, 450);
          paintList();
        }
        for (const hex of ["#4cc9f0", "#f72585", "#7bd389", "#f7df1e", "#9d8cff", "#2b2f36", "#f5f5f5"]) {
          const b = Showcase.h("button", { type: "button", title: hex, "aria-label": hex });
          b.style.background = hex;
          b.addEventListener("click", () => { sel?.pbrMetallicRoughness.setBaseColorFactor(hex); paintList(); });
          colorsEl.append(b);
        }
        const reset = Showcase.h("button", { type: "button", class: "reset" }, "還原");
        reset.addEventListener("click", () => {
          for (const m of mats) {
            const o = originals.get(m);
            m.pbrMetallicRoughness.setBaseColorFactor(o.color);
            m.pbrMetallicRoughness.setMetallicFactor(o.metal);
            m.pbrMetallicRoughness.setRoughnessFactor(o.rough);
          }
          select(sel);
        });
        colorsEl.append(reset);

        let down = null;
        ctx.on(mv, "pointerdown", (e) => (down = [e.clientX, e.clientY]));
        ctx.on(mv, "pointerup", (e) => {
          if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
          const r = mv.getBoundingClientRect();
          const m = mv.materialFromPoint(e.clientX - r.left, e.clientY - r.top);
          if (m) select(m); else ctx.hint("沒點到模型");
        });

        await whenLoaded(ctx, mv);
        mats = mv.model.materials;
        for (const m of mats) {
          const p = m.pbrMetallicRoughness;
          originals.set(m, { color: [...p.baseColorFactor], metal: p.metallicFactor, rough: p.roughnessFactor });
        }
        select(mats.find((m) => m.name === "Main") || mats[0]);
      },
    },

    {
      id: "snapshot",
      title: "截圖與 AR",
      api: "toDataURL() / exportScene() / ar-modes",
      desc: "toDataURL() 直接取得目前畫面（含透明背景），搭配 jumpCameraToGoal() 一次拍四個角度；exportScene() 把目前材質與動畫匯出成 GLB。AR 需要手機：ar-modes 依序嘗試 WebXR、Android Scene Viewer、iOS Quick Look。",
      hint: "按「拍四角度」重拍，「匯出 GLB」產生下載連結",
      async mount(ctx) {
        ctx.html(`<div class="duo"><div class="view"><model-viewer src="${MODEL}" alt="截圖用機器人" camera-controls interaction-prompt="none"
            camera-orbit="30deg 78deg 105%" environment-image="${PANO}" shadow-intensity="1" animation-name="Wave" autoplay
            ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto"></model-viewer></div>
          <aside class="side panel"><h3>toDataURL() 四角度</h3><div class="shots"></div>
            <div class="exp muted">exportScene()：等待中…</div>
            <h3>AR 屬性</h3>
            <dl><dt>canActivateAR</dt><dd class="can">…</dd><dt>ar-status</dt><dd class="arst">尚未啟動</dd>
              <dt class="long">ar-modes</dt><dd class="long">webxr 在 Chrome 手機直接疊到相機畫面；scene-viewer 交給 Android 原生檢視器；quick-look 交給 iOS（需另備 USDZ 或自動轉檔）。</dd>
              <dt class="long">ar-scale</dt><dd class="long">auto 允許雙指縮放，fixed 鎖定真實尺寸。</dd></dl></aside></div>`);
        const mv = ctx.$("model-viewer");
        const shots = ctx.$(".shots");
        const exp = ctx.$(".exp");
        let blobUrl = null;
        ctx.onCleanup(() => blobUrl && URL.revokeObjectURL(blobUrl));
        ctx.on(mv, "ar-status", (e) => (ctx.$(".arst").textContent = e.detail.status));

        const ANGLES = [["正面", "0deg 78deg 105%"], ["側面", "90deg 78deg 105%"], ["背面", "180deg 78deg 105%"], ["俯視", "30deg 30deg 120%"]];
        let busy = false;
        async function shoot() {
          if (busy) return;
          busy = true;
          const keep = mv.getCameraOrbit().toString();
          shots.innerHTML = "";
          for (const [name, orbit] of ANGLES) {
            mv.cameraOrbit = orbit;
            mv.jumpCameraToGoal();
            await ctx.frame(3);
            const img = Showcase.h("img", { alt: name, src: mv.toDataURL("image/png") });
            shots.append(Showcase.h("figure", {}, img, Showcase.h("figcaption", { text: name })));
          }
          mv.cameraOrbit = keep;
          mv.jumpCameraToGoal();
          busy = false;
        }
        async function exportGlb() {
          exp.textContent = "exportScene()：匯出中…";
          const t0 = performance.now();
          const blob = await mv.exportScene({ binary: true });
          if (!ctx.active) return;
          if (blobUrl) URL.revokeObjectURL(blobUrl);
          blobUrl = URL.createObjectURL(blob);
          exp.innerHTML = `exportScene()：${(blob.size / 1024).toFixed(0)} KB・${Showcase.fmtMs(performance.now() - t0)}　<a download="robot-export.glb" href="${blobUrl}">下載 GLB</a>`;
        }
        ctx.button("拍四角度", shoot, { primary: true });
        ctx.button("匯出 GLB", exportGlb);

        await whenLoaded(ctx, mv);
        ctx.$(".can").textContent = mv.canActivateAR ? "true（此裝置可進 AR）" : "false（桌機或不支援，AR 按鈕自動隱藏）";
        await ctx.sleep(300);
        await shoot();
        await exportGlb();
      },
    },

    {
      id: "stress",
      title: "極限測試",
      kind: "stress",
      api: "多個 <model-viewer> 同頁",
      desc: "逐步增加同頁的 <model-viewer> 數量，每個都在自轉並播放動畫。所有實例共用同一個 WebGL context 與 GLB 快取，所以不會撞上瀏覽器約 16 個 context 的上限；瓶頸是每幀要逐一渲染再複製到各自的畫布。",
      hint: "按「自動加壓」逐步加到 64 個實例",
      mount(ctx) {
        ctx.html(`<div class="mv-stress"></div>`);
        const grid = ctx.$(".mv-stress");
        const ANIMS = ["Dance", "Running", "Walking", "Wave", "Idle", "Jump", "Yes", "Punch"];
        let items = [];
        let animate = true, spin = true;
        const layout = () => {
          const n = Math.max(1, items.length);
          const { width, height } = grid.getBoundingClientRect();
          const cols = Math.max(1, Math.min(n, Math.round(Math.sqrt((n * width) / Math.max(1, height)))));
          grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
          grid.style.gridTemplateRows = `repeat(${Math.ceil(n / cols)}, minmax(0, 1fr))`;
        };
        const make = (i) => {
          const mv = Showcase.h("model-viewer", {
            src: MODEL, alt: `實例 ${i + 1}`, "interaction-prompt": "none", "camera-orbit": `${(i * 47) % 360}deg 75deg 105%`,
            "animation-name": ANIMS[i % ANIMS.length], "rotation-per-second": "40deg", "auto-rotate-delay": "0",
          });
          if (animate) mv.setAttribute("autoplay", "");
          if (spin) mv.setAttribute("auto-rotate", "");
          return mv;
        };
        const loadedCount = () => items.filter((m) => m.loaded).length;
        ctx.onResize(layout);
        ctx.toggle("動畫", true, (v) => { animate = v; items.forEach((m) => (v ? m.play() : m.pause())); });
        ctx.toggle("自轉", true, (v) => { spin = v; items.forEach((m) => (m.autoRotate = v)); });
        ctx.controls.classList.add("bottom");

        ctx.ramp({
          label: "實例",
          unit: "個",
          steps: [1, 2, 4, 8, 16, 24, 32, 48, 64],
          minFps: 30,
          warmup: 900,
          async apply(n) {
            while (items.length > n) items.pop().remove();
            const fresh = [];
            while (items.length < n) {
              const mv = make(items.length);
              items.push(mv);
              fresh.push(mv);
              grid.append(mv);
            }
            layout();
            const pending = fresh.map((m) => new Promise((r) => { m.addEventListener("load", r, { once: true }); m.addEventListener("error", r, { once: true }); }));
            await Promise.race([Promise.all(pending), ctx.sleep(8000)]);
          },
          metrics: () => {
            const cell = items[0] ? items[0].getBoundingClientRect() : { width: 0, height: 0 };
            return { "已載入": `${loadedCount()} / ${items.length}`, "每格": `${Math.round(cell.width)}×${Math.round(cell.height)}`, "WebGL context": "共用 1 個" };
          },
          note: "每個實例有自己的 2D 畫布，但 three.js 只開一個 WebGL context：逐一渲染後複製像素，所以成本隨實例數線性上升。軟體算圖（SwiftShader）會比實體 GPU 早很多掉幀。",
        });
      },
    },
  ],
});
</script>
</body>
</html>
