<style>
  .board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 2; }
  .cap { font: 500 11.5px/1.3 var(--mono); color: var(--muted); white-space: nowrap; }

  /* scene 1: like + fireworks */
  .likebg { position: absolute; inset: 0; cursor: crosshair; background: radial-gradient(55% 55% at 50% 50%, rgba(247, 37, 133, .10), transparent 70%); }
  .likebg .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .heart {
    width: 132px; height: 132px; border-radius: 50%; border: 1px solid var(--line); cursor: pointer;
    background: var(--bg-2); display: grid; place-items: center; margin: 0 auto 14px;
    box-shadow: 0 0 0 10px rgba(255, 255, 255, .02), 0 14px 40px rgba(0, 0, 0, .45); transition: border-color .2s;
  }
  .heart:hover { border-color: var(--c3); }
  .heart svg { width: 64px; height: 64px; overflow: visible; }
  .heart path { fill: none; stroke: var(--muted); stroke-width: 2; transition: fill .2s, stroke .2s; }
  .heart.on path { fill: var(--c3); stroke: var(--c3); }
  .count { font-size: 15px; }
  .count b { color: var(--c3); font-size: 22px; margin: 0 4px; font-family: var(--mono); }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }

  /* grids of labelled cells (shapes, bursts) */
  .grid { display: grid; gap: 8px; height: 100%; }
  .g9 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .g6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); }
  @media (max-width: 520px) { .g6 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); } }
  .cell { position: relative; min-height: 0; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, .015); overflow: hidden; }
  .cell .host { position: absolute; inset: 0 0 20px; }
  .cell .cap { position: absolute; left: 4px; right: 4px; bottom: 5px; text-align: center; overflow: hidden; text-overflow: ellipsis; }

  /* scene 3: swirl */
  .swirlbg { position: absolute; inset: 0; cursor: crosshair; background: radial-gradient(70% 60% at 50% 100%, rgba(76, 201, 240, .12), transparent 70%); }

  /* scene 5: easing lanes */
  .lanes { display: grid; grid-template-rows: repeat(5, 1fr); gap: 6px; height: 100%; }
  .lane { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; min-height: 0; }
  .lane svg { height: 100%; aspect-ratio: 108 / 150; overflow: visible; display: block; }
  .lane .frame { fill: none; stroke: var(--line); }
  .lane .curve { fill: none; stroke-width: 2.5; }
  .lane .nm { margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; }
  .lane .nm b { color: var(--fg); font-weight: 600; }
  .track { position: relative; height: 26px; border-radius: 13px; background: var(--bg-2); border: 1px solid var(--line); }
  .track .dot { position: absolute; left: 2px; top: 2px; width: 20px; height: 20px; border-radius: 50%; }

  /* scene 6: timeline */
  .sky { position: absolute; inset: 0; background: linear-gradient(#11152b, #0e1013 85%); }
  .tower { position: absolute; left: 50%; transform: translateX(-50%); }
  .tower .b { fill: #262c3d; stroke: #3a4258; stroke-width: .6; }
  .tower .w { fill: #f7df1e; opacity: .55; }
  .titlewrap { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 3; }
  .titlewrap span { display: inline-block; font: 800 clamp(24px, 6.5vw, 48px)/1.1 var(--font); color: var(--c1); text-shadow: 0 0 26px rgba(247, 223, 30, .35); opacity: 0; }
  .tracks { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 8px 10px; display: grid; gap: 4px; z-index: 3; }
  .trk { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px; height: 15px; }
  .trk .cap { overflow: hidden; text-overflow: ellipsis; }
  .trk .ln { position: relative; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .05); }
  .trk .ln i { position: absolute; top: 0; bottom: 0; border-radius: 4px; opacity: .85; }
  .phwrap { position: absolute; top: 4px; bottom: 4px; left: 124px; right: 10px; pointer-events: none; }
  .ph { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--fg); box-shadow: 0 0 6px rgba(255, 255, 255, .5); }

  /* scene 7: stress view */
  .sview { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: radial-gradient(60% 60% at 50% 50%, rgba(157, 140, 255, .08), transparent 70%); }
  @media (max-width: 760px) { .sview { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/@mojs/core@1.7.1/dist/mo.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// mo.js showcase: seven scenes from the original like-button fireworks to a Burst-count stress ramp.
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// Custom shape: mo.js draws getShape() inside a 100x100 box and scales it to the radius.
class Heart extends mojs.CustomShape {
  getShape() { return '<path d="M50 88C50 88 12 64 6 40C1 20 16 8 30 8c9 0 16 5 20 13 4-8 11-13 20-13 14 0 29 12 24 32C88 64 50 88 50 88z"/>'; }
  getLength() { return 292; }
}
mojs.addShape("heart", Heart);

// Collect mo.js modules so a scene can stop every one of them on unmount or rebuild.
function tracker(ctx) {
  let list = [];
  const keep = (m) => { list.push(m); return m; };
  keep.stopAll = () => { list.forEach((m) => m.stop()); list = []; };
  ctx.onCleanup(() => keep.stopAll());
  return keep;
}

// Call fn(w, h) once the element has a size and again whenever that size changes.
function onBox(ctx, el, fn) {
  let raf = 0, lw = -1, lh = -1;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h || (w === lw && h === lh)) return;
      lw = w; lh = h;
      fn(w, h);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}

// Pointer position relative to an element.
const local = (el, e) => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
// ctx.slider only refreshes its <output> on user input; this keeps it in sync during playback.
const syncSlider = (input, v, text) => { input.value = v; input.nextElementSibling.textContent = text; };

// Five-lane easing showcase entries: label plus anything mo.js accepts as `easing`.
const EASINGS = [
  { name: '"linear.none"', e: "linear.none" },
  { name: '"cubic.out"', e: "cubic.out" },
  { name: '"elastic.out"', e: "elastic.out" },
  { name: "easing.bezier(.68, -.55, .27, 1.55)", e: mojs.easing.bezier(0.68, -0.55, 0.27, 1.55) },
  { name: "easing.path('M0,100 C20,100 30,0 40,0 …')", e: mojs.easing.path("M0,100 C20,100 30,0 40,0 C47,30 53,40 60,40 C67,40 70,0 75,0 C80,8 84,15 87,15 C91,15 95,0 100,0") },
];

Showcase.run({ scenes: [
  {
    id: "like", title: "按讚與煙火",
    api: "new mojs.Burst({ children }).tune({ x, y }).generate().replay()",
    desc: "原本的招牌畫面：Shape 光環、兩組 Burst 粒子與 Html 彈性縮放組成按讚與煙火。五組特效輪流 tune 到點擊位置再重播，不必每次新建物件。",
    hint: "點愛心按讚，或點畫面任何地方放煙火",
    mount(ctx) {
      ctx.html(`<div class="likebg"><div class="center"><div>
        <button class="heart" type="button" aria-label="按讚"><svg viewBox="0 0 32 32"><path d="M16 28 C 6 20, 2 15, 2 10 A 7 7 0 0 1 16 7 A 7 7 0 0 1 30 10 C 30 15, 26 20, 16 28 Z"/></svg></button>
        <div class="count">已按讚<b>0</b>次</div>
        <div class="sub">Burst、Shape、Html 三種模組組合</div>
      </div></div></div><div class="fx"></div>`);
      const fx = ctx.$(".fx"), btn = ctx.$(".heart"), num = ctx.$(".count b");
      const keep = tracker(ctx);
      const FX = { parent: fx, left: 0, top: 0 };
      const makeFx = () => ({
        ring: keep(new mojs.Shape({
          ...FX, shape: "circle", fill: "none", stroke: "#fff",
          radius: { 0: 64 }, strokeWidth: { 16: 0 }, duration: 650, easing: "quart.out",
        })),
        dots: keep(new mojs.Burst({
          ...FX, radius: { 8: 110 }, count: 14, rotate: { 0: 40 },
          children: {
            shape: ["circle", "polygon", "rect"], points: 3, fill: COLORS,
            radius: "rand(4, 9)", scale: { 1: 0 }, degreeShift: "rand(-60, 60)",
            duration: "rand(800, 1200)", easing: "cubic.out",
          },
        })),
        sparks: keep(new mojs.Burst({
          ...FX, radius: { 20: 150 }, count: 8, rotate: 22.5,
          children: {
            shape: "line", stroke: COLORS, strokeWidth: { 4: 0 }, radius: { 14: 4 },
            strokeLinecap: "round", duration: 900, easing: "quad.out",
          },
        })),
      });
      const pool = Array.from({ length: 5 }, makeFx);
      let pi = 0;
      const boom = (x, y) => {
        const f = pool[pi++ % pool.length];
        f.ring.tune({ x, y, stroke: pick(COLORS) }).replay();
        f.dots.tune({ x, y }).generate().replay();
        f.sparks.tune({ x, y }).replay();
      };

      // Like: the heart pops with an elastic Html tween plus a pink ring and burst.
      const heartPop = keep(new mojs.Html({ el: btn.querySelector("svg"), scale: { 0.2: 1 }, easing: "elastic.out", duration: 1100 }));
      const likeBurst = keep(new mojs.Burst({
        ...FX, radius: { 50: 120 }, count: 10,
        children: { shape: "circle", fill: ["#f72585", "#ff8c42", "#f7df1e"], radius: { 9: 0 }, duration: 900, easing: "quad.out" },
      }));
      const likeRing = keep(new mojs.Shape({
        ...FX, shape: "circle", fill: "none", stroke: "#f72585",
        radius: { 30: 90 }, strokeWidth: { 20: 0 }, duration: 600, easing: "cubic.out",
      }));
      let count = 0;
      const like = () => {
        const r = btn.getBoundingClientRect(), o = fx.getBoundingClientRect();
        const x = r.left - o.left + r.width / 2, y = r.top - o.top + r.height / 2;
        btn.classList.add("on");
        num.textContent = ++count;
        heartPop.replay();
        likeRing.tune({ x, y }).replay();
        likeBurst.tune({ x, y }).replay();
      };

      // Auto fireworks keep the stage alive; a user click pauses them for 3 seconds.
      let auto = true, resumeAt = 0;
      const pause = () => { resumeAt = performance.now() + 3000; };
      ctx.on(btn, "click", (e) => { e.stopPropagation(); like(); pause(); });
      ctx.on(ctx.el, "click", (e) => {
        if (e.target.closest("button, .controls, input, select, label")) return;
        const p = local(fx, e);
        boom(p.x, p.y);
        pause();
      });
      ctx.interval(() => {
        if (!auto || performance.now() < resumeAt) return;
        const w = fx.clientWidth, h = fx.clientHeight;
        let x, y, tries = 0;
        do { x = 40 + Math.random() * (w - 80); y = 40 + Math.random() * (h - 80); }
        while (Math.hypot(x - w / 2, y - h / 2) < 120 && ++tries < 20);
        boom(x, y);
      }, 430);
      ctx.toggle("自動煙火", true, (v) => { auto = v; });
      ctx.button("按讚", like, { primary: true });
      ctx.timeout(like, 600);
    },
  },
  {
    id: "shapes", title: "形狀與串接",
    api: "new mojs.Shape({ shape, radius, rotate }).then({ … }).then({ … })",
    desc: "八種內建形狀加一個 addShape 註冊的自訂愛心。每格用 .then() 串三段：彈入、旋轉換色、縮小淡出；九個 Shape 再放進同一條 Timeline 錯開起跑。zigzag 用 strokeDashoffset 百分比做描線。",
    hint: "按「重播」再看一次，拉「速度」改整條時間軸的播放速度",
    mount(ctx) {
      const SHAPES = [
        { cap: "circle", o: { shape: "circle" } },
        { cap: "rect rx: 8", o: { shape: "rect", rx: 8, ry: 8 } },
        { cap: "polygon 6 邊", o: { shape: "polygon", points: 6 } },
        { cap: "line", o: { shape: "line" }, line: true },
        { cap: "cross", o: { shape: "cross" }, line: true },
        { cap: "equal ×4", o: { shape: "equal", points: 4 }, line: true },
        { cap: "zigzag 描線", o: { shape: "zigzag", points: 9, strokeDasharray: "100%", strokeDashoffset: { "100%": "0%" } }, line: true },
        { cap: "curve", o: { shape: "curve" }, line: true },
        { cap: "heart 自訂", o: { shape: "heart" } },
      ];
      ctx.html(`<div class="board"><div class="grid g9">${SHAPES.map((s) => `<div class="cell"><div class="host"></div><div class="cap">${s.cap}</div></div>`).join("")}</div></div>`);
      const hosts = ctx.$$(".host");
      const keep = tracker(ctx);
      let tl = null, loop = true, speed = 1;

      function build() {
        keep.stopAll();
        hosts.forEach((h) => h.replaceChildren());
        const R = clamp(Math.min(hosts[0].clientWidth, hosts[0].clientHeight) * 0.32, 10, 64);
        tl = keep(new mojs.Timeline({
          onComplete(isForward) { if (isForward && loop) ctx.timeout(() => tl.replay(), 600); },
        }));
        SHAPES.forEach((s, i) => {
          const c1 = COLORS[i % 6], c2 = COLORS[(i + 2) % 6], paint = s.line ? "stroke" : "fill";
          const o = {
            parent: hosts[i], ...s.o, radius: R, scale: { 0: 1 }, rotate: { [-120]: 0 },
            duration: 650, delay: i * 80, easing: "back.out",
            ...(s.line ? { fill: "none", stroke: c1, strokeWidth: 4, strokeLinecap: "round" } : { fill: c1 }),
          };
          const shape = new mojs.Shape(o)
            .then({ rotate: 180, [paint]: c2, duration: 800, delay: 150, easing: "cubic.inOut" })
            .then({ scale: 0.5, opacity: 0.35, duration: 420, delay: 600, easing: "cubic.in" });
          tl.add(shape);
        });
        tl.setSpeed(speed).play();
      }
      ctx.button("重播", () => { loop = true; tl.replay(); }, { primary: true });
      ctx.toggle("循環", true, (v) => { loop = v; });
      ctx.slider("速度", { min: 0.25, max: 2, step: 0.25, value: 1, format: (v) => `${v}×` }, (v) => { speed = v; tl.setSpeed(v); });
      onBox(ctx, ctx.$(".grid"), build);
    },
  },
  {
    id: "swirl", title: "漩渦粒子",
    api: "new mojs.ShapeSwirl({ x, y: { [from]: to }, swirlSize, swirlFrequency })",
    desc: "ShapeSwirl 沿著 x、y 的位移路徑前進，同時以正弦波左右擺動。swirlSize 是擺幅、swirlFrequency 是擺動次數，調成 0 就變成直線。點畫面放出 isSwirl 子粒子的 Burst。",
    hint: "拉兩個滑桿比較擺幅與頻率，點畫面放漩渦煙火",
    mount(ctx) {
      ctx.html(`<div class="swirlbg"></div><div class="fx"></div>`);
      const fx = ctx.$(".fx");
      const keep = tracker(ctx);
      let size = 14, freq = 3;
      const N = 80;
      const parts = Array.from({ length: N }, (_, i) => keep(new mojs.ShapeSwirl({
        parent: fx, left: 0, top: 0, x: { 0: 1 }, y: { 0: -1 },
        fill: COLORS[i % 6], radius: 5, scale: { 1: 0.2 }, duration: rnd(2200, 3200), easing: "sin.out", isShowEnd: false,
      })));
      let k = 0;
      ctx.interval(() => {
        const W = fx.clientWidth, H = fx.clientHeight;
        const x0 = rnd(W * 0.06, W * 0.94);
        parts[k++ % N].tune({
          x: { [x0]: x0 + rnd(-40, 40) }, y: { [H + 10]: rnd(H * 0.1, H * 0.5) },
          swirlSize: size * rnd(0.7, 1.3), swirlFrequency: freq * rnd(0.8, 1.2),
          radius: rnd(4, 9), direction: Math.random() < 0.5 ? -1 : 1,
        }).replay();
      }, 40);

      const FX = { parent: fx, left: 0, top: 0 };
      const bursts = Array.from({ length: 3 }, () => keep(new mojs.Burst({
        ...FX, radius: { 0: 160 }, count: 16,
        children: {
          shape: "circle", fill: COLORS, radius: { 8: 1 }, isSwirl: true,
          swirlSize: "rand(6, 14)", swirlFrequency: "rand(2, 4)", degreeShift: "rand(-25, 25)",
          duration: 1700, easing: "cubic.out",
        },
      })));
      let bi = 0, resumeAt = 0;
      const pop = (x, y) => bursts[bi++ % 3].tune({ x, y }).generate().replay();
      ctx.on(ctx.el, "click", (e) => {
        if (e.target.closest(".controls")) return;
        const p = local(fx, e);
        pop(p.x, p.y);
        resumeAt = performance.now() + 3000;
      });
      ctx.interval(() => {
        if (performance.now() < resumeAt) return;
        pop(rnd(fx.clientWidth * 0.25, fx.clientWidth * 0.75), rnd(fx.clientHeight * 0.3, fx.clientHeight * 0.55));
      }, 1700);
      ctx.timeout(() => pop(fx.clientWidth / 2, fx.clientHeight * 0.45), 300);
      ctx.slider("swirlSize", { min: 0, max: 40, step: 1, value: size }, (v) => { size = v; });
      ctx.slider("swirlFrequency", { min: 0, max: 8, step: 0.5, value: freq }, (v) => { freq = v; });
    },
  },
  {
    id: "burst", title: "Burst 參數",
    api: "new mojs.Burst({ count, degree, radiusX, radiusY, children: { delay: 'stagger(0, 60)', isSwirl } })",
    desc: "同一個 Burst 模組換六組參數並排比較：粒子數、扇形角度、橢圓半徑、stagger 錯開延遲配屬性陣列、線段加 degreeShift、子粒子漩渦。每格約 1.7 秒重播一次，停格時保留最終排列方便比較。",
    hint: "看每格下方的參數標籤，比較同一模組的不同設定",
    mount(ctx) {
      const VARIANTS = [
        { cap: "count: 8", o: (R) => ({ count: 8, radius: { [R * 0.2]: R }, children: { scale: 1, opacity: { 1: 0.5 }, shape: "circle", fill: COLORS, radius: { [R * 0.14]: R * 0.06 }, duration: 1300, easing: "cubic.out" } }) },
        { cap: "degree: 120", o: (R) => ({ count: 7, degree: 120, rotate: -60, radius: { [R * 0.2]: R * 1.1 }, children: { scale: 1, opacity: { 1: 0.5 }, shape: "polygon", points: 3, fill: COLORS[0], radius: { [R * 0.13]: R * 0.06 }, duration: 1300, easing: "cubic.out" } }) },
        { cap: "radiusX ≠ radiusY", o: (R) => ({ count: 14, radiusX: { 0: R * 1.3 }, radiusY: { 0: R * 0.55 }, children: { scale: 1, opacity: { 1: 0.5 }, shape: "circle", fill: COLORS[1], radius: { [R * 0.1]: R * 0.06 }, duration: 1300, easing: "quad.out" } }) },
        { cap: "delay: stagger(0, 60)", o: (R) => ({ count: 12, radius: { 0: R }, children: { scale: 1, opacity: { 1: 0.5 }, shape: ["circle", "rect", "polygon"], fill: COLORS, radius: { [R * 0.13]: R * 0.06 }, delay: "stagger(0, 60)", duration: 1100, easing: "cubic.out" } }) },
        { cap: "line + degreeShift", o: (R) => ({ count: 10, radius: { [R * 0.3]: R * 1.05 }, children: { scale: 1, opacity: { 1: 0.5 }, shape: "line", stroke: COLORS, strokeWidth: { 5: 2 }, radius: { [R * 0.22]: R * 0.1 }, degreeShift: 35, strokeLinecap: "round", duration: 1300, easing: "quad.out" } }) },
        { cap: "isSwirl: true", o: (R) => ({ count: 8, radius: { 0: R }, children: { scale: 1, opacity: { 1: 0.5 }, shape: "circle", fill: COLORS, radius: { [R * 0.1]: R * 0.06 }, isSwirl: true, swirlSize: R * 0.1, swirlFrequency: 4, duration: 1500, easing: "sin.out" } }) },
      ];
      ctx.html(`<div class="board"><div class="grid g6">${VARIANTS.map((v) => `<div class="cell"><div class="host"></div><div class="cap">${v.cap}</div></div>`).join("")}</div></div>`);
      const hosts = ctx.$$(".host");
      const keep = tracker(ctx);
      let list = [];
      function build() {
        keep.stopAll();
        hosts.forEach((h) => h.replaceChildren());
        const R = clamp(Math.min(hosts[0].clientWidth * 0.4, hosts[0].clientHeight * 0.42), 18, 90);
        list = VARIANTS.map((v, i) => keep(new mojs.Burst({ parent: hosts[i], timeline: { delay: i * 70 }, ...v.o(R) })));
        list.forEach((b) => b.replay());
      }
      ctx.interval(() => list.forEach((b) => b.replay()), 1700);
      ctx.button("全部重播", () => list.forEach((b) => b.replay()), { primary: true });
      onBox(ctx, ctx.$(".grid"), build);
    },
  },
  {
    id: "easing", title: "自訂緩動",
    api: "mojs.easing.path('M0,100 C…')・mojs.easing.bezier(x1, y1, x2, y2)",
    desc: "五條軌道用 mojs.Html 移動同一顆圓點，只換 easing：內建名稱、bezier 曲線，以及用 SVG 路徑畫出來的彈跳曲線（easing.path）。左側小圖由 mojs.easing.parseEasing 取樣畫出，紅點跟著 Timeline 進度走。",
    hint: "拖「進度」滑桿逐格看，或切換播放速度",
    mount(ctx) {
      ctx.html(`<div class="board"><div class="lanes">${EASINGS.map((e, i) => `
        <div class="lane"><svg viewBox="-4 -25 108 150"><rect class="frame" x="0" y="0" width="100" height="100" rx="3"/><polyline class="curve" stroke="${COLORS[i]}"/><circle r="6" fill="#f72585"/></svg>
        <div style="min-width:0"><div class="nm cap"><b>${e.name}</b></div><div class="track"><div class="dot" style="background:${COLORS[i]}"></div></div></div></div>`).join("")}</div></div>`);
      // lo/hi: the widest eased range of all lanes, so overshooting curves stay inside the tracks.
      let lo = 0, hi = 1;
      const lanes = ctx.$$(".lane").map((el, i) => {
        const fn = mojs.easing.parseEasing(EASINGS[i].e);
        const pts = [];
        for (let s = 0; s <= 80; s++) { const p = s / 80; pts.push(`${(p * 100).toFixed(1)},${(100 - fn(p) * 100).toFixed(1)}`); }
        el.querySelector("polyline").setAttribute("points", pts.join(" "));
        for (let s = 0; s <= 200; s++) { const v = fn(s / 200); lo = Math.min(lo, v); hi = Math.max(hi, v); }
        return { el, fn, dot: el.querySelector(".dot"), track: el.querySelector(".track"), mark: el.querySelector("circle") };
      });
      const keep = tracker(ctx);
      let tl = null, playing = true, speed = 1, slider = null;
      const paint = (p) => lanes.forEach((l) => {
        l.mark.setAttribute("cx", p * 100);
        l.mark.setAttribute("cy", 100 - l.fn(p) * 100);
      });
      function build() {
        keep.stopAll();
        tl = keep(new mojs.Timeline({
          onUpdate(ep, p) { paint(p); if (slider) syncSlider(slider, p, `${Math.round(p * 100)}%`); },
          onComplete(isForward) { if (isForward && playing) ctx.timeout(() => playing && tl.replay(), 700); },
        }));
        // Shared scale: eased value 0 maps to x0 and 1 maps to x0 + span on every lane.
        const span = (lanes[0].track.clientWidth - 26) / (hi - lo), x0 = -lo * span;
        lanes.forEach((l, i) => tl.add(new mojs.Html({
          el: l.dot, x: { [x0]: x0 + span }, duration: 1600, easing: EASINGS[i].e,
        })));
        tl.setSpeed(speed);
        if (playing) tl.play(); else tl.setProgress(+slider.value);
      }
      const autoBtn = ctx.toggle("自動播放", true, (v) => { playing = v; if (v) tl.replay(); else tl.pause(); });
      slider = ctx.slider("進度", { min: 0, max: 1, step: 0.01, value: 0, format: (v) => `${Math.round(v * 100)}%` }, (v) => {
        playing = false;
        autoBtn.setAttribute("aria-pressed", "false");
        tl.pause();
        tl.setProgress(v);
      });
      ctx.group(["0.5×", "1×", "2×"], 1, (i) => { speed = [0.5, 1, 2][i]; tl.setSpeed(speed); });
      onBox(ctx, ctx.$(".lanes"), build);
    },
  },
  {
    id: "timeline", title: "時間軸編排",
    api: "new mojs.Timeline().add(rockets, bursts, rings).append(new mojs.Html({ el }))",
    desc: "跨年煙火：三枚 ShapeSwirl 火箭、每枚兩層 Burst（圓點與線段）、三個光環用 delay 排進同一條 Timeline，再用 append() 接上 Html 標題。下方軌道是各模組的起訖時間，整條時間軸可以倒放與拖曳。",
    hint: "按「倒放」看整段反向播放，拖「進度」停在任何一格",
    mount(ctx) {
      ctx.html(`<div class="sky"></div>
        <svg class="tower" viewBox="0 0 60 200" aria-hidden="true"></svg>
        <div class="fx"></div>
        <div class="titlewrap"><span>2027 新年快樂</span></div>
        <div class="panel tracks"><div class="phwrap"><div class="ph"></div></div></div>`);
      const fx = ctx.$(".fx"), tower = ctx.$(".tower"), titleWrap = ctx.$(".titlewrap"), title = ctx.$(".titlewrap span");
      const tracks = ctx.$(".tracks"), ph = ctx.$(".ph");
      // Simplified Taipei 101: spire, eight flared sections, podium.
      let tw = '<rect class="b" x="29" y="0" width="2" height="26"/><rect class="b" x="25" y="24" width="10" height="12"/>';
      for (let i = 0; i < 8; i++) {
        const y = 36 + i * 16;
        tw += `<polygon class="b" points="21,${y + 16} 39,${y + 16} 42,${y} 18,${y}"/><rect class="w" x="23" y="${y + 6}" width="14" height="1.6"/>`;
      }
      tw += '<polygon class="b" points="15,164 45,164 49,200 11,200"/>';
      tower.innerHTML = tw;

      // Timing table shared by the modules and the track bars below.
      const LAUNCH = [0, 450, 900], FLY = 700, BOOM = 1600, RING = 1100, TITLE = 900;
      const TITLE_AT = LAUNCH[2] + FLY + BOOM, TOTAL = TITLE_AT + TITLE;
      const ROWS = [
        { cap: "火箭 ShapeSwirl", bars: LAUNCH.map((t) => [t, FLY]), c: COLORS[0] },
        { cap: "Burst", bars: LAUNCH.map((t) => [t + FLY, BOOM]), c: COLORS[2] },
        { cap: "光環 Shape", bars: LAUNCH.map((t) => [t + FLY, RING]), c: COLORS[1] },
        { cap: "標題 append", bars: [[TITLE_AT, TITLE]], c: COLORS[3] },
      ];
      for (const r of ROWS) {
        tracks.insertAdjacentHTML("beforeend", `<div class="trk"><span class="cap">${r.cap}</span><div class="ln">${r.bars.map(([s, d]) => `<i style="left:${(s / TOTAL) * 100}%;width:${(d / TOTAL) * 100}%;background:${r.c}"></i>`).join("")}</div></div>`);
      }

      const keep = tracker(ctx);
      let tl = null, auto = true, slider = null;
      function build(W, H) {
        keep.stopAll();
        fx.replaceChildren();
        const top = ctx.controls.offsetHeight + 16, ground = H - tracks.offsetHeight - 18;
        const th = clamp((ground - top) * 0.62, 80, 300);
        Object.assign(tower.style, { height: `${th}px`, width: `${th * 0.3}px`, top: `${ground - th}px` });
        titleWrap.style.top = `${top + (ground - top) * 0.12}px`;
        const R = clamp(Math.min(W * 0.2, (ground - top) * 0.34), 50, 160);
        const xs = [W * 0.2, W * 0.5, W * 0.8], ys = [top + (ground - top) * 0.36, top + (ground - top) * 0.22, top + (ground - top) * 0.36];
        const FX = { parent: fx, left: 0, top: 0 };
        tl = keep(new mojs.Timeline({
          onUpdate(ep, p) { ph.style.left = `${p * 100}%`; if (slider) syncSlider(slider, p, `${((p * TOTAL) / 1000).toFixed(1)}s`); },
          onComplete(isForward) { if (isForward && auto) ctx.timeout(() => auto && tl.replay(), 1600); },
        }));
        LAUNCH.forEach((t0, i) => {
          const c = COLORS[[2, 0, 1][i]], c2 = COLORS[[4, 5, 3][i]];
          const startY = i === 1 ? ground - th : ground;
          tl.add(
            new mojs.ShapeSwirl({ ...FX, x: xs[i], y: { [startY]: ys[i] }, shape: "circle", fill: "#fff6c8", radius: 4, scale: { 1: 0.5 }, swirlSize: 4, swirlFrequency: 5, duration: FLY, delay: t0, easing: "cubic.out", isShowEnd: false }),
            new mojs.Burst({ ...FX, x: xs[i], y: ys[i], radius: { 0: R }, count: 24, timeline: { delay: t0 + FLY }, children: { scale: 1, shape: "circle", fill: [c, "#ffffff", c2], radius: { 6: 2 }, opacity: { 1: 0 }, duration: BOOM, easing: "quad.out" } }),
            new mojs.Burst({ ...FX, x: xs[i], y: ys[i], radius: { 0: R * 0.55 }, count: 12, rotate: 15, timeline: { delay: t0 + FLY + 120 }, children: { scale: 1, shape: "line", stroke: c2, strokeWidth: { 3: 0 }, radius: { 10: 2 }, duration: BOOM * 0.8, easing: "cubic.out" } }),
            new mojs.Shape({ ...FX, x: xs[i], y: ys[i], shape: "circle", fill: "none", stroke: c, radius: { 0: R * 0.75 }, strokeWidth: { 10: 0 }, duration: RING, delay: t0 + FLY, easing: "cubic.out" }),
          );
        });
        tl.append(new mojs.Html({ el: title, opacity: { 0: 1 }, scale: { 0.6: 1 }, y: { 24: 0 }, duration: TITLE, easing: "back.out" }));
        tl.play();
      }
      ctx.button("播放", () => { auto = true; tl.replay(); }, { primary: true });
      ctx.button("倒放", () => { auto = false; tl.playBackward(); });
      ctx.button("暫停", () => { auto = false; tl.pause(); });
      slider = ctx.slider("進度", { min: 0, max: 1, step: 0.01, value: 0, format: (v) => `${((v * TOTAL) / 1000).toFixed(1)}s` }, (v) => {
        auto = false;
        tl.pause();
        tl.setProgress(v);
      });
      build(ctx.size().width, ctx.size().height);
      ctx.onResize(({ width, height }) => build(width, height));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new mojs.Burst({ count, timeline: { onComplete } }).tune({ x, y }).replay()",
    desc: "每個 Burst 播完就換到新位置重播，逐級增加同時播放的 Burst 數量，直到掉到 30 FPS 以下。可切換每組的粒子數比較成本。",
    hint: "按「自動加壓」開始・切換每組粒子數後再測一次",
    mount(ctx) {
      ctx.html(`<div class="sview"></div>`);
      const view = ctx.$(".sview");
      ctx.controls.classList.add("bottom");
      let kids = 12, target = 0, list = [];

      function make() {
        const it = { busy: false, next: performance.now() + rnd(0, 900) };
        it.b = new mojs.Burst({
          parent: view, left: 0, top: 0, x: -200, y: -200, radius: { 0: 56 }, count: kids,
          timeline: { onComplete() { it.busy = false; it.next = performance.now() + rnd(0, 250); } },
          children: { shape: ["circle", "rect", "polygon"], fill: COLORS, radius: { 6: 0 }, duration: 1000, easing: "quad.out" },
        });
        return it;
      }
      const drop = (it) => { it.b.stop(); it.b.el.remove(); };
      function setCount(n) {
        target = n;
        while (list.length < n) list.push(make());
        while (list.length > n) drop(list.pop());
      }
      ctx.onCleanup(() => { list.forEach(drop); list = []; });

      ctx.raf(() => {
        const now = performance.now(), W = view.clientWidth, H = view.clientHeight;
        for (const it of list) {
          if (it.busy || now < it.next) continue;
          it.busy = true;
          it.b.tune({ x: rnd(40, W - 40), y: rnd(40, H - 40) }).replay();
        }
      });
      ctx.group(["每組 6 粒", "12 粒", "24 粒"], 1, (i) => {
        kids = [6, 12, 24][i];
        list.forEach(drop);
        list = [];
        setCount(target);
      });
      ctx.ramp({
        label: "同時 Burst", unit: "組", steps: [10, 25, 50, 100, 200, 300, 500], minFps: 30,
        apply(n) { setCount(n); },
        metrics: () => ({
          粒子: list.length * kids,
          "DOM 節點": view.getElementsByTagName("*").length,
        }),
        note: "每顆粒子都是獨立的 div 加 SVG，mo.js 每格逐一改寫 transform、半徑與透明度屬性，瓶頸在 DOM 屬性寫入與圖層合成，而不是 JS 計算。每組粒子數加倍，DOM 節點與每格寫入量也跟著加倍。",
      });
    },
  },
] });
</script>
</body>
</html>
