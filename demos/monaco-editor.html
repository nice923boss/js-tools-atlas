<script>
// Monaco is one global instance: load it once, then every scene creates its own editors, models and
// providers and registers their dispose() with the scene, so switching scenes leaves no model behind.
// The 0.57 AMD build installs MonacoEnvironment.getWorker itself and wraps the cross-origin worker
// scripts in same-origin blobs, so the language workers run off the main thread from the CDN.
require.config({ paths: { vs: "https://cdn.jsdelivr.net/npm/monaco-editor@0.57.0/min/vs" } });
let monacoReady = null;
const loadMonaco = () => (monacoReady ||= new Promise((resolve, reject) => {
  require(["vs/editor/editor.main"], () => resolve(window.monaco), (e) => { monacoReady = null; reject(e); });
}));
async function mo(ctx, theme = "vs-dark") {
  const st = ctx.status("載入 Monaco 編輯器…");
  try { await loadMonaco(); } finally { st.done(); }
  if (!ctx.active) throw new DOMException("Scene unmounted", "AbortError");
  monaco.editor.setTheme(theme);
  return monaco;
}
const font = () => ({ fontFamily: getComputedStyle(document.body).getPropertyValue("--mono").trim() || "monospace", fontSize: 13 });
// Models first, editors second: cleanups run in reverse, so editors are disposed before their models.
function mkModel(ctx, text, lang, path) {
  const m = monaco.editor.createModel(text, lang, monaco.Uri.parse(`file:///${path}`));
  ctx.onCleanup(() => m.dispose());
  return m;
}
function mkEditor(ctx, el, opts) {
  const ed = monaco.editor.create(el, {
    automaticLayout: true, fixedOverflowWidgets: true, scrollBeyondLastLine: false, lineNumbersMinChars: 3,
    padding: { top: 8 }, minimap: { enabled: false }, ...font(), ...opts,
  });
  ctx.onCleanup(() => ed.dispose());
  return ed;
}
const keep = (ctx, disposable) => { ctx.onCleanup(() => disposable.dispose()); return disposable; };
const esc = (s) => String(s).replace(/[<>&"]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]));
function toaster(ctx) {
  const el = Showcase.h("div", { class: "mo-toast" });
  ctx.el.append(el);
  let t = 0;
  ctx.onCleanup(() => clearTimeout(t));
  return (text) => { el.textContent = text; el.classList.add("on"); clearTimeout(t); t = setTimeout(() => el.classList.remove("on"), 2600); };
}
// Stop scripted demos as soon as the visitor touches the editor.
function touchGuard(ctx, ...nodes) {
  const g = { touched: false };
  for (const n of nodes) { ctx.on(n, "pointerdown", () => (g.touched = true)); ctx.on(n, "keydown", () => (g.touched = true)); }
  return g;
}
const registered = new Set();
const ensureLanguage = (id, ext) => { if (!registered.has(id)) { monaco.languages.register({ id, extensions: ext ? [ext] : [] }); registered.add(id); } };

// ---------- 1. TypeScript sample ----------
const BUGGY = `// 旅遊行程規劃：瀏覽器裡跑完整的 TypeScript 型別檢查
export interface Spot {
  name: string;
  day: number;
  hours: number;
  tags?: string[];
}

const trip: Spot[] = [
  { name: "峽灣步道", day: 1, hours: 3, tags: ["健行"] },
  { name: "瀑布彩虹", day: "1", hours: 2 },
  { name: "紅岩峽谷", day: 3, hours: 4 },
];

function totalHours(spots: Spot[]): number {
  return spots.reduce((sum, s) => sum + s.hours, 0);
}

function plan(spots: Spot[]): string[] {
  const byDay = new Map<number, Spot[]>();
  for (const s of spots) {
    byDay.set(s.day, [...(byDay.get(s.day) ?? []), s]);
  }
  return [...byDay].map(([day, list]) => \`第 \${day} 天：\${list.map((s) => s.name).join("、")}\`);
}

console.log(plan(trip).join("\\n"));
console.log(\`總時數 \${totalHours(trip)} 小時，第一站 \${trip[0].nmae}\`);
`;

  .replace('day: "1"', "day: 1")

  .replace("function plan(", `function busiest(spots: Spot[]): number {

}

function plan(`)

      const editor = mkEditor(ctx, ctx.$(".mo-ed"), { model, inlayHints: { enabled: "on" }, quickSuggestions: true, suggest: { showStatusBar: true } });
      function act(id) { editor.focus(); editor.trigger("demo", id, {}); }
      function hoverOn(word) {
        const m = model.findMatches(word, false, false, true, null, false)[0];
        if (!m) return;
        editor.setPosition({ lineNumber: m.range.startLineNumber, column: m.range.startColumn + 1 });
        editor.focus(); editor.trigger("demo", "editor.action.showHover", {});
      }
      const guard = touchGuard(ctx, ctx.$(".mo-ed"));
      const end = { lineNumber: model.getLineCount(), column: model.getLineMaxColumn(model.getLineCount()) };
      ctx.timeout(() => { if (!guard.touched) { editor.setPosition(end); act("editor.action.triggerParameterHints"); } }, 400);
      ctx.timeout(() => { if (!guard.touched) act("editor.action.triggerSuggest"); }, 900);
    },
  },
  {
    id: "diff", title: "差異比對",
    api: "editor.createDiffEditor(el, opts)・setModel({ original, modified })・goToDiff('next')",
    desc: "內建的差異編輯器：並排或行內顯示、字元層級標出改動、未變更區段可收合；右側新版可以直接編輯，差異即時重算。",
    hint: "切換並排／行內，按「下一處」跳到下一個變更；右邊可以直接改",
    async mount(ctx) {
      ctx.html(`<div class="mo-fill mo-one"><section class="mo-pane"><div class="mo-head"><b>trip.ts</b><span class="muted">舊版</span><span class="sp"></span><b>trip.ts</b><span class="muted">新版（可編輯）</span></div><div class="mo-ed"></div><div class="mo-sbar"><span>變更區塊 <b class="mo-num c">…</b></span><span>新增 <b class="mo-num a">…</b> 行</span><span>刪除 <b class="mo-num d">…</b> 行</span><span class="grow mo-num at"></span></div></section></div>`);
      const side = ctx.size().width >= 560;
      ctx.group(["並排", "行內"], side ? 0 : 1, (i) => diff.updateOptions({ renderSideBySide: i === 0 }));
      ctx.toggle("收合未變更", false, (v) => diff.updateOptions({ hideUnchangedRegions: { enabled: v } }));
      ctx.toggle("忽略空白", true, (v) => diff.updateOptions({ ignoreTrimWhitespace: v }));
      ctx.button("下一處", () => { diff.goToDiff("next"); diff.getModifiedEditor().focus(); });
      await mo(ctx);
      const original = mkModel(ctx, BUGGY, "typescript", "s5/trip.before.ts");
      const modified = mkModel(ctx, IMPROVED, "typescript", "s5/trip.after.ts");
      const diff = monaco.editor.createDiffEditor(ctx.$(".mo-ed"), {
        automaticLayout: true, fixedOverflowWidgets: true, ...font(), originalEditable: false, renderSideBySide: side,
        useInlineViewWhenSpaceIsLimited: false, minimap: { enabled: false }, scrollBeyondLastLine: false, lineNumbersMinChars: 3,
      });
      ctx.onCleanup(() => diff.dispose());
      diff.setModel({ original, modified });
      keep(ctx, diff.onDidUpdateDiff(() => {
        const ch = diff.getLineChanges() || [];
        const span = (s, e) => (e >= s && e > 0 ? e - s + 1 : 0);
        ctx.$(".c").textContent = ch.length;
        ctx.$(".a").textContent = ch.reduce((n, c) => n + span(c.modifiedStartLineNumber, c.modifiedEndLineNumber), 0);
        ctx.$(".d").textContent = ch.reduce((n, c) => n + span(c.originalStartLineNumber, c.originalEndLineNumber), 0);
      }));
      keep(ctx, diff.getModifiedEditor().onDidChangeCursorPosition((e) => (ctx.$(".at").textContent = `新版游標 ${e.position.lineNumber}:${e.position.column}`)));
      ctx.timeout(() => diff.goToDiff("next"), 1200);
    },
  },
  {
    id: "markers", title: "標記與快速修正",
    api: "editor.setModelMarkers(model, owner, markers)・registerCodeActionProvider・createDecorationsCollection",
    desc: "自訂 linter 每次改動就重算 markers（波浪線、捲軸標記、右側清單同步）；code action provider 提供燈泡快速修正；TODO 與 FIXME 用 decorations 加上整行底色、邊欄圓點與行尾注記。",
    hint: "點波浪線旁的燈泡或按 Ctrl+. 套用修正；右側也能逐條修正",
    async mount(ctx) {
      ctx.html(`<div class="mo-fill mo-side">
        <section class="mo-pane"><div class="mo-head"><b>clean.py</b><span class="sp"></span><code>owner：atlas-lint</code></div><div class="mo-ed"></div></section>
        <section class="mo-pane"><div class="mo-head">markers<span class="sp"></span><span class="mo-num n"></span></div><ul class="mo-list"></ul></section></div>`);
      const allBtn = ctx.button("全部修正", () => applyAll());
      const resetBtn = ctx.button("重設", () => model.setValue(LINT_DOC));
      allBtn.disabled = resetBtn.disabled = true;
      await mo(ctx);
      allBtn.disabled = resetBtn.disabled = false;
      const model = mkModel(ctx, LINT_DOC, "python", "s6/clean.py");
      const editor = mkEditor(ctx, ctx.$(".mo-ed"), { model, glyphMargin: true, minimap: { enabled: ctx.size().width > 700 } });
      const fixes = new Map();
      const deco = editor.createDecorationsCollection();
      ctx.onCleanup(() => deco.clear());
      function lint() {
        const markers = [], decos = [];
        fixes.clear();
        for (let n = 1; n <= model.getLineCount(); n++) {
          const text = model.getLineContent(n);
          for (const r of RULES) {
            for (const m of text.matchAll(r.re)) {
              const col = m.index + 1, range = new monaco.Range(n, col, n, col + m[0].length);
              markers.push({ ...range, severity: r.sev, message: r.msg, code: r.code, source: "atlas-lint" });
              fixes.set(`${n}:${col}:${r.code}`, { range, text: r.fix(m) });
            }
          }
          if (text.length > 79) markers.push({ startLineNumber: n, startColumn: 80, endLineNumber: n, endColumn: text.length + 1, severity: 1, message: `這一行 ${text.length} 字，超過 79 字上限`, code: "E501", source: "atlas-lint" });
          const todo = text.match(/#\s*(TODO|FIXME)/);
          if (todo) {
            const fixme = todo[1] === "FIXME", c = text.indexOf(todo[1]) + 1;
            decos.push({ range: new monaco.Range(n, 1, n, 1), options: { isWholeLine: true, className: "mo-todo-line", glyphMarginClassName: `mo-glyph${fixme ? " fix" : ""}`, glyphMarginHoverMessage: { value: fixme ? "**FIXME**：需要修正" : "**TODO**：待辦事項" }, overviewRuler: { color: fixme ? "#f72585" : "#f7df1e", position: monaco.editor.OverviewRulerLane.Center }, minimap: { color: fixme ? "#f72585" : "#f7df1e", position: monaco.editor.MinimapPosition.Inline } } });
            decos.push({ range: new monaco.Range(n, c, n, c + todo[1].length), options: { inlineClassName: "mo-todo-word", after: { content: fixme ? "　需要修正" : "　待辦", inlineClassName: "mo-after" } } });
          }
        }
        monaco.editor.setModelMarkers(model, "atlas-lint", markers);
        deco.set(decos);
        renderList(markers);
      }
      function renderList(markers) {
        const list = ctx.$(".mo-list");
        list.textContent = "";
        ctx.$(".n").textContent = `${markers.length} 則`;
        if (!markers.length) list.append(Showcase.h("li", { class: "mo-ok", text: "沒有 marker，程式碼乾淨了" }));
        for (const m of markers) {
          const f = fixes.get(`${m.startLineNumber}:${m.startColumn}:${m.code}`);
          const li = Showcase.h("li", { class: "mo-click" }, Showcase.h("span", { class: `mo-sev s${m.severity}`, text: m.code }), `第 ${m.startLineNumber} 行：${m.message}`);
          if (f) li.append(Showcase.h("button", { class: "btn", type: "button", onclick: (e) => { e.stopPropagation(); editor.executeEdits("atlas-lint", [f]); } }, "修正"));
          li.addEventListener("click", () => { editor.setSelection(new monaco.Range(m.startLineNumber, m.startColumn, m.endLineNumber, m.endColumn)); editor.revealLineInCenter(m.startLineNumber); editor.focus(); });
          list.append(li);
        }
      }
      function applyAll() {
        if (!fixes.size) return;
        editor.pushUndoStop(); editor.executeEdits("atlas-lint", [...fixes.values()]); editor.pushUndoStop();
      }
      // The light bulb: Monaco asks for actions at the cursor and passes the markers under it.
      keep(ctx, monaco.languages.registerCodeActionProvider("python", {
        provideCodeActions(m, range, context) {
          if (m !== model) return { actions: [], dispose() {} };
          const actions = context.markers.filter((x) => x.source === "atlas-lint").flatMap((x) => {
            const f = fixes.get(`${x.startLineNumber}:${x.startColumn}:${x.code}`);
            return f ? [{ title: `修正 ${x.code}：改成 ${f.text.trim()}`, diagnostics: [x], kind: "quickfix", isPreferred: true, edit: { edits: [{ resource: model.uri, textEdit: f, versionId: model.getVersionId() }] } }] : [];
          });
          return { actions, dispose() {} };
        },
      }));
      let timer = 0;
      ctx.onCleanup(() => { clearTimeout(timer); monaco.editor.setModelMarkers(model, "atlas-lint", []); });
      keep(ctx, model.onDidChangeContent(() => { clearTimeout(timer); timer = setTimeout(lint, 200); }));
      lint();
      const guard = touchGuard(ctx, ctx.$(".mo-ed"));
      ctx.timeout(() => {
        if (guard.touched) return;
        const first = [...fixes.values()][0];
        editor.setPosition({ lineNumber: first.range.startLineNumber, column: first.range.startColumn + 1 });
        editor.revealLineInCenter(first.range.startLineNumber);
        editor.focus();
        editor.trigger("demo", "editor.action.quickFix", {});
      }, 900);
    },
  },
  {
    id: "workspace", title: "多檔與命令",
    api: "editor.setModel(model)・saveViewState()／restoreViewState()・editor.addAction({ id, label, keybindings, run })",
    desc: "一個編輯器切換四個 model，各自保留游標與捲動位置；用 addAction 加入自訂動作，會出現在命令面板（F1）與右鍵選單，也綁上快捷鍵。右上可以調整縮圖的顯示方式。",
    hint: "按 F1 或「命令面板」找 Atlas 動作；Ctrl+Shift+U 轉大寫，Ctrl+S 儲存",
    async mount(ctx) {
      ctx.html(`<div class="mo-fill mo-one"><section class="mo-pane"><div class="mo-tabs" role="tablist"></div><div class="mo-ed"></div><div class="mo-sbar"><span class="mo-num lang"></span><span class="mo-num pos"></span><span class="mo-num ver"></span><span class="grow">全域 model 數 <b class="mo-num cnt"></b></span></div></section></div>`);
      const opts = { enabled: true, size: "proportional", renderCharacters: true };
      const setMini = (k, v) => { opts[k] = v; editor && editor.updateOptions({ minimap: { ...opts } }); };
      ctx.button("命令面板", () => { editor.focus(); editor.trigger("demo", "editor.action.quickCommand", null); });
      ctx.toggle("縮圖", true, (v) => setMini("enabled", v));
      ctx.group(["等比", "填滿", "縮放"], 0, (i) => setMini("size", ["proportional", "fill", "fit"][i]));
      ctx.toggle("字元", true, (v) => setMini("renderCharacters", v));
      let editor = null;
      await mo(ctx);
      const files = FILES.map(([name, lang, text]) => {
        const model = mkModel(ctx, text, lang, `s7/${name}`);
        return { name, model, saved: model.getAlternativeVersionId(), view: null };
      });
      editor = mkEditor(ctx, ctx.$(".mo-ed"), { model: files[0].model, minimap: { ...opts }, glyphMargin: false });
      const tabs = ctx.$(".mo-tabs");
      let cur = files[0];
      const paintTabs = () => {
        tabs.innerHTML = files.map((f, i) => `<button type="button" role="tab" data-i="${i}" aria-selected="${f === cur}">${f.name}${f.model.getAlternativeVersionId() !== f.saved ? '<span class="dot">●</span>' : ""}</button>`).join("");
      };
      const paintBar = () => {
        const p = editor.getPosition();
        ctx.$(".lang").textContent = cur.model.getLanguageId();
        ctx.$(".pos").textContent = `行 ${p.lineNumber}，欄 ${p.column}`;
        ctx.$(".ver").textContent = `版本 v${cur.model.getVersionId()}`;
        ctx.$(".cnt").textContent = monaco.editor.getModels().length;
      };
      function open(f) {
        if (f === cur) return;
        cur.view = editor.saveViewState();
        cur = f;
        editor.setModel(f.model);
        if (f.view) editor.restoreViewState(f.view);
        paintTabs(); paintBar();
      }
      ctx.on(tabs, "click", (e) => { const b = e.target.closest("button"); if (b) { open(files[+b.dataset.i]); editor.focus(); } });
      const K = monaco.KeyMod, C = monaco.KeyCode, toast = toaster(ctx);
      editor.addAction({ id: "atlas.upper", label: "Atlas：選取文字轉大寫", keybindings: [K.CtrlCmd | K.Shift | C.KeyU], contextMenuGroupId: "1_modification", contextMenuOrder: 1,
        run: (ed) => ed.executeEdits("atlas.upper", ed.getSelections().map((s) => ({ range: s, text: ed.getModel().getValueInRange(s).toUpperCase() }))) });
      editor.addAction({ id: "atlas.stamp", label: "Atlas：插入目前時間", keybindings: [K.CtrlCmd | K.Alt | C.KeyT], contextMenuGroupId: "1_modification", contextMenuOrder: 2,
        run: (ed) => ed.executeEdits("atlas.stamp", ed.getSelections().map((s) => ({ range: s, text: new Date().toLocaleString("zh-TW", { hour12: false }) }))) });
      editor.addAction({ id: "atlas.save", label: "Atlas：儲存目前檔案", keybindings: [K.CtrlCmd | C.KeyS],
        run: () => { cur.saved = cur.model.getAlternativeVersionId(); paintTabs(); toast(`已儲存 ${cur.name}（示範：只記錄版本號）`); } });
      editor.addAction({ id: "atlas.next", label: "Atlas：切換到下一個檔案", keybindings: [K.Alt | C.KeyN],
        run: () => open(files[(files.indexOf(cur) + 1) % files.length]) });
      keep(ctx, editor.onDidChangeModelContent(() => { paintTabs(); paintBar(); }));
      keep(ctx, editor.onDidChangeCursorPosition(paintBar));
      paintTabs(); paintBar();
      const guard = touchGuard(ctx, ctx.$(".mo-ed"), tabs);
      ctx.timeout(() => { if (!guard.touched) open(files[1]); }, 500);
      ctx.timeout(() => {
        if (guard.touched) return;
        editor.setSelection(new monaco.Range(6, 7, 6, 14));
        editor.getAction("atlas.upper").run();
      }, 1000);
      ctx.timeout(() => { if (!guard.touched) { editor.focus(); editor.trigger("demo", "editor.action.quickCommand", null); } }, 1600);
      // Pre-filter the palette so the custom actions registered above are what the visitor sees.
      ctx.timeout(() => {
        const input = ctx.el.querySelector(".quick-input-widget input");
        if (guard.touched || !input) return;
        input.value = ">Atlas";
        input.dispatchEvent(new Event("input", { bubbles: true }));
      }, 1900);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "model.setValue(text)・editor.setScrollTop(y)",
    desc: "Python 檔從 1 千行加到 100 萬行：量 setValue 換掉整份文件的耗時，再連續捲動並隨機跳躍看 FPS。Monaco 只繪製可視範圍，DOM 行數幾乎不變。",
    hint: "按「自動加壓」逐級加行數；可關掉語法高亮或縮圖比較",
    async mount(ctx) {
      ctx.html(`<div class="mo-stress"><section class="mo-pane"><div class="mo-head"><b>big.py</b><span class="sp"></span><code class="info">…</code></div><div class="mo-ed"></div></section></div>`);
      await mo(ctx);
      const model = mkModel(ctx, "", "python", "s8/big.py");
      const editor = mkEditor(ctx, ctx.$(".mo-ed"), { model, minimap: { enabled: true } });
      ctx.controls.classList.add("bottom");
      ctx.toggle("語法高亮", true, (v) => monaco.editor.setModelLanguage(model, v ? "python" : "plaintext"));
      ctx.toggle("縮圖", true, (v) => editor.updateOptions({ minimap: { enabled: v } }));
      let loadMs = 0, frames = 0;
      // Continuous scroll plus a random jump every 40 frames, so new lines must be tokenized and laid out.
      ctx.raf(() => {
        const max = editor.getScrollHeight() - editor.getLayoutInfo().height;
        if (max <= 0) return;
        if (++frames % 40 === 0) editor.setScrollTop(Math.random() * max);
        else editor.setScrollTop(editor.getScrollTop() + 120 >= max ? 0 : editor.getScrollTop() + 120);
      });
      ctx.ramp({
        label: "行數", unit: "行", steps: [1000, 10000, 50000, 100000, 250000, 500000, 1000000], minFps: 30,
        apply: async (n) => {
          const text = stressDoc(n);
          await ctx.frame(1);
          const t = performance.now();
          model.setValue(text);
          editor.render(true);
          loadMs = performance.now() - t;
          ctx.$(".info").textContent = `${Showcase.fmt(model.getLineCount() - 1)} 行・${(text.length / 1048576).toFixed(1)} MB 字元`;
        },
        metrics: () => ({ "setValue 耗時": Showcase.fmtMs(loadMs), "DOM 行數": String(ctx.el.querySelectorAll(".view-line").length) }),
        note: "setValue 耗時包含建立 piece tree 與強制一次同步繪製；捲動時每 40 格隨機跳到文件任一處，逼 Monaco 補做該段的 Monarch 斷詞。檔案超過約 30 萬行或 20 MB 時，Monaco 會自動關掉部分功能（大檔最佳化）。",
      });
    },
  },
] });
</script>
