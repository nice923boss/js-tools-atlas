<script src="https://cdn.jsdelivr.net/npm/motion@14.0.0/dist/motion.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Motion (motion.dev) vanilla JS showcase: physical springs, keyframes with per-segment easing,
// stagger origins, labelled sequences, scroll() / inView(), number and colour tweens,
// hover() / press() gestures and an animated-element stress ramp.
const { animate, spring, stagger, scroll, inView, hover, press, motionValue, springValue, styleEffect, interpolate, calcGeneratorDuration } = Motion;

const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const MUTED = css.getPropertyValue("--muted").trim(), FONT = css.getPropertyValue("--font").trim() || "sans-serif";
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Re-run fn when a measured element changes size. ctx.onResize only watches the scene itself,
// and the control bar height is published asynchronously after mount, which shrinks inner boxes.
function fit(ctx, el, fn) {
  let lw = el.clientWidth, lh = el.clientHeight, pending = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      if (el.clientWidth === lw && el.clientHeight === lh) return;
      lw = el.clientWidth;
      lh = el.clientHeight;
      fn();
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); });
}

// animate() returns playback controls; keep the unfinished ones so unmounting a scene can stop them.
function tracker(ctx) {
  const live = new Set();
  ctx.onCleanup(() => { live.forEach((a) => a.stop()); live.clear(); });
  return (a) => {
    for (const x of live) if (x.state === "finished" || x.state === "idle") live.delete(x);
    live.add(a);
    return a;
  };
}

// Deterministic dots as layered radial gradients (stars, town lights).
function dots(n, seed, color, y0 = 0, y1 = 100) {
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  return Array.from({ length: n }, () => {
    const r = (0.7 + rnd() * 1.1).toFixed(1);
    return `radial-gradient(${r}px ${r}px at ${(rnd() * 100).toFixed(1)}% ${(y0 + rnd() * (y1 - y0)).toFixed(1)}%, ${color} 60%, transparent 100%)`;
  }).join(",");
}

Showcase.run({ scenes: [
  {
    id: "spring", title: "彈簧物理",
    api: "animate(mv, x, { type: spring, stiffness, damping, mass, velocity }) | spring(visualDuration, bounce)",
    desc: "四顆球跑同一段位移，差別只在彈簧參數：stiffness 越高越快、damping 越低越會晃、mass 越大越慢越沉；第四條改用感知參數 bounce 與 visualDuration，直接指定「看起來多久到位、彈多少」。球的位置是 motionValue，放手時把 getVelocity() 當初速交給彈簧，甩得越快回彈越大。每條標示 calcGeneratorDuration() 算出的停穩時間，下方曲線取樣自同一個 spring 產生器；第四條的虛線圈改用 spring() 輸出的 CSS linear() 緩動，交給純 CSS transition 跑，和實心球重疊代表兩者一致。",
    hint: "拖住任一顆球甩出去再放開",
    mount(ctx) {
      const LANES = [
        { name: "軟Q", c: C[2], p: { stiffness: 120, damping: 6 } },
        { name: "標準", c: C[1], p: { stiffness: 300, damping: 20 } },
        { name: "加重", c: C[3], p: { stiffness: 300, damping: 20, mass: 4 } },
        { name: "感知參數", c: C[0], p: null },
      ];
      ctx.html(`<div class="board sp1"><div class="lanes1">${LANES.map((L) => `<div class="lane1" style="--c:${L.c}"><div class="lab"><b>${L.name}</b><small></small><code></code></div><div class="trk">${L.p ? "" : '<i class="ghost"></i>'}<i class="ball"></i></div></div>`).join("")}</div>
        <div class="panel chart1"><code class="tag"></code><div class="cv"><canvas></canvas></div></div></div>`);
      const lanesEl = ctx.$(".lanes1"), cv = ctx.$("canvas"), g = cv.getContext("2d"), tag = ctx.$(".chart1 .tag");
      let bounce = 0.45, vd = 0.5, playStart = performance.now(), pauseUntil = 0;
      const lanes = ctx.$$(".lane1").map((row, i) => {
        const L = { ...LANES[i], ball: row.querySelector(".ball"), trk: row.querySelector(".trk"), ghost: row.querySelector(".ghost"),
          small: row.querySelector("small"), code: row.querySelector("code"), mv: motionValue(0), side: 0, gen: null };
        // Squash along the direction of travel in proportion to the value's current velocity.
        L.mv.on("change", (v) => {
          const k = Math.min(Math.abs(L.mv.getVelocity()) / 2500, 0.45);
          L.ball.style.transform = `translateX(${v.toFixed(1)}px) scale(${(1 + k).toFixed(3)}, ${(1 - k * 0.6).toFixed(3)})`;
        });
        ctx.onCleanup(() => { L.mv.stop(); L.mv.destroy(); });
        return L;
      });
      const ghostLane = lanes[3];
      const params = (L) => L.p || { bounce, visualDuration: vd };
      const maxX = (L) => L.trk.clientWidth - L.ball.offsetWidth - 6;
      // Rest points sit inside the track so even the bounciest overshoot stays visible.
      const restX = (L, side) => maxX(L) * (side ? 0.75 : 0.25);

      function refresh() {
        lanes.forEach((L) => {
          const p = params(L);
          L.gen = spring({ keyframes: [0, 1], ...p });
          L.small.textContent = `停穩 ${(calcGeneratorDuration(L.gen) / 1000).toFixed(2)} s`;

        });

      ctx.on(scrub, "pointerup", () => { scrubbing = false; });
      ctx.on(scrub, "pointercancel", () => { scrubbing = false; });
      chips.forEach((c, i) => ctx.on(c, "click", () => seek(Object.values(LABELS)[i])));

      const pauseBtn = ctx.toggle("暫停", false, setPaused);
      ctx.button("重播", () => { setPaused(false); seek(0); }, { primary: true });
      ctx.slider("速度", { min: 0.25, max: 2, step: 0.25, value: 1, format: (v) => `${v}×` }, (v) => { speed = v; seq.speed = v; });
      fit(ctx, pad, build);
      build();
    },
  },
  {
    id: "scroll", title: "捲動與進場",
    api: "scroll(animate(bar, { transform }), { container }) | scroll(fn, { target, offset }) | inView(el, enter → leave, { root, amount })",
    desc: "整段在一個內嵌的捲動容器裡。頂端進度條是用 scroll() 綁住的 animate()，瀏覽器支援時會交給原生 ScrollTimeline，不必每格跑 JS；每站的大數字用 scroll() 的 target 與 offset 只追蹤自己那張卡片從進入到離開的進度，做出視差。卡片由 inView() 偵測露出 35% 時以彈簧浮現，回傳的函式在離開時淡出。右側數字來自 scroll() 回呼的 info（位置、進度、速度），路線圖的亮燈則由 inView() 控制。",
    hint: "滾輪或拖曳捲動清單，自動捲動會停下",
    mount(ctx) {
      const STOPS = [["台北", "環島的起點也是終點"], ["新竹", "風城，米粉與貢丸"], ["台中", "宮原眼科與太陽餅"], ["嘉義", "阿里山林業鐵路從這裡出發"], ["台南", "府城古蹟與小吃"],
        ["高雄", "港都，愛河與駁二"], ["台東", "鹿野高台的熱氣球"], ["花蓮", "太魯閣與清水斷崖"], ["宜蘭", "蘭陽平原望龜山島"]];
      ctx.html(`<div class="board st5"><div class="feedw"><i class="pbar"></i><div class="feed" tabindex="0">
        <header class="hero"><b>環島鐵路一圈</b><small>往下捲動，九站依序進場</small></header>
        ${STOPS.map(([n, d], i) => `<article class="stop" style="--c:${C[i % 6]}"><b class="big">${String(i + 1).padStart(2, "0")}</b><h3>${n}</h3><p>${d}</p></article>`).join("")}
        <footer class="end">回到台北，一圈完成</footer></div></div>
        <div class="panel hud"><dl><dt>位置</dt><dd class="v-px">0 px</dd><dt>進度</dt><dd class="v-p">0%</dd><dt>速度</dt><dd class="v-v">0 px/s</dd><dt>進場</dt><dd class="v-n">0 次</dd></dl>
        <ol class="route">${STOPS.map(([n], i) => `<li style="--c:${C[i % 6]}"><i></i>${n}</li>`).join("")}</ol></div></div>`);
      const feed = ctx.$(".feed"), pbar = ctx.$(".pbar"), arts = ctx.$$(".stop"), route = ctx.$$(".route li");
      const vpx = ctx.$(".v-px"), vp = ctx.$(".v-p"), vv = ctx.$(".v-v"), vn = ctx.$(".v-n");
      const track = tracker(ctx), linked = [], stops = [];
      ctx.onCleanup(() => { stops.forEach((f) => f()); linked.forEach((a) => a.stop()); });
      let entered = 0, lastScroll = 0;

      const bar = animate(pbar, { transform: ["scaleX(0)", "scaleX(1)"] }, { ease: "linear" });
      linked.push(bar);
      stops.push(scroll(bar, { container: feed }));
      stops.push(scroll((p, info) => {
        vpx.textContent = `${Math.round(info.y.current)} px`;
        vp.textContent = `${Math.round(p * 100)}%`;
        vv.textContent = `${Math.round(info.y.velocity)} px/s`;
        lastScroll = performance.now();
      }, { container: feed }));
      arts.forEach((art, i) => {
        art.style.opacity = "0.15";
        art.style.transform = "translateY(28px) scale(0.96)";
        const big = animate(art.querySelector(".big"), { y: [-22, 22] }, { ease: "linear" });
        linked.push(big);
        stops.push(scroll(big, { container: feed, target: art, offset: ["start end", "end start"] }));
        stops.push(inView(art, () => {
          vn.textContent = `${++entered} 次`;
          route[i].classList.add("on");
          track(animate(art, { opacity: 1, y: 0, scale: 1 }, { type: spring, bounce: 0.25, visualDuration: 0.5 }));
          return () => {
            route[i].classList.remove("on");
            const above = art.getBoundingClientRect().top < feed.getBoundingClientRect().top;
            track(animate(art, { opacity: 0.15, y: above ? -28 : 28, scale: 0.96 }, { duration: 0.35 }));
          };
        }, { root: feed, amount: 0.35 }));
      });

      // Auto-scroll ping-pongs through the feed until the user scrolls by themselves.
      let auto = true, pos = 0, dir = 1;
      const autoBtn = ctx.toggle("自動捲動", true, (v) => { auto = v; pos = feed.scrollTop; });
      const stopAuto = () => { if (!auto) return; auto = false; autoBtn.setAttribute("aria-pressed", "false"); };
      ["wheel", "pointerdown", "touchstart", "keydown"].forEach((t) => ctx.on(feed, t, stopAuto, { passive: true }));
      ctx.button("回到頂端", () => { stopAuto(); feed.scrollTo({ top: 0, behavior: "smooth" }); });
      ctx.raf((t, dt) => {
        // scroll() only reports while scrolling; show the velocity dropping to zero once it stops.
        if (lastScroll && t - lastScroll > 200) { vv.textContent = "0 px/s"; lastScroll = 0; }
        if (!auto) return;
        const max = feed.scrollHeight - feed.clientHeight;
        pos += (dir * 90 * dt) / 1000;
        if (pos >= max) { pos = max; dir = -1; } else if (pos <= 0) { pos = 0; dir = 1; }
        feed.scrollTop = pos;
      });
    },
  },
  {
    id: "values", title: "數值與顏色",
    api: "animate(from, to, { onUpdate }) | animate(obj, { h }) | animate(el, { '--p', pathLength, boxShadow }) | interpolate()",
    desc: "animate() 不只動元素：給兩個數字就逐格回傳中間值（溫度讀數），給一個普通物件就直接改它的屬性（濕度，畫面每格讀取）；元素上則動 SVG 的 pathLength（溫度環）、CSS 變數 --p（三根指針共用一個變數）和 box-shadow 這種複合字串。溫度對應的顏色用 interpolate() 把 -5 到 38 °C 映射到藍到紅。右側比較同一對顏色的兩種內插：CSS 漸層在 sRGB 直接平均，中段偏暗；Motion 的顏色混合先平方再開根號（近似線性光），中段比較亮。溫濕度為示意數據。",
    hint: "點城市切換，數字與顏色會補間過去",
    mount(ctx) {
      const CITIES = [["台北", 31.4, 72], ["台中", 30.2, 64], ["高雄", 32.6, 75], ["花蓮", 28.1, 79], ["玉山", 6.3, 92]];
      const TMIN = -5, TMAX = 38, COLD = "#2b6cff", HOT = "#ff2d55";
      const toColor = interpolate([TMIN, TMAX], [COLD, HOT]), mix = interpolate([0, 1], [COLD, HOT]);
      const frac = (t) => (t - TMIN) / (TMAX - TMIN);
      const shadow = (t) => `${toColor(t).replace(/, 1\)$/, ", 0.3)")} 0px 0px 30px 0px`;
      const motionStops = Array.from({ length: 25 }, (_, k) => mix(k / 24)).join(", ");
      ctx.html(`<div class="board st6" style="--p:0"><div class="panel wx">
          <div class="ring"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="50"/><path class="arc" d="M60,10 A50,50 0 1 1 59.99,10"/></svg>
            <div class="mid"><b class="temp">--</b><small>°C・<span class="cname"></span></small></div></div>
          <div class="hum"><span>濕度</span><span class="hbar"><i></i></span><b>0%</b></div>
          <div class="therm"><i class="needle"></i><small style="left:0">${TMIN} °C</small><small style="right:0">${TMAX} °C</small></div>
        </div>
        <div class="panel mixp"><h4>同一對顏色，兩種內插</h4>
          <div class="strip" style="background:linear-gradient(90deg, ${COLD}, ${HOT})"><i class="mk"></i></div><small>CSS linear-gradient：sRGB 直接平均</small>
          <div class="strip" style="background:linear-gradient(90deg, ${motionStops})"><i class="mk"></i></div><small>Motion interpolate()：取樣 25 點</small>
          <div class="sw"><span><i style="background:rgb(149, 77, 170)"></i>CSS 中點 rgb(149, 77, 170)</span><span><i style="background:${mix(0.5)}"></i>Motion 中點 ${mix(0.5).replace(/^rgba\((.*), 1\)$/, "rgb($1)")}</span></div>
          <h4 class="cities-h" style="margin-top:8px">toColor(溫度)：每個城市的顏色</h4>
          <div class="sw cities">${CITIES.map(([n, t]) => `<span><i style="background:${toColor(t)}"></i>${n} ${t}°</span>`).join("")}</div>
          <small class="note">指針位置 = 目前溫度在 ${TMIN} 到 ${TMAX} °C 之間的比例，三根指針都讀同一個被補間的 CSS 變數 --p。</small>
        </div></div>`);
      const board = ctx.$(".st6"), card = ctx.$(".wx"), arc = ctx.$(".arc"), tempEl = ctx.$(".temp"), cityEl = ctx.$(".cname"), humEl = ctx.$(".hum b"), hbar = ctx.$(".hbar i");
      const track = tracker(ctx), chips = ctx.$$(".sw.cities span");
      const state = { t: TMIN, h: 0 };
      let first = true;
      function show(i) {
        const [name, t, h] = CITIES[i];
        cityEl.textContent = name;
        chips.forEach((c, k) => c.classList.toggle("on", k === i));
        track(animate(state.t, t, {
          duration: 1.2, ease: "easeOut",
          onUpdate: (v) => {
            state.t = v;
            const col = toColor(v);
            tempEl.textContent = v.toFixed(1);
            tempEl.style.color = col;
            arc.style.stroke = col;
          },
        }));
        track(animate(state, { h }, { duration: 1.2, ease: "easeOut" }));
        track(animate(arc, { pathLength: first ? [0, frac(t)] : frac(t) }, { type: spring, bounce: 0.3, visualDuration: 0.8 }));
        track(animate(board, { "--p": frac(t) }, { type: spring, bounce: 0.25, visualDuration: 0.8 }));
        track(animate(card, { boxShadow: [shadow(state.t), shadow(t)], borderColor: toColor(t) }, { duration: 1.2 }));
        first = false;
      }
      // The plain object is mutated by Motion; the page reads it every frame.
      ctx.raf(() => {
        humEl.textContent = `${Math.round(state.h)}%`;
        hbar.style.transform = `scaleX(${(state.h / 100).toFixed(4)})`;
      });
      let cur = 0, holdUntil = 0;
      const seg = ctx.group(CITIES.map((c) => c[0]), 0, (i) => { holdUntil = performance.now() + 6000; cur = i; show(i); });
      ctx.interval(() => {
        if (performance.now() < holdUntil) return;
        cur = (cur + 1) % CITIES.length;
        [...seg.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === cur)));
        show(cur);
      }, 2800);
      show(0);
    },
  },
  {
    id: "gestures", title: "懸停與按壓",
    api: "hover(el, () => onEnd) | press(el, () => (e, { success }) => {}) | styleEffect(face, { rotateX: springValue(mv) })",
    desc: "hover() 只回應真正的滑鼠懸停（觸控不會誤觸），開始時卡片以彈簧浮起，回傳的函式在離開時讓它落回；懸停期間游標位置寫進兩個 motionValue，經 springValue() 平滑後由 styleEffect() 套到卡面的 rotateX／rotateY，做出跟手的 3D 傾斜。press() 處理按下與放開，結束回呼的 success 分辨是在卡片上放開（成功，打出漣漪並計數）還是移出卡片才放開（取消）；鍵盤聚焦後按 Enter 也會觸發。閒置幾秒後會用計時器輪流讓一張卡片浮起當示範，那不是模擬手勢。",
    hint: "滑過卡片看傾斜；按住後移出卡片再放開，會記為取消",
    mount(ctx) {
      const SPOTS = [["茶", "阿里山", "高山烏龍"], ["燈", "平溪", "天燈"], ["浪", "墾丁", "南灣"], ["霧", "合歡山", "雲海"], ["廟", "鹿港", "龍山寺"], ["港", "基隆", "正濱漁港"]];
      ctx.html(`<div class="board st7"><div class="tiles">${SPOTS.map(([ico, n, d], i) => `<button class="tile" type="button" style="--c:${C[i % 6]}"><span class="face"><i class="glare"></i><b class="ico">${ico}</b><strong>${n}</strong><small>${d}</small><em class="cnt">0</em></span></button>`).join("")}</div>
        <div class="panel glog"></div></div>`);
      const track = tracker(ctx), tiles = ctx.$$(".tile"), logEl = ctx.$(".glog"), cleanups = [];
      const SPR = { type: spring, stiffness: 400, damping: 22 };
      const hovered = tiles.map(() => false);
      let ok = 0, cancelled = 0, lastTouch = performance.now() - 3800;
      const log = (txt) => { logEl.textContent = `成功 ${ok}・取消 ${cancelled}・最後：${txt}`; };
      ctx.onCleanup(() => cleanups.forEach((f) => f()));
      function ripple(face, e) {
        const r = face.getBoundingClientRect(), dot = document.createElement("i");
        dot.className = "rip";
        dot.style.left = `${e && e.clientX ? e.clientX - r.left : r.width / 2}px`;
        dot.style.top = `${e && e.clientY ? e.clientY - r.top : r.height / 2}px`;
        face.append(dot);
        track(animate(dot, { scale: [0, (2.2 * Math.max(r.width, r.height)) / 60], opacity: [0.45, 0] }, { duration: 0.6, ease: "easeOut" })).then(() => dot.remove());
      }
      tiles.forEach((tile, i) => {
        const face = tile.querySelector(".face"), cnt = tile.querySelector(".cnt");
        const rx = motionValue(0), ry = motionValue(0), persp = motionValue(700);
        const sx = springValue(rx, { stiffness: 260, damping: 20 }), sy = springValue(ry, { stiffness: 260, damping: 20 });
        cleanups.push(styleEffect(face, { rotateX: sx, rotateY: sy, transformPerspective: persp }), () => [rx, ry, sx, sy, persp].forEach((v) => v.destroy()));
        let n = 0;
        cleanups.push(hover(tile, () => {
          hovered[i] = true;
          lastTouch = performance.now();
          track(animate(tile, { y: -6, scale: 1.03 }, SPR));
          const move = (e) => {
            const r = tile.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
            rx.set((0.5 - py) * 16);
            ry.set((px - 0.5) * 20);
            face.style.setProperty("--gx", `${(px * 100).toFixed(1)}%`);
            face.style.setProperty("--gy", `${(py * 100).toFixed(1)}%`);
            lastTouch = performance.now();
          };
          tile.addEventListener("pointermove", move);
          return () => {
            hovered[i] = false;
            tile.removeEventListener("pointermove", move);
            rx.set(0);
            ry.set(0);
            track(animate(tile, { y: 0, scale: 1 }, SPR));
          };
        }));
        cleanups.push(press(tile, () => {
          lastTouch = performance.now();
          track(animate(tile, { scale: 0.94 }, { duration: 0.12 }));
          return (endEv, { success }) => {
            track(animate(tile, { scale: hovered[i] ? 1.03 : 1 }, SPR));
            if (success) {
              cnt.textContent = ++n;
              ok++;
              ripple(face, endEv);
              log(`${SPOTS[i][1]}，成功`);
            } else {
              cancelled++;
              log(`${SPOTS[i][1]}，取消（在卡片外放開）`);
            }
          };
        }));
      });
      log("尚無");
      let demo = 0;
      ctx.interval(() => {
        if (performance.now() - lastTouch < 5000) return;
        const k = demo++ % tiles.length;
        if (hovered[k]) return;
        track(animate(tiles[k], { y: [0, -8, 0], scale: [1, 1.04, 1] }, { duration: 0.9, ease: "easeInOut" }));
        ripple(tiles[k].querySelector(".face"));
      }, 1300);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "animate(els, { x, y }) | animate(els, { transform }) | animate(els, { left, top }) × N",
    desc: "一次 animate() 讓 N 個方塊各自無限往返（repeatType: \"reverse\"），逐級加量直到掉到 30 FPS 以下。三種寫法比較成本：x／y 是 Motion 的獨立變形，每一格由 JS 算好寫回 style；直接給 transform 字串時 Motion 改用瀏覽器原生 WAAPI，變形可以交給合成器；left／top 是版面屬性，每一格都要重新排版。",
    hint: "按「自動加壓」開始；切換模式後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="stress-box"></div>`);
      const box = ctx.$(".stress-box");
      const MODES = ["x／y 變形", "transform（WAAPI）", "left／top 版面"];
      let mode = 0, count = 0, cur = null;
      const clear = () => { if (cur) cur.cancel(); cur = null; box.textContent = ""; };
      function fill(n) {
        clear();
        count = n;
        // Base positions use the CSS translate property so x/y, transform and left/top all animate on top of it.
        const W = box.clientWidth - 48, H = box.clientHeight - 40, frag = document.createDocumentFragment(), els = [];
        for (let i = 0; i < n; i++) {
          const el = document.createElement("i");
          el.style.cssText = `background:${C[i % 6]};translate:${(Math.random() * W).toFixed(1)}px ${(30 + Math.random() * H).toFixed(1)}px`;
          frag.append(el);
          els.push(el);
        }
        box.append(frag);
        if (!n) return;
        // "reverse" maps to WAAPI direction "alternate"; "mirror" would force the transform mode back onto JS.
        const o = { duration: 1.4, repeat: Infinity, repeatType: "reverse", ease: "easeInOut", delay: (i) => (i * 0.618) % 1.4 };
        if (mode === 0) cur = animate(els, { x: [0, 40], y: [0, -30] }, o);
        else if (mode === 1) cur = animate(els, { transform: ["translate(0px, 0px)", "translate(40px, -30px)"] }, o);
        else cur = animate(els, { left: ["0px", "40px"], top: ["0px", "-30px"] }, o);
      }
      ctx.onCleanup(clear);
      ctx.group(["x／y", "transform", "left／top"], 0, (i) => { mode = i; fill(count); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "動畫元素", steps: [250, 500, 1000, 2000, 4000, 8000, 16000], minFps: 30,
        apply: fill,
        metrics: () => ({
          "模式": MODES[mode],
          "計算者": mode === 1 ? "瀏覽器" : "JS",
          "動畫數": mode === 1 ? count : count * 2,
        }),
        note: "x／y、left／top 由 JS 每格計算（每個元素兩個動畫）；transform 交給 WAAPI，可由合成器播放，此處 FPS 只量主執行緒，數字偏樂觀。left／top 每格都要重新排版。layout 版面動畫只在 React 版，這裡不示範。",
      });
      fill(250);
    },
  },
] });
</script>
