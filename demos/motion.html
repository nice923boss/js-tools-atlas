<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion 示範：彈簧物理遊樂場</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 0%, rgba(157, 140, 255, .12), transparent 70%), var(--bg); }
  .wrap { position: fixed; inset: 56px 16px 48px; display: flex; flex-direction: column; gap: 14px; max-width: 820px; margin: 0 auto; }
  h1 { position: fixed; left: 16px; top: 14px; margin: 0; font-size: 16px; font-weight: 700; }
  h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; font-size: 12px; }
  .lane { display: grid; grid-template-columns: 186px 1fr; gap: 12px; align-items: center; }
  .lab b { display: block; font-size: 14px; }
  .lab small { color: var(--muted); font: 11px/1.3 var(--mono); }
  .track { position: relative; height: 48px; border-radius: 24px; background: var(--bg-2); border: 1px solid var(--line); }
  .ball {
    position: absolute; left: 4px; top: 4px; width: 38px; height: 38px; border-radius: 50%;
    cursor: grab; touch-action: none; box-shadow: 0 6px 18px rgba(0,0,0,.4);
  }
  .ball:active { cursor: grabbing; }
  .chart { flex: 1; min-height: 120px; position: relative; padding: 10px 12px; }
  .chart canvas { width: 100%; height: 100%; display: block; }
  .legend { position: absolute; right: 14px; top: 8px; font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
  .legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  @media (max-width: 560px) {
    h1 small { display: none; }
    .lane { grid-template-columns: 1fr; gap: 4px; }
    .lab { display: flex; gap: 8px; align-items: baseline; }
    .track { height: 40px; }
    .ball { width: 30px; height: 30px; }
    .wrap { gap: 8px; }
  }
</style>
</head>
<body>
<h1>彈簧物理<small>同一段位移，三組 stiffness／damping</small></h1>
<div class="controls"><button class="btn primary" id="replay">重播</button></div>
<div class="wrap">
  <div id="lanes"></div>
  <div class="panel chart">
    <canvas id="cv"></canvas>
    <div class="legend" id="legend"></div>
  </div>
</div>
<div class="hint">把球拖到任一處放開，彈簧會帶著甩出的速度把它拉回端點</div>

<script src="https://cdn.jsdelivr.net/npm/motion@14.0.0/dist/motion.js"></script>
<script>
// Each ball is driven by a Motion value animated with a physical spring.
const { animate, spring, motionValue } = Motion;
const SPRINGS = [
  { name: "軟Q", stiffness: 120, damping: 6, color: "#f72585" },
  { name: "標準", stiffness: 300, damping: 20, color: "#4cc9f0" },
  { name: "俐落", stiffness: 700, damping: 45, color: "#f7df1e" },
];
const lanesEl = document.getElementById("lanes");
const legend = document.getElementById("legend");
const balls = SPRINGS.map((s) => {
  const lane = document.createElement("div");
  lane.className = "lane";
  lane.innerHTML = `<div class="lab"><b style="color:${s.color}">${s.name}</b><small>stiffness ${s.stiffness}・damping ${s.damping}</small></div><div class="track"><div class="ball" style="background:radial-gradient(circle at 35% 30%, #fff8, ${s.color} 55%)"></div></div>`;
  lanesEl.append(lane);
  lanesEl.style.display = "grid";
  lanesEl.style.gap = "10px";
  legend.insertAdjacentHTML("beforeend", `<span><i style="background:${s.color}"></i>${s.name}</span>`);
  const el = lane.querySelector(".ball");
  const track = lane.querySelector(".track");
  const mv = motionValue(0);
  mv.on("change", (v) => {
    const speed = Math.min(Math.abs(mv.getVelocity()) / 2500, 0.45);
    el.style.transform = `translateX(${v}px) scale(${1 + speed}, ${1 - speed * 0.6})`;
  });
  return { s, el, track, mv, side: 0 };
});

const maxX = (b) => b.track.clientWidth - b.el.offsetWidth - 8;
// Rest points sit inside the track so even the bounciest overshoot stays visible.
const restX = (b, side) => maxX(b) * (side ? 0.78 : 0.22);

function springTo(b, side, velocity = 0) {
  b.side = side;
  animate(b.mv, restX(b, side), { type: spring, stiffness: b.s.stiffness, damping: b.s.damping, velocity });
}

// Drag: the motion value tracks velocity for us, which seeds the spring on release.
let pauseUntil = 0;
for (const b of balls) {
  let startX = 0, startV = 0;
  b.el.addEventListener("pointerdown", (e) => {
    b.el.setPointerCapture(e.pointerId);
    b.mv.stop();
    startX = e.clientX; startV = b.mv.get();
    pauseUntil = performance.now() + 4000;
  });
  b.el.addEventListener("pointermove", (e) => {
    if (!b.el.hasPointerCapture(e.pointerId)) return;
    b.mv.set(Math.max(-30, Math.min(maxX(b) + 30, startV + e.clientX - startX)));
  });
  b.el.addEventListener("pointerup", () => {
    springTo(b, b.mv.get() > maxX(b) / 2 ? 1 : 0, b.mv.getVelocity());
    pauseUntil = performance.now() + 4000;
  });
}

// Chart: sample the very same spring generators Motion uses.
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const T = 2000;
let playStart = performance.now();

function drawChart(now) {
  const dpr = devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  const pad = { l: 34, r: 8, t: 24, b: 20 };
  const X = (t) => pad.l + (t / T) * (w - pad.l - pad.r);
  const Y = (v) => pad.t + (1 - (v + 0.05) / 1.55) * (h - pad.t - pad.b);
  ctx.font = "11px sans-serif";
  ctx.fillStyle = "#9b998f";
  ctx.strokeStyle = "rgba(255,255,255,.12)";
  ctx.setLineDash([4, 4]);
  for (const v of [0, 1]) {
    ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(w - pad.r, Y(v)); ctx.stroke();
    ctx.fillText(v ? "目標" : "起點", 2, Y(v) + 4);
  }
  ctx.setLineDash([]);
  for (const s of [0, 1, 2]) ctx.fillText(`${s} 秒`, Math.min(X(s * 1000), w - 30), h - 4);
  const elapsed = Math.min(now - playStart, T);
  for (const s of SPRINGS) {
    const g = s.gen || (s.gen = spring({ keyframes: [0, 1], stiffness: s.stiffness, damping: s.damping }));
    ctx.strokeStyle = s.color; ctx.lineWidth = 2.2; ctx.beginPath();
    for (let t = 0; t <= T; t += 8) {
      const y = Y(g.next(t).value);
      t ? ctx.lineTo(X(t), y) : ctx.moveTo(X(t), y);
    }
    ctx.stroke();
    const p = g.next(elapsed).value;
    ctx.fillStyle = s.color; ctx.beginPath(); ctx.arc(X(elapsed), Y(p), 4.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = "rgba(247,223,30,.5)"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(X(elapsed), pad.t - 6); ctx.lineTo(X(elapsed), h - pad.b); ctx.stroke();
}

function replay() {
  playStart = performance.now();
  for (const b of balls) springTo(b, b.side ? 0 : 1);
}
document.getElementById("replay").addEventListener("click", () => { pauseUntil = 0; replay(); });

// Auto loop: swing every 2.4 s unless the user is dragging.
setInterval(() => { if (performance.now() > pauseUntil) replay(); }, 2400);
(function loop(now) { drawChart(now); requestAnimationFrame(loop); })(performance.now());
addEventListener("resize", () => balls.forEach((b) => b.mv.set(restX(b, b.side))));
balls.forEach((b) => b.mv.set(restX(b, 0)));
setTimeout(replay, 300);
</script>
</body>
</html>
