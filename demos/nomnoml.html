// ---------- helpers ----------
function fit(box, max = 1.6) {
  const el = box.firstElementChild;
  if (!el || !box.clientWidth) return;
  const w = +el.getAttribute("width") || el.width, ht = +el.getAttribute("height") || el.height;
  const nw = +el.dataset.w || w, nh = +el.dataset.h || ht;
  const s = Math.min((box.clientWidth - 16) / nw, (box.clientHeight - 16) / nh, max);
  el.style.width = `${Math.max(1, nw * s)}px`;
  el.style.height = `${Math.max(1, nh * s)}px`;
}

// Diagram viewport inside host: set(svg) swaps content and refits whenever the box resizes
// (controls can wrap after mount, so stage resize events alone are not enough).
function viewer(ctx, host, max = 1.6) {
  const box = h("div", { class: "nn-svg" });
  const meta = h("div", { class: "nn-meta" });
  host.append(box, meta);
  const ro = new ResizeObserver(() => { api.fit(); api.onSize?.(); });
  ro.observe(box);
  ctx.onCleanup(() => ro.disconnect());
  const api = {
    box, onSize: null,
    set(content) {
      if (typeof content === "string") box.innerHTML = content;
      else box.replaceChildren(content);
      box.classList.remove("nn-stale");
      api.fit();
      return box.firstElementChild;
    },
    fit: () => fit(box, max),
    stale: (on) => box.classList.toggle("nn-stale", on),
    info: (t) => { meta.textContent = t; },
  };
  return api;
}

function timed(fn) {
  const t0 = performance.now();
  const out = fn();
  return [out, performance.now() - t0];
}

function countAst(part) {
  let nodes = 0, assocs = part.assocs.length;
  for (const n of part.nodes) {
    nodes += 1;
    for (const p of n.parts) {
      if (!p.nodes) continue;
      const c = countAst(p);
      nodes += c.nodes; assocs += c.assocs;
    }
  }
  return { nodes, assocs };
}

function errText(e) {
  if (e instanceof nomnoml.ParseError) {
    const got = e.actual === "end of file" ? "檔案結尾" : e.actual;
    return `第 ${e.line} 行第 ${e.column} 欄：預期 ${e.expected}，實際是 ${got}`;
  }
  return `無法繪製：${e.message}`;
}

// ---------- 8. generated class diagram ----------
function bigDiagram(n, ranker, cross) {
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const types = ["->", "-->", "<:-", "+-", "o-"];
  const lines = [];
  let edges = 0;
  for (let i = 0; i < n; i++) {
    lines.push(`[類別${i}|名稱: 字串;數量: 整數|執行()]`);
    if (i > 0) { lines.push(`[類別${Math.floor(rnd() * i)}] ${types[i % 5]} [類別${i}]`); edges++; }
    if (cross && i > 3 && rnd() < 0.25) { lines.push(`[類別${i}] -> [類別${Math.floor(rnd() * i)}]`); edges++; }
  }
  lines.push(`#font: ${FONT}`, "#fontSize: 11", "#spacing: 30", "#lineWidth: 1.2", "#stroke: #3b3a35", "#fill: #fff3b0", `#ranker: ${ranker}`);
  return { src: lines.join("\n"), edges };
}

    hint: "方括號是方塊，箭頭是關係・改字即重畫",
    mount(ctx) {
      ctx.html(`<div class="nn-wrap">
        <div class="nn-ed"><div class="nn-ed-head"><span>原始碼</span><span class="mono nn-stat"></span></div>
          <textarea class="nn-code" spellcheck="false" aria-label="nomnoml 原始碼"></textarea>
          <div class="nn-err" hidden></div></div>
        <div class="nn-view"></div></div>`);
      const code = ctx.$(".nn-code"), errBox = ctx.$(".nn-err"), stat = ctx.$(".nn-stat");
      const view = viewer(ctx, ctx.$(".nn-view"));
      let lastErr = null, timer = 0;
      const draw = () => {
        try {
          const [svg, ms] = timed(() => nomnoml.renderSvg(code.value, document));
          view.set(svg);
          const c = countAst(nomnoml.parse(code.value).root);
          stat.textContent = `${c.nodes} 節點・${c.assocs} 關係・${fmtMs(ms)}`;
          errBox.hidden = true; lastErr = null;
        } catch (e) {
          lastErr = e;
          view.stale(true);
          errBox.hidden = false;
          errBox.innerHTML = "";
          errBox.append(errText(e), " ", h("u", { text: "跳到該處" }));
        }
      };
      errBox.addEventListener("click", () => {
        if (!(lastErr instanceof nomnoml.ParseError)) return;
        const rows = code.value.split("\n");
        let i = 0;
        for (let r = 0; r < lastErr.line - 1 && r < rows.length; r++) i += rows[r].length + 1;
        i = Math.min(code.value.length, i + Math.max(0, lastErr.column - 1));
        code.focus();
        code.setSelectionRange(Math.max(0, i - 1), i);
      });
      code.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(draw, 200); });
      ctx.onCleanup(() => clearTimeout(timer));
      const load = (i) => { code.value = SAMPLES[i]; draw(); };
      ctx.group(["類別圖", "狀態圖"], 0, (i) => load(i));
      ctx.button("製造語法錯誤", () => {
        const rows = code.value.split("\n");
        rows[1] = rows[1].replace(/\]\s*$/, "");
        code.value = rows.join("\n");
        draw();
      });
      load(0);
    },
  },
  {
    id: "arrows", title: "關係箭頭", paper: true,
    api: "[甲] 1 -> 0..* [乙]・#fillArrows・#arrowSize・#lineWidth",
    desc: "nomnoml 的 18 種關係寫法一次排開，每格都是 renderSvg 即時畫出的小圖：關聯、依賴、繼承、實作、組合、聚合、球與插座、註解線與只影響排版的隱形線。箭頭兩側的文字會變成端點標籤（例如多重性 1 與 0..*）。",
    hint: "切換端點標籤、實心箭頭，拖曳箭頭大小與線寬",
    mount(ctx) {
      ctx.html(`<div class="nn-wrap"><div class="nn-grid"></div></div>`);
      const grid = ctx.$(".nn-grid");
      const cells = ASSOCS.map(([code, name]) => {
        const mini = h("div", { class: "nn-mini" });
        grid.append(h("div", { class: "nn-cell" }, mini, h("div", { class: "nn-cap" }, h("code", { text: code }), h("span", { text: name }))));
        return { code, view: viewer(ctx, mini, 1.5) };
      });
      const opt = { labels: true, fill: false, size: 1, lw: 1.6 };
      const draw = () => {
        for (const c of cells) {
          const left = c.code === "--" ? "[<note>註解]" : "[甲]";
          const rel = opt.labels ? `1 ${c.code} 0..*` : c.code;
          const src = `${left} ${rel} [乙]${BASE}\n#direction: right\n#spacing: 56\n#fillArrows: ${opt.fill}\n#arrowSize: ${opt.size}\n#lineWidth: ${opt.lw}`;
          c.view.set(nomnoml.renderSvg(src, document));
        }
      };
      ctx.toggle("端點標籤", true, (v) => { opt.labels = v; draw(); });
      ctx.toggle("實心箭頭", false, (v) => { opt.fill = v; draw(); });
      ctx.slider("箭頭大小", { min: 0.5, max: 2.5, step: 0.1, value: 1, format: (v) => `${v.toFixed(1)}×` }, (v) => { opt.size = v; draw(); });
      ctx.slider("線寬", { min: 0.5, max: 4, step: 0.5, value: 1.6, format: (v) => `${v}` }, (v) => { opt.lw = v; draw(); });
      draw();
    },
  },
  {
    id: "kinds", title: "分類器圖鑑", paper: true,
    api: "[<database> 名稱]・[<table> 名稱|a|1||b|2]・g[data-name]",
    desc: "24 種分類器（方塊外形）排成一張圖。排列靠的是 -/- 隱形連線：每一欄用隱形線串起來，nomnoml 就會照欄排好。renderSvg 會在每個節點的 g 元素加上 data-name，點任一方塊即可讀回名稱，顯示它的寫法與用途。另有 <hidden> 型別完全不畫，只佔位置。",
    hint: "點任一方塊看語法與用途",
    mount(ctx) {
      ctx.html(`<div class="nn-wrap"><div class="nn-view nn-click"></div>
        <div class="nn-side"><h3 class="nn-k-title"></h3><div class="nn-pre nn-k-code"></div><p class="nn-k-desc"></p>
        <p class="nn-more">同一個名稱只會畫一次；要畫兩個同名節點，用 id 屬性區分，例如 [&lt;actor id=a&gt;使用者]。</p></div></div>`);
      const view = viewer(ctx, ctx.$(".nn-view"), 1.8);
      let cols = 0, picked = "k0";
      const pick = (id) => {
        picked = id;
        view.box.querySelectorAll(".nn-on").forEach((g) => g.classList.remove("nn-on"));
        view.box.querySelector(`g[data-name="${id}"]`)?.classList.add("nn-on");
        const [type, name, body, desc] = KINDS[+id.slice(1)];
        ctx.$(".nn-k-title").replaceChildren(`${name} `, h("span", { class: "nn-tag", text: type }));
        ctx.$(".nn-k-code").textContent = `[<${type}> ${name}${body}]`;
        ctx.$(".nn-k-desc").textContent = desc;
      };
      const draw = () => {
        const w = view.box.clientWidth, ht = view.box.clientHeight;
        const want = Math.max(3, Math.min(8, Math.round(Math.sqrt(KINDS.length * (w / Math.max(ht, 1)) * 0.75))));
        if (want === cols) return view.fit();
        cols = want;
        const lines = [];
        KINDS.forEach(([type, name, body], i) => {
          lines.push(`[<${type} id=k${i}>${name}${body}]`);
          if (i >= cols) lines.push(`[k${i - cols}] -/- [k${i}]`);
        });
        const [svg, ms] = timed(() => nomnoml.renderSvg(lines.join("\n") + BASE + "\n#spacing: 40\n#fill: #fff3b0", document));
        view.set(svg);
        view.info(`${cols} 欄・${fmtMs(ms)}`);
        pick(picked);
      };
      view.box.addEventListener("click", (e) => {
        const g = e.target.closest("g[data-name]");
        if (g) pick(g.getAttribute("data-name"));
      });
      view.onSize = draw;
      draw();
    },
  },
  {
    id: "nested", title: "巢狀與套件", paper: true,
    api: "[<frame> 名稱|子圖]・[<package> 名稱|子圖]・#fill: 第一層;第二層;第三層・#.pkg: visual=package direction=down",
    desc: "方塊的內容格可以再放一整張圖，形成外框包套件、套件包類別的架構圖。#fill 依巢狀層級輪流上色；自訂樣式加 direction 可讓某類方塊內部的排列方向跟外層不同。關係只能連同一層的節點，所以跨套件的依賴畫在套件之間。點任一套件可收合或展開，收合就是把子圖從原始碼拿掉再重畫。",
    hint: "點套件收合或展開・分別切換外層與套件內的方向",
    mount(ctx) {
      ctx.html(`<div class="nn-wrap"><div class="nn-view nn-click"></div></div>`);
      const view = viewer(ctx, ctx.$(".nn-view"), 1.5);
      const open = new Set(PKGS.map((p) => p[0]));
      const opt = { outer: "right", inner: "down" };
      const source = () => {
        const body = PKGS.map(([name, sub]) => open.has(name)
          ? `[<pkg>${name}|\n${sub.replace(/^/gm, "    ")}\n  ]`
          : `[<pkg>${name}|（已收合）]`).map((s) => `  ${s}`).join("\n");
        return `[<frame>線上課程平台|
${body}
  [前台網站] -> [學習服務]
  [前台網站] -> [金流服務]
  [學習服務] --> [資料層]
  [金流服務] --> [資料層]
]${BASE}
#fontSize: 11
#spacing: 30
#direction: ${opt.outer}
#fill: #fdf6e3; #fff3b0; #e6f6fc; #f1ecff
#.pkg: visual=package direction=${opt.inner}`;
      };
      const draw = () => {
        const src = source();
        const [svg, ms] = timed(() => nomnoml.renderSvg(src, document));
        view.set(svg);
        view.info(`展開 ${open.size}/${PKGS.length} 個套件・${fmtMs(ms)}`);
      };
      view.box.addEventListener("click", (e) => {
        let g = e.target.closest("g[data-name]");
        while (g && !PKGS.some((p) => p[0] === g.getAttribute("data-name"))) g = g.parentElement.closest("g[data-name]");
        if (!g) return;
        const name = g.getAttribute("data-name");
        if (open.has(name)) open.delete(name); else open.add(name);
        draw();
      });
      ctx.group(["外層橫排", "外層直排"], 0, (i) => { opt.outer = i ? "down" : "right"; draw(); });
      ctx.group(["套件內直排", "套件內橫排"], 0, (i) => { opt.inner = i ? "right" : "down"; draw(); });
      ctx.button("全部收合", () => { open.clear(); draw(); });
      ctx.button("全部展開", () => { PKGS.forEach((p) => open.add(p[0])); draw(); });
      draw();
    },
  },
  {
    id: "layout", title: "版面指令", paper: true,
    api: "#direction・#ranker・#acyclicer・#spacing・#edges・#bendSize",
    desc: "同一張有迴圈的課程流程圖，只改開頭的指令就換一種排版。#ranker 決定節點分層的演算法（network-simplex、tight-tree、longest-path），#acyclicer: greedy 改用貪婪法決定迴圈中哪條邊反轉，#spacing 調整層距，#edges 與 #bendSize 控制轉角。右側即時列出套用中的指令。",
    hint: "換方向、分層演算法，拖曳間距看排版變化",
    mount(ctx) {
      ctx.html(`<div class="nn-wrap"><div class="nn-view"></div>
        <div class="nn-side nn-opt"><h3>套用中的指令</h3><div class="nn-pre nn-dirs"></div>
        <p>指令寫在原始碼任何一行，以 # 開頭；同一個指令寫兩次時以後面的為準。</p></div></div>`);
      const view = viewer(ctx, ctx.$(".nn-view"), 1.6);
      const opt = { direction: "down", ranker: "network-simplex", greedy: false, spacing: 40, rounded: true, bend: 0.3 };
      let prev = {};
      const draw = () => {
        const dirs = [
          ["direction", opt.direction], ["ranker", opt.ranker], ["spacing", opt.spacing],
          ["edges", opt.rounded ? "rounded" : "hard"], ["bendSize", opt.bend],
          ...(opt.greedy ? [["acyclicer", "greedy"]] : []),
        ];
        const src = `${FLOW}${BASE}\n#fontSize: 11\n#fill: #fff3b0;#fdf6e3\n${dirs.map(([k, v]) => `#${k}: ${v}`).join("\n")}`;
        const [svg, ms] = timed(() => nomnoml.renderSvg(src, document));
        const el = view.set(svg);
        view.info(`${el.getAttribute("width")}×${el.getAttribute("height")}・${fmtMs(ms)}`);
        const box = ctx.$(".nn-dirs");
        box.replaceChildren(...dirs.flatMap(([k, v], i) => {
          const line = `#${k}: ${v}`;
          return [i ? "\n" : "", prev[k] !== undefined && prev[k] !== v ? h("b", { text: line }) : line];
        }));
        prev = Object.fromEntries(dirs);
      };
      ctx.group(["由上而下", "由左而右"], 0, (i) => { opt.direction = i ? "right" : "down"; draw(); });
      ctx.select("分層", ["network-simplex", "tight-tree", "longest-path"], opt.ranker, (v) => { opt.ranker = v; draw(); });
      ctx.slider("間距", { min: 12, max: 90, step: 2, value: 40, format: (v) => `${v}` }, (v) => { opt.spacing = v; draw(); });
      ctx.slider("轉角", { min: 0, max: 1, step: 0.05, value: 0.3, format: (v) => v.toFixed(2) }, (v) => { opt.bend = v; draw(); });
      ctx.toggle("圓角連線", true, (v) => { opt.rounded = v; draw(); });
      ctx.toggle("貪婪去環", false, (v) => { opt.greedy = v; draw(); });
      draw();
    },
  },
  {
    id: "styles", title: "自訂樣式", paper: true,
    api: "#.名稱: visual=rhomb fill=… dashed title=bold・#background・#stroke・#fill・#font",
    desc: "以 # 加點開頭的指令定義自己的分類器：visual 指定外形（圓角框、菱形、平行四邊形、管線、資料庫、便條紙），再加 fill、stroke、dashed，以及 title、body 的粗體、斜體、置中。下方切換四套主題，只改 #background、#stroke、#fill、#font、#lineWidth；關掉自訂樣式時，未定義的型別會退回一般類別方塊。",
    hint: "切換主題，或關掉自訂樣式比較差異",
    mount(ctx) {
      ctx.html(`<div class="nn-wrap"><div class="nn-view"></div>
        <div class="nn-side nn-opt"><h3>樣式指令</h3><div class="nn-pre nn-st"></div></div></div>`);
      const host = ctx.$(".nn-view");
      const view = viewer(ctx, host, 1.5);
      const opt = { theme: 0, custom: true };
      // wide stage: left to right; portrait stage: top to bottom
      const orient = () => (view.box.clientWidth >= view.box.clientHeight * 1.1 ? "right" : "down");
      let dir = orient();
      view.onSize = () => { if (orient() !== dir) draw(); };
      const draw = () => {
        dir = orient();
        const t = THEMES[opt.theme];
        const styles = opt.custom ? CUSTOM.map(([name, rule, fill]) => `#.${name}: ${rule}${t.colored ? ` fill=${fill}` : ""}`) : [];
        const globals = [`#background: ${t.bg}`, `#stroke: ${t.stroke}`, `#fill: ${t.fill}`, `#font: ${t.font}`, `#lineWidth: ${t.lw}`];
        const src = `${REFUND}\n#fontSize: 12\n#padding: 8\n#spacing: 34\n#direction: ${dir}\n#edges: rounded\n${globals.join("\n")}\n${styles.join("\n")}`;
        const [svg, ms] = timed(() => nomnoml.renderSvg(src, document));
        host.style.background = t.bg;
        view.set(svg);
        view.info(`${t.name}・${fmtMs(ms)}`);
        ctx.$(".nn-st").textContent = [...globals, ...styles].join("\n");
      };
      ctx.group(THEMES.map((t) => t.name), 0, (i) => { opt.theme = i; draw(); });
      ctx.toggle("自訂樣式", true, (v) => { opt.custom = v; draw(); });
      draw();
    },
  },
  {
    id: "interact", title: "互動與匯出", paper: true,
    api: "nomnoml.draw(canvas, source, scale) → { config, layout }・renderSvg・canvas.toBlob",
    desc: "同一張圖書館類別圖可用 SVG 或 Canvas 輸出。SVG 版靠 data-name 判斷點到哪個節點；Canvas 版用 draw() 回傳的 layout 座標自己做點擊判定，再疊畫外框。被點的節點與相連節點會標色，右側列出它的每一條關係。可下載 SVG 或 2 倍解析度 PNG。",
    hint: "點任一類別看關係・切換 SVG／Canvas・下載圖檔",
    mount(ctx) {
      ctx.html(`<div class="nn-wrap"><div class="nn-view nn-click"></div>
        <div class="nn-side"><h3 class="nn-r-title"></h3><div class="nn-pre nn-r-list"></div>
        <p class="nn-more nn-r-note"></p></div></div>`);
      const view = viewer(ctx, ctx.$(".nn-view"), 1.6);
      const assocs = nomnoml.parse(LIBRARY).root.assocs;
      const opt = { canvas: false, scale: 2 };
      let picked = "館藏", lay = null, canvas = null;
      const near = (id) => new Set(assocs.flatMap((a) => (a.start === id ? [a.end] : a.end === id ? [a.start] : [])));
      const mark = () => {
        const nb = near(picked);
        if (!opt.canvas) {
          view.box.querySelectorAll(".nn-on, .nn-near").forEach((g) => g.classList.remove("nn-on", "nn-near"));
          view.box.querySelector(`g[data-name="${picked}"]`)?.classList.add("nn-on");
          nb.forEach((id) => view.box.querySelector(`g[data-name="${id}"]`)?.classList.add("nn-near"));
        } else {
          const r = nomnoml.draw(canvas, LIBRARY, opt.scale);
          lay = r;
          const g = canvas.getContext("2d"), z = r.config.zoom, gut = r.config.gutter;
          g.save();
          g.scale(z, z);
          g.translate(r.layout.offset.x + gut, r.layout.offset.y + gut);
          for (const n of r.layout.nodes) {
            if (n.id !== picked && !nb.has(n.id)) continue;
            g.strokeStyle = n.id === picked ? "#d61f69" : "#e06a1b";
            g.lineWidth = n.id === picked ? 3 : 2;
            g.strokeRect(n.x - n.width / 2 - 4, n.y - n.height / 2 - 4, n.width + 8, n.height + 8);
          }
          g.restore();
        }
        ctx.$(".nn-r-title").textContent = `${picked} 的關係`;
        ctx.$(".nn-r-list").textContent = assocs.filter((a) => a.start === picked || a.end === picked)
          .map((a) => `[${a.start}] ${a.type} [${a.end}]  ${ASSOC_NAME[a.type] || ""}`).join("\n");
      };
      const draw = () => {
        if (opt.canvas) {
          canvas = h("canvas");
          const [r, ms] = timed(() => nomnoml.draw(canvas, LIBRARY, opt.scale));
          canvas.dataset.w = r.layout.width; canvas.dataset.h = r.layout.height;
          view.set(canvas);
          view.info(`Canvas ${canvas.width}×${canvas.height} px・${fmtMs(ms)}`);
          ctx.$(".nn-r-note").textContent = `Canvas 依倍率 ${opt.scale} 產生實際像素，再縮放到畫面大小；倍率越高越清晰，也越耗記憶體。`;
        } else {
          const [svg, ms] = timed(() => nomnoml.renderSvg(LIBRARY, document));
          view.set(svg);
          view.info(`SVG ${(svg.length / 1024).toFixed(1)} KB・${fmtMs(ms)}`);
          ctx.$(".nn-r-note").textContent = "SVG 每個節點的 g 元素都有 data-name，可直接用 CSS 標色或掛事件。";
        }
        mark();
      };
      view.box.addEventListener("click", (e) => {
        let id = null;
        if (!opt.canvas) {
          id = e.target.closest("g[data-name]")?.getAttribute("data-name");
        } else if (lay && e.target === canvas) {
          const rect = canvas.getBoundingClientRect(), z = lay.config.zoom, gut = lay.config.gutter;
          const x = ((e.clientX - rect.left) * canvas.width / rect.width) / z - lay.layout.offset.x - gut;
          const y = ((e.clientY - rect.top) * canvas.height / rect.height) / z - lay.layout.offset.y - gut;
          id = lay.layout.nodes.find((n) => Math.abs(x - n.x) <= n.width / 2 && Math.abs(y - n.y) <= n.height / 2)?.id;
        }
        if (id) { picked = id; mark(); }
      });
      ctx.group(["SVG", "Canvas"], 0, (i) => { opt.canvas = i === 1; draw(); });
      ctx.slider("Canvas 倍率", { min: 1, max: 3, step: 0.5, value: 2, format: (v) => `${v}×` }, (v) => { opt.scale = v; if (opt.canvas) draw(); });
      ctx.button("下載 SVG", () => download("圖書館類別圖.svg", new Blob([nomnoml.renderSvg(LIBRARY, document)], { type: "image/svg+xml" })));
      ctx.button("下載 PNG", () => {
        const c = h("canvas");
        nomnoml.draw(c, LIBRARY, 2);
        c.toBlob((b) => download("圖書館類別圖.png", b), "image/png");
      });
      draw();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "nomnoml.renderSvg(source, document)・#ranker・graphre 分層排版",
    desc: "每一級產生 N 個類別（各有兩個屬性與一個方法）和約 N 條關係，計時從解析文字、graphre 分層排版、產生 SVG 字串，到放進頁面並完成版面計算為止。可切換分層演算法，以及是否加入反向的交叉關係（會形成迴圈，排版更費工）。",
    hint: "選分層演算法，按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="nn-stress"><div class="nn-view"></div></div>`);
      const view = viewer(ctx, ctx.$(".nn-view"), 1.4);
      const opt = { ranker: "network-simplex", cross: true };
      const preview = () => {
        const { src } = bigDiagram(30, opt.ranker, opt.cross);
        view.set(nomnoml.renderSvg(src, document));
        view.info("30 個類別預覽");
      };
      ctx.controls.classList.add("bottom");
      ctx.group(["network-simplex", "tight-tree", "longest-path"], 0, (i, label) => { opt.ranker = label; preview(); });
      ctx.toggle("交叉關係", true, (v) => { opt.cross = v; preview(); });
      preview();
      ctx.bench({
        label: "類別數", unit: "個",
        sizes: [30, 100, 300, 600, 1000, 2000],
        budget: 2000, target: 1000,
        prepare: (n) => bigDiagram(n, opt.ranker, opt.cross),
        async run(n, data) {
          const svg = nomnoml.renderSvg(data.src, document);
          view.set(svg);
          view.box.getBoundingClientRect();
          await ctx.frame(1);
          view.info(`${fmt(n)} 個類別`);
          return `${fmt(data.edges)} 條關係・SVG ${fmt(Math.round(svg.length / 1024))} KB`;
        },
        note: "計時包含解析、排版、產生 SVG 字串、插入 DOM 與下一個畫格。大部分時間花在 graphre 的分層與交叉最小化；network-simplex 品質最好但最慢，longest-path 只做最簡單的分層。SVG 字串大小包含 nomnoml 預設寫進 <desc> 的原始碼。",
      });
    },
  },
] });
</script>
</body>
</html>
