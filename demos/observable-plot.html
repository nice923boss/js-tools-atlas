<style>
  .op-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px;
    grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); --plot-background: #171a1f; }
  .op-card { position: relative; min-height: 0; min-width: 0; padding: 8px 10px 6px; display: flex; flex-direction: column; overflow: hidden; }
  .op-card h2 { margin: 0 0 4px; font-size: 12.5px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
  .op-card h2 .op-ttl { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op-card h2 small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .op-card h2 .op-read { margin-left: auto; max-width: 100%; font-size: 11.5px; font-weight: 400; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .op-read b { color: var(--accent); font-weight: 600; }
  .op-num, .op-read code { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .op-box { position: relative; flex: 1; min-height: 0; }
  .op-box > .op-fill { position: absolute; inset: 0; overflow: hidden; }

  /* Plot output on the dark stage (Plot's own defaults are zero-specificity :where() rules) */
  .op-fill svg { background: transparent; }
  .op-fill figure { margin: 0; color: var(--muted); }
  .op-fill figure > div { font-family: var(--font); font-size: 11.5px; color: var(--fg); }
  .op-fill g[aria-label="tip"] { color: var(--fg); }

  /* 2. marks list */
  .op-lay { grid-template-columns: minmax(0, 1fr) minmax(0, 228px); }
  .op-list { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 1px; }
  .op-list label { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 8px; align-items: center; padding: 3px 5px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .op-list label:hover { background: rgba(255, 255, 255, 0.05); }
  .op-list input { grid-row: span 2; margin: 0; accent-color: var(--accent); }

  /* 3. chart + code */

  pre .k { color: var(--c2); } pre .s { color: var(--c4); } pre .n { color: var(--c5); }
  .sc-field:has(input:disabled) { opacity: 0.4; }
  @media (max-width: 760px) { .op-tx { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 112px); } }
  @media (max-width: 760px) and (max-height: 480px) { .op-tx { grid-template-rows: minmax(0, 1fr) minmax(0, 76px); } }

  /* 6. pointer + linked view */
  .op-ptr { grid-template-columns: minmax(0, 1fr) minmax(0, 220px); }
  .op-val { margin: 6px 0 0; padding: 6px 8px; border-radius: 8px; background: rgba(0, 0, 0, 0.28); font: 11px/1.45 var(--mono); color: #cfd8dc; white-space: pre; overflow: hidden; }
  @media (max-width: 560px) {
    .op-ptr { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.5fr) minmax(0, 1fr); }
    .op-val { display: none; }
  }

  /* 8. stress */

  .op-tag { position: absolute; z-index: 5; pointer-events: none; left: 14px; top: 10px; padding: 4px 9px; border-radius: 7px; font-size: 11.5px; color: var(--muted);
    background: rgba(14, 16, 19, 0.82); border: 1px solid var(--line); }
  .op-tag b { color: var(--accent); font-weight: 600; font-family: var(--mono); }
  .op-cmp { position: absolute; z-index: 5; right: 14px; top: 10px; pointer-events: none; padding: 6px 10px; border-radius: 8px; font-size: 11.5px;
    background: rgba(14, 16, 19, 0.86); border: 1px solid var(--line); }
  .op-cmp table { border-collapse: collapse; }
  .op-cmp th { color: var(--muted); font-weight: 500; text-align: right; padding: 1px 0 3px 12px; }
  .op-cmp th:first-child { text-align: left; padding-left: 0; }
  .op-cmp td { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; padding: 1px 0 1px 12px; }
  .op-cmp td:first-child { text-align: left; padding-left: 0; color: var(--muted); }
  .op-cmp .op-win { color: var(--c4); }
  .op-cmp p { margin: 0; color: var(--muted); }
  @media (max-width: 760px) { .op-stress { left: 8px; opacity: 0.9; } .op-cmp { display: none; } }

<body>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.17/dist/plot.umd.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Observable Plot showcase: facets, layered marks, bin/group/stack transforms, scales and color schemes,
// hexbin and density, pointer interaction with linked views, map projections and a render benchmark.
const { fmt, fmtCompact, fmtMs } = Showcase;
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim();
const FG = "#ecebe6", MUTED = "#9b998f";
const STYLE = { background: "transparent", color: MUTED, fontFamily: FONT, fontSize: "11px", overflow: "visible" };
const TIP = { fill: "#171a1f", stroke: "rgba(247,223,30,0.6)" };
const base = (W, H) => ({ width: W, height: H, style: STYLE });

const pad2 = (n) => String(n).padStart(2, "0");
const monthLabel = (d) => `${d.getUTCMonth() + 1}月`;
const ymd = (d) => `${d.getUTCFullYear()}/${pad2(d.getUTCMonth() + 1)}/${pad2(d.getUTCDate())}`;
const md = (d) => `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
const monthTicks = (W) => (W < 480 ? d3.utcMonth.every(3) : W < 760 ? d3.utcMonth.every(2) : d3.utcMonth);

// Re-run fn() when el changes size (debounced).
function watch(ctx, el, fn) {
  let t = 0, lw = el.clientWidth, lh = el.clientHeight;
  const ro = new ResizeObserver(() => {
    const w = el.clientWidth, h = el.clientHeight;
    if (w === lw && h === lh) return;
    lw = w; lh = h;
    clearTimeout(t);
    t = setTimeout(() => ctx.active && fn(), 120);
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); clearTimeout(t); });
}

// A redrawable Plot in el. make(w, h) returns Plot.plot(...) for the available size. Legends make the
// returned <figure> taller than the requested height, so the excess is measured and remembered for later draws.
function plotIn(ctx, el, make) {
  let node = null, extra = 0;
  const api = {
    get node() { return node; },
    onDraw: null,
    draw() {
      const W = el.clientWidth, H = el.clientHeight;
      if (!ctx.active || W < 40 || H < 40) return;
      let p = make(W, Math.max(40, H - extra));
      el.replaceChildren(p);
      const over = Math.ceil(p.getBoundingClientRect().height) - H;
      if (over > 0 || (extra > 0 && over < -2)) {
        extra = Math.max(0, extra + over);
        p = make(W, Math.max(40, H - extra));
        el.replaceChildren(p);
      }
      node = p;
      if (api.onDraw) api.onDraw(p);
    },
  };
  watch(ctx, el, () => api.draw());
  return api;
}

const card = (cls, title = "", read = "…", body = `<div class="op-box"><div class="op-fill"></div></div>`) =>
  `<div class="panel op-card ${cls}"><h2><span class="op-ttl">${title}</span><span class="op-read">${read}</span></h2>${body}</div>`;
const small = (t) => `<small>${t}</small>`;

// Lightweight highlighting for the JS snippets shown next to charts.
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const hiJS = (s) => esc(s)
  .replace(/("[^"]*")/g, '<span class="s">$1</span>')
  .replace(/\b(Plot\.\w+)/g, '<span class="k">$1</span>')
  .replace(/([^\w#"])(\d+(?:\.\d+)?)\b/g, '$1<span class="n">$2</span>');

// ---------- illustrative data (seeded, generated in the page) ----------
function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }
const gauss = (r) => Math.sqrt(-2 * Math.log(r() || 1e-9)) * Math.cos(2 * Math.PI * r());

// Approximate monthly climate normals (illustrative).
const CITIES = {
  基隆: { rain: [330, 390, 300, 210, 280, 300, 140, 210, 370, 390, 390, 330], temp: [15.9, 16.0, 17.6, 20.8, 24.2, 27.1, 29.2, 29.0, 27.3, 24.5, 21.6, 17.9] },
  臺北: { rain: [95, 170, 180, 180, 250, 320, 240, 320, 360, 150, 90, 75], temp: [16.1, 16.5, 18.5, 21.9, 25.2, 27.7, 29.6, 29.2, 27.4, 24.5, 21.5, 17.9] },
  宜蘭: { rain: [160, 180, 150, 140, 220, 200, 140, 250, 450, 480, 350, 230], temp: [16.4, 16.9, 18.6, 21.6, 24.6, 27.2, 29.0, 28.6, 26.8, 23.9, 21.1, 17.9] },
  臺中: { rain: [35, 90, 95, 135, 230, 380, 290, 300, 140, 20, 20, 25], temp: [16.6, 17.3, 19.8, 23.3, 26.3, 27.9, 28.8, 28.5, 27.8, 25.6, 22.3, 18.3] },
  花蓮: { rain: [70, 100, 90, 100, 220, 210, 170, 250, 370, 340, 160, 70], temp: [18.2, 18.6, 20.3, 22.8, 25.3, 27.4, 28.8, 28.5, 27.2, 25.1, 22.6, 19.6] },
  臺南: { rain: [20, 25, 40, 75, 180, 400, 370, 440, 180, 30, 15, 15], temp: [17.9, 18.9, 21.6, 24.9, 27.6, 28.8, 29.4, 28.9, 28.4, 26.4, 23.2, 19.4] },
  臺東: { rain: [40, 45, 50, 70, 170, 240, 250, 300, 330, 170, 70, 40], temp: [19.4, 19.9, 21.6, 24.0, 26.2, 27.8, 28.9, 28.6, 27.6, 25.8, 23.4, 20.6] },
  高雄: { rain: [20, 25, 40, 75, 190, 420, 390, 430, 190, 45, 15, 15], temp: [19.3, 20.3, 22.6, 25.4, 27.6, 28.8, 29.4, 28.9, 28.5, 27.0, 24.4, 20.9] },
};
const NAMES = Object.keys(CITIES);
const SEASONS = ["東北季風", "梅雨", "颱風", "其他"];
const seasonOf = (k) => (k >= 4 && k <= 5 ? "梅雨" : k >= 6 && k <= 8 ? "颱風" : k >= 9 || k <= 1 ? "東北季風" : "其他");
const cityTotal = (c, m) => (m === "rain" ? d3.sum(CITIES[c].rain) : d3.mean(CITIES[c].temp));

// Daily Taipei-like temperatures for 2024, each day paired with the same day of 2023.
const DAILY = (() => {
  const year = (seed, y, shift) => {
    const r = rng(seed), rows = [];
    let e = 0;
    for (let d = new Date(Date.UTC(y, 0, 1)), i = 0; d.getUTCFullYear() === y; d.setUTCDate(d.getUTCDate() + 1), i++) {
      e = e * 0.72 + gauss(r) * 1.2;
      const tmax = +(26.5 + shift - 7.4 * Math.cos((2 * Math.PI * (i - 22)) / 365) + e).toFixed(1);
      const tmin = +(tmax - 5.4 - 1.6 * r() + 0.9 * Math.cos((2 * Math.PI * (i - 22)) / 365)).toFixed(1);
      rows.push({ date: new Date(d), tmax, tmin });
    }
    return rows;
  };
  const prev = year(20230101, 2023, -0.5);
  return year(20240101, 2024, 0).map((d, i) => ({ ...d, last: prev[Math.min(i, prev.length - 1)].tmax }));
})();

// 2,400 commute records: mode, minutes (log-normal per mode) and departure hour (morning and evening peaks).
const MODES_T = ["捷運", "公車", "機車", "汽車", "自行車"];
const MODE_COLOR = { domain: MODES_T, range: [C[1], C[0], C[2], C[3], C[5]], label: "交通方式" };
const COMMUTE = (() => {
  const r = rng(777), W = [0.3, 0.18, 0.3, 0.14, 0.08], MED = [34, 42, 24, 31, 17], SD = [0.32, 0.38, 0.42, 0.45, 0.4];
  return Array.from({ length: 2400 }, () => {
    let u = r(), m = 0;
    while (m < 4 && u > W[m]) { u -= W[m]; m++; }
    const peak = r();
    const hour = peak < 0.42 ? 8 + gauss(r) * 0.9 : peak < 0.84 ? 18 + gauss(r) * 1.1 : 6 + r() * 17;
    return { mode: MODES_T[m], min: Math.max(3, Math.min(120, Math.round(MED[m] * Math.exp(gauss(r) * SD[m])))), hour: Math.min(23.99, Math.max(5, hour)) };
  });
})();

// 220 illustrative townships: population, area and density by region.
const REGIONS = ["北部", "中部", "南部", "東部", "離島"];
const TOWNS = (() => {
  const r = rng(5150), rows = [];
  const REG = [[64, 32000, 40], [58, 26000, 70], [62, 22000, 75], [22, 9000, 260], [14, 6000, 35]];
  REG.forEach(([n, popMed, areaMed], j) => {
    for (let i = 1; i <= n; i++) {
      const pop = Math.round(Math.min(950000, Math.max(1200, popMed * Math.exp(gauss(r)))));
      const area = +Math.max(1.5, areaMed * Math.exp(gauss(r) * 0.8)).toFixed(1);
      rows.push({ region: REGIONS[j], id: i, pop, area, density: Math.round(pop / area) });
    }
  });
  return rows;
})();

// Ride pickups around a few hubs in a 30 x 30 km box (rejection-sampled to stay inside).
function pickups(n) {
  const r = rng(4096 + n), HUB = [[11, 13, 1.6, 0.3], [19, 9, 1.1, 0.16], [6, 21, 1.4, 0.12], [23, 21, 2.2, 0.16], [15, 16, 5.5, 0.26]];
  const out = new Array(n);
  for (let i = 0; i < n;) {
    let u = r(), h = 0;
    while (h < HUB.length - 1 && u > HUB[h][3]) { u -= HUB[h][3]; h++; }
    const [cx, cy, s] = HUB[h], x = cx + gauss(r) * s, y = cy + gauss(r) * s;
    if (x > 0.2 && x < 29.8 && y > 0.2 && y < 29.8) out[i++] = { x, y };
  }
  return out;
}

// Daily storage (%) of four reservoirs in 2024: release every day, random inflow events, two storm jumps.
const RESV = (() => {
  const names = ["翡翠", "石門", "曾文", "日月潭"], r = rng(2468);
  const WET = [0.12, 0.14, 0.16, 0.18, 0.32, 0.42, 0.22, 0.28, 0.24, 0.14, 0.12, 0.1];
  const GAIN = [[0.5, 0.72], [0.55, 1.1], [0.2, 1.5], [0.45, 1.0]], OUT = [0.32, 0.5, 0.48, 0.38];
  const STORM = { 205: [12, 18, 26, 10], 304: [6, 9, 4, 5] };
  const level = [93, 80, 58, 84], wide = [], long = [];
  for (let d = new Date(Date.UTC(2024, 0, 1)), i = 0; d.getUTCFullYear() === 2024; d.setUTCDate(d.getUTCDate() + 1), i++) {
    const m = d.getUTCMonth(), wet = m >= 4 && m <= 9 ? 1 : 0, row = { date: new Date(d) };
    names.forEach((name, j) => {
      let v = level[j] - OUT[j] * (0.7 + 0.6 * r());
      if (r() < WET[m]) v += (1 + 4 * r() * r()) * GAIN[j][wet];
      if (STORM[i]) v += STORM[i][j];
      level[j] = v = Math.max(6, Math.min(100, v));
      row[name] = +v.toFixed(1);
      long.push({ date: row.date, name, pct: row[name] });
    });
    row.top = Math.max(...names.map((n) => row[n]));
    wide.push(row);
  }
  return { names, wide, long };
})();

// ---------- scenes ----------
Showcase.run({ scenes: [
  {
    id: "facets", title: "八城市氣候小多圖",
    api: "Plot.plot({ fx, fy, marks: [Plot.barY(), Plot.tickY({ facet: \"exclude\" }), Plot.lineY()] })",
    desc: "每座城市一個分面（fx／fy），所有小格共用同一組比例尺；facet: \"exclude\" 在每格畫出「其他城市」當對照，一眼看出梅雨、颱風與東北季風的差別。",
    hint: "切換雨量與均溫，打開「其他城市對照」與「依年總量排序」，滑過長條看數值",
    mount(ctx) {
      ctx.html(`<div class="op-wrap">${card("op-c1")}</div>`);
      const fill = ctx.$(".op-fill"), ttl = ctx.$(".op-ttl"), read = ctx.$(".op-read");
      let metric = "rain", showAvg = true, others = false, sorted = false;
      const p = plotIn(ctx, fill, (W, H) => {
        const isRain = metric === "rain";
        const cols = W < 520 ? 2 : 4, rows = NAMES.length / cols;
        const order = sorted ? [...NAMES].sort((a, b) => cityTotal(b, metric) - cityTotal(a, metric)) : NAMES;
        const at = new Map(order.map((c, i) => [c, { col: i % cols, row: Math.floor(i / cols) }]));
        const data = NAMES.flatMap((city) => CITIES[city][metric].map((value, k) => ({ city, month: k + 1, value, season: seasonOf(k), ...at.get(city) })));
        const cells = order.map((city) => ({ city, ...at.get(city),
          total: isRain ? `${fmt(cityTotal(city, "rain"))} mm` : `${cityTotal(city, "temp").toFixed(1)} °C` }));
        const avg = d3.range(1, 13).map((month) => ({ month, value: d3.mean(NAMES, (c) => CITIES[c][metric][month - 1]) }));
        const short = (H - 40) / rows < 95, ff = { fx: "col", fy: "row" };
        const marks = [
          Plot.frame({ stroke: "rgba(255,255,255,0.08)", rx: 6 }),
          others && (isRain
            ? Plot.tickY(data, { ...ff, x: "month", y: "value", facet: "exclude", stroke: FG, strokeOpacity: 0.25 })
            : Plot.lineY(data, { ...ff, x: "month", y: "value", z: "city", facet: "exclude", stroke: FG, strokeOpacity: 0.16, curve: "natural" })),
          isRain
            ? Plot.barY(data, { ...ff, x: "month", y: "value", fill: "season", rx: 2, inset: 0.8, tip: TIP, title: (d) => `${d.city} ${d.month} 月\n${d.value} mm（${d.season}）` })
            : Plot.lineY(data, { ...ff, x: "month", y: "value", z: null, stroke: "value", strokeWidth: 2.5, curve: "natural", tip: TIP, title: (d) => `${d.city} ${d.month} 月\n${d.value} °C` }),
          !isRain && Plot.dot(data, { ...ff, x: "month", y: "value", fill: "value", r: 2.2 }),
          showAvg && Plot.lineY(avg, { x: "month", y: "value", stroke: FG, strokeDasharray: "3,3", strokeOpacity: 0.7, strokeWidth: 1.2, curve: "natural" }),
          Plot.text(cells, { ...ff, text: "city", frameAnchor: "top-left", dx: 6, dy: 4, fill: FG, fontSize: 13, fontWeight: 700 }),
          Plot.text(cells, { ...ff, text: "total", frameAnchor: "top-right", dx: -6, dy: 5, fill: MUTED, fontSize: 10.5 }),
        ].filter(Boolean);
        return Plot.plot({ ...base(W, H), marginTop: 4, marginLeft: 36, marginBottom: 22, marginRight: 6,
          fx: { axis: null, padding: 0.08 }, fy: { axis: null, padding: 0.12 },
          x: { type: isRain ? "band" : "linear", domain: isRain ? d3.range(1, 13) : [1, 12], label: null, ticks: [1, 4, 7, 10], tickFormat: (m) => `${m}月` },
          y: { label: null, grid: true, domain: isRain ? [0, 580] : [13, 32.5],
            ticks: isRain ? (short ? [0, 250, 500] : [0, 100, 200, 300, 400, 500]) : (short ? [15, 25] : [15, 20, 25, 30]) },
          color: isRain
            ? { domain: SEASONS, range: ["#9d8cff", "#4cc9f0", "#f72585", "#5b6070"], legend: true }
            : { type: "linear", domain: [15, 30], range: ["#4cc9f0", "#f7df1e", "#ff8c42"], interpolate: "hcl", legend: true, label: "均溫（°C）", width: Math.min(260, W - 20) },
          marks });
      });
      const update = () => {
        const isRain = metric === "rain";
        const tot = NAMES.map((c) => ({ c, v: cityTotal(c, metric) }));
        const hi = d3.greatest(tot, (d) => d.v), lo = d3.least(tot, (d) => d.v);
        ttl.innerHTML = `臺灣八城市每月${isRain ? "雨量（mm）" : "均溫（°C）"}${small("示意資料・同一比例尺")}`;
        read.innerHTML = isRain

        const rows = names.map((name) => ({ name, v: cur.row[name] }));

          x: { domain: [0, 100], label: null, ticks: [0, 50, 100], grid: true }, y: { domain: names, label: null, padding: 0.25 }, color,
          marks: [
            Plot.barX(rows, { y: "name", x: "v", fill: "name", fillOpacity: (d) => (!cur.sel || d.name === cur.sel ? 1 : 0.3), rx: 3 }),
            Plot.text(rows, { y: "name", x: "v", text: (d) => `${d.v}%`, dx: 5, textAnchor: "start", fill: FG }),
          ] });
      });
      const paint = (v) => {
        const sel = cur.sel ? `・選中 <b>${cur.sel}</b>` : "";
        sideTtl.innerHTML = `${md(cur.row.date)} 蓄水率${small(cur.live ? "跟著指標" : events ? "指標已離開" : "預設最後一天")}`;
        sideRead.innerHTML = `input 事件 <b class="op-num">${fmt(events)}</b> 次`;
        read.innerHTML = `模式 <b>${MODES[mode].name}</b>${sel}・plot.value ${v ? `→ <span class="op-num">${md(v.date)}</span>` : "= null"}`;
        valEl.textContent = fmtVal(v);
      };
      const onInput = (e) => {
        const v = e.currentTarget.value;
        events++;
        if (v) cur = v.name ? { row: byTime.get(+v.date), sel: v.name, live: true } : { row: v, sel: null, live: true };
        else cur = { ...cur, live: false };
        side.draw();
        paint(v);
      };
      main.onDraw = (node) => node.addEventListener("input", onInput);
      ctx.group(MODES.map((m) => m.name), 0, (i) => { mode = i; cur = { ...cur, sel: null, live: false }; main.draw(); side.draw(); paint(null); });
      main.draw(); side.draw(); paint(null);
    },
  },

  {
    id: "geo", title: "地圖投影",
    api: "projection: { type, rotate }・Plot.geo()・Plot.sphere()・Plot.graticule()・Plot.link()・Plot.geoCentroid()",
    desc: "Plot 內建 d3-geo 投影：同一份 TopoJSON 國界換投影就重新繪製，Plot.link 在投影下自動畫成大圓航線；國家依 d3.geoArea 算出的面積以對數色階著色。",
    hint: "換投影、拖動中心經度或打開自動旋轉；選方位等距會以臺北為中心，每條航線都變成直線；滑過國家看名稱與面積",
    async mount(ctx) {
      ctx.html(`<div class="op-wrap">${card("op-g", `臺北出發航線與各國面積${small("國界：world-atlas 110m")}`)}</div>`);
      const fill = ctx.$(".op-fill"), read = ctx.$(".op-read");
      const PROJ = [
        { value: "equal-earth", label: "Equal Earth 等面積" }, { value: "orthographic", label: "正射（地球儀）" },
        { value: "azimuthal-equidistant", label: "方位等距" }, { value: "mercator", label: "麥卡托" },
        { value: "equirectangular", label: "等距圓柱" },
      ];
      const TPE = { name: "臺北", lon: 121.56, lat: 25.04 };
      const DEST = [
        { name: "東京", lon: 139.69, lat: 35.69 }, { name: "新加坡", lon: 103.82, lat: 1.35 }, { name: "雪梨", lon: 151.21, lat: -33.87 },
        { name: "洛杉磯", lon: -118.24, lat: 34.05 }, { name: "紐約", lon: -74.01, lat: 40.71 }, { name: "倫敦", lon: -0.13, lat: 51.51 },
        { name: "杜拜", lon: 55.27, lat: 25.2 }, { name: "溫哥華", lon: -123.12, lat: 49.28 },
      ].map((d) => ({ ...d, km: Math.round(d3.geoDistance([TPE.lon, TPE.lat], [d.lon, d.lat]) * 6371) }));
      let proj = "equal-earth", lon = 150, spin = null, countries = null, p = null, ms = 0;
      const redraw = () => p && p.draw();
      ctx.select("投影", PROJ, proj, (v) => {
        proj = v;
        // Center the azimuthal-equidistant view on Taipei so every great-circle route from it is a straight line.
        if (v === "azimuthal-equidistant") { lonInput.value = String(Math.round(TPE.lon)); lonInput.dispatchEvent(new Event("input")); }
        redraw();
      });
      const lonInput = ctx.slider("中心經度", { min: -180, max: 180, step: 1, value: lon, format: (v) => `${v}°` }, (v) => { lon = v; redraw(); });
      ctx.toggle("自動旋轉", false, (v) => {
        if (spin) { spin(); spin = null; }
        if (v) spin = ctx.raf((t, dt) => {
          lonInput.value = String(Math.round((((+lonInput.value + dt * 0.02 + 180) % 360) + 360) % 360 - 180));
          lonInput.dispatchEvent(new Event("input"));
        });
      });
      const st = ctx.status("正在載入世界地圖資料…");
      try {
        await ctx.load("https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js");
        const topo = await d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json", { signal: ctx.signal });
        countries = topojson.feature(topo, topo.objects.countries).features.map((f) => {
          let a = d3.geoArea(f);
          if (a > 2 * Math.PI) a = 4 * Math.PI - a; // guard against inverted rings
          return { ...f, properties: { ...f.properties, area: (a * 6371 * 6371) / 1e4 } };
        });
      } catch (e) {
        if (!ctx.active) return;
        st.error(`地圖資料載入失敗：${e.message}`);
        return;
      }
      st.done();
      p = plotIn(ctx, fill, (W, H) => {
        const tilt = proj === "orthographic" || proj === "azimuthal-equidistant" ? -TPE.lat : 0;
        const t0 = performance.now();
        const plot = Plot.plot({ ...base(W, H), margin: 6,
          projection: { type: proj, rotate: [-(lon === Math.round(TPE.lon) ? TPE.lon : lon), tilt], ...(proj === "mercator" ? { domain: { type: "MultiPoint", coordinates: [[lon - 179.9, -58], [lon + 179.9, 78]] } } : {}) },
          color: { type: "log", scheme: "viridis", legend: true, label: "國土面積（萬 km²）", tickFormat: "~g", width: Math.min(260, W - 20) },
          marks: [
            Plot.sphere({ fill: "#12161c", stroke: "rgba(255,255,255,0.22)" }),
            Plot.graticule({ stroke: "rgba(255,255,255,0.08)" }),
            Plot.geo(countries, { fill: (d) => d.properties.area, stroke: "#0e1013", strokeWidth: 0.4 }),
            Plot.link(DEST, { x1: () => TPE.lon, y1: () => TPE.lat, x2: "lon", y2: "lat", stroke: C[0], strokeWidth: 1.5, strokeOpacity: 0.9,
              title: (d) => `臺北 → ${d.name}\n大圓距離約 ${fmt(d.km)} km` }),
            Plot.dot([TPE, ...DEST], { x: "lon", y: "lat", r: 2.8, fill: C[0], stroke: "#0e1013" }),
            Plot.text(W < 480 ? [TPE] : [TPE, ...DEST], { x: "lon", y: "lat", text: "name", dy: -9, fill: FG, fontSize: 11, fontWeight: 600, stroke: "#0e1013", strokeWidth: 3, paintOrder: "stroke" }),
            Plot.tip(countries, Plot.pointer(Plot.geoCentroid({ ...TIP, title: (d) => `${d.properties.name}\n面積約 ${fmt(d.properties.area, 1)} 萬 km²` }))),
          ] });
        ms = performance.now() - t0;
        return plot;
      });
      p.onDraw = () => {
        const label = PROJ.find((x) => x.value === proj).label;
        read.innerHTML = `<b>${label}</b>・${countries.length} 個國家・Plot.plot <span class="op-num">${fmtMs(ms)}</span>`;
      };
      p.draw();
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "Plot.plot({ marks: [Plot.dot(data) | Plot.dot(data, Plot.hexbin()) | Plot.raster(data)] })",
    desc: "資料點逐級加倍，每級呼叫 Plot.plot() 產生 SVG、放進頁面並等到畫面更新；切換三種標記比較：dot 每點一個 SVG 元素，hexbin 先聚合，raster 把點畫進一張點陣圖。",
    hint: "先選標記再按「開始測試」；跑完換另一種標記再跑一次，右上表格並排比較",
    mount(ctx) {
      ctx.html(`<div class="panel op-stress"><div class="op-tag">…</div><div class="op-cmp"></div><div class="op-box"><div class="op-fill"></div></div></div>`);
      const host = ctx.$(".op-fill"), tag = ctx.$(".op-tag"), cmp = ctx.$(".op-cmp");
      const SIZES = [2000, 4000, 8000, 16000, 32000, 64000, 128000, 256000, 512000, 1024000, 2048000];
      const KINDS = [
        { key: "dot", label: "Plot.dot", color: { type: "ordinal", domain: [0, 1, 2], range: [C[1], C[2], C[0]] },
          mark: (P) => Plot.dot(P, { x: "x", y: "y", fill: "g", r: 1.2 }) },
        { key: "hex", label: "hexbin", color: { scheme: "viridis" },
          mark: (P) => Plot.dot(P, Plot.hexbin({ fill: "count" }, { x: "x", y: "y", binWidth: 10, symbol: "hexagon" })) },
        { key: "raster", label: "raster", color: { type: "ordinal", domain: [0, 1, 2], range: [C[1], C[2], C[0]] },
          mark: (P) => Plot.raster(P, { x: "x", y: "y", fill: "g" }) },
      ];
      const results = { dot: {}, hex: {}, raster: {} };
      let kind = 0;
      // Three gaussian blobs on a fixed 0..100 domain so every level draws the same axes.
      const points = (n) => {
        const r = rng(n), ctr = [[30, 62, 9], [64, 38, 11], [70, 74, 7]];
        return Array.from({ length: n }, (_, i) => {
          const g = i % 3, [cx, cy, s] = ctr[g];
          return { x: Math.min(100, Math.max(0, cx + gauss(r) * s)), y: Math.min(100, Math.max(0, cy + gauss(r) * s)), g };
        });
      };
      const show = (P) => {
        const K = KINDS[kind];
        host.replaceChildren(Plot.plot({ ...base(host.clientWidth, host.clientHeight), marginLeft: 34, marginRight: 10,
          x: { domain: [0, 100], label: null }, y: { domain: [0, 100], label: null, grid: true }, color: K.color, marks: [K.mark(P)] }));
        void host.offsetHeight; // force style + layout of the new SVG inside the timing
      };
      const nextPaint = () => new Promise((res) => requestAnimationFrame(() => setTimeout(res, 0)));
      const nodes = () => host.getElementsByTagName("*").length;
      const showTag = (n) => { tag.innerHTML = `<b>${KINDS[kind].label}</b>・${fmt(n)} 點・DOM <b>${fmt(nodes())}</b> 節點`; };
      const paintCmp = () => {
        const ns = SIZES.filter((n) => KINDS.some((K) => results[K.key][n] != null));
        if (!ns.length) { cmp.innerHTML = "<p>三種標記各跑一次，結果會並排在這裡</p>"; return; }
        const cell = (n, key) => {
          const v = results[key][n];
          if (v == null) return "<td>－</td>";
          const best = Math.min(...KINDS.map((K) => results[K.key][n] ?? Infinity));
          return `<td class="${v === best ? "op-win" : ""}">${fmtMs(v)}</td>`;
        };
        cmp.innerHTML = `<table><tr><th>點數</th>${KINDS.map((K) => `<th>${K.label}</th>`).join("")}</tr>${ns.map((n) =>
          `<tr><td>${fmtCompact(n)}</td>${KINDS.map((K) => cell(n, K.key)).join("")}</tr>`).join("")}</table>`;
      };
      const preview = () => { show(points(2000)); showTag(2000); };
      preview();
      paintCmp();
      const b = ctx.bench({
        label: "資料點", unit: "點", sizes: SIZES, target: 1000, budget: 2500,
        prepare: (n) => { host.replaceChildren(); return points(n); },
        async run(n, P) {
          const who = KINDS[kind].key;
          show(P);
          await nextPaint();
          // After bench() records this level, copy its time into the side-by-side table.
          ctx.timeout(() => {
            const last = b.results[b.results.length - 1];
            if (last && last.n === n) results[who][n] = last.ms;
            paintCmp(); showTag(n);
          }, 0);
          return `${KINDS[kind].label}・${fmtCompact(nodes())} 節點`;
        },
        note: "計時包含 Plot.plot() 建立比例尺與 SVG、放進頁面、強制版面計算，到下一次畫面更新為止（含不到一個影格的等待）；資料生成不計時。dot 的 DOM 節點數隨點數線性成長，是主要瓶頸；hexbin 與 raster 的輸出大小固定，主要花在聚合與逐點寫入像素。",
      });
      ctx.group(KINDS.map((K) => K.label), 0, (i) => { kind = i; preview(); });
      ctx.controls.classList.add("bottom");
    },
  },
] });
</script>
</body>
