<style>
  .od-label { font-size: 12px; color: var(--muted); }
  .od-num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .od-mono .odometer.odometer-theme-default, .od-mono .odometer.odometer-theme-minimal { font-family: var(--mono); }
  .od-o { min-width: 0; }
  .odometer { white-space: nowrap; }
  /* plaza paints a light card but leaves marks in the inherited text color; give marks the digit color on dark pages */

  .od-unit { font-size: 14px; color: var(--muted); }
  .od-row { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; min-width: 0; }
  .od-scroll { position: absolute; inset: var(--sc-ctl-h, 0px) 0 var(--sc-ctl-b, 0px); padding: 10px; overflow-y: auto; display: grid; gap: 10px; }
  /* Visible roll time follows --od-dur; scoped to the animating states so the property stays "transform". */

  .od-dur .odometer.odometer-animating-down.odometer-animating .odometer-ribbon-inner { transition-duration: var(--od-dur, 2s) !important; }

  /* Scene 1: live wall */
  .od-wall { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(min-content, 1fr)); }
  .od-tile { position: relative; overflow: hidden; min-width: 0; padding: 12px 16px 12px 20px; display: flex; flex-direction: column; justify-content: center; gap: 8px;
    container-type: inline-size; transition: box-shadow .6s; }
  .od-tile::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--c); }
  .od-tile.od-up { box-shadow: inset 0 0 0 1px rgba(242, 92, 110, .55); }

  /* Scene 2: theme gallery */
  .od-gal { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(min-content, 1fr)); }
  .od-card { min-width: 0; display: flex; flex-direction: column; gap: 8px; container-type: inline-size; }

  .od-card-v { flex: 1; min-height: 2.2em; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6px 0;

  /* Scene 3: format strings */

  .od-fcard code { font: 600 15px var(--mono); color: var(--accent); white-space: pre; }

  @media (max-width: 760px) { .od-fmt { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto repeat(3, minmax(min-content, 1fr)); } }

  /* Scene 4: slide vs count */
  .od-vs { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto minmax(min-content, 1fr); }
  .od-lane { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; container-type: inline-size; border-top: 3px solid var(--c); }
  .od-lane-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
  .od-lane-h b { font-size: 15px; font-weight: 600; }
  .od-lane-h code { font: 12px var(--mono); color: var(--muted); }
  .od-lane .od-o { overflow: hidden; text-align: center; }
  .od-lane .odometer { font-size: clamp(26px, 8cqw, 64px); color: var(--c); }
  .od-stat { font-size: 12px; color: var(--muted); text-align: center; }
  .od-stat b { font: 600 13px var(--mono); color: var(--fg); margin: 0 3px; }
  @media (max-width: 760px) { .od-vs { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto repeat(2, minmax(min-content, 1fr)); } }

  /* Scene 5: temperatures */
  .od-temp { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(min-content, 1fr)); }
  .od-st { position: relative; overflow: hidden; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding-left: 20px;
    container-type: inline-size; }
  .od-st::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 3px; background: var(--c5); transition: background .6s; }
  .od-st.od-cold::before { background: var(--c2); }
  .od-st .odometer { font-size: clamp(24px, 10cqw, 50px); }
  .od-st-r { font-size: 12px; color: var(--muted); }
  .od-st-r b { font: 600 12px var(--mono); color: var(--fg); margin: 0 2px; }
  @media (max-width: 760px) { .od-temp { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(min-content, 1fr)); } }

  /* Scene 6: declarative scoreboard */
  .od-sb { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: minmax(min-content, 1fr) minmax(min-content, auto); }
  .od-board { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; container-type: inline-size;
    background: linear-gradient(180deg, rgba(139, 245, 165, .06), transparent 70%), var(--panel); }
  .od-team { display: flex; flex-direction: column; align-items: center; gap: 10px; min-width: 0; }
  .od-team-n { font-size: 15px; font-weight: 600; }
  .od-team-n small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  .od-board .odometer { font-size: clamp(40px, 10cqw, 112px); }
  .od-mid { font: 700 18px var(--mono); color: var(--muted); }
  .od-src, .od-log { min-width: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }
  .od-code { margin: 0; font: 12px/1.65 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--fg); }
  .od-code .od-cm { font-family: var(--font); color: var(--muted); }
  .od-log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .od-log li { display: flex; gap: 8px; align-items: baseline; }
  .od-log li span { margin-left: auto; color: var(--muted); font-size: 12px; }
  .od-log li .od-num { color: var(--c4); }
  .od-log-h b { font: 600 12px var(--mono); color: var(--fg); margin: 0 2px; }
  @media (max-width: 760px) { .od-sb { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(min-content, auto)); } }

  /* Scene 7: car mileage */
  .od-carw { position: absolute; inset: var(--sc-ctl-h, 0px) 0 var(--sc-ctl-b, 0px); padding: 12px; overflow-y: auto; display: grid; place-items: center; }
  .od-car { width: min(680px, 100%); padding: 22px 26px; border-radius: 16px; background: linear-gradient(180deg, #1d2024, #0f1113); color: #e8e6df;
    border: 1px solid rgba(255, 255, 255, .08); box-shadow: 0 18px 40px -20px rgba(0, 0, 0, .6); display: flex; flex-direction: column; gap: 16px; }
  .od-car-row { display: grid; grid-template-columns: 76px minmax(0, max-content) 1fr; align-items: center; gap: 12px; }
  .od-car-l { font-size: 14px; font-weight: 600; display: flex; flex-direction: column; }
  .od-car-l small { font: 500 11px var(--mono); color: #9b998f; letter-spacing: .08em; }
  .od-car .od-o { overflow: hidden; }
  .od-car .odometer { font-size: clamp(28px, 7vw, 54px); }
  .od-car-u { font: 13px var(--mono); color: #9b998f; }
  .od-car-info { border-top: 1px solid rgba(255, 255, 255, .1); padding-top: 12px; font-size: 12.5px; line-height: 1.7; color: #b9b7ae; }
  .od-car-info b { font: 600 13px var(--mono); color: #f2f0e8; margin: 0 2px; }
  .od-car-info .od-warn { color: #ff8c42; }
  @media (max-width: 480px) { .od-car { padding: 16px; } .od-car-row { grid-template-columns: 58px minmax(0, max-content) 1fr; gap: 8px; } }

  /* Scene 8: stress */
  .od-stress { position: absolute; inset: 8px 8px 56px; }
  @media (min-width: 761px) { .od-stress { inset: 8px 8px 8px 350px; } }
  .od-cells { position: absolute; inset: 0; overflow: hidden; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 10px; font-size: 13px; line-height: 1.3; }
  .od-cells > div { min-width: 7ch; }

<body>
<script>window.odometerOptions = { auto: false, selector: ".od-auto" }; // no auto init on load; Odometer.init() only scans .od-auto</script>
<script src="https://cdn.jsdelivr.net/npm/odometer@0.4.8/odometer.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Odometer 0.4.8 (HubSpot): CSS-transition digit ribbons, seven official themes, format strings,
// slide vs count animation, negative and decimal values, declarative init and the odometerdone event.
const THEMES = [
  { id: "default", name: "預設", desc: "無底色，沿用頁面文字顏色" },
  { id: "minimal", name: "極簡", desc: "只含滾動所需結構，字型顏色都由你決定" },
  { id: "car", name: "汽車里程", desc: "黑底滾輪，最後一格淺色代表小數位", scale: 0.85 },
  { id: "plaza", name: "廣場", desc: "淺藍底圓角數字卡" },
  { id: "slot-machine", name: "老虎機", desc: "黃色外框與 Rye 字型，每位數最寬", scale: 0.6 },
  { id: "train-station", name: "車站看板", desc: "深色翻牌看板與 Economica 字型" },
  { id: "digital", name: "數位", desc: "綠色 LED 光暈與 Wallpoet 字型" },
];
const rand = (a, b) => a + Math.random() * (b - a);
const fmtN = (v, d = 0) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
// Odometer caches its instance on el.odometer, so every (re)build needs a fresh element.
function make(host, opts) {
  host.textContent = "";
  const el = document.createElement("div");
  host.append(el);
  return new Odometer({ el, ...opts });
}
const setTheme = (el, id) => { el.className = el.className.replace(/odometer-theme-[\w-]+/, `odometer-theme-${id}`); };

Showcase.run({ scenes: [
  {
    id: "wall", title: "即時數據牆",
    api: "new Odometer({ el, value, format, theme, duration }) | od.update(n)",
    desc: "四個示意指標每 2 秒用 update() 推送新值，每一位數各自沿滾輪轉到目標；切換主題只換掉元素上的 odometer-theme-* class，下一次重繪就沿用新外觀。",
    hint: "大幅跳動讓每一位數一起轉；主題選單涵蓋全部七種官方主題",
    mount(ctx) {
      const TILES = [
        { label: "全台即時用電", unit: "萬瓩", value: 3412.5, format: "(,ddd).d", step: () => (Math.random() - 0.45) * 12 },
        { label: "台北捷運今日進站", unit: "人次", value: 1856320, format: "(,ddd)", step: () => 300 + Math.random() * 600 },
        { label: "高鐵今日售出座位", unit: "席", value: 213580, format: "(,ddd)", step: () => 40 + Math.random() * 90 },
        { label: "YouBike 使用中車輛", unit: "輛", value: 18642, format: "(,ddd)", step: () => (Math.random() - 0.5) * 300 },
      ];
      ctx.html(`<div class="od-scroll od-wall od-mono od-dur" style="--od-dur:1.5s">${TILES.map((t, i) => `<div class="panel od-tile" style="--c:var(--c${i + 1})">
        <div class="od-head"><b>${t.label}</b><span>示意資料</span></div>
        <div class="od-row"><div class="od-o"></div><span class="od-unit">${t.unit}</span></div>
        <div class="od-chg">等待第一次更新</div></div>`).join("")}</div>`);
      const tiles = ctx.$$(".od-tile");
      const vals = TILES.map((t) => t.value);
      const meters = TILES.map((t, i) => make(tiles[i].querySelector(".od-o"), { value: t.value, format: t.format, theme: "default", duration: 1500 }));
      let auto = true;
      function push(scale) {
        TILES.forEach((t, i) => {
          const dec = t.format.includes(".") ? 1 : 0;
          const prev = vals[i];
          const next = Math.max(0, Math.round((prev + t.step() * scale) * 10 ** dec) / 10 ** dec);
          const diff = next - prev;
          vals[i] = next;
          meters[i].update(next);
          const chg = tiles[i].querySelector(".od-chg");
          chg.className = `od-chg ${diff >= 0 ? "up" : "down"}`;
          chg.innerHTML = `<b>${diff >= 0 ? "▲" : "▼"} ${fmtN(Math.abs(diff), dec)}</b> ${scale > 1 ? "大幅跳動" : "較 2 秒前"}`;
          tiles[i].classList.remove("od-up", "od-down");
          tiles[i].classList.add(diff >= 0 ? "od-up" : "od-down");
          ctx.timeout(() => tiles[i].classList.remove("od-up", "od-down"), 1200);
        });
      }
      ctx.interval(() => { if (auto) push(1); }, 2000);
      ctx.timeout(() => push(1), 500);
      ctx.select("主題", THEMES.map((t) => ({ value: t.id, label: t.name })), "default", (id) => meters.forEach((m) => setTheme(m.el, id)));
      ctx.button("大幅跳動", () => push(37), { primary: true });
      ctx.toggle("自動更新", true, (v) => { auto = v; });
    },
  },
  {
    id: "themes", title: "七種主題",
    api: "new Odometer({ el, theme: \"car\" }) ＋ odometer-theme-car.css",
    desc: "官方附的七支主題 CSS 同時載入，各自套在一個實例上：數值相同、外觀各異。主題尺寸都用 em 單位，改字級就整組等比縮放。",
    hint: "拖曳字級滑桿看主題等比縮放；每 3 秒自動換一個新數值",
    mount(ctx) {
      ctx.html(`<div class="od-scroll od-gal">${THEMES.map((t) => `<div class="panel od-card" style="--od-t:${t.scale || 1}">
        <div class="od-card-h"><b>${t.name}</b><code>${t.id}</code></div>
        <div class="od-card-v"><div class="od-o"></div></div><p>${t.desc}</p></div>`).join("")}
        <div class="panel od-card od-card-info"><b>載入方式</b>
          <code>odometer-theme-car.css</code><code>new Odometer({ el, theme: "car" })</code>
          <p>選擇器都寫成 .odometer-theme-名稱，同一頁可並存多種主題；car、digital、slot-machine、train-station 另外向 Google Fonts 載入字型。</p></div></div>`);
      const gal = ctx.$(".od-gal");
      const cards = ctx.$$(".od-card-v");
      let value = 98765.43, auto = true;
      const meters = THEMES.map((t, i) => make(cards[i].querySelector(".od-o"), { value, theme: t.id, format: "(,ddd).dd" }));
      const set = (v) => { value = Math.round(v * 100) / 100; meters.forEach((m) => m.update(value)); };
      const randomValue = () => {
        let cents = Math.floor(rand(1, 99));
        if (cents % 10 === 0) cents += 1; // keep two visible decimals
        return Math.floor(rand(10000, 999999)) + cents / 100;
      };
      ctx.interval(() => { if (auto) set(randomValue()); }, 3000);
      ctx.timeout(() => set(randomValue()), 400);
      ctx.button("隨機數值", () => set(randomValue()), { primary: true });
      ctx.button("+0.01", () => set(value + 0.01));
      ctx.slider("字級", { min: 60, max: 160, step: 10, value: 100, format: (v) => `${v}%` }, (v) => gal.style.setProperty("--od-k", v / 100));
      ctx.toggle("自動更新", true, (v) => { auto = v; });
    },
  },
  {
    id: "format", title: "格式字串",
    api: "new Odometer({ el, format: \"(,ddd).dd\" })",
    desc: "format 字串決定分組符號、每組位數與小數位數：括號內是重複的分組樣式，括號後是小數點符號與小數位數。六種寫法同時接收同一個 update()。",
    hint: "小數尾數的 0 不會補齊，按「整數值」看 .dd 格式的小數位消失",
    mount(ctx) {
      const FORMATS = [
        { f: "(,ddd)", name: "千分位整數", note: "小數四捨五入" },
        { f: "(,ddd).dd", name: "預設格式", note: "千分位＋兩位小數" },
        { f: "(.ddd),dd", name: "歐陸寫法", note: "點分千位、逗號當小數點" },
        { f: "( ddd),dd", name: "法式寫法", note: "不換行空白分千位" },
        { f: "(,dddd)", name: "萬位分組", note: "每四位一組，貼近中文讀法" },
        { f: "d", name: "純整數", note: "不分組" },
      ];
      ctx.html(`<div class="od-scroll od-fmt od-mono">
        <div class="panel od-bar"><span>od.update(<b data-raw></b>)</span><span>六個實例共用同一個數值</span></div>
        ${FORMATS.map((x) => `<div class="panel od-fcard"><code>${x.f}</code>
          <div class="od-fname">${x.name}<span>${x.note}</span></div><div class="od-o"></div></div>`).join("")}</div>`);
      const hosts = ctx.$$(".od-fcard .od-o");
      let value = 1234567.89, auto = true;
      const meters = FORMATS.map((x, i) => make(hosts[i], { value, format: x.f, theme: "default" }));
      const raw = ctx.$("[data-raw]");
      function set(v) {
        value = Math.round(v * 100) / 100;
        raw.textContent = String(value);
        meters.forEach((m) => m.update(value));
      }
      raw.textContent = String(value);
      const randomValue = () => Math.round(rand(100000, 99999999)) + Math.floor(rand(11, 99)) / 100;
      ctx.interval(() => { if (auto) set(randomValue()); }, 3500);
      ctx.timeout(() => set(randomValue()), 400);
      ctx.button("隨機數值", () => set(randomValue()), { primary: true });
      ctx.button("+0.01", () => set(value + 0.01));
      ctx.button("整數值", () => set(Math.round(value) + 1));
      ctx.button("×10", () => set(value * 10 > 1e10 ? randomValue() : value * 10));
      ctx.toggle("自動更新", true, (v) => { auto = v; });
    },
  },
  {
    id: "animation", title: "滑動與計數",
    api: "new Odometer({ el, animation: \"count\", duration })",
    desc: "預設的滑動模式替每一位數建一條滾輪交給 CSS transition；animation: \"count\" 改用 JS 每秒約 20 次重繪整個數字。duration 決定滾輪最多幾格（MAX_VALUES），差距太大時中間值會被略過。",
    hint: "調 duration 會重建兩個實例；比較兩邊 render() 次數與滾輪格數",
    mount(ctx) {
      ctx.html(`<div class="od-scroll od-vs od-mono od-dur">
        <div class="panel od-bar"><span>滾輪格數上限 MAX_VALUES ＝ <b data-max></b>（duration ÷ 33.3 ÷ 2 取整）</span><span>目前值 <b data-val></b></span></div>
        <div class="panel od-lane" style="--c:var(--c2)"><div class="od-lane-h"><b>滑動</b><code>預設，不指定 animation</code></div><div class="od-o"></div><div class="od-stat"></div></div>
        <div class="panel od-lane" style="--c:var(--c5)"><div class="od-lane-h"><b>計數</b><code>animation: "count"</code></div><div class="od-o"></div><div class="od-stat"></div></div></div>`);
      const box = ctx.$(".od-vs");
      const lanes = ctx.$$(".od-lane").map((el, i) => ({ el, mode: i ? "count" : undefined, od: null, renders: 0, cells: 0, t0: 0, done: "", shown: "" }));
      let value = 1000, dur = 2, auto = true, step = 0;
      function build() {
        box.style.setProperty("--od-dur", `${dur}s`);
        lanes.forEach((ln) => {
          ln.od = make(ln.el.querySelector(".od-o"), { value, duration: dur * 1000, animation: ln.mode, theme: "default" });
          const render = ln.od.render;
          ln.od.render = function (v) { ln.renders++; return render.call(this, v); }; // count redraws
          ln.od.el.addEventListener("odometerdone", () => { ln.done = `${((performance.now() - ln.t0) / 1000).toFixed(2)} 秒`; });
          ln.renders = 0; ln.cells = 0; ln.done = "";
        });
        ctx.$("[data-max]").textContent = lanes[0].od.MAX_VALUES;
        ctx.$("[data-val]").textContent = fmtN(value);
      }
      function go(v) {
        value = v;
        ctx.$("[data-val]").textContent = fmtN(value);
        lanes.forEach((ln) => { ln.renders = 0; ln.cells = 0; ln.done = "轉動中"; ln.t0 = performance.now(); ln.od.update(v); });
      }
      ctx.raf(() => {
        lanes.forEach((ln) => {
          ln.cells = Math.max(ln.cells, ln.el.getElementsByClassName("odometer-value").length);
          const html = `render()<b>${ln.renders}</b>次・滾輪格數最多<b>${ln.cells}</b>・轉完<b>${ln.done || "－"}</b>`;
          if (html !== ln.shown) { ln.shown = html; ln.el.querySelector(".od-stat").innerHTML = html; }
        });
      });
      const ACTIONS = [() => go(value + 1), () => go(value + 37), () => go(value + 12345), () => go(value * 10 > 1e9 ? 1000 : value * 10)];
      ctx.interval(() => { if (auto) ACTIONS[step++ % ACTIONS.length](); }, 3500);
      ctx.timeout(() => go(value + 12345), 400);
      ctx.button("+1", ACTIONS[0]);
      ctx.button("+37", ACTIONS[1]);
      ctx.button("+12,345", ACTIONS[2], { primary: true });
      ctx.button("×10", ACTIONS[3]);
      ctx.slider("duration", { min: 0.5, max: 4, step: 0.25, value: dur, format: (v) => `${v} 秒` }, (v) => { dur = v; build(); });
      ctx.toggle("自動示範", true, (v) => { auto = v; });
      build();
    },
  },
  {
    id: "signed", title: "正負數與小數",
    api: "new Odometer({ el, format: \"(,ddd).d\" }) | od.update(-3.4)",
    desc: "六個高山測站的示意氣溫，format 取一位小數，數值在正負之間來回；上升與下降分別套用 odometer-animating-up 與 -down，滾輪方向相反。",
    hint: "從正數降到負數時，滑動過程看不到負號，動畫結束才補上",
    mount(ctx) {
      const STATIONS = [
        { name: "玉山", alt: 3952, t: 3.6 }, { name: "雪山", alt: 3886, t: 4.3 }, { name: "合歡山", alt: 3417, t: 5.8 },
        { name: "阿里山", alt: 2216, t: 11.4 }, { name: "太平山", alt: 1950, t: 12.7 }, { name: "拉拉山", alt: 1600, t: 14.2 },
      ];
      ctx.html(`<div class="od-scroll od-temp">${STATIONS.map((s) => `<div class="panel od-st">
        <div class="od-head"><b>${s.name}</b><span>海拔 ${fmtN(s.alt)} 公尺</span></div>
        <div class="od-row"><div class="od-o"></div><span class="od-unit">°C</span></div>
        <div class="od-st-r"></div></div>`).join("")}</div>`);
      const cards = ctx.$$(".od-st");
      const state = STATIONS.map((s) => ({ t: s.t, lo: s.t, hi: s.t }));
      const meters = STATIONS.map((s, i) => make(cards[i].querySelector(".od-o"), { value: s.t, format: "(,ddd).d", theme: "plaza" }));
      let auto = true;
      function paint(i) {
        const s = state[i];
        cards[i].classList.toggle("od-cold", s.t < 0);
        cards[i].querySelector(".od-st-r").innerHTML = `今日最低<b>${s.lo.toFixed(1)}</b>・最高<b>${s.hi.toFixed(1)}</b>`;
      }
      function shift(lo, hi) {
        state.forEach((s, i) => {
          let next = Math.round(Math.min(25, Math.max(-15, s.t + rand(lo, hi))) * 10) / 10;
          if (next === s.t) next = Math.round((next + 0.1) * 10) / 10;
          s.t = next; s.lo = Math.min(s.lo, next); s.hi = Math.max(s.hi, next);
          meters[i].update(next);
          paint(i);
        });
      }
      state.forEach((s, i) => paint(i));
      const cold = () => shift(-10, -6), warm = () => shift(6, 10);
      ctx.interval(() => { if (auto) shift(-1.5, 1.5); }, 2600);
      ctx.timeout(cold, 500);
      ctx.button("寒流來襲", cold, { primary: true });
      ctx.button("回暖", warm);
      ctx.toggle("自動變化", true, (v) => { auto = v; });
    },
  },
  {
    id: "declarative", title: "宣告式計分板",
    api: "Odometer.init() | el.innerHTML = n | \"odometerdone\"",
    desc: "README 的宣告式用法：HTML 放 class=\"odometer\" 的元素，Odometer.init() 依 selector 建立實例，之後直接改 innerHTML 就會轉動；每次轉完在元素上觸發 odometerdone 事件。",
    hint: "轉動中再加分會打斷前一次滾動，odometerdone 次數會少於更新次數",
    mount(ctx) {
      ctx.html(`<div class="od-scroll od-sb">
        <div class="panel od-board">
          <div class="od-team"><span class="od-team-n">主隊<small>HOME</small></span><div class="odometer odometer-theme-digital od-auto">0</div></div>
          <span class="od-mid">VS</span>
          <div class="od-team"><span class="od-team-n">客隊<small>AWAY</small></span><div class="odometer odometer-theme-digital od-auto">0</div></div>
        </div>
        <div class="panel od-src"><span class="od-label">宣告式寫法</span><pre class="od-code">&lt;div class="odometer odometer-theme-digital"&gt;0&lt;/div&gt;

window.odometerOptions = { auto: false, selector: ".od-auto" };
Odometer.init();        <span class="od-cm">// 依 selector 建立實例</span>
el.innerHTML = 54;      <span class="od-cm">// setter 改寫成呼叫 update()</span>
el.addEventListener("odometerdone", onDone);</pre></div>
        <div class="panel od-log"><span class="od-label od-log-h">更新<b data-u>0</b>次・odometerdone<b data-d>0</b>次</span><ol></ol></div></div>`);
      const els = ctx.$$(".od-auto");
      Odometer.init(); // converts every element matching odometerOptions.selector
      const NAMES = ["主隊", "客隊"];
      const scores = [0, 0], t0 = [0, 0];
      const list = ctx.$(".od-log ol");
      let team = 0, auto = true, updates = 0, dones = 0;
      const counts = () => { ctx.$("[data-u]").textContent = updates; ctx.$("[data-d]").textContent = dones; };
      els.forEach((el, i) => ctx.on(el, "odometerdone", () => {
        dones++;
        counts();
        const li = document.createElement("li");
        li.innerHTML = `<b>${NAMES[i]}</b> 停在 <b class="od-num">${scores[i]}</b><span>最後一次更新後 ${((performance.now() - t0[i]) / 1000).toFixed(2)} 秒</span>`;
        list.prepend(li);
        while (list.children.length > 7) list.lastChild.remove();
      }));
      function score(i, pts) {
        scores[i] = pts == null ? 0 : scores[i] + pts;
        t0[i] = performance.now();
        updates++;
        counts();
        els[i].innerHTML = scores[i]; // the overridden setter calls update()
      }
      ctx.interval(() => {
        if (!auto) return;
        const r = Math.random();
        score(Math.random() < 0.5 ? 0 : 1, r < 0.2 ? 1 : r < 0.8 ? 2 : 3);
      }, 1700);
      ctx.timeout(() => { score(0, 2); score(1, 3); }, 300);
      ctx.group(NAMES, 0, (i) => { team = i; });
      ctx.button("+1", () => score(team, 1));
      ctx.button("+2", () => score(team, 2), { primary: true });
      ctx.button("+3", () => score(team, 3));
      ctx.button("歸零", () => { if (scores[0]) score(0, null); if (scores[1]) score(1, null); });
      ctx.toggle("自動比賽", true, (v) => { auto = v; });
    },
  },
  {
    id: "car", title: "汽車里程表",
    api: "od.update(n) 連續呼叫 ＋ transition-duration",
    desc: "汽車主題把最後一位做成淺色滾輪，正好當作 0.1 公里；示意車速經時間加速後連續 update()。更新間隔比轉動時間短時，新的 update 會打斷還在轉的滾輪，所以把 CSS 轉動時間跟著間隔縮短。",
    hint: "關掉「同步轉動時間」並把間隔調到 0.5 秒，看滾輪被打斷重轉",
    mount(ctx) {
      ctx.html(`<div class="od-carw"><div class="od-car od-dur">
        <div class="od-car-row"><span class="od-car-l">總里程<small>ODO</small></span><div class="od-o" data-odo></div><span class="od-car-u">km</span></div>
        <div class="od-car-row"><span class="od-car-l">本趟<small>TRIP</small></span><div class="od-o" data-trip></div><span class="od-car-u">km</span></div>
        <div class="od-car-info"></div></div></div>`);
      const car = ctx.$(".od-car");
      const LAPSE = 60; // time-lapse factor so the wheels move visibly
      let km = 48213.6, trip = 0, speed = 90, every = 1, sync = true, timer = 0;
      // Real odometers have no decimal point: the light last wheel of the car theme is the 0.1 km digit.
      const odo = make(ctx.$("[data-odo]"), { value: Math.floor(km * 10), format: "d", theme: "car" });
      const tr = make(ctx.$("[data-trip]"), { value: 0, format: "d", theme: "car" });
      function info() {
        const roll = sync ? Math.min(2, every * 0.85) : 2;
        car.style.setProperty("--od-dur", `${roll}s`);
        const step = (speed * LAPSE * every) / 3600;
        ctx.$(".od-car-info").innerHTML = `車速<b>${speed}</b>km/h・時間加速<b>×${LAPSE}</b>・每次更新<b>+${step.toFixed(1)}</b>km<br>`
          + `更新間隔<b>${every}</b>秒・轉動時間<b>${roll.toFixed(2)}</b>秒`
          + (roll > every ? `<br><span class="od-warn">轉動時間比更新間隔長，滾輪還沒轉完就會被下一次 update 打斷重轉</span>` : "");
      }
      function tick() {
        const add = (speed * LAPSE * every) / 3600;
        km += add; trip += add;
        odo.update(Math.floor(km * 10));
        tr.update(Math.floor(trip * 10));
      }
      function restart() {
        clearInterval(timer);
        timer = ctx.interval(tick, every * 1000);
        info();
      }
      ctx.timeout(tick, 300);
      ctx.slider("車速", { min: 20, max: 240, step: 10, value: speed, format: (v) => `${v} km/h` }, (v) => { speed = v; info(); });
      ctx.slider("更新間隔", { min: 0.5, max: 3, step: 0.25, value: every, format: (v) => `${v} 秒` }, (v) => { every = v; restart(); });
      ctx.toggle("同步轉動時間", true, (v) => { sync = v; info(); });
      ctx.button("本趟歸零", () => { trip = 0; tr.update(0); }, { primary: true });
      restart();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new Odometer({ el, value, format }) × N，各自約每 2 秒 update()",
    desc: "N 個 odometer 同時運作，每個約每 2 秒換一次新值，逐級加量直到掉到 30 FPS 以下。大幅跳動讓每一位數都拉出長滾輪，小幅遞增只轉最後一兩位，計數模式完全不用滾輪。",
    hint: "按「自動加壓」開始；切換模式後再測一次比較滾輪長度的影響",
    mount(ctx) {
      ctx.html(`<div class="od-stress"><div class="od-cells od-mono"></div></div>`);
      const box = ctx.$(".od-cells");
      const MODES = ["大幅跳動", "小幅遞增", "計數模式"];
      const PERIOD = 2000, TICK = 100;
      let mode = 0, list = [], ptr = 0, updates = 0, lastU = 0, lastT = performance.now();
      const rnd = () => 100000 + Math.floor(Math.random() * 900000);
      const next = (od) => (mode === 1 ? od.value + 1 + Math.floor(Math.random() * 9) : rnd());
      function fill(n) {
        box.textContent = "";
        ptr = 0;
        const frag = document.createDocumentFragment(), els = [];
        for (let i = 0; i < n; i++) {
          const el = document.createElement("div");
          el.style.color = `var(--c${(i % 6) + 1})`;
          frag.append(el);
          els.push(el);
        }
        box.append(frag);
        list = els.map((el) => new Odometer({ el, value: rnd(), format: "(,ddd)", theme: "minimal", animation: mode === 2 ? "count" : undefined }));
      }
      // Round-robin so every odometer receives a new value about once per PERIOD.
      ctx.interval(() => {
        if (!list.length) return;
        const k = Math.max(1, Math.round((list.length * TICK) / PERIOD));
        for (let j = 0; j < k; j++) {
          list[ptr].update(next(list[ptr]));
          ptr = (ptr + 1) % list.length;
          updates++;
        }
      }, TICK);
      ctx.group(MODES, 0, (i) => { mode = i; fill(list.length || 10); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "odometer", steps: [10, 20, 40, 80, 160, 320, 640, 1280], minFps: 30,
        apply: fill,
        metrics: () => {
          const now = performance.now();
          const rate = ((updates - lastU) * 1000) / Math.max(1, now - lastT);
          lastU = updates; lastT = now;
          return { "模式": MODES[mode], "每秒更新": Math.round(rate), "滾輪元素": Showcase.fmtCompact(box.getElementsByClassName("odometer-value").length) };
        },
        note: "滑動模式每次 update 會替每一位數建一條滾輪（duration 2 秒時每條約 30 格），強制排版一次後交給 CSS transition 轉動，轉完再整個重繪；大幅跳動時一個六位數就有一百多個滾輪元素同時移動，成本主要來自這些元素的排版與繪製。計數模式不建滾輪，改由每個實例自己的 requestAnimationFrame 迴圈每秒重繪整個數字約 20 次。無 GPU 的環境掉得特別快。被容器裁掉的格子照樣運作；Odometer 沒有 destroy()，移除元素即可回收。",
      });
      fill(10);
    },
  },
] });
</script>
</body>
</html>
