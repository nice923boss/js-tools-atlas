<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odometer 示範：台灣即時數據牆</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/odometer@0.4.8/themes/odometer-theme-default.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/odometer@0.4.8/themes/odometer-theme-digital.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/odometer@0.4.8/themes/odometer-theme-car.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/odometer@0.4.8/themes/odometer-theme-train-station.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/odometer@0.4.8/themes/odometer-theme-slot-machine.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"各項即時數字為隨機變動的示意資料"}</script>
<style>
  body { background: radial-gradient(80% 70% at 30% 0%, #16212a 0%, var(--bg) 70%); }
  .title { position: fixed; left: 14px; top: 12px; z-index: 40; }
  .title h1 { margin: 0; font-size: 16px; }
  .title p { margin: 0; font-size: 12px; color: var(--muted); }
  .wall { position: fixed; left: 12px; right: 12px; top: 64px; bottom: 48px; display: grid; gap: 10px;
    grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }
  .tile { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px;
    display: flex; flex-direction: column; justify-content: center; gap: 6px; min-width: 0; overflow: hidden; }
  .tile .label { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .tile .label b { color: var(--fg); font-weight: 600; }
  .tile .label span { font-size: 11px; color: var(--muted); }
  .tile .row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tile .unit { font-size: 14px; color: var(--muted); }
  .tile .chg { font: 12px var(--mono); }
  .tile .chg.up { color: #f25c6e; } .tile .chg.down { color: #7bd389; }
  .odometer { font-size: clamp(30px, 5.4vw, 54px); color: var(--fg); }
  .odometer.odometer-theme-default, .odometer.odometer-theme-minimal { font-family: var(--mono); }
  @media (max-width: 640px) {
    .title { top: 52px; }
    .wall { top: 98px; grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .tile { padding: 6px 12px; gap: 2px; }
    .odometer { font-size: 28px; }
  }
</style>
</head>
<body>
<div class="title"><h1>台灣即時數據牆</h1><p>示意資料・每 2 秒更新，數字以滾輪方式轉動</p></div>
<div class="controls">
  <button class="btn" id="theme">主題：預設</button>
  <button class="btn primary" id="jump">大幅跳動</button>
</div>
<div class="wall" id="wall"></div>
<div class="hint">切換主題看不同外觀・大幅跳動讓每一位數一起轉</div>

<script>window.odometerOptions = { auto: false }; // create instances manually</script>
<script src="https://cdn.jsdelivr.net/npm/odometer@0.4.8/odometer.min.js"></script>
<script>
// Odometer: CSS-transition digit ribbons, interchangeable themes, live value updates.
const TILES = [
  { label: "全台即時用電", unit: "萬瓩", value: 3412.5, format: "(,ddd).d", step: () => (Math.random() - 0.45) * 12 },
  { label: "台北捷運今日進站", unit: "人次", value: 1856320, format: "(,ddd)", step: () => 300 + Math.random() * 600 },
  { label: "高鐵今日售出座位", unit: "席", value: 213580, format: "(,ddd)", step: () => 40 + Math.random() * 90 },
  { label: "YouBike 使用中車輛", unit: "輛", value: 18642, format: "(,ddd)", step: () => (Math.random() - 0.5) * 300 },
];
const THEMES = { 預設: "default", 數位: "digital", 汽車里程: "car", 車站看板: "train-station", 老虎機: "slot-machine" };
let theme = "預設";

const wall = document.getElementById("wall");
wall.innerHTML = TILES.map((t, i) =>
  `<div class="tile"><div class="label"><b>${t.label}</b><span>示意資料</span></div>` +
  `<div class="row"><div class="odometer" id="od${i}"></div><span class="unit">${t.unit}</span></div>` +
  `<div class="chg" id="chg${i}">等待更新</div></div>`).join("");

const meters = TILES.map((t, i) => new Odometer({ el: document.getElementById(`od${i}`), value: t.value, format: t.format, theme: THEMES[theme], duration: 1500 }));

function push(scale) {
  TILES.forEach((t, i) => {
    const delta = t.step() * scale;
    const next = t.format.includes(".") ? Math.round((t.value + delta) * 10) / 10 : Math.round(t.value + delta);
    const diff = next - t.value;
    t.value = Math.max(0, next);
    meters[i].update(t.value);
    const chg = document.getElementById(`chg${i}`);
    chg.className = `chg ${diff >= 0 ? "up" : "down"}`;
    chg.textContent = `${diff >= 0 ? "▲" : "▼"} ${Math.abs(diff).toLocaleString(undefined, { maximumFractionDigits: 1 })} 較 2 秒前`;
  });
}
setInterval(() => push(1), 2000);

const themeBtn = document.getElementById("theme");
themeBtn.addEventListener("click", () => {
  const names = Object.keys(THEMES);
  theme = names[(names.indexOf(theme) + 1) % names.length];
  themeBtn.textContent = `主題：${theme}`;
  meters.forEach((m) => { m.el.className = m.el.className.replace(/odometer-theme-[\w-]+/, `odometer-theme-${THEMES[theme]}`); });
});
document.getElementById("jump").addEventListener("click", () => push(37));
</script>
</body>
</html>
