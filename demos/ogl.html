<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OGL 示範：旋臂星系與追光彩帶</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .controls .label { font-size: 12px; align-self: center; padding: 6px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
  .btn { padding: 7px 10px; font-size: 12px; }
  .stat { position: fixed; left: 12px; top: 12px; z-index: 50; font: 12px/1.5 var(--mono); color: var(--muted); padding: 6px 10px; }
  .stat b { color: var(--fg); font-weight: 600; }
  @media (max-width: 520px) { .stat { top: auto; bottom: 48px; } }
</style>
</head>
<body>
<div class="controls" id="palettes"><span class="label">配色</span></div>
<div class="stat panel" id="stat"></div>
<div class="hint">移動滑鼠，彩帶會用彈簧物理追著游標跑</div>

<script type="module">
import { Renderer, Camera, Transform, Program, Mesh, Geometry, Polyline, Vec3, Color } from "https://cdn.jsdelivr.net/npm/ogl@1.0.11/+esm";

const STAR_COUNT = 30000;
const RIBBON_COUNT = 5;
const PALETTES = [
  { key: "milky", label: "銀河", core: "#fff1c4", mid: "#ff8c42", edge: "#4c6cf0", ribbons: ["#f7df1e", "#4cc9f0", "#f72585", "#ffffff", "#9d8cff"] },
  { key: "aurora", label: "極光", core: "#e9fff4", mid: "#7bd389", edge: "#1b6fd8", ribbons: ["#7bd389", "#4cc9f0", "#c8ff8a", "#9d8cff", "#ffffff"] },
  { key: "lava", label: "熔岩", core: "#fff6d0", mid: "#f72585", edge: "#6a1bd8", ribbons: ["#ff8c42", "#f72585", "#f7df1e", "#ff5e5e", "#ffd6a5"] },
];

const renderer = new Renderer({ dpr: Math.min(devicePixelRatio, 2), antialias: true });
const gl = renderer.gl;
gl.clearColor(0.035, 0.04, 0.055, 1);
document.body.prepend(gl.canvas);

// ---------- Galaxy: one draw call of GPU-animated points ----------
const camera = new Camera(gl, { fov: 45, near: 0.1, far: 100 });
camera.position.set(0, 2.5, 6);
const galaxyScene = new Transform();

const base = new Float32Array(STAR_COUNT * 3);   // radius, arm angle, brightness
const offset = new Float32Array(STAR_COUNT * 3); // scatter around the arm
const ARMS = 3;
for (let i = 0; i < STAR_COUNT; i++) {
  const r = Math.pow(Math.random(), 1.7);
  base[i * 3] = r;
  base[i * 3 + 1] = (Math.floor(Math.random() * ARMS) / ARMS) * Math.PI * 2;
  base[i * 3 + 2] = 0.35 + Math.random() * 0.65;
  for (let k = 0; k < 3; k++) {
    const s = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? -1 : 1);
    offset[i * 3 + k] = s * (k === 1 ? 0.35 : 1);
  }
}
const galaxyGeo = new Geometry(gl, {
  position: { size: 3, data: base },
  offset: { size: 3, data: offset },
});

const galaxyProgram = new Program(gl, {
  vertex: /* glsl */ `
    attribute vec3 position;
    attribute vec3 offset;
    uniform mat4 modelViewMatrix;
    uniform mat4 projectionMatrix;
    uniform float uTime;
    uniform float uDPR;
    uniform vec3 uCore;
    uniform vec3 uMid;
    uniform vec3 uEdge;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float r = position.x * 3.2 + 0.04;
      // Differential rotation: inner stars orbit faster than outer ones
      float angle = position.y + r * 1.35 + uTime * 0.55 / (r + 0.45);
      vec3 p = vec3(cos(angle) * r, 0.0, sin(angle) * r);
      p += offset * (0.18 + r * 0.22);
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = (2.5 + position.z * 6.0) * uDPR * (3.4 / -mv.z);
      float t = clamp(r / 3.2, 0.0, 1.0);
      vColor = mix(mix(uCore, uMid, smoothstep(0.0, 0.35, t)), uEdge, smoothstep(0.3, 0.9, t));
      vAlpha = position.z * (1.0 - t * 0.55);
    }`,
  fragment: /* glsl */ `
    precision highp float;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.0, d);
      gl_FragColor = vec4(vColor, a * a * vAlpha);
    }`,
  uniforms: {
    uTime: { value: 0 },
    uDPR: { value: renderer.dpr },
    uCore: { value: new Color() },
    uMid: { value: new Color() },
    uEdge: { value: new Color() },
  },
  transparent: true,
  depthTest: false,
  depthWrite: false,
});
galaxyProgram.setBlendFunc(gl.SRC_ALPHA, gl.ONE);
const galaxy = new Mesh(gl, { mode: gl.POINTS, geometry: galaxyGeo, program: galaxyProgram });
galaxy.frustumCulled = false;
galaxy.rotation.z = 0.18;
galaxy.setParent(galaxyScene);

// ---------- Ribbons: OGL Polyline with spring-follow physics ----------
const ortho = new Camera(gl, { left: -1, right: 1, bottom: -1, top: 1, near: 0.1, far: 10 });
ortho.position.z = 1;
const ribbonScene = new Transform();

const ribbonVertex = /* glsl */ `
  precision highp float;
  attribute vec3 position;
  attribute vec3 next;
  attribute vec3 prev;
  attribute vec2 uv;
  attribute float side;
  uniform mat4 modelViewMatrix;
  uniform mat4 projectionMatrix;
  uniform vec2 uResolution;
  uniform float uDPR;
  uniform float uThickness;
  varying vec2 vUv;
  void main() {
    vUv = uv;
    mat4 mvp = projectionMatrix * modelViewMatrix;
    vec4 current = mvp * vec4(position, 1.0);
    vec2 aspect = vec2(uResolution.x / uResolution.y, 1.0);
    vec2 cur = current.xy / current.w * aspect;
    vec4 n = mvp * vec4(next, 1.0);
    vec4 pv = mvp * vec4(prev, 1.0);
    vec2 dir1 = normalize(cur - pv.xy / pv.w * aspect + 1e-6);
    vec2 dir2 = normalize(n.xy / n.w * aspect - cur + 1e-6);
    vec2 dir = normalize(dir1 + dir2 + 1e-6);
    vec2 normal = vec2(-dir.y, dir.x) / aspect;
    // Taper from the head (uv.y = 0) to the tail
    float taper = 1.0 - pow(uv.y, 1.3) * 0.92;
    normal *= current.w / (uResolution.y / uDPR) * uThickness * taper;
    current.xy -= normal * side;
    gl_Position = current;
  }`;
const ribbonFragment = /* glsl */ `
  precision highp float;
  uniform vec3 uColor;
  varying vec2 vUv;
  void main() {
    float edge = 1.0 - abs(vUv.x * 2.0 - 1.0);
    float fade = 1.0 - vUv.y;
    gl_FragColor = vec4(mix(uColor, vec3(1.0), edge * edge * 0.25), smoothstep(0.0, 0.6, edge) * fade * 0.9);
  }`;

const mouse = new Vec3();
const ribbons = [];
for (let i = 0; i < RIBBON_COUNT; i++) {
  const points = Array.from({ length: 40 }, (_, k) => new Vec3(k * 0.01, 0, 0));
  const line = new Polyline(gl, {
    points,
    vertex: ribbonVertex,
    fragment: ribbonFragment,
    uniforms: {
      uColor: { value: new Color("#ffffff") },
      uThickness: { value: 7 + i * 3 },
    },
  });
  line.program.transparent = true;
  line.program.depthTest = false;
  line.program.setBlendFunc(gl.SRC_ALPHA, gl.ONE);
  line.mesh.frustumCulled = false;
  line.mesh.setParent(ribbonScene);
  ribbons.push({
    line,
    spring: 0.025 + i * 0.012,
    friction: 0.9 - i * 0.012,
    velocity: new Vec3(),
    offset: new Vec3(Math.cos(i * 1.26) * 0.16, Math.sin(i * 1.26) * 0.16, 0),
  });
}

// ---------- Palette switching ----------
let palette = PALETTES[0];
function applyPalette(key) {
  palette = PALETTES.find((p) => p.key === key);
  galaxyProgram.uniforms.uCore.value.set(palette.core);
  galaxyProgram.uniforms.uMid.value.set(palette.mid);
  galaxyProgram.uniforms.uEdge.value.set(palette.edge);
  ribbons.forEach((r, i) => r.line.program.uniforms.uColor.value.set(palette.ribbons[i]));
  document.querySelectorAll("#palettes .btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === key)));
}
const bar = document.getElementById("palettes");
for (const p of PALETTES) {
  const b = document.createElement("button");
  b.className = "btn"; b.type = "button"; b.dataset.k = p.key; b.textContent = p.label;
  b.addEventListener("click", () => applyPalette(p.key));
  bar.append(b);
}
applyPalette("milky");
document.getElementById("stat").innerHTML = `星點 <b>${STAR_COUNT.toLocaleString()}</b>・彩帶 <b>${RIBBON_COUNT}</b>`;

// ---------- Input ----------
let aspect = 1;
const pointer = { x: 0, y: 0, last: -1e9 };
addEventListener("pointermove", (e) => {
  pointer.x = (e.clientX / innerWidth) * 2 - 1;
  pointer.y = -((e.clientY / innerHeight) * 2 - 1);
  pointer.last = performance.now();
});

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  aspect = innerWidth / innerHeight;
  camera.perspective({ aspect, fov: aspect < 1 ? 62 : 45 });
  ortho.orthographic({ left: -aspect, right: aspect, bottom: -1, top: 1 });
  ribbons.forEach((r) => r.line.resize());
}
addEventListener("resize", resize);
resize();

// ---------- Loop ----------
const tmp = new Vec3();
const target = new Vec3();
requestAnimationFrame(function frame(t) {
  requestAnimationFrame(frame);
  const time = t * 0.001;
  const idle = performance.now() - pointer.last > 2000;

  // Mouse target in ortho space; follow a Lissajous path when idle
  if (idle) {
    mouse.set(Math.sin(time * 0.9) * 0.62 * aspect, Math.sin(time * 1.37) * 0.55, 0);
  } else {
    mouse.set(pointer.x * aspect, pointer.y, 0);
  }

  for (const r of ribbons) {
    const pts = r.line.points;
    for (let i = pts.length - 1; i >= 0; i--) {
      if (i === 0) {
        tmp.copy(mouse).add(r.offset).sub(pts[0]).multiply(r.spring);
        r.velocity.add(tmp).multiply(r.friction);
        pts[0].add(r.velocity);
      } else {
        pts[i].lerp(pts[i - 1], 0.6);
      }
    }
    r.line.updateGeometry();
  }

  // Gentle camera parallax that leans toward the cursor
  target.set(mouse.x * 0.6, 2.5 + mouse.y * 0.8, aspect < 1 ? 7.2 : 5.6);
  camera.position.lerp(target, 0.04);
  camera.lookAt([0, 0, 0]);

  galaxyProgram.uniforms.uTime.value = time;
  renderer.render({ scene: galaxyScene, camera });
  renderer.render({ scene: ribbonScene, camera: ortho, clear: false });
});
</script>
</body>
</html>
