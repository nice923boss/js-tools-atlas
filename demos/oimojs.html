<script type="module">
// Oimo.js showcase: seven scenes from the original motor wheel to a broadphase stress ramp.
// Physics runs in Oimo.js 1.0.9 (global OIMO) at a fixed 60 Hz step; three.js only draws the bodies.
// Every scene owns one WebGLRenderer and one OIMO.World and releases both on unmount.
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const { h, fmt } = Showcase;
const STEP = 1 / 60;
const BG = 0x0e1019;
const PALETTE = [0xf7df1e, 0x4cc9f0, 0xf72585, 0x7bd389, 0xff8c42, 0x9d8cff];
const RAD = 180 / Math.PI;
const rnd = (a) => (Math.random() * 2 - 1) * a;
const signed = (v, d = 2) => (v >= 0 ? "+" : "") + v.toFixed(d);

// Free geometries, materials and textures reachable from a scene graph plus explicitly owned resources.
function disposeAll(root, extra) {
  const seen = new Set();
  const free = (x) => { if (x && !seen.has(x) && typeof x.dispose === "function") { seen.add(x); x.dispose(); } };
  const freeMat = (m) => { if (!m) return; for (const v of Object.values(m)) if (v && v.isTexture) free(v); free(m); };
  root.traverse((o) => {
    free(o.geometry);
    [].concat(o.material || []).forEach(freeMat);
    if (o.isInstancedMesh) free(o);
  });
  for (const x of extra) (x && x.isMaterial ? freeMat : free)(x);
}

// One renderer + scene + camera per showcase scene. The camera view is shifted so the
// subject stays centred in the area not covered by the control cluster.
function stage(ctx, o = {}) {
  const host = o.host || ctx.el;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  if (o.shadows) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; }
  const canvas = renderer.domElement;
  canvas.className = "gl";
  host.append(canvas);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(o.bg ?? BG);
  const camera = new THREE.PerspectiveCamera(o.fov ?? 45, 1, 0.1, 400);
  camera.position.set(...(o.pos || [0, 4, 14]));
  const controls = new OrbitControls(camera, canvas);
  controls.target.set(...(o.target || [0, 0, 0]));
  controls.enableDamping = true;
  controls.enablePan = false;
  Object.assign(controls, o.orbit || {});
  let labels = null;
  if (o.labels) {
    labels = new CSS2DRenderer();
    labels.domElement.className = "oi-labels";
    host.append(labels.domElement);
  }
  const frameFns = [], sizeFns = [], extra = [], cache = new Map();
  const S = {
    renderer, scene, camera, controls, canvas, host, width: 1, height: 1, availH: 1, full: 1,
    render: () => renderer.render(scene, camera),
    onFrame(fn) { frameFns.push(fn); },
    onSize(fn) { sizeFns.push(fn); fn(S.width, S.height); },
    own(...xs) { extra.push(...xs); return xs[0]; },
    geo(key, make) { if (!cache.has(key)) cache.set(key, S.own(make())); return cache.get(key); },
    std(color, opts = {}) {
      return S.geo(`m${color}${JSON.stringify(opts)}`, () => new THREE.MeshStandardMaterial({ color, roughness: 0.45, metalness: 0.1, ...opts }));
    },
  };
  let lastKey = "";
  const fit = () => {
    const w = Math.max(1, host.clientWidth), hh = Math.max(1, host.clientHeight);
    const top = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-h")) || 0;
    const bot = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-b")) || 0;
    const key = `${w}x${hh}:${top}:${bot}`;
    if (key === lastKey) return;
    lastKey = key;
    const d = Math.max(-hh * 0.4, Math.min(hh * 0.4, top - bot));
    S.width = w; S.height = hh; S.full = hh + Math.abs(d); S.availH = hh - Math.abs(d);
    renderer.setSize(w, hh);
    if (labels) labels.setSize(w, hh);
    camera.aspect = w / S.full;
    if (d) camera.setViewOffset(w, S.full, 0, d < 0 ? -d : 0, w, hh); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    for (const fn of sizeFns) fn(w, hh);
  };
  fit();
  const timer = new THREE.Timer();
  ctx.raf((t) => {
    fit();
    timer.update(t);
    const dt = Math.max(0, Math.min(timer.getDelta(), 0.1)), time = timer.getElapsed();
    for (const fn of frameFns) fn(dt, time);
    controls.update(dt);
    S.render();
    if (labels) labels.render(scene, camera);
  });
  ctx.onCleanup(() => {
    controls.dispose();
    timer.dispose();
    disposeAll(scene, extra);
    renderer.dispose();
    renderer.forceContextLoss();
    canvas.remove();
    if (labels) labels.domElement.remove();
  });
  return S;
}

// Lights, fog, floor and grid shared by the physics scenes.
function room(S, o = {}) {
  const { scene } = S;
  scene.fog = new THREE.Fog(o.bg ?? BG, 30, 90);
  scene.add(new THREE.HemisphereLight(0xe6ecff, 0x1c1f2c, 1.4));
  const sun = new THREE.DirectionalLight(0xfff2dc, 2.5);
  sun.position.set(7, 15, 10);
  if (S.renderer.shadowMap.enabled) {
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    const [l, r, t, b] = o.shadow || [-12, 12, 12, -12];
    Object.assign(sun.shadow.camera, { left: l, right: r, top: t, bottom: b, near: 1, far: 60 });
    sun.shadow.camera.updateProjectionMatrix();
    sun.shadow.bias = -0.0005;
  }
  scene.add(sun);
  const ground = new THREE.Mesh(S.own(new THREE.PlaneGeometry(160, 160)), S.std(0x1b1f2e, { roughness: 0.95, metalness: 0 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  const grid = new THREE.GridHelper(36, 36, 0x34395a, 0x252a40);
  grid.position.y = 0.003;
  scene.add(ground, grid);
  S.ground = ground;
}

// Camera distance that fits a halfW x halfH box into the visible (uncovered) part of the view.
function fitDistance(S, halfW, halfH, margin = 1.1) {
  const tanV = Math.tan(THREE.MathUtils.degToRad(S.camera.fov) / 2);
  const dv = (halfH * S.full) / (S.availH * tanV);
  const dh = halfW / (tanV * S.camera.aspect);
  return Math.max(dv, dh) * margin;
}
// Keep the subject framed on every resize; returns a function that moves the camera and refits.
function autoFit(S, view, margin = 1.1) {
  const apply = () => {
    const c = S.controls, dir = S.camera.position.clone().sub(c.target);
    if (dir.lengthSq() < 1e-6) dir.set(0, 0.3, 1);
    const d = fitDistance(S, view.w, view.h, margin);
    S.camera.position.copy(c.target).addScaledVector(dir.normalize(), d);
    c.minDistance = d * 0.35;
    c.maxDistance = d * 1.8;
    if (S.scene.fog) { S.scene.fog.near = d * 1.2; S.scene.fog.far = d * 3.2; }
  };
  S.onSize(apply);
  return (pos, target, next) => {
    if (next) Object.assign(view, next);
    if (target) S.controls.target.set(...target);
    if (pos) S.camera.position.set(...pos);
    apply();
  };
}

// Mesh for any Oimo body built from its shape list (box / sphere / cylinder, compound or single).
function shapeGeo(S, s) {
  const k = (v) => Math.round(v * 1000);
  if (s.type === 1) return S.geo(`s${k(s.radius)}`, () => new THREE.SphereGeometry(s.radius, 24, 16));
  if (s.type === 2) return S.geo(`b${k(s.width)}_${k(s.height)}_${k(s.depth)}`, () => new THREE.BoxGeometry(s.width, s.height, s.depth));
  return S.geo(`c${k(s.radius)}_${k(s.height)}`, () => new THREE.CylinderGeometry(s.radius, s.radius, s.height, 24));
}
function bodyMesh(S, body, mat) {
  const g = new THREE.Group();
  for (let s = body.shapes; s; s = s.next) {
    const m = new THREE.Mesh(shapeGeo(S, s), mat);
    m.position.set(s.relativePosition.x, s.relativePosition.y, s.relativePosition.z);
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  }
  return g;
}

// Fixed-step OIMO.World driver. Linked meshes copy body.position / body.orientation after stepping.
function sim(ctx, S, o = {}) {
  const P = { world: null, links: [], ms: 0, time: 0, maxSub: o.maxSub ?? 2, tick: null, post: null };
  P.make = (broadphase = o.broadphase ?? 2) => {
    if (P.world) P.world.clear();
    for (const l of P.links) S.scene.remove(l.mesh);
    P.links.length = 0;
    P.world = new OIMO.World({ timestep: STEP, iterations: o.iterations ?? 8, broadphase, worldscale: 1, random: true, info: false, gravity: [0, -9.8, 0] });
    return P.world;
  };
  P.make();
  P.link = (body, mesh) => { mesh.userData.body = body; P.links.push({ body, mesh }); S.scene.add(mesh); return mesh; };
  P.add = (opts, mat) => { const b = P.world.add(opts); if (mat) P.link(b, bodyMesh(S, b, mat)); return b; };
  P.remove = (body) => {
    const i = P.links.findIndex((l) => l.body === body);
    if (i >= 0) { S.scene.remove(P.links[i].mesh); P.links.splice(i, 1); }
    P.world.removeRigidBody(body);
  };
  P.reset = () => { P.world.clear(); for (const l of P.links) S.scene.remove(l.mesh); P.links.length = 0; };
  let acc = 0;
  S.onFrame((dt) => {
    acc += dt;
    let n = 0, ms = 0;
    while (acc >= STEP && n < P.maxSub) {
      if (P.tick) P.tick(STEP);
      const t0 = performance.now();
      P.world.step();
      ms += performance.now() - t0;
      if (P.post) P.post();
      acc -= STEP; P.time += STEP; n++;
    }
    if (n === P.maxSub) acc = 0;
    if (n) P.ms = P.ms ? P.ms * 0.8 + (ms / n) * 0.2 : ms / n;
    for (const { body: b, mesh } of P.links) {
      const q = b.orientation;
      mesh.position.set(b.position.x, b.position.y, b.position.z);
      mesh.quaternion.set(q.x, q.y, q.z, q.w);
    }
  });
  ctx.onCleanup(() => P.world.clear());
  return P;
}

// Joint anchors given in world space, converted to each (unrotated) body's local frame.
// Compound bodies have already been shifted to their centre of mass by world.add.
function jointAt(P, type, b1, b2, at, extra = {}) {
  const loc = (b) => [at[0] - b.position.x, at[1] - b.position.y, at[2] - b.position.z];
  return P.world.add({ type, body1: b1, body2: b2, pos1: loc(b1), pos2: loc(b2), ...extra });
}

const setNdc = (S, e, v) => {
  const r = S.canvas.getBoundingClientRect();
  return v.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
// Click/tap that is not the end of an orbit drag.
function onTap(ctx, el, fn) {
  let d = null;
  ctx.on(el, "pointerdown", (e) => { d = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  ctx.on(el, "pointerup", (e) => {
    if (d && performance.now() - d.t < 300 && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 6) fn(e);
    d = null;
  });
}
// Tap a dynamic body to push it: body.applyImpulse(point, impulse) at the hit point, then awake().
function pushOnTap(ctx, S, P, speed = 6) {
  const ray = new THREE.Raycaster(), v = new THREE.Vector2();
  onTap(ctx, S.canvas, (e) => {
    ray.setFromCamera(setNdc(S, e, v), S.camera);
    for (const hit of ray.intersectObjects(P.links.map((l) => l.mesh), true)) {
      let o = hit.object, body = null;
      while (o && !body) { body = o.userData.body; o = o.parent; }
      if (!body || !body.isDynamic) continue;
      const d = ray.ray.direction, k = body.mass * speed;
      body.applyImpulse(new OIMO.Vec3(hit.point.x, hit.point.y, hit.point.z), new OIMO.Vec3(d.x * k, (d.y + 0.6) * k, d.z * k));
      body.awake();
      return;
    }
  });
}
function chip(ctx, html) {
  const el = h("div", { class: "oi-chip" });
  el.innerHTML = html;
  ctx.el.append(el);
  let last = html;
  return (next) => { if (next !== last) { last = next; el.innerHTML = next; } };
}
// CSS2D label in world space with a cheap setter that only touches the DOM on change.
function tag(S, html, pos, center) {
  const el = h("div", { class: "oi-lab" });
  el.innerHTML = html;
  const obj = new CSS2DObject(el);
  if (pos) obj.position.set(...pos);
  if (center) obj.center.set(...center);
  S.scene.add(obj);
  let last = html;
  obj.set = (next, hot) => {
    if (next !== last) { last = next; el.innerHTML = next; }
    el.classList.toggle("hot", !!hot);
  };
  return obj;
}
const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), ONE = new THREE.Vector3(1, 1, 1);

Showcase.run({ scenes: [
  {
    id: "motor", title: "馬達轉輪與珠鏈",
    api: "world.add({ type: \"jointHinge\", motor: [speed, force] })・jointBall・limitMotor.setMotor()",
    desc: "原本的招牌示範升級：兩根交叉方塊組成一個複合剛體，由鉸鏈關節的馬達帶著轉；兩側 10 條珠鏈每顆珠子都是球體，用球窩關節一節節串起。左上角即時比較馬達目標轉速與實測角速度，被球卡住時兩者會拉開。",
    hint: "點畫面朝該處射球・拖曳旋轉視角・滑桿調馬達轉速",
    mount(ctx) {
      const AXLE_Y = 4.6, ARM = 7, ARM_T = 0.36, ARM_D = 1.5, MOTOR_FORCE = 400;
      const CHAIN_X = 6.4, BEAM_Y = 8.2, LINKS = 10, GAP = 0.42, BEAD_R = 0.15, WEIGHT_R = 0.34;
      const BALLS = 70, BALL_R = 0.28;
      const S = stage(ctx, { shadows: true, fov: 42, pos: [5, 8.5, 19], target: [0, 4.6, 0],
        orbit: { maxPolarAngle: Math.PI * 0.49, autoRotate: true, autoRotateSpeed: 0.6 } });
      room(S, { shadow: [-11, 11, 13, -8] });
      autoFit(S, { w: 7.8, h: 4.9 });
      const P = sim(ctx, S, { iterations: 10 });
      const W = P.world;
      const frameMat = S.std(0x3a4362, { roughness: 0.5, metalness: 0.4 });
      const addStatic = (size, pos, mat) => P.add({ type: "box", size, pos, move: false, friction: 0.6 }, mat);
      addStatic([60, 1, 60], [0, -0.5, 0]);

      // Wheel: two crossed boxes in one rigid body, hinged to a post behind it, driven by the hinge motor.
      const post = addStatic([0.5, AXLE_Y, 0.4], [0, AXLE_Y / 2, -1.3], frameMat);
      const wheel = W.add({ type: ["box", "box"], size: [ARM, ARM_T, ARM_D, ARM_T, ARM, ARM_D], pos: [0, AXLE_Y, 0], posShape: [0, 0, 0, 0, 0, 0],
        move: true, density: 1, friction: 0.4, restitution: 0.3, neverSleep: true });
      let speed = 2.2, dir = 1;
      const hinge = W.add({ type: "jointHinge", body1: post, body2: wheel, pos1: [0, AXLE_Y / 2, 1.3], pos2: [0, 0, 0], axe1: [0, 0, 1], axe2: [0, 0, 1], motor: [speed, MOTOR_FORCE] });
      const wheelMesh = new THREE.Group();
      for (const [w, hh, color] of [[ARM, ARM_T, 0xf7df1e], [ARM_T, ARM, 0x4cc9f0]]) {
        const m = new THREE.Mesh(S.own(new THREE.BoxGeometry(w, hh, ARM_D)), S.std(color, { roughness: 0.35, metalness: 0.15 }));
        m.castShadow = m.receiveShadow = true;
        wheelMesh.add(m);
      }
      const hub = new THREE.Mesh(S.own(new THREE.CylinderGeometry(0.55, 0.55, ARM_D + 0.2, 32)), S.std(0xf72585, { roughness: 0.3, metalness: 0.3 }));
      hub.rotation.x = Math.PI / 2;
      hub.castShadow = true;
      wheelMesh.add(hub);
      P.link(wheel, wheelMesh);
      const setMotor = () => { hinge.limitMotor.setMotor(speed * dir, MOTOR_FORCE); wheel.awake(); };

      // Bead chains: every bead is a sphere joined to the one above with a ball-and-socket joint.
      const chains = [];
      const beadMesh = new THREE.InstancedMesh(S.own(new THREE.SphereGeometry(BEAD_R, 16, 10)), S.std(0xdfe6f5, { roughness: 0.3, metalness: 0.6 }), 2 * 5 * (LINKS - 1));
      beadMesh.castShadow = true;
      beadMesh.frustumCulled = false;
      S.scene.add(beadMesh);
      const weightGeo = S.own(new THREE.SphereGeometry(WEIGHT_R, 28, 18));
      for (const side of [-1, 1]) {
        const bx = side * CHAIN_X;
        const beam = addStatic([0.4, 0.4, 5.8], [bx, BEAM_Y, 0], frameMat);
        for (const z of [-2.9, 2.9]) addStatic([0.3, BEAM_Y - 0.2, 0.3], [bx, (BEAM_Y - 0.2) / 2, z], frameMat);
        for (let c = 0; c < 5; c++) {
          const z = -2 + c, nodes = [];
          let prev = beam, prevAnchor = [0, -0.2, z], y = BEAM_Y - 0.2;
          for (let k = 0; k < LINKS; k++) {
            const last = k === LINKS - 1, r = last ? WEIGHT_R : BEAD_R, top = last ? r + 0.06 : GAP / 2;
            y -= (k === 0 ? 0 : GAP / 2) + top;
            const body = W.add({ type: "sphere", size: [r], pos: [bx, y, z], move: true, density: last ? 3 : 1, friction: 0.4, restitution: 0.2 });
            W.add({ type: "jointBall", body1: prev, body2: body, pos1: prevAnchor, pos2: [0, top, 0] });
            nodes.push(body);
            prev = body;
            prevAnchor = [0, -GAP / 2, 0];
          }
          const color = PALETTE[(c + (side > 0 ? 3 : 0)) % PALETTE.length];
          const weight = new THREE.Mesh(weightGeo, S.std(color, { emissive: color, emissiveIntensity: 0.25, roughness: 0.25 }));
          weight.castShadow = true;
          S.scene.add(weight);
          chains.push({ nodes, weight, anchor: new THREE.Vector3(bx, BEAM_Y - 0.2, z), home: nodes.map((n) => [n.position.x, n.position.y, n.position.z]) });
        }
      }
      const linePos = new Float32Array(chains.length * LINKS * 6);
      const lineGeo = S.own(new THREE.BufferGeometry());
      lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3));
      S.scene.add(new THREE.LineSegments(lineGeo, S.own(new THREE.LineBasicMaterial({ color: 0x8d97b5 }))));

      // Balls are recycled: the one that waited longest is reused, so the body count stays fixed.
      const ballMesh = new THREE.InstancedMesh(S.own(new THREE.SphereGeometry(BALL_R, 20, 14)), S.std(0xffffff, { roughness: 0.3 }), BALLS);
      ballMesh.castShadow = true;
      ballMesh.frustumCulled = false;
      S.scene.add(ballMesh);
      const balls = [], col = new THREE.Color();
      for (let i = 0; i < BALLS; i++) {
        balls.push({ body: W.add({ type: "sphere", size: [BALL_R], pos: [0, -50 - i, 0], move: true, density: 1, friction: 0.4, restitution: 0.45 }), rest: 0 });
        ballMesh.setColorAt(i, col.setHex(PALETTE[i % PALETTE.length]));
      }
      const dropFromTop = (b, y) => { b.body.resetPosition(rnd(2.7), y, rnd(0.6)); b.rest = 0; };
      const rain = () => balls.forEach((b, i) => dropFromTop(b, 9 + i * 0.22));
      let shotIdx = 0;
      const shootAt = (target) => {

        for (const it of all) {
          const b = it.body, q = b.orientation;
          _m.compose(_p.set(b.position.x, b.position.y, b.position.z), _q.set(q.x, q.y, q.z, q.w), ONE);
          if (it.sphere) spheres.setMatrixAt(ns++, _m); else boxes.setMatrixAt(nb++, _m);
        }
        boxes.count = nb; spheres.count = ns;
        boxes.instanceMatrix.needsUpdate = spheres.instanceMatrix.needsUpdate = true;
        upd = performance.now() - t0;
      });
      const render = S.render;
      S.render = () => { const t0 = performance.now(); render(); const ms = upd + performance.now() - t0; paint = paint ? paint * 0.8 + ms * 0.2 : ms; };
      ctx.select("寬相位", [{ value: "2", label: "SAP" }, { value: "3", label: "DBVT" }, { value: "1", label: "暴力法" }], "2", (v) => { bp = +v; rebuild(); });
      ctx.toggle("休眠", true, (v) => { sleepOn = v; for (const it of all) { it.body.allowSleep = v; if (!v) it.body.awake(); } });
      ctx.ramp({
        label: "剛體", unit: "個", steps: [100, 250, 500, 1000, 1500, 2000, 3000], minFps: 30,
        apply(n) { spawn(n); },
        metrics: () => ({
          接觸點: fmt(P.world.numContactPoints),
          休眠: fmt(all.reduce((a, it) => a + (it.body.sleeping ? 1 : 0), 0)),
          物理: `${P.ms.toFixed(1)} ms`,
          繪圖: `${paint.toFixed(1)} ms`,
          寬相位: BP[bp],
        }),
        note: "每格先跑一次 world.step 再更新 InstancedMesh 並繪製，兩段分開計時。物理段包含寬相位（SAP 排序掃描、DBVT 動態包圍盒樹、或暴力兩兩比對）、窄相位計算接觸點、以及迭代求解器；堆得越高接觸點越多，求解負擔越重。開「休眠」時靜止的島整批跳過。手機與內顯的上限通常明顯較低。",
      });
    },
  },
] });
</script>
