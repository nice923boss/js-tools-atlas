<script>
// ONNX Runtime Web showcase: a real MNIST model plus small ONNX graphs assembled in-page,
// run on the WebAssembly execution provider (single thread: GitHub Pages is not cross-origin isolated).
ort.env.wasm.numThreads = 1;
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/";

const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 16807) % 2147483647) - 1) / 2147483646; }
function fit(canvas) {
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
    canvas.width = Math.max(1, Math.round(w * dpr)); canvas.height = Math.max(1, Math.round(h * dpr));
  }
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h };
}
const median = (a) => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };

// ---------- minimal protobuf writer for ONNX ModelProto ----------
// Field numbers follow onnx.proto (ModelProto, GraphProto, NodeProto, TensorProto, ValueInfoProto).
const Onnx = (() => {
  const te = new TextEncoder();
  const varint = (v) => { let b = BigInt.asUintN(64, BigInt(v)); const o = []; do { let x = Number(b & 0x7fn); b >>= 7n; if (b) x |= 0x80; o.push(x); } while (b); return o; };
  const cat = (parts) => { let n = 0; for (const p of parts) n += p.length; const o = new Uint8Array(n); let k = 0; for (const p of parts) { o.set(p, k); k += p.length; } return o; };
  const key = (f, w) => varint((f << 3) | w);
  const V = (f, v) => Uint8Array.from([...key(f, 0), ...varint(v)]);
  const B = (f, bytes) => cat([Uint8Array.from(key(f, 2)), Uint8Array.from(varint(bytes.length)), bytes]);
  const S = (f, s) => B(f, te.encode(s));
  const F32 = (f, x) => { const o = new Uint8Array(5); o[0] = (f << 3) | 5; new DataView(o.buffer).setFloat32(1, x, true); return o; };
  const DT = { float32: 1, uint8: 2, int32: 6, int64: 7, bool: 9 };
  const api = {
    tensor: (name, dtype, dims, data) => cat([...dims.map((d) => V(1, d)), V(2, DT[dtype]), S(8, name), B(9, new Uint8Array(data.buffer, data.byteOffset, data.byteLength))]),
    value(name, dtype, dims) {
      const parts = [V(1, DT[dtype])];
      if (dims) parts.push(B(2, cat(dims.map((d) => B(1, typeof d === "string" ? S(2, d) : V(1, d))))));
      return cat([S(1, name), B(2, B(1, cat(parts)))]);
    },
    attr(name, v) {
      if (Array.isArray(v)) return cat([S(1, name), ...v.map((x) => V(8, x)), V(20, 7)]);
      if (typeof v === "object") return cat([S(1, name), F32(2, v.f), V(20, 1)]);
      return cat([S(1, name), V(3, v), V(20, 2)]);
    },
    node: (op, inputs, outputs, attrs = {}) => cat([...inputs.map((s) => S(1, s)), ...outputs.map((s) => S(2, s)), S(4, op), ...Object.entries(attrs).map(([k, v]) => B(5, api.attr(k, v)))]),
    model({ nodes, inputs, outputs, inits = [], opset = 17 }) {
      const graph = cat([...nodes.map((n) => B(1, n)), S(2, "g"), ...inits.map((t) => B(5, t)), ...inputs.map((v) => B(11, v)), ...outputs.map((v) => B(12, v))]);
      return cat([V(1, 8), S(2, "js-tools-atlas"), B(7, graph), B(8, cat([S(1, ""), V(2, opset)]))]);
    },
  };
  return api;
})();
const N = Onnx.node;

// Shared MNIST session (scenes 1 and 5).
let mnistPromise;
const mnist = () => (mnistPromise ||= ort.InferenceSession.create("assets/onnx-runtime-web/mnist-12.onnx", { executionProviders: ["wasm"] }));
const softmax = (logits) => { const m = Math.max(...logits); const e = Array.from(logits, (v) => Math.exp(v - m)); const s = e.reduce((a, b) => a + b, 0); return e.map((v) => v / s); };

// Heat colour for tensor cells: dark blue -> cyan -> yellow.
function heat(t) {
  const stops = [[38, 70, 120], [76, 201, 240], [247, 223, 30]];
  const x = Math.max(0, Math.min(1, t)) * 2, i = Math.min(1, Math.floor(x)), f = x - i;
  const c = stops[i].map((v, k) => Math.round(v + (stops[i + 1][k] - v) * f));
  return `rgb(${c})`;
}

Showcase.run({ scenes: [
  {
    id: "digits", title: "手寫數字",
    api: "await ort.InferenceSession.create(url) → session.run({ Input3: tensor })",
    desc: "載入真正的 ONNX 檔（ONNX Model Zoo 的 MNIST CNN，26 KB），每畫一筆就把畫布縮成 28×28 灰階，包成 float32 [1,1,28,28] 的 Tensor 丟進 WebAssembly 執行，輸出 10 個 logits 再做 softmax。",
    hint: "用滑鼠或手指寫數字，邊寫邊辨識",
    mount(ctx) {
      ctx.html(`
        <div class="ox-pad ox-digits">
          <div class="ox-padwrap"><canvas class="ox-draw" width="280" height="280"></canvas><div class="ox-tip">在這裡寫一個 0 到 9 的數字</div></div>
          <div class="ox-side">
            <div class="ox-result"><b class="dg">?</b><div>模型判斷<strong class="cf">載入中…</strong></div></div>
            <div class="ox-bars">${Array.from({ length: 10 }, (_, i) => `<div><i></i><span>${i}</span></div>`).join("")}</div>
            <div class="ox-see"><canvas class="ox-small" width="28" height="28"></canvas><div>模型實際看到的 28×28 影像<br>推論 <b class="ms">-</b> ms・WASM<br>輸入 <b class="io">-</b></div></div>
            <div class="ox-row"><button class="btn primary clear" type="button">清除</button><button class="btn sample" type="button">隨機範例</button></div>
          </div>
        </div>`);
      const pad = ctx.$(".ox-draw"), pg = pad.getContext("2d", { willReadFrequently: true });
      const sg = ctx.$(".ox-small").getContext("2d");
      const work = document.createElement("canvas"); work.width = work.height = 28;
      const wg = work.getContext("2d", { willReadFrequently: true });
      const bars = [...ctx.$(".ox-bars").children];
      let session, inName, outName, busy = false, dirty = false;

      const clearPad = () => {
        pg.fillStyle = "#000"; pg.fillRect(0, 0, 280, 280);
        sg.clearRect(0, 0, 28, 28);
        ctx.$(".dg").textContent = "?";
        ctx.$(".cf").textContent = session ? "請寫一個數字" : "載入中…";
        bars.forEach((b) => { b.classList.remove("top"); b.firstChild.style.height = "2%"; });
        ctx.$(".ox-tip").style.display = "";
      };
      // MNIST-style preprocessing: crop the ink, fit it in 20x20, centre it in 28x28.
      const toInput = () => {
        const { data } = pg.getImageData(0, 0, 280, 280);
        let x0 = 280, y0 = 280, x1 = -1, y1 = -1;
        for (let y = 0; y < 280; y++) for (let x = 0; x < 280; x++) {
          if (data[(y * 280 + x) * 4] > 30) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
        }
        if (x1 < 0) return null;
        const w = x1 - x0 + 1, h = y1 - y0 + 1, s = 20 / Math.max(w, h);
        wg.fillStyle = "#000"; wg.fillRect(0, 0, 28, 28);
        wg.imageSmoothingQuality = "high";
        wg.drawImage(pad, x0, y0, w, h, 14 - (w * s) / 2, 14 - (h * s) / 2, w * s, h * s);
        const px = wg.getImageData(0, 0, 28, 28);
        sg.putImageData(px, 0, 0);
        const input = new Float32Array(784);
        for (let i = 0; i < 784; i++) input[i] = px.data[i * 4] / 255;
        return input;
      };
      const predict = async () => {
        if (!session || busy) { dirty = !!session; return; }
        busy = true; dirty = false;
        const input = toInput();
        if (input) {
          const t0 = performance.now();
          const out = await session.run({ [inName]: new ort.Tensor("float32", input, [1, 1, 28, 28]) });
          const ms = performance.now() - t0;
          if (!ctx.active) return;
          const probs = softmax(out[outName].data);
          const best = probs.indexOf(Math.max(...probs));
          ctx.$(".dg").textContent = best;
          ctx.$(".cf").textContent = `信心 ${(probs[best] * 100).toFixed(1)}%`;
          ctx.$(".ms").textContent = ms.toFixed(1);
          bars.forEach((b, i) => { b.classList.toggle("top", i === best); b.firstChild.style.height = `${Math.max(2, probs[i] * 100)}%`; });
        }
        busy = false;
        if (dirty) requestAnimationFrame(predict);
      };
      let drawing = false, last = null;
      const pos = (e) => { const r = pad.getBoundingClientRect(); return { x: ((e.clientX - r.left) / r.width) * 280, y: ((e.clientY - r.top) / r.height) * 280 }; };
      const stroke = (a, b) => {
        pg.strokeStyle = "#fff"; pg.lineWidth = 19; pg.lineCap = pg.lineJoin = "round";
        pg.shadowColor = "rgba(255,255,255,.6)"; pg.shadowBlur = 6;
        pg.beginPath(); pg.moveTo(a.x, a.y); pg.lineTo(b.x, b.y); pg.stroke();
        pg.shadowBlur = 0;
      };
      ctx.on(pad, "pointerdown", (e) => { drawing = true; last = pos(e); stroke(last, last); ctx.$(".ox-tip").style.display = "none"; pad.setPointerCapture(e.pointerId); predict(); });
      ctx.on(pad, "pointermove", (e) => { if (!drawing) return; const p = pos(e); stroke(last, p); last = p; predict(); });
      const end = () => { if (drawing) { drawing = false; predict(); } };
      ctx.on(pad, "pointerup", end);
      ctx.on(pad, "pointercancel", end);
      const r = rng(9);
      const drawSample = (d = Math.floor(r() * 10)) => {
        clearPad();
        ctx.$(".ox-tip").style.display = "none";
        pg.save();
        pg.translate(140, 150); pg.rotate((r() - 0.5) * 0.35);
        pg.fillStyle = pg.strokeStyle = "#fff"; pg.lineWidth = 6;
        pg.textAlign = "center"; pg.textBaseline = "middle";
        pg.font = `${170 + Math.round(r() * 40)}px "Segoe Print", "Comic Sans MS", "Bradley Hand", cursive`;
        pg.fillText(String(d), 0, 0); pg.strokeText(String(d), 0, 0);
        pg.restore();
        predict();
      };
      ctx.on(ctx.$(".clear"), "click", clearPad);
      ctx.on(ctx.$(".sample"), "click", () => drawSample());

      const layout = ({ width: w, height: h }) => {
        const stack = w < 540;
        ctx.$(".ox-digits").classList.toggle("stack", stack);
        ctx.el.classList.toggle("scroll", stack);
        const size = Math.floor(stack ? Math.min(w - 24, 300) : Math.min(w - 300, h - 24, 460));
        pad.style.width = pad.style.height = `${Math.max(160, size)}px`;
      };
      layout(ctx.size());
      ctx.onResize(layout);
      clearPad();
      mnist().then((s) => {
        if (!ctx.active) return;
        session = s;
        [inName] = s.inputNames; [outName] = s.outputNames;
        const m = s.inputMetadata[0];
        ctx.$(".io").textContent = `${inName} ${m.type} [${m.shape.join(",")}]`;
        drawSample(3);
      }, (err) => { ctx.$(".cf").textContent = `載入失敗：${err.message}`; throw err; });
    },
  },
  {
    id: "filter", title: "即時濾鏡",
    api: "Tensor.fromImage(imageData) → run → tensor.toImageData()",
    desc: "頁面內用 JS 組出一個 Conv（group=3 逐通道卷積）加 Clip 的 ONNX 模型，高寬宣告成符號維度 H、W，所以視窗大小改變也不用重建 session。卷積核本身是模型輸入，拖強度滑桿就是換一個輸入張量。左邊是動畫原圖，右邊是每一幀推論的輸出。",
    hint: "切換卷積核・拖強度・改變視窗大小，[1,3,H,W] 會跟著變",
    mount(ctx) {
      ctx.html(`
        <div class="ox-pad ox-duo">
          <div class="ox-card src"><span class="ox-tag">輸入 ImageData</span></div>
          <div class="ox-card dst"><span class="ox-tag shape">輸出</span><div class="ox-timing">-</div></div>
        </div>`);
      const embed3 = (k3) => { const k = new Array(25).fill(0); for (let j = 0; j < 3; j++) for (let i = 0; i < 3; i++) k[(j + 1) * 5 + i + 1] = k3[j * 3 + i]; return k; };
      const g1 = [1, 4, 6, 4, 1];
      const KERNELS = [
        { label: "高斯模糊", k: g1.flatMap((a) => g1.map((b) => (a * b) / 256)) },
        { label: "銳化", k: embed3([0, -1, 0, -1, 5, -1, 0, -1, 0]) },
        { label: "浮雕", k: embed3([-2, -1, 0, -1, 1, 1, 0, 1, 2]) },
        { label: "邊緣", k: embed3([-1, -1, -1, -1, 8, -1, -1, -1, -1]), abs: true },
      ];
      const ID = embed3([0, 0, 0, 0, 1, 0, 0, 0, 0]);
      const build = (abs) => Onnx.model({
        nodes: [N("Conv", ["x", "w", "b"], ["c"], { group: 3, pads: [2, 2, 2, 2] }), ...(abs ? [N("Abs", ["c"], ["a"])] : []), N("Clip", [abs ? "a" : "c", "lo", "hi"], ["y"])],
        inputs: [Onnx.value("x", "float32", [1, 3, "H", "W"]), Onnx.value("w", "float32", [3, 1, 5, 5]), Onnx.value("b", "float32", [3])],
        outputs: [Onnx.value("y", "float32", [1, 3, "H", "W"])],
        inits: [Onnx.tensor("lo", "float32", [], new Float32Array([0])), Onnx.tensor("hi", "float32", [], new Float32Array([1]))],
      });

        ctx.$(".p95").textContent = Showcase.fmtMs(sorted[189]);
        const im = s.inputMetadata[0], om = s.outputMetadata[0];
        ctx.$(".ox-meta").innerHTML = `<span>inputMetadata</span> ${im.name}・${im.type}・[${im.shape.join(",")}]<br><span>outputMetadata</span> ${om.name}・${om.type}・[${om.shape.join(",")}]`;
        draw();
      };
      ctx.button("再量一次", () => measure(null));
      caps();
      // The first run after creating a fresh session shows the cold-start cost (kernel setup, allocations).
      (async () => {
        const s = await mnist();
        const x = new ort.Tensor("float32", new Float32Array(784), [1, 1, 28, 28]);
        const fresh = await ort.InferenceSession.create("assets/onnx-runtime-web/mnist-12.onnx");
        const t0 = performance.now(); await fresh.run({ [s.inputNames[0]]: x }); const cold = performance.now() - t0;
        await fresh.release();
        if (ctx.active) await measure(cold);
      })();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "session.run({ x: new ort.Tensor('float32', data, [batch, 784]) })",
    desc: "一個 784→256→128→10 的全連接網路（MatMul + Add + Relu，權重隨機），batch 維度宣告成符號 \"batch\"，同一個 session 吃 1 到 16384 筆。每一級先暖機一次，再量一次完整 run，換算 GFLOPS 與每秒樣本數。",
    hint: "選網路寬度後按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="ox-stress ox-card"><canvas></canvas></div>`);
      const NETS = {
        s: { label: "小 784→64→10", sizes: [784, 64, 10] },
        m: { label: "中 784→256→128→10", sizes: [784, 256, 128, 10] },
        l: { label: "大 784→1024→1024→10", sizes: [784, 1024, 1024, 10] },
      };
      let key = "m", session = null, flops = 0;
      const build = async () => {
        const sz = NETS[key].sizes, r = rng(5), nodes = [], inits = [];
        let prev = "x";
        flops = 0;
        for (let i = 1; i < sz.length; i++) {
          const a = sz[i - 1], b = sz[i], sc = Math.sqrt(2 / a);
          inits.push(Onnx.tensor(`W${i}`, "float32", [a, b], Float32Array.from({ length: a * b }, () => (r() - 0.5) * 2 * sc)));
          inits.push(Onnx.tensor(`b${i}`, "float32", [b], new Float32Array(b)));
          nodes.push(N("MatMul", [prev, `W${i}`], [`m${i}`]), N("Add", [`m${i}`, `b${i}`], [`z${i}`]));
          prev = `z${i}`;
          if (i < sz.length - 1) { nodes.push(N("Relu", [prev], [`h${i}`])); prev = `h${i}`; }
          flops += 2 * a * b;
        }
        nodes.push(N("Identity", [prev], ["y"]));
        const old = session; session = null;
        if (old) await old.release();
        session = await ort.InferenceSession.create(Onnx.model({ nodes, inits, inputs: [Onnx.value("x", "float32", ["batch", 784])], outputs: [Onnx.value("y", "float32", ["batch", 10])] }));
      };
      ctx.controls.classList.add("bottom");
      ctx.select("網路", Object.entries(NETS).map(([value, n]) => ({ value, label: n.label })), key, (v) => { key = v; build(); });
      ctx.onCleanup(() => session && session.release());
      const ready = build();
      const r = rng(11);
      const b = ctx.bench({
        label: "batch", unit: "筆", sizes: [1, 16, 128, 1024, 4096, 16384],
        async prepare(n) {
          await ready;
          while (!session) await ctx.frame(1);
          const x = new ort.Tensor("float32", Float32Array.from({ length: n * 784 }, () => r()), [n, 784]);
          await session.run({ x });
          return x;
        },
        async run(n, x) {
          await session.run({ x });
        },
        note: "全部在 wasm EP 單執行緒上計算（此頁無法開多執行緒）。batch 小時固定開銷（JS 與 wasm 之間的資料搬移、排程）占大部分時間，batch 變大後才接近運算極限。",
      });
      const cv = ctx.$("canvas");
      ctx.raf(() => {
        const { g, w, h } = fit(cv);
        g.clearRect(0, 0, w, h);
        const left = w > 420 ? 16 : 10;
        g.fillStyle = cssVar("--fg"); g.font = `600 14px ${cssVar("--font")}`;
        g.textBaseline = "top"; g.textAlign = "left";
        g.fillText("運算吞吐量（GFLOPS）", left, 14);
        g.font = `12px ${cssVar("--mono")}`; g.fillStyle = cssVar("--muted");
        g.fillText(`${NETS[key].label}・每筆 ${Showcase.fmtCompact(flops)} FLOP`, left, 36);
        const res = b.results;
        if (!res.length) { g.fillText("尚未測試", left, 64); return; }
        const gf = res.map((x) => (x.n * flops) / (x.ms / 1000) / 1e9);
        const max = Math.max(...gf, 0.001);
        const label = (x, i) => `${gf[i].toFixed(2)} GFLOPS・${Showcase.fmtCompact(x.n / (x.ms / 1000))}/秒`;
        const labelW = Math.max(...res.map((x, i) => g.measureText(label(x, i)).width));
        const top = 66, rowH = Math.min(44, (h - top - 20) / 6);
        res.forEach((x, i) => {
          const y = top + i * rowH;
          const bw = Math.max(2, (gf[i] / max) * (w - left * 2 - 104 - labelW));
          g.fillStyle = cssVar("--muted"); g.textBaseline = "middle";
          g.fillText(`batch ${Showcase.fmtCompact(x.n)}`, left, y + rowH / 2);
          g.fillStyle = x.ms <= 1000 ? "#7bd389" : x.ms <= 2000 ? "#ff8c42" : "#f72585";
          g.fillRect(left + 86, y + rowH * 0.22, bw, rowH * 0.56);
          g.fillStyle = cssVar("--fg");
          g.fillText(label(x, i), left + 92 + bw, y + rowH / 2);
        });
      });
    },
  },
] });
</script>
</body>
