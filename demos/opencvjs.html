<script>
(() => {
// The page keeps its own `cv` binding inside this closure so it never shadows the global that opencv.js defines.
// OpenCV.js showcase: eight scenes over one shared WebAssembly build. Every cv object is tracked
// so each panel can prove that Mats are deleted after every recompute and on scene exit.
const { h, fmt, fmtMs } = Showcase;
// 5.0.0-release.1 fails to compile its wasm in current Chromium ("unknown type form"), so this page uses 4.12.0.
const CV_URL = "https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.12.0-release.1/dist/opencv.js";
const CV_BYTES = 10872779;
const PHOTOS = [{ value: 7, label: "母獅" }, { value: 6, label: "水母" }, { value: 4, label: "巴哥犬" }, { value: 1, label: "峽灣" },
  { value: 5, label: "瀑布" }, { value: 8, label: "海象" }, { value: 3, label: "公路" }, { value: 2, label: "峽谷" }];
const photoURL = (n) => `_shared/img/photo-${n}.jpg`;
let cv = null, cvPromise = null, got = 0, LIVE = 0;

// ---------- loading: one gated download shared by all scenes ----------
async function fetchCV() {
  got = 0;
  const res = await fetch(CV_URL);
  if (!res.ok) throw new Error(`OpenCV.js 下載失敗（HTTP ${res.status}）`);
  const reader = res.body.getReader(), parts = [];
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value);
    got += value.length;
  }
  const url = URL.createObjectURL(new Blob(parts, { type: "text/javascript" }));
  try {
    await new Promise((ok, fail) => {
      const tag = document.createElement("script");
      tag.src = url;
      tag.onload = ok;
      tag.onerror = () => fail(new Error("opencv.js 執行失敗"));
      document.head.append(tag);
    });
  } finally { URL.revokeObjectURL(url); }
  let m = window.cv;
  if (m instanceof Promise) m = await m;
  else if (!m.Mat) await new Promise((r) => (m.onRuntimeInitialized = r));
  // Never return the module from an async function: Emscripten modules carry a .then() and would resolve forever.
  cv = m;
}

async function ensureCV(ctx) {
  if (cv) return;
  if (!cvPromise) {
    await ctx.gate({
      icon: "👁️", title: "OpenCV.js 影像處理實驗室", button: "載入 OpenCV", tags: ["約 11 MB", "WebAssembly", "OpenCV 4.12"],
      desc: "下載 OpenCV 4.12 的 WebAssembly 版（約 11 MB），八個場景共用，只需下載一次。",
    });
    cvPromise ??= fetchCV().catch((e) => {
      cvPromise = null;
      throw /[一-鿿]/.test(e.message) ? e : new Error(`OpenCV.js 載入失敗：${e.message}`);
    });
  }
  const st = ctx.status("下載 OpenCV.js…");
  const paint = () => {
    st.progress(got / CV_BYTES);
    st.text(got < CV_BYTES ? `下載 OpenCV.js… ${(got / 1e6).toFixed(1)} / ${(CV_BYTES / 1e6).toFixed(1)} MB` : "編譯 WebAssembly…");
  };
  paint();
  const id = ctx.interval(paint, 120);
  try {
    await new Promise((resolve, reject) => {
      cvPromise.then(() => resolve(), reject);
      ctx.signal.addEventListener("abort", () => reject(new DOMException("aborted", "AbortError")), { once: true });
    });
  } finally {
    clearInterval(id);
    st.done();
  }
}

// ---------- object tracking ----------
const own = (o) => { LIVE++; return o; };
const drop = (o) => { if (o) { o.delete(); LIVE--; } return null; };
function scope() {
  const list = [];
  const S = (o) => { list.push(o); return own(o); };
  S.free = () => { for (const o of list.splice(0)) drop(o); };
  return S;
}
const heapMB = () => (cv && cv.HEAP8 ? cv.HEAP8.buffer.byteLength / 1048576 : 0);
const memHTML = (n) => `存活 cv 物件 <b>${LIVE}</b>・WASM 記憶體 <b>${heapMB().toFixed(0)} MB</b>・已重算 <b>${n}</b> 次`;
const cvErr = (e) => (typeof e === "number" && cv.exceptionFromPtr ? cv.exceptionFromPtr(e).msg : e && e.message) || String(e);

// ---------- image helpers ----------
const imgCache = new Map();
function loadImg(src) {
  if (!imgCache.has(src)) {
    imgCache.set(src, new Promise((ok, fail) => {
      const img = new Image();
      img.onload = () => ok(img);
      img.onerror = () => { imgCache.delete(src); fail(new Error(`圖片載入失敗：${src}`)); };
      img.src = src;
    }));
  }
  return imgCache.get(src);
}
const SCR = document.createElement("canvas");
const SCR2D = SCR.getContext("2d", { willReadFrequently: true });
// Draw an image, video or canvas into a new tracked RGBA Mat whose longest side is at most max.
function matFrom(src, max, S) {
  const w = src.naturalWidth || src.videoWidth || src.width, hh = src.naturalHeight || src.videoHeight || src.height;
  const k = Math.min(1, max / Math.max(w, hh));
  SCR.width = Math.round(w * k); SCR.height = Math.round(hh * k);
  SCR2D.drawImage(src, 0, 0, SCR.width, SCR.height);
  return S(cv.imread(SCR));
}
function canvas(w, hh) { const c = document.createElement("canvas"); c.width = w; c.height = hh; return c; }
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function fitInto(frame, box, w, hh) {
  const bw = box.clientWidth - 8, bh = box.clientHeight - 8;
  if (!w || !hh || bw <= 0 || bh <= 0) return;
  const k = Math.min(bw / w, bh / hh);
  frame.style.width = `${Math.floor(w * k)}px`;
  frame.style.height = `${Math.floor(hh * k)}px`;
}
function watch(ctx, el, fn) { const ro = new ResizeObserver(() => ctx.active && fn()); ro.observe(el); ctx.onCleanup(() => ro.disconnect()); }
function scheduler(fn) { let pend = false; return () => { if (pend) return; pend = true; requestAnimationFrame(() => { pend = false; fn(); }); }; }
// Panel slider rows: defs are [key, label, min, max, step]; show(key, value) formats the readout.
function slidersHTML(defs, vals, show = (k, v) => v) {
  return defs.map(([k, label, min, max, step]) =>
    `<label class="cv-sl"><span>${label}</span><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${vals[k]}"><b>${show(k, vals[k])}</b></label>`).join("");
}
function bindSliders(ctx, panel, vals, show, onChange) {
  ctx.on(panel, "input", (e) => {
    const k = e.target.dataset.k;
    if (!k) return;
    vals[k] = Number(e.target.value);
    if (e.target.nextElementSibling) e.target.nextElementSibling.textContent = show(k, vals[k]);
    onChange(k);
  });
}
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const scalar = (hex, a = 255) => { const n = parseInt(hex.slice(1), 16); return new cv.Scalar((n >> 16) & 255, (n >> 8) & 255, n & 255, a); };
function hueColor(i) {
  const hh = ((i * 47) % 360) / 60, f = (n) => { const k = (n + hh) % 6; return Math.round(255 * (1 - 0.85 * Math.max(0, Math.min(1, Math.min(k, 4 - k))))); };
  return new cv.Scalar(f(5), f(3), f(1), 255);
}
const ptsMat = (S, pts) => S(cv.matFromArray(pts.length, 1, cv.CV_32FC2, pts.flat()));

// ---------- scene 1: the original before/after lab ----------
const MODES = {
  canny: {
    name: "Canny 邊緣偵測", desc: "灰階化、高斯模糊後用 Canny 找出亮度劇烈變化的邊緣，再畫成霓虹線。", photo: 7,
    sliders: [["blur", "模糊核", 1, 9, 2], ["lo", "低門檻", 10, 200, 1], ["hi", "高門檻", 30, 300, 1], ["line", "線寬", 1, 4, 1], ["dim", "背景亮度", 0, 60, 1]],
    init: { blur: 5, lo: 30, hi: 90, line: 2, dim: 22 },
  },
  contours: {
    name: "輪廓偵測", desc: "二值化（門檻 0 代表 Otsu 自動門檻），開運算去雜點後用 findContours 找出區塊輪廓並依面積過濾。", photo: 4,
    sliders: [["th", "門檻", 0, 250, 1], ["area", "最小面積‰", 1, 30, 1], ["inv", "反轉黑白", 0, 1, 1]],
    init: { th: 0, area: 1, inv: 0 },
  },
  hsv: {
    name: "HSV 色彩篩選", desc: "轉成 HSV 後用 inRange 依色相、飽和度篩選像素，其餘轉灰階。", photo: 6,
    sliders: [["h", "色相中心", 0, 179, 1], ["w", "色相寬度", 4, 60, 1], ["s", "最低飽和", 0, 255, 1], ["v", "最低亮度", 0, 255, 1]],
    init: { h: 14, w: 14, s: 90, v: 50 }, presets: [["橘", 14], ["黃", 28], ["綠", 60], ["青", 90], ["藍", 110], ["紅", 0]],
  },
  cartoon: {
    name: "卡通化濾鏡", desc: "雙邊濾波抹平色塊、自適應門檻產生墨線，色彩量化後合成插畫風。", photo: 8,
    sliders: [["n", "平滑次數", 1, 6, 1], ["block", "線條範圍", 3, 21, 2], ["c", "線條淡化", 1, 15, 1], ["q", "色階數", 3, 16, 1]],
    init: { n: 3, block: 11, c: 8, q: 6 },
  },
};
const showParam = (k, v) => (k === "inv" ? (v ? "開" : "關") : k === "th" && v === 0 ? "自動" : v);

const PROC = {
  canny(src, p, S) {
    const gray = S(new cv.Mat()), edges = S(new cv.Mat()), dst = S(new cv.Mat());
    const neon = S(new cv.Mat(src.rows, src.cols, cv.CV_8UC4, new cv.Scalar(76, 201, 240, 255)));
    const k = p.blur % 2 ? p.blur : p.blur + 1, hi = Math.max(p.lo + 1, p.hi);
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(k, k), 0);
    cv.Canny(gray, edges, p.lo, hi);
    if (p.line > 1) cv.dilate(edges, edges, S(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(p.line, p.line))));
    src.convertTo(dst, -1, p.dim / 100, 0);
    neon.copyTo(dst, edges);
    return { out: dst, stat: [`${((cv.countNonZero(edges) / (edges.rows * edges.cols)) * 100).toFixed(1)}%`, "邊緣像素比例"],
      code: [`cv.<u>GaussianBlur</u>(gray, gray, new cv.Size(<em>${k}</em>, <em>${k}</em>), 0)`, `cv.<u>Canny</u>(gray, edges, <em>${p.lo}</em>, <em>${hi}</em>)`,
        ...(p.line > 1 ? [`cv.<u>dilate</u>(edges, edges, kernel${p.line}x${p.line})`] : []), `neon.<u>copyTo</u>(dst, edges)`] };
  },
  contours(src, p, S) {
    const gray = S(new cv.Mat()), bin = S(new cv.Mat()), dst = S(new cv.Mat()), fill = S(new cv.Mat()), hier = S(new cv.Mat()), all = S(new cv.MatVector());
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, gray, new cv.Size(7, 7), 0);
    const type = (p.inv ? cv.THRESH_BINARY_INV : cv.THRESH_BINARY) + (p.th === 0 ? cv.THRESH_OTSU : 0);
    const used = cv.threshold(gray, bin, p.th, 255, type);
    cv.morphologyEx(bin, bin, cv.MORPH_OPEN, S(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(7, 7))));
    cv.findContours(bin, all, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
    const minArea = (src.rows * src.cols * p.area) / 1000, keep = [];
    for (let i = 0; i < all.size(); i++) { const c = S(all.get(i)); if (cv.contourArea(c) >= minArea) keep.push(i); }
    src.convertTo(dst, -1, 0.35, 0);
    dst.copyTo(fill);
    const t = Math.max(2, Math.round(src.cols / 320));
    keep.forEach((idx, n) => {
      cv.drawContours(fill, all, idx, hueColor(n), cv.FILLED, cv.LINE_AA);
      cv.drawContours(dst, all, idx, hueColor(n), t, cv.LINE_AA);
    });
    cv.addWeighted(dst, 0.6, fill, 0.4, 0, dst);
    return { out: dst, stat: [`${keep.length} 個`, `輪廓（門檻 ${Math.round(used)}）`],
      code: [`cv.<u>threshold</u>(gray, bin, <em>${p.th}</em>, 255, ${p.inv ? "BINARY_INV" : "BINARY"}${p.th === 0 ? " + OTSU" : ""})`,
        `cv.<u>morphologyEx</u>(bin, bin, cv.MORPH_OPEN, kernel)`, `cv.<u>findContours</u>(bin, list, hier, cv.RETR_LIST, ...)`,
        `cv.<u>contourArea</u>(c) >= <em>${Math.round(minArea)}</em>  // ${all.size()} 個中保留 ${keep.length} 個`] };
  },
  hsv(src, p, S) {
    const rgb = S(new cv.Mat()), hsv = S(new cv.Mat()), mask = S(new cv.Mat()), mask2 = S(new cv.Mat()), gray = S(new cv.Mat()), dst = S(new cv.Mat());
    const ranges = [];
    let lo = p.h - p.w, hi = p.h + p.w;
    if (lo < 0) { ranges.push([180 + lo, 179]); lo = 0; }
    if (hi > 179) { ranges.push([0, hi - 180]); hi = 179; }
    ranges.unshift([lo, hi]);
    cv.cvtColor(src, rgb, cv.COLOR_RGBA2RGB);
    cv.cvtColor(rgb, hsv, cv.COLOR_RGB2HSV);
    ranges.forEach(([a, b], i) => {
      const l = S(new cv.Mat(src.rows, src.cols, cv.CV_8UC3, new cv.Scalar(a, p.s, p.v, 0)));
      const u = S(new cv.Mat(src.rows, src.cols, cv.CV_8UC3, new cv.Scalar(b, 255, 255, 0)));
      cv.inRange(hsv, l, u, i ? mask2 : mask);
      if (i) cv.bitwise_or(mask, mask2, mask);
    });
    cv.morphologyEx(mask, mask, cv.MORPH_OPEN, S(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(5, 5))));
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.cvtColor(gray, dst, cv.COLOR_GRAY2RGBA);
    dst.convertTo(dst, -1, 0.55, 0);
    src.copyTo(dst, mask);
    return { out: dst, stat: [`${((cv.countNonZero(mask) / (mask.rows * mask.cols)) * 100).toFixed(1)}%`, "符合條件的像素"],
      code: [`cv.<u>cvtColor</u>(rgb, hsv, cv.COLOR_RGB2HSV)`,
        ...ranges.map(([a, b]) => `cv.<u>inRange</u>(hsv, [<em>${a}</em>,<em>${p.s}</em>,<em>${p.v}</em>], [<em>${b}</em>,255,255], mask)`),
        `src.<u>copyTo</u>(grayDst, mask)`] };

  cartoon(src, p, S) {
    const rgb = S(new cv.Mat()), small = S(new cv.Mat()), tmp = S(new cv.Mat()), color = S(new cv.Mat()), gray = S(new cv.Mat());

    for (let i = 0; i < p.n; i++) { cv.bilateralFilter(small, tmp, 7, 40, 7); tmp.copyTo(small); }

    cv.cvtColor(edges, edges3, cv.COLOR_GRAY2RGB);
    cv.bitwise_and(color, edges3, color);
    cv.cvtColor(color, dst, cv.COLOR_RGB2RGBA);
    return { out: dst, stat: [`${p.q ** 3}`, "可用顏色數"],
      code: [`cv.<u>bilateralFilter</u>(small, tmp, 7, 40, 7)  // ×<em>${p.n}</em>`, `cv.<u>LUT</u>(color, lut, color)  // ${p.q} 階`,
        `cv.<u>adaptiveThreshold</u>(gray, edges, 255, MEAN_C, BINARY, <em>${p.block}</em>, <em>${p.c}</em>)`, `cv.<u>bitwise_and</u>(color, edges, color)`] };
  },
};

function mountCompare(ctx) {
  ctx.html(`<div class="cv-wrap"><div class="cv-view"><div class="cv-frame"><canvas data-src></canvas><canvas class="cv-dst" data-dst></canvas>
    <div class="cv-split"></div><span class="cv-tag">原圖</span><span class="cv-tag r">OpenCV 處理後</span></div><div class="cv-msg"></div></div>
    <aside class="cv-panel"></aside></div>`);
  const view = ctx.$(".cv-view"), frame = ctx.$(".cv-frame"), panel = ctx.$(".cv-panel"), msg = ctx.$(".cv-msg");
  const srcC = ctx.$("[data-src]"), dstC = ctx.$("[data-dst]"), sctx = srcC.getContext("2d", { willReadFrequently: true });
  const params = Object.fromEntries(Object.entries(MODES).map(([k, m]) => [k, { ...m.init }]));
  let mode = "canny", runs = 0, picked = null, stream = null, video = null;
  const keys = Object.keys(MODES);

  const build = () => {
    const m = MODES[mode];
    panel.innerHTML = `<h4>${m.name}</h4><p>${m.desc}</p>${m.presets ? `<div class="cv-presets">${m.presets.map(([t, v]) => `<button class="btn" data-hue="${v}">${t}</button>`).join("")}</div><div class="cv-hue"><i></i></div>` : ""}
      ${slidersHTML(m.sliders, params[mode], showParam)}
      <div class="cv-stats"><div class="cv-stat"><b data-s1>-</b><span data-s1l>-</span></div><div class="cv-stat"><b data-s2>-</b><span>處理時間</span></div></div>
      <pre class="cv-code"></pre><div class="cv-mem"></div>`;
    hueBar();
  };
  const hueBar = () => {
    const el = panel.querySelector(".cv-hue i");
    if (el) { const { h: hc, w } = params.hsv; el.style.left = `${((hc - w) / 180) * 100}%`; el.style.width = `${((2 * w) / 180) * 100}%`; }
  };
  const process = () => {
    if (!srcC.width || !ctx.active) return;
    const S = scope();
    try {
      const t0 = performance.now();
      const r = PROC[mode](S(cv.imread(srcC)), params[mode], S);
      cv.imshow(dstC, r.out);
      const ms = performance.now() - t0;
      runs++;
      panel.querySelector("[data-s1]").textContent = r.stat[0];
      panel.querySelector("[data-s1l]").textContent = r.stat[1];
      panel.querySelector("[data-s2]").textContent = fmtMs(ms);
      panel.querySelector(".cv-code").innerHTML = r.code.join("\n");
    } catch (e) {
      console.error(e);
      msg.textContent = `處理失敗：${cvErr(e)}`;
    } finally {
      S.free();
      panel.querySelector(".cv-mem").innerHTML = memHTML(runs);
    }
  };
  const run = scheduler(process);
  const sizeTo = (w, hh) => {
    if (srcC.width !== w || srcC.height !== hh) { srcC.width = dstC.width = w; srcC.height = dstC.height = hh; fitInto(frame, view, w, hh); }
  };
  const usePhoto = async (n) => {
    const img = await loadImg(photoURL(n));
    if (!ctx.active || stream) return;
    const k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
    sizeTo(Math.round(img.naturalWidth * k), Math.round(img.naturalHeight * k));
    sctx.drawImage(img, 0, 0, srcC.width, srcC.height);
    run();
  };
  const stopCam = () => { if (stream) stream.getTracks().forEach((t) => t.stop()); stream = null; if (video) video.srcObject = null; };
  ctx.onCleanup(stopCam);

  ctx.group(["✏️ 邊緣", "🔷 輪廓", "🎨 色彩篩選", "🖍️ 卡通化"], 0, (i) => {
    mode = keys[i];
    build();
    if (!stream) usePhoto(picked ?? MODES[mode].photo); else run();
  });
  ctx.select("照片", [{ value: "", label: "依模式" }, ...PHOTOS], "", (v) => { picked = v ? +v : null; if (!stream) usePhoto(picked ?? MODES[mode].photo); });
  const camBtn = ctx.toggle("📷 鏡頭", false, async (on) => {
    if (!on) { stopCam(); usePhoto(picked ?? MODES[mode].photo); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      if (!ctx.active) return stopCam();
      video = video || Object.assign(document.createElement("video"), { muted: true, playsInline: true });
      video.srcObject = stream;
      await video.play();
      msg.textContent = "";
      const loop = () => {
        if (!stream || !ctx.active) return;
        if (video.videoWidth) {
          sizeTo(video.videoWidth, video.videoHeight);
          sctx.save(); sctx.scale(-1, 1); sctx.drawImage(video, -srcC.width, 0, srcC.width, srcC.height); sctx.restore();
          process();
        }
        requestAnimationFrame(loop);
      };
      loop();
    } catch (e) {
      stopCam();
      camBtn.setAttribute("aria-pressed", "false");
      msg.textContent = /NotAllowed|Permission/i.test(String(e)) ? "鏡頭權限被拒絕，繼續使用照片" : "找不到可用的鏡頭，繼續使用照片";
    }
  });
  bindSliders(ctx, panel, new Proxy({}, { set: (_, k, v) => ((params[mode][k] = v), true) }), showParam, () => { hueBar(); if (!stream) run(); });
  ctx.on(panel, "click", (e) => { const b = e.target.closest("[data-hue]"); if (b) { params.hsv.h = +b.dataset.hue; build(); run(); } });
  const setSplit = (x) => { const r = frame.getBoundingClientRect(); frame.style.setProperty("--split", `${(Math.max(0, Math.min(1, (x - r.left) / r.width)) * 100).toFixed(1)}%`); };
  ctx.on(view, "pointerdown", (e) => { view.setPointerCapture(e.pointerId); setSplit(e.clientX); });
  ctx.on(view, "pointermove", (e) => { if (e.buttons) setSplit(e.clientX); });
  watch(ctx, view, () => fitInto(frame, view, srcC.width, srcC.height));
  build();
  return usePhoto(MODES.canny.photo);
}

// ---------- scene 2: color spaces, channels, histograms, CLAHE ----------
const SPACES = [
  { name: "RGB", code: null, back: null, ch: ["R 紅", "G 綠", "B 藍"], max: [256, 256, 256], lum: [0, 1, 2], col: ["#f72585", "#7bd389", "#4cc9f0"] },
  { name: "HSV", code: "COLOR_RGB2HSV", back: "COLOR_HSV2RGB", ch: ["H 色相（0~179）", "S 飽和度", "V 亮度"], max: [180, 256, 256], lum: [2], col: ["#ff8c42", "#9d8cff", "#ecebe6"] },
  { name: "Lab", code: "COLOR_RGB2Lab", back: "COLOR_Lab2RGB", ch: ["L 明度", "a 綠↔紅", "b 藍↔黃"], max: [256, 256, 256], lum: [0], col: ["#ecebe6", "#f72585", "#f7df1e"] },
  { name: "YCrCb", code: "COLOR_RGB2YCrCb", back: "COLOR_YCrCb2RGB", ch: ["Y 亮度", "Cr 紅色差", "Cb 藍色差"], max: [256, 256, 256], lum: [0], col: ["#ecebe6", "#f72585", "#4cc9f0"] },
];

async function mountColor(ctx) {
  ctx.html(`<div class="cv-wrap"><div class="cv-view"><div class="cv-tiles">${[0, 1, 2, 3].map((i) => `<div class="cv-tile"><canvas></canvas><span class="cv-tag"></span></div>`).join("")}</div></div>
    <aside class="cv-panel"><h4>色彩空間與直方圖</h4><p>同一張照片拆成三個通道。開啟 CLAHE 只對亮度通道做局部等化，色彩不變但暗部細節浮現。</p>
    <canvas class="cv-hist"></canvas><div class="cv-legend"></div><div class="cv-kv"></div><div class="cv-mem"></div></aside></div>`);
  const tiles = ctx.$$(".cv-tile"), panel = ctx.$(".cv-panel"), hist = ctx.$(".cv-hist");
  const P = scope();
  ctx.onCleanup(P.free);
  let space = 1, clahe = false, clip = 3, base = null, runs = 0;
  const render = () => {
    if (!base || !ctx.active) return;
    const S = scope(), sp = SPACES[space];
    try {
      const t0 = performance.now();
      const rgb = S(new cv.Mat()), conv = S(new cv.Mat()), mv = S(new cv.MatVector());
      cv.cvtColor(base, rgb, cv.COLOR_RGBA2RGB);
      if (sp.code) cv.cvtColor(rgb, conv, cv[sp.code]); else rgb.copyTo(conv);
      cv.split(conv, mv);
      const chans = [0, 1, 2].map((i) => S(mv.get(i)));
      if (clahe) {
        const eq = S(new cv.CLAHE(clip, new cv.Size(8, 8)));
        for (const i of sp.lum) eq.apply(chans[i], chans[i]);
        const mv2 = S(new cv.MatVector()), merged = S(new cv.Mat()), back = S(new cv.Mat());
        chans.forEach((c) => mv2.push_back(c));
        cv.merge(mv2, merged);
        if (sp.back) cv.cvtColor(merged, back, cv[sp.back]); else merged.copyTo(back);
        cv.imshow(tiles[0].firstChild, back);
      } else cv.imshow(tiles[0].firstChild, base);
      tiles[0].lastChild.innerHTML = clahe ? `CLAHE 等化後 <i>clip ${clip}</i>` : "原圖";
      const means = [];
      chans.forEach((c, i) => {
        const shown = S(new cv.Mat());
        c.convertTo(shown, -1, 256 / sp.max[i], 0);
        cv.imshow(tiles[i + 1].firstChild, shown);
        tiles[i + 1].lastChild.textContent = sp.ch[i];
        means.push(cv.mean(c)[0]);
      });
      // Histograms: 64 bins per channel through cv.calcHist.
      const dpr = Math.min(2, devicePixelRatio || 1), W = hist.clientWidth * dpr, H = hist.clientHeight * dpr;
      hist.width = W; hist.height = H;
      const g = hist.getContext("2d");
      g.lineWidth = 1.5 * dpr;
      chans.forEach((c, i) => {
        const vec = S(new cv.MatVector()), out = S(new cv.Mat()), none = S(new cv.Mat());
        vec.push_back(c);
        cv.calcHist(vec, [0], none, out, [64], [0, sp.max[i]], false);
        const d = out.data32F, top = Math.max(...d) || 1;
        g.strokeStyle = sp.col[i];
        g.beginPath();
        for (let b = 0; b < 64; b++) { const x = (b / 63) * (W - 4) + 2, y = H - 3 - (d[b] / top) * (H - 8); b ? g.lineTo(x, y) : g.moveTo(x, y); }
        g.stroke();
      });
      const ms = performance.now() - t0;
      runs++;
      ctx.$(".cv-legend").innerHTML = sp.ch.map((n, i) => `<span><i style="background:${sp.col[i]}"></i>${n.split("（")[0]}</span>`).join("");
      ctx.$(".cv-kv").innerHTML = sp.ch.map((n, i) => `<span>${n.split(" ")[0]} 平均</span><b>${means[i].toFixed(1)}</b>`).join("") +
        `<span>處理時間</span><b>${fmtMs(ms)}</b><span>影像尺寸</span><b>${base.cols}×${base.rows}</b>`;
    } catch (e) { console.error(e); ctx.$(".cv-kv").textContent = `處理失敗：${cvErr(e)}`; } finally {
      S.free();
      ctx.$(".cv-mem").innerHTML = memHTML(runs);
    }
  };
  const setPhoto = async (n) => {
    const img = await loadImg(photoURL(n));
    if (!ctx.active) return;
    if (base) { drop(base); base = null; }
    base = own(cv.imread((matFrom(img, 560, P), SCR)));
    P.free();
    render();
  };
  ctx.select("照片", PHOTOS, 5, (v) => setPhoto(+v));
  ctx.group(SPACES.map((s) => s.name), space, (i) => { space = i; render(); });
  ctx.toggle("CLAHE 等化", clahe, (v) => { clahe = v; render(); });
  ctx.slider("clip", { min: 1, max: 8, step: 0.5, value: clip, format: (v) => v.toFixed(1) }, (v) => { clip = v; if (clahe) render(); });
  ctx.onCleanup(() => { base = drop(base); });
  watch(ctx, hist, scheduler(render));
  await setPhoto(5);
}

// ---------- scene 3: noise, smoothing filters, threshold and morphology ----------
const MORPHS = [["MORPH_OPEN", "開運算（去白點）"], ["MORPH_CLOSE", "閉運算（補黑洞）"], ["MORPH_ERODE", "侵蝕"], ["MORPH_DILATE", "膨脹"],
  ["MORPH_GRADIENT", "梯度（外框）"], ["MORPH_TOPHAT", "頂帽（細亮點）"]];

async function mountMorph(ctx) {
  ctx.html(`<div class="cv-wrap"><div class="cv-view"><div class="cv-tiles">${["① 加入雜訊", "② 濾波", "③ Otsu 二值化", "④ 形態學"].map((t) =>
    `<div class="cv-tile"><canvas></canvas><span class="cv-tag">${t}</span></div>`).join("")}</div></div>
    <aside class="cv-panel"><h4>去雜訊到乾淨遮罩</h4><p>四格是一條管線：雜訊照片經濾波、Otsu 二值化，再用形態學清掉殘留的小點與破洞。</p>
    <div data-sl></div><label class="cv-sl wide"><span>形態學</span><select data-op>${MORPHS.map(([k, n], i) => `<option value="${i}">${n}</option>`).join("")}</select></label>
    <div class="cv-kv"></div><pre class="cv-code"></pre><div class="cv-mem"></div></aside></div>`);
  const tiles = ctx.$$(".cv-tile canvas"), tags = ctx.$$(".cv-tile .cv-tag"), panel = ctx.$(".cv-panel");
  const vals = { k: 5, m: 7 }, defs = [["k", "濾波核", 3, 15, 2], ["m", "形態核", 3, 21, 2]];
  ctx.$("[data-sl]").innerHTML = slidersHTML(defs, vals);
  let noise = 0, filter = 1, op = 0, runs = 0;
  const P = scope();
  ctx.onCleanup(P.free);
  const img = await loadImg(photoURL(6));
  if (!ctx.active) return;
  const clean = matFrom(img, 560, P), cleanRGB = P(new cv.Mat());
  cv.cvtColor(clean, cleanRGB, cv.COLOR_RGBA2RGB);
  // Noisy inputs are generated once per noise type with a seeded RNG so every run is comparable.
  const noisy = [0, 1].map((type) => {
    const m = P(new cv.Mat());
    cleanRGB.copyTo(m);
    const d = m.data, r = rng(7 + type);
    if (type === 0) {
      for (let i = 0; i < d.length; i += 3) { const u = r(); if (u < 0.06) d[i] = d[i + 1] = d[i + 2] = u < 0.03 ? 0 : 255; }
    } else {
      for (let i = 0; i < d.length; i++) { const g = Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r()); d[i] = Math.max(0, Math.min(255, d[i] + g * 30)); }
    }
    return m;
  });
  const mae = (a, b, S) => { const d = S(new cv.Mat()); cv.absdiff(a, b, d); const m = cv.mean(d); return (m[0] + m[1] + m[2]) / 3; };
  const render = () => {
    const S = scope();
    try {
      const src = noisy[noise], f = S(new cv.Mat()), gray = S(new cv.Mat()), bin = S(new cv.Mat()), out = S(new cv.Mat()), lab = S(new cv.Mat());
      const k = vals.k;
      const t0 = performance.now();
      if (filter === 0) cv.GaussianBlur(src, f, new cv.Size(k, k), 0);
      else if (filter === 1) cv.medianBlur(src, f, k);
      else cv.bilateralFilter(src, f, k, 75, 75);
      const t1 = performance.now();
      cv.cvtColor(f, gray, cv.COLOR_RGB2GRAY);
      const th = cv.threshold(gray, bin, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
      const t2 = performance.now();
      const kern = S(cv.getStructuringElement(cv.MORPH_ELLIPSE, new cv.Size(vals.m, vals.m)));
      cv.morphologyEx(bin, out, cv[MORPHS[op][0]], kern);
      const t3 = performance.now();
      const before = cv.connectedComponents(bin, lab) - 1, after = cv.connectedComponents(out, lab) - 1;
      cv.imshow(tiles[0], src); cv.imshow(tiles[1], f); cv.imshow(tiles[2], bin); cv.imshow(tiles[3], out);
      const fname = ["高斯", "中值", "雙邊"][filter];
      tags[1].innerHTML = `② ${fname}濾波 <i>${k}×${k}</i>`;
      tags[2].innerHTML = `③ Otsu 二值化 <i>門檻 ${Math.round(th)}</i>`;
      tags[3].innerHTML = `④ ${MORPHS[op][1].split("（")[0]} <i>${vals.m}×${vals.m}</i>`;
      runs++;
      ctx.$(".cv-kv").innerHTML = `<span>雜訊圖誤差 MAE</span><b>${mae(src, cleanRGB, S).toFixed(1)}</b><span>${fname}濾波後 MAE</span><b>${mae(f, cleanRGB, S).toFixed(1)}</b>
        <span>連通區塊 ③ → ④</span><b>${before} → ${after}</b><span>濾波耗時</span><b>${fmtMs(t1 - t0)}</b><span>形態學耗時</span><b>${fmtMs(t3 - t2)}</b>`;
      ctx.$(".cv-code").innerHTML = [filter === 0 ? `cv.<u>GaussianBlur</u>(src, f, new cv.Size(<em>${k}</em>, <em>${k}</em>), 0)` : filter === 1 ? `cv.<u>medianBlur</u>(src, f, <em>${k}</em>)` : `cv.<u>bilateralFilter</u>(src, f, <em>${k}</em>, 75, 75)`,
        `cv.<u>threshold</u>(gray, bin, 0, 255, BINARY + OTSU)`, `cv.<u>morphologyEx</u>(bin, out, cv.<em>${MORPHS[op][0]}</em>, ellipse${vals.m})`, `cv.<u>connectedComponents</u>(out, labels)`].join("\n");
    } catch (e) { console.error(e); ctx.$(".cv-kv").textContent = `處理失敗：${cvErr(e)}`; } finally {
      S.free();
      ctx.$(".cv-mem").innerHTML = memHTML(runs);
    }
  };
  const run = scheduler(() => ctx.active && render());
  ctx.group(["椒鹽雜訊", "高斯雜訊"], noise, (i) => { noise = i; run(); });
  ctx.group(["高斯", "中值", "雙邊"], filter, (i) => { filter = i; run(); });
  bindSliders(ctx, panel, vals, (k, v) => `${v}×${v}`, run);
  ctx.$$(".cv-sl b").forEach((b, i) => (b.textContent = `${vals[defs[i][0]]}×${vals[defs[i][0]]}`));
  ctx.on(ctx.$("[data-op]"), "change", (e) => { op = +e.target.value; run(); });
  render();
}

// ---------- scene 4: contours, polygon approximation and shape classification ----------
const SHAPES = { tri: "三角形", square: "正方形", rect: "長方形", pent: "五邊形", hex: "六邊形", circle: "圓形", star: "星形", other: "其他" };
function drawShapes(seed) {
  const W = 760, H = 480, c = canvas(W, H), g = c.getContext("2d"), r = rng(seed);
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, "#11141a"); bg.addColorStop(1, "#22262e");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const types = ["tri", "square", "rect", "pent", "hex", "circle", "star"], truth = [];
  for (let tries = 0; truth.length < 13 && tries < 600; tries++) {
    const R = 30 + r() * 28, x = R + 14 + r() * (W - 2 * R - 28), y = R + 14 + r() * (H - 2 * R - 28);
    if (truth.some((t) => Math.hypot(t.x - x, t.y - y) < t.R + R + 16)) continue;
    const type = types[truth.length % types.length], rot = r() * Math.PI * 2;
    const at = (a, rad) => [x + rad * Math.cos(a + rot), y + rad * Math.sin(a + rot)];
    let pts = [];
    if (type === "tri" || type === "square" || type === "pent" || type === "hex") {
      const n = { tri: 3, square: 4, pent: 5, hex: 6 }[type];
      for (let i = 0; i < n; i++) pts.push(at((i * 2 * Math.PI) / n, R));
    } else if (type === "rect") {
      pts = [[-1, -0.5], [1, -0.5], [1, 0.5], [-1, 0.5]].map(([u, v]) => [x + R * (u * Math.cos(rot) - v * Math.sin(rot)), y + R * (u * Math.sin(rot) + v * Math.cos(rot))]);
    } else if (type === "star") {

    g.beginPath();
    if (type === "circle") g.arc(x, y, R, 0, Math.PI * 2);
    else pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py)));
    g.closePath(); g.fill();

}

async function mountShapes(ctx) {
  ctx.html(`<div class="cv-wrap"><div class="cv-view"><canvas></canvas><span class="cv-tag" data-tag></span></div>
    <aside class="cv-panel"><h4>輪廓、逼近多邊形、分類</h4><p>findContours 取外輪廓，approxPolyDP 依精度 ε 簡化成多邊形，再用頂點數、凸包實心度與圓度判斷形狀。測試圖由頁面隨機產生，所以能核對答案。</p>
    <div data-sl></div><div class="cv-stats"><div class="cv-stat"><b data-acc>-</b><span>分類正確</span></div><div class="cv-stat"><b data-ms>-</b><span>處理時間</span></div></div>
    <div class="cv-kv"></div><div class="cv-mem"></div></aside></div>`);
  const view = ctx.$(".cv-view canvas"), panel = ctx.$(".cv-panel");
  const vals = { eps: 2.5 }, show = (k, v) => `${v.toFixed(1)}%`;
  ctx.$("[data-sl]").innerHTML = slidersHTML([["eps", "精度 ε", 0.5, 10, 0.5]], vals, show);
  let seed = 3, src = "otsu", box = false, hull = true, runs = 0, scene = drawShapes(seed);
  const render = () => {
    const S = scope();
    try {
      const t0 = performance.now();
      const img = S(cv.imread(scene.canvas)), gray = S(new cv.Mat()), bin = S(new cv.Mat()), list = S(new cv.MatVector()), hier = S(new cv.Mat());
      cv.cvtColor(img, gray, cv.COLOR_RGBA2GRAY);
      cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0);
      if (src === "otsu") cv.threshold(gray, bin, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
      else { cv.Canny(gray, bin, 40, 120); cv.dilate(bin, bin, S(cv.getStructuringElement(cv.MORPH_RECT, new cv.Size(3, 3)))); }
      cv.findContours(bin, list, hier, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      img.convertTo(img, -1, 0.75, 0);
      const found = [];
      for (let i = 0; i < list.size(); i++) {
        const c = S(list.get(i)), area = cv.contourArea(c);
        if (area < 300) continue;
        const peri = cv.arcLength(c, true), approx = S(new cv.Mat()), hl = S(new cv.Mat());
        cv.approxPolyDP(c, approx, (vals.eps / 100) * peri, true);
        cv.convexHull(c, hl, false, true);
        const solidity = area / Math.max(1, cv.contourArea(hl)), circ = (4 * Math.PI * area) / (peri * peri), v = approx.rows;
        const rr = cv.minAreaRect(c), ar = Math.max(rr.size.width, rr.size.height) / Math.max(1, Math.min(rr.size.width, rr.size.height));
        const type = solidity < 0.8 ? "star" : v === 3 ? "tri" : v === 4 ? (ar < 1.25 ? "square" : "rect") : v === 5 ? "pent" : v === 6 ? "hex" : circ > 0.8 ? "circle" : "other";
        const mo = cv.moments(c), cx = mo.m10 / mo.m00, cy = mo.m01 / mo.m00;
        const truth = scene.truth.find((t) => Math.hypot(t.x - cx, t.y - cy) < t.R * 0.5);
        const ok = !!truth && truth.type === type;
        const col = ok ? new cv.Scalar(123, 211, 137, 255) : new cv.Scalar(247, 37, 133, 255);
        cv.drawContours(img, list, i, col, 2, cv.LINE_AA);
        if (hull) { const hv = S(new cv.MatVector()); hv.push_back(hl); cv.drawContours(img, hv, 0, new cv.Scalar(76, 201, 240, 255), 1, cv.LINE_AA); }
        if (box) { const p = cv.RotatedRect.points(rr); for (let j = 0; j < 4; j++) cv.line(img, p[j], p[(j + 1) % 4], new cv.Scalar(247, 223, 30, 255), 1, cv.LINE_AA); }
        for (let j = 0; j < v; j++) cv.circle(img, new cv.Point(approx.data32S[j * 2], approx.data32S[j * 2 + 1]), 4, new cv.Scalar(255, 255, 255, 255), -1, cv.LINE_AA);

      g.textAlign = "center";
      for (const f of found) {
        const t = `${f.ok ? "✓" : "✗"} ${SHAPES[f.type]} ${f.v}`;
        const w = g.measureText(t).width + 10;
        g.fillStyle = "rgba(10,12,15,.8)"; g.fillRect(f.cx - w / 2, f.cy - 10, w, 20);
        g.fillStyle = f.ok ? "#7bd389" : "#ff6b9a"; g.fillText(t, f.cx, f.cy + 5);

      ctx.$("[data-ms]").textContent = fmtMs(ms);
      ctx.$("[data-tag]").innerHTML = `${src === "otsu" ? "Otsu 二值化" : "Canny 邊緣"}・輪廓 <i>${found.length}</i>・ε <i>${vals.eps.toFixed(1)}%</i>`;
      const counts = {};

      ctx.$(".cv-kv").innerHTML = Object.keys(SHAPES).filter((k) => counts[k]).map((k) => `<span>${SHAPES[k]}</span><b>${counts[k]}</b>`).join("");
    } catch (e) { console.error(e); ctx.$(".cv-kv").textContent = `處理失敗：${cvErr(e)}`; } finally {

    }
  };
  const run = scheduler(() => ctx.active && render());
  ctx.group(["Otsu 二值化", "Canny 邊緣"], 0, (i) => { src = i ? "canny" : "otsu"; run(); });
  ctx.toggle("凸包", hull, (v) => { hull = v; run(); });
  ctx.toggle("外接矩形", box, (v) => { box = v; run(); });
  ctx.button("重新產生", () => { scene = drawShapes(++seed); run(); });

// ---------- scene 5: Hough transforms ----------
function drawDesk(seed) {
  const W = 760, H = 480, c = canvas(W, H), g = c.getContext("2d"), r = rng(seed);
  g.fillStyle = "#4e3522"; g.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 3) { g.fillStyle = `rgba(255, 214, 170, ${0.03 + 0.06 * Math.abs(Math.sin(y * 0.045 + Math.sin(y * 0.01) * 2))})`; g.fillRect(0, y, W, 2); }
  g.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    const a = r() * Math.PI, L = 300 + r() * 260, x = 140 + r() * (W - 280), y = 110 + r() * (H - 220);
    g.strokeStyle = i % 2 ? "#e9e1cf" : "#1d1f24"; g.lineWidth = 9 + r() * 4;
    g.beginPath(); g.moveTo(x - Math.cos(a) * L / 2, y - Math.sin(a) * L / 2); g.lineTo(x + Math.cos(a) * L / 2, y + Math.sin(a) * L / 2); g.stroke();
  }
  const coins = [];
  for (let tries = 0; coins.length < 9 && tries < 500; tries++) {
    const R = 22 + r() * 24, x = R + 10 + r() * (W - 2 * R - 20), y = R + 10 + r() * (H - 2 * R - 20);
    if (coins.some((k) => Math.hypot(k.x - x, k.y - y) < k.R + R + 8)) continue;
    const gold = r() < 0.5, grad = g.createRadialGradient(x - R * 0.35, y - R * 0.35, R * 0.1, x, y, R);
    grad.addColorStop(0, gold ? "#ffe9a3" : "#f4f4f4"); grad.addColorStop(1, gold ? "#a07a1f" : "#8c8f96");
    g.fillStyle = grad; g.beginPath(); g.arc(x, y, R, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 2; g.beginPath(); g.arc(x, y, R * 0.78, 0, Math.PI * 2); g.stroke();
    coins.push({ x, y, R });
  }
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 36; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
  return { canvas: c, coins };
}

async function mountHough(ctx) {

// ---------- scene 6: ORB features, ratio-test matching, RANSAC homography ----------
async function mountMatch(ctx) {
  ctx.html(`<div class="cv-wrap"><div class="cv-view"><canvas></canvas><span class="cv-tag">原圖</span><span class="cv-tag r">變形後</span></div>
    <aside class="cv-panel"><h4>ORB 特徵點匹配</h4><p>右圖是左圖經旋轉、縮放、透視變形的結果。兩邊各自找 ORB 特徵點，knnMatch 加比值測試篩選，再用 RANSAC 求單應矩陣並比對真實角度。</p>
    <div data-sl></div><div class="cv-stats"><div class="cv-stat"><b data-in>-</b><span>RANSAC 內點</span></div><div class="cv-stat"><b data-err>-</b><span>角點誤差</span></div></div>
    <div class="cv-kv"></div><div class="cv-legend"><span><i style="background:#7bd389"></i>內點</span><span><i style="background:#f72585"></i>外點</span><span><i style="background:#f7df1e"></i>估計外框</span></div><div class="cv-mem"></div></aside></div>`);
  const view = ctx.$(".cv-view canvas"), panel = ctx.$(".cv-panel");
  const vals = { rot: 25, scale: 0.85, tilt: 0.15, n: 600 };
  const show = (k, v) => (k === "rot" ? `${v}°` : k === "n" ? v : v.toFixed(2));
  ctx.$("[data-sl]").innerHTML = slidersHTML([["rot", "旋轉", -180, 180, 1], ["scale", "縮放", 0.5, 1.4, 0.05], ["tilt", "透視傾斜", 0, 0.4, 0.02], ["n", "特徵點上限", 100, 2000, 50]], vals, show);
  const P = scope();
  ctx.onCleanup(P.free);
  let base = null, grayA = null, orb = null, kpA = null, desA = null, runs = 0, auto = false;
  ctx.onCleanup(() => { [orb, kpA, desA, grayA, base].forEach(drop); });
  const setPhoto = async (n) => {
    const img = await loadImg(photoURL(n));
    if (!ctx.active) return;
    [grayA, base, kpA, desA] = [grayA, base, kpA, desA].map(drop);
    const tmp = scope();
    base = own(matFrom(img, 440, tmp).clone());
    tmp.free();
    grayA = own(new cv.Mat());
    cv.cvtColor(base, grayA, cv.COLOR_RGBA2GRAY);
    render();
  };
  const render = () => {
    if (!base || !ctx.active) return;
    const S = scope();
    try {
      const W = base.cols, H = base.rows, cx = W / 2, cy = H / 2, a = (vals.rot * Math.PI) / 180, s = vals.scale, t = vals.tilt;
      const corners = [[0, 0], [W, 0], [W, H], [0, H]];
      const dstQ = corners.map(([x, y]) => {
        const u = (x - cx) * (y < cy ? 1 - t : 1 + t * 0.3), v = y - cy;
        return [cx + s * (u * Math.cos(a) - v * Math.sin(a)), cy + s * (u * Math.sin(a) + v * Math.cos(a))];
      });
      const M = S(cv.getPerspectiveTransform(ptsMat(S, corners), ptsMat(S, dstQ)));
      const warped = S(new cv.Mat()), grayB = S(new cv.Mat());
      cv.warpPerspective(base, warped, M, new cv.Size(W, H), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar(10, 12, 15, 255));
      cv.cvtColor(warped, grayB, cv.COLOR_RGBA2GRAY);
      const t0 = performance.now();
      if (!orb) { orb = own(new cv.ORB(vals.n)); kpA = drop(kpA); desA = drop(desA); }
      if (!kpA) { kpA = own(new cv.KeyPointVector()); desA = own(new cv.Mat()); orb.detectAndCompute(grayA, S(new cv.Mat()), kpA, desA); }
      const kpB = S(new cv.KeyPointVector()), desB = S(new cv.Mat());
      orb.detectAndCompute(grayB, S(new cv.Mat()), kpB, desB);
      const t1 = performance.now();
      const good = [];
      if (desA.rows && desB.rows) {
        const bf = S(new cv.BFMatcher(cv.NORM_HAMMING, false)), knn = S(new cv.DMatchVectorVector());
        bf.knnMatch(desA, desB, knn, 2);
        for (let i = 0; i < knn.size(); i++) {
          const pair = S(knn.get(i));
          if (pair.size() < 2) continue;
          const m0 = pair.get(0), m1 = pair.get(1);

      if (good.length >= 4) {
        const pa = good.map((m) => { const p = kpA.get(m.queryIdx).pt; return [p.x, p.y]; });
        const pb = good.map((m) => { const p = kpB.get(m.trainIdx).pt; return [p.x, p.y]; });
        const mask = S(new cv.Mat());
        Hm = S(cv.findHomography(ptsMat(S, pa), ptsMat(S, pb), cv.RANSAC, 4, mask));
        if (Hm.empty()) Hm = null; else inl = Array.from(mask.data);

      const t3 = performance.now();
      const pairV = S(new cv.MatVector()), both = S(new cv.Mat());
      pairV.push_back(base); pairV.push_back(warped);
      cv.hconcat(pairV, both);
      cv.imshow(view, both);
      const g = view.getContext("2d");
      g.lineWidth = 1;
      good.slice(0, 220).forEach((m, i) => {
        const p = kpA.get(m.queryIdx).pt, q = kpB.get(m.trainIdx).pt, ok = inl[i];
        g.strokeStyle = ok ? "rgba(123,211,137,.75)" : "rgba(247,37,133,.45)";
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x + W, q.y); g.stroke();
      });
      let err = null, angle = null;
      if (Hm) {
        const proj = S(new cv.Mat());
        cv.perspectiveTransform(ptsMat(S, corners), proj, Hm);
        const pp = [0, 1, 2, 3].map((i) => [proj.data32F[i * 2], proj.data32F[i * 2 + 1]]);
        err = pp.reduce((acc, [x, y], i) => acc + Math.hypot(x - dstQ[i][0], y - dstQ[i][1]), 0) / 4;
        const hd = Hm.data64F;

        g.strokeStyle = "#f7df1e"; g.lineWidth = 2.5;
        g.beginPath(); pp.forEach(([x, y], i) => (i ? g.lineTo(x + W, y) : g.moveTo(x + W, y))); g.closePath(); g.stroke();
      }
      runs++;
      const nIn = inl.filter(Boolean).length;
      ctx.$("[data-in]").textContent = Hm ? `${nIn} / ${good.length}` : "失敗";
      ctx.$("[data-err]").textContent = err == null ? "-" : `${err.toFixed(1)} px`;
      ctx.$(".cv-kv").innerHTML = `<span>特徵點 左 / 右</span><b>${kpA.size()} / ${kpB.size()}</b><span>估計旋轉（實際）</span><b>${angle == null ? "-" : `${angle.toFixed(1)}°`}（${vals.rot}°）</b>
        <span>ORB 偵測</span><b>${fmtMs(t1 - t0)}</b><span>knnMatch</span><b>${fmtMs(t2 - t1)}</b><span>findHomography</span><b>${fmtMs(t3 - t2)}</b>`;
    } catch (e) { console.error(e); ctx.$(".cv-kv").textContent = `處理失敗：${cvErr(e)}`; } finally {
      S.free();
      ctx.$(".cv-mem").innerHTML = memHTML(runs);
    }
  };
  const run = scheduler(render);
  ctx.select("照片", PHOTOS, 2, (v) => setPhoto(+v));
  ctx.toggle("自動旋轉", auto, (v) => (auto = v));
  bindSliders(ctx, panel, vals, show, (k) => { if (k === "n") orb = drop(orb); run(); });
  let acc = 0;
  ctx.raf((_, dt) => {
    if (!auto) return;
    acc += dt;
    if (acc < 90) return;
    vals.rot = ((vals.rot + 180 + acc * 0.04) % 360) - 180;
    vals.rot = Math.round(vals.rot);
    acc = 0;
    const input = ctx.$('[data-k="rot"]');
    input.value = vals.rot; input.nextElementSibling.textContent = show("rot", vals.rot);
    render();
  });
  await setPhoto(2);
}

  for (let y = 0; y <= 280; y += 30) { g.beginPath(); g.moveTo(0, y); g.lineTo(420, y); g.stroke(); }
  ["#f72585", "#4cc9f0", "#7bd389", "#f7df1e"].forEach((col, i) => { g.fillStyle = col; g.fillRect(24 + i * 96, 170, 80, 80); });
  g.fillStyle = "#1a1a14"; g.font = "800 46px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif"; g.fillText("OpenCV.js", 24, 70);
  g.font = "600 24px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif"; g.fillText("透視校正示範海報", 24, 120);
  g.lineWidth = 8; g.strokeStyle = "#1a1a14"; g.strokeRect(4, 4, 412, 272);
  return c;
}
const POSTER_Q = [[318, 132], [668, 196], [640, 470], [262, 392]];

async function mountWarp(ctx) {
  ctx.html(`<div class="cv-wrap"><div class="cv-view"><div class="cv-tiles cv-two"><div class="cv-tile" data-in><div class="cv-frame"><canvas></canvas>
    <svg viewBox="0 0 900 600" preserveAspectRatio="none"><polygon class="cv-poly"/>${[1, 2, 3, 4].map((n) => `<g data-h="${n - 1}"><circle class="cv-handle" r="16"/><text class="cv-hlabel">${n}</text></g>`).join("")}</svg></div>
    <span class="cv-tag">拖曳 4 個角點</span></div><div class="cv-tile"><canvas data-out></canvas><span class="cv-tag r" data-otag>校正結果</span></div></div></div>
    <aside class="cv-panel"><h4>透視與仿射變換</h4><p>拖曳角點框住海報，getPerspectiveTransform 由 4 對點求 3×3 矩陣後 warpPerspective 拉正。仿射只用 3 點，平行線保持平行，所以拉不正透視。</p>
    <div class="cv-kv"></div><pre class="cv-code"></pre><div class="cv-mem"></div></aside></div>`);
  const tile = ctx.$("[data-in]"), frame = ctx.$(".cv-frame"), inC = ctx.$(".cv-frame canvas"), outC = ctx.$("[data-out]"), svg = ctx.$("svg");
  const P = scope();
  ctx.onCleanup(P.free);
  const photo = await loadImg(photoURL(1));
  if (!ctx.active) return;
  // Build the input with OpenCV itself: warp a generated poster into the fjord photo.
  const bg = matFrom(photo, 900, P), poster = P(cv.imread(drawPoster())), warped = P(new cv.Mat()), mask = P(new cv.Mat());
  const white = P(new cv.Mat(poster.rows, poster.cols, cv.CV_8UC1, new cv.Scalar(255)));
  const PW = poster.cols, PH = poster.rows;
  const M0 = P(cv.getPerspectiveTransform(ptsMat(P, [[0, 0], [PW, 0], [PW, PH], [0, PH]]), ptsMat(P, POSTER_Q)));
  cv.warpPerspective(poster, warped, M0, new cv.Size(bg.cols, bg.rows));
  cv.warpPerspective(white, mask, M0, new cv.Size(bg.cols, bg.rows));
  warped.copyTo(bg, mask);
  cv.imshow(inC, bg);
  svg.setAttribute("viewBox", `0 0 ${bg.cols} ${bg.rows}`);
  let pts = POSTER_Q.map((p) => [...p]), affine = false, runs = 0;
  const paintSvg = () => {
    // Handles keep a constant on-screen size: convert 12 css px into image units.
    const unit = bg.cols / Math.max(1, svg.clientWidth || bg.cols);
    const poly = affine ? [...pts.slice(0, 2), [pts[1][0] + pts[3][0] - pts[0][0], pts[1][1] + pts[3][1] - pts[0][1]], pts[3]] : pts;
    ctx.$(".cv-poly").setAttribute("points", poly.map((p) => p.join(",")).join(" "));
    ctx.$$("[data-h]").forEach((gEl, i) => {
      const [x, y] = pts[i], on = i !== 2 || !affine;
      gEl.style.display = on ? "" : "none";
      gEl.firstChild.setAttribute("cx", x); gEl.firstChild.setAttribute("cy", y); gEl.firstChild.setAttribute("r", 12 * unit);
      gEl.lastChild.setAttribute("font-size", 13 * unit);
      gEl.lastChild.setAttribute("x", x); gEl.lastChild.setAttribute("y", y);
      gEl.lastChild.textContent = affine && i === 3 ? 3 : i + 1;
    });
  };
  const render = () => {
    const S = scope();
    try {
      const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
      let W = Math.max(d(pts[0], pts[1]), d(pts[3], pts[2])), H = Math.max(d(pts[0], pts[3]), d(pts[1], pts[2]));
      const k = Math.min(1, 640 / Math.max(W, H));
      W = Math.max(20, Math.round(W * k)); H = Math.max(20, Math.round(H * k));
      const out = S(new cv.Mat()), t0 = performance.now();
      let Mx;
      if (affine) {
        Mx = S(cv.getAffineTransform(ptsMat(S, [pts[0], pts[1], pts[3]]), ptsMat(S, [[0, 0], [W, 0], [0, H]])));
        cv.warpAffine(bg, out, Mx, new cv.Size(W, H));
      } else {
        Mx = S(cv.getPerspectiveTransform(ptsMat(S, pts), ptsMat(S, [[0, 0], [W, 0], [W, H], [0, H]])));
        cv.warpPerspective(bg, out, Mx, new cv.Size(W, H));
      }
      const ms = performance.now() - t0;
      cv.imshow(outC, out);
      runs++;
      const m = Array.from(Mx.data64F, (v) => v.toFixed(3).padStart(8));
      const rows = affine ? [m.slice(0, 3), m.slice(3, 6)] : [m.slice(0, 3), m.slice(3, 6), m.slice(6, 9)];
      ctx.$("[data-otag]").innerHTML = `${affine ? "仿射" : "透視"}校正 <i>${W}×${H}</i>`;
      ctx.$(".cv-kv").innerHTML = `<span>變換</span><b>${affine ? "warpAffine 2×3" : "warpPerspective 3×3"}</b><span>輸出尺寸</span><b>${W}×${H}</b><span>耗時</span><b>${fmtMs(ms)}</b>`;
      ctx.$(".cv-code").innerHTML = `M =\n${rows.map((r) => `[${r.join(" ")} ]`).join("\n")}`;
    } catch (e) { console.error(e); ctx.$(".cv-kv").textContent = `處理失敗：${cvErr(e)}`; } finally {
      S.free();
      ctx.$(".cv-mem").innerHTML = memHTML(runs);
    }
  };
  const run = scheduler(() => ctx.active && render());
  let dragging = -1;
  const toImg = (e) => { const r = svg.getBoundingClientRect(); return [((e.clientX - r.left) / r.width) * bg.cols, ((e.clientY - r.top) / r.height) * bg.rows]; };
  ctx.on(svg, "pointerdown", (e) => {
    const [x, y] = toImg(e), scale = bg.cols / svg.getBoundingClientRect().width;
    let best = -1, bd = 28 * scale;
    pts.forEach((p, i) => { if (affine && i === 2) return; const dd = Math.hypot(p[0] - x, p[1] - y); if (dd < bd) { bd = dd; best = i; } });
    if (best >= 0) { dragging = best; svg.setPointerCapture(e.pointerId); }
  });
  ctx.on(svg, "pointermove", (e) => {
    if (dragging < 0) return;
    const [x, y] = toImg(e);
    pts[dragging] = [Math.max(0, Math.min(bg.cols, x)), Math.max(0, Math.min(bg.rows, y))];
    paintSvg(); run();
  });
  ctx.on(svg, "pointerup", () => (dragging = -1));
  ctx.group(["透視（4 點）", "仿射（3 點）"], 0, (i) => { affine = i === 1; paintSvg(); run(); });
  ctx.button("打亂角點", () => { const r = rng(Date.now() & 0xffff); pts = pts.map(([x, y]) => [x + (r() - 0.5) * 90, y + (r() - 0.5) * 90]); paintSvg(); run(); });
  ctx.button("對齊海報", () => { pts = POSTER_Q.map((p) => [...p]); paintSvg(); run(); });
  watch(ctx, tile, () => { fitInto(frame, tile, bg.cols, bg.rows); paintSvg(); });
  fitInto(frame, tile, bg.cols, bg.rows);
  paintSvg();
  render();
}

// ---------- scene 8: stress, growing image size ----------
const OPS = [["灰階", "#9b998f"], ["高斯模糊", "#4cc9f0"], ["Canny", "#f7df1e"], ["輪廓", "#7bd389"], ["ORB", "#f72585"], ["透視變換", "#9d8cff"]];
async function mountStress(ctx) {
  ctx.html(`<div class="cv-stress"><div class="cv-view"><canvas></canvas><span class="cv-tag" data-tag>測試用照片・按「開始測試」</span></div>
    <div class="cv-bars"><div class="cv-legend">${OPS.map(([n, c]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")}</div><div data-rows></div><div class="cv-mem"></div></div></div>`);
  const view = ctx.$(".cv-view canvas"), rowsEl = ctx.$("[data-rows]");
  const photo = await loadImg(photoURL(2));
  if (!ctx.active) return;
  const P = scope();
  ctx.onCleanup(P.free);
  const base = matFrom(photo, 1200, P);
  cv.imshow(view, base);
  const results = [];
  let runs = 0;
  const paintRows = () => {
    const max = Math.max(...results.map((r) => r.total), 1);
    rowsEl.innerHTML = results.map((r) => `<div class="cv-brow"><span>${r.n}×${Math.round((r.n * 2) / 3)}</span><div class="cv-stack" style="width:${Math.max(4, (r.total / max) * 100)}%">${r.ms.map((m, i) => `<i style="width:${(m / r.total) * 100}%;background:${OPS[i][1]}" title="${OPS[i][0]} ${fmtMs(m)}"></i>`).join("")}</div><span>${fmtMs(r.total)}</span></div>`).join("");
    ctx.$(".cv-mem").innerHTML = memHTML(runs);
  };
  paintRows();
  ctx.bench({
    label: "影像寬度", unit: "px", sizes: [320, 640, 1280, 1920, 2560, 3840], target: 1000, budget: 4000,
    format: (n) => `${n}`,
    note: "每一級把照片縮放到該寬度（3:2），依序跑灰階、7×7 高斯模糊、Canny、findContours、ORB 1000 點、透視變換。OpenCV.js 在主執行緒單執行緒執行，耗時大致隨像素數成長。測完右側堆疊長條列出各步驟占比；存活 cv 物件回到常駐的 1 個（來源照片），代表每級的暫存 Mat 都已釋放。",
    prepare(n) {
      const m = own(new cv.Mat());
      cv.resize(base, m, new cv.Size(n, Math.round((n * 2) / 3)), 0, 0, cv.INTER_LINEAR);
      return m;
    },
    run(n, src) {
      const S = scope();
      S.free();
      const ms = [];
      let contours = 0, kp = 0;
      try {
        let t = performance.now();
        const lap = () => { const now = performance.now(); ms.push(now - t); t = now; };
        const gray = S(new cv.Mat()), blur = S(new cv.Mat()), edges = S(new cv.Mat()), list = S(new cv.MatVector()), hier = S(new cv.Mat());
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY); lap();
        cv.GaussianBlur(gray, blur, new cv.Size(7, 7), 0); lap();
        cv.Canny(blur, edges, 50, 150); lap();
        cv.findContours(edges, list, hier, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE); contours = list.size(); lap();
        const orb = S(new cv.ORB(1000)), kps = S(new cv.KeyPointVector()), des = S(new cv.Mat());
        orb.detectAndCompute(gray, S(new cv.Mat()), kps, des); kp = kps.size(); lap();
        const W = src.cols, H = src.rows, warped = S(new cv.Mat());
        const M = S(cv.getPerspectiveTransform(ptsMat(S, [[0, 0], [W, 0], [W, H], [0, H]]), ptsMat(S, [[W * 0.05, H * 0.1], [W * 0.95, 0], [W, H], [0, H * 0.9]])));
        cv.warpPerspective(src, warped, M, new cv.Size(W, H)); lap();
        const preview = S(new cv.Mat()), k = Math.min(1, 640 / W);
        cv.resize(edges, preview, new cv.Size(Math.round(W * k), Math.round(H * k)), 0, 0, cv.INTER_AREA);
        cv.imshow(view, preview);
      } finally {
        S.free();
        drop(src);
        runs++;
      }
      results.push({ n, ms, total: ms.reduce((a, b) => a + b, 0) });
      ctx.$("[data-tag]").innerHTML = `${n}×${Math.round((n * 2) / 3)} 的 Canny 結果・輪廓 <i>${fmt(contours)}</i>・ORB <i>${kp}</i> 點`;
      paintRows();
    },
  });
  ctx.$("[data-sc-run]").addEventListener("click", () => { results.length = 0; paintRows(); });
}
