<script src="https://cdn.jsdelivr.net/npm/ol@10.10.0/dist/ol.js"></script>

<script>
const { h, fmt, fmtMs } = Showcase;
const S = ol.style;
const { fromLonLat, toLonLat } = ol.proj;
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "sans-serif";
const MONO = rootCss.getPropertyValue("--mono").trim() || "monospace";
const font = (px, weight = 600) => `${weight} ${px}px ${FONT}`;

// ---------- shared data ----------
const COLORS = { "自然": "#7bd389", "城市": "#4cc9f0", "古蹟": "#ff8c42" };
const SPOTS = [
  { name: "台北 101", cat: "城市", lat: 25.0340, lng: 121.5645 }, { name: "九份老街", cat: "城市", lat: 25.1097, lng: 121.8443 },
  { name: "野柳地質公園", cat: "自然", lat: 25.2061, lng: 121.6900 }, { name: "淡水紅毛城", cat: "古蹟", lat: 25.1754, lng: 121.4330 },
  { name: "鹿港龍山寺", cat: "古蹟", lat: 24.0533, lng: 120.4344 }, { name: "台中國家歌劇院", cat: "城市", lat: 24.1630, lng: 120.6406 },
  { name: "日月潭", cat: "自然", lat: 23.8571, lng: 120.9157 }, { name: "阿里山", cat: "自然", lat: 23.5103, lng: 120.8031 },
  { name: "赤崁樓", cat: "古蹟", lat: 22.9975, lng: 120.2025 }, { name: "安平古堡", cat: "古蹟", lat: 23.0015, lng: 120.1606 },
  { name: "駁二藝術特區", cat: "城市", lat: 22.6201, lng: 120.2817 }, { name: "墾丁國家公園", cat: "自然", lat: 21.9483, lng: 120.7798 },
  { name: "太魯閣峽谷", cat: "自然", lat: 24.1597, lng: 121.6211 }, { name: "清境農場", cat: "自然", lat: 24.0569, lng: 121.1617 },
];
// Taiwan High Speed Rail stations [name, lng, lat] (approximate coordinates)
const HSR = [["南港", 121.6069, 25.0533], ["台北", 121.5170, 25.0478], ["板橋", 121.4637, 25.0143], ["桃園", 121.2149, 25.0129], ["新竹", 121.0402, 24.8081], ["苗栗", 120.8253, 24.6053],
  ["台中", 120.6157, 24.1121], ["彰化", 120.5745, 23.8740], ["雲林", 120.4163, 23.7363], ["嘉義", 120.3233, 23.4593], ["台南", 120.2857, 22.9250], ["左營", 120.3075, 22.6871]];
// Rough outline of the main island [lng, lat], hand-traced for point-in-polygon tests (not survey grade)
const TW = [[121.51, 25.30], [121.62, 25.22], [121.75, 25.15], [121.87, 25.12], [122.00, 25.01], [121.86, 24.87], [121.84, 24.70], [121.87, 24.58], [121.80, 24.42],
  [121.74, 24.25], [121.64, 24.05], [121.61, 23.95], [121.52, 23.70], [121.47, 23.45], [121.38, 23.12], [121.21, 22.84], [121.08, 22.67], [120.93, 22.40], [120.88, 22.18],
  [120.86, 21.97], [120.83, 21.90], [120.72, 21.93], [120.70, 22.05], [120.63, 22.29], [120.50, 22.42], [120.32, 22.55], [120.26, 22.66], [120.20, 22.85], [120.14, 23.00],
  [120.06, 23.12], [120.10, 23.30], [120.14, 23.46], [120.14, 23.62], [120.19, 23.79], [120.30, 23.97], [120.41, 24.10], [120.52, 24.28], [120.62, 24.45], [120.76, 24.62],
  [120.90, 24.83], [121.02, 24.98], [121.15, 25.07], [121.30, 25.13], [121.41, 25.18]];
// Population centres used to synthesise demo data [lat, lng, weight, sigma(deg)]
const CITIES = [[25.045, 121.53, 1.0, .06], [25.01, 121.45, .7, .06], [24.99, 121.30, .55, .06], [24.80, 120.98, .35, .05], [24.56, 120.82, .12, .05], [24.15, 120.67, .8, .07],
  [24.07, 120.54, .3, .05], [23.70, 120.53, .15, .06], [23.48, 120.45, .22, .05], [22.99, 120.21, .55, .06], [22.63, 120.31, .8, .06], [22.67, 120.49, .2, .05],
  [24.75, 121.75, .18, .05], [23.98, 121.60, .12, .04], [22.76, 121.14, .08, .04], [25.13, 121.74, .15, .03], [23.91, 120.69, .1, .05]];
// City label positions [name, lat, lng]
const LABELS = [["台北", 25.05, 121.52], ["基隆", 25.13, 121.74], ["桃園", 24.99, 121.30], ["新竹", 24.80, 120.97], ["苗栗", 24.56, 120.82], ["台中", 24.15, 120.67],
  ["彰化", 24.08, 120.54], ["南投", 23.91, 120.68], ["雲林", 23.71, 120.43], ["嘉義", 23.48, 120.45], ["台南", 22.99, 120.21], ["高雄", 22.63, 120.30],
  ["屏東", 22.67, 120.49], ["宜蘭", 24.75, 121.75], ["花蓮", 23.98, 121.60], ["台東", 22.76, 121.14]];
const PALETTE = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const KINDS = ["餐飲", "購物", "交通", "文教", "醫療", "住宿"];
const RAMP = ["#1d1147", "#51127c", "#832681", "#b73779", "#e75263", "#fc8961", "#fcd38d"];

function rng(seed) {
  return () => {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function gauss(r) { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * r()); }
function inTaiwan(lng, lat) {
  let inside = false;
  for (let i = 0, j = TW.length - 1; i < TW.length; j = i++) {
    const [xi, yi] = TW[i], [xj, yj] = TW[j];
    if ((yi > lat) !== (yj > lat) && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
// Spherical Web Mercator (EPSG:3857) without going through ol.proj for bulk data
const merc = (lng, lat) => [(lng * Math.PI / 180) * 6378137, 6378137 * Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI) / 360))];
const TW_EXT = ol.extent.boundingExtent([merc(120.03, 21.88), merc(122.01, 25.31)]);

// Simulated store locations clustered around cities, flat [x, y, ...] in EPSG:3857; grows on demand.
const POOL = { r: rng(7), n: 0, xy: new Float64Array(0) };
function points(n) {
  if (POOL.n >= n) return POOL.xy;
  const xy = new Float64Array(n * 2), r = POOL.r, wsum = CITIES.reduce((s, c) => s + c[2], 0);
  xy.set(POOL.xy);
  for (let i = POOL.n; i < n;) {
    let lat, lng;
    if (r() < 0.12) { lat = 21.9 + r() * 3.4; lng = 120.05 + r() * 1.95; }
    else {
      let k = r() * wsum, c = CITIES[0];
      for (const cc of CITIES) { k -= cc[2]; if (k <= 0) { c = cc; break; } }
      lat = c[0] + gauss(r) * c[3]; lng = c[1] + gauss(r) * c[3] * 1.1;
    }
    if (!inTaiwan(lng, lat)) continue;
    const [x, y] = merc(lng, lat);
    xy[i * 2] = x; xy[i * 2 + 1] = y; i++;
  }
  POOL.xy = xy; POOL.n = n;
  return xy;
}
// Illustrative hexagon grid over Taiwan with synthetic density / aging attributes (GeoJSON in lon/lat)
function hexGrid(r) {
  const k = Math.cos((23.7 * Math.PI) / 180), w = Math.sqrt(3) * r;
  const rand = rng(42), features = [];
  for (let row = 0, y = 21.85; y < 25.35; row++, y += 1.5 * r) {
    for (let x = 120.0 * k + (row % 2) * (w / 2); x < 122.05 * k; x += w) {
      const lng = x / k, lat = y;
      if (!inTaiwan(lng, lat)) continue;
      let d = 0;
      for (const [cl, cg, cw, cs] of CITIES) d += cw * Math.exp(-((lat - cl) ** 2 + ((lng - cg) * k) ** 2) / (2 * (cs * 2.2) ** 2));
      const density = Math.min(100, d * 82 + rand() * 6);
      const aging = Math.max(8, Math.min(32, 26 - density * 0.16 + gauss(rand) * 2.4));
      const ring = [];
      for (let i = 0; i < 7; i++) { const a = (Math.PI / 180) * (60 * (i % 6) - 30); ring.push([(x + r * Math.cos(a)) / k, y + r * Math.sin(a)]); }
      features.push({ type: "Feature", properties: { id: features.length + 1, density, aging }, geometry: { type: "Polygon", coordinates: [ring] } });
    }
  }
  return { type: "FeatureCollection", features };
}
function quantileBreaks(values, n = 7) {
  const v = [...values].sort((a, b) => a - b), out = [];
  for (let i = 1; i < n; i++) out.push(v[Math.floor((i / n) * v.length)]);
  return out;
}
const fmtLen = (m) => (m >= 1000 ? `${fmt(m / 1000, m >= 100000 ? 0 : 1)} km` : `${fmt(m)} m`);
const fmtArea = (a) => (a >= 1e6 ? `${fmt(a / 1e6, a >= 1e8 ? 0 : 1)} km²` : `${fmt(a)} m²`);
const fmtK = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n));

// TWD97 / TM2 zone 121 (EPSG:3826), registered once so views and transforms can use it.
proj4.defs("EPSG:3826", "+proj=tmerc +lat_0=0 +lon_0=121 +k=0.9999 +x_0=250000 +y_0=0 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs +type=crs");
ol.proj.proj4.register(proj4);
ol.proj.get("EPSG:3826").setExtent([-3000000, -1000000, 3500000, 7000000]);

// ---------- map helpers ----------
const ATTR_OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者';
const ATTR_NE = '<a href="https://openfreemap.org">OpenFreeMap</a> Natural Earth';
// Key-free sources only: OSM standard tiles (a CSS filter on the layer className gives the dark / gray looks) and OpenFreeMap's Natural Earth relief.
const osm = (cls = "olx-std", opts = {}) => new ol.layer.Tile({ className: `ol-layer ${cls}`, source: new ol.source.OSM({ attributions: ATTR_OSM }), ...opts });
const relief = (opts = {}) => new ol.layer.Tile({
  className: "ol-layer olx-relief",
  source: new ol.source.XYZ({ url: "https://tiles.openfreemap.org/natural_earth/ne2sr/{z}/{x}/{y}.png", tileSize: 512, maxZoom: 6, crossOrigin: "anonymous", attributions: ATTR_NE }),
  ...opts,
});
function notice(ctx) {
  if (!ctx.active || ctx.el.querySelector(".olx-note")) return;
  ctx.el.append(h("div", { class: "olx-note", text: "底圖圖磚載入失敗（可能離線或被阻擋），向量圖層仍可正常操作" }));
}
function watchTiles(ctx, layer) {
  layer.getSource().on("tileloaderror", () => notice(ctx));
  return layer;
}
function makeMap(ctx, opts = {}, host = ctx.$(".olx-map")) {
  const map = new ol.Map({ target: host, controls: ol.control.defaults.defaults().extend([new ol.control.ScaleLine()]), ...opts });
  ctx.onCleanup(() => {
    // Grab WebGL contexts (heatmap / WebGL layers) before teardown so none outlive the scene.
    const gls = [...host.querySelectorAll("canvas")].map((c) => c.getContext("webgl2") || c.getContext("webgl")).filter(Boolean);
    map.getAllLayers().forEach((l) => l.dispose());
    map.setTarget(null);
    map.dispose();
    for (const gl of gls) if (!gl.isContextLost()) gl.getExtension("WEBGL_lose_context")?.loseContext();
  });
  ctx.onResize(() => map.updateSize());
  return map;
}
// Left padding that keeps fitted content clear of the bottom-left info box when the stage is wide enough to spare it.
const boxPad = (ctx, min) => {
  const b = ctx.el.querySelector(".olx-box");
  return b && ctx.el.clientWidth - b.offsetWidth > 320 ? b.offsetLeft + b.offsetWidth + 12 : min;
};
const fitTW = (ctx, map, opts = {}) => map.getView().fit(TW_EXT, { padding: [ctx.controls.offsetHeight + 16, 24, 24, boxPad(ctx, 24)], ...opts });
// Open a popup above the point, or flip it below when the top control bar would cover it.
const placePop = (ctx, map, pop, el, at, gap) => {
  const y = map.getPixelFromCoordinate(at)?.[1] ?? Infinity;
  const below = y - gap - (el.offsetHeight || 150) < ctx.controls.offsetHeight + 16;
  el.classList.toggle("below", below);
  pop.setPositioning(below ? "top-center" : "bottom-center");
  pop.setOffset([0, below ? gap : -gap]);
  pop.setPosition(at);
};
function box(ctx, inner, cls = "") {
  const el = h("div", { class: `olx-box ${cls}` });
  el.innerHTML = inner;
  ctx.el.append(el);
  return el;
}
const pick = (el) => (k) => el.querySelector(`[data-k="${k}"]`);
const DARK_FILL = new S.Fill({ color: "#0e1013" });
const halo = (w = 3) => new S.Stroke({ color: "#0e1013", width: w });

// ---------- scenes ----------
Showcase.run({ scenes: [
  {
    id: "layers", title: "圖層切換",
    api: "ol.layer.Tile・Heatmap・Graticule・ol.Overlay・view.animate",
    desc: "原版示範強化：同一份 OSM 圖磚用圖層 className 套 CSS 濾鏡變出深色、灰階，再加 Natural Earth 地形暈渲；高鐵、人口熱區（示意資料）、經緯網三個疊加圖層可獨立開關並共用透明度，點車站用 view.animate 飛過去。",

  {
    id: "style", title: "樣式函式",
    api: "style function・RegularShape・Text・declutter・rotateWithView",
    desc: "樣式是一個函式：依類別回傳三角、方形、星形等 RegularShape，依解析度決定標籤字級與是否顯示；開啟 declutter 後標籤互相避讓。三角與星形設 rotateWithView 會隨地圖旋轉，方形與文字保持正向。",
    hint: "縮放看標籤隨解析度出現；切換「避讓」比較重疊；拖曳「旋轉」或 Alt+Shift 拖曳地圖旋轉。",
    mount(ctx) {
      ctx.html(`<div class="olx-map"></div>`);
      let declutter = true, scale = 1, calls = 0, last = 0, rebuilds = 0;
      ctx.toggle("避讓", true, (v) => { declutter = v; swapLayer(); });
      ctx.slider("符號", { min: 0.6, max: 2, step: 0.1, value: 1, format: (v) => `${v.toFixed(1)}×` }, (v) => { scale = v; cache.clear(); layer.changed(); });

      const SHAPES = {
        "自然": { points: 3, radius: 8, rotateWithView: true },
        "城市": { points: 4, radius: 7, angle: Math.PI / 4 },
        "古蹟": { points: 5, radius: 9, radius2: 4, rotateWithView: true },
      };
      const spotShape = (cat, s) => new S.RegularShape({ ...SHAPES[cat], radius: SHAPES[cat].radius * s, radius2: SHAPES[cat].radius2 && SHAPES[cat].radius2 * s,
        fill: new S.Fill({ color: COLORS[cat] }), stroke: halo(1.5), declutterMode: "obstacle" });
      const hsrShape = (s) => new S.Circle({ radius: 4.5 * s, fill: DARK_FILL, stroke: new S.Stroke({ color: "#f7df1e", width: 2 }), declutterMode: "obstacle" });
      const shopShape = (k, s) => new S.RegularShape({ points: 6, radius: 3.4 * s, fill: new S.Fill({ color: PALETTE[k] }), declutterMode: "none" });

      for (const [name, x, y] of HSR) src.addFeature(new ol.Feature({ type: "hsr", name: `高鐵${name}`, geometry: pt(x, y) }));
      for (const [name, lat, lng] of LABELS) src.addFeature(new ol.Feature({ type: "city", name, geometry: pt(lng, lat) }));

      const cache = new Map();
      function makeStyle(f, type, zb, label) {
        const name = label ? f.get("name") : undefined;
        if (type === "city") {
          return new S.Style({ zIndex: 4, text: new S.Text({ text: name, font: font(Math.min(20, 11 + Math.max(0, zb - 7) * 1.6), 700), fill: new S.Fill({ color: "#ecebe6" }), stroke: halo(3.5) }) });
        }
        if (type === "shop") {
          return new S.Style({ zIndex: 1, image: shopShape(f.get("k"), scale),
            text: name && new S.Text({ text: name, offsetY: 12, font: font(10.5, 500), fill: new S.Fill({ color: "#c9c7c0" }), stroke: halo(2.5) }) });

        const zb = Math.round(view.getZoomForResolution(res)), type = f.get("type");
        const label = type === "city" || (type === "spot" && zb >= 8) || (type === "hsr" && zb >= 9) || (type === "shop" && zb >= 12);
        const key = `${type}|${f.get("cat") ?? f.get("k") ?? ""}|${zb}|${label ? f.get("name") : ""}`;
        let st = cache.get(key);
        if (!st) cache.set(key, (st = makeStyle(f, type, zb, label)));
        return st;
      }

      const view = new ol.View({ center: fromLonLat([120.95, 23.75]), zoom: 7.4, minZoom: 6, maxZoom: 17 });
      const map = makeMap(ctx, { layers: [watchTiles(ctx, osm("olx-dark"))], view });
      let layer = null;
      function swapLayer() {
        if (layer) { map.removeLayer(layer); layer.dispose(); }
        layer = new ol.layer.Vector({ source: src, style: styleFn, declutter, zIndex: 5 });
        map.addLayer(layer);

      map.on("precompose", () => (calls = 0));
      map.on("postcompose", () => { if (calls) { last = calls; rebuilds++; paint(); } });

      const info = box(ctx, `<h4>樣式函式 <small>類別決定形狀，解析度決定標籤</small></h4><div class="olx-legend"></div>
        <div class="olx-props"><span>函式呼叫</span><b data-k="calls" class="hi">--</b><span>快取樣式</span><b data-k="cache">--</b><span>重算次數</span><b data-k="re">--</b><span>縮放</span><b data-k="z">--</b></div>
        <small class="olx-hide-s">平移若沒超出已繪範圍就重用繪製指令，不再呼叫樣式函式；縮放或改樣式才重算。</small>`);
      const $ = pick(info), dpr = window.devicePixelRatio || 1;
      const legend = [["自然", spotShape("自然", 1)], ["城市", spotShape("城市", 1)], ["古蹟", spotShape("古蹟", 1)], ["高鐵", hsrShape(1)], ["店家", shopShape(1, 1.4)]];
      for (const [label, shape] of legend) {

        info.querySelector(".olx-legend").append(h("span", {}, c, label));

      }
      fitTW(ctx, map);
      swapLayer();
      map.on("moveend", paint);
      view.on("change:rotation", () => {
        const d = Math.round((((view.getRotation() * 180) / Math.PI) % 360 + 360) % 360) % 360;
        if (+rot.value !== d) { rot.value = d; rot.nextElementSibling.textContent = `${d}°`; }
      });
    },
  },
  {
    id: "draw", title: "繪圖量測",
    api: "ol.interaction.Draw・Modify・Snap・ol.sphere.getLength / getArea",
    desc: "Draw 畫線段、多邊形或圓，Modify 拖曳節點修改，Snap 讓游標吸附既有頂點。長度與面積用 ol.sphere 依大地線計算，並與 Web 墨卡托平面座標直接算出的數字對照，看出投影放大了多少。",

    mount(ctx) {

      const TYPES = ["LineString", "Polygon", "Circle", null];
      ctx.group(["線段", "多邊形", "圓形", "只編輯"], 0, (i) => setMode(i));
      ctx.button("清除", () => src.clear());

      function measure(g) {
        const t = g.getType();
        if (t === "LineString") { const geo = ol.sphere.getLength(g); return { kind: "線段", geo, flat: g.getLength(), text: fmtLen(geo), f: fmtLen }; }
        if (t === "Polygon") { const geo = ol.sphere.getArea(g); return { kind: "多邊形", geo, flat: g.getArea(), text: fmtArea(geo), f: fmtArea }; }
        const c = g.getCenter(), geo = ol.sphere.getArea(ol.geom.Polygon.fromCircle(g, 128));

      const vertices = (g) => {
        const t = g.getType();
        return t === "Circle" ? new ol.geom.Point(g.getCenter()) : new ol.geom.MultiPoint(t === "Polygon" ? g.getCoordinates()[0] : g.getCoordinates());

          new S.Style({ geometry: labelAt(g), text: new S.Text({ text: measure(g).text, font: `700 12px ${MONO}`, offsetY: -16, fill: DARK_FILL,

          ? new ol.layer.WebGLPoints({ source: src, style: GL_STYLE, disableHitDetection: true })
          : new ol.layer.Vector({ source: src, style: (f) => dots[f.get("k")] });
        map.addLayer(layer);
        // Layers only build their render data while the view is idle, so step out of the simulated drag for one synchronous frame.
        if (dragging) view.endInteraction();
        map.renderSync();
        if (dragging) view.beginInteraction();
        buildMs = performance.now() - t0;
        count = n;
      }
      // Simulate a continuous drag: with the interacting hint set, Canvas replays its draw instructions and WebGL only updates its transform.
      // Start it once the basemap tiles have settled, because OpenLayers stops loading tiles during slow interactive frames.
      // (rendercomplete cannot be used: while the view is not interacting, WebGLPoints rebuilds on every pan and never reports ready.)
      let dragging = false, pending = 0;
      const startDrag = () => { if (!dragging && ctx.active) { view.beginInteraction(); dragging = true; } };
      const tiles = map.getLayers().item(0).getSource();
      tiles.on("tileloadstart", () => pending++);
      tiles.on(["tileloadend", "tileloaderror"], () => { if (--pending === 0) ctx.timeout(() => pending === 0 && startDrag(), 300); });
      ctx.timeout(startDrag, 6000);
      // Pan along a 40 px circle every frame; small offsets keep tiles inside the rendered buffer.
      let ox = 0, oy = 0;
      ctx.raf((t) => {
        const a = t / 700, r = view.getResolution() * 40, x = Math.cos(a) * r, y = Math.sin(a) * r, c = view.getCenter();
        view.setCenter([c[0] + x - ox, c[1] + y - oy]);
        ox = x; oy = y;
      });
      ctx.ramp({
        label: "資料點", unit: "點", steps: [5000, 10000, 25000, 50000, 100000, 200000], minFps: 30,
        apply: (n) => build(n),
        metrics: () => ({ "圖層": kind === "webgl" ? "WebGL" : "Canvas", "建立耗時": fmtMs(buildMs) }),
        note: "建立耗時含產生 ol.Feature、寫入空間索引與第一次同步繪製（WebGL 在 Worker 打包頂點的時間不計入）。Canvas 每幀重播全部點的繪圖指令，WebGL 每幀由 GPU 重畫整批頂點。",
      });
      // At narrow stage widths the lab panel covers the map's left side: keep Taiwan in the visible part.
      const hr = host.getBoundingClientRect(), pr = ctx.el.querySelector(".sc-lab")?.getBoundingClientRect();
      const off = pr ? pr.right - hr.left : 0;
      if (off > 20 && hr.width - off > 160) view.fit(TW_EXT, { padding: [12, 12, 12, off + 12] });
    },
  },
] });
</script>
</body>
</html>
