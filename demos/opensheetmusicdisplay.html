<script>
"use strict";
const O = window.opensheetmusicdisplay;
const XML_URL = "assets/opensheetmusicdisplay/ode-to-joy.musicxml";
const INK = "#000000", HL = "#f72585";
const COLOR_OPTS = { applyToNoteheads: true, applyToStem: true, applyToFlag: true, applyToBeams: false, applyToLedgerLines: false };
const SHARP_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];
const FLAT_NAMES = ["C", "D♭", "D", "E♭", "E", "F", "G♭", "G", "A♭", "A", "B♭", "B"];
const KEY_NAMES = { "-7": "C♭", "-6": "G♭", "-5": "D♭", "-4": "A♭", "-3": "E♭", "-2": "B♭", "-1": "F", 0: "C", 1: "G", 2: "D", 3: "A", 4: "E", 5: "B", 6: "F♯", 7: "C♯" };

// ---------- score helpers ----------
let odeP = null;

}
// One OSMD instance per scene; autoResize off (we re-render from our own ResizeObserver) and no window scrolling.
function make(ctx, host, opts = {}) {

    const nw = el.clientWidth, nh = el.clientHeight;
    if (Math.abs(nw - w) > 3 || (both && Math.abs(nh - hh) > 3)) { w = nw; hh = nh; if (ctx.active) fn(); }

function timed(fn) { const t = performance.now(); fn(); return performance.now() - t; }

function eachGNote(osmd, fn) {

    for (const se of gm.staffEntries) for (const gve of se.graphicalVoiceEntries) for (const gn of gve.notes) fn(gn);

}

// Turn the cursor walk into a playable timeline: one step per cursor position, start time in whole notes.

  const it = c.iterator;
  for (let guard = 0; !it.EndReached && guard < 20000; guard++) {
    const notes = [];
    for (const ve of it.CurrentVoiceEntries) for (const n of ve.Notes) {
      if (n.isRest() || !n.Pitch) continue;
      if (n.NoteTie && n.NoteTie.StartNote !== n) continue; // tied continuation: no new attack
      notes.push({ midi: n.halfTone + 12, len: n.Length.RealValue });

// ---------- audio ----------
let AC = null;
function audio() {

}
// Soft piano-like tone: triangle + octave sine through a closing lowpass.
function tone(midi, when, dur, gain = 0.15) {
  const { ac, out } = AC, f = hz(midi);
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain(), lp = ac.createBiquadFilter(), g = ac.createGain();

  g.gain.exponentialRampToValueAtTime(gain, when + 0.01);
  g.gain.setTargetAtTime(gain * 0.45, when + 0.03, 0.35);
  g.gain.setTargetAtTime(0.0001, when + dur, 0.06);

function canvasIn(ctx, host) {
  const cv = document.createElement("canvas");
  host.append(cv);
  const v = { g: cv.getContext("2d"), w: 1, h: 1 };
  const fit = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    v.w = Math.max(1, host.clientWidth); v.h = Math.max(1, host.clientHeight);
    cv.width = Math.round(v.w * dpr); cv.height = Math.round(v.h * dpr);
    v.g.setTransform(dpr, 0, 0, dpr, 0, 0);

}
function meter(ctx, host) {
  const v = canvasIn(ctx, host), font = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif";
  ctx.raf(() => {
    const { g, w, h } = v;
    g.clearRect(0, 0, w, h);
    if (!AC) {
      g.fillStyle = "#8a8577"; g.font = `11px ${font}`; g.textBaseline = "middle";
      g.fillText("按播放後顯示 AnalyserNode 即時頻譜", 8, h / 2);
      return;
    }
    AC.an.getByteFrequencyData(AC.fq);
    const n = Math.min(96, Math.floor(w / 5)), bw = w / n;
    for (let i = 0; i < n; i++) {
      const a = Math.floor(2 * Math.pow(220, i / n)), b = Math.max(a + 1, Math.floor(2 * Math.pow(220, (i + 1) / n)));

      for (let j = a; j < b; j++) m = Math.max(m, AC.fq[j]);
      const bh = (m / 255) * h;
      if (bh < 0.5) continue;
      g.fillStyle = `hsl(${330 - (i / n) * 140} 80% 52%)`;

}
// Plays a cursor timeline: schedules every note up front, then moves the OSMD cursor in step with
// AudioContext time, colors the notes under it with GraphicalNote.setColor() and scrolls them into view.
function player(ctx, { get, scroller, axis = "y", onState, onStep }) {
  let nodes = [], stopRaf = null, cur = -1, lit = [], bpm = 108;
  const unlight = () => { lit.forEach((g) => g.setColor(INK, COLOR_OPTS)); lit = []; };

    const ce = osmd.cursor.cursorElement;
    if (!ce || !scroller) return;
    const a = ce.getBoundingClientRect(), b = scroller.getBoundingClientRect();
    if (axis === "y") {
      if (a.top < b.top + 4 || a.bottom > b.bottom - 4) scroller.scrollTo({ top: Math.max(0, a.top - b.top + scroller.scrollTop - 24), behavior: "smooth" });
    } else if (a.left < b.left + 20 || a.right > b.right - 60) {
      scroller.scrollTo({ left: Math.max(0, a.left - b.left + scroller.scrollLeft - b.width * 0.25), behavior: "smooth" });
    }
  }
  function mark(osmd, steps) {
    unlight();
    lit = osmd.cursor.GNotesUnderCursor().filter((g) => !g.sourceNote.isRest());
    lit.forEach((g) => g.setColor(HL, COLOR_OPTS));
    follow(osmd);
    if (onStep && steps[cur]) onStep(steps[cur], cur, steps.length);
  }
  function release() {
    nodes.forEach((n) => { try { if (n.stop) n.stop(); } catch (e) { /* already stopped */ } n.disconnect(); });
    nodes = [];
  }
  function stop() {
    release();
    if (stopRaf) { stopRaf(); stopRaf = null; if (onState) onState(false); }
  }
  function start() {
    const { osmd, steps } = get();
    if (!osmd || !steps.length) return;
    stop();
    const a = audio(), W = 240 / bpm, t0 = a.ac.currentTime + 0.08;
    let end = 0;
    for (const s of steps) for (const n of s.notes) {
      nodes.push(...tone(n.midi, t0 + s.t * W, Math.max(0.1, n.len * W * 0.92)));
      end = Math.max(end, (s.t + n.len) * W);
    }
    osmd.cursor.reset(); osmd.cursor.show(); cur = 0; mark(osmd, steps);
    if (onState) onState(true);
    stopRaf = ctx.raf(() => {
      const now = a.ac.currentTime - t0;
      let k = cur;
      while (k + 1 < steps.length && steps[k + 1].t * W <= now) k++;
      if (k > cur) { while (cur < k) { osmd.cursor.next(); cur++; } mark(osmd, steps); }
      if (now > end + 0.3) stop();

  }
  function step() {
    const { osmd, steps } = get();
    if (!osmd || !steps.length) return;
    stop();

    if (cur < 0 || cur >= steps.length - 1) { osmd.cursor.reset(); osmd.cursor.show(); cur = 0; } else { osmd.cursor.next(); cur++; }
    mark(osmd, steps);
    const t0 = a.ac.currentTime + 0.03;

    start, stop, step,
    toggle() { if (stopRaf) stop(); else start(); },
    rewind() { stop(); lit = []; cur = -1; }, // after a re-render the old SVG (and its colors) is gone
    set bpm(v) { bpm = v; },

}
const playLabel = (b) => (on) => (b.textContent = on ? "■ 停止" : "▶ 播放");
const fail = (ctx, what) => (e) => {
  console.error(`[osmd] ${what}`, e);
  if (ctx.active) ctx.status("").error(`${what}失敗：${e && e.message ? e.message : e}`);
};
const CARD = (extra = "", meterOn = false) => `<div class="os-board"><div class="os-card ${extra}"><div class="os-cap"><b class="os-t"></b><span class="os-s"></span><span class="os-r"></span></div><div class="os-scroll"><div class="os-host"></div></div>${meterOn ? '<div class="os-meter"></div>' : ""}</div></div>`;
function caption(ctx) {
  const t = ctx.$(".os-t"), s = ctx.$(".os-s"), r = ctx.$(".os-r");
  return (a, b, c) => { if (a != null) t.textContent = a; if (b != null) s.textContent = b; if (c != null) r.textContent = c; };
}

// ---------- MusicXML generator ----------
function rng(seed) {

    s = (s + 0x6d2b79f5) >>> 0;

const METERS = [
  { label: "4/4", beats: 4, bt: 4, units: 16, strong: [0, 8], mel: [[4, 4, 4, 4], [2, 2, 4, 2, 2, 4], [6, 2, 4, 4], [4, 2, 2, 8], [2, 2, 2, 2, 4, 4], [8, 4, 4], [3, 1, 4, 4, 4]], acc: [[8, 8], [4, 4, 4, 4], [16], [12, 4]] },
  { label: "3/4", beats: 3, bt: 4, units: 12, strong: [0], mel: [[4, 4, 4], [2, 2, 4, 4], [6, 2, 4], [8, 4], [4, 2, 2, 4]], acc: [[12], [4, 4, 4], [8, 4]] },
  { label: "6/8", beats: 6, bt: 8, units: 12, strong: [0, 6], mel: [[4, 2, 4, 2], [6, 6], [2, 2, 2, 6], [4, 2, 2, 2, 2], [6, 4, 2]], acc: [[6, 6], [12], [4, 2, 6]] },
];
const ENSEMBLES = [
  { label: "鋼琴", parts: [{ name: "鋼琴", abbr: "鋼", staves: [["G", 2, 60, 81], ["F", 4, 40, 59]] }] },
  { label: "長笛＋大提琴", parts: [{ name: "長笛", abbr: "長", staves: [["G", 2, 62, 88]] }, { name: "大提琴", abbr: "大提", staves: [["F", 4, 36, 57]] }] },

        const clefs = p.staves.map((st, k) => `<clef${n > 1 ? ` number="${k + 1}"` : ""}><sign>${st[0]}</sign><line>${st[1]}</line></clef>`).join("");

        if (pi === 0) lines.push(`    <direction placement="above"><direction-type><metronome>${tempo}</direction>`);
      }
      p.staves.forEach((st, k) => {
        if (k > 0) lines.push(`    <backup><duration>${M.units}</duration></backup>`);
        for (const [pitch, d] of bars[base + k][m]) lines.push(noteXml(pitch, d, k * 4 + 1, p.staves.length > 1 ? k + 1 : 0));
      });
      if (m === measures - 1) lines.push('    <barline location="right"><bar-style>light-heavy</bar-style></barline>');
      lines.push("  </measure>");
    }
    lines.push("</part>");
    return lines.join("\n");
  });
  const list = ens.parts.map((p, pi) => `  <score-part id="P${pi + 1}"><part-name>${p.name}</part-name><part-abbreviation>${p.abbr}</part-abbreviation></score-part>`);

<score-partwise version="4.0">
<work><work-title>${title}</work-title></work>
<identification><creator type="composer">程式產生（種子 ${seed}）</creator></identification>
<part-list>
${list.join("\n")}
</part-list>
${parts.join("\n")}
</score-partwise>
`;
}

          const tr = timed(() => osmd.render());
          const sh = osmd.Sheet;
          cap(sh.TitleString || "（無標題）", `${sh.Instruments.length} 個聲部・${sh.SourceMeasures.length} 小節・${systemsOf(osmd)} 行`, `載入 ${ms(tl)}・繪製 ${ms(tr)}`);
          warn.className = "os-warn";
          warn.textContent = `${what}：解析成功`;
        }
        ctx.on(ta, "input", () => { clearTimeout(tid); tid = setTimeout(() => ctx.active && show("手動編輯"), 500); });
        regen();
        watch(ctx, host, () => show("重新排版"));
      },
    },
    {
      id: "horiz", title: "單行橫向譜",
      api: "new OpenSheetMusicDisplay(el, { renderSingleHorizontalStaffline: true })・cursor.cursorElement",
      desc: "renderSingleHorizontalStaffline 把整首曲子排成不換行的一條長譜，適合跟著播放捲動的練習介面。播放時游標前進，容器自動橫向捲動讓目前的音保持在左側三分之一。",
      hint: "按播放看橫向自動捲動；關掉「跟隨游標」可以自己用滑鼠滾輪或拖曳捲軸瀏覽。",
      async mount(ctx) {
        ctx.html(CARD("os-hz", true));
        const host = ctx.$(".os-host"), scroller = ctx.$(".os-scroll"), cap = caption(ctx);
        let osmd = null, steps = [], followOn = true;
        const pl = player(ctx, {
          get: () => ({ osmd, steps }), scroller: { getBoundingClientRect: () => scroller.getBoundingClientRect(), scrollTo: (o) => followOn && scroller.scrollTo(o), get scrollLeft() { return scroller.scrollLeft; } },
          axis: "x",
          onState: (on) => playLabel(playBtn)(on),
          onStep: (s) => cap(null, null, `第 ${s.m + 1} 小節・${s.notes.map((x) => noteName(x.midi)).join(" ")}`),
        });
        const playBtn = ctx.button("▶ 播放", () => pl.toggle(), { primary: true });
        ctx.toggle("跟隨游標", followOn, (v) => (followOn = v));
        ctx.slider("速度", { min: 60, max: 180, step: 4, value: 120, format: (v) => `${v} BPM` }, (v) => (pl.bpm = v));
        pl.bpm = 120;
        meter(ctx, ctx.$(".os-meter"));
        // Vertical wheel scrolls the long staffline sideways.
        ctx.on(scroller, "wheel", (e) => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { scroller.scrollLeft += e.deltaY; e.preventDefault(); } }, { passive: false });
        const s = ctx.status("載入 MusicXML…");
        const xml = await ode();
        if (!ctx.active) return;
        osmd = make(ctx, host, { renderSingleHorizontalStaffline: true, drawTitle: false, drawComposer: false, drawLyricist: false, drawCredits: false, cursorsOptions: [{ type: 0, color: "#f72585", alpha: 0.35, follow: false }] });
        await osmd.load(xml);
        if (!ctx.active) return;
        const draw = () => {
          pl.rewind();
          osmd.zoom = Math.max(0.55, Math.min(1.1, (scroller.clientHeight - 10) / 250));
          const tr = timed(() => osmd.render());
          osmd.cursor.show();
          steps = timeline(osmd);
          const svg = host.querySelector("svg");
          cap(osmd.Sheet.TitleString, `一行 ${osmd.Sheet.SourceMeasures.length} 小節・寬 ${Showcase.fmt(Math.round(svg ? +svg.getAttribute("width") : 0))} px・縮放 ${Math.round(osmd.zoom * 100)}%・繪製 ${ms(tr)}`, "按播放開始");
          scroller.scrollLeft = 0;
        };
        draw();
        s.done();
        watch(ctx, scroller, draw, true);
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "osmd.load(N 小節的 MusicXML 字串)・osmd.render()",
      desc: "程式產生 N 小節的 MusicXML，計時 OSMD 從解析 XML、建立樂譜模型、計算排版到寫出 SVG 的完整流程。右側顯示最後一次的結果。",
      hint: "按「開始測試」逐級加大小節數；右下可切換鋼琴雙譜表或弦樂四重奏（四個譜表，每小節的排版工作約加倍）。",
      mount(ctx) {
        ctx.html(`<div class="os-stress os-card"><div class="os-cap"><b class="os-t">尚未測試</b><span class="os-s"></span></div><div class="os-scroll"><div class="os-host"></div></div></div>`);
        ctx.controls.classList.add("bottom");
        const host = ctx.$(".os-host"), cap = caption(ctx);
        let ens = 0;
        ctx.group(["鋼琴雙譜表", "弦樂四重奏"], 0, (i) => (ens = i));
        let osmd = null;
        ctx.onCleanup(() => { if (osmd) osmd.clear(); });
        ctx.bench({
          label: "小節數", unit: "小節", sizes: [16, 64, 256, 512, 1024, 2048, 4096],
          prepare: (n) => genXML({ ens: ENSEMBLES[ens === 0 ? 0 : 2], meter: METERS[0], fifths: 2, measures: n, seed: 2024, title: `${n} 小節壓力測試` }),
          async run(n, xml) {
            if (osmd) osmd.clear();
            host.textContent = "";
            osmd = new O.OpenSheetMusicDisplay(host, { autoResize: false, autoBeam: true, drawPartNames: ens === 1, drawTitle: true, drawComposer: false });
            osmd.zoom = 0.6;
            let tl = performance.now();
            await osmd.load(xml);
            tl = performance.now() - tl;
            const tr = timed(() => osmd.render());
            const sys = systemsOf(osmd);
            cap(`${n} 小節・${sys} 行`, `${ens ? "四個譜表" : "兩個譜表"}・XML ${Showcase.fmtCompact(xml.length)} 字元・${Showcase.fmtCompact(svgCount(host))} 個 SVG 元素`);
            return `載入 ${ms(tl)}・繪製 ${ms(tr)}`;
          },
          note: "載入包含 XML 解析與建立樂譜模型；繪製包含 VexFlow 音符格式化、自動符槓、天際線碰撞計算與換行，通常是主要瓶頸，大致隨小節數與譜表數線性成長。超過 2 秒的級距之後略過。",
        });
      },
    },
  ],
});
</script>
</body>
</html>
