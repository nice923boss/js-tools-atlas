<script src="https://cdn.jsdelivr.net/npm/opentype.js@2.0.0/dist/opentype.min.js"></script>

<script>
// opentype.js showcase: eight scenes from the particle lettering demo to a getPath throughput benchmark.
const rootCss = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => rootCss.getPropertyValue(v).trim());
const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
const MONO = rootCss.getPropertyValue("--mono").trim() || "ui-monospace, monospace";
const MUTED = "#9b998f";
const cssFont = (weight, px, mono) => `${weight} ${px}px ${mono ? MONO : FONT}`;
const { fmt, fmtCompact, fmtMs } = Showcase;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;

// Small rounded caption drawn on a canvas (CSS pixels). fit = canvas width to keep it on screen.
function tag(g, text, x, y, { color = "#e8e6df", size = 11, align = "center", mono = true, fit = 0 } = {}) {
  g.font = cssFont(600, size, mono);
  const w = g.measureText(text).width + 10, hh = size + 8;
  let left = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  if (fit) left = clamp(left, 4, fit - w - 4);
  g.fillStyle = "rgba(14,16,19,.8)";
  g.beginPath(); g.roundRect(left, y - hh / 2, w, hh, 5); g.fill();
  g.fillStyle = color; g.textAlign = "left"; g.textBaseline = "middle";
  g.fillText(text, left + 5, y + 0.5);
}
function dashed(g, x1, y1, x2, y2, color = "rgba(255,255,255,.25)") {
  g.save(); g.setLineDash([5, 5]); g.strokeStyle = color; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); g.restore();
}
// Canvas filling `host` with DPR capped at 2; onFit runs after every size change (and once at start).
function canvasIn(ctx, host, onFit) {
  const cv = document.createElement("canvas");
  host.append(cv);
  const v = { cv, g: cv.getContext("2d"), w: 0, h: 0 };
  const fit = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    v.w = host.clientWidth; v.h = host.clientHeight;
    cv.width = Math.max(1, Math.round(v.w * dpr)); cv.height = Math.max(1, Math.round(v.h * dpr));
    v.g.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit();
  const ro = new ResizeObserver(() => { if (!ctx.active) return; fit(); onFit(); });
  ro.observe(host);
  ctx.onCleanup(() => ro.disconnect());
  return v;
}

// ---------- font loading ----------
const FS = "https://cdn.jsdelivr.net/npm/@fontsource";
// Latin fonts whose GSUB/GPOS lookups opentype.js 2.0 can apply (kerning via GPOS pair lookups, liga via GSUB).
const LATIN = { "PT Serif": "pt-serif", Lato: "lato", "Abril Fatface": "abril-fatface", "Libre Baskerville": "libre-baskerville", "Cormorant Garamond": "cormorant-garamond", "Crimson Text": "crimson-text", Pacifico: "pacifico" };
const latinUrl = (name) => `${FS}/${LATIN[name]}@5.3.0/files/${LATIN[name]}-latin-400-normal.woff`;
const TC_CSS = `${FS}/noto-sans-tc@5.3.0/900.css`;
const tcUrl = (chunk) => `${FS}/noto-sans-tc@5.3.0/files/noto-sans-tc-${chunk}-900-normal.woff`;
const WOFF = 0x774f4646, WOFF2 = 0x774f4632;
const FORMAT = { [WOFF]: "WOFF", 0x00010000: "TrueType", 0x74727565: "TrueType", 0x4f54544f: "OpenType（CFF）" };

// opentype.js's bundled inflater rejects a few fontsource WOFF chunks ("Data error");
// unpack those with the browser's native DecompressionStream into a plain SFNT and parse again.
async function woffToSfnt(ab) {
  const src = new DataView(ab), bytes = new Uint8Array(ab);
  const n = src.getUint16(12), tables = [];
  for (let i = 0; i < n; i++) {
    const o = 44 + i * 20;
    const off = src.getUint32(o + 4), comp = src.getUint32(o + 8), orig = src.getUint32(o + 12);
    const raw = bytes.subarray(off, off + comp);
    const data = comp < orig
      ? new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer())
      : raw;
    tables.push({ tag: src.getUint32(o), sum: src.getUint32(o + 16), data });
  }
  let size = 12 + 16 * n;
  for (const t of tables) size += (t.data.length + 3) & ~3;
  const out = new Uint8Array(size), dv = new DataView(out.buffer);
  const es = Math.floor(Math.log2(n)), sr = 16 * 2 ** es;
  dv.setUint32(0, src.getUint32(4)); dv.setUint16(4, n); dv.setUint16(6, sr); dv.setUint16(8, es); dv.setUint16(10, n * 16 - sr);
  let p = 12 + 16 * n;
  tables.forEach((t, i) => {
    const r = 12 + i * 16;
    dv.setUint32(r, t.tag); dv.setUint32(r + 4, t.sum); dv.setUint32(r + 8, p); dv.setUint32(r + 12, t.data.length);
    out.set(t.data, p); p += (t.data.length + 3) & ~3;
  });
  return out.buffer;
}
async function parseFont(ab) {
  try { return opentype.parse(ab); } catch (e) {
    if (ab.byteLength < 44 || new DataView(ab).getUint32(0) !== WOFF) throw e;
    return opentype.parse(await woffToSfnt(ab));
  }
}
const fontInfo = new WeakMap(); // Font -> { bytes, ms, magic }
async function parseTimed(ab) {
  const t0 = performance.now();
  const font = await parseFont(ab);
  fontInfo.set(font, { bytes: ab.byteLength, ms: performance.now() - t0, magic: new DataView(ab).getUint32(0) });
  return font;
}
const fontCache = new Map();
function loadFont(url) {
  if (!fontCache.has(url)) {
    const p = fetch(url).then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status}：${url.split("/").pop()}`);
      return r.arrayBuffer();
    }).then(parseTimed);
    p.catch(() => fontCache.delete(url));
    fontCache.set(url, p);
  }
  return fontCache.get(url);
}
const latinFont = (name) => loadFont(latinUrl(name));
// Noto Sans TC is split by fontsource into ~100 unicode-range chunks; read the ranges once from its CSS.
let tcIndex = null;
function tcChunks() {
  if (!tcIndex) {
    tcIndex = fetch(TC_CSS).then((r) => {
      if (!r.ok) throw new Error(`HTTP ${r.status}：900.css`);
      return r.text();
    }).then((text) => {
      const re = /files\/noto-sans-tc-(\w+)-900-normal\.woff\) format\('woff'\);\s*unicode-range:\s*([^;]+);/g;
      return [...text.matchAll(re)].map((m) => ({
        name: m[1],
        ranges: m[2].split(",").map((s) => { const [a, b] = s.trim().slice(2).split("-"); return [parseInt(a, 16), parseInt(b || a, 16)]; }),
      }));
    });
    tcIndex.catch(() => { tcIndex = null; });
  }
  return tcIndex;
}
// Resolve every character to the chunk font that holds it, downloading only the chunks needed.
async function tcGlyphs(text) {
  const list = await tcChunks();
  const chars = [...text];
  const names = chars.map((ch) => {
    const cp = ch.codePointAt(0);
    return list.find((c) => c.ranges.some(([a, b]) => cp >= a && cp <= b))?.name;
  });
  const fonts = await Promise.all(names.map((n) => (n ? loadFont(tcUrl(n)) : null)));
  return chars.map((ch, i) => ({ ch, font: fonts[i] }));
}
// Lay out per-character fonts on one baseline (font units scaled to `size`).
function layoutRun(items, size) {
  let x = 0;
  return items.map((it) => {
    const glyph = it.font && it.font.charToGlyphIndex(it.ch) > 0 ? it.font.charToGlyph(it.ch) : null;
    const adv = glyph ? glyph.advanceWidth * size / it.font.unitsPerEm : size * 0.4;
    const out = { ...it, glyph, x, adv };
    x += adv;
    return out;
  });
}
// Sample path commands into evenly spaced points along every segment.
function sample(cmds, step) {
  const pts = [];
  let cx = 0, cy = 0, sx = 0, sy = 0;
  const seg = (f) => {
    let len = 0, px = cx, py = cy;
    for (let i = 1; i <= 8; i++) { const [x, y] = f(i / 8); len += Math.hypot(x - px, y - py); px = x; py = y; }
    const n = Math.max(1, Math.round(len / step));
    for (let i = 1; i <= n; i++) pts.push(f(i / n));
  };
  for (const c of cmds) {
    const x0 = cx, y0 = cy;
    if (c.type === "M") { cx = sx = c.x; cy = sy = c.y; pts.push([cx, cy]); continue; }
    if (c.type === "L") seg((t) => [x0 + (c.x - x0) * t, y0 + (c.y - y0) * t]);
    else if (c.type === "Q") seg((t) => { const u = 1 - t; return [u * u * x0 + 2 * u * t * c.x1 + t * t * c.x, u * u * y0 + 2 * u * t * c.y1 + t * t * c.y]; });
    else if (c.type === "C") seg((t) => { const u = 1 - t; return [u * u * u * x0 + 3 * u * u * t * c.x1 + 3 * u * t * t * c.x2 + t * t * t * c.x, u * u * u * y0 + 3 * u * u * t * c.y1 + 3 * u * t * t * c.y2 + t * t * t * c.y]; });
    else if (c.type === "Z") { seg((t) => [x0 + (sx - x0) * t, y0 + (sy - y0) * t]); cx = sx; cy = sy; continue; }
    cx = c.x; cy = c.y;
  }
  return pts;
}
// opentype.js 2.0's roundDecimal turns float noise such as 124.00000000000001 into "NaN" inside
// toPathData / toSVG, so canvases build Path2D straight from the commands...
function toPath2D(path) {
  const p = new Path2D();
  for (const c of path.commands) {
    if (c.type === "M") p.moveTo(c.x, c.y);
    else if (c.type === "L") p.lineTo(c.x, c.y);
    else if (c.type === "Q") p.quadraticCurveTo(c.x1, c.y1, c.x, c.y);
    else if (c.type === "C") p.bezierCurveTo(c.x1, c.y1, c.x2, c.y2, c.x, c.y);
    else if (c.type === "Z") p.closePath();
  }
  return p;
}
// ...and SVG export first snaps every coordinate to a 1e-4 grid (a copy; the source path is untouched).
function snapPath(path) {
  const out = new opentype.Path();
  out.commands = path.commands.map((c) => Object.fromEntries(Object.entries(c).map(([k, v]) => [k, typeof v === "number" ? Math.round(v * 1e4) / 1e4 : v])));
  out.fill = path.fill;
  return out;
}
const fill = (g, path, color) => { g.fillStyle = color; g.fill(toPath2D(path)); };

Showcase.run({ scenes: [
  {
    id: "particles", title: "粒子字",
    api: "glyph.getPath(x, y, fontSize).commands",
    desc: "從思源黑體的分段字型檔解析出每個字的向量輪廓，沿 M／L／Q／C 指令均勻取樣成粒子；切到「向量輪廓」可看 TrueType 的二次曲線控制點。",
    hint: "滑鼠或手指撥開粒子；在輸入框打幾個中文按 Enter 換字",
    async mount(ctx) {
      ctx.el.classList.add("glow");
      ctx.html(`<div class="ot-fill cv-host"></div><div class="info"></div>`);
      const WORDS = ["字形向量", "台灣好字", "點線成面", "你好世界"];
      const host = ctx.$(".ot-fill"), info = ctx.$(".info");
      let mode = 0, wordIdx = 0, items = null, paths = [], particles = [], seq = 0;
      const mouse = { x: -1e4, y: -1e4 };
      const v = canvasIn(ctx, host, layout);
      ctx.group(["粒子", "向量輪廓"], 0, (i) => (mode = i));
      const input = Showcase.h("input", { class: "txt-in", type: "text", maxlength: "6", placeholder: "輸入中文", "aria-label": "自訂文字" });
      ctx.controls.append(input);
      ctx.on(input, "keydown", (e) => { if (e.key === "Enter" && !e.isComposing && input.value.trim()) setWord(input.value.trim()); });
      ctx.button("換字", () => { wordIdx = (wordIdx + 1) % WORDS.length; setWord(WORDS[wordIdx]); }, { primary: true });
      ctx.on(host, "pointermove", (e) => { const r = host.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
      ctx.on(host, "pointerleave", () => { mouse.x = mouse.y = -1e4; });

      async function setWord(text) {
        const my = ++seq;
        info.textContent = "下載這些字所在的字型分段…";
        try {
          const res = await tcGlyphs([...text].slice(0, 6).join(""));
          if (my === seq && ctx.active) { items = res; layout(); }
        } catch (e) {
          if (my === seq) info.textContent = `字型載入失敗：${e.message}`;
        }
      }
      function layout() {
        if (!items) return;
        const { w: W, h: H } = v;
        const top = belowControls(ctx), bottom = H - (W <= 560 ? 72 : 46);
        const size = Math.max(28, Math.min((W - 40) / Math.max(1, items.length), (bottom - top) * 0.75, 220));
        const run = layoutRun(items, size);
        const last = run[run.length - 1];
        const ox = (W - (last ? last.x + last.adv : 0)) / 2, baseline = (top + bottom) / 2 + size * 0.36;
        paths = run.filter((r) => r.glyph).map((r) => r.glyph.getPath(ox + r.x, baseline, size));
        const cmdCount = paths.reduce((s, p) => s + p.commands.length, 0);
        // re-target particles: reuse old ones so the characters morph into each other
        const pts = paths.flatMap((p) => sample(p.commands, Math.max(2.6, size / 50)));
        for (let i = 0; i < pts.length; i++) {
          const p = particles[i] || (particles[i] = { x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0 });
          p.hx = pts[i][0]; p.hy = pts[i][1]; p.dead = false;

        infoEl.innerHTML = `<h3>${esc(name("fullName") || fileName)}</h3>
          <div class="mt-sub">${FORMAT[meta.magic] || "未知格式"} · <b>${fmt(meta.bytes / 1024, 1)}</b> KB · 解析 <b>${fmtMs(meta.ms)}</b> · ${esc(fileName)}</div>
          <div class="mt-sec">name 表</div><dl class="kv">${names}</dl>
          <div class="mt-sec">度量（字型單位）</div><div class="mt-metrics">${cells}</div>
          <div class="mt-sec">OpenType 表 ${tables.length} 個</div><div class="mt-tables">${tables.map((t) => `<span>${esc(t)}</span>`).join("")}</div>`;
      }
      const CELL = 58;
      const grid = () => {
        const cols = Math.max(1, Math.floor((v.w - 8) / CELL)), rows = Math.max(1, Math.floor((v.h - 8) / (CELL + 4)));
        return { cols, per: cols * rows };
      };
      const pages = () => (font ? Math.max(1, Math.ceil(font.glyphs.length / grid().per)) : 1);
      function drawGrid() {
        const { g, w, h } = v;
        g.clearRect(0, 0, w, h);
        if (!font) return;
        const { cols, per } = grid();
        page = Math.min(page, pages() - 1);
        const start = page * per, end = Math.min(font.glyphs.length, start + per);
        headEl.textContent = `glyph ${start}～${end - 1}，共 ${fmt(font.glyphs.length)} 個（第 ${page + 1}／${pages()} 頁）`;
        const cw = (w - 8) / cols, upm = font.unitsPerEm;
        const size = (CELL - 20) * upm / (font.ascender - font.descender), sc = size / upm;
        g.font = cssFont(500, 9, true); g.textBaseline = "alphabetic"; g.textAlign = "left";
        for (let i = start; i < end; i++) {
          const k = i - start, cx = 4 + (k % cols) * cw, cy = 4 + Math.floor(k / cols) * (CELL + 4);
          g.fillStyle = "rgba(255,255,255,.04)"; g.fillRect(cx + 2, cy, cw - 4, CELL);
          const gl = font.glyphs.get(i);
          fill(g, gl.getPath(cx + (cw - gl.advanceWidth * sc) / 2, cy + 4 + font.ascender * sc, size), "#ecebe6");
          g.fillStyle = MUTED; g.fillText(String(i), cx + 5, cy + CELL - 4);
        }
      }
      const st = ctx.status("下載字型…");
      await show(latinFont("PT Serif"), latinUrl("PT Serif").split("/").pop());
      st.done();
    },
  },
  {
    id: "svg", title: "匯出 SVG",
    api: "path.extend(glyphPath)／path.toSVG({ decimalPlaces, optimize, flipY })",
    desc: "把文字轉成一條 SVG 路徑：中文逐字從所屬分段取 glyph 再用 extend 合併，英文直接 font.getPath；拉動小數位數看檔案大小怎麼變，可下載成 .svg。",
    hint: "改輸入框的文字；拉「小數位數」比較檔案大小",
    async mount(ctx) {
      ctx.html(`<div class="board"><div class="sv-wrap">
        <div class="sv-bar"><input class="txt-in" type="text" maxlength="12" aria-label="要轉成路徑的文字"><button class="btn primary" type="button">下載 SVG</button><span class="sv-stats"></span></div>
        <div class="sv-prev cardx"></div><pre class="sv-code cardx"></pre></div></div>`);
      const SETS = [{ label: "思源黑體", text: "點線成面" }, { label: "PT Serif", name: "PT Serif", text: "Typeface" }, { label: "Pacifico", name: "Pacifico", text: "Taipei 101" }];
      let set = SETS[0], dp = 1, optimize = true, path = null, svg = "", seq = 0;
      const input = ctx.$(".sv-bar input"), prev = ctx.$(".sv-prev"), code = ctx.$(".sv-code"), stats = ctx.$(".sv-stats");
      input.value = set.text;
      ctx.group(SETS.map((s) => s.label), 0, (i) => { set = SETS[i]; input.value = set.text; build(); });
      ctx.slider("小數位數", { min: 0, max: 4, step: 1, value: dp }, (val) => { dp = val; render(); });
      ctx.toggle("optimize", true, (val) => { optimize = val; render(); });
      ctx.on(input, "input", () => build());
      ctx.on(ctx.$(".sv-bar .btn"), "click", () => {
        if (!svg) return;
        const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
        const a = Showcase.h("a", { href: url, download: "opentype-text.svg" });
        a.click();
        ctx.timeout(() => URL.revokeObjectURL(url), 1000);
      });
      async function build() {
        const my = ++seq, text = input.value, size = 100;
        try {
          let p;
          if (set.name) {
            const f = await latinFont(set.name);
            if (my !== seq || !ctx.active) return;
            p = f.getPath(text, 0, size, size, { kerning: true });
          } else {
            const items = await tcGlyphs(text);
            if (my !== seq || !ctx.active) return;
            p = new opentype.Path();
            for (const r of layoutRun(items, size)) if (r.glyph) p.extend(r.glyph.getPath(r.x, size, size));
          }
          path = p;
          render();
        } catch (e) {
          if (my === seq) stats.textContent = `字型載入失敗：${e.message}`;
        }
      }
      function render() {
        if (!path) return;
        if (!path.commands.length) { svg = ""; prev.innerHTML = ""; code.textContent = "（沒有可轉換的字）"; stats.textContent = ""; return; }
        const bb = path.getBoundingBox(), pad = 6;
        const vb = [bb.x1 - pad, bb.y1 - pad, bb.x2 - bb.x1 + pad * 2, bb.y2 - bb.y1 + pad * 2].map((n) => +n.toFixed(1)).join(" ");
        path.fill = C[0];
        svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}">${snapPath(path).toSVG({ decimalPlaces: dp, optimize, flipY: false })}</svg>`;
        prev.innerHTML = svg;
        code.textContent = svg.length > 1600 ? `${svg.slice(0, 1600)}…` : svg;
        stats.innerHTML = `<b>${fmt(new Blob([svg]).size)}</b> bytes · 路徑指令 <b>${fmt(path.commands.length)}</b> 個`;
      }
      const st = ctx.status("下載字型…");
      await build();
      st.done();
    },
  },
  {
    id: "create", title: "建立字型",
    api: "new opentype.Font({ glyphs })／font.toArrayBuffer()",
    desc: "用 new opentype.Path 畫出 5×7 點陣字，組成 opentype.Glyph 與 Font，再用 toArrayBuffer 輸出 OpenType 檔；右側的字由瀏覽器 FontFace 直接載入這個剛產生的字型來顯示。",
    hint: "點格子編輯字形，右側即時更新；可下載 .otf",
    mount(ctx) {
      ctx.html(`<div class="board"><div class="cr-wrap">
        <div class="cr-edit cardx"><div class="cr-chars"></div><div class="cr-grid"></div></div>
        <div class="cr-out cardx"><div class="cr-prev">TAIPEI 101</div><div class="cr-row">PIE · TEA · TAPE · 1010</div><div class="cr-stats"></div></div></div></div>`);
      const CHARS = [
        ["T", "T", ["#####", "..#..", "..#..", "..#..", "..#..", "..#..", "..#.."]],
        ["A", "A", [".###.", "#...#", "#...#", "#####", "#...#", "#...#", "#...#"]],
        ["I", "I", [".###.", "..#..", "..#..", "..#..", "..#..", "..#..", ".###."]],
        ["P", "P", ["####.", "#...#", "#...#", "####.", "#....", "#....", "#...."]],
        ["E", "E", ["#####", "#....", "#....", "####.", "#....", "#....", "#####"]],
        ["1", "one", ["..#..", ".##..", "..#..", "..#..", "..#..", "..#..", ".###."]],
        ["0", "zero", [".###.", "#...#", "#..##", "#.#.#", "##..#", "#...#", ".###."]],
      ].map(([ch, name, rows]) => ({ ch, name, bits: rows.join("").split("").map((c) => c === "#") }));
      let sel = 0, shape = 0, face = null, builds = 0, seq = 0, buffer = null;
      const chipsEl = ctx.$(".cr-chars"), gridEl = ctx.$(".cr-grid"), stats = ctx.$(".cr-stats");
      const prevEls = [ctx.$(".cr-prev"), ctx.$(".cr-row")];
      ctx.group(["方塊", "圓點"], 0, (i) => { shape = i; gridEl.classList.toggle("dots", i === 1); rebuild(); });
      ctx.button("下載 .otf", () => {
        if (!buffer) return;
        const url = URL.createObjectURL(new Blob([buffer], { type: "font/otf" }));
        Showcase.h("a", { href: url, download: "TaipeiPixel-Regular.otf" }).click();
        ctx.timeout(() => URL.revokeObjectURL(url), 1000);
      }, { primary: true });
      ctx.on(chipsEl, "click", (e) => { const b = e.target.closest("[data-c]"); if (b) { sel = +b.dataset.c; editor(); } });
      ctx.on(gridEl, "click", (e) => {
        const b = e.target.closest("[data-k]");
        if (!b) return;
        const bits = CHARS[sel].bits, k = +b.dataset.k;
        bits[k] = !bits[k];
        b.classList.toggle("on", bits[k]);
        rebuild();
      });
      ctx.onCleanup(() => { if (face) document.fonts.delete(face); });

      function editor() {
        chipsEl.innerHTML = CHARS.map((c, i) => `<button class="btn" type="button" data-c="${i}" aria-pressed="${i === sel}">${c.ch}</button>`).join("");
        gridEl.innerHTML = CHARS[sel].bits.map((on, k) => `<button type="button" class="cell${on ? " on" : ""}" data-k="${k}" aria-label="第 ${Math.floor(k / 5) + 1} 列第 ${k % 5 + 1} 欄"></button>`).join("");
      }
      // One 100-unit cell per pixel; y grows upward from the baseline in font units.
      function pixelPath(bits) {
        const p = new opentype.Path();
        bits.forEach((on, k) => {
          if (!on) return;
          const x = 50 + (k % 5) * 100, y = 600 - Math.floor(k / 5) * 100;
          if (shape === 0) { p.moveTo(x, y); p.lineTo(x + 100, y); p.lineTo(x + 100, y + 100); p.lineTo(x, y + 100); p.close(); return; }
          const cx = x + 50, cy = y + 50, r = 44, q = r * 0.5523;
          p.moveTo(cx + r, cy);
          p.curveTo(cx + r, cy + q, cx + q, cy + r, cx, cy + r); p.curveTo(cx - q, cy + r, cx - r, cy + q, cx - r, cy);
          p.curveTo(cx - r, cy - q, cx - q, cy - r, cx, cy - r); p.curveTo(cx + q, cy - r, cx + r, cy - q, cx + r, cy);
          p.close();
        });
        return p;
      }
      function notdefPath() {
        const p = new opentype.Path();
        p.moveTo(50, 0); p.lineTo(550, 0); p.lineTo(550, 700); p.lineTo(50, 700); p.close();
        p.moveTo(100, 50); p.lineTo(100, 650); p.lineTo(500, 650); p.lineTo(500, 50); p.close();
        return p;
      }
      async function rebuild() {
        const my = ++seq, t0 = performance.now();
        const glyphs = [
          new opentype.Glyph({ name: ".notdef", advanceWidth: 600, path: notdefPath() }),
          new opentype.Glyph({ name: "space", unicode: 32, advanceWidth: 600, path: new opentype.Path() }),
          ...CHARS.map((c) => new opentype.Glyph({ name: c.name, unicode: c.ch.charCodeAt(0), advanceWidth: 600, path: pixelPath(c.bits) })),
        ];
        const font = new opentype.Font({ familyName: "Taipei Pixel", styleName: "Regular", unitsPerEm: 1000, ascender: 800, descender: -200, glyphs });
        const ab = font.toArrayBuffer(), ms = performance.now() - t0;
        const back = opentype.parse(ab);
        const fam = `TaipeiPixel${++builds}`, next = new FontFace(fam, ab);
        try { await next.load(); } catch (e) {
          if (my === seq) stats.textContent = `瀏覽器無法載入產生的字型：${e.message}`;
          return;
        }
        if (my !== seq || !ctx.active) return;
        document.fonts.add(next);
        if (face) document.fonts.delete(face);
        face = next; buffer = ab;
        prevEls.forEach((el) => (el.style.fontFamily = `"${fam}", sans-serif`));
        stats.innerHTML = `toArrayBuffer() 產生 <b>${fmt(ab.byteLength)}</b> bytes（<b>${fmtMs(ms)}</b>）· 再用 opentype.parse 讀回：<b>${back.glyphs.length}</b> 個 glyph、<b>${back.outlinesFormat}</b> 外框`;
      }
      editor();
      return rebuild();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "font.getPath(line, x, y, size, { kerning, features })／path.draw(ctx)",
    desc: "把台灣縣市的英文名排成每行 64 字，逐級加大總字數呼叫 getPath（查 cmap、套 GSUB 連字與 GPOS 字距、組出路徑指令），可選擇連同 Canvas 繪製一起計時。",
    hint: "按「開始測試」；切換模式或關掉字距與連字再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="stress-stage cardx cv-host"></div>`);
      const PLACES = "Taipei Keelung Taoyuan Hsinchu Miaoli Taichung Changhua Nantou Yunlin Chiayi Tainan Kaohsiung Pingtung Yilan Hualien Taitung Penghu Kinmen Matsu ";
      let render = true, shaping = true, font = null;
      const v = canvasIn(ctx, ctx.$(".stress-stage"), preview);
      ctx.controls.classList.add("bottom");
      ctx.group(["只算 getPath", "getPath＋繪製"], 1, (i) => (render = i === 1));
      ctx.toggle("字距＋連字", true, (val) => (shaping = val));
      const options = () => (shaping ? { kerning: true, features: { liga: true, rlig: true } } : { kerning: false, features: { liga: false, rlig: false } });
      function preview() {
        const { g, w, h } = v;
        g.clearRect(0, 0, w, h);
        if (!font) return;
        const lines = PLACES.repeat(4).match(/.{1,64}/g);
        for (let r = 0; r * 24 + 30 < h && r < lines.length; r++) {
          const p = font.getPath(lines[r], 12, 30 + r * 24, 18, options());
          p.fill = r ? "rgba(236,235,230,.25)" : C[1];
          p.draw(g);
        }
        tag(g, "PT Serif · 18px · 每行 64 字", 10, h - 16, { align: "left", mono: false });
      }
      const st = ctx.status("下載字型…");
      font = await latinFont("PT Serif");
      st.done();
      preview();
      ctx.bench({
        label: "字數", unit: "字",
        sizes: [1000, 5000, 20000, 50000, 100000, 200000, 500000],
        prepare(n) {
          const all = PLACES.repeat(Math.ceil(n / PLACES.length)).slice(0, n), lines = [];
          for (let i = 0; i < n; i += 64) lines.push(all.slice(i, i + 64));
          return lines;
        },
        run(n, lines) {
          const { g, w, h } = v, opts = options(), rows = Math.max(1, Math.floor((h - 16) / 24));
          let cmds = 0;
          if (render) g.clearRect(0, 0, w, h);
          for (let i = 0; i < lines.length; i++) {
            const r = i % rows;
            if (render && r === 0 && i) { g.fillStyle = "rgba(14,16,19,.85)"; g.fillRect(0, 0, w, h); }
            const p = font.getPath(lines[i], 12, 26 + r * 24, 18, opts);
            cmds += p.commands.length;
            if (render) { p.fill = C[i % 6]; p.draw(g); }
          }
          return `${fmtCompact(cmds)} 個指令`;
        },
        note: "每個字都要經過 cmap 查 glyph、GSUB 連字替換、GPOS 字距查表，再把 TrueType 二次曲線點轉成路徑指令物件；大量字數時瓶頸多在物件配置與垃圾回收。「getPath＋繪製」另含 Canvas 填色，關掉「字距＋連字」可看出排版查表占多少成本。",
      });
    },
  },
] });
</script>
