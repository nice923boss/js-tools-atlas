<script>
// p2.js showcase: eight scenes from the original suspension bridge to a body-count stress ramp.
// World units are meters with y pointing up; lab() maps them to canvas pixels.
const { vec2 } = p2;
const SH = p2.Shape;
const TAU = Math.PI * 2;
const COLORS = ["#f72585", "#ffb703", "#4cc9f0", "#7bd389", "#9d8cff", "#ff7b54"];
const MUTED = "#9b998f", STEEL = "#4a5262", INK = "#e8e6df", AMBER = "#ffb703";
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
const MONO = rootCss.getPropertyValue("--mono").trim() || "ui-monospace, monospace";
const font = (weight, px, mono) => `${weight} ${px}px ${mono ? MONO : FONT}`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const below = (ctx) => ctx.controls.offsetHeight + 20;

// Rounded caption on the canvas (CSS pixels). Returns its width so callers can lay chips out in a row.
function chip(g, text, x, y, { color = INK, size = 11, align = "center", mono = false, fit = 0, bg = "rgba(14,16,19,.8)" } = {}) {
  g.font = font(600, size, mono);
  const w = g.measureText(text).width + 10, hh = size + 8;
  let left = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  if (fit) left = clamp(left, 4, fit - w - 4);
  g.fillStyle = bg;
  g.beginPath();
  g.roundRect(left, y - hh / 2, w, hh, 5);
  g.fill();
  g.fillStyle = color;
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.fillText(text, left + 5, y + 0.5);
  return w;
}
function dashLine(g, x1, y1, x2, y2, color = "rgba(255,255,255,.25)", w = 1) {
  g.save();
  g.setLineDash([5, 5]);
  g.strokeStyle = color;
  g.lineWidth = w;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.restore();
}
function dot(g, x, y, r, color) {
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}
function zigzag(g, x1, y1, x2, y2, n, amp, color, w = 1.5) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  g.beginPath(); g.moveTo(x1, y1);
  for (let i = 1; i < n; i++) {
    const t = i / n, s = i % 2 ? amp : -amp;
    g.lineTo(x1 + dx * t + nx * s, y1 + dy * t + ny * s);
  }
  g.lineTo(x2, y2);
  g.strokeStyle = color; g.lineWidth = w; g.stroke();
}
// Chips stacked upward from the bottom edge. lines: text or [text, chipOptions].
function stack(g, p, lines, { x = 10, bottom = 14, align = "left" } = {}) {
  const n = lines.length;
  lines.forEach((ln, i) => {
    const [text, o] = Array.isArray(ln) ? ln : [ln, {}];
    chip(g, text, x, p.H - bottom - (n - 1 - i) * 22, { align, fit: p.W, ...o });
  });
}
function segDist(q, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = clamp(((q[0] - a[0]) * dx + (q[1] - a[1]) * dy) / (dx * dx + dy * dy || 1), 0, 1);
  return Math.hypot(q[0] - a[0] - t * dx, q[1] - a[1] - t * dy);
}

// One p2.World bound to a scene canvas: fixed-step loop, camera (meters to pixels), debug drawing
// and mouse dragging through a RevoluteConstraint to a shapeless static body that follows the pointer.
function lab(ctx, { gravity = -10, hz = 60, drag = true, perFrame = false, cls = "" } = {}) {
  const cv = document.createElement("canvas");
  cv.className = "p2-cv" + (cls ? " " + cls : "");
  ctx.el.appendChild(cv);
  ctx.onCleanup(() => cv.remove());
  const g = cv.getContext("2d");
  const p = { cv, g, W: 0, H: 0, s: 30, ox: 0, oy: 0, dt: 1 / hz, speed: 1, time: 0, phys: 0, paint: 0, world: null, mouse: null, grab: null };
  p.reset = (opts = {}) => {
    p.world = new p2.World({ gravity: [0, gravity], ...opts });
    p.mouse = new p2.Body();
    p.world.addBody(p.mouse);
    p.grab = null;
    return p.world;
  };
  p.reset();
  // Body plus shapes in one call. shapes: a Shape, or a list of Shape / [shape, offset, angle].
  p.add = (opts, shapes, color) => {
    const b = new p2.Body(opts);
    for (const it of shapes instanceof p2.Shape ? [shapes] : shapes) {
      if (it instanceof p2.Shape) b.addShape(it);
      else b.addShape(it[0], it[1], it[2]);
    }
    if (color) b.color = color;
    p.world.addBody(b);
    return b;
  };
  p.X = (x) => p.ox + x * p.s;
  p.Y = (y) => p.oy - y * p.s;
  p.toWorld = (px, py) => [(px - p.ox) / p.s, (p.oy - py) / p.s];
  p.wp = (b, local, out = [0, 0]) => { b.toWorldFrame(out, local); return out; };
  // Fit the world rect into the canvas. t: "auto" keeps the top margin small unless the rect would
  // slide under the top-right control cluster, in which case it starts below the controls.
  p.fit = (x0, y0, x1, y1, m = {}) => {
    const r = m.r ?? 12, b = m.b ?? 12, l = m.l ?? 12;
    const place = (t) => {
      const aw = Math.max(40, p.W - l - r), ah = Math.max(40, p.H - t - b);
      p.s = Math.min(aw / (x1 - x0), ah / (y1 - y0));
      p.ox = l + (aw - (x1 - x0) * p.s) / 2 - x0 * p.s;
      p.oy = t + (ah - (y1 - y0) * p.s) / 2 + y1 * p.s;
    };
    if (m.t === "auto") {
      place(12);
      const c = ctx.controls;
      if (c.offsetHeight && p.X(x1) > p.W - 10 - c.offsetWidth && p.Y(y1) < 10 + c.offsetHeight) place(below(ctx));
    } else place(m.t ?? 12);
  };
  // removeBody leaves constraints and springs behind in p2, so drop them first.
  p.kill = (b) => {
    const w = p.world;
    for (const c of w.constraints.slice()) {
      if (c.bodyA !== b && c.bodyB !== b) continue;
      if (c === p.grab) p.grab = null;
      w.removeConstraint(c);
    }
    for (const sp of w.springs.slice()) if (sp.bodyA === b || sp.bodyB === b) w.removeSpring(sp);
    w.removeBody(b);
  };
  // Adds one shape outline (screen pixels) to a canvas path or Path2D. Circles return their center.
  p.path = (b, sh, t = g) => {
    const co = Math.cos(b.angle), si = Math.sin(b.angle), a = b.angle + sh.angle, ca = Math.cos(a), sa = Math.sin(a);
    const cx = p.X(b.position[0] + co * sh.position[0] - si * sh.position[1]);
    const cy = p.Y(b.position[1] + si * sh.position[0] + co * sh.position[1]);
    const P = (x, y) => [cx + (ca * x - sa * y) * p.s, cy - (sa * x + ca * y) * p.s];
    if (sh.type === SH.CIRCLE) {
      const r = sh.radius * p.s;
      t.moveTo(cx + r, cy); t.arc(cx, cy, r, 0, TAU);
      return [cx, cy];
    }
    if (sh.type === SH.CAPSULE) {
      const r = sh.radius * p.s, q = -a, [x1, y1] = P(sh.length / 2, 0), [x2, y2] = P(-sh.length / 2, 0);
      t.moveTo(x1 + r * Math.cos(q - Math.PI / 2), y1 + r * Math.sin(q - Math.PI / 2));
      t.arc(x1, y1, r, q - Math.PI / 2, q + Math.PI / 2);
      t.arc(x2, y2, r, q + Math.PI / 2, q + Math.PI * 1.5);
      t.closePath();
      return null;
    }
    if (!sh.vertices) return null;
    sh.vertices.forEach((v, i) => { const [x, y] = P(v[0], v[1]); if (i) t.lineTo(x, y); else t.moveTo(x, y); });
    t.closePath();
    return null;
  };
  p.drawBody = (b, col) => {
    if (b.hidden) return;
    const color = col || b.color || (b.type === p2.Body.STATIC ? STEEL : b.type === p2.Body.KINEMATIC ? COLORS[4] : COLORS[2]);
    g.globalAlpha = b.sleepState === p2.Body.SLEEPING ? 0.45 : 1;
    for (const sh of b.shapes) {
      if (sh.hidden || sh.type === SH.HEIGHTFIELD || sh.type === SH.PLANE) continue;
      g.beginPath();
      const c = p.path(b, sh);
      if (sh.sensor) {
        g.save(); g.setLineDash([5, 4]); g.strokeStyle = color; g.lineWidth = 1.5; g.stroke(); g.restore();
        continue;
      }
      g.fillStyle = color; g.fill();
      g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 1; g.stroke();
      if (c) {
        const a = b.angle + sh.angle, r = sh.radius * p.s;
        g.beginPath(); g.moveTo(c[0], c[1]); g.lineTo(c[0] + Math.cos(a) * r, c[1] - Math.sin(a) * r);
        g.strokeStyle = "rgba(0,0,0,.45)"; g.lineWidth = 1.5; g.stroke();
      }
    }
    g.globalAlpha = 1;
  };
  const A = [0, 0], B = [0, 0];
  p.drawGrab = () => {
    if (!p.grab) return;
    p.wp(p.grab.bodyB, p.grab.pivotB, B);
    const mx = p.X(p.mouse.position[0]), my = p.Y(p.mouse.position[1]);
    dashLine(g, mx, my, p.X(B[0]), p.Y(B[1]), AMBER, 1.5);
    dot(g, mx, my, 4, AMBER);
  };
  p.drawLinks = () => {
    for (const c of p.world.constraints) {
      if (c === p.grab || c.style === "none") continue;
      if (c instanceof p2.DistanceConstraint) {
        p.wp(c.bodyA, c.localAnchorA, A); p.wp(c.bodyB, c.localAnchorB, B);
        g.beginPath(); g.moveTo(p.X(A[0]), p.Y(A[1])); g.lineTo(p.X(B[0]), p.Y(B[1]));
        g.strokeStyle = "rgba(232,230,223,.6)"; g.lineWidth = 2; g.stroke();
        dot(g, p.X(A[0]), p.Y(A[1]), 3, INK);
      } else if (c instanceof p2.RevoluteConstraint) {
        p.wp(c.bodyB, c.pivotB, B);
        dot(g, p.X(B[0]), p.Y(B[1]), 2.5, "rgba(232,230,223,.8)");
      }
    }
    for (const sp of p.world.springs) {
      if (sp.style === "none") continue;
      sp.getWorldAnchorA(A); sp.getWorldAnchorB(B);
      zigzag(g, p.X(A[0]), p.Y(A[1]), p.X(B[0]), p.Y(B[1]), 12, 5, sp.color || "rgba(232,230,223,.8)");
    }
    p.drawGrab();
  };
  p.drawWorld = () => {
    for (const b of p.world.bodies) p.drawBody(b);
    p.drawLinks();
  };
  // Draw in body-local meters: origin at the body, y up, rotated with it.
  p.local = (b, fn) => {
    g.save();
    g.translate(p.X(b.position[0]), p.Y(b.position[1]));
    g.scale(p.s, -p.s);
    g.rotate(b.angle);
    fn(g);
    g.restore();
  };
  // Topmost dynamic body under a world point. Scenes may replace p.pick.
  p.pick = (w) => p.world.hitTest(w, p.world.bodies.filter((b) => b.type === p2.Body.DYNAMIC), 0.05)[0] || null;
  let ptr = null;
  p.ptr = () => ptr;
  const evPt = (e) => { const r = cv.getBoundingClientRect(); return p.toWorld(e.clientX - r.left, e.clientY - r.top); };
  ctx.on(cv, "pointerdown", (e) => {
    const w = (ptr = evPt(e));
    cv.setPointerCapture(e.pointerId);
    vec2.copy(p.mouse.position, w);
    if (p.onDown && p.onDown(w, e)) return;
    const b = drag ? p.pick(w) : null;
    if (!b) { if (p.onEmpty) p.onEmpty(w, e); return; }
    const local = [0, 0];
    b.toLocalFrame(local, w);
    p.grab = new p2.RevoluteConstraint(p.mouse, b, { localPivotA: [0, 0], localPivotB: local, maxForce: 400 * b.mass });
    p.world.addConstraint(p.grab);
    b.wakeUp();
  });
  ctx.on(cv, "pointermove", (e) => {
    const w = (ptr = evPt(e));
    vec2.copy(p.mouse.position, w);
    if (p.grab) p.grab.bodyB.wakeUp();
    if (p.onMove) p.onMove(w, e);
  });
  const up = (e) => {
    if (p.grab) { p.world.removeConstraint(p.grab); p.grab = null; }
    if (p.onUp) p.onUp(e);
  };
  ctx.on(cv, "pointerup", up);
  ctx.on(cv, "pointercancel", up);
  ctx.on(cv, "pointerleave", (e) => { if (!e.buttons) ptr = null; });

  const stepOnce = () => {
    if (p.before) p.before(p.dt);
    p.world.step(p.dt);
    p.time += p.dt;
    if (p.after) p.after(p.dt);
  };
  p.go = () => {
    const size = ({ width, height }) => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      p.W = width; p.H = height;
      cv.width = Math.round(width * dpr); cv.height = Math.round(height * dpr);
      cv.style.width = width + "px"; cv.style.height = height + "px";
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (p.layout) p.layout(width, height);
    };
    size(ctx.size());
    ctx.onResize(size);
    let acc = 0;
    ctx.raf((t, ms) => {
      const t0 = performance.now();
      if (perFrame) stepOnce();
      else {
        acc = Math.min(acc + (ms / 1000) * p.speed, p.dt * 4);
        while (acc >= p.dt) { acc -= p.dt; stepOnce(); }
      }
      const t1 = performance.now();
      g.clearRect(0, 0, p.W, p.H);
      if (p.draw) p.draw(g); else p.drawWorld();
      const t2 = performance.now();
      p.phys += (t1 - t0 - p.phys) * 0.1;
      p.paint += (t2 - t1 - p.paint) * 0.1;
    });
  };
  return p;
}

Showcase.run({ scenes: [
  {
    id: "bridge", title: "吊橋與避震小車",
    api: "DistanceConstraint + PrismaticConstraint + LinearSpring + collisionGroup / collisionMask",
    desc: "原本的招牌示範升級：13 片木板用 DistanceConstraint 串成吊橋，繩索顏色與左下長條圖是求解器算出的張力（equation.multiplier）；小車避震是「垂直滑軌 PrismaticConstraint＋LinearSpring」，勁度可即時調整。車輪與車身用 collisionGroup／collisionMask 分組，彼此不互撞。",
    hint: "拖曳任何物體・點兩片木板間的繩索剪斷・調避震勁度看車身起伏",
    mount(ctx) {
      const GAP = 13, HALF = GAP / 2, N = 13, LINK = 0.2, FLOOR_Y = -6.5, G_CAR = 2, G_WORLD = 1;
      let car = null, ropes = [], crates = [], fallAt = 0, stiff = 160;
      ctx.button("丟箱子", () => { for (let i = 0; i < 3; i++) crate(-4 + i * 4 + Math.random()); }, { primary: true });
      ctx.button("剪斷繩索", () => {
        const r = ropes.filter((c) => !c.cut).sort((a, b) => Math.abs(a.idx - N / 2) - Math.abs(b.idx - N / 2))[0];
        if (r) cut(r);
      });
      ctx.button("重建吊橋", () => build());
      ctx.slider("避震勁度", { min: 40, max: 400, step: 10, value: 160, format: (v) => `${v} N/m` }, (v) => {
        stiff = v;
        if (car) for (const sp of car.springs) sp.stiffness = v;
      });
      const p = lab(ctx, { hz: 120 });
      const box = (w, h, opts, group, color) => p.add(opts, new p2.Box({
        width: w, height: h, collisionGroup: group, collisionMask: group === G_CAR ? G_WORLD : G_WORLD | G_CAR,
      }), color);
      const cut = (r) => { r.cut = true; p.world.removeConstraint(r); };
      function makeCar(x) {
        const chassis = box(2, 0.42, { mass: 3, position: [x, 1.2] }, G_CAR);
        chassis.hidden = true;
        const wheels = [], rails = [], springs = [];
        for (const dx of [-0.68, 0.68]) {
          const w = p.add({ mass: 0.5, position: [x + dx, 0.42] }, new p2.Circle({ radius: 0.36, collisionGroup: G_CAR, collisionMask: G_WORLD }));
          w.hidden = true;
          const rail = new p2.PrismaticConstraint(chassis, w, {
            localAnchorA: [dx, -0.5], localAnchorB: [0, 0], localAxisA: [0, 1], disableRotationalLock: true, lowerLimit: -0.32, upperLimit: 0.1,
          });
          rail.style = "none";
          p.world.addConstraint(rail);
          const sp = new p2.LinearSpring(chassis, w, { localAnchorA: [dx, -0.21], localAnchorB: [0, 0], restLength: 0.66, stiffness: stiff, damping: 7 });
          sp.style = "none";
          p.world.addSpring(sp);
          wheels.push(w); rails.push(rail); springs.push(sp);
        }
        return { chassis, wheels, rails, springs, dir: 1 };
      }
      function crate(x) {
        if (crates.length >= 12) p.kill(crates.shift());
        const s = 0.42 + Math.random() * 0.25;
        const b = box(s, s, { mass: 0.35, position: [x, rnd(5, 7)], angle: Math.random() * 2 }, G_WORLD, `hsl(${Math.floor(Math.random() * 360)} 70% 58%)`);
        b.kind = "crate"; b.size = s;
        crates.push(b);
      }
      function build() {
        p.reset();
        p.world.solver.iterations = 30;
        p.world.defaultContactMaterial.friction = 0.9;
        ropes = []; crates = [];
        const cl = box(14, 12, { mass: 0, position: [-(HALF + 7), -6] }, G_WORLD);
        const cr = box(14, 12, { mass: 0, position: [HALF + 7, -6] }, G_WORLD);
        const floor = box(40, 1, { mass: 0, position: [0, FLOOR_Y - 0.5] }, G_WORLD);
        cl.hidden = cr.hidden = floor.hidden = true;
        const planks = [];
        for (let i = 0; i < N; i++) {
          const b = box(0.8, 0.16, { mass: 0.55, position: [-HALF + (i + 0.5) * GAP / N, -0.08] }, G_WORLD);
          b.kind = "plank";
          planks.push(b);
        }
        const link = (a, b, la, lb) => {
          const c = new p2.DistanceConstraint(a, b, { localAnchorA: la, localAnchorB: lb, distance: LINK });
          c.style = "none"; c.idx = ropes.length;
          p.world.addConstraint(c);
          ropes.push(c);
        };
        link(cl, planks[0], [7, 5.91], [-0.4, 0]);
        for (let i = 0; i < N - 1; i++) link(planks[i], planks[i + 1], [0.4, 0], [-0.4, 0]);
        link(planks[N - 1], cr, [0.4, 0], [-7, 5.91]);
        car = makeCar(-HALF - 2.2);
        fallAt = 0;
        crate(rnd(-3, 3));
      }
      build();
      ctx.interval(() => { if (crates.length < 5) crate(-4 + Math.random() * 8); }, 3500);

      p.before = () => {
        const c = car.chassis, x = c.position[0];
        if (x > HALF + 1.6) car.dir = -1;
        else if (x < -HALF - 1.6) car.dir = 1;
        for (const w of car.wheels) if (-car.dir * w.angularVelocity < 7) w.angularForce += -car.dir * 9;
        if (c.position[1] < -3.5) {
          if (!fallAt) fallAt = p.time;
          else if (p.time - fallAt > 2.5) build();
        }
      };
      p.after = () => {
        for (const b of crates.slice()) {
          if (b.position[1] > FLOOR_Y + 0.6) continue;
          p.kill(b);
          crates.splice(crates.indexOf(b), 1);
        }
      };
      p.onEmpty = (w) => {
        let best = null, bd = Math.max(0.35, 14 / p.s);
        for (const r of ropes) {
          if (r.cut) continue;
          const d = segDist(w, p.wp(r.bodyA, r.localAnchorA), p.wp(r.bodyB, r.localAnchorB));
          if (d < bd) { bd = d; best = r; }
        }
        if (best) cut(best);
      };
      p.layout = (W) => { const xr = W < 500 ? 9.3 : 10; p.fit(-xr, -6.8, xr, 4.4, { t: "auto" }); };

      const tension = (r) => Math.max(0, -r.equations[0].multiplier);
      const tColor = (T) => `hsl(${(48 - 58 * clamp((T - 60) / 220, 0, 1) + 360) % 360} 85% 60%)`;
      const A = [0, 0], B = [0, 0];
      p.draw = (g) => {
        const { W, H } = p;
        const sky = g.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, "#26315f"); sky.addColorStop(0.55, "#f28f6b"); sky.addColorStop(1, "#f6c28b");
        g.fillStyle = sky; g.fillRect(0, 0, W, H);
        const y0 = p.Y(0);
        g.fillStyle = "rgba(60,40,80,.45)";
        g.beginPath(); g.moveTo(0, y0);
        for (let i = 0; i <= 16; i++) g.lineTo((i / 16) * W, y0 - p.s * (2.4 + 1.3 * Math.sin(i * 1.7) + 0.7 * Math.sin(i * 0.6 + 1)));
        g.lineTo(W, y0); g.closePath(); g.fill();

    desc: "p2 的五種約束各放一格：旋轉馬達加扭矩上限（卡住就停）、關節角度限制、滑軌馬達（上下限自動折返）、齒輪比（不靠碰撞，用 GearConstraint 綁轉速）、剛桿對繩（DistanceConstraint 只開上限就是繩）、LockConstraint 焊成的懸臂樑（定時解鎖散落；梢端下垂量反映迭代求解器沒有完全收斂，本場景用 30 次迭代）。",

      const p = lab(ctx);

        links.forEach((b, i) => {

              g.fillStyle = COLORS[i + 1]; g.fill();
              g.strokeStyle = "rgba(0,0,0,.4)"; g.lineWidth = 1; g.stroke();
              g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(b.angle) * r * 0.7 * p.s, cy - Math.sin(b.angle) * r * 0.7 * p.s);

          },

      function ropeCell(ox, oy) {

        const rodBall = p.add({ mass: 1, position: [A1[0], A1[1] - L] }, new p2.Circle({ radius: 0.35 }), COLORS[0]);
        const ropeBall = p.add({ mass: 1, position: [A2[0], A2[1] - L] }, new p2.Circle({ radius: 0.35 }), COLORS[3]);

          name: "剛桿與繩",

          if (freeAt >= 0) return;
          for (const c of locks.slice(1)) p.world.removeConstraint(c);
          freeAt = p.time;
        };
        every(8, unlock);
        return {
          name: "鎖定約束",
          unlock,
          info: () => (freeAt < 0 ? `鎖定中・梢端下垂 ${Math.max(0, (oy + 4.2 - segs[3].position[1]) * 100).toFixed(1)} cm` : "已解鎖，稍後重建"),

    },

  {

          接觸: p.world.narrowphase.contactEquations.length,
          候選配對: Math.round(p.world.broadphase.result.length / 2),
          物理: `${p.phys.toFixed(1)} ms`,
          繪圖: `${p.paint.toFixed(1)} ms`,
          寬相位: BP[bp],
        }),
        note: "每格先跑一次 world.step 再畫 Canvas，兩段分開計時。物理段含寬相位（SAP 排序掃描或 Naive 兩兩比對）、窄相位算接觸、GS 求解器迭代；開「休眠」後靜止剛體停算。手機與內顯的上限通常明顯較低。",
      });
    },
  },
] });
</script>
</body>
</html>
