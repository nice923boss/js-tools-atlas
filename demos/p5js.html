<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p5.js 示範：雜訊流場</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
</head>
<body>
<div class="controls">
  <button class="btn" id="reset">重新生成</button>
</div>
<div class="hint">移動滑鼠擾動流場・點擊換色盤</div>

<script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
<script>
// Perlin-noise flow field: particles follow noise() angles and leave fading trails.
const PALETTES = [
  ["#f7df1e", "#4cc9f0", "#f72585"],
  ["#7bd389", "#ff8c42", "#9d8cff"],
  ["#ffffff", "#4cc9f0", "#9d8cff"],
];
let particles = [];
let palette = 0;
let zoff = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  seed();
}

function seed() {
  background(14, 16, 19);
  noiseSeed(floor(random(1e6)));
  particles = Array.from({ length: floor((width * height) / 900) }, () => ({
    pos: createVector(random(width), random(height)),
    prev: null,
    hue: floor(random(3)),
  }));
}

function draw() {
  noStroke();
  fill(14, 16, 19, 22);
  rect(0, 0, width, height);
  zoff += 0.003;
  for (const p of particles) {
    let a = noise(p.pos.x * 0.004, p.pos.y * 0.004, zoff) * TAU * 2;
    const d = dist(mouseX, mouseY, p.pos.x, p.pos.y);
    if (d < 120) a += map(d, 0, 120, PI, 0);
    p.prev = p.pos.copy();
    p.pos.add(p5.Vector.fromAngle(a, 1.6));
    if (p.pos.x < 0 || p.pos.x > width || p.pos.y < 0 || p.pos.y > height) {
      p.pos.set(random(width), random(height));
      continue;
    }
    const c = color(PALETTES[palette][p.hue]);
    c.setAlpha(150);
    stroke(c);
    strokeWeight(1.2);
    line(p.prev.x, p.prev.y, p.pos.x, p.pos.y);
  }
}

function mousePressed(e) {
  if (e.target.tagName !== "CANVAS") return;
  palette = (palette + 1) % PALETTES.length;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  seed();
}

document.getElementById("reset").addEventListener("click", seed);
</script>
</body>
</html>
