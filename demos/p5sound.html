<script>
const { h } = Showcase;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';
const LOOP_SRC = "_shared/audio/loop.mp3";
const NOTES = ["A2", "C3", "D3", "E3", "G3", "A3", "C4", "D4", "E4", "G4", "A4", "C5", "D5", "E5", "G5"];
const MIDI = { C: 0, D: 2, E: 4, G: 7, A: 9 };
const hz = (n) => 440 * Math.pow(2, (MIDI[n[0]] + 12 * (+n[1] + 1) - 69) / 12);
const WAVES = [["sawtooth", "鋸齒波"], ["square", "方波"], ["triangle", "三角波"], ["sine", "正弦波"]];
// Auto-play phrase: [column, height 0..1 (1 = top / bright)]
const PHRASE = [[5, 0.4], [7, 0.5], [8, 0.6], [10, 0.75], [9, 0.65], [8, 0.5], [6, 0.45], [7, 0.55],
  [3, 0.3], [5, 0.45], [8, 0.7], [11, 0.9], [12, 0.85], [10, 0.7], [9, 0.5], [5, 0.35]];
const PC = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const toDb = (x) => 20 * Math.log10(Math.max(1e-6, x));
const fmtDb = (x) => { const d = toDb(x); return d < -90 ? "−∞ dB" : `${d < 0 ? "−" : ""}${Math.abs(d).toFixed(1)} dB`; };
const fmtT = (s) => { s = Math.max(0, +s || 0); const m = Math.floor(s / 60); return `${m}:${(s - m * 60).toFixed(1).padStart(4, "0")}`; };
const fmtHz = (f) => (f >= 1000 ? `${(f / 1000).toFixed(f >= 10000 ? 1 : 2)} kHz` : `${Math.round(f)} Hz`);
const cutoffFor = (y) => 180 * Math.pow(2, 6.2 * y);   // y: 0 bottom .. 1 top
function noteName(f) { const m = 69 + 12 * Math.log2(f / 440), r = Math.round(m); return { name: PC[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1), cents: Math.round((m - r) * 100) }; }

// ---------- drawing helpers (plain 2D context of each p5 canvas) ----------
function txt(g, s, x, y, color = "#9aa0aa", mono = false, align = "left", size = 11) {
  g.save(); g.font = `${size}px ${mono ? MONO : CJK}`; g.textAlign = align; g.textBaseline = "top"; g.fillStyle = color; g.fillText(s, x, y); g.restore();
}
function lane(g, x, y, w, hh) { g.fillStyle = "rgba(255,255,255,.025)"; g.fillRect(x, y, w, hh); g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(x, y + hh / 2, w, 1); }
// x position of a frequency on a log axis.
const fx = (f, x, w, lo, hi) => x + (Math.log(f / lo) / Math.log(hi / lo)) * w;
// p5.FFT.analyze() returns linear magnitudes (Tone FFT, normalRange); fold them into log-spaced bands, 0..1 over dbLo..dbHi.
function specBands(spec, sr, n, lo, hi, dbLo = -100, dbHi = -20) {
  const out = new Float32Array(n), binHz = sr / 2 / spec.length;
  for (let i = 0; i < n; i++) {
    const a = Math.floor((lo * Math.pow(hi / lo, i / n)) / binHz), b = Math.max(a + 1, Math.ceil((lo * Math.pow(hi / lo, (i + 1) / n)) / binHz));
    let m = 0;
    for (let j = a; j < b && j < spec.length; j++) m = Math.max(m, spec[j]);
    out[i] = clamp((toDb(m) - dbLo) / (dbHi - dbLo), 0, 1);
  }
  return out;
}
function drawBands(g, vals, x, y, w, hh, hue0 = 190, span = 150, alpha = 1) {
  const n = vals.length, bw = w / n;
  for (let i = 0; i < n; i++) {
    const bh = vals[i] * hh;
    if (bh < 0.5) continue;
    g.fillStyle = `hsla(${hue0 + (i / n) * span}, 85%, 60%, ${alpha})`;
    g.fillRect(x + i * bw + 0.5, y + hh - bh, Math.max(1, bw - 1), bh);
  }
}
function drawLive(g, arr, x, y, w, hh, color, gain = 1, from = 0, count = arr.length) {
  const mid = y + hh / 2, cols = Math.max(2, Math.floor(w));
  g.strokeStyle = color; g.lineWidth = 1.4; g.beginPath();
  for (let i = 0; i < cols; i++) {
    const yy = mid - clamp(arr[from + Math.floor((i / cols) * count)] * gain, -1, 1) * hh / 2;
    if (i) g.lineTo(x + (i / cols) * w, yy); else g.moveTo(x, yy);
  }
  g.stroke();
}
function freqGrid(g, x, y, w, hh, lo, hi) {
  for (const f of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) {
    if (f <= lo || f >= hi) continue;
    const xx = fx(f, x, w, lo, hi);
    g.fillStyle = "rgba(255,255,255,.06)"; g.fillRect(xx, y, 1, hh);
    txt(g, f >= 1000 ? `${f / 1000}k` : `${f}`, xx + 3, y + hh - 12, "#5d636e", true, "left", 9.5);
  }
}
function meter(g, x, y, w, hh, v, label) {
  g.fillStyle = "rgba(255,255,255,.05)"; g.fillRect(x, y, w, hh);
  const k = clamp((toDb(v) + 60) / 60, 0, 1), gr = g.createLinearGradient(0, y + hh, 0, y);
  gr.addColorStop(0, "#2ec4b6"); gr.addColorStop(0.7, "#f7df1e"); gr.addColorStop(1, "#f72585");
  g.fillStyle = gr; g.fillRect(x, y + hh * (1 - k), w, hh * k);
  if (label) txt(g, label, x + w / 2, y + hh + 4, "#9aa0aa", false, "center", 10.5);
}
function local(el, e) { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top, r.width, r.height]; }
function watch(ctx, el, fn) { const ro = new ResizeObserver(() => ctx.active && fn()); ro.observe(el); ctx.onCleanup(() => ro.disconnect()); }

// Each canvas is a p5 instance-mode sketch sized to its container; draw(p, g, w, h) runs in p5's draw loop.
function sketch(ctx, el, draw, init) {
  const S = { p: null, ready: false };
  const size = () => [Math.max(1, Math.floor(el.clientWidth)), Math.max(1, Math.floor(el.clientHeight))];
  S.p = new p5((p) => {
    p.setup = () => { const [w, hh] = size(); p.createCanvas(w, hh); p.pixelDensity(DPR); if (init) init(p); S.ready = true; };
    p.draw = () => { if (ctx.active) draw(p, p.drawingContext, p.width, p.height); };
  }, el);
  watch(ctx, el, () => { if (!S.ready) return; const [w, hh] = size(); if (w !== S.p.width || hh !== S.p.height) S.p.resizeCanvas(w, hh); });
  ctx.onCleanup(() => S.p.remove());
  return S;
}

// ---------- p5.sound plumbing ----------
// p5.sound creates its AudioContext on first use, so audio() and every node constructor only run inside a click or tap.
function audio() {
  const ac = p5.prototype.getAudioContext();
  if (ac.state !== "running") p5.prototype.userStartAudio();
  return ac;
}
// AudioIn.start() calls a bare userStartAudio(), which only exists as a global in p5 global mode.
if (typeof window.userStartAudio !== "function") window.userStartAudio = () => p5.prototype.userStartAudio();
// p5.sound 0.4.1 has no dispose(): each node wraps a Tone node between two native gains and its output is
// wired to the speakers on construction, so cleanup disconnects both gains and disposes the Tone node.
let TUNED = false;
function rack(ctx) {
  const set = new Set();
  const kill = (x) => {
    if (!x || !set.delete(x)) return;
    x.output.disconnect(); x.input.disconnect();
    if (x instanceof p5.FFT) { x.analyzer.dispose(); x.samples.dispose(); }
    x.node.dispose();
  };
  ctx.onCleanup(() => [...set].forEach(kill));
  return {
    add(x) {
      set.add(x);
      // Tone's default 100 ms look-ahead makes a played instrument feel late.
      if (!TUNED) { x.node.context.lookAhead = 0.02; TUNED = true; }
      return x;
    },
    kill,
  };
}
const fail = (ctx, what) => (e) => {
  if (e && e.name === "AbortError") return;
  console.error(`[p5.sound] ${what}`, e);
  if (ctx.active) ctx.status("").error(`${what}失敗：${e && e.message ? e.message : e}`);
};
// loadSound() resolves with a p5.SoundFile; it has no error path in 0.4.1, so a timeout makes a failed load visible.
function loadLoop(ctx, R) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error("音檔載入逾時")), 20000);
    p5.prototype.loadSound(LOOP_SRC).then((sf) => {
      clearTimeout(t);
      R.add(sf);
      if (!ctx.active) { R.kill(sf); rej(new DOMException("Scene unmounted", "AbortError")); return; }
      res(sf);
    });
  });
}
// Decoded once with an OfflineAudioContext for the waveform overview shown before any sound plays.
let LOOP = null;
function decodeLoop() {
  return (LOOP ||= fetch(LOOP_SRC)
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); })
    .then((ab) => new OfflineAudioContext(1, 1, 44100).decodeAudioData(ab))
    .then((buf) => {
      const d = buf.getChannelData(0), cols = 1200, pk = new Float32Array(cols), step = d.length / cols;
      for (let c = 0; c < cols; c++) { let m = 0; const e = Math.min(d.length, Math.floor((c + 1) * step)); for (let i = Math.floor(c * step); i < e; i++) m = Math.max(m, Math.abs(d[i])); pk[c] = m; }
      return { pk, dur: buf.duration, ch: buf.numberOfChannels, sr: buf.sampleRate };
    })
    .catch((e) => { LOOP = null; throw e; }));
}
function drawOverview(g, pk, x, y, w, hh, split, cA, cB) {
  const mid = y + hh / 2, n = Math.max(1, Math.floor(w / 2));
  for (let i = 0; i < n; i++) {
    const a = Math.floor((i / n) * pk.length), b = Math.max(a + 1, Math.floor(((i + 1) / n) * pk.length));
    let m = 0;
    for (let j = a; j < b; j++) m = Math.max(m, pk[j]);
    const xx = x + (i / n) * w, bh = Math.max(1, m * hh * 0.92);
    g.fillStyle = xx < split ? cA : cB;
    g.fillRect(xx, mid - bh / 2, Math.max(1, w / n - 0.6), bh);
  }
}

Showcase.run({
  scenes: [
    {
      id: "xy", title: "XY 合成器",
      api: "p5.Oscillator・p5.Envelope・p5.LowPass・p5.Delay・p5.Reverb・p5.FFT",
      desc: "原本的招牌示範：左右換五聲音階的音高，上下調低通濾波器的截止頻率。聲音走 Oscillator → Envelope → LowPass，再並聯 Delay 與 Reverb；畫面上的頻譜與波形都來自 p5.FFT，黃色虛線是目前的截止頻率。",
      hint: "按住畫面拖曳演奏，或按「▶ 自動演奏」；上方可切換波形、回音與殘響。",
      mount(ctx) {
        ctx.html(`<div class="board ps-one"><div class="ps-card ps-cv ps-xy"></div></div>`);
        const R = rack(ctx), el = ctx.$(".ps-xy");
        let au = null, wave = 0, echoOn = true, verbOn = true, held = false, auto = false, step = 0, nextAt = 0, relAt = 0, ripples = [];
        const cur = { col: 7, y: 0.5, x: -1, py: 0 };
        const build = () => {
          if (au) return au;
          const ac = audio();
          const osc = R.add(new p5.Oscillator(hz(NOTES[cur.col]), WAVES[wave][0]));
          const env = R.add(new p5.Envelope(0.01, 0.2, 0.55, 0.35));
          const lp = R.add(new p5.LowPass(cutoffFor(cur.y)));
          lp.res(6);
          const echo = R.add(new p5.Delay(0.27, 0.42)), verb = R.add(new p5.Reverb(2.5));
          // osc -> env -> lowpass -> speakers, plus parallel delay and reverb sends
          osc.disconnect(); osc.connect(env);
          env.disconnect(); env.connect(lp);
          lp.connect(echo); lp.connect(verb);
          echo.output.gain.value = echoOn ? 0.4 : 0;
          verb.output.gain.value = verbOn ? 0.35 : 0;
          const fft = R.add(new p5.FFT(1024));
          fft.setInput(lp); fft.setInput(echo); fft.setInput(verb);
          osc.start();
          au = { osc, env, lp, echo, verb, fft, sr: ac.sampleRate };
          return au;
        };
        const setVoice = (col, y) => { cur.col = col; cur.y = y; if (au) { au.osc.freq(hz(NOTES[col]), 0.04); au.lp.freq(cutoffFor(y)); } };
        const noteOn = (col, y, now) => { build(); setVoice(col, y); au.env.triggerAttack(); ripples.push({ col, y, t: now }); };
        const noteOff = () => { if (au) au.env.triggerRelease(); };
        const stopAuto = () => { if (!auto) return; auto = false; noteOff(); autoBtn.textContent = "▶ 自動演奏"; };
        const autoBtn = ctx.button("▶ 自動演奏", () => {
          if (auto) return stopAuto();
          build(); auto = true; step = 0; nextAt = 0; autoBtn.textContent = "■ 停止";
        }, { primary: true });
        ctx.group(WAVES.map((w) => w[1]), 0, (i) => { wave = i; if (au) au.osc.setType(WAVES[i][0]); });
        ctx.toggle("回音", true, (v) => { echoOn = v; if (au) au.echo.output.gain.value = v ? 0.4 : 0; });
        ctx.toggle("殘響", true, (v) => { verbOn = v; if (au) au.verb.output.gain.value = v ? 0.35 : 0; });
        const pick = (e) => { const [x, y, w, hh] = local(el, e); return [clamp(Math.floor((x / w) * NOTES.length), 0, NOTES.length - 1), clamp(1 - y / hh, 0, 1)]; };
        ctx.on(el, "pointerdown", (e) => { el.setPointerCapture(e.pointerId); held = true; stopAuto(); const [c, y] = pick(e); noteOn(c, y, performance.now()); });
        ctx.on(el, "pointermove", (e) => {
          if (!held) return;
          const [c, y] = pick(e);
          if (c !== cur.col) ripples.push({ col: c, y, t: performance.now() });
          setVoice(c, y);
        });
        const up = () => { if (held) { held = false; noteOff(); } };
        ctx.on(el, "pointerup", up); ctx.on(el, "pointercancel", up);
        const runAuto = (now) => {
          if (!auto) return;
          if (relAt && now >= relAt) { noteOff(); relAt = 0; }
          if (now >= nextAt) {
            const [c, y] = PHRASE[step % PHRASE.length];
            noteOn(c, y, now); step++;
            relAt = now + 190; nextAt = now + 300;
          }
        };
        sketch(ctx, el, (p, g, W, H) => {
          const now = performance.now(), cw = W / NOTES.length, colX = (c) => (c + 0.5) * cw;
          runAuto(now);
          if (cur.x < 0) { cur.x = colX(cur.col); cur.py = (1 - cur.y) * H; }
          p.background(14, 16, 19);
          p.noStroke();
          // Pitch columns with a vertical brightness ramp (top = open filter)
          for (let c = 0; c < NOTES.length; c++) {
            const active = (held || auto) && c === cur.col;
            const grad = g.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, `hsla(${200 + c * 9}, 85%, 62%, ${c % 2 ? 0.17 : 0.13})`);
            grad.addColorStop(1, `hsla(${200 + c * 9}, 85%, 62%, 0.02)`);
            g.save(); g.fillStyle = grad; g.fillRect(c * cw, 0, cw - 1, H); g.restore();   // keep p5's cached fill state intact
            if (active) { const col = p.color(`hsl(${200 + c * 9}, 85%, 62%)`); col.setAlpha(46); p.fill(col); p.rect(c * cw, 0, cw, H); }
            if (cw >= 26 || c % 2 === 0 || active) {   // narrow screens label every other column
              p.fill(active ? 240 : 120); p.textSize(Math.min(12, Math.max(9, cw * 0.42))); p.textAlign(p.CENTER, p.BOTTOM);
              p.text(NOTES[c], c * cw + cw / 2, H - 44);
            }
          }
          // Spectrum on a log frequency axis, with the LowPass cutoff marked
          const base = H - 60, sh = H * 0.45, cf = cutoffFor(cur.y);
          if (au) {
            const n = Math.max(24, Math.floor(W / 6)), bands = specBands(au.fft.analyze(), au.sr, n, 40, 16000), bw = W / n;
            for (let i = 0; i < n; i++) {

          txt(g, "左", 14, fy - 14, "#7d8490", false, "left", 10.5);
          txt(g, "右", w - 14, fy - 14, "#7d8490", false, "right", 10.5);
          txt(g, `${live ? `發聲中 ${voices.length}` : `待命 ${n}`} 個・橫軸＝pan()・縱軸＝音高`, w / 2, fy - 14, "#9aa0aa", false, "center", 10.5);
          for (let i = 0; i < n; i++) {
            const k = 0.6 + ((i * 0.37) % 1) * 1.8, ph = i * 2.399, f = baseOf(i);
            const pan = live ? Math.sin(t * 0.25 * k + ph) : ((i * 0.618) % 1) * 2 - 1;
            const x = 10 + ((pan + 1) / 2) * fw, y = fy + fh - (Math.log(f / 100) / Math.log(1800 / 100)) * fh;
            g.fillStyle = `hsla(${185 + (i % 5) * 34}, 85%, ${live ? 62 : 35}%, ${live ? 0.85 : 0.5})`;
            if (rad < 3) g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
            else { g.beginPath(); g.arc(x, y, rad, 0, Math.PI * 2); g.fill(); }
          }
        });
      },
    },
  ],
});
</script>
