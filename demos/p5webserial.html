<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p5.webserial 示範：序列埠即時波形</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"click","needs":["serial"],"note":"沒有序列埠裝置時自動改用模擬資料，支援 Web Serial 的瀏覽器會經由 p5.webserial 讀取管線"}</script>
<style>
  .app { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px 46px; }
  .top { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .state {
    flex: 1 1 300px; min-width: 0; padding: 7px 12px; border-radius: 10px; background: var(--panel);
    border: 1px solid var(--line); font-size: 13px; line-height: 1.45;
  }
  .state .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #777; margin-right: 6px; vertical-align: 1px; }
  .state[data-mode="serial"] .dot { background: var(--c4); box-shadow: 0 0 8px var(--c4); }
  .state[data-mode^="sim"] .dot { background: var(--c6); box-shadow: 0 0 8px var(--c6); }
  .state[data-mode="wait"] .dot { background: var(--c1); }
  .state[data-mode="err"] .dot { background: #ff6b6b; }
  .state small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btns label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .btns select { padding: 7px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
  .notice {
    display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5;
    background: rgba(255, 140, 66, 0.12); border: 1px solid rgba(255, 140, 66, 0.5);
  }
  .notice[hidden] { display: none; }
  .notice p { margin: 0; flex: 1; }
  .notice button { appearance: none; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; padding: 2px; }
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 256px; gap: 10px; }
  .scope { position: relative; min-height: 0; border-radius: 12px; overflow: hidden; background: #0b0d10; border: 1px solid var(--line); }
  .scope canvas { position: absolute; inset: 0; display: block; }
  .legend { position: absolute; left: 52px; top: 8px; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
  .chip {
    font: 600 12px/1 var(--mono); padding: 5px 8px; border-radius: 999px; background: rgba(14, 16, 19, 0.8);
    border: 1px solid var(--line); display: flex; gap: 6px; align-items: center;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  .chip b { min-width: 3.2ch; text-align: right; }
  .side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .side .panel { padding: 10px 12px; }
  .side h4 { margin: 0 0 6px; font-size: 12.5px; display: flex; justify-content: space-between; gap: 8px; }
  .side h4 span { color: var(--muted); font-weight: 400; font-family: var(--mono); }
  .mon { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #mon {
    margin: 0; flex: 1; min-height: 0; overflow: hidden; font: 11.5px/1.55 var(--mono); color: var(--muted); white-space: pre;
    display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-mask-image: linear-gradient(transparent, #000 22px); mask-image: linear-gradient(transparent, #000 22px);
  }
  #mon div { flex: none; }
  #mon b { color: var(--fg); font-weight: 500; }
  pre.code { margin: 0; font: 11px/1.55 var(--mono); white-space: pre; overflow: hidden; color: #cfd3da; }
  pre.code .k { color: var(--c2); }
  pre.code .s { color: var(--c4); }
  pre.code .c { color: var(--muted); }
  @media (max-width: 720px) {
    .app { overflow-y: auto; }
    .state { flex-basis: 100%; }
    .btns { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
    .btns select { flex: 1; }
    .main { flex: none; grid-template-columns: minmax(0, 1fr); }
    .scope { height: 250px; }
    .mon { height: 170px; flex: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="state" id="state" data-mode="idle"><span class="dot"></span><b id="stateText">準備中</b><small id="stateSub">載入函式庫後開始</small></div>
    <div class="btns">
      <label>鮑率
        <select id="baud"><option>9600</option><option>57600</option><option selected>115200</option></select>
      </label>
      <button class="btn primary" id="connect" type="button">🔌 連接序列埠</button>
      <button class="btn" id="sim" type="button">🧪 模擬資料</button>
      <button class="btn" id="stop" type="button">⏸ 暫停</button>
    </div>
  </div>
  <div class="notice" id="notice" hidden><p id="noticeText"></p><button type="button" id="noticeClose" aria-label="關閉說明">✕</button></div>
  <div class="main">
    <section class="scope" id="scope"><div class="legend" id="legend"></div></section>
    <aside class="side">
      <div class="panel mon">
        <h4>序列監看 <span id="rate">0 行／秒</span></h4>
        <pre id="mon"></pre>
      </div>
      <div class="panel">
        <h4>p5.webserial 用法</h4>
<pre class="code"><span class="k">let</span> port = createSerial();
port.open(<span class="s">115200</span>); <span class="c">// 選擇裝置</span>
<span class="c">// draw() 裡逐行讀取</span>
<span class="k">let</span> line = port.readUntil(<span class="s">"\n"</span>);
<span class="k">let</span> [a0, a1, a2] =
  line.split(<span class="s">","</span>).map(Number);
<span class="c">// Arduino 每行印出 512,300,700</span></pre>
      </div>
    </aside>
  </div>
</div>
<div class="hint">按「連接序列埠」選擇裝置，無裝置時看模擬資料</div>

<script src="_shared/gate.js"></script>
<script type="module">
const P5_URL = "https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js";
const WEBSERIAL_URL = "https://cdn.jsdelivr.net/npm/@gohai/p5.webserial@1.1.2/libraries/p5.webserial.js";
const COLORS = ["#4cc9f0", "#f72585", "#7bd389", "#ff8c42"];
const NAMES = ["A0", "A1", "A2", "A3"];
const LEN = 600;          // samples kept per channel
const SIM_HZ = 50;        // simulated lines per second

const $ = (id) => document.getElementById(id);
const stateEl = $("state"), stateText = $("stateText"), stateSub = $("stateSub");
const scope = $("scope"), legend = $("legend"), mon = $("mon"), rateEl = $("rate");
const baudSel = $("baud");

await demoGate({
  icon: "🔌",
  title: "序列埠即時波形",
  desc: "用 p5.webserial 讀取 Arduino 等序列裝置每行送出的數值（逗號分隔），再用 p5.js 畫成即時示波器。沒有裝置也能用模擬資料觀看。",
  tags: ["需要 Web Serial（桌機版 Chrome／Edge）", "p5.js 約 1 MB", "可用模擬資料"],
  button: "開始",
});

const loadScript = (src) => new Promise((resolve, reject) => {
  const s = document.createElement("script");
  s.src = src;
  s.onload = resolve;
  s.onerror = () => reject(new Error(`無法載入 ${src}`));
  document.head.append(s);
});

const status = demoStatus("載入 p5.js 與 p5.webserial…");
try {
  await loadScript(P5_URL);
  status.progress(0.7);
  await loadScript(WEBSERIAL_URL);
  status.progress(1);
  status.done();
} catch (err) {
  console.error(err);
  status.error("函式庫載入失敗，請確認網路連線後重新整理頁面");
  throw err;
}

// ---- feature detection ----
const hasSerial = "serial" in navigator;
const hasUsb = "usb" in navigator;
const supported = hasSerial || hasUsb;              // p5.webserial throws without either
const canVirtual = typeof window.SerialPort === "function";

// ---- sample buffers ----
const bufs = COLORS.map(() => new Float32Array(LEN).fill(NaN));
let head = 0, filled = 0, channels = 0, lineCount = 0;
const latest = [];
const recent = [];

function resetBuffers() {
  bufs.forEach((b) => b.fill(NaN));
  head = 0; filled = 0; channels = 0; recent.length = 0;
}

function handleLine(raw) {
  const line = raw.trim();
  if (!line) return;
  lineCount++;
  recent.push(line);
  if (recent.length > 40) recent.shift();
  const vals = line.split(/[,\s;]+/).map(Number).filter(Number.isFinite).slice(0, COLORS.length);
  if (!vals.length) return;
  channels = Math.max(channels, vals.length);
  for (let c = 0; c < COLORS.length; c++) {
    bufs[c][head] = c < vals.length ? vals[c] : NaN;
    if (c < vals.length) latest[c] = vals[c];
  }
  head = (head + 1) % LEN;
  filled = Math.min(filled + 1, LEN);
}

// ---- simulated sensor: sine, triangle and a heartbeat-like pulse ----
let simIndex = 0;
function simLine() {
  const s = simIndex++ / SIM_HZ;
  const noise = () => (Math.random() - 0.5) * 16;
  const a = 512 + 330 * Math.sin(s * Math.PI * 2 * 0.35) + noise();
  const ph = (s * 0.5) % 1;
  const b = 170 + 640 * (ph < 0.5 ? ph * 2 : 2 - ph * 2) + noise() * 0.5;
  const beat = (s * 0.9) % 1;
  const c = 300 + 560 * Math.exp(-beat * 20) - 130 * Math.exp(-((beat - 0.1) ** 2) * 900)
    + 70 * Math.exp(-((beat - 0.4) ** 2) * 160) + noise() * 0.6;
  return [a, b, c].map((v) => Math.round(Math.min(1023, Math.max(0, v)))).join(",");
}

// A SerialPort-shaped object whose readable stream emits CSV lines in irregular chunks,
// so the data still travels through p5.webserial's open() / read loop / readUntil().
function makeVirtualPort() {
  const vp = Object.create(SerialPort.prototype);
  const enc = new TextEncoder();
  let readable = null, timer = 0, pending = "";
  Object.defineProperty(vp, "readable", { get: () => readable, configurable: true });
  Object.defineProperty(vp, "writable", { value: new WritableStream(), configurable: true });
  vp.open = async () => {
    readable = new ReadableStream({
      start(ctrl) {
        timer = setInterval(() => {
          pending += simLine() + "\n";
          if (Math.random() < 0.65) {
            const cut = 1 + Math.floor(Math.random() * pending.length);
            ctrl.enqueue(enc.encode(pending.slice(0, cut)));
            pending = pending.slice(cut);
          }
        }, 1000 / SIM_HZ);
      },
      cancel() { clearInterval(timer); },
    });
  };
  vp.close = async () => { clearInterval(timer); readable = null; };
  vp.getInfo = () => ({});
  return vp;
}

// ---- UI state ----
let mode = "idle", rawTimer = 0, waitSince = 0, port = null;
const MODES = {
  "sim-lib": ["模擬資料中", "虛擬 SerialPort 每 20 ms 送出一行 CSV，經 p5.webserial 的 readUntil() 解析"],
  "sim-raw": ["模擬資料中（未使用序列埠）", "此瀏覽器無法建立 p5.webserial 連線，數值由頁面直接產生"],
  wait: ["等待裝置…", "請在瀏覽器跳出的清單中選擇序列埠"],
  serial: ["已連線序列埠", ""],
  idle: ["已暫停", "按「連接序列埠」或「模擬資料」重新開始"],
  err: ["連線失敗", ""],
};
function setMode(m, sub) {
  mode = m;
  stateEl.dataset.mode = m;
  stateText.textContent = MODES[m][0];
  stateSub.textContent = sub ?? MODES[m][1];
  $("sim").setAttribute("aria-pressed", String(m.startsWith("sim")));
}
function showNotice(text) {
  $("noticeText").textContent = text;
  $("notice").hidden = false;
}
$("noticeClose").addEventListener("click", () => { $("notice").hidden = true; });

async function closePort() {
  if (rawTimer) { clearInterval(rawTimer); rawTimer = 0; }
  if (!port || !port.reader) return;
  port.close();
  // wait until p5.webserial's read loop has released the old port
  for (let i = 0; i < 60 && port.reader; i++) await new Promise((r) => setTimeout(r, 25));
}

async function startSim() {
  await closePort();
  resetBuffers();
  if (port && canVirtual) {
    port.clear();
    port.open(makeVirtualPort(), Number(baudSel.value));
    setMode("sim-lib");
  } else {
    rawTimer = setInterval(() => handleLine(simLine()), 1000 / SIM_HZ);
    setMode("sim-raw");
  }
}

async function connectSerial() {
  if (!supported) {
    showNotice("這個瀏覽器不支援 Web Serial，無法連接實體裝置。請改用桌機版 Chrome 或 Edge（89 版以上），並透過 https 或 localhost 開啟。");
    return;
  }
  let picked = null;
  if (hasSerial) {
    try {
      picked = await navigator.serial.requestPort();
    } catch (err) {
      if (err.name === "NotFoundError") {
        showNotice("沒有選到序列埠：請確認裝置已接上電腦，並在跳出的清單中選取。畫面維持目前的資料來源。");
      } else if (err.name === "SecurityError") {
        showNotice("此頁面沒有序列埠權限：嵌入的 iframe 需要 allow=\"serial\"，或請在新分頁開啟本示範。");
      } else {
        showNotice(`無法取得序列埠：${err.message}`);
      }
      return;
    }
  }
  await closePort();
  resetBuffers();
  port.clear();
  // A SerialPort from requestPort() skips the chooser; the WebUSB polyfill path asks for the device itself.
  if (picked) port.open(picked, Number(baudSel.value));
  else port.open(Number(baudSel.value));
  $("notice").hidden = true;
  waitSince = performance.now();
  setMode("wait");
}

$("connect").addEventListener("click", connectSerial);
$("sim").addEventListener("click", startSim);
$("stop").addEventListener("click", async () => { await closePort(); setMode("idle"); });

// connection watchdog + rate meter + monitor refresh
let lastCount = 0;
setInterval(() => {
  const rate = lineCount - lastCount;
  lastCount = lineCount;
  rateEl.textContent = `${rate} 行／秒`;
  if (mode === "wait" && port.opened()) setMode("serial");
  else if (mode === "wait" && performance.now() - waitSince > 4000) {
    setMode("err", "序列埠無法開啟，可能被其他程式占用");
    showNotice("序列埠開啟失敗：可能正被 Arduino IDE 的序列埠監控視窗或其他分頁占用，關閉後再試一次。");
  } else if (mode === "serial" && !port.opened()) {
    setMode("err", "裝置已中斷連線");
  }
  if (mode === "serial") stateSub.textContent = `${baudSel.value} baud，每秒 ${rate} 行，透過 readUntil("\\n") 逐行解析`;
}, 1000);
// device output is untrusted text, escape before rendering
const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
setInterval(() => {
  // newest line stays at the bottom; older lines overflow off the top
  mon.innerHTML = recent.slice(-24).map((l, i, a) =>
    `<div>#${String(lineCount - a.length + i + 1).padStart(5, "0")}  ${i === a.length - 1 ? `<b>${esc(l)}</b>` : esc(l)}</div>`).join("");
  legend.innerHTML = latest.slice(0, Math.max(channels, 1)).map((v, i) =>
    `<span class="chip"><i style="background:${COLORS[i]}"></i>${NAMES[i]} <b>${Math.round(v ?? 0)}</b></span>`).join("");
}, 120);

// ---- p5 sketch (instance mode) ----
let lo = 0, hi = 1023;
new p5((p) => {
  p.setup = () => {
    p.createCanvas(scope.clientWidth, scope.clientHeight);
    p.textFont("monospace");
    if (supported) port = p.createSerial();
    new ResizeObserver(() => p.resizeCanvas(scope.clientWidth, scope.clientHeight)).observe(scope);
    if (!supported) {
      showNotice("這個瀏覽器不支援 Web Serial，p5.webserial 無法連接實體裝置。請改用桌機版 Chrome 或 Edge（89 版以上），並透過 https 或 localhost 開啟；嵌入時 iframe 需加上 allow=\"serial\"。下方先以模擬資料展示。");
    }
    startSim();
  };

  p.draw = () => {
    if (port) {
      for (let guard = 0; guard < 400; guard++) {
        const line = port.readUntil("\n");
        if (!line) break;
        handleLine(line);
      }
    }
    drawScope(p);
  };
}, scope);

function drawScope(p) {
  const W = p.width, H = p.height;
  const L = 46, R = W - 34, T = 40, B = H - 22;
  p.background(11, 13, 16);

  // auto range over visible samples, eased for a calm display
  let mn = Infinity, mx = -Infinity;
  for (let c = 0; c < channels; c++) for (let i = 0; i < LEN; i++) {
    const v = bufs[c][i];
    if (v < mn) mn = v;
    if (v > mx) mx = v;
  }
  if (Number.isFinite(mn)) {
    const pad = Math.max((mx - mn) * 0.12, 5);
    lo += (mn - pad - lo) * 0.08;
    hi += (mx + pad - hi) * 0.08;
  }
  const y = (v) => p.map(v, lo, hi, B, T);

  // grid
  p.textSize(10);
  for (let k = 0; k <= 10; k++) {
    const x = p.lerp(L, R, k / 10);
    p.stroke(255, k % 5 ? 10 : 22);
    p.line(x, T, x, B);
  }
  for (let k = 0; k <= 4; k++) {
    const gy = p.lerp(B, T, k / 4);
    p.stroke(255, 22);
    p.line(L, gy, R, gy);
    p.noStroke();
    p.fill(155, 153, 143);
    p.textAlign(p.RIGHT, p.CENTER);
    p.text(Math.round(p.lerp(lo, hi, k / 4)), L - 6, gy);
  }
  p.textAlign(p.LEFT, p.TOP);
  p.text(`最近 ${LEN} 筆`, L, B + 6);

  // traces, newest sample at the right edge
  const ctx = p.drawingContext;
  for (let c = channels - 1; c >= 0; c--) {
    p.noFill();
    p.stroke(COLORS[c]);
    p.strokeWeight(2);
    ctx.shadowColor = COLORS[c];
    ctx.shadowBlur = 10;
    p.beginShape();
    for (let i = 0; i < filled; i++) {
      const v = bufs[c][(head - filled + i + LEN) % LEN];
      if (!Number.isFinite(v)) continue;
      p.vertex(p.map(i + LEN - filled, 0, LEN - 1, L, R), y(v));
    }
    p.endShape();
    ctx.shadowBlur = 0;
    const last = bufs[c][(head - 1 + LEN) % LEN];
    if (Number.isFinite(last)) {
      p.noStroke();
      p.fill(COLORS[c]);
      p.circle(R, y(last), 8);
    }
  }
  p.strokeWeight(1);
}
</script>
</body>
</html>
