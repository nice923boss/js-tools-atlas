<script>
// p5.webserial showcase: a live scope, environment detection, UART framing, chunk reassembly,
// data formats, two-way commands and a parser throughput benchmark. Without a serial port every
// scene runs on a clearly labelled virtual device instead of pretending to talk to hardware.
(() => {
const { h, fmt, fmtCompact } = Showcase;
const P5_URL = "https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js";
const WS_URL = "https://cdn.jsdelivr.net/npm/@gohai/p5.webserial@1.1.2/libraries/p5.webserial.js";
const SIM_LABEL = "模擬資料";
let libsReady = false;

const cssv = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
const pal = () => Object.fromEntries(["fg", "muted", "bg-2", "accent", "c1", "c2", "c3", "c4", "c5", "c6"].map((k) => [k, cssv(`--${k}`)]));
const MONO = () => cssv("--mono");
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const concat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };
const rgba = (hex, a) => {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(hex) || [0, "80", "80", "80"];
  return `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})`;
};
const showNL = (s) => s.replace(/\r/g, "␍").replace(/\n/g, "↵");

async function libs(ctx) {
  if (!libsReady) {
    await ctx.gate({
      icon: "🔌", title: "p5.webserial 序列埠", button: "開始",
      desc: "載入 p5.js 與 p5.webserial（約 1 MB）。有 Arduino 等裝置時可在第一個場景連線；沒有裝置時，所有場景都以標明「模擬資料」的虛擬裝置示範讀寫與解析。",
      tags: ["Web Serial：桌機 Chrome／Edge", "約 1 MB", "可用模擬資料"],
    });
    const st = ctx.status("載入 p5.js 與 p5.webserial…");
    try {
      await ctx.load([P5_URL, WS_URL]);
    } catch (e) {
      st.error("函式庫載入失敗，請確認網路連線後重新整理");
      throw e;
    }
    st.done();
    libsReady = true;
  }
  return env();
}

// What this browser can really do. `lib` means createSerial() will not throw; `virtual` means a
// SerialPort-shaped object can be handed to p5.webserial's open().
function env() {
  const hasSerial = "serial" in navigator, hasUsb = "usb" in navigator;
  return { hasSerial, hasUsb, lib: hasSerial || hasUsb, virtual: typeof window.SerialPort === "function" };
}

// A stand-in microcontroller. The readable side emits bytes in irregular chunks (as USB serial
// does); `bytesPerSec` paces it like a real UART instead. The writable side hands each received
// line to respond() and queues the reply.
function virtualDevice({ hz = 50, produce, respond, chunky = 0.6, bytesPerSec = 0, onChunk } = {}) {
  const enc = new TextEncoder(), dec = new TextDecoder();
  let pending = new Uint8Array(0), ctrl = null, timer = 0, tick = 0, budget = 0, rx = "", readable = null, opened = null;
  const push = (x) => { pending = concat(pending, typeof x === "string" ? enc.encode(x) : x); };
  const stop = () => { clearInterval(timer); timer = 0; ctrl = null; };
  const step = () => {
    if (produce && (!bytesPerSec || pending.length < 48)) { const out = produce(tick); if (out) push(out); }
    tick++;
    if (!ctrl || !pending.length) return;
    let n = pending.length;
    if (bytesPerSec) {
      budget = Math.min(budget + bytesPerSec / hz, bytesPerSec);
      n = Math.min(n, Math.floor(budget));
      budget -= n;
    } else if (chunky) {
      if (Math.random() > chunky) return;
      n = 1 + Math.floor(Math.random() * n);
    }
    if (!n) return;
    const piece = pending.slice(0, n);
    pending = pending.slice(n);
    ctrl.enqueue(piece);
    if (onChunk) onChunk(piece);
  };
  const writable = new WritableStream({
    write(chunk) {
      rx += dec.decode(chunk, { stream: true });
      for (let k = rx.indexOf("\n"); k >= 0; k = rx.indexOf("\n")) {
        const cmd = rx.slice(0, k).trim();
        rx = rx.slice(k + 1);
        const reply = respond && cmd ? respond(cmd) : null;
        if (reply) push(reply);
      }
    },
  });
  const port = Object.create(typeof SerialPort === "function" ? SerialPort.prototype : Object.prototype);
  Object.defineProperty(port, "readable", { get: () => readable, configurable: true });
  Object.defineProperty(port, "writable", { get: () => (readable ? writable : null), configurable: true });
  port.open = async (opts) => {
    opened = { ...opts };
    readable = new ReadableStream({ start(c) { ctrl = c; timer = setInterval(step, 1000 / hz); }, cancel() { stop(); } });
  };
  port.close = async () => { stop(); readable = null; };
  port.getInfo = () => ({});
  return { port, stop, get options() { return opened; } };
}

// Connect a virtual device through p5.webserial when the browser allows it; otherwise read the
// same byte stream directly. `via` tells the UI which path is live so labels never overstate it.
function link(ctx, p, E, dev, opts = { baudRate: 115200 }) {
  let L;
  if (E.lib && E.virtual) {
    const s = p.createSerial();
    s.open(dev.port, opts);
    L = {
      via: "lib", serial: s,
      line: () => s.readUntil("\n"), text: () => s.read(), bytes: () => s.readBytes(), available: () => s.availableBytes(),
      write: (t) => s.print(t),
      close() { s.keepReading = false; if (s.reader) s.close(); dev.stop(); },
    };
  } else {
    const enc = new TextEncoder(), dec = new TextDecoder();
    let buf = new Uint8Array(0), reader = null, alive = true;
    (async () => {
      await dev.port.open(opts);
      reader = dev.port.readable.getReader();
      while (alive) {
        const { value, done } = await reader.read();
        if (done) break;
        buf = concat(buf, value);
      }
    })();
    const take = (n) => { const out = buf.slice(0, n); buf = buf.slice(n); return out; };
    L = {
      via: "raw",
      line() { const k = buf.indexOf(10); return k < 0 ? "" : dec.decode(take(k + 1)); },
      text: () => dec.decode(take(buf.length)), bytes: () => Array.from(take(buf.length)), available: () => buf.length,
      write(t) { const w = dev.port.writable.getWriter(); w.write(enc.encode(t)).then(() => w.releaseLock()); },
      close() { alive = false; if (reader) reader.cancel(); dev.stop(); },
    };
  }
  ctx.onCleanup(() => L.close());
  return L;
}

const viaText = (L) => (L.via === "lib" ? `${SIM_LABEL}・虛擬 SerialPort 經 p5.webserial 讀取` : `${SIM_LABEL}・此瀏覽器無 Web Serial，頁面直接讀模擬串流`);

// p5 instance mode inside `host`; init(p) installs draw(). Removed with the scene.
function sketch(ctx, host, init) {
  let ready = false;
  const inst = new p5((p) => {
    p.setup = () => {
      p.pixelDensity(Math.min(2, window.devicePixelRatio || 1));
      p.createCanvas(Math.max(1, host.clientWidth), Math.max(1, host.clientHeight));
      ready = true;
      init(p);
    };
  }, host);
  const ro = new ResizeObserver(() => { if (ready && host.clientWidth && host.clientHeight) inst.resizeCanvas(host.clientWidth, host.clientHeight); });
  ro.observe(host);
  ctx.onCleanup(() => { ro.disconnect(); inst.remove(); });
  return inst;
}

// Text via the 2D context (p5 has no font stacks). save/restore keeps p5's cached fill style valid.
function label(p, s, x, y, { size = 10.5, color, align = "left", base = "alphabetic", weight = 400, ui = false } = {}) {
  const g = p.drawingContext;
  g.save();
  g.font = `${weight} ${size}px ${ui ? cssv("--font") : MONO()}`;
  g.fillStyle = color;
  g.textAlign = align;
  g.textBaseline = base;
  g.fillText(s, x, y);
  g.restore();
}

function logLines(el, rows, max = 30) {
  el.replaceChildren(...rows.slice(-max).map((r) => h("div", { class: r.cls || "", text: r.text })));
}

// Simulated sensor: sine, triangle and a heartbeat-like pulse, 0..1023 like analogRead().
function scopeLine(i, hz) {
  const s = i / hz, noise = () => (Math.random() - 0.5) * 16;
  const a = 512 + 330 * Math.sin(s * Math.PI * 2 * 0.35) + noise();
  const ph = (s * 0.5) % 1;
  const b = 170 + 640 * (ph < 0.5 ? ph * 2 : 2 - ph * 2) + noise() * 0.5;
  const beat = (s * 0.9) % 1;
  const c = 300 + 560 * Math.exp(-beat * 20) - 130 * Math.exp(-((beat - 0.1) ** 2) * 900) + 70 * Math.exp(-((beat - 0.4) ** 2) * 160) + noise() * 0.6;
  return `${[a, b, c].map((v) => Math.round(clamp(v, 0, 1023))).join(",")}\n`;
}

Showcase.run({ scenes: [
  {
    id: "scope", title: "即時示波器",
    api: "createSerial()・open(port, { baudRate })・readUntil(\"\\n\")・new p5(sketch, node)",
    desc: "Arduino 每行印出「512,300,700」，p5 的 draw() 每格用 readUntil(\"\\n\") 取出完整的行，拆欄後推進環形緩衝，畫成三通道示波器。沒有裝置時，模擬串流同樣走 p5.webserial 的讀取管線；按「連接序列埠」可換成實體裝置。",
    hint: "有 Arduino 就按「連接序列埠」・鮑率要和 Serial.begin() 一致",
    async mount(ctx) {
      const E = await libs(ctx);
      ctx.html(`<div class="pw-board pw-scope">
        <div class="pw-box" data-r="scope"><div class="pw-chips"></div><div class="pw-sim"></div><div class="pw-notice" hidden></div></div>
        <div class="pw-panel"><h4>序列監看 <span data-r="rate">0 行／秒</span></h4><div class="pw-log" data-r="mon"></div></div>
      </div>`);
      const box = ctx.$("[data-r=scope]"), chips = ctx.$(".pw-chips"), badge = ctx.$(".pw-sim"), notice = ctx.$(".pw-notice");
      const mon = ctx.$("[data-r=mon]"), rateEl = ctx.$("[data-r=rate]");
      const LEN = 600, HZ = 50, COLORS = ["c2", "c3", "c4", "c5"];
      const bufs = COLORS.map(() => new Float32Array(LEN).fill(NaN));
      let head = 0, filled = 0, channels = 0, lines = 0, lastLines = 0, lo = 0, hi = 1023;
      const latest = [], recent = [];
      let L = null, mode = "sim", waitSince = 0;
      const say = (cls, text) => { badge.className = `pw-sim ${cls}`; badge.textContent = text; };
      const warn = (text) => { notice.textContent = text; notice.hidden = !text; };

      const handle = (raw) => {
        const line = raw.trim();
        if (!line) return;
        lines++;
        recent.push(line);
        if (recent.length > 40) recent.shift();
        const vals = line.split(/[,\s;]+/).map(Number).filter(Number.isFinite).slice(0, COLORS.length);
        if (!vals.length) return;
        channels = Math.max(channels, vals.length);
        for (let c = 0; c < COLORS.length; c++) { bufs[c][head] = c < vals.length ? vals[c] : NaN; if (c < vals.length) latest[c] = vals[c]; }
        head = (head + 1) % LEN;
        filled = Math.min(filled + 1, LEN);
      };
      const reset = () => { bufs.forEach((b) => b.fill(NaN)); head = 0; filled = 0; channels = 0; recent.length = 0; };
      const closeLink = async () => {
        if (!L) return;
        const old = L;
        L = null;
        old.close();
        for (let i = 0; i < 60 && old.serial && old.serial.reader; i++) await ctx.sleep(25);
      };

      const p = sketch(ctx, box, (p) => {
        p.draw = () => {
          if (L) for (let guard = 0; guard < 400; guard++) { const s = L.line(); if (!s) break; handle(s); }
          drawScope(p);
        };
      });
      const startSim = async () => {
        await closeLink();
        reset();
        L = link(ctx, p, E, virtualDevice({ hz: HZ, produce: (i) => scopeLine(i, HZ) }), { baudRate: +baud.value });
        mode = "sim";
        say("", viaText(L));
      };
      const connect = async () => {
        if (!E.lib) return warn("這個瀏覽器沒有 Web Serial 也沒有 WebUSB，p5.webserial 無法連接實體裝置。請改用桌機版 Chrome 或 Edge，並透過 https 或 localhost 開啟。畫面維持模擬資料。");
        let picked = null;
        if (E.hasSerial) {
          try {
            picked = await navigator.serial.requestPort();
          } catch (err) {
            if (err.name === "NotFoundError") warn("沒有選到序列埠：請確認裝置已接上電腦，並在跳出的清單中選取。畫面維持目前的資料來源。");
            else if (err.name === "SecurityError") warn("此頁面沒有序列埠權限：嵌入的 iframe 需要 allow=\"serial\"，或請在新分頁開啟本示範。");
            else warn(`無法取得序列埠：${err.message}`);
            return;
          }
        }
        await closeLink();
        reset();
        const s = p.createSerial();
        if (picked) s.open(picked, { baudRate: +baud.value });
        else s.open(+baud.value);
        L = { via: "serial", serial: s, line: () => s.readUntil("\n"), close() { s.keepReading = false; if (s.reader) s.close(); } };
        mode = "wait";
        waitSince = performance.now();
        warn("");
        say("wait", "等待裝置開啟…");
      };
      ctx.onCleanup(() => { if (L) L.close(); });

      ctx.button("🔌 連接序列埠", connect, { primary: true });
      ctx.button("🧪 模擬資料", () => { warn(""); startSim(); });
      const baud = ctx.select("鮑率", ["9600", "57600", "115200"], "115200", () => { if (mode === "sim") startSim(); });
      if (!E.lib) warn("此瀏覽器不支援 Web Serial，無法連接實體裝置；以下為模擬資料。");
      await startSim();

      ctx.interval(() => {
        const rate = lines - lastLines;
        lastLines = lines;
        rateEl.textContent = `${rate} 行／秒`;
        if (mode === "wait" && L && L.serial.opened()) { mode = "serial"; }
        else if (mode === "wait" && performance.now() - waitSince > 4000) {
          mode = "err";
          say("err", "序列埠無法開啟");
          warn("序列埠開啟失敗：可能正被 Arduino IDE 的序列埠監控視窗或其他分頁占用，關閉後再試一次。");
        } else if (mode === "serial" && L && !L.serial.opened()) { mode = "err"; say("err", "裝置已中斷連線"); }
        if (mode === "serial") say("real", `實體序列埠・${baud.value} baud・每秒 ${rate} 行`);
      }, 1000);
      ctx.interval(() => {
        logLines(mon, recent.slice(-24).map((l, i, a) => ({ text: `#${String(lines - a.length + i + 1).padStart(5, "0")}  ${l}`, cls: i === a.length - 1 ? "rx" : "" })));
        chips.replaceChildren(...latest.slice(0, Math.max(channels, 1)).map((v, i) =>
          h("span", { class: "pw-chip" }, h("i", { style: `background:var(--${COLORS[i]})` }), `A${i}`, h("b", { text: String(Math.round(v ?? 0)) }))));
      }, 120);

      function drawScope(p) {
        const P = pal(), W = p.width, H = p.height;

      </div>`);
      const FMT = ["CSV", "鍵值對", "JSON", "二進位"];
      let fmtI = 0, noise = false, ok = 0, bad = 0, okLast = 0, okRate = 0, byteSum = 0, frames = [], acc = [];
      const v = { t: 26.4, h: 70, pm: 18, lux: 520 };
      const hist = { t: [], h: [], pm: [], lux: [] };
      const raw = [];
      const sense = (i) => ({
        t: 26 + 3 * Math.sin(i / 90) + Math.random() * 0.3, h: 68 + 10 * Math.sin(i / 130 + 1) + Math.random(),
        pm: Math.max(2, 20 + 14 * Math.sin(i / 60 + 2) + Math.random() * 3), lux: 480 + 300 * Math.max(0, Math.sin(i / 70)) + Math.random() * 20,
      });
      const encode = (s) => {
        if (fmtI === 0) return `${s.t.toFixed(1)},${Math.round(s.h)},${Math.round(s.pm)},${Math.round(s.lux)}\n`;
        if (fmtI === 1) return `T:${s.t.toFixed(1)} H:${Math.round(s.h)} PM:${Math.round(s.pm)} LUX:${Math.round(s.lux)}\n`;
        if (fmtI === 2) return `${JSON.stringify({ t: +s.t.toFixed(1), h: Math.round(s.h), pm25: Math.round(s.pm), lux: Math.round(s.lux) })}\n`;
        const b = new Uint8Array(12), dv = new DataView(b.buffer);
        b[0] = 0xaa; b[1] = 0x55; b[2] = 8;
        dv.setInt16(3, Math.round(s.t * 100), true); dv.setUint16(5, Math.round(s.h * 100), true);
        dv.setUint16(7, Math.round(s.pm), true); dv.setUint16(9, Math.round(s.lux), true);
        let x = 0; for (let i = 3; i < 11; i++) x ^= b[i];
        b[11] = x;
        return b;
      };
      const corrupt = (out) => {
        if (typeof out !== "string") { const b = out.slice(); b[3 + ((Math.random() * 8) | 0)] ^= 0x5a; return b; }
        const k = 1 + ((Math.random() * (out.length - 3)) | 0);
        return Math.random() < 0.5 ? `${out.slice(0, k)}#${out.slice(k + 1)}` : `${out.slice(0, k)}\n`;
      };
      const dev = virtualDevice({ hz: 20, chunky: 0.7, produce: (i) => { const out = encode(sense(i)); return noise && Math.random() < 0.12 ? corrupt(out) : out; } });
      const accept = (s, text, good) => {
        raw.push({ text, cls: good ? "" : "bad" });
        if (raw.length > 30) raw.shift();
        if (!good) { bad++; return; }
        ok++;
        Object.assign(v, s);
        for (const k of Object.keys(hist)) { hist[k].push(s[k]); if (hist[k].length > 120) hist[k].shift(); }
      };
      const parseLine = (line) => {
        const t = line.trim();
        if (!t) return;
        byteSum += line.length;
        if (fmtI === 0) {
          const n = t.split(",").map(Number);
          return accept({ t: n[0], h: n[1], pm: n[2], lux: n[3] }, t, n.length === 4 && n.every(Number.isFinite));
        }
        if (fmtI === 1) {
          const m = Object.fromEntries([...t.matchAll(/([A-Z0-9]+):(-?\d+(?:\.\d+)?)(?=\s|$)/g)].map((x) => [x[1], +x[2]]));
          return accept({ t: m.T, h: m.H, pm: m.PM, lux: m.LUX }, t, ["T", "H", "PM", "LUX"].every((k) => k in m));
        }
        let o = null;
        try { o = JSON.parse(t); } catch { o = null; }
        const good = !!o && ["t", "h", "pm25", "lux"].every((k) => typeof o[k] === "number");
        return accept(good ? { t: o.t, h: o.h, pm: o.pm25, lux: o.lux } : {}, t, good);
      };
      // Binary frames: AA 55 len | int16 t*100, u16 h*100, u16 pm, u16 lux | xor
      const parseBytes = (arr) => {
        acc = acc.concat(arr);
        byteSum += arr.length;
        while (acc.length >= 12) {
          if (acc[0] !== 0xaa || acc[1] !== 0x55) { acc.shift(); continue; }
          const b = Uint8Array.from(acc.slice(0, 12)), dv = new DataView(b.buffer);
          let x = 0; for (let i = 3; i < 11; i++) x ^= b[i];
          const hexs = Array.from(b, (n) => n.toString(16).padStart(2, "0")).join(" ");
          if (x !== b[11]) { accept({}, `${hexs}  檢查碼不符`, false); acc = acc.slice(2); continue; }
          accept({ t: dv.getInt16(3, true) / 100, h: dv.getUint16(5, true) / 100, pm: dv.getUint16(7, true), lux: dv.getUint16(9, true) }, hexs, true);
          acc = acc.slice(12);
        }
      };
      const box = ctx.$("[data-r=g]");
      const p = sketch(ctx, box, (p) => {
        p.draw = () => {
          if (fmtI === 3) { const arr = L.bytes(); if (arr.length) parseBytes(arr); }
          else for (let g = 0; g < 100; g++) { const s = L.line(); if (!s) break; parseLine(s); }
          drawGauges(p);
        };
      });
      const L = link(ctx, p, E, dev);
      ctx.$(".pw-sim").textContent = viaText(L);
      ctx.group(FMT, 0, (i) => {
        fmtI = i; ok = 0; bad = 0; byteSum = 0; acc = []; raw.length = 0;
        if (L.serial) L.serial.clear(); else L.bytes();
      });
      ctx.toggle("加入雜訊", false, (on) => { noise = on; });
      let lastBytes = 0, bRate = 0;
      ctx.interval(() => {
        okRate = ok - okLast; okLast = ok; bRate = byteSum - lastBytes; lastBytes = byteSum;
        ctx.$("[data-r=fmt]").textContent = FMT[fmtI];
        ctx.$("[data-r=size]").textContent = okRate ? `每筆約 ${Math.round(bRate / Math.max(1, okRate))} B` : "";
        const st = [["成功", ok, "good"], ["失敗", bad, bad ? "bad" : ""], ["每秒", okRate, ""], ["位元組／秒", bRate, ""]];
        ctx.$("[data-r=stats]").replaceChildren(...st.map(([k, n, c]) => h("div", {}, h("small", { text: k }), h("b", { class: c, text: fmt(n) }))));
        logLines(ctx.$("[data-r=raw]"), raw, 12);
      }, 500);

      function drawGauges(p) {
        const P = pal(), W = p.width, H = p.height;
        p.clear();
        const items = [["溫度", "t", 15, 40, "°C", P.c5, 1], ["濕度", "h", 0, 100, "%", P.c2, 0], ["PM2.5", "pm", 0, 80, "µg", P.c6, 0], ["照度", "lux", 0, 1000, "lx", P.c1, 0]];
        const cols = W > 420 || (W > 280 && H < 360) ? 2 : 1, rows = Math.ceil(items.length / cols);
        const top = 54, cw = (W - 20) / cols, ch = (H - top - 10) / rows;
        label(p, "環境感測站（模擬資料）", 12, 50, { color: P.muted, size: 11, ui: true });
        items.forEach(([name, k, lo, hi, unit, col, dp], i) => {
          const cx = 10 + (i % cols) * cw, cy = top + Math.floor(i / cols) * ch;
          const r = Math.max(14, Math.min(cw * 0.22, ch * 0.36));
          const gx = cx + r + 12, gy = cy + ch / 2 + r * 0.25;
          p.noFill(); p.strokeCap(p.ROUND); p.strokeWeight(Math.max(4, r * 0.18));
          p.stroke(rgba(P.fg, 0.1)); p.arc(gx, gy, r * 2, r * 2, Math.PI * 0.8, Math.PI * 2.2);
          const f = clamp(((v[k] ?? lo) - lo) / (hi - lo), 0, 1);
          p.stroke(col); p.arc(gx, gy, r * 2, r * 2, Math.PI * 0.8, Math.PI * (0.8 + 1.4 * Math.max(0.01, f)));
          label(p, fmt(v[k] ?? 0, dp), gx, gy + 2, { color: P.fg, align: "center", base: "middle", size: Math.max(11, r * 0.42), weight: 600 });
          label(p, unit, gx, gy + r * 0.62, { color: P.muted, align: "center", size: 10 });
          const sx = gx + r + 14, sw = cx + cw - sx - 8, s = hist[k];
          if (sw > 30 && s.length > 1) {
            p.noFill(); p.stroke(col); p.strokeWeight(1.5);
            p.beginShape();
            s.forEach((val, j) => p.vertex(sx + (j / 119) * sw, gy + r * 0.5 - clamp((val - lo) / (hi - lo), 0, 1) * r * 1.3));
            p.endShape();
          }
          label(p, name, sw > 30 ? sx : gx - r, gy - r * 0.95, { color: P.muted, size: 11.5, weight: 500, ui: true });
        });
      }
    },
  },

  {
    id: "cmd", title: "雙向指令",
    api: "println(\"LED 1\")・print()・write()・readUntil(\"\\n\")",
    desc: "仿照 p5.webserial 官方 led 與 servo_motor 範例：頁面用 println() 送出文字指令，（模擬的）微控制器回覆 OK 或 ERR。右邊的 LED 與伺服臂只依「收到的回覆」更新，不是按鈕直接改畫面；PING 量的是指令來回一趟的時間。",
    hint: "點 LED、拉 PWM 或伺服角度・送出錯誤指令看 ERR 回覆",
    async mount(ctx) {
      const E = await libs(ctx);
      ctx.html(`<div class="pw-board pw-split">
        <div class="pw-box" data-r="dev"><div class="pw-sim"></div></div>
        <div class="pw-panel"><h4>收發紀錄 <span data-r="rtt"></span></h4><div class="pw-log" data-r="log"></div>
          <pre class="pw-code pw-wide"><span class="c">// Arduino 端（模擬）</span>
line = Serial.readStringUntil('\\n');
if (line.startsWith("LED")) ...
Serial.println("OK LED=1");</pre></div>
      </div>`);
      const dev = { led: 0, pwm: 0, servo: 90 };
      const shown = { led: 0, pwm: 0, servo: 90 };
      const log = [];
      const pings = new Map();
      let rtt = null, txFlash = 0, rxFlash = 0, sweep = true, sweepT = 0;
      const vdev = virtualDevice({
        hz: 50, chunky: 0.8,
        respond(cmd) {
          const [op, arg] = cmd.split(/\s+/);
          const n = Number(arg);
          switch ((op || "").toUpperCase()) {
            case "LED": dev.led = n ? 1 : 0; return `OK LED=${dev.led}\n`;
            case "PWM": if (!Number.isFinite(n)) return "ERR PWM 需要 0~255\n"; dev.pwm = clamp(Math.round(n), 0, 255); return `OK PWM=${dev.pwm}\n`;
            case "SERVO": if (!Number.isFinite(n)) return "ERR SERVO 需要角度\n"; dev.servo = clamp(Math.round(n), 0, 180); return `OK SERVO=${dev.servo}\n`;
            case "PING": return `PONG ${arg || ""}\n`;
            default: return `ERR 未知指令 ${op}\n`;
          }
        },
      });
      const add = (text, cls) => { log.push({ text, cls }); if (log.length > 40) log.shift(); };
      const send = (cmd, quiet) => {
        L.write(`${cmd}\n`);
        txFlash = 1;
        if (!quiet) add(`→ ${cmd}`, "tx");
      };
      const box = ctx.$("[data-r=dev]");
      const p = sketch(ctx, box, (p) => {
        p.draw = () => {
          for (let g = 0; g < 50; g++) {
            const s = L.line().trim();
            if (!s) break;
            rxFlash = 1;
            const m = /^OK (\w+)=(\d+)/.exec(s);
            if (m) shown[m[1].toLowerCase()] = +m[2];
            if (s.startsWith("PONG")) { const t0 = pings.get(s.slice(5)); if (t0) { rtt = performance.now() - t0; pings.delete(s.slice(5)); } }
            if (!(m && m[1] === "SERVO" && sweep)) add(`← ${s}`, s.startsWith("ERR") ? "bad" : "rx");
          }
          if (sweep && p.frameCount % 5 === 0) { sweepT += 0.12; send(`SERVO ${Math.round(90 + 80 * Math.sin(sweepT))}`, true); }
          drawDevice(p);
        };
      });
      const L = link(ctx, p, E, vdev, { baudRate: 57600 });
      ctx.$(".pw-sim").textContent = viaText(L).replace(SIM_LABEL, "模擬裝置");
      ctx.button("💡 LED", () => send(`LED ${shown.led ? 0 : 1}`), { primary: true });
      ctx.slider("PWM", { min: 0, max: 255, step: 1, value: 0 }, (n) => send(`PWM ${n}`));
      const ang = ctx.slider("伺服", { min: 0, max: 180, step: 1, value: 90, format: (n) => `${n}°` }, (n) => { sweep = false; sw.setAttribute("aria-pressed", "false"); send(`SERVO ${n}`); });
      const sw = ctx.toggle("自動掃動", true, (on) => { sweep = on; if (!on) send(`SERVO ${ang.value}`); });
      ctx.button("PING", () => { const id = String(Math.round(performance.now())); pings.set(id, performance.now()); send(`PING ${id}`); });
      ctx.button("錯誤指令", () => send("BLINK fast"));
      ctx.timeout(() => { send("LED 1"); send("PWM 180"); }, 400);
      ctx.interval(() => {
        logLines(ctx.$("[data-r=log]"), log, 18);
        ctx.$("[data-r=rtt]").textContent = rtt != null ? `來回 ${rtt.toFixed(0)} ms` : "";
      }, 150);

      function drawDevice(p) {
        const P = pal(), W = p.width, H = p.height, g = p.drawingContext;
        p.clear();
        const s = Math.min(W / 2.3, H / 1.5);
        const cx = W / 2, cy = H / 2 + 16;
        const lx = cx - s * 0.55, sx = cx + s * 0.5;
        // LED: brightness = PWM when on
        const on = shown.led, b = on ? 0.25 + 0.75 * (shown.pwm / 255) : 0;
        g.shadowColor = P.c3; g.shadowBlur = on ? 40 * b : 0;
        p.noStroke(); p.fill(on ? rgba(P.c3, 0.25 + 0.75 * b) : rgba(P.fg, 0.08));
        p.circle(lx, cy - s * 0.1, s * 0.42);
        g.shadowBlur = 0;
        p.stroke(rgba(P.fg, 0.35)); p.strokeWeight(3);
        p.line(lx - s * 0.06, cy + s * 0.11, lx - s * 0.06, cy + s * 0.36);
        p.line(lx + s * 0.06, cy + s * 0.11, lx + s * 0.06, cy + s * 0.3);
        label(p, `LED ${on ? "ON" : "OFF"}・PWM ${shown.pwm}`, lx, cy + s * 0.5, { color: P.muted, align: "center", size: 11.5 });
        // servo: horn angle follows the reported SERVO value
        p.noStroke(); p.fill(rgba(P.fg, 0.1)); p.rect(sx - s * 0.26, cy - s * 0.16, s * 0.52, s * 0.36, 8);
        p.noFill(); p.stroke(rgba(P.fg, 0.15)); p.strokeWeight(1);
        p.arc(sx, cy, s * 0.82, s * 0.82, Math.PI, Math.PI * 2);
        const a = Math.PI + (shown.servo / 180) * Math.PI;
        p.stroke(P.c2); p.strokeWeight(Math.max(5, s * 0.05)); p.strokeCap(p.ROUND);
        p.line(sx, cy, sx + Math.cos(a) * s * 0.38, cy + Math.sin(a) * s * 0.38);
        p.noStroke(); p.fill(P.c2); p.circle(sx, cy, s * 0.1);
        label(p, `SERVO ${shown.servo}°`, sx, cy + s * 0.5, { color: P.muted, align: "center", size: 11.5 });
        // TX / RX activity lights, like the ones on an Arduino board
        txFlash *= 0.85; rxFlash *= 0.85;
        [["TX", txFlash, P.c5], ["RX", rxFlash, P.c4]].forEach(([n, f, c], i) => {
          const x = 18 + i * 52, y = 50;
          p.noStroke(); p.fill(f > 0.1 ? c : rgba(P.fg, 0.12)); p.circle(x, y, 10);
          label(p, n, x + 10, y, { color: P.muted, base: "middle", size: 11 });
        });
      }
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "readUntil(\"\\n\") 逐行解析・bufferSize()・TextDecoder 整批 split 對照",
    desc: "把 N 行 CSV 一次塞進 p5.webserial 的接收緩衝區，再用 readUntil(\"\\n\") 逐行取出並拆欄，量每秒能解析幾行。readUntil 每取一行都會把剩下的緩衝區往前搬，所以堆積越多越慢；對照組是一次解碼後整批 split。結論：draw() 每格都要讀，不要讓資料堆在緩衝區。",
    hint: "按「開始測試」・行數逐級加倍，單級超過 2 秒就停",
    async mount(ctx) {
      await libs(ctx);
      ctx.html(`<div class="pw-stress"><canvas></canvas></div>`);
      ctx.controls.classList.add("bottom");
      const cv = ctx.$("canvas"), g = cv.getContext("2d");
      const enc = new TextEncoder(), dec = new TextDecoder();
      const pts = [];
      let byConstructor = true;
      const parser = () => {
        try { return new p5.prototype.WebSerial(); } catch {
          // No Web Serial: the class refuses to construct, but its buffer methods do not touch the port.
          byConstructor = false;
          const s = Object.create(p5.prototype.WebSerial.prototype);
          return Object.assign(s, { inBuf: new ArrayBuffer(1 << 20), inLen: 0, textEncoder: new TextEncoder(), textDecoder: new TextDecoder() });
        }
      };
      const draw = () => {
        const r = cv.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
        if (!r.width) return;
        cv.width = r.width * dpr; cv.height = r.height * dpr;
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        const P = pal(), W = r.width, H = r.height, l = 56, rr = W - 16, t = 46, b = H - 42;
        g.clearRect(0, 0, W, H);
        g.font = `600 13px ${cssv("--font")}`; g.fillStyle = P.fg; g.textAlign = "left";
        g.fillText("解析速度（行／秒，對數座標）", l, 22);
        g.font = `400 11.5px ${cssv("--font")}`; g.fillStyle = P.muted;
        g.fillText(byConstructor ? "readUntil 逐行 vs 整批 split" : "無 Web Serial：直接呼叫函式庫的緩衝區方法", l, 38);
        const ys = [1e3, 1e9];
        const X = (n) => l + ((Math.log10(n) - 3) / 2) * (rr - l), Y = (v) => b - ((Math.log10(clamp(v, ys[0], ys[1])) - 3) / 6) * (b - t);
        g.strokeStyle = rgba(P.fg, 0.1); g.lineWidth = 1; g.font = `400 10.5px ${MONO()}`; g.fillStyle = P.muted;
        for (let e = 3; e <= 9; e++) { g.beginPath(); g.moveTo(l, Y(10 ** e)); g.lineTo(rr, Y(10 ** e)); g.stroke(); g.textAlign = "right"; g.fillText(fmtCompact(10 ** e), l - 6, Y(10 ** e) + 4); }
        g.textAlign = "center";
        for (let e = 3; e <= 5; e++) { g.textAlign = e === 3 ? "left" : e === 5 ? "right" : "center"; g.fillText(`${fmtCompact(10 ** e)} 行`, X(10 ** e), b + 16); }
        [["readUntil", P.c3], ["split", P.c4]].forEach(([k, c], i) => {
          const s = pts.filter((q) => q[k]);
          g.strokeStyle = c; g.fillStyle = c; g.lineWidth = 2.5;
          g.beginPath();
          s.forEach((q, j) => (j ? g.lineTo(X(q.n), Y(q[k])) : g.moveTo(X(q.n), Y(q[k]))));
          g.stroke();
          s.forEach((q) => { g.beginPath(); g.arc(X(q.n), Y(q[k]), 4, 0, Math.PI * 2); g.fill(); });
          g.font = `500 11.5px ${MONO()}`; g.textAlign = "left";
          g.fillText(k === "readUntil" ? "● readUntil(\"\\n\")" : "● decode + split", l + i * 170, b + 34);
        });
        if (!pts.length) { g.fillStyle = P.muted; g.textAlign = "center"; g.font = `400 13px ${cssv("--font")}`; g.fillText("按「開始測試」", (l + rr) / 2, (t + b) / 2); }
      };
      ctx.onResize(draw);
      draw();
      ctx.bench({
        label: "緩衝區行數", unit: "行", sizes: [1000, 2000, 4000, 8000, 16000, 32000, 64000], target: 1000, budget: 2000,
        note: "每行像「512,300,700」約 12 位元組。即時串流時每格只堆幾行，readUntil 很快；問題出在讓資料堆積。",
        prepare(n) {
          let s = "";
          for (let i = 0; i < n; i++) s += `${(i * 7) % 1024},${(i * 13) % 1024},${(i * 29) % 1024}\n`;
          const bytes = enc.encode(s);
          const t0 = performance.now();
          let sum = 0;
          for (const line of dec.decode(bytes).split("\n")) if (line) sum += +line.split(",")[0];
          const splitMs = performance.now() - t0;
          const ser = parser();
          ser.bufferSize(Math.max(1 << 20, bytes.length + 64));
          new Uint8Array(ser.inBuf).set(bytes);
          ser.inLen = bytes.length;
          return { ser, splitMs, sum };
        },
        run(n, d) {
          if (n === 1000) pts.length = 0;
          const t0 = performance.now();
          let count = 0, sum = 0;
          for (;;) {
            const line = d.ser.readUntil("\n");
            if (!line) break;
            sum += +line.split(",")[0];
            count++;
          }
          const ms = Math.max(performance.now() - t0, 0.05);
          if (count !== n || sum !== d.sum) throw new Error(`解析結果不一致（${count} 行）`);
          pts.push({ n, readUntil: (n / ms) * 1000, split: (n / Math.max(d.splitMs, 0.05)) * 1000 });
          draw();
          return "";
        },
      });
    },
  },
] });
})();
</script>
</body>
</html>
