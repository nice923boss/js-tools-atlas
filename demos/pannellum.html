<style>
  .pn-host { position: absolute; left: 0; right: 0; bottom: 0; top: var(--sc-ctl-h, 0px); }
  .pn-host.pnlm-container { position: absolute; width: auto; height: auto; background: #0e1013; font-family: var(--font); }
  .pn-stress { position: absolute; inset: 8px; border-radius: 10px; overflow: hidden; background: #07080b; }
  @media (min-width: 761px) { .pn-stress { inset: 8px 8px 8px 350px; } }
  .pn-host .pnlm-controls-container { top: 8px; left: 8px; }
  .pn-host .pnlm-compass { top: 10px; right: 10px; width: 50px; height: 50px; border-radius: 50%;
    background-color: rgba(255,255,255,.88); box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .pn-host .pnlm-tooltip span { font-family: var(--font); }
  .pn-host .pnlm-load-box p, .pn-host .pnlm-info-box { font-family: var(--font); }
  /* Numbered tour hotspot: label on hover or while active. */
  .pn-hs { width: 26px !important; height: 26px !important; cursor: pointer; }
  .pn-hs b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box;
    background: rgba(14,16,19,.75); color: #fff; border: 2px solid #fff; font: 700 12px/1 var(--mono); transition: transform .2s, background .2s; }
  .pn-hs span { position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); white-space: nowrap; padding: 4px 9px;
    border-radius: 999px; background: rgba(0,0,0,.7); color: #fff; font: 600 12px/1.3 var(--font); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .pn-hs:hover span, .pn-hs.on span { opacity: 1; }
  .pn-hs.on b { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); transform: scale(1.25); }
  .pn-card { position: absolute; left: 12px; bottom: 58px; z-index: 50; width: min(330px, calc(100% - 24px)); padding: 12px 14px; transition: opacity .35s, transform .35s; }
  .pn-card.fade { opacity: 0; transform: translateY(8px); }
  .pn-card small { color: var(--accent); font: 600 11px/1 var(--mono); letter-spacing: .05em; }
  .pn-card h2 { margin: 4px 0; font-size: 16px; }
  .pn-card p { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .pn-card .bar { height: 3px; margin-top: 10px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .pn-card .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .pn-tour { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 50; display: flex; flex-wrap: wrap; gap: 6px; }
  .pn-tour .btn { padding: 7px 10px; font-size: 12px; }
  .pn-tour .btn b { font: 700 12px/1 var(--mono); }
  @media (max-width: 520px) { .pn-tour .btn em { display: none; } .pn-card { bottom: 56px; } }
  .pn-tour em { font-style: normal; }
  @media (max-height: 560px) { .pn-card p { display: none; } .pn-card { width: min(260px, calc(100% - 24px)); padding: 9px 12px; } }
  /* User pin and stress dot hotspots. */
  .pn-pin { width: 16px !important; height: 16px !important; cursor: pointer; }
  .pn-pin i { display: block; width: 16px; height: 16px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--c3);
    box-shadow: 0 0 0 2px rgba(0,0,0,.45); }
  .pn-pin span { position: absolute; left: 22px; top: -3px; white-space: nowrap; padding: 3px 7px; border-radius: 6px;
    background: rgba(0,0,0,.65); color: #fff; font: 600 11px/1.3 var(--mono); }
  .pn-pin:hover i { background: #e5484d; }
  .pn-dot { width: 10px !important; height: 10px !important; border-radius: 50%; background: var(--c2); box-shadow: 0 0 0 2px rgba(0,0,0,.5); }
  .pn-box { position: absolute; left: 10px; bottom: 10px; z-index: 60; max-width: min(360px, calc(100% - 20px)); padding: 8px 11px;
    border-radius: 9px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
    font: 500 12px/1.6 var(--font); color: var(--fg); pointer-events: none; }
  .pn-box b { font: 600 12px/1.6 var(--mono); color: var(--accent); }
  .pn-box .k { color: var(--muted); }
  .pn-box i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Pannellum showcase: eight scenes, from the original guided tour to a hotspot-count stress ramp.
// Every scene owns its viewer; viewer.destroy() tears down the renderer and loses the WebGL context.
const { fmt, h } = Showcase;
const PANO = "_shared/img/panorama.jpg";
const FONT = '"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif';
const STR = {
  loadButtonLabel: "點擊載入<br>全景圖", loadingLabel: "載入中", bylineLabel: "%s",
  noPanoramaError: "沒有指定全景圖。", fileAccessError: "無法讀取檔案 %s。", malformedURLError: "網址格式有誤。",
  iOS8WebGLError: "iOS 8 的 WebGL 無法正常運作。", genericWebGLError: "瀏覽器不支援 WebGL。",
  textureSizeError: "全景圖尺寸超過裝置上限（%s）。", unknownError: "發生未知錯誤。",
  twoTouchActivate: "請用兩指拖曳", twoTouchXActivate: "請用兩指左右拖曳", twoTouchYActivate: "請用兩指上下拖曳",
  ctrlZoomActivate: "按住 %s 再滾動來縮放",
};
const STOPS = [
  { name: "潟湖夕陽", text: "太陽正沉入潟湖對岸，天空從橘色漸層到藍紫色，水面拉出一條金色光帶。", pitch: 4, yaw: 36, hfov: 62 },
  { name: "遠方鐘樓", text: "把視角拉近，對岸天際線上的鐘樓與教堂圓頂清晰可見。", pitch: 3, yaw: 55, hfov: 32 },
  { name: "水岸石階", text: "幾位遊客坐在石階上等日落，石階一路延伸到水裡，長滿綠色海藻。", pitch: -10, yaw: 97, hfov: 70 },
  { name: "紅窗別墅", text: "黃牆紅窗的老別墅，是這段水岸步道上最顯眼的建築。", pitch: 9, yaw: 156, hfov: 72 },
  { name: "運河老房子", text: "轉到背面，粉色與磚紅色的住宅沿著步道排開。", pitch: 6, yaw: -135, hfov: 78 },
  { name: "鑄鐵繫船柱", text: "低頭看腳邊，老式繫船柱表面的鏽色是海風留下的痕跡。", pitch: -24, yaw: -77, hfov: 70 },
];

function makeViewer(ctx, host, cfg) {
  const v = pannellum.viewer(host, { autoLoad: true, strings: STR, showFullscreenCtrl: false, ...cfg });
  ctx.onCleanup(() => v.destroy());
  return v;
}
const box = (ctx) => { const b = h("div", { class: "pn-box" }); ctx.el.append(b); return b; };
const row = (k, v) => `<div><span class="k">${k}</span>　${v}</div>`;
const n1 = (x) => `<b>${x.toFixed(1)}°</b>`;
const canvas = (w, hh) => Object.assign(document.createElement("canvas"), { width: w, height: hh });
async function loadImg(src) { const im = new Image(); im.src = src; await im.decode(); return im; }
const blobUrl = (c, ctx) => new Promise((res) => c.toBlob((b) => { const u = URL.createObjectURL(b); ctx.onCleanup(() => URL.revokeObjectURL(u)); res(u); }, "image/jpeg", 0.88));

// Equirectangular test pattern: 15 degree grid, yaw labels and a title. Yaw 0 is the image centre.
function gridPano(w, hh, { hue = 210, title = "", sub = "" } = {}) {
  const c = canvas(w, hh), g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, hh);
  grad.addColorStop(0, `hsl(${hue} 55% 22%)`); grad.addColorStop(0.5, `hsl(${hue} 45% 42%)`);
  grad.addColorStop(0.501, `hsl(${(hue + 30) % 360} 25% 26%)`); grad.addColorStop(1, `hsl(${(hue + 30) % 360} 30% 10%)`);
  g.fillStyle = grad; g.fillRect(0, 0, w, hh);
  const X = (yaw) => w / 2 + (yaw / 360) * w, Y = (p) => hh / 2 - (p / 180) * hh;
  g.lineWidth = Math.max(1, w / 2048);
  for (let yaw = -180; yaw <= 180; yaw += 15) {
    g.strokeStyle = yaw % 90 === 0 ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.22)";
    g.beginPath(); g.moveTo(X(yaw), 0); g.lineTo(X(yaw), hh); g.stroke();
  }
  for (let p = -75; p <= 75; p += 15) {
    g.strokeStyle = p === 0 ? "rgba(255,230,120,.9)" : "rgba(255,255,255,.22)";
    g.beginPath(); g.moveTo(0, Y(p)); g.lineTo(w, Y(p)); g.stroke();
  }
  const fs = w / 64;
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(255,255,255,.85)"; g.font = `600 ${fs * 0.55}px ui-monospace,Consolas,monospace`;
  for (let yaw = -150; yaw <= 180; yaw += 30) g.fillText(`${yaw}°`, X(yaw), Y(0) + fs * 0.6);
  g.font = `700 ${fs * 1.6}px ${FONT}`;
  for (const yaw of [-135, -45, 45, 135]) {
    g.fillStyle = "#fff"; g.fillText(title, X(yaw), Y(24));
    if (sub) { g.font = `500 ${fs * 0.75}px ${FONT}`; g.fillStyle = "rgba(255,255,255,.75)"; g.fillText(sub, X(yaw), Y(15)); g.font = `700 ${fs * 1.6}px ${FONT}`; }
  }
  return c;
}

// Cube faces in Pannellum order [front, right, back, left, up, down].
// u points right and v points down on each face; x right, y up, z forward (yaw 0).
const FACES = [
  { key: "f", name: "前 front", dir: (u, v) => [u, -v, 1] },
  { key: "r", name: "右 right", dir: (u, v) => [1, -v, -u] },
  { key: "b", name: "後 back", dir: (u, v) => [-u, -v, -1] },
  { key: "l", name: "左 left", dir: (u, v) => [-1, -v, u] },
  { key: "u", name: "上 up", dir: (u, v) => [u, 1, v] },
  { key: "d", name: "下 down", dir: (u, v) => [u, -1, -v] },
];
// Inverse of FACES[i].dir: which face a view direction hits, and where on it (u, v in -1..1).
function faceAt(pitch, yaw) {
  const p = (pitch * Math.PI) / 180, y = (yaw * Math.PI) / 180;
  const x = Math.cos(p) * Math.sin(y), up = Math.sin(p), z = Math.cos(p) * Math.cos(y);
  const ax = Math.abs(x), ay = Math.abs(up), az = Math.abs(z);
  if (az >= ax && az >= ay) return z > 0 ? [0, x / az, -up / az] : [2, -x / az, -up / az];
  if (ax >= ay) return x > 0 ? [1, -z / ax, -up / ax] : [3, z / ax, -up / ax];
  return up > 0 ? [4, x / ay, z / ay] : [5, x / ay, -z / ay];
}
// Resample an equirectangular image into six cube faces (nearest neighbour, plain JS).
function equirectToCube(img, size) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const sc = canvas(W, H), sg = sc.getContext("2d", { willReadFrequently: true });
  sg.drawImage(img, 0, 0);
  const src = sg.getImageData(0, 0, W, H).data;
  return FACES.map((f) => {
    const c = canvas(size, size), g = c.getContext("2d"), out = g.createImageData(size, size), o = out.data;
    for (let j = 0, k = 0; j < size; j++) {
      const v = (2 * j + 1) / size - 1;
      for (let i = 0; i < size; i++, k += 4) {
        const [x, y, z] = f.dir((2 * i + 1) / size - 1, v);
        const sx = Math.floor((Math.atan2(x, z) / (2 * Math.PI) + 0.5) * W) % W;
        const sy = Math.min(H - 1, Math.max(0, Math.floor((0.5 - Math.atan2(y, Math.hypot(x, z)) / Math.PI) * H)));
        const s = (sy * W + sx) * 4;
        o[k] = src[s]; o[k + 1] = src[s + 1]; o[k + 2] = src[s + 2]; o[k + 3] = 255;
      }
    }
    g.putImageData(out, 0, 0);
    return c;
  });
}
function labelFace(face, f) {
  const s = face.width, c = canvas(s, s), g = c.getContext("2d");
  g.drawImage(face, 0, 0);
  g.strokeStyle = "#f7df1e"; g.lineWidth = s / 64; g.strokeRect(0, 0, s, s);
  g.fillStyle = "rgba(0,0,0,.6)"; g.fillRect(s * 0.3, s * 0.42, s * 0.4, s * 0.16);
  g.fillStyle = "#f7df1e"; g.font = `700 ${s / 14}px ${FONT}`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(f.name, s / 2, s / 2);
  g.font = `600 ${s / 22}px ui-monospace,Consolas,monospace`; g.fillText("↑ 面頂端", s / 2, s * 0.08);
  return c;
}

Showcase.run({ scenes: [
  {
    id: "tour", title: "自動導覽",
    api: "pannellum.viewer({ hotSpots, compass, northOffset }) ＋ lookAt(pitch, yaw, hfov, ms)",
    desc: "原版招牌：六個編號熱點用 createTooltipFunc 自訂外觀，lookAt() 依序飛到每個景點並配上說明卡；右上指北針依 northOffset 校正方位。任何拖曳都會把視角交還給使用者。",
    hint: "拖曳即可接手視角，點編號或下方按鈕跳到景點",
    mount(ctx) {
      ctx.html(`<div class="pn-host"></div>
        <div class="panel pn-card"><small>導覽 1 / 6</small><h2>載入中</h2><p>全景圖載入後會自動開始導覽。</p><div class="bar"><i></i></div></div>
        <div class="pn-tour"></div>`);
      const card = ctx.$(".pn-card"), prog = ctx.$(".pn-card .bar i"), tour = ctx.$(".pn-tour");
      const dots = [];
      let index = -1, timer = 0, playing = true, progAnim = null, dwell = 5200;
      const viewer = makeViewer(ctx, ctx.$(".pn-host"), {
        type: "equirectangular", panorama: PANO, pitch: 2, yaw: 0, hfov: 100, compass: true, northOffset: 126,
        hotSpots: STOPS.map((s, i) => ({
          pitch: s.pitch, yaw: s.yaw, type: "info", cssClass: "pn-hs",
          createTooltipFunc: (div) => { div.innerHTML = `<b>${i + 1}</b><span>${s.name}</span>`; dots[i] = div; },
          clickHandlerFunc: () => go(i, true),
        })),
      });
      ctx.onCleanup(() => { clearTimeout(timer); progAnim?.cancel(); });
      const playBtn = ctx.button("暫停導覽", () => setPlaying(!playing), { primary: true });
      ctx.slider("停留", { min: 3, max: 10, step: 0.5, value: 5.2, format: (v) => `${v.toFixed(1)} 秒` }, (v) => { dwell = v * 1000; });
      const btns = STOPS.map((s, i) => {
        const b = h("button", { class: "btn", type: "button" });
        b.innerHTML = `<b>${i + 1}</b><em> ${s.name}</em>`;
        b.onclick = () => go(i, true);
        tour.append(b);
        return b;
      });
      function show(i) {
        card.classList.add("fade");
        ctx.timeout(() => {
          card.querySelector("small").textContent = `導覽 ${i + 1} / ${STOPS.length}`;
          card.querySelector("h2").textContent = STOPS[i].name;
          card.querySelector("p").textContent = STOPS[i].text;
          card.classList.remove("fade");
        }, 250);
        dots.forEach((d, k) => d && d.classList.toggle("on", k === i));
        btns.forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
      }
      function go(i, manual) {
        clearTimeout(timer);
        index = i;
        viewer.stopAutoRotate();
        viewer.lookAt(STOPS[i].pitch, STOPS[i].yaw, STOPS[i].hfov, 1800);
        show(i);
        if (manual) setPlaying(false);
        progAnim?.cancel();
        progAnim = prog.animate([{ width: "0%" }, { width: "100%" }], { duration: dwell, easing: "linear", fill: "forwards" });
        if (!playing) progAnim.pause();
        if (playing) timer = setTimeout(() => go((index + 1) % STOPS.length), dwell);
      }
      function setPlaying(on) {
        playing = on;
        playBtn.textContent = on ? "暫停導覽" : "播放導覽";
        clearTimeout(timer);
        if (on) go((index + 1) % STOPS.length);
        else progAnim?.pause();
      }
      viewer.on("load", () => go(0));
      viewer.on("mousedown", () => playing && setPlaying(false));
      viewer.on("touchstart", () => playing && setPlaying(false));
      viewer.on("error", (msg) => { card.querySelector("h2").textContent = "載入失敗"; card.querySelector("p").textContent = msg; });
    },
  },
  {
    id: "cube", title: "立方體貼圖",
    api: "type: \"cubemap\", cubeMap: [前, 右, 後, 左, 上, 下]",
    desc: "把 4096×2048 等距長方全景在瀏覽器裡逐像素重投影成六張正方形面，再交給 cubemap 模式。打開「標示六個面」可看到每張面的邊界與頂端方向；點畫面任一處，會算出落在哪一面、面內哪個像素。",
    hint: "拖曳環顧，點任一處看命中的面與座標",
    async mount(ctx) {
      ctx.html('<div class="pn-host"></div>');
      const info = box(ctx);
      const st = ctx.status("讀取全景圖");
      const img = await loadImg(PANO);
      let size = 1024, labelled = true, viewer = null, faces = null, convMs = 0, hit = "點畫面任一處";
      const view = { pitch: 10, yaw: 20, hfov: 100 };
      const build = async () => {
        if (!faces || faces[0].width !== size) {
          st.text(`重投影成 6 × ${size}² 像素`); await ctx.frame();
          const t0 = performance.now(); faces = equirectToCube(img, size); convMs = performance.now() - t0;
        }
        if (viewer) { Object.assign(view, { pitch: viewer.getPitch(), yaw: viewer.getYaw(), hfov: viewer.getHfov() }); viewer.destroy(); }
        const host = ctx.$(".pn-host");
        host.replaceChildren();
        viewer = pannellum.viewer(host, { autoLoad: true, strings: STR, showFullscreenCtrl: false, type: "cubemap", ...view,
          cubeMap: faces.map((c, i) => (labelled ? labelFace(c, FACES[i]) : c).toDataURL("image/jpeg", 0.88)) });
        viewer.on("load", () => st.done());
      };
      ctx.onCleanup(() => viewer?.destroy());
      await build();
      let down = null;
      ctx.on(ctx.$(".pn-host"), "pointerdown", (e) => { down = [e.clientX, e.clientY]; });
      ctx.on(ctx.$(".pn-host"), "click", (e) => {
        if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5 || e.target.closest(".pnlm-controls-container")) return;
        const [p, y] = viewer.mouseEventToCoords(e);
        const [fi, u, v] = faceAt(p, y);
        hit = `pitch ${n1(p)} yaw ${n1(y)} → <b>${FACES[fi].name}</b> (${Math.floor(((u + 1) / 2) * size)}, ${Math.floor(((v + 1) / 2) * size)})`;
      });
      ctx.interval(() => {
        info.innerHTML = row("每面", `<b>${size}×${size}</b> 像素，共 <b>${fmt(6 * size * size)}</b>`) + row("重投影耗時", `<b>${convMs.toFixed(0)} ms</b>`) + row("點擊", hit);
      }, 200);
      ctx.group(["每面 512", "每面 1024"], 1, (i) => { size = i ? 1024 : 512; build(); });
      ctx.toggle("標示六個面", true, (v) => { labelled = v; build(); });
    },
  },
  {
    id: "multires", title: "多解析度分塊",
    api: "type: \"multires\", multiRes: { basePath, path: \"/%l/%s%y_%x\", tileResolution: 256, maxLevel: 3 }",
    desc: "把全景切成三層立方體金字塔：L1 每面 1 塊、L2 每面 2×2、L3 每面 4×4，每塊 256 像素，邊框顏色代表層級。Pannellum 依目前視野與畫布像素決定要哪一層，只載入看得到的那幾塊；拉近就換更細的一層。",
    hint: "滾輪拉近拉遠，看左下各層載入的分塊數變化",
    mount(ctx) {
      ctx.html('<div class="pn-host"></div>');
      const info = box(ctx);
      const COLORS = { 1: "#4cc9f0", 2: "#f7df1e", 3: "#f72585" };
      let counts = { 1: 0, 2: 0, 3: 0 }, bytes = 0, gen = 0, viewer = null;
      const po = new PerformanceObserver((list) => {
        for (const e of list.getEntries()) {
          const m = e.name.match(/multires\/(\d)\/[a-z]\d_\d\.jpg\?g=(\d+)/);
          if (m && +m[2] === gen) { counts[m[1]]++; bytes += e.transferSize || e.encodedBodySize || 0; }
        }
      });
      po.observe({ type: "resource", buffered: false });
      ctx.onCleanup(() => po.disconnect());
      const build = () => {
        const view = viewer ? { pitch: viewer.getPitch(), yaw: viewer.getYaw(), hfov: viewer.getHfov() } : { pitch: 5, yaw: 40, hfov: 100 };
        viewer?.destroy();
        gen++; counts = { 1: 0, 2: 0, 3: 0 }; bytes = 0;
        const host = ctx.$(".pn-host");
        host.replaceChildren();
        // A per-build query string on the extension forces real requests, so the counts are not hidden by the image cache.
        viewer = pannellum.viewer(host, { autoLoad: true, strings: STR, showFullscreenCtrl: false, type: "multires", ...view, minHfov: 15,
          multiRes: { basePath: "assets/pannellum/multires", path: "/%l/%s%y_%x", extension: `jpg?g=${gen}`, tileResolution: 256, maxLevel: 3, cubeResolution: 1024 } });
      };
      ctx.onCleanup(() => viewer?.destroy());
      build();
      ctx.interval(() => {
        const c = viewer.getRenderer()?.getCanvas();
        const lvl = [1, 2, 3].map((l) => `<i style="background:${COLORS[l]}"></i>L${l} <b>${counts[l]}</b> / ${6 * 4 ** (l - 1)}`).join("　");
        info.innerHTML = row("已載入", lvl) + row("流量", `<b>${(bytes / 1024).toFixed(0)} KB</b>（全部 126 塊約 1.5 MB）`)
          + row("視野", `hfov ${n1(viewer.getHfov())}　畫布 <b>${c ? c.width : 0}</b> px 寬`);
      }, 250);
      ctx.button("拉近細節", () => viewer.lookAt(4, 55, 18, 1500), { primary: true });
      ctx.button("拉到最遠", () => viewer.lookAt(0, viewer.getYaw(), 120, 1200));
      ctx.button("清空重載", build);
    },
  },
  {
    id: "hotspots", title: "動態熱點",
    api: "mouseEventToCoords(e) → addHotSpot({ id, pitch, yaw, createTooltipFunc }) ／ removeHotSpot(id)",
    desc: "點一下畫面，就用 mouseEventToCoords() 把螢幕座標換成 pitch／yaw，再即時 addHotSpot()。熱點是 DOM 元素，Pannellum 每次重繪都會重算它們的投影位置；點熱點本身會用 removeHotSpot() 刪掉它。",
    hint: "點畫面放置標記，點標記刪除，拖曳不會放置",
    mount(ctx) {
      ctx.html('<div class="pn-host"></div>');
      const info = box(ctx);
      const viewer = makeViewer(ctx, ctx.$(".pn-host"), { type: "equirectangular", panorama: PANO, pitch: 0, yaw: 60, hfov: 105 });
      const pins = [];
      let seq = 0, last = "尚未放置";
      const add = (pitch, yaw) => {
        const id = `p${++seq}`, n = seq;
        viewer.addHotSpot({ id, pitch, yaw, cssClass: "pn-pin",
          createTooltipFunc: (div) => { div.innerHTML = `<i></i><span>#${n} ${pitch.toFixed(0)}°, ${yaw.toFixed(0)}°</span>`; },
          clickHandlerFunc: (e) => { e?.stopPropagation(); remove(id); } });
        pins.push(id);
        last = `#${n}　pitch ${n1(pitch)} yaw ${n1(yaw)}`;
      };
      const remove = (id) => { viewer.removeHotSpot(id); pins.splice(pins.indexOf(id), 1); last = `刪除 ${id.replace("p", "#")}`; };
      viewer.on("load", () => { add(4, 36); add(-10, 97); add(9, 156); });
      let down = null;
      ctx.on(ctx.$(".pn-host"), "pointerdown", (e) => { down = [e.clientX, e.clientY]; });
      ctx.on(ctx.$(".pn-host"), "click", (e) => {
        if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
        if (e.target.closest(".pnlm-hotspot-base, .pnlm-controls-container")) return;
        const [p, y] = viewer.mouseEventToCoords(e);
        add(p, y);
      });
      ctx.interval(() => { info.innerHTML = row("熱點數", `<b>${pins.length}</b>`) + row("最近操作", last); }, 200);
      ctx.button("移除最後一個", () => pins.length && remove(pins[pins.length - 1]));
      ctx.button("全部清除", () => { while (pins.length) remove(pins[pins.length - 1]); last = "已清除"; }, { primary: true });
    },
  },
  {
    id: "scenes", title: "多場景導覽",
    api: "pannellum.viewer({ default: { firstScene, sceneFadeDuration }, scenes: { … } }) ＋ loadScene(id)",
    desc: "三個場景（威尼斯水岸照片、兩張即時產生的格線房間）組成導覽。type: \"scene\" 的熱點點下去就切換場景並淡入，targetYaw 決定進場朝向；scenechange 事件回報切換紀錄。",
    hint: "點畫面中的箭頭熱點換場景，或用右上按鈕直接跳",
    async mount(ctx) {
      ctx.html('<div class="pn-host"></div>');
      const info = box(ctx);
      const [lobby, garden] = await Promise.all([
        blobUrl(gridPano(2048, 1024, { hue: 215, title: "大廳 Lobby", sub: "即時產生的格線全景" }), ctx),
        blobUrl(gridPano(2048, 1024, { hue: 130, title: "庭院 Garden", sub: "即時產生的格線全景" }), ctx),
      ]);
      const NAMES = { venice: "威尼斯水岸", lobby: "大廳", garden: "庭院" };
      const go = (pitch, yaw, sceneId, text, targetYaw = "sameAzimuth") => ({ pitch, yaw, type: "scene", sceneId, text, targetYaw });
      const viewer = makeViewer(ctx, ctx.$(".pn-host"), {
        default: { firstScene: "venice", sceneFadeDuration: 1000, autoLoad: true },
        scenes: {
          venice: { title: "威尼斯水岸", type: "equirectangular", panorama: PANO, hfov: 100, yaw: 20,
            hotSpots: [go(-8, 55, "lobby", "走進大廳", 0), go(-10, -5, "garden", "到庭院", 0)] },
          lobby: { title: "大廳", type: "equirectangular", panorama: lobby, hfov: 100,
            hotSpots: [go(-10, 0, "garden", "往庭院", 90), go(-10, 180, "venice", "回到水岸", 55)] },
          garden: { title: "庭院", type: "equirectangular", panorama: garden, hfov: 100,
            hotSpots: [go(-10, 90, "lobby", "回大廳", 0), go(-10, -90, "venice", "回到水岸", -5)] },
        },
      });
      const log = [];
      let t0 = performance.now(), loadMs = 0;
      viewer.on("scenechange", (id) => { t0 = performance.now(); log.unshift(NAMES[id]); log.length = Math.min(log.length, 4); });
      viewer.on("load", () => { loadMs = performance.now() - t0; });
      ctx.interval(() => {
        info.innerHTML = row("目前場景", `<b>${NAMES[viewer.getScene()] || "…"}</b>`) + row("載入耗時", `<b>${loadMs.toFixed(0)} ms</b>`)
          + row("切換紀錄", log.length ? log.join(" ← ") : "尚未切換");
      }, 200);
      ctx.group(["水岸", "大廳", "庭院"], 0, (i) => viewer.loadScene(["venice", "lobby", "garden"][i]));
    },
  },
  {
    id: "limits", title: "視角限制",
    api: "setYawBounds ／ setPitchBounds ／ setHfovBounds ＋ haov、vaov、avoidShowingBackground",
    desc: "同一張全景套上不同限制：鎖住水平範圍、不准看地面、限制縮放。切到「局部照片」會把一張 1200×800 普通照片當成水平 100°、垂直 66.7° 的局部全景，avoidShowingBackground 讓視窗永遠不露出照片外的黑底。",
    hint: "切換右上限制方案，再拖曳試著越界",
    mount(ctx) {
      ctx.html('<div class="pn-host"></div>');
      const info = box(ctx);
      const PRESETS = [
        { name: "不限制", yaw: [-180, 180], pitch: [-90, 90], hfov: [50, 120] },
        { name: "只看潟湖", yaw: [0, 120], pitch: [-90, 90], hfov: [50, 120] },
        { name: "不看地面", yaw: [-180, 180], pitch: [-8, 90], hfov: [50, 120] },
        { name: "只能特寫", yaw: [-180, 180], pitch: [-90, 90], hfov: [20, 40] },
      ];
      let viewer = null, preset = 0, partial = false;
      const apply = () => {
        if (partial) return;
        const p = PRESETS[preset];
        viewer.setYawBounds(p.yaw); viewer.setPitchBounds(p.pitch); viewer.setHfovBounds(p.hfov);
        viewer.lookAt(viewer.getPitch(), viewer.getYaw(), viewer.getHfov(), 600);
      };
      const build = () => {
        viewer?.destroy();
        const host = ctx.$(".pn-host");
        host.replaceChildren();
        const cfg = partial
          ? { panorama: "_shared/img/photo-1.jpg", haov: 100, vaov: 66.7, avoidShowingBackground: true, hfov: 70, minHfov: 25, maxHfov: 90 }
          : { panorama: PANO, pitch: 0, yaw: 60, hfov: 100 };
        viewer = pannellum.viewer(host, { autoLoad: true, strings: STR, showFullscreenCtrl: false, type: "equirectangular", ...cfg });
        viewer.on("load", apply);
      };
      ctx.onCleanup(() => viewer?.destroy());
      build();
      ctx.interval(() => {
        const [y0, y1] = viewer.getYawBounds(), [p0, p1] = viewer.getPitchBounds(), [h0, h1] = viewer.getHfovBounds();
        info.innerHTML = row("方案", `<b>${partial ? "局部照片" : PRESETS[preset].name}</b>`)
          + row("yaw", `${n1(viewer.getYaw())}　範圍 ${y0}° ~ ${y1}°`) + row("pitch", `${n1(viewer.getPitch())}　範圍 ${p0}° ~ ${p1}°`)
          + row("hfov", `${n1(viewer.getHfov())}　範圍 ${h0}° ~ ${h1}°`);
      }, 200);
      ctx.group(PRESETS.map((p) => p.name), 0, (i) => { preset = i; if (partial) { partial = false; build(); } else apply(); });
      ctx.toggle("局部照片", false, (v) => { partial = v; build(); });
    },
  },
  {
    id: "dynamic", title: "動態全景",
    api: "panorama: canvas, dynamic: true, dynamicUpdate: true ＋ startAutoRotate(°/s)",
    desc: "全景來源不是圖檔，而是一張 2048×1024 的 canvas：太陽沿軌道移動、天色日夜循環、正前方有即時時鐘。dynamicUpdate 讓 Pannellum 每次重繪都重新上傳整張貼圖；關掉「持續更新」畫面就凍結在最後一格。",
    hint: "拖曳環顧，調右上自動旋轉速度",
    mount(ctx) {
      ctx.html('<div class="pn-host"></div>');
      const info = box(ctx);
      const W = 2048, H = 1024, c = canvas(W, H), g = c.getContext("2d");
      const X = (yaw) => W / 2 + (yaw / 360) * W, Y = (p) => H / 2 - (p / 180) * H;
      let frames = 0, drawMs = 0, live = true, speed = -4;
      const draw = (t) => {
        const t0 = performance.now(), day = (t / 20000 + 0.12) % 1, sun = Math.sin(day * 2 * Math.PI);
        const sky = g.createLinearGradient(0, 0, 0, H / 2);
        sky.addColorStop(0, `hsl(${220 - sun * 20} 60% ${8 + Math.max(0, sun) * 38}%)`);
        sky.addColorStop(1, `hsl(${30 + Math.max(0, sun) * 170} 70% ${18 + Math.max(0, sun) * 45}%)`);
        g.fillStyle = sky; g.fillRect(0, 0, W, H / 2);
        g.fillStyle = `hsl(150 25% ${8 + Math.max(0, sun) * 18}%)`; g.fillRect(0, H / 2, W, H / 2);
        g.strokeStyle = "rgba(255,255,255,.18)"; g.lineWidth = 1;
        for (let yaw = -180; yaw < 180; yaw += 15) { g.beginPath(); g.moveTo(X(yaw), H / 2); g.lineTo(X(yaw), H); g.stroke(); }
        for (let p = -75; p < 0; p += 15) { g.beginPath(); g.moveTo(0, Y(p)); g.lineTo(W, Y(p)); g.stroke(); }
        const sy = day * 360 - 180, sp = sun * 55;
        g.fillStyle = sun > 0 ? "#ffd166" : "#dfe7ff";
        g.beginPath(); g.arc(X(sy), Y(sp), 28, 0, Math.PI * 2); g.fill();
        g.fillStyle = "rgba(14,16,19,.7)"; g.fillRect(X(0) - 170, Y(16) - 40, 340, 80);
        g.fillStyle = "#f7df1e"; g.font = "700 46px ui-monospace,Consolas,monospace"; g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(new Date().toLocaleTimeString("zh-TW", { hour12: false }), X(0), Y(16));
        g.fillStyle = "#fff"; g.font = `600 28px ${FONT}`;
        for (const yaw of [-90, 90, 180]) g.fillText(`第 ${fmt(frames)} 格`, X(yaw === 180 ? -180 : yaw) + (yaw === 180 ? 110 : 0), Y(16));
        frames++; drawMs = performance.now() - t0;
      };
      draw(0);
      const viewer = makeViewer(ctx, ctx.$(".pn-host"), { type: "equirectangular", panorama: c, dynamic: true, dynamicUpdate: true, hfov: 105, pitch: 8, autoRotate: speed, autoRotateInactivityDelay: 3000 });
      ctx.raf((t) => { if (live) draw(t); });
      ctx.fps();
      ctx.interval(() => {
        info.innerHTML = row("貼圖", `<b>2048×1024</b>，每格上傳約 <b>8 MB</b> RGBA`) + row("畫 canvas", `<b>${drawMs.toFixed(1)} ms</b>／格，已畫 <b>${fmt(frames)}</b> 格`)
          + row("方向感測", viewer.isOrientationSupported() ? "<b>已收到</b>方向資料（可用陀螺儀）" : "未收到方向資料（桌機通常沒有）");
      }, 250);
      ctx.slider("自動旋轉", { min: -12, max: 12, step: 1, value: speed, format: (v) => `${v} °/s` }, (v) => { speed = v; v ? viewer.startAutoRotate(v) : viewer.stopAutoRotate(); });
      ctx.toggle("持續更新", true, (v) => { live = v; viewer.setUpdate(v); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "addHotSpot() × n ＋ 每格 setYaw()",
    desc: "鏡頭持續旋轉，同時放上 n 個熱點，量測幀率何時掉到 30 FPS 以下。Pannellum 的熱點全是 DOM 元素，每次重繪都要逐一算投影、改 transform，看不到的也要判斷可見性；壓力主要落在 JS 與版面合成，而不是 WebGL。",
    hint: "按「自動加壓」逐級增加熱點，或拖曳手動滑桿",
    mount(ctx) {
      ctx.html('<div class="pn-stress"><div class="pn-host" style="top:0"></div></div>');
      const viewer = makeViewer(ctx, ctx.$(".pn-host"), { type: "equirectangular", panorama: PANO, hfov: 100, pitch: 6, showZoomCtrl: false });
      const GOLD = 180 * (3 - Math.sqrt(5));
      let kind = 0, count = 0, have = 0, addMs = 0, ready = false;
      const spot = (i, n) => {
        const base = { id: `s${i}`, pitch: (Math.asin(1 - (2 * (i + 0.5)) / n) * 180 / Math.PI) * 0.9, yaw: ((i * GOLD) % 360) - 180 };
        return kind ? { ...base, cssClass: "pn-dot" } : { ...base, type: "info" };
      };
      const apply = (n) => {
        count = n;
        if (!ready) return;
        const t0 = performance.now();
        // Positions depend on n, so rebuild the whole set; removing from the end keeps removeHotSpot's linear search short.
        for (let i = have - 1; i >= 0; i--) viewer.removeHotSpot(`s${i}`);
        for (let i = 0; i < n; i++) viewer.addHotSpot(spot(i, n));
        have = n;
        addMs = performance.now() - t0;
      };
      viewer.on("load", () => { ready = true; apply(count); });
      ctx.raf((t, dt) => { if (ready) viewer.setYaw(((viewer.getYaw() + dt * 0.02 + 540) % 360) - 180, false); });
      ctx.group(["info 圖示", "自訂圓點"], 0, (i) => { kind = i; apply(count); });
      ctx.ramp({
        label: "熱點數", unit: "個",
        steps: [50, 100, 250, 500, 1000, 2000, 4000],
        minFps: 30,
        apply,
        metrics: () => {
          const all = viewer.getContainer().querySelectorAll(".pnlm-hotspot-base");
          let vis = 0;
          for (const d of all) if (d.style.visibility !== "hidden") vis++;
          return { 類型: kind ? "自訂圓點" : "info 圖示", "DOM 熱點": all.length, 畫面內: vis, 重建: `${addMs.toFixed(0)} ms` };
        },
        note: "熱點以黃金角螺旋撒滿整個球面，鏡頭每格轉動，Pannellum 的 renderHotSpots() 會對每個熱點做一次投影並寫入 style.transform，背面的設為 hidden。「重建」是一次移除並重新加入 n 個熱點的耗時；切換上方類型可比較預設 info 圖示（CSS sprite）與自訂圓點。",
      });
    },
  },
] });
</script>
</body>
</html>
