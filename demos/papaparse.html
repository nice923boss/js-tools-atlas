<script>
// Papa Parse showcase: typed table, config comparisons, error reporting, unparse, streaming, worker, preview/abort, throughput bench.
const { fmt, fmtCompact, fmtMs, h } = Showcase;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kb = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${Math.round(b / 1024)} KB`);
const parseAsync = (input, cfg) => new Promise((resolve, reject) => Papa.parse(input, { ...cfg, complete: resolve, error: reject }));

const ERR_ZH = { TooFewFields: "欄位太少", TooManyFields: "欄位太多", MissingQuotes: "引號未閉合", InvalidQuotes: "引號格式錯誤", UndetectableDelimiter: "無法判斷分隔符號" };
const DELIM_ZH = { ",": "逗號", ";": "分號", "\t": "Tab", "|": "直線", "~": "波浪號" };
const TYPE_STYLE = { 整數: "#1f8fb8", 小數: "#0f6f94", 布林: "#2f9e55", 日期: "#6a5ae0", 文字: "#8a877d", 混合: "#e06a1b", 空值: "#b9b6ab" };
const DATE_RE = /^\d{4}[-/]\d{1,2}[-/]\d{1,2}([ T]\d{1,2}:\d{2}(:\d{2})?)?$/;

// Column type as a reader would describe it (based on what dynamicTyping produced)
function inferType(values) {
  const vals = values.filter((v) => v !== null && v !== undefined && v !== "");
  if (!vals.length) return "空值";
  const kinds = new Set(vals.map((v) => {
    if (typeof v === "number") return Number.isInteger(v) ? "整數" : "小數";
    if (typeof v === "boolean") return "布林";
    if (DATE_RE.test(v)) return "日期";
    return "文字";
  }));
  if (kinds.size === 1) return [...kinds][0];
  if ([...kinds].every((k) => k === "整數" || k === "小數")) return "小數";
  return "混合";
}
function cell(v, type) {
  if (v === null || v === undefined || v === "") return `<td class="e">空</td>`;
  if (typeof v === "number") return `<td class="n">${v.toLocaleString("zh-TW", { maximumFractionDigits: 6 })}</td>`;
  if (typeof v === "boolean") return `<td class="b"><span class="${v ? "" : "f"}">${v ? "是" : "否"}</span></td>`;
  if (type === "日期") return `<td class="d">${esc(v)}</td>`;
  return `<td title="${esc(v)}">${esc(v).replace(/\n/g, "↵")}</td>`;
}
// Render Papa results into <table class="pp-t"> markup with a type badge per column
function typedTable(res, header, limit = 200) {
  const rows = res.data;
  const fields = header ? (res.meta.fields || []) : (rows.reduce((m, r) => Math.max(m, r.length), 0) ? Array.from({ length: rows.reduce((m, r) => Math.max(m, r.length), 0) }, (_, i) => `欄 ${i + 1}`) : []);
  const get = (row, i) => (header ? row[fields[i]] : row[i]);
  const types = fields.map((_, i) => inferType(rows.map((r) => get(r, i))));
  const nulls = fields.map((_, i) => rows.filter((r) => { const v = get(r, i); return v === null || v === undefined || v === ""; }).length);
  const bad = new Set(res.errors.filter((e) => e.type === "FieldMismatch").map((e) => e.row));
  const shown = rows.slice(0, limit);
  let html = `<thead><tr><th class="ix">#</th>${fields.map((f, i) =>
    `<th><span class="nm">${esc(f)}</span><span class="ty" style="background:${TYPE_STYLE[types[i]]}">${types[i]}</span>${nulls[i] ? `<span class="nl">${nulls[i]} 空</span>` : ""}</th>`).join("")}</tr></thead><tbody>`;
  html += shown.map((r, ri) => `<tr${bad.has(ri) ? ` class="bad"` : ""}><td class="ix">${ri + 1}</td>${fields.map((_, i) => cell(get(r, i), types[i])).join("")}</tr>`).join("");
  if (rows.length > shown.length) html += `<tr><td class="ix"></td><td colspan="${fields.length}" class="e">其餘 ${fmt(rows.length - shown.length)} 列未顯示</td></tr>`;
  return { html: html + "</tbody>", fields, types };
}

// Deterministic order data (示意資料). One product name contains a comma, so it is quoted.
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "新竹市", "基隆市", "花蓮縣", "宜蘭縣"];
const ITEMS = ["帆布托特包", "手沖濾杯", "木質杯墊組", "旅行收納袋", "陶瓷馬克杯", "\"禮盒組, 六入\""];
const ORDER_HEAD = "訂單編號,縣市,商品,數量,金額,已出貨,下單日";
function ordersCSV(n) {
  const out = new Array(n + 1);
  out[0] = ORDER_HEAD;
  let s = 20261011;
  for (let i = 1; i <= n; i++) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const r = s >>> 8;
    const q = 1 + (r % 9);
    out[i] = `${1000000 + i},${CITIES[(r >>> 4) % 10]},${ITEMS[(r >>> 9) % 6]},${q},${(q * (99 + (r % 4500) / 10)).toFixed(1)},${r & 1 ? "true" : "false"},2026-${String(1 + (r % 12)).padStart(2, "0")}-${String(1 + (r % 28)).padStart(2, "0")}`;
  }
  return out.join("\n");
}
const fileCache = new Map();
function ordersFile(n) {
  if (!fileCache.has(n)) fileCache.set(n, new File([ordersCSV(n)], `orders-${n}.csv`, { type: "text/csv" }));
  return fileCache.get(n);
}

const CONFIGS = [

      const st = { mode: 0, size: 0, slow: true };

        const log = [];
        const paint = () => {
          const max = Math.max(...sums.values(), 1);
          CITIES.forEach((c, i) => { bars[i].querySelector("i").style.width = `${(sums.get(c) / max) * 100}%`; bars[i].lastElementChild.textContent = fmtCompact(Math.round(sums.get(c))); });

            `<span class="pp-chip">已讀 <b>${kb(cursor)}</b>／${kb(file.size)}</span>`,

          ].join("");
          ctx.$(".pp-log").innerHTML = log.slice(0, 40).join("");
        };
        // Optional visible pacing: pause briefly after each batch so the progress can be followed by eye
        const breathe = (p) => { if (st.slow) { p.pause(); ctx.timeout(() => { if (id === run && !paused) p.resume(); }, 40); } };
        const add = (r) => { sums.set(r.縣市, (sums.get(r.縣市) || 0) + (r.金額 || 0)); };
        const cfg = {
          header: true, dynamicTyping: true, skipEmptyLines: true, chunkSize: SIZES[st.size],

          error: (e) => { log.unshift(`<div>錯誤：${esc(e.message)}</div>`); paint(); },

        } else {
          cfg.chunk = (r, p) => {

            log.unshift(`<div>chunk #${calls}：${fmt(r.data.length)} 列，cursor ${kb(cursor)}</div>`);

      ctx.html(`<div class="pp-wrap pp-s6">
        <div class="pp-pane pp-spinbox"><h3><b>主執行緒動畫</b></h3><div class="pp-spin"><div></div><p class="pp-gap">畫面更新正常</p></div></div>
        <div class="pp-pane"><h3><b>主執行緒</b><span class="pp-r">worker: false</span></h3><div class="pp-res pp-m"></div></div>
        <div class="pp-pane"><h3><b>Web Worker</b><span class="pp-r">worker: true</span></h3><div class="pp-res pp-w"></div></div>
      </div>`);
      const N = 250000;
      const file = ordersFile(N);
      const spinner = ctx.$(".pp-spin div"), gapEl = ctx.$(".pp-gap");
      let angle = 0, measuring = false, maxGap = 0, lastT = 0;
      ctx.raf((t, dt) => {
        angle = (angle + dt * 0.36) % 360;
        spinner.style.transform = `rotate(${angle}deg)`;
        // ctx.raf clamps dt to 100 ms, so measure the raw gap between frames here
        if (measuring && lastT) maxGap = Math.max(maxGap, t - lastT);
        lastT = t;
      });
      const box = (el, html) => { el.innerHTML = html; };
      const idle = (el) => box(el, `<div class="st">等待執行</div>`);
      idle(ctx.$(".pp-m")); idle(ctx.$(".pp-w"));
      let busy = false;
      const runMode = async (worker) => {
        if (busy) return;
        busy = true;
        const el = ctx.$(worker ? ".pp-w" : ".pp-m");
        box(el, `<div class="st">解析中…（${fmt(N)} 列，${kb(file.size)}）</div>`);
        gapEl.textContent = worker ? "Worker 解析中" : "主執行緒解析中";
        await ctx.frame(2);
        maxGap = 0; measuring = true;
        const t0 = performance.now();
        try {
          const res = await parseAsync(file, { worker, header: true, dynamicTyping: true, skipEmptyLines: true });
          const ms = performance.now() - t0;
          await ctx.frame(2);
          measuring = false;
          if (!ctx.active) return;
          const cls = maxGap > 200 ? "bad" : maxGap < 60 ? "good" : "";
          box(el, `<div class="big">${fmtMs(ms)}</div>
            <div class="row"><span>解析列數</span><b>${fmt(res.data.length)}</b></div>
            <div class="row"><span>最長一格</span><b class="${cls}">${fmtMs(maxGap)}</b></div>
            <div class="row"><span>錯誤</span><b>${res.errors.length}</b></div>
            <div class="st">${worker ? "解析在背景執行緒；結果經 postMessage 複製回來" : "解析期間主執行緒被占用，動畫停住"}</div>`);
          gapEl.textContent = `上一輪最長一格 ${fmtMs(maxGap)}`;
        } catch (e) {
          measuring = false;
          box(el, `<div class="st">無法執行：${esc(e.message || e)}</div>`);
        } finally { busy = false; }
      };
      if (!Papa.WORKERS_SUPPORTED) box(ctx.$(".pp-w"), `<div class="st">此瀏覽器不支援 Web Worker（Papa.WORKERS_SUPPORTED 為 false）</div>`);
      ctx.button("主執行緒解析", () => runMode(false));
      ctx.button("Worker 解析", () => runMode(true), { primary: true });
      (async () => { await ctx.sleep(400); await runMode(false); await ctx.sleep(500); if (Papa.WORKERS_SUPPORTED) await runMode(true); })().catch(() => {});
    },
  },

  // ---------- 7. preview & abort ----------
  {
    id: "preview", title: "預覽與中止", paper: true,
    api: "Papa.parse(file, { preview: 20 }) ・ step: (r, parser) => parser.abort()",
    desc: "30 萬列的檔案不一定要全讀：preview 只解析前 N 列（meta.truncated 為 true），step 找到目標就 parser.abort()（meta.aborted 為 true）。第三張卡是完整解析的時間，用來對照省下多少。",
    hint: "選擇要找的訂單位置，看中止時間隨位置變化",
    mount(ctx) {
      ctx.html(`<div class="pp-wrap pp-s7">
        <div class="pp-pane"><div class="pp-card pp-c1"></div></div>
        <div class="pp-pane"><div class="pp-card pp-c2"></div></div>
        <div class="pp-pane"><div class="pp-card pp-c3"></div></div>
        <div class="pp-pane pp-tab"><h3><b>preview: 20 的結果</b><span class="pp-r">資料為示意</span></h3><div class="pp-scroll"><table class="pp-t"></table></div></div>
      </div>`);
      const N = 300000;
      const file = ordersFile(N);
      const card = (sel, title, code, big, sub) => { ctx.$(sel).innerHTML = `<h4>${title}</h4><code>${code}</code><div class="big">${big}</div><div class="sub">${sub}</div>`; };
      let target = 10000, full = null, seq = 0;
      const findOne = async () => {
        const id = ++seq;
        const want = String(1000000 + target);
        card(".pp-c2", `找到第 ${fmt(target)} 列就中止`, `step: (r, p) => hit && p.abort()`, "…", "搜尋中");
        let seen = 0, hit = null;
        const t0 = performance.now();
        const res = await parseAsync(file, { header: true, step: (r, p) => { seen++; if (r.data.訂單編號 === want) { hit = r.data; p.abort(); } } });
        const ms = performance.now() - t0;
        if (!ctx.active || id !== seq) return;
        card(".pp-c2", `找到第 ${fmt(target)} 列就中止`, `step: (r, p) => hit && p.abort()`, fmtMs(ms),
          hit ? `看過 ${fmt(seen)} 列・aborted: ${res.meta.aborted}・${esc(hit.縣市)} ${esc(hit.商品)}` : "沒找到");
      };
      const all = async () => {
        await ctx.frame(2);
        const t0 = performance.now();
        card(".pp-c1", "preview: 20", `Papa.parse(file, { preview: 20 })`, "…", "解析中");
        const pre = await parseAsync(file, { header: true, dynamicTyping: true, preview: 20 });
        const msPre = performance.now() - t0;
        if (!ctx.active) return;
        card(".pp-c1", "只解析前 20 列", `Papa.parse(file, { preview: 20 })`, fmtMs(msPre), `${pre.data.length} 列・truncated: ${pre.meta.truncated}`);
        ctx.$(".pp-t").innerHTML = typedTable(pre, true).html;
        await findOne();
        card(".pp-c3", "完整解析對照", `Papa.parse(file, { header: true })`, "…", `${fmt(N)} 列解析中`);
        await ctx.frame(2);
        const t1 = performance.now();
        full = await parseAsync(file, { header: true });
        if (!ctx.active) return;
        card(".pp-c3", "完整解析對照", `Papa.parse(file, { header: true })`, fmtMs(performance.now() - t1), `${fmt(full.data.length)} 列・${kb(file.size)}`);
      };
      ctx.group(["第 1 萬列", "第 15 萬列", "第 29 萬列"], 0, (i) => { target = [10000, 150000, 290000][i]; findOne(); });
      all();
    },
  },

  // ---------- 8. stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "Papa.parse(csvString, { header, dynamicTyping, worker })",
    desc: "逐級加大訂單 CSV（1 萬到 200 萬列）量解析時間，換算每秒列數與 MB/s。三種模式：主執行緒轉成物件並自動轉型、主執行緒只切成字串陣列、交給 Worker（含結果傳回主執行緒的時間）。",
    hint: "按左側「開始測試」；切換模式再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="pp-stress"><table class="pp-res8"><thead><tr><th>列數</th><th>模式</th><th>大小</th><th>耗時</th><th>列／秒</th><th>MB/s</th></tr></thead><tbody><tr><td class="zh" colspan="6">尚未測試；下方是測試資料的前 12 列</td></tr></tbody></table>
        <div class="pp-pane" style="flex:1"><h3><b>測試資料</b><span class="pp-r">程式產生的示意資料</span></h3><div class="pp-scroll"><pre class="pp-raw">${esc(ordersCSV(12))}</pre></div></div></div>`);
      ctx.controls.classList.add("bottom");
      const MODES = [
        { label: "物件＋轉型", cfg: { header: true, dynamicTyping: true } },
        { label: "字串陣列", cfg: { header: false } },
        { label: "Worker", cfg: { header: true, dynamicTyping: true, worker: true } },
      ];
      let mode = 0;
      ctx.group(MODES.map((m) => m.label), 0, (i) => { mode = i; });
      const body = ctx.$(".pp-res8 tbody");
      const results = [];
      const strCache = new Map();
      ctx.bench({
        label: "資料列", unit: "列",
        sizes: [10000, 50000, 100000, 250000, 500000, 1000000, 2000000],
        target: 1000, budget: 2000,
        prepare(n) {
          if (!strCache.has(n)) {
            strCache.clear();
            const csv = ordersCSV(n);
            strCache.set(n, { csv, bytes: new Blob([csv]).size });
          }
          return strCache.get(n);
        },
        async run(n, { csv, bytes }) {
          const m = MODES[mode];
          const t0 = performance.now();
          const res = m.cfg.worker ? await parseAsync(csv, { ...m.cfg }) : Papa.parse(csv, { ...m.cfg });
          const ms = performance.now() - t0;
          const rows = res.data.length - (m.cfg.header ? 0 : 1);
          const rps = rows / (ms / 1000), mbs = bytes / 1048576 / (ms / 1000);
          results.unshift(`<tr><td>${fmt(n)}</td><td class="zh">${m.label}</td><td>${kb(bytes)}</td><td>${fmtMs(ms)}</td><td>${fmtCompact(rps)}</td><td>${mbs.toFixed(1)}</td></tr>`);
          body.innerHTML = results.slice(0, 12).join("");
          return `${fmtCompact(rps)} 列／秒・${mbs.toFixed(1)} MB/s`;
        },
        note: "每級資料先在 prepare 產生成字串（不計時），只量 Papa.parse 本身。「物件＋轉型」要為每列建立物件並逐欄判斷數字、布林，最慢；「字串陣列」只切欄位，最接近純解析速度；Worker 模式包含把字串送進 Worker、解析、再把結果複製回主執行緒的時間，總時間不一定比較快，好處是解析期間畫面不卡。MB/s 以 UTF-8 位元組計算；列數大時記憶體（每列一個物件）會比 CPU 先成為瓶頸。",
      });
    },
  },
] });
</script>
</body>
</html>
