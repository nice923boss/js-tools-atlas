<script>
// Parallax.js showcase: eight scenes from the original night hero to a layer-count stress ramp.
// Parallax listens to window mousemove, so the auto tours feed it synthetic mousemove events.
const PARALLAX = "https://cdn.jsdelivr.net/npm/parallax-js@3.1.0/dist/parallax.min.js";
const { h } = Showcase;

const FAR = "M0 300 L0 170 L140 80 L260 150 L400 40 L520 140 L660 70 L800 160 L940 60 L1080 140 L1200 90 L1200 300Z";
const SNOW = "M400 40 L440 75 L415 70 L400 85 L385 72 L362 76Z M940 60 L975 92 L952 88 L940 100 L926 89 L905 92Z";
const NEAR = "M0 300 L0 150 L60 110 L90 130 L130 60 L170 130 L210 100 L250 140 L330 120 L420 170 L520 130 L600 160 L700 120 L760 70 L800 120 L840 90 L880 140 L980 150 L1060 100 L1100 50 L1140 100 L1200 120 L1200 300Z";

// Signed number with a fixed number of decimals.
const num = (v, d = 1) => `${v < 0 ? "−" : "+"}${Math.abs(v).toFixed(d)}`;
// Raw x/y strings Parallax wrote into translate3d(), so the precision option stays visible.
function rawOffset(el) {
  const m = /translate3d\(\s*([-\d.e]+)px,\s*([-\d.e]+)px/.exec(el.style.transform);
  return m ? [m[1], m[2]] : ["0", "0"];
}
const lissajous = (ax, ay, fx, fy) => (t) => [0.5 + ax * Math.sin(t * fx), 0.5 + ay * Math.sin(t * fy + 1)];
const cssVar = (name) => getComputedStyle(document.body).getPropertyValue(name).trim();

// Auto tour: dispatch synthetic mousemove events along path(t) over area() until the visitor moves a real mouse.
// Touch drags inside the scene are forwarded as mousemove too, since that is the fallback input Parallax reads.
function autoTour(ctx, { path = lissajous(0.42, 0.36, 0.7, 1.1), area = null, stopOnUser = true, label = "自動漫遊" } = {}) {
  const ghost = h("div", { class: "ghost" });
  // The path may leave the scene on purpose; clip the ghost so it never adds scroll overflow.
  ctx.el.append(h("div", { class: "ghost-clip" }, ghost));
  let running = false, t0 = 0, stop = null;
  const btn = ctx.toggle(label, true, (v) => set(v));
  function step(now) {
    const a = (area ? area() : ctx.el).getBoundingClientRect(), r = ctx.el.getBoundingClientRect();
    // rAF timestamps can precede t0 on the first frame, so clamp to keep t >= 0.
    const [u, v] = path(Math.max(0, now - t0) / 1000);
    const x = a.left + a.width * u, y = a.top + a.height * v;
    window.dispatchEvent(new MouseEvent("mousemove", { clientX: x, clientY: y }));
    ghost.style.transform = `translate(${(x - r.left).toFixed(1)}px, ${(y - r.top).toFixed(1)}px)`;
  }
  function set(v) {
    running = v;
    btn.setAttribute("aria-pressed", String(v));
    ghost.classList.toggle("on", v);
    if (stop) { stop(); stop = null; }
    if (v) { t0 = performance.now(); stop = ctx.raf(step); }
  }
  const onUi = (e) => e.target instanceof Element && e.target.closest(".controls, .sc-lab");
  if (stopOnUser) {
    ctx.on(window, "mousemove", (e) => { if (running && e.isTrusted && ctx.el.contains(e.target) && !onUi(e)) set(false); });
    ctx.on(ctx.el, "pointerdown", (e) => { if (running && e.pointerType !== "mouse" && !onUi(e)) set(false); });
  }
  ctx.on(ctx.el, "pointermove", (e) => {
    if (!running && e.pointerType !== "mouse") window.dispatchEvent(new MouseEvent("mousemove", { clientX: e.clientX, clientY: e.clientY }));
  });
  set(true);
  return { set, get running() { return running; } };
}

Showcase.run({ scenes: [
  {
    id: "night", title: "夜景景深",
    api: "new Parallax(scene, { frictionX, frictionY }) ・ data-depth ・ scalar() ・ invert()",
    desc: "原示範移植：天空、月亮、遠山、標題、近山、螢火蟲六層各設 data-depth（0.08 到 1.1），數字越大位移越多，看起來越靠近。輸入範圍是整個視窗（relativeInput 預設 false）；invert 預設為 true，所以圖層往游標的反方向移動。",
    hint: "自動漫遊中，黃色圓圈是模擬游標；在畫面上移動滑鼠即可接手",
    async mount(ctx) {
      ctx.html(`<div class="px-root night"><ul class="night-scene">
        <li class="layer" data-depth="0.08"><div class="fill sky"><div class="stars"></div></div></li>
        <li class="layer" data-depth="0.2"><div class="moon"></div></li>
        <li class="layer" data-depth="0.35"><div class="mount far"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="${FAR}" fill="#2b2f63"/><path d="${SNOW}" fill="#c9cdf2" opacity=".75"/></svg></div><span class="depth" style="left:18%;bottom:44%">depth 0.35</span></li>
        <li class="layer" data-depth="0.5"><div class="title"><div class="kicker">PARALLAX.JS · 景深</div><h1>滑鼠一動<br>景深就出來</h1><p>每一層設定 data-depth，越大移動越多，看起來就越靠近你。</p></div></li>
        <li class="layer" data-depth="0.75"><div class="mount near"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="${NEAR}" fill="#12142f"/></svg></div><span class="depth" style="left:8%;bottom:22%">depth 0.75</span></li>
        <li class="layer" data-depth="1.1"><div class="flies"></div><span class="depth" style="right:14%;top:56%">depth 1.1</span></li>
      </ul></div>`);
      const stars = ctx.$(".stars");
      for (let i = 0; i < 90; i++) {
        const s = document.createElement("i");
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 62 + "%";
        s.style.animationDelay = -Math.random() * 3 + "s";
        if (i % 7 === 0) s.style.width = s.style.height = "3px";
        stars.append(s);
      }
      const flies = ctx.$(".flies");
      for (let i = 0; i < 16; i++) {
        const f = document.createElement("i");
        f.style.left = 5 + Math.random() * 90 + "%";
        f.style.top = 55 + Math.random() * 40 + "%";
        f.style.animationDelay = -Math.random() * 4 + "s";
        flies.append(f);
      }
      await ctx.load(PARALLAX);
      const p = new Parallax(ctx.$(".night-scene"), { relativeInput: false, frictionX: 0.08, frictionY: 0.08 });
      ctx.onCleanup(() => p.destroy());
      ctx.$(".kicker").textContent = `PARALLAX.JS ${p.version()} · 景深`;
      ctx.slider("強度 scalar", { min: 2, max: 26, value: 10 }, (v) => p.scalar(v, v));
      ctx.toggle("invert", true, (v) => p.invert(v, v));
      autoTour(ctx);
    },
  },
  {

      ctx.raf((now) => {
        const t = (now - t0) / 1000;
        const fb = 40 + 16 * Math.sin(t * 0.9), lr = 24 * Math.sin(t * 0.55);
        const portrait = innerHeight > innerWidth;
        if (sim) { beta = portrait ? fb : lr; gamma = portrait ? lr : fb; }
        phone.classList.toggle("land", !portrait);
        phone.style.transform = sim ? `rotateX(${((fb - 40) * 0.9).toFixed(1)}deg) rotateY(${(lr * 0.9).toFixed(1)}deg)` : "";
        const src = sim ? "模擬角度 → rotate()" : p.orientationStatus ? "deviceorientation（實機）" : p.motionStatus ? "devicemotion（實機）" : "滑鼠 mousemove";
        const vals = [
          p.desktop ? "桌機 UA，不監聽陀螺儀" : "行動 UA，先試 deviceorientation",
          readyMs == null ? "等待偵測…" : `${Showcase.fmtMs(readyMs)} 後觸發`,
          src,
          `${beta.toFixed(1)}°／${gamma.toFixed(1)}°`,
          p.portrait ? "直向：gamma→X，beta→Y" : "橫向：beta→X，gamma→Y",
          `x ${num(p.calibrationX, 2)}  y ${num(p.calibrationY, 2)}`,
          `x ${num(p.inputX, 2)}  y ${num(p.inputY, 2)}`,
          `x ${num(p.motionX)}  y ${num(p.motionY)} px`,
          permission,
        ];
        dd.forEach((d, i) => { if (d.textContent !== vals[i]) d.textContent = vals[i]; });
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new Parallax(scene) ・ n 個 data-depth 圖層 ・ 每幀寫入 translate3d",
    desc: "逐級增加圖層數，模擬游標在框內持續快速移動。Parallax 每一幀先讀一次 inputElement 的 getBoundingClientRect，再對全部圖層各寫一次 translate3d，而且每個圖層在建立時都被設成獨立的 3D 合成層。量測 FPS、建立實例耗時、函式庫每幀耗時與每秒寫入量。",
    hint: "按「自動加壓」開始；關掉模擬游標，寫入量也不會變",
    async mount(ctx) {
      ctx.html(`<div class="stress-frame"><div class="st-scene"></div></div>`);
      ctx.controls.classList.add("bottom");
      await ctx.load(PARALLAX);
      const scene = ctx.$(".st-scene");
      let p = null, initMs = 0, count = 0, frames = 0, libAcc = 0, rate = 0, libMs = 0;
      ctx.onCleanup(() => p && p.destroy());
      ctx.interval(() => { rate = frames; libMs = frames ? libAcc / frames : 0; frames = 0; libAcc = 0; }, 1000);
      autoTour(ctx, { area: () => scene, path: (t) => [0.5 + 0.45 * Math.sin(t * 2.1), 0.5 + 0.42 * Math.sin(t * 3.3 + 1)], stopOnUser: false, label: "模擬游標" });
      ctx.ramp({
        label: "圖層", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000],
        minFps: 30,
        apply(n) {
          if (p) { p.destroy(); p = null; }
          let html = "";
          for (let i = 0; i < n; i++) {
            const d = 0.05 + Math.random() * 1.15, s = (2 + d * 4).toFixed(1);
            html += `<i class="d" data-depth="${d.toFixed(2)}" style="translate:${(Math.random() * 100).toFixed(2)}cqw ${(Math.random() * 100).toFixed(2)}cqh;width:${s}px;height:${s}px;background:hsl(${(200 + d * 120).toFixed(0)} 85% 65%)"></i>`;
          }
          scene.innerHTML = html;
          const t0 = performance.now();
          p = new Parallax(scene, { relativeInput: true, scalarX: 12, scalarY: 12 });
          initMs = performance.now() - t0;
          // Time the library's own frame callback; it re-reads this property every frame.
          const frame = p.onAnimationFrame;
          p.onAnimationFrame = () => { const s = performance.now(); frame(); libAcc += performance.now() - s; frames++; };
          count = n;
        },
        metrics: () => ({ "建立實例": Showcase.fmtMs(initMs), "Parallax 每幀": Showcase.fmtMs(libMs), "transform 寫入／秒": Showcase.fmtCompact(rate * count) }),
        note: "每一幀 Parallax 會對全部 n 個圖層算一次位移、toFixed 轉字串再寫入 translate3d，數值沒變也照寫，所以游標停下來時寫入量不變。建立時每個圖層都被加上 translate3d、preserve-3d 與 backface-visibility，各自成為合成層，圖層一多，瓶頸常在合成與記憶體，不只在 JS。",
      });
    },
  },
] });
</script>
</body>
</html>
