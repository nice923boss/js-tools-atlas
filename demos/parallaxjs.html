<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallax.js 示範：滑鼠景深夜景</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: #070b1c; }
  #scene { position: fixed; inset: 0; margin: 0; padding: 0; list-style: none; overflow: hidden; }
  .layer { width: 100%; height: 100%; }
  .fill { position: absolute; inset: -12%; }
  .sky { background: radial-gradient(60% 50% at 70% 25%, #1d2b64 0%, transparent 70%), linear-gradient(#070b1c, #141a3f 55%, #2a2350); }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: tw 3s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .25; } to { opacity: 1; } }
  .moon { position: absolute; right: 16%; top: 12%; width: clamp(70px, 14vw, 130px); aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fffbe8, #f5e7b2 55%, #d9c27e); box-shadow: 0 0 60px 18px rgba(245,231,178,.35); }
  .moon::after { content: ""; position: absolute; left: 22%; top: 50%; width: 16%; height: 16%; border-radius: 50%; background: rgba(170,150,90,.35);
    box-shadow: 30px -24px 0 -2px rgba(170,150,90,.3), 14px 18px 0 -4px rgba(170,150,90,.3); }
  .mount { position: absolute; left: -12%; right: -12%; }
  .mount svg { display: block; width: 100%; height: 100%; }
  .far { bottom: -4%; height: 52%; }
  .near { bottom: -10%; height: 40%; }
  .title { position: absolute; left: 0; right: 0; top: 24%; text-align: center; padding: 0 20px; }
  .title .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--accent); }
  .title h1 { margin: 10px 0 8px; font-size: clamp(32px, 8vw, 72px); line-height: 1.1; font-weight: 900; color: #f3f0ff; text-shadow: 0 8px 30px rgba(0,0,0,.6); }
  .title p { margin: 0 auto; max-width: 24em; color: #b9b5d8; }
  .flies i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #fff6a8; box-shadow: 0 0 12px 4px rgba(255,240,140,.55); animation: fl 4s ease-in-out infinite alternate; }
  @keyframes fl { to { translate: 12px -18px; opacity: .4; } }
  .depth { position: absolute; padding: 2px 8px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font: 600 11px var(--mono); }
  .panel.ctl { position: fixed; right: 12px; top: 12px; z-index: 50; width: 210px; display: grid; gap: 8px; }
  .ctl label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .ctl input { width: 100%; accent-color: var(--accent); }
  .ctl .row { display: flex; gap: 6px; }
  .ctl .row .btn { flex: 1; padding: 7px 6px; font-size: 12px; }
  @media (max-width: 520px) { .depth { display: none; } .panel.ctl { width: 170px; } .title { top: 31%; } }
</style>
</head>
<body>
<ul id="scene">
  <li class="layer" data-depth="0.08"><div class="fill sky"><div class="stars" id="stars" style="position:absolute;inset:0"></div></div></li>
  <li class="layer" data-depth="0.2"><div class="moon"></div></li>
  <li class="layer" data-depth="0.35"><div class="mount far"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300 L0 170 L140 80 L260 150 L400 40 L520 140 L660 70 L800 160 L940 60 L1080 140 L1200 90 L1200 300Z" fill="#2b2f63"/><path d="M400 40 L440 75 L415 70 L400 85 L385 72 L362 76Z M940 60 L975 92 L952 88 L940 100 L926 89 L905 92Z" fill="#c9cdf2" opacity=".75"/></svg></div><span class="depth" style="left:18%;bottom:44%">depth 0.35</span></li>
  <li class="layer" data-depth="0.5"><div class="title"><div class="kicker">PARALLAX.JS · 景深</div><h1>滑鼠一動<br>景深就出來</h1><p>每一層設定 data-depth，越大移動越多，看起來就越靠近你。</p></div></li>
  <li class="layer" data-depth="0.75"><div class="mount near"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300 L0 150 L60 110 L90 130 L130 60 L170 130 L210 100 L250 140 L330 120 L420 170 L520 130 L600 160 L700 120 L760 70 L800 120 L840 90 L880 140 L980 150 L1060 100 L1100 50 L1140 100 L1200 120 L1200 300Z" fill="#12142f"/></svg></div><span class="depth" style="left:8%;bottom:22%">depth 0.75</span></li>
  <li class="layer" data-depth="1.1"><div class="flies" id="flies" style="position:absolute;inset:0"></div><span class="depth" style="right:14%;top:56%">depth 1.1</span></li>
</ul>

<div class="panel ctl">
  <label>強度 <b id="sv">10</b></label>
  <input type="range" id="scalar" min="2" max="26" value="10">
  <div class="row">
    <button class="btn" id="invert" aria-pressed="true">反轉方向</button>
    <button class="btn" id="auto" aria-pressed="true">自動漫遊</button>
  </div>
</div>
<div class="hint">移動滑鼠，手機可傾斜裝置</div>

<script src="https://cdn.jsdelivr.net/npm/parallax-js@3.1.0/dist/parallax.min.js"></script>
<script>
// Decorations: stars and fireflies
const stars = document.getElementById("stars");
for (let i = 0; i < 90; i++) {
  const s = document.createElement("i");
  s.style.left = Math.random() * 100 + "%";
  s.style.top = Math.random() * 62 + "%";
  s.style.animationDelay = -Math.random() * 3 + "s";
  if (i % 7 === 0) { s.style.width = s.style.height = "3px"; }
  stars.append(s);
}
const flies = document.getElementById("flies");
for (let i = 0; i < 16; i++) {
  const f = document.createElement("i");
  f.style.left = 5 + Math.random() * 90 + "%";
  f.style.top = 55 + Math.random() * 40 + "%";
  f.style.animationDelay = -Math.random() * 4 + "s";
  flies.append(f);
}

const parallax = new Parallax(document.getElementById("scene"), { relativeInput: false, frictionX: 0.08, frictionY: 0.08 });

// Controls
const scalar = document.getElementById("scalar"), sv = document.getElementById("sv");
scalar.addEventListener("input", () => { sv.textContent = scalar.value; parallax.scalar(+scalar.value, +scalar.value); });
const inv = document.getElementById("invert");
inv.addEventListener("click", () => {
  const on = inv.getAttribute("aria-pressed") !== "true";
  inv.setAttribute("aria-pressed", on);
  parallax.invert(on, on);
});

// Auto tour: feed synthetic mouse positions until the visitor moves a real mouse
const auto = document.getElementById("auto");
let touring = true, t0 = performance.now();
function tour(now) {
  if (!touring) return;
  const t = (now - t0) / 1000;
  const x = innerWidth * (0.5 + 0.42 * Math.sin(t * 0.7));
  const y = innerHeight * (0.5 + 0.35 * Math.sin(t * 1.1 + 1));
  window.dispatchEvent(new MouseEvent("mousemove", { clientX: x, clientY: y }));
  requestAnimationFrame(tour);
}
function setTour(on) {
  touring = on;
  auto.setAttribute("aria-pressed", on);
  if (on) { t0 = performance.now(); requestAnimationFrame(tour); }
}
setTimeout(() => setTour(true), 700);
window.addEventListener("mousemove", (e) => { if (e.isTrusted && touring && !e.target.closest(".ctl")) setTour(false); });
auto.addEventListener("click", () => setTour(!touring));
</script>
</body>
</html>
