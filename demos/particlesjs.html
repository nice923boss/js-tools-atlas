<script>
// particles.js 2.0.0 showcase. The library exposes one global factory (particlesJS) and keeps every
// instance in the global array pJSDom; each instance's state and helpers live on pJSDom[i].pJS.
const { h } = Showcase;
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#9d8cff", "#ff8c42"];
let uid = 0;

// ---------- instance bookkeeping ----------
// particlesJS() replaces the canvas inside its host but never stops the old instance's frame loop,
// and destroypJS() sets the global pJSDom to null. Each host's instance is tracked here so it can be
// stopped explicitly and pJSDom can be rebuilt from the live instances afterwards.
const owners = new Map(); // host element -> pJSDom entry
const sync = () => { window.pJSDom = [...owners.values()]; };
function kill(w) {
  const v = w.pJS.fn.vendors;
  v.destroypJS(); // cancels the frame, removes the canvas, sets window.pJSDom = null
  v.draw = v.checkBeforeDraw = () => {}; // late image or XHR callbacks must not restart a dead instance
}
function drop(host, only) {
  const w = owners.get(host);
  if (!w || (only && w !== only)) return false;
  owners.delete(host);
  kill(w);
  sync();
  return true;
}
const resizing = new WeakSet();
function adopt(ctx, host, w) {
  owners.set(host, w);
  sync();
  ctx.onCleanup(() => drop(host, w));
  if (!resizing.has(ctx)) {
    resizing.add(ctx);
    ctx.onResize(() => owners.forEach((x) => fit(x.pJS)));
  }
  return w.pJS;
}
// events.resize is forced off: the library adds a window listener on every init that can never be
// removed, so the scene resizes canvases itself through ctx.onResize.
function spawn(ctx, host, cfg) {
  drop(host);
  if (!host.id) host.id = `pjs-${++uid}`;
  const inter = cfg.interactivity || {};
  particlesJS(host.id, { ...cfg, interactivity: { detect_on: "canvas", ...inter, events: { ...inter.events, resize: false } } });
  const w = window.pJSDom[window.pJSDom.length - 1];
  // 2.0.0 only zeroes tmp.count_svg inside particlesRefresh(), so on first load it is undefined,
  // count_svg++ yields NaN and SVG image particles are never drawn. The SVG XHR is async, so this runs first.
  w.pJS.tmp.count_svg = 0;
  return adopt(ctx, host, w);
}
function fit(p) {
  const el = p.canvas.el, r = p.canvas.pxratio || 1;
  if (!el.isConnected) return;
  p.canvas.w = el.offsetWidth * r;
  p.canvas.h = el.offsetHeight * r;
  el.width = p.canvas.w;
  el.height = p.canvas.h;
  p.fn.vendors.densityAutoParticles();
}
// Leaving bubble mode leaves radius_bubble / opacity_bubble on every particle; clear them on switch.
function setHover(p, mode) {
  p.interactivity.events.onhover.mode = mode;
  for (const q of p.particles.array) q.radius_bubble = q.opacity_bubble = undefined;
}
const count = (p) => p.particles.array.length;

// Demo cursor: dispatches synthetic mouse events on the canvas so hover and click modes show without
// a mouse. It stops for good as soon as a real pointer moves over the host.
function ghost(ctx, host, { clickEvery = 0, canClick = () => true, path = (t) => [0.5 + 0.33 * Math.sin(t * 0.7), 0.5 + 0.3 * Math.sin(t * 1.13 + 1)] } = {}) {
  const dot = h("div", { class: "ghost" });
  host.append(dot);
  let t = 0, last = performance.now(), live = true;
  const stop = ctx.raf((now, dt) => {
    const cv = host.querySelector("canvas");
    if (!cv) return;
    t += dt / 1000;
    const r = cv.getBoundingClientRect();
    const [fx, fy] = path(t);
    const x = fx * r.width, y = fy * r.height;
    dot.style.transform = `translate(${x - 8}px, ${y - 8}px)`;
    const at = { clientX: r.left + x, clientY: r.top + y, bubbles: true };
    cv.dispatchEvent(new MouseEvent("mousemove", at));
    if (clickEvery && now - last > clickEvery) {
      last = now;
      if (!canClick()) return;
      cv.dispatchEvent(new MouseEvent("click", at));
      dot.classList.remove("tap");
      void dot.offsetWidth;
      dot.classList.add("tap");
    }
  });
  ctx.on(host, "mousemove", (e) => {
    if (!e.isTrusted || !live) return;
    live = false;
    stop();
    dot.remove();
  });
}

// ---------- scene 1: the original hero ----------
const HERO = {
  particles: {
    number: { value: 90, density: { enable: true, value_area: 900 } },
    color: { value: ["#4cc9f0", "#9d8cff", "#f7df1e"] },
    shape: { type: "circle" },
    opacity: { value: 0.8, random: true, anim: { enable: true, speed: 0.6, opacity_min: 0.3, sync: false } },
    size: { value: 3.2, random: true },
    line_linked: { enable: true, distance: 150, color: "#4cc9f0", opacity: 0.35, width: 1 },
    move: { enable: true, speed: 1.6, direction: "none", random: false, straight: false, out_mode: "out" },
  },
  interactivity: {
    events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" } },
    modes: {
      grab: { distance: 190, line_linked: { opacity: 0.9 } },
      repulse: { distance: 130, duration: 0.4 },
      bubble: { distance: 180, size: 12, duration: 2, opacity: 0.9, speed: 3 },
      push: { particles_nb: 4 },
    },
  },
  retina_detect: true,
};

// ---------- scene 2: hover and click modes ----------
const HOVERS = [["抓取", "grab"], ["泡泡", "bubble"], ["推開", "repulse"], ["抓取＋泡泡", ["grab", "bubble"]]];
const CLICKS = [
  { value: "push", label: "push 新增" },
  { value: "remove", label: "remove 移除" },
  { value: "bubble", label: "bubble 放大" },
  { value: "repulse", label: "repulse 震波" },
];
const INTERACT = {
  particles: {
    number: { value: 60, density: { enable: false } },
    color: { value: COLORS },
    opacity: { value: 0.9 },
    size: { value: 4, random: true },
    line_linked: { enable: true, distance: 120, color: "#4cc9f0", opacity: 0.25, width: 1 },
    move: { enable: true, speed: 1.4, out_mode: "bounce" },
  },
  interactivity: {
    events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" } },
    modes: {
      grab: { distance: 180, line_linked: { opacity: 0.9 } },
      bubble: { distance: 160, size: 14, duration: 2, opacity: 1 },
      repulse: { distance: 140, duration: 0.6 },
      push: { particles_nb: 6 },
      remove: { particles_nb: 6 },
    },
  },
  retina_detect: true,
};
function resetClick(p) {
  Object.assign(p.tmp, { bubble_clicking: false, bubble_duration_end: false, repulse_clicking: false });
  for (const q of p.particles.array) {
    q.vx = q.vx_i;
    q.vy = q.vy_i;
    q.radius_bubble = q.opacity_bubble = undefined;
  }
}

// ---------- scene 3: shapes ----------
const SHAPES = [["circle", "圓形"], ["edge", "方形"], ["triangle", "三角形"], ["polygon", "多邊形"], ["star", "星形"], ["image", "SVG 圖示"]];
const shapeConfig = (type, sides) => ({
  particles: {
    number: { value: 16, density: { enable: false } },
    color: { value: COLORS },
    shape: {
      type, stroke: { width: 0, color: "#ecebe6" }, polygon: { nb_sides: sides },
      image: { src: "assets/particlesjs/pin.svg", width: 32, height: 32 },
    },
    opacity: { value: 0.95 },
    size: { value: 12, random: false, anim: { enable: true, speed: 4, size_min: 6, sync: false } },
    line_linked: { enable: false },
    move: { enable: true, speed: 1.2, out_mode: "bounce" },
  },
  interactivity: {
    events: { onhover: { enable: true, mode: "bubble" }, onclick: { enable: true, mode: "push" } },
    modes: { bubble: { distance: 90, size: 22, duration: 2, opacity: 1 }, push: { particles_nb: 2 } },
  },
  retina_detect: true,
});

// ---------- scene 4: motion presets ----------
const MOTION = [
  {
    name: "雪花", bg: "linear-gradient(#0b1530, #1b2a4a)",
    chip: '<code>direction: "bottom"</code>　<code>straight: false</code>　滑過 <code>repulse</code>',
    cfg: {
      particles: {
        number: { value: 140, density: { enable: true, value_area: 800 } },
        color: { value: "#ffffff" },
        opacity: { value: 0.85, random: true },
        size: { value: 4, random: true },
        line_linked: { enable: false },
        move: { enable: true, speed: 2, direction: "bottom", straight: false, out_mode: "out" },
      },
      interactivity: {
        events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: false } },
        modes: { repulse: { distance: 110, duration: 0.4 } },
      },
    },
  },
  {
    name: "斜雨", bg: "linear-gradient(#071018, #0d1b26)",
    chip: '<code>direction: "bottom-left"</code>　<code>straight: true</code>　<code>speed: 16</code>',
    cfg: {
      particles: {
        number: { value: 130, density: { enable: true, value_area: 800 } },
        color: { value: "#4cc9f0" },
        opacity: { value: 0.75, random: true },
        size: { value: 2.2, random: true },
        line_linked: { enable: false },
        move: { enable: true, speed: 16, direction: "bottom-left", straight: true, random: false, out_mode: "out" },
      },
      interactivity: { events: { onhover: { enable: false }, onclick: { enable: false } } },
    },
  },
  {
    name: "上升氣泡", bg: "radial-gradient(80% 80% at 50% 100%, #0f3340, #071318)",
    chip: '<code>direction: "top"</code>　<code>size.anim</code> 4 到 14　<code>shape.stroke</code>',
    cfg: {
      particles: {
        number: { value: 50, density: { enable: true, value_area: 800 } },
        color: { value: ["#4cc9f0", "#9d8cff", "#7bd389"] },
        shape: { type: "circle", stroke: { width: 1.5, color: "#cfe8ff" } },
        opacity: { value: 0.3 },
        size: { value: 14, random: true, anim: { enable: true, speed: 6, size_min: 4, sync: false } },
        line_linked: { enable: false },
        move: { enable: true, speed: 2.4, direction: "top", straight: false, out_mode: "out" },
      },
      interactivity: {
        events: { onhover: { enable: true, mode: "bubble" }, onclick: { enable: false } },

      },
    },
  },
  {
    name: "碰撞反彈", bg: "#0e1013",
    chip: '<code>out_mode: "bounce"</code>　<code>move.bounce: true</code><br><span class="sub">碰撞檢查寫在連線迴圈裡，所以要開 line_linked</span>',
    cfg: {
      particles: {
        number: { value: 26, density: { enable: false } },
        color: { value: COLORS },
        opacity: { value: 0.9 },
        size: { value: 18, random: true },
        line_linked: { enable: true, distance: 110, color: "#9d8cff", opacity: 0.25, width: 1 },
        move: { enable: true, speed: 4, direction: "none", out_mode: "bounce", bounce: true },
      },
      interactivity: {
        events: { onhover: { enable: true, mode: "repulse" }, onclick: { enable: false } },
        modes: { repulse: { distance: 100, duration: 0.4 } },
      },
    },
  },
  {
    name: "相互吸引", bg: "radial-gradient(70% 70% at 50% 50%, #2a1408, #0e0a08)",
    chip: '<code>move.attract</code>　<code>rotateX: 300</code>　<code>rotateY: 600</code>',
    cfg: {
      particles: {
        number: { value: 90, density: { enable: false } },
        color: { value: ["#f7df1e", "#ff8c42", "#f72585"] },
        opacity: { value: 0.85 },
        size: { value: 3.5, random: true },
        line_linked: { enable: true, distance: 140, color: "#ff8c42", opacity: 0.3, width: 1 },
        move: { enable: true, speed: 2, direction: "none", out_mode: "out", attract: { enable: true, rotateX: 300, rotateY: 600 } },
      },
      interactivity: {
        events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: false } },
        modes: { grab: { distance: 160, line_linked: { opacity: 0.8 } } },

];

// ---------- scene 5: live tuning ----------
const PALETTES = [
  ["青藍", ["#4cc9f0", "#9d8cff", "#ecebe6"], "#4cc9f0"],
  ["霓虹", ["#f72585", "#9d8cff", "#4cc9f0"], "#f72585"],
  ["暖橘", ["#f7df1e", "#ff8c42", "#f72585"], "#ff8c42"],
];
const tuneConfig = (s) => ({
  particles: {
    number: { value: s.n, density: { enable: s.density, value_area: 800 } },
    color: { value: PALETTES[s.pal][1] },
    opacity: { value: 0.9 },
    size: { value: 3.5, random: true },
    line_linked: { enable: true, distance: s.dist, color: PALETTES[s.pal][2], opacity: 0.4, width: 1 },
    move: { enable: true, speed: s.speed, out_mode: "out" },
  },
  interactivity: {
    events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" } },
    modes: { grab: { distance: 160, line_linked: { opacity: 0.9 } }, push: { particles_nb: 4 } },
  },
  retina_detect: true,
});

// ---------- scene 6: JSON configs ----------
const FILES = [["夜空", "night.json"], ["泡泡", "bubble.json"], ["網路", "network.json"]];

// ---------- scene 7: stress ----------
const LINK_CAP = 2000;
const fmtBig = (x) => (x >= 1e8 ? `${(x / 1e8).toFixed(1)} 億` : x >= 1e4 ? `${(x / 1e4).toFixed(1)} 萬` : String(x));

Showcase.run({ scenes: [
  {
    id: "hero", title: "連線背景",
    api: "particlesJS(id, config)・interactivity.events.onhover.mode",
    desc: "原版招牌：三色粒子依 density 換算數量，150 px 內自動連線。上方按鈕直接改寫執行中實例的 onhover.mode，不必重建。",
    hint: "移動滑鼠看連線被抓向游標・點擊新增 4 顆・切換滑過效果",
    mount(ctx) {
      ctx.html(`<div class="pjs"></div>
        <div class="hero"><small>SMART CITY 2026</small><h1>智慧城市論壇</h1><p>台北・台中・高雄 三地巡迴</p><div><span class="cta">立即報名</span></div></div>
        <div class="chip"></div>`);
      const host = ctx.$(".pjs"), chip = ctx.$(".chip");
      const show = (m) => { chip.innerHTML = `<code>onhover.mode = "${m}"</code>`; };
      const modes = ["grab", "repulse", "bubble"];
      ctx.group(["抓取連線", "推開", "泡泡"], 0, (i) => { setHover(p, modes[i]); show(modes[i]); });
      const p = spawn(ctx, host, HERO);
      show("grab");
      ghost(ctx, host);
      ctx.fps({ position: "right bottom", extra: () => ({ 粒子: count(p) }) });
    },
  },
  {
    id: "interact", title: "互動模式",
    api: "onhover.mode（可為陣列）・onclick.mode・modes.grab／bubble／repulse／push／remove",
    desc: "滑過與點擊各有一組模式，滑過可傳陣列同時套用兩種。點擊的 bubble 與 repulse 只在滑過模式不含同一種時才生效（原始碼以 else if 判斷）。",
    hint: "切換滑過效果・從下拉選單換點擊行為後點畫面",
    mount(ctx) {
      ctx.html(`<div class="pjs"></div><div class="chip"></div>`);
      const host = ctx.$(".pjs"), chip = ctx.$(".chip");
      let p = null;
      const show = () => {
        const ev = p.interactivity.events;
        const click = ev.onclick.mode;
        const blocked = (click === "bubble" || click === "repulse") && [].concat(ev.onhover.mode).includes(click);
        chip.innerHTML = `<code>onhover.mode = ${JSON.stringify(ev.onhover.mode)}</code>　<code>onclick.mode = "${click}"</code>` +
          (blocked ? `<br><span class="sub">滑過已是 ${click}，點擊版不會觸發</span>` : "");
      };
      ctx.group(HOVERS.map((x) => x[0]), 0, (i) => { setHover(p, HOVERS[i][1]); show(); });
      ctx.select("點擊", CLICKS, "push", (v) => { p.interactivity.events.onclick.mode = v; resetClick(p); show(); });
      p = spawn(ctx, host, INTERACT);
      show();
      ghost(ctx, host, {
        clickEvery: 2600,
        canClick: () => {
          const mode = p.interactivity.events.onclick.mode;
          return !(mode === "remove" && count(p) <= 24) && !(mode === "push" && count(p) >= 180);
        },
      });
      ctx.fps({ position: "right bottom", extra: () => ({ 粒子: count(p) }) });
    },
  },
  {
    id: "shapes", title: "粒子形狀",
    api: "shape.type：circle・edge・triangle・polygon・star・image",
    desc: "六個實例同時運作（全都列在 pJSDom）。星形與多邊形都讀 polygon.nb_sides；image 讀 SVG 時會把檔案中的 #hex 色碼換成每顆粒子自己的顏色。2.0.0 第一次載入 SVG 時沒有把 tmp.count_svg 歸零，圖片永遠不會畫出，本頁建立實例後先補設為 0。描邊與邊數每格重畫時讀取，可即時調整。",
    hint: "拖曳邊數與角數・開關描邊・滑過任一格讓粒子放大、點擊新增 2 顆",
    mount(ctx) {
      ctx.html(`<div class="grid">${SHAPES.map(([type, name]) => `<div class="cell"><div class="pjs"></div><div class="lab"><code>${type}</code> ${name}</div></div>`).join("")}</div>`);
      const hosts = ctx.$$(".cell .pjs");
      const insts = hosts.map((el, i) => spawn(ctx, el, shapeConfig(SHAPES[i][0], SHAPES[i][0] === "star" ? 5 : 6)));
      const byType = (t) => insts[SHAPES.findIndex((s) => s[0] === t)];
      ctx.slider("多邊形邊數", { min: 3, max: 10, step: 1, value: 6 }, (v) => { byType("polygon").particles.shape.polygon.nb_sides = v; });
      ctx.slider("星形角數", { min: 5, max: 11, step: 2, value: 5 }, (v) => { byType("star").particles.shape.polygon.nb_sides = v; });
      ctx.toggle("描邊 stroke", false, (v) => { for (const p of insts) p.particles.shape.stroke.width = v ? 2 : 0; });
      ctx.fps({ position: "right bottom", extra: () => ({ 實例: window.pJSDom.length, 粒子: insts.reduce((a, p) => a + count(p), 0) }) });
    },
  },
  {
    id: "motion", title: "運動與物理",
    api: "move.direction・straight・out_mode・bounce・attract・size.anim",
    desc: "五組運動預設，每次切換都重建實例。碰撞（move.bounce）寫在粒子兩兩比對的迴圈裡，只有開 line_linked 或 attract 時才會檢查，所以碰撞組也開了淡淡的連線。",
    hint: "切換五種運動・雪花、氣泡、碰撞組可用滑鼠推開或放大粒子",
    mount(ctx) {
      ctx.html(`<div class="pjs"></div><div class="chip"></div>`);
      const host = ctx.$(".pjs"), chip = ctx.$(".chip");
      let p = null;
      const use = (i) => {
        host.style.background = MOTION[i].bg;
        chip.innerHTML = MOTION[i].chip;
        p = spawn(ctx, host, { ...MOTION[i].cfg, retina_detect: true });
      };
      ctx.group(MOTION.map((m) => m.name), 0, use);
      use(0);
      ghost(ctx, host, { path: (t) => [0.5 + 0.36 * Math.sin(t * 0.45), 0.55 + 0.25 * Math.sin(t * 0.9 + 0.6)] });
      ctx.fps({ position: "right bottom", extra: () => ({ 粒子: p ? count(p) : 0 }) });
    },
  },
  {
    id: "tune", title: "即時調參",
    api: "pJS.fn.particlesRefresh()・pJS.tmp.obj",
    desc: "仿官方產生器。距離與速度直接改執行中的數值，並同步寫進 tmp.obj（否則下次 refresh 會被 retina 換算蓋回）；數量、配色、density 要呼叫 particlesRefresh() 重建全部粒子。左下列出每個設定的套用方式。",
    hint: "拖曳滑桿・切換配色與 density・看左下 refresh 次數",
    mount(ctx) {
      ctx.html(`<div class="pjs"></div><div class="cfg"><div class="head"></div><div class="rows"></div></div>`);
      const host = ctx.$(".pjs"), head = ctx.$(".cfg .head"), rows = ctx.$(".cfg .rows");
      const s = { n: 100, dist: 140, speed: 2, pal: 0, density: false };
      let refreshes = 0, p = null;
      const render = () => {
        const line = (key, val, live) => `<div class="ln"><code>${key}</code><b>${val}</b><small class="${live ? "now" : ""}">${live ? "即時" : "refresh"}</small></div>`;
        head.innerHTML = `particlesRefresh() <code>${refreshes}</code> 次　實際粒子 <code>${count(p)}</code>`;
        rows.innerHTML = [
          line("number.value", s.n, false),
          line("density.enable", s.density, false),
          line("color.value", PALETTES[s.pal][0], false),
          line("line_linked.distance", s.dist, true),
          line("move.speed", s.speed.toFixed(1), true),
        ].join("");
      };
      const refresh = () => { p.fn.particlesRefresh(); refreshes++; render(); };
      ctx.slider("數量", { min: 20, max: 300, step: 10, value: s.n }, (v) => { s.n = v; p.particles.number.value = v; refresh(); });
      ctx.slider("連線距離", { min: 40, max: 260, step: 5, value: s.dist }, (v) => {
        s.dist = v;
        p.tmp.obj.line_linked_distance = v;
        p.particles.line_linked.distance = v * p.canvas.pxratio;
        render();
      });
      ctx.slider("速度", { min: 0, max: 12, step: 0.5, value: s.speed, format: (v) => v.toFixed(1) }, (v) => {
        s.speed = v;
        p.tmp.obj.move_speed = v;
        p.particles.move.speed = v * p.canvas.pxratio;
        render();
      });
      ctx.group(PALETTES.map((x) => x[0]), 0, (i) => {
        s.pal = i;
        p.particles.color.value = PALETTES[i][1];
        p.particles.line_linked.color = PALETTES[i][2];
        refresh();
      });
      ctx.toggle("density", false, (v) => { s.density = v; p.particles.number.density.enable = v; refresh(); });
      p = spawn(ctx, host, tuneConfig(s));
      render();
      ctx.interval(render, 500);
      ghost(ctx, host);
      ctx.fps({ position: "right bottom" });
    },
  },
  {
    id: "config", title: "設定檔與實例",
    api: "particlesJS.load(id, json, callback)・pJS.fn.vendors.destroypJS()・retina_detect",
    desc: "三份 JSON 設定檔用 particlesJS.load 以 XHR 讀入後建立實例。destroypJS() 會停止動畫、移除畫布，並把全域 pJSDom 設成 null，之後要自己還原成陣列才能再建立實例。",
    hint: "切換設定檔・按 destroypJS() 再重新載入・開關 retina_detect 看畫布像素",
    mount(ctx) {
      ctx.html(`<div class="pjs"></div><div class="log"><div class="head"></div><div class="rows"></div></div>`);
      const host = ctx.$(".pjs"), head = ctx.$(".log .head"), rowsEl = ctx.$(".log .rows");
      host.id = `pjs-${++uid}`;
      host.style.background = "#070a12";
      const maxRows = ctx.size().height > 480 ? 7 : 3;
      const rows = [];
      const log = (code, text) => {
        const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
        rows.unshift(`<div class="ln"><small>${time}</small><code>${code}</code> ${text}</div>`);
        rows.length = Math.min(rows.length, maxRows);
        rowsEl.innerHTML = rows.join("");
      };
      let file = 0, retina = true, queue = Promise.resolve();
      const cur = () => (owners.get(host) || {}).pJS;
      const readout = () => {
        const p = cur();
        const css = `${host.clientWidth}×${host.clientHeight}`;
        head.innerHTML = `pJSDom.length <code>${window.pJSDom ? window.pJSDom.length : "null"}</code>　DPR <code>${window.devicePixelRatio}</code>　` +
          (p ? `畫布 <code>${p.canvas.el.width}×${p.canvas.el.height}</code> px（CSS <code>${css}</code>）` : "沒有實例");
      };
      // particlesJS.load gives no handle and no error callback, so loads run one at a time.
      const loadOnce = (i) => new Promise((resolve) => {
        const name = FILES[i][1], t0 = performance.now();
        log(`particlesJS.load()`, `讀取 ${name}`);
        const timer = setTimeout(() => { log("錯誤", `${name} 5 秒內沒有回應`); resolve(); }, 5000);
        particlesJS.load(host.id, `assets/particlesjs/${name}`, () => {
          clearTimeout(timer);
          const w = window.pJSDom[window.pJSDom.length - 1];
          if (!ctx.active) { kill(w); sync(); return resolve(); }
          drop(host); // the replaced instance would keep animating on its detached canvas
          const p = adopt(ctx, host, w);
          if (!retina) { p.retina_detect = false; p.fn.particlesRefresh(); }
          log("callback", `${Math.round(performance.now() - t0)} ms 後建立，${count(p)} 顆`);
          readout();
          resolve();
        });
      });
      const load = (i) => { file = i; queue = queue.then(() => (ctx.active && file === i ? loadOnce(i) : null)); };
      ctx.group(FILES.map((f) => f[0]), 0, (i) => { killBtn.textContent = "destroypJS()"; load(i); });
      const killBtn = ctx.button("destroypJS()", () => {
        const w = owners.get(host);
        if (!w) { killBtn.textContent = "destroypJS()"; load(file); return; }
        owners.delete(host);
        w.pJS.fn.vendors.destroypJS();
        w.pJS.fn.vendors.draw = w.pJS.fn.vendors.checkBeforeDraw = () => {};
        log("destroypJS()", `畫布已移除，window.pJSDom 變成 <code>${window.pJSDom === null ? "null" : "陣列"}</code>`);
        sync();
        log("還原", "<code>window.pJSDom = []</code>，之後才能再建立實例");
        killBtn.textContent = "重新載入";
        readout();
      });
      ctx.toggle("retina_detect", true, (v) => {
        retina = v;
        const p = cur();
        if (!p) return;
        p.retina_detect = v;
        p.fn.particlesRefresh();
        log(`retina_detect = ${v}`, `pxratio ${p.canvas.pxratio}，畫布 ${p.canvas.el.width}×${p.canvas.el.height}`);
      });
      load(0);
      ctx.interval(readout, 400);
      ghost(ctx, host, {
        clickEvery: 3000,
        canClick: () => { const p = cur(); return !!p && count(p) < 260; },
      });
      ctx.fps({ position: "right bottom", extra: () => ({ 粒子: cur() ? count(cur()) : 0 }) });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "pJS.fn.modes.pushParticles()・removeParticles()・line_linked",
    desc: "逐級用 pushParticles／removeParticles 補到目標數量並量測 FPS。連線預設開啟，可關掉連線或改畫星形，比較兩兩比對與形狀繪製的成本。",
    hint: "按「自動加壓」・關掉連線或切成星形後再測一次",
    mount(ctx) {
      ctx.html(`<div class="stage-box"><div class="pjs"></div></div>`);
      ctx.controls.classList.add("bottom");
      const host = ctx.$(".stage-box .pjs");
      let wantLinks = true, star = false;
      const p = spawn(ctx, host, {
        particles: {
          number: { value: 0, density: { enable: false } },
          color: { value: COLORS },
          shape: { type: "circle", polygon: { nb_sides: 5 } },
          opacity: { value: 0.85 },
          size: { value: 2.2, random: true },
          line_linked: { enable: true, distance: 50, color: "#4cc9f0", opacity: 0.35, width: 1 },
          move: { enable: true, speed: 1.2, out_mode: "bounce" },
        },
        interactivity: { events: { onhover: { enable: false }, onclick: { enable: false } } },
        retina_detect: true,
      });
      // Above LINK_CAP the O(n^2) link loop takes seconds per frame and freezes the tab.
      const linksOn = () => wantLinks && count(p) <= LINK_CAP;
      const syncLinks = () => { p.particles.line_linked.enable = linksOn(); };
      ctx.toggle("連線 line_linked", true, (v) => { wantLinks = v; syncLinks(); });
      ctx.toggle("星形 star", false, (v) => {
        star = v;
        const t = v ? "star" : "circle";
        p.particles.shape.type = t;
        for (const q of p.particles.array) q.shape = t;
      });
      ctx.ramp({
        label: "粒子", unit: "顆", steps: [250, 500, 1000, 1500, 2000, 4000, 8000, 16000, 32000], minFps: 30,
        apply(n) {
          const d = n - count(p);
          if (d > 0) p.fn.modes.pushParticles(d);
          else if (d < 0) p.fn.modes.removeParticles(-d);
          syncLinks();
        },
        metrics: () => {
          const n = count(p), on = linksOn();
          return {
            實際粒子: n,
            每格配對: on ? fmtBig(n * (n - 1) / 2) : "0",
            模式: `${on ? "連線" : wantLinks ? `連線暫停（超過 ${LINK_CAP} 顆）` : "無連線"}・${star ? "星形" : "圓形"}`,
          };
        },
        note: `particles.js 每格對每顆粒子跑一次更新（移動、透明度、尺寸、邊界）再用 Canvas 2D 畫一次。開連線時用雙層迴圈比對所有粒子對，沒有空間格子，n 顆就要算 n(n-1)/2 次距離，成本隨數量平方成長；超過 ${LINK_CAP} 顆會自動暫停連線，以免頁面卡死。星形經 drawShape 逐邊 translate、rotate，比圓形慢。無頭瀏覽器是軟體繪圖，實機通常高出數倍。`,
      });
    },
  },
] });
</script>
</body>
</html>
