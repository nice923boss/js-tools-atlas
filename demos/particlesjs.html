<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>particles.js 示範：科技感連線背景</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #particles-js {
    position: fixed; inset: 0;
    background: radial-gradient(70% 90% at 50% 30%, #13233a 0%, #0b1220 55%, #070a10 100%);
  }
  .hero {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    pointer-events: none; padding: 0 20px;
  }
  .hero small { color: var(--c2); letter-spacing: .3em; font-size: 12px; }
  .hero h1 { margin: 6px 0 0; font-size: clamp(26px, 6vw, 54px); font-weight: 800; letter-spacing: .08em; }
  .hero p { margin: 10px 0 0; color: var(--muted); font-size: clamp(13px, 2vw, 16px); }
  .hero .cta {
    display: inline-block; margin-top: 18px; padding: 9px 20px; border-radius: 999px;
    border: 1px solid rgba(76, 201, 240, .6); color: var(--c2); font-size: 14px;
    background: rgba(76, 201, 240, .08);
  }
</style>
</head>
<body>
<div id="particles-js"></div>
<div class="hero">
  <small>SMART CITY 2026</small>
  <h1>智慧城市論壇</h1>
  <p>台北・台中・高雄 三地巡迴</p>
  <div><span class="cta">立即報名</span></div>
</div>
<div class="controls" id="modes">
  <button class="btn" data-mode="grab" aria-pressed="true">抓取連線</button>
  <button class="btn" data-mode="repulse">推開</button>
  <button class="btn" data-mode="bubble">泡泡</button>
</div>
<div class="hint">移動滑鼠互動・點擊畫面新增粒子・右上切換滑過效果</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.js"></script>
<script>
// Classic particles.js network; hover mode is switched live on the running instance.
particlesJS("particles-js", {
  particles: {
    number: { value: 90, density: { enable: true, value_area: 900 } },
    color: { value: ["#4cc9f0", "#9d8cff", "#f7df1e"] },
    shape: { type: "circle" },
    opacity: { value: 0.8, random: true, anim: { enable: true, speed: 0.6, opacity_min: 0.3, sync: false } },
    size: { value: 3.2, random: true },
    line_linked: { enable: true, distance: 150, color: "#4cc9f0", opacity: 0.35, width: 1 },
    move: { enable: true, speed: 1.6, direction: "none", random: false, straight: false, out_mode: "out" },
  },
  interactivity: {
    detect_on: "canvas",
    events: { onhover: { enable: true, mode: "grab" }, onclick: { enable: true, mode: "push" }, resize: true },
    modes: {
      grab: { distance: 190, line_linked: { opacity: 0.9 } },
      repulse: { distance: 130, duration: 0.4 },
      bubble: { distance: 180, size: 12, duration: 2, opacity: 0.9, speed: 3 },
      push: { particles_nb: 4 },
    },
  },
  retina_detect: true,
});

document.getElementById("modes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mode]");
  if (!b) return;
  window.pJSDom[0].pJS.interactivity.events.onhover.mode = b.dataset.mode;
  document.querySelectorAll("#modes .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});
</script>
</body>
</html>
