<script type="module">
import PF from "https://cdn.jsdelivr.net/npm/pathfinding@0.4.18/+esm";

// pathfinding 0.4.18: Util.smoothenPath assigns to an undeclared `lastValidCoord`. The ES module bundle is strict
// code, so that assignment throws a ReferenceError; declaring the global first turns it into a plain property write.
globalThis.lastValidCoord = null;

const { h, fmt, fmtCompact, fmtMs } = Showcase;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const DM = PF.DiagonalMovement;
const PATH_MS = 380;
const COL = {
  frame: "#14171c", floor: "#1c2027", wall: "#8d95a8", wallTop: "#b3bacb", tested: "#7a5d22",
  open: "#22b39c", openB: "#b06ef0", closed: "#1f3f7a", closedB: "#4a2f7d", path: "#f7df1e", start: "#7bd389", goal: "#f72585",
};
const FLASH = [null, "#8cffe9", "#7fa8ff", "#ffd38a"];

// ---------- maps: walls[x + y * W] = 1 means blocked ----------
function mulberry(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const newSeed = () => 1 + Math.floor(Math.random() * 1e9);
const makeMap = (W, H) => ({ W, H, walls: new Uint8Array(W * H), sx: 1, sy: H >> 1, gx: W - 2, gy: H >> 1 });
const isWall = (m, x, y) => x < 0 || y < 0 || x >= m.W || y >= m.H || m.walls[x + y * m.W] === 1;
function toGrid(m) {
  const g = new PF.Grid(m.W, m.H);
  for (let i = 0; i < m.walls.length; i++) if (m.walls[i]) g.setWalkableAt(i % m.W, (i / m.W) | 0, false);
  return g;
}
function clearEnds(m) { m.walls[m.sx + m.sy * m.W] = 0; m.walls[m.gx + m.gy * m.W] = 0; }
const solvable = (m) => new PF.AStarFinder().findPath(m.sx, m.sy, m.gx, m.gy, toGrid(m)).length > 0;

// random walls plus a few long bars (the original demo's map), retried until start and goal connect
function scatterMap(W, H, rnd, dens = 0.22, bars = 3) {
  let m;
  for (let t = 0; t < 20; t++) {
    m = makeMap(W, H);
    m.sx = Math.max(1, Math.floor(W * 0.12)); m.gx = Math.min(W - 2, Math.ceil(W * 0.88));
    for (let i = 0; i < W * H; i++) if (rnd() < dens) m.walls[i] = 1;
    for (let b = 0; b < bars; b++) {
      const x = Math.floor(W * (0.3 + b * 0.2)), y0 = Math.floor(rnd() * H * 0.4), len = Math.floor(H * 0.6);
      for (let y = y0; y < Math.min(H, y0 + len); y++) m.walls[x + y * W] = 1;
    }
    clearEnds(m);
    if (solvable(m)) break;
  }
  return m;
}
// recursive backtracker with some walls knocked out, so there are loops and several routes
function mazeMap(W, H, rnd) {
  const m = makeMap(W, H), stack = [[1, 1]];
  m.walls.fill(1);
  m.walls[1 + W] = 0;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const next = [[2, 0], [-2, 0], [0, 2], [0, -2]].map(([dx, dy]) => [x + dx, y + dy, x + dx / 2, y + dy / 2])
      .filter(([nx, ny]) => nx > 0 && ny > 0 && nx < W - 1 && ny < H - 1 && m.walls[nx + ny * W]);
    if (!next.length) { stack.pop(); continue; }
    const [nx, ny, mx, my] = next[Math.floor(rnd() * next.length)];
    m.walls[mx + my * W] = 0; m.walls[nx + ny * W] = 0;
    stack.push([nx, ny]);
  }
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) if (m.walls[x + y * W] && rnd() < 0.12) m.walls[x + y * W] = 0;
  m.sx = 1; m.sy = 1; m.gx = W - 2 - ((W - 3) % 2); m.gy = H - 2 - ((H - 3) % 2);
  clearEnds(m);
  return m;
}
// rectangular obstacles on open ground: good for showing line-of-sight smoothing
function blocksMap(W, H, rnd) {
  let m;
  for (let t = 0; t < 30; t++) {
    m = makeMap(W, H);
    if (W >= H) { m.sx = 1; m.sy = (H * (0.2 + rnd() * 0.6)) | 0; m.gx = W - 2; m.gy = (H * (0.2 + rnd() * 0.6)) | 0; }
    else { m.sy = 1; m.sx = (W * (0.2 + rnd() * 0.6)) | 0; m.gy = H - 2; m.gx = (W * (0.2 + rnd() * 0.6)) | 0; }
    for (let k = Math.round((W * H) / 45); k > 0; k--) {
      const bw = 2 + ((rnd() * 4) | 0), bh = 2 + ((rnd() * 4) | 0), bx = (rnd() * (W - bw + 1)) | 0, by = (rnd() * (H - bh + 1)) | 0;
      for (let y = by; y < by + bh; y++) for (let x = bx; x < bx + bw; x++) m.walls[x + y * W] = 1;
    }
    clearEnds(m);
    if (solvable(m)) break;
  }
  return m;
}

// ---------- finders ----------
const FINDERS = {
  astar: { name: "A*", api: "AStarFinder", make: (o) => new PF.AStarFinder(o) },
  dijkstra: { name: "Dijkstra", api: "DijkstraFinder", make: (o) => new PF.DijkstraFinder(o) },
  bfs: { name: "廣度優先", api: "BreadthFirstFinder", make: (o) => new PF.BreadthFirstFinder(o) },
  best: { name: "最佳優先", api: "BestFirstFinder", make: (o) => new PF.BestFirstFinder(o) },
  biastar: { name: "雙向 A*", api: "BiAStarFinder", make: (o) => new PF.BiAStarFinder(o) },
  bidijkstra: { name: "雙向 Dijkstra", api: "BiDijkstraFinder", make: (o) => new PF.BiDijkstraFinder(o) },
  bibfs: { name: "雙向廣度優先", api: "BiBreadthFirstFinder", make: (o) => new PF.BiBreadthFirstFinder(o) },
  bibest: { name: "雙向最佳優先", api: "BiBestFirstFinder", make: (o) => new PF.BiBestFirstFinder(o) },
  // JumpPointFinder defaults to the manhattan heuristic in every mode; with diagonal moves that overestimates, so pass octile.
  jps: {
    name: "跳點搜尋", api: "JumpPointFinder",
    make: (o) => new PF.JumpPointFinder({ heuristic: o.diagonalMovement === DM.Never ? PF.Heuristic.manhattan : PF.Heuristic.octile, ...o, trackJumpRecursion: !!o.track }),
  },
};

// Record every opened / closed / tested / by write a finder makes, in order, as a flat [x, y, attr, value] log.
const ATTRS = ["opened", "closed", "tested", "by"];
function instrument(grid) {
  const log = [];
  for (const row of grid.nodes) for (const n of row) {
    ATTRS.forEach((name, k) => {
      let v;
      Object.defineProperty(n, name, { get: () => v, set: (nv) => { v = nv; log.push(n.x, n.y, k + 1, nv === 2 ? 2 : nv ? 1 : 0); } });
    });
  }
  return log;
}
// Replays a log into per-cell states: 1 open, 2 closed, 3 jump-tested; side = 1 for the goal half of a bidirectional search.
function replayer(W, H, log) {
  const n = W * H, st = new Uint8Array(n), side = new Uint8Array(n), born = new Float32Array(n);
  const rp = { st, side, born, k: 0, total: log.length / 4, closed: 0 };
  rp.to = (k, now) => {
    for (k = Math.min(rp.total, k); rp.k < k; rp.k++) {
      const o = rp.k * 4, i = log[o] + log[o + 1] * W, a = log[o + 2], v = log[o + 3];
      if (!v) continue;
      if (a === 1) { if (st[i] !== 1 && st[i] !== 2) { st[i] = 1; born[i] = now; } if (v === 2) side[i] = 1; }
      else if (a === 2) { if (st[i] !== 2) { st[i] = 2; born[i] = now; rp.closed++; } }
      else if (a === 3) { if (!st[i]) { st[i] = 3; born[i] = now; } }
      else side[i] = 1;
    }
    return rp.k >= rp.total;
  };
  return rp;
}
// Time one clean run, then repeat it on an instrumented clone to capture the search order.
function search(m, id, opt = {}) {
  const F = FINDERS[id], base = toGrid(m);
  const t0 = performance.now();
  F.make(opt).findPath(m.sx, m.sy, m.gx, m.gy, base.clone());
  const ms = performance.now() - t0;
  const grid = base.clone(), log = instrument(grid);
  const path = F.make({ ...opt, track: true }).findPath(m.sx, m.sy, m.gx, m.gy, grid);
  let closed = 0;
  for (let o = 0; o < log.length; o += 4) if (log[o + 2] === 2 && log[o + 3]) closed++;
  return { id, path, ms, closed, rp: replayer(m.W, m.H, log), len: path.length ? PF.Util.pathLength(path) : 0 };
}

// ---------- drawing ----------
function box(g, x, y, w, hh, r) { if (r > 0) { g.beginPath(); g.roundRect(x, y, w, hh, r); g.fill(); } else g.fillRect(x, y, w, hh); }
const HEAT = Array.from({ length: 40 }, (_, k) => { const v = k / 39; return `hsl(${Math.round(232 - 192 * v)}, 85%, ${Math.round(24 + 44 * v)}%)`; });
function drawMap(g, m, x0, y0, cs, o = {}) {
  const { W, H, walls } = m, rp = o.rp, now = o.now || 0, heat = o.heat, round = cs >= 9, gap = cs >= 5 ? Math.max(1, cs * 0.08) : 0;
  g.fillStyle = COL.frame;
  box(g, x0 - 3, y0 - 3, W * cs + 6, H * cs + 6, 6);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = x + y * W, px = x0 + x * cs + gap / 2, py = y0 + y * cs + gap / 2, s = cs - gap;
    if (walls[i]) {
      g.fillStyle = COL.wall; box(g, px, py, s, s, round ? cs * 0.18 : 0);
      if (round) { g.fillStyle = COL.wallTop; box(g, px, py, s, s * 0.45, cs * 0.18); }
      continue;
    }
    if (heat && heat[i] > 0) { g.fillStyle = HEAT[Math.round(heat[i] * 39)]; box(g, px, py, s, s, round ? cs * 0.14 : 0); continue; }
    const st = rp ? rp.st[i] : 0;
    if (!st) { g.fillStyle = COL.floor; box(g, px, py, s, s, round ? cs * 0.14 : 0); continue; }
    const k = Math.min(1, Math.max(0, (now - rp.born[i]) / 220)), sz = s * (0.35 + 0.65 * (1 - (1 - k) ** 3));
    g.fillStyle = k < 1 ? FLASH[st] : st === 3 ? COL.tested : st === 1 ? (rp.side[i] ? COL.openB : COL.open) : rp.side[i] ? COL.closedB : COL.closed;
    box(g, px + (s - sz) / 2, py + (s - sz) / 2, sz, sz, round ? cs * 0.16 : 0);
  }
}
// path drawn progressively (t = 0..1) along its true length
function drawPath(g, path, x0, y0, cs, t = 1, o = {}) {
  if (path.length < 2 || t <= 0) return;
  const pts = path.map(([x, y]) => [x0 + (x + 0.5) * cs, y0 + (y + 0.5) * cs]);
  let left = Infinity;
  if (t < 1) { left = 0; for (let k = 1; k < pts.length; k++) left += Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); left *= t; }
  const lw = o.width || Math.max(2, cs * 0.26);
  g.save();
  g.strokeStyle = o.color || COL.path; g.lineCap = "round"; g.lineJoin = "round";
  if (o.dash) g.setLineDash(o.dash);
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k < pts.length && left > 0; k++) {
    const seg = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]), f = Math.min(1, left / seg);
    g.lineTo(pts[k - 1][0] + (pts[k][0] - pts[k - 1][0]) * f, pts[k - 1][1] + (pts[k][1] - pts[k - 1][1]) * f);
    left -= seg;
  }
  // glow from two wide translucent strokes; shadowBlur costs seconds per frame on software-rendered canvases
  if (o.glow !== false) {
    g.globalAlpha = 0.16; g.lineWidth = lw * 3.2; g.stroke();
    g.globalAlpha = 0.3; g.lineWidth = lw * 1.9; g.stroke();
    g.globalAlpha = 1;
  }
  g.lineWidth = lw; g.stroke();
  g.restore();
}
function endpoint(g, x, y, x0, y0, cs, color, label) {
  const cx = x0 + (x + 0.5) * cs, cy = y0 + (y + 0.5) * cs;
  const r = Math.max(2.5, cs * 0.46);
  g.fillStyle = color;
  g.globalAlpha = 0.22; g.beginPath(); g.arc(cx, cy, r * 1.5, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
  if (cs < 14) return;
  g.fillStyle = "#0e1013"; g.font = `700 ${Math.round(cs * 0.56)}px ${CJK}`;
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(label, cx, cy + cs * 0.03);
  g.textAlign = "left"; g.textBaseline = "alphabetic";
}
const ends = (g, m, { x0, y0, cs }) => { endpoint(g, m.sx, m.sy, x0, y0, cs, COL.start, "起"); endpoint(g, m.gx, m.gy, x0, y0, cs, COL.goal, "終"); };

// Size a canvas to its box at device resolution; the returned context draws in CSS pixels.
function sizeCanvas(cv, el) {
  const w = Math.max(1, el.clientWidth), hh = Math.max(1, el.clientHeight);
  const pw = Math.round(w * DPR), ph = Math.round(hh * DPR);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  cv.style.width = w + "px"; cv.style.height = hh + "px";
  const g = cv.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return { g, w, h: hh };
}
// A dark pane: caption lines reserved up front (later text never resizes the view), optional meter, canvas view.
function pane(parent, lines = 1, meter = false) {
  const tag = h("div", { class: "pf-tag" }), cv = h("canvas"), view = h("div", { class: "pf-view" }, cv);
  const bar = meter ? h("div", { class: "pf-meter" }, h("i")) : null;
  const el = h("div", { class: "pf-pane" }, tag, bar, view);
  parent.append(el);
  const p = {
    el, view, cv, geo: { x0: 0, y0: 0, cs: 1 },
    set(title, ...rest) { tag.innerHTML = `<b>${title}</b>` + Array.from({ length: lines }, (_, k) => `<span>${rest[k] ?? "&nbsp;"}</span>`).join(""); },
    meter(f) { if (bar) bar.firstChild.style.width = `${(Math.max(0, Math.min(1, f)) * 100).toFixed(1)}%`; },
  };
  p.set("&nbsp;");
  return p;
}
// Fit an m.W x m.H map centered in the pane; stores the geometry for hit testing.
function fitPane(p, m, maxCs = 30) {
  const { g, w, h: hh } = sizeCanvas(p.cv, p.view);
  const cs = Math.max(1, Math.min(maxCs, (w - 10) / m.W, (hh - 10) / m.H));
  p.geo = { x0: (w - m.W * cs) / 2, y0: (hh - m.H * cs) / 2, cs };
  g.clearRect(0, 0, w, hh);
  return g;
}
function cellOf(cv, geo, m, e) {
  const r = cv.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left - geo.x0) / geo.cs), y = Math.floor((e.clientY - r.top - geo.y0) / geo.cs);
  return x >= 0 && y >= 0 && x < m.W && y < m.H ? [x, y] : null;
}
// Redraw on demand: ask() schedules draw(t) for the next frame; draw returns true to keep animating.
function painter(ctx, draw) {
  let need = true;
  ctx.raf((t) => { if (need) need = !!draw(t); });
  return () => { need = true; };
}
// Observe a nested element only (never .board itself, whose padding the control bar changes).
function watch(ctx, el, fn) {
  const ro = new ResizeObserver(() => ctx.active && fn());
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
}
// Several searches replayed side by side. Every pane advances the same number of log entries per
// millisecond, so a finder that does less work finishes (and draws its path) earlier.
function replayBoard(ctx, panes, host, { dur, caption }) {
  let m = null, rs = [], t0 = 0, anim = false, maxClosed = 1, maxOps = 1;
  const ask = painter(ctx, (now) => {
    if (!m) return false;
    const el = anim ? now - t0 : Infinity;
    rs.forEach((r, k) => {
      const p = panes[k], fin = (dur * r.rp.total) / maxOps;
      if (anim) r.rp.to(Math.ceil((el / dur) * maxOps), now);
      p.meter(r.rp.closed / maxClosed);
      if (el >= fin && !r.shown) { r.shown = true; caption(p, r, k, true); }
      const g = fitPane(p, m);
      drawMap(g, m, p.geo.x0, p.geo.y0, p.geo.cs, { rp: r.rp, now });
      drawPath(g, r.path, p.geo.x0, p.geo.y0, p.geo.cs, Math.max(0, Math.min(1, (el - fin) / PATH_MS)));

          const lab = ctx.$(".sc-lab");
          let ox = 0;
          if (lab && !lab.classList.contains("min")) {
            const cover = lab.getBoundingClientRect().right - bx.getBoundingClientRect().left + 8;
            if (cover > 0 && fullW - cover >= 240) ox = cover;
          }
          g.translate(ox, 0);
          const w = fullW - ox;
          if (w >= 520 && w > hh) {
            const S = Math.max(60, Math.min(w * 0.42, hh - 54));
            drawThumb(g, 12, 42, S);
            drawChart(g, S + 34, 42, w - S - 44, hh - 52);
          } else {
            const chartH = Math.min(hh * 0.5, 230), S = Math.max(60, Math.min(w - 24, hh - chartH - 56));
            drawThumb(g, (w - S) / 2, 42, S);
            drawChart(g, 12, 42 + S + 12, w - 24, hh - S - 56);
          }
          const r = hist[hist.length - 1];
          if (!r) tag.textContent = `25% 隨機牆，左上到右下，${diag ? "可斜走" : "不斜走"}`;
          else {
            const fast = BF.reduce((a, b) => (r.t[b.id] < r.t[a.id] ? b : a));
            tag.textContent = `${fmt(r.W)} × ${fmt(r.W)}・A* 路徑長 ${r.len ? r.len.toFixed(0) : "無"}・最快 ${fast.name} ${fmtMs(r.t[fast.id])}`;
          }
        }
        ctx.controls.classList.add("bottom");
        ctx.toggle("斜走", diag, (v) => { diag = v; hist = []; last = null; paint(); });
        ctx.bench({
          label: "地圖格數", unit: "格", sizes: SIZES, target: 1000, budget: 2000,
          prepare(n) {
            const W = Math.round(Math.sqrt(n));
            // a random map can wall in a corner (seed 65536 does), so re-roll until a flood fill links the two corners
            for (let s = n; ; s += 7919) {
              const rnd = mulberry(s), mat = new Array(W);
              for (let y = 0; y < W; y++) { const row = new Array(W); for (let x = 0; x < W; x++) row[x] = rnd() < 0.25 ? 1 : 0; mat[y] = row; }
              for (const c of [0, W - 3]) for (let y = c; y < c + 3; y++) for (let x = c; x < c + 3; x++) mat[y][x] = 0;
              const seen = new Uint8Array(W * W), q = new Int32Array(W * W);
              let qh = 0, qt = 1;
              seen[0] = 1;
              while (qh < qt) {
                const i = q[qh++], x = i % W, y = (i - x) / W;
                if (x > 0 && !seen[i - 1] && !mat[y][x - 1]) { seen[i - 1] = 1; q[qt++] = i - 1; }
                if (x < W - 1 && !seen[i + 1] && !mat[y][x + 1]) { seen[i + 1] = 1; q[qt++] = i + 1; }
                if (y > 0 && !seen[i - W] && !mat[y - 1][x]) { seen[i - W] = 1; q[qt++] = i - W; }
                if (y < W - 1 && !seen[i + W] && !mat[y + 1][x]) { seen[i + W] = 1; q[qt++] = i + W; }
              }
              if (seen[W * W - 1]) return { W, mat };
            }
          },
          run(n, d) {
            if (hist.length && n <= hist[hist.length - 1].n) hist = [];
            const opt = { diagonalMovement: diag ? DM.OnlyWhenNoObstacles : DM.Never }, row = { n, W: d.W, build: 0, t: {}, len: 0 };
            for (const f of BF) {
              const t0 = performance.now();
              const grid = new PF.Grid(d.mat);
              const t1 = performance.now();
              const path = FINDERS[f.id].make(opt).findPath(0, 0, d.W - 1, d.W - 1, grid);
              row.t[f.id] = performance.now() - t1;
              row.build += (t1 - t0) / BF.length;
              if (f.id === "astar") { row.len = path.length ? PF.Util.pathLength(path) : 0; last = snapshot(grid, path, d.W); }
            }
            hist.push(row);
            ctx.timeout(paint, 0); // per-finder times are drawn in the chart; the result column is too narrow for them
          },
          note: "每種 Finder 前都重新 new PF.Grid(matrix)，因為搜尋會在節點上留下 opened、closed、parent 等狀態，不能重用；結果列是 6 次建立 Grid 加 6 次搜尋的總和，右側圖表分開畫（建立 Grid 取平均）。PathFinding.js 每格都是一個 JS 物件，建立成本與記憶體隨格數線性成長；Dijkstra 與 BFS 幾乎掃過整張圖，JPS 與最佳優先只碰少數格子。IDA* 是指數成長，不列入。單輪超過 2 秒就停止加碼。",
        });
        watch(ctx, bx, paint);
        const lab = ctx.$(".sc-lab");
        if (lab) watch(ctx, lab, paint);
        paint();
      },
    },
  ],
});
</script>
</body>
