<script type="module">
// pdf-lib showcase: every PDF is created or rewritten by pdf-lib in the page; PDF.js only renders and parses the result.
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs";

const PDFJS = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/";
const SAMPLE = "https://cdn.jsdelivr.net/gh/mozilla/pdf.js@v6.3.289/web/compressed.tracemonkey-pldi-09.pdf";
pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "build/pdf.worker.min.mjs";
const worker = new pdfjsLib.PDFWorker();
const { PDFDocument, StandardFonts, PageSizes, ParseSpeeds, rgb, degrees, PDFTextField, PDFDropdown, PDFCheckBox } = PDFLib;
const { h, fmt } = Showcase;
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
const kb = (n) => (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
const INK = rgb(0.11, 0.11, 0.1), GREY = rgb(0.45, 0.45, 0.42), PINK = rgb(0.84, 0.12, 0.41), BLUE = rgb(0.12, 0.56, 0.72);
const ascii = (s) => s.replace(/[^\x20-\x7E]/g, "");

const openPdf = (bytes) => pdfjsLib.getDocument({ data: new Uint8Array(bytes.slice(0)), worker, standardFontDataUrl: PDFJS + "standard_fonts/" });
// AnnotationMode.ENABLE paints widget appearance streams (the form values pdf-lib wrote) onto the canvas.
async function drawPage(pdf, n, canvas, maxW, maxH) {
  const page = await pdf.getPage(n);
  const base = page.getViewport({ scale: 1 });
  const vp = page.getViewport({ scale: Math.max(0.05, Math.min(maxW / base.width, maxH / base.height)) });
  const dpr = DPR(), off = document.createElement("canvas");
  off.width = Math.floor(vp.width * dpr); off.height = Math.floor(vp.height * dpr);
  await page.render({ canvas: off, viewport: vp, transform: [dpr, 0, 0, dpr, 0, 0], annotationMode: pdfjsLib.AnnotationMode.ENABLE }).promise;
  canvas.width = off.width; canvas.height = off.height;
  canvas.getContext("2d").drawImage(off, 0, 0);
  canvas.style.width = `${vp.width}px`; canvas.style.height = `${vp.height}px`;
  return { page, vp };
}
function previewer(ctx, box, pad = 24) {
  const stack = h("div", { class: "pl-stack" }, h("canvas"));
  box.append(stack);
  let token = 0, task = null;
  ctx.onCleanup(() => task?.destroy());
  return {
    async show(bytes, n = 1) {
      const my = ++token;
      task?.destroy();
      const t = task = openPdf(bytes);
      try {
        const pdf = await t.promise, off = h("canvas");
        const r = await drawPage(pdf, Math.min(n, pdf.numPages), off, box.clientWidth - pad, box.clientHeight - pad);
        if (my !== token) return null;
        stack.replaceChildren(off);
        return { pdf, ...r };
      } catch (e) {
        if (my !== token || !ctx.active) return null;
        throw e;
      }
    },
  };
}
const debounce = (ctx, fn, ms = 160) => { let t; ctx.onCleanup(() => clearTimeout(t)); return (...a) => { clearTimeout(t); t = setTimeout(() => ctx.active && fn(...a), ms); }; };
const download = (bytes, name) => {
  const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
  Object.assign(document.createElement("a"), { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
};

// ---------- scene 1: registration form (ported from the original page) ----------
async function buildTemplate() {
  const doc = await PDFDocument.create();
  doc.setTitle("Workshop Registration Form");
  const page = doc.addPage(PageSizes.A4);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold), reg = await doc.embedFont(StandardFonts.Helvetica);
  page.drawRectangle({ x: 0, y: 742, width: 595, height: 100, color: INK });
  page.drawRectangle({ x: 0, y: 736, width: 595, height: 6, color: rgb(0.97, 0.87, 0.12) });
  page.drawText("WORKSHOP REGISTRATION", { x: 50, y: 790, size: 26, font: bold, color: rgb(1, 1, 1) });
  page.drawText("JS Tools Atlas  /  Taipei  /  Form No. F-2026-10", { x: 50, y: 766, size: 11, font: reg, color: rgb(0.75, 0.75, 0.72) });
  const form = doc.getForm(), box = { borderColor: rgb(0.8, 0.8, 0.78), borderWidth: 1, backgroundColor: rgb(0.98, 0.98, 0.97) };
  for (const [label, id, y] of [["Full name", "name", 660], ["Email", "email", 590]]) {
    page.drawText(label.toUpperCase(), { x: 50, y: y + 37, size: 9, font: bold, color: GREY });
    const tf = form.createTextField(id);
    tf.addToPage(page, { x: 50, y, width: 495, height: 28, ...box });
    tf.setFontSize(13);
  }
  page.drawText("PLAN", { x: 50, y: 557, size: 9, font: bold, color: GREY });
  const dd = form.createDropdown("plan");
  dd.addOptions(["Standard", "Premium", "Team"]);
  dd.addToPage(page, { x: 50, y: 520, width: 220, height: 28, ...box });
  dd.setFontSize(13);
  form.createCheckBox("agree").addToPage(page, { x: 50, y: 470, width: 16, height: 16, borderColor: rgb(0.5, 0.5, 0.48), borderWidth: 1 });
  page.drawText("I agree to the workshop terms and privacy policy.", { x: 76, y: 474, size: 11, font: reg, color: INK });
  page.drawLine({ start: { x: 50, y: 430 }, end: { x: 545, y: 430 }, thickness: 0.6, color: rgb(0.85, 0.85, 0.83) });
  ["1. Seats are confirmed after the organiser approves this form.", "2. Bring a laptop with a modern browser installed.", "3. Materials are provided as PDF and shared online."]
    .forEach((t, i) => page.drawText(t, { x: 50, y: 400 - i * 20, size: 10.5, font: reg, color: rgb(0.35, 0.35, 0.33) }));
  page.drawText("ORGANISER APPROVAL", { x: 330, y: 228, size: 9, font: bold, color: GREY });
  page.drawRectangle({ x: 330, y: 110, width: 215, height: 110, borderColor: rgb(0.8, 0.8, 0.78), borderWidth: 1, borderDashArray: [4, 3] });
  page.drawText("Generated as a sample template for the pdf-lib demo.", { x: 50, y: 50, size: 8.5, font: reg, color: rgb(0.6, 0.6, 0.58) });
  return doc.save();
}
async function fillForm(template, v) {
  const doc = await PDFDocument.load(template);
  const form = doc.getForm(), page = doc.getPage(0), bold = await doc.embedFont(StandardFonts.HelveticaBold);
  form.getTextField("name").setText(ascii(v.name));
  form.getTextField("email").setText(ascii(v.email));
  form.getDropdown("plan").select(v.plan);
  v.agree ? form.getCheckBox("agree").check() : form.getCheckBox("agree").uncheck();
  if (v.mark) page.drawText("SAMPLE", { x: 120, y: 250, size: 110, font: bold, color: BLUE, opacity: 0.1, rotate: degrees(35) });
  if (v.stamp) {
    const ox = 352, oy = 128, a = degrees(8), t = (8 * Math.PI) / 180;
    const at = (lx, ly) => ({ x: ox + lx * Math.cos(t) - ly * Math.sin(t), y: oy + lx * Math.sin(t) + ly * Math.cos(t) });
    page.drawRectangle({ x: ox, y: oy, width: 168, height: 64, borderColor: PINK, borderWidth: 3, rotate: a, borderOpacity: 0.9 });
    page.drawRectangle({ ...at(5, 5), width: 158, height: 54, borderColor: PINK, borderWidth: 1, rotate: a, borderOpacity: 0.9 });
    page.drawText("APPROVED", { ...at(20, 30), size: 25, font: bold, color: PINK, rotate: a, opacity: 0.92 });
    page.drawText("JS ATLAS  2026-10-11", { ...at(30, 14), size: 9.5, font: bold, color: PINK, rotate: a, opacity: 0.92 });
  }
  if (v.flat) form.flatten();
  return doc.save();
}
async function readFields(bytes) {
  const form = (await PDFDocument.load(bytes)).getForm();
  return form.getFields().map((f) => {
    const name = f.getName();
    if (f instanceof PDFTextField) return [name, "文字欄", f.getText() ?? ""];
    if (f instanceof PDFDropdown) return [name, "下拉", f.getSelected().join(", ")];
    if (f instanceof PDFCheckBox) return [name, "核取", f.isChecked() ? "已勾選" : "未勾選"];
    return [name, "其他", ""];
  });
}

// ---------- scene 2: from scratch ----------
const SIZES = { "A4": PageSizes.A4, "Letter": PageSizes.Letter, "A5": PageSizes.A5, "正方形 500": [500, 500] };
const SAMPLE_TXT = {
  Symbol: "αβγδ ∑ √ ∞ ≈", ZapfDingbats: "✈ ✉ ✓ ✗ ★ ❤",
};
const SVG_HEART = "M 0 -8 C -6 -20 -26 -14 -20 2 C -16 12 -4 18 0 26 C 4 18 16 12 20 2 C 26 -14 6 -20 0 -8 Z";
async function makeScratch({ size, align, title, box }) {
  const doc = await PDFDocument.create();
  const [W, H] = SIZES[size];
  const page = doc.addPage([W, H]);
  const fonts = {};
  for (const k of Object.keys(StandardFonts)) fonts[k] = await doc.embedFont(StandardFonts[k]);
  const s = Math.min(W, H) / 595, m = 40 * s;
  page.drawRectangle({ x: 0, y: H - 70 * s, width: W, height: 70 * s, color: INK });
  const text = "Hello, pdf-lib", tw = fonts.HelveticaBold.widthOfTextAtSize(text, title), th = fonts.HelveticaBold.heightAtSize(title);
  const tx = align === "left" ? m : align === "center" ? (W - tw) / 2 : W - m - tw, ty = H - 70 * s - 20 * s - th;
  page.drawText(text, { x: tx, y: ty, size: title, font: fonts.HelveticaBold, color: INK });
  if (box) {
    const asc = fonts.HelveticaBold.heightAtSize(title, { descender: false });
    page.drawRectangle({ x: tx, y: ty - (th - asc), width: tw, height: th, borderColor: PINK, borderWidth: 0.8, borderDashArray: [3, 2] });
    page.drawText(`widthOfTextAtSize = ${tw.toFixed(1)} pt`, { x: tx, y: ty - (th - asc) - 11 * s, size: 9 * s, font: fonts.Courier, color: PINK });
  }
  page.drawText("Created in the browser. No server, no template file.", { x: m, y: H - 46 * s, size: 12 * s, font: fonts.Helvetica, color: rgb(1, 1, 1) });
  let y = ty - 34 * s;
  page.drawText("drawText() can wrap a paragraph with maxWidth and lineHeight. The 14 standard fonts are built into every PDF reader, so they add almost nothing to the file size.",
    { x: m, y, size: 13 * s, font: fonts.TimesRoman, maxWidth: W - 2 * m, lineHeight: 18 * s, color: rgb(0.25, 0.25, 0.23) });
  y -= 70 * s;
  const keys = Object.keys(StandardFonts), colW = (W - 2 * m) / 2, rowH = 24 * s;
  keys.forEach((k, i) => {
    const x = m + (i % 2) * colW, yy = y - Math.floor(i / 2) * rowH;
    page.drawText(SAMPLE_TXT[k] ?? k, { x, y: yy, size: 15 * s, font: fonts[k], color: INK });
    if (SAMPLE_TXT[k]) page.drawText(k, { x: x + fonts[k].widthOfTextAtSize(SAMPLE_TXT[k], 15 * s) + 8, y: yy, size: 9 * s, font: fonts.Helvetica, color: GREY });
  });
  y -= 7 * rowH + 60 * s;
  const cx = (k) => m + (k + 0.5) * (W - 2 * m) / 5;
  page.drawCircle({ x: cx(0), y, size: 30 * s, color: PINK, borderColor: INK, borderWidth: 1 });
  page.drawEllipse({ x: cx(1), y, xScale: 36 * s, yScale: 20 * s, color: BLUE, opacity: 0.8 });
  page.drawRectangle({ x: cx(2) - 26 * s, y: y - 26 * s, width: 52 * s, height: 52 * s, color: rgb(0.97, 0.87, 0.12), rotate: degrees(15), borderColor: INK, borderWidth: 1 });
  page.drawSvgPath(SVG_HEART, { x: cx(3), y: y + 6 * s, scale: 1.4 * s, color: PINK, borderColor: INK, borderWidth: 1 });
  page.drawLine({ start: { x: cx(4) - 30 * s, y: y - 26 * s }, end: { x: cx(4) + 30 * s, y: y + 26 * s }, thickness: 3, color: INK, dashArray: [6, 4] });
  ["drawCircle", "drawEllipse", "drawRectangle", "drawSvgPath", "drawLine"].forEach((t, k) => {
    const w = fonts.Courier.widthOfTextAtSize(t, 9 * s);
    page.drawText(t, { x: cx(k) - w / 2, y: y - 50 * s, size: 9 * s, font: fonts.Courier, color: GREY });
  });
  return { bytes: await doc.save(), fonts: keys.length };
}

// ---------- scene 3: an existing PDF ----------
let sampleCache = null;
async function sampleBytes() {
  if (!sampleCache) sampleCache = fetch(SAMPLE).then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); }).catch((e) => { sampleCache = null; throw e; });
  return sampleCache;
}
async function modify(src, { mark, opacity, num, band }) {
  const doc = await PDFDocument.load(src);
  const font = await doc.embedFont(StandardFonts.HelveticaBold), reg = await doc.embedFont(StandardFonts.Helvetica);
  const pages = doc.getPages(), N = pages.length;
  pages.forEach((p, i) => {
    const { width: W, height: H } = p.getSize();
    if (mark) {
      const size = Math.min(W, H) / (mark.length * 0.62), w = font.widthOfTextAtSize(mark, size), a = Math.atan2(H, W);
      p.drawText(mark, { x: W / 2 - (w / 2) * Math.cos(a) + (size / 3) * Math.sin(a), y: H / 2 - (w / 2) * Math.sin(a) - (size / 3) * Math.cos(a), size, font, color: PINK, opacity, rotate: degrees((a * 180) / Math.PI) });
    }
    if (band) {
      p.drawRectangle({ x: 0, y: H - 22, width: W, height: 22, color: INK, opacity: 0.9 });
      p.drawText("REVIEWED COPY  /  JS Tools Atlas  /  2026-10-11", { x: 14, y: H - 15, size: 9, font, color: rgb(1, 1, 1) });
    }
    if (num) {
      const t = `${i + 1} / ${N}`, w = reg.widthOfTextAtSize(t, 10);
      const x = num === "right" ? W - 36 - w : (W - w) / 2;
      p.drawRectangle({ x: x - 6, y: 14, width: w + 12, height: 18, color: rgb(1, 1, 1), borderColor: GREY, borderWidth: 0.6 });
      p.drawText(t, { x, y: 19, size: 10, font: reg, color: INK });
    }
  });
  return doc.save();
}

// ---------- scene 4: merge / split ----------
async function makeSource(letter, n, color) {
  const doc = await PDFDocument.create(), font = await doc.embedFont(StandardFonts.HelveticaBold);
  for (let i = 1; i <= n; i++) {
    const p = doc.addPage(PageSizes.A5), [W, H] = PageSizes.A5;
    p.drawRectangle({ x: 0, y: H - 60, width: W, height: 60, color });
    p.drawText(`Document ${letter}`, { x: 24, y: H - 38, size: 16, font, color: rgb(1, 1, 1) });
    p.drawText(`${letter}${i}`, { x: W / 2 - font.widthOfTextAtSize(`${letter}${i}`, 120) / 2, y: H / 2 - 50, size: 120, font, color });
    p.drawText(`page ${i} of ${n}`, { x: 24, y: 24, size: 12, font, color: GREY });
  }
  return doc.save();
}
const MERGE_MODES = ["A + B", "交錯 A1 B1 A2…", "拆出 B 的偶數頁", "插入並刪除", "4 合 1"];
async function merge(aBytes, bBytes, mode) {
  const A = await PDFDocument.load(aBytes), B = await PDFDocument.load(bBytes), out = await PDFDocument.create();
  const ia = A.getPageIndices(), ib = B.getPageIndices();
  if (mode === 0) { (await out.copyPages(A, ia)).forEach((p) => out.addPage(p)); (await out.copyPages(B, ib)).forEach((p) => out.addPage(p)); }
  if (mode === 1) {
    const pa = await out.copyPages(A, ia), pb = await out.copyPages(B, ib);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) { if (pa[i]) out.addPage(pa[i]); if (pb[i]) out.addPage(pb[i]); }
  }
  if (mode === 2) (await out.copyPages(B, ib.filter((i) => i % 2 === 1))).forEach((p) => out.addPage(p));
  if (mode === 3) {
    // Edit A in place: insert B1 after A1, then remove A3.
    const [b1] = await A.copyPages(B, [0]);
    A.insertPage(1, b1); A.removePage(3);
    return A.save();
  }
  if (mode === 4) {
    // embedPages() only accepts pages that share one parent document, so embed A and B separately.
    const emb = [...(await out.embedPages(A.getPages())), ...(await out.embedPages(B.getPages()))], [W, H] = PageSizes.A4;
    for (let i = 0; i < emb.length; i += 4) {
      const sheet = out.addPage([W, H]);
      emb.slice(i, i + 4).forEach((e, k) => {
        const cw = W / 2 - 30, ch = H / 2 - 30, s = Math.min(cw / e.width, ch / e.height);
        const x = 20 + (k % 2) * (W / 2) + (cw - e.width * s) / 2, y = H / 2 + 10 - Math.floor(k / 2) * (H / 2) + (ch - e.height * s) / 2;
        sheet.drawPage(e, { x, y, xScale: s, yScale: s });
        sheet.drawRectangle({ x, y, width: e.width * s, height: e.height * s, borderColor: GREY, borderWidth: 0.5 });
      });
    }
  }
  return out.save();
}

// ---------- scene 5: images ----------
function photoCanvas(w = 640, hgt = 400) {
  const c = h("canvas", { width: w, height: hgt }), g = c.getContext("2d");

          .map(([k, val]) => h("tr", {}, h("td", { text: k }), h("td", { text: String(val ?? "") }))));
        const plain = (await make(false)).length;
        ctx.$(".pl-save").replaceChildren(h("tr", {}, h("td", { text: "useObjectStreams: true（預設）" }), h("td", { class: "r", text: `${fmt(bytes.length)} B` })),
          h("tr", {}, h("td", { text: "useObjectStreams: false" }), h("td", { class: "r", text: `${fmt(plain)} B` })));
      }
      ctx.on(ctx.$("#pl-title"), "input", debounce(ctx, build, 200));
      ctx.onResize(debounce(ctx, build));
      await build();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "for (n) { PDFDocument.load(invoice) → copyPages → addPage } → save()",
    desc: "模擬把 n 份單頁帳單合併成一份：每份都重新 load，再 copyPages 進目標文件，最後 save()。量的是載入、複製與序列化的總時間與輸出大小；完成後在計時之外交給 pdf.js 讀回頁數並畫出最後一頁。",
    hint: "按「開始測試」；右側顯示最近一份合併檔的最後一頁",
    async mount(ctx) {
      ctx.html(`<div class="pl-stress"><div class="pl-view"></div><div class="pl-check">尚未產生</div></div>`);
      const view = ctx.$(".pl-view"), check = ctx.$(".pl-check"), pv = previewer(ctx, view);
      const SRC = [];
      for (let k = 0; k < 4; k++) SRC.push(await invoice(k));
      let verify = Promise.resolve();
      ctx.bench({
        label: "合併檔案數", unit: "份", sizes: [10, 50, 200, 500, 1000, 2000], target: 1000, budget: 4000,
        async prepare() { await verify; },
        async run(n) {
          const out = await PDFDocument.create();
          for (let i = 0; i < n; i++) {
            const src = await PDFDocument.load(SRC[i % 4], { parseSpeed: ParseSpeeds.Fastest });
            const [p] = await out.copyPages(src, [0]);
            out.addPage(p);
          }
          const t0 = performance.now(), bytes = await out.save({ objectsPerTick: Infinity }), saveMs = performance.now() - t0;
          verify = pv.show(bytes, n).then((r) => {
            if (r) check.innerHTML = `最近一份：<b>${fmt(n)}</b> 份合併・<b>${kb(bytes.length)}</b>・pdf.js 讀回 <b>${fmt(r.pdf.numPages)}</b> 頁，下圖為第 ${fmt(n)} 頁`;
          });
          return `${kb(bytes.length)}・save ${saveMs.toFixed(0)} ms`;
        },
        note: "每份來源檔都重新解析一次，字型等資源也各複製一份，所以大小隨份數線性成長。load 與 save 都關掉分段讓出主執行緒（parseSpeed Fastest、objectsPerTick Infinity），量到的是純計算時間，執行時畫面會停頓。",
      });
      ctx.controls.classList.add("bottom");
    },
  },
] });
</script>
</body>
</html>
