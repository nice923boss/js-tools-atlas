<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdf-lib 示範：PDF 表單填寫與蓋章</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"PDF 標準字型只支援英數字，表單內容以英文示範"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 280px 1fr; }
  .form { padding: 16px 18px 56px; border-right: 1px solid var(--line); background: var(--bg-2); overflow-y: auto; }
  .form h1 { font-size: 17px; margin: 0 0 2px; }
  .form h1 b { color: var(--c3); }
  .sub { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
  label.l { display: block; font-size: 12px; color: var(--muted); margin: 9px 0 4px; }
  .field { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); outline: none; }
  .field:focus { border-color: var(--c3); }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 10px; font-size: 13px; }
  .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .checks input { accent-color: var(--c3); }
  .warn { color: var(--c3); font-size: 12px; min-height: 18px; margin-top: 6px; }
  .actions { display: flex; gap: 8px; margin-top: 6px; }
  .actions .btn { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: transparent; padding: 7px 12px; font: 500 13px var(--font); cursor: pointer; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg-2); }
  .preview { position: relative; display: grid; place-items: center; padding: 54px 16px 16px; min-width: 0; min-height: 0;
    background: repeating-linear-gradient(-45deg, #ecebe6 0 10px, #e6e4de 10px 20px); }
  .preview canvas { max-width: 100%; max-height: 100%; box-shadow: 0 12px 36px rgba(0,0,0,.22); background: #fff; }
  .top { position: absolute; left: 12px; right: 12px; top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
  .meta { font: 12px var(--mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }
  @media (max-width: 640px) {
    /* stacked layout scrolls under the fixed hint; the form labels already explain the controls */
    .hint { display: none; }
    .app { grid-template-columns: 1fr; grid-template-rows: 52% 48%; }
    .preview { grid-row: 1; padding: 46px 10px 10px; }
    .form { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding: 10px 14px 56px; }
    .form h1, .sub { display: none; }
    .meta { display: none; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="form">
    <h1><b>pdf-lib</b> 表單填寫</h1>
    <p class="sub">讀入既有報名表 PDF，填欄位、蓋章、加浮水印後輸出</p>
    <label class="l" for="name">姓名（英文）</label>
    <input class="field" id="name" value="Lin Yi-Chun" maxlength="40">
    <label class="l" for="email">Email</label>
    <input class="field" id="email" value="yichun@example.com" maxlength="60">
    <label class="l" for="plan">方案（PDF 下拉欄位）</label>
    <select class="field" id="plan">
      <option value="Standard">Standard</option>
      <option value="Premium" selected>Premium</option>
      <option value="Team">Team</option>
    </select>
    <div class="checks">
      <label><input type="checkbox" id="agree" checked>勾選同意</label>
      <label><input type="checkbox" id="stamp" checked>核准章</label>
      <label><input type="checkbox" id="mark" checked>浮水印</label>
      <label><input type="checkbox" id="flat">攤平表單</label>
    </div>
    <div class="warn" id="warn"></div>
    <div class="actions">
      <button class="btn primary" id="download">下載 PDF</button>
    </div>
  </div>
  <div class="preview">
    <div class="top">
      <div class="seg" role="group" aria-label="預覽版本">
        <button id="showOrig" aria-pressed="false">原始表單</button>
        <button id="showFilled" aria-pressed="true">填寫後</button>
      </div>
      <span class="meta" id="meta">處理中…</span>
    </div>
    <canvas id="view"></canvas>
  </div>
</div>
<div class="hint">修改左側欄位，pdf-lib 會改寫 PDF 並即時預覽</div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script type="module">
// Preview renderer only: PDF.js draws the bytes produced by pdf-lib.
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs";
const worker = new pdfjsLib.PDFWorker(); // shared across re-renders

const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
const $ = (id) => document.getElementById(id);
const INK = rgb(0.11, 0.11, 0.1);
const PINK = rgb(0.84, 0.12, 0.41);
let templateBytes = null, filledBytes = null, showFilled = true;

// Step 1: an "existing" registration form with AcroForm fields (stands in for a file you received).
async function buildTemplate() {
  const doc = await PDFDocument.create();
  doc.setTitle("Workshop Registration Form");
  const page = doc.addPage([595, 842]);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const reg = await doc.embedFont(StandardFonts.Helvetica);
  page.drawRectangle({ x: 0, y: 742, width: 595, height: 100, color: rgb(0.11, 0.11, 0.1) });
  page.drawRectangle({ x: 0, y: 736, width: 595, height: 6, color: rgb(0.97, 0.87, 0.12) });
  page.drawText("WORKSHOP REGISTRATION", { x: 50, y: 790, size: 26, font: bold, color: rgb(1, 1, 1) });
  page.drawText("JS Tools Atlas  /  Taipei  /  Form No. F-2026-10", { x: 50, y: 766, size: 11, font: reg, color: rgb(0.75, 0.75, 0.72) });
  const form = doc.getForm();
  const rows = [["Full name", "name", 660], ["Email", "email", 590]];
  for (const [label, id, y] of rows) {
    page.drawText(label.toUpperCase(), { x: 50, y: y + 37, size: 9, font: bold, color: rgb(0.45, 0.45, 0.42) });
    const tf = form.createTextField(id);
    tf.addToPage(page, { x: 50, y, width: 495, height: 28, borderColor: rgb(0.8, 0.8, 0.78), borderWidth: 1, backgroundColor: rgb(0.98, 0.98, 0.97) });
    tf.setFontSize(13);
  }
  page.drawText("PLAN", { x: 50, y: 557, size: 9, font: bold, color: rgb(0.45, 0.45, 0.42) });
  const dd = form.createDropdown("plan");
  dd.addOptions(["Standard", "Premium", "Team"]);
  dd.addToPage(page, { x: 50, y: 520, width: 220, height: 28, borderColor: rgb(0.8, 0.8, 0.78), borderWidth: 1, backgroundColor: rgb(0.98, 0.98, 0.97) });
  dd.setFontSize(13);
  const cb = form.createCheckBox("agree");
  cb.addToPage(page, { x: 50, y: 470, width: 16, height: 16, borderColor: rgb(0.5, 0.5, 0.48), borderWidth: 1 });
  page.drawText("I agree to the workshop terms and privacy policy.", { x: 76, y: 474, size: 11, font: reg, color: INK });
  page.drawLine({ start: { x: 50, y: 430 }, end: { x: 545, y: 430 }, thickness: 0.6, color: rgb(0.85, 0.85, 0.83) });
  const terms = [
    "1. Seats are confirmed after the organiser approves this form.",
    "2. Bring a laptop with a modern browser installed.",
    "3. Materials are provided as PDF and shared online.",
  ];
  terms.forEach((t, i) => page.drawText(t, { x: 50, y: 400 - i * 20, size: 10.5, font: reg, color: rgb(0.35, 0.35, 0.33) }));
  page.drawText("ORGANISER APPROVAL", { x: 330, y: 228, size: 9, font: bold, color: rgb(0.45, 0.45, 0.42) });
  page.drawRectangle({ x: 330, y: 110, width: 215, height: 110, borderColor: rgb(0.8, 0.8, 0.78), borderWidth: 1, borderDashArray: [4, 3] });
  page.drawText("Generated as a sample template for the pdf-lib demo.", { x: 50, y: 50, size: 8.5, font: reg, color: rgb(0.6, 0.6, 0.58) });
  return doc.save();
}

const ascii = (s) => s.replace(/[^\x20-\x7E]/g, "");

// Step 2: load the existing bytes, fill fields, stamp, watermark, save.
async function fill() {
  const doc = await PDFDocument.load(templateBytes);
  const form = doc.getForm();
  const page = doc.getPage(0);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const rawName = $("name").value, rawEmail = $("email").value;
  $("warn").textContent = /[^\x20-\x7E]/.test(rawName + rawEmail) ? "標準字型無法顯示中文，非英數字已略過" : "";
  form.getTextField("name").setText(ascii(rawName));
  form.getTextField("email").setText(ascii(rawEmail));
  form.getDropdown("plan").select($("plan").value);
  const cb = form.getCheckBox("agree");
  $("agree").checked ? cb.check() : cb.uncheck();

  if ($("mark").checked) {
    page.drawText("SAMPLE", { x: 120, y: 250, size: 110, font: bold, color: rgb(0.12, 0.56, 0.72), opacity: 0.1, rotate: degrees(35) });
  }
  if ($("stamp").checked) {
    // Rotate a little group of shapes around one origin
    const ox = 352, oy = 128, a = degrees(8), t = (8 * Math.PI) / 180;
    const at = (lx, ly) => ({ x: ox + lx * Math.cos(t) - ly * Math.sin(t), y: oy + lx * Math.sin(t) + ly * Math.cos(t) });
    page.drawRectangle({ x: ox, y: oy, width: 168, height: 64, borderColor: PINK, borderWidth: 3, rotate: a, opacity: 0.9, borderOpacity: 0.9 });
    page.drawRectangle({ ...at(5, 5), width: 158, height: 54, borderColor: PINK, borderWidth: 1, rotate: a, borderOpacity: 0.9 });
    page.drawText("APPROVED", { ...at(20, 30), size: 25, font: bold, color: PINK, rotate: a, opacity: 0.92 });
    const d = new Date().toLocaleDateString("sv-SE");
    page.drawText(`JS ATLAS  ${d}`, { ...at(30, 14), size: 9.5, font: bold, color: PINK, rotate: a, opacity: 0.92 });
  }
  if ($("flat").checked) form.flatten();
  return doc.save();
}

let renderTask = null;
async function show() {
  const bytes = showFilled ? filledBytes : templateBytes;
  const task = pdfjsLib.getDocument({ data: bytes.slice(), worker });
  const pdf = await task.promise;
  const page = await pdf.getPage(1);
  const box = document.querySelector(".preview");
  const base = page.getViewport({ scale: 1 });
  const cs = getComputedStyle(box);
  const availW = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const availH = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const fit = Math.max(0.15, Math.min(availW / base.width, availH / base.height));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const vp = page.getViewport({ scale: fit * dpr });
  if (renderTask) renderTask.cancel();
  const off = document.createElement("canvas");
  off.width = vp.width;
  off.height = vp.height;
  renderTask = page.render({ canvas: off, viewport: vp });
  try { await renderTask.promise; } catch (e) { task.destroy(); if (e?.name === "RenderingCancelledException") return; throw e; }
  const view = $("view");
  view.width = off.width;
  view.height = off.height;
  view.getContext("2d").drawImage(off, 0, 0);
  view.style.width = `${vp.width / dpr}px`;
  view.style.height = `${vp.height / dpr}px`;
  task.destroy();
}

async function update() {
  filledBytes = await fill();
  const kb = (n) => (n / 1024).toFixed(1);
  $("meta").textContent = `原始 ${kb(templateBytes.length)} KB → 輸出 ${kb(filledBytes.length)} KB`;
  await show();
}

function setView(filled) {
  showFilled = filled;
  $("showFilled").setAttribute("aria-pressed", filled);
  $("showOrig").setAttribute("aria-pressed", !filled);
  show();
}

let timer;
const schedule = () => { clearTimeout(timer); timer = setTimeout(() => { setView(true); update(); }, 180); };
["name", "email", "plan", "agree", "stamp", "mark", "flat"].forEach((id) => $(id).addEventListener("input", schedule));
$("showOrig").addEventListener("click", () => setView(false));
$("showFilled").addEventListener("click", () => setView(true));
window.addEventListener("resize", () => { clearTimeout(timer); timer = setTimeout(show, 150); });
$("download").addEventListener("click", () => {
  const url = URL.createObjectURL(new Blob([filledBytes], { type: "application/pdf" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: "registration-filled.pdf" });
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

templateBytes = await buildTemplate();
await update();
</script>
</body>
</html>
