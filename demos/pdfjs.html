<style>

<script type="module">
// PDF.js showcase: parsing and rendering PDFs in the page, from a reader to a render-throughput benchmark.
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs";

const BASE = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/";
const SAMPLE = "https://cdn.jsdelivr.net/gh/mozilla/pdf.js@v6.3.289/web/compressed.tracemonkey-pldi-09.pdf";
pdfjsLib.GlobalWorkerOptions.workerSrc = BASE + "build/pdf.worker.min.mjs";
const worker = new pdfjsLib.PDFWorker(); // one worker thread shared by every scene
const { h } = Showcase;
const hh = (tag, cls, html) => Object.assign(h(tag, { class: cls }), { innerHTML: html });
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff", "#ff6b6b", "#38d9a9"];

// ---------- a small PDF written by hand: links, form fields, outline, page labels, Info ----------
const esc = (s) => s.replace(/[\\()]/g, (c) => "\\" + c);
// ASCII stays a literal string; anything else becomes UTF-16BE hex with a BOM (PDF text string).
const pstr = (s) => /^[\x20-\x7e]*$/.test(s) ? `(${esc(s)})`
  : "<FEFF" + [...s].map((c) => { const u = c.codePointAt(0); return u > 0xffff ? String.fromCharCode(...[0xd800 + ((u - 0x10000) >> 10), 0xdc00 + ((u - 0x10000) & 1023)]).split("").map((x) => x.charCodeAt(0).toString(16).padStart(4, "0")).join("") : u.toString(16).padStart(4, "0"); }).join("").toUpperCase() + ">";
const txt = (x, y, size, s, { bold = false, rgb = "0.1 0.1 0.1" } = {}) => `BT /${bold ? "F2" : "F1"} ${size} Tf ${rgb} rg ${x} ${y} Td (${esc(s)}) Tj ET`;

function buildSamplePdf() {
  const o = {};
  const stream = (dict, data) => `<< ${dict} /Length ${data.length} >>\nstream\n${data}\nendstream`;
  const page = (contents, annots) => `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 420 560] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents ${contents} 0 R /Annots [${annots.map((n) => n + " 0 R").join(" ")}] >>`;
  const band = (title, sub) => [
    "0.07 0.09 0.12 rg 0 476 420 84 re f", "0.97 0.87 0.12 rg 0 472 420 4 re f",
    txt(32, 520, 22, title, { bold: true, rgb: "1 1 1" }), txt(32, 498, 10.5, sub, { rgb: "0.75 0.75 0.75" }),
  ];
  const para = (y, lines) => lines.map((l, i) => txt(32, y - i * 16, 10.5, l, { rgb: "0.3 0.3 0.3" }));
  const link = (rect, action) => `<< /Type /Annot /Subtype /Link /Rect [${rect.join(" ")}] /Border [0 0 0] ${action} >>`;
  const widget = (rect, extra) => `<< /Type /Annot /Subtype /Widget /F 4 /P 9 0 R /Rect [${rect.join(" ")}] /DA (/Helv 11 Tf 0 g) /MK << /BC [0.55 0.55 0.6] /BG [1 1 1] >> ${extra} >>`;

  o[1] = "<< /Type /Catalog /Pages 2 0 R /Outlines 3 0 R /PageMode /UseOutlines /AcroForm 7 0 R /PageLabels << /Nums [0 << /S /r >> 1 << /S /D /P (A-) >>] >> >>";
  o[2] = "<< /Type /Pages /Kids [8 0 R 9 0 R 10 0 R] /Count 3 >>";
  o[3] = "<< /Type /Outlines /First 24 0 R /Last 26 0 R /Count 4 >>";
  o[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  o[5] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  o[6] = `<< /Title ${pstr("PDF.js 連結與表單範例")} /Author (JS Tools Atlas) /Subject ${pstr("頁面內即時產生的示範文件")} /Keywords (pdf.js, annotation, outline, AcroForm) /Creator (hand-written PDF objects) /Producer (js-tools-atlas demo) /CreationDate (D:20261003090000+08'00') /ModDate (D:20261011120000+08'00') >>`;
  o[7] = "<< /Fields [19 0 R 20 0 R 21 0 R] /DA (/Helv 0 Tf 0 g) /DR << /Font << /Helv 4 0 R >> >> /NeedAppearances true >>";
  o[8] = page(11, [14, 15, 16]);
  o[9] = page(12, [19, 20, 21, 17]);
  o[10] = page(13, [18]);
  o[11] = stream("", [
    ...band("PDF.js Sample Document", "Generated in this page: links, form fields, outline, page labels"),
    txt(32, 430, 14, "Contents", { bold: true }),
    txt(32, 402, 12, "1.  Form fields  . . . . . . . . . . . . . . . .  page A-1", { rgb: "0.12 0.45 0.75" }),
    txt(32, 378, 12, "2.  Notes and license  . . . . . . . . . . . .  page A-2", { rgb: "0.12 0.45 0.75" }),
    txt(32, 334, 12, "Open the PDF.js project site", { rgb: "0.84 0.12 0.41" }),
    "0.84 0.12 0.41 RG 0.8 w 32 330 m 196 330 l S",
    ...para(290, ["Every blue line above is a GoTo link annotation that", "points at another page. The pink line is a URI link.", "PDF.js turns both into real <a> elements through", "AnnotationLayer, so they keep working after zoom."]),
    "0.9 0.9 0.9 RG 1 w 32 150 356 1 re S", txt(32, 128, 9, "Page label: i   (roman numerals via /PageLabels)", { rgb: "0.5 0.5 0.5" }),
  ].join("\n"));
  o[12] = stream("", [
    ...band("Form Fields", "AcroForm widgets: text, combo box, check box"),
    txt(40, 426, 12, "Name", { bold: true }), txt(40, 386, 12, "Plan", { bold: true }), txt(40, 346, 12, "I agree", { bold: true }),
    ...para(290, ["With renderForms: true these widgets become HTML", "<input> and <select> elements. Edited values go to", "doc.annotationStorage and saveDocument() writes", "them back into a new PDF file."]),
    txt(32, 120, 11, "<  Back to contents", { rgb: "0.12 0.45 0.75" }),
  ].join("\n"));
  o[13] = stream("", [
    ...band("Notes", "Outline items point at this page and at the License section"),
    ...para(430, ["This file is assembled by a few lines of JavaScript:", "every object is a string, then a cross-reference", "table records the byte offset of each object."]),
    txt(32, 330, 14, "License", { bold: true }),
    ...para(306, ["The TraceMonkey paper used in other scenes is the", "official PDF.js sample file. This document is", "generated on the fly and contains no external assets."]),
    txt(32, 120, 11, "<  Back to contents", { rgb: "0.12 0.45 0.75" }),
  ].join("\n"));
  o[14] = link([28, 324, 200, 348], "/A << /S /URI /URI (https://mozilla.github.io/pdf.js/) >>");
  o[15] = link([28, 396, 392, 416], "/Dest [9 0 R /Fit]");
  o[16] = link([28, 372, 392, 392], "/Dest [10 0 R /Fit]");
  o[17] = link([28, 114, 160, 134], "/Dest [8 0 R /Fit]");
  o[18] = link([28, 114, 160, 134], "/Dest [8 0 R /Fit]");
  o[19] = widget([130, 418, 380, 442], "/FT /Tx /T (name) /TU (Your name) /V (Lin Yi-Chun)");
  o[20] = widget([130, 378, 380, 402], "/FT /Ch /Ff 131072 /T (plan) /Opt [(Standard) (Premium) (Team)] /V (Premium)");
  o[21] = widget([130, 338, 150, 358], "/FT /Btn /T (agree) /V /Yes /AS /Yes /AP << /N << /Yes 22 0 R /Off 23 0 R >> >>");
  o[22] = stream("/Type /XObject /Subtype /Form /BBox [0 0 20 20]", "0.12 0.45 0.75 rg 4 4 12 12 re f");
  o[23] = stream("/Type /XObject /Subtype /Form /BBox [0 0 20 20]", "");
  o[24] = `<< /Title ${pstr("封面與目錄")} /Parent 3 0 R /Next 25 0 R /Dest [8 0 R /Fit] >>`;
  o[25] = `<< /Title ${pstr("表單欄位")} /Parent 3 0 R /Prev 24 0 R /Next 26 0 R /Dest [9 0 R /Fit] >>`;
  o[26] = `<< /Title ${pstr("附註")} /Parent 3 0 R /Prev 25 0 R /First 27 0 R /Last 27 0 R /Count 1 /Dest [10 0 R /Fit] >>`;
  o[27] = `<< /Title ${pstr("授權說明")} /Parent 26 0 R /Dest [10 0 R /XYZ 0 350 null] >>`;

  const n = Object.keys(o).length;
  let out = "%PDF-1.7\n";
  const offsets = [];
  for (let i = 1; i <= n; i++) { offsets.push(out.length); out += `${i} 0 obj\n${o[i]}\nendobj\n`; }
  const xref = out.length;
  out += `xref\n0 ${n + 1}\n0000000000 65535 f \n` + offsets.map((v) => `${String(v).padStart(10, "0")} 00000 n \n`).join("");
  out += `trailer\n<< /Size ${n + 1} /Root 1 0 R /Info 6 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
  return new TextEncoder().encode(out); // every character is ASCII, so offsets equal byte offsets
}

// ---------- shared helpers ----------
let samplePromise = null;
const sampleBytes = () => (samplePromise ??= fetch(SAMPLE).then((r) => {
  if (!r.ok) throw new Error(`範例 PDF 下載失敗（HTTP ${r.status}）`);
  return r.arrayBuffer();
}).catch((e) => { samplePromise = null; throw e; }));

// Open a document for one scene; the loading task (and the document) is destroyed when the scene unmounts.
async function openDoc(ctx, source, extra = {}) {
  const s = ctx.status(source === "sample" ? "下載 TraceMonkey 範例論文…" : "解析 PDF…");
  try {
    const data = source === "sample" ? new Uint8Array((await sampleBytes()).slice(0))
      : source === "built" ? buildSamplePdf() : source;
    const task = pdfjsLib.getDocument({
      data, worker, cMapUrl: BASE + "cmaps/", cMapPacked: true,
      standardFontDataUrl: BASE + "standard_fonts/", wasmUrl: BASE + "wasm/", iccUrl: BASE + "iccs/", ...extra,
    });
    ctx.onCleanup(() => task.destroy());
    const doc = await task.promise;
    s.done();
    return doc;
  } catch (e) {
    s.error(e.message || String(e));
    throw e;
  }
}

// Render a page into a visible canvas through an offscreen canvas (no flicker), honouring devicePixelRatio.
async function paint(page, canvas, vp, { dpr = DPR(), ...opts } = {}) {
  canvas._task?.cancel();
  const off = document.createElement("canvas");
  off.width = Math.max(1, Math.floor(vp.width * dpr));
  off.height = Math.max(1, Math.floor(vp.height * dpr));
  const task = canvas._task = page.render({ canvas: off, viewport: vp, transform: dpr === 1 ? undefined : [dpr, 0, 0, dpr, 0, 0], ...opts });
  try { await task.promise; } catch (e) { if (e?.name === "RenderingCancelledException") return false; throw e; }
  if (canvas._task !== task) return false;
  canvas.width = off.width; canvas.height = off.height;
  canvas.getContext("2d").drawImage(off, 0, 0);
  canvas.style.width = `${vp.width}px`; canvas.style.height = `${vp.height}px`;
  return true;
}

function pageBox(vp, scale) {
  const el = h("div", { class: "pj-page" });
  el.style.width = `${vp.width}px`; el.style.height = `${vp.height}px`;
  el.style.setProperty("--total-scale-factor", scale);
  return el;
}

async function addTextLayer(page, wrap, vp) {
  const div = h("div", { class: "textLayer" });
  wrap.append(div);
  const layer = new pdfjsLib.TextLayer({ textContentSource: page.streamTextContent(), container: div, viewport: vp });
  await layer.render();
  return div;
}

// Minimal link service: AnnotationLayer only needs these members when there is no full viewer.
function makeLinkService(onDest) {
  return {
    eventBus: null, isInPresentationMode: false,
    addLinkAttributes(link, url) { link.href = url; link.target = "_blank"; link.rel = "noopener noreferrer"; },
    getDestinationHash: () => "#",
    getAnchorUrl: (a) => "#" + a,
    goToDestination: (dest) => onDest(dest),
    executeNamedAction() {}, executeSetOCGState() {},
  };
}
async function destPage(doc, dest) {
  const arr = typeof dest === "string" ? await doc.getDestination(dest) : dest;
  if (!Array.isArray(arr)) return null;
  return (typeof arr[0] === "object" ? await doc.getPageIndex(arr[0]) : arr[0]) + 1;
}
const fitScale = (page, w, hgt) => { const b = page.getViewport({ scale: 1 }); return Math.max(0.2, Math.min(w / b.width, hgt ? hgt / b.height : Infinity)); };
const pdfDate = (s) => { const d = s && pdfjsLib.PDFDateString.toDateObject(s); return d ? d.toLocaleString("zh-TW", { hour12: false }) : "（無）"; };

Showcase.run({ scenes: [
  {
    id: "reader", title: "閱讀器",
    api: "getDocument() + page.render({ canvas, viewport, transform }) + new TextLayer()",
    desc: "原本的閱讀器：canvas 畫頁面、TextLayer 疊一層透明文字讓你能選取與搜尋，命中處標黃，左側縮圖角標是每頁命中次數。",
    hint: "拖曳選取文字；改搜尋字詞看命中分布；點縮圖或 ◀ ▶ 換頁",
    async mount(ctx) {
      ctx.html(`<div class="pj-fill pj-reader"><div class="pj-thumbs"></div><div class="pj-view"></div></div><div class="pj-found"></div>`);
      const view = ctx.$(".pj-view"), thumbs = ctx.$(".pj-thumbs"), found = ctx.$(".pj-found");

      await draw();
      thumbs();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "for (n) await (await doc.getPage(i)).render({ canvas, viewport }).promise",
    desc: "連續渲染 N 頁（TraceMonkey 14 頁循環），量總耗時與每頁毫秒數；右側把每次渲染結果拼成馬賽克。像素密度越高，每頁要畫的像素按平方成長。",
    hint: "按「開始測試」；切換 1×／2×／3× 或關閉清快取再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="pj-stress"><canvas></canvas></div>`);
      const mosaic = ctx.$(".pj-stress canvas");
      let k = 1, clear = true;
      ctx.controls.classList.add("bottom");
      ctx.group(["1×", "2×", "3×"], 0, (i) => { k = i + 1; });
      ctx.toggle("每頁後清快取", true, (v) => { clear = v; });
      const doc = await openDoc(ctx, "sample");
      const off = document.createElement("canvas");
      ctx.bench({
        label: "頁數", unit: "頁", sizes: [1, 4, 14, 28, 56, 112], target: 1000, budget: 4000,
        prepare(n) {
          const { width, height } = mosaic.getBoundingClientRect();
          const dpr = DPR();
          mosaic.width = Math.max(1, Math.floor(width * dpr)); mosaic.height = Math.max(1, Math.floor(height * dpr));
          const ratio = 792 / 612;
          let cols = Math.max(1, Math.ceil(Math.sqrt(n * (width / height) * ratio)));
          while (Math.ceil(n / cols) * (mosaic.width / cols) * ratio > mosaic.height && cols < n) cols++;
          const cw = mosaic.width / cols;
          const g = mosaic.getContext("2d");
          g.fillStyle = "#0b0d10"; g.fillRect(0, 0, mosaic.width, mosaic.height);
          return { g, cols, cw, ch: cw * ratio };
        },
        async run(n, { g, cols, cw, ch }) {
          const t0 = performance.now();
          for (let i = 0; i < n; i++) {
            const page = await doc.getPage((i % doc.numPages) + 1);
            const vp = page.getViewport({ scale: k });
            off.width = Math.floor(vp.width); off.height = Math.floor(vp.height);
            await page.render({ canvas: off, viewport: vp }).promise;
            g.drawImage(off, (i % cols) * cw + 1, Math.floor(i / cols) * ch + 1, cw - 2, ch - 2);
            if (clear) page.cleanup();
          }
          return `${((performance.now() - t0) / n).toFixed(0)} ms/頁・${k}×`;
        },
        note: "每頁都在主執行緒把 operator list 畫到 canvas；解析在 Worker。「每頁後清快取」會呼叫 page.cleanup()，下一輪重新向 Worker 取 operator list 與圖片；關掉後同一頁第二次渲染會變快。2×、3× 的像素數是 1× 的 4、9 倍。",
      });
    },
  },
] });
</script>
