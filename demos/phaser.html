<script>
// Phaser showcase: eight scenes from the original star platformer to an Arcade physics stress ramp.
const rootCss = getComputedStyle(document.documentElement);
const cssVar = (name, fallback) => rootCss.getPropertyValue(name).trim() || fallback;
const C = {
  c1: cssVar("--c1", "#f7df1e"), c2: cssVar("--c2", "#4cc9f0"), c3: cssVar("--c3", "#f72585"),
  c4: cssVar("--c4", "#7bd389"), c5: cssVar("--c5", "#ff8c42"), c6: cssVar("--c6", "#9d8cff"),
};
const COLORS = [C.c1, C.c2, C.c3, C.c4, C.c5, C.c6];
const HEXN = COLORS.map((c) => parseInt(c.slice(1), 16));
const FONT = cssVar("--font", "sans-serif");
const MONO = cssVar("--mono", "monospace");
const DPR = Math.min(2, devicePixelRatio || 1);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const fmtN = (n) => n.toLocaleString("en-US");
// Y just below the top-right control cluster, so scene content starts under the buttons.
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;
const PHOTO = (i) => `_shared/img/photo-${i}.jpg`;
const unmounted = () => new DOMException("Scene unmounted", "AbortError");
const hsv = (h, s = 0.65, v = 1) => Phaser.Display.Color.HSVToRGB(((h % 1) + 1) % 1, s, v).color;

function canvas2d(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  return c;
}
// Soft white dot; tinted per sprite or particle. `core` widens the solid centre (brush vs glow).
function glowCanvas(s, core = 0.25) {
  return canvas2d(s, s, (g) => {
    const r = s / 2, grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0, "rgba(255,255,255,1)");
    grd.addColorStop(core, "rgba(255,255,255,0.8)");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
  });
}
// Status line in the bottom-left corner; returns a setter that takes HTML.
function readout(ctx, parent = ctx.el) {
  const el = document.createElement("div");
  el.className = "readout";
  parent.append(el);
  return (html) => { el.innerHTML = html; };
}
// Centred toast; returns a function that shows a line of text for 1.8 s.
function message(ctx) {
  const el = document.createElement("div");
  el.className = "ph-msg";
  ctx.el.append(el);
  let id = 0;
  ctx.onCleanup(() => clearTimeout(id));
  return (text) => {
    el.textContent = text;
    el.classList.add("show");
    clearTimeout(id);
    id = setTimeout(() => el.classList.remove("show"), 1800);
  };
}
function starPoints(cx, cy, r1, r2, n = 5, rot = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = rot + (i * Math.PI) / n;
    pts.push({ x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
  }
  return pts;
}
// Bakes a Graphics drawing into a texture once per game; textures outlive scene restarts.
function bake(scene, key, w, h, draw) {
  if (scene.textures.exists(key)) return;
  const g = scene.make.graphics({}, false);
  draw(g);
  g.generateTexture(key, w, h);
  g.destroy();
}
function canvasTex(scene, key, canvas) {
  if (!scene.textures.exists(key)) scene.textures.addCanvas(key, canvas);
  return scene.textures.get(key);
}
const txt = (scene, x, y, str, size, color = "#c9c7bd", family = FONT) =>
  scene.add.text(x, y, str, { fontFamily: family, fontSize: `${size}px`, color, resolution: DPR });
const fpsOf = (scene) => scene.game.loop.actualFps.toFixed(0);

// Phaser.Game filling `box` with one object-config scene; resolves with the Scene after its first create().
// Per-frame work goes in `this.tick`, which create() sets again on every restart. game.destroy(true) is
// deferred to the next step and DESTROY fires before the renderer is torn down, so the WebGL context
// is released on a later tick.
function phaserIn(ctx, box, scene, config = {}) {
  return new Promise((resolve, reject) => {
    const game = new Phaser.Game({
      type: Phaser.WEBGL, parent: box, transparent: true, banner: false, autoFocus: false,
      scale: { mode: Phaser.Scale.RESIZE, width: "100%", height: "100%" },
      ...config,
      scene: {
        ...scene,
        create(data) {
          this.tick = null;
          if (!ctx.active) return;
          scene.create.call(this, data);
          resolve(this);
        },
        update(time, delta) { if (this.tick) this.tick(time, delta); },
      },
    });
    game.events.once(Phaser.Core.Events.DESTROY, () => {
      const gl = game.renderer && game.renderer.gl;
      if (gl) setTimeout(() => { const ext = gl.getExtension("WEBGL_lose_context"); if (ext) ext.loseContext(); }, 0);
    });
    ctx.onCleanup(() => { reject(unmounted()); game.destroy(true); });
  });
}
// Layout-dependent scenes rebuild once a new size settles.
function restartOnResize(ctx, scene) {
  const w0 = scene.scale.width, h0 = scene.scale.height;
  let id = 0;
  const fn = () => {
    clearTimeout(id);
    id = setTimeout(() => {
      if (ctx.active && (scene.scale.width !== w0 || scene.scale.height !== h0)) scene.scene.restart();
    }, 250);
  };
  scene.scale.on("resize", fn);
  scene.events.once("shutdown", () => { scene.scale.off("resize", fn); clearTimeout(id); });
}

// ---------- textures drawn in code ----------
function platformTextures(scene) {
  bake(scene, "hero", 28, 32, (g) => {
    g.fillStyle(0xf7df1e).fillRoundedRect(0, 0, 28, 32, 8);
    g.fillStyle(0x1a1a14).fillRect(15, 9, 4, 8).fillRect(21, 9, 4, 8);
    g.fillStyle(0xff8c42).fillRect(0, 22, 28, 4);
  });
  bake(scene, "ground", 32, 64, (g) => {
    g.fillStyle(0x262c3a).fillRect(0, 0, 32, 64);
    g.fillStyle(0x30384a).fillRect(4, 22, 6, 6).fillRect(20, 40, 8, 6).fillRect(12, 54, 5, 5);
    g.fillStyle(0x7bd389).fillRect(0, 0, 32, 8);
    g.fillStyle(0x5cb06b).fillRect(0, 8, 32, 3);
  });
  bake(scene, "plat", 32, 18, (g) => {
    g.fillStyle(0x343c50).fillRect(0, 0, 32, 18);
    g.fillStyle(0x4cc9f0).fillRect(0, 0, 32, 5);
    g.fillStyle(0x2a3040).fillRect(31, 0, 1, 18);
  });
  bake(scene, "star", 22, 22, (g) => g.fillStyle(0xf7df1e).fillPoints(starPoints(11, 11, 11, 5), true));
  bake(scene, "slime", 30, 22, (g) => {
    g.fillStyle(0xf72585).fillRoundedRect(0, 0, 30, 22, { tl: 11, tr: 11, bl: 3, br: 3 });
    g.fillStyle(0xffffff).fillCircle(10, 9, 4).fillCircle(20, 9, 4);
    g.fillStyle(0x1a1a14).fillCircle(11, 10, 2).fillCircle(21, 10, 2);
  });
  bake(scene, "spark", 8, 8, (g) => g.fillStyle(0xffffff).fillCircle(4, 4, 4));
}
// Matter's Bodies.polygon vertex layout, shifted so the bounding box starts at 0,0: Phaser derives
// the sprite origin from the body bounds, so the texture must match that box exactly.
function polygonShape(sides, radius) {
  const raw = Array.from({ length: sides }, (_, i) => {
    const a = Math.PI / sides + (i * 2 * Math.PI) / sides;
    return { x: Math.cos(a) * radius, y: Math.sin(a) * radius };
  });
  const minX = Math.min(...raw.map((p) => p.x)), minY = Math.min(...raw.map((p) => p.y));
  const maxX = Math.max(...raw.map((p) => p.x)), maxY = Math.max(...raw.map((p) => p.y));
  return { pts: raw.map((p) => ({ x: p.x - minX, y: p.y - minY })), w: Math.round(maxX - minX), h: Math.round(maxY - minY) };
}
function ballAtlas() {
  return canvas2d(96, 16, (g) => COLORS.forEach((c, i) => {
    const grd = g.createRadialGradient(i * 16 + 6, 6, 1, i * 16 + 8, 8, 8);
    grd.addColorStop(0, "#ffffff");
    grd.addColorStop(0.35, c);
    grd.addColorStop(1, c);
    g.fillStyle = grd;
    g.beginPath(); g.arc(i * 16 + 8, 8, 7.5, 0, Math.PI * 2); g.fill();
  }));
}
// 128 x 32 dungeon tileset: 0 floor, 1 wall, 2 cracked floor, 3 mossy floor.
function dungeonTiles() {
  return canvas2d(128, 32, (g) => {
    const floor = (ox) => {
      g.fillStyle = "#1b1f2b"; g.fillRect(ox, 0, 32, 32);
      g.fillStyle = "#222736"; g.fillRect(ox + 1, 1, 14, 14); g.fillRect(ox + 17, 17, 14, 14);
      g.fillStyle = "#1f2431"; g.fillRect(ox + 17, 1, 14, 14); g.fillRect(ox + 1, 17, 14, 14);
    };
    floor(0); floor(64); floor(96);
    g.fillStyle = "#3a4256"; g.fillRect(32, 0, 32, 32);
    g.fillStyle = "#4b556d"; g.fillRect(32, 0, 32, 6);
    g.fillStyle = "#2c3344";
    g.fillRect(32, 15, 32, 2); g.fillRect(32, 25, 32, 2); g.fillRect(46, 6, 2, 9); g.fillRect(38, 17, 2, 8); g.fillRect(54, 17, 2, 8);
    g.strokeStyle = "#0f1118"; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(70, 6); g.lineTo(78, 14); g.lineTo(75, 20); g.lineTo(84, 27); g.stroke();
    g.fillStyle = "rgba(123,211,137,.55)";
    for (const [x, y, r] of [[104, 8, 3], [110, 11, 2], [119, 22, 3], [101, 25, 2], [124, 6, 1.5]]) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
  });
}
function stickerTextures(scene) {
  bake(scene, "st-star", 64, 64, (g) => {
    g.fillStyle(0x000000, 0.25).fillPoints(starPoints(33, 35, 29, 13), true);
    g.fillStyle(HEXN[0]).fillPoints(starPoints(32, 33, 29, 13), true);
  });
  bake(scene, "st-heart", 64, 64, (g) => {
    g.fillStyle(HEXN[2]).fillCircle(21, 24, 14).fillCircle(43, 24, 14).fillTriangle(8, 30, 56, 30, 32, 58);
    g.fillStyle(0xffffff, 0.45).fillCircle(17, 20, 4);
  });
  bake(scene, "st-bolt", 64, 64, (g) => {
    g.fillStyle(HEXN[4]).fillPoints([{ x: 38, y: 2 }, { x: 12, y: 36 }, { x: 30, y: 36 }, { x: 24, y: 62 }, { x: 52, y: 26 }, { x: 34, y: 26 }], true);
  });
  bake(scene, "st-ring", 64, 64, (g) => {
    g.lineStyle(9, HEXN[1]).strokeCircle(32, 32, 24);
    g.lineStyle(3, 0xffffff, 0.5).strokeCircle(32, 32, 16);
  });
  bake(scene, "st-smile", 64, 64, (g) => {
    g.fillStyle(HEXN[3]).fillCircle(32, 32, 28);
    g.fillStyle(0x14171d).fillCircle(22, 26, 4).fillCircle(42, 26, 4);
    g.lineStyle(4, 0x14171d).beginPath().arc(32, 32, 16, 0.5, Math.PI - 0.5).strokePath();
  });
}

// Breadth-first search over walkable tiles; returns tile steps to the nearest goal (start excluded).
function bfs(grid, sx, sy, goal) {
  const W = grid[0].length, start = sy * W + sx, prev = new Int32Array(W * grid.length).fill(-1), q = [start];
  prev[start] = start;
  for (let qi = 0; qi < q.length; qi++) {
    const id = q[qi], x = id % W, y = (id / W) | 0;
    if (id !== start && goal(id)) {
      const path = [];
      for (let c = id; c !== start; c = prev[c]) path.push([c % W, (c / W) | 0]);
      return path.reverse();
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const n = (y + dy) * W + x + dx;
      if (grid[y + dy][x + dx] !== 1 && prev[n] === -1) { prev[n] = id; q.push(n); }
    }
  }
  return null;
}
// Seeded rooms-and-corridors dungeon, so every visit shows the same map.
function makeDungeon(MW, MH) {
  const rng = new Phaser.Math.RandomDataGenerator(["atlas"]);
  const grid = Array.from({ length: MH }, () => Array(MW).fill(1));
  const rooms = [];
  for (let tries = 0; tries < 120 && rooms.length < 10; tries++) {
    const rw = rng.between(5, 10), rh = rng.between(4, 8);
    const rx = rng.between(1, MW - rw - 2), ry = rng.between(1, MH - rh - 2);
    if (rooms.some((r) => rx <= r.x + r.w && rx + rw >= r.x && ry <= r.y + r.h && ry + rh >= r.y)) continue;
    rooms.push({ x: rx, y: ry, w: rw, h: rh, cx: rx + (rw >> 1), cy: ry + (rh >> 1) });
  }
  rooms.sort((a, b) => a.cx - b.cx);
  const carve = (x, y) => { if (x > 0 && y > 0 && x < MW - 1 && y < MH - 1) grid[y][x] = 0; };
  for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) carve(x, y);
  for (let i = 1; i < rooms.length; i++) {
    const a = rooms[i - 1], b = rooms[i];
    for (let x = Math.min(a.cx, b.cx); x <= Math.max(a.cx, b.cx); x++) { carve(x, a.cy); carve(x, a.cy + 1); }
    for (let y = Math.min(a.cy, b.cy); y <= Math.max(a.cy, b.cy) + 1; y++) { carve(b.cx, y); carve(b.cx + 1, y); }
  }
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
    if (grid[y][x] !== 0) continue;
    const r = rng.frac();
    grid[y][x] = r < 0.05 ? 2 : r < 0.11 ? 3 : 0;
  }
  return { grid, rooms };
}

// FPS-independent WebGL draw-call counter: wraps the context's draw functions until cleanup.
const DRAWS = ["drawElements", "drawArrays", "drawElementsInstanced", "drawArraysInstanced"];
function countDraws(ctx, gl, onCall) {
  if (!gl) return false;
  for (const n of DRAWS) {
    const orig = gl[n];
    if (typeof orig !== "function") continue;
    gl[n] = function (...a) { onCall(); return orig.apply(gl, a); };
  }
  ctx.onCleanup(() => DRAWS.forEach((n) => delete gl[n]));
  return true;
}

const PLATFORMS = [[220, 380, 4], [420, 300, 3], [600, 220, 4], [700, 390, 4], [980, 330, 5], [1220, 250, 3], [1360, 380, 3], [1600, 300, 4], [1820, 220, 4], [2060, 330, 5]];
const STARS = [
  [120, 430], [260, 340], [460, 260], [640, 180], [700, 180], [760, 350], [790, 430], [1030, 290],
  [1090, 290], [1250, 210], [1300, 430], [1400, 340], [1650, 260], [1860, 180], [1920, 180],
  [2100, 290], [2180, 290], [2300, 430],
];
const SLIMES = [[400, 260, 660], [1000, 860, 1320], [1700, 1500, 2000], [2200, 2050, 2380]];
const EASES = [
  { name: "Linear" }, { name: "Sine.easeInOut" }, { name: "Quad.easeOut" }, { name: "Cubic.easeInOut" },
  { name: "Back.easeOut" }, { name: "Elastic.easeOut", params: [1, 0.4] }, { name: "Bounce.easeOut" }, { name: "Expo.easeIn" },
];

Showcase.run({ scenes: [
  {
    id: "platformer", title: "星星跳跳",
    api: "physics.add.staticGroup()・add.tileSprite()・physics.add.collider() / overlap()・add.particles()・cameras.main.startFollow()・physics.overlapRect()",
    desc: "原版平台小遊戲：所有圖形都在執行時用 Graphics.generateTexture() 畫出，Arcade 物理處理重力與碰撞。自動示範用 overlapRect() 偵測前方坑洞，再看史萊姆與頭上的星星決定何時跳。",
    hint: "← → 移動・↑ 或空白鍵跳（可二段跳）・從上方踩扁史萊姆・R 重新開始・按方向鍵即接手",
    async mount(ctx) {
      ctx.el.classList.add("ph-night");
      ctx.html(`<div class="ph-box"></div><div class="ph-pad"><button class="btn" data-k="left" aria-label="向左">◀</button><button class="btn" data-k="right" aria-label="向右">▶</button><button class="btn primary" data-k="jump">跳</button></div>`);
      const W = 2400, H = 540;
      const touch = { left: false, right: false, jump: false };
      const say = message(ctx), show = readout(ctx);
      let auto = true, sc = null;
      const autoBtn = ctx.toggle("自動示範", true, (v) => { auto = v; say(v ? "自動示範中" : "手動操作中"); });
      ctx.button("重新開始", () => sc && sc.scene.restart());
      const takeOver = () => {
        if (!auto) return;
        auto = false;
        autoBtn.setAttribute("aria-pressed", "false");
        say("手動操作中");
      };
      for (const b of ctx.$$(".ph-pad .btn")) {
        const k = b.dataset.k;
        b.addEventListener("pointerdown", (e) => { e.preventDefault(); touch[k] = true; takeOver(); });
        for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => { if (k !== "jump") touch[k] = false; });
      }

      sc = await phaserIn(ctx, ctx.$(".ph-box"), {
        create() {
          platformTextures(this);
          let stars = 0, stomps = 0, jumps = 0, dir = 1, hopAt = 0, hurtUntil = 0;
          // backdrop: star field and two parallax ridges
          const sky = this.add.graphics().setScrollFactor(0.05);
          for (let i = 0; i < 90; i++) {
            sky.fillStyle(0xffffff, Phaser.Math.FloatBetween(0.15, 0.7));
            sky.fillCircle(Phaser.Math.Between(0, 1400), Phaser.Math.Between(0, 320), Phaser.Math.FloatBetween(0.6, 1.6));
          }
          for (const [color, sf, base, amp, step] of [[0x1a2033, 0.25, 360, 140, 120], [0x20283c, 0.5, 430, 90, 80]]) {
            const g = this.add.graphics().setScrollFactor(sf, 1).fillStyle(color);
            const pts = [{ x: -200, y: H + 200 }];
            for (let x = -200; x <= W + 200; x += step) pts.push({ x, y: base - Math.abs(Math.sin(x * 0.0037) * amp) - Math.random() * 30 });
            pts.push({ x: W + 200, y: H + 200 });
            g.fillPoints(pts, true);
          }

          this.physics.world.setBounds(0, 0, W, H + 300);
          this.physics.world.setBoundsCollision(true, true, false, false);
          const solids = this.physics.add.staticGroup();
          const solid = (x, y, w, h, key) => {
            const ts = this.add.tileSprite(x + w / 2, y + h / 2, w, h, key);
            this.physics.add.existing(ts, true);
            solids.add(ts);
          };
          for (const [x, w] of [[0, 704], [832, 512], [1472, 928]]) solid(x, H - 64, w, 64, "ground");
          for (const [x, y, n] of PLATFORMS) solid(x, y, n * 32, 18, "plat");

          const starGroup = this.physics.add.staticGroup();
          for (const [x, y] of STARS) {
            const s = starGroup.create(x, y, "star");

          this.setCam = (mode) => {
            cam.filters.external.clear();
            if (mode === 1) Phaser.Actions.AddEffectBloom(cam, { threshold: 0.4, blurRadius: 3, blurSteps: 4, blendAmount: 1.6 });
            else if (mode === 2) cam.filters.external.addVignette(0.5, 0.5, 0.7, 0.45);
            else if (mode === 3) cam.filters.external.addTiltShift();
          };
          this.setCam(camMode);
          this.tick = (time) => {
            const s = (Math.sin(time * 0.0015) + 1) / 2;
            for (const a of anims) a(s, time);
          };
          restartOnResize(ctx, this);
        },
      });
    },
  },
  {
    id: "draw", title: "拖曳與繪圖",
    api: "add.renderTexture()・rt.stamp(key, frame, x, y, { tint, scale, alpha })・rt.erase()・rt.draw()・rt.render()・setInteractive({ draggable: true })・input.on(\"drag\")",
    desc: "一張 2048×1280 的 RenderTexture 當畫布：筆刷沿滑鼠軌跡連續 stamp() 柔邊圓點，橡皮擦用 erase() 挖掉像素，「蓋章」用 draw() 把貼紙烙進畫布。五個貼紙是可拖曳的互動物件。",
    hint: "空白處拖曳作畫・拖曳貼紙移動・「蓋章」把貼紙印進畫布",
    async mount(ctx) {
      ctx.el.classList.add("ph-paper");
      ctx.html(`<div class="ph-box"></div>`);
      const show = readout(ctx);
      const PALETTE = { rainbow: -1, yellow: HEXN[0], cyan: HEXN[1], pink: HEXN[2], green: HEXN[3] };
      let sc = null, tool = 0, color = "rainbow", size = 18;
      ctx.group(["畫筆", "橡皮擦"], 0, (i) => { tool = i; });
      ctx.select("顏色", [
        { value: "rainbow", label: "彩虹" }, { value: "yellow", label: "黃" }, { value: "cyan", label: "青" },
        { value: "pink", label: "桃紅" }, { value: "green", label: "綠" },
      ], color, (v) => { color = v; });
      ctx.slider("粗細", { min: 4, max: 64, step: 1, value: size }, (v) => { size = v; });
      ctx.button("蓋章", () => sc && sc.stampStickers());
      ctx.button("清除", () => sc && sc.clearCanvas());

      sc = await phaserIn(ctx, ctx.$(".ph-box"), {
        create() {
          canvasTex(this, "ph-brush", glowCanvas(64, 0.5));
          stickerTextures(this);
          const { width: w, height: h } = this.scale;
          const rt = this.add.renderTexture(0, 0, 2048, 1280).setOrigin(0, 0);
          const eraser = this.make.image({ key: "ph-brush", add: false });
          let dirty = false, stamps = 0, dist = 0, last = null, drawing = false, auto = 0;
          const tint = () => (PALETTE[color] < 0 ? hsv(dist * 0.0012, 0.75) : PALETTE[color]);
          const dab = (x, y) => {
            if (tool === 0) rt.stamp("ph-brush", null, x, y, { tint: tint(), scale: size / 64, alpha: 0.9 });
            else { eraser.setScale((size * 1.5) / 64); rt.erase([eraser], x, y); }
            stamps++;
            dirty = true;
          };
          const strokeTo = (x, y) => {
            if (!last) { dab(x, y); last = { x, y }; return; }
            const dx = x - last.x, dy = y - last.y, d = Math.hypot(dx, dy), step = Math.max(1.5, size * 0.18);
            if (d < step) return;
            let s = step;
            for (; s <= d; s += step) dab(last.x + (dx * s) / d, last.y + (dy * s) / d);
            s -= step;
            dist += s;
            last = { x: last.x + (dx * s) / d, y: last.y + (dy * s) / d };
          };

          const KEYS = ["st-star", "st-heart", "st-bolt", "st-ring", "st-smile"];
          const spot = (i) => ({ x: w * (0.14 + i * 0.18), y: h * 0.72 + (i % 2 ? -22 : 18) });
          const stickers = KEYS.map((key, i) => this.add.image(spot(i).x, spot(i).y, key).setInteractive({ draggable: true, useHandCursor: true }));
          this.input.on("dragstart", (_, o) => { this.children.bringToTop(o); o.setScale(1.15); });
          this.input.on("drag", (_, o, x, y) => o.setPosition(x, y));
          this.input.on("dragend", (_, o) => o.setScale(1));
          this.input.on("pointerdown", (ptr, over) => {
            if (over.length) return;
            drawing = true;
            auto = 1e9;
            last = null;
            strokeTo(ptr.worldX, ptr.worldY);
          });
          this.input.on("pointermove", (ptr) => { if (drawing && ptr.isDown) strokeTo(ptr.worldX, ptr.worldY); });
          this.input.on("pointerup", () => { drawing = false; last = null; });

          this.stampStickers = () => {
            for (const s of stickers) rt.draw([s], s.x, s.y);
            dirty = true;
            stickers.forEach((s, i) => this.tweens.add({ targets: s, x: rnd(50, w - 50), y: rnd(Math.min(h - 60, belowControls(ctx) + 40), h - 60), angle: rnd(-25, 25), duration: 600, ease: "Back.easeOut", delay: i * 60 }));
          };
          this.clearCanvas = () => { rt.clear(); dirty = true; };
          this.stats = () => stamps;
          this.tick = (time, dt) => {
            if (auto < 2200) {
              // opening flourish: a lemniscate drawn by the same stroke code
              auto += dt;
              const a = (auto / 2200) * Math.PI * 2, r = Math.min(w * 0.3, h * 0.24);
              const cx = w / 2, cy = h * 0.42, d = 1 + Math.sin(a) ** 2;
              strokeTo(cx + (r * Math.cos(a)) / d, cy + (r * Math.sin(a) * Math.cos(a)) / d);
              if (auto >= 2200) last = null;
            }
            if (dirty) { rt.render(); dirty = false; }
          };
        },
      });

      const paint = () => show(`筆刷蓋印 <b>${fmtN(sc.stats())}</b> 次・RenderTexture <b>2048×1280</b>・<b>${fpsOf(sc)}</b> FPS`);
      paint();
      ctx.interval(paint, 250);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "physics.add.group({ classType: Arcade.Image })・physics.add.collider(group, group)・disableBody() / enableBody()・game.events PRE_STEP / POST_RENDER",
    desc: "同一張 6 色圖集的小球，數量逐級增加直到掉到 30 FPS 以下。可切換 Arcade 物理彼此互撞、只撞牆，或關掉物理改由 JavaScript 直接搬位置，比較物理與繪製各自的成本。",
    hint: "按「自動加壓」開始・切換「Arcade 互撞、只撞牆、純 Sprite」再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="stress-box"></div>`);
      ctx.controls.classList.add("bottom");
      const MODES = ["Arcade 互撞", "Arcade 只撞牆", "純 Sprite"];
      let mode = 0, sc = null, upd = 0, drw = 0, calls = 0, dc = 0;
      ctx.group(MODES, 0, (i) => { mode = i; if (sc) sc.setMode(i); });

      sc = await phaserIn(ctx, ctx.$(".stress-box"), {
        create() {
          const tex = canvasTex(this, "balls", ballAtlas());
          for (let i = 0; i < 6; i++) if (!tex.has(i)) tex.add(i, 0, i * 16, 0, 16, 16);
          const world = this.physics.world;
          world.setBounds(0, 0, this.scale.width, this.scale.height);
          this.scale.on("resize", (s) => world.setBounds(0, 0, s.width, s.height));
          const group = this.physics.add.group({ classType: Phaser.Physics.Arcade.Image, collideWorldBounds: true, bounceX: 1, bounceY: 1 });
          const collider = this.physics.add.collider(group, group);
          const MAX = 100000, vx = new Float32Array(MAX), vy = new Float32Array(MAX), pool = [];
          let count = 0, live = 0;

          const usePhysics = (b, i) => { b.enableBody(false, 0, 0, true, true); b.setVelocity(vx[i], vy[i]); };
          this.setCount = (n) => {
            const { width: w, height: h } = this.scale;
            while (pool.length < n) {
              const i = pool.length, a = Math.random() * Math.PI * 2, s = rnd(60, 160);
              const b = group.create(rnd(8, w - 8), rnd(8, h - 8), "balls", i % 6);
              b.setCircle(8);
              vx[i] = Math.cos(a) * s; vy[i] = Math.sin(a) * s;
              b.disableBody(true, true);
              pool.push(b);
            }
            for (let i = count; i < n; i++) {
              const b = pool[i];
              b.setPosition(rnd(8, w - 8), rnd(8, h - 8)).setActive(true).setVisible(true);
              if (live !== 2) usePhysics(b, i);
            }
            for (let i = n; i < count; i++) pool[i].disableBody(true, true);
            count = n;
          };
          this.setMode = (m) => {
            collider.active = m === 0;
            if ((m === 2) !== (live === 2)) {
              for (let i = 0; i < count; i++) {
                const b = pool[i];
                if (m === 2) { vx[i] = b.body.velocity.x; vy[i] = b.body.velocity.y; b.disableBody(false, false); }
                else usePhysics(b, i);
              }
            }
            live = m;
          };
          this.setMode(mode);
          // disableBody() only clears body.enable; pooled bodies stay in world.bodies, so count the enabled ones
          this.bodies = () => { let n = 0; for (const b of world.bodies) if (b.enable) n++; return n; };
          this.tick = (time, dt) => {
            if (live !== 2) return;
            const k = Math.min(dt, 100) / 1000, w = this.scale.width, h = this.scale.height;
            for (let i = 0; i < count; i++) {
              const b = pool[i];
              let x = b.x + vx[i] * k, y = b.y + vy[i] * k;
              if (x < 8) { x = 8; vx[i] = Math.abs(vx[i]); } else if (x > w - 8) { x = w - 8; vx[i] = -Math.abs(vx[i]); }
              if (y < 8) { y = 8; vy[i] = Math.abs(vy[i]); } else if (y > h - 8) { y = h - 8; vy[i] = -Math.abs(vy[i]); }
              b.x = x; b.y = y;
            }
          };
        },
      }, { physics: { default: "arcade", arcade: { gravity: { x: 0, y: 0 } } }, render: { antialias: false } });

      // Destroying 100k display-list children one by one is quadratic; empty the list in one splice first.
      ctx.onCleanup(() => sc.children.removeBetween(0, sc.children.length));
      const E = Phaser.Core.Events, ev = sc.game.events;
      let t0 = 0, t1 = 0;
      ev.on(E.PRE_STEP, () => { t0 = performance.now(); });
      ev.on(E.POST_STEP, () => { upd += (performance.now() - t0 - upd) * 0.1; });
      ev.on(E.PRE_RENDER, () => { t1 = performance.now(); calls = 0; });
      ev.on(E.POST_RENDER, () => { drw += (performance.now() - t1 - drw) * 0.1; dc += (calls - dc) * 0.2; });
      const counting = countDraws(ctx, sc.game.renderer.gl, () => { calls++; });
      ctx.ramp({
        label: "小球", unit: "顆", steps: [500, 1000, 2000, 5000, 10000, 20000, 50000, 100000], minFps: 30,
        apply: (n) => sc.setCount(n),
        metrics: () => ({
          更新: `${upd.toFixed(1)} ms`,
          繪製: `${drw.toFixed(1)} ms`,
          "draw call": counting ? (dc < 10 ? dc.toFixed(1) : dc.toFixed(0)) : "不適用",
          物理物體: fmtN(sc.bodies()),
          模式: MODES[mode],
        }),
        note: "更新量的是 game.step() 裡場景更新的時間，Arcade 物理就在這段：互撞模式每格要用空間樹找出彼此重疊的配對再分離，成本隨數量與密度快速上升；只撞牆模式只剩積分速度與邊界檢查；純 Sprite 關掉物理，只剩 JavaScript 搬座標。繪製量的是 scene.render() 送出繪圖指令的時間，同一張圖集的小球會被批次合併，draw call 很少，CPU 主要花在逐一計算每顆的變形並填頂點。GPU 是非同步執行，實際瓶頸也可能在顯示卡。",
      });
    },
  },
] });
</script>
</body>
</html>
