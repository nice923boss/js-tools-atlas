<script type="module">
// Photo Sphere Viewer showcase: eight scenes from the original little-planet intro to a marker-count stress ramp.
// Every scene owns its Viewer; on unmount the viewer is destroyed and its WebGL context is explicitly lost.
import { Viewer, utils } from "@photo-sphere-viewer/core";
import { MarkersPlugin } from "@photo-sphere-viewer/markers-plugin";
import { AutorotatePlugin } from "@photo-sphere-viewer/autorotate-plugin";

const { fmt } = Showcase;
const PANO = "_shared/img/panorama.jpg";
const deg = (d) => (d * Math.PI) / 180;
const toDeg = (r) => (r * 180) / Math.PI;
const FONT = '"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif';
const LANG = {
  zoom: "縮放", zoomOut: "縮小", zoomIn: "放大", moveUp: "向上", moveDown: "向下", moveLeft: "向左", moveRight: "向右",
  description: "說明", download: "下載", fullscreen: "全螢幕", loading: "載入中", menu: "選單", close: "關閉",
  twoFingers: "請用兩指拖曳", ctrlZoom: "按住 Ctrl 再滾動來縮放", loadError: "全景圖無法載入",
  webglError: "瀏覽器不支援 WebGL", markers: "標記", markersList: "標記列表", autorotate: "自動旋轉", gallery: "圖庫", gyroscope: "陀螺儀",
};
const pin = (label, cls = "") => `<div class="pv-pin ${cls}"><i></i><span>${label}</span></div>`;

const MARKERS = [

  { id: "tower", position: { yaw: deg(55), pitch: deg(4) }, html: pin("遠方鐘樓"),
    tooltip: "對岸天際線上高聳的鐘樓。",
    content: panel("天際線上的鐘樓", "在 360 度照片裡放大這一區，可以看清對岸的鐘樓與教堂圓頂。用滾輪或雙指縮放試試。") },
  { id: "villa", polygon: [[deg(136), deg(-4.5)], [deg(136), deg(21)], [deg(177), deg(21)], [deg(177), deg(-4.5)]],
    svgStyle: { fill: "rgba(247,223,30,0.16)", stroke: "#f7df1e", strokeWidth: "2px" },
    tooltip: { content: "紅窗黃牆的老別墅，這是一個多邊形標記。", position: "top center" },
    content: panel("水岸別墅", "多邊形標記會貼著球面變形，轉動視角時始終框住建築本身，適合標示整棟房子或一片區域。") },
  { id: "bollard", position: { yaw: deg(-77), pitch: deg(-22) }, html: pin("繫船柱", "ground"),
    tooltip: "老式鑄鐵繫船柱，過去用來綁貢多拉船。",
    content: panel("鑄鐵繫船柱", "水岸邊每隔一段距離就有一根繫船柱，表面的鏽色是海風長年吹拂留下的痕跡。") },
  { id: "steps", position: { yaw: deg(97), pitch: deg(-11) }, html: pin("水岸石階", "ground"),
    tooltip: "有人坐在石階上等日落。",
    content: panel("下到水邊的石階", "石階一路延伸到水面，漲潮時下面幾階會被淹沒，長出一層綠色的海藻。") },
  { id: "houses", position: { yaw: deg(-135), pitch: deg(7) }, html: pin("運河老房子"),
    tooltip: "沿岸的粉色與磚紅色老房子。",
    content: panel("沿岸的老房子", "轉到背面可以看到沿著步道排列的住宅與庭園，跟前方開闊的水面形成對比。") },
];
const PIN_SVG = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48"><path d="M24 46s16-15 16-27A16 16 0 0 0 8 19c0 12 16 27 16 27z" fill="#f7df1e" stroke="#000" stroke-opacity=".45" stroke-width="2"/><circle cx="24" cy="19" r="6" fill="#0e1013"/></svg>');

// Mount a Viewer into a fresh host. Cleanup destroys it and forces the GL context loss
// (Viewer.destroy() disposes the three.js renderer but leaves the context alive until GC).
function makeViewer(ctx, cfg, host = ctx.$(".pv-host")) {
  const viewer = new Viewer({ container: host, lang: LANG, mousewheelCtrlKey: false, loadingTxt: "載入中", ...cfg });
  ctx.onCleanup(() => {
    let gl = null;
    try { gl = viewer.renderer.renderer.getContext(); } catch { /* renderer not created */ }
    viewer.destroy();
    gl?.getExtension("WEBGL_lose_context")?.loseContext();
  });
  return viewer;
}
const box = (ctx, cls = "") => { const b = Showcase.h("div", { class: `pv-box ${cls}` }); ctx.el.append(b); return b; };
const row = (k, v) => `<div><span class="k">${k}</span>　${v}</div>`;

// Equirectangular test pattern: 15 degree grid, yaw / pitch labels and a repeated title.
// Yaw 0 sits at the image centre, as Photo Sphere Viewer expects.
function gridPano(w, hgt, { hue = 210, title = "", sub = "" } = {}) {
  const c = document.createElement("canvas");
  c.width = w; c.height = hgt;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, hgt);
  grad.addColorStop(0, `hsl(${hue} 55% 22%)`); grad.addColorStop(0.5, `hsl(${hue} 45% 42%)`);
  grad.addColorStop(0.501, `hsl(${(hue + 30) % 360} 25% 26%)`); grad.addColorStop(1, `hsl(${(hue + 30) % 360} 30% 10%)`);
  g.fillStyle = grad; g.fillRect(0, 0, w, hgt);
  const X = (yaw) => w / 2 + (yaw / 360) * w, Y = (pitch) => hgt / 2 - (pitch / 180) * hgt;
  g.lineWidth = Math.max(1, w / 2048);
  for (let yaw = -180; yaw <= 180; yaw += 15) {
    g.strokeStyle = yaw % 90 === 0 ? "rgba(255,255,255,.75)" : "rgba(255,255,255,.22)";
    g.beginPath(); g.moveTo(X(yaw), 0); g.lineTo(X(yaw), hgt); g.stroke();
  }
  for (let p = -75; p <= 75; p += 15) {
    g.strokeStyle = p === 0 ? "rgba(255,230,120,.9)" : "rgba(255,255,255,.22)";
    g.beginPath(); g.moveTo(0, Y(p)); g.lineTo(w, Y(p)); g.stroke();
  }
  const fs = w / 64;
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(255,255,255,.85)"; g.font = `600 ${fs * 0.55}px ui-monospace,Consolas,monospace`;
  for (let yaw = -150; yaw <= 180; yaw += 30) g.fillText(`${yaw}°`, X(yaw), Y(0) + fs * 0.6);
  for (let p = -60; p <= 60; p += 30) if (p) for (const yaw of [-135, -45, 45, 135]) g.fillText(`${p > 0 ? "+" : ""}${p}°`, X(yaw), Y(p));
  const dirs = [["N 北", 0], ["E 東", 90], ["S 南", 180], ["W 西", -90]];
  g.font = `700 ${fs * 1.3}px ${FONT}`;
  for (const [t, yaw] of dirs) {
    g.fillStyle = "#f7df1e"; g.fillText(t, X(yaw), Y(8));
    if (yaw === 180) g.fillText(t, X(-180) + fs * 2.2, Y(8));
  }
  g.font = `700 ${fs * 1.6}px ${FONT}`;
  for (const yaw of [-135, -45, 45, 135]) {
    g.fillStyle = "#fff"; g.fillText(title, X(yaw), Y(24));
    if (sub) { g.font = `500 ${fs * 0.75}px ${FONT}`; g.fillStyle = "rgba(255,255,255,.75)"; g.fillText(sub, X(yaw), Y(15)); g.font = `700 ${fs * 1.6}px ${FONT}`; }
  }
  return c;
}
const jpeg = (canvas, q = 0.88) => canvas.toDataURL("image/jpeg", q);
async function loadImg(src) { const im = new Image(); im.src = src; await im.decode(); return im; }

// Little-planet intro: animate pitch, yaw, zoom and fisheye together, then hand over to autorotate.
function littlePlanet(viewer, autorotate) {
  autorotate.stop();
  viewer.setOption("fisheye", 2);
  viewer.rotate({ yaw: deg(180), pitch: deg(-90) });
  viewer.zoom(0);
  const anim = new utils.Animation({
    properties: { pitch: { start: deg(-90), end: deg(3) }, yaw: { start: deg(180), end: deg(30) }, zoom: { start: 0, end: 45 }, fisheye: { start: 2, end: 0 } },
    duration: 2200, easing: "inOutQuad",
    onTick: (p) => { viewer.setOption("fisheye", p.fisheye); viewer.rotate({ yaw: p.yaw, pitch: p.pitch }); viewer.zoom(p.zoom); },
  });
  anim.then((done) => { if (done) autorotate.start(); });
  return anim;
}

Showcase.run({ scenes: [
  {
    id: "planet", title: "小行星開場",
    api: "new Viewer({ fisheye: 2, plugins: [MarkersPlugin, AutorotatePlugin] }) ＋ utils.Animation",
    desc: "原版招牌：從 fisheye 小行星視角，同時補間 pitch、yaw、zoom、fisheye 四個參數翻轉成正常視角，再交給自動旋轉；六個標記點開會帶出說明面板。",
    hint: "拖曳環顧，點標記看介紹，左下按鈕開關自動旋轉",
    mount(ctx) {
      ctx.html('<div class="pv-host"></div>');
      const viewer = makeViewer(ctx, {
        panorama: PANO, caption: "威尼斯水岸．日落時分", defaultYaw: deg(180), defaultPitch: deg(-90), defaultZoomLvl: 0, fisheye: 2,
        navbar: ["autorotate", "zoom", "markersList", "caption", "fullscreen"],
        plugins: [
          [MarkersPlugin, { markers: MARKERS, defaultHoverScale: true }],
          [AutorotatePlugin, { autostartDelay: 4000, autostartOnIdle: true, autorotatePitch: deg(4), autorotateSpeed: "1rpm" }],
        ],
      });
      const markers = viewer.getPlugin(MarkersPlugin);
      const autorotate = viewer.getPlugin(AutorotatePlugin);
      let intro = null;
      const play = () => { intro?.cancel(); intro = littlePlanet(viewer, autorotate); };
      viewer.addEventListener("ready", play, { once: true });
      ctx.onCleanup(() => intro?.cancel());
      markers.addEventListener("select-marker", ({ marker }) => { autorotate.stop(); markers.gotoMarker(marker.id, "4rpm"); });

    },
  },
  {
    id: "markers", title: "標記種類",
    api: "MarkersPlugin：image / html / polygon / polyline / circle / rect / imageLayer",
    desc: "同一張全景放七種標記：DOM 類（image、html）跟著視角平移；SVG 類（polygon、polyline、circle、rect）貼著球面變形；imageLayer 是 three.js 平面，直接畫進 WebGL。",

      g.fillStyle = "rgba(14,16,19,.82)"; g.fillRect(0, 0, 512, 220);
      g.strokeStyle = "#4cc9f0"; g.lineWidth = 8; g.strokeRect(4, 4, 504, 212);
      g.fillStyle = "#4cc9f0"; g.font = "700 46px ui-monospace,Consolas,monospace"; g.textAlign = "center"; g.fillText("imageLayer", 256, 88);
      g.fillStyle = "#fff"; g.font = `500 32px ${FONT}`; g.fillText("WebGL 平面，跟著球面透視", 256, 156);
      const TYPES = {
        sun: "image", tower: "html", villa: "polygon", line: "polyline", bollard: "circle", steps: "rect", layer: "imageLayer",
      };
      const list = [
        { id: "sun", image: PIN_SVG, size: { width: 44, height: 44 }, anchor: "bottom center", position: { yaw: deg(36), pitch: deg(3.5) },
          tooltip: "image：一張圖片（這裡是 SVG data URL），永遠正對鏡頭", content: panel("image 標記", "以 &lt;img&gt; 元素疊在畫布上，大小固定、不受透視影響。anchor 決定哪個點對準座標，這裡用 bottom center 讓針尖落在太陽上。") },
        { id: "tower", html: pin("遠方鐘樓"), position: { yaw: deg(55), pitch: deg(4) },
          tooltip: "html：任意 HTML，可放動畫與 CSS", content: panel("html 標記", "直接寫 HTML 字串，外觀全靠 CSS。脈衝圈就是 CSS animation。") },
        { ...MARKERS[2], tooltip: { content: "polygon：多邊形，頂點用球面座標描述", position: "top center" } },
        { id: "line", polyline: [[deg(64), deg(-7)], [deg(80), deg(-9)], [deg(97), deg(-12)], [deg(118), deg(-10)], [deg(132), deg(-6)]],
          svgStyle: { stroke: "#4cc9f0", strokeWidth: "4px", strokeLinecap: "round", strokeDasharray: "10 8" },
          tooltip: "polyline：沿著水岸的折線", content: panel("polyline 標記", "折線常用來畫路線或邊界。每個頂點都是 yaw／pitch，所以轉動視角時線段會沿球面彎曲。") },
        { id: "bollard", circle: 22, position: { yaw: deg(-77), pitch: deg(-22) }, svgStyle: { fill: "rgba(247,37,133,.25)", stroke: "#f72585", strokeWidth: "3px" },
          tooltip: "circle：SVG 圓，半徑以像素計", content: panel("circle 標記", "SVG 形狀標記的大小以螢幕像素計算，不會跟著縮放變大。") },
        { id: "steps", rect: { width: 90, height: 46 }, position: { yaw: deg(97), pitch: deg(-11) }, svgStyle: { fill: "rgba(123,211,137,.22)", stroke: "#7bd389", strokeWidth: "3px" },
          tooltip: "rect：SVG 矩形", content: panel("rect 標記", "rect、square、ellipse、path 都屬於 SVG 標記，可用 svgStyle 指定填色與描邊。") },

      ];

        panorama: PANO, defaultYaw: deg(70), defaultPitch: deg(2), defaultZoomLvl: 20,
        navbar: ["zoom", "markersList", "fullscreen"],

      });

      const info = box(ctx);

      show(null);
      markers.addEventListener("enter-marker", ({ marker }) => show(marker.id));
      markers.addEventListener("leave-marker", () => show(null));
      ctx.select("", Object.entries(TYPES).map(([id, t]) => ({ value: id, label: `前往 ${t}` })), "sun", (id) => markers.gotoMarker(id, "6rpm"));
    },
  },
  {
    id: "tour", title: "虛擬導覽",
    api: "VirtualTourPlugin({ nodes, transitionOptions }) ＋ GalleryPlugin ＋ CompassPlugin",
    desc: "三個節點：威尼斯照片與兩間頁面內產生的格線展間。3D 箭頭連結節點，切換時先轉向再淡入；羅盤顯示連結方位，圖庫列出全部節點。",
    hint: "點地上的箭頭移動，左上羅盤的亮點就是可去的方向",
    async mount(ctx) {
      ctx.html('<div class="pv-host"></div>');
      const [{ VirtualTourPlugin }, { GalleryPlugin }, { CompassPlugin }] = await Promise.all([
        import("@photo-sphere-viewer/virtual-tour-plugin"), import("@photo-sphere-viewer/gallery-plugin"), import("@photo-sphere-viewer/compass-plugin"),
      ]);
      const roomA = jpeg(gridPano(2048, 1024, { hue: 200, title: "展間 A", sub: "頁面內 canvas 產生" }));
      const roomB = jpeg(gridPano(2048, 1024, { hue: 330, title: "展間 B", sub: "頁面內 canvas 產生" }));
      const thumb = (src) => src;
      const nodes = [
        { id: "venice", panorama: PANO, thumbnail: PANO, name: "威尼斯水岸", caption: "節點 1：實拍照片",
          links: [{ nodeId: "roomA", position: { yaw: deg(97), pitch: deg(-6) } }, { nodeId: "roomB", position: { yaw: deg(-135), pitch: deg(-4) } }] },
        { id: "roomA", panorama: roomA, thumbnail: thumb(roomA), name: "展間 A", caption: "節點 2：格線測試圖",
          links: [{ nodeId: "venice", position: { yaw: deg(180), pitch: deg(-5) } }, { nodeId: "roomB", position: { yaw: deg(90), pitch: deg(-5) } }] },
        { id: "roomB", panorama: roomB, thumbnail: thumb(roomB), name: "展間 B", caption: "節點 3：格線測試圖",
          links: [{ nodeId: "venice", position: { yaw: deg(0), pitch: deg(-5) } }, { nodeId: "roomA", position: { yaw: deg(-90), pitch: deg(-5) } }] },
      ];
      let effect = "fade", hops = 0;
      const viewer = makeViewer(ctx, {
        defaultZoomLvl: 10, navbar: ["zoom", "gallery", "caption", "fullscreen"],
        plugins: [
          MarkersPlugin,
          [CompassPlugin, { size: "92px", position: "top left", hotspotColor: "rgba(247,223,30,.9)" }],
          [GalleryPlugin, { thumbnailSize: { width: 120, height: 66 }, visibleOnLoad: false }],
          [VirtualTourPlugin, { nodes, startNodeId: "venice", renderMode: "3d", linksOnCompass: true,
            transitionOptions: () => ({ effect, speed: "20rpm", rotation: true, showLoader: false }) }],
        ],
      });
      const tour = viewer.getPlugin(VirtualTourPlugin);
      const info = box(ctx, "low");
      const paint = (node) => { info.innerHTML = row("目前節點", `<b>${node?.name ?? "…"}</b>`) + row("連結數", `<b>${node?.links?.length ?? 0}</b>`) + row("已切換", `<b>${hops}</b> 次`); };
      paint(null);
      tour.addEventListener("node-changed", ({ node }) => { hops++; paint(node); });
      ctx.group(["淡入", "黑場", "白場"], 0, (i) => { effect = ["fade", "black", "white"][i]; });
      ctx.select("", nodes.map((n) => ({ value: n.id, label: `跳到 ${n.name}` })), "venice", (id) => tour.setCurrentNode(id));
    },
  },
  {
    id: "cube", title: "立方體貼圖",
    api: "adapter: CubemapAdapter，panorama: { left, front, right, back, top, bottom }",
    desc: "改用六張正方形貼圖組成立方體。六面都是頁面內 canvas 畫的，顏色與字樣不同，接縫處的格線能檢查投影是否對齊；點畫面會回報點到哪一面與面內座標。",
    hint: "點任一處看 textureFace，右上按鈕轉到指定面",
    async mount(ctx) {
      ctx.html('<div class="pv-host"></div>');
      const { CubemapAdapter } = await import("@photo-sphere-viewer/cubemap-adapter");
      const FACES = [["front", "前", 200, 0, 0], ["right", "右", 140, 90, 0], ["back", "後", 20, 180, 0], ["left", "左", 280, -90, 0], ["top", "上", 50, 0, 89], ["bottom", "下", 330, 0, -89]];
      const S = 768, pano = {};
      for (const [id, zh, hue] of FACES) {
        const c = document.createElement("canvas"); c.width = c.height = S;
        const g = c.getContext("2d");
        g.fillStyle = `hsl(${hue} 50% 30%)`; g.fillRect(0, 0, S, S);
        g.strokeStyle = "rgba(255,255,255,.3)"; g.lineWidth = 2;
        for (let i = 1; i < 8; i++) { const p = (i * S) / 8; g.beginPath(); g.moveTo(p, 0); g.lineTo(p, S); g.moveTo(0, p); g.lineTo(S, p); g.stroke(); }
        g.strokeStyle = "#f7df1e"; g.lineWidth = 10; g.strokeRect(5, 5, S - 10, S - 10);
        g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
        g.font = `800 ${S * 0.3}px ${FONT}`; g.fillText(zh, S / 2, S / 2 - S * 0.04);
        g.font = `600 ${S * 0.075}px ui-monospace,Consolas,monospace`; g.fillText(id, S / 2, S * 0.74);
        g.font = `600 ${S * 0.045}px ui-monospace,Consolas,monospace`; g.fillStyle = "#f7df1e";
        g.fillText("↑ 上緣", S / 2, S * 0.07); g.fillText("(0,0)", S * 0.09, S * 0.95); g.fillText(`(${S},${S})`, S * 0.86, S * 0.95);
        pano[id] = jpeg(c, 0.9);
      }
      const viewer = makeViewer(ctx, { adapter: CubemapAdapter, panorama: pano, defaultZoomLvl: 0, navbar: ["zoom", "fullscreen"], plugins: [MarkersPlugin] });
      const markers = viewer.getPlugin(MarkersPlugin);
      const info = box(ctx);
      info.innerHTML = row("點畫面任一處", "回報 textureFace");
      viewer.addEventListener("click", ({ data }) => {
        info.innerHTML = row("textureFace", `<b>${data.textureFace ?? "?"}</b>`) + row("面內座標", `<b>${fmt(data.textureX)}, ${fmt(data.textureY)}</b>`) +
          row("yaw / pitch", `<b>${toDeg(data.yaw).toFixed(1)}°, ${toDeg(data.pitch).toFixed(1)}°</b>`);
        markers.setMarkers([{ id: "hit", position: { yaw: data.yaw, pitch: data.pitch }, circle: 10, svgStyle: { fill: "#f72585", stroke: "#fff", strokeWidth: "2px" } }]);
      });
      ctx.group(FACES.map((f) => f[1]), 0, (i) => viewer.animate({ yaw: deg(FACES[i][3]), pitch: deg(FACES[i][4]), speed: "8rpm" }));
    },
  },
  {
    id: "tiles", title: "分塊載入",
    api: "adapter: EquirectangularTilesAdapter，panorama: { baseUrl, levels, tileUrl(col, row, level) }",
    desc: "把 4096 寬的全景切成三層金字塔（1024、2048、4096 寬，每塊 256 px）。轉接器依「畫面寬 × 360 ÷ hFov」挑最低夠用的層級，只載入視野內的塊；每塊由 canvas 現場裁切並標上層級與行列，邊框顏色代表層級。大螢幕一開始就需要 L2，小視窗才看得到從 L0 換層。",
    hint: "滾輪拉近會換到高解析層，看右上統計增加",
    async mount(ctx) {
      ctx.html('<div class="pv-host"></div>');
      const st = ctx.status("載入原始全景，準備切塊…");
      const [{ EquirectangularTilesAdapter }, img] = await Promise.all([import("@photo-sphere-viewer/equirectangular-tiles-adapter"), loadImg(PANO)]);
      st.done();
      const LEVELS = [{ width: 1024, cols: 4, rows: 2 }, { width: 2048, cols: 8, rows: 4 }, { width: 4096, cols: 16, rows: 8 }];
      const COLORS = ["#4cc9f0", "#f7df1e", "#f72585"];
      const W = img.naturalWidth, H = img.naturalHeight;
      const tile = document.createElement("canvas"); tile.width = tile.height = 256;
      const tg = tile.getContext("2d");
      let counts = [0, 0, 0], genMs = 0;
      const tileUrl = (col, row, level) => {
        const t0 = performance.now();
        const L = LEVELS[level], sw = W / L.cols, sh = H / L.rows;
        tg.drawImage(img, col * sw, row * sh, sw, sh, 0, 0, 256, 256);
        tg.globalAlpha = 0.75; tg.strokeStyle = COLORS[level]; tg.lineWidth = 2; tg.strokeRect(1, 1, 254, 254); tg.globalAlpha = 1;
        tg.fillStyle = "rgba(0,0,0,.6)"; tg.fillRect(6, 6, 92, 24);
        tg.fillStyle = COLORS[level]; tg.font = "600 14px ui-monospace,Consolas,monospace"; tg.fillText(`L${level} ${col},${row}`, 12, 23);
        const url = tile.toDataURL("image/jpeg", 0.85);
        counts[level]++; genMs += performance.now() - t0;
        return url;
      };
      const base = document.createElement("canvas"); base.width = 512; base.height = 256;
      base.getContext("2d").drawImage(img, 0, 0, 512, 256);
      const panoCfg = () => ({ baseUrl: base.toDataURL("image/jpeg", 0.8), levels: LEVELS, tileUrl });
      const viewer = makeViewer(ctx, {
        adapter: [EquirectangularTilesAdapter, { showErrorTile: false, baseBlur: true }],
        panorama: panoCfg(), defaultYaw: deg(36), defaultZoomLvl: 0, navbar: ["zoom", "fullscreen"],
      });
      const info = box(ctx);
      const paint = () => {
        info.innerHTML = LEVELS.map((L, i) => row(`<span style="color:${COLORS[i]}">L${i}</span> ${L.width} 寬`, `<b>${counts[i]}</b> / ${L.cols * L.rows} 塊`)).join("") +
          row("縮放／hFov", `<b>${viewer.getZoomLevel().toFixed(0)}</b>／<b>${viewer.state.hFov.toFixed(0)}°</b>`) +
          row("畫面需要的全景寬", `<b>${fmt((viewer.state.size.width * 360) / viewer.state.hFov)} px</b>`) + row("切塊總耗時", `<b>${genMs.toFixed(0)} ms</b>`);
      };
      ctx.interval(paint, 300); paint();
      ctx.button("拉到最近", () => viewer.animate({ zoom: 100, speed: "4rpm" }), { primary: true });
      ctx.button("拉到最遠", () => viewer.animate({ zoom: 0, speed: "4rpm" }));
      ctx.button("清空重載", () => { counts = [0, 0, 0]; genMs = 0; viewer.setPanorama(panoCfg(), { transition: false, showLoader: false }); });
    },
  },
  {
    id: "events", title: "事件與動畫",
    api: "viewer.addEventListener('click' | 'position-updated' | 'zoom-updated') ＋ viewer.animate()",
    desc: "即時讀出事件資料：click 給出球面角與原圖像素座標，並在點擊處放一個標記；animate 以指定轉速同時補間方向與縮放。也檢查 GyroscopePlugin.isSupported() 判斷裝置能否用陀螺儀。",
    hint: "點畫面放置標記，右上按鈕播放鏡頭動畫",
    async mount(ctx) {
      ctx.html('<div class="pv-host"></div>');
      const { GyroscopePlugin } = await import("@photo-sphere-viewer/gyroscope-plugin");
      const viewer = makeViewer(ctx, {
        panorama: PANO, defaultYaw: deg(20), defaultZoomLvl: 30, navbar: ["zoom", "markers", "gyroscope", "fullscreen"],
        plugins: [MarkersPlugin, GyroscopePlugin],
      });
      const markers = viewer.getPlugin(MarkersPlugin), gyro = viewer.getPlugin(GyroscopePlugin);
      const s = { yaw: 0, pitch: 0, zoom: 0, click: "尚未點擊", px: "", n: 0, events: 0, gyro: "檢查中（等待 deviceorientation 事件，最多 10 秒）" };
      const info = box(ctx);
      const paint = () => {
        info.innerHTML = row("position-updated", `<b>${s.yaw.toFixed(1)}°, ${s.pitch.toFixed(1)}°</b>`) + row("zoom-updated", `<b>${s.zoom.toFixed(0)}</b>`) +
          row("click", `<b>${s.click}</b>`) + (s.px ? row("原圖像素", `<b>${s.px}</b>`) : "") + row("事件總數", `<b>${fmt(s.events)}</b>`) + row("陀螺儀", s.gyro);
      };
      viewer.addEventListener("position-updated", ({ position }) => { s.yaw = toDeg(position.yaw); s.pitch = toDeg(position.pitch); s.events++; });
      viewer.addEventListener("zoom-updated", ({ zoomLevel }) => { s.zoom = zoomLevel; s.events++; });
      viewer.addEventListener("click", ({ data }) => {
        if (data.rightclick) return;
        s.events++; s.n++;
        s.click = `${toDeg(data.yaw).toFixed(1)}°, ${toDeg(data.pitch).toFixed(1)}°`;
        s.px = `x ${fmt(data.textureX)}・y ${fmt(data.textureY)}`;
        markers.addMarker({ id: `p${s.n}`, position: { yaw: data.yaw, pitch: data.pitch }, html: `<span class="pv-tag">#${s.n}</span>`,
          tooltip: `第 ${s.n} 個點：${s.click}` });
      });
      ctx.interval(paint, 200); paint();
      gyro.isSupported().then((ok) => {
        s.gyro = ok ? "<b>支援</b>（收到含 alpha 的方向資料），導覽列出現陀螺儀按鈕" : "不支援（10 秒內沒收到方向感測資料，桌機多半如此）";
      });
      const SHOTS = [{ yaw: 36, pitch: 3.5, zoom: 75 }, { yaw: 156, pitch: 8, zoom: 45 }, { yaw: -77, pitch: -22, zoom: 60 }, { yaw: 20, pitch: 0, zoom: 0 }];
      ["夕陽特寫", "別墅", "繫船柱", "全景"].forEach((t, i) => ctx.button(t, () => {
        const p = SHOTS[i];
        viewer.animate({ yaw: deg(p.yaw), pitch: deg(p.pitch), zoom: p.zoom, speed: "3rpm" });
      }, { primary: i === 0 }));
      ctx.button("清除標記", () => { markers.clearMarkers(); s.n = 0; });
    },
  },
  {
    id: "cruise", title: "自動巡航",
    api: "AutorotatePlugin({ keypoints: [{ markerId, pause, tooltip }] })",
    desc: "自動旋轉不只是等速繞圈：設定 keypoints 後，鏡頭會依序飛到每個標記，停留指定時間並跳出說明，形成無人操作的導覽；也可切回一般繞圈並調整轉速。",
    hint: "看鏡頭依序停在六個標記；拖曳會暫停巡航",
    mount(ctx) {
      ctx.html('<div class="pv-host"></div>');
      const KP = [
        { markerId: "sun", pause: 2500, tooltip: "第 1 站：潟湖夕陽" }, { markerId: "tower", pause: 1500, tooltip: "第 2 站：遠方鐘樓" },
        { markerId: "steps", pause: 2000, tooltip: "第 3 站：水岸石階" }, { markerId: "villa", pause: 2500, tooltip: "第 4 站：水岸別墅" },
        { markerId: "houses", pause: 2000, tooltip: "第 5 站：運河老房子" }, { markerId: "bollard", pause: 2000, tooltip: "第 6 站：繫船柱" },
      ];
      let rpm = 2;
      const viewer = makeViewer(ctx, {
        panorama: PANO, defaultYaw: deg(20), defaultZoomLvl: 35, navbar: ["autorotate", "zoom", "fullscreen"],
        plugins: [
          [MarkersPlugin, { markers: MARKERS }],
          [AutorotatePlugin, { autostartDelay: 4000, autostartOnIdle: true, autorotateSpeed: `${rpm}rpm` }],
        ],
      });
      const autorotate = viewer.getPlugin(AutorotatePlugin);
      // Keypoints reference markers, which only exist once the panorama is ready.
      viewer.addEventListener("ready", () => { autorotate.setKeypoints(KP); autorotate.start(); }, { once: true });
      const info = box(ctx);
      let on = false, mode = "關鍵點";
      autorotate.addEventListener("autorotate", ({ autorotateEnabled }) => { on = autorotateEnabled; });
      const paint = () => {
        const p = viewer.getPosition();
        info.innerHTML = row("狀態", on ? "<b>巡航中</b>" : "暫停") + row("模式", mode) + row("轉速", `<b>${rpm} rpm</b>`) + row("yaw", `<b>${toDeg(p.yaw).toFixed(0)}°</b>`);
      };
      ctx.interval(paint, 250); paint();
      ctx.group(["依關鍵點", "等速繞圈"], 0, (i) => {
        mode = i ? "等速繞圈" : "關鍵點";
        autorotate.setKeypoints(i ? null : KP);
        autorotate.start();
      });
      ctx.slider("轉速", { min: 0.5, max: 6, step: 0.5, value: rpm, format: (v) => `${v} rpm` }, (v) => {
        rpm = v; autorotate.setOptions({ autorotateSpeed: `${v}rpm` });
      });
      ctx.button("開始／暫停", () => (autorotate.isEnabled() ? autorotate.stop() : autorotate.start()), { primary: true });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "markers.setMarkers(n 個) ＋ 每格 viewer.rotate()",
    desc: "鏡頭持續旋轉，同時放上 n 個標記，量測幀率何時掉到 30 FPS 以下。html 與 image 標記是 DOM 元素，每格都要重新計算位置；imageLayer 是 WebGL 網格，壓力落在 GPU 繪製。",
    hint: "按「自動加壓」逐級增加標記，或拖曳手動滑桿",
    mount(ctx) {
      ctx.html('<div class="pv-stress"><div class="pv-host" style="top:0"></div></div>');
      const viewer = makeViewer(ctx, { panorama: PANO, defaultZoomLvl: 20, navbar: false, plugins: [MarkersPlugin] });
      const markers = viewer.getPlugin(MarkersPlugin);
      let kind = "html", count = 0, setMs = 0, ready = false;
      const GOLD = Math.PI * (3 - Math.sqrt(5));
      const make = (n) => Array.from({ length: n }, (_, i) => {
        const position = { yaw: (i * GOLD) % (2 * Math.PI), pitch: Math.asin(1 - (2 * (i + 0.5)) / n) * 0.9 };
        if (kind === "html") return { id: `m${i}`, position, html: '<div class="pv-dot"></div>' };
        if (kind === "image") return { id: `m${i}`, position, image: PIN_SVG, size: { width: 22, height: 22 }, anchor: "bottom center" };
        return { id: `m${i}`, position, imageLayer: PIN_SVG, size: { width: 26, height: 26 } };
      });
      const apply = (n) => {
        count = n;
        if (!ready) return;
        const t0 = performance.now();
        markers.setMarkers(make(n));
        setMs = performance.now() - t0;
      };
      viewer.addEventListener("ready", () => { ready = true; apply(count); }, { once: true });
      ctx.raf((t, dt) => { if (ready) { const p = viewer.getPosition(); viewer.rotate({ yaw: p.yaw + dt * 0.00035, pitch: deg(6) }); } });
      ctx.group(["html", "image", "imageLayer"], 0, (i) => { kind = ["html", "image", "imageLayer"][i]; apply(count); });
      ctx.ramp({
        label: "標記數", unit: "個",
        steps: [50, 100, 250, 500, 1000, 2000, 4000],
        minFps: 30,
        apply,
        metrics: () => ({ 類型: kind, "DOM 標記": viewer.container.querySelectorAll(".psv-marker--normal").length,
          "畫面內 DOM": viewer.container.querySelectorAll(".psv-marker--normal.psv-marker--visible").length, setMarkers: `${setMs.toFixed(0)} ms` }),
        note: "標記以黃金角螺旋均勻撒在整個球面，鏡頭每格轉動，所以每格都要重算所有標記的投影位置（看不到的也要判斷可見性）。html／image 會讓瀏覽器每格搬動大量 DOM；imageLayer 不產生 DOM，改為每個標記一個 three.js 網格。上方按鈕可切換類型比較。",
      });
    },
  },
] });
</script>
</body>
