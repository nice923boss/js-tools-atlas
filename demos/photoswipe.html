<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhotoSwipe 示範：縮圖放大燈箱</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app { position: fixed; inset: 0; padding: 14px 14px 46px; display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); gap: 10px; }
  header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 17px; }
  header span { color: var(--muted); font-size: 12px; }
  #gallery {
    display: grid; gap: 8px; min-height: 0;
    grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); grid-auto-flow: dense;
  }
  #gallery a { position: relative; display: block; border-radius: 8px; overflow: hidden; min-height: 0; }
  #gallery a.big { grid-column: span 2; grid-row: span 2; }
  #gallery a.wide { grid-column: span 2; }
  #gallery img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  #gallery a:hover img { transform: scale(1.05); }
  #gallery a span {
    position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 999px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 11.5px; backdrop-filter: blur(4px);
  }
  /* Custom PhotoSwipe UI elements registered through the uiRegister event */
  .pswp__custom-caption {
    position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px));
    padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,.6); color: #fff; text-align: center;
    font: 13px/1.6 var(--font); backdrop-filter: blur(6px);
  }
  .pswp__custom-caption b { display: block; font-size: 15px; }
  .pswp__custom-caption:empty { display: none; }
  .pswp__thumbs { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 6px; padding: 0 10px; }
  .pswp__thumbs button {
    width: 58px; height: 40px; padding: 0; border-radius: 5px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; opacity: .55; background: none; transition: opacity .2s, border-color .2s;
  }
  .pswp__thumbs button.on { opacity: 1; border-color: #f7df1e; }
  .pswp__thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pswp__button--download-button { display: grid; place-items: center; }
  .pswp__button--download-button svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; }
  @media (max-width: 560px) {
    #gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); }
    #gallery a.big { grid-column: span 2; grid-row: span 1; }
    #gallery a span { font-size: 10.5px; }
    .pswp__thumbs button { width: 34px; height: 26px; }
    .pswp__custom-caption { bottom: 54px; }
  }
</style>
</head>
<body>
<div class="app">
  <header><h1>光影旅記攝影集</h1><span>點任一張照片，從縮圖原地放大展開</span></header>
  <div id="gallery"></div>
</div>
<div class="hint">燈箱內可滾輪縮放、拖曳平移、左右滑動換張，Esc 關閉</div>

<script type="module">
// PhotoSwipe v5: the lightbox module is tiny; the core is lazy-loaded on first open via pswpModule().
import PhotoSwipeLightbox from "https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js";

const PHOTOS = [
  [7, "big", "母獅凝視", "非洲草原", "長鏡頭在車上等了兩個小時，牠終於轉頭看向鏡頭。"],
  [1, "", "峽灣晨光", "北歐峽灣", "清晨沒有風，水面像鏡子一樣倒映整片山壁。"],
  [5, "", "瀑布與彩虹", "山谷步道", "午後陽光斜射，水霧裡才看得到這道彩虹。"],
  [2, "", "紅岩峽谷", "沙漠峽谷", "光線從岩縫灑落，岩壁被照成一層層的紅。"],
  [6, "", "水母漂浮", "海洋館", "藍色背景下的水母，用慢快門拍出柔和的觸手。"],
  [3, "wide", "山谷公路", "高山公路", "一路彎進雲裡的公路，是自駕旅行最期待的路段。"],
  [4, "", "毛毯裡的巴哥", "旅館房間", "旅伴兼行李監督員，每天早上都不肯起床。"],
  [8, "wide", "海象午睡", "極地海岸", "整片海灘的海象擠在一起，此起彼落的打呼聲。"],
];

const gallery = document.getElementById("gallery");
PHOTOS.forEach(([n, cls, title, place, note]) => {
  const a = document.createElement("a");
  a.href = `_shared/img/photo-${n}.jpg`;
  a.className = cls;
  a.dataset.pswpWidth = 1200;
  a.dataset.pswpHeight = 800;
  a.dataset.cropped = "true";
  a.dataset.title = title;
  a.dataset.place = place;
  a.dataset.note = note;
  a.innerHTML = `<img src="_shared/img/photo-${n}.jpg" alt="${title}"><span>${title}</span>`;
  gallery.append(a);
});

const lightbox = new PhotoSwipeLightbox({
  gallery: "#gallery",
  children: "a",
  pswpModule: () => import("https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js"),
  showHideAnimationType: "zoom",
  bgOpacity: 0.94,
  wheelToZoom: true,
  secondaryZoomLevel: 2,
  maxZoomLevel: 4,
  paddingFn: (vp) => (vp.x < 560 ? { top: 50, bottom: 110, left: 0, right: 0 } : { top: 30, bottom: 130, left: 60, right: 60 }),
  closeTitle: "關閉", zoomTitle: "縮放", arrowPrevTitle: "上一張", arrowNextTitle: "下一張",
  errorMsg: "照片無法載入", indexIndicatorSep: " / ",
});

// Extra UI: download button, caption and thumbnail strip, all driven by PhotoSwipe's change event.
lightbox.on("uiRegister", () => {
  const pswp = lightbox.pswp;
  pswp.ui.registerElement({
    name: "download-button", order: 8, isButton: true, tagName: "a",
    html: '<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>',
    onInit: (el, p) => {
      el.setAttribute("download", "");
      el.title = "下載原圖";
      p.on("change", () => { el.href = p.currSlide.data.src; });
    },
  });
  pswp.ui.registerElement({
    name: "custom-caption", order: 9, isButton: false, appendTo: "root",
    onInit: (el, p) => {
      p.on("change", () => {
        const d = p.currSlide.data.element.dataset;
        el.innerHTML = `<b>${d.title}．${d.place}</b>${d.note}`;
      });
    },
  });
  pswp.ui.registerElement({
    name: "thumbs", order: 10, isButton: false, appendTo: "root",
    onInit: (el, p) => {
      PHOTOS.forEach(([n], i) => {
        const b = document.createElement("button");
        b.innerHTML = `<img src="_shared/img/photo-${n}.jpg" alt="">`;
        b.onclick = () => p.goTo(i);
        el.append(b);
      });
      p.on("change", () => [...el.children].forEach((b, i) => b.classList.toggle("on", i === p.currIndex)));
    },
  });
});
lightbox.init();

// Open the first photo shortly after load so the zoom-from-thumbnail animation is visible right away.
window.addEventListener("load", () => setTimeout(() => lightbox.loadAndOpen(0), 600));
</script>
</body>
</html>
