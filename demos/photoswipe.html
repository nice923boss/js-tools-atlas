<style>
  /* Shared layout */
  .ps-pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px; min-height: 0; min-width: 0; }
  /* A host is the containing block of PhotoSwipe's fixed root, so the lightbox lives inside the stage. */
  .ps-host { position: relative; contain: layout paint; container-type: size; min-width: 0; min-height: 0; }
  .ps-host .pswp { --pswp-root-z-index: 5; font-family: var(--font); }
  .ps-overlay { position: absolute; pointer-events: none; }
  .ps-overlay .pswp { pointer-events: auto; }
  .ps-view { border-radius: 12px; border: 1px solid var(--line); background: #08090b; overflow: hidden; }
  .ps-empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }
  .ps-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font: 600 11px/1.5 var(--font); color: #0e1013; background: var(--c); white-space: nowrap; }
  .ps-mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .ps-chip { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 5px 12px; border-radius: 999px; background: rgba(0,0,0,.62); color: #fff; font: 12px/1.5 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; backdrop-filter: blur(6px); pointer-events: none; }
  .ps-chip b { font-family: var(--mono); color: var(--accent); font-weight: 600; }

  /* 1. gallery */
  .ps1 { position: absolute; inset: 0; padding: 14px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
  .ps1 header { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .ps1 h1 { margin: 0; font-size: 17px; }
  .ps1 header span { color: var(--muted); font-size: 12px; }
  .ps1-grid { display: grid; gap: 8px; min-height: 0; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); grid-auto-flow: dense; }
  .ps1-grid a { position: relative; display: block; border-radius: 8px; overflow: hidden; min-height: 0; }
  .ps1-grid a.big { grid-column: span 2; grid-row: span 2; }
  .ps1-grid a.wide { grid-column: span 2; }
  .ps1-grid img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .ps1-grid a:hover img { transform: scale(1.05); }
  .ps1-grid a span { position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 11.5px; backdrop-filter: blur(4px); }
  .ps1-over { inset: 0; z-index: 120; }
  .ps-s1 .pswp__custom-caption { position: absolute; left: 50%; bottom: 78px; transform: translateX(-50%); width: max-content; max-width: min(560px, calc(100% - 32px)); padding: 8px 14px; border-radius: 10px; background: rgba(0,0,0,.6); color: #fff; text-align: center; font: 13px/1.6 var(--font); backdrop-filter: blur(6px); }
  .ps-s1 .pswp__custom-caption b { display: block; font-size: 15px; }
  .ps-s1 .pswp__custom-caption:empty { display: none; }
  .ps-s1 .pswp__thumbs { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 6px; padding: 0 10px; }
  .ps-s1 .pswp__thumbs button { width: 58px; height: 40px; padding: 0; border-radius: 5px; overflow: hidden; cursor: pointer; border: 2px solid transparent; opacity: .55; background: none; transition: opacity .2s, border-color .2s; }
  .ps-s1 .pswp__thumbs button.on { opacity: 1; border-color: var(--accent); }
  .ps-s1 .pswp__thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ps-s1 .pswp__button--download-button { display: grid; place-items: center; }
  .ps-s1 .pswp__button--download-button svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; }
  @container (max-width: 560px) {
    .ps-s1 .pswp__thumbs button { width: 32px; height: 24px; }
    .ps-s1 .pswp__custom-caption { bottom: 50px; font-size: 12px; }
  }
  @container (max-height: 480px) {
    .ps-s1 .pswp__thumbs button { width: 34px; height: 24px; }
    .ps-s1 .pswp__custom-caption { bottom: 46px; padding: 5px 10px; font-size: 12px; }
    .ps-s1 .pswp__custom-caption b { font-size: 13px; }
  }
  @media (max-width: 560px) {
    .ps1 { padding: 10px; }
    .ps1-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); }
    .ps1-grid a.big { grid-row: span 1; }
    .ps1-grid a span { font-size: 10.5px; }
  }

  /* 2. animation */
  .ps2-grid { display: grid; gap: 8px; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); min-height: 0; }
  .ps2-grid a { position: relative; display: block; overflow: hidden; border-radius: 10px; min-height: 0; border: 1px solid var(--line); }
  .ps2-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ps2-grid a span { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,.6); color: #fff; font: 600 12px/1.5 var(--mono); }
  .ps2-over { inset: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); border-radius: 10px; }
  @media (max-width: 560px) { .ps2-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); } }

  /* 3. mixed content */
  .ps3 { grid-template-columns: minmax(190px, 30%) minmax(0, 1fr); }
  .ps3-list { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; }
  .ps3-list button { appearance: none; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg); font: 13px/1.4 var(--font); cursor: pointer; min-width: 0; }
  .ps3-list button.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .ps3-list button small { grid-column: 1 / -1; color: var(--muted); font: 11px/1.4 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps3-list .ps3-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ps-trip { width: min(440px, calc(100% - 32px)); max-height: calc(100% - 100px); margin: 60px auto 0; overflow: hidden; padding: 18px 20px; border-radius: 14px; background: #f6f5f1; color: #1c1c1a; font: 13px/1.6 var(--font); }
  .ps-trip h3 { margin: 0 0 4px; font-size: 18px; }
  .ps-trip p { margin: 0 0 10px; color: #6d6b64; }
  .ps-trip ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .ps-trip li { display: grid; grid-template-columns: 54px 1fr; gap: 8px; padding: 8px 10px; border-radius: 9px; background: #fff; border-left: 4px solid var(--c); }
  .ps-trip li b { font-family: var(--mono); }
  .ps-err-wrap { display: grid; place-items: center; padding: 12px; }
  .ps-err { display: grid; gap: 10px; justify-items: center; padding: 18px 22px; border-radius: 12px; background: rgba(247,37,133,.14); border: 1px solid var(--c3); color: #fff; font: 13px/1.6 var(--font); text-align: center; }
  .ps-err b { font-size: 15px; }
  @media (max-width: 560px) {
    .ps3 { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .ps3-list { flex-direction: row; flex-wrap: wrap; }
    .ps3-list button { grid-template-columns: auto; padding: 4px 8px; font-size: 12px; }
    .ps3-list button small, .ps3-list .ps3-name { display: none; }
  }

  /* 4. zoom */
  .ps4 { grid-template-rows: minmax(0, 1fr); }
  .ps-hud { position: absolute; left: 10px; top: 54px; display: grid; gap: 7px; width: min(300px, calc(100% - 20px)); padding: 9px 12px; border-radius: 10px; background: rgba(0,0,0,.66); color: #fff; font: 12px/1.4 var(--font); backdrop-filter: blur(6px); pointer-events: none; }
  .ps-hud .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ps-hud .row b { font: 700 18px/1 var(--mono); color: var(--accent); }
  .ps-hud .scale { position: relative; height: 12px; border-radius: 4px; background: rgba(255,255,255,.1); }
  .ps-hud .scale i { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--c); }
  .ps-hud .scale .cur { width: 10px; height: 10px; top: 1px; margin-left: -5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px #000; }
  .ps-hud .vals { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 2px 8px; font-size: 11px; }
  .ps-hud .vals span { color: var(--c); white-space: nowrap; }
  .ps-hud .vals span b { font: 600 11px var(--mono); }

  /* 5. virtual */
  .ps5 { grid-template-rows: minmax(0, 1fr) auto auto; }
  .ps5-row { display: flex; align-items: center; gap: 12px; }
  .ps5-row .ps5-strip { flex: 1; min-width: 0; }
  .ps5-keys { display: flex; gap: 10px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .ps5-keys span { display: inline-flex; align-items: center; gap: 4px; }
  .ps5-keys i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  @media (max-width: 560px) { .ps5-keys { display: none; } }
  .ps5-strip { display: grid; grid-template-columns: repeat(41, minmax(0, 1fr)); gap: 2px; height: 26px; }
  .ps5-strip i { border-radius: 3px; background: rgba(255,255,255,.06); border: 1px solid transparent; }
  .ps5-strip i.made { border-color: var(--c2); }
  .ps5-strip i.done { background: color-mix(in srgb, var(--c4) 70%, transparent); }
  .ps5-strip i.cur { background: var(--accent); border-color: var(--accent); }
  .ps5-strip i.out { opacity: 0; }
  .ps5-info { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
  .ps5-info b { color: var(--fg); font-family: var(--mono); font-weight: 600; }

  /* 6. events */
  .ps6 { grid-template-columns: minmax(220px, 36%) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .ps6 .ps-view { grid-column: 2; grid-row: 1 / 3; }
  .ps6-thumbs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .ps6-thumbs a { display: block; aspect-ratio: 3 / 2; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .ps6-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ps6-log { margin: 0; padding: 6px; list-style: none; overflow: hidden; min-height: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); display: flex; flex-direction: column; gap: 2px; }
  .ps6-log li { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 2px 6px; border-radius: 5px; font: 12px/1.5 var(--mono); border-left: 3px solid var(--c); white-space: nowrap; }
  .ps6-log li span:nth-child(2) { overflow: hidden; text-overflow: ellipsis; }
  .ps6-log li .t, .ps6-log li .d { color: var(--muted); font-size: 11px; }
  .ps6-log li.fresh { background: rgba(255,255,255,.07); }
  @media (max-width: 560px) {
    .ps6 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.2fr) auto minmax(0, 1fr); }
    .ps6 .ps-view { grid-column: 1; grid-row: 1; }
    .ps6-log li { grid-template-columns: 46px minmax(0, 1fr); }
    .ps6-log li .d { display: none; }
  }

  /* 7. stress */
  .ps7 { position: absolute; inset: 8px 8px 8px 350px; }
  @media (max-width: 760px) { .ps7 { inset: 8px; } .ps7 .ps-empty { display: none; } }
</style>

<body>
<script src="_shared/showcase.js"></script>
<script type="module">
// PhotoSwipe v5: the lightbox module is tiny; the core can be lazy-loaded through pswpModule().
import PhotoSwipeLightbox from "https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe-lightbox.esm.min.js";
import PhotoSwipe from "https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js";

const { h, fmt, fmtMs } = Showcase;
const css = getComputedStyle(document.documentElement);
const MONO = css.getPropertyValue("--mono").trim() || "monospace";
const C = [1, 2, 3, 4, 5, 6].map((i) => css.getPropertyValue(`--c${i}`).trim());
const IMG = (n) => `_shared/img/photo-${n}.jpg`;
const ZH = {
  closeTitle: "關閉", zoomTitle: "縮放", arrowPrevTitle: "上一張", arrowNextTitle: "下一張",
  errorMsg: "圖片無法載入", indexIndicatorSep: " / ",
};
const PHOTOS = [
  [7, "big", "母獅凝視", "非洲草原", "長鏡頭在車上等了兩個小時，牠終於轉頭看向鏡頭。"],
  [1, "", "峽灣晨光", "北歐峽灣", "清晨沒有風，水面像鏡子一樣倒映整片山壁。"],
  [5, "", "瀑布與彩虹", "山谷步道", "午後陽光斜射，水霧裡才看得到這道彩虹。"],
  [2, "", "紅岩峽谷", "沙漠峽谷", "光線從岩縫灑落，岩壁被照成一層層的紅。"],
  [6, "", "水母漂浮", "海洋館", "藍色背景下的水母，用慢快門拍出柔和的觸手。"],
  [3, "wide", "山谷公路", "高山公路", "一路彎進雲裡的公路，是自駕旅行最期待的路段。"],
  [4, "", "毛毯裡的巴哥", "旅館房間", "旅伴兼行李監督員，每天早上都不肯起床。"],
  [8, "wide", "海象午睡", "極地海岸", "整片海灘的海象擠在一起，此起彼落的打呼聲。"],
];

// ---------- helpers: keep a PhotoSwipe instance inside a host element ----------
// appendToEl puts the root in the host; getViewportSizeFn sizes slides to it; the scroll offset
// and the thumbnail bounds are shifted by the host position so pointer zoom and zoom-in animation line up.
const inHost = (host) => ({ appendToEl: host, getViewportSizeFn: () => ({ x: host.clientWidth, y: host.clientHeight }) });
function pin(target, host, getP) {
  const fix = () => {
    const p = getP();
    if (!p) return;
    const r = host.getBoundingClientRect();
    if (p.offset.x !== r.left || p.offset.y !== r.top) p.setScrollOffset(r.left, r.top);
  };
  target.on("gettingData", fix);
  target.on("updateScrollOffset", fix);
  target.addFilter("thumbBounds", (b) => {
    if (!b) return b;
    const r = host.getBoundingClientRect();
    return { ...b, x: b.x - r.left, y: b.y - r.top };
  });
}
// pswp.destroy() is a no-op during the opening animation, so force a synchronous teardown.
function kill(p) {
  if (!p || p.__killed) return;
  p.__killed = true;
  p.animations?.stopAll();
  p.isDestroying = true;
  p.destroy();
  if (window.pswp === p) delete window.pswp;
}
function lightbox(ctx, host, opts) {
  const lb = new PhotoSwipeLightbox({ pswpModule: PhotoSwipe, ...ZH, ...inHost(host), ...opts });
  pin(lb, host, () => lb.pswp);
  ctx.onCleanup(() => { lb.shouldOpen = false; kill(lb.pswp); lb.destroy(); });
  return lb;
}
function core(host, opts, setup) {
  const p = new PhotoSwipe({ ...ZH, ...inHost(host), ...opts });
  pin(p, host, () => p);
  if (setup) setup(p);
  p.init();
  return p;
}
// Options for an always-open, embedded viewer.
const INLINE = { close: false, escKey: false, closeOnVerticalDrag: false, pinchToClose: false, bgClickAction: false, bgOpacity: 1, showHideAnimationType: "fade" };
const loop = (promise) => promise.catch((e) => { if (e?.name !== "AbortError") console.error(e); });

// ---------- generated artwork (canvas -> Blob URL), cached for the page lifetime ----------
const artCache = new Map();
function art(w, h2, hue, label) {
  const key = `${w}x${h2}-${hue}-${label}`;
  if (!artCache.has(key)) artCache.set(key, new Promise((resolve) => {
    const c = document.createElement("canvas");
    c.width = w; c.height = h2;
    const g = c.getContext("2d");
    const grd = g.createLinearGradient(0, 0, w, h2);
    grd.addColorStop(0, `hsl(${hue} 65% 20%)`);
    grd.addColorStop(1, `hsl(${(hue + 50) % 360} 75% 52%)`);
    g.fillStyle = grd; g.fillRect(0, 0, w, h2);
    const m = Math.min(w, h2);
    g.strokeStyle = "rgba(255,255,255,.09)"; g.lineWidth = 1;
    for (let x = 0; x < w; x += m / 10) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h2); g.stroke(); }
    for (let y = 0; y < h2; y += m / 10) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
    g.strokeStyle = "rgba(255,255,255,.2)"; g.lineWidth = m * 0.008;
    for (let r = m * 0.1; r < Math.hypot(w, h2) / 2; r += m * 0.1) { g.beginPath(); g.arc(w / 2, h2 / 2, r, 0, Math.PI * 2); g.stroke(); }
    g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `700 ${Math.round(m * 0.16)}px ${MONO}`;
    g.fillText(label, w / 2, h2 / 2 - m * 0.04);
    g.font = `400 ${Math.round(m * 0.055)}px ${MONO}`;
    g.fillStyle = "rgba(255,255,255,.75)";
    g.fillText(`${w} × ${h2} px`, w / 2, h2 / 2 + m * 0.12);
    c.toBlob((b) => resolve(URL.createObjectURL(b)), "image/jpeg", 0.85);
  }));
  return artCache.get(key);
}

Showcase.run({ scenes: [
  // 1 ------------------------------------------------------------------
  { id: "gallery", title: "攝影集燈箱", api: "new PhotoSwipeLightbox({ gallery, children, pswpModule: () => import(…) })",
    desc: "原本的招牌畫面：縮圖原地放大成全螢幕燈箱，核心模組到第一次開啟才載入；下載鈕、說明與縮圖列都是 registerElement 加上去的。",
    hint: "滾輪縮放、拖曳平移、左右滑動換張，點縮圖列跳張，Esc 關閉",
    mount(ctx) {
      ctx.html(`<div class="ps1"><header><h1>光影旅記攝影集</h1><span>點任一張照片，從縮圖原地放大展開</span></header><div class="ps1-grid"></div></div><div class="ps-host ps-overlay ps1-over"></div>`);
      const grid = ctx.$(".ps1-grid");
      PHOTOS.forEach(([n, cls, title, place, note]) => {
        const a = h("a", { href: IMG(n), class: cls, "data-pswp-width": 1200, "data-pswp-height": 800, "data-cropped": "true", "data-title": title, "data-place": place, "data-note": note });
        a.innerHTML = `<img src="${IMG(n)}" alt="${title}"><span>${title}</span>`;
        grid.append(a);
      });
      const lb = lightbox(ctx, ctx.$(".ps1-over"), {
        gallery: grid, children: "a",
        // the real lazy-load pattern; the module is already cached here, so this resolves at once
        pswpModule: () => import("https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.esm.min.js"),
        mainClass: "ps-s1", showHideAnimationType: "zoom", bgOpacity: 0.94,
        wheelToZoom: true, secondaryZoomLevel: 2, maxZoomLevel: 4,
        paddingFn: (vp) => (vp.x < 560 ? { top: 48, bottom: vp.y < 480 ? 78 : 100, left: 0, right: 0 }
          : { top: 30, bottom: vp.y < 480 ? 80 : 130, left: 60, right: 60 }),
      });
      lb.on("uiRegister", () => {
        const pswp = lb.pswp;
        pswp.ui.registerElement({
          name: "download-button", order: 8, isButton: true, tagName: "a",
          html: '<svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>',
          onInit: (el, p) => {
            el.setAttribute("download", "");
            el.title = "下載原圖";
            p.on("change", () => { el.href = p.currSlide.data.src; });
          },
        });
        pswp.ui.registerElement({
          name: "custom-caption", order: 9, isButton: false, appendTo: "root",
          onInit: (el, p) => p.on("change", () => {
            const d = p.currSlide.data.element.dataset;
            el.innerHTML = `<b>${d.title}．${d.place}</b>${d.note}`;
          }),
        });
        pswp.ui.registerElement({
          name: "thumbs", order: 10, isButton: false, appendTo: "root",
          onInit: (el, p) => {
            PHOTOS.forEach(([n], i) => {
              const b = h("button", { type: "button", "aria-label": `第 ${i + 1} 張` });
              b.innerHTML = `<img src="${IMG(n)}" alt="">`;
              b.onclick = () => p.goTo(i);
              el.append(b);
            });

  // 4 ------------------------------------------------------------------
  { id: "zoom", title: "縮放與手勢", api: "initialZoomLevel・secondaryZoomLevel・maxZoomLevel・slide.zoomTo()・slide.panTo()・on('zoomPanUpdate')",
    desc: "4096×2048 全景圖示範縮放層級：fit、fill、次要（點擊放大）、上限。左下 HUD 是 registerElement 註冊的元件，跟著 zoomPanUpdate 即時更新。",
    hint: "滾輪或雙指縮放、拖曳平移；動一下滑鼠就會停止自動導覽",
    mount(ctx) {
      ctx.html(`<div class="ps-pad ps4"><div class="ps-host ps-view"><div class="ps-empty">燈箱已關閉</div></div></div>`);
      const view = ctx.$(".ps-view");
      const items = [{ src: "_shared/img/panorama.jpg", width: 4096, height: 2048 }, { src: IMG(7), width: 1200, height: 800 }];
      const opts = { initialZoomLevel: "fit", secondaryZoomLevel: 1, maxZoomLevel: 2, imageClickAction: "zoom", wheelToZoom: true };
      let p = null, tour = true, stopPan = null;
      const pct = (z) => `${Math.round(z * 100)}%`;
      const open = (index = 0) => {
        kill(p);
        stopPan?.();
        p = core(view, { ...INLINE, ...opts, dataSource: items, index, loop: false }, (q) => {
          q.on("uiRegister", () => q.ui.registerElement({
            name: "zoom-hud", appendTo: "root", isButton: false,
            onInit: (el) => {
              el.className += " ps-hud";
              el.innerHTML = `<div class="row"><span>目前縮放</span><b class="z">…</b></div><div class="scale"></div><div class="vals"></div>`;
              const z = el.querySelector(".z"), scale = el.querySelector(".scale"), vals = el.querySelector(".vals");
              const draw = () => {
                const s = q.currSlide;
                if (!s?.zoomLevels) return;
                const L = s.zoomLevels, lo = Math.min(L.min, L.fit), hi = L.max;
                const at = (v) => `${((v - lo) / (hi - lo || 1)) * 100}%`;
                z.textContent = pct(s.currZoomLevel);
                const marks = [["fit", L.fit, C[1]], ["fill", L.fill, C[3]], ["次要", L.secondary, C[4]], ["上限", L.max, C[2]]];
                scale.innerHTML = marks.map(([, v, c]) => `<i style="left:${at(v)};--c:${c}"></i>`).join("") + `<i class="cur" style="left:${at(s.currZoomLevel)}"></i>`;
                vals.innerHTML = marks.map(([l, v, c]) => `<span style="--c:${c}">${l} <b>${pct(v)}</b></span>`).join("");
              };
              q.on("zoomPanUpdate", draw);
              q.on("change", draw);
            },
          }));
          q.on("openingAnimationEnd", () => { if (tour) runTour(); });
        });
      };
      // Auto tour: zoom to 100% around the centre, then pan the panorama back and forth.
      const runTour = () => loop((async () => {
        await ctx.sleep(500);
        const s = p?.currSlide;
        if (!tour || !s || p.currIndex !== 0) return;
        s.zoomTo(s.zoomLevels.secondary, p.getViewportCenterPoint(), 900);
        await ctx.sleep(1000);
        if (!tour) return;
        let t = 0;
        stopPan = ctx.raf((now, dt) => {
          const sl = p?.currSlide;
          if (!tour || !sl || p.currIndex !== 0) return stopPan?.();
          t += dt / 1000;
          const k = (Math.sin(t * 0.6 - Math.PI / 2) + 1) / 2;
          sl.panTo(sl.bounds.max.x + (sl.bounds.min.x - sl.bounds.max.x) * k, sl.pan.y);
        });
      })());
      const halt = (e) => { if (e.isTrusted && tour) { tour = false; stopPan?.(); } };
      ctx.on(view, "pointerdown", halt);
      ctx.on(view, "wheel", halt, { passive: true });
      ctx.group(["fit", "fill", "100%"], 0, (i) => { opts.initialZoomLevel = ["fit", "fill", 1][i]; tour = false; open(p?.currIndex ?? 0); });
      ctx.select("點圖", [
        { value: "zoom", label: "zoom 放大" }, { value: "zoom-or-close", label: "zoom-or-close" },
        { value: "next", label: "next 下一張" }, { value: "toggle-controls", label: "切換介面" },
      ], "zoom", (v) => { opts.imageClickAction = v; if (p) p.options.imageClickAction = v; });
      ctx.toggle("滾輪縮放", true, (v) => { opts.wheelToZoom = v; if (p) p.options.wheelToZoom = v; });
      ctx.button("重新導覽", () => { tour = true; open(0); }, { primary: true });
      ctx.onCleanup(() => kill(p));
      open(0);
    } },

  // 5 ------------------------------------------------------------------
  { id: "virtual", title: "虛擬圖庫", api: "addFilter('numItems')・addFilter('itemData', (data, index) => …)・preload: [1, n]",
    desc: "dataSource 是空陣列，張數與每張的資料都由濾鏡即時產生。下方色帶是目前位置附近 41 格：藍框是已建立內容，綠底是圖片已載入，可看到預載窗與快取淘汰。",
    hint: "調整「預載」看綠色範圍變化；關掉自動翻頁後可用方向鍵",
    mount(ctx) {
      ctx.html(`<div class="ps-pad ps5"><div class="ps-host ps-view"><div class="ps-empty">燈箱已關閉</div></div><div class="ps5-row"><div class="ps5-strip"></div><div class="ps5-keys"><span><i style="background:var(--accent)"></i>目前</span><span><i style="border:1px solid var(--c2)"></i>已建立</span><span><i style="background:var(--c4)"></i>已載入</span></div></div><div class="ps5-info"></div></div>`);
      const view = ctx.$(".ps-view"), strip = ctx.$(".ps5-strip"), info = ctx.$(".ps5-info");
      for (let i = 0; i < 41; i++) strip.append(h("i"));
      const cells = [...strip.children];
      let total = 1000, ahead = 2, auto = true, p = null, calls = 0, made = 0;
      const created = new Set(), loaded = new Set(), cache = new Map();
      const g = h("canvas", { width: 640, height: 400 }).getContext("2d");
      // Generate a JPEG data URL per index on demand; keep only a small LRU so memory stays flat.
      const image = (i) => {
        if (cache.has(i)) return cache.get(i);
        const hue = (i * 47) % 360;
        g.fillStyle = `hsl(${hue} 55% 30%)`; g.fillRect(0, 0, 640, 400);
        g.fillStyle = `hsl(${(hue + 40) % 360} 70% 55%)`;
        g.beginPath(); g.arc(320 + Math.sin(i) * 160, 200, 120, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
        g.font = `700 64px ${MONO}`; g.fillText(`#${fmt(i + 1)}`, 320, 190);
        g.font = `400 20px ${MONO}`; g.fillText(`itemData(${i})`, 320, 250);
        const url = g.canvas.toDataURL("image/jpeg", 0.7);
        made++;
        cache.set(i, url);
        if (cache.size > 24) cache.delete(cache.keys().next().value);
        return url;
      };
      const paint = () => {
        const cur = p?.currIndex ?? 0;
        cells.forEach((c, k) => {
          const i = cur - 20 + k;
          c.className = i < 0 || i >= total ? "out" : [i === cur && "cur", created.has(i) && "made", loaded.has(i) && "done"].filter(Boolean).join(" ");
          c.title = `#${i + 1}`;
        });
        info.innerHTML = `<span><b>#${fmt(cur + 1)}</b> / ${fmt(total)}</span><span>itemData <b>${fmt(calls)}</b> 次</span><span>產生 <b>${fmt(made)}</b> 張</span><span>內容快取 <b>${created.size}</b> / <b>${p?.contentLoader.limit ?? "…"}</b></span>`;
      };
      const open = (index) => {
        kill(p);
        created.clear(); loaded.clear();
        p = core(view, { ...INLINE, dataSource: [], index, preload: [1, ahead], loop: false }, (q) => {
          q.addFilter("numItems", () => total);
          q.addFilter("itemData", (data, i) => { calls++; return { src: image(i), width: 640, height: 400, alt: `第 ${i + 1} 張` }; });
          q.on("contentLoad", ({ content }) => created.add(content.index));
          q.on("loadComplete", ({ content }) => loaded.add(content.index));
          q.on("contentDestroy", ({ content }) => { created.delete(content.index); loaded.delete(content.index); });
          q.on("change", paint);
        });
        paint();
      };
      ctx.slider("預載", { min: 0, max: 6, step: 1, value: 2, format: (v) => `[1, ${v}]` }, (v) => { ahead = v; open(p?.currIndex ?? 0); });
      ctx.select("總張數", [{ value: 1000, label: "1,000" }, { value: 100000, label: "10 萬" }, { value: 1000000, label: "100 萬" }], 1000,
        (v) => { total = +v; open(Math.min(p?.currIndex ?? 0, total - 1)); });
      ctx.toggle("自動翻頁", true, (v) => { auto = v; });
      ctx.interval(() => { if (auto && p && !p.isDestroying) p.currIndex >= total - 1 ? p.goTo(0) : p.next(); }, 1100);
      ctx.interval(paint, 250);
      ctx.onCleanup(() => kill(p));
      open(0);
    } },

  // 6 ------------------------------------------------------------------
  { id: "events", title: "事件與控制", api: "lightbox.on(name, fn)・pswp.next()・prev()・toggleZoom()・close()",
    desc: "左側時間軸記錄開啟、換張、縮放、關閉時依序觸發的事件；右上按鈕直接呼叫 PhotoSwipe 實例的方法。",
    hint: "自動腳本會循環開啟、換張、縮放、關閉；按任一控制鈕即改為手動",
    mount(ctx) {
      ctx.html(`<div class="ps-pad ps6"><div class="ps6-thumbs"></div><ul class="ps6-log"></ul><div class="ps-host ps-view"><div class="ps-empty">燈箱已關閉，點縮圖或按「開啟」</div></div></div>`);
      const thumbs = ctx.$(".ps6-thumbs"), log = ctx.$(".ps6-log"), view = ctx.$(".ps-view");
      [1, 5, 6, 3].forEach((n) => {
        const a = h("a", { href: IMG(n), "data-pswp-width": 1200, "data-pswp-height": 800 });
        a.innerHTML = `<img src="${IMG(n)}" alt="">`;
        thumbs.append(a);
      });
      const lb = lightbox(ctx, view, { gallery: thumbs, children: "a", showHideAnimationType: "fade", bgOpacity: 1, wheelToZoom: true });
      const GROUPS = [
        [C[0], ["beforeOpen", "firstUpdate", "gettingData", "initialLayout", "afterInit"]],
        [C[1], ["openingAnimationStart", "openingAnimationEnd", "closingAnimationStart", "closingAnimationEnd"]],
        [C[3], ["change", "slideActivate"]],
        [C[5], ["contentLoad", "loadComplete"]],
        [C[4], ["beforeZoomTo"]],
        [C[2], ["close", "destroy"]],
      ];
      let t0 = performance.now();
      const add = (name, color, detail = "") => {
        if (name === "beforeOpen") t0 = performance.now();
        const li = h("li", { class: "fresh", style: `--c:${color}` },
          h("span", { class: "t", text: `+${Math.round(performance.now() - t0)}ms` }), h("span", { text: name }), h("span", { class: "d", text: detail }));
        log.prepend(li);
        setTimeout(() => li.classList.remove("fresh"), 600);
        while (log.children.length > 40) log.lastChild.remove();
      };
      for (const [color, names] of GROUPS) for (const name of names) {
        lb.on(name, (e) => {
          const i = e.content?.index ?? e.slide?.index ?? (name === "change" ? lb.pswp?.currIndex : undefined);
          add(name, color, name === "beforeZoomTo" ? `→ ${Math.round(e.destZoomLevel * 100)}%` : i != null ? `#${i + 1}` : "");
        });
      }
      lb.init();
      let script = true;
      const manual = (fn) => () => { script = false; fn(); };
      ctx.button("開啟", manual(() => { if (!lb.pswp) lb.loadAndOpen(0); }), { primary: true });
      ctx.button("‹", manual(() => lb.pswp?.prev()), { title: "pswp.prev()" });
      ctx.button("›", manual(() => lb.pswp?.next()), { title: "pswp.next()" });
      ctx.button("縮放", manual(() => lb.pswp?.toggleZoom()), { title: "pswp.toggleZoom()" });
      ctx.button("關閉", manual(() => lb.pswp?.close()), { title: "pswp.close()" });
      ctx.on(thumbs, "pointerdown", (e) => { if (e.isTrusted) script = false; });
      loop((async () => {
        await ctx.sleep(300);
        for (let k = 0; ; k++) {
          if (!script) { await ctx.sleep(400); continue; }
          if (!lb.pswp) lb.loadAndOpen(k % 4);
          await ctx.sleep(1300); if (script) lb.pswp?.next();
          await ctx.sleep(1200); if (script) lb.pswp?.toggleZoom();
          await ctx.sleep(1400); if (script) lb.pswp?.close();
          await ctx.sleep(1100);
        }
      })());
    } },

  // 7 ------------------------------------------------------------------
  { id: "stress", title: "極限測試", kind: "stress", api: "new PhotoSwipe({ dataSource: array(n) }).init()・goTo(i) × 30",
    desc: "dataSource 陣列從 100 筆加到 100 萬筆，量 init() 開啟耗時與隨機跳張 goTo() 的平均耗時；右側保留最後一次開啟的實例。",
    hint: "按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="ps7 ps-host ps-view"><div class="ps-empty">按「開始測試」後，這裡會顯示每一級開啟的燈箱</div></div>`);
      const view = ctx.$(".ps7");
      const FLIPS = 30;
      let p = null, pool = null;
      ctx.onCleanup(() => kill(p));
      ctx.bench({
        label: "dataSource 項目", unit: "筆", sizes: [100, 1000, 10000, 100000, 1000000], target: 200, budget: 2000,
        async prepare(n) {
          pool ||= await Promise.all([200, 30, 150, 300, 90, 260].map((hue, i) => art(960, i % 2 ? 640 : 540, hue, `POOL ${i + 1}`)));
          const data = new Array(n);
          for (let i = 0; i < n; i++) data[i] = { src: pool[i % pool.length], width: 960, height: i % 2 ? 640 : 540, alt: `第 ${i + 1} 張` };
          return data;
        },
        run(n, data) {
          kill(p); p = null;
          let seed = 7;
          const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          const t0 = performance.now();
          const q = core(view, { ...INLINE, showHideAnimationType: "none", dataSource: data, index: Math.floor(n / 2) });
          const tOpen = performance.now() - t0;
          const t1 = performance.now();
          for (let k = 0; k < FLIPS; k++) q.goTo(Math.floor(rand() * n));
          const tFlip = (performance.now() - t1) / FLIPS;
          p = q;
          return `開啟 ${fmtMs(tOpen)}・翻頁 ${tFlip.toFixed(2)} ms`;
        },
        note: "計時包含 init() 建立 DOM 結構、版面計算與第一張投影片，以及 30 次隨機 goTo()。PhotoSwipe 只保留三個投影片容器並依需求讀取資料，所以陣列長度幾乎不影響耗時；準備陣列的時間不計入。若改用 DOM 縮圖當資料來源，開啟時要掃描所有子元素，耗時會隨數量成長。",
      });
