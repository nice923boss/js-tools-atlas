<script src="https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/dist/pixi.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// PixiJS showcase: eight scenes from the original neon vortex to a bunnymark stress ramp.
const rootCss = getComputedStyle(document.documentElement);
const cssVar = (name, fallback) => rootCss.getPropertyValue(name).trim() || fallback;
const C = {
  c1: cssVar("--c1", "#f7df1e"), c2: cssVar("--c2", "#4cc9f0"), c3: cssVar("--c3", "#f72585"),
  c4: cssVar("--c4", "#7bd389"), c5: cssVar("--c5", "#ff8c42"), c6: cssVar("--c6", "#9d8cff"),
};
const COLORS = [C.c1, C.c2, C.c3, C.c4, C.c5, C.c6];
const HEX = COLORS.map((c) => new PIXI.Color(c).toNumber());
const COLOR_NAMES = ["黃", "青", "桃紅", "綠", "橘", "紫"];
const FONT = ["Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "sans-serif"];
const MONO = ["JetBrains Mono", "Consolas", "monospace"];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const fmtN = (n) => n.toLocaleString("en-US");
// Y just below the top-right control cluster, so scene content starts under the buttons.
const belowControls = (ctx) => ctx.controls.offsetHeight + 20;
const PHOTO = (i) => `_shared/img/photo-${i}.jpg`;
const unmounted = () => new DOMException("Scene unmounted", "AbortError");

function canvas2d(w, h, draw) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  return c;
}
// Soft white dot; tinted per sprite or particle.
function glowCanvas(s) {
  return canvas2d(s, s, (g) => {
    const r = s / 2, grd = g.createRadialGradient(r, r, 0, r, r, r);
    grd.addColorStop(0, "rgba(255,255,255,1)");
    grd.addColorStop(0.25, "rgba(255,255,255,0.75)");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
  });
}
// Decoded photo as an uncached texture; null when the scene left while loading.
async function photoTexture(ctx, url) {
  const img = new Image();
  img.src = url;
  await img.decode();
  return ctx.active ? PIXI.Texture.from(img, true) : null;
}
// Status line in the bottom-left corner; returns a setter that takes HTML.
function readout(ctx, parent = ctx.el) {
  const el = document.createElement("div");
  el.className = "readout";
  parent.append(el);
  return (html) => { el.innerHTML = html; };
}

// Pixi v8 Application that fills `box` and follows its size. init() is async, so the scene may
// already be gone when it resolves: destroy right away and abort. Owned resources (textures,
// filters, gradients) are destroyed after the app, objects on the stage go with app.destroy().
async function pixiIn(ctx, box, opts = {}) {
  const owned = [];
  ctx.onCleanup(() => { while (owned.length) owned.pop()(); });
  const app = new PIXI.Application();
  let ready = false;
  ctx.onCleanup(() => { if (ready) app.destroy({ removeView: true }, { children: true }); });
  await app.init({
    width: Math.max(1, box.clientWidth), height: Math.max(1, box.clientHeight),
    resolution: Math.min(2, devicePixelRatio || 1), autoDensity: true, preference: "webgl",
    antialias: true, background: "#0e1013", ...opts,
  });
  if (!ctx.active) { app.destroy({ removeView: true }, { children: true }); throw unmounted(); }
  ready = true;
  box.append(app.canvas);
  const sizeFns = [];
  let pending = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      const w = Math.max(1, box.clientWidth), h = Math.max(1, box.clientHeight);
      if (!ctx.active || (w === app.screen.width && h === app.screen.height)) return;
      app.renderer.resize(w, h);
      sizeFns.forEach((fn) => fn(w, h));
    });
  });
  ro.observe(box);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); });
  const own = (x, ...args) => {
    if (ctx.active) owned.push(() => x.destroy(...args)); else x.destroy(...args);
    return x;
  };
  return { app, own, onSize: (fn) => sizeFns.push(fn) };
}

// FPS plus WebGL draw calls per frame, counted by wrapping the context's draw functions.
const DRAWS = ["drawElements", "drawArrays", "drawElementsInstanced", "drawArraysInstanced"];
function frameStats(ctx, app) {
  const gl = app.renderer.gl;
  let calls = 0, frames = 0, fps = 0, dc = 0, last = performance.now();
  if (gl) {
    for (const n of DRAWS) {
      const orig = gl[n];
      if (typeof orig !== "function") continue;
      gl[n] = function (...a) { calls++; return orig.apply(gl, a); };
    }
    ctx.onCleanup(() => DRAWS.forEach((n) => delete gl[n]));
  }
  ctx.raf((t) => {
    frames++;
    if (t - last >= 500) { fps = (frames * 1000) / (t - last); dc = calls / frames; frames = 0; calls = 0; last = t; }
  });
  return {
    fps: () => fps.toFixed(0),
    dc: () => (!gl ? "不適用" : dc < 10 ? dc.toFixed(1) : dc.toFixed(0)),
    api: gl ? (typeof WebGL2RenderingContext !== "undefined" && gl instanceof WebGL2RenderingContext ? "WebGL 2" : "WebGL 1") : "WebGPU",
  };
}

// 384 x 144 sprite sheet drawn in code: 8 frames each of a spinning coin, a hopping blob and a flapping bird.
function critterAtlas() {
  const dot = (g, x, y, r, fill) => { g.fillStyle = fill; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); };
  return canvas2d(384, 144, (g) => {
    for (let f = 0; f < 8; f++) {
      const x = f * 48 + 24;
      g.save();
      g.translate(x, 24);
      g.scale(Math.max(0.08, Math.abs(Math.cos((2 * Math.PI * f) / 8))), 1);
      dot(g, 0, 0, 17, C.c1);
      g.lineWidth = 3; g.strokeStyle = "#b8860b"; g.stroke();
      g.fillStyle = "#8a6508"; g.font = "bold 18px sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("$", 0, 1);
      g.restore();
      const up = Math.sin((Math.PI * f) / 8), sy = 0.78 + 0.32 * up, by = 92 - 15 * sy - up * 10;
      g.save();
      g.translate(x, by);
      g.scale(1.25 - 0.35 * up, sy);
      dot(g, 0, 0, 15, C.c4);
      g.restore();
      dot(g, x - 5, by - 3, 2.6, "#0e1013");
      dot(g, x + 5, by - 3, 2.6, "#0e1013");
      const wy = 120;
      g.fillStyle = C.c2; g.beginPath(); g.ellipse(x, wy, 14, 11, 0, 0, Math.PI * 2); g.fill();
      g.fillStyle = C.c5; g.beginPath(); g.moveTo(x + 12, wy - 3); g.lineTo(x + 21, wy); g.lineTo(x + 12, wy + 3); g.closePath(); g.fill();
      dot(g, x + 6, wy - 4, 3.2, "#ffffff");
      dot(g, x + 7, wy - 4, 1.6, "#0e1013");
      g.save();
      g.translate(x - 3, wy - 2);
      g.rotate(Math.sin((2 * Math.PI * f) / 8) * 0.9);
      g.fillStyle = C.c6; g.beginPath(); g.ellipse(-8, 0, 11, 5, 0, 0, Math.PI * 2); g.fill();
      g.restore();
    }
  });
}
// 192 x 32 strip with six coloured bunnies for the stress test.
function bunnyAtlas() {
  const blob = (g, x, y, rx, ry, rot) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); g.fill(); };
  return canvas2d(192, 32, (g) => {
    for (let i = 0; i < 6; i++) {
      const x = i * 32 + 16;
      g.fillStyle = COLORS[i];
      blob(g, x - 4, 9, 2.6, 7, -0.15);
      blob(g, x + 3, 8, 2.6, 7, 0.2);
      blob(g, x, 23, 9, 7.5, 0);
      blob(g, x + 1, 16, 6, 6, 0);
      g.fillStyle = "#0e1013";
      blob(g, x + 3, 15, 1.3, 1.3, 0);
    }
  });
}

// Custom filter fragment: blocky horizontal glitch bands plus RGB split, clamped to the input area.
const GLITCH_FRAG = `in vec2 vTextureCoord;
out vec4 finalColor;
uniform sampler2D uTexture;
uniform highp vec4 uInputSize;
uniform vec4 uInputClamp;
uniform float uTime;
float hash(float n) { return fract(sin(n) * 43758.5453); }
void main() {
  vec2 px = vTextureCoord * uInputSize.xy;
  float band = floor(px.y / 18.0 + floor(uTime * 6.0) * 7.0);
  vec2 uv = vTextureCoord;
  if (hash(band) > 0.86) uv.x += (hash(band + 1.0) - 0.5) * 0.08;
  vec2 off = vec2(6.0 * uInputSize.z, 0.0);
  vec2 lo = uInputClamp.xy, hi = uInputClamp.zw;
  vec4 c = texture(uTexture, clamp(uv, lo, hi));
  float r = texture(uTexture, clamp(uv + off, lo, hi)).r;
  float b = texture(uTexture, clamp(uv - off, lo, hi)).b;
  c.rgb = vec3(r, c.g, b) * (0.82 + 0.18 * sin(px.y * 1.6));
  finalColor = c;
}`;

let fontSeq = 0;

Showcase.run({ scenes: [
  {
    id: "vortex", title: "霓虹漩渦",
    api: "new PIXI.ParticleContainer({ texture, dynamicProperties })・new PIXI.Particle()・addParticle()・removeParticles()・blendMode = 'add'",
    desc: "原本的招牌示範升級版：最多 6 萬顆發光粒子放進 ParticleContainer，每格只把位置（打開速度上色時再加顏色）上傳 GPU，以加法混合疊出霓虹光暈；滑鼠周圍的力場把粒子捲成漩渦或推開。",
    hint: "移動滑鼠捲起漩渦・點擊引爆衝擊波・切換粒子數、排斥模式或「速度上色」",
    async mount(ctx) {
      ctx.el.classList.add("neon");
      ctx.html(`<div class="px"></div>`);
      const show = readout(ctx);
      const { app, own, onSize } = await pixiIn(ctx, ctx.$(".px"), { background: "#07080d", antialias: false });
      const tex = own(PIXI.Texture.from(glowCanvas(32), true), true);
      const MAX = 60000;
      const px = new Float32Array(MAX), py = new Float32Array(MAX), vx = new Float32Array(MAX), vy = new Float32Array(MAX);
      // Packed particle colour (bgr + alpha << 24) can be negative, so keep it in a Float64Array.
      const base = new Float64Array(MAX);
      const STOPS = [[0, 0x9d8cff], [0.35, 0x4cc9f0], [0.7, 0xf7df1e], [1, 0xffffff]];
      const LUT = Array.from({ length: 64 }, (_, i) => {
        const f = i / 63;
        let s = 0;
        while (s < STOPS.length - 2 && f > STOPS[s + 1][0]) s++;
        const [f0, a] = STOPS[s], [f1, b] = STOPS[s + 1], u = (f - f0) / (f1 - f0);
        const ch = (sh) => Math.round(((a >> sh) & 255) + (((b >> sh) & 255) - ((a >> sh) & 255)) * u);
        return ((ch(0) << 16) | (ch(8) << 8) | ch(16)) + (((0.4 * 255) | 0) << 24);
      });
      let pc = null, count = 0, mode = 0, tinted = false, time = 0, pointer = null;
      let tx = app.screen.width / 2, ty = app.screen.height / 2;

      function makeParticle(i) {
        const big = Math.random() < 0.03, s = big ? rnd(0.55, 0.85) : rnd(0.12, 0.34);
        const p = new PIXI.Particle({ texture: tex, x: px[i], y: py[i], anchorX: 0.5, anchorY: 0.5, scaleX: s, scaleY: s, tint: HEX[i % 6], alpha: big ? 0.6 : 0.28 });
        base[i] = p.color;
        return p;
      }
      const addChunked = (list) => { for (let i = 0; i < list.length; i += 5000) pc.addParticle(...list.slice(i, i + 5000)); };
      // dynamicProperties are fixed at construction, so toggling colour upload rebuilds the container.
      function build() {
        const old = pc ? pc.particleChildren.slice() : [];
        if (pc) { pc.removeParticles(); pc.destroy(); }
        pc = new PIXI.ParticleContainer({ texture: tex, dynamicProperties: { position: true, color: tinted } });
        pc.blendMode = "add";
        app.stage.addChildAt(pc, 0);
        dim();
        if (!tinted) old.forEach((p, i) => { p.color = base[i]; });
        addChunked(old);
      }
      function populate(n) {
        const have = pc.particleChildren.length, W = app.screen.width, H = app.screen.height;
        if (n < have) pc.removeParticles(n, have);
        const list = [];
        for (let i = have; i < n; i++) {
          px[i] = Math.random() * W; py[i] = Math.random() * H; vx[i] = 0; vy[i] = 0;
          list.push(makeParticle(i));
        }
        addChunked(list);
        count = n;
        dim();
      }
      // Additive glow saturates to white when particles get dense (small screens, 6 萬),
      // so the container alpha falls with particles per pixel. It multiplies into every particle.
      function dim() {
        if (pc) pc.alpha = clamp(Math.sqrt((0.032 * app.screen.width * app.screen.height) / Math.max(1, count)), 0.3, 1);
      }
      const ring = (w) => { const g = new PIXI.Graphics().circle(0, 0, 100).stroke({ width: w, color: 0xffffff }); g.blendMode = "add"; g.alpha = 0; app.stage.addChild(g); return g; };
      const rings = [ring(1.5), ring(1.5), ring(1.5), ring(1.5)];
      const shock = ring(3);
      function burst(x, y) {
        for (let i = 0; i < count; i++) {
          const dx = px[i] - x, dy = py[i] - y, d2 = dx * dx + dy * dy + 400, d = Math.sqrt(d2), k = 9000 / d2;
          vx[i] += (dx / d) * k; vy[i] += (dy / d) * k;
        }
        shock.position.set(x, y);
        shock.scale.set(0.05);
        shock.alpha = 1;
        shock.tint = HEX[(Math.random() * 6) | 0];
      }
      build();
      populate(30000);
      onSize(dim);

      app.ticker.add((tk) => {
        const dt = Math.min(2, tk.deltaTime), W = app.screen.width, H = app.screen.height, repel = mode === 1;
        time += 0.01 * dt;
        const gx = pointer ? pointer.x : W * (0.5 + 0.3 * Math.cos(time * 0.7));
        const gy = pointer ? pointer.y : H * (0.5 + 0.28 * Math.sin(time * 1.1));
        tx += (gx - tx) * 0.1; ty += (gy - ty) * 0.1;
        const R = Math.min(W, H) * 0.45, kids = pc.particleChildren;
        for (let i = 0; i < count; i++) {
          let x = px[i], y = py[i];
          const a = (Math.sin(x * 0.0042 + time) + Math.cos(y * 0.0047 - time * 0.8) + Math.sin((x - y) * 0.0021 + time * 0.5)) * 2.1;
          let fx = Math.cos(a) * 0.06, fy = Math.sin(a) * 0.06;
          const dx = x - tx, dy = y - ty, d = Math.sqrt(dx * dx + dy * dy) + 0.001;
          if (d < R) {
            const f = 1 - d / R, ux = dx / d, uy = dy / d;
            if (repel) { fx += ux * f * 1.4; fy += uy * f * 1.4; }
            else { fx += -uy * f * 0.9 - ux * f * 0.35; fy += ux * f * 0.9 - uy * f * 0.35; }
          }
          const u = (vx[i] + fx * dt) * 0.955, v = (vy[i] + fy * dt) * 0.955;
          vx[i] = u; vy[i] = v;
          x += u * dt; y += v * dt;
          if (x < -10) x = W + 10; else if (x > W + 10) x = -10;
          if (y < -10) y = H + 10; else if (y > H + 10) y = -10;
          px[i] = x; py[i] = y;
          const p = kids[i];
          p.x = x; p.y = y;
          if (tinted) p.color = LUT[Math.min(63, (Math.sqrt(u * u + v * v) * 5) | 0)];
        }
        rings.forEach((g, j) => {
          const ph = (time * 0.9 + j / 4) % 1, r = repel ? ph : 1 - ph;
          g.position.set(tx, ty);
          g.scale.set(Math.max(0.02, (r * R) / 100));
          g.alpha = Math.sin(ph * Math.PI) * (pointer ? 0.5 : 0.22);
          g.tint = HEX[(j + Math.floor(time * 0.5)) % 6];
        });
        if (shock.alpha > 0) {
          shock.scale.set(shock.scale.x + 0.16 * dt);
          shock.alpha = Math.max(0, shock.alpha - 0.03 * dt);
        }
      });

      app.stage.eventMode = "static";
      app.stage.hitArea = app.screen;
      app.stage.on("pointermove", (e) => { pointer = { x: e.global.x, y: e.global.y }; });
      app.stage.on("pointerdown", (e) => { pointer = { x: e.global.x, y: e.global.y }; burst(pointer.x, pointer.y); });
      ctx.on(app.canvas, "pointerleave", () => { pointer = null; });

      ctx.group(["1 萬", "3 萬", "6 萬"], 1, (i) => populate([10000, 30000, 60000][i]));
      ctx.group(["漩渦", "排斥"], 0, (i) => { mode = i; });
      ctx.toggle("速度上色", false, (v) => { tinted = v; build(); });
      const st = frameStats(ctx, app);
      const paint = () => show(`粒子 <b>${fmtN(count)}</b>・draw call <b>${st.dc()}</b>・<b>${st.fps()}</b> FPS・${st.api}`);
      paint();
      ctx.interval(paint, 500);
    },
  },
  {
    id: "sprites", title: "Sprite 批次",
    api: "new PIXI.Spritesheet(texture, data)・await sheet.parse()・new PIXI.AnimatedSprite({ textures })・sprite.blendMode",
    desc: "用程式畫出 384×144 的圖集，交給 Spritesheet 切成 24 格影格，金幣、果凍、小鳥三種 AnimatedSprite 各自播放動畫。共用同一張圖集的 Sprite 會被合併成一次 draw call；改成 96 張獨立材質（超過 GPU 每批可綁定的材質數）或交錯混合模式，批次就會被打斷。",
    hint: "拖動「數量」滑桿・切換三種材質模式，看 draw call 與 FPS 的變化",
    async mount(ctx) {

        if (n < have) {
          if (holderMode === 0) holder.removeParticles(n, have);
          else holder.removeChildren(n, have).forEach((s) => s.destroy());
          return;
        }
        const W = app.screen.width, H = app.screen.height;
        for (let start = have; start < n; start += 5000) {
          const chunk = [];
          for (let i = start; i < Math.min(n, start + 5000); i++) {
            if (i >= have) { bx[i] = Math.random() * W; by[i] = Math.random() * H * 0.5; bvx[i] = rnd(-5, 5); bvy[i] = rnd(-5, 0); }
            chunk.push(make(i));
          }
          if (holderMode === 0) holder.addParticle(...chunk); else holder.addChild(...chunk);
        }
      }
      function rebuild() {
        const n = holder ? list().length : 0;
        if (holder) holder.destroy(holderMode === 1 ? { children: true } : undefined);
        holderMode = mode;
        holder = holderMode === 0 ? new PIXI.ParticleContainer({ texture: atlasTex, dynamicProperties: { position: true } }) : new PIXI.Container();
        app.stage.addChild(holder);
        setCount(n);
      }
      rebuild();
      ready = true;

      ctx.raf((t, dt) => {
        const W = app.screen.width, H = app.screen.height, k = dt / 16.7, items = list(), n = items.length;
        const t0 = performance.now();
        for (let i = 0; i < n; i++) {
          let x = bx[i] + bvx[i] * k, y = by[i] + bvy[i] * k;
          bvy[i] += 0.75 * k;
          if (x > W) { bvx[i] = -Math.abs(bvx[i]); x = W; } else if (x < 0) { bvx[i] = Math.abs(bvx[i]); x = 0; }
          if (y > H) { bvy[i] *= -0.85; y = H; if (Math.random() > 0.5) bvy[i] -= Math.random() * 6; } else if (y < 0) { bvy[i] = 0; y = 0; }
          bx[i] = x; by[i] = y;
          const o = items[i];
          o.x = x; o.y = y;
        }
        const t1 = performance.now();
        app.render();
        const t2 = performance.now();
        upd += (t1 - t0 - upd) * 0.1;
        drw += (t2 - t1 - drw) * 0.1;
      });
      const st = frameStats(ctx, app);
      ctx.ramp({
        label: "兔子", unit: "隻", steps: [1000, 5000, 10000, 25000, 50000, 100000, 200000, 400000], minFps: 30,
        apply: setCount,
        metrics: () => ({
          更新: `${upd.toFixed(1)} ms`,
          繪製: `${drw.toFixed(1)} ms`,
          "draw call": st.dc(),
          模式: holderMode === 0 ? "ParticleContainer" : "Container＋Sprite",
        }),
        note: "每格先用 JavaScript 更新所有兔子的位置（更新），再呼叫一次 app.render()（繪製），兩段分開計時。ParticleContainer 只把位置設為動態屬性，每格只上傳位置，材質座標、縮放等靜態屬性只在數量改變時上傳，粒子也不參與場景樹的變形計算。Container＋Sprite 每個 Sprite 都要更新變形矩陣，再由批次渲染器逐一組裝頂點，CPU 成本高很多。繪製時間量的是 CPU 送出指令的時間，GPU 是非同步執行，實際瓶頸也可能在顯示卡。",
      });
    },
  },
] });
</script>
</body>
</html>
