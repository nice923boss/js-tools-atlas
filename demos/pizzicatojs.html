<body>
<script src="_shared/showcase.js"></script>
<script>
const { h, fmtCompact } = Showcase;
const AC = Pizzicato.context;
const FX = Pizzicato.Effects;
const LOOP = "_shared/audio/loop.mp3";
const DPR = Math.min(2, window.devicePixelRatio || 1);
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = (m) => NOTE[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);

// One analyser on Pizzicato's master gain feeds every oscilloscope on the page.
const MASTER_TAP = AC.createAnalyser();
MASTER_TAP.fftSize = 2048;
// Page-level safety limiter after Pizzicato's master gain: stacking distortion, feedback and
// ring modulation can push the sum well above 0 dBFS. Not part of Pizzicato itself.
const LIMITER = AC.createDynamicsCompressor();
LIMITER.threshold.value = -6; LIMITER.knee.value = 0; LIMITER.ratio.value = 20;
LIMITER.attack.value = 0.002; LIMITER.release.value = 0.15;
Pizzicato.masterGainNode.disconnect();
Pizzicato.masterGainNode.connect(LIMITER);
LIMITER.connect(AC.destination);
Pizzicato.masterGainNode.connect(MASTER_TAP);

// Browsers keep the context suspended until a user gesture; every play button calls this first.
function wake() { return AC.state === "running" ? Promise.resolve() : AC.resume(); }

// Flanger, Tremolo and RingModulator start internal LFO oscillators that never stop on their own.
function killFx(e) {
  for (const k of ["oscillatorNode", "lfoNode", "vIn"]) if (e[k] && !e[k].pzStopped) { e[k].stop(); e[k].pzStopped = true; }
  e.outputNode.disconnect();
}

// Per-scene registry: unmounting stops every Sound, silences it at once and tears effects down.
function rig(ctx) {
  const sounds = new Set(), effects = new Set(), nodes = new Set();
  const end = (s) => { s.off(); s.stop(); s.disconnect(); };
  ctx.onCleanup(() => {
    sounds.forEach(end);
    effects.forEach(killFx);
    nodes.forEach((n) => n.disconnect());
    sounds.clear(); effects.clear(); nodes.clear();
  });
  return {
    sound(desc, cb) { const s = new Pizzicato.Sound(desc, cb); sounds.add(s); return s; },
    drop(s) { if (sounds.delete(s)) end(s); },
    effect(e) { effects.add(e); return e; },
    dropFx(e) { if (effects.delete(e)) killFx(e); },
    node(n) { nodes.add(n); return n; },
    get count() { return sounds.size; },
  };
}

// ---------- canvas helpers ----------
function view(ctx, host, draw) {
  const cv = h("canvas");
  host.append(cv);
  const g = cv.getContext("2d");
  const v = { cv, g, w: 0, h: 0, draw: () => draw(v) };
  const fit = () => {
    const r = host.getBoundingClientRect();
    v.w = Math.max(1, r.width); v.h = Math.max(1, r.height);
    cv.width = Math.round(v.w * DPR); cv.height = Math.round(v.h * DPR);
    cv.style.width = v.w + "px"; cv.style.height = v.h + "px";
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw(v);
  };
  const ro = new ResizeObserver(fit);
  ro.observe(host);
  ctx.onCleanup(() => ro.disconnect());
  fit();
  return v;
}
function txt(g, s, x, y, color = "#e8e6e3", size = 12, align = "left", mono = false, weight = 500) {
  g.font = `${weight} ${size}px ${mono ? MONO : CJK}`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle";
  g.fillText(s, x, y);
}
const BUFS = new WeakMap();
function bufs(an) {
  let b = BUFS.get(an);
  if (!b) { b = { t: new Float32Array(an.fftSize), f: new Uint8Array(an.frequencyBinCount) }; BUFS.set(an, b); }
  return b;
}
function level(an) {
  const { t } = bufs(an);
  an.getFloatTimeDomainData(t);
  let s = 0, p = 0;
  for (let i = 0; i < t.length; i++) { const v = t[i]; s += v * v; if (Math.abs(v) > p) p = Math.abs(v); }
  return { rms: Math.sqrt(s / t.length), peak: p };
}
const dB = (x) => (x > 1e-5 ? 20 * Math.log10(x) : -100);
function grid(g, w, hh) {
  g.strokeStyle = "rgba(255,255,255,.06)"; g.lineWidth = 1; g.beginPath();
  for (let i = 1; i < 8; i++) { const x = Math.round((i * w) / 8) + 0.5; g.moveTo(x, 0); g.lineTo(x, hh); }
  g.moveTo(0, Math.round(hh / 2) + 0.5); g.lineTo(w, Math.round(hh / 2) + 0.5); g.stroke();
}
// Oscilloscope with a faint spectrum behind it; triggers on a rising zero crossing for a steady trace.
function scope(g, x0, y0, w, hh, an, { color = "#f7df1e", live = true, spec = true, idle = "" } = {}) {
  g.save(); g.translate(x0, y0);
  g.fillStyle = "#0a0c0f"; g.fillRect(0, 0, w, hh);
  grid(g, w, hh);
  const { t, f } = bufs(an);
  if (live && spec) {
    an.getByteFrequencyData(f);
    const n = Math.max(16, Math.min(160, Math.floor(w / 3)));
    for (let i = 0; i < n; i++) {
      const v = f[Math.floor(Math.pow(i / n, 2) * f.length)] / 255;
      g.fillStyle = `hsla(${20 + i * 1.6}, 90%, 60%, 0.32)`;
      g.fillRect((i / n) * w, hh - v * hh, w / n - 1, v * hh);
    }
  }
  if (live) an.getFloatTimeDomainData(t);
  let s0 = 0;
  if (live) for (let i = 1; i < t.length / 2; i++) if (t[i - 1] < 0 && t[i] >= 0) { s0 = i; break; }
  const span = Math.min(t.length - s0, 1024);
  g.lineWidth = 2; g.strokeStyle = color; g.beginPath();
  for (let x = 0; x <= w; x += 2) {
    const v = live ? t[s0 + Math.floor((x / w) * (span - 1))] : 0;
    const y = hh / 2 - Math.max(-1, Math.min(1, v)) * hh * 0.45;
    x ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.stroke();
  if (!live && idle) txt(g, idle, w / 2, hh / 2 - 14, "#7d8490", 12, "center");
  g.restore();
}
// Log-frequency spectrum outline (30 Hz to 16 kHz).
function spectrum(g, x0, y0, w, hh, an, color, fill) {
  const { f } = bufs(an);
  an.getByteFrequencyData(f);
  const ny = AC.sampleRate / 2;
  g.beginPath(); g.moveTo(x0, y0 + hh);
  for (let px = 0; px <= w; px += 2) {
    const fr = 30 * Math.pow(16000 / 30, px / w);
    const v = f[Math.min(f.length - 1, Math.round((fr / ny) * f.length))] / 255;
    g.lineTo(x0 + px, y0 + hh - v * hh);
  }
  g.lineTo(x0 + w, y0 + hh);
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (color) { g.strokeStyle = color; g.lineWidth = 1.6; g.stroke(); }
}
const fv = (v) => {
  if (typeof v === "boolean") return String(v);
  if (typeof v !== "number" || !isFinite(v)) return String(v);
  const a = Math.abs(v);
  return a >= 100 ? v.toFixed(0) : a >= 10 ? v.toFixed(1) : String(+v.toFixed(3));
};

// ---------- impulse response encoded as a real WAV file, so Convolver can load it by URL ----------
function impulseWav(seconds, decay, reverse) {
  const sr = AC.sampleRate, n = Math.floor(sr * seconds), ch = 2;
  const data = [new Float32Array(n), new Float32Array(n)];
  for (let c = 0; c < ch; c++) for (let i = 0; i < n; i++) {
    const k = reverse ? n - 1 - i : i;
    data[c][i] = (Math.random() * 2 - 1) * Math.pow(1 - k / n, decay);
  }
  const buf = new ArrayBuffer(44 + n * ch * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * ch * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * ch * 2, true); v.setUint16(32, ch * 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * ch * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { v.setInt16(o, Math.max(-1, Math.min(1, data[c][i])) * 32767, true); o += 2; }
  return { url: URL.createObjectURL(new Blob([buf], { type: "audio/wav" })), env: data[0], seconds, bytes: buf.byteLength };
}

Showcase.run({
  scenes: [
    // 1 --------------------------------------------------------------------------------------
    {
      id: "pedal", title: "效果器踏板",
      api: "new Pizzicato.Sound({ source: 'file' })・addEffect・removeEffect",
      desc: "一個循環播放的音檔，八種內建效果器用 addEffect／removeEffect 依序串進訊號鏈，旋鈕直接寫入效果器屬性，數值是從屬性讀回來的；示波器接在 Pizzicato.masterGainNode。",
      hint: "按黃色播放鈕後踩圓形開關加入或移除效果，旋鈕即時調整；訊號鏈依踩下順序串接。",

          const row = h("div", { class: `pz-ch${grp ? " grp" : ""}` });
          const meter = h("i");
          const v = h("input", { type: "range", min: 0, max: 1, step: 0.01, value: vol, "aria-label": `${name}音量` });
          v.addEventListener("input", () => onVol(+v.value));
          row.append(h("div", { class: "nm" }, h("b", { text: name }), h("i", { text: code })), h("div", { class: "mt" }, meter), h("label", { class: "v" }, "音量", v));
          if (onPan) {
            const p = h("input", { type: "range", min: -1, max: 1, step: 0.01, value: pan, "aria-label": `${name}聲像` });
            p.addEventListener("input", () => onPan(+p.value));
            row.append(h("label", { class: "p" }, "聲像", p));
          } else row.append(h("span", { class: "p" }));
          const b = h("button", { class: "btn", type: "button", "aria-pressed": "false", text: muteLabel });
          b.addEventListener("click", () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); row.classList.toggle("muted", on && !grp); onMute(on); });
          row.append(b);
          mix.append(row);
          return meter;
        };
        CH.forEach((c, i) => {
          c.meter = strip(c.cn, c.code, c.vol,
            (val) => { c.s.volume = val; api(`group.sounds[${i}].volume = ${val}`); },
            c.pan, (val) => { c.panFx.pan = val; api(`panner.pan = ${val}  // 第 ${i + 1} 軌的 StereoPanner 效果`); },
            "靜音", (on) => {
              if (on) { group.removeSound(c.s); c.s.disconnect(Pizzicato.masterGainNode); }
              else { c.s.connect(Pizzicato.masterGainNode); group.addSound(c.s); } // addSound first disconnects from the master gain
              api(`group.${on ? "removeSound" : "addSound"}(sound)  → group.sounds.length = ${group.sounds.length}`);
            });
        });
        const gMeter = strip("群組總線", "Group＋Reverb", 0.6, (val) => { group.volume = val; api(`group.volume = ${val}`); }, 0, null, "移除殘響", (on) => {
          if (on) group.removeEffect(reverb); else group.addEffect(reverb);
          api(on ? "group.removeEffect(reverb)" : "group.addEffect(reverb)");
        }, true);
        const CHORDS = [["Am", [57, 60, 64]], ["F", [53, 57, 60]], ["C", [48, 52, 55]], ["G", [55, 59, 62]]];
        const LEAD = [0, 1, 2, 1, 2, 3, 2, 1];
        function tick() {
          if (!playing) return;
          const [, ch] = CHORDS[Math.floor(step / 8) % 4];
          CH[1].s.frequency = mtof(ch[0] - 24 + (step % 4 === 2 ? 7 : 0));
          if (step % 8 === 0) CH[2].s.frequency = mtof(ch[1] - 12);
          const k = LEAD[step % 8];
          CH[3].s.frequency = mtof((k === 3 ? ch[0] + 12 : ch[k]) + 12);
          step++;
        }
        ctx.interval(tick, 300);
        const playBtn = ctx.button("▶ 群組播放", async () => {
          await wake();
          if (!ctx.active || !loaded) return;
          playing = !playing;
          if (playing) { step = 0; tick(); group.play(); } else group.stop();
          playBtn.textContent = playing ? "■ 群組停止" : "▶ 群組播放";
          api(playing ? `group.play()  // 依序呼叫 ${group.sounds.length} 個 Sound 的 play()` : "group.stop()");
        }, { primary: true });
        playBtn.disabled = true;
        const sc = view(ctx, ctx.$(".pz-gscope"), (v) => {
          scope(v.g, 0, 0, v.w, v.h, gAn, { color: "#f7df1e", live: playing, idle: loaded ? "按「▶ 群組播放」" : "音檔載入中…" });
          if (playing) txt(v.g, `和弦 ${CHORDS[Math.floor(Math.max(0, step - 1) / 8) % 4][0]}・群組輸出（含殘響）`, 8, 12, "#e8e6e3", 11, "left", false, 600);
        });
        ctx.raf(() => {
          sc.draw();
          CH.forEach((c) => { c.meter.style.width = playing ? `${Math.max(0, Math.min(100, ((dB(level(c.an).rms) + 50) / 50) * 100))}%` : "0"; });
          gMeter.style.width = playing ? `${Math.max(0, Math.min(100, ((dB(level(gAn).rms) + 50) / 50) * 100))}%` : "0";
        });
      },
    },
    // 7 --------------------------------------------------------------------------------------
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "N × (Sound wave＋StereoPanner) → Group＋LowPassFilter",
      desc: "同時發聲的 Sound 數量逐級加倍：每個聲部是一個 wave Sound 加自己的 StereoPanner，全部放進同一個 Group，群組再掛一個 LowPassFilter。同時量主執行緒 FPS 與音訊時鐘速率。",
      hint: "按「自動加壓」才會建立聲部並出聲（音量已依聲部數自動降低）；離開此場景會立即停止並釋放所有節點。",
      mount(ctx) {
        ctx.html(`<div class="pz-sv"><div class="pz-cv" style="position:absolute;inset:0;border:0"></div></div>`);
        ctx.controls.classList.add("bottom");
        const r = rig(ctx);
        const lp = r.effect(new FX.LowPassFilter({ frequency: 2600, peak: 1 }));
        const group = new Pizzicato.Group();
        group.addEffect(lp);
        group.volume = 0.8;
        ctx.onCleanup(() => { group.disconnect(); });
        const voices = [];
        const SCALE = [45, 48, 50, 52, 55, 57, 60, 62, 64, 67, 69, 72, 74, 76, 79, 81];
        let armed = false, target = 0;
        const clock = { samples: [], rate: 1, armT: 0, armCt: 0 };
        const volFor = (n) => Math.min(0.25, 0.3 / Math.sqrt(Math.max(1, n)));
        function addVoice(n) {
          const m = SCALE[Math.floor(Math.random() * SCALE.length)];
          const s = r.sound({ source: "wave", options: { type: voices.length % 3 ? "sine" : "triangle", frequency: mtof(m) * (1 + (Math.random() - 0.5) * 0.006), volume: volFor(n), attack: 0.25, release: 0.1 } });
          const pan = new FX.StereoPanner({ pan: Math.random() * 1.6 - 0.8 });
          s.addEffect(pan);
          group.addSound(s);
          s.play();
          voices.push({ s, m, p: pan.pan, ph: Math.random() * 6.28 });
        }
        function sync() {
          while (voices.length < target) addVoice(target);
          while (voices.length > target) { const v = voices.pop(); group.removeSound(v.s); r.drop(v.s); }
          const vol = volFor(voices.length);
          voices.forEach((v) => { v.s.volume = vol; });
        }
        function release() { armed = false; target = 0; sync(); }
        const arm = (e) => {
          if (armed || !e.target.closest("[data-sc-run], .sc-lab input[type=range]")) return;
          armed = true; wake();
          clock.armT = performance.now(); clock.armCt = AC.currentTime; clock.samples.length = 0;
        };
        ctx.on(ctx.el, "click", arm, true);
        ctx.on(ctx.el, "input", arm, true);
        ctx.button("釋放所有聲部", release);
        // Audio clock rate: currentTime advance divided by wall-clock advance over a sliding ~2 s window.
        ctx.interval(() => {
          const s = clock.samples;
          s.push([performance.now(), AC.currentTime]);
          if (s.length > 9) s.shift();
          if (s.length > 2) { const [w0, c0] = s[0], [w1, c1] = s[s.length - 1]; clock.rate = (c1 - c0) / ((w1 - w0) / 1000); }
        }, 250);
        const lag = () => (armed ? Math.max(0, (performance.now() - clock.armT) / 1000 - (AC.currentTime - clock.armCt)) * 1000 : 0);
        const hist = [];
        ctx.interval(() => { if (armed) { hist.push(clock.rate); if (hist.length > 120) hist.shift(); } }, 250);
        const v = view(ctx, ctx.$(".pz-sv > .pz-cv"), (vv) => {
          const { g, w, h: hh } = vv;
          g.fillStyle = "#050608"; g.fillRect(0, 0, w, hh);
          const sh = Math.min(90, hh * 0.24);
          scope(g, 0, 0, w, sh, MASTER_TAP, { color: "#7bd389", live: armed && voices.length > 0, spec: false, idle: "尚未發聲：按「自動加壓」才會建立聲部" });
          const y0 = sh + 10, y1 = hh - 70;
          const lo = Math.log(mtof(44)), hi = Math.log(mtof(82));
          const t = performance.now() / 1000;
          for (const vo of voices) {
            const x = 12 + ((vo.p + 0.8) / 1.6) * (w - 24);
            const y = y1 - ((Math.log(mtof(vo.m)) - lo) / (hi - lo)) * (y1 - y0);
            const a = 0.35 + 0.35 * Math.sin(t * 3 + vo.ph);
            g.fillStyle = `hsla(${(vo.m * 23) % 360}, 80%, 62%, ${a})`;
            g.beginPath(); g.arc(x, y, voices.length > 300 ? 2 : 4, 0, 6.283); g.fill();
          }
          txt(g, "左", 10, y0 + 8, "#7d8490", 10); txt(g, "右", w - 10, y0 + 8, "#7d8490", 10, "right");
          txt(g, armed ? `發聲中 ${voices.length} 個 Sound・每個 volume ${volFor(voices.length).toFixed(3)}` : `目標 ${target} 個聲部（尚未發聲）`, 10, y1 + 14, "#e8e6e3", 12, "left", false, 600);
          // clock-rate history
          const cy = hh - 44, ch = 34;
          g.fillStyle = "rgba(255,255,255,.04)"; g.fillRect(10, cy, w - 20, ch);
          const Y = (rt) => cy + ch - Math.max(0, Math.min(1, (rt - 0.9) / 0.15)) * ch;
          g.strokeStyle = "rgba(255,255,255,.25)"; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(10, Y(1)); g.lineTo(w - 10, Y(1)); g.stroke(); g.setLineDash([]);
          g.strokeStyle = "#4cc9f0"; g.lineWidth = 1.5; g.beginPath();
          hist.forEach((rt, i) => { const x = 10 + (i / 119) * (w - 20); i ? g.lineTo(x, Y(rt)) : g.moveTo(x, Y(rt)); });
          g.stroke();
          txt(g, `音訊時鐘速率（虛線 = 100%）目前 ${(clock.rate * 100).toFixed(1)}%`, 10, hh - 4 - 2, "#7d8490", 10.5);
        });
        ctx.raf(() => v.draw());
        ctx.ramp({
          label: "同時發聲", unit: "聲部", steps: [8, 32, 64, 128, 256, 512, 1024], minFps: 30, warmup: 900, sample: 1500,
          title: "極限測試：同時發聲的 Sound 數",
          note: "FPS 只代表主執行緒（建立節點、畫面）。Web Audio 在獨立的音訊執行緒合成，所以也看「音訊時鐘」：currentTime 增量除以實際經過時間，持續低於約 98% 代表音訊執行緒算不完、開始爆音或斷續；「時鐘落後」是開始加壓後累積的差距。",
          apply: (n) => { target = n; if (armed) sync(); },
          metrics: () => ({
            "發聲中": armed ? voices.length : "未發聲",
            "音訊時鐘": `${(clock.rate * 100).toFixed(1)}%`,
            "時鐘落後": `${lag().toFixed(0)} ms`,
            "輸出延遲": `${(((AC.baseLatency || 0) + (AC.outputLatency || 0)) * 1000).toFixed(1)} ms`,
          }),
        });
      },
    },
  ],
});
</script>
</body>
</html>
