<style>
  .sc-scene canvas.pl-cv { position: absolute; left: 0; top: 0; touch-action: none; cursor: grab; }
  .sc-scene canvas.pl-cv.aim { cursor: crosshair; }
  .sc-scene canvas.pl-cv.flip { cursor: pointer; }
  .sc-scene.pinball { background: radial-gradient(circle at 50% 30%, #1a1f3d 0%, #07080f 75%); }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/planck@1.5.0/dist/planck.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Planck.js (Box2D port) showcase: eight scenes from the original pinball table to a body-count stress ramp.
// World units are meters with y pointing up; every scene maps them to canvas pixels through lab().
const { World, Vec2, Circle, Box, Polygon, Edge, Chain, AABB, RevoluteJoint, PrismaticJoint, DistanceJoint, WeldJoint, WheelJoint, RopeJoint, PulleyJoint, GearJoint, MouseJoint } = planck;
const V = (x, y) => new Vec2(x, y);
const TAU = Math.PI * 2;
const COLORS = ["#f72585", "#ffb703", "#4cc9f0", "#7bd389", "#9d8cff", "#ff7b54"];
const MUTED = "#9b998f", STEEL = "#4a5262", INK = "#e8e6df", AMBER = "#ffb703";
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
const MONO = rootCss.getPropertyValue("--mono").trim() || "ui-monospace, monospace";
const font = (weight, px, mono) => `${weight} ${px}px ${mono ? MONO : FONT}`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const below = (ctx) => ctx.controls.offsetHeight + 20;

// Rounded caption on the canvas (CSS pixels). Returns its width so callers can lay chips out in a row.
function chip(g, text, x, y, { color = INK, size = 11, align = "center", mono = false, fit = 0, bg = "rgba(14,16,19,.8)" } = {}) {
  g.font = font(600, size, mono);
  const w = g.measureText(text).width + 10, hh = size + 8;
  let left = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  if (fit) left = clamp(left, 4, fit - w - 4);
  g.fillStyle = bg;
  g.beginPath();
  g.roundRect(left, y - hh / 2, w, hh, 5);
  g.fill();
  g.fillStyle = color;
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.fillText(text, left + 5, y + 0.5);
  return w;
}
function dashLine(g, x1, y1, x2, y2, color = "rgba(255,255,255,.25)", w = 1) {
  g.save();
  g.setLineDash([5, 5]);
  g.strokeStyle = color;
  g.lineWidth = w;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.restore();
}
function dot(g, x, y, r, color) {
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}
function zigzag(g, x1, y1, x2, y2, n, amp, color) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  g.beginPath(); g.moveTo(x1, y1);
  for (let i = 1; i < n; i++) {
    const t = i / n, s = i % 2 ? amp : -amp;
    g.lineTo(x1 + dx * t + nx * s, y1 + dy * t + ny * s);
  }
  g.lineTo(x2, y2);
  g.strokeStyle = color; g.lineWidth = 1.5; g.stroke();
}

// One planck World bound to a scene canvas: fixed-step loop, camera (meters to pixels), debug drawing
// and mouse dragging through a MouseJoint. Scenes plug in p.layout / before / after / draw / onDown.
function lab(ctx, { gravity = -10, hz = 60, vel = 8, pos = 3, drag = true, perFrame = false, cls = "" } = {}) {
  const cv = document.createElement("canvas");
  cv.className = "pl-cv" + (cls ? " " + cls : "");
  ctx.el.appendChild(cv);
  ctx.onCleanup(() => cv.remove());
  const g = cv.getContext("2d");
  const p = { cv, g, W: 0, H: 0, s: 30, ox: 0, oy: 0, dt: 1 / hz, vel, pos, speed: 1, time: 0, phys: 0, paint: 0, world: null, ground: null, mouse: null };
  p.reset = (gy = gravity) => {
    p.world = new World({ gravity: V(0, gy) });
    p.ground = p.world.createBody();
    p.ground.setUserData({ color: "#5d6880" });
    p.mouse = null;
    return p.world;
  };
  p.reset();
  p.X = (x) => p.ox + x * p.s;
  p.Y = (y) => p.oy - y * p.s;
  p.toWorld = (px, py) => V((px - p.ox) / p.s, (p.oy - py) / p.s);
  // Fit the world rect into the canvas. t: "auto" keeps the top margin small unless the rect would
  // slide under the top-right control cluster, in which case it starts below the controls.
  p.fit = (x0, y0, x1, y1, m = {}) => {
    const r = m.r ?? 12, b = m.b ?? 12, l = m.l ?? 12;
    const place = (t) => {
      const aw = Math.max(40, p.W - l - r), ah = Math.max(40, p.H - t - b);
      p.s = Math.min(aw / (x1 - x0), ah / (y1 - y0));
      p.ox = l + (aw - (x1 - x0) * p.s) / 2 - x0 * p.s;
      p.oy = t + (ah - (y1 - y0) * p.s) / 2 + y1 * p.s;
    };
    if (m.t === "auto") {
      place(12);
      const c = ctx.controls;
      if (c.offsetHeight && p.X(x1) > p.W - 10 - c.offsetWidth && p.Y(y1) < 10 + c.offsetHeight) place(below(ctx));
    } else place(m.t ?? 12);
  };
  p.kill = (b) => {
    if (p.mouse && p.mouse.getBodyB() === b) { p.world.destroyJoint(p.mouse); p.mouse = null; }
    p.world.destroyBody(b);
  };
  p.tx = (b, v) => {
    const t = b.getTransform();
    return { x: t.q.c * v.x - t.q.s * v.y + t.p.x, y: t.q.s * v.x + t.q.c * v.y + t.p.y };
  };
  // Adds one fixture outline to the current path. Circles return their world center.
  p.path = (b, f) => {
    const sh = f.getShape(), type = sh.getType();
    if (type === "circle") {
      const c = p.tx(b, sh.getCenter());
      g.moveTo(p.X(c.x) + sh.getRadius() * p.s, p.Y(c.y));
      g.arc(p.X(c.x), p.Y(c.y), sh.getRadius() * p.s, 0, TAU);
      return c;
    }
    const pts = type === "edge" ? [sh.m_vertex1, sh.m_vertex2] : sh.m_vertices;
    const n = type === "edge" ? 2 : sh.m_count;
    for (let i = 0; i < n; i++) {
      const q = p.tx(b, pts[i]);
      i ? g.lineTo(p.X(q.x), p.Y(q.y)) : g.moveTo(p.X(q.x), p.Y(q.y));
    }
    if (type === "polygon") g.closePath();
    return null;
  };
  p.drawBody = (b, col) => {
    const ud = b.getUserData() || {};
    if (ud.hidden) return;
    col = col || ud.color || (b.isStatic() ? STEEL : b.isKinematic() ? COLORS[4] : COLORS[2]);
    g.globalAlpha = b.isDynamic() && !b.isAwake() ? 0.45 : 1;
    for (let f = b.getFixtureList(); f; f = f.getNext()) {
      const fu = f.getUserData(), fc = (fu && fu.color) || col, type = f.getShape().getType();
      g.beginPath();
      const c = p.path(b, f);
      if (type === "edge" || type === "chain") {
        g.strokeStyle = fc; g.lineWidth = 2.5; g.lineJoin = "round"; g.stroke();
        continue;
      }
      if (f.isSensor()) {
        g.setLineDash([4, 4]); g.strokeStyle = fc; g.lineWidth = 1.5; g.stroke(); g.setLineDash([]);
        continue;
      }
      g.fillStyle = fc; g.fill();
      g.strokeStyle = "rgba(0,0,0,.4)"; g.lineWidth = 1; g.stroke();
      if (c && !b.isStatic()) {
        const a = b.getAngle(), r = f.getShape().getRadius();
        g.beginPath();
        g.moveTo(p.X(c.x), p.Y(c.y));
        g.lineTo(p.X(c.x + Math.cos(a) * r), p.Y(c.y + Math.sin(a) * r));
        g.strokeStyle = "rgba(0,0,0,.45)"; g.lineWidth = 1.5; g.stroke();
      }
    }
    g.globalAlpha = 1;
  };
  p.drawJoint = (j) => {
    const type = j.getType(), ud = j.getUserData() || {};
    if (type === "gear-joint" || ud.style === "none") return;
    const a = j.getAnchorA(), b = j.getAnchorB();
    const ax = p.X(a.x), ay = p.Y(a.y), bx = p.X(b.x), by = p.Y(b.y);
    if (type === "mouse-joint") { dashLine(g, ax, ay, bx, by, AMBER, 1.5); dot(g, ax, ay, 4, AMBER); return; }
    if (type === "pulley-joint") {
      const ga = j.getGroundAnchorA(), gb = j.getGroundAnchorB();
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(p.X(ga.x), p.Y(ga.y)); g.lineTo(p.X(gb.x), p.Y(gb.y)); g.lineTo(bx, by);
      g.strokeStyle = "rgba(232,230,223,.7)"; g.lineWidth = 1.5; g.stroke();
      return;
    }
    if (type === "distance-joint" || type === "rope-joint") {
      if (ud.style === "spring") zigzag(g, ax, ay, bx, by, 12, 5, "rgba(232,230,223,.8)");
      else { g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.strokeStyle = "rgba(232,230,223,.6)"; g.lineWidth = 2; g.stroke(); }
      dot(g, ax, ay, 3, INK);
      return;
    }
    dot(g, bx, by, 2.5, "rgba(232,230,223,.8)");
  };
  p.drawWorld = () => {
    for (let b = p.world.getBodyList(); b; b = b.getNext()) p.drawBody(b);
    for (let j = p.world.getJointList(); j; j = j.getNext()) p.drawJoint(j);
  };
  // First fixture under a world point, filtered by test(body, fixture).
  p.pick = (w, test = () => true) => {
    let hit = null;
    p.world.queryAABB(new AABB(V(w.x - 0.01, w.y - 0.01), V(w.x + 0.01, w.y + 0.01)), (f) => {
      if (f.testPoint(w) && test(f.getBody(), f)) { hit = f.getBody(); return false; }
      return true;
    });
    return hit;
  };
  let ptr = null;
  p.ptr = () => ptr;
  const evPt = (e) => { const r = cv.getBoundingClientRect(); return p.toWorld(e.clientX - r.left, e.clientY - r.top); };
  ctx.on(cv, "pointerdown", (e) => {
    const w = (ptr = evPt(e));
    cv.setPointerCapture(e.pointerId);
    if (p.onDown && p.onDown(w, e)) return;
    if (!drag) return;
    const b = p.pick(w, (b) => b.isDynamic());
    if (!b) return;
    p.mouse = p.world.createJoint(new MouseJoint({ maxForce: 1000 * b.getMass(), frequencyHz: 5, dampingRatio: 0.7 }, p.ground, b, w));
  });
  ctx.on(cv, "pointermove", (e) => {
    const w = (ptr = evPt(e));
    if (p.mouse) p.mouse.setTarget(w);
    if (p.onMove) p.onMove(w, e);
  });
  const up = (e) => {
    if (p.mouse) { p.world.destroyJoint(p.mouse); p.mouse = null; }
    if (p.onUp) p.onUp(e);
  };
  ctx.on(cv, "pointerup", up);
  ctx.on(cv, "pointercancel", up);
  ctx.on(cv, "pointerleave", (e) => { if (!e.buttons) ptr = null; });

  const stepOnce = () => {
    if (p.before) p.before(p.dt);
    p.world.step(p.dt, p.vel, p.pos);
    p.time += p.dt;
    if (p.after) p.after(p.dt);
  };
  p.go = () => {
    const size = ({ width, height }) => {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      p.W = width; p.H = height;
      cv.width = Math.round(width * dpr); cv.height = Math.round(height * dpr);
      cv.style.width = width + "px"; cv.style.height = height + "px";
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (p.layout) p.layout(width, height);
    };
    size(ctx.size());
    ctx.onResize(size);
    let acc = 0;
    ctx.raf((t, ms) => {
      const t0 = performance.now();
      if (perFrame) stepOnce();
      else {
        acc = Math.min(acc + (ms / 1000) * p.speed, p.dt * 4);
        while (acc >= p.dt) { acc -= p.dt; stepOnce(); }
      }
      const t1 = performance.now();
      g.clearRect(0, 0, p.W, p.H);
      p.draw ? p.draw(g) : p.drawWorld();
      const t2 = performance.now();
      p.phys += (t1 - t0 - p.phys) * 0.1;
      p.paint += (t2 - t1 - p.paint) * 0.1;
    });
  };
  return p;
}

Showcase.run({ scenes: [
  {
    id: "pinball", title: "台灣彈珠台",
    api: "new Chain(outline) + RevoluteJoint({ enableMotor, enableLimit }) + world.on(\"begin-contact\")",
    desc: "原本的招牌示範升級：Chain 圍出台面，擋板是有馬達與角度限制的 RevoluteJoint，彈簧柱靠 restitution，「台灣讚」是 isSensor 感應器。中央多了一支 kinematic 旋轉桿，還能多球同時開打。",
    hint: "點畫面左半／右半或按 ← →（Z、M）打擋板・空白鍵發新球",
    mount(ctx) {
      ctx.el.classList.add("pinball");
      let auto = true;
      ctx.button("新球", () => serve(1));
      ctx.button("多球 ×3", () => serve(3), { primary: true });
      const autoBtn = ctx.toggle("自動接球", true, (v) => { auto = v; });
      const p = lab(ctx, { gravity: -11, hz: 120, drag: false, cls: "flip" });
      const { world, ground } = p;

      // Table outline: lower guides, straight sides and a semicircular top.
      const outline = [V(2.9, 1.9), V(0, 3.6), V(0, 11)];
      for (let i = 1; i < 24; i++) {
        const a = Math.PI - (i / 24) * Math.PI;
        outline.push(V(5 + 5 * Math.cos(a), 11 + 5 * Math.sin(a)));
      }
      outline.push(V(10, 11), V(10, 3.6), V(7.1, 1.9));
      ground.createFixture(new Chain(outline, false), { friction: 0.1, userData: "wall" });
      const BUMPERS = [V(3.1, 9.4), V(6.9, 9.4), V(5, 11.3)];
      BUMPERS.forEach((c, i) => ground.createFixture(new Circle(c, 0.62), { restitution: 0.9, userData: "bumper" + i }));
      const SLINGS = [
        [V(0.8, 3.95), V(0.8, 5.8), V(2.3, 3.35)],
        [V(9.2, 3.95), V(7.7, 3.35), V(9.2, 5.8)],
      ];
      SLINGS.forEach((v, i) => ground.createFixture(new Polygon(v), { restitution: 1.15, userData: "sling" + i }));
      const POSTS = [2.6, 4.2, 5.8, 7.4];
      POSTS.forEach((x) => ground.createFixture(new Box(0.07, 0.45, V(x, 13.6), 0), { userData: "post" }));
      const LANES = [{ x: 3.4, ch: "台" }, { x: 5, ch: "灣" }, { x: 6.6, ch: "讚" }];
      LANES.forEach((l, i) => { l.lit = false; ground.createFixture(new Circle(V(l.x, 13.6), 0.28), { isSensor: true, userData: "lane" + i }); });
      // Kinematic spinner: moves at a set angular velocity, ignores forces, still knocks balls around.
      const spinner = world.createKinematicBody({ position: V(5, 5.25), angularVelocity: 2.6 });
      spinner.createFixture(new Box(0.7, 0.07), { friction: 0.2, userData: "spin" });

      function makeFlipper(pivot, dir) {
        const body = world.createDynamicBody({ position: pivot, bullet: true });
        const L = 1.6 * dir;
        body.createFixture(new Polygon([V(0, 0.17), V(0, -0.17), V(L, -0.06), V(L, 0.06)]), { density: 2, friction: 0.6, userData: "flipper" });
        body.createFixture(new Circle(V(0, 0), 0.17), { density: 2, userData: "flipper" });
        const joint = world.createJoint(new RevoluteJoint({ enableMotor: true, maxMotorTorque: 260, motorSpeed: 0, enableLimit: true, lowerAngle: -0.45, upperAngle: 0.45 }, ground, body, pivot));
        return { body, joint, dir, pivot, pressed: false, autoUntil: 0 };
      }
      const flippers = [makeFlipper(V(3, 1.8), 1), makeFlipper(V(7, 1.8), -1)];

      const balls = [], flashes = {}, pops = [], kicks = [];
      let ballNo = 0, score = 0, drainAt = 0, bonusPending = false;
      function serve(n) {
        for (let i = 0; i < n && balls.length < 6; i++) {
          ballNo += 1;
          const x = n > 1 ? 3.6 + i * 1.4 + rnd(-0.2, 0.2) : rnd(4, 6);
          const b = world.createDynamicBody({ position: V(x, 14.9), bullet: true });
          b.createFixture(new Circle(0.24), { density: 1.2, friction: 0.15, restitution: 0.3, userData: "ball" });
          b.setLinearVelocity(V(rnd(-3, 3), -1));
          b.setUserData({ trail: [] });
          balls.push(b);
        }
      }
      const addScore = (n, x, y) => { score += n; pops.push({ n, x, y, t: p.time }); if (pops.length > 20) pops.shift(); };
      // Contacts are queued during the step and handled afterwards (the world is locked mid-step).
      world.on("begin-contact", (c) => {
        const fa = c.getFixtureA(), fb = c.getFixtureB(), a = fa.getUserData(), b = fb.getUserData();
        if (a === "ball" && b !== "ball") kicks.push([fa.getBody(), b]);
        else if (b === "ball" && a !== "ball") kicks.push([fb.getBody(), a]);
      });
      function handle() {
        for (const [ball, tag] of kicks.splice(0)) {
          if (!tag || !balls.includes(ball)) continue;
          const q = ball.getPosition();
          if (tag.startsWith("bumper")) {
            const c = BUMPERS[+tag.slice(6)], d = V(q.x - c.x, q.y - c.y);
            d.normalize();
            ball.setLinearVelocity(V(d.x * 11, d.y * 11));
            flashes[tag] = p.time;
            addScore(100, c.x, c.y + 0.9);
          } else if (tag.startsWith("sling")) {
            flashes[tag] = p.time; addScore(10, q.x, q.y + 0.5);
          } else if (tag === "spin") {
            flashes.spin = p.time; addScore(5, q.x, q.y + 0.4);
          } else if (tag.startsWith("lane")) {
            const lane = LANES[+tag.slice(4)];
            if (!lane.lit) { lane.lit = true; addScore(250, lane.x, 14.3); }
            if (!bonusPending && LANES.every((l) => l.lit)) {
              bonusPending = true;
              flashes.bonus = p.time;
              addScore(2000, 5, 12.5);
              ctx.timeout(() => { LANES.forEach((l) => (l.lit = false)); bonusPending = false; }, 900);
            }
          }
        }
      }
      p.before = () => {
        const now = p.time;
        if (auto) {
          for (const b of balls) {
            const q = b.getPosition(), v = b.getLinearVelocity();
            for (const f of flippers) {
              const dx = (q.x - f.pivot.x) * f.dir;
              if (dx > 0.35 && dx < 1.75 && q.y < 2.75 && q.y > 0.6 && v.y < 1 && f.autoUntil < now - 0.25) f.autoUntil = now + 0.22;
            }
          }
        }
        // Left flipper raises with positive (CCW) rotation, right flipper with negative.
        for (const f of flippers) f.joint.setMotorSpeed((f.pressed || f.autoUntil > now ? 22 : -14) * f.dir);
      };
      p.after = () => {
        handle();
        for (let i = balls.length - 1; i >= 0; i--) {
          if (balls[i].getPosition().y < -0.6) { world.destroyBody(balls[i]); balls.splice(i, 1); drainAt = p.time; }
        }
        if (!balls.length && p.time - drainAt > 0.9) serve(1);
      };

      // Input: press the left or right half of the table, or use the keyboard.
      const press = (i, on) => {
        if (on && auto) { auto = false; autoBtn.setAttribute("aria-pressed", "false"); }
        flippers[i].pressed = on;
      };
      const held = new Map();
      p.onDown = (w, e) => { const i = w.x < 5 ? 0 : 1; held.set(e.pointerId, i); press(i, true); return true; };
      p.onUp = (e) => { if (held.has(e.pointerId)) { press(held.get(e.pointerId), false); held.delete(e.pointerId); } };
      const KEYS = { ArrowLeft: 0, KeyZ: 0, ArrowRight: 1, KeyM: 1, Slash: 1 };
      const skip = (e) => e.target && e.target.closest && e.target.closest('[role="tablist"], input, select, textarea');
      ctx.on(window, "keydown", (e) => {
        if (skip(e)) return;
        if (e.code in KEYS) { e.preventDefault(); if (!e.repeat) press(KEYS[e.code], true); }
        else if (e.code === "Space" && !(e.target.closest && e.target.closest("button"))) { e.preventDefault(); serve(1); }
      });
      ctx.on(window, "keyup", (e) => { if (e.code in KEYS) press(KEYS[e.code], false); });

      p.layout = () => p.fit(-0.2, -0.3, 10.2, 16.1, { t: "auto" });
      p.draw = (g) => {
        const s = p.s, X = p.X, Y = p.Y, now = p.time;
        const glow = (k) => Math.max(0, 1 - (now - (flashes[k] ?? -9)) / 0.25);
        const poly = (pts) => { g.beginPath(); pts.forEach((q, i) => (i ? g.lineTo(X(q.x), Y(q.y)) : g.moveTo(X(q.x), Y(q.y)))); };
        g.lineJoin = "round"; g.lineCap = "round";
        poly(outline); g.lineTo(X(5.6), Y(-0.3)); g.lineTo(X(4.4), Y(-0.3)); g.closePath();
        const bg = g.createLinearGradient(0, Y(16), 0, Y(0));
        bg.addColorStop(0, "#1b2552"); bg.addColorStop(1, "#0c1027");

          placed.push({ x, y });

          const b = p.world.createDynamicBody({ position: V(x, y), angle: rnd(0, TAU), allowSleep: false, linearVelocity: V(Math.cos(a) * sp, Math.sin(a) * sp), angularVelocity: rnd(-1, 1) });
          const fd = { density: 1, restitution: 1, friction: 0 };
          if (k === 0) b.createFixture(new Circle(rnd(0.35, 0.6)), fd);
          else if (k === 1) b.createFixture(new Box(rnd(0.3, 0.6), rnd(0.25, 0.5)), fd);
          else {
            const n = 3 + Math.floor(Math.random() * 4), r = rnd(0.45, 0.65), pts = [];
            for (let j = 0; j < n; j++) pts.push(V(Math.cos((j / n) * TAU) * r, Math.sin((j / n) * TAU) * r));
            b.createFixture(new Polygon(pts), fd);
          }
          b.setUserData({ color: COLORS[[0, 1, 4][k]] });
          i++;
        }
      }
      p.layout = (W, H) => {
        const t = below(ctx), nw = clamp(((W - 24) / Math.max(120, H - t - 46)) * 12, 9, 22);
        if (Math.abs(nw - ww) > 0.5) build(nw);
        p.fit(0, 0, ww, 12, { t, b: 34 });
      };
      // rayCast reports fixtures in arbitrary order; returning fraction clips the ray to the closest hit so far.
      const closest = (a, b) => {
        let hit = null;
        p.world.rayCast(a, b, (f, point, normal, fraction) => {
          hit = { f, point: V(point.x, point.y), normal: V(normal.x, normal.y), fraction };
          return fraction;
        });
        return hit;
      };
      const outline = (g, b, color = "#ffffff") => {
        for (let f = b.getFixtureList(); f; f = f.getNext()) { g.beginPath(); p.path(b, f); g.strokeStyle = color; g.lineWidth = 2.5; g.stroke(); }
      };
      p.draw = (g) => {
        p.drawWorld();
        const ptr = p.ptr(), X = p.X, Y = p.Y;
        const ang = ptr ? Math.atan2(ptr.y - O.y, ptr.x - O.x) : 0.15 + ((Math.sin(p.time * 0.45) + 1) / 2) * (Math.PI / 2 - 0.3);
        const d = V(Math.cos(ang), Math.sin(ang)), far = V(O.x + d.x * 40, O.y + d.y * 40);
        let info = "";
        if (mode === 0) {
          const h = closest(O, far);
          const end = h ? h.point : far;
          g.beginPath(); g.moveTo(X(O.x), Y(O.y)); g.lineTo(X(end.x), Y(end.y)); g.strokeStyle = AMBER; g.lineWidth = 2; g.stroke();
          if (h) {
            if (!h.f.getBody().isStatic()) outline(g, h.f.getBody());
            g.beginPath(); g.moveTo(X(end.x), Y(end.y)); g.lineTo(X(end.x + h.normal.x * 0.9), Y(end.y + h.normal.y * 0.9));
            g.strokeStyle = COLORS[3]; g.lineWidth = 2.5; g.stroke();
            dot(g, X(end.x), Y(end.y), 4.5, AMBER);
            info = `fraction ${h.fraction.toFixed(3)}・法線 (${h.normal.x.toFixed(2)}, ${h.normal.y.toFixed(2)})`;
          }
        } else if (mode === 1) {
          const hits = [];
          p.world.rayCast(O, far, (f, point, normal, fraction) => { hits.push({ f, point: V(point.x, point.y), fraction }); return 1; });
          hits.sort((a, b) => a.fraction - b.fraction);
          const end = hits.length ? hits[hits.length - 1].point : far;
          g.beginPath(); g.moveTo(X(O.x), Y(O.y)); g.lineTo(X(end.x), Y(end.y)); g.strokeStyle = "rgba(255,183,3,.75)"; g.lineWidth = 2; g.stroke();
          hits.forEach((h, i) => {
            if (!h.f.getBody().isStatic()) outline(g, h.f.getBody(), "rgba(255,255,255,.8)");
            dot(g, X(h.point.x), Y(h.point.y), 8, AMBER);
            g.font = font(700, 10, true); g.fillStyle = "#0e1013"; g.textAlign = "center"; g.textBaseline = "middle";
            g.fillText(String(i + 1), X(h.point.x), Y(h.point.y) + 0.5);
          });
          info = `沿路命中 ${hits.length} 次`;
        } else if (mode === 2) {
          let a = O, dir = d, n = 0;
          for (let k = 0; k < 8; k++) {
            const h = closest(a, V(a.x + dir.x * 40, a.y + dir.y * 40));
            if (!h) break;
            g.beginPath(); g.moveTo(X(a.x), Y(a.y)); g.lineTo(X(h.point.x), Y(h.point.y));
            g.strokeStyle = `rgba(255,183,3,${1 - k / 9})`; g.lineWidth = 2; g.stroke();
            dot(g, X(h.point.x), Y(h.point.y), 3.5, COLORS[3]);
            const dn = dir.x * h.normal.x + dir.y * h.normal.y;
            dir = V(dir.x - 2 * dn * h.normal.x, dir.y - 2 * dn * h.normal.y);
            a = V(h.point.x + h.normal.x * 1e-3, h.point.y + h.normal.y * 1e-3);
            n++;
          }
          info = `反射 ${n} 次`;
        } else {
          const c = ptr || V(ww / 2 + Math.sin(p.time * 0.6) * ww * 0.3, 6 + Math.sin(p.time * 0.9) * 3.5);
          const box = new AABB(V(c.x - 2, c.y - 1.5), V(c.x + 2, c.y + 1.5));
          const found = new Set();
          p.world.queryAABB(box, (f) => { found.add(f); return true; });
          g.fillStyle = "rgba(255,183,3,.1)"; g.fillRect(X(c.x - 2), Y(c.y + 1.5), 4 * p.s, 3 * p.s);
          g.strokeStyle = AMBER; g.lineWidth = 2; g.strokeRect(X(c.x - 2), Y(c.y + 1.5), 4 * p.s, 3 * p.s);
          let n = 0;
          for (const f of found) {
            if (f.getShape().getType() === "chain") continue;
            n++;
            outline(g, f.getBody());
            const bb = f.getAABB(0);
            g.save(); g.setLineDash([4, 3]); g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 1;
            g.strokeRect(X(bb.lowerBound.x), Y(bb.upperBound.y), (bb.upperBound.x - bb.lowerBound.x) * p.s, (bb.upperBound.y - bb.lowerBound.y) * p.s);
            g.restore();
          }
          info = `queryAABB 找到 ${n} 個 fixture`;
        }
        if (mode !== 3 && ptr) {
          const b = p.pick(ptr, (b) => !b.isStatic());
          if (b) { outline(g, b, COLORS[3]); chip(g, "testPoint ✓", X(ptr.x), Y(ptr.y) - 22, { color: COLORS[3], fit: p.W }); }
        }
        g.beginPath(); g.arc(X(O.x), Y(O.y), 9, 0, TAU); g.fillStyle = AMBER; g.fill();
        g.beginPath(); g.arc(X(O.x), Y(O.y), 4, 0, TAU); g.fillStyle = "#0e1013"; g.fill();
        if (info) chip(g, info, p.X(0) + 6, p.Y(12) + 14, { align: "left" });
        chip(g, NOTES[mode], 8, p.H - 15, { align: "left", color: MUTED, fit: p.W });
      };
      p.go();
    },
  },
  {
    id: "bullet", title: "子彈與休眠",
    api: "body.setBullet(true) + world.setContinuousPhysics(v) + world.setAllowSleeping(v)",
    desc: "小球每一步的位移大於「板厚＋球徑」時，一般剛體可能直接穿過動態薄板（穿隧），setBullet(true) 連對動態物體也做連續碰撞，每球都撞上；關掉連續碰撞，連靜態牆也擋不住。靜止的積木會進入休眠（變暗）停止計算。",
    hint: "調砲速看兩條射道的命中數・關「連續碰撞」或「休眠」比較",
    mount(ctx) {
      let speed = 80, nextFire = 0.3, nextCheck = 6;
      ctx.slider("砲速", { min: 30, max: 120, step: 5, value: 80, format: (v) => `${v} m/s` }, (v) => { speed = v; });
      ctx.toggle("連續碰撞", true, (v) => p.world.setContinuousPhysics(v));
      ctx.toggle("休眠", true, (v) => p.world.setAllowSleeping(v));
      ctx.button("發射", () => fire(), { primary: true });
      const p = lab(ctx);
      const PLATE_X = 11, WALL_X = 19.6;
      const lanes = [
        { y0: 5.6, bullet: false, color: COLORS[0], name: "A：一般剛體", tally: [0, 0, 0], pyramid: [] },
        { y0: 0.3, bullet: true, color: COLORS[2], name: "B：setBullet(true)", tally: [0, 0, 0], pyramid: [] },
      ];
      let shots = [];
      function pyramid(L) {
        L.pyramid.forEach((b) => p.kill(b));
        L.pyramid = [];
        for (let row = 0; row < 4; row++) {
          for (let k = 0; k < 4 - row; k++) {
            const pos = V(15.2 + row * 0.3 + k * 0.6, L.y0 + 0.25 + row * 0.5);
            const b = p.world.createDynamicBody({ position: pos });
            b.createFixture(new Box(0.25, 0.25), { density: 1, friction: 0.6 });
            b.setUserData({ color: "#c9a96e", home: pos });
            L.pyramid.push(b);
          }
        }
      }
      function build() {
        p.reset();
        shots = [];
        // A tunnelling ball never touches the plate from the front (local x < 0); balls bouncing back off the wall touch it from behind.
        const mark = (ball, other) => {
          const u = ball.getUserData();
          if (u && u.shot && (other.getUserData() || {}).plate && other.getLocalPoint(ball.getPosition()).x < 0) u.shot.hit = true;
        };
        p.world.on("begin-contact", (c) => { const a = c.getFixtureA().getBody(), b = c.getFixtureB().getBody(); mark(a, b); mark(b, a); });
        p.ground.createFixture(new Box(10, 0.15, V(10, 0.15), 0));
        p.ground.createFixture(new Box(10, 0.15, V(10, 5.45), 0));
        p.ground.createFixture(new Box(10, 0.15, V(10, 10.75), 0));
        p.ground.createFixture(new Box(0.15, 5.45, V(-0.15, 5.45), 0));
        for (const L of lanes) {
          L.pyramid = [];
          p.ground.createFixture(new Box(0.05, 1.5, V(WALL_X, L.y0 + 1.5), 0), { userData: { color: "#8b93a7" } });
          const hinge = V(PLATE_X, L.y0 + 2.5);
          // Heavy plate + swing limit keep it across the firing line, so a ball past it without a front contact really tunnelled.
          L.plate = p.world.createDynamicBody({ position: V(PLATE_X, L.y0 + 1.3), angularDamping: 4 });
          L.plate.createFixture(new Box(0.04, 1.2), { density: 60 });
          L.plate.setUserData({ color: COLORS[3], plate: true });
          p.world.createJoint(new RevoluteJoint({ enableLimit: true, lowerAngle: -0.35, upperAngle: 0.35 }, p.ground, L.plate, hinge));
          pyramid(L);
        }
      }
      function fire() {
        for (const L of lanes) {
          const b = p.world.createDynamicBody({ position: V(1.3, L.y0 + 1.5), bullet: L.bullet, linearVelocity: V(speed, 0) });
          b.createFixture(new Circle(0.12), { density: 4, restitution: 0.2, friction: 0.3 });
          const shot = { b, L, t: p.time, xmax: 0, hit: false };
          b.setUserData({ color: L.color, shot });
          shots.push(shot);
        }
      }
      p.layout = () => p.fit(-0.3, 0, 20.2, 10.9, { t: below(ctx), b: 34 });
      p.after = () => {
        if (p.time > nextFire) { nextFire = p.time + 1.2; fire(); }
        for (let i = shots.length - 1; i >= 0; i--) {
          const s = shots[i], q = s.b.getPosition();
          s.xmax = Math.max(s.xmax, q.x);
          if (p.time - s.t > 1.6 || q.x > 20.6 || q.x < -0.5 || q.y < -1 || q.y > 11.5) {
            const k = s.xmax > WALL_X + 0.1 ? 2 : s.hit ? 0 : s.xmax > PLATE_X + 0.2 ? 1 : -1;
            if (k >= 0) s.L.tally[k]++;
            p.kill(s.b);
            shots.splice(i, 1);
          }
        }
        if (p.time > nextCheck) {
          nextCheck = p.time + 6;
          for (const L of lanes) {
            if (L.pyramid.some((b) => { const h = b.getUserData().home, q = b.getPosition(); return Math.hypot(q.x - h.x, q.y - h.y) > 0.3; })) pyramid(L);
          }
        }
      };
      p.draw = (g) => {
        p.drawWorld();
        const X = p.X, Y = p.Y, fit = p.W;
        let awake = 0, asleep = 0;
        for (let b = p.world.getBodyList(); b; b = b.getNext()) if (b.isDynamic()) b.isAwake() ? awake++ : asleep++;
        for (const L of lanes) {
          g.fillStyle = STEEL;
          g.fillRect(X(0.05), Y(L.y0 + 1.68), 1.15 * p.s, 0.36 * p.s);
          dot(g, X(0.45), Y(L.y0 + 1.2), Math.max(4, 0.3 * p.s), "#5d6880");
          chip(g, L.name, X(0.1), Y(L.y0 + 4.45), { align: "left", color: L.color });
          chip(g, `撞上薄板 ${L.tally[0]}・穿隧 ${L.tally[1]}・穿牆 ${L.tally[2]}`, X(0.1), Y(L.y0 + 3.7), { align: "left", size: 10 });
          chip(g, "動態薄板", X(PLATE_X), Y(L.y0 + 2.95), { color: COLORS[3], size: 10 });
          chip(g, "靜態牆", X(WALL_X), Y(L.y0 + 3.45), { size: 10, fit });
        }
        let x = 8;
        x += chip(g, `每步位移 ${(speed / 60).toFixed(2)} m・板厚＋球徑 0.32 m`, x, p.H - 15, { align: "left", color: AMBER }) + 6;
        chip(g, `醒著 ${awake}・休眠 ${asleep}`, x, p.H - 15, { align: "left" });
      };
      build();
      p.go();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "world.step(1 / 60, velocityIterations, positionIterations)",
    desc: "不靠內建迴圈，每格手動呼叫一次 world.step 再用 Canvas 批次繪圖，兩段分開計時；逐級增加剛體數量直到掉到 30 FPS 以下。中間的 kinematic 槳持續攪動，可切換形狀、速度迭代次數與休眠比較成本。",
    hint: "按「自動加壓」開始・改設定後再測一次",
    mount(ctx) {
      ctx.controls.classList.add("bottom");
      const SHAPES = ["混合", "圓", "方", "多邊形"];
      let shape = 0, sleep = false, box = null, count = 0, paddle = null;
      ctx.group(SHAPES, 0, (i) => { shape = i; if (count) spawn(count); });
      ctx.slider("速度迭代", { min: 1, max: 12, step: 1, value: 8 }, (v) => { p.vel = v; });
      ctx.toggle("休眠", false, (v) => { sleep = v; p.world.setAllowSleeping(v); });
      const p = lab(ctx, { perFrame: true, drag: false });
      // Fill the container with n bodies on a grid sized so they always fit.
      function spawn(n) {
        count = n;
        p.reset();
        p.world.setAllowSleeping(sleep);
        const { cwm, chm } = box;
        p.ground.createFixture(new Box(cwm / 2 + 0.5, 0.25, V(cwm / 2, -0.25), 0));
        p.ground.createFixture(new Box(0.25, 30, V(-0.25, 30), 0));
        p.ground.createFixture(new Box(0.25, 30, V(cwm + 0.25, 30), 0));
        paddle = p.world.createKinematicBody({ position: V(cwm / 2, chm * 0.3), angularVelocity: 1.8 });
        paddle.createFixture(new Box(cwm * 0.18, 0.12));
        const spx = clamp(Math.sqrt((box.cw * box.ch * 0.55) / n) * 0.8, 3, 26), gap = (spx * 1.3) / p.s, sz = spx / p.s;
        const cols = Math.max(1, Math.floor((cwm - 0.3) / gap));
        const hex = [];
        for (let k = 0; k < 6; k++) hex.push([Math.cos((k / 6) * TAU) * sz * 0.5, Math.sin((k / 6) * TAU) * sz * 0.5]);
        for (let i = 0; i < n; i++) {
          const x = 0.15 + gap / 2 + (i % cols) * gap, y = chm - gap / 2 - Math.floor(i / cols) * gap;
          const b = p.world.createDynamicBody({ position: V(x, y) });
          const k = shape ? shape - 1 : i % 3, fd = { density: 1, friction: 0.1, restitution: 0.1 };
          if (k === 0) b.createFixture(new Circle(sz / 2), fd);
          else if (k === 1) b.createFixture(new Box(sz * 0.45, sz * 0.45), fd);
          else b.createFixture(new Polygon(hex.map(([hx, hy]) => V(hx, hy))), fd);
          b.setUserData(i % 6);
        }
      }
      p.layout = (W, H) => {
        const x0 = W >= 760 ? 350 : 10, x1 = W - 10, y0 = 10, y1 = H - ctx.controls.offsetHeight - 20;
        box = { x0, x1, y0, y1, cw: x1 - x0, ch: y1 - y0 };
        p.s = box.ch / 16; p.ox = x0; p.oy = y1;
        box.cwm = box.cw / p.s; box.chm = 16;
        if (count) spawn(count);
      };
      // Batched drawing: one Path2D per color, sleeping bodies in a single muted batch, no strokes.
      p.draw = (g) => {
        if (!box) return;
        g.fillStyle = "#151922";
        g.fillRect(box.x0, box.y0, box.cw, box.ch);
        if (!paddle) return;
        const paths = COLORS.map(() => new Path2D()), sleepy = new Path2D();
        for (let b = p.world.getBodyList(); b; b = b.getNext()) {
          if (!b.isDynamic()) continue;
          const path = b.isAwake() ? paths[b.getUserData()] : sleepy;
          const q = b.getPosition(), a = b.getAngle(), c = Math.cos(a), s = Math.sin(a), sh = b.getFixtureList().getShape();
          if (sh.getType() === "circle") {
            const r = sh.getRadius() * p.s, x = p.X(q.x), y = p.Y(q.y);
            path.moveTo(x + r, y); path.arc(x, y, r, 0, TAU);
          } else {
            const vs = sh.m_vertices;
            for (let k = 0; k < sh.m_count; k++) {
              const v = vs[k], x = p.X(q.x + c * v.x - s * v.y), y = p.Y(q.y + s * v.x + c * v.y);
              k ? path.lineTo(x, y) : path.moveTo(x, y);
            }
            path.closePath();
          }
        }
        COLORS.forEach((col, i) => { g.fillStyle = col; g.fill(paths[i]); });
        g.fillStyle = MUTED; g.fill(sleepy);
        g.fillStyle = "#e8e6df";
        g.beginPath(); p.path(paddle, paddle.getFixtureList()); g.fill();
        g.strokeStyle = "#2a2f3a"; g.lineWidth = 3;
        g.strokeRect(box.x0, box.y0, box.cw, box.ch);
      };
      p.go();
      ctx.ramp({
        label: "剛體", unit: "個", steps: [100, 250, 500, 1000, 1500, 2000, 3000, 4000, 6000], minFps: 30,
        apply(n) { spawn(n); },
        metrics: () => ({
          接觸: p.world.getContactCount(),
          物理: `${p.phys.toFixed(1)} ms`,
          繪圖: `${p.paint.toFixed(1)} ms`,
          樹高: p.world.getTreeHeight(),
          模式: `${SHAPES[shape]}・迭代 ${p.vel}${sleep ? "・休眠" : ""}`,
        }),
        note: "每格先跑一次 world.step（寬相位、窄相位碰撞與約束求解）再畫 Canvas，兩段分開計時。速度迭代越多越穩也越慢；開「休眠」後靜止的剛體停算；樹高是動態 AABB 樹的深度，影響寬相位查詢成本。手機與內顯的上限通常明顯較低。",
      });
    },
  },
] });
</script>
