<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plotly.js 示範：3D 地形曲面</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","size":"約 1.8 MB"}</script>
<style>
  body { background: radial-gradient(80% 80% at 50% 40%, #182029 0%, var(--bg) 75%); }
  #plot { position: fixed; inset: 0; }
  .title { position: fixed; left: 14px; top: 12px; z-index: 40; pointer-events: none; }
  .title h1 { margin: 0; font-size: 16px; }
  .title p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) { .title { top: 56px; } }
</style>
</head>
<body>
<div id="plot"></div>
<div class="title"><h1 id="name">中央山脈示意地形</h1><p id="desc">示意資料・等高線投影在底面</p></div>
<div class="controls">
  <button class="btn" data-s="terrain" aria-pressed="true">地形</button>
  <button class="btn" data-s="ripple">漣漪</button>
  <button class="btn" data-s="saddle">鞍面</button>
  <button class="btn primary" id="spin" aria-pressed="true">自動旋轉</button>
</div>
<div class="hint">拖曳旋轉・滾輪縮放・滑過讀取座標</div>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-gl3d-dist-min@4.1.1/plotly-gl3d.min.js"></script>
<script>
// Plotly 3D surface with projected contours, switchable functions and a turntable camera.
const N = 70;
const axis = Array.from({ length: N }, (_, i) => -1 + (2 * i) / (N - 1));

// Synthetic mountain ridge running NNE with a few named peaks (illustrative only).
function terrain(x, y) {
  const a = 0.35, u = x * Math.cos(a) - y * Math.sin(a), v = x * Math.sin(a) + y * Math.cos(a);
  const along = Math.exp(-((v / 0.8) ** 4));
  const main = Math.exp(-(((u + 0.12) / 0.2) ** 2)) * along;
  const snow = Math.exp(-(((u - 0.3) / 0.12) ** 2)) * Math.exp(-(((v - 0.4) / 0.32) ** 2));
  const peak = (px, py, h, s) => h * Math.exp(-(((x - px) ** 2 + (y - py) ** 2) / s));
  const n = 0.5 * Math.sin(11 * x + 2 * y) * Math.cos(9 * y - 3 * x) + 0.3 * Math.sin(23 * x - 17 * y) + 0.2 * Math.cos(31 * y + 13 * x);
  const z = 2700 * main + 2100 * snow + peak(-0.05, -0.2, 1100, 0.012) + (main + snow) * 650 * n;
  return Math.max(0, z);
}
const SURFACES = {
  terrain: { name: "中央山脈示意地形", desc: "示意資料・等高線投影在底面", z: terrain, zTitle: "海拔（m）",
    colors: [[0, "#0b2a3c"], [0.04, "#1e6f5c"], [0.3, "#7bd389"], [0.55, "#c9a66b"], [0.8, "#8a6a4f"], [1, "#f4f1ea"]] },
  ripple: { name: "水面漣漪 sin(r)/r", desc: "數學曲面・中心向外衰減的波", zTitle: "振幅",
    z: (x, y) => { const r = Math.hypot(x, y) * 14 + 1e-6; return Math.sin(r) / r; },
    colors: [[0, "#2b1d5c"], [0.35, "#4cc9f0"], [0.6, "#9d8cff"], [1, "#f7df1e"]] },
  saddle: { name: "鞍面 z = x² − y²", desc: "數學曲面・雙曲拋物面", zTitle: "z",
    z: (x, y) => x * x - y * y,
    colors: [[0, "#f72585"], [0.5, "#171a1f"], [1, "#4cc9f0"]] },
};

const grid = (fn) => axis.map((y) => axis.map((x) => fn(x, y)));
const axisStyle = (title) => ({
  title: { text: title, font: { size: 11, color: "#9b998f" } },
  gridcolor: "rgba(255,255,255,0.12)", zerolinecolor: "rgba(255,255,255,0.2)",
  backgroundcolor: "#161a20", showbackground: true,
  tickfont: { size: 9, color: "#9b998f" },
});

function trace(key) {
  const s = SURFACES[key];
  return {
    type: "surface", x: axis.map((v) => +(v * 50).toFixed(1)), y: axis.map((v) => +(v * 50).toFixed(1)), z: grid(s.z),
    colorscale: s.colors, showscale: true,
    colorbar: { thickness: 10, len: 0.55, x: 0.98, tickfont: { color: "#9b998f", size: 10 }, outlinewidth: 0 },
    contours: { z: { show: true, usecolormap: true, highlightcolor: "#f7df1e", project: { z: true }, width: 2 } },
    lighting: { ambient: 0.55, diffuse: 0.8, specular: 0.25, roughness: 0.6 },
    hovertemplate: "東西 %{x} km<br>南北 %{y} km<br>" + s.zTitle + " %{z:.2f}<extra></extra>",
  };
}

const layout = {
  paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
  font: { family: getComputedStyle(document.body).fontFamily, color: "#ecebe6" },
  margin: { l: 0, r: 0, t: 0, b: 0 },
  scene: {
    xaxis: axisStyle("東西（km）"), yaxis: axisStyle("南北（km）"), zaxis: axisStyle("海拔（m）"),
    aspectmode: "manual", aspectratio: { x: 1, y: 1, z: 0.55 },
    camera: { eye: { x: 1.6, y: -1.4, z: 0.9 } },
    bgcolor: "rgba(0,0,0,0)",
  },
  hoverlabel: { bgcolor: "#171a1f", bordercolor: "#f7df1e", font: { color: "#ecebe6" } },
};
const config = { responsive: true, displaylogo: false, modeBarButtonsToRemove: ["toImage", "resetCameraLastSave3d"] };
const el = document.getElementById("plot");
// Narrow frames: pull the camera back so the whole box fits.
if (innerWidth < 640) layout.scene.camera.eye = { x: 2.1, y: -1.85, z: 1.2 };
let current = "terrain";

Plotly.newPlot(el, [trace(current)], layout, config).then(startSpin);

document.querySelectorAll("[data-s]").forEach((b) => b.addEventListener("click", () => {
  current = b.dataset.s;
  document.querySelectorAll("[data-s]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  document.getElementById("name").textContent = SURFACES[current].name;
  document.getElementById("desc").textContent = SURFACES[current].desc;
  const lay = { ...layout, scene: { ...layout.scene, camera: el.layout.scene.camera, zaxis: axisStyle(SURFACES[current].zTitle) } };
  Plotly.react(el, [trace(current)], lay, config);
}));

// Turntable rotation: orbit the camera eye around the z axis.
let spinning = true, angle = Math.atan2(layout.scene.camera.eye.y, layout.scene.camera.eye.x), last = 0;
const spinBtn = document.getElementById("spin");
function startSpin() {
  function step(t) {
    if (spinning && t - last > 40) {
      last = t;
      angle += 0.012;
      const eye = el.layout.scene.camera.eye, r = Math.hypot(eye.x, eye.y);
      Plotly.relayout(el, { "scene.camera.eye": { x: r * Math.cos(angle), y: r * Math.sin(angle), z: eye.z } });
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  // Stop spinning as soon as the user grabs the scene.
  el.addEventListener("pointerdown", () => setSpin(false));
}
function setSpin(on) {
  spinning = on;
  spinBtn.setAttribute("aria-pressed", String(on));
  if (on) { const e = el.layout.scene.camera.eye; angle = Math.atan2(e.y, e.x); }
}
spinBtn.addEventListener("click", () => setSpin(!spinning));
</script>
</body>
</html>
