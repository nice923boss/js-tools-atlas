<script>
// Plotly.js showcase: 3D surface, statistical traces, hierarchy and sankey, maps, linked selection,
// frame animation, live streaming with extendTraces and a per-frame react stress ramp.
const css = getComputedStyle(document.documentElement);
const PAL = ["--c2", "--c1", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim();
const MONO = css.getPropertyValue("--mono").trim();
const FG = "#ecebe6", MUTED = "#9b998f", ACC = "#f7df1e";
const nf = new Intl.NumberFormat("zh-TW");
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const median = (a) => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
// Opaque blend of hex over the page background; Plotly picks inside-text contrast from the raw color, so translucent fills get dark labels.
const mix = (hex, a) => { const n = parseInt(hex.slice(1), 16), bg = [14, 16, 19], c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  return `rgb(${c.map((v, i) => Math.round(v * a + bg[i] * (1 - a))).join(",")})`; };
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const gauss = (r) => Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(2 * Math.PI * r());

// Call fn({ width, height }) now and whenever el changes size.
function fit(ctx, el, fn) {
  let w = -1, h = -1, queued = 0;
  const run = () => {
    queued = 0;
    const r = el.getBoundingClientRect(), width = Math.round(r.width), height = Math.round(r.height);
    if (width < 20 || height < 20 || (width === w && height === h)) return;
    w = width; h = height;
    fn({ width, height });
  };
  const ro = new ResizeObserver(() => { if (!queued) queued = requestAnimationFrame(run); });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(queued); });
  run();
}
// Plotly.purge leaves WebGL contexts to the garbage collector; release them now so scene switches never pile up contexts.
function purgeGL(el) {
  const gls = [...el.querySelectorAll("canvas")].map((c) => c.getContext("webgl2") || c.getContext("webgl"));
  Plotly.purge(el);
  gls.forEach((gl) => gl && gl.getExtension("WEBGL_lose_context")?.loseContext());
}
const CONFIG = { locale: "zh-TW", displaylogo: false, responsive: false, modeBarButtonsToRemove: ["toImage"] };
// Plotly.react bound to a scene: redrawn at the box size on every resize, purged on cleanup.
// render(size) returns { data, layout, frames? }. Draws run in a microtask so callers can finish their setup first.
function plot(ctx, el, render, { config = {}, gl = false } = {}) {
  let size = null, resolve, last = Promise.resolve();
  const ready = new Promise((r) => (resolve = r));
  const react = () => {
    if (!size || !ctx.active) return Promise.resolve();
    const f = render(size);
    return Plotly.react(el, { data: f.data, layout: { ...f.layout, width: size.width, height: size.height }, frames: f.frames, config: { ...CONFIG, ...config } });
  };
  // Purging a plot whose draw is still loading (geo topojson, MapLibre style) makes Plotly throw inside its own promise
  // chain, so cleanup waits for the last draw to settle (capped at 4 s). A map subplot also throws when redrawn before
  // its style has loaded, so GL plots queue each draw behind the previous one.
  const draw = () => (last = gl ? last.catch(() => {}).then(react) : react());
  ctx.onCleanup(() => {
    Promise.race([last.catch(() => {}), new Promise((r) => setTimeout(r, 4000))]).then(() => (gl ? purgeGL(el) : Plotly.purge(el)));
  });
  fit(ctx, el, (s) => { size = s; queueMicrotask(() => draw().then(resolve)); });
  return { draw, ready };
}
const HOVER = { bgcolor: "#171a1f", bordercolor: "rgba(255,255,255,0.25)", font: { family: FONT, color: FG, size: 12 } };
const AXIS = { gridcolor: "rgba(255,255,255,0.07)", zerolinecolor: "rgba(255,255,255,0.18)", linecolor: "rgba(255,255,255,0.22)",
  tickfont: { family: MONO, size: 10, color: MUTED }, automargin: true };
const ax = (title, o = {}) => ({ ...AXIS, ...o, title: { text: title, font: { size: 11, color: MUTED }, standoff: 6 }, tickfont: { ...AXIS.tickfont, ...o.tickfont } });
const CAT = { tickfont: { family: FONT, size: 11, color: FG } };
const LAY = (o) => ({ paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", colorway: PAL, font: { family: FONT, color: FG, size: 12 },
  hoverlabel: HOVER, modebar: { bgcolor: "rgba(0,0,0,0)", color: MUTED, activecolor: ACC }, uirevision: 1, ...o });
const TTL = (text, sub) => ({ text, x: 0.012, xanchor: "left", y: 1, yanchor: "top", pad: { t: 8 }, font: { size: 14, color: FG },
  ...(sub ? { subtitle: { text: sub, font: { size: 11, color: MUTED } } } : {}) });
const LEG = (o) => ({ bgcolor: "rgba(0,0,0,0)", font: { size: 11, color: FG }, ...o });

// ---------- shared Taiwan data (illustrative, rounded) ----------
const NAMES = { A: "臺北市", B: "臺中市", C: "基隆市", D: "臺南市", E: "高雄市", F: "新北市", G: "宜蘭縣", H: "桃園市",
  I: "嘉義市", J: "新竹縣", K: "苗栗縣", M: "南投縣", N: "彰化縣", O: "新竹市", P: "雲林縣", Q: "嘉義縣", T: "屏東縣",
  U: "花蓮縣", V: "臺東縣", W: "金門縣", X: "澎湖縣", Z: "連江縣" };
const VALUES = {

    O: 1700, P: 1250, Q: 1950, T: 2500, U: 2150, V: 1850, W: 1050, X: 1000, Z: 1150 },

    O: 4400, P: 520, Q: 255, T: 290, U: 70, V: 60, W: 940, X: 840, Z: 470 },
};
const META = {
  rain: { title: "年雨量", unit: "mm", colors: ["#0b2a3c", "#126e8f", "#4cc9f0", "#bdf2ff"] },
  temp: { title: "年均溫", unit: "°C", colors: ["#2b1d5c", "#9d8cff", "#ff8c42", "#f7df1e"] },
  dens: { title: "人口密度", unit: "人/km²", colors: ["#1d2a1f", "#2f7d4f", "#7bd389", "#f7df1e"], log: true },
};
const REGIONS = ["北部", "中部", "南部", "東部", "離島"];
// Population in 10k people (approximate).
const POP = { 北部: { 新北市: 405, 臺北市: 249, 桃園市: 232, 新竹縣: 59, 新竹市: 46, 宜蘭縣: 45, 基隆市: 36 },
  中部: { 臺中市: 286, 彰化縣: 123, 雲林縣: 66, 苗栗縣: 53, 南投縣: 47 },
  南部: { 高雄市: 273, 臺南市: 186, 屏東縣: 79, 嘉義縣: 48, 嘉義市: 26 },
  東部: { 花蓮縣: 32, 臺東縣: 21 }, 離島: { 金門縣: 14, 澎湖縣: 11, 連江縣: 1.4 } };
const REG_COLOR = { 北部: PAL[0], 中部: PAL[3], 南部: PAL[4], 東部: PAL[5], 離島: PAL[2] };
const POP_OF = {};
for (const r of REGIONS) for (const [n, v] of Object.entries(POP[r])) POP_OF[n] = v;
const CITY6 = ["臺北", "新北", "桃園", "臺中", "臺南", "高雄"];
const CITY_COLOR = Object.fromEntries(CITY6.map((c, i) => [c, PAL[i]]));

// Kinmen and Matsu are moved closer as insets so the main island stays large.
const SHIFT = { W: [0.95, 0.5], Z: [-0.2, -0.6] };
const shiftCoords = (c, [dx, dy]) => (typeof c[0] === "number" ? [c[0] + dx, c[1] + dy] : c.map((x) => shiftCoords(x, [dx, dy])));
let TW = null;
async function loadTaiwan(ctx) {
  if (TW) return TW;
  await ctx.load("https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js");
  const res = await fetch("https://cdn.jsdelivr.net/npm/taiwan-atlas@2021.9.20/counties-10t.json", { signal: ctx.signal });
  if (!res.ok) throw new Error(`地圖資料載入失敗（HTTP ${res.status}）`);
  const topo = await res.json();
  const geo = topojson.feature(topo, topo.objects.counties);
  geo.features.forEach((f) => {
    const id = f.properties.COUNTYID;
    f.properties = { id, name: NAMES[id] || f.properties.COUNTYNAME };
    if (SHIFT[id]) f.geometry.coordinates = shiftCoords(f.geometry.coordinates, SHIFT[id]);
  });
  TW = geo;
  return TW;
}

// ---------- scene data ----------
const N3D = 70, AXIS3D = Array.from({ length: N3D }, (_, i) => -1 + (2 * i) / (N3D - 1));
// Synthetic mountain ridge running NNE with a few named peaks (illustrative only).
function terrain(x, y) {
  const a = 0.35, u = x * Math.cos(a) - y * Math.sin(a), v = x * Math.sin(a) + y * Math.cos(a);
  const along = Math.exp(-((v / 0.8) ** 4));
  const main = Math.exp(-(((u + 0.12) / 0.2) ** 2)) * along;
  const snow = Math.exp(-(((u - 0.3) / 0.12) ** 2)) * Math.exp(-(((v - 0.4) / 0.32) ** 2));
  const peak = (px, py, h, s) => h * Math.exp(-(((x - px) ** 2 + (y - py) ** 2) / s));
  const n = 0.5 * Math.sin(11 * x + 2 * y) * Math.cos(9 * y - 3 * x) + 0.3 * Math.sin(23 * x - 17 * y) + 0.2 * Math.cos(31 * y + 13 * x);
  const z = 2700 * main + 2100 * snow + peak(-0.05, -0.2, 1100, 0.012) + (main + snow) * 650 * n;
  return Math.max(0, z);
}
const SURFACES = {
  terrain: { name: "中央山脈示意地形", desc: "示意資料・等高線投影在底面", z: terrain, zTitle: "海拔（m）", peak: (v) => `${nf.format(Math.round(v))} m`,
    colors: [[0, "#0b2a3c"], [0.04, "#1e6f5c"], [0.3, "#7bd389"], [0.55, "#c9a66b"], [0.8, "#8a6a4f"], [1, "#f4f1ea"]] },
  ripple: { name: "水面漣漪 sin(r)/r", desc: "數學曲面・中心向外衰減的波", zTitle: "振幅", peak: (v) => v.toFixed(2),
    z: (x, y) => { const r = Math.hypot(x, y) * 14 + 1e-6; return Math.sin(r) / r; },
    colors: [[0, "#2b1d5c"], [0.35, "#4cc9f0"], [0.6, "#9d8cff"], [1, "#f7df1e"]] },
  saddle: { name: "鞍面 z = x² − y²", desc: "數學曲面・雙曲拋物面", zTitle: "z", peak: (v) => v.toFixed(2),
    z: (x, y) => x * x - y * y, colors: [[0, "#f72585"], [0.5, "#171a1f"], [1, "#4cc9f0"]] },
};
const GRID3D = {};
function surfaceGrid(key) {
  if (GRID3D[key]) return GRID3D[key];
  const s = SURFACES[key], z = AXIS3D.map((y) => AXIS3D.map((x) => s.z(x, y)));
  let best = [0, 0, -Infinity];
  z.forEach((row, j) => row.forEach((v, i) => { if (v > best[2]) best = [i, j, v]; }));
  return (GRID3D[key] = { z, peak: best });
}
const KM = AXIS3D.map((v) => +(v * 50).toFixed(1));
const axis3 = (title) => ({ title: { text: title, font: { size: 11, color: MUTED } }, gridcolor: "rgba(255,255,255,0.12)", zerolinecolor: "rgba(255,255,255,0.2)",
  backgroundcolor: "#161a20", showbackground: true, tickfont: { family: MONO, size: 9, color: MUTED } });

// Commute minutes per city with a few long outliers, weekday vs weekend trips and distance vs time pairs.
const COMMUTE = [["臺北", 38, 11], ["新北", 47, 15], ["桃園", 36, 13], ["臺中", 31, 10], ["臺南", 26, 9], ["高雄", 33, 11]];
function statsData(seed) {
  const r = rng(seed), g = () => gauss(r);
  const cities = COMMUTE.map(([name, m, sd]) => ({ name,
    v: Array.from({ length: 220 }, () => Math.max(4, Math.round(m + g() * sd + (r() < 0.04 ? 30 + r() * 25 : 0)))) }));
  const week = [["臺北", 38], ["臺中", 31], ["高雄", 33]].map(([name, m]) => ({ name,
    wd: Array.from({ length: 180 }, () => Math.max(4, m + g() * 9)),
    we: Array.from({ length: 180 }, () => Math.max(4, r() < 0.6 ? 18 + g() * 6 : 55 + g() * 14)) }));
  const dist = [], time = [];
  for (let i = 0; i < 700; i++) {
    const d = Math.min(40, 0.8 - Math.log(1 - r()) * 7);
    dist.push(+d.toFixed(2)); time.push(Math.max(3, 6 + d * (1.5 + r() * 0.8) + g() * 4));
  }
  return { cities, week, dist, time };
}

// Hierarchy in thousands of people so branchvalues "total" sums are exact integers.
const HIER = (() => {
  const ids = ["臺灣"], labels = ["臺灣"], parents = [""], values = [0], colors = ["#232831"];
  for (const r of REGIONS) {
    const kids = Object.entries(POP[r]).map(([n, v]) => [n, Math.round(v * 10)]), total = kids.reduce((a, [, v]) => a + v, 0);
    ids.push(r); labels.push(r); parents.push("臺灣"); values.push(total); colors.push(REG_COLOR[r]);
    values[0] += total;
    for (const [n, v] of kids) { ids.push(n); labels.push(n); parents.push(r); values.push(v); colors.push(mix(REG_COLOR[r], 0.55)); }
  }
  return { ids, labels, parents, values, colors, customdata: values.map((v) => nf.format(v / 10)) };
})();
// Annual electricity flow in 100 GWh (illustrative).

  const nodes = [["太陽光電", PAL[1]], ["風力", PAL[0]], ["水力", PAL[5]], ["燃氣", PAL[4]], ["燃煤", "#8a8f98"], ["其他", "#6b6f78"],
    ["再生能源", PAL[3]], ["電網", "#d8d6cf"], ["工業", PAL[2]], ["住宅", PAL[0]], ["服務業", PAL[5]], ["農業", PAL[3]], ["廠用與線損", "#6b6f78"]];

})();

// Synthetic epicentres: offshore Hualien and Yilan clusters plus inland faults, Gutenberg-Richter magnitudes (b = 1).
const QUAKES = (() => {
  const r = rng(9), g = () => gauss(r);
  const SRC = [[24.0, 121.85, 0.22, 0.3], [24.65, 122.05, 0.2, 0.17], [22.85, 121.45, 0.28, 0.14], [23.2, 120.45, 0.18, 0.1],
    [23.85, 120.85, 0.14, 0.08], [22.35, 120.65, 0.18, 0.07]];
  const lat = [], lon = [], mag = [];
  for (let i = 0; i < 1800; i++) {
    const u = r();
    let acc = 0, s = null;
    for (const c of SRC) { acc += c[3]; if (u < acc) { s = c; break; } }
    const la = s ? s[0] + g() * s[2] : 21.9 + r() * 3.4, lo = s ? s[1] + g() * s[2] * 1.1 : 119.9 + r() * 2.6;
    lat.push(+la.toFixed(3)); lon.push(+lo.toFixed(3)); mag.push(+(2 - Math.log10(1 - r())).toFixed(1));
  }
  return { lat, lon, mag };
})();
const CITY_PTS = [["臺北", 25.04, 121.56], ["臺中", 24.15, 120.67], ["臺南", 22.99, 120.21], ["高雄", 22.63, 120.3], ["花蓮", 23.98, 121.6], ["臺東", 22.76, 121.14]];

          e.points.forEach((pt) => idx[pt.curveNumber] && idx[pt.curveNumber].push(pt.pointIndex));
          setSel(idx, false);
        });
        lb.on("plotly_deselect", () => setSel(null, false));
      });
      right.ready.then(() => rb.on("plotly_click", (e) => {
        const pt = e.points[0];
        if (pt.data.type !== "bar") return;
        const c = CITY6.indexOf(pt.y);
        setSel(DEALS.map((d, i) => (i === c ? d.x.map((_, k) => k) : [])), true);
      }));
    },
  },
  {
    id: "anim", title: "動畫影格",
    api: "Plotly.react(gd, { data, layout, frames })・Plotly.animate(gd, null, { frame, transition })・layout.sliders・layout.updatemenus",
    desc: "每年一個 frame，泡泡用 ids 對應同一縣市，播放時以 transition 補間移動；底部的播放鍵與年份滑桿是 Plotly 內建的 updatemenus 與 sliders。",
    hint: "按播放或拖曳年份滑桿・滑過泡泡看數值・點圖例隱藏區域",
    mount(ctx) {
      ctx.html(`<div class="pl-box"><div class="pl-year"></div><div class="pl-plot"></div></div>`);
      const box = ctx.$(".pl-plot"), yearEl = ctx.$(".pl-year");
      // Plotly's built-in play/pause buttons and slider call Plotly.animate without catching; a pause or scrub
      // interrupts the running animation, whose promise then rejects with no reason. That is expected here.
      ctx.on(window, "unhandledrejection", (e) => { if (e.reason === undefined) e.preventDefault(); });
      const BY_REGION = REGIONS.map((r) => Object.keys(POP[r]));
      const maxPop = Math.max(...Object.values(POP_OF));
      const PLAY = { fromcurrent: true, frame: { duration: 700, redraw: false }, transition: { duration: 600, easing: "cubic-in-out" } };
      let cur = 0;
      yearEl.textContent = YEARS[cur];
      const p = plot(ctx, box, ({ width }) => {

        const pts = (k) => BY_REGION.map((cs) => cs.map((n) => agingAt(n, k)));

        return {
          data: REGIONS.map((r, i) => ({ type: "scatter", mode: "markers+text", name: r, ids: BY_REGION[i], customdata: BY_REGION[i],
            x: at[i].map((q) => q.x), y: at[i].map((q) => q.y), text: BY_REGION[i].map((n) => (BIG.has(n) ? n.slice(0, 2) : "")),
            textposition: "top center", textfont: { family: FONT, size: 10, color: FG },
            marker: { size: BY_REGION[i].map((n) => POP_OF[n]), sizemode: "area", sizeref: (2 * maxPop) / (narrow ? 34 : 56) ** 2, sizemin: 4,
              color: REG_COLOR[r], opacity: 0.8, line: { color: "rgba(14,16,19,0.8)", width: 1 } },
            hovertemplate: "<b>%{customdata}</b><br>家戶所得 %{x:.0f} 萬元<br>65 歲以上 %{y:.1f}%<extra></extra>" })),
          frames: YEARS.map((y, k) => { const q = pts(k); return { name: String(y), traces: [0, 1, 2, 3, 4], data: q.map((a) => ({ x: a.map((v) => v.x), y: a.map((v) => v.y) })) }; }),
          layout: LAY({ margin: m, hovermode: "closest", legend: LEG({ orientation: "h", x: 0, y: 1.01, yanchor: "bottom" }),
            xaxis: ax("家戶年所得（萬元）", { range: [70, 175], automargin: false }), yaxis: ax("65 歲以上人口比例（%）", { range: [8, 28], automargin: false }),
            updatemenus: [{ type: "buttons", direction: "left", showactive: false, x: 0, xanchor: "left", y: 0, yanchor: "top", pad: { t: narrow ? 52 : 62 },
              bgcolor: "#1d2128", bordercolor: "rgba(255,255,255,0.18)", font: { family: FONT, color: FG, size: 12 },
              buttons: [{ label: "播放", method: "animate", args: [null, PLAY] },
                { label: "暫停", method: "animate", args: [[null], { mode: "immediate", frame: { duration: 0, redraw: false }, transition: { duration: 0 } }] }] }],
            sliders: [{ active: cur, x: sx, len: 1 - sx, y: 0, yanchor: "top", pad: { t: narrow ? 40 : 50 },
              currentvalue: { visible: !narrow, prefix: "年份 ", font: { family: MONO, color: MUTED, size: 12 } },
              font: { family: MONO, color: MUTED, size: 10 }, bgcolor: "#2a2f37", activebgcolor: ACC, bordercolor: "rgba(0,0,0,0)", tickcolor: MUTED,
              steps: YEARS.map((y) => ({ label: narrow ? String(y).slice(2) : String(y), method: "animate",
                args: [[String(y)], { mode: "immediate", frame: { duration: 400, redraw: false }, transition: { duration: 350 } }] })) }] }),
        };
      });
      p.ready.then(() => {
        box.on("plotly_animatingframe", (e) => { cur = Math.max(0, YEARS.indexOf(+e.name)); yearEl.textContent = e.name; });
        // An interrupted animation rejects its promise; that is the normal result of pausing or scrubbing.
        if (ctx.active) Plotly.animate(box, null, PLAY).catch(() => {});

  },
  {
    id: "stream", title: "即時串流",
    api: "Plotly.extendTraces(gd, { x, y }, [0, 1, 2], 240)・{ type: \"indicator\", mode: \"gauge+number+delta\" }・hovermode: \"x unified\"",
    desc: "模擬電網每分鐘一筆資料，extendTraces 只送新點並保留最近 240 點；負載與供電能力之間的填色就是備轉容量，右側 indicator 儀表依門檻變色。",
    hint: "切換 1×／4× 速度・按「尖峰負載」看備轉率掉下來・滑過看同一時間的各項數值",
    mount(ctx) {
      ctx.html(`<div class="pl-stream"><div class="pl-cell"><div class="pl-plot"></div></div><div class="pl-cell"><div class="pl-plot"></div></div></div>`);
      // Plotly shows millisecond timestamps in the browser's local time zone, so the day starts at local midnight.
      const [cb, gb] = ctx.$$(".pl-plot"), WIN = 240, DAY0 = new Date(2025, 6, 15).getTime(), r = rng(77);
      const H = { t: [], L: [], C: [], S: [] };
      // History covers 14:00 to 17:00; the live part runs into sunset and the evening peak, where the reserve is thinnest.
      let on = true, speed = 1, spike = 0, nz = 0, cl = 0, minute = 14 * 60, ready = false;
      // Summer weekday model in 10 MW: afternoon and evening peaks, solar bell curve with cloud noise, thermal units ramping for the evening.
      function step() {
        const h = (minute / 60) % 24;
        nz = nz * 0.92 + gauss(r) * 9; cl = clamp(cl * 0.96 + gauss(r) * 0.035, -0.35, 0.05); spike *= 0.965;
        const load = 2700 + 1250 * Math.exp(-(((h - 14) / 5) ** 2)) + 520 * Math.exp(-(((h - 20) / 1.6) ** 2)) + nz + spike;
        const solar = h > 5.8 && h < 18.8 ? Math.max(0, 1250 * Math.sin((Math.PI * (h - 5.8)) / 13) * (1 + cl)) : 0;
        const cap = 3000 + 900 * Math.exp(-(((h - 19) / 5.5) ** 2)) + solar;
        const pt = { t: DAY0 + minute * 60000, L: Math.round(load), C: Math.round(cap), S: Math.round(solar) };
        minute++;
        for (const k in H) { H[k].push(pt[k]); if (H[k].length > WIN) H[k].shift(); }
        return pt;
      }
      for (let i = 0; i < 180; i++) step();
      ctx.toggle("串流", true, (v) => (on = v));
      ctx.group(["1×", "4×"], 0, (i) => (speed = i ? 4 : 1));
      ctx.button("尖峰負載", () => { spike += 350; });
      const chart = plot(ctx, cb, () => ({
        data: [
          { type: "scatter", mode: "lines", name: "供電能力", x: H.t.slice(), y: H.C.slice(), line: { color: PAL[3], width: 1.6, dash: "dot" }, hovertemplate: "%{y:,} 萬瓩" },
          { type: "scatter", mode: "lines", name: "用電負載", x: H.t.slice(), y: H.L.slice(), line: { color: PAL[0], width: 2 }, fill: "tonexty",
            fillcolor: "rgba(123,211,137,0.14)", hovertemplate: "%{y:,} 萬瓩" },
          { type: "scatter", mode: "lines", name: "太陽光電", x: H.t.slice(), y: H.S.slice(), yaxis: "y2", line: { color: ACC, width: 1.6 }, fill: "tozeroy",
            fillgradient: { type: "vertical", colorscale: [[0, "rgba(247,223,30,0)"], [1, "rgba(247,223,30,0.45)"]] }, hovertemplate: "%{y:,} 萬瓩" },
        ],
        layout: LAY({ margin: { l: 52, r: 14, t: 34, b: 30 }, hovermode: "x unified", hoversubplots: "axis",
          legend: LEG({ orientation: "h", x: 0, y: 1.01, yanchor: "bottom", traceorder: "normal" }),
          xaxis: ax("", { type: "date", tickformat: "%H:%M", hoverformat: "%H:%M", anchor: "y2" }),
          yaxis: ax("負載與供電（萬瓩）", { domain: [0.4, 1] }), yaxis2: ax("太陽光電", { domain: [0, 0.3], rangemode: "tozero" }) }),
      }));
      const gauge = plot(ctx, gb, ({ height }) => {
        const i = H.L.length - 1, res = ((H.C[i] - H.L[i]) / H.L[i]) * 100, bullet = height < 160;
        const [light, lc] = res >= 10 ? ["綠燈・供電充裕", PAL[3]] : res >= 6 ? ["黃燈・供電吃緊", PAL[1]] : ["橘燈・供電警戒", PAL[4]];
        const g = { type: "indicator", mode: "gauge+number+delta", value: res,
          number: { suffix: "%", valueformat: ".1f", font: { family: MONO, color: FG, size: bullet ? 20 : 40 } },
          delta: { reference: 10, valueformat: ".1f", font: { family: MONO, size: bullet ? 12 : 15 }, increasing: { color: PAL[3] }, decreasing: { color: PAL[4] } },
          title: { text: `備轉容量率<br><span style="font-size:12px;color:${lc}">${light}</span>`, font: { family: FONT, size: bullet ? 12 : 15, color: FG } },
          gauge: { shape: bullet ? "bullet" : "angular", axis: { range: [0, 25], ticksuffix: "%", tickfont: { family: MONO, color: MUTED, size: 10 }, tickcolor: MUTED },
            bar: { color: FG, thickness: 0.3 }, bgcolor: "rgba(255,255,255,0.03)", borderwidth: 0,
            steps: [{ range: [0, 6], color: rgba(PAL[4], 0.55) }, { range: [6, 10], color: rgba(PAL[1], 0.45) }, { range: [10, 25], color: rgba(PAL[3], 0.35) }],
            threshold: { line: { color: PAL[2], width: 3 }, thickness: 0.85, value: 6 } },
          domain: bullet ? { x: [0.3, 0.86], y: [0.18, 0.72] } : { x: [0, 1], y: [0.4, 1] } };
        const ref = H.L[Math.max(0, i - 15)];
        const n = { type: "indicator", mode: "number+delta", value: H.L[i],
          number: { suffix: " 萬瓩", valueformat: ",.0f", font: { family: MONO, color: FG, size: 30 } },
          delta: { reference: ref, valueformat: ",.0f", font: { family: MONO, size: 14 }, increasing: { color: PAL[4] }, decreasing: { color: PAL[3] } },
          title: { text: "用電負載（與 15 分鐘前比較）", font: { family: FONT, size: 12, color: MUTED } }, domain: { x: [0, 1], y: [0, 0.3] } };
        return { data: bullet ? [g] : [g, n], layout: LAY({ margin: bullet ? { l: 8, r: 8, t: 6, b: 6 } : { l: 28, r: 28, t: 40, b: 16 } }) };
      }, { config: { displayModeBar: false } });
      chart.ready.then(() => (ready = true));
      ctx.interval(() => {
        if (!on || !ready) return;
        const add = { t: [], L: [], C: [], S: [] };
        for (let k = 0; k < speed; k++) { const pt = step(); for (const key in add) add[key].push(pt[key]); }
        Plotly.extendTraces(cb, { x: [add.t, add.t, add.t], y: [add.C, add.L, add.S] }, [0, 1, 2], WIN);
        gauge.draw();
      }, 250);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "Plotly.react(gd, data, { datarevision })・type: \"scattergl\" vs \"scatter\"・config.staticPlot",
    desc: "8 條流動的正弦帶由 Float64Array 組成，每一格改寫 y 值後以遞增的 datarevision 呼叫 Plotly.react 整批重畫；可切換 WebGL 的 scattergl 與 SVG 的 scatter。",
    hint: "按「自動加壓」開始，或切換繪製方式比較",
    mount(ctx) {
      ctx.html(`<div class="pl-stress"></div>`);
      ctx.controls.classList.add("bottom");
      const el = ctx.$(".pl-stress");
      const MODES = [{ label: "WebGL scattergl", short: "WebGL", type: "scattergl" }, { label: "SVG scatter", short: "SVG", type: "scatter" }];
      const WAVES = 8, SVG_CAP = 50000, COLORS = ["#4cc9f0", "#62b4f4", "#7f9ff8", "#9d8cff", "#c86fd2", "#f72585", "#ff8c42", "#f7df1e"];
      let mode = 0, want = 0, actual = 0, rev = 0, cost = 0, busy = false, size = null;
      let xs = [], ys = [], jit = [];
      ctx.group(MODES.map((m) => m.label), 0, (i) => { mode = i; purgeGL(el); setCount(want); });
      ctx.onCleanup(() => purgeGL(el));
      fit(ctx, el, (s) => (size = s));
      function setCount(count) {
        want = count;
        actual = mode === 1 ? Math.min(count, SVG_CAP) : count;
        const per = Math.ceil(actual / WAVES), r = rng(count);
        xs = []; ys = []; jit = [];
        for (let w = 0; w < WAVES; w++) {
          const x = new Float64Array(per), j = new Float64Array(per);
          for (let i = 0; i < per; i++) { x[i] = ((i + r()) / per) * 10; j[i] = gauss(r) * 0.07; }
          xs.push(x); ys.push(new Float64Array(per)); jit.push(j);
        }
        actual = per * WAVES;
      }
      ctx.raf((t) => {
        if (!actual || busy || !size) return;
        const s = t / 1000;
        for (let w = 0; w < WAVES; w++) {
          const x = xs[w], y = ys[w], j = jit[w], f = 1.1 + w * 0.32, sp = 0.9 + w * 0.17, off = w + 0.6;
          for (let i = 0; i < x.length; i++) y[i] = off + 0.42 * Math.sin(x[i] * f + s * sp + w) + j[i];
        }
        busy = true;
        const t0 = performance.now();
        Plotly.react(el, {
          data: xs.map((x, w) => ({ type: MODES[mode].type, mode: "markers", x, y: ys[w], hoverinfo: "skip",
            marker: { size: 2.6, color: COLORS[w], opacity: 0.75, line: { width: 0 } } })),
          layout: { width: size.width, height: size.height, margin: { l: 0, r: 0, t: 0, b: 0 }, paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
            showlegend: false, datarevision: ++rev, xaxis: { range: [0, 10], visible: false }, yaxis: { range: [0, 8.2], visible: false } },
          config: { staticPlot: true, responsive: false },
        }).then(() => { cost = cost * 0.8 + (performance.now() - t0) * 0.2; }).finally(() => { busy = false; });
      });
      ctx.ramp({
        label: "資料點", steps: [500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000, 500000, 1000000],
        apply: setCount,
        metrics: () => ({ 模式: MODES[mode].short, "react 耗時": `${cost.toFixed(1)} ms`, 實際點數: Showcase.fmt(actual),
          ...(mode === 1 ? { "DOM 節點": el.getElementsByTagName("*").length } : {}) }),
        note: "每一格先在 JS 端重算 8 條正弦帶的 y 值，再以遞增的 layout.datarevision 呼叫 Plotly.react 整批重畫，量到的是 Plotly 資料處理（calc）加繪製的總成本。scattergl 用 WebGL 一次畫完所有點；scatter 的每個點都是一個 SVG 節點，為了不讓瀏覽器卡死，SVG 模式上限 5 萬點。staticPlot 關閉了滑過與縮放互動以減少額外開銷。實務上持續更新的資料改用 extendTraces 只送新增的點，大量靜態資料則先降採樣。",
      });
    },
  },
] });
</script>
