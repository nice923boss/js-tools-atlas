<!--
  Media sources:
  - Scene 1: Plyr's official demo trailer "View From A Blue Moon" (MP4 576/720/1080, poster, en/fr captions, 240p preview
    thumbnails) streamed from https://cdn.plyr.io/static/demo/ exactly as the previous version of this page did. preload="none".

  @media (max-width: 520px) { .pl-side { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr); } }

  .pl-fit { width: min(100cqw, calc(100cqh * 16 / 9)); border-radius: 10px; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45); }

  .pl-panel { min-height: 0; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); overflow: hidden; }

  .pl-list button.on { border-color: var(--accent); background: rgba(247, 223, 30, 0.10); }
  .pl-list .t { font: 11.5px var(--mono); color: var(--muted); }

  /* 2. controls */

<script>
// Plyr showcase: trailer player, control layouts, captions/quality, embeds, audio, events, i18n/themes/thumbnails, instance ramp.
const h = Showcase.h;
const ICONS = "https://cdn.jsdelivr.net/npm/plyr@3.8.4/dist/plyr.svg";
const TRAILER = "https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer";
const CLIP = { s360: "assets/plyr/clip-360.mp4", s720: "assets/plyr/clip-720.mp4", poster: "assets/plyr/clip.jpg" };
const SECTIONS = [[0, "第 1 段：開場"], [3, "第 2 段：色彩"], [6, "第 3 段：動態"], [9, "第 4 段：結尾"]];
const I18N = {
  restart: "重新播放", rewind: "倒退 {seektime} 秒", play: "播放", pause: "暫停",
  fastForward: "快轉 {seektime} 秒", seek: "跳轉", seekLabel: "{currentTime} / {duration}",
  played: "已播放", buffered: "已緩衝", currentTime: "目前時間", duration: "總長度",
  volume: "音量", mute: "靜音", unmute: "取消靜音", enableCaptions: "開啟字幕", disableCaptions: "關閉字幕",
  download: "下載", enterFullscreen: "全螢幕", exitFullscreen: "離開全螢幕", frameTitle: "{title} 播放器",
  captions: "字幕", settings: "設定", pip: "子母畫面", menuBack: "返回", speed: "播放速度",
  normal: "正常", quality: "畫質", loop: "循環", start: "開始", end: "結束", all: "全部",
  reset: "重設", disabled: "關閉", enabled: "開啟",
  qualityBadge: { 1080: "HD", 720: "HD", 576: "SD", 360: "SD" },
};
const SUBS = {
  zh: [[0, 1.5, "這是 Atlas 自製的 12 秒測試片"], [1.5, 3, "畫面中央是精確到百分之一秒的時間碼"],
    [3, 4.5, "第 2 段：色彩，背景換成另一組色調"], [4.5, 6, "每到整秒會聽到一聲短嗶"],
    [6, 7.5, "第 3 段：動態，小球繞著中心轉"], [7.5, 9, "底部進度條應該和播放器同步"],
    [9, 10.5, "第 4 段：結尾"], [10.5, 12, "打開循環就會一直重播"]],
  en: [[0, 1.5, "A 12-second test clip made for Atlas"], [1.5, 3, "The timecode in the middle counts hundredths"],
    [3, 4.5, "Section 2: colour, a new palette"], [4.5, 6, "A short beep marks every second"],
    [6, 7.5, "Section 3: motion, a ball orbits the centre"], [7.5, 9, "The bottom bar should match the player"],
    [9, 10.5, "Section 4: the ending"], [10.5, 12, "Turn on loop to keep it playing"]],
};
const pad = (n) => String(n).padStart(2, "0");
const mmss = (s) => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
const sec = (s) => (Number.isFinite(s) ? s.toFixed(2) : "…");

// Every player gets the zh-TW labels; blankVideo "" stops destroy() from requesting Plyr's CDN blank.mp4.
// storage off: otherwise volume, caption and language choices leak between scenes through localStorage.
// Plyr compares the lowercased caption language with track.language as written, so srclang must be lowercase.
function createPlyr(target, options) {
  return new Plyr(target, { iconUrl: ICONS, blankVideo: "", storage: { enabled: false }, i18n: I18N, ...options });
}
// destroy() puts a clone of the original element back; remove it so its <source> never starts loading again.
function destroyPlyr(p) {
  p.destroy(function () { this.remove(); });
}
function videoEl({ sources, poster, tracks = [], attrs = {} }) {
  // preload="auto": the small Blob clips finish loading, so destroy() never has to abort a pending read.
  const v = h("video", { playsinline: true, preload: "auto", poster, ...attrs });
  for (const s of sources) v.append(h("source", s));
  for (const t of tracks) v.append(h("track", t));
  return v;
}

// Local media is fetched once and played from per-scene Blob URLs, so destroying a player
// never cancels a half-finished request.
const blobs = new Map();
function mediaBlob(src) {
  if (!blobs.has(src)) {
    blobs.set(src, fetch(src).then((r) => {
      if (!r.ok) throw new Error(`無法載入 ${src}（HTTP ${r.status}）`);
      return r.blob();
    }).catch((e) => { blobs.delete(src); throw e; }));
  }
  return blobs.get(src);
}
async function blobUrl(ctx, src) {
  const blob = await mediaBlob(src);
  if (!ctx.active) throw new DOMException("Scene unmounted", "AbortError");
  const url = URL.createObjectURL(blob);
  ctx.onCleanup(() => URL.revokeObjectURL(url));
  return url;
}
function vttUrl(ctx, cues) {
  const ts = (s) => `00:${pad(Math.floor(s / 60))}:${(s % 60).toFixed(3).padStart(6, "0")}`;
  const body = "WEBVTT\n\n" + cues.map(([a, b, text], i) => `${i + 1}\n${ts(a)} --> ${ts(b)}\n${text}\n`).join("\n");
  const url = URL.createObjectURL(new Blob([body], { type: "text/vtt" }));
  ctx.onCleanup(() => URL.revokeObjectURL(url));
  return url;
}
const press = (wrap, i) => [...wrap.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
function fillStats(dl, rows) {
  dl.textContent = "";
  for (const [k, v, zh] of rows) dl.append(h("dt", { text: k }), h("dd", { class: zh ? "zh" : null, text: v }));
}
function eventLog(ol, max = 60) {
  const t0 = performance.now();
  return (name, detail = "") => {
    ol.prepend(h("li", {}, h("small", { text: `${((performance.now() - t0) / 1000).toFixed(2)}s ` }), h("em", { text: name }), ` ${detail}`));
    while (ol.children.length > max) ol.lastChild.remove();
  };
}

Showcase.run({ scenes: [
  {
    id: "trailer", title: "預告片播放器",
    api: "new Plyr(video, { quality, previewThumbnails, i18n })",
    desc: "原版招牌：一行 new Plyr() 把 <video> 變成有畫質選單、英法字幕、進度列縮圖預覽、快捷鍵與繁中標籤的播放器。",
    hint: "滑過進度列看縮圖・齒輪切畫質與字幕・K 播放、M 靜音",
    async mount(ctx) {
      ctx.html(`<div class="pl-stage"><div class="pl-backdrop"></div><div class="pl-stage-in"><div class="pl-card">
        <div data-host></div>
        <div class="pl-info"><div><h1>View From A Blue Moon 預告片</h1><p>衝浪紀錄片・Plyr 官方範例影片・英法字幕</p></div>
        <div class="pl-chips"><span>畫質 <b data-q>576p</b></span><span>字幕 <b data-cc>關閉</b></span><span>速度 <b data-sp>1×</b></span></div></div>
      </div></div></div>`);
      // A crossorigin <video> would also request its poster in CORS mode, which the CDN's JPEG does not allow.
      // So the captions are fetched (the VTT files do send CORS headers) and attached as same-origin Blob URLs.
      const tracks = (await Promise.all([["en", "English"], ["fr", "Français"]].map(async ([srclang, label]) => {
        try {
          const r = await fetch(`${TRAILER}-HD.${srclang}.vtt`);
          if (!r.ok) return null;
          const url = URL.createObjectURL(await r.blob());
          ctx.onCleanup(() => URL.revokeObjectURL(url));
          return { kind: "captions", label, srclang, src: url };
        } catch { return null; }
      }))).filter(Boolean);
      if (!ctx.active) return;
      if (tracks.length < 2) ctx.status("字幕").error("字幕檔無法從 cdn.plyr.io 下載，播放器照常可用，只是少了字幕選項");
      const v = videoEl({
        attrs: { preload: "none" }, poster: `${TRAILER}-HD.jpg`,
        sources: [576, 720, 1080].map((q) => ({ src: `${TRAILER}-${q}p.mp4`, type: "video/mp4", size: q })),
        tracks,
      });
      ctx.$("[data-host]").append(v);
      const narrow = ctx.el.clientWidth < 520;
      const player = createPlyr(v, {
        controls: narrow
          ? ["play-large", "play", "progress", "current-time", "captions", "settings", "fullscreen"]
          : ["play-large", "rewind", "play", "fast-forward", "progress", "current-time", "mute", "volume", "captions", "settings", "pip", "fullscreen"],
        duration: 183, // preload="none" keeps the page light, so tell Plyr the trailer length up front
        ratio: "16:9",
        settings: ["captions", "quality", "speed"],
        quality: { default: 576, options: [1080, 720, 576] },
        speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
        captions: { active: false, language: "en", update: true },
        keyboard: { focused: true, global: true },
        tooltips: { controls: true, seek: true },
        previewThumbnails: { enabled: true, src: "https://cdn.plyr.io/static/demo/thumbs/240p.vtt" },
      });
      ctx.onCleanup(() => destroyPlyr(player));
      const set = (k, t) => { ctx.$(`[data-${k}]`).textContent = t; };
      const LANG = { en: "English", fr: "Français" };
      let cc = false;
      const paintCC = () => set("cc", cc ? LANG[player.language] || player.language : "關閉");
      player.on("qualitychange", () => set("q", `${player.quality}p`));
      player.on("ratechange", () => set("sp", `${player.speed}×`));
      player.on("captionsenabled", () => { cc = true; paintCC(); });
      player.on("captionsdisabled", () => { cc = false; paintCC(); });
      player.on("languagechange", paintCC);
    },
  },
  {
    id: "controls", title: "控制列自訂",
    api: "controls: [ ... ] 或 HTML 字串",
    desc: "controls 陣列決定控制列有哪些元件、順序為何；也可以直接給一段 HTML，Plyr 依 data-plyr 屬性接上行為。每次變更都重建播放器並接回播放位置。",
    hint: "上方選預設組合，或點右側元件逐一增減",
    async mount(ctx) {
      ctx.html(`<div class="pl-wrap pl-side"><div class="pl-main"><div class="pl-frame"><div class="pl-fit" data-host></div></div>
        <div class="pl-meta"><span>重建 <b data-n>0</b> 次</span><span>new Plyr() <b data-ms>…</b></span><span>元件 <b data-c>0</b> 個</span></div></div>
        <div class="pl-panel"><h3>controls <small>點選增減</small></h3><div class="pl-scroll"><div class="pl-chks" data-chk></div>
        <code class="pl-code" data-code></code><div class="pl-note" data-note></div></div></div></div>`);
      const ALL = [["play-large", "中央大播放鈕"], ["restart", "重新播放"], ["rewind", "倒退"], ["play", "播放"], ["fast-forward", "快轉"],
        ["progress", "進度列"], ["current-time", "目前時間"], ["duration", "總長度"], ["mute", "靜音"], ["volume", "音量"],
        ["captions", "字幕"], ["settings", "設定"], ["pip", "子母畫面"], ["airplay", "AirPlay"], ["download", "下載"], ["fullscreen", "全螢幕"]];
      const PRESETS = [
        ["play-large", "play", "progress", "fullscreen"],
        ["play-large", "play", "progress", "current-time", "mute", "volume", "captions", "settings", "fullscreen"],
        ALL.map(([k]) => k),
      ];
      const CUSTOM = `<div class="plyr__controls pl-custom">
  <button type="button" class="plyr__control pl-cbtn" data-plyr="play"><span class="label--not-pressed">▶ 播放</span><span class="label--pressed">❚❚ 暫停</span></button>
  <button type="button" class="plyr__control pl-cbtn" data-plyr="rewind">-{seektime} 秒</button>
  <div class="plyr__progress"><input data-plyr="seek" type="range" min="0" max="100" step="0.01" value="0" aria-label="跳轉"><progress class="plyr__progress__buffer" min="0" max="100" value="0"></progress><span role="tooltip" class="plyr__tooltip">00:00</span></div>
  <div class="plyr__time plyr__time--current">00:00</div>

          .map((k) => [k, String(L[k]).replace("{seektime}", player.config.seekTime), true]));
      }
      build();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N 個 new Plyr() 同時存在",
    desc: "逐級增加 Plyr 實例（每個都有自己的控制列與 <video>），量主執行緒 FPS、new Plyr() 建立時間與 DOM 節點。可切成「只建立不播放」，把 UI 成本和影片解碼分開看。",
    hint: "按「自動加壓」；上方切換是否同時播放",
    async mount(ctx) {
      ctx.html(`<div class="pl-stress"></div>`);
      const grid = ctx.$(".pl-stress");
      const players = [], initMs = [];
      let playAll = true;
      ctx.group(["全部播放", "只建立不播放"], 0, (i) => {
        playAll = i === 0;
        for (const p of players) if (playAll) p.play()?.catch(quiet); else p.pause();
      });
      const src = await blobUrl(ctx, CLIP.s360);
      const layout = () => {
        const n = Math.max(1, players.length), w = grid.clientWidth, hh = grid.clientHeight;
        let best = 1, size = 0;
        for (let c = 1; c <= n; c++) {
          const rows = Math.ceil(n / c);
          const tw = Math.min((w - (c - 1) * 4) / c, ((hh - (rows - 1) * 4) / rows) * 16 / 9);
          if (tw > size) { size = tw; best = c; }
        }
        grid.style.gridTemplateColumns = `repeat(${best}, ${Math.floor(size)}px)`;
      };
      const add = () => {
        const cell = h("div", { class: "pl-cell" });
        const v = videoEl({ sources: [{ src, type: "video/mp4" }], poster: CLIP.poster, attrs: { muted: true, loop: true } });
        v.muted = true;
        cell.append(v);
        grid.append(cell);
        const t0 = performance.now();
        const p = createPlyr(v, { ratio: "16:9", muted: true, loop: { active: true }, controls: ["play", "progress", "current-time", "mute"], hideControls: false, keyboard: { focused: false, global: false } });
        initMs.push(performance.now() - t0);
        p.cell = cell;
        if (playAll) p.play()?.catch(quiet);
        players.push(p);
      };
      const drop = () => { const p = players.pop(); destroyPlyr(p); p.cell.remove(); };
      ctx.onCleanup(() => { while (players.length) drop(); });
      ctx.onResize(layout);
      // Muted playback can lose the race with source loading on busy pages, so nudge stragglers.
      ctx.interval(() => { if (playAll) for (const p of players) if (p.paused) p.play()?.catch(quiet); }, 1000);
      const avg = (a) => (a.length ? a.slice(-16).reduce((s, x) => s + x, 0) / Math.min(16, a.length) : 0);
      ctx.ramp({
        label: "Plyr 實例", unit: "個", steps: [1, 2, 4, 8, 16, 24, 32, 48], minFps: 24,
        async apply(n) {
          while (players.length > n) drop();
          while (players.length < n && ctx.active) { add(); await ctx.frame(1); }
          layout();
        },
        metrics: () => {
          let dropped = 0, playing = 0;
          for (const p of players) {
            dropped += p.media.getVideoPlaybackQuality ? p.media.getVideoPlaybackQuality().droppedVideoFrames : 0;
            if (p.playing) playing++;
          }
          return { "播放中": `${playing} / ${players.length}`, "new Plyr()": `${avg(initMs).toFixed(1)} ms`, "DOM 節點": grid.getElementsByTagName("*").length, "累計掉格": dropped };
        },
        note: "每個實例都建立完整控制列（按鈕、range、tooltip）並綁定事件。「只建立不播放」時 FPS 主要反映 Plyr 的 DOM 與事件成本；「全部播放」時上限通常卡在影片解碼（硬體解碼器數量或 CPU 軟解），不是 Plyr 本身。",
      });
      layout();
    },
  },
] });

const quiet = (e) => { if (e.name !== "AbortError") throw e; };

// Draw a 6x4 sprite of 160x90 frames (every 0.5 s) from the clip and hand Plyr the frame map.
async function makeSprite(ctx, src) {
  const t0 = performance.now();
  const COLS = 6, W = 160, H = 90, N = 24;
  const st = ctx.status("產生進度列縮圖…");
  const v = h("video", { muted: true, preload: "auto", src });
  v.muted = true;
  ctx.onCleanup(() => { v.removeAttribute("src"); v.load(); });
  const once = (type) => new Promise((resolve, reject) => {
    v.addEventListener(type, resolve, { once: true });
    v.addEventListener("error", () => reject(new Error("縮圖用影片無法解碼")), { once: true });
  });
  if (v.readyState < 1) await once("loadedmetadata");
  const cv = h("canvas", { width: COLS * W, height: Math.ceil(N / COLS) * H });
  const g = cv.getContext("2d");
  const frames = [];
  for (let i = 0; i < N; i++) {
    if (!ctx.active) throw new DOMException("Scene unmounted", "AbortError");
    const seek = once("seeked");
    v.currentTime = i * 0.5 + 0.25;
    await seek;
    const x = (i % COLS) * W, y = Math.floor(i / COLS) * H;
    g.drawImage(v, x, y, W, H);
    frames.push({ startTime: i * 0.5, endTime: (i + 1) * 0.5, x, y, w: W, h: H });
    st.progress((i + 1) / N);
  }
  const blob = await new Promise((resolve) => cv.toBlob(resolve, "image/jpeg", 0.82));
  const url = URL.createObjectURL(blob);
  ctx.onCleanup(() => URL.revokeObjectURL(url));
  for (const f of frames) f.text = url;
  st.done();
  return { url, frames, ms: performance.now() - t0 };
}
</script>
