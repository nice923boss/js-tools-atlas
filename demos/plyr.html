<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plyr 示範：簡潔的影片嵌入播放器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.8.4/dist/plyr.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":["audio"],"note":"影片為 Plyr 官方範例預告片"}</script>
<style>
  body {
    display: grid; place-items: center; padding: 16px 16px 50px;
    background: #07080a;
  }
  .backdrop {
    position: fixed; inset: -40px; z-index: 0;
    background: url("https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.jpg") center / cover;
    filter: blur(36px) saturate(1.3) brightness(0.45);
  }
  .card { position: relative; z-index: 1; width: min(100%, 760px, calc((100vh - 150px) * 16 / 9)); }
  .player { border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08); }
  .info { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .info h1 { margin: 0; font-size: 17px; }
  .info p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips span { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(0, 0, 0, 0.35); }
  .chips b { color: var(--accent); font-weight: 600; }
  :root {
    --plyr-color-main: #f7df1e;
    --plyr-video-control-color-hover: #1a1a14;
    --plyr-font-family: var(--font);
    --plyr-tooltip-background: rgba(20, 22, 26, 0.92);
    --plyr-tooltip-color: #ecebe6;
    --plyr-menu-background: rgba(20, 22, 26, 0.95);
    --plyr-menu-color: #ecebe6;
    --plyr-badge-background: #f7df1e;
    --plyr-badge-text-color: #1a1a14;
  }
  /* short screens: the hint would sit on the player controls, which are self-explanatory */
  @media (max-height: 460px) { .hint { display: none; } }
  @media (max-width: 520px) {
    .info h1 { font-size: 15px; }
    .chips span:nth-child(n+2) { display: none; }
  }
</style>
</head>
<body>
<div class="backdrop"></div>
<div class="card">
  <div class="player">
    <video id="player" playsinline crossorigin="anonymous" preload="none" poster="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-HD.jpg">
      <source src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-576p.mp4" type="video/mp4" size="576">
      <source src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-720p.mp4" type="video/mp4" size="720">
      <source src="https://cdn.plyr.io/static/demo/View_From_A_Blue_Moon_Trailer-1080p.mp4" type="video/mp4" size="1080">
    </video>
  </div>
  <div class="info">
    <div>
      <h1>View From A Blue Moon 預告片</h1>
      <p>衝浪紀錄片・Plyr 官方範例影片</p>
    </div>
    <div class="chips">
      <span>畫質 <b id="q">576p</b></span>
      <span>滑過進度條看縮圖</span>
      <span>K 播放・M 靜音</span>
    </div>
  </div>
</div>
<div class="hint">按播放鍵開始・齒輪切換畫質與速度</div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.8.4/dist/plyr.min.js"></script>
<script>
// Plyr: one call turns a plain <video> into a polished player with quality menu,
// preview thumbnails on the seek bar, keyboard shortcuts and zh-TW labels.
const player = new Plyr("#player", {
  iconUrl: "https://cdn.jsdelivr.net/npm/plyr@3.8.4/dist/plyr.svg",
  controls: innerWidth < 520
    ? ["play-large", "play", "progress", "current-time", "mute", "settings", "fullscreen"]
    : ["play-large", "rewind", "play", "fast-forward", "progress", "current-time", "mute", "volume", "settings", "pip", "fullscreen"],
  duration: 183, // preload="none" keeps the page light, so tell Plyr the trailer length up front
  settings: ["quality", "speed"],
  quality: { default: 576, options: [1080, 720, 576] },
  speed: { selected: 1, options: [0.5, 0.75, 1, 1.25, 1.5, 2] },
  keyboard: { focused: true, global: true },
  tooltips: { controls: true, seek: true },
  previewThumbnails: { enabled: true, src: "https://cdn.plyr.io/static/demo/thumbs/240p.vtt" },
  i18n: {
    restart: "重新播放", rewind: "倒退 {seektime} 秒", play: "播放", pause: "暫停",
    fastForward: "快轉 {seektime} 秒", seek: "跳轉", seekLabel: "{currentTime} / {duration}",
    played: "已播放", buffered: "已緩衝", currentTime: "目前時間", duration: "總長度",
    volume: "音量", mute: "靜音", unmute: "取消靜音", enableCaptions: "開啟字幕", disableCaptions: "關閉字幕",
    download: "下載", enterFullscreen: "全螢幕", exitFullscreen: "離開全螢幕", frameTitle: "{title} 播放器",
    captions: "字幕", settings: "設定", pip: "子母畫面", menuBack: "返回", speed: "播放速度",
    normal: "正常", quality: "畫質", loop: "循環", start: "開始", end: "結束", all: "全部",
    reset: "重設", disabled: "關閉", enabled: "開啟",
    qualityBadge: { 1080: "HD", 720: "HD", 576: "SD" },
  },
});

player.on("qualitychange", () => { document.getElementById("q").textContent = `${player.quality}p`; });
</script>
</body>
</html>
