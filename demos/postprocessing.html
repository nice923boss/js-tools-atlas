<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",

<script type="module">
// postprocessing showcase: eight scenes from merged effect passes to an effect-count stress ramp.
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import {
  EffectComposer, RenderPass, EffectPass, Effect, BlendFunction, KernelSize,
  BloomEffect, SelectiveBloomEffect, OutlineEffect, DepthOfFieldEffect, SMAAEffect, SMAAPreset, FXAAEffect, TextureEffect,
  ToneMappingEffect, ToneMappingMode, LUT3DEffect, LookupTexture, HueSaturationEffect, BrightnessContrastEffect,
  ChromaticAberrationEffect, NoiseEffect, VignetteEffect, ShockWaveEffect, GlitchEffect, PixelationEffect, DotScreenEffect,
  ASCIIEffect, ASCIITexture, ScanlineEffect, ColorDepthEffect, SepiaEffect,
} from "postprocessing";

const NEON = [0xf72585, 0x4cc9f0, 0xf7df1e, 0x9d8cff];
const PALETTE = [0xf7df1e, 0x4cc9f0, 0xf72585, 0x7bd389, 0xff8c42, 0x9d8cff];
const GEOS = [
  () => new THREE.IcosahedronGeometry(0.62, 0),
  () => new THREE.TorusGeometry(0.5, 0.18, 20, 64),
  () => new THREE.BoxGeometry(0.85, 0.85, 0.85),
  () => new THREE.ConeGeometry(0.55, 1.1, 32),
  () => new THREE.TorusKnotGeometry(0.4, 0.13, 120, 16),
  () => new THREE.OctahedronGeometry(0.62, 0),
];

// ---------- shared helpers ----------

// Renderer + scene + EffectComposer bound to the scene element (or an inner box). Everything is disposed on unmount.
function stage(ctx, { camera, env = 0, bg = 0x05060a, box = null, ratio = Math.min(devicePixelRatio || 1, 1.5) } = {}) {
  const host = box || ctx.el;
  const canvas = document.createElement("canvas");
  canvas.className = "gl";
  host.prepend(canvas);
  // postprocessing wants antialias off on the renderer and tone mapping done as an effect
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, stencil: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(ratio);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(bg);
  if (env) {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const room = new RoomEnvironment();
    scene.environment = pmrem.fromScene(room, 0.04).texture;
    scene.environmentIntensity = env;
    room.dispose();
    pmrem.dispose();
  }
  const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
  composer.addPass(new RenderPass(scene, camera));
  const S = {
    canvas, renderer, scene, camera, composer, passes: [], w: 1, h: 1, onSize: null,
    fit() {
      const w = Math.max(1, host.clientWidth), h = Math.max(1, host.clientHeight);
      S.w = w; S.h = h;
      composer.setSize(w, h, false);
      if (camera.isPerspectiveCamera) camera.aspect = w / h;
      if (S.onSize) S.onSize(w, h);
      camera.updateProjectionMatrix();
    },
  };
  ctx.onResize(() => S.fit());
  ctx.onCleanup(() => {
    composer.dispose();
    scene.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
      for (const m of mats) { if (m.map) m.map.dispose(); m.dispose(); }
    });
    if (scene.environment) scene.environment.dispose();
    renderer.dispose();
    renderer.forceContextLoss();
  });
  S.fit();
  return S;
}

// Replace every EffectPass after the RenderPass. Each inner array becomes one merged EffectPass.
function setPasses(S, groups) {
  for (const p of S.passes) { S.composer.removePass(p); p.dispose(); }
  S.passes = groups.filter((g) => g.length).map((g) => new EffectPass(S.camera, ...g));
  for (const p of S.passes) S.composer.addPass(p);
  return S.passes;
}

function tag(ctx, cls, html) {
  const d = document.createElement("div");
  d.className = `lbl ${cls}`;
  d.innerHTML = html;
  ctx.el.append(d);
  return d;
}

const pick = (wrap, i) => [...wrap.children].forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));

// Click-to-pick via raycasting against a list of meshes.
function picker(ctx, S, targets, fn) {
  const ray = new THREE.Raycaster(), v = new THREE.Vector2();
  ctx.on(S.canvas, "click", (e) => {
    const r = S.canvas.getBoundingClientRect();
    v.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(v, S.camera);
    fn(ray.intersectObjects(targets, false)[0], ray);
  });
}

// Before/after divider: the composer output covers the screen, then the raw render is scissored over the left part.
function splitter(ctx, S, { left = "原始畫面", right = "後製效果" } = {}) {
  const bar = document.createElement("div");
  bar.className = "split";
  ctx.el.append(bar);
  const tl = tag(ctx, "split-tag", left), tr = tag(ctx, "split-tag", right);
  let pos = 0.5, user = false, drag = false;
  const place = () => {
    const px = Math.round(Math.min(S.w - 14, Math.max(14, pos * S.w)));
    bar.style.left = `${px}px`;
    tl.style.left = `${Math.max(10, px - 10 - tl.offsetWidth)}px`;
    tr.style.left = `${Math.max(10, Math.min(px + 10, S.w - tr.offsetWidth - 10))}px`;
    return px;
  };
  ctx.on(bar, "pointerdown", (e) => { drag = user = true; bar.setPointerCapture(e.pointerId); e.preventDefault(); });
  ctx.on(bar, "pointermove", (e) => {
    if (!drag) return;
    const r = ctx.el.getBoundingClientRect();
    pos = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  });
  ctx.on(bar, "pointerup", () => { drag = false; });
  return {
    setRight(html) { tr.innerHTML = html; },
    update(t) { if (!user) pos = 0.5 + Math.sin(t * 0.0006) * 0.28; },
    draw() {
      const px = place(), r = S.renderer;
      r.setRenderTarget(null);
      r.setViewport(0, 0, S.w, S.h);
      r.setScissor(0, 0, px, S.h);
      r.setScissorTest(true);
      r.render(S.scene, S.camera);
      r.setScissorTest(false);
    },
  };
}

function addFloor(scene, { y = 0, size = 40, color = 0x0b0d12, metalness = 0.9, roughness = 0.35 } = {}) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(size, size), new THREE.MeshStandardMaterial({ color, metalness, roughness }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = y;
  scene.add(floor);
  return floor;
}

// The neon corridor from the original demo, reused by scenes 1 and 8.
function buildCorridor(scene) {
  scene.background = new THREE.Color(0x05060a);
  scene.fog = new THREE.Fog(0x05060a, 14, 40);
  const floor = addFloor(scene, { size: 80 });
  floor.position.z = -20;
  for (let i = 0; i < 9; i++) {
    const arch = new THREE.Mesh(new THREE.TorusGeometry(4.2, 0.07, 12, 120, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0x000000, emissive: NEON[i % 4], emissiveIntensity: 3.2 }));
    arch.position.set(0, 0, -i * 4.2);
    scene.add(arch);
  }
  const hero = new THREE.Group();
  hero.position.set(0, 2.1, 1);
  const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.85, 0.28, 220, 32),
    new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 1, roughness: 0.18 }));
  const halo = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.03, 8, 160),
    new THREE.MeshStandardMaterial({ color: 0x000000, emissive: 0xf7df1e, emissiveIntensity: 4 }));
  hero.add(knot, halo);
  scene.add(hero);
  const key = new THREE.PointLight(0xf72585, 30, 12);
  key.position.set(-3, 3, 3);
  const fill = new THREE.PointLight(0x4cc9f0, 30, 12);
  fill.position.set(3, 1, 2);
  scene.add(key, fill);
  const sparkGeo = new THREE.SphereGeometry(0.06, 8, 8);
  const sparks = [];
  for (let i = 0; i < 70; i++) {
    const m = new THREE.Mesh(sparkGeo, new THREE.MeshStandardMaterial({ color: 0x000000, emissive: NEON[i % 4], emissiveIntensity: 5 }));
    m.position.set((Math.random() - 0.5) * 9, Math.random() * 4 + 0.3, 4 - Math.random() * 34);
    m.userData.y = m.position.y;
    m.userData.phase = Math.random() * 6.28;
    sparks.push(m);
    scene.add(m);
  }
  return (t, dt) => {
    knot.rotation.x += dt * 0.4;
    knot.rotation.y += dt * 0.6;
    halo.rotation.x = Math.sin(t * 0.7) * 0.6;
    halo.rotation.y = t * 0.5;
    for (const s of sparks) s.position.y = s.userData.y + Math.sin(t * 1.5 + s.userData.phase) * 0.18;
  };
}

// 3D LUT from a per-colour function (sRGB in, sRGB out), stored as 8-bit to avoid float linear filtering quirks.
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const lum = (r, g, b) => r * 0.2126 + g * 0.7152 + b * 0.0722;
const mix = (a, b, t) => a + (b - a) * t;
const sstep = (e0, e1, x) => { const t = clamp01((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
function makeLUT(fn, size = 32) {
  const data = new Float32Array(size ** 3 * 4), s = 1 / (size - 1);
  for (let b = 0; b < size; b++) for (let g = 0; g < size; g++) for (let r = 0; r < size; r++) {
    const o = fn(r * s, g * s, b * s), i = (r + g * size + b * size * size) * 4;
    data[i] = clamp01(o[0]); data[i + 1] = clamp01(o[1]); data[i + 2] = clamp01(o[2]); data[i + 3] = 1;
  }
  return new LookupTexture(data, size).convertToUint8();
}
const LUTS = [
  ["原色", (r, g, b) => [r, g, b]],
  ["暖陽", (r, g, b) => [r * 1.06 + 0.04, g + 0.015, b * 0.8]],
  ["青橘", (r, g, b) => {
    const l = lum(r, g, b), k = sstep(0.12, 0.8, l), sat = (c) => l + (c - l) * 1.2;
    return [sat(r) + mix(-0.1, 0.1, k), sat(g) + mix(0.05, 0.01, k), sat(b) + mix(0.12, -0.14, k)];
  }],
  ["黑白", (r, g, b) => { const l = sstep(0.03, 0.97, lum(r, g, b)); return [l * 1.02, l, l * 0.95]; }],
  ["褪色", (r, g, b) => { const l = lum(r, g, b), d = (c) => 0.1 + mix(c, l, 0.35) * 0.78; return [d(r), d(g) + 0.02, d(b) + 0.035]; }],
];

const TONE_MODES = ["LINEAR", "REINHARD", "REINHARD2", "UNCHARTED2", "CINEON", "ACES_FILMIC", "AGX", "NEUTRAL"];

// Shows the depth-of-field circle-of-confusion buffer: R = near blur, G = far blur.
const COC_VIEW = `
uniform sampler2D cocMap;
void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor) {
  vec2 c = texture2D(cocMap, uv).rg;
  vec3 tint = vec3(1.0, 0.25, 0.55) * c.r + vec3(0.3, 0.8, 1.0) * c.g;
  outputColor = vec4(inputColor.rgb * 0.45 + tint * 0.55, inputColor.a);
}`;

Showcase.run({ scenes: [
  {
    id: "corridor", title: "霓虹長廊",
    api: "new EffectPass(camera, dof, bloom, ca, toneMapping, noise, vignette)",
    desc: "景深、泛光、色差、色調映射、底片雜訊、暗角全部塞進同一個 EffectPass，編譯成一支著色器只畫一次全螢幕；分割線左側是未後製的原始輸出。",
    hint: "拖曳黃色分割線比對・開關效果看差異・移動滑鼠有視差",
    mount(ctx) {
      const camera = new THREE.PerspectiveCamera(50, 1, 0.3, 80);
      camera.position.set(0, 2.2, 9);
      const S = stage(ctx, { camera, env: 0.5 });
      const update = buildCorridor(S.scene);
      S.onSize = (w, h) => { camera.fov = w < h ? 68 : 50; };
      S.fit();
      const on = { dof: true, bloom: true, ca: true, noise: true, vignette: true };
      const NAMES = { dof: "景深", bloom: "泛光", ca: "色差", noise: "雜訊", vignette: "暗角" };
      const badge = tag(ctx, "badge", "");
      const rebuild = () => {
        const early = [], late = [];
        if (on.dof) early.push(new DepthOfFieldEffect(camera, { focusDistance: 8, focusRange: 3.5, bokehScale: 3.2 }));
        if (on.bloom) early.push(new BloomEffect({ mipmapBlur: true, luminanceThreshold: 0.6, luminanceSmoothing: 0.25, intensity: 1.25, radius: 0.75 }));
        if (on.ca) early.push(new ChromaticAberrationEffect({ offset: new THREE.Vector2(0.0018, 0.0012), radialModulation: true, modulationOffset: 0.2 }));
        if (on.noise) {
          const n = new NoiseEffect({ blendFunction: BlendFunction.SOFT_LIGHT, premultiply: false });
          n.blendMode.opacity.value = 0.12;
          late.push(n);
        }
        if (on.vignette) late.push(new VignetteEffect({ offset: 0.3, darkness: 0.75 }));
        // grain and vignette run after tone mapping so they blend on LDR values
        setPasses(S, [[...early, new ToneMappingEffect({ mode: ToneMappingMode.AGX }), ...late]]);
        const names = Object.keys(on).filter((k) => on[k]).map((k) => NAMES[k]);
        badge.innerHTML = `EffectPass <b>×1</b>・合併 <b>${names.length + 1}</b> 個效果：${[...names, "色調映射"].join("＋")}`;
      };
      rebuild();
      for (const k of Object.keys(on)) ctx.toggle(NAMES[k], on[k], (v) => { on[k] = v; rebuild(); });
      const split = splitter(ctx, S);
      const mouse = { x: 0, y: 0 };
      ctx.on(ctx.el, "pointermove", (e) => {
        const r = ctx.el.getBoundingClientRect();
        mouse.x = (e.clientX - r.left) / r.width - 0.5;
        mouse.y = (e.clientY - r.top) / r.height - 0.5;
      });
      ctx.raf((t, dt) => {
        update(t / 1000, dt / 1000);
        camera.position.x += (mouse.x * 3 - camera.position.x) * 0.04;
        camera.position.y += (2.2 - mouse.y * 1.5 - camera.position.y) * 0.04;
        camera.lookAt(0, 1.8, -4);
        S.composer.render(dt / 1000);
        split.update(t);
        split.draw();
      });
    },
  },
  {
    id: "selective", title: "選擇性泛光",
    api: "new SelectiveBloomEffect(scene, camera, opts).selection.toggle(mesh)",
    desc: "十二個物件亮度相同，只有放進 selection 的物件會發光；selection 透過圖層遮罩決定誰參與泛光，inverted 可反轉成未選的發光。",
    hint: "點物件切換發光・反向選取・拉強度",
    mount(ctx) {
      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
      const S = stage(ctx, { camera, env: 0.35, bg: 0x07080c });
      const { scene } = S;
      const sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(3, 6, 4);
      scene.add(sun);
      addFloor(scene, { y: -0.62, size: 30, color: 0x10131a, metalness: 0.7, roughness: 0.45 });
      const items = [];
      for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
        const i = r * 4 + c, color = PALETTE[i % 6];
        const m = new THREE.Mesh(GEOS[i % 6](), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.55, metalness: 0.2, roughness: 0.4 }));
        m.position.set((c - 1.5) * 2.1, 0.35, (1 - r) * 2.2);
        m.userData.phase = i * 0.7;
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.72, 0.84, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85 }));
        ring.rotation.x = -Math.PI / 2;
        ring.position.set(m.position.x, -0.6, m.position.z);
        ring.visible = false;
        m.userData.ring = ring;
        scene.add(m, ring);
        items.push(m);
      }
      S.onSize = (w, h) => {
        const p = w < h;
        camera.fov = p ? 55 : 38;
        camera.position.set(0, p ? 7 : 4.2, p ? 12.5 : 9.5);
        camera.lookAt(0, -0.2, 0);
      };
      S.fit();
      const bloom = new SelectiveBloomEffect(scene, camera, { mipmapBlur: true, luminanceThreshold: 0, luminanceSmoothing: 0.2, intensity: 3.2, radius: 0.72 });
      bloom.ignoreBackground = true;
      setPasses(S, [[bloom, new ToneMappingEffect({ mode: ToneMappingMode.AGX })]]);
      const sel = bloom.selection;
      const badge = tag(ctx, "badge", "");
      const sync = () => {
        for (const m of items) m.userData.ring.visible = sel.has(m);
        badge.innerHTML = `selection <b>${sel.size}</b>／12${bloom.inverted ? "・inverted：未選的發光" : ""}`;
      };
      sel.set([items[0], items[5], items[10]]);
      sync();
      let user = false;
      picker(ctx, S, items, (hit) => { if (!hit) return; user = true; sel.toggle(hit.object); sync(); });
      ctx.interval(() => { if (!user) { sel.toggle(items[Math.floor(Math.random() * items.length)]); sync(); } }, 900);
      ctx.toggle("反向選取", false, (v) => { bloom.inverted = v; sync(); });
      ctx.slider("強度", { min: 0, max: 6, step: 0.1, value: 3.2, format: (v) => v.toFixed(1) }, (v) => { bloom.intensity = v; });
      ctx.button("全選", () => { user = true; sel.set(items); sync(); });
      ctx.button("清除", () => { user = true; sel.clear(); sync(); });
      ctx.raf((t) => {
        const s = t / 1000;
        for (const m of items) {
          m.rotation.y = s * 0.6 + m.userData.phase;
          m.rotation.x = Math.sin(s * 0.5 + m.userData.phase) * 0.4;
          m.position.y = 0.35 + Math.sin(s * 1.4 + m.userData.phase) * 0.12;
        }
        S.composer.render();
      });
    },
  },
  {
    id: "outline", title: "物件描邊",
    api: "new OutlineEffect(scene, camera, { xRay, edgeStrength, pulseSpeed, blur })",
    desc: "描邊用遮罩加邊緣偵測產生；開啟 X 光時被柱子擋住的部分改用另一種顏色畫出，適合做選取提示或穿牆標記。",
    hint: "點物件加入描邊・切換 X 光、脈動、模糊・換顏色",
    mount(ctx) {
      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
      const S = stage(ctx, { camera, env: 0.6, bg: 0x0b0d12 });
      const { scene } = S;
      const sun = new THREE.DirectionalLight(0xffffff, 1.2);
      sun.position.set(-4, 6, 5);
      scene.add(sun);

        const main = [], extra = [];
        let convUsed = false;
        for (const [, conv, make] of list) {
          if (conv && convUsed) extra.push([make()]);
          else { if (conv) convUsed = true; main.push(make()); }
        }
        setPasses(S, [main, ...extra]);
      };
      ctx.toggle("每效果一個 Pass", false, (v) => { perEffect = v; rebuild(); });
      ctx.select("解析度", [{ value: "1", label: "1×" }, { value: "1.5", label: "1.5×" }, { value: "2", label: "2×" }], "1", (v) => { S.renderer.setPixelRatio(+v); S.fit(); });
      ctx.controls.classList.add("bottom");
      ctx.raf((t, dt) => {
        const s = t / 1000;
        update(s, dt / 1000);
        camera.position.x = Math.sin(s * 0.4) * 1.2;
        camera.lookAt(0, 1.8, -4);
        S.composer.render(dt / 1000);
      });
      ctx.ramp({
        label: "同時開啟的效果", unit: "個", steps: [1, 2, 4, 6, 8, 10, 12],
        minFps: 30,
        apply(n) { count = n; rebuild(); },
        metrics: () => ({
          "EffectPass": S.passes.length,
          "最新加入": FX[count - 1][0],
          "繪製尺寸": `${S.canvas.width}×${S.canvas.height}`,
        }),
        note: "後製成本主要是填充率：每個 EffectPass 都要再畫一次全螢幕，泛光與景深內部還有多次降採樣模糊。合併模式下非卷積效果共用一支著色器，只有 SMAA 與色差這類卷積效果需要拆 pass；解析度倍率加倍，像素數變四倍。",
      });
    },
  },
] });
</script>
</body>
</html>
