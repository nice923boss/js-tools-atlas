<script>
const { fmt, fmtMs } = Showcase;
const FONT = "Microsoft JhengHei";
const EMU = 12700; // EMU per point
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bytesText = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);
const pad = (n) => String(n).padStart(2, "0");
const COURSES = ["資料視覺化", "Node.js", "AI 工作坊", "前端動畫", "Python"];
const NAMES = ["林怡君", "陳冠宇", "張雅婷", "王柏翰", "李佳穎", "黃子軒", "吳欣怡", "劉承恩", "蔡佩珊", "楊宗翰"];
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "新竹市"];

// ---------- XML helpers (DOMParser keeps qualified names such as "p:sp") ----------
const all = (el, tag) => (el ? [...el.getElementsByTagName(tag)] : []);
const one = (el, tag) => (el ? el.getElementsByTagName(tag)[0] || null : null);
const kid = (el, tag) => (el ? [...el.children].find((c) => c.tagName === tag) || null : null);
const kids = (el, tag) => (el ? [...el.children].filter((c) => c.tagName === tag) : []);
const attr = (el, n, d = null) => (el && el.hasAttribute(n) ? el.getAttribute(n) : d);
const P = (pt) => `calc(${+pt.toFixed(2)} * var(--k))`;
const SCHEME = { accent1: "4472C4", accent2: "ED7D31", accent3: "A5A5A5", accent4: "FFC000", accent5: "5B9BD5", accent6: "70AD47", tx1: "000000", dk1: "000000", bg1: "FFFFFF", lt1: "FFFFFF" };
const PAL = Object.values(SCHEME).slice(0, 6).map((c) => "#" + c);

// Colour from a fill-like element whose first child is a:srgbClr / a:schemeClr (with optional a:alpha).
function clr(fill) {
  const c = fill && fill.firstElementChild;
  if (!c || !/Clr$/.test(c.tagName)) return null;
  const hex = c.tagName === "a:srgbClr" ? c.getAttribute("val") : SCHEME[c.getAttribute("val")] || "888888";
  const n = parseInt(hex, 16), a = one(c, "a:alpha");
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a ? +a.getAttribute("val") / 100000 : 1})`;
}
const resolvePath = (dir, t) => {
  if (t.startsWith("/")) return t.slice(1);
  const parts = dir.split("/");
  for (const s of t.split("/")) s === ".." ? parts.pop() : s !== "." && parts.push(s);
  return parts.join("/");
};
const partNo = (s) => +s.match(/(\d+)\.xml$/)[1];

// ---------- read a .pptx back: unzip, parse parts, resolve relationships ----------
async function readDeck(ab) {
  const zip = await JSZip.loadAsync(ab);
  const docs = new Map(), urls = new Map(), parser = new DOMParser();
  const xml = async (p) => {
    if (!docs.has(p)) { const f = zip.file(p); docs.set(p, f ? parser.parseFromString(await f.async("string"), "application/xml") : null); }
    return docs.get(p);
  };
  const rels = async (p) => {
    const i = p.lastIndexOf("/"), dir = p.slice(0, i), map = {};
    for (const r of all(await xml(`${dir}/_rels/${p.slice(i + 1)}.rels`), "Relationship")) {
      const t = r.getAttribute("Target");
      map[r.getAttribute("Id")] = { type: r.getAttribute("Type").split("/").pop(), target: r.getAttribute("TargetMode") === "External" ? t : resolvePath(dir, t) };
    }
    return map;
  };
  const part = async (p) => ({ path: p, doc: await xml(p), rels: await rels(p) });
  const sz = one(await xml("ppt/presentation.xml"), "p:sldSz");
  const names = zip.file(/^ppt\/slides\/slide\d+\.xml$/).map((f) => f.name).sort((a, b) => partNo(a) - partNo(b));
  return {
    zip, names, xml, rels, part, count: names.length, W: +sz.getAttribute("cx"), H: +sz.getAttribute("cy"), unknown: new Set(),
    async slide(i) {
      const s = await part(names[i]);
      const lay = Object.values(s.rels).find((r) => r.type === "slideLayout");
      s.layout = lay ? await part(lay.target) : null;
      return s;
    },
    async media(p) {
      if (!urls.has(p)) { const f = zip.file(p); urls.set(p, f ? URL.createObjectURL(await f.async("blob")) : ""); }
      return urls.get(p);
    },
    dispose() { urls.forEach((u) => u && URL.revokeObjectURL(u)); urls.clear(); },
  };
}

// ---------- approximate renderer: slide XML -> absolutely positioned HTML/SVG ----------
function box(el, deck) {
  const x = one(el, "a:xfrm") || one(el, "p:xfrm"), off = one(x, "a:off"), ext = one(x, "a:ext");
  const b = { x: +attr(off, "x", 0), y: +attr(off, "y", 0), w: +attr(ext, "cx", 0), h: +attr(ext, "cy", 0), rot: +attr(x, "rot", 0) / 60000, fh: attr(x, "flipH") === "1", fv: attr(x, "flipV") === "1" };
  b.css = `left:${b.x / deck.W * 100}%;top:${b.y / deck.H * 100}%;width:${b.w / deck.W * 100}%;height:${b.h / deck.H * 100}%;${b.rot ? `transform:rotate(${b.rot}deg);` : ""}`;
  return b;
}
function geoPath(prst, w, h, adj) {
  const m = Math.min(w, h), poly = (pts) => "M" + pts.map((p) => p.map((v) => +v.toFixed(2)).join(",")).join("L") + "Z";
  switch (prst) {
    case "rect": return poly([[0, 0], [w, 0], [w, h], [0, h]]);
    case "roundRect": { const r = m * (adj ?? 16667) / 100000; return `M${r},0H${w - r}A${r},${r} 0 0 1 ${w},${r}V${h - r}A${r},${r} 0 0 1 ${w - r},${h}H${r}A${r},${r} 0 0 1 0,${h - r}V${r}A${r},${r} 0 0 1 ${r},0Z`; }
    case "ellipse": return `M0,${h / 2}A${w / 2},${h / 2} 0 1 1 ${w},${h / 2}A${w / 2},${h / 2} 0 1 1 0,${h / 2}Z`;
    case "triangle": return poly([[w / 2, 0], [w, h], [0, h]]);
    case "diamond": return poly([[w / 2, 0], [w, h / 2], [w / 2, h], [0, h / 2]]);
    case "hexagon": { const d = m * 0.25; return poly([[d, 0], [w - d, 0], [w, h / 2], [w - d, h], [d, h], [0, h / 2]]); }
    case "chevron": { const d = m * 0.5; return poly([[0, 0], [w - d, 0], [w, h / 2], [w - d, h], [0, h], [d, h / 2]]); }
    case "homePlate": { const d = m * 0.5; return poly([[0, 0], [w - d, 0], [w, h / 2], [w - d, h], [0, h]]); }
    case "rightArrow": { const d = m * 0.5; return poly([[0, h * 0.25], [w - d, h * 0.25], [w - d, 0], [w, h / 2], [w - d, h], [w - d, h * 0.75], [0, h * 0.75]]); }
    case "parallelogram": { const d = m * 0.25; return poly([[d, 0], [w, 0], [w - d, h], [0, h]]); }
    case "star5": return poly(Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? 0.19 : 0.5, a = -Math.PI / 2 + i * Math.PI / 5; return [w / 2 + w * r * Math.cos(a), h * 0.52 + h * r * Math.sin(a)]; }));
    default: return null;
  }
}
const DASH = { dash: [4, 3], sysDash: [3, 1], dot: [1, 1], sysDot: [1, 1], lgDash: [8, 3], dashDot: [4, 3, 1, 3] };
function spHtml(sp, part, deck, no) {
  const b = box(sp, deck), spPr = kid(sp, "p:spPr"), w = b.w / EMU, h = b.h / EMU;
  const prst = attr(one(spPr, "a:prstGeom"), "prst", "rect");
  const fill = clr(kid(spPr, "a:solidFill")), ln = kid(spPr, "a:ln");
  const lc = ln && !kid(ln, "a:noFill") ? clr(kid(ln, "a:solidFill")) : null;
  const lw = lc ? +attr(ln, "w", 12700) / EMU : 0;
  const da = DASH[attr(one(ln, "a:prstDash"), "val", "solid")];
  const stroke = lc && lw ? `stroke="${lc}" stroke-width="${lw}"${da ? ` stroke-dasharray="${da.map((v) => v * lw).join(" ")}"` : ""}` : "";
  let style = b.css, svg = "";
  const sh = one(spPr, "a:outerShdw");
  if (sh) {
    const d = +attr(sh, "dist", 0) / EMU, a = +attr(sh, "dir", 0) / 60000 * Math.PI / 180;
    style += `filter:drop-shadow(${P(d * Math.cos(a))} ${P(d * Math.sin(a))} ${P(+attr(sh, "blurRad", 0) / EMU)} ${clr(sh) || "rgba(0,0,0,.4)"});`;
  }
  if (prst === "line" || prst === "straightConnector1") {
    let [x1, y1, x2, y2] = [0, 0, w, h];
    if (b.fh) [x1, x2] = [x2, x1];
    if (b.fv) [y1, y2] = [y2, y1];
    svg = `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${stroke} stroke-linecap="round"/>`;
    for (const [end, px, py, qx, qy] of [["a:tailEnd", x2, y2, x1, y1], ["a:headEnd", x1, y1, x2, y2]]) {
      const t = attr(one(ln, end), "type", "none");
      if (t === "none") continue;
      const ang = Math.atan2(py - qy, px - qx), s = lw * 2.5 + 2;
      svg += t === "oval" ? `<circle cx="${px}" cy="${py}" r="${s / 2}" fill="${lc}"/>`
        : `<polygon points="${px},${py} ${px - s * Math.cos(ang - 0.45)},${py - s * Math.sin(ang - 0.45)} ${px - s * Math.cos(ang + 0.45)},${py - s * Math.sin(ang + 0.45)}" fill="${lc}"/>`;
    }
  } else if (fill || stroke) {
    const adj = +(attr(one(spPr, "a:gd"), "fmla", "").match(/val (\d+)/) || [])[1] || undefined;
    let d = geoPath(prst, w, h, adj);
    if (!d) { deck.unknown.add(prst); d = geoPath("rect", w, h); }
    svg = `<path d="${d}" fill="${fill || "none"}" ${stroke}/>`;
  }
  const pad = lw * 4 + 6, tx = kid(sp, "p:txBody");
  const svgEl = svg ? `<svg viewBox="${-pad} ${-pad} ${w + pad * 2} ${h + pad * 2}" preserveAspectRatio="none" style="left:${P(-pad)};top:${P(-pad)};width:calc(100% + ${P(pad * 2)});height:calc(100% + ${P(pad * 2)})">${svg}</svg>` : "";
  return `<div class="pg-o" style="${style}">${svgEl}${tx ? textHtml(tx, part, no) : ""}</div>`;
}
function autoNum(type, n) {
  const roman = (x) => [[10, "x"], [9, "ix"], [5, "v"], [4, "iv"], [1, "i"]].reduce((s, [v, r]) => { while (x >= v) { s += r; x -= v; } return s; }, "");
  const body = /^alphaLc/.test(type) ? String.fromCharCode(96 + n) : /^alphaUc/.test(type) ? String.fromCharCode(64 + n)
    : /^romanLc/.test(type) ? roman(n) : /^romanUc/.test(type) ? roman(n).toUpperCase() : String(n);
  return /ParenR$/.test(type) ? body + ")" : /ParenBoth$/.test(type) ? `(${body})` : body + ".";
}
function parasHtml(tx, part, no) {
  let html = "";
  const nums = [];
  for (const p of kids(tx, "a:p")) {
    const pp = kid(p, "a:pPr"), lvl = +attr(pp, "lvl", 0);
    const algn = { ctr: "center", r: "right", just: "justify" }[attr(pp, "algn", "l")] || "left";
    const marL = +attr(pp, "marL", 0) / EMU, ind = +attr(pp, "indent", 0) / EMU;
    const lnPct = one(kid(pp, "a:lnSpc"), "a:spcPct"), bef = one(kid(pp, "a:spcBef"), "a:spcPts"), aft = one(kid(pp, "a:spcAft"), "a:spcPts");
    const an = kid(pp, "a:buAutoNum"), ch = kid(pp, "a:buChar");
    let bu = "";
    if (an) { nums.length = lvl + 1; nums[lvl] = (nums[lvl] || +attr(an, "startAt", 1) - 1) + 1; bu = autoNum(attr(an, "type", "arabicPeriod"), nums[lvl]); }
    else { nums.length = lvl; if (ch) bu = attr(ch, "char"); }
    let inner = "", firstSz = 0;
    for (const r of p.children) {
      if (r.tagName === "a:br") { inner += "<br>"; continue; }
      if (r.tagName !== "a:r" && r.tagName !== "a:fld") continue;
      const rp = kid(r, "a:rPr"), sz = +attr(rp, "sz", 1800) / 100;
      firstSz ||= sz;
      const t = r.tagName === "a:fld" && attr(r, "type") === "slidenum" ? String(no + 1) : kid(r, "a:t")?.textContent ?? "";
      const st = [`font-size:${P(sz)}`];
      if (attr(rp, "b") === "1") st.push("font-weight:700");
      if (attr(rp, "i") === "1") st.push("font-style:italic");
      const deco = [attr(rp, "u", "none") !== "none" && "underline", attr(rp, "strike", "noStrike") !== "noStrike" && "line-through"].filter(Boolean);
      if (deco.length) st.push(`text-decoration:${deco.join(" ")}`);
      const c = clr(kid(rp, "a:solidFill")), hl = clr(kid(rp, "a:highlight"));
      if (c) st.push(`color:${c}`);
      if (hl) st.push(`background:${hl}`);
      const bl = +attr(rp, "baseline", 0);
      if (bl) st.push(`vertical-align:${bl > 0 ? "super" : "sub"};font-size:${P(sz * 0.7)}`);
      const spc = +attr(rp, "spc", 0);
      if (spc) st.push(`letter-spacing:${P(spc / 100)}`);
      let span = `<span style="${st.join(";")}">${esc(t)}</span>`;
      const link = one(rp, "a:hlinkClick"), tg = link && part.rels[link.getAttribute("r:id")];
      if (tg) span = `<a href="${esc(tg.target)}" target="_blank" rel="noopener">${span}</a>`;
      inner += span;
    }
    if (!firstSz) { firstSz = +attr(kid(p, "a:endParaRPr"), "sz", 1800) / 100; inner = `<span style="font-size:${P(firstSz)}">&#8203;</span>`; }
    const buHtml = bu ? `<span style="display:inline-block;min-width:${P(Math.max(-ind, firstSz * 0.9))};text-indent:0;font-size:${P(firstSz)}">${esc(bu)}</span>` : "";
    html += `<div style="text-align:${algn};padding-left:${P(marL)};text-indent:${P(ind)};line-height:${lnPct ? 1.2 * +lnPct.getAttribute("val") / 100000 : 1.2};margin:${P(bef ? +bef.getAttribute("val") / 100 : 0)} 0 ${P(aft ? +aft.getAttribute("val") / 100 : 0)}">${buHtml}${inner}</div>`;
  }
  return html;
}
function textHtml(tx, part, no) {
  const bp = kid(tx, "a:bodyPr"), ins = (n, d) => P(+attr(bp, n, d) / EMU);

function drawArt(seed, w = 640, h = 360) {
  const c = document.createElement("canvas"), g = c.getContext("2d");
  c.width = w; c.height = h;
  let s = seed;
  const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const hue = Math.floor(r() * 360), grd = g.createLinearGradient(0, 0, w, h);
  grd.addColorStop(0, `hsl(${hue} 60% 20%)`);
  grd.addColorStop(1, `hsl(${(hue + 60) % 360} 65% 38%)`);
  g.fillStyle = grd;
  g.fillRect(0, 0, w, h);
  for (let i = 0; i < 18; i++) { g.beginPath(); g.arc(r() * w, r() * h, 10 + r() * 70, 0, 7); g.fillStyle = `hsl(${(hue + r() * 120) % 360} 80% 70% / 0.25)`; g.fill(); }
  const bw = w * 0.07;
  for (let i = 0; i < 8; i++) { const bh = h * (0.15 + r() * 0.45); g.fillStyle = `hsl(${(hue + 30) % 360} 85% ${58 + i * 3}%)`; g.fillRect(w * 0.08 + i * bw * 1.25, h * 0.9 - bh, bw, bh); }
  g.fillStyle = "#fff";
  g.font = `700 ${h * 0.09}px sans-serif`;
  g.fillText("canvas 即時繪製", w * 0.08, h * 0.17);
  g.font = `${h * 0.055}px monospace`;
  g.fillText(`seed ${seed}`, w * 0.08, h * 0.27);
  return c;
}

        last = deck;
        await paintSlide(deck, 0, a);
        await paintSlide(deck, deck.count - 1, b);
        ctx.$(".pg-meta.a").textContent = "slide1.xml";
        ctx.$(".pg-meta.b").textContent = `slide${deck.count}.xml`;
      };
      buildStressDeck(10, opt).write({ outputType: "arraybuffer" }).then(readDeck).then((d) => (ctx.active ? preview(d) : d.dispose())).catch((e) => console.error(e));
      const results = [], resBody = ctx.$(".pg-res tbody");
      ctx.bench({
        label: "投影片", unit: "張", sizes: [10, 50, 100, 300, 1000, 2000], target: 1000, budget: 6000,
        async run(n) {
          const t0 = performance.now(), p = buildStressDeck(n, opt), t1 = performance.now();
          const ab = await p.write({ outputType: "arraybuffer" }), t2 = performance.now();
          const deck = await readDeck(ab), t3 = performance.now();
          const charts = deck.zip.file(/^ppt\/charts\/chart\d+\.xml$/).length, media = deck.zip.file(/^ppt\/media\/./).length;
          if (deck.count !== n) throw new Error(`讀回 ${deck.count} 張，預期 ${n} 張`);
          if (opt.chart && charts !== n) throw new Error(`讀回 ${charts} 個圖表，預期 ${n} 個`);
          if (opt.image && media !== n) throw new Error(`讀回 ${media} 個圖檔，預期 ${n} 個`);
          const what = [opt.chart && "圖表", opt.image && "圖片"].filter(Boolean).join("＋") || "純文字";
          results.unshift([n, what, t1 - t0, t2 - t1, t3 - t2, ab.byteLength]);
          resBody.innerHTML = results.slice(0, 8).map(([m, w, x, y, z, s]) => `<tr><td>${fmt(m)}</td><td class="zh">${w}</td><td>${fmtMs(x)}</td><td>${fmtMs(y)}</td><td class="pg-hide-n">${fmtMs(z)}</td><td>${bytesText(s)}</td><td class="pg-hide-n">${bytesText(s / m)}</td></tr>`).join("");
          ctx.timeout(() => preview(deck).catch((e) => console.error(e)), 0);
          return `write ${fmtMs(t2 - t1)}・${bytesText(ab.byteLength)}`;
        },
        note: "計時包含組裝（addSlide 與各物件）、write 產生 zip 位元組、JSZip 解開並核對張數，畫預覽不計時。每個原生圖表都要另外產生一份內嵌 xlsx，所以含圖表時 write 會明顯變慢、檔案也大很多；圖片則是每張各存一份。超過 6 秒的那一級之後就停止。",
      });
    },
  },
] });
</script>
</body>
