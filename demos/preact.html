<script type="module">
// Preact showcase: hooks, context, keys, signals, portals, error boundaries, custom hooks and a list benchmark.
import { h, render, Component, Fragment, createContext, createPortal } from "preact";
import { useState, useMemo, useEffect, useRef, useCallback, useReducer, useContext, useErrorBoundary } from "preact/hooks";
import { signal, computed, effect, batch } from "@preact/signals";
import htm from "htm";
const html = htm.bind(h);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// Render a Preact tree into a fresh container and unmount it when the scene ends.
function mountApp(ctx, host, vnode) { render(vnode, host); ctx.onCleanup(() => render(null, host)); }
function logger(list, max = 60) {
  const t0 = performance.now();
  return (text, color) => {
    const li = document.createElement("li");
    li.innerHTML = `<span style="color:#6b6a63">${(performance.now() - t0).toFixed(0).padStart(5, " ")}</span> <b style="color:${color || "var(--fg)"};font-weight:600">${esc(text)}</b>`;
    list.append(li);
    while (list.children.length > max) list.firstChild.remove();
    list.scrollTop = list.scrollHeight;
  };
}
const useRenders = () => { const r = useRef(0); r.current++; return r.current; };

// ---------- 1. todo + size (ported) ----------
const SEED = [["買高鐵票", "🚄", true], ["回覆客戶信件", "💼", false], ["整理週報", "📊", true], ["去全聯補貨", "🛒", false], ["晚上慢跑 5 公里", "🏃", false]];
const MORE = [["預約牙醫", "🦷"], ["繳電費", "💡"], ["幫植物澆水", "🪴"], ["讀完一章書", "📖"], ["訂週末民宿", "🏡"]];
let nextId = 1;
const make = (text, tag, done = false) => ({ id: nextId++, text, tag, done });
const PREACT_FILES = ["https://cdn.jsdelivr.net/npm/preact@11.0.0/dist/preact.mjs", "https://cdn.jsdelivr.net/npm/preact@11.0.0/hooks/dist/hooks.mjs", "https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.mjs"];
const REACT_FILES = ["https://cdn.jsdelivr.net/npm/react@19.3.0/+esm", "https://cdn.jsdelivr.net/npm/react-dom@19.3.0/client/+esm", "https://cdn.jsdelivr.net/npm/react-dom@19.3.0/+esm", "https://cdn.jsdelivr.net/npm/scheduler@0.28.0/+esm"];
async function gzipSize(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${res.status} ${url}`);
  return (await new Response(res.body.pipeThrough(new CompressionStream("gzip"))).arrayBuffer()).byteLength;
}
const sum = (files) => Promise.all(files.map(gzipSize)).then((a) => a.reduce((x, y) => x + y, 0));
let sizeJob = null; // measured once per page, reused when the scene is re-entered
function useSizes() {
  const [s, set] = useState({ preact: 0, react: 0, error: "" });
  useEffect(() => {
    if (!("CompressionStream" in window)) { set((v) => ({ ...v, error: "此瀏覽器不支援 CompressionStream，無法現場量測" })); return undefined; }
    let alive = true;
    sizeJob ||= Promise.all([sum(PREACT_FILES), sum(REACT_FILES)]);
    sizeJob.then(([preact, react]) => alive && set({ preact, react, error: "" })).catch((e) => alive && set((v) => ({ ...v, error: `量測失敗：${e.message}` })));
    return () => { alive = false; };
  }, []);
  return s;
}
const kb = (n) => (n / 1024).toFixed(1);
function Item({ item, onToggle, onDelete }) {
  return html`<li class=${item.done ? "done" : ""}>
    <button class="chk" onClick=${() => onToggle(item.id)} aria-label="切換完成">${item.done ? "✓" : ""}</button>
    <span class="txt">${item.text}</span><span class="tag">${item.tag}</span>
    <button class="del" onClick=${() => onDelete(item.id)} aria-label="刪除">×</button></li>`;
}
function SizePanel() {
  const { preact, react, error } = useSizes();
  const ready = preact && react, max = Math.max(preact, react) || 1;
  return html`<section class="pr-box"><h3>套件大小<code>gzip・瀏覽器現場壓縮</code></h3><div class="pr-size">
    <div><div class="lbl"><span>⚛️ Preact 11 + hooks + htm</span><b>${ready ? `${kb(preact)} KB` : "量測中…"}</b></div>
      <div class="track"><div class="fill" style=${`width:${ready ? (preact / max) * 100 : 0}%;background:linear-gradient(90deg,#673ab8,#9d8cff)`}></div></div>
      <div class="files">preact.mjs、hooks.mjs、htm.mjs</div></div>
    <div><div class="lbl"><span>⚛️ React 19 + ReactDOM</span><b>${ready ? `${kb(react)} KB` : "量測中…"}</b></div>
      <div class="track"><div class="fill" style=${`width:${ready ? 100 : 0}%;background:linear-gradient(90deg,#149eca,#61dafb)`}></div></div>
      <div class="files">react、react-dom/client、react-dom、scheduler（jsDelivr +esm）</div></div>
    <div class="ratio">${error || (ready ? html`同樣的 hooks API，體積約小<b>${(react / preact).toFixed(1)}</b>倍` : "下載並壓縮中…")}</div></div></section>`;
}
function TodoApp({ code }) {
  const [todos, setTodos] = useState(() => SEED.map(([t, g, d]) => make(t, g, d)));
  const [filter, setFilter] = useState("all");
  const [text, setText] = useState("");
  const [auto, setAuto] = useState(true);
  const renders = useRenders();
  const inputRef = useRef(null);
  const doneCount = useMemo(() => todos.filter((t) => t.done).length, [todos]);

// ---------- 7. custom hooks ----------
let hookLog = () => {};
function useInterval(cb, delay) {
  const saved = useRef(cb);
  saved.current = cb;
  useEffect(() => {
    if (delay == null) { hookLog("useInterval：暫停（delay = null）", "#9b998f"); return undefined; }
    hookLog(`useInterval：setInterval(${delay})`, "#4cc9f0");
    const id = setInterval(() => saved.current(), delay);
    return () => { clearInterval(id); hookLog(`useInterval cleanup：clearInterval(${delay})`, "#f72585"); };
  }, [delay]);
}
function useElementSize() {
  const ref = useRef(null);
  const [size, setSize] = useState({ w: 0, h: 0 });
  useEffect(() => {
    const ro = new ResizeObserver(([e]) => setSize({ w: Math.round(e.contentRect.width), h: Math.round(e.contentRect.height) }));
    ro.observe(ref.current);
    hookLog("useElementSize：ResizeObserver.observe()", "#4cc9f0");
    return () => { ro.disconnect(); hookLog("useElementSize cleanup：disconnect()", "#f72585"); };
  }, []);
  return [ref, size];
}
function useDebounced(value, ms) {
  const [v, setV] = useState(value);
  useEffect(() => { const id = setTimeout(() => setV(value), ms); return () => clearTimeout(id); }, [value, ms]);
  return v;
}
const QUERY = "台北市大安區復興南路";
function HookCards({ delay }) {
  const [ms, setMs] = useState(0);
  useInterval(() => setMs((m) => m + (delay || 0)), delay);
  const [boxRef, size] = useElementSize();
  const [typed, setTyped] = useState("");
  // Type one char per tick, then hold the full text for 6 ticks so the debounce can fire.
  const step = useRef(0);
  useInterval(() => { step.current = (step.current + 1) % (QUERY.length + 7); setTyped(QUERY.slice(0, step.current)); }, 260);
  const q = useDebounced(typed, 600);
  const calls = useRef(0), last = useRef("");
  if (q && q !== last.current) { last.current = q; calls.current++; }
  return html`<div class="pr-hgrid">
    <div class="pr-box"><h3>碼錶<code>useInterval(cb, ${delay ?? "null"})</code></h3><div class="pr-sw">${(ms / 1000).toFixed(1)} s</div><p class="pr-note pr-short">delay 改變時 effect 先 cleanup 再重設；傳 null 就暫停。</p></div>
    <div class="pr-box"><h3>量測元素尺寸<code>useElementSize()</code></h3><div ref=${boxRef} class="pr-rs">${size.w} × ${size.h} px</div><p class="pr-note pr-short">ResizeObserver 包成 hook，卸載時自動 disconnect。</p></div>
    <div class="pr-box"><h3>防抖搜尋<code>useDebounced(value, 600)</code></h3><div class="pr-q">${typed || " "}</div><p class="pr-note">停止輸入 600ms 後才查詢：<b>${q || "（空）"}</b>・呼叫 API <b>${calls.current}</b> 次（逐字輸入 ${QUERY.length} 次）</p></div></div>`;
}
function HookScene({ api }) {
  const [delay, setDelay] = useState(100);
  const [shown, setShown] = useState(true);
  api.setDelay = setDelay;
  api.toggle = () => setShown((v) => !v);
  return shown ? html`<${HookCards} delay=${delay} />` : html`<div class="pr-box" style="justify-content:center;align-items:center"><p class="pr-note">卡片已卸載，看右側 cleanup 紀錄</p></div>`;

    id: "keys", title: "key 與列表",

    desc: "左邊用資料 id 當 key，右邊用陣列索引。備註輸入框是未受控元件，值只存在 DOM：刪掉第一筆後，用 id 的一邊整列移除，備註跟著人走；用索引的一邊只改文字、刪掉最後一個節點，備註就錯置到別人身上。#數字是 ref 記下的 DOM 節點編號，黃色代表新建。",
    hint: "按「刪第一筆」或「洗牌」，比較兩邊備註",
    mount(ctx) {
      ctx.html(`<div class="pr-pad"><div class="pr-two">
        <div class="pr-box"><h3>key = 資料 id<code>新建 <b class="k1">0</b></code></h3><div class="pr-k1" style="display:contents"></div></div>
        <div class="pr-box"><h3>key = 陣列索引<code>新建 <b class="k2">0</b></code></h3><div class="pr-k2" style="display:contents"></div></div></div></div>`);
      const hosts = [ctx.$(".pr-k1"), ctx.$(".pr-k2")], counts = [ctx.$(".k1"), ctx.$(".k2")];
      const marks = counts.map((c) => makeMarker((n) => (c.textContent = n)));
      let items = PEOPLE.slice(), extra = 0, auto = true;
      const paint = () => hosts.forEach((el, i) => render(html`<${KeyList} items=${items} byIndex=${i === 1} mark=${marks[i]} />`, el));
      ctx.onCleanup(() => hosts.forEach((el) => render(null, el)));
      const note = () => hosts.forEach((el) => el.querySelectorAll("li").forEach((li) => {
        const nm = li.querySelector(".nm").textContent, inp = li.querySelector("input");
        inp.value = nm.includes("王小明") ? "素食・王小明" : nm.includes("林志豪") ? "需收據・林志豪" : "";
      }));
      const ops = {
        del: () => { items = items.slice(1); paint(); },
        add: () => { const [n, ic] = EXTRA[extra++ % EXTRA.length]; items = [{ id: 100 + extra, name: n, icon: ic }, ...items].slice(0, 8); paint(); },
        shuffle: () => { const b = items.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } items = b; paint(); },
        reset: () => { items = PEOPLE.slice(); paint(); note(); },
      };
      paint(); note();
      const stop = (fn) => () => { auto = false; fn(); };
      ctx.button("刪第一筆", stop(ops.del), { primary: true });
      ctx.button("插到最前", stop(ops.add));
      ctx.button("洗牌", stop(ops.shuffle));
      ctx.button("重設", stop(ops.reset));
      const TOUR = [ops.del, ops.reset, ops.shuffle, ops.reset, ops.add, ops.reset];
      let k = 0;
      ctx.interval(() => { if (auto) TOUR[k++ % TOUR.length](); }, 2000);
    },
  },
  {
    id: "signals", title: "Signals 細粒度更新",
    api: "signal(v) / computed(fn) / effect(fn) / batch(fn)",
    desc: "兩邊各 144 格，每次隨機改同一格的值。左邊狀態放在父層 useState，一次更新要重新 render 全部子元件；右邊每格是一個 signal，只有讀到它的元件重繪，總和用 computed 直接綁到文字節點，連父層都不用重繪。",
    hint: "調整更新頻率，看下方每秒 render 次數差距",
    mount(ctx) {
      ctx.html(`<div class="pr-pad"><div class="pr-sig"><div class="pr-stat"><span>每秒更新 <b class="s0">0</b> 次</span><span>useState 版 Cell render <b class="s1">0</b> /秒</span><span>signal 版 Cell render <b class="s2">0</b> /秒</span><span>effect 執行 <b class="s3">0</b> 次</span></div>
        <div class="pr-a" style="display:contents"></div><div class="pr-b" style="display:contents"></div></div></div>`);
      const api = {}, sigs = Array.from({ length: N4 }, (_, i) => signal((i * 23) % 360));
      const total = computed(() => sigs.reduce((a, s) => a + s.value, 0));
      const stop = effect(() => { total.value; rc4.effect++; });
      ctx.onCleanup(stop);
      Object.assign(rc4, { state: 0, signal: 0, parent: 0, effect: 1 });
      mountApp(ctx, ctx.$(".pr-a"), html`<${StateGrid} api=${api} />`);
      mountApp(ctx, ctx.$(".pr-b"), html`<${SigGrid} sigs=${sigs} total=${total} />`);
      let rate = 20, pokes = 0, last = { state: rc4.state, signal: rc4.signal, pokes: 0, t: performance.now() };
      const poke = () => { const k = Math.floor(Math.random() * N4); pokes++; api.poke(k); sigs[k].value = (sigs[k].value + 97) % 360; };
      let timer = ctx.interval(poke, 1000 / rate);
      ctx.slider("每秒更新", { min: 2, max: 60, step: 1, value: rate, format: (v) => `${v} 次` }, (v) => { rate = v; clearInterval(timer); timer = ctx.interval(poke, 1000 / rate); });
      ctx.button("一次改 30 格（batch）", () => { const ks = Array.from({ length: 30 }, () => Math.floor(Math.random() * N4)); batch(() => ks.forEach((k) => { sigs[k].value = (sigs[k].value + 53) % 360; })); });
      ctx.interval(() => {
        const now = performance.now(), dt = (now - last.t) / 1000;
        ctx.$(".s0").textContent = Math.round((pokes - last.pokes) / dt);
        ctx.$(".s1").textContent = Showcase.fmt(Math.round((rc4.state - last.state) / dt));
        ctx.$(".s2").textContent = Math.round((rc4.signal - last.signal) / dt);
        ctx.$(".s3").textContent = rc4.effect;
        last = { state: rc4.state, signal: rc4.signal, pokes, t: now };
      }, 1000);
    },
  },
  {
    id: "portal", title: "Fragment 與 Portal",
    api: "<Fragment> / createPortal(vnode, container)",
    desc: "Fragment 讓元件一次回傳多個 <td>，表格結構不會多出包裝節點。createPortal 讓浮層在元件樹裡仍屬於卡片，DOM 卻渲染到外層容器，跳出 overflow:hidden 的裁切；兩張卡共用同一個 open 狀態。",
    hint: "按卡片裡的按鈕開關浮層",
    mount(ctx) {
      ctx.html(`<div class="pr-pad"><div class="pr-two pr-port">
        <div class="pr-box"><h3>Fragment 回傳多個 td<code>&lt;Fragment&gt;</code></h3><div class="pr-t"></div><pre class="pr-dom"></pre></div>
        <div class="pr-box" style="overflow:visible"><h3>Portal 跳出裁切<code>createPortal</code></h3><div class="pr-p" style="display:flex;flex-direction:column;gap:10px"></div><p class="pr-note">虛線框是 overflow:hidden 的卡片。</p></div></div><div class="pr-layer"></div></div>`);
      const layer = { current: ctx.$(".pr-layer") }, api = {};
      const Rows = ({ rows }) => html`<table class="pr-table"><thead><tr><th>城市</th><th class="num">氣溫</th><th class="num">降雨</th></tr></thead><tbody>${rows.map((r) => html`<tr key=${r[0]}><${Cells} r=${r} /></tr>`)}</tbody></table>`;
      let rows = WEATHER.slice();
      const t = ctx.$(".pr-t"), dom = ctx.$(".pr-dom");
      const paint = () => {
        render(html`<${Rows} rows=${rows} />`, t);
        const tr = t.querySelector("tbody tr");
        dom.innerHTML = `<span class="tg">&lt;tr&gt;</span> 的子節點：${[...tr.children].map((c) => `<span class="tg">&lt;${c.localName}&gt;</span>`).join(" ")}\n沒有多包一層 div，表格才合法。`;
      };
      paint();
      ctx.onCleanup(() => render(null, t));
      mountApp(ctx, ctx.$(".pr-p"), html`<${PortalDemo} layer=${layer} api=${api} />`);
      ctx.button("重新排序", () => { rows = rows.slice().sort(() => Math.random() - 0.5); paint(); });
      ctx.interval(() => { rows = rows.map((r) => [r[0], r[1] + Math.round(Math.random() * 2 - 1), Math.max(0, Math.min(100, r[2] + Math.round(Math.random() * 20 - 10)))]); paint(); }, 1500);
      ctx.interval(() => api.toggle(), 3000);
      ctx.onResize(() => api.relayout && api.relayout());
    },
  },
  {
    id: "errors", title: "錯誤邊界",
    api: "componentDidCatch(error) / useErrorBoundary()",
    desc: "小工具在 render 時丟出錯誤，最近的錯誤邊界接住後只換掉那一塊，旁邊的元件照常運作；class 版用 componentDidCatch，函式元件用 useErrorBoundary。沒有自己邊界的「公告」出錯時，錯誤往上冒到外層，整個面板被換掉。",
    hint: "按上方按鈕讓不同小工具出錯，再按重試",
    mount(ctx) {
      ctx.html(`<div class="pr-pad"><div class="pr-dash"><div class="pr-d" style="display:contents"></div><div class="pr-box"><h3>錯誤紀錄<code>沒有 console.error</code></h3><ul class="pr-log"></ul></div></div></div>`);
      boundaryLog = logger(ctx.$(".pr-log"));
      ctx.onCleanup(() => { boundaryLog = () => {}; });
      const api = {};
      mountApp(ctx, ctx.$(".pr-d"), html`<${Dashboard} api=${api} />`);
      let auto = true, k = 0;
      const stop = (fn) => () => { auto = false; fn(); };
      ctx.button("天氣出錯", stop(() => api.break("w")), { primary: true });
      ctx.button("股市出錯", stop(() => api.break("s")));
      ctx.button("公告出錯", stop(() => api.break("n")));
      const TOUR = [() => api.break("w"), () => api.break("s"), () => ctx.$$(".pr-w.err button").forEach((b) => b.click()), () => api.break("f"), () => api.break("n"), () => ctx.$(".pr-whole button")?.click()];
      ctx.interval(() => { if (auto) TOUR[k++ % TOUR.length](); }, 1800);
    },
  },
  {
    id: "hooks", title: "自訂 Hook",
    api: "function useInterval(cb, delay) { useEffect(() => …, [delay]) }",
    desc: "把計時器、ResizeObserver、防抖這些副作用包成自訂 hook，元件只管拿結果。右側記錄每個 effect 的建立與 cleanup：改 delay 會先清掉舊的 interval，整組卸載時所有資源都會被釋放。",
    hint: "切換 delay 或卸載卡片，看右側 cleanup 紀錄",
    mount(ctx) {
      ctx.html(`<div class="pr-pad"><div class="pr-hooks"><div class="pr-h" style="display:contents"></div><div class="pr-box"><h3>effect 紀錄<code>setup / cleanup</code></h3><ul class="pr-log"></ul></div></div></div>`);
      hookLog = logger(ctx.$(".pr-log"));
      ctx.onCleanup(() => { hookLog = () => {}; });
      const api = {};
      mountApp(ctx, ctx.$(".pr-h"), html`<${HookScene} api=${api} />`);
      let auto = true, k = 0;
      const delays = [100, 500, null];
      ctx.group(["100ms", "500ms", "暫停"], 0, (i) => { auto = false; api.setDelay(delays[i]); });
      ctx.button("卸載／掛載", () => { auto = false; api.toggle(); }, { primary: true });
      const TOUR = [() => api.setDelay(500), () => api.setDelay(null), () => api.toggle(), () => api.toggle(), () => api.setDelay(100)];
      ctx.interval(() => { if (auto) TOUR[k++ % TOUR.length](); }, 2400);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "render(<Table rows />) × 建立 / 全部替換 / 每 10 列更新 / 交換",
    desc: "仿 js-framework-benchmark：一次建立 N 列表格，接著全部替換、每 10 列更新一列、交換第 2 列與倒數第 2 列。頂層 render() 是同步的，所以可以直接計時；signals 模式的更新只改 signal，不重新 render 整張表。",
    hint: "按「開始測試」・切換更新方式再測一次",
    mount(ctx) {
      ctx.html(`<div class="pr-stress"></div>`);
      const host = ctx.$(".pr-stress");
      let sig = false;
      const show = (rows) => render(html`<${Table} rows=${rows} sig=${sig} />`, host);
      const withSig = (rows) => { if (sig) rows.forEach((r) => { r.sig = signal(r.label); }); return rows; };
      ctx.onCleanup(() => render(null, host));
      show(withSig(makeRows(500)));
      ctx.controls.classList.add("bottom");
      ctx.group(["props 重繪", "signals"], 0, (i) => { sig = i === 1; render(null, host); show(withSig(makeRows(500))); });
      const lap = (fn) => { const t = performance.now(); fn(); return performance.now() - t; };
      ctx.bench({
        label: "表格列", unit: "列", sizes: [1000, 2000, 5000, 10000, 20000, 50000], target: 1000, budget: 2000,
        prepare: async (n) => { render(null, host); host.scrollTop = 0; await ctx.frame(1); return { a: withSig(makeRows(n)), b: withSig(makeRows(n)) }; },
        run: (n, { a, b }) => {
          const create = lap(() => show(a));
          const replace = lap(() => show(b));
          let rows = b;
          const update = lap(() => {
            if (sig) batch(() => { for (let i = 0; i < n; i += 10) rows[i].sig.value += " !!!"; });
            else { rows = rows.map((r, i) => (i % 10 ? r : { ...r, label: `${r.label} !!!` })); show(rows); }
          });
          const swap = lap(() => { rows = rows.slice(); const t = rows[1]; rows[1] = rows[n - 2]; rows[n - 2] = t; show(rows); });
          const f = (x) => (x < 10 ? x.toFixed(1) : Math.round(x));
          return `建${f(create)} 換${f(replace)} 改${f(update)} 交${f(swap)}`;
        },
        note: "四個步驟都在同一次量測內，細項列在結果後方（毫秒）。建立與全部替換主要花在建立 DOM 節點；signals 模式的「改」只更新被改到的文字節點，不必比對整張表，但建立時多了 N 個 signal 的成本。",
      });
    },
  },
] });
</script>
</body>
</html>
