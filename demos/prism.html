<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prism 示範：用外掛擴充程式碼區塊</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/combine/npm/prismjs@1.30.0/themes/prism-tomorrow.min.css,npm/prismjs@1.30.0/plugins/line-numbers/prism-line-numbers.min.css,npm/prismjs@1.30.0/plugins/line-highlight/prism-line-highlight.min.css,npm/prismjs@1.30.0/plugins/toolbar/prism-toolbar.min.css,npm/prismjs@1.30.0/plugins/diff-highlight/prism-diff-highlight.min.css,npm/prismjs@1.30.0/plugins/command-line/prism-command-line.min.css,npm/prismjs@1.30.0/plugins/match-braces/prism-match-braces.min.css,npm/prismjs@1.30.0/plugins/inline-color/prism-inline-color.min.css,npm/prismjs@1.30.0/plugins/previewers/prism-previewers.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app {
    position: fixed; inset: 0; padding: 12px 12px 46px; display: grid; gap: 10px;
    grid-template-columns: minmax(0, 1fr) 252px;
    grid-template-rows: auto minmax(0, 1fr);
  }
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .top .title { flex: none; font-weight: 700; font-size: 14px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; padding: 1px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs .btn { flex: none; padding: 6px 12px; font-size: 12.5px; }
  .tour { margin-left: auto; flex: none; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tour::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c4); animation: blink 1.2s infinite; }
  .tour[hidden] { display: none; }
  @keyframes blink { 50% { opacity: .25; } }

  .main { min-height: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #12151a; }
  .tabbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); background: var(--bg-2); font: 12px var(--mono); color: var(--muted); }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
  .dots i:nth-child(2) { background: #febc2e; }
  .dots i:nth-child(3) { background: #28c840; }
  .tabbar .tip { margin-left: auto; font-family: var(--font); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Prism output lives here; plugins wrap <pre> in div.code-toolbar */
  .stage { position: relative; flex: 1 1 0; min-height: 0; }
  .stage > .code-toolbar, .stage > pre { position: absolute; inset: 0; }
  .stage pre[class*="language-"] {
    margin: 0; height: 100%; box-sizing: border-box; border-radius: 0; background: #12151a;
    padding: var(--pt, 1em) 1em 1em 1.2em; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent;
  }
  .stage pre[class*="language-"].line-numbers { padding-left: 3.8em; }
  .stage pre[class*="language-"], .stage code[class*="language-"] {
    font: 13px/1.6 var(--mono); font-variant-ligatures: none; text-shadow: none; tab-size: 2;
  }
  .stage .line-numbers .line-numbers-rows { border-right-color: rgba(255,255,255,.12); }
  .stage .line-numbers-rows > span::before { color: #5c6370; }
  .stage pre[data-line] { cursor: pointer; }
  .stage .line-highlight {
    background: linear-gradient(to right, rgba(247, 223, 30, .16) 70%, rgba(247, 223, 30, 0));
    box-shadow: inset 3px 0 0 var(--accent); min-width: 100%;
    margin-top: var(--pt, 1em); /* must equal the pre top padding */
  }
  .stage .line-highlight::before, .stage .line-highlight[data-end]::after { background: var(--accent); color: #0e1013; box-shadow: none; }
  /* Always show the toolbar instead of only on hover */
  .stage div.code-toolbar > .toolbar { opacity: 1; top: 8px; right: 10px; display: flex; gap: 6px; }
  .stage div.code-toolbar > .toolbar > .toolbar-item > button,
  .stage div.code-toolbar > .toolbar > .toolbar-item > span {
    font: 12px var(--font); padding: 3px 9px; border-radius: 6px; box-shadow: none;
    background: rgba(255,255,255,.08); color: var(--muted); border: 1px solid var(--line);
  }
  .stage div.code-toolbar > .toolbar > .toolbar-item > button { cursor: pointer; color: var(--fg); }
  .stage div.code-toolbar > .toolbar > .toolbar-item > button:hover { border-color: var(--accent); }
  .stage .command-line-prompt { border-right-color: rgba(255,255,255,.2); }
  .stage .command-line-prompt > span::before { color: var(--c4); opacity: 1; }
  .stage .command-line .token.output { opacity: .6; }
  .prism-previewer { z-index: 20; }

  .sbar { flex: none; border-top: 1px solid var(--line); background: var(--bg-2); padding: 6px 10px; }
  .sbar pre { margin: 0; padding: 0; background: none; font: 11.5px/1.5 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbar code { font: inherit; text-shadow: none; }

  .side { min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-2); overflow: hidden; }
  .side .label { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); margin-bottom: 2px; }
  .plugs { display: flex; flex-direction: column; gap: 5px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .plugs::-webkit-scrollbar { display: none; }
  .plug {
    display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: center; text-align: left;
    padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.02);
    color: var(--fg); font: inherit; cursor: pointer;
  }
  .plug b { font-size: 13px; }
  .plug b code { font: 11px var(--mono); color: var(--muted); margin-left: 6px; font-weight: 400; }
  .plug small { grid-column: 1; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .plug .sw { grid-column: 2; grid-row: 1 / span 2; width: 30px; height: 17px; border-radius: 9px; background: var(--line); position: relative; transition: background .2s; }
  .plug .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .plug[aria-pressed="true"] { border-color: rgba(247, 223, 30, .45); }
  .plug[aria-pressed="true"] .sw { background: var(--accent); }
  .plug[aria-pressed="true"] .sw::after { transform: translateX(13px); background: #0e1013; }
  .plug.fixed { cursor: default; }
  .plug.fixed .sw { opacity: .45; }
  .plug:disabled { opacity: .38; cursor: not-allowed; }

  @media (max-width: 640px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); padding: 10px 10px 44px; gap: 8px; }
    .top .title, .tour, .tabbar .tip { display: none; }
    .side { order: 0; padding: 0; border: 0; background: none; }
    .side .label { display: none; }
    .plugs { flex-direction: row; overflow-x: auto; }
    .plug { flex: none; display: flex; gap: 6px; padding: 5px 9px; }
    .plug small, .plug b code, .plug.fixed, .plug:disabled { display: none; }
    .plug b { font-size: 12px; font-weight: 600; }
    .plug .sw { width: 24px; height: 14px; }
    .plug .sw::after { width: 10px; height: 10px; }
    .plug[aria-pressed="true"] .sw::after { transform: translateX(10px); }
    .main { order: 1; }
    .stage pre[class*="language-"], .stage code[class*="language-"] { font-size: 12px; }
    .stage div.code-toolbar > .toolbar { top: 6px; right: 6px; }
    .stage { --pt: 38px; } /* room for the toolbar above the first line */
  }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <span class="title">Prism 外掛</span>
    <div class="tabs" id="tabs" role="tablist"></div>
    <span class="tour" id="tour">自動輪播中，點任意處接手</span>
  </div>
  <section class="main">
    <div class="tabbar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span id="file"></span>
      <span class="tip" id="tip"></span>
    </div>
    <div class="stage" id="stage"></div>
    <div class="sbar" title="外掛透過 class 與 data-* 屬性啟用"><pre><code id="markup"></code></pre></div>
  </section>
  <aside class="side">
    <div class="label">外掛開關</div>
    <div class="plugs" id="plugs"></div>
  </aside>
</div>
<div class="hint">切換情境與外掛，點程式碼行可增減高亮</div>

<script>window.Prism = { manual: true };</script>
<script src="https://cdn.jsdelivr.net/combine/npm/prismjs@1.30.0/components/prism-core.min.js,npm/prismjs@1.30.0/components/prism-clike.min.js,npm/prismjs@1.30.0/components/prism-markup.min.js,npm/prismjs@1.30.0/components/prism-css.min.js,npm/prismjs@1.30.0/components/prism-css-extras.min.js,npm/prismjs@1.30.0/components/prism-javascript.min.js,npm/prismjs@1.30.0/components/prism-diff.min.js,npm/prismjs@1.30.0/components/prism-bash.min.js,npm/prismjs@1.30.0/plugins/line-numbers/prism-line-numbers.min.js,npm/prismjs@1.30.0/plugins/line-highlight/prism-line-highlight.min.js,npm/prismjs@1.30.0/plugins/toolbar/prism-toolbar.min.js,npm/prismjs@1.30.0/plugins/show-language/prism-show-language.min.js,npm/prismjs@1.30.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js,npm/prismjs@1.30.0/plugins/diff-highlight/prism-diff-highlight.min.js,npm/prismjs@1.30.0/plugins/command-line/prism-command-line.min.js,npm/prismjs@1.30.0/plugins/match-braces/prism-match-braces.min.js,npm/prismjs@1.30.0/plugins/inline-color/prism-inline-color.min.js,npm/prismjs@1.30.0/plugins/previewers/prism-previewers.min.js"></script>
<script>
// Each scene is a plain <pre><code>; Prism plugins are switched on purely through classes and data-* attributes.
const SCENES = [
  {
    id: "lines", label: "行號＋高亮", lang: "javascript", title: "JavaScript", file: "courses.js",
    plugins: ["numbers", "highlight", "braces"], lines: [3, 4, 8, 9],
    code: `// 載入課程清單並依報名人數排序（示意資料）
export async function loadCourses(city = "台北") {
  const res = await fetch(\`/api/courses?city=\${city}\`);
  if (!res.ok) throw new Error(\`讀取失敗：\${res.status}\`);

  const courses = await res.json();
  return courses
    .filter((c) => c.seats > 0)
    .sort((a, b) => b.signups - a.signups)
    .map(({ id, title, signups }) => ({
      id,
      title,
      label: \`\${title}（\${signups} 人）\`,
    }));
}

const list = await loadCourses("台中");
console.table(list.slice(0, 5));`,
  },
  {
    id: "diff", label: "Diff 差異", lang: "diff-javascript", title: "Diff（JS）", file: "cart.js.diff",
    plugins: ["numbers", "diff", "braces"],
    code: ` // 計算購物車總金額（示意資料）
-function total(items) {
-  let sum = 0;
-  for (let i = 0; i < items.length; i++) {
-    sum += items[i].price * items[i].qty;
-  }
-  return sum;
-}
+const TAX_RATE = 0.05;
+
+export function total(items, { withTax = false } = {}) {
+  const sum = items.reduce((acc, it) => acc + it.price * it.qty, 0);
+  return withTax ? Math.round(sum * (1 + TAX_RATE)) : sum;
+}

 console.log(total(cart));
+console.log(total(cart, { withTax: true }));`,
  },
  {
    id: "cli", label: "命令列", lang: "bash", title: "Shell", file: "終端機",
    plugins: ["cmd"], output: "4,6-7,9-10",
    code: `npm create vite@latest my-app -- --template vanilla
cd my-app
npm install
added 12 packages in 3s
npm run dev
  VITE ready in 312 ms
  Local:   http://localhost:5173/
git add . && git commit -m "初始化專案"
[main (root-commit) 3f2a1c9] 初始化專案
 8 files changed, 214 insertions(+)`,
  },
  {
    id: "css", label: "CSS 色票", lang: "css", title: "CSS", file: "theme.css",
    plugins: ["numbers", "braces", "preview"],
    code: `/* 品牌色與動態，滑鼠移到數值上可預覽 */
:root {
  --brand: #f7df1e;
  --sky: hsl(195, 85%, 62%);
  --rose: rgb(247, 37, 133);
  --mint: #7bd389;
}

.hero {
  background: linear-gradient(135deg, #4cc9f0, #9d8cff 60%, #f72585);
  color: rgba(14, 16, 19, 0.92);
  transform: rotate(-2deg);
  transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.hero:hover {
  transform: rotate(0deg) scale(1.03);
  box-shadow: 0 12px 32px hsla(195, 85%, 62%, 0.45);
}`,
  },
];

const PLUGINS = [
  { key: "numbers", name: "行號", id: "line-numbers", desc: "左側加上行號欄" },
  { key: "highlight", name: "行高亮", id: "line-highlight", desc: "用 data-line 強調指定行" },
  { key: "braces", name: "括號配對", id: "match-braces", desc: "彩虹括號，滑過顯示成對括號" },
  { key: "diff", name: "Diff 高亮", id: "diff-highlight", desc: "增刪行加底色，保留 JS 語法色" },
  { key: "cmd", name: "命令列", id: "command-line", desc: "加提示字元，區分指令與輸出" },
  { key: "preview", name: "預覽浮窗", id: "previewers", desc: "滑過顏色、漸層、曲線即預覽" },
  { key: "swatch", name: "色塊", id: "inline-color", desc: "顏色值前加小色塊（固定）", fixed: true, only: "css" },
  { key: "toolbar", name: "工具列", id: "toolbar", desc: "語言標籤與複製鈕（固定）", fixed: true },
];

const state = { numbers: true, highlight: true, braces: true, diff: true, cmd: true, preview: true };
const marked = new Set(SCENES[0].lines);
let cur = 0;

const $ = (id) => document.getElementById(id);
const stage = $("stage");

function toRanges(set) {
  const nums = [...set].sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i < nums.length; i++) {
    let j = i;
    while (j + 1 < nums.length && nums[j + 1] === nums[j] + 1) j++;
    out.push(i === j ? String(nums[i]) : `${nums[i]}-${nums[j]}`);
    i = j;
  }
  return out.join(",");
}

const applies = (key) => {
  const p = PLUGINS.find((x) => x.key === key);
  if (p.key === "toolbar") return true;
  if (p.only) return SCENES[cur].id === p.only;
  return SCENES[cur].plugins.includes(key);
};
const on = (key) => applies(key) && state[key];

function render() {
  const s = SCENES[cur];
  const old = stage.querySelector("pre");
  const keepScroll = old && old.dataset.scene === s.id ? [old.scrollTop, old.scrollLeft] : [0, 0];

  const pre = document.createElement("pre");
  const code = document.createElement("code");
  const lang = s.id === "diff" && !state.diff ? "diff" : s.lang;
  pre.className = `language-${lang}`;
  if (on("numbers")) pre.classList.add("line-numbers");
  if (on("braces")) pre.classList.add("match-braces", "rainbow-braces");
  if (s.id === "diff" && state.diff) pre.classList.add("diff-highlight");
  if (on("highlight") && marked.size) pre.setAttribute("data-line", toRanges(marked));
  if (on("cmd")) {
    pre.classList.add("command-line");
    pre.setAttribute("data-user", "clare");
    pre.setAttribute("data-host", "atlas");
    pre.setAttribute("data-output", s.output);
  }
  if (s.id === "css" && !state.preview) pre.setAttribute("data-previewers", "");

  // Show the activating markup before toolbar/i18n attributes are added.
  const attrs = [...pre.attributes].map((a) => `${a.name}="${a.value}"`).join(" ");
  $("markup").innerHTML = Prism.highlight(`<pre ${attrs}>`, Prism.languages.markup, "markup");

  pre.setAttribute("data-language", s.title);
  pre.setAttribute("data-prismjs-copy", "複製");
  pre.setAttribute("data-prismjs-copy-success", "已複製！");
  pre.setAttribute("data-prismjs-copy-error", "請按 Ctrl+C 複製");
  pre.setAttribute("data-prismjs-copy-timeout", "1800");
  pre.dataset.scene = s.id;
  code.textContent = s.code;
  pre.append(code);
  stage.replaceChildren(pre);
  Prism.highlightElement(code);
  pre.scrollTop = keepScroll[0];
  pre.scrollLeft = keepScroll[1];

  $("file").textContent = s.file;
  $("tip").textContent = {
    lines: on("highlight") ? "點任一行切換高亮" : "",
    diff: "以 language-diff-javascript 上色",
    cli: on("cmd") ? "指令與輸出自動區分" : "",
    css: on("preview") ? "滑鼠移到數值上看預覽" : "",
  }[s.id];
  for (const b of document.querySelectorAll("#tabs .btn")) b.setAttribute("aria-pressed", String(+b.dataset.i === cur));
  for (const b of document.querySelectorAll(".plug")) {
    const p = PLUGINS[+b.dataset.i];
    b.disabled = !applies(p.key);
    b.setAttribute("aria-pressed", String(p.fixed ? applies(p.key) : on(p.key)));
    b.title = b.disabled ? "這個情境用不到此外掛" : "";
  }
}

// Scene tabs
SCENES.forEach((s, i) => {
  const b = document.createElement("button");
  b.className = "btn";
  b.dataset.i = i;
  b.setAttribute("role", "tab");
  b.textContent = s.label;
  b.addEventListener("click", () => { cur = i; render(); });
  $("tabs").append(b);
});

// Plugin switches
PLUGINS.forEach((p, i) => {
  const b = document.createElement("button");
  b.className = "plug" + (p.fixed ? " fixed" : "");
  b.dataset.i = i;
  b.innerHTML = `<b>${p.name}<code>${p.id}</code></b><small>${p.desc}</small><i class="sw"></i>`;
  if (!p.fixed) b.addEventListener("click", () => { state[p.key] = !state[p.key]; render(); });
  $("plugs").append(b);
});

// Click a code line to toggle it in data-line (line-highlight plugin).
stage.addEventListener("click", (e) => {
  const pre = stage.querySelector("pre");
  if (!pre || !on("highlight")) return;
  if (e.target.closest(".toolbar")) return;
  const cs = getComputedStyle(pre);
  const top = pre.getBoundingClientRect().top + parseFloat(cs.paddingTop) - pre.scrollTop;
  const line = Math.floor((e.clientY - top) / parseFloat(cs.lineHeight)) + 1;
  const total = SCENES[cur].code.split("\n").length;
  if (line < 1 || line > total) return;
  if (marked.has(line)) marked.delete(line); else marked.add(line);
  render();
});

// Auto tour: rotate scenes; in the CSS scene, fake hovers so the previewers pop up.
let tourTimer = 0, touring = true, hoverTimers = [];
function hoverToken(match) {
  const pre = stage.querySelector("pre");
  if (!pre) return;
  const prev = pre.querySelector(".tour-hover");
  if (prev) { prev.dispatchEvent(new MouseEvent("mouseout", { bubbles: true })); prev.classList.remove("tour-hover"); }
  if (!match) return;
  const tok = [...pre.querySelectorAll(".token")].find((t) => t.textContent.startsWith(match));
  if (!tok) return;
  tok.classList.add("tour-hover");
  tok.dispatchEvent(new MouseEvent("mouseover", { bubbles: true }));
}
function tourStep() {
  if (!touring) return;
  cur = (cur + 1) % SCENES.length;
  render();
  hoverTimers.forEach(clearTimeout);
  hoverTimers = [];
  if (SCENES[cur].id === "css" && state.preview) {
    [["linear-gradient", 700], ["cubic-bezier", 2300], ["hsla", 3900], [null, 5400]].forEach(([m, t]) => {
      hoverTimers.push(setTimeout(() => touring && hoverToken(m), t));
    });
  }
  tourTimer = setTimeout(tourStep, 6000);
}
function stopTour() {
  if (!touring) return;
  touring = false;
  clearTimeout(tourTimer);
  hoverTimers.forEach(clearTimeout);
  hoverToken(null);
  $("tour").hidden = true;
}
window.addEventListener("pointerdown", stopTour, true);
window.addEventListener("keydown", stopTour, true);

render();
tourTimer = setTimeout(tourStep, 6000);
</script>
</body>
</html>
