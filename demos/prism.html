<style>
  .pr-fill { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
  @media (max-width: 640px) { .pr-fill { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; } }
  .pr-pane { position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: #12151a; }
  .pr-pane.side { background: var(--bg-2); }
  .pr-head { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); background: var(--bg-2); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .pr-head b { color: var(--fg); font: 600 12px var(--mono); }
  .pr-head .sp { flex: 1; }
  .pr-head code { font: 11px var(--mono); padding: 1px 6px; border-radius: 5px; background: rgba(127,127,127,.14); color: var(--c2); overflow: hidden; text-overflow: ellipsis; }
  .pr-body { flex: 1 1 0; min-height: 0; overflow: auto; }
  .sc-scene pre[class*="language-"] { margin: 0; border-radius: 0; background: #12151a; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
  .sc-scene pre[class*="language-"], .sc-scene code[class*="language-"] { font: 12.5px/1.6 var(--mono); font-variant-ligatures: none; text-shadow: none; tab-size: 4; }
  .sc-scene div.code-toolbar > .toolbar { top: 6px; right: 8px; display: flex; gap: 6px; }
  .sc-scene div.code-toolbar > .toolbar > .toolbar-item > button, .sc-scene div.code-toolbar > .toolbar > .toolbar-item > span { font: 11.5px var(--font); padding: 3px 9px; border-radius: 6px; box-shadow: none; background: rgba(255,255,255,.08); color: var(--muted); border: 1px solid var(--line); }
  .sc-scene div.code-toolbar > .toolbar > .toolbar-item > button { cursor: pointer; color: var(--fg); }
  .pr-label { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); }
  .pr-list { list-style: none; margin: 0; padding: 8px; display: grid; gap: 5px; align-content: start; font-size: 12px; }
  .pr-list li { padding: 5px 8px; border-radius: 7px; background: rgba(127,127,127,.08); line-height: 1.5; }
  .pr-list li.new { animation: pr-flash .6s; }
  .pr-list code { font: 11px var(--mono); color: var(--c2); }
  .pr-list .t { font: 10.5px var(--mono); color: var(--muted); margin-right: 6px; }
  @keyframes pr-flash { from { box-shadow: inset 0 0 0 2px var(--accent); } to { box-shadow: inset 0 0 0 2px transparent; } }
  .pr-kv { flex: none; margin: 0; padding: 8px 12px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; font-size: 12px; border-top: 1px solid var(--line); background: var(--bg-2); }
  .pr-kv dt { color: var(--muted); white-space: nowrap; }
  .pr-kv dd { margin: 0; font: 11.5px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-chips { flex: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 10px; border-top: 1px solid var(--line); background: var(--bg-2); }
  .pr-chips span { font: 11px var(--mono); padding: 1px 7px; border-radius: 999px; background: rgba(127,127,127,.12); color: var(--muted); }
  .pr-chips span.on { background: rgba(247, 223, 30, .16); color: var(--accent); }

  /* 1. plugin playground (ported from the original single-page demo) */
  .pr-plug-grid { grid-template-columns: minmax(0, 1fr) 252px; }
  .pr-stage { position: relative; flex: 1 1 0; min-height: 0; --pt: 1em; }
  .pr-stage > .code-toolbar, .pr-stage > pre { position: absolute; inset: 0; }
  .pr-stage pre[class*="language-"] { height: 100%; box-sizing: border-box; padding: var(--pt) 1em 1em 1.2em; }
  .pr-stage pre[class*="language-"].line-numbers { padding-left: 3.8em; }
  .pr-stage .line-numbers .line-numbers-rows { border-right-color: rgba(255,255,255,.12); }
  .pr-stage .line-numbers-rows > span::before { color: #5c6370; }
  .pr-stage pre[data-line] { cursor: pointer; }
  .pr-stage .line-highlight { background: linear-gradient(to right, rgba(247, 223, 30, .16) 70%, rgba(247, 223, 30, 0)); box-shadow: inset 3px 0 0 var(--accent); min-width: 100%; margin-top: var(--pt); }
  .pr-stage .line-highlight::before, .pr-stage .line-highlight[data-end]::after { background: var(--accent); color: #0e1013; box-shadow: none; }
  .pr-stage div.code-toolbar > .toolbar { opacity: 1; }
  .pr-stage .command-line-prompt { border-right-color: rgba(255,255,255,.2); }
  .pr-stage .command-line-prompt > span::before { color: var(--c4); opacity: 1; }
  .pr-stage .command-line .token.output { opacity: .6; }
  .prism-previewer { z-index: 120; }
  .pr-sbar { flex: none; border-top: 1px solid var(--line); background: var(--bg-2); padding: 6px 10px; }
  .pr-sbar pre[class*="language-"] { margin: 0; padding: 0; background: none; font: 11.5px/1.5 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-plugs { display: flex; flex-direction: column; gap: 5px; padding: 10px; min-height: 0; overflow-y: auto; scrollbar-width: none; }
  .pr-plug { display: grid; grid-template-columns: 1fr auto; column-gap: 8px; align-items: center; text-align: left; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.02); color: var(--fg); font: 13px var(--font); cursor: pointer; }
  .pr-plug b code { font: 11px var(--mono); color: var(--muted); margin-left: 6px; font-weight: 400; }
  .pr-plug small { grid-column: 1; font-size: 11.5px; color: var(--muted); line-height: 1.4; }
  .pr-plug .sw { grid-column: 2; grid-row: 1 / span 2; width: 30px; height: 17px; border-radius: 9px; background: var(--line); position: relative; transition: background .2s; }
  .pr-plug .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .pr-plug[aria-pressed="true"] { border-color: rgba(247, 223, 30, .45); }
  .pr-plug[aria-pressed="true"] .sw { background: var(--accent); }
  .pr-plug[aria-pressed="true"] .sw::after { transform: translateX(13px); background: #0e1013; }
  .pr-plug.fixed { cursor: default; }
  .pr-plug.fixed .sw { opacity: .45; }
  .pr-plug:disabled { opacity: .38; cursor: not-allowed; }
  @media (max-width: 640px) {
    .pr-plug-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .pr-plug-grid > .side { order: -1; border: 0; background: none; }
    .pr-plugs { flex-direction: row; overflow-x: auto; padding: 0; }
    .pr-plug { flex: none; display: flex; gap: 6px; padding: 5px 9px; }
    .pr-plug small, .pr-plug b code, .pr-plug.fixed, .pr-plug:disabled { display: none; }
    .pr-plug .sw { width: 24px; height: 14px; }
    .pr-plug .sw::after { width: 10px; height: 10px; }
    .pr-plug[aria-pressed="true"] .sw::after { transform: translateX(10px); }
    .pr-stage { --pt: 38px; }
    .pr-head .tip { display: none; }
  }

  /* 2. autoloader */
  .pr-lz { grid-template-columns: 180px minmax(0, 1fr); }
  .pr-langs { display: flex; flex-direction: column; gap: 5px; padding: 8px; overflow: auto; }
  .pr-langs button { appearance: none; display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: rgba(127,127,127,.06); color: var(--fg); font: 600 12.5px var(--font); cursor: pointer; text-align: left; }
  .pr-langs button[aria-pressed="true"] { border-color: var(--accent); background: rgba(247, 223, 30, .08); }
  .pr-langs small { font: 400 10.5px var(--font); color: var(--muted); }
  .pr-langs small.ok { color: var(--c4); }
  @media (max-width: 640px) { .pr-lz { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .pr-langs { flex-direction: row; overflow-x: auto; padding: 0; } .pr-langs button { flex: none; } .pr-langs small { display: none; } .pr-lz > .side { border: 0; background: none; } }

  /* 3. themes live in iframes so each theme's global selectors stay inside its own document */
  .pr-themes { position: absolute; inset: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  .pr-themes .pr-pane { background: var(--bg-2); }
  .pr-themes iframe { flex: 1 1 0; min-height: 0; width: 100%; border: 0; display: block; }
  @media (max-width: 640px) { .pr-themes { grid-template-columns: minmax(0, 1fr); } .pr-themes .pr-pane:nth-child(n+3) { display: none; } }

  /* 4. extend / insertBefore custom tokens */
  .sc-scene .token.todo { color: #0e1013; background: #f7df1e; border-radius: 3px; font-style: normal; }
  .sc-scene .token.http-method { color: #f72585; font-weight: 700; }
  .sc-scene .token.atlas-api { color: #7bd389; text-decoration: underline dotted; }
  .pr-order { list-style: none; margin: 0; padding: 8px; display: flex; flex-direction: column; gap: 4px; overflow: auto; font: 12px var(--mono); counter-reset: k; }
  .pr-order li { padding: 3px 8px; border-radius: 6px; background: rgba(127,127,127,.08); color: var(--muted); counter-increment: k; display: flex; gap: 8px; }
  .pr-order li::before { content: counter(k); width: 1.6em; text-align: right; color: #5c6370; }
  .pr-order li.add { background: rgba(247, 223, 30, .12); color: var(--accent); }
  .pr-order li small { margin-left: auto; font: 10.5px var(--font); }

  /* 5. token tree */
  .pr-ov { position: relative; flex: 1 1 0; min-height: 0; }
  .pr-ov pre[class*="language-"], .pr-ov textarea { position: absolute; inset: 0; margin: 0; padding: 12px 14px; border: 0; font: 13px/1.6 var(--mono); letter-spacing: 0; tab-size: 4; white-space: pre; word-wrap: normal; font-variant-ligatures: none; }
  .pr-ov pre[class*="language-"] { overflow: hidden; pointer-events: none; }
  .pr-ov pre code { font: inherit; }
  .pr-ov textarea { resize: none; outline: none; background: transparent; color: transparent; caret-color: #f7df1e; overflow: auto; }
  .pr-ov textarea::selection { background: rgba(247, 223, 30, .22); }
  .pr-ov .token.pr-hot { outline: 2px solid #f7df1e; outline-offset: 1px; border-radius: 2px; background: rgba(247, 223, 30, .14); }
  .pr-tree { list-style: none; margin: 0; padding: 6px; overflow: auto; font-size: 12px; }
  .pr-tree li { display: flex; gap: 6px; align-items: baseline; padding: 2px 6px; border-radius: 5px; cursor: default; white-space: nowrap; }
  .pr-tree li:hover, .pr-tree li.hot { background: rgba(247, 223, 30, .12); }
  .pr-tree b { font: 600 11.5px var(--mono); color: var(--c2); }
  .pr-tree i { font: 10.5px var(--mono); font-style: normal; color: var(--c3); }
  .pr-tree code { font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }

  /* 6. hooks */
  .sc-scene .token.pr-money { text-decoration: underline dotted #f7df1e; text-underline-offset: 3px; cursor: help; }
  .sc-scene .token.pr-zh { background: rgba(123, 211, 137, .12); border-radius: 3px; }

  /* 7. highlightAllUnder */
  .pr-doc { padding: 10px 14px; overflow: auto; font-size: 13px; }
  .pr-doc p { margin: 6px 0 5px; color: var(--muted); font-size: 12.5px; }
  .pr-doc p code { font: 11.5px var(--mono); color: var(--c2); }
  .pr-doc pre[class*="language-"], .pr-doc pre { margin: 0 0 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #12151a; font: 12px/1.55 var(--mono); overflow: auto; }
  .pr-doc pre.line-numbers { padding-left: 3.4em; }
  .pr-doc .line-numbers-rows > span::before { color: #5c6370; }
  .pr-st { list-style: none; margin: 0; padding: 8px; display: grid; gap: 6px; align-content: start; font-size: 12px; overflow: auto; }
  .pr-st li { padding: 6px 8px; border-radius: 7px; background: rgba(127,127,127,.08); }
  .pr-st code { display: block; font: 11px var(--mono); color: var(--c2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-st .skip { color: var(--muted); }

  /* 8. stress */
  .pr-stress { position: absolute; inset: calc(var(--sc-ctl-h, 0px) + 8px) 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; display: flex; flex-direction: column; gap: 8px; }
  .pr-stress .pr-pane { flex: 1; }
  .pr-cmp { width: 100%; border-collapse: collapse; font-size: 12px; }
  .pr-cmp th, .pr-cmp td { padding: 4px 10px; border-bottom: 1px solid var(--line); text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .pr-cmp th { font: 600 11.5px var(--font); color: var(--muted); }
  .pr-cmp th:first-child, .pr-cmp td:first-child { text-align: left; }
  .pr-cmp td.win { color: var(--c4); }
  @media (max-width: 760px) { .pr-stress { left: 8px; } }
