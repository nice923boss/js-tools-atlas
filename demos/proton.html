<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proton 示範：火焰、雪花與煙霧</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { transition: background .6s; }
  body[data-mode="fire"] { background: radial-gradient(80% 70% at 50% 100%, #2a1206 0%, #0e1013 70%); }
  body[data-mode="snow"] { background: linear-gradient(#0b1630, #1b2c4f 70%, #2c3e63); }
  body[data-mode="smoke"] { background: radial-gradient(70% 80% at 50% 100%, #3a2d24 0%, #15161a 70%); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  .count { position: fixed; left: 12px; top: 12px; z-index: 50; font-size: 12px; padding: 6px 10px; }
</style>
</head>
<body data-mode="fire">
<canvas id="c"></canvas>
<div class="controls" id="modes">
  <button class="btn" data-mode="fire" aria-pressed="true">火焰</button>
  <button class="btn" data-mode="snow">雪花</button>
  <button class="btn" data-mode="smoke">煙霧</button>
</div>
<div class="count panel mono" id="count">粒子 0</div>
<div class="hint" id="hint">移動滑鼠帶著火焰走・點擊炸出火花</div>

<script src="https://cdn.jsdelivr.net/npm/proton-engine@7.1.5/build/proton.web.min.js"></script>
<script>
// Proton particle engine with its CanvasRenderer; each mode is a different emitter recipe.
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const proton = new Proton();
const renderer = new Proton.CanvasRenderer(canvas);
let blend = "lighter";
// Clear each frame, then draw particles additively (fire/sparks) or normally (snow/smoke).
renderer.onProtonUpdate = function () {
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = blend;
};
proton.addRenderer(renderer);

const mouse = new Proton.Vector2D(0, 0);
const S = (a, b, c) => new Proton.Span(a, b, c);
// Pre-coloured soft radial sprites used as particle bodies (drawn untinted, so colours stay vivid).
function puff(rgb) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},1)`);
  gr.addColorStop(0.35, `rgba(${rgb},0.5)`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return c.toDataURL();
}
const FLAME = new Proton.ArraySpan([puff("255,170,40"), puff("255,110,20"), puff("235,50,20"), puff("200,30,90")]);
const SMOKE = new Proton.ArraySpan([puff("150,144,138"), puff("110,105,100"), puff("90,86,84")]);
let current = [];
let mode = "fire";

function fire() {
  const e = new Proton.Emitter();
  e.rate = new Proton.Rate(S(5, 7), 0.035);
  e.addInitialize(new Proton.Mass(1));
  e.addInitialize(new Proton.Body(FLAME));
  e.addInitialize(new Proton.Life(0.8, 1.6));
  e.addInitialize(new Proton.Velocity(S(1.8, 3.4), S(0, 12, true), "polar"));
  e.addBehaviour(new Proton.Alpha(0.7, 0));
  e.addBehaviour(new Proton.Scale(S(0.7, 1.05), 0.08));
  e.addBehaviour(new Proton.RandomDrift(12, 0, 0.04));
  e.p.x = mouse.x;
  e.p.y = mouse.y;
  e.emit();
  return [e];
}

function snow() {
  const w = canvas.width, h = canvas.height;
  const e = new Proton.Emitter();
  e.rate = new Proton.Rate(S(2, 4), 0.05);
  e.addInitialize(new Proton.Position(new Proton.RectZone(0, -30, w, 20)));
  e.addInitialize(new Proton.Mass(1));
  e.addInitialize(new Proton.Radius(1.2, 4.2));
  e.addInitialize(new Proton.Life(30));
  e.addInitialize(new Proton.Velocity(S(0.6, 1.6), S(180, 12, true), "polar"));
  e.addBehaviour(new Proton.RandomDrift(14, 2, 0.15));
  e.addBehaviour(new Proton.Repulsion(mouse, 6, 110));
  e.addBehaviour(new Proton.Color("#ffffff", ["#cfe8ff", "#ffffff"]));
  e.addBehaviour(new Proton.Alpha(S(0.5, 1)));
  e.addBehaviour(new Proton.CrossZone(new Proton.RectZone(-40, -60, w + 80, h + 100), "dead"));
  e.emit();
  return [e];
}

function smoke() {
  const w = canvas.width, h = canvas.height;
  const list = [];
  for (const fx of [0.3, 0.7]) {
    const e = new Proton.Emitter();
    e.rate = new Proton.Rate(S(1, 2), 0.06);
    e.addInitialize(new Proton.Mass(1));
    e.addInitialize(new Proton.Body(SMOKE));
    e.addInitialize(new Proton.Life(3, 5));
    e.addInitialize(new Proton.Velocity(S(0.6, 1.3), S(0, 22, true), "polar"));
    e.addBehaviour(new Proton.Alpha(S(0.25, 0.4), 0));
    e.addBehaviour(new Proton.Scale(0.5, 3.4));
    e.addBehaviour(new Proton.RandomDrift(18, 4, 0.1));
    e.addBehaviour(new Proton.Repulsion(mouse, 4, 140));
    e.p.x = w * fx;
    e.p.y = h + 10;
    e.emit();
    list.push(e);
  }
  return list;
}

const RECIPES = {
  fire: { make: fire, pre: 0, blend: "lighter", hint: "移動滑鼠帶著火焰走・點擊炸出火花" },
  snow: { make: snow, pre: 14, blend: "source-over", hint: "滑鼠會把雪花推開・點擊炸出火花" },
  smoke: { make: smoke, pre: 3, blend: "source-over", hint: "滑鼠會攪散煙霧・點擊炸出火花" },
};

function setMode(m) {
  mode = m;
  for (const e of current) e.destroy();
  blend = RECIPES[m].blend;
  current = RECIPES[m].make();
  for (const e of current) {
    proton.addEmitter(e);
    // preEmit needs the emitter attached to proton (it uses proton's particle pool).
    if (RECIPES[m].pre) e.preEmit(RECIPES[m].pre);
  }
  document.body.dataset.mode = m;
  document.getElementById("hint").textContent = RECIPES[m].hint;
  document.querySelectorAll("#modes .btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
}

// One-shot spark burst that removes itself after emitting.
function burst(x, y) {
  const e = new Proton.Emitter();
  e.rate = new Proton.Rate(S(50, 70), 1);
  e.addInitialize(new Proton.Mass(1));
  e.addInitialize(new Proton.Radius(2, 5));
  e.addInitialize(new Proton.Life(0.6, 1.2));
  e.addInitialize(new Proton.Velocity(S(1.5, 5), S(0, 360), "polar"));
  e.addBehaviour(new Proton.Alpha(1, 0));
  e.addBehaviour(new Proton.Gravity(2.5));
  e.addBehaviour(new Proton.Color(["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42"], "random"));
  e.p.x = x;
  e.p.y = y;
  e.emit("once", true);
  proton.addEmitter(e);
}

function resize() {
  renderer.resize(innerWidth, innerHeight);
  mouse.x = innerWidth / 2;
  mouse.y = innerHeight * 0.68;
  setMode(mode);
}

let moved = false;
canvas.addEventListener("pointermove", (ev) => {
  moved = true;
  mouse.x = ev.clientX;
  mouse.y = ev.clientY;
  if (mode === "fire") for (const e of current) { e.p.x = ev.clientX; e.p.y = ev.clientY; }
});
canvas.addEventListener("pointerdown", (ev) => burst(ev.clientX, ev.clientY));
document.getElementById("modes").addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-mode]");
  if (b) setMode(b.dataset.mode);
});
addEventListener("resize", resize);

const countEl = document.getElementById("count");
let t = 0;
function tick() {
  requestAnimationFrame(tick);
  // Idle fire sways gently like a campfire until the viewer moves the mouse.
  if (mode === "fire" && !moved) {
    t += 0.02;
    for (const e of current) {
      e.p.x = innerWidth / 2 + Math.sin(t) * 18;
      e.p.y = innerHeight * 0.74;
    }
  }
  proton.update();
  countEl.textContent = `粒子 ${proton.getCount()}`;
}

resize();
tick();
// Periodic spark bursts keep the scene lively in idle previews.
setInterval(() => burst(innerWidth * (0.2 + Math.random() * 0.6), innerHeight * (0.2 + Math.random() * 0.35)), 1800);
</script>
</body>
</html>
