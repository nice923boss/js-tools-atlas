<script src="https://cdn.jsdelivr.net/npm/proton-engine@7.1.5/build/proton.web.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Proton 7 showcase. An Emitter owns initializers (applied once when a particle is born) and
// behaviours (applied every update); renderers subscribe to proton events and draw.
// Pitfalls handled here: dispatchEvent stops at the first truthy listener return, so every
// listener is block-bodied; behaviour.parents is never pruned, so it is deleted before adding.
const { h } = Showcase;
const {
  Emitter, BehaviourEmitter, FollowEmitter, Span, ArraySpan, Rate, Vector2D, Rectangle,
  Mass, Radius, Life, Velocity, Position, Body, Alpha, Scale, Color, Rotate, Gravity, Force,
  Attraction, Repulsion, GravityWell, Cyclone, RandomDrift, Collision, CrossZone,
  RectZone, CircleZone, LineZone, PointZone, ImageZone,
} = Proton;
const S = (a, b, c) => new Span(a, b, c);
const R = (n, t) => new Rate(n, t);
const PALETTE = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#9d8cff", "#ff8c42"];
// Real elapsed time instead of a fixed 1/60 s step, so motion speed does not depend on frame rate.
Proton.USE_CLOCK = true;

// Pre-coloured soft radial sprites used as particle bodies (drawn untinted, so colours stay vivid).
function puff(rgb) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const g = c.getContext("2d");
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, `rgba(${rgb},1)`);
  gr.addColorStop(0.35, `rgba(${rgb},0.5)`);
  gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return c.toDataURL();
}
const FLAME = new ArraySpan([puff("255,170,40"), puff("255,110,20"), puff("235,50,20"), puff("200,30,90")]);
const SMOKE = new ArraySpan([puff("150,144,138"), puff("110,105,100"), puff("90,86,84")]);
// Arrow sprite pointing up (Proton's rotation 0 means "up").
function arrowURL(color) {
  const c = document.createElement("canvas");
  c.width = c.height = 24;
  const g = c.getContext("2d");
  g.fillStyle = color;
  g.beginPath(); g.moveTo(12, 1); g.lineTo(22, 22); g.lineTo(12, 17); g.lineTo(2, 22); g.closePath(); g.fill();
  return c.toDataURL();
}
const ARROWS = PALETTE.map(arrowURL);

function make(proton, rate, inits, behs, x = 0, y = 0, e = new Emitter()) {
  if (rate) e.rate = rate;
  inits.forEach((i) => e.addInitialize(i));
  behs.forEach((b) => { delete b.parents; e.addBehaviour(b); }); // parents is never pruned (leak)
  e.p.x = x; e.p.y = y;
  proton.addEmitter(e);
  return e;
}
function burst(proton, x, y) {
  make(proton, R(S(50, 70), 1),
    [new Mass(1), new Radius(2, 5), new Life(0.6, 1.2), new Velocity(S(1.5, 5), S(0, 360), "polar")],
    [new Alpha(1, 0), new Gravity(2.5), new Color(PALETTE, "random")], x, y).emit("once", 1.3);
}
// Replace behaviours on the emitter and on every live particle (particles copy the list at birth).
function swap(em, cur, next) {
  cur.forEach((b) => { em.removeBehaviour(b); em.particles.forEach((p) => p.removeBehaviour(b)); });
  next.forEach((b) => { delete b.parents; em.addBehaviour(b); em.particles.forEach((p) => p.addBehaviour(b)); });
}
// preEmit fires PARTICLE_UPDATE for every simulated step; mute drawing while it runs.
function pre(W, em, t) { W.view.mute = true; em.preEmit(t); W.view.mute = false; }

// One Proton + CanvasRenderer bound to a host element, sized for devicePixelRatio.
function world(ctx, host, { onSize = null, trail = 0, blend = "source-over" } = {}) {
  const canvas = document.createElement("canvas");
  host.prepend(canvas);
  const proton = new Proton();
  const renderer = new Proton.CanvasRenderer(canvas);
  const c2d = renderer.context;
  const view = { w: 0, h: 0, trail, blend, under: null, mute: false };
  renderer.onProtonUpdate = function () {
    c2d.globalCompositeOperation = "source-over";
    if (view.trail) {
      c2d.globalCompositeOperation = "destination-out";
      c2d.fillStyle = `rgba(0,0,0,${view.trail})`;
      c2d.fillRect(0, 0, view.w, view.h);
      c2d.globalCompositeOperation = "source-over";
    } else {
      c2d.clearRect(0, 0, view.w, view.h);
    }
    if (view.under) view.under(c2d);
    c2d.globalCompositeOperation = view.blend;
  };
  const draw = renderer.onParticleUpdate;
  renderer.onParticleUpdate = function (p) { if (!view.mute) draw.call(this, p); };
  proton.addRenderer(renderer);
  let ready = false, alive = true;
  const fit = () => {
    const w = host.clientWidth, hh = host.clientHeight;
    if (!w || !hh || (w === view.w && hh === view.h)) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    renderer.resize(Math.round(w * dpr), Math.round(hh * dpr));
    canvas.style.width = w + "px";
    canvas.style.height = hh + "px";
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    view.w = w; view.h = hh;
    if (ready && onSize) onSize(w, hh);
  };
  fit();
  ready = true;
  const ro = new ResizeObserver(fit);
  ro.observe(host);
  ctx.onCleanup(() => { alive = false; ro.disconnect(); proton.destroy(); });
  ctx.raf(() => { if (alive) proton.update(); });
  const over = (fn) => {
    proton.addEventListener(Proton.PROTON_UPDATE_AFTER, () => {
      c2d.globalCompositeOperation = "source-over";
      fn(c2d);
    });
  };
  return { proton, c2d, view, canvas, renderer, over };
}

// Shared pointer: follows a scripted path (with a ghost dot and timed taps) until a real pointer moves.
function pointer(ctx, host, { path, tapEvery = 0, onTap = null, onMove = null }) {
  const pt = new Vector2D();
  const [fx, fy] = path(0);
  pt.set(fx * host.clientWidth, fy * host.clientHeight);
  const dot = h("div", { class: "pt-ghost" });
  host.append(dot);
  let t = 0, next = 600;
  const stop = ctx.raf((_, dt) => {
    t += dt / 1000;
    const [ax, ay] = path(t);
    const x = ax * host.clientWidth, y = ay * host.clientHeight;
    dot.style.transform = `translate(${x - 8}px, ${y - 8}px)`;
    pt.set(x, y);
    if (onMove) onMove(x, y);
    const every = typeof tapEvery === "function" ? tapEvery() : tapEvery;
    if (every > 0) {
      next -= dt;
      if (next <= 0) {
        next = every;
        dot.classList.remove("pt-tap");
        void dot.offsetWidth;
        dot.classList.add("pt-tap");
        if (onTap) onTap(x, y);
      }
    }
  });
  let manual = false;
  const take = (e) => {
    if (!manual) { manual = true; stop(); dot.remove(); }
    const r = host.getBoundingClientRect();
    const x = e.clientX - r.left - host.clientLeft, y = e.clientY - r.top - host.clientTop;
    pt.set(x, y);
    if (onMove) onMove(x, y);
    return [x, y];
  };
  ctx.on(host, "pointermove", (e) => { if (e.isTrusted) take(e); });
  ctx.on(host, "pointerdown", (e) => {
    if (!e.isTrusted) return;
    const [x, y] = take(e);
    if (onTap) onTap(x, y);
  });
  return { pt };
}

const EASE_DESC = {
  easeLinear: "等速變化", easeOutCubic: "先快後慢", easeInExpo: "前段幾乎不變，最後驟降",
  easeInQuad: "先慢後快", easeOutQuad: "先快後慢（較緩）", easeInOutCubic: "兩端慢、中段快",
  easeInOutSine: "柔和的 S 形", easeOutExpo: "一開始就驟降", easeInOutCirc: "中段急轉",
  easeInBack: "先回彈變大再縮小",
};

Showcase.run({ scenes: [
  {
    id: "classic", title: "火焰雪花煙霧",
    api: "Emitter・Rate・Body(ArraySpan)・Repulsion・FollowEmitter",
    desc: "Proton 的核心是發射器（Emitter）：Rate 決定每隔多久噴幾顆，初始器（Body、Life、Velocity）只在粒子出生時套用一次，行為（Alpha、Scale、RandomDrift、Repulsion）每格都會作用。四種配方共用同一個 Proton 實例，切換時 destroyAllEmitters 再重建；星塵改用 FollowEmitter，只在游標移動時噴出粒子。",
    hint: "移動游標帶著火焰走、推開雪花與煙霧・點擊炸出火花・切換四種配方",
    mount(ctx) {
      ctx.html(`<div class="pt-stage pt-bg-fire"><div class="pt-chip"></div></div>`);
      const host = ctx.$(".pt-stage"), chip = ctx.$(".pt-chip");
      const BG = ["pt-bg-fire", "pt-bg-snow", "pt-bg-smoke", "pt-bg-night"];
      const CHIPS = [
        `<code>Body(ArraySpan)</code> 四張預先上色的柔光貼圖<span class="pt-sub">・lighter 疊加・發射器追著游標</span>`,
        `<code>Repulsion(pt, 6, 110)</code> 游標推開雪花<span class="pt-sub">・RandomDrift 飄移・preEmit(14) 預先下滿</span>`,
        `<code>Scale(.5, 3.4)</code> 煙團隨壽命放大<span class="pt-sub">・Alpha 淡出・Repulsion 攪散</span>`,
        `<code>FollowEmitter(target, .25)</code> 每次 mousemove 噴一撮<span class="pt-sub">・拖尾由半透明清除產生</span>`,
      ];
      let mode = 0, fire = null, bridge = null;
      ctx.group(["火焰", "雪花", "煙霧", "星塵拖尾"], 0, (i) => { mode = i; build(); });
      const W = world(ctx, host, { onSize: () => build() });
      const { proton } = W;
      const { pt } = pointer(ctx, host, {
        path: (t) => (mode === 0
          ? [0.5 + 0.035 * Math.sin(1.3 * t), 0.74]
          : [0.5 + 0.3 * Math.sin(0.7 * t), 0.48 + 0.22 * Math.sin(1.1 * t)]),
        tapEvery: 1800,
        onTap: (x, y) => burst(proton, x, y),
        // FollowEmitter only listens for "mousemove" and reads layerX/layerY, so feed it local coordinates.
        onMove: (x, y) => { if (bridge) bridge.dispatchEvent(Object.assign(new Event("mousemove"), { layerX: x, layerY: y })); },
      });
      proton.addEventListener(Proton.PROTON_UPDATE, () => {
        if (fire) { fire.p.x += (pt.x - fire.p.x) * 0.15; fire.p.y += (pt.y - fire.p.y) * 0.15; }
      });
      function build() {
        proton.destroyAllEmitters();
        fire = null; bridge = null;
        const w = W.view.w, hh = W.view.h;
        host.className = "pt-stage " + BG[mode];
        W.view.blend = mode === 0 || mode === 3 ? "lighter" : "source-over";
        W.view.trail = mode === 3 ? 0.18 : 0;
        chip.innerHTML = CHIPS[mode];
        if (mode === 0) {
          fire = make(proton, R(S(5, 7), 0.035),
            [new Mass(1), new Body(FLAME), new Life(0.8, 1.6), new Velocity(S(1.8, 3.4), S(0, 12, true), "polar")],
            [new Alpha(0.7, 0), new Scale(S(0.7, 1.05), 0.08), new RandomDrift(12, 0, 0.04)], pt.x, pt.y);
          fire.emit();
        } else if (mode === 1) {
          const e = make(proton, R(S(2, 4), 0.05),
            [new Position(new RectZone(0, -30, w, 20)), new Mass(1), new Radius(1.2, 4.2), new Life(30),
              new Velocity(S(0.6, 1.6), S(180, 12, true), "polar")],
            [new RandomDrift(14, 2, 0.15), new Repulsion(pt, 6, 110), new Color("#ffffff", ["#cfe8ff", "#ffffff"]),
              new Alpha(S(0.5, 1)), new CrossZone(new RectZone(-40, -60, w + 80, hh + 100), "dead")]);
          e.emit();
          pre(W, e, 14);
        } else if (mode === 2) {
          for (const fx of [0.3, 0.7]) {
            const e = make(proton, R(S(1, 2), 0.06),
              [new Mass(1), new Body(SMOKE), new Life(3, 5), new Velocity(S(0.6, 1.3), S(0, 22, true), "polar")],
              [new Alpha(S(0.25, 0.4), 0), new Scale(0.5, 3.4), new RandomDrift(18, 4, 0.1), new Repulsion(pt, 4, 140)],
              w * fx, hh + 10);
            e.emit();
            pre(W, e, 3);
          }
        } else {
          bridge = new EventTarget();
          make(proton, R(S(2, 4), 0.01),
            [new Radius(1.5, 4), new Life(0.8, 1.8), new Velocity(S(0.2, 1.2), S(0, 360), "polar")],
            [new Alpha(1, 0), new Scale(1, 0.2), new Color(["#f7df1e", "#ff8c42"], ["#4cc9f0", "#9d8cff"])],
            pt.x, pt.y, new FollowEmitter(bridge, 0.25)).emit();
        }
      }
      build();
      ctx.fps({ position: "right bottom", extra: () => ({ 粒子: proton.getCount() }) });
    },
  },
  {
    id: "forces", title: "力場行為",
    api: "Attraction・Repulsion・GravityWell・Cyclone・Force・Gravity",
    desc: "力場類行為每格改寫粒子的加速度。Attraction、Repulsion 只在半徑內作用，越靠近中心越強；GravityWell 依距離平方反比吸引；Cyclone 的加速度垂直於速度，讓粒子一直轉彎；Force、Gravity 是固定方向的常數力。切換時用 removeBehaviour、addBehaviour 直接替換畫面上現有粒子的行為，不重建發射器。",
    hint: "移動游標當作力場中心・切換五種力・拉動強度倍率",
    mount(ctx) {
      ctx.html(`<div class="pt-stage pt-bg-lab"><div class="pt-chip"></div></div>`);
      const host = ctx.$(".pt-stage"), chip = ctx.$(".pt-chip");
      let mode = 0, k = 1, cur = [];
      const wind = new Force(0, 0);
      ctx.group(["吸引", "排斥", "重力井", "旋流", "風與重力"], 0, (i) => { mode = i; apply(); });
      ctx.slider("強度倍率", { min: 0.2, max: 3, step: 0.1, value: 1, format: (v) => `×${v.toFixed(1)}` }, (v) => { k = v; apply(); });
      const born = new RectZone(0, 0, 1, 1), kill = new RectZone(-30, -30, 1, 1);
      const size = (w, hh) => { born.width = w; born.height = hh; kill.width = w + 60; kill.height = hh + 60; };
      const W = world(ctx, host, { onSize: size });
      const { proton, view } = W;
      size(view.w, view.h);
      const { pt } = pointer(ctx, host, { path: (t) => [0.5 + 0.26 * Math.sin(0.45 * t), 0.52 + 0.2 * Math.sin(0.7 * t)] });
      const em = make(proton, R(S(4, 6), 0.03),
        [new Position(born), new Life(3, 5), new Radius(1.5, 3.2), new Velocity(S(0.3, 0.8), S(0, 360), "polar")],
        [new Alpha(1, 0, Infinity, "easeInCubic"), new Color(PALETTE), new CrossZone(kill, "dead")]);
      function forces() {
        if (mode === 0) return [new Attraction(pt, 10 * k, 220)];
        if (mode === 1) return [new Repulsion(pt, 10 * k, 220)];
        if (mode === 2) return [new GravityWell(pt, 60000 * k)];
        if (mode === 3) return [new Cyclone("right", 2.5 * k), new Attraction(pt, 2 * k, 400)];
        return [wind, new Gravity(0.6 * k)];
      }
      function apply() {
        const next = forces();
        swap(em, cur, next);
        cur = next;
        // Cyclone bends each path into loops; a fading trail makes the curvature visible.
        W.view.trail = mode === 3 ? 0.2 : 0;
        const n = (x) => +(x * k).toFixed(2);
        chip.innerHTML = [
          `<code>Attraction(pt, ${n(10)}, 220)</code> 半徑內拉向游標<span class="pt-sub">・越靠近中心越強</span>`,
          `<code>Repulsion(pt, ${n(10)}, 220)</code> 半徑內推離游標<span class="pt-sub">・越靠近中心越強</span>`,
          `<code>GravityWell(pt, ${n(60000)})</code> 依距離平方反比吸引<span class="pt-sub">・掠過中心的粒子被甩出去</span>`,
          `<code>Cyclone("right", ${n(2.5)})</code> 加速度垂直於速度，粒子不斷右轉<span class="pt-sub">・軌跡彎成小圈・再加 Attraction(pt, ${n(2)}, 400) 拉向游標</span>`,
          `<code>Force(fx, 0)</code>＋<code>Gravity(${n(0.6)})</code> 固定方向的常數力<span class="pt-sub">・游標水平位置即時改寫 fx（風向與風力）</span>`,
        ][mode];
      }
      proton.addEventListener(Proton.PROTON_UPDATE, () => {
        if (mode === 4) wind.force.x = (pt.x / view.w - 0.5) * 400 * k;
      });
      em.emit();
      apply();
      pre(W, em, 2);
      W.over((g) => {
        const x = pt.x, y = pt.y;
        g.save();
        if (mode <= 1) {
          g.setLineDash([4, 6]);
          g.strokeStyle = mode ? "rgba(247,37,133,.55)" : "rgba(76,201,240,.55)";
          g.lineWidth = 1.2;
          g.beginPath(); g.arc(x, y, 220, 0, Math.PI * 2); g.stroke();
        } else if (mode === 2) {
          const gr = g.createRadialGradient(x, y, 0, x, y, 70);
          gr.addColorStop(0, "rgba(255,255,255,.9)");
          gr.addColorStop(0.15, "rgba(157,140,255,.45)");
          gr.addColorStop(1, "rgba(157,140,255,0)");
          g.fillStyle = gr;
          g.beginPath(); g.arc(x, y, 70, 0, Math.PI * 2); g.fill();
        } else if (mode === 4) { // mode 3 draws no overlay: it would smear on the trail canvas
          g.setLineDash([3, 6]); g.strokeStyle = "rgba(236,235,230,.25)"; g.lineWidth = 1;
          g.beginPath(); g.moveTo(view.w / 2, 0); g.lineTo(view.w / 2, view.h); g.stroke();
          g.setLineDash([]);
          const L = Math.max(-160, Math.min(160, wind.force.x * 0.4)), s = Math.sign(L) || 1;

    mount(ctx) {
      const EVENTS = [
        ["PARTICLE_CREATED", "粒子建立"], ["PARTICLE_DEAD", "粒子死亡"], ["EMITTER_ADDED", "發射器加入"],
        ["EMITTER_REMOVED", "發射器移除"], ["PROTON_UPDATE", "每格更新"],
      ];
      const rows = EVENTS.map(([k, label]) => `<div class="pt-row"><span><code>${k}</code> ${label}</span><b data-k="${k}">0</b></div>`).join("");
      ctx.html(`<div class="pt-stage pt-bg-night"><div class="pt-log"><div class="pt-head">每秒事件數</div>${rows}
        <div class="pt-row"><span>目前粒子</span><b data-k="count">0</b></div>
        <div class="pt-row"><span>發射器</span><b data-k="emitters">0</b></div></div></div>`);
      const host = ctx.$(".pt-stage");
      let auto = true, shot = 0;
      const W = world(ctx, host, { trail: 0.22, blend: "lighter" });
      const { proton, view } = W;
      const counts = {};
      for (const [k] of EVENTS) {
        counts[k] = 0;
        proton.addEventListener(k, () => { counts[k]++; });
      }
      // Trail particles are not bound to the rocket (bindEmitter = false), so place them by hand.
      proton.addEventListener(Proton.PARTICLE_CREATED, (p) => {
        if (p.parent && p.parent.rocket) p.p.copy(p.parent.p);
      });
      const KINDS = ["ring", "sphere", "willow"];
      const PAIRS = [["#f7df1e", "#ff8c42"], ["#4cc9f0", "#9d8cff"], ["#f72585", "#ffd27a"], ["#7bd389", "#4cc9f0"]];
      function explode(x, y) {
        const kind = KINDS[shot % 3], pair = PAIRS[shot % 4], willow = kind === "willow";
        shot++;
        const behs = [new Alpha(1, 0, Infinity, "easeInQuad"), new Color(pair[0], pair[1]), new Gravity(willow ? 1.4 : 0.8)];
        if (willow) behs.push(new Scale(1, 0.3));
        const e = make(proton, R(kind === "ring" ? 70 : S(90, 130), 0.1),
          [new Life(willow ? 1.6 : 1.1, willow ? 2.1 : 1.7), new Radius(willow ? 1.2 : 1.6, willow ? 2 : 2.6),
            new Velocity(kind === "ring" ? 2.6 : S(0.6, 3), S(0, 360), "polar")],
          behs, x, y);
        e.damping = willow ? 0.035 : 0.02;
        e.emit("once", 2.2);
      }
      function launch(x) {
        const hh = view.h, G0 = 600;
        const r = new BehaviourEmitter();
        r.rocket = true; r.damping = 0; r.bindEmitter = false;
        make(proton, R(S(2, 3), 0.016),
          [new Life(0.35, 0.7), new Radius(1, 2), new Velocity(S(0.2, 0.6), S(180, 25, true), "polar")],
          [new Alpha(1, 0), new Color("#ffd27a", "#ff6a2a")], x, hh + 4, r);
        const apex = hh * (0.18 + Math.random() * 0.22);
        r.v.x = (Math.random() - 0.5) * 60;
        r.v.y = -Math.sqrt(2 * G0 * (hh + 4 - apex));
        r.addSelfBehaviour(new Gravity(G0 / 100));
        r.emit(); // a BehaviourEmitter given a life throws on destroy, so it is removed by hand below
      }
      // Emitters are stopped or destroyed only after the update loop has finished.
      proton.addEventListener(Proton.PROTON_UPDATE_AFTER, () => {
        for (const e of proton.emitters.slice()) {
          if (e.rocket && !e.boomed && e.v.y >= 0) { e.boomed = true; e.stop(); explode(e.p.x, e.p.y); }
          else if (e.boomed && !e.gone && !e.particles.length) { e.gone = true; e.destroy(); }
        }
      });
      ctx.on(host, "pointerdown", (e) => {
        const r = host.getBoundingClientRect();
        explode(e.clientX - r.left, e.clientY - r.top);
      });
      ctx.button("齊放", () => { for (let i = 0; i < 5; i++) launch(view.w * (0.15 + (0.7 * i) / 4)); }, { primary: true });
      ctx.toggle("自動發射", true, (v) => { auto = v; });
      ctx.select("proton.fps", [{ value: "auto", label: "auto" }, { value: "30", label: "30" }, { value: "12", label: "12" }], "auto",
        (v) => { proton.fps = v === "auto" ? "auto" : +v; });
      launch(view.w * 0.35);
      launch(view.w * 0.65);
      ctx.interval(() => { if (auto) launch(view.w * (0.15 + Math.random() * 0.7)); }, 900);
      const out = {};
      ctx.$$(".pt-log b").forEach((b) => { out[b.dataset.k] = b; });
      ctx.interval(() => {
        for (const [k] of EVENTS) { out[k].textContent = counts[k] * 2; counts[k] = 0; }
        out.count.textContent = proton.getCount();
        out.emitters.textContent = proton.emitters.length;
      }, 500);
      ctx.fps({ position: "right bottom" });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "CanvasRenderer・WebGLRenderer・PixelRenderer・DomRenderer・proton.pool",
    desc: "同一組初始器與行為，逐級建立粒子並量測 FPS；可以切換四種內建渲染器比較繪製成本。粒子用 createParticle 直接建立、壽命無限，超過目標數量時標記 dead 交回物件池。",
    hint: "按「自動加壓」・切換渲染器再測一次",
    mount(ctx) {
      ctx.html(`<div class="pt-stage pt-bg-lab"><div class="pt-box"></div></div>`);
      ctx.controls.classList.add("bottom");
      const host = ctx.$(".pt-box");
      // A slow frame (> 0.5 s) is normally treated as a tab switch and skipped, which would blank the canvas.
      const amend = Proton.amendChangeTabsBug;
      Proton.amendChangeTabsBug = false;
      ctx.onCleanup(() => { Proton.amendChangeTabsBug = amend; });
      const loseGL = (gl) => { const x = gl && gl.getExtension("WEBGL_lose_context"); if (x) x.loseContext(); };
      // WebGLRenderer asks for "experimental-webgl" and calls alert() when it is missing; probe first.
      const hasGL = (() => {
        const gl = document.createElement("canvas").getContext("experimental-webgl");
        loseGL(gl);
        return !!gl;
      })();
      const LABEL = { canvas: "Canvas 2D", webgl: "WebGL", pixel: "Pixel（ImageData）", dom: "DOM" };
      const SHORT = { canvas: "Canvas", webgl: "WebGL", pixel: "Pixel", dom: "DOM" };
      const sel = ctx.select("渲染器", [
        { value: "canvas", label: LABEL.canvas },
        { value: "webgl", label: hasGL ? LABEL.webgl : "WebGL（不支援）" },
        { value: "pixel", label: LABEL.pixel },
        { value: "dom", label: LABEL.dom },
      ], "canvas", (v) => { kind = v; build(); });
      if (!hasGL) sel.options[1].disabled = true;
      const DOM_CAP = 8000;
      const box = new RectZone(0, 0, 1, 1);
      let kind = "canvas", sim = null, want = 500, gen = 0, fillTok = 0;

      function dispose() {
        if (!sim) return;
        const s = sim;
        sim = null;
        s.ro.disconnect();
        if (s.probe) s.probe.dead = true;
        const gl = s.kind === "webgl" ? s.renderer.gl : null;
        s.proton.destroy();
        s.el.remove();
        loseGL(gl);
      }
      ctx.onCleanup(dispose);

      async function build() {
        const my = ++gen, k = kind;
        dispose();
        const w = host.clientWidth, hh = host.clientHeight;
        box.x = 0; box.y = 0; box.width = w; box.height = hh;
        let el;
        if (k === "dom") {
          el = h("div", { class: "pt-dom" });
        } else {
          el = document.createElement("canvas");
          el.width = w; el.height = hh;
          el.style.width = w + "px"; el.style.height = hh + "px";
        }
        host.append(el);
        const proton = new Proton();
        let renderer;
        if (k === "pixel") {
          el.getContext("2d", { willReadFrequently: true });
          renderer = new Proton.PixelRenderer(el, new Rectangle(0, 0, w, hh));
        } else if (k === "webgl") {
          renderer = new Proton.WebGLRenderer(el);
          renderer.setMaxRadius(2); // the texture is drawn at its own size, so keep the sprite small
          renderer.blendFunc("SRC_ALPHA", "ONE");
          const gl = renderer.gl;
          renderer.onProtonUpdate = function () { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); };
        } else if (k === "dom") {
          renderer = new Proton.DomRenderer(el);
        } else {
          renderer = new Proton.CanvasRenderer(el);
        }
        proton.addRenderer(renderer);
        const em = new Emitter();
        em.damping = 0;
        make(proton, null, [new Position(box), new Radius(1.5, 2.5), new Velocity(S(0.4, 1.4), S(0, 360), "polar")],
          [new Color(PALETTE), new CrossZone(box, "bound")], 0, 0, em);
        const ro = new ResizeObserver(() => {
          const nw = host.clientWidth, nh = host.clientHeight;
          if (!nw || !nh || (nw === box.width && nh === box.height)) return;
          box.width = nw; box.height = nh;
          if (k === "dom") return;
          renderer.resize(nw, nh);
          el.style.width = nw + "px"; el.style.height = nh + "px";
          if (k === "pixel") renderer.createImageData(new Rectangle(0, 0, nw, nh));
        });
        ro.observe(host);
        const s = { proton, renderer, el, kind: k, em, ro, probe: null };
        sim = s;
        if (k === "webgl") {
          // Load the shared circle sprite once; until it is cached every new particle starts its own image load.
          s.probe = { data: {}, radius: 1, dead: false, body: null };
          renderer.onParticleCreated(s.probe);
        }
        return fill(want);
      }

      async function fill(n) {
        want = n;
        const tok = ++fillTok, s = sim;
        if (!s) return;
        const live = () => tok === fillTok && ctx.active && sim === s;
        while (s.probe && !s.probe.data.textureLoaded) {
          await ctx.frame();
          if (!live()) return;
        }
        const target = s.kind === "dom" ? Math.min(n, DOM_CAP) : n;
        const list = s.em.particles;
        let alive = 0;
        for (const p of list) if (!p.dead) alive++;
        if (alive > target) {
          let extra = alive - target;
          for (let i = list.length - 1; i >= 0 && extra > 0; i--) if (!list[i].dead) { list[i].dead = true; extra--; }
          return;
        }
        const chunk = s.kind === "canvas" || s.kind === "pixel" ? 4000 : 1000;
        let left = target - alive;
        while (left > 0) {
          const m = Math.min(chunk, left);
          for (let i = 0; i < m; i++) s.em.createParticle();
          left -= m;
          if (left > 0) {
            await ctx.frame();
            if (!live()) return;
          }
        }
      }

      ctx.raf(() => { if (sim) sim.proton.update(); });
      build();
      ctx.ramp({
        label: "粒子", unit: "顆", steps: [500, 1000, 2000, 4000, 8000, 16000, 32000, 64000, 128000], minFps: 30,
        apply(n) { return fill(n); },
        metrics: () => {
          const s = sim;
          if (!s) return { 實際粒子: 0 };
          return {
            實際粒子: s.em.particles.length,
            渲染器: SHORT[s.kind],
            物件池已建: s.proton.pool.total,
          };
        },
        note: "每格對每顆粒子跑行為（Color、CrossZone）與尤拉積分，再交給渲染器：Canvas 2D 每顆畫一個 arc，Pixel 只寫一個像素到 ImageData（每格 getImageData 加 putImageData），WebGL 每顆粒子建立時各上傳一次紋理且每格每顆一個 draw call，DOM 每顆一個 div 並改寫 transform，超過 8000 顆不再增加。切換渲染器會重建整個 Proton 實例。無頭瀏覽器是軟體繪圖，實機通常高出數倍。",
      });
    },
  },
] });
</script>
</body>
</html>
