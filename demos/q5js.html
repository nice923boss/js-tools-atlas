<script src="https://cdn.jsdelivr.net/npm/q5@4.8.3/q5.js"></script>
<script src="https://cdn.jsdelivr.net/gh/q5js/q5.js@4.7.0/src/q5-noisier.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// q5.js showcase: every scene is an instance-mode sketch (new Q5(fn, host, renderer)) so scenes never leak globals.
const PAL = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
// Same palette as 0..1 floats for colorMode(RGB, 1) and the WebGPU renderer.
const PAL_F = PAL.map((h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255));
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
const PHOTO = (n) => `_shared/img/photo-${n}.jpg`;
const DPR = () => Math.min(2, window.devicePixelRatio || 1);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
// Y just below the top-right control cluster.
const belowControls = (ctx) => (ctx.controls.childElementCount ? ctx.controls.offsetHeight + 20 : 12);

const hostBox = (ctx) => {
  const box = Showcase.h("div", { class: "q5-host" });
  ctx.el.prepend(box);
  return box;
};

// Mount an instance-mode sketch. q5 adds window listeners (input, resize, error reporting) and pushes the
// instance into Q5.instances without ever undoing that in remove(), so both are recorded here and released on cleanup.
function q5Sketch(ctx, def, box, renderer = "c2d") {
  const added = [];
  const own = Object.prototype.hasOwnProperty.call(window, "addEventListener");
  const orig = window.addEventListener;
  window.addEventListener = function (type, fn, opts) {
    added.push([type, fn, opts]);
    return orig.call(window, type, fn, opts);
  };
  let q;
  try {
    q = new Q5(def, box, renderer);
  } finally {
    if (own) window.addEventListener = orig;
    else delete window.addEventListener;
  }
  let gone = false;
  const destroy = () => {
    if (gone) return;
    gone = true;
    q._fitRO?.disconnect();
    try {
      Promise.resolve(q.remove()).catch((e) => console.warn("q5 remove()", e));
    } catch (e) {
      console.warn("q5 remove()", e);
    }
    q._ro?.disconnect();
    for (const [t, f, o] of added) window.removeEventListener(t, f, o);
    const i = Q5.instances.indexOf(q);
    if (i >= 0) Q5.instances.splice(i, 1);
  };
  ctx.onCleanup(destroy);
  return { q, destroy };
}

// createCanvas sized to `box` (or a custom size function) and kept in sync with the box's own size.
function fit(s, box, { size, pd = DPR(), onResize } = {}) {
  const dims = size || (() => [Math.max(1, box.clientWidth), Math.max(1, box.clientHeight)]);
  s.createCanvas(...dims());
  if (pd) s.pixelDensity(pd);
  let pending = 0;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      if (s._removed) return;
      const [w, h] = dims();
      if (w === s.width && h === s.height) return;
      s.resizeCanvas(w, h);
      onResize?.(w, h);
    });
  });
  ro.observe(box);
  s._fitRO = { disconnect() { ro.disconnect(); cancelAnimationFrame(pending); } };
}

// Bottom-right HTML caption, refreshed at most four times a second.
function htmlTag(ctx) {
  const el = Showcase.h("div", { class: "q5-tag" });
  ctx.el.append(el);
  let last = "", at = 0;
  return (html, force) => {
    const now = performance.now();
    if (html === last || (!force && now - at < 250)) return;
    last = html;
    at = now;
    el.innerHTML = html;
  };
}

// True while the pointer has moved over the canvas in the last 2.5 s; otherwise scenes animate on their own.
function pointerLive(s) {
  let last = -1e9;
  s.mouseMoved = s.mouseDragged = () => {
    const x = s._webgpu ? s.mouseX + s.halfWidth : s.mouseX;
    const y = s._webgpu ? s.mouseY + s.halfHeight : s.mouseY;
    if (x >= 0 && y >= 0 && x <= s.width && y <= s.height) last = performance.now();
  };
  return () => performance.now() - last < 2500;
}

const smooth = (prev, v) => prev + (v - prev) * 0.1;
const fmtMs = (v) => v.toFixed(1);

// WGSL sources for the shader scene. q5 splices them into its default pipelines:
// a block with only @vertex replaces vertexMain, a block with only @fragment replaces fragMain.
const WGSL = [
  `@vertex
fn vertexMain(v: VertexParams) -> FragParams {
  // pointer in canvas pixels (origin at the centre, y down)
  let m = vec2f(q.mouseX, q.mouseY);
  let d = distance(v.pos, m);
  let t = q.time * 0.001;
  // ring wave travelling outward, fading with distance
  let w = sin(d * 0.045 - t * 4.0) * exp(-d * 0.0035);
  let dir = (v.pos - m) / max(d, 1.0);

  var f: FragParams;
  f.position = transformVertex(v.pos + dir * w * 16.0, v.matrixIndex);
  let c = colors[i32(v.colorIndex)];
  f.color = vec4f(c.rgb * (0.7 + 0.3 * w) + vec3f(0.3 * max(w, 0.0)), c.a);
  return f;
}`,
  `@fragment
fn fragMain(f: FragParams) -> @location(0) vec4f {
  let t = q.time * 0.001;
  // pointer in framebuffer pixels, the same space as f.position
  let m = (vec2f(q.mouseX, q.mouseY) + vec2f(q.halfWidth, q.halfHeight)) * q.pixelDensity;
  let d = distance(f.position.xy, m) / q.pixelDensity;
  let lens = 1.0 - smoothstep(0.0, 200.0, d);
  let dir = (f.position.xy - m) / max(d * q.pixelDensity, 1.0);
  let wave = vec2f(sin(f.texCoord.y * 22.0 + t * 1.8), cos(f.texCoord.x * 18.0 + t * 1.4));
  let uv = f.texCoord + wave * 0.004 - dir * lens * lens * 0.05;

  // chromatic aberration grows inside the lens
  let s = vec2f(0.002 + 0.012 * lens, 0.0);
  let r = textureSample(tex, samp, uv + s).r;
  let g = textureSample(tex, samp, uv).g;
  let b = textureSample(tex, samp, uv - s).b;
  return vec4f(r, g, b, f.imageAlpha);
}`,
  `@fragment
fn fragMain(f: FragParams) -> @location(0) vec4f {
  let t = q.time * 0.001;
  // barrel distortion around the screen centre
  var uv = f.texCoord - 0.5;
  uv *= 1.0 + dot(uv, uv) * 0.22;
  uv += 0.5;

  let s = vec2f(0.0015 + 0.001 * sin(t * 1.7), 0.0);
  let col = vec3f(
    textureSample(tex, samp, uv + s).r,
    textureSample(tex, samp, uv).g,
    textureSample(tex, samp, uv - s).b
  );
  // scanlines every 3 CSS pixels plus a soft RGB aperture mask
  let scan = 0.75 + 0.25 * sin(f.position.y / q.pixelDensity * 2.094);
  let mask = 0.92 + 0.08 * sin(f.position.x * 2.094);
  let e = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
  let edge = smoothstep(0.0, 0.015, e);
  let vig = 1.0 - dot(f.texCoord - 0.5, f.texCoord - 0.5) * 1.2;
  let flicker = 0.97 + 0.03 * sin(t * 47.0);
  return vec4f(col * scan * mask * vig * edge * flicker * 1.2, 1.0);
}`,
];

// Minimal WGSL highlighter for the read-only source panel.
function wgslHtml(src) {
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return src.split("\n").map((line) => {
    const k = line.indexOf("//");
    const code = k >= 0 ? line.slice(0, k) : line;
    const note = k >= 0 ? line.slice(k) : "";
    const body = esc(code)
      .replace(/\b(fn|let|var|return|struct)\b/g, '<span class="kw">$1</span>')
      .replace(/(@\w+)/g, '<span class="at">$1</span>')
      .replace(/\bq\.(\w+)/g, '<span class="u">q.$1</span>');
    return body + (note ? `<span class="cm">${esc(note)}</span>` : "");
  }).join("\n");
}

Showcase.run({ scenes: [
  {
    id: "galaxy", title: "旋臂星系",
    api: "new Q5(sketch, host) + blendMode(ADD) + 依顏色分批 fill() / rect()",
    desc: "原版示範改成實例模式：三條旋臂、一萬顆星，每顆星依半徑做差速旋轉（越內圈轉越快），ADD 混色讓密集處自然發亮，殘影靠每幀疊一層半透明底色。星星先依顏色分組，每幀只切換 6 次 fill()。",
    hint: "滑鼠上下調傾角、左右調轉速・點擊重新生成・閒置時自動擺動",
    mount(ctx) {
      const COLORS = ["#fff7d6", "#f7df1e", "#ff8c42", "#f72585", "#9d8cff", "#4cc9f0"];
      const FILLS = COLORS.map((h, k) => {
        const [r, g, b] = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
        return `rgba(${r},${g},${b},${k ? 0.59 : 0.78})`;
      });
      const COUNTS = [5000, 10000, 30000];
      let N = COUNTS[1], R, A, Z, S, buckets = [], born = 0, tilt = 0.55, spin = 0, rot = 0, ms = 0, sk = null;
      const box = hostBox(ctx), say = htmlTag(ctx);

      function make(s) {
        R = new Float32Array(N); A = new Float32Array(N); Z = new Float32Array(N); S = new Float32Array(N);
        const lists = COLORS.map(() => []);
        for (let i = 0; i < N; i++) {
          const t = Math.pow(s.random(), 1.6), r = t + 0.02, arm = i % 3;
          R[i] = r;
          A[i] = (arm / 3) * s.TAU + r * 7.5 + s.randomGaussian(0, 1) * (0.12 + 0.35 * (1 - t));
          Z[i] = s.randomGaussian(0, 1) * 0.04 * (1 - t);
          S[i] = s.random() < 0.02 ? 2.6 : s.random(0.8, 1.8);
          let c = clamp(Math.floor(r * 5.99 + s.random(-0.8, 0.8)), 0, 5);
          if (s.random() < 0.04) c = 3;
          lists[c].push(i);
        }
        buckets = lists.map((l) => Uint32Array.from(l));
        born = s.millis();
      }

      ctx.group(["5 千", "1 萬", "3 萬"], 1, (i) => { N = COUNTS[i]; if (sk) make(sk); });
      ctx.button("重新生成", () => { if (sk) make(sk); });

      q5Sketch(ctx, (s) => {
        const live = pointerLive(s);
        s.setup = () => {
          fit(s, box);
          s.noStroke();
          sk = s;
          make(s);
        };
        s.mousePressed = (e) => { if (e?.target === s.canvas) make(s); };
        s.draw = () => {
          const t0 = performance.now();
          const W = s.width, H = s.height, cx = W / 2, cy = H / 2, RR = Math.min(W, H) * 0.46;
          let tiltT, spinT;
          if (live()) {
            tiltT = 0.18 + 0.77 * clamp(s.mouseY / H, 0, 1);
            spinT = -0.8 + 1.6 * clamp(s.mouseX / W, 0, 1);
          } else {
            const k = performance.now() / 4000;
            tiltT = 0.55 + 0.3 * Math.sin(k * 1.3);
            spinT = 0.5 * Math.sin(k);
          }
          tilt += (tiltT - tilt) * 0.05;
          spin += (spinT - spin) * 0.05;
          rot += spin * Math.min(s.deltaTime, 50) * 0.001;

          s.blendMode(s.BLEND);
          s.fill("rgba(7,8,14,0.27)");
          s.rect(0, 0, W, H);
          const g = Math.min(1, (s.millis() - born) / 1400), grow = 1 - (1 - g) ** 3;
          const time = s.millis() * 0.00012;
          s.blendMode(s.ADD);
          for (let c = 0; c < 6; c++) {
            s.fill(FILLS[c]);
            const b = buckets[c];
            for (let j = 0; j < b.length; j++) {
              const i = b[j], r = R[i], rr = r * RR * grow, a = A[i] + time / (r + 0.15) + rot;
              s.rect(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * tilt + Z[i] * RR, S[i], S[i]);
            }
          }
          s.fill("rgba(255,210,120,0.04)");
          for (let i = 1; i <= 6; i++) s.ellipse(cx, cy, RR * 0.09 * i, RR * 0.09 * i * (0.4 + tilt * 0.6));
          s.blendMode(s.BLEND);
          ms = smooth(ms, performance.now() - t0);
          say(`<b>${N.toLocaleString()}</b> 顆星・傾角 ${tilt.toFixed(2)}・draw() ${fmtMs(ms)} ms`);
        };
      }, box);
    },
  },
  {
    id: "webgpu", title: "WebGPU 渲染器",
    api: "Q5.initWebGPU() + new Q5(sketch, host, \"webgpu\") + pushMatrix() / rotate() / rect(x, y, w, h, r)",
    desc: "同一份 sketch 交給 WebGPU 渲染器：每個 rect() 的位置、圓角、顏色與變換矩陣都寫進 GPU 緩衝區，整幀一次送出。WebGPU 模式原點在畫布中心、顏色預設 0 到 1；瀏覽器不支援時用 webgpu-fallback 退回 Canvas 2D，座標系與色彩格式保持一致，程式不必改。",
    hint: "移動滑鼠改變波源・切換方塊數量看 draw() 耗時",
    mount(ctx) {
      const box = hostBox(ctx), say = htmlTag(ctx);
      const COUNTS = [2500, 10000, 40000];
      Q5.initWebGPU().then((ok) => {
        if (!ctx.active) return;
        let n = COUNTS[ok ? 1 : 0], ms = 0, cols = 1, rows = 1, cell = 1, ox = 0, oy = 0;
        const layout = (W, H) => {
          cell = Math.sqrt((W * H) / n);
          cols = Math.ceil(W / cell);
          rows = Math.ceil(H / cell);
          ox = (-cols * cell) / 2 + cell / 2;
          oy = (-rows * cell) / 2 + cell / 2;
        };
        let sk = null;
        ctx.group(["2,500", "1 萬", "4 萬"], ok ? 1 : 0, (i) => { n = COUNTS[i]; if (sk) layout(sk.width, sk.height); });
        q5Sketch(ctx, (s) => {
          const live = pointerLive(s);
          s.setup = () => {
            fit(s, box, { onResize: layout });
            s.colorMode(s.RGB, 1);
            s.rectMode(s.CENTER);
            s.noStroke();
            layout(s.width, s.height);
            sk = s;
          };
          s.draw = () => {
            const t0 = performance.now(), t = s.millis() / 1000, W = s.width, H = s.height;
            let fx = s.mouseX, fy = s.mouseY;
            if (!live()) { fx = Math.sin(t * 0.45) * W * 0.3; fy = Math.sin(t * 0.7) * H * 0.28; }
            s.background(0.04, 0.05, 0.07);
            for (let j = 0; j < rows; j++) {
              const y = oy + j * cell;
              for (let i = 0; i < cols; i++) {
                const x = ox + i * cell, d = Math.hypot(x - fx, y - fy);
                const k = 0.5 + 0.5 * Math.sin(d * 0.025 - t * 3);
                let hp = (d * 0.004 - t * 0.25) % 6;
                if (hp < 0) hp += 6;
                const h0 = hp | 0, f = hp - h0, a = PAL_F[h0], b = PAL_F[(h0 + 1) % 6], br = 0.45 + 0.55 * k;
                s.fill((a[0] + (b[0] - a[0]) * f) * br, (a[1] + (b[1] - a[1]) * f) * br, (a[2] + (b[2] - a[2]) * f) * br);
                const sz = cell * (0.3 + 0.55 * k);
                s.pushMatrix();
                s.translate(x, y);
                s.rotate((k * Math.PI) / 2);
                s.rect(0, 0, sz, sz, sz * 0.22);
                s.popMatrix();
              }
            }
            ms = smooth(ms, performance.now() - t0);
            const who = s._webgpuFallback ? "<b>Canvas 2D</b>（無 WebGPU，已退回）" : "<b>WebGPU</b>";
            say(`${who}・${(rows * cols).toLocaleString()} 個圓角方塊・draw() ${fmtMs(ms)} ms`);
          };
        }, box, ok ? "webgpu" : "webgpu-fallback");
      });
    },
  },
  {
    id: "wgsl", title: "WGSL 著色器",
    api: "createShader() 頂點 + createImageShader() 片段 + createFrameShader() 後製 + shader() / resetShaders()",
    desc: "q5 的 WebGPU 渲染器只要寫一段 WGSL 的 vertexMain 或 fragMain，就能替換預設管線：createShader 改圖形頂點、createImageShader 改圖片取樣、createFrameShader 對整個畫面做後製。滑鼠座標、時間、畫布尺寸等 uniform 由 q5 每幀自動送進著色器（q.mouseX、q.time）。",
    hint: "移動滑鼠控制波紋、透鏡與消失點・切換三種著色器",
    mount(ctx) {
      const box = hostBox(ctx), say = htmlTag(ctx);
      const MODES = ["頂點波紋", "影像折射", "CRT 後製"];
      const TAGS = [
        "<b>createShader()</b> 改寫頂點：每個頂點依離滑鼠的距離位移",
        "<b>createImageShader()</b> 改寫片段：透鏡折射＋色差",
        "<b>createFrameShader()</b> 整個畫面後製：曲面、掃描線、色差",
      ];
      let mode = 0;
      Q5.initWebGPU().then((ok) => {
        if (!ctx.active) return;
        if (!ok) {
          const pre = Showcase.h("pre", { class: "q5-code" });
          const show = () => { pre.innerHTML = wgslHtml(WGSL[mode]); };
          ctx.group(MODES, 0, (i) => { mode = i; show(); });
          const note = Showcase.h("div", { class: "q5-note" });
          note.innerHTML = "這個瀏覽器沒有可用的 <b>WebGPU</b>，WGSL 著色器只能在 q5 的 WebGPU 渲染器執行（Chrome／Edge 113 以上、Safari 26 以上）。下方是目前選取模式的著色器原始碼，換到支援的瀏覽器會即時執行。";
          ctx.el.append(Showcase.h("div", { class: "q5-nogpu" }, note, pre));
          show();
          return;
        }
        ctx.group(MODES, 0, (i) => { mode = i; say(TAGS[mode], true); });
        q5Sketch(ctx, (s) => {
          const live = pointerLive(s);
          let shapeSh, imgSh, frameSh, img = null, stars = [];
          s.setup = () => {
            fit(s, box);
            s.colorMode(s.RGB, 1);
            shapeSh = s.createShader(WGSL[0]);
            imgSh = s.createImageShader(WGSL[1]);
            frameSh = s.createFrameShader(WGSL[2]);
            s.loadImage(PHOTO(6), (im) => { img = im; });
            stars = Array.from({ length: 90 }, () => ({ u: s.random(), v: s.random(), z: s.random(1, 2.4), p: s.random(s.TAU) }));
            say(TAGS[mode], true);
          };
          s.draw = () => {
            const t = s.millis() / 1000, W = s.width, H = s.height, hw = W / 2, hh = H / 2;
            // Idle: steer the pointer uniform along a slow path so the shaders keep reacting.
            if (!live()) { s.mouseX = Math.sin(t * 0.5) * W * 0.3; s.mouseY = Math.cos(t * 0.37) * H * 0.25; }
            s.resetShaders();
            s.noStroke();
            s.background(0.04, 0.05, 0.07);
            if (mode === 0) {
              s.shader(shapeSh);
              const cols = clamp(Math.round(W / 28), 14, 48), cell = W / cols, rows = Math.ceil(H / cell) + 1;
              const y0 = (-rows * cell) / 2 + cell / 2;
              for (let j = 0; j < rows; j++) {

            s.text(`${b.name}　${b.code}`, x0, y + labelH / 2 - 2);
            s.fill("#9aa0a6");
            s.textAlign(s.RIGHT, s.CENTER);
            if (W > 420) s.text(`相對亮度 Y ${lo.toFixed(2)} ~ ${hi.toFixed(2)}`, x0 + cw, y + labelH / 2 - 2);
            s.fill("#0b0d10");
            s.stroke("#2a2f37");
            s.strokeWeight(1);
            s.rect(x0, py, cw, plotH, 4);
            s.noFill();
            s.stroke(k ? "#4cc9f0" : "#f7df1e");
            s.strokeWeight(1.6);
            s.beginShape();
            for (let i = 0; i < N; i++) s.vertex(x0 + ((i + 0.5) * cw) / N, py + plotH - 3 - Y[i] * (plotH - 6));
            s.endShape();
          });
          const mx = x0 + ((mi + 0.5) * cw) / N;
          s.stroke("rgba(255,255,255,0.85)");
          s.strokeWeight(1.5);
          s.line(mx, top + labelH - 3, mx, bottom - 2);
          s.noStroke();
          if (gray) s.filter(s.GRAY);
          const hue = Math.round((mi / N) * 360);
          say(`色相 <b>${hue}°</b>・HSL Y ${Ys[0][mi].toFixed(2)}・OKLCH Y ${Ys[1][mi].toFixed(2)}・${s.canvas.colorSpace || "srgb"}`);
        };
      }, box);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "circle() 逐一繪製：Canvas 2D vs. WebGPU 渲染器（同一份程式碼）",
    desc: "同一個向日葵螺旋星盤、同一份 draw() 程式碼，只換渲染器。Canvas 2D 每顆圓都是一次路徑填色；WebGPU 渲染器把所有圓的中心與半徑寫進緩衝區，整幀一次送給 GPU 畫。",
    hint: "按「自動加壓」開始・切換渲染器後再測一次比較",
    mount(ctx) {
      ctx.controls.classList.add("bottom");
      let mode = 0, n = 2000, ms = 0, cur = null, token = 0;
      const host = Showcase.h("div", { class: "stress-host" });
      ctx.el.append(host);

      function build(s) {
        s.setup = () => {
          fit(s, host);
          s.colorMode(s.RGB, 1);
          s.noStroke();
        };
        s.draw = () => {
          const t0 = performance.now(), W = s.width, H = s.height, R = Math.min(W, H) * 0.46, t = s.millis() / 1000;
          const d = clamp((R * 1.9) / Math.sqrt(n), 1.2, 10);
          // WebGPU (and its 2D fallback) put the origin at the centre.
          const ox = s._webgpu ? 0 : W / 2, oy = s._webgpu ? 0 : H / 2;
          s.background(0.043, 0.051, 0.063);
          for (let c = 0; c < 6; c++) {
            s.fill(PAL_F[c][0], PAL_F[c][1], PAL_F[c][2]);
            for (let i = c; i < n; i += 6) {
              const k = i / n, r = Math.sqrt(k) * R, a = i * 2.39996 + t * (1 - k);
              s.circle(ox + r * Math.cos(a), oy + r * Math.sin(a), d);
            }
          }
          ms = smooth(ms, performance.now() - t0);
        };
      }
      async function start() {
        const my = ++token;
        cur?.destroy();
        cur = null;
        host.textContent = "";
        ms = 0;
        let renderer = "c2d";
        if (mode === 1) renderer = (await Q5.initWebGPU()) ? "webgpu" : "webgpu-fallback";
        if (my !== token || !ctx.active) return;
        cur = q5Sketch(ctx, build, host, renderer);
      }
      const label = () => {
        if (!cur) return "載入中";
        if (cur.q._webgpuFallback) return "Canvas 2D（WebGPU 不可用，已退回）";
        return cur.q._webgpu ? "WebGPU" : "Canvas 2D";
      };
      ctx.group(["Canvas 2D", "WebGPU"], 0, (i) => { mode = i; start(); });
      start();
      ctx.ramp({
        label: "圓", unit: "個", minFps: 30,
        steps: [1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000],
        initial: 1,
        apply(v) { n = v; },
        metrics: () => ({ 渲染器: label(), "draw() 耗時": `${ms.toFixed(1)} ms` }),
        note: "Canvas 2D 的瓶頸在 JavaScript 迴圈加上每顆 circle() 各自一次路徑填色，draw() 耗時隨圓數線性上升；WebGPU 把圓批次寫進一個緩衝區，draw() 只量到 CPU 端組資料的時間，GPU 端成本反映在幀率上。無頭瀏覽器與部分裝置沒有 WebGPU，會自動退回 Canvas 2D。",
      });
    },
  },
] });
</script>
