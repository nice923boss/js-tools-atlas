<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>q5.js 示範：上萬顆星的旋臂星系</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .stats {
    position: fixed; left: 12px; top: 12px; z-index: 50;
    padding: 8px 12px; font-size: 12px; line-height: 1.5;
  }
  .stats b { color: var(--accent); font-family: var(--mono); font-size: 15px; }
</style>
</head>
<body>
<div class="panel stats">
  <div><b id="count">0</b> 顆星</div>
  <div class="muted"><span class="mono" id="fps">0</span> fps・Canvas 2D</div>
</div>
<div class="controls">
  <button class="btn" data-n="4000">4 千</button>
  <button class="btn" data-n="10000" aria-pressed="true">1 萬</button>
  <button class="btn" data-n="20000">2 萬</button>
</div>
<div class="hint">移動滑鼠改變視角・點擊讓星系重新誕生</div>

<script src="https://cdn.jsdelivr.net/npm/q5@4.8.3/q5.js"></script>
<script>
// Spiral galaxy: thousands of stars orbit with Keplerian-ish speed, drawn with additive blending.
// Stars are bucketed by colour so each frame only switches fill a few times (q5 keeps this fast).
const COLORS = ["#fff7d6", "#f7df1e", "#ff8c42", "#f72585", "#9d8cff", "#4cc9f0"];
let stars = [];
let total = 10000;
let tilt = 0.5, spin = 0, tiltTarget = 0.5, spinTarget = 0;
let born = 0;

function setup() {
  createCanvas(windowWidth, windowHeight);
  noStroke();
  makeGalaxy();
}

function makeGalaxy() {
  stars = [];
  const arms = 3;
  for (let i = 0; i < total; i++) {
    // Radius distribution: dense core, long tail
    const t = pow(random(), 1.6);
    const r = t * 1.0 + 0.02;
    const arm = i % arms;
    const twist = r * 7.5;
    const spread = randomGaussian(0, 1) * (0.12 + 0.35 * (1 - t));
    const a = (arm / arms) * TAU + twist + spread;
    // Colour by radius: warm core, cool outer arms, a few pink nebula stars
    let c = floor(map(r, 0, 1, 0, 5.99) + random(-0.8, 0.8));
    c = constrain(c, 0, 5);
    if (random() < 0.04) c = 3;
    stars.push({ r, a, z: randomGaussian(0, 1) * 0.04 * (1 - t), c, s: random() < 0.02 ? 2.6 : random(0.8, 1.8) });
  }
  born = millis();
  document.getElementById("count").textContent = total.toLocaleString("zh-TW");
}

function draw() {
  // Fade previous frame for soft motion trails
  blendMode(BLEND);
  fill(7, 8, 14, 70);
  rect(0, 0, width, height);

  tilt += (tiltTarget - tilt) * 0.05;
  spin += (spinTarget - spin) * 0.05;
  const R = min(width, height) * 0.46;
  const cx = width / 2, cy = height / 2;
  const grow = min(1, (millis() - born) / 1400);
  const ease = 1 - pow(1 - grow, 3);
  const time = millis() * 0.00012;

  blendMode(ADD);
  const buckets = COLORS.map(() => []);
  for (const st of stars) {
    // Inner stars orbit faster
    const ang = st.a + time / (st.r + 0.15) + spin;
    const rr = st.r * R * ease;
    const x = cos(ang) * rr;
    const y = sin(ang) * rr;
    buckets[st.c].push(cx + x, cy + y * tilt + st.z * R, st.s);
  }
  for (let k = 0; k < COLORS.length; k++) {
    const col = color(COLORS[k]);
    col.setAlpha(k === 0 ? 200 : 150);
    fill(col);
    const b = buckets[k];
    for (let i = 0; i < b.length; i += 3) rect(b[i], b[i + 1], b[i + 2], b[i + 2]);
  }

  // Core glow
  for (let i = 6; i > 0; i--) {
    fill(255, 210, 120, 10);
    ellipse(cx, cy, R * 0.09 * i, R * 0.09 * i * (0.4 + tilt * 0.6));
  }

  if (frameCount % 15 === 0) document.getElementById("fps").textContent = round(frameRate());
}

function mouseMoved() {
  tiltTarget = map(mouseY, 0, height, 0.18, 0.95, true);
  spinTarget = map(mouseX, 0, width, -0.8, 0.8, true);
}

function mousePressed(e) {
  if (e && e.target && e.target.tagName !== "CANVAS") return;
  makeGalaxy();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

document.querySelectorAll("[data-n]").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("[data-n]").forEach((b) => b.setAttribute("aria-pressed", b === btn));
    total = Number(btn.dataset.n);
    makeGalaxy();
  });
});
</script>
</body>
</html>
