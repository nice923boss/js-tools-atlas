<script>
// QR Code Styling showcase: presets, dot/corner types, gradients, canvas logo, error correction and capacity,
// UTF-8 pitfall, output formats with update(), and a timed bulk-render bench. Every code is read back with jsQR.
const { fmt, fmtMs, h } = Showcase;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const kb = (b) => (b >= 1024 ? `${(b / 1024).toFixed(1)} KB` : `${b} B`);
// qr-code-styling 1.9.2 feeds strings through qrcode-generator's default stringToBytes, which keeps only the
// low byte of each UTF-16 unit. Encoding to a UTF-8 "binary string" first keeps non-ASCII text intact.
const utf8 = (s) => unescape(encodeURIComponent(s));
const EC_PCT = { L: "7%", M: "15%", Q: "25%", H: "30%" };
const ECS = ["L", "M", "Q", "H"];
const versionOf = (q) => (q._qr.getModuleCount() - 17) / 4;

// Decode a rendered QR (PNG blob) with jsQR. White underlay keeps transparent corners from reading as black.
async function readBlob(blob) {
  const bmp = await createImageBitmap(blob);
  const c = document.createElement("canvas");
  c.width = bmp.width; c.height = bmp.height;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(bmp, 0, 0); bmp.close();
  return readCanvas(c);
}
function readCanvas(c) {
  const g = c.getContext("2d", { willReadFrequently: true });
  const im = g.getImageData(0, 0, c.width, c.height);
  const t0 = performance.now();
  const r = jsQR(im.data, im.width, im.height);
  const ms = performance.now() - t0;
  return r ? { text: r.data, bytes: Array.from(r.binaryData), version: r.version, ms } : { text: null, ms };
}
const readQR = async (q) => readBlob(await q.getRawData("png"));
function readPill(r, expect) {
  if (!r.text && !(r.bytes && r.bytes.length)) return `<span class="qs-pill bad">jsQR 讀不到</span>`;
  if (expect != null && r.text !== expect) return `<span class="qs-pill bad">jsQR 讀到但內容不同</span>`;
  return `<span class="qs-pill ok">jsQR 讀回一致 <b>${r.ms.toFixed(1)} ms</b>${r.at ? `（${r.at}px 複本）` : ""}</span>`;
}

// Logos are painted on an in-page canvas and handed to the library as a data URL
function logoCanvas(kind, px = 160) {
  const c = document.createElement("canvas");
  c.width = c.height = px;
  const g = c.getContext("2d");
  g.scale(px / 100, px / 100);
  if (kind === "js") {
    g.fillStyle = "#f7df1e"; g.beginPath(); g.roundRect(0, 0, 100, 100, 18); g.fill();
    g.fillStyle = "#1a1a14"; g.font = "700 44px Arial, Helvetica, sans-serif"; g.textAlign = "right"; g.fillText("JS", 86, 84);
  } else if (kind === "heart") {
    g.fillStyle = "#f72585"; g.fill(new Path2D("M50 88 12 50C-4 32 8 8 30 10c9 1 16 7 20 14 4-7 11-13 20-14 22-2 34 22 18 40Z"));
  } else if (kind === "star") {
    g.fillStyle = "#ff8c42"; g.fill(new Path2D("M50 6 63 37 96 38 70 59 79 92 50 73 21 92 30 59 4 38 37 37Z"));
  } else if (kind === "badge") {
    const gr = g.createLinearGradient(0, 0, 100, 100);
    gr.addColorStop(0, "#6a5ae0"); gr.addColorStop(1, "#d61f69");
    g.fillStyle = gr; g.beginPath(); g.arc(50, 50, 48, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 4; g.beginPath(); g.arc(50, 50, 39, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "#fff"; g.font = "700 30px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("圖鑑", 50, 52);
  }
  return c;
}
const LOGO_URLS = {};
const logoUrl = (kind) => (kind === "none" ? "" : (LOGO_URLS[kind] ||= logoCanvas(kind).toDataURL("image/png")));

// Readability is checked on a 300 px canvas twin, so the verdict reflects the design, not the on-screen size
async function readTwin(qr, px = 300) {
  const twin = new QRCodeStyling({ ...qr._options, width: px, height: px, type: "canvas" });
  if (qr._extension) twin.applyExtension(qr._extension);
  return { ...(await readQR(twin)), at: px };
}
// Largest square that fits inside the element's content box
function sideOf(el, max = 420, min = 48) {
  const cs = getComputedStyle(el);
  const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const hh = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  return Math.round(Math.max(min, Math.min(max, w, hh)));
}
// Redraw when this element (not just the scene) changes size; also fires once on mount
function watch(ctx, el, fn) {
  let raf = 0, lw = -1, lh = -1;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active || (el.clientWidth === lw && el.clientHeight === lh)) return;
      lw = el.clientWidth; lh = el.clientHeight;
      fn();
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}
// Best column count for n square cells with a text footer of `extra` px
function fitGrid(W, H, n, extra, gap = 8) {
  let best = { c: 1, s: 0 };
  for (let c = 1; c <= n; c++) {
    const r = Math.ceil(n / c);
    const s = Math.min((W - (c - 1) * gap) / c, (H - (r - 1) * gap) / r - extra);
    if (s > best.s) best = { c, s: Math.floor(s) };
  }
  return best;
}

const DOTS = { square: "方塊", dots: "圓點", rounded: "圓角", "extra-rounded": "大圓角", classy: "優雅", "classy-rounded": "優雅圓角" };
const CORNERS = { square: ["方形", "square", "square"], "extra-rounded": ["圓角", "extra-rounded", "square"], dot: ["圓形", "dot", "dot"] };
const LOGOS = { none: "無", js: "JS", heart: "愛心", star: "星星", badge: "圓章" };
const PRESETS = [
  { name: "霓虹", dot: "dots", corner: "extra-rounded", logo: "js", c1: "#3a0ca3", c2: "#f72585", bg: "#ffffff", grad: true, circle: false },
  { name: "經典", dot: "square", corner: "square", logo: "none", c1: "#111111", c2: "#111111", bg: "#ffffff", grad: false, circle: false },
  { name: "糖果", dot: "rounded", corner: "dot", logo: "heart", c1: "#ff8c42", c2: "#d61f69", bg: "#fff4ec", grad: true, circle: false },
  { name: "墨金", dot: "classy-rounded", corner: "extra-rounded", logo: "star", c1: "#e9c46a", c2: "#b5838d", bg: "#1b1b1f", grad: true, circle: true },
];
function luminance(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}

Showcase.run({ scenes: [
  // ---------- 1. styled QR ----------
  {
    id: "styled", title: "風格化 QR", paper: true,
    api: "new QRCodeStyling({ data, dotsOptions, cornersSquareOptions, image, … })",
    desc: "一個設定物件決定點的形狀、定位角、漸層、中央圖示與外框。改任何選項都用 qrCode.update() 即時重畫，右上角的 jsQR 會把畫好的 PNG 讀回來，確認還掃得出原本內容。",
    hint: "換一鍵風格、點形或顏色；深底淺點與低對比會出現警告",
    mount(ctx) {
      ctx.html(`<div class="qs-wrap qs-s1">
        <div class="qs-pane qs-form">
          <label class="qs-lab" for="qs-data">內容（網址或文字）</label>
          <input class="qs-field" id="qs-data" value="https://www.npmjs.com/package/qr-code-styling">
          <span class="qs-lab">一鍵風格</span><div class="qs-opts" data-k="preset"></div>
          <span class="qs-lab">點的形狀 dotsOptions.type</span><div class="qs-opts" data-k="dot"></div>
          <span class="qs-lab">定位角</span><div class="qs-opts" data-k="corner"></div>
          <span class="qs-lab">中央圖示（頁內 canvas 繪製）</span><div class="qs-opts" data-k="logo"></div>
          <span class="qs-lab">顏色</span>
          <div class="qs-colors"><label>主色<input type="color" data-c="c1"></label><label>漸層色<input type="color" data-c="c2"></label><label>背景<input type="color" data-c="bg"></label></div>
          <div class="qs-check"><label><input type="checkbox" data-b="grad"> 漸層</label><label><input type="checkbox" data-b="circle"> 圓形外框</label></div>
        </div>
        <div class="qs-stage"><div class="qs-pills"></div><div class="qs-card"><div class="qs-qr"></div><div class="qs-cap">掃我看示範</div></div></div>
      </div>`);
      const st = { ...PRESETS[0] };
      const box = ctx.$(".qs-qr"), stage = ctx.$(".qs-stage"), card = ctx.$(".qs-card"), pills = ctx.$(".qs-pills"), input = ctx.$("#qs-data");
      const opt = (k) => ctx.$(`.qs-opts[data-k="${k}"]`);
      const fill = (k, entries) => { opt(k).innerHTML = entries.map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join(""); };
      fill("dot", Object.entries(DOTS));
      fill("corner", Object.entries(CORNERS).map(([k, v]) => [k, v[0]]));
      fill("logo", Object.entries(LOGOS));
      opt("preset").innerHTML = PRESETS.map((p, i) => `<button type="button" data-v="${i}"><i style="background:linear-gradient(135deg,${p.c1},${p.c2});outline:2px solid ${p.bg}"></i>${p.name}</button>`).join("");
      const sync = () => {
        for (const k of ["dot", "corner", "logo"]) opt(k).querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === st[k]));
        opt("preset").querySelectorAll("button").forEach((b) => {
          const p = PRESETS[+b.dataset.v];
          b.setAttribute("aria-pressed", Object.keys(p).filter((k) => k !== "name").every((k) => p[k] === st[k]));
        });
        ctx.$$("[data-c]").forEach((i) => { i.value = st[i.dataset.c]; });
        ctx.$$("[data-b]").forEach((i) => { i.checked = st[i.dataset.b]; });
        ctx.$('[data-c="c2"]').disabled = !st.grad;
      };
      const options = () => {
        const paint = st.grad
          ? { color: st.c1, gradient: { type: "linear", rotation: Math.PI / 4, colorStops: [{ offset: 0, color: st.c1 }, { offset: 1, color: st.c2 }] } }
          : { color: st.c1, gradient: undefined };
        const [, sq, dt] = CORNERS[st.corner];
        const s = Math.min(360, Math.max(48, sideOf(stage, 999, 0) - (innerWidth < 640 ? 40 : 64)));
        return {
          width: s, height: s, type: "svg", margin: 0, shape: st.circle ? "circle" : "square",

      const CAP = { Numeric: [7089, 5596, 3993, 3057], Alphanumeric: [4296, 3391, 2420, 1852], Byte: [2953, 2331, 1663, 1273] };

          const r = await readTwin(qr);
          if (my !== token || !ctx.active) return;
          const ok = r.text === text;
          pane.querySelector(".qs-out").innerHTML = r.bytes
            ? `<span class="${ok ? "qs-ok" : "qs-bad"}">${ok ? "✓" : "✗"} jsQR 讀回：</span>${r.text ? esc(r.text) : "<i>（空字串：位元組不是合法 UTF-8）</i>"}`
            : `<span class="qs-bad">✗ jsQR 讀不到</span>`;
          const bytes = r.bytes || [];
          pane.querySelector(".qs-hex").innerHTML = `QR 內位元組：${hex(bytes, bytes.map((b, i) => b !== good[i]))}`;
        }
      };
      ctx.select("範例", SAMPLES, SAMPLES[0], (v) => { input.value = v; draw(); });
      let tm = 0;
      ctx.on(input, "input", () => { clearTimeout(tm); tm = ctx.timeout(draw, 200); });
      watch(ctx, ctx.$(".qs-raw .qs-qbox"), draw);
    },
  },

  // ---------- 7. output formats and update() ----------
  {
    id: "output", title: "輸出格式與 update", paper: true,
    api: "qrCode.update()・getRawData(ext)・applyExtension(fn)",
    desc: "同一個實例可在 svg 與 canvas 之間切換，update() 只傳要改的欄位。getRawData() 回傳 Blob，不必下載就能拿去上傳或預覽；applyExtension() 讓你在產生的 SVG 上加自己的元素（這裡加虛線框與文字），匯出的檔案也會帶著。",
    hint: "按「update() 換內容」，或切換 svg／canvas 與外框擴充",
    mount(ctx) {
      ctx.html(`<div class="qs-wrap qs-s7"><div class="qs-stage"><div class="qs-pills"></div><div class="qs-qr"></div></div>
        <div class="qs-pane"><h3><b>getRawData() 結果</b><span class="r">Blob，不觸發下載</span></h3><div class="qs-scroll">
          <table class="qs-fmt"><thead><tr><th>格式</th><th>MIME</th><th>大小</th><th>耗時</th><th>預覽</th></tr></thead><tbody></tbody></table>
          <dl class="qs-kv"></dl></div></div></div>`);
      const DATA = ["https://github.com/kozakdenys/qr-code-styling", "WIFI:T:WPA;S:Atlas-Guest;P:atlas2026;;", "BEGIN:VCARD\nVERSION:3.0\nFN:JS Atlas\nEND:VCARD", "mailto:hello@example.com?subject=QR"];
      const st = { type: "svg", ext: true, i: 0, size: 260, n: 0 };
      const stage = ctx.$(".qs-stage"), box = ctx.$(".qs-qr"), pills = ctx.$(".qs-pills"), kv = ctx.$(".qs-kv");
      const urls = [];
      ctx.onCleanup(() => urls.forEach((u) => URL.revokeObjectURL(u)));
      const frame = (svg, o) => {
        const NS = "http://www.w3.org/2000/svg";
        const r = document.createElementNS(NS, "rect");
        for (const [k, v] of Object.entries({ x: 3, y: 3, width: o.width - 6, height: o.height - 6, rx: 14, fill: "none", stroke: "#d61f69", "stroke-width": 3, "stroke-dasharray": "9 6" })) r.setAttribute(k, v);
        const t = document.createElementNS(NS, "text");
        for (const [k, v] of Object.entries({ x: o.width / 2, y: o.height - Math.round(o.height * 0.03), "text-anchor": "middle", "font-size": Math.max(7, Math.round(o.width * 0.046)), "font-weight": 700, fill: "#d61f69", "font-family": "sans-serif" })) t.setAttribute(k, v);
        t.textContent = "SCAN ME";
        svg.append(r, t);
      };
      const qr = new QRCodeStyling({ width: 260, height: 260, type: "svg", margin: 22, data: DATA[0], dotsOptions: { type: "classy-rounded", color: "#2b2540" }, cornersSquareOptions: { type: "extra-rounded", color: "#d61f69" }, cornersDotOptions: { type: "dot", color: "#1f8fb8" } });
      qr.applyExtension(frame);
      qr.append(box);
      let token = 0;
      const refresh = async (patch, label) => {
        const my = ++token;
        const t0 = performance.now();
        qr.update(patch);
        await qr.getRawData(st.type === "svg" ? "svg" : "png");
        const ms = performance.now() - t0;
        st.n++;
        const el = box.firstElementChild;
        pills.innerHTML = `<span class="qs-pill">update() 第 <b>${st.n}</b> 次：${label}</span><span class="qs-pill">重畫 <b>${fmtMs(ms)}</b></span>`;
        kv.innerHTML = `<dt>容器內元素</dt><dd class="qs-num">&lt;${el.tagName.toLowerCase()}&gt; ${el.tagName === "svg" ? `${el.querySelectorAll("*").length} 個子節點` : `${el.width}×${el.height}`}</dd>
          <dt>元素是否換新</dt><dd>update() 會重建 ${el.tagName.toLowerCase()}，舊參照要重抓</dd>
          <dt>目前內容</dt><dd class="qs-num" style="overflow-wrap:anywhere">${esc(DATA[st.i].replace(/\n/g, " ⏎ "))}</dd>`;
        const rows = [];
        urls.splice(0).forEach((u) => URL.revokeObjectURL(u));
        for (const ext of ["png", "jpeg", "webp", "svg"]) {
          const t1 = performance.now();
          const b = await qr.getRawData(ext);
          const ms1 = performance.now() - t1;
          if (my !== token || !ctx.active) return;
          const u = URL.createObjectURL(b); urls.push(u);
          rows.push(`<tr><td>${ext}</td><td>${b.type}</td><td>${kb(b.size)}</td><td>${fmtMs(ms1)}</td><td><img src="${u}" alt="${ext}"></td></tr>`);
        }
        ctx.$(".qs-fmt tbody").innerHTML = rows.join("");
        const r = await readTwin(qr);
        if (my === token && ctx.active) pills.insertAdjacentHTML("beforeend", readPill(r, DATA[st.i]));
      };
      const fit = () => Math.min(st.size, sideOf(stage, 400));
      ctx.button("update() 換內容", () => { st.i = (st.i + 1) % DATA.length; refresh({ data: DATA[st.i] }, "data"); }, { primary: true });
      ctx.group(["svg", "canvas"], 0, (i) => { st.type = ["svg", "canvas"][i]; refresh({ type: st.type }, "type"); });
      ctx.toggle("applyExtension 外框", true, (v) => { if (v) qr.applyExtension(frame); else qr.deleteExtension(); refresh({}, v ? "加上擴充" : "移除擴充"); });
      // keep the quiet zone (and the extension frame drawn inside it) proportional to the size
      const sized = () => { const s = fit(); return { width: s, height: s, margin: Math.round(s * 0.085) }; };
      ctx.slider("尺寸", { min: 160, max: 400, step: 20, value: 260, format: (v) => `${v}px` }, (v) => { st.size = v; refresh(sized(), "width／height"); });
      let first = true;
      watch(ctx, stage, () => { refresh(sized(), first ? "初次繪製" : "width／height"); first = false; });
    },
  },

  // ---------- 8. stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "new QRCodeStyling(opts).append(el) × N",
    desc: "一次產生 N 張風格化 QR（圓角點加線性漸層，每張內容不同），量從建立實例到全部畫完的時間，換算每張毫秒數。Canvas＋jsQR 模式再把每張讀回來，統計解碼成功率。",
    hint: "按左側「開始測試」；切換底部模式再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="qs-stress"><div class="qs-sbar"><span class="qs-pill">尚未測試：右側會鋪滿這一級產生的 QR</span></div><div class="qs-sgrid"></div></div>`);
      ctx.controls.classList.add("bottom");
      const MODES = ["SVG", "Canvas", "Canvas＋jsQR"];
      let mode = 0;
      ctx.group(MODES, 0, (i) => { mode = i; });
      const grid = ctx.$(".qs-sgrid"), bar = ctx.$(".qs-sbar");
      const style = (i) => ({
        width: 120, height: 120, margin: 4, data: `https://atlas.example/t/${(i * 7919 + 13).toString(36)}`,
        qrOptions: { errorCorrectionLevel: "M" },
        dotsOptions: { type: "rounded", gradient: { type: "linear", rotation: (i % 8) * Math.PI / 4, colorStops: [{ offset: 0, color: "#6a5ae0" }, { offset: 1, color: "#d61f69" }] } },
        cornersSquareOptions: { type: "extra-rounded", color: "#1f8fb8" },
      });
      ctx.bench({
        label: "QR 張數", unit: "張",
        sizes: [10, 25, 50, 100, 200, 400, 800, 1600],
        target: 1000, budget: 5000,
        prepare(n) {
          grid.replaceChildren();
          const s = fitGrid(grid.clientWidth - 12, grid.clientHeight - 12, n, 0, 2).s;
          grid.style.gridTemplateColumns = `repeat(auto-fill, ${Math.max(6, s)}px)`;
          return Array.from({ length: n }, () => grid.appendChild(document.createElement("div")));
        },
        async run(n, cells) {
          const type = mode === 0 ? "svg" : "canvas";
          const t0 = performance.now();
          const qs = cells.map((cell, i) => { const q = new QRCodeStyling({ ...style(i), type }); q.append(cell); return q; });
          // _svgDrawingPromise / _canvasDrawingPromise are declared in the package typings; awaiting them means "fully drawn"
          await Promise.all(qs.map((q) => q._svgDrawingPromise || q._canvasDrawingPromise));
          const drawMs = performance.now() - t0;
          let ok = 0, decMs = 0;
          if (mode === 2) {
            for (let i = 0; i < n; i++) {
              const r = readCanvas(cells[i].querySelector("canvas"));
              decMs += r.ms;
              if (r.text === style(i).data) ok++; else cells[i].classList.add("miss");
            }
          }
          const nodes = grid.querySelectorAll("*").length;
          bar.innerHTML = `<span class="qs-pill">${MODES[mode]}・<b>${fmt(n)}</b> 張</span><span class="qs-pill">繪製 <b>${fmtMs(drawMs)}</b>・每張 <b>${(drawMs / n).toFixed(2)} ms</b></span>`
            + (mode === 2 ? `<span class="qs-pill ${ok === n ? "ok" : "bad"}">jsQR 成功 <b>${ok}/${n}</b>・解碼共 <b>${fmtMs(decMs)}</b></span>` : "")
            + `<span class="qs-pill">DOM 節點 <b>${fmt(nodes)}</b></span>`;
          return `${(drawMs / n).toFixed(2)} ms／張${mode === 2 ? `・讀回 ${ok}/${n}` : ""}`;
        },
        note: "每張都是 120×120 的新實例，畫面上的縮圖只是 CSS 縮放。SVG 模式每張產生數百個節點，張數大時 DOM 與記憶體先吃緊；Canvas 模式每張是點陣圖，節點少但繪製要先算 SVG 再轉點陣。Canvas＋jsQR 的總時間另含逐張解碼，讀不到的格子會加紅框。",
      });
    },
  },
] });
</script>
</body>
</html>
