<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code Styling 示範：風格化 QR 產生器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .app { position: fixed; inset: 0; display: grid; grid-template-columns: 280px 1fr; }
  .form { padding: 14px 16px 56px; border-right: 1px solid var(--line); background: var(--bg-2); overflow-y: auto; }
  .form h1 { font-size: 16px; margin: 0 0 8px; }
  .form h1 b { color: var(--c3); }
  .lab { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .field { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); outline: none; font-size: 13px; }
  .field:focus { border-color: var(--c3); }
  .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .opts button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 7px; padding: 5px 9px; font: 12px var(--font); cursor: pointer; }
  .opts button[aria-pressed="true"] { background: var(--fg); color: var(--bg-2); border-color: var(--fg); }
  .presets button { display: flex; align-items: center; gap: 6px; }
  .presets i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .colors { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px; color: var(--muted); }
  .colors label { display: grid; gap: 2px; justify-items: start; }
  input[type="color"] { width: 100%; height: 30px; border: 1px solid var(--line); border-radius: 7px; padding: 2px; background: var(--bg); cursor: pointer; }
  .check { display: flex; gap: 14px; font-size: 13px; margin-top: 8px; }
  .check input { accent-color: var(--c3); }
  .actions { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; }
  .stage { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0;
    background: radial-gradient(circle at 30% 20%, #fdf2f8, transparent 55%), radial-gradient(circle at 80% 90%, #e0f2fe, transparent 50%), var(--bg); }
  .card { display: grid; justify-items: center; gap: 10px; padding: 22px 22px 16px; border-radius: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.18); transition: background .3s; }
  .card .cap { font-size: 13px; font-weight: 600; letter-spacing: .08em; }
  #qr { line-height: 0; }
  #qr svg, #qr canvas { display: block; }
  .meta { position: absolute; right: 12px; top: 12px; font: 12px var(--mono); color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px; }
  .warn { position: absolute; right: 12px; top: 44px; font-size: 12px; color: #9a3412; background: #fff7ed; border: 1px solid #fdba74; padding: 4px 10px; border-radius: 999px; }
  .warn:empty { display: none; }
  @media (max-width: 640px) {
    /* stacked layout scrolls under the fixed hint; the form labels already explain the controls */
    .hint { display: none; }
    .app { grid-template-columns: 1fr; grid-template-rows: 50% 50%; }
    .stage { grid-row: 1; }
    .form { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); padding: 10px 14px 56px; }
    .form h1 { display: none; }
    .card { padding: 12px 12px 8px; gap: 6px; border-radius: 16px; }
    .card .cap { font-size: 11px; }
    .meta { top: 8px; right: 8px; }
    .warn { top: 38px; right: 8px; font-size: 11px; }
    .actions { flex-direction: column; right: 8px; bottom: 8px; }
    .actions .btn { padding: 6px 9px; font-size: 12px; }
  }
</style>
</head>
<body class="paper">
<div class="app">
  <div class="form">
    <h1><b>QR Code Styling</b> 風格化 QR</h1>
    <label class="lab" for="data">內容（網址或文字）</label>
    <input class="field" id="data" value="https://www.npmjs.com/package/qr-code-styling">
    <span class="lab">一鍵風格</span>
    <div class="opts presets" id="presets"></div>
    <span class="lab">點的形狀</span>
    <div class="opts" id="dot"></div>
    <span class="lab">定位角</span>
    <div class="opts" id="corner"></div>
    <span class="lab">中央圖示</span>
    <div class="opts" id="logo"></div>
    <span class="lab">顏色</span>
    <div class="colors">
      <label>主色<input type="color" id="c1"></label>
      <label>漸層色<input type="color" id="c2"></label>
      <label>背景<input type="color" id="bg"></label>
    </div>
    <div class="check">
      <label><input type="checkbox" id="grad"> 漸層</label>
      <label><input type="checkbox" id="circle"> 圓形外框</label>
    </div>
  </div>
  <div class="stage" id="stage">
    <span class="meta" id="meta"></span>
    <span class="warn" id="warn"></span>
    <div class="actions">
      <button class="btn primary" id="png">下載 PNG</button>
      <button class="btn" id="svg">下載 SVG</button>
    </div>
    <div class="card" id="card"><div id="qr"></div><div class="cap" id="cap">掃我看示範</div></div>
  </div>
</div>
<div class="hint">每個選項都會即時重繪，手機鏡頭掃描可驗證</div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const svgUrl = (s) => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(s);
const LOGOS = {
  none: { label: "無", url: "" },
  js: { label: "JS", url: svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="18" fill="#f7df1e"/><text x="86" y="84" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="44" text-anchor="end" fill="#1a1a14">JS</text></svg>`) },
  heart: { label: "愛心", url: svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 88 12 50C-4 32 8 8 30 10c9 1 16 7 20 14 4-7 11-13 20-14 22-2 34 22 18 40Z" fill="#f72585"/></svg>`) },
  star: { label: "星星", url: svgUrl(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><polygon points="50,6 63,37 96,38 70,59 79,92 50,73 21,92 30,59 4,38 37,37" fill="#ff8c42"/></svg>`) },
};
const DOTS = { square: "方塊", dots: "圓點", rounded: "圓角", "extra-rounded": "大圓角", classy: "優雅", "classy-rounded": "優雅圓角" };
const CORNERS = { square: ["方形", "square", "square"], "extra-rounded": ["圓角", "extra-rounded", "square"], dot: ["圓形", "dot", "dot"] };
const PRESETS = [
  { name: "霓虹", dot: "dots", corner: "extra-rounded", logo: "js", c1: "#3a0ca3", c2: "#f72585", bg: "#ffffff", grad: true, circle: false },
  { name: "經典", dot: "square", corner: "square", logo: "none", c1: "#111111", c2: "#111111", bg: "#ffffff", grad: false, circle: false },
  { name: "糖果", dot: "rounded", corner: "dot", logo: "heart", c1: "#ff8c42", c2: "#d61f69", bg: "#fff4ec", grad: true, circle: false },
  { name: "墨金", dot: "classy-rounded", corner: "extra-rounded", logo: "star", c1: "#e9c46a", c2: "#b5838d", bg: "#1b1b1f", grad: true, circle: true },
];
const state = { ...PRESETS[0] };

function buttons(el, entries, key) {
  el.innerHTML = entries.map(([v, label]) => `<button data-v="${v}">${label}</button>`).join("");
  el.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state[key] = b.dataset.v; sync(); draw();
  });
}
buttons($("dot"), Object.entries(DOTS), "dot");
buttons($("corner"), Object.entries(CORNERS).map(([k, v]) => [k, v[0]]), "corner");
buttons($("logo"), Object.entries(LOGOS).map(([k, v]) => [k, v.label]), "logo");
$("presets").innerHTML = PRESETS.map((p, i) => `<button data-i="${i}"><i style="background:linear-gradient(135deg,${p.c1},${p.c2});outline:2px solid ${p.bg}"></i>${p.name}</button>`).join("");
$("presets").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  Object.assign(state, PRESETS[+b.dataset.i]); sync(); draw();
});

function sync() {
  for (const [id, key] of [["dot", "dot"], ["corner", "corner"], ["logo", "logo"]]) {
    $(id).querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.v === state[key]));
  }
  $("presets").querySelectorAll("button").forEach((b) => {
    const p = PRESETS[+b.dataset.i];
    b.setAttribute("aria-pressed", ["dot", "corner", "logo", "c1", "c2", "bg", "grad", "circle"].every((k) => p[k] === state[k]));
  });
  $("c1").value = state.c1; $("c2").value = state.c2; $("bg").value = state.bg;
  $("grad").checked = state.grad; $("circle").checked = state.circle;
  $("c2").disabled = !state.grad;
}

function luminance(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}

function size() {
  const r = $("stage").getBoundingClientRect();
  return Math.max(150, Math.min(340, Math.min(r.width, r.height) - 110));
}

function options() {
  const paint = state.grad
    ? { color: undefined, gradient: { type: "linear", rotation: Math.PI / 4, colorStops: [{ offset: 0, color: state.c1 }, { offset: 1, color: state.c2 }] } }
    : { color: state.c1, gradient: undefined };
  const [, sq, dt] = CORNERS[state.corner];
  const s = size();
  return {
    width: s, height: s, type: "svg", margin: 0,
    shape: state.circle ? "circle" : "square",
    data: $("data").value || " ",
    image: LOGOS[state.logo].url || undefined,
    qrOptions: { errorCorrectionLevel: state.logo === "none" ? "Q" : "H" },
    imageOptions: { margin: 4, imageSize: 0.35, hideBackgroundDots: true },
    dotsOptions: { type: state.dot, ...paint },
    cornersSquareOptions: { type: sq, ...paint },
    cornersDotOptions: { type: dt, ...paint },
    backgroundOptions: { color: state.bg },
  };
}

let qr;
const EC = { L: "7%", M: "15%", Q: "25%", H: "30%" };
function draw() {
  // Recreate the instance so switched-off options (gradient, logo) do not linger from a deep merge
  const opts = options();
  qr = new QRCodeStyling(opts);
  $("qr").replaceChildren();
  qr.append($("qr"));
  $("card").style.background = state.bg;
  $("cap").style.color = luminance(state.bg) > 0.5 ? "#333" : "#eee";
  const ec = opts.qrOptions.errorCorrectionLevel;
  $("meta").textContent = `容錯 ${ec}（可遮蔽約 ${EC[ec]}）・${[...opts.data].length} 字元`;
  // Scanners expect dark modules on a light background; flag inverted or low-contrast palettes
  const ink = Math.max(luminance(state.c1), state.grad ? luminance(state.c2) : 0);
  const paper = luminance(state.bg);
  $("warn").textContent = paper < ink ? "深底淺點（反相），部分手機掃描器讀不到" : paper - ink < 0.25 ? "對比偏低，可能掃不到" : "";
}

$("c1").addEventListener("input", (e) => { state.c1 = e.target.value; sync(); draw(); });
$("c2").addEventListener("input", (e) => { state.c2 = e.target.value; sync(); draw(); });
$("bg").addEventListener("input", (e) => { state.bg = e.target.value; sync(); draw(); });
$("grad").addEventListener("change", (e) => { state.grad = e.target.checked; sync(); draw(); });
$("circle").addEventListener("change", (e) => { state.circle = e.target.checked; sync(); draw(); });
let timer;
$("data").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(draw, 120); });
$("png").addEventListener("click", () => qr.download({ name: "styled-qr", extension: "png" }));
$("svg").addEventListener("click", () => qr.download({ name: "styled-qr", extension: "svg" }));
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(draw, 150); });

sync();
draw();
</script>
</body>
</html>
