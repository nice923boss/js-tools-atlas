<style>
  .qd-board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 10px; min-height: 0; grid-template-columns: minmax(0, 1fr) minmax(220px, 38%); grid-template-rows: minmax(0, 1fr); }

  .qd-side { min-height: 0; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; scrollbar-width: thin; }

  .qd-badge.off { background: rgba(127, 127, 127, .16); color: var(--muted); }
  .qd-json { flex: 1 1 auto; min-height: 60px; margin: 0; padding: 6px 8px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: rgba(127, 127, 127, .05); font: 11.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; scrollbar-width: thin; }
  .qd-json.fix { flex: none; min-height: 0; }

  .qd-log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qd-log li.fresh { animation: qd-flash 1s ease-out; }
  .qd-log .muted { font-family: var(--font); }

  .qd-src { display: inline-block; min-width: 34px; text-align: center; margin-right: 6px; font: 700 10.5px var(--font); padding: 0 5px; border-radius: 4px; background: #e8e3ff; color: #4b3cc4; }
  .qd-src.user { background: #dff3e6; color: #1f7a3f; }

  .qd-note b { color: var(--fg); }
  .qd-ki { color: #1f8a4c; font-weight: 600; } .qd-kr { color: #1f6fb8; font-weight: 600; } .qd-kd { color: #d61f69; font-weight: 600; }
  .qd-ka { color: #6a5ae0; } .qd-kx { color: #8a5a00; } .qd-s { color: #6b4d00; } .qd-n { color: #c2410c; } .qd-l { color: #6a5ae0; } .qd-tg { color: #1f6fb8; } .qd-at { color: #8a5a00; }

  .qd-mark.fmt { background: rgba(106, 90, 224, .2); outline-color: rgba(106, 90, 224, .75); }
  .qd-mark.del { background: #d61f69; outline: 0; }
  @keyframes qd-fade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
  .qd-sel { position: absolute; pointer-events: none; border: 2px dashed #6a5ae0; border-radius: 4px; transition: all .25s; }

  .qd-mention { padding: 0 4px; border-radius: 5px; background: #e8e3ff; color: #4b3cc4; font-weight: 600; }

<script src="_shared/showcase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
(() => {
  const { h, fmt } = Showcase;
  const Delta = Quill.import("delta");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const quiet = (p) => p.catch((e) => { if (e.name !== "AbortError") console.error(e); });

  // ---------- custom blots (registered once, used in scene 5) ----------
  const Embed = Quill.import("blots/embed");
  const Block = Quill.import("blots/block");
  class MentionBlot extends Embed {
    static blotName = "mention";
    static tagName = "span";
    static className = "qd-mention";
    static create(value) {
      const node = super.create(value);
      node.dataset.id = value.id;
      node.dataset.name = value.name;
      node.textContent = "@" + value.name;
      return node;
    }
    static value(node) { return { id: node.dataset.id, name: node.dataset.name }; }
  }
  class CalloutBlot extends Block {
    static blotName = "callout";
    static tagName = "ASIDE";
    static className = "qd-callout";
  }
  Quill.register({ "formats/mention": MentionBlot, "formats/callout": CalloutBlot });

  // ---------- rendering helpers ----------
  const KEY = { insert: "ki", retain: "kr", delete: "kd", attributes: "ka" };
  const TOK = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g;
  function colorJSON(s) {
    let out = "", last = 0, m;
    TOK.lastIndex = 0;
    while ((m = TOK.exec(s))) {
      out += esc(s.slice(last, m.index));
      if (m[1] && m[2]) out += `<span class="qd-${KEY[m[1].slice(1, -1)] || "kx"}">${esc(m[1])}</span>${m[2]}`;
      else if (m[1]) out += `<span class="qd-s">${esc(m[1])}</span>`;
      else if (m[3]) out += `<span class="qd-l">${m[3]}</span>`;
      else out += `<span class="qd-n">${m[4]}</span>`;
      last = TOK.lastIndex;
    }
    return out + esc(s.slice(last));
  }
  const opsHTML = (ops) => "[\n" + ops.map((o) => "  " + colorJSON(JSON.stringify(o))).join(",\n") + "\n]";
  const opsLine = (ops) => colorJSON(JSON.stringify(ops));
  function colorHTML(html) {
    const pretty = html.replace(/(<\/(?:p|h[1-6]|blockquote|pre|li|ol|ul|aside)>)/g, "$1\n").replace(/(<(?:ol|ul)[^>]*>)/g, "$1\n").replace(/(<li)/g, "  $1");
    return pretty.split(/(<[^>]+>)/).map((part) => {
      if (!part.startsWith("<")) return esc(part);
      return esc(part).replace(/^(&lt;\/?)([\w-]+)(.*?)(\/?&gt;)$/, (_, a, name, attrs, b) =>
        `<span class="qd-tg">${a}${name}</span>${attrs.replace(/([\w-]+)=(&quot;.*?&quot;)/g, '<span class="qd-at">$1</span>=<span class="qd-s">$2</span>')}<span class="qd-tg">${b}</span>`);
    }).join("");
  }
  function chips(ops) {
    return ops.map((op) => {
      const a = op.attributes ? " " + esc(JSON.stringify(op.attributes)) : "";
      if (op.insert != null) return `<span class="qd-chip ins">insert ${esc(typeof op.insert === "string" ? "「" + op.insert.replace(/\n/g, "↵") + "」" : JSON.stringify(op.insert))}${a}</span>`;
      if (op.delete) return `<span class="qd-chip del">delete ${op.delete}</span>`;
      return `<span class="qd-chip ${op.attributes ? "fmt" : ""}">retain ${op.retain}${a}</span>`;
    }).join("");
  }
  const TITLES = {
    ".ql-header": "段落樣式", ".ql-size": "字級", "button.ql-bold": "粗體（Ctrl+B）", "button.ql-italic": "斜體（Ctrl+I）", "button.ql-underline": "底線（Ctrl+U）",
    "button.ql-strike": "刪除線", ".ql-color": "文字顏色", ".ql-background": "螢光標記", 'button.ql-list[value="ordered"]': "編號清單", 'button.ql-list[value="bullet"]': "項目清單",
    'button.ql-list[value="check"]': "核取清單", 'button.ql-script[value="sub"]': "下標", 'button.ql-script[value="super"]': "上標", 'button.ql-indent[value="-1"]': "減少縮排",
    'button.ql-indent[value="+1"]': "增加縮排", "button.ql-blockquote": "引言", "button.ql-code-block": "程式碼區塊", "button.ql-link": "連結", "button.ql-image": "插入圖片",
    ".ql-align": "對齊", "button.ql-direction": "文字方向", "button.ql-clean": "清除格式", "button.ql-stamp": "自訂按鈕：插入核對章", "button.ql-callout": "自訂區塊：提示框",
    'button.ql-header[value="1"]': "標題 1", 'button.ql-header[value="2"]': "標題 2",
  };
  // Mount a Quill instance into host (a .qd-card); the scene clears host on cleanup.
  function makeQuill(host, opts) {
    const box = h("div");
    host.append(box);
    const q = new Quill(box, { theme: "snow", bounds: host, ...opts });
    for (const [sel, t] of Object.entries(TITLES)) host.querySelectorAll(sel).forEach((el) => el.setAttribute("title", t));
    q.theme.tooltip?.textbox?.setAttribute("data-link", "https://example.com");
    return q;
  }
  const cardScene = (ctx, side) => {
    ctx.html(`<div class="qd-board"><div class="qd-card"></div><section class="qd-side">${side}</section></div>`);
    const host = ctx.$(".qd-card");
    ctx.onCleanup(() => host.replaceChildren());
    return host;
  };
  // Index of a substring in document coordinates (embeds count as one character, unlike getText()).
  const at = (q, s, from = 0) => q.getContents().ops.map((o) => (typeof o.insert === "string" ? o.insert : "￼")).join("").indexOf(s, from);
  function logLine(list, html, max = 14) {
    const li = h("li", { class: "fresh" });
    li.innerHTML = html;
    list.querySelector(".muted")?.remove();
    list.prepend(li);
    while (list.children.length > max) list.lastElementChild.remove();
  }
  const srcTag = (s) => `<span class="qd-src ${s === "user" ? "user" : ""}">${s}</span>`;
  // Highlight a range inside the editor using getBounds().
  function mark(ctx, q, index, length, kind = "") {
    const b = q.getBounds(index, length);
    if (!b) return;
    const m = h("div", { class: `qd-mark ${kind}` });
    Object.assign(m.style, { left: `${b.left - 1}px`, top: `${b.top}px`, width: `${Math.max(3, b.width + 2)}px`, height: `${b.height}px` });
    q.container.append(m);
    ctx.timeout(() => m.remove(), 1700);
  }

  // ---------- sample documents (示意資料) ----------
  const DOC_MARKET = [
    { insert: "大稻埕週末市集企劃" }, { insert: "\n", attributes: { header: 1 } },
    { insert: "時間：" }, { insert: "11/8（六）10:00", attributes: { bold: true } },
    { insert: "起，地點：" }, { insert: "大稻埕碼頭", attributes: { underline: true, color: "#1f8fb8" } },
    { insert: "（暫定）", attributes: { italic: true, color: "#8a8880" } }, { insert: "。\n" },
    { insert: "攤位招募" }, { insert: "\n", attributes: { header: 2 } },
    { insert: "手作甜點（12 攤）" }, { insert: "\n", attributes: { list: "checked" } },
    { insert: "文創選物（20 攤）" }, { insert: "\n", attributes: { list: "unchecked" } },
    { insert: "在地小農（8 攤）" }, { insert: "\n", attributes: { list: "unchecked" } },
    { insert: "好市集不只是買賣，也讓街區被看見。" }, { insert: "\n", attributes: { blockquote: true } },
    { insert: "fee = 1200 * days  // 每攤每日，新台幣" }, { insert: "\n", attributes: { "code-block": "plain" } },
    { insert: "報名表單請見" }, { insert: "市集官網", attributes: { link: "https://example.com/market" } }, { insert: "（示意資料）。\n" },
  ];
  const DOC_NOTE = [
    { insert: "社區課程公告" }, { insert: "\n", attributes: { header: 2 } },
    { insert: "本季開設 " }, { insert: "手機攝影", attributes: { bold: true } }, { insert: " 與 " }, { insert: "AI 入門", attributes: { bold: true, color: "#6a5ae0" } },
    { insert: " 兩門課，上課地點在里民活動中心二樓。課程" }, { insert: "免費", attributes: { background: "#fff1a8" } }, { insert: "，名額各 30 人。\n" },
    { insert: "請攜帶手機與充電線" }, { insert: "\n", attributes: { list: "bullet" } },
    { insert: "長輩可由家人陪同" }, { insert: "\n", attributes: { list: "bullet" } },
    { insert: "報名請洽里辦公室（示意資料）\n", attributes: { italic: true } },
  ];

  // ---------- scene 1: live Delta ----------
  function sceneLive(ctx) {
    const host = cardScene(ctx, `<div class="qd-h"><b>text-change</b><span class="qd-badge">準備中</span><span class="qd-cnt">0 次</span></div><ol class="qd-log"><li class="muted">等待編輯…</li></ol><div class="qd-h"><b class="qd-tt">getContents()</b><span class="qd-stats"></span></div><pre class="qd-json"></pre>`);
    const q = makeQuill(host, {
      placeholder: "在這裡輸入內容…",
      modules: { toolbar: [[{ header: [1, 2, 3, false] }], ["bold", "italic", "underline", "strike"], [{ color: [] }, { background: [] }], [{ list: "ordered" }, { list: "bullet" }, { list: "check" }], ["blockquote", "code-block", "link"], [{ align: [] }, "clean"]] },
    });
    const log = ctx.$(".qd-log"), json = ctx.$(".qd-json"), badge = ctx.$(".qd-badge"), cnt = ctx.$(".qd-cnt"), stats = ctx.$(".qd-stats"), tt = ctx.$(".qd-tt");
    let tab = 0, pending = 0, count = 0, tourOn = false, gen = 0;
    const render = () => {
      pending = 0;
      const ops = q.getContents().ops;
      json.innerHTML = tab ? colorHTML(q.getSemanticHTML()) : opsHTML(ops);
      stats.textContent = `${ops.length} 個 op・${q.getLength() - 1} 字・${q.getLines().length} 行`;
    };
    const schedule = () => { if (!pending) pending = requestAnimationFrame(render); };
    ctx.onCleanup(() => cancelAnimationFrame(pending));
    ctx.group(["Delta", "語意 HTML"], 0, (i) => { tab = i; tt.textContent = i ? "getSemanticHTML()" : "getContents()"; render(); });
    const setBadge = (t, on) => { badge.textContent = t; badge.classList.toggle("off", !on); };
    const stopTour = () => { if (tourOn) { tourOn = false; gen++; setBadge("手動編輯", false); } };
    q.on("text-change", (delta, _old, source) => {
      cnt.textContent = `${++count} 次`;
      logLine(log, srcTag(source) + opsLine(delta.ops));
      schedule();
      if (source === "user") stopTour();
    });
    ctx.on(host, "pointerdown", stopTour);
    ctx.on(host, "keydown", stopTour);
    async function tour() {

  // ---------- scene 2: toolbars & themes ----------

  // ---------- scene 3: Delta operations ----------
  const DOC_PLAN = [

  function sceneDelta(ctx) {
    const host = cardScene(ctx, `<div class="qd-h"><b>updateContents(delta)</b><span class="qd-cnt"></span></div><div class="qd-steps"></div><div class="qd-h"><b>getContents()</b></div><pre class="qd-json"></pre>`);
    const q = makeQuill(host, { modules: { toolbar: false } });
    const BASE = new Delta(DOC_PLAN);
    const stepsEl = ctx.$(".qd-steps"), json = ctx.$(".qd-json"), cnt = ctx.$(".qd-cnt");
    const STEPS = [
      ["insert：插入文字", () => new Delta().retain(at(q, "10:00") + 5).insert("～17:00")],
      ["retain + attributes：加格式", () => new Delta().retain(at(q, "大稻埕碼頭")).retain(5, { bold: true, color: "#d61f69" })],
      ["delete：刪除", () => new Delta().retain(at(q, "（暫定）")).delete(4)],
      ["同一個 Delta 多個操作", () => new Delta().retain(at(q, "1200")).delete(4).insert("1,000", { underline: true }).retain(2).insert("（早鳥價）", { italic: true, color: "#8a8880" })],
      ["行格式：retain 換行字元", () => new Delta().retain(at(q, "\n", at(q, "攤位費"))).retain(1, { list: "bullet" })],
      ["BASE.diff(目前文件)：算出總變更", () => BASE.diff(q.getContents())],
      ["diff.invert(BASE)：反向 Delta 還原", () => BASE.diff(q.getContents()).invert(BASE)],
    ];
    const rows = STEPS.map(([t]) => { const r = h("div", { class: "qd-step" }, h("b", { text: t }), h("div")); stepsEl.append(r); return r; });
    let k = 0, auto = true;
    const render = () => { json.innerHTML = opsHTML(q.getContents().ops); cnt.textContent = `${k} / ${STEPS.length}`; };
    function changed(delta) {
      let idx = 0, start = null, end = 0, kind = "";
      for (const op of delta.ops) {
        if (op.retain && !op.attributes) { idx += op.retain; continue; }
        start ??= idx;
        if (op.delete) { kind ||= "del"; end = Math.max(end, idx); continue; }
        idx += op.retain || (typeof op.insert === "string" ? op.insert.length : 1);
        end = idx;
        kind = op.insert != null ? "" : kind === "" ? "" : "fmt";
      }
      return start == null ? null : [start, end - start, kind];
    }
    function step() {
      if (k >= STEPS.length) { q.setContents(BASE, "silent"); k = 0; rows.forEach((r) => { r.className = "qd-step"; r.lastChild.innerHTML = ""; }); render(); return; }
      const delta = STEPS[k][1]();
      rows.forEach((r, i) => (r.className = `qd-step ${i === k ? "on" : i < k ? "done" : ""}`));
      rows[k].lastChild.innerHTML = chips(delta.ops);
      if (k === 5) { k++; render(); return; }
      q.updateContents(delta, "api");
      const c = changed(delta);
      if (c) mark(ctx, q, c[0], c[1], c[2] === "" && delta.ops.every((o) => o.insert == null) ? "fmt" : c[2]);
      k++;
      render();
    }
    ctx.button("下一步", () => { auto = false; step(); }, { primary: true });
    ctx.button("重設", () => { auto = false; k = STEPS.length; step(); });
    ctx.on(host, "pointerdown", () => { auto = false; });
    q.setContents(BASE, "silent");
    render();
    ctx.interval(() => { if (auto) step(); }, 1900);
  }

  // ---------- scene 5: custom blots ----------
  const PEOPLE = [["u01", "王小明"], ["u02", "陳美玲"], ["u03", "林志豪"], ["u04", "黃雅婷"]];
  const DOC_MEET = [
    { insert: "市集籌備會議紀錄" }, { insert: "\n", attributes: { header: 2 } },

  const BLOT_SRC = `<i>class</i> MentionBlot <i>extends</i> Embed {

  function sceneBlot(ctx) {
    const host = cardScene(ctx, `<div class="qd-h"><b>自訂 Blot</b><span>Parchment</span></div><pre class="qd-code">${BLOT_SRC}</pre><div class="qd-h"><b>getContents()</b></div><pre class="qd-json"></pre>`);

        const b = h("button", { type: "button", class: i === menu.sel ? "on" : "" }, `@${name}`);
        b.addEventListener("mousedown", (e) => { e.preventDefault(); menu.sel = i; pick(); });

  // ---------- scene 6: history & clipboard ----------
  const WORD_HTML = '<p class="MsoNormal" style="font-family:新細明體;font-size:16pt;color:#333333"><span style="background:yellow;color:red;font-size:20px">市集公告</span>：報名延長到 <b style="color:#cc0000">10/31</b>，詳情 https://example.com/market</p><p class="MsoNormal"><i style="font-family:Arial">攤位有限，請盡早報名。</i></p>';

  const KEEP = ["bold", "italic", "link", "header", "list"];
  function sceneHistory(ctx) {
    const host = cardScene(ctx, `<div class="qd-h"><b>history.stack</b><span class="qd-cnt"></span></div><ol class="qd-log qd-stack"></ol><div class="qd-h"><b>clipboard.convert()</b><span class="qd-badge off">未貼上</span></div><pre class="qd-json"></pre>`);

    let clean = false, auto = true;
    // Matcher 1: turn bare URLs in pasted text into links.
    q.clipboard.addMatcher(Node.TEXT_NODE, (node, delta) => {
      const parts = node.data.split(/(https?:\/\/[^\s，。）]+)/);
      if (parts.length < 2) return delta;
      return new Delta(parts.filter(Boolean).map((p) => (/^https?:/.test(p) ? { insert: p, attributes: { link: p } } : { insert: p })));
    });

      if (!clean) return delta;

        if (!op.attributes) return op;
        const kept = Object.fromEntries(Object.entries(op.attributes).filter(([k]) => KEEP.includes(k)));
        return Object.keys(kept).length ? { insert: op.insert, attributes: kept } : { insert: op.insert };
      }));
    });
    const render = () => {
      const { undo, redo } = q.history.stack;

        q.setContents(DOC_DRAFT, "silent"); q.history.clear(); setClean(false); render();
        badge.textContent = "未貼上"; badge.classList.add("off");
        json.textContent = "按「貼上 Word 片段」或直接貼上網頁內容，這裡會顯示經過 matcher 轉換的 Delta。";
        await ctx.sleep(900);
        for (const chunk of ["報名", "延長", "到月底"]) { await typeChunk(chunk); await ctx.sleep(1100); }
        if (!auto) return;
        q.history.undo(); await ctx.sleep(1100);
        if (!auto) return;
        q.history.redo(); await ctx.sleep(1100);
        if (!auto) return;
        paste(); await ctx.sleep(3000);
        if (!auto) return;
        q.history.undo(); setClean(true); await ctx.sleep(900);
        if (!auto) return;
        paste(); await ctx.sleep(3800);
      }
    })());
  }

  // ---------- scene 7: stress ----------
  const WORDS = ["手作甜點", "文創選物", "在地小農", "街頭表演", "二手書", "咖啡攤", "親子手作"];
  const SENT = ["今天人潮比上週多，下午三點最熱鬧。", "攤主反映電源不足，需要加裝延長線。", "雨備方案改到室內走廊，動線要重新規劃。", "志工排班表已更新，請大家確認時段。", "垃圾分類站移到入口旁，方便民眾使用。"];
  function bigDoc(n) {
    const ops = [];
    for (let i = 0; i < n; i++) {
      if (i % 25 === 0) { ops.push({ insert: `第 ${i / 25 + 1} 章・市集紀錄` }, { insert: "\n", attributes: { header: 2 } }); continue; }
      ops.push({ insert: `${i}. ` }, { insert: WORDS[i % 7], attributes: { bold: true } }, { insert: "：" + SENT[i % 5] });
      if (i % 9 === 0) ops.push({ insert: "（重點）", attributes: { background: "#fff1a8" } });
      ops.push(i % 6 === 1 ? { insert: "\n", attributes: { list: "bullet" } } : { insert: "\n" });
    }
    return ops;
  }
  function sceneStress(ctx) {
    ctx.html(`<div class="qd-stress"><div class="qd-sbar"></div><div class="qd-card"></div></div>`);
    ctx.controls.classList.add("bottom");
    const host = ctx.$(".qd-card"), sbar = ctx.$(".qd-sbar");
    ctx.onCleanup(() => host.replaceChildren());
    const q = makeQuill(host, { modules: { toolbar: [["bold", "italic"], [{ list: "bullet" }], ["clean"]], history: { userOnly: true } } });
    let lastInput = null;
    const paint = () => {
      const blocks = q.root.childElementCount;
      sbar.innerHTML = `目前文件：頂層區塊 <b>${fmt(blocks)}</b>・字元 <b>${fmt(q.getLength())}</b>${lastInput ? `・上一級輸入延遲中位數 <b>${lastInput.toFixed(2)} ms</b>` : ""}`;
    };
    q.setContents(bigDoc(300), "silent");
    paint();
    ctx.interval(paint, 800);
    ctx.bench({
      label: "文件段落數", unit: "段", sizes: [200, 1000, 5000, 10000, 20000, 50000], budget: 4000, target: 1000,
      note: "每一級先產生 N 段含粗體、清單、標題與螢光標記的文件。準備階段（不計時）先載入一次，在文件中段用 insertText(…, 'user') 連續插入 15 個字並強制版面計算，取中位數當「輸入延遲」；接著清空，再計時 setContents() 載入整份文件到版面計算完成。真實鍵盤輸入還要經過瀏覽器的 contenteditable 與 MutationObserver，實際延遲會再高一些。",
      async prepare(n) {
        const ops = bigDoc(n);
        q.setContents(ops, "silent");
        void q.root.offsetHeight;
        await ctx.frame(1);
        const mid = Math.floor(q.getLength() / 2), times = [];
        for (let k = 0; k < 15; k++) {
          const t0 = performance.now();
          q.insertText(mid + k, "字", "user");
          void q.root.offsetHeight;
          times.push(performance.now() - t0);
        }
        times.sort((a, b) => a - b);
        lastInput = times[7];
        q.setContents([], "silent");
        q.history.clear();
        await ctx.frame(1);
        return { ops, input: times[7] };
      },
      run(n, d) {
        q.setContents(d.ops, "silent");
        void q.root.offsetHeight;
        paint();
        return `輸入 ${d.input.toFixed(1)}ms`;
      },
    });
  }

  Showcase.run({ scenes: [
    { id: "live", paper: true, title: "即時 Delta", api: "quill.on('text-change', (delta, old, source) => …); quill.getContents()",
      desc: "Quill 的文件是一串 Delta 操作（insert 加 attributes）。左側每個 API 呼叫或手動輸入都會觸發 text-change，右側即時列出變更 Delta、完整文件 Delta 與 getSemanticHTML() 輸出的語意 HTML。",
      hint: "選取文字後用工具列套格式；點編輯器即可接手", mount: sceneLive },
    { id: "toolbar", paper: true, title: "工具列與主題", api: "new Quill(el, { theme: 'snow' | 'bubble', modules: { toolbar: { container, handlers } } })",
      desc: "同一份文件切換完整工具列、精簡工具列與 bubble 主題。完整工具列有下拉選單、色盤、上下標、縮排與對齊；「核對章」是自訂按鈕，按下時由 handlers.stamp 插入帶格式的文字。",
      hint: "bubble 主題要先選取文字才會出現工具列", mount: sceneToolbar },
    { id: "delta", paper: true, title: "Delta 運算", api: "quill.updateContents(new Delta().retain(n).insert(…)); BASE.diff(doc).invert(BASE)",
      desc: "Delta 用 retain（跳過或改格式）、insert、delete 描述變更。逐步套用後，用 diff() 一次算出與原稿的總差異，再用 invert() 產生反向 Delta 把文件還原；綠框是插入、紫框是改格式、紅線是刪除位置。",
      hint: "按「下一步」逐步執行，或看自動播放", mount: sceneDelta },
    { id: "select", paper: true, title: "選取、格式與唯讀", api: "quill.on('selection-change', …); quill.getFormat(range); quill.enable(false)",
      desc: "selection-change 回報選取範圍與來源，getFormat() 取得範圍內共同的格式，getBounds() 算出畫面位置（虛線框）。開啟唯讀時 enable(false) 擋下使用者編輯；清空文件後顯示 placeholder。",
      hint: "自己選取文字看右側變化；試試開關唯讀", mount: sceneSelect },
    { id: "blot", paper: true, title: "自訂 Blot", api: "class MentionBlot extends Embed {…}; Quill.register('formats/mention', MentionBlot)",
      desc: "用 Parchment 擴充兩種格式：@ 提及是行內 Embed，在 Delta 中是 { insert: { mention: {…} } }；提示框是自訂區塊 Block，工具列同名按鈕會自動切換。提及選單用 keyboard.bindings 接手方向鍵與 Enter。",
      hint: "輸入 @ 叫出成員選單，方向鍵選擇、Enter 確認", mount: sceneBlot },
    { id: "history", paper: true, title: "歷史與剪貼簿", api: "modules.history { delay, userOnly }; quill.clipboard.addMatcher(Node.ELEMENT_NODE, fn)",
      desc: "History 模組把 delay 毫秒內的變更合併成一筆，stack 中存的是復原用 Delta。剪貼簿 matcher 在貼上時改寫 Delta：一個把純文字網址變成連結，另一個開啟後只保留粗體、斜體、連結等語意格式，清掉 Word 帶來的顏色與字型。",
      hint: "切換「清理 matcher」後再貼上一次比較 Delta", mount: sceneHistory },
    { id: "stress", paper: true, title: "極限測試", kind: "stress", api: "quill.setContents(bigDelta); quill.insertText(mid, '字', 'user')",
      desc: "逐級加大文件段落數，量 setContents() 載入整份文件的時間，並在文件中段量測插入文字的延遲。",
      hint: "按「開始測試」，滑過結果列看每秒處理量", mount: sceneStress },
  ] });
})();
</script>
</body>
