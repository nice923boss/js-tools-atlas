// ---------- three.js stage ----------
function disposeAll(root, extra) {
  const seen = new Set();
  const free = (x) => { if (x && !seen.has(x) && typeof x.dispose === "function") { seen.add(x); x.dispose(); } };
  const freeMat = (m) => { if (!m) return; for (const v of Object.values(m)) if (v && v.isTexture) free(v); free(m); };
  root.traverse((o) => {
    free(o.geometry);
    [].concat(o.material || []).forEach(freeMat);
    if (o.isInstancedMesh) free(o);
  });

}

function stage(ctx, o = {}) {

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = o.exposure ?? 1;

  host.append(canvas);
  const scene = new THREE.Scene();

  const fov = o.fov ?? 45;
  const camera = new THREE.PerspectiveCamera(fov, 1, 0.1, o.far ?? 300);
  camera.position.set(...(o.pos || [0, 2, 8]));
  let controls = null;
  if (o.orbit !== false) {
    controls = new OrbitControls(camera, canvas);

    render: () => renderer.render(scene, camera),

  let lastKey = "";

    const w = Math.max(1, host.clientWidth), hh = Math.max(1, host.clientHeight);
    const top = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-h")) || 0;
    const bot = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-b")) || 0;
    const key = `${w}x${hh}:${top}:${bot}`;
    if (key === lastKey) return;
    lastKey = key;
    const d = Math.max(-hh * 0.4, Math.min(hh * 0.4, top - bot));
    S.width = w; S.height = hh; S.full = hh + Math.abs(d); S.availH = hh - Math.abs(d);
    renderer.setSize(w, hh);
    if (labels) labels.setSize(w, hh);
    camera.aspect = w / S.full;
    camera.fov = o.portraitFov && w < hh ? o.portraitFov : fov;
    if (d) camera.setViewOffset(w, S.full, 0, d < 0 ? -d : 0, w, hh); else camera.clearViewOffset();

    fit();
    timer.update(t);
    const dt = Math.max(0, Math.min(timer.getDelta(), 0.1)), time = timer.getElapsed();
    for (const fn of frameFns) fn(dt, time);

    if (controls) controls.dispose();
    timer.dispose();
    disposeAll(scene, extra);
    renderer.dispose();
    renderer.forceContextLoss(); // WEBGL_lose_context: frees the GL context right away
    canvas.remove();
    if (labels) labels.domElement.remove();

}

// Camera distance that fits a halfW x halfH box into the visible (uncovered) part of the view.
function fitDistance(S, halfW, halfH, margin = 1.12) {
  const tanV = Math.tan(THREE.MathUtils.degToRad(S.camera.fov) / 2);
  return Math.max((halfH * S.full) / (S.availH * tanV), halfW / (tanV * S.camera.aspect)) * margin;
}
const setNdc = (S, e, v) => {
  const r = S.canvas.getBoundingClientRect();
  return v.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
// Click/tap that is not the end of an orbit drag.
function onTap(ctx, el, fn) {
  let d = null;
  ctx.on(el, "pointerdown", (e) => { d = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  ctx.on(el, "pointerup", (e) => {
    if (d && performance.now() - d.t < 300 && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 6) fn(e);

// CSS2D label. o.color tints it, o.fine hides the whole label on narrow stages, o.fineSub only the second line.
function label(title, sub = "", o = {}) {
  const t = h("span", { text: title });
  const s = h("small", { text: sub, class: [o.fineSub ? "rp-fine" : "", o.codeSub ? "rp-code" : ""].join(" ").trim() || null });
  const box = h("div", { class: "rp-lab" + (o.fine ? " rp-fine" : "") }, t, s);
  if (o.color) { box.style.borderColor = o.color; t.style.color = o.color; }
  const obj = new CSS2DObject(box);
  let lt = title, ls = sub;
  obj.userData.title = (x) => { if (x !== lt) { lt = x; t.textContent = x; } };
  obj.userData.sub = (x) => { if (x !== ls) { ls = x; s.textContent = x; } };
  return obj;
}
function chip(ctx, html) {
  const el = h("div", { class: "rp-chip" });
  el.innerHTML = html;
  ctx.el.append(el);
  let last = html;
  return (next) => { if (next !== last) { last = next; el.innerHTML = next; } };
}
const it = (html) => `<span class="rp-it">${html}</span>`;
// Smooth camera moves between framed views; re-frames on resize.
function camRig(S) {
  let cur = null, k = 1;
  const p0 = new THREE.Vector3(), t0 = new THREE.Vector3(), p1 = new THREE.Vector3(), t1 = new THREE.Vector3();
  const goal = () => { t1.set(...cur.t); p1.set(...cur.d).normalize().multiplyScalar(fitDistance(S, cur.hw, cur.hh)).add(t1); };
  S.onSize(() => { if (!cur) return; goal(); if (k >= 1) { S.camera.position.copy(p1); S.controls.target.copy(t1); } });
  S.onFrame((dt) => {
    if (k >= 1) return;
    k = Math.min(1, k + dt / 1.2);
    const e = k * k * (3 - 2 * k);
    S.camera.position.lerpVectors(p0, p1, e);
    S.controls.target.lerpVectors(t0, t1, e);
  });
  return (view, instant) => {
    cur = view; goal();
    if (instant) { k = 1; S.camera.position.copy(p1); S.controls.target.copy(t1); }
    else { k = 0; p0.copy(S.camera.position); t0.copy(S.controls.target); }
  };
}
function lights(S, { shadow = 6, pos = [4, 9, 5], hemi = 1.3, sun = 2.4 } = {}) {
  S.scene.add(new THREE.HemisphereLight(0xfff4e6, 0x20232c, hemi));
  const d = new THREE.DirectionalLight(0xffffff, sun);
  d.position.set(...pos);
  if (shadow) {
    d.castShadow = true;
    d.shadow.mapSize.set(2048, 2048);
    Object.assign(d.shadow.camera, { left: -shadow, right: shadow, top: shadow, bottom: -shadow, near: 0.5, far: 60 });
    d.shadow.bias = -0.0005;

  S.scene.add(d);
  return d;
}
function floor(S, w, d, color, x = 0) {
  const m = new THREE.Mesh(S.own(new THREE.PlaneGeometry(w, d)), S.own(std(color, { roughness: 0.9 })));
  m.rotation.x = -Math.PI / 2;
  m.position.x = x;
  m.receiveShadow = true;
  S.scene.add(m);

}
function shadowed(geo, mat) { const m = new THREE.Mesh(geo, mat); m.castShadow = m.receiveShadow = true; return m; }

  im.castShadow = im.receiveShadow = true;

// Orient a unit-height cylinder mesh (or instance) from point a to point b.
const _up = new THREE.Vector3(0, 1, 0), _a = new THREE.Vector3(), _b = new THREE.Vector3();

// Fixed 60 Hz stepping with at most maxSub steps per frame. P.world is read every step, so it can be swapped.
function fixedLoop(S, P) {
  let acc = 0;
  P.ms = 0; P.steps = 0;
  S.onFrame((dt) => {
    if (P.paused) { acc = 0; return; }
    acc += dt;
    const max = P.maxSub || 3;
    let n = 0;
    while (acc >= STEP && n < max && !P.paused) {
      if (P.before) P.before();
      const t0 = performance.now();
      P.world.step(P.eq);
      P.ms += (performance.now() - t0 - P.ms) * 0.1;

function torusData() {
  const Rm = 0.55, rm = 0.17, nu = 20, nv = 10, v = [], idx = [];
  for (let i = 0; i < nu; i++) for (let k = 0; k < nv; k++) {
    const u = (i / nu) * Math.PI * 2, w = (k / nv) * Math.PI * 2;
    v.push((Rm + rm * Math.cos(w)) * Math.cos(u), rm * Math.sin(w), (Rm + rm * Math.cos(w)) * Math.sin(u));
  }
  for (let i = 0; i < nu; i++) for (let k = 0; k < nv; k++) {
    const a = i * nv + k, b = ((i + 1) % nu) * nv + k, c = ((i + 1) % nu) * nv + ((k + 1) % nv), d = i * nv + ((k + 1) % nv);

Showcase.run({ scenes: [
  {
    id: "character", title: "角色控制器",
    api: "world.createCharacterController(0.02)・controller.computeColliderMovement(collider, move)・enableAutostep・setMaxSlopeClimbAngle",
    desc: "運動學角色每一步都交給 Rapier 的角色控制器算出能走多遠：30 cm 以內的台階自動跨上、20° 緩坡照走、55° 陡坡會滑下來，走路時還會推開木箱與球。",
    hint: "點地面讓角色走過去・WASD 或方向鍵操作・空白鍵跳・點物體踢飛",
    async mount(ctx) {
      if (!(await boot(ctx))) return;
      const S = stage(ctx, { shadows: true, portraitFov: 55, bg: 0x0b0e14, far: 140, labels: true,
        orbit: { maxPolarAngle: Math.PI * 0.46, minDistance: 5, maxDistance: 60 } });
      S.scene.fog = new THREE.Fog(0x0b0e14, 16, 34);
      S.scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x1a1f2a, 1.3));
      const sun = new THREE.DirectionalLight(0xffffff, 2.4);
      sun.position.set(6, 12, 7);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 11, bottom: -11, near: 1, far: 40 });
      sun.shadow.bias = -0.0006;
      S.scene.add(sun);
      const CENTER = new THREE.Vector3(0, 0.6, -1);
      camRig(S)({ t: [0, 0.6, -1], d: [0.42, 0.62, 0.66], hw: 6, hh: 4.6 }, true);
      const world = physWorld(ctx);
      const CHAR = { r: 0.3, hh: 0.35, speed: 3.2, jump: 6.5, gravity: 18 }, START = { x: 0, y: 1.2, z: 5 }, MAX_BALLS = 700;

      // Static level: one fixed body, every piece is a cuboid collider plus a matching mesh.
      const ground = world.createRigidBody(R.RigidBodyDesc.fixed());
      const mats = new Map();
      const addStatic = (hx, hy, hz, pos, rotZ, rotX, color) => {
        const q = qE(rotX, 0, rotZ);
        world.createCollider(R.ColliderDesc.cuboid(hx, hy, hz).setTranslation(pos[0], pos[1], pos[2]).setRotation(q).setFriction(0.8), ground);

        if (!mats.has(color)) mats.set(color, std(color, { roughness: 0.8 }));
        const m = shadowed(new THREE.BoxGeometry(hx * 2, hy * 2, hz * 2), mats.get(color));
        m.position.set(...pos);
        m.quaternion.set(q.x, q.y, q.z, q.w);
        S.scene.add(m);
      };
      addStatic(14, 0.5, 14, [0, -0.5, 0], 0, 0, null);
      const gm = new THREE.Mesh(new THREE.PlaneGeometry(90, 90), std(0x1c2432, { roughness: 0.95 }));
      gm.rotation.x = -Math.PI / 2;
      gm.receiveShadow = true;
      S.scene.add(gm);
      const grid = new THREE.GridHelper(28, 28, 0x34425a, 0x263043);
      grid.position.y = 0.003;
      S.scene.add(grid);
      for (const s of [-1, 1]) {
        addStatic(10.2, 0.18, 0.2, [0, 0.18, s * 10], 0, 0, 0x2b3854);
        addStatic(0.2, 0.18, 10.2, [s * 10, 0.18, 0], 0, 0, 0x2b3854);
      }
      const MESA_H = 1.2;
      addStatic(2, MESA_H / 2, 1.5, [0, MESA_H / 2, -3], 0, 0, 0x3a4860);
      for (let i = 0; i < 6; i++) {
        const top = (i + 1) * 0.2;
        addStatic(0.25, top / 2, 1, [-4.75 + i * 0.5, top / 2, -3], 0, 0, i % 2 ? 0x5b6d8c : 0x4f6080);
      }
      {
        const a = 20 * DEG, len = MESA_H / Math.sin(a), run = MESA_H / Math.tan(a);
        addStatic(len / 2, 0.1, 1.5, [2 + run / 2 - Math.sin(a) * 0.1, MESA_H / 2 - Math.cos(a) * 0.1, -3], -a, 0, 0x2f7a5f);
      }
      {

        addStatic(1, 0.1, len / 2, [0, MESA_H / 2 - Math.cos(a) * 0.1, -1.5 + run / 2 - Math.sin(a) * 0.1], 0, a, 0x93304f);
      }
      for (const [t, sub, color, p, code] of [
        ["階梯：自動跨階", "每階 20 cm・autostep 上限 30 cm", "#9fb6dd", [-3.5, 2.0, -3]],
        ["緩坡 20°：可攀爬", "maxSlopeClimbAngle 40°", "#7bd389", [4.1, 1.6, -3], true],
        ["陡坡 55°：會滑落", "超過 40° 就滑下來", "#f72585", [0, 2.15, -1.2]],
        ["可推動的木箱", "applyImpulsesToDynamicBodies", "#ff8c42", [0, 2.3, 1.6], true],
      ]) {
        const l = label(t, sub, { color, fineSub: true, codeSub: code });
        l.position.set(...p);
        S.scene.add(l);
      }

      // Dynamic crates and balls, drawn with two InstancedMeshes.
      const CRATE = 0.25, col = new THREE.Color();
      const crateIm = instanced(S, new RoundedBoxGeometry(CRATE * 2, CRATE * 2, CRATE * 2, 2, 0.04), std(0xffffff), 12);
      const ballIm = instanced(S, new THREE.SphereGeometry(1, 18, 12), std(0xffffff, { roughness: 0.3, metalness: 0.05 }), MAX_BALLS);
      let crates = [], balls = [], rainQ = 0, ballsDirty = true;
      function buildCrates() {
        for (const b of crates) world.removeRigidBody(b);
        crates = [];
        const mk = (x, y, z) => {
          const b = world.createRigidBody(R.RigidBodyDesc.dynamic().setTranslation(x, y, z));
          world.createCollider(R.ColliderDesc.cuboid(CRATE, CRATE, CRATE).setDensity(1.6).setFriction(0.7), b);
          crates.push(b);

        if (l < 0.3) return;
        aimDir = { x: dx / l, y: 0, z: dz / l };
        aimUntil = clock + 5;
      });

      let ang = 0, n = 0;
      const P = {
        world, maxSub: 3,
        before() { ang += 0.6 * STEP; turn.setNextKinematicRotation(qE(0, ang, 0)); },
        after() { if (++n % 900 === 0) resetCrates(); },
      };
      fixedLoop(S, P);
      world.step(); // build the query structures before the first frame
      const setChip = chip(ctx, "");
      const us = { ray: 0, shape: 0, over: 0, proj: 0 };
      const timeIt = (k, fn) => { const t0 = performance.now(); for (let i = 0; i < 50; i++) fn(); us[k] = (performance.now() - t0) * 20; }; // 50 calls, result in microseconds per call
      let frameNo = 0;
      S.onFrame((dt, time) => {
        clock = time;
        syncMesh(turnG, turn);
        for (const c of crates) syncMesh(c.m, c.b);
        // 1. laser: ray cast with surface normal, reflected up to 8 times
        const a = 0.28 + 0.14 * Math.sin(time * 0.3); // sweeps across the first mirror
        const dir = time < aimUntil && aimDir ? aimDir : { x: Math.cos(a), y: 0, z: Math.sin(a) };
        laser(dir);
        laserL.userData.title(`射線反射 ${bounces} 次`);
        // 2. sweep a ball and stop at the first contact
        const b = 0.45 + 0.4 * Math.sin(time * 0.4 + 1), sd = { x: -Math.cos(b), y: 0, z: -Math.sin(b) };
        const sh = world.castShape(C0, ID, sd, ballShape, 0, 12, true, undefined, undefined, floorCol);
        const toi = sh ? (sh.time_of_impact ?? sh.toi) : 12;
        const end = { x: C0.x + sd.x * toi, y: C0.y, z: C0.z + sd.z * toi };
        sEnd.position.set(end.x, end.y, end.z);
        sEnd.material = sh ? hitMat : okMat;
        sTube.matrix.copy(beam(C0, end));
        sweepL.userData.title(sh ? `掃掠：可走 ${toi.toFixed(2)} m` : "掃掠：12 m 內無障礙");
        // 3. overlap test with a box probe
        const pp = { x: -1.8 + 1.3 * Math.cos(time * 0.5), y: 0.45, z: 0.6 + 1.3 * Math.sin(time * 0.5) }, pr = qE(0, time * 0.5, 0);
        probeG.position.set(pp.x, pp.y, pp.z);
        probeG.quaternion.set(pr.x, pr.y, pr.z, pr.w);
        let over = 0;
        world.intersectionsWithShape(pp, pr, probeShape, (c) => {
          over++;
          if (over <= 8) { const t = c.translation(); markIm.setMatrixAt(over - 1, _m4.makeTranslation(t.x, 1.35 + 0.08 * Math.sin(time * 6), t.z)); }
          return true;
        }, undefined, undefined, floorCol);
        markIm.count = Math.min(8, over);
        markIm.instanceMatrix.needsUpdate = true;
        edgeMat.color.setHex(over ? 0xf72585 : 0x4cc9f0);
        probeL.position.set(pp.x, 1.45, pp.z);
        probeL.userData.title(over ? `重疊 ${over} 個物體` : "沒有重疊");
        // 4. project a wandering point onto the nearest surface
        const q = { x: 2.2 + 1.5 * Math.sin(time * 0.5), y: 0.5 + 0.25 * Math.sin(time * 0.9), z: 0.6 + 1.0 * Math.sin(time * 0.7) };
        const proj = world.projectPoint(q, false, undefined, undefined, floorCol);
        pDot.position.set(q.x, q.y, q.z);
        if (proj) {
          const p = proj.point;
          qDot.position.set(p.x, p.y, p.z);
          pLine.matrix.copy(beam(q, p));
          projL.userData.title(proj.isInside ? "點在物體內部" : `最近表面 ${Math.hypot(p.x - q.x, p.y - q.y, p.z - q.z).toFixed(2)} m`);
        }
        qDot.visible = pLine.visible = !!proj;
        projL.position.set(q.x, 1.3, q.z);
        if (frameNo++ % 30 === 0) {
          const ray = new R.Ray(L0, dir);
          timeIt("ray", () => world.castRayAndGetNormal(ray, 30, true, undefined, undefined, floorCol));
          timeIt("shape", () => world.castShape(C0, ID, sd, ballShape, 0, 12, true, undefined, undefined, floorCol));
          timeIt("over", () => world.intersectionsWithShape(pp, pr, probeShape, () => true, undefined, undefined, floorCol));
          timeIt("proj", () => world.projectPoint(q, false, undefined, undefined, floorCol));
          setChip(it("每次查詢平均") + it(`射線 <b>${us.ray.toFixed(1)}</b> µs`) + it(`掃掠 <b>${us.shape.toFixed(1)}</b> µs`) + it(`重疊 <b>${us.over.toFixed(1)}</b> µs`) + it(`投影 <b>${us.proj.toFixed(1)}</b> µs`));
        }
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "world.step()・world.profilerEnabled = true・world.timingBroadPhase() / timingNarrowPhase() / timingSolver()・world.numSolverIterations",
    desc: "把方塊與球持續倒進透明容器，逐級加量直到物理拖慢畫面；可切換求解器迭代次數與睡眠，Rapier 內建的效能計時器拆出寬相、窄相、求解各花多少時間。",
    hint: "按「自動加壓」開始，可切換迭代次數與睡眠",
    async mount(ctx) {
      if (!(await boot(ctx))) return;
      ctx.html(`<div class="stress-view"></div>`);
      const host = ctx.$(".stress-view");
      ctx.controls.classList.add("bottom");
      const S = stage(ctx, { host, fov: 48, bg: 0x07080b, orbit: { autoRotate: true, autoRotateSpeed: 0.4, minDistance: 6, maxDistance: 40, maxPolarAngle: Math.PI * 0.48 } });
      lights(S, { shadow: 0, pos: [4, 12, 6], hemi: 1.4, sun: 2.2 });
      const rig = camRig(S);
      // frame the container plus the expected pile height (mean body volume 0.034 m3, about 60 % packing)
      const frame = (n, instant) => { const hp = (n * 0.034) / (81 * 0.6); rig({ t: [0, 1.6 + hp * 0.5, 0], d: [0, 0.75, 1], hw: 5.2, hh: 3.2 + hp * 0.5 }, instant); };
      frame(0, true);
      const world = physWorld(ctx);
      world.profilerEnabled = true;
      const HB = 4.5, st = world.createRigidBody(R.RigidBodyDesc.fixed());
      world.createCollider(R.ColliderDesc.cuboid(HB + 1, 0.5, HB + 1).setTranslation(0, -0.5, 0), st);
      for (const [x, z, hx, hz] of [[HB + 0.25, 0, 0.25, HB], [-HB - 0.25, 0, 0.25, HB], [0, HB + 0.25, HB, 0.25], [0, -HB - 0.25, HB, 0.25]]) {
        world.createCollider(R.ColliderDesc.cuboid(hx, 8, hz).setTranslation(x, 8, z), st);
      }
      floor(S, HB * 2, HB * 2, 0x161b24);
      const cage = new THREE.LineSegments(S.own(new THREE.EdgesGeometry(new THREE.BoxGeometry(HB * 2, 7, HB * 2))), S.own(new THREE.LineBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.45 })));
      cage.position.y = 3.5;
      S.scene.add(cage);
      const CAP = 8000;
      const ims = [new THREE.BoxGeometry(0.34, 0.34, 0.34), new THREE.SphereGeometry(0.18, 12, 8)].map((g) => {
        const im = instanced(S, g, std(0xffffff, { roughness: 0.45 }), CAP);
        im.castShadow = im.receiveShadow = false;
        return im;
      });
      const descs = [R.ColliderDesc.cuboid(0.17, 0.17, 0.17), R.ColliderDesc.ball(0.18)];
      const all = [], lists = [[], []], col = new THREE.Color();
      const paint = (r) => ims[r.kind].setColorAt(r.idx, col.setHex(PALETTE[r.idx % 6]).multiplyScalar(r.asleep ? 0.3 : 1));
      const add = (x, y, z) => {
        const kind = all.length % 3 === 2 ? 1 : 0; // two boxes per sphere
        const body = world.createRigidBody(R.RigidBodyDesc.dynamic().setTranslation(x, y, z).setRotation(qE(rand(0, 3), rand(0, 3), 0)));
        world.createCollider(descs[kind], body);
        const r = { body, kind, idx: lists[kind].length, asleep: false };
        lists[kind].push(body);
        all.push(r);
        paint(r);
      };
      let ms = 0, awake = 0, sleepOn = true;
      const prof = { b: 0, n: 0, s: 0 };
      S.onFrame(() => {
        if (!sleepOn) for (const r of all) r.body.wakeUp();
        const t0 = performance.now();
        world.step(); // exactly one step per frame, so a slow step shows up as a low FPS
        ms += (performance.now() - t0 - ms) * 0.15;
        prof.b += (world.timingBroadPhase() - prof.b) * 0.15;
        prof.n += (world.timingNarrowPhase() - prof.n) * 0.15;
        prof.s += (world.timingSolver() - prof.s) * 0.15;
        awake = 0;
        let recolor = false;
        for (const r of all) {
          const s = r.body.isSleeping();
          if (!s) awake++;
          if (s !== r.asleep) { r.asleep = s; paint(r); recolor = true; }
          setInst(ims[r.kind], r.idx, r.body);
        }
        for (const im of ims) { im.instanceMatrix.needsUpdate = true; if (recolor) im.instanceColor.needsUpdate = true; }
      });
      ctx.group(["迭代 1", "迭代 4（預設）", "迭代 8"], 1, (i) => { world.numSolverIterations = [1, 4, 8][i]; });
      ctx.toggle("允許睡眠", true, (v) => { sleepOn = v; });
      ctx.ramp({
        label: "剛體數", unit: "個",
        steps: [250, 500, 1000, 2000, 3000, 4000, 6000, 8000],
        minFps: 30,
        apply(n) {
          while (all.length > n) { const r = all.pop(); world.removeRigidBody(r.body); lists[r.kind].pop(); }
          let top = 0;
          for (const r of all) top = Math.max(top, r.body.translation().y);
          // new bodies go on a 0.5 m lattice above the current pile, 289 per layer
          for (let k = 0, need = n - all.length; k < need; k++) {
            const s = ((k % 289) * 97) % 289, layer = Math.floor(k / 289); // 97 is coprime to 289: spreads a partial layer over the floor
            add(-4 + (s % 17) * 0.5 + rand(-0.04, 0.04), top + 0.6 + layer * 0.5, -4 + Math.floor(s / 17) * 0.5 + rand(-0.04, 0.04));
          }
          ims[0].count = lists[0].length;
          ims[1].count = lists[1].length;
          for (const im of ims) im.instanceColor.needsUpdate = true;
          frame(n);
        },
        metrics: () => ({
          物理每步: `${ms.toFixed(1)} ms`, 寬相: `${prof.b.toFixed(1)} ms`, 窄相: `${prof.n.toFixed(1)} ms`,
          求解: `${prof.s.toFixed(1)} ms`, 醒著: awake,
        }),
        note: "每格只跑一次 world.step() 並量 JS 端耗時，物理一慢 FPS 就跟著掉。寬相找出可能相撞的配對，窄相計算實際接觸點，求解器依迭代次數反覆修正接觸；開啟睡眠時靜止的物體（變暗）不參與求解，關掉可看全部醒著的成本。繪圖只用兩個 InstancedMesh，但每個剛體每格都要跨 WASM 讀取位置與旋轉。實測對照（Node v24.17.0，同一個容器、方塊與球 2:1，cannon-es 用 SAP、10 次迭代並開睡眠，Rapier 用預設值，300 步平均）：250 個 0.91 對 0.47 ms、500 個 2.66 對 0.31 ms、1000 個 21.67 對 2.74 ms、2000 個 108.36 對 11.35 ms，Rapier 快 1.9 到 9.5 倍；另一輪實測為 2.6 到 18.9 倍，數字隨機器與每次執行而變。",
      });
    },
  },
] });
</script>
</body>
</html>
