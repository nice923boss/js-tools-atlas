<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rellax 示範：分層山景視差</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { height: auto; min-height: 100%; background: #10142a; }
  .scene { position: relative; height: 100vh; min-height: 440px; overflow: hidden;
    background: linear-gradient(#2b1d4f 0%, #6a3a72 38%, #e0795f 66%, #f7c46c 100%); }
  .layer { position: absolute; left: 0; right: 0; pointer-events: none; }
  .layer svg { display: block; width: 100%; height: 100%; }
  .sun { left: 50%; right: auto; top: 44%; width: 150px; height: 150px; margin-left: -75px; border-radius: 50%;
    background: radial-gradient(circle at 45% 40%, #fff3c4, #ffd166 55%, #ff9f5a); box-shadow: 0 0 90px 30px rgba(255,190,110,.55); }
  .stars { top: 0; height: 50%; background-image: radial-gradient(1.5px 1.5px at 12% 22%, #fff, transparent), radial-gradient(1px 1px at 32% 12%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 58% 28%, #fff, transparent), radial-gradient(1px 1px at 76% 10%, #fff, transparent), radial-gradient(1.5px 1.5px at 88% 34%, #fff, transparent),
    radial-gradient(1px 1px at 45% 6%, #fff, transparent), radial-gradient(1px 1px at 22% 40%, #fff, transparent); opacity: .7; }
  .m1 { bottom: 10%; height: 40%; }
  .m2 { bottom: 4%; height: 40%; }
  .m3 { bottom: -6%; height: 36%; }
  .m4 { bottom: -50%; height: 64%; }
  .title { position: absolute; left: 0; right: 0; top: 11%; text-align: center; padding: 0 20px; }
  .title .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: #ffe9a8; }
  .title h1 { margin: 10px 0 6px; font-size: clamp(34px, 8vw, 72px); line-height: 1.05; font-weight: 900; color: #fff7e6; text-shadow: 0 6px 30px rgba(60,20,60,.45); }
  .title p { margin: 0 auto; max-width: 26em; color: rgba(255,247,230,.85); }
  .bird { top: 26%; left: 14%; right: auto; width: 46px; }
  .bird.b2 { top: 32%; left: 74%; width: 34px; }
  .down { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); font-size: 13px; color: #fff; z-index: 6; text-align: center; }
  .down b { display: block; width: 16px; height: 16px; margin: 6px auto 0; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 6px; } }
  .tag { position: absolute; right: 12px; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font: 600 11px var(--mono); }
  /* speed playground below the hero */
  .play { position: relative; background: #10142a; padding: 70px 20px 120px; overflow: hidden; }
  .play h2 { text-align: center; margin: 0 0 6px; font-size: clamp(22px, 4.4vw, 34px); }
  .play > p { text-align: center; color: var(--muted); margin: 0 auto 30px; max-width: 30em; }
  .lanes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; max-width: 760px; margin: 0 auto; height: 520px; }
  .lane { position: relative; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px dashed var(--line); }
  .ball { position: absolute; left: 50%; top: 228px; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%;
    display: grid; place-items: center; font: 800 13px var(--mono); color: #111; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .lane span { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 12px; color: var(--muted); }
  .outro { padding: 40px 20px 120px; text-align: center; background: #10142a; }
  @media (max-width: 520px) { .lanes { gap: 6px; } .ball { width: 44px; height: 44px; margin-left: -22px; font-size: 11px; } .tag { display: none; } }
</style>
</head>
<body class="scroll">
<section class="scene">
  <div class="layer stars rellax" data-rellax-speed="-8"></div>
  <div class="layer sun rellax" data-rellax-speed="-6"></div>
  <div class="title rellax" data-rellax-speed="-4">
    <div class="kicker">RELLAX · 輕量視差</div>
    <h1>山的層次<br>來自速度差</h1>
    <p>每一層山用不同的 data-rellax-speed，越遠越慢，越近越快。</p>
  </div>
  <svg class="layer bird rellax" data-rellax-speed="-2" viewBox="0 0 40 16"><path d="M2 10 Q10 2 20 10 Q30 2 38 10" fill="none" stroke="#3b2245" stroke-width="2.4" stroke-linecap="round"/></svg>
  <svg class="layer bird b2 rellax" data-rellax-speed="-3" viewBox="0 0 40 16"><path d="M2 10 Q10 2 20 10 Q30 2 38 10" fill="none" stroke="#3b2245" stroke-width="2.4" stroke-linecap="round"/></svg>
  <div class="layer m1 rellax" data-rellax-speed="-3"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300 L0 170 L120 90 L230 160 L360 60 L470 150 L600 80 L720 170 L850 70 L980 150 L1100 100 L1200 140 L1200 300Z" fill="#8a4a7c"/></svg><span class="tag" style="top:30%">速度 -3</span></div>
  <div class="layer m2 rellax" data-rellax-speed="-1"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300 L0 150 L150 70 L300 170 L420 110 L560 190 L700 90 L860 180 L1000 100 L1200 170 L1200 300Z" fill="#5b2f62"/></svg><span class="tag" style="top:34%">速度 -1</span></div>
  <div class="layer m3 rellax" data-rellax-speed="1"><svg viewBox="0 0 1200 300" preserveAspectRatio="none"><path d="M0 300 L0 120 L180 190 L330 90 L500 170 L650 110 L800 200 L960 120 L1100 180 L1200 130 L1200 300Z" fill="#37204a"/></svg><span class="tag" style="top:40%">速度 1</span></div>
  <div class="layer m4 rellax" data-rellax-speed="3"><svg viewBox="0 0 1200 640" preserveAspectRatio="none"><path d="M0 640 L0 160 Q200 60 400 150 T800 130 T1200 150 L1200 640Z" fill="#1c1430"/></svg><span class="tag" style="top:22%">速度 3</span></div>
  <div class="down">往下捲<b></b></div>
</section>

<section class="play">
  <h2>速度對照</h2>
  <p>五顆球捲到畫面中央時會排成一列，離中央越遠，速度差造成的偏移越大。負值比捲動慢，正值比捲動快。</p>
  <div class="lanes">
    <div class="lane"><div class="ball rellax-c" data-rellax-speed="-4" style="background:#9d8cff">-4</div><span>最慢</span></div>
    <div class="lane"><div class="ball rellax-c" data-rellax-speed="-2" style="background:#4cc9f0">-2</div><span>較慢</span></div>
    <div class="lane"><div class="ball" style="background:#ecebe6">0</div><span>跟著捲</span></div>
    <div class="lane"><div class="ball rellax-c" data-rellax-speed="2" style="background:#ff8c42">2</div><span>較快</span></div>
    <div class="lane"><div class="ball rellax-c" data-rellax-speed="4" style="background:#f72585">4</div><span>最快</span></div>
  </div>
</section>

<section class="outro">
  <h2>捲回頂端再看一次</h2>
  <p class="muted">Rellax 只做一件事：依速度平移元素，沒有任何相依套件。</p>
</section>

<div class="hint">往下捲，比較每一層的速度</div>

<script src="https://cdn.jsdelivr.net/npm/rellax@1.12.1/rellax.min.js"></script>
<script>
// Hero layers: natural position at page top
const rellax = new Rellax(".rellax");
// Speed lanes: natural position when centered in the viewport
const lanes = new Rellax(".rellax-c", { center: true });
window.addEventListener("resize", () => { rellax.refresh(); lanes.refresh(); });
</script>
</body>
</html>
