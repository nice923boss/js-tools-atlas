<script>
// Rellax showcase: eight scenes from the original sunset hero to a 16k-element transform stress ramp.
const RELLAX = "https://cdn.jsdelivr.net/npm/rellax@1.12.1/rellax.min.js";
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim();
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim();

const FRAME_CSS = `
:root { --bg:#0e1013; --bg-2:#171a1f; --fg:#ecebe6; --muted:#9b998f; --line:rgba(255,255,255,.12);
  --accent:#f7df1e; --c1:#f7df1e; --c2:#4cc9f0; --c3:#f72585; --c4:#7bd389; --c5:#ff8c42; --c6:#9d8cff; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 ${FONT}; -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }
h1, h2, h3, h4, p { margin: 0; }
code, .mono { font: 500 12px/1.4 ${MONO}; }
.muted { color: var(--muted); }
.kicker { font: 600 11px/1 ${MONO}; letter-spacing: .14em; color: var(--accent); }
.hud { position: fixed; z-index: 40; padding: 6px 10px; border-radius: 8px; background: rgba(14,16,19,.88); border: 1px solid var(--line);

// One scene = one same-origin srcdoc iframe with its own window, so Rellax measures that frame's
// viewport and scroll. destroy() leaves its deferred scroll listeners behind; removing the frame drops them.
function rellaxFrame(ctx, host, { body, css = "" }) {
  const f = document.createElement("iframe");
  f.title = "Rellax 捲動區";
  f.srcdoc = `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><style>${FRAME_CSS}${css}</style></head>
<body>${body}<script src="${RELLAX}"><\/script></body></html>`;
  host.append(f);
  ctx.onCleanup(() => f.remove());
  return new Promise((resolve, reject) => {
    f.addEventListener("load", () => {
      const win = f.contentWindow;
      if (!win || !win.Rellax) return reject(new Error("Rellax 無法從 CDN 載入"));
      resolve({ win, doc: win.document, frame: f });
    }, { once: true });
  });
}

// Slow ping-pong auto-scroll over one or more scrollers (window or boxes, x or y axis).
// Any wheel, touch, key or mouse press inside the frame, or an outside scroll, stops it.
function autoScroll(ctx, { speed = 80, rest = [900, 900] } = {}) {
  let on = true, targets = [];
  const btn = ctx.toggle("自動捲動", true, (v) => { on = v; api.sync(); });
  const off = () => { if (on) { on = false; btn.setAttribute("aria-pressed", "false"); } };
  const get = (t) => (t.axis === "x" ? t.el.scrollLeft : t.el.scrollTop);
  const put = (t, v) => { if (t.axis === "x") t.el.scrollLeft = v; else t.el.scrollTop = v; };
  const max = (t) => (t.axis === "x" ? t.el.scrollWidth - t.el.clientWidth : t.el.scrollHeight - t.el.clientHeight);
  const api = {
    speed,
    attach(win, list = [{}]) {
      for (const type of ["wheel", "touchstart", "keydown", "mousedown"]) win.addEventListener(type, off, { passive: true });
      targets = list.map(({ el, axis = "y", k = 1 }) => ({ el: el || win.document.scrollingElement, axis, k, dir: 1, wait: 500, pos: 0, last: 0 }));
      api.sync();
    },
    sync() { for (const t of targets) t.pos = t.last = get(t); },
    // Forget scrollers of a frame that is about to be removed, so its reset scroll does not read as user input.
    detach() { targets = []; },
  };
  ctx.raf((now, dt) => {
    if (!on) return;
    for (const t of targets) if (Math.abs(get(t) - t.last) > 3) return off();
    for (const t of targets) {
      if (t.wait > 0) { t.wait -= dt; continue; }
      const hi = Math.max(0, max(t));
      t.pos += (t.dir * api.speed * t.k * dt) / 1000;
      if (t.pos >= hi) { t.pos = hi; t.dir = -1; t.wait = rest[1]; } else if (t.pos <= 0) { t.pos = 0; t.dir = 1; t.wait = rest[0]; }
      put(t, t.pos);
      t.last = get(t);
    }
  });
  return api;
}

// Read back the translate3d Rellax wrote into an element's inline style.
const T3D = /translate3d\(\s*(-?[\d.]+)px,\s*(-?[\d.]+)px,\s*(-?[\d.]+)px/;
function offsetOf(el) {
  const m = T3D.exec(el.style.transform);
  return m ? { x: +m[1], y: +m[2], z: +m[3] } : { x: 0, y: 0, z: 0 };
}

    async mount(ctx) {
      const host = frameHost(ctx);
      const auto = autoScroll(ctx, { speed: 80 });
      let win = null, doc = null, insts = [], useWrapper = true;
      const PANES = [{ id: "boxA", k: 1, n: 0, rate: 0, last: null }, { id: "boxB", k: 0.7, n: 0, rate: 0, last: null }];
      const make = () => {
        insts.forEach((r) => r.destroy());
        insts = PANES.map((p) => new win.Rellax(`#${p.id} .rl`, {
          center: true,
          wrapper: useWrapper ? doc.getElementById(p.id) : null,
          callback: (pos) => { p.n++; p.last = pos; },
        }));
      };
      ctx.toggle("wrapper", true, (v) => { useWrapper = v; if (win) make(); });
      ({ win, doc } = await rellaxFrame(ctx, host, WRAP));
      make();
      ctx.onCleanup(() => insts.forEach((r) => r.destroy()));
      auto.attach(win, PANES.map((p) => ({ el: doc.getElementById(p.id), k: p.k })));
      const outs = PANES.map((p) => doc.getElementById(`cb-${p.id}`));
      const paint = () => PANES.forEach((p, i) => {
        outs[i].textContent = `callback ${p.rate} 次／秒\n${p.last ? `{ x: ${p.last.x}, y: ${p.last.y} }` : "（尚無）"}`;
      });
      ctx.interval(() => { PANES.forEach((p) => { p.rate = p.n; p.n = 0; }); }, 1000);
      ctx.interval(paint, 200);
      paint();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: 'new Rellax(".grid i", { center: true, callback })',
    desc: "逐級增加視差元素，框內持續快速來回捲動。Rellax 在捲動中的每一幀都對所有元素計算位移並寫入 style.transform（畫面外的也一樣），量測 FPS、初始化耗時與每秒寫入量。",
    hint: "按「自動加壓」開始；調整捲動速度可改變負載",
    async mount(ctx) {
      ctx.html(`<div class="stress-frame"></div>`);
      ctx.controls.classList.add("bottom");
      const auto = autoScroll(ctx, { speed: 1200, rest: [150, 150] });
      ctx.slider("捲動速度", { min: 200, max: 4000, step: 100, value: 1200, format: (v) => `${v}px/s` }, (v) => { auto.speed = v; });
      const { win, doc } = await rellaxFrame(ctx, ctx.$(".stress-frame"), { body: `<div class="grid"></div>`, css: STRESS_CSS });
      const grid = doc.querySelector(".grid");
      let rl = null, initMs = 0, count = 0, frames = 0, rate = 0;
      ctx.onCleanup(() => rl && rl.destroy());
      auto.attach(win);
      ctx.interval(() => { rate = frames; frames = 0; }, 1000);
      const SP = [-3, -2, -1, 1, 2, 3];
      ctx.ramp({
        label: "元素", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000],
        minFps: 30,
        apply(n) {
          if (rl) { rl.destroy(); rl = null; }
          let html = "";
          for (let i = 0; i < n; i++) html += `<i data-rellax-speed="${SP[i % 6]}" style="--c:var(--c${(i % 6) + 1})"></i>`;
          grid.innerHTML = html;
          const t0 = performance.now();
          rl = new win.Rellax(".grid i", { center: true, callback: () => { frames++; } });
          initMs = performance.now() - t0;
          count = n;
          auto.sync();
        },
        metrics: () => ({ "初始化": Showcase.fmtMs(initMs), "重算／秒": Showcase.fmt(rate), "transform 寫入／秒": Showcase.fmtCompact(rate * count) }),
        note: "捲動中的每一幀，Rellax 對全部 n 個元素各算一次位移並寫一次 translate3d，不管元素在不在畫面內；成本隨 n 線性增加，瓶頸在樣式重算與合成。初始化會逐一讀取 getBoundingClientRect。捲動停止時不重算，所以靜止時不吃效能；捲動越快，每幀的位移越大但寫入次數不變。",
      });
    },
  },
] });
</script>
</body>
