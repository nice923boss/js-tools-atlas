<script>
// reveal.js showcase: every scene builds its own embedded deck (embedded: true) inside the stage
// and destroys it on unmount, so keyboard/resize listeners never outlive the scene.
const { h, fmtMs, fmtCompact } = Showcase;
const CDN = "https://cdn.jsdelivr.net/npm/reveal.js@6.0.2/dist/";
const BASE = {
  embedded: true, hash: false, history: false, respondToHashChanges: false,
  scrollActivationWidth: null, // keep slide mode in narrow frames
  margin: 0.06, minScale: 0.1, maxScale: 1.6, center: true,
  controls: true, controlsTutorial: false, progress: true,
  transition: "slide", backgroundTransition: "fade",
  plugins: [RevealHighlight],
};
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// Owns one embedded deck at a time: build() tears down the previous one first.
function deckSlot(ctx, host, base = {}) {
  let deck = null, portrait = null, fixed = null;
  const isPortrait = () => host.clientWidth / Math.max(1, host.clientHeight) < 0.85;
  const sizeFor = (p) => fixed || (p ? { width: 600, height: 900 } : { width: 960, height: 600 });
  const kill = () => {
    const d = deck;
    deck = null;
    if (d) d.destroy();
    host.replaceChildren();
  };
  ctx.onCleanup(kill);
  ctx.onResize(() => {
    if (!deck) return;
    const p = isPortrait();
    if (p !== portrait) {
      portrait = p;
      host.classList.toggle("rv-portrait", p);
      if (!fixed) deck.configure(sizeFor(p));
    }
    deck.layout();
  });
  return {
    get deck() { return deck; },
    async build(fill, opts = {}) {
      kill();
      const slides = h("div", { class: "slides" });
      const root = h("div", { class: "reveal" }, slides);
      host.append(root);
      if (typeof fill === "string") slides.innerHTML = fill; else fill(slides);
      portrait = isPortrait();
      host.classList.toggle("rv-portrait", portrait);
      const d = new Reveal(root, {
        ...BASE, ...sizeFor(portrait), ...base, ...opts,
        // Arrow keys only drive the deck after it was clicked, and never while the tab bar has focus.
        keyboardCondition: (e) => d.isFocused() && (e.target === document.body || root.contains(e.target)),
      });
      deck = d;
      await d.initialize();
      if (deck !== d || !ctx.active) { if (deck !== d) d.destroy(); return null; }
      // Give the fresh deck keyboard focus so arrows work without an extra click.
      root.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
      return d;
    },
    setFixed(size) {
      fixed = size;
      if (deck) deck.configure(sizeFor(isPortrait()));
    },
  };
}

// Small event log rendered into an <ol>.
function eventLog(list, max = 9) {
  const rows = [];
  return (name, text = "") => {
    rows.unshift(`<li><code>${name}</code>${esc(text)}</li>`);
    rows.length = Math.min(rows.length, max);
    list.innerHTML = rows.join("");
  };
}

const COLORS = ["var(--c2)", "var(--c3)", "var(--c1)", "var(--c4)", "var(--c5)", "var(--c6)"];

Showcase.run({ scenes: [
  {

        works.append(h("span", { class: "card new", text: `新作品：${NEW[added++ % NEW.length]}` }));

  },
  {
    id: "fragments", title: "片段動畫",
    api: 'class="fragment fade-up" data-fragment-index="2"',
    desc: "同一張投影片分段出現：進場、強調、退場三類效果，以及用 data-fragment-index 打亂顯示順序。",
    hint: "按「下一步」或 → 逐段播放，右側即時記錄 fragmentshown 事件",
    async mount(ctx) {
      ctx.html(`<div class="rv-split"><div class="rv-host"></div><aside class="rv-side">
        <h4>目前位置</h4><div class="rv-num rv-pos">…</div>
        <h4>事件紀錄</h4><ol class="rv-log"></ol></aside></div>`);
      const cell = (cls, label) => `<div class="rv-cell"><code>${cls || "（預設）"}</code><span class="fragment ${cls} rv-chip">${label}</span></div>`;
      const page = (title, list) => `<section><h3>${title}</h3><div class="rv-fx">${list.map(([c, l]) => cell(c, l)).join("")}</div></section>`;
      const slides = [
        page("進場效果", [["", "淡入"], ["fade-up", "由下往上"], ["fade-down", "由上往下"], ["fade-left", "由右往左"], ["fade-right", "由左往右"], ["zoom-in", "放大出現"]]),
        page("強調效果", [["grow", "放大"], ["shrink", "縮小"], ["strike", "刪除線"], ["highlight-red", "變紅"], ["highlight-green", "變綠"], ["highlight-blue", "變藍"]]),
        page("退場與目前", [["fade-out", "淡出"], ["semi-fade-out", "半透明"], ["fade-in-then-out", "出現後消失"], ["fade-in-then-semi-out", "出現後變淡"], ["current-visible", "只在當下"], ["highlight-current-blue", "當下變藍"]]),
        `<section><h3>自訂順序</h3><div class="rv-order">
          <span class="fragment rv-chip" data-fragment-index="3">DOM 第 1 個・第 4 步</span>
          <span class="fragment rv-chip" data-fragment-index="1">DOM 第 2 個・第 2 步</span>
          <span class="fragment rv-chip" data-fragment-index="1">DOM 第 3 個・也是第 2 步</span>
          <span class="fragment rv-chip" data-fragment-index="0">DOM 第 4 個・第 1 步</span>
          <span class="fragment fade-up" data-fragment-index="2"><span class="fragment highlight-red rv-chip" data-fragment-index="4">巢狀：先出現，第 5 步再變紅</span></span>
        </div></section>`,
      ].join("");
      const slot = deckSlot(ctx, ctx.$(".rv-host"));
      const deck = await slot.build(slides, { transition: "fade" });
      if (!deck) return;
      const log = eventLog(ctx.$(".rv-log"));
      const pos = ctx.$(".rv-pos");
      const paint = () => {
        const { h: hi, f } = deck.getIndices();
        const total = new Set([...deck.getCurrentSlide().querySelectorAll(".fragment")].map((x) => x.dataset.fragmentIndex)).size;
        pos.textContent = `第 ${hi + 1} / 4 頁・片段 ${(f ?? -1) + 1} / ${total}`;
      };
      const desc = (e) => { const f = e.fragment; return `${[...f.classList].filter((c) => c !== "fragment" && c !== "rv-chip" && c !== "visible" && c !== "current-fragment").join(" ") || "（預設）"} #${f.dataset.fragmentIndex}`; };
      deck.on("fragmentshown", (e) => { log("shown", desc(e)); paint(); });
      deck.on("fragmenthidden", (e) => { log("hidden", desc(e)); paint(); });
      deck.on("slidechanged", (e) => { log("slide", `indexh ${e.indexh}`); paint(); });
      paint();
      // Self-play the first page once so the effects are visible; any user input stops it.
      let demo = true;
      const stopDemo = () => { demo = false; };
      ctx.on(ctx.el, "pointerdown", stopDemo, { capture: true });
      ctx.on(document, "keydown", stopDemo, { capture: true });
      ctx.interval(() => {
        if (!demo) return;
        const { h: hi, f } = deck.getIndices();
        if (hi === 0 && (f ?? -1) < 5) deck.next(); else demo = false;
      }, 650);
      ctx.button("上一步", () => deck.prev());
      ctx.button("下一步", () => deck.next(), { primary: true });
      ctx.button("本頁重播", () => { deck.slide(deck.getIndices().h, 0, -1); paint(); });
    },
  },
  {
    id: "backgrounds", title: "轉場與背景",
    api: 'data-background-image / -gradient / -iframe・configure({ transition })',
    desc: "五種背景（純色、漸層、圖片、可互動 iframe、逐頁轉場覆寫），並即時切換轉場類型、速度與自動播放。",
    hint: "切換上方選單後翻頁比較；第 4 頁的 iframe 按鈕可以直接點",
    async mount(ctx) {
      ctx.html(`<div class="rv-host"></div>`);
      const attr = (s) => `<p><code class="rv-attr">${esc(s)}</code></p>`;
      const slides = [
        `<section data-background-color="#1d3557"><h2>純色背景</h2>${attr('data-background-color="#1d3557"')}</section>`,
        `<section data-background-gradient="linear-gradient(135deg, #f72585, #7209b7 55%, #3a0ca3)"><h2>漸層背景</h2>${attr('data-background-gradient="linear-gradient(…)"')}</section>`,
        `<section data-background-image="_shared/img/photo-3.jpg" data-background-size="cover" data-background-opacity="0.85"><div class="rv-glass"><h2>圖片背景</h2>${attr('data-background-image="photo-3.jpg"')}</div></section>`,
        `<section data-background-iframe="${IFRAME_BG}" data-background-interactive><div class="rv-glass" style="pointer-events:none"><h2>iframe 背景</h2>${attr("data-background-interactive")}</div></section>`,
        `<section data-transition="zoom" data-background-image="_shared/img/photo-6.jpg" data-background-size="cover"><div class="rv-glass"><h2>這頁固定用 zoom</h2>${attr('data-transition="zoom"')}</div></section>`,
      ].join("");
      const slot = deckSlot(ctx, ctx.$(".rv-host"));
      ctx.select("轉場", ["slide", "fade", "convex", "concave", "zoom", "none"], "slide", (v) => slot.deck?.configure({ transition: v }));
      ctx.group(["快", "預設", "慢"], 1, (i) => slot.deck?.configure({ transitionSpeed: ["fast", "default", "slow"][i] }));
      ctx.select("背景轉場", ["fade", "slide", "convex", "zoom", "none"], "fade", (v) => slot.deck?.configure({ backgroundTransition: v }));
      ctx.toggle("自動播放", false, (v) => slot.deck?.configure({ autoSlide: v ? 2200 : 0, loop: v }));
      await slot.build(slides, { slideNumber: "c/t" });
    },
  },
  {
    id: "markdown", title: "Markdown 投影片",
    api: "plugins: [RevealMarkdown]・<section data-markdown>",
    desc: "用 Markdown 寫投影片：--- 分水平頁、-- 分垂直頁、註解設定片段與背景，程式碼區塊支援逐行高亮。",
    hint: "直接修改左邊的 Markdown，右邊會重新產生簡報",
    async mount(ctx) {
      ctx.html(`<div class="rv-split rv-md"><div class="rv-editor"><header><b>Markdown 原稿</b><span class="rv-mdinfo">…</span></header>
        <textarea spellcheck="false" aria-label="Markdown 原稿"></textarea></div><div class="rv-host"></div></div>`);
      if (!window.RevealMarkdown) await ctx.load(CDN + "plugin/markdown.js");
      const ta = ctx.$("textarea");
      const info = ctx.$(".rv-mdinfo");
      ta.value = MD;
      const slot = deckSlot(ctx, ctx.$(".rv-host"), { plugins: [RevealMarkdown, RevealHighlight] });
      const render = async () => {
        const keep = slot.deck ? slot.deck.getIndices() : { h: 0, v: 0 };
        const t0 = performance.now();
        const deck = await slot.build((s) => {
          const ta2 = h("textarea", { "data-template": "" });
          ta2.textContent = ta.value;
          s.append(h("section", { "data-markdown": "", "data-separator": "\\r?\\n---\\r?\\n", "data-separator-vertical": "\\r?\\n--\\r?\\n" }, ta2));
        }, { slideNumber: "h.v" });
        if (!deck) return;
        info.textContent = `${deck.getTotalSlides()} 張・${fmtMs(performance.now() - t0)}`;
        deck.slide(Math.min(keep.h, deck.getHorizontalSlides().length - 1), keep.v || 0);
      };
      let timer = 0;
      ctx.on(ta, "input", () => { clearTimeout(timer); timer = setTimeout(() => ctx.active && render(), 450); });
      ctx.onCleanup(() => clearTimeout(timer));
      await render();
    },
  },
  {
    id: "auto-animate", title: "Auto-Animate",
    api: "data-auto-animate・data-id・configure({ autoAnimateDuration })",
    desc: "相鄰兩頁有相同 data-id 的元素會自動補間：長條重新排序、變形成圓、程式碼逐行長出來。",
    hint: "翻頁看補間；調整秒數與緩動曲線比較差異（示意資料）",
    async mount(ctx) {
      ctx.html(`<div class="rv-host"></div>`);
      const STATIONS = ["台北車站", "市政府", "西門", "板橋", "中山"];
      const bars = (vals) => {
        const order = vals.map((v, i) => [v, i]).sort((a, b) => b[0] - a[0]);
        const max = order[0][0];
        return `<div class="rv-bars">${order.map(([v, i]) =>
          `<div class="rv-bar" data-id="b${i}" style="width:${(v / max) * 100}%;background:${COLORS[i]}"><b>${STATIONS[i]}</b><span>${v}</span></div>`).join("")}</div>`;
      };
      const balls = (vals) => `<div class="rv-balls">${vals.map((v, i) =>
        `<div class="rv-bar rv-ball" data-id="b${i}" style="background:${COLORS[(i + 2) % 6]}">${STATIONS[i]}</div>`).join("")}</div>`;
      const code1 = "const deck = new Reveal(el);\nawait deck.initialize();";
      const code2 = code1 + "\n\ndeck.on(\"slidechanged\", (e) => {\n  console.info(e.indexh);\n});\ndeck.slide(2);";
      const slides = [
        `<section data-auto-animate><h3 data-id="t">捷運站進站人次・平日</h3>${bars([18, 12, 9, 11, 7])}<p class="rv-cap">單位：千人（示意資料）</p></section>`,
        `<section data-auto-animate><h3 data-id="t">捷運站進站人次・假日</h3>${bars([14, 15, 17, 8, 10])}<p class="rv-cap">同一個 data-id 會移動並改變寬度</p></section>`,
        `<section data-auto-animate><h3 data-id="t">變形成圓</h3>${balls([0, 0, 0, 0, 0])}<p class="rv-cap">寬高、圓角、顏色一起補間</p></section>`,
        `<section data-auto-animate><h3 data-id="t">程式碼也能補間</h3><pre data-id="code"><code class="language-js" data-trim data-line-numbers>${esc(code1)}</code></pre></section>`,
        `<section data-auto-animate><h3 data-id="t">程式碼也能補間</h3><pre data-id="code"><code class="language-js" data-trim data-line-numbers>${esc(code2)}</code></pre></section>`,
      ].join("");
      const slot = deckSlot(ctx, ctx.$(".rv-host"));
      ctx.slider("秒數", { min: 0.2, max: 2.5, step: 0.1, value: 1, format: (v) => `${v.toFixed(1)} 秒` }, (v) => slot.deck?.configure({ autoAnimateDuration: v }));
      ctx.select("緩動", [
        { value: "ease", label: "ease" }, { value: "ease-in-out", label: "ease-in-out" }, { value: "linear", label: "linear" },
        { value: "cubic-bezier(.68,-0.6,.32,1.6)", label: "回彈" },
      ], "ease", (v) => slot.deck?.configure({ autoAnimateEasing: v }));
      ctx.toggle("自動播放", false, (v) => slot.deck?.configure({ autoSlide: v ? 2000 : 0, loop: v }));
      await slot.build(slides, { autoAnimateDuration: 1, transition: "none", slideNumber: "c/t" });
    },
  },
  {
    id: "api", title: "API 與事件",
    api: "deck.slide(h, v)・getState()・setState()・toggleOverview()・on('slidechanged')",
    desc: "從外部程式控制簡報：跳頁、總覽、記住並還原狀態、切換比例，右側即時顯示索引、進度與事件。",
    hint: "點右側小地圖跳頁；切換「比例」觀察 resize 事件回報的縮放倍率",
    async mount(ctx) {
      ctx.html(`<div class="rv-split"><div class="rv-host"></div><aside class="rv-side">
        <h4>getIndices()・getProgress()</h4><div><span class="rv-num rv-idx">…</span><div class="rv-prog"><i></i></div></div>
        <h4>小地圖（點一下跳頁）</h4><div class="rv-map"></div>
        <h4>getState()</h4><pre class="rv-state">尚未記錄</pre>
        <h4>事件紀錄</h4><ol class="rv-log"></ol></aside></div>`);
      const sec = (t, sub, extra = "") => `<section data-background-gradient="radial-gradient(70% 70% at 50% 0%, rgba(76,201,240,.16), transparent 70%)"><h2>${t}</h2><p class="rv-sub">${sub}</p>${extra}</section>`;
      const slides = [
        sec("1　開場", "按 → 或用右側按鈕"),
        `<section>${sec("2-1　第二章", "按 ↓ 進入垂直頁")}${sec("2-2　有片段", "這頁有三個片段",
          `<p><span class="fragment rv-chip">一</span> <span class="fragment rv-chip">二</span> <span class="fragment rv-chip">三</span></p>`)}${sec("2-3　垂直最後一頁", "deck.slide(1, 2)")}</section>`,
        sec("3　第三章", "getTotalSlides() 會算進垂直頁"),
        sec("4　結尾", "按 Esc 或「總覽」看全部"),
      ].join("");
      const slot = deckSlot(ctx, ctx.$(".rv-host"));
      const deck = await slot.build(slides, { slideNumber: "h.v" });
      if (!deck) return;
      const log = eventLog(ctx.$(".rv-log"), 7);
      const idx = ctx.$(".rv-idx"), bar = ctx.$(".rv-prog i"), map = ctx.$(".rv-map"), stateEl = ctx.$(".rv-state");
      const cells = deck.getHorizontalSlides().map((hs, hi) => {
        const vs = hs.querySelectorAll(":scope > section");
        const col = h("div");
        const btns = Array.from({ length: Math.max(1, vs.length) }, (_, vi) =>
          h("button", { type: "button", text: `${hi + 1}-${vi + 1}`, onclick: () => deck.slide(hi, vi) }));
        col.append(...btns);
        map.append(col);
        return btns;
      });
      const paint = () => {
        const { h: hi, v, f } = deck.getIndices();
        idx.textContent = `h ${hi}・v ${v}・f ${f ?? "無"}・共 ${deck.getTotalSlides()} 張`;
        bar.style.width = `${deck.getProgress() * 100}%`;
        cells.forEach((col, ci) => col.forEach((b, vi) => b.classList.toggle("on", ci === hi && vi === v)));
      };
      let saved = null;
      deck.on("slidechanged", (e) => { log("slidechanged", `h ${e.indexh} v ${e.indexv}`); paint(); });
      deck.on("fragmentshown", () => { log("fragmentshown"); paint(); });
      deck.on("fragmenthidden", () => { log("fragmenthidden"); paint(); });
      deck.on("overviewshown", () => { log("overviewshown"); ov.setAttribute("aria-pressed", "true"); });
      deck.on("overviewhidden", () => { log("overviewhidden"); ov.setAttribute("aria-pressed", "false"); });
      deck.on("resize", (e) => log("resize", `scale ${e.scale.toFixed(2)}`));
      ctx.button("◀", () => deck.prev(), { title: "deck.prev()" });
      ctx.button("▶", () => deck.next(), { title: "deck.next()", primary: true });
      ctx.button("跳到 2-3", () => deck.slide(1, 2));
      const ov = ctx.toggle("總覽", false, (v) => deck.toggleOverview(v));
      ctx.button("記下狀態", () => { saved = deck.getState(); stateEl.textContent = JSON.stringify(saved); log("getState"); });
      ctx.button("還原", () => { if (saved) { deck.setState(saved); log("setState"); } });
      const SIZES = { 自動: null, "16:9": { width: 960, height: 540 }, "4:3": { width: 960, height: 720 }, "1:1": { width: 720, height: 720 } };
      ctx.select("比例", Object.keys(SIZES), "自動", (k) => slot.setFixed(SIZES[k]));
      paint();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new Reveal(el).initialize()・deck.sync()・deck.next()",
    desc: "一次建立 N 張有漸層背景的投影片，量初始化與 sync() 耗時，同時每 0.6 秒自動換頁量轉場 FPS。",
    hint: "按「自動加壓」逐級增加投影片張數",
    async mount(ctx) {
      ctx.html(`<div class="rv-host rv-stress"></div>`);
      const host = ctx.$(".rv-stress");
      const slot = deckSlot(ctx, host);
      const m = { init: 0, sync: 0, nav: 0, nodes: 0 };
      const build = (n) => {
        let out = "";
        for (let i = 0; i < n; i++) {
          const hue = (i * 37) % 360;
          out += `<section data-background-gradient="linear-gradient(135deg, hsl(${hue} 70% 22%), hsl(${(hue + 60) % 360} 70% 12%))">` +
            `<h2>第 ${i + 1} 張</h2><ul><li>投影片總數 ${n}</li><li>背景色相 ${hue}°</li><li class="fragment">片段 ${i + 1}</li></ul></section>`;
        }
        return out;
      };
      ctx.interval(() => {
        const d = slot.deck;
        if (!d || !d.isReady()) return;
        const t = performance.now();
        d.next();
        m.nav = performance.now() - t;
      }, 600);
      ctx.ramp({
        label: "投影片", unit: "張",
        steps: [10, 50, 100, 250, 500, 1000, 2000, 4000],
        async apply(n) {
          const t0 = performance.now();
          const d = await slot.build(build(n), { slideNumber: "c/t", loop: true, controls: false });
          if (!d) return;
          m.init = performance.now() - t0;
          const t1 = performance.now();
          d.sync();
          m.sync = performance.now() - t1;
          m.nodes = host.getElementsByTagName("*").length;
        },
        metrics: () => ({ "初始化": fmtMs(m.init), "sync()": fmtMs(m.sync), "換頁呼叫": fmtMs(m.nav), "DOM 節點": fmtCompact(m.nodes) }),
        note: "每一級重建一份 N 張投影片的簡報（每張有漸層背景、清單與一個片段），記錄 initialize() 與 sync() 耗時，並每 0.6 秒呼叫 next() 量換頁時的 FPS。reveal 只顯示 viewDistance 範圍內的投影片，所以換頁 FPS 主要受背景與排版影響，初始化與 sync() 則隨張數成長。",
      });
    },
  },
] });
</script>
