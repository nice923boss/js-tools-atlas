<style>

<script>
const { h, fmt, fmtCompact } = Showcase;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const MONO = '"JetBrains Mono", Consolas, "Courier New", "Microsoft JhengHei", monospace';
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const C = ROT.Color;

// ROT.Display runs an endless rAF loop and has no destroy(); stop it and drop the canvas on unmount.
function makeDisplay(ctx, parent, opts) {
  const d = new ROT.Display({ fontFamily: MONO, bg: "#08090c", width: 10, height: 10, fontSize: 12, ...opts });
  const c = d.getContainer();
  parent.append(c);
  ctx.onCleanup(() => { d._tick = () => {}; c.remove(); });
  return d;
}
// Square cells (forceSquareRatio) sized to fit aw x ah CSS pixels, drawn at device resolution.
function fitSquare(d, W, H, aw, ah, min = 4) {
  const fs = Math.max(min, Math.floor(Math.min(aw / W, ah / H) * DPR));
  d.setOptions({ width: W, height: H, fontSize: fs });
  const c = d.getContainer();
  c.style.width = c.width / DPR + "px";
  c.style.height = c.height / DPR + "px";
  return fs / DPR;
}
// A dark pane with a caption row on top and a view area for a canvas.
function pane(parent, cls = "") {
  const tag = h("div", { class: "rot-tag" }), view = h("div", { class: "rot-view" });
  const el = h("div", { class: `rot-pane ${cls}` }, tag, view);
  parent.append(el);
  const set = (fn, line) => { tag.innerHTML = `<b>${fn}</b><span>${line}</span>`; };
  set("&nbsp;", "&nbsp;"); // reserve both lines so later text does not resize the view
  return { el, tag, view, set };
}
// Size a canvas to its box at device resolution; the returned context draws in CSS pixels.
function sizeCanvas(cv, box) {
  const w = Math.max(1, box.clientWidth), hh = Math.max(1, box.clientHeight);
  const pw = Math.round(w * DPR), ph = Math.round(hh * DPR);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  cv.style.width = w + "px"; cv.style.height = hh + "px";
  const g = cv.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return { g, w, h: hh };
}
function watch(ctx, el, fn) {
  const ro = new ResizeObserver(() => ctx.active && fn());
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
}
const randomFloor = (grid, W) => { let i; do { i = ROT.RNG.getUniformInt(0, grid.length - 1); } while (!grid[i]); return { x: i % W, y: (i / W) | 0 }; };
const newSeed = () => 1 + Math.floor(Math.random() * 99998);

// Taiwanese township names: training corpus for ROT.StringGenerator.
const PLACES = "板橋 三重 中和 永和 新莊 新店 樹林 鶯歌 三峽 淡水 汐止 瑞芳 土城 蘆洲 五股 泰山 林口 深坑 石碇 坪林 三芝 石門 八里 平溪 雙溪 貢寮 金山 萬里 烏來 中壢 大溪 楊梅 蘆竹 大園 龜山 八德 龍潭 平鎮 新屋 觀音 竹北 竹東 新埔 關西 湖口 新豐 橫山 北埔 寶山 峨眉 頭份 竹南 苑裡 通霄 後龍 卓蘭 大湖 公館 銅鑼 南庄 頭屋 三義 豐原 東勢 大甲 清水 沙鹿 梧棲 后里 神岡 潭子 大雅 新社 石岡 外埔 大安 烏日 大肚 龍井 霧峰 太平 大里 鹿港 和美 線西 伸港 福興 秀水 花壇 芬園 員林 溪湖 田中 大村 埔鹽 埔心 永靖 社頭 二水 北斗 二林 田尾 埤頭 芳苑 竹塘 溪州 埔里 草屯 竹山 集集 名間 鹿谷 中寮 魚池 國姓 水里 信義 仁愛 斗六 斗南 虎尾 西螺 土庫 北港 古坑 大埤 莿桐 林內 二崙 崙背 麥寮 褒忠 元長 四湖 口湖 水林 朴子 布袋 大林 民雄 溪口 新港 六腳 東石 義竹 鹿草 太保 水上 中埔 竹崎 梅山 番路 新營 鹽水 白河 柳營 後壁 麻豆 下營 六甲 官田 大內 佳里 學甲 西港 七股 將軍 北門 新化 善化 新市 安定 山上 玉井 楠西 南化 左鎮 仁德 歸仁 關廟 龍崎 永康 鳳山 林園 大寮 大樹 大社 仁武 鳥松 岡山 橋頭 燕巢 田寮 阿蓮 路竹 湖內 茄萣 彌陀 梓官 旗山 美濃 六龜 甲仙 杉林 內門 茂林 桃源 潮州 東港 恆春 萬丹 長治 麟洛 九如 里港 鹽埔 高樹 萬巒 內埔 竹田 新埤 枋寮 新園 崁頂 林邊 南州 佳冬 琉球 車城 滿州 枋山 羅東 蘇澳 頭城 礁溪 壯圍 員山 冬山 五結 三星 南澳 鳳林 玉里 新城 吉安 壽豐 光復 豐濱 瑞穗 富里 秀林 萬榮 卓溪 成功 關山 卑南 鹿野 池上 東河 長濱 太麻里 大武 綠島 海端 延平 金峰 達仁 蘭嶼 馬公 湖西 白沙 西嶼 望安 七美".split(" ");

Showcase.run({
  scenes: [
    // ---------- 1. dungeon crawler (port of the original demo) ----------
    {
      id: "dungeon", title: "地城探索",
      api: "Map.Digger・Map.Cellular・FOV.PreciseShadowcasting・Path.AStar・Color.interpolate",
      desc: "原版示範的移植：每層用 Digger（房間走廊）或 Cellular（洞穴）即時產生，玩家視野用 PreciseShadowcasting 計算並記住走過的地方，怪物發現你後用 A* 追過來（被驚動的怪物底色轉紅），點地圖會沿已探索的格子自動走過去。沒有操作時是自動探索的展示模式。",
      hint: "方向鍵／WASD 移動，點地圖自動走，撞怪攻擊，走到 > 下樓",
      mount(ctx) {
        ctx.html(`<div class="board rot-dun">
          <div class="rot-hud"></div><div class="rot-wrap"></div><div class="rot-log"></div>
          <div class="rot-ov"><div class="card"><h1>地城探索</h1><p>每層即時產生，視野用陰影投射計算</p><p class="blink">按任意鍵或點擊開始</p></div></div>
          <div class="rot-flash"></div></div>`);
        const board = ctx.$(".rot-dun"), hudEl = ctx.$(".rot-hud"), wrap = ctx.$(".rot-wrap"), logEl = ctx.$(".rot-log");
        const ov = ctx.$(".rot-ov"), [ovTitle, ovSub, ovGo] = ctx.$$(".rot-ov h1, .rot-ov p"), flashEl = ctx.$(".rot-flash");
        const WALL = 0, FLOOR = 1, DOOR = 2, OPEN = 3, STAIRS = 4, RADIUS = 7, MAX_HP = 6;
        const DIRS8 = ROT.DIRS[8];
        const MONSTERS = {
          rat: { ch: "r", fg: "#d9c2a7", name: "老鼠", hp: 1 },
          goblin: { ch: "g", fg: "#7bd389", name: "哥布林", hp: 2 },
          bat: { ch: "b", fg: "#b9a8ff", name: "蝙蝠", hp: 1 },
        };
        const ITEMS = { gold: { ch: "$", fg: "#ffd166" }, potion: { ch: "!", fg: "#f72585" } };
        // light ramps: [near, far] for lit tiles, single value for remembered tiles
        const LIT = {
          floorBg: [[66, 50, 30], [22, 22, 28]], floorFg: [[170, 140, 96], [70, 70, 82]],
          wallBg: [[104, 80, 50], [40, 40, 50]], wallFg: [[232, 196, 132], [96, 96, 112]],
        };
        const MEM = { floorBg: [14, 16, 22], floorFg: [42, 50, 66], wallBg: [24, 28, 38], wallFg: [60, 70, 92] };
        const UNKNOWN = "#0b0c0f", ALERT = [150, 30, 60];

        let kind = "dungeon", reveal = false, mode = "demo"; // demo | play | over
        let W = 40, H = 24, map = null, explored, visible = new Map();
        let player = { x: 0, y: 0 }, items = new Map(), monsters = [];
        let depth = 1, hp = MAX_HP, gold = 0, kills = 0, logs = [], walkQueue = [], overAt = 0;

        const inb = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
        const passable = (t) => t !== WALL;
        const transparent = (t) => t === FLOOR || t === OPEN || t === STAIRS;
        const monsterAt = (x, y) => monsters.find((m) => m.x === x && m.y === y);
        const cheb = (a, b) => Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));

        ctx.group(["房間走廊", "洞穴"], 0, (i) => {
          kind = i ? "cave" : "dungeon";
          generate();
          log(i ? "改用細胞自動機產生洞穴（Cellular）" : "改用房間走廊產生器（Digger）");
        });
        ctx.toggle("透視全圖", false, (v) => { reveal = v; render(); });
        ctx.button("重新生成", () => { generate(); log("重新產生這一層"); }, { primary: true });

        const display = makeDisplay(ctx, wrap, { width: W, height: H, fontSize: 16, forceSquareRatio: true, bg: UNKNOWN, fontStyle: "bold" });
        const canvas = display.getContainer();
        const fov = new ROT.FOV.PreciseShadowcasting((x, y) => inb(x, y) && transparent(map[x + y * W]), { topology: 8 });

        function fit() {
          if (!map) return;
          fitSquare(display, W, H, wrap.clientWidth, wrap.clientHeight, 6);
          render();
        }
        function bfsFrom(start, ok) {
          const dist = new Int32Array(W * H).fill(-1), queue = [start];
          dist[start] = 0;
          for (let q = 0; q < queue.length; q++) {
            const c = queue[q], cx = c % W, cy = (c / W) | 0;
            for (const [dx, dy] of DIRS8) {
              const nx = cx + dx, ny = cy + dy, n = nx + ny * W;
              if (inb(nx, ny) && dist[n] < 0 && ok(n)) { dist[n] = dist[c] + 1; queue.push(n); }
            }
          }
          return { dist, order: queue };
        }
        function generate() {
          const aw = wrap.clientWidth || 640, ah = wrap.clientHeight || 400;
          // pick a map size that keeps cells readable for the current viewport
          const cell = Math.max(14, Math.min(22, Math.floor(Math.min(aw / 40, ah / 24))));
          W = Math.max(20, Math.floor(aw / cell));
          H = Math.max(14, Math.floor(ah / cell));
          map = new Uint8Array(W * H);
          explored = new Uint8Array(W * H);
          let start = -1;
          if (kind === "dungeon") {
            const dg = new ROT.Map.Digger(W, H, { roomWidth: [3, 9], roomHeight: [3, 6], corridorLength: [2, 7], dugPercentage: 0.34 });
            dg.create((x, y, v) => { if (!v) map[x + y * W] = FLOOR; });
            const rooms = dg.getRooms();
            for (const r of rooms) r.getDoors((x, y) => { if (ROT.RNG.getUniform() < 0.5) map[x + y * W] = DOOR; });
            const [cx, cy] = rooms[0].getCenter();
            start = cx + cy * W;
          } else {
            const cv = new ROT.Map.Cellular(W, H);
            cv.randomize(0.53);
            for (let i = 0; i < 4; i++) cv.create();
            cv.connect((x, y, v) => { if (v === 1 && x > 0 && y > 0 && x < W - 1 && y < H - 1) map[x + y * W] = FLOOR; }, 1);
          }
          const floors = [];
          for (let i = 0; i < W * H; i++) if (map[i] === FLOOR) floors.push(i);
          if (start < 0 || map[start] !== FLOOR) start = ROT.RNG.getItem(floors);
          player = { x: start % W, y: (start / W) | 0 };
          // stairs go on the floor tile farthest from the start
          const { dist, order } = bfsFrom(start, (n) => map[n] !== WALL);
          map[order[order.length - 1]] = STAIRS;
          const free = ROT.RNG.shuffle(floors.filter((i) => i !== start && map[i] === FLOOR));
          items = new Map();
          monsters = [];
          const nGold = Math.max(3, Math.round(floors.length / 55)), nPotion = 2;
          for (let k = 0; k < nGold + nPotion && free.length; k++) items.set(free.pop(), k < nGold ? "gold" : "potion");
          const nMon = Math.min(3 + depth * 2, Math.round(floors.length / 30));
          for (const i of free) {
            if (monsters.length >= nMon) break;
            if (dist[i] < 8) continue;
            const type = ROT.RNG.getWeightedValue({ rat: 4, goblin: depth > 1 ? 3 : 1, bat: 2 });
            monsters.push({ x: i % W, y: (i / W) | 0, type, hp: MONSTERS[type].hp, alert: 0 });
          }
          walkQueue = [];
          computeFov();
          fit();
          hud();
        }
        function computeFov() {
          visible = new Map();
          fov.compute(player.x, player.y, RADIUS, (x, y, r, vis) => {
            if (!vis || !inb(x, y)) return;
            const i = x + y * W;
            visible.set(i, r);
            explored[i] = 1;
          });
        }
        const mix = (pair, f) => C.toRGB(C.interpolate(pair[0], pair[1], f));
        const glyph = (t) => (t === WALL ? "#" : t === DOOR ? "+" : t === OPEN ? "'" : t === STAIRS ? ">" : "·");
        function render() {
          if (!map) return;
          const now = performance.now() / 1000;
          const flicker = Math.sin(now * 9) * 0.04 + Math.sin(now * 23) * 0.03;
          for (let y = 0; y < H; y++) {
            for (let x = 0; x < W; x++) {
              const i = x + y * W, t = map[i], r = visible.get(i);
              const wall = t === WALL;
              let ch = glyph(t), fg, bg;
              if (r !== undefined) {
                const f = Math.max(0, Math.min(1, r / (RADIUS + 0.5) + flicker));
                bg = mix(wall ? LIT.wallBg : LIT.floorBg, f);
                fg = mix(wall ? LIT.wallFg : LIT.floorFg, f);
                if (t === DOOR || t === OPEN) fg = "#ff8c42";
                if (t === STAIRS) fg = "#4cc9f0";
                const it = items.get(i);
                if (it) { ch = ITEMS[it].ch; fg = ITEMS[it].fg; }
                const m = monsterAt(x, y);
                if (m) {

            y -= ROT.Text.measure(lines[i], LW).height;
            if (y < 0) break;
            d.drawText(0, y, lines[i], LW);
          }
          LG.set("Display.drawText(x, y, \"%c{色}…\")", `ROT.Engine 等 act() 的 Promise 完成才換下一位`);
        }
        ctx.group(["Simple 輪流", "Speed 速度", "Action 時長"], mode, (i) => { mode = i; restart(); });
        ctx.button("重新命名", () => { rename(); restart(); }, { primary: true });
        watch(ctx, sgrid, () => { fitLog(); drawLog(); drawTimeline(); });
        rename();
        ctx.frame(2).then(() => { if (ctx.active) { fitLog(); restart(); } });
      },
    },

    // ---------- 7. noise + display layouts ----------
    {
      id: "layouts", title: "雜訊與版面",
      api: "Noise.Simplex・Display layout rect／hex／tile・tileColorize",
      desc: "同一片 Noise.Simplex 地形用 Display 的三種版面畫出來：rect 用字元（≈ ~ . \" ♣ ▲），hex 是六角格（只有 x + y 為偶數的座標才有格子），tile 用一張執行時產生的 8 × 8 白色圖塊表，靠 tileColorize 把同一組圖塊染成不同地形色。右下是雜訊原始值（-1 到 1）。地圖持續往右捲動，每一格都是即時取樣。",
      hint: "調整比例尺放大縮小地形；「換種子」會用 RNG.setSeed 產生另一片世界",
      mount(ctx) {
        ctx.html(`<div class="board rot-quad"></div>`);
        const board = ctx.$(".board");
        const T = [
          { ch: "≈", fg: "#5f8fe8", bg: "#10204a" },
          { ch: "~", fg: "#8fc0f5", bg: "#1d3c70" },
          { ch: ".", fg: "#efdca4", bg: "#7a6838" },
          { ch: '"', fg: "#9be070", bg: "#2c5626" },
          { ch: "♣", fg: "#5ccb7a", bg: "#173a20" },
          { ch: "▲", fg: "#f0f0f6", bg: "#5a5a66" },
        ];
        const PAT = [
          ["........", ".##..##.", "#..##..#", "........", "........", ".##..##.", "#..##..#", "........"],
          ["........", "........", "..##....", ".#..#..#", "......#.", "........", "........", "........"],
          ["........", ".#...#..", "........", "...#...#", "........", "#...#...", "........", "..#...#."],
          ["........", "........", ".#..#...", ".#..#.#.", "#.##.#.#", "........", "...#..#.", "..#.##.#"],
          ["...##...", "..####..", ".######.", "..####..", ".######.", "########", "...##...", "...##..."],
          ["........", "...#....", "..###...", "..####..", ".######.", ".#######", "########", "........"],
        ];
        // Build an 8 x 8 white tileset at runtime; tileColorize tints it per draw call.
        const tileSet = h("canvas");
        tileSet.width = 8 * PAT.length; tileSet.height = 8;
        const tg = tileSet.getContext("2d");
        tg.fillStyle = "#fff";
        const tileMap = {};
        PAT.forEach((rows, k) => {
          rows.forEach((row, y) => [...row].forEach((c, x) => { if (c === "#") tg.fillRect(k * 8 + x, y, 1, 1); }));
          tileMap[T[k].ch] = [k * 8, 0];
        });
        const pR = pane(board), pH = pane(board), pT = pane(board, "tile"), pN = pane(board);
        const dR = makeDisplay(ctx, pR.view, { forceSquareRatio: true });
        const dH = makeDisplay(ctx, pH.view, { layout: "hex", spacing: 1 });
        const dT = makeDisplay(ctx, pT.view, { layout: "tile", bg: "transparent", tileWidth: 8, tileHeight: 8, tileSet, tileMap, tileColorize: true });
        const rawCv = h("canvas");
        pN.view.append(rawCv);
        let seed = 2024, noise, scale = 0.07, ox = 0, scroll = true;
        const dims = { r: [10, 10, 12], hx: [10, 10, 7, 11], t: [10, 10] };
        function reseed() { ROT.RNG.setSeed(seed); noise = new ROT.Noise.Simplex(); }
        // world sample at a CSS pixel position; every pane maps pixels the same way
        const k10 = () => scale / 10;
        const height = (px, py) => {
          const x = (px + ox) * k10(), y = py * k10();
          return noise.get(x, y) * 0.7 + noise.get(x * 2.3 + 5.2, y * 2.3 + 1.3) * 0.3;
        };
        const kindOf = (v) => (v < -0.3 ? 0 : v < -0.02 ? 1 : v < 0.08 ? 2 : v < 0.36 ? 3 : v < 0.6 ? 4 : 5);
        function fit() {
          const r = pR.view, cs = 12;
          const rw = Math.max(6, Math.floor(r.clientWidth / cs)), rh = Math.max(4, Math.floor(r.clientHeight / cs));
          dims.r = [rw, rh, fitSquare(dR, rw, rh, r.clientWidth, r.clientHeight)];
          const hv = pH.view, hw = Math.max(6, Math.floor(hv.clientWidth / 7)), hh = Math.max(4, Math.floor(hv.clientHeight / 11));
          dH.setOptions({ width: hw, height: hh });
          dH.setOptions({ fontSize: Math.max(4, dH.computeFontSize(hv.clientWidth * DPR, hv.clientHeight * DPR)) });
          const hc = dH.getContainer();
          hc.style.width = hc.width / DPR + "px"; hc.style.height = hc.height / DPR + "px";
          dims.hx = [hw, hh, hc.width / DPR / (hw + 1), hc.height / DPR / hh];
          const tv = pT.view, tw = Math.max(4, Math.floor(tv.clientWidth / 16)), th = Math.max(3, Math.floor(tv.clientHeight / 16));
          dT.setOptions({ width: tw, height: th });
          const tc = dT.getContainer();
          tc.style.width = tw * 16 + "px"; tc.style.height = th * 16 + "px";
          dims.t = [tw, th];
          paint();
        }
        function paint() {
          const [rw, rh, rc] = dims.r;
          for (let y = 0; y < rh; y++) for (let x = 0; x < rw; x++) {
            const t = T[kindOf(height((x + 0.5) * rc, (y + 0.5) * rc))];
            dR.draw(x, y, t.ch, t.fg, t.bg);
          }
          const [hw, hh, sx, sy] = dims.hx;
          for (let y = 0; y < hh; y++) for (let x = y % 2; x < hw; x += 2) {
            const t = T[kindOf(height((x + 1) * sx, (y + 0.5) * sy))];
            dH.draw(x, y, t.ch, t.fg, t.bg);
          }
          const [tw, th] = dims.t;
          for (let y = 0; y < th; y++) for (let x = 0; x < tw; x++) {
            const t = T[kindOf(height((x + 0.5) * 16, (y + 0.5) * 16))];
            dT.draw(x, y, t.ch, t.fg, t.bg);
          }
          const { g, w, h: hh2 } = sizeCanvas(rawCv, pN.view);
          const B = 3, nx = Math.ceil(w / B), ny = Math.ceil(hh2 / B);
          let lo = 1, hi = -1;
          for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
            const v = noise.get((x * B + ox) * k10(), y * B * k10());
            lo = Math.min(lo, v); hi = Math.max(hi, v);
            const c = Math.round((v * 0.5 + 0.5) * 255);
            g.fillStyle = `rgb(${c},${c},${c})`;
            g.fillRect(x * B, y * B, B, B);
          }
          pR.set('layout: "rect"', `${rw} × ${rh} 格・字元 ≈ ~ . " ♣ ▲`);
          pH.set('layout: "hex"', `${hw} × ${hh}・(x + y) 為偶數才有格子`);
          pT.set('layout: "tile" + tileColorize', `${tw} × ${th} 圖塊・8 × 8 白色圖塊即時著色`);
          pN.set("Noise.Simplex().get(x, y)", `種子 ${seed}・本畫面 ${lo.toFixed(2)} 到 ${hi.toFixed(2)}`);
        }
        ctx.toggle("捲動", true, (v) => (scroll = v));
        ctx.slider("比例尺", { min: 0.03, max: 0.16, step: 0.01, value: scale }, (v) => { scale = v; paint(); });
        ctx.button("換種子", () => { seed = newSeed(); reseed(); paint(); }, { primary: true });
        let lastT = performance.now();
        ctx.interval(() => {
          const t = performance.now();
          if (scroll) { ox += (t - lastT) * 0.02; paint(); }
          lastT = t;
        }, 110);
        reseed();
        watch(ctx, pR.view, fit);
        ctx.frame(2).then(() => ctx.active && fit());
      },
    },

    // ---------- 8. stress ----------
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "ctx.bench・Map.Digger／Cellular／EllerMaze + FOV.PreciseShadowcasting",
      desc: "每一輪產生一張指定格數的地圖，再從起點算一次全圖半徑的 PreciseShadowcasting 視野，格數從 4K 每次加倍到 1M。右側是最新一輪的地圖縮圖（黃色是看得到的格子）與每輪「產生地圖」和「全圖視野」的耗時拆解。",
      hint: "選一種產生器，按「開始測試」",
      mount(ctx) {
        ctx.html(`<div class="rot-bv"><div class="rot-bvin"><canvas></canvas></div><div class="rot-bvtag"></div></div>`);
        const box = ctx.$(".rot-bvin"), cv = ctx.$(".rot-bv canvas"), tag = ctx.$(".rot-bvtag");
        const nearCenter = (g, W, H) => {
          const c = (H >> 1) * W + (W >> 1);
          for (let k = 0; k < g.length; k++) {
            const i = c + (k % 2 ? (k + 1) / 2 : -k / 2);
            if (i >= 0 && i < g.length && g[i]) return [i % W, (i / W) | 0];
          }
          return [1, 1];
        };
        const GEN = [
          {
            label: "Digger", fn: "Map.Digger", make(W, H, g) {
              const m = new ROT.Map.Digger(W, H, { dugPercentage: 0.3, timeLimit: 60000 });
              m.create((x, y, v) => { if (!v) g[x + y * W] = 1; });
              const r = m.getRooms()[0];
              return r ? r.getCenter() : nearCenter(g, W, H);
            },
          },
          {
            label: "Cellular", fn: "Map.Cellular + connect()", make(W, H, g) {
              const m = new ROT.Map.Cellular(W, H);
              m.randomize(0.5);
              for (let i = 0; i < 3; i++) m.create();
              m.connect((x, y, v) => { if (v) g[x + y * W] = 1; }, 1);
              return nearCenter(g, W, H);
            },
          },
          {
            label: "EllerMaze", fn: "Map.EllerMaze", make(W, H, g) {
              new ROT.Map.EllerMaze(W, H).create((x, y, v) => { if (!v) g[x + y * W] = 1; });
              return [(W >> 1) | 1, (H >> 1) | 1];
            },
          },
        ];
        let which = 0, hist = [], last = null;
        function paint() {
          const { g, w: fullW, h: hh } = sizeCanvas(cv, box);
          g.clearRect(0, 0, fullW, hh);
          // on mid-size stages the bench panel overlaps the left side; draw in the uncovered part
          const lab = ctx.$(".sc-lab");
          let ox = 0;
          if (lab && !lab.classList.contains("min")) {
            const cover = lab.getBoundingClientRect().right - box.getBoundingClientRect().left + 8;
            if (cover > 0 && fullW - cover >= 240) ox = cover;
          }
          g.translate(ox, 0);
          const w = fullW - ox;
          const chartH = Math.min(hh * 0.42, 40 + 9 * 20);
          const mapH = hh - chartH - 16;
          if (last) {
            const { W, H, grid, vis, sx, sy } = last;
            const s = Math.min((w - 20) / W, (mapH - 34) / H);
            const dw = Math.max(1, Math.floor(W * s)), dh = Math.max(1, Math.floor(H * s));
            const iw = Math.min(W, Math.round(dw * DPR)), ih = Math.min(H, Math.round(dh * DPR));
            const img = new ImageData(iw, ih);
            for (let y = 0; y < ih; y++) for (let x = 0; x < iw; x++) {
              const i = Math.floor((x * W) / iw) + Math.floor((y * H) / ih) * W, o = (x + y * iw) * 4;
              const c = !grid[i] ? [20, 22, 30] : vis[i] ? [232, 200, 60] : [78, 84, 98];
              img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
            }
            const tmp = h("canvas");
            tmp.width = iw; tmp.height = ih;
            tmp.getContext("2d").putImageData(img, 0, 0);
            const x0 = (w - dw) / 2, y0 = 40;
            g.imageSmoothingEnabled = iw < dw;
            g.drawImage(tmp, x0, y0, dw, dh);
            g.fillStyle = "#f72585";
            g.beginPath(); g.arc(x0 + (sx + 0.5) * s, y0 + (sy + 0.5) * s, 4, 0, Math.PI * 2); g.fill();
          } else {
            g.fillStyle = "#77756d";
            g.font = `13px ${CJK}`;
            g.textAlign = "center";
            g.fillText("按「開始測試」後顯示地圖與視野", w / 2, mapH / 2 + 20);
            g.textAlign = "left";
          }
          // stacked bars: generation + FOV per round
          const top = hh - chartH, maxT = Math.max(1, ...hist.map((r) => r.gen + r.fov));
          g.font = `12px ${CJK}`;
          g.textBaseline = "middle";
          g.fillStyle = "#4cc9f0"; g.fillRect(12, top + 6, 10, 10);
          g.fillStyle = "#d8d6cf"; g.fillText("產生地圖", 26, top + 11);
          g.fillStyle = "#f7df1e"; g.fillRect(96, top + 6, 10, 10);
          g.fillStyle = "#d8d6cf"; g.fillText("全圖視野", 110, top + 11);
          const rowH = Math.min(20, (chartH - 26) / 9), bx = 64, bw = Math.max(40, w - bx - 120);
          hist.forEach((r, k) => {
            const y = top + 24 + k * rowH;
            g.font = `11px ${MONO}`;
            g.fillStyle = "#9b998f"; g.fillText(fmtCompact(r.n), 12, y + rowH / 2);
            const a = (r.gen / maxT) * bw, b = (r.fov / maxT) * bw;
            g.fillStyle = "#4cc9f0"; g.fillRect(bx, y + 3, Math.max(1, a), rowH - 6);
            g.fillStyle = "#f7df1e"; g.fillRect(bx + a, y + 3, Math.max(1, b), rowH - 6);
            g.fillStyle = "#d8d6cf";
            g.fillText(`${fmtMs(r.gen)} + ${fmtMs(r.fov)}`, bx + a + b + 6, y + rowH / 2);
          });
          g.textBaseline = "alphabetic";
          tag.textContent = last ? `${last.fn}・${fmt(last.W)} × ${fmt(last.H)}・地板 ${last.floorPct}%・可見 ${fmt(last.nv)} 格` : `${GEN[which].fn} + FOV.PreciseShadowcasting`;
        }
        const fmtMs = (ms) => (ms >= 1000 ? `${(ms / 1000).toFixed(2)} s` : `${ms < 10 ? ms.toFixed(1) : Math.round(ms)} ms`);
        ctx.controls.classList.add("bottom");
        ctx.group(GEN.map((x) => x.label), 0, (i) => { which = i; hist = []; last = null; paint(); });
        ctx.bench({
          label: "地圖格數", unit: "格",
          sizes: [4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576],
          target: 1000, budget: 2000,
          run(n) {
            if (hist.length && n <= hist[hist.length - 1].n) hist = [];
            const G = GEN[which];
            const W = Math.round(Math.sqrt(n * 1.6)) | 1, H = Math.round(n / W) | 1;
            const grid = new Uint8Array(W * H);
            const t0 = performance.now();
            const [sx, sy] = G.make(W, H, grid);
            const t1 = performance.now();
            const pass = (x, y) => x >= 0 && y >= 0 && x < W && y < H && grid[x + y * W] === 1;
            const vis = new Uint8Array(W * H);
            let nv = 0;
            new ROT.FOV.PreciseShadowcasting(pass).compute(sx, sy, Math.max(W, H), (x, y) => {
              if (x < 0 || y < 0 || x >= W || y >= H) return;
              const i = x + y * W;
              if (!vis[i]) { vis[i] = 1; nv++; }
            });
            const t2 = performance.now();
            let fl = 0;
            for (let i = 0; i < grid.length; i++) fl += grid[i];
            last = { W, H, grid, vis, sx, sy, nv, fn: G.fn, floorPct: Math.round((fl * 100) / grid.length) };
            hist.push({ n, gen: t1 - t0, fov: t2 - t1 });
            ctx.timeout(paint, 0); // the per-phase split is drawn in the chart; the row column is too narrow for it
          },
          note: "Digger 會反覆嘗試挖房間直到達成 dugPercentage，成本隨格數超線性成長；這裡把 timeLimit 從預設 1 秒放寬到 60 秒，否則大地圖會被提早截斷。Cellular 的 connect() 要找出所有孤立洞穴再挖隧道，同樣超線性。EllerMaze 一次只處理一列，接近線性。視野成本取決於從起點看得到多大的開放區域。單輪超過 2 秒就停止加碼。",
        });
        watch(ctx, box, paint);
        const lab = ctx.$(".sc-lab");
        if (lab) watch(ctx, lab, paint);
        paint();
      },
    },
  ],
});
</script>
</body>
</html>
