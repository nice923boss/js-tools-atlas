<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rough Notation 示範：手繪風格的重點標記</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .page { max-width: 720px; margin: 0 auto; padding: 72px 20px 80px; }
  .kicker { font: 700 12px var(--mono); letter-spacing: .14em; color: #b0306e; }
  h1 { margin: 8px 0 20px; font-size: clamp(28px, 5vw, 44px); line-height: 1.3; font-weight: 900; }
  p { font-size: clamp(16px, 2.2vw, 18px); line-height: 2.05; margin: 0 0 18px; }
  .note { position: relative; margin: 26px 0 0 18px; padding-left: 4px; font-size: 15px; line-height: 1.9; color: #4a4a4a; }
  [data-k] { cursor: pointer; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 30px; padding-top: 16px; border-top: 1px dashed rgba(0,0,0,.18); font-size: 13px; color: #555; }
  .legend button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; }
  .legend button:focus-visible { outline: 2px solid #333; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .legend button[aria-pressed=false] { opacity: .45; text-decoration: line-through; }
  /* the article scrolls under the fixed hint: show it briefly, then fade it out */
  .hint { animation: hint-fade .5s 8s forwards; }
</style>
</head>
<body class="paper scroll">
<div class="controls">
  <button class="btn primary" id="replay">重播</button>
  <button class="btn" id="hideAll">全部隱藏</button>
</div>

<main class="page">
  <div class="kicker">ROUGH NOTATION</div>
  <h1>像拿筆在稿子上<span data-k="title">畫重點</span></h1>
  <p>
    寫簡報或教材時，最難的是讓讀者一眼看到<span data-k="underline">真正重要的那一句</span>。
    Rough Notation 會在文字外面畫出<span data-k="box">手繪感的框線</span>，
    也能把關鍵字<span data-k="circle">圈起來</span>，
    或是像螢光筆一樣<span data-k="highlight">一路塗過跨行的長句子，換行之後依然會接著塗下去，不必自己計算每一行的位置</span>。
  </p>
  <p>
    改稿時把<span data-k="strike">沒必要的贅字</span>劃掉，
    整句不要了就直接<span data-k="crossed">打個大叉</span>。
    每一種標記都是一段 SVG 筆畫動畫，所以<span data-k="multi">會一筆一筆畫出來</span>，而不是突然出現。
  </p>
  <p class="note" data-k="bracket">
    小提醒：標記會跟著文字重新排版。改變視窗寬度或字級，框線與底線都會自動對齊新的位置。點任何一段標記文字可以單獨開關它。
  </p>

  <div class="legend" id="legend"></div>
</main>
<div class="hint">按「重播」看依序畫出，點文字或圖例可單獨開關</div>

<script src="https://cdn.jsdelivr.net/npm/rough-notation@0.5.1/lib/rough-notation.iife.js"></script>
<script>
const { annotate, annotationGroup } = RoughNotation;
// One entry per annotation type the library offers
const SPEC = [
  { k: "title", label: "highlight 螢光筆", type: "highlight", color: "#ffd54a", iterations: 1, multiline: true },
  { k: "underline", label: "underline 底線", type: "underline", color: "#e63946", strokeWidth: 2.5 },
  { k: "box", label: "box 方框", type: "box", color: "#1d6fd8", strokeWidth: 2, padding: 4 },
  { k: "circle", label: "circle 圈選", type: "circle", color: "#e76f00", strokeWidth: 2, padding: 8 },
  { k: "highlight", label: "跨行螢光筆", type: "highlight", color: "#9fe6b5", multiline: true, iterations: 1 },
  { k: "strike", label: "strike-through 刪除線", type: "strike-through", color: "#c1121f", strokeWidth: 2 },
  { k: "crossed", label: "crossed-off 打叉", type: "crossed-off", color: "#c1121f", strokeWidth: 2 },
  { k: "multi", label: "underline 雙線", type: "underline", color: "#7b2cbf", strokeWidth: 1.6, iterations: 3, multiline: true },
  { k: "bracket", label: "bracket 括號", type: "bracket", color: "#2a9d8f", strokeWidth: 3, brackets: ["left"], padding: [2, 8] },
];

const items = SPEC.map((s) => {
  const el = document.querySelector(`[data-k="${s.k}"]`);
  const a = annotate(el, { animationDuration: 420, ...s });
  return { ...s, el, a };
});
const group = annotationGroup(items.map((it) => it.a));

const legend = document.getElementById("legend");
for (const it of items) {
  const b = document.createElement("button");
  b.innerHTML = `<i style="background:${it.color}"></i>${it.label}`;
  b.setAttribute("aria-pressed", "true");
  it.btn = b;
  b.addEventListener("click", () => toggle(it));
  legend.append(b);
}

function toggle(it) {
  if (it.a.isShowing()) it.a.hide(); else it.a.show();
  it.btn.setAttribute("aria-pressed", it.a.isShowing());
}
for (const it of items) it.el.addEventListener("click", () => toggle(it));

function replay() {
  group.hide();
  items.forEach((it) => it.btn.setAttribute("aria-pressed", "true"));
  // a frame between hide and show so the stroke animation restarts from zero
  requestAnimationFrame(() => group.show());
}
document.getElementById("replay").addEventListener("click", replay);
document.getElementById("hideAll").addEventListener("click", () => {
  group.hide();
  items.forEach((it) => it.btn.setAttribute("aria-pressed", "false"));
});

// fonts change line boxes, so draw only after they are ready
document.fonts.ready.then(() => setTimeout(() => group.show(), 200));
</script>
</body>
</html>
