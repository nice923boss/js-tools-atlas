  .st-info b { font: 600 12px var(--mono); color: var(--fg); }
</style>

<script src="https://cdn.jsdelivr.net/npm/rough-notation@0.5.1/lib/rough-notation.iife.js"></script>
<script src="_shared/showcase.js"></script>
<script>
"use strict";
const { annotate, annotationGroup } = RoughNotation;
const { h, fmt, fmtMs, fmtCompact } = Showcase;
const INK = { red: "#d62839", blue: "#1d6fd8", orange: "#e76f00", green: "#2a9d8f", purple: "#7b2cbf" };
const MARKER = { yellow: "#ffd54a", mint: "#9fe6b5", pink: "#ffc2d4", sky: "#bde0fe" };

// Text must be laid out (control bar height applied, fonts settled) before anything is measured.
// ctx.sleep(0) rejects with AbortError when the viewer already left the scene; showcase ignores that.
async function settle(ctx) { await document.fonts.ready; await ctx.frame(2); await ctx.sleep(0); }
// Each annotation keeps a window resize listener and a ResizeObserver, so it is removed on unmount.
function mark(ctx, el, opts) { const a = annotate(el, opts); ctx.onCleanup(() => a.remove()); return a; }
// annotationGroup() stores a start delay on every member. A fresh group recomputes the delays,
// and a one-item group resets the delay to 0 so a single annotation draws right away.
function playGroup(list) { list.forEach((a) => a.hide()); annotationGroup(list).show(); }
const showNow = (a) => annotationGroup([a]).show();

// ---------- scene 1: the original article ----------
const ARTICLE = [
  { k: "title", label: "螢光筆", o: { type: "highlight", color: "#ffd54a", iterations: 1, multiline: true } },
  { k: "underline", label: "底線", o: { type: "underline", color: "#e63946", strokeWidth: 2.5 } },
  { k: "box", label: "方框", o: { type: "box", color: "#1d6fd8", strokeWidth: 2, padding: 4 } },
  { k: "circle", label: "圈選", o: { type: "circle", color: "#e76f00", strokeWidth: 2, padding: 8 } },
  { k: "highlight", label: "跨行螢光筆", o: { type: "highlight", color: "#9fe6b5", multiline: true, iterations: 1 } },
  { k: "strike", label: "刪除線", o: { type: "strike-through", color: "#c1121f", strokeWidth: 2 } },
  { k: "crossed", label: "打叉", o: { type: "crossed-off", color: "#c1121f", strokeWidth: 2 } },
  { k: "multi", label: "三重底線", o: { type: "underline", color: "#7b2cbf", strokeWidth: 1.6, iterations: 3, multiline: true } },
  { k: "bracket", label: "括號", o: { type: "bracket", color: "#2a9d8f", strokeWidth: 3, brackets: ["left"], padding: [2, 8] } },
];

// ---------- scene 2: parameter rows ----------
const TYPES = [["box", "方框"], ["circle", "圈選"], ["underline", "底線"], ["highlight", "螢光筆"], ["strike-through", "刪除線"], ["crossed-off", "打叉"], ["bracket", "括號"]];
// "skip" lists the types whose drawing code ignores that option (read from rough-notation 0.5.1 source).
const ROWS = [
  { key: "strokeWidth", zh: "線寬", vals: [1, 2.5, 5], ink: INK.blue, marker: MARKER.sky, skip: ["highlight"] },
  { key: "padding", zh: "留白（陣列依序為上、右、下、左，兩個值代表上下、左右）", vals: [0, 8, [2, 20]], ink: INK.red, marker: MARKER.pink, skip: ["highlight", "strike-through", "crossed-off"] },
  { key: "iterations", zh: "描線次數", vals: [1, 2, 4], ink: INK.orange, marker: MARKER.yellow, skip: ["bracket"] },
];

// ---------- scene 4: typhoon checklist ----------
const STEPS = [
  { zh: "方框", html: "<span>鎖緊門窗</span>，陽台落地窗也要檢查", o: { type: "box", color: INK.blue, strokeWidth: 2, padding: 3 } },
  { zh: "底線", html: "<span>準備飲水與乾糧</span>，至少三天份", o: { type: "underline", color: INK.green, strokeWidth: 2.5 } },
  { zh: "螢光筆", html: "<span>手電筒、行動電源充飽電</span>", o: { type: "highlight", color: MARKER.yellow, iterations: 1 } },
  { zh: "圈選", html: "<span>收進陽台盆栽</span>，避免被強風吹落", o: { type: "circle", color: INK.orange, strokeWidth: 2, padding: [4, 8] } },
  { zh: "打叉", html: "颱風天<span>去海邊看浪</span>", o: { type: "crossed-off", color: INK.red, strokeWidth: 2 } },
];

// ---------- scene 5: live setters ----------
const LIVE_TYPES = [["box", "方框"], ["circle", "圈選"], ["underline", "底線"], ["highlight", "螢光筆"]];
const SWATCH = [[INK.red, MARKER.pink], [INK.blue, MARKER.sky], [INK.green, MARKER.mint], [INK.orange, MARKER.yellow]];

// ---------- scene 6: essay grading ----------
const PENS = [
  { label: "圈錯字", o: { type: "circle", color: INK.red, strokeWidth: 2, padding: [3, 6] } },
  { label: "刪除", o: { type: "strike-through", color: INK.red, strokeWidth: 2, multiline: true } },
  { label: "好句", o: { type: "underline", color: INK.blue, strokeWidth: 2, padding: 1, multiline: true } },
  { label: "螢光筆", o: { type: "highlight", color: MARKER.yellow, iterations: 1, multiline: true } },
];
const ESSAY = [
  `上週末我和家人搭火車到花蓮，沿途的海岸線<span class="mk" data-pen="1">真的非常的</span>美麗，讓我們忍不住一直拍照。到了七星潭，我們在海邊撿石頭，弟弟還堆了一座小小的石塔。傍晚我們到東大門夜市，吃了很多小吃，其中最好吃的是<span class="mk" data-pen="3">炸蛋蔥油餅</span>。`,
  `第二天我們騎腳踏車沿著海岸前進，風很大，騎得很累，但是看到太平洋的那一刻，覺得一切都值得了。<span class="mk" data-pen="2">原來台灣的東部有這麼多值得慢慢欣賞的風景</span>，下次我一定要<span class="mk" data-pen="0">在</span>來一次。`,
];

// ---------- scene 7: stress ----------
const PLACES = ["基隆", "台北", "新北", "桃園", "新竹", "苗栗", "台中", "彰化", "南投", "雲林", "嘉義", "台南", "高雄", "屏東", "宜蘭", "花蓮", "台東", "澎湖", "金門", "馬祖"];
const STRESS_TYPES = [
  { label: "方框", o: { type: "box", color: INK.blue, padding: 2 } },
  { label: "圈選", o: { type: "circle", color: INK.orange, padding: 4 } },
  { label: "底線", o: { type: "underline", color: INK.red, padding: 1 } },
  { label: "螢光筆", o: { type: "highlight", color: MARKER.yellow, iterations: 1 } },
];

Showcase.run({ scenes: [
  {
    id: "article", title: "七種標記", paper: true,
    api: "annotate(el, { type, color, ... })・annotationGroup(list).show()",
    desc: "移植原示範：底線、方框、圈選、螢光筆、刪除線、打叉、括號七種手繪標記，用群組依序一筆一筆畫出來。",
    hint: "點文字或下方圖例可單獨開關，按「重播」依序重畫",
    async mount(ctx) {
      ctx.html(`<div class="pane"><article class="page">
        <div class="kicker">ROUGH NOTATION</div>
        <h1>像拿筆在稿子上<span data-k="title">畫重點</span></h1>
        <p>寫簡報或教材時，最難的是讓讀者一眼看到<span data-k="underline">真正重要的那一句</span>。Rough Notation 會在文字外面畫出<span data-k="box">手繪感的框線</span>，也能把關鍵字<span data-k="circle">圈起來</span>，或是像螢光筆一樣<span data-k="highlight">一路塗過跨行的長句子，換行之後依然會接著塗下去，不必自己計算每一行的位置</span>。</p>
        <p>改稿時把<span data-k="strike">沒必要的贅字</span>劃掉，整句不要了就直接<span data-k="crossed">打個大叉</span>。每一種標記都是一段 SVG 筆畫動畫，所以<span data-k="multi">會一筆一筆畫出來</span>，而不是突然出現。</p>
        <p class="aside" data-k="bracket">小提醒：視窗寬度改變時，標記會在 0.4 秒後依新的排版重畫。點任何一段標記文字或下方圖例，都可以單獨開關。</p>
        <div class="legend"></div>
      </article></div>`);
      const legend = ctx.$(".legend");
      const count = h("div", { class: "legend-n" });
      legend.append(count);
      const items = ARTICLE.map((s) => {
        const el = ctx.$(`[data-k="${s.k}"]`);
        const a = mark(ctx, el, { animationDuration: 420, ...s.o });
        const btn = h("button", { class: "chip", type: "button", "aria-pressed": "false" },
          h("i", { style: `background:${s.o.color}` }), s.label, h("code", { text: s.o.type }));
        legend.append(btn);
        return { el, a, btn };
      });
      const all = items.map((it) => it.a);
      const sync = () => {
        let on = 0;
        for (const it of items) { const s = it.a.isShowing(); on += s; it.btn.setAttribute("aria-pressed", String(s)); }
        count.innerHTML = `<code>isShowing()</code> 為 true 的標記：<b>${on}／${items.length}</b>`;
      };
      const toggle = (it) => { if (it.a.isShowing()) it.a.hide(); else showNow(it.a); sync(); };
      for (const it of items) { ctx.on(it.el, "click", () => toggle(it)); ctx.on(it.btn, "click", () => toggle(it)); }
      ctx.button("重播", () => { playGroup(all); sync(); }, { primary: true });
      ctx.button("全部隱藏", () => { all.forEach((a) => a.hide()); sync(); });
      sync();
      await settle(ctx);
      playGroup(all);
      sync();
    },
  },
  {
    id: "options", title: "參數對比", paper: true,
    api: "annotate(el, { type, strokeWidth, padding, iterations, color })",
    desc: "同一種標記並排三組參數：線寬、留白（可用陣列分別指定四邊）、描線次數。種類建立後不能改，切換時會重新 annotate()。",
    hint: "右上選標記種類，按「重播」重畫",
    async mount(ctx) {
      ctx.html(`<div class="pane"><div class="opt"></div></div>`);
      const wrap = ctx.$(".opt");
      let type = "box", list = [];
      const build = () => {
        list.forEach((a) => a.remove());
        list = [];
        wrap.textContent = "";
        for (const row of ROWS) {
          const cards = row.vals.map((v) => {
            const word = h("span", { text: "玉山" });
            return { v, word, card: h("div", { class: "opt-card" }, h("code", {}, h("i", { text: `${row.key}: ` }), JSON.stringify(v)), word) };
          });
          const skip = row.skip.includes(type) ? h("small", { text: "這個種類不使用此參數，三格相同" }) : null;
          wrap.append(h("section", {}, h("div", { class: "opt-h" }, h("code", { text: row.key }), row.zh, skip),
            h("div", { class: "opt-cards" }, cards.map((c) => c.card))));
          for (const c of cards) {
            list.push(annotate(c.word, {
              type, color: type === "highlight" ? row.marker : row.ink, strokeWidth: 2, padding: 6, iterations: 2,
              brackets: ["left", "right"], animationDuration: 700, [row.key]: c.v,
            }));
          }
        }
        list.forEach((a) => a.show());
      };
      ctx.onCleanup(() => list.forEach((a) => a.remove()));
      ctx.select("種類", TYPES.map(([v, zh]) => ({ value: v, label: `${zh} ${v}` })), type, (v) => { type = v; build(); });
      ctx.button("重播", () => { list.forEach((a) => a.hide()); list.forEach((a) => a.show()); }, { primary: true });
      await settle(ctx);
      build();
    },
  },
  {
    id: "multiline", title: "跨行與重排", paper: true,
    api: "annotate(span, { multiline: true })・a.show()",
    desc: "multiline 決定跨行文字要每行各畫一段，還是只框住整體外框。容器變窄造成的行內重排不會自動重畫，要再呼叫一次 show()。",
    hint: "拖曳「欄寬」看重排，關掉「自動重畫」比較差別",
    async mount(ctx) {
      ctx.html(`<div class="pane"><div class="ml">
        <div class="ml-col"><p>從台北車站出發，<span class="ml-t">搭乘板南線往南港展覽館方向，在忠孝復興站轉乘文湖線，就能一路直達松山機場</span>，全程大約二十分鐘。</p></div>
        <div class="ml-info"></div></div></div>`);
      const col = ctx.$(".ml-col"), span = ctx.$(".ml-t"), info = ctx.$(".ml-info");
      const KINDS = [
        { label: "螢光筆", o: { type: "highlight", color: MARKER.yellow, iterations: 1 } },
        { label: "底線", o: { type: "underline", color: INK.red, strokeWidth: 2 } },
        { label: "方框", o: { type: "box", color: INK.blue, strokeWidth: 2, padding: 3 } },
      ];
      let kind = 0, multiline = true, auto = true, stale = false, a = null;
      ctx.onCleanup(() => a && a.remove());
      const describe = () => {
        const n = span.getClientRects().length;
        info.innerHTML = [
          `<div>目標文字目前排成 <b>${n}</b> 行（<code>getClientRects()</code> 的數量）。</div>`,
          multiline
            ? `<div><code>multiline: true</code>：每一行各畫一段，換行後接著畫。</div>`
            : `<div><code>multiline: false</code>：只用 <code>getBoundingClientRect()</code> 的整體外框，跨行時會蓋住整塊區域。</div>`,
          stale
            ? `<div class="warn">標記停在舊位置：只有行內文字重排時，元素尺寸觀察器偵測不到變化，要自己呼叫 a.show()。</div>`
            : auto ? `<div>每次欄寬改變後呼叫 <code>a.show()</code> 重新量測；已在顯示中時直接重畫，不重播動畫。</div>` : "",
        ].join("");
      };
      const build = () => {
        if (a) a.remove();
        a = annotate(span, { ...KINDS[kind].o, multiline, animationDuration: 900 });
        a.show();
        stale = false;
        describe();
      };
      ctx.toggle("multiline", true, (v) => { multiline = v; build(); });
      ctx.group(KINDS.map((k) => k.label), 0, (i) => { kind = i; build(); });
      ctx.slider("欄寬", { min: 40, max: 100, step: 5, value: 100, format: (v) => `${v}%` }, (v) => {
        col.style.width = `${v}%`;
        if (auto) a.show(); else stale = true;
        describe();
      });
      ctx.toggle("自動重畫", true, (v) => { auto = v; if (v && stale) { a.show(); stale = false; } describe(); });
      describe();
      await settle(ctx);
      build();
    },
  },
  {
    id: "sequence", title: "依序播放", paper: true,
    api: "annotationGroup([a1, a2, ...]).show()・a.animationDuration・a.animate",
    desc: "群組依陣列順序替每個標記排好延遲，像接力一樣畫完。延遲在建立群組時計算，改了 animationDuration 要重建群組。",
    hint: "調整時長、順序或動畫開關後會自動重播",
    async mount(ctx) {
      ctx.html(`<div class="pane"><div class="sq"><h2>颱風來之前的五件事</h2>
        <ol>${STEPS.map((s) => `<li>${s.html}</li>`).join("")}</ol>
        <div class="sq-tl"></div><div class="sq-meta"></div></div></div>`);
      const ol = ctx.$("ol"), tl = ctx.$(".sq-tl"), meta = ctx.$(".sq-meta");
      const spans = ctx.$$("li span");
      const items = STEPS.map((s, i) => ({ zh: s.zh, color: s.o.color, a: mark(ctx, spans[i], s.o) }));
      items.push({ zh: "括號", color: INK.purple, a: mark(ctx, ol, { type: "bracket", brackets: ["right"], color: INK.purple, strokeWidth: 2.5, padding: [2, 8] }) });
      let dur = 800, animate = true, reverse = false, t0 = -1, segs = [], ph = null;
      const order = () => (reverse ? [...items].reverse() : items);
      const layoutTimeline = () => {
        segs = order().map((it, i) => h("div", { style: `--c:${it.color}` }, `${i + 1} ${it.zh}`));
        ph = h("i", { class: "ph" });
        tl.replaceChildren(...segs, ph);
      };
      const play = () => {
        items.forEach(({ a }) => { a.animationDuration = dur; a.animate = animate; });
        playGroup(order().map((it) => it.a));
        layoutTimeline();
        t0 = performance.now();
        meta.innerHTML = animate
          ? `群組依序指定延遲 <code>0、${fmt(dur)}、${fmt(dur * 2)}…</code> ms，${items.length} 個標記共 <code>${fmt(dur * items.length)}</code> ms 畫完。`
          : `<code>animate: false</code>：不播動畫，也就沒有延遲，全部同時出現。`;
      };
      ctx.raf(() => {
        if (t0 < 0 || !ph) return;
        const total = animate ? dur * items.length : 1;
        const p = Math.min(1, (performance.now() - t0) / total);
        ph.style.left = `calc(${(p * 100).toFixed(2)}% - 1px)`;
        segs.forEach((s, i) => s.classList.toggle("on", p * segs.length > i));
        if (p >= 1) t0 = -1;
      });
      let timer = 0;
      ctx.onCleanup(() => clearTimeout(timer));
      ctx.button("播放", play, { primary: true });
      ctx.slider("時長", { min: 200, max: 2000, step: 100, value: dur, format: (v) => `${v} ms` }, (v) => {
        dur = v;
        clearTimeout(timer);
        timer = setTimeout(play, 350);
      });
      ctx.toggle("animate", true, (v) => { animate = v; play(); });
      ctx.group(["正序", "倒序"], 0, (i) => { reverse = i === 1; play(); });
      layoutTimeline();
      await settle(ctx);
      play();
    },
  },
  {
    id: "live", title: "即時調整", paper: true,
    api: "a.show()・a.hide()・a.remove()・a.isShowing()・a.color = …",
    desc: "color、strokeWidth、padding 有 setter，改了立刻重畫且不重播動畫。remove() 會拿掉 SVG，之後 show() 不再有作用，要重新 annotate()。",
    hint: "按右上的方法按鈕，下方即時調整顏色、線寬與留白",
    async mount(ctx) {
      ctx.html(`<div class="board"><div class="lv">
        <div class="lv-stage"><p>今天下午三點，<span class="lv-t">台北車站</span>東三門見</p></div>
        <div class="lv-panel">
          <div class="lv-box"><div class="lv-h">狀態</div><dl class="lv-state"></dl><ul class="lv-log"></ul></div>
          <div class="lv-box"><div class="lv-h">即時屬性</div>
            <div class="lv-row"><span>color</span><div class="lv-sw"></div></div>
            <label class="lv-row"><span>strokeWidth</span><input type="range" min="1" max="8" step="0.5" value="2.5" data-p="strokeWidth"><output>2.5</output></label>
            <label class="lv-row"><span>padding</span><input type="range" min="0" max="24" step="1" value="6" data-p="padding"><output>6</output></label>
          </div>
        </div></div></div>`);
      const target = ctx.$(".lv-t"), stage = ctx.$(".lv-stage"), stateEl = ctx.$(".lv-state"), logEl = ctx.$(".lv-log");
      const ranges = ctx.$$(".lv-row input");
      let type = "box", sw = 0, removed = false, lastKey = "";
      const cfg = () => ({ type, color: SWATCH[sw][type === "highlight" ? 1 : 0], strokeWidth: +ranges[0].value, padding: +ranges[1].value, animationDuration: 700 });
      let a = annotate(target, cfg());
      ctx.onCleanup(() => a.remove());
      const paint = () => {
        const svg = stage.querySelector("svg.rough-annotation");
        const showing = a.isShowing();
        stateEl.innerHTML = `<dt><code>isShowing()</code></dt><dd class="${showing ? "yes" : "no"}">${showing}</dd>`
          + `<dt>SVG 元素</dt><dd class="zh">${svg ? "在 DOM 裡" : "已移除"}</dd>`
          + `<dt>path 數量</dt><dd>${svg ? svg.querySelectorAll("path").length : 0}</dd>`
          + (removed ? `<dt>注意</dt><dd class="zh warn">remove() 之後 isShowing() 仍回傳 true</dd>` : "");
      };
      const log = (code, note, key = "") => {
        const li = h("li", {}, h("code", { text: code }), "　", note);
        if (key && key === lastKey && logEl.firstChild) logEl.firstChild.replaceWith(li); else logEl.prepend(li);
        lastKey = key;
        while (logEl.children.length > 3) logEl.lastChild.remove();
        ctx.frame(2).then(paint);
      };
      const setterNote = () => (removed ? "只記下設定，已移除的標記不會再畫" : a.isShowing() ? "立刻重畫，不重播動畫" : "先記下，下次 show() 套用");
      const create = (why) => { a.remove(); a = annotate(target, cfg()); removed = false; a.show(); log(`annotate(el, { type: "${type}" })`, why); };
      const swatches = SWATCH.map((pair, i) => {
        const b = h("button", { type: "button", "aria-pressed": String(i === sw), "aria-label": `顏色 ${i + 1}` });
        ctx.on(b, "click", () => {
          sw = i;
          swatches.forEach((x, j) => x.setAttribute("aria-pressed", String(j === i)));
          a.color = cfg().color;
          log(`a.color = "${a.color}"`, setterNote(), "color");
        });
        return b;
      });
      const paintSwatches = () => swatches.forEach((b, i) => (b.style.background = SWATCH[i][type === "highlight" ? 1 : 0]));
      ctx.$(".lv-sw").append(...swatches);
      paintSwatches();
      for (const r of ranges) {
        ctx.on(r, "input", () => {
          const v = +r.value, p = r.dataset.p;
          r.nextElementSibling.textContent = v;
          a[p] = v;
          log(`a.${p} = ${v}`, setterNote(), p);
        });
      }
      ctx.button("show()", () => {
        const note = removed ? "已 remove()，不會再畫，請重新 annotate()" : a.isShowing() ? "已在顯示中：直接重畫，不播動畫" : "播放繪製動畫";
        a.show();
        log("a.show()", note);
      }, { primary: true });
      ctx.button("hide()", () => { a.hide(); log("a.hide()", removed ? "已 remove()，沒有路徑可清" : "清空路徑，SVG 元素保留"); });
      ctx.button("remove()", () => { a.remove(); removed = true; log("a.remove()", "移除 SVG 與監聽器"); });
      ctx.button("annotate()", () => create("重新建立並畫出"));
      ctx.select("type", LIVE_TYPES.map(([v, zh]) => ({ value: v, label: `${zh} ${v}` })), type, (v) => {
        type = v;
        paintSwatches();
        create("type 沒有 setter，換種類要重新建立");
      });
      paint();
      await settle(ctx);
      a.show();
      log(`annotate(el, { type: "${type}" }).show()`, "建立並畫出");
    },
  },
  {
    id: "essay", title: "批改作文", paper: true,
    api: "range.surroundContents(span)・annotate(span, pen).show()",
    desc: "在中文段落上直接批改：把選取的文字包成 span 再標記，中文逐字換行一樣能用 multiline 接續。點已標記的文字會 remove() 並拆掉 span。",
    hint: "右上先選筆，再用滑鼠選取文字；點已標記的文字可移除",
    async mount(ctx) {
      ctx.html(`<div class="pane"><div class="es">
        <div class="es-head"><h2>花蓮兩天一夜</h2><span class="es-grade">甲上</span></div>
        ${ESSAY.map(() => `<p class="es-p"></p>`).join("")}
        <div class="es-foot"><span>老師評語：細節生動，結尾很有感情；注意「再」和「在」的用法。</span><span class="es-n"></span></div>
      </div></div><div class="es-msg"></div>`);
      const paper = ctx.$(".es"), msg = ctx.$(".es-msg"), countEl = ctx.$(".es-n");
      const marks = new Map();
      let pen = 0, msgTimer = 0;
      ctx.onCleanup(() => { marks.forEach((a) => a.remove()); clearTimeout(msgTimer); });
      const count = () => (countEl.textContent = `目前 ${marks.size} 處標記`);
      const flash = (t) => {
        msg.textContent = t;
        msg.classList.add("on");
        clearTimeout(msgTimer);
        msgTimer = setTimeout(() => msg.classList.remove("on"), 2400);
      };
      const add = (span, p) => {
        span.classList.add("mk");
        span.dataset.pen = p;
        const a = annotate(span, { ...PENS[p].o, animationDuration: 500 });
        marks.set(span, a);
        return a;
      };
      const reset = () => {
        marks.forEach((a) => a.remove());
        marks.clear();
        ctx.$$(".es-p").forEach((p, i) => (p.innerHTML = ESSAY[i]));
        const list = ctx.$$(".es-p .mk").map((s) => add(s, +s.dataset.pen));
        count();
        return list;
      };
      const applySelection = () => {
        const sel = getSelection();
        if (!sel.rangeCount || sel.isCollapsed) return;
        const r = sel.getRangeAt(0);
        const node = r.commonAncestorContainer;
        const host = node.nodeType === 1 ? node : node.parentElement;
        if (!paper.contains(host) || !r.toString().trim()) return;
        const done = (t) => { sel.removeAllRanges(); if (t) flash(t); };
        if (!host.closest(".es-p")) return done("請在同一段文字裡選取");
        if (host.closest(".mk") || r.cloneContents().querySelector(".mk, svg")) return done("選取範圍碰到已有的標記，點一下標記可以先移除");
        const span = document.createElement("span");
        try { r.surroundContents(span); } catch (e) { return done("這段選取無法包成 span，請換一段文字"); }
        done();
        showNow(add(span, pen));
        count();
      };
      ctx.on(paper, "mouseup", () => ctx.timeout(applySelection, 0));
      ctx.on(paper, "touchend", () => ctx.timeout(applySelection, 350));
      ctx.on(paper, "click", (e) => {
        const m = e.target.closest(".es-p .mk");
        if (!m || !getSelection().isCollapsed) return;
        marks.get(m).remove();
        marks.delete(m);
        const parent = m.parentNode;
        m.replaceWith(...m.childNodes);
        parent.normalize();
        count();
      });
      ctx.group(PENS.map((p) => p.label), 0, (i) => (pen = i));
      ctx.button("清除重來", () => playGroup(reset()));
      const grade = mark(ctx, ctx.$(".es-grade"), { type: "circle", color: INK.red, strokeWidth: 2.5, padding: [6, 12], animationDuration: 600 });
      const first = reset();
      await settle(ctx);
      playGroup([...first, grade]);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "spans.map((el) => annotate(el, opts)).forEach((a) => a.show())",
    desc: "一次替大量文字建立標記並畫出來，分別量測 annotate()、show() 與瀏覽器更新畫面的耗時，找出這台裝置可承受的數量。",
    hint: "按「開始測試」逐級加量，下方可切換種類與動畫",
    async mount(ctx) {
      ctx.html(`<div class="stress-stage"><div class="st-grid"></div><div class="st-info">準備中…</div></div>`);
      const grid = ctx.$(".st-grid"), info = ctx.$(".st-info");
      let kind = 0, animate = true, live = [];
      const clear = () => { live.forEach((a) => a.remove()); live = []; grid.textContent = ""; };
      ctx.onCleanup(clear);
      const fill = (n) => {
        const frag = document.createDocumentFragment();
        const spans = [];
        for (let i = 0; i < n; i++) {
          const s = document.createElement("span");
          s.textContent = PLACES[i % PLACES.length];
          frag.append(s);
          spans.push(s);
        }
        grid.append(frag);
        return spans;
      };
      const draw = async (spans) => {
        const opts = { ...STRESS_TYPES[kind].o, strokeWidth: 1.5, animate, animationDuration: 600 };
        const t0 = performance.now();
        live = spans.map((s) => annotate(s, opts));
        const t1 = performance.now();
        live.forEach((a) => a.show());
        const t2 = performance.now();
        await ctx.frame(2);
        const t3 = performance.now();
        info.innerHTML = `<b>${fmt(spans.length)}</b> 個・annotate() <b>${fmtMs(t1 - t0)}</b>・show() <b>${fmtMs(t2 - t1)}</b>・畫面更新 <b>${fmtMs(t3 - t2)}</b>`;
        return grid.getElementsByTagName("path").length;
      };
      const preview = () => { clear(); draw(fill(240)); };
      const busy = () => { const b = ctx.$("[data-sc-run]"); return b && b.disabled; };
      ctx.bench({
        label: "同時標記", unit: "個",
        sizes: [100, 300, 1000, 3000, 10000, 30000, 100000],
        async prepare(n) { clear(); const spans = fill(n); await ctx.frame(1); return spans; },
        async run(n, spans) { const paths = await draw(spans); return `路徑 ${fmtCompact(paths)}`; },
        note: "每個標記都會建立一個 SVG、一個 ResizeObserver 與一個視窗 resize 監聽；show() 要量測元素位置並產生手繪路徑，開啟動畫時還要逐條量測路徑長度並掛上 CSS 動畫。每次 show() 都先讀位置再寫入路徑，連續呼叫會反覆觸發重新排版，所以耗時增長得比數量還快；切換種類與動畫開關可比較差異。",
      });
      ctx.controls.classList.add("bottom");
      ctx.select("種類", STRESS_TYPES.map((t, i) => ({ value: String(i), label: t.label })), "0", (v) => { kind = +v; if (!busy()) preview(); });
      ctx.toggle("animate 動畫", true, (v) => { animate = v; if (!busy()) preview(); });
      await settle(ctx);
      preview();
    },
  },
] });
</script>
</body>
