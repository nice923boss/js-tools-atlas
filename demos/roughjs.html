<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rough.js 示範：黑板上的手繪風圖表</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body {
    background:
      radial-gradient(40% 30% at 20% 25%, rgba(255,255,255,0.05), transparent 70%),
      radial-gradient(35% 30% at 80% 70%, rgba(255,255,255,0.04), transparent 70%),
      radial-gradient(120% 100% at 50% 50%, #2b4a3c, #15241d);
  }
  #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #board text { font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif; fill: #f2efe4; }
  #board .title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  #board .note { font-size: 11px; fill: rgba(242,239,228,0.6); }
  #board .tick { font-size: 12px; fill: rgba(242,239,228,0.85); }
  #board .val { font-size: 13px; font-weight: 700; fill: #f7df1e; opacity: 0; transition: opacity .2s; }
  #board .hot .val, #board .val.show { opacity: 1; }
  #board .anno { font-size: 15px; font-weight: 700; fill: #ff8fb8; }
  .bar, .slice { cursor: pointer; }
  .slice { transition: transform .25s ease; }
  .chalk { filter: url(#chalk); }
</style>
</head>
<body>
<svg id="board" aria-label="手繪風長條圖與圓餅圖">
  <defs>
    <!-- Slight displacement gives strokes a dusty chalk edge -->
    <filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
  </defs>
  <g id="layer" class="chalk"></g>
</svg>
<div class="controls">
  <button class="btn" id="fill">填色：斜線</button>
  <button class="btn" id="rough">潦草度：中</button>
  <button class="btn primary" id="redraw">重新手繪</button>
</div>
<div class="hint">滑過長條或扇形看數值・換填色與潦草度</div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script>
// Every stroke and fill below is generated by rough.svg(); we only place SVG text labels.
const svg = document.getElementById("board");
const layer = document.getElementById("layer");
const rc = rough.svg(svg);
const NS = "http://www.w3.org/2000/svg";

const MONTHS = [["1 月", 32], ["2 月", 45], ["3 月", 38], ["4 月", 60], ["5 月", 78], ["6 月", 55]];
const CITIES = [["台北市", 38, "#f7df1e"], ["新北市", 24, "#4cc9f0"], ["台中市", 16, "#ff8fb8"], ["高雄市", 12, "#7bd389"], ["其他", 10, "#ffb37a"]];
const FILLS = [["hachure", "斜線"], ["cross-hatch", "交叉"], ["zigzag", "鋸齒"], ["dots", "圓點"], ["solid", "實心"]];
const ROUGH = [[0.6, "低"], [1.4, "中"], [2.8, "高"]];
const CHALK = "#f2efe4";
let fillIdx = 0, roughIdx = 1, seed = 7;

function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || layer).appendChild(n);
  return n;
}
function text(str, x, y, cls, anchor, parent) {
  const t = el("text", { x, y, class: cls, "text-anchor": anchor || "middle" }, parent);
  t.textContent = str;
  return t;
}
function opts(extra) {
  return { roughness: ROUGH[roughIdx][0], stroke: CHALK, strokeWidth: 1.6, bowing: 1.2, seed: seed++, ...extra };
}
function add(node, parent) { (parent || layer).appendChild(node); return node; }

function barChart(x, y, w, h) {
  text("各月份程式課報名人數", x + w / 2, y, "title");
  text("示意資料", x + w / 2, y + 18, "note");
  const top = y + 46, bottom = y + h - 26, left = x + 30, right = x + w - 6;
  const max = 90;
  // Axes and dashed grid lines
  add(rc.line(left, top - 6, left, bottom, opts({ strokeWidth: 2 })));
  add(rc.line(left, bottom, right, bottom, opts({ strokeWidth: 2 })));
  for (let v = 30; v <= 90; v += 30) {
    const gy = bottom - (v / max) * (bottom - top);
    add(rc.line(left, gy, right, gy, opts({ stroke: "rgba(242,239,228,0.25)", strokeWidth: 1, roughness: 0.8 })));
    text(String(v), left - 8, gy + 4, "tick", "end");
  }
  const slot = (right - left) / MONTHS.length;
  const bw = slot * 0.58;
  let best = 0;
  MONTHS.forEach(([m, v], i) => { if (v > MONTHS[best][1]) best = i; });
  const fill = FILLS[fillIdx][0];
  MONTHS.forEach(([m, v], i) => {
    const bx = left + slot * i + (slot - bw) / 2;
    const bh = (v / max) * (bottom - top);
    const g = el("g", { class: "bar" });
    const color = i === best ? "#ff8fb8" : "#4cc9f0";
    add(rc.rectangle(bx, bottom - bh, bw, bh, opts({ fill: color, fillStyle: fill, hachureGap: 5, fillWeight: 1.4, stroke: CHALK })), g);
    text(String(v), bx + bw / 2, bottom - bh - 8, "val" + (i === best ? " show" : ""), "middle", g);
    text(m, bx + bw / 2, bottom + 18, "tick", "middle", g);
    g.addEventListener("pointerenter", () => g.classList.add("hot"));
    g.addEventListener("pointerleave", () => g.classList.remove("hot"));
  });
  // Whiteboard-style annotation pointing at the best month
  const bx = left + slot * best + slot / 2;
  const by = bottom - (MONTHS[best][1] / max) * (bottom - top);
  const ax = Math.max(left + 40, bx - slot * 1.6), ay = top - 2;
  add(rc.ellipse(bx, by - 9, bw + 26, 30, opts({ stroke: "#ff8fb8", strokeWidth: 1.8, roughness: 1.6 })));
  add(rc.curve([[ax + 14, ay + 6], [ax + (bx - ax) * 0.55, ay - 6], [bx - bw / 2 - 12, by - 14]], opts({ stroke: "#ff8fb8", strokeWidth: 1.8 })));
  add(rc.linearPath([[bx - bw / 2 - 24, by - 22], [bx - bw / 2 - 12, by - 14], [bx - bw / 2 - 26, by - 9]], opts({ stroke: "#ff8fb8", strokeWidth: 1.8 })));
  text("暑假前爆滿！", ax - 8, ay + 10, "anno", "end");
}

function pieChart(cx, cy, r, titleY) {
  text("學員來自哪裡", cx, titleY, "title");
  text("示意資料", cx, titleY + 18, "note");
  let a = -Math.PI / 2;
  const fill = FILLS[fillIdx][0];
  for (const [name, pct, color] of CITIES) {
    const span = (pct / 100) * Math.PI * 2;
    const mid = a + span / 2;
    const g = el("g", { class: "slice" });
    add(rc.arc(cx, cy, r * 2, r * 2, a, a + span, true, opts({ fill: color, fillStyle: fill, hachureGap: 5, hachureAngle: (mid * 180) / Math.PI, fillWeight: 1.4 })), g);
    const lx = cx + Math.cos(mid) * (r + 14), ly = cy + Math.sin(mid) * (r + 14);
    const ex = cx + Math.cos(mid) * (r + 30);
    add(rc.line(cx + Math.cos(mid) * (r - 4), cy + Math.sin(mid) * (r - 4), lx, ly, opts({ strokeWidth: 1.2, roughness: 0.8 })), g);
    const right = Math.cos(mid) >= 0;
    text(`${name} ${pct}%`, ex + (right ? 2 : -2), ly + 4, "tick", right ? "start" : "end", g);
    const dx = Math.cos(mid) * 10, dy = Math.sin(mid) * 10;
    g.addEventListener("pointerenter", () => { g.style.transform = `translate(${dx}px, ${dy}px)`; });
    g.addEventListener("pointerleave", () => { g.style.transform = ""; });
    a += span;
  }
}

// Reveal strokes one after another, like someone sketching on the board
function sketchIn() {
  const paths = layer.querySelectorAll("path");
  let delay = 0;
  paths.forEach((p) => {
    const len = Math.ceil(p.getTotalLength());
    if (!len) return;
    p.style.transition = "none";
    p.style.strokeDasharray = `${len} ${len}`;
    p.style.strokeDashoffset = len;
    const d = Math.min(0.45, 0.12 + len / 4000);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      p.style.transition = `stroke-dashoffset ${d}s ease-out ${delay}s`;
      p.style.strokeDashoffset = 0;
    }));
    delay += 0.035;
  });
  layer.querySelectorAll("text").forEach((t, i) => {
    t.style.opacity = 0;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      t.style.transition = `opacity .4s ${0.2 + i * 0.03}s`;
      t.style.opacity = "";
    }));
  });
}

function render(animate) {
  layer.textContent = "";
  const w = innerWidth, h = innerHeight;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  const startSeed = seed;
  if (w >= 640) {
    const bw = Math.min(460, w * 0.52);
    const gap = Math.max(24, w * 0.04);
    const pr = Math.min(h * 0.27, (w - bw - gap - 80) / 2 - 70);
    const total = bw + gap + (pr + 70) * 2;
    const x0 = (w - total) / 2;
    const top = Math.max(70, h * 0.14);
    barChart(x0, top, bw, Math.min(h - top - 70, 420));
    pieChart(x0 + bw + gap + pr + 70, top + 46 + (Math.min(h - top - 70, 420) - 70) / 2, pr, top);
  } else {
    const top = 72;
    const bh = Math.min(260, h * 0.44);
    barChart(16, top, w - 32, bh);
    // Extra headroom so the top slice labels clear the pie title
    const pr = Math.min(66, (h - top - bh - 130) / 2);
    pieChart(w / 2, top + bh + 66 + pr, pr, top + bh + 22);
  }
  seed = startSeed;
  if (animate) sketchIn();
}

const fillBtn = document.getElementById("fill");
const roughBtn = document.getElementById("rough");
fillBtn.addEventListener("click", () => {
  fillIdx = (fillIdx + 1) % FILLS.length;
  fillBtn.textContent = "填色：" + FILLS[fillIdx][1];
  render(false);
});
roughBtn.addEventListener("click", () => {
  roughIdx = (roughIdx + 1) % ROUGH.length;
  roughBtn.textContent = "潦草度：" + ROUGH[roughIdx][1];
  render(false);
});
document.getElementById("redraw").addEventListener("click", () => { seed = Math.floor(Math.random() * 1e6); render(true); });
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => render(false), 100); });
render(true);
</script>
</body>
</html>
