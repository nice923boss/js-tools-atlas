<style>
  /* drawing area below (or above) the control cluster */
  .stage { position: absolute; left: 0; right: 0; top: var(--sc-ctl-h, 0px); bottom: var(--sc-ctl-b, 0px); }
  .stage > svg, .stage > canvas, .box > svg, .box > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  svg text { font-family: var(--font); fill: var(--fg); }
  svg .lbl { font-size: 12.5px; font-weight: 600; }
  svg .code { font: 500 11px var(--mono); fill: var(--muted); }

  /* 1. chalkboard */
  .chalkboard { position: absolute; inset: 0;
    background: radial-gradient(40% 30% at 20% 25%, rgba(255,255,255,0.05), transparent 70%),
      radial-gradient(35% 30% at 80% 70%, rgba(255,255,255,0.04), transparent 70%),
      radial-gradient(120% 100% at 50% 50%, #2b4a3c, #15241d); }
  .chalkboard text { fill: #f2efe4; }
  .chalkboard .title { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .chalkboard .note { font-size: 11px; fill: rgba(242,239,228,0.6); }
  .chalkboard .tick { font-size: 12px; fill: rgba(242,239,228,0.85); }
  .chalkboard .val { font-size: 13px; font-weight: 700; fill: #f7df1e; opacity: 0; transition: opacity .2s; }
  .chalkboard .hot .val, .chalkboard .val.show { opacity: 1; }
  .chalkboard .anno { font-size: 15px; font-weight: 700; fill: #ff8fb8; }
  .chalkboard .bar, .chalkboard .slice { cursor: pointer; }
  .chalkboard .slice { transition: transform .25s ease; }

  /* 5. parameters: drawing + code readout */
  .solo { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 8px) 10px calc(var(--sc-ctl-b, 0px) + 10px);
    display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
  .solo .box { position: relative; min-height: 0; }
  .codebox { margin: 0; padding: 8px 12px; font: 500 12px/1.55 var(--mono); color: var(--fg); white-space: pre; overflow: hidden; }
  .codebox b { color: var(--accent); font-weight: 600; }

  /* 6. canvas vs svg */
  .split { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 8px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: grid; gap: 8px;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; padding: 8px 10px; }
  .pane h2 { margin: 0 0 4px; font: 600 12.5px/1.3 var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pane h2 code { font: 500 11.5px var(--mono); color: var(--accent); margin-left: 6px; }
  .pane .box { position: relative; flex: 1; min-height: 0; }
  .pane .meta { font: 500 11px/1.4 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 4px; }
  .split .wide { grid-column: 1 / -1; padding: 7px 12px; font: 500 11.5px/1.5 var(--mono); color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .split .wide b { color: var(--fg); }
  @media (max-width: 560px) {
    .split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) auto; }
  }

  /* 8. stress */
  .stress-stage { position: absolute; inset: 8px 8px 8px 350px; border-radius: 10px; background: #12151a; border: 1px solid var(--line); overflow: hidden; }
  @media (max-width: 760px) { .stress-stage { inset: 8px; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Rough.js showcase: every stroke and fill is produced by rough.canvas() / rough.svg() / rough.generator().
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FG = css.getPropertyValue("--fg").trim() || "#ecebe6";
const MUTED = css.getPropertyValue("--muted").trim() || "#9b998f";
const FONT = css.getPropertyValue("--font").trim() || "sans-serif";
const MONO = css.getPropertyValue("--mono").trim() || "monospace";
const NS = "http://www.w3.org/2000/svg";
const newSeed = () => Math.floor(Math.random() * 1e6) + 1;

function svgNode(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function svgText(parent, str, x, y, attrs = {}) {
  const t = svgNode("text", { x, y, ...attrs }, parent);
  t.textContent = str;
  return t;
}
// Redraw whenever the drawing box changes size (window resize or the control bar wrapping).
function watch(ctx, el, draw) {
  let raf = 0, lw = -1, lh = -1;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h || (w === lw && h === lh)) return;
      lw = w; lh = h;
      draw(w, h);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}
// Size a canvas to its CSS box at devicePixelRatio (capped at 2); returns a 2D context in CSS pixels.
function fitCanvas(canvas, w, h) {
  const r = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.round(w * r);
  canvas.height = Math.round(h * r);
  const g = canvas.getContext("2d");
  g.setTransform(r, 0, 0, r, 0, 0);
  return g;
}
// Split a w x h area into a cols-wide grid of n cells.
function cells(n, w, h, cols) {
  const rows = Math.ceil(n / cols), cw = w / cols, ch = h / rows;
  return Array.from({ length: n }, (_, i) => ({ x: (i % cols) * cw, y: Math.floor(i / cols) * ch, w: cw, h: ch }));
}
function canvasLabel(g, title, code, x, y) {
  g.font = `600 12.5px ${FONT}`;
  g.fillStyle = FG;
  g.fillText(title, x, y);
  const tw = g.measureText(title).width;
  g.font = `500 11px ${MONO}`;
  g.fillStyle = MUTED;
  g.fillText(code, x + tw + 6, y);
}
// Reveal rough strokes one by one, like someone sketching.
function sketchIn(root, step = 0.03) {
  let delay = 0;
  root.querySelectorAll("path").forEach((p) => {
    const len = Math.ceil(p.getTotalLength());
    if (!len) return;
    p.style.transition = "none";
    p.style.strokeDasharray = `${len} ${len}`;
    p.style.strokeDashoffset = len;
    const d = Math.min(0.45, 0.12 + len / 4000);
    const at = delay;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      p.style.transition = `stroke-dashoffset ${d}s ease-out ${at}s`;
      p.style.strokeDashoffset = 0;
    }));
    delay += step;
  });
}
const heartD = (cx, cy, s) => {
  const k = s / 100, X = (v) => (cx + (v - 50) * k).toFixed(1), Y = (v) => (cy + (v - 50) * k).toFixed(1);
  return `M${X(50)} ${Y(88)} C${X(20)} ${Y(65)} ${X(4)} ${Y(45)} ${X(17)} ${Y(25)} C${X(30)} ${Y(7)} ${X(48)} ${Y(13)} ${X(50)} ${Y(30)} ` +
    `C${X(52)} ${Y(13)} ${X(70)} ${Y(7)} ${X(83)} ${Y(25)} C${X(96)} ${Y(45)} ${X(80)} ${Y(65)} ${X(50)} ${Y(88)} Z`;
};
const star = (cx, cy, r, inner = 0.45, n = 5) =>
  Array.from({ length: n * 2 }, (_, i) => {
    const a = -Math.PI / 2 + (i * Math.PI) / n, rr = i % 2 ? r * inner : r;
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  });

// ---------- scene 1 data (illustrative only) ----------
const MONTHS = [["1 月", 32], ["2 月", 45], ["3 月", 38], ["4 月", 60], ["5 月", 78], ["6 月", 55]];
const CITIES = [["台北市", 38, "#f7df1e"], ["新北市", 24, "#4cc9f0"], ["台中市", 16, "#ff8fb8"], ["高雄市", 12, "#7bd389"], ["其他", 10, "#ffb37a"]];
const CHALK = "#f2efe4";

function drawBoard(rc, layer, W, H, fillStyle, roughness, seed0) {
  let seed = seed0;
  const opts = (extra) => ({ roughness, stroke: CHALK, strokeWidth: 1.6, bowing: 1.2, seed: seed++, ...extra });
  const add = (node, parent = layer) => (parent.appendChild(node), node);
  const text = (str, x, y, cls, anchor = "middle", parent = layer) => svgText(parent, str, x, y, { class: cls, "text-anchor": anchor });

  function bars(x, y, w, h) {
    text("各月份程式課報名人數", x + w / 2, y, "title");
    text("示意資料", x + w / 2, y + 18, "note");
    const top = y + 46, bottom = y + h - 26, left = x + 30, right = x + w - 6, max = 90;
    add(rc.line(left, top - 6, left, bottom, opts({ strokeWidth: 2 })));
    add(rc.line(left, bottom, right, bottom, opts({ strokeWidth: 2 })));
    for (let v = 30; v <= 90; v += 30) {
      const gy = bottom - (v / max) * (bottom - top);
      add(rc.line(left, gy, right, gy, opts({ stroke: "rgba(242,239,228,0.25)", strokeWidth: 1, roughness: Math.min(roughness, 0.8) })));
      text(String(v), left - 8, gy + 4, "tick", "end");
    }
    const slot = (right - left) / MONTHS.length, bw = slot * 0.58;
    let best = 0;
    MONTHS.forEach(([, v], i) => { if (v > MONTHS[best][1]) best = i; });
    MONTHS.forEach(([m, v], i) => {
      const bx = left + slot * i + (slot - bw) / 2, bh = (v / max) * (bottom - top);
      const g = svgNode("g", { class: "bar" }, layer);
      add(rc.rectangle(bx, bottom - bh, bw, bh, opts({ fill: i === best ? "#ff8fb8" : "#4cc9f0", fillStyle, hachureGap: 5, fillWeight: 1.4 })), g);
      text(String(v), bx + bw / 2, bottom - bh - 8, "val" + (i === best ? " show" : ""), "middle", g);
      text(m, bx + bw / 2, bottom + 18, "tick", "middle", g);
      g.addEventListener("pointerenter", () => g.classList.add("hot"));
      g.addEventListener("pointerleave", () => g.classList.remove("hot"));
    });
    // whiteboard-style annotation pointing at the best month
    const bx = left + slot * best + slot / 2, by = bottom - (MONTHS[best][1] / max) * (bottom - top);
    const ax = Math.max(left + 100, bx - slot * 1.6), ay = top - 2;
    add(rc.ellipse(bx, by - 9, bw + 26, 30, opts({ stroke: "#ff8fb8", strokeWidth: 1.8, roughness: roughness + 0.2 })));
    add(rc.curve([[ax + 14, ay + 6], [ax + (bx - ax) * 0.55, ay - 6], [bx - bw / 2 - 12, by - 14]], opts({ stroke: "#ff8fb8", strokeWidth: 1.8 })));
    add(rc.linearPath([[bx - bw / 2 - 24, by - 22], [bx - bw / 2 - 12, by - 14], [bx - bw / 2 - 26, by - 9]], opts({ stroke: "#ff8fb8", strokeWidth: 1.8 })));
    text("暑假前爆滿！", ax - 8, ay + 10, "anno", "end");
  }

  function pie(cx, cy, r, titleY) {
    text("學員來自哪裡", cx, titleY, "title");
    text("示意資料", cx, titleY + 18, "note");
    let a = -Math.PI / 2;
    for (const [name, pct, color] of CITIES) {
      const span = (pct / 100) * Math.PI * 2, mid = a + span / 2;
      const g = svgNode("g", { class: "slice" }, layer);
      add(rc.arc(cx, cy, r * 2, r * 2, a, a + span, true, opts({ fill: color, fillStyle, hachureGap: 5, hachureAngle: (mid * 180) / Math.PI, fillWeight: 1.4 })), g);
      const lx = cx + Math.cos(mid) * (r + 14), ly = cy + Math.sin(mid) * (r + 14), ex = cx + Math.cos(mid) * (r + 30);
      add(rc.line(cx + Math.cos(mid) * (r - 4), cy + Math.sin(mid) * (r - 4), lx, ly, opts({ strokeWidth: 1.2, roughness: Math.min(roughness, 0.8) })), g);
      const right = Math.cos(mid) >= 0;
      text(`${name} ${pct}%`, ex + (right ? 2 : -2), ly + 4, "tick", right ? "start" : "end", g);
      const dx = Math.cos(mid) * 10, dy = Math.sin(mid) * 10;
      g.addEventListener("pointerenter", () => { g.style.transform = `translate(${dx}px, ${dy}px)`; });
      g.addEventListener("pointerleave", () => { g.style.transform = ""; });
      a += span;
    }
  }

  if (W >= 560 && W > H * 1.1) {
    const bw = Math.min(460, W * 0.48), gap = Math.max(16, W * 0.03);
    const pr = Math.max(30, Math.min(H * 0.28, (W - bw - gap) / 2 - 95));
    const x0 = Math.max(8, (W - (bw + gap + (pr + 95) * 2)) / 2);
    const top = Math.max(30, H * 0.08), bh = Math.min(H - top - 16, 420);
    bars(x0, top, bw, bh);
    pie(x0 + bw + gap + pr + 95, top + 46 + (bh - 70) / 2, pr, top);
  } else {
    const top = 30, bh = Math.min(300, H * 0.46);
    bars(14, top, W - 28, bh);
    const titleY = top + bh + 20;
    const pr = Math.max(24, Math.min(80, (H - titleY - 64) / 2, W / 2 - 100));
    pie(W / 2, titleY + 46 + pr, pr, titleY);
  }
}

// ---------- scene 2: shape primitives ----------
const SHAPES = [
  ["line", "直線"], ["rectangle", "矩形"], ["ellipse", "橢圓"], ["circle", "圓形"], ["linearPath", "折線"],
  ["polygon", "多邊形"], ["arc", "圓弧"], ["curve", "曲線"], ["path", "SVG 路徑"],
];
function drawPrimitive(rc, name, cx, cy, s, o) {
  const stroke = { ...o, fill: undefined };
  switch (name) {
    case "line": return rc.line(cx - s / 2, cy + s * 0.28, cx + s / 2, cy - s * 0.28, { ...stroke, strokeWidth: 2.4 });
    case "rectangle": return rc.rectangle(cx - s / 2, cy - s * 0.32, s, s * 0.64, o);
    case "ellipse": return rc.ellipse(cx, cy, s, s * 0.62, o);
    case "circle": return rc.circle(cx, cy, s * 0.78, o);
    case "linearPath": return rc.linearPath([[cx - s / 2, cy + s * 0.22], [cx - s / 4, cy - s * 0.26], [cx, cy + s * 0.16], [cx + s / 4, cy - s * 0.3], [cx + s / 2, cy + s * 0.12]], { ...stroke, strokeWidth: 2 });
    case "polygon": return rc.polygon(star(cx, cy, s * 0.46), o);
    case "arc": return rc.arc(cx, cy, s * 0.86, s * 0.86, -Math.PI * 0.2, Math.PI * 1.25, true, o);
    case "curve": return rc.curve(Array.from({ length: 9 }, (_, i) => [cx - s / 2 + (i * s) / 8, cy + Math.sin(i * 0.95) * s * 0.26]), { ...stroke, strokeWidth: 2 });
    default: return rc.path(heartD(cx, cy, s * 0.92), o);
  }
}

// ---------- scene 3: fill styles ----------
const FILL_STYLES = [
  ["hachure", "斜線（預設）", {}], ["solid", "實心", {}], ["zigzag", "鋸齒", {}], ["cross-hatch", "交叉線", {}],
  ["dots", "圓點", {}], ["dashed", "虛線", {}], ["zigzag-line", "鋸齒線", {}],
  ["hachure", "虛線外框＋虛線填線", { strokeLineDash: [8, 6], fillLineDash: [5, 4] }],
];

// ---------- scene 7: icon paths in a 100 x 100 box ----------
const ICONS = [
  ["愛心", "M50 88 C20 65 4 45 17 25 C30 7 48 13 50 30 C52 13 70 7 83 25 C96 45 80 65 50 88 Z", C[2]],
  ["房子", "M10 52 L50 14 L90 52 L80 52 L80 90 L20 90 L20 52 Z M42 90 L42 64 L58 64 L58 90", C[0]],
  ["閃電", "M60 6 L22 56 L46 56 L38 94 L80 40 L55 40 L66 6 Z", C[4]],
  ["雲朵", "M26 76 A16 16 0 0 1 24 44 A22 22 0 0 1 64 34 A18 18 0 0 1 78 76 Z", C[1]],
  ["音符", "M24 82 A12 9 0 1 0 48 82 A12 9 0 1 0 24 82 Z M60 72 A12 9 0 1 0 84 72 A12 9 0 1 0 60 72 Z M44 82 L44 22 L88 10 L88 72 L84 72 L84 26 L48 36 L48 82 Z", C[5]],
  ["笑臉", "M50 8 A42 42 0 1 1 49.9 8 Z M34 40 A5 5 0 1 1 33.9 40 Z M66 40 A5 5 0 1 1 65.9 40 Z M28 58 Q50 84 72 58", C[3]],
];

Showcase.run({ scenes: [
  {
    id: "chalkboard", title: "黑板圖表",
    api: "rough.svg(svg).rectangle() / arc() / curve()",
    desc: "長條圖、圓餅圖、圈選與箭頭全部由 rough.svg() 產生；換填色或潦草度時以同一組 seed 重畫，形狀保持一致。資料為示意。",
    hint: "滑過長條或扇形看數值・換填色與潦草度・重新手繪會換 seed",
    mount(ctx) {
      ctx.html(`<div class="chalkboard"><div class="stage"><svg aria-label="手繪風長條圖與圓餅圖">
        <defs><filter id="chalk" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
          <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/></filter></defs>
        <g class="layer" filter="url(#chalk)"></g></svg></div></div>`);
      const svg = ctx.$("svg"), layer = ctx.$(".layer"), stage = ctx.$(".stage");
      const rc = rough.svg(svg);
      const FILLS = [["hachure", "斜線"], ["cross-hatch", "交叉線"], ["zigzag", "鋸齒"], ["dots", "圓點"], ["solid", "實心"]];
      const ROUGH = [0.6, 1.4, 2.8];
      let fill = "hachure", rIdx = 1, seed = 7, W = 0, H = 0, first = true;
      const render = (animate) => {
        if (!W) return;
        layer.textContent = "";
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        drawBoard(rc, layer, W, H, fill, ROUGH[rIdx], seed);
        if (animate) sketchIn(layer, 0.035);
      };
      ctx.select("填色", FILLS.map(([value, label]) => ({ value, label })), fill, (v) => { fill = v; render(false); });
      ctx.group(["工整", "普通", "潦草"], rIdx, (i) => { rIdx = i; render(false); });
      ctx.button("重新手繪", () => { seed = newSeed(); render(true); }, { primary: true });
      watch(ctx, stage, (w, h) => { W = w; H = h; render(first); first = false; });
    },
  },
  {
    id: "shapes", title: "九種圖形",
    api: "rc.line / rectangle / ellipse / circle / linearPath / polygon / arc / curve / path",
    desc: "Rough.js 提供的九個繪圖方法一次排開，畫在同一張 canvas 上；path() 直接吃 SVG 路徑字串。",
    hint: "切換填色・重新手繪會換 seed，每次筆觸都不一樣",
    mount(ctx) {
      ctx.html(`<div class="stage"><canvas></canvas></div>`);
      const stage = ctx.$(".stage"), canvas = ctx.$("canvas");
      const rc = rough.canvas(canvas);
      let seed = 11, filled = true, W = 0, H = 0;
      const draw = () => {
        if (!W) return;
        const g = fitCanvas(canvas, W, H);
        cells(9, W - 16, H - 12, 3).forEach((c, i) => {
          const x = c.x + 8, y = c.y + 6, [name, zh] = SHAPES[i];
          g.fillStyle = "rgba(255,255,255,0.03)";
          g.strokeStyle = "rgba(255,255,255,0.08)";
          g.beginPath(); g.roundRect(x + 3, y + 3, c.w - 6, c.h - 6, 10); g.fill(); g.stroke();
          canvasLabel(g, zh, `${name}()`, x + 14, y + 22);
          const s = Math.min(c.w * 0.62, (c.h - 34) * 0.9);
          drawPrimitive(rc, name, x + c.w / 2, y + 30 + (c.h - 36) / 2, s, {
            seed: seed + i, stroke: FG, strokeWidth: 1.6, roughness: 1.2,
            fill: filled ? C[i % 6] : undefined, fillStyle: "hachure", hachureGap: Math.max(4, s / 16), fillWeight: 1.3,
          });
        });
      };
      ctx.toggle("填色", filled, (v) => { filled = v; draw(); });
      ctx.button("重新手繪", () => { seed = newSeed(); draw(); }, { primary: true });
      watch(ctx, stage, (w, h) => { W = w; H = h; draw(); });
    },
  },
  {
    id: "fills", title: "填充樣式",
    api: "{ fill, fillStyle: 'hachure' | 'solid' | 'zigzag' | 'cross-hatch' | 'dots' | 'dashed' | 'zigzag-line' }",
    desc: "同一個圖形套用七種 fillStyle，最後一格示範 strokeLineDash 與 fillLineDash 把外框和填線變成虛線。",
    hint: "切換圖形・拉動填線間距看各樣式怎麼反應",
    mount(ctx) {
      ctx.html(`<div class="stage"><svg></svg></div>`);
      const stage = ctx.$(".stage"), svg = ctx.$("svg");
      const rc = rough.svg(svg);
      let shape = 0, gap = 7, W = 0, H = 0;
      const draw = (animate) => {
        if (!W) return;
        svg.textContent = "";
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        const cols = W >= 600 ? 4 : 2;
        cells(8, W - 16, H - 10, cols).forEach((c, i) => {
          const x = c.x + 8, y = c.y + 5, [style, zh, extra] = FILL_STYLES[i];
          svgNode("rect", { x: x + 3, y: y + 3, width: c.w - 6, height: c.h - 6, rx: 10, fill: "rgba(255,255,255,0.03)", stroke: "rgba(255,255,255,0.08)" }, svg);
          svgText(svg, zh, x + 14, y + 22, { class: "lbl" });
          svgText(svg, `"${style}"`, x + 14, y + 37, { class: "code" });
          const cx = x + c.w / 2, cy = y + 42 + (c.h - 48) / 2, s = Math.min(c.w * 0.66, (c.h - 54) * 0.92);
          const o = { seed: 21 + i, fill: C[i % 6], fillStyle: style, stroke: FG, strokeWidth: 1.5, hachureGap: gap, fillWeight: style === "dots" ? 2 : 1.3, roughness: 1, ...extra };
          const node = shape === 0 ? rc.circle(cx, cy, s * 0.92, o)
            : shape === 1 ? rc.rectangle(cx - s * 0.48, cy - s * 0.38, s * 0.96, s * 0.76, o)
            : rc.path(heartD(cx, cy + s * 0.04, s), o);
          svg.appendChild(node);
        });
        if (animate) sketchIn(svg, 0.01);
      };
      ctx.group(["圓形", "矩形", "愛心"], shape, (i) => { shape = i; draw(true); });
      ctx.slider("填線間距", { min: 3, max: 16, step: 1, value: gap, format: (v) => `${v}px` }, (v) => { gap = v; draw(false); });
      watch(ctx, stage, (w, h) => { W = w; H = h; draw(false); });
    },
  },
  {
    id: "roughness", title: "潦草度對比",
    api: "{ roughness: 0 ~ 3+, bowing: 0 ~ 10, disableMultiStroke }",
    desc: "橫軸是 roughness（線條抖動幅度），縱軸是 bowing（直線往外彎的程度）；兩者獨立，roughness 0 就是工整的幾何線。",
    hint: "切換單筆描邊比較雙線與單線・換 seed 看同一參數的不同筆觸",
    mount(ctx) {
      ctx.html(`<div class="stage"><canvas></canvas></div>`);
      const stage = ctx.$(".stage"), canvas = ctx.$("canvas");
      const rc = rough.canvas(canvas);
      const ROUGHS = [0, 0.8, 1.8, 3.2], BOWS = [0, 2, 8];
      let seed = 5, single = false, W = 0, H = 0;
      const draw = () => {
        if (!W) return;
        const g = fitCanvas(canvas, W, H);
        const left = W < 520 ? 58 : 84, top = 30, cw = (W - left - 10) / ROUGHS.length, ch = (H - top - 8) / BOWS.length;
        g.textAlign = "center";
        ROUGHS.forEach((r, j) => {
          g.font = `600 12px ${FONT}`; g.fillStyle = FG;
          g.fillText(W < 520 ? `r ${r}` : `roughness ${r}`, left + cw * (j + 0.5), 20);
        });
        g.textAlign = "left";
        BOWS.forEach((b, i) => {
          const cy = top + ch * (i + 0.5);
          g.font = `600 12px ${FONT}`; g.fillStyle = FG;
          g.fillText(W < 520 ? `b ${b}` : `bowing ${b}`, 10, cy + 4);
          ROUGHS.forEach((r, j) => {
            const x = left + cw * j, y = top + ch * i;
            g.strokeStyle = "rgba(255,255,255,0.07)";
            g.strokeRect(x + 3.5, y + 3.5, cw - 7, ch - 7);
            const o = { seed: seed + i * 10 + j, roughness: r, bowing: b, stroke: C[i * 2], strokeWidth: 1.6, disableMultiStroke: single };
            const rw = cw * 0.62, rh = ch * 0.34;
            rc.rectangle(x + (cw - rw) / 2, y + ch * 0.14, rw, rh, o);
            rc.line(x + cw * 0.12, y + ch * 0.72, x + cw * 0.88, y + ch * 0.72, o);
          });
        });
      };
      ctx.toggle("單筆描邊", single, (v) => { single = v; draw(); });
      ctx.button("換 seed", () => { seed = newSeed(); draw(); }, { primary: true });
      watch(ctx, stage, (w, h) => { W = w; H = h; draw(); });
    },
  },
  {
    id: "hachure", title: "斜線參數",
    api: "{ hachureAngle, hachureGap, fillWeight }",
    desc: "斜線類填充（hachure、cross-hatch、zigzag、zigzag-line、dashed）都吃這三個參數：角度、間距、線寬；seed 固定，只有參數在變。",
    hint: "拖動三個滑桿・切換填充樣式",
    mount(ctx) {
      ctx.html(`<div class="solo"><div class="box"><svg></svg></div><pre class="panel codebox"></pre></div>`);
      const box = ctx.$(".box"), svg = ctx.$("svg"), code = ctx.$("pre");
      const rc = rough.svg(svg);
      const p = { fillStyle: "hachure", hachureAngle: -41, hachureGap: 8, fillWeight: 1.5 };
      let W = 0, H = 0;
      const draw = () => {
        if (!W) return;
        svg.textContent = "";
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        const o = (i, fill) => ({ seed: 40 + i, fill, stroke: FG, strokeWidth: 1.6, roughness: 1, ...p });
        const s = Math.min(H * 0.86, (W - 40) / 3.1);
        const cy = H / 2, gap = (W - s * 3) / 4;
        svg.appendChild(rc.circle(gap + s / 2, cy, s, o(0, C[1])));
        svg.appendChild(rc.polygon(Array.from({ length: 6 }, (_, k) => [gap * 2 + s * 1.5 + Math.cos((k * Math.PI) / 3) * s / 2, cy + Math.sin((k * Math.PI) / 3) * s / 2]), o(1, C[0])));
        svg.appendChild(rc.path(heartD(gap * 3 + s * 2.5, cy + s * 0.03, s), o(2, C[2])));
        const q = (v) => `<b>${typeof v === "string" ? `"${v}"` : v}</b>`;
        code.innerHTML = `rc.circle(x, y, d, {\n  fillStyle: ${q(p.fillStyle)},\n  hachureAngle: ${q(p.hachureAngle)},\n  hachureGap: ${q(p.hachureGap)},\n  fillWeight: ${q(p.fillWeight)},\n})`;
      };
      ctx.select("樣式", ["hachure", "cross-hatch", "zigzag", "zigzag-line", "dashed"], p.fillStyle, (v) => { p.fillStyle = v; draw(); });
      ctx.slider("角度", { min: -90, max: 90, step: 1, value: p.hachureAngle, format: (v) => `${v}°` }, (v) => { p.hachureAngle = v; draw(); });
      ctx.slider("間距", { min: 3, max: 24, step: 1, value: p.hachureGap }, (v) => { p.hachureGap = v; draw(); });
      ctx.slider("線寬", { min: 0.5, max: 5, step: 0.5, value: p.fillWeight, format: (v) => v.toFixed(1) }, (v) => { p.fillWeight = v; draw(); });
      watch(ctx, box, (w, h) => { W = w; H = h; draw(); });
    },
  },
  {
    id: "outputs", title: "Canvas 與 SVG",
    api: "const d = rough.generator().rectangle(…); rc.draw(d)",
    desc: "用 generator 只算一次形狀（Drawable），再分別交給 rough.canvas() 與 rough.svg() 繪製，兩邊筆觸完全相同；toPaths() 可取出原始路徑資料。",
    hint: "換 seed 兩邊同步改變・開啟手繪抖動看 boiling 效果",
    mount(ctx) {
      ctx.html(`<div class="split">
        <div class="panel pane"><h2>Canvas 輸出<code>rough.canvas(el)</code></h2><div class="box"><canvas></canvas></div><div class="meta" data-k="c"></div></div>
        <div class="panel pane"><h2>SVG 輸出<code>rough.svg(el)</code></h2><div class="box"><svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid meet"></svg></div><div class="meta" data-k="s"></div></div>
        <div class="panel wide"></div></div>`);
      const canvas = ctx.$("canvas"), svg = ctx.$("svg"), cbox = canvas.parentElement;
      const metaC = ctx.$('[data-k="c"]'), metaS = ctx.$('[data-k="s"]'), wide = ctx.$(".wide");
      const rcC = rough.canvas(canvas), rcS = rough.svg(svg), gen = rough.generator();
      let seed = 9, boil = false, tick = 0, CW = 0, CH = 0;
      const scene = (sd) => {
        const o = (i, extra) => ({ seed: sd + i, stroke: FG, strokeWidth: 1.4, roughness: 1.3, ...extra });
        return [
          gen.circle(268, 46, 54, o(0, { fill: C[0], fillStyle: "zigzag", stroke: C[0], hachureGap: 4 })),
          gen.path("M18 62 Q24 44 42 50 Q50 34 70 42 Q88 40 86 58 Q90 72 70 70 L30 72 Q14 72 18 62 Z", o(1, { fill: "#ffffff", fillStyle: "hachure", hachureGap: 6, fillWeight: 0.8 })),
          gen.rectangle(70, 112, 120, 80, o(2, { fill: C[1], fillStyle: "hachure", hachureGap: 6 })),
          gen.polygon([[58, 114], [130, 58], [202, 114]], o(3, { fill: C[2], fillStyle: "cross-hatch", hachureGap: 7 })),
          gen.rectangle(116, 146, 30, 46, o(4, { fill: C[4], fillStyle: "solid" })),
          gen.rectangle(82, 126, 24, 20, o(5, { fill: C[0], fillStyle: "dots", hachureGap: 4, fillWeight: 1.5 })),
          gen.line(256, 160, 256, 198, o(6, { strokeWidth: 3 })),
          gen.ellipse(256, 140, 58, 68, o(7, { fill: C[3], fillStyle: "hachure", hachureGap: 5 })),
          gen.curve([[0, 196], [80, 186], [160, 200], [240, 188], [320, 198]], o(8, { stroke: C[3], strokeWidth: 2 })),
        ];
      };
      const draw = () => {
        if (!CW) return;
        const list = scene(seed + (boil ? (tick % 3) * 100 : 0));
        // canvas: scale the 320 x 220 design box into the pane
        const g = fitCanvas(canvas, CW, CH), k = Math.min(CW / 320, CH / 220);
        g.save();
        g.translate((CW - 320 * k) / 2, (CH - 220 * k) / 2);
        g.scale(k, k);
        list.forEach((d) => rcC.draw(d));
        g.restore();
        // svg: same drawables, new DOM nodes
        svg.textContent = "";
        list.forEach((d) => svg.appendChild(rcS.draw(d)));
        const paths = svg.querySelectorAll("path");
        const chars = [...paths].reduce((n, p) => n + p.getAttribute("d").length, 0);
        const r = Math.min(2, window.devicePixelRatio || 1);
        metaC.textContent = `點陣 ${Math.round(CW * r)}×${Math.round(CH * r)} px・0 個 DOM 節點`;
        metaS.textContent = `${paths.length} 個 <path>・d 屬性共 ${Showcase.fmt(chars)} 字元`;
        const info = list.flatMap((d) => gen.toPaths(d));
        const first = info[2];
        wide.innerHTML = `<b>gen.toPaths(drawable)</b>：${list.length} 個 Drawable 轉出 ${info.length} 組 { d, stroke, strokeWidth, fill }；例：stroke ${first.stroke}，d = ${first.d.slice(0, 90)}…`;
      };
      ctx.button("換 seed", () => { seed = newSeed(); draw(); }, { primary: true });
      ctx.toggle("手繪抖動", boil, (v) => { boil = v; draw(); });
      ctx.interval(() => { if (boil) { tick++; draw(); } }, 160);
      watch(ctx, cbox, (w, h) => { CW = w; CH = h; draw(); });
    },
  },
  {
    id: "paths", title: "SVG 路徑",
    api: "rc.path('M50 88 C20 65 … Z', { preserveVertices })",
    desc: "path() 接受任何 SVG 路徑字串（M、L、C、Q、A、Z），把現成圖示轉成手繪風；可疊上原始路徑比對，並用 stroke-dashoffset 重播描線。",
    hint: "按描線動畫重播・拉高潦草度後開關保留頂點比較轉角",
    mount(ctx) {
      ctx.html(`<div class="stage"><svg></svg></div>`);
      const stage = ctx.$(".stage"), svg = ctx.$("svg");
      const rc = rough.svg(svg);
      let roughness = 1.2, keep = false, ghost = false, W = 0, H = 0, first = true;
      const draw = (animate) => {
        if (!W) return;
        svg.textContent = "";
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        const cols = W >= 560 ? 3 : 2;
        cells(ICONS.length, W - 16, H - 8, cols).forEach((c, i) => {
          const [name, d, color] = ICONS[i];
          const x = c.x + 8, y = c.y + 4;
          svgText(svg, name, x + 10, y + 18, { class: "lbl" });
          const k = Math.min(c.w - 20, c.h - 30) / 100;
          const gx = x + (c.w - 100 * k) / 2, gy = y + 24 + (c.h - 28 - 100 * k) / 2;
          const wrap = svgNode("g", { transform: `translate(${gx.toFixed(1)} ${gy.toFixed(1)}) scale(${k.toFixed(3)})` }, svg);
          wrap.appendChild(rc.path(d, {
            seed: 60 + i, roughness, preserveVertices: keep, stroke: FG, strokeWidth: 1.8 / k,
            fill: color, fillStyle: "hachure", hachureGap: 6 / k, fillWeight: 1.2 / k,
          }));
          if (ghost) svgNode("path", { d, fill: "none", stroke: C[2], "stroke-width": 1.2 / k, "stroke-dasharray": `${3 / k} ${3 / k}` }, wrap);
        });
        if (animate) sketchIn(svg, 0.02);
      };
      ctx.slider("潦草度", { min: 0, max: 3, step: 0.1, value: roughness, format: (v) => v.toFixed(1) }, (v) => { roughness = v; draw(false); });
      ctx.toggle("保留頂點", keep, (v) => { keep = v; draw(false); });
      ctx.toggle("原始路徑", ghost, (v) => { ghost = v; draw(false); });
      ctx.button("描線動畫", () => draw(true), { primary: true });
      watch(ctx, stage, (w, h) => { W = w; H = h; draw(first); first = false; });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "rough.canvas(el).generator + rc.draw(drawable)",
    desc: "畫面上的手繪圖形每一格都在移動；預設每格重新產生形狀（含斜線填充），逐級加量直到掉到 30 FPS 以下。開啟快取後只產生一次 Drawable，每格只負責繪製。",
    hint: "按「自動加壓」開始；切換快取 Drawable 後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="stress-stage"><canvas></canvas></div>`);
      const box = ctx.$(".stress-stage"), canvas = ctx.$("canvas");
      const rc = rough.canvas(canvas), gen = rc.generator;
      const items = [];
      let W = 0, H = 0, g = null, n = 25, cached = false, genMs = 0, drawMs = 0;
      const grow = (count) => {
        while (items.length < count) {
          const i = items.length;
          items.push({ u: Math.random(), v: Math.random(), s: 16 + Math.random() * 26, kind: i % 3, color: C[i % 6], phase: Math.random() * 6.28, seed: i + 1, d: null });
        }
      };
      const opts = (it) => ({ seed: it.seed, stroke: FG, strokeWidth: 1, fill: it.color, fillStyle: "hachure", hachureGap: 4.5, roughness: 1.2 });
      const make = (it, x, y) => it.kind === 0 ? gen.rectangle(x - it.s / 2, y - it.s / 2, it.s, it.s, opts(it))
        : it.kind === 1 ? gen.circle(x, y, it.s, opts(it))
        : gen.polygon([[x, y - it.s / 2], [x + it.s / 2, y + it.s / 2], [x - it.s / 2, y + it.s / 2]], opts(it));
      watch(ctx, box, (w, h) => { W = w; H = h; g = fitCanvas(canvas, w, h); });
      ctx.raf((t) => {
        if (!g) return;
        g.clearRect(0, 0, W, H);
        const k = t / 900, xs = new Float32Array(n), ys = new Float32Array(n), list = new Array(n);
        const t0 = performance.now();
        for (let i = 0; i < n; i++) {
          const it = items[i];
          xs[i] = 20 + it.u * (W - 40) + Math.sin(k + it.phase) * 16;
          ys[i] = 20 + it.v * (H - 40) + Math.cos(k * 0.8 + it.phase) * 12;
          list[i] = cached ? (it.d || (it.d = make(it, 0, 0))) : make(it, xs[i], ys[i]);
        }
        const t1 = performance.now();
        for (let i = 0; i < n; i++) {
          if (cached) { g.save(); g.translate(xs[i], ys[i]); rc.draw(list[i]); g.restore(); }
          else rc.draw(list[i]);
        }
        const t2 = performance.now();
        genMs = genMs * 0.85 + (t1 - t0) * 0.15;
        drawMs = drawMs * 0.85 + (t2 - t1) * 0.15;
      });
      ctx.toggle("快取 Drawable", cached, (v) => { cached = v; });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "圖形", unit: "個", steps: [25, 50, 100, 200, 400, 800, 1600, 3200], minFps: 30,
        apply(count) { grow(count); n = count; },
        metrics: () => ({ "模式": cached ? "快取只繪製" : "每格重新產生", "產生": `${genMs.toFixed(1)} ms`, "繪製": `${drawMs.toFixed(1)} ms` }),
        note: "Rough.js 的成本主要在產生階段：每個形狀都要算隨機抖動的外框與數十條斜線。快取後產生時間趨近 0，瓶頸轉到 canvas 描線本身。",
      });
    },
  },
] });
</script>
</body>
