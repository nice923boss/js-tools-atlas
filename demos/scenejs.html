<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene.js 示範：日夜循環時間軸</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  h1 { position: fixed; left: 16px; top: 14px; margin: 0; font-size: 16px; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .scene { position: fixed; left: 16px; right: 16px; top: 56px; bottom: 222px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); }
  .sky { position: absolute; inset: 0; background-color: #ffb38a; }
  .sky::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 30%, rgba(255, 255, 255, .18)); }
  .glow { position: absolute; left: -10%; right: -10%; bottom: 0; height: 70%; background: radial-gradient(50% 60% at 50% 100%, rgba(255, 120, 60, .75), transparent 70%); }
  .stars { position: absolute; inset: 0 0 30% 0; opacity: 0; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: tw 1.6s infinite alternate; }
  @keyframes tw { to { opacity: .3; } }
  .arm { position: absolute; left: 50%; bottom: 20%; height: 72%; width: 0; transform-origin: 50% 100%; }
  .orb { position: absolute; top: 0; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; }
  .sun { background: radial-gradient(circle, #fff6c2, #ffd23f 60%, #ffb21e); box-shadow: 0 0 40px 12px rgba(255, 210, 63, .55); }
  .moon { background: radial-gradient(circle at 35% 35%, #ffffff, #dfe4f2 60%, #b9c2da); box-shadow: 0 0 30px 6px rgba(220, 230, 255, .35); }
  .clouds { position: absolute; inset: 0; opacity: .9; }
  .cloud { position: absolute; width: 120px; height: 34px; border-radius: 30px; background: #fff; }
  .cloud::before, .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .cloud::before { width: 54px; height: 54px; left: 18px; top: -26px; }
  .cloud::after { width: 40px; height: 40px; left: 60px; top: -16px; }
  .c1 { top: 18%; left: -25%; }
  .c2 { top: 34%; left: 45%; transform: scale(.7); }
  .city { position: absolute; left: 0; bottom: 0; width: 100%; height: 34%; display: block; }
  .clock { position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 10px; background: rgba(14, 16, 19, .55); backdrop-filter: blur(4px); font: 700 22px var(--mono); }
  .clock small { font: 600 12px var(--font); color: #e6e3d8; margin-left: 6px; }
  .peek { position: absolute; right: 12px; top: 12px; width: 330px; margin: 0; padding: 10px 12px; border-radius: 10px; background: rgba(14, 16, 19, .85); color: #cfe9d3; font: 11px/1.5 var(--mono); white-space: pre; overflow: hidden; }
  .peek b { color: var(--accent); font-weight: 600; }

  /* Timeline: a label column and a lane column whose rows line up one to one. */
  .tl { position: fixed; left: 16px; right: 16px; bottom: 48px; padding: 10px 14px; display: grid; grid-template-columns: 104px 1fr; column-gap: 12px; }
  .col { display: grid; row-gap: 4px; align-content: start; }
  .lane { position: relative; }
  .lab { height: 14px; font-size: 12px; line-height: 14px; color: var(--muted); white-space: nowrap; }
  .lab code { font: 10px var(--mono); margin-left: 4px; opacity: .7; }
  .ruler, .track { height: 14px; }
  .ruler { display: flex; justify-content: space-between; font: 10px/14px var(--mono); color: var(--muted); }
  .track { position: relative; border-radius: 4px; background: var(--bg-2); }
  .track i { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; background: var(--c); transform: rotate(45deg); border-radius: 1px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); }
  .lab.t, #scrub { height: 18px; line-height: 18px; }
  #scrub { width: 100%; margin: 0; accent-color: var(--accent); }
  .head { position: absolute; top: 0; bottom: 22px; width: 2px; margin-left: -1px; background: var(--accent); box-shadow: 0 0 8px var(--accent); pointer-events: none; }

  @media (max-width: 620px) {
    h1 { display: none; }
    .scene { left: 10px; right: 10px; top: 52px; bottom: 214px; }
    .clock { font-size: 16px; left: 8px; top: 8px; padding: 4px 8px; }
    .orb { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
    .cloud { width: 84px; height: 24px; }
    .cloud::before { width: 38px; height: 38px; left: 12px; top: -18px; }
    .cloud::after { width: 28px; height: 28px; left: 42px; top: -11px; }
    .peek { display: none; }
    .tl { left: 10px; right: 10px; bottom: 44px; padding: 8px 10px; grid-template-columns: 34px 1fr; column-gap: 8px; }
    .lab code { display: none; }
  }
</style>
</head>
<body>
<h1>日夜循環<small>同一份關鍵影格，可用 JS 逐格播放，也能匯出成 CSS @keyframes</small></h1>
<div class="controls">
  <button class="btn" id="play" aria-pressed="true">暫停</button>
  <button class="btn" id="mode" aria-pressed="false">CSS 模式</button>
  <button class="btn primary" id="replay">重播</button>
</div>

<div class="scene">
  <div class="sky"></div>
  <div class="glow"></div>
  <div class="stars" id="stars"></div>
  <div class="arm sun-arm"><div class="orb sun"></div></div>
  <div class="arm moon-arm"><div class="orb moon"></div></div>
  <div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div></div>
  <svg class="city" viewBox="0 0 800 160" preserveAspectRatio="none" id="city" aria-hidden="true"></svg>
  <div class="clock" id="clock">06:00<small>清晨</small></div>
  <pre class="peek" id="peek" hidden></pre>
</div>

<section class="panel tl">
  <div class="col" id="labels"></div>
  <div class="col lane" id="lanes"></div>
</section>
<div class="hint">拖動時間軸可停在任一刻，按 CSS 模式改由瀏覽器播放</div>

<script src="https://cdn.jsdelivr.net/npm/scenejs@1.10.3/dist/scene.min.js"></script>
<script>
const DURATION = 8;
const rnd = (a, b) => a + Math.random() * (b - a);

// Static scenery first: Scene.js resolves selectors (like every ".win") when it is constructed.
(function buildScenery() {
  const svg = ['<path d="M0 120 Q120 70 240 105 T520 96 T800 110 V160 H0 Z" fill="#20283a"/>'];
  for (let x = 10; x < 790;) {
    const w = rnd(46, 84), h = rnd(54, 128);
    svg.push(`<rect x="${x}" y="${160 - h}" width="${w}" height="${h}" fill="#151a26"/>`);
    for (let wy = 160 - h + 10; wy < 150; wy += 14)
      for (let wx = x + 8; wx < x + w - 10; wx += 13)
        if (Math.random() < 0.55) svg.push(`<rect class="win" x="${wx}" y="${wy}" width="6" height="7" fill="${Math.random() < 0.8 ? "#ffd56b" : "#9fd0ff"}"/>`);
    x += w + rnd(4, 14);
  }
  svg.push('<rect y="152" width="800" height="8" fill="#0d1018"/>');
  document.getElementById("city").innerHTML = svg.join("");
  document.getElementById("stars").innerHTML = Array.from({ length: 46 }, () =>
    `<i style="left:${rnd(2, 98)}%;top:${rnd(3, 95)}%;animation-delay:${rnd(0, 1.6)}s"></i>`).join("");
})();

// Keyframe table: selector -> { second: value }, one 8 s day.
const KEYS = {
  ".sky": { 0: "#ffb38a", 1.2: "#8fd0ff", 2.2: "#5fb4ff", 3.4: "#8fc4ff", 4: "#ff9466", 4.6: "#4b3a7a", 5.4: "#101736", 7: "#101736", 7.6: "#5a4a8a", 8: "#ffb38a" },
  ".sun-arm": { 0: -90, 4.3: 90, 8: 270 },
  ".moon-arm": { 0: 90, 4.3: 270, 8: 450 },
  ".stars": { 0: 0, 4.4: 0, 5.4: 1, 7.2: 1, 7.9: 0, 8: 0 },
  ".win": { 0: 0.15, 3.9: 0.15, 4.6: 1, 7.4: 1, 8: 0.15 },
  ".glow": { 0: 0.9, 1.2: 0, 3.4: 0, 4.1: 1, 4.8: 0, 7.2: 0, 8: 0.9 },
  ".clouds": { 0: 0.9, 4.4: 0.9, 5.4: 0.25, 7.2: 0.25, 8: 0.9 },
  ".c1": { 0: -25, 8: 110 },
  ".c2": { 0: 45, 4.4: 110, 4.41: -25, 8: 45 },
};
const PROP = {
  ".sky": (v) => ({ "background-color": v }),
  ".sun-arm": (v) => ({ transform: `rotate(${v}deg)` }),
  ".moon-arm": (v) => ({ transform: `rotate(${v}deg)` }),
  ".c1": (v) => ({ left: `${v}%` }),
  ".c2": (v) => ({ left: `${v}%` }),
};
const sceneData = Object.fromEntries(Object.entries(KEYS).map(([sel, keys]) =>
  [sel, Object.fromEntries(Object.entries(keys).map(([t, v]) => [t, (PROP[sel] || ((o) => ({ opacity: o })))(v)]))]));
const scene = new Scene(sceneData, { selector: true, iterationCount: "infinite" });

// Timeline lanes drawn from the same table, so every diamond is a real keyframe.
const TRACKS = [[".sky", "天空", "var(--c2)"], [".sun-arm", "太陽", "var(--c1)"], [".moon-arm", "月亮", "#dfe4f2"],
  [".stars", "星星", "var(--c6)"], [".win", "窗燈", "var(--c5)"], [".c1", "雲", "var(--c4)"]];
const pct = (t) => `${(t / DURATION) * 100}%`;
document.getElementById("labels").innerHTML = '<div class="lab"></div>' +
  TRACKS.map(([sel, name]) => `<div class="lab">${name}<code>${sel}</code></div>`).join("") + '<div class="lab t">時間</div>';
document.getElementById("lanes").innerHTML =
  `<div class="ruler">${[0, 2, 4, 6, 8].map((s) => `<span>${s}s</span>`).join("")}</div>` +
  TRACKS.map(([sel, , color]) => {
    // Integer-like keys come first in object order, so sort by time before drawing stops.
    const keys = Object.entries(KEYS[sel]).sort((a, b) => a[0] - b[0]);
    const bg = sel === ".sky" ? `background:linear-gradient(90deg,${keys.map(([t, c]) => `${c} ${pct(t)}`).join(",")})` : "";
    return `<div class="track" style="--c:${color};${bg}">${keys.map(([t]) => `<i style="left:${pct(t)}"></i>`).join("")}</div>`;
  }).join("") +
  '<input type="range" id="scrub" min="0" max="8" step="0.01" value="0" aria-label="時間"><div class="head" id="head"></div>';

const scrub = document.getElementById("scrub");
const head = document.getElementById("head");
const clock = document.getElementById("clock");
const playBtn = document.getElementById("play");
const modeBtn = document.getElementById("mode");
const peek = document.getElementById("peek");
let cssMode = false, cssStart = 0, cssTimer = null;

const PERIODS = [[5, "深夜"], [8, "清晨"], [11, "上午"], [13, "正午"], [17, "下午"], [19, "黃昏"], [24, "夜晚"]];
function showTime(t) {
  head.style.left = pct(t);
  scrub.value = t;
  // The sun is up from 0 to 4.3 s (06:00 to 18:00); the remaining 3.7 s cover the night.
  const hour = t < 4.3 ? 6 + (t / 4.3) * 12 : (18 + ((t - 4.3) / 3.7) * 12) % 24;
  const h = Math.floor(hour), m = Math.floor((hour - h) * 60);
  const label = PERIODS.find(([end]) => hour < end)[1];
  clock.innerHTML = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}<small>${label}</small>`;
}
scene.on("animate", (e) => showTime(e.time));

function setPlaying(on) {
  playBtn.setAttribute("aria-pressed", on);
  playBtn.textContent = on ? "暫停" : "播放";
}
// Back to JS playback: stop the CSS animation and continue from where the browser was.
function leaveCss() {
  if (!cssMode) return;
  cssMode = false;
  clearInterval(cssTimer);
  const t = ((performance.now() - cssStart) / 1000) % DURATION;
  // end() runs endCSS() and fires "ended", which detaches Scene's animationcancel handler
  // (otherwise that handler would rewind the scene to 0 s a frame later).
  scene.end();
  modeBtn.setAttribute("aria-pressed", "false");
  peek.hidden = true;
  scene.setTime(t);
}
// Same keyframes, now exported as @keyframes and played by the browser (restarts at 0 s).
function enterCss() {
  scene.pause();
  // The exported 0% stop is empty on purpose: it falls back to the inline style of setTime(0).
  scene.setTime(0);
  cssMode = true;
  scene.playCSS();
  cssStart = performance.now();
  modeBtn.setAttribute("aria-pressed", "true");
  setPlaying(true);
  const css = scene.toCSS().replace(/\s+/g, " ");
  const [, name, body] = css.match(/@keyframes (\S+?)\{(.*?\})\}/);
  const stops = [...body.matchAll(/([\d.]+)%\{\s*([^}]*?);?\s*\}/g)]
    .map(([, at, decl]) => `  ${+Number(at).toFixed(1)}%{${decl.replace(/\s/g, "")}}${decl ? "" : "  ← 沿用行內樣式"}`);
  peek.innerHTML = [`<b>scene.toCSS()：共 ${css.length.toLocaleString()} 字元</b>`, `@keyframes ${name}{`,
    ...stops.slice(0, 7), "  …", "}"].join("\n");
  peek.hidden = false;
  cssTimer = setInterval(() => showTime(((performance.now() - cssStart) / 1000) % DURATION), 50);
}

playBtn.addEventListener("click", () => {
  if (cssMode) { leaveCss(); setPlaying(false); return; }
  const on = scene.getPlayState() !== "running";
  on ? scene.play() : scene.pause();
  setPlaying(on);
});
modeBtn.addEventListener("click", () => {
  if (cssMode) { leaveCss(); scene.play(); setPlaying(true); } else enterCss();
});
scrub.addEventListener("input", () => {
  leaveCss();
  scene.pause();
  setPlaying(false);
  scene.setTime(Number(scrub.value));
});
document.getElementById("replay").addEventListener("click", () => {
  leaveCss();
  scene.pause();
  scene.setTime(0);
  scene.play();
  setPlaying(true);
});

scene.setTime(0.6);
scene.play();
</script>
</body>
</html>
