<style>
  .pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 12px calc(var(--sc-ctl-b, 0px) + 10px); display: flex; flex-direction: column; gap: 8px; }

  .scrub input { width: 100%; margin: 0; }

  /* 1. day cycle */
  .s1 .world { flex: 1 1 0; padding: 0; }

  .s1 .glow { position: absolute; left: -10%; right: -10%; bottom: 0; height: 70%; background: radial-gradient(50% 60% at 50% 100%, rgba(255, 120, 60, .75), transparent 70%); }

  .s1 .cloud { position: absolute; width: 120px; height: 34px; border-radius: 30px; background: #fff; }
  .s1 .cloud::before, .s1 .cloud::after { content: ""; position: absolute; border-radius: 50%; background: inherit; }
  .s1 .cloud::before { width: 54px; height: 54px; left: 18px; top: -26px; }
  .s1 .cloud::after { width: 40px; height: 40px; left: 60px; top: -16px; }
  .s1 .c1 { top: 18%; left: -25%; }

  .s1 .clock { position: absolute; left: 12px; top: 12px; padding: 6px 12px; border-radius: 10px; background: rgba(14, 16, 19, .6); color: #f2f0e8; font: 700 22px var(--mono); }

  /* Timeline: a label column and a lane column whose rows line up one to one. */

  .s1 .lab { height: 14px; font-size: 12px; line-height: 14px; color: var(--muted); white-space: nowrap; }

  .s1 .ruler { display: flex; justify-content: space-between; font: 10px/14px var(--mono); color: var(--muted); }
  .s1 .track { position: relative; border-radius: 4px; background: var(--bg-2); }
  .s1 .track i { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; background: var(--c); transform: rotate(45deg); border-radius: 1px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); }
  .s1 .lab.t, .s1 .scrub-in { height: 18px; line-height: 18px; }

  @media (max-height: 480px) { .s1 .opt { display: none; } }
  @media (max-width: 620px) {
    .s1 .clock { font-size: 16px; left: 8px; top: 8px; padding: 4px 8px; }

  /* 2. keyframe editor */

  .s2 .dia { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; padding: 0; border: 0; border-radius: 2px; transform: rotate(45deg); background: var(--c2); cursor: pointer; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); }

  .s3 .cv polyline { fill: none; stroke: var(--c); stroke-width: 1.6; vector-effect: non-scaling-stroke; }

  .s3 .rn { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 50%, transparent); }

  .s3 .row output.over { color: var(--c3); }
  @media (max-width: 760px) { .s3 .row { grid-template-columns: 96px 52px minmax(0, 1fr); gap: 8px; } .s3 .row output { display: none; } .s3 .rows { padding: 4px 8px; } }

  @media (max-width: 560px), (max-height: 560px) { .s3 .nm code { display: none; } }

  /* 4. value kinds */
  .s4 .grid { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }

  .s4 .meter { height: 12px; border-radius: 6px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; }

  @media (max-width: 760px) { .s4 .grid { gap: 6px; } .s4 .cell { padding: 6px 8px; gap: 4px; } .s4 .hd code { display: none; } .s4 .cell > .ro { font-size: 10px; } }

  /* 5. stagger */
  .s5 .eqp { flex: 1 1 0; padding: 0; }
  .s5 .eq, .s5 .dl { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 4px; }
  .s5 .eq { position: absolute; inset: 0; padding: 18px; }
  .s5 .eq i { display: block; border-radius: 4px; transform-origin: 50% 100%; transform: scaleY(.12); background: #4cc9f0; }
  .s5 .dlp { flex: none; padding: 8px 18px; }
  .s5 .dlp .lh { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  .s5 .dl { height: 46px; align-items: end; }
  .s5 .dl i { display: block; min-height: 2px; border-radius: 2px 2px 0 0; background: var(--c6); }
  .s5 .info { flex: none; padding: 0 4px; }
  @media (max-width: 760px) { .s5 .eq, .s5 .dl { gap: 2px; } .s5 .eq { padding: 10px; } .s5 .dlp { padding: 6px 10px; } .s5 .dl { height: 34px; } }

  /* 6. nesting and chaining */
  .s6 .view { flex: 1 1 0; display: grid; place-items: center; padding: 12px; }
  .s6 .mid { display: flex; flex-direction: column; align-items: center; gap: 12px; width: min(330px, 100%); }
  .s6 .card { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 14px; background: var(--bg-2); border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(0, 0, 0, .28); }
  .s6 .card .ic { flex: none; width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--c2); color: #0e1013; font: 900 20px/1 var(--font); }

  .s6 .gl { font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s6 .gl b { color: var(--fg); font-weight: 600; margin-right: 6px; }
  .s6 .rul { position: relative; height: 14px; font: 10px/14px var(--mono); color: var(--muted); }

<script src="_shared/showcase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/scenejs@1.10.3/dist/scene.min.js"></script>
<script>
const { h } = Showcase;
const { SceneItem } = Scene;
// Scope Scene.js selectors to one scene so they never match another scene's markup.
const scope = (id) => (name) => `.sc-scene[data-scene="${id}"] ${name}`;
const rnd = (a, b) => a + Math.random() * (b - a);
const num = parseFloat;
const PAL = ["#4cc9f0", "#f7df1e", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
// Trim float noise such as 166.25999999999998 to two decimals for display.
const fix = (s) => String(s).replace(/-?\d+\.\d{3,}/g, (m) => String(+(+m).toFixed(2)));
const cssText = (frame) => fix(frame.toCSSText()).replace(/;\s*/g, "; ").trim();
const playToggle = (ctx, anim) => ctx.toggle("播放", true, (v) => (v ? anim.play() : anim.pause()));

// A time slider row bound to an animator: dragging pauses and seeks; returns a painter for the current time.
function scrubber(ctx, host, anim, max, playBtn) {
  host.innerHTML = `<span>時間</span><input type="range" min="0" max="${max}" step="0.01" value="0" aria-label="時間"><output>0.00 s</output>`;
  const input = host.querySelector("input"), out = host.querySelector("output");
  ctx.on(input, "input", () => {
    anim.pause();
    playBtn.setAttribute("aria-pressed", "false");
    anim.setTime(+input.value);
  });
  return (t) => { input.value = t; out.textContent = `${t.toFixed(2)} s`; };
}

// ---------- scene 1 data: one 8 s day ----------
const DAY = 8;
const DAY_KEYS = {
  ".sky": { 0: "#ffb38a", 1.2: "#8fd0ff", 2.2: "#5fb4ff", 3.4: "#8fc4ff", 4: "#ff9466", 4.6: "#4b3a7a", 5.4: "#101736", 7: "#101736", 7.6: "#5a4a8a", 8: "#ffb38a" },
  ".sun-arm": { 0: -90, 4.3: 90, 8: 270 },
  ".moon-arm": { 0: 90, 4.3: 270, 8: 450 },
  ".stars": { 0: 0, 4.4: 0, 5.4: 1, 7.2: 1, 7.9: 0, 8: 0 },
  ".win": { 0: 0.15, 3.9: 0.15, 4.6: 1, 7.4: 1, 8: 0.15 },
  ".glow": { 0: 0.9, 1.2: 0, 3.4: 0, 4.1: 1, 4.8: 0, 7.2: 0, 8: 0.9 },
  ".clouds": { 0: 0.9, 4.4: 0.9, 5.4: 0.25, 7.2: 0.25, 8: 0.9 },
  ".c1": { 0: -25, 8: 110 },
  ".c2": { 0: 45, 4.4: 110, 4.41: -25, 8: 45 },
};
const DAY_PROP = {
  ".sky": (v) => ({ "background-color": v }),
  ".sun-arm": (v) => ({ transform: `rotate(${v}deg)` }),
  ".moon-arm": (v) => ({ transform: `rotate(${v}deg)` }),
  ".c1": (v) => ({ left: `${v}%` }),
  ".c2": (v) => ({ left: `${v}%` }),
};
const dayData = () => Object.fromEntries(Object.entries(DAY_KEYS).map(([sel, keys]) =>
  [sel, Object.fromEntries(Object.entries(keys).map(([t, v]) => [t, (DAY_PROP[sel] || ((o) => ({ opacity: o })))(v)]))]));
const DAY_TRACKS = [[".sky", "天空", "var(--c2)"], [".sun-arm", "太陽", "var(--c1)"], [".moon-arm", "月亮", "#dfe4f2"],
  [".stars", "星星", "var(--c6)", "opt"], [".win", "窗燈", "var(--c5)", "opt"], [".c1", "雲", "var(--c4)", "opt"]];
const PERIODS = [[5, "深夜"], [8, "清晨"], [11, "上午"], [13, "正午"], [17, "下午"], [19, "黃昏"], [24, "夜晚"]];

function cityMarkup() {
  const svg = ['<path d="M0 120 Q120 70 240 105 T520 96 T800 110 V160 H0 Z" fill="#20283a"/>'];
  for (let x = 10; x < 790;) {
    const w = rnd(46, 84), hh = rnd(54, 128);
    svg.push(`<rect x="${x}" y="${160 - hh}" width="${w}" height="${hh}" fill="#151a26"/>`);
    for (let wy = 160 - hh + 10; wy < 150; wy += 14)
      for (let wx = x + 8; wx < x + w - 10; wx += 13)
        if (Math.random() < 0.55) svg.push(`<rect class="win" x="${wx}" y="${wy}" width="6" height="7" fill="${Math.random() < 0.8 ? "#ffd56b" : "#9fd0ff"}"/>`);
    x += w + rnd(4, 14);
  }
  svg.push('<rect y="152" width="800" height="8" fill="#0d1018"/>');
  return svg.join("");
}

// ---------- scene 4 data ----------
const BLOB_A = "M 60 15 C 85 15 105 35 105 60 C 105 85 85 105 60 105 C 35 105 15 85 15 60 C 15 35 35 15 60 15 Z";
const BLOB_B = "M 60 5 C 70 40 80 50 115 60 C 80 70 70 80 60 115 C 50 80 40 70 5 60 C 40 50 50 40 60 5 Z";

Showcase.run({ scenes: [
  {
    id: "day", title: "晝夜循環",
    api: 'new Scene({ ".sky": { 0: {...}, 8: {...} }, ... }, { selector: true, iterationCount: "infinite" })',
    desc: "一張關鍵影格表同時驅動天空顏色、日月旋轉臂、星星、窗燈與雲，共 9 組選擇器。下方時間軸的每個菱形都是表裡真實的影格；拖動即呼叫 setTime() 停在任一刻，速度切換用 setPlaySpeed()，右上角顯示 animate 事件回報的時間與圈數。",
    hint: "拖動下方時間軸停在任一刻，或切換播放速度",
    mount(ctx) {
      ctx.html(`<div class="pad s1">
        <div class="panel box world">
          <div class="sky"></div><div class="glow"></div><div class="stars"></div>
          <div class="arm sun-arm"><div class="orb sun"></div></div>
          <div class="arm moon-arm"><div class="orb moon"></div></div>
          <div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div></div>
          <svg class="city" viewBox="0 0 800 160" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="clock"></div><div class="chip"></div>
        </div>
        <div class="panel box tl"><div class="col labels"></div><div class="col lanes"></div></div>
      </div>`);
      // Static scenery first: Scene.js resolves selectors (like every ".win") when it is constructed.
      ctx.$(".city").innerHTML = cityMarkup();
      ctx.$(".stars").innerHTML = Array.from({ length: 46 }, () =>
        `<i style="left:${rnd(2, 98)}%;top:${rnd(3, 95)}%;animation-delay:${rnd(0, 1.6)}s"></i>`).join("");
      const pct = (t) => `${(t / DAY) * 100}%`;
      ctx.$(".labels").innerHTML = '<div class="lab"></div>' +
        DAY_TRACKS.map(([sel, name, , opt]) => `<div class="lab ${opt || ""}">${name}<code>${sel}</code></div>`).join("") + '<div class="lab t">時間</div>';
      ctx.$(".lanes").innerHTML =
        `<div class="ruler">${[0, 2, 4, 6, 8].map((s) => `<span>${s}s</span>`).join("")}</div>` +
        DAY_TRACKS.map(([sel, , color, opt]) => {
          // Integer-like keys come first in object order, so sort by time before drawing stops.
          const keys = Object.entries(DAY_KEYS[sel]).sort((a, b) => a[0] - b[0]);
          const bg = sel === ".sky" ? `background:linear-gradient(90deg,${keys.map(([t, c]) => `${c} ${pct(t)}`).join(",")})` : "";
          return `<div class="track ${opt || ""}" style="--c:${color};${bg}">${keys.map(([t]) => `<i style="left:${pct(t)}"></i>`).join("")}</div>`;
        }).join("") +
        '<input type="range" class="scrub-in" min="0" max="8" step="0.01" value="0" aria-label="時間"><div class="head"></div>';

      const scene = new Scene(dayData(), { selector: scope("day"), iterationCount: "infinite" });
      ctx.onCleanup(() => { scene.end(); scene.clear(); });
      const scrub = ctx.$(".scrub-in"), head = ctx.$(".head"), clock = ctx.$(".clock"), chip = ctx.$(".chip");
      let speed = 1;
      scene.on("animate", (e) => {
        const t = e.time;
        head.style.left = pct(t);
        scrub.value = t;
        // The sun is up from 0 to 4.3 s (06:00 to 18:00); the remaining 3.7 s cover the night.
        const hour = t < 4.3 ? 6 + (t / 4.3) * 12 : (18 + ((t - 4.3) / 3.7) * 12) % 24;
        const hh = Math.floor(hour), mm = Math.floor((hour - hh) * 60);
        clock.innerHTML = `${String(hh).padStart(2, "0")}:${String(mm).padStart(2, "0")}<small>${PERIODS.find(([end]) => hour < end)[1]}</small>`;
        chip.textContent = `time ${t.toFixed(2)} s・第 ${Math.floor(e.currentTime / DAY) + 1} 圈・${speed}×`;
      });
      const playBtn = playToggle(ctx, scene);
      ctx.group(["0.5×", "1×", "2×"], 1, (i) => { speed = [0.5, 1, 2][i]; scene.setPlaySpeed(speed); });
      ctx.button("重播", () => {
        scene.pause();
        scene.setTime(0);
        scene.play();
        playBtn.setAttribute("aria-pressed", "true");
      }, { primary: true });
      ctx.on(scrub, "input", () => {
        scene.pause();
        playBtn.setAttribute("aria-pressed", "false");
        scene.setTime(+scrub.value);
      });
      scene.setTime(0.6);
      scene.play();
    },
  },

  {
    id: "item", title: "影格編輯",
    api: "item.set(time, props)・item.removeFrame(time)・item.getFrame(time)・item.getNowFrame(time)",
    desc: "單一 SceneItem 有 0、1.5、3 秒三個關鍵影格（位置、旋轉縮放、顏色、圓角），方向 alternate 來回播放。按「新增影格」在目前時間用 set() 插入隨機影格，路徑虛線與右側清單立刻重算；點任一影格可停在該時間，「刪除影格」呼叫 removeFrame()。",
    hint: "播放中按「新增影格」插入一格，再點選它刪除",
    mount(ctx) {
      ctx.html(`<div class="pad s2">
        <div class="split">
          <div class="panel box view"><div class="field">
            <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline/></svg>
            <div class="marks"></div><div class="puck"></div>
          </div></div>
          <div class="panel box side"><div class="lh">item.getFrame(t).toCSSText()</div><div class="frames"></div><div class="now"></div><div class="ro meta"></div></div>
        </div>
        <div class="panel box keys"><div class="kt"></div><input type="range" min="0" max="3" step="0.01" value="0" aria-label="時間"><output>0.00 s</output></div>
      </div>`);
      const D = 3;
      const item = new SceneItem({
        0: { left: "12%", top: "70%", transform: { rotate: "0deg", scale: 1 }, "background-color": "#4cc9f0", "border-radius": "14%" },
        1.5: { left: "50%", top: "25%", transform: { rotate: "180deg", scale: 1.35 }, "background-color": "#f7df1e", "border-radius": "50%" },
        3: { left: "88%", top: "70%", transform: { rotate: "360deg", scale: 1 }, "background-color": "#f72585", "border-radius": "14%" },
      }, { iterationCount: "infinite", direction: "alternate" }).setElement(ctx.$(".puck"));
      ctx.onCleanup(() => { item.end(); item.clear(); });
      const poly = ctx.$("polyline"), marks = ctx.$(".marks"), frames = ctx.$(".frames"), nowEl = ctx.$(".now");
      const meta = ctx.$(".meta"), kt = ctx.$(".kt"), range = ctx.$(".keys input"), out = ctx.$(".keys output");
      let sel = null, now = 0;
      const playBtn = playToggle(ctx, item);
      const paintNow = (frame) => {
        nowEl.innerHTML = `<b>getNowFrame(${now.toFixed(2)})</b> ${cssText(frame || item.getNowFrame(now))}`;
        range.value = now;
        out.textContent = `${now.toFixed(2)} s`;
        const head = kt.querySelector(".khead");
        if (head) head.style.left = `${(now / D) * 100}%`;
      };
      const redraw = () => {
        const ts = item.times.slice();
        // The dashed path samples the interpolated frame, so it bends as soon as a keyframe changes.
        poly.setAttribute("points", Array.from({ length: 91 }, (_, i) => {
          const f = item.getNowFrame((i / 90) * D);
          return `${num(f.get("left"))},${num(f.get("top"))}`;
        }).join(" "));
        const on = (t) => (t === sel ? " on" : "");
        marks.innerHTML = ts.map((t) => {
          const f = item.getFrame(t);
          return `<button class="mk${on(t)}" type="button" data-t="${t}" title="${t} s" style="left:${num(f.get("left"))}%;top:${num(f.get("top"))}%"><span>${t.toFixed(2)}s</span></button>`;
        }).join("");
        frames.innerHTML = ts.map((t) => `<button class="fr${on(t)}" type="button" data-t="${t}"><b>${t.toFixed(2)} s</b>${cssText(item.getFrame(t))}</button>`).join("");
        kt.innerHTML = ts.map((t) => `<button class="dia${on(t)}" type="button" data-t="${t}" title="${t} s" style="left:${(t / D) * 100}%"></button>`).join("") + '<i class="khead"></i>';
        meta.innerHTML = `getDuration() <b>${item.getDuration()} s</b>・size() <b>${item.size()}</b> 個影格・alternate`;
        delBtn.disabled = !(sel > 0 && sel < D);
        delBtn.title = delBtn.disabled ? "先點選 0 與 3 秒以外的影格" : `removeFrame(${sel})`;
        paintNow();
      };
      ctx.button("新增影格", () => {
        const t = Math.min(D - 0.1, Math.max(0.1, Math.round(now * 20) / 20));
        const near = item.times.find((x) => Math.abs(x - t) < 0.08);
        if (near != null) sel = near;
        else {
          item.set(t, {
            left: `${Math.round(rnd(10, 90))}%`, top: `${Math.round(rnd(15, 85))}%`,
            transform: { rotate: `${Math.round(rnd(0, 360))}deg`, scale: +rnd(0.8, 1.4).toFixed(2) },
            "background-color": PAL[Math.floor(Math.random() * PAL.length)], "border-radius": `${Math.round(rnd(10, 50))}%`,
          });
          sel = t;
        }
        if (playBtn.getAttribute("aria-pressed") !== "true") item.setTime(now);
        redraw();
      }, { primary: true });
      const delBtn = ctx.button("刪除影格", () => {
        if (!(sel > 0 && sel < D)) return;
        item.removeFrame(sel);
        sel = null;
        if (playBtn.getAttribute("aria-pressed") !== "true") item.setTime(now);
        redraw();
      });
      ctx.on(ctx.el, "click", (e) => {
        const b = e.target.closest("[data-t]");
        if (!b) return;
        sel = +b.dataset.t;
        item.pause();
        playBtn.setAttribute("aria-pressed", "false");
        item.setTime(sel);
        redraw();
      });
      ctx.on(range, "input", () => {
        item.pause();
        playBtn.setAttribute("aria-pressed", "false");
        item.setTime(+range.value);
      });
      item.on("animate", (e) => { now = e.time; paintNow(e.frame); });
      redraw();
      item.play();
    },
  },

  {
    id: "easing", title: "緩動曲線",
    api: 'new SceneItem(keyframes, { easing: "ease-in" })・{ 1.3: { left: "50%", easing: "ease-out" } }',
    desc: "八條跑道用同一組影格（0.3 秒起跑、2.3 秒到終點），只換 easing 選項：CSS 關鍵字、steps(5)、超出範圍的 cubic-bezier 回彈，以及在影格裡逐段指定 easing。左側小圖是 getNowFrame() 取樣畫出的實際進度曲線，回彈那條會衝出 0% 到 100% 的虛線框。",
    hint: "拖動時間看每條跑道在同一時刻的進度",
    mount(ctx) {
      const EASES = [["linear", "linear"], ["ease", "ease"], ["ease-in", "ease-in"], ["ease-out", "ease-out"], ["ease-in-out", "ease-in-out"],
        ["steps(5)", "steps(5, end)"], ["回彈", "cubic-bezier(.68,-.6,.32,1.6)"], ["逐影格", null]];
      const Y = (p) => ((1.4 - p) / 1.8) * 100;
      ctx.html(`<div class="pad s3"><div class="panel box rows">${EASES.map(([name, ease], i) => `<div class="row" style="--c:${PAL[i % PAL.length]}">
          <div class="nm"><b>${name}</b><code>${ease ? `easing: "${ease}"` : "1.3s 前 steps(4)，後 ease-out"}</code></div>
          <div class="cv"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="100" y1="${Y(0)}" y2="${Y(0)}"/><line x1="0" x2="100" y1="${Y(1)}" y2="${Y(1)}"/><polyline/></svg><i class="cd"></i></div>
          <div class="rail"><div class="in"><i class="rn"></i></div></div><output>0%</output></div>`).join("")}</div>
        <div class="panel box scrub"></div></div>`);
      const lane = () => ({ 0: { left: "0%" }, 0.3: { left: "0%" }, 2.3: { left: "100%" }, 2.6: { left: "100%" } });
      // Per-keyframe easing applies to the segment that starts at that keyframe.
      const perKey = () => ({ 0: { left: "0%" }, 0.3: { left: "0%", easing: "steps(4, end)" }, 1.3: { left: "50%", easing: "ease-out" }, 2.3: { left: "100%" }, 2.6: { left: "100%" } });
      const scene = new Scene({}, { iterationCount: "infinite" });
      ctx.onCleanup(() => { scene.end(); scene.clear(); });
      const rows = ctx.$$(".row").map((row, i) => {
        const ease = EASES[i][1];
        const item = new SceneItem(ease ? lane() : perKey(), ease ? { easing: ease } : {}).setElement(row.querySelector(".rn"));
        scene.setItem(`e${i}`, item);
        row.querySelector("polyline").setAttribute("points", Array.from({ length: 81 }, (_, k) =>
          `${(k / 80) * 100},${Y(num(item.getNowFrame(0.3 + (k / 80) * 2).get("left")) / 100).toFixed(2)}`).join(" "));
        return { rn: row.querySelector(".rn"), cd: row.querySelector(".cd"), out: row.querySelector("output") };
      });
      const playBtn = playToggle(ctx, scene);
      const paint = scrubber(ctx, ctx.$(".scrub"), scene, 2.6, playBtn);
      scene.on("animate", (e) => {
        const x = Math.min(1, Math.max(0, (e.time - 0.3) / 2)) * 100;
        for (const r of rows) {
          // Read back what Scene.js actually wrote to the runner.
          const v = num(r.rn.style.left) || 0;
          r.out.textContent = `${Math.round(v)}%`;
          r.out.classList.toggle("over", v < -0.5 || v > 100.5);
          r.cd.style.left = `${x}%`;
          r.cd.style.top = `${Y(v / 100)}%`;
        }
        paint(e.time);
      });
      scene.play();
    },
  },

  {
    id: "values", title: "值的種類",
    api: 'transform: { rotate, scale }・filter: { "hue-rotate" }・attribute: { d }・html・item.setTarget(obj)',
    desc: "同一個 Scene 裡四種值一起內插：CSS 函式與複合值（transform、filter、box-shadow 的長度與顏色）、SVG 屬性（path d 逐數字變形、circle r）、離散值（html 文字到下一格才切換）與一般 CSS，最後一格用 setTarget() 把數字寫進純 JS 物件，再自行畫到 canvas。",
    hint: "拖動時間比對四格讀數；文字是離散值，不會內插",
    mount(ctx) {
      ctx.html(`<div class="pad s4"><div class="grid">
          <div class="panel box cell va"><div class="hd"><b>CSS 函式與複合值</b><code>transform・filter・box-shadow</code></div><div class="st"><div class="tile">Aa</div></div><div class="ro"></div></div>
          <div class="panel box cell vb"><div class="hd"><b>SVG 屬性</b><code>attribute: { d, r }・fill</code></div><div class="st"><svg class="blob" viewBox="0 0 120 120" aria-hidden="true"><path/><circle cx="60" cy="60" r="4"/></svg></div><div class="ro"></div></div>
          <div class="panel box cell vc"><div class="hd"><b>離散值與一般 CSS</b><code>html・width・background-color</code></div><div class="st"><div class="lbl"></div><div class="meter"><i></i></div></div><div class="ro"></div></div>
          <div class="panel box cell vd"><div class="hd"><b>純 JS 物件</b><code>item.setTarget(obj)</code></div><div class="st"><canvas></canvas></div><div class="ro"></div></div>
        </div><div class="panel box scrub"></div></div>`);
      const scene = new Scene({}, { iterationCount: "infinite", direction: "alternate" });
      ctx.onCleanup(() => { scene.end(); scene.clear(); });
      scene.setItem("tile", new SceneItem({
        0: { transform: { rotate: "0deg", scale: 0.85 }, filter: { "hue-rotate": "0deg", brightness: 1 }, "border-radius": "14%", "box-shadow": "0px 4px 10px rgba(0,0,0,0.35)" },
        2.4: { transform: { rotate: "180deg", scale: 1.15 }, filter: { "hue-rotate": "160deg", brightness: 1.25 }, "border-radius": "50%", "box-shadow": "0px 18px 34px rgba(247,37,133,0.55)" },
      }).setElement(ctx.$(".tile")));
      scene.setItem("blob", new SceneItem({ 0: { attribute: { d: BLOB_A }, fill: "#7bd389" }, 2.4: { attribute: { d: BLOB_B }, fill: "#9d8cff" } }).setElement(ctx.$(".blob path")));
      scene.setItem("core", new SceneItem({ 0: { attribute: { r: 4 } }, 2.4: { attribute: { r: 14 } } }).setElement(ctx.$(".blob circle")));
      scene.setItem("label", new SceneItem({ 0: { html: "準備" }, 0.8: { html: "播放中" }, 1.6: { html: "即將完成" }, 2.4: { html: "完成" } }).setElement(ctx.$(".lbl")));
      scene.setItem("fill", new SceneItem({ 0: { width: "0%", "background-color": "#ff8c42" }, 2.4: { width: "100%", "background-color": "#7bd389" } }).setElement(ctx.$(".meter i")));
      const target = { x: 0.1, y: 0.8, hue: 190, size: 6 };
      scene.setItem("obj", new SceneItem({
        0: { x: 0.1, y: 0.8, hue: 190, size: 6 }, 1.2: { x: 0.5, y: 0.15, hue: 300, size: 16 }, 2.4: { x: 0.9, y: 0.8, hue: 40, size: 6 },
      }).setTarget(target));

      const cv = ctx.$(".vd canvas"), g = cv.getContext("2d"), trail = [];
      let W = 0, H = 0;
      const fit = () => {
        const dpr = Math.min(2, window.devicePixelRatio || 1);
        W = cv.clientWidth; H = cv.clientHeight;
        cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
      };
      const draw = () => {
        g.clearRect(0, 0, W, H);
        trail.forEach((p, i) => {
          g.globalAlpha = (i + 1) / trail.length * 0.5;
          g.fillStyle = `hsl(${p.hue} 80% 62%)`;
          g.beginPath(); g.arc(p.x * W, p.y * H, Math.max(1, p.size * 0.35), 0, Math.PI * 2); g.fill();
        });
        g.globalAlpha = 1;
        g.fillStyle = `hsl(${target.hue} 80% 62%)`;
        g.beginPath(); g.arc(target.x * W, target.y * H, target.size, 0, Math.PI * 2); g.fill();
      };
      fit();
      ctx.onResize(() => { fit(); draw(); });

      const ro = ctx.$$(".cell > .ro");
      const playBtn = playToggle(ctx, scene);
      const paint = scrubber(ctx, ctx.$(".scrub"), scene, 2.4, playBtn);
      scene.on("animate", (e) => {
        const f = e.frames;
        trail.push({ ...target });
        if (trail.length > 28) trail.shift();
        draw();
        ro[0].textContent = cssText(f.tile);
        ro[1].textContent = `d="${fix(f.blob.get("attribute", "d"))}"　r=${num(f.core.get("attribute", "r")).toFixed(1)}`;
        ro[2].textContent = `html "${f.label.get("html")}"　width ${fix(f.fill.get("width"))}　${fix(f.fill.get("background-color"))}`;
        ro[3].textContent = `obj = { x: ${target.x.toFixed(2)}, y: ${target.y.toFixed(2)}, hue: ${Math.round(target.hue)}, size: ${target.size.toFixed(1)} }`;
        paint(e.time);
      });
      scene.play();
    },
  },

  {
    id: "stagger", title: "錯開與方向",
    api: '".eq i": (i) => ({ 0: {...}, options: { delay: i * gap } })・item.setDelay()・scene.setDirection()',
    desc: "以函式選擇器一次為 24 根長條建立子 SceneItem，每根的 delay 決定波形：線性是依序、中心擴散從中間往外、隨機則打亂順序。錯開間隔與 direction（normal、reverse、alternate、alternate-reverse）可即時調整，下方長條圖就是每根實際的 getDelay()。",
    hint: "切換錯開模式與方向，觀察下方 delay 分布",
    mount(ctx) {
      const N = 24;
      const bars = "<i></i>".repeat(N);
      ctx.html(`<div class="pad s5">
        <div class="panel box eqp"><div class="eq">${bars}</div></div>
        <div class="panel box dlp"><div class="lh"><span>每根的 item.getDelay()</span><span class="mx"></span></div><div class="dl">${bars}</div></div>
        <div class="ro info"></div>
      </div>`);
      let gap = 0.04, pattern = 0, dir = "normal", units = [];
      const scene = new Scene({
        ".eq i": (i) => ({
          0: { transform: { scaleY: 0.12 }, "background-color": "#4cc9f0" },
          0.25: { transform: { scaleY: 1 }, "background-color": "#f7df1e" },
          0.6: { transform: { scaleY: 0.45 }, "background-color": "#f72585" },
          1: { transform: { scaleY: 0.12 }, "background-color": "#4cc9f0" },
          options: { delay: i * gap },
        }),
      }, { selector: scope("stagger"), iterationCount: "infinite" });
      ctx.onCleanup(() => { scene.end(); scene.clear(); });
      const sub = scene.getItem(".eq i");
      const dlBars = ctx.$$(".dl i"), mx = ctx.$(".mx"), info = ctx.$(".info");
      const shuffle = () => {
        const a = Array.from({ length: N }, (_, i) => i);
        for (let i = N - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
        return a;
      };
      const apply = (reshuffle) => {
        if (reshuffle || !units.length) units = [Array.from({ length: N }, (_, i) => i), Array.from({ length: N }, (_, i) => Math.abs(i - 11.5) - 0.5), shuffle()][pattern];
        sub.forEach((item, id, idx) => item.setDelay(units[idx] * gap));
        const delays = [];
        sub.forEach((item) => delays.push(item.getDelay()));
        const max = Math.max(...delays);
        dlBars.forEach((b, i) => { b.style.height = `${max ? (delays[i] / max) * 100 : 0}%`; });
        mx.textContent = `最大 ${max.toFixed(2)} s`;
      };
      apply(true);
      ctx.group(["線性", "中心擴散", "隨機"], 0, (i) => { pattern = i; apply(true); });
      ctx.slider("錯開", { min: 0, max: 0.15, step: 0.01, value: gap, format: (v) => `${v.toFixed(2)} s` }, (v) => { gap = v; apply(false); });
      ctx.select("方向", ["normal", "reverse", "alternate", "alternate-reverse"], dir, (v) => { dir = v; scene.setDirection(v); });
      scene.on("animate", (e) => {
        const d = scene.getDuration();
        info.innerHTML = `scene.getDuration() <b>${d.toFixed(2)} s</b>・direction <b>${dir}</b>・本圈 <b>${Math.round((e.time / d) * 100)}%</b>`;
      });
      scene.play();
    },
  },

  {
    id: "compose", title: "巢狀與串接",
    api: "main.append(intro)・main.append(sub)・main.setItem(name, item)・new Scene({}, { iterationCount: n })",
    desc: "Scene 可以裝 SceneItem，也可以裝另一個 Scene。這裡的 sub 是三顆點的子場景，重複次數可調；append() 會把每段的 delay 設為目前總長，讓 intro、sub、outro 依序串接，setItem() 則讓三段同時從 0 秒開始。下方甘特圖直接讀 getDelay() 與 getActiveDuration()。",
    hint: "切換串接與同時，再調整子場景次數",
    mount(ctx) {
      ctx.html(`<div class="pad s6">
        <div class="panel box view"><div class="mid">
          <div class="card"><div class="ic">S</div><div><b>同步資料中</b><div class="dots"><i></i><i></i><i></i></div></div></div>
          <div class="done">完成，共 3 筆</div>
        </div></div>
        <div class="panel box gantt"></div>
        <div class="ro code"></div>
      </div>`);
      const card = ctx.$(".card"), done = ctx.$(".done"), dots = ctx.$$(".dots i"), gantt = ctx.$(".gantt"), code = ctx.$(".code");
      let main = null, mode = 0, reps = 2, playing = true, heads = [];
      const ROWS = [["intro", "SceneItem", "var(--c2)"], ["sub", "Scene", "var(--c1)"], ["outro", "SceneItem", "var(--c4)"]];
      const teardown = () => { if (main) { main.end(); main.clear(); main = null; } };
      ctx.onCleanup(teardown);
      const build = () => {
        teardown();
        [card, done, ...dots].forEach((el) => el.removeAttribute("style"));
        const intro = new SceneItem({ 0: { opacity: 0, transform: { translate: "-40px,0px" } }, 0.8: { opacity: 1, transform: { translate: "0px,0px" } } }).setElement(card);
        const sub = new Scene({}, { iterationCount: reps });
        dots.forEach((d, i) => sub.setItem(`d${i}`, new SceneItem({
          0: { transform: { translate: "0px,0px" }, "background-color": "#4cc9f0" },
          0.2: { transform: { translate: "0px,-12px" }, "background-color": "#f7df1e" },
          0.4: { transform: { translate: "0px,0px" }, "background-color": "#4cc9f0" },
        }, { delay: i * 0.12 }).setElement(d)));
        const outro = new SceneItem({ 0: { opacity: 0, transform: { translate: "0px,10px" } }, 0.5: { opacity: 1, transform: { translate: "0px,0px" } }, 1.4: { opacity: 1 }, 1.6: { opacity: 0 } }).setElement(done);
        main = new Scene({}, { iterationCount: "infinite" });
        const parts = { intro, sub, outro };
        // append() delays each part by the duration so far; setItem() keeps every part at delay 0.
        for (const [name, part] of Object.entries(parts)) mode === 0 ? main.append(part.setId(name)) : main.setItem(name, part);
        const total = main.getDuration();
        const half = +(total / 2).toFixed(2);
        gantt.innerHTML = `<div class="gl"></div><div class="rul"><span>0</span><span style="left:50%">${half}s</span><span style="left:100%">${total.toFixed(2)}s</span></div>` +
          `<div class="gl"><b>main</b><small>Scene ∞</small></div><div class="ln"><div class="gbar" style="left:0;width:100%;--c:var(--muted);opacity:.45"></div><i class="ph"></i></div>` +
          ROWS.map(([name, kind, c]) => {
            const p = parts[name], n = name === "sub" ? reps : 1;
            const left = (p.getDelay() / total) * 100, width = (p.getActiveDuration() / total) * 100;
            return `<div class="gl"><b>${name}</b><small>${kind}${n > 1 ? ` ×${n}` : ""}</small></div><div class="ln"><div class="gbar" style="left:${left}%;width:${width}%;--c:${c}">${'<i class="seg"></i>'.repeat(n)}</div><i class="ph"></i></div>`;
          }).join("");
        heads = [...gantt.querySelectorAll(".ph")];
        const call = mode === 0 ? "main.append(intro).append(sub).append(outro)" : 'main.setItem("intro", intro)…';
        code.innerHTML = `${call}・getDuration() <b>${total.toFixed(2)} s</b>・getOrders() <b>[${main.getOrders().join(", ")}]</b>・delay <b>${Object.values(parts).map((p) => +p.getDelay().toFixed(2)).join(" / ")}</b>`;
        main.on("animate", (e) => { const x = `${(e.time / total) * 100}%`; for (const hd of heads) hd.style.left = x; });
        main.setTime(0);
        if (playing) main.play();
      };
      ctx.group(["串接 append", "同時 setItem"], 0, (i) => { if (i === mode) return; mode = i; build(); });
      ctx.slider("子場景次數", { min: 1, max: 5, step: 1, value: reps, format: (v) => `×${v}` }, (v) => { reps = v; build(); });
      ctx.toggle("播放", true, (v) => { playing = v; v ? main.play() : main.pause(); });
      build();
    },
  },

  {
    id: "css", title: "CSS 輸出",
    api: "scene.toCSS()・scene.exportCSS()・scene.playCSS()・scene.end()",
    desc: "同一份 Scene 可以每格用 JS 寫行內樣式，也能用 playCSS() 匯出成 @keyframes 交給瀏覽器。右側是 toCSS() 的實際輸出：每個項目的 delay 被折算進百分比，0% 留空沿用行內樣式。按「阻塞主執行緒」比較兩種模式：JS 模式全部停住；CSS 模式下，上排只動 transform 與 opacity，在支援合成器動畫的瀏覽器（如 Chrome）通常仍會繼續，下排的 left 與背景色則要等主執行緒。",
    hint: "切到 CSS 模式後按「阻塞主執行緒 1.5 秒」比較上下兩排",
    mount(ctx) {
      const track = (k, i) => k === "car" ? `<div class="trk"><div class="car" data-i="${i}"></div></div>` : `<div class="trk"><div class="in"><div class="ball" data-i="${i}"></div></div></div>`;
      ctx.html(`<div class="pad s7">
        <div class="split">
          <div class="panel box runs">
            <div class="grp">上排：<b>transform＋opacity</b>（可由合成器執行）</div>${[0, 1, 2].map((i) => track("car", i)).join("")}
            <div class="gap"></div>
            <div class="grp">下排：<b>left＋background-color</b>（每格需主執行緒）</div>${[0, 1, 2].map((i) => track("ball", i)).join("")}
          </div>
          <pre class="panel box peek"></pre>
        </div>
        <div class="panel box stat"></div>
      </div>`);
      const runs = ctx.$(".runs"), peek = ctx.$(".peek"), stat = ctx.$(".stat");
      const scene = new Scene({}, { iterationCount: "infinite", direction: "alternate" });
      ctx.onCleanup(() => { scene.end(); scene.clear(); });
      ctx.$$(".car").forEach((el, i) => scene.setItem(`car${i}`, new SceneItem({
        0: { transform: { translate: "0%,0px" }, opacity: 0.45 }, 1.6: { transform: { translate: "100%,0px" }, opacity: 1 },
      }, { delay: i * 0.25 }).setElement(el)));
      ctx.$$(".ball").forEach((el, i) => scene.setItem(`ball${i}`, new SceneItem({
        0: { left: "0%", "background-color": "#4cc9f0" }, 1.6: { left: "100%", "background-color": "#f72585" },
      }, { delay: i * 0.25 }).setElement(el)));

      // Summarise the real toCSS() string: the animation rule plus two @keyframes blocks.
      const css = scene.toCSS().replace(/\s+/g, " ");
      const blocks = [...css.matchAll(/@keyframes (\S+?)\{(.*?\})\}/g)];
      const rule = (css.match(/\.startAnimation \{([^}]*)\}/) || [, ""])[1].replace(/animation-/g, "").split(";").filter((s) => /duration|direction|iteration|timing/.test(s)).join("; ");
      const dur = scene.getDuration();
      const show = (name) => {
        const m = blocks.find((b) => b[1].endsWith(`_${name}`));
        if (!m) return [];
        const delay = scene.getItem(name).getDelay();
        const stops = [...m[2].matchAll(/([\d.]+)%\{\s*([^}]*?);?\s*\}/g)].map(([, at, decl]) => {
          const p = +Number(at).toFixed(1);
          const note = !decl ? "  <em>← 空白，沿用行內樣式</em>" : delay && Math.abs((p / 100) * dur - delay) < 0.01 ? `  <em>← delay ${delay}s 折成 ${p}%</em>` : "";
          return `  ${p}%{${decl.replace(/\s/g, "")}}${note}`;
        });
        return [`@keyframes <b>…${name}</b>{`, ...stops, "}"];
      };
      peek.innerHTML = [`<b>scene.toCSS()</b>：${css.length.toLocaleString()} 字元，@keyframes ${blocks.length} 組`,
        `.startAnimation{${rule}}`, "", ...show("car0"), "", ...show("ball2")].join("\n");

      let mode = 0, events = 0, rate = 0, maxGap = 0, last = 0, blockInfo = "尚未測試";
      scene.on("animate", () => { events++; });
      const paintStat = () => {
        const styles = document.querySelectorAll("style[data-styled-id]").length;
        const anims = runs.getAnimations({ subtree: true }).length;
        stat.innerHTML = `模式 <b>${mode ? "CSS（playCSS）" : "JS（每格 setTime）"}</b>・animate 事件 <b>${rate}</b>／秒・&lt;style data-styled-id&gt; <b>${styles}</b> 個・CSS 動畫 <b>${anims}</b> 個<br>${blockInfo}`;
      };
      ctx.interval(() => { rate = events * 2; events = 0; paintStat(); }, 500);
      ctx.raf((t) => { if (last) maxGap = Math.max(maxGap, t - last); last = t; });
      ctx.group(["JS 模式", "CSS 模式"], 0, (i) => {
        if (i === mode) return;
        mode = i;
        if (mode) {
          // playCSS() is a no-op while running, and the exported 0% stop is empty, so pause and rewind first.
          scene.pause();
          scene.setTime(0);
          scene.playCSS();
        } else {
          // Continue in JS from where the browser was; end() also removes Scene's animationcancel handler.
          const a = runs.getAnimations({ subtree: true })[0];
          const t = a ? a.currentTime / 1000 : 0;
          scene.end();
          scene.setTime(t);
          scene.play();
        }
        paintStat();
      });
      ctx.button("阻塞主執行緒 1.5 秒", () => {
        const m = mode;
        maxGap = 0;
        const end = performance.now() + 1500;
        while (performance.now() < end) { /* busy wait on purpose */ }
        ctx.timeout(() => { blockInfo = `上次阻塞（${m ? "CSS" : "JS"} 模式）：rAF 最大間隔 <b>${Math.round(maxGap)} ms</b>`; paintStat(); }, 300);
      });
      scene.play();
      paintStat();
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: 'new Scene({ ".sgrid i": (i) => ({ ... }) })・scene.setTime(t)・scene.playCSS()',
    desc: "用函式選擇器一次建立 N 個 SceneItem，同時縮放、旋轉、淡入淡出，逐級加量直到低於 30 FPS。JS 模式每格呼叫 scene.setTime() 重算全部影格並寫入行內樣式；CSS 模式先用 playCSS() 匯出 @keyframes，再交給瀏覽器播放。",
    hint: "按「自動加壓」逐級加量；下方切換 JS 與 CSS 模式",
    mount(ctx) {
      ctx.html(`<div class="stress-x"><div class="sgrid"></div></div>`);
      const box = ctx.$(".stress-x"), grid = ctx.$(".sgrid");
      const MODES = ["JS setTime", "CSS playCSS"];
      let scene = null, tiles = [], mode = 0, n = 0, clock = 0, setMs = 0, buildMs = 0, exportMs = 0, cssKB = 0;
      const layout = () => {
        if (!tiles.length) return;
        const W = box.clientWidth - 16, H = box.clientHeight - 16;
        const cols = Math.max(1, Math.round(Math.sqrt((tiles.length * W) / H)));
        const rows = Math.ceil(tiles.length / cols);
        const cell = Math.min(W / cols, H / rows);
        const gap = cell >= 10 ? 2 : 1;
        grid.style.setProperty("--cols", cols);
        grid.style.setProperty("--gap", `${gap}px`);
        grid.style.setProperty("--sz", `${Math.max(1, Math.floor(cell) - gap)}px`);
      };
      const teardown = () => { if (scene) { scene.end(); scene.clear(); scene = null; } };
      ctx.onCleanup(teardown);
      const build = () => {
        teardown();
        tiles = Array.from({ length: n }, (_, i) => {
          const t = document.createElement("i");
          t.style.background = `hsl(${(20 + (i / n) * 300).toFixed(1)} 72% 60%)`;
          return t;
        });
        grid.replaceChildren(...tiles);
        layout();
        const t0 = performance.now();
        scene = new Scene({
          ".sgrid i": (i) => ({
            0: { transform: { scale: 0.35, rotate: "0deg" }, opacity: 0.35 },
            0.7: { transform: { scale: 1, rotate: "90deg" }, opacity: 1 },
            1.4: { transform: { scale: 0.35, rotate: "180deg" }, opacity: 0.35 },
            options: { delay: (i % 24) * 0.04 },
          }),
        }, { selector: scope("stress"), iterationCount: "infinite" });
        buildMs = performance.now() - t0;
        clock = 0; setMs = 0; exportMs = 0; cssKB = 0;
        if (mode === 1) {
          scene.setTime(0);
          const t1 = performance.now();
          scene.playCSS();
          exportMs = performance.now() - t1;
          let chars = 0;
          document.querySelectorAll("style[data-styled-id]").forEach((s) => { chars += s.textContent.length; });
          cssKB = chars / 1024;
        }
      };
      ctx.raf((t, dt) => {
        if (!scene || mode !== 0) return;
        clock += dt / 1000;
        const t0 = performance.now();
        scene.setTime(clock);
        const ms = performance.now() - t0;
        setMs = setMs ? setMs * 0.9 + ms * 0.1 : ms;
      });
      ctx.onResize(layout);
      ctx.group(MODES, 0, (i) => { if (i === mode) return; mode = i; build(); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "同時動畫的 SceneItem", unit: "個", steps: [100, 200, 400, 800, 1600, 3200, 6400],
        initial: 2, minFps: 30, warmup: 1000, sample: 2000,
        apply(v) { n = v; build(); },
        metrics: () => ({
          "建構 Scene": `${buildMs.toFixed(0)} ms`,
          "setTime／格": mode === 0 ? `${setMs.toFixed(1)} ms` : "－",
          "每項 (µs)": mode === 0 && n ? ((setMs * 1000) / n).toFixed(1) : "－",
          "匯出＋playCSS": mode === 1 ? `${exportMs.toFixed(0)} ms` : "－",
          "CSS 大小": mode === 1 ? `${cssKB.toFixed(0)} KB` : "－",
          "執行中 CSS 動畫": grid.getAnimations({ subtree: true }).length,
        }),
        note: "JS 模式的成本每格都要付：N 個項目各自內插 transform 與 opacity，再寫 N 次行內樣式，FPS 隨 N 線性下降。CSS 模式只在開始時付一次匯出成本（每個項目約 0.75 KB 的 @keyframes 與規則），之後由瀏覽器播放，主執行緒負擔主要剩樣式計算與合成圖層。",
      });
    },
  },
] });
</script>
</body>
</html>
