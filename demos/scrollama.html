<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrollama 示範：捲動式資料故事</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"圖表為示意資料"}</script>
<style>
  body { height: auto; min-height: 100%; }
  .hero { position: relative; height: 100vh; min-height: 420px; display: grid; place-items: center; text-align: center; overflow: hidden;
    background: radial-gradient(60% 60% at 50% 100%, rgba(76,201,240,.16), transparent 70%), var(--bg); }
  .hero .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--accent); }
  .hero h1 { margin: 10px 0 8px; font-size: clamp(32px, 7.5vw, 68px); line-height: 1.12; font-weight: 900; }
  .hero p { margin: 0 auto; max-width: 28em; color: var(--muted); padding: 0 20px; }
  .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; display: flex; align-items: flex-end; gap: 1.2%; padding: 0 4%; opacity: .35; }
  .skyline i { flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(var(--c2), transparent); animation: grow 2.6s ease-in-out infinite alternate; transform-origin: bottom; }
  @keyframes grow { from { transform: scaleY(.55); } to { transform: scaleY(1); } }
  .hero-in { position: relative; z-index: 1; }
  .down { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); font-size: 13px; z-index: 1; }
  .down b { display: block; width: 16px; height: 16px; margin: 6px auto 0; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(45deg); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 6px; } }

  /* scrollytelling layout: sticky graphic + scrolling steps */
  .story { position: relative; display: flex; gap: 4%; padding: 0 4%; }
  .graphic { position: sticky; top: 0; height: 100vh; flex: 1 1 58%; display: grid; place-items: center; order: 2; }
  .chart { width: 100%; max-width: 560px; }
  .chart h3 { margin: 0 0 2px; font-size: 18px; }
  .chart .sub { color: var(--muted); font-size: 12px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .mbar { transition: fill .5s, opacity .5s, y .7s cubic-bezier(.2,.8,.2,1), height .7s cubic-bezier(.2,.8,.2,1); }
  .lbl { font: 600 11px var(--mono); fill: var(--muted); }
  .val { font: 700 13px var(--mono); fill: var(--fg); opacity: 0; transition: opacity .4s; }
  .trend { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1.2s ease; }
  .note { font: 700 14px var(--font); fill: var(--accent); opacity: 0; transition: opacity .4s; }
  .steps { flex: 1 1 38%; order: 1; padding: 30vh 0 40vh; position: relative; z-index: 2; }
  .step { min-height: 70vh; display: flex; align-items: center; }
  .step .card { padding: 18px 20px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
    opacity: .35; transform: scale(.96); transition: opacity .4s, transform .4s, border-color .4s; }
  .step.is-active .card { opacity: 1; transform: none; border-color: var(--accent); }
  .step .no { font: 700 12px var(--mono); color: var(--accent); }
  .step h2 { margin: 4px 0 6px; font-size: clamp(18px, 3vw, 24px); }
  .step p { margin: 0; color: var(--muted); }
  .step .meter { height: 4px; border-radius: 4px; background: var(--line); margin-top: 12px; overflow: hidden; }
  .step .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  .dots { position: fixed; right: 12px; top: 50%; transform: translateY(-50%); display: grid; gap: 8px; z-index: 40; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
  .dots i.on { background: var(--accent); transform: scale(1.4); }
  .outro { padding: 60px 20px 140px; text-align: center; }
  @media (max-width: 700px) {
    .story { display: block; padding: 0 16px; }
    /* split screen: chart on top, steps scroll underneath it in the lower half */
    .graphic { height: 50vh; top: 0; padding-top: 10px; z-index: 3; background: var(--bg); }
    .steps { padding: 10vh 0 30vh; }
    .step { min-height: 50vh; }
  }
</style>
</head>
<body class="scroll">
<section class="hero">
  <div class="skyline" id="skyline"></div>
  <div class="hero-in">
    <div class="kicker">SCROLLAMA · SCROLLYTELLING</div>
    <h1>用捲動<br>說一個資料故事</h1>
    <p>文字一段段捲過，圖表固定不動，隨著目前段落換重點。</p>
  </div>
  <div class="down">往下捲<b></b></div>
</section>

<section class="story">
  <div class="graphic">
    <div class="chart">
      <h3 id="ctitle">線上課程每月報名人數</h3>
      <div class="sub">示意資料，單位：人</div>
      <svg id="svg" viewBox="0 0 560 300" role="img" aria-label="每月報名人數長條圖"></svg>
    </div>
  </div>
  <div class="steps" id="steps">
    <div class="step" data-step="0"><div class="card"><div class="no">STEP 1</div><h2>一年的全貌</h2><p>十二個月的報名人數，先看整體高低起伏。</p><div class="meter"><i></i></div></div></div>
    <div class="step" data-step="1"><div class="card"><div class="no">STEP 2</div><h2>十月衝上高峰</h2><p>開學季加上講座曝光，單月報名突破四百人。</p><div class="meter"><i></i></div></div></div>
    <div class="step" data-step="2"><div class="card"><div class="no">STEP 3</div><h2>上半年 vs 下半年</h2><p>下半年的總人數幾乎是上半年的兩倍。</p><div class="meter"><i></i></div></div></div>
    <div class="step" data-step="3"><div class="card"><div class="no">STEP 4</div><h2>趨勢一路向上</h2><p>畫出移動平均線，短期波動底下是穩定成長。</p><div class="meter"><i></i></div></div></div>
  </div>
</section>

<section class="outro">
  <h2>故事說完了</h2>
  <p class="muted">往回捲，圖表會跟著倒帶到每一步。</p>
</section>

<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
<div class="hint">往下捲，觀察圖表隨段落變化</div>

<script src="https://cdn.jsdelivr.net/npm/scrollama@3.2.0/build/scrollama.min.js"></script>
<script>
// Hero decoration
const sky = document.getElementById("skyline");
for (let i = 0; i < 24; i++) {
  const b = document.createElement("i");
  b.style.height = 30 + Math.abs(Math.sin(i * 1.7)) * 70 + "%";
  b.style.animationDelay = (i % 6) * -0.4 + "s";
  sky.append(b);
}

// Illustrative data: monthly sign-ups
const MONTHS = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
const DATA = [120, 95, 150, 140, 170, 160, 210, 230, 300, 420, 330, 360];
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const W = 560, H = 300, PAD = 30, BASE = H - 28, MAX = 450;
const bw = (W - PAD * 2) / DATA.length;
const yOf = (v) => BASE - (v / MAX) * (BASE - 20);
const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); return e; };

mk("line", { x1: PAD, x2: W - PAD, y1: BASE, y2: BASE, stroke: "rgba(255,255,255,.2)" });
const bars = DATA.map((v, i) => {
  const x = PAD + i * bw + 4;
  const r = mk("rect", { class: "mbar", x, width: bw - 8, y: yOf(v), height: BASE - yOf(v), rx: 4, fill: "#4cc9f0" });
  mk("text", { class: "lbl", x: x + (bw - 8) / 2, y: BASE + 16, "text-anchor": "middle" }).textContent = MONTHS[i];
  const t = mk("text", { class: "val", x: x + (bw - 8) / 2, y: yOf(v) - 6, "text-anchor": "middle" });
  t.textContent = v;
  return { r, t };
});
// 3-month moving average trend line
const avg = DATA.map((_, i) => { const s = DATA.slice(Math.max(0, i - 2), i + 1); return s.reduce((a, b) => a + b, 0) / s.length; });
const trend = mk("path", { class: "trend", d: avg.map((v, i) => (i ? "L" : "M") + (PAD + i * bw + bw / 2) + " " + yOf(v)).join(" ") });
const tlen = trend.getTotalLength();
trend.style.strokeDasharray = tlen;
trend.style.strokeDashoffset = tlen;
const noteA = mk("text", { class: "note", x: PAD + 3 * bw, y: 70, "text-anchor": "middle" });
const noteB = mk("text", { class: "note", x: PAD + 9 * bw, y: 40, "text-anchor": "middle" });
const sum = (a, b) => DATA.slice(a, b).reduce((x, y) => x + y, 0);
noteA.textContent = "上半年 " + sum(0, 6) + " 人";
noteB.textContent = "下半年 " + sum(6, 12) + " 人";

const PEAK = DATA.indexOf(Math.max(...DATA));
function render(step) {
  bars.forEach(({ r, t }, i) => {
    let fill = "#4cc9f0", op = 1;
    if (step === 1) { fill = i === PEAK ? "#f7df1e" : "#4cc9f0"; op = i === PEAK ? 1 : 0.3; }
    if (step === 2) fill = i < 6 ? "#9d8cff" : "#f72585";
    if (step === 3) op = 0.35;
    r.setAttribute("fill", fill);
    r.style.opacity = op;
    t.style.opacity = (step === 1 && i === PEAK) || step === 0 ? 1 : 0;
  });
  noteA.style.opacity = noteB.style.opacity = step === 2 ? 1 : 0;
  trend.style.strokeDashoffset = step === 3 ? 0 : tlen;
  document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i === step));
}
render(0);

const scroller = scrollama();
scroller
  .setup({ step: ".step", offset: matchMedia("(max-width: 700px)").matches ? 0.75 : 0.6, progress: true })
  .onStepEnter(({ element, index }) => {
    document.querySelectorAll(".step").forEach((s) => s.classList.toggle("is-active", s === element));
    render(index);
  })
  .onStepProgress(({ element, progress }) => {
    element.querySelector(".meter i").style.width = (progress * 100).toFixed(1) + "%";
  });
window.addEventListener("resize", () => scroller.resize());
</script>
</body>
</html>
