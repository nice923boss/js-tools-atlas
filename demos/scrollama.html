<style>
  .frame-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .frame-wrap iframe, .stress-frame iframe { display: block; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .stress-frame { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; }
  @media (max-width: 760px) { .stress-frame { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); } }
</style>

<body>
<!-- Scrollama measures window.innerHeight and listens on document, so each scene runs it inside its own iframe (see scrollFrame). -->
<script src="_shared/showcase.js"></script>
<script>
// Scrollama showcase: seven scenes from a sticky data story to a 16k-step observer stress ramp.
const SCROLLAMA = "https://cdn.jsdelivr.net/npm/scrollama@3.2.0/build/scrollama.min.js";
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim();
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim();

const FRAME_CSS = `
:root { --bg:#0e1013; --bg-2:#171a1f; --fg:#ecebe6; --muted:#9b998f; --line:rgba(255,255,255,.12);
  --accent:#f7df1e; --c1:#f7df1e; --c2:#4cc9f0; --c3:#f72585; --c4:#7bd389; --c5:#ff8c42; --c6:#9d8cff; color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.6 ${FONT}; -webkit-font-smoothing: antialiased; }
body { overflow-x: hidden; }
h1, h2, h3, p { margin: 0; }
code, .mono { font: 500 12px/1.4 ${MONO}; }
.muted { color: var(--muted); }
.kicker { font: 600 11px/1 ${MONO}; letter-spacing: .14em; color: var(--accent); }
.card { padding: 14px 16px; border-radius: 12px; background: rgba(23,26,31,.94); border: 1px solid var(--line); }
.hline { position: fixed; left: 0; right: 0; height: 0; border-top: 1px dashed var(--lc, var(--accent)); z-index: 30; pointer-events: none; }
.hline span { position: absolute; right: 8px; transform: translateY(-50%); padding: 1px 7px; border-radius: 6px; background: var(--bg-2);
  border: 1px solid var(--lc, var(--accent)); color: var(--lc, var(--accent)); font: 600 11px/1.5 ${MONO}; white-space: nowrap; }
.log { position: fixed; z-index: 20; padding: 8px 12px; border-radius: 10px; background: #121418; border: 1px solid var(--line); overflow: hidden; }
.log h3 { font-size: 13px; margin-bottom: 4px; }
.log div { font: 500 11.5px/1.6 ${MONO}; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
`;

// IntersectionObserver inside an iframe defaults to the top-level viewport as its root, while
// Scrollama sizes rootMargin from this frame's innerHeight. 3.2.0 forwards `root` to its step
// observer only (not the progress one), so default every observer here to the frame's own viewport.
const IO_ROOT_SHIM = `(() => { const IO = window.IntersectionObserver;
  window.IntersectionObserver = class extends IO { constructor(cb, o = {}) { super(cb, Object.assign({}, o, { root: o.root || document })); } }; })();`;

// One scene = one same-origin srcdoc iframe with its own window scroll; removing it on
// unmount also drops the document scroll listener Scrollama never removes.
function scrollFrame(ctx, host, { body, css = "" }) {
  const f = document.createElement("iframe");
  f.title = "Scrollama 捲動區";
  f.srcdoc = `<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><style>${FRAME_CSS}${css}</style></head>
<body>${body}<script>${IO_ROOT_SHIM}<\/script><script src="${SCROLLAMA}"><\/script></body></html>`;
  host.append(f);
  ctx.onCleanup(() => f.remove());
  return new Promise((resolve, reject) => {
    f.addEventListener("load", () => {
      const win = f.contentWindow;
      if (!win || !win.scrollama) return reject(new Error("Scrollama 無法從 CDN 載入"));
      resolve({ win, doc: win.document });
    }, { once: true });
  });
}

// Slow ping-pong auto-scroll so every scene plays without input; any user input stops it.
function autoScroll(ctx, win, { speed = 120, rest = [900, 900] } = {}) {
  let on = true, dir = 1, wait = 500, pos = win.scrollY, last = pos;
  const btn = ctx.toggle("自動捲動", true, (v) => { on = v; pos = last = win.scrollY; });
  const off = () => { if (on) { on = false; btn.setAttribute("aria-pressed", "false"); } };
  for (const t of ["wheel", "touchstart", "keydown", "mousedown"]) win.addEventListener(t, off, { passive: true });
  const api = {
    speed,
    sync() { pos = last = win.scrollY; },
    restart() { pos = last = 0; dir = 1; wait = rest[0]; win.scrollTo(0, 0); on = true; btn.setAttribute("aria-pressed", "true"); },
  };
  ctx.raf((t, dt) => {
    if (!on) return;
    if (Math.abs(win.scrollY - last) > 3) return off();
    if (wait > 0) { wait -= dt; return; }
    const hi = Math.max(0, win.document.documentElement.scrollHeight - win.innerHeight);
    pos += (dir * api.speed * dt) / 1000;
    if (pos >= hi) { pos = hi; dir = -1; wait = rest[1]; } else if (pos <= 0) { pos = 0; dir = 1; wait = rest[0]; }
    win.scrollTo(0, pos);
    last = win.scrollY;
  });
  return api;
}

// Scrollama 3.2.0: when its ResizeObserver sees a step change height it rebuilds the step
// observer but drops the progress one, and resize() reuses cached heights. The frame resizes
// whenever the control bar wraps, so call resize() a beat later, after the heights are re-read.
function refit(win, list) {
  let t = 0;
  win.addEventListener("resize", () => {
    win.clearTimeout(t);
    t = win.setTimeout(() => list().forEach((s) => s.resize()), 200);
  });
}

// The control bar is measured by a ResizeObserver, so the frame changes height a frame or two after
// the controls are added. Set Scrollama up after that, or resize() would replay onStepEnter.
const settle = (ctx) => ctx.sleep(150);

const frameHost = (ctx) => (ctx.html(`<div class="frame-wrap"></div>`), ctx.$(".frame-wrap"));
const arrow = (d) => (d === "down" ? "↓" : d === "up" ? "↑" : "・");
const NS = "http://www.w3.org/2000/svg";

// ---------- scene 1 chart (ported from the original demo) ----------
const MONTHS = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
const SIGNUPS = [120, 95, 150, 140, 170, 160, 210, 230, 300, 420, 330, 360];
function buildChart(doc, svg) {
  const W = 560, H = 300, PAD = 30, BASE = H - 28, MAX = 450;
  const bw = (W - PAD * 2) / SIGNUPS.length;
  const yOf = (v) => BASE - (v / MAX) * (BASE - 20);
  const mk = (tag, attrs, text) => {
    const e = doc.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text != null) e.textContent = text;
    svg.append(e);
    return e;
  };
  mk("line", { x1: PAD, x2: W - PAD, y1: BASE, y2: BASE, stroke: "rgba(255,255,255,.2)" });
  const bars = SIGNUPS.map((v, i) => {
    const x = PAD + i * bw + 4, cx = x + (bw - 8) / 2;
    const r = mk("rect", { class: "mbar", x, width: bw - 8, y: yOf(v), height: BASE - yOf(v), rx: 4, fill: "#4cc9f0" });
    mk("text", { class: "lbl", x: cx, y: BASE + 16, "text-anchor": "middle" }, MONTHS[i]);
    return { r, t: mk("text", { class: "val", x: cx, y: yOf(v) - 6, "text-anchor": "middle" }, v) };
  });
  // 3-month moving average, drawn by step progress in step 4
  const avg = SIGNUPS.map((_, i) => { const s = SIGNUPS.slice(Math.max(0, i - 2), i + 1); return s.reduce((a, b) => a + b, 0) / s.length; });
  const trend = mk("path", { class: "trend", d: avg.map((v, i) => `${i ? "L" : "M"}${PAD + i * bw + bw / 2} ${yOf(v)}`).join(" ") });
  const tlen = trend.getTotalLength();
  trend.style.strokeDasharray = tlen;
  trend.style.strokeDashoffset = tlen;
  const sum = (a, b) => SIGNUPS.slice(a, b).reduce((x, y) => x + y, 0);
  const noteA = mk("text", { class: "note", x: PAD + 3 * bw, y: 70, "text-anchor": "middle" }, `上半年 ${sum(0, 6)} 人`);
  const noteB = mk("text", { class: "note", x: PAD + 9 * bw, y: 40, "text-anchor": "middle" }, `下半年 ${sum(6, 12)} 人`);
  const PEAK = SIGNUPS.indexOf(Math.max(...SIGNUPS));
  return {
    render(step) {
      bars.forEach(({ r, t }, i) => {
        let fill = "#4cc9f0", op = 1;
        if (step === 1) { fill = i === PEAK ? "#f7df1e" : "#4cc9f0"; op = i === PEAK ? 1 : 0.3; }
        if (step === 2) fill = i < 6 ? "#9d8cff" : "#f72585";
        if (step === 3) op = 0.35;
        r.setAttribute("fill", fill);
        r.style.opacity = op;
        t.style.opacity = (step === 1 && i === PEAK) || step === 0 ? 1 : 0;
      });
      noteA.style.opacity = noteB.style.opacity = step === 2 ? 1 : 0;
      if (step !== 3) trend.style.strokeDashoffset = tlen;
    },
    draw(p) { trend.style.strokeDashoffset = tlen * (1 - p); },
  };
}

// ---------- scene 5 data: approximate population of the six special municipalities ----------
const CITIES = [["新北", 404], ["台中", 286], ["高雄", 272], ["台北", 248], ["桃園", 234], ["台南", 184]];
const CITY_STEPS = [
  { t: "六都人口一覽", p: "六個直轄市，長條跟著這一段的捲動進度長出來。", hi: [] },
  { t: "新北最多", p: "約 404 萬人，比第二名的台中多出一百多萬。", hi: ["新北"] },
  { t: "台中第二", p: "台中在 2017 年人口超越高雄，成為第二大城。", hi: ["台中", "高雄"] },
  { t: "北北桃生活圈", p: "新北、台北、桃園三市合計。", hi: ["新北", "台北", "桃園"] },
  { t: "南部雙城", p: "高雄、台南兩市合計。", hi: ["高雄", "台南"] },
  { t: "六都合計", p: "約佔全台 2,340 萬人口的七成。", hi: CITIES.map((c) => c[0]) },
];

Showcase.run({ scenes: [
  {
    id: "story", title: "資料故事",
    api: "scrollama().setup({ step, offset: 0.6, progress: true }).onStepEnter(…)",
    desc: "Scrollama 的招牌用法：圖表用 position: sticky 固定，文字段落捲過觸發線就換重點。第 4 段的移動平均線直接跟著 onStepProgress 的進度畫出來，往回捲會倒帶。",
    hint: "在框內捲動或交給自動捲動；往回捲看圖表倒帶",
    async mount(ctx) {
      const host = frameHost(ctx);
      const steps = [
        ["一年的全貌", "十二個月的報名人數，先看整體高低起伏。"],
        ["十月衝上高峰", "開學季加上講座曝光，單月報名突破四百人。"],
        ["上半年 vs 下半年", "下半年的總人數幾乎是上半年的兩倍。"],
        ["趨勢一路向上", "移動平均線跟著這一段的捲動進度畫出來，短期波動底下是穩定成長。"],
      ];
      const body = `
        <section class="hero"><div class="skyline">${Array.from({ length: 24 }, (_, i) =>
          `<i style="height:${30 + Math.abs(Math.sin(i * 1.7)) * 70}%;animation-delay:${(i % 6) * -0.4}s"></i>`).join("")}</div>
          <div class="hero-in"><div class="kicker">SCROLLAMA · SCROLLYTELLING</div><h1>用捲動<br>說一個資料故事</h1>
          <p class="muted">文字一段段捲過，圖表固定不動，隨著目前段落換重點。</p></div></section>
        <section class="story">
          <div class="graphic"><div class="chart"><h3>線上課程每月報名人數</h3>
            <div class="sub"><span>示意資料，單位：人</span><span class="dir"></span></div>
            <svg viewBox="0 0 560 300" role="img" aria-label="每月報名人數長條圖"></svg></div></div>
          <div class="steps">${steps.map(([t, p], i) => `<div class="step"><div class="card"><div class="no">STEP ${i + 1}</div><h2>${t}</h2><p>${p}</p><div class="meter"><i></i></div></div></div>`).join("")}</div>
        </section>
        <section class="outro"><h2>故事說完了</h2><p class="muted">往回捲，圖表會跟著倒帶到每一步。</p></section>
        <div class="dots">${"<i></i>".repeat(steps.length)}</div>`;
      const css = `
        .hero { position: relative; height: 52vh; min-height: 220px; display: grid; place-items: center; text-align: center; overflow: hidden;
          background: radial-gradient(60% 60% at 50% 100%, rgba(76,201,240,.16), transparent 70%), var(--bg); }
        .hero h1 { margin: 8px 0 6px; font-size: clamp(24px, 6vw, 44px); line-height: 1.15; font-weight: 900; }
        .hero p { max-width: 26em; margin: 0 auto; padding: 0 16px; }
        .skyline { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; display: flex; align-items: flex-end; gap: 1.2%; padding: 0 4%; opacity: .3; }
        .skyline i { flex: 1; border-radius: 5px 5px 0 0; background: linear-gradient(var(--c2), transparent); animation: grow 2.6s ease-in-out infinite alternate; transform-origin: bottom; }
        @keyframes grow { from { transform: scaleY(.55); } to { transform: scaleY(1); } }
        .hero-in { position: relative; z-index: 1; }
        .story { position: relative; display: flex; gap: 4%; padding: 0 4%; }
        .graphic { position: sticky; top: 0; height: 100vh; flex: 1 1 58%; display: grid; place-items: center; order: 2; }
        .chart { width: 100%; max-width: 560px; }
        .chart h3 { font-size: 17px; } .chart .sub { color: var(--muted); font-size: 12px; display: flex; gap: 12px; }
        .chart .dir { color: var(--accent); font-family: ${MONO}; }
        .chart svg { width: 100%; height: auto; max-height: calc(100vh - 70px); display: block; overflow: visible; }
        .mbar { transition: fill .5s, opacity .5s; }
        .lbl { font: 600 11px ${MONO}; fill: var(--muted); }
        .val { font: 700 13px ${MONO}; fill: var(--fg); opacity: 0; transition: opacity .4s; }
        .trend { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .12s linear; }
        .note { font: 700 14px ${FONT}; fill: var(--accent); opacity: 0; transition: opacity .4s; }
        .steps { flex: 1 1 38%; order: 1; padding: 30vh 0 40vh; position: relative; z-index: 2; }
        .step { min-height: 70vh; display: flex; align-items: center; }
        .step .card { opacity: .35; transform: scale(.96); transition: opacity .4s, transform .4s, border-color .4s; }
        .step.is-active .card { opacity: 1; transform: none; border-color: var(--accent); }
        .step .no { font: 700 12px ${MONO}; color: var(--accent); }
        .step h2 { margin: 4px 0 6px; font-size: clamp(17px, 3vw, 22px); } .step p { color: var(--muted); }
        .meter { height: 4px; border-radius: 4px; background: var(--line); margin-top: 12px; overflow: hidden; }
        .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
        .dots { position: fixed; right: 8px; top: 50%; transform: translateY(-50%); display: grid; gap: 8px; z-index: 40; }
        .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background .3s, transform .3s; }
        .dots i.on { background: var(--accent); transform: scale(1.4); }
        .outro { padding: 50px 20px 120px; text-align: center; }
        @media (max-width: 520px) {
          .story { display: block; padding: 0 22px 0 14px; }
          .graphic { height: 58vh; padding-top: 8px; z-index: 3; background: var(--bg); }
          .chart svg { max-height: calc(58vh - 60px); }
          .steps { padding: 10vh 0 30vh; } .step { min-height: 50vh; }
        }`;
      const { win, doc } = await scrollFrame(ctx, host, { body, css });
      const chart = buildChart(doc, doc.querySelector("svg"));
      const dirEl = doc.querySelector(".dir"), dots = [...doc.querySelectorAll(".dots i")];
      chart.render(0);
      const auto = autoScroll(ctx, win, { speed: 140, rest: [900, 1500] });
      ctx.button("重播", () => auto.restart());
      await settle(ctx);
      const sc = win.scrollama();
      sc.setup({ step: ".step", offset: win.innerWidth <= 520 ? 0.75 : 0.6, progress: true })
        .onStepEnter(({ element, index, direction }) => {
          doc.querySelectorAll(".step").forEach((s) => s.classList.toggle("is-active", s === element));
          dots.forEach((d, i) => d.classList.toggle("on", i === index));
          dirEl.textContent = direction === "up" ? "↑ 倒帶" : "↓ 前進";
          chart.render(index);
        })
        .onStepProgress(({ element, index, progress }) => {
          element.querySelector(".meter i").style.width = `${(progress * 100).toFixed(1)}%`;
          if (index === 3) chart.draw(progress);
        });
      refit(win, () => [sc]);
      ctx.onCleanup(() => sc.destroy());
    },
  },
  {
    id: "events", title: "進入與離開事件",
    api: "onStepEnter / onStepExit({ element, index, direction })",
    desc: "每個段落的上緣捲過觸發線時觸發 onStepEnter，下緣捲過時觸發 onStepExit，回呼都帶著 index 與捲動方向 direction。右側紀錄即時列出每一次事件。",
    hint: "看段落跨過黃色觸發線時，enter／exit 與方向箭頭如何變化",
    async mount(ctx) {
      const host = frameHost(ctx);
      const N = 6;
      const body = `<div class="hline"><span>offset 0.5</span></div>
        <div class="col"><div class="intro"><div class="kicker">ON STEP ENTER ・ EXIT</div><p class="muted">六個段落，觸發線在視窗正中央。</p></div>
        ${Array.from({ length: N }, (_, i) => `<div class="step"><code>STEP ${i + 1}</code><b>尚未進入</b><span class="mono muted">enter 0 ・ exit 0</span></div>`).join("")}
        <div class="pad"></div></div>
        <aside class="log"><h3>事件紀錄</h3><section></section></aside>`;
      const css = `
        .hline { top: 50%; } .hline span { right: 266px; }
        .col { padding: 0 266px 0 14px; }
        .intro { height: 42vh; display: grid; align-content: end; gap: 4px; padding-bottom: 14px; }
        .step { height: 34vh; min-height: 110px; margin-bottom: 14vh; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2);
          display: grid; align-content: center; justify-items: start; gap: 2px; padding: 0 18px; transition: border-color .3s, background .3s; }
        .step b { font-size: 18px; } .step.on { border-color: var(--c4); background: color-mix(in srgb, var(--c4) 16%, var(--bg-2)); } .step.on b { color: var(--c4); }
        .step.out b { color: var(--c3); }
        .pad { height: 55vh; }
        .log { top: 10px; right: 10px; bottom: 10px; width: 246px; } .log .enter { color: var(--c4); } .log .exit { color: var(--c3); }
        @media (max-width: 600px) { .col { padding: 0 14px 130px; } .hline span { right: 8px; } .log { top: auto; left: 10px; width: auto; height: 116px; } }`;
      const { win, doc } = await scrollFrame(ctx, host, { body, css });
      const lines = doc.querySelector(".log section");
      const counts = Array.from({ length: N }, () => ({ enter: 0, exit: 0 }));
      const show = (type) => ({ element, index, direction }) => {
        const c = counts[index];
        c[type]++;
        element.classList.toggle("on", type === "enter");
        element.classList.toggle("out", type === "exit");
        element.querySelector("b").textContent = `${type} ${arrow(direction)}`;
        element.querySelector("span").textContent = `enter ${c.enter} ・ exit ${c.exit}`;
        const name = type === "enter" ? "onStepEnter" : "onStepExit ";
        lines.prepend(Showcase.h("div", { class: type, text: `${name} #${index + 1} ${arrow(direction)} ${direction || "初始"}` }));
        while (lines.children.length > 16) lines.lastChild.remove();
      };
      const auto = autoScroll(ctx, win, { speed: 130 });
      ctx.button("清除紀錄", () => lines.replaceChildren());
      ctx.button("重播", () => auto.restart());
      await settle(ctx);
      const sc = win.scrollama().setup({ step: ".step", offset: 0.5 }).onStepEnter(show("enter")).onStepExit(show("exit"));
      refit(win, () => [sc]);
      ctx.onCleanup(() => sc.destroy());
    },
  },
  {
    id: "offset", title: "offset 觸發線",
    api: 'scroller.offset(0.25) ・ data-offset="120px" ・ setup({ debug: true })',
    desc: "offset 決定觸發線在視窗的哪個高度（0 是頂端、1 是底部），可以用 offset() 隨時改；個別段落也能用 data-offset 指定自己的觸發線，接受比例或像素。debug 會畫出每段的觀察範圍。",
    hint: "拖動 offset 移動黃線；第 4 段（粉紅虛框）只看 120px 那條線",
    async mount(ctx) {
      const host = frameHost(ctx);
      const body = `<div class="hline" id="gl"><span>全域 offset 0.50</span></div>
        <div class="hline" style="top:120px;--lc:var(--c3)"><span style="right:auto;left:8px">第 4 段 data-offset="120px"</span></div>
        <div class="col"><div class="intro"><div class="kicker">OFFSET</div><p class="muted">目前段落：<b id="cur">無</b></p></div>
        ${Array.from({ length: 7 }, (_, i) => i === 3
          ? `<div class="step px" data-offset="120px"><b>STEP 4</b><code>data-offset="120px"</code></div>`
          : `<div class="step"><b>STEP ${i + 1}</b><code>全域 offset</code></div>`).join("")}
        <div class="pad"></div></div>`;
      const css = `
        #gl { top: 50%; }
        .col { max-width: 620px; margin: 0 auto; padding: 0 14px; }
        .intro { height: 50vh; display: grid; align-content: end; gap: 4px; padding-bottom: 14px; }
        .step { height: 24vh; min-height: 84px; margin-bottom: 10vh; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2);
          display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 18px; transition: border-color .3s, background .3s; }
        .step code { color: var(--muted); } .step.on { border-color: var(--c1); background: color-mix(in srgb, var(--c1) 14%, var(--bg-2)); }
        .step.px { border: 1px dashed var(--c3); } .step.px.on { border-style: solid; background: color-mix(in srgb, var(--c3) 18%, var(--bg-2)); }
        .pad { height: 70vh; }
        .scrollama__debug-step { border-color: rgba(76,201,240,.55) !important; background: rgba(76,201,240,.05); pointer-events: none; }
        .scrollama__debug-step p { margin: 0; border-top-color: rgba(76,201,240,.9) !important; }`;
      const { win, doc } = await scrollFrame(ctx, host, { body, css });
      const gl = doc.getElementById("gl"), cur = doc.getElementById("cur");
      let sc, off = 0.5, debug = false;
      const make = () => {
        if (sc) sc.destroy();
        doc.querySelectorAll(".scrollama__debug-step").forEach((el) => el.remove());
        doc.querySelectorAll(".step").forEach((el) => el.classList.remove("on"));
        sc = win.scrollama().setup({ step: ".step", offset: off, debug })
          .onStepEnter(({ element, index }) => { element.classList.add("on"); cur.textContent = `STEP ${index + 1}`; })
          .onStepExit(({ element }) => element.classList.remove("on"));
      };
      ctx.onCleanup(() => sc && sc.destroy());
      const auto = autoScroll(ctx, win, { speed: 120 });
      ctx.slider("offset", { min: 0, max: 1, step: 0.05, value: 0.5, format: (v) => v.toFixed(2) }, (v) => {
        off = v;
        if (sc) sc.offset(v);
        gl.style.top = `${v * 100}%`;
        gl.firstChild.textContent = `全域 offset ${v.toFixed(2)}`;
      });
      ctx.toggle("debug", false, (v) => { debug = v; make(); });
      ctx.button("重播", () => auto.restart());
      await settle(ctx);
      make();
      refit(win, () => [sc]);
    },
  },
  {
    id: "progress", title: "progress 進度模式",
    api: "setup({ progress: true, threshold: 4 }).onStepProgress(({ progress }) => …)",
    desc: "開啟 progress 後，段落從上緣碰到觸發線（0）到下緣離開（1）會持續回報進度。threshold 是回報的像素間隔：越小越細、回呼越多。右側圓環與每秒回呼數即時顯示。",
    hint: "切換 threshold，比較每秒回呼次數與進度條的細緻度",
    async mount(ctx) {
      const host = frameHost(ctx);
      const C = 2 * Math.PI * 52;
      const body = `<div class="hline" style="top:50%"><span>offset 0.5</span></div>
        <div class="col"><div class="intro"><div class="kicker">ON STEP PROGRESS</div><p class="muted">每段的進度條直接由 progress 驅動。</p></div>
        ${Array.from({ length: 5 }, (_, i) => `<div class="step"><code>STEP ${i + 1}</code><div class="pct">0%</div><div class="bar"><i></i></div></div>`).join("")}
        <div class="pad"></div></div>
        <aside class="gauge"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="10"/>
          <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="#4cc9f0" stroke-width="10" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 60 60)"/>
          <text id="gp" x="60" y="66" text-anchor="middle">0%</text></svg>
          <div id="gs" class="mono">尚未進入</div><div id="gr" class="mono muted">0 次/秒</div></aside>`;
      const css = `
        .hline span { right: 204px; }
        .col { padding: 0 204px 0 14px; }
        .intro { height: 46vh; display: grid; align-content: end; gap: 4px; padding-bottom: 14px; }
        .step { height: 52vh; min-height: 150px; margin-bottom: 8vh; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2);
          padding: 14px 18px; display: grid; align-content: space-between; transition: border-color .3s; }
        .step.on { border-color: var(--c2); }
        .pct { font: 700 30px/1 ${MONO}; color: var(--c2); }
        .bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,.07); overflow: hidden; }
        .bar i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--c2); }
        .pad { height: 55vh; }
        .gauge { position: fixed; right: 18px; top: 50%; transform: translateY(-50%); width: 170px; text-align: center; z-index: 10; }
        .gauge svg { width: 100%; display: block; } .gauge text { font: 700 24px ${MONO}; fill: var(--fg); }
        @media (max-width: 600px) {
          .col { padding: 0 14px; } .hline span { right: 8px; } .intro { padding-right: 106px; }
          .gauge { top: 8px; right: 8px; transform: none; width: 96px; padding: 6px; border-radius: 10px; background: rgba(18,20,24,.92); border: 1px solid var(--line); }
          .gauge #gr { font-size: 10px; } }`;
      const { win, doc } = await scrollFrame(ctx, host, { body, css });
      const ring = doc.getElementById("ring"), gp = doc.getElementById("gp"), gs = doc.getElementById("gs"), gr = doc.getElementById("gr");
      let sc, threshold = 4, calls = 0;
      const make = () => {
        if (sc) sc.destroy();
        doc.querySelectorAll(".step").forEach((el) => el.classList.remove("on"));
        sc = win.scrollama().setup({ step: ".step", progress: true, threshold })
          .onStepEnter(({ element, index }) => { element.classList.add("on"); gs.textContent = `STEP ${index + 1}`; })
          .onStepExit(({ element }) => element.classList.remove("on"))
          .onStepProgress(({ element, progress }) => {
            calls++;
            const pct = `${Math.round(progress * 100)}%`;
            element.style.setProperty("--p", progress);
            element.querySelector(".pct").textContent = pct;
            ring.setAttribute("stroke-dashoffset", C * (1 - progress));
            gp.textContent = pct;
          });
      };
      ctx.onCleanup(() => sc && sc.destroy());
      ctx.interval(() => { gr.textContent = `${calls} 次/秒`; calls = 0; }, 1000);
      const auto = autoScroll(ctx, win, { speed: 140 });
      const TH = [4, 1, 40];
      ctx.group(["threshold 4px（預設）", "1px", "40px"], 0, (i) => { threshold = TH[i]; make(); });
      ctx.button("重播", () => auto.restart());
      await settle(ctx);
      make();
      refit(win, () => [sc]);
    },
  },
  {
    id: "taiwan", title: "台灣六都故事",
    api: "sticky 全幅圖表 + 疊在上面的段落卡片",
    desc: "另一種常見版型：圖表佔滿整個畫面固定不動，文字卡片疊在圖上捲過。第 1 段用 progress 讓長條跟著捲動長出來，後面幾段用 onStepEnter 切換重點。人口為約略值，僅供示意。",
    hint: "看長條在第 1 段跟著捲動長出來，之後各段換重點",
    async mount(ctx) {
      const host = frameHost(ctx);
      const body = `<div class="intro"><div class="kicker">TAIWAN ・ SIX MUNICIPALITIES</div><h2>六都有多少人？</h2><p class="muted">往下捲，看六個直轄市的人口對照。</p></div>
        <section class="scrolly"><figure class="sticky"><div class="board"><h3>六都人口（約略值）</h3><div class="sub muted">單位：萬人，示意用</div>
          <div class="rows">${CITIES.map(([n, v]) => `<div class="row" data-city="${n}"><span>${n}</span><div class="track"><i style="--w:${(v / CITIES[0][1]) * 100}%"></i></div><b>${v}</b></div>`).join("")}</div>
          <div class="total"></div></div></figure>
        <article class="steps">${CITY_STEPS.map((s, i) => `<div class="step"><div class="card"><div class="mono" style="color:var(--accent)">${i + 1} / ${CITY_STEPS.length}</div><h3>${s.t}</h3><p class="muted">${s.p}</p></div></div>`).join("")}</article></section>
        <div class="outro muted">六都人口為約略值，僅供版型示意。</div>`;
      const css = `
        .intro { height: 40vh; display: grid; align-content: end; gap: 4px; padding: 0 16px 14px; } .intro h2 { font-size: 24px; }
        .scrolly { position: relative; }
        .sticky { position: sticky; top: 0; height: 100vh; margin: 0; display: grid; place-items: center end; padding: 16px; }
        .board { width: min(560px, 58%); }
        .board h3 { font-size: 16px; } .sub { font-size: 12px; }
        .rows { display: grid; gap: 8px; margin-top: 10px; }
        .row { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 2.6em; align-items: center; gap: 10px; transition: opacity .4s; }
        .row b { font: 700 13px ${MONO}; text-align: right; }
        .track { position: relative; height: 22px; border-radius: 6px; background: rgba(255,255,255,.05); overflow: hidden; }
        .track i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--w) * var(--g, 1)); background: var(--c2); border-radius: 6px; transition: background .4s; }
        .row.hi .track i { background: var(--c1); } .row.dim { opacity: .3; }
        .total { margin-top: 12px; min-height: 1.6em; font-weight: 700; color: var(--accent); }
        .steps { position: relative; z-index: 2; margin-top: -100vh; padding: 50vh 16px 50vh; pointer-events: none; }
        .step { min-height: 80vh; display: flex; align-items: center; }
        .step .card { max-width: 290px; background: #171a1f; transition: border-color .4s; pointer-events: auto; }
        .step .card > * { opacity: .45; transition: opacity .4s; }
        .step .card h3 { font-size: 18px; margin: 2px 0 4px; }
        .step.on .card { border-color: var(--accent); } .step.on .card > * { opacity: 1; }
        .outro { padding: 30px 16px 80px; text-align: center; }
        @media (max-width: 640px) { .sticky { place-items: start center; padding-top: 14px; } .board { width: 100%; } .step .card { max-width: none; } }`;
      const { win, doc } = await scrollFrame(ctx, host, { body, css });
      const rows = [...doc.querySelectorAll(".row")], total = doc.querySelector(".total"), scrolly = doc.querySelector(".scrolly");
      const pop = Object.fromEntries(CITIES);
      const render = (i) => {
        const hi = CITY_STEPS[i].hi;
        rows.forEach((r) => { r.classList.toggle("hi", hi.includes(r.dataset.city)); r.classList.toggle("dim", hi.length > 0 && !hi.includes(r.dataset.city)); });
        const sum = hi.reduce((s, n) => s + pop[n], 0);
        total.textContent = hi.length > 1 ? `${hi.join("＋")} ≈ ${sum.toLocaleString("zh-TW")} 萬人` : "";
        if (i > 0) scrolly.style.setProperty("--g", 1);
      };
      scrolly.style.setProperty("--g", 0);
      const auto = autoScroll(ctx, win, { speed: 140, rest: [900, 1500] });
      ctx.button("重播", () => auto.restart());
      await settle(ctx);
      const sc = win.scrollama().setup({ step: ".step", offset: 0.6, progress: true })
        .onStepEnter(({ element, index }) => {
          doc.querySelectorAll(".step").forEach((s) => s.classList.toggle("on", s === element));
          render(index);
        })
        .onStepProgress(({ index, progress }) => { if (index === 0) scrolly.style.setProperty("--g", Math.min(1, progress * 2)); });
      refit(win, () => [sc]);
      ctx.onCleanup(() => sc.destroy());
    },
  },
  {
    id: "multi", title: "多個實例",
    api: "scrollama() × 3 ・ setup({ offset, once }) ・ disable() / enable()",
    desc: "同一組段落可以掛多個獨立的 Scrollama 實例：A 的觸發線在 25%、B 在 75%、C 在 50% 並開啟 once（onStepEnter 只觸發一次）。B 可以隨時 disable() 暫停、enable() 恢復。",
    hint: "看三條線各自點亮段落右側的 A／B／C；按「實例 B」暫停或恢復",
    async mount(ctx) {
      const host = frameHost(ctx);
      const DEFS = [
        { key: "A", offset: 0.25, once: false, color: "--c2" },
        { key: "B", offset: 0.75, once: false, color: "--c3" },
        { key: "C", offset: 0.5, once: true, color: "--c4" },
      ];
      const body = `${DEFS.map((d) => `<div class="hline" data-line="${d.key}" style="top:${d.offset * 100}%;--lc:var(${d.color})"><span>${d.key} offset ${d.offset}${d.once ? " once" : ""}</span></div>`).join("")}
        <div class="col"><div class="intro"><div class="kicker">MULTIPLE INSTANCES</div><p class="muted">同樣八個段落，三個實例各算各的。數字是 onStepEnter 次數。</p></div>
        ${Array.from({ length: 8 }, (_, i) => `<div class="step"><b>STEP ${i + 1}</b><div class="pills">${DEFS.map((d) => `<span class="pill" data-k="${d.key}" style="--pc:var(${d.color})">${d.key} <em>0</em></span>`).join("")}</div></div>`).join("")}
        <div class="pad"></div></div>`;
      const css = `
        .col { max-width: 700px; margin: 0 auto; padding: 0 140px 0 14px; }
        .intro { height: 46vh; display: grid; align-content: end; gap: 4px; padding-bottom: 14px; }
        .step { height: 22vh; min-height: 80px; margin-bottom: 9vh; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2);
          display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 16px; }
        .pills { display: flex; gap: 6px; }
        .pill { font: 600 11px/1 ${MONO}; padding: 5px 8px; border-radius: 999px; border: 1px solid var(--pc); color: var(--pc); opacity: .45; transition: .25s; }
        .pill em { font-style: normal; } .pill.on { background: var(--pc); color: var(--bg); opacity: 1; }
        .hline.paused { opacity: .25; }
        .pad { height: 75vh; }
        @media (max-width: 520px) { .col { padding-right: 70px; } }`;
      const { win, doc } = await scrollFrame(ctx, host, { body, css });
      const pill = (step, k) => step.querySelector(`[data-k="${k}"]`);
      let insts = [], bOn = true;
      const auto = autoScroll(ctx, win, { speed: 130 });
      ctx.toggle("實例 B", true, (v) => {
        bOn = v;
        doc.querySelector('[data-line="B"]').classList.toggle("paused", !v);
        if (!insts.length) return;
        if (v) insts[1].enable();
        else { insts[1].disable(); doc.querySelectorAll('[data-k="B"]').forEach((p) => p.classList.remove("on")); }
      });
      ctx.button("重播", () => auto.restart());
      await settle(ctx);
      insts = DEFS.map((d) => {
        const sc = win.scrollama().setup({ step: ".step", offset: d.offset, once: d.once })
          .onStepEnter(({ element }) => { const p = pill(element, d.key); p.classList.add("on"); const em = p.querySelector("em"); em.textContent = +em.textContent + 1; })
          .onStepExit(({ element }) => { if (!d.once) pill(element, d.key).classList.remove("on"); });
        ctx.onCleanup(() => sc.destroy());
        return sc;
      });
      if (!bOn) insts[1].disable();
      // resize() rebuilds observers even on a disabled instance, so leave B out while it is paused
      refit(win, () => insts.filter((_, i) => i !== 1 || bOn));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "scrollama().setup({ step, progress: true })：每段 3 個 observer",
    desc: "逐級增加段落數。開啟 progress 時，Scrollama 會替每一段各建一個 ResizeObserver、觸發用與進度用的 IntersectionObserver；框內持續快速來回捲動，量測 FPS、setup 耗時與每秒回呼次數。",
    hint: "按「自動加壓」開始；調整捲動速度可改變每秒觸發量",
    async mount(ctx) {
      ctx.html(`<div class="stress-frame"></div>`);
      const css = `.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 3px; padding: 50vh 8px; }
        .list i { height: 18px; border-radius: 4px; background: linear-gradient(90deg, var(--c) calc(var(--p, 0) * 100%), rgba(255,255,255,.07) 0); }
        .list i.on { outline: 1px solid var(--c); }`;
      const { win, doc } = await scrollFrame(ctx, ctx.$(".stress-frame"), { body: `<div class="list"></div>`, css });
      const list = doc.querySelector(".list");
      const cols = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"];
      let sc = null, setupMs = 0, count = 0, calls = 0, rate = 0;
      ctx.onCleanup(() => sc && sc.destroy());
      refit(win, () => (sc ? [sc] : []));
      ctx.interval(() => { rate = calls; calls = 0; }, 1000);
      ctx.controls.classList.add("bottom");
      const auto = autoScroll(ctx, win, { speed: 1200, rest: [150, 150] });
      ctx.slider("捲動速度", { min: 200, max: 4000, step: 100, value: 1200, format: (v) => `${v}px/s` }, (v) => { auto.speed = v; });
      await settle(ctx);
      ctx.ramp({
        label: "段落", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000],
        minFps: 30,
        apply(n) {
          if (sc) sc.destroy();
          let html = "";
          for (let i = 0; i < n; i++) html += `<i style="--c:var(${cols[i % 6]})"></i>`;
          list.innerHTML = html;
          const t0 = performance.now();
          sc = win.scrollama().setup({ step: ".list i", progress: true })
            .onStepEnter(({ element }) => { calls++; element.classList.add("on"); })
            .onStepExit(({ element }) => { calls++; element.classList.remove("on"); })
            .onStepProgress(({ element, progress }) => { calls++; element.style.setProperty("--p", progress); });
          setupMs = performance.now() - t0;
          count = n;
          auto.sync();
        },
        metrics: () => ({ "setup": Showcase.fmtMs(setupMs), "observer": Showcase.fmtCompact(count * 3), "回呼／秒": Showcase.fmt(rate) }),
        note: "每段 3 個 observer，數量線性增加；瓶頸在捲動時大量 IntersectionObserver 的交集計算與回呼裡的樣式寫入。setup 會逐段讀取 offsetHeight 與位置（強制版面計算）。捲動速度越快，每秒進出的段落越多。",
      });
    },
  },
] });
</script>
</body>
