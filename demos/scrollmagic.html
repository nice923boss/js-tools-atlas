<style>

  /* 1. class toggles + pinned wipes (port of the original page) */

  /* 2. trigger hooks, offset, duration */
  .s-hk { font-size: 13px; --pad: 180px; }

  .hk-line { position: absolute; z-index: 5; height: 0; border-top: 2px dashed var(--c); pointer-events: none; }
  .hk-line span { position: absolute; left: 4px; top: 4px; padding: 2px 5px; border-radius: 4px; background: var(--bg); font: 700 10.5px/1 var(--mono); color: var(--c); white-space: nowrap; }
  .hk-line.up span { top: auto; bottom: 4px; }

  /* 3. pin + pushFollowers */
  .duo { position: absolute; left: 0; right: 0; bottom: 0; top: var(--sc-ctl-h, 0px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px;
    padding: 8px; box-sizing: border-box; }
  .duo .scroller { position: relative; inset: auto; height: 100%; min-height: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); }

  /* 5. progress events along a route */

  .s-ev .stn span { position: absolute; top: -13px; left: 18px; padding: 5px 9px; border-radius: 8px; white-space: nowrap; font-size: 13px; font-weight: 700;

  .hz-read { position: absolute; left: 10px; top: calc(var(--sc-ctl-h, 0px) + 12px); z-index: 6; pointer-events: none; font: 500 11.5px/1 var(--mono); color: var(--muted); }
  .hz-read b { color: var(--fg); font-weight: 600; }

  .s-hz .intro h2 { margin: 10px 0 8px; } .s-hz .intro p { margin: 0; font-size: 14px; }

  .s-go .ph { height: calc(var(--vh) * .3); min-height: 90px; max-width: 560px; border-radius: 14px; background: var(--img) center / cover; }

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollToPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/scrollmagic@2.0.9/scrollmagic/minified/plugins/animation.gsap.min.js"></script>

<script>
gsap.registerPlugin(ScrollToPlugin);

// ScrollMagic pins with position: fixed at getBoundingClientRect() coordinates, i.e. it assumes a fixed
// element is placed relative to the browser window. The showcase stage uses `contain: layout paint`, which
// makes the stage the containing block for fixed descendants, so shift pin positions into stage coordinates.
// The spacer-attribute guard leaves every other call (indicators, trigger positions) untouched.
{
  const get = ScrollMagic._util.get, viewportOffset = get.offset;
  get.offset = (elem, relativeToViewport) => {
    const o = viewportOffset(elem, relativeToViewport);
    const cb = relativeToViewport && elem && elem.hasAttribute && elem.hasAttribute("data-scrollmagic-pin-spacer") && elem.closest(".sc-stage");
    if (cb) { const r = cb.getBoundingClientRect(); o.top -= r.top; o.left -= r.left; }
    return o;
  };
}

const IMG = (n) => `_shared/img/photo-${n}.jpg`;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtPx = (v) => Math.round(v).toLocaleString("en-US");
const two = (i) => String(i + 1).padStart(2, "0");
const STATE = { BEFORE: "之前", DURING: "進行中", AFTER: "之後" };

const DIR_X = { FORWARD: "向右", REVERSE: "向左", PAUSED: "靜止" };
// Write text only when it changed, so per-frame readouts do not churn the DOM.
const put = (el, txt) => { if (el.__t !== txt) { el.__t = txt; el.textContent = txt; } };

// One scroll box + one Controller per scene. Everything is torn down on unmount.
function smStage(ctx, html, { cls = "", vertical = true, parent = ctx.el, refresh = 100 } = {}) {
  const sc = h("div", { class: `scroller ${cls}`, tabindex: "0" });
  const page = h("div", { class: "page" });
  page.innerHTML = html;
  sc.append(page);
  parent.append(sc);
  const ctrl = new ScrollMagic.Controller({ container: sc, vertical, refreshInterval: refresh });
  const st = {
    sc, page, ctrl, vertical, scenes: [], marks: false, busy: false, onSize: [],
    get pos() { return vertical ? sc.scrollTop : sc.scrollLeft; },
    get max() { return vertical ? sc.scrollHeight - sc.clientHeight : sc.scrollWidth - sc.clientWidth; },
    setPos(v) { if (vertical) sc.scrollTop = v; else sc.scrollLeft = v; },
    // mark = addIndicators() options, or null for scenes that never show indicators
    add(scene, mark = null) {
      scene.addTo(ctrl);
      scene.__mark = mark;
      st.scenes.push(scene);
      if (st.marks && mark) scene.addIndicators(mark);
      return scene;
    },
    drop(scene) { st.scenes = st.scenes.filter((s) => s !== scene); scene.destroy(true); },
    marksOn(v) {
      st.marks = v;
      for (const s of st.scenes) if (s.__mark) { if (v) s.addIndicators(s.__mark); else s.removeIndicators(); }
    },
    $: (q) => page.querySelector(q),
    $$: (q) => [...page.querySelectorAll(q)],
  };
  const sync = () => {
    sc.style.setProperty("--vh", `${sc.clientHeight}px`);
    sc.style.setProperty("--vw", `${sc.clientWidth}px`);
    st.onSize.forEach((fn) => fn());
    // A pin spacer only re-measures its pinned element on a duration "shift", so a resize while the
    // scene is BEFORE would leave a stale spacer height. Replay that internal event on every resize.
    st.scenes.forEach((s) => s.trigger("shift.internal", { reason: "duration" }));
    ctrl.update(true);
    if (ctrl._indicators) ctrl._indicators.updateTriggerGroupPositions();
  };
  sync();
  const ro = new ResizeObserver(sync);
  ro.observe(sc);
  ctx.onCleanup(() => { ro.disconnect(); gsap.killTweensOf(sc); ctrl.destroy(true); });
  return st;
}

// A pinned element is position: fixed, and its containing block is the stage, not the scroller, so a wheel
// or touch drag over it does not reach the scroller. Forward that input to the scroller ourselves.
function forwardPins(ctx, sc, vertical = true) {
  const pinned = (t) => {
    const el = t && t.closest && t.closest("[data-scrollmagic-pin-spacer] > *");
    return !!el && el.style.position === "fixed" && sc.contains(el);
  };
  const by = (d) => { if (vertical) sc.scrollTop += d; else sc.scrollLeft += d; };
  ctx.on(sc, "wheel", (e) => {
    if (e.ctrlKey || !pinned(e.target)) return;
    e.preventDefault();
    const k = e.deltaMode === 1 ? 32 : e.deltaMode === 2 ? sc.clientHeight : 1;
    by((vertical ? e.deltaY : e.deltaX || e.deltaY) * k);
  }, { passive: false });
  let last = null;
  ctx.on(sc, "touchstart", (e) => { last = pinned(e.target) ? e.touches[0] : null; }, { passive: true });
  ctx.on(sc, "touchmove", (e) => {
    if (!last) return;
    const t = e.touches[0];
    e.preventDefault();
    by(vertical ? last.clientY - t.clientY : last.clientX - t.clientX);
    last = t;
  }, { passive: false });
  ctx.on(sc, "touchend", () => { last = null; }, { passive: true });
}

// Self-running demo that stops for good on the first real wheel / touch / drag / key input.
function takeover(ctx, target, text = "自動示範中・捲動即接手") {
  const chip = h("div", { class: "auto-chip" }, text);
  ctx.el.append(chip);
  const s = { on: true, stop() { if (s.on) { s.on = false; chip.remove(); } } };
  const user = (e) => { if (e.isTrusted) s.stop(); };
  for (const t of ["wheel", "touchstart", "pointerdown", "keydown"]) ctx.on(target, t, user, { passive: true });
  return s;
}

// Slow ping-pong scroll so the preview moves. Paused while a scripted scrollTo is running (st.busy).
function autoScroll(ctx, st, tk, { speed = 140, pause = 1000 } = {}) {
  let dir = 1, wait = 700, pos = -1;
  ctx.raf((t, dt) => {
    if (!tk.on || st.busy) { pos = -1; return; }
    const max = st.max;
    if (max <= 2) return;
    if (wait > 0) { wait -= dt; return; }
    if (pos < 0 || Math.abs(st.pos - pos) > 2) pos = st.pos;
    pos = clamp(pos + (dir * speed * Math.min(dt, 50)) / 1000, 0, max);
    st.setPos(pos);
    if ((dir > 0 && pos >= max - 1) || (dir < 0 && pos <= 1)) { dir = -dir; wait = pause; }
  });
}

function hud(ctx, rows, cls = "") {
  const el = h("div", { class: `hud ${cls}` });
  el.innerHTML = rows.map(([k, c]) => (k === "bar" ? `<div class="bar"><i></i></div>` : `<div><span>${k}</span><b class="${c}">-</b></div>`)).join("");
  ctx.el.append(el);
  return (c) => el.querySelector(c === "bar" ? ".bar i" : `.${c}`);
}

function logBox(ctx, title, max = 5) {
  const el = h("div", { class: "log" });
  el.innerHTML = `<header><span>${title}</span><b></b></header><section></section>`;
  ctx.el.append(el);
  const rows = el.querySelector("section"), state = el.querySelector("header b");
  return {
    add(txt) {
      const d = document.createElement("div");
      d.textContent = txt;
      rows.prepend(d);
      while (rows.children.length > max) rows.lastChild.remove();
    },
    state(txt) { put(state, txt); },
  };
}

function band(ctx, k, color, text) {
  const el = h("div", { class: "band", style: `--c:${color};top:calc(var(--sc-ctl-h, 0px) + (100% - var(--sc-ctl-h, 0px)) * ${k})` }, h("span", {}, text));
  ctx.el.append(el);
  return el;
}

      const ra = st.$(".ra"), rb = st.$(".rb"), mk = st.$(".rail .mk");
      ctx.raf(() => {
        put(ra, `scene ${sA.progress().toFixed(2)}・tween ${tlA.progress().toFixed(2)}・${sA.state()}`);
        const mode = tlB.isActive() ? (tlB.reversed() ? "倒轉中" : "播放中") : "靜止";
        put(rb, `${sB.state()}・tween ${tlB.progress().toFixed(2)}・${mode}`);
        mk.style.left = `${(sA.progress() * 100).toFixed(2)}%`;
      });
      ctx.toggle("tweenChanges", false, (v) => sA.tweenChanges(v));
      ctx.toggle("顯示指示器", false, (v) => st.marksOn(v));
      const tk = takeover(ctx, st.sc);
      autoScroll(ctx, st, tk, { speed: 120, pause: 1200 });
    },
  },

  {
    id: "events", title: "進度事件與路線",
    api: "scene.on(\"progress\" | \"enter\" | \"leave\" | \"start\" | \"end\")",
    desc: "整段路線是一個 duration 等於區塊高度、triggerHook 0.5 的 Scene，progress 事件換算成 SVG 線段長度，線頭永遠停在畫面中線。五個站點各是 duration 0 的 Scene，用 setClassToggle 點亮，enter 與 leave 事件帶有 scrollDirection，右下角記錄每次觸發的方向。",
    hint: "上下來回捲，看事件紀錄的方向",
    mount(ctx) {
      const STN = [["台北", 0.08], ["新竹", 0.3], ["台中", 0.52], ["台南", 0.74], ["高雄", 0.94]];
      const st = smStage(ctx, `<section class="intro"><div><h2>南下路線（示意）</h2><p>畫面中線是 triggerHook 0.5。往下捲，線條會畫到中線為止；每經過一站就觸發一次 enter。</p></div></section>
        <section class="route"><svg aria-hidden="true"><path class="base"/><path class="done"/><circle class="tip" r="10"/></svg>
          ${STN.map(([n], i) => `<div class="stn" style="--c:${COLORS[i]}"><i></i><span>${n}<small>${two(i)}</small></span></div>`).join("")}</section>
        <section class="outro intro"><div><h2>終點</h2><p>往回捲，站點依相反方向觸發 leave。</p></div></section>`, { cls: "s-ev" });
      const route = st.$(".route"), svg = route.querySelector("svg"), base = svg.querySelector(".base"), done = svg.querySelector(".done"), tip = svg.querySelector(".tip");
      const stns = st.$$(".stn");
      let L = 0, ys = [], ls = [], xs = [], prog = 0;
      // y -> path length lookup; the snake path is monotone in y, so a binary search is enough
      const atY = (y) => {
        let lo = 0, hi = ys.length - 1;
        if (!ys.length) return { l: 0, x: 0 };
        if (y <= ys[0]) return { l: 0, x: xs[0] };
        if (y >= ys[hi]) return { l: L, x: xs[hi] };
        while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ys[m] <= y) lo = m; else hi = m; }
        const f = (y - ys[lo]) / (ys[hi] - ys[lo] || 1);
        return { l: ls[lo] + (ls[hi] - ls[lo]) * f, x: xs[lo] + (xs[hi] - xs[lo]) * f };
      };
      const draw = (p) => {
        prog = p;
        const H = route.clientHeight, { l, x } = atY(p * H);
        done.style.strokeDashoffset = `${L - l}`;
        tip.setAttribute("cx", x);
        tip.setAttribute("cy", p * H);
      };
      const build = () => {
        const W = route.clientWidth, H = route.clientHeight;
        if (!W || !H) return;
        svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
        const pts = [[W * 0.5, 0], [W * 0.22, H * 0.2], [W * 0.78, H * 0.41], [W * 0.24, H * 0.63], [W * 0.76, H * 0.84], [W * 0.5, H]];
        let d = `M${pts[0][0]},${pts[0][1]}`;
        for (let i = 1; i < pts.length; i++) {
          const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], ym = (y0 + y1) / 2;
          d += ` C${x0},${ym} ${x1},${ym} ${x1},${y1}`;
        }
        base.setAttribute("d", d);
        done.setAttribute("d", d);
        L = done.getTotalLength();
        done.style.strokeDasharray = `${L}`;
        ys = []; ls = []; xs = [];
        for (let i = 0; i <= 600; i++) { const l = (L * i) / 600, pt = done.getPointAtLength(l); ls.push(l); xs.push(pt.x); ys.push(pt.y); }
        stns.forEach((el, i) => {
          const y = STN[i][1] * H, { x } = atY(y);
          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
          el.classList.toggle("flip", x > W * 0.55);
        });
        draw(prog);
      };
      st.onSize.push(build);
      build();

      const log = logBox(ctx, "事件紀錄", 5);
      const main = st.add(new ScrollMagic.Scene({ triggerElement: route, triggerHook: 0.5, duration: () => route.offsetHeight })
        .on("progress", (e) => draw(e.progress))
        .on("start end", (e) => log.add(`路線 ${e.type}（${DIR[e.scrollDirection]}）`)));
      let here = "-";
      STN.forEach(([n], i) => {
        st.add(new ScrollMagic.Scene({ triggerElement: stns[i], triggerHook: 0.5 }).setClassToggle(stns[i], "on")
          .on("enter leave", (e) => {
            log.add(`${n} ${e.type}（${DIR[e.scrollDirection]}）`);
            here = e.type === "enter" ? n : i ? STN[i - 1][0] : "-";
          }));
      });
      band(ctx, 0.5, "var(--c2)", "triggerHook 0.5");
      const q = hud(ctx, [["進度", "pg"], ["方向", "dr"], ["狀態", "ss"], ["站點", "sn"], ["bar"]]);
      const pg = q("pg"), dr = q("dr"), ss = q("ss"), sn = q("sn"), bar = q("bar");
      ctx.raf(() => {
        put(pg, `${(main.progress() * 100).toFixed(1)}%`);
        put(dr, DIR[st.ctrl.info("scrollDirection")]);
        put(ss, STATE[main.state()]);
        put(sn, here);
        bar.style.width = `${(main.progress() * 100).toFixed(1)}%`;
        log.state(DIR[st.ctrl.info("scrollDirection")]);
      });
      const tk = takeover(ctx, st.sc);
      autoScroll(ctx, st, tk, { speed: 160 });
    },
  },

  {
    id: "horizontal", title: "水平控制器",
    api: "new ScrollMagic.Controller({ vertical: false })",
    desc: "Controller 改成水平後，triggerHook 0.5 變成容器的水平中線，duration 與 offset 都改用水平距離。每張卡片兩個 Scene：一個在卡片通過中線時切換 .active，一個從卡片進入到離開，拖曳圖片的 xPercent 做視差。滾輪的垂直量會轉成水平捲動。",
    hint: "直接用滾輪，畫面會往右捲",
    mount(ctx) {
      const P = [[1, "峽灣"], [2, "紅色峽谷"], [3, "山谷公路"], [5, "瀑布彩虹"], [6, "水母"], [8, "海象"]];
      const st = smStage(ctx, `<section class="intro"><div class="kicker">VERTICAL: FALSE</div><h2>水平控制器</h2>
          <p>底部標記是每張卡片 .active 場景的 start 與 end，位置用水平距離計算。</p></section>
        ${P.map(([n, t], i) => `<article class="hp" style="--c:${COLORS[i]}"><div class="in"><img src="${IMG(n)}" alt="${t}"><span class="tag">.active</span>
          <div class="cap"><b>P${i + 1}</b><h4>${t}</h4></div></div></article>`).join("")}
        <section class="intro"><h2>捲到底了</h2><p>往回捲，.active 會依序退回前一張。</p></section>`, { cls: "hz s-hz", vertical: false });
      const hps = st.$$(".hp");
      // the trigger is the untransformed .hp; only its inner .in scales, so trigger positions stay put
      hps.forEach((hp, i) => {
        st.add(new ScrollMagic.Scene({ triggerElement: hp, triggerHook: 0.5, duration: () => hp.offsetWidth }).setClassToggle(hp, "active"),
          { name: `P${i + 1}`, colorStart: COLORS[i], colorEnd: COLORS[i], indent: (i % 2) * 22 });
        st.add(new ScrollMagic.Scene({ triggerElement: hp, triggerHook: 1, duration: () => hp.offsetWidth + st.sc.clientWidth })
          .setTween(gsap.fromTo(hp.querySelector("img"), { xPercent: -8 }, { xPercent: 8, ease: "none" })));
      });
      st.marksOn(true);
      ctx.on(st.sc, "wheel", (e) => {
        if (e.ctrlKey || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
        e.preventDefault();
        st.sc.scrollLeft += e.deltaY * (e.deltaMode === 1 ? 32 : 1);
      }, { passive: false });
      const bar = h("i");
      ctx.el.append(h("div", { class: "hz-top" }, bar));
      const read = h("div", { class: "hz-read" });
      ctx.el.append(read);
      let last = "";
      ctx.raf(() => {
        const max = st.max || 1;
        bar.style.transform = `scaleX(${(st.pos / max).toFixed(4)})`;
        const act = hps.findIndex((hp) => hp.classList.contains("active"));
        const txt = `x <b>${fmtPx(st.pos)}</b> / ${fmtPx(max)}・${DIR_X[st.ctrl.info("scrollDirection")]}・作用中 <b>${act < 0 ? "-" : `P${act + 1}`}</b>`;
        if (txt !== last) { last = txt; read.innerHTML = txt; }
      });
      ctx.toggle("指示器", true, (v) => st.marksOn(v));
      const tk = takeover(ctx, st.sc);
      autoScroll(ctx, st, tk, { speed: 140 });
    },
  },

  {
    id: "scrollto", title: "scrollTo 與單向",
    api: "controller.scrollTo(fn | 元素 | scene)・reverse: false",
    desc: "controller.scrollTo(function) 把預設的瞬間跳轉換成 GSAP ScrollToPlugin 補間，之後目錄按鈕傳元素、「跳到 R3 觸發點」傳 Scene，都走同一個函式。每章的目錄高亮是 duration 等於章節高度的 Scene；L 與 R 徽章共用觸發點，L 往回捲會還原，R 設 reverse: false，觸發一次就停在完成狀態。",
    hint: "點目錄跳章・往回捲比較 L 與 R 徽章",
    mount(ctx) {
      const CH = [
        [1, "峽灣", "目錄每顆按鈕都呼叫 controller.scrollTo(章節元素)，ScrollMagic 先換算元素在容器內的位置，再交給捲動函式。"],
        [4, "巴哥犬", "捲動函式用 controller.scrollTo(function) 換掉：預設是直接設定 scrollTop，這裡改成 GSAP ScrollToPlugin 補間。"],
        [5, "瀑布", "下方兩個徽章共用觸發點：L 是一般場景，往回捲就移除樣式；R 設 reverse: false，觸發後就停在完成狀態。"],
        [7, "母獅", "「跳到 R3 觸發點」傳的是 Scene 本身，scrollTo(scene) 會捲到該場景的 scrollOffset()。"],
        [8, "海象", "每章一個 duration 等於章節高度的 Scene，用 setClassToggle 幫目錄按鈕加上 .on。"],
      ];
      const st = smStage(ctx, `<nav class="toc">${CH.map(([, t], i) => `<button type="button" style="--c:${COLORS[i]}">${i + 1} ${t}</button>`).join("")}</nav>
        ${CH.map(([n, t, p], i) => `<section class="chap" style="--c:${COLORS[i]}"><h2><b>${two(i)}</b> ${t}</h2><p>${p}</p><div class="ph" style="--img:url(${IMG(n)})"></div>
          <div class="badges"><span class="bd l">L${i + 1}・reverse: true<small>往回捲會還原</small></span><span class="bd r">R${i + 1}・reverse: false<small>只觸發一次</small></span></div></section>`).join("")}
        <div class="end"></div>`, { cls: "s-go" });
      const chaps = st.$$(".chap"), toc = st.$$(".toc button");
      const log = logBox(ctx, "scrollTo 紀錄", 5);
      chaps.forEach((ch, i) => st.add(new ScrollMagic.Scene({ triggerElement: ch, triggerHook: 0.5, duration: () => ch.offsetHeight }).setClassToggle(toc[i], "on")));
      const badge = (i, reverse) => {
        const row = chaps[i].querySelector(".badges");
        const s = st.add(new ScrollMagic.Scene({ triggerElement: row, triggerHook: 0.6, reverse }).setClassToggle(row.querySelector(reverse ? ".l" : ".r"), "hit"));
        if (!reverse) s.on("enter", () => log.add(`R${i + 1} 觸發，之後不再還原`));
        return s;
      };
      chaps.forEach((_, i) => badge(i, true));
      let R = chaps.map((_, i) => badge(i, false));

      let smooth = true, tw = null;
      const arrive = (p) => {
        st.busy = false; tw = null;
        log.add(`抵達 y = ${fmtPx(st.sc.scrollTop)}`);
        if (p.done) ctx.timeout(p.done, 120);
      };
      // Replace the scroll function: `this` is the container, pos is the target ScrollMagic computed.
      st.ctrl.scrollTo(function (pos, p = {}) {
        const y = clamp(pos - (p.pad || 0) + (p.nudge || 0), 0, st.max);
        if (tw) tw.kill();
        if (!smooth) { this.scrollTop = y; arrive(p); return; }
        st.busy = true;
        tw = gsap.to(this, {
          scrollTo: { y, autoKill: true, onAutoKill: () => { st.busy = false; tw = null; log.add("使用者捲動，補間中止"); } },
          duration: p.dur || 0.9, ease: "power2.inOut", onComplete: () => arrive(p),
        });
      });
      const go = (i) => {
        log.add(`前往第 ${i + 1} 章（${smooth ? "補間" : "瞬間"}）`);
        st.ctrl.scrollTo(chaps[i], { pad: 44 });
      };
      toc.forEach((b, i) => ctx.on(b, "click", () => go(i)));
      ctx.toggle("補間捲動", true, (v) => { smooth = v; });
      ctx.button("跳到 R3 觸發點", () => { log.add("scrollTo(R3 場景)"); st.ctrl.scrollTo(R[2], { nudge: 2 }); });
      ctx.button("重設單向", () => {
        // rebuild at the top so the new R scenes start in BEFORE instead of firing immediately
        log.add("回到頂端後重建 R1 到 R5");
        st.ctrl.scrollTo(0, {
          done: () => {
            R.forEach((s) => st.drop(s));
            R = chaps.map((_, i) => badge(i, false));
          },
        });
      });
      const tk = takeover(ctx, st.sc);
      const order = [2, 4, 1, 3, 0];
      let k = 0;
      const auto = () => { if (tk.on && ctx.active) go(order[k++ % order.length]); };
      ctx.timeout(auto, 900);
      ctx.interval(auto, 2600);
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × new ScrollMagic.Scene()・每級重建 Controller",
    desc: "格線裡每個方塊都是一個 Scene，容器持續自動上下捲；每一級重建整個 Controller，逐級加倍場景數，直到掉到 30 FPS 以下。「每幀更新」是 Controller 在一個 rAF 內更新全部 Scene 的 JS 時間，「refresh」是每 100ms 重新量測全部觸發元素位置的時間，「建置」是逐一 addTo 的時間。",
    hint: "按「自動加壓」開始・切到 GSAP 拖曳再測一次",
    mount(ctx) {
      ctx.controls.classList.add("bottom");
      const sc = h("div", { class: "scroller stress", tabindex: "0" }), grid = h("div", { class: "sg" }), cap = h("p", { class: "sg-cap" });
      sc.append(h("div", { class: "sg-wrap" }, cap, grid));
      ctx.el.append(sc);
      const sync = () => sc.style.setProperty("--vh", `${sc.clientHeight}px`);
      sync();
      const ro = new ResizeObserver(sync);
      ro.observe(sc);

      let ctrl = null, scenes = [], mode = 0, count = 0, autoOn = true;
      const T = { up: 0, rf: 0, build: 0, u: false, r: false, u0: 0, r0: 0 };
      const ema = (a, v) => (a ? a * 0.85 + v * 0.15 : v);
      // Time one whole pass: the first scene call of a pass starts the clock, a microtask after the
      // pass (the controller loops synchronously inside one rAF / timer callback) stops it.
      const endU = () => { T.up = ema(T.up, performance.now() - T.u0); T.u = false; };
      const endR = () => { T.rf = ema(T.rf, performance.now() - T.r0); T.r = false; };
      const wrap = (s) => {
        const u = s.update, r = s.refresh;
        s.update = function (now) {
          if (!T.u && !T.r) { T.u = true; T.u0 = performance.now(); queueMicrotask(endU); }
          return u.call(this, now);
        };
        s.refresh = function () {
          if (!T.r) { T.r = true; T.r0 = performance.now(); queueMicrotask(endR); }
          return r.call(this);
        };
      };
      const build = (n) => {
        count = n;
        if (ctrl) ctrl.destroy(true);
        grid.classList.toggle("tw", mode === 1);
        grid.innerHTML = "<b><i></i></b>".repeat(n);
        cap.textContent = `${n.toLocaleString("en-US")} 個方塊，每個都是一個 Scene（${mode ? "triggerHook 0.95・duration 260・setTween" : "triggerHook 0.8・setClassToggle"}）`;
        const bs = grid.children, t0 = performance.now();
        ctrl = new ScrollMagic.Controller({ container: sc, refreshInterval: 100 });
        scenes = new Array(n);
        for (let i = 0; i < n; i++) {
          const b = bs[i];
          // a tiny increasing offset keeps every addScene() re-sort on already-sorted input
          const s = mode === 0
            ? new ScrollMagic.Scene({ triggerElement: b, triggerHook: 0.8, offset: i * 1e-4 }).setClassToggle(b, "on")
            : new ScrollMagic.Scene({ triggerElement: b, triggerHook: 0.95, duration: 260, offset: i * 1e-4 })
              .setTween(gsap.fromTo(b.firstChild, { scale: 0.35, rotation: 0 }, { scale: 1, rotation: 180, ease: "none" }));
          s.addTo(ctrl);
          scenes[i] = s;
        }
        T.build = performance.now() - t0;
        scenes.forEach(wrap);
        T.up = 0; T.rf = 0;
      };
      ctx.onCleanup(() => { ro.disconnect(); if (ctrl) ctrl.destroy(true); });

      ctx.group(["class 切換", "GSAP 拖曳"], 0, (i) => { if (mode !== i) { mode = i; build(count); } });
      ctx.toggle("自動捲動", true, (v) => { autoOn = v; });
      const st = { get pos() { return sc.scrollTop; }, get max() { return sc.scrollHeight - sc.clientHeight; }, setPos(v) { sc.scrollTop = v; }, busy: false };
      autoScroll(ctx, st, { get on() { return autoOn; } }, { speed: 420, pause: 250 });
      ctx.ramp({
        label: "Scene", unit: "個", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000],
        apply: build,
        metrics: () => ({
          "每幀更新": Showcase.fmtMs(T.up),
          "refresh 每 100ms": Showcase.fmtMs(T.rf),
          "建置 addTo": Showcase.fmtMs(T.build),
          "DURING 狀態": `${scenes.reduce((a, s) => a + (s.state() === "DURING"), 0).toLocaleString("en-US")} 個`,
        }),
        note: "ScrollMagic 不做可見範圍篩選：每次捲動，Controller 都在下一個 rAF 對全部 Scene 呼叫 update(true)；refreshInterval 預設每 100ms 對每個觸發元素量一次 getBoundingClientRect；addScene 每加一個就重新排序整份清單。樣式重算、transition 與繪製不在這些數字裡，FPS 才反映總成本。",
      });
    },
  },
] });
</script>
</body>
</html>
