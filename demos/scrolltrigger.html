<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const { h } = Showcase;
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const IMG = (n) => `_shared/img/photo-${n}.jpg`;

// Every scene scrolls inside its own container, never the page. This builds it, makes it the
// default ScrollTrigger scroller, keeps --vh / --vw in sync with its size and tears everything down.
function scrollStage(ctx, html, { cls = "" } = {}) {
  ctx.el.insertAdjacentHTML("beforeend", `<div class="scroller ${cls}" tabindex="0"><div class="page">${html}</div></div>`);
  const sc = ctx.el.lastElementChild;
  ScrollTrigger.defaults({ scroller: sc });
  const g = gsap.context(() => {}, ctx.el);
  const sync = () => { sc.style.setProperty("--vh", `${sc.clientHeight}px`); sc.style.setProperty("--vw", `${sc.clientWidth}px`); };
  sync();
  let w = sc.clientWidth, hh = sc.clientHeight, pending = 0;
  const ro = new ResizeObserver(() => {
    if (sc.clientWidth === w && sc.clientHeight === hh) return;
    w = sc.clientWidth; hh = sc.clientHeight;
    sync();
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => ctx.active && ScrollTrigger.refresh());
  });
  ro.observe(sc);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); g.revert(); ScrollTrigger.getAll().forEach((t) => t.kill()); });
  return { sc, g, vh: () => sc.clientHeight, $: (s) => sc.querySelector(s), $$: (s) => [...sc.querySelectorAll(s)] };
}

// Self-running demo that stops for good on the first real wheel / touch / drag / key input.
function takeover(ctx, sc, text = "自動示範中・捲動即接手") {
  const chip = h("div", { class: "auto-chip" }, text);
  ctx.el.append(chip);
  const s = { on: true, stop() { if (s.on) { s.on = false; chip.remove(); } } };
  for (const t of ["wheel", "touchstart", "pointerdown", "keydown"]) ctx.on(sc, t, s.stop, { passive: true });
  return s;
}

// Slow ping-pong scroll so the static preview shows the effect in motion.
function autoScroll(ctx, sc, { speed = 150, from = 0, pause = 900 } = {}) {
  const tk = takeover(ctx, sc);
  let dir = 1, wait = 0, pos = null;
  ctx.raf((t, dt) => {
    if (!tk.on) return;
    const max = sc.scrollHeight - sc.clientHeight;
    if (max <= 0) return;
    if (pos == null) pos = from * max;
    if (wait > 0) { wait -= dt; return; }
    pos += (dir * speed * dt) / 1000;
    if (pos >= max) { pos = max; dir = -1; wait = pause; } else if (pos <= 0) { pos = 0; dir = 1; wait = pause; }
    sc.scrollTop = pos;
  });
  return tk;
}

const SPOTS = [[6, 14], [12, 72], [3, 46], [24, 88], [88, 12], [82, 66], [93, 40], [70, 90], [30, 6], [64, 5]];
const TOWNS = ("台北 新北 基隆 桃園 新竹 苗栗 台中 彰化 南投 雲林 嘉義 台南 高雄 屏東 宜蘭 花蓮 台東 澎湖 金門 馬祖 " +
  "九份 淡水 北投 平溪 大溪 內灣 鹿港 日月潭 阿里山 奮起湖 安平 旗津 美濃 墾丁 恆春 小琉球 礁溪 羅東 太魯閣 瑞穗 " +
  "池上 鹿野 綠島 蘭嶼 三義 南庄 清境 溪頭 集集 北港 關子嶺 七股 鹽水 東港 三峽 鶯歌 烏來 野柳 福隆 頭城").split(" ");

Showcase.run({ scenes: [
  {
    id: "signature", title: "招牌捲動頁",
    api: "gsap.to(el, { scrollTrigger: { trigger, pin: true, scrub: 1 } })",
    desc: "原版整頁示範搬進獨立捲動容器：英雄區色塊隨捲動散開、頂部進度條、釘選後直捲變橫捲、釘選加擦洗的日出時間軸，最後是批次進場的磚塊。",
    hint: "滾輪或拖曳捲軸往下捲・往回捲所有動畫都會倒轉",
    mount(ctx) {
      ctx.el.insertAdjacentHTML("beforeend", `<div class="prog"></div>`);
      const cards = [[1, "峽灣"], [2, "紅岩峽谷"], [5, "瀑布彩虹"], [3, "山谷公路"]]
        .map(([n, t]) => `<figure class="card"><img src="${IMG(n)}" alt="${t}"><figcaption>${t}</figcaption></figure>`).join("");
      const tiles = ["淡入", "上移", "縮放", "錯開", "批次", "回呼", "反向", "擦洗", "釘選", "標記", "刷新", "完成"]
        .map((t, i) => `<div class="tile" style="background:${COLORS[i % 6]}">${t}</div>`).join("");
      const st = scrollStage(ctx, `
        <section class="hero"><div class="chips"></div>
          <div class="hero-in"><div class="kicker">GSAP・SCROLLTRIGGER</div><h1>捲動，<br><span>讓畫面跟著你走</span></h1>
          <p>釘選區段、擦洗時間軸、橫向捲動、批次進場，全部由捲動位置驅動。</p></div>

    api: "markers: { startColor, endColor, indent }, onToggle, ScrollTrigger.refresh()",
    desc: "三個觸發器打開 markers：右側標出各自的 start／end 與捲動容器上的觸發線。卡片即時顯示 progress、direction、getVelocity() 與 isActive，左下記錄每一次回呼；按「插入 160px」改變版面再 refresh()，可看到 onRefresh 回報的新位置。",
    hint: "上下捲動看回呼紀錄・按「插入 160px」後觀察 start／end 重新計算",
    mount(ctx) {
      const CFG = [
        { id: "A", start: "top 80%", end: "bottom 50%" },
        { id: "B", start: "top center", end: "+=240" },
        { id: "C", start: "top bottom-=60", end: "center 30%" },
      ];
      const st = scrollStage(ctx, `
        <div class="spacer"><h3>開發時打開 markers</h3><p>綠色是 start、紅色是 end；容器上的 scroller-start／scroller-end 線碰到它們時觸發。</p></div>
        ${CFG.map((c, i) => `<div class="mk-box" style="--c:${COLORS[i + 1]}"><span class="id">${c.id}</span>
          <code>start: "${c.start}"　end: "${c.end}"</code>
          <dl><dt>progress</dt><dd class="p">0.00</dd><dt>direction</dt><dd class="d">0</dd><dt>velocity</dt><dd class="v">0</dd><dt>isActive</dt><dd class="a">false</dd></dl></div>
          <div class="mk-gap"></div>`).join("")}
        <div class="spacer short"><h3>捲到底了</h3><p>內容高度改變後要呼叫 ScrollTrigger.refresh()，否則 start／end 位置會過期。</p></div>`, { cls: "s-mk" });
      ctx.el.insertAdjacentHTML("beforeend", `<div class="mk-log"><header>回呼紀錄（最新在上）</header><section></section></div>`);
      const rows = ctx.$(".mk-log section"), boxes = st.$$(".mk-box"), grow = st.$(".mk-gap");
      const t0 = performance.now();
      const log = (id, msg, c) => {
        rows.prepend(h("div", {}, h("span", { class: "t", text: `${((performance.now() - t0) / 1000).toFixed(1)}s ` }),
          h("b", { style: `color:${c}`, text: `${id} ` }), msg));
        while (rows.children.length > 6) rows.lastChild.remove();
      };
      let sts = [];
      const build = (markers) => st.g.add(() => {
        sts.forEach((s) => s.kill());
        sts = CFG.map((c, i) => {
          const box = boxes[i], color = COLORS[i + 1];
          return ScrollTrigger.create({
            id: c.id, trigger: box, start: c.start, end: c.end,
            markers: markers ? { startColor: "#7bd389", endColor: "#f72585", fontSize: "11px", indent: 8 + i * 70 } : false,
            onEnter: () => log(c.id, "onEnter", color), onLeave: () => log(c.id, "onLeave", color),
            onEnterBack: () => log(c.id, "onEnterBack", color), onLeaveBack: () => log(c.id, "onLeaveBack", color),
            onToggle: (self) => box.classList.toggle("on", self.isActive),
            onRefresh: (self) => log(c.id, `onRefresh start ${Math.round(self.start)} end ${Math.round(self.end)}`, color),
          });
        });
      });
      build(true);
      const cells = boxes.map((b) => ({ p: b.querySelector(".p"), d: b.querySelector(".d"), v: b.querySelector(".v"), a: b.querySelector(".a") }));
      ctx.raf(() => sts.forEach((s, i) => {
        const c = cells[i];
        c.p.textContent = s.progress.toFixed(2);
        c.d.textContent = s.direction || 0;
        c.v.textContent = `${Math.round(s.getVelocity())} px/s`;
        c.a.textContent = String(!!s.isActive);
      }));
      ctx.toggle("markers", true, (v) => build(v));
      ctx.button("插入 160px 並 refresh()", () => {
        grow.style.height = `${grow.offsetHeight + 160}px`;
        ScrollTrigger.refresh();
      });
      autoScroll(ctx, st.sc, { speed: 130, from: 0.05 });
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × gsap.fromTo(el, …, { scrollTrigger: { trigger: el, scrub } })",
    desc: "每個方塊各有一個 ScrollTrigger 加 scrub tween（旋轉＋縮放），容器以每秒 900px 持續上下捲動；逐級加倍觸發器數量，直到掉到 30 FPS 以下。可切換 scrub: 0.5 比較「追趕 tween」的額外成本。",
    hint: "按「自動加壓」開始・切換 scrub 模式後再測一次",
    mount(ctx) {
      ctx.controls.classList.add("bottom");
      const st = scrollStage(ctx, `<div class="st-grid"></div>`, { cls: "stress" });
      const grid = st.$(".st-grid"), sc = st.sc;
      let scrub = true, count = 0, items = [], buildMs = 0, autoOn = true;
      const build = (n) => {
        count = n;
        ScrollTrigger.getAll().forEach((t) => t.kill());
        gsap.killTweensOf(items);
        const frag = document.createDocumentFragment();
        items = Array.from({ length: n }, (_, i) => {
          const el = document.createElement("i");
          el.style.background = COLORS[i % 6];
          frag.append(el);
          return el;
        });
        grid.replaceChildren(frag);
        const t0 = performance.now();
        // immediateRender: false keeps creation from interleaving style writes with each trigger's layout read
        // (with the fromTo default of true, 3,000 triggers took about 9x longer to build in testing).
        for (const el of items) {
          gsap.fromTo(el, { rotation: 0, scale: 0.35 }, {
            rotation: 180, scale: 1, ease: "none", immediateRender: false,
            scrollTrigger: { trigger: el, start: "top bottom", end: "bottom top", scrub },
          });
        }
        buildMs = performance.now() - t0;
      };
      ctx.onCleanup(() => gsap.killTweensOf(items));
      let dir = 1, pos = 0;
      ctx.raf((t, dt) => {
        if (!autoOn) return;
        const max = sc.scrollHeight - sc.clientHeight;
        if (max <= 0) return;
        pos = Math.min(max, Math.max(0, pos + (dir * 900 * dt) / 1000));
        if (pos >= max) dir = -1; else if (pos <= 0) dir = 1;
        sc.scrollTop = pos;
      });
      ctx.group(["scrub: true", "scrub: 0.5"], 0, (i) => { scrub = i ? 0.5 : true; build(count); });
      ctx.toggle("自動捲動", true, (v) => { autoOn = v; pos = sc.scrollTop; });
      ctx.ramp({
        label: "觸發器", unit: "個", steps: [100, 200, 400, 800, 1600, 3200, 4800, 6400, 9600],
        apply: build,
        metrics: () => ({
          "作用中": ScrollTrigger.getAll().filter((t) => t.isActive).length,
          "建立耗時": Showcase.fmtMs(buildMs),
        }),
        note: "ScrollTrigger 每次捲動都會走訪全部觸發器判斷進出，作用中的才更新 transform。數值 scrub 會讓每個作用中的觸發器多跑一個追趕 tween，成本更高。建立耗時：每個新觸發器 refresh 時會走訪前面所有觸發器（檢查釘選位移），所以總建立時間大約隨數量平方成長，數千個以上建議改成少數觸發器驅動整組動畫。",
      });
    },
  },
] });
</script>
</body>
</html>
