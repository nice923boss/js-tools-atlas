<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScrollTrigger 示範：釘選、擦洗與橫向捲動</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { height: auto; min-height: 100%; }
  .progress { position: fixed; left: 0; top: 0; height: 4px; width: 100%; z-index: 60;
    background: linear-gradient(90deg, var(--c2), var(--c6), var(--c3)); transform-origin: 0 50%; transform: scaleX(0); }
  section { position: relative; }
  .hero { height: 100vh; min-height: 420px; display: grid; place-items: center; text-align: center; overflow: hidden;
    background: radial-gradient(50% 60% at 20% 30%, rgba(76,201,240,.22), transparent 70%),
                radial-gradient(45% 55% at 80% 70%, rgba(247,37,133,.20), transparent 70%), var(--bg); }
  .hero .kicker { font: 600 13px/1 var(--mono); color: var(--accent); letter-spacing: .12em; }
  .hero h1 { margin: 14px 0 10px; font-size: clamp(34px, 8vw, 76px); line-height: 1.08; font-weight: 900; }
  .hero h1 span { background: linear-gradient(90deg, var(--c2), var(--c6) 50%, var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 0 auto; max-width: 30em; color: var(--muted); padding: 0 20px; }
  .chips { position: absolute; inset: 0; pointer-events: none; }
  .chips i { position: absolute; width: 46px; height: 46px; border-radius: 12px; opacity: .8; }
  .hero-in { position: relative; z-index: 1; }
  @media (max-width: 600px) { .chips i { width: 28px; height: 28px; border-radius: 8px; opacity: .55; } }
  .down { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); color: var(--fg); font-size: 13px; text-align: center; }
  .down b { display: block; width: 18px; height: 18px; margin: 6px auto 0; border-right: 2px solid var(--accent); border-bottom: 2px solid var(--accent);
    transform: rotate(45deg); animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { translate: 0 6px; } }
  .label { position: absolute; left: 20px; top: 18px; z-index: 3; font: 600 12px/1 var(--mono); color: var(--accent); letter-spacing: .08em; }
  /* horizontal pinned track */
  .hscroll { height: 100vh; overflow: hidden; background: var(--bg-2); }
  .track { display: flex; gap: 24px; height: 100%; align-items: center; padding: 0 8vw; width: max-content; }
  .card { position: relative; flex: 0 0 auto; width: min(62vw, 420px); aspect-ratio: 3 / 2; border-radius: 16px; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.45); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card figcaption { position: absolute; left: 14px; bottom: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(0,0,0,.55); font-size: 13px; }
  .intro-card { width: min(70vw, 360px); aspect-ratio: auto; box-shadow: none; overflow: visible; }
  .intro-card h2 { margin: 0 0 8px; font-size: clamp(26px, 5vw, 40px); }
  .intro-card p { margin: 0; color: var(--muted); }
  /* sunrise pinned timeline */
  .sunrise { height: 100vh; overflow: hidden; background: #0b1026; }
  .sun { position: absolute; left: 50%; bottom: -60px; width: 180px; height: 180px; margin-left: -90px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff6b0, var(--accent) 45%, var(--c5)); box-shadow: 0 0 80px 20px rgba(255,140,66,.45); }
  .hill { position: absolute; left: -10%; right: -10%; bottom: -40px; height: 34%; border-radius: 50% 50% 0 0; background: #121a2e; }
  .hill.b { bottom: -70px; height: 28%; left: 30%; right: -30%; background: #0d1424; }
  .lines { position: absolute; left: 0; right: 0; top: 16%; text-align: center; padding: 0 20px; }
  .lines p { margin: 0 0 10px; font-size: clamp(18px, 3.4vw, 28px); font-weight: 700; opacity: 0; }
  .counter { position: absolute; right: 20px; bottom: 22px; z-index: 2; font: 700 clamp(28px, 6vw, 54px)/1 var(--mono); color: var(--fg); opacity: .9; }
  /* batch grid */
  .batch { padding: 70px 20px 40px; text-align: center; }
  .batch h2 { margin: 0 0 6px; font-size: clamp(22px, 4vw, 34px); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; max-width: 900px; margin: 26px auto 0; }
  .tile { height: 110px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; color: #111; opacity: 0; transform: translateY(40px) scale(.9); }
  .outro { padding: 60px 20px 90px; text-align: center; }
</style>
</head>
<body class="scroll">
<div class="progress"></div>
<div class="controls"><button class="btn" id="top">回到頂端</button></div>

<section class="hero">
  <div class="chips" id="chips"></div>
  <div class="hero-in">
    <div class="kicker">GSAP · SCROLLTRIGGER</div>
    <h1>捲動，<br><span>讓畫面跟著你走</span></h1>
    <p>釘選區段、擦洗時間軸、橫向捲動、批次進場，全部由捲動位置驅動。</p>
  </div>
  <div class="down">往下捲<b></b></div>
</section>

<section class="hscroll">
  <div class="label">01 釘選 + 橫向捲動</div>
  <div class="track" id="track">
    <div class="card intro-card"><h2>直捲變橫捲</h2><p>區段被釘住，垂直捲動轉成水平位移，scrub 讓動畫跟手。</p></div>
    <figure class="card" style="margin:0"><img src="_shared/img/photo-1.jpg" alt="峽灣"><figcaption>峽灣</figcaption></figure>
    <figure class="card" style="margin:0"><img src="_shared/img/photo-2.jpg" alt="紅岩峽谷"><figcaption>紅岩峽谷</figcaption></figure>
    <figure class="card" style="margin:0"><img src="_shared/img/photo-5.jpg" alt="瀑布彩虹"><figcaption>瀑布彩虹</figcaption></figure>
    <figure class="card" style="margin:0"><img src="_shared/img/photo-3.jpg" alt="山谷公路"><figcaption>山谷公路</figcaption></figure>
  </div>
</section>

<section class="sunrise" id="sunrise">
  <div class="label">02 釘選 + 擦洗時間軸</div>
  <div class="counter" id="counter">0%</div>
  <div class="sun" id="sun"></div>
  <div class="hill"></div><div class="hill b"></div>
  <div class="lines">
    <p>天還沒亮，</p>
    <p>太陽隨著你的捲動升起，</p>
    <p style="color:var(--accent)">往回捲，時間就倒轉。</p>
  </div>
</section>

<section class="batch">
  <div class="label" style="position:static;margin-bottom:10px">03 ScrollTrigger.batch</div>
  <h2>批次進場</h2>
  <p class="muted">同時進入畫面的元素會被分成一批，錯開出場。</p>
  <div class="grid" id="grid"></div>
</section>

<section class="outro">
  <h2>到底了</h2>
  <p class="muted">往回捲，所有動畫都會反向播放。</p>
</section>

<div class="hint">往下捲動，或拖曳捲軸</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];

// Hero: floating chips that drift apart as the hero scrolls away
const chips = document.getElementById("chips");
// Fixed spots around the edges so chips never cover the headline
const SPOTS = [[6, 14], [12, 72], [3, 46], [24, 88], [88, 12], [82, 66], [93, 40], [70, 90], [30, 6], [64, 5]];
SPOTS.forEach(([x, y], i) => {
  const c = document.createElement("i");
  c.style.background = COLORS[i % COLORS.length];
  c.style.left = x + "%";
  c.style.top = y + "%";
  chips.append(c);
});
gsap.from("#chips i", { scale: 0, rotation: -90, duration: 0.9, stagger: 0.06, ease: "back.out(2)" });
gsap.to("#chips i", { rotation: 15, y: -8, duration: 2.4, repeat: -1, yoyo: true, ease: "sine.inOut", stagger: 0.2 });
gsap.to("#chips i", {
  yPercent: (i) => (i % 2 ? -300 : 300), xPercent: (i) => (i % 3 - 1) * 200, opacity: 0, ease: "none",
  scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true },
});

// Page progress bar
gsap.to(".progress", { scaleX: 1, ease: "none", scrollTrigger: { start: 0, end: "max", scrub: 0.3 } });

// 01: pin + horizontal scroll
const track = document.getElementById("track");
const distance = () => Math.max(0, track.scrollWidth - window.innerWidth);
gsap.to(track, {
  x: () => -distance(), ease: "none",
  scrollTrigger: { trigger: ".hscroll", pin: true, scrub: 1, end: () => "+=" + distance(), invalidateOnRefresh: true },
});

// 02: pinned scrubbed timeline
const counter = document.getElementById("counter");
const tl = gsap.timeline({
  scrollTrigger: {
    trigger: "#sunrise", pin: true, scrub: 0.8, start: "top top", end: "+=160%",
    onUpdate: (self) => { counter.textContent = Math.round(self.progress * 100) + "%"; },
  },
});
tl.to("#sunrise", { backgroundColor: "#3a2a5a", duration: 1, ease: "none" }, 0)
  .to("#sun", { y: () => -window.innerHeight * 0.55, scale: 1.25, duration: 1, ease: "power1.out" }, 0)
  .to("#sunrise", { backgroundColor: "#f4a261", duration: 1, ease: "none" }, 1)
  .to(".lines p", { opacity: 1, y: -10, stagger: 0.5, duration: 0.4 }, 0.2);

// 03: batch reveal
const grid = document.getElementById("grid");
const NAMES = ["淡入", "上移", "縮放", "錯開", "批次", "回呼", "反向", "擦洗", "釘選", "標記", "刷新", "完成"];
NAMES.forEach((n, i) => {
  const t = document.createElement("div");
  t.className = "tile";
  t.style.background = COLORS[i % COLORS.length];
  t.textContent = n;
  grid.append(t);
});
ScrollTrigger.batch(".tile", {
  start: "top 88%",
  onEnter: (els) => gsap.to(els, { opacity: 1, y: 0, scale: 1, stagger: 0.08, duration: 0.6, ease: "back.out(1.6)", overwrite: true }),
  onLeaveBack: (els) => gsap.to(els, { opacity: 0, y: 40, scale: 0.9, stagger: 0.04, duration: 0.3, overwrite: true }),
});

document.getElementById("top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
</script>
</body>
</html>
