<style>

    font: 12px/1.55 var(--mono); padding: 10px 12px; white-space: pre; overflow: auto; }

<script src="_shared/showcase.js"></script>
<script type="module">
import {
  sculptToGLSL, uniformsToGLSL, minimalHeader, usePBRHeader, useHemisphereLight,
  sculptureStarterCode, fragFooter, minimalVertexSource,
} from "https://cdn.jsdelivr.net/npm/shader-park-core@0.2.8/dist/shader-park-core.esm.js";

// Shader Park showcase: eight scenes from the original sculpture lab to a resolution stress ramp.
const { h, fmtMs, fmtCompact } = Showcase;
const BASE = new Set(["time", "opacity", "_scale", "mouse", "stepSize", "resolution"]);
const DPR = () => Math.min(2, window.devicePixelRatio || 1);
const TRI = new Float32Array([-1, -1, 0, 3, -1, 0, -1, 3, 0]);
// GLSL ES 3.0 has no implicit int -> float conversion, so setStepSize(1) must emit "1.0".
const glslFloat = (n) => (Number.isInteger(n) ? n.toFixed(1) : String(n));

// Same assembly as shader-park-core's sculptToFullGLSLSource, keeping the parts we report on.
function compileSculpture(src) {
  const t0 = performance.now();
  const g = sculptToGLSL(src);
  const jsMs = performance.now() - t0;
  const frag = minimalHeader + usePBRHeader + useHemisphereLight + uniformsToGLSL(g.uniforms)
    + `const float STEP_SIZE_CONSTANT = ${glslFloat(g.stepSizeConstant)};\n`
    + `const int MAX_ITERATIONS = ${g.maxIterations};\n`
    + `#define MAX_REFLECTIONS ${g.maxReflections}\n`
    + sculptureStarterCode + g.geoGLSL + "\n" + g.colorGLSL + "\n" + fragFooter;
  return {
    frag, jsMs, glMs: 0, lines: frag.split("\n").length,
    uniforms: g.uniforms, inputs: g.uniforms.filter((u) => !BASE.has(u.name)),
    maxIterations: g.maxIterations, maxReflections: g.maxReflections, glsl: `${g.geoGLSL}\n${g.colorGLSL}`,
  };
}
const compileLine = (i) => `GLSL ${i.lines} 行・JS→GLSL ${fmtMs(i.jsMs)}・GPU 編譯 ${fmtMs(i.glMs)}`;

// Minimal WebGL2 host for one sculpture. The library's own minimal renderer sizes itself to the
// window and has no dispose(), so every scene owns one of these and releases it on cleanup.
function createRenderer(ctx, host, { dpr = true, pointer = true } = {}) {
  const canvas = h("canvas", { class: "sp" });
  host.append(canvas);
  const gl = canvas.getContext("webgl2", { alpha: true, premultipliedAlpha: false, antialias: false });
  if (!gl) throw new Error("此瀏覽器不支援 WebGL2，Shader Park 需要 WebGL2 才能執行。");
  const LIM = Math.min(4096, ...gl.getParameter(gl.MAX_VIEWPORT_DIMS));
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, minimalVertexSource);
  gl.compileShader(vs);
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, TRI, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const setU = (loc, type, v) => {
    if (!loc || v == null) return;
    if (type === "float") gl.uniform1f(loc, v);
    else if (type === "vec2") gl.uniform2fv(loc, v);
    else if (type === "vec3") gl.uniform3fv(loc, v);
  };

  const r = {
    canvas, gl, info: null, prog: null, loc: {}, values: {}, scale: 1,
    time: 0, speed: 1, playing: true, mouse: [0, 0, -0.5], target: [0, 0], hover: false, idle: null, onFrame: null,
    // Compile a sculpture; throws (and keeps the previous program) when JS or GLSL fails.
    load(src, { keep = false } = {}) {
      const info = compileSculpture(src);
      const t0 = performance.now();
      const fs = gl.createShader(gl.FRAGMENT_SHADER);
      gl.shaderSource(fs, info.frag);
      gl.compileShader(fs);
      if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) {
        const log = (gl.getShaderInfoLog(fs) || "").trim().split("\n")[0];
        gl.deleteShader(fs);
        throw new Error(`GLSL 編譯失敗：${log}`);
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, vs);
      gl.attachShader(prog, fs);
      gl.bindAttribLocation(prog, 0, "coordinates");
      gl.linkProgram(prog);
      gl.deleteShader(fs);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        const log = (gl.getProgramInfoLog(prog) || "").trim().split("\n")[0];
        gl.deleteProgram(prog);
        throw new Error(`著色器連結失敗：${log}`);
      }
      info.glMs = performance.now() - t0;
      if (r.prog) gl.deleteProgram(r.prog);
      // Keep slider values across recompiles unless the declared default changed.
      const prevDefault = Object.fromEntries((r.info ? r.info.inputs : []).map((u) => [u.name, u.value]));
      const old = r.values;
      r.values = {};
      for (const u of info.inputs) r.values[u.name] = keep && u.name in old && prevDefault[u.name] === u.value ? old[u.name] : u.value;
      r.prog = prog;
      r.info = info;
      r.loc = Object.fromEntries(info.uniforms.map((u) => [u.name, gl.getUniformLocation(prog, u.name)]));
      return info;
    },
    resize() {
      const px = (dpr ? DPR() : 1) * r.scale;
      const w = Math.max(1, Math.min(LIM, Math.round(host.clientWidth * px)));
      const hh = Math.max(1, Math.min(LIM, Math.round(host.clientHeight * px)));
      if (canvas.width !== w || canvas.height !== hh) { canvas.width = w; canvas.height = hh; }
    },
    draw() {
      if (!r.prog) return;
      const w = canvas.width, hh = canvas.height;
      gl.viewport(0, 0, w, hh);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.useProgram(r.prog);
      const vals = { time: r.time, opacity: 1, _scale: 1, mouse: r.mouse, stepSize: 0.85, resolution: [w, hh], ...r.values };
      for (const u of r.info.uniforms) setU(r.loc[u.name], u.type, vals[u.name]);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
  };

  if (pointer) {
    // Same mapping as the library's minimal renderer: x, y in [-1, 1], y up.
    const aim = (e) => {
      const b = canvas.getBoundingClientRect();
      r.target = [(2 * (e.clientX - b.left)) / b.width - 1, 2 * (1 - (e.clientY - b.top) / b.height) - 1];
      r.hover = true;
    };
    ctx.on(canvas, "pointermove", aim);
    ctx.on(canvas, "pointerdown", aim);
    ctx.on(canvas, "pointerleave", () => { r.hover = false; });
  }
  ctx.on(canvas, "webglcontextlost", (e) => {
    e.preventDefault();
    if (ctx.active) ctx.status("").error("WebGL 內容遺失（GPU 負載過重或被系統回收），切到別的場景再回來即可重建。");
  });
  const ro = new ResizeObserver(() => r.resize());
  ro.observe(host);
  ctx.onCleanup(() => {
    ro.disconnect();
    if (r.prog) gl.deleteProgram(r.prog);
    gl.deleteShader(vs);
    gl.deleteBuffer(buf);
    gl.deleteVertexArray(vao);
    const lose = gl.getExtension("WEBGL_lose_context");
    if (lose) lose.loseContext();
  });
  r.resize();
  ctx.raf((t, dt) => {
    if (r.playing) r.time += (dt / 1000) * r.speed;
    const tgt = r.hover ? r.target : r.idle ? r.idle(r.time) : [0, 0];
    const k = 1 - Math.exp(-dt / 110);
    r.mouse = [r.mouse[0] + (tgt[0] - r.mouse[0]) * k, r.mouse[1] + (tgt[1] - r.mouse[1]) * k, -0.5];
    if (r.onFrame) r.onFrame(dt);
    r.draw();
  });
  return r;
}

// One slider per input() the sculpture declared, plus a compile-cost line.
function buildKnobs(box, r, labels = {}, hidden = []) {
  box.textContent = "";
  for (const u of r.info.inputs) {
    if (hidden.includes(u.name)) continue;
    const out = h("span");
    const inp = h("input", { type: "range", min: u.min, max: u.max, step: (u.max - u.min) / 100, value: r.values[u.name] });
    const show = () => (out.textContent = (+inp.value).toFixed(2));
    inp.addEventListener("input", () => { r.values[u.name] = +inp.value; show(); });
    show();
    box.append(h("label", { class: "sp-row", title: `let ${u.name} = input(…)` }, h("span", { text: labels[u.name] || u.name }), inp, out));
  }
  box.append(h("div", { class: "sp-meta", text: compileLine(r.info) }));
}

function highlight(src) {
  const esc = src.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  return esc
    .replace(/\b(let|for)\b/g, '<span class="hl-k">$1</span>')
    .replace(/\b(input)\(/g, '<span class="hl-in">$1</span>(')
    .replace(/\b([a-zA-Z][a-zA-Z0-9]*)\(/g, (m, name) => (name === "span" ? m : `<span class="hl-f">${name}</span>(`))
    .replace(/(?<![\w.#-])(\d+(?:\.\d+)?)/g, '<span class="hl-n">$1</span>');
}

// Screen px -> sculpture space on the z = 0 plane (camera at z = -2, view height 1.75 units).
const toWorld = (x, y, w, hh) => [(x / w - 0.5) * 1.75 * (w / hh), (0.5 - y / hh) * 1.75];

// Column count that gives the biggest square cell; rows are centred. Returns cell centres in px.
function gridCells(n, w, hh, top, bottom) {
  const H = Math.max(1, hh - top - bottom);
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const size = Math.min(w / cols, H / rows);
    if (!best || size > best.size) best = { cols, rows, size };
  }
  const { cols, rows, size } = best;
  const cw = w / cols, ch = H / rows;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / cols), inRow = Math.min(cols, n - row * cols);
    pts.push({ x: w / 2 + ((i % cols) - (inRow - 1) / 2) * cw, y: top + (row + 0.5) * ch });
  }
  return { pts, size, rows, cw };
}
// Tags drop the signature and keep only the Chinese name when their grid cell is too narrow.
const addTag = (host, zh, sig) => { const t = h("div", { class: "sp-tag" }, h("b", { text: zh }), h("span", { class: "sp-sig", text: sig })); host.append(t); return t; };
function placeTag(tag, x, y, w, hh, room = w) {
  tag.classList.remove("sp-short");
  if (tag.offsetWidth > room - 6) tag.classList.add("sp-short");
  const tw = tag.offsetWidth, th = tag.offsetHeight;
  tag.style.left = `${Math.min(w - tw / 2 - 4, Math.max(tw / 2 + 4, x))}px`;
  tag.style.top = `${Math.min(hh - th - 4, Math.max(4, y))}px`;
}

// ---------- 1. original presets ----------
const PRESETS = [
  { name: "噪波金屬球", note: "noise 位移 + boxFrame 混合", code: `setMaxIterations(48);
let morph = input(0.3, 0, 1);
let bumps = input(0.6, 0, 1);
let hue = input(0.58, 0, 1);
let s = getSpace();
let r = getRayDirection();
let n1 = noise(r * 3.0 + vec3(0, 0, time * 0.12));
let n = noise(s * 3.0 + vec3(0, 0, time * 0.25) + n1);
backgroundColor(vec3(0.3, 0.35, 0.6));
metal(n * 0.5 + 0.5);
shine(n * 0.5 + 0.5);
color(hsv2rgb(vec3(hue + n * 0.15, 0.85, 0.7)) + normal * 0.1);
rotateY(time * 0.3 + mouse.x * 1.5);
rotateX(mouse.y * 1.2);
boxFrame(vec3(0.46), abs(n) * 0.05 + 0.012);
mixGeo(morph);
sphere(0.42 + n * bumps * 0.12);` },
  { name: "黏土融合", note: "blend() 平滑聯集", code: `setMaxIterations(48);
let goo = input(0.14, 0, 0.3);
let speed = input(0.8, 0, 2);
let hue = input(0.9, 0, 1);
backgroundColor(vec3(0.4, 0.3, 0.45));
rotateX(0.9 + mouse.y);
rotateY(mouse.x * 1.5);
shine(0.7);
color(hsv2rgb(vec3(hue, 0.75, 0.85)));
torus(0.34, 0.07);
blend(goo);
for (let i = 0; i < 4; i++) {
  let a = time * speed + i * 1.5708;
  let p = vec3(cos(a) * 0.34, sin(a * 2.0) * 0.16, sin(a) * 0.34);
  displace(p);
  color(hsv2rgb(vec3(hue + i * 0.07, 0.8, 0.9)));
  sphere(0.1);
  displace(p * -1.0);
}` },
  { name: "碎形晶體", note: "mirrorXYZ() 摺疊 + 旋轉", code: `setMaxIterations(56);
let fold = input(0.16, 0.1, 0.22);
let twist = input(0.35, 0, 1);
let hue = input(0.12, 0, 1);
backgroundColor(vec3(0.35, 0.3, 0.5));
rotateY(time * 0.2 + mouse.x * 1.5);
rotateX(time * 0.13 + mouse.y);
let s = getSpace();
metal(0.75);
shine(0.85);
color(hsv2rgb(vec3(hue + length(s) * 0.6, 0.85, 0.8)));
let size = fold;
for (let i = 0; i < 3; i++) {
  mirrorXYZ();
  displace(size);
  rotateZ(twist + sin(time * 0.5) * 0.15);
  rotateX(twist * 0.6);
  size = size * 0.5;
}
box(vec3(size * 1.3));` },
];
const LABELS = {
  morph: "框球混合", bumps: "起伏", hue: "色相", goo: "黏稠度", speed: "公轉速度", fold: "摺疊間距", twist: "扭轉",
  gap: "間距", tilt: "傾斜", count: "數量", lift: "起伏", turn: "旋轉", amount: "扭轉量", amp: "振幅", freq: "頻率",
  size: "尺寸", holes: "孔徑",
};

// ---------- 2. primitives ----------
const PRIMS = [
  { zh: "球", sig: "sphere(r)", col: [0.97, 0.8, 0.2], code: "sphere(0.5 * k);" },
  { zh: "方塊", sig: "box(x, y, z)", col: [0.3, 0.75, 0.95], code: "box(0.36 * k, 0.36 * k, 0.36 * k);" },
  { zh: "圓環", sig: "torus(R, r)", col: [0.97, 0.3, 0.55], code: "rotateX(1.1);\n  torus(0.4 * k, 0.13 * k);" },
  { zh: "圓柱", sig: "cylinder(r, h)", col: [0.5, 0.85, 0.55], code: "cylinder(0.3 * k, 0.38 * k);" },
  { zh: "框線", sig: "boxFrame(b, e)", col: [1, 0.6, 0.3], code: "boxFrame(vec3(0.38 * k), 0.05 * k);" },
  { zh: "線段", sig: "line(a, b, r)", col: [0.65, 0.58, 1], code: "line(vec3(-0.34 * k, -0.34 * k, 0), vec3(0.34 * k, 0.34 * k, 0), 0.12 * k);" },
  { zh: "圓錐", sig: "roundCone(a, b, r1, r2)", col: [0.4, 0.9, 0.85], code: "roundCone(vec3(0, -0.3 * k, 0), vec3(0, 0.36 * k, 0), 0.26 * k, 0.07 * k);" },
  { zh: "鏈環", sig: "link(le, r1, r2)", col: [0.92, 0.92, 0.88], code: "rotateX(0.9);\n  link(0.2 * k, 0.26 * k, 0.09 * k);" },
];
const primSource = () => [
  "setMaxIterations(64);",
  "let k = input(0.3, 0.05, 1);",
  "let bevel = input(0, 0, 0.12);",
  "let ang = input(0, 0, 7);",
  "let nrm = input(0, 0, 1);",
  "lightDirection(-0.4, 0.8, -0.6);",
  ...PRIMS.map((p, i) => [
    `let px${i} = input(0, -9, 9);`,
    `let py${i} = input(0, -9, 9);`,
    "shape(() => {",
    `  displace(px${i}, py${i}, 0);`,
    `  rotateY(ang + ${(i * 0.7).toFixed(1)});`,
    "  rotateX(0.35);",
    `  color(mix(vec3(${p.col.join(", ")}), normal * 0.5 + 0.5, nrm));`,
    "  shine(0.6);",
    `  ${p.code}`,
    "  expand(bevel * k);",
    "})();",
  ].join("\n")),
].join("\n");

// ---------- 3. boolean ops ----------
const OPS = [
  { zh: "聯集", sig: "union()", op: "union();" },
  { zh: "差集", sig: "difference()", op: "difference();" },

// Code panel + knob panel layout shared by scenes 1 and 4.
function labScene(ctx, list, intro) {
  ctx.html(`<div class="sp-stage sp-bg"><div class="sp-code panel"><h2></h2><pre></pre></div><div class="sp-knobs panel"></div></div>`);
  const r = createRenderer(ctx, ctx.$(".sp-stage"));
  const show = (i) => {
    const p = list[i];
    r.load(p.code);
    ctx.$(".sp-code h2").innerHTML = `${p.name}<small>${p.note}${intro ? `・${intro}` : ""}</small>`;
    ctx.$(".sp-code pre").innerHTML = highlight(p.code);
    buildKnobs(ctx.$(".sp-knobs"), r, LABELS);
  };
  ctx.group(list.map((p) => p.name), 0, show);
  show(0);
  return r;
}

    },
    {
      id: "stress",
      title: "極限測試",
      kind: "stress",
      api: "canvas 解析度 × MAX_ITERATIONS",
      desc: "光線步進的成本約等於像素數乘上每像素的步數：逐級放大繪圖緩衝的解析度倍率，看 FPS 何時跌破 30。",
      hint: "按「自動加壓」開始",
      mount(ctx) {
        ctx.html(`<div class="sp-stress sp-bg"><div class="sp-badge panel"><b>×1</b><span></span></div></div>`);
        const host = ctx.$(".sp-stress"), badgeN = ctx.$(".sp-badge b"), badgeInfo = ctx.$(".sp-badge span");
        ctx.controls.classList.add("bottom");
        const r = createRenderer(ctx, host, { dpr: false });
        let iters = 96, refl = 0;
        const compile = () => r.load(stressSource(iters, refl), { keep: true });
        compile();
        const paint = () => {
          const { width: w, height: hh } = r.canvas;
          badgeN.textContent = `×${r.scale}`;
          badgeInfo.textContent = `${w}×${hh} px・${((w * hh) / 1e6).toFixed(2)} MP・每像素最多 ${iters * (1 + refl)} 步`;
        };
        ctx.select("最大步數", [48, 96, 192, 384].map((n) => ({ value: String(n), label: `${n} 步` })), "96", (v) => { iters = +v; compile(); paint(); });
        ctx.toggle("反射 1 次", false, (v) => { refl = v ? 1 : 0; compile(); paint(); });
        ctx.interval(paint, 500);
        ctx.ramp({
          label: "解析度倍率",
          steps: [0.25, 0.5, 0.75, 1, 1.5, 2, 3],
          initial: 3,
          format: (n) => `×${n}`,
          async apply(n) {
            r.scale = n;
            r.resize();
            paint();
            await ctx.frame(2);
          },
          metrics: () => {
            const { width: w, height: hh } = r.canvas;
            return { "繪圖緩衝": `${w}×${hh}`, "百萬像素": ((w * hh) / 1e6).toFixed(2), "步進上限/幀": fmtCompact(w * hh * iters * (1 + refl)) };
          },
          note: "倍率是每個 CSS 像素對應幾個繪圖像素，倍率加倍時像素數變四倍。每個像素沿光線最多走「最大步數」次距離場，所以成本約為像素數乘步數。軟體算圖（SwiftShader）會比實體 GPU 早很多掉幀。",
        });
      },
    },
  ],
});
</script>
</body>
</html>
