<style>
  :root { --sj-g: #1d6f42; --sj-g2: #e5f2ea; }
  .sj-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .sj-book { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #fff; }
  .sj-fx { flex: none; display: flex; align-items: center; border-bottom: 1px solid var(--line); font: 13px var(--mono); }
  .sj-fx .ref { width: 64px; padding: 5px 8px; border-right: 1px solid var(--line); color: var(--muted); text-align: center; }
  .sj-fx i { padding: 5px 9px; color: var(--sj-g); font-weight: 700; border-right: 1px solid var(--line); }
  .sj-fx .v { padding: 5px 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sj-tabs { flex: none; display: flex; gap: 2px; padding: 5px 8px 0; background: #ecebe5; border-bottom: 1px solid var(--line); align-items: flex-end; overflow: hidden; }
  .sj-tabs button { flex: none; border: 1px solid var(--line); border-bottom: 0; background: #dddcd6; padding: 4px 12px; border-radius: 6px 6px 0 0; font: 13px var(--font); cursor: pointer; color: var(--muted); }
  .sj-tabs button[aria-pressed="true"] { background: #fff; color: var(--sj-g); font-weight: 700; box-shadow: inset 0 3px 0 var(--sj-g); }
  .sj-grid { flex: 1; min-height: 0; overflow: auto; position: relative; background: #fff; }
  .sj-t { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .sj-t th, .sj-t td { border: 1px solid #e1e0da; padding: 4px 9px; white-space: nowrap; }
  .sj-t thead th { position: sticky; top: 0; z-index: 2; background: #f1f0eb; color: var(--muted); font: 500 11.5px var(--mono); text-align: center; }
  .sj-t tbody th { position: sticky; left: 0; z-index: 1; background: #f1f0eb; color: var(--muted); font: 500 11.5px var(--mono); text-align: center; min-width: 32px; }
  .sj-t thead th:first-child { left: 0; z-index: 3; }
  .sj-t td { cursor: cell; user-select: none; }
  .sj-t td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .sj-t td.f { background: #f1faf4; }
  .sj-t td.hdr { font-weight: 700; background: #fafaf7; }
  .sj-t td.sel { outline: 2px solid var(--sj-g); outline-offset: -2px; }
  .sj-t td.in { background: #d6ecdf; }
  .sj-t td.code { font: 12px var(--mono); color: #6a3d9a; }
  .sj-t td.neg { color: #c8372d; }
  .sj-drop { position: absolute; inset: 0; display: none; place-items: center; background: rgba(29, 111, 66, .12); border: 3px dashed var(--sj-g); font-size: 17px; color: var(--sj-g); font-weight: 700; z-index: 10; }
  .sj-grid.drag .sj-drop { display: grid; }
  .sj-meta { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sj-meta b { color: var(--fg); }
  .sj-meta .n, .sj-cap .n { font: 600 12px var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
  .sj-meta em { font-style: normal; color: #b4561a; }
  .sj-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 330px); gap: 8px; }
  .sj-split.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .sj-side { min-height: 0; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
  .sj-cap { flex: none; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); background: #fbfaf7; }
  .sj-cap b { color: var(--fg); }
  .sj-cap code { font: 11.5px var(--mono); color: #6a3d9a; }
  .sj-pre { flex: 1; min-height: 0; overflow: auto; margin: 0; padding: 8px 10px; font: 11.5px/1.6 var(--mono); white-space: pre; color: #24504b; }
  .sj-pre .k { color: #6a3d9a; }
  .sj-pre .c { color: #8a877d; }
  .sj-side .sj-grid { flex: 1 1 0; }
  .sj-side .sj-pre.half { flex: 0 1 auto; max-height: 42%; border-top: 1px solid var(--line); background: #fbfaf7; }
  .sj-bars { flex: 1; min-height: 0; overflow: auto; }
  .sj-bar { display: grid; grid-template-columns: 44px minmax(0, 1fr) 70px; gap: 1px 8px; align-items: center; padding: 5px 10px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12px; }
  .sj-bar[aria-pressed="true"] { background: var(--sj-g2); }
  .sj-bar b { font: 600 12px var(--mono); }
  .sj-bar .tr { height: 10px; background: #eeede8; border-radius: 5px; overflow: hidden; }
  .sj-bar .tr i { display: block; height: 100%; background: var(--sj-g); border-radius: 5px; }
  .sj-bar .sz { font: 12px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
  .sj-bar small { grid-column: 2 / 4; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sj-src { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .sj-src th, .sj-src td { border: 1px solid #d9d7cf; padding: 5px 9px; white-space: nowrap; }
  .sj-src th { background: #f1f0eb; font-weight: 600; }
  .sj-src td[contenteditable] { font-family: var(--mono); text-align: right; outline: none; }
  .sj-src td[contenteditable]:focus { background: #fff8d6; }
  .sj-out table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  .sj-out td { border: 1px solid #e1e0da; padding: 5px 9px; white-space: nowrap; }
  .sj-out td[data-t="n"] { text-align: right; font-family: var(--mono); color: #1f5f9e; }
  .sj-out td[colspan], .sj-out td[rowspan] { background: var(--sj-g2); font-weight: 600; text-align: center; }
  .sj-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; display: flex; flex-direction: column; gap: 8px; }
  .sj-res { flex: none; border-collapse: collapse; font-size: 12px; background: #fff; border: 1px solid var(--line); }
  .sj-res th { font: 600 11.5px var(--font); color: var(--muted); background: #f4f3ee; text-align: right; padding: 4px 8px; }
  .sj-res td { font: 12px var(--mono); text-align: right; padding: 3px 8px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
  .sj-res th:first-child, .sj-res td:first-child { text-align: left; }
  .sj-res td.zh { font-family: var(--font); }
  @media (max-width: 760px) { .sj-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); } }
  @media (max-width: 640px) {
    .sj-split, .sj-split.even { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
    .sj-hide-n { display: none; }
  }
</style>

<body>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const U = XLSX.utils;
const { fmt, fmtMs } = Showcase;
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "新竹市"];
const COURSES = ["資料視覺化", "Node.js 實戰", "AI 工具應用", "前端動畫"];
const NAMES = ["林怡君", "陳冠宇", "張雅婷", "王柏翰", "李佳穎", "黃子軒", "吳欣怡", "劉承恩", "蔡佩珊", "楊宗翰"];
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bytesText = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);
const pad = (n, w = 2) => String(n).padStart(w, "0");

// Render a worksheet as an Excel-like grid (column letters + row numbers).
function drawSheet(table, ws, { maxR = 300, maxC = 26, hdr = true } = {}) {
  if (!ws || !ws["!ref"]) { table.innerHTML = ""; return null; }
  const R = U.decode_range(ws["!ref"]);
  const er = Math.min(R.e.r, R.s.r + maxR - 1), ec = Math.min(R.e.c, R.s.c + maxC - 1);
  let s = "<thead><tr><th></th>";
  for (let c = R.s.c; c <= ec; c++) s += `<th>${U.encode_col(c)}</th>`;
  s += "</tr></thead><tbody>";
  for (let r = R.s.r; r <= er; r++) {
    s += `<tr><th>${U.encode_row(r)}</th>`;
    for (let c = R.s.c; c <= ec; c++) {
      const a = U.encode_cell({ r, c }), cell = ws[a];
      if (!cell) { s += `<td data-a="${a}"></td>`; continue; }
      const cls = [cell.t === "n" || cell.t === "d" ? "num" : "", cell.f ? "f" : "", hdr && r === R.s.r ? "hdr" : ""].join(" ").trim();
      s += `<td data-a="${a}" class="${cls}">${esc(cell.w ?? U.format_cell(cell))}</td>`;
    }
    s += "</tr>";
  }
  table.innerHTML = s + "</tbody>";
  return R;
}

// Two-sheet sample workbook: a formula summary and a roster with dates and currency formats.
function makeBook() {
  const book = U.book_new();
  const rows = CITIES.map((c) => { const q = [0, 0, 0, 0].map(() => rnd(20, 160)); return [c, ...q, q.reduce((s, x) => s + x, 0)]; });
  const last = rows.length + 1;
  const sumCol = (j) => rows.reduce((s, r) => s + r[j], 0);
  const ws1 = U.aoa_to_sheet([
    ["縣市（示意資料）", "第一季", "第二季", "第三季", "第四季", "合計"],
    ...rows.map((r, i) => [...r.slice(0, 5), { t: "n", v: r[5], f: `SUM(B${i + 2}:E${i + 2})` }]),
    ["總計", ..."BCDEF".split("").map((col, k) => ({ t: "n", v: sumCol(k + 1), f: `SUM(${col}2:${col}${last})` }))],
  ]);
  ws1["!cols"] = [{ wch: 16 }, { wch: 8 }, { wch: 8 }, { wch: 8 }, { wch: 8 }, { wch: 9 }];
  U.book_append_sheet(book, ws1, "報名統計");
  const roster = NAMES.map((n, i) => ({ 姓名: n, 縣市: pick(CITIES), 課程: COURSES[i % COURSES.length], 報名日期: new Date(2026, rnd(0, 8), rnd(1, 28)), 費用: pick([3600, 4800, 5200, 6800]) }));
  const ws2 = U.json_to_sheet(roster, { cellDates: true });
  for (let r = 2; r <= roster.length + 1; r++) { ws2[`D${r}`].z = "yyyy-mm-dd"; ws2[`E${r}`].z = '"NT$"#,##0'; }
  ws2["!cols"] = [{ wch: 8 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 10 }];
  U.book_append_sheet(book, ws2, "學員名單");
  return book;
}

Showcase.run({ scenes: [
  // ---------- 1: the original round-trip viewer ----------
  {
    id: "roundtrip", title: "報名統計往返", paper: true,
    api: "XLSX.write(wb, { bookType, type: \"array\" }) → XLSX.read(bytes, { cellFormula, cellNF })",
    desc: "在記憶體建立兩個工作表的活頁簿，寫成真正的檔案位元組再讀回來顯示，畫面就是檔案內容。切到 CSV 會看到只剩第一個工作表、公式也不見了。",
    hint: "點儲存格看公式・可拖曳自己的試算表進來・「下載」才會存檔",
    mount(ctx) {
      ctx.html(`<div class="sj-wrap"><div class="sj-book">
        <div class="sj-fx"><span class="ref">A1</span><i>fx</i><span class="v"></span></div>
        <div class="sj-tabs"></div>
        <div class="sj-grid"><div class="sj-drop">放開以匯入試算表</div><table class="sj-t"></table></div>
      </div><div class="sj-meta"></div><input type="file" hidden accept=".xlsx,.xls,.xlsb,.ods,.csv,.numbers"></div>`);
      const tabs = ctx.$(".sj-tabs"), grid = ctx.$(".sj-grid"), table = ctx.$(".sj-t"), meta = ctx.$(".sj-meta"), input = ctx.$("input[type=file]");
      let bookType = "xlsx", source = makeBook(), wb = null, active = 0;
      const select = (td) => {
        if (!td) return;
        ctx.$$("td.sel", table).forEach((x) => x.classList.remove("sel"));
        td.classList.add("sel");
        const cell = wb.Sheets[wb.SheetNames[active]][td.dataset.a];
        ctx.$(".sj-fx .ref").textContent = td.dataset.a;
        ctx.$(".sj-fx .v").textContent = cell ? (cell.f ? `=${cell.f}` : String(cell.v)) : "";
      };
      const show = () => {
        tabs.innerHTML = wb.SheetNames.map((n, i) => `<button type="button" data-i="${i}" aria-pressed="${i === active}">${esc(n)}</button>`).join("");
        drawSheet(table, wb.Sheets[wb.SheetNames[active]]);
        select(table.querySelector("td.f") || table.querySelector("tbody td"));
      };
      const roundTrip = () => {
        const t0 = performance.now();
        const bytes = XLSX.write(source, { bookType, type: "array" });
        wb = XLSX.read(bytes, { type: "array", cellFormula: true, cellNF: true });
        meta.innerHTML = `<b>報名統計.${bookType}</b>・<span class="n">${bytesText(bytes.byteLength)}</span>・${wb.SheetNames.length} 個工作表・寫入加讀回 <span class="n">${fmtMs(performance.now() - t0)}</span>${bookType === "csv" ? "・<em>CSV 只存第一個工作表的值</em>" : ""}`;
        active = 0;
        show();
      };
      const importFile = async (f) => {
        try {
          const t0 = performance.now();
          wb = XLSX.read(await f.arrayBuffer(), { cellFormula: true, cellNF: true });
          meta.innerHTML = `<b>${esc(f.name)}</b>・<span class="n">${bytesText(f.size)}</span>・${wb.SheetNames.length} 個工作表・解析 <span class="n">${fmtMs(performance.now() - t0)}</span>`;
          active = 0;
          show();
        } catch (err) {
          meta.innerHTML = `<em>無法讀取 ${esc(f.name)}：${esc(err.message)}</em>`;
        }
      };
      ctx.on(tabs, "click", (e) => { const b = e.target.closest("button"); if (b) { active = +b.dataset.i; show(); } });
      ctx.on(table, "click", (e) => select(e.target.closest("td")));
      ctx.on(input, "change", () => input.files[0] && importFile(input.files[0]));
      ctx.on(grid, "dragover", (e) => { e.preventDefault(); grid.classList.add("drag"); });
      ctx.on(grid, "dragleave", (e) => { if (e.target === grid || e.target.classList.contains("sj-drop")) grid.classList.remove("drag"); });
      ctx.on(grid, "drop", (e) => { e.preventDefault(); grid.classList.remove("drag"); const f = e.dataTransfer.files[0]; if (f) importFile(f); });
      ctx.group(["xlsx", "ods", "csv"], 0, (i, l) => { bookType = l; roundTrip(); });
      ctx.button("換一組資料", () => { source = makeBook(); roundTrip(); });
      ctx.button("匯入", () => input.click());
      ctx.button("下載", () => XLSX.writeFile(source, `報名統計.${bookType}`, { bookType }), { primary: true });
      roundTrip();
    },
  },

  // ---------- 2: aoa / json conversions ----------
  {
    id: "json", title: "陣列與物件互轉", paper: true,
    api: "json_to_sheet(rows, { header }) ・ sheet_add_aoa(ws, aoa, { origin: -1 }) ・ sheet_to_json(ws, { header, defval })",
    desc: "物件陣列轉成工作表，再用不同 header 選項讀回 JS：預設是以第一列當鍵的物件，header: 1 是二維陣列，header: \"A\" 用欄字母當鍵。附加的列缺欄位時，defval 決定要不要補空值。",
    hint: "切換讀回選項，或按「附加一列」看 sheet_add_aoa",
    mount(ctx) {
      ctx.html(`<div class="sj-wrap"><div class="sj-split">
        <div class="sj-book"><div class="sj-cap"><b>工作表</b><code class="ref"></code></div><div class="sj-grid"><table class="sj-t"></table></div></div>
        <div class="sj-side"><div class="sj-cap"><b>sheet_to_json 輸出</b><span class="cnt"></span></div><pre class="sj-pre"></pre></div>
      </div></div>`);
      const base = [
        { 課程: "資料視覺化", 講師: "林怡君", 時數: 12, 報名: 38 },
        { 課程: "Node.js 實戰", 講師: "陳冠宇", 時數: 18, 報名: 26 },
        { 課程: "AI 工具應用", 講師: "張雅婷", 時數: 9, 報名: 64 },
        { 課程: "前端動畫", 講師: "王柏翰", 時數: 15, 報名: 31 },
      ];
      const OPTS = [{}, { header: 1 }, { header: "A" }, { defval: "" }];
      const extra = [["樂齡手機課", "李佳穎", 6], ["Excel 自動化", "黃子軒", 12], ["影片剪輯", "吳欣怡", 10]];
      let ws, mode = 0, added = 0;
      const build = () => {
        ws = U.json_to_sheet(base, { header: ["課程", "講師", "時數", "報名"] });
        for (let i = 0; i < added; i++) U.sheet_add_aoa(ws, [extra[i]], { origin: -1 });
        render();
      };
      const render = () => {
        drawSheet(ctx.$(".sj-t"), ws);
        ctx.$(".ref").textContent = `!ref = ${ws["!ref"]}`;
        const out = U.sheet_to_json(ws, OPTS[mode]);
        const arg = JSON.stringify(OPTS[mode]).replace(/"(\w+)":/g, "$1: ").replace(/,/g, ", ");
        ctx.$(".cnt").textContent = `${out.length} 筆`;
        ctx.$(".sj-pre").innerHTML = `<span class="c">// U.sheet_to_json(ws${mode ? ", " + esc(arg) : ""})</span>\n[\n${out.map((o) => "  " + esc(JSON.stringify(o))).join(",\n")}\n]`;
      };
      ctx.group(["預設", "header: 1", "header: \"A\"", "defval: \"\""], 0, (i) => { mode = i; render(); });
      ctx.button("附加一列", () => { added = (added + 1) % (extra.length + 1); build(); });
      build();
    },
  },

  // ---------- 3: addresses and ranges ----------
  {
    id: "address", title: "儲存格位址與範圍", paper: true,
    api: "encode_cell({ r, c }) ・ decode_cell(\"B3\") ・ encode_range(s, e) ・ decode_range(ws[\"!ref\"])",
    desc: "SheetJS 的工作表是一個以 A1 位址為鍵的物件。拖曳選取範圍，右側即時顯示位址與 0 起算列欄索引之間的轉換，並用 decode_range 走訪範圍內每一格加總。",
    hint: "在表格上拖曳選取範圍；手機可按「隨機範圍」",
    mount(ctx) {
      ctx.html(`<div class="sj-wrap"><div class="sj-split">
        <div class="sj-book"><div class="sj-grid"><table class="sj-t"></table></div></div>
        <div class="sj-side"><div class="sj-cap"><b>位址工具輸出</b><code>ws["!ref"] = "A1:G13"</code></div><pre class="sj-pre"></pre></div>
      </div></div>`);
      const aoa = [["月份", "臺北", "新北", "桃園", "臺中", "臺南", "高雄"]];
      for (let m = 1; m <= 12; m++) aoa.push([`${m} 月`, ...Array.from({ length: 6 }, () => rnd(10, 99))]);
      const ws = U.aoa_to_sheet(aoa);
      const table = ctx.$(".sj-t");
      drawSheet(table, ws);
      let a = { r: 2, c: 1 }, b = { r: 6, c: 3 }, dragging = false;
      const obj = (o) => `{ c: ${o.c}, r: ${o.r} }`;
      const paint = () => {
        const s = { r: Math.min(a.r, b.r), c: Math.min(a.c, b.c) }, e = { r: Math.max(a.r, b.r), c: Math.max(a.c, b.c) };
        const ref = U.encode_range(s, e), R = U.decode_range(ref);
        let sum = 0, nums = 0, cells = 0;
        for (let r = R.s.r; r <= R.e.r; r++) for (let c = R.s.c; c <= R.e.c; c++) {
          cells++;
          const cell = ws[U.encode_cell({ r, c })];
          if (cell && cell.t === "n") { sum += cell.v; nums++; }
        }
        ctx.$$("td", table).forEach((td) => {
          const p = U.decode_cell(td.dataset.a);
          td.classList.toggle("in", p.r >= s.r && p.r <= e.r && p.c >= s.c && p.c <= e.c);
        });
        const first = U.encode_cell(s);
        ctx.$(".sj-pre").innerHTML = [
          `<span class="c">// 起點（0 起算）</span>`, `U.encode_cell(${obj(s)})`, `  <span class="k">→ "${first}"</span>`,
          `U.decode_cell("${first}")`, `  <span class="k">→ ${obj(U.decode_cell(first))}</span>`,
          `<span class="c">// 範圍</span>`, `U.encode_range(s, e)`, `  <span class="k">→ "${ref}"</span>`,
          `U.decode_range("${ref}")`, `  <span class="k">→ { s: ${obj(R.s)},</span>`, `  <span class="k">    e: ${obj(R.e)} }</span>`,
          `U.encode_col(${R.e.c}) + U.encode_row(${R.e.r})`, `  <span class="k">→ "${U.encode_col(R.e.c)}" + "${U.encode_row(R.e.r)}"</span>`,
          `<span class="c">// 走訪範圍</span>`, `儲存格 ${cells}，數值 ${nums}`, `加總 <span class="k">${fmt(sum)}</span>`,
        ].join("\n");
      };
      const at = (ev) => { const td = ev.target.closest("td"); return td ? U.decode_cell(td.dataset.a) : null; };
      ctx.on(table, "pointerdown", (ev) => { const p = at(ev); if (!p) return; a = b = p; dragging = true; paint(); });
      ctx.on(table, "pointerover", (ev) => { if (!dragging) return; const p = at(ev); if (p) { b = p; paint(); } });
      ctx.on(window, "pointerup", () => { dragging = false; });
      ctx.button("隨機範圍", () => {
        a = { r: rnd(0, 8), c: rnd(0, 4) };
        b = { r: Math.min(12, a.r + rnd(1, 4)), c: Math.min(6, a.c + rnd(1, 2)) };
        paint();
      });
      paint();
    },
  },

  // ---------- 4: formulas and number formats ----------
  {
    id: "format", title: "公式與數字格式", paper: true,
    api: "format_cell({ t: \"n\", v, z }) ・ { f: \"B2*C2\", v, z } ・ sheet_to_formulae(ws)",
    desc: "左邊同一組數值套上不同 Excel 格式碼 z，由 SheetJS 內建的 SSF 引擎排版。右邊是含公式的報價單：SheetJS 只存公式字串，不會重算，v 是寫入時自己給的快取值。",
    hint: "拖動「數量」滑桿：公式字串不變，快取值重新寫入",
    mount(ctx) {
      ctx.html(`<div class="sj-wrap"><div class="sj-split even">
        <div class="sj-book"><div class="sj-cap"><b>格式碼 z</b><span>同一個 v，不同顯示</span></div><div class="sj-grid"><table class="sj-t sj-fmt"></table></div></div>
        <div class="sj-side"><div class="sj-cap"><b>報價單</b><span class="sz"></span></div><div class="sj-grid"><table class="sj-t sj-inv"></table></div><pre class="sj-pre half"></pre></div>
      </div></div>`);
      const VALS = [1234567.891, 0.0725, -4321.5, 0];
      const CODES = ["General", "0", "#,##0", "#,##0.00", '"NT$"#,##0', "0.0%", "0.00E+00", "# ?/?", '#,##0.0,"K"', '#,##0;[Red](#,##0);"零"'];
      let s = `<thead><tr><th>格式碼 z</th>${VALS.map((v) => `<th>${v}</th>`).join("")}</tr></thead><tbody>`;
      for (const z of CODES) {
        s += `<tr><td class="code">${esc(z)}</td>`;
        for (const v of VALS) s += `<td class="num${v < 0 && z.includes("[Red]") ? " neg" : ""}">${esc(U.format_cell({ t: "n", v, z }))}</td>`;
        s += "</tr>";
      }
      ctx.$(".sj-fmt").innerHTML = s + "</tbody>";
      const NT = '"NT$"#,##0';
      const build = (qty) => {
        const items = [["Arduino 套件", 1280, qty], ["感測器包", 450, qty * 2], ["教材費", 600, 1]];
        const sub = items.map(([, p, q]) => p * q);
        const total = sub.reduce((x, y) => x + y, 0), tax = Math.round(total * 0.05);
        const money = (v, f) => ({ t: "n", v, f, z: NT });
        const ws = U.aoa_to_sheet([
          ["品項", "單價", "數量", "小計"],
          ...items.map(([n, p, q], i) => [n, { t: "n", v: p, z: NT }, q, money(sub[i], `B${i + 2}*C${i + 2}`)]),
          ["合計", "", "", money(total, "SUM(D2:D4)")],
          ["營業稅 5%", "", "", money(tax, "ROUND(D5*0.05,0)")],
          ["總額", "", "", money(total + tax, "D5+D6")],
        ]);
        const wb = U.book_new();
        U.book_append_sheet(wb, ws, "報價單");
        const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        const back = XLSX.read(bytes, { type: "array", cellFormula: true, cellNF: true }).Sheets["報價單"];
        drawSheet(ctx.$(".sj-inv"), back);
        ctx.$(".sz").innerHTML = `寫成 xlsx <span class="n">${bytesText(bytes.byteLength)}</span> 再讀回，D7 的 z = <code>${esc(back.D7.z)}</code>`;
        ctx.$(".sj-pre").innerHTML = `<span class="c">// U.sheet_to_formulae(ws)，只列 D 欄公式</span>\n` +
          U.sheet_to_formulae(back).filter((x) => /^D\d+=[^']/.test(x)).map(esc).join("\n");
      };
      ctx.slider("數量", { min: 1, max: 40, value: 6 }, build);
      build(6);
    },
  },

  // ---------- 5: dates and serial numbers ----------
  {
    id: "dates", title: "日期與序號", paper: true,
    api: "aoa_to_sheet(aoa, { cellDates: true }) ・ wb.Workbook.WBProps.date1904 ・ XLSX.read(b, { cellDates }) ・ SSF.parse_date_code(v)",
    desc: "Excel 把日期存成「從 1900 年起算的天數」，小數是一天中的時間。切到 1904 日期系統，同一天的序號少了 1462；1900-03-01 的序號是 61，因為 Excel 沿用 Lotus 把 1900 當閏年。",
    hint: "切換日期系統，比較檔案裡的序號與讀回的值",
    mount(ctx) {
      ctx.html(`<div class="sj-wrap"><div class="sj-book"><div class="sj-cap"><b>寫成 xlsx 再讀回</b><span class="sum"></span></div><div class="sj-grid"><table class="sj-t sj-dt"></table></div></div><div class="sj-meta">SheetJS 0.20 的日期格用 UTC 欄位存「牆上時間」，讀回時要用 getUTCHours() 這類方法取值，才不會被時區平移 8 小時；帶秒數的時間可能因序號的浮點誤差差 1 秒。</div></div>`);
      const EVENTS = [
        ["開課日", new Date(2026, 0, 1)], ["報名截止", new Date(2026, 1, 28, 13, 30)], ["期中發表", new Date(2026, 9, 11, 9, 5, 30)],
        ["千禧年", new Date(2000, 0, 1)], ["1904 起點隔天", new Date(1904, 0, 2)], ["1900-03-01", new Date(1900, 2, 1)],
      ];
      const wall = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const utcWall = (d) => d.toISOString().slice(0, 19).replace("T", " ");
      const run = (d1904) => {
        const ws = U.aoa_to_sheet([["事件", "日期"], ...EVENTS], { cellDates: true });
        for (let r = 2; r <= EVENTS.length + 1; r++) ws[`B${r}`].z = "yyyy-mm-dd hh:mm:ss";
        const wb = U.book_new();
        U.book_append_sheet(wb, ws, "日期");
        wb.Workbook = { WBProps: { date1904: d1904 } };
        const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        const raw = XLSX.read(bytes, { type: "array" }).Sheets["日期"];
        const asDate = XLSX.read(bytes, { type: "array", cellDates: true }).Sheets["日期"];
        let ok = 0, s = "<thead><tr><th>事件</th><th>原始 JS Date（本地）</th><th>檔案內序號 v</th><th>cell.w</th><th>parse_date_code</th><th>cellDates 讀回（UTC 欄位）</th><th>相符</th></tr></thead><tbody>";
        EVENTS.forEach(([name, d], i) => {
          const a = `B${i + 2}`, v = raw[a].v, p = XLSX.SSF.parse_date_code(v, { date1904: d1904 });
          const back = utcWall(asDate[a].v), same = back === wall(d);
          ok += same;
          s += `<tr><td>${name}</td><td class="num">${wall(d)}</td><td class="num">${v}</td><td class="num">${esc(raw[a].w)}</td><td class="num">${p.y}/${p.m}/${p.d} ${p.H}:${pad(p.M)}</td><td class="num">${back}</td><td>${same ? "✓" : "✗"}</td></tr>`;
        });
        ctx.$(".sj-dt").innerHTML = s + "</tbody>";
        ctx.$(".sum").innerHTML = `${d1904 ? "1904" : "1900"} 日期系統・<span class="n">${ok}/${EVENTS.length}</span> 筆讀回相符・<span class="n">${bytesText(bytes.byteLength)}</span>`;
      };
      ctx.group(["1900 日期系統", "1904 日期系統"], 0, (i) => run(i === 1));
      run(false);
    },
  },

  // ---------- 6: export formats compared ----------
  {
    id: "formats", title: "八種格式比大小", paper: true,
    api: "XLSX.write(wb, { bookType: \"xlsx\" | \"xlsb\" | \"xls\" | \"ods\" | \"fods\" | \"xlml\" | \"csv\" | \"html\", compression })",
    desc: "同一份名單寫成八種格式，比較檔案大小、寫入與讀回耗時，並確認每種格式讀回的列數相同。點任一格式看檔案開頭：文字格式直接顯示內容，zip 格式用 XLSX.CFB 列出裡面的 XML 檔。",
    hint: "點左側格式切換預覽；打開「壓縮」看 xlsx、ods 變小多少",
    mount(ctx) {
      ctx.html(`<div class="sj-wrap"><div class="sj-split">
        <div class="sj-side"><div class="sj-cap"><b>同一份資料</b><span class="info"></span></div><div class="sj-bars"></div></div>
        <div class="sj-side"><div class="sj-cap"><b class="pt"></b><span class="pd"></span></div><pre class="sj-pre"></pre></div>
      </div></div>`);
      const FORMATS = [["xlsx", "Excel 2007+，zip 包 XML"], ["xlsb", "Excel 二進位活頁簿"], ["xls", "Excel 97，BIFF8 複合文件"], ["ods", "OpenDocument，zip 包 XML"],
        ["fods", "OpenDocument 單一 XML"], ["xlml", "Excel 2003 XML"], ["csv", "逗號分隔純文字"], ["html", "HTML 表格"]];
      let rows = 2000, compression = false, chosen = "csv", results = [];
      const hex = (u8) => Array.from(u8.slice(0, 96), (x) => x.toString(16).padStart(2, "0")).join(" ").replace(/((?:\S+ ){16})/g, "$1\n");
      const preview = () => {
        const r = results.find((x) => x.t === chosen);
        ctx.$$(".sj-bar").forEach((el) => el.setAttribute("aria-pressed", el.dataset.t === chosen));
        ctx.$(".pt").textContent = `${chosen} 檔案內容`;
        const u8 = new Uint8Array(r.bytes);
        let text;
        if (u8[0] === 0x50 && u8[1] === 0x4b) {
          const zip = XLSX.CFB.read(u8, { type: "array" });
          ctx.$(".pd").textContent = `開頭 50 4B 是 zip，內含 ${zip.FileIndex.filter((f) => f.type === 2).length} 個檔案`;
          text = `<span class="c">// XLSX.CFB.read(bytes).FullPaths</span>\n` + zip.FullPaths.filter((p) => !p.endsWith("/")).map((p) => esc(p.replace(/^Root Entry\//, ""))).join("\n") + `\n\n<span class="c">// 前 96 個位元組</span>\n${hex(u8)}`;
        } else if (u8[0] === 0xd0 && u8[1] === 0xcf) {
          ctx.$(".pd").textContent = "開頭 D0 CF 11 E0 是 OLE 複合文件";
          text = `<span class="c">// 前 96 個位元組</span>\n${hex(u8)}`;
        } else {
          ctx.$(".pd").textContent = "純文字，顯示前 40 行";
          text = esc(new TextDecoder().decode(u8.slice(0, 6000)).split("\n").slice(0, 40).join("\n"));
        }
        ctx.$(".sj-pre").innerHTML = text;
      };
      const run = () => {
        const aoa = [["編號", "姓名", "縣市", "課程", "費用"]];
        for (let i = 1; i <= rows; i++) aoa.push([i, pick(NAMES), pick(CITIES), pick(COURSES), pick([3600, 4800, 5200, 6800])]);
        const wb = U.book_new();
        U.book_append_sheet(wb, U.aoa_to_sheet(aoa), "名單");
        results = FORMATS.map(([t, label]) => {
          const t0 = performance.now();
          const bytes = XLSX.write(wb, { bookType: t, type: "array", compression });
          const t1 = performance.now();
          const back = XLSX.read(bytes, { type: "array" });
          const t2 = performance.now();
          const n = U.decode_range(back.Sheets[back.SheetNames[0]]["!ref"]).e.r;
          return { t, label, bytes, size: bytes.byteLength, w: t1 - t0, r: t2 - t1, n };
        });
        const max = Math.max(...results.map((x) => x.size));
        ctx.$(".sj-bars").innerHTML = results.map((x) => `<div class="sj-bar" data-t="${x.t}"><b>${x.t}</b><div class="tr"><i style="width:${(x.size / max) * 100}%"></i></div><span class="sz">${bytesText(x.size)}</span>
          <small>${x.label}・寫 ${fmtMs(x.w)}・讀 ${fmtMs(x.r)}・讀回 ${fmt(x.n)} 列${x.n === rows ? "" : "（不符）"}</small></div>`).join("");
        ctx.$(".info").textContent = `${fmt(rows)} 列 × 5 欄`;
        preview();
      };
      ctx.on(ctx.$(".sj-bars"), "click", (e) => { const b = e.target.closest(".sj-bar"); if (b) { chosen = b.dataset.t; preview(); } });
      ctx.group(["200 列", "2,000 列", "2 萬列"], 1, (i) => { rows = [200, 2000, 20000][i]; run(); });
      ctx.toggle("壓縮", false, (v) => { compression = v; run(); });
      run();
    },
  },

  // ---------- 7: HTML table <-> worksheet ----------
  {
    id: "html", title: "HTML 表格互轉", paper: true,
    api: "table_to_book(tableEl, { raw }) ・ XLSX.write → XLSX.read ・ sheet_to_html(ws, { header: \"\", footer: \"\" })",
    desc: "直接把畫面上的 HTML 表格（含 rowspan、colspan）轉成活頁簿，寫成 xlsx 再讀回，用 sheet_to_html 輸出到右邊。合併儲存格變成 !merges，數字字串會被辨識成數值。",
    hint: "直接改左邊的數字；切「raw: true」看數字不再被轉型",
    mount(ctx) {
      ctx.html(`<div class="sj-wrap"><div class="sj-split even">
        <div class="sj-side"><div class="sj-cap"><b>來源 HTML 表格</b><span>可編輯</span></div><div class="sj-grid"><table class="sj-src"></table></div></div>
        <div class="sj-side"><div class="sj-cap"><b>xlsx 讀回後 sheet_to_html</b><span class="info"></span></div><div class="sj-grid sj-out"></div></div>
      </div><div class="sj-meta"></div></div>`);
      const src = ctx.$(".sj-src");
      const head = `<thead><tr><th rowspan="2">縣市</th><th colspan="3">2026 上半年報名（示意資料）</th></tr><tr><th>一月</th><th>二月</th><th>三月</th></tr></thead>`;
      const row = (city) => `<tr><th>${city}</th>${[0, 0, 0].map(() => `<td contenteditable="true">${rnd(12, 96)}</td>`).join("")}</tr>`;
      src.innerHTML = head + `<tbody>${CITIES.slice(0, 4).map(row).join("")}</tbody>`;
      let raw = false, wb = null;
      const convert = () => {
        const t0 = performance.now();
        wb = U.table_to_book(src, { raw });
        const bytes = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        const ws = XLSX.read(bytes, { type: "array" }).Sheets.Sheet1;
        const ms = performance.now() - t0;
        ctx.$(".sj-out").innerHTML = U.sheet_to_html(ws, { header: "", footer: "" });
        const cells = Object.keys(ws).filter((k) => k[0] !== "!");
        const nums = cells.filter((k) => ws[k].t === "n").length;
        ctx.$(".info").innerHTML = `<span class="n">${bytesText(bytes.byteLength)}</span>・<span class="n">${fmtMs(ms)}</span>`;
        ctx.$(".sj-meta").innerHTML = `!ref <b class="n">${ws["!ref"]}</b>・!merges <b class="n">${(ws["!merges"] || []).map((m) => U.encode_range(m)).join("、")}</b>・數值格 <b class="n">${nums}</b> / ${cells.length}`;
      };
      let timer = null;
      ctx.on(src, "input", () => { clearTimeout(timer); timer = ctx.timeout(convert, 250); });
      ctx.group(["raw: false", "raw: true"], 0, (i) => { raw = i === 1; convert(); });
      ctx.button("加一列", () => { const body = src.tBodies[0]; if (body.rows.length < 7) body.insertAdjacentHTML("beforeend", row(CITIES[body.rows.length])); convert(); });
      ctx.button("下載 xlsx", () => XLSX.writeFile(wb, "報名表.xlsx"));
      convert();
    },
  },

  // ---------- 8: stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "aoa_to_sheet ・ XLSX.write(wb, { bookType }) ・ XLSX.read(bytes, { dense }) ・ sheet_to_json",
    desc: "逐級把 1 千到 50 萬列、6 欄的資料走完一整趟：建表、寫成檔案、再解析回來、轉成 JS 物件。右上表格分段列出四個步驟的耗時與檔案大小，下方是最後一級讀回的前 50 列。",
    hint: "按左側「開始測試」；切換格式或 dense 再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="sj-stress"><table class="sj-res"><thead><tr><th>列數</th><th>格式</th><th>建表</th><th>寫入</th><th>讀回</th><th class="sj-hide-n">轉 JSON</th><th>大小</th></tr></thead><tbody><tr><td class="zh" colspan="7">尚未測試；下方是 1,000 列預覽</td></tr></tbody></table>
        <div class="sj-book"><div class="sj-cap"><b>讀回預覽</b><span class="pv"></span></div><div class="sj-grid"><table class="sj-t"></table></div></div></div>`);
      ctx.controls.classList.add("bottom");
      let bookType = "xlsx", dense = false;
      ctx.group(["xlsx", "csv", "xlsb"], 0, (i, l) => { bookType = l; });
      ctx.toggle("dense", false, (v) => { dense = v; });
      const HEAD = ["編號", "姓名", "縣市", "課程", "日期", "費用"];
      const makeAoa = (n) => {
        const aoa = new Array(n + 1);
        aoa[0] = HEAD;
        for (let i = 1; i <= n; i++) aoa[i] = [i, NAMES[i % 10], CITIES[(i * 3) % 7], COURSES[i % 4], `2026-${pad(1 + (i % 12))}-${pad(1 + (i % 28))}`, 3000 + (i % 40) * 100];
        return aoa;
      };
      const showPreview = (bytes, label) => {
        const ws = XLSX.read(bytes, { type: "array", sheetRows: 50 });
        drawSheet(ctx.$(".sj-t"), ws.Sheets[ws.SheetNames[0]]);
        ctx.$(".pv").textContent = label;
      };
      {
        const wb = U.book_new();
        U.book_append_sheet(wb, U.aoa_to_sheet(makeAoa(1000)), "資料");
        showPreview(XLSX.write(wb, { bookType: "xlsx", type: "array" }), "1,000 列 xlsx，sheetRows: 50 只解析前 50 列");
      }
      const results = [];
      const resBody = ctx.$(".sj-res tbody");
      ctx.bench({
        label: "資料列", unit: "列", sizes: [1000, 5000, 10000, 50000, 100000, 200000, 500000], target: 1000, budget: 4000,
        prepare: makeAoa,
        run(n, aoa) {
          const t0 = performance.now();
          const wb = U.book_new();
          U.book_append_sheet(wb, U.aoa_to_sheet(aoa, { dense }), "資料");
          const t1 = performance.now();
          const bytes = XLSX.write(wb, { bookType, type: "array" });
          const t2 = performance.now();
          const back = XLSX.read(bytes, { type: "array", dense });
          const t3 = performance.now();
          const json = U.sheet_to_json(back.Sheets[back.SheetNames[0]]);
          const t4 = performance.now();
          if (json.length !== n) throw new Error(`讀回 ${json.length} 列，預期 ${n} 列`);
          results.unshift([n, `${bookType}${dense ? " dense" : ""}`, t1 - t0, t2 - t1, t3 - t2, t4 - t3, bytes.byteLength]);
          resBody.innerHTML = results.slice(0, 8).map(([m, f, a, b, c, d, z]) =>
            `<tr><td>${fmt(m)}</td><td>${f}</td><td>${fmtMs(a)}</td><td>${fmtMs(b)}</td><td>${fmtMs(c)}</td><td class="sj-hide-n">${fmtMs(d)}</td><td>${bytesText(z)}</td></tr>`).join("");
          ctx.timeout(() => showPreview(bytes, `${fmt(n)} 列 ${bookType}，sheetRows: 50 只解析前 50 列`), 0);
          return `寫 ${fmtMs(t2 - t1)}・讀 ${fmtMs(t3 - t2)}・${bytesText(bytes.byteLength)}`;
        },
        note: "計時包含四段：aoa_to_sheet 建表、XLSX.write 產生檔案位元組、XLSX.read 解析、sheet_to_json 轉成物件陣列；資料產生不計時。xlsx 要組 XML 再打包 zip，通常寫入與讀回都是大宗；csv 沒有容器，xlsb 是二進位記錄。dense 模式把儲存格放在二維陣列而不是以位址為鍵的物件，列數大時能省下大量記憶體與時間。超過 4 秒的那一級之後就停止。",
      });
    },
  },
] });
</script>
</body>
</html>
