<style>
  /* Every tour lives in a host box: steps and the modal svg are appended here, so they stay
     inside the stage, under the scene controls and the showcase tabs. */
  .sh-host {
    position: absolute; inset: calc(var(--sc-ctl-h, 0px) + 6px) 6px 6px;
    overflow: hidden; contain: layout paint; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg-2);
  }
  .sh-chip { position: absolute; z-index: 3; padding: 5px 9px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font: 600 12px/1.3 var(--font); color: var(--muted); pointer-events: none; }
  .sh-chip b { color: var(--fg); font-family: var(--mono); font-weight: 700; }

  /* Shepherd theme driven by the page palette (works on dark and paper scenes) */
  .sh-host .shepherd-element { max-width: min(300px, calc(100% - 20px)); border-radius: 12px; background: var(--bg-2); color: var(--fg); box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35), 0 0 0 1px var(--line); font-family: var(--font); }
  .sh-host .shepherd-content { border-radius: 12px; }

  .sh-host .shepherd-cancel-icon { color: var(--muted); }
  .sh-host .shepherd-cancel-icon:hover { color: var(--fg); }
  .sh-host .shepherd-text { padding: 6px 16px 14px; font-size: 13.5px; line-height: 1.65; color: var(--fg); opacity: .88; }
  .sh-host .shepherd-text:only-child { padding-top: 14px; }
  .sh-host .shepherd-text b { color: var(--fg); }
  .sh-host .shepherd-footer { align-items: center; gap: 8px; padding: 0 14px 14px; }
  .sh-host .shepherd-button { margin-right: 0; padding: 8px 13px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: 700 13px/1 var(--font); }
  .sh-host .shepherd-button:not(:disabled):hover { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); }
  .sh-host .shepherd-button:disabled { opacity: .4; cursor: not-allowed; }
  .sh-host .shepherd-button.shepherd-button-secondary { background: rgba(127, 127, 127, 0.16); color: var(--fg); }
  .sh-host .shepherd-arrow::before { background: var(--bg-2) !important; }
  .sh-host .shepherd-element[data-popper-placement^=bottom] { margin-top: 12px; }
  .sh-host .shepherd-element[data-popper-placement^=top] { margin-top: -12px; }
  .sh-host .shepherd-element[data-popper-placement^=right] { margin-left: 12px; }
  .sh-host .shepherd-element[data-popper-placement^=left] { margin-left: -12px; }
  .sh-host .shepherd-modal-overlay-container.shepherd-modal-is-visible { opacity: .62; }
  body.paper .sh-host .shepherd-modal-overlay-container.shepherd-modal-is-visible { opacity: .5; }
  .sh-progress { margin-right: auto; font: 600 12px var(--mono); color: var(--muted); }

  /* 1. Signature: course admin dashboard (paper) */
  .sh-app { position: absolute; inset: 0; display: grid; grid-template-columns: 176px 1fr; grid-template-rows: 54px 1fr; background: var(--bg); }
  .sh-side { grid-row: 1 / 3; display: flex; flex-direction: column; gap: 16px; background: #1c1c1a; color: #e9e7df; padding: 14px 10px; }
  .sh-brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; font-size: 15px; }

  .sh-nav { display: flex; flex-direction: column; gap: 4px; }

<script src="_shared/showcase.js"></script>
<script type="module">
import Shepherd from "https://cdn.jsdelivr.net/npm/shepherd.js@15.3.0/dist/js/shepherd.mjs";

const { h, fmtMs, fmtCompact } = Showcase;

// Builds a tour whose popovers and modal svg live inside `host`. The modal path is drawn in
// viewport coordinates, so every show shifts it by the host's own offset.
function makeTour(ctx, host, opts = {}) {
  const { defaultStepOptions, ...rest } = opts;
  const tour = new Shepherd.Tour({
    useModalOverlay: true, exitOnEsc: true, keyboardNavigation: true,
    stepsContainer: host, modalContainer: host, ...rest,
    defaultStepOptions: { cancelIcon: { enabled: true, label: "結束導覽" }, modalOverlayOpeningPadding: 6, modalOverlayOpeningRadius: 10, ...defaultStepOptions },
  });
  tour.on("show", ({ step }) => {
    const r = host.getBoundingClientRect();
    step.options.modalOverlayOpeningXOffset = -(r.left + host.clientLeft);
    step.options.modalOverlayOpeningYOffset = -(r.top + host.clientTop);
    // Shepherd focuses the dialog ~300ms after showing it. When the viewer is on the scene tabs
    // (keyboard switching), hand focus back so arrow keys keep changing scenes.
    let tab = document.activeElement;
    if (tab && tab.closest && tab.closest(".sc-tabs")) {
      // Shepherd may focus the dialog more than once, so guard for a short window. Pointer presses
      // and the Tab key mean the viewer is moving on purpose, which ends the guard.
      const stop = () => { document.removeEventListener("focusin", back); document.removeEventListener("pointerdown", stop, true); document.removeEventListener("keydown", key, true); };
      const key = (e) => { if (e.key === "Tab") stop(); };
      const back = (e) => {
        const t = e.target;
        if (t.closest && t.closest(".sc-tabs")) { tab = t; return; }
        if (t.closest && t.closest(".shepherd-element")) tab.focus({ preventScroll: true });
        else stop();
      };
      document.addEventListener("focusin", back);
      document.addEventListener("pointerdown", stop, true);
      document.addEventListener("keydown", key, true);
      setTimeout(stop, 1500);
    }
  });
  // Re-show on resize so the overlay offset and placement follow the new layout.
  ctx.onResize(() => { if (tour.isActive() && tour.getCurrentStep()) tour.show(tour.steps.indexOf(tour.getCurrentStep())); });
  ctx.onCleanup(() => {
    const f = document.activeElement;
    tour.options.confirmCancel = false;
    if (tour.isActive()) tour.cancel();
    // _done() restores focus to whatever was focused at start(); keep the current focus instead.
    if (document.activeElement !== f) f?.focus?.({ preventScroll: true });
  });
  return tour;
}
// Shepherd has no built-in progress label; this `when` handler adds "2 / 6" to the footer.
const progress = { show() { const f = this.getElement()?.querySelector(".shepherd-footer"); if (f && !f.querySelector(".sh-progress")) f.insertAdjacentHTML("afterbegin", `<span class="sh-progress">${this.tour.steps.indexOf(this) + 1} / ${this.tour.steps.length}</span>`); } };
const BACK = { text: "上一步", classes: "shepherd-button-secondary", action() { this.back(); } };
const NEXT = { text: "下一步", action() { this.next(); } };
const DONE = { text: "完成", action() { this.complete(); } };
const holes = (host) => Math.max(0, ((host.querySelector(".shepherd-modal-overlay-container path")?.getAttribute("d") || "").match(/M/g) || []).length - 1);

const ICON = (d) => `<svg viewBox="0 0 24 24">${d}</svg>`;
const APP = `<div class="sh-app">
  <aside class="sh-side"><div class="sh-brand"><span class="sh-logo">JS</span><b>JS 學院後台</b></div>
    <nav class="sh-nav">

        if (tour?.isActive()) { tour.options.confirmCancel = false; tour.cancel(); }
        ol.textContent = "";
        STEPS.forEach((s) => { rows[s.id] = h("span", { text: "未到" }); ol.append(h("li", {}, h("code", { text: s.id }), rows[s.id])); });
        slot.className = "sh-box sh-slot sh-skel"; slot.innerHTML = "報表載入中…";
        ctx.timeout(() => { slot.className = "sh-box sh-slot sh-report"; slot.innerHTML = "<h4>本週報表</h4>營收 NT$48,200，比上週多 9%。"; }, 1500);
        tour = makeTour(ctx, host, { confirmCancel: () => (state.ask ? ask() : true), defaultStepOptions: { buttons: [BACK, NEXT], when: { hide() { lastHide = performance.now(); } } } });
        tour.addSteps(STEPS);
        let last = -1;
        tour.on("show", ({ step }) => {
          const i = tour.steps.indexOf(step);
          for (let k = last + 1; k < i; k++) mark(STEPS[k].id, "skip", "略過");
          mark(step.id, "ok", `顯示 +${((performance.now() - t0) / 1000).toFixed(1)}s`);
          last = Math.max(last, i);
        });
        tour.on("complete", () => { for (let k = last + 1; k < STEPS.length; k++) mark(STEPS[k].id, "skip", "略過"); });
        tour.on("cancel", () => { for (let k = last + 1; k < STEPS.length; k++) mark(STEPS[k].id, "", "未到"); });
        t0 = performance.now();
        tour.start();
      };
      ctx.button("開始導覽", start, { primary: true });
      paint();
      ctx.timeout(start, 450);
    },
  },
  {
    id: "api", title: "API 與事件",
    api: "tour.start() / back() / next() / show(id) / cancel() / complete() / isActive()",
    desc: "用按鈕直接呼叫 Tour 的方法，右側即時列出 tour 與 step 觸發的事件，看清楚 show、hide、destroy 與 active、inactive 的先後順序。",
    hint: "按右上的方法按鈕，右側看事件順序",
    mount(ctx) {
      const C = ["var(--c1)", "var(--c2)", "var(--c4)", "var(--c6)"];
      ctx.html(`<div class="sh-host"><div class="sh-api"><div class="sh-blocks">${"ABCD".split("").map((k, i) => `<div class="sh-blk sh-b${k}" style="background:${C[i]}">${k}</div>`).join("")}</div><div class="sh-events"></div></div></div>`);
      const host = ctx.$(".sh-host"), log = ctx.$(".sh-events");
      const t0 = performance.now();
      const add = (html) => { log.prepend(h("div")); log.firstChild.innerHTML = `<em>${((performance.now() - t0) / 1000).toFixed(2)}s</em>${html}`; while (log.childNodes.length > 80) log.lastChild.remove(); };
      const tour = makeTour(ctx, host, { defaultStepOptions: { buttons: [BACK, NEXT], when: {
        show() { add(`<span class="st">step:${this.id}</span> show`); },
        hide() { add(`<span class="st">step:${this.id}</span> hide`); },
        destroy() { add(`<span class="st">step:${this.id}</span> destroy`); },
      } } });
      tour.addSteps("ABCD".split("").map((k) => ({ id: k.toLowerCase(), title: `區塊 ${k}`, text: `這是第 ${"ABCD".indexOf(k) + 1} 步，id 為 "${k.toLowerCase()}"。`, attachTo: { element: ctx.$(`.sh-b${k}`), on: "auto" } })));
      tour.steps[3].options.buttons = [BACK, DONE];
      for (const ev of ["start", "show", "cancel", "complete", "active", "inactive"]) {
        tour.on(ev, (e) => add(`<b>tour</b> ${ev}${ev === "show" ? `（${e.previous?.id ?? "無"} → ${e.step.id}）` : ""}`));
      }
      const call = (name, fn) => ctx.button(name, () => { add(`呼叫 ${name}`); fn(); });
      call("start()", () => tour.start());
      call("back()", () => tour.back());
      call("next()", () => tour.next());
      call('show("c")', () => tour.show("c"));
      call("cancel()", () => tour.cancel());
      call("complete()", () => tour.complete());
      ctx.button("isActive()", () => add(`isActive() → <b>${tour.isActive()}</b>，目前步驟 ${tour.getCurrentStep()?.id ?? "無"}`));
      ctx.timeout(() => { add("自動呼叫 start()"); tour.start(); }, 450);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "extraHighlights: ['.cell.on'] (N 個洞口)",
    desc: "遮罩每一幀都重新量測所有高亮元素的位置，並兩兩比對誰被誰包住以合併洞口，所以成本約隨 N² 成長。逐級增加 extraHighlights 數量，看 FPS 掉到哪裡。",
    hint: "按左側「自動加壓」，或拖曳手動滑桿",
    mount(ctx) {
      const MAX = 1600;
      ctx.html(`<div class="sh-host sh-stress"><div class="sh-sbar">遮罩洞口 <b class="sh-n">0</b> 個</div><div class="sh-grid">${'<i class="sh-cell"></i>'.repeat(MAX)}</div></div>`);
      const host = ctx.$(".sh-stress"), cells = ctx.$$(".sh-cell"), nEl = ctx.$(".sh-n");
      const tour = makeTour(ctx, host, { exitOnEsc: false, keyboardNavigation: false, defaultStepOptions: { cancelIcon: { enabled: false }, modalOverlayOpeningPadding: 1, modalOverlayOpeningRadius: 3 } });
      tour.addStep({ id: "s", arrow: false, text: "每個藍色格子都是一個 extraHighlights 洞口。", attachTo: { element: ctx.$(".sh-sbar"), on: "left" } });
      const m = { show: 0, n: 0 };
      ctx.ramp({
        label: "高亮洞口", unit: "個",
        steps: [10, 25, 50, 100, 200, 400, 800, 1600],
        apply(n) {
          // Spread the highlighted cells over the visible grid.
          const grid = ctx.$(".sh-grid");
          const visible = cells.filter((c) => c.offsetTop + c.offsetHeight <= grid.clientHeight + grid.offsetTop).length || cells.length;
          const k = Math.min(n, visible);
          cells.forEach((c) => c.classList.remove("on"));
          for (let i = 0; i < k; i++) cells[Math.floor((i * visible) / k)].classList.add("on");
          const step = tour.steps[0];
          step.options.extraHighlights = k ? [".sh-cell.on"] : [];
          const t = performance.now();
          if (tour.isActive()) tour.show(0); else tour.start();
          m.show = performance.now() - t;
          m.n = k;
          nEl.textContent = fmtCompact(k);
        },
        metrics: () => ({ "實際洞口": fmtCompact(holes(host)), "每幀配對檢查": fmtCompact(m.n * m.n), "show() 耗時": fmtMs(m.show) }),
        note: "Shepherd 用 requestAnimationFrame 持續更新遮罩：每一幀對每個洞口呼叫 getBoundingClientRect，再兩兩比對是否被其他洞口包住，接著重寫整條 SVG path。洞口一多，這段工作就會吃掉整個幀預算。格子數受畫面大小限制，實際洞口數以面板數字為準。",
      });
    },
  },
] });
</script>
</body>
</html>
