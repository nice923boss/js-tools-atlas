<script type="module">
// Shiki showcase: fine-grained core bundle, grammars and themes loaded on demand from esm.sh.
const ESM = "https://esm.sh";
const V = "4.5.0";
const themeLoader = (id) => () => import(`${ESM}/@shikijs/themes@${V}/${id}`);
const langImport = (id) => import(`${ESM}/@shikijs/langs@${V}/${id}`);
const { fmt, fmtMs } = Showcase;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Boot once: core + JavaScript regex engine (no WASM), one theme, one grammar.
let core, jsEngine, hl;
const BOOT = {};
const ready = (async () => {
  const t0 = performance.now();
  [core, jsEngine] = await Promise.all([import(`${ESM}/shiki@${V}/core`), import(`${ESM}/shiki@${V}/engine/javascript`)]);
  BOOT.importMs = performance.now() - t0;
  const t1 = performance.now();
  hl = await core.createHighlighterCore({ themes: [themeLoader("github-dark")], langs: [() => langImport("typescript")], engine: jsEngine.createJavaScriptRegexEngine() });
  BOOT.createMs = performance.now() - t1;
  BOOT.at = performance.now();
})();

// Load a theme or grammar into a highlighter once, sharing in-flight promises.
const pendingBy = new WeakMap();
function ensure(h, kind, id) {
  const loaded = kind === "theme" ? h.getLoadedThemes() : h.getLoadedLanguages();
  if (loaded.includes(id)) return Promise.resolve();
  if (!pendingBy.has(h)) pendingBy.set(h, new Map());
  const pending = pendingBy.get(h);
  const key = kind + ":" + id;
  if (!pending.has(key)) pending.set(key, kind === "theme" ? h.loadTheme(themeLoader(id)) : h.loadLanguage(() => langImport(id)));
  return pending.get(key);
}

// Uncompressed size of esm.sh modules the page has fetched (resource entries filtered by start time).
async function moduleBytes(from = 0, to = Infinity, keep = () => true) {
  const urls = [...new Set(performance.getEntriesByType("resource")
    .filter((e) => e.name.startsWith(ESM) && e.startTime >= from && e.startTime < to && keep(e.name)).map((e) => e.name))];
  const sizes = await Promise.all(urls.map((u) => fetch(u, { cache: "force-cache" }).then((r) => r.arrayBuffer()).then((b) => b.byteLength).catch(() => 0)));
  return { count: urls.length, kb: sizes.reduce((a, b) => a + b, 0) / 1024 };
}

].map(([id, name]) => ({ id, name }));

type City = "台北" | "台中" | "高雄";

interface Signup {
  name: string;
  city: City;
  paid: boolean;
}

export function summarize(rows: Signup[]): Map<City, number> {
  const counts = new Map<City, number>();
  for (const { city, paid } of rows) {
    if (!paid) continue;
    counts.set(city, (counts.get(city) ?? 0) + 1);
  }
  return counts;
}

from dataclasses import dataclass
from datetime import date

@dataclass
class Order:
    course: str
    amount: int
    paid_on: date

def monthly_revenue(orders: list[Order]) -> dict[str, int]:
    """依月份加總已付款金額"""

    for o in orders:

    v.sort_by(|a, b| b.seats.cmp(&a.seats));

function ruleColor(theme, target) {

          html += "</div>";
        });
        chips.innerHTML = html;
        chips.style.background = res.bg;
        const total = [...byColor.values()].reduce((a, b) => a + b, 0) || 1;
        dist.innerHTML = [...byColor].sort((a, b) => b[1] - a[1]).map(([c, n]) => `<i style="flex:${n};background:${c}" title="${c}：${(n / total * 100).toFixed(1)}%"></i>`).join("");
        summary = `<b>${fmt(flat.length)}</b> 個 token（不含空白）・<b>${byColor.size}</b> 種顏色・<b>${ms.toFixed(1)}</b> ms<br>滑鼠移到色塊上查看 token 細節`;
        info.innerHTML = summary;
      }
      const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
      ctx.onCleanup(() => cancelAnimationFrame(raf));
      ctx.on(ta, "input", schedule);
      ctx.on(ta, "pointerdown", () => { typing = false; });
      ctx.on(chips, "mouseover", (e) => {
        const chip = e.target.closest(".shk-chip");
        chips.querySelectorAll(".on").forEach((x) => x.classList.remove("on"));
        if (!chip) { info.innerHTML = summary; return; }
        chip.classList.add("on");
        const tk = flat[+chip.dataset.i];
        const scopes = (tk.explanation || []).flatMap((x) => x.scopes.map((s) => s.scopeName));
        info.innerHTML = `第 ${tk.line} 行・offset <b>${tk.offset}</b>・<b>${esc(JSON.stringify(tk.content))}</b>・<i style="background:${tk.color}"></i><b>${tk.color}</b><br>scope：<b>${esc(scopes.slice(-2).join(" › ") || "（無）")}</b>`;
      });
      ta.value = LANGS[0][1];
      render();
      // Type an extra line to show live re-tokenising.
      await ctx.sleep(900);
      for (const ch of LANGS[0][2]) {
        if (!typing || li !== 0) break;
        ta.value += ch;
        render();
        await ctx.sleep(70);
      }
    },
  },
  {
    id: "custom", title: "自訂主題與語法",
    api: "hl.loadTheme({ name, tokenColors }); hl.loadLanguage({ scopeName, patterns })",
    desc: "主題與語法都是普通 JSON：這裡用台北捷運路線色寫一個主題，再寫一份「捷運路線 DSL」的 TextMate 語法。兩者可各自搭配任何內建主題或語言。",
    hint: "切換語言或主題，觀察自訂語法與自訂主題互相獨立",
    async mount(ctx) {
      ctx.html(`<div class="shk-board"><div class="shk-cust"><div class="shk-code"></div><div class="shk-legend"></div></div></div>`);
      const box = ctx.$(".shk-code"), legend = ctx.$(".shk-legend");
      const st = { lang: "mrt", theme: "taipei-metro" };
      ctx.group(["捷運 DSL", "TypeScript"], 0, (i) => { st.lang = i ? "typescript" : "mrt"; paint(); });
      ctx.group(["捷運主題", "GitHub Dark"], 0, (i) => { st.theme = i ? "github-dark" : "taipei-metro"; paint(); });
      await ready;

      if (!hl.getLoadedLanguages().includes("mrt")) await hl.loadLanguage(structuredClone(MRT_LANG));
      await Promise.all([ensure(hl, "theme", "github-dark"), ensure(hl, "lang", "typescript")]);
      if (!ctx.active) return;
      legend.innerHTML = `<h4>自訂主題 taipei-metro：${MRT_THEME.tokenColors.length} 條規則</h4>`
        + MRT_THEME.tokenColors.map((r) => `<div class="r"><i style="background:${r.settings.foreground}"></i><span>${r.label}</span><code>${esc(r.scope.join(", "))}</code></div>`).join("")
        + `<h4 style="margin-top:10px">自訂語法 source.mrt：${MRT_LANG.patterns.length} 條規則</h4>`
        + MRT_LANG.patterns.map((p) => `<div class="r"><code>${esc(p.match)}</code></div>`).join("");
      function paint() {

  {
    id: "hast", title: "HAST 語法樹",
    api: "const root = hl.codeToHast(code, { structure }); hastToHtml(root)",
    desc: "codeToHast 回傳 hast 語法樹，可在轉成 HTML 前自由改寫節點；這裡替每個元素加上 data-hid，左側樹狀圖與右側渲染結果因此能互相對應。",
    hint: "滑鼠移到任一邊，另一邊會標出對應節點",
    async mount(ctx) {
      ctx.html(`<div class="shk-board"><div class="shk-hast"><div class="shk-tree"></div><div class="shk-hr"><div class="shk-code"></div><div class="shk-stats"></div></div></div></div>`);
      const tree = ctx.$(".shk-tree"), out = ctx.$(".shk-hr .shk-code"), stats = ctx.$(".shk-stats");
      const CODE = `const line = "板南線";\nconst fare = 25;\nexport default { line, fare };`;
      let structure = "classic", auto = true;
      ctx.group(["classic", "inline"], 0, (i, l) => { structure = l; build(); });
      await ready;
      await Promise.all([ensure(hl, "theme", "vitesse-dark"), ensure(hl, "lang", "typescript")]);
      if (!ctx.active) return;
      const theme = hl.getTheme("vitesse-dark");
      function build() {
        const root = hl.codeToHast(CODE, { lang: "typescript", theme: "vitesse-dark", structure });
        const rows = [];
        let id = 0, els = 0, txt = 0;
        (function walk(node, depth, parent) {
          const pad = `padding-left:${8 + depth * 14}px`;
          if (node.type === "element") {
            const hid = String(++id);
            node.properties["data-hid"] = hid;
            els++;
            const cls = node.properties.class;
            const style = node.properties.style ? String(node.properties.style) : "";
            rows.push(`<div class="el" data-hid="${hid}" style="${pad}">&lt;${node.tagName}${cls ? `<small>.${esc([].concat(cls).join("."))}</small>` : ""}${style ? `<small> style="${esc(style.length > 24 ? style.slice(0, 24) + "…" : style)}"</small>` : ""}&gt;</div>`);
            node.children.forEach((c) => walk(c, depth + 1, hid));
          } else if (node.type === "text") {
            txt++;
            rows.push(`<div class="tx" data-hid="${parent}" style="${pad}">${esc(JSON.stringify(node.value))}</div>`);
          } else {
            rows.push(`<div class="el" style="${pad}">${node.type}</div>`);
            (node.children || []).forEach((c) => walk(c, depth + 1, parent));
          }
        })(root, 0, "");
        tree.innerHTML = rows.join("");
        const html = core.hastToHtml(root);
        out.innerHTML = structure === "classic" ? html : `<pre class="shiki" style="background:${theme.bg};color:${theme.fg}"><code>${html}</code></pre>`;
        stats.innerHTML = `<div>元素節點<b>${els}</b></div><div>文字節點<b>${txt}</b></div><div>HTML 字元<b>${fmt(html.length)}</b></div>`;
      }
      const mark = (hid, from) => {
        tree.querySelectorAll(".on").forEach((x) => x.classList.remove("on"));
        out.querySelectorAll(".hon").forEach((x) => x.classList.remove("hon"));
        if (!hid) return;
        const node = out.querySelector(`[data-hid="${hid}"]`);
        if (node) node.classList.add("hon");
        tree.querySelectorAll(`[data-hid="${hid}"]`).forEach((r) => r.classList.add("on"));
        const row = tree.querySelector(`.el[data-hid="${hid}"]`);
        if (row && from !== "tree") tree.scrollTop = Math.max(0, row.offsetTop - tree.clientHeight / 2);
      };
      ctx.on(tree, "mouseover", (e) => { auto = false; const r = e.target.closest("[data-hid]"); mark(r && r.dataset.hid, "tree"); });
      ctx.on(out, "mouseover", (e) => { auto = false; const r = e.target.closest("[data-hid]"); mark(r && r.dataset.hid, "out"); });
      build();
      let k = 0;
      ctx.interval(() => {
        if (!auto) return;
        const spans = out.querySelectorAll(".line > span, code > span");
        if (spans.length) mark(spans[k++ % spans.length].dataset.hid, "auto");
      }, 900);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "hl.codeToHtml(bigCode, { lang: 'typescript', theme })",
    desc: "逐級加大 TypeScript 行數，量 codeToHtml 的同步耗時與輸出大小；上方表格比較 JS 正規表示式引擎與 Oniguruma WASM 引擎的首次載入成本。",
    hint: "切換引擎後重新按「開始測試」比較兩者",
    async mount(ctx) {
      ctx.html(`<div class="shk-stress"><table class="shk-eng"><thead><tr><th>引擎</th><th>模組</th><th>未壓縮</th><th>載入</th><th>建立</th></tr></thead><tbody>
        <tr data-e="js" class="cur"><td>核心＋JS 引擎</td><td class="num">…</td><td class="num">…</td><td class="num">…</td><td class="num">…</td></tr>
        <tr data-e="wasm"><td>WASM 引擎（另載）</td><td class="num">…</td><td class="num">…</td><td class="num">…</td><td class="num">…</td></tr></tbody></table>
        <div class="shk-prev shk-code"><span class="shk-tag">輸出預覽</span><div class="shk-msg" style="margin:auto">按「開始測試」產生大量程式碼並計時</div></div></div>`);
      ctx.controls.classList.add("bottom");
      const prev = ctx.$(".shk-prev");
      let engine = "js";
      const fillRow = (e, cells) => ctx.$$(`tr[data-e="${e}"] td.num`).forEach((td, i) => (td.textContent = cells[i]));
      const markCur = () => ctx.$$("tr[data-e]").forEach((tr) => tr.classList.toggle("cur", tr.dataset.e === engine));
      const noThemeLang = (u) => !/\/(themes|langs)@/.test(u);
      async function loadWasm() {
        if (!WASM.pending) {
          WASM.pending = (async () => {
            const since = performance.now();
            const t0 = performance.now();
            const { createOnigurumaEngine } = await import(`${ESM}/shiki@${V}/engine/oniguruma`);
            const eng = await createOnigurumaEngine(import(`${ESM}/shiki@${V}/wasm`));
            const loadMs = performance.now() - t0;
            const t1 = performance.now();
            WASM.hl = await core.createHighlighterCore({ themes: [themeLoader("github-dark")], langs: [() => langImport("typescript")], engine: eng });
            WASM.hl.codeToHtml(TS, { lang: "typescript", theme: "github-dark" });
            const createMs = performance.now() - t1;
            const m = await moduleBytes(since, Infinity, noThemeLang);
            WASM.info = [fmt(m.count), `${fmt(m.kb, 0)} KB`, fmtMs(loadMs), fmtMs(createMs)];
          })();
        }
        await WASM.pending;
        if (ctx.active) fillRow("wasm", WASM.info);
      }
      ctx.group(["JS 引擎", "WASM 引擎"], 0, (i) => { engine = i ? "wasm" : "js"; markCur(); if (i) loadWasm(); });
      await ready;
      const t1 = performance.now();
      const jsHl = await core.createHighlighterCore({ themes: [themeLoader("github-dark")], langs: [() => langImport("typescript")], engine: jsEngine.createJavaScriptRegexEngine() });
      jsHl.codeToHtml(TS, { lang: "typescript", theme: "github-dark" });
      const jsCreate = performance.now() - t1;
      ctx.onCleanup(() => jsHl.dispose());
      const jsMods = await moduleBytes(0, BOOT.at, noThemeLang);
      if (!ctx.active) return;
      fillRow("js", [fmt(jsMods.count), `${fmt(jsMods.kb, 0)} KB`, fmtMs(BOOT.importMs), fmtMs(jsCreate)]);
      ctx.timeout(loadWasm, 400);
      let used = "js";
      ctx.bench({
        label: "程式碼行數", unit: "行", sizes: [200, 1000, 3000, 10000, 30000, 100000], target: 1000, budget: 3000,
        note: "測同步的 codeToHtml：TextMate 語法逐行比對正規表示式，輸出 HTML 也隨 token 數線性變大，瓶頸在主執行緒。可在右下切換 JS 引擎與 WASM 引擎後重測；表格的「載入」含網路下載，「建立」含語法編譯與一次暖身。",
        async prepare(n) {
          used = engine;
          if (used === "wasm") await loadWasm();
          return bigCode(n);
        },
        run(n, code) {
          const H = used === "wasm" ? WASM.hl : jsHl;
          const html = H.codeToHtml(code, { lang: "typescript", theme: "github-dark" });
          ctx.timeout(() => {
            prev.innerHTML = H.codeToHtml(code.split("\n").slice(0, 40).join("\n"), { lang: "typescript", theme: "github-dark" })
              + `<span class="shk-tag">${used === "wasm" ? "WASM" : "JS"} 引擎・前 40 行 / 共 ${fmt(n)} 行</span>`;
          }, 0);
          return `${(html.length / 1048576).toFixed(html.length > 1048576 ? 1 : 2)} MB HTML`;
        },
      });
    },
  },
] });
</script>
