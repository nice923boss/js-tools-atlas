<script src="https://cdn.jsdelivr.net/npm/signature_pad@5.1.4/dist/signature_pad.umd.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Signature Pad showcase: consent form, width parameters, colors and eraser, undo and replay,
// export formats, high-DPI handling, input sampling, and a fromData / toSVG stress benchmark.
const { h, fmt, fmtMs } = Showcase;
const INK = { 墨黑: "#1c1c1a", 鋼筆藍: "#1f4fb8", 朱紅: "#c7302b", 螢光黃: "#e8c400", 白: "#ffffff" };
// The library itself uses window.devicePixelRatio in toSVG and fromDataURL, so we size canvases the same way.
const dpr = () => Math.max(window.devicePixelRatio || 1, 1);
const kb = (n) => (n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`);
const dataUrlBytes = (u) => { const b64 = u.slice(u.indexOf(",") + 1); return Math.floor((b64.length * 3) / 4) - (b64.endsWith("==") ? 2 : b64.endsWith("=") ? 1 : 0); };
const pointCount = (groups) => groups.reduce((s, g) => s + g.points.length, 0);

// Create a pad whose backing store follows its CSS box. On resize: toData, resize, fromData (strokes survive).
function makePad(ctx, canvas, opts = {}, { ratio = dpr, onFit } = {}) {
  // CPU-backed canvases: small pads that are read back often (toDataURL, magnifier) avoid GPU readback stalls.
  const pad = new SignaturePad(canvas, { canvasContextOptions: { willReadFrequently: true }, ...opts });
  pad.fit = (silent) => {
    const w = canvas.offsetWidth, hh = canvas.offsetHeight;
    if (!w || !hh) return;
    const r = ratio();
    const W = Math.round(w * r), H = Math.round(hh * r);
    if (canvas.width === W && canvas.height === H) return;
    canvas.width = W; canvas.height = H;
    canvas.getContext("2d").scale(r, r);
    // redraw() replays toData() and also any image loaded with fromDataURL().
    pad.redraw();
    if (onFit && !silent) onFit();
  };
  // fromData() inside fit() calls clear(), which drops the active pointer id and would orphan a stroke in progress,
  // so a resize during a stroke waits until the stroke ends.
  let drawing = false, pending = false;
  pad.addEventListener("beginStroke", () => { drawing = true; });
  pad.addEventListener("endStroke", () => { drawing = false; if (pending) { pending = false; pad.fit(); } });
  const ro = new ResizeObserver(() => { if (drawing) pending = true; else pad.fit(); });
  ro.observe(canvas);
  pad.fit(true);
  ctx.onCleanup(() => { ro.disconnect(); pad.off(); });
  return pad;
}

// A cursive-looking sample signature as point groups in CSS px. Timing varies so speed changes the width.
function sampleStrokes(w, hh, opts = {}, speed = 1) {
  const base = hh * 0.74 - 6, x0 = w * 0.12, span = w * 0.62;
  const loops = [];
  let time = 1000;
  const N = 220, turns = 5.2;
  for (let i = 0; i <= N; i++) {
    const t = (i / N) * turns * Math.PI * 2, k = i / N;
    const amp = hh * (0.12 + 0.16 * Math.exp(-k * 7) + 0.1 * Math.max(0, Math.sin(k * Math.PI * 2.6)));
    const x = x0 + k * span + Math.sin(t) * w * 0.03;
    const y = base - amp * (1 - Math.cos(t)) * 0.5 - Math.sin(k * Math.PI) * hh * 0.06;
    time += (6 + 10 * (1 - Math.abs(Math.cos(t)))) / speed;
    loops.push({ x, y, pressure: 0.5, time });
  }
  const swoosh = [];
  time += 120;
  for (let i = 0; i <= 60; i++) {
    const k = i / 60;
    const x = x0 - w * 0.03 + k * (span + w * 0.12);
    const y = base + hh * 0.05 - Math.sin(k * Math.PI) * hh * 0.08 + k * hh * 0.02;
    time += (4 + 14 * Math.sin(k * Math.PI)) / speed;
    swoosh.push({ x, y, pressure: 0.5, time });
  }
  const dot = [{ x: x0 + span + w * 0.06, y: base - hh * 0.2, pressure: 0.5, time: time + 200 }];
  return [{ ...opts, points: loops }, { ...opts, points: swoosh }, { ...opts, dotSize: 3, points: dot }];
}
// First n points across all groups, used to animate a drawing with fromData().
function slicePoints(groups, n) {
  const out = [];
  for (const g of groups) { if (n <= 0) break; out.push({ ...g, points: g.points.slice(0, n) }); n -= g.points.length; }
  return out;
}
function play(ctx, pad, groups, { perFrame = 6, after } = {}) {
  const total = pointCount(groups);
  let shown = 0;
  const stop = ctx.raf(() => {
    shown = Math.min(total, shown + perFrame);
    pad.fromData(slicePoints(groups, shown));
    if (after) after(shown >= total);
    if (shown >= total) stop();
  });
  return stop;
}
// Strip per-group options so a pad renders the stroke with its own minWidth / maxWidth / filter.
const bare = (groups) => groups.map((g) => ({ points: g.points, ...(g.dotSize ? { dotSize: g.dotSize } : {}) }));
const tag = (text, cls = "") => `<div class="sp-tag ${cls}">${text}</div>`;

Showcase.run({ scenes: [
  {
    id: "form", title: "同意書簽名", paper: true,
    api: "new SignaturePad(canvas, { minWidth, maxWidth, penColor })・toData()・fromData()・toDataURL()",
    desc: "報名同意書上的簽名欄：速度越慢筆畫越粗，可換筆色、調筆寬、復原上一筆，下載 PNG 只在按下按鈕時觸發。",
    hint: "用滑鼠或手指在虛線框內簽名",
    mount(ctx) {
      ctx.html(`<div class="sp-fill sp-wrap"><div class="sp-doc">
        <header><h1>課程報名同意書</h1>
          <p>本人已詳閱「JavaScript 互動網頁設計班」課程須知與退費辦法，同意遵守上課規範並於下方簽名確認。</p>
          <div class="sp-meta"><span>上課地點：<b>臺北市信義區</b></span><span>開課日期：<b>11 月 8 日</b></span><span>學員編號：<b>A-1024</b></span></div></header>
        <div class="sp-pad"><div class="sp-line"></div><div class="sp-x">✕</div><div class="sp-ph">請在此簽名</div><canvas></canvas></div>
        <div class="sp-tools">
          ${Object.entries(INK).slice(0, 3).map(([n, c], i) => `<button class="sp-sw" data-c="${c}" style="background:${c}" aria-pressed="${i === 0}" title="${n}"></button>`).join("")}
          <label>筆寬<input type="range" min="1.5" max="6" step="0.5" value="3.5"></label>
          <span class="sp-count">0 筆畫</span><span class="sp-grow"></span>
          <button class="btn" data-a="demo">示範簽名</button><button class="btn" data-a="undo">復原</button>
          <button class="btn" data-a="clear">清除</button><button class="btn primary" data-a="save">下載 PNG</button>
        </div></div></div>`);
      const canvas = ctx.$("canvas"), ph = ctx.$(".sp-ph"), count = ctx.$(".sp-count");
      const pad = makePad(ctx, canvas, { minWidth: 0.8, maxWidth: 3.5, penColor: INK.墨黑 }, { onFit: () => refresh() });
      let stop = null;
      const halt = () => { if (stop) { stop(); stop = null; } };
      function refresh() {
        const n = pad.toData().length;
        count.textContent = `${n} 筆畫`;
        ph.textContent = "請在此簽名";
        ph.hidden = n > 0;
      }
      const demo = () => {
        halt();
        const opts = { penColor: pad.penColor, minWidth: pad.minWidth, maxWidth: pad.maxWidth };
        stop = play(ctx, pad, sampleStrokes(canvas.offsetWidth, canvas.offsetHeight, opts), { after: refresh });
      };
      pad.addEventListener("beginStroke", halt);
      pad.addEventListener("endStroke", refresh);
      ctx.$$(".sp-sw").forEach((b) => ctx.on(b, "click", () => {
        ctx.$$(".sp-sw").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        pad.penColor = b.dataset.c;
      }));
      ctx.on(ctx.$(".sp-tools input"), "input", (e) => { pad.maxWidth = +e.target.value; pad.minWidth = pad.maxWidth / 4; });
      const act = {
        demo,
        undo() { halt(); const d = pad.toData(); d.pop(); pad.fromData(d); refresh(); },
        clear() { halt(); pad.clear(); refresh(); },
        save() {
          if (pad.isEmpty()) { ph.textContent = "請先簽名再下載"; ph.hidden = false; return; }
          const a = h("a", { href: pad.toDataURL("image/png"), download: "signature.png" });
          a.click();
        },
      };
      ctx.$$(".sp-tools [data-a]").forEach((b) => ctx.on(b, "click", act[b.dataset.a]));
      ctx.timeout(demo, 60);
    },
  },
  {
    id: "width", title: "筆寬參數",
    api: "{ minWidth, maxWidth, velocityFilterWeight }",
    desc: "同一筆簽名資料交給四種設定重畫：寬度＝maxWidth ÷（速度＋1），不低於 minWidth；velocityFilterWeight 越小，速度變化越平滑。",
    hint: "在任一格簽名，四格同步重畫・拖動書寫速度",
    mount(ctx) {
      const CFG = [
        { name: "預設值", o: { minWidth: 0.5, maxWidth: 2.5, velocityFilterWeight: 0.7 } },
        { name: "粗細落差大", o: { minWidth: 0.4, maxWidth: 7, velocityFilterWeight: 0.7 } },
        { name: "強力平滑", o: { minWidth: 0.4, maxWidth: 7, velocityFilterWeight: 0.15 } },
        { name: "固定寬度", o: { minWidth: 2.2, maxWidth: 2.2, velocityFilterWeight: 0.7 } },
      ];
      ctx.html(`<div class="sp-fill sp-grid">${CFG.map((c) => `<div class="sp-card">${tag(`${c.name} <code>min ${c.o.minWidth}・max ${c.o.maxWidth}・vfw ${c.o.velocityFilterWeight}</code>`)}<canvas></canvas></div>`).join("")}</div>`);
      let speed = 1, own = null;
      const pads = ctx.$$("canvas").map((cv, i) => makePad(ctx, cv, { ...CFG[i].o, penColor: INK.墨黑 }));
      // Speed scales the recorded timestamps, which changes velocity and therefore width.
      const faster = (groups) => groups.map((g) => ({ ...g, points: g.points.map((p) => ({ ...p, time: g.points[0].time + (p.time - g.points[0].time) / speed })) }));
      const strokes = () => {
        const cv = ctx.$("canvas");
        return own ? faster(own) : bare(sampleStrokes(cv.offsetWidth, cv.offsetHeight, {}, speed));
      };
      const redraw = () => { const s = strokes(); pads.forEach((p) => p.fromData(s)); };
      pads.forEach((p) => p.addEventListener("endStroke", () => {
        const last = p.toData().pop();
        const t0 = last.points[0].time;
        // Store timing multiplied by the current speed so faster() renders the stroke as it was drawn.
        own = [...(own || []), { points: last.points.map((pt) => ({ ...pt, time: t0 + (pt.time - t0) * speed })) }];
        redraw();
      }));
      ctx.slider("書寫速度", { min: 0.3, max: 3, step: 0.1, value: 1, format: (v) => `×${v.toFixed(1)}` }, (v) => { speed = v; redraw(); });
      ctx.button("清除", () => { own = []; pads.forEach((p) => p.clear()); });
      ctx.button("範例", () => { own = null; redraw(); });
      ctx.timeout(redraw, 60);
      ctx.onResize(() => ctx.frame(1).then(redraw));
    },
  },
  {
    id: "color", title: "筆色與橡皮擦",
    api: "pad.penColor・backgroundColor + redraw()・compositeOperation: \"destination-out\"",
    desc: "每一筆都記住自己的筆色與合成模式。橡皮擦就是 destination-out，連背景色一起擦掉，所以換背景後擦痕仍會透出棋盤格。",
    hint: "換筆色或切到橡皮擦再畫・切換背景",
    mount(ctx) {
      ctx.html(`<div class="sp-fill" style="display:flex"><div class="sp-card sp-check" style="flex:1">${tag("棋盤格＝透明像素", "br")}<canvas></canvas></div></div>`);
      const cv = ctx.$("canvas");
      const pad = makePad(ctx, cv, { minWidth: 1, maxWidth: 4.5, penColor: INK.墨黑, backgroundColor: "rgba(0,0,0,0)" });
      let erase = false, penColor = INK.墨黑;
      const apply = () => {
        pad.compositeOperation = erase ? "destination-out" : "source-over";
        pad.minWidth = erase ? 9 : 1; pad.maxWidth = erase ? 14 : 4.5;
        pad.penColor = erase ? "#000" : penColor;
      };
      const names = ["墨黑", "鋼筆藍", "朱紅", "螢光黃", "白"];
      ctx.group(names, 0, (i) => { penColor = INK[names[i]]; erase = false; apply(); tool.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === 0))); });
      const tool = ctx.group(["筆", "橡皮擦"], 0, (i) => { erase = i === 1; apply(); });
      const BG = ["rgba(0,0,0,0)", "#f4efe1", "#1d2a44"];
      ctx.group(["透明", "米白", "夜藍"], 0, (i) => { pad.backgroundColor = BG[i]; pad.redraw(); });
      const demo = () => {
        const w = cv.offsetWidth, hh = cv.offsetHeight;
        const base = sampleStrokes(w, hh);
        const shift = (g, dy, color, extra = {}) => ({ ...g, ...extra, penColor: color, points: g.points.map((p) => ({ ...p, y: p.y + dy })) });
        const groups = [
          shift(base[0], -hh * 0.18, INK.鋼筆藍, { minWidth: 1, maxWidth: 4.5 }),
          shift(base[0], hh * 0.12, INK.朱紅, { minWidth: 1, maxWidth: 4.5 }),
          shift(base[1], -hh * 0.05, INK.螢光黃, { minWidth: 3, maxWidth: 8 }),
        ];
        const zig = [];
        for (let i = 0; i <= 40; i++) zig.push({ x: w * (0.3 + 0.4 * (i / 40)), y: hh * (0.35 + 0.3 * (i % 2)), pressure: 0.5, time: 5000 + i * 30 });
        groups.push({ penColor: "#000", minWidth: 9, maxWidth: 14, velocityFilterWeight: 0.7, compositeOperation: "destination-out", points: zig });
        play(ctx, pad, groups, { perFrame: 8 });
      };
      ctx.timeout(demo, 60);
    },
  },
  {
    id: "undo", title: "復原與重播",
    api: "toData() → PointGroup[]・fromData(groups)・point.time",
    desc: "toData() 回傳每一筆的點座標、壓力與時間戳，可存成 JSON。復原就是 pop 後 fromData()；重播依時間戳還原真實書寫節奏。",
    hint: "簽幾筆後按復原、重做、重播",
    mount(ctx) {
      ctx.html(`<div class="sp-fill sp-split"><div class="sp-card"><canvas></canvas></div>
        <div class="panel sp-side"><h3>筆畫清單<small class="sp-sum"></small></h3><div class="sp-rows"></div><pre class="sp-pre"></pre></div></div>`);
      const cv = ctx.$("canvas");
      const pad = makePad(ctx, cv, { minWidth: 0.8, maxWidth: 3.6, penColor: INK.鋼筆藍 });
      let redo = [], stop = null;
      const halt = () => { if (stop) { stop(); stop = null; } };
      const list = () => {
        const d = pad.toData();
        const json = JSON.stringify(d);
        ctx.$(".sp-sum").textContent = `${d.length} 筆・${fmt(pointCount(d))} 點・JSON ${kb(new TextEncoder().encode(json).length)}`;
        ctx.$(".sp-rows").innerHTML = d.slice(-6).map((g, i) => {
          const dur = g.points.length > 1 ? g.points[g.points.length - 1].time - g.points[0].time : 0;
          return `<div><i style="background:${g.penColor}"></i>第 ${d.length - Math.min(6, d.length) + i + 1} 筆<span class="n">${g.points.length} 點・${fmt(dur)} ms</span></div>`;
        }).join("") || `<div>尚無筆畫</div>`;
        ctx.$(".sp-pre").textContent = json.length > 900 ? json.slice(0, 900) + " …" : json;
      };
      pad.addEventListener("beginStroke", halt);
      pad.addEventListener("endStroke", () => { redo = []; list(); });
      ctx.button("復原", () => { halt(); const d = pad.toData(); if (d.length) { redo.push(d.pop()); pad.fromData(d); list(); } });
      ctx.button("重做", () => { halt(); if (redo.length) { pad.fromData([...pad.toData(), redo.pop()]); list(); } });
      // Replay with the recorded timestamps; long pauses between strokes are capped at 300 ms.
      const replay = () => {
        halt();
        const d = pad.toData();
        if (!d.length) return;
        const timeline = [];
        let clock = 0, prev = null;
        d.forEach((g) => g.points.forEach((p, i) => {
          clock += prev == null ? 0 : Math.min(p.time - prev, i === 0 ? 300 : 120);
          prev = p.time;
          timeline.push(clock);
        }));
        let t0 = 0;
        stop = ctx.raf((t) => {
          t0 = t0 || t;
          let n = 0;
          while (n < timeline.length && timeline[n] <= t - t0) n++;
          pad.fromData(slicePoints(d, Math.max(1, n)));
          if (n >= timeline.length) halt();
        });
      };
      ctx.button("重播", replay, { primary: true });
      ctx.button("清除", () => { halt(); redo = []; pad.clear(); list(); });
      list();
      ctx.timeout(() => {
        const s = sampleStrokes(cv.offsetWidth, cv.offsetHeight, { penColor: INK.鋼筆藍, minWidth: 0.8, maxWidth: 3.6 });
        s[1].penColor = INK.朱紅;
        pad.fromData(s);
        list();
        replay();
      }, 60);
    },
  },
  {
    id: "export", title: "匯出格式",
    api: "toDataURL('image/png')・toDataURL('image/jpeg', q)・toSVG({ includeBackgroundColor })・fromDataURL()",
    desc: "同一份簽名輸出 PNG、JPEG、SVG，並把 PNG 用 fromDataURL() 讀回新的簽名板驗證。JPEG 沒有透明度，背景透明時會變黑。",
    hint: "簽名後結果即時更新・下載只在按下按鈕時發生",
    mount(ctx) {
      const card = (k, title) => `<div class="sp-card sp-out" data-k="${k}">${tag(title)}<div class="sp-img sp-check"></div><div class="sp-info"><span></span>${k === "back" ? "" : `<button class="btn" type="button">下載</button>`}</div></div>`;
      ctx.html(`<div class="sp-fill sp-exp"><div class="sp-card">${tag("簽名板")}<canvas></canvas></div>
        ${card("png", "PNG")}${card("jpg", "JPEG")}${card("svg", "SVG")}${card("back", "PNG 讀回")}</div>`);
      const cv = ctx.$("canvas");
      const pad = makePad(ctx, cv, { minWidth: 0.8, maxWidth: 3.4, penColor: INK.鋼筆藍, backgroundColor: "#ffffff" });
      const backCv = h("canvas");
      ctx.$('[data-k="back"] .sp-img').append(backCv);
      const back = makePad(ctx, backCv, { penColor: INK.朱紅 }, { onFit: () => exportAll() });
      let quality = 0.6, svgBg = true;
      const out = {};
      const show = (k, url, info) => {
        const box = ctx.$(`[data-k="${k}"]`);
        let img = box.querySelector("img");
        if (!img) { img = h("img", { alt: k }); box.querySelector(".sp-img").append(img); }
        img.src = url;
        box.querySelector(".sp-info span").innerHTML = info;
        out[k] = url;
      };
      const exportAll = async () => {
        if (pad.isEmpty()) return;
        const png = pad.toDataURL("image/png");
        show("png", png, `image/png・<b>${kb(dataUrlBytes(png))}</b>`);
        const jpg = pad.toDataURL("image/jpeg", quality);
        show("jpg", jpg, `image/jpeg q${quality}・<b>${kb(dataUrlBytes(jpg))}</b>`);
        const svg = pad.toSVG({ includeBackgroundColor: svgBg });
        const svgUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
        if (out.svg) URL.revokeObjectURL(out.svg);
        show("svg", svgUrl, `image/svg+xml・<b>${kb(new TextEncoder().encode(svg).length)}</b>・${(svg.match(/<path/g) || []).length} path`);
        // Read the PNG back into a fresh pad; reviewers can keep signing on top of it.
        back.clear();
        // Fit the PNG inside the card without stretching (fromDataURL takes size and offset in CSS px).
        const bw = backCv.offsetWidth, bh = backCv.offsetHeight, k = Math.min(bw / cv.offsetWidth, bh / cv.offsetHeight);
        const width = cv.offsetWidth * k, height = cv.offsetHeight * k;
        await back.fromDataURL(png, { width, height, xOffset: (bw - width) / 2, yOffset: (bh - height) / 2 });
        ctx.$('[data-k="back"] .sp-info span').innerHTML = `fromDataURL()・isEmpty() = <b>${back.isEmpty()}</b>`;
      };
      ctx.onCleanup(() => out.svg && URL.revokeObjectURL(out.svg));
      const names = { png: "signature.png", jpg: "signature.jpg", svg: "signature.svg" };
      ["png", "jpg", "svg"].forEach((k) => ctx.on(ctx.$(`[data-k="${k}"] .btn`), "click", () => {
        if (out[k]) h("a", { href: out[k], download: names[k] }).click();
      }));
      pad.addEventListener("endStroke", exportAll);
      ctx.toggle("白色背景", true, (v) => { pad.backgroundColor = v ? "#ffffff" : "rgba(0,0,0,0)"; pad.redraw(); exportAll(); });
      ctx.toggle("SVG 含背景色", true, (v) => { svgBg = v; exportAll(); });
      ctx.slider("JPEG 品質", { min: 0.1, max: 1, step: 0.1, value: quality, format: (v) => v.toFixed(1) }, (v) => { quality = v; exportAll(); });
      ctx.timeout(() => {
        pad.fromData(sampleStrokes(cv.offsetWidth, cv.offsetHeight, { penColor: INK.鋼筆藍, minWidth: 0.8, maxWidth: 3.4 }));
        exportAll();
      }, 60);
    },
  },
  {
    id: "dpi", title: "高 DPI 縮放",
    api: "canvas.width = offsetWidth × ratio・ctx.scale(ratio, ratio)・redraw()",
    desc: "左邊畫布只用 1 倍像素，右邊依 devicePixelRatio（至少 2 倍）放大底層像素；下排放大鏡看真實像素密度。拖寬度時用 redraw() 依 toData() 的點資料重畫，筆畫不會消失。",
    hint: "在任一格簽名，放大鏡跟著筆尖・拖動版面寬度",
    mount(ctx) {
      const hi = () => Math.max(dpr(), 2);
      ctx.html(`<div class="sp-fill"><div class="sp-dpi" style="height:100%">
        <div class="sp-card">${tag(`ratio 1 <code>未處理 DPR</code>`)}<canvas></canvas></div>
        <div class="sp-card">${tag(`ratio ${hi()} <code>依 DPR 放大</code>`)}<canvas></canvas></div>
        <div class="sp-mag"><canvas></canvas>${tag("放大鏡 ×5", "br")}</div><div class="sp-mag"><canvas></canvas>${tag("放大鏡 ×5", "br")}</div></div></div>`);
      const [c1, c2, m1, m2] = ctx.$$("canvas");
      let fits = 0;
      const status = h("span", { class: "sp-count" });
      const pads = [makePad(ctx, c1, { minWidth: 0.6, maxWidth: 2.6 }, { ratio: () => 1, onFit: () => fits++ }),
        makePad(ctx, c2, { minWidth: 0.6, maxWidth: 2.6 }, { ratio: hi, onFit: () => fits++ })];
      let focus = { x: 0.3, y: 0.55 };
      const magnify = () => {
        [[c1, m1], [c2, m2]].forEach(([src, dst]) => {
          const r = src.width / Math.max(1, src.offsetWidth);
          const W = dst.offsetWidth, H = dst.offsetHeight, k = Math.min(2, dpr());
          dst.width = Math.round(W * k); dst.height = Math.round(H * k);
          const g = dst.getContext("2d");
          g.imageSmoothingEnabled = false;
          g.fillStyle = "#fdfcf8"; g.fillRect(0, 0, dst.width, dst.height);
          const sw = W / 5, sh = H / 5;
          const sx = Math.max(0, Math.min(src.offsetWidth - sw, focus.x * src.offsetWidth - sw / 2));
          const sy = Math.max(0, Math.min(src.offsetHeight - sh, focus.y * src.offsetHeight - sh / 2));
          g.drawImage(src, sx * r, sy * r, sw * r, sh * r, 0, 0, dst.width, dst.height);
        });
        status.textContent = `DPR ${window.devicePixelRatio}・重配 ${fits} 次・${pads[0].toData().length} 筆`;
      };
      const sync = (from, to) => () => { to.fromData(from.toData()); magnify(); };
      pads[0].addEventListener("endStroke", sync(pads[0], pads[1]));
      pads[1].addEventListener("endStroke", sync(pads[1], pads[0]));
      [c1, c2].forEach((cv) => ctx.on(cv, "pointermove", (e) => {
        const r = cv.getBoundingClientRect();
        focus = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
        magnify();
      }));
      const grid = ctx.$(".sp-dpi");
      ctx.slider("版面寬度", { min: 50, max: 100, step: 5, value: 100, format: (v) => `${v}%` }, (v) => {
        grid.style.width = `${v}%`;
        ctx.frame(1).then(magnify);
      });
      ctx.controls.append(status);
      ctx.onResize(() => ctx.frame(1).then(magnify));
      ctx.timeout(() => {
        const s = bare(sampleStrokes(c1.offsetWidth, c1.offsetHeight));
        pads.forEach((p) => p.fromData(s));
        magnify();
      }, 60);
    },
  },
  {
    id: "sample", title: "取樣與事件",
    api: "{ throttle, minDistance }・addEventListener('beginStroke' | 'beforeUpdateStroke' | 'endStroke')",
    desc: "同一支模擬筆（合成 PointerEvent，走函式庫真正的輸入流程）同時畫三格：throttle 限制每秒處理次數，minDistance 丟掉太近的點，點數差很多但形狀相近。",
    hint: "按「再畫一次」或自己在任一格簽名",
    mount(ctx) {
      const CFG = [
        { name: "不節流", o: { throttle: 0, minDistance: 0 } },
        { name: "預設值", o: { throttle: 16, minDistance: 5 } },
        { name: "大幅精簡", o: { throttle: 50, minDistance: 18 } },
      ];
      ctx.html(`<div class="sp-fill sp-three">${CFG.map((c) => `<div class="sp-card">${tag(`${c.name} <code>throttle ${c.o.throttle}・minDistance ${c.o.minDistance}</code>`)}<canvas></canvas>
        <div class="sp-stat"><span>輸入<b data-s="in">0</b></span><span>處理<b data-s="up">0</b></span><span>存點<b data-s="pt">0</b></span></div></div>`).join("")}
        <div class="panel sp-log"></div></div>`);
      const cards = ctx.$$(".sp-card");
      const log = ctx.$(".sp-log");
      const lines = [];
      const say = (s) => { lines.unshift(s); lines.length = 4; log.innerHTML = lines.filter(Boolean).join("<br>"); };
      // Throttle and minDistance are read in the constructor, so each config gets its own pad.
      const pads = cards.map((card, i) => {
        const cv = card.querySelector("canvas");
        const pad = makePad(ctx, cv, { ...CFG[i].o, minWidth: 0.8, maxWidth: 3.2, penColor: INK.墨黑 });
        const st = { in: 0, up: 0 };
        const put = (k, v) => (card.querySelector(`[data-s="${k}"]`).textContent = fmt(v));
        const paint = () => { put("in", st.in); put("up", st.up); put("pt", pointCount(pad.toData())); };
        ctx.on(cv, "pointermove", (e) => { if (e.buttons === 1) { st.in++; } });
        pad.addEventListener("beginStroke", (e) => { st.in = 0; st.up = 0; say(`<b>${CFG[i].name}</b> beginStroke・${e.detail.type}・(${e.detail.x.toFixed(0)}, ${e.detail.y.toFixed(0)})`); });
        pad.addEventListener("beforeUpdateStroke", () => { st.up++; });
        pad.addEventListener("endStroke", (e) => { paint(); say(`<b>${CFG[i].name}</b> endStroke・${e.detail.type}・輸入 ${st.in} 次，處理 ${st.up} 次，最後一筆 ${pad.toData().slice(-1)[0].points.length} 點`); });
        ctx.interval(paint, 200);
        return { pad, cv };
      });
      let hz = 250;
      const pen = (k) => ({ x: 0.1 + 0.8 * k + 0.05 * Math.sin(k * 30), y: 0.5 - 0.22 * Math.sin(k * 30) * Math.cos(k * 4) });
      let busy = false;
      // Drive each pad with synthetic pointer events; distinct pointerIds keep the strokes apart.
      async function scribble() {
        if (busy) return;
        busy = true;
        pads.forEach((p) => p.pad.clear());
        const N = 200;
        const fire = (p, type, k, buttons) => {
          const r = p.cv.getBoundingClientRect();
          const q = pen(k);
          p.cv.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 40 + pads.indexOf(p), pointerType: "pen",
            isPrimary: false, buttons, button: type === "pointermove" ? -1 : 0, pressure: buttons ? 0.5 : 0, clientX: r.left + q.x * r.width, clientY: r.top + q.y * r.height }));
        };
        try {
          pads.forEach((p) => fire(p, "pointerdown", 0, 1));
          for (let i = 1; i <= N; i++) {
            pads.forEach((p) => fire(p, "pointermove", i / N, 1));
            await ctx.sleep(1000 / hz);
          }
          await ctx.sleep(60);
          pads.forEach((p) => fire(p, "pointerup", 1, 0));
        } finally { busy = false; }
      }
      ctx.group(["60 Hz 輸入", "250 Hz 輸入"], 1, (i) => { hz = i ? 250 : 60; scribble(); });
      ctx.button("再畫一次", scribble, { primary: true });
      ctx.timeout(scribble, 60);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "pad.fromData(groups)・pad.toSVG()",
    desc: "產生總點數從一千到二十萬的簽名資料，量 fromData() 重繪與 toSVG() 輸出的耗時與 SVG 大小。右側是最後一輪的重繪結果。",
    hint: "按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="sp-bv"><canvas></canvas><div class="sp-tag br"></div></div>`);
      const cv = ctx.$("canvas"), info = ctx.$(".sp-bv .sp-tag");
      // Software (CPU) canvas: GPU canvases defer rasterization to another process, so timings would miss the real drawing cost.
      const pad = makePad(ctx, cv, { minWidth: 0.5, maxWidth: 2.4, penColor: INK.墨黑, canvasContextOptions: { willReadFrequently: true } });
      const g2d = cv.getContext("2d", { willReadFrequently: true });
      ctx.controls.classList.add("bottom");
      const colors = [INK.墨黑, INK.鋼筆藍, INK.朱紅];
      // Smooth random-walk strokes of 250 points each, kept inside the canvas.
      const make = (n) => {
        const w = cv.offsetWidth, hh = cv.offsetHeight, groups = [];
        let left = n, time = 1000, seed = 7;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        while (left > 0) {
          const len = Math.min(250, left);
          let x = rnd() * w, y = rnd() * hh, a = rnd() * 6.28;
          const pts = [];
          for (let i = 0; i < len; i++) {
            a += (rnd() - 0.5) * 0.6;
            x = Math.max(4, Math.min(w - 4, x + Math.cos(a) * 3));
            y = Math.max(4, Math.min(hh - 4, y + Math.sin(a) * 3));
            time += 6 + rnd() * 10;
            pts.push({ x, y, pressure: 0.5, time });
          }
          groups.push({ penColor: colors[groups.length % 3], minWidth: 0.5, maxWidth: 2.4, velocityFilterWeight: 0.7, dotSize: 0, compositeOperation: "source-over", points: pts });
          left -= len;
        }
        return groups;
      };
      ctx.bench({
        label: "總點數", unit: "點",
        sizes: [1000, 5000, 10000, 25000, 50000, 100000, 200000],
        target: 1000, budget: 2000,
        prepare: (n) => make(n),
        async run(n, groups) {
          const t0 = performance.now();
          pad.fromData(groups);
          // Reading one pixel flushes the recorded draw calls, so the timing includes the actual pixel work.
          g2d.getImageData(0, 0, 1, 1);
          const t1 = performance.now();
          const svg = pad.toSVG();
          const t2 = performance.now();
          const size = svg.length;
          info.textContent = `${fmt(n)} 點・${fmt(groups.length)} 筆・SVG ${kb(size)}`;
          return `重繪 ${fmtMs(t1 - t0)}・SVG ${fmtMs(t2 - t1)}・${kb(size)}`;
        },
        note: "fromData 每段曲線依長度拆成許多小圓逐一填色，成本跟總長度成正比（畫布改用 CPU 繪製，計時含讀回一個像素強制完成點陣化）；toSVG 每段曲線產生一個 path 元素再序列化，記憶體與字串大小增長更快。單輪超過 2 秒就停止加碼。實務上可提高 minDistance、throttle 降低點數。",
      });
      ctx.timeout(() => { pad.fromData(make(3000)); info.textContent = "預覽：3,000 點"; }, 60);
    },
  },
] });
</script>
</body>
