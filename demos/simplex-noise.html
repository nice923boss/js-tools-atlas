<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simplex-noise 示範：會緩慢演化的等高線地形圖</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: #efe6d2; }
  #map { position: fixed; inset: 0; display: block; cursor: grab; touch-action: none; }
  #map.drag { cursor: grabbing; }
  .cart, .legend {
    position: fixed; z-index: 40; color: #3b2d1f;
    background: rgba(246, 239, 222, 0.92); border: 1px solid #8a6d4b; border-radius: 4px;
    box-shadow: 0 0 0 3px rgba(246, 239, 222, 0.92), 0 0 0 4px #8a6d4b;
  }
  .cart { left: 22px; top: 22px; padding: 6px 12px; line-height: 1.35; }
  .cart b { display: block; font-size: 16px; letter-spacing: 2px; font-family: "Noto Serif TC", "PMingLiU", serif; }
  .cart span { font-size: 11px; color: #7a6248; }
  .legend { right: 22px; bottom: 22px; padding: 6px 10px 4px; font-size: 10px; width: 190px; }
  .legend .bar { height: 9px; border: 1px solid #8a6d4b; margin: 3px 0 2px; }
  .legend .ticks { position: relative; height: 13px; font-family: var(--mono); color: #6b553d; }
  .legend .ticks span { position: absolute; top: 0; transform: translateX(-50%); }
  .legend .ticks span:first-child { transform: none; }
  .legend .ticks span:last-child { transform: translateX(-100%); }
  .hint { left: 22px; bottom: 22px; }
  .controls { top: 22px; right: 22px; }
  @media (max-width: 560px) {
    .cart { top: 66px; }
    .legend { bottom: 66px; width: 170px; }
  }
</style>
</head>
<body class="paper">
<canvas id="map"></canvas>
<div class="cart"><b>虛構島嶼地形圖</b><span>示意資料・simplex noise 即時生成</span></div>
<div class="legend">
  <div>海拔（公尺）</div>
  <div class="bar" id="bar"></div>
  <div class="ticks" id="ticks"></div>
</div>
<div class="controls">
  <button class="btn" id="play" aria-pressed="true">演化中</button>
  <button class="btn" id="lines" aria-pressed="true">等高線</button>
  <button class="btn primary" id="seed">新島嶼</button>
</div>
<div class="hint">拖曳平移地圖・游標顯示海拔</div>

<script type="module">
import { createNoise3D } from "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm";

// Heightfield = fractal sum of 3D simplex noise (x, y, slowly moving time) shaped into an island.
// Colours come from a hypsometric lookup table, contours from marching squares on the same grid.
const CELL = 4;
const PEAK_M = 3950;
const STOPS = [
  [-1.0, "#24527a"], [-0.4, "#4a86b4"], [-0.08, "#9cc9df"], [0.0, "#e8dcae"], [0.04, "#a9cb8c"],
  [0.2, "#84b06c"], [0.38, "#cdb97e"], [0.56, "#ad8253"], [0.74, "#8d6e58"], [0.9, "#f5f1e8"],
];
const cv = document.getElementById("map");
const ctx = cv.getContext("2d");
const off = document.createElement("canvas");
const octx = off.getContext("2d");
let W, H, dpr, cols, rows, field, img;
let seed = 2026, noise3D, t = 0, playing = true, showLines = true, ox = 0, oy = 0, hover = null;

function mulberry32(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let r = Math.imul(a ^ (a >>> 15), 1 | a);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
function reseed() { noise3D = createNoise3D(mulberry32(seed)); }

// 512-entry colour lookup for elevation -1..1
const LUT = new Uint8ClampedArray(512 * 3);
(function buildLut() {
  const rgb = STOPS.map(([e, hex]) => [e, parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]);
  for (let k = 0; k < 512; k++) {
    const e = k / 255.5 - 1;
    let s = 0;
    while (s < rgb.length - 2 && e > rgb[s + 1][0]) s++;
    const [e0, r0, g0, b0] = rgb[s], [e1, r1, g1, b1] = rgb[s + 1];
    const f = Math.max(0, Math.min(1, (e - e0) / (e1 - e0)));
    LUT[k * 3] = r0 + (r1 - r0) * f; LUT[k * 3 + 1] = g0 + (g1 - g0) * f; LUT[k * 3 + 2] = b0 + (b1 - b0) * f;
  }
  // Legend spans elevation -0.4..0.92, ticks placed at their true positions
  const pos = (e) => (((e + 0.4) / 1.32) * 100).toFixed(1) + "%";
  const css = STOPS.filter(([e]) => e >= -0.4).map(([e, hex]) => `${hex} ${pos(e)}`).join(",");
  document.getElementById("bar").style.background = `linear-gradient(90deg, ${css})`;
  document.getElementById("ticks").innerHTML = [-800, 0, 1000, 2000, 3950]
    .map((m) => `<span style="left:${pos(m < 0 ? m / 2000 : (m / PEAK_M) * 0.92)}">${m}</span>`).join("");
})();

// Paper grain, generated once
const grain = (() => {
  const g = document.createElement("canvas");
  g.width = g.height = 128;
  const gx = g.getContext("2d");
  const d = gx.createImageData(128, 128);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 120 + Math.random() * 135;
    d.data[i] = v; d.data[i + 1] = v * 0.95; d.data[i + 2] = v * 0.85; d.data[i + 3] = 255;
  }
  gx.putImageData(d, 0, 0);
  return ctx.createPattern(g, "repeat");
})();

function elevation(px, py) {
  const s = 1 / (Math.min(W, H) * 0.55);
  const x = (px + ox) * s, y = (py + oy) * s;
  let amp = 1, f = 1, sum = 0, norm = 0;
  for (let o = 0; o < 5; o++) {
    sum += amp * noise3D(x * f, y * f, t + o * 7.3);
    norm += amp; amp *= 0.5; f *= 2.03;
  }
  const dx = (px - W / 2) / (W * 0.5), dy = (py - H / 2) / (H * 0.5);
  return (sum / norm) * 1.15 + 0.3 - (dx * dx + dy * dy) * 0.8;
}

function toMeters(e) { return Math.round(e > 0 ? Math.min(1, e / 0.92) * PEAK_M : e * 2000); }

function computeField() {
  let peak = { e: -Infinity, i: 0, j: 0 };
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const e = elevation(i * CELL, j * CELL);
      field[j * cols + i] = e;
      if (e > peak.e && i > 4 && j > 4 && i < cols - 5 && j < rows - 5) peak = { e, i, j };
    }
  }
  return peak;
}

function paintRelief() {
  const d = img.data;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const k = j * cols + i, e = field[k];
      const li = Math.max(0, Math.min(511, Math.round((e + 1) * 255.5))) * 3;
      let shade = 1;
      if (e > 0 && i > 0 && j > 0 && i < cols - 1 && j < rows - 1) {
        // Hillshade with light from the north-west
        const gx = field[k + 1] - field[k - 1], gy = field[k + cols] - field[k - cols];
        shade = Math.max(0.6, Math.min(1.25, 0.95 + (gx + gy) * 9));
      }
      d[k * 4] = LUT[li] * shade; d[k * 4 + 1] = LUT[li + 1] * shade; d[k * 4 + 2] = LUT[li + 2] * shade; d[k * 4 + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
}

// Marching squares: one path per level, linear interpolation along cell edges
function contour(level) {
  const lerp = (p, q) => (level - p) / (q - p || 1e-9);
  ctx.beginPath();
  for (let j = 0; j < rows - 1; j++) {
    for (let i = 0; i < cols - 1; i++) {
      const k = j * cols + i;
      const a = field[k], b = field[k + 1], c = field[k + cols + 1], d = field[k + cols];
      const idx = (a > level ? 8 : 0) | (b > level ? 4 : 0) | (c > level ? 2 : 0) | (d > level ? 1 : 0);
      if (idx === 0 || idx === 15) continue;
      const x = i * CELL, y = j * CELL;
      const T = () => [x + CELL * lerp(a, b), y];
      const R = () => [x + CELL, y + CELL * lerp(b, c)];
      const B = () => [x + CELL * lerp(d, c), y + CELL];
      const L = () => [x, y + CELL * lerp(a, d)];
      const seg = (p, q) => { ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]); };
      switch (idx) {
        case 1: case 14: seg(L(), B()); break;
        case 2: case 13: seg(B(), R()); break;
        case 3: case 12: seg(L(), R()); break;
        case 4: case 11: seg(T(), R()); break;
        case 6: case 9: seg(T(), B()); break;
        case 7: case 8: seg(T(), L()); break;
        case 5: seg(T(), R()); seg(L(), B()); break;
        case 10: seg(T(), L()); seg(B(), R()); break;
      }
    }
  }
  ctx.stroke();
}

function labelText(str, x, y, size, align) {
  ctx.font = `600 ${size}px "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
  ctx.textAlign = align || "left";
  ctx.lineWidth = 3; ctx.strokeStyle = "rgba(246,239,222,0.9)"; ctx.strokeText(str, x, y);
  ctx.fillStyle = "#3b2d1f"; ctx.fillText(str, x, y);
}

function draw() {
  const peak = computeField();
  paintRelief();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(off, -CELL / 2, -CELL / 2, cols * CELL, rows * CELL);

  // Graticule
  ctx.strokeStyle = "rgba(70,50,30,0.12)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 80; x < W; x += 80) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
  for (let y = 80; y < H; y += 80) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
  ctx.stroke();

  if (showLines) {
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 0.8;
    contour(-0.18); contour(-0.4);
    for (let k = 1; k <= 9; k++) {
      const index = k % 3 === 0;
      ctx.strokeStyle = index ? "rgba(92,58,28,0.75)" : "rgba(92,58,28,0.4)";
      ctx.lineWidth = index ? 1.3 : 0.7;
      contour(k * 0.1);
    }
  }
  ctx.strokeStyle = "#35546d"; ctx.lineWidth = 1.5;
  contour(0);

  // Summit marker
  if (peak.e > 0.05) {
    const px = peak.i * CELL, py = peak.j * CELL;
    ctx.fillStyle = "#3b2d1f";
    ctx.beginPath(); ctx.moveTo(px, py - 7); ctx.lineTo(px + 6, py + 4); ctx.lineTo(px - 6, py + 4); ctx.closePath(); ctx.fill();
    labelText(`主峰 ${toMeters(peak.e).toLocaleString("zh-TW")} 公尺`, px + 9, py + 4, 12);
  }

  // Paper grain and double frame
  ctx.globalCompositeOperation = "multiply";
  ctx.globalAlpha = 0.18; ctx.fillStyle = grain; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  ctx.strokeStyle = "#5b4630"; ctx.lineWidth = 2; ctx.strokeRect(8, 8, W - 16, H - 16);
  ctx.lineWidth = 0.8; ctx.strokeRect(13, 13, W - 26, H - 26);

  if (hover) {
    const e = elevation(hover.x, hover.y), m = toMeters(e);
    const txt = e > 0 ? `海拔 ${m.toLocaleString("zh-TW")} 公尺` : `水深 ${(-m).toLocaleString("zh-TW")} 公尺`;
    ctx.strokeStyle = "#3b2d1f"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(hover.x, hover.y, 7, 0, Math.PI * 2);
    ctx.moveTo(hover.x - 13, hover.y); ctx.lineTo(hover.x - 4, hover.y); ctx.moveTo(hover.x + 4, hover.y); ctx.lineTo(hover.x + 13, hover.y);
    ctx.moveTo(hover.x, hover.y - 13); ctx.lineTo(hover.x, hover.y - 4); ctx.moveTo(hover.x, hover.y + 4); ctx.lineTo(hover.x, hover.y + 13);
    ctx.stroke();
    const right = hover.x < W - 150;
    labelText(txt, hover.x + (right ? 16 : -16), hover.y - 12, 13, right ? "left" : "right");
  }
}

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + "px"; cv.style.height = H + "px";
  cols = Math.ceil(W / CELL) + 2; rows = Math.ceil(H / CELL) + 2;
  field = new Float32Array(cols * rows);
  off.width = cols; off.height = rows;
  img = octx.createImageData(cols, rows);
  draw();
}

let frame = 0, dirty = false;
function loop() {
  frame++;
  if (playing) { t += 0.0024; dirty = true; }
  // Redraw at ~30 fps; the noise field is the expensive part
  if (dirty && frame % 2 === 0) { dirty = false; draw(); }
  requestAnimationFrame(loop);
}

let drag = null;
cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, ox, oy }; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => {
  hover = { x: e.clientX, y: e.clientY };
  if (drag) { ox = drag.ox - (e.clientX - drag.x); oy = drag.oy - (e.clientY - drag.y); }
  dirty = true;
});
cv.addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("pointerleave", () => { hover = null; dirty = true; });

const playBtn = document.getElementById("play");
playBtn.addEventListener("click", () => {
  playing = !playing;
  playBtn.setAttribute("aria-pressed", playing);
  playBtn.textContent = playing ? "演化中" : "已暫停";
});
const linesBtn = document.getElementById("lines");
linesBtn.addEventListener("click", () => { showLines = !showLines; linesBtn.setAttribute("aria-pressed", showLines); dirty = true; });
document.getElementById("seed").addEventListener("click", () => { seed = Math.floor(Math.random() * 1e9); reseed(); ox = oy = 0; dirty = true; });

let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 120); });
reseed();
resize();
loop();
</script>
</body>
</html>
