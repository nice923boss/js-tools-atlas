<script type="module">
import { createNoise2D, createNoise3D, createNoise4D } from "https://cdn.jsdelivr.net/npm/simplex-noise@4.0.3/+esm";

const { h, fmt, fmtCompact } = Showcase;
const TAU = Math.PI * 2;
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);

// Seeded PRNG: simplex-noise takes any () => [0, 1) function, so a fixed seed gives a fixed picture.
function mulberry32(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const noises = (seed) => ({
  n2: createNoise2D(mulberry32(seed)),
  n3: createNoise3D(mulberry32(seed + 1)),
  n4: createNoise4D(mulberry32(seed + 2)),
});

// Colour lookup table: stops [[position, "#rrggbb"], ...] sampled into n RGB entries over [lo, hi].
function lut(stops, n = 256, lo = 0, hi = 1) {
  const rgb = stops.map(([p, hex]) => [p, parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]);
  const out = new Uint8ClampedArray(n * 3);
  for (let k = 0; k < n; k++) {
    const p = lo + ((hi - lo) * k) / (n - 1);
    let s = 0;
    while (s < rgb.length - 2 && p > rgb[s + 1][0]) s++;
    const [p0, r0, g0, b0] = rgb[s], [p1, r1, g1, b1] = rgb[s + 1];
    const f = clamp((p - p0) / (p1 - p0));
    out[k * 3] = r0 + (r1 - r0) * f; out[k * 3 + 1] = g0 + (g1 - g0) * f; out[k * 3 + 2] = b0 + (b1 - b0) * f;
  }
  return out;
}
const GRAY = lut([[0, "#0b1020"], [0.5, "#55657f"], [1, "#f4efe2"]]);
const INK = lut([[0, "#0e1120"], [0.4, "#2f416c"], [0.58, "#6f9cc4"], [0.78, "#e7d6ad"], [1, "#fff8ea"]]);
const PLANET = lut([[0, "#0a2340"], [0.47, "#22679a"], [0.5, "#dccb8e"], [0.53, "#79a45a"], [0.66, "#3e6c36"], [0.78, "#8b7661"], [0.88, "#f2efe8"], [1, "#ffffff"]]);
const GAS = lut([[0, "#2a1640"], [0.3, "#8c3f5d"], [0.55, "#e09f3e"], [0.75, "#f3d9a4"], [1, "#fff8e8"]]);
const TERRAIN = lut([[0, "#14324f"], [0.36, "#2f6f95"], [0.46, "#8cc0d6"], [0.48, "#e6d9a8"], [0.53, "#9cc47f"], [0.66, "#5f9150"], [0.8, "#a68a5b"], [0.9, "#7d6656"], [1, "#f6f3ec"]]);
const MAGMA = lut([[0, "#000004"], [0.2, "#2c115f"], [0.4, "#721f81"], [0.6, "#b73779"], [0.8, "#f1605d"], [0.92, "#feb078"], [1, "#fcfdbf"]]);
const VIRIDIS = lut([[0, "#440154"], [0.25, "#3b528b"], [0.5, "#21918c"], [0.75, "#5ec962"], [1, "#fde725"]]);

// Write one pixel from a LUT; v in [0, 1], optional brightness factor (Uint8ClampedArray clamps the result).
function put(d, o, L, v, shade = 1) {
  const li = ((v < 0 ? 0 : v > 1 ? 1 : v) * 255 + 0.5 | 0) * 3;
  d[o] = L[li] * shade; d[o + 1] = L[li + 1] * shade; d[o + 2] = L[li + 2] * shade; d[o + 3] = 255;
}

// Size a canvas to its CSS box (DPR capped at 2) and return a context in CSS pixels.
function fit(cv) {
  const w = cv.clientWidth, hh = cv.clientHeight, dpr = Math.min(devicePixelRatio || 1, 2);
  const W = Math.max(1, Math.round(w * dpr)), H = Math.max(1, Math.round(hh * dpr));
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { g, w, h: hh };
}

// Small pixel buffer scaled up onto a display canvas: noise is evaluated per cell, not per screen pixel.
function lowres() {
  const off = document.createElement("canvas");
  const og = off.getContext("2d");
  let img = null;
  return {
    size(cols, rows) {
      if (!img || img.width !== cols || img.height !== rows) { off.width = cols; off.height = rows; img = og.createImageData(cols, rows); }
      return img;
    },
    blit(g, w, hh) {
      this.commit();
      this.draw(g, 0, 0, w, hh);
    },
    commit() { og.putImageData(img, 0, 0); },
    draw(g, x, y, w, hh) {
      g.imageSmoothingEnabled = true;
      g.imageSmoothingQuality = "high";
      g.drawImage(off, x, y, w, hh);
    },
  };
}

function board(ctx, cls) {
  const b = h("div", { class: `board ${cls}` });
  ctx.el.append(b);
  return b;
}

// Dark panel with a canvas, a caption (function + note) and a stats chip.
function pane(fnText, subText) {
  const cv = h("canvas");
  const fn = h("b", { class: "fn", text: fnText });
  const sub = h("span", { text: subText || "" });
  const stat = h("div", { class: "tagr" });
  const el = h("div", { class: "pane" }, cv, h("div", { class: "tagl" }, fn, sub), stat);
  return { el, cv, fn, sub, stat };
}

// ---------- 1. island map ----------
const PEAK_M = 3950;
const ISLE_STOPS = [
  [-1.0, "#24527a"], [-0.4, "#4a86b4"], [-0.08, "#9cc9df"], [0.0, "#e8dcae"], [0.04, "#a9cb8c"],
  [0.2, "#84b06c"], [0.38, "#cdb97e"], [0.56, "#ad8253"], [0.74, "#8d6e58"], [0.9, "#f5f1e8"],
];
const ISLE_LUT = lut(ISLE_STOPS, 512, -1, 1);
const toMeters = (e) => Math.round(e > 0 ? Math.min(1, e / 0.92) * PEAK_M : e * 2000);

// ---------- 8. stress ----------
const BOPS = [
  { label: "noise2D", fn: "noise2D(x, y)" },
  { label: "noise3D", fn: "noise3D(x, y, 0.5)" },
  { label: "noise4D", fn: "noise4D(x, y, 0.5, 0.25)" },
  { label: "Math.random", fn: "Math.random() 對照組" },
];

Showcase.run({ scenes: [
  {
    id: "island", title: "島嶼地形圖", paper: true,
    api: "createNoise3D(mulberry32(seed))・五層 fBm・marching squares 等高線",
    desc: "高度是五層 3D simplex noise 的疊加（x、y 是地圖座標，第三維是緩慢前進的時間），再減去離中心的距離塑成島嶼。顏色查 512 階分層設色表，等高線用 marching squares 從同一張高度格網抽出，山體陰影取相鄰格的高差。傳入固定種子的亂數函式，同一個種子永遠長出同一座島。",
    hint: "拖曳平移地圖，游標顯示海拔",
    mount(ctx) {
      const cv = h("canvas");
      const seedEl = h("span");
      const bar = h("div", { class: "bar" });
      const ticks = h("div", { class: "ticks" });
      const wrap = h("div", { class: "isle" }, cv,
        h("div", { class: "cart" }, h("b", { text: "虛構島嶼地形圖" }), seedEl),
        h("div", { class: "legend" }, h("div", { text: "海拔（公尺）" }), bar, ticks));
      ctx.el.append(wrap);

      // Legend spans elevation -0.4..0.92, ticks placed at their true positions
      const pos = (e) => `${(((e + 0.4) / 1.32) * 100).toFixed(1)}%`;
      bar.style.background = `linear-gradient(90deg, ${ISLE_STOPS.filter(([e]) => e >= -0.4).map(([e, c]) => `${c} ${pos(e)}`).join(",")})`;
      for (const m of [-800, 0, 1000, 2000, 3950]) {
        const s = h("span", { text: String(m) });
        s.style.left = pos(m < 0 ? m / 2000 : (m / PEAK_M) * 0.92);
        ticks.append(s);
      }

      const g = cv.getContext("2d");
      const off = document.createElement("canvas");
      const og = off.getContext("2d");
      const CELL = 4;
      let W = 0, H = 0, dpr = 1, cols = 0, rows = 0, field, img;
      let seed = 2026, noise3D, t = 0, playing = true, showLines = true, ox = 0, oy = 0, hover = null, drag = null, dirty = true, frame = 0;
      const reseed = () => { noise3D = createNoise3D(mulberry32(seed)); seedEl.textContent = `示意資料・種子 ${seed}`; };

      // Paper grain, generated once
      const grain = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const cg = c.getContext("2d");
        const d = cg.createImageData(128, 128);
        const r = mulberry32(99);
        for (let i = 0; i < d.data.length; i += 4) {
          const v = 120 + r() * 135;
          d.data[i] = v; d.data[i + 1] = v * 0.95; d.data[i + 2] = v * 0.85; d.data[i + 3] = 255;
        }
        cg.putImageData(d, 0, 0);
        return g.createPattern(c, "repeat");
      })();

      function elevation(px, py) {
        const s = 1 / (Math.min(W, H) * 0.55);
        const x = (px + ox) * s, y = (py + oy) * s;
        let amp = 1, f = 1, sum = 0, norm = 0;
        for (let o = 0; o < 5; o++) {
          sum += amp * noise3D(x * f, y * f, t + o * 7.3);
          norm += amp; amp *= 0.5; f *= 2.03;
        }
        const dx = (px - W / 2) / (W * 0.5), dy = (py - H / 2) / (H * 0.5);
        return (sum / norm) * 1.15 + 0.3 - (dx * dx + dy * dy) * 0.8;
      }

      function computeField() {
        let peak = { e: -Infinity, i: 0, j: 0 };
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            const e = elevation(i * CELL, j * CELL);
            field[j * cols + i] = e;
            if (e > peak.e && i > 4 && j > 4 && i < cols - 5 && j < rows - 5) peak = { e, i, j };
          }
        }
        return peak;
      }

      function paintRelief() {
        const d = img.data;
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            const k = j * cols + i, e = field[k];
            const li = Math.max(0, Math.min(511, Math.round((e + 1) * 255.5))) * 3;
            let shade = 1;
            if (e > 0 && i > 0 && j > 0 && i < cols - 1 && j < rows - 1) {
              // Hillshade with light from the north-west
              const gx = field[k + 1] - field[k - 1], gy = field[k + cols] - field[k - cols];
              shade = Math.max(0.6, Math.min(1.25, 0.95 + (gx + gy) * 9));
            }
            d[k * 4] = ISLE_LUT[li] * shade; d[k * 4 + 1] = ISLE_LUT[li + 1] * shade; d[k * 4 + 2] = ISLE_LUT[li + 2] * shade; d[k * 4 + 3] = 255;
          }
        }
        og.putImageData(img, 0, 0);
      }

      // Marching squares: one path per level, linear interpolation along cell edges
      function contour(level) {
        const lerp = (p, q) => (level - p) / (q - p || 1e-9);
        g.beginPath();
        for (let j = 0; j < rows - 1; j++) {
          for (let i = 0; i < cols - 1; i++) {
            const k = j * cols + i;
            const a = field[k], b = field[k + 1], c = field[k + cols + 1], d = field[k + cols];
            const idx = (a > level ? 8 : 0) | (b > level ? 4 : 0) | (c > level ? 2 : 0) | (d > level ? 1 : 0);
            if (idx === 0 || idx === 15) continue;
            const x = i * CELL, y = j * CELL;
            const T = () => [x + CELL * lerp(a, b), y];
            const R = () => [x + CELL, y + CELL * lerp(b, c)];
            const B = () => [x + CELL * lerp(d, c), y + CELL];
            const L = () => [x, y + CELL * lerp(a, d)];
            const seg = (p, q) => { g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); };
            switch (idx) {
              case 1: case 14: seg(L(), B()); break;
              case 2: case 13: seg(B(), R()); break;
              case 3: case 12: seg(L(), R()); break;
              case 4: case 11: seg(T(), R()); break;
              case 6: case 9: seg(T(), B()); break;
              case 7: case 8: seg(T(), L()); break;
              case 5: seg(T(), R()); seg(L(), B()); break;
              case 10: seg(T(), L()); seg(B(), R()); break;
            }
          }
        }
        g.stroke();
      }

      function labelText(str, x, y, size, align) {
        g.font = `600 ${size}px "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
        g.textAlign = align || "left";
        g.lineWidth = 3; g.strokeStyle = "rgba(246,239,222,0.9)"; g.strokeText(str, x, y);
        g.fillStyle = "#3b2d1f"; g.fillText(str, x, y);
      }

      function draw() {
        const peak = computeField();
        paintRelief();
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.imageSmoothingEnabled = true;
        g.imageSmoothingQuality = "high";
        g.drawImage(off, -CELL / 2, -CELL / 2, cols * CELL, rows * CELL);

        // Graticule
        g.strokeStyle = "rgba(70,50,30,0.12)"; g.lineWidth = 1;
        g.beginPath();
        for (let x = 80; x < W; x += 80) { g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); }
        for (let y = 80; y < H; y += 80) { g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); }
        g.stroke();

        if (showLines) {
          g.lineJoin = "round";
          g.strokeStyle = "rgba(255,255,255,0.45)"; g.lineWidth = 0.8;
          contour(-0.18); contour(-0.4);
          for (let k = 1; k <= 9; k++) {
            const index = k % 3 === 0;
            g.strokeStyle = index ? "rgba(92,58,28,0.75)" : "rgba(92,58,28,0.4)";
            g.lineWidth = index ? 1.3 : 0.7;
            contour(k * 0.1);
          }
        }
        g.strokeStyle = "#35546d"; g.lineWidth = 1.5;
        contour(0);

        // Summit marker
        if (peak.e > 0.05) {
          const px = peak.i * CELL, py = peak.j * CELL;
          g.fillStyle = "#3b2d1f";
          g.beginPath(); g.moveTo(px, py - 7); g.lineTo(px + 6, py + 4); g.lineTo(px - 6, py + 4); g.closePath(); g.fill();
          labelText(`主峰 ${toMeters(peak.e).toLocaleString("zh-TW")} 公尺`, px + 9, py + 4, 12);
        }

        // Paper grain and double frame
        g.globalCompositeOperation = "multiply";
        g.globalAlpha = 0.18; g.fillStyle = grain; g.fillRect(0, 0, W, H);
        g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
        g.strokeStyle = "#5b4630"; g.lineWidth = 2; g.strokeRect(8, 8, W - 16, H - 16);
        g.lineWidth = 0.8; g.strokeRect(13, 13, W - 26, H - 26);

        if (hover) {

      const preview = () => show(sampleGrid(op, 65536), op);

      ctx.controls.classList.add("bottom");
      ctx.group(BOPS.map((x) => x.label), op, (i) => { op = i; preview(); });
      ctx.bench({
        label: "取樣次數", unit: "次",
        sizes: [1e4, 1e5, 5e5, 1e6, 2e6, 5e6, 1e7, 2e7],
        target: 1000, budget: 2000,
        run(n) {
          const which = op;
          const t0 = performance.now();
          const res = sampleGrid(which, n);
          const ms = performance.now() - t0;
          // Draw after the timer stops so canvas upload is not counted.
          ctx.timeout(() => show(res, which), 0);
          return `${fmtCompact(n / (ms / 1000))}／秒`;
        },
        note: "所有取樣在主執行緒同步執行。fBm 疊 N 層就是 N 次取樣，把每秒取樣數除以 N，再除以 60，就是 60 fps 下每幀能算的像素數。單輪超過 2 秒就停止加碼。",
      });
      preview();
    },
  },
] });
</script>
</body>
</html>
