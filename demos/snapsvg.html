<style>
  .stage { position: absolute; left: 0; right: 0; top: var(--sc-ctl-h, 0px); bottom: var(--sc-ctl-b, 0px); }

<script src="https://cdn.jsdelivr.net/npm/snapsvg@0.5.1/dist/snap.svg-min.js"></script>

<script>
// Snap.svg showcase: every scene builds SVG with Snap's API and animates it with mina (Snap.animate / el.animate).
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FG = css.getPropertyValue("--fg").trim() || "#ecebe6";
const MUTED = css.getPropertyValue("--muted").trim() || "#9b998f";
const LINE = "rgba(255,255,255,0.14)";
const fmt = Showcase.fmt;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const TAU = Math.PI * 2;
const IMG = (n) => `_shared/img/photo-${n}.jpg`;

// Redraw hook for an element's box size (window resize, control bar wrapping).
function watch(ctx, el, fn) {
  let raf = 0, lw = -1, lh = -1;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h || (w === lw && h === lh)) return;
      lw = w; lh = h;
      fn(w, h);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}
// Page coordinates from Snap's drag handlers into the paper's user space.
function svgPoint(p, x, y) {
  const pt = p.node.createSVGPoint();
  pt.x = x; pt.y = y;
  return pt.matrixTransform(p.node.getScreenCTM().inverse());
}
const halt = (p) => p.selectAll("*").forEach((el) => { el.stop(); });
const lastAnim = (el) => { const l = el.inAnim(); return l[l.length - 1].mina; };
// paper.filter() has no region; give it room for shadows and blur.
const region = (f) => f.attr({ filterUnits: "objectBoundingBox", x: "-20%", y: "-20%", width: "140%", height: "160%" });
// Snap 0.5.1 el.animate({ fill }) throws in current browsers: reading a colour fill back passes "rgb(...)" to querySelector.
// Colours are therefore tweened as RGB arrays with Snap.animate() and written with attr().
const rgbOf = (hex) => { const c = Snap.getRGB(hex); return [c.r, c.g, c.b]; };
const rgbHex = (v) => Snap.rgb(...v.slice(0, 3).map((x) => clamp(Math.round(x), 0, 255)));

// Owns looping mina animations for one scene so they can be paused together and stopped on cleanup.
function minaBag(ctx) {
  const live = new Set();
  let paused = false, epoch = 0;
  // mina treats pdif 0 as "running", so a pause in the same millisecond as the start would make resume() a no-op.
  const hold = (a) => { a.pause(); if (!a.pdif) a.pdif = 1; };
  // Drop anims that finished or were stopped: they are neither in mina's loop nor paused.
  const prune = () => { for (const a of live) if (!a.pdif && !mina.getById(a.id)) live.delete(a); };
  const own = (a) => { prune(); live.add(a); if (paused) hold(a); return a; };
  const alive = (e) => e === epoch && ctx.active;
  const bag = {
    track: own,
    // Number tween that restarts forever; swing reverses direction each round.
    tween(from, to, set, ms, ease, swing) {
      const e = epoch;
      let fwd = true;
      const run = () => {
        if (!alive(e)) return;
        own(Snap.animate(fwd ? from : to, fwd ? to : from, set, ms, ease, () => { if (swing) fwd = !fwd; run(); }));
      };
      run();
    },
    // Attribute loop: "swing" plays A to B and back, "repeat" jumps to A and plays A to B again.
    cycle(el, A, B, ms, ease, mode) {
      const e = epoch;
      let fwd = true;
      el.attr(A);
      const run = () => {
        if (!alive(e)) return;
        if (mode === "repeat") el.attr(A);
        el.animate(mode === "repeat" || fwd ? B : A, ms, ease, () => { fwd = !fwd; run(); });
        own(lastAnim(el));
      };
      run();
    },
    pause(flag) { prune(); paused = flag; for (const a of live) { if (flag) hold(a); else a.resume(); } },
    reset() { epoch++; for (const a of live) a.stop(); live.clear(); },
  };
  ctx.onCleanup(() => bag.reset());
  return bag;
}

// ---------- scene 1: lake day and night (ported from the original demo) ----------
const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgb2hex = (c) => "#" + c.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
const mix = (a, b, t) => rgb2hex(hex2rgb(a).map((v, i) => v + (hex2rgb(b)[i] - v) * t));
// Keyframes on sun elevation: night, twilight, golden hour, day
const KEYS = [-0.35, -0.05, 0.08, 0.35];
function pick(stops, e) {
  if (e <= KEYS[0]) return stops[0];
  for (let i = 1; i < KEYS.length; i++) {
    if (e <= KEYS[i]) return mix(stops[i - 1], stops[i], (e - KEYS[i - 1]) / (KEYS[i] - KEYS[i - 1]));
  }
  return stops[stops.length - 1];
}
const PAL = {
  skyTop: ["#070b26", "#1c2260", "#3d5fa8", "#2f80d8"],
  skyMid: ["#141a48", "#6b4a8e", "#f2a07b", "#7dbbf0"],
  skyBot: ["#262b5c", "#f08a6a", "#ffd59a", "#d2ecff"],
  far:    ["#1b2150", "#6a5a94", "#b48aa8", "#9cc0e0"],
  mid:    ["#151a40", "#4b4378", "#8a6e93", "#6f9fc6"],
  near:   ["#0f1330", "#2e2d55", "#4f5a6e", "#4f8a6a"],
  shore:  ["#070a1c", "#1a1a33", "#2b3a3a", "#2f5d46"],
  cloud:  ["#3a3f6b", "#f6a38f", "#ffe0c2", "#ffffff"],
  wall:   ["#2a2c4a", "#8a7aa0", "#f0d9c0", "#f3ead8"],
  roof:   ["#2a1c3a", "#6a3a5a", "#c4554d", "#c9544a"],
  water:  ["#0a1030", "#3a2f60", "#4a5f8a", "#2a6fa8"],
  sun:    ["#ff7a3d", "#ff7a3d", "#ffb469", "#fff3c4"],
};
function phaseName(h) {
  if (h >= 5 && h < 7) return "清晨";
  if (h >= 7 && h < 11) return "上午";
  if (h >= 11 && h < 13) return "正午";
  if (h >= 13 && h < 16) return "下午";
  if (h >= 16 && h < 19) return "黃昏";
  if (h >= 19 && h < 23) return "夜晚";
  return "深夜";
}

function mountLake(ctx) {
  ctx.html(`<div class="lake"><svg preserveAspectRatio="xMidYMid slice"></svg><div class="panel clock"><b>00:00</b><span></span></div></div>`);
  const host = ctx.$(".lake"), s = Snap(ctx.$(".lake svg"));
  const elT = ctx.$(".clock b"), elP = ctx.$(".clock span");
  // OY sits above the waterline so the sun sinks behind the ridges while the sky is still golden
  const H0 = 600, HY = 400, OY = 352, CX = 500;
  let vw = 1000, vx = 0, rx = 430, ry = 300;
  // Deterministic pseudo random so the landscape is the same on every visit
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  // Per-frame transforms go straight to the DOM; Snap builds and styles everything else
  const tf = (el, v) => el.node.setAttribute("transform", v);

  const skyGrad = s.gradient("l(0,0,0,1)#2f80d8-#7dbbf0:60-#d2ecff");
  const waterGrad = s.gradient("l(0,0,0,1)#2a6fa8-#2a6fa8");
  const sunGlow = s.gradient("r(0.5,0.5,0.5)rgba(255,214,140,0.75)-rgba(255,214,140,0)");
  const moonGlow = s.gradient("r(0.5,0.5,0.5)rgba(220,230,255,0.45)-rgba(220,230,255,0)");
  const lampGlow = s.gradient("r(0.5,0.5,0.5)rgba(255,210,110,0.8)-rgba(255,210,110,0)");
  const ripple = s.filter('<feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="12" xChannelSelector="R" yChannelSelector="G"/>');

  // Everything above the waterline; this group gets mirrored into the lake
  const above = s.g();
  const sky = s.rect(-600, -50, 2200, HY + 60).attr({ fill: skyGrad });
  const stars = s.g().attr({ opacity: 0 });
  for (let i = 0; i < 140; i++) {
    const c = s.circle(-500 + rnd() * 2000, rnd() * 330, 0.5 + rnd() * 1.4).attr({ fill: "#fff" });
    if (rnd() < 0.5) c.attr({ class: "tw", style: `animation-delay:${(rnd() * 2.4).toFixed(2)}s` });
    stars.add(c);
  }
  const sunHalo = s.circle(0, 0, 110).attr({ fill: sunGlow });
  const sunDisc = s.circle(0, 0, 30).attr({ fill: "#fff3c4" });
  const sun = s.g(sunHalo, sunDisc).addClass("grab");
  const craters = s.g(s.circle(-7, -5, 5), s.circle(6, 7, 3.5), s.circle(8, -8, 2.5), s.circle(-4, 10, 2)).attr({ fill: "#ddd5bd" });
  const moon = s.g(s.circle(0, 0, 80).attr({ fill: moonGlow }), s.circle(0, 0, 22).attr({ fill: "#f3efe0" }), craters).addClass("grab");
  const orbit = s.ellipse(CX, OY, rx, ry).attr({ fill: "none", stroke: "#fff", "stroke-width": 1.2, "stroke-dasharray": "3 7", opacity: 0.22 });
  const bodies = s.g(orbit, sun, moon).attr({ clipPath: s.rect(-600, -50, 2200, HY + 50) });

  function cloud(w) {
    const g = s.g();
    const n = 4 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const r = w * (0.16 + rnd() * 0.14);
      g.add(s.circle(-w / 2 + (i + 0.5) * (w / n), -r * 0.5 - rnd() * 6, r));
    }
    g.add(s.rect(-w / 2, -w * 0.12, w, w * 0.14, w * 0.07));
    return g;
  }
  const clouds = [];
  for (let i = 0; i < 6; i++) {
    const w = 80 + rnd() * 90;
    clouds.push({ el: cloud(w), x: -300 + rnd() * 1600, y: 105 + rnd() * 125, v: 6 + rnd() * 10, w });
  }
  const cloudLayer = s.g(...clouds.map((c) => c.el)).attr({ opacity: 0.92 });

  function ridge(base, waves) {
    const pts = [];
    for (let x = -650; x <= 1650; x += 20) {
      let y = base;
      waves.forEach(([f, a, p]) => { y -= Math.sin(x * f + p) * a; });
      pts.push([x, y]);
    }
    return pts;
  }
  const toPath = (pts) => "M-650," + (HY + 2) + pts.map(([x, y]) => `L${x},${y.toFixed(1)}`).join("") + `L1650,${HY + 2}Z`;
  const nearPts = ridge(378, [[0.006, 18, 2.4], [0.017, 9, 0.5], [0.04, 3, 1]]);
  const far = s.path(toPath(ridge(300, [[0.011, 38, 1], [0.023, 18, 2], [0.051, 7, 0.3]])));
  const midM = s.path(toPath(ridge(338, [[0.008, 34, 4], [0.019, 16, 1.2], [0.047, 6, 2]])));
  const near = s.path(toPath(nearPts));
  const ridgeY = (pts, x) => pts[clamp(Math.round((x + 650) / 20), 0, pts.length - 1)][1];

  // Little village on the near hill; windows light up after dusk
  const village = s.g();
  const walls = [], roofs = [], windows = [], lamps = [];
  [[520, 1], [556, 0.8], [600, 1.15], [640, 0.9], [690, 1]].forEach(([x, k]) => {
    const y = ridgeY(nearPts, x) + 4, w = 26 * k, h = 18 * k;
    lamps.push(s.circle(x, y - h / 2, 30 * k).attr({ fill: lampGlow, opacity: 0 }));
    walls.push(s.rect(x - w / 2, y - h, w, h));
    roofs.push(s.polygon([x - w / 2 - 3, y - h, x, y - h - 13 * k, x + w / 2 + 3, y - h]));
    windows.push(s.rect(x - w / 4 - 2.5, y - h * 0.62, 5 * k, 5 * k), s.rect(x + w / 4 - 2.5, y - h * 0.62, 5 * k, 5 * k));
  });
  village.add(...lamps, ...walls, ...roofs, ...windows);
  above.add(sky, stars, bodies, cloudLayer, far, midM, near, village);

  // Lake: a mirrored <use> copy of everything above
  const reflection = above.use().attr({ filter: ripple });
  tf(reflection, `matrix(1,0,0,-1,0,${HY * 2})`);
  s.g(reflection).attr({ clipPath: s.rect(-600, HY, 2200, H0 - HY + 50) });
  const waterTint = s.rect(-600, HY, 2200, H0 - HY + 50).attr({ fill: waterGrad });
  const glints = s.g();
  for (let i = 0; i < 16; i++) {
    const y = HY + 6 + i * 11 + rnd() * 4, w = 6 + i * 2.6 + rnd() * 8;
    glints.add(s.rect(-w / 2 + (rnd() - 0.5) * (8 + i * 2), y, w, 1.6, 0.8).attr({ class: "gl", style: `animation-delay:${(rnd() * 1.6).toFixed(2)}s` }));
  }
  const waves = s.g().attr({ stroke: "#fff", "stroke-width": 1, opacity: 0.2, fill: "none" });
  for (let i = 0; i < 26; i++) {
    const x = -500 + rnd() * 2000, y = HY + 12 + rnd() * 180, w = 20 + rnd() * 50;
    waves.add(s.path(`M${x},${y}q${w / 4},-2 ${w / 2},0t${w / 2},0`));
  }

  // Foreground shores anchored to the visible edges. Local coordinates: x = 0 is the edge, y = 600 the bottom
  const shoreL = s.path("M-20,620L-20,498C70,494,160,516,240,546S340,592,390,620Z");
  const shoreR = s.path("M20,620L20,540C-70,540,-160,562,-230,588S-290,612,-310,620Z");
  const pinesL = s.g(), pinesR = s.g();
  function pine(g, x, y, k) {
    for (let j = 0; j < 3; j++) {
      const ty = y - j * 22 * k, tw = (34 - j * 8) * k;
      g.add(s.polygon([x - tw / 2, ty, x, ty - 36 * k, x + tw / 2, ty]));
    }
  }
  [[24, 512, 1.5], [70, 506, 1.1], [118, 520, 1.7], [168, 532, 1.05]].forEach(([x, y, k]) => pine(pinesL, x, y, k));
  [[-40, 556, 1.4], [-92, 566, 1]].forEach(([x, y, k]) => pine(pinesR, x, y, k));
  const reedsL = s.g(), reedsR = s.g();
  function reedClump(g, x0, n, lean) {
    for (let i = 0; i < n; i++) {
      const x = x0 + i * 8 + rnd() * 6, h = 34 + rnd() * 46, bend = (rnd() - lean) * 18;
      g.add(s.path(`M${x},600q${bend / 2},${-h / 2} ${bend},${-h}`).attr({ fill: "none" }));
      if (i % 3 === 0) g.add(s.ellipse(x + bend, 600 - h, 2.6, 8).attr({ stroke: "none" }));
    }
  }
  reedClump(reedsL, 236, 14, 0.3);
  reedClump(reedsR, -250, 12, 0.6);
  [reedsL, reedsR].forEach((g) => g.attr({ "stroke-width": 2, "stroke-linecap": "round" }));
  const fgL = s.g(shoreL, pinesL, reedsL), fgR = s.g(shoreR, pinesR, reedsR);

  let theta = 2.84, flowing = true, dragging = false, anim = null;
  const bodyPos = (a) => [CX - rx * Math.cos(a), OY - ry * Math.sin(a)];
  function render() {
    theta = ((theta % TAU) + TAU) % TAU;
    const e = Math.sin(theta), night = clamp((0.05 - e) / 0.3, 0, 1);
    const [sx, sy] = bodyPos(theta), [mx, my] = bodyPos(theta + Math.PI);
    tf(sun, `translate(${sx.toFixed(1)},${sy.toFixed(1)})`);
    tf(moon, `translate(${mx.toFixed(1)},${my.toFixed(1)})`);
    sunDisc.attr({ fill: pick(PAL.sun, e) });
    sunHalo.attr({ r: 110 + (1 - clamp(e * 3, 0, 1)) * 60 });
    skyGrad.setStops(`${pick(PAL.skyTop, e)}-${pick(PAL.skyMid, e)}:60-${pick(PAL.skyBot, e)}`);
    const wc = pick(PAL.water, e);
    waterGrad.setStops(`${wc}-${mix(wc, "#000000", 0.35)}`);
    waterTint.attr({ opacity: 0.38 + night * 0.12 });
    far.attr({ fill: pick(PAL.far, e) });
    midM.attr({ fill: pick(PAL.mid, e) });
    near.attr({ fill: pick(PAL.near, e) });
    const sc = pick(PAL.shore, e);
    [shoreL, shoreR].forEach((el) => el.attr({ fill: sc }));
    [pinesL, pinesR].forEach((el) => el.attr({ fill: mix(sc, "#000000", 0.15) }));
    [reedsL, reedsR].forEach((el) => el.attr({ stroke: mix(sc, "#000000", 0.2), fill: mix(sc, "#000000", 0.2) }));
    cloudLayer.attr({ fill: pick(PAL.cloud, e), opacity: 0.92 - night * 0.45 });
    walls.forEach((w) => w.attr({ fill: pick(PAL.wall, e) }));
    roofs.forEach((r) => r.attr({ fill: pick(PAL.roof, e) }));
    windows.forEach((w) => w.attr({ fill: mix("#5a6a80", "#ffd46b", night) }));
    lamps.forEach((l) => l.attr({ opacity: night }));
    stars.attr({ opacity: night });
    orbit.attr({ opacity: 0.12 + night * 0.1 });
    // Sparkle column follows whichever body is up
    const sunUp = e > -0.04;

// ---------- scene 2: the eight mina easings ----------
const EASE = [["linear", "等速"], ["easein", "漸快"], ["easeout", "漸慢"], ["easeinout", "慢快慢"], ["backin", "先退後衝"], ["backout", "衝過再回"], ["elastic", "彈簧"], ["bounce", "落地反彈"]];
function mountEasing(ctx) {

  function build(w, h) {

    const cw = (w - pad * 2 - gap * (cols - 1)) / cols, ch = (h - pad * 2 - gap * (rows - 1)) / rows;
    cells = EASE.map(([name, zh], i) => {
      const x = pad + (i % cols) * (cw + gap), y = pad + Math.floor(i / cols) * (ch + gap), color = COL[i];
      const x0 = x + 14, x1 = x + cw - 14, top = y + 30, bot = y + ch - 26;
      const Y = (v) => bot - ((v + 0.25) / 1.7) * (bot - top);

      p.text(x + 12, y + 19, "mina." + name).attr({ fill: FG, "font-size": 12.5 }).addClass("mono");
      p.text(x + cw - 12, y + 19, zh).attr({ fill: MUTED, "font-size": 12, "text-anchor": "end" });
      p.path(`M${x0},${Y(0)}H${x1}M${x0},${Y(1)}H${x1}`).attr({ stroke: LINE, "stroke-dasharray": "3 4" });
      let d = "";
      for (let k = 0; k <= 64; k++) {
        const t = k / 64;
        d += `${k ? "L" : "M"}${(x0 + t * (x1 - x0)).toFixed(1)},${Y(mina[name](t)).toFixed(1)}`;
      }
      p.path(d).attr({ fill: "none", stroke: color, "stroke-width": 2, opacity: 0.85 });
      const cursor = p.line(x0, top - 6, x0, bot + 4).attr({ stroke: "rgba(255,255,255,0.3)" });
      const dot = p.circle(x0, Y(0), 4.5).attr({ fill: color });
      // The ball rail is inset so overshooting easings (backin, elastic) stay inside the cell
      const railY = y + ch - 11, b0 = x0 + (x1 - x0) * 0.1, b1 = x0 + (x1 - x0) * 0.72;
      p.line(x0, railY, x1, railY).attr({ stroke: LINE, "stroke-width": 2, "stroke-linecap": "round" });
      p.path(`M${b0},${railY - 5}V${railY + 5}M${b1},${railY - 5}V${railY + 5}`).attr({ stroke: MUTED });

function mountMorph(ctx) {
  ctx.html(`<div class="stage"><svg viewBox="-50 -16 300 236"></svg></div><div class="panel readout"></div>`);

  let cur = 0, ease = "backout", auto = true, info = "", last = "", rgb = rgbOf(C[0]), fillAnim = null;
  const cmds = (i) => Snap.parsePathString(SHAPES[i].d).length;

  }

  ctx.raf((t, dt) => {
    if (!spot) return;
    if (t - lastMove > 2500) { tx = L.w / 2 + L.w * 0.3 * Math.sin(t / 1300); ty = L.h / 2 + L.h * 0.26 * Math.sin(t / 830); }
    const k = Math.min(1, dt / 90);
    sx += (tx - sx) * k; sy += (ty - sy) * k;
    spot.attr({ cx: sx, cy: sy });
  });

  ctx.group(["聚光燈", "文字", "百葉窗"], 0, (i) => { mi = i; if (color) color.attr({ mask: masks[i] }); });
  watch(ctx, boxL, buildLeft);
  watch(ctx, boxR, buildRight);
}

// ---------- scene 6: Snap.load external SVG files ----------
const LOADS = [
  {
    file: "ferris-wheel.svg", zh: "摩天輪", sel: 'select("#wheel")・selectAll(".cabin")',
    run(f, bag) {
      const wheel = f.select("#wheel");
      const cabins = f.selectAll(".cabin").items.map((c) => { const pin = c.select(".pin"); return { c, x: +pin.attr("cx"), y: +pin.attr("cy") }; });
      // Cabins counter-rotate around their pins so they always hang upright
      bag.tween(0, 360, (a) => {
        wheel.transform(`r${a.toFixed(2)},100,88`);
        cabins.forEach((k) => k.c.transform(`r${(-a).toFixed(2)},${k.x},${k.y}`));
      }, 14000, mina.linear, false);
    },
  },
  {
    file: "lighthouse.svg", zh: "海岬燈塔", sel: 'select("#beam")・selectAll(".wave")',
    run(f, bag) {
      bag.cycle(f.select("#beam"), { transform: "r-38,100,58" }, { transform: "r38,100,58" }, 2600, mina.easeinout, "swing");
      bag.cycle(f.select("#lamp"), { r: 6, opacity: 1 }, { r: 4.2, opacity: 0.6 }, 650, mina.easeinout, "swing");
      f.selectAll(".wave").forEach((w, k) => { bag.cycle(w, { transform: "t0,0" }, { transform: "t-50,0" }, 2600 + k * 1100, mina.linear, "repeat"); });
    },
  },
  {
    file: "balloon.svg", zh: "鹿野熱氣球", sel: 'select("#balloon")・selectAll(".panel")',
    run(f, bag) {
      const PA = ["#f72585", "#f7df1e", "#4cc9f0"], PB = ["#9d8cff", "#ff8c42", "#7bd389"];
      bag.cycle(f.select("#balloon"), { transform: "t0,-12" }, { transform: "t0,10" }, 2300, mina.easeinout, "swing");
      f.selectAll(".panel").forEach((el, k) => { bag.tween(rgbOf(PA[k]), rgbOf(PB[k]), (v) => el.attr({ fill: rgbHex(v) }), 1800 + k * 300, mina.easeinout, true); });
      bag.cycle(f.select("#flame"), { transform: "s1,1,100,138" }, { transform: "s1.3,1.7,100,138" }, 240, mina.easeinout, "swing");
      f.selectAll(".cloud").forEach((el, k) => { bag.cycle(el, { transform: "t-24,0" }, { transform: "t24,0" }, 5200 + k * 1700, mina.easeinout, "swing"); });
    },
  },
];
function mountLoad(ctx) {
  ctx.html(`<div class="cards">${LOADS.map((f) => `<div class="lcard panel"><div class="art"><svg viewBox="0 0 200 200" width="160" height="160"></svg></div><div class="txt"><h3>${f.zh}</h3><div class="file">assets/snapsvg/${f.file}</div><div class="stat">載入中…</div><div class="sel">${f.sel}</div></div></div>`).join("")}</div>`);
  const bag = minaBag(ctx);
  const cards = ctx.$$(".lcard").map((el, i) => ({ f: LOADS[i], art: el.querySelector(".art"), p: Snap(el.querySelector("svg")), stat: el.querySelector(".stat") }));
  cards.forEach((c) => watch(ctx, c.art, (w, h) => { const s = Math.floor(Math.min(w, h)); c.p.attr({ width: s, height: s }); }));
  let gen = 0;

  function loadAll() {
    const g = ++gen;
    bag.reset();
    cards.forEach((c) => {
      halt(c.p); c.p.clear();
      if (location.protocol === "file:") { c.stat.textContent = "需透過 http 開啟（Snap.load 用 XHR）"; return; }
      c.stat.textContent = "載入中…";
      const t0 = performance.now();
      let done = false;
      // Snap.load only calls back on success, so a timer reports failures
      ctx.timeout(() => { if (!done && g === gen) c.stat.textContent = "載入失敗（逾時）"; }, 4000);
      Snap.load(`assets/snapsvg/${c.f.file}`, (f) => {
        if (g !== gen || !ctx.active) return;
        done = true;
        const n = f.selectAll("*").length;
        c.p.append(f);
        c.f.run(f, bag);
        c.stat.textContent = `元素 ${n} 個・載入 ${Math.round(performance.now() - t0)} ms`;
      });
    });
  }
  ctx.button("重新載入", loadAll, { primary: true });
  ctx.toggle("動畫", true, (v) => bag.pause(!v));
  loadAll();
}

// ---------- scene 7: transform strings, matrices and filters ----------
function mountMatrix(ctx) {
  ctx.html(`<div class="stage"><svg></svg></div><div class="panel readout"></div>`);
  const host = ctx.$(".stage"), out = ctx.$(".readout"), p = Snap(ctx.$(".stage svg"));
  const hueBag = minaBag(ctx);
  const PHOTOS = [[2, "紅岩峽谷"], [6, "藍底水母"], [8, "海象群"]];
  const FX = { shadow: "", blur: Snap.filter.blur(2.2), gray: Snap.filter.grayscale(1), sepia: Snap.filter.sepia(1), hue: Snap.filter.hueRotate(0), invert: Snap.filter.invert(1) };
  let W = 800, H = 500, CW = 200, CH = 133, cards = [], sel = 1, fx = "shadow", F = {}, layer = null, knob = null, corner = [0, 0], last = "";
  const str = (s) => `t${s.x.toFixed(1)},${s.y.toFixed(1)}r${s.a.toFixed(1)},0,0s${s.k.toFixed(3)},${s.k.toFixed(3)},0,0`;
  const read = (c) => { const m = c.g.transform().localMatrix.split(); c.st = { x: m.dx, y: m.dy, a: m.rotate, k: m.scalex }; };
  const homes = () => (W >= H * 1.1
    ? [[0.2, 0.52, -12], [0.5, 0.48, 4], [0.8, 0.54, 14]]
    : [[0.32, 0.27, -10], [0.68, 0.5, 6], [0.36, 0.75, 12]]).map(([a, b, r]) => ({ x: W * a, y: H * b, a: r, k: 1 }));
  // Shadow first: its feMerge output is what the effect primitive then works on
  const filterFor = (key) => F[key] || (F[key] = region(p.filter(Snap.filter.shadow(0, 8, 8, "#000", 0.45) + FX[key])));
  const pick = (i) => { sel = i; cards.forEach((c, k) => c.ring.attr({ display: k === i ? "inline" : "none" })); };

  function applyFilter() {
    hueBag.reset();
    const f = filterFor(fx);
    cards.forEach((c) => c.g.attr({ filter: f }));
    if (fx === "hue") {
      const cm = f.select("feColorMatrix");
      hueBag.tween(0, 360, (v) => cm.attr({ values: v.toFixed(0) }), 4000, mina.linear, false);
    }
  }
  function moveTo(targets, ms) {
    cards.forEach((c, i) => { c.g.stop().animate({ transform: str(targets[i]) }, ms + i * 140, mina.backout); });
  }

  function build(w, h) {
    W = w; H = h; F = {};
    cards.forEach((c) => c.g.undrag());
    if (knob) knob.undrag();
    halt(p); p.clear();
    p.attr({ viewBox: `0 0 ${w} ${h}` });
    const wide = w >= h * 1.1;
    CW = Math.max(60, wide ? Math.min(220, w * 0.26, h * 0.55) : Math.min(220, w * 0.42, 1.5 * (0.3 * h - 38))); CH = CW / 1.5;
    corner = [CW / 2 + 8, CH / 2 + 30];
    layer = p.g();
    cards = PHOTOS.map(([n, name], i) => {
      const frame = p.rect(-CW / 2 - 8, -CH / 2 - 8, CW + 16, CH + 38, 3).attr({ fill: "#f4f1ea" });
      const img = p.image(IMG(n), -CW / 2, -CH / 2, CW, CH).attr({ preserveAspectRatio: "xMidYMid slice" });
      const cap = p.text(0, CH / 2 + 20, name).attr({ fill: "#3a3a3a", "font-size": 13, "text-anchor": "middle" });
      const ring = p.rect(-CW / 2 - 13, -CH / 2 - 13, CW + 26, CH + 48, 6).attr({ fill: "none", stroke: C[0], "stroke-width": 2, "stroke-dasharray": "6 5", display: "none" });
      const g = layer.g(frame, img, cap, ring).addClass("card");
      const c = { g, ring, st: { x: w / 2, y: h / 2, a: 0, k: 0.6 } };
      g.transform(str(c.st));
      let ox = 0, oy = 0;
      g.drag((dx, dy) => { c.st.x = ox + dx; c.st.y = oy + dy; g.transform(str(c.st)); },
        () => { g.stop(); read(c); ox = c.st.x; oy = c.st.y; pick(i); layer.node.appendChild(g.node); });
      return c;
    });
    moveTo(homes(), 900);
    // One handle for the selected card: its angle and distance from the card centre set rotate and scale
    knob = p.circle(0, 0, 10).attr({ fill: C[0], stroke: "#12151a", "stroke-width": 2.5 }).addClass("knob");
    const base = Math.atan2(corner[1], corner[0]) * 180 / Math.PI, baseD = Math.hypot(corner[0], corner[1]);
    knob.drag((dx, dy, x, y) => {
      const c = cards[sel], q = svgPoint(p, x, y), vx = q.x - c.st.x, vy = q.y - c.st.y;
      c.st.a = Math.atan2(vy, vx) * 180 / Math.PI - base;
      c.st.k = clamp(Math.hypot(vx, vy) / baseD, 0.4, 2.2);
      c.g.transform(str(c.st));
    }, () => { const c = cards[sel]; c.g.stop(); read(c); });
    applyFilter();
    pick(sel);
  }

  ctx.raf(() => {
    const c = cards[sel];
    if (!c || !knob) return;
    const m = c.g.transform().localMatrix, sp = m.split();
    knob.attr({ cx: m.x(corner[0], corner[1]), cy: m.y(corner[0], corner[1]) });
    const mx = [m.a, m.b, m.c, m.d, m.e, m.f].map((v, k) => v.toFixed(k < 4 ? 2 : 0)).join(",");
    const text = `split()：位移 <b>${fmt(sp.dx)},${fmt(sp.dy)}</b>・旋轉 <b>${sp.rotate.toFixed(1)}°</b>・縮放 <b>${sp.scalex.toFixed(2)}</b>・matrix(${mx})`;
    if (text !== last) out.innerHTML = last = text;
  });

  ctx.select("濾鏡", [
    { value: "shadow", label: "陰影" }, { value: "blur", label: "模糊" }, { value: "gray", label: "灰階" },
    { value: "sepia", label: "復古" }, { value: "hue", label: "色相旋轉" }, { value: "invert", label: "負片" },
  ], fx, (v) => { fx = v; applyFilter(); });
  ctx.button("洗牌", () => {
    const t = homes().sort(() => Math.random() - 0.5).map((s) => ({ ...s, a: -18 + Math.random() * 36, k: 0.85 + Math.random() * 0.3 }));
    moveTo(t, 800);
  }, { primary: true });
  ctx.button("重設", () => moveTo(homes(), 700));
  watch(ctx, host, build);
  ctx.onCleanup(() => { halt(p); cards.forEach((c) => c.g.undrag()); if (knob) knob.undrag(); });
}

// ---------- scene 8: stress ----------
function mountStress(ctx) {
  ctx.html(`<div class="stress-stage"><svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice"></svg></div>`);
  const p = Snap(ctx.$(".stress-stage svg")), layer = p.g();
  const items = [];
  let mode = "anim", n = 0, addMs = 0;
  const rnd = (a, b) => a + Math.random() * (b - a);
  // Snap's idiom for a loop: each leg's callback schedules the next leg
  const swing = (it) => {
    const leg = () => {
      if (!it.live || mode !== "anim" || !ctx.active) return;
      it.fwd = !it.fwd;
      it.el.animate(it.fwd ? { cx: it.x2, cy: it.y2 } : { cx: it.x, cy: it.y }, it.dur, mina.easeinout, leg);
    };
    leg();
  };
  const add = () => {
    const i = items.length, x = rnd(10, 790), y = rnd(10, 490);
    const it = { x, y, x2: clamp(x + rnd(-120, 120), 6, 794), y2: clamp(y + rnd(-80, 80), 6, 494), dur: rnd(1200, 2600), ph: rnd(0, TAU), fwd: false, live: true };
    it.el = layer.circle(x, y, rnd(4, 7)).attr({ fill: C[i % 6], opacity: 0.8 });
    if (mode === "anim") swing(it);
    items.push(it);
  };
  const drop = () => { const it = items.pop(); it.live = false; it.el.stop().remove(); };
  const clearAll = () => {
    for (const it of items) { it.live = false; it.el.stop(); }
    layer.clear();
    items.length = 0;
  };
  const fill = () => {
    const t0 = performance.now();
    if (n < items.length / 2) clearAll();
    while (items.length > n) drop();
    while (items.length < n) add();
    addMs = performance.now() - t0;
  };
  ctx.raf((t) => {
    if (mode === "anim") return;
    for (const it of items) {
      const s = 0.5 - 0.5 * Math.cos((t / it.dur) * Math.PI + it.ph);
      const x = it.x + (it.x2 - it.x) * s, y = it.y + (it.y2 - it.y) * s;
      if (mode === "attr") it.el.attr({ cx: x, cy: y });
      else { it.el.node.setAttribute("cx", x.toFixed(1)); it.el.node.setAttribute("cy", y.toFixed(1)); }
    }
  });
  const running = () => items.reduce((sum, it) => sum + Object.keys(it.el.anims).length, 0);
  ctx.select("模式", [
    { value: "anim", label: "el.animate() 來回" },
    { value: "attr", label: "每格 el.attr()" },
    { value: "native", label: "原生 setAttribute" },
  ], mode, (v) => { clearAll(); mode = v; fill(); });
  ctx.controls.classList.add("bottom");
  ctx.ramp({
    label: "圓點", unit: "個", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000], minFps: 30,
    apply(count) { n = count; fill(); },
    metrics: () => ({ "模式": mode === "anim" ? "el.animate()" : mode === "attr" ? "el.attr()" : "setAttribute", "進行中 mina 動畫": fmt(mode === "anim" ? running() : 0), "上次增減": `${addMs.toFixed(0)} ms` }),
    note: "el.animate() 每格會把每個屬性送進 eve 事件分派（snap.util.attr.*）再寫回 DOM，每段結束還各用一個 setTimeout 觸發 finish；el.attr() 省掉補間但仍走事件分派；setAttribute 完全繞過 Snap，三者的差距就是便利性的代價。",
  });
  ctx.onCleanup(clearAll);
}
