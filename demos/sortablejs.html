<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SortableJS 示範：三欄拖曳看板</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 14px 14px 46px; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; min-height: 34px; padding-right: 110px; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: .5px; }
  header .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .col { display: flex; flex-direction: column; min-height: 0; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13px; }
  .col-head .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); flex: none; }
  .col-head .count { margin-left: auto; font: 600 11px/1 var(--mono); padding: 4px 7px; border-radius: 99px; background: rgba(255,255,255,.07); color: var(--muted); transition: transform .2s, color .2s; }
  .col-head .count.bump { transform: scale(1.35); color: var(--c); }
  .list { flex: 1; min-height: 40px; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
  .card {
    position: relative; padding: 10px 11px 9px 13px; border-radius: 9px; cursor: grab; user-select: none;
    background: #1f232a; border: 1px solid rgba(255,255,255,.06);
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
    transition: border-color .15s, box-shadow .15s;
  }
  .card::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--t); }
  .card:hover { border-color: rgba(255,255,255,.18); }
  .card .title { font-size: 13px; line-height: 1.4; margin-bottom: 7px; word-break: break-all; }
  .card .meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .tag { padding: 1px 7px; border-radius: 99px; background: color-mix(in srgb, var(--t) 18%, transparent); color: var(--t); font-weight: 600; }
  .avatar { margin-left: auto; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; color: #111; background: var(--t); }
  .col[data-col="done"] .card .title { text-decoration: line-through; color: var(--muted); }
  .col[data-col="done"] .card .title::before { content: "✓ "; color: var(--c4); text-decoration: none; display: inline-block; margin-right: 2px; }
  /* Sortable state classes */
  .sortable-ghost { opacity: .35; border: 1px dashed var(--accent) !important; background: rgba(247,223,30,.06) !important; }
  .sortable-chosen { box-shadow: 0 10px 24px rgba(0,0,0,.45), 0 0 0 1px var(--accent); }
  .sortable-drag { transform: rotate(3deg); }
  .progress { position: fixed; right: 12px; bottom: 14px; z-index: 40; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .progress .track { width: 90px; height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .progress .track i { display: block; height: 100%; background: linear-gradient(90deg, var(--c4), var(--accent)); transition: width .35s; }
  @media (max-width: 520px) {
    .wrap { padding: 10px 8px 44px; gap: 8px; }
    .board { gap: 6px; }
    .list { padding: 6px; gap: 6px; }
    .col-head { padding: 8px 7px; font-size: 12px; gap: 5px; }
    .card { padding: 8px 7px 7px 10px; }
    .card .title { font-size: 12px; }
    .avatar, header .sub { display: none; }
    .progress .track { width: 50px; }
  }
</style>
</head>
<body>
<div class="controls">
  <button class="btn primary" id="add">＋ 新增卡片</button>
</div>
<div class="wrap">
  <header>
    <h1>課程專案看板</h1>
    <span class="sub">三欄之間可互相拖曳，欄內可重新排序</span>
  </header>
  <div class="board">
    <section class="col" data-col="todo" style="--c: var(--c2)">
      <div class="col-head"><span class="dot"></span>待辦<span class="count"></span></div>
      <div class="list" id="todo"></div>
    </section>
    <section class="col" data-col="doing" style="--c: var(--c1)">
      <div class="col-head"><span class="dot"></span>進行中<span class="count"></span></div>
      <div class="list" id="doing"></div>
    </section>
    <section class="col" data-col="done" style="--c: var(--c4)">
      <div class="col-head"><span class="dot"></span>完成<span class="count"></span></div>
      <div class="list" id="done"></div>
    </section>
  </div>
</div>
<div class="progress"><span id="pct">0%</span><span class="track"><i id="bar"></i></span></div>
<div class="hint">拖曳卡片到其他欄位或重新排序</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
<script>
// Kanban board: three Sortable lists sharing one group so cards move between columns.
const TAGS = {
  設計: "var(--c3)", 開發: "var(--c2)", 行銷: "var(--c5)", 教材: "var(--c6)", 行政: "var(--c4)",
};
const DATA = {
  todo: [
    ["錄製第 3 單元示範影片", "教材", "林"],
    ["設計報名頁主視覺", "設計", "陳"],
    ["整理台中場學員回饋", "行政", "黃"],
  ],
  doing: [
    ["串接金流付款流程", "開發", "王"],
    ["撰寫 IG 貼文排程", "行銷", "李"],
  ],
  done: [
    ["確認高雄場教室場地", "行政", "張"],
    ["完成課綱與講義大綱", "教材", "黃"],
  ],
};
const EXTRA = [
  ["製作結業證書模板", "設計", "陳"],
  ["修正行動版選單錯誤", "開發", "王"],
  ["寄送課前提醒信", "行銷", "李"],
  ["更新講師簡介頁", "教材", "林"],
];
let extraIndex = 0;

function makeCard([title, tag, who]) {
  const el = document.createElement("div");
  el.className = "card";
  el.style.setProperty("--t", TAGS[tag]);
  const day = 6 + Math.floor(Math.random() * 20);
  el.innerHTML = `<div class="title"></div><div class="meta"><span class="tag"></span><span>10/${day}</span><span class="avatar"></span></div>`;
  el.querySelector(".title").textContent = title;
  el.querySelector(".tag").textContent = tag;
  el.querySelector(".avatar").textContent = who;
  return el;
}

for (const [id, cards] of Object.entries(DATA)) {
  const list = document.getElementById(id);
  cards.forEach((c) => list.append(makeCard(c)));
}

function refresh(bumpIds = []) {
  let total = 0;
  document.querySelectorAll(".col").forEach((col) => {
    const n = col.querySelectorAll(".card").length;
    total += n;
    const badge = col.querySelector(".count");
    badge.textContent = n;
    if (bumpIds.includes(col.dataset.col)) {
      badge.classList.add("bump");
      setTimeout(() => badge.classList.remove("bump"), 250);
    }
  });
  const done = document.querySelectorAll("#done .card").length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById("pct").textContent = `完成 ${pct}%`;
  document.getElementById("bar").style.width = pct + "%";
}

["todo", "doing", "done"].forEach((id) => {
  Sortable.create(document.getElementById(id), {
    group: "kanban",
    animation: 180,
    easing: "cubic-bezier(.2,.8,.2,1)",
    ghostClass: "sortable-ghost",
    chosenClass: "sortable-chosen",
    dragClass: "sortable-drag",
    forceFallback: true,
    fallbackTolerance: 3,
    onEnd: (evt) => refresh([evt.from.id, evt.to.id]),
  });
});

document.getElementById("add").addEventListener("click", () => {
  const card = makeCard(EXTRA[extraIndex++ % EXTRA.length]);
  document.getElementById("todo").prepend(card);
  card.animate([{ transform: "scale(.8)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 260, easing: "ease-out" });
  refresh(["todo"]);
});

refresh();
</script>
</body>
</html>
