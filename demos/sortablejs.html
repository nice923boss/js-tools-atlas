<body>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// SortableJS showcase: eight scenes from a kanban board to an animated-reorder stress ramp.
const { h } = Showcase;
const BASE = {
  animation: 180, easing: "cubic-bezier(.2,.8,.2,1)", forceFallback: true, fallbackTolerance: 3,
  ghostClass: "sj-ghost", chosenClass: "sj-chosen", dragClass: "sj-drag",
};
const ARROW = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 2l6.5 19 2.6-7.6L20 11z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [b[i], b[j]] = [b[j], b[i]]; } return b; };

// Create a Sortable that is destroyed with the scene.
function sortable(ctx, el, opts) {
  const s = Sortable.create(el, { ...BASE, ...opts });
  // destroy() mid-drag skips ghost removal when the ghost lives on <body> (fallbackOnBody), so remove it here.
  ctx.onCleanup(() => { const g = Sortable.ghost; s.destroy(); if (g && g.isConnected) g.remove(); });
  return s;
}
// Point helpers for simDrag: element-relative point, or empty space at the end of a list.
const at = (el, fx = 0.3, fy = 0.5) => () => { const r = el.getBoundingClientRect(); return [r.left + r.width * fx, r.top + r.height * fy]; };
const endOf = (list) => () => {
  const r = list.getBoundingClientRect();
  const last = list.lastElementChild;
  const y = last ? Math.min(r.bottom - 8, last.getBoundingClientRect().bottom + 16) : r.top + 24;
  return [r.left + r.width / 2, y];
};
function firePointer(type, x, y) {
  const target = document.elementFromPoint(x, y) || document.body;
  target.dispatchEvent(new PointerEvent(type, {
    bubbles: true, cancelable: true, composed: true, pointerId: 7, pointerType: "mouse", isPrimary: true,
    button: 0, buttons: type === "pointerup" ? 0 : 1, clientX: x, clientY: y,
  }));
}
// Automatic demo: synthetic pointer events drive SortableJS's real forceFallback drag path,
// so every option and event (group, handle, filter, onMove, MultiDrag, Swap) is exercised for real.
async function simDrag(ctx, from, to, { ms = 650, hold = 170 } = {}) {
  if (!ctx.active || Sortable.active) return;
  let cur = ctx.el.querySelector(".sj-cur");
  if (!cur) { cur = h("div", { class: "sj-cur" }); cur.innerHTML = ARROW; ctx.el.append(cur); }
  const host = ctx.el.getBoundingClientRect();
  const place = (x, y) => { cur.style.transform = `translate(${x - host.left}px, ${y - host.top}px)`; };
  const [x0, y0] = (typeof from === "function" ? from : at(from))();
  const [tx, ty] = to();
  place(x0, y0);
  cur.classList.add("on");
  await ctx.sleep(220);
  cur.classList.add("down");
  firePointer("pointerdown", x0, y0);
  const t0 = performance.now();
  let x = x0, y = y0;
  for (;;) {
    const k = Math.min(1, (performance.now() - t0) / ms);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    x = x0 + (tx - x0) * e; y = y0 + (ty - y0) * e;
    place(x, y);
    firePointer("pointermove", x, y);
    if (k >= 1) break;
    await ctx.sleep(16);
  }
  await ctx.sleep(hold);
  firePointer("pointerup", x, y);
  cur.classList.remove("down");
  await ctx.sleep(380);
}
// Run an async demo once at a time; unmount aborts are swallowed by the shell.
function demoRunner(ctx, fn) {
  let busy = false;
  const go = async () => {
    if (busy) return;
    busy = true;
    try { await fn(); } finally { busy = false; const c = ctx.el.querySelector(".sj-cur"); if (c) c.classList.remove("on"); }
  };
  ctx.timeout(go, 700);
  return go;
}
// Event log that merges repeated events (onMove x12).
function logger(box, max = 40) {
  let last = null, n = 0, row = null;
  return (name, text = "") => {
    if (name === last && row) { n++; row.innerHTML = `<code>${name}</code>×${n} ${esc(text)}`; return; }
    last = name; n = 1;
    row = h("div", { class: "new" });
    row.innerHTML = `<code>${name}</code>${esc(text)}`;
    box.prepend(row);
    while (box.children.length > max) box.lastElementChild.remove();
  };
}

const TAGS = { 設計: "var(--c3)", 開發: "var(--c2)", 行銷: "var(--c5)", 教材: "var(--c6)", 行政: "var(--c4)" };
const KANBAN = {
  todo: [["錄製第 3 單元示範影片", "教材", "林", 8], ["設計報名頁主視覺", "設計", "陳", 12], ["整理台中場學員回饋", "行政", "黃", 15]],
  doing: [["串接金流付款流程", "開發", "王", 9], ["撰寫 IG 貼文排程", "行銷", "李", 11]],
  done: [["確認高雄場教室場地", "行政", "張", 6], ["完成課綱與講義大綱", "教材", "黃", 7]],
};
const EXTRA = [["製作結業證書模板", "設計", "陳", 18], ["修正行動版選單錯誤", "開發", "王", 20], ["寄送課前提醒信", "行銷", "李", 21], ["更新講師簡介頁", "教材", "林", 23]];
const card = ([t, tag, who, day]) =>
  `<div class="sj-card" style="--t:${TAGS[tag]}"><div class="sj-t">${esc(t)}</div><div class="sj-m"><span class="sj-tag">${tag}</span><span class="sj-d">10/${day}</span><span class="sj-ava">${who}</span></div></div>`;

Showcase.run({ scenes: [
  {
    id: "kanban", title: "課程看板",
    api: "Sortable.create(list, { group: 'kanban', animation, onEnd })",
    desc: "三個清單共用同一個 group，卡片可跨欄移動、欄內排序；onEnd 回報來源欄、目標欄與前後索引，用來更新數量與完成率。開場由程式送出合成指標事件，走的是 SortableJS 真實的拖曳流程。",
    hint: "拖曳卡片到其他欄位・按「自動示範」重播",
    mount(ctx) {
      const COLS = [["todo", "待辦", 2], ["doing", "進行中", 1], ["done", "完成", 4]];
      const NAME = { todo: "待辦", doing: "進行中", done: "完成" };
      ctx.html(`<div class="sj-wrap"><div class="sj-head"><b>課程專案看板</b><span class="sj-evt">拖曳任一張卡片，onEnd 的結果會顯示在這裡</span><span class="sj-pct"><span class="sj-pv">完成 0%</span><span class="sj-track"><i></i></span></span></div>
        <div class="sj-cols" style="--n:3">${COLS.map(([id, name, c]) => `<section class="sj-col" data-col="${id}" style="--c:var(--c${c})"><div class="sj-colhead"><span class="sj-dot"></span>${name}<span class="sj-count">0</span></div><div class="sj-list" data-col="${id}">${KANBAN[id].map(card).join("")}</div></section>`).join("")}</div></div>`);
      const lists = ctx.$$(".sj-list");
      const evt = ctx.$(".sj-evt");
      const refresh = (bump = []) => {
        let total = 0;
        ctx.$$(".sj-col").forEach((col) => {
          const n = col.querySelectorAll(".sj-card").length;
          total += n;
          const b = col.querySelector(".sj-count");
          b.textContent = n;
          if (bump.includes(col.dataset.col)) { b.classList.add("bump"); ctx.timeout(() => b.classList.remove("bump"), 260); }
        });
        const pct = total ? Math.round((lists[2].children.length / total) * 100) : 0;
        ctx.$(".sj-pv").textContent = `完成 ${pct}%`;
        ctx.$(".sj-track i").style.width = pct + "%";
      };
      lists.forEach((el) => sortable(ctx, el, {
        group: "kanban",
        onEnd: (e) => {
          evt.innerHTML = `<code>onEnd</code> ${NAME[e.from.dataset.col]} #${e.oldIndex} → ${NAME[e.to.dataset.col]} #${e.newIndex}`;
          refresh([e.from.dataset.col, e.to.dataset.col]);
        },
      }));
      refresh();
      let extra = 0;
      ctx.button("＋ 新增卡片", () => {
        lists[0].insertAdjacentHTML("afterbegin", card(EXTRA[extra++ % EXTRA.length]));
        lists[0].firstElementChild.animate([{ transform: "scale(.8)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 260, easing: "ease-out" });
        refresh(["todo"]);
      }, { primary: true });
      const demo = demoRunner(ctx, async () => {
        if (lists[0].firstElementChild) await simDrag(ctx, lists[0].firstElementChild, endOf(lists[1]));
        if (lists[1].firstElementChild) await simDrag(ctx, lists[1].firstElementChild, endOf(lists[2]));
      });
      ctx.button("自動示範", demo);
    },
  },
  {
    id: "anim", title: "動畫與緩動",
    api: "sortable.sort(order, true) + { animation, easing }",
    desc: "四條清單內容相同，只差 animation 毫秒數與 easing。按「打亂」對每條清單呼叫 sort(相同順序, true)，SortableJS 會先記錄位置再用 transform 補間（FLIP），速度與回彈差異一目了然；也可以手動拖曳比較。",
    hint: "按「打亂」比較四種動畫・可關掉自動輪播後手動拖",
    mount(ctx) {
      const ST = [["淡水", "R28"], ["紅樹林", "R27"], ["竹圍", "R26"], ["關渡", "R25"], ["忠義", "R24"], ["北投", "R22"]];
      const LANES = [["不設動畫", 0, ""], ["150ms ease", 150, "ease"], ["400ms 回彈", 400, "cubic-bezier(.34,1.56,.64,1)"], ["900ms linear", 900, "linear"]];

      const ss = ctx.$$(".sj-list").map((el, i) => sortable(ctx, el, { group: `lane${i}`, animation: LANES[i][1], easing: LANES[i][2] || undefined }));

      const apply = (order) => ss.forEach((s) => s.sort(order, true));
      let auto = true;
      ctx.button("打亂 sort()", () => apply(shuffle(base)), { primary: true });
      ctx.button("還原順序", () => apply(base));
      ctx.toggle("自動輪播", auto, (v) => (auto = v));
      ctx.timeout(() => apply(shuffle(base)), 500);
      ctx.interval(() => { if (auto && !Sortable.active) apply(shuffle(base)); }, 2600);

  },
  {
    id: "group", title: "群組規則",
    api: "group: { name, pull: 'clone', put: fn | ['plan'] }",

        <section class="sj-col" style="--c:var(--c2)"><div class="sj-colhead"><span class="sj-dot"></span><div>課程庫<code>pull: 'clone', put: false, sort: false</code></div></div><div class="sj-list">${LIB.map(chip).join("")}</div></section>

        <section class="sj-col" style="--c:var(--c3)"><div class="sj-colhead"><span class="sj-dot"></span><div>回收桶<code>put: ['plan'] + onAdd 刪除</code></div></div><div class="sj-list sj-trash"></div></section></div></div>`);
      const [lib, plan, trash] = ctx.$$(".sj-list");

      sortable(ctx, lib, { group: { name: "lib", pull: "clone", put: false }, sort: false, onClone: (e) => say(`<code>onClone</code> 課程庫保留「${esc(e.item.textContent)}」的複本`) });
      sortable(ctx, plan, {
        group: { name: "plan", pull: true, put: (to, from, dragEl) => [...to.el.children].filter((c) => c !== dragEl).length < 4 },
        onAdd: (e) => { say(`<code>onAdd</code> 課表加入「${esc(e.item.textContent)}」`); count(); },
        onRemove: count,
      });
      sortable(ctx, trash, {
        group: { name: "trash", put: ["plan"] },
        onAdd: (e) => {
          say(`<code>onAdd</code> 回收桶收到「${esc(e.item.textContent)}」，已刪除`);
          e.item.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.5)" }], { duration: 300, easing: "ease-in" }).onfinish = () => e.item.remove();

  {

      ctx.html(`<div class="sj-wrap"><div class="sj-head"><b>AI 資料分析課程大綱</b><span class="sj-evt"></span></div><div class="sj-split"><div class="sj-pane"><div class="sj-units">${UNITS.map(([id, name, ls], i) => `<div class="sj-unit" data-id="${id}"><div class="sj-unit-head"><span class="sj-grip">⠿</span>單元 ${i + 1}・${name}<span class="sj-count"></span></div><div class="sj-lessons">${ls.map((l) => `<div class="sj-lesson" data-id="${l}">${l}</div>`).join("")}</div></div>`).join("")}</div></div><div class="sj-pane sj-hide-n"><div class="sj-colhead"><div>toArray() 結構<code>即時更新</code></div></div><pre class="sj-json"></pre></div></div></div>`);

  {

    desc: "左邊相簿開啟 MultiDrag 外掛：點一下選取，選好幾張後一起拖，Sortable.utils.select() 也能用程式選取。右邊座位表開啟 Swap 外掛：放下時兩個位置互換，而不是把後面的人往後推。兩個外掛都內建在 UMD 版本中。",
    hint: "點照片多選後一起拖・座位拖到另一個座位上互換",
    mount(ctx) {
      const PH = ["峽灣", "紅岩峽谷", "山谷公路", "巴哥犬", "瀑布彩虹", "水母", "母獅", "海象群"];

      });

  {
    id: "events", title: "事件與順序",
    api: "onChoose / onStart / onMove / onChange / onUpdate / onEnd + toArray() / sort()",

    hint: "拖一個車站看事件順序・按按鈕讀寫順序",
    mount(ctx) {
      const HSR = [["NAG", "南港"], ["TPE", "台北"], ["BAQ", "板橋"], ["TAY", "桃園"], ["HSC", "新竹"], ["MIL", "苗栗"], ["TAC", "台中"], ["CHA", "彰化"], ["YUL", "雲林"], ["CHY", "嘉義"], ["TNN", "台南"], ["ZUY", "左營"]];
      ctx.html(`<div class="sj-wrap"><div class="sj-split"><div class="sj-pane"><div class="sj-colhead"><div>高鐵停靠站<code>data-id = 車站代碼</code></div></div><div class="sj-stations">${HSR.map(([id, n], i) => `<div class="sj-chip sj-hue" data-id="${id}" style="--h:${190 + i * 13}"><small>${id}</small>${n}</div>`).join("")}</div><div class="sj-arr"></div></div><div class="sj-pane"><div class="sj-colhead">事件紀錄（新的在上）</div><div class="sj-log"></div></div></div></div>`);

      ctx.button("sort(反轉)", () => { s.sort(s.toArray().reverse(), true); show(); log("sort", " 反轉"); });

      const list = ctx.$(".sj-stations");

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "sortable.sort(shuffle(order), true)  ×  N 個元素",
    desc: "清單放入 N 個色塊，每 0.7 秒用 sort(亂序, true) 整串重排並播放 500ms 的 FLIP 動畫（SortableJS 會讀取每個元素位置再逐一補間），逐級加量直到掉到 30 FPS 以下；同時量 Sortable.create 建立耗時與單次 sort() 的同步耗時。",
    hint: "按「自動加壓」開始・也可拖動手動滑桿",
    mount(ctx) {
      ctx.html(`<div class="sj-stress"></div>`);
      const grid = ctx.$(".sj-stress");
      let s = null, order = [], initMs = 0, sortMs = 0, flip = false;
      ctx.onCleanup(() => s && s.destroy());
      const build = (n) => {
        if (s) { s.destroy(); s = null; }
        const W = grid.clientWidth - 8, H = grid.clientHeight - 8;
        const side = Math.max(3, Math.floor(Math.sqrt((W * H) / n)) - 1);
        const cols = Math.max(1, Math.floor(W / (side + 1)));
        grid.style.gridTemplateColumns = `repeat(${cols}, ${side}px)`;
        grid.style.gridAutoRows = `${side}px`;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < n; i++) {
          const d = document.createElement("div");
          d.dataset.id = i;
          d.style.background = `hsl(${(i / n) * 300} 70% 55%)`;
          frag.append(d);
        }
        grid.replaceChildren(frag);
        const t0 = performance.now();
        s = Sortable.create(grid, { animation: 500, forceFallback: true, ghostClass: "sj-ghost" });
        initMs = performance.now() - t0;
        order = s.toArray();
      };
      ctx.interval(() => {
        if (!s) return;
        flip = !flip;
        const t0 = performance.now();
        s.sort(flip ? shuffle(order) : order, true);
        sortMs = performance.now() - t0;
      }, 700);
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "元素數", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000], minFps: 30,
        apply: (n) => build(n),
        metrics: () => ({ "create()": Showcase.fmtMs(initMs), "單次 sort()": Showcase.fmtMs(sortMs), "DOM 節點": grid.children.length }),
        note: "Sortable.create 只綁事件，幾乎與數量無關；成本在 sort(order, true) 的動畫：要先量每個元素位置，再替每個元素設定 transform 補間。真實拖曳時同樣的動畫會套用在被擠開的元素上。",
      });
    },
  },
] });
