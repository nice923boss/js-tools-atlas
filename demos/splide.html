<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splide 示範：主圖與縮圖同步相簿</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: linear-gradient(180deg, #14161b, var(--bg)); }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 14px 16px 48px; }
  .gallery { width: min(100%, 780px); }
  #main .splide__slide { position: relative; height: clamp(170px, calc(100vh - 220px), 430px); border-radius: 16px; overflow: hidden; background: #000; }
  #main .splide__slide img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.04); }
  /* slow Ken Burns zoom on the visible slide */
  #main .splide__slide.is-active img { animation: kb 7s ease-out forwards; }
  @keyframes kb { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.16) translate(-2%, -1%); } }
  #main .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 50px 22px 18px; background: linear-gradient(transparent, rgba(0,0,0,.78)); }
  #main .cap small { font: 700 11px var(--mono); letter-spacing: .14em; color: var(--accent); }
  #main .cap b { display: block; font-size: clamp(20px, 3.6vw, 32px); line-height: 1.2; }
  #main .cap span { font-size: 13px; color: rgba(255,255,255,.82); }
  #main .is-active .cap > * { animation: up .7s .15s both cubic-bezier(.2,.8,.2,1); }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  #main .splide__arrow { background: rgba(255,255,255,.85); opacity: 1; width: 2.4em; height: 2.4em; }
  .row { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
  .row .splide__progress { flex: 1; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .row .splide__progress__bar { height: 3px; background: var(--accent); }
  .row .btn { padding: 6px 12px; font-size: 12px; min-width: 64px; }
  .row .count { font: 700 12px var(--mono); color: var(--muted); min-width: 44px; text-align: right; }
  #thumbs .splide__slide { border-radius: 10px; overflow: hidden; opacity: .45; border: 2px solid transparent !important; transition: opacity .3s, border-color .3s; }
  #thumbs .splide__slide.is-active { opacity: 1; border-color: var(--accent) !important; }
  #thumbs .splide__slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="gallery">
    <section class="splide" id="main" aria-label="風景與動物相簿">
      <div class="splide__track"><ul class="splide__list" id="mainList"></ul></div>
      <div class="row">
        <button class="splide__toggle btn" type="button"><span class="splide__toggle__play">播放</span><span class="splide__toggle__pause">暫停</span></button>
        <div class="splide__progress"><div class="splide__progress__bar"></div></div>
        <span class="count" id="count">1 / 8</span>
      </div>
    </section>
  </div>
  <div class="gallery">
    <section class="splide" id="thumbs" aria-label="縮圖導覽">
      <div class="splide__track"><ul class="splide__list" id="thumbList"></ul></div>
    </section>
  </div>
</div>
<div class="hint">點縮圖跳到該張，主圖也能拖曳</div>

<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
<script>
const PHOTOS = [
  ["FJORD", "挪威峽灣", "冰河切出的深谷，海水一路灌進山裡"],
  ["CANYON", "紅岩峽谷", "夕陽把砂岩照成一整片橘紅"],
  ["VALLEY ROAD", "綠谷公路", "一條路蜿蜒穿過整片翠綠山谷"],
  ["PUG", "披毯巴哥犬", "裹著毯子，表情比天氣還無奈"],
  ["WATERFALL", "瀑布與彩虹", "水霧夠多，彩虹就自己出現"],
  ["JELLYFISH", "深海水母", "藍色背景裡的一朵橘色降落傘"],
  ["LIONESS", "母獅特寫", "近到看得見每一根鬍鬚"],
  ["WALRUS", "海象群", "整群擠在岸邊曬太陽"],
];
document.getElementById("mainList").innerHTML = PHOTOS.map(([en, name, line], i) =>
  `<li class="splide__slide"><img src="_shared/img/photo-${i + 1}.jpg" alt="${name}"><div class="cap"><small>${en}</small><b>${name}</b><span>${line}</span></div></li>`
).join("");
document.getElementById("thumbList").innerHTML = PHOTOS.map(([, name], i) =>
  `<li class="splide__slide"><img src="_shared/img/photo-${i + 1}.jpg" alt="${name}"></li>`
).join("");

const main = new Splide("#main", {
  type: "fade",
  rewind: true,
  speed: 800,
  pagination: false,
  autoplay: true,
  interval: 3600,
  pauseOnHover: true,
  i18n: { prev: "上一張", next: "下一張", play: "開始自動播放", pause: "暫停自動播放", carousel: "輪播", slide: "投影片" },
});
const thumbs = new Splide("#thumbs", {
  fixedWidth: 104,
  fixedHeight: 66,
  gap: 10,
  rewind: true,
  pagination: false,
  arrows: false,
  isNavigation: true,
  focus: "center",
  breakpoints: { 560: { fixedWidth: 66, fixedHeight: 46, gap: 6 } },
});

const count = document.getElementById("count");
main.on("move", (index) => { count.textContent = index + 1 + " / " + PHOTOS.length; });
main.sync(thumbs);
main.mount();
thumbs.mount();
</script>
</body>
</html>
