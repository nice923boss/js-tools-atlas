<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splide 示範：8 個場景看懂輪播選項、擴充與上限</title>

<script type="application/json" id="demo-meta">{"mode":"auto","scenes":["相簿同步","三種 type","perPage 與斷點","方向與滾輪","API 與事件","AutoScroll 擴充","Intersection 擴充","極限測試"]}</script>
<style>
  .pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  /* A carousel whose height comes from its parent: track flexes, list and slides fill it. */
  .fill { display: flex; flex-direction: column; min-height: 0; }
  .fill > .splide__track { flex: 1; min-height: 0; }
  .fill .splide__list, .fill .splide__slide { height: 100%; }
  .ph { position: relative; overflow: hidden; border-radius: 12px; background: #11141a; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .ph .t { position: absolute; left: 8px; bottom: 8px; padding: 4px 7px; border-radius: 6px; background: rgba(0, 0, 0, .62); color: #fff; font-size: 12px; white-space: nowrap; }
  .ph .t i { font: 600 11px var(--mono); font-style: normal; color: var(--accent); margin-right: 5px; }
  .lab { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .lab code { font: 600 12px var(--mono); color: var(--fg); }
  .lab b { color: var(--c3); font-weight: 600; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* 1. gallery */
  .s1 { display: flex; flex-direction: column; gap: 10px; }
  .s1 .main { flex: 1; }
  .s1 .main .splide__slide { border-radius: 14px; overflow: hidden; background: #000; }
  .s1 .main img { transform: scale(1.04); }
  .s1 .main .is-active img { animation: kb 7s ease-out forwards; }
  @keyframes kb { from { transform: scale(1.04) translate(0, 0); } to { transform: scale(1.16) translate(-2%, -1%); } }
  .s1 .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 44px 20px 16px; background: linear-gradient(transparent, rgba(0, 0, 0, .78)); }
  .s1 .cap small { font: 700 11px var(--mono); letter-spacing: .14em; color: var(--accent); }
  .s1 .cap b { display: block; font-size: clamp(19px, 3.4vw, 30px); line-height: 1.2; }
  .s1 .cap span { font-size: 13px; color: rgba(255, 255, 255, .82); }
  .s1 .cap em { display: inline-block; margin-left: 8px; padding: 2px 6px; border-radius: 5px; font: 600 10.5px var(--mono); font-style: normal; color: var(--accent-ink); background: var(--accent); }
  .s1 .is-active .cap > * { animation: up .7s .15s both cubic-bezier(.2, .8, .2, 1); }
  @keyframes up { from { opacity: 0; transform: translateY(14px); } }
  .s1 .main .splide__arrow { top: calc(50% - 20px); background: rgba(255, 255, 255, .85); opacity: 1; width: 2.4em; height: 2.4em; }
  .s1row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .s1row .splide__progress { flex: 1; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .s1row .splide__progress__bar { height: 3px; background: var(--accent); }
  .s1row .btn { padding: 6px 12px; font-size: 12px; min-width: 60px; }
  .s1row .left { font: 500 12px var(--mono); color: var(--muted); min-width: 86px; text-align: right; }
  .s1row .count { font: 700 12px var(--mono); color: var(--fg); min-width: 40px; text-align: right; }
  .s1 .thumbs .splide__slide { border-radius: 10px; overflow: hidden; opacity: .45; border: 2px solid transparent !important; transition: opacity .3s, border-color .3s; }
  .s1 .thumbs .splide__slide.is-active { opacity: 1; border-color: var(--accent) !important; }
  .s1 .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 2. three types side by side */
  .s2 { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cell { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .cell .splide { flex: 1; border-radius: 12px; overflow: hidden; }
  @media (max-width: 560px) { .s2 { grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(0, 1fr)); } }

  /* 3. perPage and breakpoints */
  .s3 { display: flex; flex-direction: column; gap: 8px; }
  .s3 .splide { flex: 1; }
  .s3 .ph b { position: absolute; right: 10px; top: 6px; font: 800 26px var(--mono); color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
  .s3 .ph { outline: 2px solid transparent; outline-offset: -2px; transition: outline-color .2s; }
  .s3 .ph.is-visible { outline-color: rgba(247, 223, 30, .55); }
  .rules { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; align-items: center; }
  .rules span { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .rules span code { font: 500 11px var(--mono); }
  .rules span.on { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
  .rules span.w { border-style: dashed; }
  .rules.off span:not(.w) { opacity: .35; }
  @media (max-width: 560px) { .rules code.o { display: none; } }

  /* 4. direction */
  .s4 { display: flex; flex-direction: column; }
  .hold { position: relative; flex: 1; min-height: 0; }
  .hold .splide__slide { border-radius: 12px; }
  .dirbadge { position: absolute; left: 10px; bottom: 10px; z-index: 2; padding: 6px 9px; border-radius: 8px; background: rgba(14, 16, 19, .78); font-size: 12px; pointer-events: none; }
  .dirbadge code { font: 600 12px var(--mono); color: var(--accent); }

  /* 5. API and events */
  .s5 { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr) minmax(0, 290px); }
  .s5 .splide { min-height: 0; }
  .s5 .ph { cursor: pointer; }
  .log { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 8px; gap: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chips span { font: 500 10.5px/1 var(--mono); padding: 4px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
  .chips span b { color: var(--fg); font-weight: 600; }
  .chips span.hit { animation: hit .6s ease-out; }
  @keyframes hit { from { background: var(--accent); color: var(--accent-ink); } }
  .log ol { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: hidden; font: 11px/1.55 var(--mono); }
  .log li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .log li em { font-style: normal; color: var(--fg); }
  .log li .e1 { color: var(--c1); } .log li .e2 { color: var(--c2); } .log li .e3 { color: var(--c4); } .log li .e4 { color: var(--c5); } .log li .e5 { color: var(--c6); }
  @media (max-width: 620px) { .s5 { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); } }

  /* 6. AutoScroll */
  .s6 { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.25fr) minmax(0, .55fr) minmax(0, 1fr); }
  .s6 .rowx { display: flex; flex-direction: column; gap: 4px; min-height: 0; min-width: 0; }
  .s6 .splide { flex: 1; }
  .pill { display: flex; align-items: center; }
  .pill span { padding: 8px 14px; border-radius: 999px; border: 1px solid; font: 600 13px var(--mono); white-space: nowrap; background: var(--panel); }

  /* 7. Intersection */
  .vp { position: absolute; inset: calc(var(--sc-ctl-h, 0px) + 10px) 10px 10px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .scroller { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 0 12px; scrollbar-width: thin; }
  .gapblock { height: 45%; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; text-align: center; }
  .io { height: 55%; border-radius: 12px; }
  .io .splide__slide { border-radius: 10px; }
  .io .badge { position: absolute; left: 8px; top: 8px; z-index: 3; padding: 5px 8px; border-radius: 7px; font-size: 12px; background: rgba(14, 16, 19, .82); }
  .io .badge.on { background: var(--c4); color: #0e1013; font-weight: 700; }
  .io .splide__progress { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; height: 4px; background: rgba(0, 0, 0, .4); }
  .io .splide__progress__bar { height: 4px; background: var(--accent); }
  .band { position: absolute; left: 0; right: 0; top: 40%; bottom: 40%; border-top: 1px dashed var(--accent); border-bottom: 1px dashed var(--accent); background: rgba(247, 223, 30, .05); pointer-events: none; z-index: 4; }
  .band span { position: absolute; right: 8px; top: -9px; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font: 600 10.5px var(--mono); }

  /* 8. stress */
  .stress-vis { position: absolute; inset: 8px 8px 8px 350px; display: flex; flex-direction: column; gap: 8px; padding-bottom: var(--sc-ctl-b, 0px); overflow: hidden; }
  .stress-vis .sinfo { font-size: 12px; color: var(--muted); }
  .stress-vis .shold { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .stress-vis .splide { flex: 1; }
  .stress-vis .splide__slide { display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #0e1013; font: 700 20px var(--mono); }
  .stress-vis .splide__pagination { max-height: 46px; overflow: hidden; }
  .k0 { background: var(--c1); } .k1 { background: var(--c2); } .k2 { background: var(--c3); } .k3 { background: var(--c4); } .k4 { background: var(--c5); } .k5 { background: var(--c6); }
  @media (max-width: 760px) { .stress-vis { inset: 8px; } }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-auto-scroll@0.5.3/dist/js/splide-extension-auto-scroll.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-intersection@0.2.0/dist/js/splide-extension-intersection.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Splide 4: every scene builds its own carousel(s) and destroys them on unmount.
const { fmt, fmtCompact } = Showcase;
const PHOTOS = [
  ["FJORD", "挪威峽灣", "冰河切出的深谷，海水一路灌進山裡"],
  ["CANYON", "紅岩峽谷", "夕陽把砂岩照成一整片橘紅"],
  ["VALLEY ROAD", "綠谷公路", "一條路蜿蜒穿過整片翠綠山谷"],
  ["PUG", "披毯巴哥犬", "裹著毯子，表情比天氣還無奈"],
  ["WATERFALL", "瀑布與彩虹", "水霧夠多，彩虹就自己出現"],
  ["JELLYFISH", "深海水母", "藍色背景裡的一朵橘色降落傘"],
  ["LIONESS", "母獅特寫", "近到看得見每一根鬍鬚"],
  ["WALRUS", "海象群", "整群擠在岸邊曬太陽"],
];
// Static defaults are merged into every instance: Traditional Chinese aria labels.
Splide.defaults = {
  i18n: { prev: "上一張", next: "下一張", first: "第一張", last: "最後一張", slideX: "前往第 %s 張", pageX: "前往第 %s 頁",
    play: "開始自動播放", pause: "暫停自動播放", carousel: "輪播", slide: "投影片", select: "選擇要顯示的投影片", slideLabel: "第 %s 張，共 %s 張" },
};
const img = (i) => `<img src="_shared/img/photo-${(i % 8) + 1}.jpg" alt="${PHOTOS[i % 8][1]}" draggable="false">`;
const photoSlide = (i, label = `<i>#${i + 1}</i>${PHOTOS[i % 8][1]}`, attrs = "") =>
  `<li class="splide__slide ph"${attrs}>${img(i)}<span class="t">${label}</span></li>`;
const carousel = (cls, label, slides, extra = "") =>
  `<section class="splide ${cls}" aria-label="${label}"><div class="splide__track"><ul class="splide__list">${slides}</ul></div>${extra}</section>`;
const range = (n) => Array.from({ length: n }, (_, i) => i);
// Create, mount and register for cleanup in one call.
function make(ctx, root, options, extensions) {
  const s = new Splide(root, options);
  s.mount(extensions);
  ctx.onCleanup(() => s.state.is(Splide.STATES.DESTROYED) || s.destroy());
  return s;
}

Showcase.run({ scenes: [
  {
    id: "gallery", title: "相簿同步",
    api: 'new Splide(main, { type: "fade", autoplay: true }).sync(thumbs)',
    desc: "主圖用 fade 淡入加 Ken Burns 慢推，縮圖輪播設 isNavigation 後用 sync() 綁定。進度條與播放鍵是 Splide 內建元素，第 4 張用 data-splide-interval 單獨停 7 秒。",
    hint: "點縮圖跳到該張；滑鼠移到主圖上會暫停；右上滑桿改自動播放間隔",
    mount(ctx) {
      const mainSlides = PHOTOS.map(([en, name, line], i) =>
        `<li class="splide__slide"${i === 3 ? ' data-splide-interval="7000"' : ""}>${img(i)}<div class="cap"><small>${en}</small><b>${name}${i === 3 ? "<em>data-splide-interval 7 秒</em>" : ""}</b><span>${line}</span></div></li>`).join("");
      ctx.html(`<div class="pad s1">
        ${carousel("main fill", "風景與動物相簿", mainSlides, `<div class="s1row">
          <button class="splide__toggle btn" type="button"><span class="splide__toggle__play">播放</span><span class="splide__toggle__pause">暫停</span></button>
          <div class="splide__progress"><div class="splide__progress__bar"></div></div>
          <span class="left">…</span><span class="count">1 / 8</span></div>`)}
        ${carousel("thumbs", "縮圖導覽", PHOTOS.map((_, i) => `<li class="splide__slide">${img(i)}</li>`).join(""))}
      </div>`);
      const main = new Splide(ctx.$(".main"), { type: "fade", rewind: true, speed: 800, pagination: false, autoplay: true, interval: 3600, pauseOnHover: true });
      const thumbs = new Splide(ctx.$(".thumbs"), {
        fixedWidth: 104, fixedHeight: 66, gap: 10, rewind: true, pagination: false, arrows: false,
        isNavigation: true, focus: "center", breakpoints: { 560: { fixedWidth: 66, fixedHeight: 46, gap: 6 } },
      });
      const count = ctx.$(".count"), left = ctx.$(".left");
      // The per-slide attribute wins over options.interval, exactly like Splide's Autoplay does.
      const intervalOf = (i) => +main.Components.Slides.getAt(i).slide.getAttribute("data-splide-interval") || main.options.interval;
      main.on("move", (i) => { count.textContent = `${i + 1} / ${PHOTOS.length}`; });
      main.on("autoplay:playing", (rate) => { left.textContent = `下一張 ${((intervalOf(main.index) * (1 - rate)) / 1000).toFixed(1)} 秒`; });
      main.on("autoplay:pause", () => { left.textContent = "已暫停"; });
      main.sync(thumbs);
      main.mount();
      thumbs.mount();
      ctx.onCleanup(() => { main.destroy(); thumbs.destroy(); });
      ctx.slider("間隔", { min: 1.5, max: 8, step: 0.5, value: 3.6, format: (v) => `${v.toFixed(1)} 秒` }, (v) => { main.options = { interval: v * 1000 }; });
    },
  },
  {
    id: "types", title: "三種 type",
    api: 'new Splide(el, { type: "slide" | "loop" | "fade", rewind })',
    desc: "同樣 5 張圖、同時呼叫 go('>')：slide 走到底就停（除非開 rewind），loop 用前後複製的投影片無縫接回第一張，fade 原地交叉淡入。",
    hint: "看第 5 張之後三者的差別；開 rewind 讓 slide 與 fade 倒帶回第一張",
    mount(ctx) {
      const TYPES = ["slide", "loop", "fade"];
      ctx.html(`<div class="pad s2">${TYPES.map((t) => `<div class="cell"><div class="lab"><code>type: "${t}"</code><span data-ro="${t}"></span></div>
        ${carousel(`fill t-${t}`, `type ${t}`, range(5).map((i) => photoSlide(i)).join(""))}</div>`).join("")}</div>`);
      let rewind = false, auto = true, live = [];
      const readout = (t, s, i = s.index) => {
        const clones = s.root.querySelectorAll(".splide__slide--clone").length;
        const end = t !== "loop" && !rewind && i === s.length - 1;
        ctx.$(`[data-ro="${t}"]`).innerHTML = `<span class="mono">${i + 1} / ${s.length}</span>${t === "loop" ? `，複製 ${clones} 張` : ""}${end ? "，<b>已到底</b>" : ""}`;
      };
      const build = () => {
        live.forEach((s) => s.destroy());
        live = TYPES.map((t) => {
          const s = new Splide(ctx.$(`.t-${t}`), { type: t, rewind, speed: t === "fade" ? 700 : 600 });
          s.on("move", (i) => readout(t, s, i));
          s.mount();
          readout(t, s);
          return s;
        });
      };
      build();
      ctx.onCleanup(() => live.forEach((s) => s.destroy()));
      ctx.interval(() => auto && live.forEach((s) => s.go(">")), 2200);
      ctx.button("全部 go('>')", () => live.forEach((s) => s.go(">")), { primary: true });
      ctx.toggle("自動前進", true, (v) => { auto = v; });
      ctx.toggle("rewind", false, (v) => { rewind = v; build(); });
    },
  },
  {
    id: "perpage", title: "perPage 與斷點",
    api: 'breakpoints: { 820: { perPage: 3, gap: 12 } }，splide.options = { perPage, gap, padding }',
    desc: "breakpoints 依視窗寬度（max-width）合併設定，越窄的規則越優先；改成手動後，滑桿直接寫入 splide.options，不必重建輪播。黃框是 is-visible 的投影片。",
    hint: "縮放視窗看規則切換；切到「手動」用滑桿調 perPage、gap、padding",
    mount(ctx) {
      const BASE = { perPage: 5, gap: 16, padding: 0 };
      const BP = { 1100: { perPage: 4 }, 820: { perPage: 3, gap: 12 }, 560: { perPage: 2, padding: "2rem" }, 400: { perPage: 1, padding: "3rem" } };
      const man = { perPage: 3, gap: 12, padding: 0, focus: false };
      ctx.html(`<div class="pad s3"><div class="lab"><span data-ro></span></div>
        ${carousel("fill", "perPage 示範", range(12).map((i) => `<li class="splide__slide ph">${img(i)}<b>${i + 1}</b></li>`).join(""))}
        <div class="rules"></div></div>`);
      const root = ctx.$(".splide"), rules = ctx.$(".rules"), ro = ctx.$("[data-ro]");
      let mode = 0, s = null;
      const fmtOpt = (o) => Object.entries(o).map(([k, v]) => `${k}: ${typeof v === "string" ? `"${v}"` : v}`).join(", ");
      const paint = () => {
        const o = s.options;
        ro.innerHTML = `目前生效：<code>perPage ${o.perPage}，gap ${o.gap}，padding ${JSON.stringify(o.padding)}${o.focus != null ? `，focus "${o.focus}"` : ""}</code>`;
        rules.classList.toggle("off", mode === 1);
        rules.innerHTML = `<span class="w">視窗寬 <code>${innerWidth}px</code>${mode === 1 ? "，手動模式不套用斷點" : ""}</span><span class="${mode === 0 ? "on" : ""}">預設 <code class="o">${fmtOpt(BASE)}</code></span>` +
          Object.keys(BP).sort((a, b) => b - a).map((k) => `<span class="${mode === 0 && matchMedia(`(max-width:${k}px)`).matches ? "on" : ""}">≤ ${k}px <code class="o">${fmtOpt(BP[k])}</code></span>`).join("");
      };
      const build = () => {
        if (s) s.destroy();
        const opts = mode === 0 ? { ...BASE, breakpoints: BP } : { perPage: man.perPage, gap: man.gap, padding: man.padding, ...(man.focus ? { focus: "center" } : {}) };
        s = new Splide(root, { ...opts, pagination: false });
        s.on("updated", paint);
        s.mount();
        paint();
      };
      build();
      ctx.onCleanup(() => s.destroy());
      ctx.onResize(paint);
      const manual = [];
      ctx.group(["breakpoints", "手動"], 0, (i) => { mode = i; manual.forEach((w) => { w.style.display = i ? "" : "none"; }); build(); });
      const set = (k) => (v) => { man[k] = v; s.options = { [k]: v }; };
      manual.push(ctx.slider("perPage", { min: 1, max: 6, value: man.perPage }, set("perPage")).parentElement);
      manual.push(ctx.slider("gap", { min: 0, max: 40, value: man.gap, format: (v) => `${v}px` }, set("gap")).parentElement);
      manual.push(ctx.slider("padding", { min: 0, max: 80, value: man.padding, format: (v) => `${v}px` }, set("padding")).parentElement);
      manual.push(ctx.toggle("focus 置中", false, (v) => { man.focus = v; build(); }));
      manual.forEach((w) => { w.style.display = "none"; });
    },
  },
  {
    id: "direction", title: "方向與滾輪",
    api: '{ direction: "ltr" | "rtl" | "ttb", height, wheel: true, keyboard: true, drag: "free", snap: true }',
    desc: "direction 換成 rtl 會反轉移動方向與方向鍵，ttb 變成直向輪播（必須給 height）。wheel 讓滑鼠滾輪翻頁，drag: \"free\" 加 snap 變成可甩動、放手後吸附。",
    hint: "在輪播上滾動滑鼠滾輪；點一下箭頭後可用方向鍵；試試自由拖曳",
    mount(ctx) {
      const DIRS = ["ltr", "rtl", "ttb"];
      const KEYS = { ltr: "→", rtl: "←", ttb: "↓" };
      ctx.html(`<div class="pad s4"><div class="hold">${carousel("", "方向示範", range(8).map((i) => photoSlide(i)).join(""))}<div class="dirbadge"></div></div></div>`);
      const hold = ctx.$(".hold"), badge = ctx.$(".dirbadge");
      let dir = 0, free = false, s = null;
      const paint = (i = s.index) => {
        const d = DIRS[dir];
        badge.innerHTML = `<code>direction: "${d}"</code>　第 <span class="mono">${i + 1}</span> 張　${KEYS[d]} 鍵或滾輪往下＝下一張`;
      };
      const build = () => {
        if (s) s.destroy();
        const d = DIRS[dir], w = hold.clientWidth;
        s = new Splide(ctx.$(".hold .splide"), {
          type: "loop", direction: d, height: hold.clientHeight, perPage: d === "ttb" ? 2 : w < 560 ? 1 : 3, gap: 10,
          wheel: true, keyboard: true, autoplay: true, interval: 2200, drag: free ? "free" : true, snap: free,
        });
        s.on("move", paint);
        s.mount();
        paint();
      };
      // The height option is a pixel value, so rebuild whenever the holder changes size (including when the controls appear).
      let lw = 0, lh = 0, pend = 0;
      const ro = new ResizeObserver(() => {
        cancelAnimationFrame(pend);
        pend = requestAnimationFrame(() => {
          if (!ctx.active || (hold.clientWidth === lw && hold.clientHeight === lh)) return;
          lw = hold.clientWidth; lh = hold.clientHeight;
          build();
        });
      });
      ro.observe(hold);
      ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pend); if (s) s.destroy(); });
      ctx.group(DIRS, 0, (i) => { dir = i; build(); });
      ctx.toggle("自由拖曳", false, (v) => { free = v; build(); });
    },
  },
  {
    id: "events", title: "API 與事件",
    api: 'splide.on("move moved active visible click drag …")，go("+2")，add(html)，remove(index)',
    desc: "右側即時列出 Splide 發出的事件與參數；按鈕呼叫 go() 的各種控制字串，add()／remove() 會觸發 refresh 並重建複製投影片。",
    hint: "點投影片、拖曳、按右上按鈕，看事件依序出現",
    mount(ctx) {
      const EVENTS = ["move", "moved", "active", "inactive", "visible", "hidden", "click", "drag", "dragged", "refresh", "autoplay:play", "autoplay:pause"];
      const FAMILY = { move: 1, moved: 1, active: 2, inactive: 2, visible: 3, hidden: 3, click: 4, drag: 4, dragged: 4, refresh: 5 };
      ctx.html(`<div class="pad s5">${carousel("fill", "事件示範", range(6).map((i) => photoSlide(i)).join(""))}
        <div class="log"><div class="chips">${EVENTS.map((e) => `<span data-e="${e}">${e} <b>0</b></span>`).join("")}</div><ol></ol></div></div>`);
      const list = ctx.$(".log ol"), t0 = performance.now();
      const counts = {};
      const slideName = (S) => (S.isClone ? `複製 #${S.slideIndex + 1}` : `#${S.index + 1}`);
      const describe = (e, a) => {
        if (e === "move") return `${a[1] + 1} → ${a[0] + 1}`;
        if (e === "moved") return `停在第 ${a[0] + 1} 張`;
        if (a[0] && a[0].slide) return slideName(a[0]);
        return "";
      };
      const log = (e, detail) => {
        counts[e] = (counts[e] || 0) + 1;
        const chip = ctx.$(`[data-e="${e}"]`);
        if (chip) { chip.querySelector("b").textContent = counts[e]; chip.classList.remove("hit"); void chip.offsetWidth; chip.classList.add("hit"); }
        const li = document.createElement("li");
        li.innerHTML = `${((performance.now() - t0) / 1000).toFixed(2)}s <span class="e${FAMILY[e] || 5}">${e}</span> <em>${detail}</em>`;
        list.prepend(li);
        while (list.children.length > 40) list.lastChild.remove();
      };
      const s = new Splide(ctx.$(".s5 .splide"), { type: "loop", perPage: 3, focus: "center", gap: 10, autoplay: true, interval: 2400, breakpoints: { 620: { perPage: 2 } } });
      s.on("mounted", () => log("mounted", `${s.length} 張`));
      EVENTS.forEach((e) => s.on(e, (...a) => log(e, describe(e, a))));
      s.on("click", (S) => s.go(S.slideIndex > -1 ? S.slideIndex : S.index));
      s.mount();
      ctx.onCleanup(() => s.destroy());
      let added = 0;
      ctx.button("go('<')", () => s.go("<"));
      ctx.button("go('>')", () => s.go(">"));
      ctx.button("go('+2')", () => s.go("+2"));
      ctx.button("add()", () => { s.add(photoSlide(added + 6, `<i>新</i>第 ${++added} 張新增`)); }, { primary: true });
      ctx.button("remove()", () => { if (s.length > 4) s.remove(s.length - 1); });
    },
  },
  {
    id: "autoscroll", title: "AutoScroll 擴充",
    api: 'splide.mount({ AutoScroll })，autoScroll: { speed: -0.6 }，Components.AutoScroll.pause()',
    desc: "AutoScroll 擴充讓 loop 輪播像跑馬燈一樣連續移動，speed 正負決定方向。搭配 autoWidth 與 drag: \"free\"，每張寬度不同也能無縫循環，滑鼠移入自動暫停。",
    hint: "滑鼠移到任一列上會暫停；拖曳可甩動；右上滑桿改速度倍率",
    mount(ctx) {
      const W = [230, 170, 270, 200, 250, 180, 220, 240];
      const OPTS = ["type: \"loop\"", "autoWidth", "drag: \"free\"", "perPage", "gap", "padding", "focus", "breakpoints", "isNavigation", "sync()", "wheel", "keyboard", "i18n", "lazyLoad", "pagination", "arrows", "direction: \"ttb\"", "rewind", "autoplay", "interval"];
      const ROWS = [
        { speed: 1, slides: range(8).map((i) => `<li class="splide__slide ph" style="width:${W[i]}px">${img(i)}</li>`) },
        { speed: -0.6, slides: OPTS.map((o, i) => `<li class="splide__slide pill"><span style="border-color:var(--c${(i % 6) + 1});color:var(--c${(i % 6) + 1})">${o}</span></li>`) },
        { speed: 1.6, slides: range(8).map((i) => `<li class="splide__slide ph" style="width:${W[(i + 3) % 8] - 30}px">${img(7 - i)}</li>`) },
      ];
      ctx.html(`<div class="pad s6">${ROWS.map((r, i) => `<div class="rowx"><div class="lab" data-rl="${i}"></div>${carousel("fill", `跑馬燈 ${i + 1}`, r.slides.join(""))}</div>`).join("")}</div>`);
      let mul = 1;
      const rows = ROWS.map((r, i) => make(ctx, ctx.$$(".s6 .splide")[i], {
        type: "loop", autoWidth: true, gap: 10, drag: "free", arrows: false, pagination: false, autoScroll: { speed: r.speed },
      }, { AutoScroll: window.splide.Extensions.AutoScroll }));
      const paint = () => rows.forEach((s, i) => {
        const sp = +(ROWS[i].speed * mul).toFixed(2);
        ctx.$(`[data-rl="${i}"]`).innerHTML = `<span><code>autoScroll: { speed: ${sp} }</code>${sp < 0 ? "　反向" : ""}</span><span>${s.Components.AutoScroll.isPaused() ? "<b>暫停中</b>" : "捲動中"}</span>`;
      });
      ctx.interval(paint, 250);
      paint();
      ctx.slider("速度倍率", { min: 0.2, max: 4, step: 0.2, value: 1, format: (v) => `×${v.toFixed(1)}` }, (v) => {
        mul = v;
        rows.forEach((s, i) => { s.options = { autoScroll: { speed: ROWS[i].speed * v } }; });
      });
      ctx.toggle("播放", true, (v) => rows.forEach((s) => (v ? s.Components.AutoScroll.play() : s.Components.AutoScroll.pause())));
    },
  },
  {
    id: "intersection", title: "Intersection 擴充",
    api: 'splide.mount({ Intersection })，intersection: { root, rootMargin, inView: { autoplay: true }, outView: { autoplay: false } }',
    desc: "Intersection 擴充用 IntersectionObserver 監看輪播：進入虛線觀察區才自動播放，離開就暫停，省下畫面外的計時器與動畫。",
    hint: "框內會自動上下捲動；自己捲動或點擊就停下，可用右上按鈕恢復",
    mount(ctx) {
      const KEYS = ["A", "B", "C"];
      ctx.html(`<div class="vp"><div class="scroller"><div class="gapblock">往下捲：輪播進入中間的虛線觀察區才會開始播放</div>
        ${KEYS.map((k, j) => carousel("io fill", `輪播 ${k}`, range(6).map((i) => photoSlide(i + j * 2, `<i>${k}</i>${PHOTOS[(i + j * 2) % 8][1]}`)).join(""),
          `<span class="badge" data-b="${k}">輪播 ${k}：等待中</span><div class="splide__progress"><div class="splide__progress__bar"></div></div>`) +
          `<div class="gapblock">${j < 2 ? "觀察區外的輪播保持暫停" : "到底了，會再往回捲"}</div>`).join("")}
        </div><div class="band"><span>觀察區 rootMargin -40%</span></div></div>`);
      const sc = ctx.$(".scroller");
      const all = KEYS.map((k, j) => {
        const s = new Splide(ctx.$$(".io")[j], {
          type: "loop", perPage: 2, gap: 8, arrows: false, pagination: false, autoplay: "pause", interval: 1500,
          breakpoints: { 560: { perPage: 1 } },
          intersection: { rootMargin: "-40% 0px -40% 0px", inView: { autoplay: true }, outView: { autoplay: false } },
        });
        // Splide's option merge copies objects key by key, which turns a DOM element into {}; set root after construction.
        s.options.intersection.root = sc;
        s.mount({ Intersection: window.splide.Extensions.Intersection });
        ctx.onCleanup(() => s.destroy());
        const badge = ctx.$(`[data-b="${k}"]`);
        let inside = false;
        const paint = () => {
          const playing = !s.Components.Autoplay.isPaused();
          badge.className = `badge${playing ? " on" : ""}`;
          badge.textContent = `輪播 ${k}：${inside ? "在觀察區內" : "在觀察區外"}，${playing ? "播放中" : "已暫停"}`;
        };
        s.on("intersection:in", () => { inside = true; paint(); });
        s.on("intersection:out", () => { inside = false; paint(); });
        return paint;
      });
      ctx.interval(() => all.forEach((p) => p()), 300);
      // Ping-pong auto scroll so the observer has something to react to; any user input stops it.
      let auto = true, dirY = 1, pos = 0;
      const autoBtn = ctx.toggle("自動捲動", true, (v) => { auto = v; pos = sc.scrollTop; });
      const stop = () => { auto = false; autoBtn.setAttribute("aria-pressed", "false"); };
      ["wheel", "pointerdown", "touchstart", "keydown"].forEach((t) => ctx.on(sc, t, stop, { passive: true }));
      ctx.raf((t, dt) => {
        if (!auto) return;
        const max = sc.scrollHeight - sc.clientHeight;
        pos += dirY * dt * 0.07;
        if (pos >= max) { pos = max; dirY = -1; } else if (pos <= 0) { pos = 0; dirY = 1; }
        sc.scrollTop = pos;
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: 'new Splide(el, { type: "loop", perPage: 4, pagination }).mount()，go(n - 1)',
    desc: "逐級加大投影片數量，量 mount() 加上一次 go() 跳到最後一張的同步耗時。每張投影片都有元件、ARIA 屬性與事件，分頁圓點和 loop 複製投影片會再放大成本。",
    hint: "按「開始測試」；下方可切換分頁圓點與 type 後再測一次",
    mount(ctx) {
      ctx.html(`<div class="stress-vis"><div class="sinfo"></div><div class="shold"></div></div>`);
      const hold = ctx.$(".shold"), info = ctx.$(".sinfo");
      let s = null, dots = true, type = "loop";
      const kill = () => { if (s) { s.destroy(); s = null; } };
      ctx.onCleanup(kill);
      const prepare = (n) => {
        kill();
        const items = new Array(n);
        for (let i = 0; i < n; i++) items[i] = `<li class="splide__slide k${i % 6}">${i + 1}</li>`;
        hold.innerHTML = carousel("fill", "大量投影片", items.join(""));
        return hold.firstElementChild;
      };
      const run = (n, root) => {
        s = new Splide(root, { type, perPage: 4, gap: 8, pagination: dots, speed: 300 });
        s.mount();
        s.go(n - 1);
        void root.offsetHeight;
        const pages = root.querySelectorAll(".splide__pagination__page").length;
        const clones = root.querySelectorAll(".splide__slide--clone").length;
        info.textContent = `目前：${fmt(n)} 張投影片（type "${type}"），分頁圓點 ${fmt(pages)} 顆，複製投影片 ${clones} 張`;
        return dots ? `${fmtCompact(pages)} 顆圓點` : "無圓點";
      };
      run(100, prepare(100));
      ctx.toggle("分頁圓點", true, (v) => { dots = v; });
      ctx.group(["loop", "slide"], 0, (i, l) => { type = l; });
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "投影片", unit: "張", sizes: [100, 500, 1000, 2500, 5000, 10000, 20000],
        prepare, run,
        note: "只計 new Splide().mount() 與 go() 的同步時間，產生 HTML 字串不計。瓶頸在每張投影片建立元件、寫入 ARIA 屬性與樣式；開著分頁圓點時每頁多一顆按鈕，loop 另外複製前後投影片。",
      });
    },
  },
] });
</script>
</body>
</html>
