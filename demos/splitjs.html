<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split.js 示範：可調整的編輯器分割窗格</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .topbar { position: fixed; left: 0; right: 0; top: 0; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .topbar .dots i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .topbar h1 { margin: 0; font-size: 14px; font-weight: 600; white-space: nowrap; }
  #app { position: fixed; inset: 52px 10px 42px; display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #12151a; }
  #main, #work { display: flex; min-width: 0; min-height: 0; }
  #main { flex-direction: column; }
  #work.row { flex-direction: row; }
  #work.col { flex-direction: column; }
  section, aside { min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .tabbar { flex: none; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: #171a20; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; }
  .tabbar b { color: var(--fg); font-weight: 600; padding: 4px 8px; border-radius: 6px 6px 0 0; background: #12151a; border-top: 2px solid var(--accent); }
  .tabbar .size { margin-left: auto; font: 500 11px var(--mono); color: var(--accent); opacity: 0; transition: opacity .3s; }
  .tabbar .size.on { opacity: 1; }
  #files { background: #15181d; }
  #files ul { list-style: none; margin: 0; padding: 8px 6px; font-size: 12.5px; }
  #files li { padding: 4px 8px; border-radius: 6px; white-space: nowrap; color: var(--muted); }
  #files li.on { background: rgba(247,223,30,.1); color: var(--fg); }
  #files li.dir { color: var(--fg); font-weight: 600; }
  #files li.sub { padding-left: 22px; }
  .editor { flex: 1; min-height: 0; display: flex; font: 12.5px/1.6 var(--mono); }
  .lines { flex: none; padding: 10px 8px 10px 10px; text-align: right; color: rgba(255,255,255,.25); user-select: none; overflow: hidden; white-space: pre; }
  textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: #d7e3f4; padding: 10px 10px 10px 4px; font: inherit; white-space: pre; tab-size: 2; scrollbar-width: thin; }
  iframe { flex: 1; border: 0; background: #fff; width: 100%; }
  #term .out { flex: 1; overflow: auto; padding: 6px 12px; font: 12px/1.6 var(--mono); color: #9fe0b3; scrollbar-width: thin; }
  #term .out div span { color: var(--muted); margin-right: 8px; }
  /* Split.js gutters */
  .gutter { flex: none; background: #1d2128; position: relative; transition: background .15s; }
  .gutter:hover, .gutter.dragging { background: var(--accent); }
  .gutter.gutter-horizontal { cursor: col-resize; }
  .gutter.gutter-vertical { cursor: row-resize; }
  .gutter::after { content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); border-radius: 2px; background: rgba(255,255,255,.35); }
  .gutter.gutter-horizontal::after { width: 2px; height: 26px; }
  .gutter.gutter-vertical::after { width: 26px; height: 2px; }
  @media (max-width: 560px) { .topbar h1 { display: none; } #app { inset: 52px 6px 42px; } }
</style>
</head>
<body>
<div class="topbar"><span class="dots"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></span><h1>迷你編輯器</h1></div>
<div class="controls">
  <button class="btn" id="dir">⇅ 切換上下排列</button>
  <button class="btn" id="tree">☰ 檔案</button>
  <button class="btn primary" id="reset">還原</button>
</div>
<div id="app">
  <aside id="files">
    <div class="tabbar">檔案總管</div>
    <ul>
      <li class="dir">▾ 讀書會網站</li>
      <li class="sub on">index.html</li>
      <li class="sub">style.css</li>
      <li class="sub">app.js</li>
      <li class="dir">▸ images</li>
      <li class="dir">▸ docs</li>
    </ul>
  </aside>
  <div id="main">
    <div id="work" class="row">
      <section id="code">
        <div class="tabbar"><b>index.html</b><span class="size" id="sizeA"></span></div>
        <div class="editor"><div class="lines" id="lines"></div><textarea id="src" spellcheck="false"></textarea></div>
      </section>
      <section id="view">
        <div class="tabbar"><b>即時預覽</b><span class="size" id="sizeB"></span></div>
        <iframe id="frame" title="預覽"></iframe>
      </section>
    </div>
    <section id="term">
      <div class="tabbar"><b>終端機</b><span class="size" id="sizeC"></span></div>
      <div class="out" id="out"></div>
    </section>
  </div>
</div>
<div class="hint">拖曳窗格間的分隔線調整大小・可直接改左邊程式碼</div>

<script src="https://cdn.jsdelivr.net/npm/split.js@1.6.5/dist/split.min.js"></script>
<script>
// IDE-like layout with three nested Split.js instances (sidebar | main, editor / terminal, code | preview).
const SAMPLE = `<style>
  body { font-family: sans-serif; margin: 0;
    display: grid; place-items: center; height: 100vh;
    background: linear-gradient(135deg, #4cc9f0, #9d8cff); }
  .card { background: #fff; padding: 20px 24px;
    border-radius: 16px; text-align: center;
    box-shadow: 0 12px 30px rgba(0,0,0,.2); }
  h2 { margin: 0 0 6px; color: #333; }
  p { margin: 0; color: #777; }
  button { margin-top: 12px; border: 0; padding: 8px 16px;
    border-radius: 99px; background: #f7df1e; font-weight: bold; }
</style>
<div class="card">
  <h2>台北程式讀書會</h2>
  <p>每週三晚上 7:30・大安區</p>
  <button>我要報名</button>
</div>`;
const src = document.getElementById("src");
const frame = document.getElementById("frame");
const out = document.getElementById("out");

function print(msg) {
  const t = new Date().toLocaleTimeString("zh-TW", { hour12: false });
  const line = document.createElement("div");
  line.innerHTML = `<span>[${t}]</span>`;
  line.append(msg);
  out.append(line);
  while (out.children.length > 30) out.firstChild.remove();
  out.scrollTop = out.scrollHeight;
}
function render() {
  frame.srcdoc = src.value;
  document.getElementById("lines").textContent = src.value.split("\n").map((_, i) => i + 1).join("\n");
}
let timer;
src.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { render(); print("已重新渲染預覽"); }, 250); });
src.addEventListener("scroll", () => (document.getElementById("lines").scrollTop = src.scrollTop));

// Show the live percentage in each pane's tab while dragging.
function showSizes(ids, sizes) {
  ids.forEach((id, i) => {
    const el = document.getElementById(id);
    el.textContent = `${sizes[i].toFixed(0)}%`;
    el.classList.add("on");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("on"), 900);
  });
}
const narrow = () => innerWidth < 560;
let outer, inner, work, vertical = false;

function build() {
  outer = Split(["#files", "#main"], {
    sizes: narrow() ? [0, 100] : [18, 82], minSize: [0, 160], gutterSize: 6, snapOffset: 50,
  });
  inner = Split(["#work", "#term"], {
    direction: "vertical", sizes: [74, 26], minSize: [120, 30], gutterSize: 6,
    onDrag: (s) => showSizes(["sizeA", "sizeC"], s),
    onDragEnd: (s) => print(`編輯區 ${s[0].toFixed(0)}%，終端機 ${s[1].toFixed(0)}%`),
  });
  buildWork();
}
function buildWork() {
  document.getElementById("work").className = vertical ? "col" : "row";
  work = Split(["#code", "#view"], {
    direction: vertical ? "vertical" : "horizontal",
    sizes: [52, 48], minSize: 60, gutterSize: 6,
    onDrag: (s) => showSizes(["sizeA", "sizeB"], s),
    onDragEnd: (s) => print(`程式碼 ${s[0].toFixed(0)}%，預覽 ${s[1].toFixed(0)}%`),
  });
}

document.getElementById("dir").addEventListener("click", (e) => {
  work.destroy();
  vertical = !vertical;
  buildWork();
  e.currentTarget.textContent = vertical ? "⇄ 切換左右排列" : "⇅ 切換上下排列";
  print(vertical ? "程式碼與預覽改為上下排列" : "程式碼與預覽改為左右排列");
});
document.getElementById("tree").addEventListener("click", () => {
  const [a] = outer.getSizes();
  outer.setSizes(a < 3 ? [narrow() ? 40 : 18, narrow() ? 60 : 82] : [0, 100]);
  print(a < 3 ? "展開檔案總管" : "收合檔案總管");
});
document.getElementById("reset").addEventListener("click", () => {
  [outer, inner, work].forEach((s) => s.destroy());
  vertical = false;
  document.getElementById("dir").textContent = "⇅ 切換上下排列";
  src.value = SAMPLE;
  render();
  build();
  print("已還原預設版面與程式碼");
});

src.value = SAMPLE;
render();
build();
print("Split.js 已建立 3 組可調整窗格");
print("提示：分隔線拖到邊緣會自動收合");
</script>
</body>
</html>
