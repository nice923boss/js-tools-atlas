<script>
// Split.js showcase: eight scenes from the original mini IDE to a pane-count stress benchmark.
const { fmt, fmtMs } = Showcase;
const K = (i) => `var(--c${(i % 6) + 1})`;
const pct = (v) => `${v.toFixed(0)}%`;
const pxOf = (el, dim = "width") => Math.round(el.getBoundingClientRect()[dim]);
const now = () => new Date().toLocaleTimeString("zh-TW", { hour12: false });

// Create a Split instance that is destroyed with the scene.
function makeSplit(ctx, els, opts) {
  const s = Split(els, opts);
  let alive = true;
  ctx.onCleanup(() => { if (alive) s.destroy(); });
  return { s, kill() { if (alive) { alive = false; s.destroy(); } } };
}
// Animate setSizes() from the current sizes to `to` (setSizes itself jumps; this eases between).
function tween(ctx, split, to, ms = 600, onStep) {
  const from = split.getSizes(), t0 = performance.now();
  return new Promise((resolve) => {
    const stop = ctx.raf(() => {
      const k = Math.min(1, (performance.now() - t0) / ms), e = 1 - (1 - k) ** 3;
      const s = from.map((v, i) => v + (to[i] - v) * e);
      split.setSizes(s);
      if (onStep) onStep(s);
      if (k >= 1) { stop(); resolve(); }
    });
  });
}
function eventLog(box, max = 40) {
  return (html) => {
    const row = document.createElement("div");
    row.innerHTML = `<code>${now()}</code> ${html}`;
    box.prepend(row);
    while (box.children.length > max) box.lastChild.remove();
  };
}

// ---------- 2. mail data ----------

  ["王小明", "下週三讀書會改到 7:45 開始", "09:12", "因為場地延後，下週三的讀書會改到 7:45 開始，地點一樣在大安區的共享空間。請大家互相轉告。"],
  ["陳怡君", "Split.js 簡報檔已上傳", "昨天", "簡報放在共用雲端的「第 12 次」資料夾，裡面有三組分割窗格的範例，歡迎先看。"],

    mount(ctx) {

        <div class="spd-box">${[0, 1, 2].map((i) => `<div class="spd-pane"><div class="spd-head"><b>窗格 ${"ABC"[i]}</b></div><div class="spd-big" style="--k:${K(i * 2 + 1)}">0%</div></div>`).join("")}</div>
        <div class="spd-panel"><div class="spd-cnt"><div><small>onDragStart</small><b>0</b></div><div><small>onDrag</small><b>0</b></div><div><small>onDragEnd</small><b>0</b></div></div>
          <div class="spd-now"></div><div class="spd-sub">快照（點擊還原）</div><div class="spd-slots"></div><div class="spd-sub">事件紀錄</div><div class="spd-evt"></div></div>
        </div></div>`);
      const panes = ctx.$$(".spd-box > .spd-pane"), bigs = ctx.$$(".spd-big"), cnt = ctx.$$(".spd-cnt b"), slots = ctx.$(".spd-slots");
      const log = eventLog(ctx.$(".spd-evt"));
      const n = [0, 0, 0];
      const arr = (s) => `[${s.map((x) => x.toFixed(1)).join(", ")}]`;
      const paint = (s = sp.s.getSizes()) => { s.forEach((v, i) => (bigs[i].textContent = pct(v))); ctx.$(".spd-now").textContent = `getSizes() ${arr(s)}`; };
      const bump = (i) => (cnt[i].textContent = fmt(++n[i]));
      let moves = 0;
      const sp = makeSplit(ctx, panes, { sizes: [33.3, 33.3, 33.4], minSize: 50, gutterSize: 8,
        onDragStart: (s) => { bump(0); moves = 0; log(`<code>onDragStart</code> ${arr(s)}`); },
        onDrag: (s) => { bump(1); moves++; paint(s); },
        onDragEnd: (s) => { bump(2); log(`<code>onDragEnd</code> ${arr(s)}，期間 onDrag ×${moves}`); } });
      let animate = true;
      const restore = (s, label) => {
        log(`<code>setSizes</code> ${arr(s)}（${label}${animate ? "，動畫" : ""}）`);
        if (animate) tween(ctx, sp.s, s, 500, paint); else { sp.s.setSizes(s); paint(); }
      };
      const addSlot = (s, name) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = `${name} ${s.map((x) => x.toFixed(0)).join("/")}`;
        b.addEventListener("click", () => restore(s, name));
        slots.append(b);
        while (slots.children.length > 6) slots.firstChild.remove();
      };
      let k = 0;
      ctx.button("記住版面", () => { const s = sp.s.getSizes(); addSlot(s, `#${++k}`); log(`<code>getSizes</code> ${arr(s)} 存成快照 #${k}`); });
      ctx.button("隨機版面", () => {
        const r = [0, 1, 2].map(() => 1 + Math.random() * 3), t = r.reduce((a, b) => a + b);
        restore(r.map((x) => (x / t) * 100), "隨機");
      });
      ctx.toggle("動畫還原", true, (v) => (animate = v));
      addSlot([33.3, 33.3, 33.4], "平均");
      addSlot([55, 30, 15], "左寬");
      addSlot([15, 25, 60], "右寬");
      paint();
      log("建立 Split，等待拖曳…");
    },
  },
  {
    id: "responsive", title: "響應式預覽",
    api: "elementStyle() ・ gutterStyle() → flex-basis",
    desc: "左窗格是一個用 container query 排版的網頁：寬度 768px 以上三欄卡片、480 到 767px 兩欄、480px 以下單欄並把選單收成 ☰。這裡改寫 elementStyle 與 gutterStyle，讓 Split.js 設定 flex-basis 而不是 width。上方尺規每格 100px，紅線是兩個斷點。",
    hint: "拖曳分隔線改變預覽寬度・跨過紅線看版面切換",
    mount(ctx) {
      ctx.html(`<div class="spd-wrap"><div class="spd-rule"></div><div class="spd-box">
        <div class="spd-pane spd-vp"><div class="spd-site"><nav><b>📘 讀書會</b><span>課程</span><span>講師</span><span>報名</span><i>☰</i></nav>
          <div class="spd-hero"><h3>秋季 JavaScript 讀書會</h3><p>每週三晚上・大安區・共 8 週</p></div>
          <div class="spd-cards"><div><b>第 1 週</b>DOM 與事件</div><div><b>第 2 週</b>非同步與 fetch</div><div><b>第 3 週</b>版面與分割窗格</div></div></div><span class="spd-tag"></span></div>
        <div class="spd-pane spd-spare"><div>預覽寬度<b>0px</b><span class="spd-bp"></span></div></div>
        </div></div>`);
      const box = ctx.$(".spd-box"), [vp, spare] = ctx.$$(".spd-box > .spd-pane"), rule = ctx.$(".spd-rule"), tag = ctx.$(".spd-tag");
      const mode = (w) => (w >= 768 ? "桌機：三欄" : w >= 480 ? "平板：兩欄" : "手機：單欄");
      const paint = () => {
        const w = pxOf(vp);
        spare.querySelector("b").textContent = `${w}px`;
        spare.querySelector(".spd-bp").textContent = mode(w);
        tag.textContent = `${w}px・${mode(w).slice(0, 2)}`;
      };
      const drawRule = () => {
        const W = box.clientWidth;
        const marks = [];
        for (let x = 0; x <= W; x += 100) marks.push(`<span style="left:${x + 1}px">${x}</span>`);
        [480, 768].forEach((x) => x < W && marks.push(`<span class="bp" style="left:${x + 1}px">${x}</span>`));
        rule.innerHTML = marks.join("");
      };
      const GUT = 10;
      const sp = makeSplit(ctx, [vp, spare], {
        sizes: [70, 30], minSize: [240, 0], gutterSize: GUT, snapOffset: 20,
        elementStyle: (dim, size, gs) => ({ "flex-basis": `calc(${size}% - ${gs}px)` }),
        gutterStyle: (dim, gs) => ({ "flex-basis": `${gs}px` }),
        onDrag: paint, onDragEnd: paint,
      });
      const toPx = (px) => {
        const W = box.clientWidth, p = Math.min(100, ((px + GUT / 2) / W) * 100);
        return tween(ctx, sp.s, [p, 100 - p], 550, paint);
      };
      ctx.group(["手機 375", "平板 600", "桌機 900"], -1, (i) => toPx([375, 600, 900][i]));
      drawRule();
      paint();
      ctx.onResize(() => { drawRule(); paint(); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "Split(N 個窗格) ・ setSizes() ×50 ・ 拖曳 60 步",
    desc: "每一級先建立 N 個窗格（彩色細條），量三件事：Split() 建立實例（含插入 N-1 個分隔線與設定樣式）、連續 50 次 setSizes() 隨機比例、對中間分隔線送出 60 次 mousemove 拖曳。每次 setSizes 與每步拖曳後都強制讀一次版面，包含瀏覽器重新排版的成本。",
    hint: "按「開始測試」；右邊會實際畫出每一級的窗格",
    mount(ctx) {
      ctx.html(`<div class="spd-stress"></div>`);
      const box = ctx.$(".spd-stress");
      let cur = null;
      const kill = () => { if (cur) { cur.destroy(); cur = null; } };
      ctx.onCleanup(kill);
      const fill = (n) => {
        kill();
        const frag = document.createDocumentFragment();
        const els = Array.from({ length: n }, (_, i) => {
          const d = document.createElement("div");
          d.style.background = `hsl(${Math.round((i * 360) / n)} 70% 55% / .85)`;
          frag.append(d);
          return d;
        });
        box.replaceChildren(frag);
        return els;
      };
      const opts = (n) => ({ sizes: Array(n).fill(100 / n), minSize: 0, snapOffset: 0, gutterSize: Math.max(0, Math.min(4, Math.floor(box.clientWidth / n / 3))) });
      const randomSizes = (n) => { const r = Array.from({ length: n }, () => 0.5 + Math.random()); const t = r.reduce((a, b) => a + b); return r.map((x) => (x / t) * 100); };
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "窗格", unit: "個",
        sizes: [10, 50, 100, 200, 400, 800, 1600, 3200, 6400, 12800],
        prepare: (n) => ({ els: fill(n), sets: Array.from({ length: 50 }, () => randomSizes(n)) }),
        async run(n, { els, sets }) {
          const t0 = performance.now();
          cur = Split(els, opts(n));
          void box.offsetWidth;
          const t1 = performance.now();
          for (const s of sets) { cur.setSizes(s); void els[n - 1].getBoundingClientRect().width; }
          const t2 = performance.now();
          // Synthetic drag on the middle gutter: Split.js listens for mousedown on the gutter and mousemove/mouseup on window.
          const g = cur.pairs[Math.floor(cur.pairs.length / 2)].gutter, r = g.getBoundingClientRect();
          const x0 = r.left + r.width / 2, y = r.top + r.height / 2;
          const ev = (type, x) => new MouseEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, buttons: 1 });
          g.dispatchEvent(ev("mousedown", x0));
          for (let i = 1; i <= 60; i++) { window.dispatchEvent(ev("mousemove", x0 + Math.sin(i / 6) * 40)); void els[0].getBoundingClientRect().width; }
          window.dispatchEvent(ev("mouseup", x0));
          const t3 = performance.now();
          await ctx.frame(1);
          return `建立 ${fmtMs(t1 - t0)}・setSizes ${fmtMs((t2 - t1) / 50)}/次・拖曳 ${fmtMs((t3 - t2) / 60)}/步`;
        },
        target: 1000, budget: 2000,
        note: "Split.js 本身很輕：建立時每個窗格只設一次 width: calc(%)，setSizes 逐對重寫所有窗格的寬度。數量大時成本主要落在瀏覽器排版 N 個 flex 子元素；拖曳只動兩個相鄰窗格，所以每步遠比整體 setSizes 便宜。",
      });
      const els = fill(100);
      cur = Split(els, opts(100));
    },
  },
] });
</script>
</body>
