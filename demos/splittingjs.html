<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splitting.js 示範：逐字動畫與圖片切格</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/splitting@1.1.0/dist/splitting.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/splitting@1.1.0/dist/splitting-cells.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(60% 70% at 20% 30%, #2b1530, var(--bg) 70%); }
  .wrap { position: fixed; inset: 0; display: grid; grid-template-columns: 1.15fr 1fr; align-items: center; gap: clamp(16px, 4vw, 48px); padding: 64px clamp(16px, 5vw, 56px) 50px; }
  .kicker { font: 700 12px var(--mono); letter-spacing: .14em; color: var(--c3); }
  h1 { margin: 10px 0 14px; font-size: clamp(34px, 6vw, 76px); line-height: 1.18; font-weight: 900; cursor: default; }
  .desc { margin: 0; font-size: 14px; line-height: 1.7; color: var(--muted); max-width: 30em; }
  .desc code { font-family: var(--mono); color: var(--accent); }
  h1 .char { display: inline-block; transition: transform .25s, color .25s; }
  h1 .char:hover { transform: translateY(-.12em) scale(1.12); color: var(--accent); }
  /* mode: wave, each char delayed by its index */
  .m-wave h1 .char { animation: wave 1.8s ease-in-out infinite; animation-delay: calc(var(--char-index) * 90ms); }
  @keyframes wave { 0%, 100% { transform: translateY(0); color: var(--fg); } 30% { transform: translateY(-.22em); color: var(--c2); } }
  /* mode: rainbow, hue from index / total */
  .m-hue h1 .char { color: hsl(calc(var(--char-index) / var(--char-total) * 300 + 190) 90% 66%); animation: spin 4s linear infinite; }
  @keyframes spin { to { filter: hue-rotate(360deg); } }
  /* mode: staggered entrance, replayed by toggling the class */
  .m-in h1 .char { animation: drop .7s cubic-bezier(.2,1.4,.4,1) both; animation-delay: calc(var(--char-index) * 70ms); }
  @keyframes drop { from { opacity: 0; transform: translateY(-1.2em) rotate(-25deg) scale(.6); } }
  /* index labels from --char-index via a CSS counter */
  h1 .char { counter-reset: ci var(--char-index); }
  .idx h1 .char::after { content: counter(ci); visibility: visible; top: -.55em; left: 50%; transform: translateX(-50%); font: 700 .2em/1 var(--mono); color: var(--c3); }
  /* image cells */
  .pic { position: relative; }
  .cells { width: 100%; border-radius: 14px; cursor: pointer; }
  .cells img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
  .cells .cell { transition: transform .7s cubic-bezier(.3,1.3,.5,1), opacity .7s; transition-delay: calc((var(--row-index) + var(--col-index)) * 35ms); }
  .cells.burst .cell { transform: translate(calc((var(--col-index) - 2.5) * 9px), calc((var(--row-index) - 2.5) * 9px)) scale(.86) rotate(calc((var(--col-index) - var(--row-index)) * 4deg)); opacity: .9; }
  .cells .cell:hover { z-index: 2; transform: scale(1.18); transition-delay: 0s; }
  .pic small { display: block; margin-top: 10px; font: 12px var(--mono); color: var(--muted); text-align: center; }
  @media (max-width: 700px) {
    /* stacked layout: the hint would sit on the image caption; show it briefly, then fade it out */
    .hint { animation: hint-fade .5s 8s forwards; }
    .wrap { grid-template-columns: 1fr; align-content: center; padding-top: 96px; gap: 14px; }
    .desc { display: none; }
    .cells { width: min(100%, 300px); margin: 0 auto; }
  }
</style>
</head>
<body class="m-wave">
<div class="controls" id="ctl">
  <button class="btn" data-mode="m-wave" aria-pressed="true">波浪</button>
  <button class="btn" data-mode="m-hue">彩虹</button>
  <button class="btn" data-mode="m-in">逐字進場</button>
  <button class="btn" id="idx">顯示編號</button>
</div>

<div class="wrap">
  <div>
    <div class="kicker">SPLITTING.JS</div>
    <h1 id="title">每個字<br>都有自己的編號</h1>
    <p class="desc">Splitting 把文字拆成一個個 <code>span</code>，再替每個字寫上 <code>--char-index</code>。動畫只用 CSS 的 <code>calc()</code> 讀這個編號，就能做出依序延遲的效果。</p>
  </div>
  <div class="pic">
    <div class="cells" id="cells"><img src="_shared/img/photo-6.jpg" alt="深海水母"></div>
    <small>同一招也能把圖片切成 6 × 6 格，點一下拆開</small>
  </div>
</div>
<div class="hint">切換上方模式，游標移到字或圖格上試試</div>

<script src="https://cdn.jsdelivr.net/npm/splitting@1.1.0/dist/splitting.min.js"></script>
<script>
Splitting({ target: "#title", by: "chars" });
const cells = document.getElementById("cells");
Splitting({ target: cells, by: "cells", image: true, rows: 6, columns: 6 });

const body = document.body;
const modes = [...document.querySelectorAll("[data-mode]")];
function setMode(name) {
  modes.forEach((b) => { body.classList.remove(b.dataset.mode); b.setAttribute("aria-pressed", b.dataset.mode === name); });
  void body.offsetWidth; // restart CSS animations when the same mode is clicked again
  body.classList.add(name);
}
modes.forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));

const idxBtn = document.getElementById("idx");
idxBtn.addEventListener("click", () => {
  const on = body.classList.toggle("idx");
  idxBtn.setAttribute("aria-pressed", on);
});

// Cells burst apart on click; an idle loop keeps it moving until the first click
let auto = null;
const kick = setTimeout(() => {
  cells.classList.add("burst");
  auto = setInterval(() => cells.classList.toggle("burst"), 2600);
}, 700);
cells.addEventListener("click", () => {
  clearTimeout(kick);
  clearInterval(auto);
  cells.classList.toggle("burst");
});
</script>
</body>
</html>
