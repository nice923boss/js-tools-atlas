<script>
// Splitting.js showcase: chars, derived variables, words/lines, items/grid, image cells,
// pseudo-element chars, html()/add(), and a char-count stress ramp.
const nf = new Intl.NumberFormat("zh-TW");
const IMG = "_shared/img/photo-6.jpg";
// Re-split an element that has been reset to plain content; force skips the per-element cache.
const split = (el, opts) => Splitting({ target: el, force: true, ...opts })[0];
// Restart CSS animations keyed on a class.
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// A registered custom property makes the computed value of --char-percent etc. readable as a number.
let bnumReady = false;

// Custom plugin for scene 7: picks the digit chars and indexes them as --digit-index / --digit-total.
Splitting.add({
  by: "digits",
  key: "digit",
  depends: ["chars"],
  split(el, opts, ctx) {
    const digits = ctx.chars.filter((c) => /\d/.test(c.textContent));
    digits.forEach((c) => c.classList.add("digit"));
    return digits;
  },
});
const PLUGIN_SRC = `Splitting.add({
  by: "digits",          // 呼叫時寫 by: "digits"
  key: "digit",          // 產生 --digit-index 與 --digit-total
  depends: ["chars"],    // 先跑 words、chars
  split(el, opts, ctx) {
    const digits = ctx.chars.filter((c) => /\\d/.test(c.textContent));
    digits.forEach((c) => c.classList.add("digit"));
    return digits;
  },
});`;

const WORD2 = "日月潭環湖自行車道";
const M2 = [
  { key: "pct", label: "位置百分比", code: "<b>--char-percent</b>: calc(var(--char-index) / var(--char-total));\nanimation-delay: calc(var(<b>--char-percent</b>) * 1.2s);" },
  { key: "off", label: "離中心偏移", code: "<b>--char-offset</b>: calc(var(--char-index) - var(--char-center));\ntransform: translateX(calc(var(<b>--char-offset</b>) * .22em));" },
  { key: "sin", label: "正弦距離", code: "<b>--distance-sine</b>: calc(var(--char-offset) / var(--char-center));\ntransform: rotate(calc(var(<b>--distance-sine</b>) * 30deg));" },
  { key: "dist", label: "距離百分比", code: "<b>--distance-percent</b>: calc(var(--distance) / var(--char-center));\nanimation-delay: calc(var(<b>--distance-percent</b>) * 600ms);" },
];

const TEXTS3 = [
  "Splitting wraps every word in a span, waits for the browser to lay out the paragraph, then groups words that share the same offsetTop into one line. Every word on that line gets the same --line-index, so CSS can color or stagger whole lines. Drag the width slider: the text is split again and the colors follow the new line breaks.",
  "台北捷運每天載運超過兩百萬人次，從淡水到象山、從南港到頂埔，車廂裡有通勤的上班族、背書包的學生，也有第一次來台灣的旅客。",
  "台北捷運 每天 載運 超過 兩百萬 人次， 從 淡水 到 象山、 從 南港 到 頂埔， 車廂裡 有 通勤的 上班族、 背書包的 學生， 也有 第一次 來 台灣的 旅客。",
];
const NOTES3 = [
  "英文以空白分詞，每一行都量得到。",
  "words 只用空白切詞：整段中文沒有空白，只會得到 1 個詞，lines 也只量到 1 行。",
  "先用空白分好詞就能逐行上色，但每個空白都會留成一個 whitespace span，畫面上看得到。",
];

const CITIES = ["基隆", "台北", "新北", "桃園", "新竹", "苗栗", "台中", "彰化", "南投", "雲林", "嘉義", "台南", "高雄", "屏東", "宜蘭", "花蓮", "台東", "澎湖"];

const M6 = [
  { key: "glitch", label: "雙色錯位", css: ".char::before { visibility: visible; clip-path: inset(0 0 52% 0); }\n.char::after  { visibility: visible; clip-path: inset(48% 0 0 0); }" },
  { key: "roll", label: "翻牌", css: ".char { overflow: hidden; color: transparent; }\n.char::after { visibility: visible; top: 100%; }\n.go .char::before, .go .char::after { transform: translateY(-100%); }" },
  { key: "mirror", label: "倒影", css: ".char::after { visibility: visible; transform: scaleY(-1);\n  mask-image: linear-gradient(to top, #000, transparent 60%); }" },
  { key: "fill", label: "描邊填色", css: ".char { color: transparent; -webkit-text-stroke: 1.5px; }\n.char::before { visibility: visible; clip-path: inset(100% 0 0 0); }" },
];

const POOL8 = "春眠不覺曉處處聞啼鳥夜來風雨聲花落知多少白日依山盡黃河入海流欲窮千里目更上一層樓";
const makeText = (n) => {
  let s = "";
  for (let i = 0; i < n; i++) {
    s += POOL8[i % POOL8.length];
    if (i % 8 === 7) s += " ";
  }
  return s;
};
