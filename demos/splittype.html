<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SplitType 示範：拆字配 GSAP 逐字登場</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 70% at 50% 100%, #10283a, var(--bg) 70%); }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 64px 16px 56px; }
  .kicker { font: 700 12px var(--mono); letter-spacing: .14em; color: var(--c2); }
  h1 { margin: 0; font-size: clamp(32px, 8.6vw, 84px); line-height: 1.22; font-weight: 900; perspective: 700px; }
  h1 .ln { display: block; }
  h1 .ln + .ln { color: var(--accent); }
  .lead { margin: 0; max-width: 34em; font-size: clamp(13px, 1.8vw, 16px); line-height: 1.8; color: var(--muted); }
  .boxes .char { outline: 1px dashed rgba(76,201,240,.55); outline-offset: -1px; }
  .form { display: flex; gap: 8px; width: min(100%, 520px); }
  .form input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
  .form input:focus { outline: 2px solid var(--c2); outline-offset: 1px; }
  .meta { font: 12px var(--mono); color: var(--muted); }
  .meta b { color: var(--c2); }
  @media (max-width: 560px) { .wrap { padding-top: 100px; gap: 10px; } .lead { display: none; } }
</style>
</head>
<body>
<div class="controls" id="fx">
  <button class="btn" data-fx="rise" aria-pressed="true">從下浮起</button>
  <button class="btn" data-fx="scatter">隨機散落</button>
  <button class="btn" data-fx="center">中央展開</button>
  <button class="btn" data-fx="flip">翻牌</button>
  <button class="btn" id="boxBtn">顯示拆分框</button>
</div>

<div class="wrap">
  <div class="kicker">SPLITTYPE + GSAP</div>
  <h1 id="title"><span class="ln split">把一句話拆開，</span><span class="ln split">讓每個字各自登場</span></h1>
  <p class="lead split">SplitType 只負責把文字拆成一個個元素，動畫交給 GSAP 的 stagger 依序播放；換一種順序，同一句話就有不同的情緒。</p>
  <form class="form" id="form">
    <input id="txt" maxlength="40" placeholder="輸入你想拆開的一句話" aria-label="自訂文字">
    <button class="btn primary" type="submit">套用</button>
  </form>
  <div class="meta">拆出 <b id="count">0</b> 個字元，每個都是獨立的 <b>div.char</b></div>
</div>
<div class="hint">點上方效果重播，或輸入自己的句子</div>

<script src="https://cdn.jsdelivr.net/npm/split-type@0.3.4/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script>
// Chinese has no spaces, so split by chars only; that keeps normal line wrapping
let split = new SplitType(".split", { types: "chars" });
const countEl = document.getElementById("count");
const rnd = gsap.utils.random;

const FX = {
  rise: (c) => gsap.from(c, { yPercent: 110, opacity: 0, duration: .8, ease: "back.out(1.8)", stagger: .035 }),
  scatter: (c) => gsap.from(c, { x: () => rnd(-320, 320), y: () => rnd(-220, 220), rotation: () => rnd(-200, 200), scale: () => rnd(.3, 2.2), opacity: 0,
    duration: 1.3, ease: "expo.out", stagger: { each: .015, from: "random" } }),
  center: (c) => gsap.from(c, { scale: 0, opacity: 0, duration: .7, ease: "back.out(2.4)", stagger: { each: .04, from: "center" } }),
  flip: (c) => gsap.from(c, { rotationX: -100, transformOrigin: "50% 100% -20px", opacity: 0, duration: .9, ease: "power3.out", stagger: { each: .05, from: "end" } }),
};

let current = "rise";
function play(name) {
  current = name;
  const chars = split.chars;
  gsap.killTweensOf(chars);
  gsap.set(chars, { x: 0, y: 0, xPercent: 0, yPercent: 0, rotation: 0, rotationX: 0, scale: 1, opacity: 1 });
  FX[name](chars);
  countEl.textContent = chars.length;
  document.querySelectorAll("[data-fx]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.fx === name));
}

// Cycle through the effects until the viewer picks one
const ORDER = Object.keys(FX);
let autoTimer = setInterval(() => play(ORDER[(ORDER.indexOf(current) + 1) % ORDER.length]), 3800);
const stopAuto = () => clearInterval(autoTimer);

document.getElementById("fx").addEventListener("click", (e) => {
  const b = e.target.closest("[data-fx]");
  if (!b) return;
  stopAuto();
  play(b.dataset.fx);
});

const boxBtn = document.getElementById("boxBtn");
boxBtn.addEventListener("click", () => {
  boxBtn.setAttribute("aria-pressed", document.body.classList.toggle("boxes"));
});

// Custom sentence: revert the old split, replace the headline and split again
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = document.getElementById("txt").value.trim();
  if (!text) return;
  stopAuto();
  gsap.killTweensOf(split.chars);
  split.revert();
  const lines = document.querySelectorAll("#title .ln");
  lines[0].textContent = text;
  lines[1].textContent = "";
  split = new SplitType(".split", { types: "chars" });
  play(current);
});

play("rise");
</script>
</body>
</html>
