<style>
  .fill { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 14px calc(var(--sc-ctl-b, 0px) + 12px); container-type: size; }
  .tag { display: inline-block; font: 500 11.5px/1.5 var(--font); color: var(--muted); padding: 1px 9px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .tag b { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .read { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .note { font-size: 12.5px; line-height: 1.6; color: var(--muted); text-align: center; max-width: 46em; }
  .code { margin: 0; max-width: 100%; padding: 9px 14px; font: 12px/1.6 var(--mono); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; white-space: pre-wrap; word-break: break-all; }
  .code b { color: var(--accent); font-weight: 600; }
  .code .cm { color: var(--c4); font-family: var(--font); }
  /* SplitType README: targets need font-kerning: none so glyphs do not shift when split/reverted */
  .tx { font-kerning: none; }
  .boxes .char { outline: 1px dashed color-mix(in srgb, var(--c2) 70%, transparent); outline-offset: -1px; }

  /* 1. signature: chars + GSAP stagger */
  .s1 { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(8px, 2.4cqh, 16px);
    background: radial-gradient(70% 70% at 50% 100%, color-mix(in srgb, var(--c2) 16%, transparent), transparent 70%); }
  .s1 .kicker { font: 700 12px var(--mono); letter-spacing: .14em; color: var(--c2); }
  .s1 h1 { margin: 0; font-size: clamp(28px, min(8.4cqw, 13cqh), 84px); line-height: 1.22; font-weight: 900; }
  .s1 h1 .ln { display: block; perspective: 700px; }
  .s1 h1 .ln + .ln { color: var(--accent); }
  .s1 .lead { margin: 0; max-width: 34em; font-size: clamp(13px, 1.8cqw, 16px); line-height: 1.8; color: var(--muted); perspective: 700px; }
  .s1 form { display: flex; gap: 8px; width: min(100%, 520px); }
  .s1 form input { flex: 1; min-width: 0; font: 15px var(--font); padding: 8px 12px; color: var(--fg); background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; }
  .s1 form input:focus { outline: 2px solid var(--c2); outline-offset: 1px; }
  @container (max-width: 560px) { .s1 .lead { display: none; } }
  @container (max-height: 380px) { .s1 .lead { display: none; } }

  /* 2. types combinations */
  .s2 { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  .s2 .t2 { width: min(100%, 680px); margin: 0; font-size: clamp(14px, min(3cqw, 4.4cqh), 22px); line-height: 2; }
  .s2 .line { border-radius: 4px; box-shadow: inset 3px 0 0 var(--c1); background: color-mix(in srgb, var(--c1) 9%, transparent); }
  .s2 .line:nth-child(even) { background: color-mix(in srgb, var(--c1) 18%, transparent); }
  .s2 .word { outline: 1px solid color-mix(in srgb, var(--c2) 75%, transparent); outline-offset: 1px; border-radius: 3px; }
  .s2 .char { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c3) 60%, transparent); }
  .s2 .sw { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 2px; vertical-align: -1px; }

  /* 3. split() / revert() lifecycle */
  .s3 { height: 100%; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: center; align-content: center; gap: 14px 22px; }
  .s3 .t3 { margin: 0; font-size: clamp(24px, min(5cqw, 10cqh), 52px); font-weight: 800; line-height: 1.45; }
  .s3 .t3 .word { outline: 1px dashed color-mix(in srgb, var(--c2) 70%, transparent); outline-offset: 2px; border-radius: 4px; }
  .s3 .t3 .word:nth-child(3n+1) { color: var(--c2); }
  .s3 .t3 .word:nth-child(3n+2) { color: var(--c3); }
  .s3 .t3 .word:nth-child(3n) { color: var(--c5); }
  .s3 .insp { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; padding: 9px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .s3 .insp code { font: 12px/1.6 var(--mono); color: var(--muted); }
  .s3 .insp b { font: 600 12px/1.6 var(--mono); color: var(--accent); word-break: break-all; }
  .s3 .insp .call { grid-column: 1 / -1; padding-bottom: 4px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
  .s3 .insp .zh { font: 12.5px/1.6 var(--font); color: var(--muted); }
  .s3 .insp b.zh { font-weight: 600; color: var(--accent); }
  .s3 .insp .warn { grid-column: 1 / -1; color: var(--c5); font-size: 12px; line-height: 1.5; }
  .s3 .code { grid-column: 1 / -1; max-height: 6.8em; overflow: hidden; font-size: 11px; }
  @container (max-width: 520px) { .s3 { grid-template-columns: minmax(0, 1fr); } .s3 .t3 { text-align: center; } }
  @container (max-height: 300px) { .s3 .code { display: none; } }

  /* 4. re-split after resize */
  .s4 { height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .s4 .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px 20px; }
  .s4 .col4 { min-width: 0; overflow: clip; }
  .s4 .lab { margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
  .s4 .lab b { font: 600 12px var(--mono); color: var(--accent); }
  .s4 .box4 { position: relative; width: var(--w, 100%); padding: 6px 0 6px 2.4em; border-right: 2px dashed var(--c4); }
  .s4 .t4 { margin: 0; font-size: clamp(12px, 2cqw, 19px); line-height: 1.7; }
  .s4 .line { position: relative; border-radius: 3px; background: hsl(calc(var(--li, 0) * 47 + 190) 70% 55% / .16); }
  .s4 .line::before { content: attr(data-ln); position: absolute; right: calc(100% + 6px); top: .25em; padding: 0 5px; border-radius: 4px; font: 600 10px/1.5 var(--mono); color: var(--bg); background: hsl(calc(var(--li, 0) * 47 + 190) 70% 70%); }
  @container (max-width: 760px) { .s4 .cols { grid-template-columns: minmax(0, 1fr); } }

  /* 5. native animation: WAAPI + CSS */
  .s5 { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .s5 .t5 { margin: 0; width: min(100%, 720px); }
  .s5 .t5.big { font-size: clamp(26px, min(6.2cqw, 11cqh), 60px); font-weight: 900; line-height: 1.3; text-align: center; cursor: default; }
  .s5 .t5.para { font-size: clamp(14px, min(2.8cqw, 4.4cqh), 22px); line-height: 1.6; }
  .s5 .t5.para .line { overflow: hidden; }
  .s5 .t5.para.anim .word { animation: s5up .6s cubic-bezier(.2, .9, .3, 1) both; animation-delay: calc(var(--li, 0) * 110ms); }
  @keyframes s5up { from { transform: translateY(110%); } }
  .s5 .code { width: min(100%, 720px); font-size: 11.5px; }

  /* 6. tagName and class options */
  .s6 { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .s6 .t6 { margin: 0; width: min(100%, 720px); text-align: center; font-size: clamp(22px, min(5.2cqw, 9cqh), 46px); font-weight: 800; line-height: 1.55; }
  .s6 .t6 .char:hover, .s6 .t6 .glyph:hover { color: var(--accent); }
  .s6[data-m="0"] .line { background: color-mix(in srgb, var(--c1) 12%, transparent); border-radius: 4px; }
  .s6[data-m="0"] .word { border-bottom: 2px solid var(--c2); }
  .s6[data-m="1"] span.word { border-bottom: 2px solid var(--c5); }
  .s6[data-m="2"] .row { background: color-mix(in srgb, var(--c3) 12%, transparent); border-radius: 4px; }
  .s6[data-m="2"] .term { outline: 1px dashed var(--c2); outline-offset: 2px; border-radius: 4px; }
  .s6[data-m="2"] .glyph:nth-child(odd) { color: var(--c2); }
  .s6[data-m="2"] .glyph:nth-child(even) { color: var(--c3); }
  .s6[data-m="3"] .piece { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c4) 75%, transparent); border-radius: 3px; }
  .s6 .code { width: min(100%, 720px); max-height: 9.8em; overflow: hidden; font-size: 11px; }

  /* 7. nested elements + unicode */
  .s7 { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  .s7 .t7 { margin: 0; width: min(100%, 720px); text-align: center; font-size: clamp(20px, min(4.4cqw, 7.4cqh), 38px); font-weight: 700; line-height: 1.75; }
  .s7 .t7 a { color: var(--c2); border-bottom: 2px solid var(--c2); text-decoration: none; }
  .s7 .t7 em { color: var(--c5); }
  .s7 .t7 strong { color: var(--c3); }
  .s7 .t7 .char:hover { background: color-mix(in srgb, var(--accent) 25%, transparent); }
  .s7 .t7 .multi { background: color-mix(in srgb, var(--c4) 22%, transparent); box-shadow: inset 0 0 0 1px var(--c4); border-radius: 6px; }

  /* 8. stress */
  .flood { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); overflow: hidden; font: 500 var(--fs, 16px)/1.45 var(--font); color: var(--fg); }
  @media (min-width: 761px) { .flood { inset: 8px 8px 8px 350px; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/split-type@0.3.4/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// SplitType showcase: GSAP stagger, types combos, split()/revert() lifecycle, re-split on resize,
// WAAPI/CSS animation, tagName/class options, nested elements + unicode, and a char-count stress ramp.
const nf = new Intl.NumberFormat("zh-TW");
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
// Restart CSS animations keyed on a class.
const replay = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
// Run fn when el's width, font size or height really changed; the observer also fires when
// SplitType detaches and re-inserts the element, so compare against the last layout.
const watchLayout = (ctx, el, fn) => {
  const key = () => `${el.clientWidth}|${getComputedStyle(el).fontSize}|${el.offsetHeight}`;
  let last = key();
  const ro = new ResizeObserver(() => { if (key() !== last) { fn(); last = key(); } });
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
  return () => { last = key(); };
};

const rnd = gsap.utils.random;
const FX1 = [
  (c, each) => gsap.from(c, { yPercent: 110, opacity: 0, duration: .7, ease: "back.out(1.8)", stagger: each }),
  (c, each) => gsap.from(c, { x: () => rnd(-280, 280), y: () => rnd(-200, 200), rotation: () => rnd(-200, 200), scale: () => rnd(.3, 2.2), opacity: 0,
    duration: 1.1, ease: "expo.out", stagger: { each: each / 2, from: "random" } }),
  (c, each) => gsap.from(c, { scale: 0, opacity: 0, duration: .6, ease: "back.out(2.4)", stagger: { each, from: "center" } }),
  (c, each) => gsap.from(c, { rotationX: -100, transformOrigin: "50% 100% -20px", opacity: 0, duration: .8, ease: "power3.out", stagger: { each, from: "end" } }),
];

const TYPES2 = ["chars", "words", "lines", "words, chars", "lines, words, chars"];
const TEXT2 = [
  "Taipei 101 was the world's tallest building from 2004 to 2010. Its 660-tonne tuned mass damper swings inside the tower to keep it steady in typhoons.",
  "台北101在2004年到2010年是世界最高的大樓，塔內那顆660公噸的阻尼球會在颱風天擺動，讓大樓保持穩定。",
];
const NOTES2 = [
  "只拆 chars：字元直接放進目標，外面沒有 word 包住，英文會在單字中間斷行，README 也不建議單獨使用。",
  "words：以空白切詞，每個詞包成 inline-block，容器縮放時照常換行。",
  "lines：先切 word、量 offsetTop 分行，分好後再把 word 拆回純文字，只留下 line 區塊。",
  "words, chars：最常用的組合，逐字動畫時單字不會被拆到兩行。",
  "預設值：三層全拆。line 是拆分當下量出的固定區塊，寬度改變要重新 split（場景 4）。",
];

const TEXT4 = "Alishan Forest Railway climbs from 30 m to 2,216 m. Built in 1912 to haul cypress logs, it now carries visitors up to watch the sunrise over a sea of clouds.";

const KF_A = [
  { opacity: 0, transform: "translateY(.7em) rotate(-14deg)", filter: "blur(6px)" },
  { opacity: 1, transform: "none", filter: "blur(0px)" },
];
const M5 = [
  { label: "WAAPI 逐字", types: "chars", cls: "big", text: "九份老街的紅燈籠，一盞一盞亮起來",
    code: `split.chars.forEach((c, i) => c.animate(\n  [{ opacity: 0, transform: "translateY(.7em) rotate(-14deg)", filter: "blur(6px)" },\n   { opacity: 1, transform: "none", filter: "blur(0px)" }],\n  { duration: 600, delay: i * 35, fill: "backwards" }));` },
  { label: "CSS 逐行遮罩", types: "lines, words", cls: "para",
    text: "Jiufen's teahouses glow red after dark. Lanterns line the narrow stairways, and the view drops away to the Keelung coast and the Pacific beyond.",
    code: `split.lines.forEach((l, i) => l.style.setProperty("--li", i));\n/* CSS */\n.line { overflow: hidden; }\n.anim .word { animation: up .6s both; animation-delay: calc(var(--li) * 110ms); }\n@keyframes up { from { transform: translateY(110%); } }` },
  { label: "滑過波紋", types: "words, chars", cls: "big", text: "Sun Moon Lake 日月潭",
    code: `el.addEventListener("pointerover", (e) => {\n  const k = split.chars.indexOf(e.target);\n  split.chars.forEach((c, i) => c.animate(wave, { duration: 520, delay: Math.abs(i - k) * 35 }));\n});` },
];

const TEXT6 = "Kaohsiung Light Rail 高雄輕軌 環狀線全線通車";
const M6 = [
  { label: "預設", opts: {}, css: ".line { background: …; }\n.word { border-bottom: 2px solid; }",
    note: "預設每一層都是 div，class 依序為 line、word、char。" },
  { label: "tagName", opts: { tagName: "span" }, css: "span.word { border-bottom: 2px solid; }",
    note: "外觀不變；但目標若是 <p>、<a>、<button> 這類只能放行內內容的元素，用 span 才是合法 HTML。" },
  { label: "自訂 class", opts: { lineClass: "row", wordClass: "term", charClass: "glyph" },
    css: ".row { background: …; }\n.term { outline: 1px dashed; }\n.glyph:nth-child(odd) { color: …; }",
    note: "lineClass、wordClass、charClass 換掉預設 class，可避開頁面上既有的 .line、.word 樣式。" },
  { label: "splitClass", opts: { splitClass: "piece" }, css: ".piece { box-shadow: inset 0 0 0 1px; }",
    note: "splitClass 會同時加在 line、word、char 上，一個選擇器就選到所有拆分元素。" },
];

const HTML7 = '我在 <a href="#">台北 101</a> 跨年，<em>煙火</em>只放了 <strong>5 分鐘</strong>。<br>'
  + "家庭 \u{1F468}‍\u{1F469}‍\u{1F467}、按讚 \u{1F44D}\u{1F3FD}、國旗 \u{1F1F9}\u{1F1FC}、組合字 é";
const codePoints = (s) => [...s].map((ch) => `U+${ch.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")}`).join(" ");

const POOL8 = "春眠不覺曉處處聞啼鳥夜來風雨聲花落知多少白日依山盡黃河入海流欲窮千里目更上一層樓";
const makeText = (n) => {
  let s = "";
  for (let i = 0; i < n; i++) {
    s += POOL8[i % POOL8.length];
    if (i % 6 === 5) s += " ";
  }
  return s;
};
const KF8 = [{ transform: "translateY(0)" }, { transform: "translateY(-.35em)" }];

Showcase.run({ scenes: [
  {
    id: "stagger", title: "逐字登場",
    api: 'new SplitType(els, { types: "chars" })・gsap.from(split.chars, { stagger })',
    desc: "招牌示範：兩行標題和說明一起交給 SplitType 拆成 chars，GSAP 的 stagger 依序播放四種進場。輸入自己的句子會先 revert()、改文字，再 split()。",
    hint: "點上方切換效果・打開拆分框・輸入句子按套用",
    mount(ctx) {
      ctx.html(`<div class="fill"><div class="s1">
        <div class="kicker">SPLITTYPE + GSAP</div>
        <h1 class="tx"><span class="ln sp">把一句話拆開，</span><span class="ln sp">讓每個字各自登場</span></h1>
        <p class="lead tx sp">SplitType 只負責把文字拆成元素，動畫交給 GSAP 的 stagger 依序播放；換一種順序，同一句話就有不同的情緒。</p>
        <form><input maxlength="40" placeholder="輸入你想拆開的一句話" aria-label="自訂文字"><button class="btn primary" type="submit">套用</button></form>
        <div class="read"><span class="tag">拆出 <b class="n1">0</b> 個 char</span><span class="tag">目標 <b>3</b> 個元素</span></div>
      </div></div>`);
      const root = ctx.$(".s1"), h1 = ctx.$(".s1 h1"), lns = ctx.$$(".s1 .ln"), inp = ctx.$(".s1 input"), cnt = ctx.$(".s1 .n1");
      const split = new SplitType(ctx.$$(".s1 .sp"), { types: "chars" });
      ctx.onCleanup(() => { gsap.killTweensOf(split.chars || []); split.revert(); });
      let cur = 0;
      const seg = ctx.group(["從下浮起", "隨機散落", "中央展開", "翻牌"], 0, (i) => { stopAuto(); play(i); });
      ctx.toggle("顯示拆分框", false, (v) => root.classList.toggle("boxes", v));
      const play = (i) => {
        cur = i;
        const chars = split.chars;
        gsap.killTweensOf(chars);
        gsap.set(chars, { clearProps: "transform,opacity" });
        // Headline chars get a visible stagger; the long lead shares one short stagger window.
        FX1[i](chars.filter((c) => h1.contains(c)), .04);
        const rest = chars.filter((c) => !h1.contains(c));
        if (rest.length) FX1[i](rest, .008);
        cnt.textContent = chars.length;
        seg.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
      };
      // Cycle through the effects until the viewer picks one.
      const auto = ctx.interval(() => play((cur + 1) % FX1.length), 3600);
      const stopAuto = () => clearInterval(auto);
      ctx.on(ctx.$(".s1 form"), "submit", (e) => {
        e.preventDefault();
        const text = inp.value.trim();
        if (!text) return;
        stopAuto();
        gsap.killTweensOf(split.chars);
        split.revert();
        lns[0].textContent = text;
        lns[1].textContent = "";
        split.split();
        play(cur);
      });
      play(0);
    },
  },
  {
    id: "types", title: "types 組合",
    api: 'new SplitType(el, { types: "lines, words, chars" })',
    desc: "types 決定拆成哪幾層：line 是底色條、word 是實線框、char 是內框。同一段文字換組合，元素數量與換行行為都不同；切到中文看沒有空白時的限制。",
    hint: "切換 types 與語言・chars 單用時英文會在字中間斷行",
    mount(ctx) {
      ctx.html(`<div class="fill"><div class="s2">
        <p class="t2 tx"></p>
        <div class="read"></div>
        <pre class="code"></pre>
        <div class="note"></div>
      </div></div>`);
      const t2 = ctx.$(".t2"), read = ctx.$(".s2 .read"), code = ctx.$(".s2 .code"), note = ctx.$(".s2 .note");
      let ti = 4, li = 0;
      t2.textContent = TEXT2[li];
      const split = new SplitType(t2, { types: TYPES2[ti] });
      ctx.onCleanup(() => split.revert());
      const sw = (c) => `<i class="sw" style="background:var(${c})"></i>`;
      const run = () => {
        split.revert();
        t2.textContent = TEXT2[li];
        split.split({ types: TYPES2[ti] });
        read.innerHTML = `<span class="tag">${sw("--c1")}lines <b>${split.lines.length}</b></span>`
          + `<span class="tag">${sw("--c2")}words <b>${split.words.length}</b></span>`
          + `<span class="tag">${sw("--c3")}chars <b>${split.chars.length}</b></span>`;
        code.textContent = `new SplitType(el, { types: "${TYPES2[ti]}" })`;
        note.textContent = NOTES2[ti] + (li ? " 中文沒有空白，整段只算 1 個 word，lines 也只量到 1 行；中文逐字效果用 chars 即可。" : "");
        sync();
      };
      // Lines are measured once; re-split when the paragraph is laid out differently.
      const sync = watchLayout(ctx, t2, () => { split.split(); });
      ctx.group(["chars", "words", "lines", "words, chars", "全部"], ti, (i) => { ti = i; run(); });
      ctx.group(["English", "中文"], 0, (i) => { li = i; run(); });
      run();
    },
  },
  {
    id: "lifecycle", title: "split 與 revert",
    api: "instance.split(options)・instance.revert()・SplitType.revert(el)",
    desc: "split() 會先 revert 再重新拆，並記下當下的 innerHTML；revert() 原封不動還原。split(options) 會把新選項合併進 settings，之後的 split() 也沿用。右側是實例的即時狀態。",
    hint: "依序按 split()、revert()、改 types，看右側狀態變化",
    mount(ctx) {
      ctx.html(`<div class="fill"><div class="s3">
        <h2 class="t3 tx">阿里山 森林鐵路 Alishan Forest Railway</h2>
        <div class="insp"></div>
        <pre class="code"></pre>
      </div></div>`);
      const t3 = ctx.$(".t3"), insp = ctx.$(".insp"), code = ctx.$(".s3 .code");
      const ORIGINAL = t3.innerHTML;
      const split = new SplitType(t3, { types: "words, chars" });
      ctx.onCleanup(() => split.revert());
      const len = (a) => (a == null ? "null" : `[${a.length}]`);
      const show = (call) => {
        const domSplit = !!t3.querySelector(".word, .char");
        // WAAPI keeps the preview below identical to SplitType's own markup (no extra classes/styles).
        if (domSplit) {
          (split.chars.length ? split.chars : split.words).forEach((p, i) => p.animate(
            [{ opacity: 0, transform: "translateY(.5em) scale(.6)" }, { opacity: 1, transform: "none" }],
            { duration: 500, delay: i * 22, easing: "cubic-bezier(.2, 1.4, .4, 1)", fill: "backwards" }));
        }
        const same = t3.innerHTML === ORIGINAL;
        insp.innerHTML = `<div class="call"><span class="zh">最後呼叫 </span><b>${esc(call)}</b></div>`
          + `<code>instance.isSplit</code><b>${split.isSplit}</b>`
          + `<code>settings.types</code><b>"${esc(String(split.settings.types))}"</b>`
          + `<code>instance.words</code><b>${len(split.words)}</b>`
          + `<code>instance.chars</code><b>${len(split.chars)}</b>`
          + `<code>el.innerHTML.length</code><b>${t3.innerHTML.length}</b>`
          + `<span class="zh">與原始 HTML 相同</span><b class="zh">${same ? "是" : "否"}</b>`
          + (split.isSplit && !domSplit ? `<span class="warn">靜態 SplitType.revert() 只還原 DOM，實例的 isSplit 與 chars 沒有跟著更新。</span>` : "");
        const html = t3.innerHTML;
        code.innerHTML = `<span class="cm">// el.innerHTML${html.length > 260 ? "（前 260 字）" : ""}</span>\n${esc(html.slice(0, 260))}`;
      };
      ctx.button("split()", () => { split.split(); show("split()"); }, { primary: true });
      ctx.button("revert()", () => { split.revert(); show("revert()"); });
      ctx.button('split({ types: "words" })', () => { split.split({ types: "words" }); show('split({ types: "words" })'); });
      ctx.button('split({ types: "words, chars" })', () => { split.split({ types: "words, chars" }); show('split({ types: "words, chars" })'); });
      ctx.button("SplitType.revert(el)", () => { SplitType.revert(t3); show("SplitType.revert(el)"); });
      show('new SplitType(el, { types: "words, chars" })');
    },
  },
  {
    id: "resize", title: "寬度變化重拆",
    api: "new ResizeObserver(() => split.split())・{ absolute: true }",
    desc: "lines 是拆分當下量出來的固定區塊，容器變寬變窄不會自己重排。左邊只拆一次，右邊用 ResizeObserver 在寬度改變 150 ms 後呼叫 split()；切到 absolute: true，連字都不會跟著移動。",
    hint: "拖容器寬度比較兩邊・切到 absolute 看文字凍結",
    mount(ctx) {
      ctx.html(`<div class="fill"><div class="s4">
        <div class="cols">
          <div class="col4"><div class="lab">只在載入時 split 一次</div><div class="box4"><p class="t4 tx">${TEXT4}</p></div></div>
          <div class="col4"><div class="lab">ResizeObserver 偵測寬度後 <b>split()</b></div><div class="box4"><p class="t4 tx">${TEXT4}</p></div></div>
        </div>
        <div class="read"></div>
      </div></div>`);
      const root = ctx.$(".s4"), boxB = ctx.$$(".s4 .box4")[1], [pA, pB] = ctx.$$(".s4 .t4"), read = ctx.$(".s4 .read");
      let abs = false, splits = 0, timer = 0, touched = false;
      const mark = (s) => s.lines.forEach((l, i) => { l.style.setProperty("--li", i); l.dataset.ln = i + 1; });
      const stale = new SplitType(pA, { types: "lines, words" });
      const live = new SplitType(pB, { types: "lines, words" });
      ctx.onCleanup(() => { stale.revert(); live.revert(); });
      const paint = () => {
        read.innerHTML = `<span class="tag">容器寬 <b>${boxB.clientWidth}</b> px</span>`
          + `<span class="tag">左邊 lines <b>${stale.lines.length}</b></span>`
          + `<span class="tag">右邊 lines <b>${live.lines.length}</b></span>`
          + `<span class="tag">右邊重拆 <b>${splits}</b> 次</span>`;
      };
      const splitBoth = () => { stale.split({ absolute: abs }); live.split({ absolute: abs }); mark(stale); mark(live); paint(); };
      // README pattern: observe the container and only re-split when its width (or font size) changed.
      const keyB = () => `${boxB.clientWidth}|${getComputedStyle(pB).fontSize}`;
      let lastB = keyB();
      const ro = new ResizeObserver(() => {
        const k = keyB();
        if (k === lastB) return;
        lastB = k;
        clearTimeout(timer);
        timer = ctx.timeout(() => { live.split(); mark(live); splits++; paint(); }, 150);
      });
      ro.observe(boxB);
      ctx.onCleanup(() => ro.disconnect());
      const slider = ctx.slider("容器寬度", { min: 50, max: 100, value: 100, format: (v) => `${v}%` }, (v) => { root.style.setProperty("--w", `${v}%`); paint(); });
      ctx.on(slider, "pointerdown", () => { touched = true; });
      ctx.group(["相對定位", "absolute: true"], 0, (i) => { abs = i === 1; splitBoth(); });
      mark(stale); mark(live); paint();
      // Split again once fonts are ready so the "split once" side starts from the real layout.
      document.fonts.ready.then(() => { if (ctx.active) splitBoth(); });
      // Shrink once so the difference shows without interaction.
      ctx.timeout(() => { if (!touched) { slider.value = 66; slider.dispatchEvent(new Event("input")); } }, 800);
    },
  },
  {
    id: "native", title: "原生動畫",
    api: "split.chars.forEach((c, i) => c.animate(keyframes, { delay: i * 35 }))",
    desc: "SplitType 不綁動畫庫：拆出的元素可以直接呼叫 Web Animations API 的 animate()，也能交給 CSS animation 依行錯開。讀數是 getAnimations() 實際抓到的動畫數與全部播完的時間。",
    hint: "切換三種做法・滑過波紋模式的文字",
    mount(ctx) {
      ctx.html(`<div class="fill"><div class="s5">
        <p class="t5 tx"></p>
        <div class="read"><span class="tag na"></span><span class="tag np"></span><span class="tag nd"></span></div>
        <pre class="code"></pre>
      </div></div>`);
      const t5 = ctx.$(".t5"), code = ctx.$(".s5 .code");
      const [na, np, nd] = [".na", ".np", ".nd"].map((s) => ctx.$(`.s5 ${s}`));
      const fg = getComputedStyle(t5).color;
      const hi = getComputedStyle(document.documentElement).getPropertyValue("--c2").trim() || "#4cc9f0";
      const wave = [{ transform: "none", color: fg }, { transform: "translateY(-.4em) scale(1.25)", color: hi, offset: .35 }, { transform: "none", color: fg }];
      let m = 0, split = null, auto = 0;
      const report = () => {
        const list = t5.getAnimations({ subtree: true });
        const unit = m === 1 ? "line" : "char";
        na.innerHTML = `getAnimations() <b>${list.length}</b> 個`;
        np.innerHTML = `拆出 <b>${m === 1 ? split.lines.length : split.chars.length}</b> 個 ${unit}`;
        nd.innerHTML = "播放中…";
        const t0 = performance.now();
        Promise.all(list.map((a) => a.finished))
          .then(() => { if (ctx.active) nd.innerHTML = `全部播完 <b>${Math.round(performance.now() - t0)}</b> ms`; })
          .catch(() => {}); // a newer run cancelled these animations
      };
      const ripple = (k) => split.chars.forEach((c, i) => c.animate(wave, { duration: 520, delay: Math.abs(i - k) * 35, easing: "ease-out" }));
      const play = () => {
        if (m === 0) split.chars.forEach((c, i) => c.animate(KF_A, { duration: 600, delay: i * 35, easing: "cubic-bezier(.2, 1.3, .4, 1)", fill: "backwards" }));
        else if (m === 1) { split.lines.forEach((l, i) => l.style.setProperty("--li", i)); replay(t5, "anim"); }
        else ripple(Math.floor(split.chars.length / 2));
        report();
      };
      const setup = (i) => {
        m = i;
        clearInterval(auto);
        if (split) split.revert();
        t5.className = `t5 tx ${M5[i].cls}`;
        t5.textContent = M5[i].text;
        if (split) split.split({ types: M5[i].types });
        else split = new SplitType(t5, { types: M5[i].types });
        code.textContent = M5[i].code;
        sync();
        play();
        // Ripple on its own until the pointer takes over.
        if (i === 2) auto = ctx.interval(() => { ripple(Math.floor(Math.random() * split.chars.length)); report(); }, 2200);
      };
      const sync = watchLayout(ctx, t5, () => {
        t5.classList.remove("anim");
        split.split();
        if (m === 1) split.lines.forEach((l, i) => l.style.setProperty("--li", i));
      });
      ctx.onCleanup(() => split && split.revert());
      ctx.on(t5, "pointerover", (e) => {
        if (m !== 2) return;
        const k = split.chars.indexOf(e.target.closest(".char"));
        if (k < 0) return;
        clearInterval(auto);
        ripple(k);
        report();
      });
      ctx.group(M5.map((x) => x.label), 0, setup);
      ctx.button("重播", play);
      setup(0);
    },
  },
  {
    id: "options", title: "標籤與 class",
    api: "{ tagName, lineClass, wordClass, charClass, splitClass }",
    desc: "tagName 決定拆分元素用什麼標籤，lineClass、wordClass、charClass 換掉各層 class，splitClass 則加到每一層。下方是實際產生的第一行標記與對應的樣式掛鉤。",
    hint: "切換選項・看標記裡的標籤與 class 怎麼變",
    mount(ctx) {
      ctx.html(`<div class="fill"><div class="s6" data-m="0">
        <p class="t6 tx">${TEXT6}</p>
        <div class="read"></div>
        <pre class="code"></pre>
        <div class="note"></div>
      </div></div>`);
      const root = ctx.$(".s6"), t6 = ctx.$(".t6"), read = ctx.$(".s6 .read"), code = ctx.$(".s6 .code"), note = ctx.$(".s6 .note");
      let split = null, m = 0;
      // Highlight tag names and class values in the escaped markup.
      const hl = (s) => s.replace(/class="([^"]*)"/g, 'class="<b>$1</b>"').replace(/&lt;(\/?)(div|span)\b/g, "&lt;$1<b>$2</b>");
      const build = () => {
        if (split) split.revert();
        split = new SplitType(t6, { types: "lines, words, chars", ...M6[m].opts });
        root.dataset.m = m;
        const c0 = split.chars[0];
        read.innerHTML = `<span class="tag">chars[0].tagName <b>${c0.tagName}</b></span>`
          + `<span class="tag">chars[0].classList <b>${[...c0.classList].join(" ")}</b></span>`
          + `<span class="tag">div <b>${t6.getElementsByTagName("div").length}</b>・span <b>${t6.getElementsByTagName("span").length}</b></span>`;
        let html = split.lines[0].outerHTML;
        if (html.length > 330) html = `${html.slice(0, 330)} …`;
        code.innerHTML = `<span class="cm">// 第一行實際標記</span>\n${hl(esc(html))}\n\n<span class="cm">/* 對應的樣式掛鉤 */</span>\n${esc(M6[m].css)}`;
        note.textContent = M6[m].note;
        sync();
      };
      const sync = watchLayout(ctx, t6, () => split.split());
      ctx.onCleanup(() => split && split.revert());
      ctx.group(M6.map((x) => x.label), 0, (i) => { m = i; build(); });
      build();
    },
  },
  {
    id: "nested", title: "巢狀與 Unicode",
    api: 'new SplitType(el, { types: "words, chars" })・保留 <a> <em> <strong> <br>',
    desc: "目標裡的 <a>、<em>、<strong>、<br> 拆完仍保留，連結照樣能點。字元依 Unicode 規則切分：ZWJ 家庭、膚色、國旗與組合音標都算一個 char，綠框標出由多個碼位組成的字。",
    hint: "滑過任一字看碼位・點藍色連結確認事件仍有效",
    mount(ctx) {
      ctx.html(`<div class="fill"><div class="s7 boxes">
        <p class="t7 tx">${HTML7}</p>
        <div class="read r1"></div>
        <div class="read r2"><span class="tag cp"></span><span class="tag ck">連結點擊 <b>0</b> 次</span></div>
        <div class="note">巢狀元素會被設成 inline-block，底線這類 text-decoration 不會延續到裡面的字，所以連結改用 border-bottom 標示。</div>
      </div></div>`);
      const root = ctx.$(".s7"), t7 = ctx.$(".t7"), r1 = ctx.$(".s7 .r1"), cp = ctx.$(".s7 .cp"), ck = ctx.$(".s7 .ck b");
      const raw = t7.textContent;
      const split = new SplitType(t7, { types: "words, chars" });
      ctx.onCleanup(() => split.revert());
      const multi = split.chars.filter((c) => [...c.textContent].length > 1);
      multi.forEach((c) => c.classList.add("multi"));
      const seg = new Intl.Segmenter("zh-Hant", { granularity: "grapheme" });
      const graphemes = [...seg.segment(raw)].filter((s) => /\S/.test(s.segment)).length;
      const kept = ["a", "em", "strong", "br"].map((t) => `${t} <b>${t7.getElementsByTagName(t).length}</b>`).join("・");
      r1.innerHTML = `<span class="tag">.length <b>${raw.length}</b></span><span class="tag">碼位 <b>${[...raw].length}</b></span>`
        + `<span class="tag">非空白字素 <b>${graphemes}</b></span><span class="tag">split.chars <b>${split.chars.length}</b></span>`
        + `<span class="tag">多碼位字 <b>${multi.length}</b></span><span class="tag">保留 ${kept}</span>`;
      const showCp = (c) => { cp.innerHTML = `${esc(c.textContent)} = <b>${codePoints(c.textContent)}</b>`; };
      if (multi.length) showCp(multi[0]);
      ctx.on(t7, "pointerover", (e) => { const c = e.target.closest(".char"); if (c) showCp(c); });
      let clicks = 0;
      ctx.on(t7.querySelector("a"), "click", (e) => { e.preventDefault(); ck.textContent = ++clicks; });
      ctx.toggle("顯示拆分框", true, (v) => root.classList.toggle("boxes", v));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new SplitType(el, { types }) × N 字・char.animate()",
    desc: "每一級把 N 個字重新 new SplitType() 並計時，再替每個 char 建一個無限循環的 WAAPI 動畫，逐級加量直到掉到 30 FPS 以下。切換 types 比較拆分耗時。",
    hint: "按「自動加壓」開始・換 types 比較 split 耗時",
    mount(ctx) {
      ctx.html(`<div class="flood tx"></div>`);
      const box = ctx.$(".flood");
      const TYPES8 = ["chars", "words, chars", "lines, words, chars"];
      let ti = 1, split = null, anims = [], splitMs = 0, nodes = 0;
      const clear = () => {
        anims.forEach((a) => a.cancel());
        anims = [];
        if (split) split.revert();
      };
      ctx.onCleanup(clear);
      const apply = (n) => {
        clear();
        box.style.setProperty("--fs", `${n <= 1000 ? 16 : n <= 4000 ? 11 : n <= 16000 ? 8 : 6}px`);
        box.textContent = makeText(n);
        const t0 = performance.now();
        split = new SplitType(box, { types: TYPES8[ti] });
        splitMs = performance.now() - t0;
        nodes = box.getElementsByTagName("*").length;
        anims = split.chars.map((c, i) => c.animate(KF8, { duration: 1400, delay: -i * 9, iterations: Infinity, direction: "alternate", easing: "ease-in-out" }));
      };
      ctx.group(TYPES8, ti, (i) => { ti = i; lab.set(lab.value); });
      ctx.controls.classList.add("bottom");
      const lab = ctx.ramp({
        label: "動畫字數", unit: "字", steps: [250, 500, 1000, 2000, 4000, 8000, 16000, 32000],
        minFps: 30,
        apply,
        metrics: () => ({
          "split 耗時": `${splitMs.toFixed(1)} ms`,
          "元素數": nf.format(nodes),
          "types": TYPES8[ti],
        }),
        note: "split 耗時只算 new SplitType()，lines 會多一次版面量測。每個 char 各跑一個無限循環的 WAAPI transform 動畫。",
      });
    },
  },
] });
</script>
