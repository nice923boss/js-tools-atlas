<script>
// sql.js showcase: SQL console, prepared statements, transactions + updateHook, custom functions and
// window functions, export / re-open, FTS4 search, query plans with indexes, and an INSERT/query benchmark.
const PREFIX = "atlas-sqljs-";
const { fmt, fmtMs, fmtCompact } = Showcase;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const since = (t0) => performance.now() - t0;
const mb = (b) => (b >= 1073741824 ? `${(b / 1073741824).toFixed(1)} GB` : `${(b / 1048576).toFixed(b < 10485760 ? 2 : 1)} MB`);
const bytes = (b) => (b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : mb(b));
const hl = (code) => esc(code).replace(/(&quot;.*?&quot;|'[^'\n]*')/g, '<span class="s">$1</span>').replace(/\.(\w+)\(/g, '.<span class="k">$1</span>(').replace(/(\/\/[^\n]*|--[^\n]*)/g, '<span class="c">$1</span>');
const sqlReady = initSqlJs({ locateFile: (f) => `https://cdn.jsdelivr.net/npm/sql.js@1.14.2/dist/${f}` });

// Sample data: Taiwan counties (illustrative numbers, not official statistics)
// [code, name, region, area_km2, population_2025, annual_growth]
const COUNTIES = [
  ["NWT", "新北市", "北部", 2052.6, 4040000, -0.002], ["TXG", "臺中市", "中部", 2214.9, 2850000, 0.004],
  ["KHH", "高雄市", "南部", 2951.9, 2730000, -0.003], ["TPE", "臺北市", "北部", 271.8, 2480000, -0.010],
  ["TAO", "桃園市", "北部", 1221.0, 2330000, 0.010], ["TNN", "臺南市", "南部", 2191.7, 1850000, -0.003],
  ["CHA", "彰化縣", "中部", 1074.4, 1240000, -0.006], ["PIF", "屏東縣", "南部", 2775.6, 800000, -0.009],
  ["YUN", "雲林縣", "中部", 1290.8, 660000, -0.009], ["HSQ", "新竹縣", "北部", 1427.5, 590000, 0.013],
  ["MIA", "苗栗縣", "中部", 1820.3, 535000, -0.006], ["CYQ", "嘉義縣", "南部", 1903.6, 480000, -0.011],
  ["NAN", "南投縣", "中部", 4106.4, 480000, -0.009], ["ILA", "宜蘭縣", "北部", 2143.6, 450000, -0.004],
  ["HSZ", "新竹市", "北部", 104.2, 455000, 0.008], ["KEE", "基隆市", "北部", 132.8, 362000, -0.008],
  ["HUA", "花蓮縣", "東部", 4628.6, 318000, -0.008], ["CYI", "嘉義市", "南部", 60.0, 262000, -0.006],
  ["TTT", "臺東縣", "東部", 3515.3, 212000, -0.008], ["KIN", "金門縣", "離島", 151.7, 145000, 0.004],
  ["PEN", "澎湖縣", "離島", 126.9, 108000, 0.002], ["LIE", "連江縣", "離島", 28.8, 14000, 0.005],
];
function seedCounties(db) {
  db.run("CREATE TABLE county (code TEXT PRIMARY KEY, name TEXT NOT NULL, region TEXT, area_km2 REAL);");
  db.run("CREATE TABLE population (code TEXT REFERENCES county(code), year INTEGER, people INTEGER, PRIMARY KEY (code, year));");
  const c = db.prepare("INSERT INTO county VALUES (?, ?, ?, ?)");
  const p = db.prepare("INSERT INTO population VALUES (?, ?, ?)");
  db.run("BEGIN");
  for (const [code, name, region, area, pop, g] of COUNTIES) {
    c.run([code, name, region, area]);
    for (let y = 2019; y <= 2025; y++) p.run([code, y, Math.round(pop / Math.pow(1 + g, 2025 - y))]);
  }
  db.run("COMMIT");
  c.free(); p.free();
}

// Each scene opens its own in-memory database and closes it on unmount
async function openDb(ctx, data) {
  let st = null;
  const t0 = setTimeout(() => { if (ctx.active) st = ctx.status("載入 SQLite WebAssembly…"); }, 120);
  const SQL = await sqlReady;
  clearTimeout(t0);
  if (st) st.done();
  if (!ctx.active) throw new DOMException("scene left", "AbortError");
  const db = new SQL.Database(data);
  ctx.onCleanup(() => db.close());
  return { SQL, db };
}
const scalar = (db, sql, params) => { const r = db.exec(sql, params)[0]; return r ? r.values[0][0] : null; };
function cell(v) {
  if (v === null) return ["NULL", "null"];
  if (typeof v === "number") return [Number.isInteger(v) && Math.abs(v) >= 10000 ? v.toLocaleString("zh-TW") : String(v), "n"];
  if (v instanceof Uint8Array) return [`BLOB ${v.length} bytes`, "null"];
  return [esc(v), ""];
}
// Result table; draws inline bars on the last numeric column when there is also a text column
function table(el, r, { max = 500, mark } = {}) {
  if (!r) { el.innerHTML = '<div class="sq-empty">指令已執行，沒有回傳資料列。</div>'; return; }
  const { columns, values } = r;
  const numeric = columns.map((_, i) => values.length > 0 && values.every((row) => typeof row[i] === "number" || row[i] === null));
  let barCol = -1;
  if (numeric.some((x) => !x) && values.length <= 60) for (let i = columns.length - 1; i >= 0; i--) if (numeric[i]) { barCol = i; break; }
  const top = barCol >= 0 ? Math.max(...values.map((row) => Math.abs(row[barCol] || 0))) || 1 : 1;
  const body = values.slice(0, max).map((row) => `<tr>${row.map((v, i) => {
    let [s, cls] = cell(v);
    if (mark && typeof v === "string") s = mark(s);
    if (i === barCol && v !== null) return `<td class="n bar" style="--w:${(Math.abs(v) / top).toFixed(3)}"><span>${s}</span></td>`;
    return `<td class="${cls}">${s}</td>`;
  }).join("")}</tr>`).join("");
  el.innerHTML = `<table class="sq-t"><thead><tr>${columns.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
}
function makeLog(el, max = 40) {
  return (text, { t, cls = "" } = {}) => {
    const row = document.createElement("div");
    row.className = cls;
    row.innerHTML = `<span>${esc(text)}</span><small>${t != null ? fmtMs(t) : ""}</small>`;
    el.prepend(row);
    while (el.children.length > max) el.lastChild.remove();
  };
}
function bars(el, items) {
  const top = Math.max(...items.map((x) => x.v), 1e-6);
  el.innerHTML = items.map((x) => `<div><span>${esc(x.label)}</span><i class="${x.cls || ""}" style="width:${Math.max(1, (x.v / top) * 100).toFixed(1)}%"></i><small>${esc(x.text)}</small></div>`).join("");
}
// Shared console: example chips + editor + result table
function sqlConsole(ctx, host, db, examples, onWrite) {
  host.innerHTML = `<div class="sq-chips"></div><div class="sq-ed"><textarea spellcheck="false" aria-label="SQL"></textarea><kbd>Ctrl+Enter</kbd></div>
    <div class="sq-row"><button class="btn primary" type="button">執行</button><span class="sq-msg"></span></div><div class="sq-res"></div>`;
  const chips = host.querySelector(".sq-chips"), ta = host.querySelector("textarea"), msg = host.querySelector(".sq-msg"), res = host.querySelector(".sq-res");
  chips.innerHTML = examples.map((e, i) => `<button class="sq-pill${e.w ? " w" : ""}" type="button" data-i="${i}">${esc(e.name)}</button>`).join("");
  const press = (i) => chips.querySelectorAll(".sq-pill").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
  function run() {
    const sql = ta.value;
    try {
      const t0 = performance.now();
      const out = db.exec(sql);
      const ms = since(t0);
      const last = out[out.length - 1];
      table(res, last);
      msg.className = "sq-msg";
      msg.innerHTML = last ? `<b>${last.values.length}</b> 列・${fmtMs(ms)}` : `完成，最後一個敘述影響 <b>${db.getRowsModified()}</b> 列・${fmtMs(ms)}`;
      if (onWrite && /\b(create|drop|insert|update|delete|alter|replace)\b/i.test(sql)) onWrite();
    } catch (err) {
      msg.className = "sq-msg err";
      msg.textContent = `SQL 錯誤：${err.message}`;
    }
  }
  const pick = (i) => { press(i); ta.value = examples[i].sql; run(); };
  ctx.on(chips, "click", (e) => { const b = e.target.closest(".sq-pill"); if (b) pick(+b.dataset.i); });
  ctx.on(host.querySelector(".btn"), "click", run);
  ctx.on(ta, "keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); } });
  ctx.on(ta, "input", () => press(-1));
  return { run, pick, set(sql) { press(-1); ta.value = sql; run(); } };
}
const deleteDb = (name) => new Promise((res) => { const r = indexedDB.deleteDatabase(name); r.onsuccess = r.onerror = r.onblocked = () => res(); });
function idbOpen(name) {
  return new Promise((res, rej) => {
    const r = indexedDB.open(name, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("files");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbDo(idb, mode, fn) {
  return new Promise((res, rej) => {
    const tx = idb.transaction("files", mode);
    const req = fn(tx.objectStore("files"));
    tx.oncomplete = () => res(req.result);
    tx.onerror = () => rej(tx.error);
  });
}
async function usageText() {
  if (!navigator.storage || !navigator.storage.estimate) return "此瀏覽器不提供 navigator.storage.estimate()";
  const { usage = 0, quota = 0 } = await navigator.storage.estimate();
  return `本網域儲存用量約 ${mb(usage)}／配額約 ${mb(quota)}（storage.estimate）`;
}
// Deletes every IndexedDB database this demo created
async function clearDemoData() {
  const names = new Set([PREFIX + "files"]);
  if (indexedDB.databases) for (const d of await indexedDB.databases()) if (d.name && d.name.startsWith(PREFIX)) names.add(d.name);
  for (const n of names) await deleteDb(n);
  return names.size;
}

const EXAMPLES = [
  { name: "人口前五名", sql: "-- 2025 年人口前五名（示意資料）\nSELECT c.name AS 縣市, c.region AS 區域, p.people AS 人口\nFROM population p JOIN county c USING (code)\nWHERE p.year = 2025\nORDER BY p.people DESC\nLIMIT 5;" },
  { name: "各區域合計", sql: "-- GROUP BY 彙總各區域\nSELECT c.region AS 區域, COUNT(*) AS 縣市數, SUM(p.people) AS 人口\nFROM population p JOIN county c USING (code)\nWHERE p.year = 2025\nGROUP BY c.region\nORDER BY 人口 DESC;" },
  { name: "人口密度", sql: "-- 每平方公里人數\nSELECT c.name AS 縣市, ROUND(p.people / c.area_km2, 1) AS 每平方公里\nFROM population p JOIN county c USING (code)\nWHERE p.year = 2025\nORDER BY 2 DESC\nLIMIT 10;" },

        const t0 = performance.now();
        last = db.export();
        const ms = since(t0);
        const ps = scalar(db, "PRAGMA page_size"), pc = scalar(db, "PRAGMA page_count");
        ctx.$("[data-kv]").innerHTML = `<span>匯出大小</span><b>${bytes(last.byteLength)}（${fmt(last.byteLength)} bytes）</b><span>型別</span><b>${last.constructor.name}</b>
          <span>page_size × page_count</span><b>${fmt(ps)} × ${fmt(pc)} = ${fmt(ps * pc)}</b><span>耗時</span><b>${fmtMs(ms)}</b>`;
        const head = Array.from(last.slice(0, 32), (b) => b.toString(16).padStart(2, "0"));
        ctx.$("[data-hex]").innerHTML = `<b>${head.slice(0, 16).join(" ")}</b> ${head.slice(16).join(" ")}<br>「${esc(new TextDecoder().decode(last.slice(0, 15)))}」`;
        ctx.$("[data-dl]").disabled = ctx.$("[data-save]").disabled = false;
        log(`export() 得到 ${bytes(last.byteLength)} 的 Uint8Array`, { t: ms, cls: "ok" });
      });
      ctx.on(ctx.$("[data-dl]"), "click", () => {
        const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(new Blob([last], { type: "application/vnd.sqlite3" })), download: "taiwan-population-demo.sqlite" });
        a.click();
        ctx.timeout(() => URL.revokeObjectURL(a.href), 1000);
        log("已觸發下載 taiwan-population-demo.sqlite", { cls: "info" });
      });
      ctx.on(ctx.$("[data-save]"), "click", async () => {
        const t0 = performance.now();
        await idbDo(await ensureIdb(), "readwrite", (s) => s.put(last, "snapshot"));
        log(`存進 IndexedDB「${IDB}」`, { t: since(t0), cls: "ok" });
        paintUsage();
      });
      const reopen = (buf, from) => {
        const t0 = performance.now();
        const copy = new SQL.Database(buf);
        try {
          const tbls = copy.exec("SELECT name FROM sqlite_master WHERE type = 'table'")[0]?.values.map((r) => r[0]) || [];
          let msg = `從${from}開回 ${bytes(buf.byteLength)}，資料表：${tbls.join("、") || "（無）"}`;
          if (["county", "population", "visit"].every((t) => tbls.includes(t))) {
            const a = counts(copy), b = counts(db);
            msg += `；列數 ${a.join("/")}，與記憶體中 ${b.join("/")} ${a.join() === b.join() ? "一致" : "不同（匯出後又改過）"}`;
          }
          log(msg, { t: since(t0), cls: "ok" });
        } finally { copy.close(); }
      };
      ctx.on(ctx.$("[data-load]"), "click", async () => {
        const buf = await idbDo(await ensureIdb(), "readonly", (s) => s.get("snapshot"));
        if (!buf) { log("IndexedDB 裡還沒有副本，先按 export 再存", { cls: "err" }); return; }
        reopen(buf, " IndexedDB ");
      });
      ctx.on(ctx.$("[data-open]"), "click", () => ctx.$("[data-file]").click());
      ctx.on(ctx.$("[data-file]"), "change", async (e) => {
        const f = e.target.files[0];
        e.target.value = "";
        if (!f) return;
        try { reopen(new Uint8Array(await f.arrayBuffer()), `「${f.name}」`); } catch (err) { log(`無法開啟：${err.message}`, { cls: "err" }); }
      });
      ctx.on(ctx.$("[data-clear]"), "click", async () => {
        if (idb) { idb.close(); idb = null; }
        const n = await clearDemoData();
        log(`已刪除 ${n} 個 IndexedDB 資料庫（${PREFIX}*）`, { cls: "info" });
        paintUsage();
      });
      paintRows(); paintUsage();
      ctx.interval(paintUsage, 4000);
    },
  },
  {
    id: "fts", title: "全文檢索", paper: true,
    api: "CREATE VIRTUAL TABLE ... USING fts4 / MATCH",
    desc: "sql.js 1.14 內建 FTS3／FTS4，沒有編入 FTS5。中文沒有空白分詞，這裡在 JS 端把文字切成雙字詞（bigram）再寫入 fts4 表，查詢時也切成片語比對。同一個關鍵字用 LIKE '%…%' 全表掃描對照筆數與耗時。2 萬篇短文且命中率高時 LIKE 不一定比較慢；關鍵字越少見、資料越多，索引的優勢越明顯。",
    hint: "改關鍵字（至少兩個字）看 MATCH 與 LIKE 的差距",
    async mount(ctx) {
      ctx.html(`<div class="sq-board wide-left"><section class="sq-panel"><header><h3>搜尋 20,000 篇示意文章</h3><span class="sq-chip" data-n></span></header>
        <input class="sq-in" value="花蓮溫泉" aria-label="搜尋關鍵字" data-q><div class="sq-chips" data-pre></div>
        <div class="sq-res" data-res></div></section>
        <section class="sq-panel"><header><h3>MATCH vs LIKE</h3></header><div class="sq-bars" data-bars></div>
          <pre class="sq-code sq-hide-narrow" data-sql></pre><div class="sq-note" data-opts></div><div class="sq-log"></div></section></div>`);
      const { db } = await openDb(ctx);
      const log = makeLog(ctx.$(".sq-log"));
      const PLACES = ["臺北", "新北", "桃園", "臺中", "臺南", "高雄", "花蓮", "臺東", "宜蘭", "澎湖", "金門", "嘉義", "新竹", "基隆", "南投", "屏東"];
      const TOPICS = ["捷運延伸", "夜市美食", "老街散步", "自行車道", "溫泉旅館", "咖啡廳", "登山步道", "海岸線", "圖書館", "文化祭", "親子公園", "古蹟導覽", "農產市集", "藝術展覽", "觀光工廠", "露營區"];
      const VERBS = ["新開幕", "週末限定", "深度攻略", "在地推薦", "交通指南", "排隊名店", "秋季活動", "免費參觀"];
      const bigrams = (s) => {
        const out = [];
        for (const m of s.toLowerCase().match(/[㐀-鿿]+|[a-z0-9]+/g) || []) {
          if (/^[a-z0-9]/.test(m) || m.length === 1) out.push(m);
          else for (let i = 0; i < m.length - 1; i++) out.push(m.slice(i, i + 2));
        }
        return out;
      };
      const t0 = performance.now();
      db.run("CREATE TABLE doc (id INTEGER PRIMARY KEY, body TEXT); CREATE VIRTUAL TABLE doc_fts USING fts4(tokens);");
      const a = db.prepare("INSERT INTO doc VALUES (?, ?)"), b = db.prepare("INSERT INTO doc_fts (docid, tokens) VALUES (?, ?)");
      let seed = 7;
      // Park-Miller generator: products stay below 2^53, so results are exact
      const rnd = (arr) => arr[Math.floor(((seed = (seed * 16807) % 2147483647) / 2147483647) * arr.length)];
      db.run("BEGIN");
      for (let i = 1; i <= 20000; i++) {
        const body = `${rnd(PLACES)}${rnd(TOPICS)}${rnd(VERBS)}：順路到${rnd(PLACES)}的${rnd(TOPICS)}，${rnd(VERBS)}（示意文章 ${i}）`;
        a.run([i, body]); b.run([i, bigrams(body).join(" ")]);
      }
      db.run("COMMIT"); a.free(); b.free();
      log("建立 20,000 篇文章與 fts4 索引（雙字詞）", { t: since(t0), cls: "info" });
      ctx.$("[data-n]").innerHTML = `<b>20,000</b> 篇`;
      const opts = db.exec("PRAGMA compile_options")[0].values.map((r) => r[0]).filter((o) => /FTS|JSON|RTREE|MATH/.test(o));
      let fts5 = "可用";
      try { db.run("CREATE VIRTUAL TABLE probe5 USING fts5(x)"); db.run("DROP TABLE probe5"); } catch (e) { fts5 = `不可用（${e.message}）`; }
      ctx.$("[data-opts]").textContent = `compile_options：${opts.join("、") || "無"}。FTS5：${fts5}`;
      ctx.$("[data-pre]").innerHTML = ["花蓮溫泉", "溫泉旅館", "澎湖海岸線", "夜市", "圖書館新開幕"].map((p) => `<button class="sq-pill" type="button">${p}</button>`).join("");
      const q = ctx.$("[data-q]");
      function search() {
        const term = q.value.trim();
        const toks = bigrams(term);
        if (!toks.length || term.length < 2) { ctx.$("[data-res]").innerHTML = '<div class="sq-empty">請輸入至少兩個字；雙字詞切法無法比對單一中文字。</div>'; return; }
        const match = `"${toks.join(" ")}"`;
        const sqlM = "SELECT d.id, d.body FROM doc_fts JOIN doc d ON d.id = doc_fts.docid WHERE doc_fts MATCH ? ORDER BY d.id LIMIT 200";
        const sqlL = "SELECT id, body FROM doc WHERE body LIKE ? ORDER BY id LIMIT 200";
        const time = (sql, p) => { const t = performance.now(); let r; for (let i = 0; i < 5; i++) r = db.exec(sql, [p]); return [since(t) / 5, r[0]]; };
        const [tm, rm] = time(sqlM, match);
        const [tl, rl] = time(sqlL, `%${term}%`);
        const nM = scalar(db, "SELECT COUNT(*) FROM doc_fts WHERE doc_fts MATCH ?", [match]);
        const nL = scalar(db, "SELECT COUNT(*) FROM doc WHERE body LIKE ?", [`%${term}%`]);
        const re = new RegExp(esc(term).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "g");
        table(ctx.$("[data-res]"), rm ? { columns: ["id", "內容"], values: rm.values } : null, { mark: (s) => s.replace(re, (x) => `<mark>${x}</mark>`) });
        if (!rm) ctx.$("[data-res]").innerHTML = '<div class="sq-empty">MATCH 沒有結果</div>';
        bars(ctx.$("[data-bars]"), [
          { label: `fts4 MATCH（${fmt(nM)} 筆）`, v: tm, text: fmtMs(tm), cls: "ok" },
          { label: `LIKE 掃描（${fmt(nL)} 筆）`, v: tl, text: fmtMs(tl), cls: "hot" },
        ]);
        ctx.$("[data-sql]").innerHTML = hl(`-- MATCH 片語：${match}\nSELECT ... WHERE doc_fts MATCH ?\n-- 對照\nSELECT ... WHERE body LIKE '%${term}%'`);
        log(`「${term}」MATCH ${fmt(nM)} 筆、LIKE ${fmt(nL)} 筆，MATCH ${fmtMs(tm)}／LIKE ${fmtMs(tl)}`, { cls: nM === nL ? "ok" : "info" });
      }
      ctx.on(ctx.$("[data-pre]"), "click", (e) => { const b2 = e.target.closest(".sq-pill"); if (b2) { q.value = b2.textContent; search(); } });
      let deb;
      ctx.on(q, "input", () => { clearTimeout(deb); deb = ctx.timeout(search, 250); });
      search();
    },
  },
  {
    id: "plan", title: "索引與查詢計畫", paper: true,
    api: "EXPLAIN QUERY PLAN / CREATE INDEX",
    desc: "20 萬筆示意訂單。選一個查詢，切換索引，看 EXPLAIN QUERY PLAN 從 SCAN（全表掃描）變成 SEARCH ... USING INDEX，並實測 20 次平均耗時。右側累積每次的比較結果。",
    hint: "先跑一次，再開啟對應索引重跑",
    async mount(ctx) {
      ctx.html(`<div class="sq-board"><section class="sq-panel" style="overflow-y:auto"><header><h3>查詢</h3><span class="sq-chip" data-n></span></header>
        <div class="sq-chips" data-qs></div><pre class="sq-code sq-hide-narrow" data-sql></pre>
        <div class="sq-note">EXPLAIN QUERY PLAN</div><pre class="sq-plan" data-plan></pre><div class="sq-msg" style="margin:0;text-align:left;flex:none" data-ms></div>
        <div class="sq-note">索引（點一下建立或刪除）</div><div class="sq-chips" data-ix></div></section>
        <section class="sq-panel"><header><h3>平均耗時比較</h3><button class="btn" type="button" data-again style="margin-left:auto">再跑一次</button></header><div class="sq-bars" data-bars></div><div class="sq-log"></div></section></div>`);
      const { db } = await openDb(ctx);
      const log = makeLog(ctx.$(".sq-log"));
      const t0 = performance.now();
      db.run("CREATE TABLE orders (id INTEGER PRIMARY KEY, customer INTEGER, created TEXT, amount INTEGER, status TEXT)");
      const st = db.prepare("INSERT INTO orders VALUES (?, ?, ?, ?, ?)");
      const STATUS = ["已出貨", "已出貨", "已出貨", "處理中", "退貨"];
      db.run("BEGIN");
      for (let i = 1; i <= 200000; i++) st.run([i, (i * 7919) % 5000, new Date(Date.UTC(2024, 0, 1) + ((i * 104729) % 31536000) * 1000).toISOString().slice(0, 19), (i * 37) % 10000, STATUS[(i * 31) % 5]]);
      db.run("COMMIT"); st.free();
      log("建立 200,000 筆訂單", { t: since(t0), cls: "info" });
      ctx.$("[data-n]").innerHTML = `<b>200,000</b> 筆`;
      const QUERIES = [
        { name: "單一客戶", ix: "idx_customer", sql: "SELECT id, amount FROM orders WHERE customer = 1234" },
        { name: "日期範圍排序", ix: "idx_created", sql: "SELECT id, created FROM orders WHERE created BETWEEN '2024-03-01' AND '2024-03-02' ORDER BY created" },
        { name: "狀態加金額", ix: "idx_status_amount", sql: "SELECT COUNT(*) FROM orders WHERE status = '退貨' AND amount > 9500" },
        { name: "GROUP BY 客戶", ix: "idx_customer", sql: "SELECT customer, SUM(amount) FROM orders GROUP BY customer ORDER BY customer LIMIT 5" },
      ];
      const INDEXES = { idx_customer: "orders(customer)", idx_created: "orders(created)", idx_status_amount: "orders(status, amount)" };
      let qi = 0;
      const history = [];
      const has = (n) => !!scalar(db, "SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = ?", [n]);
      ctx.$("[data-qs]").innerHTML = QUERIES.map((x, i) => `<button class="sq-pill" type="button" data-i="${i}">${x.name}</button>`).join("");
      const paintIx = () => (ctx.$("[data-ix]").innerHTML = Object.keys(INDEXES).map((n) => `<button class="sq-pill" type="button" data-ix="${n}" aria-pressed="${has(n)}">${n}</button>`).join(""));
      function run() {
        const q = QUERIES[qi];
        ctx.$$("[data-qs] .sq-pill").forEach((b, i) => b.setAttribute("aria-pressed", String(i === qi)));
        ctx.$("[data-sql]").innerHTML = hl(q.sql);
        const plan = db.exec(`EXPLAIN QUERY PLAN ${q.sql}`)[0].values.map((r) => r[3]);
        ctx.$("[data-plan]").innerHTML = plan.map((p) => `<div class="${/^SCAN/.test(p) && !/COVERING|USING INDEX/.test(p) ? "scan" : /SEARCH|USING/.test(p) ? "search" : ""}">${esc(p)}</div>`).join("");
        const t = performance.now();
        let rows = 0;
        for (let i = 0; i < 20; i++) rows = (db.exec(q.sql)[0]?.values.length) || 0;
        const ms = since(t) / 20;
        ctx.$("[data-ms]").innerHTML = `平均 <b>${fmtMs(ms)}</b>・回傳 ${rows} 列`;
        const withIx = has(q.ix);
        history.push({ label: `${q.name}${withIx ? "（有索引）" : "（無索引）"}`, v: ms, text: fmtMs(ms), cls: withIx ? "ok" : "hot" });
        bars(ctx.$("[data-bars]"), history.slice(-8));
        log(`${q.name}：${plan.join("；")}`, { t: ms, cls: withIx ? "ok" : "dim" });
      }
      ctx.on(ctx.$("[data-qs]"), "click", (e) => { const b = e.target.closest(".sq-pill"); if (b) { qi = +b.dataset.i; run(); } });
      ctx.on(ctx.$("[data-ix]"), "click", (e) => {
        const b = e.target.closest(".sq-pill");
        if (!b) return;
        const n = b.dataset.ix, t = performance.now();
        if (has(n)) { db.run(`DROP INDEX ${n}`); log(`DROP INDEX ${n}`, { t: since(t), cls: "info" }); }
        else { db.run(`CREATE INDEX ${n} ON ${INDEXES[n]}`); log(`CREATE INDEX ${n} ON ${INDEXES[n]}`, { t: since(t), cls: "info" }); }
        paintIx(); run();
      });
      ctx.on(ctx.$("[data-again]"), "click", run);
      paintIx(); run();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "BEGIN + stmt.run() × N / GROUP BY",
    desc: "逐級加大列數，每級先 INSERT N 列（id、群組、數值、文字），再跑 GROUP BY 聚合與 ORDER BY 取前 10 名，分開記錄寫入與查詢耗時。可切換「交易包起來」與「預備陳述式」，比較兩者對寫入速度的影響。每級結束後 DROP TABLE。",
    hint: "按「開始測試」；關掉交易或預備陳述式再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="sq-stress"><section class="sq-panel"><header><h3>每級結果<small>寫入與查詢分開計時</small></h3></header>
        <div class="sq-scroll" data-rows><div class="sq-empty">尚未開始</div></div><div class="sq-note">資料庫在 WASM 記憶體中，沒有磁碟 fsync，所以有無交易的差距比磁碟上的 SQLite 小。</div></section></div>`);
      ctx.controls.classList.add("bottom");
      const { db } = await openDb(ctx);
      let tx = true, prep = true;
      const results = [];
      ctx.toggle("交易包起來", tx, (v) => (tx = v));
      ctx.toggle("預備陳述式", prep, (v) => (prep = v));
      const paint = () => {
        ctx.$("[data-rows]").innerHTML = results.length ? `<table class="sq-t"><thead><tr><th>列數</th><th>模式</th><th>寫入</th><th>列/秒</th><th>查詢</th><th>DB 大小</th></tr></thead><tbody>${results.map((r) =>
          `<tr><td class="n">${fmt(r.n)}</td><td>${r.mode}</td><td class="n">${r.w}</td><td class="n">${r.rate}</td><td class="n">${r.q}</td><td class="n">${r.size}</td></tr>`).join("")}</tbody></table>` : '<div class="sq-empty">尚未開始</div>';
      };
      ctx.bench({
        label: "列數", unit: "列", sizes: [1000, 10000, 50000, 100000, 250000, 500000, 1000000], budget: 4000, target: 1500,
        async run(n) {
          let st = null;
          try {
            db.run("DROP TABLE IF EXISTS t; CREATE TABLE t (id INTEGER PRIMARY KEY, grp INTEGER, val REAL, txt TEXT);");
            const mode = `${tx ? "交易" : "自動提交"}・${prep ? "prepare" : "SQL 字串"}`;
            if (prep) st = db.prepare("INSERT INTO t VALUES (?, ?, ?, ?)");
            const t0 = performance.now();
            if (tx) db.run("BEGIN");
            for (let i = 0; i < n; i++) {
              const v = ((i * 2654435761) % 1000003) / 100;
              if (st) st.run([i, i % 100, v, `row-${i}`]);
              else db.run(`INSERT INTO t VALUES (${i}, ${i % 100}, ${v}, 'row-${i}')`);
              if (i % 50000 === 49999) { await new Promise((r) => setTimeout(r)); if (!ctx.active) return ""; }
            }
            if (tx) db.run("COMMIT");
            const w = since(t0);
            const t1 = performance.now();
            db.exec("SELECT grp, COUNT(*), AVG(val), MAX(val) FROM t GROUP BY grp");
            db.exec("SELECT id, val FROM t ORDER BY val DESC LIMIT 10");
            const q = since(t1);
            const size = scalar(db, "PRAGMA page_size") * scalar(db, "PRAGMA page_count");
            results.push({ n, mode, w: fmtMs(w), rate: fmtCompact(n / (w / 1000)), q: fmtMs(q), size: bytes(size) });
            paint();
            db.run("DROP TABLE t");
            return `寫 ${fmtMs(w)}・查 ${fmtMs(q)}`;
          } catch (e) {
            if (tx && ctx.active) db.exec("ROLLBACK");
            return `錯誤：${e.message}`;
          } finally {
            if (st && ctx.active) st.free();
          }
        },
        note: "每列約 40 bytes，最大 100 萬列約 40 MB（在 WASM 記憶體中）。查詢是 100 組 GROUP BY 加上 ORDER BY 取前 10 名，皆無索引。",
      });
    },
  },
] });
</script>
