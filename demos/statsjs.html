<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stats.js 示範：效能壓力測試台</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #meters { position: fixed; left: 12px; top: 12px; z-index: 40; display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 24px); padding: 10px; }
  .meter { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
  .meter > div { position: static !important; opacity: 1 !important; border-radius: 6px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.45); }
  .meter canvas { width: 120px !important; height: 72px !important; image-rendering: pixelated; }
  .meter span { font-size: 11px; color: var(--fg); padding-left: 2px; }
  #load { position: fixed; right: 12px; bottom: 12px; z-index: 40; width: 290px; display: grid; gap: 8px; }
  #load input { min-width: 0; width: 100%; }
  #load label { display: grid; grid-template-columns: 74px 1fr 52px; align-items: center; gap: 6px; font-size: 12px; }
  #load output { font: 12px var(--mono); color: var(--accent); text-align: right; }
  #load .btns { display: flex; gap: 6px; }
  @media (max-width: 560px) {
    .meter canvas { width: 80px !important; height: 48px !important; }
    #load { width: auto; left: 12px; bottom: 50px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="meters" class="panel"></div>
<div id="load" class="panel">
  <label>物件數量 <input id="count" type="range" min="0" max="6000" step="100" value="600"><output id="countOut">600</output></label>
  <label>CPU 負荷 <input id="cpu" type="range" min="0" max="40" step="1" value="0"><output id="cpuOut">0 ms</output></label>
  <div class="btns"><button class="btn primary" id="spike">記憶體尖峰</button><button class="btn" id="calm">恢復平穩</button></div>
</div>
<div class="hint">拉高負載看曲線變化・點面板可切換顯示項目</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js"
} }
</script>
<script type="module">
import * as THREE from "three";
import Stats from "https://cdn.jsdelivr.net/npm/stats.js@0.17.0/src/Stats.js";

// One Stats instance per built-in panel (0 FPS, 1 MS, 2 MB) so all are visible at once,
// plus a custom Stats.Panel that plots the live object count.
const meters = document.getElementById("meters");
const statsList = [];
const LABELS = ["每秒影格 FPS", "每影格耗時 MS", "JS 記憶體 MB", "自訂：物件數"];
for (let i = 0; i < 4; i++) {
  const s = new Stats();
  if (i === 3) {
    s.objPanel = s.addPanel(new Stats.Panel("物件", "#f7df1e", "#1a1a14"));
    s.showPanel(3);
  } else {
    s.showPanel(i);
  }
  const wrap = document.createElement("div");
  wrap.className = "meter";
  const label = document.createElement("span");
  label.textContent = LABELS[i];
  wrap.append(s.dom, label);
  meters.append(wrap);
  statsList.push(s);
}
const objStats = statsList[3];

// ---- Stress scene: many individual meshes = many draw calls ----
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(1);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1013);
scene.fog = new THREE.Fog(0x0e1013, 18, 42);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(0, 0, 26);
scene.add(new THREE.HemisphereLight(0xcfe8ff, 0x221a10, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(5, 8, 10);
scene.add(sun);

const COLORS = [0xf7df1e, 0x4cc9f0, 0xf72585, 0x7bd389, 0xff8c42, 0x9d8cff];
const geos = [new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.IcosahedronGeometry(0.45, 0), new THREE.TorusGeometry(0.35, 0.14, 8, 20)];
const mats = COLORS.map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.4, metalness: 0.1 }));
const group = new THREE.Group();
scene.add(group);

function setCount(n) {
  while (group.children.length > n) group.remove(group.children[group.children.length - 1]);
  while (group.children.length < n) {
    const m = new THREE.Mesh(geos[group.children.length % 3], mats[(Math.random() * mats.length) | 0]);
    const r = 4 + Math.random() * 12, a = Math.random() * Math.PI * 2, y = (Math.random() - 0.5) * 16;
    m.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
    m.rotation.set(Math.random() * 6, Math.random() * 6, 0);
    m.userData.spin = 0.5 + Math.random() * 2;
    group.add(m);
  }
}

// ---- Controls ----
const countEl = document.getElementById("count");
const cpuEl = document.getElementById("cpu");
countEl.addEventListener("input", () => { setCount(+countEl.value); document.getElementById("countOut").textContent = countEl.value; });
cpuEl.addEventListener("input", () => { document.getElementById("cpuOut").textContent = cpuEl.value + " ms"; });
let garbage = [];
document.getElementById("spike").addEventListener("click", () => {
  // Allocate ~80 MB of typed arrays so the MB panel visibly jumps
  for (let i = 0; i < 20; i++) garbage.push(new Float64Array(500000).fill(i));
});
document.getElementById("calm").addEventListener("click", () => {
  garbage = [];
  countEl.value = 300; cpuEl.value = 0;
  countEl.dispatchEvent(new Event("input"));
  cpuEl.dispatchEvent(new Event("input"));
});
setCount(600);

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const clock = new THREE.Clock();
let lastObj = 0;
function loop() {
  for (const s of statsList) s.begin();
  const dt = clock.getDelta();
  group.rotation.y += dt * 0.15;
  for (const m of group.children) { m.rotation.x += dt * m.userData.spin; m.rotation.y += dt * 0.7; }
  // Busy-wait to simulate heavy per-frame JavaScript work
  const busy = +cpuEl.value;
  if (busy) { const until = performance.now() + busy; while (performance.now() < until); }
  renderer.render(scene, camera);
  for (const s of statsList) s.end();
  const now = performance.now();
  if (now - lastObj > 250) { objStats.objPanel.update(group.children.length, 6000); lastObj = now; }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
