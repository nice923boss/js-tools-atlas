<style>

<script src="https://cdn.jsdelivr.net/npm/@strudel/web@1.3.0/dist/index.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Wrapped in an IIFE so page-level names never shadow the globals Strudel installs (n, s, note, run, ...).
(() => {
const { fmt, fmtMs, fmtCompact } = Showcase;
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "sans-serif";
const MONO = rootCss.getPropertyValue("--mono").trim() || "monospace";

// ---------- audio lifecycle ----------
let repl = null, audioUsed = false, audioReady = null;
const boot = initStrudel().then((r) => (repl = r));
async function startAudio() { await boot; audioReady = audioReady || initAudio(); await audioReady; await getAudioContext().resume(); audioUsed = true; }
// stop() halts the scheduler; resetGlobalEffects() drops the shared reverb/delay buses so tails go silent too.
function hushAll() { if (repl) { repl.stop(); resetGlobalEffects(); } }

// Play/stop button bound to one scene. patFn returns the pattern to play (or null on error).
function transport(ctx, patFn, onChange) {
  const st = { playing: false };
  let busy = false, again = false;
  const btn = ctx.button("▶ 播放", async () => {
    if (st.playing) { st.stop(); return; }
    btn.disabled = true;
    try {
      await startAudio();
      if (!ctx.active) return;
      const pat = await patFn();
      if (!pat || !ctx.active) return;
      repl.setPattern(pat, true);
      st.playing = true; btn.textContent = "■ 停止";
      onChange && onChange(true);
    } finally { btn.disabled = false; }
  }, { primary: true });
  st.stop = () => { hushAll(); st.playing = false; btn.textContent = "▶ 播放"; onChange && onChange(false); };
  st.now = () => (st.playing && repl ? Math.max(0, repl.scheduler.now()) : 0);
  // Swap the running pattern without restarting the clock; coalesces bursts of slider events.
  st.refresh = async () => {
    if (!st.playing) return;
    if (busy) { again = true; return; }
    busy = true;
    try {
      do { again = false; const pat = await patFn(); if (pat && st.playing && ctx.active) repl.setPattern(pat, false); } while (again);
    } finally { busy = false; }
  };
  ctx.onCleanup(() => { hushAll(); if (audioUsed) getAudioContext().suspend(); });
  return st;
}

// ---------- shared helpers ----------
function fitCanvas(cv) {
  const dpr = Math.min(2, devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  return { g, W, H };
}
const esc = (str) => str.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const onsets = (pat, a, b) => pat.queryArc(a, b).filter((hp) => hp.hasOnset());
function midiOf(v) {
  if (!v || typeof v !== "object" || v.note === undefined) return null;
  return typeof v.note === "number" ? v.note : strudel.noteToMidi(v.note);
}
const hue = (m) => `hsl(${(((m % 12) + 12) % 12) * 30}, 78%, 64%)`;
const PC = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const midiName = (m) => PC[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1);
function locRanges(hp) { return (hp.context?.locations || []).map((l) => (Array.isArray(l) ? l : [l.start, l.end])); }
function activeRanges(pat, now) {
  return pat.queryArc(now, now + 1e-4).filter((hp) => hp.whole && hp.whole.begin.valueOf() <= now).flatMap(locRanges);
}
// Escaped HTML with optional per-character token classes and <mark> over the given [start, end) ranges.
function markup(code, ranges, cls) {
  const on = new Uint8Array(code.length);
  for (const [a, b] of ranges) for (let i = a; i < b && i < code.length; i++) on[i] = 1;
  let out = "", i = 0;
  while (i < code.length) {
    let j = i;
    while (j < code.length && on[j] === on[i] && (!cls || cls[j] === cls[i])) j++;
    let piece = esc(code.slice(i, j));
    if (cls && cls[i]) piece = `<span class="${cls[i]}">${piece}</span>`;
    if (on[i]) piece = `<mark>${piece}</mark>`;
    out += piece; i = j;
  }
  return out;
}
function tokenClasses(code) {
  const cls = new Array(code.length).fill("");
  const re = /(\/\/[^\n]*)|("[^"\n]*"|'[^'\n]*')|(\b\d+(?:\.\d+)?\b|\.\d+\b)|([A-Za-z_]\w*)(?=\()/g;
  let m;
  while ((m = re.exec(code))) {
    const c = m[1] ? "t-com" : m[2] ? "t-str" : m[3] ? "t-num" : "t-fn";
    for (let i = m.index; i < m.index + m[0].length; i++) cls[i] = c;
  }
  return cls;
}
function playhead(g, x, y0, y1) {
  g.strokeStyle = "#f72585"; g.lineWidth = 2;
  g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
  g.lineWidth = 1;
}

// ---------- scene 1: live coding (ported from the original page) ----------
const PRESETS = {
  "鼓組律動": `// 合成鼓組：大鼓、雜訊小鼓、腳踏鈸
stack(
  s("sbd*4").decay(.35),
  s("~ pink ~ pink").decay(.12).gain(.45),
  s("white*8").decay(.03).gain("[.22 .1]*4")
)`,
  "歐幾里得": `// (3,8) 代表 8 格平均放 3 下
stack(
  s("sbd(3,8)").decay(.3),
  note("<c2 c2 eb2 f2>(5,8,2)")
    .s("square").lpf(700).decay(.18).sustain(0),
  note("<g4 bb4 c5 eb5>(3,8,1)")
    .s("triangle").decay(.2).sustain(0).gain(.5)
)`,
  "和弦進行": `// 每個循環換一個和弦，加上低音與琶音
stack(
  note("<[c3,eb3,g3,bb3] [ab2,c3,eb3,g3] [f2,ab2,c3,eb3] [g2,b2,d3,f3]>")
    .s("sawtooth").lpf(900).attack(.05).release(.5).gain(.35),
  note("<c2 ab1 f1 g1>*2").s("triangle").gain(.7),
  s("sbd ~ sbd ~").decay(.3)
)`,
  "音階琶音": `// 音階編號 + 濾波器隨正弦波掃動
n("0 2 4 6 7 6 4 2")
  .scale("<C4:major A3:minor F3:lydian G3:mixolydian>")
  .s("supersaw").lpf(sine.range(500, 2600).slow(4))
  .decay(.15).sustain(.2).gain(.4)`,
};
const SOUND_COLORS = { sbd: "#ff8c42", pink: "#f72585", white: "#4cc9f0", square: "#7bd389", triangle: "#9d8cff", sawtooth: "#f7df1e", supersaw: "#4cc9f0", sine: "#7bd389" };
const colorOf = (v) => SOUND_COLORS[v.s || "sine"] || "#ecebe6";
function laneOf(v) {
  const m = midiOf(v);
  if (m != null) return { key: `n${m}`, order: m, label: String(v.note) };
  const snd = v.s || "sine";
  return { key: `s${snd}`, order: -100 + ["sbd", "pink", "white", "brown"].indexOf(snd), label: snd };
}
function buildLanes(pat) {
  const seen = new Map();
  pat.queryArc(0, 8).forEach((hp) => { const l = laneOf(hp.value); if (!seen.has(l.key)) seen.set(l.key, l); });
  return [...seen.values()].sort((a, b) => b.order - a.order);
}
function drawRoll(cv, pat, lanes, now, playing) {
  const { g, W, H } = fitCanvas(cv);
  if (!pat || !lanes.length) return;
  const top = 32, bottom = 20, left = 6, WIN = 2;
  const playX = W * 0.22, pxc = (W - playX) / (WIN - 0.25), t0 = now - playX / pxc;
  const laneH = Math.min(26, (H - top - bottom) / lanes.length);
  const y0 = top + (H - top - bottom - laneH * lanes.length) / 2, y1 = y0 + laneH * lanes.length;
  const idx = new Map(lanes.map((l, i) => [l.key, i]));
  g.font = `11px ${MONO}`;
  for (let c = Math.floor(t0); c <= t0 + WIN + 1; c += 0.25) {
    const x = left + (c - t0) * pxc, whole = Math.abs(c - Math.round(c)) < 1e-6;
    g.strokeStyle = whole ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.05)";
    g.beginPath(); g.moveTo(x, y0 - 6); g.lineTo(x, y1 + 4); g.stroke();
    if (whole && c >= 0) { g.fillStyle = "rgba(255,255,255,0.4)"; g.fillText(String(Math.round(c)), x + 3, H - 6); }
  }
  for (const hp of onsets(pat, Math.max(0, t0), t0 + WIN + 0.5)) {
    const i = idx.get(laneOf(hp.value).key);
    if (i === undefined) continue;
    const b = hp.whole.begin.valueOf(), e = hp.whole.end.valueOf();
    const x = left + (b - t0) * pxc, w = Math.max(3, (e - b) * pxc - 2), y = y0 + i * laneH + 2, hh = laneH - 4;
    const active = playing && now >= b && now < e;
    g.globalAlpha = b + 1e-6 < now && !active ? 0.35 : 1;
    g.fillStyle = colorOf(hp.value);
    if (active) { g.shadowColor = g.fillStyle; g.shadowBlur = 14; }
    g.beginPath(); g.roundRect(x, y, w, Math.max(1, hh), Math.min(4, hh / 2)); g.fill();
    g.shadowBlur = 0;
  }
  g.globalAlpha = 1;
  g.font = `10px ${MONO}`;
  lanes.forEach((l, i) => {
    if (laneH < 11 && i % 2) return;
    g.fillStyle = "rgba(236,235,230,0.45)";
    g.fillText(l.label, W - g.measureText(l.label).width - 6, y0 + i * laneH + laneH / 2 + 3.5);
  });
  playhead(g, left + playX, y0 - 10, y1 + 6);
}

// ---------- scene 2: mini-notation ----------
const MINI = [
  ["c e g b", "空白分隔，一循環四拍"], ["c [e g] ~ b", "[ ] 細分一拍，~ 是休止"],
  ["c e*2 g b*3", "*n 在一格內重複 n 次"], ["<c e g> b", "< > 每個循環輪流取一個"],
  ["c@3 e", "@3 讓 c 佔四分之三"], ["c e? g? b", "? 有一半機率略過"],
  ["[c,e,g] [d,f,a]", "逗號同時發聲成和弦"], ["{c e g}%4", "三個音輪流填進四格"],
];
function drawMini(r, now) {
  const { g, W, H } = fitCanvas(r.cv);
  const span = 2, t0 = now < 0 ? 0 : Math.floor(now / span) * span, pxc = W / span;
  const nl = r.pitches.length, lh = (H - 6) / nl;
  for (let q = 0; q <= span * 4; q++) {
    g.fillStyle = q % 4 ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.22)";
    g.fillRect(Math.round((q / 4) * pxc), 0, 1, H);
  }
  g.font = `10px ${MONO}`; g.fillStyle = "rgba(236,235,230,0.4)";
  for (let c = 0; c < span; c++) g.fillText(String(t0 + c), c * pxc + 4, 11);
  for (const hp of onsets(r.pat, t0, t0 + span)) {
    const m = midiOf(hp.value), b = hp.whole.begin.valueOf(), e = hp.whole.end.valueOf();
    const li = r.pitches.indexOf(m), x = (b - t0) * pxc, w = Math.max(3, (e - b) * pxc - 3);
    const active = now >= b && now < e;
    g.globalAlpha = now >= 0 && e <= now ? 0.35 : 1;
    g.fillStyle = hue(m);
    if (active) { g.shadowColor = g.fillStyle; g.shadowBlur = 12; }
    g.beginPath(); g.roundRect(x + 2, 3 + li * lh + 1, w, Math.max(2, lh - 2), Math.min(3, lh / 2)); g.fill();
    g.shadowBlur = 0;
  }
  g.globalAlpha = 1;
  if (now >= 0) playhead(g, (now - t0) * pxc, 0, H);
}

// ---------- scene 4: scales and chords ----------
const SCALES = [["major", "大調"], ["minor", "自然小調"], ["major:pentatonic", "大調五聲"], ["minor:pentatonic", "小調五聲"],
  ["blues", "藍調"], ["dorian", "多利安"], ["lydian", "利地安"], ["hirajoshi", "日本平調子"]];
const PROGS = [
  { label: "C G Am F（流行）", chords: "C G Am F", bass: "c2 g2 a2 f2" },
  { label: "Dm7 G7 C^7 A7（爵士）", chords: "Dm7 G7 C^7 A7", bass: "d2 g2 c2 a2" },
  { label: "Am F C G（抒情）", chords: "Am F C G", bass: "a2 f2 c2 g2" },
  { label: "C Am Dm G（五〇年代）", chords: "C Am Dm G", bass: "c2 a2 d2 g2" },
];
const LAYER_COLORS = { gold: "#f7df1e", deepskyblue: "#4cc9f0", lime: "#7bd389" };
const KLO = 36, KHI = 89;
const isBlack = (m) => [1, 3, 6, 8, 10].includes(m % 12);
function keyGeom(W) {
  const whites = [];
  for (let m = KLO; m <= KHI; m++) if (!isBlack(m)) whites.push(m);
  const ww = W / whites.length, geo = {};
  whites.forEach((m, i) => (geo[m] = { x: i * ww, w: ww, black: false }));
  for (let m = KLO; m <= KHI; m++) if (isBlack(m)) geo[m] = { x: geo[m - 1].x + ww * 0.66, w: ww * 0.68, black: true };
  return { geo, ww };
}
function drawFall(cv, pat, now, playing, pcs) {
  const { g, W, H } = fitCanvas(cv);
  const kbH = Math.max(34, Math.min(74, H * 0.26)), top = 4, kbY = H - kbH, span = 2, pxc = (kbY - top) / span;
  const { geo, ww } = keyGeom(W);
  for (let c = Math.ceil(now * 4) / 4; c <= now + span; c += 0.25) {
    const y = kbY - (c - now) * pxc, whole = Math.abs(c - Math.round(c)) < 1e-6;
    g.fillStyle = whole ? "rgba(255,255,255,0.16)" : "rgba(255,255,255,0.05)";
    g.fillRect(0, Math.round(y), W, 1);
  }
  const lit = new Map();
  for (const hp of onsets(pat, Math.max(0, now - 1), now + span)) {
    const m = midiOf(hp.value), k = geo[m];
    const b = hp.whole.begin.valueOf(), e = hp.whole.end.valueOf();
    if (!k || e <= now) continue;
    const col = LAYER_COLORS[hp.value.color] || "#ecebe6";
    if (playing && b <= now) lit.set(m, col);
    const yb = Math.min(kbY, kbY - (b - now) * pxc), ye = Math.max(top, kbY - (e - now) * pxc);
    if (yb <= top) continue;
    g.fillStyle = col; g.globalAlpha = 0.9;
    g.beginPath(); g.roundRect(k.x + 1, ye + 1, Math.max(2, k.w - 2), Math.max(2, yb - ye - 2), 3); g.fill();
  }
  g.globalAlpha = 1;
  const keyDot = (k, m, y, dark) => {
    if (!pcs.has(m % 12)) return;
    g.fillStyle = dark ? "#c99a00" : "#f7df1e";
    g.beginPath(); g.arc(k.x + k.w / 2, y, Math.max(1.5, Math.min(3, k.w / 4)), 0, 7); g.fill();
  };
  g.font = `9px ${MONO}`;
  for (let m = KLO; m <= KHI; m++) {
    const k = geo[m];
    if (k.black) continue;
    g.fillStyle = lit.get(m) || "#e9e7e0";
    g.fillRect(k.x + 0.5, kbY, k.w - 1, kbH);
    keyDot(k, m, kbY + kbH - 8, true);
    if (m % 12 === 0 && ww > 12) { g.fillStyle = "#555"; g.fillText(midiName(m), k.x + 2, kbY + kbH - 15); }
  }
  for (let m = KLO; m <= KHI; m++) {
    const k = geo[m];
    if (!k.black) continue;
    g.fillStyle = lit.get(m) || "#1d2026";
    g.fillRect(k.x, kbY, k.w, kbH * 0.6);
    keyDot(k, m, kbY + kbH * 0.6 - 6, false);
  }
  g.fillStyle = "rgba(247,37,133,0.9)"; g.fillRect(0, kbY - 1, W, 2);
}

// ---------- scene 6: transforms ----------
const TF = [
  ["fast(2)", "速度加倍", (p) => p.fast(2)],
  ["slow(2)", "速度減半", (p) => p.slow(2)],
  ["rev()", "每個循環倒著放", (p) => p.rev()],
  ["every(2, fast(2))", "每兩個循環套一次 fast(2)", (p) => p.every(2, fast(2))],
  ["iter(4)", "每循環起點往後移一格", (p) => p.iter(4)],
  ["palindrome()", "正放與倒放交替", (p) => p.palindrome()],
  ["ply(2)", "每個音重複兩次", (p) => p.ply(2)],
  ["off(1/8, add(n(4)))", "延後八分之一循環，疊一層高五度", (p) => p.off(1 / 8, add(n(4)))],
  ["jux(rev)", "左聲道原樣、右聲道倒放", (p) => p.jux(rev)],
  ["sometimes(add(n(7)))", "約一半的音升高八度", (p) => p.sometimes(add(n(7)))],
  ["degradeBy(.5)", "隨機丟掉一半的音", (p) => p.degradeBy(0.5)],
  ["chunk(4, add(n(7)))", "每循環輪流把一段升高八度", (p) => p.chunk(4, add(n(7)))],
  ["euclid(3, 8)", "套上 (3,8) 歐幾里得節奏", (p) => p.euclid(3, 8)],
  ["superimpose(add(n(2)))", "疊一層高三度的副本", (p) => p.superimpose(add(n(2)))],
  ["linger(.25)", "只重複第一個四分之一", (p) => p.linger(0.25)],
  ["press()", "每個音延後半格，變成切分", (p) => p.press()],
];
function drawStrips(cv, pats, labels, now, playing) {
  const { g, W, H } = fitCanvas(cv);
  const span = 4, pad = 8, gap = 10, sh = (H - pad * 2 - gap) / 2, pxc = (W - 16) / span;
  const all = pats.map((p) => onsets(p, 0, span));
  const ms = all.flat().map((hp) => midiOf(hp.value));
  const lo = Math.min(...ms), hi = Math.max(...ms), rng = Math.max(1, hi - lo + 1);
  all.forEach((haps, si) => {
    const y0 = pad + si * (sh + gap), lh = (sh - 22) / rng;
    g.fillStyle = "rgba(255,255,255,0.03)"; g.fillRect(8, y0, W - 16, sh);
    for (let q = 0; q <= span * 4; q++) {
      g.fillStyle = q % 4 ? "rgba(255,255,255,0.05)" : "rgba(255,255,255,0.2)";
      g.fillRect(Math.round(8 + (q / 4) * pxc), y0 + 18, 1, sh - 18);
    }
    g.font = `12px ${FONT}`; g.fillStyle = "rgba(236,235,230,0.75)";
    g.fillText(labels[si], 14, y0 + 13);
    for (const hp of haps) {
      const m = midiOf(hp.value), b = hp.whole.begin.valueOf(), e = hp.whole.end.valueOf();
      const x = 8 + b * pxc, w = Math.max(3, (e - b) * pxc - 2), y = y0 + 20 + (hi - m) * lh, hh = Math.max(2, lh - 2);
      const cyc = playing ? now % span : -1, active = cyc >= b && cyc < e;
      g.fillStyle = g.strokeStyle = hue(m);
      if (active) { g.shadowColor = g.fillStyle; g.shadowBlur = 12; }
      g.beginPath(); g.roundRect(x + 1, y, w, hh, 3);
      if (hp.value.pan > 0.5) { g.lineWidth = 1.5; g.stroke(); g.lineWidth = 1; } else g.fill();
      g.shadowBlur = 0;
    }
    if (playing) playhead(g, 8 + (now % span) * pxc, y0 + 16, y0 + sh);
  });
}

// ---------- scene 7: stress layers ----------
const STRESS_SCALES = ["C3:minor", "D3:dorian", "F3:lydian", "G3:mixolydian"];
function stressLayer(i, fx) {
  let p = n(`0 <2 4> [3 5]*2 ${i % 7}(3,8)`).scale(STRESS_SCALES[i % 4]).fast(1 + (i % 4));
  if (fx) p = p.off(1 / 8, add(n(7))).lpf(sine.range(300, 3000).slow(4)).pan((i / 64) % 1);
  return p.s("triangle");
}

      let curPat = null;
      const codeEl = ctx.$("[data-code]"), osc = ctx.$("[data-osc]"), spec = ctx.$("[data-spec]"), info = ctx.$("[data-info]");
      const ot = ctx.$("[data-ot]"), sTag = ctx.$("[data-st]");
      const build = async () => { const p = await repl.evaluate(code(), false); if (p) curPat = p; return p; };
      const upd = () => { codeEl.textContent = code(); tp.playing ? tp.refresh() : build(); };
      const tp = transport(ctx, build);
      ctx.select("波形", WAVES.map(([v, l]) => ({ value: v, label: l })), st.wave, (v) => { st.wave = v; upd(); });
      ctx.slider("lpf", { min: 0, max: 1, step: 0.01, value: st.lpfV, format: (v) => `${Math.round(120 * Math.pow(100, v))} Hz` }, (v) => { st.lpfV = v; upd(); });
      ctx.toggle("掃頻", st.sweep, (v) => { st.sweep = v; upd(); });
      ctx.slider("room", { min: 0, max: 1, step: 0.1, value: st.room, format: (v) => v.toFixed(1) }, (v) => { st.room = v; upd(); });
      ctx.slider("delay", { min: 0, max: 0.8, step: 0.1, value: st.delay, format: (v) => v.toFixed(1) }, (v) => { st.delay = v; upd(); });
      ctx.slider("crush", { min: 2, max: 16, step: 1, value: st.crush, format: (v) => (v >= 16 ? "關" : `${v} bit`) }, (v) => { st.crush = v; upd(); });
      ctx.select("vowel", [["", "關"], ["a", "a"], ["e", "e"], ["i", "i"], ["o", "o"], ["u", "u"]].map(([v, l]) => ({ value: v, label: l })), "", (v) => { st.vowel = v; upd(); });
      codeEl.textContent = code();
      await build();
      // Biquad magnitude response, same lowpass + Q that superdough builds for .lpf().lpq().
      const oac = new OfflineAudioContext(1, 128, 44100), bq = oac.createBiquadFilter();
      bq.type = "lowpass"; bq.Q.value = 4;
      const NF = 180, FR = new Float32Array(NF).map((_, i) => 30 * Math.pow(16000 / 30, i / (NF - 1)));
      const mag = new Float32Array(NF), phs = new Float32Array(NF);
      let td = null, fd = null;
      const shape = (t) => {
        const p = t - Math.floor(t);
        if (st.wave === "square") return p < 0.5 ? 0.8 : -0.8;
        if (st.wave === "triangle") return 0.8 * (1 - 4 * Math.abs(p - 0.5));
        if (st.wave === "sine") return 0.8 * Math.sin(p * Math.PI * 2);
        if (st.wave === "supersaw") { let v = 0; for (let k = -2; k <= 2; k++) { const q = t * (1 + k * 0.012) + k * 0.21; v += 2 * (q - Math.floor(q)) - 1; } return v / 4; }
        return 0.8 * (2 * p - 1);
      };
      ctx.raf(() => {
        const now = tp.now();
        const hp = curPat && curPat.queryArc(now, now + 1e-4)[0];
        const fc = (hp && hp.value.cutoff) || cutoff();
        let peak = 0;
        let o = fitCanvas(osc), g = o.g;
        g.fillStyle = "rgba(255,255,255,0.12)"; g.fillRect(0, o.H / 2, o.W, 1);
        g.strokeStyle = "#4cc9f0"; g.lineWidth = 1.6; g.beginPath();
        if (tp.playing) {
          const an = getAnalyserById(1, 2048);
          if (!td || td.length !== an.fftSize) { td = new Float32Array(an.fftSize); fd = new Float32Array(an.frequencyBinCount); }
          an.getFloatTimeDomainData(td); an.getFloatFrequencyData(fd);
          let z = 0;
          for (let i = 1; i < td.length / 2; i++) if (td[i - 1] < 0 && td[i] >= 0) { z = i; break; }
          const len = Math.min(td.length - z, 1024);
          for (let i = 0; i < len; i++) { const v = td[z + i]; peak = Math.max(peak, Math.abs(v)); g[i ? "lineTo" : "moveTo"]((i / (len - 1)) * o.W, o.H / 2 - v * o.H * 0.45); }
          ot.textContent = "示波器（即時輸出）";
        } else {
          for (let i = 0; i <= 300; i++) g[i ? "lineTo" : "moveTo"]((i / 300) * o.W, o.H / 2 - shape((i / 300) * 2.5) * o.H * 0.4);
          ot.textContent = "示波器（理論波形，播放後顯示實際輸出）";
        }
        g.stroke(); g.lineWidth = 1;
        o = fitCanvas(spec); g = o.g;
        const lx = (f) => (Math.log(f / 30) / Math.log(16000 / 30)) * o.W;
        g.font = `10px ${MONO}`;
        for (const f of [100, 1000, 10000]) { g.fillStyle = "rgba(255,255,255,0.1)"; g.fillRect(lx(f), 0, 1, o.H); g.fillStyle = "rgba(236,235,230,0.45)"; g.fillText(f >= 1000 ? `${f / 1000}k` : String(f), lx(f) + 3, o.H - 5); }
        if (tp.playing && fd) {
          const sr = getAudioContext().sampleRate, bin = sr / (fd.length * 2);
          g.beginPath(); g.moveTo(0, o.H);
          for (let i = 1; i < fd.length; i++) { const f = i * bin; if (f < 30 || f > 16000) continue; g.lineTo(lx(f), o.H - Math.max(0, Math.min(1, (fd[i] + 100) / 90)) * o.H); }
          g.lineTo(o.W, o.H); g.closePath(); g.fillStyle = "rgba(76,201,240,0.35)"; g.fill();
          sTag.textContent = "頻譜（即時）與濾波器響應";
        } else {
          g.font = `13px ${FONT}`; g.fillStyle = "rgba(236,235,230,0.5)"; g.textAlign = "center";
          g.fillText("按播放顯示即時頻譜", o.W / 2, o.H * 0.62); g.textAlign = "left";
          sTag.textContent = "濾波器響應（lpf 截止頻率 + lpq 4）";
        }
        bq.frequency.value = fc; bq.getFrequencyResponse(FR, mag, phs);
        g.strokeStyle = "#f7df1e"; g.lineWidth = 2; g.beginPath();
        for (let i = 0; i < NF; i++) { const db = 20 * Math.log10(Math.max(1e-6, mag[i])); g[i ? "lineTo" : "moveTo"](lx(FR[i]), o.H * 0.18 + ((12 - db) / 60) * o.H * 0.7); }
        g.stroke(); g.lineWidth = 1;
        g.fillStyle = "#f7df1e"; g.fillRect(lx(fc) - 0.5, 0, 1, o.H);
        info.innerHTML = `波形 <b>${WAVES.find((w) => w[0] === st.wave)[1]}</b>・截止頻率 <span class="m">${Math.round(fc)}</span> Hz` +
          (tp.playing ? `・輸出峰值 <span class="m">${peak.toFixed(2)}</span>` : "・尚未播放");
      });
    },
  },
  {
    id: "transform", title: "變形函式",
    api: ".fast()・.rev()・.every()・.iter()・.off()・.jux()・.chunk()・.euclid()・.sometimes()",
    desc: "對同一個四音樂句套用 16 種變形函式，上下對照原始與變形後的前四個循環，看時間、順序、疊層與機率如何被改寫。jux 的右聲道畫成空心框。",
    hint: "從選單換變形函式，播放中立即切換",
    async mount(ctx) {
      ctx.html(`<div class="board"><div class="sd-col"><div class="sd-code" data-code></div>
        <div class="sd-panel sd-grow"><canvas></canvas></div><div class="sd-info" data-info></div></div></div>`);
      await boot;
      let ti = 3;
      const cv = ctx.$("canvas"), codeEl = ctx.$("[data-code]"), info = ctx.$("[data-info]");
      const base = () => n("0 1 2 3").scale("C4:major");
      let pats = [];
      function rebuild() {
        const [c, d, fn] = TF[ti];
        pats = [base(), fn(n("0 1 2 3")).scale("C4:major")];
        codeEl.textContent = `n("0 1 2 3").${c}.scale("C4:major").s("triangle")`;
        const a = onsets(pats[0], 0, 4).length, b = onsets(pats[1], 0, 4).length;
        info.innerHTML = `<b>${esc(c)}</b>：${d}・前 4 個循環：原始 <span class="m">${a}</span> 個音，變形後 <span class="m">${b}</span> 個音`;
      }
      const tp = transport(ctx, () => pats[1].s("triangle").decay(0.2).sustain(0.3).gain(0.5));
      ctx.select("變形", TF.map(([c], i) => ({ value: i, label: c })), ti, (v) => { ti = +v; rebuild(); tp.refresh(); });
      rebuild();
      ctx.raf(() => drawStrips(cv, pats, ["原始 n(\"0 1 2 3\")", `變形後 .${TF[ti][0]}`], tp.now(), tp.playing));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "stack(...layers)・pattern.queryArc(0, 2)",
    desc: "逐級疊加 1 到 1024 層樂句，量 Strudel 建構 stack 並查出兩個循環所有事件的時間。即時倍率是兩個循環的音樂長度（4 秒）除以花費時間，低於 1 就跟不上播放。",
    hint: "按「開始測試」；切換「加上變形」比較 off、訊號參數與聲像的額外成本",
    async mount(ctx) {
      ctx.html(`<div class="sd-stress"><div class="sd-head"><b>事件分布：橫軸是兩個循環，縱軸是音高（只計算不發聲）</b><small data-sub>準備中…</small></div>
        <div class="sd-panel sd-grow"><canvas></canvas></div><div class="sd-info" data-mode></div></div>`);
      await boot;
      const MODES = ["每層：n(\"0 <2 4> [3 5]*2 k(3,8)\").scale(…).fast(1~4)",
        "每層再加 .off(1/8, add(n(7))).lpf(sine.range(300, 3000).slow(4)).pan(…)"];
      let fx = 0, last = null;
      const cv = ctx.$("canvas"), sub = ctx.$("[data-sub]"), modeEl = ctx.$("[data-mode]");
      modeEl.textContent = MODES[fx];
      function draw() {
        if (!last) return;
        const { g, W, H } = fitCanvas(cv);
        const ms = last.haps.map((hp) => midiOf(hp.value)).filter((m) => m != null);
        const lo = Math.min(...ms) - 1, hi = Math.max(...ms) + 1, step = Math.max(1, Math.ceil(last.haps.length / 40000));
        g.fillStyle = "rgba(255,255,255,0.15)"; g.fillRect(W / 2, 0, 1, H);
        g.globalCompositeOperation = "lighter"; g.globalAlpha = Math.max(0.08, Math.min(0.9, 12 / Math.sqrt(last.haps.length)));
        for (let i = 0; i < last.haps.length; i += step) {
          const hp = last.haps[i], m = midiOf(hp.value), b = hp.whole.begin.valueOf(), e = hp.whole.end.valueOf();
          g.fillStyle = hue(m);
          g.fillRect((b / 2) * W, H - ((m - lo) / (hi - lo)) * H - 2, Math.max(2, ((e - b) / 2) * W - 1), 3);
        }
        g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
      }
      function measure(N) {
        const t0 = performance.now();
        const pat = stack(...Array.from({ length: N }, (_, i) => stressLayer(i, fx)));
        const t1 = performance.now();
        const haps = pat.queryArc(0, 2).filter((hp) => hp.hasOnset());
        const t2 = performance.now();
        last = { haps };
        sub.innerHTML = `<span class="m">${fmt(N)}</span> 層・<span class="m">${fmtCompact(haps.length)}</span> 個事件・建構 <span class="m">${fmtMs(t1 - t0)}</span>・` +
          `查詢 <span class="m">${fmtMs(t2 - t1)}</span>・即時倍率 <span class="m">${fmt(4000 / Math.max(0.01, t2 - t0), 1)}</span>×`;
        ctx.timeout(draw, 0);
        return `${fmtCompact(haps.length)} 事件・即時 ${fmt(4000 / Math.max(0.01, t2 - t0), 1)}×`;
      }
      ctx.onResize(draw);
      ctx.controls.classList.add("bottom");
      ctx.group(["只有音符", "加上變形"], fx, (i) => { fx = i; modeEl.textContent = MODES[fx]; measure(16); });
      ctx.bench({
        label: "疊加層數", unit: "層", sizes: [1, 4, 16, 64, 256, 1024], format: fmt,
        run: (N) => measure(N),
        note: "只量模式建構與事件查詢（純 JavaScript），不經過 Web Audio。實際播放時排程器會分小段反覆查詢，但每個事件還要建立振盪器、包絡與效果節點，通常是音訊執行緒先到極限。",
      });
      measure(16);
    },
  },
] });
})();
</script>
</body>
</html>
