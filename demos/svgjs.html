<script>
// SVG.js showcase: every scene builds real SVG nodes with the chainable API and animates them with runners on timelines.
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FG = css.getPropertyValue("--fg").trim() || "#ecebe6";
const MUTED = css.getPropertyValue("--muted").trim() || "#9b998f";
const LINE = "rgba(255,255,255,0.14)";
const fmt = Showcase.fmt;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// Redraw hook for an element's box size (window resize, control bar wrapping).
function watch(ctx, el, fn) {
  let raf = 0, lw = -1, lh = -1;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      if (!ctx.active) return;
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h || (w === lw && h === lh)) return;
      lw = w; lh = h;
      fn(w, h);
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); });
}
// A fresh SVG root that fills its container.
const paper = (el) => SVG().addTo(el).size("100%", "100%");
// Stop every runner on these elements and drop their timelines' queues.
function halt(list) { for (const el of list) el.timeline().terminate(); }

// ---------- scene 1: weather cards (ported from the original demo) ----------
function weatherKit(draw, track) {
  const W = 240, H = 200, CX = 120, CY = 80;
  function cloudShape(parent, x, y, s, color) {
    const g = parent.group();
    g.circle(46).center(0, 0);
    g.circle(34).center(-26, 10);
    g.circle(38).center(26, 8);
    g.rect(84, 22).radius(11).move(-42, 6);
    g.fill(color).transform({ translate: [x, y], scale: s });
    return parent.group().add(g);
  }
  function sun(parent, x, y, r) {
    const rays = track(parent.group());
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      rays.line(x + Math.cos(a) * (r + 8), y + Math.sin(a) * (r + 8), x + Math.cos(a) * (r + 18), y + Math.sin(a) * (r + 18))
        .stroke({ color: "#fff3b0", width: 5, linecap: "round" });
    }
    rays.animate({ duration: 12000 }).ease("-").rotate(360, x, y).loop();
    const core = track(parent.circle(r * 2).center(x, y).fill(draw.gradient("radial", (add) => { add.stop(0, "#fffbe0"); add.stop(0.6, "#ffe066"); add.stop(1, "#ffb627"); })));
    core.animate(1500).ease("<>").attr({ r: r * 1.1 }).loop(true, true);
  }
  const icons = {
    sunny(g) { sun(g, CX, CY, 30); },
    cloudy(g) {
      sun(g, CX + 26, CY - 16, 20);
      const c1 = track(cloudShape(g, CX - 8, CY + 8, 1.15, "#ffffff"));
      c1.animate(3200).ease("<>").translate(16, 0).loop(true, true);
      const c2 = track(cloudShape(g, CX + 40, CY + 26, 0.6, "#dbe9ff"));
      c2.animate(2600).ease("<>").translate(-12, 0).loop(true, true);
    },
    storm(g) {
      for (let i = 0; i < 7; i++) {
        const x = CX - 36 + i * 12;
        const drop = track(g.line(x, CY + 18, x - 4, CY + 30).stroke({ color: "#8fd3ff", width: 3, linecap: "round" }));
        drop.animate({ duration: 900, delay: (i * 137) % 900 }).ease("-").translate(-8, 46).attr({ opacity: 0 }).loop();
      }
      const bolt = track(g.polygon([[CX + 2, CY + 6], [CX - 14, CY + 36], [CX - 2, CY + 36], [CX - 10, CY + 62], [CX + 18, CY + 26], [CX + 5, CY + 26], [CX + 14, CY + 6]]).fill("#f7df1e").opacity(0));
      bolt.animate(160).attr({ opacity: 1 }).loop(true, true, 1700);
      cloudShape(g, CX, CY - 6, 1.25, "#b9bfd6");
    },
    snow(g) {
      cloudShape(g, CX, CY - 8, 1.2, "#f4f8ff");
      for (let i = 0; i < 8; i++) {
        const x = CX - 44 + i * 12.5, y = CY + 22;
        const f = track(g.group());
        for (let k = 0; k < 3; k++) f.line(x - 5, y, x + 5, y).stroke({ color: "#ffffff", width: 2, linecap: "round" }).rotate(k * 60, x, y);
        f.animate({ duration: 2600, delay: (i * 331) % 2600 }).ease("-").translate((i % 2 ? 1 : -1) * 8, 56).rotate(180).attr({ opacity: 0 }).loop();
      }
    },
    typhoon(g) {
      const sp = g.group();
      const arm = "M0,-34 C22,-34 34,-20 30,-4 C26,-18 14,-24 0,-20 Z";
      sp.circle(26).center(0, 0).fill("#e8f6ff");
      sp.path(arm).fill("#e8f6ff");
      sp.path(arm).fill("#e8f6ff").rotate(180, 0, 0);
      sp.circle(10).center(0, 0).fill("#2f8f9d");
      sp.transform({ translate: [CX, CY], scale: 1.45 });
      const inner = track(g.group().add(sp));
      inner.animate(1800).ease("-").rotate(-360, CX, CY).loop();
      for (let i = 0; i < 4; i++) {
        const y = CY - 30 + i * 22;
        const w = track(g.line(CX + 56, y, CX + 86, y).stroke({ color: "rgba(255,255,255,0.7)", width: 3, linecap: "round" }));
        w.animate({ duration: 1300, delay: i * 260 }).ease("-").translate(-150, 0).attr({ opacity: 0 }).loop();
      }
    },
    night(g) {
      const pts = [[CX - 60, CY - 30], [CX + 52, CY - 40], [CX + 70, CY + 10], [CX - 48, CY + 30], [CX + 20, CY + 46], [CX - 20, CY - 52]];
      pts.forEach(([x, y], i) => {
        const s = track(g.path("M0,-7 L2,-2 L7,0 L2,2 L0,7 L-2,2 L-7,0 L-2,-2 Z").fill("#fff7d6").center(x, y));
        s.animate({ duration: 900 + i * 170, delay: i * 210 }).ease("<>").attr({ opacity: 0.15 }).loop(true, true);
      });
      const moon = track(g.path("M18,-30 A34,34 0 1,0 30,22 A28,28 0 1,1 18,-30 Z").fill("#ffe9a8").transform({ translate: [CX - 4, CY + 2] }));
      moon.animate(2400).ease("<>").translate(0, -6).loop(true, true);
    },
  };
  return { W, H, CX, CY, icons };
}
const CARDS = [
  { city: "台北", cond: "晴時多雲", temp: "33°", grad: ["#ffc65c", "#ff7b54"], icon: "sunny" },
  { city: "台中", cond: "多雲", temp: "29°", grad: ["#7fc8f8", "#3f6fb5"], icon: "cloudy" },
  { city: "花蓮", cond: "午後雷陣雨", temp: "26°", grad: ["#5b5f97", "#23253a"], icon: "storm" },
  { city: "合歡山", cond: "降雪", temp: "-2°", grad: ["#8fbfef", "#4a74b8"], icon: "snow" },
  { city: "蘭嶼", cond: "颱風警報", temp: "27°", grad: ["#2f8f9d", "#123c52"], icon: "typhoon" },
  { city: "台南", cond: "晴朗夜空", temp: "27°", grad: ["#3a2f7a", "#100c2b"], icon: "night" },
];

// ---------- scene 2: chain builder steps (executed for real, one per click) ----------
const STEPS = [
`draw.rect(140, 90).move(20, 20).radius(16).fill("#f7df1e")`,
`draw.circle(84).center(240, 65)
  .fill("none").stroke({ color: "#4cc9f0", width: 6 })`,
`draw.ellipse(130, 64).center(390, 65).fill("#f72585").opacity(0.8)`,
`draw.polygon("0,-44 13,-14 46,-14 20,6 29,40 0,20 -29,40 -20,6 -46,-14 -13,-14")
  .center(80, 175).fill("#7bd389")`,
`draw.polyline("160,200 185,150 210,200 235,150 260,200 285,150")
  .fill("none").stroke({ color: "#ff8c42", width: 5, linejoin: "round" })`,
`draw.path("M330,200 C330,120 460,120 460,200")
  .fill("none").stroke({ color: "#9d8cff", width: 5, dasharray: "12 8" })`,
`draw.line(20, 262, 140, 262).stroke({ color: "#ecebe6", width: 3 })
  .marker("end", 4, 4, (m) => m.path("M0,0 L4,2 L0,4 Z").fill("#ecebe6"))`,
`draw.text((t) => { t.tspan("SVG").fill("#f7df1e"); t.tspan(".js").fill("#ecebe6") })
  .font({ size: 38, weight: 700 }).move(170, 238)`,
`const heart = draw.defs().symbol().viewbox(0, 0, 20, 20)
heart.path("M10,18 L2,9 A4.5,4.5 0 0 1 10,4 A4.5,4.5 0 0 1 18,9 Z").fill("#f72585")
for (const x of [340, 380, 420]) draw.use(heart).size(30, 30).move(x, 240)`,
`const wave = draw.path("M20,312 C120,282 200,342 300,312 S420,282 470,306")
  .fill("none").stroke({ color: "#9b998f", width: 1, dasharray: "3 5" })
draw.plain("沿著路徑排列的 textPath").path(wave)
  .font({ size: 15 }).fill("#ecebe6").attr("startOffset", 0)
  .animate({ duration: 2600, times: Infinity, swing: true }).attr({ startOffset: 190 })`,
`draw.children().filter((el) => el.type !== "defs")
  .each((el, i) => el.animate(380, i * 70).scale(1.12).loop(2, true))`,
];

// ---------- scene 5: morph targets, all resampled to 40 cubic segments ----------
const N = 40, TAU = Math.PI * 2;
const around = (fn) => Array.from({ length: N }, (_, i) => fn((i / N) * TAU, i));
function polyRing(verts, per) {
  const pts = [];
  verts.forEach((v, k) => {
    const w = verts[(k + 1) % verts.length];
    for (let j = 0; j < per; j++) pts.push([v[0] + ((w[0] - v[0]) * j) / per, v[1] + ((w[1] - v[1]) * j) / per]);
  });
  return pts;
}
function squareRing(s) {
  const pts = [], seg = (a, b, n) => { for (let j = 0; j < n; j++) pts.push([a[0] + ((b[0] - a[0]) * j) / n, a[1] + ((b[1] - a[1]) * j) / n]); };
  seg([0, -s], [s, -s], 5); seg([s, -s], [s, s], 10); seg([s, s], [-s, s], 10); seg([-s, s], [-s, -s], 10); seg([-s, -s], [0, -s], 5);
  return pts;
}
// Closed Catmull-Rom spline written as one M, N cubic C segments and Z; sharp points get zero tangents.
function toPath(pts, sharp) {
  const p = (i) => pts[(i + N) % N];
  const k = (i) => (sharp === true || sharp.includes((i + N) % N) ? 0 : 1 / 6);
  const f = (v) => v.toFixed(2);
  let d = `M${f(p(0)[0])},${f(p(0)[1])}`;
  for (let i = 0; i < N; i++) {
    const a = p(i - 1), b = p(i), c = p(i + 1), e = p(i + 2), kb = k(i), kc = k(i + 1);
    d += ` C${f(b[0] + (c[0] - a[0]) * kb)},${f(b[1] + (c[1] - a[1]) * kb)} ${f(c[0] - (e[0] - b[0]) * kc)},${f(c[1] - (e[1] - b[1]) * kc)} ${f(c[0])},${f(c[1])}`;
  }
  return d + " Z";
}
const SHAPES = [
  { name: "圓", color: C[1], d: toPath(around((a) => [100 * Math.sin(a), -100 * Math.cos(a)]), []) },
  { name: "心", color: C[2], d: toPath(around((u) => [6.4 * 16 * Math.sin(u) ** 3, 6.4 * (-(13 * Math.cos(u) - 5 * Math.cos(2 * u) - 2 * Math.cos(3 * u) - Math.cos(4 * u)) - 2.5)]), [0, 20]) },
  { name: "星", color: C[0], d: toPath(polyRing(Array.from({ length: 10 }, (_, k) => { const r = k % 2 ? 42 : 100, a = (k / 10) * TAU; return [r * Math.sin(a), -r * Math.cos(a)]; }), 4), true) },
  { name: "水滴", color: C[1], d: toPath(around((u) => [110 * Math.sin(u) * Math.sin(u / 2), -100 * Math.cos(u)]), [0]) },
  { name: "花", color: C[5], d: toPath(around((a) => { const r = 74 + 26 * Math.cos(6 * a); return [r * Math.sin(a), -r * Math.cos(a)]; }), []) },
  { name: "方", color: C[3], d: toPath(squareRing(85), true) },
];
const STAR10 = "0,-34 10,-11 33,-10 15,5 21,28 0,15 -21,28 -15,5 -33,-10 -10,-11";

Showcase.run({ scenes: [
  {
    id: "weather", title: "天氣卡片",
    api: 'el.animate(1500).ease("<>").attr({ r }).loop(true, true)',
    desc: "六張天氣卡片的圖示全部用 SVG.js 的圖形與 runner 組成：太陽光芒 rotate 無限迴圈、雲朵 translate 來回、雨滴與雪花錯開 delay、閃電用 loop 的 wait 參數間歇閃爍。每個會動的元素各有一條 timeline，可以一起暫停或變速。",
    hint: "滑過卡片浮起・點擊卡片播放漣漪",
    mount(ctx) {
      ctx.html(`<div class="stage"></div>`);
      const stage = ctx.$(".stage"), draw = paper(stage);
      let animated = [], paused = false, speed = 1;
      const kit = weatherKit(draw, (el) => { animated.push(el); return el; });
      const { W, H, CX, CY } = kit;
      const apply = () => {
        for (const el of animated) {
          const tl = el.timeline();
          tl.speed(speed);
          if (paused) tl.pause(); else tl.play();
        }
      };
      const card = (spec, x, y, s) => {
        const outer = draw.group().transform({ translate: [x, y], scale: s, origin: [0, 0] });
        const inner = outer.group().addClass("wcard");
        const grad = draw.gradient("linear", (add) => { add.stop(0, spec.grad[0]); add.stop(1, spec.grad[1]); }).from(0, 0).to(0.4, 1);
        inner.rect(W, H).radius(18).fill(grad).stroke({ color: "rgba(255,255,255,0.18)", width: 1 }).addClass("wcard-bg");
        const iconLayer = inner.group();
        // Keep falling particles inside the card
        iconLayer.clipWith(draw.clip().add(draw.rect(W, H).radius(18)));
        kit.icons[spec.icon](iconLayer);
        inner.plain(spec.city).font({ size: 19, weight: 700 }).fill("#ffffff").attr({ x: 18, y: 166 });
        inner.plain(spec.cond).font({ size: 12 }).fill("rgba(255,255,255,0.78)").attr({ x: 18, y: 185 });
        inner.plain(spec.temp).font({ size: 34, weight: 700 }).fill("#ffffff").attr({ x: W - 18, y: 182, "text-anchor": "end" });
        inner.on("mouseenter", () => inner.animate(260, 0, "now").ease(">").transform({ scale: 1.05, origin: [W / 2, H / 2] }));
        inner.on("mouseleave", () => inner.animate(260, 0, "now").ease(">").transform({ scale: 1, origin: [W / 2, H / 2] }));
        inner.on("click", () => {
          const ring = iconLayer.circle(10).center(CX, CY).fill("none").stroke({ color: "#ffffff", width: 4 });
          ring.animate(800).ease(">").attr({ r: 110, "stroke-width": 0.5, opacity: 0 }).after(() => ring.remove());
        });
      };
      const build = (w, h) => {
        halt(draw.find("*"));
        draw.clear().viewbox(0, 0, w, h);
        animated = [];
        draw.plain("今日各地天氣・示意資料").font({ size: 13 }).fill(MUTED).attr({ x: 16, y: 24 });
        const info = draw.plain("").addClass("mono").font({ size: 11.5 }).fill(MUTED).attr({ x: w - 16, y: 24, "text-anchor": "end" });
        const cols = w / h > 2.6 ? 6 : w >= 640 ? 3 : 2, rows = 6 / cols;
        const top = 38, bottom = 14, side = 14, gap = 12;
        const cw = (w - side * 2 - gap * (cols - 1)) / cols;
        const ch = (h - top - bottom - gap * (rows - 1)) / rows;
        const s = Math.max(0.1, Math.min(cw / W, ch / H));
        const gw = cols * W * s + (cols - 1) * gap, gh = rows * H * s + (rows - 1) * gap;
        const x0 = (w - gw) / 2, y0 = top + (h - top - bottom - gh) / 2;
        CARDS.forEach((spec, i) => card(spec, x0 + (i % cols) * (W * s + gap), y0 + Math.floor(i / cols) * (H * s + gap), s));
        info.plain(`${animated.length} 條 timeline`);
        apply();
      };
      watch(ctx, stage, build);
      ctx.toggle("暫停", false, (v) => { paused = v; apply(); });
      ctx.group(["0.3×", "1×", "2×"], 1, (i) => { speed = [0.3, 1, 2][i]; apply(); });
      ctx.onCleanup(() => halt(draw.find("*")));
    },
  },
  {
    id: "chain", title: "鏈式建立",
    api: 'draw.rect(140, 90).move(20, 20).radius(16).fill("#f7df1e")',
    desc: "SVG.js 的建立方法都回傳元素本身，可以一路串接 move、fill、stroke、marker。右邊每一行程式碼都會真的交給 SVG.js 執行（每步額外淡入），左邊同步長出矩形、圓、多邊形、箭頭 marker、symbol 與 use、沿路徑排字的 textPath，最後一步把全部元素依序彈一下。",
    hint: "按「下一步」逐行執行；關掉自動播放就能自己控制節奏",
    mount(ctx) {
      ctx.html(`<div class="chain"><div class="panel art"><div class="box"></div><div class="meta"></div></div><ol class="panel code"></ol></div>`);
      const draw = paper(ctx.$(".box")).viewbox(0, 0, 480, 340);
      const meta = ctx.$(".meta"), list = ctx.$(".code");
      const items = STEPS.map((code) => { const li = document.createElement("li"); li.textContent = code; list.append(li); return li; });
      let step = 0, auto = true, idle = 0;
      const paint = () => {
        items.forEach((li, i) => { li.classList.toggle("done", i < step); li.classList.toggle("now", i === step - 1); });

          const P0 = (w < 560 ? POS_NARROW : POS)[k];
          let [x, y] = placed ? pos(n) : [snapV(P0[0] * w), snapV(P0[1] * h)];
          n.rect.center(clamp(x, 50, w - 50), clamp(y, 23, h - 23));
        }
        placed = true;
      });
      ctx.raf(() => {
        if (!placed) return;
        const P = nodes.map((n) => { const p = pos(n); n.label.attr({ x: p[0], y: p[1] }); return p; });
        for (const e of edges) {
          const [ax, ay] = P[e.a], [bx, by] = P[e.b], mx = (ax + bx) / 2;
          e.path.plot(`M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}`);
        }
      });
      ctx.toggle("對齊格線", true, (v) => { snap = v; });
      ctx.toggle("允許拖曳", true, (v) => {
        stage.classList.toggle("locked", !v);
        if (v) { nodes.forEach(bind); log(`<b>on</b>("pointerdown.drag") 重新綁定`); }
        else { nodes.forEach((n) => n.rect.off(".drag")); log(`<b>off</b>(".drag") 解除拖曳`); }
      });
      ctx.button("打亂", () => {
        nodes.forEach((n, i) => {
          if (n.r) n.r.unschedule();
          const x = clamp(snapV(50 + Math.random() * (W - 100)), 50, W - 50), y = clamp(snapV(23 + Math.random() * (H - 46)), 23, H - 23);
          n.r = n.rect.animate(700, i * 60, "now").ease("<>").center(x, y);
        });
        draw.fire("graph-shuffle", { count: nodes.length });
      });
      log(`draw.<b>on</b>("node-grab node-drop graph-shuffle")`);
      ctx.onCleanup(() => halt(draw.find("*")));
    },
  },
  {
    id: "defs", title: "漸層與遮罩",
    api: 'stop.animate({ times: Infinity, swing: true }).attr({ offset: .85 })',
    desc: "漸層、圖樣、遮罩與裁切都是放在 defs 裡的元素，所以同樣可以用 runner 做動畫：漸層的 stop 位置與顏色、徑向漸層的焦點、圖樣的位移與旋轉、遮罩形狀的位置。遮罩那格用 Spring 控制器跟著游標，閒置時自己遊走。",
    hint: "滑鼠移到「遮罩」那一格，聚光燈會跟著走",
    mount(ctx) {
      ctx.html(`<div class="quad">
        <div class="panel pane"><h2>漸層<code>gradient().stop()</code></h2><div class="box" data-k="a"></div></div>
        <div class="panel pane"><h2>圖樣<code>pattern()</code></h2><div class="box" data-k="b"></div></div>
        <div class="panel pane"><h2>遮罩<code>maskWith()</code></h2><div class="box" data-k="c"></div></div>
        <div class="panel pane"><h2>裁切<code>clipWith()</code></h2><div class="box" data-k="d"></div></div></div>`);
      const pad = (k) => paper(ctx.$(`[data-k="${k}"]`)).viewbox(0, 0, 240, 150);
      const loops = [];
      const loop = (el, dur, swing) => { loops.push(el); return el.animate({ duration: dur, times: Infinity, swing }); };
      // A: linear stop offset and colour, radial focal point
      const a = pad("a");
      let mid;
      const lin = a.gradient("linear", (add) => { add.stop(0, C[1]); mid = add.stop(0.5, C[0]); add.stop(1, C[2]); }).from(0, 0).to(1, 1);
      a.rect(110, 120).move(8, 15).radius(12).fill(lin);
      loop(mid, 2200, true).ease("<>").attr({ offset: 0.85, "stop-color": C[5] });
      const rad = a.gradient("radial", (add) => { add.stop(0, "#ffffff"); add.stop(0.35, C[3]); add.stop(1, "#1d222b"); }).from(0.3, 0.3).to(0.5, 0.5).radius(0.5);
      a.circle(112).center(180, 75).fill(rad);
      loop(rad, 1800, true).ease("<>").attr({ fx: 0.7, fy: 0.65 });
      // B: stripes slide via pattern x, dots spin via patternTransform
      const b = pad("b");
      const stripes = b.pattern(12, 12, (p) => { p.rect(12, 12).fill("#1d222b"); p.rect(6, 12).fill(C[4]); }).attr("transform", "rotate(45)");
      b.rect(110, 120).move(8, 15).radius(12).fill(stripes);
      loop(stripes, 1200, false).ease("-").attr({ x: 12 });
      const dotsPat = b.pattern(16, 16, (p) => { p.rect(16, 16).fill("#1d222b"); p.circle(7).center(8, 8).fill(C[3]); });
      b.circle(112).center(180, 75).fill(dotsPat);
      loop(dotsPat, 9000, false).ease("-").rotate(360, 180, 75);
      // C: bright copy of a dim layer, revealed through a spring-driven mask
      const c = pad("c");
      const dim = c.group();
      const bokeh = [[30, 40, 26], [80, 110, 34], [128, 36, 22], [172, 100, 30], [214, 46, 24], [120, 82, 18], [60, 70, 14], [200, 128, 16]];
      bokeh.forEach(([x, y, r], i) => dim.circle(r * 2).center(x, y).fill(C[i % 6]));
      dim.plain("maskWith").font({ size: 32, weight: 800 }).fill("#ffffff").attr({ x: 120, y: 86, "text-anchor": "middle" });
      dim.opacity(0.22);
      const bright = dim.clone().addTo(c).opacity(1);
      const spotFill = c.gradient("radial", (add) => { add.stop(0, "#ffffff"); add.stop(0.55, "#ffffff"); add.stop(1, "#000000"); });
      const mask = c.mask();
      const spots = [mask.circle(96).center(120, 75).fill(spotFill), mask.polygon(STAR10).size(110, 104).center(120, 75).fill("#ffffff").hide()];
      bright.maskWith(mask);
      const follow = new SVG.Spring(650, 18);
      const runners = spots.map((s) => s.animate(follow).center(120, 75));
      let lastMove = -1e9;
      const aim = (x, y) => runners.forEach((r) => r.center(x, y));
      c.on("pointermove", (e) => { const p = c.point(e.clientX, e.clientY); lastMove = performance.now(); aim(p.x, p.y); });
      ctx.interval(() => { if (performance.now() - lastMove > 1500) aim(40 + Math.random() * 160, 30 + Math.random() * 90); }, 1300);
      // D: colour bars sliding behind a text clip, dashed outline marching on top
      const d = pad("d");
      const clip = d.clip();
      clip.plain("裁切").font({ size: 92, weight: 900 }).attr({ x: 120, y: 108, "text-anchor": "middle" });
      const holder = d.group().clipWith(clip);
      const bars = holder.group().skew(-24, 0).group();
      for (let i = -6; i < 12; i++) bars.rect(24, 200).move(i * 24, -25).fill(C[(i + 12) % 6]);
      loop(bars, 2400, false).ease("-").translate(144, 0);
      const outline = d.plain("裁切").font({ size: 92, weight: 900 }).fill("none").stroke({ color: FG, width: 1.2, dasharray: "8 12" })
        .attr({ x: 120, y: 108, "text-anchor": "middle", "stroke-dashoffset": 0 });
      loop(outline, 1500, false).ease("-").attr({ "stroke-dashoffset": -40 });
      ctx.toggle("動畫", true, (v) => loops.forEach((el) => (v ? el.timeline().play() : el.timeline().pause())));
      ctx.group(["圓形聚光", "星形聚光"], 0, (i) => spots.forEach((s, k) => (k === i ? s.show() : s.hide())));
      ctx.onCleanup(() => { for (const p of [a, b, c, d]) halt(p.find("*")); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: 'el.animate({ duration, times: Infinity, swing: true, when: "now" }).center(x, y)',
    desc: "每個圓點掛一個無限來回的 runner，逐級加量直到掉到 30 FPS 以下。可切換三種寫法再測一次：每個元素各自一條 timeline（SVG.js 預設）、全部共用一條 timeline、或完全不用 runner 改在 rAF 裡手動 center()，比較 runner 本身的成本。",
    hint: "按「自動加壓」開始；切換模式後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="stress-stage"></div>`);
      const draw = paper(ctx.$(".stress-stage")).viewbox(0, 0, 800, 500).attr("preserveAspectRatio", "xMidYMid slice");
      const layer = draw.group();
      const items = [];
      let mode = "own", n = 0, addMs = 0, shared = new SVG.Timeline();
      const rnd = (a, b) => a + Math.random() * (b - a);
      const add = () => {
        const i = items.length, x = rnd(10, 790), y = rnd(10, 490);
        const el = layer.circle(rnd(8, 14)).center(x, y).fill(C[i % 6]).opacity(0.8);
        const it = { el, x, y, x2: clamp(x + rnd(-120, 120), 6, 794), y2: clamp(y + rnd(-80, 80), 6, 494), dur: rnd(1200, 2600), ph: rnd(0, TAU), r: null };
        if (mode !== "raf") {
          if (mode === "shared") el.timeline(shared);
          it.r = el.animate({ duration: it.dur, times: Infinity, swing: true, when: "now" }).ease("<>").center(it.x2, it.y2);
        }
        items.push(it);
      };
      const drop = () => { const it = items.pop(); if (it.r) it.r.unschedule(); it.el.remove(); };
      const clearAll = () => {
        if (mode === "shared") shared.terminate(); else for (const it of items) if (it.r) it.el.timeline().terminate();
        layer.clear(); items.length = 0;
      };
      const fill = () => {
        const t0 = performance.now();
        if (n < items.length / 2) clearAll();
        while (items.length > n) drop();
        while (items.length < n) add();
        addMs = performance.now() - t0;
      };
      ctx.raf((t) => {
        if (mode !== "raf") return;
        for (const it of items) {
          const s = 0.5 - 0.5 * Math.cos((t / it.dur) * Math.PI + it.ph);
          it.el.center(it.x + (it.x2 - it.x) * s, it.y + (it.y2 - it.y) * s);
        }
      });
      ctx.select("模式", [
        { value: "own", label: "每個元素各自 timeline" },
        { value: "shared", label: "共用一條 timeline" },
        { value: "raf", label: "手動 rAF（不用 runner）" },
      ], mode, (v) => { clearAll(); mode = v; shared = new SVG.Timeline(); fill(); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "圓點", unit: "個", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000], minFps: 30,
        apply(count) { n = count; fill(); },
        metrics: () => ({ "模式": mode === "own" ? "各自 timeline" : mode === "shared" ? "共用 timeline" : "手動 rAF", "Timeline 數": mode === "own" ? fmt(items.length) : mode === "shared" ? "1" : "0", "上次增減": `${addMs.toFixed(0)} ms` }),
        note: "每個 runner 每格都要算緩動、重組屬性再寫回 DOM；共用 timeline 少了排程佇列，但每次 schedule 都會重新排序整份 runner 清單，一次加入上千個時「上次增減」會明顯變長。",
      });
      ctx.onCleanup(() => { clearAll(); });
    },
  },
] });
</script>
