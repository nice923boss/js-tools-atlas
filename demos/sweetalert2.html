<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SweetAlert2 示範：漂亮又好用的對話框</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 0%, rgba(112,102,224,.16), transparent 70%), var(--bg); }
  .page { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px 14px 52px; }
  .head { text-align: center; }
  .head h1 { margin: 0; font-size: 20px; }
  .head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(680px, 100%); }
  .act {
    display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; text-align: left;
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); color: var(--fg); cursor: pointer; font: 600 14px var(--font);
    transition: border-color .15s, transform .15s;
  }
  .act:hover { border-color: #7066e0; transform: translateY(-2px); }
  .act span { font-size: 20px; line-height: 1; }
  .act small { color: var(--muted); font: 400 11px var(--mono); }
  .result { width: min(680px, 100%); font: 12px/1.5 var(--mono); color: var(--muted); padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--line); min-height: 36px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .result b { color: var(--c4); font-weight: 600; }
  .course { display: flex; gap: 10px; align-items: center; text-align: left; margin-top: 4px; }
  .course img { width: 92px; height: 62px; object-fit: cover; border-radius: 8px; flex: none; }
  .course div { font-size: 14px; line-height: 1.6; }
  .course small { color: #a9a9b3; }
  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .act { flex-direction: row; align-items: center; padding: 9px 10px; font-size: 13px; }
    .act small { display: none; }
    .head p { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="head">
    <h1>課程報名中心</h1>
    <p>每顆按鈕都會開啟一種 SweetAlert2 對話框</p>
  </div>
  <div class="grid">
    <button class="act" data-a="enroll"><span>📝</span>確認報名<small>showCancelButton</small></button>
    <button class="act" data-a="remove"><span>🗑️</span>刪除提醒<small>icon: warning</small></button>
    <button class="act" data-a="email"><span>✉️</span>輸入信箱<small>input + 驗證</small></button>
    <button class="act" data-a="city"><span>📍</span>選擇場次<small>input: select</small></button>
    <button class="act" data-a="steps"><span>🪜</span>三步問卷<small>progressSteps</small></button>
    <button class="act" data-a="timer"><span>⏳</span>自動關閉<small>timerProgressBar</small></button>
    <button class="act" data-a="toast"><span>🔔</span>右上通知<small>toast</small></button>
    <button class="act" data-a="photo"><span>🖼️</span>圖片預覽<small>imageUrl</small></button>
  </div>
  <div class="result" id="result">對話框關閉後，回傳的 Promise 結果會顯示在這裡</div>
</div>
<div class="hint">點按鈕開啟不同對話框・對話框可拖曳</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
<script>
// SweetAlert2 showcase: every dialog returns a Promise; results are printed below the buttons.
const Dlg = Swal.mixin({ theme: "dark", heightAuto: false, draggable: true, confirmButtonText: "好", cancelButtonText: "取消" });
const Toast = Swal.mixin({
  theme: "dark", toast: true, position: "top-end", showConfirmButton: false, timer: 2600, timerProgressBar: true,
  didOpen: (t) => { t.onmouseenter = Swal.stopTimer; t.onmouseleave = Swal.resumeTimer; },
});
const out = document.getElementById("result");
const show = (label, r) => {
  const value = r.value === undefined ? "" : `, value: ${JSON.stringify(r.value)}`;
  out.innerHTML = `${label} → <b>{ isConfirmed: ${r.isConfirmed}${value}${r.dismiss ? `, dismiss: "${r.dismiss}"` : ""} }</b>`;
  return r;
};

const ACTIONS = {
  async enroll() {
    const r = show("確認報名", await Dlg.fire({
      title: "要報名這堂課嗎？", icon: "question", showCancelButton: true, confirmButtonText: "立即報名", cancelButtonText: "再想想",
      html: `<div class="course"><img src="_shared/img/photo-3.jpg" alt="課程封面"><div><b>AI 簡報術實戰班</b><br><small>台北場・11 月 8 日（六）09:30<br>剩餘名額 6 位</small></div></div>`,
    }));
    if (r.isConfirmed) Dlg.fire({ title: "報名成功！", text: "確認信已寄到你的信箱。", icon: "success", timer: 2200, timerProgressBar: true });
  },
  async remove() {
    const r = show("刪除提醒", await Dlg.fire({
      title: "確定刪除這份講義？", text: "刪除後無法復原。", icon: "warning", showCancelButton: true, confirmButtonText: "刪除", confirmButtonColor: "#e5484d", reverseButtons: true,
    }));
    if (r.isConfirmed) Toast.fire({ icon: "success", title: "講義已刪除" });
  },
  async email() {
    show("輸入信箱", await Dlg.fire({
      title: "訂閱課程通知", input: "email", inputPlaceholder: "name@example.com", showCancelButton: true, confirmButtonText: "訂閱",
      inputValidator: (v) => (!v ? "請輸入信箱" : undefined), validationMessage: "信箱格式不正確",
      showLoaderOnConfirm: true, preConfirm: (v) => new Promise((ok) => setTimeout(() => ok(v), 900)),
    }));
  },
  async city() {
    show("選擇場次", await Dlg.fire({
      title: "選擇上課城市", input: "select", showCancelButton: true, confirmButtonText: "確定",
      inputOptions: { 北部: { tpe: "台北", hsz: "新竹" }, 中部: { txg: "台中" }, 南部: { tnn: "台南", khh: "高雄" }, 東部: { hua: "花蓮" } },
      inputPlaceholder: "請選擇", inputValidator: (v) => (!v ? "還沒選城市喔" : undefined),
    }));
  },
  async steps() {
    const QS = [
      ["你是哪種學員？", { work: "上班族", student: "學生", teacher: "老師" }],
      ["每週可投入幾小時？", { a: "1 到 2 小時", b: "3 到 5 小時", c: "6 小時以上" }],
      ["最想學哪個主題？", { ai: "AI 工具", ppt: "簡報設計", data: "資料分析" }],
    ];
    const answers = [];
    for (let i = 0; i < QS.length; ) {
      const r = await Dlg.fire({
        title: QS[i][0], input: "radio", inputOptions: QS[i][1], inputValue: answers[i], progressSteps: ["1", "2", "3"], currentProgressStep: i,
        showCancelButton: i > 0, cancelButtonText: "上一步", confirmButtonText: i === QS.length - 1 ? "送出" : "下一步",
        inputValidator: (v) => (!v ? "請選一個" : undefined),
      });
      if (r.isConfirmed) { answers[i] = r.value; i++; }
      else if (r.dismiss === Swal.DismissReason.cancel) i--;
      else return show("三步問卷", r);
    }
    show("三步問卷", { isConfirmed: true, value: answers });
    Dlg.fire({ icon: "success", title: "感謝填寫", text: `你的答案：${answers.map((a, i) => QS[i][1][a]).join("、")}` });
  },
  async timer() {
    let id;
    show("自動關閉", await Dlg.fire({
      title: "正在儲存進度", html: "視窗會在 <b>3.0</b> 秒後自動關閉", timer: 3000, timerProgressBar: true, showConfirmButton: false,
      didOpen: () => { Swal.showLoading(); const b = Swal.getHtmlContainer().querySelector("b"); id = setInterval(() => (b.textContent = (Swal.getTimerLeft() / 1000).toFixed(1)), 100); },
      willClose: () => clearInterval(id),
    }));
  },
  toast() {
    const list = [["success", "已加入收藏"], ["info", "新課程已上架"], ["warning", "名額剩 3 位"], ["error", "網路不穩，請稍後再試"]];
    const [icon, title] = list[Math.floor(Math.random() * list.length)];
    Toast.fire({ icon, title });
    out.textContent = `Toast 通知：${title}（不會擋住畫面操作）`;
  },
  async photo() {
    show("圖片預覽", await Dlg.fire({
      title: "瀑布彩虹", text: "上一期戶外課的合照景點", imageUrl: "_shared/img/photo-5.jpg", imageWidth: 400, imageAlt: "瀑布與彩虹",
      showCloseButton: true, confirmButtonText: "下載原圖",
    }));
  },
};

document.querySelectorAll(".act").forEach((b) => b.addEventListener("click", () => ACTIONS[b.dataset.a]()));

// Open the signature dialog right away so the effect is visible on load.
ACTIONS.enroll();
</script>
</body>
</html>
