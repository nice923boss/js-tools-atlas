<style>
  .sa-board { position: absolute; inset: 0; overflow: hidden; display: flex; gap: 10px;
    padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .sa-host { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; border-radius: 14px; border: 1px solid var(--line);
    background: radial-gradient(70% 60% at 50% 0%, rgba(112,102,224,.16), transparent 70%), var(--bg-2); }
  /* SweetAlert2 uses position:fixed; keep every dialog inside the scene host instead of the page */
  .sa-host .swal2-container { position: absolute; z-index: 20; }
  .sa-host .swal2-popup { font-size: 15px; }
  .sa-side { width: 250px; flex: none; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; overflow: hidden;
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .sa-side h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
  .sa-log { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 4px; font: 11.5px/1.45 var(--mono); }
  .sa-log div { padding: 4px 7px; border-radius: 7px; background: rgba(255,255,255,.04); word-break: break-all; }
  .sa-log b { color: var(--c4); font-weight: 600; }
  .sa-log i { color: var(--c2); font-style: normal; }
  .sa-log .sa-zh { font-family: var(--font); }
  @media (max-width: 700px), (max-height: 480px) { .sa-host .swal2-popup { font-size: 13px; } }
  /* compact dialogs for short or narrow stages */
  @media (max-height: 480px), (max-width: 520px) {
    .sa-host .swal2-popup { font-size: 12px; }
    .sa-host .swal2-modal .swal2-icon { font-size: 8px; margin: 1.8em auto .2em; }
    .sa-host .swal2-modal .swal2-title { font-size: 1.55em; padding-top: .5em; }
    .sa-host .sa-coverpop .swal2-footer, .sa-host .sa-life .swal2-icon { display: none !important; } /* swal sets inline display */
    .sa-host .swal2-actions { margin-top: .8em; }
    .sa-host .swal2-progress-steps { margin-top: .6em; }
    .sa-host img.sa-cover { height: 72px; }
    .sa-host .sa-coverpop .swal2-html-container { margin-top: .5em; line-height: 1.45; }
    .sa-api { margin-top: 6px; gap: 4px; }
  }
  @media (max-width: 520px) {
    .sa-board { flex-direction: column; }
    .sa-side { width: auto; height: 104px; padding: 7px 10px; }

  /* scene 1: course shop */
  .sa-shop { display: flex; flex-direction: column; gap: 10px; padding: 14px; }
  .sa-shop h3 { margin: 0; font-size: 16px; }
  .sa-courses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .sa-course { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
  .sa-course img { width: 100%; height: 96px; object-fit: cover; display: block; }
  .sa-course > div { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 4px; }
  .sa-course b { font-size: 14px; }
  .sa-course small { color: var(--muted); font-size: 12px; }
  .sa-seat { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .sa-seat i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .sa-seat i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--c4); transition: width .4s; }
  .sa-seat.full i::after { background: var(--c3); }
  .sa-course button { margin-top: 3px; border: 0; border-radius: 8px; padding: 7px; font: 700 13px var(--font); cursor: pointer; background: #7066e0; color: #fff; }
  .sa-course button.wait { background: rgba(255,255,255,.1); color: var(--fg); }
  .sa-res { margin-top: auto; font: 12px/1.5 var(--mono); color: var(--muted); padding: 7px 10px; border-radius: 10px; border: 1px dashed var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sa-res b { color: var(--c4); font-weight: 600; }
  .sa-mini { display: flex; gap: 10px; align-items: center; text-align: left; margin-top: 4px; }
  .sa-mini img { width: 92px; height: 62px; object-fit: cover; border-radius: 8px; flex: none; }
  .sa-mini div { font-size: 14px; line-height: 1.6; }
  .sa-mini small { opacity: .7; }
  @media (max-width: 700px) {
    .sa-courses { grid-template-columns: 1fr; gap: 8px; }
    .sa-course { flex-direction: row; align-items: center; }
    .sa-course img { width: 76px; height: 64px; flex: none; }
    .sa-course > div { flex: 1; min-width: 0; padding: 6px 10px; gap: 2px; }
    .sa-course small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sa-course button { padding: 4px; }
  }

  /* scene 2: nine-cell position grid behind the dialog */
  .sa-grid9 { position: absolute; inset: 10px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 8px; }
  .sa-grid9 span { display: grid; place-items: center; border: 1.5px dashed rgba(255,255,255,.12); border-radius: 10px; font: 12px var(--mono); color: var(--muted); transition: .2s; }
  .sa-grid9 span.on { border-color: var(--c2); color: var(--c2); background: rgba(76,201,240,.08); }

  /* scene 4: answer card */
  .sa-ans { display: flex; flex-direction: column; gap: 6px; }
  .sa-ans div { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.04); font-size: 13px; }
  .sa-ans div.on { outline: 1.5px solid #7066e0; }
  .sa-ans em { font: 700 12px var(--mono); color: #9d8cff; font-style: normal; }
  .sa-ans span { color: var(--muted); }
  .sa-ans span.ok { color: var(--c4); }
  .sa-sum { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
  .sa-sum td { padding: 6px 8px; border-bottom: 1px solid rgba(128,128,128,.25); }
  @media (max-width: 520px) { .sa-ans { flex-direction: row; } .sa-ans div { flex: 1; flex-direction: column; gap: 0; padding: 4px 6px; font-size: 12px; } }

  /* scene 5: mock app behind toasts */
  .sa-app { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .sa-app header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
  .sa-app header small { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
  .sa-app header small b { font-family: var(--mono); color: var(--c1); }
  .sa-files { padding: 8px 14px; display: flex; flex-direction: column; gap: 6px; }
  .sa-files div { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; background: rgba(255,255,255,.035); font-size: 13px; }
  .sa-files i { width: 26px; height: 30px; border-radius: 5px; flex: none; }
  .sa-files span { margin-left: auto; color: var(--muted); font: 11px var(--mono); }

  /* scene 6: custom theme + animations */
  .sa-host .sa-cover { width: 100%; height: 130px; object-fit: cover; margin: 0; border-radius: 0; }
  .sa-host .swal2-popup.sa-coverpop { padding-top: 0; overflow: hidden; }
  .sa-ticket { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; text-align: left; font-size: .9em; margin: 0 auto; width: max-content; max-width: 100%; }
  .sa-ticket dt { opacity: .6; }
  .sa-ticket dd { margin: 0; }
  .sa-host .sa-neon { background: linear-gradient(160deg, #1d1440, #0b1a2c); color: #e9e6ff; border: 1px solid rgba(157,140,255,.6);
    box-shadow: 0 0 0 4px rgba(157,140,255,.12), 0 24px 70px rgba(157,140,255,.35); border-radius: 18px; }
  .sa-host .sa-neon .swal2-title { color: #fff; text-shadow: 0 0 18px rgba(247,37,133,.6); }
  .sa-host .sa-neon .swal2-footer { border-color: rgba(157,140,255,.3); color: #b9b2ea; }
  .sa-neon-btn { margin: 0 6px; padding: 9px 20px; border-radius: 99px; border: 0; font: 700 14px var(--font); cursor: pointer; color: #160b2b;
    background: linear-gradient(90deg, #f72585, #9d8cff); box-shadow: 0 6px 20px rgba(247,37,133,.4); }
  .sa-neon-btn.ghost { background: transparent; color: #cfc8ff; border: 1px solid rgba(157,140,255,.6); box-shadow: none; }
  @keyframes sa-pop { 0% { transform: scale(.55); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes sa-rise { from { transform: translateY(60px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sa-flip { from { transform: perspective(700px) rotateX(-75deg); opacity: 0; } to { transform: perspective(700px) rotateX(0); opacity: 1; } }
  @keyframes sa-out { to { transform: scale(.9); opacity: 0; } }
  .sa-a-pop { animation: sa-pop .45s ease-out; }
  .sa-a-rise { animation: sa-rise .4s cubic-bezier(.2,.8,.2,1); }
  .sa-a-flip { animation: sa-flip .5s ease-out; transform-origin: 50% 0; }
  .sa-a-out { animation: sa-out .2s ease-in forwards; }

  /* scene 7: timer API buttons inside the dialog */
  .sa-left { font: 700 1.6em var(--mono); color: #7066e0; }
  .sa-api { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
  .sa-api button { border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit; border-radius: 7px; padding: 4px 9px; font: 12px var(--mono); cursor: pointer; }
  .sa-api button:hover { border-color: #7066e0; }

  /* scene 8: stress layout */
  @media (min-width: 761px) { .sa-board.sa-lab { inset: 8px 8px 8px 350px; padding: 0 0 calc(var(--sc-ctl-b, 0px) + 6px); } }
  .sa-rows { font-size: 13px; text-align: left; width: 100%; border-collapse: collapse; }
  .sa-rows td { padding: 3px 6px; border-bottom: 1px solid rgba(128,128,128,.2); }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IMG = (n) => `_shared/img/photo-${n}.jpg`;
const BASE = { theme: "dark", heightAuto: false, scrollbarPadding: false, returnFocus: false, confirmButtonText: "好", cancelButtonText: "取消", denyButtonText: "否" };

// Close whatever is open right now, skipping the CSS hide animation so body classes and aria-hidden are restored synchronously.
function closeNow() {
  const p = Swal.getPopup();
  if (!p) return;
  p.style.animation = "none";
  p.style.transition = "none";
  Swal.close();
  p.dispatchEvent(new Event("animationend")); // finishes a close that was already animating
}

// Dialog factory bound to a host element inside the scene. Resolves null once the scene is gone.
function dialogs(ctx, host, extra = {}) {
  const D = Swal.mixin({ ...BASE, ...extra, target: host });
  ctx.onCleanup(closeNow);
  return async (opts) => {
    const r = await D.fire(opts);
    return ctx.active ? r : null;
  };
}

function fmtResult(r) {
  if (!r) return "";
  const v = r.value instanceof File ? `File(${r.value.name})` : JSON.stringify(r.value);
  return r.isConfirmed ? `{ isConfirmed: <b>true</b>, value: ${esc(v ?? "true")} }`
    : r.isDenied ? `{ isDenied: <b>true</b> }` : `{ isDismissed: true, dismiss: "${esc(r.dismiss)}" }`;
}

function logger(box, max = 40) {
  return (html) => {
    const d = document.createElement("div");
    d.innerHTML = html;
    box.prepend(d);
    while (box.children.length > max) box.lastChild.remove();
  };
}

Showcase.run({ scenes: [
  {
    id: "enroll", title: "課程報名流程",
    api: "Swal.fire({ input: 'email', showLoaderOnConfirm: true, preConfirm: async (v) => {...} })",
    desc: "確認課程、填 Email、送出檢查、成功提示串成一條流程：送出時按鈕轉圈，重複 Email 由 showValidationMessage 在框內提示，名額即時扣除，額滿改問要不要候補。",
    hint: "點課程的「報名」・試輸入 demo@example.com 看重複檢查",
    mount(ctx) {
      ctx.html(`<div class="sa-board"><div class="sa-host sa-shop"><h3>本月課程</h3><div class="sa-courses"></div><div class="sa-res">結果會顯示在這裡</div></div></div>`);
      const host = ctx.$(".sa-host"), list = ctx.$(".sa-courses"), res = ctx.$(".sa-res");
      const fire = dialogs(ctx, host);
      const init = () => [
        { t: "AI 簡報術實戰班", d: "台北場・11/8（六）09:30", img: 3, seats: 6, max: 30, fee: "NT$ 3,200" },
        { t: "Excel 資料自動化", d: "線上直播・11/15（六）14:00", img: 1, seats: 2, max: 40, fee: "NT$ 1,800" },
        { t: "生成式影像工作坊", d: "台中場・11/22（六）10:00", img: 6, seats: 0, max: 24, fee: "NT$ 2,600", wait: 3 },
      ];
      let courses = init();
      const taken = new Set(["demo@example.com"]);
      const render = () => {
        list.innerHTML = courses.map((c, i) => `<div class="sa-course"><img src="${IMG(c.img)}" alt=""><div>
          <b>${c.t}</b><small>${c.d}・${c.fee}</small>
          <span class="sa-seat${c.seats ? "" : " full"}" style="--w:${(1 - c.seats / c.max) * 100}%"><i></i>${c.seats ? `剩 ${c.seats} 位` : `額滿・候補 ${c.wait} 人`}</span>
          <button type="button" data-i="${i}" class="${c.seats ? "" : "wait"}">${c.seats ? "報名" : "加入候補"}</button></div></div>`).join("");
      };
      const show = (step, r) => { if (r) res.innerHTML = `${step} → ${fmtResult(r)}`; };
      async function enroll(i) {
        const c = courses[i];
        if (!c.seats) {
          const r = await fire({ icon: "info", title: "本梯已額滿", text: "要加入候補名單嗎？有人取消時會依序通知。", showCancelButton: true, confirmButtonText: "加入候補" });
          show("候補", r);
          if (r?.isConfirmed) { c.wait++; render(); }
          return;
        }
        const r1 = await fire({
          title: "確認報名？", icon: "question", showCancelButton: true, confirmButtonText: "下一步",
          html: `<div class="sa-mini"><img src="${IMG(c.img)}" alt="課程封面"><div><b>${c.t}</b><br><small>${c.d}<br>${c.fee}・剩餘名額 ${c.seats} 位</small></div></div>`,
        });
        show("確認", r1);
        if (!r1?.isConfirmed) return;
        const r2 = await fire({
          title: "填寫聯絡 Email", input: "email", inputLabel: "確認信會寄到這個信箱", inputPlaceholder: "name@example.com",
          validationMessage: "Email 格式不正確", showCancelButton: true, confirmButtonText: "送出報名",
          showLoaderOnConfirm: true, allowOutsideClick: () => !Swal.isLoading(),
          preConfirm: async (email) => {
            await new Promise((r) => setTimeout(r, 900)); // pretend server round trip
            if (!ctx.active) return false;
            if (taken.has(email.toLowerCase())) { Swal.showValidationMessage("這個 Email 已經報名過了"); return false; }
            return email;
          },
        });
        show("Email", r2);
        if (!r2?.isConfirmed) return;
        taken.add(r2.value.toLowerCase());
        c.seats--;
        render();
        const r3 = await fire({ icon: "success", title: "報名成功", html: `確認信已寄到 <b>${esc(r2.value)}</b>`, timer: 2200, timerProgressBar: true, showConfirmButton: false });
        show("完成", r3);
      }
      ctx.on(list, "click", (e) => { const b = e.target.closest("button[data-i]"); if (b) enroll(+b.dataset.i); });
      ctx.button("重設名額", () => { closeNow(); courses = init(); render(); res.textContent = "已重設"; });
      render();
      ctx.timeout(() => enroll(0), 250);
    },
  },
  {
    id: "icons", title: "圖示與九宮格位置",
    api: "Swal.fire({ icon, position: 'top-end', backdrop, iconHtml, iconColor, draggable })",
    desc: "五種內建動畫圖示加上 iconHtml 自訂圖示；position 可放九個位置，backdrop 關掉後背景仍可操作，draggable 讓對話框可以拖著走。",
    hint: "右上切換圖示與位置・對話框可以拖曳",
    mount(ctx) {
      const POS = ["top-start", "top", "top-end", "center-start", "center", "center-end", "bottom-start", "bottom", "bottom-end"];
      ctx.html(`<div class="sa-board"><div class="sa-host"><div class="sa-grid9">${POS.map((p) => `<span>${p}</span>`).join("")}</div></div></div>`);
      const host = ctx.$(".sa-host");
      const fire = dialogs(ctx, host);
      const ICONS = [
        { v: "success", l: "success 成功", o: { title: "付款完成", text: "訂單 #A1024 已建立，收據寄到你的信箱。" } },
        { v: "error", l: "error 錯誤", o: { title: "上傳失敗", text: "檔案超過 20 MB，請壓縮後再試一次。" } },
        { v: "warning", l: "warning 警告", o: { title: "確定要刪除？", text: "刪除後無法復原。", showCancelButton: true, confirmButtonText: "刪除", confirmButtonColor: "#e5484d", reverseButtons: true } },
        { v: "info", l: "info 資訊", o: { title: "系統維護公告", text: "今晚 23:00 至 23:30 暫停服務。" } },
        { v: "question", l: "question 詢問", o: { title: "要儲存變更嗎？", text: "離開前可以先存成草稿。", showDenyButton: true, showCancelButton: true, confirmButtonText: "儲存", denyButtonText: "不儲存" } },
        { v: "custom", l: "iconHtml 自訂", o: { icon: "info", iconHtml: "★", iconColor: "#f7df1e", title: "集點成功", text: "iconHtml 可以放任何 HTML，iconColor 換顏色。" } },
      ];
      let icon = 0, pos = 4, backdrop = true;
      const open = () => {
        ctx.$$(".sa-grid9 span").forEach((s, i) => s.classList.toggle("on", i === pos));
        const it = ICONS[icon];
        fire({ icon: it.v, ...it.o, position: POS[pos], backdrop, draggable: true });
      };
      ctx.select("", ICONS.map((x, i) => ({ value: i, label: x.l })), 0, (v) => { icon = +v; open(); });
      ctx.select("", POS.map((p, i) => ({ value: i, label: p })), 4, (v) => { pos = +v; open(); });
      ctx.toggle("遮罩", true, (v) => { backdrop = v; open(); });
      ctx.button("再開一次", open, { primary: true });
      ctx.timeout(open, 150);
    },
  },
  {
    id: "inputs", title: "八種輸入型別",
    api: "Swal.fire({ input: 'radio' | 'select' | 'range' | 'file' | ..., inputOptions, inputValidator })",
    desc: "同一個 input 參數切換八種表單元件，inputValidator 回傳字串就會擋下送出並顯示訊息；file 型別回傳 File 物件，這裡再用第二個對話框預覽圖片。",
    hint: "右上選型別・不填直接按確定看驗證訊息",
    mount(ctx) {
      ctx.html(`<div class="sa-board"><div class="sa-host"></div><div class="sa-side"><h4>回傳結果</h4><div class="sa-log"></div></div></div>`);
      const host = ctx.$(".sa-host"), log = logger(ctx.$(".sa-log"));
      ctx.$(".sa-log").innerHTML = `<div class="sa-zh">按確定或取消後，回傳值會列在這裡</div>`;
      const fire = dialogs(ctx, host, { showCancelButton: true, confirmButtonText: "確定" });
      const today = new Date().toISOString().slice(0, 10);
      const T = {
        text: { title: "你的暱稱", input: "text", inputPlaceholder: "2 到 12 個字", inputAttributes: { maxlength: 12 },
          inputValidator: (v) => (!v ? "請輸入暱稱" : v.length < 2 ? "至少 2 個字" : null) },
        textarea: { title: "課後回饋", input: "textarea", inputPlaceholder: "寫下你的想法…",
          inputValidator: (v) => (v.trim().length < 10 ? `至少 10 個字（目前 ${v.trim().length} 字）` : null) },
        select: { title: "選擇上課城市", input: "select", inputPlaceholder: "請選擇",
          inputOptions: { 北部: { tpe: "台北", hsz: "新竹" }, 中部: { txg: "台中" }, 南部: { tnn: "台南", khh: "高雄" }, 東部: { hua: "花蓮" } },
          inputValidator: (v) => (!v ? "請選一個城市" : null) },
        radio: { title: "偏好上課時段", input: "radio", inputOptions: { am: "上午", pm: "下午", eve: "晚上" },
          inputValidator: (v) => (!v ? "請選一個時段" : null) },
        checkbox: { title: "服務條款", input: "checkbox", inputValue: 0, inputPlaceholder: "我已閱讀並同意服務條款",
          inputValidator: (v) => (!v ? "需要勾選才能繼續" : null) },
        range: { title: "課程滿意度", input: "range", inputLabel: "0 到 10 分", inputAttributes: { min: 0, max: 10, step: 1 }, inputValue: 8 },
        date: { title: "預約日期", input: "date", inputAttributes: { min: today },
          inputValidator: (v) => (!v ? "請選日期" : v < today ? "不能選過去的日期" : null) },
        file: { title: "上傳大頭貼", input: "file", inputAttributes: { accept: "image/*" },
          inputValidator: (f) => (!f ? "請選一張圖片" : f.size > 2e6 ? "檔案超過 2 MB" : null) },
      };
      let type = "radio";
      async function open() {
        const r = await fire(T[type]);
        if (!r) return;
        log(`<i>${type}</i> ${fmtResult(r)}`);
        if (type === "file" && r.isConfirmed && r.value) {
          const url = await new Promise((ok) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(r.value); });
          if (ctx.active) fire({ title: r.value.name, imageUrl: url, imageAlt: "上傳的圖片", imageHeight: 160, showCancelButton: false });
        }
      }
      ctx.select("", Object.keys(T), type, (v) => { type = v; open(); });
      ctx.button("開啟", open, { primary: true });
      ctx.timeout(open, 150);
    },
  },
  {
    id: "steps", title: "多步驟問卷",
    api: "await Swal.fire({ progressSteps: ['1','2','3'], currentProgressStep: i, inputValue })",
    desc: "每一步都是 await 一個新對話框，progressSteps 畫出步驟條；按「上一步」回到前一題並帶回原本的答案，最後彙整成一張表。",
    hint: "作答後按「下一步」・可以按「上一步」改答案",
    mount(ctx) {
      ctx.html(`<div class="sa-board"><div class="sa-host"></div><div class="sa-side"><h4>答案卡</h4><div class="sa-ans"></div></div></div>`);
      const host = ctx.$(".sa-host"), card = ctx.$(".sa-ans");
      const fire = dialogs(ctx, host);
      const QS = [
        { k: "頻率", title: "你多常做簡報？", input: "radio", inputOptions: { w: "每週", m: "每月", r: "很少" } },
        { k: "想加強", title: "最想加強哪一塊？", input: "select", inputPlaceholder: "請選擇", inputOptions: { story: "故事架構", design: "版面設計", data: "資料視覺化", talk: "上台表達" } },
        { k: "目標分數", title: "給自己的目標分數", input: "range", inputAttributes: { min: 1, max: 10, step: 1 }, inputValue: 7 },
      ];
      const label = (q, v) => (q.inputOptions ? q.inputOptions[v] : v != null ? `${v} 分` : null);
      let ans = [], cur = 0;
      const render = () => {
        card.innerHTML = QS.map((q, i) => `<div class="${i === cur ? "on" : ""}"><em>${i + 1}</em>${q.k}<span class="${ans[i] != null ? "ok" : ""}">${ans[i] != null ? label(q, ans[i]) : "未答"}</span></div>`).join("");
      };
      async function run() {
        ans = []; cur = 0; render();
        while (cur < QS.length) {
          const { k, ...q } = QS[cur];
          const r = await fire({
            ...q, progressSteps: ["1", "2", "3"], currentProgressStep: cur,
            inputValue: ans[cur] ?? q.inputValue ?? "",
            inputValidator: (v) => (v === "" || v == null ? "請先作答" : null),
            showCancelButton: true, cancelButtonText: cur ? "上一步" : "取消", confirmButtonText: cur === QS.length - 1 ? "完成" : "下一步",
            showClass: { backdrop: "swal2-noanimation" }, hideClass: { backdrop: "swal2-noanimation" },
          });
          if (!r) return;
          if (r.isConfirmed) { ans[cur] = r.value; cur++; }
          else if (r.dismiss === Swal.DismissReason.cancel && cur > 0) cur--;
          else { render(); return; }
          render();
        }
        await fire({
          icon: "success", title: "問卷完成",
          html: `<table class="sa-sum">${QS.map((q, i) => `<tr><td>${q.k}</td><td><b>${label(q, ans[i])}</b></td></tr>`).join("")}</table>`,
        });
      }
      ctx.button("重新填寫", run, { primary: true });
      render();
      ctx.timeout(run, 150);
    },
  },
  {
    id: "toast", title: "Toast 通知",
    api: "Swal.mixin({ toast: true, position: 'top-end', timer, timerProgressBar: true, didOpen })",
    desc: "toast 模式不擋操作、不搶焦點；timerProgressBar 顯示剩餘時間，滑鼠移上去用 stopTimer 暫停、移開 resumeTimer 繼續。SweetAlert2 同時只顯示一則，新的會直接取代舊的。",
    hint: "滑鼠停在通知上會暫停倒數・右上換位置與停留秒數",
    mount(ctx) {
      const FILES = [["期末報告.pptx", "#ff8c42", "12.4 MB"], ["預算表.xlsx", "#7bd389", "860 KB"], ["合約草稿.docx", "#4cc9f0", "214 KB"], ["活動照片.zip", "#9d8cff", "48.1 MB"], ["講義.pdf", "#f72585", "3.2 MB"]];
      ctx.html(`<div class="sa-board"><div class="sa-host"><div class="sa-app"><header>我的雲端硬碟<small>已推送 <b class="sa-n">0</b> 則</small></header>
        <div class="sa-files">${FILES.map(([n, c, s]) => `<div><i style="background:${c}"></i>${n}<span>${s}</span></div>`).join("")}</div></div></div></div>`);
      const host = ctx.$(".sa-host"), nEl = ctx.$(".sa-n");
      const Toast = Swal.mixin({
        theme: "dark", target: host, toast: true, showConfirmButton: false, timerProgressBar: true,
        didOpen: (t) => { t.onmouseenter = Swal.stopTimer; t.onmouseleave = Swal.resumeTimer; },
      });
      ctx.onCleanup(closeNow);
      const MSG = [["success", "已儲存「期末報告.pptx」"], ["info", "3 位同事正在檢視", "預算表.xlsx"], ["warning", "儲存空間剩 8%", "建議清理活動照片"],
        ["error", "同步失敗", "網路中斷，稍後自動重試"], ["success", "已分享給 5 位成員"], ["question", "要開啟離線模式嗎？", "可在設定中隨時關閉"]];
      let pos = "top-end", sec = 3, auto = true, k = 0, n = 0, seq = 0;
      async function send() {
        const my = ++seq;
        const [icon, title, text] = MSG[k++ % MSG.length];
        nEl.textContent = ++n;
        await Toast.fire({ icon, title, text, position: pos, timer: sec * 1000 });
        if (ctx.active && my === seq && auto) ctx.timeout(send, 500);
      }
      ctx.select("", ["top-start", "top", "top-end", "center", "bottom-start", "bottom", "bottom-end"], pos, (v) => { pos = v; send(); });
      ctx.slider("停留", { min: 1, max: 8, step: 1, value: sec, format: (v) => `${v} 秒` }, (v) => (sec = v));
      ctx.toggle("自動輪播", true, (v) => { auto = v; if (v) send(); });
      ctx.button("發送", send, { primary: true });
      ctx.timeout(send, 150);
    },
  },
  {
    id: "theme", title: "主題與進場動畫",
    api: "Swal.fire({ theme, customClass: { popup, confirmButton }, buttonsStyling: false, showClass, hideClass })",
    desc: "theme 切換內建深色、淺色、跟隨系統；customClass 搭配 buttonsStyling: false 可以整套換成自己的設計。showClass／hideClass 換成自己的 CSS keyframes 就是新的進出場動畫。",
    hint: "右上切換主題與動畫",
    mount(ctx) {
      ctx.html(`<div class="sa-board"><div class="sa-host"></div></div>`);
      const host = ctx.$(".sa-host");
      const fire = dialogs(ctx, host);
      const THEMES = ["深色", "淺色", "跟隨系統", "自訂霓虹"];
      const ANIMS = [["預設", null], ["彈跳", "sa-a-pop"], ["滑入", "sa-a-rise"], ["翻轉", "sa-a-flip"]];
      let theme = 0, anim = 1;
      const open = () => {
        const neon = theme === 3;
        const a = ANIMS[anim][1];
        fire({
          title: "瀑布彩虹一日遊", imageUrl: IMG(5), imageAlt: "瀑布與彩虹",
          html: `<dl class="sa-ticket"><dt>集合</dt><dd>11/16（日）07:30 台北車站</dd><dt>行程</dt><dd>步道 6 公里・約 5 小時</dd><dt>費用</dt><dd>NT$ 1,480（含午餐）</dd></dl>`,
          footer: "含旅遊平安險・出發前 3 天可免費取消",
          showCancelButton: true, confirmButtonText: "立即預訂", cancelButtonText: "再想想",
          theme: ["dark", "light", "auto", "dark"][theme],
          buttonsStyling: !neon,
          customClass: { popup: `sa-coverpop${neon ? " sa-neon" : ""}`, image: "sa-cover", confirmButton: neon ? "sa-neon-btn" : "", cancelButton: neon ? "sa-neon-btn ghost" : "" },
          showClass: a ? { popup: a } : {},
          hideClass: a ? { popup: "sa-a-out" } : {},
        });
      };
      ctx.group(THEMES, theme, (i) => { theme = i; open(); });
      ctx.select("", ANIMS.map(([l], i) => ({ value: i, label: `動畫：${l}` })), anim, (v) => { anim = +v; open(); });
      ctx.timeout(open, 150);
    },
  },
  {
    id: "life", title: "生命週期與計時器",
    api: "Swal.fire({ timer, willOpen, didRender, didOpen, willClose, didClose, didDestroy }); Swal.increaseTimer(ms)",
    desc: "六個生命週期事件依序觸發並記錄相對時間；對話框裡的按鈕直接呼叫 stopTimer、resumeTimer、increaseTimer 與 Swal.update，update 會再觸發一次 didRender。",
    hint: "點對話框裡的按鈕操作計時器・倒數結束時 dismiss 會是 timer",
    mount(ctx) {
      ctx.html(`<div class="sa-board"><div class="sa-host"></div><div class="sa-side"><h4>事件紀錄</h4><div class="sa-log"></div></div></div>`);
      const host = ctx.$(".sa-host"), log = logger(ctx.$(".sa-log"), 30);
      const fire = dialogs(ctx, host);
      let t0 = 0, round = 0;
      const ev = (name) => () => { if (ctx.active) log(`<i>+${Math.round(performance.now() - t0)} ms</i> <b>${name}</b>`); };
      const ICON = ["info", "success", "warning", "question"];
      async function open() {
        t0 = performance.now(); round++;
        let upd = 0;
        log(`<span class="sa-zh">第 ${round} 次開啟</span>`);
        const r = await fire({
          title: "自動關閉倒數", icon: "info", timer: 8000, customClass: { popup: "sa-life" }, timerProgressBar: true, confirmButtonText: "立即完成",
          html: `剩餘 <span class="sa-left">8.0</span> 秒<div class="sa-api"><button data-a="stop">stopTimer()</button><button data-a="resume">resumeTimer()</button><button data-a="inc">increaseTimer(3000)</button><button data-a="upd">update({ title, icon })</button></div>`,
          willOpen: ev("willOpen"), didRender: ev("didRender"), willClose: ev("willClose"), didClose: ev("didClose"), didDestroy: ev("didDestroy"),
          didOpen: (popup) => {
            ev("didOpen")();
            popup.querySelector(".sa-api").addEventListener("click", (e) => {
              const a = e.target.closest("button")?.dataset.a;
              if (!a) return;
              if (a === "stop") Swal.stopTimer();
              if (a === "resume") Swal.resumeTimer();
              if (a === "inc") Swal.increaseTimer(3000);
              if (a === "upd") { upd++; Swal.update({ title: `標題已更新 ${upd} 次`, icon: ICON[upd % ICON.length] }); }
              log(`<span class="sa-zh">按下</span> ${a}・running: ${Swal.isTimerRunning()}`);
            });
          },
        });
        if (r) log(`<span class="sa-zh">結果</span> ${fmtResult(r)}`);
      }
      ctx.interval(() => {
        const el = Swal.getHtmlContainer()?.querySelector(".sa-left");
        if (el) el.textContent = ((Swal.getTimerLeft() || 0) / 1000).toFixed(1);
      }, 100);
      ctx.button("重新開啟", open, { primary: true });
      ctx.timeout(open, 150);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "for (n) { Swal.fire(opts); popup.offsetHeight; Swal.close(); }",
    desc: "SweetAlert2 同一時間只能有一個對話框，所以這裡量的是「連續開關 N 次」的吞吐量：每次建立 DOM、強制排版、再關閉並還原 body 狀態。內容越複雜，每次 fire 的成本越高。",
    hint: "左側按「開始測試」・底部切換內容複雜度",
    mount(ctx) {
      ctx.html(`<div class="sa-board sa-lab"><div class="sa-host"></div></div>`);
      const host = ctx.$(".sa-host");
      const D = Swal.mixin({ ...BASE, target: host, showClass: { popup: "", backdrop: "", icon: "" }, hideClass: { popup: "", backdrop: "", icon: "" } });
      ctx.onCleanup(closeNow);
      let kind = 0;
      const rows = (k) => Array.from({ length: 20 }, (_, i) => `<tr><td>#${k}-${i + 1}</td><td>項目 ${i + 1}</td><td>${(i * 37 + k) % 100} 分</td></tr>`).join("");
      const opts = (k) => [
        { icon: "success", title: `第 ${k} 個對話框`, text: "純文字內容" },
        { icon: "question", title: `第 ${k} 個對話框`, input: "select", inputOptions: { a: "選項 A", b: "選項 B", c: "選項 C" }, showCancelButton: true },
        { title: `第 ${k} 個對話框`, html: `<table class="sa-rows">${rows(k)}</table>`, showCancelButton: true, showDenyButton: true, footer: "20 列表格" },
      ][kind];
      const open = (k) => { D.fire(opts(k)); return Swal.getPopup().offsetHeight; };
      ctx.controls.classList.add("bottom");
      ctx.group(["純文字", "含輸入框", "20 列表格"], 0, (i) => { kind = i; closeNow(); open(0); });
      ctx.bench({
        label: "連續開關", unit: "次", sizes: [10, 25, 50, 100, 250, 500, 1000, 2000],
        run(n) {
          const t = performance.now();
          for (let i = 1; i < n; i++) { open(i); closeNow(); }
          open(n); // leave the last one visible
          return `每次 ${((performance.now() - t) / n).toFixed(2)} ms`;
        },
        note: "動畫已關閉，每次都是 fire 建立彈窗、讀 offsetHeight 強制排版、close 移除並還原 body 的 class 與 aria-hidden。瓶頸在 DOM 建立與排版，不在 JavaScript 邏輯；切到「20 列表格」可以看到內容大小對成本的影響。",
      });
      ctx.timeout(() => open(0), 100);
    },
  },
] });
</script>
</body>
</html>
