<style>
  .sc-scene { background: radial-gradient(80% 60% at 50% 100%, #1d2238, var(--bg) 70%);
    --swiper-theme-color: #f7df1e; --swiper-pagination-bullet-inactive-color: #fff; --swiper-pagination-bullet-inactive-opacity: .35; }
  body.paper .sc-scene { background: radial-gradient(80% 70% at 50% 0%, #ffffff, var(--bg) 75%); --swiper-theme-color: #d97706; }

  /* generic layout (same pattern as the other showcase pages) */
  .board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 12px) 12px calc(var(--sc-ctl-b, 0px) + 34px); display: grid; gap: 12px; }
  .rows { grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
  .fit { container-type: size; display: grid; place-items: center; min-width: 0; min-height: 0; width: 100%; height: 100%; }
  .state { font: 500 11.5px/1.5 var(--mono); color: var(--muted); text-align: center; min-width: 0; }
  .state i { font-style: normal; color: var(--accent); font-variant-numeric: tabular-nums; }
  .ghost { position: absolute; left: 0; top: 0; z-index: 30; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none;
    border: 2px solid var(--accent); background: rgba(247, 223, 30, 0.16); box-shadow: 0 0 0 4px rgba(247, 223, 30, 0.1); opacity: 0; transition: opacity .25s; }
  .ghost::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--accent); }
  .ghost.on { opacity: 1; }
  .pilot { position: absolute; right: 10px; bottom: 8px; z-index: 30; padding: 2px 10px; border-radius: 999px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; transition: opacity .3s; white-space: nowrap; }
  .pilot.off { opacity: 0; }
  .counts { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .counts div { padding: 5px 8px; border-radius: 8px; background: rgba(127, 127, 127, 0.1); min-width: 0; }
  .counts small { display: block; color: var(--muted); font-size: 11px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .counts b { display: block; font: 700 15px/1.3 var(--mono); color: var(--c4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log { font-size: 12px; min-width: 0; }

  .ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

  .bar1 { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px 12px; }

  @media (max-width: 560px) { .sc-seg.fxseg { flex-wrap: wrap; justify-content: flex-end; } }

  /* 2. pagination */
  .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }

  .plab { font: 500 11px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plab b { margin-right: 6px; color: var(--fg); font: 700 12px/1.3 var(--font); }
  .pw { width: 100%; height: 100%; margin: 0; border-radius: 12px; --swiper-pagination-fraction-color: #fff;

  .pw::after { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;

  .pw .ph { border-radius: 0; }

  .pw .swiper-pagination-bullet.num.swiper-pagination-bullet-active { background: #f7df1e; }

  /* 3. navigation & direction */

  .s4 { grid-template-rows: minmax(0, 1fr) auto auto; gap: 8px; }

  .main4 .capt { padding: 40px 18px 16px; }
  .main4 .capt b { font-size: clamp(16px, 3vw, 28px); }
  .chip5 { position: absolute; left: 12px; top: 12px; z-index: 3; padding: 2px 10px; border-radius: 999px; pointer-events: none;
    background: #f7df1e; color: #111; font: 700 11.5px/1.5 var(--font); }
  .cdw { position: absolute; right: 12px; top: 12px; z-index: 10; width: 44px; height: 44px; pointer-events: none; }
  .cdw svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .cdw circle { fill: rgba(0, 0, 0, 0.45); stroke: rgba(255, 255, 255, 0.25); stroke-width: 4; }
  .cdw circle.arc { fill: none; stroke: #f7df1e; stroke-dasharray: 125.66; stroke-linecap: round; }
  .cdw span { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 700 10.5px/1 var(--mono); }
  .th4 { width: 100%; margin: 0; }
  .th4 .swiper-slide { width: 84px; height: 56px; border-radius: 8px; opacity: .45; cursor: pointer; transition: opacity .2s; }
  .th4 .swiper-slide-thumb-active { opacity: 1; outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (max-width: 560px) { .th4 .swiper-slide { width: 66px; height: 44px; } }

  /* 5. virtual */
  .c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  @media (max-width: 560px) { .c5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .c5 div:nth-child(n+4) { display: none; } }
  .vsw { width: 100cqw; height: min(100cqh, 380px); padding-bottom: 30px; margin: 0;
    --swiper-pagination-bottom: 6px; }
  .vsw .swiper-pagination-custom { color: var(--fg); font: 600 12.5px/1.4 var(--mono); }
  .vlab { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 8px; color: #fff; pointer-events: none; background: linear-gradient(transparent, rgba(0, 0, 0, 0.75)); }
  .vlab b { font: 700 13px/1.3 var(--mono); }
  .vlab span { margin-left: 6px; padding: 0 6px; border-radius: 4px; background: #f7df1e; color: #111; font-size: 11px; font-weight: 700; }

  /* 6. free mode + grid */
  .gsw { width: 100%; height: 100%; padding-bottom: 16px; margin: 0;
    --swiper-scrollbar-size: 6px; --swiper-scrollbar-bottom: 2px; --swiper-scrollbar-drag-bg-color: #f7df1e; --swiper-scrollbar-bg-color: rgba(127, 127, 127, 0.25); }
  .gt { border-radius: 10px; display: grid; place-items: center; user-select: none;
    background: linear-gradient(135deg, hsl(var(--h) 75% 60%), hsl(calc(var(--h) + 50) 70% 40%)); }
  .gt b { color: rgba(255, 255, 255, 0.95); font: 800 clamp(14px, 3vw, 26px)/1 var(--mono); text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }

  /* 7. breakpoints */
  .s7 { grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; }
  .bstat { display: grid; gap: 4px; min-width: 0; }
  .lane { container-type: size; display: grid; align-content: center; justify-items: start; min-width: 0; min-height: 0; }
  .bpw { height: min(100cqh, 260px); margin: 0; outline: 1.5px dashed rgba(247, 223, 30, 0.65); outline-offset: 4px; }
  .bpw .ph { border-radius: 10px; }
  .ruler { position: relative; height: 30px; }
  .ruler span { position: absolute; top: 0; bottom: 0; padding: 6px 0 0 4px; overflow: hidden; white-space: nowrap;
    border-left: 1px solid var(--line); border-top: 3px solid rgba(127, 127, 127, 0.35); color: var(--muted); font: 500 10.5px/1.2 var(--mono); }
  .ruler span.cur { border-top-color: var(--accent); color: var(--fg); background: rgba(247, 223, 30, 0.08); }
  .ruler .mark { position: absolute; top: -6px; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); }
  @media (max-width: 560px) { .s7 .log li:nth-child(n+3) { display: none; } }

  /* 8. stress */
  .st-box { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 560px) { .st-box { left: 8px; } }
  .st-sw { flex: none; width: 100%; height: clamp(90px, 34%, 200px); padding-bottom: 24px; margin: 0;
    --swiper-pagination-bottom: 3px; }
  .st-sw .swiper-pagination-custom { color: var(--fg); font: 600 12px/1.4 var(--mono); }
  .st-s { border-radius: 8px; display: grid; place-items: center; color: #fff; font: 800 14px/1 var(--mono);
    background: linear-gradient(135deg, hsl(var(--h) 70% 55%), hsl(calc(var(--h) + 40) 70% 40%)); }
  .st-wrap { flex: 1; min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .st-tab { width: 100%; border-collapse: collapse; font: 500 11px/1.5 var(--mono); font-variant-numeric: tabular-nums; }
  .st-tab th, .st-tab td { padding: 3px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  .st-tab th { position: sticky; top: 0; background: var(--bg-2); color: var(--muted); font: 600 11.5px/1.5 var(--font); }
  .st-tab th:first-child, .st-tab td:first-child { text-align: left; }
  .st-tab .timed { color: var(--accent); }
  .st-tab td.na { color: var(--muted); }
  .st-dom { flex: none; color: var(--muted); font-size: 11.5px; line-height: 1.4; }
  .st-dom b { color: var(--accent); font-family: var(--mono); }
</style>

<script src="https://cdn.jsdelivr.net/npm/swiper@14.3.0/swiper-bundle.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Swiper showcase: effects, pagination, navigation, thumbs, virtual slides, free mode + grid, breakpoints, stress bench.
const h = Showcase.h;
const PHOTOS = [["挪威峽灣", "FJORD"], ["紅岩峽谷", "CANYON"], ["綠谷公路", "VALLEY ROAD"], ["披毯巴哥犬", "PUG"],
  ["瀑布與彩虹", "WATERFALL"], ["深海水母", "JELLYFISH"], ["母獅特寫", "LIONESS"], ["海象群", "WALRUS"]];
const IMG = (i) => `_shared/img/photo-${(i % 8) + 1}.jpg`;
const pad2 = (n) => String(n).padStart(2, "0");
const photo = (i, { cap = true, extra = "" } = {}) => {
  const [zh, en] = PHOTOS[i % 8];
  return `<div class="swiper-slide ph"><img src="${IMG(i)}" alt="${zh}" draggable="false">`
    + (cap ? `<div class="capt"><span>${en}</span><b>${zh}</b></div>` : "") + extra + `</div>`;
};
// Render an options object the way it would be written in source.
const lit = (o) => JSON.stringify(o).replace(/"([a-zA-Z]+)":/g, "$1: ").replace(/,(?=\S)/g, ", ").replace(/\{/g, "{ ").replace(/\}/g, " }");
// destroy() leaves the effect shadow layers behind; remove them so the next effect starts clean.
const wipe = (el) => el.querySelectorAll('[class*="swiper-slide-shadow"], .swiper-cube-shadow').forEach((n) => n.remove());

// One instance that lives as long as the scene.
function make(ctx, el, opts) {
  const s = new Swiper(el, opts);
  ctx.onCleanup(() => { if (!s.destroyed) s.destroy(true, true); });
  return s;
}
// An instance that is destroyed and re-created when options change; keeps the current slide.
function rebuilder(ctx, el, create, start = 0) {
  let s = null;
  const kill = () => { if (s && !s.destroyed) s.destroy(true, true); wipe(el); };
  ctx.onCleanup(kill);
  return {
    build() { const at = s && !s.destroyed ? s.realIndex : start; kill(); s = create(at); return s; },
    get s() { return s; },
  };
}
// Timer-driven demo that stops as soon as a real pointer, wheel or key event arrives and resumes after 6 s.
function autopilot(ctx, every, step, onTake) {
  const chip = ctx.el.appendChild(h("div", { class: "pilot", text: "自動示範中，操作即可接手" }));
  let on = true, resume = 0;
  const take = (e) => {
    if (!e.isTrusted || (e.target.closest && e.target.closest(".controls"))) return;
    if (on && onTake) onTake();
    on = false; chip.classList.add("off");
    clearTimeout(resume);
    resume = setTimeout(() => { if (ctx.active) { on = true; chip.classList.remove("off"); } }, 6000);
  };
  ctx.onCleanup(() => clearTimeout(resume));
  ctx.on(ctx.el, "pointerdown", take, true);
  ctx.on(ctx.el, "wheel", take, true);
  ctx.on(document, "keydown", take);
  ctx.interval(() => { if (on) step(); }, every);
}
const CHEV = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;

const FX = {
  slide: { cls: "", opts: { slidesPerView: "auto", centeredSlides: true, spaceBetween: 16 } },
  fade: { cls: "solo", opts: { effect: "fade", fadeEffect: { crossFade: true } } },
  cube: { cls: "solo", opts: { effect: "cube", cubeEffect: { shadow: true, shadowOffset: 16, shadowScale: 0.9, slideShadows: true } } },
  coverflow: { cls: "", opts: { effect: "coverflow", slidesPerView: "auto", centeredSlides: true,
    coverflowEffect: { rotate: 38, stretch: 0, depth: 160, modifier: 1, slideShadows: true } } },
  flip: { cls: "solo", opts: { effect: "flip", flipEffect: { slideShadows: true, limitRotation: true } } },
  cards: { cls: "solo", opts: { effect: "cards", cardsEffect: { perSlideOffset: 9, perSlideRotate: 3, slideShadows: true } } },
  creative: { cls: "door", opts: { effect: "creative", creativeEffect: {
    prev: { shadow: true, origin: "left center", translate: ["-5%", 0, -200], rotate: [0, 100, 0] },
    next: { origin: "right center", translate: ["5%", 0, -200], rotate: [0, -100, 0] } } } },
};

Showcase.run({ scenes: [
  {
    id: "effects", title: "轉場特效",
    api: 'new Swiper(el, { effect: "coverflow" | "cube" | "flip" | "cards" | … })',
    desc: "同一組八張照片切換 Swiper 內建的七種 effect：一般滑動、交叉淡入、立方體、立體輪播、翻牌、卡片堆疊，以及用 creativeEffect 自訂的開門轉場。切換時 destroy() 舊實例，保留目前張數重建；外部按鈕、圓點與倒數環都接在同一個實例上。",
    hint: "點上方切換特效・拖曳或方向鍵換張・游標停在圖上會暫停自動播放",
    mount(ctx) {
      ctx.html(`<div class="board s1">
        <div class="fit"><div class="swiper fx"><div class="swiper-wrapper">${PHOTOS.map((_, i) => photo(i)).join("")}</div></div></div>
        <div class="bar1">
          <button class="nb prev" type="button" aria-label="上一張">${CHEV("M15 5l-7 7 7 7")}</button>
          <div class="count"><b>01</b> / 08</div><i class="ring" title="autoplayTimeLeft 倒數"></i>
          <button class="nb next" type="button" aria-label="下一張">${CHEV("M9 5l7 7-7 7")}</button>
          <div class="pg"></div>
        </div>
        <code class="cfg"></code></div>`);
      const el = ctx.$(".fx"), cnt = ctx.$(".count b"), ring = ctx.$(".ring"), cfg = ctx.$(".cfg");
      const names = Object.keys(FX);
      let cur = "coverflow";
      const sw = rebuilder(ctx, el, (at) => {
        const fx = FX[cur];
        el.className = `swiper fx ${fx.cls}`;
        cfg.textContent = cfg.title = lit(fx.opts);
        const s = new Swiper(el, {
          ...fx.opts, initialSlide: at, grabCursor: true, rewind: true, speed: 700, keyboard: { enabled: true },
          navigation: { prevEl: ctx.$(".nb.prev"), nextEl: ctx.$(".nb.next") },
          pagination: { el: ctx.$(".pg"), clickable: true },
          autoplay: { delay: 2600, disableOnInteraction: false, pauseOnMouseEnter: true },
          on: {
            slideChange: (s) => { cnt.textContent = pad2(s.realIndex + 1); },
            autoplayTimeLeft: (s, t, p) => ring.style.setProperty("--p", (1 - p).toFixed(3)),
          },
        });
        cnt.textContent = pad2(s.realIndex + 1);
        return s;
      }, 1);
      ctx.group(names, names.indexOf(cur), (i) => { cur = names[i]; sw.build(); }).classList.add("fxseg");
      sw.build();
    },
  },
  {
    id: "pagination", title: "分頁樣式",
    api: "pagination: { type, dynamicBullets, renderBullet, renderCustom }",

    mount(ctx) {
      ctx.html(`<div class="st-box"><div class="swiper st-sw"><div class="swiper-wrapper"></div><div class="swiper-pagination"></div></div>
        <div class="st-wrap"><table class="st-tab"><thead><tr><th>張數</th><th data-m="normal">一般</th><th data-m="virtual">virtual</th><th>倍數</th></tr></thead><tbody></tbody></table></div>
        <div class="st-dom"></div></div>`);
      const el = ctx.$(".st-sw"), wrap = el.querySelector(".swiper-wrapper"), pag = el.querySelector(".swiper-pagination");
      const tbody = ctx.$(".st-tab tbody"), dom = ctx.$(".st-dom");
      const SIZES = [100, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000];
      const MODE_ZH = { normal: "一般", virtual: "virtual" };
      let rec = { normal: {}, virtual: {} }, inst = null, instMode = "", instN = 0, mode = "virtual", runMode = "virtual";
      const num = (n) => n.toLocaleString("en-US");
      const slideHtml = (i) => `<div class="swiper-slide st-s" style="--h:${(i * 37) % 360}"><b>${i + 1}</b></div>`;
      const kill = () => {
        if (inst && !inst.destroyed) inst.destroy(true, true);
        inst = null; instMode = ""; instN = 0;
        wrap.innerHTML = ""; wrap.removeAttribute("style"); pag.innerHTML = "";
      };
      ctx.onCleanup(kill);
      const build = (m, n) => {
        if (m === "virtual") return Array.from({ length: n }, (_, i) => i);
        let html = "";
        for (let i = 0; i < n; i++) html += slideHtml(i);
        return html;
      };
      // Create the instance, jump to the last slide and force layout.
      const create = (m, n, data, jump = true) => {
        const opts = { slidesPerView: 4, spaceBetween: 8, pagination: { el: pag, type: "custom",
          renderCustom: (sw) => `${num(sw.activeIndex + 1)}～${num(Math.min(n, sw.activeIndex + 4))} / ${num(n)}` } };
        if (m === "virtual") opts.virtual = { slides: data, renderSlide: (it, i) => slideHtml(i) };
        else wrap.innerHTML = data;
        inst = new Swiper(el, opts);
        instMode = m; instN = n;
        if (jump) inst.slideTo(n - 1, 0);
        return el.offsetWidth + wrap.lastElementChild.offsetWidth;
      };
      const fmtT = (r) => (r === "skip" ? "略過" : !r ? "未測" : r.ms < 10 ? `${r.ms.toFixed(1)} ms` : r.ms < 1000 ? `${Math.round(r.ms)} ms` : `${(r.ms / 1000).toFixed(2)} s`);
      const ok = (r) => r && r !== "skip";
      const paint = () => {
        ctx.$$(".st-tab th[data-m]").forEach((th) => th.classList.toggle("timed", th.dataset.m === runMode));
        tbody.innerHTML = SIZES.map((n) => {
          const a = rec.normal[n], b = rec.virtual[n];
          const x = ok(a) && ok(b) ? a.ms / Math.max(b.ms, 0.05) : 0;
          const td = (m, r) => `<td class="${m === runMode ? "timed" : ok(r) ? "" : "na"}"${ok(r) ? ` title="DOM 中 ${num(r.dom)} 個 slide"` : ""}>${fmtT(r)}</td>`;
          return `<tr><td>${num(n)}</td>${td("normal", a)}${td("virtual", b)}<td>${x ? `×${x >= 10 ? Math.round(x) : x.toFixed(1)}` : ""}</td></tr>`;
        }).join("");
        dom.innerHTML = inst ? `畫面上的實例：<b>${MODE_ZH[instMode]}</b>・資料 <b>${num(instN)}</b> 張・DOM 中 <b>${num(wrap.children.length)}</b> 個 slide 節點` : "";
      };
      ctx.group(["計時：一般", "計時：virtual"], 1, (i) => {
        mode = i ? "virtual" : "normal";
        if (!runBtn.disabled) { runMode = mode; paint(); }
      });
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "投影片", unit: "張", sizes: SIZES, target: 100, budget: 2000,
        note: "一般模式把 N 張 slide 全部放進 DOM，Swiper 初始化時要逐張設定尺寸、位置與無障礙屬性；virtual 模式只渲染視窗附近幾張，但仍要為全部 N 張計算 snapGrid。計時範圍是建立實例、跳到最後一張並強制排版，不含繪製。另一種模式在準備階段量測（不計入本次計時），上一級超過 1.5 秒的直接略過。",
        prepare(n) {
          kill();
          const other = runMode === "normal" ? "virtual" : "normal";
          const before = rec[other][SIZES[SIZES.indexOf(n) - 1]];
          if (before === "skip" || (before && before.ms > 1500)) rec[other][n] = "skip";
          else {
            const d = build(other, n);
            const t0 = performance.now();
            create(other, n, d);
            rec[other][n] = { ms: performance.now() - t0, dom: wrap.children.length };
            kill();
          }
          paint();
          return build(runMode, n);
        },
        run(n, data) {
          const t0 = performance.now();
          create(runMode, n, data);
          rec[runMode][n] = { ms: performance.now() - t0, dom: wrap.children.length };
          ctx.timeout(paint, 0);
        },
      });
      const runBtn = ctx.$("[data-sc-run]");
      // Registered after bench(), so it runs before the first prepare(): lock the timed mode and clear the table.
      runBtn.addEventListener("click", () => { runMode = mode; rec = { normal: {}, virtual: {} }; paint(); });
      create("virtual", 100, build("virtual", 100), false);
      paint();
    },
  },
] });
</script>
</body>
</html>
