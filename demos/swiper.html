<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiper 示範：三種轉場特效</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.3.0/swiper-bundle.min.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(80% 60% at 50% 100%, #1d2238, var(--bg) 70%); }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 64px 0 50px; }
  header { position: fixed; left: 16px; top: 12px; z-index: 40; max-width: calc(100% - 330px); }
  header h1 { margin: 0; font-size: 18px; font-weight: 900; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  .swiper { width: 100%; padding: 10px 0 !important; }
  .swiper-slide { position: relative; width: min(56vw, 48vh, 300px); aspect-ratio: 4 / 5; border-radius: 18px; overflow: hidden; background: #222;
    box-shadow: 0 24px 50px rgba(0,0,0,.45); }
  .swiper-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .swiper-slide figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; background: linear-gradient(transparent, rgba(0,0,0,.75)); }
  .swiper-slide figcaption b { display: block; font-size: clamp(16px, 2.6vw, 22px); }
  .swiper-slide figcaption span { font: 600 11px var(--mono); color: var(--accent); letter-spacing: .1em; }
  /* per-effect container sizes */
  .swiper.fx-cards { width: min(56vw, 48vh, 300px); }
  .swiper.fx-cards .swiper-slide { width: 100%; }
  .swiper.fx-creative { width: min(86vw, 620px); }
  .swiper.fx-creative .swiper-slide { width: 100%; aspect-ratio: auto; height: min(56vh, 380px); }
  .nav { display: flex; align-items: center; gap: 14px; }
  .nav .btn { width: 40px; height: 40px; padding: 0; border-radius: 50%; font-size: 18px; }
  .nav .btn.swiper-button-disabled { opacity: .35; }
  .meta { min-width: 150px; text-align: center; }
  .meta .count { font: 700 13px var(--mono); }
  .meta .count b { color: var(--accent); }
  .ring { height: 3px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .ring i { display: block; height: 100%; width: calc(var(--p, 0) * 100%); background: var(--accent); }
  #pg { position: static; width: auto; }
  #pg .swiper-pagination-bullet { background: #fff; opacity: .3; }
  #pg .swiper-pagination-bullet-active { background: var(--accent); opacity: 1; }
  @media (max-width: 560px) {
    header { max-width: none; right: 16px; top: 60px; text-align: center; }
    .wrap { padding-top: 110px; }
  }
</style>
</head>
<body>
<header>
  <h1>Swiper 轉場特效</h1>
  <p id="desc">立體輪播：中間放大，兩側往後退並旋轉</p>
</header>
<div class="controls" id="fx">
  <button class="btn" data-fx="coverflow" aria-pressed="true">立體輪播</button>
  <button class="btn" data-fx="cards">卡片堆疊</button>
  <button class="btn" data-fx="creative">開門轉場</button>
</div>

<div class="wrap">
  <div class="swiper" id="sw">
    <div class="swiper-wrapper" id="slides"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prev" aria-label="上一張">‹</button>
    <div class="meta">
      <div class="count"><b id="cur">01</b> / 08</div>
      <div class="ring" id="ring"><i></i></div>
    </div>
    <button class="btn" id="next" aria-label="下一張">›</button>
  </div>
  <div id="pg"></div>
</div>
<div class="hint">拖曳、方向鍵或箭頭切換，游標停留會暫停自動播放</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@14.3.0/swiper-bundle.min.js"></script>
<script>
const PHOTOS = [
  ["挪威峽灣", "FJORD"], ["紅岩峽谷", "CANYON"], ["綠谷公路", "VALLEY ROAD"], ["披毯巴哥犬", "PUG"],
  ["瀑布與彩虹", "WATERFALL"], ["深海水母", "JELLYFISH"], ["母獅特寫", "LIONESS"], ["海象群", "WALRUS"],
];
document.getElementById("slides").innerHTML = PHOTOS.map(([name, en], i) =>
  `<figure class="swiper-slide" style="margin:0"><img src="_shared/img/photo-${i + 1}.jpg" alt="${name}"><figcaption><span>${en}</span><b>${name}</b></figcaption></figure>`
).join("");

// Effect-specific options; the instance is destroyed and rebuilt when switching
const EFFECTS = {
  coverflow: {
    desc: "立體輪播：中間放大，兩側往後退並旋轉",
    opts: { effect: "coverflow", slidesPerView: "auto", centeredSlides: true,
      coverflowEffect: { rotate: 38, stretch: 0, depth: 160, modifier: 1, slideShadows: true } },
  },
  cards: {
    desc: "卡片堆疊：一張張往旁邊甩開，下一張從牌堆浮上來",
    opts: { effect: "cards", cardsEffect: { perSlideOffset: 9, perSlideRotate: 3, slideShadows: true } },
  },
  creative: {
    desc: "開門轉場：以左右邊為軸，像推開一扇門",
    opts: { effect: "creative", creativeEffect: {
      prev: { shadow: true, origin: "left center", translate: ["-5%", 0, -200], rotate: [0, 100, 0] },
      next: { origin: "right center", translate: ["5%", 0, -200], rotate: [0, -100, 0] },
    } },
  },
};

const el = document.getElementById("sw");
const cur = document.getElementById("cur"), ring = document.getElementById("ring");
let swiper = null;
function build(name) {
  const keep = swiper ? swiper.realIndex : 0;
  if (swiper) swiper.destroy(true, true);
  el.className = "swiper fx-" + name;
  document.getElementById("desc").textContent = EFFECTS[name].desc;
  swiper = new Swiper(el, {
    ...EFFECTS[name].opts,
    initialSlide: keep,
    grabCursor: true,
    rewind: true,
    speed: 700,
    keyboard: { enabled: true },
    navigation: { prevEl: "#prev", nextEl: "#next" },
    pagination: { el: "#pg", clickable: true },
    autoplay: { delay: 2800, disableOnInteraction: false, pauseOnMouseEnter: true },
    on: {
      slideChange(s) { cur.textContent = String(s.realIndex + 1).padStart(2, "0"); },
      autoplayTimeLeft(s, time, progress) { ring.style.setProperty("--p", (1 - progress).toFixed(3)); },
    },
  });
  cur.textContent = String(swiper.realIndex + 1).padStart(2, "0");
}
build("coverflow");

document.getElementById("fx").addEventListener("click", (e) => {
  const b = e.target.closest("[data-fx]");
  if (!b) return;
  document.querySelectorAll("#fx .btn").forEach((x) => x.setAttribute("aria-pressed", x === b));
  build(b.dataset.fx);
});
</script>
</body>
</html>
