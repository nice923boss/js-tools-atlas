<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swup 示範：攝影筆記目錄</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .top { position: fixed; left: 16px; top: 14px; z-index: 30; font-weight: 800; font-size: 16px; }
  .top small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }

  /* Swup only toggles classes on <html>; every visual of the transition lives in this CSS. */
  .transition-main { transition: opacity .32s ease, transform .42s cubic-bezier(.2, .8, .2, 1), filter .42s; }
  html.is-animating .transition-main { opacity: 0; }
  html.to-slide.is-leaving .transition-main { transform: translateX(-34px); }
  html.to-slide.is-rendering.is-animating .transition-main { transform: translateX(34px); }
  html.to-zoom.is-leaving .transition-main { transform: scale(.92); filter: blur(6px); }
  html.to-zoom.is-rendering.is-animating .transition-main { transform: scale(1.06); filter: blur(6px); }

  /* Styles for every container, including the ones fetched from assets/swup/. */
  #swup { position: fixed; inset: 56px 16px 112px; display: grid; gap: 14px; }
  .ph { display: block; margin: 0; border-radius: 12px; background: #1d2230 center / cover no-repeat; min-height: 0; }
  .index { grid-template-columns: repeat(3, 1fr); }
  .post { display: flex; flex-direction: column; gap: 10px; color: var(--fg); text-decoration: none; min-height: 0; padding: 8px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); }
  .post .ph { flex: 1; }
  .post:hover { border-color: var(--accent); }
  .txt small { color: var(--accent); font: 600 11px var(--mono); letter-spacing: .06em; }
  .post b { display: block; font-size: 17px; margin: 2px 0; }
  .post em { font-style: normal; color: var(--muted); font-size: 12px; }
  .article { grid-template-columns: 1.5fr 1fr; }
  .article .txt { display: flex; flex-direction: column; justify-content: center; gap: 8px; min-width: 0; }
  .article h2 { margin: 0; font-size: clamp(22px, 3.4vw, 32px); }
  .article p { margin: 0; color: #cfcdc4; font-size: 14px; line-height: 1.7; }
  .article nav { display: flex; gap: 8px; margin-top: 6px; }
  .article nav a { color: var(--fg); text-decoration: none; font-size: 13px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
  .article nav a:last-child { color: var(--accent-ink); background: var(--accent); border-color: transparent; font-weight: 700; }

  .foot { position: fixed; left: 16px; right: 16px; bottom: 52px; z-index: 30; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; }
  .seg { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
  .seg .btn { padding: 6px 10px; font-size: 12px; }
  .cls { display: flex; gap: 4px; flex-wrap: wrap; font: 11px/1 var(--mono); color: var(--muted); align-items: center; }
  .cls span { padding: 5px 7px; border-radius: 6px; border: 1px solid var(--line); opacity: .45; transition: opacity .15s, background .15s; }
  .cls span.on { opacity: 1; background: var(--c6); color: #0e1013; border-color: transparent; }
  .cache { margin-left: auto; font-size: 12px; color: var(--muted); }
  .cache b { color: var(--c4); }

  @media (max-width: 620px) {
    .top small { display: none; }
    #swup { inset: 52px 10px 150px; gap: 8px; }
    .index { grid-template-columns: 1fr; }
    .post { flex-direction: row; padding: 6px; gap: 10px; align-items: center; }
    .post .ph { flex: 0 0 42%; align-self: stretch; }
    .article { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .article p { font-size: 12px; line-height: 1.55; }
    .article nav a { padding: 6px 10px; }
    .foot { left: 10px; right: 10px; bottom: 46px; gap: 8px; }
    .cls { order: 3; width: 100%; }
    .cls span { padding: 4px 5px; font-size: 10px; }
  }
</style>
</head>
<body data-swup-history="replace" data-swup-animation="fade">
<div class="top">攝影筆記<small>Swup 4</small></div>
<div class="controls">
  <button class="btn" id="auto" aria-pressed="true">自動導覽</button>
  <button class="btn primary" id="replay">重播</button>
</div>

<main id="swup" class="transition-main index">
  <a class="post" href="assets/swup/fjord.html"><span class="ph" style="background-image:url(_shared/img/photo-1.jpg)"></span>
    <span class="txt"><small>No.01 挪威</small><b>峽灣的早晨</b><em>霧散之前的二十分鐘</em></span></a>
  <a class="post" href="assets/swup/waterfall.html"><span class="ph" style="background-image:url(_shared/img/photo-5.jpg)"></span>
    <span class="txt"><small>No.02 冰島</small><b>瀑布下的彩虹</b><em>背光站位才看得到</em></span></a>
  <a class="post" href="assets/swup/jellyfish.html"><span class="ph" style="background-image:url(_shared/img/photo-6.jpg)"></span>
    <span class="txt"><small>No.03 水族館</small><b>慢動作的水母</b><em>藍底上的一抹橘</em></span></a>
</main>

<div class="foot">
  <div class="seg">轉場
    <button class="btn" data-anim="fade" aria-pressed="true">淡入</button>
    <button class="btn" data-anim="slide" aria-pressed="false">滑動</button>
    <button class="btn" data-anim="zoom" aria-pressed="false">縮放</button>
  </div>
  <div class="cls" id="cls">&lt;html&gt;</div>
  <div class="cache">快取 <b id="cache">0</b> 頁<span id="src"></span></div>
</div>
<div class="hint">點文章換頁，下方可看 html 上的 class 變化</div>

<script src="https://cdn.jsdelivr.net/npm/swup@4.10.0/dist/Swup.umd.js"></script>
<script>
// Swup fetches the next page, swaps #swup and drives the transition by toggling classes on <html>.
const ANIMS = ["fade", "slide", "zoom"];
const CLASSES = ["is-changing", "is-leaving", "is-animating", "is-rendering"];
const pages = ["swup.html", "assets/swup/fjord.html", "assets/swup/waterfall.html", "assets/swup/jellyfish.html"]
  .map((p) => new URL(p, location.href).href);
const autoBtn = document.getElementById("auto");
let auto = true, userAnim = false, animIdx = 0, timer = null;

const swup = new Swup({ containers: ["#swup"] });

// Live readout of the classes Swup puts on <html>.
const clsEl = document.getElementById("cls");
clsEl.innerHTML = "&lt;html&gt;" + [...CLASSES, "to-"].map((c) => `<span data-c="${c}">${c}</span>`).join("");
const toChip = clsEl.querySelector('[data-c="to-"]');
new MutationObserver(() => {
  const list = document.documentElement.classList;
  CLASSES.forEach((c) => clsEl.querySelector(`[data-c="${c}"]`).classList.toggle("on", list.contains(c)));
  const to = [...list].find((c) => c.startsWith("to-"));
  toChip.classList.toggle("on", !!to);
  if (to) toChip.textContent = to;
}).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });

function setAnim(name) {
  document.body.dataset.swupAnimation = name;
  document.querySelectorAll("[data-anim]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.anim === name));
}

swup.hooks.on("page:load", (visit, { cache }) => {
  document.getElementById("src").textContent = cache ? "，這頁來自快取" : "，這頁剛從網路抓取";
});
swup.hooks.on("visit:end", () => {
  document.getElementById("cache").textContent = swup.cache.size;
  if (auto) schedule();
});

// Auto tour: visit the pages in order and switch the transition style on every hop.
function schedule() {
  clearTimeout(timer);
  timer = setTimeout(() => {
    const here = pages.findIndex((u) => u.split("#")[0] === location.href.split("#")[0]);
    if (!userAnim) setAnim(ANIMS[animIdx++ % ANIMS.length]);
    swup.navigate(pages[(here + 1) % pages.length], { history: "replace", animation: document.body.dataset.swupAnimation });
  }, 2600);
}
function setAuto(on) {
  auto = on;
  autoBtn.setAttribute("aria-pressed", on);
  on ? schedule() : clearTimeout(timer);
}

swup.hooks.on("link:click", (visit, { event }) => { if (event.isTrusted) setAuto(false); });
document.querySelectorAll("[data-anim]").forEach((b) => b.addEventListener("click", () => { userAnim = true; setAnim(b.dataset.anim); }));
autoBtn.addEventListener("click", () => setAuto(!auto));
document.getElementById("replay").addEventListener("click", () => {
  userAnim = false; animIdx = 0;
  setAnim("fade");
  setAuto(true);
  if (location.href.split("#")[0] !== pages[0]) { clearTimeout(timer); swup.navigate(pages[0], { history: "replace", animation: "fade" }); }
});

// Warm the image cache so fetched pages paint instantly.
[5, 6].forEach((i) => { new Image().src = `_shared/img/photo-${i}.jpg`; });
schedule();
</script>
</body>
</html>
