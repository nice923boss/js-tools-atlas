<style>
  .pad { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Shell: a small site (nav bar + viewport) beside an explanation panel; #<uid>-swup is the Swup container. */
  .lay { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 10px; }
  .site { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-2); overflow: hidden; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-bottom: 1px solid var(--line); min-width: 0; }
  .bar nav { display: flex; gap: 2px; flex: none; }
  .bar nav a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 8px; }
  .bar nav a:hover { color: var(--fg); }
  .bar nav a.on { color: var(--fg); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
  .addr { margin-left: auto; min-width: 0; font: 11px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vp { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .vp > main { position: absolute; inset: 8px; display: grid; gap: 8px; min-height: 0; }

  /* Route pages (fetched from assets/swup/) */
  .vp .ph, .zov { background-color: #1d2230; background-position: center; background-size: cover; background-repeat: no-repeat; }
  .vp .toc, .vp .gal { grid-template-rows: auto minmax(0, 1fr); }
  .vp .pg header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .vp .pg h2 { margin: 0; font-size: 18px; }
  .vp .pg header p { margin: 0; color: var(--muted); font-size: 12px; }
  .vp .pg header > a { margin-left: auto; color: var(--fg); font-size: 12px; text-decoration: none; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .vp .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 8px; min-height: 0; }
  .vp .card { position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px 10px; border-radius: 12px; overflow: hidden; color: #fff; text-decoration: none; min-width: 0; min-height: 0; }
  .vp .card .ph { position: absolute; inset: 0; }
  .vp .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 40%, rgba(0, 0, 0, .75)); }
  .vp .card b, .vp .card small { position: relative; z-index: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .vp .card b { font-size: 14px; }
  .vp .card small { color: #f7df1e; font-size: 11px; font-weight: 700; }
  .vp .post { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .vp .hero { margin: 0; border-radius: 12px; min-height: 0; }
  .vp .txt { position: relative; overflow: auto; min-height: 0; font-size: 13px; line-height: 1.6; padding-right: 4px; }
  .vp .txt small { color: var(--accent); font: 600 11px var(--mono); }
  .vp .txt h2 { margin: 2px 0 6px; font-size: clamp(18px, 2.6vw, 24px); line-height: 1.25; }
  .vp .txt p { margin: 0 0 8px; }
  .vp .txt .jump { color: var(--accent); }
  .vp .txt aside { margin-top: 260px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
  .vp .txt aside.flash { animation: flash 1.4s; }
  @keyframes flash { 0%, 60% { box-shadow: 0 0 0 3px var(--accent); } }
  .vp .pnav { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
  .vp .pnav a { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .vp .pnav a:last-child { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .vp .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .vp .tabs a { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; font-size: 12px; }
  .vp .tabs a.on { color: var(--accent-ink); background: var(--accent); border-color: transparent; }
  .vp .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 6px; min-height: 0; }
  .vp .grid figure { position: relative; margin: 0; border-radius: 10px; overflow: hidden; min-height: 0; }
  .vp figcaption { position: absolute; left: 8px; bottom: 8px; padding: 3px 9px; border-radius: 999px; background: rgba(14, 16, 19, .78); color: #fff; font-size: 12px; }
  .vp .keep { display: none; }
  .b1 .vp .keep { display: inline-flex; align-items: center; gap: 6px; flex: none; padding: 3px 9px; border-radius: 999px; background: rgba(14, 16, 19, .82); color: #fff; font: 12px var(--mono); }
  .keep i { width: 8px; height: 8px; border-radius: 50%; background: #7bd389; animation: beat 1s infinite; }
  @keyframes beat { 50% { opacity: .25; } }
  .lay.fx .vp > main.transition-main { transition: opacity .28s; }
  html.is-animating .lay.fx .vp > main.transition-main { opacity: 0; }
  .zov { position: absolute; z-index: 4; border-radius: 12px; pointer-events: none; }

  /* Side panel */
  .side { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); font-size: 12px; overflow: hidden; }
  .sh { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .04em; flex: none; }
  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; min-height: 0; overflow: hidden; }
  .log li { display: flex; align-items: baseline; gap: 6px; padding: 2px 7px; border-left: 3px solid var(--line); border-radius: 3px; background: var(--bg-2); white-space: nowrap; overflow: hidden; flex: none; }
  .log li code { font: 12px var(--mono); }
  .log li span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .log li .ms { margin-left: auto; color: var(--muted); font: 11px var(--mono); }
  .log li.on { border-color: var(--c6); }
  .log li.lv { border-color: var(--c5); }
  .log li.en { border-color: var(--c2); }
  .route { color: var(--muted); line-height: 1.5; flex: none; }
  .route b { color: var(--fg); }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; flex: none; }
  .chips span { padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); font-size: 11px; opacity: .45; transition: opacity .15s, background .15s; }
  .chips span.on { opacity: 1; background: var(--c6); color: #0e1013; border-color: transparent; }

  /* 1. CSS classes on html */
  .b1 .vp > main.transition-main { transition: opacity .35s ease, transform .4s cubic-bezier(.2, .8, .2, 1), filter .4s; }
  html.is-animating .b1 .vp > main.transition-main { opacity: 0; }
  html.to-slide.is-leaving .b1 .vp > main.transition-main { transform: translateX(-40px); }
  html.to-slide.is-rendering.is-animating .b1 .vp > main.transition-main { transform: translateX(40px); }
  html.to-zoom.is-leaving .b1 .vp > main.transition-main { transform: scale(.94); filter: blur(6px); }
  html.to-zoom.is-rendering.is-animating .b1 .vp > main.transition-main { transform: scale(1.05); filter: blur(6px); }

  /* 2. JS rules */
  .b2 .vp { perspective: 900px; }
  .rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; flex: none; }
  .rules li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); transition: background .2s, border-color .2s; }
  .rules li code { font: 600 12px var(--mono); }
  .rules li span { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rules li em { font: 11px var(--mono); font-style: normal; color: var(--muted); }
  .rules li.hit { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, transparent); }

  /* 3. parallel */
  .b3 .vp > main { transition: transform .5s cubic-bezier(.65, 0, .35, 1), opacity .5s; }
  .b3 .vp > main.is-previous-container { transform: translateX(-100%); opacity: .2; }
  .b3 .vp > main.is-next-container { transform: translateX(100%); }
  html.is-animating .b3.seq .vp > main { opacity: 0; transform: translateX(-12%); }
  html.is-rendering.is-animating .b3.seq .vp > main { transform: translateX(12%); }
  .b3.kp .vp > main.is-kept-container { transform-origin: 100% 100%; transform: translateX(calc((var(--swup-parallel-container) - 1) * -28%)) scale(.26); opacity: 1; pointer-events: none; z-index: 2; border-radius: 8px; box-shadow: 0 0 0 8px var(--accent); background: var(--bg-2); }
  .b3.kp .vp > main.is-removing-container { opacity: 0; }
  .gantt { display: flex; flex-direction: column; gap: 6px; flex: none; }
  .gantt .tr { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
  .gantt .tk { position: relative; height: 14px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .gantt .tk i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; border-radius: 4px; transition: left .3s, width .3s; }
  .gantt .r i { background: var(--c6); }
  .gantt .l i { background: var(--c5); }
  .gantt .e i { background: var(--c2); }
  .gantt .ax { display: flex; justify-content: space-between; margin-left: 46px; font: 10px var(--mono); color: var(--muted); }
  .total { font-size: 12px; flex: none; }
  .total b { font: 700 16px var(--mono); }

  /* 4. View Transitions */
  .b4 .vp { view-transition-name: sw-vp; }
  :root:has(.lay.b4) { view-transition-name: none; }
  ::view-transition-old(sw-vp), ::view-transition-new(sw-vp) { animation-duration: .35s; }
  html.to-slide::view-transition-old(sw-vp) { animation: .42s cubic-bezier(.7, 0, .3, 1) both vt-out; }
  html.to-slide::view-transition-new(sw-vp) { animation: .42s cubic-bezier(.7, 0, .3, 1) both vt-in; }
  @keyframes vt-out { to { transform: translateX(-30%); opacity: 0; } }
  @keyframes vt-in { from { transform: translateX(30%); opacity: 0; } }
  html.to-circle::view-transition-old(sw-vp) { animation: none; }
  html.to-circle::view-transition-new(sw-vp) { animation: .6s cubic-bezier(.2, .8, .2, 1) both vt-circle; }
  @keyframes vt-circle { from { clip-path: circle(0 at var(--vx, 50%) var(--vy, 50%)); } to { clip-path: circle(150% at var(--vx, 50%) var(--vy, 50%)); } }
  ::view-transition-group(sw-hero) { animation-duration: .5s; border-radius: 12px; overflow: hidden; }
  ::view-transition-old(sw-hero), ::view-transition-new(sw-hero) { height: 100%; object-fit: cover; }

  /* 5. preload and cache */
  .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; flex: none; }
  .cell { padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); font-size: 11px; line-height: 1.35; min-width: 0; }
  .cell b { display: block; font-weight: 600; white-space: nowrap; }
  .cell span { display: block; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cell[data-s="pending"] { border-color: var(--c5); }
  .cell[data-s="fulfilled"] { border-color: var(--c4); background: color-mix(in srgb, var(--c4) 12%, transparent); }
  .cell.cur { box-shadow: inset 0 0 0 2px var(--accent); }
  .totals { display: flex; gap: 4px 10px; flex-wrap: wrap; flex: none; }
  .totals b { font: 700 14px var(--mono); }
  .pnote { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .srow { display: flex; gap: 6px; flex-wrap: wrap; flex: none; }
  .srow .btn { font-size: 12px; padding: 5px 9px; }

  /* 6. fragments */
  .b6 .vp .grid, .b6 .vp .tabs { transition: opacity .3s, transform .3s; }
  .b6 .vp .grid.is-animating { opacity: 0; transform: translateY(10px); }
  .b6 .vp .tabs.is-animating { opacity: .3; }

  /* 7. progress, abort and errors */
  .site > .sw-progress { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background-color: var(--accent); z-index: 20; }
  .pstatus { line-height: 1.5; min-height: 3em; flex: none; }
  .pstatus b { color: var(--fg); }
  .plinks { display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .plinks a { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 7px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 12px; min-width: 0; }
  .plinks a:hover { background: var(--bg-2); }
  .plinks a i { font: 600 11px var(--mono); font-style: normal; color: var(--muted); }
  .plinks a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .plinks a em { margin-left: auto; font-style: normal; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .plinks a[data-state="taken"] { border-color: var(--c4); }
  .plinks a[data-state="taken"] em { color: var(--c4); }
  .plinks a[data-state="passed"] { border-color: var(--c5); }
  .plinks a[data-state="passed"] em { color: var(--c5); }
  .plinks a[data-state="error"] { border-color: var(--c3); }
  .plinks a[data-state="error"] em { color: var(--c3); }
  .pall { display: flex; flex-direction: column; padding: 3px; border-radius: 9px; border: 1px dashed var(--muted); }

  /* 8. stress */
  .stress-vis { position: absolute; inset: 8px 8px 8px 350px; display: flex; flex-direction: column; gap: 8px; padding-bottom: var(--sc-ctl-b, 0px); overflow: hidden; }
  .stress-vis .sinfo { font-size: 12px; color: var(--muted); }
  .bwrap { position: relative; flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--bg-2); overflow: hidden; }
  .bwrap .vp { position: absolute; inset: 0; }
  .vp > main.bench { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px; overflow: hidden; }
  .bench i { width: 6px; height: 6px; border-radius: 1px; background: var(--c2); }
  .bench.b i { background: var(--c4); }

  @media (max-width: 760px) {
    .lay { grid-template-columns: minmax(0, 1fr) 168px; }
    .side { font-size: 11px; padding: 8px; gap: 6px; }
    .log li { padding: 1px 6px; }
    .log li code { font-size: 11px; }
    .b5 .pnote, .b5 .log li .ms { display: none; }
    .pstatus { min-height: 0; }
    .plinks { gap: 3px; }
    .plinks a { padding: 2px 6px; font-size: 11px; }
    .pall { padding: 2px; }
    .rules li { padding: 3px 7px; }
    .vp .pg header p { display: none; }
    .stress-vis { inset: 8px; }
  }
  @media (max-width: 520px) {
    .lay { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; gap: 8px; }
    .side { max-height: 112px; }
    .b5 .side { max-height: 172px; }
    .b7 .side { max-height: 168px; }
    .sh, .addr, .pnote, .b2 .route, .b3 .log, .b6 .log { display: none; }
    .bar nav a { padding: 5px 7px; }
    .log { flex-direction: row; flex-wrap: wrap; }
    .log li .ms { display: none; }
    .rules { flex-direction: row; flex-wrap: wrap; }
    .rules li { display: flex; padding: 3px 7px; }
    .rules li span { display: none; }
    .plinks { display: grid; grid-template-columns: 1fr 1fr; }
    .pall { display: contents; }
    .plinks a em { display: none; }
    .vp .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); }
    .vp .post { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, .8fr) minmax(0, 1fr) auto; }
    .vp .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .vp .txt aside { margin-top: 160px; }
  }
</style>

<script src="https://cdn.jsdelivr.net/npm/swup@4.10.0/dist/Swup.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@swup/js-plugin@3.2.0/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@swup/route-name-plugin@4.1.0/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@swup/parallel-plugin@0.4.0/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@swup/preload-plugin@3.2.12/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@swup/fragment-plugin@1.3.1/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@swup/progress-plugin@3.2.0/dist/index.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Swup 4: every scene mounts a small site whose Swup container lives inside the stage.
// Route pages are real same-origin HTML files in assets/swup/; the address bar is restored after each visit.
const { fmt, fmtMs, h } = Showcase;
const BASE = location.href.split("#")[0], TITLE = document.title, ROOT = new URL(".", BASE).href;
const DIR = new URL("assets/swup/", BASE).href, R = (n) => `${DIR}${n}.html`;
const IMG = (n) => new URL(`_shared/img/photo-${n}.jpg`, BASE).href;
// Path patterns (path-to-regexp syntax) need the literal directory escaped.
const P = new URL(DIR).pathname.replace(/[:()*?+{}\\]/g, "\\$&");
const POSTS = ["fjord", "canyon", "road", "waterfall", "jellyfish", "lioness"];
const POST = `${P}:slug(${POSTS.join("|")}).html`;
const NAMES = { index: "目錄", fjord: "峽灣", canyon: "峽谷", road: "公路", waterfall: "瀑布", jellyfish: "水母", lioness: "母獅", gallery: "相簿", "gallery-land": "相簿・風景", "gallery-animal": "相簿・動物", "gallery-sea": "相簿・海洋" };
const NAV = [["index", "目錄"], ["fjord", "峽灣"], ["jellyfish", "水母"], ["gallery", "相簿"]];
const E1 = "cubic-bezier(.7, 0, .3, 1)", E2 = "cubic-bezier(.2, .8, .2, 1)";
const slugOf = (u) => String(u || "").split(/[?#]/)[0].split("/").pop().replace(/\.html$/, "");
const pathOf = (slug) => new URL(R(slug)).pathname;
const nameOf = (u) => NAMES[slugOf(u)] || slugOf(u);
const nextOf = (slug) => { const i = POSTS.indexOf(slug); return i >= 0 ? POSTS[(i + 1) % POSTS.length] : slug === "index" ? "fjord" : "index"; };
// A promise that never settles: parks work whose scene is gone.
const halt = () => new Promise(() => {});
let SEQ = 0, LIVE = null;

// Swup leaves a few promises without a catch (page load, aborted visits); those are expected here.
window.addEventListener("unhandledrejection", (e) => {
  const r = e.reason;
  if (r && (r.name === "FetchError" || r.name === "AbortError" || /\[swup\]|Request (timed out|aborted)|Server error|Empty response|HTTP \d+|property '(html|status)'|[Tt]ransition|skipped/.test(r.message || ""))) e.preventDefault();
});

// Route pages reference their photos through class names ph1..ph8.
document.head.append(h("style", { text: [1, 2, 3, 4, 5, 6, 7, 8].map((n) => `.ph${n}{background-image:url("${IMG(n)}")}`).join("") }));
[1, 2, 3, 4, 5, 6, 7, 8].forEach((n) => { new Image().src = IMG(n); });

function restore(id) {
  const want = `${BASE}#${id}`;
  if (location.href !== want) { try { history.replaceState(null, "", want); } catch { /* sandboxed */ } }
  document.title = TITLE;
}
const strip = () => { const c = document.documentElement.classList; [...c].filter((x) => /^(is-|to-|from-|swup-)/.test(x)).forEach((x) => c.remove(x)); };
const idle = (s) => !s.busy && !!s.swup && !s.swup.navigating;
const clickLink = (a) => a.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, button: 0, view: window }));
function whenIdle(s, fn) { if (idle(s)) fn(); else s.ctx.timeout(() => whenIdle(s, fn), 60); }
function logRow(ol, kids, cls, max, top = false) {
  const li = h("li", { class: cls || null }, ...kids.filter(Boolean));
  if (top) ol.prepend(li); else ol.append(li);
  while (ol.children.length > max) (top ? ol.lastElementChild : ol.firstElementChild).remove();
  return li;
}
const ms = (t) => h("span", { class: "ms" }, `+${Math.round(performance.now() - t)}ms`);
// Ids and persist keys get a per-scene prefix; relative links become absolute so they survive the restored URL.
function rewrite(uid, html, base) {
  return html
    .replace(/ id="([^"]+)"/g, ` id="${uid}-$1"`)
    .replace(/ data-swup-persist="([^"]+)"/g, ` data-swup-persist="${uid}-$1"`)
    .replace(/ href="([^"]*)"/g, (m, v) => ` href="${new URL(v, base).href}"`);
}

// Stop an instance for good: no late history writes, no class changes, no hook callbacks.
function kill(s) {
  const sw = s.swup;
  if (!sw) return;
  s.swup = null;

        note: "頁面事先用 swup.cache.set() 放進快取，不經過網路。計時包含解析 HTML、替換容器、更新網址與排版；不含繪製。",
      });
    },
  },
] });
