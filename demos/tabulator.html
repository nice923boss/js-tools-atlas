<script>
const { fmt, fmtMs, fmtCompact } = Showcase;

// Deterministic pseudo-random numbers so the sample data is stable between loads
function mulberry32(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];
const pad2 = (n) => String(n).padStart(2, "0");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sumOf = (rows, key) => rows.reduce((s, r) => s + (+r[key] || 0), 0);

const SURNAMES = [..."陳林黃張李王吳劉蔡楊許鄭謝郭洪曾邱廖賴周"];
const GIVEN = ["怡君", "冠宇", "雅婷", "柏翰", "佳穎", "子軒", "欣怡", "承恩", "佩珊", "宗翰", "雅雯", "家豪", "宜蓁", "俊宏", "詩涵", "柏睿", "郁婷", "志明", "怡安", "品妤"];
const person = (r) => pick(r, SURNAMES) + pick(r, GIVEN);
const CITIES = ["臺北市", "新北市", "桃園市", "臺中市", "臺南市", "高雄市", "新竹市", "宜蘭縣", "花蓮縣"];

// [store, city, region, manager, status]
const STORES = [
  ["臺北信義店", "臺北市", "北區", "林怡君", "營運中"], ["臺北西門店", "臺北市", "北區", "陳冠宇", "營運中"],
  ["新北板橋店", "新北市", "北區", "張雅婷", "營運中"], ["新北淡水店", "新北市", "北區", "王柏翰", "整修中"],
  ["桃園中壢店", "桃園市", "北區", "李佳穎", "營運中"], ["新竹巨城店", "新竹市", "北區", "黃子軒", "新開幕"],
  ["基隆廟口店", "基隆市", "北區", "吳欣怡", "營運中"], ["臺中逢甲店", "臺中市", "中區", "劉承恩", "營運中"],
  ["臺中勤美店", "臺中市", "中區", "蔡佩珊", "營運中"], ["彰化鹿港店", "彰化縣", "中區", "楊宗翰", "營運中"],
  ["南投日月潭店", "南投縣", "中區", "許雅雯", "新開幕"], ["苗栗頭份店", "苗栗縣", "中區", "鄭家豪", "營運中"],
  ["臺南安平店", "臺南市", "南區", "謝宜蓁", "營運中"], ["臺南中西店", "臺南市", "南區", "郭俊宏", "整修中"],
  ["高雄駁二店", "高雄市", "南區", "洪詩涵", "營運中"], ["高雄巨蛋店", "高雄市", "南區", "邱柏睿", "營運中"],
  ["嘉義文化店", "嘉義市", "南區", "曾郁婷", "營運中"], ["屏東墾丁店", "屏東縣", "南區", "廖志明", "新開幕"],
  ["宜蘭羅東店", "宜蘭縣", "東區", "賴怡安", "營運中"], ["花蓮東大門店", "花蓮縣", "東區", "周品妤", "營運中"],
  ["臺東鐵花店", "臺東縣", "東區", "蕭宇翔", "整修中"],
];
const rateOf = (target, actual) => (target > 0 ? Math.round((actual / target) * 1000) / 10 : 0);
const rateColor = (v) => (v >= 100 ? "#2f9e55" : v >= 85 ? "#e0a21b" : "#d64545");
const STATUS_CLASS = { "營運中": "ok", "整修中": "fix", "新開幕": "new", "已出貨": "ok", "待付款": "fix", "處理中": "new", "已取消": "off" };
const pill = (cell) => `<span class="tb-pill ${STATUS_CLASS[cell.getValue()] || ""}">${esc(cell.getValue())}</span>`;

function storeRows() {
  const rand = mulberry32(20260930);
  return STORES.map(([store, city, region, manager, status], i) => {
    const target = 80 + Math.round(rand() * 14) * 10;
    const factor = status === "整修中" ? 0.55 + rand() * 0.3 : 0.78 + rand() * 0.42;
    const actual = Math.round(target * factor);
    return { id: i + 1, store, city, region, manager, target, actual, rate: rateOf(target, actual), stars: 3 + Math.round(rand() * 2), status };
  });
}

// Shared Traditional Chinese locale for every table on this page
const BASE = {
  locale: "zh-tw",
  langs: {
    "zh-tw": {
      data: { loading: "載入中", error: "載入失敗" },
      groups: { item: "筆", items: "筆" },
      pagination: {
        page_size: "每頁", page_title: "顯示頁面", first: "第一頁", first_title: "第一頁", last: "最末頁", last_title: "最末頁",
        prev: "上一頁", prev_title: "上一頁", next: "下一頁", next_title: "下一頁", all: "全部",
        counter: { showing: "顯示", of: "／共", rows: "筆", pages: "頁" },
      },
      headerFilters: { default: "篩選…", columns: {} },
    },
  },
};

// ---------- scene 2 data ----------
const ACT_TYPES = ["講座", "工作坊", "市集", "導覽", "運動"];
const ACTS = [["親子共讀", "講座"], ["手沖咖啡", "工作坊"], ["二手市集", "市集"], ["老街導覽", "導覽"], ["晨間瑜珈", "運動"], ["植栽交換", "市集"], ["攝影入門", "工作坊"], ["竹編體驗", "工作坊"], ["社區路跑", "運動"], ["防詐講座", "講座"], ["古蹟巡禮", "導覽"]];
function actRows() {
  const r = mulberry32(1107);
  const rows = ACTS.map(([name, type], i) => {
    const paid = r() > 0.45;
    return { id: i + 1, name, type, date: `2026-11-${pad2(2 + i * 2)}`, cap: 20 + Math.round(r() * 8) * 10, paid, fee: paid ? 100 + Math.round(r() * 8) * 50 : 0, stars: 3 + Math.round(r() * 2), note: i === 1 ? "自備馬克杯" : "" };
  });
  // Three deliberately invalid values so validation has something to flag
  rows[2].cap = 0; rows[5].name = ""; rows[8].date = "2027-01-15";
  return rows;
}
const inDateRange = (cell, value, p) => typeof value === "string" && value >= p.min && value <= p.max;
const feeCheck = (cell, value) => !cell.getRow().getData().paid || +value > 0;

// ---------- scene 3 data ----------
const GOODS = [["阿里山烏龍茶", "A"], ["鳳梨酥禮盒", "B"], ["客家擂茶", "A"], ["太陽餅", "B"], ["檜木杯墊", "C"], ["洛神花茶", "A"], ["牛軋糖", "B"], ["藍染手帕", "C"], ["日月潭紅茶", "A"], ["花生糖", "B"], ["交趾陶小物", "C"], ["蜜香紅茶", "A"]];
const WRAP_COLORS = ["#c0392b", "#d68910", "#1e8449", "#2471a3", "#7d3c98", "#a04000", "#117a65"];
function goodsRows() {
  const r = mulberry32(88);
  return GOODS.map(([name, cat], i) => {
    let v = 20 + r() * 20;
    const trend = Array.from({ length: 12 }, () => Math.round((v = Math.max(4, v + (r() - 0.45) * 9))));
    return { id: i + 1, name, cat, price: 120 + Math.round(r() * 38) * 25, stock: Math.round(r() * 200), rating: 2 + Math.round(r() * 3), hot: r() > 0.6, level: 1 + Math.floor(r() * 3), color: pick(r, WRAP_COLORS), online: r() > 0.3, trend };
  });
}
function spark(values, w = 86, h = 22) {
  const max = Math.max(...values), min = Math.min(...values);
  const pts = values.map((v, i) => `${(1 + (i / (values.length - 1)) * (w - 2)).toFixed(1)},${(h - 2 - ((v - min) / (max - min || 1)) * (h - 4)).toFixed(1)}`).join(" ");
  const up = values[values.length - 1] >= values[0];
  return `<svg class="tb-spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up ? "#2f9e55" : "#d64545"}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

// ---------- scene 4 data ----------
function salesRows() {
  const r = mulberry32(4242);
  const rows = [];
  STORES.forEach(([store, city, region], i) => ["7 月", "8 月", "9 月"].forEach((month, j) => {
    rows.push({ id: i * 3 + j + 1, region, city, store, month, amount: 60 + Math.round(r() * 90), orders: 300 + Math.round(r() * 900) });
  }));
  return rows;
}
function orgTree() {
  const r = mulberry32(31);
  const DEPTS = [["營運部", ["北區營運組", "中南區營運組", "物流組"]], ["研發部", ["產品開發組", "品質保證組"]], ["行銷部", ["品牌組", "數位行銷組", "公關組"]], ["財務部", ["會計組", "採購組"]]];
  let id = 1;
  const leaf = (title) => ({ id: id++, name: person(r), title, people: 1, budget: 60 + Math.round(r() * 40) });
  const node = (name, title, kids) => ({ id: id++, name, title, people: sumOf(kids, "people"), budget: sumOf(kids, "budget"), _children: kids });
  const team = (name) => node(name, "組", [leaf("組長"), ...Array.from({ length: 2 + Math.floor(r() * 3) }, () => leaf("專員"))]);
  return [node("總經理室", "公司", DEPTS.map(([dept, teams]) => node(dept, "部門", teams.map(team))))];
}

// ---------- scene 5 data ----------
const ITEMS = [["鳳梨酥", 380], ["烏龍茶", 650], ["牛軋糖", 260], ["太陽餅", 220], ["芒果乾", 300], ["花生糖", 180], ["蛋黃酥", 420], ["咖啡豆", 540]];
const ORDER_STATUS = ["已出貨", "已出貨", "已出貨", "處理中", "待付款", "已取消"];
function orderRows(n = 240) {
  const r = mulberry32(55);
  return Array.from({ length: n }, (_, i) => {
    const [item, price] = pick(r, ITEMS);
    const qty = 1 + Math.floor(r() * 12);
    return { id: i + 1, no: `TW${26100001 + i}`, date: `2026-${pad2(7 + Math.floor(r() * 3))}-${pad2(1 + Math.floor(r() * 28))}`, customer: person(r), city: pick(r, CITIES), item, qty, amount: qty * price, status: pick(r, ORDER_STATUS) };
  });
}

// ---------- scene 6 data ----------
const BUY = [["阿里山烏龍茶", "嘉義縣", 650], ["鳳梨酥禮盒", "臺中市", 450], ["蜜餞綜合包", "臺南市", 220], ["花蓮麻糬", "花蓮縣", 280], ["金門貢糖", "金門縣", 320], ["宜蘭牛舌餅", "宜蘭縣", 180], ["新竹米粉", "新竹縣", 150], ["屏東洋蔥酥", "屏東縣", 200], ["澎湖干貝醬", "澎湖縣", 520], ["鶯歌陶杯", "新北市", 780], ["大溪豆干", "桃園市", 160], ["關廟麵", "臺南市", 140]];
function buyRows() {
  const r = mulberry32(606);
  return BUY.map(([item, origin, price], i) => {
    const qty = 2 + Math.floor(r() * 9);
    return { id: i + 1, item, origin, qty, price, subtotal: qty * price };
  });
}

// ---------- scene 7 data ----------
function sheetData(seed, months) {
  const r = mulberry32(seed);
  const rows = STORES.slice(0, 12).map(([store]) => {
    const vals = months.map(() => 50 + Math.round(r() * 120));
    return [store, ...vals, vals.reduce((a, b) => a + b, 0)];
  });
  return [["門市", ...months, "季合計"], ...rows];
}

// ---------- stress data ----------
const stressRow = (i) => {
  const s = STORES[i % STORES.length];
  const target = 80 + ((i * 37) % 15) * 10;
  const actual = Math.round(target * (0.6 + ((i * 7919) % 600) / 1000));
  return { id: i + 1, store: s[0], city: s[1], manager: s[3], target, actual, rate: rateOf(target, actual), status: s[4] };
};

Showcase.run({ scenes: [
  // ---------- scene 1: the original revenue table, improved ----------
  {
    id: "revenue", title: "門市營收表", paper: true,
    api: "new Tabulator(el, { groupBy, history, columnCalcs, movableColumns })",
    desc: "可直接編輯的門市營收表：分組、表頭篩選、欄位統計、拖曳換欄、復原與重做都是 Tabulator 內建功能；達成率會隨實績即時重算。",
    hint: "點目標、實績、評分或狀態即可修改；拖曳欄名換順序，窄螢幕可左右滑動表格（門市欄固定）",
    mount(ctx) {
      ctx.html(`<div class="tb-wrap"><div class="tb-card"><div class="tb-grid"></div></div><div class="tb-log">示意資料（9 月目標與實績，萬元），點目標、實績、評分或狀態即可修改</div></div>`);
      const log = ctx.$(".tb-log");
      const edited = new Map(); // "id:field" -> edits not yet undone
      const FIELD_LABEL = { target: "目標", actual: "實績", stars: "評分", status: "狀態" };
      const GROUP_KEYS = ["region", "city", "status", ""];
      const table = new Tabulator(ctx.$(".tb-grid"), {
        ...BASE, data: storeRows(), index: "id", height: "100%", layout: "fitColumns",
        movableColumns: true, history: true, groupBy: "region", groupUpdateOnCellEdit: true, columnCalcs: "table",
        groupHeader: (value, count, rows) => `${value}<span>${count} 間門市・實績 ${fmt(sumOf(rows, "actual"))} 萬</span>`,
        placeholder: "沒有符合條件的門市",
        rowFormatter: (row) => {
          const id = row.getData().id;
          for (const cell of row.getCells()) cell.getElement().classList.toggle("edited", (edited.get(`${id}:${cell.getField()}`) || 0) > 0);
        },
        columns: [
          { title: "門市", field: "store", frozen: true, minWidth: 112, headerFilter: "input", headerFilterPlaceholder: "搜尋門市", bottomCalc: "count", bottomCalcFormatter: (c) => `共 ${c.getValue()} 間` },
          { title: "縣市", field: "city", minWidth: 78, headerFilter: "list", headerFilterParams: { valuesLookup: true, clearable: true }, headerFilterPlaceholder: "全部" },
          { title: "區域", field: "region", visible: false, download: true },
          { title: "店長", field: "manager", minWidth: 70 },
          { title: "目標", field: "target", minWidth: 72, hozAlign: "right", sorter: "number", editor: "number", editorParams: { min: 0, step: 10 }, validator: ["required", "min:0"], bottomCalc: "sum" },
          { title: "實績", field: "actual", minWidth: 72, hozAlign: "right", sorter: "number", editor: "number", editorParams: { min: 0, step: 5 }, validator: ["required", "min:0"], bottomCalc: "sum" },
          {
            title: "達成率", field: "rate", minWidth: 126, widthGrow: 2, sorter: "number", formatter: "progress",
            formatterParams: { min: 0, max: 130, color: rateColor, legend: (v) => `${v}%`, legendColor: "#1c1c1a", legendAlign: "center" },
            bottomCalc: (values, rows) => `${rateOf(sumOf(rows, "target"), sumOf(rows, "actual"))}%`,
          },
          { title: "顧客評分", field: "stars", minWidth: 100, formatter: "star", formatterParams: { stars: 5 }, editor: "star", hozAlign: "center", bottomCalc: "avg", bottomCalcParams: { precision: 1 } },
          {
            title: "狀態", field: "status", minWidth: 84, hozAlign: "center", editor: "list", editorParams: { values: ["營運中", "整修中", "新開幕"] }, formatter: pill,
            headerFilter: "list", headerFilterParams: { values: ["營運中", "整修中", "新開幕"], clearable: true }, headerFilterPlaceholder: "全部",
          },
        ],
      });
      ctx.onCleanup(() => table.destroy());
      // Count edits per cell, refresh the derived rate and the highlight.
      // (row.reformat() is avoided on purpose: it rebuilds the cells, which wipes their undo history.)
      const touch = (cell, delta) => {
        const row = cell.getRow(), d = row.getData(), field = cell.getField(), key = `${d.id}:${field}`;
        edited.set(key, Math.max(0, (edited.get(key) || 0) + delta));
        if (field === "target" || field === "actual") row.update({ rate: rateOf(d.target, d.actual) });
        cell.getElement().classList.toggle("edited", edited.get(key) > 0);
        return d;
      };
      const sync = () => { undoBtn.disabled = table.getHistoryUndoSize() === 0; redoBtn.disabled = table.getHistoryRedoSize() === 0; };
      table.on("cellEdited", (cell) => {
        const d = touch(cell, 1);
        log.innerHTML = `已修改 <b>${esc(d.store)}</b> 的${FIELD_LABEL[cell.getField()]}：${esc(cell.getOldValue())} → <b>${esc(cell.getValue())}</b>`;
        sync();
      });
      table.on("historyUndo", (action, cell) => {
        if (action === "cellEdit") log.innerHTML = `已復原 <b>${esc(touch(cell, -1).store)}</b> 的${FIELD_LABEL[cell.getField()]}，回到 <b>${esc(cell.getValue())}</b>`;
        sync();
      });
      table.on("historyRedo", (action, cell) => {
        if (action === "cellEdit") log.innerHTML = `已重做 <b>${esc(touch(cell, 1).store)}</b> 的${FIELD_LABEL[cell.getField()]}，改回 <b>${esc(cell.getValue())}</b>`;
        sync();
      });
      table.on("columnMoved", (column) => { log.innerHTML = `已把「<b>${esc(column.getDefinition().title)}</b>」欄拖到新位置`; });
      table.on("dataFiltered", (filters, rows) => { if (filters.length) log.innerHTML = `篩選後剩 <b class="n">${rows.length}</b> 間門市，底部統計同步更新`; });
      ctx.group(["區域", "縣市", "狀態", "不分組"], 0, (i, label) => {
        table.setGroupBy(GROUP_KEYS[i] || false);
        log.textContent = GROUP_KEYS[i] ? `改為依${label}分組，點群組列可收合` : "已取消分組";
      });
      const undoBtn = ctx.button("復原", () => table.undo());
      const redoBtn = ctx.button("重做", () => table.redo());
      undoBtn.disabled = redoBtn.disabled = true;
      ctx.button("下載 CSV", () => table.download("csv", "門市營收_示意資料.csv", { bom: true }), { primary: true });
    },
  },

  // ---------- scene 2: editors and validation ----------
  {
    id: "edit", title: "編輯與驗證", paper: true,
    api: "editor: \"list\" | \"date\" | \"number\" | \"tickCross\" | \"star\" | \"textarea\"・validator・validationMode",
    desc: "每欄配一種內建編輯器與驗證規則（必填、整數、範圍、清單、自訂函式）。三種 validationMode：blocking 擋住錯誤輸入、highlight 收下但標紅、manual 等呼叫 validate() 才檢查。",
    hint: "點儲存格編輯，試著把名額改成 0 或清空活動名稱；收費打勾後才能改費用",
    mount(ctx) {
      ctx.html(`<div class="tb-wrap"><div class="tb-split"><div class="tb-card"><div class="tb-grid"></div></div>
        <div class="tb-side"><div class="tb-cap"><b>事件紀錄</b><span class="tb-mode"></span></div><ul class="tb-list"></ul></div></div></div>`);
      const list = ctx.$(".tb-list"), modeEl = ctx.$(".tb-mode");
      const MODES = ["highlight", "blocking", "manual"];
      const LABEL = { name: "活動", type: "類型", date: "日期", cap: "名額", paid: "收費", fee: "費用", stars: "滿意度", note: "備註" };
      const say = (html) => { list.insertAdjacentHTML("afterbegin", `<li>${html}</li>`); while (list.children.length > 30) list.lastChild.remove(); };
      const rule = (v) => (v.type === "function" ? "自訂規則" : `${v.type}${v.parameters != null ? ":" + v.parameters : ""}`);
      let table = null, data = actRows();
      function build(mode) {
        if (table) { data = table.getData(); table.destroy(); }
        modeEl.textContent = `validationMode: ${mode}`;
        table = new Tabulator(ctx.$(".tb-grid"), {
          ...BASE, data, index: "id", height: "100%", layout: "fitColumns", validationMode: mode,
          columns: [
            { title: "活動", field: "name", frozen: true, minWidth: 96, editor: "input", validator: ["required", "minLength:2", "maxLength:10"] },
            { title: "類型", field: "type", minWidth: 84, editor: "list", editorParams: { values: ACT_TYPES, autocomplete: true, listOnEmpty: true }, validator: ["required", `in:${ACT_TYPES.join("|")}`] },
            { title: "日期", field: "date", minWidth: 116, editor: "date", editorParams: { min: "2026-11-01", max: "2026-12-31" }, validator: ["required", { type: inDateRange, parameters: { min: "2026-11-01", max: "2026-12-31" } }] },
            { title: "名額", field: "cap", minWidth: 74, hozAlign: "right", editor: "number", editorParams: { min: 10, max: 500, step: 10 }, validator: ["required", "integer", "min:10", "max:500"] },
            { title: "收費", field: "paid", minWidth: 70, hozAlign: "center", formatter: "tickCross", editor: "tickCross" },
            { title: "費用", field: "fee", minWidth: 80, hozAlign: "right", editor: "number", editable: (cell) => cell.getRow().getData().paid, formatter: (c) => (c.getRow().getData().paid ? `NT$ ${fmt(+c.getValue() || 0)}` : "免費"), validator: [{ type: feeCheck }] },
            { title: "滿意度", field: "stars", minWidth: 96, formatter: "star", editor: "star" },
            { title: "備註", field: "note", minWidth: 120, widthGrow: 2, editor: "textarea", formatter: "textarea" },
          ],
        });
        table.on("tableBuilt", () => {
          if (mode === "manual") { say(`manual 模式：編輯時不檢查，按「全表驗證」才標出錯誤`); return; }
          const bad = table.validate();
          say(`${mode}：` + (bad === true ? `<span class="ok">全部通過驗證</span>` : `<span class="bad">現有資料 ${bad.length} 格未通過</span>，已標紅`));
        });
        table.on("cellEdited", (cell) => {
          say(`<b>${esc(cell.getRow().getData().name || "（未命名）")}</b> ${LABEL[cell.getField()]}：${esc(cell.getOldValue())} → ${esc(cell.getValue())}`);
          if (cell.getField() === "paid") cell.getRow().reformat();
        });
        table.on("validationFailed", (cell, value, validators) => {
          say(`<span class="bad">驗證失敗</span> ${LABEL[cell.getField()]} = 「${esc(value)}」（${validators.map(rule).join("、")}）${mode === "blocking" ? "，編輯器不放行" : ""}`);
        });
      }
      ctx.onCleanup(() => table && table.destroy());
      ctx.group(MODES, 0, (i) => build(MODES[i]));
      ctx.button("全表驗證", () => {
        const bad = table.validate();
        say(bad === true ? `<span class="ok">validate()：全部通過</span>` : `<span class="bad">validate()：${bad.length} 格未通過</span>（${bad.map((c) => LABEL[c.getField()]).join("、")}）`);
      }, { primary: true });
      build(MODES[0]);
    },
  },

  // ---------- scene 4: grouping and tree data ----------
  {
    id: "tree", title: "分組與樹狀", paper: true,
    api: "groupBy: [\"region\", \"city\"]・columnCalcs: \"both\"・dataTree + _children",
    desc: "兩種階層呈現：平面資料用 groupBy 依區域再依縣市分兩層，每組自帶小計；本身就有父子關係的組織圖用 dataTree 讀 _children 展開成樹。",
    hint: "切換「多層分組／樹狀資料」；點群組列或三角形展開，右上可一次全部展開或收合",
    mount(ctx) {
      ctx.html(`<div class="tb-wrap"><div class="tb-card"><div class="tb-grid"></div></div><div class="tb-log"></div></div>`);
      const log = ctx.$(".tb-log");
      let table = null, mode = 0;
      const money = { formatter: "money", formatterParams: { thousand: ",", precision: 0 } };
      function build() {
        if (table) table.destroy();
        const el = ctx.$(".tb-grid");
        if (mode === 0) {
          table = new Tabulator(el, {
            ...BASE, data: salesRows(), index: "id", height: "100%", layout: "fitColumns",
            groupBy: ["region", "city"], groupStartOpen: [true, (value) => value === "臺北市" || value === "臺中市"], columnCalcs: "both", groupClosedShowCalcs: true,
            groupHeader: [
              (v, count, data) => `${v}<span>${data.length} 筆・${fmt(sumOf(data, "amount"))} 萬</span>`,
              (v, count, data) => `${v}<span>${data.length} 筆</span>`,
            ],
            columns: [
              { title: "門市", field: "store", minWidth: 112, bottomCalc: "count", bottomCalcFormatter: (c) => `小計 ${c.getValue()} 筆` },
              { title: "月份", field: "month", minWidth: 60 },
              { title: "營收（萬）", field: "amount", minWidth: 100, hozAlign: "right", bottomCalc: "sum" },
              { title: "訂單數", field: "orders", minWidth: 84, hozAlign: "right", ...money, bottomCalc: "sum", bottomCalcFormatter: "money", bottomCalcFormatterParams: { thousand: ",", precision: 0 } },
            ],
          });
          log.innerHTML = "示意資料：21 間門市 × 3 個月，第一層依區域、第二層依縣市（預設收合，收合時仍顯示小計）";
        } else {
          table = new Tabulator(el, {
            ...BASE, data: orgTree(), index: "id", height: "100%", layout: "fitColumns",
            dataTree: true, dataTreeStartExpanded: (row, level) => level < 1, dataTreeChildIndent: 16, dataTreeElementColumn: "name",
            columns: [
              { title: "名稱", field: "name", minWidth: 170, widthGrow: 2, headerSort: false },
              { title: "職稱", field: "title", minWidth: 60, headerSort: false },
              { title: "人數", field: "people", minWidth: 56, hozAlign: "right", headerSort: false },
              { title: "年度預算（萬）", field: "budget", minWidth: 110, hozAlign: "right", headerSort: false, ...money },
            ],
          });
          log.innerHTML = "示意資料：公司 → 部門 → 組 → 成員四層組織，資料用 <b>_children</b> 巢狀陣列表示";
        }
      }
      const walkGroups = (groups, fn) => groups.forEach((g) => { fn(g); walkGroups(g.getSubGroups(), fn); });
      const walkTree = (rows, fn) => rows.forEach((r) => { fn(r); walkTree(r.getTreeChildren(), fn); });
      const setAll = (open) => {
        if (mode === 0) walkGroups(table.getGroups(), (g) => (open ? g.show() : g.hide()));
        else walkTree(table.getRows(), (r) => { if (r.getTreeChildren().length) open ? r.treeExpand() : r.treeCollapse(); });
      };
      ctx.onCleanup(() => table && table.destroy());
      ctx.group(["多層分組", "樹狀資料"], 0, (i) => { mode = i; build(); });
      ctx.button("全部展開", () => setAll(true));
      ctx.button("全部收合", () => setAll(false));
      build();
    },
  },

  // ---------- scene 5: pagination, multi-sort, responsive collapse ----------
  {
    id: "page", title: "分頁與響應式", paper: true,
    api: "pagination・paginationSizeSelector・initialSort[]・responsiveLayout: \"collapse\"",
    desc: "240 筆訂單用本機分頁，可換每頁筆數；預設依金額再依縣市多欄排序。表格變窄時，低優先的欄位自動收進每列的展開區，不必左右捲動。",
    hint: "拖「寬度」滑桿看欄位收合；點列首的 + 看被收起的欄位；Shift／Ctrl 加點欄名可疊加排序（最後點的優先）",
    mount(ctx) {
      ctx.html(`<div class="tb-wrap"><div class="tb-card"><div class="tb-grid"></div></div><div class="tb-log"></div></div>`);
      const log = ctx.$(".tb-log"), card = ctx.$(".tb-card");
      const TITLE = { no: "訂單", amount: "金額", status: "狀態", city: "縣市", customer: "客戶", item: "品項", qty: "數量", date: "日期" };
      const table = new Tabulator(ctx.$(".tb-grid"), {
        ...BASE, data: orderRows(), index: "id", height: "100%", layout: "fitColumns",
        responsiveLayout: "collapse", responsiveLayoutCollapseStartOpen: false,
        pagination: true, paginationSize: 10, paginationSizeSelector: [10, 20, 50, true], paginationCounter: "rows", paginationButtonCount: 3,
        // The last sorter in the list has the highest priority (shift-click also appends)
        initialSort: [{ column: "city", dir: "asc" }, { column: "amount", dir: "desc" }],
        columns: [
          { formatter: "responsiveCollapse", width: 34, minWidth: 34, hozAlign: "center", resizable: false, headerSort: false, responsive: 0 },
          { title: "訂單", field: "no", minWidth: 104, responsive: 0 },
          { title: "金額", field: "amount", minWidth: 92, hozAlign: "right", sorter: "number", responsive: 0, formatter: "money", formatterParams: { symbol: "NT$ ", precision: 0 } },
          { title: "狀態", field: "status", minWidth: 78, hozAlign: "center", responsive: 1, formatter: pill },
          { title: "縣市", field: "city", minWidth: 74, responsive: 2 },
          { title: "客戶", field: "customer", minWidth: 74, responsive: 3 },
          { title: "品項", field: "item", minWidth: 74, responsive: 3 },
          { title: "數量", field: "qty", minWidth: 58, hozAlign: "right", sorter: "number", responsive: 4 },
          { title: "日期", field: "date", minWidth: 100, responsive: 5 },
        ],
      });
      ctx.onCleanup(() => table.destroy());
      let built = false;
      const report = () => {
        if (!built) return;
        const sorters = table.getSorters().reverse().map((s) => `${TITLE[s.field] || s.field}${s.dir === "asc" ? "↑" : "↓"}`).join(" → ") || "無";
        const hidden = table.getColumns().filter((c) => c.getField() && !c.isVisible()).length;
        log.innerHTML = `排序優先：<b>${sorters}</b>・第 <span class="n">${table.getPage()}／${table.getPageMax()}</span> 頁・收進展開區 <span class="n">${hidden}</span> 欄`;
      };
      table.on("tableBuilt", () => { built = true; report(); });
      ["dataSorted", "pageLoaded", "dataFiltered"].forEach((ev) => table.on(ev, () => ctx.timeout(report, 0)));
      ctx.interval(report, 600);
      ctx.slider("寬度", { min: 40, max: 100, step: 5, value: 100, format: (v) => `${v}%` }, (v) => { card.style.width = `${v}%`; });
      ctx.select("篩選", [{ value: "all", label: "全部" }, { value: "tpe", label: "臺北市" }, { value: "big", label: "金額 ≥ 3,000" }, { value: "wip", label: "處理中" }], "all", (v) => {
        if (v === "all") table.clearFilter();
        else if (v === "tpe") table.setFilter("city", "=", "臺北市");
        else if (v === "big") table.setFilter("amount", ">=", 3000);
        else table.setFilter("status", "=", "處理中");
      });
    },
  },

    api: "selectableRows・rowHeader: { formatter: \"rowSelection\" }・movableRows・table.download(type, name, opts, \"selected\")",
    desc: "勾選列、按住把手拖曳換順序，右側即時預覽匯出內容：有勾選就只匯出選取列，否則匯出全部。CSV、JSON、HTML 都在瀏覽器內產生，不經伺服器。",
    hint: "勾選或 Shift 加點選取多列；拖曳 ≡ 把手換順序；切換格式後按「下載」存檔",
    mount(ctx) {
      ctx.html(`<div class="tb-wrap"><div class="tb-split"><div class="tb-card"><div class="tb-grid"></div></div>
        <div class="tb-side"><div class="tb-cap"><b class="tb-sum"></b><span class="tb-range"></span></div><pre class="tb-pre"></pre></div></div></div>`);
      const pre = ctx.$(".tb-pre"), sumEl = ctx.$(".tb-sum"), rangeEl = ctx.$(".tb-range");
      const TYPES = ["csv", "json", "html"];
      let type = "csv", sink = null, built = false;
      const table = new Tabulator(ctx.$(".tb-grid"), {
        ...BASE, data: buyRows(), index: "id", height: "100%", layout: "fitColumns",
        selectableRows: true, selectableRowsRangeMode: "click", movableRows: true,
        rowHeader: { formatter: "rowSelection", titleFormatter: "rowSelection", headerSort: false, resizable: false, frozen: true, hozAlign: "center", headerHozAlign: "center", width: 40, download: false },
        // Capture the generated file for the preview instead of downloading when sink is set
        downloadEncoder: (data, mime) => { if (sink) { sink(data); return false; } return new Blob([data], { type: mime }); },
        columns: [
          { rowHandle: true, formatter: "handle", headerSort: false, frozen: true, width: 30, minWidth: 30, resizable: false, download: false },
          { title: "品名", field: "item", minWidth: 104 },
          { title: "產地", field: "origin", minWidth: 70 },
          { title: "數量", field: "qty", minWidth: 56, hozAlign: "right" },
          { title: "單價", field: "price", minWidth: 70, hozAlign: "right" },
          { title: "小計", field: "subtotal", minWidth: 80, hozAlign: "right", formatter: "money", formatterParams: { precision: 0 } },
        ],
      });
      ctx.onCleanup(() => table.destroy());
      const range = () => (table.getSelectedRows().length ? "selected" : "active");
      function preview() {
        if (!built) return;
        const sel = table.getSelectedData();
        sumEl.textContent = sel.length ? `已選 ${sel.length} 筆・NT$ ${fmt(sumOf(sel, "subtotal"))}` : "未選取";
        rangeEl.textContent = sel.length ? `匯出 ${type.toUpperCase()}：只含選取列` : `匯出 ${type.toUpperCase()}：全部 ${table.getDataCount("active")} 列`;
        sink = (d) => { pre.textContent = d; };
        try { table.download(type, `x.${type}`, {}, range()); } finally { sink = null; }
      }
      table.on("tableBuilt", () => { built = true; table.selectRow([2, 5, 9]); preview(); });
      table.on("rowSelectionChanged", preview);
      table.on("rowMoved", (row) => { preview(); rangeEl.textContent = `「${row.getData().item}」移到第 ${row.getPosition()} 列`; });
      ctx.group(["CSV", "JSON", "HTML"], 0, (i) => { type = TYPES[i]; preview(); });
      ctx.button("全選", () => table.selectRow("active"));
      ctx.button("清除", () => table.deselectRow());
      ctx.button("下載", () => table.download(type, `採購單_示意資料.${type}`, type === "csv" ? { bom: true } : {}, range()), { primary: true });
    },
  },

  // ---------- scene 7: spreadsheet mode ----------
  {
    id: "sheet", title: "試算表模式", paper: true,
    api: "spreadsheet: true・spreadsheetSheets・selectableRange・clipboard・table.getRangesData()",
    desc: "Tabulator 6 的試算表模式：資料是二維陣列，欄名自動編成 A、B、C，可框選範圍、鍵盤移動、雙擊編輯，下方分頁切換工作表。右側用 getRangesData() 即時算出選取範圍的加總與平均。",
    hint: "拖曳框選儲存格（點欄名或列號可整欄整列選取）；雙擊編輯；Ctrl+C／Ctrl+V 可複製貼上範圍",
    mount(ctx) {
      ctx.html(`<div class="tb-wrap"><div class="tb-split"><div class="tb-card"><div class="tb-grid"></div></div>
        <div class="tb-side"><div class="tb-cap"><b>選取範圍</b><span class="tb-addr n"></span></div>
        <div class="tb-stats"><div>儲存格<b class="s-n">0</b></div><div>數值格<b class="s-k">0</b></div><div>加總<b class="s-sum">0</b></div><div>平均<b class="s-avg">0</b></div></div>
        <ul class="tb-list"></ul></div></div></div>`);
      const addr = ctx.$(".tb-addr"), list = ctx.$(".tb-list");
      const set = (sel, v) => { ctx.$(sel).textContent = v; };
      const table = new Tabulator(ctx.$(".tb-grid"), {
        ...BASE, height: "100%",
        spreadsheet: true, spreadsheetRows: 20, spreadsheetColumns: 8,
        spreadsheetColumnDefinition: { editor: "input", resizable: "header", width: 96 },
        spreadsheetSheets: [
          { title: "第一季", key: "q1", rows: 20, columns: 8, data: sheetData(11, ["1 月", "2 月", "3 月"]) },
          { title: "第二季", key: "q2", rows: 20, columns: 8, data: sheetData(12, ["4 月", "5 月", "6 月"]) },
        ],
        spreadsheetSheetTabs: true,
        rowHeader: { field: "_id", hozAlign: "center", headerSort: false, frozen: true, width: 40, resizable: false },
        editTriggerEvent: "dblclick",
        selectableRange: 1, selectableRangeColumns: true, selectableRangeRows: true, selectableRangeClearCells: true,
        clipboard: true, clipboardCopyStyled: false, clipboardCopyConfig: { rowHeaders: false, columnHeaders: false },
        clipboardCopyRowRange: "range", clipboardPasteParser: "range", clipboardPasteAction: "range",
      });
      ctx.onCleanup(() => table.destroy());
      const say = (html) => { list.insertAdjacentHTML("afterbegin", `<li>${html}</li>`); while (list.children.length > 20) list.lastChild.remove(); };
      function stats(range) {
        if (!range) return;
        const cols = range.getColumns().map((c) => c.getField()).filter(Boolean);
        const rows = range.getRows().map((r) => r.getData()._id);
        if (cols.length && rows.length) addr.textContent = `${cols[0]}${rows[0]}:${cols[cols.length - 1]}${rows[rows.length - 1]}`;
        const values = table.getRangesData()[0] ? table.getRangesData()[0].flatMap((row) => Object.values(row)) : [];
        const nums = values.map((v) => (v === "" || v == null ? NaN : Number(v))).filter((v) => Number.isFinite(v));
        const total = nums.reduce((a, b) => a + b, 0);
        set(".s-n", fmt(values.length)); set(".s-k", fmt(nums.length));
        set(".s-sum", fmt(total)); set(".s-avg", nums.length ? fmt(total / nums.length, 1) : "0");
      }
      table.on("rangeChanged", stats);
      table.on("rangeAdded", stats);
      table.on("cellEdited", (cell) => { say(`<b>${cell.getField()}${cell.getRow().getData()._id}</b>：${esc(cell.getOldValue() ?? "")} → ${esc(cell.getValue() ?? "")}`); stats(table.getRanges()[0]); });
      table.on("clipboardPasted", () => say("已貼上剪貼簿內容"));
      table.on("sheetLoaded", (sheet) => say(`切換到工作表「${esc(sheet.getTitle())}」`));
      const selectDemo = () => {
        const rows = table.getRows();
        if (rows.length > 6) table.addRange(rows[1].getCell("B"), rows[6].getCell("D"));
      };
      table.on("tableBuilt", () => { selectDemo(); say("已預先框選 B2:D7，示範即時加總"); });
      ctx.button("框選示範範圍", selectDemo);
    },
  },

  // ---------- scene 8: stress ----------
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "table.setData(rows)・虛擬 DOM（renderVertical: \"virtual\"）",
    desc: "從 1 萬列逐級加到 100 萬列，每級先量 setData() 耗時，再讓表格持續自動捲動量 FPS，同時顯示 DOM 中實際存在的列數。",
    hint: "按左側「自動加壓」；換成「隨機跳轉」再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="tb-stress"><div class="tb-card"><div class="tb-grid"></div></div></div>`);
      const table = new Tabulator(ctx.$(".tb-grid"), {
        ...BASE, data: [], index: "id", height: "100%", layout: "fitColumns",
        columns: [
          { title: "#", field: "id", minWidth: 76, hozAlign: "right" },
          { title: "門市", field: "store", minWidth: 110 },
          { title: "縣市", field: "city", minWidth: 70 },
          { title: "店長", field: "manager", minWidth: 70 },
          { title: "目標", field: "target", minWidth: 60, hozAlign: "right" },
          { title: "實績", field: "actual", minWidth: 60, hozAlign: "right" },
          { title: "達成率", field: "rate", minWidth: 110, formatter: "progress", formatterParams: { min: 0, max: 130, color: rateColor, legend: (v) => `${v}%`, legendColor: "#1c1c1a", legendAlign: "center" } },
          { title: "狀態", field: "status", minWidth: 80, hozAlign: "center", formatter: pill },
        ],
      });
      ctx.onCleanup(() => table.destroy());
      const ready = new Promise((resolve) => table.on("tableBuilt", resolve));
      ctx.controls.classList.add("bottom");
      let jump = false, pos = 0, setMs = 0;
      ctx.group(["平滑捲動", "隨機跳轉"], 0, (i) => { jump = i === 1; });
      const pool = [];
      ctx.raf((t, dt) => {
        const el = ctx.$(".tabulator-tableholder");
        if (!el) return;
        const max = el.scrollHeight - el.clientHeight;
        if (max <= 0) return;
        pos = jump ? Math.random() * max : (pos + dt * 1.2) % max;
        el.scrollTop = pos;
      });
      ctx.ramp({
        label: "資料列", unit: "列",
        steps: [10000, 25000, 50000, 100000, 250000, 500000, 1000000],
        minFps: 30,
        async apply(n) {
          await ready;
          for (let i = pool.length; i < n; i++) pool.push(stressRow(i));
          const t0 = performance.now();
          await table.setData(pool.slice(0, n));
          setMs = performance.now() - t0;
          pos = 0;
        },
        metrics: () => ({
          setData: setMs ? fmtMs(setMs) : "…",
          "DOM 中的列": ctx.$$(".tabulator-tableholder .tabulator-row").length,
        }),
        note: "FPS 量的是表格持續自動捲動時的流暢度。Tabulator 預設的虛擬 DOM 只把可視範圍附近的幾十列放進 DOM，所以總列數變多時捲動通常仍順，成本轉到 setData() 處理資料的時間與記憶體；「隨機跳轉」每格都要重建整個可視區，是最吃力的情況。百萬列時整體捲動高度會接近瀏覽器的元素高度上限，列高越高越早碰到。",
      });
    },
  },
] });
</script>
</body>
</html>
