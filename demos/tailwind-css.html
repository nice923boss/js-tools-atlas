// Tailwind CSS showcase. The shell page never loads Tailwind: every scene renders inside its own
// srcdoc iframe, so the Play CDN preflight only resets the iframe document.
const TW_SRC = "https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js";
const THEME = `
@custom-variant dark (&:where(.dark, .dark *));
@theme {
  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --color-brand-50: oklch(0.97 0.03 var(--brand-h, 165));
  --color-brand-300: oklch(0.85 0.13 var(--brand-h, 165));
  --color-brand-400: oklch(0.78 0.16 var(--brand-h, 165));
  --color-brand-500: oklch(0.70 0.16 var(--brand-h, 165));
  --color-brand-600: oklch(0.60 0.14 var(--brand-h, 165));
  --animate-float: float 6s ease-in-out infinite;
  --animate-wiggle: wiggle 1s ease-in-out infinite;
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// Wait until every Tailwind build started in this frame has finished (the browser build reports
// each pass through performance marks/measures named "Build #N (full|incremental)").
function idle(win, timeout = 60000) {
  const p = win.performance, t0 = performance.now();
  return new Promise((resolve, reject) => {
    const tick = () => {
      const started = p.getEntriesByType("mark").filter((m) => m.name.startsWith("Build #") && m.name.endsWith("(start)")).length;
      const done = p.getEntriesByType("measure").filter((m) => m.name.startsWith("Build #"));
      if (started && done.length === started) return resolve(done[done.length - 1]);
      if (performance.now() - t0 > timeout) return reject(new Error("Tailwind 編譯逾時"));
      setTimeout(tick, 2);
    };
    setTimeout(tick, 0); // let the MutationObserver microtask queue the build first
  });
}
function lastMeasure(win, name) {
  const m = win.performance.getEntriesByName(name, "measure");
  return m[m.length - 1];
}
function twFrame(host, body, { htmlClass = "", bodyClass = "", css = "" } = {}) {
  const f = document.createElement("iframe");
  f.className = "tw-frame";
  f.title = "Tailwind 預覽";
  f.srcdoc = `<!doctype html><html lang="zh-Hant" class="${htmlClass}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style type="text/tailwindcss">${THEME}${css}</style><script src="${TW_SRC}"><\/script></head><body class="${bodyClass}">${body}</body></html>`;
  host.append(f);
  return new Promise((resolve, reject) => f.addEventListener("load", () => {
    const win = f.contentWindow, doc = win.document;
    if (!win.performance.getEntriesByType("mark").some((m) => m.name.startsWith("Build #"))) return reject(new Error("Tailwind 瀏覽器版沒有載入"));
    idle(win).then(() => resolve({ f, win, doc }), reject);
  }, { once: true }));
}
// The <style> the browser build writes its output into (no type attribute, unlike the source block).
const outStyle = (doc) => [...doc.head.querySelectorAll("style")].find((s) => !s.type);
const kb = (n) => `${(n / 1024).toFixed(1)} KB`;
// Find the generated rule(s) for one class by walking the CSSOM (layers and @media blocks included).
function rulesFor(doc, cls) {
  const sel = `.${CSS.escape(cls)}`, out = [];
  // match ".cls", ".cls:hover", ".cls::after" but not ".cls-1" or ".clsx"
  const hit = (s) => s.startsWith(sel) && !/^[\w\-\\]/.test(s.slice(sel.length));
  const walk = (list) => { for (const r of list) { if (r.selectorText && r.selectorText.split(",").some((s) => hit(s.trim()))) out.push(r.cssText); else if (r.cssRules) walk(r.cssRules); } };
  const st = outStyle(doc);
  if (st && st.sheet) walk(st.sheet.cssRules);
  return out;
}
function countRules(doc) {
  let n = 0;
  const walk = (list) => { for (const r of list) { if (r.selectorText) n++; if (r.cssRules) walk(r.cssRules); } };
  const st = outStyle(doc);
  if (st && st.sheet) walk(st.sheet.cssRules);
  return n;
}

      const { win, doc } = await twFrame(ctx.$(".tw-host"), FORM, { bodyClass: "bg-slate-100" });
      if (!ctx.active) return;
      const $ = (s) => doc.querySelector(s), email = $("#email"), sw = $("#sw"), submit = $("#submit"), faq = $("#faq");
      const VARS = [
        ["[&:not(:placeholder-shown):invalid]:", "Email 已輸入但格式錯", () => email.value && !email.validity.valid],
        ["peer-valid:", "Email 合法時顯示 ✓", () => email.validity.valid],
        ["peer-checked:after:translate-x-5", "開關打開", () => sw.checked],
        ["disabled:opacity-30", "Email 不合法時停用送出", () => submit.disabled],
        ["data-[state=loading]:animate-pulse", "送出中", () => submit.dataset.state === "loading"],
        ["has-checked:ring-brand-500", "方案卡內的 radio 被選取", () => !!$("input[name=plan]:checked")],
        ["group-open:rotate-180", "FAQ 展開時箭頭翻轉", () => faq.open],
        ["odd: first: last:", "清單斑馬紋與頭尾", () => true],
      ];
      const list = ctx.$(".tw-vars");
      list.innerHTML = VARS.map(([c, d]) => `<li><span><code>${esc(c)}</code><br>${esc(d)}</span></li>`).join("");
      const sync = () => {
        submit.disabled = !email.validity.valid || submit.dataset.state === "loading";
        [...list.children].forEach((li, i) => li.classList.toggle("on", VARS[i][2]()));
      };
      ["input", "change", "toggle", "click"].forEach((ev) => doc.addEventListener(ev, () => setTimeout(sync, 0), true));
      faq.addEventListener("toggle", sync);
      submit.addEventListener("click", () => {
        submit.dataset.state = "loading"; submit.textContent = "送出中…"; sync();
        ctx.timeout(() => { delete submit.dataset.state; submit.textContent = "送出"; sync(); }, 1600);
      });
      sync();
      let auto = true, step = 0;
      ctx.on(win, "pointerdown", () => { auto = false; }, true);
      ctx.on(win, "keydown", () => { auto = false; }, true);
      const typeTo = (text) => { email.value = text; sync(); };
      const SEQ = ["w", "we", "wen", "wen@", "wen@3", "wen@360d", "wen@360d.com", "wen@360d.com.tw", "sw", "plan1", "faq", "submit", "plan2", "", "sw", "faq", "clear"];
      ctx.interval(() => {
        if (!auto) return;
        const s = SEQ[step++ % SEQ.length];
        if (s === "sw") sw.checked = !sw.checked;
        else if (s.startsWith("plan")) doc.querySelectorAll("input[name=plan]")[+s.slice(4)].checked = true;
        else if (s === "faq") faq.open = !faq.open;
        else if (s === "submit") submit.click();
        else if (s === "clear") { typeTo(""); doc.querySelectorAll("input[name=plan]").forEach((r) => (r.checked = false)); }
        else if (s === "") typeTo("wen@360d.com.tw".slice(0, 6) + " ");
        else typeTo(s);
        sync();
      }, 700);
    },
  },
  {
    id: "theme", title: "@theme 設計變數",
    api: "@theme { --color-brand-500: oklch(…); }  →  :root { --color-brand-500 }",
    desc: "v4 的 @theme 不只是設定檔：每個 token 都會輸出成 CSS 變數，utility 直接引用它。所以在執行期改變數，整個介面立刻換色、換間距，不必重新編譯。連 p-4、gap-4 都是 calc(var(--spacing) * 4)，改一個 --spacing 全站密度一起縮放。",
    hint: "拖曳品牌色相、間距與圓角滑桿，或切換深色",
    async mount(ctx) {
      ctx.html(`<div class="tw-pad"><div class="tw-split"><div class="tw-host"></div>
        <aside class="tw-box"><h3>執行期覆寫的變數<code>:root style</code></h3><pre class="tw-css tw-vals" style="flex:none"></pre>
          <h3>產生的規則（節錄）<code>從 CSSOM 讀取</code></h3><pre class="tw-css tw-rules"></pre></aside></div></div>`);
      const st = { h: 165, sp: 0.25, r: 0.75, dark: false };
      let auto = true, apply = () => {};
      const stop = () => { auto = false; };
      const hs = ctx.slider("品牌色相", { min: 0, max: 360, step: 1, value: st.h }, (v) => { stop(); st.h = v; apply(); });
      ctx.slider("--spacing", { min: 0.15, max: 0.4, step: 0.01, value: st.sp, format: (v) => `${v.toFixed(2)}rem` }, (v) => { stop(); st.sp = v; apply(); });
      ctx.slider("圓角", { min: 0, max: 1.5, step: 0.05, value: st.r, format: (v) => `${v.toFixed(2)}rem` }, (v) => { stop(); st.r = v; apply(); });
      const dt = ctx.toggle("深色", false, (v) => { stop(); st.dark = v; apply(); });
      const { win, doc } = await twFrame(ctx.$(".tw-host"), DASH);
      if (!ctx.active) return;
      const root = doc.documentElement;
      apply = () => {
        root.style.setProperty("--brand-h", st.h);
        root.style.setProperty("--spacing", `${st.sp}rem`);
        root.style.setProperty("--radius-xl", `${st.r}rem`);
        root.style.setProperty("--radius-2xl", `${st.r * 1.33}rem`);
        root.classList.toggle("dark", st.dark);
        dt.setAttribute("aria-pressed", String(st.dark));
        ctx.$(".tw-vals").textContent = `:root {\n  --brand-h: ${st.h};\n  --spacing: ${st.sp.toFixed(2)}rem;\n  --radius-xl: ${st.r.toFixed(2)}rem;\n}\nhtml.dark = ${st.dark}`;
      };
      apply();
      ctx.$(".tw-rules").textContent = ["bg-brand-500", "p-4", "gap-4", "rounded-xl", "dark:bg-slate-900"].map((c) => rulesFor(doc, c).map(pretty).join("\n")).filter(Boolean).join("\n");
      ctx.$(".tw-rules").textContent += `\n\n@theme 輸出：\n--color-brand-500: ${win.getComputedStyle(root).getPropertyValue("--color-brand-500").trim()}`;
      ctx.on(win, "pointerdown", stop);
      let t = 0;
      ctx.interval(() => {
        if (!auto) return;
        t += 1;
        st.h = (st.h + 3) % 360; hs.value = st.h; hs.nextElementSibling.textContent = st.h;
        st.sp = 0.25 + Math.sin(t / 18) * 0.07;
        if (t % 50 === 0) st.dark = !st.dark;
        apply();
      }, 80);
    },
  },
  {
    id: "arbitrary", title: "任意值與 v4 新語法",
    api: "rotate-z-[37deg] / [clip-path:…] / bg-conic / mask-b-from-20% / starting:",
    desc: "方括號可以塞任何值：rotate-z-[37deg]、grid-cols-[repeat(auto-fill,…)]，甚至整條 CSS 屬性 [clip-path:…]，底線代表空白。v4 另外新增漸層角度、conic/radial 漸層、3D 變形、遮罩、文字陰影與 @starting-style 進場動畫。拖曳滑桿時每個新角度都是一個新 class，會即時產生一條新規則。",
    hint: "拖曳「旋轉角度」滑桿，看右側即時產生的規則",
    async mount(ctx) {
      ctx.html(`<div class="tw-pad"><div class="tw-split"><div class="tw-host"></div>
        <aside class="tw-box"><h3>3D 方塊目前的 class</h3><div class="tw-cls"></div><h3>最新產生的規則<code>JIT</code></h3><pre class="tw-css"></pre>
          <div class="tw-meta"><span>規則總數 <b class="m1">0</b></span><span>增量編譯 <b class="m2">0</b> ms</span></div></aside></div></div>`);
      let deg = 30, auto = true, apply = () => {};
      const sl = ctx.slider("旋轉角度", { min: 0, max: 360, step: 1, value: deg, format: (v) => `${v}°` }, (v) => { auto = false; deg = v; apply(); });
      const { win, doc } = await twFrame(ctx.$(".tw-host"), LAB, { bodyClass: "bg-slate-100" });
      if (!ctx.active) return;
      const cube = doc.getElementById("cube"), cap = doc.getElementById("cube-cap"), start = doc.getElementById("starting");
      apply = async () => {
        const cls = `rotate-z-[${deg}deg]`;
        cube.className = cube.className.replace(/rotate-z-\[\d+deg\]/, cls);
        cap.textContent = `perspective-distant rotate-x-50 ${cls}`;
        ctx.$(".tw-cls").textContent = cube.className;
        const m = await idle(win);
        if (!ctx.active) return;
        ctx.$(".tw-css").textContent = rulesFor(doc, cls).map(pretty).join("\n");
        ctx.$(".m1").textContent = countRules(doc);
        ctx.$(".m2").textContent = m.duration.toFixed(1);
      };
      const pop = () => { start.innerHTML = '<div class="size-16 rounded-full bg-pink-500 transition-all duration-700 starting:scale-50 starting:opacity-0"></div>'; };
      pop();
      apply();
      ctx.interval(pop, 2500);
      ctx.on(win, "pointerdown", () => { auto = false; });
      ctx.interval(() => { if (auto) { deg = (deg + 7) % 360; sl.value = deg; sl.nextElementSibling.textContent = `${deg}°`; apply(); } }, 450);
    },
  },
  {
    id: "playground", title: "即時 Playground",
    api: "document.body.innerHTML = code  →  MutationObserver → build()",
    desc: "左邊改 HTML，右邊立刻重新編譯。自動示範會一個一個加上 class，看元件從素面逐步長出樣式；下方數字取自瀏覽器版 Tailwind 寫進 performance 的量測：收集 class、產生 utility 的耗時與輸出 CSS 大小。",
    hint: "直接在左側編輯 HTML，右側即時預覽",
    async mount(ctx) {
      ctx.html(`<div class="tw-pad"><div class="tw-play"><div class="tw-box"><h3>HTML<code class="tw-tok"></code></h3>
          <div class="tw-meta"><span>編譯 <b class="m1">0</b> ms</span><span>新 class <b class="m2">0</b></span><span>CSS <b class="m3">0</b></span></div><textarea spellcheck="false" aria-label="HTML 原始碼"></textarea></div><div class="tw-host"></div></div></div>`);
      const ta = ctx.$("textarea");
      let si = 0, ti = 0, auto = true;
      const { win, doc } = await twFrame(ctx.$(".tw-host"), "");
      if (!ctx.active) return;
      const update = async () => {
        doc.body.innerHTML = ta.value;
        const m = await idle(win);
        if (!ctx.active) return;
        const collect = lastMeasure(win, "Collect classes");
        ctx.$(".m1").textContent = m.duration.toFixed(1);
        ctx.$(".m2").textContent = collect?.detail?.count ?? 0;
        ctx.$(".m3").textContent = kb(outStyle(doc).textContent.length);
      };
      const step = () => {
        const s = SNIPPETS[si];
        ti++;
        if (ti > s.tokens.length + 3) { si = (si + 1) % SNIPPETS.length; ti = 0; }
        const cur = SNIPPETS[si], toks = cur.tokens.slice(0, Math.min(ti, cur.tokens.length));
        ta.value = cur.html(toks.join(" "));
        ctx.$(".tw-tok").textContent = ti && ti <= cur.tokens.length ? `+ ${cur.tokens[ti - 1]}` : "";
        update();
      };
      ta.value = SNIPPETS[0].html("");
      update();
      let timer = 0;
      ctx.on(ta, "input", () => { auto = false; clearTimeout(timer); timer = setTimeout(update, 120); });
      ctx.onCleanup(() => clearTimeout(timer));
      ctx.on(ta, "pointerdown", () => { auto = false; });
      ctx.interval(() => { if (auto) step(); }, 650);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × <i class=\"bg-[oklch(…)] [--i:N]\">  →  掃描 + 產生 CSS",
    desc: "一次插入 N 個元素，每個都帶一個獨一無二的任意值 class，量測從插入 DOM 到瀏覽器版 Tailwind 掃描、產生 CSS、套用樣式完成的時間。瀏覽器版每次編譯都會重新 querySelectorAll 整頁，所以 Tailwind 官方建議正式環境改用 CLI 或 Vite 外掛預先編譯。",
    hint: "按「開始測試」，每一級都在全新 iframe 量測",
    async mount(ctx) {
      ctx.html(`<div class="tw-stress"></div>`);
      const host = ctx.$(".tw-stress");
      const GRID = `<div id="g" class="flex flex-wrap content-start gap-px p-2"></div>`;
      const make = (doc, n) => {
        const frag = doc.createDocumentFragment();
        for (let i = 0; i < n; i++) {
          const el = doc.createElement("i");
          el.className = `size-2.5 rounded-[2px] bg-[oklch(0.75_0.15_${i % 360})] [--i:${i}]`;
          frag.append(el);
        }
        return frag;
      };
      let cur = await twFrame(host, GRID, { bodyClass: "bg-slate-950" });
      if (!ctx.active) return;
      cur.doc.getElementById("g").append(make(cur.doc, 2000));
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "唯一 class 元素", unit: "個", sizes: [200, 1000, 5000, 10000, 20000, 50000], target: 500, budget: 3000,
        prepare: async (n) => {
          cur.f.remove();
          cur = await twFrame(host, GRID, { bodyClass: "bg-slate-950" });
          return { ...cur, frag: make(cur.doc, n) };
        },
        run: async (n, { win, doc, frag }) => {
          doc.getElementById("g").append(frag);
          await idle(win);
          doc.body.offsetHeight; // force style + layout with the new CSS
          await ctx.frame(1);
          const c = lastMeasure(win, "Collect classes"), b = lastMeasure(win, "Build utilities");
          return `掃描 ${c ? c.duration.toFixed(0) : "?"}・產生 ${b ? b.duration.toFixed(0) : "?"} ms・CSS ${kb(outStyle(doc).textContent.length)}`;
        },
        note: "每個元素的 class 含一個唯一的 [--i:N] 與 360 種顏色之一，所以 N 個元素約產生 N + 360 條規則。時間包含 MutationObserver 觸發、掃描 class、產生 CSS 與瀏覽器套用樣式。",
      });
      ctx.onCleanup(() => cur.f.remove());
    },
  },
] });
</script>
</body>
</html>
