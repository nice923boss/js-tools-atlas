<script>
// Teachable Machine image (official library) on TensorFlow.js 1.3.1. Every scene builds its own
// TeachableMobileNet on one shared truncated MobileNet and disposes its trained head on exit.
const TF_URL = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js";
const TM_URL = "https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js";
const KIND = { circle: "圓形", triangle: "三角形", star: "星形", octagon: "八邊形", hexagon: "六邊形" };
const CLS = ["--c1", "--c2", "--c5"];
const abort = () => new DOMException("Scene unmounted", "AbortError");
const isAbort = (e) => e && e.name === "AbortError";
const pct = (x) => `${Math.round((x || 0) * 100)}%`;
const sec = (ms) => `${(ms / 1000).toFixed(1)} s`;
const kb = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(2)} MB` : `${(n / 1024).toFixed(1)} KB`);
const C = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#888";
const MONO = () => getComputedStyle(document.documentElement).getPropertyValue("--mono").trim() || "monospace";
const accOf = (l) => l.acc ?? l.accuracy ?? 0;
const valOf = (l) => l.val_acc ?? l.val_accuracy ?? 0;

// ---------- in-page sample generator (seeded, 224x224) ----------
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const SIDES = { triangle: 3, hexagon: 6, octagon: 8 };
function shapePath(g, kind, x, y, r, rot) {
  g.beginPath();
  if (kind === "circle") g.arc(x, y, r, 0, Math.PI * 2);
  else if (kind === "star") {
    for (let i = 0; i < 10; i++) { const a = rot + (i * Math.PI) / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; g.lineTo(x + rr * Math.cos(a), y + rr * Math.sin(a)); }
  } else {
    const n = SIDES[kind];
    for (let i = 0; i < n; i++) { const a = rot + (i * 2 * Math.PI) / n - Math.PI / 2; g.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); }
  }
  g.closePath();
}
function drawSample(cv, kind, rand, { noise = 1, size = 1, bg } = {}) {
  const S = 224, g = cv.getContext("2d");
  g.fillStyle = `hsl(${rand() * 360},22%,${80 + rand() * 12}%)`;
  g.fillRect(0, 0, S, S);
  if (bg === "grass") {
    g.fillStyle = "#4f8a3a"; g.fillRect(0, 0, S, S); g.lineWidth = 2;
    for (let i = 0; i < 400; i++) { g.strokeStyle = `hsl(${90 + rand() * 40},50%,${25 + rand() * 30}%)`; const x = rand() * S, y = rand() * S; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rand() - 0.5) * 6, y - 8 - rand() * 10); g.stroke(); }
  }
  if (bg === "sky") {
    const gr = g.createLinearGradient(0, 0, 0, S); gr.addColorStop(0, "#5aa7e6"); gr.addColorStop(1, "#cfe8fb"); g.fillStyle = gr; g.fillRect(0, 0, S, S);
    for (let i = 0; i < 3; i++) { g.fillStyle = "rgba(255,255,255,.7)"; const x = rand() * S, y = rand() * S * 0.7; for (let j = 0; j < 4; j++) { g.beginPath(); g.arc(x + j * 14, y + (j % 2) * 6, 12 + rand() * 6, 0, 7); g.fill(); } }
  }
  g.lineWidth = 3;
  for (let i = 0; i < 5; i++) { g.strokeStyle = `hsla(${rand() * 360},30%,45%,${0.12 + rand() * 0.15})`; g.beginPath(); g.moveTo(rand() * S, rand() * S); g.lineTo(rand() * S, rand() * S); g.stroke(); }
  const r = (40 + rand() * 36) * size, x = r + 6 + rand() * (S - 2 * r - 12), y = r + 6 + rand() * (S - 2 * r - 12);
  g.fillStyle = `hsl(${rand() * 360},${62 + rand() * 25}%,${42 + rand() * 12}%)`;
  shapePath(g, kind, x, y, r, rand() * Math.PI * 2);
  g.fill();
  for (let i = 0; i < 260 * noise; i++) { g.fillStyle = rand() < 0.5 ? "rgba(0,0,0,.16)" : "rgba(255,255,255,.22)"; g.fillRect(rand() * S, rand() * S, 2, 2); }
  return cv;
}
function sample(kind, seed, opts) {
  const c = document.createElement("canvas");
  c.width = c.height = 224;
  return drawSample(c, kind, rng(seed), opts);
}
function mini(cv, s = 64) {
  const c = document.createElement("canvas");
  c.width = c.height = s;
  c.getContext("2d").drawImage(cv, 0, 0, s, s);
  return c;
}
function tile(cv, text, ok) {
  const d = document.createElement("div");
  d.className = "tm-th";
  if (ok != null) d.style.setProperty("--k", ok ? "var(--c4)" : "var(--c3)");
  const s = document.createElement("span");
  s.textContent = text;
  d.append(mini(cv, 96), s);
  return d;
}

// ---------- library + shared truncated MobileNet ----------
let primed = false, truncP = null, TRUNC = null;
async function engine(ctx) {
  if (!primed) {
    await ctx.gate({
      icon: "🧠", title: "在瀏覽器裡教 AI 認圖形",
      desc: "按下後下載 TensorFlow.js、Teachable Machine 函式庫與 Google 提供的 MobileNet v2 基底權重。各場景用頁面內產生的圖形當樣本（第一個場景也可改用鏡頭），訓練與辨識都在瀏覽器內完成，影像不會上傳。",
      tags: ["約 2 MB", "可選用鏡頭", "影像不上傳"], button: "下載並開始（約 2 MB）",
    });
    primed = true;
  }
  if (!TRUNC) {
    const s = ctx.status("下載 TensorFlow.js 與 Teachable Machine…");
    s.progress(0.15);
    try {
      await ctx.load([TF_URL, TM_URL]);
      s.text("下載 MobileNet v2 基底權重（約 1.7 MB）…");
      s.progress(0.5);
      if (!truncP) truncP = tmImage.loadTruncatedMobileNet({ version: 2, alpha: 0.35 }).catch((e) => { truncP = null; throw e; });
      TRUNC = await truncP;
    } catch (e) {
      s.error(`載入失敗：${e && e.message ? e.message : e}，請確認網路連線後重新整理`);
      throw e;
    }
    s.done();
  }
  if (!ctx.active) throw abort();
}

// Wraps one TeachableMobileNet: serialised training, stop on scene exit, head disposed once.
function teach(ctx, labels, seed) {
  const m = new tmImage.TeachableMobileNet(TRUNC, { tfjsVersion: tf.version.tfjs, labels: labels.slice() });
  m.setLabels(labels.slice());
  m.setSeed(seed);
  let chain = Promise.resolve(), ticket = 0, running = false, halted = false;
  const drop = () => {
    // never call m.dispose(): it would also dispose the shared truncated MobileNet
    if (m.trainingModel) { m.trainingModel.dispose(); m.trainingModel = null; }
    m.model = null;
  };
  const stop = () => {
    ticket++;
    if (running && !halted) { halted = true; m.stopTraining(); }
    return chain;
  };
  async function fitNow(my, params, onEpoch, reprepare) {
    if (my !== ticket || !ctx.active) return null;
    drop();
    if (reprepare || !m.isPrepared) m.prepare();
    const P = { denseUnits: 100, epochs: 20, learningRate: 0.001, batchSize: 16, ...params };
    running = true; halted = false;
    const t0 = performance.now();
    try {
      await m.train(P, {
        onEpochEnd: async (e, logs) => {
          if (!ctx.active || my !== ticket) { if (!halted) { halted = true; m.stopTraining(); } return; }
          if (onEpoch) onEpoch(e, logs, P);
          await tf.nextFrame();
        },
      });
    } finally { running = false; }
    return { ms: performance.now() - t0, stopped: halted };
  }
  const api = {
    m,
    // the constructor starts with an empty tf.sequential(); isTrained wants > 2 layers but the joint model has 2
    get ready() { return !!m.model && m.model.layers.length > 0 && !running; },
    get running() { return running; },
    stop,
    async add(i, img) { if (!ctx.active) throw abort(); await m.addExample(i, img); },
    fit(params = {}, onEpoch, { reprepare = true } = {}) {
      stop();
      const my = ticket;
      const p = chain.then(() => fitNow(my, params, onEpoch, reprepare));
      chain = p.catch(() => {});
      return p.then((r) => { if (!r || !ctx.active) throw abort(); return r; });
    },
    async reset(names) {
      await stop();
      drop();
      m.setLabels(names.slice());
      m.trainDataset = m.validationDataset = undefined;
    },
  };
  ctx.onCleanup(() => { stop().then(() => { drop(); m.examples = []; }); });
  return api;
}
async function classify(T, cv) {
  const r = await T.m.predict(cv);
  let b = 0;
  r.forEach((x, j) => { if (x.probability > r[b].probability) b = j; });
  return { idx: b, prob: r[b].probability, probs: r.map((x) => x.probability) };
}
function guard(ctx, info) {
  return (e) => {
    // after the scene exits, cleanup disposes models that in-flight predict() calls still use; those errors are expected
    if (isAbort(e) || !ctx.active) return;
    console.error(e);
    if (ctx.active && info) { info.textContent = `發生錯誤：${e && e.message ? e.message : e}`; info.classList.add("err"); }
  };
}

function lineChart(cv, series, { n = 2, max = 1, fmt = pct } = {}) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const L = 38, R = 8, T = 7, B = 16, pw = w - L - R, ph = h - T - B;
  g.font = `10px ${MONO()}`;
  g.strokeStyle = C("--line"); g.fillStyle = C("--muted"); g.lineWidth = 1;
  g.textAlign = "right"; g.textBaseline = "middle";
  [0, 0.5, 1].forEach((f) => { const y = T + ph * (1 - f); g.beginPath(); g.moveTo(L, y); g.lineTo(w - R, y); g.stroke(); g.fillText(fmt(max * f), L - 5, y); });
  g.textAlign = "center"; g.textBaseline = "top";
  g.fillText("1", L, h - B + 3);
  g.fillText(`${n} 輪`, w - R - 14, h - B + 3);
  const X = (k) => L + (n > 1 ? k / (n - 1) : 0) * pw, Y = (v) => T + ph * (1 - Math.max(0, Math.min(v, max)) / max);
  for (const s of series) {
    if (!s.vals.length) continue;
    g.setLineDash(s.dash ? [5, 4] : []);
    g.strokeStyle = s.color; g.lineWidth = s.dash ? 1.5 : 2; g.lineJoin = "round";
    g.beginPath();
    s.vals.forEach((v, k) => (k ? g.lineTo(X(k), Y(v)) : g.moveTo(X(k), Y(v))));
    g.stroke();
  }
  g.setLineDash([]);
}

// Self-built PCA (not part of Teachable Machine): Gram matrix + power iteration, top two components.
function pca2(rows) {
  const n = rows.length, d = rows[0].length;
  const mean = new Float64Array(d);
  for (const r of rows) for (let j = 0; j < d; j++) mean[j] += r[j] / n;
  const X = rows.map((r) => Float64Array.from(r, (v, j) => v - mean[j]));
  const G = X.map((a) => X.map((b) => { let s = 0; for (let j = 0; j < d; j++) s += a[j] * b[j]; return s; }));
  let total = 0;
  for (let i = 0; i < n; i++) total += G[i][i];
  const axes = [], lams = [];
  for (let k = 0; k < 2; k++) {
    let v = Array.from({ length: n }, (_, i) => 1 + ((i * 7919) % 13) / 13), lam = 0;
    for (let it = 0; it < 150; it++) {
      const u = G.map((row) => row.reduce((s, x, j) => s + x * v[j], 0));
      lam = Math.hypot(...u) || 1;
      v = u.map((x) => x / lam);
    }
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) G[i][j] -= lam * v[i] * v[j];
    const w = new Float64Array(d), s = Math.sqrt(lam) || 1;
    X.forEach((x, i) => { for (let j = 0; j < d; j++) w[j] += (x[j] * v[i]) / s; });
    axes.push(w); lams.push(lam);
  }
  const project = (f) => axes.map((w) => { let s = 0; for (let j = 0; j < d; j++) s += (f[j] - mean[j]) * w[j]; return s; });
  return { project, coords: rows.map(project), ratio: lams.map((l) => l / (total || 1)) };
}
// Same preprocessing as the library's capture(): pixels / 127 - 1, batch of one (self-built call)

        const list = [
          { name: "model.json", data: modelJson, type: "application/json", what: `網路結構＋${art.weightSpecs.length} 組權重的索引` },
          { name: "weights.bin", data: art.weightData, type: "application/octet-stream", what: "所有權重（含 MobileNet 基底）" },
          { name: "metadata.json", data: metaJson, type: "application/json", what: `類別名稱 ${meta.labels.join("、")}` },
        ].map((f) => ({ ...f, file: new File([f.data], f.name, { type: f.type }) }));
        list.forEach((f) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td class="n">${f.name}</td><td class="n">${kb(f.file.size)}</td><td></td>`;
          tr.lastChild.textContent = f.what;
          files.append(tr);
          const u = URL.createObjectURL(f.file);
          urls.push(u);
          const a = document.createElement("a");
          a.className = "btn"; a.href = u; a.download = f.name; a.textContent = `⬇ ${f.name}`;
          ctx.$(".tm-dl").append(a);
        });
        ctx.$(".meta").textContent = metaJson;
        info.textContent = "tmImage.loadFromFiles() 載入中…";
        await ctx.frame();
        const t0 = performance.now();
        loaded = await tmImage.loadFromFiles(list[0].file, list[1].file, list[2].file);
        const loadMs = performance.now() - t0;
        if (!ctx.active) throw abort();
        ctx.$(".k-load").textContent = sec(loadMs);
        let maxDiff = 0, same = 0;
        for (let i = 0; i < 6; i++) {
          const img = sample(KINDS[i % 2], 60000 + i);
          const a = await T.m.predict(img), b = await loaded.predict(img);
          if (!ctx.active) throw abort();
          const ai = a[0].probability >= a[1].probability ? 0 : 1, bi = b[0].probability >= b[1].probability ? 0 : 1;
          a.forEach((x, j) => (maxDiff = Math.max(maxDiff, Math.abs(x.probability - b[j].probability))));
          same += ai === bi ? 1 : 0;
          const tr = document.createElement("tr");
          tr.innerHTML = `<td></td><td class="n">${names[ai]} ${(a[ai].probability * 100).toFixed(2)}%</td><td class="n">${names[bi]} ${(b[bi].probability * 100).toFixed(2)}%</td>`;
          tr.firstChild.append(mini(img, 68));
          cmp.append(tr);
          await ctx.frame();
        }
        ctx.$(".k-diff").textContent = maxDiff === 0 ? "0" : maxDiff < 1e-4 ? maxDiff.toExponential(1) : maxDiff.toFixed(4);
        ctx.$(".k-same").textContent = `${same}/6`;
        info.textContent = `載回的模型共 ${loaded.model.layers.length} 層（MobileNet 基底＋分類層），${loaded.model.countParams().toLocaleString()} 個參數。檔案在本機產生，沒有上傳。`;
      } catch (e) { fail(e); }
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", api: "predict() ✕ N 張 vs model.predict(批次 32)",
    desc: "用訓練好的三類模型連續辨識 1 到 1024 張圖片，量每秒能辨識幾張。逐張模式是官方 predict()；批次模式把圖片疊成 32 張一批，直接呼叫 tf.js 的 model.predict()。產生圖片與預熱不計時。",
    hint: "選模式後按「開始測試」",
    async mount(ctx) {
      const MODES = ["predict() 逐張", "model.predict 批次 32"], POOL = 16, BATCH = 32;
      ctx.html(`<div class="tm-stress"><div class="tm-card"><h2>各模式最佳速度（張/秒）<b class="be">-</b></h2><div class="tm-bars">${MODES.map((m, i) =>
        `<div class="tm-bar" style="--k:var(${CLS[i + 1]})"><span>${m}</span><span class="t"><i></i></span><b>未測</b></div>`).join("")}</div>
        <div class="tm-kpi" style="margin-top:8px"><div><b class="k-t">-</b><span>tf 張量數</span></div><div><b class="k-acc">-</b><span>最近一批正確率</span></div><div><b class="k-n">-</b><span>最近一批張數</span></div></div></div>
        <div class="tm-card" style="overflow:hidden"><h2>最近一批的辨識結果（最多顯示 24 張）<b class="meta">-</b></h2><div class="tm-tiles"></div></div></div>`);
      const KINDS = ["circle", "triangle", "star"], names = KINDS.map((k) => KIND[k]);
      const bars = ctx.$$(".tm-bar"), best = MODES.map(() => 0);
      let mi = 1, gen = 0, pool = null;
      ctx.onCleanup(() => { if (pool) pool.dispose(); });
      await engine(ctx);
      const st = ctx.status("準備測試用模型：每類 3 張樣本，訓練 10 輪…");
      const T = teach(ctx, names, "stress");
      for (let k = 0; k < 3; k++) for (let j = 0; j < 3; j++) await T.add(k, sample(KINDS[k], 6000 + k * 100 + j, { size: 0.8 }));
      await T.fit({ epochs: 10 });
      st.done();
      const cvs = Array.from({ length: POOL }, (_, i) => sample(KINDS[i % 3], 7000 + i, { size: 0.8 }));
      pool = tf.tidy(() => tf.stack(cvs.map((c) => tf.browser.fromPixels(c).toFloat().div(127).sub(1))));
      ctx.$(".be").textContent = `後端 ${tf.getBackend()}`;
      const warmed = new Set();
      const paint = () => {
        const max = Math.max(...best, 0.001);
        best.forEach((v, i) => { bars[i].querySelector("i").style.width = `${(v / max) * 100}%`; bars[i].querySelector("b").textContent = v ? `${v.toFixed(v < 10 ? 1 : 0)} 張/秒` : "未測"; });
      };
      async function single(n, my) {
        const out = [];
        for (let i = 0; i < n; i++) {
          out.push(await classify(T, cvs[i % POOL]));
          if (!ctx.active || my !== gen) throw abort();
        }
        return out;
      }
      async function batched(n, my) {
        const out = [];
        for (let off = 0; off < n; off += BATCH) {
          const b = Math.min(BATCH, n - off);
          const y = tf.tidy(() => T.m.model.predict(tf.gather(pool, tf.tensor1d(Array.from({ length: b }, (_, j) => (off + j) % POOL), "int32"))));
          const d = await y.data();
          y.dispose();
          if (!ctx.active || my !== gen) throw abort();
          for (let j = 0; j < b; j++) {
            let k = 0;
            for (let c = 1; c < 3; c++) if (d[j * 3 + c] > d[j * 3 + k]) k = c;
            out.push({ idx: k, prob: d[j * 3 + k] });
          }
        }
        return out;
      }
      const makeBench = () => {
        const lab = ctx.el.querySelector(".sc-lab");
        if (lab) lab.remove();
        const my = ++gen, idx = mi;
        ctx.bench({
          label: `${MODES[idx]}・圖片張數`, unit: "張", sizes: [1, 4, 16, 64, 256, 1024], target: 1000, budget: 4000,
          async prepare(n) {
            if (my !== gen) throw abort();
            // warm-up (untimed): compile shaders for the batch shapes this size will use
            const shapes = idx ? [Math.min(n, BATCH), n > BATCH ? n % BATCH : 0].filter(Boolean) : [1];
            for (const b of shapes) {
              const key = `${idx}:${b}`;
              if (warmed.has(key)) continue;
              if (idx) await batched(b, my); else await single(1, my);
              warmed.add(key);
            }
            return null;
          },
          async run(n) {
            if (my !== gen) throw abort();
            const t0 = performance.now();
            const res = idx ? await batched(n, my) : await single(n, my);
            const rate = n / ((performance.now() - t0) / 1000);
            if (!ctx.active || my !== gen) throw abort();
            const ok = res.reduce((s, r, i) => s + (r.idx === i % POOL % 3 ? 1 : 0), 0);
            if (rate > best[idx]) best[idx] = rate;
            paint();
            const tiles = ctx.$(".tm-tiles");
            tiles.innerHTML = "";
            res.slice(0, 24).forEach((r, i) => tiles.append(tile(cvs[i % POOL], `${names[r.idx]} ${pct(r.prob)}`, r.idx === i % POOL % 3)));
            ctx.$(".k-t").textContent = tf.memory().numTensors;
            ctx.$(".k-acc").textContent = pct(ok / n);
            ctx.$(".k-n").textContent = n;
            ctx.$(".meta").textContent = MODES[idx];
            return `${rate.toFixed(rate < 10 ? 1 : 0)} 張/秒`;
          },
          note: "模型是 MobileNet v2（alpha 0.35，輸入 224×224）加上本場景訓練的分類層。逐張模式每次都經過官方 predict() 的裁切與正規化；批次模式用預先正規化好的張量，走 tf.js 的 model.predict()，不是 Teachable Machine 的公開 API。張量數穩定代表沒有記憶體洩漏。",
        });
      };
      ctx.group(MODES, mi, (i) => { mi = i; makeBench(); });
      ctx.controls.classList.add("bottom");
      ctx.$(".k-t").textContent = tf.memory().numTensors;
      makeBench();
    },
  },
] });
</script>
