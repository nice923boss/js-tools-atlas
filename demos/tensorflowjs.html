<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// TensorFlow.js showcase: live training, tensor ops, autodiff, optimizers, memory, image convolution,
// backend comparison and a matMul GFLOPS benchmark.
const { h, fmt, fmtMs } = Showcase;
const WASM_DIR = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/";
const WEBGPU_JS = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgpu@4.22.0/dist/tf-backend-webgpu.min.js";
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const CYAN = [76, 201, 240], PINK = [247, 37, 133];
const BK_NAME = { webgl: "WebGL", wasm: "WASM", cpu: "CPU", webgpu: "WebGPU" };
const BK_COLOR = { webgl: C[1], wasm: C[4], cpu: C[0], webgpu: C[5] };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const kb = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(1)} MB` : `${(b / 1024).toFixed(0)} KB`);

// Seeded random numbers so the datasets look the same on every visit
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

// ---------- backends ----------
let wasmReady = null, webgpuReady = null;
function ensureWasm(ctx) {
  wasmReady ??= ctx.load(WASM_DIR + "tf-backend-wasm.min.js").then(() => { tf.wasm.setWasmPaths(WASM_DIR); return true; })
    .catch(() => { wasmReady = null; return false; });
  return wasmReady;
}
// WebGPU is only offered when the browser exposes a real adapter.
function ensureWebGPU(ctx) {
  webgpuReady ??= (async () => {
    if (!navigator.gpu) return false;
    const adapter = await navigator.gpu.requestAdapter().catch(() => null);
    if (!adapter) return false;
    await ctx.load(WEBGPU_JS);
    return true;
  })().catch(() => false);
  return webgpuReady;
}
async function useBackend(name) {
  if (tf.getBackend() !== name) {
    const ok = await tf.setBackend(name);
    if (!ok) throw new Error(`無法切換到 ${BK_NAME[name] || name} 後端`);
  }
  await tf.ready();
}
// WebGL in this page; fall back to CPU if the context cannot be created
async function useGPU() {
  try { await useBackend("webgl"); } catch { await useBackend("cpu"); }
}

// Live tf.memory() readout: proves every scene releases its tensors on exit
function memTag(ctx) {
  const box = h("div", { class: "tf-mem" });
  ctx.el.append(box);
  const paint = () => {
    let m;
    // tf.memory() throws while an async setBackend() (e.g. WASM) is still initializing
    try { m = tf.memory(); } catch (e) {
      if (!/not yet been initialized/.test(e.message)) throw e;
      box.textContent = "切換後端中…";
      return;
    }
    const gpu = m.numBytesInGPU != null ? `・GPU <b>${kb(m.numBytesInGPU)}</b>` : "";
    box.innerHTML = `${tf.getBackend()}・張量 <b>${m.numTensors}</b>・<b>${kb(m.numBytes)}</b>${gpu}`;
  };
  paint();
  ctx.interval(paint, 400);
  return box;
}

// HiDPI canvas that tracks its host element size
function canvasIn(ctx, host, onFit) {
  const cv = h("canvas");
  host.append(cv);
  const g = cv.getContext("2d");
  const st = { cv, g, w: 0, h: 0 };
  const fit = (first) => {
    const w = host.clientWidth, hh = host.clientHeight;
    if (!w || !hh || (w === st.w && hh === st.h)) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    st.w = w; st.h = hh;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    // first call is deferred so the caller can finish assigning the returned object
    if (onFit) first === true ? queueMicrotask(() => ctx.active && onFit(st)) : onFit(st);
  };
  const ro = new ResizeObserver(() => fit());
  ro.observe(host);
  ctx.onCleanup(() => ro.disconnect());
  fit(true);
  return st;
}

// Run a background loop; surface its error in the scene instead of an unhandled rejection
function loop(ctx, fn) {
  const p = fn().catch((e) => { if (ctx.active && e.name !== "AbortError") ctx.status(`發生錯誤：${e.message}`).error(`發生錯誤：${e.message}`); });
  return p;
}

// ---------- scene 1 data ----------
function makeData(kind) {
  const r = rng(kind === "spiral" ? 7 : kind === "circle" ? 11 : 13);
  const pts = [];
  if (kind === "spiral") {
    for (let i = 0; i < 90; i++) {
      const rad = (i / 90) * 0.88 + 0.06;
      for (let c = 0; c < 2; c++) {
        const t = (1.75 * i / 90) * 2 * Math.PI + c * Math.PI;
        pts.push({ x: rad * Math.sin(t) + (r() - 0.5) * 0.08, y: rad * Math.cos(t) + (r() - 0.5) * 0.08, c });
      }
    }
  } else if (kind === "circle") {
    while (pts.length < 200) {
      const x = r() * 2 - 1, y = r() * 2 - 1, d = Math.hypot(x, y);
      if (d < 0.42) pts.push({ x, y, c: 0 }); else if (d > 0.58 && d < 0.95) pts.push({ x, y, c: 1 });
    }
  } else if (kind === "xor") {
    while (pts.length < 200) {
      const x = r() * 2 - 1, y = r() * 2 - 1;
      if (Math.abs(x) > 0.08 && Math.abs(y) > 0.08) pts.push({ x, y, c: x * y > 0 ? 0 : 1 });
    }
  }
  return pts;
}
function buildClassifier(layers, units) {
  const m = tf.sequential();
  for (let i = 0; i < layers; i++) m.add(tf.layers.dense(i === 0 ? { units, activation: "tanh", inputShape: [2] } : { units, activation: "tanh" }));
  m.add(tf.layers.dense({ units: 1, activation: "sigmoid" }));
  const opt = tf.train.adam(0.03);
  m.compile({ optimizer: opt, loss: "binaryCrossentropy", metrics: ["accuracy"] });
  return { m, opt };
}

// ---------- scene 3/4 functions (written with tf ops, so tf.grad can differentiate them) ----------
const FUNCS = [
  { label: "x³ − 3x", f: (x) => x.pow(3).sub(x.mul(3)), range: [-2.4, 2.4] },
  { label: "x·sin(2x)", f: (x) => x.mul(x.mul(2).sin()), range: [-4, 4] },
  { label: "tanh(x)", f: (x) => x.tanh(), range: [-4, 4] },
  { label: "e^(−x²)", f: (x) => x.square().neg().exp(), range: [-3, 3] },
];
const SURFACES = [
  { label: "Himmelblau", x: [-5, 5], y: [-5, 5], start: [-0.5, -4.6],
    f: (x, y) => x.square().add(y).sub(11).square().add(x.add(y.square()).sub(7).square()),
    lr: { sgd: 0.008, momentum: 0.002, rmsprop: 0.06, adam: 0.12 } },
  { label: "Rosenbrock", x: [-2, 2], y: [-1, 3], start: [-1.6, 2.6],
    f: (x, y) => tf.scalar(1).sub(x).square().add(y.sub(x.square()).square().mul(10)),
    lr: { sgd: 0.006, momentum: 0.0015, rmsprop: 0.02, adam: 0.06 } },
  { label: "狹長碗", x: [-5, 5], y: [-3, 3], start: [-4.5, 2.4],
    f: (x, y) => x.square().mul(0.05).add(y.square().mul(2)),
    lr: { sgd: 0.45, momentum: 0.05, rmsprop: 0.08, adam: 0.15 } },
];
const OPTS = [
  { id: "sgd", name: "SGD", color: C[0], make: (lr) => tf.train.sgd(lr) },
  { id: "momentum", name: "Momentum", color: C[1], make: (lr) => tf.train.momentum(lr, 0.9) },
  { id: "rmsprop", name: "RMSProp", color: C[2], make: (lr) => tf.train.rmsprop(lr) },
  { id: "adam", name: "Adam", color: C[3], make: (lr) => tf.train.adam(lr) },
];

// ---------- scene 6 filters (input: float32 [H, W, 3] in 0..1) ----------
const SOBEL = [[-1, 0, 1, -2, 0, 2, -1, 0, 1], [-1, -2, -1, 0, 0, 0, 1, 2, 1]];
const gray3 = (img) => img.mul([0.299, 0.587, 0.114]).sum(2, true);
const FILTERS = [
  { label: "模糊", code: "tf.avgPool(x, k, 1, 'same')", run: (img, s) => {
    const k = 1 + 2 * Math.round(s);
    return tf.avgPool(tf.avgPool(img.expandDims(0), k, 1, "same"), k, 1, "same").squeeze([0]);
  } },
  { label: "邊緣", code: "tf.conv2d(gray, sobel, 1, 'same')", run: (img, s) => {
    const k = tf.tensor4d([0, 1, 2, 3, 4, 5, 6, 7, 8].flatMap((i) => [SOBEL[0][i], SOBEL[1][i]]), [3, 3, 1, 2]);
    const g = tf.conv2d(gray3(img).expandDims(0), k, 1, "same").squeeze([0]);
    return g.square().sum(2, true).sqrt().mul(0.4 + s * 0.25).tile([1, 1, 3]);
  } },
  { label: "銳化", code: "tf.depthwiseConv2d(x, kernel, 1, 'same')", run: (img, s) => {
    const a = s * 0.35;
    const k = [0, -a, 0, -a, 1 + 4 * a, -a, 0, -a, 0];
    const ker = tf.tensor4d(k.flatMap((v) => [v, v, v]), [3, 3, 3, 1]);
    return tf.depthwiseConv2d(img.expandDims(0), ker, 1, "same").squeeze([0]);
  } },
  { label: "浮雕", code: "tf.conv2d(gray, emboss) + 0.5", run: (img, s) => {
    const k = tf.tensor4d([-2, -1, 0, -1, 1, 1, 0, 1, 2].map((v) => v * (0.3 + s * 0.15)), [3, 3, 1, 1]);
    return tf.conv2d(gray3(img).expandDims(0), k, 1, "same").squeeze([0]).add(0.5).tile([1, 1, 3]);
  } },
  { label: "像素化", code: "resizeNearestNeighbor ↓ 再 ↑", run: (img, s) => {
    const [H, W] = img.shape, f = 2 + Math.round(s * 3);
    const small = tf.image.resizeNearestNeighbor(img, [Math.max(1, Math.round(H / f)), Math.max(1, Math.round(W / f))]);
    return tf.image.resizeNearestNeighbor(small, [H, W]);
  } },
  { label: "色調分離", code: "x.mul(n).round().div(n)", run: (img, s) => {
    const n = Math.max(1, 7 - Math.round(s));
    return img.mul(n).round().div(n);
  } },
];
const PHOTOS = [["photo-4.jpg", "巴哥犬"], ["photo-7.jpg", "母獅"], ["photo-2.jpg", "峽谷"], ["photo-6.jpg", "水母"]];
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`圖片載入失敗：${src}`));
    img.src = src;
  });
}

// ---------- scene 7 workloads (same seeded inputs on every backend) ----------
function seeded(n, seed) { const r = rng(seed), a = new Float32Array(n); for (let i = 0; i < n; i++) a[i] = r() * 2 - 1; return a; }
const TASKS = [
  { name: "矩陣乘法", sub: "512×512", inputs: [[[512, 512], 1], [[512, 512], 2]], run: ([a, b]) => tf.matMul(a, b) },
  { name: "卷積", sub: "128²×16 通道", inputs: [[[1, 128, 128, 16], 3], [[3, 3, 16, 16], 4]], run: ([x, k]) => tf.conv2d(x, k, 1, "same") },
  { name: "逐元素", sub: "100 萬個", inputs: [[[1000000], 5]], run: ([x]) => tf.tidy(() => x.mul(1.5).add(0.5).relu().sqrt()) },
  { name: "歸約加總", sub: "100 萬個", inputs: [[[1000000], 6]], run: ([x]) => x.sum() },
];
const INPUT_CACHE = new Map();
const inputData = ([shape, seed]) => {
  const key = shape.join("x") + ":" + seed;
  if (!INPUT_CACHE.has(key)) INPUT_CACHE.set(key, seeded(shape.reduce((a, b) => a * b, 1), seed));
  return INPUT_CACHE.get(key);
};

const GFLOPS = {}; // backend -> { n: gflops }, kept across visits to the stress scene

Showcase.run({ scenes: [
  {
    id: "train", title: "即時訓練",
    api: "tf.sequential() + model.trainOnBatch(xs, ys)",
    desc: "兩層 tanh 全連接網路在頁面上即時訓練，背景是模型對每個位置的判斷（model.predict 一次算 48×48 個點），右側是 loss 曲線。",
    hint: "點畫面加入資料點（先選顏色）・換資料集或調整層數後重新訓練",
    async mount(ctx) {
      await useBackend("cpu");
      ctx.html(`<div class="tf-wrap tf-train"><div class="tf-box tf-board"><div class="tf-tag">準備中…</div></div>
        <div class="tf-side"><div class="tf-stats"><div>Epoch<b data-k="ep">0</b></div><div>Loss<b data-k="loss">…</b></div>
        <div>準確率<b data-k="acc">…</b></div><div>參數量<b data-k="par">…</b></div></div><div class="tf-box tf-loss"></div></div></div>`);
      const board = ctx.$(".tf-board"), tag = ctx.$(".tf-tag");
      const stat = (k, v) => (ctx.$(`[data-k="${k}"]`).textContent = v);
      let kind = "spiral", pts = makeData(kind), paint = 0, layers = 2, units = 10;
      let dirtyData = true, dirtyModel = true, model = null, xs = null, ys = null, epoch = 0, hist = [], heat = null;
      const N = 48;

        } else if (mode === 1) {
          const x = tf.randomNormal([128, 128]);
          const a = x.square(), b = a.mean(1), c = b.sqrt(), y = c.add(1);
          x.dispose(); a.dispose(); b.dispose(); c.dispose();
          last?.dispose(); last = y;
        } else {
          const y = tf.tidy(() => tf.randomNormal([128, 128]).square().mean(1).sqrt().add(1));
          last?.dispose(); last = y;
        }
      }, 50);
      ctx.interval(() => {
        const m = tf.memory();
        histN.push(m.numTensors); if (histN.length > 160) histN.shift();
        stat("n", m.numTensors, leaked.length ? "bad" : "ok");
        stat("b", kb(m.numBytes));
        stat("leak", leaked.length >= LIMIT ? `${leaked.length} 上限` : leaked.length, leaked.length ? "bad" : "ok");
        stat("d", m.numTensors - prevN >= 0 ? `+${m.numTensors - prevN}` : m.numTensors - prevN);
        prevN = m.numTensors;
        const { g, w, h: hh } = view;
        if (!w) return;
        g.clearRect(0, 0, w, hh);
        const max = Math.max(50, ...histN) * 1.15;
        g.strokeStyle = "rgba(255,255,255,0.08)"; g.lineWidth = 1; g.fillStyle = "#9b998f"; g.font = `11px ${css.getPropertyValue("--mono")}`;
        for (let i = 0; i <= 4; i++) { const y = 20 + (hh - 40) * (i / 4); g.beginPath(); g.moveTo(40, y); g.lineTo(w - 8, y); g.stroke(); g.fillText(String(Math.round(max * (1 - i / 4))), 4, y + 4); }
        g.font = `11.5px ${css.getPropertyValue("--font")}`; g.fillText("tf.memory().numTensors（每 0.25 秒取樣）", 44, 12);
        g.beginPath();
        histN.forEach((v, i) => { const x = 40 + (i / 159) * (w - 48), y = hh - 20 - (v / max) * (hh - 40); i ? g.lineTo(x, y) : g.moveTo(x, y); });
        g.strokeStyle = leaked.length ? C[2] : C[3]; g.lineWidth = 2.2; g.stroke();
      }, 250);
    },
  },
  {
    id: "image", title: "影像卷積",
    api: "tf.browser.fromPixels(img) → conv2d / avgPool → tf.browser.toPixels",
    desc: "照片轉成 [高, 寬, 3] 的張量後，用卷積核做邊緣偵測、銳化、浮雕，用池化做模糊，全部在 GPU 上執行，再以 toPixels 畫回畫布。左半邊是原圖。",
    hint: "拖曳中線比較前後・切換濾鏡與照片・調整強度",
    paper: false,
    async mount(ctx) {
      await useGPU();
      ctx.html(`<div class="tf-wrap tf-img"><div class="tf-photo"><canvas class="a"></canvas><canvas class="b"></canvas><div class="tf-split"></div>
        <div class="tf-tag">原圖</div><div class="tf-tag r">處理後</div></div></div>`);
      memTag(ctx);
      const wrap = ctx.$(".tf-img"), photo = ctx.$(".tf-photo"), ca = ctx.$("canvas.a"), cb = ctx.$("canvas.b"), split = ctx.$(".tf-split"), rtag = ctx.$(".tf-tag.r");
      let fi = 1, strength = 3, pi = 0, src = null, split01 = 0.5, busy = false, again = false;
      const fit = () => {
        const W = wrap.clientWidth - 20, H = wrap.clientHeight - parseFloat(getComputedStyle(wrap).paddingTop) - parseFloat(getComputedStyle(wrap).paddingBottom);
        const w = Math.max(10, Math.min(W, H * 1.5));
        photo.style.width = `${w}px`; photo.style.height = `${w / 1.5}px`;
      };
      const ro = new ResizeObserver(fit); ro.observe(wrap); ctx.onCleanup(() => ro.disconnect());
      const setSplit = (v) => { split01 = clamp(v, 0, 1); cb.style.clipPath = `inset(0 0 0 ${split01 * 100}%)`; split.style.left = `${split01 * 100}%`; };
      setSplit(0.5);
      ctx.on(photo, "pointerdown", (e) => { photo.setPointerCapture(e.pointerId); const r = photo.getBoundingClientRect(); setSplit((e.clientX - r.left) / r.width); });
      ctx.on(photo, "pointermove", (e) => { if (!e.buttons) return; const r = photo.getBoundingClientRect(); setSplit((e.clientX - r.left) / r.width); });
      async function apply() {
        if (!src || !ctx.active) return;
        if (busy) { again = true; return; }
        busy = true;
        const t0 = performance.now();
        const out = tf.tidy(() => FILTERS[fi].run(src, strength).clipByValue(0, 1));
        await tf.browser.toPixels(out, cb);
        out.dispose();
        rtag.textContent = `${FILTERS[fi].label}・${(performance.now() - t0).toFixed(0)} ms`;
        busy = false;
        if (again) { again = false; apply(); }
      }
      async function loadPhoto(i) {
        pi = i;
        const img = await loadImage(`_shared/img/${PHOTOS[i][0]}`);
        if (!ctx.active) return;
        src?.dispose();
        src = tf.tidy(() => tf.image.resizeBilinear(tf.browser.fromPixels(img), [400, 600]).div(255));
        await tf.browser.toPixels(src, ca);
        ctx.$(".tf-tag").textContent = `原圖 [${src.shape.join(",")}] ${src.dtype}`;
        apply();
      }
      ctx.onCleanup(() => { const s = src; src = null; s?.dispose(); });
      ctx.select("", FILTERS.map((f, i) => ({ value: i, label: f.label })), fi, (v) => { fi = +v; apply(); });
      ctx.select("", PHOTOS.map((p, i) => ({ value: i, label: p[1] })), pi, (v) => loadPhoto(+v));
      ctx.slider("強度", { min: 1, max: 6, step: 0.5, value: strength, format: (v) => v.toFixed(1) }, (v) => { strength = v; apply(); });
      await loadPhoto(0);
    },
  },
  {
    id: "backends", title: "後端比較",
    api: "tf.setBackend('webgl' | 'wasm' | 'cpu' | 'webgpu')",
    desc: "同一段程式、同一組輸入分別在各後端執行（取 3 次中位數，已扣除首次編譯），並以 CPU 結果為基準算最大相對誤差。大型矩陣運算 GPU 佔優，小型或分支多的運算 WASM 常常更快。",
    hint: "按「重新測試」再跑一次；WebGPU 只在瀏覽器支援時出現",
    async mount(ctx) {
      ctx.html(`<div class="tf-wrap tf-bk"><table class="tf-table"></table><div class="tf-info">偵測後端中…</div></div>`);
      memTag(ctx);
      const [hasWasm, hasGpu] = await Promise.all([ensureWasm(ctx), ensureWebGPU(ctx)]);
      if (!ctx.active) return;
      const list = ["webgl", ...(hasGpu ? ["webgpu"] : []), ...(hasWasm ? ["wasm"] : []), "cpu"];
      const table = ctx.$(".tf-table"), info = ctx.$(".tf-info");
      table.innerHTML = `<tr><th></th>${list.map((b) => `<th data-h="${b}" style="color:${BK_COLOR[b]}">${BK_NAME[b]}</th>`).join("")}</tr>`
        + TASKS.map((t, ti) => `<tr><td>${t.name}<br><span class="tf-k">${t.sub}</span></td>${list.map((b) => `<td><div class="tf-cell" data-c="${ti}-${b}"><span class="v">…</span><div class="bar"><i style="background:${BK_COLOR[b]}"></i></div><span class="e">&nbsp;</span></div></td>`).join("")}</tr>`).join("");
      const res = {};
      let running = false;
      const cell = (ti, b) => ctx.$(`[data-c="${ti}-${b}"]`);
      async function runAll() {
        if (running) return;
        running = true;
        try {
          table.querySelectorAll(".v").forEach((v) => (v.textContent = "…"));
          for (const b of list) {
            try { await useBackend(b); } catch { TASKS.forEach((_, ti) => (cell(ti, b).querySelector(".v").textContent = "不可用")); continue; }
            if (!ctx.active) return;
            ctx.$$(".tf-table th").forEach((th) => th.classList.toggle("cur", th.dataset.h === b));
            for (let ti = 0; ti < TASKS.length; ti++) {
              const t = TASKS[ti];
              const ins = t.inputs.map((d) => tf.tensor(inputData(d), d[0]));
              const times = [];
              let out = null;
              for (let k = 0; k < 4; k++) {
                const t0 = performance.now();
                const y = t.run(ins);
                const data = await y.data();
                times.push(performance.now() - t0);
                y.dispose();
                if (k === 3) out = data;
                await ctx.frame(1);
                if (!ctx.active) { ins.forEach((x) => x.dispose()); return; }
              }
              ins.forEach((x) => x.dispose());
              times.shift(); times.sort((p, q) => p - q);
              res[`${ti}-${b}`] = { ms: times[1], out };
              const row = list.map((x) => res[`${ti}-${x}`]?.ms).filter((x) => x != null);
              const worst = Math.max(...row), best = Math.min(...row);
              list.forEach((x) => {
                const r = res[`${ti}-${x}`];
                if (!r) return;
                const c = cell(ti, x);
                c.querySelector(".v").textContent = fmtMs(r.ms);
                c.querySelector(".bar i").style.width = `${Math.max(3, (r.ms / worst) * 100)}%`;
                c.classList.toggle("best", r.ms === best && row.length > 1);
              });
            }
          }
          // error against the CPU reference
          for (let ti = 0; ti < TASKS.length; ti++) {
            const ref = res[`${ti}-cpu`]?.out;
            if (!ref) continue;
            const scale = Math.max(1e-6, ...Array.from(ref, Math.abs));
            for (const b of list) {
              const r = res[`${ti}-${b}`];
              if (!r) continue;
              let err = 0;
              for (let i = 0; i < ref.length; i++) err = Math.max(err, Math.abs(r.out[i] - ref[i]));
              cell(ti, b).querySelector(".e").textContent = b === "cpu" ? "基準" : `誤差 ${(err / scale).toExponential(1)}`;
            }
          }
          ctx.$$(".tf-table th").forEach((th) => th.classList.remove("cur"));
        } finally { running = false; }
        await useGPU();
      }
      await useGPU();
      const gl = tf.backend() && tf.getBackend() === "webgl" ? `WebGL ${tf.env().getNumber("WEBGL_VERSION")}・float32 紋理 ${tf.env().getBool("WEBGL_RENDER_FLOAT32_ENABLED") ? "支援" : "不支援"}` : "WebGL 不可用";
      const wasmInfo = hasWasm ? `WASM SIMD ${tf.env().getAsync ? "" : ""}${await tf.env().getAsync("WASM_HAS_SIMD_SUPPORT") ? "支援" : "不支援"}・多執行緒 ${await tf.env().getAsync("WASM_HAS_MULTITHREAD_SUPPORT") ? "支援" : "不支援（需 cross-origin isolation）"}` : "WASM 後端載入失敗";
      info.innerHTML = `<b>${gl}</b>・<b>${wasmInfo}</b>・WebGPU ${hasGpu ? "<b>支援</b>" : "<b>此瀏覽器不支援</b>"}`;
      ctx.button("重新測試", () => loop(ctx, runAll), { primary: true });
      await loop(ctx, runAll);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "tf.matMul(a, b) → await c.data()",
    desc: "n×n 矩陣乘法需要 2n³ 次浮點運算。逐級放大 n，量一次乘法加上讀回結果的時間，換算成 GFLOPS（每秒十億次浮點運算）。切換後端再測一次，右側圖會疊出各後端的曲線。",
    hint: "先選後端，再按「開始測試」",
    async mount(ctx) {
      await useGPU();
      ctx.html(`<div class="tf-stress tf-box"></div>`);
      memTag(ctx).style.cssText = "left:auto;right:10px;top:8px;bottom:auto;";
      const view = canvasIn(ctx, ctx.$(".tf-stress"), () => draw());
      const SIZES = [128, 256, 384, 512, 768, 1024, 1536, 2048];
      const live = new Set();
      ctx.onCleanup(() => live.forEach((t) => t.dispose()));
      let backend = tf.getBackend();
      const hasWasm = await ensureWasm(ctx);
      const opts = ["webgl", ...(hasWasm ? ["wasm"] : []), "cpu"];
      ctx.controls.classList.add("bottom");
      ctx.group(opts.map((b) => BK_NAME[b]), Math.max(0, opts.indexOf(backend)), async (i) => { await useBackend(opts[i]); backend = opts[i]; draw(); });
      function draw() {
        const { g, w, h: hh } = view;
        if (!w) return;
        g.clearRect(0, 0, w, hh);
        const L = 46, R = w - 14, T = 26, B = hh - 30;
        const all = Object.values(GFLOPS).flatMap((o) => Object.values(o));
        const max = Math.max(1, ...all) * 1.15;
        const X = (n) => L + (Math.log2(n / SIZES[0]) / Math.log2(SIZES[SIZES.length - 1] / SIZES[0])) * (R - L);
        const Y = (v) => B - (v / max) * (B - T);
        g.font = `11px ${css.getPropertyValue("--mono")}`; g.fillStyle = "#9b998f"; g.strokeStyle = "rgba(255,255,255,0.08)"; g.lineWidth = 1;
        for (let i = 0; i <= 4; i++) { const v = (max * i) / 4, y = Y(v); g.beginPath(); g.moveTo(L, y); g.lineTo(R, y); g.stroke(); g.fillText(v.toFixed(v < 10 ? 1 : 0), 6, y + 4); }
        SIZES.forEach((n) => g.fillText(String(n), X(n) - 12, B + 16));
        g.font = `11.5px ${css.getPropertyValue("--font")}`;
        g.fillText("GFLOPS（越高越快）・橫軸：矩陣邊長 n", L, 14);
        let ly = T + 22;
        for (const [b, o] of Object.entries(GFLOPS)) {
          const pts = SIZES.filter((n) => o[n] != null);
          if (!pts.length) continue;
          g.beginPath(); pts.forEach((n, i) => (i ? g.lineTo(X(n), Y(o[n])) : g.moveTo(X(n), Y(o[n]))));
          g.strokeStyle = BK_COLOR[b]; g.lineWidth = 2.4; g.stroke();
          pts.forEach((n) => { g.beginPath(); g.arc(X(n), Y(o[n]), 3.5, 0, Math.PI * 2); g.fillStyle = BK_COLOR[b]; g.fill(); });
          g.fillStyle = BK_COLOR[b]; g.fillText(`${BK_NAME[b]}${b === backend ? "（目前）" : ""}`, R - 110, ly); ly += 16;
        }
        if (!all.length) { g.fillStyle = "#9b998f"; g.fillText(`目前後端：${BK_NAME[backend]}，按「開始測試」`, L + 10, (T + B) / 2); }
      }
      ctx.bench({
        label: "矩陣邊長", unit: "", sizes: SIZES, target: 800, budget: 3000,
        format: (n) => `${n}²`,
        async prepare(n) {
          const a = tf.randomNormal([n, n]), b = tf.randomNormal([n, n]);
          live.add(a); live.add(b);
          const warm = tf.matMul(a, b); await warm.data(); warm.dispose(); // compile shaders / warm caches first
          return { a, b };
        },
        async run(n, { a, b }) {
          const t0 = performance.now();
          const c = tf.matMul(a, b);
          await c.data();
          c.dispose(); a.dispose(); b.dispose(); live.delete(a); live.delete(b);
          const ms = performance.now() - t0;
          const gf = (2 * n ** 3) / (Math.max(ms, 0.01) / 1000) / 1e9;
          (GFLOPS[backend] ??= {})[n] = gf;
          draw();
          return `${gf.toFixed(gf < 10 ? 2 : 1)} GFLOPS`;
        },
        note: "每一級先做一次暖身（WebGL 編譯著色器），計時只含一次乘法與讀回結果。CPU 後端是純 JavaScript，WASM 會用 SIMD；WebGL 在軟體繪圖環境下數字會偏低。",
      });
    },
  },
] });
</script>
