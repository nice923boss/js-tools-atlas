<script>
// Tesseract.js 7: every scene creates its own worker(s) and terminates them on exit.
const LIB = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js";
const WORKER = "https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/worker.min.js";
const LANGS = ["chi_tra", "eng"];
const FONT = '"Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif';
const PAL = ["#4cc9f0", "#f7df1e", "#7bd389", "#f72585", "#b388ff", "#ff9f43", "#48bfe3", "#ef476f"];
const STEP = {
  "loading tesseract core": "載入辨識引擎",
  "initializing tesseract": "初始化引擎",
  "loading language traineddata": "下載語言字庫",
  "loading language traineddata (from cache)": "讀取快取字庫",
  "initializing api": "初始化語言模型",
};
let primed = false;
let workerURL = "";

const confColor = (c) => (c >= 80 ? "#7bd389" : c >= 60 ? "#f7df1e" : "#f72585");
// Tesseract inserts spaces between CJK glyphs; drop them for readability
const tidy = (t) => String(t || "").trim().replace(/([　-鿿＀-￯])\s+(?=[　-鿿＀-￯])/g, "$1");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = (s) => tidy(s).normalize("NFKC").replace(/\s+/g, "");
const linesOf = (d) => (d.blocks || []).flatMap((b) => b.paragraphs.flatMap((p) => p.lines)).filter((l) => tidy(l.text));
const wordsOf = (d) => linesOf(d).flatMap((l) => l.words).filter((w) => w.text.trim());
const abort = () => new DOMException("Scene unmounted", "AbortError");
const ms = (t) => `${Math.round(t)} ms`;

function lev(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
// Character accuracy = 1 - edit distance / truth length, whitespace and full-width forms ignored
function accuracy(truth, got) {
  const a = [...norm(truth)], b = [...norm(got)];
  return a.length ? Math.max(0, 1 - lev(a, b) / a.length) : (b.length ? 0 : 1);
}
const pct = (x) => `${Math.round(x * 100)}%`;
const accColor = (x) => confColor(x * 100);
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const pick = (r, arr) => arr[Math.floor(r() * arr.length)];

async function engine(ctx) {
  if (!primed) {
    await ctx.gate({
      icon: "🔍", title: "中英文 OCR 文字辨識",
      desc: "按下後下載 Tesseract 辨識引擎與繁體中文、英文字庫，之後全部在瀏覽器內辨識，圖片不會上傳。字庫會存進瀏覽器快取，切換場景不用重新下載。",
      tags: ["約 6 MB", "繁中＋英文", "WebAssembly"], button: "下載並開始（約 6 MB）",
    });
  }
  if (!window.Tesseract || !Tesseract.createWorker) {
    const s = ctx.status("下載 tesseract.js…");
    await ctx.load(LIB);
    s.done();
  }
  if (!workerURL) {
    // The engine prints harmless diagnostics ("Parameter not found", resolution estimates) through
    // console.error inside the worker; this wrapper filters only those before loading the official worker.
    workerURL = URL.createObjectURL(new Blob([
      'const e = console.error; console.error = (...a) => { if (!/Parameter not found|Estimating resolution|Empty page|diacritics/.test(String(a[0]))) e(...a); };' +
      `importScripts("${WORKER}");`,
    ], { type: "text/javascript" }));
  }
}

async function makeWorker(ctx, { onLog, quiet = false, cleanup = true } = {}) {
  await engine(ctx);
  const s = quiet ? null : ctx.status(primed ? "啟動辨識引擎…" : "下載辨識引擎與字庫…");
  let w;
  try {
    w = await Tesseract.createWorker(LANGS, 1, {
      workerPath: workerURL, workerBlobURL: false,
      logger: (m) => {
        if (s && m.status !== "recognizing text") { s.text(`${STEP[m.status] || m.status}… ${Math.round((m.progress || 0) * 100)}%`); s.progress(m.progress || 0); }
        if (onLog) onLog(m);
      },
    });
  } catch (e) {
    if (s) s.error(`載入失敗：${e && e.message ? e.message : e}`);
    throw e;
  }
  if (cleanup) ctx.onCleanup(() => w.terminate());
  primed = true;
  if (s) s.done();
  if (!ctx.active) throw abort();
  return w;
}

// Runs fn one at a time; a trigger during a run schedules exactly one more run.
function serial(ctx, fn) {
  let running = false, again = false;
  return async function go() {
    if (running) { again = true; return; }
    running = true;
    try {
      do { again = false; await fn(); } while (again && ctx.active);
    } catch (e) {
      if (ctx.active && !(e && e.name === "AbortError")) ctx.status("").error(`辨識失敗：${e && e.message ? e.message : e}`);
    } finally { running = false; }
  };
}

const FRAME = '<div class="ts-frame"><canvas class="ts-img"></canvas><canvas class="ts-ov"></canvas><i class="ts-scan"></i></div>';
function frameOf(box) {
  const cv = box.querySelector(".ts-img"), ov = box.querySelector(".ts-ov");
  const g = cv.getContext("2d", { willReadFrequently: true }), og = ov.getContext("2d");
  return {
    box, cv, g, ov, og,
    size(w, h) { cv.width = ov.width = w; cv.height = ov.height = h; },
    clear() { og.clearRect(0, 0, ov.width, ov.height); },
    scanning(on) { box.classList.toggle("on", on); },
    boxes(items, { color = (it) => confColor(it.confidence), pad = 3, hi = -1, dashed } = {}) {
      const lw = Math.max(1.5, ov.width / 330);
      items.forEach((it, i) => {
        const { x0, y0, x1, y1 } = it.bbox;
        og.lineWidth = i === hi ? lw * 2 : lw;
        og.strokeStyle = color(it, i);
        og.setLineDash(dashed && dashed(it) ? [5, 4] : []);
        if (i === hi) { og.fillStyle = "rgba(76,201,240,.25)"; og.fillRect(x0 - pad, y0 - pad, x1 - x0 + pad * 2, y1 - y0 + pad * 2); }
        og.strokeRect(x0 - pad, y0 - pad, x1 - x0 + pad * 2, y1 - y0 + pad * 2);
      });
      og.setLineDash([]);
    },
  };
}
// Draw text and return its box in image pixels (used for region presets)
function put(g, s, x, y, { size = 28, weight = 600, color = "#222", align = "left", font = FONT } = {}) {
  g.font = `${weight} ${size}px ${font}`;
  g.fillStyle = color; g.textAlign = align;
  g.fillText(s, x, y);
  const w = g.measureText(s).width;
  const left = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
  return { left, top: y - size, width: w, height: size * 1.25 };
}
const padRect = (r, p, W, H) => {
  const left = Math.max(2, Math.round(r.left - p)), top = Math.max(2, Math.round(r.top - p));
  // Rectangles that touch the right edge come back empty in this build, so keep a 2 px margin
  const right = Math.min(W - 2, Math.round(r.left + r.width + p)), bottom = Math.min(H - 2, Math.round(r.top + r.height + p));
  return { left, top, width: right - left, height: bottom - top };
};

const SIGNS = [
  (F) => {
    F.size(720, 400); const g = F.g;
    g.fillStyle = "#8f1d22"; g.fillRect(0, 0, 720, 400);
    g.strokeStyle = "#e9c46a"; g.lineWidth = 4; g.strokeRect(6, 6, 708, 388);
    put(g, "阿嬤的滷肉飯", 360, 115, { size: 60, weight: 700, color: "#fff", align: "center" });
    put(g, "Grandma's Braised Pork Rice", 360, 185, { size: 34, color: "#fff", align: "center" });
    put(g, "營業時間 11:00 - 20:00", 360, 260, { size: 32, weight: 700, color: "#e9c46a", align: "center" });
    put(g, "週一公休 Closed on Mondays", 360, 325, { size: 28, color: "#fff", align: "center" });
  },
  (F) => {
    F.size(720, 400); const g = F.g;
    g.fillStyle = "#f4f1ea"; g.fillRect(0, 0, 720, 400);
    g.fillStyle = "#e35b1f"; g.fillRect(0, 0, 720, 14); g.fillRect(0, 386, 720, 14);
    put(g, "臺灣高鐵 THSR", 30, 62, { size: 34, weight: 700, color: "#c2410c" });
    put(g, "台北 Taipei 到 左營 Zuoying", 30, 150, { size: 48, weight: 700 });
    put(g, "2026/10/03 12:30 出發", 30, 215, { size: 30 });
    put(g, "標準車廂 6 車 12A 座位", 30, 270, { size: 30 });
    put(g, "NT$ 1,490", 30, 345, { size: 40, weight: 700 });
  },
  (F) => {
    F.size(720, 400); const g = F.g;
    g.fillStyle = "#fffbe6"; g.fillRect(0, 0, 720, 400);
    put(g, "停水公告 Notice", 360, 90, { size: 56, weight: 700, color: "#c0392b", align: "center" });
    put(g, "本週六上午九點至下午三點停水", 50, 170, { size: 32 });
    put(g, "Water outage: Sat 9 AM to 3 PM", 50, 225, { size: 32 });
    put(g, "請住戶提前儲水，謝謝合作！", 50, 280, { size: 32 });
    put(g, "管理委員會 敬啟", 440, 350, { size: 26, color: "#555" });
  },
];

const DISHES = [["牛肉麵", "Beef Noodle Soup"], ["蚵仔煎", "Oyster Omelette"], ["珍珠奶茶", "Bubble Milk Tea"], ["鳳梨酥", "Pineapple Cake"], ["滷肉飯", "Braised Pork Rice"], ["臭豆腐", "Stinky Tofu"], ["小籠包", "Soup Dumplings"], ["刈包", "Pork Belly Bun"]];
const CITIES = ["台北", "新北", "桃園", "台中", "台南", "高雄", "基隆", "花蓮"];
const CARD_BG = ["#fff8e7", "#eef6ff", "#f1f8ee", "#fdf0f3", "#f4f1ea", "#eef2f6"];
// Generated menu card with known ground truth, used to score accuracy
function makeCard(seed) {
  const r = rng(seed);
  const [zh, en] = pick(r, DISHES);
  const l1 = `${pick(r, CITIES)}${zh} NT$ ${30 + Math.floor(r() * 20) * 5}`;
  const l2 = `${en} x${1 + Math.floor(r() * 4)}`;
  const cv = document.createElement("canvas");
  cv.width = 560; cv.height = 170;
  const g = cv.getContext("2d");
  g.fillStyle = pick(r, CARD_BG); g.fillRect(0, 0, 560, 170);
  g.fillStyle = "#c2410c"; g.fillRect(0, 0, 8, 170);
  put(g, l1, 28, 72, { size: 40, weight: 700, color: "#1f2328" });
  put(g, l2, 28, 135, { size: 30, color: "#3a3f45" });
  return { cv, truth: `${l1}\n${l2}` };
}

function lineList(lines) {
  return lines.length
    ? lines.map((l, i) => `<div class="ts-ln" data-i="${i}" style="--k:${confColor(l.confidence)}"><i>${Math.round(l.confidence)}%</i><span>${esc(tidy(l.text))}</span></div>`).join("")
    : '<span class="ts-muted">沒有找到文字</span>';
}

Showcase.run({ scenes: [
  {
    id: "sign", title: "招牌辨識", api: "createWorker(['chi_tra', 'eng']) ➜ worker.recognize(img, {}, { blocks: true })",
    desc: "繁中與英文混排的招牌、車票、公告，辨識後把每一行的位置框回原圖，顏色代表信心度。也可以上傳自己的圖片。",
    hint: "切換範例或上傳圖片，滑過右側結果看對應位置",
    async mount(ctx) {
      ctx.html(`<div class="ts-wrap"><div class="ts-cols"><div class="ts-left">${FRAME}
        <div class="ts-legend"><span style="--k:#7bd389">信心 80% 以上</span><span style="--k:#f7df1e">60% 到 80%</span><span style="--k:#f72585">60% 以下</span></div></div>
        <div class="ts-side"><div class="ts-card"><h2>辨識結果<b class="meta">-</b></h2><div class="ts-lines"><span class="ts-muted">等待辨識…</span></div><div class="ts-prog"><i></i></div></div>
        <div class="ts-card ts-muted">語言：繁體中文＋英文（chi_tra + eng）<br>引擎：Tesseract 5 LSTM，WebAssembly 在 Web Worker 執行</div></div></div>
        <input type="file" accept="image/*" hidden class="ts-file"></div>`);
      const F = frameOf(ctx.$(".ts-frame"));
      const list = ctx.$(".ts-lines"), prog = ctx.$(".ts-prog i"), file = ctx.$(".ts-file");
      SIGNS[0](F);
      let lines = [], worker = null;
      const run = serial(ctx, async () => {
        if (!worker) return;
        F.clear(); F.scanning(true);
        list.innerHTML = '<span class="ts-muted">辨識中…</span>';
        prog.style.width = "0";
        const t0 = performance.now();
        const { data } = await worker.recognize(F.cv, {}, { text: true, blocks: true });
        if (!ctx.active) return;
        F.scanning(false);
        lines = linesOf(data);
        ctx.$(".meta").textContent = `${lines.length} 行・平均 ${Math.round(data.confidence)}%・${((performance.now() - t0) / 1000).toFixed(1)} 秒`;
        list.innerHTML = lineList(lines);
        F.boxes(lines, { pad: 4 });
        prog.style.width = "100%";
      });
      ctx.group(["招牌", "高鐵車票", "社區公告"], 0, (i) => { SIGNS[i](F); run(); });
      ctx.button("上傳圖片", () => file.click());
      ctx.button("重新辨識", () => run(), { primary: true });
      ctx.on(list, "mouseover", (e) => { const el = e.target.closest(".ts-ln"); if (el) { F.clear(); F.boxes(lines, { pad: 4, hi: +el.dataset.i }); } });
      ctx.on(list, "mouseleave", () => { F.clear(); F.boxes(lines, { pad: 4 }); });
      ctx.on(file, "change", async () => {
        const f = file.files[0];
        if (!f) return;
        const bmp = await createImageBitmap(f);
        const k = Math.min(1, 1400 / bmp.width, 1400 / bmp.height);
        F.size(Math.round(bmp.width * k), Math.round(bmp.height * k));
        F.g.drawImage(bmp, 0, 0, F.cv.width, F.cv.height);
        file.value = "";
        run();
      });

        ctx.$(".fields").innerHTML = rows.join("");

      ctx.$(".meta2").textContent = `正確 ${hits[0]}／${FIELDS.length} ➜ ${hits[1]}／${FIELDS.length}`;
      await worker.setParameters({ tessedit_char_whitelist: "", tessedit_pageseg_mode: "3" });
      run();
    },
  },
  {
    id: "degrade", title: "影像劣化", api: "recognize() 輸出 vs 原文：字元準確率 = 1 − 編輯距離 ÷ 原文長度",
    desc: "實際拍到的照片會歪、會糊、會有雜訊、解析度不夠。用滑桿把同一張捷運看板逐步弄壞，看 Tesseract 的準確率與信心度怎麼掉。準確率是拿辨識結果和原文逐字比對算出來的。",
    hint: "拖動滑桿或選預設情境，放開後自動重新辨識",
    async mount(ctx) {
      ctx.html(`<div class="ts-wrap"><div class="ts-cols"><div class="ts-left">${FRAME}
        <div class="ts-card"><h2>原文（比對基準）</h2><pre class="ts-pre truth ts-muted"></pre></div></div>
        <div class="ts-side"><div class="ts-card"><div class="ts-kpi"><div><b class="k1">-</b><span>字元準確率</span></div><div><b class="k2">-</b><span>平均信心</span></div><div><b class="k3">-</b><span>耗時</span></div></div></div>
        <div class="ts-card"><h2>辨識結果</h2><pre class="ts-pre out">辨識中…</pre></div>
        <div class="ts-card"><h2>紀錄</h2><div class="ts-hist-list"><span class="ts-muted">尚無紀錄</span></div></div></div></div></div>`);
      const F = frameOf(ctx.$(".ts-frame"));
      const src = document.createElement("canvas");
      src.width = 680; src.height = 260;
      const sg = src.getContext("2d");
      sg.fillStyle = "#0b3d2e"; sg.fillRect(0, 0, 680, 260);
      sg.fillStyle = "#3fa34d"; sg.fillRect(0, 0, 680, 12);
      const TRUTH = ["下一站 忠孝復興", "Next stop: Zhongxiao Fuxing", "轉乘文湖線 Transfer to Wenhu Line"];
      put(sg, TRUTH[0], 30, 80, { size: 44, weight: 700, color: "#fff" });
      put(sg, TRUTH[1], 30, 150, { size: 32, color: "#fff" });
      put(sg, TRUTH[2], 30, 215, { size: 28, color: "#ffd166" });
      ctx.$(".truth").textContent = TRUTH.join("\n");
      const p = { rot: 0, noise: 0, blur: 0, scale: 100 };
      const render = () => {
        const k = p.scale / 100, w = Math.round(680 * k), h = Math.round(260 * k);
        F.size(w, h);
        const g = F.g;
        g.fillStyle = "#0b3d2e"; g.fillRect(0, 0, w, h);
        g.save();
        g.filter = p.blur ? `blur(${p.blur * k}px)` : "none";
        g.translate(w / 2, h / 2); g.rotate((p.rot * Math.PI) / 180); g.scale(k, k);
        g.drawImage(src, -340, -130);
        g.restore();
        if (p.noise) {
          const img = g.getImageData(0, 0, w, h), d = img.data, r = rng(7), q = p.noise / 100;
          for (let i = 0; i < d.length; i += 4) {
            if (r() < q) { const v = r() < 0.5 ? 0 : 255; d[i] = d[i + 1] = d[i + 2] = v; }
          }
          g.putImageData(img, 0, 0);
        }
      };
      let worker = null;
      const hist = [];
      const run = serial(ctx, async () => {
        if (!worker) return;
        render(); F.clear(); F.scanning(true);
        const label = `旋轉 ${p.rot}°・雜訊 ${p.noise}%・模糊 ${p.blur}・解析度 ${p.scale}%`;
        const t0 = performance.now();
        const { data } = await worker.recognize(F.cv, {}, { text: true, blocks: true });
        const t = performance.now() - t0;
        if (!ctx.active) return;
        F.scanning(false);
        const acc = accuracy(TRUTH.join(""), data.text);
        F.boxes(linesOf(data), { pad: 3 });
        ctx.$(".k1").textContent = pct(acc); ctx.$(".k1").style.color = accColor(acc);
        ctx.$(".k2").textContent = `${Math.round(data.confidence)}%`; ctx.$(".k2").style.color = confColor(data.confidence);
        ctx.$(".k3").textContent = ms(t);
        ctx.$(".out").textContent = tidy(data.text) || "（沒有輸出）";
        hist.unshift([label, acc]);
        ctx.$(".ts-hist-list").innerHTML = hist.slice(0, 6).map(([a, b]) => `<div><span>${a}</span><code style="color:${accColor(b)}">${pct(b)}</code></div>`).join("");
      });
      let timer = 0;
      const later = () => { clearTimeout(timer); timer = ctx.timeout(run, 350); };
      const PRE = [["原圖", [0, 0, 0, 100]], ["手機斜拍", [9, 3, 1, 80]], ["傳真", [2, 18, 0, 60]], ["監視器", [-4, 8, 2.5, 45]]];
      const inputs = [];
      ctx.group(PRE.map((x) => x[0]), 0, (i) => {
        PRE[i][1].forEach((v, j) => { inputs[j].value = v; inputs[j].dispatchEvent(new Event("input")); });
      });
      inputs.push(ctx.slider("旋轉", { min: -20, max: 20, step: 1, value: 0, format: (v) => `${v}°` }, (v) => { p.rot = v; render(); later(); }));
      inputs.push(ctx.slider("雜訊", { min: 0, max: 40, step: 1, value: 0, format: (v) => `${v}%` }, (v) => { p.noise = v; render(); later(); }));
      inputs.push(ctx.slider("模糊", { min: 0, max: 4, step: 0.5, value: 0, format: (v) => `${v} px` }, (v) => { p.blur = v; render(); later(); }));
      inputs.push(ctx.slider("解析度", { min: 30, max: 100, step: 5, value: 100, format: (v) => `${v}%` }, (v) => { p.scale = v; render(); later(); }));
      ctx.controls.classList.add("bottom");
      render();
      worker = await makeWorker(ctx);
      run();
    },
  },
  {
    id: "scheduler", title: "多工排程", api: "createScheduler() ➜ addWorker(w) ✕ N ➜ addJob('recognize', img)",
    desc: "Scheduler 管理一個工作佇列，誰閒著就把下一張圖交給誰。12 張菜單卡片同時丟進佇列，甘特圖的每一格來自 logger 回報的 workerId 與 userJobId，是真實的分派紀錄，不是模擬。",
    hint: "切換 worker 數量後按「重新執行」，比較總耗時",
    async mount(ctx) {
      ctx.html(`<div class="ts-wrap">
        <div class="ts-card"><div class="ts-kpi" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div><b class="k1">-</b><span>總耗時</span></div><div><b class="k2">-</b><span>每秒張數</span></div><div><b class="k3">-</b><span>佇列中</span></div><div><b class="k4">-</b><span>相對 1 個 worker</span></div></div></div>
        <div class="ts-card"><h2>分派甘特圖<b class="meta">-</b></h2><canvas class="ts-gantt"></canvas></div>
        <div class="ts-card"><h2>辨識結果（12 張）<b class="meta2">-</b></h2><div class="ts-thumbs"></div></div></div>`);
      const cards = Array.from({ length: 12 }, (_, i) => makeCard(101 + i));
      const thumbs = ctx.$(".ts-thumbs");
      cards.forEach((c, i) => {
        const d = document.createElement("div");
        d.className = "ts-thumb";
        d.innerHTML = `<div><span>#${i + 1} 等待中</span><b></b></div>`;
        d.prepend(c.cv);
        thumbs.append(d);
      });
      const gc = ctx.$(".ts-gantt");
      let nw = Math.min(3, navigator.hardwareConcurrency || 2), sch = null, schN = 0, starts = {}, jobs = [], lanes = [], t0 = 0, tEnd = 0;
      const totals = {};
      ctx.onCleanup(() => sch && sch.terminate());
      const draw = () => {
        const W = gc.clientWidth || 600, dpr = Math.min(2, devicePixelRatio || 1);
        const laneH = 26, top = 6, left = 74, H = top + Math.max(1, schN) * laneH + 22;
        gc.width = W * dpr; gc.height = H * dpr; gc.style.height = `${H}px`;
        const g = gc.getContext("2d");
        g.scale(dpr, dpr);
        const span = Math.max(500, (tEnd || performance.now()) - t0), X = (t) => left + ((t - t0) / span) * (W - left - 8);
        g.font = `12px ${FONT}`; g.textBaseline = "middle";
        for (let i = 0; i < schN; i++) {
          g.fillStyle = "rgba(127,127,127,.12)"; g.fillRect(left, top + i * laneH + 2, W - left - 8, laneH - 4);
          g.fillStyle = "#9b998f"; g.textAlign = "left"; g.fillText(`worker ${i + 1}`, 4, top + i * laneH + laneH / 2);
        }
        Object.entries(starts).forEach(([id, s]) => {
          const lane = lanes.indexOf(s.w), j = jobs.indexOf(id), end = s.end || performance.now();
          if (lane < 0) return;
          const x = X(s.t), w = Math.max(2, X(end) - x);
          g.fillStyle = PAL[lane % PAL.length]; g.globalAlpha = s.end ? 0.9 : 0.5;
          g.fillRect(x, top + lane * laneH + 4, w - 1, laneH - 8);
          g.globalAlpha = 1;
          if (j >= 0 && w > 22) { g.fillStyle = "#111"; g.textAlign = "center"; g.fillText(`#${j + 1}`, x + w / 2, top + lane * laneH + laneH / 2); }
        });
        g.fillStyle = "#9b998f"; g.textAlign = "left"; g.fillText("0", left, H - 10);
        g.textAlign = "right"; g.fillText(`${(span / 1000).toFixed(2)} 秒`, W - 8, H - 10);
      };
      const onLog = (m) => {
        if (m.status !== "recognizing text" || !m.userJobId || starts[m.userJobId]) return;
        starts[m.userJobId] = { w: m.workerId, t: performance.now() };
        if (!lanes.includes(m.workerId)) lanes.push(m.workerId);
      };
      const run = serial(ctx, async () => {
        if (!sch || schN !== nw) {
          if (sch) { const old = sch; sch = null; await old.terminate(); }
          const s = ctx.status(`建立 ${nw} 個 worker…`);
          const next = Tesseract.createScheduler();
          for (let i = 0; i < nw; i++) { next.addWorker(await makeWorker(ctx, { onLog, quiet: true, cleanup: false })); s.progress((i + 1) / nw); }
          s.done();
          if (!ctx.active) { next.terminate(); return; }
          sch = next; schN = nw; lanes = [];
        }
        starts = {}; jobs = []; tEnd = 0;
        ctx.$$(".ts-thumb div").forEach((d, i) => { d.innerHTML = `<span>#${i + 1} 排隊中</span><b></b>`; });
        ctx.$(".meta").textContent = `${schN} 個 worker・12 張`;
        t0 = performance.now();
        let done = 0, accSum = 0;
        // ctx.raf repeats every frame until stopped
        const stopLoop = ctx.raf(() => { draw(); ctx.$(".k3").textContent = sch ? sch.getQueueLen() : 0; });
        await Promise.all(cards.map((c, i) => sch.addJob("recognize", c.cv).then((r) => {
          if (!ctx.active) return;
          jobs[i] = r.jobId;
          if (starts[r.jobId]) starts[r.jobId].end = performance.now();
          const acc = accuracy(c.truth, r.data.text);
          accSum += acc; done++;
          const box = ctx.$$(".ts-thumb div")[i];
          box.style.setProperty("--k", accColor(acc));
          box.innerHTML = `<span title="${esc(tidy(r.data.text))}">${esc(tidy(r.data.text).split("\n")[0] || "（空白）")}</span><b>${pct(acc)}</b>`;
        }))).finally(stopLoop);
        if (!ctx.active) return;
        tEnd = performance.now();
        const total = tEnd - t0;
        totals[schN] = total;
        draw();
        ctx.$(".k1").textContent = ms(total);
        ctx.$(".k2").textContent = (12 / (total / 1000)).toFixed(1);
        ctx.$(".k3").textContent = "0";
        ctx.$(".k4").textContent = totals[1] && schN !== 1 ? `${(totals[1] / total).toFixed(2)}×` : schN === 1 ? "基準" : "先跑 1 個";
        ctx.$(".meta2").textContent = `平均準確率 ${pct(accSum / Math.max(1, done))}`;
      });
      const opts = [1, 2, 3, 4];
      ctx.group(opts.map((n) => `${n} 個 worker`), opts.indexOf(nw), (i) => { nw = opts[i]; run(); });
      ctx.button("重新執行", () => run(), { primary: true });
      ctx.onResize(() => { if (t0) draw(); });
      await engine(ctx);
      run();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", api: "scheduler.addJob('recognize') ✕ N 張",
    desc: "一次丟進 1 到 64 張菜單卡片（繁中＋英文），量 Scheduler 搭配不同數量 worker 的吞吐量（張/秒）與字元準確率。建立 worker 與產生圖片不計時。",
    hint: "選 worker 數量後按「開始測試」",
    async mount(ctx) {
      const hc = navigator.hardwareConcurrency || 4;
      const OPTS = hc >= 8 ? [1, 2, 4, 8] : [1, 2, 4];
      ctx.html(`<div class="ts-stress"><div class="ts-card"><h2>各 worker 數的最佳吞吐量（張/秒）<b>${hc} 個邏輯核心</b></h2><div class="ts-bars">${OPTS.map((n, i) =>
        `<div class="ts-bar" style="--k:${PAL[i]}"><span>${n} 個 worker</span><span class="t"><i></i></span><b>未測</b></div>`).join("")}</div></div>
        <div class="ts-card" style="overflow:hidden"><h2>最近一批<b class="meta">-</b></h2><div class="ts-thumbs"></div></div></div>`);
      const best = OPTS.map(() => 0);
      const bars = ctx.$$(".ts-bar");
      const paintBars = () => {
        const max = Math.max(...best, 0.001);
        best.forEach((v, i) => { bars[i].querySelector("i").style.width = `${(v / max) * 100}%`; bars[i].querySelector("b").textContent = v ? `${v.toFixed(1)} 張/秒` : "未測"; });
      };
      let mi = Math.min(1, OPTS.length - 1), pool = null, gen = 0;
      ctx.onCleanup(() => pool && pool.s.terminate());
      const ensurePool = async (n) => {
        if (pool && pool.n === n) return pool.s;
        if (pool) { const old = pool.s; pool = null; await old.terminate(); }
        const s = Tesseract.createScheduler();
        for (let i = 0; i < n; i++) s.addWorker(await makeWorker(ctx, { quiet: true, cleanup: false }));
        if (!ctx.active) { s.terminate(); throw abort(); }
        pool = { n, s };
        return s;
      };
      const showBatch = (cards, accs) => {
        ctx.$(".ts-thumbs").innerHTML = "";
        cards.slice(0, 24).forEach((c, i) => {
          const d = document.createElement("div");
          d.className = "ts-thumb";
          d.innerHTML = `<div style="--k:${accColor(accs[i])}"><span>#${i + 1}</span><b>${pct(accs[i])}</b></div>`;
          d.prepend(c.cv);
          ctx.$(".ts-thumbs").append(d);
        });
      };
      const makeBench = () => {
        const lab = ctx.el.querySelector(".sc-lab");
        if (lab) lab.remove();
        const my = ++gen, n = OPTS[mi], idx = mi;
        ctx.bench({
          label: `${n} 個 worker・圖片張數`, unit: "張", sizes: [1, 4, 8, 16, 32, 64], target: 3000, budget: 15000,
          async prepare(count) {
            if (my !== gen) throw abort();
            await ensurePool(n);
            return Array.from({ length: count }, (_, i) => makeCard(9000 + count * 100 + i));
          },
          async run(count, cards) {
            if (my !== gen || !pool) throw abort();
            const t0 = performance.now();
            const res = await Promise.all(cards.map((c) => pool.s.addJob("recognize", c.cv)));
            const rate = count / ((performance.now() - t0) / 1000);
            if (!ctx.active || my !== gen) throw abort();
            const accs = res.map((r, i) => accuracy(cards[i].truth, r.data.text));
            const avg = accs.reduce((a, b) => a + b, 0) / accs.length;
            if (rate > best[idx]) best[idx] = rate;
            paintBars();
            showBatch(cards, accs);
            ctx.$(".meta").textContent = `${count} 張・${n} 個 worker・平均準確 ${pct(avg)}`;
            return `準確 ${pct(avg)}`;
          },
          note: "每張卡片 560×170 px，兩行繁中＋英文，字庫 chi_tra + eng。worker 數超過核心數或記憶體不足時，吞吐量會停滯甚至下降。準確率以原文逐字比對計算。",
        });
      };
      await engine(ctx);
      ctx.group(OPTS.map((n) => `${n} 個 worker`), mi, (i) => { mi = i; makeBench(); });
      ctx.controls.classList.add("bottom");
      makeBench();
    },
  },
] });
</script>
</body>
