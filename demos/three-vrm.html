<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>three-vrm 示範：會看你的虛擬角色</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"click","size":"約 11 MB","note":"範例角色來自 pixiv/three-vrm 官方 repo，採 VRM Public License 1.0（允許再散布）"}</script>
<style>
  body {
    background:
      radial-gradient(circle at 50% 34%, rgba(157, 140, 255, 0.32), transparent 42%),
      radial-gradient(circle at 50% 115%, rgba(76, 201, 240, 0.22), transparent 60%),
      var(--bg);
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #c:active { cursor: grabbing; }
  .controls { flex-direction: column; align-items: flex-end; }
  .controls[hidden] { display: none; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .row .label { font-size: 12px; align-self: center; padding: 6px 8px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); }
  .btn { padding: 7px 10px; font-size: 12px; }
  .credit { position: fixed; right: 12px; bottom: 14px; z-index: 50; font-size: 11px; color: var(--muted); pointer-events: none; }
  @media (max-width: 640px) { .credit { right: auto; left: 12px; bottom: 48px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="controls" hidden id="ctl">
  <div class="row" id="faces"><span class="label">表情</span></div>
  <div class="row" id="acts"><span class="label">動作</span></div>
</div>
<div class="hint">移動滑鼠讓角色看你・左右拖曳轉身看頭髮擺動</div>
<div class="credit">範例角色 © pixiv Inc.・VRM Public License 1.0</div>

<script src="_shared/gate.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
} }
</script>
<script type="module">
const MODEL_URL = "https://cdn.jsdelivr.net/gh/pixiv/three-vrm@3.5.5/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm";

await demoGate({
  icon: "🧑‍🎤",
  title: "VRM 虛擬角色",
  desc: "載入 pixiv 官方 VRM 1.0 範例角色，示範表情切換、視線追蹤與頭髮彈簧骨骼。",
  tags: ["約 11 MB", "WebGL"],
  button: "載入角色",
});
const status = demoStatus("下載 VRM 模型中…");

const THREE = await import("three");
const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
const { VRMLoaderPlugin, VRMUtils } = await import("@pixiv/three-vrm");

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 20);
const light = new THREE.DirectionalLight(0xffffff, 2.3);
light.position.set(1, 1.6, 2);
scene.add(light);
const rim = new THREE.DirectionalLight(0x9d8cff, 1.6);
rim.position.set(-1.5, 1.5, -1.5);
scene.add(rim);

// Load the VRM through GLTFLoader with the three-vrm plugin
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));
let gltf;
try {
  gltf = await loader.loadAsync(MODEL_URL, (e) => {
    const total = Math.max(e.total || 0, 10.7e6); // e.total can be the compressed size
    status.progress(e.loaded / total);
    status.text(`下載 VRM 模型中… ${(e.loaded / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB`);
  });
} catch (err) {
  status.error("模型下載失敗，請檢查網路後重新整理");
  throw err;
}
status.done();

const vrm = gltf.userData.vrm;
VRMUtils.removeUnnecessaryVertices(gltf.scene);
VRMUtils.combineSkeletons(gltf.scene);
vrm.scene.traverse((o) => { o.frustumCulled = false; });
VRMUtils.rotateVRM0(vrm); // no-op for VRM 1.0, keeps VRM 0.x models facing the camera
scene.add(vrm.scene);

const dummy = new THREE.Object3D();
const bone = (name) => vrm.humanoid.getNormalizedBoneNode(name) || dummy;
const B = {
  hips: bone("hips"), spine: bone("spine"), chest: bone("chest"), neck: bone("neck"), head: bone("head"),
  lUpper: bone("leftUpperArm"), rUpper: bone("rightUpperArm"), lLower: bone("leftLowerArm"), rLower: bone("rightLowerArm"),
};
vrm.update(0);
const headY = B.head.getWorldPosition(new THREE.Vector3()).y;

// Eyes follow this target (VRMLookAt), head turns a bit as well
const lookTarget = new THREE.Object3D();
scene.add(lookTarget);
vrm.lookAt.target = lookTarget;

// ---- Expressions ----
const FACES = [["neutral", "平常"], ["happy", "開心"], ["angry", "生氣"], ["surprised", "驚訝"], ["sad", "難過"], ["relaxed", "放鬆"]];
const VOWELS = ["aa", "ih", "ou", "ee", "oh"];
const weights = {}, targets = {};
for (const [k] of FACES) { weights[k] = 0; targets[k] = 0; }
for (const v of VOWELS) { weights[v] = 0; targets[v] = 0; }
let face = "neutral", talking = false;

function setFace(k) {
  face = k;
  for (const [n] of FACES) targets[n] = n === k && k !== "neutral" ? 1 : 0;
  document.querySelectorAll("#faces .btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
}

function addButton(rowId, k, label, onClick, pressed = false) {
  const b = document.createElement("button");
  b.className = "btn";
  b.dataset.k = k;
  b.textContent = label;
  b.setAttribute("aria-pressed", String(pressed));
  b.addEventListener("click", () => onClick(b));
  document.getElementById(rowId).append(b);
  return b;
}
for (const [k, label] of FACES) addButton("faces", k, label, () => setFace(k), k === "neutral");
addButton("acts", "talk", "說話", (b) => {
  talking = !talking;
  b.setAttribute("aria-pressed", String(talking));
  if (!talking) for (const v of VOWELS) targets[v] = 0;
});
addButton("acts", "spin", "轉一圈", () => { rotY -= Math.PI * 2; });
addButton("acts", "wink", "眨眼", () => { blinkAt = 0; });
document.getElementById("ctl").hidden = false;

// ---- Pointer: look-at target and drag-to-turn with a spring back to the front ----
const ndc = new THREE.Vector2(), look = new THREE.Vector2();
let dragging = false, lastX = 0, rotY = 0, rotVel = 0;
addEventListener("pointermove", (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  if (dragging) { rotY += (e.clientX - lastX) * 0.012; lastX = e.clientX; rotVel = 0; }
});
canvas.addEventListener("pointerdown", (e) => { dragging = true; lastX = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointerup", () => { dragging = false; });

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const narrow = w < h;
  const dist = narrow ? 2.7 : 1.9;
  camera.position.set(0, headY - 0.08, dist);
  camera.lookAt(0, headY - (narrow ? 0.3 : 0.22), 0); // narrow: keep the face below the button rows
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

// ---- Animation loop ----
const timer = new THREE.Timer();
let blinkAt = 2, talkAt = 0;
renderer.setAnimationLoop((now) => {
  timer.update(now);
  const dt = Math.min(timer.getDelta(), 0.05), t = timer.getElapsed();

  // Body turn: spring toward facing the camera, overshoot makes hair and skirt swing
  if (!dragging) {
    rotVel += -rotY * 30 * dt;
    rotVel *= Math.exp(-4.5 * dt);
    rotY += rotVel * dt;
  }
  vrm.scene.rotation.y = rotY;

  // Idle pose: arms down, breathing, slight sway
  B.lUpper.rotation.z = -1.2 + Math.sin(t * 1.3) * 0.03;
  B.rUpper.rotation.z = 1.2 - Math.sin(t * 1.3) * 0.03;
  B.lLower.rotation.z = -0.12;
  B.rLower.rotation.z = 0.12;
  B.chest.rotation.x = Math.sin(t * 1.6) * 0.025;
  B.spine.rotation.z = Math.sin(t * 0.7) * 0.025;
  B.hips.rotation.z = Math.sin(t * 0.7) * -0.015;

  // Smoothed look direction; head follows partially, eyes do the rest
  look.lerp(ndc, 1 - Math.exp(-6 * dt));
  B.neck.rotation.y = look.x * 0.35;
  B.neck.rotation.x = -look.y * 0.22;
  B.head.rotation.y = look.x * 0.2;
  B.head.rotation.z = -look.x * 0.06;
  lookTarget.position.set(look.x * 1.4, headY + look.y * 0.9, 1.6);

  // Auto blink at random intervals (the button triggers one immediately)
  blinkAt -= dt;
  let blink = 0;
  if (blinkAt < 0) {
    const p = -blinkAt / 0.16;
    blink = p < 1 ? Math.sin(p * Math.PI) : 0;
    if (p >= 1) blinkAt = 2 + Math.random() * 3;
  }
  vrm.expressionManager.setValue("blink", blink);

  // Lip sync: random vowels while "talking"
  if (talking) {
    talkAt -= dt;
    if (talkAt < 0) {
      talkAt = 0.08 + Math.random() * 0.1;
      const pick = Math.random() < 0.2 ? null : VOWELS[(Math.random() * VOWELS.length) | 0];
      for (const v of VOWELS) targets[v] = v === pick ? 0.5 + Math.random() * 0.5 : 0;
    }
  }
  const k = 1 - Math.exp(-12 * dt);
  for (const n in weights) {
    weights[n] += (targets[n] - weights[n]) * k;
    if (n !== "neutral") vrm.expressionManager.setValue(n, weights[n]);
  }

  vrm.update(dt); // expressions, look-at, spring bones, constraints
  renderer.render(scene, camera);
});
</script>
</body>
</html>
