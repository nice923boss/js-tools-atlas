<script type="module">
// three-vrm showcase: one VRM 1.0 sample model, eight scenes covering expressions, lookAt,
// humanoid pose, spring bones, MToon, node constraints and a crowd stress ramp.
const { h } = Showcase;
const MODEL_URL = "https://cdn.jsdelivr.net/gh/pixiv/three-vrm@3.5.5/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm";
const VRMA_URL = "https://cdn.jsdelivr.net/gh/pixiv/three-vrm@3.5.5/packages/three-vrm-animation/examples/models/test.vrma";
const MODEL_BYTES = 10776032;
const DEG = Math.PI / 180;
const CREDIT = "範例角色 © pixiv Inc.・VRM Public License 1.0";
const FACES = [["neutral", "平常"], ["happy", "開心"], ["angry", "生氣"], ["surprised", "驚訝"], ["sad", "難過"], ["relaxed", "放鬆"]];
const VOWELS = ["aa", "ih", "ou", "ee", "oh"];
const BONES = ["hips", "spine", "chest", "upperChest", "neck", "head", "leftShoulder", "rightShoulder", "leftUpperArm", "rightUpperArm",
  "leftLowerArm", "rightLowerArm", "leftHand", "rightHand", "leftUpperLeg", "rightUpperLeg", "leftLowerLeg", "rightLowerLeg"];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (dt, k) => 1 - Math.exp(-k * dt);
const abortError = () => new DOMException("aborted", "AbortError");
const count = (x) => (x ? x.size ?? x.length ?? 0 : 0);

// ---------- shared loading: one download, then a fresh parse per scene ----------
let core = null, corePromise = null, loaded = 0, vrmaPromise = null;

async function fetchModel() {
  loaded = 0;
  const chunks = [];
  try {
    const res = await fetch(MODEL_URL);
    if (!res.ok) throw new Error(`模型下載失敗（HTTP ${res.status}）`);
    const reader = res.body.getReader();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      loaded += value.length;
    }
  } catch (e) {
    throw /HTTP/.test(e.message) ? e : new Error("模型下載中斷，請檢查網路後重新整理");
  }
  const buf = new Uint8Array(loaded);
  let o = 0;
  for (const c of chunks) { buf.set(c, o); o += c.length; }
  return buf.buffer;
}

async function ensureCore(ctx) {
  if (core) return core;
  if (!corePromise) {
    await ctx.gate({
      icon: "🧑‍🎤", title: "VRM 虛擬角色", button: "載入角色", tags: ["約 11 MB", "WebGL", "VRM 1.0"],
      desc: "載入 pixiv 官方 VRM 1.0 範例角色（約 11 MB），八個場景共用同一份檔案，只需下載一次。",
    });
    corePromise ??= Promise.all([
      import("three"), import("three/addons/loaders/GLTFLoader.js"), import("@pixiv/three-vrm"), fetchModel(),
    ]).then(([THREE, { GLTFLoader }, V, buffer]) => (core = { THREE, GLTFLoader, V, buffer }))
      .catch((e) => {
        corePromise = null;
        throw /[一-鿿]/.test(e.message) ? e : new Error(`函式庫載入失敗：${e.message}`);
      });
  }
  const st = ctx.status("下載 VRM 模型中…");
  const paint = () => {
    st.progress(loaded / MODEL_BYTES);
    st.text(`下載 VRM 模型中… ${(loaded / 1e6).toFixed(1)} / ${(MODEL_BYTES / 1e6).toFixed(1)} MB`);
  };
  paint();
  const id = ctx.interval(paint, 120);
  try {
    return await new Promise((resolve, reject) => {
      corePromise.then(resolve, reject);
      ctx.signal.addEventListener("abort", () => reject(abortError()), { once: true });
    });
  } finally {
    clearInterval(id);
    st.done();
  }
}

// Parse the cached .vrm buffer into an independent VRM instance (own skeleton, expressions, springs).
async function newVRM(ctx, C, { cleanup = true } = {}) {
  const loader = new C.GLTFLoader();
  loader.register((p) => new C.V.VRMLoaderPlugin(p));
  const gltf = await loader.parseAsync(C.buffer, "");
  const vrm = gltf.userData.vrm;
  const U = C.V.VRMUtils;
  U.removeUnnecessaryVertices(gltf.scene);
  U.combineSkeletons(gltf.scene);
  U.combineMorphs(vrm);
  U.rotateVRM0(vrm);
  vrm.scene.traverse((o) => { o.frustumCulled = false; });
  if (!ctx.active) { U.deepDispose(vrm.scene); throw abortError(); }
  if (cleanup) ctx.onCleanup(() => U.deepDispose(vrm.scene));
  return vrm;
}

// Renderer + camera whose view offset keeps the subject centred in the area left free by controls and panels.
function makeStage(ctx, C, { pad, onFit, watch = [] } = {}) {
  const { THREE } = C;
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.domElement.className = "gl";
  ctx.el.prepend(renderer.domElement);
  ctx.onCleanup(() => { renderer.dispose(); renderer.forceContextLoss(); });
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.05, 60);
  const key = new THREE.DirectionalLight(0xffffff, 2.3);
  key.position.set(1, 1.6, 2);
  const rim = new THREE.DirectionalLight(0x9d8cff, 1.6);
  rim.position.set(-1.5, 1.5, -1.5);
  scene.add(key, rim);
  const ctl = ctx.controls;
  const S = { THREE, renderer, scene, camera, key, rim, w: 1, h: 1, area: { l: 0, t: 0, r: 1, b: 1 } };
  S.fit = () => {
    const { width: w, height: hh } = ctx.size();
    if (!w || !hh) return;
    const ch = ctl.offsetHeight ? ctl.offsetHeight + 10 : 0;
    const bottom = ctl.classList.contains("bottom");
    const p = pad ? pad(w, hh) : {};
    const l = p.l || 0, top = bottom ? 0 : ch, bot = (bottom ? ch : 0) + (p.b || 0);
    S.w = w; S.h = hh;
    S.area = { l, t: top, r: w, b: hh - bot };
    renderer.setSize(w, hh);
    camera.aspect = w / hh;
    camera.setViewOffset(w, hh, -l / 2, (bot - top) / 2, w, hh);
    if (onFit) onFit(S);
    camera.updateProjectionMatrix();
  };
  // Place the camera along `dir` so a box of halfW x halfH around `center` fits the free area.
  S.frame = (center, halfW, halfH, dir) => {
    const { l, t, r, b } = S.area;
    const fw = Math.max(0.2, (r - l) / S.w), fh = Math.max(0.2, (b - t) / S.h);
    const tan = Math.tan((camera.fov * DEG) / 2);
    const d = Math.max(halfH / (fh * tan), halfW / (fw * tan * camera.aspect));
    camera.position.copy(dir).normalize().multiplyScalar(d).add(center);
    camera.lookAt(center);
  };
  S.loop = (fn) => ctx.raf((t, ms) => { if (fn(t / 1000, Math.min(ms / 1000, 0.05)) !== false) renderer.render(scene, camera); });
  ctx.onResize(S.fit);
  const ro = new ResizeObserver(() => S.fit());
  for (const e of [ctl, ...watch]) ro.observe(e);
  ctx.onCleanup(() => ro.disconnect());
  return S;
}

function rig(vrm, THREE) {
  const B = {};
  for (const n of BONES) B[n] = vrm.humanoid.getNormalizedBoneNode(n) || new THREE.Object3D();
  return B;
}

// Relaxed idle: arms down, breathing and a slow sway (normalized bones, so the same numbers work on any VRM).
function idle(B, t, ph = 0) {
  const s = Math.sin(t * 1.3 + ph) * 0.03;
  B.leftUpperArm.rotation.z = -1.2 + s;
  B.rightUpperArm.rotation.z = 1.2 - s;
  B.leftLowerArm.rotation.z = -0.12;
  B.rightLowerArm.rotation.z = 0.12;
  B.chest.rotation.x = Math.sin(t * 1.6 + ph) * 0.025;
  B.spine.rotation.z = Math.sin(t * 0.7 + ph) * 0.025;
  B.hips.rotation.z = Math.sin(t * 0.7 + ph) * -0.015;
}

function blinker() {
  let at = 1.5 + Math.random() * 2;
  return {
    now() { at = 0; },
    step(dt) {
      at -= dt;
      if (at >= 0) return 0;
      const p = -at / 0.16;
      if (p < 1) return Math.sin(p * Math.PI);
      at = 2 + Math.random() * 3;
      return 0;
    },
  };
}

// Random vowel shapes while talking, smoothed so the mouth does not snap.
function talker() {
  const w = {}, tg = {};
  for (const v of VOWELS) { w[v] = 0; tg[v] = 0; }
  let at = 0, vowel = null;
  return {
    w,
    get vowel() { return vowel; },
    step(dt, on) {
      at -= dt;
      if (!on) vowel = null;
      else if (at < 0) {
        at = 0.08 + Math.random() * 0.1;
        vowel = Math.random() < 0.2 ? null : VOWELS[(Math.random() * VOWELS.length) | 0];
      }
      for (const v of VOWELS) tg[v] = v === vowel ? (tg[v] || 0.5 + Math.random() * 0.5) : 0;
      const k = ease(dt, 12);
      for (const v of VOWELS) w[v] += (tg[v] - w[v]) * k;
    },
    apply(em) { for (const v of VOWELS) em.setValue(v, w[v]); },
  };
}

// Underdamped spring back to `goal`; the overshoot is what makes hair and skirt swing.
function turnSpring() {
  return { y: 0, v: 0, step(dt, goal) { this.v += (goal - this.y) * 30 * dt; this.v *= Math.exp(-4.5 * dt); this.y += this.v * dt; } };
}

// Horizontal drag on the canvas; consumers read and reset `dx`.
function spinDrag(ctx, cv) {
  const st = { dragging: false, dx: 0 };
  let lastX = 0;
  cv.classList.add("grab");
  ctx.on(cv, "pointerdown", (e) => { st.dragging = true; lastX = e.clientX; cv.setPointerCapture(e.pointerId); });
  ctx.on(cv, "pointermove", (e) => { if (st.dragging) { st.dx += e.clientX - lastX; lastX = e.clientX; } });
  const end = () => { st.dragging = false; };
  ctx.on(cv, "pointerup", end);
  ctx.on(cv, "pointercancel", end);
  return st;
}

function pointerNDC(ctx, e, out) {
  const r = ctx.el.getBoundingClientRect();
  return out.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}

function credit(ctx, top = false) {
  ctx.el.append(h("div", { class: `v-credit${top ? " top" : ""}`, text: CREDIT }));
}

// The VRMA clip is tiny; cache the parsed animation for every later visit of the pose scene.
function loadVRMA(C) {
  vrmaPromise ??= import("@pixiv/three-vrm-animation").then(async (A) => {
    const loader = new C.GLTFLoader();
    loader.register((p) => new A.VRMAnimationLoaderPlugin(p));
    const gltf = await loader.loadAsync(VRMA_URL);
    return { A, anim: gltf.userData.vrmAnimations[0] };
  }).catch((e) => { vrmaPromise = null; throw e; });
  return vrmaPromise;
}

Showcase.run({ scenes: [
  {
    id: "look", title: "看著你",
    api: "GLTFLoader + VRMLoaderPlugin・vrm.lookAt.target・expressionManager.setValue()・vrm.update(dt)",
    desc: "VRMLoaderPlugin 把 .vrm 解析成 VRM 物件：眼睛用 lookAt 追著游標，頭頸再跟著轉一點；表情是可疊加的權重，說話時五個母音嘴型隨機開合；轉身時頭髮與裙子由彈簧骨骼自動擺動，全部由一次 vrm.update(dt) 推進。",
    hint: "移動滑鼠讓角色看你・左右拖曳轉身・三秒沒動作會自己東張西望",
    async mount(ctx) {
      const C = await ensureCore(ctx);
      const { THREE } = C;
      const vrm = await newVRM(ctx, C);
      const em = vrm.expressionManager;
      const B = rig(vrm, THREE);
      vrm.update(0);
      const headY = B.head.getWorldPosition(new THREE.Vector3()).y;
      const center = new THREE.Vector3(0, headY - 0.2, 0), dir = new THREE.Vector3(0, 0.07, 1);
      const S = makeStage(ctx, C, { onFit: (s) => s.frame(center, 0.36, s.w < s.h ? 0.52 : 0.42, dir) });
      S.scene.add(vrm.scene);
      const target = new THREE.Object3D();
      S.scene.add(target);
      vrm.lookAt.target = target;

      const w = Object.fromEntries(FACES.map(([k]) => [k, 0]));
      const blink = blinker(), talk = talker(), spin = turnSpring();
      let face = "neutral", talking = false, clock = 0, lastMove = -10;
      ctx.group(FACES.map((f) => f[1]), 0, (i) => { face = FACES[i][0]; });
      ctx.toggle("說話", false, (v) => { talking = v; });
      ctx.button("眨眼", () => blink.now());
      ctx.button("轉一圈", () => { spin.y -= Math.PI * 2; });
      credit(ctx);

      const ndc = new THREE.Vector2(), look = new THREE.Vector2();
      const drag = spinDrag(ctx, S.renderer.domElement);
      ctx.on(ctx.el, "pointermove", (e) => { pointerNDC(ctx, e, ndc); lastMove = clock; });
      S.fit();

      S.loop((t, dt) => {
        clock += dt;
        spin.y += drag.dx * 0.012;
        drag.dx = 0;
        if (drag.dragging) spin.v = 0; else spin.step(dt, 0);
        vrm.scene.rotation.y = spin.y;
        idle(B, clock);
        if (clock - lastMove > 3) ndc.set(Math.sin(clock * 0.6) * 0.65, Math.sin(clock * 1.1) * 0.35 + 0.05);
        look.lerp(ndc, ease(dt, 6));
        B.neck.rotation.y = look.x * 0.35;
        B.neck.rotation.x = -look.y * 0.22;
        B.head.rotation.y = look.x * 0.2;
        B.head.rotation.z = -look.x * 0.06;
        target.position.set(look.x * 1.4, headY + look.y * 0.9, 1.6);
        em.setValue("blink", blink.step(dt));
        talk.step(dt, talking);
        talk.apply(em);
        const k = ease(dt, 12);
        for (const [n] of FACES) {
          w[n] += ((n === face && n !== "neutral" ? 1 : 0) - w[n]) * k;
          if (n !== "neutral") em.setValue(n, w[n]);
        }
        vrm.update(dt);
      });
    },
  },

  {
    id: "expr", title: "表情混合",
    api: "expressionManager.setValue()・VRMExpression.overrideBlink / overrideMouth・outputWeight",
    desc: "VRM 1.0 的表情是可以同時打開的權重。情緒表情可宣告 override：例如 happy 對眨眼與嘴型都是 blend，開心程度越高，眨眼與母音嘴型就被壓得越低，避免五官互相打架。面板同時列出 setValue 設定的值與實際套用的值。",
    hint: "切換情緒、拉強度，看眨眼與嘴型的套用值如何被壓低",
    async mount(ctx) {
      const C = await ensureCore(ctx);
      const { THREE } = C;
      const vrm = await newVRM(ctx, C);
      const em = vrm.expressionManager;
      const B = rig(vrm, THREE);
      vrm.update(0);
      const headY = B.head.getWorldPosition(new THREE.Vector3()).y;
      const EMO = [["happy", "開心"], ["angry", "生氣"], ["sad", "難過"], ["relaxed", "放鬆"], ["surprised", "驚訝"]];

      const rows = {};
      const mkRow = (key, label) => {
        const r = { set: h("i", { class: "set" }), out: h("i", { class: "out" }), val: h("span"), name: h("b", { text: label }) };
        rows[key] = r;
        return h("div", { class: "v-row" }, r.name, h("div", { class: "v-bar" }, r.set, r.out), r.val);
      };
      const rule = h("div", { class: "v-rule" });
      const panel = h("div", { class: "v-panel" },
        h("h4", { text: "表情權重" }),
        h("div", { class: "muted", text: "灰：setValue 設定值　紫：實際套用值" }),
        h("div", { class: "v-rows two" }, ...EMO.map(([k, l]) => mkRow(k, l)), mkRow("blink", "眨眼"), mkRow("mouth", "嘴型")),
        rule);
      ctx.el.append(panel);

      const faceC = new THREE.Vector3(0, headY + 0.075, 0.02), dir = new THREE.Vector3(0, 0.03, 1);
      const S = makeStage(ctx, C, {
        pad: (w) => (w >= 600 ? { l: 280 } : { b: panel.offsetHeight + 10 }),
        watch: [panel],
        onFit: (s) => s.frame(faceC, 0.15, 0.17, dir),
      });
      S.scene.add(vrm.scene);
      vrm.lookAt.target = S.camera;

      let face = 1, amount = 0.7, closed = false, lips = true, clock = 0, ruleKey = "";
      ctx.group(["平常", ...EMO.map((e) => e[1])], face, (i) => { face = i; });
      ctx.slider("強度", { min: 0, max: 1, step: 0.05, value: amount }, (v) => { amount = v; });
      ctx.toggle("閉眼", closed, (v) => { closed = v; });
      ctx.toggle("對嘴", lips, (v) => { lips = v; });
      credit(ctx);
      S.fit();

      const cur = Object.fromEntries(EMO.map(([k]) => [k, 0]));
      const blink = blinker(), talk = talker();
      // Same rule as VRMExpressionManager: blend overrides by weight, block overrides fully once weight > 0.
      const amt = (e, kind) => {
        const m = e[`override${kind}`], ow = e.outputWeight;
        return m === "block" ? (ow > 0 ? 1 : 0) : m === "blend" ? ow : 0;
      };
      const bar = (r, set, out) => {

        vrm.update(dt);
        const r = S.renderer, sx = Math.round(S.w * splitR);
        line.style.left = `${splitR * 100}%`;
        r.setScissorTest(true);
        r.setScissor(0, 0, sx, S.h);
        r.render(S.scene, S.camera);
        for (const p of pairs) p.o.material = p.std;
        r.setScissor(sx, 0, S.w - sx, S.h);
        r.render(S.scene, S.camera);
        for (const p of pairs) p.o.material = p.mt;
        r.setScissorTest(false);
        return false;
      });
    },
  },

  {
    id: "twist", title: "扭轉約束",
    api: "nodeConstraintManager・VRMRollConstraint・VRMAimConstraint・constraint.weight",
    desc: "VRMC_node_constraint 讓輔助骨自動跟隨其他骨頭：Roll 約束把手腕或上臂的扭轉按權重分給前臂、上臂的扭轉骨，皮膚就不會在關節處扭成糖果紙；Aim 約束讓骨頭持續指向目標。「單側對照」只關掉角色左手（畫面右側）的約束，兩邊同時扭轉方便比較。",
    hint: "看兩隻手腕的皮膚・切換扭轉部位與約束開關",
    async mount(ctx) {
      const C = await ensureCore(ctx);
      const { THREE, V } = C;
      const vrm = await newVRM(ctx, C);
      const B = rig(vrm, THREE);
      const cons = [...(vrm.nodeConstraintManager?.constraints ?? [])];
      if (!cons.length) throw new Error("這個模型沒有節點約束");
      vrm.update(0);
      const rest = new Map(cons.map((c) => [c, c.destination.quaternion.clone()]));
      const info = cons.map((c) => ({ c, w: c.weight, side: /_L_/.test(c.destination.name) ? "L" : /_R_/.test(c.destination.name) ? "R" : "" }));
      const nRoll = cons.filter((c) => c instanceof V.VRMRollConstraint).length;
      const nAim = cons.filter((c) => c instanceof V.VRMAimConstraint).length;
      const find = (side, part) => cons.find((c) => /Roll/.test(c.destination.name) && c.destination.name.includes(`_${side}_${part}`));
      const shoulderY = B.leftUpperArm.getWorldPosition(new THREE.Vector3()).y;

      const panel = h("div", { class: "v-panel" }, h("h4", { text: "nodeConstraintManager" }),
        h("div", { text: `Roll 約束 ${nRoll} 個・Aim 約束 ${nAim} 個` }),
        h("div", { class: "muted", text: "Roll：來源骨的扭轉按 weight 分給扭轉骨。Aim：肩、袖子、大腿的輔助骨持續指向前臂或小腿，關閉時袖子停在 T 姿勢。" }));
      ctx.el.append(panel);
      let narrow = false;
      const S = makeStage(ctx, C, {
        pad: (w) => (w >= 640 ? { l: panel.offsetWidth + 20 } : { b: panel.offsetHeight + 10 }),
        watch: [panel],
        onFit: (s) => {
          narrow = s.w < 560;
          const c = new THREE.Vector3(0, shoulderY - (narrow ? 0.22 : 0.12), 0.1);
          s.frame(c, narrow ? 0.5 : 0.62, narrow ? 0.42 : 0.4, new THREE.Vector3(0, 0.08, 1));
        },
      });
      S.scene.add(vrm.scene);
      vrm.lookAt.target = S.camera;

      let part = 0, mode = 0, clock = 0;
      const setMode = (m) => { mode = m; for (const x of info) x.c.weight = m === 1 || (m === 0 && x.side !== "L") ? x.w : 0; };
      ctx.group(["手腕扭轉", "上臂扭轉"], part, (i) => { part = i; });
      ctx.group(["單側對照", "全部開啟", "全部關閉"], 0, setMode);
      setMode(0);
      credit(ctx);
      const labels = ["R", "L"].map((side) => {
        const el = h("div", { class: "v-label" });
        ctx.el.append(el);
        return { side, el, raw: vrm.humanoid.getRawBoneNode(side === "L" ? "leftLowerArm" : "rightLowerArm"), text: "" };
      });
      S.fit();

      const X = new THREE.Vector3(1, 0, 0), qRoll = new THREE.Quaternion(), eul = new THREE.Euler(), p = new THREE.Vector3(), qd = new THREE.Quaternion();
      // Signed angle of a destination relative to its rest rotation, in degrees.
      const twistDeg = (c) => {
        qd.copy(rest.get(c)).invert().multiply(c.destination.quaternion);
        const ax = [qd.x, qd.y, qd.z].reduce((a, v) => (Math.abs(v) > Math.abs(a) ? v : a), 0);
        return (2 * Math.atan2(Math.sign(ax || 1) * Math.hypot(qd.x, qd.y, qd.z), Math.abs(qd.w)) * Math.sign(qd.w || 1)) / DEG;
      };
      S.loop((t, dt) => {
        clock += dt;
        const a = Math.sin(clock * 1.6) * 100 * DEG, down = (narrow ? 55 : 35) * DEG, fwd = 20 * DEG;
        qRoll.setFromAxisAngle(X, a);
        B.leftUpperArm.quaternion.setFromEuler(eul.set(0, -fwd, -down));
        B.rightUpperArm.quaternion.setFromEuler(eul.set(0, fwd, down));
        B.leftLowerArm.quaternion.setFromEuler(eul.set(0, -25 * DEG, 0));
        B.rightLowerArm.quaternion.setFromEuler(eul.set(0, 25 * DEG, 0));
        B.leftHand.quaternion.identity();
        B.rightHand.quaternion.identity();
        if (part === 0) { B.leftHand.quaternion.copy(qRoll); B.rightHand.quaternion.copy(qRoll); }
        else { B.leftUpperArm.quaternion.multiply(qRoll); B.rightUpperArm.quaternion.multiply(qRoll); }
        B.chest.rotation.x = Math.sin(clock * 1.6) * 0.02;
        vrm.update(dt);
        S.scene.updateMatrixWorld();
        const xs = labels.map((L) => {
          const on = mode === 1 || (mode === 0 && L.side === "R");
          const c = find(L.side, part === 0 ? "LowerArm" : "UpperArm");
          const tw = c ? twistDeg(c) : 0;
          const txt = `約束 ${on ? "開" : "關"}<br>${part === 0 ? "手腕" : "上臂"} ${(a / DEG).toFixed(0)}°・扭轉骨 ${tw.toFixed(0)}°`;
          if (txt !== L.text) { L.text = txt; L.el.innerHTML = txt; L.el.className = `v-label ${on ? "on" : "off"}`; }
          L.raw.getWorldPosition(p).project(S.camera);
          L.el.style.top = `${((1 - p.y) / 2) * S.h + 34}px`;
          return ((p.x + 1) / 2) * S.w;
        });
        // Elbows sit close together on small stages: push the two labels apart, then keep them on screen.
        const [w0, w1] = labels.map((L) => L.el.offsetWidth / 2);
        const overlap = w0 + w1 + 6 - (xs[1] - xs[0]);
        if (overlap > 0) { xs[0] -= overlap / 2; xs[1] += overlap / 2; }
        xs[0] = Math.max(xs[0], w0 + 4);
        xs[1] = Math.min(xs[1], S.w - w1 - 4);
        labels.forEach((L, i) => { L.el.style.left = `${xs[i]}px`; });
      });
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "loader.parseAsync() × N・共用材質與幾何・humanoid / lookAt / expressionManager / springBoneManager.update()",
    desc: "一次放進 N 個獨立的 VRM 角色：每個都由同一份檔案重新 parseAsync，擁有自己的骨架、表情、視線與彈簧骨骼，但共用第一個角色的材質與幾何。自動加壓會逐步增加角色數，直到畫面低於 30 FPS。",
    hint: "按「自動加壓」逐步增加角色，或拖曳手動調整數量",
    async mount(ctx) {
      const C = await ensureCore(ctx);
      const { THREE } = C;
      const base = await newVRM(ctx, C);
      ctx.controls.classList.add("bottom");
      let cols = 1, rows = 1, springs = true, clock = 0, updMs = 0, buildMs = 0;
      const S = makeStage(ctx, C, {
        pad: (w) => (w >= 560 ? { l: 350 } : {}),
        onFit: (s) => {
          const depth = (rows - 1) * 0.9;
          s.frame(new THREE.Vector3(0, 0.72 + depth * 0.1, -depth / 2), (cols - 1) * 0.375 + 0.45, 0.78 + depth * 0.24, new THREE.Vector3(0, 0.45, 1));
        },
      });
      const target = new THREE.Object3D();
      S.scene.add(target);

      const baseMeshes = [];
      base.scene.traverse((o) => { if (o.isMesh) baseMeshes.push(o); });
      const baseOutline = [...new Set(baseMeshes.flatMap((o) => [o.material].flat()).filter((m) => m.isOutline))];
      const jointsPer = count(base.springBoneManager.joints);
      const crowd = [];
      const MOODS = ["happy", "relaxed", "surprised", null];
      const join = (vrm) => {
        const k = crowd.length;
        vrm.lookAt.target = target;
        if (MOODS[k % 4]) vrm.expressionManager.setValue(MOODS[k % 4], 0.6);
        crowd.push({ vrm, B: rig(vrm, THREE), blink: blinker(), ph: k * 1.7 });
        S.scene.add(vrm.scene);
      };
      const place = () => {
        cols = Math.ceil(Math.sqrt(crowd.length * 1.5));
        rows = Math.ceil(crowd.length / cols);
        crowd.forEach((c, k) => {
          const col = k % cols, row = Math.floor(k / cols);
          c.vrm.scene.position.set((col - (cols - 1) / 2) * 0.75 + (row % 2 ? 0.19 : 0), 0, -row * 0.9);
        });
      };
      // A clone keeps its own skeleton, expressions and springs but renders with the base materials and geometry.
      const addClone = async () => {
        const v = await newVRM(ctx, C, { cleanup: false });
        const mats = new Set(), geos = new Set();
        let i = 0;
        v.scene.traverse((o) => {
          if (!o.isMesh) return;
          const src = baseMeshes[i++];
          for (const m of [o.material].flat()) mats.add(m);
          geos.add(o.geometry);
          o.material = src.material;
          o.geometry = src.geometry;
        });
        for (const m of mats) {
          for (const u of Object.values(m.uniforms ?? {})) {
            if (u.value?.isTexture) { u.value.image?.close?.(); u.value.dispose(); }
          }
          m.dispose();
        }
        for (const g of geos) g.dispose();
        return v;
      };
      const removeLast = () => {
        const c = crowd.pop();
        S.scene.remove(c.vrm.scene);
        c.vrm.scene.traverse((o) => { if (o.isSkinnedMesh) o.skeleton.dispose(); });
      };
      join(base);
      ctx.onCleanup(() => { while (crowd.length > 1) removeLast(); });

      ctx.toggle("彈簧骨骼", springs, (v) => {
        springs = v;
        if (v) for (const c of crowd) c.vrm.springBoneManager.reset();
      });
      ctx.toggle("外框", true, (v) => baseOutline.forEach((m) => { m.visible = v; }));
      credit(ctx, true);
      place();
      S.fit();

      S.loop((t, dt) => {
        clock += dt;
        const u0 = performance.now();
        target.position.set(Math.sin(clock * 0.5) * 1.5, 1.3 + Math.sin(clock * 0.8) * 0.3, 2.5);
        for (const c of crowd) {
          const { vrm, B, ph } = c;
          idle(B, clock, ph);
          B.spine.rotation.y = Math.sin(clock * 0.5 + ph) * 0.15;
          vrm.scene.rotation.y = Math.sin(clock * 0.3 + ph) * 0.3;
          vrm.expressionManager.setValue("blink", c.blink.step(dt));
          // Same order as VRM.update(), minus the per-instance material update (materials are shared).
          vrm.humanoid.update();
          vrm.lookAt.update(dt);
          vrm.expressionManager.update();
          vrm.nodeConstraintManager?.update();
          if (springs) vrm.springBoneManager.update(dt);
        }
        for (const m of base.materials ?? []) m.update?.(dt);
        updMs += (performance.now() - u0 - updMs) * 0.1;
      });

      ctx.ramp({
        label: "角色", unit: "個", steps: [1, 2, 4, 6, 9, 12, 16, 20, 25, 30, 36, 42, 49], minFps: 30,
        async apply(n) {
          const t0 = performance.now();
          while (crowd.length > n) removeLast();
          while (crowd.length < n) {
            join(await addClone());
            place();
            await ctx.frame();
          }
          place();
          S.fit();
          buildMs = performance.now() - t0;
        },
        metrics: () => {
          const r = S.renderer.info.render;
          return {
            三角形: r.triangles, "draw call": r.calls,
            彈簧關節: springs ? jointsPer * crowd.length : "停用",
            更新耗時: `${updMs.toFixed(1)} ms`, 增減耗時: `${buildMs.toFixed(0)} ms`,
          };
        },
        note: "每個角色是一次獨立的 parseAsync，有自己的骨架、表情、視線與彈簧關節；材質與幾何共用第一個角色，GPU 記憶體不隨角色數增加。成本主要是每個角色約 20 次 draw call 的蒙皮網格（外框再多畫一次）與 CPU 端的物理更新。關掉彈簧骨骼看更新耗時降多少，關掉外框看 draw call 與三角形少多少。增減耗時含解析模型與釋放多餘貼圖。",
      });
    },
  },
] });
</script>
</body>
</html>
