<script type="module">
// Three.js showcase: eight scenes from the original robot showroom to an InstancedMesh stress ramp.
// Every scene owns its WebGLRenderer and releases the GL context on unmount (dispose + forceContextLoss).
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { GroundedSkybox } from "three/addons/objects/GroundedSkybox.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const { h, fmt } = Showcase;
const PANO = "_shared/img/panorama.jpg";
const ROBOT = "_shared/models/robot.glb";
const PALETTE = [0xf7df1e, 0x4cc9f0, 0xf72585, 0x7bd389, 0xff8c42, 0x9d8cff];

// Free geometries, materials, textures and render targets reachable from a scene graph.
function disposeAll(root, extra) {
  const seen = new Set();
  const free = (x) => { if (x && !seen.has(x) && typeof x.dispose === "function") { seen.add(x); x.dispose(); } };
  const freeMat = (m) => { if (!m) return; for (const v of Object.values(m)) if (v && v.isTexture) free(v); free(m); };
  root.traverse((o) => {
    free(o.geometry);
    [].concat(o.material || []).forEach(freeMat);
    if (o.isSkinnedMesh) free(o.skeleton);
    if (o.isInstancedMesh) free(o);
  });
  for (const t of [root.background, root.environment]) if (t && t.isTexture) free(t);
  for (const x of extra) (x && x.isMaterial ? freeMat : free)(x);
}

// One renderer + scene + camera per showcase scene. The camera view is shifted so the
// subject stays centred in the area not covered by the control cluster.
function stage(ctx, o = {}) {
  const host = o.host || ctx.el;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = o.exposure ?? 1;
  if (o.shadows) { renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; }
  const canvas = renderer.domElement;
  canvas.className = "gl";
  host.append(canvas);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(o.bg ?? 0x0e1013);
  const fov = o.fov ?? 45;
  const camera = new THREE.PerspectiveCamera(fov, 1, 0.1, o.far ?? 300);
  camera.position.set(...(o.pos || [0, 2, 8]));
  let controls = null;
  if (o.orbit !== false) {
    controls = new OrbitControls(camera, canvas);
    controls.target.set(...(o.target || [0, 0, 0]));
    controls.enableDamping = true;
    controls.enablePan = false;
    Object.assign(controls, o.orbit || {});
  }
  let labels = null;
  if (o.labels) {
    labels = new CSS2DRenderer();
    labels.domElement.className = "labels";
    host.append(labels.domElement);
  }
  const frameFns = [], sizeFns = [], extra = [];
  const S = {
    renderer, scene, camera, controls, canvas, host, width: 1, height: 1, availH: 1, full: 1,
    render: () => renderer.render(scene, camera),
    onFrame(fn) { frameFns.push(fn); },
    onSize(fn) { sizeFns.push(fn); fn(S.width, S.height); },
    own(...xs) { extra.push(...xs); return xs[0]; },
  };
  let lastKey = "";
  const fit = () => {
    const w = Math.max(1, host.clientWidth), hh = Math.max(1, host.clientHeight);
    const top = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-h")) || 0;
    const bot = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-b")) || 0;
    const key = `${w}x${hh}:${top}:${bot}`;
    if (key === lastKey) return;
    lastKey = key;
    const d = Math.max(-hh * 0.4, Math.min(hh * 0.4, top - bot));
    S.width = w; S.height = hh; S.full = hh + Math.abs(d); S.availH = hh - Math.abs(d);
    renderer.setSize(w, hh);
    if (labels) labels.setSize(w, hh);
    camera.aspect = w / S.full;
    camera.fov = o.portraitFov && w < hh ? o.portraitFov : fov;
    if (d) camera.setViewOffset(w, S.full, 0, d < 0 ? -d : 0, w, hh); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    for (const fn of sizeFns) fn(w, hh);
  };
  fit();
  const timer = new THREE.Timer();
  ctx.raf((t) => {
    fit();
    timer.update(t);
    const dt = Math.max(0, Math.min(timer.getDelta(), 0.1)), time = timer.getElapsed();
    for (const fn of frameFns) fn(dt, time);
    if (controls) controls.update(dt);
    S.render();
    if (labels) labels.render(scene, camera);
  });
  ctx.onCleanup(() => {
    if (controls) controls.dispose();
    timer.dispose();
    disposeAll(scene, extra);
    renderer.dispose();
    renderer.forceContextLoss();
    canvas.remove();
    if (labels) labels.domElement.remove();
  });
  return S;
}

// Camera distance that fits a halfW x halfH box into the visible (uncovered) part of the view.
function fitDistance(S, halfW, halfH, margin = 1.12) {
  const tanV = Math.tan(THREE.MathUtils.degToRad(S.camera.fov) / 2);
  const dv = (halfH * S.full) / (S.availH * tanV);
  const dh = halfW / (tanV * S.camera.aspect);
  return Math.max(dv, dh) * margin;
}
const setNdc = (S, e, v) => {
  const r = S.canvas.getBoundingClientRect();
  return v.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
};
// Click/tap that is not the end of an orbit drag.
function onTap(ctx, el, fn) {
  let d = null;
  ctx.on(el, "pointerdown", (e) => { d = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  ctx.on(el, "pointerup", (e) => {
    if (d && performance.now() - d.t < 300 && Math.hypot(e.clientX - d.x, e.clientY - d.y) < 6) fn(e);
    d = null;
  });
}
function label(title, sub, y) {
  const el = h("div", { class: "lab" }, h("span", { class: "t", text: title }), sub ? h("small", { text: sub }) : null);
  const obj = new CSS2DObject(el);
  obj.position.y = y;
  return obj;
}
function chip(ctx, html) {
  const el = h("div", { class: "chip" });
  el.innerHTML = html;
  ctx.el.append(el);
  let last = html;
  return (next) => { if (next !== last) { last = next; el.innerHTML = next; } };
}
async function loadPano() {
  const tex = await new THREE.TextureLoader().loadAsync(PANO);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function checkerTexture() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { g.fillStyle = (x + y) % 2 ? "#1a1e26" : "#262c38"; g.fillRect(x * 32, y * 32, 32, 32); }
  g.strokeStyle = "rgba(247,223,30,.55)"; g.lineWidth = 3; g.strokeRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const std = (color, extra) => new THREE.MeshStandardMaterial({ color, roughness: 0.5, ...extra });

Showcase.run({ scenes: [
  {
    id: "robot", title: "機器人展示間",
    api: "new GLTFLoader().loadAsync(url)・mixer.clipAction(clip).fadeIn()",
    desc: "載入 glTF 機器人，AnimationMixer 交叉淡入切換動作、一鍵替換整身材質；背景與反射都來自同一張全景圖，點機器人用 Raycaster 判定命中。",
    hint: "拖曳旋轉・滾輪縮放・點機器人讓它跳一下",
    async mount(ctx) {
      const S = stage(ctx, { shadows: true, fov: 40, portraitFov: 55, exposure: 1.05, pos: [-7.5, 4.2, 12.5], target: [0, 2.1, 0],
        orbit: { autoRotate: true, autoRotateSpeed: 0.6, minDistance: 5, maxDistance: 24, maxPolarAngle: Math.PI * 0.49 } });
      const { scene, camera } = S;
      const key = new THREE.DirectionalLight(0xffe2b8, 2.4);
      key.position.set(5, 9, 6);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
      key.shadow.camera.updateProjectionMatrix();
      scene.add(key);
      const rim = new THREE.SpotLight(0x4cc9f0, 60, 30, Math.PI / 6, 0.6);
      rim.position.set(-6, 6, -6);
      scene.add(rim, new THREE.HemisphereLight(0xbfd8ff, 0x332211, 0.4));
      const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.4, 0.5, 96),
        new THREE.MeshPhysicalMaterial({ color: 0x15171c, metalness: 0.6, roughness: 0.45, clearcoat: 0.6, clearcoatRoughness: 0.3, envMapIntensity: 0.35 }));
      pedestal.position.y = -0.25;
      pedestal.receiveShadow = true;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(3.25, 0.035, 12, 160), new THREE.MeshBasicMaterial({ color: 0xf7df1e }));
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 0.01;
      scene.add(pedestal, ring);

      const ANIMS = [["Idle", "待機"], ["Walking", "走路"], ["Running", "跑步"], ["Dance", "跳舞"], ["Wave", "揮手"]];
      const MATS = [["orig", "原色"], ["chrome", "鍍鉻"], ["glass", "玻璃"], ["gold", "霧金"]];
      const matLib = {
        chrome: new THREE.MeshPhysicalMaterial({ color: 0xe8e8ea, metalness: 1, roughness: 0.08 }),
        glass: new THREE.MeshPhysicalMaterial({ color: 0xbfe9ff, metalness: 0, roughness: 0.04, transmission: 1, thickness: 0.8, ior: 1.45 }),
        gold: new THREE.MeshPhysicalMaterial({ color: 0xf7c95a, metalness: 1, roughness: 0.38, clearcoat: 0.6 }),
      };
      S.own(...Object.values(matLib));
      let mixer = null, model = null, current = null, lastLoop = "Idle";
      const actions = {}, originalMats = new Map();
      const animSeg = ctx.group(ANIMS.map((a) => a[1]), 0, (i) => play(ANIMS[i][0]));
      ctx.group(MATS.map((m) => m[1]), 0, (i) => setMaterial(MATS[i][0]));
      const mark = (name) => animSeg.querySelectorAll("button").forEach((b, i) => b.setAttribute("aria-pressed", String(ANIMS[i][0] === name)));
      function play(name) {
        const next = actions[name];
        if (!next || next === current) return;
        next.reset().setEffectiveWeight(1).fadeIn(0.35).play();
        if (current) current.fadeOut(0.35);
        current = next;
        if (next.loop !== THREE.LoopOnce) lastLoop = name;
        if (name !== "Jump") mark(name);
      }
      function setMaterial(kind) {
        if (!model) return;
        model.traverse((m) => { if (m.isMesh) m.material = kind === "orig" ? originalMats.get(m) : matLib[kind]; });
      }
      S.onFrame((dt, t) => {
        if (mixer) mixer.update(dt);
        ring.material.color.setHSL(0.15, 0.95, 0.5 + Math.sin(t * 2) * 0.08);
      });
      const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
      onTap(ctx, S.canvas, (e) => {
        if (!model) return;
        ray.setFromCamera(setNdc(S, e, ndc), camera);
        if (ray.intersectObject(model, true).length) play("Jump");
      });

      const st = ctx.status("載入全景圖與 glTF 模型…");
      const [tex, gltf] = await Promise.all([loadPano(), new GLTFLoader().loadAsync(ROBOT)]);
      st.done();
      if (!ctx.active) { tex.dispose(); return; }
      Object.assign(scene, { environment: tex, background: tex, backgroundBlurriness: 0.06, backgroundIntensity: 0.7, environmentIntensity: 0.9 });
      model = gltf.scene;
      model.traverse((m) => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; originalMats.set(m, m.material); } });
      scene.add(model);
      mixer = new THREE.AnimationMixer(model);
      for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
      for (const name of ["Jump", "Wave"]) {
        if (!actions[name]) continue;
        actions[name].setLoop(THREE.LoopOnce);
        actions[name].clampWhenFinished = true;
      }
      mixer.addEventListener("finished", () => { play(lastLoop); mark(lastLoop); });
      play("Idle");
    },
  },
  {
    id: "pbr", title: "PBR 材質",
    api: "new MeshStandardMaterial({ metalness, roughness })・new MeshPhysicalMaterial({ transmission, sheen… })",
    desc: "「金屬×粗糙」以 5×2 對照金屬度與粗糙度；「進階特性」看 MeshPhysicalMaterial 的透光、色散、清漆、絨布與薄膜干涉。環境光由 RoomEnvironment 經 PMREM 預先濾波。",
    hint: "拖曳旋轉，觀察反射隨粗糙度變模糊",
    mount(ctx) {
      const S = stage(ctx, { labels: true, fov: 35, pos: [0, 0.6, 12], target: [0, 0, 0], orbit: { minDistance: 3, maxDistance: 40 } });
      const { scene, renderer, camera, controls } = S;
      const pmrem = new THREE.PMREMGenerator(renderer);
      const room = new RoomEnvironment();
      const envRT = pmrem.fromScene(room, 0.04);
      room.dispose();
      pmrem.dispose();
      S.own(envRT);
      scene.environment = envRT.texture;
      const sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(3, 6, 6);
      scene.add(sun);
      const floorTex = S.own(checkerTexture());
      floorTex.repeat.set(10, 10);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const setA = new THREE.Group(), setB = new THREE.Group();
      const ball = new THREE.SphereGeometry(0.72, 64, 32);
      const itemsA = [];
      for (const metal of [1, 0]) for (const r of [0, 0.25, 0.5, 0.75, 1]) {
        const m = new THREE.Mesh(ball, std(metal ? 0xf2c14e : 0xf72585, { metalness: metal, roughness: r }));
        const tag = label(`金屬度 ${metal}`, `粗糙度 ${r.toFixed(2)}`, -1.05);
        tag.element.classList.add("ms");
        m.add(tag);
        itemsA.push({ m, metal, r });
        setA.add(m);
      }
      // Column headers replace the per-ball title when the grid is stacked for portrait screens.
      const heads = [label("金屬度 1", "", 0), label("金屬度 0", "", 0)];
      setA.add(...heads);
      const knot = new THREE.TorusKnotGeometry(0.5, 0.19, 220, 32);
      const PHYS = [
        ["透光", "transmission 1", { color: 0xffffff, roughness: 0.05, transmission: 1, thickness: 1.2, ior: 1.5 }],
        ["色散", "dispersion 5", { color: 0xffffff, roughness: 0, transmission: 1, thickness: 1.5, ior: 1.7, dispersion: 5 }],
        ["清漆", "clearcoat 1", { color: 0xc0182a, metalness: 0.6, roughness: 0.5, clearcoat: 1, clearcoatRoughness: 0.03 }],
        ["絨布", "sheen 1", { color: 0x2a1d6b, roughness: 0.9, sheen: 1, sheenRoughness: 0.35, sheenColor: new THREE.Color(0xb9a7ff) }],
        ["薄膜干涉", "iridescence 1", { color: 0x222222, metalness: 1, roughness: 0.15, iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [200, 800] }],
      ];
      const itemsB = PHYS.map(([t, sub, p]) => {
        const m = new THREE.Mesh(knot, new THREE.MeshPhysicalMaterial(p));
        m.add(label(t, sub, -1.05));
        setB.add(m);
        return m;
      });
      // Striped backdrop: refraction bends the stripes, dispersion splits their edges into colour fringes.
      const sc = document.createElement("canvas");
      sc.width = 512; sc.height = 8;
      const sg = sc.getContext("2d");
      for (let x = 0; x < 16; x++) { sg.fillStyle = x % 2 ? "#f4f4f0" : "#15171c"; sg.fillRect(x * 32, 0, 32, 8); }
      const stripeTex = S.own(new THREE.CanvasTexture(sc));
      stripeTex.colorSpace = THREE.SRGBColorSpace;
      stripeTex.wrapS = THREE.RepeatWrapping;
      stripeTex.repeat.set(2, 1);
      const backdrop = new THREE.Mesh(new THREE.PlaneGeometry(16, 12), new THREE.MeshBasicMaterial({ map: stripeTex }));
      backdrop.position.set(0, 1.3, -2.6);
      setB.add(backdrop);
      setB.visible = false;
      scene.add(setA, setB);

      let mode = 0;
      // Lay the grid out landscape (5 columns) or portrait (2 or 3 columns) and refit the camera.
      const layout = () => {
        const portrait = S.width / S.availH < 0.95;
        let halfW, halfH;
        if (mode === 0) {
          for (const { m, metal, r } of itemsA) {
            const i = r * 4, j = metal ? 0 : 1;
            if (portrait) m.position.set((j - 0.5) * 3.6, (2 - i) * 2.3 + 1.3, 0);
            else m.position.set((i - 2) * 2.1, (0.5 - j) * 2.5 + 1.3, 0);
          }
          heads.forEach((hd, j) => { hd.visible = portrait; hd.position.set((j - 0.5) * 3.6, 7, 0); });
          halfW = portrait ? 2.7 : 5.3; halfH = portrait ? 6 : 2.85;
        } else {
          const cols = portrait ? 2 : 5, rows = Math.ceil(5 / cols), gap = portrait ? 2.9 : 2.5;
          itemsB.forEach((m, k) => {
            const c = k % cols, rr = Math.floor(k / cols), inRow = Math.min(cols, 5 - rr * cols);
            m.position.set((c - (inRow - 1) / 2) * 2.1, ((rows - 1) / 2 - rr) * gap + 1.3, 0);
          });
          halfW = cols * 1.05 + 0.15; halfH = (rows * gap) / 2 + 0.1;
        }
        ctx.el.classList.toggle("pbr-compact", portrait && mode === 0);
        floor.position.y = 1.3 - halfH - 0.3;
        const dist = fitDistance(S, halfW, halfH);
        camera.position.set(0, 1.9, dist);
        controls.target.set(0, 1.3, 0);
        controls.update();
      };
      S.onSize(layout);
      ctx.group(["金屬×粗糙", "進階特性"], 0, (i) => { mode = i; setA.visible = i === 0; setB.visible = i === 1; layout(); });
      ctx.slider("環境光", { min: 0, max: 2, step: 0.05, value: 1, format: (v) => v.toFixed(2) }, (v) => { scene.environmentIntensity = v; });
      S.onFrame((dt) => { for (const m of itemsB) m.rotation.y += dt * 0.35; });
    },
  },
  {
    id: "lights", title: "燈光與陰影",
    api: "new SpotLight(color, intensity, 0, angle, penumbra)・light.castShadow・shadow.mapSize",
    desc: "四種光源輪流打在同一組物件上，光源繞場景移動讓陰影即時變化；陰影貼圖解析度從 256 拉到 2048，邊緣鋸齒差異一目了然。",
    hint: "切換光源類型與陰影解析度，拖曳換角度",
    mount(ctx) {
      const S = stage(ctx, { shadows: true, fov: 45, portraitFov: 60, pos: [7, 6.5, 9], target: [0, 0.8, 0],
        orbit: { maxPolarAngle: Math.PI * 0.48, minDistance: 5, maxDistance: 25 } });
      const { scene } = S;
      scene.add(new THREE.AmbientLight(0xffffff, 0.08));
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), std(0x8a93a6, { roughness: 0.9 }));

        for (const k of ["r", "a", "w", "y", "s", "arm"]) P[k] = grow(P[k]);
        let seed = 1234 + P.n * 7919;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        for (let i = P.n; i < n; i++) {
          const arm = i % 5, r = 0.6 + 11 * Math.pow(rnd(), 0.7);
          P.arm[i] = arm; P.r[i] = r;
          P.a[i] = arm * (Math.PI * 2 / 5) + r * 0.45 + (rnd() - 0.5) * 0.7;
          P.w[i] = 0.55 / (0.6 + r * 0.35);
          P.y[i] = (rnd() - 0.5) * (1.6 - r * 0.08);
          P.s[i] = 0.6 + rnd() * 0.8;
        }
        P.n = n;
      };
      const sizeFor = (n) => Math.min(0.32, Math.max(0.045, 0.32 * Math.cbrt(1000 / n)));
      const write = (t) => {
        const t0 = performance.now(), arr = mesh.instanceMatrix.array, base = sizeFor(count);
        for (let i = 0, k = 0; i < count; i++, k += 16) {
          const ang = P.a[i] + t * P.w[i], r = P.r[i], s = base * P.s[i];
          const rc = Math.cos(ang * 3) * s, rs = Math.sin(ang * 3) * s;
          arr[k] = rc; arr[k + 1] = 0; arr[k + 2] = -rs; arr[k + 3] = 0;
          arr[k + 4] = 0; arr[k + 5] = s; arr[k + 6] = 0; arr[k + 7] = 0;
          arr[k + 8] = rs; arr[k + 9] = 0; arr[k + 10] = rc; arr[k + 11] = 0;
          arr[k + 12] = Math.cos(ang) * r; arr[k + 13] = P.y[i] + Math.sin(t * 1.5 + r) * 0.15; arr[k + 14] = Math.sin(ang) * r; arr[k + 15] = 1;
        }
        const im = mesh.instanceMatrix;
        im.clearUpdateRanges();
        im.addUpdateRange(0, count * 16);
        im.needsUpdate = true;
        updMs = performance.now() - t0;
      };
      const rebuild = (n) => {
        if (mesh) { scene.remove(mesh); mesh.dispose(); }
        cap = Math.max(1, n);
        ensure(cap);
        mesh = new THREE.InstancedMesh(shapes[shape], mat, cap);
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        mesh.frustumCulled = false;
        const c = new THREE.Color();
        for (let i = 0; i < cap; i++) mesh.setColorAt(i, c.setHex(PALETTE[P.arm[i]]).multiplyScalar(0.7 + (P.s[i] - 0.6) * 0.5));
        mesh.count = count;
        write(frozenT);
        scene.add(mesh);
      };
      S.onFrame((dt, t) => {
        if (!mesh) return;
        if (animate) { frozenT = t; write(t); } else { mesh.rotation.y += dt * 0.1; updMs = 0; }
      });
      ctx.toggle("逐格更新矩陣", true, (v) => { animate = v; });
      ctx.group(["方塊 12 面", "球體 168 面"], 0, (i) => { shape = i; rebuild(cap); });
      ctx.ramp({
        label: "實例數", unit: "個",
        steps: [1000, 5000, 20000, 50000, 100000, 200000, 350000, 500000],
        minFps: 30,
        apply(n) {
          count = n;
          if (!mesh || n > cap) rebuild(n);
          else { mesh.count = n; write(frozenT); }
        },
        metrics: () => ({ 三角形: renderer.info.render.triangles, "Draw calls": renderer.info.render.calls, 矩陣更新: animate ? `${updMs.toFixed(1)} ms` : "暫停" }),
        note: "所有實例都屬於同一個 InstancedMesh，整批只有 1 次 draw call。開啟「逐格更新矩陣」時，JS 每格重算全部 4×4 矩陣並整批上傳 GPU，瓶頸在 CPU 與傳輸頻寬；關閉後只剩 GPU 繪製，改用球體（三角形約多 14 倍）可觀察頂點處理上限。",
      });
    },
  },
] });
</script>
