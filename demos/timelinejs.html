<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TimelineJS 示範：臺灣捷運通車年表</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@knight-lab/timelinejs@3.9.13/dist/css/themes/timeline.theme.dark.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  :root { --bar: 54px; }
  .bar {
    position: fixed; left: 0; right: 0; top: 0; height: var(--bar); z-index: 40;
    display: flex; align-items: center; gap: 14px; padding: 0 14px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .bar h1 { margin: 0; font-size: 16px; line-height: 1.2; white-space: nowrap; }
  .bar h1 b { color: var(--accent); }
  .bar h1 small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .jump { display: flex; gap: 6px; align-items: center; }
  .jump span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .chip {
    appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); background: var(--bg-2); color: var(--fg);
    font: 500 13px/1 var(--font); padding: 7px 11px; border-radius: 999px;
    transition: border-color .15s, background .15s;
  }
  .chip i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .chip:hover { border-color: var(--c); }
  .chip[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 28%, var(--bg-2)); }
  .bar .hint { position: static; margin-left: auto; white-space: nowrap; }

  .wrap { position: fixed; left: 0; right: 0; top: var(--bar); bottom: 0; }
  #tl { width: 100%; height: 100%; }

  /* TimelineJS overrides: CJK font and page palette */
  .tl-timeline, .tl-timeline h1, .tl-timeline h2, .tl-timeline h3, .tl-timeline p,
  .tl-headline, .tl-text, .tl-text-content, .tl-headline-date, .tl-text-date,
  .tl-slidenav-title, .tl-slidenav-description, .tl-timemarker-text, .tl-timegroup-message,
  .tl-timeaxis, .tl-message-content { font-family: var(--font) !important; }
  .tl-timeline { background: var(--bg) !important; }
  .tl-timenav { background: #13161b !important; border-top: 1px solid var(--line); }
  .tl-slide h2.tl-headline-title { font-size: 34px !important; line-height: 1.25 !important; letter-spacing: .02em; }
  .tl-slide h2.tl-headline { font-size: 26px !important; line-height: 1.3 !important; }
  .tl-text .tl-headline-date, .tl-text h3.tl-headline-date { color: rgba(255,255,255,.75) !important; font-size: 15px !important; }
  .tl-slide p { font-size: 15px; line-height: 1.75; }
  .tl-timegroup .tl-timegroup-message { font-size: 12px !important; color: #c9c7bf !important; }
  .tl-attribution { display: none !important; }
  .tl-timegroup { background-color: #15181e !important; }
  .tl-timegroup.tl-timegroup-alternate { background-color: #1b1f26 !important; }
  .tl-timegroup .tl-timegroup-message { text-shadow: none !important; }
  .tl-timeaxis-background, .tl-timeaxis .tl-timeaxis-content-container .tl-timeaxis-major { background-color: #0f1216 !important; }
  .tl-timeaxis .tl-timeaxis-content-container .tl-timeaxis-major .tl-timeaxis-tick { color: #a7a59d !important; }
  .tl-timemarker .tl-timemarker-content-container {
    background-color: #242a33 !important; border-color: transparent !important;
    box-shadow: inset 3px 0 0 var(--rc, #666) !important;
  }
  .tl-timemarker .tl-timemarker-content-container .tl-timemarker-content .tl-timemarker-text h2.tl-headline { color: #d3d1c9 !important; }
  .tl-timemarker .tl-timemarker-line-left, .tl-timemarker .tl-timemarker-line-right { border-color: color-mix(in srgb, var(--rc, #666) 55%, transparent) !important; }
  .tl-timemarker .tl-timemarker-line-left:after, .tl-timemarker .tl-timemarker-line-right:after { background-color: var(--rc, #666) !important; }
  .tl-timemarker.tl-timemarker-active .tl-timemarker-content-container { background-color: var(--rc, #666) !important; }
  .tl-timemarker.tl-timemarker-active .tl-timemarker-content-container .tl-timemarker-content .tl-timemarker-text h2.tl-headline { color: #fff !important; }
  .tl-timemarker h2.tl-headline.tl-headline-fadeout:after { display: none !important; }
  .tl-timeera.tl-timeera-color0 .tl-timeera-background, .tl-timeera.tl-timeera-color3 .tl-timeera-background { background-color: #3a4a5e !important; }
  .tl-timeera.tl-timeera-color1 .tl-timeera-background, .tl-timeera.tl-timeera-color4 .tl-timeera-background { background-color: #4a3f60 !important; }
  .tl-timeera.tl-timeera-color2 .tl-timeera-background, .tl-timeera.tl-timeera-color5 .tl-timeera-background { background-color: #2f5249 !important; }
  .tl-timeera .tl-timeera-content-container .tl-timeera-content .tl-timeera-text h2.tl-headline { color: #e6e4dc !important; }
  .tl-timeera h2.tl-headline.tl-headline-fadeout:after { display: none !important; }

  .tag {
    display: inline-block; margin: 0 6px 8px 0; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; line-height: 1.5; background: rgba(255,255,255,.16); color: #fff;
  }
  .tag.line { background: rgba(0,0,0,.28); }
  .src { font-size: 12px !important; opacity: .7; }

  @media (max-width: 620px) {
    :root { --bar: 48px; }
    .bar { padding: 0 10px; gap: 8px; }
    .bar h1, .jump span, .bar .hint { display: none; }
    .jump { width: 100%; justify-content: space-between; }
    .chip { padding: 7px 10px; }
    .tl-slide h2.tl-headline-title { font-size: 24px !important; }
    .tl-slide h2.tl-headline { font-size: 20px !important; }
    .tl-slide p { font-size: 14px; line-height: 1.65; }
  }
</style>
</head>
<body>
  <header class="bar">
    <h1><b>TimelineJS</b> 臺灣捷運通車年表<small>1996 到 2026，四個都會區 23 個通車日</small></h1>
    <nav class="jump" id="jump" aria-label="依地區跳轉">
      <span>跳到：</span>
    </nav>
    <div class="hint">點事件標記、左右方向鍵或滑動翻頁</div>
  </header>
  <div class="wrap"><div id="tl"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/@knight-lab/timelinejs@3.9.13/dist/js/timeline.js"></script>
  <script>
  // Region groups shown as rows in the time navigator
  const REGIONS = {
    "雙北": { color: "#1f6fb5", bg: "#123b63" },
    "桃園": { color: "#9d6bd8", bg: "#3d2563" },
    "臺中": { color: "#7bbf3a", bg: "#2d4f17" },
    "高雄": { color: "#e2457a", bg: "#6a1736" },
  };

  // [id, y, m, d, region, line, headline, description]
  const EVENTS = [
    ["muzha", 1996, 3, 28, "雙北", "木柵線", "木柵線通車", "中山國中至動物園，全長 10.5 公里，是臺灣第一條捷運，採中運量膠輪系統。"],
    ["tamsui", 1997, 3, 28, "雙北", "淡水線", "淡水線通車", "淡水至中山段與新北投支線先行營運，路線沿用舊台鐵淡水線的路廊。"],
    ["zhonghe", 1998, 12, 24, "雙北", "中和線・新店線", "中和線與新店線北段通車", "兩條路線同日營運，捷運路網開始向南延伸到永和、中和。"],
    ["xindian", 1999, 11, 11, "雙北", "新店線", "新店線全線通車", "延伸至新店站，南北向的主幹路線成形。"],
    ["bannan", 1999, 12, 24, "雙北", "板南線", "板南線首段通車", "龍山寺至市政府段營運，第一條東西向路線串起萬華、西門、台北車站與信義區。"],
    ["kh-red", 2008, 3, 9, "高雄", "紅線", "高雄捷運紅線正式營運", "南部第一條捷運，串連小港、高雄國際機場、市中心與左營高鐵站一帶。"],
    ["kh-orange", 2008, 9, 14, "高雄", "橘線", "高雄捷運橘線全線通車", "西子灣至大寮，與紅線在美麗島站交會，高雄十字路網完成。"],
    ["nangang", 2008, 12, 25, "雙北", "板南線", "南港線東延至南港站", "板南線由昆陽往東延伸一站，終點改為南港。"],
    ["wenhu", 2009, 7, 4, "雙北", "文湖線", "文湖線內湖段通車", "木柵線延伸到內湖、南港展覽館並更名文湖線，臺北捷運初期路網完成。"],
    ["luzhou", 2010, 11, 3, "雙北", "中和新蘆線", "蘆洲線與新莊線首段通車", "蘆洲線全線，以及新莊線大橋頭至忠孝新生段同日營運。"],
    ["xinzhuang", 2013, 6, 29, "雙北", "中和新蘆線", "新莊線迴龍至輔大段通車", "新莊線再往西延伸丹鳳、迴龍兩站。"],
    ["xinyi", 2013, 11, 24, "雙北", "信義線", "信義線通車", "象山至中正紀念堂，與淡水線直通營運，串起信義計畫區。"],
    ["songshan", 2014, 11, 15, "雙北", "松山線", "松山線通車", "西門至松山，大致沿南京東路行駛，與新店線直通營運。"],
    ["kh-lrt1", 2015, 10, 16, "高雄", "環狀輕軌", "環狀輕軌第一階段啟用", "籬仔內至凱旋中華，臺灣第一條輕軌，車輛在站內充電、路段不架設電車線。"],
    ["airport", 2017, 3, 2, "桃園", "機場線", "桃園機場捷運通車", "台北車站直達桃園國際機場，分為普通車與直達車兩種服務。"],
    ["kh-lrt2", 2017, 9, 26, "高雄", "環狀輕軌", "環狀輕軌延伸至哈瑪星", "南半圈完成，輕軌沿著亞洲新灣區與駁二藝術特區行駛。"],
    ["danhai", 2018, 12, 23, "雙北", "淡海輕軌", "淡海輕軌綠山線通車", "紅樹林至崁頂，新北市第一條輕軌。"],
    ["circular", 2020, 1, 31, "雙北", "環狀線", "環狀線第一階段通車", "大坪林至新北產業園區，全線位於新北市，新店、中和、板橋、新莊不必進臺北市區就能互通。"],
    ["bluecoast", 2020, 11, 15, "雙北", "淡海輕軌", "淡海輕軌藍海線第一期", "濱海沙崙至漁人碼頭，輕軌開到淡水河口的觀光區。"],
    ["taichung", 2021, 4, 25, "臺中", "綠線", "臺中捷運綠線通車", "北屯總站至高鐵臺中站，中部第一條捷運。"],
    ["ankeng", 2023, 2, 10, "雙北", "安坑輕軌", "安坑輕軌通車", "2 月 10 日起試營運，3 月 13 日起正式收費，連接安坑地區與新店十四張站。"],
    ["kh-loop", 2024, 1, 1, "高雄", "環狀輕軌", "高雄環狀輕軌全線成圓", "北半圈最後一段完工，輕軌繞行市區一整圈。"],
    ["sanying", 2026, 6, 30, "雙北", "三鶯線", "三鶯線通車試營運", "連接土城頂埔與三峽、鶯歌，9 月 1 日起正式收費。"],
  ];

  const data = {
    title: {
      unique_id: "title",
      text: {
        headline: "臺灣捷運通車年表",
        text: "<p>從 1996 年的木柵線，到 2026 年的三鶯線。<br>雙北、桃園、臺中、高雄四個都會區的重要通車日，依地區分列在下方時間軸。</p>"
          + "<p>" + Object.keys(REGIONS).map((r) => `<span class="tag" style="background:${REGIONS[r].bg}">${r} ${EVENTS.filter((e) => e[4] === r).length} 筆</span>`).join("") + "</p>"
          + "<p class='src'>資料整理自維基百科各路線條目</p>",
      },
      background: { color: "#16191f" },
    },
    eras: [
      { start_date: { year: 1996, month: 3, day: 28 }, end_date: { year: 2009, month: 7, day: 4 }, text: { headline: "臺北初期路網" } },
      { start_date: { year: 2009, month: 7, day: 4 }, end_date: { year: 2017, month: 3, day: 2 }, text: { headline: "路網加密" } },
      { start_date: { year: 2017, month: 3, day: 2 }, end_date: { year: 2026, month: 9, day: 1 }, text: { headline: "多城市與輕軌" } },
    ],
    events: EVENTS.map(([id, year, month, day, region, line, headline, desc]) => ({
      unique_id: id,
      group: region,
      start_date: { year, month, day },
      display_date: `${year} 年 ${month} 月 ${day} 日`,
      background: { color: REGIONS[region].bg },
      text: {
        headline,
        text: `<span class="tag">${region}</span><span class="tag line">${line}</span><p>${desc}</p>`,
      },
    })),
  };

  // Tint each marker with its region color (TimelineJS gives markers the id "<unique_id>-marker")
  const tint = document.createElement("style");
  tint.textContent = EVENTS.map((e) => `#${e[0]}-marker{--rc:${REGIONS[e[4]].color}}`).join("");
  document.head.appendChild(tint);

  const timeline = new TL.Timeline("tl", data, {
    language: "zh-tw",
    script_path: "https://cdn.jsdelivr.net/npm/@knight-lab/timelinejs@3.9.13/dist/js/",
    font: null,
    hash_bookmark: false,
    timenav_height_percentage: 40,
    timenav_height_min: 170,
    marker_height_min: 26,
    duration: 700,
    scale_factor: innerWidth < 620 ? 3 : 1,  // spread markers more on narrow screens
  });

  // Region jump chips: go to the first event of each region and highlight the active one
  const jump = document.getElementById("jump");
  const chips = {};
  for (const [name, { color }] of Object.entries(REGIONS)) {
    const first = EVENTS.find((e) => e[4] === name);
    const b = document.createElement("button");
    b.className = "chip";
    b.style.setProperty("--c", color);
    b.innerHTML = `<i></i>${name}`;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", () => timeline.goToId(first[0]));
    jump.appendChild(b);
    chips[name] = b;
  }
  const regionOf = Object.fromEntries(EVENTS.map((e) => [e[0], e[4]]));
  timeline.on("change", (e) => {
    const active = regionOf[e.unique_id];
    for (const [name, b] of Object.entries(chips)) b.setAttribute("aria-pressed", String(name === active));
  });
  </script>
</body>
</html>
