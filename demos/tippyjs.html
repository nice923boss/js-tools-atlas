<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tippy.js 示範：提示框、主題與導覽</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/themes/light-border.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/themes/material.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/themes/translucent.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/animations/scale.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/animations/shift-away.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/animations/perspective.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 0%, rgba(157,140,255,.12), transparent 70%), var(--bg); }
  .page { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 56px 14px 50px; }
  .editor { width: min(620px, 100%); border: 1px solid var(--line); border-radius: 14px; background: var(--bg-2); overflow: hidden; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-bottom: 1px solid var(--line); background: #1b1f25; }
  .tool { width: 36px; height: 34px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--fg); font: 600 15px var(--font); cursor: pointer; }
  .tool:hover { background: rgba(255,255,255,.07); border-color: var(--line); }
  .tool.pub { margin-left: auto; width: auto; padding: 0 14px; background: var(--accent); color: var(--accent-ink); font-size: 13px; }
  .doc { padding: 14px 18px 18px; font-size: 14px; line-height: 1.8; color: #cfd2d6; }
  .doc h2 { margin: 0 0 6px; font-size: 18px; color: var(--fg); }
  .doc abbr { text-decoration: underline dotted var(--c2); text-underline-offset: 4px; cursor: help; color: var(--c2); }
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: min(620px, 100%); }
  .demo { padding: 12px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: 600 13px var(--font); cursor: pointer; text-align: center; }
  .demo small { display: block; color: var(--muted); font-weight: 400; font-size: 11px; margin-top: 2px; }
  .demo:hover { border-color: var(--accent); }
  #dPlace { position: relative; }
  .anchor { position: absolute; inset: 0; pointer-events: none; }
  .menu { display: flex; flex-direction: column; min-width: 140px; padding: 4px 0; }
  .menu button { all: unset; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .menu button:hover { background: rgba(0,0,0,.07); }
  .tour { font-size: 13px; line-height: 1.6; max-width: 230px; }
  .tour b { display: block; font-size: 14px; margin-bottom: 2px; }
  .tour .row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .tour .row span { opacity: .6; font-size: 12px; }
  .tour .row button { border: 0; border-radius: 6px; padding: 5px 10px; background: var(--accent); color: var(--accent-ink); font: 700 12px var(--font); cursor: pointer; }
  kbd { font: 600 11px var(--mono); padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,.15); margin-left: 4px; }
  .tippy-box[data-theme~="js"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .tippy-box[data-theme~="js"] > .tippy-arrow::before { color: var(--accent); }
  @media (max-width: 560px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .doc { padding: 10px 12px; font-size: 13px; } .page { gap: 14px; } }
</style>
</head>
<body>
<div class="controls">
  <button class="btn primary" id="tourBtn">重新導覽</button>
</div>
<div class="page">
  <div class="editor">
    <div class="toolbar" id="toolbar">
      <button class="tool" data-tippy-content="粗體<kbd>Ctrl+B</kbd>"><b>B</b></button>
      <button class="tool" data-tippy-content="斜體<kbd>Ctrl+I</kbd>"><i>I</i></button>
      <button class="tool" data-tippy-content="插入連結<kbd>Ctrl+K</kbd>">🔗</button>
      <button class="tool" data-tippy-content="插入圖片">🖼</button>
      <button class="tool" data-tippy-content="插入表格">▦</button>
      <button class="tool pub" id="publish">發佈</button>
    </div>
    <div class="doc" id="doc">
      <h2>第 3 堂：前端互動入門</h2>
      本週介紹 <abbr data-tip="Document Object Model，瀏覽器把 HTML 轉成的物件樹">DOM</abbr> 與
      <abbr data-tip="Application Programming Interface，程式之間溝通的約定">API</abbr>，
      滑過虛線字可以看到名詞解釋。
    </div>
  </div>
  <div class="grid">
    <button class="demo" id="dPlace">四個方向<small>placement</small><span class="anchor"></span><span class="anchor"></span><span class="anchor"></span><span class="anchor"></span></button>
    <button class="demo" id="dClick">點擊選單<small>interactive</small></button>
    <button class="demo" id="dFollow">跟隨滑鼠<small>followCursor</small></button>
    <button class="demo" id="dTheme">切換主題<small>theme</small></button>
  </div>
</div>
<div class="hint">滑過工具列與虛線字看提示・點下方按鈕試不同功能</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.umd.min.js"></script>
<script>
// Tippy.js showcase: toolbar tooltips with HTML, glossary tooltips, placements, interactive menu, followCursor, themes and a guided tour.
const THEMES = ["", "light-border", "material", "translucent", "js"];
let themeIndex = 0;

const toolTips = tippy("#toolbar [data-tippy-content]", { allowHTML: true, animation: "scale", placement: "bottom", delay: [80, 0] });
const glossary = tippy("#doc abbr", {
  content: (el) => el.dataset.tip, animation: "shift-away", theme: "light-border", maxWidth: 220, interactive: true,
});
const pubTip = tippy("#publish", { content: "發佈後學員會收到通知", placement: "bottom-end", animation: "perspective" });

// Four placements shown at once
// One tooltip per invisible anchor so all four directions can show at the same time
const anchors = document.querySelectorAll("#dPlace .anchor");
const placeTips = ["top", "right", "bottom", "left"].map((p, i) =>
  tippy(anchors[i], { content: { top: "上方", right: "右側", bottom: "下方", left: "左側" }[p], placement: p, trigger: "manual", animation: "scale" }));
const dPlace = document.getElementById("dPlace");
dPlace.addEventListener("mouseenter", () => placeTips.forEach((t) => t.show()));
dPlace.addEventListener("mouseleave", () => placeTips.forEach((t) => t.hide()));
dPlace.addEventListener("click", () => placeTips.forEach((t) => t.show()));

// Interactive click menu with real buttons inside the tooltip
const menu = document.createElement("div");
menu.className = "menu";
menu.innerHTML = `<button>📄 複製連結</button><button>✏️ 重新命名</button><button>🗂 移到資料夾</button><button style="color:#d61f69">🗑 刪除</button>`;
const menuTip = tippy("#dClick", { content: menu, trigger: "click", interactive: true, theme: "light-border", placement: "bottom", animation: "shift-away", arrow: true })[0];
menu.addEventListener("click", (e) => {
  if (e.target.tagName !== "BUTTON") return;
  menuTip.setContent(`已選擇：${e.target.textContent.slice(2)}`);
  setTimeout(() => { menuTip.hide(); setTimeout(() => menuTip.setContent(menu), 300); }, 900);
});

tippy("#dFollow", { content: "我會跟著你的滑鼠走", followCursor: true, theme: "material", animation: "scale" });

const themeTip = tippy("#dTheme", { content: "目前主題：預設", hideOnClick: false, animation: "scale" })[0];
document.getElementById("dTheme").addEventListener("click", () => {
  themeIndex = (themeIndex + 1) % THEMES.length;
  const theme = THEMES[themeIndex];
  [themeTip, ...toolTips, ...placeTips].forEach((t) => t.setProps({ theme }));
  themeTip.setContent(`目前主題：${theme || "預設"}`);
  themeTip.show();
});

// Guided tour: one interactive tooltip that walks across elements
const STEPS = [
  ["#toolbar", "工具列", "滑過每個按鈕，提示框會顯示功能與快捷鍵。", "bottom"],
  ["#doc", "名詞解釋", "虛線字也有提示，內容可以是任何 HTML。", "top"],
  [".grid", "更多玩法", "方向、互動選單、跟隨滑鼠、主題切換都在這裡。", "top"],
];
let tour = null;
function startTour(i = 0) {
  if (tour) tour.destroy();
  const [sel, title, text, placement] = STEPS[i];
  const box = document.createElement("div");
  box.className = "tour";
  const last = i === STEPS.length - 1;
  box.innerHTML = `<b>${title}</b>${text}<div class="row"><span>${i + 1} / ${STEPS.length}</span><button>${last ? "完成" : "下一步"}</button></div>`;
  box.querySelector("button").addEventListener("click", () => (last ? (tour.destroy(), (tour = null)) : startTour(i + 1)));
  tour = tippy(document.querySelector(sel), {
    content: box, interactive: true, trigger: "manual", hideOnClick: false, placement, theme: "js", animation: "shift-away", showOnCreate: true, maxWidth: 260,
  });
}
document.getElementById("tourBtn").addEventListener("click", () => startTour(0));
startTour(0);
</script>
</body>
</html>
