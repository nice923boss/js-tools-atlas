<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tippy.js@6.3.7/dist/tippy.umd.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Tippy.js showcase: seven scenes from an editor toolbar to an instance-count stress ramp.
const { h } = Showcase;
const ARROW = '<svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 2l6.5 19 2.6-7.6L20 11z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const evtLine = (el) => (name, text = "") => { el.innerHTML = `<code>${esc(name)}</code>${esc(text)}`; };
// tippy() bound to the scene: tooltips mount inside the scene element and are destroyed on unmount.
function tp(ctx, target, props) {
  const r = tippy(target, { appendTo: ctx.el, ...props });
  const list = Array.isArray(r) ? r : [r];
  ctx.onCleanup(() => list.forEach((i) => i && !i.state.isDestroyed && i.destroy()));
  return r;
}
const boxOf = (inst) => inst.popper.firstElementChild;

// ---------- robot mouse ----------
// Synthetic MouseEvents with the same enter/leave/over/out/move sequence a real mouse produces,
// so Tippy's own listeners (mouseenter, mouseleave, mouseover for delegate, mousemove for
// followCursor and interactive borders, click, mousedown for hideOnClick) do the work.
const USER = new Error("user took over");
const R = { x: -50, y: -50, el: null };
let userAt = 0;
window.addEventListener("pointerdown", (e) => { if (e.isTrusted) userAt = performance.now(); }, true);
const check = (ctx) => { if (!ctx.active || userAt > ctx.tpSince) throw USER; };
const chain = (el) => { const a = []; for (; el; el = el.parentElement) a.push(el); return a; };
const mouse = (type, el, x, y, bubbles = true) => el.dispatchEvent(new MouseEvent(type, { bubbles, cancelable: true, composed: true, view: window, clientX: x, clientY: y }));
function point(x, y) {
  R.x = x; R.y = y;
  const el = document.elementFromPoint(x, y);
  if (el !== R.el) {
    const was = chain(R.el), now = chain(el);
    if (R.el) mouse("mouseout", R.el, x, y);
    was.filter((n) => !now.includes(n)).forEach((n) => mouse("mouseleave", n, x, y, false));
    if (el) mouse("mouseover", el, x, y);
    now.filter((n) => !was.includes(n)).reverse().forEach((n) => mouse("mouseenter", n, x, y, false));
    R.el = el;
  }
  if (el) mouse("mousemove", el, x, y);
}
function ov(ctx) {
  let o = ctx.el.querySelector(".tp-ov");
  if (!o) { o = h("div", { class: "tp-ov" }); o.innerHTML = `<i>${ARROW}</i>`; ctx.el.append(o); }
  o.classList.add("on");
  const r = ctx.el.getBoundingClientRect();
  o.firstChild.style.transform = `translate(${R.x - r.left}px, ${R.y - r.top}px)`;
  return o;
}
async function moveTo(ctx, t, ms = 450, fx = 0.5, fy = 0.5) {
  let to = t;
  if (t instanceof Element) { const r = t.getBoundingClientRect(); to = [r.left + r.width * fx, r.top + r.height * fy]; }
  const from = R.x < 0 ? [to[0] - 120, to[1] + 80] : [R.x, R.y];
  const t0 = performance.now();
  for (let k = 0; k < 1;) {
    await ctx.sleep(16);
    check(ctx);
    k = Math.min(1, (performance.now() - t0) / ms);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    point(from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e);
    ov(ctx);
  }
}
async function click(ctx) {
  check(ctx);
  const o = ov(ctx), el = R.el;
  if (!el) return;
  o.classList.add("down");
  mouse("mousedown", el, R.x, R.y);
  const f = el.closest("input, textarea, button, a[href], [tabindex]");
  if (f) f.focus(); else if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  await ctx.sleep(90);
  mouse("mouseup", el, R.x, R.y); mouse("click", el, R.x, R.y);
  o.classList.remove("down");
}
function demoRunner(ctx, fn, delay = 500) {
  let busy = false;
  const go = async () => {
    if (busy) return;
    busy = true;
    ctx.tpSince = performance.now(); // a real press any time after this stops the whole run
    R.el = null; R.x = R.y = -50;
    try { await fn(); } catch (err) { if (err !== USER) throw err; } finally {
      busy = false;
      const o = ctx.el.querySelector(".tp-ov"); if (o) o.classList.remove("on", "down");
    }
  };
  ctx.timeout(go, delay);
  return go;
}

Showcase.run({ scenes: [
  {
    id: "editor", title: "編輯器提示",
    api: "tippy(targets, { content, allowHTML, theme, animation, delay, interactive, trigger: 'manual', showOnCreate })",
    desc: "一個課程編輯器上的三種提示：工具列按鈕用 data-tippy-content 寫提示並開 allowHTML 顯示快捷鍵；虛線名詞用 content 函式從 data-tip 讀解釋，套 light-border 主題；導覽框是 trigger: 'manual' 加 showOnCreate 的互動提示，內容是真的 DOM 元素，「下一步」按鈕會銷毀目前的實例再掛到下一個目標。",
    hint: "滑過工具列與虛線字・導覽框可以按「下一步」",
    mount(ctx) {
      const TOOLS = [["<b>B</b>", "粗體<kbd>Ctrl+B</kbd>"], ["<i>I</i>", "斜體<kbd>Ctrl+I</kbd>"], ["🔗", "插入連結<kbd>Ctrl+K</kbd>"], ["🖼", "插入圖片"], ["▦", "插入表格"]];
      ctx.html(`<div class="tp-wrap"><div class="tp-head"><b>課程編輯器</b><span class="tp-evt">滑過工具列與虛線字看提示</span></div>
        <div class="tp-area tp-page"><div class="tp-editor"><div class="tp-tools">${TOOLS.map(([i, t]) => `<button class="tp-tool" data-tippy-content="${esc(t)}">${i}</button>`).join("")}<button class="tp-tool tp-pub">發佈</button></div>
        <div class="tp-doc"><h2>第 3 堂：前端互動入門</h2><p>本週介紹 <abbr data-tip="Document Object Model，瀏覽器把 HTML 轉成的物件樹">DOM</abbr> 與
        <abbr data-tip="Application Programming Interface，程式之間溝通的約定">API</abbr>，滑過虛線字可以看到名詞解釋；提示內容可以是純文字、HTML 字串或 DOM 元素。</p></div>
        <div class="tp-foot">已自動儲存・字數 <b>86</b></div></div></div></div>`);
      const evt = evtLine(ctx.$(".tp-evt"));
      const say = (name) => (i) => evt(name, ` ${i.reference.textContent.trim() || "按鈕"}：${i.popper.textContent}`);
      tp(ctx, ".tp-tools [data-tippy-content]", { allowHTML: true, animation: "scale", placement: "bottom", delay: [80, 0], onShow: say("toolbar") });
      tp(ctx, ".tp-doc abbr", { content: (el) => el.dataset.tip, animation: "shift-away", theme: "light-border", maxWidth: 220, interactive: true, appendTo: ctx.el, onShow: say("glossary") });
      tp(ctx, ".tp-pub", { content: "發佈後學員會收到通知", placement: "bottom-end", animation: "perspective", onShow: say("publish") });
      const STEPS = [[".tp-tools", "工具列", "滑過每個按鈕，提示框會顯示功能與快捷鍵。", "bottom"], [".tp-doc p", "名詞解釋", "虛線字也有提示，內容可以是任何 HTML。", "bottom"], [".tp-foot", "自動儲存", "導覽框是 trigger: 'manual' 的互動提示，由程式決定何時出現。", "top"]];
      let tour = null;
      const endTour = () => { if (tour) { tour.destroy(); tour = null; } };
      const startTour = (i = 0) => {
        endTour();
        const [sel, title, text, placement] = STEPS[i], last = i === STEPS.length - 1;
        const box = h("div", { class: "tp-tour" });
        box.innerHTML = `<b>${title}</b>${text}<div><span>${i + 1} / ${STEPS.length}</span><button>${last ? "完成" : "下一步"}</button></div>`;
        box.querySelector("button").addEventListener("click", () => (last ? endTour() : startTour(i + 1)));
        tour = tp(ctx, ctx.$(sel), { content: box, interactive: true, trigger: "manual", hideOnClick: false, placement, theme: "js", animation: "shift-away", showOnCreate: true, maxWidth: 260 });
        evt("tour", ` 第 ${i + 1} 步：showOnCreate 掛在 ${sel}`);
      };
      const go = demoRunner(ctx, async () => {

        await moveTo(ctx, btns[0]); await ctx.sleep(600);
        for (const b of btns.slice(1)) { await moveTo(ctx, b, 200); await ctx.sleep(150); }
        await ctx.sleep(500);
        await moveTo(ctx, ctx.$(".tp-item"), 600); await ctx.sleep(800);
        addItem(); await ctx.sleep(300); const li = addItem();
        await moveTo(ctx, li, 500); await ctx.sleep(1200);
        await moveTo(ctx, btns[3], 700); await ctx.sleep(700);
        for (const b of btns.slice(4)) { await moveTo(ctx, b, 200); await ctx.sleep(150); }
      }, 300);
      ctx.button("自動示範", go);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "tippy(N 個元素)  對比  tippy.delegate(parent, { target })",
    desc: "放入 N 個色塊，每個都有自己的 tippy 實例，逐級加量直到掉到 30 FPS 以下。量建立與 destroy 的耗時、每個實例的平均成本、文件 DOM 節點數，並在每一幀對 12 個隨機色塊送出合成 mouseenter，量提示框掛載與 Popper 定位的同步耗時（duration 設為 0，前一批在下一幀 mouseleave 收起）。可切換成 delegate 委派比較。",
    hint: "按「自動加壓」開始・切換 delegate 比較",
    mount(ctx) {
      ctx.html(`<div class="tp-stress"></div>`);
      const box = ctx.$(".tp-stress");
      let useDelegate = false, insts = [], parent = null, n = 0, initMs = 0, killMs = 0, prev = [];
      const T = [];
      const avg = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0);
      const kill = () => {
        const t0 = performance.now();
        if (parent) { parent.destroy(); parent = null; }
        insts.forEach((i) => i.destroy());
        insts = []; prev = [];
        killMs = performance.now() - t0;
      };
      ctx.onCleanup(kill);
      const PROPS = { content: (el) => `#${el.dataset.i}`, duration: 0, delay: 0, appendTo: () => box, placement: "top" };
      const build = (count) => {
        kill(); n = count; T.length = 0;
        const W = box.clientWidth - 8, Hh = box.clientHeight - 8;
        const side = Math.max(3, Math.floor(Math.sqrt((W * Hh) / n)) - 1);
        box.style.gridTemplateColumns = `repeat(${Math.max(1, Math.floor(W / (side + 1)))}, ${side}px)`;
        box.style.gridAutoRows = `${side}px`;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < n; i++) { const d = document.createElement("div"); d.dataset.i = i; d.style.background = `hsl(${(i / n) * 300} 70% 55%)`; frag.append(d); }
        box.replaceChildren(frag);
        const t0 = performance.now();
        if (useDelegate) parent = tippy.delegate(box, { target: "[data-i]", ...PROPS });
        else insts = tippy(box.querySelectorAll("[data-i]"), PROPS);
        initMs = performance.now() - t0;
      };
      ctx.raf(() => {
        if (!n || !box.children.length) return;
        for (const el of prev) el.dispatchEvent(new MouseEvent("mouseleave", { clientX: 0, clientY: 0 }));
        prev = [];
        const t0 = performance.now();
        for (let k = 0; k < 12; k++) {
          const el = box.children[(Math.random() * n) | 0];
          if (!el || el.matches(".tippy-box, [data-tippy-root]")) continue;
          const r = el.getBoundingClientRect();
          if (useDelegate) el.dispatchEvent(new MouseEvent("mouseover", { bubbles: true, clientX: r.left + 1, clientY: r.top + 1 }));
          else el.dispatchEvent(new MouseEvent("mouseenter", { clientX: r.left + 1, clientY: r.top + 1 }));
          prev.push(el);
        }
        T.push(performance.now() - t0); if (T.length > 90) T.shift();
      });
      ctx.controls.classList.add("bottom");
      ctx.toggle("delegate 委派", useDelegate, (v) => { useDelegate = v; build(n || 100); });
      ctx.ramp({
        label: "tippy 實例", steps: [100, 500, 2000, 5000, 10000, 20000], minFps: 30,
        apply: (c) => build(c),
        metrics: () => ({
          "建立": Showcase.fmtMs(initMs), "每個實例": `${((initMs * 1000) / Math.max(1, n)).toFixed(1)} µs`, "destroy": Showcase.fmtMs(killMs),
          "顯示 12 個": Showcase.fmtMs(avg(T)), "DOM 節點": document.getElementsByTagName("*").length.toLocaleString(),
          "綁定方式": useDelegate ? "delegate" : "逐一 tippy()",
        }),
        note: "Tippy 6 在建立實例時就先做好提示框的 DOM（只是還沒掛上文件），並在每個參考元素加上 mouseenter、focus 等監聽器，所以建立耗時與記憶體隨 N 線性成長；顯示時才把提示框掛進 DOM 並建立 Popper 計算位置，成本只跟同時顯示的數量有關。delegate 只綁父層，建立是常數時間，子實例在第一次滑過時才建立。",
      });
    },
  },
] });
</script>
