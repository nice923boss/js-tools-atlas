<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toastify JS 示範：明信片小舖的通知訊息</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  .shop { position: fixed; inset: 0; display: flex; flex-direction: column; padding: 12px 14px 48px; gap: 10px; }
  .head { display: flex; align-items: center; gap: 10px; min-height: 36px; }
  .head h1 { margin: 0; font-size: 17px; }
  .cart { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; }
  .cart b { min-width: 20px; text-align: center; padding: 0 6px; border-radius: 99px; background: var(--c3); color: #fff; font-size: 12px; transition: transform .2s; }
  .cart b.pop { transform: scale(1.35); }
  .items { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .item { position: relative; display: flex; flex-direction: column; min-height: 0; border-radius: 12px; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line); }
  .item img { flex: 1; min-height: 0; width: 100%; object-fit: cover; }
  .item .row { display: flex; align-items: center; gap: 6px; padding: 7px 8px 8px 10px; }
  .item .name { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .price { font: 600 11px var(--mono); color: var(--muted); }
  .item button { border: 0; border-radius: 8px; padding: 6px 9px; background: var(--accent); color: var(--accent-ink); font: 700 12px var(--font); cursor: pointer; }
  .item button:active { transform: translateY(1px); }
  select.btn { padding: 8px 8px; }
  /* Toast looks */
  .toastify { border-radius: 12px; font: 600 13px/1.4 var(--font); padding: 11px 14px; display: flex; align-items: center; gap: 4px; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .toastify-avatar { width: 34px; height: 34px; margin: -4px 8px -4px -4px; border-radius: 8px; object-fit: cover; }
  .toastify small { display: block; font-weight: 400; opacity: .85; font-size: 11px; }
  .toast-close { opacity: .7; margin-left: 6px; font-size: 14px; }
  @media (max-width: 600px) {
    .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .item:nth-child(n+5) { display: none; }
    .head h1 { display: none; }
    .shop { padding-top: 58px; }
    .head { position: fixed; left: 14px; top: 12px; }
  }
</style>
</head>
<body>
<div class="shop">
  <div class="head">
    <h1>旅行明信片小舖</h1>
    <span class="cart">🛒 購物車 <b id="count">0</b></span>
  </div>
  <div class="items" id="items"></div>
</div>
<div class="controls">
  <select class="btn" id="pos" aria-label="通知位置">
    <option value="top|right">右上角</option>
    <option value="bottom|right">右下角</option>
    <option value="top|left">左上角</option>
    <option value="bottom|center">底部置中</option>
  </select>
  <button class="btn primary" id="checkout">結帳</button>
</div>
<div class="hint">按「加入」看通知・點通知可復原・右上可換位置</div>

<script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.js"></script>
<script>
// Toastify showcase: avatar toasts, gradients, clickable undo, close button, gravity/position switch.
const ITEMS = [
  ["峽灣", 60], ["紅岩峽谷", 60], ["山谷公路", 55], ["披毯巴哥犬", 70],
  ["瀑布彩虹", 65], ["藍色水母", 55], ["母獅特寫", 70], ["海象群", 60],
];
const GRAD = {
  ok: "linear-gradient(135deg, #2f9e55, #7bd389)",
  info: "linear-gradient(135deg, #1f8fb8, #4cc9f0)",
  warn: "linear-gradient(135deg, #e06a1b, #ffb347)",
  err: "linear-gradient(135deg, #b0124f, #f72585)",
  dark: "linear-gradient(135deg, #2a2d34, #3a3e48)",
};
let cart = [];
const countEl = document.getElementById("count");
const posEl = document.getElementById("pos");

document.getElementById("items").innerHTML = ITEMS.map(([name, price], i) => `
  <div class="item"><img src="_shared/img/photo-${i + 1}.jpg" alt="${name}">
    <div class="row"><span class="name">${name}</span><span class="price">NT$${price}</span><button data-i="${i}">加入</button></div></div>`).join("");

function toast(text, kind, extra = {}) {
  const [gravity, position] = posEl.value.split("|");
  return Toastify({
    text: `<span>${text}</span>`, gravity, position, duration: 3200, close: true, stopOnFocus: true, escapeMarkup: false,
    style: { background: GRAD[kind] }, offset: { x: 0, y: gravity === "top" && position === "right" ? 54 : 0 }, ...extra,
  }).showToast();
}

function setCount() {
  countEl.textContent = cart.length;
  countEl.classList.add("pop");
  setTimeout(() => countEl.classList.remove("pop"), 180);
}

function add(i) {
  const [name, price] = ITEMS[i];
  if (cart.filter((x) => x === i).length >= 2) {
    toast(`「${name}」每人限購 2 張<small>已達上限</small>`, "warn");
    return;
  }
  cart.push(i);
  setCount();
  const t = toast(`已加入「${name}」<small>NT$${price}・點這則通知可復原</small>`, "ok", {
    avatar: `_shared/img/photo-${i + 1}.jpg`,
    onClick() {
      const k = cart.lastIndexOf(i);
      if (k < 0) return;
      cart.splice(k, 1);
      setCount();
      t.hideToast();
      toast(`已從購物車移除「${name}」`, "dark");
    },
  });
}

document.getElementById("items").addEventListener("click", (e) => {
  if (e.target.dataset.i !== undefined) add(+e.target.dataset.i);
});

document.getElementById("checkout").addEventListener("click", () => {
  if (!cart.length) { toast("購物車是空的<small>先挑幾張明信片吧</small>", "err"); return; }
  const total = cart.reduce((s, i) => s + ITEMS[i][1], 0);
  toast(`訂單已送出，共 ${cart.length} 張<small>合計 NT$${total}，預計 3 天內寄達</small>`, "info", { duration: 4500 });
  cart = [];
  setCount();
});

posEl.addEventListener("change", () => toast(`通知位置已切換為「${posEl.selectedOptions[0].text}」`, "dark"));

// Welcome toasts so the effect is visible right away.
setTimeout(() => toast("歡迎光臨！<small>滿 3 張免運費</small>", "info", { duration: 7000 }), 200);
setTimeout(() => add(0), 700);
setTimeout(() => add(2), 1200);
</script>
</body>
</html>
