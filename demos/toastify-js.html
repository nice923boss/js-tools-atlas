<style>
  .tf-board { position: absolute; inset: 0; overflow: hidden; display: flex; gap: 10px;
    padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }
  .tf-host { position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: var(--bg-2); }
  /* Toastify positions toasts with position:fixed; the layer keeps them inside the scene host instead of the page */
  .tf-layer { position: absolute; inset: 0; pointer-events: none; overflow: hidden; isolation: isolate; }
  .tf-layer .toastify { position: absolute; pointer-events: auto; width: fit-content; max-width: min(330px, calc(100% - 30px));
    border-radius: 12px; font: 600 13px/1.4 var(--font); padding: 10px 14px; display: flex; align-items: center; gap: 4px;
    box-shadow: 0 12px 30px rgba(0,0,0,.45); }
  .tf-layer .toastify small { display: block; font-weight: 400; opacity: .85; font-size: 11px; }
  .tf-layer .toastify code { font: 11px var(--mono); opacity: .85; }
  .tf-layer .toastify-avatar { order: -1; width: 34px; height: 34px; margin: -4px 8px -4px -4px; border-radius: 8px; object-fit: cover; flex: none; }
  .tf-layer .toast-close { order: 2; opacity: .7; margin-left: 6px; font-size: 14px; flex: none; }
  .tf-layer .toastify-rounded { border-radius: 99px; padding-left: 18px; padding-right: 18px; }
  .tf-side { width: 250px; flex: none; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; overflow: hidden;
    border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  .tf-side h4 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
  .tf-log { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 4px; font: 11.5px/1.45 var(--mono); }
  .tf-log div { padding: 4px 7px; border-radius: 7px; background: rgba(255,255,255,.04); word-break: break-all; }
  .tf-log b { color: var(--c4); font-weight: 600; }
  .tf-log i { color: var(--c2); font-style: normal; }

  /* scene 1: postcard shop */
  .tf-shop { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
  .tf-shead { display: flex; align-items: center; gap: 10px; min-height: 30px; }
  .tf-shead > b { font-size: 16px; }

  .tf-cart b { min-width: 20px; text-align: center; padding: 0 6px; border-radius: 99px; background: var(--c3); color: #fff; font: 600 12px var(--mono); transition: transform .2s; }
  .tf-cart b.pop { transform: scale(1.35); }
  .tf-cart span { font: 12px var(--mono); color: var(--muted); }
  .tf-items { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .tf-item { display: flex; flex-direction: column; min-height: 0; border-radius: 12px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
  .tf-item img { flex: 1; min-height: 0; width: 100%; object-fit: cover; }
  .tf-item .row { display: flex; align-items: center; gap: 6px; padding: 7px 8px 8px 10px; }
  .tf-item .name { font-size: 13px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tf-item .price { font: 600 11px var(--mono); color: var(--muted); }
  .tf-item button { border: 0; border-radius: 8px; padding: 6px 9px; background: var(--accent); color: var(--accent-ink); font: 700 12px var(--font); cursor: pointer; }
  @media (max-width: 700px) {

    .tf-items { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }

  .tf-zones button { display: flex; flex-direction: column; gap: 3px; border: 1.5px dashed rgba(255,255,255,.14); border-radius: 10px; background: transparent;
    color: var(--muted); cursor: pointer; font: 13px var(--font); padding: 8px; }
  .tf-zones button:nth-child(-n+3) { justify-content: flex-start; } .tf-zones button:nth-child(n+4) { justify-content: flex-end; }
  .tf-zones button:nth-child(3n+1) { align-items: flex-start; } .tf-zones button:nth-child(3n+2) { align-items: center; } .tf-zones button:nth-child(3n) { align-items: flex-end; }
  .tf-zones button:hover, .tf-zones button.on { border-color: var(--c2); color: var(--c2); background: rgba(76,201,240,.06); }
  .tf-zones code { font: 11px var(--mono); opacity: .8; }

    background: rgba(0,0,0,.45); border: 1px solid var(--line); font: 12px/1.5 var(--mono); color: var(--fg); white-space: pre; overflow: hidden; pointer-events: none; }
  @media (max-width: 520px) { .tf-code { font-size: 10.5px; padding: 6px 8px; } .tf-zones button { font-size: 12px; padding: 6px; } }

  /* scene 3: styles */
  .tf-photo { background: url(_shared/img/panorama.jpg) center / cover; }
  .tf-photo::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,12,20,.15), rgba(10,12,20,.55)); }
  .tf-pre { flex: 1; min-height: 0; margin: 0; font: 11.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-all; color: var(--fg); overflow: hidden; }
  .tf-pre b { color: var(--c1); font-weight: 600; } .tf-pre i { color: var(--c4); font-style: normal; }
  .tf-layer .tf-glass { background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.4); backdrop-filter: blur(12px) saturate(1.4); -webkit-backdrop-filter: blur(12px) saturate(1.4); }
  .tf-layer .tf-note { border-left: 6px solid #ffb347; font-weight: 500; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  .tf-layer .tf-timer { overflow: hidden; padding-bottom: 13px; }
  .tf-layer .tf-timer::after { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: linear-gradient(90deg, var(--c1), var(--c5)); animation: tf-shrink 4s linear forwards; }
  @keyframes tf-shrink { from { width: 100%; } to { width: 0; } }

  /* scene 4: chat with avatar + node toasts */
  .tf-chat { display: flex; flex-direction: column; }
  .tf-chat header { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
  .tf-chat header img { width: 22px; height: 22px; border-radius: 6px; }
  .tf-chat header small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
  .tf-msgs { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 10px 14px; }
  .tf-msg { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; max-width: 70%; }
  .tf-msg img { width: 26px; height: 26px; border-radius: 7px; flex: none; }
  .tf-msg div { padding: 6px 10px; border-radius: 10px; background: rgba(255,255,255,.06); }
  .tf-msg b { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .tf-msg.sys { align-self: center; color: var(--muted); font-size: 12px; }
  .tf-tx { display: flex; flex-direction: column; min-width: 0; }
  .tf-up { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; min-width: 210px; }
  .tf-up b { font-size: 13px; }
  .tf-up span { font: 600 12px var(--mono); text-align: right; }
  .tf-up i { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  .tf-up u { display: block; height: 100%; width: 0; background: var(--c4); transition: width .2s; }
  .tf-up button, .tf-ask button { border: 1px solid rgba(255,255,255,.4); background: transparent; color: inherit; border-radius: 7px; padding: 3px 10px; font: 600 12px var(--font); cursor: pointer; }
  .tf-up button { grid-column: 1 / -1; justify-self: end; }
  .tf-ask { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tf-ask button.go { background: #fff; color: #8a1238; border-color: #fff; }

  /* scene 5: countdown bar inside the toast */
  .tf-layer .tf-cd { overflow: hidden; padding-bottom: 13px; }
  .tf-bar { position: absolute; left: 0; bottom: 0; height: 4px; width: 100%; background: rgba(255,255,255,.8); animation: tf-shrink linear forwards; }
  .tf-cd.hold .tf-bar { animation: none; width: 100%; background: var(--c1); }

  /* scene 6: mail inbox */
  .tf-mail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); }
  .tf-list { border-right: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; }
  .tf-list h5, .tf-read h5 { margin: 0; padding: 9px 12px; font-size: 13px; border-bottom: 1px solid var(--line); color: var(--muted); font-weight: 600; }
  .tf-list div { padding: 7px 12px; border-bottom: 1px solid rgba(255,255,255,.05); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tf-list div em { font: 11px var(--mono); color: var(--c2); font-style: normal; margin-right: 6px; }
  .tf-list div.on { background: rgba(76,201,240,.08); }
  .tf-read { display: flex; flex-direction: column; min-width: 0; }
  .tf-read article { padding: 12px 14px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .tf-read article b { display: block; color: var(--fg); font-size: 15px; margin-bottom: 4px; word-break: break-all; }
  .tf-read article code { font: 12px var(--mono); color: var(--c1); }
  @media (max-width: 700px) { .tf-mail { grid-template-columns: 1fr; } .tf-read { display: none; } }

  /* scene 7: two containers */
  .tf-pane { display: flex; flex-direction: column; }
  .tf-pane header { padding: 9px 14px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .tf-pane header i { width: 10px; height: 10px; border-radius: 50%; }
  .tf-pane header small { margin-left: auto; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
  .tf-pane .tf-layer { top: 41px; }
  .tf-guide { position: absolute; left: 0; right: 0; top: 56px; border-top: 1.5px dashed rgba(255,255,255,.32); }
  .tf-guide::after { content: "應有起點"; position: absolute; left: 12px; top: 3px; font-size: 11px; color: var(--muted); }

  /* scene 8: stress */
  @media (min-width: 761px) { .tf-board.tf-lab { inset: 8px 8px 8px 350px; padding: 0 0 calc(var(--sc-ctl-b, 0px) + 6px); } }
  .tf-layer .tf-s { padding: 6px 10px; font: 600 12px var(--mono); border-radius: 8px; box-shadow: none; }
</style>

<script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const IMG = (n) => `_shared/img/photo-${n}.jpg`;
const GRAD = {
  ok: "linear-gradient(135deg, #2f9e55, #7bd389)",
  info: "linear-gradient(135deg, #1f8fb8, #4cc9f0)",
  warn: "linear-gradient(135deg, #e06a1b, #ffb347)",
  err: "linear-gradient(135deg, #b0124f, #f72585)",
  dark: "linear-gradient(135deg, #2a2d34, #3a3e48)",
};

// A toast layer inside a host. Every toast created through it is removed (timer cleared) when the scene ends.
function makeLayer(ctx, host) {
  const layer = document.createElement("div");
  layer.className = "tf-layer";
  host.append(layer);
  ctx.onCleanup(() => {
    for (const el of [...layer.children]) { clearTimeout(el.timeOutValue); el.remove(); }
  });
  return layer;
}

// Toast factory bound to a layer. User callbacks only run while the scene is alive.
function toaster(ctx, layer, base = {}) {
  return (opts) => {
    const user = opts.callback;
    return Toastify({
      duration: 3200, stopOnFocus: true, escapeMarkup: false, ...base, ...opts, selector: layer,
      callback: function () { if (ctx.active && user) user.call(this); },
    }).showToast();
  };
}

function logger(box, max = 40) {
  return (html) => {
    const d = document.createElement("div");
    d.innerHTML = html;
    box.prepend(d);
    while (box.children.length > max) box.lastChild.remove();
  };
}

// Square avatar drawn on a canvas and returned as a data URL (Toastify's avatar option takes any image URL).
const avatarCache = new Map();
function avatarURL(letter, hue) {
  const key = letter + hue;
  if (avatarCache.has(key)) return avatarCache.get(key);
  const c = document.createElement("canvas");
  c.width = c.height = 72;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 72, 72);
  grd.addColorStop(0, `hsl(${hue} 80% 62%)`);
  grd.addColorStop(1, `hsl(${(hue + 40) % 360} 70% 42%)`);
  g.fillStyle = grd;
  g.fillRect(0, 0, 72, 72);
  g.fillStyle = "#fff";
  g.font = "700 34px 'Noto Sans TC', 'Microsoft JhengHei', sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(letter, 36, 39);
  const url = c.toDataURL("image/png");
  avatarCache.set(key, url);
  return url;
}

const ITEMS = [
  ["峽灣", 60], ["紅岩峽谷", 60], ["山谷公路", 55], ["披毯巴哥犬", 70],
  ["瀑布彩虹", 65], ["藍色水母", 55], ["母獅特寫", 70], ["海象群", 60],
];

Showcase.run({ scenes: [
  {
    id: "shop", title: "明信片小舖",
    api: "Toastify({ text, avatar, onClick, close, gravity, position, offset, style }).showToast()",
    desc: "加入購物車時跳出帶商品縮圖（avatar）的通知，點通知本身會觸發 onClick 把商品移出購物車並 hideToast()；同一張超過 2 張會跳警告，結帳顯示合計。通知用 offset 往下讓開標題列。",
    hint: "按「加入」看通知・點綠色通知可復原・上方切換通知位置",
    mount(ctx) {
      ctx.html(`<div class="tf-board"><div class="tf-host tf-shop">
        <div class="tf-shead"><b>旅行明信片小舖</b><span class="tf-cart">購物車 <b>0</b><span>NT$0</span></span></div>
        <div class="tf-items">${ITEMS.map(([name, price], i) => `<div class="tf-item"><img src="${IMG(i + 1)}" alt="${name}">
          <div class="row"><span class="name">${name}</span><span class="price">$${price}</span><button data-i="${i}">加入</button></div></div>`).join("")}</div>
      </div></div>`);
      const host = ctx.$(".tf-host"), countEl = ctx.$(".tf-cart b"), sumEl = ctx.$(".tf-cart span");
      const show = toaster(ctx, makeLayer(ctx, host), { close: true });
      let pos = ["top", "right"], cart = [];
      const toast = (text, kind, extra = {}) => show({
        text: `<span class="tf-tx">${text}</span>`, gravity: pos[0], position: pos[1], style: { background: GRAD[kind] },
        offset: { x: 0, y: pos[0] === "top" ? 44 : 0 }, ...extra,
      });
      const setCount = () => {
        countEl.textContent = cart.length;
        sumEl.textContent = `NT$${cart.reduce((s, i) => s + ITEMS[i][1], 0)}`;
        countEl.classList.add("pop");
        ctx.timeout(() => countEl.classList.remove("pop"), 180);
      };
      function add(i) {
        const [name, price] = ITEMS[i];
        if (cart.filter((x) => x === i).length >= 2) { toast(`「${name}」每人限購 2 張<small>已達上限，換一張看看</small>`, "warn"); return; }
        cart.push(i);
        setCount();
        const t = toast(`已加入「${name}」<small>NT$${price}・點這則通知可復原</small>`, "ok", {
          avatar: IMG(i + 1),
          onClick() {
            const k = cart.lastIndexOf(i);
            t.hideToast();
            if (k < 0) return;
            cart.splice(k, 1);
            setCount();
            toast(`已從購物車移除「${name}」`, "dark");
          },
        });
      }
      ctx.on(ctx.$(".tf-items"), "click", (e) => { const b = e.target.closest("button[data-i]"); if (b) add(+b.dataset.i); });
      const POS = [["右上角", "top", "right"], ["右下角", "bottom", "right"], ["左上角", "top", "left"], ["左下角", "bottom", "left"], ["上方置中", "top", "center"], ["底部置中", "bottom", "center"]];
      ctx.select("", POS.map(([l], i) => ({ value: i, label: `位置：${l}` })), 0, (v) => { pos = POS[+v].slice(1); toast(`通知位置改為「${POS[+v][0]}」`, "dark"); });
      ctx.button("結帳", () => {
        if (!cart.length) { toast("購物車是空的<small>先挑幾張明信片吧</small>", "err"); return; }
        const total = cart.reduce((s, i) => s + ITEMS[i][1], 0);
        toast(`訂單已送出，共 ${cart.length} 張<small>合計 NT$${total}，預計 3 天內寄達</small>`, "info", { duration: 4500 });
        cart = [];
        setCount();
      }, { primary: true });
      ctx.timeout(() => toast("歡迎光臨！<small>滿 3 張免運費</small>", "info", { duration: 7000 }), 200);
      ctx.timeout(() => add(0), 700);
      ctx.timeout(() => add(2), 1200);
    },
  },
  {
    id: "pos", title: "六個位置與 offset",
    api: "Toastify({ gravity: 'top' | 'bottom', position: 'left' | 'center' | 'right', offset: { x, y } })",
    desc: "gravity 決定貼上緣或下緣，position 決定左、中、右，組合成六個位置；offset 以 transform 再位移。原始碼的 reposition() 只分左、右兩組計算堆疊高度，置中與右側共用同一組，所以按「右側與置中混排」會看到置中通知被右側推低；視窗寬度在 360px 以下時更是六個位置共用一組，全部改成置中堆疊。",
    hint: "點六個區塊各送一則・拖滑桿調 offset・試試「右側與置中混排」",
    mount(ctx) {
      const Z = [["top", "left", "左上"], ["top", "center", "上方置中"], ["top", "right", "右上"], ["bottom", "left", "左下"], ["bottom", "center", "下方置中"], ["bottom", "right", "右下"]];
      ctx.html(`<div class="tf-board"><div class="tf-host"><div class="tf-zones">${Z.map(([g, p, l], i) =>
        `<button data-z="${i}">${l}<code>${g} / ${p}</code></button>`).join("")}</div><div class="tf-code"></div></div></div>`);
      const host = ctx.$(".tf-host"), code = ctx.$(".tf-code");
      const show = toaster(ctx, makeLayer(ctx, host), { duration: 4200 });
      const off = { x: 0, y: 0 };
      let n = 0;
      const COLORS = [GRAD.info, GRAD.ok, GRAD.err, GRAD.warn, "linear-gradient(135deg, #5b4bd6, #9d8cff)", GRAD.dark];
      function fire(i) {
        const [gravity, position, label] = Z[i];
        n++;
        show({ text: `<span class="tf-tx">#${n} ${label}<code>gravity: "${gravity}", position: "${position}"</code></span>`,
          gravity, position, offset: { ...off }, style: { background: COLORS[i] } });
        code.textContent = `Toastify({\n  gravity: "${gravity}",\n  position: "${position}",\n  offset: { x: ${off.x}, y: ${off.y} },\n}).showToast();`;
        ctx.$$(".tf-zones button").forEach((b, k) => b.classList.toggle("on", k === i));
      }
      ctx.on(ctx.$(".tf-zones"), "click", (e) => { const b = e.target.closest("button[data-z]"); if (b) fire(+b.dataset.z); });
      ctx.button("六個位置各一則", () => Z.forEach((_, i) => ctx.timeout(() => fire(i), i * 120)), { primary: true });
      ctx.button("右側與置中混排", () => [2, 2, 1].forEach((z, k) => ctx.timeout(() => fire(z), k * 200)));
      ctx.slider("offset x", { min: 0, max: 80, step: 5, value: 0, format: (v) => `${v}px` }, (v) => { off.x = v; });
      ctx.slider("offset y", { min: 0, max: 80, step: 5, value: 0, format: (v) => `${v}px` }, (v) => { off.y = v; });

  {

  {
    id: "life", title: "duration、close 與 stopOnFocus",
    api: "Toastify({ duration: 3000 | -1, close: true, stopOnFocus: true, callback })",
    desc: "duration 是自動關閉毫秒數，-1 表示常駐；close 加上關閉鈕；stopOnFocus 在滑鼠移入時 clearTimeout，移出後重新計時「完整的 duration」而不是剩餘時間，通知底部的倒數條會跟著重來。關閉後 400 ms（淡出動畫）才移除節點並呼叫 callback，右側記錄每則的存活時間。",
    hint: "滑鼠移到通知上看倒數重置・切換 close 與 stopOnFocus 再送一則",
    mount(ctx) {
      ctx.html(`<div class="tf-board"><div class="tf-host"></div><div class="tf-side"><h4>事件紀錄</h4><div class="tf-log"></div></div></div>`);

        });

  {

  {
    id: "multi", title: "多容器 selector 與排列",
    api: "Toastify({ selector: element }); Toastify.reposition = perContainer",
    desc: "selector 可以是元素，所以兩個面板各有自己的通知容器。但 1.12.0 的 Toastify.reposition() 會掃描整份文件的 .toastify 一起算堆疊高度，右邊面板的通知會被左邊的推低（虛線是應有的起點）。切到「每個容器各自排列」時改寫這個公開的靜態函式，依父容器分組，左、中、右也各自分開。",
    hint: "看右側通知的起點是否貼齊虛線・切換排列方式比較",
    mount(ctx) {
      const original = Toastify.reposition;
      ctx.onCleanup(() => { Toastify.reposition = original; });
      function perContainer() {
        const stacks = new Map();
        for (const el of document.getElementsByClassName("toastify")) {
          const grav = el.classList.contains("toastify-top") ? "top" : "bottom";
          const side = el.classList.contains("toastify-left") ? "l" : el.classList.contains("toastify-center") ? "c" : "r";
          let s = stacks.get(el.parentNode);
          if (!s) stacks.set(el.parentNode, (s = {}));
          const key = side + grav, y = s[key] ?? 15;
          el.style[grav] = `${y}px`;
          s[key] = y + el.offsetHeight + 15;
        }
        return this;
      }
      ctx.html(`<div class="tf-board">
        <div class="tf-host tf-pane"><header><i style="background:var(--c2)"></i>訂單後台<small>selector: paneA</small></header><div class="tf-guide"></div></div>

      const [a, b] = ctx.$$(".tf-pane");
      const showA = toaster(ctx, makeLayer(ctx, a), { duration: 5200, style: { background: GRAD.info } });
      const showB = toaster(ctx, makeLayer(ctx, b), { duration: 5200, style: { background: GRAD.err } });
      const ORD = ["新訂單 #1042・NT$1,280", "訂單 #1039 已出貨", "庫存低於 5 件：帆布袋", "退貨申請 #0987"];
      const CS = ["客人：請問可以改地址嗎？", "新對話來自 LINE", "客人：謝謝你們！", "3 則未回覆訊息"];

      ctx.group(["原生 reposition", "每個容器各自排列"], 0, (k) => { Toastify.reposition = k ? perContainer : original; Toastify.reposition(); });
      ctx.button("兩邊各送一則", () => { fire(0); fire(1); }, { primary: true });
      ctx.interval(() => fire(i % 2), 1300);
      ctx.timeout(() => { fire(0); fire(0); fire(1); }, 150);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "for (each frame) { oldest.remove(); Toastify({ duration: -1 }).showToast(); }",
    desc: "維持 N 則常駐通知，每格移除最舊的並 showToast() 新的一則。每次 showToast 都會呼叫 reposition() 走訪整份文件的通知、讀 offsetHeight 並改寫 top，讀寫交錯造成 N 次強制排版，所以成本隨 N 線性上升；加上 0.4 秒的 transition，所有通知都在持續動畫。",
    hint: "左側按「自動加壓」・底部切換汰換速度",
    mount(ctx) {
      ctx.html(`<div class="tf-board tf-lab"><div class="tf-host"></div></div>`);
      const host = ctx.$(".tf-host"), layer = makeLayer(ctx, host);
      const original = Toastify.reposition;
      ctx.onCleanup(() => { Toastify.reposition = original; });
      const POS = [["top", "left"], ["top", "center"], ["top", "right"], ["bottom", "left"], ["bottom", "center"], ["bottom", "right"]];
      const items = [];
      let seq = 0, target = 0, churn = 1, cost = 0, calls = 0, perSec = 0, made = 0;
      const make = () => {
        const k = seq++, [gravity, position] = POS[k % 6];
        const t0 = performance.now();
        const t = Toastify({ text: `#${k}`, duration: -1, gravity, position, selector: layer, className: "tf-s",
          style: { background: `hsl(${(k * 37) % 360} 55% 38%)` } }).showToast();
        cost += performance.now() - t0; calls++; made++;
        items.push(t.toastElement);
      };
      function apply(n) {
        target = n;
        Toastify.reposition = () => Toastify; // bulk fill: lay out once at the end
        while (items.length < n) make();
        while (items.length > n) items.shift().remove();
        Toastify.reposition = original;
        Toastify.reposition();
        cost = 0; calls = 0;
      }
      ctx.raf(() => {
        for (let i = 0; i < churn && items.length; i++) { items.shift().remove(); make(); }
      });
      ctx.interval(() => { perSec = made; made = 0; }, 1000);
      ctx.controls.classList.add("bottom");
      ctx.group(["靜止", "每格汰換 1 則", "每格汰換 4 則"], 1, (i) => { churn = [0, 1, 4][i]; cost = 0; calls = 0; });
      ctx.ramp({
        label: "常駐通知", unit: "則", steps: [10, 25, 50, 100, 200, 400, 800, 1600], minFps: 30,
        apply,
        metrics: () => ({ "平均 showToast": calls ? `${(cost / calls).toFixed(2)} ms` : "…", "每秒新增": perSec, "DOM 節點": layer.children.length }),
        note: "瓶頸是 reposition()：它對每則通知先寫 style.top 再讀下一則的 offsetHeight，N 則就強制排版 N 次。切到「靜止」只剩 CSS 動畫，FPS 會回升，可以看出成本在新增與重排，不在顯示。實務上同時顯示的通知最好控制在個位數。",
      });
      apply(10);
    },
  },
] });
