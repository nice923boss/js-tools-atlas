<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonal 示範：和弦與音階查詢器</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","needs":["audio"]}</script>
<style>
  .app {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 10px;
    padding: 14px 16px 46px; max-width: 980px; margin: 0 auto;
  }
  .app > * { flex: none; }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .seg button {
    border: 0; background: transparent; color: var(--muted); padding: 7px 16px; font: 600 14px var(--font); cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .topbar .lbl { font-size: 12px; color: var(--muted); }
  .roots { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 5px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px;
    padding: 6px 4px; font: 600 13px var(--font); cursor: pointer; white-space: nowrap; min-width: 0;
  }
  .chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .types { display: flex; flex-wrap: wrap; gap: 5px; }
  .types .chip { padding: 5px 10px; font-weight: 500; }
  .card {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center;
    padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line);
  }
  .sym { font: 700 34px/1 var(--font); letter-spacing: 0.5px; }
  .sym small { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 10px; letter-spacing: 0; }
  .eng {
    font: 12px var(--mono); color: var(--muted); grid-column: 1 / -1; margin-top: -2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .notes { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
  .pill {
    display: grid; justify-items: center; min-width: 52px; padding: 5px 8px; border-radius: 10px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line);
  }
  .pill b { font-size: 17px; }
  .pill span { font-size: 11px; color: var(--muted); }
  .pill.root { background: rgba(247, 223, 30, 0.16); border-color: rgba(247, 223, 30, 0.5); }
  .rel { display: flex; align-items: center; gap: 6px; min-height: 30px; flex-wrap: wrap; }
  .rel .t { font-size: 12px; color: var(--muted); margin-right: 2px; flex: none; white-space: nowrap; }
  .rel .chip { padding: 4px 9px; font-weight: 500; font-size: 12px; }
  .rel .chip i { font-style: normal; color: var(--muted); margin-right: 4px; font-size: 11px; }
  .app > .kb { position: relative; flex: 1 1 auto; min-height: 80px; max-height: 190px; display: flex; user-select: none; }
  .w {
    flex: 1; position: relative; border: 1px solid #2b2e35; border-top: 0; border-radius: 0 0 7px 7px;
    background: linear-gradient(#f4f2ea, #e2dfd5); cursor: pointer; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; padding-bottom: 6px; color: #222; font: 600 11px var(--font);
  }
  .b {
    position: absolute; top: 0; height: 60%; border-radius: 0 0 5px 5px; z-index: 2; cursor: pointer;
    background: linear-gradient(#2d3038, #121418); border: 1px solid #000; display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center; padding-bottom: 4px; color: #fff; font: 600 10px var(--font);
  }
  .w.on { background: linear-gradient(#bfe9ff, #4cc9f0); }
  .b.on { background: linear-gradient(#4cc9f0, #1f7fa3); }
  .w.on.root { background: linear-gradient(#fff7b0, #f7df1e); }
  .b.on.root { background: linear-gradient(#f7df1e, #b8a50f); color: #111; }
  .w.hit, .b.hit { box-shadow: 0 0 18px 4px rgba(247, 37, 133, 0.85); filter: brightness(1.15); }
  .w em, .b em { font-style: normal; font-size: 9px; opacity: 0.75; font-weight: 500; }
  @media (max-width: 620px) {
    .app { gap: 7px; padding: 10px 10px 46px; }
    .roots { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
    .chip { padding: 4px 2px; font-size: 12px; }
    .types { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .types .chip { flex: none; padding: 4px 8px; }
    .sym { font-size: 26px; }
    .sym small { font-size: 13px; margin-left: 6px; }
    .card { padding: 9px 10px; gap: 5px 8px; }
    .pill { min-width: 40px; padding: 3px 5px; }
    .pill b { font-size: 14px; }
    .pill span { font-size: 10px; }
    .rel { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; min-height: 28px; }
    .rel .chip { flex: none; }
    .topbar .lbl { display: none; }
    .w { font-size: 9px; padding-bottom: 3px; }
    .b { font-size: 8px; }
    .w em, .b em { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="seg" role="group" aria-label="查詢模式">
      <button id="mChord" aria-pressed="true">和弦</button>
      <button id="mScale" aria-pressed="false">音階</button>
    </div>
    <span class="lbl">選根音與類型，Tonal 即時算出組成音與相關和弦</span>
  </div>
  <div class="roots" id="roots"></div>
  <div class="types" id="types"></div>
  <div class="card">
    <div class="sym" id="sym"></div>
    <button class="btn primary" id="play">▶ 播放</button>
    <div class="eng" id="eng"></div>
    <div class="notes" id="notes"></div>
  </div>
  <div class="rel" id="rel"></div>
  <div class="kb" id="kb"></div>
</div>
<div class="hint">點琴鍵試聽單音，點下方相關和弦或音階可直接切換</div>

<script src="https://cdn.jsdelivr.net/npm/tonal@6.5.0/browser/tonal.min.js"></script>
<script>
// Tonal does all the music theory: chord / scale spelling, intervals, chord-scale relations, detection.
const { Chord, Scale, Note } = Tonal;

const ROOTS = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const CHORDS = [
  ["M", "", "大三和弦"], ["m", "m", "小三和弦"], ["7", "7", "屬七和弦"], ["maj7", "maj7", "大七和弦"],
  ["m7", "m7", "小七和弦"], ["dim", "dim", "減三和弦"], ["aug", "aug", "增三和弦"], ["sus4", "sus4", "掛四和弦"],
  ["m7b5", "m7b5", "半減七和弦"], ["dim7", "dim7", "減七和弦"], ["9", "9", "屬九和弦"], ["add9", "add9", "加九和弦"],
  ["6", "6", "大六和弦"],
];
const SCALES = [
  ["major", "大調"], ["minor", "自然小調"], ["harmonic minor", "和聲小調"], ["melodic minor", "旋律小調"],
  ["major pentatonic", "大調五聲"], ["minor pentatonic", "小調五聲"], ["blues", "藍調"], ["dorian", "多利安"],
  ["mixolydian", "米索利地安"], ["lydian", "利地安"], ["phrygian", "弗里吉安"], ["whole tone", "全音階"],
];
// Extra Chinese names for scales Tonal suggests in chordScales()
const SCALE_CN = Object.fromEntries([...SCALES,
  ["aeolian", "自然小調"], ["ionian", "大調"], ["minor blues", "藍調"], ["locrian", "洛克利安"],
  ["altered", "變化音階"], ["bebop", "比波普"], ["harmonic major", "和聲大調"], ["lydian dominant", "利地安屬音"],
  ["half-whole diminished", "半全減音階"], ["whole-half diminished", "全半減音階"], ["phrygian dominant", "弗里吉安屬音"],
  ["locrian #2", "洛克利安升二"], ["dorian b2", "多利安降二"], ["lydian augmented", "利地安增音"],
  ["mixolydian b6", "米索利地安降六"], ["bebop major", "比波普大調"], ["bebop minor", "比波普小調"],
  ["bebop dominant", "比波普屬音"], ["major blues", "大調藍調"], ["ionian pentatonic", "大調五聲變體"],
]);
const IV_CN = {
  "1P": "根音", "2m": "小二度", "2M": "大二度", "2A": "增二度", "3m": "小三度", "3M": "大三度", "4P": "完全四度",
  "4A": "增四度", "5d": "減五度", "5P": "完全五度", "5A": "增五度", "6m": "小六度", "6M": "大六度", "6A": "增六度",
  "7d": "減七度", "7m": "小七度", "7M": "大七度", "9M": "大九度", "8P": "八度",
};
const pretty = (n) => n.replace(/#/g, "♯").replace(/(?!^)b/g, "♭");
const sameScale = (a, b) => Scale.get("C " + a).type === Scale.get("C " + b).type;

const state = { mode: "chord", root: "C", chord: "maj7", scale: "major" };

// ---------- piano (C3..E5) ----------
const LOW = 48, HIGH = 76;
const kb = document.getElementById("kb");
const keys = new Map();
const isBlack = (m) => [1, 3, 6, 8, 10].includes(m % 12);
const whites = [];
for (let m = LOW; m <= HIGH; m++) if (!isBlack(m)) whites.push(m);
for (let m = LOW; m <= HIGH; m++) {
  const el = document.createElement("div");
  if (isBlack(m)) {
    const wi = whites.filter((w) => w < m).length;
    el.className = "b";
    el.style.left = `calc(${(wi / whites.length) * 100}% - ${(0.6 / whites.length) * 50}%)`;
    el.style.width = `${(0.6 / whites.length) * 100}%`;
  } else el.className = "w";
  el.addEventListener("pointerdown", () => { tone(m, 0, 0.9); flash(m, 0); });
  kb.append(el);
  keys.set(m, el);
}

// ---------- audio (plain Web Audio voice) ----------
let ac = null, out = null;
function audio() {
  if (ac) return ac;
  ac = new AudioContext();
  const comp = ac.createDynamicsCompressor();
  const lp = ac.createBiquadFilter();
  lp.frequency.value = 3200;
  lp.connect(comp); comp.connect(ac.destination);
  out = lp;
  return ac;
}
function tone(midi, when, dur) {
  audio();
  ac.resume();
  const t = ac.currentTime + when + 0.02, f = 440 * Math.pow(2, (midi - 69) / 12);
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.22, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.08, t + 0.35);
  g.gain.setValueAtTime(0.08, t + dur);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
  g.connect(out);
  for (const [type, mul, vol] of [["triangle", 1, 1], ["sine", 2, 0.35]]) {
    const o = ac.createOscillator(), v = ac.createGain();
    o.type = type; o.frequency.value = f * mul; v.gain.value = vol;
    o.connect(v); v.connect(g);
    o.start(t); o.stop(t + dur + 0.6);
  }
}
function flash(m, when, len = 320) {
  const el = keys.get(m);
  if (!el) return;
  setTimeout(() => { el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), len); }, when * 1000);
}

// Ascending voicing starting from the root in octave 3
function voice(notes) {
  const out = [];
  for (const n of notes) {
    let m = Note.midi(n + "3");
    while (out.length && m <= out[out.length - 1]) m += 12;
    out.push(m);
  }
  return out;
}

// ---------- UI ----------
const rootsEl = document.getElementById("roots"), typesEl = document.getElementById("types");
ROOTS.forEach((r) => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = pretty(r); b.dataset.r = r;
  b.addEventListener("click", () => { state.root = r; render(); });
  rootsEl.append(b);
});
document.getElementById("mChord").addEventListener("click", () => { state.mode = "chord"; render(); });
document.getElementById("mScale").addEventListener("click", () => { state.mode = "scale"; render(); });

function current() {
  if (state.mode === "chord") {
    const c = Chord.getChord(state.chord, state.root);
    const def = CHORDS.find((d) => d[0] === state.chord);
    return {
      title: pretty(state.root) + (def ? def[1] : state.chord), cn: `${pretty(state.root)} ${def ? def[2] : ""}`,
      eng: `Chord.getChord("${state.chord}", "${state.root}")  →  ${c.name || c.symbol}`,
      notes: c.notes, intervals: c.intervals,
    };
  }
  const s = Scale.get(`${state.root} ${state.scale}`);
  return {
    title: pretty(state.root), cn: SCALE_CN[state.scale] || state.scale,
    eng: `Scale.get("${state.root} ${state.scale}")  →  ${s.name}`,
    notes: s.notes, intervals: s.intervals,
  };
}

let midis = [];
function render() {
  const { mode } = state;
  document.getElementById("mChord").setAttribute("aria-pressed", mode === "chord");
  document.getElementById("mScale").setAttribute("aria-pressed", mode === "scale");
  const rc = Note.chroma(state.root);
  [...rootsEl.children].forEach((b) => b.setAttribute("aria-pressed", Note.chroma(b.dataset.r) === rc));

  typesEl.innerHTML = "";
  const list = mode === "chord" ? CHORDS.map((d) => [d[0], d[2]]) : SCALES;
  for (const [key, label] of list) {
    const b = document.createElement("button");
    b.className = "chip"; b.textContent = label;
    const on = mode === "chord" ? key === state.chord : sameScale(key, state.scale);
    b.setAttribute("aria-pressed", on);
    b.addEventListener("click", () => { state[mode] = key; render(); });
    typesEl.append(b);
  }

  const cur = current();
  document.getElementById("sym").innerHTML = `${cur.title}<small>${cur.cn}</small>`;
  document.getElementById("eng").textContent = cur.eng;
  document.getElementById("notes").innerHTML = cur.notes.map((n, i) =>
    `<div class="pill${i ? "" : " root"}"><b>${pretty(n)}</b><span>${IV_CN[cur.intervals[i]] || cur.intervals[i]}</span></div>`).join("");

  midis = voice(cur.notes);
  if (mode === "scale") midis.push(midis[0] + 12);
  keys.forEach((el, m) => { el.className = isBlack(m) ? "b" : "w"; el.innerHTML = ""; });
  midis.forEach((m, i) => {
    const el = keys.get(m);
    if (!el) return;
    el.classList.add("on");
    if (m % 12 === midis[0] % 12) el.classList.add("root");
    const iv = cur.intervals[i % cur.intervals.length];
    el.innerHTML = `${pretty(cur.notes[i % cur.notes.length])}<em>${iv === "1P" ? "R" : iv.replace(/[PMmdA]/, "")}</em>`;
  });
  renderRelated(cur);
}

function relChip(label, sub, onClick) {
  const b = document.createElement("button");
  b.className = "chip";
  b.innerHTML = (sub ? `<i>${sub}</i>` : "") + label;
  b.addEventListener("click", onClick);
  return b;
}

const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII"];
function renderRelated(cur) {
  const rel = document.getElementById("rel");
  rel.innerHTML = "";
  const t = document.createElement("span");
  t.className = "t";
  rel.append(t);
  if (state.mode === "chord") {
    t.textContent = "可搭配音階";
    const sym = Chord.getChord(state.chord, state.root).symbol;
    const names = Chord.chordScales(sym).filter((n) => SCALE_CN[n]).slice(0, 6);
    for (const n of names) {
      rel.append(relChip(SCALE_CN[n], pretty(state.root), () => { state.mode = "scale"; state.scale = n; render(); }));
    }
    return;
  }
  const sc = cur.notes;
  if (sc.length === 7) {
    t.textContent = "順階和弦";
    sc.forEach((n, i) => {
      const tri = [sc[i], sc[(i + 2) % 7], sc[(i + 4) % 7]];
      const sym = Chord.detect(tri)[0];
      if (!sym) return;
      const c = Chord.get(sym), type = c.aliases[0];
      let rn = ROMAN[i];
      if (c.quality === "Minor" || c.quality === "Diminished") rn = rn.toLowerCase();
      if (c.quality === "Diminished") rn += "°";
      if (c.quality === "Augmented") rn += "+";
      const def = CHORDS.find((d) => d[0] === type);
      rel.append(relChip(pretty(c.tonic) + (def ? def[1] : type), rn, () => {
        state.mode = "chord"; state.root = c.tonic; state.chord = type; render();
      }));
    });
  } else {
    t.textContent = "音階內的和弦";
    const set = new Set(sc.map(Note.chroma));
    let count = 0;
    for (const n of sc) {
      for (const [key, suffix] of CHORDS.slice(0, 8)) {
        const c = Chord.getChord(key, n);
        if (count < 9 && c.notes.every((x) => set.has(Note.chroma(x)))) {
          count++;
          rel.append(relChip(pretty(n) + suffix, "", () => {
            state.mode = "chord"; state.root = n; state.chord = key; render();
          }));
        }
      }
    }
  }
}

document.getElementById("play").addEventListener("click", () => {
  if (state.mode === "chord") {
    midis.forEach((m, i) => { tone(m, i * 0.16, 0.35); flash(m, i * 0.16, 220); });
    const blockAt = midis.length * 0.16 + 0.12;
    midis.forEach((m) => { tone(m, blockAt, 1.3); flash(m, blockAt, 1200); });
  } else {
    midis.forEach((m, i) => { tone(m, i * 0.22, 0.3); flash(m, i * 0.22, 220); });
  }
});

render();
</script>
</body>
</html>
