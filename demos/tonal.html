<script>
const { h, fmtCompact, fmtMs } = Showcase;
const { Note, Interval, Chord, ChordType, Scale, Key, Mode, Progression, RomanNumeral, Range, Voicing } = Tonal;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';

// ---------- music vocabulary (Chinese labels only; all spelling comes from Tonal) ----------
const ROOTS = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const CHORDS = [
  ["M", "", "大三和弦"], ["m", "m", "小三和弦"], ["7", "7", "屬七和弦"], ["maj7", "maj7", "大七和弦"],
  ["m7", "m7", "小七和弦"], ["dim", "dim", "減三和弦"], ["aug", "aug", "增三和弦"], ["sus4", "sus4", "掛四和弦"],
  ["m7b5", "m7b5", "半減七和弦"], ["dim7", "dim7", "減七和弦"], ["9", "9", "屬九和弦"], ["add9", "add9", "加九和弦"], ["6", "6", "大六和弦"],
];
const SCALES = [
  ["major", "大調"], ["minor", "自然小調"], ["harmonic minor", "和聲小調"], ["melodic minor", "旋律小調"],
  ["major pentatonic", "大調五聲"], ["minor pentatonic", "小調五聲"], ["blues", "藍調"], ["dorian", "多利安"],
  ["mixolydian", "米索利地安"], ["lydian", "利地安"], ["phrygian", "弗里吉安"], ["whole tone", "全音階"],
];
const SCALE_CN = Object.fromEntries([...SCALES,
  ["aeolian", "自然小調"], ["ionian", "大調"], ["minor blues", "藍調"], ["locrian", "洛克利安"], ["altered", "變化音階"],
  ["bebop", "比波普"], ["harmonic major", "和聲大調"], ["lydian dominant", "利地安屬音"], ["half-whole diminished", "半全減音階"],
  ["whole-half diminished", "全半減音階"], ["phrygian dominant", "弗里吉安屬音"], ["major blues", "大調藍調"],
  ["mixolydian b6", "米索利地安降六"], ["lydian augmented", "利地安增音"], ["bebop major", "比波普大調"], ["bebop dominant", "比波普屬音"],
]);
const IV_CN = {
  "1P": "根音", "2m": "小二度", "2M": "大二度", "2A": "增二度", "3m": "小三度", "3M": "大三度", "4P": "完全四度", "4A": "增四度",
  "5d": "減五度", "5P": "完全五度", "5A": "增五度", "6m": "小六度", "6M": "大六度", "7d": "減七度", "7m": "小七度", "7M": "大七度",
  "8P": "八度", "9m": "小九度", "9M": "大九度", "9A": "增九度", "11P": "完全十一度", "11A": "增十一度", "13M": "大十三度", "13m": "小十三度",
};
const Q_CN = { P: "完全", M: "大", m: "小", A: "增", d: "減", AA: "倍增", dd: "倍減" };
const TYPE_CN = Object.fromEntries(CHORDS.map(([k, , cn]) => [Chord.getChord(k, "C").type, cn]));
const pretty = (n) => String(n).replace(/#/g, "♯").replace(/(?!^)b/g, "♭");
const ivCn = (iv) => {
  if (IV_CN[iv]) return IV_CN[iv];
  const i = Interval.get(iv);
  return i.empty ? iv : `${Q_CN[i.q] || i.q}${i.num}度`;
};
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim() || "#888";
const chips = (host, items) => { host.replaceChildren(...items); };
function chip(label, sub, onClick, pressed) {
  const b = h("button", { class: "tl-chip", type: "button" });
  b.innerHTML = (sub ? `<i>${sub}</i>` : "") + label;
  if (pressed != null) b.setAttribute("aria-pressed", String(!!pressed));
  if (onClick) b.addEventListener("click", onClick);
  return b;
}
// Pitch classes -> ascending MIDI numbers starting in the given octave.
function stack(notes, oct = 3) {
  const out = [];
  for (const n of notes) {
    let m = Note.midi(Note.pitchClass(n) + oct);
    while (out.length && m <= out[out.length - 1]) m += 12;
    out.push(m);
  }
  return out;
}

// ---------- audio: plain Web Audio voices (Tonal itself has no sound) ----------
let AC = null, master = null;
function audio() {
  if (!AC) {
    AC = new AudioContext();
    const lp = AC.createBiquadFilter(); lp.frequency.value = 3600;
    const comp = AC.createDynamicsCompressor();
    const an = AC.createAnalyser(); an.fftSize = 1024;
    lp.connect(comp); comp.connect(an); an.connect(AC.destination);
    master = lp;
  }
  if (AC.state !== "running") AC.resume();
  return AC;
}
// Every scene plays through its own bus; unmounting silences and disconnects it.
function sceneBus(ctx) {
  let bus = null;
  ctx.onCleanup(() => { if (bus) { bus.gain.value = 0; bus.disconnect(); bus = null; } });
  return () => { audio(); if (!bus) { bus = AC.createGain(); bus.connect(master); } return bus; };
}
function tone(dest, midi, when = 0, dur = 0.4, vel = 0.2) {
  const t = AC.currentTime + when + 0.02, f = 440 * Math.pow(2, (midi - 69) / 12);
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vel, t + 0.012);
  g.gain.exponentialRampToValueAtTime(vel * 0.4, t + 0.35);
  g.gain.setValueAtTime(vel * 0.4, t + Math.max(dur, 0.36));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.5);
  g.connect(dest);
  for (const [type, mul, vol] of [["triangle", 1, 1], ["sine", 2, 0.35]]) {
    const o = AC.createOscillator(), v = AC.createGain();
    o.type = type; o.frequency.value = f * mul; v.gain.value = vol;
    o.connect(v); v.connect(g);
    o.start(t); o.stop(t + dur + 0.6);
  }
}

// ---------- DOM piano ----------
const isBlack = (m) => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
function piano(ctx, host, lo, hi, onDown) {
  host.classList.add("tl-kb");
  const whites = [];
  for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
  const keys = new Map();
  for (let m = lo; m <= hi; m++) {
    const el = h("div", { class: isBlack(m) ? "tl-b" : "tl-w" });
    if (isBlack(m)) {
      const wi = whites.filter((w) => w < m).length;
      el.style.left = `calc(${(wi / whites.length) * 100}% - ${(0.3 / whites.length) * 100}%)`;
      el.style.width = `${(0.6 / whites.length) * 100}%`;
    }
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); onDown && onDown(m); });
    host.append(el);
    keys.set(m, el);
  }
  return {
    paint(marks) {
      keys.forEach((el, m) => {
        const k = marks.get(m);
        el.className = (isBlack(m) ? "tl-b" : "tl-w") + (k ? ` ${k.cls}` : "");
        el.innerHTML = (k && k.html) || "";
      });
    },
    flash(m, delay = 0, len = 300) {
      const el = keys.get(m);
      if (!el) return;
      ctx.timeout(() => { el.classList.add("hit"); ctx.timeout(() => el.classList.remove("hit"), len); }, delay * 1000);
    },
  };
}

// ---------- canvas helper ----------
function view(ctx, host, draw) {
  const cv = h("canvas");
  host.append(cv);
  const g = cv.getContext("2d");
  const v = { cv, g, w: 0, h: 0, draw: () => draw(v) };
  const fit = () => {
    const r = host.getBoundingClientRect();
    v.w = Math.max(1, r.width); v.h = Math.max(1, r.height);
    cv.width = Math.round(v.w * DPR); cv.height = Math.round(v.h * DPR);
    cv.style.width = v.w + "px"; cv.style.height = v.h + "px";
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw(v);
  };
  const ro = new ResizeObserver(fit);
  ro.observe(host);
  ctx.onCleanup(() => ro.disconnect());
  fit();
  return v;
}
function txt(g, s, x, y, color = "#e8e6e3", size = 12, align = "left", mono = false, weight = 500) {
  g.font = `${weight} ${size}px ${mono ? MONO : CJK}`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle";
  g.fillText(s, x, y);
}

Showcase.run({
  scenes: [
    // 1 --------------------------------------------------------------------------------------
    {
      id: "lookup", title: "和弦音階查詢",
      api: "Chord.getChord・Scale.get・Chord.chordScales・Chord.detect",
      desc: "選根音與類型，Tonal 拼出組成音與音程；和弦模式列出可搭配的音階，音階模式列出順階和弦。",
      hint: "點琴鍵試聽單音；點下方相關和弦或音階可直接切換；按「▶ 播放」聽琶音與柱式和弦。",
      mount(ctx) {
        ctx.html(`<div class="tl-board tl-look"><div class="tl-roots"></div><div class="tl-types"></div>
          <div class="tl-card"><div class="tl-sym"></div><div class="tl-api"></div><div class="tl-notes"></div></div>
          <div class="tl-rel"></div><div class="kb"></div></div>`);
        const out = sceneBus(ctx);
        const st = { mode: "chord", root: "C", chord: "maj7", scale: "major" };
        let midis = [];
        const kb = piano(ctx, ctx.$(".kb"), 48, 76, (m) => { tone(out(), m, 0, 0.8); kb.flash(m); });
        const seg = ctx.group(["和弦", "音階"], 0, (i) => { st.mode = i ? "scale" : "chord"; render(); });
        ctx.button("▶ 播放", () => {
          const b = out();
          if (st.mode === "chord") {
            midis.forEach((m, i) => { tone(b, m, i * 0.16, 0.3); kb.flash(m, i * 0.16, 220); });
            const at = midis.length * 0.16 + 0.12;

          const voicings = syms.map((s, i) => {
            const v = vs[i] && vs[i].length ? vs[i].map(Note.midi) : stack(Chord.get(s).notes, 3);
            return { v, auto: !!(vs[i] && vs[i].length) };
          });
          prog = rns.map((rn, i) => ({ rn, sym: syms[i], ...voicings[i], bass: Note.midi(Note.pitchClass(Chord.get(syms[i]).tonic || st.key) + "2"), info: RomanNumeral.get(rn) }));
          ctx.$(".tl-papi").textContent = `Progression.fromRomanNumerals("${st.key}", ${JSON.stringify(rns)}) → ${JSON.stringify(syms)}`;
          const cards = prog.map((c, i) => {
            const el = h("button", { class: "tl-pc", type: "button" });
            el.innerHTML = `<i>${pretty(c.rn)}</i><b>${pretty(c.sym)}</b><span>${c.v.map((m) => pretty(Note.pitchClass(Note.fromMidi(m)))).join(" ")}</span>`;
            el.title = `RomanNumeral.get("${c.rn}") → 音程 ${c.info.interval}・和弦類型 ${c.info.chordType || "M"}${c.auto ? "" : "（字典無此和弦，改用基本排列）"}`;
            el.addEventListener("click", () => { strike(c, 0, out()); st.cur = i; mark(); });
            return el;
          });
          ctx.$(".tl-prog").replaceChildren(...cards);
          st.cur = -1; mark(); roll.draw();
        }
        function strike(c, when, dest) {
          tone(dest, c.bass, when, DUR * 0.9, 0.17);
          c.v.forEach((m) => tone(dest, m, when, DUR * 0.85, 0.12));
        }
        function mark() { [...ctx.$(".tl-prog").children].forEach((el, i) => el.classList.toggle("now", i === st.cur)); }
        function start() {
          audio();
          take = AC.createGain(); take.connect(out());
          st.playing = true; pb.textContent = "■ 停止";
          t0 = AC.currentTime + 0.08; next = 0;
        }
        function stop() {
          st.playing = false; pb.textContent = "▶ 播放";
          if (take) { take.gain.value = 0; take.disconnect(); take = null; }
          st.cur = -1; mark(); roll.draw();
        }
        ctx.onCleanup(() => { if (take) take.disconnect(); });
        // Look-ahead scheduler: queue chords 0.3 s ahead of the audio clock.
        ctx.interval(() => {
          if (!st.playing) return;
          while (t0 + next * DUR < AC.currentTime + 0.3) {
            strike(prog[next % prog.length], t0 + next * DUR - AC.currentTime, take);
            next++;
          }
        }, 60);
        const roll = view(ctx, ctx.$(".tl-roll"), (v) => {
          const { g, w, h: hh } = v;
          g.clearRect(0, 0, w, hh);
          if (!prog) return;
          const all = prog.flatMap((c) => c.v), lo = Math.min(...all) - 2, hi = Math.max(...all) + 2;
          const n = prog.length, pad = 26, cw = (w - pad - 8) / n, y = (m) => 34 + ((hi - m) / (hi - lo)) * (hh - 46);
          for (let m = lo; m <= hi; m++) if (m % 12 === 0) { g.fillStyle = "rgba(255,255,255,.07)"; g.fillRect(pad, y(m) - 0.5, w - pad - 8, 1); txt(g, Note.fromMidi(m), 4, y(m), "#7d8490", 9.5, "left", true); }
          const cols = ["#f7df1e", "#4cc9f0", "#06d6a0", "#f72585", "#9d8cff"];
          const voices = Math.max(...prog.map((c) => c.v.length));
          for (let k = 0; k < voices; k++) {
            g.strokeStyle = cols[k % cols.length]; g.globalAlpha = 0.5; g.lineWidth = 1.5; g.beginPath();
            prog.forEach((c, i) => { const m = c.v[Math.min(k, c.v.length - 1)]; const x = pad + i * cw + cw * 0.85, xn = pad + (i + 1) * cw + cw * 0.15; if (i) g.lineTo(pad + i * cw + cw * 0.15, y(m)); else g.moveTo(pad + cw * 0.15, y(m)); g.lineTo(x, y(m)); if (i < n - 1) { const mn = prog[i + 1].v[Math.min(k, prog[i + 1].v.length - 1)]; g.lineTo(xn, y(mn)); } });
            g.stroke(); g.globalAlpha = 1;
          }
          prog.forEach((c, i) => {
            const on = i === st.cur;
            c.v.forEach((m, k) => { g.fillStyle = on ? "#fff" : cols[k % cols.length]; g.fillRect(pad + i * cw + cw * 0.15, y(m) - 3, cw * 0.7, 6); });
            txt(g, pretty(c.sym), pad + i * cw + cw / 2, 14, on ? "#f7df1e" : "#a8b0bd", Math.min(12, cw * 0.28), "center", false, 600);
          });
          if (st.playing && AC) {
            const pos = ((AC.currentTime - t0) / DUR) % n;
            if (pos >= 0) { g.fillStyle = "rgba(247,223,30,.8)"; g.fillRect(pad + pos * cw, 26, 2, hh - 30); }
          }
        });
        ctx.raf(() => {
          if (!st.playing) return;
          const i = Math.floor(Math.max(0, AC.currentTime - t0) / DUR) % prog.length;
          if (i !== st.cur) { st.cur = i; mark(); }
          roll.draw();
        });
        build();
      },
    },
    // 6 --------------------------------------------------------------------------------------
    {
      id: "interval", title: "音程計算",
      api: "Interval.distance・Interval.get・invert・simplify・Note.freq・Range.chromatic",
      desc: "在琴鍵上點兩個音，Interval 算出音程名稱、半音數、轉位與化簡；Note.freq 給出頻率比，右側用李薩如圖形畫出這個比例。",
      hint: "琴鍵輪流設定第一音（黃）與第二音（粉）；下方晶片從第一音往上疊常見音程，點了直接換成第二音。",
      mount(ctx) {
        ctx.html(`<div class="tl-board tl-ivwrap"><div class="tl-iv"><div class="tl-box"><div class="tl-big tl-ivname"></div><div class="tl-api tl-ivapi"></div><div class="tl-facts"></div><div class="tl-cap tl-range"></div></div><div class="tl-cv tl-liss"></div></div><div class="tl-list tl-ups"></div><div class="kb"></div></div>`);
        const out = sceneBus(ctx);
        const st = { a: 60, b: 67, turn: 0 };
        const kb = piano(ctx, ctx.$(".kb"), 48, 84, (m) => {
          if (st.turn === 0) st.a = m; else st.b = m;
          st.turn ^= 1; tone(out(), m, 0, 0.6); render();
        });
        ctx.button("▶ 播放", () => {
          const b = out();
          tone(b, st.a, 0, 0.5); tone(b, st.b, 0.55, 0.5); tone(b, st.a, 1.15, 1.2, 0.14); tone(b, st.b, 1.15, 1.2, 0.14);
          kb.flash(st.a, 0, 400); kb.flash(st.b, 0.55, 400); kb.flash(st.a, 1.15, 1000); kb.flash(st.b, 1.15, 1000);
        }, { primary: true });
        ctx.button("交換", () => { [st.a, st.b] = [st.b, st.a]; render(); });
        const liss = view(ctx, ctx.$(".tl-liss"), (v) => {
          const { g, w, h: hh } = v;
          g.clearRect(0, 0, w, hh);
          const fa = Note.freq(Note.fromMidi(st.a)), fb = Note.freq(Note.fromMidi(st.b));
          const lo = Math.min(fa, fb), r = Math.max(fa, fb) / lo;
          const cx = w / 2, cy = hh / 2 + 8, R = Math.min(w, hh - 30) / 2 - 10;
          g.strokeStyle = "#4cc9f0"; g.lineWidth = 1.4; g.globalAlpha = 0.9; g.beginPath();
          const N = 2400, turns = 12;
          for (let i = 0; i <= N; i++) { const t = (i / N) * Math.PI * 2 * turns; const x = cx + Math.sin(t + Math.PI / 4) * R, y = cy + Math.sin(t * r) * R; i ? g.lineTo(x, y) : g.moveTo(x, y); }
          g.stroke(); g.globalAlpha = 1;
          txt(g, `頻率比 ${r.toFixed(4)}`, 10, 14, "#e8e6e3", 12, "left", false, 600);
          txt(g, "李薩如圖形：比例越接近簡單整數比，圖形越穩定", 10, hh - 10, "#7d8490", 10.5);
        });
        function render() {
          const A = Note.fromMidi(st.a), B = Note.fromMidi(st.b);
          const ivn = Interval.distance(A, B), iv = Interval.get(ivn);
          const fa = Note.freq(A), fb = Note.freq(B), cents = 1200 * Math.log2(fb / fa);
          ctx.$(".tl-ivname").innerHTML = `${ivCn(Interval.simplify(ivn).replace(/^-/, ""))}<small>${pretty(A)} → ${pretty(B)}・${ivn}${iv.dir < 0 ? "（下行）" : ""}${Math.abs(iv.num) > 8 ? `・複音程 ${ivCn(ivn.replace(/^-/, ""))}` : ""}</small>`;
          ctx.$(".tl-ivapi").textContent = `Interval.distance("${A}", "${B}") → "${ivn}"`;
          const facts = [["半音數", `${iv.semitones}`], ["性質", Q_CN[iv.q] || iv.q], ["度數", `${Math.abs(iv.num)} 度`], ["轉位 invert", Interval.invert(Interval.simplify(ivn))], ["化簡 simplify", Interval.simplify(ivn)], ["音分差", `${cents.toFixed(0)} ¢`]];
          ctx.$(".tl-facts").replaceChildren(...facts.map(([k, x]) => h("div", {}, h("small", { text: k }), h("b", { class: "tl-m", text: x }))));
          const rng = Range.chromatic([A, B]);
          ctx.$(".tl-range").textContent = `Range.chromatic 共 ${rng.length} 個音：${rng.slice(0, 14).map(pretty).join(" ")}${rng.length > 14 ? " …" : ""}`;
          const UPS = ["2m", "2M", "3m", "3M", "4P", "4A", "5P", "6m", "6M", "7m", "7M", "8P"];
          chips(ctx.$(".tl-ups"), [h("span", { class: "tl-cap", text: `Note.transpose("${A}", …)` }), ...UPS.map((u) => {
            const n = Note.transpose(A, u);
            return chip(pretty(n), u, () => { const m = Note.midi(n); if (m != null && m <= 84) { st.b = m; st.turn = 0; tone(out(), m, 0, 0.6); render(); } }, Note.midi(n) === st.b);
          })]);
          kb.paint(new Map([[st.a, { cls: "on root", html: "1" }], [st.b, { cls: "on alt", html: "2" }]]));
          liss.draw();
        }
        render();
      },
    },
    // 7 --------------------------------------------------------------------------------------
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "Chord.detect・Scale.detect・Chord.get × N",
      desc: "產生 N 組隨機音集合或和弦代號，量測 Tonal 純 JavaScript 樂理運算的吞吐量；右側統計最後一輪辨識出的和弦類型分布。",
      hint: "先選要量哪個函式再按「開始測試」；滑鼠停在結果列上可看每秒次數與記憶體變化。",
      mount(ctx) {
        ctx.html(`<div class="tl-bv"><div class="tl-cv" style="position:absolute;inset:0;border:0"></div></div>`);
        ctx.controls.classList.add("bottom");
        const OPS = ["Chord.detect", "Scale.detect", "Chord.get 解析"];
        let op = 0, last = null;
        ctx.group(OPS, 0, (i) => { op = i; });
        const symbols = ChordType.all().flatMap((t) => t.aliases.slice(0, 1));
        const pcs = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
        const pick = (k) => { const a = pcs.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a.slice(0, k); };
        const v = view(ctx, ctx.$(".tl-bv > .tl-cv"), (v) => {
          const { g, w, h: hh } = v;
          g.clearRect(0, 0, w, hh);
          if (!last) {
            txt(g, "尚未測試：按「開始測試」後，這裡統計最後一輪的結果分布", 14, 20, "#7d8490", 12);
            const demo = [["C", "E", "G"], ["D", "F#", "A", "C"], ["E", "G", "B", "D"], ["F", "A", "C", "E"], ["B", "D", "F", "Ab"]];
            demo.forEach((s, i) => txt(g, `Chord.detect(${JSON.stringify(s)}) → ${JSON.stringify(Chord.detect(s))}`, 14, 52 + i * 22, "#a8b0bd", 11.5, "left", true));
            return;
          }
          txt(g, `${last.op}・${fmtCompact(last.n)} 次・${fmtMs(last.ms)}・每秒約 ${fmtCompact(last.n / (last.ms / 1000))} 次`, 14, 18, "#e8e6e3", 12.5, "left", false, 600);
          txt(g, `有結果 ${((last.hit / last.n) * 100).toFixed(1)}%・最常見的結果${last.op === "Chord.detect" ? "（Chord.tokenize 取出的和弦類型代號）" : ""}：`, 14, 40, "#7d8490", 11.5);
          const top = [...last.hist.entries()].sort((a, b) => b[1] - a[1]).slice(0, Math.max(4, Math.floor((hh - 70) / 20)));
          const max = top.length ? top[0][1] : 1, bx = Math.min(170, w * 0.36);
          top.forEach(([k, c], i) => {
            const y = 62 + i * 20;
            txt(g, k, bx - 8, y, "#a8b0bd", 11, "right", true);
            g.fillStyle = `hsl(${190 + i * 9} 80% 60%)`;
            g.fillRect(bx, y - 6, Math.max(2, ((w - bx - 70) * c) / max), 12);
            txt(g, fmtCompact(c), bx + Math.max(2, ((w - bx - 70) * c) / max) + 6, y, "#e8e6e3", 10.5, "left", true);
          });
        });
        ctx.bench({
          label: "運算次數", unit: "次", sizes: [1000, 5000, 20000, 50000, 100000, 250000], target: 1000, budget: 3000,
          title: "極限測試：Tonal 樂理運算吞吐量",
          note: "計時只含函式呼叫本身（輸入在 prepare 階段先產生）。Chord.detect 會比對約百種和弦類型，Scale.detect 比對約九十種音階，Chord.get 只解析代號字串。",
          prepare: (n) => {
            const data = new Array(n);
            for (let i = 0; i < n; i++) data[i] = op === 2 ? pcs[i % 12] + symbols[(i * 7) % symbols.length] : pick(3 + (i % 3));
            return data;
          },
          run: (n, data) => {
            const hist = new Map(), name = OPS[op];
            let hit = 0;
            const t = performance.now();
            for (let i = 0; i < n; i++) {
              let r;
              if (op === 0) { const x = Chord.detect(data[i]); r = x.length ? Chord.tokenize(x[0])[1] || "M" : ""; }
              else if (op === 1) { const x = Scale.detect(data[i]); r = x.length ? Scale.get(x[0]).type : ""; }
              else { const c = Chord.get(data[i]); r = c.empty ? "" : c.quality || "?"; }
              if (r) { hit++; hist.set(r, (hist.get(r) || 0) + 1); }
            }
            last = { op: name, n, ms: performance.now() - t, hit, hist };
            v.draw();
            return `有結果 ${((hit / n) * 100).toFixed(0)}%`;
          },
        });
      },
    },
  ],
});
</script>
</body>
</html>
