<script>
const { h, fmtMs } = Showcase;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';

// ---------- audio plumbing ----------
// Tone.js builds its real context while the script loads; keep a handle so live code never
// touches the global context, which Tone.Offline swaps to an OfflineContext during a render.
const live = Tone.getContext();
let queue = Promise.resolve();
function enqueue(job) { const p = queue.then(job); queue = p.catch(() => {}); return p; }
// Renders are serialised because Tone.Offline replaces and restores the global context.
function render(ctx, cb, dur, ch = 2, sr) {
  return enqueue(() => (ctx.active ? Tone.Offline(cb, dur, ch, sr) : null)).catch((e) => {
    console.error("[tone] Offline render failed", e);
    if (ctx.active) ctx.status("").error(`離線渲染失敗：${e.message}`);
    return null;
  });
}
// Live nodes are created inside the queue too, so the global context is the real one.
function withLive(ctx, fn) {
  const resumed = live.resume();
  return enqueue(async () => { await resumed; if (ctx.active) fn(); }).catch((e) => {
    console.error("[tone] live audio failed", e);
    if (ctx.active) ctx.status("").error(`音訊啟動失敗：${e.message}`);
  });
}
// Every node a scene creates is disposed on unmount; the shared Transport is reset.
function rig(ctx) {
  const nodes = [];
  ctx.onCleanup(() => {
    const tr = live.transport;
    tr.stop(); tr.cancel(0); tr.loop = false; tr.swing = 0; tr.bpm.value = 120; tr.position = 0;
    live.draw.cancel(0);
    nodes.splice(0).reverse().forEach((n) => n.dispose());
  });
  return (...ns) => { nodes.push(...ns); return ns[0]; };
}
function monitor(own, size = 1024) {
  const bus = own(new Tone.Gain(1)).toDestination();
  const wave = own(new Tone.Waveform(size)), fft = own(new Tone.FFT(size));
  bus.connect(wave); bus.connect(fft);
  return { bus, wave, fft };
}
function debounce(ctx, fn, ms) {
  let t = 0;
  ctx.onCleanup(() => clearTimeout(t));
  return () => { clearTimeout(t); t = setTimeout(() => ctx.active && fn(), ms); };
}
const midiNote = (m) => Tone.Frequency(m, "midi").toNote();
const toDb = (v) => 20 * Math.log10(Math.max(v, 1e-6));
const fmtDb = (v) => { const d = toDb(v); return d <= -100 ? "−∞ dB" : `${d < 0 ? "−" : ""}${Math.abs(d).toFixed(1)} dB`; };
function stats(s) { let pk = 0, sum = 0; for (let i = 0; i < s.length; i++) { const a = Math.abs(s[i]); if (a > pk) pk = a; sum += s[i] * s[i]; } return { peak: pk, rms: Math.sqrt(sum / Math.max(1, s.length)) }; }

// ---------- drawing ----------
function sizeCanvas(cv, el) {
  const w = Math.max(1, el.clientWidth), hh = Math.max(1, el.clientHeight);
  const pw = Math.round(w * DPR), ph = Math.round(hh * DPR);
  if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; }
  cv.style.width = w + "px"; cv.style.height = hh + "px";
  const g = cv.getContext("2d");
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  return { g, w, h: hh };
}
function watch(ctx, el, fn) {
  const ro = new ResizeObserver(() => ctx.active && fn());
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
}
function view(ctx, el, onfit) {
  const cv = h("canvas");
  el.append(cv);
  const v = { cv, g: null, w: 1, h: 1 };
  const fit = () => { Object.assign(v, sizeCanvas(cv, el)); if (onfit) onfit(v); };
  fit(); watch(ctx, el, fit);
  return v;
}
function waveFill(g, x, w) {
  const gr = g.createLinearGradient(x, 0, x + w, 0);
  gr.addColorStop(0, "#4cc9f0"); gr.addColorStop(0.55, "#9d8cff"); gr.addColorStop(1, "#f72585");
  return gr;
}
// Long buffers: min/max per pixel column. Short windows: a polyline.
function drawWave(g, s, x, y, w, hh, color, from = 0, to = s.length, gain = 1) {
  const n = to - from, mid = y + hh / 2, amp = (hh / 2) * 0.92, cols = Math.max(1, Math.floor(w));
  if (n <= 1 || w < 1) return;
  const c = (v) => Math.max(-1, Math.min(1, v * gain));
  g.strokeStyle = g.fillStyle = color || waveFill(g, x, w);
  if (n <= cols * 2) {
    g.lineWidth = 1.4; g.lineJoin = "round"; g.beginPath();
    for (let i = 0; i < n; i++) { const px = x + (i / (n - 1)) * w, py = mid - c(s[from + i]) * amp; i ? g.lineTo(px, py) : g.moveTo(px, py); }
    g.stroke();
    return;
  }
  const step = n / cols;
  for (let k = 0; k < cols; k++) {
    let lo = 1, hi = -1;
    const a = from + Math.floor(k * step), b = Math.min(to, from + Math.floor((k + 1) * step));
    for (let i = a; i < b; i++) { const v = s[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (hi < lo) continue;
    g.fillRect(x + k, mid - c(hi) * amp, 1, Math.max(1, (c(hi) - c(lo)) * amp));
  }
}
const F_LO = Math.log(30), F_HI = Math.log(16000);
const fx2px = (f, x, w) => x + ((Math.log(f) - F_LO) / (F_HI - F_LO)) * w;
function drawSpec(g, fft, x, y, w, hh, color) {
  const v = fft.getValue();
  g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1;
  for (const f of [100, 1000, 10000]) { const px = fx2px(f, x, w); g.beginPath(); g.moveTo(px, y); g.lineTo(px, y + hh); g.stroke(); txt(g, f >= 1000 ? `${f / 1000}k` : String(f), px + 3, y + hh - 13, "#5d6470", true); }
  g.beginPath(); g.moveTo(x, y + hh);
  for (let i = 1; i < v.length; i++) {
    const f = fft.getFrequencyOfIndex(i);
    if (f < 30 || f > 16000) continue;
    const db = Math.max(-100, Math.min(0, v[i]));
    g.lineTo(fx2px(f, x, w), y + hh * (-db / 100));
  }
  g.lineTo(x + w, y + hh); g.closePath();
  g.fillStyle = color + "33"; g.fill();
  g.strokeStyle = color; g.lineWidth = 1.3; g.stroke();
}
function txt(g, s, x, y, color = "#9aa0aa", mono = false, align = "left", size = 11) {
  g.font = `${size}px ${mono ? MONO : CJK}`; g.textAlign = align; g.textBaseline = "top"; g.fillStyle = color;
  g.fillText(s, x, y);
}
function lane(g, x, y, w, hh) {
  g.fillStyle = "rgba(255,255,255,.025)"; g.fillRect(x, y, w, hh);
  g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(x, y + hh / 2, w, 1);
}

// ---------- 1. sequencer kit (from the original demo) ----------
const ROWS = [["G5", "#9d8cff"], ["E5", "#8fa2ff"], ["D5", "#6fb8ff"], ["C5", "#4cc9f0"], ["A4", "#45d6c4"], ["踏鈸", "#f7df1e"], ["小鼓", "#ff8c42"], ["大鼓", "#f72585"]];
const SEQ_DEF = { 0: [10], 1: [3, 8, 14], 2: [6, 12], 3: [2, 11], 4: [0, 5, 15], 5: [0, 2, 4, 6, 8, 10, 12, 13, 14], 6: [4, 12], 7: [0, 3, 8, 10] };
const STEPS = [...Array(16).keys()];
function buildKit(out) {
  const verb = new Tone.Reverb({ decay: 2.4, wet: 0.25 }).connect(out);
  const delay = new Tone.FeedbackDelay({ delayTime: "8n.", feedback: 0.32, wet: 0.25 }).connect(verb);
  const lp = new Tone.Filter(2400, "lowpass").connect(delay);
  const lead = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 3, spread: 18 }, envelope: { attack: 0.005, decay: 0.18, sustain: 0.15, release: 0.5 }, volume: -14 }).connect(lp);
  const kick = new Tone.MembraneSynth({ pitchDecay: 0.04, octaves: 6, volume: -4 }).connect(out);
  const hp = new Tone.Filter(1800, "highpass").connect(out);
  const snare = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.16, sustain: 0 }, volume: -12 }).connect(hp);
  const hat = new Tone.MetalSynth({ envelope: { attack: 0.001, decay: 0.05, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 5000, octaves: 1.5, volume: -26 }).connect(out);
  const play = (r, t) => {
    if (r < 5) lead.triggerAttackRelease(ROWS[r][0], "16n", t);
    else if (r === 5) hat.triggerAttackRelease(300, "32n", t, 0.6);
    else if (r === 6) snare.triggerAttackRelease("16n", t);
    else kick.triggerAttackRelease("C1", "8n", t);
  };
  return { play, ready: verb.ready, nodes: [verb, delay, lp, lead, kick, hp, snare, hat] };
}

// ---------- 2. synth family ----------
const FAMILY = [
  { name: "Synth", zh: "基本", color: "#4cc9f0", spec: "oscillator: triangle8", make: () => new Tone.Synth({ oscillator: { type: "triangle8" }, envelope: { release: 0.3 } }), fire: (s, t) => s.triggerAttackRelease("C4", 0.3, t) },
  { name: "AMSynth", zh: "振幅調變", color: "#9d8cff", spec: "harmonicity: 2.5", make: () => new Tone.AMSynth({ harmonicity: 2.5, envelope: { release: 0.3 } }), fire: (s, t) => s.triggerAttackRelease("C4", 0.3, t) },
  { name: "FMSynth", zh: "頻率調變", color: "#f72585", spec: "modulationIndex: 12", make: () => new Tone.FMSynth({ harmonicity: 3, modulationIndex: 12, envelope: { release: 0.3 } }), fire: (s, t) => s.triggerAttackRelease("C3", 0.3, t) },
  { name: "MonoSynth", zh: "濾波包絡", color: "#f7df1e", spec: "filterEnvelope: 4 oct", make: () => new Tone.MonoSynth({ oscillator: { type: "sawtooth" }, filter: { Q: 4 }, envelope: { release: 0.25 }, filterEnvelope: { attack: 0.01, decay: 0.25, sustain: 0.2, baseFrequency: 120, octaves: 4 } }), fire: (s, t) => s.triggerAttackRelease("C2", 0.35, t) },
  { name: "MembraneSynth", zh: "鼓皮", color: "#ff8c42", spec: "pitchDecay: 0.05", make: () => new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 6, envelope: { decay: 0.5, sustain: 0, release: 0.2 }, volume: -4 }), fire: (s, t) => s.triggerAttackRelease("C1", 0.4, t) },
  { name: "MetalSynth", zh: "金屬", color: "#7bd389", spec: "harmonicity: 5.1", make: () => new Tone.MetalSynth({ envelope: { decay: 0.4, release: 0.2 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5, volume: -10 }), fire: (s, t) => s.triggerAttackRelease(200, 0.3, t) },
  { name: "NoiseSynth", zh: "噪音", color: "#8fa2ff", spec: "noise: pink", make: () => new Tone.NoiseSynth({ noise: { type: "pink" }, envelope: { attack: 0.005, decay: 0.3, sustain: 0 } }), fire: (s, t) => s.triggerAttackRelease(0.3, t) },
  { name: "PluckSynth", zh: "撥弦", color: "#45d6c4", spec: "Karplus-Strong", make: () => new Tone.PluckSynth({ resonance: 0.96 }), fire: (s, t) => s.triggerAttackRelease("C4", 0.5, t) },
];

// ---------- 3. effect chain ----------
const FX = [
  { name: "Distortion", zh: "失真", on: false, wet: 0.8, make: () => new Tone.Distortion(0.75) },
  { name: "BitCrusher", zh: "位元粉碎", on: false, wet: 0.8, make: () => new Tone.BitCrusher(4) },
  { name: "Chorus", zh: "合唱", on: true, wet: 0.6, make: () => new Tone.Chorus(4, 2.5, 0.6).start() },
  { name: "AutoFilter", zh: "自動濾波", on: false, wet: 1, make: () => new Tone.AutoFilter({ frequency: "2n", baseFrequency: 300, octaves: 4 }).start() },
  { name: "FeedbackDelay", zh: "回授延遲", on: true, wet: 0.35, make: () => new Tone.FeedbackDelay("8n", 0.4) },
  { name: "PingPongDelay", zh: "乒乓延遲", on: false, wet: 0.45, make: () => new Tone.PingPongDelay("16n", 0.35) },
  { name: "Reverb", zh: "殘響", on: true, wet: 0.4, make: () => new Tone.Reverb(3) },
];
const ARP = ["C4", "E4", "G4", "B4", "D5", "E5"];
const MODES = ["up", "down", "upDown", "random"];
function buildFx(on, out, mode) {
  const fx = FX.map((f, i) => { const n = f.make(); n.wet.value = on[i] ? f.wet : 0; return n; });
  const syn = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "fatsawtooth", count: 2, spread: 14 }, envelope: { attack: 0.005, decay: 0.12, sustain: 0.2, release: 0.35 }, volume: -9 });
  syn.chain(...fx, out);
  const pat = new Tone.Pattern({ callback: (t, note) => syn.triggerAttackRelease(note, "16n", t), values: ARP, pattern: mode, interval: "16n" }).start(0);
  return { fx, syn, pat, ready: fx[6].ready, nodes: [pat, syn, ...fx] };
}

// ---------- 4. part ----------
const MEL_ROWS = ["A5", "G5", "E5", "D5", "C5", "A4", "G4", "E4", "D4", "C4"];
const MEL_DEF = [[0, "E5"], [2, "D5"], [3, "C5"], [6, "A4"], [8, "G4"], [10, "A4"], [12, "C5"], [14, "D5"], [16, "E5"], [18, "G5"], [19, "E5"], [22, "D5"], [24, "C5"], [26, "D5"], [28, "A4"], [30, "C5"]];
const BASS = [[0, "C3"], [8, "A2"], [16, "F2"], [24, "G2"]];
const at = (s) => `${Math.floor(s / 16)}:${Math.floor((s % 16) / 4)}:${s % 4}`;

// ---------- 5. automation ----------
const AUTO_LEN = 4.5;
function sweep(p, t0) {
  p.cancelScheduledValues(t0);
  p.setValueAtTime(110, t0);
  p.exponentialRampToValueAtTime(880, t0 + 1.2);
  p.linearRampToValueAtTime(220, t0 + 2.4);
  p.setTargetAtTime(110, t0 + 2.6, 0.4);
}
const LFO_TYPES = ["sine", "triangle", "square", "sawtooth"];

// ---------- 6. sampler ----------
const SRC = [{ note: "C3", midi: 48, color: "#4cc9f0" }, { note: "C4", midi: 60, color: "#9d8cff" }, { note: "C5", midi: 72, color: "#f72585" }];
const epiano = () => new Tone.FMSynth({ harmonicity: 3, modulationIndex: 6, envelope: { attack: 0.002, decay: 1.4, sustain: 0.05, release: 0.8 }, modulationEnvelope: { attack: 0.002, decay: 0.5, sustain: 0.1, release: 0.5 }, volume: -6 });
const isBlack = (m) => [1, 3, 6, 8, 10].includes(m % 12);
// Same search order as Tone.Sampler: the higher sample wins a tie.
function nearest(m, only) {
  const avail = only ? [SRC[1]] : SRC;
  for (let d = 0; d < 96; d++) {
    const up = avail.find((s) => s.midi === m + d); if (up) return up;
    const dn = avail.find((s) => s.midi === m - d); if (dn) return dn;
  }
  return SRC[1];
}

// ---------- 7. offline piece ----------
function mulberry(seed) { return () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const PROG = [["C3", "E3", "G3", "B3"], ["A2", "C3", "E3", "G3"], ["F2", "A2", "C3", "E3"], ["G2", "B2", "D3", "F3"]];
const ROOT = ["C2", "A1", "F1", "G1"];
const PENTA = ["C5", "D5", "E5", "G5", "A5", "C6"];
const PIECE = 8;
const LANES = [["旋律", "#4cc9f0"], ["和弦", "#9d8cff"], ["低音", "#ff8c42"], ["踏鈸", "#f7df1e"], ["小鼓", "#7bd389"], ["大鼓", "#f72585"]];
// The arrangement is plain data, so it can be drawn before the render finishes.
function arrange(bpm, seed) {
  const rnd = mulberry(seed), bars = Math.ceil(PIECE / (240 / bpm)), harm = [], mel = [];
  let deg = 2;
  for (let b = 0; b < bars; b++) {
    harm.push({ time: `${b}:0:0`, beat: b * 4, c: b % 4, len: "4n", pad: true }, { time: `${b}:2:0`, beat: b * 4 + 2, c: b % 4, len: "4n" }, { time: `${b}:3:2`, beat: b * 4 + 3.5, c: b % 4, len: "8n" });
    for (let e = 0; e < 8; e++) {
      if (rnd() < 0.55) { deg = Math.max(0, Math.min(PENTA.length - 1, deg + Math.round((rnd() - 0.5) * 4))); mel.push({ time: `${b}:${e >> 1}:${(e % 2) * 2}`, beat: b * 4 + e / 2, note: PENTA[deg], deg }); }
    }
  }
  return { bpm, bars, harm, mel };
}
async function compose(oc, { wet, arr }) {
  const tr = oc.transport, out = oc.destination;
  tr.bpm.value = arr.bpm;
  const verb = new Tone.Reverb({ decay: 3.2, wet }).connect(out);
  const kick = new Tone.MembraneSynth({ pitchDecay: 0.04, octaves: 6, volume: -6 }).connect(out);
  const snare = new Tone.NoiseSynth({ envelope: { attack: 0.001, decay: 0.18, sustain: 0 }, volume: -16 }).connect(verb);
  const hatOpts = { envelope: { attack: 0.001, decay: 0.05, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 5000, octaves: 1.5, volume: -30 };
  const hats = [-0.7, 0.7].map((p) => new Tone.MetalSynth(hatOpts).connect(new Tone.Panner(p).connect(out)));
  const bass = new Tone.MonoSynth({ oscillator: { type: "square" }, filter: { Q: 2 }, filterEnvelope: { attack: 0.01, decay: 0.2, sustain: 0.3, baseFrequency: 80, octaves: 3 }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.6, release: 0.2 }, volume: -14 }).connect(out);
  const pad = new Tone.PolySynth(Tone.AMSynth, { envelope: { attack: 0.3, decay: 0.4, sustain: 0.6, release: 1.2 }, volume: -24 }).connect(verb);
  const pong = new Tone.PingPongDelay({ delayTime: "8n", feedback: 0.3, wet: 0.35 }).connect(verb);
  const lead = new Tone.Synth({ oscillator: { type: "triangle" }, envelope: { attack: 0.01, decay: 0.2, sustain: 0.3, release: 0.4 }, volume: -12 }).connect(pong);
  let k = 0;
  new Tone.Loop((t) => kick.triggerAttackRelease("C1", "8n", t), "4n").start(0);
  new Tone.Loop((t) => snare.triggerAttackRelease("16n", t), "2n").start("4n");
  new Tone.Loop((t) => hats[k++ % 2].triggerAttackRelease(300, "32n", t, 0.5), "8n").start(0);
  new Tone.Part((t, e) => { bass.triggerAttackRelease(ROOT[e.c], e.len, t); if (e.pad) pad.triggerAttackRelease(PROG[e.c], "1m", t); }, arr.harm).start(0);
  new Tone.Part((t, e) => lead.triggerAttackRelease(e.note, "8n", t), arr.mel).start(0);
  tr.start(0);
  await verb.ready;
}

// ---------- 8. stress voices ----------
const DEG = [0, 2, 4, 7, 9];
const voiceMidi = (i) => 48 + 12 * (Math.floor(i / 5) % 4) + DEG[i % 5];
function voices(n, fm, out) {
  const bus = new Tone.Gain(1 / Math.sqrt(n)).connect(out);
  for (let i = 0; i < n; i++) {
    const s = fm ? new Tone.FMSynth({ harmonicity: 2 + (i % 3), modulationIndex: 6, volume: -8 }) : new Tone.Synth({ oscillator: { type: "triangle" }, volume: -8 });
    s.connect(bus);
    const f = Tone.Frequency(voiceMidi(i), "midi").toFrequency() * (1 + (i / n - 0.5) * 0.012);
    s.triggerAttackRelease(f, 1.3, 0.05 + (i % 32) * 0.012);
  }
}

        ctx.html(`<div class="board tn-off"><div class="tn-stats"><div><small>渲染耗時</small><b class="m">…</b></div><div><small>比即時快</small><b class="m">…</b></div><div><small>峰值</small><b class="m">…</b></div><div><small>RMS 響度</small><b class="m">…</b></div></div><div class="tn-card tn-cv"></div></div>`);
        const own = rig(ctx), sv = ctx.$$(".tn-stats b");
        let bpm = 104, wet = 0.3, seed = 7, buf = null, arr = null, pending = false, playing = false, player = null, mon = null, t0 = 0, dirty = true;
        const v = view(ctx, ctx.$(".tn-off > .tn-cv"), () => (dirty = true));
        const go = () => {
          if (playing) player.stop();
          arr = arrange(bpm, seed); pending = true; dirty = true; playBtn.disabled = true;
          const opts = { wet, arr }, clock = {};
          sv[0].textContent = "渲染中…";
          render(ctx, (oc) => { clock.t = performance.now(); return compose(oc, opts); }, PIECE, 2).then((b) => {
            if (!b || opts.arr !== arr) return;
            const ms = performance.now() - clock.t, L = b.getChannelData(0), R = b.getChannelData(1), sl = stats(L), sr = stats(R);
            buf = b; pending = false; playBtn.disabled = false;
            sv[0].textContent = fmtMs(ms);
            sv[1].textContent = `${((PIECE * 1000) / ms).toFixed(1)}×`;
            sv[2].textContent = fmtDb(Math.max(sl.peak, sr.peak));
            sv[3].textContent = fmtDb((sl.rms + sr.rms) / 2);
            dirty = true;
          });
        };
        const later = debounce(ctx, go, 400);
        const playBtn = ctx.button("▶ 播放", () => {
          if (playing) { player.stop(); return; }
          if (!buf) return;
          withLive(ctx, () => {
            mon ||= monitor(own);
            if (!player) { player = own(new Tone.Player()).connect(mon.bus); player.onstop = () => { playing = false; playBtn.textContent = "▶ 播放"; dirty = true; }; }
            player.buffer = buf;
            player.start("+0.02"); t0 = live.now() + 0.02;
            playing = true; playBtn.textContent = "■ 停止";
          });
        }, { primary: true });
        ctx.slider("速度", { min: 80, max: 140, step: 2, value: bpm, format: (x) => `${x} BPM` }, (x) => { bpm = x; later(); });
        ctx.slider("殘響", { min: 0, max: 0.9, step: 0.05, value: wet, format: (x) => `${Math.round(x * 100)}%` }, (x) => { wet = x; later(); });
        ctx.button("換一段旋律", () => { seed = (seed * 31 + 17) % 9973; go(); });
        go();
        ctx.raf(() => {
          if (!playing && !dirty) return;
          dirty = false;
          const { g, w, h: hh } = v;
          g.clearRect(0, 0, w, hh);
          const lw = 38, top = 22, pw = w - lw - 4, mh = Math.round((hh - top - 20) * 0.42), rh = mh / LANES.length;
          const spb = 60 / arr.bpm, beats = PIECE / spb, X = (beat) => lw + ((beat * spb) / PIECE) * pw;
          txt(g, `編曲資料（${arr.bars} 小節・${arr.bpm} BPM・${arr.mel.length} 個旋律音），下方是渲染結果`, 8, 5);
          LANES.forEach(([n], i) => { const y = top + i * rh; g.fillStyle = i % 2 ? "rgba(255,255,255,.02)" : "rgba(255,255,255,.045)"; g.fillRect(lw, y, pw, rh); const fs = Math.min(10, rh - 1); if (fs >= 7) txt(g, n, lw - 4, y + rh / 2 - fs * 0.6, "#7d8490", false, "right", fs); });
          const note = (i, b, len, f0 = 0, f1 = 1, c = LANES[i][1]) => {
            if (b >= beats) return;
            g.fillStyle = c;
            g.fillRect(X(b), top + i * rh + 2 + f0 * (rh - 4), Math.max(1.5, X(Math.min(beats, b + len)) - X(b) - 1), Math.max(1.5, (f1 - f0) * (rh - 4)));
          };
          arr.mel.forEach((e) => { const f = (1 - e.deg / (PENTA.length - 1)) * 0.65; note(0, e.beat, 0.45, f, f + 0.35); });
          arr.harm.forEach((e) => { if (e.pad) note(1, e.beat, 3.9, 0, 1, "#9d8cffaa"); note(2, e.beat, e.len === "4n" ? 0.9 : 0.45); });
          for (let q = 0; q < beats * 2; q++) {
            note(3, q / 2, 0.14, q % 2 ? 0.5 : 0, q % 2 ? 1 : 0.5);
            if (q % 2 === 0) { if (q % 4 === 2) note(4, q / 2, 0.3); note(5, q / 2, 0.25); }
          }
          const wy = top + mh + 8, wl = (hh - wy - 18) / 2;
          for (let b = 0; b < beats; b += 4) { g.fillStyle = "rgba(255,255,255,.14)"; g.fillRect(X(b), top, 1, hh - top - 18); }
          for (let sec = 0; sec <= PIECE; sec++) txt(g, `${sec}s`, Math.min(w - 16, lw + (sec / PIECE) * pw + 2), hh - 15, "#5d6470", true, "left", 10);
          [0, 1].forEach((k) => {
            const y = wy + k * (wl + 4);
            lane(g, lw, y, pw, wl);
            if (buf) drawWave(g, buf.getChannelData(k), lw, y, pw, wl, k ? "#f72585" : "#4cc9f0");
            txt(g, k ? "右 R" : "左 L", lw - 4, y + wl / 2 - 6, "#e8e6e3", false, "right", 10);
          });
          if (pending) txt(g, buf ? "重新渲染中…" : "Tone.Offline 離線渲染中…", lw + 8, wy + 4, "#f7df1e");
          else txt(g, `立體聲 ${PIECE} 秒・${live.sampleRate} Hz・${buf.length.toLocaleString()} 取樣／聲道`, lw + 8, wy + 4, "#9aa0aa");
          if (playing) { const x = lw + ((live.now() - t0) / PIECE) * pw; g.fillStyle = "#f7df1e"; g.fillRect(x, top, 2, hh - top - 18); }
        });
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "Tone.Offline・Synth／FMSynth × N・Context.baseLatency・lookAhead",
      desc: "每個級距建立 N 個聲部，用 Tone.Offline 渲染 2 秒立體聲；耗時低於 2 秒代表渲染速度快過即時播放。",
      hint: "按「開始測試」逐級加量；FMSynth 每個聲部有 2 個振盪器與 2 組包絡，比 Synth 重。測完可播放最後一次渲染的結果。",
      mount(ctx) {
        ctx.html(`<div class="tn-bv"><div class="tn-cv tn-bvin"></div></div>`);
        ctx.controls.classList.add("bottom");
        const own = rig(ctx);
        let fm = 0, last = null, mon = null, player = null, dirty = true, lat = "";
        const v = view(ctx, ctx.$(".tn-bvin"), () => (dirty = true));
        ctx.group(["Synth", "FMSynth"], fm, (i) => (fm = i));
        ctx.button("▶ 播放上次渲染", () => {
          if (!last) return;
          withLive(ctx, () => {
            mon ||= monitor(own);
            player ||= own(new Tone.Player()).connect(mon.bus);
            if (player.state === "started") player.stop();
            player.buffer = last.buf; player.start();
            const raw = live.rawContext;
            lat = `baseLatency ${(live.baseLatency * 1000).toFixed(1)} ms・outputLatency ${((raw.outputLatency || 0) * 1000).toFixed(1)} ms・lookAhead ${(live.lookAhead * 1000).toFixed(0)} ms`;
            dirty = true;
          });
        });
        ctx.bench({
          label: "同時發聲數", unit: "聲部", sizes: [8, 16, 32, 64, 128, 256, 512], target: 2000, budget: 4000,
          title: "極限測試：Tone.Offline 渲染 2 秒",
          note: "計時包含建立 N 個樂器節點與渲染 2 秒立體聲；低於 2 秒＝比即時快。實際播放時還要加上主執行緒排程與輸出延遲。",
          run: async (n) => {
            const clock = {}, kind = fm;
            const T = performance.now();
            const buf = await render(ctx, (oc) => { const s = performance.now(); voices(n, kind, oc.destination); clock.made = performance.now() - s; }, 2, 2);
            const total = performance.now() - T;
            if (!buf) return "";
            last = { buf, n, kind, made: clock.made, total, peak: stats(buf.getChannelData(0)).peak };
            dirty = true;
            return `${(2000 / total).toFixed(1)}× 即時・建立 ${fmtMs(clock.made)}`;
          },
        });
        ctx.raf(() => {
          if (!dirty && !(player && player.state === "started")) return;
          dirty = false;
          const { g, w, h: hh } = v;
          g.clearRect(0, 0, w, hh);
          const wh = Math.min(140, hh * 0.32);
          lane(g, 10, 30, w - 20, wh);
          txt(g, last ? `上次渲染：${last.n} 個 ${last.kind ? "FMSynth" : "Synth"}・建立 ${fmtMs(last.made)}・總計 ${fmtMs(last.total)}・峰值 ${fmtDb(last.peak)}` : "尚未測試：按「開始測試」後，這裡顯示最後一次渲染的波形與聲部", 12, 9, last ? "#e8e6e3" : "#7d8490");
          if (last) drawWave(g, last.buf.getChannelData(0), 10, 30, w - 20, wh);
          if (mon && player && player.state === "started") drawWave(g, mon.wave.getValue(), 10, 30 + wh + 6, w - 20, 40, "#f7df1e");
          if (lat) txt(g, lat, 12, 30 + wh + 50, "#f7df1e", true, "left", 10.5);
          const n = last ? last.n : 512, gy = 30 + wh + 70, gh = hh - gy - 10;
          const cols = Math.max(1, Math.ceil(Math.sqrt((n * (w - 20)) / Math.max(1, gh)))), rows = Math.ceil(n / cols);
          const cell = Math.min((w - 20) / cols, gh / rows), r = Math.max(1, cell * 0.36);
          for (let i = 0; i < n; i++) {
            const x = 10 + (i % cols) * cell + cell / 2, y = gy + Math.floor(i / cols) * cell + cell / 2;
            g.fillStyle = last ? `hsl(${190 + (voiceMidi(i) - 48) * 4} 80% 62%)` : "rgba(255,255,255,.08)";
            g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
          }
        });
      },
    },
  ],
});
</script>
</body>
</html>
