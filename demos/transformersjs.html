<script>
const { h } = Showcase;
const TJS_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0/dist/transformers.min.js";
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif";
const MONO = getComputedStyle(document.documentElement).getPropertyValue("--mono").trim() || "monospace";

// Download sizes in MB, read from the Hugging Face file listings (onnx/*_quantized.onnx + tokenizer files).
const LIB_MB = 5.7; // transformers.min.js + ort-wasm-simd-threaded.asyncify.wasm (compressed transfer)
const MODELS = {
  sentiment: { task: "sentiment-analysis", id: "Xenova/distilbert-base-uncased-finetuned-sst-2-english", name: "DistilBERT SST-2", mb: 68.3 },
  zeroshot: { task: "zero-shot-classification", id: "Xenova/mobilebert-uncased-mnli", name: "MobileBERT MNLI", mb: 27.7 },
  embed: { task: "feature-extraction", id: "Xenova/all-MiniLM-L6-v2", name: "all-MiniLM-L6-v2", mb: 23.7 },
  fill: { task: "fill-mask", id: "Xenova/distilbert-base-uncased", name: "DistilBERT base", mb: 68.4 },
  translate: { task: "translation", id: "Xenova/opus-mt-en-zh", name: "opus-mt-en-zh", mb: 119.5 },
};
const TOKS = [
  { id: "Xenova/bert-base-uncased", name: "BERT", algo: "WordPiece・英文小寫", vocab: 30522, mb: 0.7 },
  { id: "Xenova/bert-base-multilingual-cased", name: "mBERT", algo: "WordPiece・104 種語言", vocab: 119547, mb: 2.9 },
  { id: "Xenova/gpt2", name: "GPT-2", algo: "Byte-level BPE", vocab: 50257, mb: 2.1, bytes: true },
  { id: "Xenova/t5-small", name: "T5", algo: "SentencePiece Unigram", vocab: 32100, mb: 2.4 },
];
const TOK_MB = TOKS.reduce((s, t) => s + t.mb, 0);
const REVIEWS = [
  "The night market in Tainan was amazing, every snack was delicious!",
  "Our flight was delayed for six hours and nobody told us anything.",
  "Taipei MRT is clean, cheap and incredibly easy to use.",
  "The hotel room smelled terrible and the air conditioner was broken.",
  "Sun Moon Lake at sunrise is the most peaceful place I have ever seen.",
  "The typhoon ruined our whole trip to Kenting.",
  "Bubble tea here is way too sweet for me.",
  "Locals were so friendly and helped us find the right bus.",
];
const TOPICS = [
  { zh: "美食", color: "#ff8c42" }, { zh: "交通", color: "#4cc9f0" }, { zh: "天氣", color: "#7bd389" }, { zh: "科技", color: "#9d8cff" },
];
const CORPUS = [
  [0, "The beef noodle soup in Taipei has a rich, spicy broth."],
  [0, "Night markets sell stinky tofu, oyster omelets and bubble tea."],
  [0, "This bakery makes the best pineapple cakes in town."],
  [0, "We ordered xiaolongbao dumplings filled with hot soup."],
  [0, "Mango shaved ice is the perfect dessert on a summer day."],
  [1, "The high speed rail takes you from Taipei to Kaohsiung in 90 minutes."],
  [1, "Use an EasyCard to ride the MRT and city buses."],
  [1, "Our flight to Taoyuan airport was delayed by two hours."],
  [1, "Rent a scooter to explore the east coast at your own pace."],
  [1, "The last train back to the city leaves at midnight."],
  [2, "A typhoon is expected to bring heavy rain this weekend."],
  [2, "Summer afternoons are hot, humid and often stormy."],
  [2, "Snow fell on the peak of Hehuan Mountain last night."],
  [2, "Bring an umbrella, the forecast says showers all day."],
  [2, "Winter in the north is cool and damp but rarely freezing."],
  [3, "The new laptop has a faster chip and longer battery life."],
  [3, "Semiconductor factories in Hsinchu produce advanced processors."],
  [3, "My phone keeps crashing after the latest software update."],
  [3, "Machine learning models can now run inside the web browser."],
  [3, "This app uses the camera to translate menus instantly."],
].map(([topic, text]) => ({ topic, text }));

let T = null, libP = null, consent = false, live = 0;
const tokCache = new Map();
const isAbort = (e) => e && e.name === "AbortError";
const abortErr = () => Object.assign(new Error("superseded"), { name: "AbortError" });
const mbText = (n) => `${n < 10 ? n.toFixed(1) : Math.round(n)} MB`;
const msText = (ms) => (ms >= 1000 ? `${(ms / 1000).toFixed(2)} s` : `${Math.round(ms)} ms`);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const one = (r) => (Array.isArray(r) ? r[0] : r);
const posProb = (r) => (r.label === "POSITIVE" ? r.score : 1 - r.score);
const sentColor = (p) => (p > 0.6 ? "var(--c2)" : p < 0.4 ? "var(--c3)" : "var(--c6)");
const sentWord = (p) => (p > 0.6 ? "正面" : p < 0.4 ? "負面" : "中性");

// Gate once per page visit, then make sure the library module is imported.
async function startTjs(ctx, { icon, title, desc, what = "", mb = 0 }) {
  if (!consent) {
    const need = (T ? 0 : LIB_MB) + mb;
    await ctx.gate({
      icon, title,
      desc: `${desc}。模型從 Hugging Face 下載後存進瀏覽器快取，推論在本機以 WebAssembly 執行，文字不會上傳；之後切到其他場景會再下載該場景的模型（1～120 MB）。`,
      tags: [`約 ${mbText(need)}`, "Transformers.js 4.3.0", "ONNX Runtime WASM"],
      button: `載入 Transformers.js${what ? ` 與 ${what}` : ""}（約 ${mbText(need)}）`,
    });
    consent = true;
  }
  if (!T) {
    const s = ctx.status("下載 Transformers.js…");
    try {
      libP = libP || import(TJS_URL);
      T = await libP;
      T.env.allowLocalModels = false;
    } catch (e) {
      libP = null;
      if (ctx.active) s.error(`Transformers.js 載入失敗：${e.message}`);
      throw e;
    }
    s.done();
    if (!ctx.active) throw abortErr();
  }
}

// One live pipeline per scene. Calls are queued so dispose() never races a running inference.
function pipeSlot(ctx) {
  let cur = null, seq = 0, q = Promise.resolve(), loadMs = 0;
  const free = (p) => {
    q = q.then(() => p.dispose()).catch((e) => console.warn("[transformers demo] dispose failed", e)).then(() => { live--; });
  };
  ctx.onCleanup(() => { seq++; if (cur) free(cur); cur = null; });
  return {
    get loadMs() { return loadMs; },
    async use(key) {
      const my = ++seq;
      if (cur) { free(cur); cur = null; }
      const M = MODELS[key];
      const s = ctx.status(`下載 ${M.name}（約 ${mbText(M.mb)}）…`);
      const t0 = performance.now();
      let p;
      try {
        p = await T.pipeline(M.task, M.id, {
          dtype: "q8", device: "wasm",
          progress_callback: (e) => {
            if (!ctx.active || my !== seq) return;
            if (e.status === "progress_total" && e.total) {
              s.progress(e.loaded / e.total);
              s.text(`下載 ${M.name}… ${(e.loaded / 1e6).toFixed(1)} / ${(e.total / 1e6).toFixed(1)} MB`);
            } else if (e.status === "ready") s.text(`建立 ${M.name} 的 ONNX 推論工作階段…`);
          },
        });
      } catch (e) {
        if (ctx.active && my === seq) s.error(`${M.name} 載入失敗：${e.message}`);
        throw e;
      }
      live++;
      s.done();
      if (my !== seq || !ctx.active) { free(p); throw abortErr(); }
      cur = p;
      loadMs = performance.now() - t0;
      return p;
    },
    run(...args) {
      const p = cur;
      if (!p) return Promise.reject(abortErr());
      const job = q.then(() => { if (p !== cur) throw abortErr(); return p(...args); });
      q = job.catch(() => {});
      return job;
    },
  };
}

// Live readout: how many pipelines (ONNX sessions) are alive page-wide; drops back after a scene is left.
function pipeTag(ctx, host, slot) {
  const el = h("div", { class: "tjs-mem" });
  host.append(el);
  const paint = () => {
    const th = T ? T.env.backends.onnx.wasm.numThreads : null;
    const heap = performance.memory ? `・JS 堆積 <b>${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)}</b> MB` : "";
    el.innerHTML = `存活 pipeline <b>${live}</b> 個${slot && slot.loadMs ? `・載入 <b>${(slot.loadMs / 1000).toFixed(1)}</b> s` : ""}・WASM <b>${th || "?"}</b> 執行緒${heap}`;
  };
  ctx.interval(paint, 500);
  paint();
  return el;
}

function guard(ctx, p) {
  return Promise.resolve(p).catch((e) => { if (!isAbort(e) && ctx.active) ctx.status("").error(`發生錯誤：${e.message}`); });
}

function canvasIn(ctx, host, onFit) {
  const cv = h("canvas");
  host.append(cv);
  const g = cv.getContext("2d");
  const st = { cv, g, w: 0, h: 0 };
  const fit = (first) => {
    const w = host.clientWidth, hh = host.clientHeight;
    if (!w || !hh || (w === st.w && hh === st.h)) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    st.w = w; st.h = hh;
    cv.width = Math.round(w * dpr); cv.height = Math.round(hh * dpr);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (onFit) first === true ? queueMicrotask(() => ctx.active && onFit(st)) : onFit(st);
  };
  const ro = new ResizeObserver(() => fit());
  ro.observe(host);
  ctx.onCleanup(() => ro.disconnect());
  fit(true);
  return st;
}

function pressGroup(wrap, i) {
  wrap.querySelectorAll("button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
}

function inputBox(ctx, placeholder, value = "") {
  const el = h("input", { class: "tjs-input", type: "text", placeholder, maxlength: "200", spellcheck: "false" });
  el.value = value;
  ctx.controls.append(el);
  return el;
}

function barsHTML(rows) {
  return rows.map((r) => `<div class="tjs-bar ${r.cls || ""}"><div class="l"><code>${esc(r.label)}</code>${r.sub ? `<span>${esc(r.sub)}</span>` : ""}</div>
    <div class="p">${(r.p * 100).toFixed(1)}%</div><div class="t"><i style="width:${(clamp(r.w ?? r.p, 0, 1) * 100).toFixed(1)}%"></i></div></div>`).join("");
}

// Top-2 principal components through the n x n Gram matrix (n sentences, d = 384 dims).
function pca2(X) {
  const n = X.length, d = X[0].length;
  const mean = new Float64Array(d);
  X.forEach((v) => v.forEach((x, i) => (mean[i] += x / n)));
  const C = X.map((v) => v.map((x, i) => x - mean[i]));
  const G = C.map((a) => C.map((b) => a.reduce((s, x, i) => s + x * b[i], 0)));
  const trace = G.reduce((s, r, i) => s + r[i], 0);
  let M = G.map((r) => r.slice());
  const comps = [], lams = [];
  for (let k = 0; k < 2; k++) {
    let u = Array.from({ length: n }, (_, i) => Math.sin(i * 1.7 + k + 1));
    let lam = 0;
    for (let it = 0; it < 120; it++) {
      const w = M.map((r) => r.reduce((s, x, j) => s + x * u[j], 0));
      lam = Math.hypot(...w) || 1;
      u = w.map((x) => x / lam);
    }
    lams.push(lam);
    M = M.map((r, i) => r.map((x, j) => x - lam * u[i] * u[j]));
    const v = new Float64Array(d);
    C.forEach((row, i) => row.forEach((x, j) => (v[j] += x * u[i])));
    const nv = Math.hypot(...v) || 1;
    comps.push(Array.from(v, (x) => x / nv));
  }
  return { project: (v) => comps.map((c) => c.reduce((s, x, i) => s + (v[i] - mean[i]) * x, 0)), ratio: (lams[0] + lams[1]) / trace };
}

// GPT-2 byte-level BPE maps each byte to a printable char; invert it to show the real UTF-8 bytes.
const BYTE_OF = (() => {
  const bs = [];
  for (let i = 33; i <= 126; i++) bs.push(i);
  for (let i = 161; i <= 172; i++) bs.push(i);
  for (let i = 174; i <= 255; i++) bs.push(i);
  const cs = bs.slice();
  let n = 0;
  for (let b = 0; b < 256; b++) if (!bs.includes(b)) { bs.push(b); cs.push(256 + n++); }
  return new Map(bs.map((b, i) => [String.fromCharCode(cs[i]), b]));
})();
function bytePiece(piece) {
  const bytes = [...piece].map((c) => BYTE_OF.get(c));
  if (bytes.some((b) => b == null)) return { text: piece, raw: false };
  try {
    return { text: new TextDecoder("utf-8", { fatal: true }).decode(new Uint8Array(bytes)).replace(/ /g, "␣"), raw: false };
  } catch {
    return { text: bytes.map((b) => b.toString(16).toUpperCase().padStart(2, "0")).join(" "), raw: true };
  }
}

            const res = await c.match(req);
            let n = +(res && res.headers.get("content-length")) || 0;
            if (!n && res) n = (await res.blob()).size;
            const u = new URL(req.url);
            const key = u.hostname === "huggingface.co" ? u.pathname.split("/resolve/")[0].slice(1) : `ONNX Runtime（${u.hostname}）`;
            const g = groups.get(key) || { files: 0, bytes: 0 };
            g.files++; g.bytes += n; groups.set(key, g);
            total += n;
          }
          if (!ctx.active) return;
          const list = [...groups].sort((a, b) => b[1].bytes - a[1].bytes);
          const max = Math.max(1, ...list.map(([, g]) => g.bytes));
          ctx.$("[data-r=ch]").innerHTML = `Cache Storage「${esc(E.cacheKey)}」共 <b>${(total / 1e6).toFixed(1)}</b> MB・${list.length} 組`;
          ctx.$("[data-r=cache]").innerHTML = list.length
            ? barsHTML(list.slice(0, 8).map(([k, g]) => ({ label: k.replace(/^Xenova\//, ""), sub: `${g.files} 檔・${(g.bytes / 1e6).toFixed(1)} MB`, p: g.bytes / Math.max(total, 1), w: g.bytes / max })))
            : `<div class="tjs-muted">快取是空的：切到其他場景載入模型後再回來看</div>`;
          if (navigator.storage && navigator.storage.estimate) {
            const est = await navigator.storage.estimate();
            if (ctx.active) ctx.$("[data-r=est]").innerHTML = `此網站已用 <b>${(est.usage / 1e6).toFixed(1)}</b> MB／配額 <b>${(est.quota / 1e9).toFixed(1)}</b> GB`;
          }
        }
        async function cacheTest() {
          testBtn.disabled = true;
          const id = "Xenova/bert-base-uncased";
          const url = `${E.remoteHost}${E.remotePathTemplate.replace("{model}", id).replace("{revision}", "main")}tokenizer.json`;
          const box = ctx.$("[data-r=tests]");
          const rows = [];
          const show = () => {
            const max = Math.max(1, ...rows.map((r) => r[2] || 0));
            box.innerHTML = rows.map(([k, d, ms]) => `<div><code>${k}</code><span><i style="width:${ms == null ? 0 : Math.max(1, (ms / max) * 100).toFixed(1)}%"></i><small class="tjs-muted">${esc(d)}</small></span><b>${ms == null ? "…" : msText(ms)}</b></div>`).join("");
          };
          const time = async (k, d) => {
            rows.push([k, d, null]); show();
            const t0 = performance.now();
            await T.AutoTokenizer.from_pretrained(id);
            rows[rows.length - 1][2] = performance.now() - t0;
            if (ctx.active) show();
          };
          const prev = E.useBrowserCache;
          try {
            E.useBrowserCache = false;
            await time("useBrowserCache = false", "直接走網路，不讀也不寫快取（瀏覽器 HTTP 快取仍可能生效）");
            E.useBrowserCache = true;
            const hit = !!(await (await caches.open(E.cacheKey)).match(url));
            await time("useBrowserCache = true", hit ? "第一次：已在快取裡，直接讀取" : "第一次：從網路下載並寫入快取");
            await time("useBrowserCache = true", "第二次：從 Cache Storage 讀取");
          } finally {
            E.useBrowserCache = prev;
            testBtn.disabled = false;
          }
          await refresh();
        }
        await refresh();
      },
    },

    // 8 ---------------------------------------------------------------------------------
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "await extractor(sentences.slice(0, n), { pooling: \"mean\", normalize: true })",
      desc: "用 all-MiniLM-L6-v2 嵌入 n 個句子，比較兩種呼叫方式的吞吐量：「整批」把 n 句一次交給 pipeline，ONNX Runtime 用一個 [n, 長度] 的張量算完；「逐句」呼叫 n 次、每次一句。整批省掉每次呼叫的固定開銷，但句子要補齊到同長度。右圖累積兩種模式在各批次大小的每秒句數。",
      hint: "先在下方選模式，再按「開始測試」；換模式再測一次即可比較",
      async mount(ctx) {
        await startTjs(ctx, { icon: "⏱️", title: "批次吞吐極限測試", desc: "量測批次大小對每秒嵌入句數的影響", what: MODELS.embed.name, mb: MODELS.embed.mb });
        ctx.html(`<div class="tjs-stress tjs-box"></div>`);
        const box = ctx.$(".tjs-stress");
        const SIZES = [1, 2, 4, 8, 16, 32, 64, 128, 256];
        const MODES = [{ key: "batch", zh: "整批", color: "#f7df1e" }, { key: "seq", zh: "逐句", color: "#4cc9f0" }];
        const results = { batch: {}, seq: {} };
        let mode = "batch";
        const view = canvasIn(ctx, box, () => draw());
        const tagHost = h("div", { style: "position:absolute;right:12px;top:30px;z-index:2;pointer-events:none" });
        box.append(tagHost);
        const seg = ctx.group(MODES.map((m) => `${m.zh}（${m.key === "batch" ? "1 次呼叫" : "n 次呼叫"}）`), 0, (i) => { mode = MODES[i].key; draw(); });
        ctx.controls.classList.add("bottom");
        const slot = pipeSlot(ctx);
        pipeTag(ctx, tagHost, slot);
        await slot.use("embed");
        const opts = { pooling: "mean", normalize: true };
        await slot.run("warm up the session", opts);
        draw();

        function draw() {
          const { g, w, h: H } = view;
          if (!w) return;
          g.clearRect(0, 0, w, H);
          const L = 56, R = 20, T0 = 64, B = 40, pw = w - L - R, ph = H - T0 - B;
          g.font = `600 13px ${FONT}`; g.fillStyle = "#ecebe6"; g.textAlign = "left"; g.textBaseline = "alphabetic";
          g.fillText("每秒嵌入句數 vs 批次大小", 14, 24);
          let lx = 14;
          MODES.forEach((m) => {
            g.fillStyle = m.color; g.fillRect(lx, 36, 14, 4);
            g.font = `${m.key === mode ? 700 : 500} 12px ${FONT}`; g.fillStyle = m.key === mode ? "#ecebe6" : "#9b998f";
            g.fillText(m.zh, lx + 19, 42); lx += 70;
          });
          const vals = MODES.flatMap((m) => Object.values(results[m.key]));
          const top = Math.max(50, ...vals) * 1.15;
          const X = (i) => L + (i / (SIZES.length - 1)) * pw, Y = (v) => T0 + (1 - v / top) * ph;
          g.font = `500 11px ${MONO}`; g.textAlign = "right"; g.textBaseline = "middle";
          for (let k = 0; k <= 4; k++) {
            const v = (top / 4) * k, y = Y(v);
            g.strokeStyle = "rgba(255,255,255,.08)"; g.beginPath(); g.moveTo(L, y); g.lineTo(L + pw, y); g.stroke();
            g.fillStyle = "#9b998f"; g.fillText(v.toFixed(0), L - 8, y);
          }
          g.textAlign = "center"; g.textBaseline = "top";
          SIZES.forEach((n, i) => g.fillText(String(n), X(i), T0 + ph + 8));
          g.font = `500 11px ${FONT}`; g.fillText("每次測試的句子數 n", L + pw / 2, T0 + ph + 24);
          MODES.forEach((m) => {
            const pts = SIZES.map((n, i) => [i, results[m.key][n]]).filter((p) => p[1] != null);
            if (!pts.length) return;
            g.strokeStyle = m.color; g.lineWidth = m.key === mode ? 3 : 2; g.beginPath();
            pts.forEach(([i, v], k) => (k ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v))));
            g.stroke();
            pts.forEach(([i, v]) => {
              g.fillStyle = m.color; g.beginPath(); g.arc(X(i), Y(v), 4, 0, Math.PI * 2); g.fill();
              g.font = `600 10.5px ${MONO}`; g.fillStyle = "#ecebe6"; g.textAlign = "center"; g.textBaseline = "bottom";
              g.fillText(v.toFixed(0), X(i), Y(v) - 7);
            });
          });
          if (!vals.length) {
            g.font = `500 13px ${FONT}`; g.fillStyle = "#9b998f"; g.textAlign = "center"; g.textBaseline = "middle";
            g.fillText("按「開始測試」後這裡會畫出吞吐曲線", L + pw / 2, T0 + ph / 2);
          }
        }
        const bench = ctx.bench({
          label: "句子數", unit: "句", sizes: SIZES, target: 1000, budget: 4000,
          note: "句子取自語意搜尋場景的 20 則語料循環使用；時間含分詞與平均池化。WASM 單執行緒，結果依 CPU 而異。",
          async run(n) {
            const S = Array.from({ length: n }, (_, i) => CORPUS[i % CORPUS.length].text);
            const m = mode;
            const t0 = performance.now();
            if (m === "batch") await slot.run(S, opts);
            else for (const s of S) await slot.run(s, opts);
            const dt = performance.now() - t0;
            const rate = n / (dt / 1000);
            results[m][n] = rate;
            draw();
            return `${rate.toFixed(0)} 句/秒`;
          },
        });
        const runBtn = bench.panel.querySelector("[data-sc-run]");
        ctx.interval(() => seg.querySelectorAll("button").forEach((b) => (b.disabled = runBtn.disabled)), 250);
      },
    },
  ],
});
</script>
</body>
</html>
