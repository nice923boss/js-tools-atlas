<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trianglify 示範：一句話產生低多邊形封面</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"Trianglify 程式碼為 GPLv3 授權，產出的圖片版權歸使用者"}</script>
<style>
  #art { position: fixed; inset: 0; display: block; }
  .cover {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    pointer-events: none; padding: 0 24px;
  }
  .cover h1 {
    margin: 0; padding: 10px 22px; font-size: clamp(24px, 6vw, 54px); font-weight: 800; letter-spacing: .08em;
    color: #fff; background: rgba(10, 12, 16, .42); border-radius: 12px; backdrop-filter: blur(3px);
    max-width: 90vw; overflow-wrap: anywhere;
  }
  .cover small { display: block; margin-top: 10px; font-size: 12px; letter-spacing: .2em; color: rgba(255, 255, 255, .85); text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }
  .opts { position: fixed; left: 12px; top: 12px; z-index: 50; width: 230px; display: grid; gap: 8px; padding: 12px 14px; }
  .opts label { display: grid; grid-template-columns: 44px 1fr 34px; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .opts input[type="text"], .opts select {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: rgba(0, 0, 0, .3);
  }
  .opts input[type="range"] { width: 100%; }
  .opts output { font-family: var(--mono); color: var(--fg); text-align: right; }
  .opts .row { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) {
    .opts { top: auto; bottom: 48px; left: 12px; right: 12px; width: auto; gap: 6px; padding: 10px 12px; }
  }
</style>
</head>
<body>
<canvas id="art"></canvas>
<div class="cover">
  <h1 id="title">台灣好行</h1>
  <small>同一句話，永遠產生同一張圖</small>
</div>
<div class="opts panel" id="opts">
  <div class="row">種子<input type="text" id="seed" value="台灣好行" maxlength="20"></div>
  <label>網格<input type="range" id="cell" min="24" max="160" value="70"><output id="cellOut">70</output></label>
  <label>擾動<input type="range" id="variance" min="0" max="100" value="75"><output id="varOut">0.75</output></label>
  <div class="row">風格<select id="style">
    <option value="smooth">平滑漸層</option>
    <option value="sparkle">閃亮碎片</option>
    <option value="shadows">立體陰影</option>
    <option value="wire">線框</option>
  </select></div>
</div>
<div class="controls" id="palettes">
  <button class="btn" data-p="sunset" aria-pressed="true">夕陽</button>
  <button class="btn" data-p="ocean">海洋</button>
  <button class="btn" data-p="forest">森林</button>
  <button class="btn" data-p="neon">霓虹</button>
  <button class="btn" id="dice">換一句</button>
</div>
<div class="hint">改種子文字或拖曳滑桿即時重繪</div>

<script src="https://cdn.jsdelivr.net/npm/trianglify@4.1.1/dist/trianglify.bundle.js"></script>
<script>
// Trianglify: Delaunay triangulation of a jittered grid, coloured by two gradients.
const PALETTES = {
  sunset: { x: ["#3a0ca3", "#f72585", "#ffb26b"], y: ["#1b1446", "#f72585", "#ffd166"] },
  ocean: { x: "YlGnBu", y: "match" },
  forest: { x: ["#0b3d2e", "#2f9e55", "#cde77f"], y: "match" },
  neon: { x: ["#0e1013", "#4cc9f0", "#f7df1e", "#f72585"], y: ["#9d8cff", "#0e1013"] },
};
const PHRASES = ["台灣好行", "阿里山日出", "九份老街", "墾丁夏日", "日月潭晨霧", "台北 101 跨年", "太魯閣峽谷"];
const $ = (id) => document.getElementById(id);
const canvas = $("art");
let palette = "sunset";

function colorFunction(style) {
  const f = trianglify.colorFunctions;
  if (style === "sparkle") return f.sparkle(0.18);
  if (style === "shadows") return f.shadows(0.8);
  return f.interpolateLinear(0.5);
}

function draw() {
  const style = $("style").value;
  const cell = Number($("cell").value);
  const variance = Number($("variance").value) / 100;
  const seed = $("seed").value.trim() || "台灣好行";
  const p = PALETTES[palette];
  const pattern = trianglify({
    width: innerWidth,
    height: innerHeight,
    cellSize: cell,
    variance,
    seed,
    xColors: p.x,
    yColors: p.y,
    colorFunction: colorFunction(style),
    fill: style !== "wire",
    strokeWidth: style === "wire" ? 1.4 : 0,
  });
  pattern.toCanvas(canvas);
  document.body.style.background = style === "wire" ? "#0b0d12" : "";
  $("title").textContent = seed;
  $("cellOut").textContent = cell;
  $("varOut").textContent = variance.toFixed(2);
}

let raf = 0;
const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); };
for (const id of ["seed", "cell", "variance", "style"]) $(id).addEventListener("input", schedule);
$("palettes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-p]");
  if (b) {
    palette = b.dataset.p;
    document.querySelectorAll("#palettes [data-p]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  } else if (e.target.id === "dice") {
    const now = $("seed").value;
    const next = PHRASES.filter((s) => s !== now);
    $("seed").value = next[Math.floor(Math.random() * next.length)];
  } else return;
  schedule();
});
addEventListener("resize", schedule);
draw();
</script>
</body>
</html>
