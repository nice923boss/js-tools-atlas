<script>
"use strict";
// Trianglify 4.1.1 showcase: eight scenes, from the original seed-phrase cover to a triangle-count benchmark.
const { h, fmt, fmtCompact, fmtMs } = Showcase;
const CF = trianglify.colorFunctions;
const BREWER = trianglify.utils.colorbrewer;
const BREWER_NAMES = Object.keys(BREWER);
const mix = trianglify.utils.mix; // chroma.mix, returns a chroma Color
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const bytes = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(2)} MB` : `${(n / 1024).toFixed(1)} KB`);
const randomSeed = () => Math.random().toString(36).slice(2, 8);

// Generate a pattern and draw it into a canvas; returns the pattern and both timings.
function paint(cv, opts, canvasOpts) {
  const t0 = performance.now();
  const p = trianglify(opts);
  const t1 = performance.now();
  p.toCanvas(cv, canvasOpts);
  return { p, gen: t1 - t0, draw: performance.now() - t1 };
}

// Coalesce redraw requests into a single call on the next frame.
function scheduler(ctx, fn) {
  let id = 0;
  ctx.onCleanup(() => cancelAnimationFrame(id));
  return () => { cancelAnimationFrame(id); id = requestAnimationFrame(() => ctx.active && fn()); };
}

// ctx.onResize only watches the scene root, which keeps its size when the control bar height
// (--sc-ctl-h) is published after mount; inner layouts need their own observer.
function observe(ctx, el, fn) {
  const ro = new ResizeObserver(() => ctx.active && fn());
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
}

// Small seeded LCG for demo-side randomness (point layouts), independent of Trianglify's own RNG.
function lcg(seed) {
  let s = seed >>> 0;
  return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296;
}

// Points along the artboard border so a custom point set always covers every corner.
function framePoints(W, H, step = 150) {
  const pts = [];
  const nx = Math.max(1, Math.round(W / step)), ny = Math.max(1, Math.round(H / step));
  for (let i = 0; i <= nx; i++) { const x = (W * i) / nx; pts.push([x, -2], [x, H + 2]); }
  for (let j = 1; j < ny; j++) { const y = (H * j) / ny; pts.push([-2, y], [W + 2, y]); }
  return pts;
}

// FNV-1a over rounded coordinates: proves that a colorFunction never moves the geometry.
function fingerprint(points) {
  let x = 2166136261;
  for (const p of points) {
    x = Math.imul(x ^ Math.round(p[0] * 10), 16777619);
    x = Math.imul(x ^ Math.round(p[1] * 10), 16777619);
  }
  return (x >>> 0).toString(16).padStart(8, "0");
}

// Find which ColorBrewer entry (if any) a chroma scale was built from.
function paletteName(scale, pool) {
  const a = scale(0).hex(), b = scale(1).hex();
  return Object.keys(pool).find((k) => pool[k][0].toLowerCase() === a && pool[k][pool[k].length - 1].toLowerCase() === b);
}

// ---------- 1. cover ----------
const PHRASES = ["台灣好行", "阿里山日出", "九份老街", "墾丁夏日", "日月潭晨霧", "台北 101 跨年", "太魯閣峽谷"];
const COVER_PALETTES = [
  { name: "夕陽", x: ["#3a0ca3", "#f72585", "#ffb26b"], y: ["#1b1446", "#f72585", "#ffd166"] },
  { name: "海洋", x: "YlGnBu", y: "match" },
  { name: "森林", x: ["#0b3d2e", "#2f9e55", "#cde77f"], y: "match" },
  { name: "霓虹", x: ["#0e1013", "#4cc9f0", "#f7df1e", "#f72585"], y: ["#9d8cff", "#0e1013"] },
];
const COVER_STYLES = [
  { name: "平滑", code: "colorFunction: interpolateLinear(0.5)", fn: () => CF.interpolateLinear(0.5) },
  { name: "閃亮", code: "colorFunction: sparkle(0.18)", fn: () => CF.sparkle(0.18) },
  { name: "陰影", code: "colorFunction: shadows(0.8)", fn: () => CF.shadows(0.8) },
  { name: "線框", code: "fill: false, strokeWidth: 1.4", wire: true },
];

// ---------- 2 / 3. colors ----------
const CUSTOM_X = ["#0f172a", "#7c3aed", "#f472b6", "#fde68a"];
const CUSTOM_Y = ["#022c22", "#14b8a6", "#e0f2fe"];
const WARM = ["YlOrRd", "OrRd", "YlOrBr", "Oranges", "Reds", "RdPu"];
const SPACES = ["rgb", "hsv", "hsl", "hsi", "lab", "hcl"];
const PAIRS = [["藍黃", ["#1d4ed8", "#facc15"]], ["紅綠", ["#e11d48", "#22c55e"]], ["紫橘", ["#7c3aed", "#fb923c"]], ["黑白", ["#000000", "#ffffff"]]];

// ---------- 4. color functions ----------
const FN_COLORS = ["#1e3a8a", "#0ea5e9", "#a7f3d0", "#fde68a", "#f97316"];
// Rolling terrain in [0, 1] for the lighting example (u, v are normalised coordinates).
const terrain = (u, v) => clamp01(0.5 + 0.22 * Math.sin(u * 5.1 + 1.3) * Math.cos(v * 4.3 - 0.7) + 0.16 * Math.sin((u + v) * 7.7 + 2.1) + 0.08 * Math.cos(u * 13.3 - v * 11.1));
const FN_MODES = [
  { name: "線性", param: "bias", min: 0, max: 1, step: 0.05, value: 0.5,
    code: (v) => `trianglify.colorFunctions.interpolateLinear(${v})`, note: "內建預設：x 色與 y 色依 bias 比例混合",
    make: (v) => CF.interpolateLinear(v) },
  { name: "閃亮", param: "jitter", min: 0, max: 0.6, step: 0.05, value: 0.15,
    code: (v) => `trianglify.colorFunctions.sparkle(${v})`, note: "內建：取色位置加入隨機偏移，相鄰三角形對比變大",
    make: (v) => CF.sparkle(v) },
  { name: "陰影", param: "intensity", min: 0, max: 2, step: 0.05, value: 0.8,
    code: (v) => `trianglify.colorFunctions.shadows(${v})`, note: "內建：每個三角形隨機 darken 0 到 intensity",
    make: (v) => CF.shadows(v) },
  { name: "放射", param: "半徑", min: 0.3, max: 1.5, step: 0.05, value: 0.8,
    code: () => "({ centroid, xScale, opts }) => xScale(1 - d / r)", note: "自訂：依重心到中心的距離 d 取色",
    make: (k) => ({ centroid, xScale, opts }) => {
      const cx = opts.width / 2, cy = opts.height / 2, r = Math.hypot(cx, cy) * k;
      return xScale(1 - clamp01(Math.hypot(centroid.x - cx, centroid.y - cy) / r));
    } },
  { name: "光照", param: "光源角度", min: 0, max: 360, step: 5, value: 135,
    code: () => "({ vertexIndices, points, xScale, opts }) => …", note: "自訂：每個頂點給高度，算三角形法向量後做 Lambert 打光",
    make: (deg) => {
      const a = (deg * Math.PI) / 180, el = 0.6;
      const L = [Math.cos(a) * Math.cos(el), Math.sin(a) * Math.cos(el), Math.sin(el)];
      let zs = null;
      return ({ vertexIndices, points, xScale, opts }) => {
        const s = Math.min(opts.width, opts.height), amp = s * 0.35;
        if (!zs) zs = points.map((p) => terrain(p[0] / s, p[1] / s));
        const [i0, i1, i2] = vertexIndices, p0 = points[i0], p1 = points[i1], p2 = points[i2];
        const ax = p1[0] - p0[0], ay = p1[1] - p0[1], az = (zs[i1] - zs[i0]) * amp;
        const bx = p2[0] - p0[0], by = p2[1] - p0[1], bz = (zs[i2] - zs[i0]) * amp;
        let nx = ay * bz - az * by, ny = az * bx - ax * bz, nz = ax * by - ay * bx;
        if (nz < 0) { nx = -nx; ny = -ny; nz = -nz; }
        const lambert = Math.max(0, (nx * L[0] + ny * L[1] + nz * L[2]) / (Math.hypot(nx, ny, nz) || 1));
        const base = xScale((zs[i0] + zs[i1] + zs[i2]) / 3);
        return mix(base, "#000000", 0.78 * (1 - lambert), "rgb");
      };
    } },
];

// ---------- 5. custom points ----------
const PT_MODES = ["螺旋", "圓環", "文字", "點擊加點", "波動"];
const PT_NOTES = [
  "黃金角 137.5° 葉序排列，越外圈越稀疏",
  "第 k 圈放 6k 個點，再加上邊框點補滿角落",
  "沿字形邊緣取樣；colorFunction 讀遮罩，重心在字內就提亮",
  "在畫面上點一下就多一個點",
  "每一幀重算點位，再重跑 Delaunay 與 toCanvas",
];
const PT_X = ["#0b132b", "#1c7ed6", "#63e6be", "#ffe066"];
const PT_Y = ["#ffe066", "#f06595", "#0b132b"];

function spiralPoints(W, H, n) {
  const R = Math.hypot(W, H) / 2 * 1.02, pts = [];
  for (let i = 0; i < n; i++) {
    const r = R * Math.sqrt((i + 0.5) / n), t = i * 2.399963;
    pts.push([W / 2 + r * Math.cos(t), H / 2 + r * Math.sin(t)]);
  }
  return pts;
}
function ringPoints(W, H, n) {
  const K = Math.max(2, Math.round(Math.sqrt(n / 3))), R = Math.hypot(W, H) / 2, pts = [[W / 2, H / 2]];
  for (let k = 1; k <= K; k++) {
    const r = (R * k) / K, m = 6 * k, off = k * 0.37;
    for (let i = 0; i < m; i++) pts.push([W / 2 + r * Math.cos(off + (i * 2 * Math.PI) / m), H / 2 + r * Math.sin(off + (i * 2 * Math.PI) / m)]);
  }
  return pts.concat(framePoints(W, H));
}
function glyphMask(W, H, text) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const g = c.getContext("2d", { willReadFrequently: true });
  const fam = getComputedStyle(document.body).fontFamily;
  let fs = Math.min(H * 0.42, (W * 0.86) / text.length);
  g.font = `900 ${fs}px ${fam}`;
  const w = g.measureText(text).width;
  if (w > W * 0.88) { fs *= (W * 0.88) / w; g.font = `900 ${fs}px ${fam}`; }
  g.textAlign = "center"; g.textBaseline = "middle"; g.fillStyle = "#fff";
  g.fillText(text, W / 2, H / 2);
  const a = g.getImageData(0, 0, W, H).data;
  c.width = c.height = 0;
  const inside = (x, y) => { x |= 0; y |= 0; return x >= 0 && y >= 0 && x < W && y < H && a[(y * W + x) * 4 + 3] > 127; };
  const edges = [];
  for (let y = 2; y < H - 2; y += 2) for (let x = 2; x < W - 2; x += 2) {
    if (inside(x, y) && (!inside(x - 2, y) || !inside(x + 2, y) || !inside(x, y - 2) || !inside(x, y + 2))) edges.push([x, y]);
  }
  return { inside, edges, W, H };
}

// ---------- 6. overlay ----------
const OV_MODES = [
  { name: "半透明面", opts: { xColors: ["rgba(10,12,32,0.85)", "rgba(10,12,32,0.1)", "rgba(255,255,255,0.4)"], yColors: ["rgba(255,255,255,0.35)", "rgba(10,12,32,0.05)", "rgba(10,12,32,0.8)"], colorFunction: CF.sparkle(0.3) } },

  { name: "面＋描邊", opts: { strokeWidth: 1, xColors: ["rgba(247,37,133,0.55)", "rgba(76,201,240,0.2)"], yColors: ["rgba(58,12,163,0.6)", "rgba(255,209,102,0.15)"] } },
];

// ---------- 7. export ----------
const SIZES = [

  { name: "分享圖 1200×630", w: 1200, h: 630 },
  { name: "方形 1080×1080", w: 1080, h: 1080 },

];

  const a = h("a", { href: url, download: name });

Showcase.run({ scenes: [
  {
    id: "seed", title: "一句話一張圖",
    api: "trianglify({ seed, cellSize, variance, xColors, colorFunction })・toCanvas()",
    desc: "原版示範的升級：輸入任何文字當 seed，同一句話永遠得到同一張低多邊形封面。可換四組調色盤與四種畫法（平滑、閃亮、陰影、線框）；網格是 cellSize，控制三角形大小，擾動是 variance，控制格點偏移量。seed 留白時傳 null，改用隨機亂數，每次重畫都不同。注意 4.1.1 的 seed 要傳字串：傳數字時不論數值多少都得到同一張圖（實測 seed: 1 與 seed: 2 的點位完全相同）。",
    hint: "改 seed 文字，或按「換一句」",
    mount(ctx) {
      ctx.html(`<div class="tbox"><canvas class="tc"></canvas><div class="cover"><div class="cv-title"><small>同一句話，永遠產生同一張圖</small><h1></h1></div></div></div><div class="tag"></div>`);
      const box = ctx.$(".tbox"), cv = ctx.$(".tc"), title = ctx.$("h1"), tag = ctx.$(".tag");
      const st = { seed: PHRASES[0], pal: 0, style: 0, cell: 70, variance: 0.75 };
      let pi = 0;
      const input = h("input", { type: "text", maxlength: 20, value: st.seed, spellcheck: "false", "aria-label": "seed 文字" });
      ctx.controls.append(h("label", { class: "sc-field seed" }, "seed", input));

          <dt>三角形</dt><dd><b>${fmt(pattern.polys.length)}</b>・cellSize <b>${stats.cell}</b></dd>
          <dt>產生／繪製</dt><dd><b>${fmtMs(stats.gen)}</b>／<b>${fmtMs(stats.draw)}</b></dd>
          <dt>PNG</dt><dd>${png == null ? "編碼中…" : `<b>${bytes(png)}</b>`}</dd>
          <dt>seed</dt><dd><b>${esc(seed)}</b></dd></dl>
          <table><thead><tr><th>coordinateDecimals</th><th>SVG 大小</th></tr></thead><tbody>${stats.svg.map(([d, n]) => `<tr><td>${d}</td><td>${bytes(n)}</td></tr>`).join("")}</tbody></table>
          <p class="saved">${esc(saved)}</p>`;
      }
      function draw() {
        const sz = SIZES[si], cell = Math.round(Math.sqrt(sz.w * sz.h) / 16);
        const t0 = performance.now();
        pattern = trianglify({ width: sz.w, height: sz.h, seed, cellSize: cell, xColors: "random", yColors: "random" });
        const t1 = performance.now();
        pattern.toCanvas(cv, { scaling: SCALES[sc][1], applyCssScaling: false });
        const t2 = performance.now();
        fit();
        stats = { cell, gen: t1 - t0, draw: t2 - t1, svg: [0, 1, 2, -1].map((d) => [d, new Blob([svgString(d)]).size]) };
        png = null;
        saved = "";
        renderInfo();
        const token = ++seq;
        cv.toBlob((b) => { if (token === seq && ctx.active && b) { png = b.size; renderInfo(); } }, "image/png");
      }
      const redraw = scheduler(ctx, draw);
      draw();
      observe(ctx, pv, () => { fit(); renderInfo(); });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "ctx.bench・trianglify()＋toCanvas()・縮小 cellSize 增加三角形",
    desc: "固定 1920 × 1080 畫板，逐級縮小 cellSize，讓三角形從 5000 個加到 50 萬個，量每一級從產生到畫完的時間。產生包含格點、Delaunay 三角化與逐一呼叫 colorFunction；繪製是 toCanvas，每個三角形畫兩次（2px 補縫描邊加填色）。下方可切換 lab 混色、rgb 混色、64 色查表，看出 chroma 混色佔多少成本。",
    hint: "選混色模式，按「開始測試」",
    mount(ctx) {
      ctx.html(`<div class="tbox stress"><canvas class="pv"></canvas><div class="res"><table><thead><tr><th>三角形</th><th>cellSize</th><th>產生</th><th>繪製</th><th>模式</th></tr></thead><tbody></tbody></table></div></div>`);
      const pv = ctx.$(".pv"), res = ctx.$(".res"), tbody = ctx.$(".res tbody");
      const W = 1920, H = 1080;
      const off = document.createElement("canvas");
      off.width = W; off.height = H;
      ctx.onCleanup(() => { off.width = off.height = 0; });
      // A 64 x 64 table of pre-mixed colours: removes the per-triangle chroma.mix cost.
      const lut = () => {
        let table = null;
        return ({ xPercent, yPercent, xScale, yScale, opts }) => {
          if (!table) {
            const xs = xScale.colors(64, null), ys = yScale.colors(64, null);
            table = [];
            for (let i = 0; i < 64; i++) for (let j = 0; j < 64; j++) table.push(mix(xs[i], ys[j], 0.5, opts.colorSpace));
          }
          return table[Math.round(xPercent * 63) * 64 + Math.round(yPercent * 63)];
        };
      };
      const MODES = [
        { name: "lab 混色", opts: () => ({ colorSpace: "lab" }) },
        { name: "rgb 混色", opts: () => ({ colorSpace: "rgb" }) },
        { name: "64 色查表", opts: () => ({ colorSpace: "lab", colorFunction: lut() }) },
      ];
      let mode = 0;
      ctx.controls.classList.add("bottom");
      ctx.group(MODES.map((m) => m.name), 0, (i) => { mode = i; });

      // Solve (W / c + 4) * (H / c + 4) = n / 2 for the cell size c (about two triangles per grid point).
      const cellFor = (n) => {
        const a = W * H, b = 4 * (W + H), c = 16 - n / 2;
        return (2 * a) / (-b + Math.sqrt(b * b - 4 * a * c));
      };
      function generate(n) {
        const cell = cellFor(n);
        const t0 = performance.now();
        const p = trianglify({ width: W, height: H, cellSize: cell, variance: 0.75, seed: "bench", xColors: "Spectral", yColors: "PuBuGn", ...MODES[mode].opts() });
        const t1 = performance.now();
        p.toCanvas(off, { scaling: false });
        const t2 = performance.now();
        return { n: p.polys.length, cell, gen: t1 - t0, draw: t2 - t1, mode: MODES[mode].name };
      }
      function show() {
        const w = pv.clientWidth, hh = pv.clientHeight;
        if (w < 2 || hh < 2) return;
        pv.width = w; pv.height = hh;
        const g = pv.getContext("2d"), k = Math.max(w / W, hh / H);
        g.drawImage(off, (w - W * k) / 2, (hh - H * k) / 2, W * k, H * k);
      }
      function addRow(r) {
        res.classList.add("has");
        tbody.append(h("tr", {},
          h("td", { text: fmtCompact(r.n) }), h("td", { text: r.cell.toFixed(1) }),
          h("td", { text: fmtMs(r.gen) }), h("td", { text: fmtMs(r.draw) }), h("td", { class: "m", text: r.mode })));
      }
      ctx.bench({
        label: "三角形數", unit: "個",
        sizes: [5000, 10000, 20000, 50000, 100000, 150000, 200000, 300000, 500000],
        target: 1000, budget: 2000,
        run(n) {
          const r = generate(n);
          // Draw the preview and table after the timer stops so they are not counted.
          ctx.timeout(() => { show(); addRow(r); }, 0);
        },
        note: "級距是目標三角形數，cellSize 由 (W/c+4)(H/c+4) ≈ n/2 反推；實際數量，以及產生、繪製分開計時，列在右上表格（寬螢幕才顯示）。全部在主執行緒同步執行，單級超過 2 秒就停止加碼，級距每次最多放大 2.5 倍，避免一次卡住太久。數十萬個三角形時，每個三角形都是一個帶 chroma 顏色物件的 JS 物件，記憶體用量也會明顯上升。",
      });
      ctx.on(ctx.$("[data-sc-run]"), "click", () => { tbody.textContent = ""; res.classList.remove("has"); });
      generate(5000);
      show();
      ctx.onResize(show);
    },
  },
] });
</script>
</body>
</html>
