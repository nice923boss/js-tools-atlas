<script type="module">
// troika-three-text showcase: SDF text in three.js, from the original hero title to a text-count stress ramp.
// Every scene owns its WebGLRenderer and releases the GL context on unmount (dispose + forceContextLoss).
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Text, BatchedText, getCaretAtPoint, getSelectionRects } from "https://cdn.jsdelivr.net/npm/troika-three-text@0.52.5/dist/troika-three-text.esm.js";

const { h, fmt } = Showcase;
const PALETTE = [0xf7df1e, 0x4cc9f0, 0xf72585, 0x7bd389, 0xff8c42, 0x9d8cff];
const FS = "https://cdn.jsdelivr.net/npm/@fontsource";
const FONTS = [
  { value: "", label: "Noto Sans（預設）" },
  { value: `${FS}/lobster@5.3.0/files/lobster-latin-400-normal.woff`, label: "Lobster" },
  { value: `${FS}/jetbrains-mono@5.3.0/files/jetbrains-mono-latin-400-normal.woff`, label: "JetBrains Mono" },
  { value: `${FS}/noto-serif@5.3.0/files/noto-serif-latin-400-normal.woff`, label: "Noto Serif" },
  { value: `${FS}/press-start-2p@5.3.0/files/press-start-2p-latin-400-normal.woff`, label: "Press Start 2P" },
];
const MONO = FONTS[2].value;

// CJK punctuation fix: troika's automatic fallback draws 、 and 。 misplaced (its data picks Mongolian/Yi
// glyphs for them), and Noto Sans TC centers its punctuation through GPOS, which troika's parser skips.
// Noto Sans JP slice 119 holds 、。，and kana with self-positioned glyphs but no Han characters, so using it
// as the primary font fixes punctuation while Han and Latin still fall back to Noto Sans TC / Noto Sans via lang.
// Its katakana middle dot (U+30FB) is misplaced the same way, so 3D strings separate items with U+00B7 instead.
const PUNCT = (w) => `${FS}/noto-sans-jp@5.3.0/files/noto-sans-jp-119-${w}-normal.woff`;

// Every CJK string here is Traditional Chinese. Without lang, troika's Unicode fallback picks Simplified glyph forms.
// An unsynced Text has an empty bounding sphere, so frustum culling can skip it (and its first sync) when it sits
// near the view edge; syncing once after the caller's property assignments avoids that.
function makeText(props = {}) {
  const t = new Text();
  t.lang = "zh-Hant";
  t.anchorX = "center";
  t.anchorY = "middle";
  Object.assign(t, props);
  if (!("font" in props)) t.font = PUNCT(t.fontWeight === "bold" ? 700 : 400);
  queueMicrotask(() => t.sync());
  return t;
}
// Only valid for a Text with pending changes: sync(cb) skips the callback when nothing needs syncing.
const synced = (t) => new Promise((resolve) => t.sync(resolve));
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

// Free geometries, materials and textures under root. Text.dispose() frees its glyph geometry;
// troika derives its shader from the base material, so custom base materials are passed in `extra`.
function disposeAll(root, extra) {
  const seen = new Set();
  const free = (x) => { if (x && !seen.has(x) && typeof x.dispose === "function") { seen.add(x); x.dispose(); } };
  const freeMat = (m) => { if (!m) return; for (const v of Object.values(m)) if (v && v.isTexture) free(v); free(m); };
  root.traverse((o) => {
    if (o instanceof Text) { free(o); return; }
    free(o.geometry);
    [].concat(o.material || []).forEach(freeMat);
  });
  for (const x of extra) (x && x.isMaterial ? freeMat : free)(x);
}

// One renderer + scene + camera per showcase scene. The camera view is shifted so the
// subject stays centred in the area not covered by the control cluster.
function stage(ctx, o = {}) {
  const host = o.host || ctx.el;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const canvas = renderer.domElement;
  canvas.className = "gl";
  host.append(canvas);
  const scene = new THREE.Scene();
  const bg = o.bg ?? 0x0e1013;
  scene.background = new THREE.Color(bg);
  if (o.fog) scene.fog = new THREE.Fog(bg, o.fog[0], o.fog[1]);
  const fov = o.fov ?? 45;
  const camera = new THREE.PerspectiveCamera(fov, 1, o.near ?? 0.05, o.far ?? 200);
  camera.position.set(...(o.pos || [0, 0, 6]));
  let controls = null;
  if (o.orbit !== false) {
    controls = new OrbitControls(camera, canvas);
    controls.target.set(...(o.target || [0, 0, 0]));
    controls.enableDamping = true;
    controls.enablePan = false;
    Object.assign(controls, o.orbit || {});
  } else {
    camera.lookAt(...(o.target || [0, 0, 0]));
  }
  const frameFns = [], sizeFns = [], extra = [];
  const S = {
    renderer, scene, camera, controls, canvas, host, width: 1, height: 1, availH: 1, full: 1,
    render: () => renderer.render(scene, camera),
    onFrame(fn) { frameFns.push(fn); },
    onSize(fn) { sizeFns.push(fn); fn(S.width, S.height); },
    own(...xs) { extra.push(...xs); return xs[0]; },
  };
  let lastKey = "";
  const fit = () => {
    const w = Math.max(1, host.clientWidth), hh = Math.max(1, host.clientHeight);
    const top = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-h")) || 0;
    const bot = parseFloat(ctx.el.style.getPropertyValue("--sc-ctl-b")) || 0;
    const key = `${w}x${hh}:${top}:${bot}`;
    if (key === lastKey) return;
    lastKey = key;
    const d = Math.max(-hh * 0.4, Math.min(hh * 0.4, top - bot));
    S.width = w; S.height = hh; S.full = hh + Math.abs(d); S.availH = hh - Math.abs(d);
    renderer.setSize(w, hh);
    camera.aspect = w / S.full;
    if (d) camera.setViewOffset(w, S.full, 0, d < 0 ? -d : 0, w, hh); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    for (const fn of sizeFns) fn(w, hh);
  };
  fit();
  const timer = new THREE.Timer();
  ctx.raf((t) => {
    fit();
    timer.update(t);
    const dt = Math.max(0, Math.min(timer.getDelta(), 0.1)), time = timer.getElapsed();
    for (const fn of frameFns) fn(dt, time);
    if (controls) controls.update(dt);
    S.render();
  });
  ctx.onCleanup(() => {
    if (controls) controls.dispose();
    timer.dispose();
    disposeAll(scene, extra);
    renderer.dispose();
    renderer.forceContextLoss();
    canvas.remove();
  });
  return S;
}

// Camera distance that fits a halfW x halfH box into the visible (uncovered) part of the view.
function fitDistance(S, halfW, halfH, margin = 1.12) {
  const tanV = Math.tan(THREE.MathUtils.degToRad(S.camera.fov) / 2);
  const dv = (halfH * S.full) / (S.availH * tanV);
  const dh = halfW / (tanV * S.camera.aspect);
  return Math.max(dv, dh) * margin;
}
function chip(ctx, html) {
  const el = h("div", { class: "chip" });
  el.innerHTML = html;
  ctx.el.append(el);
  let last = html;
  return (next) => { if (next !== last) { last = next; el.innerHTML = next; } };
}
// Keep a camera at `dist` from `target`, easing both so layout changes do not jump.
function easeView(S, target, dist, k = 0.12) {
  const c = S.controls, off = new THREE.Vector3();
  const step = off.copy(target).sub(c.target).multiplyScalar(k);
  c.target.add(step);
  S.camera.position.add(step);
  off.copy(S.camera.position).sub(c.target);
  const len = off.length();
  off.setLength(len + (dist - len) * k);
  S.camera.position.copy(c.target).add(off);
}

const NAMES = ["Three.js", "Babylon.js", "A-Frame", "OGL", "regl", "TWGL", "model-viewer", "Shader Park", "glslCanvas", "curtains.js", "GPU.js", "three-vrm", "postprocessing", "lil-gui", "Tweakpane", "stats.js"].map((n) => n + " · ").join("");

Showcase.run({ scenes: [
  {
    id: "hero", title: "招牌標題",
    api: "new Text()・outlineBlur・colorRanges・curveRadius",
    desc: "原示範移植：標題套用 MeshStandardMaterial 受光照影響，outlineBlur 做出霓虹光暈，colorRanges 逐字上色；後方一圈工具名稱用 curveRadius 貼在圓柱內側，並依 blockBounds 調整字級剛好繞一圈。",
    hint: "輸入文字即時更新・拖曳旋轉・滾輪放大看 SDF 字邊依然銳利",
    mount(ctx) {
      const input = h("input", { type: "text", value: "JS 工具圖鑑", maxlength: "16", "aria-label": "標題文字" });
      ctx.controls.append(h("label", { class: "sc-field" }, "標題", input));
      const S = stage(ctx, { bg: 0x0b0c10, fog: [14, 40], pos: [0, 0.4, 6.2], orbit: { minDistance: 1.2, maxDistance: 14 } });
      const { scene, camera } = S;
      scene.add(new THREE.AmbientLight(0xffffff, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 2.2);
      light.position.set(2, 3, 4);
      scene.add(light);

      const title = makeText({
        text: "JS 工具圖鑑", fontSize: 0.95, fontWeight: "bold", letterSpacing: 0.04,
        material: S.own(new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.2 })),
        color: 0xf7df1e, outlineWidth: "4%", outlineColor: 0xf72585, outlineBlur: "18%", outlineOpacity: 0.75,
      });
      // No NBSP here: troika caches break flags per glyph, and Noto Sans maps NBSP and space to one glyph,
      // so a single NBSP would make every later space in that font unbreakable for all Text objects.
      const sub = makeText({
        text: "SDF 字形在 GPU 上渲染，任何縮放倍率都保持清晰。\n自動換行、對齊、曲面排版與描邊，中英混排都沒問題。",
        fontSize: 0.16, maxWidth: 4.2, lineHeight: 1.55, textAlign: "center", overflowWrap: "break-word", anchorY: "top", color: 0xcfd3dc,
      });
      sub.position.y = -0.25;
      // Ring of tool names on the inside of a cylinder (positive radius = axis in front of the text).
      const RING_R = 9;
      const ring = new THREE.Group();
      ring.position.y = 3.1;
      const ringText = makeText({
        text: NAMES.repeat(2), fontSize: 0.22, curveRadius: RING_R, color: 0x4cc9f0, fillOpacity: 0.9,
        material: S.own(new THREE.MeshBasicMaterial({ side: THREE.FrontSide, transparent: true })),
      });
      ringText.position.z = -RING_R;
      ring.add(ringText);
      scene.add(title, sub, ring);
      ringText.sync(() => {
        const [x0, , x1] = ringText.textRenderInfo.blockBounds;
        ringText.fontSize *= (Math.PI * 2 * RING_R) / (x1 - x0);
      });

      let rainbow = true;
      const applyColors = () => {
        title.colorRanges = rainbow ? Object.fromEntries([...title.text].map((_, i) => [i, PALETTE[i % PALETTE.length]])) : null;
      };
      ctx.toggle("外框發光", true, (on) => { title.outlineWidth = on ? "4%" : 0; title.outlineBlur = on ? "18%" : 0; });
      ctx.toggle("描邊", false, (on) => { title.strokeWidth = on ? "2.5%" : 0; title.strokeColor = 0xffffff; title.fillOpacity = on ? 0.15 : 1; });
      ctx.toggle("曲面", false, (on) => { title.curveRadius = on ? 2.4 : 0; });
      ctx.toggle("逐字上色", true, (on) => { rainbow = on; applyColors(); });
      ctx.on(input, "input", () => { title.text = input.value || " "; applyColors(); });
      applyColors();

      S.onSize(() => {
        const d = fitDistance(S, 2.6, 1.15);
        camera.position.setLength(d);
        S.controls.maxDistance = Math.max(14, d * 1.6);
      });
      S.onFrame((dt, t) => {
        ring.rotation.y = t * 0.25;
        title.position.y = 0.55 + Math.sin(t * 1.2) * 0.04;
        light.position.x = Math.sin(t * 0.6) * 4;
      });
    },
  },
  {
    id: "layout", title: "排版參數",
    api: "maxWidth・textAlign・lineHeight・letterSpacing・overflowWrap",
    desc: "排版在 Web Worker 完成，換行、對齊、行高、字距都只是屬性。黃色虛線是 maxWidth，青色框是 textRenderInfo.blockBounds 回報的實際範圍。中文沒有空白，需設 overflowWrap: \"break-word\" 才能在字與字之間換行；justify 只拉寬空白，切到英文段落才看得出效果。",
    hint: "切換對齊與中英文，拖曳滑桿看段落即時重新排版",
    mount(ctx) {
      const TEXTS = [
        "troika 把每個字形轉成 SDF 距離場，排版在 Web Worker 完成。換行時優先在空白處斷開，所以中英混排的行尾會參差；中文字之間沒有空白，要把 overflowWrap 設為 break-word，過長的一串中文才會在任意字之間換行。",
        "SDF glyphs stay crisp at any scale, and layout runs in a web worker. Wrapping, alignment, line height and letter spacing are plain properties. Justify only stretches the spaces between words, so it shows best on Latin text like this paragraph.",
      ];
      const S = stage(ctx, { pos: [0, 0, 6], orbit: { enableZoom: false, minPolarAngle: 0.9, maxPolarAngle: 2.2 } });
      const para = makeText({
        text: TEXTS[0], fontSize: 0.2, maxWidth: 3.6, lineHeight: 1.5, letterSpacing: 0, textAlign: "left",
        overflowWrap: "break-word", anchorX: "left", anchorY: "top", color: 0xecebe6,
      });
      para.position.x = -1.8;
      const boxGeo = S.own(new THREE.BufferGeometry());
      boxGeo.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(12), 3));
      const box = new THREE.LineLoop(boxGeo, S.own(new THREE.LineBasicMaterial({ color: 0x4cc9f0 })));
      box.position.z = 0.002;
      const boxLabel = makeText({ text: "blockBounds", font: MONO, fontSize: 0.1, color: 0x4cc9f0, anchorX: "left", anchorY: "top" });
      para.add(box, boxLabel);
      const guideMat = S.own(new THREE.LineDashedMaterial({ color: 0xf7df1e, dashSize: 0.07, gapSize: 0.05 }));
      let guide = null;
      const mwLabel = makeText({ font: MONO, fontSize: 0.1, color: 0xf7df1e, anchorX: "right", anchorY: "bottom" });
      S.scene.add(para, mwLabel);

      let blockH = 1;
      const view = { c: new THREE.Vector3(), d: 6 };
      const setChip = chip(ctx, "排版中…");
      const guides = () => {
        const m = para.maxWidth / 2, bottom = -blockH - 0.25;
        if (guide) { S.scene.remove(guide); guide.geometry.dispose(); }
        const g = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-m, 0.25, 0), new THREE.Vector3(-m, bottom, 0), new THREE.Vector3(m, 0.25, 0), new THREE.Vector3(m, bottom, 0),
        ]);
        guide = new THREE.LineSegments(g, guideMat);
        guide.computeLineDistances();
        S.scene.add(guide);
        mwLabel.text = `maxWidth ${para.maxWidth.toFixed(1)}`;
        mwLabel.position.set(m, 0.29, 0);
      };
      const refit = () => {
        view.c.set(0, -blockH / 2, 0);
        view.d = fitDistance(S, para.maxWidth / 2 + 0.2, blockH / 2 + 0.38);
      };
      ctx.on(para, "synccomplete", () => {
        const info = para.textRenderInfo;
        const [x0, y0, x1, y1] = info.blockBounds;
        boxGeo.attributes.position.array.set([x0, y0, 0, x1, y0, 0, x1, y1, 0, x0, y1, 0]);
        boxGeo.attributes.position.needsUpdate = true;
        boxGeo.computeBoundingSphere();
        boxLabel.position.set(x0, y0 - 0.05, 0);
        blockH = y1 - y0;
        const lines = Math.round(blockH / (para.fontSize * para.lineHeight));
        setChip(`實際寬度 <b>${(x1 - x0).toFixed(2)}</b>／maxWidth <b>${para.maxWidth.toFixed(2)}</b>・<b>${lines}</b> 行・排版 <b>${info.timings.typesetting.toFixed(1)}</b> ms`);
        guides();
        refit();
      });
      guides();
      S.onSize(refit);
      S.onFrame(() => easeView(S, view.c, view.d));

      ctx.group(["左", "中", "右", "齊行"], 0, (i) => { para.textAlign = ["left", "center", "right", "justify"][i]; });
      ctx.group(["中文", "EN"], 0, (i) => { para.text = TEXTS[i]; });
      ctx.slider("寬度", { min: 1.6, max: 5, step: 0.1, value: 3.6, format: (v) => v.toFixed(1) }, (v) => { para.maxWidth = v; para.position.x = -v / 2; guides(); });
      ctx.slider("行高", { min: 1, max: 2.4, step: 0.05, value: 1.5, format: (v) => v.toFixed(2) }, (v) => { para.lineHeight = v; });
      ctx.slider("字距", { min: -0.05, max: 0.3, step: 0.01, value: 0, format: (v) => v.toFixed(2) }, (v) => { para.letterSpacing = v; });
    },
  },
  {
    id: "outline", title: "描邊與陰影",
    api: "outlineWidth・outlineBlur・outlineOffsetX/Y・strokeWidth・fillOpacity",
    desc: "外框、發光、投影都是同一組 outline 參數：outlineWidth 往外擴、outlineBlur 柔化、outlineOffsetX/Y 位移成投影；strokeWidth 則是沿字形邊緣描線，搭配 fillOpacity: 0 就成了鏤空字。這些都在著色器計算，調整時不必重新排版。",
    hint: "拖曳滑桿調整寬度、模糊、偏移，四格同步更新",
    mount(ctx) {
      const S = stage(ctx, { bg: 0x252a33, pos: [0, 0, 6], orbit: { minDistance: 2, maxDistance: 20 } });
      const p = { w: 6, b: 30, o: 8 };
      const CELLS = [
        { word: "外框", color: 0xffffff, cap: () => `outlineWidth: "${p.w}%"`,
          set: (t) => Object.assign(t, { outlineWidth: `${p.w}%`, outlineBlur: 0, outlineColor: 0xf72585 }) },
        { word: "發光", color: 0xffffff, cap: () => `outlineBlur: "${p.b}%"`,
          set: (t) => Object.assign(t, { outlineWidth: `${p.w / 2}%`, outlineBlur: `${p.b}%`, outlineColor: 0x4cc9f0 }) },
        { word: "投影", color: 0xf7df1e, cap: () => `outlineOffsetX/Y: ±${p.o}%`,
          set: (t) => Object.assign(t, { outlineOffsetX: `${p.o}%`, outlineOffsetY: `-${p.o}%`, outlineBlur: `${p.b / 3}%`, outlineColor: 0x000000, outlineOpacity: 0.8 }) },
        { word: "鏤空", color: 0xffffff, cap: () => `strokeWidth: "${p.w / 2}%"`,
          set: (t) => Object.assign(t, { strokeWidth: `${p.w / 2}%`, strokeColor: 0xf7df1e, fillOpacity: 0 }) },
      ];
      const board = new THREE.Group();
      S.scene.add(board);
      const cardGeo = S.own(new THREE.PlaneGeometry(2.3, 1.42));
      const cardMat = S.own(new THREE.MeshBasicMaterial({ color: 0x323946 }));
      const cells = CELLS.map((c) => {
        const g = new THREE.Group();

      });
      ctx.ramp({
        label: "Text 物件", unit: "個",
        steps: [100, 300, 1000, 2000, 4000, 8000, 16000],
        minFps: 30,
        async apply(n) {
          count = n;
          await grow(n);
          if (ctx.active) place();
        },
        metrics: () => ({ "Draw calls": renderer.info.render.calls, 字形數: glyphs, 新增排版: lastSync }),
        note: "獨立模式下每個 Text 都是一個 Mesh，draw call 隨數量線性增加；BatchedText 只有一次 draw call，但每格仍逐一更新成員矩陣與 uniform，CPU 成本同樣隨成員數成長。新增文字的排版在 Worker 進行，等全部完成才開始量測 FPS。",
      });
    },
  },
] });
</script>
</body>
</html>
