<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>troika-three-text 示範：3D 中文字標題</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"中文字型會依需要自動下載字形子集"}</script>
<style>
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #edit { position: fixed; left: 12px; top: 12px; z-index: 40; display: flex; gap: 6px; align-items: center; }
  #edit input { width: 170px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); outline: none; }
  #edit input:focus { border-color: var(--accent); }
  .controls { top: 12px; }
  .btn { padding: 7px 10px; font-size: 12px; }
  @media (max-width: 560px) { .controls { top: 56px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="edit"><input id="title" value="JS 工具圖鑑" maxlength="16" aria-label="標題文字"></div>
<div class="controls" id="opts"></div>
<div class="hint">輸入文字即時更新・拖曳旋轉・滾輪放大看 SDF 字邊依然銳利</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
  "troika-three-utils": "https://cdn.jsdelivr.net/npm/troika-three-utils@0.52.5/dist/troika-three-utils.esm.js",
  "troika-worker-utils": "https://cdn.jsdelivr.net/npm/troika-worker-utils@0.52.0/dist/troika-worker-utils.esm.js",
  "webgl-sdf-generator": "https://cdn.jsdelivr.net/npm/webgl-sdf-generator@1.1.1/dist/webgl-sdf-generator.mjs",
  "bidi-js": "https://cdn.jsdelivr.net/npm/bidi-js@1.1.0/dist/bidi.mjs"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Text } from "https://cdn.jsdelivr.net/npm/troika-three-text@0.52.5/dist/troika-three-text.esm.js";

const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
scene.fog = new THREE.Fog(0x0b0c10, 14, 40);
const camera = new THREE.PerspectiveCamera(45, 1, 0.05, 100);
camera.position.set(0, 0.4, 6.2);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 1.2;
controls.maxDistance = 12;
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 2.2);
light.position.set(2, 3, 4);
scene.add(light);

// Title: lit material, per-character colors, outline glow
const title = new Text();
title.text = "JS 工具圖鑑";
title.fontSize = 0.95;
title.fontWeight = "bold";
title.anchorX = "center";
title.anchorY = "middle";
title.letterSpacing = 0.04;
title.material = new THREE.MeshStandardMaterial({ roughness: 0.35, metalness: 0.2 });
title.color = 0xf7df1e;
title.outlineWidth = "4%";
title.outlineColor = 0xf72585;
title.outlineBlur = "18%";
title.outlineOpacity = 0.75;
title.position.y = 0.55;
scene.add(title);

// Subtitle with wrapping and centered alignment
const sub = new Text();
// NBSP keeps the CJK/Latin spacing without creating early line-break opportunities
sub.text = "SDF 字形在 GPU 上渲染，任何縮放倍率都保持清晰；支援自動換行、對齊、曲面排版、外框與描邊，中文與英文 English 混排也沒問題。".replace(/ /g, "\u00a0");
sub.fontSize = 0.16;
sub.maxWidth = 4.2;
sub.lineHeight = 1.55;
sub.textAlign = "center";
sub.overflowWrap = "break-word"; // CJK has no spaces, allow breaks anywhere
sub.anchorX = "center";
sub.anchorY = "top";
sub.color = 0xcfd3dc;
sub.position.y = -0.25;
scene.add(sub);

// Ring of tool names on the inside of a cylinder behind the title (concave curve, front half culled)
const ring = new THREE.Group();
scene.add(ring);
const NAMES = "Three.js・Babylon.js・A-Frame・OGL・regl・TWGL・model-viewer・Shader Park・glslCanvas・curtains.js・GPU.js・three-vrm・postprocessing・lil-gui・Tweakpane・stats.js・";
const ringText = new Text();
ringText.text = NAMES.repeat(2);
ringText.fontSize = 0.22;
const RING_R = 9;
ringText.curveRadius = RING_R; // positive radius puts the cylinder axis in front of the text (concave wrap)
ringText.material = new THREE.MeshBasicMaterial({ side: THREE.FrontSide, transparent: true });
ringText.anchorX = "center";
ringText.anchorY = "middle";
ringText.color = 0x4cc9f0;
ringText.fillOpacity = 0.9;
ringText.position.z = -RING_R; // so the cylinder axis sits on the group origin
ring.add(ringText);
ring.position.y = 3.1;

// Toggle options to show the main Text properties
const OPTS = [
  ["glow", "外框發光", true, (on) => { title.outlineWidth = on ? "4%" : 0; title.outlineBlur = on ? "18%" : 0; }],
  ["stroke", "描邊", false, (on) => { title.strokeWidth = on ? "2.5%" : 0; title.strokeColor = 0xffffff; title.fillOpacity = on ? 0.15 : 1; }],
  ["curve", "曲面", false, (on) => { title.curveRadius = on ? 2.4 : 0; }],
  ["rainbow", "逐字上色", true, (on) => { applyColors(on); }],
];
let rainbow = true;
function applyColors(on) {
  rainbow = on;
  if (!on) { title.colorRanges = null; title.sync(); return; }
  const palette = [0xf7df1e, 0x4cc9f0, 0xf72585, 0x7bd389, 0xff8c42, 0x9d8cff];
  const ranges = {};
  [...title.text].forEach((ch, i) => { ranges[i] = palette[i % palette.length]; });
  title.colorRanges = ranges;
  title.sync();
}
const opts = document.getElementById("opts");
for (const [, label, initial, fn] of OPTS) {
  const b = document.createElement("button");
  b.className = "btn";
  b.textContent = label;
  let on = initial;
  b.setAttribute("aria-pressed", String(on));
  b.addEventListener("click", () => { on = !on; b.setAttribute("aria-pressed", String(on)); fn(on); title.sync(); });
  opts.append(b);
}

document.getElementById("title").addEventListener("input", (e) => {
  title.text = e.target.value || " ";
  applyColors(rainbow);
});
applyColors(true);
sub.sync();
// Scale the ring font so the text wraps exactly once around the cylinder
ringText.sync(() => {
  const [x0, , x1] = ringText.textRenderInfo.blockBounds;
  ringText.fontSize *= (Math.PI * 2 * RING_R) / (x1 - x0);
  ringText.sync();
});

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.position.setLength(innerWidth < innerHeight ? 10.5 : 6.4);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  ringText.parent.rotation.y = t * 0.25;
  title.position.y = 0.55 + Math.sin(t * 1.2) * 0.04;
  light.position.x = Math.sin(t * 0.6) * 4;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
