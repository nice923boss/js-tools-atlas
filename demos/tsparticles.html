// tsParticles 4.4.0 showcase. The full bundle provides interactions, shapes, emitters, absorbers and
// updaters; canvas-mask and themes are separate plugins loaded on top of it.
const { h } = Showcase;
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#9d8cff", "#ff8c42"];
const rootCss = getComputedStyle(document.documentElement);
const FONT = rootCss.getPropertyValue("--font").trim() || "system-ui, sans-serif";
// The text shape wraps its font name in quotes, so it takes a single family, not a stack.
const TEXT_FONT = /Win/.test(navigator.userAgent) ? "Microsoft JhengHei" : /Mac|iPhone|iPad/.test(navigator.userAgent) ? "PingFang TC" : "Noto Sans TC";
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const rnd = (lo, hi) => lo + Math.random() * (hi - lo);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const fill = (value) => ({ fill: { enable: true, color: { value } } });

const ready = (async () => {
  await loadFull(tsParticles);
  await loadCanvasMaskPlugin(tsParticles);
  await loadThemesPlugin(tsParticles);
})();

const BASE = { fullScreen: { enable: false }, detectRetina: true, fpsLimit: 120 };
let uid = 0;
const unmounted = () => Object.assign(new Error("scene unmounted"), { name: "AbortError" });

// Load one container into host; it is destroyed automatically when the scene unmounts.
async function load(ctx, host, options, prefix = "tsp") {
  await ready;
  if (!ctx.active) throw unmounted();
  const c = await tsParticles.load({
    id: `${prefix}-${++uid}`, element: host,
    options: { ...BASE, ...options, interactivity: { detectsOn: "canvas", ...options.interactivity } },
  });
  const kill = () => { if (c && !c.destroyed) c.destroy(); };
  if (!ctx.active) { kill(); throw unmounted(); }
  ctx.onCleanup(kill);
  return c;
}

// A host that swaps containers; a later set() wins when two loads overlap.
function slot(ctx, host, prefix) {
  let cur = null, token = 0;
  return {
    get c() { return cur && !cur.destroyed ? cur : null; },
    async set(options) {
      const my = ++token;
      if (cur && !cur.destroyed) cur.destroy();
      cur = null;
      const c = await load(ctx, host, options, prefix);
      if (my !== token) { c.destroy(); return null; }
      return (cur = c);
    },
  };
}

// Demo cursor: feeds synthetic pointer events to the canvas so hover modes show without a mouse.
// It stops for good as soon as a real pointer moves over the host.
function ghost(ctx, host, getC, { clickEvery = 0, path = (t) => [0.5 + 0.33 * Math.sin(t * 0.7), 0.5 + 0.3 * Math.sin(t * 1.13 + 1)] } = {}) {
  const dot = h("div", { class: "ghost" });
  host.append(dot);
  let t = 0, last = performance.now(), live = true;
  const stop = ctx.raf((now, dt) => {
    const c = getC();
    const cv = c && !c.destroyed && c.canvas.domElement;
    if (!cv || !cv.isConnected) return;
    t += dt / 1000;
    const r = cv.getBoundingClientRect();
    const [fx, fy] = path(t);
    const x = fx * r.width, y = fy * r.height;
    dot.style.transform = `translate(${x - 8}px, ${y - 8}px)`;
    const at = { clientX: r.left + x, clientY: r.top + y, bubbles: true, pointerType: "mouse" };
    cv.dispatchEvent(new PointerEvent("pointermove", at));
    if (clickEvery && now - last > clickEvery) {
      last = now;
      cv.dispatchEvent(new PointerEvent("pointerdown", at));
      cv.dispatchEvent(new PointerEvent("pointerup", at));
      dot.classList.remove("tap");
      void dot.offsetWidth;
      dot.classList.add("tap");
    }
  });
  ctx.on(host, "pointermove", (e) => {
    if (!e.isTrusted || !live) return;
    live = false;
    stop();
    dot.remove();
  });
}

// ---------- scene 4: emitters and one absorber ----------
// AbsorberInstance.draw() translates the shared context without restoring it, and the core only
// resets the transform while drawing a particle. With no particles on screen (or a second absorber)
// the offset piles up, so each plugin draw is wrapped in save/restore.
function guardPluginDraw(c) {
  for (const p of c.plugins) {
    if (typeof p.draw !== "function") continue;
    const draw = p.draw.bind(p);
    p.draw = (context, delta) => { context.save(); draw(context, delta); context.restore(); };
  }
}
// gap: horizontal distance of each emitter from the centre, in percent of the width.
function absorberOptions(orbit, gap) {
  const emitter = (name, position, direction, color, size) => ({
    name, position, direction, size, rate: { quantity: 3, delay: 0.08 }, particles: { paint: fill(color) },
  });
  return {
    ...BG,
    particles: {
      number: { value: 0 }, paint: fill(COLORS), size: { value: { min: 2, max: 4 } },
      // Orbiting particles are placed by the absorber, not by velocity, so a life span (not the

      ...(orbit ? { life: { count: 1, duration: { value: { min: 6, max: 9 } } } } : {}),

function fitFont(text, w, h, weight = 900) {
  const g = document.createElement("canvas").getContext("2d");
  g.font = `${weight} 100px ${FONT}`;
  return Math.floor(Math.min((w * 0.86) / g.measureText(text).width * 100, h * 0.62));
}
function gradientCanvas(text, px) {
  const cv = document.createElement("canvas");
  const g = cv.getContext("2d");
  g.font = `900 ${px}px ${FONT}`;
  cv.width = Math.ceil(g.measureText(text).width + 20);
  cv.height = Math.ceil(px * 1.25);
  const grad = g.createLinearGradient(0, 0, cv.width, cv.height);
  ["#f72585", "#ff8c42", "#f7df1e", "#7bd389", "#4cc9f0", "#9d8cff"].forEach((c, i, a) => grad.addColorStop(i / (a.length - 1), c));
  g.font = `900 ${px}px ${FONT}`;
  g.fillStyle = grad;
  g.textBaseline = "middle";
  g.fillText(text, 10, cv.height / 2);
  return cv;
}

const EVENT_NAMES = {
  containerInit: "初始化", containerBuilt: "建立完成", particlesSetup: "粒子就緒", containerStarted: "開始",
  containerPlay: "播放", containerPaused: "暫停", containerStopped: "停止", containerDestroyed: "銷毀",
};

// ---------- scene 8: stress ----------
const stressOptions = (n, links, collisions) => ({
  ...BG,
  fpsLimit: 240,
  particles: {
    number: { value: n, density: { enable: false } },
    paint: fill(COLORS),
    size: { value: { min: 1, max: 2.5 } },
    move: { enable: true, speed: 1.5, outModes: "bounce" },
    links: { enable: links, distance: 40, opacity: 0.35, width: 1, color: "#4cc9f0" },
    collisions: { enable: collisions, mode: "bounce" },
  },
});

Showcase.run({ scenes: [
  {
    id: "presets", title: "粒子背景",
    api: "tsParticles.load({ id, element, options })",
    desc: "原版的三組預設：連線網、閃爍星空、彩紙噴泉。切換時銷毀舊容器，以新選項重新載入同一個元素。",
    hint: "右上切換預設・移動滑鼠接手黃色游標・點擊畫面新增粒子",
    async mount(ctx) {
      ctx.html(`<div class="tsp"></div><div class="hero"><h1>粒子<b>背景</b>產生器</h1><p></p></div>`);
      const s = slot(ctx, ctx.$(".tsp"));
      const sub = ctx.$(".hero p");
      const show = (i) => { sub.textContent = PRESETS[i].sub; return s.set(PRESETS[i].options); };
      ctx.group(["連線網", "星空", "彩紙噴泉"], 0, (i) => show(i));
      ctx.fps({ position: "right bottom", extra: count(s) });
      ghost(ctx, ctx.$(".tsp"), () => s.c);
      await show(0);
    },
  },
  {
    id: "interact", title: "滑鼠互動",
    api: "interactivity.events.onHover.mode・onClick.mode・modes.{grab, bubble, repulse, attract, connect, trail, slow}",
    desc: "同一批粒子切換七種滑過模式與五種點擊模式。模式直接改 container.actualOptions，不用重新載入。",
    hint: "移動滑鼠接手黃色游標・下拉選單換點擊模式後點畫面",
    async mount(ctx) {
      ctx.html(`<div class="tsp"></div><div class="chip"></div>`);
      const host = ctx.$(".tsp"), chip = ctx.$(".chip");
      const { width, height } = ctx.size();
      let hover = 0, click = "push", c = null;
      const paint = () => {
        const label = CLICK.find((x) => x[0] === click)[1];
        chip.innerHTML = `滑過 <code>${HOVER[hover][1]}</code> ${HOVER[hover][0]}　點擊 <code>${click}</code> ${label}`;
      };
      const apply = () => {
        if (!c) return;
        const ev = c.actualOptions.interactivity.events;
        ev.onHover.mode = HOVER[hover][1];
        ev.onClick.mode = click;
        paint();
      };
      ctx.group(HOVER.map((x) => x[0]), 0, (i) => { hover = i; apply(); });
      ctx.select("點擊", CLICK.map(([value, label]) => ({ value, label: `${value} ${label}` })), "push", (v) => { click = v; apply(); });
      ctx.fps({ position: "right bottom", extra: () => ({ 粒子: c ? c.particles.count : 0 }) });
      c = await load(ctx, host, interactOptions(Math.round(clamp((width * height) / 6000, 50, 170))));
      paint();
      ghost(ctx, host, () => c, { clickEvery: 2600 });
    },
  },
  {
    id: "shapes", title: "粒子形狀",
    api: "particles.shape.type・shape.options.{polygon, star, emoji, text, image}・paint.stroke",
    desc: "八種內建形狀各開一個容器。image 指向單色 SVG 並開 replaceColor，函式庫會把填色換成粒子顏色；line 用 stroke 畫線段。",
    hint: "滑過各格會放大粒子・開關「旋轉」看 rotate.animation",
    async mount(ctx) {
      ctx.html(`<div class="grid">${SHAPES.map(([key, name]) => `<div class="cell"><div class="tsp"></div><div class="lab"><code>${key}</code> ${name}</div></div>`).join("")}</div>`);
      const hosts = ctx.$$(".cell .tsp").map((el) => slot(ctx, el));
      let spin = true;
      const all = () => Promise.all(hosts.map((s, i) => s.set(shapeOptions(SHAPES[i][0], SHAPES[i][2], spin))));
      ctx.toggle("旋轉", spin, (v) => { spin = v; all(); });
      await all();
    },
  },
  {
    id: "emitters", title: "發射器與吸收器",
    api: "emitters・absorbers.{ destroy, orbits, size.limit }・container.addEmitter()・pauseEmitter()",
    desc: "兩個發射器持續噴粒子，吸收器用質量吸引畫面上每一顆粒子。「吞噬」吃掉粒子後半徑與質量一起長大到上限；「軌道」開 orbits，粒子繞著它轉並慢慢螺旋墜入。吸收器可以拖曳。",
    hint: "拖曳吸收器・＋發射器在隨機位置加一個 5 秒的發射器・關掉「發射中」看吸收器清場",
    async mount(ctx) {
      ctx.html(`<div class="tsp"></div>`);
      const host = ctx.$(".tsp");
      const s = slot(ctx, host);
      const tag = host.appendChild(h("div", { class: "tag-abs" }));
      let on = true;
      const emitting = () => {
        const c = s.c;
        if (c) for (let i = 0; c.getEmitter(i); i++) (on ? c.playEmitter(i) : c.pauseEmitter(i));
      };
      const show = async (orbit) => {
        const { width, height } = ctx.size();
        const c = await s.set(absorberOptions(orbit, (33 * Math.min(width, height)) / Math.max(1, width)));
        if (!c) return;
        guardPluginDraw(c);
        emitting();
      };
      ctx.group(["吞噬", "軌道"], 0, (i) => show(i === 1));
      ctx.button("＋發射器", () => s.c && s.c.addEmitter({
        position: { x: rnd(15, 85), y: rnd(25, 80) }, direction: "none", rate: { quantity: 3, delay: 0.08 },
        size: { width: 0, height: 0 }, life: { count: 1, duration: 5 }, particles: { paint: fill(pick(COLORS)) },
      }));
      ctx.toggle("發射中", true, (v) => { on = v; emitting(); });
      ctx.fps({ position: "right bottom", extra: count(s) });
      ctx.raf(() => {
        const c = s.c, a = c && c.getAbsorber(0);
        tag.style.display = a ? "" : "none";
        if (!a) return;
        const pr = c.retina.pixelRatio;
        tag.innerHTML = `${a.name}　半徑 <code>${Math.round(a.size / pr)}</code>　質量 <code>${Math.round(a.mass)}</code>`;
        tag.style.transform = `translate(-50%, 0) translate(${a.position.x / pr}px, ${(a.position.y + a.size) / pr + 8}px)`;
      });
      await show(false);
    },
  },
  {
    id: "confetti", title: "彩紙與煙火",
    api: "roll・tilt・wobble・destroy.mode \"split\"・destroy.bounds・blend",
    desc: "彩紙用 roll、tilt、wobble 做出翻面與搖擺；煙火是向上飛的粒子碰到 destroy.bounds 高度後 split 成火花，火花以 lighter 混色疊亮。",
    hint: "切換彩紙或煙火・按「再來一發」加一波",
    async mount(ctx) {
      ctx.html(`<div class="tsp"></div>`);
      const s = slot(ctx, ctx.$(".tsp"));
      let mode = 0;
      ctx.group(["彩紙", "煙火"], 0, (i) => { mode = i; s.set(i ? fireworksOptions() : confettiOptions()); });
      ctx.button("再來一發", () => {
        if (!s.c) return;
        if (mode) s.c.addEmitter(rocket({ size: { width: 80, height: 0 }, rate: { quantity: 2, delay: 0.12 }, life: { count: 1, duration: 0.7 } }));
        else s.c.addEmitter({
          position: { x: 50, y: 100 }, direction: "top", size: { width: 10, height: 0 }, rate: { quantity: 30, delay: 0.05 },
          life: { count: 1, duration: 0.2 }, particles: { move: { direction: "top", speed: { min: 110, max: 160 }, angle: { value: 70, offset: 0 } } },
        });
      }, { primary: true });
      ctx.fps({ position: "right bottom", extra: count(s) });
      await s.set(confettiOptions());
    },
  },
  {
    id: "mask", title: "文字遮罩",
    api: "canvasMask: { text | element, scale, override.color, pixels.offset }",
    desc: "canvas-mask 外掛先把文字畫在隱藏畫布，再從不透明像素隨機取點放粒子。「漸層畫布」改傳自己畫的 canvas，並讓粒子沿用像素顏色。",
    hint: "移動滑鼠撥開粒子，放開後會慢慢歸位",
    async mount(ctx) {
      ctx.html(`<div class="tsp"></div>`);
      const host = ctx.$(".tsp");
      const s = slot(ctx, host);
      let idx = 0;
      const show = () => {
        const { width, height } = ctx.size();
        const m = MASKS[idx], px = fitFont(m.text, width, height), dpr = window.devicePixelRatio || 1;
        const source = m.gradient
          ? { element: gradientCanvas(m.text, px), override: { color: true, opacity: false } }
          : { text: { color: "#ffffff", text: m.text, font: { family: FONT, size: px, weight: "900" } }, override: { color: false, opacity: false } };
        return s.set({
          ...BG,
          canvasMask: { enable: true, scale: dpr, position: { x: 50, y: 52 }, pixels: { offset: 4 }, ...source },
          particles: {
            number: { value: Math.round(clamp((width * height) / 180, 800, 3200)) },
            paint: fill(m.colors || "#ffffff"), size: { value: { min: 1.2, max: 2.2 } }, move: { enable: false },
          },
          interactivity: {
            events: { onHover: { enable: true, mode: "repulse" } },
            modes: { repulse: { distance: 70, restore: { enable: true, speed: 0.08 } } },
          },
        });
      };
      ctx.group(MASKS.map((m, i) => (i === 2 ? "漸層畫布" : m.text)), 0, (i) => { idx = i; show(); });
      ctx.fps({ position: "right bottom", extra: count(s) });
      ctx.onResize(() => show());
      ghost(ctx, host, () => s.c, { path: (t) => [0.5 + 0.36 * Math.sin(t * 0.6), 0.52 + 0.18 * Math.sin(t * 1.4)] });
      await show();
    },
  },
  {
    id: "api", title: "容器 API",
    api: "container.pause()・play()・refresh()・reset()・destroy()・loadTheme()・tsParticles.addEventListener()",
    desc: "themes 外掛切換三組主題；按鈕直接呼叫容器方法，左下記錄引擎發出的事件與粒子增減次數。",
    hint: "切換主題・按 reset() 隨機換一組選項・點畫面會新增粒子",
    async mount(ctx) {
      ctx.html(`<div class="tsp"></div><div class="log"><div class="head"></div><div class="rows"></div></div>`);
      const host = ctx.$(".tsp"), head = ctx.$(".log .head"), rowsEl = ctx.$(".log .rows");
      const s = slot(ctx, host, "tsp-api");
      const maxRows = ctx.size().height > 480 ? 8 : 4;
      const tally = { particleAdded: 0, particleRemoved: 0, particleDestroyed: 0 };
      let theme = 0, paused = false;
      const rows = [];
      const log = (code, text) => {
        const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
        rows.unshift(`<div class="row"><small>${time}</small><code>${code}</code> ${text}</div>`);
        rows.length = Math.min(rows.length, maxRows);
        rowsEl.innerHTML = rows.join("");
      };
      const onEvent = (e) => {
        const id = e && e.container && e.container.id;
        if (!id || !String(id.description).startsWith("tsp-api")) return;
        if (e.type in tally) tally[e.type]++;
        else log(e.type, EVENT_NAMES[e.type] || "");
      };
      const types = [...Object.keys(EVENT_NAMES), ...Object.keys(tally)];
      const listeners = types.map((type) => {
        const fn = (e) => onEvent({ ...e, type });
        tsParticles.addEventListener(type, fn);
        return [type, fn];
      });
      ctx.onCleanup(() => listeners.forEach(([type, fn]) => tsParticles.removeEventListener(type, fn)));
      ctx.interval(() => {
        const c = s.c;
        head.innerHTML = `${c ? (paused ? "已暫停" : "播放中") : "已銷毀"}　粒子 <code>${c ? c.particles.count : 0}</code>　新增 <code>${tally.particleAdded}</code>　移除 <code>${tally.particleRemoved + tally.particleDestroyed}</code>`;
      }, 300);

      ctx.group(THEMES.map((t) => t.name), 0, async (i) => {
        theme = i;
        if (!s.c) return;
        log("loadTheme", `「${THEMES[i].name}」`);
        await s.c.loadTheme(THEMES[i].name);
      });
      const pauseBtn = ctx.toggle("暫停", false, (v) => {
        paused = v;
        if (!s.c) return;
        log(v ? "pause()" : "play()", "");
        v ? s.c.pause() : s.c.play();
      });
      ctx.button("refresh()", () => { if (s.c) { log("refresh()", "依原選項重建"); s.c.refresh(); } });
      ctx.button("reset()", () => {
        if (!s.c) return;
        const opts = { n: Math.round(rnd(60, 200)), shape: pick(["circle", "triangle", "star", "square", "polygon"]), dist: Math.round(rnd(80, 170)), speed: +rnd(0.6, 2.4).toFixed(1) };
        log("reset()", `${opts.n} 顆 ${opts.shape}`);
        s.c.reset(apiOptions(theme, opts));
      });
      const killBtn = ctx.button("destroy()", async () => {
        if (s.c) {
          log("destroy()", "移除畫布");
          s.c.destroy();
          killBtn.textContent = "load()";
        } else {
          log("load()", "重新建立容器");
          killBtn.textContent = "destroy()";
          paused = false;
          pauseBtn.setAttribute("aria-pressed", "false");
          await s.set(apiOptions(theme));
        }
      });
      await s.set(apiOptions(theme));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "particles.number.value・links・collisions",
    desc: "逐級增加粒子數，每級以新選項重建容器並量測 FPS。可加開連線與碰撞，比較兩種鄰居查詢的額外成本。",
    hint: "按「自動加壓」・開關連線或碰撞後再測一次",
    async mount(ctx) {
      ctx.html(`<div class="stage-box"><div class="tsp"></div></div>`);
      ctx.controls.classList.add("bottom");
      const s = slot(ctx, ctx.$(".stage-box .tsp"));
      let n = 500, links = false, collisions = false;
      const reload = () => s.set(stressOptions(n, links, collisions));
      ctx.toggle("連線 links", links, (v) => { links = v; reload(); });
      ctx.toggle("碰撞 collisions", collisions, (v) => { collisions = v; reload(); });
      ctx.ramp({
        label: "粒子", unit: "顆", steps: [500, 1000, 2000, 4000, 6000, 8000, 12000, 16000, 24000], minFps: 30,
        async apply(v) { n = v; await reload(); },
        metrics: () => ({
          實際粒子: s.c ? s.c.particles.count : 0,
          模式: `${links ? "連線" : "無連線"}${collisions ? "＋碰撞" : ""}`,
        }),
        note: "每顆粒子每格都要跑 updater（移動、尺寸、透明度）再用 Canvas 2D 畫一次。開連線後每顆要用空間格子找 40 px 內的鄰居並畫線；開碰撞再多一次鄰居查詢與反彈計算。無頭瀏覽器是軟體繪圖，實機通常高出數倍。",
      });
    },
  },
] });
</script>
</body>
</html>
