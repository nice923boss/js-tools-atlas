<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tsParticles 示範：互動粒子背景</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #tsparticles { position: fixed; inset: 0; }
  .hero {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    pointer-events: none; padding: 0 20px;
  }
  .hero h1 { margin: 0; font-size: clamp(26px, 6vw, 52px); letter-spacing: .06em; font-weight: 800; }
  .hero h1 b { color: var(--accent); }
  .hero p { margin: 8px 0 0; color: var(--muted); font-size: clamp(13px, 2vw, 16px); }
</style>
</head>
<body>
<div id="tsparticles"></div>
<div class="hero">
  <h1>粒子<b>背景</b>產生器</h1>
  <p id="sub">連線網：滑鼠靠近會牽起連線</p>
</div>
<div class="controls" id="modes">
  <button class="btn" data-mode="links" aria-pressed="true">連線網</button>
  <button class="btn" data-mode="stars">星空</button>
  <button class="btn" data-mode="fountain">彩紙噴發</button>
</div>
<div class="hint">移動滑鼠互動・點擊畫面新增粒子・右上切換預設</div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@4.4.0/tsparticles.bundle.min.js"></script>
<script>
// Three option presets loaded into the same container id; tsParticles replaces the old instance on load().
const COLORS = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#9d8cff", "#ff8c42"];
const base = {
  fullScreen: { enable: false },
  background: { color: "#0e1013" },
  fpsLimit: 60,
  detectRetina: true,
};
const PRESETS = {
  links: {
    sub: "連線網：滑鼠靠近會牽起連線",
    options: {
      ...base,
      particles: {
        number: { value: 300, density: { enable: true } },
        paint: { fill: { enable: true, color: { value: COLORS } } },
        links: { enable: true, distance: 140, color: "#4cc9f0", opacity: 0.45, width: 1 },
        move: { enable: true, speed: 1.2, outModes: "bounce" },
        size: { value: { min: 1.5, max: 3.5 } },
        opacity: { value: { min: 0.5, max: 1 } },
      },
      interactivity: {
        events: { onHover: { enable: true, mode: "grab" }, onClick: { enable: true, mode: "push" } },
        modes: { grab: { distance: 200, links: { opacity: 0.9, color: "#f7df1e" } }, push: { quantity: 4 } },
      },
    },
  },
  stars: {
    sub: "星空：閃爍星點，滑鼠靠近會放大",
    options: {
      ...base,
      background: { color: "#070a16" },
      particles: {
        number: { value: 260, density: { enable: true } },
        paint: { fill: { enable: true, color: { value: ["#ffffff", "#cfe8ff", "#f7df1e", "#9d8cff"] } } },
        move: { enable: true, speed: 0.25, direction: "none", random: true, outModes: "out" },
        size: { value: { min: 0.5, max: 2.4 } },
        opacity: { value: { min: 0.1, max: 1 }, animation: { enable: true, speed: 1.2, sync: false } },
        twinkle: { particles: { enable: true, frequency: 0.04, opacity: 1, color: { value: "#f7df1e" } } },
      },
      interactivity: {
        events: { onHover: { enable: true, mode: "bubble" }, onClick: { enable: true, mode: "push" } },
        modes: { bubble: { distance: 140, size: 6, duration: 2, opacity: 1 }, push: { quantity: 8 } },
      },
    },
  },
  fountain: {
    sub: "彩紙噴發：兩個發射器持續噴出彩色粒子，滑鼠會推開它們",
    options: {
      ...base,
      particles: {
        number: { value: 0 },
        paint: { fill: { enable: true, color: { value: COLORS } } },
        shape: { type: ["circle", "square", "triangle"] },
        size: { value: { min: 3, max: 7 } },
        opacity: { value: 1 },
        rotate: { value: { min: 0, max: 360 }, direction: "random", animation: { enable: true, speed: 30 } },
        life: { duration: { sync: false, value: { min: 2, max: 4 } }, count: 1 },
        move: {
          enable: true, speed: { min: 12, max: 22 }, direction: "top", outModes: { default: "destroy", top: "none" },
          gravity: { enable: true, acceleration: 9.8 }, angle: { value: 40, offset: 0 },
        },
      },
      emitters: [
        { position: { x: 25, y: 100 }, rate: { quantity: 3, delay: 0.08 }, size: { width: 0, height: 0 } },
        { position: { x: 75, y: 100 }, rate: { quantity: 3, delay: 0.08 }, size: { width: 0, height: 0 } },
      ],
      interactivity: {
        events: { onHover: { enable: true, mode: "repulse" }, onClick: { enable: true, mode: "emitter" } },
        modes: {
          repulse: { distance: 120, speed: 1 },
          emitters: { random: { count: 1, enable: false }, value: [{ rate: { quantity: 6, delay: 0.05 }, life: { count: 1, duration: 0.6 } }] },
        },
      },
    },
  },
};

const sub = document.getElementById("sub");
async function show(mode) {
  sub.textContent = PRESETS[mode].sub;
  document.querySelectorAll("#modes .btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  await tsParticles.load({ id: "tsparticles", options: PRESETS[mode].options });
}

document.getElementById("modes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-mode]");
  if (b) show(b.dataset.mode);
});

(async () => {
  await loadFull(tsParticles);
  await show("links");
})();
</script>
</body>
</html>
