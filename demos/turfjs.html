<style>
  .tf-map { position: absolute; inset: 0; z-index: 0; background: #0b0d10; }
  .tf-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.72) contrast(1.1) saturate(.35); }
  .tf-map.leaflet-container { font: 12px/1.4 var(--font); background: #0b0d10; }
  .tf-map .leaflet-control-attribution { background: rgba(14,16,19,.75) !important; color: var(--muted); font-size: 10px; }
  .tf-map .leaflet-control-attribution a { color: var(--c2); }
  .tf-map .leaflet-bar a { background: var(--bg-2); color: var(--fg); border-color: var(--line); }
  .tf-map .leaflet-tooltip { background: var(--bg-2); color: var(--fg); border: 1px solid var(--line); box-shadow: none; font: 12px/1.4 var(--font); }
  .tf-map .leaflet-tooltip-top::before { border-top-color: var(--bg-2); }
  .tf-map .leaflet-tooltip.tf-lbl { background: var(--accent); color: var(--accent-ink); border: 0; font: 700 11.5px/1.3 var(--mono); padding: 2px 7px; }
  .tf-map .leaflet-tooltip.tf-lbl::before { display: none; }
  .tf-map .leaflet-tooltip.tf-tick { background: transparent; border: 0; padding: 0; color: var(--c1); font: 600 10.5px/1 var(--mono); text-shadow: 0 0 3px #000, 0 0 6px #000; }
  .tf-map .leaflet-tooltip.tf-tick::before { display: none; }
  .tf-you { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid #0e1013; box-shadow: 0 0 0 3px rgba(247,223,30,.4), 0 0 18px rgba(247,223,30,.8); cursor: grab; }
  .tf-handle { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--mono); color: #0e1013; border: 2px solid #0e1013; cursor: grab; box-shadow: 0 0 0 3px rgba(255,255,255,.25); }
  .tf-bike { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid #0e1013; box-shadow: 0 0 12px rgba(247,223,30,.9); }

  .tf-info { position: absolute; left: 10px; bottom: 10px; z-index: 120; width: 252px; padding: 9px 12px; font-size: 12.5px; line-height: 1.5; }
  .tf-info h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
  .tf-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
  .tf-row:last-child { border-bottom: 0; }

  .tf-row b.tf-txt { font-family: var(--font); }
  .tf-yes { color: var(--c4) !important; }
  .tf-no { color: var(--muted) !important; }
  .tf-legend { display: flex; gap: 2px; margin-top: 5px; }
  .tf-legend i { flex: 1; height: 8px; border-radius: 2px; }
  .tf-legend-n { display: flex; justify-content: space-between; font: 500 10px/1.3 var(--mono); color: var(--muted); margin-top: 2px; }
  .tf-note { margin-top: 4px; font-size: 11px; color: var(--muted); }
  @media (max-width: 560px) {
    .tf-info { width: auto; right: 50px; bottom: 22px; font-size: 11.5px; padding: 6px 9px; line-height: 1.4; }
    .tf-info h3 { font-size: 12px; margin-bottom: 2px; }
    .tf-row b { font-size: 11.5px; }
    .tf-note { display: none; }
  }

  .tf-bench { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; border-radius: 10px; border: 1px solid var(--line); background: #0b0d10; overflow: hidden; }
  .tf-bench canvas { display: block; width: 100%; height: 100%; }
  @media (max-width: 760px) { .tf-bench { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); opacity: .9; } }

<body>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Turf.js showcase: eight scenes of in-browser geospatial analysis, from the MRT buffer demo to a throughput benchmark.
const T = turf;
const { fmt, fmtMs } = Showcase;
const COL = { c1: "#f7df1e", c2: "#4cc9f0", c3: "#f72585", c4: "#7bd389", c5: "#ff8c42", c6: "#9d8cff", dim: "#5d6370", ink: "#0b0d10" };
const PALETTE = [COL.c2, COL.c3, COL.c1, COL.c4, COL.c6, COL.c5, "#5ee6c8", "#ff6b9a", "#c9a6ff", "#9ad1ff", "#ffd27a", "#b8e986"];
const RAMP = ["#16324f", "#1f5f8b", "#2a93c0", "#4cc9f0", "#9d8cff", "#f72585", "#ff8c42", "#f7df1e"];

const hex2rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
function rampColor(t) {
  const x = Math.max(0, Math.min(1, t)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(x));
  const a = hex2rgb(RAMP[i]), b = hex2rgb(RAMP[i + 1]), f = x - i;
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",")})`;
}

// Seeded RNG so every visit shows the same illustrative data
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const gauss = (r) => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());

// Taipei MRT stations (approximate coordinates)
const ST = [
  ["台北車站", 121.5174, 25.0461], ["中山", 121.5203, 25.0527], ["雙連", 121.5206, 25.0577], ["民權西路", 121.5194, 25.0625],
  ["圓山", 121.5201, 25.0713], ["北門", 121.5103, 25.0497], ["西門", 121.5081, 25.0421], ["龍山寺", 121.4998, 25.0353],
  ["台大醫院", 121.5163, 25.0417], ["中正紀念堂", 121.5182, 25.0326], ["古亭", 121.5228, 25.0263], ["東門", 121.5288, 25.0339],
  ["善導寺", 121.5235, 25.0446], ["忠孝新生", 121.5329, 25.0423], ["忠孝復興", 121.5437, 25.0416], ["忠孝敦化", 121.5509, 25.0414],
  ["國父紀念館", 121.5577, 25.0413], ["市政府", 121.5651, 25.0411], ["台北 101／世貿", 121.5637, 25.0331], ["信義安和", 121.5530, 25.0333],
  ["大安", 121.5437, 25.0331], ["大安森林公園", 121.5354, 25.0335], ["科技大樓", 121.5433, 25.0262], ["象山", 121.5695, 25.0328],
  ["松江南京", 121.5330, 25.0521], ["南京復興", 121.5441, 25.0521], ["南京三民", 121.5627, 25.0516], ["行天宮", 121.5333, 25.0597],
  ["台電大樓", 121.5283, 25.0207], ["公館", 121.5343, 25.0148], ["中山國小", 121.5265, 25.0627], ["小南門", 121.5113, 25.0356],
];
const STATIONS = T.featureCollection(ST.map(([name, lng, lat]) => T.point([lng, lat], { name })));
const COORD = Object.fromEntries(ST.map(([n, lng, lat]) => [n, [lng, lat]]));
const ST_BBOX = T.bbox(STATIONS);
const ll = (c) => [c[1], c[0]];
const llf = (f) => ll(f.geometry.coordinates);

// ---------- map helpers ----------
// Standard OSM raster tiles (no key), darkened with a CSS filter on the tile pane.
const TILE = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者';

// Without a center the tile layer is held back until fit() sets the real view,
// so no tile request is issued for a provisional view and then aborted.
function makeMap(ctx, center, zoom, { canvas = false } = {}) {
  const map = L.map(ctx.$(".tf-map"), { zoomControl: false, zoomSnap: 0.25, preferCanvas: canvas });
  map.attributionControl.setPrefix(false);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  map.tfTiles = L.tileLayer(TILE, { maxZoom: 19, attribution: ATTR });
  map.setView(center || [25.043, 121.535], zoom || 13);
  if (center) map.tfTiles.addTo(map);
  ctx.onResize(() => map.invalidateSize());
  ctx.onCleanup(() => map.remove());
  return map;
}

// Fit a [w, s, e, n] box while keeping it clear of the control bar and the info panel.
function fit(ctx, map, box) {
  const top = (ctx.controls.offsetHeight || 0) + 22;
  const info = ctx.$(".tf-info");
  const wide = ctx.size().width > 560;
  const side = wide && info ? info.offsetWidth + 24 : 12;
  const bottom = !wide && info ? info.offsetHeight + 30 : 14;
  map.fitBounds([[box[1], box[0]], [box[3], box[2]]], { paddingTopLeft: [side, top], paddingBottomRight: [12, bottom], animate: false });
  if (!map.hasLayer(map.tfTiles)) map.tfTiles.addTo(map);
}

const row = (label, value, cls = "") => `<div class="tf-row"><span>${label}</span><b class="${cls}">${value}</b></div>`;
const legend = (colors, labels) =>
  `<div class="tf-legend">${colors.map((c) => `<i style="background:${c}"></i>`).join("")}</div>` +
  `<div class="tf-legend-n">${labels.map((l) => `<span>${l}</span>`).join("")}</div>`;
const timeIt = (fn) => { const t0 = performance.now(); const out = fn(); return [out, performance.now() - t0]; };
const compass = (deg) => ["北", "東北", "東", "東南", "南", "西南", "西", "西北"][Math.round(((deg % 360) + 360) % 360 / 45) % 8];

// Clustered illustrative points around weighted station hotspots
function hotspotPoints(seed, n, spots, noiseShare = 0.1, box = ST_BBOX) {
  const r = rng(seed);
  const total = spots.reduce((s, x) => s + x[1], 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    if (r() < noiseShare) { out.push(T.point([box[0] + r() * (box[2] - box[0]), box[1] + r() * (box[3] - box[1])], { w: 1 })); continue; }
    let pick = r() * total, k = 0;
    while (pick > spots[k][1]) pick -= spots[k++][1];
    const [lng, lat] = COORD[spots[k][0]];
    const s = spots[k][2] || 0.004;
    out.push(T.point([lng + gauss(r) * s, lat + gauss(r) * s * 0.9], { w: 1 }));
  }
  return T.featureCollection(out);
}

Showcase.run({ scenes: [
  // 1 ----------------------------------------------------------------------------------------
  {
    id: "buffer", title: "捷運環域分析",
    api: "buffer · pointsWithinPolygon · nearestPoint · distance · bearing · convex · area",
    desc: "拖曳黃點或點地圖換位置：turf.buffer 畫出步行環域，pointsWithinPolygon 篩出圈內的捷運站，nearestPoint 找最近一站並用 distance、bearing 算出距離與方位，convex 把圈內站包成凸包。",
    hint: "拖曳黃點，或直接點地圖；滑桿調整環域半徑",
    mount(ctx) {
      ctx.html(`<div class="tf-map"></div><div class="tf-info panel"></div>`);
      const map = makeMap(ctx);
      const info = ctx.$(".tf-info");
      let radius = 900;
      const overlay = L.layerGroup().addTo(map);
      const dots = STATIONS.features.map((f) =>
        L.circleMarker(llf(f), { radius: 5, weight: 1.5, color: COL.ink, fillColor: COL.dim, fillOpacity: 1 })
          .bindTooltip(f.properties.name, { direction: "top", offset: [0, -5] }).addTo(map));
      const you = L.marker([25.0375, 121.53], {
        draggable: true, zIndexOffset: 1000,
        icon: L.divIcon({ className: "", html: '<div class="tf-you"></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
      }).addTo(map);
      const label = L.tooltip({ permanent: true, direction: "center", className: "tf-lbl" });

      function analyse() {
        const { lat, lng } = you.getLatLng();
        const here = T.point([lng, lat]);
        const zone = T.buffer(here, radius, { units: "meters", steps: 64 });
        const inside = T.pointsWithinPolygon(STATIONS, zone);
        const near = T.nearestPoint(here, STATIONS);
        const dist = T.distance(here, near, { units: "meters" });
        const dir = compass(T.bearing(here, near));
        overlay.clearLayers();
        L.geoJSON(zone, { interactive: false, style: { color: COL.c2, weight: 1.5, fillColor: COL.c2, fillOpacity: 0.12 } }).addTo(overlay);
        let hullArea = 0;
        if (inside.features.length >= 3) {
          const hull = T.convex(inside);
          if (hull) {
            hullArea = T.area(hull) / 1e6;
            L.geoJSON(hull, { interactive: false, style: { color: COL.c6, weight: 1.5, dashArray: "5 5", fillColor: COL.c6, fillOpacity: 0.1 } }).addTo(overlay);
          }
        }
        L.polyline([[lat, lng], llf(near)], { interactive: false, color: COL.c1, weight: 2, dashArray: "4 6" }).addTo(overlay);
        label.setLatLng(llf(T.midpoint(here, near))).setContent(`${fmt(dist)} m`);
        overlay.addLayer(label);
        const names = new Set(inside.features.map((f) => f.properties.name));
        dots.forEach((m, i) => {
          const n = STATIONS.features[i].properties.name;
          const isNear = n === near.properties.name;
          m.setStyle({ fillColor: isNear ? COL.c1 : names.has(n) ? COL.c2 : COL.dim, radius: isNear ? 7 : names.has(n) ? 6 : 4.5 });
        });
        info.innerHTML = `<h3>步行 ${fmt(radius)} m 環域</h3>` +
          row("圈內捷運站", `${inside.features.length} 站`) +
          row("最近一站", `${near.properties.name}`, "tf-txt") +
          row("距離／方位", `${fmt(dist)} m・${dir}`) +
          row("環域面積", `${fmt(T.area(zone) / 1e6, 2)} km²`) +
          row("圈內站凸包", hullArea ? `${fmt(hullArea, 2)} km²` : "少於 3 站");
      }
      you.on("drag", analyse);
      map.on("click", (e) => { you.setLatLng(e.latlng); analyse(); });
      ctx.slider("半徑", { min: 300, max: 2000, step: 50, value: radius, format: (v) => `${v} m` }, (v) => { radius = v; analyse(); });
      analyse();
      fit(ctx, map, T.bbox(T.buffer(T.point([121.53, 25.0375]), 1.3, { units: "kilometers" })));
    },
  },

  // 2 ----------------------------------------------------------------------------------------
  {
    id: "voronoi", title: "Voronoi 與三角網",
    api: "voronoi · tin · concave · convex · polygonToLine · length",
    desc: "同一組 32 個捷運站換三種切法：voronoi 劃出每站「離我最近」的服務區，tin 建立 Delaunay 三角網看站距疏密，concave 依最長邊限制收出凹包，和 convex 凸包比較涵蓋範圍差多少。",
    hint: "滑過色塊看站名與面積；凹包模式可調最長邊",
    mount(ctx) {
      ctx.html(`<div class="tf-map"></div><div class="tf-info panel"></div>`);
      const map = makeMap(ctx);
      const info = ctx.$(".tf-info");
      const box = [ST_BBOX[0] - 0.012, ST_BBOX[1] - 0.01, ST_BBOX[2] + 0.012, ST_BBOX[3] + 0.01];
      const names = new Map(ST.map(([n, lng, lat]) => [`${lng},${lat}`, n]));
      const layer = L.layerGroup().addTo(map);
      const dots = L.layerGroup().addTo(map);
      STATIONS.features.forEach((f) => L.circleMarker(llf(f), { radius: 3.5, weight: 1, color: COL.ink, fillColor: "#fff", fillOpacity: 1, interactive: false }).addTo(dots));
      let mode = 0, maxEdge = 1.6;
      // getGeo is read lazily: the L.geoJSON instance does not exist yet while onEachFeature runs
      const hover = (lyr, getGeo) => {
        lyr.on("mouseover", () => lyr.setStyle({ weight: 2.5, color: COL.c1 }));
        lyr.on("mouseout", () => getGeo().resetStyle(lyr));
      };

      function draw() {
        layer.clearLayers();
        edgeInput.parentElement.style.display = mode === 2 ? "" : "none";
        if (mode === 0) {
          const [cells, ms] = timeIt(() => T.voronoi(STATIONS, { bbox: box }));
          const areas = cells.features.map((c) => (c ? T.area(c) / 1e6 : 0));
          const max = Math.max(...areas);
          const geo = L.geoJSON(cells, {
            style: (f) => ({ color: "#0b0d10", weight: 1, fillColor: rampColor(areas[cells.features.indexOf(f)] / max), fillOpacity: 0.55 }),
            onEachFeature: (f, lyr) => {
              const i = cells.features.indexOf(f);
              lyr.bindTooltip(`${ST[i][0]}・服務區 ${fmt(areas[i], 2)} km²`, { sticky: true });
              hover(lyr, () => geo);
            },
          }).addTo(layer);
          const sorted = [...areas].sort((a, b) => a - b);
          const big = areas.indexOf(max);
          info.innerHTML = `<h3>Voronoi 服務區</h3>` + row("多邊形", `${cells.features.length} 個`) +
            row("面積中位數", `${fmt(sorted[sorted.length >> 1], 2)} km²`) + row("最大服務區", `${ST[big][0]}`, "tf-txt") +
            row("計算時間", fmtMs(ms)) + legend(RAMP, ["小", "服務面積", "大"]);
        } else if (mode === 1) {
          const [tris, ms] = timeIt(() => T.tin(STATIONS));
          const edge = tris.features.map((t) => {
            const c = t.geometry.coordinates[0];
            return Math.max(...[0, 1, 2].map((k) => T.distance(c[k], c[k + 1])));
          });
          const max = Math.max(...edge);
          const geo = L.geoJSON(tris, {
            style: (f) => ({ color: COL.c2, weight: 1, opacity: 0.7, fillColor: rampColor(edge[tris.features.indexOf(f)] / max), fillOpacity: 0.4 }),
            onEachFeature: (f, lyr) => {
              const c = f.geometry.coordinates[0].slice(0, 3).map((p) => names.get(`${p[0]},${p[1]}`) || "?");
              lyr.bindTooltip(`${c.join("・")}<br>最長邊 ${fmt(edge[tris.features.indexOf(f)], 2)} km`, { sticky: true });
              hover(lyr, () => geo);
            },
          }).addTo(layer);
          const total = T.length(T.featureCollection(tris.features.map((t) => T.polygonToLine(t))));
          info.innerHTML = `<h3>Delaunay 三角網（TIN）</h3>` + row("三角形", `${tris.features.length} 個`) +
            row("最長邊", `${fmt(max, 2)} km`) + row("邊長總和（重複計）", `${fmt(total, 1)} km`) +
            row("計算時間", fmtMs(ms)) + legend(RAMP, ["站距密", "最長邊", "站距疏"]);
        } else {
          const convex = T.convex(STATIONS);
          const [concave, ms] = timeIt(() => T.concave(STATIONS, { maxEdge, units: "kilometers" }));
          L.geoJSON(convex, { interactive: false, style: { color: COL.c6, weight: 1.5, dashArray: "6 6", fillColor: COL.c6, fillOpacity: 0.06 } }).addTo(layer);
          if (concave) L.geoJSON(concave, { interactive: false, style: { color: COL.c1, weight: 2, fillColor: COL.c1, fillOpacity: 0.18 } }).addTo(layer);
          const a1 = T.area(convex) / 1e6, a2 = concave ? T.area(concave) / 1e6 : 0;
          info.innerHTML = `<h3>凸包 vs 凹包</h3>` + row("凸包（虛線）", `${fmt(a1, 2)} km²`) +
            row("凹包（黃色）", concave ? `${fmt(a2, 2)} km²` : "邊長限制太小") +
            row("凹包／凸包", concave ? `${fmt((a2 / a1) * 100)}%` : "無") + row("計算時間", fmtMs(ms)) +
            `<div class="tf-note">maxEdge 越小，凹包越貼近站點分布，太小會斷成多塊或回傳 null。</div>`;
        }
      }
      ctx.group(["Voronoi", "TIN 三角網", "凹包"], mode, (i) => { mode = i; draw(); });
      const edgeInput = ctx.slider("最長邊", { min: 0.6, max: 3, step: 0.1, value: maxEdge, format: (v) => `${v.toFixed(1)} km` }, (v) => { maxEdge = v; draw(); });
      draw();
      fit(ctx, map, ST_BBOX);
    },
  },

  // 3 ----------------------------------------------------------------------------------------
  {
    id: "idw", title: "IDW 內插等值線",
    api: "interpolate · isobands · isolines · pointGrid · hexGrid",
    desc: "36 個示意 PM2.5 測站只知道自己的數值。interpolate 用反距離加權（IDW）把數值推估到整片網格，isobands 再把網格切成分級色帶、isolines 畫出等值線；換成六角格則直接看每格的推估值。",
    hint: "切換色帶、等值線、六角格；調格距與 IDW 次方後觀察平滑程度",
    mount(ctx) {
      ctx.html(`<div class="tf-map"></div><div class="tf-info panel"></div>`);
      const map = makeMap(ctx);
      const info = ctx.$(".tf-info");
      const BOX = [121.47, 24.995, 121.6, 25.09];
      const BREAKS = [0, 12, 16, 20, 24, 28, 32, 36, 80];
      const bandColor = (i) => rampColor(i / (BREAKS.length - 2));
      const layer = L.layerGroup().addTo(map);
      const sensorLayer = L.layerGroup().addTo(map);
      let mode = 0, cell = 0.45, power = 2, seed = 7, sensors;

      function sample() {
        const r = rng(seed++);
        const spots = [0, 1, 2].map(() => [BOX[0] + 0.02 + r() * 0.09, BOX[1] + 0.015 + r() * 0.065, 12 + r() * 16]);
        sensors = T.featureCollection(Array.from({ length: 36 }, () => {
          const p = [BOX[0] + r() * (BOX[2] - BOX[0]), BOX[1] + r() * (BOX[3] - BOX[1])];
          let pm = 11 + r() * 3;
          for (const [x, y, amp] of spots) pm += amp * Math.exp(-((p[0] - x) ** 2 + (p[1] - y) ** 2) / 0.0006);
          return T.point(p, { pm: Math.round(pm * 10) / 10 });
        }));
        sensorLayer.clearLayers();
        sensors.features.forEach((f) => L.circleMarker(llf(f), { radius: 4.5, weight: 1.5, color: "#fff", fillColor: COL.ink, fillOpacity: 1 })
          .bindTooltip(`測站 PM2.5：${f.properties.pm} µg/m³`, { direction: "top", offset: [0, -5] }).addTo(sensorLayer));
      }

      function draw() {
        layer.clearLayers();
        const gridType = mode === 2 ? "hex" : "point";
        const [grid, ms1] = timeIt(() => T.interpolate(sensors, cell, { gridType, property: "pm", units: "kilometers", weight: power }));
        let ms2 = 0, title = "";
        if (mode === 0) {
          const [bands, ms] = timeIt(() => T.isobands(grid, BREAKS, { zProperty: "pm" }));
          ms2 = ms; title = "等值色帶（isobands）";
          bands.features.forEach((f, i) => {
            if (!f.geometry.coordinates.length) return;
            L.geoJSON(f, { style: { stroke: false, fillColor: bandColor(i), fillOpacity: 0.55 } })
              .bindTooltip(`PM2.5 ${f.properties.pm} µg/m³`, { sticky: true }).addTo(layer);
          });
        } else if (mode === 1) {
          const [lines, ms] = timeIt(() => T.isolines(grid, BREAKS.slice(1, -1), { zProperty: "pm" }));
          ms2 = ms; title = "等值線（isolines）";
          grid.features.forEach((f) => L.circleMarker(llf(f), { radius: 1.6, stroke: false, fillColor: rampColor((f.properties.pm - 10) / 30), fillOpacity: 0.8, interactive: false }).addTo(layer));
          lines.features.forEach((f, i) => {
            if (!f.geometry.coordinates.length) return;
            L.geoJSON(f, { style: { color: bandColor(i + 1), weight: 2.2 } }).bindTooltip(`${f.properties.pm} µg/m³`, { sticky: true }).addTo(layer);
          });
        } else {
          title = "六角格推估值";
          L.geoJSON(grid, {
            style: (f) => ({ color: "#0b0d10", weight: 0.6, fillColor: rampColor((f.properties.pm - 10) / 30), fillOpacity: 0.6 }),
            onEachFeature: (f, lyr) => lyr.bindTooltip(`推估 ${fmt(f.properties.pm, 1)} µg/m³`, { sticky: true }),
          }).addTo(layer);
        }
        const vals = sensors.features.map((f) => f.properties.pm);
        info.innerHTML = `<h3>${title}</h3>` + row("內插網格", `${fmt(grid.features.length)} 格`) +
          row("測站範圍", `${fmt(Math.min(...vals), 1)} ～ ${fmt(Math.max(...vals), 1)}`) +
          row("interpolate", fmtMs(ms1)) + (mode < 2 ? row(mode ? "isolines" : "isobands", fmtMs(ms2)) : "") +
          legend(BREAKS.slice(0, -1).map((_, i) => bandColor(i)), BREAKS.slice(0, -1).map((b, i, a) => (i === a.length - 1 ? `${b}+` : `${b}`)));
      }
      ctx.group(["色帶", "等值線", "六角格"], mode, (i) => { mode = i; draw(); });
      ctx.slider("格距", { min: 0.25, max: 1.2, step: 0.05, value: cell, format: (v) => `${v.toFixed(2)} km` }, (v) => { cell = v; draw(); });
      ctx.slider("次方", { min: 1, max: 4, step: 0.5, value: power, format: (v) => v.toFixed(1) }, (v) => { power = v; draw(); });
      ctx.button("重新取樣", () => { sample(); draw(); });
      sample();
      draw();
      fit(ctx, map, BOX);
    },
  },

  {

    mount(ctx) {
      ctx.html(`<div class="tf-map"></div><div class="tf-info panel"></div>`);
      const map = makeMap(ctx);
      const info = ctx.$(".tf-info");
      const WAY = ["圓山", "民權西路", "雙連", "中山", "台北車站", "西門", "龍山寺", "小南門", "中正紀念堂", "古亭", "台電大樓", "公館",
        "科技大樓", "大安", "忠孝復興", "南京復興", "松江南京", "行天宮", "中山國小", "圓山"];
      const base = T.lineString(WAY.map((n) => COORD[n]));
      const baseLen = T.length(base);
      const r = rng(42);
      const noisy = [];
      for (let d = 0; d <= baseLen; d += 0.04) {
        const c = T.along(base, d).geometry.coordinates;
        noisy.push([c[0] + gauss(r) * 0.00017, c[1] + gauss(r) * 0.00015]);
      }
      const raw = T.lineString(noisy);
      const rawLen = T.length(raw);
      const rawLayer = L.layerGroup().addTo(map);

      noisy.forEach((c) => L.circleMarker(ll(c), { radius: 1.5, stroke: false, fillColor: "#9aa3ad", fillOpacity: 0.8, interactive: false }).addTo(rawLayer));
      const smoothLine = L.polyline([], { color: COL.c2, weight: 3, opacity: 0.55, interactive: false }).addTo(map);
      const doneLine = L.polyline([], { color: COL.c1, weight: 4, interactive: false }).addTo(map);
      const ticks = L.layerGroup().addTo(map);
      const snap = L.layerGroup().addTo(map);
      const bike = L.marker([0, 0], { interactive: false, zIndexOffset: 1000, icon: L.divIcon({ className: "", html: '<div class="tf-bike"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(map);
      let tol = 0.0002, smooth, len = 1, simpleCount = 0, pos = 0, playing = true;

      function build() {
        const simple = T.simplify(raw, { tolerance: tol, highQuality: false });
        simpleCount = simple.geometry.coordinates.length;
        smooth = T.bezierSpline(simple, { sharpness: 0.85 });
        len = T.length(smooth);
        smoothLine.setLatLngs(smooth.geometry.coordinates.map(ll));
        ticks.clearLayers();
        T.lineChunk(smooth, 1, { units: "kilometers" }).features.forEach((seg, i, all) => {

          const c = seg.geometry.coordinates[seg.geometry.coordinates.length - 1];
          L.circleMarker(ll(c), { radius: 3, weight: 1, color: COL.ink, fillColor: COL.c1, fillOpacity: 1, interactive: false })
            .bindTooltip(`${i + 1} km`, { permanent: true, direction: "right", offset: [4, 0], className: "tf-tick" }).addTo(ticks);
        });
        pos = Math.min(pos, len);
      }
      function render() {
        bike.setLatLng(ll(T.along(smooth, pos).geometry.coordinates));
        doneLine.setLatLngs(pos > 0.001 ? T.lineSliceAlong(smooth, 0, pos).geometry.coordinates.map(ll) : []);
        info.innerHTML = `<h3>單車軌跡（示意）</h3>` +
          row("原始 → 簡化 → 平滑", `${noisy.length} → ${simpleCount} → ${smooth.geometry.coordinates.length}`) +
          row("原始／平滑長度", `${fmt(rawLen, 2)}／${fmt(len, 2)} km`) +
          row("目前位置", `${fmt(pos, 2)} km（${fmt((pos / len) * 100)}%）`);
      }
      map.on("click", (e) => {
        const p = T.point([e.latlng.lng, e.latlng.lat]);
        const near = T.nearestPointOnLine(smooth, p, { units: "kilometers" });
        pos = near.properties.totalDistance;
        snap.clearLayers();
        L.polyline([e.latlng, llf(near)], { color: COL.c3, weight: 1.5, dashArray: "3 5", interactive: false }).addTo(snap);
        L.circleMarker(e.latlng, { radius: 4, weight: 0, fillColor: COL.c3, fillOpacity: 1, interactive: false })
          .bindTooltip(`偏離路線 ${fmt(near.properties.pointDistance * 1000)} m`, { permanent: true, direction: "top", offset: [0, -6] }).addTo(snap);
        render();
      });
      ctx.slider("簡化容差", { min: 0.00005, max: 0.0008, step: 0.00005, value: tol, format: (v) => `≈${Math.round(v * 111000)} m` }, (v) => { tol = v; build(); render(); });
      ctx.toggle("原始點", true, (v) => (v ? rawLayer.addTo(map) : rawLayer.remove()));
      ctx.toggle("播放", playing, (v) => (playing = v));
      build();
      render();
      fit(ctx, map, T.bbox(raw));
      let acc = 0;
      ctx.raf((t, dt) => {
        if (!playing) return;
        pos = (pos + (dt / 1000) * (len / 26)) % len;
        acc += dt;
        if (acc > 33) { acc = 0; render(); }
      });
    },
  },

    mount(ctx) {
      ctx.html(`<div class="tf-map"></div><div class="tf-info panel"></div>`);

      const info = ctx.$(".tf-info");
      const handle = (latlng, text, color) => L.marker(latlng, {
        draggable: true, zIndexOffset: 1000,
        icon: L.divIcon({ className: "", html: `<div class="tf-handle" style="background:${color}">${text}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }),
      }).addTo(map);

      const layer = L.layerGroup().addTo(map);
      let op = 0, angle = 0;
      const OPS = ["聯集", "交集", "A − B", "B − A"];

      const star = (c) => {
        const pts = [];
        for (let i = 0; i < 10; i++) pts.push(T.destination(c, i % 2 ? 0.45 : 1.05, i * 36, { units: "kilometers" }).geometry.coordinates);
        pts.push(pts[0]);
        return T.transformRotate(T.polygon([pts]), angle, { pivot: c });

      function update() {
        const a = hA.getLatLng(), b = hB.getLatLng();

        const B = star([b.lng, b.lat]);
        const fc = T.featureCollection([A, B]);
        const [res, ms] = timeIt(() =>
          op === 0 ? T.union(fc) : op === 1 ? T.intersect(fc) : op === 2 ? T.difference(fc) : T.difference(T.featureCollection([B, A])));
        layer.clearLayers();
        L.geoJSON(A, { interactive: false, style: { color: COL.c2, weight: 1.5, dashArray: "5 5", fillOpacity: 0 } }).addTo(layer);
        L.geoJSON(B, { interactive: false, style: { color: COL.c3, weight: 1.5, dashArray: "5 5", fillOpacity: 0 } }).addTo(layer);
        if (res) L.geoJSON(res, { interactive: false, style: { color: COL.c1, weight: 2, fillColor: COL.c1, fillOpacity: 0.32 } }).addTo(layer);
        const yes = (v) => `<b class="${v ? "tf-yes" : "tf-no"}">${v ? "是" : "否"}</b>`;

          rel("booleanIntersects", T.booleanIntersects(A, B)) + rel("booleanOverlap", T.booleanOverlap(A, B)) +
          rel("booleanContains(A, B)", T.booleanContains(A, B)) + rel("booleanWithin(B, A)", T.booleanWithin(B, A)) +
          rel("booleanDisjoint", T.booleanDisjoint(A, B)) + row("運算時間", fmtMs(ms));

      ctx.slider("旋轉 B", { min: 0, max: 72, step: 1, value: angle, format: (v) => `${v}°` }, (v) => { angle = v; update(); });

            const c = centers[i % centers.length];
            const a = Math.random() * Math.PI * 2, d = Math.sqrt(-2 * Math.log(Math.random() + 1e-12)) * 0.012;
            x = c[0] + Math.cos(a) * d; y = c[1] + Math.sin(a) * d * 0.9;
          } else { x = B[0] + Math.random() * (B[2] - B[0]); y = B[1] + Math.random() * (B[3] - B[1]); }
          if (x > B[0] && x < B[2] && y > B[1] && y < B[3]) out.push(T.point([x, y]));
        }
        return T.featureCollection(out);
      }
      // Local planar projection in km. turf.voronoi wraps d3-voronoi, whose fixed 1e-6 epsilon
      // throws on raw lng/lat input from roughly 200k points up; km coordinates stay stable.
      const KX = 111.32 * Math.cos(25.04 * Math.PI / 180), KY = 110.57;
      const toKm = (fc) => T.featureCollection(fc.features.map((f) => T.point([(f.geometry.coordinates[0] - B[0]) * KX, (f.geometry.coordinates[1] - B[1]) * KY])));
      const KM_BOX = [-0.5, -0.5, (B[2] - B[0]) * KX + 0.5, (B[3] - B[1]) * KY + 0.5];

      function draw() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (!w || !h) return;
        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) { canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); }
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, w, h);
        const kx = Math.cos(25.04 * Math.PI / 180);
        const bw = (B[2] - B[0]) * kx, bh = B[3] - B[1];
        const s = Math.min((w - 24) / bw, (h - 52) / bh);
        const ox = (w - bw * s) / 2, oy = 34 + (h - 44 - bh * s) / 2;
        const cur = shown || { op, pts: makePoints(1500), result: null, preview: true };
        const ux = cur.km ? (x) => B[0] + x / KX : (x) => x, uy = cur.km ? (y) => B[1] + y / KY : (y) => y;
        const X = (x) => ox + (ux(x) - B[0]) * kx * s, Y = (y) => oy + (B[3] - uy(y)) * s;
        g.strokeStyle = "rgba(255,255,255,.08)"; g.lineWidth = 1;
        for (let i = 0; i <= 6; i++) {
          g.beginPath(); g.moveTo(X(B[0] + (i / 6) * (B[2] - B[0])), Y(B[1])); g.lineTo(X(B[0] + (i / 6) * (B[2] - B[0])), Y(B[3])); g.stroke();
          g.beginPath(); g.moveTo(X(B[0]), Y(B[1] + (i / 6) * (B[3] - B[1]))); g.lineTo(X(B[2]), Y(B[1] + (i / 6) * (B[3] - B[1]))); g.stroke();
        }
        const feats = cur.pts.features;
        const step = Math.max(1, Math.floor(feats.length / 60000));
        const dot = feats.length > 20000 ? 1 : 1.8;
        if (cur.op === "voronoi" && cur.result) {
          g.strokeStyle = "rgba(76,201,240,.45)"; g.lineWidth = 0.6; g.beginPath();
          const cells = cur.result.features;
          for (let i = 0; i < cells.length && i < 30000; i++) {
            const c = cells[i]; if (!c) continue;
            const r0 = c.geometry.coordinates[0];
            g.moveTo(X(r0[0][0]), Y(r0[0][1]));
            for (let j = 1; j < r0.length; j++) g.lineTo(X(r0[j][0]), Y(r0[j][1]));
          }
          g.stroke();
        }
        if (cur.op === "pip") {
          g.strokeStyle = COL.c1; g.lineWidth = 1.5; g.beginPath();
          ring.forEach(([x, y], i) => (i ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y))));
          g.stroke();
        }
        const inside = cur.op === "pip" && cur.result ? new Set(cur.result.features) : null;
        for (let i = 0; i < feats.length; i += step) {
          const f = feats[i], [x, y] = f.geometry.coordinates;
          g.fillStyle = cur.op === "kmeans" && cur.result ? PALETTE[cur.result.features[i].properties.cluster % PALETTE.length]
            : inside ? (inside.has(f) ? COL.c1 : "rgba(155,160,170,.35)") : "rgba(236,235,230,.55)";
          g.fillRect(X(x) - dot / 2, Y(y) - dot / 2, dot, dot);
        }
        if (cur.op === "kmeans" && cur.result) {
          const seen = new Set();
          cur.result.features.forEach((f) => {
            const c = f.properties.cluster; if (seen.has(c)) return; seen.add(c);
            const [x, y] = f.properties.centroid;
            g.fillStyle = "#fff"; g.beginPath(); g.arc(X(x), Y(y), 5, 0, Math.PI * 2); g.fill();
            g.fillStyle = PALETTE[c % PALETTE.length]; g.beginPath(); g.arc(X(x), Y(y), 3.2, 0, Math.PI * 2); g.fill();
          });
        }
        g.fillStyle = "#ecebe6"; g.font = `600 13px ${FONT}`; g.textBaseline = "top";
        g.fillText(cur.preview ? `${OPS[cur.op]}・預覽 1,500 點` : `${OPS[cur.op]}・${fmt(feats.length)} 點${feats.length > 60000 ? "（抽樣繪製）" : ""}`, 12, 10);
        if (cur.detail) { g.fillStyle = "#9b998f"; g.font = `12px ${FONT}`; g.fillText(cur.detail, 12, 28); }
      }

      ctx.controls.classList.add("bottom");
      ctx.select("運算", Object.entries(OPS).map(([value, label]) => ({ value, label })), op, (v) => { op = v; shown = null; draw(); });
      ctx.onResize(draw);
      ctx.bench({
        label: "隨機點", unit: "點",
        sizes: [1000, 5000, 20000, 50000, 100000, 200000, 400000],
        prepare(n) {
          if (n === 1000) runOp = op;
          const pts = makePoints(n);
          return runOp === "voronoi" ? toKm(pts) : pts;
        },
        run(n, pts) {
          let result, detail;
          if (runOp === "voronoi") {
            result = T.voronoi(pts, { bbox: KM_BOX });
            detail = `${fmt(result.features.filter(Boolean).length)} 格`;
          } else if (runOp === "kmeans") {
            result = T.clustersKmeans(pts, { numberOfClusters: 8 });
            detail = "8 群";
          } else {
            result = T.pointsWithinPolygon(pts, BLOB);
            detail = `${fmt(result.features.length)} 點在內`;
          }
          shown = { op: runOp, pts, result, km: runOp === "voronoi", detail: `最近一次：${detail}` };
          ctx.timeout(draw, 0);
          return detail;
        },
        note: "計時只含 Turf 運算本身，不含產生隨機點與繪圖。Voronoi 先把經緯度投影成以公里為單位的平面座標再算：直接丟經緯度時，turf.voronoi 內部的 d3-voronoi 在二十萬點附近會因固定容差拋錯。Voronoi 與 K-means 的成本隨點數超線性成長，pointsWithinPolygon 大致與「點數 × 多邊形邊數」成正比。",
      });
      draw();
    },
  },
] });
</script>
</body>
</html>
