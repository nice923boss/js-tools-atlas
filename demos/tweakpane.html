    background: var(--glow-solid); transform: rotate(6deg); }
  .card .badge[hidden] { display: none; }
  .card .ttl { font-weight: 800; font-size: 9cqw; line-height: 1.12; overflow-wrap: anywhere; }
  .card .stars { font: 6cqw/1 var(--font); color: var(--glow-solid); letter-spacing: 0.6cqw; }
  .card .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 3cqw; font: 600 4.6cqw/1 var(--mono); }
  .card .serial { opacity: 0.7; font-size: 3.4cqw; }

  /* 4. event log */
  .evlog { position: absolute; left: 10px; top: 10px; z-index: 5; margin: 0; padding: 7px 10px; list-style: none; width: min(380px, calc(100% - 20px));
    max-height: 46%; overflow: hidden; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font: 11px/1.6 var(--mono); color: var(--fg); }
  .evlog:empty { display: none; }

  .evlog .k-change { color: var(--c2); } .evlog .k-last { color: var(--c4); } .evlog .k-select { color: var(--c1); }
  .evlog .k-fold { color: var(--c6); } .evlog .k-api { color: var(--c5); } .evlog .k-click { color: var(--c3); }
  .evlog li.new { animation: flash 0.9s ease-out; }

  /* 6. state snapshots */

    padding: 8px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); font: 11px/1.5 var(--mono); color: var(--fg); white-space: pre; }
  pre.state em { font-style: normal; color: var(--c1); }
  pre.state u { text-decoration: none; color: var(--c6); }
  @media (max-width: 860px) { pre.state { display: none; } }

    font: 10.5px/1.3 var(--mono); color: var(--muted); text-align: left; }

  /* 7. stress */

  .stress-box .cols { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; padding: 8px; }
  .stress-box .col { width: 210px; flex: none; }
  @media (max-width: 760px) { .stress-box { inset: 8px; } }

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "tweakpane": "https://cdn.jsdelivr.net/npm/tweakpane@4.0.5/dist/tweakpane.min.js",
  "@tweakpane/plugin-essentials": "https://cdn.jsdelivr.net/npm/@tweakpane/plugin-essentials@0.2.1/dist/tweakpane-plugin-essentials.min.js"

<script type="module">
// Tweakpane showcase: input types, monitors, folders and tabs, essentials plugins, exportState/importState, binding creation benchmark.
import * as THREE from "three";
import { Pane } from "tweakpane";
import * as Essentials from "@tweakpane/plugin-essentials";

const PALETTE = ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff"];
const NF = new Intl.NumberFormat("zh-TW");
const SANS = "'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif";
const MONO = "ui-monospace, SFMono-Regular, Consolas, monospace";

function make(tag, cls, html = "") {
  const d = document.createElement(tag);
  if (cls) d.className = cls;
  d.innerHTML = html;
  return d;
}

// Stage area + a Pane mounted into the scene (container option), disposed on scene switch.
function layout(ctx, title) {
  const view = make("div", "view");
  const host = make("div", "tp-host");
  ctx.el.append(view, host);
  const pane = new Pane({ container: host, title });
  pane.registerPlugin(Essentials);
  ctx.onCleanup(() => pane.dispose());
  return { view, host, pane };
}

// HiDPI 2D canvas filling the view.
function canvas2d(ctx, view) {
  const c = document.createElement("canvas");
  view.prepend(c);
  const S = { c, g: c.getContext("2d"), w: 1, h: 1, onSize: null };
  const fit = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    S.w = Math.max(1, view.clientWidth);
    S.h = Math.max(1, view.clientHeight);
    c.width = Math.round(S.w * dpr);
    c.height = Math.round(S.h * dpr);
    S.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (S.onSize) S.onSize();
  };
  fit();
  ctx.onResize(fit);
  return S;
}

function flash(api) {
  const d = api.element;
  d.classList.remove("tp-flash");
  void d.offsetWidth;
  d.classList.add("tp-flash");
}

// Stops the scripted auto-demo as soon as the viewer touches a panel.
function userFlag(ctx, ...els) {
  const f = { on: false };
  for (const el of els) {
    ctx.on(el, "pointerdown", () => { f.on = true; });
    ctx.on(el, "keydown", () => { f.on = true; });
  }
  return f;
}

const hexToRgb = (h) => { const n = parseInt(h.slice(1, 7), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mixHex = (a, b, t) => { const x = hexToRgb(a), y = hexToRgb(b); return `rgb(${x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",")})`; };
const round2 = (v) => Math.round(v * 100) / 100;
const show = (v) => (typeof v === "number" ? NF.format(round2(v)) : typeof v === "string" ? JSON.stringify(v)
  : JSON.stringify(v, (k, x) => (typeof x === "number" ? round2(x) : x)));

// Seeded PRNG and 1D value noise, so the generative scenes are reproducible.
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function noise1(seed) {
  const r = rng(seed);
  const v = Float32Array.from({ length: 256 }, r);
  return (x) => {
    const i = Math.floor(x), f = x - i, s = f * f * (3 - 2 * f);
    const a = v[i & 255], b = v[(i + 1) & 255];
    return a + (b - a) * s;
  };
}

// ---------- 1. liquid blob (ported from the original demo) ----------
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;
  return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}
`;
const BLOB_VERT = NOISE + `
  uniform float uTime, uAmp, uFreq;
  varying vec3 vN; varying vec3 vView; varying float vD;
  float disp(vec3 p){ return snoise(p * uFreq + uTime) * uAmp; }
  void main(){
    vec3 p = position; vec3 n = normalize(normal);
    float d = disp(p); vec3 moved = p + n * d;
    // Approximate the displaced normal with finite differences along two tangents
    vec3 t = normalize(cross(n, vec3(0.01, 1., 0.02))); vec3 b = cross(n, t);
    vec3 pt = p + t * 0.01; vec3 pb = p + b * 0.01;
    pt += normalize(pt) * disp(pt); pb += normalize(pb) * disp(pb);
    vN = normalize(normalMatrix * cross(pt - moved, pb - moved));
    vec4 mv = modelViewMatrix * vec4(moved, 1.);
    vView = normalize(-mv.xyz); vD = d;
    gl_Position = projectionMatrix * mv;
  }`;
const BLOB_FRAG = `
  uniform vec3 uColorA, uColorB, uLight; uniform float uBands;
  varying vec3 vN; varying vec3 vView; varying float vD;
  void main(){
    vec3 n = normalize(vN);
    float diff = max(dot(n, normalize(uLight)), 0.);
    float fres = pow(1. - max(dot(n, vView), 0.), 2.5);
    float k = clamp(vD * 1.4 + .5, 0., 1.);
    if (uBands > .5) k = floor(k * 6.) / 6.;
    vec3 base = mix(uColorA, uColorB, k);
    vec3 col = base * (0.25 + 0.85 * diff) + fres * mix(uColorB, vec3(1.), .4) * .9;
    float spec = pow(max(dot(reflect(-normalize(uLight), n), vView), 0.), 40.);
    gl_FragColor = vec4(col + spec * .6, 1.);
  }`;

Showcase.run({ scenes: [
  {
    id: "blob", title: "液態球控制台",
    api: "new Pane({ container, title })・pane.registerPlugin(Essentials)・pane.addTab({ pages })・addBinding(obj, key, { readonly: true, view: 'graph' })",
    desc: "原本的招牌示範：simplex 雜訊位移的液態球。essentials 外掛的 buttongrid 套用四組預設，Object.assign 改值後呼叫 pane.refresh() 一次同步所有控制項；分頁切換形狀、色彩、效能三組參數，2D 搖桿控制自轉與光源，graph 監看畫出脈動曲線，fpsgraph 量渲染幀率。",
    hint: "拖曳面板滑桿、色票、2D 搖桿，球體即時變形・沒操作時自動輪播預設",
    mount(ctx) {
      const { view, pane } = layout(ctx, "液態球控制台");
      const canvas = document.createElement("canvas");
      view.append(canvas);
      const tag = make("div", "lbl");
      view.append(tag);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
      camera.position.set(0, 0, 6);
      const uniforms = {
        uTime: { value: 0 }, uAmp: { value: 0.35 }, uFreq: { value: 1.4 },
        uColorA: { value: new THREE.Color("#4cc9f0") }, uColorB: { value: new THREE.Color("#f72585") },
        uLight: { value: new THREE.Vector3(0.5, 0.6, 1).normalize() }, uBands: { value: 0 },
      };
      const material = new THREE.ShaderMaterial({ uniforms, vertexShader: BLOB_VERT, fragmentShader: BLOB_FRAG });
      const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1.2, 48), material);
      scene.add(blob);

      const state = {
        amp: 0.35, freq: 1.4, speed: 0.6, detail: 48, wire: false, bands: false,
        colorA: "#4cc9f0", colorB: "#f72585", bg: "#0e1013",
        light: { x: 0.5, y: 0.6 }, spin: { x: 0.15, y: 0.25 }, wave: 0,
      };
      scene.background = new THREE.Color(state.bg);
      const NAMES = ["平靜", "心跳", "暴走", "液態"];
      const PRESETS = [
        { amp: 0.12, freq: 0.8, speed: 0.25, colorA: "#7bd389", colorB: "#4cc9f0" },
        { amp: 0.45, freq: 1.2, speed: 1.6, colorA: "#ff8c42", colorB: "#f72585" },
        { amp: 0.9, freq: 3.2, speed: 2.6, colorA: "#9d8cff", colorB: "#f7df1e" },
        { amp: 0.35, freq: 1.4, speed: 0.6, colorA: "#4cc9f0", colorB: "#f72585" },
      ];

      const grid = pane.addBlade({ view: "buttongrid", size: [4, 1], cells: (x) => ({ title: NAMES[x] }), label: "預設" });
      grid.on("click", (ev) => applyPreset(ev.index[0]));
      pane.addBinding(state, "wave", { label: "脈動曲線", readonly: true, view: "graph", min: -1, max: 1, rows: 2, interval: 50, bufferSize: 100 });
      const tabs = pane.addTab({ pages: [{ title: "形狀" }, { title: "色彩" }, { title: "效能" }] });
      const [pShape, pColor, pMon] = tabs.pages;
      pShape.addBinding(state, "amp", { label: "振幅", min: 0, max: 1, step: 0.01 });
      pShape.addBinding(state, "freq", { label: "頻率", min: 0.2, max: 4, step: 0.01 });
      pShape.addBinding(state, "speed", { label: "流速", min: 0, max: 3, step: 0.01 });
      pShape.addBinding(state, "detail", { label: "細節", options: { "低": 16, "中": 48, "高": 96 } }).on("change", (ev) => {
        blob.geometry.dispose();
        blob.geometry = new THREE.IcosahedronGeometry(1.2, ev.value);
      });
      pShape.addBinding(state, "wire", { label: "線框" });
      pShape.addBinding(state, "spin", { label: "自轉", x: { min: -1, max: 1 }, y: { min: -1, max: 1, inverted: true } });
      pColor.addBinding(state, "colorA", { label: "低處色" });
      pColor.addBinding(state, "colorB", { label: "高處色" });
      pColor.addBinding(state, "bg", { label: "背景" });
      pColor.addBinding(state, "bands", { label: "色階" });
      pColor.addBinding(state, "light", { label: "光源", picker: "inline", expanded: true, x: { min: -1, max: 1 }, y: { min: -1, max: 1, inverted: true } });
      pMon.addBinding(state, "wave", { label: "數值", readonly: true, format: (v) => v.toFixed(3) });
      const fps = pMon.addBlade({ view: "fpsgraph", label: "FPS", rows: 2 });

      function apply() {
        uniforms.uAmp.value = state.amp;
        uniforms.uFreq.value = state.freq;
        uniforms.uColorA.value.set(state.colorA);
        uniforms.uColorB.value.set(state.colorB);
        uniforms.uLight.value.set(state.light.x, state.light.y, 0.9).normalize();
        uniforms.uBands.value = state.bands ? 1 : 0;
        material.wireframe = state.wire;
        scene.background.set(state.bg);
      }
      pane.on("change", apply);
      let current = 3;
      function applyPreset(i) {
        current = i;
        Object.assign(state, PRESETS[i]);
        pane.refresh(); // pull the new values into every binding view
        apply();
        flash(grid);
        tag.innerHTML = `<b>預設「${NAMES[i]}」</b> Object.assign(state, preset) → <i>pane.refresh()</i>`;
      }
      tag.innerHTML = `<b>預設「${NAMES[current]}」</b> 點面板上的 buttongrid 切換`;

      const fit = () => {
        const w = Math.max(1, view.clientWidth), h = Math.max(1, view.clientHeight);
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.position.z = w < h ? 8.5 : 6;
        camera.updateProjectionMatrix();
      };
      fit();
      ctx.onResize(fit);
      ctx.onCleanup(() => {
        blob.geometry.dispose();
        material.dispose();
        renderer.dispose();
        renderer.forceContextLoss();
      });

      const user = userFlag(ctx, pane.element);
      ctx.interval(() => { if (!user.on) applyPreset((current + 1) % 4); }, 3500);
      let t = 0;
      ctx.raf((_, dt) => {
        fps.begin();
        const s = dt / 1000;
        t += s * state.speed;
        uniforms.uTime.value = t;
        blob.rotation.y += s * state.spin.x;
        blob.rotation.x += s * state.spin.y;
        // Pulse value derived from time and amplitude, drawn by the graph monitor
        state.wave = Math.sin(t * 2.1) * Math.cos(t * 1.3) * state.amp;
        renderer.render(scene, camera);
        fps.end();
      });
    },
  },

  {
    id: "inputs", title: "輸入型別",
    api: "addBinding(obj, key, params)：string・number・boolean・color・point2d／3d／4d・addBlade({ view: 'list' | 'slider' | 'text' })",

      const f4 = pane.addFolder({ title: "Blade：不綁物件" });

        options: [{ text: "黑體", value: "sans" }, { text: "明體", value: "serif" }, { text: "等寬", value: "mono" }] });

      const rgba = (n, a) => `rgba(${(n >>> 24) & 255}, ${(n >>> 16) & 255}, ${(n >>> 8) & 255}, ${a ?? ((n & 255) / 255).toFixed(2)})`;
      function render() {

        [f2, "bg", "#0b3d2e"], [f2, "accent", 0x4cc9f0d9], [f2, "edge", "hsl(150, 70%, 55%)"],
        [f3, "tilt", { x: 12, y: -24, z: 4 }], [f3, "radius", { x: 44, y: 6, z: 44, w: 6 }], [f3, "shadow", { x: -22, y: 26 }],
        [f4, "font", "serif"], [f4, "scale", 0.88], [f4, "serial", "TP-2026"],
        [f1, "title", "海港煙火"], [f1, "rating", 3.5], [f1, "tag", "展覽"], [f1, "badge", false],
        [f2, "bg", "#1b1035"], [f2, "accent", 0xf7df1ecc], [f2, "edge", "hsl(330, 90%, 62%)"],
        [f3, "tilt", { x: -10, y: 16, z: 0 }], [f3, "radius", { x: 22, y: 22, z: 22, w: 22 }], [f3, "shadow", { x: 0, y: 18 }],
        [f4, "font", "sans"], [f4, "scale", 1], [f4, "serial", "TP-0405"],
        [f1, "title", "極光夜跑"], [f1, "rating", 4.5], [f1, "tag", "活動"], [f1, "badge", true],

      const user = userFlag(ctx, pane.element);
      let k = 0;

        const [f, key, v] = TOUR[k++ % TOUR.length];

    },
  },

  {
    id: "monitors", title: "監看圖表",
    api: "addBinding(obj, key, { readonly: true, view: 'graph', interval, bufferSize })・{ multiline: true }・binding.refresh()・binding.dispose()",
    desc: "彈簧阻尼系統。readonly 綁定就是監看：graph 畫出位置、速度與能量，bufferSize 決定保留幾筆、interval 決定多久取樣一次；同一個 x 設 bufferSize 4 就變成數值紀錄，布林與多行字串也能監看。切換「更新間隔」會 dispose() 舊監看再重建，選 0 時不自動更新，改成只在越過零點時手動 refresh()。",
    hint: "調勁度、阻尼、質量後按「踢一下」・切換更新間隔比較 graph 的取樣差異",
    mount(ctx) {
      const { view, pane } = layout(ctx, undefined);
      const S = canvas2d(ctx, view);
      const P = { k: 18, c: 0.35, m: 1 };
      const M = { x: 0, v: 0, E: 0, over: false, events: "" };
      let x = 0.8, v = 0, simT = 0, kickFx = 0;
      const lines = [];
      const logEvent = (s) => {
        lines.push(`${simT.toFixed(1).padStart(5)}s ${s}`);
        while (lines.length > 3) lines.shift();
        M.events = lines.join("\n");
      };

      pane.addBinding(P, "k", { label: "勁度 k", min: 2, max: 60, step: 0.5 });
      pane.addBinding(P, "c", { label: "阻尼 c", min: 0, max: 4, step: 0.05 });
      pane.addBinding(P, "m", { label: "質量 m", min: 0.2, max: 4, step: 0.1 });
      pane.addButton({ title: "踢一下", label: "外力" }).on("click", () => kick());
      const iv = pane.addBlade({ view: "list", label: "更新間隔", value: 16, options: [
        { text: "16 ms（約每幀）", value: 16 }, { text: "100 ms", value: 100 }, { text: "500 ms", value: 500 }, { text: "0：手動 refresh()", value: 0 },
      ] });
      const mon = pane.addFolder({ title: "監看" });
      let monitors = [];
      function buildMonitors(interval) {
        monitors.forEach((b) => b.dispose());
        const o = { readonly: true, interval };
        monitors = [
          mon.addBinding(M, "x", { ...o, label: "位置 x", view: "graph", min: -1.4, max: 1.4, rows: 2, bufferSize: 120 }),
          mon.addBinding(M, "v", { ...o, label: "速度 v", view: "graph", min: -6, max: 6, rows: 2, bufferSize: 120 }),
          mon.addBinding(M, "E", { ...o, label: "能量 E", view: "graph", min: 0, max: 8, rows: 2, bufferSize: 120 }),
          mon.addBinding(M, "x", { ...o, label: "x 紀錄", bufferSize: 4, rows: 4, format: (n) => n.toFixed(3) }),
          mon.addBinding(M, "over", { ...o, label: "|x| > 0.5" }),
          mon.addBinding(M, "events", { ...o, label: "事件", multiline: true, rows: 3 }),
        ];
      }
      buildMonitors(16);
      iv.on("change", (ev) => {
        buildMonitors(ev.value);
        logEvent(ev.value ? `interval = ${ev.value}ms` : "interval = 0，改手動");
      });
      pane.on("change", (ev) => {
        if (ev.last && ev.target.key in P) logEvent(`${ev.target.key} = ${round2(ev.value)}`);
      });

      function kick() {
        v += 3.2 / P.m;
        kickFx = 1;
        logEvent("踢一下 v += 3.2/m");
      }

      const TRAIL = 700;
      const trail = new Float32Array(TRAIL * 2);
      let head = 0, filled = 0, settled = false;
      function draw() {
        const { g, w, h } = S;
        g.fillStyle = "#0e1013";
        g.fillRect(0, 0, w, h);
        const split = Math.max(130, w * 0.36);
        // spring + mass
        const cx = split / 2, top = 26, rest = h * 0.47, unit = Math.min(h * 0.25, 120);
        const my = rest + Math.max(-1.7, Math.min(1.7, x)) * unit;
        g.fillStyle = "#3a3f4b";
        g.fillRect(cx - 46, top - 8, 92, 6);
        g.strokeStyle = "rgba(255,255,255,0.18)";
        g.setLineDash([4, 4]);
        g.beginPath(); g.moveTo(cx - 56, rest); g.lineTo(cx + 56, rest); g.stroke();
        g.setLineDash([]);
        const coils = 14, end = my - 22;
        g.strokeStyle = "#b9b7ae";
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(cx, top - 2);
        for (let i = 1; i < coils * 2; i++) g.lineTo(cx + (i % 2 ? 13 : -13), top + 4 + ((end - top - 8) * i) / (coils * 2));
        g.lineTo(cx, end);
        g.stroke();
        g.fillStyle = kickFx > 0 ? mixHex("#4cc9f0", "#f72585", kickFx) : "#4cc9f0";
        g.fillRect(cx - 28, my - 22, 56, 44);
        g.fillStyle = "#0e1013";
        g.font = `600 12px ${MONO}`;
        g.textAlign = "center";
        g.fillText(`m=${P.m.toFixed(1)}`, cx, my + 4);
        g.fillStyle = "#8b8a84";
        g.fillText("x = 0", cx + 60 > split - 4 ? cx : cx + 70, rest - 6);
        // phase portrait (x, v / omega): undamped motion is a circle, damping makes it spiral inwards
        const omega = Math.sqrt(P.k / P.m);
        const px0 = split + 8, pw = w - px0 - 12, py0 = 30, ph = h - 70;
        const ox = px0 + pw / 2, oy = py0 + ph / 2, sc = Math.min(pw, ph) / 2 / 1.5;
        g.strokeStyle = "rgba(255,255,255,0.12)";
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(px0, oy); g.lineTo(px0 + pw, oy); g.moveTo(ox, py0); g.lineTo(ox, py0 + ph);
        g.stroke();
        g.fillStyle = "#8b8a84";
        g.font = `12px ${SANS}`;
        g.textAlign = "left";
        g.fillText("相位圖（橫軸 x，縱軸 v／ω）", px0 + 4, py0 - 10);
        trail[head * 2] = x; trail[head * 2 + 1] = v / omega;
        head = (head + 1) % TRAIL; filled = Math.min(TRAIL, filled + 1);
        g.lineWidth = 1.6;
        for (let i = 1; i < filled; i++) {
          const a = (head - filled + i - 1 + TRAIL) % TRAIL, b = (a + 1) % TRAIL;
          g.strokeStyle = `rgba(247, 223, 30, ${(i / filled) * 0.9})`;
          g.beginPath();
          g.moveTo(ox + trail[a * 2] * sc, oy - trail[a * 2 + 1] * sc);
          g.lineTo(ox + trail[b * 2] * sc, oy - trail[b * 2 + 1] * sc);
          g.stroke();
        }
        g.fillStyle = "#f72585";
        g.beginPath(); g.arc(ox + x * sc, oy - (v / omega) * sc, 5, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#8b8a84";
        g.font = `12px ${MONO}`;
        g.fillText(`ω = ${omega.toFixed(2)}  ζ = ${(P.c / (2 * Math.sqrt(P.k * P.m))).toFixed(3)}`, px0 + 4, py0 + ph + 18);
      }

      const user = userFlag(ctx, pane.element);
      let tourStep = 0;
      ctx.interval(() => {
        if (user.on) return;
        tourStep++;
        if (tourStep % 2 === 0) iv.value = [16, 100, 500, 0][(tourStep / 2) % 4];
        kick();
      }, 3600);

      ctx.raf((_, dt) => {
        const sub = 6, hs = dt / 1000 / sub;
        const prev = x;
        for (let i = 0; i < sub; i++) {
          const a = (-P.k * x - P.c * v) / P.m;
          v += a * hs;
          x += v * hs;
        }
        simT += dt / 1000;
        kickFx = Math.max(0, kickFx - dt / 600);
        M.x = x; M.v = v;
        M.E = 0.5 * P.m * v * v + 0.5 * P.k * x * x;
        M.over = Math.abs(x) > 0.5;
        if (M.E < 0.005 && !settled) { settled = true; logEvent("幾乎靜止"); }
        if (M.E > 0.05) settled = false;
        // interval 0 uses a manual ticker: refresh the monitors only when x crosses zero
        if (iv.value === 0 && (prev < 0) !== (x < 0)) monitors.forEach((b) => b.refresh());
        draw();
      });
    },
  },

        if (ev.target === B.lake) { B.reflect.disabled = !P.lake; add("api", "API", `倒影.disabled = ${!P.lake}`, {}); }
      });
      let mode = 0;
      tab.on("select", (ev) => {
        const pg = tab.pages[ev.index];
        if (!pg) return; // pane.dispose() removes pages and fires select with no page

      });
      for (const f of [fTerrain, fMount, fLake]) f.on("fold", (ev) => add("fold", "fold", `${f.title} ${ev.expanded ? "展開" : "收合"}`, {}));

      const NEAR = ["#1f3b2d", "#2a1433", "#080914"];
      const FAR = [null, null, "#3b3f72"]; // moonlit haze, so night ridges stay readable against the sky
      const SNOW = ["#f4f7fb", "#ffc9a6", "#8e9ac0"];
      const sky = () => [P.day, P.dusk, P.night][mode];
      function ridge(i, L, x, w) {
        const nz = noises[i];
        let s = 0, amp = 1, f = 1, norm = 0;
        for (let o = 0; o < 5; o++) { s += nz((x / w) * 3.2 * f + i * 17.3) * amp; norm += amp; amp *= P.rough; f *= 2.1; }
        return s / norm;
      }
      function mountains(g, w, h, horizon, alpha) {
        const L = P.layers, sk = sky();
        const peak = h * P.height * 1.2;
        const snowY = horizon - peak * P.snowLine;
        for (let i = 0; i < L; i++) {
          const d = L > 1 ? i / (L - 1) : 1;
          const H = peak * (1 - 0.45 * d);
          const path = new Path2D();
          path.moveTo(0, horizon);
          for (let x = 0; x <= w + 4; x += 4) path.lineTo(x, horizon + h * 0.02 * d - H * ridge(i, L, x, w));

          path.closePath();
          g.globalAlpha = alpha;
          g.fillStyle = mixHex(FAR[mode] ?? sk.bottom, NEAR[mode], 0.3 + 0.7 * d);
          g.fill(path);
          if (P.snow && snowY > 0) {
            g.save();
            g.clip(path);
            g.globalAlpha = alpha * (0.85 - 0.5 * d);

        }
        g.globalAlpha = 1;
      }
      const R = rng(99);
      const stars = Array.from({ length: 600 }, () => ({ x: R(), y: R(), r: 0.4 + R() * 1.2, ph: R() * 6.28 }));
      const clouds = Array.from({ length: 6 }, () => ({ x: R(), y: 0.06 + R() * 0.3, s: 0.6 + R() * 0.9, sp: 0.4 + R() * 0.8 }));
      let clock = 0;
      function draw() {
        const { g, w, h } = S;
        const sk = sky();
        const horizon = P.lake ? h * 0.72 : h;
        const grd = g.createLinearGradient(0, 0, 0, horizon);
        grd.addColorStop(0, sk.top);
        grd.addColorStop(1, sk.bottom);
        g.fillStyle = grd;
        g.fillRect(0, 0, w, h);
        let sun = null;
        if (mode === 0) {
          sun = { x: w * 0.78, y: h * 0.18, r: P.day.sun, c: "#fff6c8" };
        } else if (mode === 1) {
          sun = { x: w * 0.34, y: horizon - h * P.dusk.sunY, r: 34, c: "#ffb36b" };
          const gl = g.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, Math.max(w, h) * 0.6);
          gl.addColorStop(0, `rgba(255, 150, 80, ${0.6 * P.dusk.glow})`);
          gl.addColorStop(1, "rgba(255, 150, 80, 0)");
          g.fillStyle = gl;
          g.fillRect(0, 0, w, h);
        } else {
          for (let i = 0; i < Math.min(P.night.stars, stars.length); i++) {
            const s = stars[i];
            g.globalAlpha = 0.45 + 0.55 * Math.abs(Math.sin(clock * 1.3 + s.ph));
            g.fillStyle = "#fff";
            g.fillRect(s.x * w, s.y * horizon * 0.85, s.r, s.r);
          }
          g.globalAlpha = 1;
          const mx = w * 0.74, my = h * 0.2, mr = 20;
          // moon phase: shadow disc clipped to the moon so it never shows against the sky
          g.save();
          g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.clip();
          g.fillStyle = "#f3efd8";
          g.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
          g.fillStyle = "rgba(10, 10, 24, 0.92)";
          g.beginPath(); g.arc(mx + mr * 2 * P.night.moon, my - 2, mr * 1.02, 0, Math.PI * 2); g.fill();
          g.restore();
        }
        if (sun) {
          g.fillStyle = sun.c;
          g.shadowColor = sun.c;
          g.shadowBlur = 30;
          g.beginPath(); g.arc(sun.x, sun.y, sun.r, 0, Math.PI * 2); g.fill();
          g.shadowBlur = 0;
        }
        if (mode === 0 && P.day.clouds > 0) {
          g.fillStyle = `rgba(255, 255, 255, ${0.85 * P.day.clouds})`;
          for (const c of clouds) {
            const cx = ((c.x * (w + 240) + clock * c.sp * 18) % (w + 240)) - 120, cy = c.y * h, s = c.s * 26;
            g.beginPath();
            g.ellipse(cx, cy, s * 2.2, s * 0.7, 0, 0, Math.PI * 2);
            g.ellipse(cx - s * 0.9, cy - s * 0.3, s * 1.1, s * 0.75, 0, 0, Math.PI * 2);
            g.ellipse(cx + s * 0.6, cy - s * 0.5, s * 1.2, s * 0.9, 0, 0, Math.PI * 2);
            g.fill();
          }
        }
        mountains(g, w, h, horizon, 1);
        if (P.lake) {
          const wg = g.createLinearGradient(0, horizon, 0, h);
          wg.addColorStop(0, mixHex(sk.bottom, "#000000", 0.35));
          wg.addColorStop(1, mixHex(sk.top, "#000000", 0.55));
          g.fillStyle = wg;
          g.fillRect(0, horizon, w, h - horizon);
          // mirror the mountains below the horizon
          g.save();
          g.beginPath(); g.rect(0, horizon, w, h - horizon); g.clip();
          g.translate(0, horizon * 2);

          mountains(g, w, h, horizon, P.reflect * 0.75);
          g.restore();
          g.strokeStyle = "rgba(255, 255, 255, 0.08)";
          g.lineWidth = 1;
          for (let i = 0; i < 9; i++) {
            const y = horizon + ((i + 0.5) * (h - horizon)) / 9;
            const x0 = ((i * 97 + clock * 14 * (i % 2 ? 1 : -1)) % w + w) % w;

      const set = (b, obj, key, val) => { obj[key] = val; b.refresh(); };
      const TOUR = [
        () => { pDusk.selected = true; },
        () => set(B.sunY, P.dusk, "sunY", 0.03),
        () => set(B.layers, P, "layers", 6),
        () => { pNight.selected = true; },
        () => set(B.snow, P, "snow", false),
        () => { fLake.expanded = true; },
        () => set(B.lake, P, "lake", false),
        () => set(B.lake, P, "lake", true),
        () => { fLake.expanded = false; },
        () => { pDay.selected = true; },
        () => set(B.snow, P, "snow", true),
        () => { set(B.layers, P, "layers", 4); set(B.sunY, P.dusk, "sunY", 0.15); },
      ];
      const user = userFlag(ctx, pane.element);
      let k = 0;
      ctx.interval(() => { if (!user.on) TOUR[k++ % TOUR.length](); }, 2300);
      ctx.raf((_, dt) => { clock += dt / 1000; draw(); });
    },
  },

  {

      pane.addBinding(P, "shape", { label: "形狀", view: "radiogrid", groupName: "tp-ess-shape", size: [4, 1],
        cells: (x) => ({ title: ["圓", "方", "菱", "星"][x], value: ["circle", "square", "diamond", "star"][x] }) });
      pane.addBinding(P, "dur", { label: "時長 秒", min: 0.4, max: 4, step: 0.1 });
      const fps = pane.addBlade({ view: "fpsgraph", label: "FPS", rows: 2 });
      let preset = 0;
      const setCurve = (i) => { preset = i; bez.value = new Essentials.CubicBezier(...CURVES[i]); flash(bez); };
      grid.on("click", (ev) => setCurve(ev.index[1] * 3 + ev.index[0]));

      // x(t) is monotonic for x1, x2 in [0, 1], so bisection finds t for a given x.
      function ease(x) {
        const cb = bez.value;

        return cb.curve((lo + hi) / 2)[1];
      }
      function shape(g, kind, x, y, r) {

        if (kind === "circle") g.arc(x, y, r, 0, Math.PI * 2);
        else if (kind === "square") g.rect(x - r * 0.9, y - r * 0.9, r * 1.8, r * 1.8);
        else if (kind === "diamond") { g.moveTo(x, y - r * 1.2); g.lineTo(x + r, y); g.lineTo(x, y + r * 1.2); g.lineTo(x - r, y); g.closePath(); }

        const bx = 18, by = tall ? 40 : (h - s) / 2 + 10;

          g.beginPath(); g.moveTo(X(0), Y(i / 4)); g.lineTo(X(1), Y(i / 4)); g.stroke();

        const c = bez.value;

        g.fillStyle = "#9d8cff";
        for (const [a, b] of [[c.x1, c.y1], [c.x2, c.y2]]) { g.beginPath(); g.arc(X(a), Y(b), 4, 0, Math.PI * 2); g.fill(); }

        g.stroke();
        g.fillStyle = "#f72585";
        g.beginPath(); g.arc(X(u), Y(ease(u)), 6, 0, Math.PI * 2); g.fill();
        g.fillStyle = "#b9b7ae";
        g.font = `12px ${MONO}`;
        g.textAlign = "left";
        const label = `cubic-bezier(${c.toObject().map((v) => round2(v)).join(", ")})`;

        g.fillStyle = "#6f6e69";
        g.fillText("時間 →", X(1) - 46, Y(0) + 16);
        // lanes: linear vs eased, with ghosts at equal time steps
        const lx0 = tall ? bx : bx + s + 30, lx1 = w - 22;

      }
      const draw = () => { drawArt(S.g, S.w, S.h, P); refreshSummary(); };
      S.onSize = draw;
      let quiet = false;
      pane.on("change", () => { if (!quiet) draw(); });
      tab.on("select", () => refreshSummary());
      adv.on("fold", () => refreshSummary());

      const KEY = "js-tools-atlas:tweakpane:snapshots";
      let storeOk = true;
      function loadSnaps() {
        try {
          const a = JSON.parse(localStorage.getItem(KEY) || "null");
          return Array.isArray(a) && a.length ? a : null;
        } catch (e) { storeOk = false; console.warn("tweakpane demo: localStorage read failed", e); return null; }
      }
      function persist() {
        try { localStorage.setItem(KEY, JSON.stringify(snaps)); } catch (e) { storeOk = false; console.warn("tweakpane demo: localStorage write failed", e); }
      }
      // Seed three snapshots with different values, tab pages and folder states.
      const SEEDS = [
        { p: { mode: "wave", lines: 26, amp: 0.32, freq: 2.2, twist: 0.5, seed: 7, colA: "#4cc9f0", colB: "#f72585", bg: "#0b0d12", width: 1.6, glow: true }, page: 0, adv: false },
        { p: { mode: "ring", lines: 18, amp: 0.6, freq: 1.4, twist: 1.1, seed: 42, colA: "#f7df1e", colB: "#ff8c42", bg: "#140d05", width: 2.4, glow: true }, page: 1, adv: false },
        { p: { mode: "wave", lines: 48, amp: 0.75, freq: 4.2, twist: 0.12, seed: 311, colA: "#7bd389", colB: "#9d8cff", bg: "#06100c", width: 1, glow: false }, page: 0, adv: true },
      ];
      let snaps = loadSnaps();
      if (!snaps) {
        quiet = true;
        snaps = SEEDS.map((s) => {
          Object.assign(P, s.p);
          tab.pages[s.page].selected = true;
          adv.expanded = s.adv;
          pane.refresh();
          return pane.exportState();
        });
        quiet = false;
        persist();
      }
      let active = -1;
      function renderCards() {
        strip.textContent = "";
        snaps.forEach((st, i) => {
          const b = make("button", "snap" + (i === active ? " on" : ""));
          b.type = "button";
          const c = document.createElement("canvas");
          c.width = 180; c.height = 112;
          const g = c.getContext("2d");
          g.scale(2, 2);
          const v = { ...P, ...values(st) };
          drawArt(g, 90, 56, v);
          b.append(c, `#${i + 1} ${v.mode === "ring" ? "同心圓" : "波浪"}・${v.lines} 線`);
          b.addEventListener("click", () => { user.on = true; restore(i); });
          strip.append(b);
        });
      }
      function restore(i) {
        quiet = true;
        const ok = pane.importState(snaps[i]);
        quiet = false;
        active = i;
        draw();
        renderCards();
        tag.innerHTML = ok ? `<b>importState(#${i + 1})</b> → true：數值、分頁、資料夾一起還原` : `<b>importState(#${i + 1})</b> → false：面板結構不符，未套用`;
      }
      function snapshot() {
        snaps.push(pane.exportState());
        while (snaps.length > 6) snaps.shift();
        persist();
        active = snaps.length - 1;
        renderCards();
        tag.innerHTML = `<b>exportState()</b> 存成第 ${snaps.length} 張快照` + (storeOk ? "，已寫入 localStorage" : "（此瀏覽器無法寫入 localStorage，只在本頁有效）");
      }
      const user = userFlag(ctx, pane.element);
      restore(0);
      tag.innerHTML = "<b>快照</b> 點下方縮圖還原・按面板按鈕新增";
      ctx.interval(() => { if (!user.on && snaps.length) restore((active + 1) % snaps.length); }, 3200);
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new Pane()・addBinding() × N・pane.refresh()・pane.dispose()",
    desc: "一次建立 N 個 binding，滑桿、數字欄、布林、色票、2D 搖桿、下拉選單六種輪流，每 50 個放進一個 Pane；量從建立到瀏覽器算完版面的耗時（含最後一次 refresh()），超過 2 秒就停止加量。每一列另外列出 DOM 節點數與單獨一次 refresh() 全部重讀的時間。",
    hint: "按左側「開始測試」・右側即時顯示建立出來的面板",
    mount(ctx) {
      const box = make("div", "stress-box");
      const cols = make("div", "cols");
      box.append(cols);
      ctx.el.append(box);
      const PER = 50;
      let panes = [];
      const clear = () => { panes.forEach((p) => p.dispose()); panes = []; cols.textContent = ""; };
      ctx.onCleanup(clear);
      function addOne(p, o, i) {
        const key = "v" + i;
        switch (i % 6) {
          case 0: o[key] = (i * 37) % 100; return p.addBinding(o, key, { label: `滑桿 ${i}`, min: 0, max: 100 });
          case 1: o[key] = i * 1.5; return p.addBinding(o, key, { label: `數字 ${i}` });
          case 2: o[key] = i % 4 === 2; return p.addBinding(o, key, { label: `布林 ${i}` });
          case 3: o[key] = PALETTE[i % PALETTE.length]; return p.addBinding(o, key, { label: `色票 ${i}` });
          case 4: o[key] = { x: 0.3, y: -0.4 }; return p.addBinding(o, key, { label: `2D ${i}`, x: { min: -1, max: 1 }, y: { min: -1, max: 1 } });
          default: o[key] = "b"; return p.addBinding(o, key, { label: `選單 ${i}`, options: { A: "a", B: "b", C: "c" } });
        }
      }
      ctx.bench({
        label: "建立 binding", unit: "個", sizes: [50, 100, 200, 400, 800, 1600, 3200, 6400],
        budget: 2000, target: 500,
        prepare() { clear(); },
        run(n) {
          for (let i = 0; i < n; i += PER) {
            const host = make("div", "col");
            cols.append(host);
            const p = new Pane({ container: host, title: `Pane ${panes.length + 1}` });
            const o = {};
            for (let j = i; j < Math.min(n, i + PER); j++) addOne(p, o, j);
            panes.push(p);
          }
          void cols.offsetHeight; // force style + layout so the timing includes rendering cost
          const t0 = performance.now();
          panes.forEach((p) => p.refresh());
          const r = performance.now() - t0;
          const nodes = cols.getElementsByTagName("*").length;
          return `${NF.format(nodes)} 節點・refresh ${r.toFixed(r < 10 ? 1 : 0)}ms`;
        },
        note: "Tweakpane 每個 binding 都是一組 controller 加 view，建立時就生成全部 DOM 與事件監聽；數量一多，主要成本落在建立節點與版面計算。refresh() 只重讀物件值、有變才更新畫面，所以遠比建立便宜。",
      });
    },
  },
] });
</script>
</body>
</html>
