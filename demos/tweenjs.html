<style>

  .nums { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-evenly; }
  .nums div { display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 6px; white-space: nowrap; }
  .nums span { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
  .nums b { font: 700 22px/1.15 var(--mono); }
  .nums em { font-style: normal; font-size: 11px; color: var(--muted); }

  @media (max-height: 480px) { .nums b { font-size: 16px; line-height: 1.1; } .nums span { font-size: 10px; } }
  @media (max-width: 520px) { .quad { gap: 8px; } .nums b { font-size: 15px; } .nums span { font-size: 10px; } .swatch b { font-size: 10.5px; } }

  /* 7. three camera */

  .hud3 { position: absolute; left: 20px; bottom: 20px; z-index: 3; padding: 6px 10px; font-size: 11px; line-height: 1.6; color: var(--muted); pointer-events: none; white-space: nowrap; }
  .hud3 b { color: var(--accent); font-weight: 600; }

  /* 8. stress */
  .stress-x { position: absolute; inset: 8px 8px 8px 350px; border-radius: 10px; overflow: hidden; background: #0e1013; }
  .stress-x canvas { width: 100%; height: 100%; display: block; }
  @media (max-width: 760px) {
    .stress-x { inset: 8px; }
    /* Keep the lab panel above the bottom toggle instead of covering it. */

<body>
<script src="https://cdn.jsdelivr.net/npm/@tweenjs/tween.js@25.0.0/dist/tween.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// tween.js showcase: particles, easing families, chain/repeat, groups and clocks, interpolation,
// arbitrary values, a three.js camera rig, and a ramp of simultaneous tweens.
const { Tween, Group, Easing, Interpolation } = TWEEN;
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim() || "sans-serif";
const MONO = css.getPropertyValue("--mono").trim() || "monospace";
const MUTED = "#9b998f", LINE = "rgba(255,255,255,0.12)";
const easeFn = (name) => name.split(".").reduce((o, k) => o[k], Easing);
const hexRgb = (hex) => { const n = parseInt(hex.slice(1), 16); return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 }; };
const nf = new Intl.NumberFormat("zh-TW");
const rand = (lo, hi) => lo + Math.random() * (hi - lo);

// One Group stepped once per frame by the scene's rAF loop; emptied on unmount.
function loop(ctx, draw) {
  const group = new Group();
  ctx.onCleanup(() => group.removeAll());
  ctx.raf((t, dt) => { group.update(t); if (draw) draw(t, dt); });
  return group;
}

// HiDPI 2D canvas bound to its CSS box (DPR capped at 2). onFit runs on later size changes only.
function surface(ctx, cv, onFit) {
  const s = { cv, g: cv.getContext("2d"), w: 0, h: 0 };
  const fit = (first) => {
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h || (w === s.w && h === s.h)) return;
    const dpr = Math.min(2, devicePixelRatio || 1);
    s.w = w; s.h = h;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    s.g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (first !== true && onFit) onFit(s);
  };
  const ro = new ResizeObserver(() => fit());
  ro.observe(cv);
  ctx.onCleanup(() => ro.disconnect());
  fit(true);
  return s;
}

function text(g, str, x, y, { color = MUTED, size = 11, weight = 500, font = MONO, align = "left", base = "alphabetic" } = {}) {
  g.font = `${weight} ${size}px ${font}`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = base;
  g.fillText(str, x, y);
}
function dot(g, x, y, r, fill, stroke) {
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2);
  g.fillStyle = fill; g.fill();
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 2; g.stroke(); }
}
// Event log: newest line on top, elapsed seconds since the scene started.
function logger(el, max = 6) {
  const t0 = performance.now(), rows = [];
  return (msg, color = "var(--fg)") => {
    rows.unshift(`<div>${((performance.now() - t0) / 1000).toFixed(2).padStart(6, " ")}s <b style="color:${color}">${msg}</b></div>`);
    rows.length = Math.min(rows.length, max);
    el.innerHTML = rows.join("");
  };
}

Showcase.run({ scenes: [
  {
    id: "morph", title: "粒子補間變形",
    api: "new Tween(p, group).to({ x, y, h }, 1400).easing(fn).delay(d).start()",
    desc: "數百顆粒子各有一個 Tween，同屬一個 Group，每格只呼叫一次 group.update(t)。換形狀時 removeAll() 再補上新目標，延遲依目標 x 座標遞增，形成由左到右的掃動。",
    hint: "移動滑鼠撥開粒子・換形狀或換緩動函式",
    mount(ctx) {
      ctx.html(`<canvas class="full"></canvas>
        <div class="panel code1 mono">new Tween(p, group).to({ x, y, h }, <b>1400</b>).easing(Easing.<b class="en"></b>).delay(x / W * 500)</div>
        <div class="panel ecard"><b class="en"></b><canvas></canvas></div>`);
      const [cv, mini] = ctx.$$("canvas");
      const EASES = ["Elastic.Out", "Back.InOut", "Bounce.Out", "Exponential.InOut", "Cubic.InOut", "Quintic.Out", "Circular.InOut", "Sinusoidal.InOut"];
      const DURATION = 1400, parts = [], ptr = { x: -1e4, y: -1e4 };
      let shape = 0, ease = EASES[0], userEase = false, morphAt = 0, auto = 0;
      const seg = ctx.group(["JS", "愛心", "星系", "網格"], 0, (i) => { morph(i); restart(); });
      const sel = ctx.select("緩動", EASES, ease, (v) => { ease = v; userEase = true; sync(); morph(shape); restart(); });
      ctx.button("重播", () => { scatter(true); morph(shape); restart(); }, { primary: true });
      const group = loop(ctx, frame);
      const S = surface(ctx, cv, () => { fill(); morph(shape); });
      const M = surface(ctx, mini);

      // Fill an inside-test with roughly n evenly spaced points.
      function fillShape(inside, x0, y0, w, h, n) {
        let step = Math.sqrt((w * h) / n), pts = [];
        for (let k = 0; k < 30; k++) {
          pts = [];
          for (let y = y0; y < y0 + h; y += step) for (let x = x0; x < x0 + w; x += step) if (inside(x, y)) pts.push([x, y]);
          if (pts.length >= n) break;
          step *= 0.9;
        }
        for (let i = pts.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pts[i], pts[j]] = [pts[j], pts[i]]; }
        return Array.from({ length: n }, (_, i) => pts[i % pts.length]);
      }
      function targets(kind, n) {
        const W = S.w, H = S.h, top = ctx.controls.offsetHeight + 20;
        const cx = W / 2, cy = top + (H - top) / 2, s = Math.min(W, H - top);
        if (kind === 0) {
          const off = document.createElement("canvas");
          off.width = W; off.height = H;
          const o = off.getContext("2d");
          o.font = `900 ${Math.round(s * 0.56)}px "Arial Black", Arial, sans-serif`;
          o.textAlign = "center"; o.textBaseline = "middle";
          o.fillText("JS", cx, cy);
          const data = o.getImageData(0, 0, W, H).data;
          return fillShape((x, y) => data[((y | 0) * W + (x | 0)) * 4 + 3] > 128, 0, 0, W, H, n).map(([x, y]) => [x, y, 46 + (x / W) * 20]);
        }
        if (kind === 1) {
          const r = s * 0.028;
          return fillShape((x, y) => {
            const u = (x - cx) / (r * 16), v = -(y - cy + r * 2) / (r * 16);
            return (u * u + v * v - 0.25) ** 3 - u * u * v * v * v * 0.125 <= 0;
          }, cx - r * 18, cy - r * 18, r * 36, r * 36, n).map(([x, y]) => [x, y, 330 + ((y - cy) / s) * 60]);
        }
        if (kind === 2) {
          return Array.from({ length: n }, (_, i) => {
            const t = Math.sqrt(Math.random()), arm = i % 3, R = s * 0.46 * t;
            const a = arm * (Math.PI * 2 / 3) + t * 3.4 + (Math.random() - 0.5) * 0.5;
            return [cx + Math.cos(a) * R * 1.15, cy + Math.sin(a) * R * 0.8, 190 + t * 110];
          });
        }
        const cols = Math.round(Math.sqrt(n * (W / (H - top)))), rows = Math.ceil(n / cols);
        const gap = Math.min((W * 0.8) / cols, ((H - top) * 0.8) / rows);
        return Array.from({ length: n }, (_, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          return [cx + (c - (cols - 1) / 2) * gap, cy + (r - (rows - 1) / 2) * gap, (c / cols) * 300];
        });
      }
      function morph(kind) {
        shape = kind;
        [...seg.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === kind)));
        const pts = targets(kind, parts.length), fn = easeFn(ease), now = performance.now();
        morphAt = now;
        group.removeAll();
        parts.forEach((p, i) => {
          const [x, y, h] = pts[i];
          new Tween(p, group).to({ x, y, h }, DURATION).easing(fn).delay((x / S.w) * 500).start(now);
        });
      }
      function fill() {
        const n = Math.max(220, Math.min(520, Math.round((S.w * S.h) / 1300)));
        while (parts.length < n) parts.push({ x: rand(0, S.w), y: rand(0, S.h), h: rand(200, 300), r: rand(1.6, 3.2), ox: 0, oy: 0 });
        parts.length = n;
      }
      function scatter() { parts.forEach((p) => { p.x = S.w / 2 + rand(-20, 20); p.y = S.h / 2 + rand(-20, 20); }); }
      function sync() { sel.value = ease; ctx.$$(".en").forEach((e) => (e.textContent = ease)); }
      function next() {
        if (!userEase) { ease = EASES[(EASES.indexOf(ease) + 1) % EASES.length]; sync(); }
        morph((shape + 1) % 4);
      }
      function restart() { clearInterval(auto); auto = ctx.interval(next, 3400); }
      function drawCurve(now) {
        const g = M.g, w = M.w, h = M.h, fn = easeFn(ease);
        const X = (k) => 4 + k * (w - 8), Y = (v) => h - 6 - ((v + 0.3) / 1.6) * (h - 12);
        g.clearRect(0, 0, w, h);
        g.strokeStyle = "rgba(255,255,255,.14)"; g.lineWidth = 1; g.setLineDash([3, 3]);
        for (const v of [0, 1]) { g.beginPath(); g.moveTo(0, Y(v)); g.lineTo(w, Y(v)); g.stroke(); }
        g.setLineDash([]); g.strokeStyle = C[1]; g.lineWidth = 2; g.beginPath();
        for (let i = 0; i <= 80; i++) { const k = i / 80; i ? g.lineTo(X(k), Y(fn(k))) : g.moveTo(X(k), Y(fn(k))); }
        g.stroke();
        const k = Math.min(1, Math.max(0, (now - morphAt) / DURATION));
        dot(g, X(k), Y(fn(k)), 4, C[0]);
      }
      function frame(now) {
        const g = S.g;
        g.fillStyle = "rgba(14,16,19,0.3)";
        g.fillRect(0, 0, S.w, S.h);
        for (const p of parts) {
          // The pointer pushes particles away; the push decays so the tweens stay in charge.
          const dx = p.x + p.ox - ptr.x, dy = p.y + p.oy - ptr.y, d2 = dx * dx + dy * dy;
          if (d2 < 6400) { const f = ((6400 - d2) / 6400) * 6, d = Math.sqrt(d2) || 1; p.ox += (dx / d) * f; p.oy += (dy / d) * f; }
          p.ox *= 0.9; p.oy *= 0.9;
          g.fillStyle = `hsl(${p.h} 90% 62%)`;
          g.beginPath(); g.arc(p.x + p.ox, p.y + p.oy, p.r, 0, Math.PI * 2); g.fill();
        }
        drawCurve(now);
      }
      ctx.on(cv, "pointermove", (e) => { const r = cv.getBoundingClientRect(); ptr.x = e.clientX - r.left; ptr.y = e.clientY - r.top; });
      ctx.on(cv, "pointerleave", () => { ptr.x = ptr.y = -1e4; });
      fill();
      sync();
      morph(0);
      restart();
    },
  },
  {
    id: "easing", title: "緩動家族",
    api: "tween.easing(Easing.Elastic.Out)・Easing.generatePow(n)",
    desc: "內建 10 個緩動家族，各有 In、Out、InOut 三種形式，另有 Linear 與可調次方的 generatePow()。每格都是真的 Tween：曲線上的白點來自 onUpdate 回傳的進度，下方軌道是實際補間出的值，Elastic、Back 會衝過頭。",
    hint: "切換 In／Out／InOut，或拉 generatePow 的次方",
    mount(ctx) {
      ctx.html(`<div class="pad"><canvas></canvas></div>`);
      const FAM = ["Linear", "Quadratic", "Cubic", "Quartic", "Quintic", "Sinusoidal", "Exponential", "Circular", "Elastic", "Back", "Bounce", "generatePow"];
      const MODES = ["In", "Out", "InOut"];
      let mode = 1, dur = 1400, pow = 2.5, cells = [];
      ctx.group(MODES, mode, (i) => { mode = i; build(); });
      ctx.slider("時長", { min: 400, max: 3000, step: 100, value: dur, format: (v) => `${v} ms` }, (v) => { dur = v; build(); });
      ctx.slider("generatePow", { min: 1, max: 8, step: 0.5, value: pow, format: (v) => v.toFixed(1) }, (v) => { pow = v; build(); });
      const group = loop(ctx, draw);
      const S = surface(ctx, ctx.$("canvas"));
      function build() {
        group.removeAll();
        const t = performance.now(), m = MODES[mode];
        cells = FAM.map((f, i) => {
          const fn = f === "Linear" ? Easing.Linear.None : f === "generatePow" ? Easing.generatePow(pow)[m] : Easing[f][m];
          const name = f === "Linear" ? "Linear.None" : f === "generatePow" ? `generatePow(${pow}).${m}` : `${f}.${m}`;
          const st = { v: 0, k: 0 };
          new Tween(st, group).to({ v: 1 }, dur).easing(fn).repeat(Infinity).repeatDelay(600)
            .onUpdate((o, k) => { o.k = k; }).start(t);
          return { fn, name, st, color: C[i % 6] };
        });
      }
      function draw() {
        const g = S.g, W = S.w, H = S.h, gap = 8;
        g.clearRect(0, 0, W, H);
        const cols = W >= 900 ? 6 : W >= 540 ? 4 : 3, rows = Math.ceil(cells.length / cols);
        const cw = (W - gap * (cols - 1)) / cols, ch = (H - gap * (rows - 1)) / rows, small = cw < 140;
        cells.forEach((c, i) => {
          const x = (i % cols) * (cw + gap), y = Math.floor(i / cols) * (ch + gap);
          g.fillStyle = "rgba(255,255,255,0.035)"; g.strokeStyle = LINE; g.lineWidth = 1;
          g.beginPath(); g.roundRect(x + 0.5, y + 0.5, cw - 1, ch - 1, 8); g.fill(); g.stroke();
          text(g, c.name, x + 8, y + 15, { color: c.color, size: small ? 9 : 11, weight: 600 });
          if (!small && g.measureText(c.name).width + 48 < cw) text(g, c.st.v.toFixed(2), x + cw - 8, y + 15, { size: 10, align: "right" });
          const px0 = x + 10, px1 = x + cw - 10, py0 = y + 24, py1 = y + ch - 24;
          const X = (k) => px0 + k * (px1 - px0), Y = (v) => py1 - ((v + 0.4) / 1.8) * (py1 - py0);
          g.setLineDash([3, 3]); g.strokeStyle = "rgba(255,255,255,0.14)"; g.beginPath();
          g.moveTo(px0, Y(0)); g.lineTo(px1, Y(0)); g.moveTo(px0, Y(1)); g.lineTo(px1, Y(1)); g.stroke(); g.setLineDash([]);
          g.strokeStyle = c.color; g.lineWidth = 1.6; g.globalAlpha = 0.6; g.beginPath();
          for (let j = 0; j <= 60; j++) { const k = j / 60; j ? g.lineTo(X(k), Y(c.fn(k))) : g.moveTo(X(k), Y(c.fn(k))); }
          g.stroke(); g.globalAlpha = 1;
          dot(g, X(c.st.k), Y(c.st.v), 3.5, "#fff");
          // The track shows the tweened value itself, overshoot included.
          const ty = y + ch - 11, T = (v) => x + cw * 0.2 + v * cw * 0.6;
          g.strokeStyle = "rgba(255,255,255,0.2)"; g.beginPath(); g.moveTo(T(0), ty); g.lineTo(T(1), ty);
          g.moveTo(T(0), ty - 4); g.lineTo(T(0), ty + 4); g.moveTo(T(1), ty - 4); g.lineTo(T(1), ty + 4); g.stroke();
          dot(g, T(c.st.v), ty, 5, c.color);
        });
      }
      build();
    },
  },
  {
    id: "chain", title: "串接與重複",
    api: "a.chain(b)・tween.repeat(n).yoyo(true).repeatDelay(ms)・onStart／onRepeat／onComplete",
    desc: "左邊四段 Tween 首尾 chain 成環，每段用不同緩動、以 delay 當停站時間；右邊一個 Tween 以 repeat＋yoyo 來回，完成後 chain(a, b, c) 同時啟動三個 Tween，再接回自己。下方是實際觸發的事件。",
    hint: "調 repeat 次數、切換 yoyo，觀察事件順序",
    mount(ctx) {
      ctx.html(`<div class="pad duo">
        <div class="panel cardx"><h2>chain 環島列車<small>4 段首尾相接</small></h2><canvas></canvas><div class="log a"></div></div>
        <div class="panel cardx"><h2>repeat・yoyo<small class="rp"></small></h2><canvas></canvas><div class="log b"></div></div></div>`);
      let rep = 3, yoyo = true, rdelay = 200;
      ctx.slider("repeat", { min: 0, max: 5, step: 1, value: rep }, (v) => { rep = v; buildB(); });

            g.beginPath(); g.moveTo(gx - 5, gy - 5); g.lineTo(gx + 5, gy + 5); g.moveTo(gx + 5, gy - 5); g.lineTo(gx - 5, gy + 5); g.stroke();
          }
          dot(g, X(c.p.x), Y(c.p.y), 6, c.color, "#0e1013");
        }
        dot(g, X(target.x), Y(target.y), 7, C[0], "#fff");
        text(g, w < 300 ? "● true" : "● dynamic(true)", 4, h - 4, { color: C[1], size: 10 });
        text(g, w < 300 ? "● false（×＝目標）" : "● false（× 為出發時目標）", w - 4, h - 4, { color: C[2], size: 10, align: "right" });
      }
      retarget();
      ctx.interval(retarget, 3200);
    },
  },
  {
    id: "camera", title: "驅動 three.js 相機",
    api: "new Tween(cam).to(view, 2600).onUpdate(o => { camera.position.set(o.x, o.y, o.z); camera.lookAt(o.tx, o.ty, o.tz) })",
    desc: "tween.js 不需要認得 three.js：它只補間一個含位置、注視點與 fov 的普通物件，onUpdate 再寫回 PerspectiveCamera。四個視角首尾 chain 成自動導覽；手動切換時停掉導覽，新的 Tween 從相機目前的位置出發。",
    hint: "點視角按鈕跳轉・關掉自動導覽就停在原地",
    async mount(ctx) {
      ctx.html(`<div class="stage3"></div><div class="panel hud3 mono"></div>`);
      const VIEWS = [
        { x: 72, y: 58, z: 72, tx: 0, ty: 6, tz: 0, fov: 42 },
        { x: -20, y: 2.5, z: 34, tx: 0, ty: 20, tz: 0, fov: 72 },
        { x: 7, y: 56, z: 7, tx: -40, ty: 0, tz: -34, fov: 58 },
        { x: -110, y: 16, z: -46, tx: 0, ty: 14, tz: 0, fov: 26 },
      ];
      const NAMES = ["鳥瞰", "街道", "塔頂", "望遠"];
      let auto = true, view = 0, legs = [], manual = null, ready = false;
      const seg = ctx.group(NAMES, 0, (i) => ready && goTo(i));
      const autoBtn = ctx.toggle("自動導覽", true, (v) => { auto = v; if (ready) v ? startTour() : stopAll(); });
      const st = ctx.status("載入 three.js…");
      const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js");
      st.done();
      if (!ctx.active) return;
      const box = ctx.$(".stage3"), hud = ctx.$(".hud3");
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
      box.append(renderer.domElement);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0e1013);
      scene.fog = new THREE.Fog(0x0e1013, 90, 220);
      const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 500);
      scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x22262d, 1.4));
      const sun = new THREE.DirectionalLight(0xffffff, 2.2);
      sun.position.set(40, 70, 25); scene.add(sun);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x15181d, roughness: 1 }));
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground, new THREE.GridHelper(200, 40, 0x2c313a, 0x20242b));
      // City blocks: one InstancedMesh, taller towards the centre.
      const cells = [];
      for (let i = -8; i <= 8; i++) for (let j = -8; j <= 8; j++) if (Math.abs(i) > 1 || Math.abs(j) > 1) cells.push([i, j]);
      const geo = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
      const city = new THREE.InstancedMesh(geo, new THREE.MeshStandardMaterial({ roughness: 0.75, metalness: 0.1 }), cells.length);
      const m4 = new THREE.Matrix4(), tint = new THREE.Color(), pal = C.map((c) => new THREE.Color(c));
      cells.forEach(([i, j], k) => {
        const d = Math.hypot(i, j), hgt = Math.max(1.5, rand(3, 22) * Math.exp(-d / 7) + rand(0, 3));
        m4.makeScale(4.2, hgt, 4.2).setPosition(i * 6, 0, j * 6);
        city.setMatrixAt(k, m4);
        city.setColorAt(k, tint.copy(pal[k % 6]).lerp(new THREE.Color(0x3a3f48), 0.72));
      });
      scene.add(city);
      const gold = new THREE.MeshStandardMaterial({ color: C[0], roughness: 0.35, metalness: 0.4, emissive: 0x2a2400 });
      for (let s = 0; s < 8; s++) {
        const seg8 = new THREE.Mesh(new THREE.CylinderGeometry(3.4 - s * 0.18, 2.6 - s * 0.18, 5, 4), gold);
        seg8.position.y = 2.5 + s * 5.2; seg8.rotation.y = Math.PI / 4;
        scene.add(seg8);
      }
      const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.5, 9, 8), gold);
      spire.position.y = 46; scene.add(spire);
      ctx.onCleanup(() => {
        scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
        renderer.dispose(); renderer.forceContextLoss();
      });
      const cam = { ...VIEWS[0] };
      const apply = (o) => {
        camera.position.set(o.x, o.y, o.z);
        camera.lookAt(o.tx, o.ty, o.tz);
        camera.fov = o.fov;
        camera.updateProjectionMatrix();
        hud.innerHTML = `position <b>${o.x.toFixed(1)}, ${o.y.toFixed(1)}, ${o.z.toFixed(1)}</b><br>lookAt <b>${o.tx.toFixed(1)}, ${o.ty.toFixed(1)}, ${o.tz.toFixed(1)}</b>　fov <b>${o.fov.toFixed(1)}</b>`;
      };
      const group = new Group();
      ctx.onCleanup(() => group.removeAll());
      const mark = (i) => { view = i; [...seg.children].forEach((b, j) => b.setAttribute("aria-pressed", String(j === i))); };
      function stopAll() {
        [...legs, manual].forEach((tw) => tw && tw.stop().remove());
        legs = []; manual = null;
      }
      // Fresh legs each time the tour starts, so every leg records its start values when it first runs.
      function startTour() {
        stopAll();
        legs = VIEWS.map((v, i) => new Tween(cam, group).to({ ...v }, 2600).delay(1100).easing(Easing.Cubic.InOut)
          .onStart(() => mark(i)).onUpdate(apply));
        legs.forEach((tw, i) => tw.chain(legs[(i + 1) % legs.length]));
        legs[(view + 1) % legs.length].start();
      }
      function goTo(i) {
        auto = false; autoBtn.setAttribute("aria-pressed", "false");
        stopAll(); mark(i);
        manual = new Tween(cam, group).to({ ...VIEWS[i] }, 1800).easing(Easing.Quintic.InOut).onUpdate(apply).start();
      }
      const fit = () => {
        const w = box.clientWidth, h = box.clientHeight;
        if (w && h) { renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
      };
      const ro = new ResizeObserver(fit);
      ro.observe(box);
      ctx.onCleanup(() => ro.disconnect());
      fit();
      apply(cam);
      ready = true;
      if (auto) startTour();
      ctx.raf((t) => {
        group.update(t);
        gold.emissiveIntensity = 1 + Math.sin(t / 400) * 0.6;
        renderer.render(scene, camera);
      });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × new Tween(p, group).to(target, d).repeat(Infinity).yoyo(true).repeatDelay(120)・group.update(t)",
    desc: "每顆粒子一個獨立 Tween（隨機緩動與時長、無限 yoyo），全部放在同一個 Group，每格呼叫一次 group.update(t)；逐級加量直到低於 30 FPS。",
    hint: "按「自動加壓」開始；關掉繪製可只看補間本身的成本",
    mount(ctx) {
      ctx.html(`<div class="stress-x"><canvas></canvas></div>`);
      const cv = ctx.$("canvas"), g = cv.getContext("2d");
      const group = new Group();
      ctx.onCleanup(() => group.removeAll());
      const EASE = ["Quadratic.InOut", "Cubic.Out", "Sinusoidal.InOut", "Back.InOut", "Elastic.Out", "Bounce.Out", "Exponential.InOut", "Circular.Out"].map(easeFn);
      // Pack palette colours as little-endian ABGR for a Uint32 view of ImageData.
      const PAL = C.map((c) => { const { r, g: gg, b } = hexRgb(c); return (255 << 24) | (b << 16) | (gg << 8) | r; });
      const BG = (255 << 24) | (0x13 << 16) | (0x10 << 8) | 0x0e;
      const items = [];
      let W = 0, H = 0, img, buf, drawOn = true, updMs = 0, drawMs = 0, buildMs = 0;
      const fit = () => {
        const w = cv.clientWidth, h = cv.clientHeight;
        if (!w || !h || (w === W && h === H)) return;
        W = cv.width = w; H = cv.height = h;
        img = g.createImageData(W, H);
        buf = new Uint32Array(img.data.buffer);
      };
      const ro = new ResizeObserver(fit);
      ro.observe(cv);
      ctx.onCleanup(() => ro.disconnect());
      fit();
      function resize(n) {
        const t0 = performance.now();
        while (items.length < n) {
          const p = { x: Math.random(), y: Math.random(), c: PAL[items.length % PAL.length] };
          p.tw = new Tween(p, group).to({ x: Math.random(), y: Math.random() }, rand(700, 2400))
            .easing(EASE[items.length % EASE.length]).repeat(Infinity).yoyo(true).repeatDelay(120).start(t0 - rand(0, 650));
          items.push(p);
        }
        while (items.length > n) items.pop().tw.stop().remove();
        buildMs = performance.now() - t0;
      }
      ctx.raf((t) => {
        const a = performance.now();
        group.update(t);
        const b = performance.now();
        updMs = updMs * 0.9 + (b - a) * 0.1;
        if (!drawOn) return;
        buf.fill(BG);
        for (let i = 0; i < items.length; i++) {
          const p = items[i], x = (p.x * (W - 2)) | 0, y = (p.y * (H - 2)) | 0;
          if (x < 0 || y < 0 || x > W - 2 || y > H - 2) continue;
          const k = y * W + x;
          buf[k] = buf[k + 1] = buf[k + W] = buf[k + W + 1] = p.c;
        }
        g.putImageData(img, 0, 0);
        drawMs = drawMs * 0.9 + (performance.now() - b) * 0.1;
      });
      ctx.toggle("繪製粒子", true, (v) => {
        drawOn = v;
        if (!v) { g.fillStyle = "#0e1013"; g.fillRect(0, 0, W, H); text(g, "繪製已關閉：只執行 group.update()", W / 2, H / 2, { size: 13, align: "center", font: FONT }); }
      });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "同時進行的 Tween", unit: "個", steps: [1000, 2500, 5000, 10000, 20000, 40000, 80000, 160000],
        minFps: 30,
        apply: resize,
        metrics: () => ({ "Group 內 Tween": items.length, "group.update／格": `${updMs.toFixed(2)} ms`, "繪製／格": drawOn ? `${drawMs.toFixed(2)} ms` : "關閉", "本級新增耗時": `${buildMs.toFixed(0)} ms` }),
        note: "「group.update／格」只量 tween.js 本身：逐一推進每個 Tween、套用緩動、寫回 x 與 y。繪製用 ImageData 直接寫像素，成本隨粒子數線性增加；關掉繪製後掉幀主要來自 update 迴圈與記憶體。「本級新增耗時」是這一級新建 Tween 的一次性成本，不在每格內。",
      });
    },
  },
] });
</script>
