<style>
  .sc-scene canvas.gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .info { position: absolute; z-index: 5; left: 10px; top: calc(var(--sc-ctl-h, 0px) + 10px); max-width: min(300px, calc(100% - 20px));
    padding: 8px 11px; font: 12px/1.6 var(--mono); color: var(--muted); pointer-events: none; }
  .info b { color: var(--fg); font-weight: 600; }
  .info code { color: var(--accent); }
  .tags { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
  .tags span { position: absolute; left: 0; top: 0; padding: 3px 8px; border-radius: 999px; font: 11px/1.2 var(--mono);
    color: var(--muted); background: rgba(14, 16, 19, 0.72); white-space: nowrap; transition: color 0.2s; }
  .tags span.on { color: var(--accent); }
  .stress-box { position: absolute; inset: 8px 8px 8px 350px; border-radius: 10px; overflow: hidden; }
  @media (max-width: 760px) { .stress-box { inset: 0; border-radius: 0; } }

<body>
<script src="_shared/showcase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/twgl.js@7.0.0/dist/7.x/twgl-full.js"></script>
<script>
const { m4, v3, primitives } = twgl;
const hexColor = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
const cssColor = (name) => hexColor(getComputedStyle(document.documentElement).getPropertyValue(name).trim() || "#ffffff");
const hsl = (h, s, l) => {
  const f = (n) => { const k = (n + h * 12) % 12; return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return [f(0), f(8), f(4)];
};
const FULLSCREEN = { position: { numComponents: 2, data: [-1, -1, 3, -1, -1, 3] } };

// One WebGL2 canvas per scene. twgl.resizeCanvasToDisplaySize keeps the drawing buffer matched to
// the CSS size; the context is released on unmount so switching scenes never exhausts contexts.
function glStage(ctx, { host = ctx.el, antialias = true } = {}) {
  const canvas = document.createElement("canvas");
  canvas.className = "gl";
  host.append(canvas);
  const gl = canvas.getContext("webgl2", { antialias });
  ctx.onCleanup(() => { gl?.getExtension("WEBGL_lose_context")?.loseContext(); canvas.remove(); });
  if (!gl) { ctx.status("").error("此瀏覽器不支援 WebGL2，無法執行這個場景"); return null; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const view = {
    canvas, gl, dpr, aspect: 1,
    fit() {
      twgl.resizeCanvasToDisplaySize(canvas, dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
      view.aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
      return view.aspect;
    },
  };
  return view;
}

function trackPointer(ctx, el) {
  const p = { x: 0, y: 0, nx: 0, ny: 0, down: false, last: -1e9, idle: (ms = 2000) => performance.now() - p.last > ms };
  const move = (e) => {
    const r = el.getBoundingClientRect();
    p.x = e.clientX - r.left; p.y = e.clientY - r.top;
    p.nx = (p.x / r.width) * 2 - 1; p.ny = -((p.y / r.height) * 2 - 1);
    p.last = performance.now();
  };
  ctx.on(el, "pointermove", move);
  ctx.on(el, "pointerdown", (e) => { p.down = true; move(e); });
  ctx.on(window, "pointerup", () => { p.down = false; });
  return p;
}

// Cast a ray from normalized device coordinates onto the horizontal plane y = h.
function hitPlane(viewProjection, nx, ny, h = 0) {
  const inv = m4.inverse(viewProjection);
  const near = m4.transformPoint(inv, [nx, ny, -1]);
  const far = m4.transformPoint(inv, [nx, ny, 1]);
  const dir = v3.subtract(far, near);
  if (Math.abs(dir[1]) < 1e-6) return null;
  const t = (h - near[1]) / dir[1];
  return t < 0 ? null : v3.add(near, v3.mulScalar(dir, t));
}

// GLSL helper shared by the panorama scene: direction to equirectangular UV (image row 0 is the zenith).
const EQUIRECT = `
  vec2 equirect(vec3 d) {
    return vec2(atan(d.z, d.x) * 0.15915494 + 0.5, 0.5 - asin(clamp(d.y, -1.0, 1.0)) * 0.31830989);
  }`;

Showcase.run({ scenes: [
  {
    id: "city", title: "漣漪城市",
    api: "createBufferInfoFromArrays({ offset: { divisor: 1 } })・createVertexArrayInfo・drawBufferInfo(…, instanceCount)",
    desc: "兩千多根光柱共用 twgl.primitives 的一個立方體，格點位置與亂數種子寫成 divisor 1 的實例屬性並包進 VAO，每幀一次 instanced draw。十六組漣漪以 uniform 陣列傳入，高度全在頂點著色器計算。",
    hint: "點地面掀起一圈波浪・游標掠過會留下小漣漪",
    mount(ctx) {
      const GRID = 48, COUNT = GRID * GRID, MAX_RIPPLES = 16;
      const v = glStage(ctx);
      if (!v) return;
      const { gl } = v;
      const vs = `#version 300 es
        in vec4 position;
        in vec3 normal;
        in vec2 offset;
        in float seed;
        uniform mat4 u_viewProjection;
        uniform float u_time;
        uniform vec4 u_ripples[${MAX_RIPPLES}];
        out vec3 v_normal;
        out vec3 v_world;
        out float v_height;
        out float v_seed;
        void main() {
          // Ambient swell plus expanding ripple rings (x, z, start time, strength)
          float h = 0.35 + 0.25 * sin(offset.x * 0.32 + u_time * 1.1) * cos(offset.y * 0.27 + u_time * 0.8);
          for (int i = 0; i < ${MAX_RIPPLES}; i++) {
            vec4 r = u_ripples[i];
            float age = u_time - r.z;
            if (age < 0.0 || age > 7.0) continue;
            float ring = distance(offset, r.xy) - age * 8.0;
            h += r.w * 4.0 * exp(-ring * ring * 0.18) * exp(-age * 0.55);
          }
          h = max(h, 0.06) * (0.85 + seed * 0.3);
          vec3 p = position.xyz;
          p.y = (p.y + 0.5) * h;
          p.xz *= 0.78;
          vec3 world = p + vec3(offset.x, 0.0, offset.y);
          v_world = world;
          v_height = h;
          v_normal = normal;
          v_seed = seed;
          gl_Position = u_viewProjection * vec4(world, 1.0);
        }`;
      const fs = `#version 300 es
        precision highp float;
        in vec3 v_normal;
        in vec3 v_world;
        in float v_height;
        in float v_seed;
        uniform vec3 u_low, u_high, u_bg, u_eye;
        uniform vec2 u_fog;
        out vec4 outColor;
        void main() {
          vec3 n = normalize(v_normal);
          float diff = 0.35 + 0.65 * max(dot(n, normalize(vec3(0.4, 1.0, 0.3))), 0.0);
          float t = clamp(v_height / 3.2, 0.0, 1.0);
          vec3 base = mix(u_low, u_high, smoothstep(0.05, 0.9, t));
          float cap = step(0.5, n.y) * smoothstep(0.35, 1.0, t);
          vec3 col = base * diff + u_high * cap * 0.9 + v_seed * 0.03;
          float fog = smoothstep(u_fog.x, u_fog.y, distance(v_world, u_eye));
          outColor = vec4(mix(col, u_bg, fog), 1.0);
        }`;
      const programInfo = twgl.createProgramInfo(gl, [vs, fs]);
      const cube = primitives.createCubeVertices(1);
      const offsets = new Float32Array(COUNT * 2), seeds = new Float32Array(COUNT);
      for (let z = 0; z < GRID; z++) for (let x = 0; x < GRID; x++) {
        const i = z * GRID + x;
        offsets[i * 2] = x - (GRID - 1) / 2;
        offsets[i * 2 + 1] = z - (GRID - 1) / 2;
        seeds[i] = Math.random();
      }
      const bufferInfo = twgl.createBufferInfoFromArrays(gl, {
        position: cube.position, normal: cube.normal, indices: cube.indices,
        offset: { numComponents: 2, data: offsets, divisor: 1 },
        seed: { numComponents: 1, data: seeds, divisor: 1 },
      });
      const vao = twgl.createVertexArrayInfo(gl, programInfo, bufferInfo);

      const THEMES = [
        { name: "霓虹", low: "#1b1f4a", high: "#4cc9f0", bg: "#0b0d14" },
        { name: "日落", low: "#3a1238", high: "#ff8c42", bg: "#140b10" },
        { name: "螢光", low: "#10301f", high: "#c8ff4a", bg: "#08110c" },
      ].map((t) => ({ ...t, low: hexColor(t.low), high: hexColor(t.high), bg: hexColor(t.bg) }));
      let theme = THEMES[0], spinning = true, angle = 0.7, now = 0, lastAuto = -1, lastTrail = 0;
      let viewProjection = m4.identity();
      const ripples = new Float32Array(MAX_RIPPLES * 4).fill(-100);
      let slot = 0;
      const addRipple = (x, z, strength) => { ripples.set([x, z, now, strength], slot * 4); slot = (slot + 1) % MAX_RIPPLES; };

      ctx.button("投下漣漪", () => addRipple((Math.random() - 0.5) * GRID * 0.6, (Math.random() - 0.5) * GRID * 0.6, 1.2), { primary: true });
      ctx.group(THEMES.map((t) => t.name), 0, (i) => { theme = THEMES[i]; });
      ctx.toggle("環繞鏡頭", true, (on) => { spinning = on; });
      ctx.fps({ position: "right bottom", extra: () => ({ 光柱: COUNT, "draw call": 1 }) });

      const pointer = trackPointer(ctx, v.canvas);
      ctx.on(v.canvas, "pointerdown", () => {
        const hit = hitPlane(viewProjection, pointer.nx, pointer.ny);
        if (hit) { addRipple(hit[0], hit[2], 1.3); lastAuto = now; }
      });
      ctx.on(v.canvas, "pointermove", () => {
        if (now - lastTrail < 0.25) return;
        const hit = hitPlane(viewProjection, pointer.nx, pointer.ny);
        if (hit && Math.abs(hit[0]) < GRID / 2 && Math.abs(hit[2]) < GRID / 2) { lastTrail = now; addRipple(hit[0], hit[2], 0.35); }
      });

      gl.enable(gl.DEPTH_TEST);
      gl.enable(gl.CULL_FACE);
      ctx.raf((t, dt) => {
        now = t * 0.001;
        const aspect = v.fit();
        gl.clearColor(theme.bg[0], theme.bg[1], theme.bg[2], 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        if (now - lastAuto > 1.4) {
          lastAuto = now;
          addRipple((Math.random() - 0.5) * GRID * 0.7, (Math.random() - 0.5) * GRID * 0.7, 0.8 + Math.random() * 0.5);
        }
        if (spinning) angle += dt * 0.00015;
        const dist = aspect < 1 ? 52 : 44;
        const eye = [Math.cos(angle) * dist, aspect < 1 ? 30 : 24, Math.sin(angle) * dist];
        const projection = m4.perspective(((aspect < 1 ? 60 : 45) * Math.PI) / 180, aspect, 0.5, 200);
        viewProjection = m4.multiply(projection, m4.inverse(m4.lookAt(eye, [0, 0, 0], [0, 1, 0])));
        gl.useProgram(programInfo.program);
        twgl.setBuffersAndAttributes(gl, programInfo, vao);
        twgl.setUniforms(programInfo, {
          u_viewProjection: viewProjection, u_time: now, u_ripples: ripples,
          u_low: theme.low, u_high: theme.high, u_bg: theme.bg, u_eye: eye, u_fog: [dist - 14, dist + 30],
        });
        twgl.drawBufferInfo(gl, vao, gl.TRIANGLES, vao.numElements, 0, COUNT);
      });
    },
  },
  {
    id: "primitives", title: "幾何體圖鑑",
    api: "primitives.createTorusVertices()・deindexVertices・flattenNormals・drawObjectList",
    desc: "八種內建幾何體都由 twgl.primitives 產生，附帶位置、法線與 UV；棋盤貼圖直接由 Uint8Array 建立。整組物件交給 drawObjectList，它只在程式或 VAO 改變時才重新綁定。切換平面著色會用 deindexVertices 加 flattenNormals 重建頂點。",
    hint: "切換著色模式比較法線與 UV・游標移到物件上會放大",
    mount(ctx) {
      ctx.html(`<div class="tags"></div>`);
      const v = glStage(ctx);
      if (!v) return;
      const { gl } = v;
      const programInfo = twgl.createProgramInfo(gl, [`#version 300 es
        in vec4 position;
        in vec3 normal;
        in vec2 texcoord;
        uniform mat4 u_world, u_worldInverseTranspose, u_viewProjection;
        out vec3 v_normal;
        out vec3 v_world;
        out vec2 v_uv;
        void main() {
          vec4 world = u_world * position;
          v_world = world.xyz;
          v_normal = mat3(u_worldInverseTranspose) * normal;
          v_uv = texcoord;
          gl_Position = u_viewProjection * world;
        }`, `#version 300 es
        precision highp float;
        in vec3 v_normal;
        in vec3 v_world;
        in vec2 v_uv;
        uniform sampler2D u_texture;
        uniform vec3 u_color, u_eye;
        uniform int u_mode;
        out vec4 outColor;
        void main() {
          vec3 n = normalize(v_normal);
          if (!gl_FrontFacing) n = -n;
          if (u_mode == 1) { outColor = vec4(n * 0.5 + 0.5, 1.0); return; }
          if (u_mode == 2) { outColor = vec4(fract(v_uv), 0.55, 1.0); return; }
          vec3 l = normalize(vec3(0.5, 0.8, 0.6));
          vec3 e = normalize(u_eye - v_world);
          vec3 base = u_color * texture(u_texture, v_uv).rgb;
          float diff = max(dot(n, l), 0.0);
          float spec = pow(max(dot(n, normalize(l + e)), 0.0), 48.0);
          float rim = pow(1.0 - max(dot(n, e), 0.0), 3.0);
          outColor = vec4(base * (0.18 + 0.82 * diff) + spec * 0.45 + rim * u_color * 0.35, 1.0);
        }`]);

      // 8x8 checker texture built from raw bytes
      const texels = new Uint8Array(8 * 8 * 4);
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
        const c = (x + y) % 2 ? 255 : 105;
        texels.set([c, c, c, 255], (y * 8 + x) * 4);
      }
      const checker = twgl.createTexture(gl, { src: texels, width: 8, height: 8, mag: gl.NEAREST, min: gl.LINEAR_MIPMAP_LINEAR });

      const SHAPES = [
        ["立方體", () => primitives.createCubeVertices(1.3)],
        ["球體", () => primitives.createSphereVertices(0.8, 32, 20)],
        ["環面", () => primitives.createTorusVertices(0.6, 0.24, 40, 16)],
        ["圓錐", () => primitives.createTruncatedConeVertices(0.75, 0, 1.5, 32, 1)],
        ["圓柱", () => primitives.createCylinderVertices(0.6, 1.4, 32, 1)],
        ["新月", () => primitives.reorientVertices(primitives.createCrescentVertices(0.85, 0.85, 0.45, 0.16, 32), m4.translation([0, 0, -0.42]))],
        ["圓盤", () => primitives.reorientVertices(primitives.createDiscVertices(0.9, 32, 3, 0.3), m4.rotationX(Math.PI / 2))],
        ["截頭錐", () => primitives.createTruncatedConeVertices(0.75, 0.35, 1.3, 6, 1)],
      ];
      const palette = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6", "--c2", "--c3"].map(cssColor);
      const build = (flat) => SHAPES.map(([, make]) => {
        const verts = make();
        const arrays = flat ? primitives.flattenNormals(primitives.deindexVertices(verts)) : verts;
        return twgl.createVertexArrayInfo(gl, programInfo, twgl.createBufferInfoFromArrays(gl, arrays));
      });
      const variants = { smooth: build(false), flat: build(true) };
      const tagsEl = ctx.$(".tags");
      const objects = SHAPES.map(([name], i) => {
        const tag = document.createElement("span");
        tag.textContent = name;
        tagsEl.append(tag);
        return {
          name, tag, scale: 1, facing: name === "圓盤",
          programInfo, vertexArrayInfo: variants.smooth[i],
          uniforms: { u_world: m4.identity(), u_worldInverseTranspose: m4.identity(), u_color: palette[i], u_texture: checker },
        };
      });

      let mode = 0;
      ctx.group(["打光貼圖", "法線", "UV"], 0, (i) => { mode = i; });
      ctx.toggle("平面著色", false, (on) => objects.forEach((o, i) => { o.vertexArrayInfo = (on ? variants.flat : variants.smooth)[i]; }));
      ctx.fps({ position: "right bottom", extra: () => ({ 幾何體: SHAPES.length, "draw call": SHAPES.length }) });

      const pointer = trackPointer(ctx, v.canvas);
      gl.enable(gl.DEPTH_TEST);
      ctx.raf((t) => {
        const time = t * 0.001;
        const aspect = v.fit();
        gl.clearColor(0.055, 0.063, 0.075, 1);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        const cols = aspect >= 1 ? 4 : 2, rows = SHAPES.length / cols, gap = 2.3;
        const fov = (40 * Math.PI) / 180, tan = Math.tan(fov / 2);
        const dist = Math.max((rows * gap + 1.4) / 2 / tan, (cols * gap) / 2 / (tan * aspect)) * 1.1 + 1;
        const px = pointer.idle() ? Math.sin(time * 0.4) * 0.6 : pointer.nx;
        const py = pointer.idle() ? Math.cos(time * 0.3) * 0.4 : pointer.ny;
        const eye = [px * 2.2, py * 1.6, dist];
        const projection = m4.perspective(fov, aspect, 0.1, 100);
        const viewProjection = m4.multiply(projection, m4.inverse(m4.lookAt(eye, [0, 0.15, 0], [0, 1, 0])));
        const W = v.canvas.clientWidth, H = v.canvas.clientHeight;
        let hovered = -1, best = 70 * 70;
        objects.forEach((o, i) => {
          const c = i % cols, r = Math.floor(i / cols);
          o.pos = [(c - (cols - 1) / 2) * gap, ((rows - 1) / 2 - r) * gap, 0];
          const s = m4.transformPoint(viewProjection, o.pos);
          o.sx = (s[0] * 0.5 + 0.5) * W; o.sy = (0.5 - s[1] * 0.5) * H;
          const d = (o.sx - pointer.x) ** 2 + (o.sy - pointer.y) ** 2;
          if (!pointer.idle(1500) && d < best) { best = d; hovered = i; }
        });
        objects.forEach((o, i) => {
          o.scale += ((i === hovered ? 1.18 : 1) - o.scale) * 0.15;
          let w = m4.translation(o.pos);
          if (o.facing) {
            // The disc stands in the XY plane and spins about its own axis so it never turns edge-on
            w = m4.rotateY(w, Math.sin(time * 0.6 + i) * 0.6);
            w = m4.rotateX(w, Math.sin(time * 0.5 + i) * 0.4 - 0.2);
            w = m4.rotateZ(w, time * 0.6);
          } else {
            w = m4.rotateY(w, time * 0.6 + i * 0.8);
            w = m4.rotateX(w, Math.sin(time * 0.5 + i) * 0.6 + 0.35);
          }
          w = m4.scale(w, [o.scale, o.scale, o.scale]);
          o.uniforms.u_world = w;
          o.uniforms.u_worldInverseTranspose = m4.transpose(m4.inverse(w));
          o.uniforms.u_viewProjection = viewProjection;
          o.uniforms.u_eye = eye;
          o.uniforms.u_mode = mode;
          const below = m4.transformPoint(viewProjection, [o.pos[0], o.pos[1] - 1.05, 0]);
          o.tag.style.transform = `translate(${(below[0] * 0.5 + 0.5) * W}px, ${(0.5 - below[1] * 0.5) * H}px) translate(-50%, 0)`;
          o.tag.classList.toggle("on", i === hovered);
        });
        twgl.drawObjectList(gl, objects);
      });
    },
  },
  {
    id: "panorama", title: "全景反射",
    api: "createTextures({ env: { src: 'panorama.jpg', min: LINEAR_MIPMAP_LINEAR } }, callback)",
    desc: "一張 4096×2048 等距長方投影全景圖用 createTextures 非同步載入並自動產生 mipmap，同時當天空背景與環境貼圖。鏡面直接取反射方向，玻璃把 RGB 三色分開折射做出色散，霧面則用 textureLod 讀較小的 mipmap 層。",
    hint: "拖曳畫面環視・切換材質與形狀",
    mount(ctx) {
      const v = glStage(ctx);
      if (!v) return;
      const { gl } = v;
      const status = ctx.status("載入 4096×2048 全景圖…");
      const textures = twgl.createTextures(gl, {
        env: { src: "_shared/img/panorama.jpg", min: gl.LINEAR_MIPMAP_LINEAR, mag: gl.LINEAR, wrapS: gl.REPEAT, wrapT: gl.CLAMP_TO_EDGE },
      }, (err) => {
        if (!ctx.active) return;
        if (err) status.error("全景圖載入失敗");
        else status.done();
      });

      const skyProg = twgl.createProgramInfo(gl, [`#version 300 es
        in vec2 position;
        out vec2 v_ndc;
        void main() { v_ndc = position; gl_Position = vec4(position, 0.0, 1.0); }`, `#version 300 es
        precision highp float;
        in vec2 v_ndc;
        uniform mat4 u_invViewProjection;
        uniform sampler2D u_env;
        out vec4 outColor;
        ${EQUIRECT}
        void main() {
          vec4 p = u_invViewProjection * vec4(v_ndc, 1.0, 1.0);
          vec3 d = normalize(p.xyz / p.w);
          outColor = vec4(textureLod(u_env, equirect(d), 0.0).rgb * 0.9, 1.0);
        }`]);
      const objProg = twgl.createProgramInfo(gl, [`#version 300 es
        in vec4 position;
        in vec3 normal;
        uniform mat4 u_world, u_worldInverseTranspose, u_viewProjection;
        out vec3 v_world;
        out vec3 v_normal;
        void main() {
          vec4 w = u_world * position;
          v_world = w.xyz;
          v_normal = mat3(u_worldInverseTranspose) * normal;
          gl_Position = u_viewProjection * w;
        }`, `#version 300 es
        precision highp float;
        in vec3 v_world;
        in vec3 v_normal;
        uniform sampler2D u_env;
        uniform vec3 u_eye;
        uniform int u_material;
        out vec4 outColor;
        ${EQUIRECT}
        vec3 env(vec3 d, float lod) { return textureLod(u_env, equirect(normalize(d)), lod).rgb; }

            bufferInfo,
            updateVAO: twgl.createVertexArrayInfo(gl, updateProg, bufferInfo),
            drawVAO: twgl.createVertexArrayInfo(gl, drawProg, bufferInfo),
            // Map the varying "newState" onto this set's buffer
            tf: twgl.createTransformFeedback(gl, updateProg, { newState: bufferInfo.attribs.state }),
          };
        });
        // A buffer bound to a transform feedback slot must not stay bound elsewhere during the draw
        gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, null);
        gl.bindBuffer(gl.ARRAY_BUFFER, null);
        capacity = n;
        reset = true;
      };
      allocate(50000);
      count = 50000;

      const pointer = trackPointer(ctx, v.canvas);
      ctx.raf((t, dt) => {
        const aspect = v.fit();
        gl.clearColor(0.025, 0.03, 0.045, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        if (!count) return;
        const time = t * 0.001;
        const src = sets[cur], dst = sets[1 - cur];
        const mouse = pointer.idle(1500)
          ? [Math.cos(time * 0.5) * 0.5 * aspect, Math.sin(time * 0.7) * 0.45, 0.6]
          : [pointer.nx * aspect, pointer.ny, 1];

        // Simulation pass: read src, write dst, rasterizer off
        gl.useProgram(updateProg.program);
        twgl.setBuffersAndAttributes(gl, updateProg, src.updateVAO);
        twgl.setUniforms(updateProg, { u_time: time, u_dt: Math.min(dt, 50) * 0.001, u_reset: reset ? 1 : 0, u_aspect: aspect, u_mouse: mouse });
        gl.enable(gl.RASTERIZER_DISCARD);
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, dst.tf);
        gl.beginTransformFeedback(gl.POINTS);
        gl.drawArrays(gl.POINTS, 0, count);
        gl.endTransformFeedback();
        gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
        gl.disable(gl.RASTERIZER_DISCARD);
        reset = false;

        // Render pass: draw the freshly written buffer as additive points
        gl.useProgram(drawProg.program);
        twgl.setBuffersAndAttributes(gl, drawProg, dst.drawVAO);
        twgl.setUniforms(drawProg, { u_aspect: aspect, u_size: v.dpr, u_gain: Math.min(0.7, 60000 / count) });
        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        twgl.drawBufferInfo(gl, dst.drawVAO, gl.POINTS, count);
        gl.disable(gl.BLEND);
        gl.bindVertexArray(null);
        cur = 1 - cur;
      });

      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "粒子", steps: [50000, 100000, 250000, 500000, 1000000, 2000000, 4000000],
        minFps: 30,
        apply: (n) => { if (n > capacity) allocate(n); count = n; },
        metrics: () => ({ GPU緩衝: `${((capacity * 32) / 1048576).toFixed(1)} MB`, "draw call": 2 }),
        note: "每幀兩次繪製：一次 transform feedback 更新全部粒子，一次把結果畫成點，CPU 只送幾個 uniform。無頭瀏覽器用軟體算繪，數字會遠低於實機。",
      });
    },
  },
] });
</script>
</body>
</html>
