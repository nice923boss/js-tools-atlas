<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two.js 示範：一套程式切換 SVG、Canvas、WebGL 的扁平動態海報</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  #stage { position: fixed; inset: 0; }
  #stage > * { display: block; }
  .info {
    position: fixed; right: 12px; bottom: 12px; z-index: 50;
    padding: 8px 12px; font-size: 12px; line-height: 1.5; text-align: right;
  }
  .info b { color: var(--accent); font-family: var(--mono); font-size: 14px; }
  @media (max-width: 560px) { .info { bottom: 52px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="controls">
  <button class="btn" data-type="svg" aria-pressed="true">SVG</button>
  <button class="btn" data-type="canvas">Canvas</button>
  <button class="btn" data-type="webgl">WebGL</button>
</div>
<div class="panel info">目前渲染器 <b id="rtype">SVG</b><div class="muted">同一份場景程式・<span id="count">0</span> 個圖形</div></div>
<div class="hint">移動滑鼠控制波紋中心・點擊換配色</div>

<script src="https://cdn.jsdelivr.net/npm/two.js@0.8.24/build/two.min.js"></script>
<script>
// Bauhaus-style kinetic poster. The scene-building code is identical for all three renderers;
// switching only changes the `type` passed to new Two().
const THEMES = [
  ["#f7df1e", "#4cc9f0", "#f72585", "#7bd389", "#ff8c42", "#9d8cff", "#ecebe6", "#1a1d24"],
  ["#e63946", "#f1c453", "#2a9d8f", "#264653", "#f4a261", "#ecebe6", "#1d3557", "#a8dadc"],
  ["#ff5d8f", "#ffd166", "#06d6a0", "#118ab2", "#073b4c", "#f8f4e3", "#ef476f", "#8338ec"],
];
const stage = document.getElementById("stage");
let two = null;
let type = "svg";
let theme = 0;
let tiles = [];
const origin = { x: 0, y: 0, tx: 0, ty: 0, idle: true };
const start = performance.now();

function pick(arr, i) { return arr[((i % arr.length) + arr.length) % arr.length]; }

function makeShape(kind, s) {
  switch (kind) {
    case 0: return two.makeCircle(0, 0, s * 0.36);
    case 1: return two.makeArcSegment(0, 0, 0, s * 0.42, 0, Math.PI);
    case 2: return two.makeArcSegment(-s * 0.35, -s * 0.35, 0, s * 0.7, 0, Math.PI / 2);
    case 3: return two.makePolygon(0, s * 0.06, s * 0.42, 3);
    case 4: return two.makeRoundedRectangle(0, 0, s * 0.56, s * 0.56, s * 0.12);
    case 5: return two.makeStar(0, 0, s * 0.17, s * 0.42, 5);
    default: return two.makeArcSegment(0, 0, s * 0.2, s * 0.4, 0, Math.PI * 2);
  }
}

function layout() {
  two.clear();
  tiles = [];
  const w = two.width, h = two.height;
  const cell = Math.max(64, Math.min(120, Math.min(w, h) / 4.6));
  const cols = Math.ceil(w / cell), rows = Math.ceil(h / cell);
  const ox = (w - cols * cell) / 2 + cell / 2, oy = (h - rows * cell) / 2 + cell / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = ox + c * cell, y = oy + r * cell;
      const bg = two.makeRectangle(x, y, cell + 0.5, cell + 0.5);
      bg.noStroke();
      const kind = (r * 7 + c * 3 + ((r * c) % 5)) % 7;
      const shape = makeShape(kind, cell);
      shape.noStroke();
      const g = two.makeGroup(shape);
      g.translation.set(x, y);
      tiles.push({ x, y, bg, shape, g, seed: r * 31 + c * 17 });
    }
  }
  recolor();
  document.getElementById("count").textContent = tiles.length * 2;
}

function recolor() {
  const pal = THEMES[theme];
  for (const t of tiles) {
    const a = pick(pal, t.seed);
    let b = pick(pal, t.seed * 3 + 1);
    if (b === a) b = pick(pal, t.seed + 2);
    t.bg.fill = a;
    t.shape.fill = b;
  }
}

function smoothstep(x) { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); }

function tick() {
  const time = (performance.now() - start) / 1000;
  if (origin.idle) {
    origin.tx = two.width * (0.5 + 0.35 * Math.cos(time * 0.4));
    origin.ty = two.height * (0.5 + 0.35 * Math.sin(time * 0.53));
  }
  origin.x += (origin.tx - origin.x) * 0.08;
  origin.y += (origin.ty - origin.y) * 0.08;
  for (const t of tiles) {
    const d = Math.hypot(t.x - origin.x, t.y - origin.y);
    const p = time * 0.8 - d / 260 + (t.seed % 4) * 0.25;
    // Snap rotation in quarter turns so tiles rest aligned, then tick to the next pose
    const k = Math.floor(p);
    const turn = k + smoothstep((p - k - 0.55) / 0.45);
    t.g.rotation = turn * Math.PI / 2;
    t.g.scale = 0.78 + 0.22 * Math.cos((p - k) * Math.PI * 2);
  }
}

function build() {
  if (two) {
    two.pause();
    two.unbind("update", tick);
    two.renderer.domElement.remove();
    const i = Two.Instances.indexOf(two);
    if (i >= 0) Two.Instances.splice(i, 1);
  }
  two = new Two({ type: Two.Types[type], width: innerWidth, height: innerHeight, autostart: true }).appendTo(stage);
  layout();
  two.bind("update", tick);
  document.getElementById("rtype").textContent = { svg: "SVG", canvas: "Canvas", webgl: "WebGL" }[type];
}

build();

stage.addEventListener("pointermove", (e) => { origin.tx = e.clientX; origin.ty = e.clientY; origin.idle = false; });
stage.addEventListener("pointerleave", () => { origin.idle = true; });
stage.addEventListener("click", () => { theme = (theme + 1) % THEMES.length; recolor(); });
addEventListener("resize", () => { two.width = innerWidth; two.height = innerHeight; layout(); });
document.querySelectorAll("[data-type]").forEach((b) => {
  b.addEventListener("click", () => {
    type = b.dataset.type;
    document.querySelectorAll("[data-type]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    build();
  });
});
</script>
</body>
</html>
