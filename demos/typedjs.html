<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typed.js 示範：打字機標語與終端機</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 0%, #2a2410, var(--bg) 70%); }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(18px, 5vh, 40px); padding: 60px 16px 50px; }
  .hero { text-align: center; }
  .hero .kicker { font: 600 12px/1 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .hero h1 { margin: 12px 0 0; font-size: clamp(28px, 7vw, 64px); line-height: 1.2; font-weight: 900; }
  .hero h1 .typed { color: var(--accent); }
  .hero .typed-cursor { color: var(--accent); font-weight: 400; }
  .term { width: min(100%, 640px); border-radius: 12px; overflow: hidden; background: #0a0b0d; border: 1px solid var(--line); box-shadow: 0 24px 60px rgba(0,0,0,.5); }
  .term .top { display: flex; align-items: center; gap: 6px; padding: 9px 12px; background: #1b1d22; }
  .term .top i { width: 11px; height: 11px; border-radius: 50%; }
  .term .top span { margin-left: 8px; font: 12px var(--mono); color: var(--muted); }
  .term pre { margin: 0; padding: 14px 16px; height: clamp(110px, 24vh, 170px); overflow: hidden; font: 13px/1.65 var(--mono); color: #d6f5d6; white-space: pre-wrap; word-break: break-all; }
  .term .p { color: var(--c2); }
  .term .o { color: var(--muted); }
  .term .ok { color: var(--c4); }
  .term .typed-cursor { color: #d6f5d6; }
  .panel.ctl { position: fixed; right: 12px; top: 12px; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
  .ctl label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ctl input { width: 90px; }
  .ctl .btn { padding: 6px 10px; font-size: 12px; }
  .state { font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 560px) {
    .panel.ctl { left: 12px; flex-wrap: wrap; justify-content: center; }
    .wrap { padding-top: 100px; }
  }
</style>
</head>
<body>
<div class="panel ctl">
  <button class="btn" id="pause">暫停</button>
  <button class="btn" id="restart">重新開始</button>
  <label for="speed">速度</label>
  <input type="range" id="speed" min="1" max="10" value="6">
</div>

<div class="wrap">
  <div class="hero">
    <div class="kicker">TYPED.JS · 打字機效果</div>
    <h1>用 JavaScript 做出<br><span class="typed" id="slogan"></span></h1>
  </div>
  <div class="term">
    <div class="top"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span>~/js-tools-atlas</span></div>
    <pre><span id="term"></span></pre>
  </div>
  <div class="state" id="status">準備開始</div>
</div>
<div class="hint">標語會打字、退格、換句；終端機示範停頓與整段輸出</div>

<script src="https://cdn.jsdelivr.net/npm/typed.js@3.0.0/dist/typed.umd.js"></script>
<script>
// ^N pauses N ms; text inside backticks is printed at once like command output
const SLOGANS = ["會呼吸的網頁", "會說故事的簡報", "看得懂的圖表", "不卡頓的動畫", "會呼吸的介面"];
const TERM = [
  '<span class="p">$</span> npm install typed.js^500\n`<span class="o">added 1 package in 0.8s</span>`\n' +
  '<span class="p">$</span> node 打招呼.js^400\n`<span class="ok">你好，這段文字是一個字一個字打出來的。</span>`',
  '<span class="p">$</span> git commit -m "加上打字機標語"^500\n`<span class="o">[main 3f2a9c1] 加上打字機標語</span>`\n' +
  '<span class="p">$</span> npm run deploy^700\n`<span class="ok">部署完成，網站已更新。</span>`',
];

// Speed slider 1..10 maps to ms per character (higher = faster)
const msFor = (v) => Math.round(150 / v);
let slogan, term, paused = false;
const stateEl = document.getElementById("status");
function start() {
  if (slogan) slogan.destroy();
  if (term) term.destroy();
  const ms = msFor(+speed.value);
  slogan = new Typed("#slogan", {
    strings: SLOGANS, typeSpeed: ms * 1.4, backSpeed: ms * 0.7, backDelay: 1400, loop: true, smartBackspace: true,
    onStringTyped: (i) => { stateEl.textContent = "標語：第 " + (i + 1) + " / " + SLOGANS.length + " 句"; },
  });
  term = new Typed("#term", {
    strings: TERM, typeSpeed: ms, backSpeed: 4, backDelay: 2200, startDelay: 600, loop: true, contentType: "html", cursorChar: "▋",
  });
  paused = false;
  pauseBtn.textContent = "暫停";
}
const speed = document.getElementById("speed");
const pauseBtn = document.getElementById("pause");
speed.addEventListener("input", () => {
  // Typed reads these instance fields on every keystroke, so speed changes apply immediately
  const ms = msFor(+speed.value);
  slogan.typeSpeed = ms * 1.4; slogan.backSpeed = ms * 0.7;
  term.typeSpeed = ms;
});
pauseBtn.addEventListener("click", () => {
  slogan.toggle(); term.toggle();
  paused = !paused;
  pauseBtn.textContent = paused ? "繼續" : "暫停";
  pauseBtn.setAttribute("aria-pressed", paused);
});
document.getElementById("restart").addEventListener("click", start);
start();
</script>
</body>
</html>
