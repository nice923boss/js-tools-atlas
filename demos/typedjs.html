<style>

  /* 4. html vs text */
  .duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-content: center; }
  .duo .panel { padding: 12px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
  .duo .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .duo .out { font-size: clamp(15px, 2.3vw, 21px); line-height: 1.6; min-height: 3.4em; word-break: break-all; }

  /* 5. chat */

  .phone .av { width: 28px; height: 28px; border-radius: 50%; background: var(--c6); color: #15121f; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
  .phone .who b { display: block; font-size: 13.5px; }
  .phone .who small { font-size: 11.5px; color: var(--c4); }
  .thread { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; padding: 12px; overflow: hidden; }
  .msg { max-width: 84%; padding: 8px 12px; border-radius: 14px; font-size: 14px; line-height: 1.55; flex: none; }
  .msg.bot { align-self: flex-start; background: #262931; border-bottom-left-radius: 4px; }
  .msg.me { align-self: flex-end; background: var(--c2); color: #06222c; border-bottom-right-radius: 4px; }
  .msg b { color: var(--c1); }
  .msg code { font: 600 13px var(--mono); color: var(--c1); }
  .msg.done .typed-cursor { display: none; }
  .typing { height: 26px; padding: 2px 14px 8px; font-size: 12px; color: var(--muted); opacity: 0; transition: opacity .2s; }
  .typing.on { opacity: 1; }
  .typing i { display: inline-block; width: 5px; height: 5px; margin-right: 3px; border-radius: 50%; background: var(--muted); animation: dot 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; margin-right: 8px; }
  @keyframes dot { 50% { transform: translateY(-3px); opacity: .4; } }

  /* 6. input placeholder */
  .search { display: grid; place-items: center; }
  .sbox { width: min(100%, 560px); padding: 16px 18px; display: grid; gap: 12px; }
  .sbox h2 { margin: 0; font-size: 17px; }
  .sbox .field { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 46px; border-radius: 12px; background: #0a0b0d; border: 1px solid var(--line); }
  .sbox .field:focus-within { border-color: var(--accent); }
  .sbox .field svg { flex: none; }

  .sbox input::placeholder { color: #a9a698; }

  .order { display: flex; flex-wrap: wrap; gap: 6px; }
  .order span { font-size: 12px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .order span.now { border-color: var(--accent); color: var(--accent); }
  .ev { font-size: 12px; color: var(--muted); }
  .ev b { font: 600 12px var(--mono); color: var(--c4); }

  /* 7. events + methods */
  .ctrlpane { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 10px; }
  .ctrlpane > .panel { padding: 12px 14px; min-height: 0; min-width: 0; overflow: hidden; }
  .show { display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .show .big { font-size: clamp(18px, 3.2vw, 30px); font-weight: 800; line-height: 1.35; min-height: 2.7em; }
  .show .big .typed-cursor { color: var(--accent); font-weight: 400; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .btns .btn { font: 600 12.5px var(--mono); padding: 6px 10px; }
  .btns .btn.primary { font-family: var(--font); }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; }
  .kv div { font: 11.5px var(--mono); color: var(--muted); padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.04); }
  .kv b { display: block; font: 600 14px var(--mono); color: var(--fg); }
  .kv b.on { color: var(--c4); }
  .logp { display: flex; flex-direction: column; gap: 6px; }
  .logp .lh { font-size: 12.5px; color: var(--muted); }
  .log { display: flex; flex-direction: column; gap: 2px; font: 12px/1.5 var(--mono); overflow: hidden; }
  .log div { display: flex; gap: 8px; white-space: nowrap; }
  .log time { color: var(--muted); }
  .log .n { color: var(--c2); }
  .log .n.ctl { color: var(--c5); }
  .log .n.end { color: var(--c4); }
  @media (max-width: 620px) {
    .ctrlpane { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .show .big { min-height: 2.7em; }
  }

  /* 8. stress */
  .swarm { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px); overflow: hidden; display: grid; gap: 1px 10px; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(var(--cw, 110px), 1fr)); font: 500 var(--fs, 14px)/1.5 var(--font); }
  @media (min-width: 761px) { .swarm { inset: 8px 8px 8px 350px; } }
  .swarm .c { white-space: nowrap; overflow: hidden; color: hsl(var(--h) 75% 72%); }
  .swarm .typed-cursor { color: var(--muted); }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/typed.js@3.0.0/dist/typed.umd.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Typed.js showcase: eight scenes from the original slogan + terminal to an instance-count stress ramp.
const nf = new Intl.NumberFormat("zh-TW");

// Destroy an instance for good. destroy() clears the tracked timeout, but the fadeOut timer
// is not tracked by the library, so the instance is also parked in the paused state.
function kill(t) {
  if (t.__dead) return;
  t.__dead = true;
  t.destroy();
  t.pause.status = true;
}
// Create a Typed instance that is torn down with the scene.
function typed(ctx, el, opts) {
  const t = new Typed(el, opts);
  ctx.onCleanup(() => kill(t));
  return t;
}
// Report every visible text change of an element as (delta, length): + typed, - erased.
function watchSteps(ctx, el, cb) {
  let prev = el.textContent.length;
  const mo = new MutationObserver(() => {
    const len = el.textContent.length;
    if (len !== prev) cb(len - prev, len);
    prev = len;
  });
  mo.observe(el, { childList: true, characterData: true, subtree: true });
  ctx.onCleanup(() => mo.disconnect());
}

const SLOGANS = ["會呼吸的網頁", "會呼吸的介面", "會說故事的簡報", "看得懂的圖表", "看得懂的數據", "不卡頓的動畫"];
// ^N pauses N ms; text inside backticks is printed at once like command output
const TERM = [
  '<span class="p">$</span> npm install typed.js^500\n`<span class="o">added 1 package in 0.8s</span>`\n' +
  '<span class="p">$</span> node 打招呼.js^400\n`<span class="ok">你好，這段文字是一個字一個字打出來的。</span>`',
  '<span class="p">$</span> git commit -m "加上打字機標語"^500\n`<span class="o">[main 3f2a9c1] 加上打字機標語</span>`\n' +
  '<span class="p">$</span> npm run deploy^700\n`<span class="ok">部署完成，網站已更新。</span>`',
];
const msFor = (v) => Math.round(150 / v);

const MRT = ["台北捷運 板南線 往南港展覽館", "台北捷運 板南線 往頂埔", "台北捷運 淡水信義線 往象山", "台北捷運 淡水信義線 往淡水", "台北捷運 文湖線 往動物園"];
const RICH = [
  '支援 <b>粗體</b>、<em class="hl">螢光筆</em> 與 <a>連結</a> 標籤',
  '實體字元一步到位：&lt;div&gt; &amp; &copy; 2026',
];
const CHAT = [
  { me: true, text: "請問週六的 JavaScript 動畫課還有名額嗎？" },
  { me: false, text: "我幫你查一下⋯^1200 還有 <b>3</b> 個名額！" },
  { me: true, text: "太好了，幫我保留一位" },
  { me: false, text: "已保留，^700報名編號是 `<code>JS-1017-08</code>`，^500請在 24 小時內完成繳費。" },
];
const COURSES = ["JavaScript 動畫入門（台北）", "GSAP 滾動敘事（線上）", "Three.js 立體網頁（台中）", "D3 資料視覺化（高雄）", "Canvas 生成藝術（新竹）"];
const SEARCH_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
const WORDS = ["載入中", "同步資料", "編譯樣式", "壓縮圖片", "部署完成", "重新整理", "讀取設定", "建立快取", "上傳檔案", "排程任務"];

Showcase.run({ scenes: [
  {
    id: "hero", title: "標語與終端機",
    api: "new Typed(el, { strings, smartBackspace, loop, contentType: 'html', cursorChar })",
    desc: "原本的招牌：標語只退掉和下一句不同的字再換句；終端機用 ^500 停頓、反引號整段輸出指令結果。",
    hint: "速度拖曳即時生效（改實例的 typeSpeed）・暫停呼叫 toggle()・重新開始呼叫 reset()",
    mount(ctx) {
      ctx.html(`<div class="fill hero-wrap">
        <div class="hero"><div class="kicker">TYPED.JS · 打字機效果</div><h1>用 JavaScript 做出<br><span class="slogan"></span></h1></div>
        <div class="term"><div class="top"><i></i><i></i><i></i><span>~/js-tools-atlas</span></div><pre><span class="out"></span></pre></div>
        <div class="state">準備開始</div></div>`);
      const st = ctx.$(".state");
      let ms = msFor(6);
      const slogan = typed(ctx, ctx.$(".slogan"), {
        strings: SLOGANS, typeSpeed: ms * 1.4, backSpeed: ms * 0.7, backDelay: 1400, loop: true, smartBackspace: true,
        onStringTyped: (i) => { st.innerHTML = `標語第 <b>${i + 1}</b> / <b>${SLOGANS.length}</b> 句，只退到和下一句相同的開頭`; },
      });
      const term = typed(ctx, ctx.$(".out"), {
        strings: TERM, typeSpeed: ms, backSpeed: 4, backDelay: 2200, startDelay: 600, loop: true, contentType: "html", cursorChar: "▋",
      });
      ctx.toggle("暫停", false, () => { slogan.toggle(); term.toggle(); });
      ctx.button("重新開始", () => { slogan.reset(); term.reset(); });
      ctx.slider("速度", { min: 1, max: 10, step: 1, value: 6, format: (v) => `${msFor(v)} ms` }, (v) => {
        // Typed reads these instance fields before every keystroke, so changes apply immediately
        ms = msFor(v);
        slogan.typeSpeed = ms * 1.4; slogan.backSpeed = ms * 0.7; term.typeSpeed = ms;
      });
    },
  },
  {
    id: "backspace", title: "退格策略",
    api: "{ smartBackspace: true | false } / { fadeOut: true, fadeOutDelay }",
    desc: "同一組字串三種換句方式：smartBackspace 只退掉和下一句不同的部分，關掉就整句退光，fadeOut 改成淡出後清空。",
    hint: "右側數字是畫面實際改寫的次數（MutationObserver 量測）・backSpeed 可即時調整",
    mount(ctx) {
      const lanes = [
        { name: "smartBackspace: true", note: "預設值", opt: { smartBackspace: true } },
        { name: "smartBackspace: false", note: "", opt: { smartBackspace: false } },
        { name: "fadeOut: true", note: "淡出取代退格", opt: { fadeOut: true, fadeOutDelay: 500 } },
      ];
      ctx.html(`<div class="fill lanes">${lanes.map((l) => `<div class="panel lane">
        <div class="hd"><span class="tag"><b>${l.name}</b></span>${l.note ? `<span>${l.note}</span>` : ""}
          <span style="margin-left:auto">打字 <b data-k="t">0</b> 步・退格或清除 <b data-k="b">0</b> 步</span></div>
        <div class="line"><span class="tx"></span></div></div>`).join("")}</div>`);
      let insts = [], backSpeed = 30;
      // Rebuild instead of reset(): the fadeOut timer is not cancelled by reset() and would run
      // alongside the restarted chain, so each run gets a fresh instance on a fresh element.
      const build = () => {
        insts.forEach(kill);
        insts = ctx.$$(".lane").map((node, i) => {
          const cnt = { t: 0, b: 0 };
          const tEl = node.querySelector('[data-k="t"]'), bEl = node.querySelector('[data-k="b"]');
          tEl.textContent = bEl.textContent = "0";
          const line = node.querySelector(".line");
          line.innerHTML = "<span></span>";
          const tx = line.firstChild;
          watchSteps(ctx, tx, (d) => {
            if (d > 0) cnt.t++; else cnt.b++;
            tEl.textContent = nf.format(cnt.t); bEl.textContent = nf.format(cnt.b);
          });
          return new Typed(tx, { strings: MRT, typeSpeed: 60, backSpeed, backDelay: 900, loop: true, ...lanes[i].opt });
        });
      };
      ctx.onCleanup(() => insts.forEach(kill));
      build();
      ctx.slider("backSpeed", { min: 0, max: 120, step: 10, value: 30, format: (v) => `${v} ms` }, (v) => { backSpeed = v; insts.forEach((t) => (t.backSpeed = v)); });
      ctx.button("同時重來", build);
    },
  },
  {
    id: "speed", title: "速度與節奏",
    api: "{ typeSpeed, backSpeed, backDelay, startDelay }",
    desc: "三條線只差 typeSpeed。Typed 會在每個字的間隔加上隨機抖動，右側長條是實際量到的逐字間隔，可看出設定值只是基準。",
    hint: "backDelay 即時生效・調 startDelay 會讓三條線依序延後開始（呼叫 reset() 重跑）",
    mount(ctx) {
      const SPEEDS = [0, 40, 120];
      const LINES = ["打字速度決定每個字之間的等待時間", "數字越小越快，右邊是實際量到的間隔"];
      ctx.html(`<div class="fill lanes">${SPEEDS.map((s) => `<div class="panel lane">
        <div class="hd"><span class="tag">typeSpeed: <b>${s}</b></span><span class="sd tag">startDelay: <b>0</b></span>
          <span>實測平均 <b data-k="avg">…</b> ms・範圍 <b data-k="rng">…</b></span><span class="spark"></span></div>
        <div class="line"><span class="tx"></span></div></div>`).join("")}</div>`);
      const insts = ctx.$$(".lane").map((node, i) => {
        const tx = node.querySelector(".tx"), spark = node.querySelector(".spark");
        const avgEl = node.querySelector('[data-k="avg"]'), rngEl = node.querySelector('[data-k="rng"]');
        const gaps = [];
        let last = null;
        watchSteps(ctx, tx, (d) => {
          const now = performance.now();
          if (d < 0) { last = null; return; }
          if (last != null) {
            gaps.push(now - last);
            if (gaps.length > 40) gaps.shift();
            const avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
            avgEl.textContent = avg.toFixed(1);
            rngEl.textContent = `${Math.min(...gaps).toFixed(0)}～${Math.max(...gaps).toFixed(0)}`;
            const hi = Math.max(...gaps, 1);
            spark.innerHTML = gaps.map((g) => `<i style="height:${Math.max(2, (g / hi) * 20).toFixed(1)}px"></i>`).join("");
          }
          last = now;
        });
        return typed(ctx, tx, { strings: LINES, typeSpeed: SPEEDS[i], backSpeed: 15, backDelay: 1200, loop: true });
      });
      ctx.slider("backDelay", { min: 200, max: 3000, step: 100, value: 1200, format: (v) => `${v} ms` }, (v) => insts.forEach((t) => (t.backDelay = v)));
      ctx.slider("startDelay 錯開", { min: 0, max: 1500, step: 250, value: 0, format: (v) => `${v} ms` }, (v) => {
        insts.forEach((t, i) => { t.startDelay = v * i; t.reset(); });
        ctx.$$(".sd b").forEach((b, i) => (b.textContent = v * i));
      });
    },
  },
  {
    id: "html", title: "HTML 與純文字",
    api: "{ contentType: 'html' } vs { contentType: null }",
    desc: "預設 html 模式遇到標籤與實體字元會一步跳過並直接套用樣式；設成 null 則寫入 textContent，原始字串一個字一個字照打。",
    hint: "比較同一句需要的步數：html 模式只算看得到的字",
    mount(ctx) {
      const modes = [
        { ct: "html", label: "contentType: <b>'html'</b>", note: "標籤一步跳過" },
        { ct: null, label: "contentType: <b>null</b>", note: "原始字串照打" },
      ];
      ctx.html(`<div class="fill duo">${modes.map((m, i) => `<div class="panel">
        <div class="hd"><span class="tag">${m.label}</span><span>${m.note}</span></div>
        <div class="out${i ? " raw" : ""}"><span class="tx"></span></div>
        <div class="st">這一句 <b data-k="n">0</b> 步・字串長度 <b data-k="len">0</b></div></div>`).join("")}</div>`);
      ctx.$$(".duo .panel").forEach((node, i) => {
        const tx = node.querySelector(".tx"), nEl = node.querySelector('[data-k="n"]'), lenEl = node.querySelector('[data-k="len"]');
        let steps = 0, typing = false;
        watchSteps(ctx, tx, (d) => { if (d > 0 && typing) nEl.textContent = ++steps; });
        typed(ctx, tx, {
          strings: RICH, contentType: modes[i].ct, typeSpeed: 45, backSpeed: 10, backDelay: 1800, loop: true,
          preStringTyped: (p, self) => { steps = 1; typing = true; nEl.textContent = steps; lenEl.textContent = self.strings[self.sequence[p]].length; },
          onStringTyped: () => { typing = false; },
        });
      });
    },
  },
  {
    id: "chat", title: "對話與停頓",
    api: "'⋯^1200 還有' + '`<code>…</code>`' + onTypingPaused / onComplete",
    desc: "每則訊息是一個新實例，onComplete 接續下一則。^1200 讓字串中途停頓並觸發 onTypingPaused，用來顯示「正在輸入」；反引號包住的報名編號一次出現。",
    hint: "對話跑完會清空重來",
    mount(ctx) {
      ctx.html(`<div class="fill chat"><div class="panel phone">
        <div class="phead"><span class="av">課</span><span class="who"><b>課程小幫手</b><small class="pres">線上</small></span></div>
        <div class="thread"></div><div class="typing"><i></i><i></i><i></i>課程小幫手正在輸入</div></div></div>`);
      const thread = ctx.$(".thread"), typing = ctx.$(".typing"), pres = ctx.$(".pres");
      let live = [];
      const busy = (on) => { typing.classList.toggle("on", on); pres.textContent = on ? "正在輸入…" : "線上"; };
      const run = (i) => {
        if (i >= CHAT.length) {
          ctx.timeout(() => { live.forEach(kill); live = []; thread.innerHTML = ""; run(0); }, 3200);
          return;
        }
        const m = CHAT[i];
        const bubble = document.createElement("div");
        bubble.className = `msg ${m.me ? "me" : "bot"}`;
        bubble.append(document.createElement("span"));
        thread.append(bubble);
        if (!m.me) busy(true);
        live.push(new Typed(bubble.firstChild, {
          strings: [m.text], typeSpeed: m.me ? 26 : 40, startDelay: m.me ? 200 : 900, cursorChar: "▍",
          preStringTyped: () => busy(false),
          onTypingPaused: () => { if (!m.me) busy(true); },
          onTypingResumed: () => busy(false),
          onComplete: () => { bubble.classList.add("done"); ctx.timeout(() => run(i + 1), m.me ? 600 : 1300); },
        }));
      };
      ctx.onCleanup(() => live.forEach(kill));
      run(0);
    },
  },
  {
    id: "input", title: "輸入框提示",
    api: "{ attr: 'placeholder', bindInputFocusEvents: true, stringsElement, shuffle: true }",
    desc: "把字打進輸入框的 placeholder；字串取自頁面上的清單（stringsElement，搜尋引擎看得到），shuffle 打亂順序。聚焦時自動 stop()，離開且欄位空白時 start()。",
    hint: "點輸入框看它停下・輸入框不會顯示游標（Typed 對 input 自動關閉）",
    mount(ctx) {
      ctx.html(`<div class="fill search"><div class="panel sbox">
        <h2>找課程</h2>
        <label class="field">${SEARCH_ICON}<input type="search" aria-label="搜尋課程"></label>
        <ul class="src">${COURSES.map((c) => `<li>試試「${c}」</li>`).join("")}</ul>
        <div class="sub">字串來源：頁面上的 <code>&lt;ul&gt;</code>（Typed 會把它視覺隱藏），shuffle 後的播放順序：</div>
        <div class="order"></div>
        <div class="ev">最近事件：<b class="evn">尚未觸發</b><span class="evd"></span></div></div></div>`);
      const input = ctx.$("input"), order = ctx.$(".order"), evn = ctx.$(".evn"), evd = ctx.$(".evd");
      const ev = (name, note) => { evn.textContent = name; evd.textContent = `，${note}`; };
      const paint = (self, pos) => {
        // self.strings holds the <li> innerHTML; sequence is the (shuffled) play order
        order.innerHTML = self.sequence.map((k, j) => `<span class="${j === pos ? "now" : ""}">${j + 1}. ${COURSES[k]}</span>`).join("");
      };
      const t = typed(ctx, input, {
        stringsElement: ctx.$(".src"), attr: "placeholder", bindInputFocusEvents: true, shuffle: true, loop: true,
        typeSpeed: 55, backSpeed: 22, backDelay: 1500,
        preStringTyped: (p, self) => paint(self, p),
        onStop: () => ev("onStop", "輸入框取得焦點，打字停住"),
        onStart: () => ev("onStart", "離開且欄位空白，接著打"),
        onLastStringBackspaced: () => ev("onLastStringBackspaced", "一輪結束，重新洗牌"),
      });
      paint(t, -1);
      ctx.button("聚焦輸入框", () => input.focus());
      ctx.button("清空並離開", () => { input.value = ""; input.blur(); });
    },
  },
  {
    id: "events", title: "事件與控制",
    api: "stop() / start() / toggle() / reset() / destroy() + 11 個回呼",
    desc: "一個 loop: true、loopCount: 2 的實例：左邊按鈕直接呼叫實例方法，右邊即時列出觸發的回呼與參數（arrayPos）。跑完兩輪會停在最後一句。",
    hint: "destroy() 之後實例無法再用，要按「重新建立」",
    mount(ctx) {
      const METHODS = ["stop", "start", "toggle", "reset", "destroy"];
      ctx.html(`<div class="fill ctrlpane">
        <div class="panel show">
          <div class="big"><span class="tx"></span></div>
          <div class="btns">${METHODS.map((m) => `<button class="btn" type="button" data-m="${m}">${m}()</button>`).join("")}<button class="btn primary" type="button" data-m="new">重新建立</button></div>
          <div class="kv"><div>arrayPos<b data-v="pos">0</b></div><div>curLoop / loopCount<b data-v="loop">0 / 2</b></div>
            <div>pause.status<b data-v="pause">false</b></div><div>typingComplete<b data-v="done">false</b></div></div>
        </div>
        <div class="panel logp"><div class="lh">事件紀錄（新的在上）</div><div class="log"></div></div></div>`);
      const tx = ctx.$(".tx"), logEl = ctx.$(".log");
      const LINES = ["呼叫 stop() 會停在目前這個字", "start() 從停下的位置^800接著打", "第二輪打完就停在這一句"];
      let t = null, dead = false, t0 = performance.now();
      const log = (name, arg, cls = "") => {
        const row = document.createElement("div");
        row.innerHTML = `<time>${((performance.now() - t0) / 1000).toFixed(1).padStart(5, " ")}s</time><span class="n ${cls}">${name}</span>${arg != null ? `<span>(${arg})</span>` : ""}`;
        logEl.prepend(row);
        while (logEl.children.length > 40) logEl.lastChild.remove();
      };
      const make = () => {
        if (t) kill(t);
        dead = false; t0 = performance.now();
        logEl.innerHTML = "";
        t = new Typed(tx, {
          strings: LINES, typeSpeed: 50, backSpeed: 20, backDelay: 1100, loop: true, loopCount: 2,
          onBegin: () => log("onBegin"),
          preStringTyped: (p) => log("preStringTyped", p),
          onStringTyped: (p) => log("onStringTyped", p),
          onTypingPaused: (p) => log("onTypingPaused", p),
          onTypingResumed: (p) => log("onTypingResumed", p),
          onLastStringBackspaced: () => log("onLastStringBackspaced"),
          onComplete: () => log("onComplete", null, "end"),
          onStop: (p) => log("onStop", p, "ctl"),
          onStart: (p) => log("onStart", p, "ctl"),
          onReset: () => log("onReset", null, "ctl"),
          onDestroy: () => log("onDestroy", null, "end"),
        });
      };
      ctx.$$(".btns .btn").forEach((b) => ctx.on(b, "click", () => {
        const m = b.dataset.m;
        if (m === "new") make();
        else if (!dead) { t[m](); if (m === "destroy") dead = true; }
        ctx.$$(".btns .btn").forEach((x) => (x.disabled = dead && x.dataset.m !== "new"));
      }));
      const v = (k) => ctx.$(`[data-v="${k}"]`);
      const set = (k, val, on) => { const el = v(k); el.textContent = val; el.classList.toggle("on", !!on); };
      ctx.interval(() => {
        if (!t) return;
        set("pos", dead ? "已銷毀" : t.arrayPos);
        set("loop", `${t.curLoop} / ${t.loopCount}`, t.curLoop === t.loopCount);
        set("pause", String(t.pause.status), t.pause.status);
        set("done", String(t.typingComplete), t.typingComplete);
      }, 120);
      ctx.onCleanup(() => t && kill(t));
      make();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × new Typed(span, { loop: true, typeSpeed: 30, contentType })",
    desc: "同時跑 N 個打字實例，每個都用自己的 setTimeout 鏈逐字改寫 DOM，逐級加量直到掉到 30 FPS 以下。",
    hint: "按「自動加壓」開始・換寫入方式或關游標再比較",
    mount(ctx) {
      ctx.html(`<div class="swarm"></div>`);
      const box = ctx.$(".swarm");
      let insts = [], html = true, cursor = true, chars = 0, rate = 0;
      const spawn = () => {
        const cell = document.createElement("div");
        cell.className = "c";
        cell.style.setProperty("--h", Math.floor(Math.random() * 360));
        const span = document.createElement("span");
        cell.append(span);
        box.append(cell);
        const k = Math.floor(Math.random() * WORDS.length);
        const t = new Typed(span, {
          strings: [WORDS[k], WORDS[(k + 3) % WORDS.length]], typeSpeed: 30, backSpeed: 12, backDelay: 500,
          startDelay: Math.random() * 800, loop: true, showCursor: cursor, contentType: html ? "html" : null,
          onStringTyped: (p, self) => { chars += self.strings[self.sequence[p]].length; },
        });
        return { t, cell };
      };
      const resize = (n) => {
        while (insts.length > n) { const x = insts.pop(); kill(x.t); x.cell.remove(); }
        while (insts.length < n) insts.push(spawn());
        const fs = n <= 100 ? 15 : n <= 400 ? 12 : n <= 1600 ? 10 : 8;
        box.style.setProperty("--fs", `${fs}px`);
        box.style.setProperty("--cw", `${fs * 6.5}px`);
      };
      const rebuild = () => { const n = insts.length; resize(0); resize(n); };
      const visible = () => {
        const first = box.firstElementChild;
        if (!first) return 0;
        const r = first.getBoundingClientRect();
        const cols = Math.max(1, Math.floor((box.clientWidth + 10) / (r.width + 10)));
        const rows = Math.floor(box.clientHeight / (r.height + 1));
        return Math.min(insts.length, cols * rows);
      };
      ctx.onCleanup(() => resize(0));
      ctx.interval(() => { rate = chars; chars = 0; }, 1000);
      ctx.group(["innerHTML", "textContent"], 0, (i) => { html = i === 0; rebuild(); });
      ctx.toggle("閃爍游標", true, (v) => { cursor = v; rebuild(); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "打字實例", unit: "個", steps: [25, 50, 100, 200, 400, 800, 1600, 3200, 6400],
        minFps: 30,
        apply: resize,
        metrics: () => ({ "每秒打出字元": nf.format(rate), "畫面上看得到": nf.format(visible()), "寫入方式": html ? "innerHTML" : "textContent", "游標": cursor ? "開" : "關" }),
        note: "每個實例各自排程計時器、每打一個字就改寫一次元素內容並觸發重排；游標是每個實例一個 CSS 閃爍動畫。數量一多，主執行緒被計時器回呼與版面計算塞滿而掉幀。被裁切在畫面外的實例照樣在更新。每秒字元以打完的句子累計。",
      });
    },
  },
] });
</script>
</body>
</html>
