<style>

<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.32/dist/uPlot.iife.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// uPlot showcase: eight scenes from the classic million-point time series to a setData benchmark.
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim() || "sans-serif";
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
const AX = { stroke: "#9b998f", grid: { stroke: "rgba(255,255,255,0.06)", width: 1 }, ticks: { stroke: "rgba(255,255,255,0.15)", width: 1, size: 4 },
  font: `11px ${FONT}`, labelFont: `11px ${FONT}` };
const ax = (o = {}) => ({ ...AX, ...o });
const nf = new Intl.NumberFormat("zh-TW");
const compact = (v) => Showcase.fmtCompact(v).replace(" ", "");
const pad = (v) => String(v).padStart(2, "0");
const rng = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };

function fmtDT(ts) {
  const d = new Date(ts * 1000);
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
// Tick labels for time axes, picked by tick spacing (uPlot passes the increment in seconds).
function timeVals(u, splits, ai, space, incr) {
  return splits.map((v) => {
    if (v == null) return null;
    const d = new Date(v * 1000);
    if (incr >= 86400 * 28) return `${d.getMonth() + 1}月`;
    if (incr >= 86400) return `${d.getMonth() + 1}/${d.getDate()}`;
    if (d.getHours() === 0 && d.getMinutes() === 0) return `${d.getMonth() + 1}/${d.getDate()}`;
    return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  });
}
function gradient(color) {
  return (u) => {
    if (!u.bbox || !Number.isFinite(u.bbox.height)) return rgba(color, 0.2); // legend markers ask before layout
    const g = u.ctx.createLinearGradient(0, u.bbox.top, 0, u.bbox.top + u.bbox.height);
    g.addColorStop(0, rgba(color, 0.36));
    g.addColorStop(1, rgba(color, 0));
    return g;
  };
}

// Create a plot that follows its box size (legend height included) and is destroyed with the scene.
function plot(ctx, box, opts, data) {
  const u = new uPlot({ ...opts, width: Math.max(box.clientWidth, 60), height: Math.max(box.clientHeight - 30, 60) }, data, box);
  const fit = () => {
    const w = box.clientWidth, hgt = box.clientHeight;
    if (!w || !hgt) return;
    u.batch(() => u.setSize({ width: w, height: u.height }));
    const extra = u.root.offsetHeight - u.height;
    const nh = Math.max(60, hgt - extra);
    if (nh !== u.height) u.batch(() => u.setSize({ width: w, height: nh }));
  };
  const ro = new ResizeObserver(fit);
  ro.observe(box);
  fit();
  let alive = true;
  u.dispose = () => { if (!alive) return; alive = false; ro.disconnect(); u.destroy(); };
  ctx.onCleanup(u.dispose);
  return u;
}
const card = (title, sub = "", cls = "") =>
  `<div class="panel up-card ${cls}"><h2>${title}${sub ? `<small>${sub}</small>` : ""}</h2><div class="up-box"></div></div>`;

// ---------- data generators ----------
const GRID_DAYS = 35, GRID_START = Math.floor(new Date(2024, 6, 1).getTime() / 1000);
function makeGrid(n) {
  const step = (GRID_DAYS * 86400) / n;
  const x = new Float64Array(n), load = new Float32Array(n), solar = new Float32Array(n), wind = new Float32Array(n);
  let w = 1.6, cloud = 1, noise = 0;
  for (let i = 0; i < n; i++) {
    const t = GRID_START + i * step, hour = ((t / 3600) + 8) % 24, day = Math.floor((t + 8 * 3600) / 86400);
    const weekend = (day + 4) % 7 >= 5 ? 0.9 : 1;
    if (i % 200 === 0) cloud = Math.min(1, Math.max(0.35, cloud + (Math.random() - 0.5) * 0.25));
    noise = noise * 0.995 + (Math.random() - 0.5) * 0.08;
    const sun = Math.max(0, Math.sin(((hour - 6) / 12) * Math.PI));
    x[i] = t;
    load[i] = (27 + 9 * Math.max(0, Math.sin(((hour - 8) / 14) * Math.PI)) + 2 * Math.sin(day / 5)) * weekend + noise;
    solar[i] = 11 * sun ** 1.5 * cloud + (sun > 0 ? noise * 0.3 : 0);
    w = Math.min(3.4, Math.max(0.2, w + (Math.random() - 0.5) * 0.02));
    wind[i] = w;
  }
  return [x, load, solar, wind];
}

// One day of per-minute metrics for three servers.
function makeServers() {
  const n = 1440, t0 = Math.floor(new Date(2024, 9, 8).getTime() / 1000), r = rng(7);
  const x = new Float64Array(n);
  const cpu = [0, 1, 2].map(() => new Float32Array(n)), mem = [0, 1, 2].map(() => new Float32Array(n)), net = [0, 1, 2].map(() => new Float32Array(n));
  const m = [4.2, 5.1, 9.5], nz = [0, 0, 0];
  for (let i = 0; i < n; i++) {
    x[i] = t0 + i * 60;
    const hr = i / 60, busy = Math.max(0, Math.sin(((hr - 7) / 16) * Math.PI)) + (hr > 19 && hr < 23 ? 0.35 : 0);
    for (let k = 0; k < 3; k++) {
      nz[k] = nz[k] * 0.9 + (r() - 0.5) * 6;
      const spike = r() < 0.004 ? 35 : 0;
      cpu[k][i] = Math.min(99, Math.max(2, (k === 2 ? 18 : 12) + busy * (k === 2 ? 38 : 52) + nz[k] + spike));
      m[k] += (k === 2 ? 0.0015 : 0.004) + busy * 0.002 + (r() - 0.5) * 0.01;
      if (k < 2 && m[k] > 11.5) m[k] = 4 + r(); // web nodes restart when memory runs high
      mem[k][i] = m[k];
      net[k][i] = Math.max(5, (k === 2 ? 120 : 260) * busy + 40 + nz[k] * 6 + spike * 8);
    }
  }
  return { x, cpu, mem, net };
}

const TPE = { hi: [19.2, 19.8, 22.0, 25.6, 29.0, 31.8, 34.0, 33.6, 31.4, 27.8, 24.6, 20.9], lo: [13.9, 14.3, 15.9, 19.2, 22.4, 25.0, 26.4, 26.2, 24.9, 22.3, 19.5, 15.6],
  rh: [77, 79, 78, 77, 76, 77, 71, 72, 73, 74, 75, 75], wet: [0.35, 0.45, 0.45, 0.45, 0.5, 0.55, 0.35, 0.45, 0.45, 0.35, 0.35, 0.35] };
function makeWeather() {
  const r = rng(2024), x = [], hi = [], lo = [], rain = [], rh = [];
  let wob = 0;
  for (let d = new Date(2024, 0, 1); d.getFullYear() === 2024; d.setDate(d.getDate() + 1)) {
    const m = d.getMonth(), f = (d.getDate() - 15) / 30, n = f < 0 ? (m + 11) % 12 : (m + 1) % 12, w = Math.abs(f);
    wob = wob * 0.8 + (r() - 0.5) * 1.8;
    const wet = r() < TPE.wet[m];
    const mm = wet ? Math.round(-Math.log(1 - r()) * (m >= 4 && m <= 8 ? 22 : 8)) : 0;
    const h = TPE.hi[m] + (TPE.hi[n] - TPE.hi[m]) * w + wob - (mm > 15 ? 2 : 0);
    const l = TPE.lo[m] + (TPE.lo[n] - TPE.lo[m]) * w + wob * 0.6;
    x.push(d.getTime() / 1000);
    hi.push(+h.toFixed(1)); lo.push(+Math.min(l, h - 2).toFixed(1));
    rain.push(mm); rh.push(Math.min(98, Math.round(TPE.rh[m] + (wet ? 9 : -4) + (r() - 0.5) * 8)));
  }
  return [x, hi, lo, rain, rh];
}

// MRT station: hourly entries, no service from 01:00 to 05:00 (null = gap).
function makeStation(seed) {
  const r = rng(seed), base = [900, null, null, null, null, null, 1500, 5200, 9800, 6100, 3600, 3300, 3800, 3500, 3400, 3900, 4800, 7600, 8900, 5800, 4200, 3700, 3000, 1900];
  return [Array.from({ length: 24 }, (_, i) => i), base.map((v) => (v == null ? null : Math.round(v * (0.82 + r() * 0.36))))];
}

// A fast-growing service: requests from hundreds to millions, errors, and a day-over-day change that goes negative.
function makeGrowth() {
  const r = rng(99), x = [], req = [], err = [], diff = [];
  const t0 = Math.floor(new Date(2024, 0, 1).getTime() / 1000);
  let prev = 300;
  for (let i = 0; i < 120; i++) {
    const week = (new Date((t0 + i * 86400) * 1000).getDay() % 6 === 0) ? 0.72 : 1;
    const v = Math.round(300 * Math.pow(10, i / 30) * week * (0.85 + r() * 0.3));
    const e = r() < 0.12 ? 0 : Math.round(v * (0.002 + r() * 0.004) * (r() < 0.05 ? 12 : 1));
    x.push(t0 + i * 86400); req.push(v); err.push(e); diff.push(v - prev);
    prev = v;
  }
  return [x, req, err, diff];
}

// Taipei Main Station: entries and exits every five minutes.
function makeMainStation() {
  const r = rng(31), x = [], ins = [], outs = [], t0 = Math.floor(new Date(2024, 9, 8).getTime() / 1000);
  const bump = (h, c, w, a) => a * Math.exp(-(((h - c) / w) ** 2));
  for (let i = 0; i < 288; i++) {
    const h = i / 12, open = h >= 6 || h < 0.5;
    const a = open ? 180 + bump(h, 8.2, 1, 2900) + bump(h, 18.2, 1.2, 2500) + bump(h, 12.5, 2.5, 500) + r() * 160 : null;
    const b = open ? 160 + bump(h, 8.6, 0.9, 3300) + bump(h, 18, 1.3, 1900) + bump(h, 21.5, 1, 600) + r() * 160 : null;
    x.push(t0 + i * 300); ins.push(a == null ? null : Math.round(a)); outs.push(b == null ? null : Math.round(b));
  }
  return [x, ins, outs];
}

// ---------- plugins ----------
// Mouse-wheel zoom around the cursor (uPlot leaves wheel handling to plugins).
function wheelZoom() {
  return { hooks: { ready: (u) => {
    u.over.addEventListener("wheel", (e) => {
      e.preventDefault();
      const { min, max } = u.scales.x, lo = u.data[0][0], hi = u.data[0][u.data[0].length - 1];
      const at = u.posToVal(e.offsetX, "x"), k = e.deltaY < 0 ? 0.75 : 1 / 0.75;
      let nMin = at - (at - min) * k, nMax = at + (max - at) * k;
      if (nMax - nMin >= hi - lo) { nMin = lo; nMax = hi; }
      u.setScale("x", { min: Math.max(lo, nMin), max: Math.min(hi, nMax) });
    }, { passive: false });
  } } };
}

// Floating tooltip that follows the cursor, built from the setCursor hook.
function tooltipPlugin(colors, fmtX, fmtY) {
  let tip;
  return { hooks: {
    init: (u) => { tip = document.createElement("div"); tip.className = "up-tip"; u.over.appendChild(tip); },
    setCursor: (u) => {
      const { left, top, idx } = u.cursor;
      if (idx == null || left == null || left < 0) { tip.style.display = "none"; return; }
      tip.innerHTML = `<b>${fmtX(u.data[0][idx])}</b>` + u.series.slice(1).map((s, i) => (s.show
        ? `<div><i style="background:${colors[i]}"></i>${s.label}<span>${fmtY(u.data[i + 1][idx])}</span></div>` : "")).join("");
      tip.style.display = "block";
      const w = tip.offsetWidth, hgt = tip.offsetHeight, W = u.over.clientWidth, H = u.over.clientHeight;
      tip.style.left = `${left + 14 + w > W ? Math.max(0, left - 14 - w) : left + 14}px`;
      tip.style.top = `${Math.max(0, Math.min((top ?? H / 2) - hgt / 2, H - hgt))}px`;
    },
  } };
}

// Dashed threshold line plus shaded stretches where series 1 exceeds it, drawn in the draw hook.
function thresholdPlugin(value, label) {
  return { hooks: { draw: (u) => {
    const c = u.ctx, px = uPlot.pxRatio, { left, top, width, height } = u.bbox;
    const y = Math.round(u.valToPos(value, "y", true));
    const xs = u.data[0], ys = u.data[1];
    c.save();
    c.fillStyle = "rgba(247, 37, 133, 0.12)";
    let start = -1;
    for (let i = 0; i <= ys.length; i++) {
      const over = i < ys.length && ys[i] != null && ys[i] > value;
      if (over && start < 0) start = i;
      if (!over && start >= 0) {
        const a = u.valToPos(xs[start], "x", true), b = u.valToPos(xs[i - 1], "x", true);
        c.fillRect(a, top, Math.max(b - a, 2 * px), height);
        start = -1;
      }
    }
    c.strokeStyle = "#f72585"; c.lineWidth = px; c.setLineDash([6 * px, 4 * px]);
    c.beginPath(); c.moveTo(left, y); c.lineTo(left + width, y); c.stroke();
    c.setLineDash([]);
    c.font = `${11 * px}px ${FONT}`; c.fillStyle = "#f72585"; c.textAlign = "right";
    c.fillText(label, left + width - 6 * px, y - 6 * px);
    c.restore();
  } } };
}

// Mark the peak of every visible series with a dot and a label.
function peakPlugin(fmtX) {
  return { hooks: { draw: (u) => {
    const c = u.ctx, px = uPlot.pxRatio;
    c.save();
    c.font = `600 ${11 * px}px ${FONT}`; c.textAlign = "center";
    const placed = [];
    u.series.forEach((s, si) => {
      if (si === 0 || !s.show) return;
      const ys = u.data[si];
      let best = -1;
      for (let i = 0; i < ys.length; i++) if (ys[i] != null && (best < 0 || ys[i] > ys[best])) best = i;
      if (best < 0) return;
      const x = u.valToPos(u.data[0][best], "x", true), y = u.valToPos(ys[best], "y", true);
      const col = typeof s.stroke === "function" ? s.stroke(u, si) : s.stroke;
      c.fillStyle = col; c.beginPath(); c.arc(x, y, 4 * px, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#ecebe6";
      const text = `${s.label}尖峰 ${fmtX(u.data[0][best])}・${nf.format(ys[best])}`, w = c.measureText(text).width;
      let ly = y - 10 * px;
      for (const p of placed) if (Math.abs(p.x - x) < (p.w + w) / 2 + 4 * px && Math.abs(p.y - ly) < 14 * px) ly = p.y - 15 * px;
      placed.push({ x, y: ly, w });
      c.fillText(text, x, ly);
    });
    c.restore();
  } } };
}

// Drag to select a range and get sum / mean / max without zooming (setSelect hook, drag.setScale off).
function selectStatsPlugin() {
  let box;
  return {
    opts: (u, opts) => { opts.cursor = { ...opts.cursor, drag: { x: true, y: false, setScale: false } }; },
    hooks: {
      init: (u) => { box = document.createElement("div"); box.className = "up-sel"; u.over.appendChild(box); },
      setSelect: (u) => {
        const { left, width } = u.select;
        if (width < 4) { box.style.display = "none"; return; }
        const i0 = u.posToIdx(left), i1 = u.posToIdx(left + width);
        const rows = u.series.slice(1).map((s, k) => {
          let sum = 0, n = 0, max = 0;
          for (let i = i0; i <= i1; i++) { const v = u.data[k + 1][i]; if (v != null) { sum += v; n++; if (v > max) max = v; } }
          return `${s.label} 合計 <b>${nf.format(sum)}</b>・平均 <b>${nf.format(Math.round(sum / Math.max(n, 1)))}</b>・最高 <b>${nf.format(max)}</b>`;
        });
        box.innerHTML = `${timeOf(u.data[0][i0])} 至 ${timeOf(u.data[0][i1])}<br>${rows.join("<br>")}`;
        box.style.display = "block";
        const W = u.over.clientWidth, w = box.offsetWidth;
        box.style.left = `${Math.max(0, Math.min(left, W - w))}px`;
        box.style.top = "6px";
      },
    },
  };
}
const timeOf = (ts) => { const d = new Date(ts * 1000); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

Showcase.run({ scenes: [
  {
    id: "grid", title: "電力負載",
    api: "new uPlot({ series, axes, scales, cursor, plugins }, data, el)",
    desc: "35 天秒級電網資料，三條數列畫在同一張 canvas：漸層填色是 fill 回呼，框選放大是內建 cursor.drag，滾輪縮放是十幾行的 hooks 插件；切到 100 萬點仍能即時重繪。",
    hint: "拖曳框選放大・滾輪縮放・雙擊還原・點圖例隱藏數列",
    mount(ctx) {
      ctx.html(`<div class="up-solo">${card("全台電力負載 35 天", "<span class=\"up-info\">計算中…</span>")}</div>`);
      const info = ctx.$(".up-info");
      const gw = (s, v) => (v == null ? "-" : `${v.toFixed(2)} GW`);
      const u = plot(ctx, ctx.$(".up-box"), {
        plugins: [wheelZoom()],
        cursor: { drag: { x: true, y: false }, points: { size: 7 } },
        scales: { x: { time: true }, y: { range: [0, 42] } },
        series: [
          { label: "時間", value: (s, v) => (v == null ? "滑過圖表" : fmtDT(v)) },
          { label: "總負載", stroke: C[1], width: 1, fill: gradient(C[1]), value: gw },
          { label: "太陽光電", stroke: C[0], width: 1, fill: gradient(C[0]), value: gw },
          { label: "風力", stroke: C[3], width: 1, value: gw },
        ],
        axes: [ax({ space: 70, values: timeVals }), ax({ size: 42, values: (s, sp) => sp.map((v) => `${v}`) })],
      }, [[], [], [], []]);
      const load = (n) => {
        const t0 = performance.now();
        const data = makeGrid(n);
        const t1 = performance.now();
        u.batch(() => u.setData(data));
        const t2 = performance.now();
        info.innerHTML = `<span class="up-num">${nf.format(n * 3)}</span> 點・產生 <span class="up-num">${(t1 - t0).toFixed(0)}</span> ms・setData 加繪製 <span class="up-num">${(t2 - t1).toFixed(0)}</span> ms`;
      };
      load(100000);
      ctx.group(["10 萬點", "50 萬點", "100 萬點"], 0, (i) => {
        info.textContent = "計算中…";
        ctx.timeout(() => load([100000, 500000, 1000000][i]), 30);
      });
    },
  },
  {
    id: "sync", title: "多圖連動",
    api: "cursor.sync = { key, setSeries } / uPlot.sync(key).sub(u)",
    desc: "三張圖共用同一個 sync key，游標、聚焦與圖例開關會互相廣播；縮放連動則是在 setScale hook 裡把 x 範圍套到其他圖。uPlot.sync(key) 回傳的物件可以隨時 sub / unsub。",
    hint: "滑過任一張圖・框選放大・點下方圖例隱藏主機・關掉連動比較",
    mount(ctx) {
      const tags = ["CPU 使用率（%）", "記憶體（GB）", "網路流量（Mbps）"];
      ctx.html(`<div class="up-solo"><div class="panel up-card up-sync">${tags.map((t) => `<div class="up-box"><span class="up-tag">${t}</span></div>`).join("")}</div></div>`);
      const d = makeServers(), KEY = "up-hosts", sync = uPlot.sync(KEY), plots = [];
      const narrow = ctx.el.clientWidth < 560, roomy = !narrow && ctx.el.clientHeight >= 520;
      let linkZoom = true;
      const onScale = (u, key) => {
        if (key !== "x" || !linkZoom) return;
        const { min, max } = u.scales.x;
        for (const p of plots) if (p !== u && (p.scales.x.min !== min || p.scales.x.max !== max)) p.setScale("x", { min, max });
      };
      const HOSTS = ["web-1", "web-2", "db-1"], COL = [C[1], C[3], C[2]], unit = ["%", " GB", " Mbps"], digits = [0, 2, 0];
      [d.cpu, d.mem, d.net].forEach((arr, k) => {
        plots.push(plot(ctx, ctx.$$(".up-box")[k], {
          legend: { show: k === 2 && roomy },
          cursor: { sync: { key: KEY, setSeries: true }, drag: { x: true, y: false }, focus: { prox: 24 } },
          focus: { alpha: 0.25 },
          scales: { x: { time: true }, y: k === 0 ? { range: [0, 100] } : {} },
          series: [
            { label: "時間", value: (s, v) => (v == null ? "-" : fmtDT(v)) },
            ...HOSTS.map((h, i) => ({ label: h, stroke: COL[i], width: 1.2, value: (s, v) => (v == null ? "-" : `${v.toFixed(digits[k])}${unit[k]}`) })),
          ],
          axes: [k === 2 ? ax({ space: narrow ? 70 : 60, values: timeVals }) : { show: false }, ax({ size: 44, space: 18, values: (s, sp) => sp.map((v) => compact(v)) })],
          hooks: { setScale: [onScale] },
        }, [d.x, ...arr]));
      });
      ctx.toggle("游標連動", true, (v) => plots.forEach((p) => (v ? sync.sub(p) : sync.unsub(p))));
      ctx.toggle("縮放連動", true, (v) => { linkZoom = v; });
      ctx.button("重設縮放", () => plots.forEach((p) => p.setScale("x", { min: d.x[0], max: d.x[d.x.length - 1] })));
    },
  },
  {
    id: "paths", title: "路徑渲染器",
    api: "series.paths = uPlot.paths.linear() | spline() | stepped() | bars()",
    desc: "同一筆捷運站每小時進站人次，換四種內建路徑產生器；凌晨停駛時段是 null，spanGaps 決定要斷開還是連起來，points 控制資料點顯示。",
    hint: "切換「跨越缺值」與「資料點」・按「換一天」看資料更新",
    mount(ctx) {
      const PATHS = [
        ["折線", "paths.linear()", () => uPlot.paths.linear()],
        ["平滑曲線", "paths.spline()", () => uPlot.paths.spline()],
        ["階梯", "paths.stepped({ align: 1 })", () => uPlot.paths.stepped({ align: 1 })],
        ["長條", "paths.bars({ size: [0.6, 40] })", () => uPlot.paths.bars({ size: [0.6, 40] })],
      ];
      ctx.html(`<div class="up-quad">${PATHS.map(([t, code]) => `<div class="panel up-card"><h2>${t}<code>${code}</code></h2><div class="up-box"></div></div>`).join("")}</div>`);
      const boxes = ctx.$$(".up-box");
      let seed = 3, data = makeStation(seed), span = false, pts = true, plots = [];
      const build = () => {
        plots.forEach((p) => p.dispose());
        plots = PATHS.map(([, , make], i) => plot(ctx, boxes[i], {
          legend: { show: false },
          cursor: { points: { size: 6 } },
          scales: { x: { time: false, range: [-0.6, 23.6] }, y: { range: [0, 12000] } },
          series: [{}, {
            label: "進站", stroke: C[i === 3 ? 0 : 1], width: 1.5, paths: make(), spanGaps: span,
            fill: i === 3 ? rgba(C[0], 0.75) : rgba(C[1], 0.14),

          }],
          axes: [ax({ space: 34, values: (s, sp) => sp.map((v) => (v % 1 ? null : `${v}時`)) }), ax({ size: 36, space: 22, values: (s, sp) => sp.map((v) => compact(v)) })],
        }, data));
      };
      build();
      ctx.toggle("跨越缺值", span, (v) => { span = v; build(); });
      ctx.toggle("資料點", pts, (v) => { pts = v; build(); });
      ctx.button("換一天", () => { data = makeStation(++seed); plots.forEach((p) => p.setData(data, false)); });
    },
  },
  {
    id: "axes", title: "多軸與帶狀",
    api: "scales: { °C, mm, % } + axes[side: 1] + bands: [{ series: [1, 2] }]",
    desc: "台北一年的每日最高與最低溫用 bands 填出溫差帶，降雨量用長條畫在第二個尺度，相對濕度放第三個尺度；每條軸用 scale 綁定、side 決定左右。addBand / delBand 可在執行期增刪帶狀。",
    hint: "選季節跳到該區間・開關帶狀填色・點圖例隱藏數列",
    mount(ctx) {
      ctx.html(`<div class="up-solo">${card("台北 2024 每日天氣", "示意資料")}</div>`);
      const data = makeWeather(), narrow = ctx.el.clientWidth < 560;
      const BAND = { series: [1, 2], fill: rgba(C[4], 0.18) };
      const u = plot(ctx, ctx.$(".up-box"), {
        cursor: { drag: { x: true, y: false } },
        scales: { x: { time: true }, "°C": { range: [-12, 50] }, mm: { range: [0, 420] }, "%": { range: [-140, 100] } },
        bands: [BAND],
        series: [
          { label: "日期", value: (s, v) => (v == null ? "-" : `${new Date(v * 1000).getMonth() + 1}/${new Date(v * 1000).getDate()}`) },
          { label: "最高溫", scale: "°C", stroke: C[4], width: 1.4, value: (s, v) => (v == null ? "-" : `${v} °C`) },
          { label: "最低溫", scale: "°C", stroke: C[5], width: 1.4, value: (s, v) => (v == null ? "-" : `${v} °C`) },
          { label: "降雨", scale: "mm", stroke: C[1], fill: rgba(C[1], 0.55), width: 0, paths: uPlot.paths.bars({ size: [0.7, 6] }), value: (s, v) => (v == null ? "-" : `${v} mm`) },
          { label: "濕度", scale: "%", stroke: C[3], width: 1, dash: [4, 3], value: (s, v) => (v == null ? "-" : `${v}%`) },
        ],
        axes: [
          ax({ space: 50, values: timeVals }),
          ax({ scale: "°C", size: 40, splits: () => [10, 20, 30, 40], values: (s, sp) => sp.map((v) => `${v}°`) }),
          ax({ scale: "mm", side: 1, size: narrow ? 34 : 42, grid: { show: false }, stroke: C[1], splits: () => [0, 50, 100, 150], values: (s, sp) => sp.map((v) => `${v}`) }),
          ax({ scale: "%", side: 1, size: narrow ? 34 : 40, grid: { show: false }, stroke: C[3], splits: () => [60, 100], values: (s, sp) => sp.map((v) => `${v}%`) }),
        ],
      }, data);
      const t = (m, d) => new Date(2024, m, d).getTime() / 1000;
      const RANGES = [[t(0, 1), t(11, 31)], [t(4, 10), t(6, 10)], [t(6, 1), t(9, 15)], [t(0, 1), t(2, 15)]];
      ctx.group(["全年", "梅雨季", "颱風季", "冬季"], 0, (i) => u.setScale("x", { min: RANGES[i][0], max: RANGES[i][1] }));
      ctx.toggle("帶狀填色", true, (v) => { if (v) u.addBand(BAND); else u.delBand(0); u.redraw(); });
    },
  },
  {
    id: "log", title: "對數尺度",
    api: "scales.y = { distr: 3, log: 10 } | { distr: 4, asinh: 1 }",
    desc: "請求量從幾百成長到上百萬，線性軸把錯誤數壓成一條貼地的線；distr: 3 換成對數軸後各數量級都看得清楚，但 0 與負值無法上對數軸，distr: 4 的 asinh 軸則能同時容納負值。",
    hint: "右側切換 log10、asinh、線性，看「日增減」的負值怎麼處理",
    mount(ctx) {
      ctx.html(`<div class="up-pair">${card("線性軸", "distr: 1")}${card("對照軸", "<span class=\"up-info\"></span>")}</div>`);
      const data = makeGrowth(), boxes = ctx.$$(".up-box"), info = ctx.$(".up-info"), narrow = ctx.el.clientWidth < 560;
      const COL = [C[1], C[2], C[0]];
      const series = () => [
        { label: "日期", value: (s, v) => (v == null ? "-" : `${new Date(v * 1000).getMonth() + 1}/${new Date(v * 1000).getDate()}`) },
        ...["請求數", "錯誤數", "日增減"].map((l, i) => ({ label: l, stroke: COL[i], width: 1.3, value: (s, v, si, idx) => (idx == null ? "-" : v == null ? "無法顯示" : nf.format(v)) })),
      ];
      // Log axes label every power of ten; on short plots keep only even powers so labels do not collide.
      const yVals = (u, sp) => {
        const n = sp.filter((v) => v != null).length;
        const thin = u.scales.y.distr !== 1 && u.bbox && u.bbox.height / uPlot.pxRatio / Math.max(n, 1) < 20;
        return sp.map((v) => (v == null ? null : thin && v !== 0 && Math.round(Math.log10(Math.abs(v))) % 2 ? null : compact(v)));
      };
      plot(ctx, boxes[0], { legend: { show: !narrow }, cursor: { sync: { key: "up-log" } }, scales: { x: { time: true } }, series: series(),
        axes: [ax({ space: 60, values: timeVals }), ax({ size: 48, values: yVals })] }, data);
      const MODES = [
        ["log10", { distr: 3, log: 10 }],
        ["asinh", { distr: 4, log: 10, asinh: 1 }],
        ["線性", { distr: 1 }],
      ];
      let right;
      const build = (m) => {
        if (right) right.dispose();
        const [name, scale] = MODES[m];
        const d = m === 0 ? data.map((col, k) => (k === 0 ? col : col.map((v) => (v > 0 ? v : null)))) : data;
        const dropped = m === 0 ? data.slice(1).reduce((s, col) => s + col.filter((v) => !(v > 0)).length, 0) : 0;
        info.innerHTML = `${name}${m === 0 ? `・<span class="up-num">${dropped}</span> 個 0 或負值留白` : m === 1 ? "・負值與 0 也能畫" : ""}`;
        right = plot(ctx, boxes[1], { legend: { live: !narrow }, cursor: { sync: { key: "up-log" } }, scales: { x: { time: true }, y: scale }, series: series(),
          axes: [ax({ space: 60, values: timeVals }), ax({ size: 48, values: yVals })] }, d);
      };
      build(0);
      ctx.group(["log10", "asinh", "線性"], 0, (i) => build(i));
    },
  },
  {
    id: "plugins", title: "自寫插件",
    api: "plugins: [{ opts, hooks: { init, setCursor, setSelect, draw } }]",
    desc: "uPlot 本體不含 tooltip 與標註，全靠 hooks：setCursor 做跟隨提示框，draw 直接在 canvas 畫警戒線與尖峰標記，setSelect 搭配 drag.setScale: false 把框選變成區間統計。每個插件都是幾十行的物件。",
    hint: "滑過看提示框・拖曳框選看區間統計・開關各插件",
    mount(ctx) {
      ctx.html(`<div class="up-solo">${card("台北車站每 5 分鐘進出站人次", "示意資料")}</div>`);
      const data = makeMainStation(), box = ctx.$(".up-box"), COL = [C[1], C[4]];
      const on = { tip: true, line: true, peak: true, sel: true };
      let u;
      const build = () => {
        if (u) u.dispose();
        const plugins = [];
        if (on.tip) plugins.push(tooltipPlugin(COL, (v) => timeOf(v), (v) => (v == null ? "停駛" : `${nf.format(v)} 人`)));
        if (on.line) plugins.push(thresholdPlugin(2400, "月台警戒 2,400 人／5 分"));
        if (on.peak) plugins.push(peakPlugin(timeOf));
        if (on.sel) plugins.push(selectStatsPlugin());
        u = plot(ctx, box, {
          plugins,
          legend: { live: !on.tip },
          cursor: { drag: { x: true, y: false } },
          scales: { x: { time: true }, y: { range: [0, 4200] } },
          series: [
            { label: "時間", value: (s, v) => (v == null ? "-" : timeOf(v)) },
            { label: "進站", stroke: COL[0], width: 1.4, fill: gradient(COL[0]), value: (s, v) => (v == null ? "-" : nf.format(v)) },
            { label: "出站", stroke: COL[1], width: 1.4, value: (s, v) => (v == null ? "-" : nf.format(v)) },
          ],
          axes: [ax({ space: 60, values: timeVals }), ax({ size: 44, values: (s, sp) => sp.map((v) => compact(v)) })],
        }, data);
      };
      build();
      ctx.toggle("提示框", on.tip, (v) => { on.tip = v; build(); });
      ctx.toggle("警戒線", on.line, (v) => { on.line = v; build(); });
      ctx.toggle("尖峰標註", on.peak, (v) => { on.peak = v; build(); });
      ctx.toggle("框選統計", on.sel, (v) => { on.sel = v; build(); });
    },
  },
  {
    id: "stream", title: "即時串流",
    api: "u.setData([x, ...ys]) 每一幀",
    desc: "模擬三軸振動感測器持續寫入環形緩衝區（TypedArray + copyWithin），每一幀呼叫一次 setData 讓 x 範圍自動跟著捲動；視窗開到 10 萬點、取樣率拉高，看幀率與單次繪製時間的變化。",
    hint: "切換視窗點數・拖曳取樣率・點圖例隱藏軸向・暫停凍結畫面",
    mount(ctx) {
      ctx.html(`<div class="up-solo up-low">${card("三軸振動感測器", "即時串流・示意訊號")}</div>`);
      let N = 10000, rate = 2000, paused = false, len = 0, t = 0, carry = 0, drawMs = 0;
      let X, A, B, Z;
      const alloc = () => { X = new Float64Array(N); A = new Float32Array(N); B = new Float32Array(N); Z = new Float32Array(N); len = 0; };
      alloc();
      const g = (s) => s * (Math.random() + Math.random() + Math.random() - 1.5);
      const sample = (i) => {
        const burst = Math.sin(t * 0.7) > 0.93 ? 2.2 : 1;
        X[i] = t;
        A[i] = (Math.sin(t * 2 * Math.PI * 7.3) * 0.9 + g(0.25)) * burst;
        B[i] = Math.sin(t * 2 * Math.PI * 2.1 + 1) * 0.6 + Math.sin(t * 2 * Math.PI * 23) * 0.2 + g(0.2);
        Z[i] = 1 + Math.sin(t * 2 * Math.PI * 0.4) * 0.3 + g(0.15) * burst;
      };
      const val = (s, v) => (v == null ? "-" : `${v.toFixed(2)} g`);
      const u = plot(ctx, ctx.$(".up-box"), {
        cursor: { drag: { x: false, y: false } },
        scales: { x: { time: false }, y: { range: [-3.2, 3.2] } },
        series: [
          { label: "時間", value: (s, v) => (v == null ? "-" : `${v.toFixed(3)} s`) },
          { label: "X 軸", stroke: C[1], width: 1, value: val },
          { label: "Y 軸", stroke: C[2], width: 1, value: val },
          { label: "Z 軸", stroke: C[0], width: 1, value: val },
        ],
        axes: [ax({ space: 70, values: (s, sp) => sp.map((v) => `${v.toFixed(1)} s`) }), ax({ size: 40, values: (s, sp) => sp.map((v) => `${v}`) })],
      }, [[], [], [], []]);
      ctx.fps({ position: "bottom", extra: () => ({ 點數: compact(len * 3), 繪製: `${drawMs.toFixed(1)} ms` }) });
      ctx.raf((now, dt) => {
        if (paused) return;
        carry += (rate * dt) / 1000;
        let k = Math.min(Math.floor(carry), N);
        carry -= k;
        if (!k) return;
        const room = N - len;
        if (k > room) {
          const shift = k - room;
          X.copyWithin(0, shift); A.copyWithin(0, shift); B.copyWithin(0, shift); Z.copyWithin(0, shift);
          len -= shift;
        }
        for (let j = 0; j < k; j++) { t += 1 / rate; sample(len++); }
        const t0 = performance.now();
        u.batch(() => u.setData([X.subarray(0, len), A.subarray(0, len), B.subarray(0, len), Z.subarray(0, len)]));
        drawMs = drawMs * 0.9 + (performance.now() - t0) * 0.1;
      });
      ctx.group(["1 千點", "1 萬點", "10 萬點"], 1, (i) => { N = [1000, 10000, 100000][i]; alloc(); });
      ctx.slider("取樣率", { min: 100, max: 20000, step: 100, value: rate, format: (v) => `${nf.format(v)} Hz` }, (v) => { rate = v; });
      ctx.toggle("暫停", false, (v) => { paused = v; });
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "u.batch(() => u.setData(data)) + u.setScale('x', …)",
    desc: "一條 Float32Array 隨機漫步數列從 1 萬點加到 400 萬點，計時 setData 後同步完成的範圍計算與整條路徑繪製，再加一次放大到中間一半的重繪。",
    hint: "按「開始測試」；切換填色後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="up-stress">${card("隨機漫步", "<span class=\"up-info\">1 萬點</span>")}</div>`);
      const info = ctx.$(".up-info");
      let fill = false, u;
      const make = (n) => {
        const x = new Float64Array(n), y = new Float32Array(n);
        let v = 0;
        for (let i = 0; i < n; i++) { v += Math.random() - 0.5; x[i] = i; y[i] = v + Math.sin(i / (n / 9)) * Math.sqrt(n) * 0.2; }
        return [x, y];
      };
      let last = make(10000);
      const build = () => {
        if (u) u.dispose();
        u = plot(ctx, ctx.$(".up-box"), {
          legend: { show: false },
          cursor: { drag: { x: true, y: false } },
          scales: { x: { time: false } },
          series: [{}, { stroke: C[1], width: 1, fill: fill ? rgba(C[1], 0.16) : undefined }],
          axes: [ax({ space: 70, values: (s, sp) => sp.map((v) => compact(v)) }), ax({ size: 44, values: (s, sp) => sp.map((v) => compact(v)) })],
        }, last);
      };
      build();
      ctx.toggle("填色", fill, (v) => { fill = v; build(); });
      ctx.controls.classList.add("bottom");
      ctx.bench({
        label: "資料點", unit: "點",
        sizes: [10000, 50000, 100000, 250000, 500000, 1000000, 2000000, 4000000],
        prepare: (n) => make(n),
        run(n, data) {
          last = data;
          u.batch(() => u.setData(data));
          const t1 = performance.now();
          u.batch(() => u.setScale("x", { min: n * 0.25, max: n * 0.75 }));
          const zoom = performance.now() - t1;
          info.textContent = `${Showcase.fmtCompact(n)} 點`;
          return `放大 ${Showcase.fmtMs(zoom)}`;
        },
        note: "計時含 setData 的範圍計算與第一次繪製，以及放大到中段一半的重繪；資料產生不計入。uPlot 畫線時會把同一個像素欄內的點合併成最小值與最大值，畫面成本跟寬度有關，但每個點仍要掃過一次。開啟填色會多一次 fill。",
      });
    },
  },
] });
</script>
