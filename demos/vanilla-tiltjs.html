<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vanilla-tilt.js 示範：3D 傾斜照片卡</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(70% 60% at 50% 0%, #1f2440, var(--bg) 70%); }
  .wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 56px 16px 44px; gap: 16px; }
  header { text-align: center; }
  header h1 { margin: 0; font-size: clamp(22px, 4.4vw, 34px); font-weight: 900; }
  header .read { font: 12px var(--mono); color: var(--muted); }
  header .read b { color: var(--accent); }
  .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 240px)); gap: clamp(14px, 3vw, 34px); width: 100%; justify-content: center; }
  .card { position: relative; aspect-ratio: 3 / 4; border-radius: 18px; transform-style: preserve-3d; cursor: pointer;
    box-shadow: 0 30px 60px rgba(0,0,0,.5); }
  .photo { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.72)); }
  .txt { position: absolute; left: 16px; right: 16px; bottom: 16px; transform: translateZ(50px); }
  .txt b { display: block; font-size: clamp(16px, 2.4vw, 22px); line-height: 1.2; }
  .txt span { font-size: 12px; color: rgba(255,255,255,.8); }
  .badge { position: absolute; top: 14px; right: 14px; padding: 4px 10px; border-radius: 999px; font: 700 11px var(--mono); color: #111;
    transform: translateZ(70px); box-shadow: 0 8px 20px rgba(0,0,0,.35); }
  .cap { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .panel.ctl { position: fixed; right: 12px; top: 12px; z-index: 50; width: 190px; }
  .ctl label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .ctl input { width: 100%; accent-color: var(--accent); }
  @media (max-width: 600px) {
    .wrap { justify-content: flex-start; padding-top: 100px; }
    .cards { grid-template-columns: 1fr 1fr; max-width: 420px; }
    .item:nth-child(3) { grid-column: span 2; }
    .item:nth-child(3) .card { aspect-ratio: 2.1 / 1; }
    .cap { display: none; }
    .panel.ctl { width: 150px; }
    header { align-self: flex-start; max-width: calc(100% - 170px); text-align: left; position: absolute; top: 12px; left: 16px; }
    header h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>把滑鼠移到卡片上</h1>
    <div class="read">傾角 X <b id="tx">0.0°</b>　Y <b id="ty">0.0°</b></div>
  </header>
  <div class="cards">
    <div class="item">
      <div class="card" id="c1"><div class="photo"><img src="_shared/img/photo-5.jpg" alt="瀑布彩虹"></div>
        <div class="badge" style="background:var(--c1)">GLARE</div><div class="txt"><b>瀑布與彩虹</b><span>反光 + 放大</span></div></div>
      <div class="cap">glare、scale 1.06</div>
    </div>
    <div class="item">
      <div class="card" id="c2"><div class="photo"><img src="_shared/img/photo-6.jpg" alt="水母"></div>
        <div class="badge" style="background:var(--c2)">REVERSE</div><div class="txt"><b>深海水母</b><span>反向傾斜，文字浮起</span></div></div>
      <div class="cap">reverse、translateZ 浮層</div>
    </div>
    <div class="item">
      <div class="card" id="c3"><div class="photo"><img src="_shared/img/photo-1.jpg" alt="峽灣"></div>
        <div class="badge" style="background:var(--c3);color:#fff">FULL PAGE</div><div class="txt"><b>挪威峽灣</b><span>整頁都能帶動</span></div></div>
      <div class="cap">full-page-listening</div>
    </div>
  </div>
</div>

<div class="panel ctl">
  <label>最大傾角 <b id="mv">18°</b></label>
  <input type="range" id="max" min="5" max="35" value="18">
</div>
<div class="hint">滑鼠移動或手機傾斜都會帶動卡片</div>

<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
<script>
// Each card shows a different set of options; startX/startY give a resting tilt
const SETUPS = {
  c1: { glare: true, "max-glare": 0.5, scale: 1.06, startX: -10, startY: 8 },
  c2: { reverse: true, glare: true, "max-glare": 0.25, startX: 8, startY: -6 },
  c3: { "full-page-listening": true, glare: true, "max-glare": 0.35, startX: 12, startY: 10 },
};
const tx = document.getElementById("tx"), ty = document.getElementById("ty");
function init(max) {
  for (const id in SETUPS) {
    const el = document.getElementById(id);
    if (el.vanillaTilt) el.vanillaTilt.destroy();
    VanillaTilt.init(el, { max, speed: 500, perspective: 900, ...SETUPS[id] });
  }
}
for (const id in SETUPS) {
  document.getElementById(id).addEventListener("tiltChange", (e) => {
    tx.textContent = e.detail.tiltX + "°";
    ty.textContent = e.detail.tiltY + "°";
  });
}
init(18);

const max = document.getElementById("max"), mv = document.getElementById("mv");
max.addEventListener("input", () => { mv.textContent = max.value + "°"; init(+max.value); });
</script>
</body>
</html>
