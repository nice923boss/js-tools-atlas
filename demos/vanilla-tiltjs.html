<style>
  .sc-scene { background: radial-gradient(70% 60% at 50% 0%, #1f2440, var(--bg) 70%); }

  /* generic layout: .board pads around the controls, .fit is a size container for the card row */
  .board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 12px) 12px calc(var(--sc-ctl-b, 0px) + 34px); display: grid; gap: 12px; }
  .fit { container-type: size; display: grid; place-items: center; min-width: 0; min-height: 0; width: 100%; height: 100%; }
  .cards { --cols: 3; --rows: 1; --gap: clamp(10px, 3.2cqw, 36px); --capH: 44px; --maxw: 250px;
    --w: min(var(--maxw), calc((100cqw - (var(--cols) - 1) * var(--gap)) / var(--cols)), calc(((100cqh - (var(--rows) - 1) * 12px) / var(--rows) - var(--capH)) * 0.75));
    display: grid; grid-template-columns: repeat(var(--cols), var(--w)); gap: 12px var(--gap); justify-content: center; align-content: center; }
  .cards.one { --cols: 1; } .cards.two { --cols: 2; } .cards.four { --cols: 4; --maxw: 210px; }
  @container (max-width: 520px) { .cards.four { --cols: 2; --rows: 2; } }

  /* card */
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
  .slot { position: relative; width: var(--w); aspect-ratio: 3 / 4; }
  .tc { position: absolute; inset: 0; border-radius: calc(var(--w) * 0.07); transform-style: preserve-3d; background: var(--bg-2);
    box-shadow: 0 calc(var(--w) * 0.1) calc(var(--w) * 0.2) rgba(0, 0, 0, 0.5); cursor: pointer; }
  .tc .photo { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; }
  .tc .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tc .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0, 0, 0, 0.75)); }
  .tc .txt { position: absolute; left: 8%; right: 8%; bottom: 7%; transform: translateZ(calc(var(--w) * 0.2)); pointer-events: none; }
  .tc .txt b { display: block; font-size: clamp(12px, calc(var(--w) * 0.09), 22px); line-height: 1.2; color: #fff; }
  .tc .txt span { display: block; font-size: clamp(10px, calc(var(--w) * 0.055), 12.5px); line-height: 1.35; color: rgba(255, 255, 255, 0.82); }
  .tc .badge { position: absolute; top: 6%; right: 6%; padding: 2px 8px; border-radius: 999px; pointer-events: none;
    font: 700 clamp(9px, calc(var(--w) * 0.05), 11px)/1.4 var(--mono); transform: translateZ(calc(var(--w) * 0.28)); box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35); }
  .cap { width: var(--w); text-align: center; font: 500 10.5px/1.4 var(--mono); color: var(--muted); min-height: 2.8em; overflow-wrap: anywhere; }
  .cap code { display: block; color: var(--fg); font: inherit; }
  .cap .live { display: block; color: var(--accent); font-variant-numeric: tabular-nums; }
  .cap .note { display: block; font-family: var(--font); }

  /* holographic glare written by hand (glare-prerender) */
  .holo.js-tilt-glare { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; mix-blend-mode: color-dodge; }
  .holo .js-tilt-glare-inner { position: absolute; left: 50%; top: 50%; width: 280%; aspect-ratio: 1; transform-origin: 0 0; opacity: 0; pointer-events: none;
    background: linear-gradient(0deg, transparent 12%, rgba(255, 60, 172, 0.6) 36%, rgba(120, 75, 255, 0.6) 48%, rgba(0, 220, 255, 0.6) 60%, rgba(255, 240, 90, 0.65) 74%, transparent 90%); }
  .tc .frame { position: absolute; inset: 5%; border: 1.5px solid rgba(255, 255, 255, 0.55); border-radius: calc(var(--w) * 0.045); pointer-events: none; transform: translateZ(calc(var(--w) * 0.08)); }

  /* virtual pointer + autopilot chip */
  .ghost { position: absolute; left: 0; top: 0; z-index: 30; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; pointer-events: none;
    border: 2px solid var(--accent); background: rgba(247, 223, 30, 0.16); box-shadow: 0 0 0 4px rgba(247, 223, 30, 0.1); opacity: 0; transition: opacity .25s; }
  .ghost::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--accent); }
  .ghost.on { opacity: 1; }
  .pilot { position: absolute; right: 10px; bottom: 8px; z-index: 30; padding: 2px 10px; border-radius: 999px; pointer-events: none;
    background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 11.5px; transition: opacity .3s; white-space: nowrap; }
  .pilot.off { opacity: 0; }
  .rows { grid-template-rows: auto minmax(0, 1fr); gap: 4px; }
  .state { font: 500 11.5px/1.4 var(--mono); color: var(--muted); }
  .state b { color: var(--accent); font-family: var(--font); }

  /* 6. events */
  .evt { grid-template-columns: minmax(0, 1fr) minmax(0, 290px); }
  .zone { position: relative; min-width: 0; min-height: 0; border: 1.5px dashed rgba(247, 223, 30, 0.45); border-radius: 14px; background: rgba(247, 223, 30, 0.03); padding: 26px 10px 10px; }
  .zone .fit { height: 100%; }
  .zone .cards { --maxw: 230px; --capH: 0px; }
  .ztag { position: absolute; left: 10px; top: 5px; font: 500 11px/1.4 var(--mono); color: var(--accent); }
  .data { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; align-content: start; min-height: 0; overflow: hidden; padding: 12px 14px; }
  .vals { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; font: 500 12px/1.55 var(--mono); }
  .vals small { color: var(--muted); font-size: 11.5px; }
  .vals b { color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }
  .viz { display: flex; flex-direction: column; gap: 8px; }
  .compass, .pad { position: relative; width: 62px; height: 62px; border: 1px solid var(--line); background: rgba(127, 127, 127, 0.08); }
  .compass { border-radius: 50%; }
  .compass i { position: absolute; left: 50%; top: 8px; bottom: 50%; width: 2px; margin-left: -1px; background: var(--c3); transform-origin: 50% 100%; border-radius: 2px; }
  .compass::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--fg); }
  .pad { border-radius: 8px; }
  .pad i { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: var(--c2); box-shadow: 0 0 0 3px rgba(76, 201, 240, 0.25); }
  .rate, .snaps { grid-column: 1 / -1; font-size: 12px; }
  .rate small, .snaps small { color: var(--muted); }
  .rate b { font: 700 15px/1 var(--mono); color: var(--c4); margin: 0 2px; }
  .snaps ol { margin: 4px 0 0; padding: 0; list-style: none; font: 11px/1.6 var(--mono); }
  .snaps li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-top: 1px dashed var(--line); }
  @media (max-width: 520px) {
    .evt { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .data { grid-template-columns: minmax(0, 1fr) auto; padding: 8px 10px; gap: 6px 10px; }
    .vals { font-size: 11px; line-height: 1.4; }
    .viz { flex-direction: row; }
    .compass, .pad { width: 50px; height: 50px; }
    .snaps li:nth-child(n+2) { display: none; }
  }

  /* 7. gyroscope */
  .gyro { grid-template-columns: minmax(0, 1fr) minmax(0, 220px); }
  .phonebox { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 12px; min-height: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
  .phonebox .ttl { font-size: 12.5px; font-weight: 600; }
  .pstage { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; perspective: 420px; }
  .phone { width: 58px; height: 112px; border-radius: 13px; border: 3px solid #4a5160; background: linear-gradient(160deg, #2c3a5c, #121620 70%);
    box-shadow: 0 14px 26px rgba(0, 0, 0, 0.5); display: grid; place-items: center; }
  .phone i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--accent); opacity: .8; }
  .pread { font: 500 12px/1.4 var(--mono); color: var(--muted); }
  .pread b { color: var(--accent); }
  .psrc { font-size: 11.5px; color: var(--muted); text-align: center; }
  .psrc.real { color: var(--c4); }
  @media (max-width: 520px) {
    .gyro { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 118px; }
    .phonebox { display: grid; grid-template-columns: 90px minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 10px; align-items: center; justify-items: start; padding: 8px 10px; }
    .phonebox .pstage { grid-row: 1 / span 3; height: 100%; }
    .phone { width: 44px; height: 84px; border-radius: 10px; }
    .phone i { width: 18px; height: 18px; }
    .psrc { text-align: left; }
  }

  /* 8. stress */
  .st-box { position: absolute; inset: 8px 8px 8px 350px; }
  @media (max-width: 760px) { .st-box { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 16px) 8px; } }
  .wall { position: absolute; inset: 0; }
  .tile { position: absolute; border-radius: 8%; background: center / cover no-repeat; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.4); }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/vanilla-tilt@1.8.1/dist/vanilla-tilt.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// vanilla-tilt.js showcase: eight scenes from the signature photo cards to a many-cards stress ramp.
const h = Showcase.h;

// Card markup. The .slot wrapper is never transformed, so its rect is a stable target for the virtual pointer.
const card = ({ img, title, sub = "", badge = "", tone = "var(--c1)", ink = "#111", cap = "", note = "", extra = "" }) => `
  <div class="item">
    <div class="slot"><div class="tc">
      <div class="photo"><img src="_shared/img/photo-${img}.jpg" alt="${title}"></div>
      ${extra}
      ${badge ? `<div class="badge" style="background:${tone};color:${ink}">${badge}</div>` : ""}
      <div class="txt"><b>${title}</b>${sub ? `<span>${sub}</span>` : ""}</div>
    </div></div>
    ${cap || note ? `<div class="cap"><code>${cap}</code>${note ? `<span class="note">${note}</span>` : `<span class="live">X 0.0°　Y 0.0°</span>`}</div>` : ""}
  </div>`;
const deck = (items, cls = "") => `<div class="fit"><div class="cards ${cls}">${items.map(card).join("")}</div></div>`;

// Init vanilla-tilt on elements; instances are destroyed with the scene (or earlier through kill()).
const kill = (list) => list.forEach((el) => el.vanillaTilt && el.vanillaTilt.destroy());
function tilt(ctx, els, opts) {
  const list = [].concat(els);
  VanillaTilt.init(list, opts);
  ctx.onCleanup(() => kill(list));
  return list;
}
// Mirror tiltChange into the caption under a card.
function readout(ctx, el) {
  const out = el.closest(".item").querySelector(".live");
  if (out) ctx.on(el, "tiltChange", (e) => { out.textContent = `X ${(+e.detail.tiltX).toFixed(1)}°　Y ${(+e.detail.tiltY).toFixed(1)}°`; });
}
// Point (u, v) in 0..1 over an element's box, in client coordinates.
const over = (el, u, v) => { const r = el.getBoundingClientRect(); return [r.left + u * r.width, r.top + v * r.height]; };

// Virtual pointer: dispatches real MouseEvents (mouseenter / mousemove / mouseleave) to vanilla-tilt so the
// cards move before anyone touches them. Each pointer: { at(ms) -> [x, y] | null, targets: [{ el, area }], fallback }.
// Any real pointer movement inside the scene hands control back; the autopilot resumes after 5 s of stillness.
function pilot(ctx, pointers) {
  const ghosts = pointers.map(() => ctx.el.appendChild(h("i", { class: "ghost" })));
  const chip = ctx.el.appendChild(h("div", { class: "pilot", text: "自動示範中，移動滑鼠即可接手" }));
  const inside = pointers.map(() => new Set());
  let auto = true, t0 = 0, resume = 0, sensor = false;
  const fire = (el, type, x, y) => el.dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, bubbles: type === "mousemove" }));
  const lift = (i) => {
    inside[i].forEach((el) => fire(el, "mouseleave", 0, 0));
    inside[i].clear();
    ghosts[i].classList.remove("on");
  };
  ctx.raf((t) => {
    if (!auto) return;
    t0 = t0 || t;
    const base = ctx.el.getBoundingClientRect();
    pointers.forEach((p, i) => {
      const pos = p.at(t - t0);
      if (!pos) return lift(i);
      const [x, y] = pos;
      let hit = null;
      for (const { el, area } of p.targets) {
        const r = (area || el).getBoundingClientRect();
        const isOver = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        if (isOver && !inside[i].has(el)) { inside[i].add(el); fire(el, "mouseenter", x, y); }
        if (!isOver && inside[i].has(el)) { inside[i].delete(el); fire(el, "mouseleave", x, y); }
        if (isOver && !hit) hit = el;
      }
      const into = hit || p.fallback;
      if (into) fire(into, "mousemove", x, y);
      ghosts[i].classList.add("on");
      ghosts[i].style.transform = `translate(${x - base.left}px, ${y - base.top}px)`;
    });
  });
  const handBack = (e) => {
    if (!e.isTrusted) return;
    if (auto) { auto = false; pointers.forEach((_, i) => lift(i)); chip.classList.add("off"); }
    clearTimeout(resume);
    resume = setTimeout(() => { if (ctx.active && !sensor) { auto = true; t0 = 0; chip.classList.remove("off"); } }, 5000);
  };
  ctx.onCleanup(() => clearTimeout(resume));
  ctx.on(ctx.el, "pointermove", handBack);
  ctx.on(ctx.el, "pointerdown", handBack);
  // A phone with a real gyroscope drives the cards itself; stop simulating the mouse for good.
  ctx.on(window, "deviceorientation", (e) => { if (e.isTrusted && e.gamma != null) { sensor = true; handBack(e); } });
}
// One pointer per card, all following the same relative path, so settings can be compared side by side.
const twins = (cards, path) => cards.map((el) => {
  const slot = el.closest(".slot");
  return { targets: [{ el, area: slot }], at: (ms) => { const p = path(ms); return p && over(slot, p[0], p[1]); } };
});

Showcase.run({ scenes: [
  {
    id: "cards", title: "照片卡",
    api: 'VanillaTilt.init(el, { max, glare, scale, "full-page-listening" })',
    desc: "三張卡各開一組設定：反光加放大、反向傾斜、整頁監聽；標籤與文字用 translateZ 浮在卡面上方，startX／startY 讓卡片靜止時也帶點角度。",
    hint: "滑鼠掃過卡片・右卡在頁面任何位置都會跟著轉・拖曳滑桿改最大傾角",
    mount(ctx) {
      ctx.html(`<div class="board">${deck([
        { img: 5, title: "瀑布與彩虹", sub: "反光＋放大", badge: "GLARE", tone: "var(--c1)", cap: "glare・scale: 1.06" },
        { img: 6, title: "深海水母", sub: "反向傾斜，文字浮起", badge: "REVERSE", tone: "var(--c2)", cap: "reverse・translateZ" },
        { img: 1, title: "挪威峽灣", sub: "整頁都能帶動", badge: "FULL PAGE", tone: "var(--c3)", ink: "#fff", cap: "full-page-listening" },
      ])}</div>`);
      const els = ctx.$$(".tc");
      const SETUPS = [
        { glare: true, "max-glare": 0.5, scale: 1.06, startX: -10, startY: 8 },
        { reverse: true, glare: true, "max-glare": 0.25, startX: 8, startY: -6 },
        { "full-page-listening": true, glare: true, "max-glare": 0.35, startX: 12, startY: 10 },
      ];
      els.forEach((el) => readout(ctx, el));
      const init = (max) => els.forEach((el, i) => { kill([el]); tilt(ctx, el, { max, speed: 500, perspective: 900, ...SETUPS[i] }); });
      init(18);
      ctx.slider("最大傾角", { min: 5, max: 35, step: 1, value: 18, format: (v) => `${v}°` }, init);
      // A single virtual mouse sweeps across the row, like a visitor skimming the cards.
      const row = ctx.$(".cards");
      pilot(ctx, [{
        targets: els.map((el) => ({ el, area: el.closest(".slot") })), fallback: ctx.$(".board"),
        at: (ms) => over(row, 0.5 + 0.47 * Math.sin(ms * 0.0005 - 1.6), 0.4 + 0.3 * Math.sin(ms * 0.0019)),
      }]);
    },
  },
  {
    id: "params", title: "參數對比",
    api: "VanillaTilt.init(el, { max | perspective | scale | speed })",
    desc: "三張卡收到完全相同的指標路徑，只差一個參數。speed 只影響移入與移出時的過渡時間，所以這一組的指標改成反覆進出卡片角落。",
    hint: "上方切換參數組・移入滑鼠可自己試",
    mount(ctx) {
      const GROUPS = {
        max: { base: { perspective: 1000 }, key: "max", vals: [5, 15, 35] },
        perspective: { base: { max: 30 }, key: "perspective", vals: [300, 1000, 3000] },
        scale: { base: { max: 15 }, key: "scale", vals: [1, 1.08, 1.16] },
        speed: { base: { max: 25 }, key: "speed", vals: [100, 600, 1600] },
      };
      ctx.html(`<div class="board">${deck([
        { img: 2, title: "紅岩峽谷", badge: "A", tone: "var(--c5)", cap: "max: 5" },
        { img: 3, title: "綠色山谷公路", badge: "B", tone: "var(--c4)", cap: "max: 15" },
        { img: 8, title: "海象群", badge: "C", tone: "var(--c2)", cap: "max: 35" },
      ])}</div>`);
      const els = ctx.$$(".tc");
      els.forEach((el) => readout(ctx, el));
      let mode = "max";
      const apply = (name) => {
        mode = name;
        const g = GROUPS[name];
        els.forEach((el, i) => {
          kill([el]);
          tilt(ctx, el, { speed: 400, ...g.base, [g.key]: g.vals[i] });
          el.closest(".item").querySelector("code").textContent = `${g.key}: ${g.vals[i]}`;
        });
      };
      apply("max");
      ctx.group(Object.keys(GROUPS), 0, (i, name) => apply(name));
      pilot(ctx, twins(els, (ms) => {
        if (mode !== "speed") return [0.5 + 0.42 * Math.cos(ms * 0.0016), 0.5 + 0.42 * Math.sin(ms * 0.0021)];
        // enter at a corner for 1.8 s, leave for 1.8 s, alternate corners
        const k = Math.floor(ms / 3600);
        if (ms % 3600 > 1800) return null;
        return k % 2 ? [0.1, 0.9] : [0.9, 0.12];
      }));
    },
  },
  {
    id: "glare", title: "反光 glare",
    api: '{ glare: true, "max-glare": 0.9, "glare-prerender": true }',
    desc: "glare 在卡面加一層跟著指標方向旋轉的漸層，亮度由指標的垂直位置乘上 max-glare 決定；glare-prerender 改用自己寫好的 .js-tilt-glare 結構，這裡換成全像彩虹層。",
    hint: "指標越靠近卡片下緣反光越亮・滑桿調整中間那張的 max-glare",
    mount(ctx) {
      const holo = `<div class="js-tilt-glare holo"><div class="js-tilt-glare-inner"></div></div><div class="frame"></div>`;
      ctx.html(`<div class="board">${deck([
        { img: 7, title: "母獅特寫", sub: "淡淡的反光", badge: "0.2", tone: "var(--c5)", cap: "max-glare: 0.2" },
        { img: 8, title: "海象群", sub: "強烈的反光", badge: "0.9", tone: "var(--c2)", cap: "max-glare: 0.9" },
        { img: 4, title: "披毯巴哥犬", sub: "收藏卡・全像層", badge: "SSR", tone: "var(--c6)", ink: "#fff", cap: "glare-prerender", extra: holo },
      ])}</div>`);
      const [a, b, c] = ctx.$$(".tc");
      [a, b, c].forEach((el) => readout(ctx, el));
      const base = { max: 18, perspective: 900, speed: 500, glare: true };
      tilt(ctx, a, { ...base, "max-glare": 0.2 });
      const setB = (v) => { kill([b]); tilt(ctx, b, { ...base, "max-glare": v }); b.closest(".item").querySelector("code").textContent = `max-glare: ${v.toFixed(2)}`; };
      setB(0.9);
      tilt(ctx, c, { ...base, "max-glare": 0.85, "glare-prerender": true });
      ctx.slider("max-glare", { min: 0, max: 1, step: 0.05, value: 0.9 }, setB);
      pilot(ctx, twins([a, b, c], (ms) => [0.5 + 0.4 * Math.sin(ms * 0.0013), 0.62 + 0.32 * Math.sin(ms * 0.0009 + 0.8)]));
    },
  },
  {
    id: "axis", title: "反向與軸鎖定",
    api: '{ reverse: true } ・ { axis: "x" } ・ { axis: "y" }',
    desc: "四張卡走同一個圓形路徑：預設是指標那一側往下壓，reverse 反過來翹起；axis 只保留一個方向的旋轉。黃色圓圈就是模擬指標的位置。",
    hint: "對照黃圈位置與卡片傾斜方向",
    mount(ctx) {
      ctx.html(`<div class="board">${deck([
        { img: 7, title: "預設", badge: "DEFAULT", tone: "var(--c1)", cap: "reverse: false", note: "指標那側往下壓" },
        { img: 6, title: "反向", badge: "REVERSE", tone: "var(--c3)", ink: "#fff", cap: "reverse: true", note: "指標那側翹起來" },
        { img: 2, title: "只左右擺", badge: "X", tone: "var(--c2)", cap: 'axis: "x"', note: "只隨左右移動旋轉" },
        { img: 5, title: "只上下擺", badge: "Y", tone: "var(--c4)", cap: 'axis: "y"', note: "只隨上下移動旋轉" },
      ], "four")}</div>`);
      const els = ctx.$$(".tc");
      const base = { max: 25, perspective: 700, speed: 400 };
      tilt(ctx, els[0], base);
      tilt(ctx, els[1], { ...base, reverse: true });
      tilt(ctx, els[2], { ...base, axis: "x" });
      tilt(ctx, els[3], { ...base, axis: "y" });
      pilot(ctx, twins(els, (ms) => [0.5 + 0.4 * Math.cos(ms * 0.0015), 0.5 + 0.4 * Math.sin(ms * 0.0015)]));
    },
  },
  {
    id: "reset", title: "重設行為",
    api: '{ startX, startY, reset, "reset-to-start" } + el.vanillaTilt.reset()',
    desc: "指標每隔幾秒離開卡片：預設回到 startX／startY 的起始角度，reset-to-start: false 回到水平，reset: false 停在離開前的角度；按鈕直接呼叫實例的 reset()。",
    hint: "等指標離開時比較三張卡・按「呼叫 reset()」",
    mount(ctx) {
      ctx.html(`<div class="board rows"><div class="state">startX: -12・startY: 10・指標：<b>…</b></div>${deck([
        { img: 1, title: "回到起始角度", badge: "預設", tone: "var(--c1)", cap: "reset: true" },
        { img: 3, title: "回到水平", badge: "TO 0", tone: "var(--c2)", cap: '"reset-to-start": false' },
        { img: 5, title: "停在原處", badge: "STAY", tone: "var(--c3)", ink: "#fff", cap: "reset: false" },
      ])}</div>`);
      const els = ctx.$$(".tc");
      els.forEach((el) => readout(ctx, el));
      const base = { max: 22, perspective: 900, speed: 700, startX: -12, startY: 10 };
      tilt(ctx, els[0], base);
      tilt(ctx, els[1], { ...base, "reset-to-start": false });
      tilt(ctx, els[2], { ...base, reset: false });
      ctx.button("呼叫 reset()", () => els.forEach((el) => el.vanillaTilt.reset()), { primary: true });
      const state = ctx.$(".state b");
      let last = "";
      pilot(ctx, twins(els, (ms) => {
        const inCard = ms % 3600 < 2000;
        const text = inCard ? "在卡片上" : "已離開卡片";
        if (text !== last) state.textContent = last = text;
        return inCard ? [0.5 + 0.38 * Math.sin(ms * 0.003), 0.5 + 0.38 * Math.cos(ms * 0.0023)] : null;
      }));
    },
  },
  {
    id: "events", title: "事件與 getValues",
    api: 'el.addEventListener("tiltChange", (e) => e.detail) ・ el.vanillaTilt.getValues()',
    desc: "每次更新都會派發 tiltChange，detail 含 tiltX、tiltY、percentageX、percentageY、angle；mouse-event-element 讓整塊虛線區都能帶動卡片，指標超出卡片範圍時百分比會被夾在 0～100。",
    hint: "在虛線區任意位置移動滑鼠・按「呼叫 getValues()」記下數值",
    mount(ctx) {
      const KEYS = ["tiltX", "tiltY", "percentageX", "percentageY", "angle"];
      ctx.html(`<div class="board evt">
        <div class="zone"><span class="ztag">mouse-event-element</span>${deck([{ img: 3, title: "綠色山谷公路", sub: "整塊虛線區都能帶動", badge: "ZONE", tone: "var(--c4)" }], "one")}</div>
        <div class="panel data">
          <div class="vals">${KEYS.map((k) => `<small>${k}</small><b data-k="${k}">…</b>`).join("")}</div>
          <div class="viz"><div class="compass" title="angle"><i></i></div><div class="pad" title="percentageX／percentageY"><i></i></div></div>
          <div class="rate"><small>tiltChange 事件</small><b>0</b><small>次／秒</small></div>
          <div class="snaps"><small>getValues() 快照（最新在上）</small><ol></ol></div>
        </div></div>`);
      const el = ctx.$(".tc"), zone = ctx.$(".zone");
      const cells = Object.fromEntries(KEYS.map((k) => [k, ctx.$(`[data-k="${k}"]`)]));
      const needle = ctx.$(".compass i"), dot = ctx.$(".pad i"), rateEl = ctx.$(".rate b"), list = ctx.$(".snaps ol");
      const deg = (v) => `${(+v).toFixed(1)}°`, pct = (v) => `${v.toFixed(0)}%`;
      let count = 0;
      ctx.on(el, "tiltChange", (e) => {
        const d = e.detail;
        count++;
        cells.tiltX.textContent = deg(d.tiltX);
        cells.tiltY.textContent = deg(d.tiltY);
        cells.percentageX.textContent = pct(d.percentageX);
        cells.percentageY.textContent = pct(d.percentageY);
        cells.angle.textContent = deg(d.angle);
        needle.style.transform = `rotate(${d.angle}deg)`;
        dot.style.left = `calc(7px + (100% - 14px) * ${d.percentageX / 100})`;
        dot.style.top = `calc(7px + (100% - 14px) * ${d.percentageY / 100})`;
      });
      ctx.interval(() => { rateEl.textContent = count; count = 0; }, 1000);
      tilt(ctx, el, { max: 22, perspective: 800, glare: true, "max-glare": 0.35, "mouse-event-element": zone });
      const snap = () => {
        const v = el.vanillaTilt.getValues();
        const time = new Date().toLocaleTimeString("zh-TW", { hour12: false });
        list.prepend(h("li", { text: `${time}　X ${deg(v.tiltX)}　Y ${deg(v.tiltY)}　${pct(v.percentageX)}／${pct(v.percentageY)}` }));
        while (list.children.length > 3) list.lastChild.remove();
      };
      ctx.button("呼叫 getValues()", snap, { primary: true });
      ctx.timeout(snap, 700);
      pilot(ctx, [{
        targets: [{ el: zone }],
        at: (ms) => over(zone, 0.5 + 0.46 * Math.sin(ms * 0.0009), 0.5 + 0.44 * Math.sin(ms * 0.0013 + 0.6)),
      }]);
    },
  },
  {
    id: "gyro", title: "陀螺儀",
    api: "{ gyroscope: true, gyroscopeMinAngleX: -15, gyroscopeMaxAngleX: 15, … }",
    desc: "手機上 vanilla-tilt 監聽 deviceorientation，用前 10 筆資料校正零點，角度範圍越窄越靈敏。桌機沒有感測器，這裡送出模擬的 DeviceOrientationEvent，讓函式庫的陀螺儀程式照常運作。",
    hint: "拖曳右側虛擬手機改變姿態・在手機上會改用真實感測器（iOS 需按鈕授權）",
    mount(ctx) {
      ctx.html(`<div class="board gyro">${deck([
        { img: 6, title: "預設範圍", sub: "±45° 才轉到底", badge: "±45°", tone: "var(--c2)", cap: "gyroscopeMin/MaxAngle ±45" },
        { img: 2, title: "窄範圍", sub: "±15° 就轉到底", badge: "±15°", tone: "var(--c3)", ink: "#fff", cap: "gyroscopeMin/MaxAngle ±15" },
      ], "two")}
        <div class="panel phonebox">
          <div class="pstage"><div class="phone"><i></i></div></div>
          <div class="ttl">虛擬手機</div>
          <div class="pread">beta <b>0°</b>　gamma <b>0°</b></div>
          <div class="psrc">送出模擬 deviceorientation・可拖曳</div>
        </div></div>`);
      const [a, b] = ctx.$$(".tc");
      [a, b].forEach((el) => readout(ctx, el));
      const base = { max: 20, perspective: 900, glare: true, "max-glare": 0.4, gyroscope: true };
      tilt(ctx, a, base);
      tilt(ctx, b, { ...base, gyroscopeMinAngleX: -15, gyroscopeMaxAngleX: 15, gyroscopeMinAngleY: -15, gyroscopeMaxAngleY: 15 });
      const phone = ctx.$(".phone"), pad = ctx.$(".phonebox"), [bOut, gOut] = ctx.$$(".pread b"), src = ctx.$(".psrc");
      const canSim = typeof DeviceOrientationEvent === "function";
      if (!canSim) src.textContent = "此瀏覽器無法建立 DeviceOrientationEvent，只能在手機上用真實感測器";
      let mode = "auto", beta = 0, gamma = 0, frames = 0, back = 0;
      ctx.onCleanup(() => clearTimeout(back));
      const paint = () => {
        phone.style.transform = `rotateX(${-beta}deg) rotateY(${gamma}deg)`;
        bOut.textContent = `${beta.toFixed(0)}°`;
        gOut.textContent = `${gamma.toFixed(0)}°`;
      };
      ctx.raf((t) => {
        if (mode === "real") return paint();
        if (mode === "auto") {
          // the first frames stay level so the library calibrates its zero at rest
          const k = ++frames < 14 ? 0 : 1;
          gamma = k * 30 * Math.sin(t * 0.0011);
          beta = k * 24 * Math.sin(t * 0.0007 + 1);
        }
        if (canSim) window.dispatchEvent(new DeviceOrientationEvent("deviceorientation", { alpha: 0, beta, gamma, absolute: false }));
        paint();
      });
      ctx.on(window, "deviceorientation", (e) => {
        if (!e.isTrusted || e.gamma == null) return;
        mode = "real"; beta = e.beta; gamma = e.gamma;
        src.textContent = "偵測到真實感測器，正在使用手機姿態";
        src.classList.add("real");
      });
      const fromPointer = (e) => {
        const r = ctx.$(".pstage").getBoundingClientRect();
        const clamp = (v) => Math.max(-1, Math.min(1, v));
        gamma = 45 * clamp(((e.clientX - r.left) / r.width) * 2 - 1);
        beta = 45 * clamp(((e.clientY - r.top) / r.height) * 2 - 1);
      };
      ctx.on(pad, "pointerdown", (e) => {
        if (mode === "real") return;
        mode = "drag"; clearTimeout(back);
        pad.setPointerCapture(e.pointerId);
        fromPointer(e);
      });
      ctx.on(pad, "pointermove", (e) => { if (mode === "drag") fromPointer(e); });
      ctx.on(pad, "pointerup", () => {
        if (mode !== "drag") return;
        mode = "hold";
        back = setTimeout(() => { if (mode === "hold") { mode = "auto"; frames = 20; } }, 2500);
      });
      if (canSim && typeof DeviceOrientationEvent.requestPermission === "function") {
        ctx.button("啟用陀螺儀（iOS）", async () => {
          try {
            const res = await DeviceOrientationEvent.requestPermission();
            src.textContent = res === "granted" ? "已授權，傾斜手機試試" : "未取得陀螺儀權限";
          } catch (err) { src.textContent = `無法取得權限：${err.message}`; }
        }, { primary: true });
      }
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "VanillaTilt.init(N 張卡片) + 每張每幀一次 mousemove",
    desc: "讓 N 張卡片同時傾斜：每張每幀都收到一次 mousemove，各自排一次 requestAnimationFrame 寫入 transform 並派發 tiltChange，逐級加量直到掉到 30 FPS 以下。",
    hint: "按「自動加壓」開始・開啟反光後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="st-box"><div class="wall"></div></div>`);
      const wall = ctx.$(".wall");
      let tiles = [], geo = [], n = 0, glare = false, events = 0, rate = 0;
      ctx.on(wall, "tiltChange", () => events++, true); // tiltChange does not bubble; capture still sees it
      ctx.interval(() => { rate = events; events = 0; }, 1000);
      ctx.onCleanup(() => kill(tiles));
      // Pick the column count that gives the largest 3:4 tiles, then place tiles absolutely.
      const place = () => {
        const W = wall.clientWidth, H = wall.clientHeight, o = wall.getBoundingClientRect();
        let best = null;
        for (let c = 1; c <= n; c++) {
          const r = Math.ceil(n / c), cw = Math.min(W / c, (H / r) * 0.75);
          if (!best || cw > best.cw) best = { c, r, cw };
        }
        const { c, r, cw } = best, ch = cw / 0.75, pad = Math.max(1, cw * 0.1);
        const x0 = (W - c * cw) / 2, y0 = (H - r * ch) / 2;
        geo = tiles.map((el, i) => {
          const col = i % c, row = (i / c) | 0;
          const x = x0 + col * cw + pad / 2, y = y0 + row * ch + pad / 2, w = cw - pad, hh = ch - pad;
          el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${hh}px;background-image:url(_shared/img/photo-${(i % 8) + 1}.jpg)`;
          return { x: o.left + x, y: o.top + y, w, h: hh, col, row };
        });
      };
      const build = () => {
        kill(tiles);
        wall.textContent = "";
        tiles = Array.from({ length: n }, () => h("div", { class: "tile" }));
        wall.append(...tiles);
        place();
        VanillaTilt.init(tiles, { max: 25, perspective: 600, speed: 300, reset: false, gyroscope: false, glare, "max-glare": 0.5 });
      };
      ctx.onResize(() => n && build());
      // Every tile gets its own pointer position each frame; phases ripple across the grid.
      ctx.raf((t) => {
        for (let i = 0; i < tiles.length; i++) {
          const g = geo[i];
          const u = 0.5 + 0.5 * Math.sin(t * 0.0021 + g.col * 0.45 + g.row * 0.2);
          const v = 0.5 + 0.5 * Math.cos(t * 0.0017 + g.row * 0.45);
          tiles[i].dispatchEvent(new MouseEvent("mousemove", { clientX: g.x + u * g.w, clientY: g.y + v * g.h }));
        }
      });
      ctx.toggle("反光 glare", false, (v) => { glare = v; build(); });
      ctx.controls.classList.add("bottom");
      ctx.ramp({
        label: "卡片", unit: "張", steps: [16, 32, 64, 128, 256, 512, 1024, 2048],
        minFps: 30,
        apply(count) { n = count; build(); },
        metrics: () => ({ "tiltChange／秒": rate, "反光": glare ? "開" : "關" }),
        note: "每張卡片每幀各自重算角度、寫入 transform 並派發事件，瓶頸在大量 3D 圖層的合成與逐張樣式更新；開啟反光會多一層旋轉漸層與透明度更新。一般網頁只有滑鼠下那一張在動，但若開了 full-page-listening，每次滑鼠移動所有卡片都會一起重算，負擔接近這裡的情況。",
      });
    },
  },
] });
</script>
</body>
</html>
