<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanta.js 示範：一行程式的 3D 首頁背景</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"Vanta.js 官方指定搭配 three.js r134"}</script>
<style>
  #bg { position: fixed; inset: 0; }
  .hero {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
    pointer-events: none; padding: 0 20px; text-shadow: 0 2px 18px rgba(0, 0, 0, .45);
  }
  .hero small { letter-spacing: .32em; font-size: 12px; opacity: .85; }
  .hero h1 { margin: 6px 0 0; font-size: clamp(26px, 6vw, 56px); font-weight: 800; letter-spacing: .06em; }
  .hero p { margin: 10px 0 0; font-size: clamp(13px, 2vw, 16px); opacity: .85; }
  .code {
    position: fixed; right: 12px; bottom: 12px; z-index: 50; font-size: 12px; padding: 6px 10px;
    max-width: calc(100% - 24px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  @media (max-width: 520px) { .code { display: none; } }
</style>
</head>
<body>
<div id="bg"></div>
<div class="hero">
  <small>TAIPEI DESIGN WEEK</small>
  <h1>台北設計週</h1>
  <p>十月・華山文創園區</p>
</div>
<div class="controls" id="fx">
  <button class="btn" data-fx="BIRDS" aria-pressed="true">鳥群</button>
  <button class="btn" data-fx="WAVES">波浪</button>
  <button class="btn" data-fx="FOG">霧</button>
  <button class="btn" data-fx="NET">網格</button>
  <button class="btn" data-fx="GLOBE">地球</button>
</div>
<div class="code panel mono" id="code">VANTA.BIRDS({ el: "#bg" })</div>
<div class="hint">移動滑鼠互動・右上切換背景效果</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.birds.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.waves.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.fog.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.net.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.globe.min.js"></script>
<script>
// Each button destroys the running Vanta effect and starts another on the same element.
const OPTIONS = {
  BIRDS: { backgroundColor: 0x0e1424, color1: 0xf72585, color2: 0xf7df1e, colorMode: "lerpGradient", birdSize: 1.2, quantity: 4, separation: 40 },
  WAVES: { color: 0x0b3a5a, shininess: 45, waveHeight: 18, waveSpeed: 0.9, zoom: 0.9 },
  FOG: { highlightColor: 0xf7df1e, midtoneColor: 0xf72585, lowlightColor: 0x4b2a9c, baseColor: 0x0e1013, blurFactor: 0.6, speed: 1.4, zoom: 0.9 },
  NET: { color: 0x4cc9f0, backgroundColor: 0x0e1013, points: 11, maxDistance: 22, spacing: 17 },
  GLOBE: { color: 0xf7df1e, color2: 0x4cc9f0, backgroundColor: 0x0e1013, size: 1.1 },
};
let effect = null;

function show(name) {
  if (effect) effect.destroy();
  effect = VANTA[name]({
    el: "#bg",
    mouseControls: true,
    touchControls: true,
    gyroControls: false,
    minHeight: 200,
    minWidth: 200,
    scale: 1,
    scaleMobile: 1,
    ...OPTIONS[name],
  });
  document.getElementById("code").textContent = `VANTA.${name}({ el: "#bg" })`;
  document.querySelectorAll("#fx .btn").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.fx === name)));
}

document.getElementById("fx").addEventListener("click", (e) => {
  const b = e.target.closest("[data-fx]");
  if (b) show(b.dataset.fx);
});
show("BIRDS");
</script>
</body>
</html>
