<style>

<body>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Vanta.js 0.5.24 showcase: eight scenes, from the original hero gallery to a NET density stress ramp.
const VANTA_CDN = "https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/";
const P5_URL = "https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js";
const P5_EFFECTS = ["TOPOLOGY", "TRUNK"];
const fxUrl = (name) => `${VANTA_CDN}vanta.${name.toLowerCase()}.min.js`;
// p5-based effects read window.p5 when their script runs, so p5 must load first.
const loadFx = (ctx, name) => ctx.load(P5_EFFECTS.includes(name) ? [P5_URL, fxUrl(name)] : fxUrl(name));
const BASE = { mouseControls: true, touchControls: true, gyroControls: false, minWidth: 60, minHeight: 60, scale: 1, scaleMobile: 1 };

const hex = (n) => "0x" + n.toString(16).padStart(6, "0");
const val = (k, v) => (typeof v === "number" ? (/color/i.test(k) ? hex(v) : String(+v.toFixed(2))) : JSON.stringify(v));
const fmtOpts = (o) => Object.entries(o).map(([k, v]) => `${k}: ${val(k, v)}`).join(", ");
const pick = (o, keys) => Object.fromEntries(keys.map((k) => [k, o[k]]));

// effect.destroy() removes the canvas but leaves the WebGL context alive, so release it explicitly.
// Every Vanta instance creates a three.js renderer (even p5 effects, when THREE is on window).
function kill(effect) {
  if (!effect) return;
  const r = effect.renderer;
  effect.destroy();
  if (r) { r.dispose(); r.forceContextLoss(); }
}
// restart() drops the scene graph without disposing GPU buffers; free them first.
function restartClean(effect) {
  if (effect.scene) effect.scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  effect.restart();
}
// One live effect per slot: swap() replaces it, the scene cleanup kills the last one.
function slot(ctx, { follow = true } = {}) {
  let cur = null, ticket = 0;
  ctx.onCleanup(() => { ticket++; kill(cur); cur = null; });
  if (follow) ctx.onResize(() => cur && cur.resize());
  return {
    get fx() { return cur; },
    async swap(name, el, opts = {}) {
      const my = ++ticket;
      await loadFx(ctx, name);
      if (!ctx.active || my !== ticket) return null;
      kill(cur);
      cur = VANTA[name]({ ...BASE, ...opts, el });
      return cur;
    },
  };
}

const HERO = {
  BIRDS: { label: "鳥群", keys: ["quantity", "colorMode"], opts: { backgroundColor: 0x0e1424, color1: 0xf72585, color2: 0xf7df1e, colorMode: "lerpGradient", birdSize: 1.2, quantity: 4, separation: 40 } },
  WAVES: { label: "波浪", keys: ["waveHeight", "shininess"], opts: { color: 0x0b3a5a, shininess: 45, waveHeight: 18, waveSpeed: 0.9, zoom: 0.9 } },
  FOG: { label: "霧", keys: ["highlightColor", "blurFactor"], opts: { highlightColor: 0xf7df1e, midtoneColor: 0xf72585, lowlightColor: 0x4b2a9c, baseColor: 0x0e1013, blurFactor: 0.6, speed: 1.4, zoom: 0.9 } },
  NET: { label: "網格", keys: ["points", "maxDistance"], opts: { color: 0x4cc9f0, backgroundColor: 0x0e1013, points: 11, maxDistance: 22, spacing: 17 } },
  GLOBE: { label: "地球", keys: ["color", "size"], opts: { color: 0xf7df1e, color2: 0x4cc9f0, backgroundColor: 0x0e1013, size: 1.1 } },
  HALO: { label: "光環", keys: ["size", "amplitudeFactor"], opts: { baseColor: 0x6a3df0, backgroundColor: 0x0e1013, size: 1.4, amplitudeFactor: 1.3 } },
};
const WAVE_COLORS = [0x0b3a5a, 0x3a1f6b, 0x0f5a48, 0x6b2412];
const NET_COLORS = [0x4cc9f0, 0xf7df1e, 0xf72585];
const SKIES = [
  { skyColor: 0x68b8d7, cloudColor: 0xadc1de, cloudShadowColor: 0x183550, sunColor: 0xff9919, sunGlareColor: 0xff6633, sunlightColor: 0xff9933 },
  { skyColor: 0xd9776b, cloudColor: 0xf2b8a2, cloudShadowColor: 0x3a1c4a, sunColor: 0xffb347, sunGlareColor: 0xff6a3d, sunlightColor: 0xffa94d },
  { skyColor: 0x0b1a3a, cloudColor: 0x3b4a6b, cloudShadowColor: 0x05070f, sunColor: 0x9d8cff, sunGlareColor: 0x4cc9f0, sunlightColor: 0x6c7bd9 },
];
const P5_COLORS = [0x9d8cff, 0xf7df1e, 0x4cc9f0];

Showcase.run({ scenes: [
  {
    id: "hero", title: "主視覺畫廊",
    api: "VANTA.BIRDS({ el, ...options })・effect.destroy()",
    desc: "原本的設計週主視覺：同一個容器輪流掛上六種 three.js 效果，標題是容器的子元素，自動浮在背景之上。切換時舊實例先 destroy()，再釋放 WebGL context。",
    hint: "點上方按鈕切換效果・移動滑鼠，鏡頭會跟著轉",
    async mount(ctx) {
      ctx.html(`<div class="vbox hero"><div class="hero-txt"><small>TAIPEI DESIGN WEEK</small><h1>台北設計週</h1><p>十月・華山文創園區</p></div></div><div class="tag"></div>`);
      const box = ctx.$(".vbox"), tag = ctx.$(".tag");
      const s = slot(ctx);
      const names = Object.keys(HERO);
      let made = 0;
      async function show(name) {
        const { opts, keys } = HERO[name];
        if (!(await s.swap(name, box, opts))) return;
        made++;
        tag.innerHTML = `<code>VANTA.${name}({ el, ${fmtOpts(pick(opts, keys))} })</code><br><span class="muted">已建立 <b>${made}</b> 個實例，畫面上永遠只留一個 WebGL context</span>`;
      }
      ctx.group(names.map((n) => HERO[n].label), 0, (i) => show(names[i]));
      await show(names[0]);
    },
  },
  {
    id: "setoptions", title: "即時調參數",
    api: "effect.setOptions({ waveHeight, waveSpeed, shininess, zoom, color })",
    desc: "WAVES 每一格都重新讀取 options，所以 setOptions() 改完下一格就生效，不必重建實例，也不會閃爍。",
    hint: "拖動滑桿或換顏色",
    async mount(ctx) {
      ctx.html(`<div class="vbox"></div><div class="tag"></div>`);
      const box = ctx.$(".vbox"), tag = ctx.$(".tag");
      const s = slot(ctx);
      const init = { color: WAVE_COLORS[0], shininess: 45, waveHeight: 18, waveSpeed: 0.9, zoom: 0.9 };
      let calls = 0;
      const paint = (o) => {
        tag.innerHTML = o
          ? `<code>effect.setOptions({ ${fmtOpts(o)} })</code><br><span class="muted">第 <b>${calls}</b> 次呼叫，實例沒有重建</span>`
          : `<code>VANTA.WAVES({ el, ${fmtOpts(init)} })</code>`;
      };
      const set = (o) => { if (!s.fx) return; s.fx.setOptions(o); calls++; paint(o); };
      ctx.group(["深海", "夜紫", "翡翠", "熔岩"], 0, (i) => set({ color: WAVE_COLORS[i] }));
      ctx.slider("波高", { min: 0, max: 40, step: 1, value: init.waveHeight }, (v) => set({ waveHeight: v }));
      ctx.slider("速度", { min: 0, max: 2, step: 0.05, value: init.waveSpeed }, (v) => set({ waveSpeed: v }));
      ctx.slider("光澤", { min: 0, max: 150, step: 1, value: init.shininess }, (v) => set({ shininess: v }));
      ctx.slider("鏡頭", { min: 0.65, max: 1.75, step: 0.05, value: init.zoom }, (v) => set({ zoom: v }));
      await s.swap("WAVES", box, init);
      paint(null);
    },
  },
  {
    id: "restart", title: "重建與即時參數",
    api: "effect.setOptions({ points }) + effect.restart()",
    desc: "NET 的 maxDistance 與 color 可以即時改；points、spacing、showDots 只在初始化時讀取，必須 restart() 重建整個網格。左下角顯示重建次數與耗時。",
    hint: "拖「點數」或「間距」會觸發 restart・拖「連線距離」即時生效",
    async mount(ctx) {
      ctx.html(`<div class="vbox"></div><div class="tag"></div>`);
      const box = ctx.$(".vbox"), tag = ctx.$(".tag");
      const s = slot(ctx);
      const st = { points: 10, spacing: 16, maxDistance: 22, showDots: true, color: NET_COLORS[0], backgroundColor: 0x0e1013 };
      let restarts = 0, lastMs = 0, last = "", pending = 0;
      const paint = () => {
        const fx = s.fx;
        if (!fx || !fx.points) return;
        const lines = fx.linesMesh ? fx.linesMesh.geometry.drawRange.count / 2 : 0;
        tag.innerHTML = `即時：<code>maxDistance</code>、<code>color</code>　需 <code>restart()</code>：<code>points</code>、<code>spacing</code>、<code>showDots</code><br>`
          + `節點 <b>${Showcase.fmt(fx.points.length)}</b>・連線 <b>${Showcase.fmt(lines)}</b>・重建 <b>${restarts}</b> 次${restarts ? `，上次 <b>${lastMs.toFixed(1)}</b> ms` : ""}`
          + (last ? `<br><span class="muted">${last}</span>` : "");
      };
      // Debounced: slider input fires on every pixel of drag.
      const rebuild = (o) => {
        Object.assign(st, o);
        clearTimeout(pending);
        pending = ctx.timeout(() => {
          if (!s.fx) return;
          // NET.setOptions({ color }) recolours node materials, which do not exist while showDots is off.
          const { color, ...rest } = o;
          s.fx.setOptions(rest);
          if (color != null) s.fx.options.color = color;
          const t0 = performance.now();
          restartClean(s.fx);
          lastMs = performance.now() - t0;
          restarts++;
          last = `setOptions({ ${fmtOpts(o)} }) 後 restart()`;
          paint();
        }, 160);
      };
      const live = (o) => {
        Object.assign(st, o);
        if (!s.fx) return;
        s.fx.setOptions(o);
        last = `setOptions({ ${fmtOpts(o)} })，下一格生效`;
        paint();
      };
      ctx.slider("點數", { min: 4, max: 16, step: 1, value: st.points }, (v) => rebuild({ points: v }));
      ctx.slider("間距", { min: 10, max: 20, step: 1, value: st.spacing }, (v) => rebuild({ spacing: v }));
      ctx.slider("連線距離", { min: 10, max: 40, step: 1, value: st.maxDistance }, (v) => live({ maxDistance: v }));
      ctx.toggle("節點", st.showDots, (v) => rebuild({ showDots: v }));
      // NET.setOptions recolours node meshes; with showDots off there are none, so fall back to restart().
      ctx.group(["青", "黃", "桃紅"], 0, (i) => (st.showDots ? live : rebuild)({ color: NET_COLORS[i] }));
      await s.swap("NET", box, { ...st });
      paint();
      ctx.interval(paint, 500);
    },
  },
  {
    id: "mouse", title: "滑鼠互動",
    api: "VANTA.HALO({ mouseControls, touchControls, mouseEase })",
    desc: "Vanta 監聽 window 的 mousemove 與 touchmove，換算成容器內座標交給效果。mouseControls 在建構時決定，切換要重建；mouseEase 可即時開關。「自動導覽」用程式派送 mousemove 事件模擬游標。",
    hint: "移動滑鼠會接手控制・關掉「指標控制」再看自動導覽",
    async mount(ctx) {
      ctx.html(`<div class="vbox"></div><div class="cursor"></div><div class="tag"></div>`);
      const box = ctx.$(".vbox"), tag = ctx.$(".tag"), dot = ctx.$(".cursor");
      const s = slot(ctx);
      const st = { pointer: true, ease: true, auto: true, size: 1.3 };
      const opts = () => ({ baseColor: 0x6a3df0, backgroundColor: 0x0e1013, amplitudeFactor: 1.6, size: st.size, mouseControls: st.pointer, touchControls: st.pointer, mouseEase: st.ease });
      const paint = () => {
        dot.classList.toggle("off", !st.pointer);
        tag.innerHTML = `<code>mouseControls: ${st.pointer}, mouseEase: ${st.ease}</code><br>`
          + (st.pointer ? "游標事件由效果接收" : `<span class="muted">建構時沒有註冊監聽器，游標事件被忽略</span>`);
      };
      ctx.toggle("指標控制", st.pointer, async (v) => { st.pointer = v; await s.swap("HALO", box, opts()); paint(); });
      ctx.toggle("緩動", st.ease, (v) => { st.ease = v; if (s.fx) s.fx.setOptions({ mouseEase: v }); paint(); });
      ctx.toggle("自動導覽", st.auto, (v) => { st.auto = v; });
      ctx.slider("光環", { min: 0.3, max: 3, step: 0.1, value: st.size }, (v) => { st.size = v; if (s.fx) s.fx.setOptions({ size: v }); });

      let userAt = -1e9;
      const place = (x, y) => {
        const r = ctx.el.getBoundingClientRect();
        dot.style.transform = `translate(${x - r.left}px, ${y - r.top}px)`;
      };
      ctx.on(window, "mousemove", (e) => { if (e.isTrusted) { userAt = performance.now(); place(e.clientX, e.clientY); } });
      ctx.raf((t) => {
        if (!st.auto || performance.now() - userAt < 2500) return;
        const r = box.getBoundingClientRect();
        const x = r.left + r.width * (0.5 + 0.34 * Math.sin(t * 0.0009));
        const y = r.top + r.height * (0.5 + 0.3 * Math.sin(t * 0.0014 + 1));
        place(x, y);
        window.dispatchEvent(new MouseEvent("mousemove", { clientX: x, clientY: y }));
      });
      await s.swap("HALO", box, opts());
      paint();
    },
  },
  {
    id: "sections", title: "區塊背景",
    api: "VANTA.CELLS({ el: card }) ×3・effect.resize()",
    desc: "任何元素都能當 el：三張活動卡各掛一個效果，卡片文字自動浮在上層。Vanta 只監聽視窗縮放，容器自己變寬變窄時要呼叫 resize()，關掉後畫布會停在舊尺寸，露出底下的斜紋。",
    hint: "拖動「版面寬度」・關掉「自動 resize()」比較",
    async mount(ctx) {
      ctx.html(`<div class="board"><div class="grid">
        <article class="card"><div class="txt"><small>WORKSHOP</small><b>AI 工作坊</b><span>週六 14:00・松山文創園區</span></div></article>
        <article class="card"><div class="txt"><small>CONCERT</small><b>大稻埕夏夜音樂會</b><span>8/16 19:30・大稻埕碼頭</span></div></article>
        <article class="card"><div class="txt"><small>NIGHT RUN</small><b>河濱夜跑</b><span>每週三 20:00・大佳河濱公園</span></div></article>
      </div></div><div class="tag"></div>`);
      const grid = ctx.$(".grid"), tag = ctx.$(".tag"), cards = ctx.$$(".card");
      const defs = [
        ["CELLS", { color1: 0x3a0ca3, color2: 0xf7df1e, size: 2.2, speed: 1.2 }],
        ["RINGS", { backgroundColor: 0x101420, color: 0xf72585 }],
        ["DOTS", { backgroundColor: 0x0e1013, color: 0x4cc9f0, color2: 0x9d8cff, size: 2.6, spacing: 28 }],
      ];
      const slots = defs.map(() => slot(ctx, { follow: false }));
      let auto = true, calls = 0;
      const paint = () => {
        tag.innerHTML = `3 個獨立實例：<code>CELLS</code>、<code>RINGS</code>、<code>DOTS</code><br>`
          + (auto ? `<code>resize()</code> 已呼叫 <b>${calls}</b> 次` : `<span class="muted">自動 resize() 已關閉，畫布維持舊尺寸</span>`);
      };
      ctx.slider("版面寬度", { min: 40, max: 100, step: 5, value: 100, format: (v) => `${v}%` }, (v) => grid.style.setProperty("--w", `${v}%`));
      ctx.toggle("自動 resize()", auto, (v) => {
        auto = v;
        if (v) slots.forEach((sl) => { if (sl.fx) { sl.fx.resize(); calls++; } });
        paint();
      });
      const ro = new ResizeObserver((entries) => {
        if (!auto) return;
        for (const en of entries) {
          const sl = slots[cards.indexOf(en.target)];
          if (sl && sl.fx) { sl.fx.resize(); calls++; }
        }
        paint();
      });
      ctx.onCleanup(() => ro.disconnect());
      await Promise.all(defs.map(([name, o], i) => slots[i].swap(name, cards[i], o)));
      cards.forEach((c) => ro.observe(c));
      paint();
    },
  },
  {
    id: "scale", title: "解析度取捨",
    api: "effect.setOptions({ scale, scaleMobile }) + effect.resize()",
    desc: "CLOUDS 是逐像素光線步進的著色器，scale 決定幾個螢幕像素算一次：數字越大越模糊、越省 GPU。視窗寬度小於 600 px 時 Vanta 改讀 scaleMobile，這裡兩個一起設定。",
    hint: "拖動 scale，看 FPS 與實際繪製解析度・切換天色",
    async mount(ctx) {
      ctx.html(`<div class="vbox"></div>`);
      const box = ctx.$(".vbox");
      const s = slot(ctx);
      let scale = 3;
      const drawn = () => {
        const c = s.fx && s.fx.renderer && s.fx.renderer.domElement;
        return c ? `${c.width}×${c.height}` : "…";
      };
      ctx.fps({ position: "right bottom", extra: () => ({ scale, 繪製: drawn() }) });
      ctx.slider("scale", { min: 1, max: 8, step: 1, value: scale }, (v) => {
        scale = v;
        if (!s.fx) return;
        s.fx.setOptions({ scale: v, scaleMobile: v });
        s.fx.resize();
      });
      ctx.group(["晴空", "黃昏", "夜空"], 0, (i) => { if (s.fx) s.fx.setOptions(SKIES[i]); });
      await s.swap("CLOUDS", box, { ...SKIES[0], backgroundColor: 0xffffff, speed: 1, scale, scaleMobile: scale });
    },
  },
  {
    id: "p5", title: "p5 版效果",
    api: "VANTA.TRUNK({ el, p5, chaos, spacing })・VANTA.TOPOLOGY({ el, p5 })",
    desc: "TOPOLOGY 與 TRUNK 改用 p5.js 的 2D Canvas 繪製，需先載入 p5.js（也可用 p5 選項傳入）。TRUNK 的 chaos、spacing 每格讀取；它的筆觸色只在 setup 設定，改顏色要 restart()。",
    hint: "切換兩種效果・調整 chaos 與 spacing（年輪）",
    async mount(ctx) {
      ctx.html(`<div class="vbox"></div><div class="tag"></div>`);
      const box = ctx.$(".vbox"), tag = ctx.$(".tag");
      const s = slot(ctx);
      const st = { which: 1, color: P5_COLORS[1], chaos: 2, spacing: 1 };
      let last = "";
      const name = () => (st.which ? "TRUNK" : "TOPOLOGY");
      const paint = () => {
        const what = st.which ? "55 圈年輪，每圈 360 個 noise 取樣點" : "4500 個粒子沿雜訊流場移動，半透明線段持續疊加";
        tag.innerHTML = `<code>VANTA.${name()}({ el, p5 })</code>　p5.js 2D Canvas<br><span class="muted">${last || what}</span>`;
      };
      const opts = () => ({ p5: window.p5, backgroundColor: 0x0e1013, color: st.color, ...(st.which ? { chaos: st.chaos, spacing: st.spacing } : {}) });
      const sliders = [];
      const show = async () => {
        sliders.forEach((el) => { el.parentElement.style.display = st.which ? "" : "none"; });
        last = "";
        await ctx.load(P5_URL);
        if (await s.swap(name(), box, opts())) paint();
      };
      ctx.group(["年輪 TRUNK", "地形 TOPOLOGY"], 0, (i) => { st.which = i === 0 ? 1 : 0; show(); });
      ctx.group(["紫", "黃", "青"], 1, (i) => {
        st.color = P5_COLORS[i];
        if (!s.fx) return;
        s.fx.setOptions({ color: st.color });
        if (st.which) { s.fx.restart(); last = "TRUNK：setOptions({ color }) 後 restart()"; }
        else last = "TOPOLOGY：setOptions({ color }) 下一格生效";
        paint();
      });
      sliders.push(ctx.slider("chaos", { min: 0, max: 10, step: 0.5, value: st.chaos }, (v) => { st.chaos = v; if (s.fx) s.fx.setOptions({ chaos: v }); }));
      sliders.push(ctx.slider("spacing", { min: 0, max: 10, step: 0.5, value: st.spacing }, (v) => { st.spacing = v; if (s.fx) s.fx.setOptions({ spacing: v }); }));
      await show();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "effect.setOptions({ points: n }) + effect.restart()",
    desc: "同一時間只保留一個 NET 實例，逐級加大 points 直到掉到 30 FPS 以下，看這台裝置能撐多密的網格。",
    hint: "按「自動加壓」開始・切換「顯示節點」再測一次",
    async mount(ctx) {
      ctx.html(`<div class="vbox stress"></div>`);
      ctx.controls.classList.add("bottom");
      const box = ctx.$(".vbox");
      const s = slot(ctx);
      ctx.toggle("顯示節點", true, (v) => { if (s.fx) { s.fx.setOptions({ showDots: v }); restartClean(s.fx); } });
      await s.swap("NET", box, { color: 0x4cc9f0, backgroundColor: 0x0e1013, points: 6, maxDistance: 20, spacing: 15, showDots: true });
      ctx.ramp({
        label: "points", steps: [6, 8, 10, 12, 14, 16, 18, 20, 24], minFps: 30,
        apply(n) { if (s.fx) { s.fx.setOptions({ points: n }); restartClean(s.fx); } },
        metrics: () => {
          const fx = s.fx;
          if (!fx || !fx.points) return {};
          const n = fx.points.length;
          return {
            節點: n,
            "距離計算/格": (n * (n + 1)) / 2,
            連線: fx.linesMesh.geometry.drawRange.count / 2,
            繪圖呼叫: fx.renderer.info.render.calls,
            線段緩衝: `${((fx.linePositions.byteLength * 2) / 1048576).toFixed(0)} MB`,
          };
        },
        note: "每一級用 setOptions({ points }) 加 restart() 重建網格，節點數約 2×(points+1)²。NET 每格在主執行緒對所有節點兩兩算距離（O(N²)），每個節點是獨立的 Mesh（一次繪圖呼叫），線段緩衝依 points 的四次方配置並每格整塊上傳 GPU。關掉「顯示節點」可省下節點的繪圖呼叫。視窗寬度小於 600 px 時 Vanta 會自動把 points 打七五折。",
      });
    },
  },
] });
</script>
</body>
</html>
