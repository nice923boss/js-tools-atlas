<script>
// Vega-Lite showcase: one JSON grammar for linked views, live editing, params, composition,
// transforms, streaming changesets, themes and a SVG vs Canvas runAsync() benchmark.
const { fmt, fmtCompact, fmtMs } = Showcase;
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const FONT = css.getPropertyValue("--font").trim();
const FG = "#ecebe6", MUTED = "#9b998f", DIM = "#33373f";
const SCHEMA = "https://vega.github.io/schema/vega-lite/v6.json";

// Traditional Chinese time labels for every temporal axis and tooltip.
vega.timeFormatLocale({
  dateTime: "%Y/%m/%d %H:%M:%S", date: "%Y/%m/%d", time: "%H:%M:%S", periods: ["上午", "下午"],
  days: ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"],
  shortDays: ["週日", "週一", "週二", "週三", "週四", "週五", "週六"],
  months: ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"],
  shortMonths: ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"],
});

// Dark config shared by most scenes (scene 7 swaps it for vega-themes).
const DARK = {
  background: null, font: FONT, view: { stroke: null },
  axis: { labelColor: MUTED, titleColor: FG, titleFontWeight: 500, gridColor: "rgba(255,255,255,0.07)", domainColor: "rgba(255,255,255,0.2)",
    tickColor: "rgba(255,255,255,0.2)", labelFontSize: 11, titleFontSize: 11 },
  legend: { labelColor: FG, titleColor: MUTED, symbolType: "circle", labelFontSize: 11.5, titleFontSize: 11, titleFontWeight: 500 },
  header: { labelColor: FG, titleColor: MUTED, labelFontSize: 12, labelFontWeight: 600 },
  title: { color: FG, anchor: "start", fontSize: 12.5, fontWeight: 600, subtitleColor: MUTED },
  text: { color: FG }, mark: { color: C[1] }, range: { category: [C[1], C[0], C[2], C[3], C[4], C[5]] },
  concat: { spacing: 18 }, facet: { spacing: 12 },
};

// Deep merge of plain objects (arrays are replaced).
const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
const merge = (a = {}, b = {}) => Object.fromEntries([...new Set([...Object.keys(a), ...Object.keys(b)])]
  .map((k) => [k, isObj(a[k]) && isObj(b[k]) ? merge(a[k], b[k]) : k in b ? b[k] : a[k]]));

// vegaEmbed() into el; the view is finalized with the scene (or earlier through res.dispose()).
async function embed(ctx, el, spec, { theme, renderer = "svg", dark = true } = {}) {
  const full = { $schema: SCHEMA, ...spec, config: dark ? merge(DARK, spec.config) : spec.config || {} };
  el.replaceChildren();
  const res = await vegaEmbed(el, full, { actions: false, renderer, theme, tooltip: { theme: "dark" } });
  let alive = true;
  res.dispose = () => { if (alive) { alive = false; res.finalize(); } };
  ctx.onCleanup(res.dispose);
  return res;
}

// Re-run fn(width, height) when el changes size (debounced); used to re-embed at the new size.
function watch(ctx, el, fn) {
  let t = 0, lw = el.clientWidth, lh = el.clientHeight;
  const ro = new ResizeObserver(() => {
    const w = el.clientWidth, h = el.clientHeight;
    if (w === lw && h === lh) return;
    lw = w; lh = h;
    clearTimeout(t);
    t = setTimeout(() => ctx.active && fn(w, h), 160);
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); clearTimeout(t); });
}

// A redrawable chart in el. make(w, h) returns the spec for the available size, opts() the embed options.
// Redraws are serialized (requests during a draw collapse into one more draw). Composite views cannot use
// autosize "fit", so after drawing we measure the rendered size and redraw once with the difference removed.
function chart(ctx, el, make, opts = () => ({}), { refit = true } = {}) {
  let res = null, running = false, again = false;
  const once = async () => {
    const W = el.clientWidth, H = el.clientHeight, o = opts(), spec = make(W, H);
    if (res) { res.dispose(); res = null; }
    let r = await embed(ctx, el, spec, o), w = W, h = H;
    if (!ctx.active) return;
    // Composite views cannot autosize, so measure the result and re-embed (at most twice) to fit.
    for (let pass = 0; refit && pass < 2; pass++) {
      const box = el.querySelector(".marks").getBoundingClientRect();
      const dw = box.width - W, dh = box.height - H;
      if (!(dw > 0.5 || dh > 0.5 || dw < -12 || dh < -12)) break;
      w -= dw; h -= dh;
      r.dispose();
      r = await embed(ctx, el, make(w, h), o);
      if (!ctx.active) return;
    }
    res = r;
  };
  const api = {
    get res() { return res; },
    onDraw: null, onError: null,
    async draw() {
      if (running) { again = true; return; }
      running = true;
      try {
        do {
          again = false;
          try {
            await once();
            if (ctx.active && res && api.onDraw) await api.onDraw(res);
          } catch (e) {
            if (!api.onError) throw e;
            api.onError(e);
          }
        } while (again && ctx.active);
      } finally { running = false; }
    },
  };
  watch(ctx, el, () => api.draw());
  return api;
}

const card = (cls, title, sub = "", read = "", body = `<div class="vl-box"><div class="vl-fill"></div></div>`) =>
  `<div class="panel vl-card ${cls}"><h2><span class="vl-ttl">${title}${sub}</span>${read ? `<span class="vl-read">${read}</span>` : ""}</h2>${body}</div>`;
const small = (t) => `<small>${t}</small>`;
const fit = { type: "fit", contains: "padding" };

// ---------- illustrative data (seeded, generated in the page) ----------
function rng(seed) { return () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646; }
const gauss = (r) => Math.sqrt(-2 * Math.log(r() || 1e-9)) * Math.cos(2 * Math.PI * r());
const SEASON = ["冬", "冬", "春", "春", "春", "夏", "夏", "夏", "秋", "秋", "秋", "冬"];

// 2024 Taipei-like daily weather (same generator as the original demo; timestamps are local midnight).
const WEATHER = (() => {
  const r = rng(20240101);
  const TMAX = [19.2, 19.8, 22.0, 25.6, 29.0, 31.8, 34.0, 33.6, 31.4, 27.8, 24.6, 20.9];
  const WET = [0.45, 0.5, 0.5, 0.48, 0.5, 0.55, 0.42, 0.5, 0.45, 0.38, 0.4, 0.42];
  const rows = [];
  for (let d = new Date(2024, 0, 1); d.getFullYear() === 2024; d.setDate(d.getDate() + 1)) {
    const m = d.getMonth(), f = (d.getDate() - 15) / 30;
    const n = f < 0 ? (m + 11) % 12 : (m + 1) % 12;
    const base = TMAX[m] + (TMAX[n] - TMAX[m]) * Math.abs(f);
    let weather, precip = 0;
    const x = r();
    if (x < WET[m]) {
      const storm = m >= 5 && m <= 8 && r() < 0.55;
      weather = storm ? "雷雨" : "雨";
      precip = Math.round((storm ? 18 : 4) + r() ** 2 * (storm ? 90 : 45));
    } else {
      weather = x < WET[m] + 0.18 ? "陰" : x < WET[m] + 0.36 ? "多雲" : "晴";
    }
    const tmax = +(base + (r() - 0.5) * 4 + (weather === "晴" ? 1.2 : weather === "雨" ? -1.5 : 0)).toFixed(1);
    rows.push({ date: d.getTime(), tmax, precip, weather, season: SEASON[m] });
  }
  return rows;
})();
const WX = ["晴", "多雲", "陰", "雨", "雷雨"];
const WX_COLORS = [C[0], C[4], "#8b8f99", C[1], C[5]];

// 150 online courses: price, students, rating, hours.
const CATS = ["程式", "設計", "語言", "商業", "攝影"];
const NAMES = {
  程式: ["Python 入門", "JavaScript 實戰", "資料分析", "React 開發", "SQL 基礎", "網頁前端"],
  設計: ["Figma 介面", "品牌識別", "插畫入門", "排版設計", "UI 動態"],
  語言: ["多益衝刺", "日語 N3", "韓語入門", "商用英文", "英文簡報"],
  商業: ["行銷企劃", "財報解讀", "專案管理", "電商經營", "簡報技巧"],
  攝影: ["手機攝影", "人像攝影", "Lightroom 修圖", "影片剪輯", "商品攝影"],
};
const COURSES = (() => {
  const r = rng(11), seen = {};
  return Array.from({ length: 150 }, (_, i) => {
    const cat = CATS[Math.floor(r() * 5)];
    const base = NAMES[cat][Math.floor(r() * NAMES[cat].length)];
    seen[base] = (seen[base] || 0) + 1;
    const price = Math.round((800 + r() ** 1.4 * 5200) / 100) * 100;
    const hours = Math.round(3 + r() * 26 + price / 450);
    const rating = Math.min(5, +(3.3 + r() * 1.5 + (cat === "程式" ? 0.12 : 0)).toFixed(1));
    const students = Math.round(2800 * Math.exp(-price / 2300) * (0.45 + r()) * (0.55 + (rating - 3) * 0.45));
    return { name: seen[base] > 1 ? `${base} ${seen[base]}` : base, cat, price, hours, rating, students };
  });
})();

// Monthly climate normals, rounded (illustrative).
const CITIES = ["基隆", "臺北", "臺中", "臺南", "高雄", "花蓮"];
const CLIMATE = (() => {
  const T = {
    基隆: [16.0, 16.1, 17.9, 21.1, 24.4, 27.2, 29.2, 28.9, 27.2, 24.3, 21.4, 17.9],
    臺北: [16.1, 16.5, 18.5, 21.9, 25.2, 27.7, 29.6, 29.2, 27.4, 24.5, 21.5, 17.9],
    臺中: [16.6, 17.3, 19.9, 23.5, 26.3, 27.8, 28.8, 28.4, 27.8, 25.6, 22.4, 18.4],
    臺南: [17.6, 18.6, 21.3, 24.8, 27.4, 28.6, 29.3, 28.9, 28.4, 26.4, 23.2, 19.2],
    高雄: [19.3, 20.3, 22.6, 25.4, 27.6, 28.7, 29.3, 28.9, 28.4, 27.0, 24.2, 20.6],
    花蓮: [18.0, 18.4, 20.0, 22.6, 25.1, 27.2, 28.6, 28.4, 27.0, 24.8, 22.2, 19.4],
  };
  const RAIN = {
    基隆: [330, 370, 320, 240, 280, 300, 140, 220, 370, 390, 400, 320],
    臺北: [95, 175, 180, 177, 250, 325, 245, 322, 360, 148, 83, 73],
    臺中: [30, 85, 95, 135, 230, 370, 265, 330, 140, 20, 20, 25],
    臺南: [18, 25, 40, 75, 180, 420, 370, 480, 160, 25, 15, 15],
    高雄: [20, 25, 40, 75, 195, 420, 400, 460, 230, 50, 15, 15],
    花蓮: [65, 105, 85, 90, 200, 215, 135, 235, 380, 375, 170, 75],
  };
  return CITIES.flatMap((city) => T[city].map((t, i) => ({ city, month: i + 1, temp: t, tmin: +(t - 3.6).toFixed(1), tmax: +(t + 3.9).toFixed(1), rain: RAIN[city][i] })));
})();

// Monthly enrolment per category in wide format (one column per category) for the fold demo.
const ENROL = (() => {
  const r = rng(29);
  return Array.from({ length: 12 }, (_, i) => {
    const m = i + 1, row = { month: m };
    CATS.forEach((c, k) => { row[c] = Math.round((260 - k * 32) * (1 + (k === 0 ? 0.07 : k === 2 ? -0.03 : 0.02) * m) * (0.85 + r() * 0.3)); });
    return row;
  });
})();

Showcase.run({ scenes: [
  {
    id: "linked", title: "天氣連動篩選",
    api: "params: [{ select: { type: 'interval' } }, { select: { type: 'point' } }]・transform: [{ filter: { param } }]・vconcat / hconcat",
    desc: "一份 JSON 規格描述三張圖：上方散點圖拖曳框選日期，下方天氣長條與溫度分布即時重算；點長條也能反向篩選散點。",
    hint: "上圖拖曳框選日期，點長條篩選天氣，下方兩圖即時連動",
    mount(ctx) {
      ctx.html(`<div class="vl-wrap">${card("vl-main", "2024 臺北每日天氣", small("示意資料・一份規格三張連動圖"), "…")}</div>`);
      const fill = ctx.$(".vl-fill"), readEl = ctx.$(".vl-read");
      let yField = "tmax", preset = true;
      const Y = { tmax: { title: "最高溫（°C）", zero: false }, precip: { title: "降雨量（mm）", zero: true } };
      const read = (v) => {
        const [a, b] = (v && v.date) || [];
        if (a == null) { readEl.textContent = "拖曳上圖框選日期範圍"; return; }
        const lo = +new Date(a), hi = +new Date(b);
        const days = WEATHER.filter((d) => d.date >= lo && d.date <= hi);
        const md = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
        const rain = days.filter((d) => d.precip > 0).length;
        readEl.innerHTML = `brush <code>${md(lo)}～${md(hi)}</code>・<b class="vl-num">${days.length}</b> 天，雨天 <b class="vl-num">${rain}</b> 天`;
      };
      const spec = (w, h) => {
        const narrow = fill.clientWidth < 560, tight = h < 300;
        // Short stages drop the bar title to win back vertical room.
        const room = h - (tight ? 106 : 128);
        const topH = Math.max(64, Math.round(room * (narrow ? 0.52 : 0.56)));
        const botH = Math.max(40, room - topH);
        const half = Math.floor((w - 36 - 48 - 22 - 24) / 2);
        const color = { field: "weather", type: "nominal", title: "天氣", scale: { domain: WX, range: WX_COLORS } };
        const scatter = {
          width: w - 62, height: topH,
          params: [{ name: "brush", ...(preset ? { value: { x: [{ year: 2024, month: 6, date: 1 }, { year: 2024, month: 9, date: 15 }] } } : {}),

        },
        {
          title: "課程價格與學員數趨勢", read: "150 門課・exp 迴歸 vs LOESS",
          tx: [{ regression: "students", on: "price", method: "exp" }, { loess: "students", on: "price", bandwidth: 0.45 }],
          spec(w, h) {
            const x = { field: "price", type: "quantitative", title: "價格（元）", axis: { tickCount: w < 420 ? 4 : 6, labelOverlap: true } }, y = { field: "students", type: "quantitative", title: "學員數" };
            return { width: w, height: h, autosize: fit, data: { values: COURSES },
              layer: [
                { mark: { type: "circle", size: 30, opacity: 0.45, color: MUTED }, encoding: { x, y } },
                { transform: [this.tx[0]], mark: { type: "line", strokeWidth: 2.5 }, encoding: { x, y, color: { datum: "regression（exp）" } } },
                { transform: [this.tx[1]], mark: { type: "line", strokeWidth: 2.5, strokeDash: [6, 4] }, encoding: { x, y, color: { datum: "loess（0.45）" } } },
              ],
              encoding: { color: { scale: { domain: ["regression（exp）", "loess（0.45）"], range: [C[2], C[0]] }, legend: { orient: "top-right", title: null } } } };
          },
        },
        {
          title: "四季最高溫分布", read: "核密度估計，依季節分組",
          tx: [{ density: "tmax", groupby: ["season"], extent: [10, 38], bandwidth: 1.2 }],
          spec(w, h) {
            return { width: w, height: h, autosize: fit, data: { values: WEATHER }, transform: this.tx,
              mark: { type: "area", opacity: 0.45, line: { strokeWidth: 1.6 } },
              encoding: { x: { field: "value", type: "quantitative", title: "最高溫（°C）" }, y: { field: "density", type: "quantitative", title: "密度" },
                color: { field: "season", type: "nominal", title: null, sort: ORDER, scale: { domain: ORDER, range: [C[3], C[2], C[4], C[1]] }, legend: { orient: "top-left" } } } };
          },
        },
        {
          title: "各類課程報名占比", read: "寬表 5 欄 fold 成長表，再 normalize 堆疊",
          tx: [{ fold: CATS, as: ["類別", "人數"] }],
          spec(w, h) {
            return { width: w, height: h, autosize: fit, data: { values: ENROL }, transform: this.tx,
              mark: { type: "area", interpolate: "monotone", opacity: 0.9 },
              encoding: { x: { field: "month", type: "quantitative", title: null, scale: { domain: [1, 12] }, axis: { tickCount: 12, labelExpr: "datum.value + '月'" } },
                y: { field: "人數", type: "quantitative", stack: "normalize", title: "占比", axis: { format: "%" } },
                color: { field: "類別", type: "nominal", scale: { domain: CATS, range: C.slice(0, 5) }, legend: { orient: "top", direction: "horizontal", title: null } },
                tooltip: [{ field: "month", title: "月" }, { field: "類別" }, { field: "人數" }] } };
          },
        },
      ];
      // Lightly syntax-highlighted JSON, one transform per line block.
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      const hi = (s) => esc(s).replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:').replace(/: ?"([^"]*)"/g, ': <span class="s">"$1"</span>').replace(/(-?\d+\.?\d*)(?=[,\]}])/g, '<span class="n">$1</span>');
      let mode = 0;
      const c = chart(ctx, fill, (w, h) => MODES[mode].spec(w, h));
      const draw = () => {
        const m = MODES[mode];
        ttl.innerHTML = `${m.title}${small("示意資料")}`;
        readEl.textContent = m.read;
        let code = "[\n" + m.tx.map((t) => "  " + JSON.stringify(t, null, 1).replace(/\n\s*/g, " ")).join(",\n") + "\n]";
        if (mode === 3) code += '\n\n// encoding.y\n{ "stack": "normalize" }';
        pre.innerHTML = hi(code);
        c.draw();
      };
      ctx.group(["window", "regression／loess", "density", "fold＋stack"], 0, (i) => { mode = i; draw(); });
      draw();
    },
  },

  {
    id: "stream", title: "串流資料",
    api: "view.change('live', vega.changeset().insert(rows).remove(fn))・view.runAsync()",
    desc: "具名資料來源 live 同時餵給折線圖與長條圖；每 100 ms 用 changeset 插入新資料、移除超出 30 秒視窗的舊資料，只重算有變動的部分。",
    hint: "切換速率看每次 runAsync() 的耗時；按「暫停」凍結畫面",
    mount(ctx) {
      ctx.html(`<div class="vl-wrap">${card("vl-s", "捷運三線即時進站", small("每秒人次・示意資料"), "…")}</div>`);
      const fill = ctx.$(".vl-fill"), readEl = ctx.$(".vl-read");
      const LINES = ["板南線", "淡水信義線", "文湖線"], BASE = [62, 54, 30], WIN = 30000;
      const RATES = [5, 40, 200];
      let rate = RATES[1], paused = false, total = 0, lastMs = 0, busy = false;
      const r = rng(3);
      const phase = LINES.map(() => r() * 6);
      const sample = (t, k) => Math.max(1, Math.round(BASE[k] * (1 + 0.28 * Math.sin(t / 4100 + phase[k]) + 0.12 * Math.sin(t / 900 + k)) + gauss(r) * 5));
      // Seed the window so the chart is full on first paint.
      let buf = [];
      const now0 = Date.now();
      for (let t = now0 - WIN; t <= now0; t += 1000 / RATES[1]) LINES.forEach((line, k) => buf.push({ t, line, v: sample(t, k) }));
      total = buf.length;
      const spec = (w, h) => {
        const narrow = fill.clientWidth < 560, h1 = Math.max(80, Math.round((h - 110) * 0.66)), h2 = Math.max(46, h - 110 - h1);
        const color = { field: "line", type: "nominal", title: null, scale: { domain: LINES, range: [C[1], C[2], C[0]] } };
        return {
          data: { name: "live", values: buf },
          vconcat: [
            { width: w - 56, height: h1, mark: { type: "line", strokeWidth: 1.4, interpolate: "monotone" },
              encoding: { x: { field: "t", type: "temporal", title: null, scale: { nice: false }, axis: { format: "%H:%M:%S", tickCount: narrow ? 3 : 6 } },
                y: { field: "v", type: "quantitative", title: "人次／秒" }, color: { ...color, legend: { orient: "top", direction: "horizontal" } } } },
            { width: w - (narrow ? 92 : 104), height: h2, transform: [{ aggregate: [{ op: "sum", field: "v", as: "total" }], groupby: ["line"] }],
              mark: { type: "bar", cornerRadiusEnd: 3 },
              encoding: { y: { field: "line", type: "nominal", title: null, sort: LINES }, x: { field: "total", type: "quantitative", title: "30 秒內累計人次", axis: { tickCount: narrow ? 3 : 5, format: "~s" } },
                color: { ...color, legend: null }, tooltip: [{ field: "line", title: "路線" }, { field: "total", title: "累計", format: "," }] } },
          ],
          config: { concat: { spacing: 14 } },
        };
      };
      const read = () => {
        readEl.innerHTML = `視窗內 <b class="vl-num">${fmt(buf.length)}</b> 筆・累計插入 <span class="vl-num">${fmtCompact(total)}</span>・runAsync <b class="vl-num">${lastMs.toFixed(1)}</b> ms`;
      };
      const c = chart(ctx, fill, spec);
      c.onDraw = read;
      let last = Date.now();
      ctx.interval(async () => {
        const res = c.res;
        if (paused || busy || !res) return;
        const now = Date.now(), n = Math.max(1, Math.round(((now - last) / 1000) * rate));
        const rows = [];
        for (let i = 1; i <= n; i++) { const t = last + ((now - last) * i) / n; LINES.forEach((line, k) => rows.push({ t, line, v: sample(t, k) })); }
        last = now;
        const cut = now - WIN;
        buf = buf.filter((d) => d.t >= cut).concat(rows);
        total += rows.length;
        busy = true;
        const t0 = performance.now();
        try {
          await res.view.change("live", vega.changeset().insert(rows).remove((d) => d.t < cut)).runAsync();
          lastMs = performance.now() - t0;
        } finally { busy = false; }
        read();
      }, 100);
      ctx.group(["慢速", "中速", "高速"], 1, (i) => { rate = RATES[i]; });
      ctx.toggle("暫停", false, (v) => { paused = v; if (!v) last = Date.now(); });
      c.draw();
    },
  },

  {
    id: "themes", title: "主題、渲染器與匯出",
    api: "vegaEmbed(el, spec, { theme })・view.renderer('svg' | 'canvas').runAsync()・view.toImageURL('png', 2)・view.toSVG()",
    desc: "同一份規格套上 vega-themes 內建的十多種主題；渲染器可在 SVG 與 Canvas 間即時切換，匯出 PNG 與 SVG 都由 view 直接產生。",
    hint: "換主題或渲染器，按「匯出 PNG」看右側實際輸出",
    mount(ctx) {
      ctx.html(`<div class="vl-wrap vl-split">${card("vl-th", "主題預覽", small("示意資料"), "…", `<div class="vl-box vl-sheet"><div class="vl-fill"></div></div>`)}
        <div class="panel vl-card vl-export"><h2><span class="vl-ttl">匯出預覽${small("toImageURL")}</span></h2><div class="vl-shot">按「匯出 PNG」</div>
        <dl><dt>PNG 尺寸</dt><dd class="e-dim">…</dd><dt>PNG 大小</dt><dd class="e-png">…</dd><dt>SVG 字串</dt><dd class="e-svg">…</dd><dt>匯出耗時</dt><dd class="e-ms">…</dd></dl></div></div>`);
      const fill = ctx.$(".vl-th .vl-fill"), sheet = ctx.$(".vl-sheet"), readEl = ctx.$(".vl-th .vl-read"), shot = ctx.$(".vl-shot");
      const THEMES = ["dark", "excel", "ggplot2", "quartz", "vox", "fivethirtyeight", "latimes", "urbaninstitute", "googlecharts", "powerbi", "carbong100"];
      const Q = ["Q1", "Q2", "Q3", "Q4"], r = rng(8);
      const data = Q.flatMap((q, i) => CATS.slice(0, 4).map((c, k) => ({ 季: q, 類別: c, 營收: Math.round((420 - k * 70) * (1 + i * 0.12) * (0.85 + r() * 0.3)) })));
      let theme = "dark", renderer = "svg", exportNext = true;
      const spec = (w, h) => ({
        width: w, height: h, autosize: fit, padding: 10,
        title: { text: "2024 各季課程營收", subtitle: "單位：萬元・示意資料" },
        data: { values: data },
        layer: [
          { mark: { type: "bar", tooltip: true }, encoding: { xOffset: { field: "類別", sort: CATS }, y: { field: "營收", type: "quantitative", title: "營收（萬元）" }, color: { field: "類別", type: "nominal", sort: CATS } } },
          { mark: { type: "line", point: true, strokeDash: [4, 3] }, encoding: { y: { aggregate: "mean", field: "營收", type: "quantitative", title: "營收（萬元）" }, color: { value: "#888" } } },
        ],
        encoding: { x: { field: "季", type: "nominal", title: null, axis: { labelAngle: 0 } } },
        config: { font: FONT },
      });
      const nodes = () => fill.getElementsByTagName("*").length;
      const read = () => { readEl.innerHTML = `theme <code>${theme}</code>・renderer <code>${renderer}</code>・DOM <b class="vl-num">${fmt(nodes())}</b> 節點`; };
      const c = chart(ctx, fill, spec, () => ({ theme, renderer, dark: false }));
      c.onDraw = async (res) => {
        // Themes without a background would be transparent on the dark page; give them white paper.
        if (!res.view.background()) { res.view.background("#ffffff"); await res.view.runAsync(); }
        sheet.style.background = res.view.background();
        read();
        if (exportNext) { exportNext = false; await exportPng(); }
      };
      const exportPng = async () => {
        const res = c.res;
        if (!res) return;
        const t0 = performance.now();
        const url = await res.view.toImageURL("png", 2);
        const svg = await res.view.toSVG();
        const ms = performance.now() - t0;
        if (!ctx.active) return;
        const img = new Image();
        img.alt = "Vega 匯出的 PNG";
        img.onload = () => { ctx.$(".e-dim").textContent = `${img.naturalWidth}×${img.naturalHeight}`; };
        img.src = url;
        shot.replaceChildren(img);
        ctx.$(".e-png").textContent = `${fmt(Math.round((url.length - 22) * 0.75 / 1024))} KB`;
        ctx.$(".e-svg").textContent = `${fmt(svg.length)} 字元`;
        ctx.$(".e-ms").textContent = fmtMs(ms);
      };
      ctx.select("主題", THEMES, theme, (v) => { theme = v; exportNext = true; c.draw(); });
      ctx.group(["SVG", "Canvas"], 0, async (i) => {
        renderer = i ? "canvas" : "svg";
        if (c.res) { await c.res.view.renderer(renderer).runAsync(); read(); }
      });
      ctx.button("匯出 PNG", exportPng, { primary: true });
      c.draw();
    },
  },

  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new vega.View(vega.parse(vegaLite.compile(spec).spec), { renderer }).insert('pts', rows).runAsync()",
    desc: "散點數量逐級加倍，每級重建 View、插入資料並 runAsync() 到畫完；切換 SVG 與 Canvas 各跑一次，右上表格並排比較。",
    hint: "先選渲染器再按「開始測試」；跑完換另一個渲染器再跑一次對照",
    mount(ctx) {
      ctx.html(`<div class="panel vl-stress"><div class="vl-tag">…</div><div class="vl-cmp"></div><div class="vl-box"><div class="vl-fill"></div></div></div>`);
      const host = ctx.$(".vl-fill"), tag = ctx.$(".vl-tag"), cmp = ctx.$(".vl-cmp");
      const SIZES = [1000, 2000, 4000, 8000, 16000, 32000, 64000, 128000, 256000];
      const results = { svg: {}, canvas: {} };
      let renderer = "svg", view = null;
      const dispose = () => { if (view) { view.finalize(); view = null; } host.replaceChildren(); };
      ctx.onCleanup(dispose);
      // Three gaussian blobs; values fixed to a 0..100 domain so every level draws the same axes.
      const points = (n) => {
        const r = rng(n), ctr = [[30, 62, 9], [64, 38, 11], [70, 74, 7]];
        return Array.from({ length: n }, (_, i) => {
          const g = i % 3, [cx, cy, s] = ctr[g];
          return { x: Math.min(100, Math.max(0, cx + gauss(r) * s)), y: Math.min(100, Math.max(0, cy + gauss(r) * s)), g };
        });
      };
      const runtime = () => vega.parse(vegaLite.compile({
        $schema: SCHEMA, width: host.clientWidth, height: host.clientHeight, autosize: fit,
        data: { name: "pts" },
        mark: { type: "circle", size: 6, opacity: 0.5 },
        encoding: {
          x: { field: "x", type: "quantitative", title: null, scale: { domain: [0, 100] } },
          y: { field: "y", type: "quantitative", title: null, scale: { domain: [0, 100] } },
          color: { field: "g", type: "nominal", legend: null, scale: { range: [C[1], C[2], C[0]] } },
        },
        config: DARK,
      }).spec);
      const label = () => (renderer === "svg" ? "SVG" : "Canvas");
      const showTag = (n) => { tag.innerHTML = `<b>${label()}</b>・${fmt(n)} 點・DOM <b>${fmt(host.getElementsByTagName("*").length)}</b> 節點`; };
      const paintCmp = () => {
        const ns = SIZES.filter((n) => results.svg[n] != null || results.canvas[n] != null);
        if (!ns.length) { cmp.innerHTML = "<p>SVG 與 Canvas 各跑一次，結果會並排在這裡</p>"; return; }
        const cell = (a, b) => (a == null ? "<td>－</td>" : `<td class="${b != null && a < b ? "vl-win" : ""}">${fmtMs(a)}</td>`);
        cmp.innerHTML = `<table><tr><th>點數</th><th>SVG</th><th>Canvas</th></tr>${ns.map((n) =>
          `<tr><td>${fmtCompact(n)}</td>${cell(results.svg[n], results.canvas[n])}${cell(results.canvas[n], results.svg[n])}</tr>`).join("")}</table>`;
      };
      const show = async (n, data) => {
        dispose();
        view = new vega.View(runtime(), { renderer, container: host, hover: false });
        view.insert("pts", data);
        await view.runAsync();
      };
      show(2000, points(2000)).then(() => ctx.active && showTag(2000));
      paintCmp();
      const b = ctx.bench({
        label: "散點", unit: "點", sizes: SIZES, target: 1000, budget: 2500,
        prepare: (n) => { dispose(); return points(n); },
        async run(n, data) {
          const who = renderer;
          await show(n, data);
          void host.offsetHeight; // include style + layout of the new DOM in the timing
          // After bench() records this level, copy its time into the side-by-side table.
          ctx.timeout(() => {
            const last = b.results[b.results.length - 1];
            if (last && last.n === n) results[who][n] = last.ms;
            paintCmp(); showTag(n);
          }, 0);
          return `${label()}・${fmtCompact(host.getElementsByTagName("*").length)} 節點`;
        },
        note: "每級重建一個 vega.View，插入 N 筆資料後 runAsync() 一路跑完資料流、比例尺、標記編碼與繪製；規格編譯不計時。SVG 每個點都是一個 DOM 節點，Canvas 只有一張畫布，點數越多差距越大；hover 已關閉以排除互動索引。",
      });
      ctx.group(["SVG", "Canvas"], 0, (i) => { renderer = i ? "canvas" : "svg"; show(2000, points(2000)).then(() => ctx.active && showTag(2000)); });
      ctx.controls.classList.add("bottom");
    },
  },
] });
</script>
</body>
</html>
