<script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.min.js"></script>

<script>
// VexFlow showcase: scales with tab, rhythm and beaming, ties and expression marks, harmony with automatic
// accidentals, SATB grand staff, EasyScore text input, guitar techniques and a render benchmark.
const VF = window.VexFlow;
const {
  Renderer, Stave, TabStave, StaveNote, TabNote, GhostNote, Voice, Formatter, Beam, Annotation, StaveConnector, Fraction,
  Tuplet, Dot, StaveTie, Curve, Articulation, Ornament, GraceNote, GraceNoteGroup, TextDynamics, StaveHairpin, Modifier,
  Accidental, ChordSymbol, Bend, Vibrato, TabSlide, TabTie, Factory,
} = VF;
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif";
const QT = 4096; // ticks per quarter note (VexFlow RESOLUTION / 4)

// ---------- pitch helpers ----------
const LETTERS = "CDEFGAB", NAT = [0, 2, 4, 5, 7, 9, 11], STEPS = [2, 2, 1, 2, 2, 2, 1];
const SOLFEGE = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si", "Do"];
const OPEN = [64, 59, 55, 50, 45, 40]; // guitar strings 1..6, sounding pitch
const SHARP = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
// [VexFlow key spec, display name, root letter, root accidental, written octave]
const KEYS = [["C", "C", "C", 0, 4], ["G", "G", "G", 0, 4], ["D", "D", "D", 0, 4], ["A", "A", "A", 0, 4],
  ["E", "E", "E", 0, 4], ["F", "F", "F", 0, 4], ["Bb", "B♭", "B", -1, 3], ["Eb", "E♭", "E", -1, 4]];
const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const accTxt = (a) => (a > 0 ? "♯".repeat(a) : a < 0 ? "♭".repeat(-a) : "");
const accVf = (a) => (a > 0 ? "#".repeat(a) : a < 0 ? "b".repeat(-a) : "");
const keyOf = (m) => `${SHARP[m % 12]}/${Math.floor(m / 12) - 1}`;
function midiOf(key) {
  const [p, o] = key.split("/");
  const acc = p.slice(1);
  const a = acc === "#" ? 1 : acc === "##" ? 2 : acc === "b" ? -1 : acc === "bb" ? -2 : 0;
  return 12 * (+o + 1) + NAT[LETTERS.indexOf(p[0].toUpperCase())] + a;
}
function buildScale([, , letter, acc, oct]) {
  const li = LETTERS.indexOf(letter);
  let midi = 12 * (oct + 1) + NAT[li] + acc;
  const up = [];
  for (let i = 0; i < 8; i++) {
    const L = LETTERS[(li + i) % 7], o = oct + Math.floor((li + i) / 7);
    up.push({ L, o, a: midi - (12 * (o + 1) + NAT[(li + i) % 7]), midi, sol: SOLFEGE[i] });
    midi += STEPS[i % 7];
  }
  return up;
}
function keySigText(key) {
  const sc = buildScale(key).slice(0, 7);
  const sharp = sc.some((n) => n.a > 0), order = sharp ? "FCGDAEB" : "BEADGCF";
  const accs = sc.filter((n) => n.a).sort((p, q) => order.indexOf(p.L) - order.indexOf(q.L)).map((n) => n.L + accTxt(n.a));
  return accs.length ? `調號 ${accs.length} 個${sharp ? "升" : "降"}記號（${accs.join("、")}）` : "調號沒有升降記號";
}

// Mini rhythm notation used by several scenes: "c5:8 r:q e5:qd [3 f5:8 g5:8 a5:8] | ..."
function parseLine(src) {
  return src.split("|").map((bar) => {
    const out = [];
    let tup = 0, gid = 0;
    for (const tok of bar.trim().split(/\s+/)) {
      if (tok.startsWith("[")) { tup = +tok.slice(1); gid++; continue; }
      if (tok === "]") { tup = 0; continue; }
      const [p, d] = tok.split(":");
      out.push({ rest: p === "r", key: p === "r" ? "b/4" : `${p.slice(0, -1)}/${p.slice(-1)}`, dur: d, tup: tup ? gid : 0, tn: tup });
    }
    return out;
  });
}
function makeNotes(bar, { clef = "treble", stem } = {}) {
  const notes = bar.map((t) => {
    const dots = (t.dur.match(/d/g) || []).length;
    const n = new StaveNote({ clef, keys: [t.rest ? (clef === "bass" ? "d/3" : "b/4") : t.key], duration: t.dur + (t.rest ? "r" : ""), ...(stem ? { stemDirection: stem } : { autoStem: !t.rest }) });
    if (dots) Dot.buildAndAttach([n], { all: true });
    return n;
  });
  const tuplets = [];
  [...new Set(bar.filter((t) => t.tup).map((t) => t.tup))].forEach((g) => {
    const ns = notes.filter((_, i) => bar[i].tup === g);
    tuplets.push(new Tuplet(ns, { numNotes: bar.find((t) => t.tup === g).tn, notesOccupied: 2 }));
  });
  return { notes, tuplets };
}

// ---------- rendering helpers ----------
// SVG renderer with a viewBox so the score scales with its card.
function surface(paper, LW, LH) {
  paper.innerHTML = "";
  const r = new Renderer(paper, Renderer.Backends.SVG);
  r.resize(LW, LH);
  const svg = paper.querySelector("svg");
  svg.setAttribute("viewBox", `0 0 ${LW} ${LH}`);
  svg.removeAttribute("width"); svg.removeAttribute("height");
  svg.style.width = ""; svg.style.height = ""; paper.style.width = "";
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  return r.getContext();
}
const logicalW = (paper, min = 340, max = 960) => Math.round(Math.max(min, Math.min(max, paper.clientWidth || 600)));
// Width of the clef/key/time block, measured with a throwaway stave.
function leadW(decorate) {
  const a = new Stave(0, 0, 400), b = new Stave(0, 0, 400);
  decorate(a);
  return a.getNoteStartX() - b.getNoteStartX();
}
// Lay n measures out in rows of `per`; the first measure of each row gets extra room for its clef block.
function grid(n, per, LW, extra) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / per), j = i % per, ex = extra(row);
    const w = (LW - 20 - ex) / per;
    out.push({ i, row, first: j === 0, x: 10 + (j ? ex + w * j : 0), w: w + (j ? 0 : ex) });
  }
  return out;
}
const avail = (stave) => stave.getWidth() - (stave.getNoteStartX() - stave.getX()) - 14;
const els = (...xs) => xs.flat().filter(Boolean).map((x) => x.getSVGElement()).filter(Boolean);
function watch(ctx, el, fn, both = false) {
  let w = el.clientWidth, hh = el.clientHeight;
  const ro = new ResizeObserver(() => {
    const nw = el.clientWidth, nh = el.clientHeight;
    if (Math.abs(nw - w) > 3 || (both && Math.abs(nh - hh) > 3)) { w = nw; hh = nh; if (ctx.active) fn(); }
  });
  ro.observe(el);
  ctx.onCleanup(() => ro.disconnect());
}
function canvasIn(ctx, host) {
  const cv = document.createElement("canvas");
  host.append(cv);
  const v = { g: cv.getContext("2d"), w: 1, h: 1 };
  const fit = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    v.w = Math.max(1, host.clientWidth); v.h = Math.max(1, host.clientHeight);
    cv.width = Math.round(v.w * dpr); cv.height = Math.round(v.h * dpr);
    v.g.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit(); watch(ctx, host, fit, true);
  return v;
}
// Click anywhere on the score: map to SVG coordinates and pick the nearest note.
function pickNote(ctx, paper, items, fn) {
  ctx.on(paper, "click", (e) => {
    const svg = paper.querySelector("svg");
    if (!svg) return;
    const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
    let best = null, bd = Infinity;
    for (const it of items()) {
      const d = Math.abs(it.note.getAbsoluteX() + 6 - pt.x) + 0.15 * Math.min(...it.note.getYs().map((y) => Math.abs(y - pt.y)));
      if (d < bd) { bd = d; best = it; }
    }
    if (best && bd < 50) fn(best);
  });
}

// ---------- audio ----------
// One AudioContext, created on the first gesture; everything goes out -> analyser -> destination.
let AC = null;
function audio() {
  if (!AC) {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const out = ac.createGain(); out.gain.value = 0.9;
    const an = ac.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0.7;
    out.connect(an); an.connect(ac.destination);
    AC = { ac, out, an, fq: new Uint8Array(1024) };
  }
  if (AC.ac.state === "suspended") AC.ac.resume();
  return AC;
}
// Plucked tone: triangle + octave sine through a closing lowpass. glide = [[dt, midi, rampSec]] bends the pitch
// without a new attack (bend, slide, hammer-on, pull-off); vib adds a delayed 5.5 Hz LFO.
function tone(midi, when, dur, { gain = 0.22, glide, vib } = {}) {
  const { ac, out } = AC;
  const f = hz(midi);
  const o = ac.createOscillator(), o2 = ac.createOscillator(), g2 = ac.createGain(), lp = ac.createBiquadFilter(), g = ac.createGain();
  o.type = "triangle"; o2.type = "sine"; g2.gain.value = 0.3;
  [[o, 1], [o2, 2]].forEach(([osc, k]) => {
    let prev = f;
    osc.frequency.setValueAtTime(f * k, when);
    for (const [dt, m, ramp] of glide || []) {
      if (ramp) { osc.frequency.setValueAtTime(prev * k, when + dt); osc.frequency.linearRampToValueAtTime(hz(m) * k, when + dt + ramp); }
      else osc.frequency.setValueAtTime(hz(m) * k, when + dt);
      prev = hz(m);
    }
  });
  lp.type = "lowpass";
  lp.frequency.setValueAtTime(Math.min(16000, f * 10), when);
  lp.frequency.exponentialRampToValueAtTime(Math.min(12000, f * 2.5), when + 0.5);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(gain, when + 0.008);
  g.gain.setTargetAtTime(gain * 0.4, when + 0.02, 0.3);
  for (const [dt, , ramp] of glide || []) if (!ramp) { g.gain.setTargetAtTime(gain * 0.7, when + dt, 0.004); g.gain.setTargetAtTime(gain * 0.35, when + dt + 0.03, 0.3); }
  g.gain.setTargetAtTime(0.0001, when + dur, 0.05);
  o.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(out);
  const nodes = [o, o2, g2, lp, g];
  if (vib) {
    const l = ac.createOscillator(), lg = ac.createGain(), lg2 = ac.createGain();
    l.frequency.value = 5.5;
    lg.gain.setValueAtTime(0, when); lg.gain.linearRampToValueAtTime(f * 0.025, when + 0.25);
    lg2.gain.setValueAtTime(0, when); lg2.gain.linearRampToValueAtTime(f * 0.05, when + 0.25);
    l.connect(lg); lg.connect(o.frequency); l.connect(lg2); lg2.connect(o2.frequency);
    l.start(when); l.stop(when + dur + 0.4);
    nodes.push(l, lg, lg2);
  }
  [o, o2].forEach((x) => { x.start(when); x.stop(when + dur + 0.4); });
  return nodes;
}
// Schedules a list of events {t, dur, midi?, gain, glide, vib, els, hold, onStart} and highlights
// each event's SVG groups while it sounds. Leaving the scene stops and disconnects every node.
function sequencer(ctx, onState) {
  let nodes = [], evs = [], stopRaf = null;
  const light = (list, on) => list.forEach((e) => e.classList.toggle("vf-hl", on));
  function stop() {
    nodes.forEach((n) => { try { if (n.stop) n.stop(); } catch (e) { /* already stopped */ } n.disconnect(); });
    nodes = [];
    if (stopRaf) { stopRaf(); stopRaf = null; }
    evs.forEach((e) => e.els && light(e.els, false));
    const was = evs.length > 0;
    evs = [];
    if (was && onState) onState(false);
  }
  function play(list) {
    stop();
    const a = audio();
    const t0 = a.ac.currentTime + 0.06;
    let end = 0;
    for (const e of list) {
      if (e.midi != null) nodes.push(...tone(e.midi, t0 + e.t, e.dur, e));
      end = Math.max(end, e.t + (e.dur || 0), e.t + (e.hold || 0));
    }
    evs = list.map((e) => ({ ...e, on: false }));
    if (onState) onState(true);
    stopRaf = ctx.raf(() => {
      const now = a.ac.currentTime - t0;
      for (const e of evs) {
        if (!e.els) continue;
        const on = now >= e.t && now < e.t + (e.hold != null ? e.hold : e.dur);
        if (on !== e.on) { e.on = on; light(e.els, on); if (on && e.onStart) e.onStart(); }
      }
      if (now > end + 0.5) stop();
    });
  }
  ctx.onCleanup(stop);
  return { play, stop, get playing() { return evs.length > 0; } };
}
// Log-spaced spectrum bars from the shared analyser.
function drawSpectrum(v) {
  const { g, w, h: hh } = v;
  g.clearRect(0, 0, w, hh);
  if (!AC) {
    g.fillStyle = "#8a8577"; g.font = `11px ${FONT}`; g.textBaseline = "middle";
    g.fillText("按播放後顯示 AnalyserNode 即時頻譜", 8, hh / 2);
    return;
  }
  AC.an.getByteFrequencyData(AC.fq);
  const n = Math.min(96, Math.floor(w / 5)), bw = w / n;
  for (let i = 0; i < n; i++) {
    const a = Math.floor(2 * Math.pow(220, i / n)), b = Math.max(a + 1, Math.floor(2 * Math.pow(220, (i + 1) / n)));
    let m = 0;
    for (let j = a; j < b; j++) m = Math.max(m, AC.fq[j]);
    const bh = (m / 255) * hh;
    if (bh < 0.5) continue;
    g.fillStyle = `hsl(${330 - (i / n) * 140} 80% 52%)`;
    g.fillRect(i * bw + 0.5, hh - bh, Math.max(1, bw - 1), bh);
  }
}
function meter(ctx, host) { const v = canvasIn(ctx, host); ctx.raf(() => drawSpectrum(v)); }
const fail = (ctx, what) => (e) => {
  console.error(`[vexflow] ${what}`, e);
  if (ctx.active) ctx.status("").error(`${what}失敗：${e && e.message ? e.message : e}`);
};
// Standard card: caption row, score paper, optional spectrum meter.
const SHEET = (meterOn = true, cls = "") => `<div class="vf-board"><div class="vf-sheet"><div class="vf-cap"><b class="vf-t"></b><span class="vf-s"></span><span class="vf-r"></span></div><div class="vf-paper ${cls}"></div>${meterOn ? '<div class="vf-meter"></div>' : ""}</div></div>`;
const playLabel = (b) => (on) => (b.textContent = on ? "■ 停止" : "▶ 播放");

// ---------- scene data ----------
const RHYTHMS = [
  { name: "4/4 八分音符", time: "4/4", alt: "2/4", src: "c5:8 d5:8 e5:8 f5:8 g5:8 a5:8 g5:8 e5:8 | f5:8 d5:8 b4:8 g4:8 c5:h" },
  { name: "3/4 附點", time: "3/4", alt: "3/4", src: "g4:q b4:8 d5:8 g5:8 d5:8 | e5:qd d5:8 c5:8 b4:8" },
  { name: "6/8 複合拍", time: "6/8", alt: "6/8", src: "c5:8 e5:8 g5:8 a5:8 g5:8 e5:8 | d5:q e5:8 c5:qd" },
  { name: "十六分音符", time: "4/4", alt: "2/4", src: "c5:16 d5:16 e5:16 f5:16 g5:8 e5:8 c5:16 e5:16 g5:16 c6:16 b5:8 r:8 | a5:16 g5:16 f5:16 e5:16 d5:8d c5:16 b4:q r:q" },
  { name: "三連音", time: "4/4", alt: "2/4", src: "[3 c5:8 d5:8 e5:8 ] [3 f5:8 g5:8 a5:8 ] g5:q e5:q | [3 d5:q e5:q f5:q ] e5:h" },
  { name: "附點與休止符", time: "4/4", alt: "2/4", src: "g4:qd a4:8 b4:q r:8 b4:8 | c5:8d b4:16 a4:8d g4:16 r:q g4:q" },
];
// [key, duration, measure]
const PHRASE = [["e/5", "q", 0], ["f/5", "8", 0], ["g/5", "8", 0], ["a/5", "q", 0], ["a/5", "8", 0], ["f/5", "8", 0],
  ["f/5", "8", 1], ["e/5", "8", 1], ["d/5", "q", 1], ["c/5", "h", 1]];
// [label, scale degree, raise the third, add a seventh]
const PROG = [["I", 0], ["vi", 5], ["IV", 3], ["ii", 1], ["V7/V", 1, 1, 1], ["V", 4], ["V7", 4, 0, 1], ["I", 0]];
const SATB = {
  S: { clef: "treble", stem: 1, color: "#d6336c", name: "女高音", bars: "e5:q d5:q c5:q d5:q | e5:q e5:q e5:h | d5:q d5:q d5:h | e5:q g5:q g5:h" },
  A: { clef: "treble", stem: -1, color: "#1c7ed6", name: "女低音", bars: "c5:q b4:8 a4:8 a4:q b4:q | c5:q c5:q c5:8 b4:8 c5:q | b4:8 a4:8 g4:q b4:h | c5:8 d5:8 e5:q e5:h" },

      ctx.html(`<div class="vf-stress vf-sheet"><div class="vf-cap"><b class="vf-t">尚未測試</b></div><div class="vf-paper"></div></div>`);
      ctx.controls.classList.add("bottom");
      const paper = ctx.$(".vf-paper"), tEl = ctx.$(".vf-t");
      let canvas = false;
      ctx.group(["SVG", "Canvas"], 0, (i) => (canvas = i === 1));
      const RHY = [["8", "8", "8", "8", "q", "q"], ["q", "q", "h"], ["8", "8", "q", "8", "8", "q"], ["qd", "8", "q", "q"], ["h", "q", "8", "8"], ["q", "8", "8", "8", "8", "q"]];
      function gen(n) {
        let s = 20240611, p = 9;
        const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
        return Array.from({ length: n }, () => RHY[Math.floor(rnd() * RHY.length)].map((d) => {
          p = Math.max(2, Math.min(12, p + Math.floor(rnd() * 5) - 2)); // diatonic steps from C4
          const L = LETTERS[p % 7], o = 4 + Math.floor(p / 7), r = rnd();
          return { d, key: `${L.toLowerCase()}${r < 0.08 ? "#" : r < 0.14 ? "b" : ""}/${o}` };
        }));
      }
      ctx.bench({
        label: "小節數", unit: "小節", sizes: [16, 64, 128, 256, 512, 1024],
        prepare: (n) => gen(n),
        run(n, bars) {
          const LW = 900, per = 4, RH = 100, rows = Math.ceil(n / per), CHUNK = 60;
          paper.innerHTML = "";
          const ex = leadW((s) => s.addClef("treble").addTimeSignature("4/4")), ex1 = leadW((s) => s.addClef("treble"));
          let vctx = null, base = 0, sheets = 0;
          const ensure = (row) => {
            if (!canvas) { if (!vctx) vctx = surface(paper, LW, rows * RH + 20); return 0; }
            if (!vctx || row - base >= CHUNK) {
              base = row;
              const cv = document.createElement("canvas");
              paper.append(cv);
              vctx = new Renderer(cv, Renderer.Backends.CANVAS).getContext();
              vctx.resize(LW, Math.min(CHUNK, rows - row) * RH + 20, 1);
              sheets++;
            }
            return base * RH;
          };
          grid(n, per, LW, (r) => (r ? ex1 : ex)).forEach(({ i, row, first, x, w }) => {
            const off = ensure(row);
            const stave = new Stave(x, 10 + row * RH - off, w);
            if (first) stave.addClef("treble");
            if (i === 0) stave.addTimeSignature("4/4");
            if (i === n - 1) stave.setEndBarType(VF.BarlineType.END);
            stave.setContext(vctx).draw();
            const notes = bars[i].map(({ d, key }) => {
              const nn = new StaveNote({ keys: [key], duration: d, autoStem: true });
              if (d.includes("d")) Dot.buildAndAttach([nn], { all: true });
              return nn;
            });
            const voice = new Voice("4/4").addTickables(notes);
            Accidental.applyAccidentals([voice], "C");
            const beams = Beam.generateBeams(notes);
            new Formatter().joinVoices([voice]).format([voice], avail(stave));
            voice.draw(vctx, stave);
            beams.forEach((b) => b.setContext(vctx).draw());
          });
          const nodes = canvas ? 0 : paper.querySelectorAll("svg *").length;
          tEl.textContent = `${n} 小節・${rows} 行・${canvas ? `${sheets} 張 Canvas` : `${Showcase.fmtCompact(nodes)} 個 SVG 元素`}`;
          return canvas ? `Canvas ${sheets} 張` : `SVG ${nodes} 個元素`;
        },
        note: "耗時包含建立音符物件、比對調號補臨時記號、自動符槓、間距計算與實際繪製，大致隨小節數線性成長。SVG 的成本多在建立 DOM 節點；Canvas 省掉節點，但畫完就是點陣圖，無法再對單一音符加事件或改樣式。超過 2 秒的級距之後略過。",
      });
    },
  },
];

// Music fonts (Bravura, Academico) are bundled in this build; wait for them so glyph metrics are right.
Promise.all([document.fonts.load("30px Bravura"), document.fonts.load("12px Academico")])
  .catch((e) => console.warn("[vexflow] font preload failed", e))
  .then(() => Showcase.run({ scenes: SCENES }));
</script>
</body>
</html>
