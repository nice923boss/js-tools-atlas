<script src="https://cdn.jsdelivr.net/npm/video.js@8.24.1/dist/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/video.js@8.24.1/dist/lang/zh-TW.js"></script>
<script src="_shared/showcase.js"></script>
<script>
// Video.js showcase: course player, responsive layout, skins, text tracks, playlist, events, plugins, and a multi-player ramp.
const HLS = { src: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", type: "application/x-mpegURL" };
const CLIPS = [
  { title: "測試片 A：暖色四段", src: { src: "assets/videojs/clip-a.mp4", type: "video/mp4" }, poster: "assets/videojs/clip-a.jpg", names: ["開場", "色彩", "動態", "結尾"] },
  { title: "測試片 B：冷色四段", src: { src: "assets/videojs/clip-b.mp4", type: "video/mp4" }, poster: "assets/videojs/clip-b.jpg", names: ["潛入", "珊瑚", "暗流", "浮出"] },
];
const pad = (n, w = 2) => String(n).padStart(w, "0");
const mmss = (s) => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
const sec = (s) => (Number.isFinite(s) ? s.toFixed(2) : "…");

// Create a Video.js player inside host; disposed (element removed) when the scene unmounts.
function makePlayer(ctx, host, options, cls = "") {
  const v = document.createElement("video");
  v.className = `video-js ${cls}`;
  v.setAttribute("playsinline", "");
  host.prepend(v);
  const p = videojs(v, { language: "zh-TW", controls: true, preload: "auto", ...options });
  ctx.onCleanup(() => p.dispose());
  return p;
}

// Local clips are fetched once and played from per-scene Blob URLs, so disposing a player
// never cancels a half-finished media request (the file is already in memory).
const clipBlobs = new Map();
function clipBlob(src) {
  if (!clipBlobs.has(src)) {
    clipBlobs.set(src, fetch(src).then((r) => {
      if (!r.ok) throw new Error(`無法載入 ${src}（HTTP ${r.status}）`);
      return r.blob();
    }).catch((e) => { clipBlobs.delete(src); throw e; }));
  }
  return clipBlobs.get(src);
}
async function clipUrl(ctx, clip) {
  const blob = await clipBlob(clip.src.src);
  if (!ctx.active) throw new DOMException("Scene unmounted", "AbortError");
  const url = URL.createObjectURL(blob);
  ctx.onCleanup(() => URL.revokeObjectURL(url));
  return url;
}
async function useClip(ctx, player, clip) {
  player.poster(clip.poster);
  player.src({ src: await clipUrl(ctx, clip), type: "video/mp4" });
}
const quiet = (e) => { if (e.name !== "AbortError") throw e; };
const each = (list) => Array.from({ length: list.length }, (_, i) => list[i]);

// WebVTT text -> Blob URL, revoked on cleanup.
function vttUrl(ctx, cues) {
  const ts = (s) => `00:${pad(Math.floor(s / 60))}:${(s % 60).toFixed(3).padStart(6, "0")}`;
  const body = "WEBVTT\n\n" + cues.map(([a, b, text], i) => `${i + 1}\n${ts(a)} --> ${ts(b)}\n${text}\n`).join("\n");
  const url = URL.createObjectURL(new Blob([body], { type: "text/vtt" }));
  ctx.onCleanup(() => URL.revokeObjectURL(url));
  return url;
}

// Chapter list (button rows with progress bars) that seeks the player.
function chapterList(ol, chapters, onPick) {
  return chapters.map(([t, name], i) => {
    const b = Showcase.h("button", { type: "button", onclick: () => onPick(t, i) },
      Showcase.h("span", { class: "t", text: mmss(t) }), Showcase.h("span", { text: `${i + 1}. ${name}` }),
      Showcase.h("span", { class: "p" }, Showcase.h("i")));
    ol.append(Showcase.h("li", {}, b));
    return b;
  });
}
function paintChapters(items, chapters, t, dur) {
  let onIdx = -1;
  chapters.forEach(([start], i) => {
    const end = i + 1 < chapters.length ? chapters[i + 1][0] : dur;
    const on = t >= start && t < end;
    if (on) onIdx = i;
    items[i].classList.toggle("on", on);
    items[i].querySelector(".p i").style.width = `${Math.max(0, Math.min(1, (t - start) / (end - start))) * 100}%`;
  });
  return onIdx;
}
// Scroll a list container (not the page) so the item is visible.
function keepVisible(box, item) {
  const r = item.getBoundingClientRect(), b = box.getBoundingClientRect();
  if (r.top < b.top) box.scrollTop -= b.top - r.top + 4;
  else if (r.bottom > b.bottom) box.scrollTop += r.bottom - b.bottom + 4;
}

const CLIP_CHAPTERS = (clip) => clip.names.map((n, i) => [i * 3, `${n}`]);
const SUBS = {
  zh: [
    [0.3, 1.5, "這是 Atlas 自製的 12 秒測試片"], [1.6, 2.9, "大字是時間碼，精確到百分之一秒"],
    [3.1, 4.4, "第 2 段：畫面轉成橘色系"], [4.5, 5.9, "每到整秒會聽到一聲短嗶"],
    [6.1, 7.4, "第 3 段：小球沿著橢圓軌道繞行"], [7.5, 8.9, "背景格線一直向左捲動"],
    [9.1, 10.4, "第 4 段：進入結尾"], [10.5, 11.9, "進度條填滿，影片結束"],
  ],
  en: [
    [0.3, 1.5, "A 12-second test clip made for Atlas"], [1.6, 2.9, "The big digits are a timecode in 1/100 s"],
    [3.1, 4.4, "Section 2: the palette turns orange"], [4.5, 5.9, "A short beep marks every whole second"],
    [6.1, 7.4, "Section 3: the ball orbits an ellipse"], [7.5, 8.9, "The grid keeps scrolling to the left"],
    [9.1, 10.4, "Section 4: the ending"], [10.5, 11.9, "The progress bar fills up and the clip ends"],
  ],
};

// Custom Component, Button and advanced Plugin; registered once per page.
function registerAtlasParts() {
  if (videojs.getComponent("AtlasLoopButton")) return;
  const Button = videojs.getComponent("Button");
  const Component = videojs.getComponent("Component");
  const Plugin = videojs.getPlugin("plugin");

  class AtlasLoopButton extends Button {
    constructor(player, options) {
      super(player, options);
      this.a = null;
      this.b = null;
      this.on(player, "timeupdate", () => {
        if (this.b != null && player.currentTime() >= this.b) player.currentTime(this.a);
      });
      this.paint();
    }
    buildCSSClass() { return `vj-ab ${super.buildCSSClass()}`; }
    handleClick() {
      const t = this.player().currentTime();
      if (this.a == null) this.a = t;
      else if (this.b == null && t > this.a + 0.2) this.b = t;
      else this.a = this.b = null;
      this.paint();
      this.player().trigger({ type: "abloopchange", a: this.a, b: this.b });
    }
    paint() {
      const label = this.a == null ? "A-B" : this.b == null ? `A ${this.a.toFixed(1)}` : `${this.a.toFixed(1)}~${this.b.toFixed(1)}`;
      this.el().querySelector(".vjs-icon-placeholder").textContent = label;
      this.toggleClass("armed", this.a != null);
      this.controlText(this.a == null ? "設定 A 點" : this.b == null ? "設定 B 點" : "清除 A-B 循環");
    }
  }
  videojs.registerComponent("AtlasLoopButton", AtlasLoopButton);

  class AtlasBadge extends Component {
    createEl() { return super.createEl("div", { className: "vj-badge" }); }
    text(t) { this.el().textContent = t; }
  }
  videojs.registerComponent("AtlasBadge", AtlasBadge);

  class AtlasMarkers extends Plugin {
    constructor(player, options) {
      super(player);
      this.markers = options.markers;
      this.last = -2;
      this.els = [];
      this.badge = player.addChild("AtlasBadge");
      const draw = () => {
        const holder = player.el().querySelector(".vjs-progress-holder");
        const d = player.duration();
        if (!holder || !d) return;
        this.els.forEach((e) => e.remove());
        this.els = this.markers.slice(1).map((m) => {
          const e = Showcase.h("div", { class: "vj-mark tip" });
          e.style.left = `${(m.time / d) * 100}%`;
          holder.append(e);
          return e;
        });
      };
      this.on(player, "loadedmetadata", draw);
      this.on(player, "timeupdate", () => this.tick());
      if (player.duration()) draw();
    }
    tick() {
      const t = this.player.currentTime();
      let idx = -1;
      this.markers.forEach((m, i) => { if (t >= m.time) idx = i; });
      if (idx === this.last) return;
      this.last = idx;
      this.badge.text(idx >= 0 ? this.markers[idx].label : "");
      this.trigger("markerchange", { index: idx, marker: this.markers[idx] || null });
    }
    jump(i) { this.player.currentTime(this.markers[i].time + 0.05); }
    dispose() { this.els.forEach((e) => e.remove()); super.dispose(); }
  }
  videojs.registerPlugin("atlasMarkers", AtlasMarkers);
}

Showcase.run({ scenes: [
  {
    id: "course", title: "課程播放器",
    api: "videojs(el, { playbackRates, controlBar, sources })",
    desc: "原版招牌：HLS 串流（內建 VHS）、繁中介面、自訂皮膚、章節列表與進度列標記，按播放時從上次觀看位置繼續。",
    hint: "點章節跳轉・右下齒輪可調速度・空白鍵播放",
    mount(ctx) {
      ctx.html(`<div class="vj-wrap vj-side">
        <div class="vj-main">
          <div class="vj-head"><span class="vj-pill">網頁動畫實戰課</span><b>第 3 講：用短片學分鏡節奏</b></div>
          <div class="vj-frame"><div class="vj-toast">上次看到 01:20，按播放從這裡繼續</div></div>
          <div class="vj-meta"><span>畫質 <b data-q>按播放後偵測</b></span><span>進度 <b data-pct>0%</b></span><span class="vj-keys">快捷鍵：空白鍵播放、方向鍵快轉</span></div>
        </div>
        <div class="vj-panel"><h3>課程章節 <small>示意</small></h3><div class="vj-scroll"><ol class="vj-list"></ol></div></div>
      </div>`);
      const RESUME_AT = 80;
      const CHAPTERS = [[0, "片頭與森林早晨"], [72, "大兔子登場"], [150, "三個搗蛋鬼"], [255, "蝴蝶事件"], [345, "反擊計畫"], [450, "陷阱大作戰"], [555, "片尾字幕"]];
      const player = makePlayer(ctx, ctx.$(".vj-frame"), {
        fill: true, poster: "assets/videojs/poster.jpg",
        playbackRates: [0.75, 1, 1.25, 1.5, 2], userActions: { hotkeys: true },
        controlBar: { skipButtons: { forward: 10, backward: 10 }, pictureInPictureToggle: false },
      }, "vjs-atlas");
      // VHS downloads the playlist and first segment as soon as it has a source, whatever preload says,
      // so the stream is attached on the learner's first press instead of at page load.
      let attached = false;
      const ensureSource = () => {
        if (attached) return;
        attached = true;
        ctx.$("[data-q]").textContent = "偵測中";
        player.src(HLS);
      };
      ctx.on(player.el(), "pointerdown", ensureSource, true);
      ctx.on(player.el(), "keydown", ensureSource, true);
      const box = ctx.$(".vj-scroll");
      // The resume seek waits for the first play: seeking at mount would make VHS fetch segments
      // around 01:20 before the learner has even pressed play.
      let pending = RESUME_AT;
      const items = chapterList(ctx.$(".vj-list"), CHAPTERS, (t) => {
        pending = null;
        ensureSource();
        if (player.readyState() >= 1) player.currentTime(t + 0.1);
        else player.one("loadedmetadata", () => player.currentTime(t + 0.1));
        player.play();
      });
      const update = () => {
        const t = pending ?? player.currentTime(), dur = player.duration() || 634;
        ctx.$("[data-pct]").textContent = `${Math.round((t / dur) * 100)}%`;
        const i = paintChapters(items, CHAPTERS, t, dur);
        if (i >= 0 && player.hasStarted() && !player.paused()) keepVisible(box, items[i]);
      };
      player.on("play", () => {
        ctx.$(".vj-toast").style.opacity = 0;
        if (pending == null) return;
        const target = pending;

        async apply(n) {
          while (players.length > n) players.pop().dispose();
          while (players.length < n && ctx.active) { add(); await ctx.frame(1); }
          layout();
        },
        metrics: () => {
          let dropped = 0, playing = 0;
          for (const p of players) {
            const q = p.getVideoPlaybackQuality() || {};
            dropped += q.droppedVideoFrames || 0;
            if (!p.paused() && p.readyState() >= 3) playing++;
          }
          return { "播放中": `${playing} / ${players.length}`, "建立實例": `${avg(initMs).toFixed(1)} ms`, "到開始播放": firstMs.length ? `${avg(firstMs).toFixed(0)} ms` : "…", "累計掉格": dropped };
        },
        note: "每個播放器都是獨立的 Video.js 實例加一個 <video> 解碼器。「建立實例」是 videojs() 同步建立元件樹的時間，「到開始播放」含載入與解碼第一格。上限通常卡在影片解碼（硬體解碼器數量或 CPU 軟解），不是 Video.js 本身；掉格數上升代表解碼跟不上。",
      });
      layout();
    },
  },
] });
</script>
</body>
</html>
