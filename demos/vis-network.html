// ---------- shared helpers ----------
const css = getComputedStyle(document.documentElement);
const V = (n) => css.getPropertyValue(n).trim();
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map(V);
const FONT = V("--font"), MONO = V("--mono");
const BG = "#0e1013", FG = "#ecebe6", MUTED = "#9b998f", CARD = "#1d2229";

const ms = (v) => (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.round(v).toString());
const EASE = { duration: 650, easingFunction: "easeInOutQuad" };
const tint = (c) => ({ background: CARD, border: c, highlight: { background: "#2b313b", border: c }, hover: { background: "#262c35", border: c } });

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Create a network, keep it sized to its container, destroy it on unmount.
function vnet(ctx, el, data, options, onResize) {
  const net = new vis.Network(el, data, options);
  let lw = el.clientWidth, lh = el.clientHeight;
  const ro = new ResizeObserver(() => {
    if (el.clientWidth === lw && el.clientHeight === lh) return;
    lw = el.clientWidth; lh = el.clientHeight;
    net.setSize("100%", "100%");
    net.redraw();
    if (onResize) onResize(); else net.fit();
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); net.destroy(); });
  return net;
}

// Shared event-log column used by scenes 5 and 7.
function logger(ctx, list) {
  const t0 = performance.now();
  return (type, color, text) => {
    list.prepend(h("li", {}, h("time", { text: `${((performance.now() - t0) / 1000).toFixed(1)}s` }),
      h("code", { text: type, style: `color:${color}` }), h("span", { text, title: text })));
    while (list.children.length > 60) list.lastChild.remove();
  };
}

// ---------- 2. communities for the physics scene ----------
function communities(k, per, seed) {
  const r = rng(seed), nodes = [], edges = [], deg = {};
  const link = (a, b) => { edges.push({ from: a, to: b }); deg[a] = (deg[a] || 0) + 1; deg[b] = (deg[b] || 0) + 1; };
  for (let g = 0; g < k; g++) for (let i = 0; i < per; i++) {
    const id = g * per + i;
    nodes.push({ id, color: C[g % 6] });
    if (i) link(id, g * per + Math.floor(r() * r() * i));
    if (i > 3 && r() < 0.3) link(id, g * per + Math.floor(r() * i));
  }
  for (let g = 0; g < k; g++) link(g * per + Math.floor(r() * per), ((g + 1) % k) * per + Math.floor(r() * per));
  nodes.forEach((n) => { n.value = deg[n.id] || 1; });
  return { nodes, edges };
}
const PHYS = {
  barnesHut: { gravitationalConstant: -2600, centralGravity: 0.3, springConstant: 0.04, damping: 0.09 },

];

const BRANCH = { ceo: [C[0], "執行長室"], cto: [C[1], "技術"], coo: [C[2], "營運"], cfo: [C[3], "財務"] };

// ---------- 4. social network for clustering ----------
const CITIES = ["台北", "新北", "桃園", "台中", "台南", "高雄", "新竹", "花蓮"];
const CCOL = [...C, "#2ec4b6", "#ff595e"];
function social(seed) {
  const r = rng(seed), nodes = [], edges = [], deg = {};
  const link = (a, b) => { edges.push({ from: a, to: b }); deg[a] = (deg[a] || 0) + 1; deg[b] = (deg[b] || 0) + 1; };
  CITIES.forEach((city, g) => {
    const n = 18 + Math.floor(r() * 12), base = nodes.length;
    for (let i = 0; i < n; i++) {
      nodes.push({ id: base + i, city, color: CCOL[g], label: i ? undefined : city, title: i ? `${city}的使用者 #${i}` : `${city}社群中心` });
      if (i) link(base + i, base + (r() < 0.5 ? 0 : Math.floor(r() * i)));
      if (i > 4 && r() < 0.18) link(base + i, base + 1 + Math.floor(r() * (i - 1)));
    }
  });
  for (let k = 0; k < 22; k++) {
    const a = Math.floor(r() * nodes.length), b = Math.floor(r() * nodes.length);
    if (nodes[a].city !== nodes[b].city) link(a, b);
  }
  nodes.forEach((n) => { n.value = deg[n.id] || 1; });
  return { nodes, edges };
}

// ---------- 5. editor ----------
const LOCALE = { "zh-TW": {

const PROJ = [["React", C[1]], ["Vue", C[3]], ["Svelte", C[4]], ["Solid", C[5]], ["Angular", C[2]]];
function contributors(seed) {
  const r = rng(seed), A = ["kai", "mei", "lin", "yu", "hao", "ting", "wei", "an"], B = ["chen", "wang", "lee", "lin", "huang"];
  const nodes = PROJ.map(([id, col]) => ({ id, label: id, shape: "hexagon", size: 22, mass: 3, color: { background: col, border: col },
    font: { ...TXT, size: 15 } }));
  const edges = [];
  A.forEach((a) => B.forEach((b) => {
    const id = `@${a}.${b}`, p = PROJ[Math.floor(r() * PROJ.length)];
    nodes.push({ id, label: id, color: { background: p[1], border: p[1] } });
    edges.push({ from: id, to: p[0], color: { color: p[1], opacity: 0.5 } });
    const q = PROJ[Math.floor(r() * PROJ.length)];
    if (r() < 0.32 && q !== p) edges.push({ from: id, to: q[0], color: { color: q[1], opacity: 0.35 }, dashes: [3, 4] });
  }));
  return { nodes, edges };
}

// ---------- 8. clustered blobs for the stress test ----------
function blobs(n, seed) {
  const r = rng(seed), k = Math.max(1, Math.round(n / 80)), nodes = new Array(n), edges = [];
  const start = (c) => Math.floor((c * n) / k);
  for (let c = 0; c < k; c++) {
    const a = c * 2.39996, d = 230 * Math.sqrt(c), cx = Math.cos(a) * d, cy = Math.sin(a) * d, col = C[c % 6];
    const s = start(c), e = start(c + 1);
    for (let i = s; i < e; i++) {
      const ang = r() * 6.2832, rad = 85 * Math.sqrt(r());
      nodes[i] = { id: i, x: cx + Math.cos(ang) * rad, y: cy + Math.sin(ang) * rad, color: col };
      if (i > s) edges.push({ from: i, to: s + Math.floor(r() * (i - s)) });
      if (i > s + 2 && r() < 0.25) edges.push({ from: i, to: s + Math.floor(r() * (i - s)) });
    }
    if (c) edges.push({ from: s, to: start(Math.floor(r() * c)) });
  }
  return { nodes, edges };
}

Showcase.run({ scenes: [
  {
    id: "courses", title: "課程知識圖譜",
    api: "network.on('click') + nodes.update() + network.fit({ nodes })",
    desc: "30 門前端課程、40 條先修關係：點一門課，往回走出全部先修課並依建議順序編號，往前用虛線標出學完能接著學的課，鏡頭自動框住這段路徑；可切換力導向與階層排列。",
    hint: "點課程看先修路徑・點空白處回到全圖・拖曳節點會牽動整張網",
    mount(ctx) {
      ctx.html(`<div class="vnx-box vnx-side"></div>
        <div class="panel vnx-info"><h3 data-k="title"></h3><p data-k="desc"></p><div class="vnx-chips" data-k="pre"></div>

          <div class="vnx-legend">${Object.values(CGROUPS).map((g) => `<span><i style="background:${g.color}"></i>${g.label}</span>`).join("")}</div></div>`);
      const out = (k) => ctx.$(`[data-k="${k}"]`);
      const parents = {}, children = {};
      for (const [a, b] of PREREQ) { (parents[b] ||= []).push(a); (children[a] ||= []).push(b); }
      const depth = {};

    id: "shapes", title: "形狀與箭頭",
    api: "nodes.shape + ctxRenderer + edges.arrows.{to,middle,from}.type + smooth.type",
    desc: "15 種節點形狀一次排開，包含載入照片的 circularImage、image，以及用 ctxRenderer 直接在 Canvas 上自繪、每格重畫的環形量表；連線依序示範 11 種箭頭造型、中段箭頭、雙向與放大倍率，可切換曲線類型、虛線與陰影。",
    hint: "點節點看 shape 設定值・切換曲線類型・節點可拖曳",
    mount(ctx) {
      ctx.html(`<div class="vnx-box"></div><div class="panel vnx-tag" data-k="tag">點節點看 shape 設定值</div>`);
      const tag = ctx.$('[data-k="tag"]');
      const gauge = { v: 0.72 };
      const ring = ({ ctx: g, x, y, state: { selected, hover } }) => ({
        drawNode() {
          const r = 24, a0 = -Math.PI / 2;
          g.save();
          g.lineWidth = 7;
          g.strokeStyle = "#2a2f38";
          g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke();
          g.strokeStyle = C[0]; g.lineCap = "round";
          g.beginPath(); g.arc(x, y, r, a0, a0 + Math.PI * 2 * gauge.v); g.stroke();
          if (selected || hover) { g.lineWidth = 2; g.strokeStyle = FG; g.beginPath(); g.arc(x, y, r + 7, 0, Math.PI * 2); g.stroke(); }
          g.fillStyle = FG; g.font = `600 12px ${MONO}`; g.textAlign = "center"; g.textBaseline = "middle";
          g.fillText(`${Math.round(gauge.v * 100)}%`, x, y);
          g.restore();
        },
        drawExternalLabel() {
          g.save();
          g.textAlign = "center"; g.textBaseline = "top"; g.lineJoin = "round";
          g.font = `12px ${FONT}`; g.lineWidth = 3; g.strokeStyle = BG; g.fillStyle = FG;
          [["custom", 40], ["ctxRenderer 自繪", 55]].forEach(([s, dy]) => { g.strokeText(s, x, y + dy); g.fillText(s, x, y + dy); });
          g.restore();
        },
        nodeDimensions: { width: 62, height: 62 },
      });
      const nodes = SHAPE_LIST.map(([shape, zh], k) => {
        const row = Math.floor(k / 5), col = row % 2 ? 4 - (k % 5) : k % 5, c = C[k % 6];
        const n = { id: shape, x: col * 205, y: row * 165, shape, label: `${shape}\n${zh}`, color: INSIDE.has(shape) ? tint(c) : { background: c, border: c } };
        if (!INSIDE.has(shape)) n.size = 22;
        if (shape === "circularImage") Object.assign(n, { image: "_shared/img/photo-1.jpg", size: 28, borderWidth: 3 });
        if (shape === "image") Object.assign(n, { image: "_shared/img/photo-3.jpg", size: 30, shapeProperties: { useBorderWithImage: true }, color: tint(c) });
        if (shape === "custom") Object.assign(n, { ctxRenderer: ring, label: "custom\nctxRenderer 自繪" });
        if (shape === "text") n.font = { ...TXT, size: 15, color: c };
        return n;
      });
      const edges = ARROWS.map(([name, arrows], k) => ({ id: k, from: SHAPE_LIST[k][0], to: SHAPE_LIST[k + 1][0], arrows, label: name }));
      const net = vnet(ctx, ctx.$(".vnx-box"), { nodes, edges }, {
        nodes: { borderWidth: 2, margin: 10, font: { ...TXT, size: 12 } },
        edges: { width: 2, color: { color: "rgba(236,235,230,.5)", highlight: C[0], inherit: false }, smooth: { type: "continuous" },
          font: { face: MONO, size: 11, color: MUTED, strokeWidth: 3, strokeColor: BG, align: "top" } },
        physics: false,
        interaction: { hover: true },
      });
      net.on("click", (p) => {
        const id = p.nodes[0];
        const it = SHAPE_LIST.find((s) => s[0] === id);
        tag.innerHTML = it ? `<b>${it[1]}</b>　<span class="n">shape: "${it[0]}"</span>` : "點節點看 shape 設定值";
      });
      ctx.raf((t) => { gauge.v = 0.55 + 0.4 * Math.sin(t / 900); net.redraw(); });
      ctx.select("曲線", [{ value: "none", label: "直線（false）" }, ...SMOOTH], "continuous", (v) =>
        net.setOptions({ edges: { smooth: v === "none" ? false : { enabled: true, type: v, roundness: 0.5 } } }));
      ctx.toggle("虛線", false, (v) => net.setOptions({ edges: { dashes: v } }));
      ctx.toggle("陰影", false, (v) => net.setOptions({ nodes: { shadow: { enabled: v, color: "rgba(0,0,0,.7)", size: 14 } } }));
    },
  },
  {
    id: "events", title: "事件與鏡頭",
    api: "network.on('click' | 'hoverNode' | 'zoom' | 'afterDrawing' …) + focus() + canvasToDOM()",
    desc: "5 個開源專案與 40 位貢獻者。右側即時記錄 click、doubleClick、oncontext、hoverNode、selectNode、dragStart、dragEnd、zoom、animationFinished；選取節點後，afterDrawing 每格用 canvasToDOM() 把 HTML 資訊卡釘在節點上方，物理晃動與鏡頭移動時一起跟著走。「鏡頭導覽」用 focus() 依序飛到每個專案。",
    hint: "點節點顯示資訊卡・雙擊聚焦・右鍵、拖曳、滾輪都會記錄事件",
    mount(ctx) {
      ctx.html(`<div class="vnx-box vnx-logside"></div><div class="panel vnx-log"><h3>事件日誌</h3><ol></ol></div><div class="panel vnx-card" hidden></div>`);
      const box = ctx.$(".vnx-box"), card = ctx.$(".vnx-card");
      const log = logger(ctx, ctx.$(".vnx-log ol"));
      const g = contributors(21);
      const nodes = new vis.DataSet(g.nodes);
      let easing = "easeInOutCubic", sel = null, tour = 0, lastZoom = 0;
      const anim = (duration = 900) => ({ duration, easingFunction: easing });
      const net = vnet(ctx, box, { nodes, edges: new vis.DataSet(g.edges) }, {
        nodes: { shape: "dot", size: 7, borderWidth: 0, font: { ...TXT, size: 11, color: MUTED } },
        edges: { width: 1.3, smooth: false },
        physics: { solver: "barnesHut", barnesHut: { gravitationalConstant: -2600, springLength: 80, springConstant: 0.03, avoidOverlap: 0.3, damping: 0.15 }, stabilization: { iterations: 600 } },
        interaction: { hover: true },
        layout: { randomSeed: 9 },
      });
      const info = (id) => {
        const nb = net.getConnectedNodes(id);
        return PROJ.some((p) => p[0] === id) ? `<b>${id}</b><span>${nb.length} 位貢獻者</span>` : `<b>${id}</b><span>參與 ${nb.join("、")}</span>`;
      };
      const select = (id) => { sel = id; if (id != null) card.innerHTML = info(id); net.redraw(); };
      net.on("afterDrawing", () => {
        const p = sel != null && net.getPositions([sel])[sel];
        if (!p) { card.hidden = true; return; }
        const d = net.canvasToDOM(p);
        card.hidden = false;
        card.style.left = `${box.offsetLeft + d.x}px`;
        card.style.top = `${box.offsetTop + d.y}px`;
      });
      const stopTour = () => { tour++; };
      net.on("click", (p) => {
        stopTour();
        const what = p.nodes.length ? p.nodes[0] : p.edges.length ? "連線" : `畫布 (${Math.round(p.pointer.canvas.x)}, ${Math.round(p.pointer.canvas.y)})`;
        log("click", C[0], what);
      });
      net.on("doubleClick", (p) => {
        if (!p.nodes.length) return;
        log("doubleClick", C[0], `${p.nodes[0]} 聚焦`);
        net.focus(p.nodes[0], { scale: 1.4, locked: false, animation: anim() });
      });
      net.on("oncontext", (p) => {
        p.event.preventDefault();
        const id = net.getNodeAt(p.pointer.DOM);
        log("oncontext", C[2], id != null ? `右鍵 ${id}` : "右鍵畫布");
      });
      net.on("hoverNode", (p) => log("hoverNode", C[5], p.node));
      net.on("selectNode", (p) => { select(p.nodes[0]); log("selectNode", C[3], `${p.nodes[0]}，相連 ${net.getConnectedNodes(p.nodes[0]).length} 個`); });
      net.on("deselectNode", (p) => { if (!p.nodes.length) { select(null); log("deselectNode", C[3], "清除選取"); } });
      net.on("dragStart", (p) => { stopTour(); if (p.nodes.length) log("dragStart", C[4], p.nodes[0]); });
      net.on("dragEnd", (p) => { if (p.nodes.length) log("dragEnd", C[4], `${p.nodes[0]} 放開`); });
      net.on("zoom", (p) => {
        stopTour();
        const now = performance.now();
        if (now - lastZoom > 300) { lastZoom = now; log("zoom", C[1], `${p.direction} scale ${p.scale.toFixed(2)}`); }
      });
      net.on("animationFinished", () => log("animationFinished", MUTED, `scale ${net.getScale().toFixed(2)}`));
      async function runTour() {
        const my = ++tour;
        for (const [id] of PROJ) {
          if (my !== tour) return;
          net.selectNodes([id]);
          select(id);
          net.focus(id, { scale: 1.05, locked: false, animation: anim() });
          await ctx.sleep(2100);
        }
        if (my === tour) net.fit({ animation: anim() });
      }
      ctx.button("鏡頭導覽", runTour, { primary: true });
      ctx.button("全覽", () => { stopTour(); net.fit({ animation: anim(700) }); });
      ctx.select("緩動", ["linear", "easeInOutQuad", "easeInOutCubic", "easeInOutQuart", "easeOutQuint", "easeInQuad"], easing, (v) => { easing = v; });
      let started = false;
      const kick = () => { if (!started) { started = true; runTour(); } };
      net.once("stabilized", () => ctx.timeout(kick, 300));
      ctx.timeout(kick, 5000);
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "physics.barnesHut + network.moveTo({ position, scale }) 每格呼叫",
    desc: "每一格都用 moveTo() 改縮放與平移強迫整張圖重畫；物理開啟時，同一格還要跑 Barnes-Hut 力學步驟。節點逐級增加（邊約 1.25 倍）直到掉到 30 FPS 以下；可關掉物理只量繪圖，或改成曲線邊比較成本。",
    hint: "按「自動加壓」開始；切換物理或曲線邊後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="vnx-stress"></div>`);
      const host = ctx.$(".vnx-stress");
      let net = null, n = 250, edgeCount = 0, buildMs = 0, physics = true, curved = false, view = null;
      const kill = () => { if (net) { net.destroy(); net = null; } view = null; };
      ctx.onCleanup(kill);
      const measure = () => {
        if (!net) return;
        net.fit();
        view = { scale: net.getScale(), ...net.getViewPosition() };
      };
      function build() {
        kill();
        const box = h("div", { class: "vnx-fill" });
        host.replaceChildren(box);
        const g = blobs(n, 11);
        edgeCount = g.edges.length;
        const t = performance.now();
        net = new vis.Network(box, { nodes: g.nodes, edges: g.edges }, {
          nodes: { shape: "dot", size: 4, borderWidth: 0 },
          edges: { width: 0.6, color: { color: "rgba(160,166,178,.45)", inherit: false }, smooth: curved ? { enabled: true, type: "continuous" } : false },
          physics: { enabled: physics, solver: "barnesHut", stabilization: false, minVelocity: 0.5,
            barnesHut: { gravitationalConstant: -900, centralGravity: 0.05, springLength: 25, springConstant: 0.04, damping: 0.25 } },
          layout: { improvedLayout: false },
          interaction: { dragNodes: false, dragView: false, zoomView: false, selectable: false, hover: false },
        });
        buildMs = performance.now() - t;
        measure();
      }
      ctx.onResize(() => { if (net) { net.setSize("100%", "100%"); measure(); } });
      ctx.raf((t) => {
        if (!net || !view) return;
        net.moveTo({
          position: { x: view.x + Math.sin(t / 1700) * 120 / view.scale, y: view.y + Math.cos(t / 2300) * 80 / view.scale },
          scale: view.scale * (1.05 + 0.2 * Math.sin(t / 1100)),
          animation: false,
        });
      });
      ctx.toggle("物理模擬", physics, (v) => { physics = v; if (net) net.setOptions({ physics: { enabled: v } }); });
      ctx.toggle("曲線邊", curved, (v) => { curved = v; if (net) net.setOptions({ edges: { smooth: v ? { enabled: true, type: "continuous" } : false } }); });
      ctx.controls.classList.add("bottom");
      build();
      ctx.ramp({
        label: "節點", steps: [250, 500, 1000, 2000, 4000, 8000, 16000], minFps: 30,
        apply(count) { n = count; build(); },
        metrics: () => ({ "邊": edgeCount, "建立": Showcase.fmtMs(buildMs), "物理": physics ? "開" : "關", "邊型": curved ? "曲線" : "直線" }),
        note: "每格都改變縮放與平移，Canvas 2D 必須重畫所有節點與邊；物理開啟時，每次重畫前還要建一次 Barnes-Hut 四元樹並計算斥力與彈簧力（約 O(n log n)），小規模時模擬可能在量測期間收斂而停下。曲線邊要多算貝茲控制點與分段繪製。建立耗時含資料轉換與網路初始化。",
      });
    },
  },
] });
</script>
</body>
</html>
