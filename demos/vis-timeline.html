const hms = (d) => `${hm(d)}:${pad(d.getSeconds())}`;
const md = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
const ANIM = { animation: { duration: 650, easingFunction: "easeInOutQuad" } };

// Traditional Chinese axis labels instead of moment's English month names.
const FORMAT = {
  minorLabels(date, scale) {
    const d = new Date(+date);
    switch (scale) {
      case "millisecond": return `${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3, "0")}`;
      case "second": return `:${pad(d.getSeconds())}`;
      case "minute": case "hour": return hm(d);
      case "weekday": return `${d.getDate()} 日（${WEEK[d.getDay()]}）`;
      case "day": return `${d.getDate()} 日`;
      case "week": return md(d);
      case "month": return `${d.getMonth() + 1} 月`;
      default: return `${d.getFullYear()}`;
    }
  },
  majorLabels(date, scale) {
    const d = new Date(+date);
    switch (scale) {
      case "millisecond": case "second": return `${d.getMonth() + 1} 月 ${d.getDate()} 日 ${hm(d)}`;
      case "minute": case "hour": return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日（${WEEK[d.getDay()]}）`;
      case "weekday": case "day": case "week": return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
      case "month": return `${d.getFullYear()} 年`;
      default: return "";
    }
  },
};
// Graph2d's option validator only accepts the object form (moment format strings).
const FORMAT_G2D = {
  minorLabels: { millisecond: "SSS", second: "ss", minute: "HH:mm", hour: "HH:mm", weekday: "D 日", day: "D 日", week: "M/D", month: "M 月", year: "YYYY" },
  majorLabels: { millisecond: "HH:mm:ss", second: "M/D HH:mm", minute: "YYYY/M/D", hour: "YYYY/M/D", weekday: "YYYY 年 M 月", day: "YYYY 年 M 月", week: "YYYY 年 M 月", month: "YYYY 年", year: "" },
};
const LOCALE = { "zh-TW": { current: "目前", time: "時間", deleteSelected: "刪除所選" } };
const CORE = { locale: "zh-TW", locales: LOCALE, format: FORMAT, height: "100%" };
const BASE = { ...CORE, orientation: "top", tooltip: { followMouse: true, overflowMethod: "cap" } };

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// verticalScroll can leave a scroll event queued that lands after destroy() and hits nulled DOM refs; switch it off first.
function dispose(view) {
  view.options.verticalScroll = false;
  view.destroy();
}

// Create a Timeline or Graph2d, redraw it when its box changes size, destroy it on unmount.
function create(ctx, Ctor, el, ...args) {
  const view = new Ctor(el.appendChild(h("div", { class: "vtx-fill" })), ...args);
  const ro = new ResizeObserver(() => view.redraw());
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); dispose(view); });
  return view;
}

// Event log column used by scene 4.
function logger(ctx, list) {
  const t0 = performance.now();
  return (name, color, text) => {
    list.prepend(h("li", {}, h("time", { text: `${((performance.now() - t0) / 1000).toFixed(1)}s` }), h("code", { style: `color:${color}`, text: name }), h("span", { text, title: text })));
    while (list.children.length > 80) list.lastChild.remove();
  };
}

  },
  {
    id: "template", title: "範本與堆疊",
    api: "template(item) 回傳 DOM + stack + order(a, b) + cluster: { maxItems, titleTemplate }",
    desc: "16 檔展演活動擠在同一條泳道。template 回傳 DOM 元素，組出標題、城市與日期；stack 開啟時自動往下排避免重疊，order 決定先排誰；cluster 在縮小時把重疊的項目合成一顆數字，雙擊叢集會放大展開。（示意資料）",
    hint: "切換堆疊、重疊、叢集・滾輪縮小看叢集合併，雙擊叢集展開",
    mount(ctx) {
      ctx.html(`<div class="vtx-box"></div>`);
      const box = ctx.$(".vtx-box");
      const d = (m, day) => new Date(2026, m - 1, day);
      const items = new vis.DataSet(SHOWS.map(([content, city, s, e], i) => ({
        id: i, content, city, start: d(...s), end: d(...e), className: CITY[city], title: `${content}（${city}）${md(d(...s))}～${md(d(...e))}`,
      })));
      const template = (it) => (it && it.city
        ? h("div", { class: "vtx-show" }, h("b", { text: it.content }), h("span", {}, h("i", { text: it.city }), h("small", { text: `${md(it.start)}～${md(it.end)}` })))
        : (it && it.content) || "");
      const ORDER = [(a, b) => a.start - b.start, (a, b) => (b.end - b.start) - (a.end - a.start)];
      let mode = 0, sort = 0, tl = null, win = null;
      const build = () => {
        if (tl) { win = tl.getWindow(); dispose(tl); }
        const el = h("div", { class: "vtx-fill" });
        box.replaceChildren(el);
        tl = new vis.Timeline(el, items, {
          ...BASE,
          start: win ? win.start : d(9, 27), end: win ? win.end : new Date(2027, 0, 4), min: d(9, 1), max: new Date(2027, 1, 1), zoomMin: 5 * DAY,
          stack: mode !== 1, order: ORDER[sort], template, verticalScroll: true, margin: { item: { horizontal: 3, vertical: 5 } },
          cluster: mode === 2 ? { maxItems: 1, titleTemplate: "{count} 檔活動重疊，雙擊放大", showStipes: true, fitOnDoubleClick: true } : false,
        });
      };
      ctx.onCleanup(() => { if (tl) dispose(tl); });
      ctx.group(["堆疊", "重疊", "叢集"], 0, (i) => { mode = i; build(); }).classList.add("vtx-wrapseg");
      ctx.select("排序", [{ value: 0, label: "開始日期" }, { value: 1, label: "檔期長度" }], 0, (v) => { sort = +v; build(); });
      build();
    },
  },
  {
    id: "graph2d", title: "Graph2d 圖表",
    api: "new vis.Graph2d(el, items, groups, { interpolation, shaded, dataAxis, legend }) + on('rangechange')",
    desc: "同一套時間軸核心的另一個元件：Graph2d 用 DataSet 的 { x, y, group } 畫折線與長條，降雨量走右側 Y 軸。最高溫的 shaded 指向最低溫群組畫出溫差帶；下方 Timeline 標季節，兩者用 rangechange 互相 setWindow，拖曳或縮放任一邊都同步。（示意資料）",
    hint: "拖曳或滾輪縮放上方圖表，下方季節軸同步移動",
    mount(ctx) {
      ctx.html(`<div class="vtx-g2d"></div><div class="vtx-season"></div>`);
      const box = ctx.$(".vtx-g2d"), band = ctx.$(".vtx-season");
      const r = rng(26), pts = [];
      for (let y = 2024; y <= 2026; y++) {
        for (let m = 0; m < 12 && !(y === 2026 && m > 8); m++) {
          const x = new Date(y, m, 15);
          pts.push({ x, y: +(NORM.hi[m] + (r() - 0.5) * 2.6).toFixed(1), group: "hi" });
          pts.push({ x, y: +(NORM.lo[m] + (r() - 0.5) * 2.6).toFixed(1), group: "lo" });
          pts.push({ x, y: Math.round(NORM.rain[m] * (0.45 + r() * 1.1)), group: "rain" });
        }
      }
      let mode = 0, shade = true;
      const lineOpts = () => {
        const style = mode === 2 ? "points" : "line";
        return [
          { id: "hi", options: { style, shaded: { enabled: shade && mode !== 2, orientation: "group", groupId: "lo" } } },
          { id: "lo", options: { style } },
        ];
      };
      const groups = new vis.DataSet([
        { id: "hi", content: "最高溫", className: "vtx-hi" },
        { id: "lo", content: "最低溫", className: "vtx-lo" },
        { id: "rain", content: "降雨量", className: "vtx-rain", options: { style: "bar", yAxisOrientation: "right", drawPoints: false } },
      ]);
      groups.update(lineOpts());
      const range = { start: new Date(2024, 0, 1), end: new Date(2026, 9, 1), min: new Date(2023, 11, 1), max: new Date(2026, 10, 1), zoomMin: 120 * DAY };
      const g2d = create(ctx, vis.Graph2d, box, new vis.DataSet(pts), groups, {
        ...CORE, format: FORMAT_G2D, ...range,
        drawPoints: { enabled: true, size: 5, style: "circle" },
        interpolation: { enabled: true, parametrization: "centripetal" },
        barChart: { width: 12, align: "center" },
        dataAxis: { icons: false, left: { range: { min: 0, max: 40 }, title: { text: "氣溫 °C" } }, right: { title: { text: "降雨 mm" } } },
        legend: { enabled: true, left: { position: "top-left" }, right: { position: "top-right" } },
      });
      const seasons = [];
      for (let y = 2023; y <= 2026; y++) {
        if (y > 2023) {
          seasons.push({ id: `p${y}`, start: new Date(y, 4, 15), end: new Date(y, 5, 20), content: "梅雨季", className: "vtx-c2" });
          seasons.push({ id: `t${y}`, start: new Date(y, 6, 1), end: new Date(y, 8, 30), content: "颱風季", className: "vtx-c3" });
        }
        seasons.push({ id: `n${y}`, start: new Date(y, 9, 15), end: new Date(y + 1, 2, 15), content: "東北季風", className: "vtx-c4" });
      }
      const tl = create(ctx, vis.Timeline, band, new vis.DataSet(seasons), {
        ...BASE, ...range, stack: false, selectable: false, showMajorLabels: false, showMinorLabels: false,
        margin: { item: { horizontal: 0, vertical: 8 }, axis: 4 },
      });
      // Line the season band up with the Graph2d plot area (between its two Y axes).
      const align = () => {
        const c = box.querySelector(".vis-panel.vis-center");
        if (!c) return;
        const a = c.getBoundingClientRect(), b = box.getBoundingClientRect();
        band.style.left = `${10 + a.left - b.left}px`;
        band.style.right = `${10 + b.right - a.right}px`;
      };
      g2d.on("changed", align);
      ctx.onResize(() => ctx.timeout(align, 60));
      ctx.timeout(align, 120);
      const link = (a, b) => a.on("rangechange", (p) => { if (p.byUser) b.setWindow(p.start, p.end, { animation: false }); });
      link(g2d, tl);
      link(tl, g2d);
      ctx.group(["曲線", "折線", "散點"], 0, (i) => {
        mode = i;
        groups.update(lineOpts());
        g2d.setOptions({ interpolation: { enabled: i === 0, parametrization: "centripetal" } });
      }).classList.add("vtx-wrapseg");
      ctx.toggle("溫差帶", true, (v) => { shade = v; groups.update(lineOpts()); });
      ctx.toggle("降雨量", true, (v) => g2d.setOptions({ groups: { visibility: { rain: v } } }));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new vis.Timeline(el, DataSet(n)) + timeline.setWindow(start, end, { animation: false }) 每格呼叫",
    desc: "8 條產線、n 張工單（區間項目）散在一整年。每一格都用 setWindow() 改變縮放與位置，逼時間軸重算可見項目、堆疊並更新 DOM。項目逐級增加直到掉到 30 FPS 以下；可關掉堆疊或開啟叢集比較。",
    hint: "按「自動加壓」開始；切換堆疊或叢集後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="vtx-stress"></div>`);
      const host = ctx.$(".vtx-stress");
      const Y0 = +new Date(2026, 0, 1), SPAN = 365 * DAY;
      const groups = new vis.DataSet(Array.from({ length: 8 }, (_, i) => ({ id: i, content: `產線 ${i + 1}` })));
      let tl = null, n = 500, buildMs = 0, stack = true, cluster = false, ready = false;
      const kill = () => { if (tl) { dispose(tl); tl = null; } };
      ctx.onCleanup(kill);
      const make = (count) => {
        const r = rng(count);
        return Array.from({ length: count }, (_, i) => {
          const s = Y0 + r() * SPAN;
          return { id: i, group: i % 8, start: new Date(s), end: new Date(s + (0.5 + r() * 6) * DAY), content: `工單 ${i + 1}`, className: `vtx-c${1 + (i % 6)}` };
        });
      };
      function build() {
        kill();
        const el = h("div", { class: "vtx-fill" });
        host.replaceChildren(el);
        const t = performance.now();
        tl = new vis.Timeline(el, new vis.DataSet(make(n)), groups, {
          ...CORE, orientation: "top", start: Y0, end: Y0 + 40 * DAY, min: Y0 - 30 * DAY, max: Y0 + SPAN + 30 * DAY,
          stack, cluster: cluster ? { maxItems: 3, titleTemplate: "{count} 張工單" } : false,
          selectable: false, showTooltips: false, showCurrentTime: false, verticalScroll: true,
          margin: { item: { horizontal: 0, vertical: 2 } },
        });
        buildMs = performance.now() - t;
        // The root stays hidden until the first (200 ms debounced) rangechanged; per-frame setWindow would keep postponing it.
        ready = false;
        tl.on("rangechanged", () => { ready = true; });
      }
      ctx.raf((t) => {
        if (!tl || !ready) return;
        const w = SPAN * (0.11 + 0.09 * Math.sin(t / 1300));
        const c = Y0 + SPAN / 2 + Math.sin(t / 2100) * SPAN * 0.3;
        tl.setWindow(c - w / 2, c + w / 2, { animation: false });
      });
      ctx.toggle("堆疊", stack, (v) => { stack = v; build(); });
      ctx.toggle("叢集", cluster, (v) => { cluster = v; build(); });
      ctx.controls.classList.add("bottom");
      // ramp() applies steps[0] on mount, which does the first build.
      ctx.ramp({
        label: "項目", steps: [500, 1000, 2000, 4000, 8000, 16000, 32000], minFps: 30,
        apply(count) { n = count; build(); },
        metrics: () => ({ "可見項目": tl ? tl.getVisibleItems().length : 0, "建立": Showcase.fmtMs(buildMs), "堆疊": stack ? "開" : "關", "叢集": cluster ? "開" : "關" }),
        note: "每格都改變視窗，Timeline 要用二分搜尋找出範圍內的項目、為新進場的項目建立 DOM、量測寬高後重新堆疊，再更新每個元素的位置；可見項目越多，版面量測與重排越貴。關掉堆疊省下碰撞計算；叢集會把重疊的項目合併成一顆，DOM 數量大減，但每次縮放都要重算叢集。建立耗時含 DataSet 與 Timeline 初始化。",
      });
    },
  },
] });
</script>
</body>
</html>
