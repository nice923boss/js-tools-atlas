<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vis-timeline 示範：JavaScript 三十年大事記</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  header { position: fixed; left: 16px; top: 12px; z-index: 40; right: 330px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 0; color: var(--muted); font-size: 12px; }
  #wrap { position: fixed; left: 12px; right: 12px; top: 64px; bottom: 104px; }
  #tl { width: 100%; height: 100%; }
  #detail { position: fixed; left: 12px; right: 12px; bottom: 46px; z-index: 40; padding: 8px 14px; font-size: 13px; min-height: 48px; }
  #detail b { color: var(--accent); margin-right: 8px; }

  /* Dark theme overrides for the timeline */
  .vis-timeline { border: 1px solid var(--line) !important; border-radius: 10px; background: var(--bg-2); font-family: var(--font) !important; }
  .vis-panel.vis-center, .vis-panel.vis-left, .vis-panel.vis-right, .vis-panel.vis-top, .vis-panel.vis-bottom { border-color: var(--line) !important; }
  .vis-labelset .vis-label { color: var(--fg) !important; border-bottom-color: var(--line) !important; font-size: 13px; }
  .vis-labelset .vis-label .vis-inner { padding: 6px 10px; }
  .vis-foreground .vis-group { border-bottom-color: var(--line) !important; }
  .vis-time-axis .vis-text { color: var(--muted) !important; font-size: 12px; }
  .vis-time-axis .vis-text.vis-major { color: var(--fg) !important; font-weight: 700; }
  .vis-time-axis .vis-grid.vis-minor { border-color: rgba(255,255,255,.06) !important; }
  .vis-time-axis .vis-grid.vis-major { border-color: rgba(255,255,255,.16) !important; }
  .vis-current-time { background-color: var(--c3) !important; width: 2px !important; }
  .vis-item { border-radius: 6px !important; color: #111 !important; font-size: 12px; border-width: 1px !important; }
  .vis-item.vis-range { border-radius: 6px !important; }
  .vis-item.vis-dot { border-radius: 50% !important; }
  .vis-item.vis-box { box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .vis-item.vis-selected { box-shadow: 0 0 0 2px #fff, 0 0 14px rgba(255,255,255,.4) !important; }
  .vis-item.spec { background: #f7df1e; border-color: #f7df1e; }
  .vis-item.runtime { background: #7bd389; border-color: #7bd389; }
  .vis-item.fw { background: #f78bb8; border-color: #f72585; }
  .vis-item.tool { background: #ffb27a; border-color: #ff8c42; }
  .vis-item.vis-background.era { background: rgba(157,140,255,.13) !important; border-left: 2px solid rgba(157,140,255,.6) !important; border-radius: 0 !important; }
  .vis-item.vis-background.era .vis-item-content { color: #c9c1ff; font-size: 12px; }
  .vis-item.vis-line { border-color: rgba(255,255,255,.35) !important; }
  .vis-item.vis-dot.spec { border-color: #f7df1e !important; } .vis-item.vis-dot.runtime { border-color: #7bd389 !important; }
  .vis-item.vis-dot.fw { border-color: #f72585 !important; } .vis-item.vis-dot.tool { border-color: #ff8c42 !important; }
  .controls { top: 14px; }
  @media (max-width: 620px) {
    header { right: 12px; } header p { display: none; }
    .controls { top: auto; bottom: 12px; }
    #wrap { top: 44px; bottom: 110px; }
    #detail { bottom: 58px; padding: 6px 10px; font-size: 12px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>JavaScript 三十年大事記</h1>
  <p>1995 誕生到今天：語言規格、執行環境、框架、建置工具</p>
</header>
<div class="controls">
  <button class="btn" id="zin">放大</button>
  <button class="btn" id="zout">縮小</button>
  <button class="btn" id="es6">聚焦 2015</button>
  <button class="btn primary" id="all">全覽</button>
</div>
<div id="wrap"><div id="tl"></div></div>
<div id="detail" class="panel"><b>點選事件</b>拖曳時間軸平移，滾輪或雙指縮放到年、月、日。</div>
<div class="hint">拖曳平移・滾輪縮放・點事件看說明</div>

<script src="https://cdn.jsdelivr.net/npm/vis-timeline@8.5.4/standalone/umd/vis-timeline-graph2d.min.js"></script>
<script>
// Timeline of JavaScript history; groups are lanes, items are events or eras.
const groups = new vis.DataSet([
  { id: "spec", content: "語言規格" },
  { id: "runtime", content: "執行環境" },
  { id: "fw", content: "前端框架" },
  { id: "tool", content: "建置工具" },
]);
const EVENTS = [
  ["spec", "1995-05-23", "JavaScript 誕生", "Brendan Eich 在網景用十天做出原型，最初叫 Mocha。"],
  ["spec", "1997-06-01", "ECMAScript 1", "交給 Ecma 標準化，成為 ECMA-262 第一版。"],
  ["spec", "1999-12-01", "ES3", "正規表示式、try/catch，奠定之後十年的基礎。"],
  ["spec", "2009-12-01", "ES5", "嚴格模式、JSON、Array 高階方法。"],
  ["spec", "2015-06-17", "ES2015（ES6）", "let/const、箭頭函式、class、模組、Promise，一次大改版。"],
  ["spec", "2017-06-01", "async/await", "ES2017 讓非同步程式寫起來像同步。"],
  ["spec", "2012-10-01", "TypeScript", "微軟發表，替 JS 加上型別系統。"],
  ["runtime", "2008-09-02", "V8 引擎", "Chrome 隨 V8 一起推出，JIT 讓 JS 速度大躍進。"],
  ["runtime", "2009-05-27", "Node.js", "Ryan Dahl 把 V8 帶到伺服器端。"],
  ["runtime", "2010-01-12", "npm", "套件管理器出現，生態開始爆發。"],
  ["runtime", "2020-05-13", "Deno 1.0", "Node 原作者重新設計，內建 TypeScript 與權限模型。"],
  ["runtime", "2023-09-08", "Bun 1.0", "以速度為賣點的一體化執行環境。"],
  ["fw", "2006-08-26", "jQuery", "write less, do more，統一瀏覽器差異。"],
  ["fw", "2010-10-20", "AngularJS", "Google 的雙向綁定框架。"],
  ["fw", "2013-05-29", "React", "Facebook 開源，虛擬 DOM 與元件化。"],
  ["fw", "2014-02-01", "Vue", "尤雨溪發表，漸進式框架。"],
  ["fw", "2016-10-25", "Next.js", "React 的伺服器端渲染框架。"],
  ["fw", "2016-11-26", "Svelte", "編譯時框架，沒有虛擬 DOM。"],
  ["tool", "2009-11-05", "Closure Compiler", "Google 開源的 JS 壓縮最佳化工具。"],
  ["tool", "2014-09-28", "Babel", "最初叫 6to5，把新語法轉成舊瀏覽器能跑的版本。"],
  ["tool", "2014-02-19", "webpack 1.0", "模組打包成為前端工程標配。"],
  ["tool", "2020-01-29", "esbuild", "用 Go 寫的打包器，快上百倍。"],
  ["tool", "2020-04-20", "Vite", "利用原生 ES 模組的開發伺服器。"],
];
const ERAS = [
  ["fw", "2006-08-26", "2014-12-31", "jQuery 時代"],
  ["fw", "2015-01-01", "2026-12-31", "元件化框架時代"],
  ["spec", "1999-12-01", "2009-12-01", "ES4 難產的十年"],
  ["spec", "2015-06-17", "2026-12-31", "每年一版 ECMAScript"],
];

const items = new vis.DataSet([
  ...EVENTS.map(([group, start, content, desc], i) => ({
    id: `e${i}`, group, start, content, desc, className: group, type: "box", title: desc,
  })),
  ...ERAS.map(([group, start, end, content], i) => ({
    id: `r${i}`, group, start, end, content, className: "era", type: "background",
  })),
]);

const pad = (n) => String(n).padStart(2, "0");
const timeline = new vis.Timeline(document.getElementById("tl"), items, groups, {
  start: "1993-01-01",
  end: "2027-01-01",
  min: "1990-01-01",
  max: "2030-12-31",
  zoomMin: 1000 * 60 * 60 * 24 * 20,
  stack: true,
  height: "100%",
  verticalScroll: true,
  margin: { item: { horizontal: 4, vertical: 6 } },
  orientation: "top",
  showCurrentTime: true,
  tooltip: { followMouse: true },
  format: {
    // Traditional Chinese labels instead of moment's English month names.
    minorLabels: (date, scale) => {
      const d = new Date(+date);
      if (scale === "year") return `${d.getFullYear()}`;
      if (scale === "month") return `${d.getMonth() + 1} 月`;
      if (scale === "day" || scale === "weekday") return `${d.getDate()} 日`;
      return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    },
    majorLabels: (date, scale) => {
      const d = new Date(+date);
      if (scale === "year") return "";
      if (scale === "month") return `${d.getFullYear()} 年`;
      return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月`;
    },
  },
});

const detail = document.getElementById("detail");
timeline.on("select", ({ items: sel }) => {
  const it = sel.length && items.get(sel[0]);
  if (!it || !it.desc) return;
  const d = new Date(it.start);
  detail.innerHTML = `<b>${it.content}</b>${d.getFullYear()} 年 ${d.getMonth() + 1} 月：${it.desc}`;
});

document.getElementById("zin").addEventListener("click", () => timeline.zoomIn(0.5));
document.getElementById("zout").addEventListener("click", () => timeline.zoomOut(0.5));
document.getElementById("all").addEventListener("click", () => timeline.fit());
document.getElementById("es6").addEventListener("click", () => {
  timeline.setWindow("2014-01-01", "2016-12-31");
  timeline.setSelection(["e4"], { focus: false });
  detail.innerHTML = `<b>${items.get("e4").content}</b>2015 年 6 月：${items.get("e4").desc}`;
});
</script>
</body>
</html>
