<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vivus 示範：SVG 描線台北天際線</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: radial-gradient(60% 60% at 70% 20%, rgba(247, 223, 30, .08), transparent 70%), var(--bg); }
  .art { position: fixed; inset: 56px 12px 84px; }
  .art svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .art svg * { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .art .ghost { opacity: .13; }
  .art .live { filter: drop-shadow(0 0 4px rgba(76, 201, 240, .45)); }
  .s-sun { stroke: var(--c1); } .s-cloud { stroke: #dfe7ef; } .s-mtn { stroke: var(--c4); }
  .s-101 { stroke: var(--c2); } .s-bld { stroke: var(--c6); } .s-water { stroke: var(--c2); } .s-bird { stroke: var(--c5); }
  h1 { position: fixed; left: 16px; top: 14px; margin: 0; font-size: 16px; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .scrubbar { position: fixed; left: 12px; right: 12px; bottom: 44px; display: flex; gap: 10px; align-items: center; }
  .scrubbar input { flex: 1; }
  .scrubbar span { color: var(--muted); font-size: 12px; min-width: 40px; text-align: right; }
  @media (max-width: 560px) { h1 { top: 60px; } h1 small { display: none; } .art { top: 96px; } }
</style>
</head>
<body>
<h1>一筆一筆畫出台北<small>Vivus 用 stroke-dashoffset 逐條描線</small></h1>
<div class="controls">
  <button class="btn" data-type="delayed" aria-pressed="true">延遲</button>
  <button class="btn" data-type="sync" aria-pressed="false">同步</button>
  <button class="btn" data-type="oneByOne" aria-pressed="false">逐筆</button>
  <button class="btn primary" id="replay">重播</button>
</div>
<div class="art" id="art">
  <svg class="live" id="sky" viewBox="0 0 800 440" preserveAspectRatio="xMidYMid meet">
    <circle class="s-sun" cx="640" cy="104" r="44"/>
    <path class="s-sun" d="M640 36 V48 M640 160 V172 M572 104 H584 M696 104 H708 M592 56 L600 64 M680 144 L688 152 M688 56 L680 64 M600 144 L592 152"/>
    <path class="s-cloud" d="M96 150 H200 A22 22 0 0 0 194 108 A32 32 0 0 0 134 100 A24 24 0 0 0 96 150 Z"/>
    <path class="s-cloud" d="M470 96 H546 A16 16 0 0 0 540 66 A24 24 0 0 0 496 62 A18 18 0 0 0 470 96 Z"/>
    <path class="s-mtn" d="M0 300 L90 228 L150 262 L250 168 L320 236 M330 246 L372 220 M428 209 L496 258 M536 264 L600 214 L700 266 L800 206"/>
    <path class="s-mtn" d="M220 196 L250 168 L282 198"/>
    <path class="s-101" d="M400 22 V64 M392 64 H408 L410 82 H390 Z"/>
    <path class="s-101" d="M374 82 H426 L420 104 H380 Z M374 104 H426 L420 126 H380 Z M374 126 H426 L420 148 H380 Z M374 148 H426 L420 170 H380 Z"/>
    <path class="s-101" d="M374 170 H426 L420 192 H380 Z M374 192 H426 L420 214 H380 Z M374 214 H426 L420 236 H380 Z M374 236 H426 L420 258 H380 Z"/>
    <path class="s-101" d="M382 258 H418 L440 340 H360 Z M392 280 H408 M386 302 H414 M378 322 H422"/>
    <path class="s-bld" d="M286 340 V238 H330 V340 M296 254 H320 M296 270 H320 M296 286 H320 M296 302 H320 M296 318 H320"/>
    <path class="s-bld" d="M216 340 V296 H280 V340 M208 298 L248 272 L288 298 M236 340 V318 H260 V340"/>
    <path class="s-bld" d="M334 340 V282 H356 V340"/>
    <path class="s-bld" d="M452 340 V262 H492 V340 M462 274 V328 M472 274 V328 M482 274 V328"/>
    <path class="s-bld" d="M498 340 V222 H522 L534 234 V340 M506 240 H526 M506 260 H526 M506 280 H526 M506 300 H526"/>
    <path class="s-bld" d="M540 340 V292 H596 V340 M552 306 H584"/>
    <path class="s-mtn" d="M20 340 H780"/>
    <path class="s-water" d="M60 370 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path class="s-water" d="M120 398 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
    <path class="s-bird" d="M560 168 q8 -9 16 0 q8 -9 16 0 M612 190 q6 -7 12 0 q6 -7 12 0 M250 70 q7 -8 14 0 q7 -8 14 0"/>
  </svg>
</div>
<div class="scrubbar"><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="描線進度"><span id="pct">0%</span></div>
<div class="hint">拖曳進度條手動描線，或切換三種描線模式</div>

<script src="https://cdn.jsdelivr.net/npm/vivus@0.4.6/dist/vivus.min.js"></script>
<script>
// A faint ghost copy stays visible while Vivus draws the live copy on top.
const live = document.getElementById("sky");
const ghost = live.cloneNode(true);
ghost.removeAttribute("id");
ghost.setAttribute("class", "ghost");
live.before(ghost);

const scrub = document.getElementById("scrub");
const pct = document.getElementById("pct");
let viv = null, timer = null, type = "delayed";

function create() {
  if (viv) viv.destroy();
  viv = new Vivus("sky", { type, duration: 170, start: "manual", animTimingFunction: Vivus.EASE_OUT });
}

// Draw forward, hold, rewind quickly, repeat.
function cycle() {
  clearTimeout(timer);
  viv.stop().reset().play(1, () => {
    timer = setTimeout(() => viv.play(-2.5, () => { timer = setTimeout(cycle, 350); }), 1600);
  });
}

(function sync() {
  if (viv && document.activeElement !== scrub) {
    const p = viv.currentFrame / viv.frameLength;
    scrub.value = Math.round(p * 1000);
    pct.textContent = `${Math.round(p * 100)}%`;
  }
  requestAnimationFrame(sync);
})();

scrub.addEventListener("input", () => {
  clearTimeout(timer);
  viv.stop().setFrameProgress(scrub.value / 1000);
  pct.textContent = `${Math.round(scrub.value / 10)}%`;
});
scrub.addEventListener("change", () => scrub.blur());

document.querySelectorAll("[data-type]").forEach((b) => b.addEventListener("click", () => {
  type = b.dataset.type;
  document.querySelectorAll("[data-type]").forEach((x) => x.setAttribute("aria-pressed", x === b));
  create();
  cycle();
}));
document.getElementById("replay").addEventListener("click", cycle);

create();
cycle();
</script>
</body>
</html>
