const withAttrs = (el, attrs) => el.replace(/\/>$/, ` ${attrs}/>`);

// Note: Vivus clears its per-play callback right after calling it, so a play() issued
// synchronously inside that callback would lose its own callback. Chained plays are deferred.

// Play several instances together; when all have finished, hold, then reset and replay.
// Calling the returned function restarts the loop and cancels the previous one.
function syncLoop(ctx, getAll, hold = 900) {
  let token = 0;
  const run = () => {
    const my = ++token, all = getAll();
    let left = all.length;
    all.forEach((v) => v.stop().reset().play(1, () => {
      if (my === token && --left === 0) ctx.timeout(() => my === token && run(), hold);
    }));
  };
  return run;
}

Showcase.run({ scenes: [
  {
    id: "skyline", title: "台北天際線",
    api: "new Vivus(svg, { type, duration: 170, animTimingFunction: Vivus.EASE_OUT })",
    desc: "Vivus 先量出每條路徑的長度，把 stroke-dasharray 設成「一段實線加一段同長的空白」，再逐格改 stroke-dashoffset，線就像被筆畫出來；太陽的 circle 會先自動轉成 path。整段套 EASE_OUT，畫完由回呼補上填色，停一下再用負速度 play(-2.5) 倒帶。",
    hint: "拖曳進度條手動描線・切換延遲、同步、逐筆三種模式",
    mount(ctx) {
      ctx.html(`<div class="v1">
        <div class="ttl"><b>一筆一筆畫出台北</b><span>stroke-dashoffset 逐條描線</span></div>
        <div class="art"><svg class="ghost" viewBox="0 0 800 440" aria-hidden="true">${SKYLINE}</svg>
          <svg class="live" viewBox="0 0 800 440" role="img" aria-label="台北天際線">${SKYLINE}</svg></div>
        <div class="scrub"><span>進度</span><input type="range" min="0" max="1000" value="0" aria-label="描線進度"><output>0%</output><em></em></div>
      </div>`);
      const live = ctx.$(".live"), scrub = ctx.$(".scrub input"), out = ctx.$(".scrub output"), st = ctx.$(".scrub em");
      const TYPES = ["delayed", "sync", "oneByOne"];
      const LABEL = { draw: "play(1)：描線中", hold: "回呼：補上填色", rewind: "play(-2.5)：倒帶", wait: "準備重播", manual: "setFrameProgress()" };
      let viv = null, type = TYPES[0], timer = 0, phase = "";
      const create = () => {
        if (viv) viv.stop().destroy();
        viv = new Vivus(live, { type, duration: 170, start: "manual", animTimingFunction: Vivus.EASE_OUT });
      };
      // Draw forward, hold with fills, rewind quickly, repeat
      const cycle = () => {
        clearTimeout(timer);
        live.classList.remove("lit");
        phase = "draw";
        viv.stop().reset().play(1, () => {
          phase = "hold";
          live.classList.add("lit");
          timer = ctx.timeout(() => {

      // Deterministic random scribbles: three quadratic segments each
      const scribbles = (n) => {
        let seed = 42;
        const r = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
        let s = "";
        for (let i = 0; i < n; i++) {
          let x = r() * 1000, y = r() * 620, d = `M${x | 0} ${y | 0}`;
          for (let k = 0; k < 3; k++) {
            const cx = x + (r() - 0.5) * 160, cy = y + (r() - 0.5) * 160;
            x = clamp(x + (r() - 0.5) * 200, 0, 1000);
            y = clamp(y + (r() - 0.5) * 200, 0, 620);
            d += `Q${cx | 0} ${cy | 0} ${x | 0} ${y | 0}`;
          }
          s += `<path d="${d}" stroke="${PAL[i % 6]}"/>`;
        }
        return s;
      };
      const build = (n) => {
        if (viv) viv.stop();
        svg.innerHTML = scribbles(n);
        const t0 = performance.now();
        // Constructor callback fires at both ends: bounce forward and backward forever
        viv = new Vivus(svg, { type: "delayed", duration: 120, delay: 60, start: "manual" },
          (v) => ctx.timeout(() => v === viv && v.play(v.currentFrame > 0 ? -1.5 : 1), 80));
        buildMs = performance.now() - t0;
        // Time the per-frame work by wrapping this instance's trace()
        const trace = viv.trace;
        viv.trace = function () {
          const a = performance.now();
          trace.call(this);
          traceMs = traceMs * 0.85 + (performance.now() - a) * 0.15;
        };
        total = viv.map.reduce((a, m) => a + m.length, 0);
        lbl.textContent = `${n.toLocaleString()} 條路徑・總長 ${Math.round(total).toLocaleString()} 單位`;
        viv.play(1);
      };
      ctx.onCleanup(() => viv && viv.stop());
      ctx.ramp({
        label: "同時描線", unit: "條", steps: [100, 250, 500, 1000, 2000, 4000, 8000, 16000],
        minFps: 30,
        apply: build,
        metrics: () => ({ "建立＋量長度": fmtMs(buildMs), "trace()／格": fmtMs(traceMs), "總描線長度": `${Math.round(total / 1000).toLocaleString()} k` }),
        note: "建立時間包含 Pathformer 掃描、每條 getTotalLength() 與寫入 dash 樣式；trace() 只算 JS 端逐條改 strokeDashoffset 的時間，FPS 下降多半來自瀏覽器重繪，而不是 trace() 本身。",
      });
    },
  },
] });
</script>
