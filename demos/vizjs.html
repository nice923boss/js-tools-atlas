<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viz.js 示範：瀏覽器裡的 Graphviz</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","size":"約 1.3 MB"}</script>
<style>
  #app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(250px, 36%) 1fr; }
  #pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fbfaf7; border-right: 1px solid var(--line); }
  #pane .head { display: flex; justify-content: space-between; gap: 8px; padding: 10px 14px 4px; font-size: 12px; color: var(--muted); }
  #pane .head b { color: var(--fg); }
  #src { flex: 1; min-height: 0; resize: none; border: 0; outline: 0; background: transparent; color: #2b2a26;
    padding: 6px 14px 48px; font: 12px/1.6 var(--mono); white-space: pre; overflow: auto; font-variant-ligatures: none; }
  #view { position: relative; min-width: 0; min-height: 0; overflow: hidden;
    background: linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px) 0 0 / 22px 22px, linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px) 0 0 / 22px 22px; }
  #out { position: absolute; inset: 60px 16px 48px; display: grid; place-items: center; }
  #out svg { display: block; }
  #out svg text { font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif; }
  #err { position: absolute; left: 16px; right: 16px; bottom: 46px; display: none; z-index: 5;
    color: #b3261e; background: #fdecea; border: 1px solid #f3b8b3; border-radius: 8px; padding: 8px 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; }
  .hint { left: auto; right: 12px; }
  @media (max-width: 640px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 36% 1fr; }
    #pane { border-right: 0; border-bottom: 1px solid var(--line); }
    #src { padding-bottom: 10px; font-size: 11.5px; }
    .controls { top: calc(36% + 8px); }
    #out { inset: 52px 10px 40px; }
    .controls .eng { display: none; }
  }
</style>
</head>
<body class="paper">
<div id="app">
  <section id="pane">
    <div class="head"><b>DOT 原始碼</b><span id="stat">載入 Graphviz 中</span></div>
    <textarea id="src" spellcheck="false" wrap="off" aria-label="DOT 原始碼"></textarea>
  </section>
  <section id="view">
    <div id="out"></div>
    <div id="err"></div>
  </section>
</div>
<div class="controls">
  <button class="btn" data-k="build" aria-pressed="true">建置流程<span class="eng">・dot</span></button>
  <button class="btn" data-k="map" aria-pressed="false">縣市相鄰<span class="eng">・neato</span></button>
  <button class="btn" data-k="loop" aria-pressed="false">衝刺循環<span class="eng">・circo</span></button>
</div>
<div class="hint">改 DOT 文字即重畫・三種排版引擎</div>

<script src="https://cdn.jsdelivr.net/npm/@viz-js/viz@3.31.0/dist/viz-global.js"></script>
<script>
// Every sample sets a CJK fontname on graph, node and edge so SVG text never shows tofu boxes.
// Graphviz underestimates CJK glyph widths, so boxes get a wider margin to compensate.
const SAMPLES = {
  build: { engine: "dot", code: `digraph 建置流程 {
  graph [label="前端專案：從原始碼到上線", labelloc=t,
         fontname="Noto Sans TC, Microsoft JhengHei", fontsize=15,
         fontcolor="#3b3a35", bgcolor="transparent", nodesep=0.25, ranksep=0.42]
  node  [shape=box, style="rounded,filled", fontname="Noto Sans TC, Microsoft JhengHei",
         fontsize=12, color="#b89500", fillcolor="#fff3b0", penwidth=1.4, margin="0.3,0.07"]
  edge  [color="#6d6b64", arrowsize=0.7, fontname="Noto Sans TC, Microsoft JhengHei",
         fontsize=11, fontcolor="#2f9e55"]

  subgraph cluster_src {
    label="原始碼"; style="rounded,filled"; fillcolor="#f1ecff"; color="#6a5ae0"
    ts [label="TypeScript"]; vue [label="Vue 元件"]
    scss [label="SCSS 樣式"]; img [label="圖片素材"]
  }
  subgraph cluster_build {
    label="建置（Vite）"; style="rounded,filled"; fillcolor="#e6f6fc"; color="#1f8fb8"
    node [fillcolor="#ffffff", color="#1f8fb8"]
    tsc [label="型別檢查"]; bundle [label="打包與搖樹"]
    css [label="CSS 壓縮"]; opt [label="圖片最佳化"]
  }
  subgraph cluster_ship {
    label="部署"; style="rounded,filled"; fillcolor="#e8f7ec"; color="#2f9e55"
    node [fillcolor="#ffffff", color="#2f9e55"]
    test [label="自動化測試"]; cdn [label="上傳 CDN"]
    site [label="正式網站", shape=doubleoctagon, fillcolor="#cfe9d6"]
  }

  ts -> tsc -> bundle
  vue -> bundle
  scss -> css
  img -> opt
  bundle -> test
  css -> test [style=dashed]
  test -> cdn [label=" 通過"]
  opt -> cdn
  cdn -> site
}` },
  map: { engine: "neato", code: `graph 縣市相鄰 {
  graph [label="台灣本島縣市相鄰關係（示意）", labelloc=t,
         fontname="Noto Sans TC, Microsoft JhengHei", fontsize=15,
         fontcolor="#3b3a35", bgcolor="transparent", overlap=false, sep="+8"]
  node  [shape=circle, style=filled, fixedsize=true, width=0.66,
         fontname="Noto Sans TC, Microsoft JhengHei", fontsize=12,
         color="#ffffff", penwidth=2]
  edge  [color="#9b998f", penwidth=1.3]

  // pos 是大致地理位置（英吋），neato 以此為起點再調整避免重疊
  node [fillcolor="#bfe6f5"]
  基隆 [pos="3.6,9.0"];  臺北 [pos="2.9,8.8"];  新北 [pos="3.3,8.1"]
  桃園 [pos="2.3,8.0"];  新竹市 [pos="1.4,7.4"];  新竹縣 [pos="2.3,7.1"]
  宜蘭 [pos="3.7,7.0"]
  node [fillcolor="#fff3b0"]
  苗栗 [pos="1.3,6.3"];  臺中 [pos="1.9,5.4"];  彰化 [pos="0.9,4.8"]
  南投 [pos="2.3,4.3"];  雲林 [pos="0.8,3.8"]
  node [fillcolor="#ffd0e1"]
  嘉義市 [pos="1.0,3.0"];  嘉義縣 [pos="1.8,3.1"];  臺南 [pos="0.9,2.0"]
  高雄 [pos="1.9,1.6"];  屏東 [pos="2.2,0.4"]
  node [fillcolor="#cfe9d6"]
  花蓮 [pos="3.6,4.9"];  臺東 [pos="3.1,1.9"]

  基隆 -- 新北;  臺北 -- 新北;  新北 -- 桃園;  新北 -- 宜蘭
  桃園 -- 新竹縣;  桃園 -- 宜蘭;  新竹縣 -- 新竹市;  新竹縣 -- 苗栗
  新竹縣 -- 宜蘭;  新竹市 -- 苗栗;  苗栗 -- 臺中;  宜蘭 -- 臺中
  宜蘭 -- 花蓮;  臺中 -- 彰化;  臺中 -- 南投;  臺中 -- 花蓮
  彰化 -- 南投;  彰化 -- 雲林;  南投 -- 雲林;  南投 -- 嘉義縣
  南投 -- 花蓮;  南投 -- 高雄;  雲林 -- 嘉義縣;  嘉義縣 -- 嘉義市
  嘉義縣 -- 臺南;  嘉義縣 -- 高雄;  臺南 -- 高雄;  高雄 -- 屏東
  高雄 -- 臺東;  屏東 -- 臺東;  花蓮 -- 臺東
}` },
  loop: { engine: "circo", code: `digraph 衝刺循環 {
  graph [label="Scrum 兩週衝刺循環", labelloc=t,
         fontname="Noto Sans TC, Microsoft JhengHei", fontsize=15,
         fontcolor="#3b3a35", bgcolor="transparent", mindist=0.75]
  node  [shape=box, style="rounded,filled", fontname="Noto Sans TC, Microsoft JhengHei",
         fontsize=12, color="#6a5ae0", fillcolor="#f1ecff", penwidth=1.4, margin="0.3,0.08"]
  edge  [color="#6a5ae0", penwidth=1.4, arrowsize=0.8,
         fontname="Noto Sans TC, Microsoft JhengHei", fontsize=11, fontcolor="#d61f69"]

  待辦 [label="產品待辦清單", fillcolor="#fff3b0", color="#b89500"]
  規劃 [label="衝刺規劃會議"]
  開發 [label="開發與測試", fillcolor="#e6f6fc", color="#1f8fb8"]
  站會 [label="每日站會"]
  審查 [label="衝刺審查"]
  回顧 [label="回顧會議"]
  交付 [label="可交付成果", shape=doubleoctagon, fillcolor="#cfe9d6", color="#2f9e55"]

  待辦 -> 規劃 -> 開發 -> 站會 -> 審查 -> 回顧 -> 待辦
  站會 -> 開發 [style=dashed, xlabel="每天"]
  審查 -> 交付
}` },
};

const src = document.getElementById("src");
const out = document.getElementById("out");
const err = document.getElementById("err");
const stat = document.getElementById("stat");
let viz = null;
let engine = "dot";

// Scale the SVG into the preview box, never enlarging beyond 1.6x.
function fit() {
  const svg = out.querySelector("svg");
  if (!svg) return;
  const vb = svg.viewBox.baseVal;
  const box = out.getBoundingClientRect();
  const s = Math.min(box.width / vb.width, box.height / vb.height, 1.6);
  svg.setAttribute("width", Math.floor(vb.width * s));
  svg.setAttribute("height", Math.floor(vb.height * s));
}

function draw() {
  if (!viz) return;
  const t0 = performance.now();
  try {
    const svg = viz.renderSVGElement(src.value, { engine });
    out.replaceChildren(svg);
    fit();
    err.style.display = "none";
    stat.textContent = `${engine} 排版，${Math.round(performance.now() - t0)} 毫秒`;
  } catch (e) {
    // Viz throws with Graphviz's own error text; keep the last good drawing.
    err.textContent = `語法錯誤：${e.message}`;
    err.style.display = "block";
    stat.textContent = "等待修正語法";
  }
}

let timer;
src.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(draw, 250); });
function load(k) {
  document.querySelectorAll("[data-k]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.k === k)));
  engine = SAMPLES[k].engine;
  src.value = SAMPLES[k].code;
  draw();
}
document.querySelectorAll("[data-k]").forEach((b) => b.addEventListener("click", () => load(b.dataset.k)));
addEventListener("resize", fit);

load("build");
Viz.instance().then((v) => { viz = v; draw(); });
</script>
</body>
</html>
