  /* show DOT syntax such as -> and -- literally, not as font ligatures */
  *, *::before, *::after { font-variant-ligatures: none !important; font-feature-settings: "liga" 0, "calt" 0 !important; }
  .vz-wrap {
    position: absolute; inset: 0; display: flex; gap: 10px; min-height: 0;

  }
  /* diagram viewport: svg centered and scaled to fit */
  .vz-view {
    position: relative; flex: 1; min-width: 0; min-height: 0; overflow: hidden;

  .vz-svg > svg { display: block; flex: none; }
  .vz-svg svg text { font-family: var(--font); }
  .vz-svg.vz-stale > * { opacity: .3; filter: grayscale(1); }
  .vz-meta, .vz-tag {
    position: absolute; font: 11.5px/1.4 var(--font); font-variant-numeric: tabular-nums; color: var(--muted);

  .vz-meta { right: 8px; bottom: 6px; }
  .vz-tag { left: 8px; top: 6px; color: #3b3a35; }

<script>
// Viz.js showcase: eight scenes from a live DOT editor to a per-engine layout benchmark.
const { h, fmt, fmtMs } = Showcase;

// Graphviz in WebAssembly only has hard-coded metrics for a few Latin fonts. Layout uses
// Helvetica metrics (CJK labels get a little extra margin); CSS swaps in the page font for display.
const GV_FONT = "Helvetica";
const NOISE = /non-ASCII character|hard-coded metrics/;
const GV_NOTES = [
  [/triangulation/, "這個 WebAssembly 版本沒有 GTS 三角化函式庫，sfdp 預設的 prism 去重疊會退回其他方法，圖仍會畫出"],
  [/Orthogonal edges/, "ortho 直角連線不支援一般邊標籤，可改用 xlabel"],
];
let viz = null;
const vizReady = Viz.instance().then((v) => (viz = v));

const ENGINES = [
  { id: "dot", zh: "分層有向圖" },
  { id: "neato", zh: "彈簧模型" },
  { id: "fdp", zh: "力導向，支援叢集" },
  { id: "sfdp", zh: "多尺度力導向" },
  { id: "circo", zh: "環狀排列" },
  { id: "twopi", zh: "放射狀" },
  { id: "osage", zh: "叢集打包" },
  { id: "patchwork", zh: "面積樹狀圖" },
];

// ---------- helpers ----------
async function ready(ctx) {
  if (viz) return viz;
  const s = ctx.status("載入 Graphviz（WebAssembly）…");
  await vizReady;
  s.done();
  return viz;
}

// Merge per-call options with the -G/-N/-E defaults every scene shares.
function gvOpts(o = {}) {
  return {
    ...o,
    graphAttributes: { fontname: GV_FONT, bgcolor: "transparent", ...o.graphAttributes },
    nodeAttributes: { fontname: GV_FONT, ...o.nodeAttributes },
    edgeAttributes: { fontname: GV_FONT, ...o.edgeAttributes },
  };
}

const svgOf = (o) => viz.renderSVGElement(o.src, gvOpts(o.opts));
const notes = (errors) => errors.filter((e) => !NOISE.test(e.message));
const parseSvg = (str) => new DOMParser().parseFromString(str, "image/svg+xml").documentElement;

function timed(fn) {
  const t0 = performance.now();
  const out = fn();
  return [out, performance.now() - t0];
}

function fit(box, max, padY) {
  const svg = box.firstElementChild;
  const vb = svg && svg.viewBox && svg.viewBox.baseVal;
  if (!vb || !vb.width || !box.clientWidth) return;
  // vertical margin leaves room for the tag (top) and meta (bottom) overlays
  const s = Math.min((box.clientWidth - 16) / vb.width, (box.clientHeight - padY) / vb.height, max);
  svg.style.width = `${Math.max(1, vb.width * s)}px`;
  svg.style.height = `${Math.max(1, vb.height * s)}px`;
}

// Diagram viewport inside host; refits whenever the box resizes (controls may wrap after mount).
function viewer(ctx, host, max = 1.6, padY = 44) {
  const box = h("div", { class: "vz-svg" });
  const tag = h("div", { class: "vz-tag" });
  const meta = h("div", { class: "vz-meta" });
  host.append(box, tag, meta);
  const api = {
    box, onSize: null,
    set(svg) { box.replaceChildren(svg); box.classList.remove("vz-stale"); api.fit(); return svg; },
    fit: () => fit(box, max, padY),
    stale: (on) => box.classList.toggle("vz-stale", on),
    info: (t) => { meta.textContent = t; },
    tag: (t) => { tag.textContent = t; },
    wide: () => box.clientWidth >= box.clientHeight * 1.1,
  };
  const ro = new ResizeObserver(() => { api.fit(); api.onSize?.(); });
  ro.observe(box);
  ctx.onCleanup(() => ro.disconnect());
  return api;
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  h("a", { href: url, download: name }).click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function chunk(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

// ---------- 2. one graph, eight engines ----------
function TEAM(clusters) {
  const C = clusters ? "cluster_" : "group_";
  return `graph 部門協作 {
  graph [overlap=scale, nodesep=0.3, fontsize=12, fontcolor="#3b3a35"]
  node [shape=box, style="rounded,filled", fillcolor="#ffffff", color="#6d6b64", fontsize=12, margin="0.18,0.06"]
  edge [color="#8a877d", penwidth=1.2]
  subgraph ${C}rd { label="研發"; style="rounded,filled"; fillcolor="#f0f9fd"; color="#1f8fb8"
    node [fillcolor="#bfe6f5", color="#1f8fb8"]
    前端 [area=3]; 後端 [area=4]; 測試 [area=2] }
  subgraph ${C}ds { label="設計"; style="rounded,filled"; fillcolor="#f7f4ff"; color="#6a5ae0"
    node [fillcolor="#ddd5ff", color="#6a5ae0"]
    介面設計 [area=2]; 使用者研究 [area=2] }
  subgraph ${C}mk { label="行銷"; style="rounded,filled"; fillcolor="#fffbe3"; color="#b89500"
    node [fillcolor="#fff0a0", color="#b89500"]
    社群 [area=2]; 廣告 [area=2]; 內容 [area=3] }
  subgraph ${C}bz { label="業務"; style="rounded,filled"; fillcolor="#f2fbf4"; color="#2f9e55"
    node [fillcolor="#c8ebd2", color="#2f9e55"]
    北區 [area=3]; 南區 [area=2]; 客服 [area=2] }
  前端 -- 後端; 後端 -- 測試; 前端 -- 測試; 前端 -- 介面設計; 介面設計 -- 使用者研究
  使用者研究 -- 客服; 內容 -- 社群; 社群 -- 廣告; 廣告 -- 北區; 廣告 -- 南區
  北區 -- 南區; 南區 -- 客服; 客服 -- 後端; 內容 -- 介面設計; 測試 -- 客服
}`;
}

// ---------- 3. nested clusters ----------
function ARCH({ clusters, compound, dir }) {
  const C = clusters ? "cluster_" : "group_";
  const cmp = clusters && compound;
  // compound: one edge to the box replaces three (invisible edges keep the same ranks)
  const links = cmp
    ? `閘道 -> 課程 [lhead=${C}svc, label=" 轉送"]
  閘道 -> 會員 [style=invis]; 閘道 -> 訂單 [style=invis]
  課程 -> PG [ltail=${C}svc, lhead=${C}data, label=" 讀寫"]
  會員 -> 快取 [style=invis]; 訂單 -> PG [style=invis]`
    : `閘道 -> 會員; 閘道 -> 課程; 閘道 -> 訂單
  會員 -> PG; 課程 -> PG; 訂單 -> PG; 課程 -> 快取; 會員 -> 快取`;
  return `digraph 架構 {
  graph [rankdir=${dir}, compound=${cmp}, newrank=true, nodesep=0.3, ranksep=0.45,
         fontsize=13, fontcolor="#3b3a35", label="線上課程平台架構（示意）", labelloc=t]
  node [shape=box, style="rounded,filled", fillcolor="#ffffff", color="#6d6b64", fontsize=12, margin="0.22,0.06"]
  edge [color="#6d6b64", arrowsize=0.7, fontsize=11, fontcolor="#d61f69"]
  subgraph ${C}user { label="使用者端"; style="rounded,dashed"; color="#9a978d"
    瀏覽器; App [label="手機 App"] }
  subgraph ${C}cloud { label="雲端（台北機房）"; style="rounded,filled"; fillcolor="#f4f1ea"; color="#c9c4b6"
    subgraph ${C}gate { label="入口層"; fillcolor="#e6f6fc"; color="#1f8fb8"; CDN; 閘道 [label="API 閘道"] }
    subgraph ${C}svc { label="服務層"; fillcolor="#fff7cc"; color="#b89500"

    })),

      ...YEARS.slice(1).map((_, i) => ({ tail: `y${i}`, head: `y${i + 1}`, attributes: { style: "invis" } })),
      ...PREREQ.map(([a, b], k) => ({ tail: `c${a}`, head: `c${b}`, attributes: { id: `vze-${k}` } })),
    ],
  };
}

// mode 0: direct neighbours, 1: all prerequisites (upstream), 2: everything it unlocks (downstream)
function trace(s, mode) {
  const nodes = new Set([s]), edges = new Set();
  if (mode === 0) {
    PREREQ.forEach(([a, b], k) => { if (a === s || b === s) { edges.add(k); nodes.add(a); nodes.add(b); } });
    return { nodes, edges };
  }
  const up = mode === 1, stack = [s];
  while (stack.length) {
    const x = stack.pop();
    PREREQ.forEach(([a, b], k) => {
      const from = up ? b : a, to = up ? a : b;
      if (from !== x) return;
      edges.add(k);
      if (!nodes.has(to)) { nodes.add(to); stack.push(to); }
    });
  }
  return { nodes, edges };
}

// Random tree plus about 30% extra edges; seeded so every engine sees the same graph.
function bigGraph(n) {
  let seed = 11;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const lines = [
    "digraph G {",
    `node [shape=box, style="rounded,filled", fillcolor="#fff3b0", color="#b89500", fontsize=10, margin="0.05,0.02", width=0.4, height=0.25]`,
    `edge [color="#8a877d", arrowsize=0.5]`,
  ];
  let edges = 0;
  for (let i = 0; i < n; i++) lines.push(`n${i} [label="${i}"]`);
  for (let i = 1; i < n; i++) {
    lines.push(`n${Math.floor(rnd() * i)} -> n${i}`); edges++;
    if (rnd() < 0.3) { lines.push(`n${i} -> n${Math.floor(rnd() * n)}`); edges++; }
  }
  lines.push("}");
  return { src: lines.join("\n"), edges };
}

          grid.classList.toggle("vz-focus", on);
        });
        return { e, ms, view: viewer(ctx, mini, 2.5, 8) };
      });
      const draw = () => {
        if (!viz) return;
        const src = TEAM(clusters);
        for (const c of cards) {
          const [svg, t] = timed(() => svgOf({ src, opts: { engine: c.e.id } }));
          c.view.set(svg);
          c.ms.textContent = fmtMs(t);
        }
      };
      ctx.toggle("叢集", true, (v) => { clusters = v; draw(); });
      await ready(ctx);
      draw();
    },
  },
  {
    id: "clusters", title: "叢集子圖", paper: true,
    api: "subgraph cluster_名稱 { … }・compound=true・lhead／ltail・newrank",
    desc: "名稱以 cluster 開頭的子圖會畫成框，而且可以層層巢狀；子圖會繼承外層的樣式屬性。打開 compound 後，邊可以用 lhead／ltail 直接接到框上，把多條重複的連線收斂成一條。",
    hint: "關掉叢集框或 compound，看同一張架構圖的差別",
    async mount(ctx) {
      ctx.html(`<div class="vz-wrap"><div class="vz-view"></div></div>`);
      const view = viewer(ctx, ctx.$(".vz-view"));
      const { width, height } = ctx.size();
      const opt = { clusters: true, compound: true, dir: width > height * 1.2 ? "LR" : "TB" };
      const draw = () => {
        if (!viz) return;
        const [svg, t] = timed(() => svgOf({ src: ARCH(opt) }));
        view.set(svg);
        const boxes = svg.querySelectorAll("g.cluster").length;
        view.tag(opt.clusters ? `${boxes} 個叢集框・最深 2 層巢狀` : "一般子圖：只分組，不畫框");
        view.info(`${opt.clusters && opt.compound ? "compound：邊接到框" : "邊都接到節點"}・${svg.querySelectorAll("g.edge path").length} 條邊・${fmtMs(t)}`);
      };
      ctx.toggle("叢集框", true, (v) => { opt.clusters = v; draw(); });
      ctx.toggle("邊接到框", true, (v) => { opt.compound = v; draw(); });
      ctx.group(["由上而下", "由左而右"], opt.dir === "LR" ? 1 : 0, (i) => { opt.dir = i ? "LR" : "TB"; draw(); });
      await ready(ctx);
      draw();
    },
  },
  {
    id: "labels", title: "形狀與標籤", paper: true,
    api: "shape=record 與 <port>・label=<<table>…</table>>・<img src>＋images 選項",
    desc: "節點形狀與填色樣式（漸層、條紋、扇形）一次排開；同一張選課資料表分別用 record 與 HTML 表格標籤畫，邊接到欄位的 port。圖片節點要用 images 選項告訴 Graphviz 圖片尺寸，因為它在瀏覽器裡讀不到檔案。",
    hint: "切換四種標籤寫法",
    async mount(ctx) {
      ctx.html(`<div class="vz-wrap"><div class="vz-view"></div></div>`);
      const view = viewer(ctx, ctx.$(".vz-view"));
      let mode = 0, shapeCols = 0, wide = true;
      const TAGS = [
        "24 種形狀＋6 種填色樣式",
        "record：| 分隔欄位，<port> 命名連接點，{ } 翻轉方向",
        "HTML 標籤：table、font、b，td 上的 port 可當連接點",
        "<img> 放在表格儲存格，尺寸來自 images 選項",
      ];
      const cols = () => {
        const n = SHAPES.length + STYLES.length;
        const r = view.box.clientWidth / Math.max(1, view.box.clientHeight);
        return Math.max(3, Math.min(10, Math.round(Math.sqrt(n * r * 0.55))));
      };
      const draw = () => {
        if (!viz) return;
        wide = view.wide();
        shapeCols = cols();
        const dir = wide ? "LR" : "TB";
        const job = [
          { src: SHAPES_DOT(shapeCols) },
          { src: RECORD_DOT(dir) },
          { src: HTML_DOT(dir) },
          { src: PHOTO_DOT(), opts: { images: PHOTO_SIZES } },
        ][mode];
        const [svg, t] = timed(() => svgOf(job));
        view.set(svg);
        view.tag(TAGS[mode]);
        view.info(`${svg.querySelectorAll("g.node").length} 個節點・${fmtMs(t)}`);
      };
      view.onSize = () => { if (viz && (view.wide() !== wide || (mode === 0 && cols() !== shapeCols))) draw(); };
      ctx.group(["節點形狀", "record", "HTML 表格", "圖片節點"], 0, (i) => { mode = i; draw(); });
      await ready(ctx);
      draw();
    },
  },
  {
    id: "edges", title: "方向與連線", paper: true,
    api: "rankdir=TB｜LR｜BT｜RL・splines=…・arrowhead／arrowtail・style・penwidth・color=\"a:b\"",
    desc: "同一張訂單流程切換排版方向與連線演算法，每條邊示範一種箭頭或線條樣式，標籤寫著用到的屬性。ortho 直角連線不支援一般邊標籤，這裡自動改用 xlabel。",
    hint: "切換方向與連線方式，拖曳層距",
    async mount(ctx) {
      ctx.html(`<div class="vz-wrap"><div class="vz-view"></div></div>`);
      const view = viewer(ctx, ctx.$(".vz-view"));
      const DIRS = ["TB", "LR", "BT", "RL"];
      const DIR_ZH = { TB: "由上而下", LR: "由左而右", BT: "由下而上", RL: "由右而左" };
      const { width, height } = ctx.size();
      const opt = { rankdir: width > height ? "LR" : "TB", splines: "spline", labels: true, ranksep: 0.5 };
      const draw = () => {
        if (!viz) return;
        const [r, t] = timed(() => viz.render(FLOW_DOT(opt), gvOpts({ format: "svg" })));
        if (r.status !== "success") return;
        view.set(parseSvg(r.output));
        const warn = notes(r.errors).length ? "・Graphviz 有警告" : "";
        view.tag(`rankdir=${opt.rankdir}（${DIR_ZH[opt.rankdir]}）・splines=${opt.splines}${opt.splines === "ortho" && opt.labels ? "・標籤改用 xlabel" : ""}`);
        view.info(`${fmtMs(t)}${warn}`);
      };
      ctx.group(DIRS, DIRS.indexOf(opt.rankdir), (i) => { opt.rankdir = DIRS[i]; draw(); });
      ctx.select("連線", [
        { value: "spline", label: "spline 曲線" }, { value: "polyline", label: "polyline 折線" },
        { value: "ortho", label: "ortho 直角" }, { value: "line", label: "line 直線" }, { value: "curved", label: "curved 弧線" },
      ], "spline", (v) => { opt.splines = v; draw(); });
      ctx.toggle("邊標籤", true, (v) => { opt.labels = v; draw(); });
      ctx.slider("層距", { min: 0.2, max: 1.4, step: 0.1, value: 0.5, format: (v) => v.toFixed(1) }, (v) => { opt.ranksep = v; draw(); });
      await ready(ctx);
      draw();
    },
  },
  {
    id: "formats", title: "輸出格式", paper: true,
    api: "viz.renderFormats(dot, [\"svg\", \"json\", \"xdot\", \"plain\", \"dot\"], { engine: \"neato\", yInvert })",
    desc: "一次排版同時輸出五種格式：左邊是 SVG，右邊是選定格式的原文，可下載成檔案。節點位置用 pos=\"x,y!\" 固定，neato 只負責畫線；打開 y 軸反轉，座標會改成原點在左上角。",
    hint: "切換輸出格式・下載目前格式",
    async mount(ctx) {
      ctx.html(`<div class="vz-wrap"><div class="vz-view vz-top"></div><div class="vz-side vz-out"><div><code class="vz-fmt"></code> <span class="vz-fdesc"></span></div><pre class="vz-pre vz-text"></pre><div class="vz-out-foot"></div></div></div>`);
      const view = viewer(ctx, ctx.$(".vz-view"));
      const fmtEl = ctx.$(".vz-fmt"), descEl = ctx.$(".vz-fdesc"), text = ctx.$(".vz-text"), foot = ctx.$(".vz-out-foot");
      const LIMIT = 9000;
      let cur = 1, yInvert = false, out = null, ms = 0;
      const show = () => {
        const f = FORMATS[cur], s = out[f.id];
        fmtEl.textContent = f.id;
        descEl.textContent = f.zh;
        text.textContent = s.length > LIMIT ? `${s.slice(0, LIMIT)}\n…（以下省略，共 ${fmt(s.length)} 字元）` : s;
        text.scrollTop = 0;
        foot.textContent = `${fmt(new Blob([s]).size)} bytes・五種格式共用一次排版 ${fmtMs(ms)}`;
      };
      const draw = () => {
        if (!viz) return;
        const [r, t] = timed(() => viz.renderFormats(MRT_DOT, FORMATS.map((f) => f.id), gvOpts({ engine: "neato", yInvert })));
        if (r.status !== "success") return;
        out = r.output; ms = t;
        view.set(parseSvg(out.svg));
        view.tag(yInvert ? "yInvert：原點在左上" : "Graphviz 座標：原點在左下");
        show();
      };
      ctx.group(FORMATS.map((f) => f.id), cur, (i) => { cur = i; if (out) show(); });
      ctx.toggle("y 軸反轉", false, (v) => { yInvert = v; draw(); });
      ctx.button("下載目前格式", () => {
        if (!out) return;
        const f = FORMATS[cur];
        download(`捷運轉乘.${f.ext}`, out[f.id], f.type);
      });
      await ready(ctx);
      draw();
    },
  },
  {
    id: "trace", title: "點選追蹤", paper: true,
    api: "viz.renderSVGElement({ nodes, edges, subgraphs }) 圖物件輸入・id 屬性對應 SVG 元素",
    desc: "資訊系課程先修地圖直接用 JavaScript 物件（graph object）輸入，不必拼 DOT 字串；每個節點與邊的 id 屬性會成為 SVG 元素的 id。點一門課，標出相鄰、全部先修或全部後續的課程與連線。",
    hint: "點任一門課・切換追蹤範圍・點空白處取消",
    async mount(ctx) {
      ctx.html(`<div class="vz-wrap"><div class="vz-view vz-trace"></div><div class="vz-side vz-opt"></div></div>`);
      const view = viewer(ctx, ctx.$(".vz-view"));
      const side = ctx.$(".vz-side");
      let sel = COURSE_IDX["資料結構"], mode = 0, dir = "";
      const names = (set) => [...set].sort((a, b) => a - b).map((i) => COURSES[i][0]);
      const apply = () => {
        const svg = view.box.firstElementChild;
        if (!svg) return;
        svg.classList.toggle("vz-has", sel >= 0);
        svg.querySelectorAll(".vz-hi, .vz-sel").forEach((el) => el.classList.remove("vz-hi", "vz-sel"));
        if (sel < 0) {
          side.replaceChildren(h("h3", {}, "點一門課"), h("p", {}, "顏色代表年級，箭頭從先修課指向後續課程。"));
          view.info(`${COURSES.length} 門課・${PREREQ.length} 條先修關係`);
          return;
        }
        const { nodes, edges } = trace(sel, mode);
        nodes.forEach((i) => svg.querySelector(`#vzc-${i}`)?.classList.add("vz-hi"));
        edges.forEach((k) => svg.querySelector(`#vze-${k}`)?.classList.add("vz-hi"));
        svg.querySelector(`#vzc-${sel}`)?.classList.add("vz-sel");
        const before = trace(sel, 1).nodes, after = trace(sel, 2).nodes;
        before.delete(sel); after.delete(sel);
        const direct = (pick) => new Set(PREREQ.filter((e) => e[pick ? 0 : 1] === sel).map((e) => e[pick ? 1 : 0]));
        const list = (set) => (set.size ? h("div", { class: "vz-list" }, ...names(set).map((n) => h("span", {}, n))) : h("p", {}, "無"));
        side.replaceChildren(
          h("h3", {}, COURSES[sel][0], h("span", { class: "vz-pill" }, YEARS[COURSES[sel][1]])),
          h("p", {}, "直接先修"), list(direct(false)),
          h("p", {}, "直接後續"), list(direct(true)),
          h("p", {}, `全部先修 ${before.size} 門・全部後續 ${after.size} 門`),
        );
        view.info(`${COURSES[sel][0]}：先修 ${before.size} 門・後續 ${after.size} 門`);
      };
      const draw = () => {
        if (!viz) return;
        dir = view.wide() ? "LR" : "TB";
        view.set(viz.renderSVGElement(courseGraph(dir), gvOpts()));
        apply();
      };
      view.onSize = () => { if (viz && (view.wide() ? "LR" : "TB") !== dir) draw(); };
      ctx.on(view.box, "click", (ev) => {
        const g = ev.target.closest("g.node");
        sel = g && g.id.startsWith("vzc-") ? +g.id.slice(4) : -1;
        apply();
      });
      ctx.group(["直接相鄰", "全部先修", "全部後續"], 0, (i) => { mode = i; apply(); });
      await ready(ctx);
      draw();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "viz.renderSVGElement(dot, { engine })・每個引擎各自的節點數級距",
    desc: "產生 N 個節點的隨機有向圖（一棵樹加上約三成額外的邊），量測選定引擎從排版到 SVG 放進頁面所需時間。換引擎會重建測試級距，右上角累積各引擎的紀錄方便比較。",
    hint: "選引擎，按「開始測試」，換引擎再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="vz-stress"><div class="vz-view"></div><div class="vz-board"></div></div>`);
      const view = viewer(ctx, ctx.$(".vz-view"), 1.3);
      const board = ctx.$(".vz-board");
      const best = {};
      let engine = "dot", lab = null;
      const showBoard = () => {
        const rows = ENGINES.filter((e) => best[e.id]).map((e) => {
          const b = best[e.id];
          return h("tr", {}, h("td", {}, e.id), h("td", {}, b.n ? `${fmt(b.n)} 個` : "未達"), h("td", {}, b.n ? fmtMs(b.ms) : `${fmt(b.first)} 個就 ${fmtMs(b.firstMs)}`));
        });
        board.replaceChildren(h("b", {}, "各引擎 1 秒內最大節點數"),
          rows.length ? h("table", {}, ...rows) : h("p", {}, "測完一個引擎後，結果會留在這裡。"));
      };
      const record = (eng, n, ms) => {
        const b = best[eng] || (best[eng] = { n: 0, ms: 0, first: n, firstMs: ms });
        if (ms <= 1000 && n >= b.n) { b.n = n; b.ms = ms; }
        showBoard();
      };
      const preview = () => {
        if (!viz) return;
        const [svg, t] = timed(() => svgOf({ src: bigGraph(60).src, opts: { engine } }));
        view.set(svg);
        view.info(`${engine}・60 個節點預覽・${fmtMs(t)}`);
      };
      const makeBench = () => {
        if (lab) {
          const stop = lab.panel.querySelector(".row .btn:not(.primary)");
          if (stop && !stop.disabled) stop.click();
          lab.panel.parentElement.remove();
        }
        const eng = engine;
        lab = ctx.bench({
          title: `極限測試：${eng} 節點數`,
          label: "節點數", unit: "個",
          sizes: STRESS_SIZES[eng],
          budget: 2000, target: 1000,
          prepare: (n) => bigGraph(n),
          async run(n, data) {
            const t0 = performance.now();
            const svg = viz.renderSVGElement(data.src, gvOpts({ engine: eng }));
            view.set(svg);
            view.box.getBoundingClientRect();
            await ctx.frame(1);
            record(eng, n, performance.now() - t0);
            view.info(`${eng}・${fmt(n)} 個節點`);
            return `${fmt(data.edges)} 條邊`;
          },
          note: "計時包含 Graphviz 排版、產生 SVG 字串、解析成元素、放進頁面與下一個畫格。各引擎成長速度差很多：circo 與 fdp 的計算量隨節點數急遽上升，neato 次之，dot 的分層與交叉最小化中等，sfdp、twopi、osage、patchwork 接近線性，所以每個引擎的級距不同。Graphviz 以 WebAssembly 在主執行緒同步執行，排版期間頁面會暫停回應。",
        });
      };
      ctx.controls.classList.add("bottom");
      ctx.select("引擎", ENGINES.map((e) => ({ value: e.id, label: `${e.id}（${e.zh}）` })), "dot", (v) => {
        engine = v; makeBench(); preview();
      });
      showBoard();
      makeBench();
      await ready(ctx);
      preview();
    },
  },
] });
</script>
</body>
