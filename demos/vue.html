<script>
// Vue 3 showcase: eight scenes, each mounts its own createApp() and unmounts it on scene switch.
const { createApp, ref, reactive, computed, watch, watchEffect, shallowRef, triggerRef, nextTick,
  provide, inject, onMounted, onUnmounted, onBeforeUpdate, markRaw } = Vue;

// Mount a Vue app inside the scene and register app.unmount() as cleanup.
function mountApp(ctx, host, options, extend) {
  const app = createApp(options);
  if (extend) extend(app);
  app.mount(host);
  ctx.onCleanup(() => app.unmount());
  return app;
}
// Scene shell: <div class="vu-root"><div class="vu-host"></div></div>; returns the host element.
function shell(ctx) {
  ctx.html(`<div class="vu-root"><div class="vu-host"></div></div>`);
  return ctx.$(".vu-host");
}
const stamp = () => { const d = new Date(); return `${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}.${String(d.getMilliseconds()).padStart(3, "0").slice(0, 2)}`; };
// Bounded reactive log list (newest first).
function useLog(max = 30) {
  const items = ref([]);
  let seq = 0;
  const push = (text, extra = "") => { items.value.unshift({ id: ++seq, t: stamp(), text, extra }); if (items.value.length > max) items.value.pop(); };
  return { items, push };
}

function teaSetup() {
  const people = ref(6), view = ref("menu"), flash = ref("");
  const pick = reactive({ size: "L", sugar: "半糖", ice: "少冰" });
  const lines = ref([]);
  let timer;
  onUnmounted(() => clearTimeout(timer));
  const notify = (text) => { flash.value = text; clearTimeout(timer); timer = setTimeout(() => (flash.value = ""), 1600); };
  function add(d, opts = pick, qty = 1, quiet = false) {
    const key = `${d.id}-${opts.size}-${opts.sugar}-${opts.ice}`;
    const found = lines.value.find((x) => x.key === key);
    if (found) found.qty += qty;
    else lines.value.unshift({ key, ...d, ...opts, price: opts.size === "M" ? d.m : d.l, qty });
    if (!quiet) notify(`已加入 ${d.name}（${opts.size}・${opts.sugar}・${opts.ice}）`);
  }
  function change(it, delta) {
    it.qty += delta;
    if (it.qty <= 0) lines.value = lines.value.filter((x) => x !== it);
  }
  const cups = computed(() => lines.value.reduce((n, x) => n + x.qty, 0));
  const subtotal = computed(() => lines.value.reduce((n, x) => n + x.price * x.qty, 0));
  const discount = computed(() => (cups.value >= 10 ? Math.round(subtotal.value * 0.1) : 0));
  const afterDiscount = computed(() => subtotal.value - discount.value);
  const delivery = computed(() => (!cups.value || afterDiscount.value >= 500 ? 0 : 60));
  const total = computed(() => afterDiscount.value + delivery.value);
  const perPerson = computed(() => Math.ceil(total.value / people.value));
  const sugarDist = computed(() => SUGAR.map((label) => {
    const n = lines.value.filter((x) => x.sugar === label).reduce((s, x) => s + x.qty, 0);
    return { label, n, pct: cups.value ? (n / cups.value) * 100 : 0 };
  }));
  const kcal = computed(() => Math.round(lines.value.reduce((s, x) => s + (x.kcal + SUGAR_KCAL[x.sugar]) * (x.size === "L" ? 1.3 : 1) * x.qty, 0)));
  const topDrink = computed(() => {
    const by = {};
    lines.value.forEach((x) => (by[x.name] = (by[x.name] || 0) + x.qty));
    const top = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
    return top ? `${top[0]} ${top[1]} 杯` : "還沒有";
  });
  const avgPrice = computed(() => (cups.value ? Math.round(subtotal.value / cups.value) : 0));
  const submit = () => { notify(`已送出 ${cups.value} 杯，每人 NT$${perPerson.value}`); lines.value = []; };
  add(MENU[0], { size: "L", sugar: "半糖", ice: "少冰" }, 3, true);
  add(MENU[2], { size: "M", sugar: "微糖", ice: "去冰" }, 2, true);
  add(MENU[1], { size: "L", sugar: "無糖", ice: "正常" }, 2, true);
  return { MENU, SUGAR, ICE, people, view, pick, lines, flash, add, change, cups, subtotal, discount, afterDiscount, delivery, total, perPerson, sugarDist, kcal, topDrink, avgPrice, submit };
}

// ---------- scene 6: composables ----------
const ThemeKey = Symbol("theme");
const LogKey = Symbol("log");
// Pointer position inside an element; listeners live exactly as long as the component.
function usePointer(target) {
  const x = ref(50), y = ref(50), inside = ref(false);
  const move = (e) => { const r = target.value.getBoundingClientRect(); x.value = Math.round(((e.clientX - r.left) / r.width) * 100); y.value = Math.round(((e.clientY - r.top) / r.height) * 100); inside.value = true; };
  const leave = () => (inside.value = false);
  onMounted(() => { target.value.addEventListener("pointermove", move); target.value.addEventListener("pointerleave", leave); });
  onUnmounted(() => { target.value?.removeEventListener("pointermove", move); target.value?.removeEventListener("pointerleave", leave); });
  return { x, y, inside };
}
function useTicker(ms) {
  const n = ref(0);
  let id;
  onMounted(() => (id = setInterval(() => n.value++, ms)));
  onUnmounted(() => clearInterval(id));
  return n;
}
const PointerPad = {
  props: { name: String },
  setup(props) {
    const el = ref(null);
    const { x, y, inside } = usePointer(el);
    const secs = useTicker(1000);
    const log = inject(LogKey);
    onMounted(() => log(`onMounted：${props.name}`));
    onUnmounted(() => log(`onUnmounted：${props.name}（監聽器已移除）`));
    return { el, x, y, inside, secs };
  },
  template: `<div class="vu-pad" ref="el"><span class="rd">{{ name }}・x {{ x }} y {{ y }}・存活 {{ secs }} 秒</span><i class="dot" :style="{ left: x + '%', top: y + '%', opacity: inside ? 1 : .35 }"></i></div>`,
};

// v-tip:[placement]="text" shows a tooltip in the scene's portal layer.
function makeTip(layer) {
  return {
    mounted(el, binding) {
      const show = () => {
        const tip = document.createElement("div");
        tip.className = "vu-tip";
        tip.textContent = el._tipText;
        layer.append(tip);
        const r = el.getBoundingClientRect(), L = layer.getBoundingClientRect();
        const below = binding.arg === "bottom";
        tip.style.left = `${Math.max(4, Math.min(L.width - tip.offsetWidth - 4, r.left - L.left + r.width / 2 - tip.offsetWidth / 2))}px`;
        tip.style.top = `${below ? r.bottom - L.top + 6 : r.top - L.top - tip.offsetHeight - 6}px`;
        el._tip = tip;
      };
      const hide = () => { el._tip?.remove(); el._tip = null; };
      el._tipText = binding.value;
      el._tipOff = () => { hide(); el.removeEventListener("mouseenter", show); el.removeEventListener("mouseleave", hide); };
      el.addEventListener("mouseenter", show);
      el.addEventListener("mouseleave", hide);
    },
    updated(el, { value }) { el._tipText = value; },
    unmounted(el) { el._tipOff(); },
  };
}

    id: "stress", title: "極限測試", kind: "stress",
    api: "v-for :key + shallowRef / triggerRef + nextTick",
    desc: "仿 js-framework-benchmark：建立 N 列表格，每一格把每第 10 列的計數加一並等 nextTick 完成修補，逐級加大列數直到掉到 30 FPS 以下。可切換深層 reactive 與 shallowRef＋triggerRef 比較追蹤成本。",
    hint: "按「自動加壓」開始；切換 shallowRef 後再測一次比較",
    mount(ctx) {
      ctx.html(`<div class="vu-stress"><div class="hd"></div><div class="tbl"><div class="vu-host"></div></div></div>`);
      const head = ctx.$(".hd");
      let shallow = false, createMs = 0, patchMs = 0, swapMs = 0, frames = 0;
      let vm;
      mountApp(ctx, ctx.$(".vu-host"), {
        setup() {
          const rows = shallowRef([]);
          vm = {
            async set(list) { rows.value = shallow ? list : reactive(list); await nextTick(); },
            bump() {
              const list = rows.value;
              for (let i = 0; i < list.length; i += 10) list[i].n++;
              if (shallow) triggerRef(rows);
            },
            swap() { const l = rows.value; if (l.length > 4) { const a = l[1]; l[1] = l[l.length - 2]; l[l.length - 2] = a; if (shallow) triggerRef(rows); } },
            get rows() { return rows.value; },
          };
          return { rows };
        },
        template: `<table><tbody><tr v-for="r in rows" :key="r.id"><td class="id">{{ r.id }}</td><td>{{ r.label }}</td><td class="n">{{ r.n }}</td></tr></tbody></table>`,
      });
      const paintHead = () => (head.innerHTML = `${shallow ? "shallowRef＋triggerRef" : "深層 reactive"}・建立 <b>${createMs.toFixed(0)} ms</b>・每格修補 <b>${patchMs.toFixed(1)} ms</b>・交換 <b>${swapMs.toFixed(1)} ms</b>`);
      async function rebuild(n) {
        const t0 = performance.now();
        await vm.set(buildRows(n));
        createMs = performance.now() - t0;
        paintHead();
      }
      let busy = false;
      ctx.raf(async () => {
        if (busy || !vm.rows.length) return;
        busy = true;
        const t0 = performance.now();
        vm.bump();
        await nextTick();
        patchMs += (performance.now() - t0 - patchMs) * 0.15;
        if (++frames % 15 === 0) paintHead();
        busy = false;
      });
      ctx.controls.classList.add("bottom");
      ctx.toggle("shallowRef", false, async (v) => { shallow = v; await rebuild(vm.rows.length || 1000); });
      ctx.button("交換兩列", async () => { const t0 = performance.now(); vm.swap(); await nextTick(); swapMs = performance.now() - t0; paintHead(); });
      ctx.ramp({
        label: "表格列", unit: "列", steps: [500, 1000, 2000, 5000, 10000, 20000, 40000, 80000], minFps: 30,
        apply: (n) => rebuild(n),
        metrics: () => ({ 建立: `${createMs.toFixed(0)} ms`, 每格修補: `${patchMs.toFixed(1)} ms`, 模式: shallow ? "shallowRef" : "深層 reactive" }),
        note: "每格修改十分之一列的數字，Vue 重新執行整個列表的 render 並以 key 比對 vnode，只改動真的變了的文字節點；瓶頸是 vnode 比對與瀏覽器版面重排。深層 reactive 建立時要為每列建 Proxy、render 時逐一追蹤；shallowRef 省掉這些，但要手動 triggerRef。",
      });
    },
