// ---------- generic helpers ----------
// Observe a nested element only (never .board itself, whose padding the control bar changes).
function watch(ctx, el, fn) {

// Track a card's height and report the waveform height that fits (minus `reserve` px).
function fit(ctx, card, reserve, apply) {
  const get = () => Math.max(36, Math.floor(card.clientHeight - reserve));

  watch(ctx, card, () => { const v = get(); if (v !== cur) { cur = v; apply(v); } });

}
const WAIT = '<div class="ws-empty" data-wait><span>頁內合成音訊中…</span></div>';

const lazyAudio = () => Object.assign(new Audio(), { preload: "none" });

  ws.on("pause", () => (btn.textContent = "▶"));
  if (!timeEl) return;
  const show = (t) => (timeEl.textContent = `${fmtT(t)} / ${fmtT(ws.getDuration() || 0)}`);

function setSlider(input, v, format) { input.value = v; if (input.nextElementSibling) input.nextElementSibling.textContent = format(+input.value); }
// Regions live inside wavesurfer's shadow DOM, so the label is styled inline.
function label(text) {

  el.style.cssText = "font:600 12px sans-serif;color:#111;padding:2px 8px;margin:6px;border-radius:6px;" +

const head = (title, sub, extra = "", cls = "") =>
  `<div class="ws-head"><button class="ws-play ${cls}" type="button" data-play aria-label="播放">▶</button>` +

// 16-bit PCM RIFF encoder for Float32 channels.
function wavHeader(v, frames, chans, sr) {
  const put = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  const bytes = frames * chans * 2;
  put(0, "RIFF"); v.setUint32(4, 36 + bytes, true); put(8, "WAVE"); put(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, chans, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * chans * 2, true); v.setUint16(32, chans * 2, true); v.setUint16(34, 16, true);
  put(36, "data"); v.setUint32(40, bytes, true);
}
function wavBlob(chs, sr) {
  const n = chs[0].length, c = chs.length, buf = new ArrayBuffer(44 + n * c * 2);
  wavHeader(new DataView(buf), n, c, sr);
  const pcm = new Int16Array(buf, 44);
  for (let i = 0; i < n; i++) for (let k = 0; k < c; k++) {
    const s = Math.max(-1, Math.min(1, chs[k][i]));
    pcm[i * c + k] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return new Blob([buf], { type: "audio/wav" });
}

// ---------- in-page synthesis (works on any BaseAudioContext) ----------
const NOISE = new WeakMap();
function noise(c) {
  if (NOISE.has(c)) return NOISE.get(c);
  const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  NOISE.set(c, b);
  return b;
}
function env(c, out, t, a, d, peak) {
  const g = c.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  g.connect(out);

}
function kick(c, out, t, v = 0.9) {
  const o = c.createOscillator();
  o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
  o.connect(env(c, out, t, 0.003, 0.32, v));
  o.start(t); o.stop(t + 0.4);
}
function hit(c, out, t, { v = 0.3, d = 0.05, type = "highpass", f = 7000, q = 0.7, a = 0.002 } = {}) {
  const s = c.createBufferSource(), flt = c.createBiquadFilter();
  s.buffer = noise(c); s.loop = true; flt.type = type; flt.frequency.value = f; flt.Q.value = q;
  s.connect(flt).connect(env(c, out, t, a, d, v));
  s.start(t, Math.random() * 0.5); s.stop(t + a + d + 0.05);
}
const hat = (c, out, t, v = 0.2) => hit(c, out, t, { v, d: 0.045 });
function snare(c, out, t, v = 0.5) {
  hit(c, out, t, { v, d: 0.16, type: "bandpass", f: 1900, q: 0.8 });

function tone(c, out, t, f, dur, { type = "sawtooth", v = 0.2, cut = 2400, a = 0.005 } = {}) {
  const o = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
  o.type = type; o.frequency.value = f; lp.frequency.value = cut;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + a);
  g.gain.setValueAtTime(v, t + Math.max(a, dur * 0.5)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(lp).connect(g).connect(out);

const CH = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G
const ROOT = [45, 41, 36, 43];
// Render with OfflineAudioContext, then scale to the requested peak.
async function render(sec, sr, chans, build, peak = 0.9) {
  const oc = new OfflineAudioContext(chans, Math.ceil(sec * sr), sr);
  build(oc, oc.destination);
  const buf = await oc.startRendering();
  const chs = Array.from({ length: chans }, (_, i) => buf.getChannelData(i));
  let m = 0;
  for (const ch of chs) for (let i = 0; i < ch.length; i++) { const a = Math.abs(ch[i]); if (a > m) m = a; }
  const k = m > 0 ? peak / m : 1;
  for (const ch of chs) for (let i = 0; i < ch.length; i++) ch[i] *= k;
  return { chs, sr };
}
// 8 s groove with a quiet break in bar 3 (scene 2).
function groove(c, out) {
  for (let i = 0; i < 16; i++) {
    const t = i * 0.5, bar = i >> 2;
    if (bar !== 2) { kick(c, out, t, 0.9); hat(c, out, t + 0.25, 0.16); }
    if (bar === 3 && i % 2) snare(c, out, t, 0.5);
  }
  for (let i = 0; i < 32; i++) {
    const bar = i >> 3, m = CH[bar][i % 3] + 12 + (i % 8 > 4 ? 12 : 0);
    tone(c, out, i * 0.25, mf(m), 0.22, { type: "triangle", v: bar === 2 ? 0.05 : 0.06 + 0.1 * ((i % 8) / 8), cut: 3500 });
  }

}
// Stereo: left = kick + bass, right = hats + arpeggio (scene 3).
function stereo(c) {
  const mg = c.createChannelMerger(2), L = c.createGain(), R = c.createGain();
  mg.connect(c.destination); L.connect(mg, 0, 0); R.connect(mg, 0, 1);
  for (let i = 0; i < 16; i++) {
    const t = i * 0.5, k = (i >> 2) % 4;
    kick(c, L, t, 0.9);
    tone(c, L, t + 0.25, mf(ROOT[k] + 12), 0.22, { v: 0.32, cut: 420 });
  }
  for (let i = 0; i < 64; i++) hat(c, R, i * 0.125, i % 4 === 2 ? 0.3 : 0.1);
  for (let i = 0; i < 32; i++) {
    const k = (i >> 3) % 4;

// 48 s song in five sections (scene 4).
const SECTIONS = [["前奏", 0, 8], ["主歌", 8, 20], ["副歌", 20, 32], ["間奏", 32, 40], ["尾奏", 40, 48]];
function song(c, out) {
  for (let bar = 0; bar < 24; bar++) {
    const t = bar * 2, k = bar % 4;

    if (sec === 0 || sec >= 3) CH[k].forEach((m) => tone(c, out, t, mf(m), 2.1, { v: 0.05 * fade, cut: 700, a: 0.6 }));
    if (sec === 2) CH[k].forEach((m) => tone(c, out, t, mf(m + 12), 1.9, { v: 0.06, cut: 2600, a: 0.02 }));
    if (sec === 3 && bar === 19) hit(c, out, t, { v: 0.35, d: 0.15, type: "bandpass", f: 3000, q: 1.2, a: 1.8 });
    for (let b = 0; b < 4; b++) {
      const tb = t + b * 0.5;

      if (sec === 2 && b % 2) snare(c, out, tb, 0.45);

// 10 s: sweep, harmonic chord, vibrato whistle, drums (scene 5).
const SPEC_PARTS = [["掃頻 150 到 8000 Hz", "#4cc9f0"], ["鋸齒波和弦泛音", "#f7df1e"], ["顫音旋律", "#7bd389"], ["鼓組寬頻雜訊", "#f72585"]];
function spectro(c, out) {
  const o = c.createOscillator(), g = c.createGain();
  o.frequency.setValueAtTime(150, 0.1); o.frequency.exponentialRampToValueAtTime(8000, 2.3);
  g.gain.setValueAtTime(0, 0.1); g.gain.linearRampToValueAtTime(0.5, 0.2);
  g.gain.setValueAtTime(0.5, 2.25); g.gain.linearRampToValueAtTime(0, 2.4);
  o.connect(g).connect(out); o.start(0.1); o.stop(2.45);

    const t = 5.05 + i * 0.48, w = c.createOscillator(), lfo = c.createOscillator(), dep = c.createGain();
    w.frequency.value = mf(m); lfo.frequency.value = 6; dep.gain.value = mf(m) * 0.03;
    lfo.connect(dep).connect(w.frequency);

    w.start(t); w.stop(t + 0.47); lfo.start(t); lfo.stop(t + 0.47);
  });

    const t = 7.55 + i * 0.125;

// Voice-like syllables: sawtooth glottal source through three formant band-passes (scene 7).
const VOWELS = [[800, 1200, 2500], [300, 2300, 3000], [350, 800, 2300], [450, 1900, 2600], [500, 900, 2400]];
function voice(c, out, t0 = 0, n = 6) {
  for (let k = 0; k < n; k++) {
    const t = t0 + 0.15 + k * 0.48, f = VOWELS[(k * 3) % 5], p = 125 + 30 * Math.sin(k * 1.7);

      bp.type = "bandpass"; bp.frequency.value = hz; bp.Q.value = 9; gg.gain.value = [1, 0.6, 0.3][i];

// Long 8 kHz mono WAV straight into Int16 (stress test); also returns 100 peaks per second.
function longClip(sec) {

        淡入淡出: (D) => [[0, 0], [2.4, 1], [D - 3.6, 1], [D, 0]],
        人聲閃避: (D) => [[0, 0.9], [4.4, 0.9], [5, 0.22], [12, 0.22], [12.8, 0.9], [D, 0.9]],
        脈動: (D) => Array.from({ length: Math.floor(D / 0.6) + 1 }, (_, i) => [Math.min(D, i * 0.6), i % 2 ? 0.25 : 1]),
        平直: (D) => [[0, 0.8], [D, 0.8]],
      };
      const names = Object.keys(PRESETS);
      let pick = 0, ws = null;
      const env = EnvelopePlugin.create({ volume: 0.8, lineColor: "rgba(247, 223, 30, 0.9)", lineWidth: "3", dragLine: true,
        dragPointSize: 12, dragPointFill: "#f7df1e", dragPointStroke: "#1a1a14" });
      const applyPreset = () => { const D = ws.getDuration(); if (D) env.setPoints(PRESETS[names[pick]](D).map(([time, volume]) => ({ time, volume }))); };
      ctx.group(names, pick, (i) => { pick = i; applyPreset(); });
      const card = ctx.$("[data-card]"), bar = ctx.$("[data-mv]"), val = ctx.$("[data-vv]"), logEl = ctx.$("[data-g]");
      const H = fit(ctx, card, 16, (v) => ws.setOptions({ height: v }));
      ws = make(ctx, { container: ctx.$("[data-w]"), media: lazyAudio(), url: LOOP, height: H,
        waveColor: ["#5d6a86", "#2c3240", "#5d6a86"], progressColor: ["#7bd389", "#2f6b3c", "#7bd389"],
        cursorColor: "#ffffff", cursorWidth: 2, barWidth: 2, barGap: 1, barRadius: 2, plugins: [env] });
      bindPlay(ws, ctx.$("[data-play]"), ctx.$("[data-sub] span"));
      const meter = (v) => { bar.style.width = `${v * 100}%`; val.textContent = `${Math.round(v * 100)}%`; };
      env.on("volume-change", meter);
      env.on("points-change", (pts) => {
        const txt = pts.slice(0, 8).map((p) => `${p.time.toFixed(1)}s ${Math.round(p.volume * 100)}%`).join("、");
        logEl.innerHTML = `<code>points-change</code> 控制點 <b>${pts.length}</b> 個：<span class="m">${txt}${pts.length > 8 ? "…" : ""}</span>`;
      });
      ws.on("ready", () => { applyPreset(); meter(env.getCurrentVolume()); });
      ws.on("interaction", () => ctx.timeout(() => meter(env.getCurrentVolume()), 30));
    },
  },
  {
    id: "record", title: "錄音",
    api: "RecordPlugin.create({ scrollingWaveform })・startRecording()・on(\"record-end\")",
    desc: "按下才詢問麥克風權限，錄音時即時捲動顯示輸入波形，停止後把錄音 Blob 交給下方播放器；沒有麥克風時改用合成訊號，走同一套即時波形與 MediaRecorder。",
    hint: "按紅色按鈕開始錄音，再按一次停止；「合成訊號」不需要權限",
    async mount(ctx) {
      ctx.html(`<div class="board"><div class="ws-col">
        <div class="ws-head"><button class="ws-play rec" type="button" data-rec aria-label="錄音">●</button>
          <div class="ws-ttl"><b>麥克風錄音</b><small data-rs>按紅色按鈕開始，瀏覽器會詢問麥克風權限</small></div>
          <button class="btn" type="button" data-syn>合成訊號</button></div>
        <div class="ws-card np" data-live><div class="ws-empty" data-empty><span>即時輸入波形會在這裡顯示</span></div><div data-lw></div></div>
        ${head('<span data-pt>錄好的音訊（示意：合成人聲）</span>', '<span class="m">0:00.0 / 0:03.2</span>', '<a class="btn" data-dl hidden>下載</a>', "sm")}
        <div class="ws-card" data-pc>${WAIT}<div data-pw></div></div>
      </div></div>`);
      let mode = 0, busy = null, rec = null, ac = null, mr = null, view = null;
      const recBtn = ctx.$("[data-rec]"), synBtn = ctx.$("[data-syn]"), rs = ctx.$("[data-rs]"), empty = ctx.$("[data-empty]");
      const ui = () => {
        recBtn.classList.toggle("on", busy === "mic"); recBtn.textContent = busy === "mic" ? "■" : "●";
        synBtn.textContent = busy === "syn" ? "停止" : "合成訊號";
        recBtn.disabled = busy === "syn"; synBtn.disabled = busy === "mic";
      };
      const liveCard = ctx.$("[data-live]"), pbCard = ctx.$("[data-pc]");
      const HL = fit(ctx, liveCard, 2, (v) => live.setOptions({ height: v }));
      const HP = fit(ctx, pbCard, 16, (v) => pb.setOptions({ height: v }));
      const live = make(ctx, { container: ctx.$("[data-lw]"), height: HL, waveColor: "#f72585", progressColor: "#f72585",
        barWidth: 2, barGap: 1, barRadius: 2, cursorWidth: 0, interact: false });
      const pb = make(ctx, { container: ctx.$("[data-pw]"), media: lazyAudio(), height: HP, waveColor: WAVE, progressColor: PROG,
        cursorColor: "#ffffff", cursorWidth: 2, barWidth: 2, barGap: 1, barRadius: 2, normalize: true });
      bindPlay(pb, ctx.$("[data-play]"), ctx.$("[data-pc]").previousElementSibling.querySelector("[data-sub] span"));
      const dl = ctx.$("[data-dl]");
      const loadBlob = (blob, title) => {
        ctx.$("[data-pt]").textContent = title;
        Object.assign(dl, { hidden: false, href: urlFor(ctx, blob), download: `錄音.${blob.type.includes("ogg") ? "ogg" : "webm"}` });
        pb.loadBlob(blob);
      };
      function makeRec() {
        if (rec) live.unregisterPlugin(rec);
        rec = live.registerPlugin(RecordPlugin.create({
          renderRecordedAudio: false, scrollingWaveform: mode === 0, scrollingWaveformWindow: 5,
          continuousWaveform: mode === 1, continuousWaveformDuration: 30,
        }));
        rec.on("record-start", () => (rs.textContent = "錄音中：再按一次停止"));
        rec.on("record-progress", (ms) => (rs.textContent = `錄音中 ${fmtT(ms / 1000)}：再按一次停止`));
        rec.on("record-end", (blob) => {
          rec.stopMic(); busy = null; ui();
          rs.textContent = `錄好 ${fmt(blob.size / 1024)} KB，已載入下方播放器`;
          loadBlob(blob, "你的麥克風錄音");
        });
      }
      ctx.group(["捲動視窗", "連續全程"], mode, (i) => { if (busy) return; mode = i; makeRec(); });
      makeRec();
      recBtn.addEventListener("click", async () => {
        if (busy === "mic") { rec.stopRecording(); return; }
        if (busy) return;
        busy = "mic"; ui(); empty.hidden = true;
        rs.textContent = "等待麥克風權限…";
        try { await rec.startRecording(); } catch (e) {
          busy = null; ui(); empty.hidden = false;
          rs.textContent = `無法使用麥克風（${e.name || e.message}），可改按「合成訊號」`;
        }
      });
      // Fallback without a microphone: a synthesized stream drives the same live waveform
      // (rec.renderMicStream) and is captured with a native MediaRecorder.
      const stopSyn = () => { if (mr && mr.state !== "inactive") mr.stop(); };
      synBtn.addEventListener("click", async () => {
        if (busy === "syn") { stopSyn(); return; }
        if (busy) return;
        busy = "syn"; ui(); empty.hidden = true;
        if (!ac) ac = new AudioContext();
        await ac.resume();
        const dest = ac.createMediaStreamDestination(), bus = ac.createGain(), mon = ac.createGain();
        mon.gain.value = 0.5; bus.connect(dest); bus.connect(mon); mon.connect(ac.destination);
        voice(ac, bus, ac.currentTime + 0.05, 7);
        view = rec.renderMicStream(dest.stream);
        const chunks = [];
        mr = new MediaRecorder(dest.stream);
        mr.ondataavailable = (e) => e.data.size && chunks.push(e.data);
        mr.onstop = () => {
          view.onDestroy(); rec.stopMic(); view = null; busy = null; ui();
          bus.disconnect(); mon.disconnect(); dest.stream.getTracks().forEach((t) => t.stop());
          const blob = new Blob(chunks, { type: mr.mimeType });
          rs.textContent = `合成訊號錄好 ${fmt(blob.size / 1024)} KB，已載入下方播放器`;
          loadBlob(blob, "合成訊號錄音（MediaRecorder）");
        };
        mr.start();
        const t0 = performance.now();
        const tick = ctx.interval(() => {
          if (busy !== "syn") return clearInterval(tick);
          rs.textContent = `合成訊號錄製中 ${fmtT((performance.now() - t0) / 1000)}（renderMicStream 畫即時波形）`;
        }, 100);
        ctx.timeout(stopSyn, 3800);
      });
      ctx.onCleanup(() => {
        if (mr) { mr.onstop = null; if (mr.state !== "inactive") mr.stop(); }
        if (view) view.onDestroy();
        if (rec) { if (rec.isActive()) rec.stopRecording(); rec.stopMic(); }
        if (ac) ac.close();
      });
      const demo = await synth("voice");
      if (!ctx.active) return;
      pb.loadBlob(wavBlob(demo.chs, demo.sr));
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "ws.load(\"\", [channelData], duration)・ws.zoom(pxPerSec)・on(\"redrawcomplete\")",
    desc: "逐級合成 10 秒到 1 小時的 WAV，比較兩種載入法：解碼後把每個取樣交給 wavesurfer 算峰值，或只交預先算好的每秒 100 點峰值；量到波形畫好與縮放重繪的時間。",
    hint: "按「開始測試」；切換下方的模式後可再測一次比較",
    async mount(ctx) {
      ctx.html(`<div class="ws-stress">
        <div class="ws-head"><div class="ws-ttl"><b>合成測試音訊（8 kHz 單聲道，只畫波形不播放）</b><small data-sub>準備中…</small></div></div>
        <div class="ws-card" data-card><div data-w></div></div>
        <div class="ws-log" data-g></div>
      </div>`);
      let mode = 0;
      const MODES = ["完整取樣：decodeAudioData 解碼後，把全部取樣交給 load()，由 wavesurfer 算峰值並繪製",
        "預算峰值：只把每秒 100 點的峰值交給 load(\"\", [peaks], duration)，跳過解碼"];
      const logEl = ctx.$("[data-g]"), sub = ctx.$("[data-sub]");
      logEl.textContent = MODES[mode];
      // Same decode wavesurfer runs internally, at the clip's own rate so nothing is resampled.
      const decoder = new OfflineAudioContext(1, 1, 8000);
      const card = ctx.$("[data-card]");
      const H = fit(ctx, card, 8 + 16, (v) => ws.setOptions({ height: v }));
      // No url is ever given, so the media element never streams the large blobs.
      const ws = make(ctx, { container: ctx.$("[data-w]"), height: H, waveColor: WAVE, progressColor: PROG,
        cursorWidth: 0, barWidth: 2, barGap: 1, normalize: true, interact: false });
      async function loadClip(sec, data) {
        const t0 = performance.now();
        let chs = [data.peaks], dec = 0;
        if (mode === 0) {
          chs = [(await decoder.decodeAudioData(await data.blob.arrayBuffer())).getChannelData(0)];
          dec = performance.now() - t0;
        }
        const t1 = performance.now();
        await ws.load("", chs, sec);
        const t2 = performance.now(); await ctx.frame(1);
        const done = new Promise((r) => ws.once("redrawcomplete", r));
        ws.zoom(50);
        await Promise.race([done, ctx.sleep(4000)]);
        const t3 = performance.now();
        sub.innerHTML = `<span class="m">${fmt(sec)}</span> 秒・<span class="m">${fmt(data.bytes / 1048576, 1)}</span> MB・` +
          `交給 load() <span class="m">${Showcase.fmtCompact(chs[0].length)}</span> 點・` +
          (mode ? "" : `解碼 <span class="m">${fmtMs(dec)}</span>・`) +
          `算峰值與繪製 <span class="m">${fmtMs(t2 - t1)}</span>・縮放重繪 <span class="m">${fmtMs(t3 - t2)}</span>`;
        return mode ? `繪製 ${fmtMs(t2 - t1)}` : `解碼 ${fmtMs(dec)}・繪製 ${fmtMs(t2 - t1)}`;
      }
      const prep = (sec) => { const c = longClip(sec); return { ...c, bytes: c.blob.size }; };
      ctx.controls.classList.add("bottom");
      ctx.group(["完整取樣", "預算峰值"], mode, (i) => { mode = i; logEl.textContent = MODES[mode]; loadClip(10, prep(10)); });
      ctx.bench({
        label: "音訊長度", unit: "秒", sizes: [10, 60, 300, 900, 1800, 3600], format: fmt,
        prepare: (n) => prep(n), run: (n, data) => loadClip(n, data),
        note: "每級先在頁內合成指定長度的 8 kHz 單聲道 WAV（不計時），再計時到波形畫好並做一次 zoom 重繪。完整取樣模式 1 小時要解碼 2,880 萬個取樣（約 115 MB 浮點資料）再由 wavesurfer 逐點算峰值；預算峰值模式只傳 36 萬點，時間幾乎不隨長度增加。縮放只重繪可見範圍的畫布。",
      });
      await loadClip(10, prep(10));
    },
  },
] });
</script>
