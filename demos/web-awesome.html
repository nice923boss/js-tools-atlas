<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Awesome 示範：七個場景看懂元件、主題、表單、浮層與可存取性</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="_shared/showcase.css">
<!-- Only theme + color layers are loaded (all inside @layer wa-*), never native.css, so the unlayered showcase frame keeps its own look. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/themes/default.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/themes/awesome.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/themes/shoelace.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/styles/color/variants.css">
<!-- The autoloader takes its base path from this script tag's src. -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js"></script>
<script type="application/json" id="demo-meta">{"mode":"auto","note":"元件模組由 jsDelivr 依需求自動載入，圖示來自 Font Awesome 免費 CDN；主題只套在場景容器上","scenes":["咖啡豆訂閱牆","主題與設計 token","表單驗證與事件","對話框與浮層","樹狀、輪播與比較","可存取性檢視","極限測試"]}</script>
<style>
  .wx-fill { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: flex; }
  /* Scene container that carries every wa-* theme class; nothing above it is themed. */
  .wx-scope { flex: 1; min-width: 0; min-height: 0; overflow: auto; scrollbar-width: thin; border-radius: 12px; border: 1px solid var(--line);
    background: var(--wa-color-surface-lowered); color: var(--wa-color-text-normal);
    --wa-font-family-body: var(--font); --wa-font-family-heading: var(--font); --wa-font-family-code: var(--mono); font-family: var(--font); }
  .wx-scope.wa-theme-awesome { --wa-font-family-body: "Quicksand", var(--font); --wa-font-family-heading: "Quicksand", var(--font); }
  .wx-scope h3 { margin: 0; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .wx-scope h3 code { margin-left: auto; font: 500 11px var(--mono); color: var(--wa-color-text-quiet); }
  .wx-card { min-width: 0; display: flex; flex-direction: column; gap: 9px; padding: 12px; border-radius: var(--wa-border-radius-l); border: 1px solid var(--wa-color-surface-border); background: var(--wa-color-surface-default); }
  .wx-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .wx-small { font-size: 12px; color: var(--wa-color-text-quiet); line-height: 1.6; }
  .wx-pre { margin: 0; padding: 7px 9px; border-radius: 8px; background: color-mix(in srgb, var(--wa-color-text-normal) 7%, transparent); border: 1px solid var(--wa-color-surface-border);
    font: 11px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; overflow: auto; scrollbar-width: thin; }
  .wx-log { flex: 1; min-height: 70px; }
  .wx-log b { color: var(--wa-color-brand-on-quiet); font-weight: 600; }

  /* 1. wall */
  .wx-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; align-content: start; padding: 10px; }
  .wx-kv { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; border-bottom: 1px dashed var(--wa-color-surface-border); padding-bottom: 4px; }
  .wx-kv strong { font-size: 18px; color: var(--wa-color-brand-on-quiet); }
  .wx-avatars { display: flex; }
  .wx-avatars wa-avatar { --size: 32px; margin-right: -8px; border: 2px solid var(--wa-color-surface-default); border-radius: 50%; }
  .wx-wall wa-progress-ring { --size: 80px; --track-width: 8px; --indicator-width: 8px; font-weight: 700; flex: none; }
  .wx-wall wa-tab-panel { --padding: 10px 2px 0; font-size: 13px; line-height: 1.7; }

  /* 2. tokens */
  .wx-tok { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 10px; padding: 10px; align-content: start; }
  .wx-matrix { display: grid; grid-template-columns: 64px repeat(5, minmax(0, 1fr)); gap: 5px; align-items: center; overflow-x: auto; }
  .wx-matrix > span { font: 10.5px var(--mono); color: var(--wa-color-text-quiet); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wx-matrix wa-button { min-width: 0; }
  .wx-matrix wa-button::part(base) { width: 100%; }
  .wx-ramp { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); border-radius: var(--wa-border-radius-m); overflow: hidden; }
  .wx-ramp div { height: 46px; display: flex; flex-direction: column; justify-content: flex-end; padding: 3px; font: 9.5px/1.2 var(--mono); }
  .wx-tokens { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 5px; }
  .wx-tokens div { display: flex; align-items: center; gap: 6px; font: 10.5px var(--mono); min-width: 0; }
  .wx-tokens i { flex: none; width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--wa-color-surface-border); }
  .wx-tokens span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 3. form */
  .wx-formwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 10px; padding: 10px; min-height: 100%; }
  .wx-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; align-content: start; }
  .wx-form .wx-wide { grid-column: 1 / -1; }
  .wx-form :state(user-invalid) { --wa-form-control-border-color: var(--wa-color-danger-border-loud); --wa-form-control-label-color: var(--wa-color-danger-on-quiet); }
  .wx-form :state(user-valid) { --wa-form-control-border-color: var(--wa-color-success-border-loud); }
  .wx-side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .wx-valid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 8px; font-size: 12px; }
  .wx-valid .ok { color: var(--wa-color-success-on-quiet); }
  .wx-valid .bad { color: var(--wa-color-danger-on-quiet); }
  .wx-valid code { font: 11px var(--mono); }

  /* 4. overlays */
  .wx-ovl { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 10px; align-content: start; }
  .wx-ovl .wx-logcard { grid-column: 1 / -1; }
  .wx-ovl .wx-log { height: 120px; flex: none; }
  .wx-tipgrid { display: grid; grid-template-columns: repeat(3, auto); gap: 6px; justify-content: center; }

  /* 5. structure */
  .wx-struct { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); grid-auto-rows: max-content; gap: 10px; padding: 10px; }
  .wx-struct wa-carousel { --aspect-ratio: 16 / 9; }
  .wx-struct wa-carousel img, .wx-struct wa-comparison img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wx-struct wa-comparison { aspect-ratio: 16 / 8; border-radius: var(--wa-border-radius-m); overflow: hidden; display: block; }
  .wx-cap { position: absolute; left: 8px; bottom: 8px; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; }
  .wx-struct wa-carousel-item { position: relative; }

  /* 6. a11y */
  .wx-a11y { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 10px; }
  .wx-a11y wa-tab-panel { --padding: 6px 0 0; font-size: 12.5px; }
  .wx-focus { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 3px 8px; font-size: 12px; }
  .wx-focus span:nth-child(odd) { color: var(--wa-color-text-quiet); }
  .wx-focus code { font: 11px var(--mono); word-break: break-all; }
  .wx-scan { max-height: none; }
  .wx-scope :focus-visible { outline-offset: 2px; }

  /* 7. stress */
  .wx-stress { position: absolute; inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 350px; display: flex; }
  .wx-sgrid { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; align-content: flex-start; margin-top: 36px; }
  .wx-sinfo { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 9px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); font-size: 11.5px; }
  .wx-sgrid wa-input { width: 120px; }

  @media (max-width: 760px) {
    .wx-tok, .wx-formwrap, .wx-struct, .wx-a11y { grid-template-columns: minmax(0, 1fr); }
    .wx-ovl { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .wx-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 8px; opacity: .9; }
  }
  @media (max-width: 480px) {
    .wx-form, .wx-ovl { grid-template-columns: minmax(0, 1fr); }
    .wx-wall { grid-template-columns: minmax(0, 1fr); padding: 8px; }
    .wx-ramp div { font-size: 0; }
  }
</style>
</head>
<body>
<script src="_shared/showcase.js"></script>
<script type="module">
// Web Awesome 3 showcase: autoloaded wa-* components; all theme classes live on a per-scene container.
import { allDefined, serialize } from "https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/webawesome.loader.js";
import "https://cdn.jsdelivr.net/npm/@awesome.me/webawesome@3.14.0/dist-cdn/translations/zh-tw.js";

const { h, fmtMs, fmtCompact } = Showcase;

const THEMES = [{ value: "default", label: "default" }, { value: "awesome", label: "awesome" }, { value: "shoelace", label: "shoelace" }];
const PALETTE_OF = { default: "default", awesome: "bright", shoelace: "shoelace" };
const BRANDS = ["blue", "red", "orange", "yellow", "green", "cyan", "indigo", "purple", "pink", "gray"];
const BRAND_ZH = { blue: "藍", red: "紅", orange: "橘", yellow: "黃", green: "綠", cyan: "青", indigo: "靛", purple: "紫", pink: "粉紅", gray: "灰" };
const themeClass = (t) => `wa-theme-${t.theme} wa-palette-${t.palette} wa-brand-${t.brand} ${t.dark ? "wa-dark" : "wa-light"}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const now = () => new Date().toLocaleTimeString("zh-TW", { hour12: false });

// Shared theme controls: dark toggle, theme (palette follows), brand color.
function themeControls(ctx, scope, base, t, after) {
  const apply = () => { scope.className = `${base} ${themeClass(t)}`; after?.(); };
  ctx.toggle("深色", t.dark, (v) => { t.dark = v; apply(); });
  ctx.select("主題", THEMES, t.theme, (v) => { t.theme = v; t.palette = PALETTE_OF[v]; apply(); });
  ctx.select("品牌色", BRANDS.map((b) => ({ value: b, label: BRAND_ZH[b] })), t.brand, (v) => { t.brand = v; apply(); });
  apply();
  return apply;
}

// Small append-only event log (newest first).
function logger(pre, max = 40) {
  const lines = [];
  return (html) => {
    lines.unshift(`<span>${now()}</span> ${html}`);
    lines.length = Math.min(lines.length, max);
    pre.innerHTML = lines.join("\n");
  };
}

Showcase.run({
  scenes: [
  // 1. Original signature demo, now themed on a scene container instead of <html>.
  {
    id: "wall", title: "咖啡豆訂閱牆",
    api: "<wa-card> + <wa-select> + <wa-slider> + toast.create()",
    desc: "原本的元件牆：卡片、按鈕變體、下拉選單、滑桿、開關、數字與相對時間格式化、頭像、提示框、進度環、評分、可移除標籤、分頁與 QR Code。表單一改就重算帳單；深色、主題與品牌色只是場景容器上的 class，外框不受影響。",
    hint: "改烘焙度或包數看帳單重算；右上切換深色、主題與品牌色",
    async mount(ctx) {
      ctx.html(`<div class="wx-fill"><div class="wx-scope wx-wall">
        <div class="wx-card"><h3><wa-icon name="hand-pointer"></wa-icon>按鈕<code>wa-button</code></h3>
          <div class="wx-row">${["brand:品牌", "success:成功", "warning:警告", "danger:危險", "neutral:中性"].map((s) => `<wa-button size="small" variant="${s.split(":")[0]}">${s.split(":")[1]}</wa-button>`).join("")}</div>
          <div class="wx-row">${["accent", "filled", "outlined", "plain"].map((a) => `<wa-button size="small" variant="brand" appearance="${a}">${a}</wa-button>`).join("")}</div>
          <div class="wx-row"><wa-button variant="brand" pill class="wx-pay"><wa-icon slot="start" name="mug-hot"></wa-icon>立即訂閱</wa-button>
            <wa-button appearance="outlined" pill class="wx-bell">通知<wa-badge variant="danger" attention="pulse" pill>3</wa-badge></wa-button></div></div>
        <div class="wx-card"><h3><wa-icon name="sliders"></wa-icon>方案<code>wa-select・wa-slider</code></h3>
          <wa-select class="wx-roast" label="烘焙度" size="small" value="medium">
            <wa-option value="light">淺焙・柑橘果酸（每包 NT$420）</wa-option>
            <wa-option value="medium">中焙・焦糖甜感（每包 NT$380）</wa-option>
            <wa-option value="dark">深焙・可可苦韻（每包 NT$350）</wa-option></wa-select>
          <wa-slider class="wx-bags" label="每月包數" min="1" max="6" value="2" with-markers with-tooltip size="small"></wa-slider>
          <wa-switch class="wx-auto" checked size="small">每月自動續訂</wa-switch></div>
        <div class="wx-card"><h3><wa-icon name="receipt"></wa-icon>本月帳單<code>wa-format-number</code></h3>
          <div class="wx-kv"><span>訂閱金額</span><strong><wa-format-number class="wx-price" type="currency" currency="TWD" currency-display="narrowSymbol" maximum-fraction-digits="0" lang="zh-TW" value="760"></wa-format-number></strong></div>
          <div class="wx-kv"><span>下次出貨</span><span><wa-relative-time class="wx-ship" lang="zh-TW" numeric="auto"></wa-relative-time></span></div>
          <div class="wx-row"><div class="wx-avatars"><wa-avatar image="_shared/img/photo-4.jpg" label="阿哲"></wa-avatar><wa-avatar initials="安" label="小安"></wa-avatar><wa-avatar initials="芸" label="小芸"></wa-avatar></div>
            <span class="wx-small" style="margin-left:14px">3 位家人共享這份訂閱</span></div>
          <wa-callout variant="brand" appearance="filled" size="small"><wa-icon slot="icon" name="gift"></wa-icon>中秋限定：阿里山日曬禮盒開放加購</wa-callout></div>
        <div class="wx-card"><h3><wa-icon name="chart-pie"></wa-icon>回饋<code>wa-progress-ring・wa-rating</code></h3>
          <div class="wx-row" style="gap:14px;flex-wrap:nowrap"><wa-progress-ring class="wx-ring" value="0" label="本月已沖煮比例">0%</wa-progress-ring>
            <div class="wx-row" style="flex-direction:column;align-items:flex-start"><div class="wx-small">本月已沖煮 <b class="wx-cups">0</b> / 30 杯</div>
              <wa-rating class="wx-rating" label="上一批評分" value="4" precision="0.5"></wa-rating><div class="wx-small wx-ratetext">上一批評分：4 分，很喜歡</div></div></div></div>
        <div class="wx-card"><h3><wa-icon name="tags"></wa-icon>風味偏好<code>wa-tag</code></h3>
          <div class="wx-row wx-tags"></div>
          <div class="wx-row"><wa-button size="small" appearance="plain" variant="brand" class="wx-reset"><wa-icon slot="start" name="rotate-left"></wa-icon>恢復預設標籤</wa-button></div></div>
        <div class="wx-card"><h3><wa-icon name="layer-group"></wa-icon>分頁<code>wa-tab-group・wa-qr-code</code></h3>
          <wa-tab-group active="invite"><wa-tab panel="origin">產地</wa-tab><wa-tab panel="brew">沖煮</wa-tab><wa-tab panel="invite">邀請好友</wa-tab>
            <wa-tab-panel name="origin">嘉義阿里山 1,200 公尺，日曬處理，帶有熱帶水果與蜂蜜香氣。</wa-tab-panel>
            <wa-tab-panel name="brew">水溫 92°C、粉水比 1:15、總萃取 2 分 30 秒，建議中細研磨。</wa-tab-panel>
            <wa-tab-panel name="invite"><div class="wx-row" style="gap:12px;flex-wrap:nowrap"><wa-qr-code value="https://example.com/invite/BEAN-2026" size="80" radius="0.4" label="邀請碼 QR Code"></wa-qr-code>
              <div><div class="wx-small">邀請碼</div><div class="wx-row"><b class="mono">BEAN-2026</b><wa-copy-button value="BEAN-2026" copy-label="複製" success-label="已複製" error-label="無法複製"></wa-copy-button></div><div class="wx-small">好友首月 85 折</div></div></div></wa-tab-panel>
          </wa-tab-group></div>
        <wa-toast class="wx-toaster" placement="bottom-end"></wa-toast>
      </div></div>`);
      const $ = (s) => ctx.$(s), scope = $(".wx-scope");
      themeControls(ctx, scope, "wx-scope wx-wall", { theme: "default", palette: "default", brand: "orange", dark: true });
      await allDefined();
      if (!ctx.active) return;
      const PRICE = { light: 420, medium: 380, dark: 350 };
      const TAGS = [["柑橘", "warning"], ["莓果", "danger"], ["蜂蜜", "brand"], ["堅果", "neutral"], ["可可", "neutral"], ["茉莉", "success"]];
      const RATE = ["還沒評分", "不太合口味", "普通", "還不錯", "很喜歡", "完美的一杯"];
      const toast = (msg, variant = "brand", icon = "circle-info") => $(".wx-toaster").create(msg, { variant, icon, duration: 3000 });
      const bill = () => { $(".wx-price").value = PRICE[$(".wx-roast").value] * $(".wx-bags").value; };
      for (const s of [".wx-roast", ".wx-bags"]) ctx.on($(s), "change", bill);
      ctx.on($(".wx-bags"), "input", bill);
      ctx.on($(".wx-auto"), "change", () => { const on = $(".wx-auto").checked; toast(on ? "已開啟每月自動續訂" : "已暫停自動續訂，本月出貨後停止", on ? "success" : "warning"); });
      $(".wx-ship").date = new Date(Date.now() + 5 * 864e5);
      bill();
      ctx.on($(".wx-pay"), "click", () => {
        $(".wx-pay").loading = true;
        ctx.timeout(() => { $(".wx-pay").loading = false; toast(`訂閱成功：每月 ${$(".wx-bags").value} 包，共 NT$${$(".wx-price").value.toLocaleString("zh-TW")}`, "success", "circle-check"); }, 1200);
      });
      ctx.on($(".wx-bell"), "click", () => {
        const badge = $(".wx-bell wa-badge"), left = Math.max(0, +badge.textContent - 1);
        badge.textContent = left; badge.attention = left ? "pulse" : "none";
        toast(left ? `還有 ${left} 則未讀通知` : "通知都讀完了", "neutral", "bell");
      });
      ctx.on($(".wx-rating"), "change", () => { const v = $(".wx-rating").value; $(".wx-ratetext").textContent = `上一批評分：${v} 分，${RATE[Math.round(v)]}`; });
      const renderTags = () => { $(".wx-tags").innerHTML = TAGS.map(([t, v]) => `<wa-tag with-remove pill size="small" variant="${v}" appearance="filled-outlined">${t}</wa-tag>`).join(""); };
      ctx.on($(".wx-tags"), "wa-remove", (e) => { toast(`已移除「${e.target.textContent}」風味`, "neutral", "tag"); e.target.remove(); });
      ctx.on($(".wx-reset"), "click", renderTags);
      renderTags();
      let n = 0;
      const id = ctx.interval(() => {
        n = Math.min(21, n + 1);
        $(".wx-ring").value = Math.round((n / 30) * 100);
        $(".wx-ring").textContent = `${$(".wx-ring").value}%`;
        $(".wx-cups").textContent = n;
        if (n === 21) clearInterval(id);
      }, 60);
    },
  },

  // 2. Themes, palettes, brand colors and the dimension scale tokens.
  {
    id: "tokens", title: "主題與設計 token",
    api: "class=\"wa-theme-* wa-palette-* wa-brand-* wa-dark\" + --wa-*-scale",
    desc: "Web Awesome 的外觀全由 CSS 變數決定：主題 class 決定語意色與字型，色盤 class 決定 10 種色相的 11 階色票，品牌色 class 把 --wa-color-brand-* 指向某個色相；再用 --wa-space-scale、--wa-border-radius-scale、--wa-font-size-scale 等比例縮放間距、圓角與字級。右側色票讀的是瀏覽器實際算出的顏色。",
    hint: "換主題、色盤與品牌色，拉三個比例滑桿看左側元件一起變",
    async mount(ctx) {
      const V = ["brand", "neutral", "success", "warning", "danger"], A = ["accent", "filled-outlined", "filled", "outlined", "plain"];
      ctx.html(`<div class="wx-fill"><div class="wx-scope wx-tok">
        <div class="wx-card"><h3>變體 × 外觀<code>variant × appearance</code></h3>
          <div class="wx-matrix"><span></span>${A.map((a) => `<span>${a}</span>`).join("")}${V.map((v) => `<span>${v}</span>${A.map((a) => `<wa-button size="small" variant="${v}" appearance="${a}">按鈕</wa-button>`).join("")}`).join("")}</div>
          <div class="wx-row"><wa-input size="small" label="搜尋" placeholder="輸入豆名" with-clear style="flex:1;min-width:140px"><wa-icon slot="start" name="magnifying-glass"></wa-icon></wa-input>
            <wa-switch size="small" checked>通知</wa-switch><wa-checkbox size="small" checked>記住我</wa-checkbox></div>

      const hex = (c) => { c2.clearRect(0, 0, 1, 1); c2.fillStyle = "#000"; c2.fillStyle = c; c2.fillRect(0, 0, 1, 1); const d = c2.getImageData(0, 0, 1, 1).data; return "#" + [d[0], d[1], d[2]].map((x) => x.toString(16).padStart(2, "0")).join(""); };
      const scales = { space: 1, "border-radius": 1, "font-size": 1 };

      const apply = themeControls(ctx, scope, "wx-scope wx-tok", t, read);
      ctx.select("色盤", ["default", "bright", "shoelace"], t.palette, (v) => { t.palette = v; apply(); });

      ctx.slider("間距", { min: 0.5, max: 1.6, step: 0.05, value: 1, format: fmt }, (v) => { scales.space = v; scope.style.setProperty("--wa-space-scale", v); read(); });
      ctx.slider("圓角", { min: 0, max: 4, step: 0.25, value: 1, format: fmt }, (v) => { scales["border-radius"] = v; scope.style.setProperty("--wa-border-radius-scale", v); read(); });

      await allDefined();

  // 3. Form-associated custom elements: native constraint validation, custom validity, events.

      </div></div>`);
      const $ = (s) => ctx.$(s), tree = $(".wx-tree"), car = $(".wx-car");
      ctx.group(["single", "multiple", "leaf", "leaf-multiple"], 1, (i, l) => { tree.selection = l; $(".wx-sel").textContent = `selection="${l}"`; });
      ctx.select("每頁", [{ value: "1", label: "1 張" }, { value: "2", label: "2 張" }], "1", (v) => { car.slidesPerPage = +v; });
      ctx.toggle("自動播放", false, (v) => { car.autoplay = v; });
      ctx.toggle("FAQ 互斥", true, (v) => ctx.$$("wa-details").forEach((d) => (v ? d.setAttribute("name", "faq") : d.removeAttribute("name"))));
      await allDefined();
      if (!ctx.active) return;
      ctx.on(tree, "wa-selection-change", (e) => {
        const names = e.detail.selection.map((it) => it.dataset.n);
        $(".wx-sel").textContent = names.length ? `已選 ${names.length} 個：${names.join("、")}` : "尚未選取";
      });
      ctx.on($(".wx-lazy"), "wa-lazy-load", (e) => {
        const item = e.target;
        ctx.timeout(() => {
          for (const n of ["2025 年度備份.zip", "生豆採購單.xlsx", "烘焙曲線.json"]) item.append(h("wa-tree-item", { "data-n": n }, n));
          item.lazy = false;
        }, 700);
      });
      ctx.on(car, "wa-slide-change", (e) => { $(".wx-carout").textContent = `wa-slide-change：第 ${e.detail.index + 1} / ${car.querySelectorAll("wa-carousel-item").length} 張`; });
      ctx.on($(".wx-cmp"), "change", () => { $(".wx-cmpout").textContent = `position = ${Math.round($(".wx-cmp").position)}`; });
    },
  },

  // 6. Accessibility: live focus inspector and a scan of the ARIA each component renders.
  {
    id: "a11y", title: "可存取性檢視",
    api: "shadowRoot.activeElement + role / aria-* 掃描",
    desc: "左邊是常見的複合元件，按 Tab 與方向鍵操作；右上即時顯示焦點落在哪個 shadow DOM 節點、它的 role、aria-* 與名稱來源。右下掃描每個元件實際輸出的 ARIA：開關是 role=switch 的 input，分頁是 tablist、tab、tabpanel 並互相用 aria-controls 連結，評分與滑桿是 role=slider 帶 aria-valuenow。「自動巡航」用 focus() 逐一移焦，並用 dispatchEvent 送出方向鍵（只對元件自己處理 keydown 的部分有效）。",
    hint: "點左側任一元件後按 Tab 或方向鍵；或按「自動巡航」",
    async mount(ctx) {
      ctx.html(`<div class="wx-fill"><div class="wx-scope wx-a11y ${themeClass({ theme: "default", palette: "default", brand: "cyan", dark: true })}">
        <div class="wx-card wx-widgets"><h3>元件<code>Tab・方向鍵・空白鍵</code></h3>
          <wa-switch checked data-k="">深色模式</wa-switch>
          <wa-radio-group label="研磨" value="medium" orientation="horizontal" data-k="ArrowRight"><wa-radio value="fine">細</wa-radio><wa-radio value="medium">中</wa-radio><wa-radio value="coarse">粗</wa-radio></wa-radio-group>
          <wa-rating label="評分" value="3" data-k="ArrowRight"></wa-rating>
          <wa-slider label="水溫" min="80" max="96" value="90" data-k="ArrowRight"></wa-slider>
          <wa-tab-group data-k="ArrowRight"><wa-tab panel="a">產地</wa-tab><wa-tab panel="b">處理法</wa-tab><wa-tab panel="c">風味</wa-tab>
            <wa-tab-panel name="a">嘉義阿里山</wa-tab-panel><wa-tab-panel name="b">日曬</wa-tab-panel><wa-tab-panel name="c">柑橘、蜂蜜</wa-tab-panel></wa-tab-group>
          <wa-tree data-k="ArrowDown"><wa-tree-item expanded>配方<wa-tree-item>冰滴</wa-tree-item><wa-tree-item>拿鐵</wa-tree-item></wa-tree-item></wa-tree>
          <wa-progress-bar value="40" label="本月進度"></wa-progress-bar>
        </div>
        <div class="wx-side">
          <div class="wx-card"><h3>焦點檢視<code>document.activeElement → shadowRoot</code></h3><div class="wx-focus"><span>路徑</span><code>（尚未聚焦）</code></div></div>
          <div class="wx-card" style="flex:1"><h3>ARIA 掃描<code>role・aria-*</code></h3><pre class="wx-pre wx-scan"></pre></div>
        </div>
      </div></div>`);
      const $ = (s) => ctx.$(s), widgets = $(".wx-widgets"), focusBox = $(".wx-focus"), scan = $(".wx-scan");
      const ATTRS = (e) => [...e.attributes].filter((a) => a.name === "role" || a.name.startsWith("aria-")).map((a) => `${a.name}=${a.value}`);
      const nameOf = (e) => {
        const root = e.getRootNode();
        if (e.getAttribute("aria-label")) return [`aria-label`, e.getAttribute("aria-label")];
        const ids = e.getAttribute("aria-labelledby");
        if (ids) return ["aria-labelledby", ids.split(" ").map((id) => root.getElementById?.(id)?.textContent.trim() || "").join(" ") || "（空）"];
        if (e.id && root.querySelector?.(`label[for="${e.id}"]`)) return ["<label for>", root.querySelector(`label[for="${e.id}"]`).textContent.trim()];
        const host = root.host;
        return ["文字內容", (e.textContent.trim() || host?.textContent.trim() || "").slice(0, 30) || "（無）"];
      };
      const inspect = () => {
        let a = document.activeElement;
        if (!a || !$(".wx-scope").contains(a)) return;
        const path = [a.localName];
        while (a.shadowRoot?.activeElement) { a = a.shadowRoot.activeElement; path.push(`#shadow ${a.localName}`); }
        const [src, nm] = nameOf(a);
        focusBox.innerHTML = `<span>路徑</span><code>${esc(path.join(" › "))}</code><span>role</span><code>${esc(a.getAttribute("role") || `（隱含：${a.localName}${a.type ? `[type=${a.type}]` : ""}）`)}</code>
          <span>aria-*</span><code>${esc(ATTRS(a).filter((x) => !x.startsWith("role=")).join("　") || "（無）")}</code><span>名稱來源</span><code>${esc(src)} → ${esc(nm)}</code>`;
      };
      const doScan = () => {
        const out = [];
        for (const host of widgets.querySelectorAll("wa-switch, wa-radio-group, wa-radio, wa-rating, wa-slider, wa-tab, wa-tab-panel, wa-tree, wa-tree-item, wa-progress-bar")) {
          const rows = [];
          const ha = ATTRS(host); if (ha.length) rows.push(`  :host ${ha.join(" ")}`);
          for (const e of host.shadowRoot?.querySelectorAll("[role], input, button") || []) { const at = ATTRS(e); if (at.length || e.localName === "input") rows.push(`  ${e.localName} ${at.join(" ")}`); }
          if (rows.length) out.push(`${host.localName}${host.textContent.trim() && host.children.length === 0 ? `「${host.textContent.trim()}」` : ""}\n${rows.join("\n")}`);
        }
        scan.textContent = out.join("\n");
      };
      ctx.on(document, "focusin", inspect);
      ctx.on(document, "keyup", () => { inspect(); doScan(); });
      for (const t of ["change", "input", "wa-tab-show", "wa-selection-change"]) ctx.on(widgets, t, () => ctx.timeout(() => { inspect(); doScan(); }, 30));
      let touring = false;
      const tourBtn = ctx.button("自動巡航", async () => {
        if (touring) return;
        touring = true; tourBtn.disabled = true;
        try {
          for (const host of widgets.querySelectorAll("[data-k], wa-switch")) {
            const target = host.localName === "wa-radio-group" ? host.querySelector("wa-radio[tabindex='0']") || host.querySelector("wa-radio")
              : host.localName === "wa-tab-group" ? host.querySelector("wa-tab[tabindex='0']") : host.localName === "wa-tree" ? host.querySelector("wa-tree-item") : host;
            target.focus();
            inspect();
            await ctx.sleep(700);
            const key = host.dataset.k;
            if (key) {
              const deep = (() => { let a = document.activeElement; while (a?.shadowRoot?.activeElement) a = a.shadowRoot.activeElement; return a; })();
              deep.dispatchEvent(new KeyboardEvent("keydown", { key, bubbles: true, composed: true, cancelable: true }));
              await ctx.sleep(120);
              inspect(); doScan();
              await ctx.sleep(700);
            }
          }
        } catch (e) { if (e?.name !== "AbortError") throw e; } finally { touring = false; tourBtn.disabled = false; }
      }, { primary: true });
      await allDefined();
      if (!ctx.active) return;
      await ctx.sleep(300);
      doScan();
    },
  },

  // 7. Stress: how long N components take to upgrade and finish their first Lit render.
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "N × <wa-*> → await el.updateComplete",
    desc: "一次插入 N 個 Web Awesome 元件，量三段時間：innerHTML 解析並升級成自訂元素（constructor 與 connectedCallback）、等每個元件的 updateComplete（Lit 第一次渲染 shadow DOM）、接著強制排版。元件模組在測試前先載好，所以不含網路時間；可切換元件種類比較輕重。",
    hint: "按「開始測試」；切換元件種類後再測一次",
    async mount(ctx) {
      ctx.html(`<div class="wx-stress"><div class="wx-sinfo mono">尚未測試</div><div class="wx-scope wx-sgrid ${themeClass({ theme: "default", palette: "default", brand: "orange", dark: true })}"></div></div>`);
      const grid = ctx.$(".wx-sgrid"), info = ctx.$(".wx-sinfo");
      const KINDS = [
        { label: "wa-button", html: (i) => `<wa-button size="small">#${i}</wa-button>` },
        { label: "wa-switch", html: (i) => `<wa-switch size="small"${i % 2 ? " checked" : ""}>${i}</wa-switch>` },
        { label: "wa-input", html: (i) => `<wa-input size="small" value="${i}"></wa-input>` },
        { label: "混合 5 種", html: (i) => [`<wa-button size="small">#${i}</wa-button>`, `<wa-badge>${i}</wa-badge>`, `<wa-switch size="small"></wa-switch>`, `<wa-rating value="3" size="small"></wa-rating>`, `<wa-tag size="small">${i}</wa-tag>`][i % 5] },
      ];
      let kind = 0;
      ctx.controls.classList.add("bottom");
      ctx.group(KINDS.map((k) => k.label), 0, (i) => { kind = i; });
      // Warm up: make sure every module is fetched and defined before timing.
      grid.innerHTML = KINDS.map((k) => k.html(0)).join("");
      await allDefined();
      grid.textContent = "";
      ctx.bench({
        label: "元件數", unit: "個", sizes: [100, 500, 1000, 2500, 5000, 10000],
        prepare() { grid.textContent = ""; void grid.offsetHeight; },
        async run(n) {
          const k = KINDS[kind];
          let s = "";
          for (let i = 0; i < n; i++) s += k.html(i);
          const t0 = performance.now();
          grid.innerHTML = s;
          const els = grid.children;
          const t1 = performance.now();
          await Promise.all(Array.from(els, (e) => e.updateComplete));
          const t2 = performance.now();
          void grid.offsetHeight;
          els[els.length - 1]?.getBoundingClientRect();
          const t3 = performance.now();
          let shadow = 0;
          for (const e of els) shadow += e.shadowRoot ? e.shadowRoot.querySelectorAll("*").length : 0;
          info.textContent = `${fmtCompact(n)} 個 ${k.label}・升級 ${fmtMs(t1 - t0)}・首次渲染 ${fmtMs(t2 - t1)}・排版 ${fmtMs(t3 - t2)}・shadow 節點 ${fmtCompact(shadow)}`;
          return `升級 ${fmtMs(t1 - t0)}・渲染 ${fmtMs(t2 - t1)}・排版 ${fmtMs(t3 - t2)}`;
        },
        note: "耗時含解析 HTML、自訂元素升級、Lit 為每個元件建立 shadow DOM 並套用共用樣式表、表單元件連上 ElementInternals，以及第一次排版。autoloader 的 MutationObserver 也會掃過新加入的節點。wa-input 這類表單元件的 shadow DOM 較大，通常比按鈕重。超過 2 秒的級距之後略過。",
      });
    },
  },
  ],
});
</script>
</body>
</html>
