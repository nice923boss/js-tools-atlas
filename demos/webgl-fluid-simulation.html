<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL Fluid Simulation 示範：用滑鼠攪動流體</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto","note":"原作 PavelDoGreat/WebGL-Fluid-Simulation 未發佈到 npm，此頁使用其 MIT 授權的 npm 封裝 webgl-fluid-enhanced"}</script>
<style>
  #fluid { width: 100vw; height: 100vh; }
  .title { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; pointer-events: none; mix-blend-mode: difference; }
  .title h1 { margin: 0; font-size: clamp(26px, 7vw, 64px); font-weight: 800; letter-spacing: .12em; color: #fff; }
  .title p { margin: 6px 0 0; font-size: 13px; color: #fff; opacity: .7; }
  .fx { position: fixed; left: 12px; top: 12px; z-index: 50; display: flex; gap: 6px; flex-wrap: wrap; max-width: 46%; }
  @media (max-width: 600px) { .title { top: 46%; } .fx { top: auto; bottom: 48px; max-width: none; } }
</style>
</head>
<body>
<div id="fluid"></div>
<div class="title"><h1>流體模擬</h1><p>即時求解 Navier-Stokes 方程</p></div>
<div class="controls" id="palettes">
  <button class="btn" data-p="rainbow" aria-pressed="true">彩虹</button>
  <button class="btn" data-p="lava">熔岩</button>
  <button class="btn" data-p="ocean">深海</button>
  <button class="btn" data-p="ink">水墨</button>
</div>
<div class="fx">
  <button class="btn" id="bloom" aria-pressed="true">光暈</button>
  <button class="btn" id="sunrays" aria-pressed="true">光束</button>
  <button class="btn" id="splash">潑灑</button>
</div>
<div class="hint">滑過畫面攪動流體・點右上切換配色</div>

<script src="https://cdn.jsdelivr.net/npm/webgl-fluid-enhanced@0.8.0/dist/index.umd.js"></script>
<script>
// webgl-fluid-enhanced wraps Pavel Dobryakov's WebGL fluid solver (advection, curl, pressure passes).
const container = document.getElementById("fluid");
const fluid = new WebGLFluidEnhanced.default(container);
const PALETTES = {
  rainbow: { colorful: true, colorPalette: [], backgroundColor: "#000000", inverted: false, brightness: 0.5 },
  lava: { colorful: false, colorPalette: ["#ff3d00", "#ff9100", "#ffd600", "#d50000"], backgroundColor: "#000000", inverted: false, brightness: 0.55 },
  ocean: { colorful: false, colorPalette: ["#00b4d8", "#0077b6", "#48cae4", "#90e0ef", "#7bd389"], backgroundColor: "#000000", inverted: false, brightness: 0.55 },
  ink: { colorful: false, colorPalette: ["#1d3557", "#2b2d42", "#6d597a", "#14213d"], backgroundColor: "#f4efe6", inverted: false, brightness: 0.8 },
};
fluid.setConfig({
  hover: true,
  simResolution: 128,
  dyeResolution: 1024,
  densityDissipation: 0.9,
  velocityDissipation: 0.3,
  curl: 28,
  splatRadius: 0.22,
  splatForce: 6000,
  bloom: true,
  sunrays: true,
  ...PALETTES.rainbow,
});
fluid.start();
fluid.multipleSplats(6);

let palette = "rainbow";
document.getElementById("palettes").addEventListener("click", (e) => {
  const b = e.target.closest("[data-p]");
  if (!b) return;
  palette = b.dataset.p;
  // Ink on paper looks muddy with bloom/sunrays, so turn them off for that palette.
  const soft = palette === "ink";
  fluid.setConfig({ ...PALETTES[palette], bloom: soft ? false : pressed("bloom"), sunrays: soft ? false : pressed("sunrays") });
  document.querySelectorAll("#palettes .btn").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  fluid.multipleSplats(5);
});

const pressed = (id) => document.getElementById(id).getAttribute("aria-pressed") === "true";
for (const id of ["bloom", "sunrays"]) {
  document.getElementById(id).addEventListener("click", (e) => {
    const on = !pressed(id);
    e.currentTarget.setAttribute("aria-pressed", String(on));
    fluid.setConfig({ [id]: on });
  });
}
document.getElementById("splash").addEventListener("click", () => fluid.multipleSplats(8));

// Idle swirl: a slow orbiting splat keeps the fluid moving in previews without a pointer.
let t = 0;
setInterval(() => {
  t += 0.9;
  const r = Math.min(innerWidth, innerHeight) * 0.28;
  const x = innerWidth / 2 + Math.cos(t) * r;
  const y = innerHeight / 2 + Math.sin(t) * r;
  fluid.splatAtLocation(x, y, -Math.sin(t) * 900, Math.cos(t) * 900);
}, 700);
</script>
</body>
</html>
