<script src="_shared/showcase.js"></script>
<script>
// WebLLM showcase: real WebGPU detection, the prebuilt model catalog, cache management, and (with WebGPU)
// streaming chat, the OpenAI-compatible API, token logprobs and a prefill/decode benchmark on SmolLM2-360M.
// Without a usable WebGPU adapter, the model scenes say so and never produce placeholder output.
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm";
const MODELS = {
  f16: { id: "SmolLM2-360M-Instruct-q4f16_1-MLC", quant: "4-bit（q4f16_1）" },
  f32: { id: "SmolLM2-360M-Instruct-q4f32_1-MLC", quant: "4-bit（q4f32_1）" },
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mb = (bytes) => `${Showcase.fmt(Math.round(bytes / 1048576))} MB`;

// ---------- shared: WebGPU probe ----------
let gpuPromise;
const probeGpu = () => (gpuPromise ||= (async () => {
  if (!navigator.gpu) return { ok: false, reason: "api" };
  let adapter = null, err = "";
  try { adapter = await navigator.gpu.requestAdapter({ powerPreference: "high-performance" }); } catch (e) { err = e.message; }
  if (!adapter) return { ok: false, reason: "adapter", err };
  const info = adapter.info || {};
  return { ok: true, adapter, info, f16: adapter.features.has("shader-f16"), label: [info.vendor, info.architecture].filter(Boolean).join(" ") || "WebGPU" };
})());

function unsupportedHtml(gpu, what) {
  const title = gpu.reason === "api" ? "此環境不支援 WebGPU" : "此環境拿不到可用的 WebGPU 顯示卡";
  const why = gpu.reason === "api"
    ? "瀏覽器沒有 navigator.gpu。WebLLM 只能透過 WebGPU 在顯示卡上執行模型，沒有 CPU 版本。"
    : "瀏覽器有 navigator.gpu，但 requestAdapter() 回傳 null：可能是硬體加速被關閉、驅動程式太舊、顯示卡在封鎖清單上，或是無頭（headless）瀏覽器。";
  return `<div class="wl-card wl-no">
    <div class="ic">⚠️</div><h2>${title}</h2>
    <p>${why}${what ? `因此無法${what}，這裡不顯示任何模擬或假造的輸出。` : ""}</p>
    <ul><li>改用 Chrome 或 Edge 113 以上（Windows、macOS、ChromeOS）</li><li>Android 用 Chrome 121 以上；iPhone、Mac 用 Safari 26 以上</li><li>確認瀏覽器設定的「使用圖形加速功能」已開啟</li><li>顯示卡需要約 400 MB 以上可用記憶體</li></ul>
    <div class="det">navigator.gpu：${navigator.gpu ? "有" : "無"}・requestAdapter()：${gpu.reason === "api" ? "無法呼叫" : "null"}${gpu.err ? `・${esc(gpu.err)}` : ""}</div>
  </div>`;
}

// ---------- shared: library + engine ----------
let lib = null, libPromise = null, engine = null, enginePromise = null, engineModel = null;
const progressSubs = new Set();
const loadLib = () => (libPromise ||= import(WEBLLM_URL).then((m) => (lib = m), (e) => { libPromise = null; throw e; }));

async function needLib(ctx) {
  if (lib) return lib;
  if (!libPromise) {
    await ctx.gate({ icon: "📦", title: "載入 WebLLM 函式庫", desc: "只下載函式庫本身，不下載任何模型。這個場景不需要 WebGPU。", tags: ["約 6 MB JavaScript", "不含模型"], button: "載入函式庫" });
  }
  const st = ctx.status("載入 WebLLM 函式庫…");
  try { await loadLib(); } catch (e) { st.error(`函式庫載入失敗：${e.message}`); return null; }
  st.done();
  return lib;
}

// Map WebLLM's English progress text to Traditional Chinese status lines.
function onProgress(status, report) {
  const t = report.text || "";
  let m;
  if ((m = t.match(/^Fetching param cache.*?(\d+)MB fetched\. (\d+)%/))) status.text(`下載模型權重中… ${m[1]} MB（${m[2]}%）`);
  else if ((m = t.match(/^Loading model from cache.*?(\d+)%/))) status.text(`從瀏覽器快取載入模型… ${m[1]}%`);
  else if ((m = t.match(/^Loading GPU shader modules.*?(\d+)%/))) status.text(`編譯 GPU 著色器… ${m[1]}%`);
  else if (/^Start to fetch params/.test(t)) status.text("準備下載模型權重…");
  if (typeof report.progress === "number") status.progress(report.progress);
}

// Returns { engine } when ready, { gpu } when WebGPU is unavailable, or { failed } after a load error.
async function needEngine(ctx) {
  const gpu = await probeGpu();
  if (!gpu.ok) return { gpu };
  if (engine) return { engine };
  if (!enginePromise) {
    await ctx.gate({ icon: "💬", title: "下載語言模型", desc: "SmolLM2 360M Instruct（4-bit 量化）在你的顯示卡上執行。模型存進瀏覽器快取，之後可離線使用，對話不會上傳。", tags: ["需要 WebGPU", "模型約 213 MB", "函式庫約 6 MB"], button: "下載模型並開始" });
    if (!enginePromise) {
      const model = gpu.f16 ? MODELS.f16 : MODELS.f32;
      enginePromise = loadLib()
        .then((l) => l.CreateMLCEngine(model.id, { initProgressCallback: (r) => progressSubs.forEach((f) => f(r)) }))
        .then((e) => { engine = e; engineModel = model; return e; }, (e) => { enginePromise = null; throw e; });
    }
  }
  const st = ctx.status(lib ? "載入模型…" : "載入 WebLLM 函式庫…");
  const sub = (r) => onProgress(st, r);
  progressSubs.add(sub);
  try { await enginePromise; } catch (e) {
    st.error(`模型載入失敗（可能是網路中斷或顯示卡記憶體不足），切換場景可再試一次。原因：${e.message}`);
    return { failed: true };
  } finally { progressSubs.delete(sub); }
  st.done();
  return { engine };
}

// One generation at a time on the shared engine.
let lock = Promise.resolve();
function exclusive(fn) { const p = lock.then(fn); lock = p.catch(() => {}); return p; }
function guard(ctx) { ctx.onCleanup(() => { if (engine) engine.interruptGenerate(); }); }

function jsonHtml(obj) {
  const s = JSON.stringify(obj, null, 2);
  return esc(s).replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(-?\d+(?:\.\d+)?(?:e[+-]?\d+)?)\b|\b(true|false|null)\b/g, (m, str, colon, num, lit) => {
    if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`;
    if (num) return `<span class="n">${num}</span>`;
    return `<span class="n">${lit}</span>`;
  });
}

Showcase.run({ scenes: [
  {
    id: "chat", title: "離線聊天",
    api: "engine.chat.completions.create({ messages, stream: true, stream_options: { include_usage: true } })",
    desc: "原示範的聊天機器人：模型在 WebGPU 上逐字產生，串流的最後一個 chunk 帶 usage，裡面的 extra.decode_tokens_per_s 就是右側的產生速度。",
    hint: "點題目或用英文提問，回覆會逐字串流出現",
    async mount(ctx) {
      ctx.html(`<div class="wl-pad wl-center"></div>`);
      const res = await needEngine(ctx);
      if (res.gpu) { ctx.el.classList.add("scroll"); ctx.$(".wl-pad").innerHTML = unsupportedHtml(res.gpu, "下載與執行模型"); return; }
      if (!res.engine) return;
      guard(ctx);
      const gpu = await probeGpu();
      const SYSTEM = "You are a friendly assistant running fully offline inside a web browser. Reply in English, clearly and briefly (under 120 words).";
      const SUGS = [
        ["🌧️ 寫一首台北雨天短詩", "Write a short poem about a rainy afternoon in Taipei."],
        ["🧋 發想三種夏季手搖飲", "Invent three refreshing bubble tea flavors for summer, one line each."],
        ["🧠 兩句話解釋 WebGPU", "Explain what WebGPU is in two simple sentences."],
        ["🗺️ 規劃台南美食一日遊", "Plan a simple one-day food trip in Tainan, Taiwan."],
      ];
      const pad = ctx.$(".wl-pad");
      pad.classList.remove("wl-center");
      pad.classList.add("wl-chatbox");
      pad.innerHTML = `
        <div class="wl-chat"><div class="wl-empty"><h2>模型就緒，開始聊天吧</h2><p>這個 360M 小模型以英文為主，點下方題目或用英文提問。</p></div></div>
        <div class="wl-composer">
          <div class="wl-sugs">${SUGS.map(([l], i) => `<button class="wl-sug" type="button" data-i="${i}">${l}</button>`).join("")}</div>
          <form class="wl-form" autocomplete="off"><input class="wl-input" maxlength="500" placeholder="用英文輸入訊息，按 Enter 送出" aria-label="訊息"><button class="btn primary send" type="submit">送出</button></form>
        </div>
        <aside class="wl-side wl-card">
          <div class="wl-speed"><b class="tps">--</b><span>tokens／秒（產生速度）</span><div class="wl-k last">還沒有回覆</div></div>
          <dl class="wl-dl"><dt>模型</dt><dd>SmolLM2 360M</dd><dt>量化</dt><dd>${engineModel.quant}</dd><dt>下載量</dt><dd>約 213 MB</dd><dt>GPU</dt><dd>${esc(gpu.label)}</dd></dl>
          <p class="wl-k" style="margin:auto 0 0">🔒 推論都在這台裝置上執行，對話內容不會上傳。</p>
        </aside>`;
      const chat = ctx.$(".wl-chat"), input = ctx.$(".wl-input"), sendBtn = ctx.$(".send");
      let history = [], busy = false;
      const add = (role, text) => {
        const body = Showcase.h("div", { class: "body", text });
        const meta = Showcase.h("div", { class: "wl-meta" });
        const row = role === "ai" ? Showcase.h("div", { class: "wl-msg ai" }, Showcase.h("div", { class: "wl-av", text: "AI" }), Showcase.h("div", {}, body, meta)) : Showcase.h("div", { class: "wl-msg user" }, body);
        chat.append(row); chat.scrollTop = chat.scrollHeight;
        return { row, body, meta };
      };
      const setBusy = (on) => { busy = on; sendBtn.textContent = on ? "停止" : "送出"; input.disabled = on; ctx.$$(".wl-sug").forEach((b) => { b.disabled = on; }); };
      const send = (text) => exclusive(async () => {
        const prompt = text.trim();
        if (busy || !prompt || !ctx.active) return;
        ctx.$(".wl-empty")?.remove();
        input.value = "";

        let answer = "", usage = null, finish = "";

          const stream = await engine.chat.completions.create({ messages: [{ role: "system", content: SYSTEM }, ...history], stream: true, stream_options: { include_usage: true }, temperature: 0.7, max_tokens: 320 });

          <h3 class="wl-h" style="margin-top:12px">WebLLM 使用的 Cache Storage</h3>
          <div class="wl-list">${names.length ? names.map((k, i) => `<div class="wl-item"><code>${esc(k)}</code><span class="wl-n">${counts[i]} 個檔案</span></div>`).join("") : `<p class="wl-k">還沒有 webllm 開頭的快取（尚未下載過模型）。</p>`}</div>`;
        ctx.$(".models").innerHTML = `<h3 class="wl-h">已快取的模型</h3>
          <p class="wl-k">用 hasModelInCache() 掃描清單中 ${ids.length} 個模型，耗時 ${Showcase.fmtMs(scanMs)}，找到 <b class="wl-n">${hit.length}</b> 個。</p>
          <div class="wl-list">${hit.length ? hit.map((id) => `<div class="wl-item"><code>${esc(id)}</code><button class="btn del" type="button" data-id="${esc(id)}">刪除</button></div>`).join("") : `<p class="wl-k">目前沒有任何模型在快取裡。到「離線聊天」場景下載後，這裡會列出 ${MODELS.f16.id.replace("-q4f16_1-MLC", "")} 的檔案。</p>`}</div>`;
      };
      ctx.on(ctx.el, "click", async (e) => {
        const b = e.target.closest(".del");
        if (!b) return;
        if (!b.classList.contains("arm")) { b.classList.add("arm"); b.textContent = "再按一次確認"; return; }
        b.disabled = true; b.textContent = "刪除中…";
        if (engine && engineModel?.id === b.dataset.id) { await engine.unload(); engine = null; enginePromise = null; }
        await l.deleteModelAllInfoInCache(b.dataset.id);
        await scan();
      });
      ctx.button("重新掃描", scan);
      await scan();
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "usage.extra.prefill_tokens_per_s / decode_tokens_per_s",
    desc: "同一個模型，提示詞從約 50 個 token 加長到約 3000 個，每級產生 32 個 token。prefill（讀進提示詞）是平行運算，越長越能吃滿 GPU；decode（逐字產生）受 KV cache 長度與記憶體頻寬限制。數字全部來自引擎回傳的 usage.extra。",
    hint: "按「開始測試」，需要 WebGPU",
    async mount(ctx) {
      const gpu = await probeGpu();
      if (!ctx.active) return;
      if (!gpu.ok) {
        ctx.html(`<div class="wl-card wl-panel"><h3 class="wl-h">極限測試：prefill 與 decode</h3><p class="bad">此環境沒有可用的 WebGPU adapter，無法執行（不產生假數據）。</p><p>${gpu.reason === "api" ? "瀏覽器沒有 navigator.gpu。" : "navigator.gpu.requestAdapter() 回傳 null。"}這個測試要實際在顯示卡上跑語言模型，量提示詞長度對 prefill 與 decode 速度的影響。</p><button class="btn primary" type="button" data-sc-run>開始測試</button><p class="msg"></p></div><div class="wl-stress wl-card"><canvas></canvas></div>`);
        ctx.on(ctx.$("[data-sc-run]"), "click", () => { ctx.$(".msg").innerHTML = `<span class="bad">無法開始：沒有 WebGPU。</span>已重新偵測 navigator.gpu${navigator.gpu ? "（存在，但沒有 adapter）" : "（不存在）"}，沒有執行任何推論。`; });
        const cv = ctx.$("canvas");
        const paint = () => {
          const dpr = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
          cv.width = w * dpr; cv.height = h * dpr;
          const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
          g.fillStyle = cssVar("--muted"); g.font = `600 14px ${cssVar("--font")}`; g.textAlign = "center"; g.textBaseline = "middle";
          const pr = ctx.$(".wl-panel").getBoundingClientRect(), cr = cv.getBoundingClientRect();
          const covered = pr.right > cr.left + 10;
          g.fillText("沒有 WebGPU：沒有量測資料", w / 2, covered ? Math.min(h - 20, pr.bottom - cr.top + 40) : h / 2);
        };
        paint(); ctx.onResize(paint);
        return;
      }
      ctx.html(`<div class="wl-stress wl-card"><canvas></canvas></div>`);
      const res = await needEngine(ctx);
      if (!res.engine || !ctx.active) return;
      guard(ctx);
      const eng = res.engine;
      const FILL = "Taiwan is an island in East Asia with high mountains, night markets, bubble tea and a busy rail network. ";
      const points = [];
      const b = ctx.bench({
        label: "提示詞", unit: "字", sizes: [8, 32, 96, 192, 288],
        budget: 60000, target: 20000,
        async prepare(n) {
          await eng.resetChat();
          return [{ role: "user", content: `${FILL.repeat(n)}\nSummarize the text above in one short sentence.` }];
        },
        async run(n, messages) {
          const r = await exclusive(() => eng.chat.completions.create({ messages, temperature: 0, max_tokens: 32 }));
          const x = r.usage.extra;
          points.push({ prompt: r.usage.prompt_tokens, pf: x.prefill_tokens_per_s, dc: x.decode_tokens_per_s, ttft: x.time_to_first_token_s });
          return `${Math.round(x.prefill_tokens_per_s)}／${Math.round(x.decode_tokens_per_s)} t/s`;
        },
        note: "detail 欄是 prefill／decode tokens/秒。提示詞長度以重複的英文段落組成（每段約 20 個 token），實際 token 數畫在右側。context 上限 4096 token，超過會報錯，所以最大一級約 3000。",
      });
      const cv = ctx.$("canvas");
      ctx.raf(() => {
        const dpr = Math.min(2, devicePixelRatio || 1), w = cv.clientWidth, h = cv.clientHeight;
        if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
        const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
        g.textAlign = "left"; g.textBaseline = "top";
        g.fillStyle = cssVar("--fg"); g.font = `600 14px ${cssVar("--font")}`; g.fillText("提示詞長度 vs 速度（tokens/秒）", 16, 14);
        g.font = `12px ${cssVar("--font")}`;
        g.fillStyle = "#4cc9f0"; g.fillText("■ prefill", 16, 36); g.fillStyle = "#f7df1e"; g.fillText("■ decode", 96, 36);
        if (!points.length) { g.fillStyle = cssVar("--muted"); g.fillText(b.results.length ? "量測中…" : "尚未測試", 16, 62); return; }
        const top = 64, rowH = Math.min(56, (h - top - 10) / 5), maxPf = Math.max(...points.map((p) => p.pf)), maxDc = Math.max(...points.map((p) => p.dc));
        g.font = `12px ${cssVar("--mono")}`;
        points.forEach((p, i) => {
          const y = top + i * rowH, x0 = 110, bw = w - x0 - 130;
          g.fillStyle = cssVar("--muted"); g.textBaseline = "middle"; g.fillText(`${Showcase.fmt(p.prompt)} tok`, 16, y + rowH * 0.35);
          g.fillText(`首字 ${p.ttft.toFixed(2)}s`, 16, y + rowH * 0.7);
          g.fillStyle = "#4cc9f0"; g.fillRect(x0, y + rowH * 0.15, Math.max(2, (p.pf / maxPf) * bw), rowH * 0.3);
          g.fillStyle = "#f7df1e"; g.fillRect(x0, y + rowH * 0.52, Math.max(2, (p.dc / maxDc) * bw), rowH * 0.3);
          g.fillStyle = cssVar("--fg");
          g.fillText(`${Math.round(p.pf)}`, x0 + Math.max(2, (p.pf / maxPf) * bw) + 6, y + rowH * 0.3);
          g.fillText(`${p.dc.toFixed(1)}`, x0 + Math.max(2, (p.dc / maxDc) * bw) + 6, y + rowH * 0.67);
        });
      });
    },
  },
] });
</script>
</body>
