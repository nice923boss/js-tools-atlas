<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebLLM 示範：瀏覽器內離線聊天機器人</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"click","needs":["webgpu"],"size":"約 213 MB","note":"SmolLM2 360M 模型在顯示卡上執行，存進瀏覽器快取後可離線聊天；小模型以英文為主"}</script>
<style>
  .app { position: fixed; inset: 0; padding: 12px 14px 46px; display: grid; grid-template-columns: minmax(0, 1fr) 232px; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px 14px; }
  header { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; }
  header h1 { margin: 0 4px 0 0; font-size: 16px; }
  .chip { font: 400 11px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
  .chip.ok { color: var(--c4); border-color: rgba(123, 211, 137, .45); }
  .chip.bad { color: #ff7b7f; border-color: rgba(229, 72, 77, .55); }
  .chip[hidden] { display: none; }
  header .btn { margin-left: auto; padding: 6px 10px; font-size: 12px; }
  .btn:disabled { opacity: .4; cursor: default; transform: none; }

  .chat { grid-column: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: radial-gradient(120% 70% at 50% 0%, rgba(76, 201, 240, .08), transparent 60%), var(--bg-2); }
  .msg { display: flex; gap: 8px; max-width: 88%; animation: rise .25s ease-out both; }
  .msg.user { align-self: flex-end; }
  .msg .body { padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; line-height: 1.55; }
  .msg.user .body { background: var(--c1); color: #1a1a1a; border-bottom-right-radius: 4px; }
  .msg.ai .body { background: rgba(255, 255, 255, .05); border: 1px solid var(--line); border-top-left-radius: 4px; min-height: 37px; }
  .msg.ai.typing .body::after { content: "▍"; color: var(--c2); animation: blink 1s steps(1) infinite; }
  .msg.ai.err .body { border-color: rgba(229, 72, 77, .6); color: #ffb3b5; }
  .av { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 10px var(--mono); color: #0e1013; background: linear-gradient(135deg, var(--c2), var(--c6)); }
  .meta { margin-top: 4px; font: 11px var(--mono); color: var(--muted); }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  @keyframes blink { 50% { opacity: 0; } }

  .empty { margin: auto; max-width: 420px; text-align: center; padding: 4px; }
  .empty h2 { margin: 14px 0 6px; font-size: 17px; }
  .empty p { margin: 0; color: var(--muted); font-size: 13px; }
  .orb { width: 74px; height: 74px; margin: 0 auto; border-radius: 50%; background: conic-gradient(from 0deg, var(--c2), var(--c6), var(--c3), var(--c1), var(--c2)); filter: blur(1px); animation: spin 6s linear infinite; position: relative; }
  .orb::after { content: "💬"; position: absolute; inset: 9px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; font-size: 26px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .orb.idle { animation-duration: 18s; }
  .empty.loading h2, .empty.loading p { visibility: hidden; }
  .warn { text-align: left; max-width: 460px; }
  .warn .icon { font-size: 30px; text-align: center; }
  .warn h2 { text-align: center; }
  .warn ul { margin: 10px 0 0; padding-left: 20px; font-size: 13px; }
  .warn li { margin: 3px 0; }

  .composer { grid-column: 1; display: grid; gap: 8px; min-width: 0; }
  .sugs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
  .sugs::-webkit-scrollbar { display: none; }
  .sug { flex: none; white-space: nowrap; cursor: pointer; font: 12px var(--font); color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; transition: border-color .15s, background .15s; }
  .sug:hover:not(:disabled) { border-color: var(--c2); background: rgba(76, 201, 240, .08); }
  .sug:disabled { opacity: .4; cursor: default; }
  form { display: flex; gap: 8px; margin: 0; }
  #input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-2); outline: none; }
  #input:focus { border-color: var(--c2); }
  #input:disabled { opacity: .55; }
  form .btn { min-width: 64px; }
  .app.unsupported .sugs { display: none; }

  .side { grid-column: 2; grid-row: 2 / 4; display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: hidden; }
  .speed b { display: block; font: 700 40px/1 var(--mono); color: var(--c2); }
  .speed span { font-size: 12px; color: var(--muted); }
  #lastStat { font-size: 12px; color: var(--muted); margin-top: 4px; }
  dl { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; font-size: 12px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  .lock { margin: auto 0 0; font-size: 12px; color: var(--muted); }

  @media (max-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr); padding: 10px 10px 46px; gap: 8px; }
    .side { display: none; }
    .chat { padding: 12px 10px; }
    .msg { max-width: 94%; }
    .chip.wide { display: none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>離線聊天機器人</h1>
    <span class="chip wide">SmolLM2 360M・4-bit</span>
    <span class="chip" id="chipGpu">WebGPU</span>
    <span class="chip ok" id="chipCache" hidden>可離線</span>
    <button class="btn" id="resetBtn" disabled>新對話</button>
  </header>
  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <div class="orb idle"></div>
      <h2 id="emptyTitle">裝在瀏覽器裡的 AI 聊天</h2>
      <p id="emptyText">模型下載一次就存進瀏覽器快取，之後斷網也能對話，所有運算都在你的顯示卡上。</p>
    </div>
  </div>
  <div class="composer">
    <div class="sugs" id="sugs"></div>
    <form id="form" autocomplete="off">
      <input id="input" maxlength="500" placeholder="用英文輸入訊息，按 Enter 送出" aria-label="訊息" disabled>
      <button class="btn primary" id="sendBtn" type="submit" disabled>送出</button>
    </form>
  </div>
  <aside class="side panel">
    <div class="speed"><b id="tps">--</b><span>tokens／秒（產生速度）</span><div id="lastStat">還沒有回覆</div></div>
    <dl>
      <dt>模型</dt><dd>SmolLM2 360M Instruct</dd>
      <dt>量化</dt><dd id="quant">4-bit</dd>
      <dt>下載量</dt><dd>約 213 MB</dd>
      <dt>顯示記憶體</dt><dd id="vram">約 380 MB</dd>
      <dt>GPU</dt><dd id="gpu">尚未偵測</dd>
      <dt>快取</dt><dd id="cache">尚未下載</dd>
    </dl>
    <p class="lock">🔒 推論都在這台裝置上執行，對話內容不會上傳到伺服器。</p>
  </aside>
</div>
<div class="hint">點下方題目或用英文提問，回覆會逐字串流出現</div>

<script src="_shared/gate.js"></script>
<script type="module">
// WebLLM: run SmolLM2-360M-Instruct (4-bit, MLC prebuilt) on WebGPU with an OpenAI-style streaming chat API.
const WEBLLM_URL = "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm";
// Same 4-bit weights; the f16 build needs the shader-f16 GPU feature and uses less VRAM.
const MODELS = {
  f16: { id: "SmolLM2-360M-Instruct-q4f16_1-MLC", quant: "4-bit（q4f16_1）", vram: "約 380 MB" },
  f32: { id: "SmolLM2-360M-Instruct-q4f32_1-MLC", quant: "4-bit（q4f32_1）", vram: "約 580 MB" },
};
const SYSTEM = "You are a friendly assistant running fully offline inside a web browser. Reply in English, clearly and briefly (under 120 words).";
const SUGGESTIONS = [
  { label: "🌧️ 寫一首台北雨天短詩", prompt: "Write a short poem about a rainy afternoon in Taipei." },
  { label: "🧋 發想三種夏季手搖飲", prompt: "Invent three refreshing bubble tea flavors for summer, one line each." },
  { label: "🧠 兩句話解釋 WebGPU", prompt: "Explain what WebGPU is in two simple sentences." },
  { label: "🗺️ 規劃台南美食一日遊", prompt: "Plan a simple one-day food trip in Tainan, Taiwan." },
  { label: "✉️ 寫一封請假信", prompt: "Write a short, polite email asking my manager for a day off tomorrow." },
];
const UNSUPPORTED = {
  api: {
    title: "這個瀏覽器沒有 WebGPU",
    text: "WebLLM 要透過 WebGPU 讓顯示卡執行語言模型，目前的瀏覽器沒有提供這個功能，所以無法啟動。",
  },
  adapter: {
    title: "瀏覽器拿不到可用的顯示卡",
    text: "瀏覽器支援 WebGPU，但沒有取得顯示卡，可能是硬體加速被關閉、驅動程式太舊，或顯示卡在瀏覽器的封鎖清單上。",
  },
};
const TIPS = [
  "改用 Chrome 或 Edge 113 以上（Windows、macOS、ChromeOS）",
  "Android 手機用 Chrome 121 以上，iPhone、Mac 用 Safari 26 以上",
  "確認瀏覽器設定裡的「使用圖形加速功能」已開啟",
  "顯示卡需要約 400 MB 以上可用記憶體",
];

const $ = (id) => document.getElementById(id);
const chat = $("chat");
const input = $("input");
const sendBtn = $("sendBtn");
const resetBtn = $("resetBtn");

let engine = null;
let history = [];
let busy = false;

for (const s of SUGGESTIONS) {
  const b = document.createElement("button");
  b.className = "sug";
  b.type = "button";
  b.textContent = s.label;
  b.disabled = true;
  b.addEventListener("click", () => send(s.prompt));
  $("sugs").append(b);
}

function setReady(ready) {
  input.disabled = !ready;
  resetBtn.disabled = !ready;
  sendBtn.disabled = !ready;
  for (const b of $("sugs").children) b.disabled = !ready || busy;
}

function setBusy(on) {
  busy = on;
  sendBtn.textContent = on ? "停止" : "送出";
  sendBtn.classList.toggle("primary", !on);
  input.disabled = on;
  resetBtn.disabled = on;
  for (const b of $("sugs").children) b.disabled = on;
}

// While loading, the status overlay replaces the empty-state text and the orb spins faster
function setLoading(on) {
  $("empty").classList.toggle("loading", on);
  document.querySelector(".orb").classList.toggle("idle", !on);
}

function setEmpty(title, text) {
  $("emptyTitle").textContent = title;
  $("emptyText").textContent = text;
}

function showUnsupported(reason) {
  const info = UNSUPPORTED[reason];
  $("app").classList.add("unsupported");
  $("chipGpu").textContent = "WebGPU 不支援";
  $("chipGpu").classList.add("bad");
  $("gpu").textContent = "不支援";
  input.placeholder = "這個瀏覽器無法執行";
  const box = $("empty");
  box.className = "empty warn";
  box.replaceChildren();
  const icon = document.createElement("div");
  icon.className = "icon";
  icon.textContent = "⚠️";
  const h = document.createElement("h2");
  h.textContent = info.title;
  const p = document.createElement("p");
  p.textContent = info.text;
  const ul = document.createElement("ul");
  for (const t of TIPS) {
    const li = document.createElement("li");
    li.textContent = t;
    ul.append(li);
  }
  box.append(icon, h, p, ul);
}

async function probeGpu() {
  if (!navigator.gpu) return { ok: false, reason: "api" };
  let adapter = null;
  try {
    adapter = await navigator.gpu.requestAdapter();
  } catch (err) {
    console.warn(err);
  }
  if (!adapter) return { ok: false, reason: "adapter" };
  const info = adapter.info || {};
  return { ok: true, f16: adapter.features.has("shader-f16"), label: [info.vendor, info.architecture].filter(Boolean).join(" ") };
}

// Map WebLLM's English progress text to Traditional Chinese status lines
function onProgress(status, report) {
  const t = report.text || "";
  let m;
  if ((m = t.match(/^Fetching param cache.*?(\d+)MB fetched\. (\d+)%/))) {
    status.text(`下載模型權重中… ${m[1]} MB（${m[2]}%）`);
    status.progress(report.progress);
  } else if ((m = t.match(/^Loading model from cache.*?(\d+)%/))) {
    status.text(`從瀏覽器快取載入模型… ${m[1]}%`);
    status.progress(report.progress);
  } else if ((m = t.match(/^Loading GPU shader modules.*?(\d+)%/))) {
    status.text(`編譯 GPU 著色器… ${m[1]}%`);
    status.progress(report.progress);
  } else if (/^Start to fetch params/.test(t)) {
    status.text("準備下載模型權重…");
    status.progress(0);
  }
}

function addMessage(role, text) {
  const row = document.createElement("div");
  row.className = `msg ${role}`;
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = text;
  const meta = document.createElement("div");
  meta.className = "meta";
  if (role === "ai") {
    const av = document.createElement("div");
    av.className = "av";
    av.textContent = "AI";
    const col = document.createElement("div");
    col.append(body);
    row.append(av, col);
    col.append(meta);
  } else {
    row.append(body);
  }
  chat.append(row);
  chat.scrollTop = chat.scrollHeight;
  return { row, body, meta };
}

const FINISH_NOTE = { abort: "・已停止", length: "・達長度上限" };

function showStats(meta, usage, finish) {
  const extra = usage && usage.extra;
  if (!extra) return;
  const tps = extra.decode_tokens_per_s;
  const ttft = extra.time_to_first_token_s;
  meta.textContent = `${usage.completion_tokens} tokens・${tps.toFixed(1)} tokens/秒・首字 ${ttft.toFixed(2)} 秒${FINISH_NOTE[finish] || ""}`;
  $("tps").textContent = tps.toFixed(1);
  $("lastStat").textContent = `上一則：${usage.completion_tokens} tokens，首字 ${ttft.toFixed(2)} 秒`;
}

async function send(text) {
  const prompt = text.trim();
  if (!engine || busy || !prompt) return;
  const empty = $("empty");
  if (empty) empty.remove();
  input.value = "";
  setBusy(true);
  addMessage("user", prompt);
  history = [...history, { role: "user", content: prompt }];
  const reply = addMessage("ai", "");
  reply.row.classList.add("typing");
  let answer = "";
  let usage = null;
  let finish = "";
  try {
    const stream = await engine.chat.completions.create({
      messages: [{ role: "system", content: SYSTEM }, ...history],
      stream: true,
      stream_options: { include_usage: true },
      temperature: 0.7,
      max_tokens: 320,
    });
    for await (const chunk of stream) {
      const choice = chunk.choices[0];
      const delta = (choice && choice.delta.content) || "";
      if (choice && choice.finish_reason) finish = choice.finish_reason;
      if (delta) {
        answer += delta;
        reply.body.textContent = answer;
        chat.scrollTop = chat.scrollHeight;
      }
      if (chunk.usage) usage = chunk.usage;
    }
    history = [...history, { role: "assistant", content: answer }];
    if (!answer) reply.body.textContent = "（已停止）";
    showStats(reply.meta, usage, finish);
  } catch (err) {
    console.warn(err);
    history = history.slice(0, -1);
    reply.row.classList.add("err");
    reply.body.textContent = /context/i.test(err.message)
      ? "對話超過模型能記住的長度，請按「新對話」重新開始。"
      : `產生失敗：${err.message}`;
  }
  reply.row.classList.remove("typing");
  setBusy(false);
  input.focus();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (busy) engine.interruptGenerate();
  else send(input.value);
});

resetBtn.addEventListener("click", async () => {
  if (busy) return;
  await engine.resetChat();
  history = [];
  $("tps").textContent = "--";
  $("lastStat").textContent = "還沒有回覆";
  chat.replaceChildren();
  const box = document.createElement("div");
  box.className = "empty";
  box.id = "empty";
  box.innerHTML = '<div class="orb idle"></div><h2 id="emptyTitle"></h2><p id="emptyText"></p>';
  chat.append(box);
  setEmpty("新對話已開始", "點下方題目，或用英文輸入想問的事。");
});

async function main() {
  await demoGate({
    icon: "💬",
    title: "瀏覽器內的離線聊天機器人",
    desc: "按下後下載 SmolLM2 360M 語言模型並用顯示卡執行。模型會存進瀏覽器快取，之後斷網也能聊天，對話不會上傳。",
    tags: ["需要 WebGPU", "約 213 MB", "英文對話"],
    button: "下載模型並開始",
  });

  const gpu = await probeGpu();
  if (!gpu.ok) {
    showUnsupported(gpu.reason);
    return;
  }
  const model = gpu.f16 ? MODELS.f16 : MODELS.f32;
  $("quant").textContent = model.quant;
  $("vram").textContent = model.vram;
  $("gpu").textContent = gpu.label || "WebGPU";
  setLoading(true);

  const status = demoStatus("載入 WebLLM…");
  try {
    const webllm = await import(WEBLLM_URL);
    const cached = await webllm.hasModelInCache(model.id);
    status.text(cached ? "從瀏覽器快取載入模型…" : "下載模型中…");
    engine = await webllm.CreateMLCEngine(model.id, { initProgressCallback: (r) => onProgress(status, r) });
    status.done();
    const stored = await webllm.hasModelInCache(model.id);
    $("cache").textContent = stored ? "已存入，可離線使用" : "未快取";
    $("chipCache").hidden = !stored;
  } catch (err) {
    console.warn(err);
    // Hide the empty state so the error box is the only message
    $("empty").hidden = true;
    status.error(`模型載入失敗（可能是網路中斷或顯示卡記憶體不足），重新整理頁面可再試一次。原因：${err.message}`);
    $("chipGpu").textContent = "載入失敗";
    $("chipGpu").classList.add("bad");
    return;
  }
  setLoading(false);
  setEmpty("模型就緒，開始聊天吧", "這個 360M 小模型以英文為主，點下方題目或用英文提問。");
  setReady(true);
  input.focus();
}

main();
</script>
</body>
</html>
