<script>
// WEBMIDI.js exposes WebMidi, Note, Message, Utilities and Enumerations as globals (IIFE build).
const { h, fmtCompact, fmtMs } = Showcase;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const CJK = '"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif';
const MONO = '"JetBrains Mono", ui-monospace, Consolas, monospace';

// ---------- MIDI helpers (all parsing is done by WEBMIDI.js; these only format) ----------
const TYPE_CN = {
  noteoff: "音符關", noteon: "音符開", keyaftertouch: "單鍵觸後", controlchange: "控制變更", programchange: "音色切換",
  channelaftertouch: "通道觸後", pitchbend: "彎音", sysex: "系統專屬", timecode: "時間碼", songposition: "樂曲位置",
  songselect: "樂曲選擇", tunerequest: "調音請求", tuningrequest: "調音請求", sysexend: "系統專屬結束", clock: "時脈",
  start: "開始", continue: "繼續", stop: "停止", activesensing: "主動感測", reset: "重置",
};
const typeCls = (t) => (t === "noteon" ? "t-on" : t === "noteoff" ? "t-off" : t === "controlchange" || t === "pitchbend" ? "t-cc" : t ? "t-sys" : "t-bad");
const hex = (b) => (b & 255).toString(16).toUpperCase().padStart(2, "0");
const hexs = (arr, max = 8) => [...arr].slice(0, max).map(hex).join(" ") + (arr.length > max ? " …" : "");
const toMsg = (bytes) => new Message(Uint8Array.from(bytes));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const bendOf = (m) => Utilities.fromMsbLsbToFloat(m.dataBytes[1], m.dataBytes[0]) * 2 - 1;
function meaning(m) {
  const [a = 0, b = 0] = m.dataBytes;
  switch (m.type) {
    case "noteon": case "noteoff": return `${Utilities.toNoteIdentifier(a)}・力度 ${b}${m.type === "noteon" && b === 0 ? "（視同音符關）" : ""}`;
    case "keyaftertouch": return `${Utilities.toNoteIdentifier(a)}・壓力 ${b}`;
    case "controlchange": return `CC${a} ${Utilities.getCcNameByNumber(a) || ""} = ${b}`;
    case "programchange": return `切到音色 #${a}`;
    case "channelaftertouch": return `壓力 ${a}`;
    case "pitchbend": return `彎音 ${bendOf(m).toFixed(3)}（-1 到 1）`;
    case "sysex": return `廠商 ID ${hexs(m.manufacturerId || [])}・${m.dataBytes.length} 個資料位元組`;
    default: return m.type ? TYPE_CN[m.type] || m.type : "不是合法的狀態位元組";
  }
}
// Rolling log of parsed messages (newest first).
function logger(host, max = 10) {
  const rows = [];
  const push = (html) => { rows.unshift(`<div>${html}</div>`); rows.length = Math.min(rows.length, max); host.innerHTML = rows.join(""); };
  return {
    msg(m, src, ts = WebMidi.time) {
      push(`${(ts / 1000).toFixed(2).padStart(7)} <span class="hx">${hexs(m.rawData, 6)}</span> <b class="${typeCls(m.type)}">${m.type || "null"}</b>${m.channel ? ` ch${m.channel}` : ""} <i>${esc(meaning(m))}${src ? `・${esc(src)}` : ""}</i>`);
    },
    text(s, ts = WebMidi.time) { push(`${(ts / 1000).toFixed(2).padStart(7)} <span class="tx">${esc(s)}</span>`); },
  };
}

// ---------- audio: plain Web Audio voices (WEBMIDI.js itself makes no sound) ----------
let AC = null, master = null;
function audio() {
  if (!AC) {
    AC = new AudioContext();
    const comp = AC.createDynamicsCompressor();
    const an = AC.createAnalyser(); an.fftSize = 1024;
    comp.connect(an); an.connect(AC.destination);
    master = comp;
  }
  if (AC.state !== "running") AC.resume();
  return AC;
}
// Every scene plays through its own bus; unmounting silences and disconnects it.
function sceneBus(ctx) {
  let bus = null;
  ctx.onCleanup(() => { if (bus) { bus.gain.value = 0; bus.disconnect(); bus = null; } });
  return () => { audio(); if (!bus) { bus = AC.createGain(); bus.connect(master); } return bus; };
}
function voice(dest, midi, vel = 0.8, when = 0, dur = 0, { type = "triangle", detune = null } = {}) {
  const t = AC.currentTime + Math.max(0, when) + 0.01, f = 440 * Math.pow(2, (midi - 69) / 12);
  const peak = 0.04 + vel * 0.2, d1 = dur ? Math.min(0.4, dur) : 0.4;
  const g = AC.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + 0.01);
  g.gain.exponentialRampToValueAtTime(peak * 0.45, t + 0.01 + d1);
  g.connect(dest);
  const parts = type === "triangle" ? [["triangle", 1, 1], ["sine", 2, 0.3], ["sine", 3, 0.08]] : [[type, 1, type === "sine" ? 1 : 0.4]];
  const oscs = parts.map(([ty, mul, vol]) => {
    const o = AC.createOscillator(), v = AC.createGain();
    o.type = ty; o.frequency.value = f * mul; v.gain.value = vol;
    if (detune) detune.connect(o.detune);
    o.connect(v); v.connect(g); o.start(t);
    return o;
  });
  let done = false;
  const end = (at) => {
    if (done) return;
    done = true;
    oscs.forEach((o) => o.stop(at + 0.6));
    oscs[0].onended = () => { g.disconnect(); if (detune) oscs.forEach((o) => { try { detune.disconnect(o.detune); } catch (e) { /* already gone */ } }); };
  };
  if (dur) { g.gain.setTargetAtTime(0, t + 0.01 + Math.max(dur, d1), 0.07); end(t + dur); }
  return {
    release() {
      if (done) return;
      const n = AC.currentTime;
      g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(g.gain.value, n); g.gain.setTargetAtTime(0, n, 0.07);
      end(n);
    },
  };
}

// ---------- DOM piano ----------
const isBlack = (m) => [1, 3, 6, 8, 10].includes(((m % 12) + 12) % 12);
const hue = (m) => (m % 12) * 30 + 300;
function piano(host, lo, hi, { down, up, label } = {}) {
  host.classList.add("wm-kb");
  const whites = [];
  for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites.push(m);
  const keys = new Map();
  for (let m = lo; m <= hi; m++) {
    const el = h("div", { class: isBlack(m) ? "wm-b" : "wm-w" });
    if (isBlack(m)) {
      const wi = whites.filter((w) => w < m).length;
      el.style.left = `calc(${(wi / whites.length) * 100}% - ${(0.3 / whites.length) * 100}%)`;
      el.style.width = `${(0.6 / whites.length) * 100}%`;
    }
    el.style.setProperty("--hc", `hsl(${hue(m)} 85% 62%)`);
    if (label) el.innerHTML = label(m) || "";
    el.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* synthetic events have no capture */ }
      const r = el.getBoundingClientRect();
      if (down) down(m, clamp((e.clientY - r.top) / r.height, 0.2, 1));
    });
    const u = () => up && up(m);
    el.addEventListener("pointerup", u);
    el.addEventListener("pointercancel", u);
    host.append(el);
    keys.set(m, el);
  }
  return keys;
}

// ---------- canvas helper ----------
function view(ctx, host, draw) {
  const cv = h("canvas");
  host.append(cv);
  const g = cv.getContext("2d");
  const v = { cv, g, w: 0, h: 0, draw: () => draw(v) };
  const fit = () => {
    const r = host.getBoundingClientRect();
    v.w = Math.max(1, r.width); v.h = Math.max(1, r.height);
    cv.width = Math.round(v.w * DPR); cv.height = Math.round(v.h * DPR);
    cv.style.width = v.w + "px"; cv.style.height = v.h + "px";
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    draw(v);
  };
  const ro = new ResizeObserver(fit);
  ro.observe(host);
  ctx.onCleanup(() => ro.disconnect());
  fit();
  return v;
}
function txt(g, s, x, y, color = "#e8e6e3", size = 12, align = "left", mono = false, weight = 500) {
  g.font = `${weight} ${size}px ${mono ? MONO : CJK}`;
  g.fillStyle = color; g.textAlign = align; g.textBaseline = "middle";
  g.fillText(s, x, y);
}
// Subscribe to WEBMIDI.js events and undo everything on cleanup / re-subscribe.
function subscriber(ctx) {
  const subs = [];
  const api = {
    on(target, type, fn) { target.addListener(type, fn); subs.push(() => target.removeListener(type, fn)); },
    clear() { subs.splice(0).forEach((f) => { try { f(); } catch (e) { console.warn("removeListener failed", e); } }); },
  };
  ctx.onCleanup(api.clear);
  return api;
}

        ctx.group(["聽：時間戳預排", "聽：到點才送"], 0, (i) => { st.listen = i; });
        ctx.toggle("主執行緒負載", false, (v) => { st.load = v; });
        ctx.slider("速度", { min: 80, max: 240, step: 1, value: st.bpm, format: (v) => `${v} BPM` }, (v) => { st.bpm = v; });
        // Scheduler: runs every 25 ms and hands over everything inside the look-ahead window.
        ctx.interval(() => {
          const now = WebMidi.time, stepMs = 60000 / st.bpm / 4;
          if (next < now - stepMs) next = now + 20;
          while (next < now + LOOK) {
            const target = next, n = STEPS[step % STEPS.length];
            const ts = Utilities.toTimestamp(`+${target - now}`);
            A.push({ target: ts, at: now });
            if (st.playing && st.listen === 0) {
              voice(out(), n, 0.7, (ts - WebMidi.time) / 1000, stepMs * 0.0008);
              if (WebMidi.enabled) WebMidi.outputs.forEach((o) => o.channels[1].playNote(n, { time: ts, duration: stepMs * 0.8 }));
            }
            ctx.timeout(() => {
              B.push({ target, at: WebMidi.time });
              if (st.playing && st.listen === 1) {
                voice(out(), n, 0.7, 0, stepMs * 0.0008);
                if (WebMidi.enabled) WebMidi.outputs.forEach((o) => o.channels[1].playNote(n, { duration: stepMs * 0.8 }));
              }
            }, target - now);
            next += stepMs;
            step++;
          }
          const cut = now - 6000;
          while (A.length && A[0].target < cut) A.shift();
          while (B.length && B[0].target < cut) B.shift();
        }, 25);
        // Optional busy-wait to simulate a janky main thread.
        ctx.interval(() => { if (!st.load) return; const t = performance.now(); while (performance.now() - t < 45) { /* block */ } }, 170);
        const v = view(ctx, ctx.$(".wm-tm > .wm-cv"), () => {});
        ctx.raf(() => {
          const { g, w, h: hh } = v, now = WebMidi.time;
          const span = 3200, t0 = now - span + 400, x = (t) => ((t - t0) / span) * w;
          g.clearRect(0, 0, w, hh);
          const lanes = [["時間戳預排", A, "#06d6a0", true], ["到點才送", B, "#ff8c42", false]];
          const lh = (hh - 30) / 2;
          lanes.forEach(([name, list, c, early], i) => {
            const y0 = 22 + i * lh, mid = y0 + lh / 2;
            g.fillStyle = st.playing && st.listen === i ? "rgba(255,255,255,.06)" : "rgba(255,255,255,.025)";
            g.fillRect(0, y0, w, lh - 6);
            txt(g, `${name}${st.playing && st.listen === i ? "（正在聽）" : ""}`, 10, y0 + 12, c, 12, "left", false, 600);
            for (const r of list) {
              const xt = x(r.target), xa = x(r.at);
              if (xt < -10 || xt > w + 10) continue;
              g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(xt - 0.5, mid - 16, 1, 32);
              const late = r.at - r.target;
              g.strokeStyle = early ? c : late > 8 ? "#ff6b6b" : c;
              g.lineWidth = 2; g.beginPath(); g.moveTo(xa, mid + 8); g.lineTo(xt, mid + 8); g.stroke();
              g.fillStyle = g.strokeStyle; g.beginPath(); g.arc(xa, mid + 8, 3, 0, Math.PI * 2); g.fill();
            }
          });
          g.fillStyle = "#f7df1e"; g.fillRect(x(now), 18, 1.5, hh - 24);
          txt(g, "白線：預定時間　圓點：實際交出訊息的時間（上排在白線左邊＝提前，下排在右邊＝遲到）", 10, hh - 6, "#7d8490", 10.5);
          txt(g, `WebMidi.time ${now.toFixed(0)} ms`, w - 10, 10, "#7d8490", 10.5, "right", true);
        });
        ctx.interval(() => {
          const recent = (list) => list.filter((r) => r.target > WebMidi.time - 3000 && r.target < WebMidi.time);
          const a = recent(A), b = recent(B).map((r) => r.at - r.target);
          const leads = a.map((r) => r.target - r.at);
          ctx.$(".s1").textContent = leads.length ? `${Math.min(...leads).toFixed(1)} ms` : "…";
          ctx.$(".s2").textContent = leads.length ? `${leads.filter((l) => l < 0).length} / ${leads.length}` : "…";
          ctx.$(".s3").textContent = b.length ? `${(b.reduce((s, d) => s + d, 0) / b.length).toFixed(1)} ms` : "…";
          ctx.$(".s4").textContent = b.length ? `${Math.max(...b).toFixed(1)} ms` : "…";
        }, 300);
      },
    },
    // 7 --------------------------------------------------------------------------------------
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "new Message()・Utilities.toNoteNumber・Utilities.buildNote × N",
      desc: "產生 N 筆隨機 MIDI 位元組或音名，量測 WEBMIDI.js 純 JavaScript 解析的吞吐量；Message 解析並換算成 MIDI 1.0 線路上限（31,250 bps，約每秒 1,042 則三位元組訊息）的倍數。",
      hint: "先選要量哪個函式再按「開始測試」；滑鼠停在結果列上可看每秒次數與記憶體變化。",
      mount(ctx) {
        ctx.html(`<div class="wm-bv"><div class="wm-cv" style="position:absolute;inset:0;border:0"></div></div>`);
        ctx.controls.classList.add("bottom");
        const OPS = ["Message 解析", "音名轉編號", "buildNote 建立"];
        const WIRE = 31250 / 10 / 3;
        let op = 0, last = null;
        ctx.group(OPS, 0, (i) => { op = i; });
        // A pool of 4096 inputs is reused; parse cost does not depend on object identity.
        const POOL = 4096;
        const randMsg = () => {
          const r = Math.random();
          if (r < 0.4) return Uint8Array.of(0x90 | (Math.random() * 16) | 0, (Math.random() * 128) | 0, (Math.random() * 128) | 0);
          if (r < 0.65) return Uint8Array.of(0x80 | (Math.random() * 16) | 0, (Math.random() * 128) | 0, 64);
          if (r < 0.85) return Uint8Array.of(0xB0 | (Math.random() * 16) | 0, (Math.random() * 120) | 0, (Math.random() * 128) | 0);
          if (r < 0.93) return Uint8Array.of(0xE0 | (Math.random() * 16) | 0, (Math.random() * 128) | 0, (Math.random() * 128) | 0);
          if (r < 0.97) return Uint8Array.of(0xC0 | (Math.random() * 16) | 0, (Math.random() * 128) | 0);
          return Uint8Array.of(0xF8);
        };
        const NAMES = ["C", "C#", "Db", "D", "D#", "Eb", "E", "F", "F#", "Gb", "G", "G#", "Ab", "A", "A#", "Bb", "B"];
        const randId = () => NAMES[(Math.random() * NAMES.length) | 0] + (((Math.random() * 8) | 0) + 1);
        const v = view(ctx, ctx.$(".wm-bv > .wm-cv"), (v) => {
          const { g, w, h: hh } = v;
          g.clearRect(0, 0, w, hh);
          if (!last) {
            txt(g, "尚未測試：按「開始測試」後，這裡統計最後一輪的結果分布", 14, 20, "#7d8490", 12);
            const demo = [[0x93, 60, 100], [0xB0, 74, 90], [0xE2, 0, 96], [0xC0, 5], [0xF0, 0x7E, 0x7F, 0x06, 0x01, 0xF7], [0xF8]];
            demo.forEach((b, i) => { const m = toMsg(b); txt(g, `new Message([${hexs(b)}]) → ${m.type}${m.channel ? " ch" + m.channel : ""}`, 14, 52 + i * 22, "#a8b0bd", 11.5, "left", true); });
            return;
          }
          const rate = last.n / (last.ms / 1000);
          txt(g, `${last.op}・${fmtCompact(last.n)} 次・${fmtMs(last.ms)}・每秒約 ${fmtCompact(rate)} 次`, 14, 18, "#e8e6e3", 12.5, "left", false, 600);
          txt(g, last.op === OPS[0] ? `約為 MIDI 1.0 線路上限的 ${fmtCompact(rate / WIRE)} 倍・解析結果的 type 分布：` : "解析結果分布：", 14, 40, "#7d8490", 11.5);
          const top = [...last.hist.entries()].sort((a, b) => b[1] - a[1]).slice(0, Math.max(4, Math.floor((hh - 70) / 20)));
          const max = top.length ? top[0][1] : 1, bx = Math.min(150, w * 0.34);
          top.forEach(([k, c], i) => {
            const y = 62 + i * 20, bw = Math.max(2, ((w - bx - 70) * c) / max);
            txt(g, k, bx - 8, y, "#a8b0bd", 11, "right", true);
            g.fillStyle = `hsl(${300 + i * 12} 80% 62%)`;
            g.fillRect(bx, y - 6, bw, 12);
            txt(g, fmtCompact(c), bx + bw + 6, y, "#e8e6e3", 10.5, "left", true);
          });
        });
        ctx.bench({
          label: "解析次數", unit: "次", sizes: [1000, 10000, 100000, 300000, 1000000, 3000000], target: 1000, budget: 3000,
          title: "極限測試：WEBMIDI.js 解析吞吐量",
          note: "計時只含函式呼叫本身（輸入在 prepare 階段先產生，4096 筆循環使用）。Message 會讀出 type、channel 與 dataBytes；buildNote 會建立完整的 Note 物件。",
          prepare: () => Array.from({ length: POOL }, op === 0 ? randMsg : randId),
          run: (n, pool) => {
            const hist = new Map(), name = OPS[op];
            const t = performance.now();
            for (let i = 0; i < n; i++) {
              const x = pool[i & (POOL - 1)];
              let k;
              if (op === 0) { const m = new Message(x); k = m.type; if (m.channel === 0) k = "?"; }
              else if (op === 1) k = String(Utilities.toNoteNumber(x) % 12);
              else k = "八度 " + Utilities.buildNote(x, { attack: 0.5 }).octave;
              hist.set(k, (hist.get(k) || 0) + 1);
            }
            last = { op: name, n, ms: performance.now() - t, hist };
            if (op === 1) last.hist = new Map([...hist].map(([pc, c]) => [Utilities.toNoteIdentifier(+pc + 60).replace(/\d+$/, ""), c]));
            v.draw();
            return `${last.hist.size} 類`;
          },
        });
      },
    },
  ],
});
</script>
