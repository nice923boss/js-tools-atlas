<script type="module">
import * as T from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const { h, fmt, fmtCompact } = Showcase;
const FLOWER = "assets/webxr-samples/sunflower.glb";
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--font").trim() || "sans-serif";
const ONE = new T.Vector3(1, 1, 1);
const SIM_CHIP = "未使用 WebXR：此瀏覽器沒有 inline 工作階段";
const NO_XR_MSG = "此瀏覽器沒有 WebXR inline 工作階段（navigator.xr 不存在或不支援 inline），這個場景需要真實的 XRSession，畫面只顯示靜態場景。";

/* ---------- shared helpers ---------- */
const board = (side, { pair = false, extra = "" } = {}) => `<div class="wx-board">${pair
  ? `<div class="wx-pair"><div class="wx-view" data-p="a"><span class="wx-chip"></span><span class="wx-tag"></span></div><div class="wx-view" data-p="b"><span class="wx-chip"></span><span class="wx-tag"></span></div></div>`
  : `<div class="wx-view"><span class="wx-chip"></span><span class="wx-tag"></span><div class="wx-msg" hidden></div></div>`}<div class="wx-side">${side}</div></div>${extra}`;

const clock = () => new Date().toTimeString().slice(0, 8);
function logTo(box, text, cls = "", max = 40) {
  box.append(h("div", { class: cls }, `${clock()} ${text}`));
  while (box.childElementCount > max) box.firstChild.remove();
}
const v3 = (p, d = 2) => `${fmt(p.x, d)}, ${fmt(p.y, d)}, ${fmt(p.z, d)}`;

function setChip(view, text, sim = false) {
  const chip = view.querySelector(".wx-chip");
  chip.textContent = text;
  chip.classList.toggle("sim", sim);
}
function setTag(view, text, cls = "") {
  const tag = view.querySelector(".wx-tag");
  tag.textContent = text;
  tag.className = `wx-tag ${cls}`;
}
function showMsg(view, text) {
  const m = view.querySelector(".wx-msg");
  if (!m) return;
  m.textContent = text;
  m.hidden = !text;
}

// One renderer per view; its GL context is released when the scene unmounts.
function makeRenderer(ctx, host, { xr = false } = {}) {
  const renderer = new T.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.xr.enabled = xr;
  host.prepend(renderer.domElement);
  const fit = () => { if (!renderer.xr.isPresenting) renderer.setSize(host.clientWidth || 1, host.clientHeight || 1, false); };
  const ro = new ResizeObserver(fit);
  ro.observe(host);
  fit();
  ctx.onCleanup(() => {
    ro.disconnect();
    renderer.setAnimationLoop(null);
    renderer.dispose();
    renderer.forceContextLoss();
  });
  return renderer;
}

async function inlineSupported() {
  if (!navigator.xr) return false;
  try { return await navigator.xr.isSessionSupported("inline"); } catch { return false; }
}

// Drives onFrame from an inline XRSession when the browser offers one, otherwise from window rAF (frame = null).
async function driveInline(ctx, renderer, onFrame, { fov = 50 } = {}) {
  const ok = await inlineSupported();
  await ctx.sleep(0);
  if (!ok) {
    ctx.raf((t) => onFrame(t, null, null));
    return null;
  }
  const session = await navigator.xr.requestSession("inline");
  ctx.onCleanup(() => session.end().catch(() => {}));
  await ctx.sleep(0);
  session.updateRenderState({ baseLayer: new XRWebGLLayer(session, renderer.getContext()), inlineVerticalFieldOfView: T.MathUtils.degToRad(fov) });
  const viewer = await session.requestReferenceSpace("viewer");
  await ctx.sleep(0);
  const xr = { session, viewer, ended: false };
  session.addEventListener("end", () => { xr.ended = true; });
  const loop = (t, frame) => {
    if (!ctx.active || xr.ended) return;
    session.requestAnimationFrame(loop);
    onFrame(t, frame, xr);
  };
  session.requestAnimationFrame(loop);
  return xr;
}

// Copy the XRView projection and transform into a three.js camera (matrixAutoUpdate is off).
function applyView(camera, view) {
  camera.projectionMatrix.fromArray(view.projectionMatrix);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  camera.matrix.fromArray(view.transform.matrix);
  camera.updateMatrixWorld(true);
}
function newCamera() {
  const camera = new T.PerspectiveCamera(50, 1, 0.05, 200);
  camera.matrixAutoUpdate = false;
  return camera;
}
// Place the camera at pos/quat: through an offset of the inline viewer space when XR runs, plain three.js otherwise.
function placeCamera(camera, frame, xr, pos, quat, canvas, fov = 50) {
  if (frame) {
    const space = xr.viewer.getOffsetReferenceSpace(new XRRigidTransform(pos, quat).inverse);
    const pose = frame.getViewerPose(space);
    if (pose) applyView(camera, pose.views[0]);
    return pose;
  }
  camera.fov = fov;
  camera.aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);
  camera.updateProjectionMatrix();
  camera.matrix.compose(pos, quat, ONE);
  camera.updateMatrixWorld(true);
  return null;
}
const lookQuat = (from, to) => new T.Quaternion().setFromRotationMatrix(new T.Matrix4().lookAt(from, to, new T.Vector3(0, 1, 0)));

function gradientSky(stops) {
  const c = document.createElement("canvas");
  c.width = 4; c.height = 256;
  const g = c.getContext("2d"), grad = g.createLinearGradient(0, 0, 0, 256);
  stops.forEach(([o, col]) => grad.addColorStop(o, col));
  g.fillStyle = grad;
  g.fillRect(0, 0, 4, 256);
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  return tex;
}
function canvasTexture(size, paint, repeat = 1) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  paint(c.getContext("2d"), size);
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  tex.wrapS = tex.wrapT = T.RepeatWrapping;
  tex.repeat.set(repeat, repeat);
  tex.anisotropy = 4;
  return tex;
}
function textSprite(text, color = "#e6edf3", height = 0.3) {
  const c = document.createElement("canvas");
  const g = c.getContext("2d");
  const font = `600 40px ${FONT}`;
  g.font = font;
  const w = Math.ceil(g.measureText(text).width) + 28;
  c.width = w; c.height = 60;
  g.font = font;
  g.fillStyle = "rgba(10, 12, 15, .8)";
  g.beginPath(); g.roundRect(0, 0, w, 60, 14); g.fill();
  g.fillStyle = color;
  g.textBaseline = "middle";
  g.fillText(text, 14, 31);
  const tex = new T.CanvasTexture(c);
  tex.colorSpace = T.SRGBColorSpace;
  const s = new T.Sprite(new T.SpriteMaterial({ map: tex, depthWrite: false }));
  s.scale.set((height * w) / 60, height, 1);
  return s;
}
function lights(scene, { sun = 2.4, hemi = 1.3 } = {}) {
  scene.add(new T.HemisphereLight(0xfff0d8, 0x40502c, hemi));
  const d = new T.DirectionalLight(0xffdcae, sun);
  d.position.set(3, 6, 2.5);
  scene.add(d);
  return d;
}
const RAINBOW = [0xf7df1e, 0xff8c42, 0xf72585, 0x7209b7, 0x4cc9f0, 0x7bd389];

let flowerP = null;
function loadFlower() {
  flowerP ??= fetch(FLOWER)
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.arrayBuffer(); })
    .then((buf) => new GLTFLoader().parseAsync(buf, "assets/webxr-samples/"))
    .then((g) => g.scene)
    .catch((e) => { flowerP = null; throw e; });
  return flowerP;
}

/* ---------- scene 1: the sunflower garden (port of the original demo) ---------- */
const SPOTS = [[0, 0, 1.25], [0.62, -0.42, 1.05], [-0.66, -0.3, 1.1], [0.3, 0.58, 0.95], [-0.36, 0.66, 1], [1.12, 0.18, 0.9],
  [-1.15, 0.12, 0.95], [0.82, -1.0, 0.85], [-0.8, -1.02, 0.9], [0.05, -1.25, 0.8], [1.0, 0.9, 0.8], [-1.0, 0.92, 0.85]];

function buildGarden() {
  const scene = new T.Scene();
  const sky = gradientSky([[0, "#1d2850"], [0.45, "#7a5f8c"], [0.75, "#f2a36b"], [1, "#ffd99a"]]);
  const fog = new T.Fog(0xf2b77c, 7, 16);
  scene.background = sky;
  scene.fog = fog;
  scene.add(new T.HemisphereLight(0xfff0d8, 0x40502c, 1.5));
  const sun = new T.DirectionalLight(0xffdcae, 2.8);
  sun.position.set(3, 5, 2.5);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  Object.assign(sun.shadow.camera, { left: -2.4, right: 2.4, top: 2.4, bottom: -2.4, near: 1, far: 14 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  const grass = canvasTexture(256, (g, s) => {
    g.fillStyle = "#5d8a35";
    g.fillRect(0, 0, s, s);
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = `hsla(${88 + Math.random() * 20}, 45%, ${28 + Math.random() * 22}%, .55)`;
      g.fillRect(Math.random() * s, Math.random() * s, 1.5, 3 + Math.random() * 4);
    }
  }, 3);
  // A floating grass island whose top surface is y = 0 (the floor in VR)
  const garden = new T.Group();
  scene.add(garden);
  const island = new T.Mesh(new T.CylinderGeometry(1.7, 1.15, 0.55, 72, 1), [
    new T.MeshStandardMaterial({ color: 0x7a5236, roughness: 1 }),
    new T.MeshStandardMaterial({ map: grass, roughness: 0.95 }),
    new T.MeshStandardMaterial({ color: 0x4a3222, roughness: 1 }),
  ]);
  island.position.y = -0.275;
  island.receiveShadow = true;
  garden.add(island);
  const stones = new T.InstancedMesh(new T.DodecahedronGeometry(0.07, 0), new T.MeshStandardMaterial({ color: 0x9a948a, roughness: 0.9 }), 14);
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2 + Math.sin(i * 3.1) * 0.2, r = 1.55 + Math.sin(i * 1.7) * 0.06;
    stones.setMatrixAt(i, new T.Matrix4().compose(new T.Vector3(Math.cos(a) * r, 0.01, Math.sin(a) * r),
      new T.Quaternion().setFromEuler(new T.Euler(i, i * 2, 0)), new T.Vector3().setScalar(0.7 + (i % 4) * 0.2)));
  }
  stones.castShadow = stones.receiveShadow = true;
  garden.add(stones);
  return { scene, garden, sky, fog };
}

async function mountGarden(ctx) {
  ctx.html(board(`
    <h4>這台裝置的支援度 <span>isSessionSupported</span></h4>
    <div class="wx-sup">
      <div><code>navigator.xr</code><b class="wx-pill" data-s="api">檢查中</b></div>
      <div><code>inline</code><b class="wx-pill" data-s="inline">檢查中</b></div>
      <div><code>immersive-vr</code><b class="wx-pill" data-s="vr">檢查中</b></div>
      <div><code>immersive-ar</code><b class="wx-pill" data-s="ar">檢查中</b></div>
    </div>
    <div class="wx-btns">
      <button class="btn primary" type="button" data-x="vr" disabled>🥽 進入 VR<small>檢查中</small></button>
      <button class="btn primary" type="button" data-x="ar" disabled>📱 進入 AR<small>檢查中</small></button>
    </div>
    <p class="wx-note"></p>
    <p class="wx-credit wx-wide">向日葵模型：<a href="https://github.com/immersive-web/webxr-samples/tree/main/media/gltf/sunflower" target="_blank" rel="noopener">Sunflower</a>，Poly by Google（CC-BY 3.0），與官方 Hit Test 範例同一個模型</p>`,
  { extra: `<div class="wx-ar"><p>對準地面，看到黃色圓圈後點一下螢幕</p><button class="btn" type="button">結束 AR</button></div>` }));
  const view = ctx.$(".wx-view");
  view.classList.add("grab");
  const pill = (k, cls, text) => { const p = ctx.$(`[data-s="${k}"]`); p.className = `wx-pill ${cls}`; p.textContent = text; };
  const btn = (k, ok, label) => { const b = ctx.$(`[data-x="${k}"]`); b.disabled = !ok; b.querySelector("small").textContent = label; };
  const note = ctx.$(".wx-note");
  const overlay = ctx.$(".wx-ar");

  const renderer = makeRenderer(ctx, view, { xr: true });
  renderer.shadowMap.enabled = true;
  const canvas = renderer.domElement;
  const { scene, garden, sky, fog } = buildGarden();
  const camera = newCamera();
  scene.add(camera);
  const flowers = [];
  let proto = null;
  const st = ctx.status("載入向日葵模型…");
  loadFlower().then((p) => {
    if (!ctx.active) return;
    proto = p;
    SPOTS.forEach(([x, z, s], i) => {
      const f = p.clone();
      f.traverse((o) => { if (o.isMesh) o.castShadow = true; });
      f.position.set(x, 0, z);
      f.scale.setScalar(s * 1.15);
      f.rotation.y = Math.atan2(x, z) * 0.35 + Math.sin(i * 2.3) * 0.35;
      f.userData.phase = i * 1.37;
      garden.add(f);
      flowers.push(f);
    });
    st.done();
  }, (err) => { console.error(err); st.error("向日葵模型載入失敗"); });

  // Orbit: drag to look around, wheel to zoom; idle for 4 s and it slowly turns again
  const orbit = { yaw: 0.35, pitch: 0.38, dist: 4.5, auto: true, idleAt: 0 };
  const target = new T.Vector3(0, 0.3, 0), camPos = new T.Vector3();
  let camQuat = new T.Quaternion(), drag = null;
  const orbitPose = () => {
    const cp = Math.cos(orbit.pitch);
    camPos.set(Math.sin(orbit.yaw) * cp, Math.sin(orbit.pitch), Math.cos(orbit.yaw) * cp).multiplyScalar(orbit.dist).add(target);
    camQuat = lookQuat(camPos, target);
  };
  ctx.on(canvas, "pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; orbit.auto = false; canvas.setPointerCapture(e.pointerId); });
  ctx.on(canvas, "pointermove", (e) => {
    if (!drag) return;
    orbit.yaw -= (e.clientX - drag.x) * 0.008;
    orbit.pitch = T.MathUtils.clamp(orbit.pitch + (e.clientY - drag.y) * 0.006, 0.05, 1.25);
    drag = { x: e.clientX, y: e.clientY };
  });
  const endDrag = () => { if (drag) { drag = null; orbit.idleAt = performance.now(); } };
  ctx.on(canvas, "pointerup", endDrag);
  ctx.on(canvas, "pointercancel", endDrag);
  ctx.on(canvas, "wheel", (e) => { e.preventDefault(); orbit.dist = T.MathUtils.clamp(orbit.dist * Math.exp(e.deltaY * 0.001), 2.2, 7); }, { passive: false });

  let lastT = 0;
  const animate = (t) => {
    const dt = Math.min((t - lastT) / 1000, 0.1);
    lastT = t;
    if (!orbit.auto && !drag && performance.now() - orbit.idleAt > 4000) orbit.auto = true;
    if (orbit.auto) orbit.yaw += dt * 0.12;
    const s = t / 1000;
    for (const f of flowers) {
      f.rotation.z = Math.sin(s * 1.1 + f.userData.phase) * 0.045;
      f.rotation.x = Math.sin(s * 0.8 + f.userData.phase * 1.7) * 0.03;
    }
  };
  const inlineFrame = (t, frame, xr) => {
    if (renderer.xr.isPresenting) return;
    animate(t);
    orbitPose();
    placeCamera(camera, frame, xr, camPos, camQuat, canvas);
    renderer.render(scene, camera);
  };

  // Support detection: only modes reported as supported are ever requested
  const sup = { inline: false, vr: false, ar: false };
  if (navigator.xr) {
    pill("api", "yes", "有");
    const ask = (m) => navigator.xr.isSessionSupported(m).catch(() => false);
    [sup.inline, sup.vr, sup.ar] = await Promise.all([ask("inline"), ask("immersive-vr"), ask("immersive-ar")]);
    await ctx.sleep(0);
    pill("inline", sup.inline ? "yes" : "no", sup.inline ? "支援" : "不支援");
    pill("vr", sup.vr ? "yes" : "no", sup.vr ? "支援" : "不支援");
    pill("ar", sup.ar ? "yes" : "no", sup.ar ? "支援" : "不支援");
    btn("vr", sup.vr, sup.vr ? "頭戴裝置" : "此裝置不支援");
    btn("ar", sup.ar, sup.ar ? "命中測試放花" : "此裝置不支援");
    if (!sup.vr && !sup.ar) note.textContent = "這台裝置沒有 XR 執行環境，沉浸模式按鈕停用。用 Meta Quest 等頭戴裝置的瀏覽器可進入 VR；支援 ARCore 的 Android Chrome 可進入 AR，在地面點一下放置向日葵。";
  } else {
    for (const k of ["api", "inline", "vr", "ar"]) pill(k, "no", k === "api" ? "沒有" : "無法使用");
    btn("vr", false, "此瀏覽器不支援");
    btn("ar", false, "此瀏覽器不支援");
    note.textContent = isSecureContext ? "這個瀏覽器沒有 WebXR Device API（navigator.xr）。" : "WebXR 只能在 HTTPS 安全連線下使用。";
  }
  let inline = await driveInline(ctx, renderer, inlineFrame);
  const chip = () => {
    if (renderer.xr.isPresenting) setChip(view, xrMode === "ar" ? "immersive-ar 工作階段（命中測試）" : "immersive-vr 工作階段");
    else if (inline && !inline.ended) setChip(view, "inline 工作階段・滑鼠拖曳模擬視角");
    else setChip(view, SIM_CHIP, true);
  };
  chip();

  // Immersive sessions: VR places the garden life-size on the floor, AR hit-tests real surfaces
  let xrMode = null, hitSource = null;
  const reticle = new T.Mesh(new T.RingGeometry(0.07, 0.095, 40).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color: 0xf7df1e }));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);
  const placed = new T.Group();
  scene.add(placed);
  const controller = renderer.xr.getController(0);
  controller.addEventListener("select", () => {
    if (xrMode !== "ar" || !reticle.visible || !proto) return;
    const f = proto.clone();
    reticle.matrix.decompose(f.position, f.quaternion, f.scale);
    f.scale.setScalar(0.6);
    f.userData.phase = placed.children.length;
    placed.add(f);
    flowers.push(f);
  });
  scene.add(controller);
  const immersiveFrame = (t, frame) => {
    animate(t);
    if (xrMode === "ar" && hitSource && frame) {
      const hits = frame.getHitTestResults(hitSource);
      const pose = hits.length ? hits[0].getPose(renderer.xr.getReferenceSpace()) : null;
      reticle.visible = !!pose;
      if (pose) reticle.matrix.fromArray(pose.transform.matrix);
    }
    renderer.render(scene, camera);
  };
  const onEnd = async () => {
    hitSource?.cancel?.();
    hitSource = null;
    xrMode = null;
    renderer.setAnimationLoop(null);
    reticle.visible = false;
    for (const f of placed.children) flowers.splice(flowers.indexOf(f), 1);
    placed.clear();
    Object.assign(garden, { visible: true });
    garden.position.set(0, 0, 0);
    garden.scale.setScalar(1);
    scene.background = sky;
    scene.fog = fog;
    overlay.classList.remove("on");
    if (ctx.active && sup.inline && (!inline || inline.ended)) inline = await driveInline(ctx, renderer, inlineFrame);
    chip();
  };
  async function enterXR(kind) {
    const isAR = kind === "ar";
    const mode = isAR ? "immersive-ar" : "immersive-vr";
    const init = isAR
      ? { requiredFeatures: ["hit-test"], optionalFeatures: ["dom-overlay"], domOverlay: { root: overlay } }
      : { optionalFeatures: ["local-floor", "bounded-floor"] };
    let session;
    try {
      session = await navigator.xr.requestSession(mode, init);
    } catch (err) {
      // Some runtimes allow one session at a time, inline included
      if (err.name !== "InvalidStateError" || !inline || inline.ended) throw err;
      await inline.session.end();
      session = await navigator.xr.requestSession(mode, init);
    }
    ctx.onCleanup(() => session.end().catch(() => {}));
    xrMode = kind;
    session.addEventListener("end", onEnd);
    if (isAR) {
      garden.visible = false;
      scene.background = null;
      scene.fog = null;
      overlay.classList.add("on");
    } else {
      garden.position.set(0, 0, -3.4);
      garden.scale.setScalar(1.6);
      scene.background = fog.color;
    }
    renderer.xr.setReferenceSpaceType(isAR ? "local" : "local-floor");
    renderer.setAnimationLoop(immersiveFrame);
    await renderer.xr.setSession(session);
    if (isAR) hitSource = await session.requestHitTestSource({ space: await session.requestReferenceSpace("viewer") });
    chip();
  }
  for (const k of ["vr", "ar"]) {
    ctx.on(ctx.$(`[data-x="${k}"]`), "click", () => enterXR(k).catch((err) => {
      console.warn(`immersive-${k} failed`, err);
      note.textContent = `無法進入沉浸模式：${err?.message || err}`;
      onEnd();
    }));
  }
  const exit = overlay.querySelector("button");
  ctx.on(exit, "beforexrselect", (e) => e.preventDefault());
  ctx.on(exit, "click", () => renderer.xr.getSession()?.end());
}

  ["核心 Device API", "", ["XRSession", "XRFrame", "XRReferenceSpace", "XRView", "XRWebGLLayer", "XRRigidTransform"]],
  ["AR 模組", "immersive-ar", ["XRSession.environmentBlendMode", "XRSession.interactionMode"]],
  ["命中測試", "hit-test", ["XRHitTestSource", "XRTransientInputHitTestSource", "XRRay"]],
  ["錨點", "anchors", ["XRAnchor", "XRAnchorSet"]],
  ["DOM 覆蓋層", "dom-overlay", ["XRDOMOverlayState", "XRSession.domOverlayState"]],
  ["手部追蹤", "hand-tracking", ["XRHand", "XRJointSpace", "XRJointPose"]],
  ["合成圖層", "layers", ["XRWebGLBinding", "XRProjectionLayer", "XRQuadLayer", "XRCylinderLayer", "XRCubeLayer"]],
  ["深度感測", "depth-sensing", ["XRDepthInformation", "XRCPUDepthInformation", "XRWebGLDepthInformation"]],
  ["光照估計", "light-estimation", ["XRLightProbe", "XRLightEstimate"]],
  ["相機影像", "camera-access", ["XRCamera"]],
  ["平面偵測", "plane-detection", ["XRPlane"]],
  ["網格偵測", "mesh-detection", ["XRMesh"]],
  ["圖片追蹤", "image-tracking", ["XRImageTrackingResult"]],
  ["遊戲手把", "", ["XRInputSource.gamepad"]],
];
const hasIface = (name) => {
  const [cls, prop] = name.split(".");
  const C = window[cls];
  return typeof C === "function" && (!prop || prop in C.prototype);
};

async function mountDetect(ctx) {
  ctx.html(`<div class="wx-det">
    <div class="wx-modes"></div>
    <div class="wx-sum"></div>
    <div class="wx-env"></div>
    <h4>功能模組（介面是否存在）<span>"XRHand" in window</span></h4>
    <div class="wx-mods"></div>
  </div>`);
  const modesEl = ctx.$(".wx-modes"), envEl = ctx.$(".wx-env"), modsEl = ctx.$(".wx-mods"), sumEl = ctx.$(".wx-sum");
  let runId = 0, changes = 0;

  const card = (title, pillCls, pillText, rows) => `<div class="wx-card"><h5>${title}<b class="wx-pill ${pillCls}">${pillText}</b></h5>
    <div class="wx-kv">${rows.map(([k, v, zh]) => `<span>${k}</span><b class="${zh ? "zh" : ""}">${v}</b>`).join("")}</div></div>`;

  async function run() {
    const id = ++runId;
    const modes = [["inline", "內嵌於網頁"], ["immersive-vr", "沉浸式 VR"], ["immersive-ar", "沉浸式 AR"]];
    const res = {};
    if (navigator.xr) {
      for (const [m] of modes) res[m] = await navigator.xr.isSessionSupported(m).catch((e) => e.name);
    }
    await ctx.sleep(0);
    if (id !== runId) return;
    modesEl.innerHTML = modes.map(([m, zh]) => {
      const v = res[m];
      const cls = v === true ? "yes" : "no";
      const text = !navigator.xr ? "無 navigator.xr" : v === true ? "支援" : v === false ? "不支援" : v;
      return `<div class="wx-mode ${cls}"><code>${m}</code><span>${zh}</span><b class="wx-pill ${cls}">${text}</b></div>`;
    }).join("");
    const immersive = res["immersive-vr"] === true || res["immersive-ar"] === true;
    sumEl.textContent = !navigator.xr
      ? "此瀏覽器沒有 navigator.xr，WebXR 完全無法使用。"
      : immersive
        ? "這台裝置可以開沉浸式工作階段，下方標「已實作」的模組可在 requestSession 的 requiredFeatures／optionalFeatures 中申請。"
        : "這台裝置只能開 inline 工作階段。下方模組即使瀏覽器已實作介面，也要等沉浸式工作階段才能啟用；介面存在不等於裝置支援。";

    // Environment: secure context, permissions policy, WebGL XR compatibility, a real inline session
    const policy = document.permissionsPolicy?.allowsFeature?.("xr-spatial-tracking") ?? document.featurePolicy?.allowsFeature?.("xr-spatial-tracking");
    let mxc = "未測";
    {
      const c = document.createElement("canvas");
      const gl = c.getContext("webgl2", { xrCompatible: true });
      if (gl && gl.makeXRCompatible) {
        mxc = await gl.makeXRCompatible().then(() => "成功", (e) => `${e.name}`);
      }
      gl?.getExtension("WEBGL_lose_context")?.loseContext();
    }
    let sess = null;
    if (res.inline === true) {
      const t0 = performance.now();
      const s = await navigator.xr.requestSession("inline");
      const ms = performance.now() - t0;
      const rs = s.renderState;
      sess = [["requestSession 耗時", `${fmt(ms, 1)} ms`], ["enabledFeatures", (s.enabledFeatures || []).join(", ") || "無"],
        ["environmentBlendMode", s.environmentBlendMode], ["interactionMode", s.interactionMode ?? "無"], ["visibilityState", s.visibilityState],
        ["inputSources", s.inputSources.length], ["預設 depthNear／Far", `${rs.depthNear} ／ ${rs.depthFar}`],
        ["預設視角", `${fmt(T.MathUtils.radToDeg(rs.inlineVerticalFieldOfView), 0)}°`]];
      await s.end();
    }
    await ctx.sleep(0);
    if (id !== runId) return;
    envEl.innerHTML = card("執行環境", isSecureContext ? "yes" : "no", isSecureContext ? "安全連線" : "非 HTTPS", [
      ["isSecureContext", String(isSecureContext)],
      ["xr-spatial-tracking 權限政策", policy == null ? "無法查詢" : policy ? "允許" : "封鎖", true],
      ["gl.makeXRCompatible()", mxc, mxc === "成功" || mxc === "未測"],
      ["devicechange 事件", `${changes} 次`, true],
    ]) + (sess
      ? card("實際開一個 inline 工作階段", "yes", "成功", sess)
      : card("inline 工作階段", "no", "無法建立", [["原因", navigator.xr ? "isSessionSupported 回傳 false" : "沒有 navigator.xr", true]]));

    modsEl.innerHTML = MODULES.map(([zh, feat, names]) => {
      const got = names.filter(hasIface).length;
      const cls = got === names.length ? "yes" : got ? "part" : "no";
      const text = got === names.length ? "已實作" : got ? "部分" : "未實作";
      return `<div class="wx-mod ${cls}"><header>${zh}<b class="wx-pill ${cls}">${text} ${got}/${names.length}</b></header>
        ${feat ? `<small>"${feat}"</small>` : ""}<code>${names.map((n) => hasIface(n) ? `<i>${n}</i>` : `<s>${n}</s>`).join(" ")}</code></div>`;
    }).join("");
  }
  ctx.button("重新偵測", () => run());
  if (navigator.xr) ctx.on(navigator.xr, "devicechange", () => { changes++; run(); });
  await run();
}

/* ---------- scene 3: reference spaces and teleport ---------- */
const RS_TYPES = ["viewer", "local", "local-floor", "bounded-floor", "unbounded"];
const EYE = 1.6;
const TOUR = [[0, 4], [3.5, 1.5], [3, -3], [-1, -4.5], [-4, -1], [-2.5, 3]];

function buildPlaza() {
  const scene = new T.Scene();
  scene.background = gradientSky([[0, "#10233f"], [0.55, "#3d6ea8"], [1, "#9fd0e8"]]);
  scene.fog = new T.Fog(0x9fd0e8, 14, 34);
  lights(scene);
  const tiles = canvasTexture(256, (g, s) => {
    for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) {
      g.fillStyle = (x + y) % 2 ? "#3a4a5c" : "#46586c";
      g.fillRect((x * s) / 4, (y * s) / 4, s / 4, s / 4);
    }
    g.strokeStyle = "rgba(255,255,255,.12)";
    g.lineWidth = 2;
    g.strokeRect(0, 0, s, s);
  }, 20);
  const floor = new T.Mesh(new T.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({ map: tiles, roughness: 0.9 }));
  scene.add(floor);
  const fountain = new T.Group();
  fountain.add(new T.Mesh(new T.CylinderGeometry(1.3, 1.4, 0.4, 48), new T.MeshStandardMaterial({ color: 0xc9c2b5, roughness: 0.7 })));
  const water = new T.Mesh(new T.CylinderGeometry(1.15, 1.15, 0.05, 48), new T.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.15, metalness: 0.2 }));
  water.position.y = 0.2;
  fountain.add(water);
  const spout = new T.Mesh(new T.TorusKnotGeometry(0.28, 0.08, 120, 12), new T.MeshStandardMaterial({ color: 0xf7df1e, roughness: 0.3, metalness: 0.3 }));
  spout.position.y = 0.95;
  fountain.add(spout);
  fountain.position.y = 0.2;
  scene.add(fountain);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    const p = new T.Mesh(new T.CylinderGeometry(0.22, 0.26, 2.6, 20), new T.MeshStandardMaterial({ color: RAINBOW[i % 6], roughness: 0.5 }));
    p.position.set(Math.cos(a) * 7.5, 1.3, Math.sin(a) * 7.5);
    scene.add(p);
  }
  const treeMat = new T.MeshStandardMaterial({ color: 0x2f7d4a, roughness: 0.8 });
  for (let i = 0; i < 18; i++) {
    const a = i * 2.39996, r = 10 + (i % 5) * 1.6;
    const tree = new T.Mesh(new T.ConeGeometry(0.7, 2.4 + (i % 3) * 0.6, 10), treeMat);
    tree.position.set(Math.cos(a) * r, 1.3, Math.sin(a) * r);
    scene.add(tree);
  }
  return { scene, floor, spout };
}

async function mountSpace(ctx) {
  ctx.html(board(`
    <h4>參考空間類型 <span>requestReferenceSpace()</span></h4>
    <div class="wx-sup wx-rs">${RS_TYPES.map((t) => `<div><code>${t}</code><b class="wx-pill" data-rs="${t}">檢查中</b></div>`).join("")}</div>
    <h4>viewer 姿態 <span>getViewerPose(refSpace)</span></h4>
    <div class="wx-kv">
      <span>位置 x, y, z</span><b data-k="pos">-</b>
      <span>朝向（偏航）</span><b data-k="yaw">-</b>
      <span>偏移串接次數</span><b data-k="chain">0</b>
    </div>
    <h4 class="wx-wide">最近一次偏移 <span>XRRigidTransform</span></h4>
    <pre class="wx-code wx-wide" data-k="code">尚未瞬移</pre>
    <p class="wx-wide">inline 工作階段只保證 viewer；local-floor 等類型要在沉浸式工作階段的 features 中申請，且需裝置追蹤。</p>`));
  const view = ctx.$(".wx-view");
  view.classList.add("aim");
  const out = (k) => ctx.$(`[data-k="${k}"]`);
  const renderer = makeRenderer(ctx, view);
  const canvas = renderer.domElement;
  const { scene, floor, spout } = buildPlaza();
  const camera = newCamera();
  const marker = new T.Mesh(new T.RingGeometry(0.28, 0.38, 40).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color: 0xf7df1e, transparent: true, opacity: 0.9 }));
  marker.position.y = 0.02;
  marker.visible = false;
  scene.add(marker);
  const trail = Array.from({ length: 6 }, (_, i) => {
    const d = new T.Mesh(new T.CircleGeometry(0.22, 24).rotateX(-Math.PI / 2), new T.MeshBasicMaterial({ color: 0x4cc9f0, transparent: true, opacity: 0.75 - i * 0.11 }));
    d.position.y = 0.015;
    d.visible = false;
    scene.add(d);
    return d;
  });
  const steps = [];

  let ref = null, preview = null, chain = 0, pose = null, auto = true, idleAt = 0, tourI = 0, nextTour = 0, drag = null;
  const ndc = new T.Vector2(), ray = new T.Raycaster();
  const eul = new T.Euler();
  const viewerYaw = (q) => eul.setFromQuaternion(new T.Quaternion(q.x, q.y, q.z, q.w), "YXZ").y;

  const offset = (pos, quat = { x: 0, y: 0, z: 0, w: 1 }, label) => {
    ref = ref.getOffsetReferenceSpace(new XRRigidTransform(pos, quat));
    chain++;
    out("chain").textContent = chain;
    out("code").innerHTML = `refSpace = refSpace.<em>getOffsetReferenceSpace</em>(\n  new XRRigidTransform(\n    { x: ${fmt(pos.x, 2)}, y: ${fmt(pos.y, 2)}, z: ${fmt(pos.z, 2)} },\n    { x: 0, y: ${fmt(quat.y, 3)}, z: 0, w: ${fmt(quat.w, 3)} }))\n// ${label}`;
  };
  // Teleport: the new space is the old one shifted by (viewer - target), so the viewer lands on target
  const teleport = (x, z) => {
    if (!pose) return;
    const v = pose.transform.position;
    steps.unshift([v.x, v.z]);
    steps.length = Math.min(steps.length, trail.length);
    offset({ x: v.x - x, y: 0, z: v.z - z }, undefined, `瞬移到 (${fmt(x, 1)}, ${fmt(z, 1)})`);
  };
  // Turn around the viewer: T = Tr(V) * R * Tr(-V); poses in the new space are T^-1 * old
  const turnTransform = (angle) => {
    const v = pose.transform.position;
    const q = new T.Quaternion().setFromAxisAngle(new T.Vector3(0, 1, 0), -angle);
    const vp = new T.Vector3(v.x, 0, v.z);
    const p = vp.clone().sub(vp.clone().applyQuaternion(q));
    return [{ x: p.x, y: 0, z: p.z }, { x: 0, y: q.y, z: 0, w: q.w }];
  };
  const turn = (angle) => { if (pose && Math.abs(angle) > 1e-3) { const [p, q] = turnTransform(angle); offset(p, q, `轉向 ${fmt(T.MathUtils.radToDeg(angle), 0)}°`); } };

  const setNdc = (e) => {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  };
  const floorHit = () => {
    ray.setFromCamera(ndc, camera);
    return ray.intersectObject(floor)[0]?.point || null;
  };
  ctx.on(canvas, "pointerdown", (e) => { drag = { x: e.clientX, moved: 0 }; auto = false; canvas.setPointerCapture(e.pointerId); });
  ctx.on(canvas, "pointermove", (e) => {
    setNdc(e);
    if (!drag) return;
    drag.moved = Math.max(drag.moved, Math.abs(e.clientX - drag.x));
    if (pose && drag.moved > 4) {
      const [p, q] = turnTransform((e.clientX - drag.x) * 0.006);
      preview = ref.getOffsetReferenceSpace(new XRRigidTransform(p, q));
      preview.angle = (e.clientX - drag.x) * 0.006;
    }
  });
  ctx.on(canvas, "pointerup", (e) => {
    if (!drag) return;
    if (drag.moved > 4 && preview) { turn(preview.angle); } else { setNdc(e); const p = floorHit(); if (p) teleport(p.x, p.z); }
    preview = null;
    drag = null;
    idleAt = performance.now();
  });
  ctx.on(canvas, "pointerleave", () => { marker.visible = false; });

  const xr = await driveInline(ctx, renderer, (t, frame, x) => {
    spout.rotation.y = t / 1600;
    if (!frame) {
      placeCamera(camera, null, null, new T.Vector3(0, EYE, 6), lookQuat(new T.Vector3(0, EYE, 6), new T.Vector3(0, 1, 0)), canvas, 60);
      renderer.render(scene, camera);
      return;
    }
    ref ??= x.viewer.getOffsetReferenceSpace(new XRRigidTransform({ x: 0, y: -EYE, z: -6 }));
    pose = frame.getViewerPose(preview || ref);
    if (!pose) return;
    applyView(camera, pose.views[0]);
    if (!auto && !drag && performance.now() - idleAt > 5000) auto = true;
    if (auto && t > nextTour) {
      // Tour: teleport to the next waypoint, then turn to face the fountain
      const [tx, tz] = TOUR[tourI++ % TOUR.length];
      if (nextTour) {
        teleport(tx, tz);
        const facing = viewerYaw(pose.transform.orientation);
        const want = Math.atan2(-tx, -tz) + Math.PI;
        turn(Math.atan2(Math.sin(want - facing), Math.cos(want - facing)));
      }
      nextTour = t + 2200;
    }
    const p = !drag && !auto ? floorHit() : null;
    marker.visible = !!p;
    if (p) marker.position.set(p.x, 0.02, p.z);
    trail.forEach((d, i) => { d.visible = i < steps.length; if (d.visible) d.position.set(steps[i][0], 0.015, steps[i][1]); });
    const pos = pose.transform.position;
    out("pos").textContent = v3(pos);
    out("yaw").textContent = `${fmt(T.MathUtils.radToDeg(viewerYaw(pose.transform.orientation)), 0)}°`;
    renderer.render(scene, camera);
  }, { fov: 60 });

  if (!xr) {
    setChip(view, SIM_CHIP, true);
    showMsg(view, NO_XR_MSG);
    for (const t of RS_TYPES) { const p = ctx.$(`[data-rs="${t}"]`); p.className = "wx-pill no"; p.textContent = "無工作階段"; }
    return;
  }
  setChip(view, "inline 工作階段・點地面瞬移、左右拖曳轉向");
  setTag(view, "自動巡遊中");
  ctx.interval(() => setTag(view, auto ? "自動巡遊中" : "手動操作", auto ? "" : "on"), 400);
  for (const t of RS_TYPES) {
    const r = await xr.session.requestReferenceSpace(t).then(() => true, (e) => e.name);
    await ctx.sleep(0);
    const p = ctx.$(`[data-rs="${t}"]`);
    p.className = `wx-pill ${r === true ? "yes" : "no"}`;
    p.textContent = r === true ? "可用" : r;
  }
  ctx.button("重設位置", () => {
    ref = xr.viewer.getOffsetReferenceSpace(new XRRigidTransform({ x: 0, y: -EYE, z: -6 }));
    chain = 0;
    steps.length = 0;
    out("chain").textContent = "0";
    out("code").textContent = "已重設為初始偏移";
  });
}

/* ---------- scene 4: projection and renderState ---------- */
async function mountView(ctx) {
  ctx.html(board(`
    <h4>view.projectionMatrix <span>由瀏覽器產生</span></h4>
    <div class="wx-mat">${Array.from({ length: 16 }, () => "<b>0</b>").join("")}</div>
    <h4>從矩陣反推 <span>renderState</span></h4>
    <div class="wx-kv">
      <span>垂直視角</span><b data-k="fov">-</b>
      <span>寬高比</span><b data-k="aspect">-</b>
      <span>depthNear</span><b data-k="near">-</b>
      <span>depthFar</span><b data-k="far">-</b>
      <span>viewport</span><b data-k="vp">-</b>
      <span>views／eye</span><b data-k="eye">-</b>
    </div>
    <p class="wx-wide">updateRenderState() 在下一格生效；矩陣以直行優先存放，反白的四格決定視角與裁切平面。</p>
    <p class="wx-note wx-wide">實測：Chrome 只在輸出畫布尺寸改變時重算 inline 投影矩陣，所以每次更新後把畫布的 CSS 寬度加減 1 px 觸發重算。</p>`));
  const view = ctx.$(".wx-view");
  const out = (k) => ctx.$(`[data-k="${k}"]`);
  const cells = ctx.$$(".wx-mat b");
  [0, 5, 10, 14].forEach((i) => cells[i].classList.add("hot"));
  const st = { fov: 60, near: 0.1, far: 80, auto: true };
  const fovIn = ctx.slider("視角", { min: 20, max: 140, step: 1, value: st.fov, format: (v) => `${v}°` }, (v) => { st.fov = v; st.auto = false; push(); });
  const nearIn = ctx.slider("depthNear", { min: 0.05, max: 4, step: 0.05, value: st.near, format: (v) => `${fmt(v, 2)} m` }, (v) => { st.near = v; st.auto = false; push(); });
  const farIn = ctx.slider("depthFar", { min: 3, max: 80, step: 1, value: st.far, format: (v) => `${v} m` }, (v) => { st.far = v; st.auto = false; push(); });
  const syncSlider = (input, v, text) => { input.value = v; input.nextElementSibling.textContent = text; };

  const renderer = makeRenderer(ctx, view);
  const canvas = renderer.domElement;
  const scene = new T.Scene();
  scene.background = gradientSky([[0, "#0b1020"], [0.6, "#1b2a4a"], [1, "#30466e"]]);
  lights(scene, { sun: 2, hemi: 1.1 });
  const floor = new T.Mesh(new T.PlaneGeometry(14, 160).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({
    map: canvasTexture(128, (g, s) => { g.fillStyle = "#1c2433"; g.fillRect(0, 0, s, s); g.fillStyle = "#2a3850"; g.fillRect(0, 0, s, 6); g.fillRect(s / 2 - 3, 0, 6, s); }, 1),
    roughness: 0.95,
  }));
  floor.material.map.repeat.set(4, 46);
  floor.position.z = -76;
  scene.add(floor);
  const pillars = [];
  const pg = new T.BoxGeometry(0.5, 3, 0.5);
  for (let k = 0; k < 22; k++) {
    const z = -3 - k * 3.2;
    const col = new T.Color().setHSL(0.13 - k * 0.04, 0.85, 0.55);
    for (const x of [-2.6, 2.6]) {
      const m = new T.Mesh(pg, new T.MeshStandardMaterial({ color: col, roughness: 0.5 }));
      m.position.set(x, 1.5, z);
      scene.add(m);
      pillars.push(m);
    }
    if (k % 3 === 0) {
      const s = textSprite(`${fmt(-z, 0)} m`, "#f7df1e", 0.42);
      s.position.set(0, 0.35, z);
      scene.add(s);
    }
  }
  const near = new T.Mesh(new T.TorusKnotGeometry(0.09, 0.03, 80, 10), new T.MeshStandardMaterial({ color: 0x4cc9f0, roughness: 0.3, metalness: 0.4 }));
  near.position.set(0.32, 1.42, -0.7);
  scene.add(near);
  const camera = newCamera();
  const camPos = new T.Vector3(0, 1.6, 0), camQuat = lookQuat(camPos, new T.Vector3(0, 0.9, -12));

  let xr = null;
  function push() {
    st.far = Math.max(st.far, st.near + 0.5);
    if (!xr) return;
    xr.session.updateRenderState({ inlineVerticalFieldOfView: T.MathUtils.degToRad(st.fov), depthNear: st.near, depthFar: st.far });
    // Chrome caches the inline projection until the output canvas is resized, so nudge its CSS width by 1 px
    canvas.style.width = canvas.style.width ? "" : "calc(100% - 1px)";
  }
  xr = await driveInline(ctx, renderer, (t, frame, x) => {
    near.rotation.y = t / 700;
    if (st.auto) {
      const s = t / 1000;
      st.fov = Math.round(78 + Math.sin(s * 0.6) * 42);
      st.far = Math.round(44 + Math.sin(s * 0.37 + 1) * 36);
      st.near = 0.1;
      syncSlider(fovIn, st.fov, `${st.fov}°`);
      syncSlider(farIn, st.far, `${st.far} m`);
      syncSlider(nearIn, st.near, `${fmt(st.near, 2)} m`);
      push();
    }
    if (!frame) {
      camera.near = st.near; camera.far = st.far;
      placeCamera(camera, null, null, camPos, camQuat, canvas, st.fov);
      renderer.render(scene, camera);
      return;
    }
    const pose = placeCamera(camera, frame, x, camPos, camQuat, canvas);
    if (!pose) return;
    const v = pose.views[0], m = v.projectionMatrix;
    renderer.render(scene, camera);
    m.forEach((val, i) => { cells[i].textContent = fmt(val, Math.abs(val) >= 100 ? 0 : 3); });
    const n = m[14] / (m[10] - 1), f = m[14] / (m[10] + 1);
    out("fov").textContent = `${fmt(T.MathUtils.radToDeg(2 * Math.atan(1 / m[5])), 1)}°`;
    out("aspect").textContent = fmt(m[5] / m[0], 3);
    out("near").textContent = `${fmt(n, 2)} m`;
    out("far").textContent = `${fmt(f, 1)} m`;
    const vp = x.session.renderState.baseLayer.getViewport(v);
    out("vp").textContent = `${vp.x}, ${vp.y}, ${vp.width}×${vp.height}`;
    out("eye").textContent = `${pose.views.length}／${v.eye}`;
    const clipped = pillars.filter((p) => -p.position.z + 0.25 > f || -p.position.z - 0.25 < n).length / 2;
    setTag(view, clipped ? `depthFar 裁掉 ${fmt(clipped, 0)} 排柱子` : "全部柱子在可見範圍", clipped ? "warn" : "on");
  }, { fov: st.fov });
  if (!xr) {
    setChip(view, SIM_CHIP, true);
    showMsg(view, "此瀏覽器沒有 WebXR inline 工作階段，投影改由 three.js 計算（不是 XRView），右側矩陣不會更新。");
    return;
  }
  setChip(view, "inline 工作階段・固定視角");
  ctx.button("自動示範", () => { st.auto = true; });
}

/* ---------- scene 5: input sources and XRRay ---------- */
async function mountInput(ctx) {
  ctx.html(board(`
    <h4>session.inputSources <span>真實輸入</span></h4>
    <div class="wx-kv" data-k="src"><span>數量</span><b>-</b></div>
    <h4>滑鼠模擬的 target-ray <span>new XRRay()</span></h4>
    <div class="wx-kv">
      <span>origin</span><b data-k="o">-</b>
      <span>direction</span><b data-k="d">-</b>
      <span>命中</span><b class="zh" data-k="hit">-</b>
      <span>距離</span><b data-k="dist">-</b>
    </div>
    <h4>事件 <span>select／squeeze</span></h4>
    <div class="wx-log"></div>`));
  const view = ctx.$(".wx-view");
  view.classList.add("aim");
  const out = (k) => ctx.$(`[data-k="${k}"]`);
  const logBox = ctx.$(".wx-log");
  const log = (t, cls) => logTo(logBox, t, cls);
  const renderer = makeRenderer(ctx, view);
  const canvas = renderer.domElement;
  const scene = new T.Scene();
  scene.background = gradientSky([[0, "#120c24"], [0.6, "#2b1f4a"], [1, "#4a3570"]]);
  lights(scene, { sun: 2.2, hemi: 1.2 });
  const grid = new T.GridHelper(20, 40, 0x7a64b8, 0x3a2e5c);
  scene.add(grid);
  const NAMES = ["方塊", "球體", "圓環", "圓錐", "環形結", "八面體", "圓柱"];
  const geos = [new T.BoxGeometry(0.34, 0.34, 0.34), new T.SphereGeometry(0.2, 32, 16), new T.TorusGeometry(0.17, 0.06, 16, 40), new T.ConeGeometry(0.2, 0.4, 32),
    new T.TorusKnotGeometry(0.13, 0.045, 100, 12), new T.OctahedronGeometry(0.22), new T.CylinderGeometry(0.16, 0.16, 0.36, 32)];
  const targets = geos.map((g, i) => {
    const a = -0.9 + (i / (geos.length - 1)) * 1.8;
    const m = new T.Mesh(g, new T.MeshStandardMaterial({ color: RAINBOW[i % 6], roughness: 0.4, emissive: 0x000000 }));
    m.position.set(Math.sin(a) * 2.4, 1.25 + Math.sin(i * 1.7) * 0.3, -Math.cos(a) * 2.4);
    m.userData = { name: NAMES[i], picked: false, base: m.position.y };
    const ped = new T.Mesh(new T.CylinderGeometry(0.12, 0.16, m.position.y - 0.25, 20), new T.MeshStandardMaterial({ color: 0x2c2444, roughness: 0.8 }));
    ped.position.set(m.position.x, (m.position.y - 0.25) / 2, m.position.z);
    scene.add(m, ped);
    return m;
  });
  // Laser and controller models are placed with XRRay.matrix (it maps the -Z unit ray onto this ray)
  const laserGeo = new T.CylinderGeometry(0.005, 0.005, 1, 8).rotateX(-Math.PI / 2).translate(0, 0, -0.5);
  const mkLaser = (color) => {
    const l = new T.Mesh(laserGeo, new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 }));
    l.matrixAutoUpdate = false;
    scene.add(l);
    return l;
  };
  const laser = mkLaser(0xff8c42);
  const pad = new T.Mesh(new T.BoxGeometry(0.05, 0.03, 0.14).translate(0, 0, 0.04), new T.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.4 }));
  pad.matrixAutoUpdate = false;
  scene.add(pad);
  const dot = new T.Mesh(new T.SphereGeometry(0.025, 16, 8), new T.MeshBasicMaterial({ color: 0xff8c42 }));
  scene.add(dot);
  const realLasers = [mkLaser(0x7bd389), mkLaser(0x7bd389)];

  const camera = newCamera();
  const camPos = new T.Vector3(0, 1.6, 0.9), camQuat = lookQuat(camPos, new T.Vector3(0, 1.2, -2.2));
  const ndc = new T.Vector2(), rc = new T.Raycaster(), hand = new T.Vector3();
  let auto = true, idleAt = 0, hovered = null, space = null;
  const toggle = (obj, how) => {
    obj.userData.picked = !obj.userData.picked;
    obj.material.emissive.setHex(obj.userData.picked ? 0x553300 : 0x000000);
    log(`${how}：${obj.userData.name}${obj.userData.picked ? " 選取" : " 取消"}`, how.startsWith("真實") ? "on" : "sim");
  };
  ctx.on(canvas, "pointermove", (e) => {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    auto = false;
    idleAt = performance.now();
  });
  ctx.on(canvas, "click", () => { if (hovered) toggle(hovered, "模擬 select（滑鼠）"); });

  let lastPick = 0;
  const xr = await driveInline(ctx, renderer, (t, frame, x) => {
    for (const m of targets) {
      m.rotation.y = t / 900 + m.id;
      m.position.y = m.userData.base + (m.userData.picked ? Math.sin(t / 220) * 0.06 : 0);
    }
    if (!auto && performance.now() - idleAt > 4000) auto = true;
    if (auto) ndc.set(Math.sin(t / 1400) * 0.75, Math.sin(t / 900) * 0.25 + 0.05);
    if (frame) {
      space ??= x.viewer.getOffsetReferenceSpace(new XRRigidTransform(camPos, camQuat).inverse);
      const pose = frame.getViewerPose(space);
      if (!pose) return;
      applyView(camera, pose.views[0]);
    } else {
      placeCamera(camera, null, null, camPos, camQuat, canvas);
    }
    // Aim point from the mouse, then a ray from a virtual hand at the lower right of the view
    rc.setFromCamera(ndc, camera);
    const aim = rc.intersectObjects(targets)[0]?.point || rc.ray.at(6, new T.Vector3());
    hand.set(0.22, -0.26, -0.35).applyMatrix4(camera.matrixWorld);
    const dir = aim.clone().sub(hand).normalize();
    const xray = typeof XRRay === "function" ? new XRRay({ x: hand.x, y: hand.y, z: hand.z, w: 1 }, { x: dir.x, y: dir.y, z: dir.z, w: 0 }) : null;
    const o = xray ? xray.origin : hand, d = xray ? xray.direction : dir;
    rc.set(new T.Vector3(o.x, o.y, o.z), new T.Vector3(d.x, d.y, d.z));
    const hit = rc.intersectObjects(targets)[0] || null;
    const len = hit ? hit.distance : 6;
    const base = xray ? new T.Matrix4().fromArray(xray.matrix) : new T.Matrix4().compose(hand, lookQuat(hand, aim), ONE);
    laser.matrix.copy(base).multiply(new T.Matrix4().makeScale(1, 1, len));
    pad.matrix.copy(base);
    dot.visible = !!hit;
    if (hit) dot.position.copy(hit.point);
    if (hovered !== hit?.object) {
      hovered?.scale.setScalar(1);
      hovered = hit?.object || null;
      hovered?.scale.setScalar(1.15);
    }
    if (auto && hovered && t - lastPick > 1800) { lastPick = t; toggle(hovered, "模擬 select（自動）"); }
    out("o").textContent = v3(o);
    out("d").textContent = v3(d);
    out("hit").textContent = hit ? hit.object.userData.name : "無";
    out("dist").textContent = hit ? `${fmt(hit.distance, 2)} m` : "-";
    // Real input sources (controllers, hands, screen taps) draw their own target rays
    const srcs = frame ? [...x.session.inputSources] : [];
    realLasers.forEach((l, i) => {
      const p = srcs[i] && frame.getPose(srcs[i].targetRaySpace, space);
      l.visible = !!p;
      if (p) l.matrix.fromArray(p.transform.matrix).multiply(new T.Matrix4().makeScale(1, 1, 4));
    });
    renderer.render(scene, camera);
  });

  const srcBox = out("src");
  const showSources = (s) => {
    const list = s ? [...s.inputSources] : [];
    srcBox.innerHTML = `<span>數量</span><b>${list.length}</b>` + (list.length
      ? list.map((src, i) => `<span>#${i} ${src.targetRayMode}</span><b>${src.handedness} ${src.profiles[0] || ""}</b>`).join("")
      : `<span>狀態</span><b class="zh">${s ? "沒有控制器或手勢輸入" : "無工作階段"}</b>`);
  };
  if (!xr) {
    setChip(view, SIM_CHIP, true);
    showMsg(view, "此瀏覽器沒有 WebXR inline 工作階段：射線改用 three.js 計算，不是 XRRay。");
    showSources(null);
    return;
  }
  setChip(view, "inline 工作階段・橘色射線由滑鼠模擬（非 XRInputSource）", true);
  setTag(view, "綠色射線＝真實輸入");
  showSources(xr.session);
  for (const type of ["inputsourceschange", "selectstart", "select", "selectend", "squeezestart", "squeeze", "squeezeend"]) {
    ctx.on(xr.session, type, (e) => {
      log(`真實事件 ${type}${e.inputSource ? `（${e.inputSource.targetRayMode}）` : ""}`, "on");
      if (type === "inputsourceschange") showSources(xr.session);
      if (type === "select" && hovered) toggle(hovered, "真實 select");
    });
  }
  log(`inputSources：${xr.session.inputSources.length} 個，等待真實事件`);
}

/* ---------- scene 6: session lifecycle with two inline sessions ---------- */
async function mountLife(ctx) {
  ctx.html(board(`
    <h4>工作階段 <span>XRSession</span></h4>
    <div class="wx-kv">
      <span>同時存在</span><b data-k="count">0</b>

      <span>B 每格間隔</span><b data-k="gapb">-</b>
    </div>
    <h4>生命週期紀錄 <span>requestSession → end</span></h4>
    <div class="wx-log"></div>`, { pair: true }));
  const logBox = ctx.$(".wx-log");
  const log = (t, cls) => logTo(logBox, t, cls);

  const ok = await inlineSupported();
  await ctx.sleep(0);
  const panes = [];

    scene.background = gradientSky([[0, bg[0]], [1, bg[1]]]);
    lights(scene, { sun: 2.4, hemi: 1 });
    const mesh = new T.Mesh(geo, new T.MeshStandardMaterial({ color, roughness: 0.3, metalness: 0.35, flatShading: key === "b" }));
    scene.add(mesh);
    const camera = newCamera();
    const camPos = new T.Vector3(0, 0.4, 3), camQuat = lookQuat(camPos, new T.Vector3(0, 0, 0));
    const ctl = h("div", { class: "wx-ctl" });
    const bPause = h("button", { class: "btn", type: "button" }, "暫停");
    const bEnd = h("button", { class: "btn", type: "button" }, "結束");
    ctl.append(bPause, bEnd);
    view.append(ctl);
    const p = { name, session: null, viewer: null, handle: 0, paused: false, frames: 0, lastT: 0, gap: 0 };
    panes.push(p);
    const state = () => {
      if (!p.session) setTag(view, "已結束", "warn");
      else if (p.paused) setTag(view, `已暫停・${fmt(p.frames, 0)} 格`, "warn");
      else setTag(view, `運作中・${fmt(p.frames, 0)} 格`, "on");
      bPause.textContent = p.paused ? "繼續" : "暫停";
      bPause.disabled = !p.session;
      bEnd.textContent = p.session ? "結束" : "重新開始";
      count();
    };
    const onFrame = (t, frame) => {
      if (!ctx.active || frame.session !== p.session) return;
      p.handle = frame.session.requestAnimationFrame(onFrame);
      if (!p.frames) log(`${name}：第一格 XRFrame（時間 ${fmt(t, 0)} ms）`);
      p.gap = p.lastT ? p.gap * 0.9 + (t - p.lastT) * 0.1 : 16.7;
      p.lastT = t;
      p.frames++;
      mesh.rotation.set(t / 1300, t / 900, 0);
      const pose = frame.getViewerPose(p.viewer);
      if (!pose) return;
      applyView(camera, pose.views[0]);
      renderer.render(scene, camera);
      out(`gap${key}`).textContent = `${fmt(p.gap, 1)} ms`;
      if (p.frames % 15 === 0) state();
    };
    async function start() {
      const t0 = performance.now();
      log(`${name}：requestSession("inline")`);
      const s = await navigator.xr.requestSession("inline");
      ctx.onCleanup(() => s.end().catch(() => {}));
      await ctx.sleep(0);
      log(`${name}：取得 XRSession，${fmt(performance.now() - t0, 1)} ms`, "on");
      s.updateRenderState({ baseLayer: new XRWebGLLayer(s, renderer.getContext()), inlineVerticalFieldOfView: T.MathUtils.degToRad(45) });
      log(`${name}：updateRenderState({ baseLayer })`);
      const viewer = await s.requestReferenceSpace("viewer");
      p.viewer = viewer.getOffsetReferenceSpace(new XRRigidTransform(camPos, camQuat).inverse);
      log(`${name}：requestReferenceSpace("viewer")`);
      s.addEventListener("end", () => {
        log(`${name}：end 事件，共 ${fmt(p.frames, 0)} 格`, "off");
        if (p.session === s) p.session = null;
        state();
      });
      s.addEventListener("visibilitychange", () => log(`${name}：visibilitychange → ${s.visibilityState}`));
      Object.assign(p, { session: s, paused: false, frames: 0, lastT: 0 });
      p.handle = s.requestAnimationFrame(onFrame);
      state();
    }
    ctx.on(bPause, "click", () => {
      if (!p.session) return;
      if (p.paused) {
        p.paused = false;
        p.lastT = 0;
        p.handle = p.session.requestAnimationFrame(onFrame);
        log(`${name}：重新 requestAnimationFrame`);
      } else {
        p.paused = true;
        p.session.cancelAnimationFrame(p.handle);
        log(`${name}：cancelAnimationFrame(${p.handle})`, "sim");
      }
      state();
    });
    ctx.on(bEnd, "click", () => {
      if (p.session) { log(`${name}：session.end()`); p.session.end(); } else start().catch((e) => log(`${name}：${e.name}`, "off"));
    });
    if (ok) {
      setChip(view, `inline 工作階段 ${name}`);
      await start();
    } else {
      setChip(view, SIM_CHIP, true);
      bPause.disabled = bEnd.disabled = true;
      placeCamera(camera, null, null, camPos, camQuat, canvas, 45);
      ctx.raf((t) => { mesh.rotation.set(t / 1300, t / 900, 0); camera.aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight); camera.updateProjectionMatrix(); renderer.render(scene, camera); });
      setTag(view, "無工作階段", "warn");
    }
  }
  if (!ok) log("此瀏覽器沒有 inline 工作階段，無法示範生命週期", "off");
}

/* ---------- scene 7: stress test ---------- */
async function mountStress(ctx) {
  ctx.html(`<div class="wx-stress"><div class="wx-view"><span class="wx-chip"></span><span class="wx-tag"></span></div></div>`);
  ctx.controls.classList.add("bottom");
  const view = ctx.$(".wx-view");
  const renderer = makeRenderer(ctx, view);
  const canvas = renderer.domElement;
  const scene = new T.Scene();
  scene.background = gradientSky([[0, "#05070d"], [1, "#16213a"]]);
  lights(scene, { sun: 2.2, hemi: 1.1 });
  const geo = new T.IcosahedronGeometry(0.1, 1);
  const mats = RAINBOW.map((c) => new T.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.2 }));
  const field = new T.Group();
  scene.add(field);
  const camera = newCamera();
  let n = 0, instanced = false, radius = 1, xrGap = 0, lastT = 0;

  const build = () => {
    field.traverse((o) => { if (o.isInstancedMesh) o.dispose(); });
    field.clear();
    radius = 0.32 * Math.cbrt(n) + 0.6;
    const m4 = new T.Matrix4(), q = new T.Quaternion(), pos = new T.Vector3(), scl = new T.Vector3(1, 1, 1);
    const place = (i) => {
      // Fibonacci directions with cube-root radii fill a ball evenly
      const y = 1 - (2 * (i + 0.5)) / n, r = Math.sqrt(1 - y * y), a = i * 2.39996323;
      const rad = radius * Math.cbrt((i + 0.5) / n);
      return pos.set(Math.cos(a) * r * rad, y * rad, Math.sin(a) * r * rad);
    };
    if (instanced) {
      const per = mats.map(() => []);
      for (let i = 0; i < n; i++) per[i % mats.length].push(i);
      per.forEach((ids, k) => {
        if (!ids.length) return;
        const im = new T.InstancedMesh(geo, mats[k], ids.length);
        ids.forEach((i, j) => im.setMatrixAt(j, m4.compose(place(i), q, scl)));
        field.add(im);
      });
    } else {
      for (let i = 0; i < n; i++) {
        const m = new T.Mesh(geo, mats[i % mats.length]);
        m.position.copy(place(i));
        field.add(m);
      }
    }
  };

  const xr = await driveInline(ctx, renderer, (t, frame, x) => {
    xrGap = lastT ? xrGap * 0.9 + (t - lastT) * 0.1 : 16.7;
    lastT = t;
    field.rotation.y = t / 4000;
    const yaw = t / 6000, dist = radius * 2.6 + 1;
    const camPos = new T.Vector3(Math.sin(yaw) * dist, radius * 0.6, Math.cos(yaw) * dist);
    placeCamera(camera, frame, x, camPos, lookQuat(camPos, new T.Vector3()), canvas, 55);
    renderer.render(scene, camera);
  }, { fov: 55 });
  setChip(view, xr ? "inline 工作階段繪製" : SIM_CHIP, !xr);
  ctx.toggle("InstancedMesh", false, (v) => { instanced = v; build(); setTag(view, v ? "InstancedMesh：6 次 draw call" : "每個物件一個 Mesh"); });
  setTag(view, "每個物件一個 Mesh");
  ctx.ramp({
    label: "物件數", unit: "個",
    steps: [100, 500, 1000, 2000, 4000, 8000, 16000, 32000],
    minFps: 30,
    apply(v) { n = v; build(); },
    metrics: () => ({
      "Draw calls": fmt(renderer.info.render.calls, 0),
      三角形: fmtCompact(renderer.info.render.triangles),
      "XRFrame 間隔": `${fmt(xrGap, 1)} ms`,
    }),
    note: "每一格都由 inline XRSession 的 requestAnimationFrame 驅動，畫面上的物件都是獨立 Mesh（80 個三角形的二十面體，6 種材質）。瓶頸在 draw call 數：每個 Mesh 一次 WebGL 繪製呼叫，加上 three.js 逐一計算矩陣。打開「InstancedMesh」把同材質的物件合併成 6 次 draw call，可比較兩者差距。沉浸式 VR 每格要畫左右兩眼，負擔約加倍。",
  });
}
