<style>
  /* shared: every scene owns a "desk"; transform makes it the containing block of the fixed-position windows */
  .wbd-wrap { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 8px) 8px calc(var(--sc-ctl-b, 0px) + 8px);
    display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .wbd-desk { position: relative; flex: 1; min-height: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; transform: translateZ(0);
    background: var(--bg-2) radial-gradient(color-mix(in srgb, var(--fg) 13%, transparent) 1px, transparent 1.5px) 0 0 / 18px 18px; }
  .wbd-desk .winbox { border-radius: 9px; }
  .wbd-desk .winbox:not(.no-shadow) { box-shadow: 0 12px 32px rgba(0,0,0,.38); }
  .wbd-desk .winbox.max, .wbd-desk .winbox.min { border-radius: 0; }
  .wbd-desk .wb-title { font: 600 13px var(--font); }
  .wbd-desk .wb-body { background: var(--panel); color: var(--fg); font: 13px/1.6 var(--font); border-radius: 0 0 9px 9px; }
  .wbd-pad { padding: 10px 12px; }
  .wbd-pad p { margin: 4px 0; }
  .wbd-muted { color: var(--muted); }
  .wbd-desk code, .wbd-code { font: 500 12px/1.5 var(--mono); color: var(--c2); }
  .wbd-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .wbd-strip small { font: 11px var(--mono); }
  .wbd-strip b.hit { color: var(--c5); }
  .wbd-flags { display: flex; gap: 4px; flex-wrap: wrap; }
  .wbd-flags i, .wbd-chip { font-style: normal; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--muted); font: 12px/1.6 var(--font); }
  .wbd-chip { font-family: var(--mono); font-size: 11.5px; cursor: pointer; }
  .wbd-flags i.on, .wbd-chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  /* 1. desktop */
  .wbd-wall { background: linear-gradient(180deg, rgba(14,16,19,.25), rgba(14,16,19,.6)), url("_shared/img/photo-1.jpg") center / cover no-repeat; }
  .wbd-menubar { position: absolute; left: 0; right: 0; top: 0; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    background: rgba(14,16,19,.55); backdrop-filter: blur(8px); color: #fff; font-size: 13px; }
  .wbd-menubar span { color: #c9d1dc; font-size: 12px; }
  .wbd-clock { margin-left: auto; font: 500 12px var(--mono) !important; }
  .wbd-icons { position: absolute; left: 6px; top: 42px; bottom: 6px; display: flex; flex-direction: column; flex-wrap: wrap; align-content: flex-start; gap: 2px; }
  .wbd-icon { width: 68px; padding: 6px 2px 4px; border: 1px solid transparent; border-radius: 10px; background: none; color: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px; font: 12px var(--font); text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .wbd-icon span { font-size: 24px; line-height: 1; }
  .wbd-icon:hover { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.22); }
  .wbd-note { width: 100%; height: 100%; resize: none; border: 0; outline: 0; padding: 10px 12px; background: #fffbe6; color: #3a3420; font: 14px/1.7 var(--font); }
  .wbd-album { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; padding: 8px; }
  .wbd-album img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 6px; cursor: zoom-in; }
  .wbd-photo { width: 100%; height: 100%; background: center / cover no-repeat; }
  .wbd-clockface { height: 100%; display: grid; place-items: center; text-align: center; background: radial-gradient(circle at 50% 30%, #222831, #101317); }
  .wbd-clockface .t { font: 700 30px/1.1 var(--mono); color: var(--accent); }
  .wbd-clockface .d { color: #9aa4b2; font-size: 12px; margin-top: 4px; }
  /* 3. themes */
  .winbox.wbd-glass { border-radius: 16px !important; box-shadow: 0 0 0 1px rgba(255,255,255,.25), 0 16px 40px rgba(0,0,0,.35); }
  .winbox.wbd-glass .wb-title { font-size: 15px; letter-spacing: .06em; }
  .winbox.wbd-glass .wb-body { border-radius: 11px; background: color-mix(in srgb, var(--panel) 88%, transparent); }

  /* 5. content */
  .wbd-home { display: inline-flex; min-height: 30px; min-width: 190px; align-items: center; border: 1px dashed var(--line); border-radius: 8px; padding: 2px 6px; }
  .wbd-home:empty::after { content: "（表單現在在視窗裡）"; color: var(--muted); font-size: 12px; }
  .wbd-form { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 4px; font-size: 13px; }

  .wbd-form .btn { padding: 3px 10px; }
  .wbd-form output { color: var(--c3); }
  .wb-body .wbd-form { padding: 12px; }
  .wbd-desk iframe { width: 100%; height: 100%; border: 0; display: block; }
  /* 6. events */
  .wbd-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 6px; }
  .wbd-evlog { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 12px; background: var(--panel); }
  .wbd-evlog div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.7; }
  .wbd-evlog code { font: 500 11.5px var(--mono); color: var(--c2); }
  .wbd-evlog .x, .wbd-evlog em { font: 11px var(--mono); color: var(--muted); font-style: normal; }
  .wbd-cnt { display: inline-flex; gap: 4px; align-items: baseline; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); transition: background .4s; }
  .wbd-cnt code { font: 11px var(--mono); color: var(--muted); }
  .wbd-cnt.flash { background: color-mix(in srgb, var(--accent) 35%, transparent); transition: none; }
  @media (max-width: 640px) { .wbd-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 76px; } }
  /* 7. stack */
  .wbd-z { height: 100%; display: grid; place-content: center; text-align: center; gap: 2px; }
  .wbd-z b { font: 700 34px/1 var(--font); }
  .wbd-z span { font: 12px var(--mono); color: var(--muted); }
  .wbd-order { display: inline-flex; gap: 4px; }
  .wbd-order i { font: 600 12px/20px var(--font); font-style: normal; width: 22px; text-align: center; border-radius: 5px; color: #fff; }
  .wbd-order i.min { opacity: .35; }
  /* 8. stress */
  .wbd-sdesk { position: absolute; inset: 8px 8px 8px 350px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; transform: translateZ(0); background: var(--bg-2); }
  .wbd-sdesk .winbox { box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  .wbd-sdesk .wb-title { font: 600 12px var(--mono); }
  .wbd-sdesk .wb-body { background: var(--panel); color: var(--muted); font: 12px var(--mono); padding: 4px 8px; }
  @media (max-width: 760px) { .wbd-sdesk { inset: 8px; opacity: .85; } }
</style>

<body>
<script src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const PHOTO_NAMES = ["峽灣", "紅岩峽谷", "綠色山谷公路", "披毯巴哥犬", "瀑布彩虹", "藍底水母", "母獅特寫", "海象群"];
const C = (i) => `var(--c${(i % 6) + 1})`;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(v, hi));
const alive = (w) => !!(w && w.body);
const runLoop = (p) => p.catch((e) => { if (e && e.name !== "AbortError") console.error(e); });

// A desk is the scene's window container. WinBox measures its bounds from the document,
// so right/bottom limits are set to "document size minus desk size" to keep every window inside the desk.
function makeDesk(ctx, deskEl, base = {}, onChange) {
  const wins = new Set();
  const b = { top: 0, left: 0, right: 0, bottom: 0, ...base };
  let L = null;
  const W = () => deskEl.clientWidth, H = () => deskEl.clientHeight;
  const lim = () => L || (L = {
    top: b.top, left: b.left,
    right: Math.max(0, document.documentElement.clientWidth - W()) + b.right,
    bottom: Math.max(0, document.documentElement.clientHeight - H()) + b.bottom,
  });
  const fit = (w) => {
    if (!alive(w) || w.min) return w;
    if (w.max) return w.resize(W() - b.left - b.right, H() - b.top - b.bottom, true).move(b.left, b.top, true);
    const x = clamp(w.x, b.left, Math.max(b.left, W() - b.right - w.width)), y = clamp(w.y, b.top, Math.max(b.top, H() - b.bottom - w.height));
    return x !== w.x || y !== w.y ? w.move(x, y) : w;
  };
  function open(title, opts = {}) {
    const own = opts.onclose;
    const cls = [opts.class, document.fullscreenEnabled ? "" : "no-full"].filter(Boolean).join(" ");
    const w = new WinBox(title, {
      root: deskEl, ...lim(), ...opts, class: cls,
      onclose(force) {
        if (own && own.call(this, force)) return true;
        wins.delete(this);
        if (onChange && ctx.active) onChange();
        return false;
      },
    });
    wins.add(w);
    if (onChange) onChange();
    return w;
  }
  function closeAll(force) {
    for (const w of [...wins]) {
      if (force) { w.onclose = null; wins.delete(w); }
      w.close(force);
    }
    if (onChange && ctx.active) onChange();
  }
  let lw = 0, lh = 0;
  const ro = new ResizeObserver(() => {
    const w = W(), h = H();
    if (w === lw && h === lh) return;
    const first = !lw; lw = w; lh = h; L = null;
    if (first) return;
    const l = lim();
    for (const win of wins) { win.right = l.right; win.bottom = l.bottom; fit(win); }
  });
  ro.observe(deskEl);
  ctx.onCleanup(() => { ro.disconnect(); closeAll(true); document.body.classList.remove("wb-lock"); });
  return { wins, open, closeAll, fit, W, H };
}

// Drives WinBox's own mouse handlers with synthetic events (mousedown on a handle, mousemove/mouseup on window).
const fire = (type, x, y, target) => target.dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, bubbles: true, cancelable: true, button: 0, buttons: type === "mouseup" ? 0 : 1, view: window }));
async function fakeDrag(ctx, node, dx, dy, ms = 600) {
  if (!node || !ctx.active) return;
  const r = node.getBoundingClientRect(), x0 = r.left + Math.min(r.width / 2, 40), y0 = r.top + r.height / 2;
  const n = Math.max(2, Math.round(ms / 16));
  fire("mousedown", x0, y0, node);
  try {
    for (let i = 1; i <= n && ctx.active; i++) {
      await ctx.frame();
      const k = i / n, e = 1 - (1 - k) * (1 - k);
      fire("mousemove", x0 + dx * e, y0 + dy * e, window);
    }
  } finally { fire("mouseup", x0 + dx, y0 + dy, window); }
}
const handle = (w, dir) => alive(w) ? w.window.querySelector(".wb-" + dir) : null;

function layout(W, H, n, gap = 10) {
  if (W >= 480 && H >= 230) {
    const cw = (W - gap * 3) / 2 | 0, ch = (H - gap * 3) / 2 | 0;
    return Array.from({ length: n }, (_, i) => ({ x: gap + (i % 2) * (cw + gap), y: gap + (i >> 1) * (ch + gap), width: cw, height: ch }));
  }
  const cw = Math.max(170, W - (n - 1) * 20 - 16), ch = Math.max(120, H - (n - 1) * 30 - 16);
  return Array.from({ length: n }, (_, i) => ({ x: 8 + i * 20, y: 8 + i * 30, width: cw, height: ch }));
}

Showcase.run({ scenes: [
  {
    id: "desktop", title: "網頁桌面",
    api: "new WinBox(title, { root, html, x, y, width, height })",
    desc: "原版的網頁桌面搬進場景：點圖示開視窗，相簿裡的照片再開新視窗。所有視窗用 root 掛在這個桌面容器裡，拖不出邊界；「並排」與「疊放」只用 move() 和 resize() 重新排版。",
    hint: "點左側圖示開視窗・拖曳標題列移動・拉邊緣縮放・雙擊標題列最大化",
    async mount(ctx) {
      const APPS = [["note", "📝", "記事本"], ["album", "🖼️", "相簿"], ["clock", "⏰", "時鐘"], ["about", "💡", "關於"]];
      ctx.html(`<div class="wbd-wrap"><div class="wbd-desk wbd-wall">
        <div class="wbd-menubar"><b>網頁桌面</b><span class="wbd-count"></span><span class="wbd-clock"></span></div>
        <div class="wbd-icons">${APPS.map(([k, i, t]) => `<button class="wbd-icon" data-app="${k}"><span>${i}</span>${t}</button>`).join("")}</div>
      </div></div>`);
      const TOP = 34;
      let D = null;
      ctx.button("並排", () => {
        const list = [...D.wins].filter((w) => !w.min);
        if (!list.length) return;
        const W = D.W(), H = D.H() - TOP;
        const cols = Math.ceil(Math.sqrt(list.length * W / H)), rows = Math.ceil(list.length / cols);
        list.forEach((w, i) => {
          if (w.max) w.restore();
          w.resize(W / cols - 8 | 0, H / rows - 8 | 0).move((i % cols) * (W / cols) + 4 | 0, TOP + Math.floor(i / cols) * (H / rows) + 4 | 0);
        });
      });
      ctx.button("疊放", () => {
        [...D.wins].forEach((w, i) => {
          if (w.min || w.max) w.restore();
          const ww = Math.min(360, D.W() - 60), hh = Math.min(240, D.H() - TOP - 80);
          w.resize(ww, hh).move(12 + (i % 6) * 22, TOP + 8 + (i % 6) * 22).focus();
        });
      });
      ctx.button("全部關閉", () => D.closeAll(false));
      await ctx.frame(2);
      const deskEl = ctx.$(".wbd-desk"), countEl = ctx.$(".wbd-count");
      D = makeDesk(ctx, deskEl, { top: TOP }, () => (countEl.textContent = `${D.wins.size} 個視窗`));
      let cascade = 0;
      const geo = (w, h) => {
        const W = D.W(), H = D.H(), small = W < 520;
        const width = Math.min(w, W - 16), height = Math.min(h, H - TOP - 12);
        const step = (cascade++ % 5) * 24;
        return { width, height, x: small ? 8 + step / 2 : Math.min(92 + step * 1.4, W - width - 8), y: Math.min(TOP + 10 + step, H - height - 6) };
      };
      const tick = (el) => {
        const now = new Date();
        el.querySelector(".t").textContent = now.toLocaleTimeString("zh-TW", { hour12: false });
        el.querySelector(".d").textContent = now.toLocaleDateString("zh-TW", { month: "long", day: "numeric", weekday: "long" });
      };
      const openPhoto = (i) => {
        const w = D.open(`照片：${PHOTO_NAMES[i]}`, { ...geo(360, 250), background: "linear-gradient(90deg,#2f9e55,#7bd389)", html: `<div class="wbd-photo"></div>` });
        w.body.firstChild.style.backgroundImage = `url(_shared/img/photo-${i + 1}.jpg)`;
      };
      const APP = {
        note: () => D.open("記事本：今日備忘", { ...geo(300, 220), background: "linear-gradient(90deg,#d4a900,#f7df1e)",
          html: `<textarea class="wbd-note" aria-label="記事本">歡迎來到網頁桌面！\n\n☐ 確認週三讀書會場地\n☐ 整理相簿裡的旅遊照片\n☐ 把這個視窗拉大試試看</textarea>` }),
        album: () => {
          const w = D.open("相簿（點照片開新視窗）", { ...geo(380, 250), background: "linear-gradient(90deg,#1f8fb8,#4cc9f0)",
            html: `<div class="wbd-album">${PHOTO_NAMES.map((n, i) => `<img src="_shared/img/photo-${i + 1}.jpg" alt="${n}" data-i="${i}">`).join("")}</div>` });
          w.body.addEventListener("click", (e) => { if (e.target.dataset.i !== undefined) openPhoto(+e.target.dataset.i); });
          return w;
        },
        clock: () => {
          const w = D.open("時鐘", { ...geo(230, 150), background: "linear-gradient(90deg,#d61f69,#f72585)",
            html: `<div class="wbd-clockface"><div><div class="t"></div><div class="d"></div></div></div>` });
          tick(w.body);
          ctx.interval(() => alive(w) && tick(w.body), 1000);
          return w;
        },
        about: () => D.open("關於 WinBox.js", { ...geo(320, 230), background: "linear-gradient(90deg,#6a5ae0,#9d8cff)",
          html: `<div class="wbd-pad"><b>一行程式開一個視窗</b><p><code>new WinBox("標題", { root, html })</code></p>
            <p class="wbd-muted">拖曳標題列移動、拉邊緣縮放、右上角縮小 / 最大化 / 關閉，點一下就帶到最上層。</p></div>` }),
      };
      ctx.$$(".wbd-icon").forEach((b) => b.addEventListener("click", () => APP[b.dataset.app]()));
      const clockEl = ctx.$(".wbd-clock");
      const menuTick = () => (clockEl.textContent = new Date().toLocaleTimeString("zh-TW", { hour12: false, hour: "2-digit", minute: "2-digit" }));
      menuTick();
      ctx.interval(menuTick, 1000);
      APP.album();
      const note = APP.note();
      if (D.W() >= 700) {
        note.move(Math.min(Math.round(D.W() * 0.56), D.W() - 320), TOP + 40);
        APP.clock().move(D.W() - 250, D.H() - 170);
      }
    },
  },
  {
    id: "control", title: "視窗控制",
    api: "minimize() ・ maximize() ・ restore() ・ hide() / show() ・ move() ・ resize() ・ fullscreen()",
    desc: "每個按鈕都是一行 API。move() 與 resize() 接受像素、百分比與 \"center\"、\"right\"、\"bottom\"；縮小的視窗會停到容器底部的工作列，最大化只填滿這個場景，因為 root 與邊界都設在桌面容器上。上方即時顯示 x、y、寬、高與狀態旗標。",
    hint: "自動示範會輪流呼叫各個方法；關掉後可自己按，也能直接操作視窗",
    async mount(ctx) {
      ctx.html(`<div class="wbd-wrap"><div class="wbd-strip"><span class="wbd-geo"></span><span class="wbd-flags"></span></div>
        <div class="wbd-desk"><div class="wbd-ghost">hide() 只是加上 .hide class<br>DOM 還在，show() 就回來</div></div>
        <div class="wbd-log">準備中…</div></div>`);
      const geoEl = ctx.$(".wbd-geo"), flagsEl = ctx.$(".wbd-flags"), logEl = ctx.$(".wbd-log"), ghost = ctx.$(".wbd-ghost");
      let w = null, auto = true, mi = 0, si = 0;
      const MOVES = [["right", "bottom"], [0, 0], ["center", "center"], ["right", 0], [0, "bottom"]];
      const SIZES = [["60%", "70%"], [240, 150], ["45%", "55%"]];
      const q = (v) => typeof v === "string" ? `"${v}"` : v;
      const act = (label, fn) => {
        if (!alive(w)) return;
        fn();
        logEl.innerHTML = `<b>呼叫</b> <code>win.${label}</code>`;
      };
      const ACTIONS = {
        min: () => act("minimize()", () => w.minimize()),
        max: () => act("maximize()", () => w.maximize()),
        restore: () => act("restore()", () => w.restore()),
        hide: () => w.hidden ? act("show()", () => w.show()) : act("hide()", () => w.hide()),
        move: () => { const [x, y] = MOVES[mi++ % MOVES.length]; act(`move(${q(x)}, ${q(y)})`, () => { w.restore(); w.move(x, y); }); },
        size: () => { const [a, b] = SIZES[si++ % SIZES.length]; act(`resize(${q(a)}, ${q(b)})`, () => { w.restore(); w.resize(a, b); ctx.timeout(() => D.fit(w), 50); }); },
      };
      const auto_ = ctx.toggle("自動示範", true, (v) => (auto = v));
      const manual = (k) => () => { auto = false; auto_.setAttribute("aria-pressed", "false"); ACTIONS[k](); };
      ctx.button("縮小", manual("min"));
      ctx.button("最大化", manual("max"));

        orderEl.innerHTML = live.map((w) => `<i class="${w.min ? "min" : ""}" style="background:${w.bg}">${w.tag}</i>`).join("");
        live.forEach((w, i) => {
          w.body.querySelector(".z").textContent = `z-index ${w.index}`;
          w.body.querySelector(".r").textContent = w.min ? "已縮小" : `第 ${i + 1} / ${live.length} 層`;
        });
      };
      const soon = () => queueMicrotask(refresh);
      const raise = () => {
        const low = list.filter((w) => alive(w) && !w.min).sort((a, b) => a.index - b.index)[0];
        if (low) low.focus();
      };
      ctx.toggle("自動輪播", true, (v) => (auto = v));
      ctx.button("拉起最底層", raise);
      ctx.button("全部縮小", async () => { for (const w of list) if (alive(w) && !w.min) { w.minimize(); await ctx.sleep(90); } });
      ctx.button("全部還原", async () => { for (const w of list) if (alive(w) && w.min) { w.restore().focus(); await ctx.sleep(90); } });
      await ctx.frame(2);
      D = makeDesk(ctx, ctx.$(".wbd-desk"));
      const W = D.W(), H = D.H(), n = 6;
      const ww = Math.round(Math.min(220, W * 0.55)), hh = Math.round(Math.min(150, H * 0.48));
      list = "ABCDEF".split("").map((tag, i) => {
        const w = D.open(`視窗 ${tag}`, {
          background: C(i), width: ww, height: hh,
          x: Math.round(8 + (W - ww - 16) * (i / (n - 1))), y: Math.round(8 + (H - hh - 16) * [0, 1, .5, 0, 1, .5][i]),
          html: `<div class="wbd-z"><b style="color:${C(i)}">${tag}</b><span class="z"></span><span class="r"></span></div>`,
          onfocus: soon, onminimize: soon, onrestore: soon,
        });
        w.tag = tag; w.bg = C(i);
        return w;
      });
      refresh();
      runLoop((async () => {
        for (;;) { await ctx.sleep(1000); if (auto) raise(); }
      })());
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress",
    api: "new WinBox() × N ・ 拖曳最上層視窗",
    desc: "每一級先關閉全部視窗，再一次建立 N 個（計時含插入 DOM 與強制排版），接著用合成滑鼠事件持續拖曳最上層的視窗繞圈，走的是 WinBox 自己的 mousemove 處理器，量此時的畫面 FPS。",
    hint: "按「自動加壓」；右邊會實際開出每一級數量的視窗",
    mount(ctx) {
      ctx.html(`<div class="wbd-sdesk"></div>`);
      const deskEl = ctx.$(".wbd-sdesk");
      const D = makeDesk(ctx, deskEl);
      let drag = null, created = 0, moves = 0, lastN = 0, t0m = performance.now();
      const endDrag = () => { if (!drag) return; drag.stop(); fire("mouseup", drag.x0, drag.y0, window); drag = null; };
      ctx.onCleanup(endDrag);
      const startDrag = () => {
        const top = [...D.wins].pop();
        const node = handle(top, "drag");
        if (!node) return;
        const r = node.getBoundingClientRect(), x0 = r.left + 30, y0 = r.top + r.height / 2;
        const R = Math.min(D.W(), D.H()) / 4;
        let t = 0;
        fire("mousedown", x0, y0, node);
        drag = { x0, y0, stop: ctx.raf((_, dt) => {
          t += dt / 500;
          fire("mousemove", x0 + R * (Math.cos(t) - 1), y0 + R * Math.sin(t), window);
          moves++;
        }) };
      };
      const apply = async (n) => {
        endDrag();
        D.closeAll(true);
        await ctx.frame();
        const W = D.W(), H = D.H(), ww = 150, hh = 92;
        const t0 = performance.now();
        for (let i = 0; i < n; i++) {
          D.open(`#${i + 1}`, { width: ww, height: hh, background: C(i),
            x: Math.round(((i * 0.618) % 1) * Math.max(1, W - ww)), y: Math.round(((i * 0.382 + i / n) % 1) * Math.max(1, H - hh)),
            html: `視窗 ${i + 1} / ${n}` });
        }
        void deskEl.offsetHeight;
        created = performance.now() - t0;
        lastN = n;
        const top = [...D.wins].pop();
        top.move(Math.round((W - ww) / 2 + Math.min(W, H) / 8), Math.round((H - hh) / 2));
        await ctx.frame(2);
        moves = 0; t0m = performance.now();
        startDrag();
      };
      ctx.ramp({
        label: "視窗", unit: "個",
        steps: [10, 50, 100, 200, 400, 800, 1600, 3200],
        apply,
        minFps: 30,
        metrics: () => ({
          "建立耗時": `${created.toFixed(0)} ms`,
          "每個視窗": lastN ? `${((created / lastN) * 1000).toFixed(0)} µs` : "…",
          "拖曳事件/秒": `${Math.round(moves / Math.max(0.001, (performance.now() - t0m) / 1000))}`,
        }),
        note: "WinBox 每個視窗約 15 個節點、9 組拖曳監聽器，建立成本大致線性。拖曳只改最上層視窗的 left / top，但它蓋住的視窗越多，瀏覽器每格要重畫的區域越大，FPS 會隨數量下降。",
      });
    },
  },
] });
</script>
</body>
</html>
