<style>

  @media (max-width: 640px) { .wed-ev { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(120px, 1fr); } }

  .wed-col { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }

  .wed-cnt div { background: rgba(255,255,255,.85); border-radius: 6px; padding: 4px 8px; }

  .wed-elev wired-card span { display: block; font: 11px var(--mono); color: var(--muted); text-align: center; }
  .wed-notes { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .wed-notes wired-card { width: 150px; min-height: 104px; font-size: 16px; line-height: 1.5; }

  .wed-notes wired-card:nth-child(even) { transform: rotate(1.2deg); }
  .wed-notes wired-image { width: 150px; }
  .wed-divs { display: grid; gap: 4px; max-width: 520px; margin: 12px 0 4px; }

  .wed-tabs { display: block; max-width: 560px; }
  .wed-tabs wired-tab { background: rgba(255,255,255,.9); }
  .wed-tabs wired-calendar { width: min(300px, 100%); height: 270px; font-size: 14px; --wired-calendar-bg: #fff; --wired-calendar-selected-color: #d61f69; }
  .wed-tabpane { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; padding: 6px; }
  .wed-tabpane wired-listbox { --wired-item-selected-bg: #bfe3f6; min-width: 170px; }
  .wed-tabpane wired-search-input { width: min(260px, 100%); }
  .wed-res { margin: 0; padding-left: 18px; font-size: 16px; line-height: 1.7; }

  .wed-sbox { position: absolute; inset: 8px 8px 8px 350px; overflow: hidden; border-radius: 10px; background: #fff; border: 1px solid var(--line); padding: 8px; font-family: var(--wed-hand); }
  .wed-sgrid { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .wed-sgrid wired-card { width: 110px; padding: 6px 8px; font-size: 13px; }
  .wed-sgrid wired-input { width: 110px; font-size: 13px; }
  .wed-sgrid wired-progress { width: 120px; height: 30px; }

<script src="https://cdn.jsdelivr.net/npm/wired-elements@2.1.2/lib/wired-elements-iife.js"></script>
<script src="_shared/showcase.js"></script>
<script>
const rnd = () => Math.floor(Math.random() * 2 ** 31);
const runLoop = (p) => p.catch((e) => { if (e && e.name !== "AbortError") console.error(e); });
// Every wired element keeps a random seed for rough.js; a new seed plus a forced render draws new strokes.
function reseed(root, sameSeed = false) {
  root.querySelectorAll("*").forEach((el) => {
    if (!el.tagName.startsWith("WIRED-") || !("seed" in el)) return;
    if (!sameSeed) el.seed = rnd();
    if (el.wiredRender) el.wiredRender(true); else if (el.requestUpdate) el.requestUpdate();
  });
}
// Real interaction paths: the components listen to their own inner <input>, so poke that element.
const inner = (el, sel = "input") => el && el.shadowRoot && el.shadowRoot.querySelector(sel);
const clickInner = (el) => { const i = inner(el); if (i) i.click(); };
const typeInto = (el, text) => { const i = inner(el, "input, textarea"); if (!i) return; i.value = text; i.dispatchEvent(new Event("input", { bubbles: true })); };
const slideTo = (el, v) => { const i = inner(el); if (!i) return; i.value = v; i.dispatchEvent(new Event("input", { bubbles: true })); };
const whenReady = () => customElements.whenDefined("wired-card");

Showcase.run({ scenes: [
  {
    id: "form", title: "報名表單", paper: true,
    api: "<wired-input> ・ <wired-combo> ・ <wired-radio-group> ・ <wired-slider> ・ <wired-dialog>",
    desc: "原版的手繪風報名表單：每個欄位都是 Web Component，邊框由 rough.js 畫成 SVG。進度條依填寫欄位數更新，送出時顯示轉圈動畫，再用 wired-dialog 跳出結果。",
    hint: "按「示範填寫」看自動輸入，或自己填完按「送出報名」",
    async mount(ctx) {
      ctx.html(`<div class="wed-wrap"><wired-card class="wed-form" elevation="3">
        <div class="wed-head"><h2>✏️ <span class="long">週末手作</span>工作坊報名</h2><wired-progress data-k="progress" value="0" percentage></wired-progress></div>
        <div class="wed-cols"><div>
          <label class="wed-f"><span>姓名</span><wired-input data-k="name" placeholder="例如：林小美" value="林小美"></wired-input></label>
          <label class="wed-f"><span>電子信箱</span><wired-input data-k="email" type="email" placeholder="name@example.com"></wired-input></label>
          <div class="wed-f"><span>上課城市</span><wired-combo data-k="city" selected="txg">
            <wired-item value="tpe">台北・大安教室</wired-item><wired-item value="txg">台中・審計新村</wired-item>
            <wired-item value="tnn">台南・神農街</wired-item><wired-item value="hua">花蓮・文創園區</wired-item></wired-combo></div>
          <div class="wed-f"><span>手作經驗</span><wired-radio-group data-k="level" selected="new">
            <wired-radio name="new">第一次</wired-radio><wired-radio name="some">玩過幾次</wired-radio><wired-radio name="pro">很熟練</wired-radio></wired-radio-group></div>
        </div><div>
          <div class="wed-f wed-opt"><span>想學的主題</span><div class="wed-row" data-k="topics">
            <wired-checkbox data-t="水彩明信片" checked>水彩明信片</wired-checkbox><wired-checkbox data-t="木工杯墊">木工杯墊</wired-checkbox><wired-checkbox data-t="手捏陶杯">手捏陶杯</wired-checkbox></div></div>
          <div class="wed-f"><span>材料費預算</span><div class="wed-row"><wired-slider data-k="budget" min="0" max="3000" value="1200"></wired-slider><span class="wed-money" data-k="money"></span></div></div>
          <div class="wed-f wed-opt"><span>訂閱每月活動通知</span><div class="wed-row"><wired-toggle data-k="news" checked></wired-toggle><span data-k="newsText">好啊</span></div></div>
          <label class="wed-f wed-opt"><span>想對老師說的話</span><wired-textarea data-k="memo" rows="2" placeholder="例如：想帶小孩一起參加"></wired-textarea></label>
        </div></div>
        <div class="wed-actions"><wired-button class="wed-go" data-k="submit" elevation="2">送出報名</wired-button><wired-button data-k="reset">清空</wired-button><wired-spinner class="wed-spin" data-k="spin" hidden></wired-spinner></div>
      </wired-card></div><wired-dialog data-k="dlg"><div class="wed-dlg" data-k="dlgBody"></div></wired-dialog>`);
      const $ = (k) => ctx.$(`[data-k="${k}"]`);
      const CITY = { tpe: "台北・大安教室", txg: "台中・審計新村", tnn: "台南・神農街", hua: "花蓮・文創園區" };
      const LEVEL = { new: "第一次", some: "玩過幾次", pro: "很熟練" };
      const boxes = ctx.$$('[data-k="topics"] wired-checkbox');
      const topics = () => boxes.filter((c) => c.checked).map((c) => c.dataset.t);
      const refresh = () => {
        $("money").textContent = `NT$${Math.round($("budget").value / 100) * 100}`;
        $("newsText").textContent = $("news").checked ? "好啊" : "先不用";
        const filled = [$("name").value.trim(), /\S+@\S+\.\S+/.test($("email").value), $("city").selected, $("level").selected, topics().length, $("budget").value > 0].filter(Boolean).length;
        $("progress").value = Math.round((filled / 6) * 100);
      };
      ["name", "email", "memo"].forEach((k) => $(k).addEventListener("input", refresh));
      ["city", "level"].forEach((k) => $(k).addEventListener("selected", refresh));
      ["budget", "news"].forEach((k) => $(k).addEventListener("change", refresh));
      boxes.forEach((c) => c.addEventListener("change", refresh));
      const dlg = $("dlg");
      ctx.onCleanup(() => (dlg.open = false));
      const openDialog = (html) => {
        $("dlgBody").innerHTML = `${html}<div class="end"><wired-button data-k="close">知道了</wired-button></div>`;
        dlg.open = true;
        $("close").addEventListener("click", () => (dlg.open = false));
      };
      const submit = () => {
        if (!$("name").value.trim()) return openDialog("<h3>還差一點</h3>請先寫下你的姓名 🙂");
        const spin = $("spin");
        spin.hidden = false; spin.spinning = true;
        ctx.timeout(() => {
          spin.spinning = false; spin.hidden = true;
          const esc = (s) => s.replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" })[c]);
          openDialog(`<h3>🎉 報名成功</h3>${esc($("name").value)}，我們在 <b>${CITY[$("city").selected] || "未選城市"}</b> 等你！<br>
            經驗：${LEVEL[$("level").selected] || "未填"}<br>主題：${topics().join("、") || "還沒決定"}<br>預算：${$("money").textContent}・通知：${$("news").checked ? "訂閱" : "不訂閱"}`);
        }, 900);
      };
      $("submit").addEventListener("click", submit);
      $("reset").addEventListener("click", () => {
        $("name").value = ""; $("email").value = ""; $("memo").value = "";
        boxes.forEach((c) => (c.checked = false));
        $("budget").value = 0;
        refresh();
      });
      let busy = false;
      ctx.button("示範填寫", async () => {
        if (busy) return;
        busy = true; dlg.open = false;
        try {
          const type = async (k, text) => { for (let i = 1; i <= text.length; i++) { typeInto($(k), text.slice(0, i)); await ctx.sleep(70); } };
          await type("name", "陳大文"); await type("email", "dawen@example.com");
          $("city").selected = "tnn"; $("city").requestUpdate(); refresh(); await ctx.sleep(300);
          clickInner(ctx.$('wired-radio[name="some"]')); await ctx.sleep(300);
          clickInner(boxes[2]); await ctx.sleep(300);
          for (let v = +$("budget").value; v <= 2400; v += 120) { slideTo($("budget"), v); await ctx.sleep(30); }
          await type("memo", "想做一個送給媽媽的杯子");
          await ctx.sleep(300);
          submit();
        } finally { busy = false; }
      }, { primary: true });
      await whenReady();
      await ctx.frame(2);
      refresh();
    },
  },
  {
    id: "gallery", title: "元件總覽", paper: true,
    api: "18 個 <wired-*> 元件 ・ el.disabled ・ el.seed + wiredRender(true)",
    desc: "wired-elements 的主要元件一次排開：按鈕、圖示按鈕、浮動按鈕、連結、核取、單選、開關、滑桿、輸入框、搜尋框、下拉、清單、進度、轉圈、分隔線、圖片、多行輸入與卡片。每個元件都有自己的隨機種子，換種子再強制重繪就是一套新筆觸。",
    hint: "「重新抽筆觸」換掉每個元件的種子；「停用」切換 disabled 屬性",
    async mount(ctx) {
      const CELLS = [
        ["wired-button", `<wired-button elevation="2">按我</wired-button><wired-button>取消</wired-button>`],
        ["wired-icon-button", `<wired-icon-button>❤</wired-icon-button><wired-icon-button>★</wired-icon-button>`],
        ["wired-fab", `<wired-fab>＋</wired-fab>`],
        ["wired-link", `<wired-link href="#wed-link" elevation="2">手繪底線連結</wired-link>`],
        ["wired-checkbox", `<wired-checkbox checked>已勾選</wired-checkbox><wired-checkbox>未勾選</wired-checkbox>`],
        ["wired-radio", `<wired-radio checked>單選</wired-radio>`],
        ["wired-toggle", `<wired-toggle checked></wired-toggle>`],
        ["wired-slider", `<wired-slider value="60"></wired-slider>`],
        ["wired-input", `<wired-input placeholder="輸入文字"></wired-input>`],
        ["wired-search-input", `<wired-search-input placeholder="搜尋"></wired-search-input>`],
        ["wired-combo", `<wired-combo selected="b"><wired-item value="a">蘋果</wired-item><wired-item value="b">香蕉</wired-item><wired-item value="c">芭樂</wired-item></wired-combo>`],
        ["wired-listbox", `<wired-listbox horizontal selected="m"><wired-item value="s">小</wired-item><wired-item value="m">中</wired-item><wired-item value="l">大</wired-item></wired-listbox>`],
        ["wired-progress", `<wired-progress value="65" percentage></wired-progress>`],
        ["wired-spinner", `<wired-spinner spinning duration="1500"></wired-spinner>`],
        ["wired-divider", `<wired-divider elevation="2"></wired-divider>`],
        ["wired-image", `<wired-image elevation="2" src="_shared/img/photo-4.jpg"></wired-image>`],
        ["wired-textarea", `<wired-textarea rows="2" placeholder="多行文字"></wired-textarea>`],
        ["wired-card", `<wired-card elevation="3" fill="#fde68a">黃色便利貼</wired-card>`],
      ];
      ctx.html(`<div class="wed-wrap"><div class="wed-gal">${CELLS.map(([t, h]) => `<div class="wed-cell"><span class="wed-tag">&lt;${t}&gt;</span><div>${h}</div></div>`).join("")}</div></div>`);
      const wrap = ctx.$(".wed-wrap");
      ctx.$("wired-link").addEventListener("click", (e) => e.preventDefault());
      ctx.button("重新抽筆觸", () => reseed(wrap), { primary: true });
      ctx.toggle("停用", false, (v) => wrap.querySelectorAll("*").forEach((el) => { if (el.tagName.startsWith("WIRED-") && "disabled" in el) el.disabled = v; }));
      let auto = true;
      ctx.toggle("自動重抽", true, (v) => (auto = v));
      ctx.interval(() => { if (auto) reseed(wrap); }, 2200);
    },
  },
  {
    id: "events", title: "事件紀錄", paper: true,
    api: "change {checked | value} ・ selected {selected} ・ input",
    desc: "wired-elements 用 CustomEvent 回報互動：核取與開關送 change（detail.checked），滑桿送 change（detail.value），單選群組、下拉與清單送 selected，輸入框轉發 input。自動示範直接點元件內部的原生 input 與 item，走的是元件自己的事件流程。",
    hint: "自動示範每秒操作一個元件；關掉後自己點，右側會記錄事件名稱與 detail",
    async mount(ctx) {
      ctx.html(`<div class="wed-wrap"><div class="wed-ev"><div class="wed-controls">
          <span>核取</span><div class="wed-row"><wired-checkbox data-n="cb1">提醒我</wired-checkbox><wired-checkbox data-n="cb2">帶朋友</wired-checkbox></div>
          <span>開關</span><wired-toggle data-n="tg"></wired-toggle>
          <span>場次</span><wired-radio-group data-n="rg" selected="a"><wired-radio name="a">早場</wired-radio><wired-radio name="b">午場</wired-radio><wired-radio name="c">晚場</wired-radio></wired-radio-group>
          <span>飲料</span><div><wired-combo data-n="cm" selected="tea"><wired-item value="tea">紅茶</wired-item><wired-item value="green">綠茶</wired-item><wired-item value="coffee">咖啡</wired-item></wired-combo></div>
          <span>尺寸</span><div><wired-listbox data-n="lb" horizontal selected="m"><wired-item value="s">小</wired-item><wired-item value="m">中</wired-item><wired-item value="l">大</wired-item></wired-listbox></div>
          <span>人數</span><wired-slider data-n="sl" min="1" max="10" value="2"></wired-slider>
          <span>備註</span><wired-input data-n="in" placeholder="打字看看"></wired-input>
        </div><div class="wed-log"><b>事件紀錄（新的在上）</b><div class="wed-list"></div></div></div></div>`);
      const list = ctx.$(".wed-list");
      const N = (n) => ctx.$(`[data-n="${n}"]`);
      const log = (type, el, detail) => {
        const key = type + el.dataset.n, top = list.firstElementChild;
        if (top && top.dataset.k === key && (type === "input" || el.dataset.n === "sl")) {
          top.n++; top.querySelector(".d").textContent = detail; top.querySelector("em").textContent = `×${top.n}`; return;
        }
        const row = document.createElement("div");
        row.dataset.k = key; row.n = 1; row.className = "wed-hot";
        row.innerHTML = `<code>${type}</code> &lt;${el.tagName.toLowerCase()}&gt; <span class="d"></span> <em></em>`;
        row.querySelector(".d").textContent = detail;
        list.prepend(row);
        while (list.children.length > 30) list.lastChild.remove();
      };
      ["cb1", "cb2", "tg", "sl"].forEach((n) => N(n).addEventListener("change", (e) => log("change", N(n), JSON.stringify(e.detail))));
      ["rg", "cm", "lb"].forEach((n) => N(n).addEventListener("selected", (e) => log("selected", N(n), JSON.stringify(e.detail))));
      N("in").addEventListener("input", () => log("input", N("in"), `value: "${N("in").value}"`));
      let auto = true, step = 0;
      ctx.toggle("自動示範", true, (v) => (auto = v));
      ctx.button("清除", () => (list.textContent = ""));
      const pick = (host, v) => host.querySelector(`wired-item[value="${v}"]`);
      const NOTES = ["靠窗", "靠窗座位", "靠窗座位，謝謝"];
      const ACTIONS = [
        () => clickInner(N("cb1")),
        () => clickInner(N("tg")),
        () => clickInner(ctx.$$('[data-n="rg"] wired-radio')[1 + (step >> 3) % 2]),
        () => pick(N("cm"), ["green", "coffee", "tea"][(step >> 3) % 3]).dispatchEvent(new MouseEvent("mousedown", { bubbles: true, composed: true })),
        () => pick(N("lb"), ["l", "s", "m"][(step >> 3) % 3]).click(),
        () => slideTo(N("sl"), 2 + ((step >> 3) % 8)),
        async () => { for (const t of NOTES) { typeInto(N("in"), t); await ctx.sleep(120); } },
        () => clickInner(N("cb2")),
      ];
      await whenReady();
      runLoop((async () => {
        await ctx.sleep(500);
        for (;;) {
          if (auto) { await ACTIONS[step % ACTIONS.length](); step++; }
          await ctx.sleep(900);
        }
      })());
    },
  },
  {
    id: "colors", title: "自訂顏色", paper: true,
    api: "color（筆觸 currentColor）・ --wired-*-color ・ fill",
    desc: "線條顏色跟著 CSS 的 color（currentColor），各元件的強調色則是 CSS 變數，例如 --wired-toggle-on-color、--wired-slider-knob-color、--wired-item-selected-bg。換主題只要在外層容器改變數，不用重畫；卡片的 fill 屬性則會觸發重繪。",
    hint: "點主題或打開自動輪播；右邊列出這組主題實際設定的變數",
    async mount(ctx) {
      const THEMES = [
        { name: "鉛筆", bg: "#ffffff", fill: "", v: { color: "#2b2a26", "--wired-checkbox-icon-color": "#2b2a26", "--wired-radio-icon-color": "#2b2a26", "--wired-toggle-on-color": "#6d6b64", "--wired-slider-knob-color": "#2b2a26", "--wired-progress-color": "rgba(43,42,38,.35)", "--wired-item-selected-bg": "#e7e5df", "--wired-fab-bg-color": "#2b2a26" } },
        { name: "原子筆", bg: "#f4f8ff", fill: "#dbeafe", v: { color: "#1d4ed8", "--wired-checkbox-icon-color": "#1d4ed8", "--wired-radio-icon-color": "#1d4ed8", "--wired-toggle-on-color": "#3b82f6", "--wired-slider-knob-color": "#1d4ed8", "--wired-progress-color": "rgba(29,78,216,.45)", "--wired-item-selected-bg": "#bfdbfe", "--wired-fab-bg-color": "#1d4ed8" } },
        { name: "紅筆", bg: "#fffaf5", fill: "", v: { color: "#c81e1e", "--wired-checkbox-icon-color": "#c81e1e", "--wired-radio-icon-color": "#c81e1e", "--wired-toggle-on-color": "#ef4444", "--wired-slider-knob-color": "#c81e1e", "--wired-progress-color": "rgba(200,30,30,.4)", "--wired-item-selected-bg": "#fecaca", "--wired-fab-bg-color": "#c81e1e" } },
        { name: "螢光筆", bg: "#fffef0", fill: "#fef08a", v: { color: "#2b2a26", "--wired-checkbox-icon-color": "#db2777", "--wired-radio-icon-color": "#16a34a", "--wired-toggle-on-color": "#22c55e", "--wired-slider-knob-color": "#db2777", "--wired-progress-color": "rgba(236,72,153,.55)", "--wired-item-selected-bg": "#a7f3d0", "--wired-fab-bg-color": "#f97316" } },
        { name: "粉筆", bg: "#2a3b31", fill: "", v: { color: "#f4f1e8", "--wired-checkbox-icon-color": "#fde68a", "--wired-radio-icon-color": "#fde68a", "--wired-toggle-on-color": "#86efac", "--wired-slider-knob-color": "#fde68a", "--wired-progress-color": "rgba(253,230,138,.5)", "--wired-item-selected-bg": "#4b6356", "--wired-item-selected-color": "#fff", "--wired-progress-label-background": "rgba(42,59,49,.9)", "--wired-progress-label-color": "#f4f1e8", "--wired-fab-bg-color": "#fde68a" } },
      ];
      ctx.html(`<div class="wed-wrap"><div class="wed-col"><wired-card class="wed-board" elevation="2">
          <h3>今天的待辦</h3>
          <div class="wed-row"><wired-checkbox checked>買顏料</wired-checkbox><wired-checkbox>寄明信片</wired-checkbox></div>
          <div class="wed-row"><wired-radio-group selected="b"><wired-radio name="a">上午</wired-radio><wired-radio name="b">下午</wired-radio></wired-radio-group><wired-toggle checked></wired-toggle></div>
          <wired-slider value="65"></wired-slider>
          <wired-progress value="72" percentage></wired-progress>
          <div class="wed-row" style="margin-top:8px"><wired-listbox horizontal selected="b"><wired-item value="a">低</wired-item><wired-item value="b">中</wired-item><wired-item value="c">高</wired-item></wired-listbox>
            <wired-button>完成</wired-button><wired-fab>✓</wired-fab></div>
        </wired-card><div class="wed-vars"></div></div></div>`);
      const board = ctx.$(".wed-board"), vars = ctx.$(".wed-vars");
      let cur = 0, auto = true, applied = [];
      const apply = (i) => {
        cur = i;
        const t = THEMES[i];
        applied.forEach((k) => board.style.removeProperty(k));
        applied = Object.keys(t.v);
        for (const [k, v] of Object.entries(t.v)) board.style.setProperty(k, v);
        board.style.background = t.bg;
        if (t.fill) board.setAttribute("fill", t.fill); else board.removeAttribute("fill");
        vars.innerHTML = `<b>${t.name}</b>` + Object.entries(t.v).map(([k, v]) => `<div><i style="background:${v}"></i>${k}: ${v}</div>`).join("")
          + `<div><i style="background:${t.fill || "transparent"}"></i>fill="${t.fill}"</div>`;
        grp.querySelectorAll("button").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
      };
      const grp = ctx.group(THEMES.map((t) => t.name), 0, (i) => { auto = false; tg.setAttribute("aria-pressed", "false"); apply(i); });
      const tg = ctx.toggle("自動輪播", true, (v) => (auto = v));
      await whenReady();
      apply(0);
      ctx.interval(() => { if (auto) apply((cur + 1) % THEMES.length); }, 2400);
    },
  },
  {
    id: "resize", title: "尺寸與重繪", paper: true,
    api: "ResizeObserver → wiredRender() ・ seed ・ wiredRender(true)",
    desc: "手繪線條是依元件當下尺寸畫出來的 SVG。卡片、輸入框、圖片等內建 ResizeObserver，尺寸一變就自動重畫；進度條、分隔線、滑桿沒有，這裡由頁面自己的 ResizeObserver 呼叫 wiredRender()。種子不變時同尺寸會畫出一模一樣的線，換種子才會變。",
    hint: "自動伸縮會不斷改變寬度；下方數字是每個元件實際重畫的次數",
    async mount(ctx) {
      ctx.html(`<div class="wed-wrap"><div class="wed-stretch"><div class="wed-ruler"></div><wired-card elevation="2">
          <h3>寬度會變的卡片</h3>
          <wired-input placeholder="輸入框跟著變寬"></wired-input>
          <wired-divider></wired-divider>
          <wired-progress value="58" percentage></wired-progress>
          <wired-slider value="40"></wired-slider>
          <div class="wed-row"><wired-button>按鈕的尺寸由文字決定</wired-button></div>
        </wired-card></div><div class="wed-cnt"></div></div>`);
      const stretch = ctx.$(".wed-stretch"), ruler = ctx.$(".wed-ruler"), cntEl = ctx.$(".wed-cnt");
      const SELF = new Set(["WIRED-CARD", "WIRED-INPUT"]);
      const els = ctx.$$(".wed-stretch wired-card, .wed-stretch wired-card *").filter((e) => e.tagName.startsWith("WIRED-"));
      const counts = new Map(els.map((e) => [e, 0]));
      // Count actual SVG redraws by wrapping each instance's draw().
      els.forEach((el) => { const d = el.draw; el.draw = function (...a) { counts.set(el, counts.get(el) + 1); return d.apply(this, a); }; });
      const paint = () => {
        cntEl.innerHTML = els.map((el) => `<div>${el.tagName.toLowerCase()}<b>${counts.get(el)}</b><small>${SELF.has(el.tagName) ? "內建 ResizeObserver" : "頁面呼叫 wiredRender()"}</small></div>`).join("");
      };
      const manual = els.filter((el) => !SELF.has(el.tagName) && el.tagName !== "WIRED-BUTTON");
      const ro = new ResizeObserver(() => manual.forEach((el) => el.wiredRender()));
      manual.forEach((el) => ro.observe(el));
      ctx.onCleanup(() => ro.disconnect());
      let auto = true, t = 0;
      ctx.toggle("自動伸縮", true, (v) => (auto = v));
      ctx.button("重新抽筆觸", () => { reseed(stretch); paint(); }, { primary: true });
      ctx.button("同種子重畫", () => { reseed(stretch, true); paint(); });
      await whenReady();
      ctx.raf((_, dt) => {
        if (!auto) return;
        t += dt / 1000;
        // Oscillate between 35% and 100% of the usable width (capped at 900px).
        const full = Math.min(stretch.parentElement.clientWidth - 28, 900);
        const w = Math.round(full * (0.675 + 0.325 * Math.sin(t * 1.1)));
        stretch.style.width = `${w}px`;
        ruler.textContent = `width: ${w}px / ${full}px`;
      });
      ctx.interval(paint, 250);
      paint();
    },
  },
  {
    id: "elevation", title: "高度與填色", paper: true,
    api: "elevation=\"1~5\" ・ <wired-card fill> ・ <wired-divider> ・ <wired-image>",
    desc: "elevation 用多畫幾條逐漸變淡的偏移線表現紙張疊起來的厚度，卡片、按鈕、分隔線、圖片與連結都支援 1 到 5 級。卡片的 fill 會用 rough.js 的排線填滿，像麥克筆塗過的便利貼。",
    hint: "「重新抽筆觸」換一套線條；「填色」切換便利貼的 fill 屬性",
    async mount(ctx) {
      const NOTES = [["#fde68a", "週三讀書會<br>帶第 4 章筆記"], ["#bfe3f6", "買水彩紙<br>A5 × 20 張"], ["#fbcfe8", "回覆工作坊<br>報名信"], ["#c7f0d2", "澆花 🌱"]];
      ctx.html(`<div class="wed-wrap">
        <div class="wed-elev">${[1, 2, 3, 4, 5].map((e) => `<wired-card elevation="${e}"><div>卡片<span>elevation ${e}</span></div></wired-card>`).join("")}</div>
        <div class="wed-elev">${[1, 2, 3, 4, 5].map((e) => `<wired-button elevation="${e}">按鈕 ${e}</wired-button>`).join("")}</div>
        <div class="wed-notes">${NOTES.map(([c, t]) => `<wired-card elevation="2" fill="${c}" data-fill="${c}">${t}</wired-card>`).join("")}<wired-image elevation="3" src="_shared/img/photo-5.jpg"></wired-image></div>
        <div class="wed-divs">${[1, 2, 3].map((e) => `<span class="wed-tag">&lt;wired-divider elevation="${e}"&gt;</span><wired-divider elevation="${e}"></wired-divider>`).join("")}</div>
      </div>`);
      const wrap = ctx.$(".wed-wrap");
      ctx.button("重新抽筆觸", () => reseed(wrap), { primary: true });
      ctx.toggle("填色", true, (v) => ctx.$$("[data-fill]").forEach((c) => (v ? c.setAttribute("fill", c.dataset.fill) : c.removeAttribute("fill"))));
    },
  },
  {
    id: "tabs", title: "分頁與日曆", paper: true,
    api: "<wired-tabs> / <wired-tab> ・ <wired-calendar> selected ・ <wired-listbox> ・ <wired-search-input>",
    desc: "組合型元件：wired-tabs 依 name 切換分頁；wired-calendar 用 locale 顯示中文月份，點日期觸發 selected；清單與搜尋框也是同一套手繪筆觸。自動示範會切分頁、點日期、選清單、在搜尋框打字。",
    hint: "點分頁標籤切換；日曆可按 << >> 換月份",
    async mount(ctx) {
      const PLACES = ["台北・大安教室", "台中・審計新村", "台南・神農街", "花蓮・文創園區", "高雄・駁二", "新竹・東門市場"];
      ctx.html(`<div class="wed-wrap"><wired-tabs class="wed-tabs" selected="cal">
        <wired-tab name="cal" label="日曆"><div class="wed-tabpane"><wired-calendar locale="zh-TW"></wired-calendar><div class="wed-out" data-o="cal">點一個日期</div></div></wired-tab>
        <wired-tab name="list" label="清單"><div class="wed-tabpane"><wired-listbox selected="b">
          <wired-item value="a">水彩明信片</wired-item><wired-item value="b">木工杯墊</wired-item><wired-item value="c">手捏陶杯</wired-item><wired-item value="d">植物拓印</wired-item></wired-listbox><div class="wed-out" data-o="list"></div></div></wired-tab>
        <wired-tab name="search" label="搜尋"><div class="wed-tabpane"><div><wired-search-input placeholder="搜尋地點"></wired-search-input><ul class="wed-res"></ul></div></div></wired-tab>
      </wired-tabs></div>`);
      const tabs = ctx.$("wired-tabs"), cal = ctx.$("wired-calendar"), lb = ctx.$(".wed-tabpane wired-listbox"), si = ctx.$("wired-search-input"), res = ctx.$(".wed-res");
      const out = (k) => ctx.$(`[data-o="${k}"]`);
      const showList = () => (out("list").innerHTML = `selected：<b>${lb.selected}</b><br>${lb.querySelector(`[value="${lb.selected}"]`).textContent}`);
      const filter = () => {
        const q = si.value.trim();
        const hits = PLACES.filter((p) => !q || p.includes(q));
        res.innerHTML = hits.length ? hits.map((p) => `<li>${p}</li>`).join("") : "<li>沒有符合的地點</li>";
      };
      cal.addEventListener("selected", (e) => (out("cal").innerHTML = `selected 事件<br><b>${e.detail.selected}</b>`));
      lb.addEventListener("selected", showList);
      si.addEventListener("input", filter);
      let auto = true, round = 0;
      ctx.toggle("自動示範", true, (v) => (auto = v));
      await whenReady();
      await ctx.frame(2);
      cal.format = (d) => `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
      cal.resized();
      showList(); filter();
      const tab = (n) => { tabs.selected = n; };
      runLoop((async () => {
        await ctx.sleep(900);
        for (;;) {
          if (!auto) { await ctx.sleep(400); continue; }
          tab("cal"); await ctx.sleep(700);
          const days = [...cal.shadowRoot.querySelectorAll("td[value]")].filter((td) => td.getAttribute("value") && !td.classList.contains("dimmed"));
          const td = days[(round * 5 + 9) % Math.max(1, days.length)];
          if (td) td.dispatchEvent(new MouseEvent("mousedown", { bubbles: true, composed: true }));
          await ctx.sleep(1500);
          if (!auto) continue;
          tab("list"); await ctx.sleep(700);
          lb.querySelectorAll("wired-item")[(round + 2) % 4].click(); await ctx.sleep(1400);
          if (!auto) continue;
          tab("search"); await ctx.sleep(500);
          for (const q of ["台", "台南", "", "市"]) { typeInto(si, q); await ctx.sleep(600); }
          await ctx.sleep(800);
          round++;
        }
      })());
    },
  },
  {
    id: "stress", title: "極限測試", kind: "stress", paper: true,
    api: "N 個混合元件 ・ 首次繪製 ・ 筆觸抖動重繪",
    desc: "每一級清空後一次插入 N 個按鈕、核取、輸入框、卡片、進度條與開關，計時到每個元件都加上 wired-rendered（rough.js SVG 畫完）為止。接著開啟手繪動畫常見的「筆觸抖動」：每格換掉 5% 元件的種子並強制重繪，量此時的 FPS。",
    hint: "按「自動加壓」；右邊會實際放進每一級數量的元件",
    mount(ctx) {
      ctx.html(`<div class="wed-sbox"><div class="wed-sgrid"></div></div>`);
      const grid = ctx.$(".wed-sgrid");
      const KINDS = [
        (i) => `<wired-button>按鈕 ${i}</wired-button>`,
        (i) => `<wired-checkbox ${i % 3 ? "" : "checked"}>項目 ${i}</wired-checkbox>`,
        (i) => `<wired-input placeholder="輸入 ${i}"></wired-input>`,
        (i) => `<wired-card>卡片 ${i}</wired-card>`,
        (i) => `<wired-progress value="${(i * 37) % 100}"></wired-progress>`,
        (i) => `<wired-toggle ${i % 2 ? "checked" : ""}></wired-toggle>`,
      ];
      let first = 0, n = 0, els = [], cursor = 0, perFrame = 0;
      const boil = ctx.raf(() => {
        if (!els.length) return;
        perFrame = Math.max(1, Math.ceil(els.length / 20));
        for (let k = 0; k < perFrame; k++) {
          const el = els[cursor++ % els.length];
          if (el.wiredRender) { el.seed = rnd(); el.wiredRender(true); }
        }
      });
      ctx.onCleanup(() => { boil(); els = []; grid.textContent = ""; });
      const apply = async (N) => {
        els = []; grid.textContent = "";
        await whenReady();
        await ctx.frame();
        const t0 = performance.now();
        grid.innerHTML = Array.from({ length: N }, (_, i) => KINDS[i % KINDS.length](i + 1)).join("");
        const kids = [...grid.children];
        while (ctx.active && kids.some((k) => !k.classList.contains("wired-rendered")) && performance.now() - t0 < 15000) await ctx.frame();
        first = performance.now() - t0;
        n = N; els = kids;
      };
      ctx.ramp({
        label: "元件", unit: "個",
        steps: [20, 50, 100, 200, 400, 800, 1600],
        apply,
        minFps: 30,
        metrics: () => ({
          "首次繪製": `${first.toFixed(0)} ms`,
          "每個元件": n ? `${((first / n) * 1000).toFixed(0)} µs` : "…",
          "每格重繪": `${perFrame} 個`,
          "SVG 路徑": `${n ? grid.children.length && [...grid.children].reduce((s, k) => s + (k.shadowRoot ? k.shadowRoot.querySelectorAll("path").length : 0), 0) : 0}`,
        }),
        note: "每個元件各有 Shadow DOM 與一份 rough.js 產生的 SVG；首次繪製包含 Lit 渲染、量尺寸與畫線。抖動時每格重畫 N/20 個元件，成本隨數量線性上升。",
      });
    },
  },
] });
</script>
