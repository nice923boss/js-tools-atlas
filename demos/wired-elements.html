<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wired Elements 示範：手繪風報名表單</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lxgw-wenkai-tc@5.3.0/400.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body.paper {
    --hand: "LXGW WenKai TC", var(--font);
    font-family: var(--hand); color: #2b2a26;
    background: repeating-linear-gradient(transparent 0 27px, rgba(31,143,184,.10) 27px 28px), #fbfaf5;
  }
  .wrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 12px 14px 46px; overflow-y: auto; }
  wired-card { width: min(780px, 100%); background: #fff; padding: 14px 18px 16px; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .head h1 { margin: 0; font-size: 22px; font-weight: 400; white-space: nowrap; }
  .head wired-progress { flex: 1; min-width: 0; --wired-progress-color: rgba(214,31,105,.55); --wired-progress-font-size: 13px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 26px; }
  wired-spinner[hidden] { display: none; }
  .f { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .f > span { font-size: 15px; color: #6d6b64; }
  wired-input, wired-textarea, wired-slider, wired-combo { width: 100%; font-family: var(--hand); font-size: 16px; }
  wired-combo { --wired-combo-popup-bg: #fffef6; --wired-item-selected-bg: #fde68a; }
  wired-radio, wired-checkbox { font-size: 16px; margin-right: 10px; }
  wired-radio-group { display: flex; flex-wrap: wrap; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .money { font-size: 18px; color: #d61f69; min-width: 84px; }
  wired-slider { --wired-slider-knob-color: #d61f69; --wired-slider-bar-color: #2b2a26; flex: 1; }
  wired-toggle { --wired-toggle-on-color: #2f9e55; }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  wired-button { font-family: var(--hand); font-size: 17px; }
  wired-button.go { background: #fde68a; }
  wired-dialog { --wired-dialog-z-index: 200; font-family: var(--hand); }
  .dlg { min-width: 240px; max-width: 320px; font-size: 16px; line-height: 1.8; }
  .dlg h2 { margin: 0 0 4px; font-size: 20px; font-weight: 400; }
  .dlg .end { text-align: right; margin-top: 8px; }
  @media (max-width: 640px) {
    .wrap { display: block; padding: 8px 8px 46px; }
    wired-card { display: block; width: 100%; }
    .cols { grid-template-columns: minmax(0, 1fr); }
    .head { gap: 8px; }
    .head .long { display: none; }
    .opt { display: none; }
    .head h1 { font-size: 18px; }
    wired-card { padding: 10px 12px 12px; }
    .f { margin-top: 2px; }
  }
</style>
</head>
<body class="paper">
<div class="wrap">
  <wired-card elevation="3">
    <div class="head">
      <h1>✏️ <span class="long">週末手作</span>工作坊報名</h1>
      <wired-progress id="progress" value="0" percentage></wired-progress>
    </div>
    <div class="cols">
      <div>
        <label class="f"><span>姓名</span><wired-input id="name" placeholder="例如：林小美" value="林小美"></wired-input></label>
        <label class="f"><span>電子信箱</span><wired-input id="email" type="email" placeholder="name@example.com"></wired-input></label>
        <div class="f"><span>上課城市</span>
          <wired-combo id="city" selected="txg">
            <wired-item value="tpe">台北・大安教室</wired-item>
            <wired-item value="txg">台中・審計新村</wired-item>
            <wired-item value="tnn">台南・神農街</wired-item>
            <wired-item value="hua">花蓮・文創園區</wired-item>
          </wired-combo>
        </div>
        <div class="f"><span>手作經驗</span>
          <wired-radio-group id="level" selected="new">
            <wired-radio name="new">第一次</wired-radio>
            <wired-radio name="some">玩過幾次</wired-radio>
            <wired-radio name="pro">很熟練</wired-radio>
          </wired-radio-group>
        </div>
      </div>
      <div>
        <div class="f opt"><span>想學的主題</span>
          <div class="row" id="topics">
            <wired-checkbox data-t="水彩明信片" checked>水彩明信片</wired-checkbox>
            <wired-checkbox data-t="木工杯墊">木工杯墊</wired-checkbox>
            <wired-checkbox data-t="手捏陶杯">手捏陶杯</wired-checkbox>
          </div>
        </div>
        <div class="f"><span>材料費預算</span>
          <div class="row"><wired-slider id="budget" min="0" max="3000" value="1200"></wired-slider><span class="money" id="money"></span></div>
        </div>
        <div class="f opt"><span>訂閱每月活動通知</span>
          <div class="row"><wired-toggle id="news" checked></wired-toggle><span id="newsText">好啊</span></div>
        </div>
        <label class="f opt"><span>想對老師說的話</span><wired-textarea id="memo" rows="2" placeholder="例如：想帶小孩一起參加"></wired-textarea></label>
      </div>
    </div>
    <div class="actions">
      <wired-button class="go" id="submit" elevation="2">送出報名</wired-button>
      <wired-button id="reset">清空</wired-button>
      <wired-spinner id="spin" hidden></wired-spinner>
    </div>
  </wired-card>
</div>
<wired-dialog id="dlg"><div class="dlg" id="dlgBody"></div></wired-dialog>
<div class="hint">元件皆為手繪 SVG・填完按「送出報名」</div>

<script src="https://cdn.jsdelivr.net/npm/wired-elements@2.1.2/lib/wired-elements-iife.js"></script>
<script>
// Hand-drawn form built from wired-elements web components; progress reflects how many fields are filled.
const $ = (id) => document.getElementById(id);
const CITY = { tpe: "台北・大安教室", txg: "台中・審計新村", tnn: "台南・神農街", hua: "花蓮・文創園區" };
const LEVEL = { new: "第一次", some: "玩過幾次", pro: "很熟練" };
const topics = () => [...document.querySelectorAll("#topics wired-checkbox")].filter((c) => c.checked).map((c) => c.dataset.t);

function refresh() {
  $("money").textContent = `NT$${Math.round($("budget").value / 100) * 100}`;
  $("newsText").textContent = $("news").checked ? "好啊" : "先不用";
  const filled = [
    $("name").value.trim(), /\S+@\S+\.\S+/.test($("email").value), $("city").selected, $("level").selected, topics().length, $("budget").value > 0,
  ].filter(Boolean).length;
  $("progress").value = Math.round((filled / 6) * 100);
}

["name", "email", "memo"].forEach((id) => $(id).addEventListener("input", refresh));
["city", "level"].forEach((id) => $(id).addEventListener("selected", refresh));
["budget", "news"].forEach((id) => $(id).addEventListener("change", refresh));
$("budget").addEventListener("input", refresh);
document.querySelectorAll("#topics wired-checkbox").forEach((c) => c.addEventListener("change", refresh));

function openDialog(html) {
  $("dlgBody").innerHTML = `${html}<div class="end"><wired-button id="close">知道了</wired-button></div>`;
  $("dlg").open = true;
  $("close").addEventListener("click", () => ($("dlg").open = false));
}

$("submit").addEventListener("click", () => {
  if (!$("name").value.trim()) return openDialog("<h2>還差一點</h2>請先寫下你的姓名 🙂");
  $("spin").hidden = false;
  $("spin").spinning = true;
  setTimeout(() => {
    $("spin").spinning = false;
    $("spin").hidden = true;
    openDialog(`<h2>🎉 報名成功</h2>
      ${$("name").value}，我們在 <b>${CITY[$("city").selected] || "未選城市"}</b> 等你！<br>
      經驗：${LEVEL[$("level").selected] || "未填"}<br>
      主題：${topics().join("、") || "還沒決定"}<br>
      預算：${$("money").textContent}・通知：${$("news").checked ? "訂閱" : "不訂閱"}`);
  }, 900);
});

$("reset").addEventListener("click", () => {
  $("name").value = "";
  $("email").value = "";
  $("memo").value = "";
  document.querySelectorAll("#topics wired-checkbox").forEach((c) => (c.checked = false));
  $("budget").value = 0;
  refresh();
});

// Let the components finish their first render, then show the initial progress.
customElements.whenDefined("wired-progress").then(() => setTimeout(refresh, 50));
</script>
</body>
</html>
