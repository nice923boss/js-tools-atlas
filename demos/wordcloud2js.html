<style>
  .wc-fill { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); }

<script>
// wordcloud2.js showcase: eight scenes from the classic keyword cloud to a word-count benchmark.
const css = getComputedStyle(document.documentElement);
const C = ["--c1", "--c2", "--c3", "--c4", "--c5", "--c6"].map((v) => css.getPropertyValue(v).trim());
const BG = css.getPropertyValue("--bg").trim();
const MUTED = css.getPropertyValue("--muted").trim();
const FONT = css.getPropertyValue("--font").trim();
const DPR = Math.min(2, window.devicePixelRatio || 1);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };

// Six categories of JavaScript ecosystem keywords; weights are subjective sample values.
const CATS = [
  { name: "語言核心", words: [["非同步", 100], ["閉包", 86], ["事件迴圈", 82], ["原型鏈", 70], ["箭頭函式", 64], ["解構賦值", 52], ["展開運算子", 44], ["生成器", 38], ["迭代器", 36], ["正規表示式", 40], ["型別推斷", 42], ["裝飾器", 32], ["不可變", 38], ["純函式", 42], ["副作用", 38]] },
  { name: "框架架構", words: [["前端框架", 90], ["響應式", 80], ["元件化", 78], ["狀態管理", 70], ["伺服器渲染", 60], ["靜態生成", 48], ["鉤子", 52], ["路由", 50], ["微前端", 40], ["網頁元件", 48], ["單頁應用", 56], ["函式式", 50]] },
  { name: "工具鏈", words: [["打包工具", 68], ["模組化", 76], ["套件管理", 58], ["熱更新", 50], ["轉譯器", 42], ["程式碼檢查", 38], ["格式化", 34], ["型別檢查", 72], ["單元測試", 56], ["端對端測試", 44], ["原始碼對應", 30]] },
  { name: "效能體驗", words: [["效能優化", 62], ["懶載入", 44], ["程式碼分割", 52], ["樹搖優化", 44], ["快取", 46], ["防抖節流", 44], ["記憶體洩漏", 34], ["垃圾回收", 36], ["即時編譯", 38], ["工作執行緒", 32], ["無障礙", 40], ["國際化", 36]] },
  { name: "視覺互動", words: [["資料視覺化", 66], ["動畫", 50], ["三維繪圖", 44], ["著色器", 36], ["物理引擎", 34], ["粒子特效", 38], ["地圖", 40], ["圖表", 54]] },
  { name: "平台社群", words: [["開源", 74], ["瀏覽器", 64], ["全端", 48], ["無伺服器", 42], ["邊緣運算", 34], ["社群", 54], ["串流", 36], ["漸進式網頁", 46]] },
].map((c, i) => ({ ...c, color: C[i] }));
const WORDS = CATS.flatMap((c, ci) => c.words.map(([w, s]) => ({ w, s, ci })));
const CAT_OF = Object.fromEntries(WORDS.map((x) => [x.w, x.ci]));
const WEIGHT = Object.fromEntries(WORDS.map((x) => [x.w, x.s]));
const jsList = () => WORDS.map((x) => [x.w, x.s]);
// Repeat a list at smaller weights so a shape or mask fills up instead of leaving gaps.
const layered = (list, scales) => scales.flatMap((k) => list.map(([w, s]) => [w, s * k]));

// Match a canvas bitmap to its CSS box at the capped pixel ratio.
function fit(canvas) {
  const W = Math.max(1, canvas.clientWidth), H = Math.max(1, canvas.clientHeight);
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  return { W, H };
}

// Redraw whenever a box changes size. Unlike ctx.onResize this also catches the control bar
// settling after mount, so the canvas bitmap never keeps a stale height.
function onBox(ctx, el, fn) {
  let pending = 0, lw = -1, lh = -1;
  const ro = new ResizeObserver(() => {
    cancelAnimationFrame(pending);
    pending = requestAnimationFrame(() => {
      const w = el.clientWidth, h = el.clientHeight;
      if (w === lw && h === lh) return;
      lw = w; lh = h;
      fn();
    });
  });
  ro.observe(el);
  ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(pending); });
}

// Bind wordcloud2 to one or more elements of a scene. go(opts) supersedes any running layout and
// resolves on wordcloudstop; stop() dispatches wordcloudstart, which the library treats as "stop the loop".
function cloud(ctx, els) {
  const targets = [].concat(els), el = targets[0];
  let cur = null;
  const end = (aborted) => {
    if (!cur) return;
    const c = cur; cur = null;
    c.resolve({ placed: c.placed, seen: c.seen, aborted, ms: performance.now() - c.t0 });
  };
  ctx.on(el, "wordclouddrawn", (e) => { if (!cur) return; cur.seen++; if (e.detail.drawn) cur.placed++; if (cur.onDrawn) cur.onDrawn(e.detail, cur); });
  ctx.on(el, "wordcloudabort", () => { if (cur) cur.aborted = true; });
  ctx.on(el, "wordcloudstop", () => end(cur ? cur.aborted : false));
  const stop = () => { end(true); el.dispatchEvent(new CustomEvent("wordcloudstart")); };
  ctx.onCleanup(stop);
  const go = (opts, onDrawn) => {
    end(true);
    return new Promise((resolve) => {
      cur = { resolve, placed: 0, seen: 0, aborted: false, t0: performance.now(), onDrawn };
      WordCloud(targets.length > 1 ? targets : el, { fontFamily: FONT, backgroundColor: "rgba(0,0,0,0)", ...opts });
    });
  };
  return { go, stop, get running() { return !!cur; } };
}

// Polygon outline of Taiwan (lon, lat), coarse but recognisable.
const TAIWAN = [[121.54, 25.30], [121.74, 25.15], [121.99, 25.01], [121.85, 24.85], [121.86, 24.59], [121.75, 24.30], [121.62, 23.98], [121.50, 23.55],
  [121.37, 23.10], [121.15, 22.75], [120.90, 22.35], [120.85, 21.90], [120.73, 21.93], [120.59, 22.37], [120.45, 22.46], [120.28, 22.60],
  [120.13, 23.00], [120.15, 23.38], [120.22, 23.75], [120.40, 24.10], [120.52, 24.28], [120.68, 24.55], [120.92, 24.85], [121.08, 25.03],
  [121.25, 25.12], [121.40, 25.18]];
const TW_WORDS = [["珍珠奶茶", 100], ["夜市", 92], ["手搖飲", 74], ["滷肉飯", 78], ["牛肉麵", 80], ["小籠包", 76], ["日月潭", 74], ["阿里山", 72],
  ["太魯閣", 70], ["台北101", 68], ["九份", 66], ["墾丁", 64], ["鹽酥雞", 62], ["臭豆腐", 60], ["鳳梨酥", 58], ["芒果冰", 58], ["蚵仔煎", 56],
  ["玉山", 54], ["澎湖", 52], ["便利商店", 52], ["豆花", 50], ["溫泉", 50], ["早餐店", 50], ["淡水", 48], ["肉圓", 48], ["機車", 48], ["擔仔麵", 46],
  ["胡椒餅", 46], ["合歡山", 46], ["老街", 46], ["高鐵", 46], ["刈包", 44], ["綠島", 44], ["鹿港", 44], ["平溪天燈", 44], ["熱炒", 44], ["野柳", 42],
  ["駁二", 42], ["清境", 42], ["媽祖遶境", 42], ["安平古堡", 40], ["赤崁樓", 40], ["旗津", 40], ["鐵道便當", 40], ["廟口", 38], ["七股鹽山", 34]];
const HEART_WORDS = [["謝謝", 100], ["喜歡", 90], ["陪伴", 80], ["擁抱", 72], ["微笑", 70], ["溫暖", 68], ["加油", 66], ["想念", 64], ["幸福", 62],
  ["晚安", 60], ["珍惜", 58], ["牽手", 56], ["心動", 56], ["信任", 54], ["驚喜", 52], ["祝福", 52], ["約定", 50], ["勇氣", 50], ["甜蜜", 50],
  ["分享", 48], ["回憶", 48], ["默契", 46], ["照顧", 46], ["守護", 46], ["可愛", 44], ["早安", 44], ["笑容", 44], ["理解", 42], ["浪漫", 42], ["願意", 40]];

// Mask shapes: each traces a path (or text) in CSS pixels for a W x H box.
const MASKS = [
  { label: "台灣", words: TW_WORDS, div: 5.4, rot: 0.45, palette: [C[3], C[1], "#5fb7a5", C[0]], trace(g, W, H) {
    const k = Math.cos(23.7 * Math.PI / 180);
    const pts = TAIWAN.map(([lon, lat]) => [(lon - 121) * k, 23.7 - lat]);
    const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
    const x0 = Math.min(...xs), y0 = Math.min(...ys), bw = Math.max(...xs) - x0, bh = Math.max(...ys) - y0;
    const s = Math.min(W * 0.92 / bw, H * 0.94 / bh), ox = (W - bw * s) / 2, oy = (H - bh * s) / 2;
    g.beginPath();
    pts.forEach(([x, y], i) => g[i ? "lineTo" : "moveTo"](ox + (x - x0) * s, oy + (y - y0) * s));
    g.closePath();
  } },
  { label: "JS 字樣", words: jsList(), div: 7, rot: 0.3, palette: [C[0], "#ffe866", "#d9c21a", C[4]], text: "JS" },
  { label: "愛心", words: HEART_WORDS, div: 4.6, rot: 0.2, palette: [C[2], "#ff6fa8", C[4], "#ffc2d9"], trace(g, W, H) {
    const s = Math.min(W / 34, H / 24), cx = W / 2, cy = H / 2 - 6 * s;
    g.beginPath();
    for (let i = 0; i <= 120; i++) {
      const t = (i / 120) * Math.PI * 2;
      const x = 16 * Math.pow(Math.sin(t), 3), y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      g[i ? "lineTo" : "moveTo"](cx + x * s, cy + (y + 1) * s);
    }
    g.closePath();
  } },
];
// Paint the mask: inside = exact background color (free cells), outside = 1 step off (occupied cells).
function paintMask(canvas, mask, W, H, outline) {
  const n = parseInt(BG.slice(1), 16), b = n & 255;
  const outside = `#${(((n >> 8) << 8) | (b === 255 ? 254 : b + 1)).toString(16).padStart(6, "0")}`;
  const g = canvas.getContext("2d", { willReadFrequently: true });
  // save/restore matters: wordcloud2 draws on this same context and does not reset
  // transform or textAlign, so leftovers would shift every word off its reserved cells.
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = outside;
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const o = outline.getContext("2d");
  o.setTransform(DPR, 0, 0, DPR, 0, 0);
  o.clearRect(0, 0, W, H);
  o.strokeStyle = rgba(C[1], 0.35);
  o.lineWidth = 1.5;
  o.setLineDash([5, 5]);
  if (mask.text) {
    const font = (px) => `900 ${px}px ${FONT}`;
    g.font = font(100);
    const px = Math.min(H * 0.95, (W * 0.9) / (g.measureText(mask.text).width / 100));
    for (const c of [g, o]) { c.font = font(px); c.textAlign = "center"; c.textBaseline = "middle"; }
    g.fillStyle = BG;
    g.fillText(mask.text, W / 2, H / 2 + px * 0.04);
    o.strokeText(mask.text, W / 2, H / 2 + px * 0.04);
  } else {
    mask.trace(g, W, H);
    g.fillStyle = BG;
    g.fill();
    mask.trace(o, W, H);
    o.stroke();
  }
  g.restore();
  // Free area in CSS px^2: count the pixels that exactly match the background color.
  const px = g.getImageData(0, 0, canvas.width, canvas.height).data, r = n >> 16, gr = (n >> 8) & 255;
  let free = 0;
  for (let i = 0; i < px.length; i += 4) if (px[i] === r && px[i + 1] === gr && px[i + 2] === b) free++;
  return free / (DPR * DPR);
}

// Synthetic two-part terms for the benchmark (repeats are fine: the layout cost is what is measured).
const SYL = ["資料", "效能", "模組", "事件", "元件", "狀態", "路由", "快取", "型別", "測試", "渲染", "動畫", "圖表", "網格", "佈局", "串流",
  "封裝", "迭代", "閉包", "代理", "編譯", "打包", "樣式", "互動", "佇列", "索引", "記憶", "排程", "雲端", "邊緣", "向量"];
const synth = (n) => Array.from({ length: n }, (_, i) => [SYL[i % SYL.length] + SYL[(i * 7 + 3) % SYL.length], 100 / Math.pow(1 + i / 4, 0.6)]);

Showcase.run({ scenes: [
  {
    id: "keywords", title: "關鍵字雲",
    api: "WordCloud(canvas, { list, weightFactor, color, shape, hover })",
    desc: "六類共 66 個 JavaScript 生態關鍵字，字級依權重、顏色依分類，放不下的詞用 shrinkToFit 自動縮小。點下方分類只看單一類別，滑過字詞會框出範圍並顯示權重。權重為主觀設定的示意資料。",
    hint: "點下方分類只看該類・滑過字詞看權重・右上切換形狀",
    mount(ctx) {
      ctx.html(`<div class="wc-fill wc-col"><div class="wc-box"><canvas></canvas><div class="wc-hit"></div><div class="wc-tip"></div></div>
        <div class="wc-foot"><div class="wc-legend"></div><div class="wc-count"></div></div></div>`);
      const canvas = ctx.$("canvas"), box = ctx.$(".wc-box"), hit = ctx.$(".wc-hit"), tip = ctx.$(".wc-tip"), count = ctx.$(".wc-count");
      const wc = cloud(ctx, canvas);
      const SHAPES = [["圓形", "circle"], ["心形", "cardioid"], ["菱形", "diamond"], ["星形", "star"], ["五邊形", "pentagon"]];
      let shape = 0, rotate = false, only = -1;
      ctx.$(".wc-legend").innerHTML = CATS.map((c, i) => `<button class="wc-chip" type="button" data-i="${i}" aria-pressed="false" style="--c:${c.color}"><i></i>${c.name}</button>`).join("");
      const chips = ctx.$$(".wc-chip");
      chips.forEach((b) => ctx.on(b, "click", () => {
        const i = +b.dataset.i;
        only = only === i ? -1 : i;
        chips.forEach((x) => x.setAttribute("aria-pressed", String(+x.dataset.i === only)));
        draw();
      }));

          return `放入 ${r.placed}／${n}`;
        },
        note: "wait: 0 時每個詞用 postMessage 排一次下一輪，不會長時間卡住畫面。格子越細，判斷空位越精準、可塞進的詞越多，但每個詞要檢查的格子也越多。",
      });
    },
  },
] });
</script>
