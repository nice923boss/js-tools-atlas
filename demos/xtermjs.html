<style>
  .xt-board { position: absolute; inset: 0; padding: calc(var(--sc-ctl-h, 0px) + 10px) 10px calc(var(--sc-ctl-b, 0px) + 10px); display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .xt-win { flex: 1; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #0b0d10; box-shadow: 0 14px 34px rgba(0, 0, 0, .35); transition: box-shadow .2s; }
  .xt-win.light { background: #fbfaf6; }
  .xt-win.bell { box-shadow: 0 0 0 3px var(--c3), 0 14px 34px rgba(0, 0, 0, .35); }
  .xt-chrome { flex: none; display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--bg-2); border-bottom: 1px solid var(--line); min-width: 0; font-size: 12.5px; }
  .xt-dots { flex: none; display: flex; gap: 6px; }
  .xt-dots i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
  .xt-dots i:nth-child(2) { background: #febc2e; }
  .xt-dots i:nth-child(3) { background: #28c840; }
  .xt-path { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .xt-size { margin-left: auto; flex: none; font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; }
  .xt-term { flex: 1; min-height: 0; padding: 6px 2px 4px 8px; }
  .xt-term .xterm { height: 100%; }
  .xt-row { flex: none; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .xt-quick { flex: 1 1 0; overflow-x: auto; scrollbar-width: none; padding: 1px; }
  .xt-quick .btn { flex: none; padding: 6px 10px; font: 500 12px/1 var(--mono); }
  .xt-tour { margin-left: auto; flex: none; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .xt-tour::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c4); animation: xt-blink 1.2s infinite; }
  .xt-tour.off::before { background: var(--muted); animation: none; }
  @keyframes xt-blink { 50% { opacity: .25; } }
  .xt-q { flex: 1; min-width: 0; max-width: 320px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-2); color: var(--fg); font: 13px var(--font); }
  .xt-q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .xt-cnt { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .xt-cnt b { color: var(--accent); font-family: var(--mono); }
  .xt-foot { flex: none; font-size: 12px; color: var(--muted); min-height: 1.4em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xt-foot b { color: var(--c2); font-family: var(--mono); font-weight: 500; }
  .xt-fit { flex: 1; min-height: 0; display: flex; justify-content: center; }
  .xt-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 8px; }
  .xt-log { min-height: 0; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg-2); padding: 6px 8px; font-size: 12px; scrollbar-width: thin; }
  .xt-log h4 { margin: 2px 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); }
  .xt-log div { padding: 3px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .xt-log em { font-style: normal; color: var(--accent); margin-right: 6px; }
  .xt-log code { font: 11.5px var(--mono); color: var(--c2); }
  @media (max-width: 700px) { .xt-split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.6fr) minmax(0, 1fr); } }
  .xt-stress { position: absolute; inset: calc(var(--sc-ctl-h, 0px) + 8px) 8px 8px 350px; display: flex; }
  @media (max-width: 760px) { .xt-stress { inset: 8px 8px calc(var(--sc-ctl-b, 0px) + 8px) 8px; } }
  @media (max-width: 560px) {
    .xt-tour, .xt-chrome .ver { display: none; }
    .xt-term { padding: 4px 0 2px 4px; }
  }

<body>
<script src="_shared/showcase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.12.0/lib/addon-web-links.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-search@0.16.0/lib/addon-search.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.9.0/lib/addon-unicode11.js"></script>
<script>
(() => {
  const WEBGL_URL = "https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.19.0/lib/addon-webgl.js";
  const { fmt } = Showcase;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const quiet = (p) => p.catch((e) => { if (e.name !== "AbortError") console.error(e); });

  // ---------- ANSI helpers ----------
  const R = "\x1b[0m", B = "\x1b[1m";
  const fg = (r, g, b) => `\x1b[38;2;${r};${g};${b}m`;
  const bg = (r, g, b) => `\x1b[48;2;${r};${g};${b}m`;
  const ACC = fg(247, 223, 30), CY = fg(76, 201, 240), GR = fg(123, 211, 137), PK = fg(247, 37, 133), MU = fg(140, 138, 130);
  const nl = (s) => s.replace(/\n/g, "\r\n");

  // Cell width, mirroring xterm.js' built-in Unicode v6 provider; v11 also makes emoji wide.
  function wcw(ch, v11 = false) {
    const cp = ch.codePointAt(0);
    if (cp < 32 || (cp >= 0x7f && cp < 0xa0)) return 0;
    if ((cp >= 0x300 && cp <= 0x36f) || (cp >= 0x200b && cp <= 0x200f) || cp === 0xfe0f) return 0;
    if (cp < 0x1100) return 1;
    if (v11 && cp >= 0x1f300 && cp <= 0x1faff) return 2;
    if (cp <= 0x115f || cp === 0x2329 || cp === 0x232a ||
        (cp >= 0x2e80 && cp <= 0xa4cf && cp !== 0x303f) || (cp >= 0xac00 && cp <= 0xd7a3) ||
        (cp >= 0xf900 && cp <= 0xfaff) || (cp >= 0xfe10 && cp <= 0xfe19) || (cp >= 0xfe30 && cp <= 0xfe6f) ||
        (cp >= 0xff00 && cp <= 0xff60) || (cp >= 0xffe0 && cp <= 0xffe6) ||
        (cp >= 0x20000 && cp <= 0x2fffd) || (cp >= 0x30000 && cp <= 0x3fffd)) return 2;
    return 1;
  }
  const strW = (s, v11) => Array.from(s.replace(/\x1b\[[0-9;:]*m/g, "")).reduce((n, ch) => n + wcw(ch, v11), 0);
  const padW = (s, w, v11) => s + " ".repeat(Math.max(0, w - strW(s, v11)));
  function hsl(h, s, l) {
    const f = (n) => {
      const k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l);
      return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1))));
    };
    return [f(0), f(8), f(4)];
  }

  // ---------- terminal factory ----------
  const FONT = '"JetBrains Mono", "Cascadia Mono", Consolas, "Microsoft JhengHei", monospace';
  const DARK = {
    background: "#0b0d10", foreground: "#e6e4dc", cursor: "#f7df1e", cursorAccent: "#0b0d10", selectionBackground: "rgba(247, 223, 30, 0.28)",
    black: "#1b1e23", red: "#ff6b6b", green: "#7bd389", yellow: "#f7df1e", blue: "#4cc9f0", magenta: "#f72585", cyan: "#5ee6d0", white: "#d8d6cf",
    brightBlack: "#5c5f66", brightRed: "#ff8f8f", brightGreen: "#a5e6b1", brightYellow: "#fff07a", brightBlue: "#8adcf7", brightMagenta: "#ff6fae", brightCyan: "#9af2e4", brightWhite: "#ffffff",
  };
  const LIGHT = {
    background: "#fbfaf6", foreground: "#24292f", cursor: "#c2185b", cursorAccent: "#fbfaf6", selectionBackground: "rgba(9, 105, 218, 0.22)",
    black: "#24292f", red: "#cf222e", green: "#116329", yellow: "#9a6700", blue: "#0969da", magenta: "#8250df", cyan: "#1b7c83", white: "#6e7781",
    brightBlack: "#57606a", brightRed: "#a40e26", brightGreen: "#1a7f37", brightYellow: "#633c01", brightBlue: "#218bff", brightMagenta: "#a475f9", brightCyan: "#3192aa", brightWhite: "#8c959f",
  };
  const winHTML = (title, extra = "") => `<section class="xt-win"><div class="xt-chrome"><span class="xt-dots"><i></i><i></i><i></i></span><span class="xt-path">${title}</span><span class="xt-size">${extra}</span></div><div class="xt-term"></div></section>`;

  // Create a Terminal in ctx's .xt-term, keep it fitted, dispose it with the scene.
  function makeTerm(ctx, opts = {}, host = ctx.$(".xt-term")) {
    const term = new Terminal({
      fontFamily: FONT, fontSize: innerWidth < 560 ? 12 : 13, lineHeight: 1.15, cursorBlink: true, scrollback: 2000,
      theme: DARK, allowProposedApi: true, ...opts,
    });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(host);
    const refit = () => { if (host.clientWidth > 20 && host.clientHeight > 20) fit.fit(); };
    refit();
    let raf = 0;
    const ro = new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(refit); });
    ro.observe(host);
    ctx.onCleanup(() => { ro.disconnect(); cancelAnimationFrame(raf); term.dispose(); });
    return term;
  }
  const sizeLabel = (ctx, term, more = () => "") => {
    const el = ctx.$(".xt-size .sz") || ctx.$(".xt-size");
    const paint = () => (el.textContent = `${term.cols}×${term.rows}${more()}`);
    term.onResize(paint);
    paint();
    return paint;
  };

  // ---------- scene 1: simulated shell (sample data) ----------
  const COURSES = [["JavaScript 入門", "台北", "週六 09:30", "剩 12 位"], ["Node.js 實戰", "台中", "週日 13:30", "剩 5 位"], ["前端效能調校", "高雄", "週三 19:00", "額滿"]];
  const FILES = {
    "~/README.txt": "歡迎來到 atlas 終端機（示意環境）\n這不是真的 shell：畫面由 xterm.js 渲染，指令由頁面上的 JavaScript 解析。\n官方網站：https://xtermjs.org",
    "~/課程.md": ["# 2026 秋季課程（示意資料）", "", ...COURSES.map((c) => `- ${padW(c[0], 16)}${c[1]}  ${c[2]}  ${c[3]}`), "", "> 報名截止：10 月 31 日"].join("\n"),
    "~/todo.txt": "[x] 把 xterm.js 放進網頁\n[x] 接上 FitAddon，視窗縮放自動調整欄列\n[ ] 讓甜甜圈轉起來（輸入 donut）",
    "~/.bashrc": "# 示意設定，這裡沒有真的 bash\nexport LANG=zh_TW.UTF-8\nexport TZ=Asia/Taipei\nalias ll='ls -l'",
    "~/projects/atlas.js": "// 示意程式：列出各縣市的工具數量\nconst tools = { \"台北\": 42, \"台中\": 18, \"高雄\": 11 };\nfor (const [city, n] of Object.entries(tools)) {\n  console.log(`${city}：${n} 個工具`);\n}",
    "~/projects/hello.py": "# 示意程式\nname = \"台灣\"\nprint(f\"哈囉，{name}！\")",
  };
  const DIRS = { "~": ["projects", "README.txt", "課程.md", "todo.txt", ".bashrc"], "~/projects": ["atlas.js", "hello.py"] };
  const MTIME = { "projects": "10月  3 09:30", "README.txt": "10月  2 21:10", "課程.md": "10月  3 08:45", "todo.txt": "10月  1 17:20", ".bashrc": " 9月 28 11:02", "atlas.js": "10月  3 09:12", "hello.py": " 9月 30 22:41" };
  const HELP = [["help", "顯示這份說明"], ["ls [-la] [目錄]", "列出檔案"], ["cd <目錄>", "切換目錄"], ["pwd", "顯示目前路徑"], ["cat <檔案>", "印出檔案內容"],
    ["echo <文字>", "原樣輸出文字"], ["date", "台北現在時間"], ["whoami", "目前使用者"], ["history", "指令歷史"], ["donut", "旋轉甜甜圈動畫（備用畫面）"], ["clear", "清除畫面（Ctrl+L）"]];
  const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
  const colorCode = (line) => /^\s*(\/\/|#)/.test(line) ? MU + line + R
    : line.split(/("[^"]*"|`[^`]*`)/).map((p, i) => i % 2 ? GR + p + R : p.replace(/\b(const|for|of|print)\b/g, PK + "$1" + R)).join("");
  function colorFile(path, body) {
    const lines = body.split("\n");
    if (path.endsWith(".md")) return lines.map((l) => l.startsWith("# ") ? B + ACC + l + R : l.startsWith("> ") ? MU + l + R
      : l.startsWith("- ") ? CY + "•" + R + l.slice(1).replace(/(剩 \d+ 位)/, GR + "$1" + R).replace("額滿", PK + "額滿" + R) : l);
    if (path.endsWith("todo.txt")) return lines.map((l) => l.startsWith("[x]") ? GR + "[x]" + R + l.slice(3) : MU + l + R);
    if (/\.(js|py)$/.test(path)) return lines.map(colorCode);
    if (path.endsWith(".bashrc")) return lines.map((l) => l.startsWith("#") ? MU + l + R : l.replace(/^(\w+)/, PK + "$1" + R));
    return lines;
  }
  const DONUT_CHARS = ".,-~:;=!*#$@";
  const DONUT_PAL = Array.from({ length: 12 }, (_, i) => { const t = i / 11; return fg(Math.round(150 + 105 * t), Math.round(60 + 175 * t), Math.round(20 + 40 * t * t)); });
  function donutFrame(term, s) {
    const W = term.cols, H = term.rows - 1;
    s.A = (s.A || 0) + 0.07; s.B = (s.B || 0) + 0.035;
    const lum = new Int8Array(W * H).fill(-1), z = new Float32Array(W * H);
    const cA = Math.cos(s.A), sA = Math.sin(s.A), cB = Math.cos(s.B), sB = Math.sin(s.B);
    const k = Math.min(W / 52, H / 22), kx = 30 * k, ky = 15 * k;
    for (let j = 0; j < 6.28; j += 0.07) {
      const ct = Math.cos(j), st = Math.sin(j);
      for (let i = 0; i < 6.28; i += 0.02) {
        const sp = Math.sin(i), cp = Math.cos(i);
        const h = ct + 2, D = 1 / (sp * h * sA + st * cA + 5), t = sp * h * cA - st * sA;
        const x = (W / 2 + kx * D * (cp * h * cB - t * sB)) | 0, y = (H / 2 + ky * D * (cp * h * sB + t * cB)) | 0;
        if (x < 0 || x >= W || y < 0 || y >= H) continue;
        const o = x + W * y;
        if (D > z[o]) { z[o] = D; lum[o] = Math.max(0, Math.min(11, (8 * ((st * sA - sp * ct * cA) * cB - sp * ct * sA - st * cA - cp * ct * sB)) | 0)); }
      }
    }
    let str = "\x1b[H";
    for (let y = 0; y < H; y++) {
      let last = -2, line = "";
      for (let x = 0; x < W; x++) {
        const L = lum[x + W * y];
        if (L < 0) { line += " "; continue; }
        if (L !== last) { line += DONUT_PAL[L]; last = L; }
        line += DONUT_CHARS[L];
      }
      str += line + R + (y < H - 1 ? "\r\n" : "");
    }
    return str + `\x1b[${H + 1};1H${MU} 按任意鍵或 Ctrl+C 停止${R}\x1b[K`;
  }

  function mountShell(ctx) {
    ctx.html(`<div class="xt-board"><div class="xt-row"><div class="xt-row xt-quick"></div><span class="xt-tour">自動示範中，按任意鍵接手</span></div>${winHTML("clare@atlas: ~", '<span class="ver">xterm.js 6.0.0・</span><span class="sz"></span>')}</div>`);
    const term = makeTerm(ctx);
    const pathEl = ctx.$(".xt-path"), tourEl = ctx.$(".xt-tour");
    sizeLabel(ctx, term);
    const out = (s) => term.write(s);
    const println = (s = "") => term.write(nl(s) + "\r\n");
    let cwd = "~", mode = "input", buf = [], cur = 0, P = 0, cr = 0, anim = null, hIdx = 0, draft = [];
    const hist = [];
    const resolve = (p) => {
      if (!p || p === ".") return cwd;
      const parts = p.startsWith("~") ? [] : cwd.split("/").slice(1);
      for (const seg of p.replace(/^~\/?/, "").split("/")) { if (!seg || seg === ".") continue; if (seg === "..") parts.pop(); else parts.push(seg); }
      return ["~", ...parts].join("/");
    };
    const isDir = (p) => own(DIRS, p), isFile = (p) => own(FILES, p);
    const nameColor = (dir, n) => isDir(dir + "/" + n) ? B + CY + n + "/" + R : n.endsWith(".md") ? ACC + n + R : /\.(js|py)$/.test(n) ? GR + n + R : n;
    const COMMANDS = {
      help() {
        println(`${B}可用指令${R}${MU}（模擬 shell，不會執行真實指令）${R}`);
        const w = Math.max(...HELP.map((h) => strW(h[0]))) + 2;
        for (const [c, d] of HELP) println(`  ${ACC}${padW(c, w)}${R}${d}`);
        println(`${MU}快捷鍵：↑↓ 翻歷史、Tab 補完、Ctrl+C 中斷、Ctrl+L 清畫面${R}`);
      },
      ls(args) {
        const flags = args.filter((a) => a.startsWith("-")).join(""), arg = args.find((a) => !a.startsWith("-"));
        const target = resolve(arg);
        if (isFile(target)) return println(target.split("/").pop());
        if (!isDir(target)) return println(`ls: ${arg}：沒有此檔案或目錄`);
        const names = DIRS[target].filter((n) => flags.includes("a") || !n.startsWith("."));
        if (flags.includes("l")) {
          println(`總計 ${names.length}`);
          for (const n of names) {
            const p = target + "/" + n, d = isDir(p);
            const size = String(d ? 4096 : new TextEncoder().encode(FILES[p]).length).padStart(5);
            println(`${MU}${d ? "drwxr-xr-x" : "-rw-r--r--"} 1 clare staff${R} ${size} ${MU}${MTIME[n]}${R} ${nameColor(target, n)}`);
          }
          return;
        }
        let row = "", rowW = 0;
        for (const n of names) {
          const w = strW(n) + (isDir(target + "/" + n) ? 1 : 0);
          if (rowW && rowW + 2 + w > term.cols) { println(row); row = ""; rowW = 0; }
          row += (rowW ? "  " : "") + nameColor(target, n);
          rowW += (rowW ? 2 : 0) + w;
        }
        if (row) println(row);
      },
      cd(args) {
        const target = resolve(args[0] || "~");
        if (isFile(target)) return println(`cd: ${args[0]}：不是目錄`);
        if (!isDir(target)) return println(`cd: ${args[0]}：沒有此檔案或目錄`);
        cwd = target;
        pathEl.textContent = `clare@atlas: ${cwd}`;
      },
      pwd() { println("/home/clare" + cwd.slice(1)); },
      cat(args) {
        if (!args.length) return println("cat: 請指定檔案，例如 cat 課程.md");
        for (const a of args) {
          const p = resolve(a);
          if (isDir(p)) println(`cat: ${a}：是一個目錄`);
          else if (!isFile(p)) println(`cat: ${a}：沒有此檔案或目錄`);
          else colorFile(p, FILES[p]).forEach((l) => println(l));
        }
      },
      echo(args) { println(args.join(" ")); },
      date() { println(new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", dateStyle: "full", timeStyle: "long" }).format(new Date())); },
      whoami() { println("clare"); },
      history() { hist.forEach((h, i) => println(`${MU}${String(i + 1).padStart(4)}${R}  ${h}`)); },
      clear() { out("\x1b[2J\x1b[3J\x1b[H"); },
      donut() {
        mode = "anim";
        const me = { stopped: false, timer: 0, s: {} };
        out("\x1b[?1049h\x1b[?25l\x1b[2J");
        const loop = () => { if (!me.stopped) term.write(donutFrame(term, me.s), () => { if (!me.stopped) me.timer = setTimeout(loop, 40); }); };
        me.stop = () => {
          if (me.stopped) return;
          me.stopped = true; clearTimeout(me.timer); anim = null;
          out(`${R}\x1b[?1049l\x1b[?25h`);
          println(`${MU}（donut 已停止，備用畫面關閉後原本的輸出還在）${R}`);
          prompt();
        };
        anim = me;
        loop();
      },
    };
    COMMANDS.ll = (args) => COMMANDS.ls(["-l", ...args]);
    ctx.onCleanup(() => { if (anim) { anim.stopped = true; clearTimeout(anim.timer); } });
    const VISIBLE = HELP.map((h) => h[0].split(" ")[0]);

    // Line editor that tracks wide (CJK) characters across wrapped rows.
    function layout(chars) {
      let r = 0, c = P;
      const pos = [];
      for (const ch of chars) { const w = wcw(ch); if (c + w > term.cols) { r++; c = 0; } pos.push([r, c]); c += w; }
      return { pos, end: [r, c] };
    }
    function redraw() {
      const { pos, end } = layout(buf);
      let s = (cr > 0 ? `\x1b[${cr}A` : "") + "\r" + (P ? `\x1b[${P}C` : "") + "\x1b[J" + buf.join("");
      let [er, ec] = end;
      if (ec >= term.cols) { s += "\r\n"; er++; ec = 0; }
      const [tr, tc] = cur < buf.length ? pos[cur] : [er, ec];
      if (er > tr) s += `\x1b[${er - tr}A`;
      s += "\r" + (tc ? `\x1b[${tc}C` : "");
      cr = tr;
      out(s);
    }
    function promptText() { P = strW(`clare@atlas:${cwd}$ `); return `${B}${GR}clare@atlas${R}:${B}${CY}${cwd}${R}$ `; }
    function prompt() { mode = "input"; buf = []; cur = 0; hIdx = hist.length; out(promptText()); cr = 0; }
    function reprompt() { out(promptText()); cr = 0; redraw(); }
    function insert(text) {
      const chars = Array.from(text).filter((ch) => ch.codePointAt(0) >= 32 && ch !== "\x7f");
      if (!chars.length) return;
      buf.splice(cur, 0, ...chars); cur += chars.length; redraw();
    }
    function submit() {
      cur = buf.length; redraw(); out("\r\n");
      const line = buf.join("").trim();
      if (line && hist[hist.length - 1] !== line) hist.push(line);
      mode = "busy";
      if (line) {
        const [cmd, ...args] = [...line.matchAll(/"([^"]*)"|'([^']*)'|(\S+)/g)].map((m) => m[1] ?? m[2] ?? m[3]);
        if (own(COMMANDS, cmd)) COMMANDS[cmd](args); else println(`${PK}${cmd}${R}：找不到指令，輸入 ${ACC}help${R} 查看可用指令`);
      }
      if (mode === "busy") prompt();
    }
    function complete() {
      const left = buf.slice(0, cur).join(""), word = left.match(/(\S*)$/)[1];
      let cands, base = word;
      if (left.slice(0, left.length - word.length).trim() === "") cands = VISIBLE.filter((c) => c.startsWith(word)).map((c) => [c, " "]);
      else {
        const slash = word.lastIndexOf("/"), dir = resolve(slash >= 0 ? word.slice(0, slash + 1) : ".");
        base = word.slice(slash + 1);
        if (!isDir(dir)) return;
        cands = DIRS[dir].filter((n) => n.startsWith(base) && (base.startsWith(".") || !n.startsWith("."))).map((n) => [n, isDir(dir + "/" + n) ? "/" : " "]);
      }
      if (!cands.length) return;
      if (cands.length === 1) return insert(cands[0][0].slice(base.length) + cands[0][1]);
      let pre = cands[0][0];
      for (const [c] of cands) while (!c.startsWith(pre)) pre = pre.slice(0, -1);
      if (pre.length > base.length) return insert(pre.slice(base.length));
      const keep = cur;
      cur = buf.length; redraw(); out("\r\n");
      println(cands.map(([c, sfx]) => sfx === "/" ? B + CY + c + "/" + R : c).join("  "));
      cur = keep; reprompt();
    }
    function historyMove(d) {
      if (!hist.length) return;
      if (hIdx === hist.length) draft = buf.slice();
      hIdx = Math.max(0, Math.min(hist.length, hIdx + d));
      buf = hIdx === hist.length ? draft.slice() : Array.from(hist[hIdx]);
      cur = buf.length; redraw();
    }
    function handleInput(data) {
      if (mode === "anim") { if (anim) anim.stop(); return; }
      if (mode !== "input") return;
      let text = "";
      const flush = () => { if (text) { insert(text); text = ""; } };
      for (const [tok] of data.matchAll(/\x1b(?:\[[0-9;]*[A-Za-z~]|O[A-Za-z])|[\s\S]/gu)) {
        if (mode !== "input") return;
        const code = tok.codePointAt(0);
        if (tok[0] !== "\x1b" && code >= 32 && code !== 0x7f) { text += tok; continue; }
        flush();
        switch (tok) {
          case "\r": case "\n": submit(); break;
          case "\x7f": case "\b": if (cur > 0) { buf.splice(cur - 1, 1); cur--; redraw(); } break;
          case "\x1b[3~": if (cur < buf.length) { buf.splice(cur, 1); redraw(); } break;
          case "\x1b[D": if (cur > 0) { cur--; redraw(); } break;
          case "\x1b[C": if (cur < buf.length) { cur++; redraw(); } break;
          case "\x1b[A": historyMove(-1); break;
          case "\x1b[B": historyMove(1); break;
          case "\x1b[H": case "\x1bOH": case "\x01": cur = 0; redraw(); break;
          case "\x1b[F": case "\x1bOF": case "\x05": cur = buf.length; redraw(); break;
          case "\x15": buf.splice(0, cur); cur = 0; redraw(); break;
          case "\t": complete(); break;
          case "\x03": cur = buf.length; redraw(); out(`${MU}^C${R}\r\n`); prompt(); break;
          case "\x0c": out("\x1b[2J\x1b[3J\x1b[H"); reprompt(); break;
        }
      }
      flush();
    }
    term.onResize(() => { if (mode === "input") { const { pos, end } = layout(buf); cr = (cur < buf.length ? pos[cur] : end)[0]; } });

    // Scripted tour: typed through the same input path, so Tab completion is real.
    let tourOn = true, typeGen = 0;
    async function typeOut(text, speed) {
      const g = ++typeGen;
      for (const ch of text) { if (g !== typeGen || mode !== "input") return false; handleInput(ch); await ctx.sleep(ch === "\t" ? 350 : speed); }
      return g === typeGen;
    }
    function stopTour() {
      if (!tourOn) return;
      tourOn = false; typeGen++;
      if (mode === "input" && buf.length) { buf = []; cur = 0; redraw(); }
      tourEl.textContent = "手動模式"; tourEl.classList.add("off");
    }
    async function tour() {
      const steps = [["help", 2600], ["ls -l", 2200], ["cat 課\t", 2600], ["cd proj\t", 700], ["ls", 1400], ["cd ..", 500], ["history", 2000], ["donut", 5000], ["date", 1500], ["clear", 400]];
      await ctx.sleep(900);
      while (tourOn) {
        for (const [cmd, hold] of steps) {
          if (!tourOn || mode !== "input") return;
          if (!(await typeOut(cmd, 55)) || !tourOn) return;
          await ctx.sleep(160);
          if (!tourOn) return;
          handleInput("\r");
          await ctx.sleep(hold);
          if (!tourOn) return;
          if (anim) anim.stop();
        }
      }
    }
    const quick = ctx.$(".xt-quick");
    for (const cmd of ["help", "ls -la", "cat 課程.md", "history", "donut", "date", "clear"]) {
      const b = Showcase.h("button", { class: "btn", type: "button", title: `執行 ${cmd}` }, cmd);
      b.addEventListener("click", () => quiet((async () => {
        stopTour();
        if (anim) anim.stop();
        if (mode === "input" && buf.length) { buf = []; cur = 0; redraw(); }
        term.focus();
        if (await typeOut(cmd, 22)) handleInput("\r");
      })()));
      quick.append(b);
    }
    term.onData((data) => { stopTour(); typeGen++; handleInput(data); });
    ctx.on(ctx.$(".xt-term"), "pointerdown", () => { if (tourOn) { stopTour(); if (anim) anim.stop(); } });
    println(`${B}${ACC}xterm.js${R} ${MU}6.0.0・模擬 shell（不會碰到你的電腦）${R}`);
    println(`輸入 ${ACC}help${R} 查看指令，Tab 補完、↑↓ 翻歷史，或試試 ${ACC}donut${R}。`);
    println();
    prompt();
    quiet(tour());
  }

  // ---------- scene 2: ANSI sheet ----------
  function ansiSheet(term) {
    const W = term.cols, L = [], tight = term.rows < 18;
    const pack = (items) => {
      let row = "", w = 0;
      for (const [s, iw] of items) {
        if (w && w + 2 + iw > W) { L.push(row); row = ""; w = 0; }
        row += (w ? "  " : "") + s; w += (w ? 2 : 0) + iw;
      }
      if (row) L.push(row);
    };
    L.push(`${MU}SGR 文字樣式${R}`);
    pack([["1", "粗體"], ["2", "暗淡"], ["3", "斜體"], ["4", "底線"], ["4:2", "雙底線"], ["4:3;58;2;247;37;133", "波浪線"], ["4:4", "點線"], ["4:5", "虛線"], ["53", "上劃線"], ["9", "刪除線"], ["7", "反白"]]
      .map(([c, t]) => [`\x1b[${c}m${t}${R}`, strW(t)]));
    L.push(`${MU}16 色：前 8 色與亮色，跟著主題變${R}`);
    const names = ["黑", "紅", "綠", "黃", "藍", "洋紅", "青", "白"];
    pack(names.map((n, i) => [`\x1b[3${i}m${n}${R}`, strW(n)]));
    const sw = Math.max(2, Math.min(6, Math.floor(W / 8)));
    L.push([0, 1, 2, 3, 4, 5, 6, 7].map((i) => `\x1b[4${i}m${" ".repeat(sw)}`).join("") + R);
    L.push([0, 1, 2, 3, 4, 5, 6, 7].map((i) => `\x1b[10${i}m${" ".repeat(sw)}`).join("") + R);
    if (!tight) L.push(`${MU}256 色：6×6×6 色立方與灰階（\\e[48;5;Nm）${R}`);
    const per = W >= 73 ? 72 : W >= 37 ? 36 : 18;
    for (let start = 16; start < 232; start += per) {
      let s = "";
      for (let k = 0; k < per; k++) s += `\x1b[48;5;${start + k}m `;
      L.push(s + R);
    }
    let gray = "";
    for (let i = 0; i < 24 && i < W; i++) gray += `\x1b[48;5;${232 + i}m `;
    L.push(gray + R);
    if (!tight) L.push(`${MU}24-bit 全彩：每格上下半各一色（▀）${R}`);
    const GW = Math.max(16, Math.min(W - 1, 72));
    for (let row = 0; row < (tight ? 1 : 2); row++) {
      let s = "";
      for (let x = 0; x < GW; x++) { const h = x / GW; s += fg(...hsl(h, 0.9, 0.7 - row * 0.2)) + bg(...hsl(h, 0.9, 0.6 - row * 0.2)) + "▀"; }
      L.push(s + R);
    }
    return "\x1b[2J\x1b[3J\x1b[H" + L.join("\r\n") + `\r\n${tight ? "" : "\r\n"}${B}游標${R} ${MU}→${R} `;
  }

  // ---------- scene 4: fake access log (sample data) ----------
  function accessLog() {
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const paths = ["/api/courses?city=台北", "/api/courses?city=高雄", "/api/signup", "/api/stations/BL12", "/static/app.js", "/api/weather?city=台中"];
    const lines = [];
    for (let i = 0; i < 160; i++) {
      const t = `09:${String(Math.floor(i / 3)).padStart(2, "0")}:${String((i * 17) % 60).padStart(2, "0")}`;
      const r = rnd(), ms = Math.round(8 + rnd() ** 3 * 1400);
      const lvl = r < 0.06 ? `${PK}ERROR${R}` : r < 0.16 ? `${ACC}WARN ${R}` : `${GR}INFO ${R}`;
      const code = r < 0.06 ? 500 : r < 0.16 ? 429 : 200;
      lines.push(`${MU}${t}${R} ${lvl} GET ${paths[Math.floor(rnd() * paths.length)]} ${code} ${ms}ms`);
      if (i % 37 === 12) lines.push(`${MU}         文件：https://xtermjs.org/docs/api/addons/search/${R}`);
      if (i % 41 === 30) lines.push(`${MU}         OSC 8 超連結：${R}\x1b]8;;https://github.com/xtermjs/xterm.js\x07${CY}xterm.js 原始碼${R}\x1b]8;;\x07`);
    }
    return lines.join("\r\n");
  }

  // ---------- scene 5: progress + TUI helpers ----------
  const EIGHTHS = " ▏▎▍▌▋▊▉";
  function bar(p, w, col) {
    const cells = Math.max(0, Math.min(1, p)) * w, full = Math.floor(cells), part = Math.floor((cells - full) * 8);
    return col + "█".repeat(full) + (full < w ? EIGHTHS[part] + " ".repeat(w - full - 1) : "") + R;
  }
  function boxTable(head, rows) {
    const ws = head.map((h, i) => Math.max(strW(h), ...rows.map((r) => strW(r[i]))) + 2);
    const line = (l, m, r) => MU + l + ws.map((w) => "─".repeat(w)).join(m) + r + R;
    const row = (cells, c = "") => MU + "│" + R + cells.map((x, i) => c + " " + padW(x, ws[i] - 1) + R).join(MU + "│" + R) + MU + "│" + R;
    return [line("┌", "┬", "┐"), row(head, B + ACC), line("├", "┼", "┤"), ...rows.map((r) => row(r)), line("└", "┴", "┘")];
  }

      id: "tui", title: "進度條與 TUI",
      api: "term.write('\\x1b[4A\\r\\x1b[K' + bar); term.write('\\x1b[?1049h')",
      desc: "進度條用游標上移（\\e[NA）回到原行重畫，▏▎▍▌▋▊▉ 讓每格再細分八段；表格用框線字元並以 CJK 寬度對齊；儀表板在備用畫面用絕對定位（\\e[row;colH）刷新，離開後回到原本輸出。",
      hint: "全部輸出都是模擬資料，按「重播」從頭再跑一次",
      mount(ctx) {
        ctx.html(`<div class="xt-board">${winHTML("模擬安裝與系統監看", '<span class="sz"></span>')}</div>`);
        const term = makeTerm(ctx, { cursorBlink: false });
        sizeLabel(ctx, term);
        const w = (s) => new Promise((r) => term.write(s, r));
        let gen = 0;
        const PKGS = [["@xterm/xterm", 4.6, "#4cc9f0"], ["@xterm/addon-fit", 0.4, "#7bd389"], ["@xterm/addon-webgl", 2.1, "#f72585"], ["@xterm/addon-search", 0.9, "#ff8c42"]];
        async function install(g) {
          await w(`\x1b[2J\x1b[3J\x1b[H\x1b[?25l${GR}$${R} npm install ${MU}（模擬輸出）${R}\r\n` + "\r\n".repeat(PKGS.length));
          const st = PKGS.map(([, mb]) => ({ got: 0, mb, speed: 1.2 + Math.random() * 2.4, done: 0 }));
          const t0 = performance.now();
          for (let f = 0; g === gen; f++) {
            const BW = Math.max(8, Math.min(30, term.cols - 36));
            let s = `\x1b[${PKGS.length}A`;
            PKGS.forEach(([name, , col], i) => {
              const p = st[i];
              if (p.got < p.mb) { p.got = Math.min(p.mb, p.got + p.speed * 0.06 * (0.6 + Math.random())); if (p.got >= p.mb) p.done = performance.now() - t0; }
              const pct = p.got / p.mb, spin = "⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏"[(f + i * 3) % 10];
              const c = col.match(/\w\w/g).map((x) => parseInt(x, 16));
              s += `\r\x1b[K${pct >= 1 ? GR + "✔" + R : CY + spin + R} ${padW(name, 20).slice(0, 20)} ${bar(pct, BW, fg(...c))} ${String(Math.round(pct * 100)).padStart(3)}%\r\n`;
            });
            await w(s);
            if (st.every((p) => p.got >= p.mb)) break;
            await ctx.sleep(60);
          }
          if (g !== gen) return;
          const t = boxTable(["套件", "大小", "耗時"], PKGS.map(([n, mb], i) => [n.replace("@xterm/", ""), `${mb} MB`, `${(st[i].done / 1000).toFixed(1)} 秒`]));
          await w(`\r\n${GR}已安裝 ${PKGS.length} 個套件${R}\r\n` + t.join("\r\n") + "\r\n");
        }
        async function dashboard(g) {
          await w("\x1b[?1049h\x1b[?25l\x1b[2J");
          const cores = 8, hist = [];
          const load = Array.from({ length: cores }, () => Math.random() * 60);
          for (let f = 0; f < 70 && g === gen; f++) {
            const W = term.cols, H = term.rows, BW = Math.max(6, Math.min(40, W - 16));
            load.forEach((v, i) => { load[i] = Math.max(2, Math.min(99, v + (Math.random() - 0.5) * 22)); });
            const avg = load.reduce((a, b) => a + b, 0) / cores;
            hist.push(avg); if (hist.length > W - 4) hist.shift();
            let s = `\x1b[1;1H${bg(247, 223, 30)}${fg(14, 16, 19)}${B} atlas 監看 ${R}${bg(23, 26, 31)} ${new Date().toLocaleTimeString("zh-TW", { hour12: false })}・模擬資料・${f + 1}/70 \x1b[K${R}`;
            load.forEach((v, i) => {
              if (i + 3 > H - 4) return;
              const col = v > 80 ? fg(247, 37, 133) : v > 50 ? fg(255, 140, 66) : fg(123, 211, 137);
              s += `\x1b[${i + 3};2H${MU}CPU${i}${R} ${bar(v / 100, BW, col)} ${String(v.toFixed(0)).padStart(3)}%\x1b[K`;
            });
            const mem = 0.42 + 0.08 * Math.sin(f / 9);
            s += `\x1b[${Math.min(cores + 4, H - 3)};2H${MU}記憶體${R} ${bar(mem, BW - 2, fg(157, 140, 255))} ${(mem * 32).toFixed(1)} / 32 GB\x1b[K`;
            const sp = hist.map((v) => SPARK[Math.min(7, Math.floor(v / 12.5))]).join("");
            s += `\x1b[${H - 1};2H${MU}平均負載${R}\x1b[K\x1b[${H};2H${CY}${sp}${R}\x1b[K`;
            await w(s);
            await ctx.sleep(90);
          }
          await w(`${R}\x1b[?1049l`);
          if (g === gen) await w(`\r\n${MU}（儀表板已離開備用畫面，上方的安裝輸出仍在）${R}\r\n`);
        }
        async function play() {
          const g = ++gen;
          while (g === gen) {
            await install(g);
            await ctx.sleep(1800);
            if (g !== gen) return;
            await dashboard(g);
            await ctx.sleep(2500);
          }
        }
        ctx.button("重播", () => { term.write(`${R}\x1b[?1049l`); quiet(play()); }, { primary: true });
        quiet(play());
      },
    },
    {
      id: "events", title: "事件與滑鼠回報",
      api: "term.write('\\x1b[?1002h\\x1b[?1006h'); term.onData / onKey / onSelectionChange / onTitleChange / onBell",
      desc: "程式開啟滑鼠回報模式後，點擊與拖曳會變成 \\e[<b;x;yM 序列從 onData 送出，這裡拿來在終端機上畫畫；關閉後可正常選取文字，觸發 onSelectionChange。右側即時列出各事件。",
      hint: "在終端機上按住拖曳畫畫；關閉「滑鼠回報」後可選取文字",
      mount(ctx) {
        ctx.html(`<div class="xt-board"><div class="xt-split">${winHTML("事件示範", '<span class="sz"></span>')}<div class="xt-log"><h4>事件紀錄（最新在上）</h4><div class="list"></div></div></div></div>`);
        const term = makeTerm(ctx, { cursorBlink: false });
        sizeLabel(ctx, term);
        const list = ctx.$(".list"), title = ctx.$(".xt-path"), win = ctx.$(".xt-win");
        const log = (ev, text) => {
          const d = Showcase.h("div");
          d.innerHTML = `<em>${ev}</em>${text}`;
          list.prepend(d);
          while (list.children.length > 60) list.lastChild.remove();
        };
        const show = (s) => `<code>${esc(JSON.stringify(s).slice(1, -1))}</code>`;
        let mouse = true, auto = true, hue = 0, drags = 0, n = 0;
        const intro = () => term.write(`\x1b[2J\x1b[H\x1b[?25l${MU}${mouse ? "滑鼠回報已開啟：按住拖曳在這裡畫畫" : "滑鼠回報已關閉：可用滑鼠選取這段文字"}${R}\r\n${MU}可直接打字，鍵盤事件會出現在右側${R}`);
        const setMouse = (on) => { mouse = on; term.write(on ? "\x1b[?1002h\x1b[?1006h" : "\x1b[?1002l\x1b[?1006l"); intro(); };
        term.onData((d) => {
          const ms = [...d.matchAll(/\x1b\[<(\d+);(\d+);(\d+)([Mm])/g)];
          if (!ms.length) { log("onData", show(d)); if (d >= " ") term.write(`\x1b[4;1H${CY}${d}${R}`); return; }
          for (const [raw, b, x, y, kind] of ms) {
            const drag = +b & 32;
            if (drag) drags++; else log("onData", `${show(raw)} ${kind === "M" ? "按下" : "放開"} (${x}, ${y})`);
            if (kind === "M" && (+b & 3) === 0 && +y > 2) { hue = (hue + 0.012) % 1; term.write(`\x1b[${y};${x}H${bg(...hsl(hue, 0.85, 0.6))} ${R}`); }
          }
        });
        term.onKey(({ key, domEvent }) => log("onKey", `${esc(domEvent.key)}（${domEvent.code}）→ ${show(key)}`));
        term.onSelectionChange(() => { const s = term.getSelection(); if (s) log("onSelectionChange", `「${esc(s.slice(0, 40))}」`); });
        term.onTitleChange((t) => { title.textContent = t; log("onTitleChange", esc(t)); });
        term.onBell(() => { win.classList.add("bell"); ctx.timeout(() => win.classList.remove("bell"), 300); log("onBell", "收到 BEL（\\x07）"); });
        term.onResize(({ cols, rows }) => log("onResize", `${cols}×${rows}`));
        ctx.interval(() => { if (drags) { log("onData", `拖曳回報 ${drags} 筆（\\e[&lt;32;x;yM）`); drags = 0; } }, 1000);
        ctx.toggle("滑鼠回報", true, (v) => { auto = false; setMouse(v); });
        ctx.button("設定標題", () => term.write(`\x1b]0;OSC 0 標題 #${++n}\x07`));
        ctx.button("響鈴", () => term.write("\x07"));
        ctx.button("清除", () => intro());
        setMouse(true);
        ctx.on(ctx.$(".xt-term"), "pointerdown", () => { auto = false; }, true);
        quiet((async () => {
          await ctx.sleep(600);
          log("說明", "自動示範用 term.input() 送出模擬的滑鼠序列");
          for (let k = 0; auto; k++) {
            const cx = term.cols / 2, cy = (term.rows + 2) / 2, rx = Math.min(term.cols / 2 - 3, (term.rows - 3) * 1.1), ry = (term.rows - 4) / 2.2;
            const pt = (a) => [Math.round(cx + rx * Math.sin(a) ** 3), Math.round(cy - ry * (0.8 * Math.cos(a) - 0.3 * Math.cos(2 * a) - 0.15 * Math.cos(3 * a)))];
            let [x, y] = pt(0);
            term.input(`\x1b[<0;${x};${y}M`, false);
            for (let a = 0; a <= Math.PI * 2 && auto; a += 0.05) { [x, y] = pt(a); term.input(`\x1b[<32;${x};${y}M`, false); await ctx.sleep(25); }
            term.input(`\x1b[<0;${x};${y}m`, false);
            if (k % 2) term.write(`\x1b]0;自動示範第 ${k + 1} 輪\x07`); else term.write("\x07");
            await ctx.sleep(1800);
            if (auto) intro();
          }
        })());
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "term.write(chunk) 每秒 N 行；term.loadAddon(new WebglAddon())",
      desc: "逐級提高每秒寫入的彩色日誌行數，量渲染 FPS；可在 DOM 渲染器與 WebGL 渲染器之間切換比較。",
      hint: "切換渲染器後重新按「自動加壓」比較兩者",
      async mount(ctx) {
        ctx.html(`<div class="xt-stress">${winHTML("輸出壓力測試", '<span class="sz"></span>')}</div>`);
        ctx.controls.classList.add("bottom");
        const term = makeTerm(ctx, { cursorBlink: false, scrollback: 1000 });
        const pathEl = ctx.$(".xt-path");
        let webgl = null, renderer = "DOM", rate = 0, acc = 0, pending = 0, done = 0, lastDone = 0, lps = 0, lastT = performance.now();
        sizeLabel(ctx, term);
        const POOL = Array.from({ length: 97 }, (_, i) => {
          const c = hsl((i * 0.137) % 1, 0.75, 0.65);
          return `${MU}${String(i).padStart(3, "0")}${R} ${fg(...c)}${["INFO", "WARN", "DEBUG", "TRACE"][i % 4].padEnd(5)}${R} 第 ${i} 筆 ${"▮".repeat(4 + (i * 7) % 24)} ${CY}lat=${(i * 37) % 900}ms${R} ${GR}ok${R}`;
        });
        let pi = 0;
        ctx.raf((t, dt) => {
          acc += (rate * dt) / 1000;
          const k = Math.floor(acc);
          if (k > 0 && pending < 8) {
            acc -= k;
            let s = "";
            for (let i = 0; i < k; i++) s += POOL[pi++ % POOL.length] + "\r\n";
            pending++;
            term.write(s, () => { pending--; done += k; });
          } else if (pending >= 8) acc = Math.min(acc, rate);
          if (t - lastT > 500) { lps = ((done - lastDone) * 1000) / (t - lastT); lastDone = done; lastT = t; }
        });
        const setRenderer = async (i) => {
          if (i === 1 && !webgl) {
            await ctx.load(WEBGL_URL);
            if (!ctx.active) return;
            try {
              const a = new WebglAddon.WebglAddon();
              a.onContextLoss(() => { a.dispose(); webgl = null; renderer = "DOM（WebGL 內容遺失）"; pathEl.textContent = `輸出壓力測試・${renderer}`; });
              term.loadAddon(a);
              webgl = a; renderer = "WebGL";
            } catch (e) { renderer = "DOM（此瀏覽器無法建立 WebGL）"; }
          } else if (i === 0 && webgl) { webgl.dispose(); webgl = null; renderer = "DOM"; }
          pathEl.textContent = `輸出壓力測試・${renderer}`;
        };
        ctx.group(["DOM 渲染器", "WebGL 渲染器"], 0, (i) => quiet(setRenderer(i)));
        pathEl.textContent = "輸出壓力測試・DOM";
        ctx.ramp({
          label: "每秒寫入行數", unit: "行/秒", steps: [500, 2000, 8000, 20000, 50000, 100000, 200000, 400000], initial: 1, minFps: 30,
          apply(n) { rate = n; acc = 0; },
          metrics: () => ({ 實際吞吐: `${fmt(lps, 0)} 行/秒`, 達成率: rate ? `${Math.min(100, (lps / rate) * 100).toFixed(0)}%` : "…", 待處理寫入: pending, 渲染器: renderer }),
          note: "每格以 requestAnimationFrame 依目標速率寫入彩色日誌；xterm.js 先解析 ANSI 再交給渲染器畫可見區域。寫入回呼未完成的區塊超過 8 個就暫停產生，所以「實際吞吐」與「達成率」才是真正處理得完的量，FPS 反映解析與繪圖搶主執行緒的程度。WebGL 渲染器用字形材質圖集一次畫完整個畫面，DOM 渲染器每列更新一個元素。",
        });
      },
    },
  ] });
})();
</script>
</body>
</html>
