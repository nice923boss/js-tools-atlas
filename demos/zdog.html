<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zdog 示範：可拖曳旋轉的漂浮小島</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="_shared/demo.css">
<script type="application/json" id="demo-meta">{"mode":"auto"}</script>
<style>
  body { background: linear-gradient(#7fd0f5, #c9ecff 60%, #fff3dc); transition: background .6s; }
  body.night { background: linear-gradient(#070b24, #1b2459 65%, #3a2e6e); }
  #zc { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #zc:active { cursor: grabbing; }
  .sep { width: 1px; background: var(--line); margin: 0 2px; }
</style>
</head>
<body>
<canvas id="zc"></canvas>
<div class="controls">
  <button class="btn" id="spin" aria-pressed="true">自動旋轉</button>
  <button class="btn" id="night">切換夜晚</button>
</div>
<div class="hint">拖曳畫面任意旋轉小島・切換日夜看窗戶亮燈</div>

<script src="https://cdn.jsdelivr.net/npm/zdog@1.1.3/dist/zdog.dist.min.js"></script>
<script>
// Pseudo-3D island built only from Zdog primitives (Cylinder, Cone, Box, Shape, Ellipse, Rect).
// Ground renders first, then the props group is z-sorted, so objects never sink into the grass.
const TAU = Zdog.TAU;
let auto = true, night = false;
const spinBtn = document.getElementById("spin");

const illo = new Zdog.Illustration({
  element: "#zc",
  dragRotate: true,
  resize: true,
  rotate: { x: -0.42, y: 0.5 },
  onDragStart() { auto = false; spinBtn.setAttribute("aria-pressed", "false"); },
  onResize(w, h) { this.zoom = Math.min(w / 430, h / 470); },
});

const world = new Zdog.Group({ addTo: illo, translate: { y: 30 } });
const ground = new Zdog.Group({ addTo: world });
const props = new Zdog.Group({ addTo: world, updateSort: true });
const TOP = -21;

// Ground layers: rocky cone, dirt slab, grass slab, pond and stepping stones
new Zdog.Cone({ addTo: ground, diameter: 200, length: 120, translate: { y: 12 }, rotate: { x: -TAU / 4 }, color: "#7a4a2e", backface: "#6b4128", stroke: false });
new Zdog.Cylinder({ addTo: ground, diameter: 206, length: 24, rotate: { x: TAU / 4 }, color: "#a8693f", frontFace: "#8a5634", backface: "#6b4128", stroke: false });
new Zdog.Cylinder({ addTo: ground, diameter: 216, length: 10, translate: { y: -16 }, rotate: { x: TAU / 4 }, color: "#5fae4f", frontFace: "#8fd16b", backface: "#5fae4f", stroke: false });
new Zdog.Ellipse({ addTo: ground, diameter: 62, quarters: 4, translate: { x: 48, y: TOP - 0.5, z: 38 }, rotate: { x: TAU / 4 }, color: "#4cc9f0", fill: true, stroke: 3 });
new Zdog.Ellipse({ addTo: ground, diameter: 30, translate: { x: 42, y: TOP - 0.8, z: 32 }, rotate: { x: TAU / 4 }, color: "#a6e8ff", fill: true, stroke: false });
[[-10, 44], [-2, 62], [10, 80]].forEach(([x, z]) =>
  new Zdog.Ellipse({ addTo: ground, diameter: 12, translate: { x, y: TOP - 0.6, z }, rotate: { x: TAU / 4 }, color: "#d9d4c7", fill: true, stroke: 2 }));

// House
const house = new Zdog.Anchor({ addTo: props, translate: { x: -38, y: TOP, z: -12 }, rotate: { y: 0.35 } });
new Zdog.Box({ addTo: house, width: 60, height: 46, depth: 50, translate: { y: -23 }, stroke: false, color: "#fff3d6", leftFace: "#f2dcb0", rightFace: "#f2dcb0", rearFace: "#f7e7c4", topFace: false, bottomFace: false });
new Zdog.Shape({ addTo: house, path: [{ x: -35, y: -45, z: 29 }, { x: 35, y: -45, z: 29 }, { x: 35, y: -74, z: 0 }, { x: -35, y: -74, z: 0 }], fill: true, stroke: 2, color: "#ef476f" });
new Zdog.Shape({ addTo: house, path: [{ x: -35, y: -45, z: -29 }, { x: 35, y: -45, z: -29 }, { x: 35, y: -74, z: 0 }, { x: -35, y: -74, z: 0 }], fill: true, stroke: 2, color: "#c9365a" });
[30, -30].forEach((x) => new Zdog.Shape({ addTo: house, path: [{ x, y: -46, z: 25 }, { x, y: -46, z: -25 }, { x, y: -72, z: 0 }], fill: true, stroke: false, color: "#f2dcb0" }));
new Zdog.Box({ addTo: house, width: 10, height: 20, depth: 10, translate: { x: 16, y: -70, z: -10 }, stroke: false, color: "#8d6e63", leftFace: "#795548", rightFace: "#795548", topFace: "#5d4037" });
new Zdog.Rect({ addTo: house, width: 14, height: 24, translate: { x: -6, y: -12, z: 25.5 }, fill: true, stroke: 1, color: "#8b5a3c" });
const windows = [
  new Zdog.Rect({ addTo: house, width: 12, height: 12, translate: { x: 15, y: -26, z: 25.5 }, fill: true, stroke: 2, color: "#bde6ff" }),
  new Zdog.Rect({ addTo: house, width: 14, height: 12, translate: { x: 30.5, y: -25 }, rotate: { y: TAU / 4 }, fill: true, stroke: 2, color: "#bde6ff" }),
  new Zdog.Rect({ addTo: house, width: 14, height: 12, translate: { x: -30.5, y: -25 }, rotate: { y: TAU / 4 }, fill: true, stroke: 2, color: "#bde6ff" }),
];

// Trees
function pine(x, z, s) {
  const a = new Zdog.Anchor({ addTo: props, translate: { x, y: TOP, z }, scale: s });
  new Zdog.Cylinder({ addTo: a, diameter: 8, length: 16, translate: { y: -8 }, rotate: { x: TAU / 4 }, color: "#8b5a3c", stroke: false });
  new Zdog.Cone({ addTo: a, diameter: 44, length: 40, translate: { y: -14 }, rotate: { x: TAU / 4 }, color: "#2a9d8f", backface: "#1f7a6f", stroke: false });
  new Zdog.Cone({ addTo: a, diameter: 32, length: 32, translate: { y: -36 }, rotate: { x: TAU / 4 }, color: "#3fb59e", backface: "#2a9d8f", stroke: false });
}
pine(52, -48, 1);
pine(78, -14, 0.75);
pine(-6, -78, 0.85);
const round = new Zdog.Anchor({ addTo: props, translate: { x: -78, y: TOP, z: 44 } });
new Zdog.Cylinder({ addTo: round, diameter: 8, length: 20, translate: { y: -10 }, rotate: { x: TAU / 4 }, color: "#8b5a3c", stroke: false });
new Zdog.Shape({ addTo: round, translate: { y: -34 }, stroke: 40, color: "#7bd389" });
new Zdog.Shape({ addTo: round, translate: { x: 9, y: -42, z: 8 }, stroke: 22, color: "#9be38a" });

// Windmill with spinning blades
const mill = new Zdog.Anchor({ addTo: props, translate: { x: 84, y: TOP, z: 36 } });
new Zdog.Cylinder({ addTo: mill, diameter: 5, length: 64, translate: { y: -32 }, rotate: { x: TAU / 4 }, color: "#ecebe6", stroke: false });
const blades = new Zdog.Anchor({ addTo: mill, translate: { y: -64, z: 4 } });
[0, 1, 2, 3].forEach((i) => new Zdog.Shape({
  addTo: blades, rotate: { z: (i * TAU) / 4 },
  path: [{ x: 0, y: 0 }, { x: 6, y: -6 }, { x: 4, y: -30 }, { x: -2, y: -30 }],
  fill: true, stroke: 2, color: i % 2 ? "#f7df1e" : "#ffffff",
}));
new Zdog.Shape({ addTo: blades, stroke: 7, color: "#ff8c42" });

// Flowers on the grass
const FLOWERS = ["#f72585", "#f7df1e", "#ffffff", "#9d8cff"];
for (let i = 0; i < 26; i++) {
  const a = (i / 26) * TAU + Math.sin(i * 3.1) * 0.15;
  const r = 82 + Math.sin(i * 7.3) * 14;
  new Zdog.Shape({ addTo: props, translate: { x: Math.cos(a) * r, y: TOP - 3, z: Math.sin(a) * r }, stroke: 5, color: FLOWERS[i % FLOWERS.length] });
}

// Sky: clouds orbiting the island, sun or moon, stars at night
const sky = new Zdog.Anchor({ addTo: illo });
function cloud(angle, r, y, s) {
  const c = new Zdog.Group({ addTo: sky, translate: { x: Math.cos(angle) * r, y, z: Math.sin(angle) * r }, scale: s });
  new Zdog.Shape({ addTo: c, stroke: 34, color: "#ffffff" });
  new Zdog.Shape({ addTo: c, translate: { x: -22, y: 6 }, stroke: 24, color: "#f1f6ff" });
  new Zdog.Shape({ addTo: c, translate: { x: 22, y: 5 }, stroke: 26, color: "#f1f6ff" });
}
cloud(0.4, 170, -120, 1);
cloud(2.6, 160, -90, 0.8);
cloud(4.4, 175, -140, 0.9);
// Point shapes read as circles from every angle, so the glow never turns into a tilted ring
const sunGroup = new Zdog.Group({ addTo: illo, translate: { x: -140, y: -140, z: -60 } });
const halo = new Zdog.Shape({ addTo: sunGroup, stroke: 84, color: "rgba(255,250,225,0.55)" });
const sun = new Zdog.Shape({ addTo: sunGroup, stroke: 54, color: "#ffd166" });
const stars = new Zdog.Group({ addTo: illo, visible: false });
for (let i = 0; i < 90; i++) {
  const t = Math.random() * TAU, p = Math.acos(Math.random() * 1.6 - 1);
  new Zdog.Shape({ addTo: stars, translate: { x: Math.cos(t) * Math.sin(p) * 320, y: Math.cos(p) * 320 - 60, z: Math.sin(t) * Math.sin(p) * 320 }, stroke: Math.random() < 0.2 ? 4 : 2.5, color: "#fff7d6" });
}
const fireflies = new Zdog.Group({ addTo: world, visible: false });
const flies = [];
for (let i = 0; i < 10; i++) flies.push({ s: new Zdog.Shape({ addTo: fireflies, stroke: 4, color: "#f7df1e" }), a: Math.random() * TAU, r: 50 + Math.random() * 60, h: 20 + Math.random() * 40 });

document.getElementById("night").addEventListener("click", (e) => {
  night = !night;
  document.body.classList.toggle("night", night);
  e.currentTarget.textContent = night ? "切換白天" : "切換夜晚";
  sun.color = night ? "#eef2ff" : "#ffd166";
  halo.color = night ? "rgba(220,230,255,0.35)" : "rgba(255,250,225,0.55)";
  windows.forEach((w) => { w.color = night ? "#ffd166" : "#bde6ff"; });
  stars.visible = night;
  fireflies.visible = night;
});
spinBtn.addEventListener("click", () => { auto = !auto; spinBtn.setAttribute("aria-pressed", auto); });

let t = 0;
function frame() {
  t += 0.016;
  if (auto) illo.rotate.y += 0.0055;
  // Keep the camera above the island so the ground always draws underneath the props
  illo.rotate.x = Math.max(-1.2, Math.min(-0.12, illo.rotate.x));
  world.translate.y = 30 + Math.sin(t * 1.4) * 6;
  sky.rotate.y = t * 0.12;
  blades.rotate.z = t * 2.4;
  flies.forEach((f, i) => {
    const a = f.a + t * (0.4 + i * 0.03);
    f.s.translate.set({ x: Math.cos(a) * f.r, y: TOP - f.h - Math.sin(t * 2 + i) * 8, z: Math.sin(a) * f.r });
  });
  illo.updateRenderGraph();
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
