const RAMP = [[8, 8, 20], [45, 18, 90], [120, 30, 140], [215, 50, 120], [250, 120, 70], [252, 220, 90], [255, 255, 220]];
// Spectrogram of 0 to 11 kHz: column c is a window centred on time c / cols, so it lines up with the waveform.
function spectrogram(s, cols, N = 512) {
  cols = Math.max(4, Math.round(cols));
  const bins = N / 4, img = new ImageData(cols, bins), re = new Float32Array(N), im = new Float32Array(N), win = hann(N), n = s.length;
  for (let c = 0; c < cols; c++) {
    const start = Math.floor(((c + 0.5) * n) / cols) - N / 2;
    for (let i = 0; i < N; i++) { const j = start + i; re[i] = j >= 0 && j < n ? s[j] * win[i] : 0; im[i] = 0; }
    fft(re, im);
    for (let b = 0; b < bins; b++) {
      const db = 20 * Math.log10(Math.hypot(re[b], im[b]) / (N / 4) + 1e-6);
      const x = Math.min(0.999, Math.max(0, (db + 80) / 80)) * (RAMP.length - 1), k = Math.floor(x), f = x - k, o = ((bins - 1 - b) * cols + c) * 4;
      for (let q = 0; q < 3; q++) img.data[o + q] = RAMP[k][q] + (RAMP[k + 1][q] - RAMP[k][q]) * f;
      img.data[o + 3] = 255;
    }
  }
  const cv = h("canvas");
  cv.width = cols; cv.height = bins;
  cv.getContext("2d").putImageData(img, 0, 0);

}

  const ch = (inst, pan, notes) => { const a = [inst, pan, ...new Array(32).fill(0)]; for (const [r, n] of notes) a[2 + r] = n; return a; };

  const bass = (root) => ch(2, -.3, Array.from({ length: 16 }, (_, j) => [j * 2, j % 2 ? root + 12 : root]));

          const dv = new DataView(ab), bytes = new Uint8Array(ab, 0, 46);
          tbody.innerHTML = FIELDS.map(([o, n, name, t]) => {
            const hex = [...bytes.slice(o, o + n)].map((b) => b.toString(16).padStart(2, "0")).join(" ");
            const v = t === "s" ? String.fromCharCode(...bytes.slice(o, o + n)) : n === 4 ? dv.getUint32(o, true) : dv.getUint16(o, true);
            const bad = o === 32 && v !== nch * 2;
            return `<tr class="${bad ? "warn" : ""}"><td class="m">${o}</td><td class="m x">${hex}</td><td>${name}</td><td class="m">${t === "s" ? `"${v}"` : fmt(v)}${bad ? `（應為 ${nch * 2}）` : ""}</td></tr>`;
          }).join("");
          const dec = await new OfflineAudioContext(nch, 1, SR).decodeAudioData(ab.slice(0));
          if (my !== token || !ctx.active) return;
          const d = dec.getChannelData(0);
          let maxErr = 0, neg = 0, pos = 0;
          for (let i = 0; i < Math.min(d.length, s.length); i++) {
            const e = Math.abs(d[i] - s[i]);
            if (e > maxErr) maxErr = e;
            if (s[i] < -1) neg++; else if (s[i] >= 1) pos++;
          }
          const ratio = ab.byteLength / Math.max(1, codeLen);
          const lines = [
            `<div class="ok">✓ decodeAudioData 讀回 ${dec.numberOfChannels} 聲道、${fmt(dec.sampleRate)} Hz、${fmt(dec.length)} 個樣本（原始 ${fmt(s.length)}）</div>`,
            neg ? `<div class="bad">✗ ${fmt(neg)} 個樣本低於 -1：wav.js 只處理正向上限，負值寫進 Int16Array 時溢位翻轉，最大誤差 ${maxErr.toFixed(2)}</div>`
              : `<div class="ok">✓ 最大誤差 ${maxErr.toExponential(1)}，只剩 16 位元量化誤差（1 ÷ 32768 ≈ 3e-5）${pos ? `；${fmt(pos)} 個樣本 ≥ 1 被截在 32767` : ""}</div>`,
            `<div>程式碼 <span class="m">${fmt(codeLen)}</span> 字元 → WAV <span class="m">${fmt(ab.byteLength)}</span> 位元組，約 <span class="m">${fmt(ratio)}</span> 倍</div>`,
          ];
          check.innerHTML = lines.join("");
        }
        function drawWav() {
          const { g, w, h: hh } = sizeCanvas(wcv, wbox);
          g.clearRect(0, 0, w, hh);
          const peak = peakOf(s), top = 20, wh = hh - top - 6, amp = (wh / 2) * 0.92, mid = top + wh / 2;
          g.setLineDash([3, 4]); g.strokeStyle = "rgba(247,37,133,.5)"; g.lineWidth = 1;
          g.beginPath(); g.moveTo(0, mid - amp); g.lineTo(w, mid - amp); g.moveTo(0, mid + amp); g.lineTo(w, mid + amp); g.stroke();
          g.setLineDash([]);
          drawWave(g, s, 6, top, w - 12, wh, { hot: true });
          g.font = `11px ${CJK}`; g.fillStyle = "#9b998f"; g.textBaseline = "top";
          g.fillText(`${fmt(s.length)} 樣本・${(s.length / SR).toFixed(2)} 秒・峰值 ${peak.toFixed(2)}${peak > 1 ? "（紅色超出 ±1）" : ""}`, 8, 4, w - 16);
        }
        // Code length against WAV size for the preset library (WAV = 46-byte header + 2 bytes per sample).
        const LIB = PRESETS.map((p) => { const c = codeOf(round(full(p.p))); return { name: p.name, color: p.color, code: c.length, wav: 46 + 2 * Z.ZZFX.buildSamples(...silent(full(p.p))).length }; });
        function drawBars() {
          const { g, w, h: hh } = sizeCanvas(bcv, bbox);
          g.clearRect(0, 0, w, hh);
          g.font = `11px ${CJK}`; g.textBaseline = "middle"; g.fillStyle = "#9b998f";
          if (hh < 80) return;
          g.fillText("預設音效：程式碼字元數 vs 單聲道 WAV 位元組（對數刻度）", 4, 9, w - 8);
          const lx = 40, x0 = lx + 4, x1 = w - 70, top = 24, rh = (hh - top - 16) / LIB.length, L0 = 1, L1 = 6;
          const px = (v) => x0 + ((Math.log10(v) - L0) / (L1 - L0)) * (x1 - x0);
          for (let e = L0; e <= L1; e++) { g.fillStyle = "rgba(255,255,255,.07)"; g.fillRect(Math.round(px(10 ** e)), top, 1, rh * LIB.length); }
          LIB.forEach((it2, k) => {
            const y = top + k * rh, bh = Math.max(2, Math.min(7, rh / 2 - 2));
            g.fillStyle = "#d8d6cf"; g.fillText(it2.name, 4, y + rh / 2, lx - 6);
            g.fillStyle = "#7bd389"; g.fillRect(x0, y + rh / 2 - bh - 1, px(it2.code) - x0, bh);
            g.fillStyle = "#4cc9f0"; g.fillRect(x0, y + rh / 2 + 1, px(it2.wav) - x0, bh);
            g.fillStyle = "#9b998f"; g.font = `10.5px ${MONO}`;
            g.fillText(`${it2.code} / ${fmtCompact(it2.wav)}`, px(it2.wav) + 4, y + rh / 2, w - px(it2.wav) - 6);
            g.font = `11px ${CJK}`;
          });
          g.fillStyle = "#77756d"; g.font = `10px ${MONO}`; g.textAlign = "center";
          ["10", "100", "1k", "10k", "100k", "1M"].forEach((t, e) => g.fillText(t, px(10 ** (e + 1)), hh - 6));
          g.textAlign = "left";
        }
        watch(ctx, wbox, drawWav);
        watch(ctx, bbox, drawBars);
        update();
      },
    },
    {
      id: "stress", title: "極限測試", kind: "stress",
      api: "ctx.bench・ZZFX.buildSamples(...params) × N",
      desc: "每一輪用 7 類音效規則準備 N 組隨機參數，計時把它們全部合成成 Float32Array（只算樣本、不播放），N 從 10 加到 8,000。右側是最新一輪前 40 個音效的波形牆，以及三種測試組合的耗時對數圖。",
      hint: "先選測試組合，再按「開始測試」",
      async mount(ctx) {
        const Z = await boot(ctx);
        ctx.html(`<div class="zz-bv"><div class="zz-bvin"><canvas></canvas></div></div>`);
        const bx = ctx.$(".zz-bvin"), cv = bx.firstElementChild;
        const MODES = [
          { name: "一般音效", color: "#4cc9f0", tweak: (o) => o },
          { name: "效果全開", color: "#f72585", tweak: (o) => ({ ...o, filter: chance(.5) ? -1200 : 600, bitCrush: .2, delay: .08, modulation: 6, repeatTime: .07, tremolo: .4 }) },
          { name: "長音 1 秒", color: "#7bd389", tweak: (o) => ({ ...o, sustain: 1 }) },
        ];
        const SIZES = [10, 30, 100, 300, 1000, 2000, 4000, 8000];
        let mode = 0, hist = [[], [], []], last = null, preview = [];
        const gen = (m, n) => Array.from({ length: n }, () => { const c = Math.floor(Math.random() * CATS.length); return { c, p: round(mk(MODES[m].tweak(CATS[c].gen()))) }; });
        const makePreview = () => { preview = gen(mode, 40).map((x) => ({ c: x.c, s: Z.ZZFX.buildSamples(...x.p) })); };
        ctx.controls.classList.add("bottom");
        ctx.group(MODES.map((m) => m.name), 0, (i) => { mode = i; makePreview(); paint(); });
        ctx.bench({
          label: "音效數量", unit: "個", sizes: SIZES, target: 1000, budget: 2000,
          prepare: (n) => ({ mode, list: gen(mode, n) }),
          run(n, d) {
            const t0 = performance.now(), thumbs = [];
            let total = 0;
            for (let k = 0; k < n; k++) {
              const s = Z.ZZFX.buildSamples(...d.list[k].p);
              total += s.length;
              if (k < 40) thumbs.push({ c: d.list[k].c, s });
            }
            const ms = performance.now() - t0, H = hist[d.mode];
            hist = hist.map((x, j) => (j === d.mode ? [...(H.length && n <= H[H.length - 1].n ? [] : H), { n, ms, total }] : x));
            last = { n, ms, total, thumbs, mode: d.mode };
            ctx.timeout(paint, 0);
          },
          note: "只量 buildSamples() 的合成時間，播放（建立 AudioBuffer 與排程）不在計時內。樣本數 = (起音 + 衰減 + 持續 + 釋放 + 延遲) × 44,100，每個樣本都跑一次波形、包絡、濾波運算，所以耗時大致和總樣本數成正比：「長音 1 秒」直接拉長每個音，「效果全開」加上濾波、位元粉碎、延遲、調變與震音。單輪超過 2 秒就停止加碼。",
        });
        function drawStats(g, X, Y, W) {
          const r = last, col = MODES[r ? r.mode : mode].color;
          const items = r
            ? [["每個音效", fmtMs(r.ms / r.n)], ["每秒合成樣本", fmtCompact(r.total / (r.ms / 1000))], ["比即時播放快", `×${fmt(r.total / SR / (r.ms / 1000))}`], ["一幀 16.7 ms 可合成", `${fmt(Math.floor(16.7 / (r.ms / r.n)))} 個`]]
            : [["每個音效", "…"], ["每秒合成樣本", "…"], ["比即時播放快", "…"], ["一幀 16.7 ms 可合成", "…"]];
          const cols = W >= 520 ? 4 : 2, bw = (W - (cols - 1) * 8) / cols, bh = 46;
          items.forEach(([k, v], i) => {
            const x = X + (i % cols) * (bw + 8), y = Y + Math.floor(i / cols) * (bh + 6);
            g.fillStyle = "rgba(255,255,255,.05)"; g.beginPath(); g.roundRect(x, y, bw, bh, 8); g.fill();
            g.textBaseline = "top"; g.fillStyle = "#9b998f"; g.font = `11px ${CJK}`; g.fillText(k, x + 10, y + 7, bw - 20);
            g.fillStyle = col; g.font = `700 17px ${MONO}`; g.fillText(v, x + 10, y + 22, bw - 20);
          });
          return Math.ceil(items.length / cols) * (bh + 6);
        }
        function drawWall(g, X, Y, W, H) {
          const th = last ? last.thumbs : preview;
          g.font = `11px ${CJK}`; g.fillStyle = "#9b998f"; g.textBaseline = "top";
          g.fillText(last ? `最新一輪（${fmt(last.n)} 個，${MODES[last.mode].name}）的前 ${th.length} 個` : `預覽：${MODES[mode].name}隨機 40 個`, X, Y, W);
          const top = Y + 18, HH = H - 18;
          if (!th.length || HH < 20) return;
          const cols = Math.max(4, Math.round(Math.sqrt((th.length * W) / HH))), rows = Math.ceil(th.length / cols), cw = W / cols, chh = HH / rows;
          th.forEach((t, k) => {
            const x = X + (k % cols) * cw, y = top + Math.floor(k / cols) * chh;
            g.fillStyle = "#0d1015"; g.fillRect(x + 1, y + 1, cw - 3, chh - 3);
            drawWave(g, t.s, x + 3, y + 3, cw - 7, chh - 7, { color: CATS[t.c].color });
          });
        }
        function drawChart(g, X, Y, W, H) {
          g.font = `11px ${CJK}`; g.textBaseline = "middle";
          let lx = X, ly = Y + 6;
          for (const m of MODES) {
            const tw = g.measureText(m.name).width + 24;
            if (lx + tw > X + W) { lx = X; ly += 16; }
            g.fillStyle = m.color; g.fillRect(lx, ly - 4, 10, 8);
            g.fillStyle = "#d8d6cf"; g.fillText(m.name, lx + 14, ly);
            lx += tw;
          }
          const top = ly + 14, all = hist.flat();
          let lo = Math.floor(Math.log10(Math.max(0.01, Math.min(1, ...all.map((r) => r.ms))))), hi = Math.ceil(Math.log10(Math.max(2000, ...all.map((r) => r.ms))));
          const x0 = X + 50, x1 = X + W - 10, y0 = Y + H - 18, y1 = top + 4;
          if (y0 - y1 < 30) return;
          const Lx0 = Math.log10(SIZES[0]), Lx1 = Math.log10(SIZES[SIZES.length - 1]);
          const px = (n) => x0 + ((Math.log10(n) - Lx0) / (Lx1 - Lx0)) * (x1 - x0);
          const py = (ms) => y0 - ((Math.log10(Math.max(0.01, ms)) - lo) / (hi - lo)) * (y0 - y1);
          g.textAlign = "right";
          const every = Math.max(1, Math.ceil(14 / ((y0 - y1) / (hi - lo))));
          for (let e = lo; e <= hi; e++) {
            const y = py(10 ** e);
            g.fillStyle = "rgba(255,255,255,.08)"; g.fillRect(x0, Math.round(y), x1 - x0, 1);
            if ((e - lo) % every === 0) { g.fillStyle = "#77756d"; g.fillText(fmtMs(10 ** e), x0 - 6, y); }
          }
          g.textAlign = "center";
          SIZES.forEach((n, k) => { if (k % ((x1 - x0) / SIZES.length < 40 ? 2 : 1) === 0) { g.fillStyle = "#77756d"; g.fillText(fmtCompact(n), px(n), y0 + 11); } });
          g.textAlign = "left";
          for (const [ms, t] of [[1000, "1 秒"], [16.7, "一幀 16.7 ms"]]) {
            const y = py(ms);
            g.strokeStyle = "rgba(247,223,30,.45)"; g.setLineDash([5, 4]); g.lineWidth = 1;
            g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke(); g.setLineDash([]);
            g.fillStyle = "rgba(247,223,30,.8)"; g.fillText(t, x0 + 4, y - 8);
          }
          hist.forEach((H, j) => {
            if (!H.length) return;
            g.strokeStyle = MODES[j].color; g.fillStyle = MODES[j].color; g.lineWidth = 2;
            g.beginPath(); H.forEach((r, k) => (k ? g.lineTo(px(r.n), py(r.ms)) : g.moveTo(px(r.n), py(r.ms)))); g.stroke();
            for (const r of H) { g.beginPath(); g.arc(px(r.n), py(r.ms), 2.5, 0, Math.PI * 2); g.fill(); }
          });
        }
        function paint() {
          const { g, w: fullW, h: hh } = sizeCanvas(cv, bx);
          g.clearRect(0, 0, fullW, hh);
          // on mid-size stages the bench panel overlaps the left side; draw in the uncovered part
          const lab = ctx.$(".sc-lab");
          let ox = 0;
          if (lab && !lab.classList.contains("min")) {
            const cover = lab.getBoundingClientRect().right - bx.getBoundingClientRect().left + 8;
            if (cover > 0 && fullW - cover >= 230) ox = cover;
          }
          g.save();
          g.translate(ox, 0);
          const w = fullW - ox, sh = drawStats(g, 12, 12, w - 24) + 18;
          if (w >= 560 && w > hh) {
            const ww = Math.round((w - 36) * 0.42);
            drawWall(g, 12, sh, ww, hh - sh - 12);
            drawChart(g, ww + 30, sh, w - ww - 42, hh - sh - 8);
          } else if (hh - sh < 230) {
            drawChart(g, 12, sh, w - 24, hh - sh - 8); // too short for both: the chart matters more
          } else {
            const wallH = Math.max(70, Math.min(170, (hh - sh) * 0.38));
            drawWall(g, 12, sh, w - 24, wallH);
            drawChart(g, 12, sh + wallH + 12, w - 24, hh - sh - wallH - 20);
          }
          g.restore();
        }
        makePreview();
        watch(ctx, bx, paint);
        const lab = ctx.$(".sc-lab");
        if (lab) watch(ctx, lab, paint);
        paint();
      },
    },
  ],
});
</script>
</body>
</html>
