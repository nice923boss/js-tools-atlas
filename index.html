<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS 工具圖鑑：328 個 JavaScript 工具與線上示範</title>
<meta name="description" content="整理 27 大類、328 個可搭配 Claude 產生網頁作品的 JavaScript 工具，單檔可執行的工具都附線上互動示範、原始碼與提示詞。">
<meta property="og:title" content="JS 工具圖鑑">
<meta property="og:description" content="328 個 JavaScript 工具，邊看清單邊看示範。">
<meta name="theme-color" content="#0e1013">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f7df1e'/%3E%3Ctext x='17' y='26' font-family='Arial' font-weight='700' font-size='15' fill='%231a1a14'%3EJS%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="assets/app.css">
<script>
  // Apply saved theme before first paint to avoid a flash.
  try {
    const t = localStorage.getItem("atlas-theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch (e) { /* storage blocked: follow system theme */ }
</script>
</head>
<body>
<a class="skip" href="#list">跳到工具清單</a>

<header class="topbar">
  <a class="brand" href="#/" aria-label="JS 工具圖鑑首頁">
    <span class="logo">JS</span>
    <span class="brand-text"><b>JS 工具圖鑑</b><small>JavaScript Tools Atlas</small></span>
  </a>
  <nav class="tabs" aria-label="主選單">
    <a href="#/" data-view="tools">工具清單</a>
    <a href="#/recipes" data-view="recipes">組合配方</a>
    <a href="#/platforms" data-view="platforms">靈感平台</a>
    <a href="#/stats" data-view="stats">分類統計</a>
    <a href="#/about" data-view="about">說明</a>
  </nav>
  <div class="top-actions">
    <a class="icon-btn" href="assets/js-tools-list.xlsx" download="JS工具功能清單.xlsx" title="下載 Excel 原始清單" aria-label="下載 Excel 原始清單" data-icon="download"></a>
    <button class="icon-btn" id="theme-toggle" type="button" title="切換深淺色" aria-label="切換深淺色" data-icon="contrast"></button>
    <a class="icon-btn" href="https://github.com/nice923boss/js-tools-atlas" target="_blank" rel="noopener" title="GitHub 原始碼" aria-label="GitHub 原始碼" data-icon="github"></a>
  </div>
</header>

<main id="main">
  <!-- Tools view -->
  <section class="view" id="view-tools" data-view="tools">
    <div class="hero">
      <div class="hero-copy">
        <p class="eyebrow">27 大類・328 個工具・資料日期 2026-10-01</p>
        <h1>挑一個 JS 工具，<br class="br-wide">直接看它跑起來。</h1>
        <p class="lede">整理可搭配 Claude 產生網頁作品的 JavaScript 函式庫。單檔 HTML 就能執行的工具都附上真實載入函式庫的互動示範，旁邊就是原始碼與可直接複製的提示詞。</p>
      </div>
      <dl class="hero-stats" id="hero-stats"></dl>
    </div>

    <div class="workspace">
      <aside class="rail" aria-label="分類">
        <div class="rail-head">分類</div>
        <ul id="cat-list"></ul>
      </aside>

      <div class="listcol">
        <div class="toolbar" role="search">
          <label class="search">
            <span data-icon="search"></span>
            <input id="q" type="search" placeholder="搜尋名稱、功能、效果、框架" autocomplete="off" aria-label="搜尋工具">
            <kbd>/</kbd>
          </label>
          <div class="filters">
            <select id="cat-select" class="select cat-select" aria-label="分類"></select>
            <div class="chipset" data-filter="level" aria-label="難度">
              <button type="button" data-v="入門">入門</button>
              <button type="button" data-v="中階">中階</button>
              <button type="button" data-v="進階">進階</button>
            </div>
            <div class="chipset" data-filter="friendly" aria-label="Claude 單檔友善度">
              <button type="button" data-v="3" title="一個 HTML 檔加 CDN 即可執行">★★★</button>
              <button type="button" data-v="2" title="需要 npm 建置或特定框架">★★</button>
              <button type="button" data-v="1" title="需要 API 金鑰、帳號、付費或後端">★</button>
            </div>
            <label class="switch"><input type="checkbox" id="only-demo"><span></span>只看有示範</label>
          </div>
          <div class="toolbar-row">
            <span class="count" id="count" aria-live="polite"></span>
            <div class="toolbar-right">
              <select id="sort" class="select" aria-label="排序">
                <option value="id">依編號</option>
                <option value="stars">GitHub 星數</option>
                <option value="updated">最近更新</option>
                <option value="name">名稱</option>
              </select>
              <div class="seg" role="group" aria-label="檢視方式">
                <button type="button" data-layout="list" aria-pressed="true" title="清單" data-icon="rows"></button>
                <button type="button" data-layout="table" aria-pressed="false" title="表格" data-icon="table"></button>
              </div>
            </div>
          </div>
        </div>
        <div id="list" class="list" tabindex="-1"></div>
      </div>

      <aside class="stage" id="stage" aria-label="示範台"></aside>
    </div>
  </section>

  <section class="view page" id="view-recipes" data-view="recipes" hidden></section>
  <section class="view page" id="view-platforms" data-view="platforms" hidden></section>
  <section class="view page" id="view-stats" data-view="stats" hidden></section>
  <section class="view page" id="view-about" data-view="about" hidden></section>
</main>

<footer class="footer">
  <span>資料整理日期 2026-10-01・示範頁皆從公開 CDN 載入函式庫・授權與星數僅供參考</span>
  <span class="credit">製作者：黃政文</span>
</footer>

<dialog id="source-dialog" class="source-dialog" aria-label="示範原始碼">
  <div class="source-head">
    <strong id="source-title"></strong>
    <div class="source-actions">
      <button type="button" class="btn" id="source-copy"><span data-icon="copy"></span>複製</button>
      <button type="button" class="icon-btn" id="source-close" aria-label="關閉" data-icon="x"></button>
    </div>
  </div>
  <pre class="source-body"><code id="source-code" class="language-html"></code></pre>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script type="module" src="assets/app.js"></script>
</body>
</html>
